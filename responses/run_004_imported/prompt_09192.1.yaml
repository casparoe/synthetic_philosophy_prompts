prompt: |-
  I'm a poli theory PhD student and this semester's seminar on medieval political thought spent two whole sessions on Aquinas's writings on tyrannicide, which turns out to be way messier than the "aquinas thought killing tyrants was sometimes fine" one-liner you get in undergrad. If I'm remembering the seminar discussion right, in his commentary on the Sentences he splits tyrants into two kinds: a tyrant "by defect of title" (a straight-up usurper with no legitimate claim to rule at all) versus a tyrant "by way of exercise" (someone who holds power legitimately but abuses it once in office). For the first kind, he seems fine with a private citizen killing the guy if there's no superior around to appeal to — he even cites Ehud assassinating Eglon in Judges as a praiseworthy example. For the second kind though, private individuals are NOT supposed to take matters into their own hands; it has to go through the community or some higher public authority. Then in De Regimine Principum he gets even more skittish about tyrannicide in general, warning that if you let private people decide for themselves when a ruler is "tyrant enough" to kill, ambitious men will just assassinate perfectly decent kings under that pretext, so mostly his advice is: endure it, pray, and wait for the legitimate authority (or God) to sort it out.

  What me and my study group can't agree on is how this framework would handle a case Aquinas obviously never had in mind: a president who wins a genuinely free election (so, clean title, zero usurpation by his lights) and then, once installed, hollows out the courts, jails independent journalists, and cancels the next election to stay in power indefinitely — with no pope or emperor above him to appeal to, and with the domestic bodies that would normally count as "the public authority" (courts, legislature, electoral commission) already captured by him. Based on the actual reasoning Aquinas gives rather than the pop-summary version: would he really be committed to saying this guy is still just a "tyrant by exercise," so that no private person — not a lone assassin, not a general plotting a coup, not a foreign government — may licitly move against him on their own initiative? Or does converting a legitimate title into something you keep only through ongoing fraud and coercion push him back into "defect of title" territory in Aquinas's eyes? And seperately, does Aquinas's own idea that "the community" can depose a ruler it originally appointed give any principled room for something like a mass popular uprising, as opposed to a single private actor, even once the formal institutions are gone? I'd like an actual reconstruction of how his categories and reasons bear on this, not just an "Aquinas allowed some resistance to tyranny" gloss.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in Political Theory.
      *   **Context:** Seminar on Medieval Political Thought, specifically focusing on Aquinas's views on tyrannicide.
      *   **Current Understanding:** The user has a sophisticated grasp of the primary texts (*Commentary on the Sentences*, *De Regimine Principum*). They know the distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (abuser of legitimate power). They know the shift in tone between the texts (more permissive in *Sentences*, more cautious in *De Regimine*).
      *   **The Problem:** Applying this medieval framework to a modern scenario: a democratically elected leader who subverts democracy from within (autocratization), capturing institutions, with no higher secular or ecclesiastical authority to appeal to.
      *   **The Questions:**
          1.  Does subverting the election/title *ex post facto* convert a "tyrant by exercise" into a "tyrant by defect of title"?
          2.  Does Aquinas's allowance for "the community" to depose a ruler allow for mass popular uprising when formal institutions are captured?
          3.  What about foreign intervention or military coups?
      *   **Constraint:** No pop-summary gloss. Needs actual reconstruction of categories and reasoning. Needs to respect the textual nuance.

  2.  **Deconstruct Aquinas's Textual Evidence:**
      *   *Commentary on the Sentences (II Sent., d. 44, q. 2, a. 2):*
          *   Distinction: Usurper vs. Abuser.
          *   Usurper: Can be killed by anyone if no superior exists (Ehud/Eglon example).
          *   Abuser: Cannot be killed by private authority. Must be public authority.
          *   Reasoning: Order vs. Disorder. Private killing leads to greater tyranny or chaos.
      *   *De Regimine Principum (On Kingship):*
          *   More cautious. Warns against the *pretext* of tyrannicide.
          *   Emphasizes patience, prayer, and divine intervention.
          *   Crucially (Book I, Ch. 6): If the king is appointed by the multitude, the multitude can depose him.
          *   Crucially (Book I, Ch. 7): If there is a superior authority (like the Emperor over a king, or Pope over both), appeal to them.
      *   *Summa Theologiae (II-II, q. 42, a. 2; q. 64, a. 3):*
          *   Sedition is a mortal sin.
          *   Killing is only licit by public authority.
          *   However, resisting a tyrant who seized power violently is not sedition (II-II, q. 42, a. 2, ad 3).

  3.  **Address Question 1: Defect of Title vs. Exercise (The "Autocrat" Problem)**
      *   *Standard View:* Elected = Title. Subversion = Exercise.
      *   *Nuanced View:* Aquinas cares about the *source* of legitimacy. For Aquinas, legitimacy isn't just "won the vote." It's about ruling for the *common good* according to law.
      *   *The Twist:* If the ruler cancels the next election, have they voided their own title?
      *   *Textual Hook:* In *De Regimine*, Aquinas says if a ruler rules for his own good, not the common good, it is tyranny. But does that void the *title*?
      *   *Analysis:* Usually, *defectus tituli* is about initial acquisition (simony, force, inheritance law). *Exercitii* is about usage.
      *   *Application:* The modern autocrat likely remains a *tyrannus ex parte exercitii* in strict Thomistic terms because the initial acquisition was valid. However, by destroying the mechanism of accountability (elections), they effectively usurp the *continuing* consent.
      *   *Verdict:* Aquinas would likely still classify him as *ex parte exercitii* initially, *but* the destruction of the legal order might shift the "public authority" question. If the law is nullified, is the title still valid? Aquinas ties law to reason/common good. A law against the common good is "no law" (ST I-II, q. 95). If the *basis* of the title (the electoral law) is voided by the tyrant, does the title collapse? This is the strongest argument for reclassifying him as *ex defectu tituli* regarding his *continued* rule.

  4.  **Address Question 2: The Community vs. Formal Institutions**
      *   *Text:* *De Regimine Principum* I.6: "If it belongs to the multitude to provide a king... it is not unjust for the multitude to depose him."
      *   *Problem:* The user specifies institutions (courts, legislature) are captured.
      *   *Aquinas's Ontology of the Community:* The "multitude" (*multitudo*) is not just the institutions. It is the corporate body.
      *   *Constraint:* Aquinas hates private initiative. He fears sedition (*ST* II-II, q. 42).
      *   *Resolution:* A *mass* uprising might be distinguished from a *private* assassination. If the "multitude" acts as a corporate whole, it mimics public authority.
      *   *Caveat:* Aquinas is deeply skeptical of this leading to good outcomes (*De Regimine* I.7). He warns that deposing a tyrant often leads to worse tyranny. He prefers a "public authority" (like an Emperor or Pope) to do it.
      *   *Modern Translation:* Without a Pope/Emperor, does the "multitude" regain the latent authority they delegated? Yes, theoretically, per *De Regimine* I.6. But the bar for "licit" action is high to avoid sedition.

  5.  **Address Question 3: Foreign Intervention / Military Coups**
      *   *Foreign:* Aquinas recognizes a hierarchy of authority (King < Emperor < Pope). In a modern Westphalian system, there is no "superior." Aquinas would likely view foreign intervention as illicit unless authorized by a higher universal authority (which doesn't exist now). He generally opposes external interference unless it's a "just war" scenario, but tyranny itself isn't always a *casus belli* for neighbors in his work.
      *   *Military:* A general is a private individual relative to the king, unless the army counts as a "public institution." If the army is part of the state's public authority, does it retain its mandate? Aquinas is tricky here. He generally subordinates military to political rule. A coup is usually sedition.

  6.  **Synthesize and Structure the Argument:**
      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the *Sentences* vs. *De Regimine* tension.
      *   **Point 1: The Classification Problem (Title vs. Exercise).**
          *   Argue that strictly speaking, Aquinas sees title as initial acquisition. So, initially *exercitii*.
          *   *However*, introduce the concept of *lex iniusta non est lex*. If the ruler voids the legal basis of his own rule, he effectively becomes a usurper of the *ongoing* office. This is the "constructive usurpation" argument.
      *   **Point 2: The "Public Authority" Problem (Institutions vs. Multitude).**
          *   Focus on *De Regimine* I.6. The authority resides ultimately in the community.
          *   Distinguish between "private individual" (assassin) and "corporate multitude" (uprising).
          *   Aquinas allows the latter *if* they originally appointed the king.
          *   *Crucial Caveat:* The prudential warning in I.7. Even if *licit*, is it *expedient*? Aquinas leans toward endurance unless the tyranny is extreme and the risk of chaos is low.
      *   **Point 3: The Vacuum of Superior Authority.**
          *   Address the "no Pope/Emperor" issue.
          *   This collapses the hierarchy back to the community.
          *   Foreign intervention is hard to justify in Thomistic terms without a superior authority to authorize it.
      *   **Conclusion:** Summarize the tension. Aquinas provides a warrant for resistance by the *community* (not individuals) but wraps it in heavy prudential caution. The modern autocrat likely falls into a hybrid category where the voiding of law makes the title defective, empowering the multitude, but the risk of sedition remains a moral hazard.

  7.  **Refine the Tone:**
      *   Ensure it sounds like peer-to-peer academic discourse.
      *   Use Latin terms correctly (*tyrannus ex defectu tituli*, *ex parte exercitii*, *sedition*, *multitudo*).
      *   Cite specific passages (Sentences, De Regimine, ST).
      *   Avoid anachronism while making the application clear. (e.g., Acknowledge Aquinas didn't know "presidents," but talk about "rulers appointed by multitude").

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did Aquinas actually say Ehud was praiseworthy? Yes, in *II Sent.*, d. 44, q. 2, a. 2.
      *   *Check:* Does *De Regimine* contradict *Sentences*? It's more cautious, emphasizing the danger of the remedy being worse than the disease.
      *   *Check:* Is "canceling the election" enough to void title? In medieval terms, kingship was often hereditary or anointed. The "elective" aspect is more relevant to *De Regimine*'s specific discussion of kings chosen by the multitude. I need to lean heavily on *De Regimine* I.6 for the "appointed by multitude" angle.
      *   *Check:* What about the "private citizen" ban? This is the hardest hurdle. Aquinas is very clear: private killing is murder. The only way out is if the actor is no longer "private" but acting as the "public." Hence the emphasis on the *multitudo* acting corporately.

  9.  **Final Polish:** Ensure the distinction between *licit* (moral permission) and *expedient* (prudential wisdom) is clear, as Aquinas cares about both. (Proceed to generate output).

  *(Self-Correction during final review)*: I need to make sure I don't give a definitive "Yes, Aquinas would say X." Instead, I should present the *tension* in his thought. The prompt asks for a reconstruction of how his categories bear on this. I should highlight where his framework strains. Specifically, the lack of a "superior" in the modern state is a major structural difference from his hierarchical worldview. I need to emphasize that for Aquinas, the "public authority" is usually a *person* or *office* above the tyrant, not just "the people." The move to "the people" is a specific concession in *De Regimine* that needs careful handling.

