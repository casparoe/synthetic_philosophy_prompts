answer: |-
  This is an excellent question that cuts right to the tension between Aquinas's moral absolutism regarding order and his conditional permissions for resistance. You are right to flag the divergence between the *Commentary on the Sentences* (where he is more permissive regarding usurpers) and *De Regimine Principum* (where he is deeply prudential and cautious).

  To reconstruct how Aquinas would handle your modern "autocrat" scenario, we have to avoid importing modern constitutionalism into his ontology of law and authority. We need to look at how he defines the *source* of legitimacy, the nature of the *public person*, and the moral hazard of sedition.

  Here is a reconstruction of the Thomistic framework applied to your case, broken down by the specific conceptual hurdles you raised.

  ### 1. Defect of Title vs. Defect of Exercise: The "Constructive Usurpation" Problem

  Your study group's core question is whether voiding the mechanism of one's own tenure (canceling the election) converts a *tyrannus ex parte exercitii* into a *tyrannus ex defectu tituli*.

  **The Strict Textual Reading:**
  In *II Sent.*, d. 44, q. 2, a. 2, Aquinas defines *defectus tituli* primarily as a defect in *acquisition* (violence, simony, or lack of canonical/electoral form at the moment of investiture). If the president won the initial election freely, Aquinas would technically classify him as a legitimate ruler who subsequently became a tyrant *ex parte exercitii*. For Aquinas, the "title" is the ontological status of the officeholder. Once anointed or elected, that character is imprinted. Abuse of power corrupts the *use* of the office, not necessarily the *possession* of it.

  **The Nuanced Reconstruction:**
  However, Aquinas's theory of law (*ST* I-II, q. 95, a. 2) complicates this. Human law is only law insofar as it accords with right reason and the common good. If a ruler sustains his power solely through fraud and coercion after the legal term has expired, he is no longer ruling according to law.

  In *De Regimine Principum* (I.3), Aquinas argues that a king becomes a tyrant when he seeks his own good rather than the common good. If the "title" is contingent upon ruling for the common good (which is the teleological justification for monarchy in Aquinas), then a ruler who systematically destroys the common good to maintain power effectively voids the moral basis of his title.

  **Verdict:** Aquinas would likely struggle here. He would probably maintain the *formal* classification of *ex parte exercitii* (because the initial election was valid), **BUT** he might argue that by destroying the legal order that granted him power, the tyrant has effectively *abdicated* his role as a public person. He becomes a private aggressor (*privatus aggressor*). This is the critical pivot: if he is no longer a "public authority" but a private criminal using state resources, the prohibition on private killing (*ST* II-II, q. 64, a. 3) might loosen, because you are not killing a "ruler," you are killing a bandit. However, Aquinas is generally reluctant to let individuals make that judgment call, fearing the remedy is worse than the disease.

  ### 2. The "Public Authority" Problem: Institutions vs. The Multitude

  This is the strongest point of leverage in your scenario. You note that the courts and legislature are captured. In Aquinas's time, "public authority" usually meant a superior feudal lord, an Emperor, or the Pope. In *De Regimine* (I.7), he explicitly says if there is a superior, appeal to them.

  But what if there is no superior?

  **The *De Regimine* Exception (I.6):**
  Aquinas writes: *"If it belongs to the multitude to provide a king... it is not unjust for the multitude to depose him, or to restrict his power."*
  This is the key text for your "mass popular uprising" question. Aquinas distinguishes between **sedition** (a private faction disrupting the unity of the multitude) and **deposition by the multitude** (the corporate body reclaiming its delegated authority).

  **Application to Captured Institutions:**
  For Aquinas, the "public authority" is not identical to the *institutions* (courts, parliament); it resides ultimately in the *corpus mysticum* of the community. If the institutions are captured, they cease to function as the "public authority" and become instruments of the tyrant.
  *   **Private Assassin:** Licit? **No.** Even in the *Sentences*, Aquinas restricts private killing to the *usurper* (*defectus tituli*). If your autocrat is technically *ex parte exercitii*, a lone assassin commits murder and sedition (*ST* II-II, q. 42, a. 2).
  *   **Mass Uprising:** Licit? **Potentially.** If the "multitude" acts not as a mob, but as the corporate body that originally delegated the power, they are exercising a residual public authority. Aquinas allows the community to act as a collective "superior" to the king they appointed.

  **The Prudential Check (*De Regimine* I.7):**
  Here is where Aquinas slams the brakes. Even if the multitude *has the right* to depose the tyrant, Aquinas warns that doing so often leads to greater tyranny. He argues that deposing a tyrant creates factionalism, and the new leaders often become tyrants themselves to secure their position.
  So, while the *multitude* has the *jurisdictional capacity* to act when institutions fail, Aquinas would demand a very high bar of **prudential certainty**:
  1.  The tyranny must be extreme (not just policy disagreements).
  2.  The uprising must be truly corporate (not a faction).
  3.  There must be a reasonable hope of establishing a better regime, not just chaos.

  ### 3. The Problem of the "Superior" (Foreign/Military Intervention)

  You asked about generals or foreign governments.

  **Foreign Governments:**
  Aquinas operates within a hierarchical cosmology (King < Emperor < Pope < God). In *De Regimine*, he relies on the Emperor or Pope to depose a tyrant if the local community cannot. In a Westphalian system of sovereign states, there is no "superior."
  *   **Thomistic View:** A foreign king intervening in another kingdom without a higher mandate is essentially engaging in aggression. Unless the tyranny constitutes a violation of natural law so severe it becomes a *casus belli* (e.g., mass slaughter of innocents, which violates the natural law preservation of life), foreign intervention is likely illicit. It violates the order of peace between realms. Aquinas prioritizes order; international war to fix domestic tyranny is usually more disorderly than the tyranny itself.

  **The Military (The General):**
  Is a general a "private person" or "public authority"?
  *   In Aquinas's view, the military is an instrument of the ruler. A coup d'état is typically sedition because it fractures the unity of the state.
  *   However, if the army is viewed as an institution of the *realm* (defending the *res publica*) rather than the *person* of the king, and the king has become an enemy of the *res publica*, the general might argue he is acting on behalf of the "community."
  *   **Risk:** Aquinas would be deeply suspicious of this. In *ST* II-II, q. 42, he defines sedition as opposing the unity of the multitude. A military coup almost always fractures that unity. Unless the military acts as the proxy for the "multitude" (see above), Aquinas would likely condemn a coup as illicit sedition, regardless of the tyrant's abuses.

  ### 4. Synthesis: The Thomistic Verdict on the Modern Autocrat

  If we reconstruct Aquinas's reasoning without the undergrad gloss, the verdict is uncomfortable for modern liberals but more nuanced than "submit to tyranny."

  1.  **Classification:** The autocrat is likely still a *tyrannus ex parte exercitii* formally, because the initial title was valid. However, by voiding the legal basis of his continuation, he creates a *de facto* defect of title regarding his *continued* rule.
  2.  **Private Violence:** A lone assassin is **not licit**. Aquinas is consistent that private individuals cannot execute public judgment, even on tyrants, unless it is a clear-cut usurper (*defectus tituli*) with no shadow of legitimacy. The initial election gives enough "shadow" to prohibit private murder.
  3.  **Popular Resistance:** This is the only licit path. Because the ruler was appointed by the multitude (*De Regimine* I.6), the authority reverts to the multitude when the ruler destroys the common good. The "captured institutions" do not bind the multitude, because the institutions are subordinate to the health of the *res publica*.
      *   *Condition:* It must be a corporate act of the community, not a faction.
      *   *Condition:* It must be a last resort (endurance is preferred if the tyranny is bearable).
  4.  **The "No Superior" Problem:** The lack of a Pope/Emperor forces the authority back to the source: the people. Aquinas's hierarchy collapses into a proto-popular sovereignty in the absence of a higher temporal judge.

  **The Catch:**
  Aquinas's primary concern is not "justice" in the abstract, but **salvation and order**. In *De Regimine* I.7, he explicitly says it is better to endure a mild tyranny than to risk a civil war that destroys the social fabric and leads to worse tyranny.
  So, while he provides a **theoretical warrant** for the multitude to depose the autocrat when institutions fail, he would likely counsel **extreme caution**, warning that the "ambitious men" he mentions in *De Regimine* will use the uprising to seize power themselves.

  **Summary for your seminar:**
  Aquinas does not give you a "right to revolution" in the Lockean sense. He gives you a **corporate emergency power** that resides in the multitude when the ruler voids the common good, but he wraps it in such heavy prudential restrictions (fear of sedition, fear of worse tyranny) that he would likely condemn a military coup or foreign intervention, permit a mass popular deposition only as a absolute last resort, and forbid private assassination entirely. The "trap" of the modern autocrat is that he keeps just enough formal legitimacy (the initial election) to trigger Aquinas's ban on private killing, while destroying the institutions Aquinas hoped would check him. Aquinas's only way out is the *multitudo* acting as a corporate whole—a dangerous and messy category he himself feared.
