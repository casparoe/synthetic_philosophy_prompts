answer: |-
  1. **The Grafen Gap**
  Zahavi's original verbal intuition was that signals must be "wasteful" to be honest. But Alan Grafen's game-theoretic vindication didn't just require cost; it required the *differential-cost condition*—specifically, that the marginal cost of signaling must decrease as the signaler's quality rises. Zahavi's own writing never specified this mathematical constraint. When you apply the Handicap Principle to human philanthropy or status display, do you verify that marginal costs actually decline for high-quality individuals, or do you rely on the looser, pre-Grafen intuition that "burning resources" is sufficient for honesty?

  *   **Follow-up:** If she argues that "burning resources" is sufficient: Grafen showed that if marginal costs are linear or increasing with quality, the honest signaling equilibrium collapses. If you can't demonstrate that differential cost structure in human social spending, aren't you effectively using a mathematically refuted version of the theory?

  2. **Handicap vs. Index**
  There is a rigorous distinction in signaling theory between a *handicap* (which is costly but theoretically fakeable) and an *index* (which is physically impossible to fake, like a stag's roar pitch being tied to larynx size). Many human status markers, like deep vocal tones or even certain displays of confidence, look more like indices than handicaps. How do you empirically distinguish a genuine Zahavian handicap from a mere index signal in human behavior, given that both result in honest communication?

  *   **Follow-up:** If she claims indices are just "costly to develop": An index is honest due to a physical constraint, not a strategic cost trade-off. If you categorize physical constraints as handicaps, does the term "handicap" retain any explanatory power distinct from "mechanical limitation"?

  3. **The Sir Philip Sidney Equilibrium**
  In the Sir Philip Sidney game, stable signaling equilibria often exist where the signal is sent rarely, or the *realized* cost along the path of play is near zero because the receiver trusts the signaler most of the time. This contradicts the popular rationalist image of handicaps as visibly wasteful ornaments (like peacock tails) that are always "on." If human status signaling operates like a Sir Philip Sidney equilibrium, why should we expect to see the conspicuous waste that the Handicap Principle is famous for predicting?

  *   **Follow-up:** If she argues the *potential* cost is what matters: If the potential cost is never realized, it doesn't reduce the signaler's fitness. How is a signal with zero realized cost empirically distinguishable from "cheap talk," and why invoke Zahavi rather than standard cheap-talk models?

  4. **Theory Immunization and "Cost"**
  Critics argue that the Handicap Principle risks becoming unfalsifiable because any counterexample can be folded back into the theory by redefining "cost." For instance, if a signal isn't financially costly, proponents sometimes argue it carries a "psychological cost" or an "opportunity cost." What independent metric do you use to measure these costs *before* observing the signaling behavior, to ensure you aren't inferring the cost solely from the existence of the signal itself?

  *   **Follow-up:** If she suggests psychological discomfort is the cost: How do you measure that discomfort independently of the signaling act? If the only evidence for the cost is that the signal is honest, aren't you arguing in a circle?

  5. **Anonymous Philanthropy**
  A core prediction of status-based signaling is that the signal must be public to be effective. Yet, significant human philanthropy is anonymous. If the Handicap Principle is the primary driver of human generosity, anonymous donation should be evolutionary noise. How does your model account for high-cost signals that are deliberately hidden from the very audience whose opinion they are supposed to sway?

  *   **Follow-up:** If she suggests "signaling to oneself" or "signaling to God": That moves the mechanism from evolutionary game theory (social selection) to individual psychology or cultural theology. Does the Handicap Principle still hold if the "receiver" of the signal is not a selective agent in the evolutionary environment?

  6. **Fisherian Runaway vs. Quality**
  The Handicap Principle posits that signals indicate underlying genetic quality (good genes). However, Fisherian Runaway Selection suggests traits can become exaggerated simply because they are preferred, regardless of quality. In human cultural trends—like fashion or slang—how do you distinguish a trait maintained by Zahavian quality signaling from one maintained by Fisherian arbitrary preference?

  *   **Follow-up:** If she says they work together: They make different predictions. If the trait becomes too costly, Zahavian signaling should stabilize, whereas Fisherian runaway can crash the population. Have we observed human status markers crashing due to excessive cost, or do they just cycle arbitrarily?

  7. **Genetic vs. Cultural Timescales**
  Zahavi's principle was developed for genetic evolution, where cost creates a fitness differential over generations. Human status signaling operates on cultural timescales, where "fitness" is social capital, not necessarily reproductive success. When you apply the Handicap Principle to modern human behavior, are you claiming these are genetic adaptations, or are you using evolutionary terminology as a metaphor for cultural game theory?

  *   **Follow-up:** If she claims it's dual-inheritance: Cultural transmission allows for the rapid imitation of signals without the underlying quality. If a low-quality individual can culturally learn to mimic a high-cost signal faster than natural selection can weed them out, doesn't that break the honesty guarantee?

  8. **The "Waste" Threshold**
  In biological models, a handicap must reduce survival probability enough to offset the benefit of mating. In human sociology, we lack a clear threshold. Is there a quantitative point where a gift or ritual becomes a "handicap" rather than just a "gift"? If I donate 1% of my income versus 50%, does the theory predict a qualitative shift in how the signal is processed, or is it a continuous variable?

  *   **Follow-up:** If she says it's context-dependent: Without a threshold or a continuous function linking cost to honesty, the theory becomes descriptive rather than predictive. How can we predict *which* costly behaviors will become signals and which will remain private consumption?

  9. **Alternative Explanations for Ritual**
  Anthropologists often describe rituals as mechanisms for group cohesion or commitment (e.g., Ainslie's precommitment, or Durkheim's collective effervescence) rather than signaling quality to rivals. If a ritual is costly but benefits the whole group equally regardless of who performs it, does the Handicap Principle still apply, or does that fall under a different evolutionary mechanism like mutualism?

  *   **Follow-up:** If she insists it's still signaling status within the group: If the primary function is group cohesion, and status is a byproduct, doesn't prioritizing the Handicap Principle obscure the actual selection pressure? Why privilege the status explanation over the cohesion explanation?

  10. **Falsification**
  Finally, what specific empirical observation would convince you that the Handicap Principle is *not* the correct explanation for a given human behavior? If you observed a high-cost signal that was consistently faked by low-quality individuals without social penalty, would that falsify the theory, or would you argue that the cost wasn't "high enough" to count as a handicap?

  *   **Follow-up:** If she says she would accept falsification but defines the conditions narrowly: Can you commit to a specific study design or dataset that, if it showed no correlation between signal cost and underlying quality, would cause you to abandon the Handicap explanation for that domain?
