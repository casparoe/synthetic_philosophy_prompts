      *   *Nuance:* Avicenna is a hylomorphist (mostly). The soul is the perfection of the body. But it is an *independent substance* that uses the body. The Flying Man targets the "substance" claim. Marmura warns against reading it as a "ghost in a machine" proof immediately. It's about the *givenness* of the self.

