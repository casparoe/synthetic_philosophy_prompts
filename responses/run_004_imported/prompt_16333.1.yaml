answer: |-
  **MEMORANDUM**

  **TO:** District AAC Review Committee
  **FROM:** [Your Name], School Psychologist
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding AAC Funding and Authorship Verification for Student [ID/Name]

  **Purpose**
  This memo outlines a recommendation regarding the request to fund a 1:1 aide for Rapid Prompting Method (RPM)/Spelling to Communicate (S2C) and, critically, to codify the output from these sessions as the student's independent, authoritative voice for IEP goal-setting and educational placement. This case presents a significant ethical and procedural challenge, balancing our legal obligation to provide evidence-based practices with our moral obligation to presume competence in nonverbal students.

  **Summary of Conflicting Positions**
  To reach a defensible decision, we must acknowledge the strength of the opposing arguments, as both stem from a desire to serve the student's best interests.

  *   **The Family's Position (Presumption of Competence):** The parents argue that restricting this method is an act of epistemic injustice. For a nonverbal student who has not demonstrated reliable motor speech or standard AAC use, this board may be the *only* available window into their cognitive life. To dismiss the output because it exceeds observed motor capabilities is to impose a "motor-first" bias that historically excludes autistic individuals. Their argument is not merely emotional; it is a civil rights claim. They assert that demanding independent verification places an impossible burden on a disabled child that we would not place on a speaking child, effectively silencing them until they can prove their humanity to our satisfaction.
  *   **The SLP/Clinical Position (Verification of Authorship):** The speech pathology staff cites the consensus of major organizations (ASHA, AAP, APA) regarding facilitated communication methods. The concern is not skepticism of the *student's* potential, but the well-documented *ideomotor effect*, where facilitators unconsciously guide the physical movement. The risk here is twofold: educational harm (placing a student in an environment they cannot independently navigate) and ethical harm (attributing thoughts, preferences, or even allegations of abuse to the facilitator rather than the child). They argue that "presuming competence" cannot mean "assuming authorship without evidence," as doing so risks turning the child into a ventriloquist's dummy for adult hopes.

  **Ethical and Philosophical Analysis**
  This committee faces what philosopher Donald Davidson described as the problem of "radical interpretation." When we interpret any speaker, we use a "principle of charity": we assume their statements are coherent and true to make sense of them. In typical conversation, this works because we have continuous feedback.

  In facilitated methods, that feedback loop is closed. The coherence we see on the board *could* be the student's mind, or it *could* be the facilitator's mind. The tragedy is that the more charitably we interpret the letters, the more "human" the student appears—which makes it harder to test the hypothesis without seeming cruel. However, in a school setting, we cannot rely on charity alone. An IEP is a legal document that dictates resource allocation and placement. If we base placement on authorship that is not independently verified, we risk violating the student's right to a Free Appropriate Public Education (FAPE) by designing goals for a cognitive level they may not independently possess.

  **Recommendation: Conditional Continuation with Verification Protocol**
  I recommend the committee adopt a **Conditional Middle Path**. We will not outright ban the method, nor will we immediately authorize it as the primary basis for high-stakes educational decisions.

  1.  **Funding for Support, Not Facilitation:** The district will approve the 1:1 aide, but their role must be defined as *supportive* (e.g., behavior regulation, physical positioning) rather than *communicative facilitation*. The aide should be trained to fade physical prompts as rapidly as possible.
  2.  **Withhold Authoritative Status for IEP/Placement:** We cannot currently codify the board output as the student's independent voice for IEP goals or class placement. To do so without verification exposes the student to the risk of inappropriate placement and the district to liability.
  3.  **Mandatory Independent Verification Trials:** We will implement a blinded "message-passing" protocol. The student will be asked to describe information (e.g., the contents of a sealed envelope, a picture shown only to them) that the facilitator does not know. This must occur across multiple sessions with different facilitators.
      *   *If the student passes:* We reconvene to discuss integrating the output into the IEP.
      *   *If the student does not pass:* We must transition to independently operated AAC (e.g., eye-gaze technology, switch access) while acknowledging the emotional loss this may cause the family.
  4.  **Parallel Implementation of Validated AAC:** Simultaneously, the SLP will implement robust, independently operated AAC systems. We must ensure the student has a voice that is undeniably their own, even as we test the letterboard.

  **Rationale**
  This recommendation rejects the parents' demand for immediate authority, but it does so not to silence the child, but to *protect* the integrity of their voice. If the communication is real, it will withstand verification. If it is not, we have an ethical duty to find the method that *does* work.

  It also rejects the SLP's preference for immediate discontinuation. By allowing a trial period with verification, we honor the "presumption of competence." We are not saying, "This is fake." We are saying, "We need to know *who* is speaking before we bet your education on it."

  **Conclusion**
  This is an emotionally fraught decision. We all want the letters on the board to be the student's. But our duty is to the child's long-term autonomy, not just the short-term hope of their advocates. By requiring independent verification, we ensure that if this student speaks, the world knows it was truly them.

  **Action Required:**
  Vote to approve funding for the aide under the condition of the Verification Protocol outlined above, pending parent agreement.
