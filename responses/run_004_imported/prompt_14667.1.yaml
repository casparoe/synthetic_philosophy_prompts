answer: |-
  **Setting:** *The lobby bar of the Grand Hyatt, 11:30 PM. The hum of the HVAC system competes with the clink of ice. Two name badges sit on the coaster: ELENA (Princeton) and MARCUS (USC). Both look tired.*

  **Elena:** You know, for a guy who thinks morality is irrelevant to intentionality, you spend a lot of time talking about moral character.

  **Marcus:** (Smiles, swirling his scotch) Guilty. But there's a distinction, El. I'm not saying morality is irrelevant. I'm saying it's evidence. When people see the CEO harming the environment, they aren't importing moral blame into the concept of 'intentional.' They're using the bad outcome as a diagnostic tool to infer the CEO's deep self.

  **Elena:** A diagnostic tool? That's generous. It sounds like you're saying the folk are just bad at reporting their own cognitive processes. Look, the data is stark. The mental state is identical. "I don't care either way, I just want profit." In the harm case, 82% say intentional. In the help case, 23%. If the psychology is constant, and the judgment flips, the variable has to be the moral valence. Morality isn't a clue; it's the switch.

  **Marcus:** But the psychology *isn't* constant. That's the whole point of the Deep Self view. The statement "I don't care" is surface noise. When the Chairman accepts harm as a cost of doing business, that indifference reveals a deep-seated disregard. It aligns with a profit-maximizing identity. When he accepts help, that same indifference reveals a lack of endorsement. It *doesn't* align. The asymmetry isn't in the concept of intentionality; it's in the fit between the side effect and the agent's evaluative attitudes.

  **Elena:** Okay, let's stress test that fit. Because I think I have a case where your "fit" metric breaks, and my "moral switch" holds. Let's call him the Benevolent Polluter.

  **Marcus:** (Sighs) I hate these vignettes. Go on.

  **Elena:** Sterling is the CEO. But unlike Knobe's original guy, Sterling is a devout environmentalist. It's his core identity. He donates half his income to conservation. He *loves* nature. But his company is on the brink of bankruptcy. If it folds, three thousand workers lose their livelihoods. He launches a new product line. He knows for a fact it will damage the local ecosystem. He says, "I hate doing this. It goes against everything I believe. But I have to save these jobs." He proceeds. Harm occurs.

  **Elena:** Now, on your view, the side effect clashes violently with his Deep Self. His evaluative attitude is *against* harm. So, the folk should say he did it *unintentionally*. It's a tragedy, not an intentional act of pollution.

  **Marcus:** That seems right to me. It's coerced by circumstance. It's not *him*.

  **Elena:** But the data suggests otherwise. When Uttich and Lombrozo ran cases like this—where the agent's values are good but the outcome is bad—people still lean heavily toward 'intentional.' Why? Because the outcome is morally bad. The blame demands a target. If you can't blame his character, you blame his agency. You stretch the concept of 'intentional' to cover the harm because the moral grammar requires it. My view predicts the 'Intentional' judgment. Your view predicts 'Unintentional.'

  **Marcus:** Hold on. You're assuming the folk see "saving jobs" as a neutral override. But if Sterling says, "I have to save these jobs," he's prioritizing a different Deep Self value: loyalty to his workers. So the harm to the environment is still a trade-off he's willing to make. The indifference to the environment, even if regretful, still shows he values profit/jobs *over* nature in this instance. The Deep Self is complex, Elena. It's not just "He likes trees." It's his hierarchy of cares.

  **Elena:** That feels like retrofitting. You're expanding "Deep Self" until it's co-extensive with "whatever decision was made." If every foreseen side effect of a voluntary action counts as an expression of the Deep Self, then your theory collapses into the Simple View. You need a case where the Deep Self and the Moral Valence pull in opposite directions.

  **Marcus:** Fine. Let's flip it. The Virtuous Villain.

  **Elena:** I'm listening.

  **Marcus:** Imagine a CEO who is openly contemptuous of the environment. He thinks nature is a resource to be exploited. His Deep Self is anti-ecology. He launches a policy to maximize extraction, purely to strip the land. But, due to a quirk of chemistry he didn't anticipate, the extraction process actually purifies the local water table. Massive environmental help. He says, "I don't care about the water, I just want the minerals."

  **Marcus:** Now, on your Moral Switch view: The outcome is Good. Therefore, the folk should say it was *not* intentional. The switch is off.

  **Elena:** Correct.

  **Marcus:** But on my view? His Deep Self is hostile to the environment. The good outcome is completely alien to his values. He didn't just 'not care'; he would have prevented it if he knew it interfered with profit. The fit is zero. So we both predict 'Unintentional.' That doesn't help us.

  **Elena:** We need a mismatch. What if the Villain *knows* it helps, and he *hates* that it helps, but does it anyway for profit?

  **Marcus:** Then he's not indifferent. The Knobe effect relies on the "I don't care" attitude. If he hates the help, he's actively opposing the good. That's a different psychological profile.

  **Elena:** (Taps her glass) This is the problem, Marcus. You keep rescuing the Deep Self theory by adding nuance to the agent's psychology. "Oh, well, maybe he cares about *this*," or "Maybe that value is deeper." But the beauty of Knobe's original finding was its parsimony. Hold the psychology constant. Change the goodness. The judgment changes. The simplest explanation is that the concept of intentional action is *normative*. It's not a purely descriptive psychological category. We use it to hold people accountable.

  **Marcus:** But *why* is it normative? That's what you skip. You say "morality leaks in." I'm trying to tell you *how*. It leaks in because moral judgments are judgments about the person. When we ask "Did he do it intentionally?" we aren't asking a metaphysical question about causal chains. We're asking, "Is this action attributable to *him*?"

  **Marcus:** Think about the blame case. If I push you and you fall, did I push you intentionally? If it was an accident, no. If I hated you, yes. The moral valence of the outcome (you getting hurt) cues me to look for the hostility in your Deep Self. In the CEO case, the harm cues the observers to see the greed. The help case lacks that cue. The morality isn't constitutive of intentionality; it's the spotlight that illuminates the Deep Self.

  **Elena:** But what about the cases where the spotlight illuminates nothing, and we still call it intentional? There's a study by Guglielmo and Malle. They presented cases where the agent had *no* particular attitude toward the side effect—literally randomized indifference—but the outcome was morally extreme. People still ascribed intentionality based on the badness. If the Deep Self is blank, what are you tracking?

  **Marcus:** (Pauses, takes a sip) If the Deep Self is blank, the default assumption is that agents endorse the foreseeable consequences of their voluntary actions. That's a baseline norm of agency. But when the outcome is morally charged, that baseline gets weighted. I'll concede this: Moral valence acts as a heuristic. It's a cognitive shortcut for assessing Deep Self alignment. It's faster to ask "Was this bad?" than to psychoanalyze the CEO's hierarchy of values.

  **Elena:** A heuristic? So you're saying the folk are making a systematic error?

  **Marcus:** I'm saying they're using a reliable proxy. In the real world, bad side effects usually indicate a lack of sufficient care, which *is* a Deep Self feature. Good side effects usually indicate alignment. The CEO case is artificial because it isolates the variables in a way real life rarely does.

  **Elena:** But philosophy *is* about isolating variables. If the proxy fails in the lab, the theory is wrong. If I build a thermometer that reads temperature correctly in New York but gives the wrong reading in London because of "moral humidity," I don't say temperature is a heuristic for latitude. I say my thermometer is broken.

  **Marcus:** (Laughs) Moral humidity. I'm stealing that. But look, Elena, consider the cost of your view. If intentionality is constitutively moral, then moral disagreement becomes conceptual disagreement. If a utilitarian and a deontologist disagree on whether a trolley switch was 'intentional killing,' they aren't arguing about facts or principles. They're arguing about the definition of a word. That makes moral progress impossible.

  **Elena:** Or it makes moral progress a matter of refining our concepts of agency. Maybe that's exactly what's happening. We are expanding the circle of responsibility. We used to say "collateral damage" wasn't intentional. Now we say, "If you foresaw it and did it anyway, it's on you." The Knobe effect isn't a bug; it's a feature of a society demanding more accountability.

  **Marcus:** That's a normative claim, not a psychological one.

  **Elena:** X-phi is supposed to bridge that gap.

  **Marcus:** (Signals the bartender for the check) Here's the hard case for you, then. The "Obligatory Harm." A soldier is ordered to bomb a target. He knows civilians will die. He is deeply moral, follows Just War theory, believes this specific strike is proportionate and necessary to save more lives. He does it. Civilians die.
  **Marcus:** Your view says: Bad outcome = Intentional.
  **Marcus:** My view says: His Deep Self is aligned with *protecting* life. He regrets the harm. It is a tragic necessity, not an expression of his will.
  **Marcus:** If the folk say "Unintentional" here, because they view the soldier as a moral agent acting within a justified framework, your Moral Switch breaks. The outcome is bad, but the action is justified.

  **Elena:** (Quiets for a moment) There is data on that. When the action is perceived as *obligatory* or *justified*, the intentionality ascription drops, even for bad outcomes.

  **Marcus:** Aha. So morality *does* matter, but it's the morality of the *action*, not just the outcome.

  **Elena:** But it doesn't drop to zero. It's still higher than a neutral side effect. And if the soldier *enjoys* the bombing? It goes back up. The moral valence of the *attitude* modulates the judgment. It's all moral. It's morality all the way down, Marcus. You can't excise it.

  **Marcus:** Or... it's all about *identity* all the way down. We judge the soldier based on whether the death expresses *who he is*. If he's a reluctant instrument of war, the death isn't his. If he's a zealot, it is. The moral valence is just the language we use to describe that alignment.

  **Elena:** (Stands up, grabs her coat) We're going to need more drinks to solve this.

  **Marcus:** (Standing as well) Or we just admit that 'intentional' isn't a natural kind. It's a tool. Sometimes we use it to describe psychology. Sometimes we use it to assign blame.

  **Elena:** If you write that in your paper, I'm citing it.

  **Marcus:** Only if you admit that the Deep Self is the mechanism by which the blame gets assigned.

  **Elena:** Don't push your luck.

  *They walk toward the elevator, the argument unresolved, the noise of the bar swallowing the rest of the sentence.*
