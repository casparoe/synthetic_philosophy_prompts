      *   **Clarify Authorship:** Briefly address the "Kripke vs. Wittgenstein" question. It's "Kripke's Wittgenstein" (KW). Kripke is presenting an argument *attributed* to Wittgenstein, but scholars debate if Wittgenstein actually held this view.
      *   **The Crucial Distinction (Induction vs. Meaning):** This is the meat of the answer.
