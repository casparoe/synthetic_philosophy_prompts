  I need to make sure Adele isn't just a plot device. She represents the *trust* required for a rational being to exist in an empirical world. Without her, the empirical world is unprovable.

  11. **Final Review against Prompt:**
      *   Story? Yes.
      *   Pressure on the argument? Yes (Rationality leads to self-destruction).
      *   No recitation? Yes.
      *   No adjudication? Yes.

  Let's write.

