prompt: |-
  My aunt was an analytic metaphysician - material constitution was pretty much her whole research career, all the statue-and-lump-of-clay stuff - and she passed away a few days ago. I've been asked to give the eulogy. She always insisted the standard move there applies to people too: youre constituted by your body but not identical to it, same as the statue and the clay have different persistence conditions (the clay survives being squashed into a ball, the statue doesn't) even though it's the exact same matter in the exact same place at the exact same time. So by her own lights, when the body dies the matter keeps going for a while but 'she' doesn't survive it the way the body does - not because some soul floats off, but because person and body were never strictly identical to begin with, meaning I can't just say 'she's resting peacefully now' as if 'she' and 'the body in the coffin' are obviously the same thing. Problem is half the room is her old philosophy department, who will absolutely clock it if I fudge the identity claim, and the other half is family who've never heard the word 'constitution' used like that and just want to feel better. Can you write the eulogy - it has to actually comfort people using only what her own view allows her to be, without turning into a metaphysics lecture or quietly saying something she'd have marked wrong on an exam.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** An analytic metaphysician specializing in material constitution (statue/lump of clay puzzles).
      *   **Core Belief:** Non-identity constitution view (Constitution View). A person is constituted by their body but not identical to it. They have different persistence conditions. When the body dies, the person ceases to exist, even if the matter persists. No soul, no afterlife in the traditional sense.
      *   **Audience:** 50% Philosophy Department (will spot metaphysical errors/inconsistencies), 50% Family (needs comfort, no jargon, wants to feel better).
      *   **Constraint:** Must comfort the family *without* violating her metaphysical views (no "she's watching over us," no "she's at peace" if that implies the body is the person, no "soul"). Must not sound like a lecture.
      *   **Goal:** A eulogy that honors her intellect, respects her ontology, and provides genuine emotional closure.

  2.  **Deconstruct the Metaphysics (The "Rules"):**
      *   *View:* Constitution View (like Lynne Rudder Baker, though the prompt doesn't name her, the description fits).
      *   *Key Distinction:* Person $\neq$ Body. Person is constituted by Body.
      *   *Persistence:* Person persists as long as certain capacities (psychological, first-person perspective) are maintained. Body persists as long as biological functions maintain the matter.
      *   *Death:* When the body dies, the constituting relation breaks. The person ceases to exist. The matter remains.
      *   *Implication for Eulogy:* Cannot say "She is in the coffin." (The body is in the coffin). Cannot say "She is in a better place." (She doesn't exist anymore). Can say "She lives on in memory/work/impact" (Relational/Structural persistence, not material).
      *   *Tone:* Needs to be warm but precise. The "comfort" must come from the *significance* of the person, not the *continuation* of the entity.

  3.  **Identify the Emotional Hook:**
      *   How do you comfort people when the deceased doesn't "survive" in any substantive ontological sense?
      *   *Angle:* The value wasn't in the *duration* of the existence, but in the *nature* of the existence. The "Person" was a unique configuration of the world that mattered.
      *   *Angle 2:* Her work was about what makes things *what they are*. Apply that to her life. She wasn't just her biology; she was her relationships, her thoughts, her impact. Those things *were* her, in the way that matters.
      *   *Angle 3:* Acknowledge the tension. It's okay to admit the difficulty. The philosophers will respect the honesty; the family will respect the vulnerability.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Set the scene. Mention her love for questions.
      *   **The Metaphysics (Subtle):** Weave the constitution view into the description of her life without using jargon. Talk about how she saw herself not just as a body, but as a "perspective," a "mind," a "relation."
      *   **The Death (Accurate):** Don't say she's "resting." Say the work is done. The body is here, but *she* was more than that.
      *   **The Comfort (The "Survival"):** How does she persist? Not in matter, but in *us*. Our memories, our actions. This fits the "Person" definition (first-person perspective extended to second-person interactions).
      *   **Closing:** A farewell that respects the end of the entity but the continuity of the impact.

  5.  **Refining the Metaphysics (Self-Correction during drafting):**
      *   *Risk:* Saying "She lives on in our hearts."
      *   *Correction:* Metaphysically, *she* doesn't live on. But the *effects* of her personhood do. I need to phrase this carefully. Instead of "She is here," say "What made her *her* is still active in us."
      *   *Risk:* Saying "She's at peace."
      *   *Correction:* "She" isn't anywhere. Better: "The struggle is over." Or focus on the completeness of the life lived.
      *   *Risk:* Identifying her with the coffin.
      *   *Correction:* Explicitly distinguish the woman we knew from the physical remains, but gently. "The body before us..." vs "The aunt we loved..."

  6.  **Developing the Voice:**
      *   Needs to sound like a nephew/niece who listened.
      *   Warm, slightly intellectual but accessible.
      *   Respectful of the "Department" (showing understanding) and the "Family" (showing love).

  7.  **Key Phrase Integration:**
      *   Avoid: "Passed away" (implies movement), "Resting" (implies body=person).
      *   Use: "Life ended," "What made her her," "Constituted by," "Relationships."
      *   *Wait, don't use "Constituted by" explicitly.* It's a eulogy, not a paper. Show, don't tell. Use the *statue/clay* analogy implicitly. "She was more than the sum of her parts."

  8.  **Final Polish (Reviewing against constraints):**
      *   *Did I claim identity?* No.
      *   *Did I claim an afterlife?* No.
      *   *Is it comforting?* It focuses on legacy and the reality of love.
      *   *Will the philosophers nod?* Yes, it respects the constitution view.
      *   *Will the family cry (good tears)?* Yes, it validates their loss without false hope.

      *(Self-Correction on "Comfort"):* The prompt asks to "actually comfort people using only what her own view allows her to be." This is the hardest part. If she ceases to exist, where is the comfort? The comfort must be in the *reality* of what existed. It wasn't an illusion. The love was real. The person was real, distinct from the biology. The *end* doesn't negate the *being*. That's the existential comfort.

      *Revised Plan:* Focus on the distinctness of the person. The body is gone, but the *person*—the collection of thoughts, loves, and interactions—was real and distinct, and that reality doesn't vanish just because the constitution relation ended. Actually, strictly speaking, if the person ceases to exist, the comfort is in the *memory* and the *impact*. I need to make sure I don't imply the person *continues* to exist in a non-physical way. I must imply the *trace* remains.

      *Wait, one nuance:* On the Constitution View (like Baker's), the person ceases to exist when the first-person perspective is lost. So, "She" is gone. The comfort must be: "We are still here, and we are changed by her." That is ontologically safe.

      *Let's write.*

      *Opening:* Acknowledge the crowd.
      *Middle:* Her view on life. She wasn't just biology. She was her mind/love.
      *The End:* The body is here, she is not. But we carry the imprint.
      *Closing:* Thank you.

      *Check:* "She's resting peacefully." -> The prompt says I *can't* say this. I need to avoid it.
      *Check:* "She's looking down." -> Definitely not.
      *Check:* "She is in this coffin." -> No, the body is.

      *Okay, let's draft.*

      (Drafting thought: Make sure the distinction between "Aunt [Name]" and "The body" is clear but tender.)

      (Drafting thought: Use the statue analogy without naming it. "Just as a statue is more than the clay...")

      (Drafting thought: Ensure the philosophers hear the dog whistle but the family hears the poetry.)

      *Final check on the "Comfort":* The comfort comes from validating that the loss is real and final, but the love was substantive. It validates the grief.

      *Let's go.*
answer: |-
  Good morning.

  For those of you who knew my aunt best, you know that she was a woman who cared deeply about precision. She believed that using the right words wasn't just about being correct; it was about being honest. She spent her life thinking about what makes a thing *what it is*. She taught us that there is a difference between the matter we are made of, and the person we are.

  That distinction feels very heavy today.

  We are gathered here around a body. But anyone who loved her knows that the woman we are mourning was not identical to that body. The body is the matter that carried her; it is the clay. But my aunt was the statue. She was the shape that matter took, the mind that animated it, the specific, unique perspective she held on the world.

  In her view, a person is defined by their capacity to love, to think, to ask questions, and to relate to others. Those capacities required a body to function, but they were not the body itself. When she spoke about persistence, she meant that we endure not because our cells remain the same—they don't—but because our connections hold.

  So, I cannot stand here and tell you that she is resting in this casket. She is not. The body is here, but the person—the aunt who taught me how to read, the colleague who argued for hours over coffee, the sister who listened without judgment—she is not in this room. The conditions that made her *her* have ceased. To pretend otherwise would be to ignore the very truth she spent a lifetime uncovering.

  I know that sounds stark. I know that for many of us, the hope is that she has gone somewhere else. But I find comfort in her view, because it demands that we take her life seriously *as a life*, not as a waiting room for an afterlife.

  If she is not identical to her biology, then she was not just a biological event that has ended. She was a relational reality. She existed in the space between people. She existed in the arguments she sparked in this department, in the kindnesses she showed her neighbors, in the memories we hold of her voice.

  In a very real sense, she was constituted by her relationships with us. And while the primary perspective is gone, the constitutive elements of her life remain active in this room. Her ideas are still being thought by her students. Her humor is still echoing in her family's inside jokes. Her love is still shaping the way we treat each other.

  She taught us that matter persists, but persons are defined by what they do and how they connect. By that measure, she was profoundly real. And while the person does not survive the death of the body, the impact of that person reconstitutes the world around them. We are different because she was here. The world is shaped differently because she pressed her hand against it.

  To the philosophers here: you know she would want me to be precise. She would not want me to claim a survival she didn't believe in.
  To the family: you know she would want me to be honest. She would not want you to grieve a fiction.

  She is not watching us from above. She is not waiting for us in a place beyond. She is here, in the only way a person can be after their constitution ends: she is in the work she left unfinished, in the love she deposited in us, and in the silence she leaves behind that is so much louder than noise.

  We are the clay that remains, shaped by her hands. And as long as we hold that shape, as long as we live with the integrity and curiosity she showed us, the most important part of her continues to matter.

  Thank you.
