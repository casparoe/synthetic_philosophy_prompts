answer: |-
  This is absolutely not a dumb question. In fact, you and Jake have hit on one of the trickiest distinctions in contemporary epistemology. Even professional philosophers spend papers arguing about whether these two views are actually distinct or just notational variants of each other.

  But you are right to sense a difference. The short version is: **Contextualism is a theory about language; Pragmatic Encroachment is a theory about knowledge itself.**

  Here is how to make the distinction click, the specific case where they disagree, and why the "Classical" purists lose their minds over one but tolerate the other.

  ### 1. The Core Distinction: Who Sets the Bar?

  In the standard Bank Case, Hannah is the **Subject** (the person trying to know), and let's say you are the **Attributor** (the person saying "Hannah knows" or "Hannah doesn't know").

  *   **Contextualism:** The meaning of the word "knows" changes depending on the **Attributor's** context.
      *   If *you* are in a low-stakes conversation, "knows" means "pretty sure."
      *   If *you* are in a high-stakes conversation, "knows" means "certain."
      *   *Crucially:* Hannah's actual mental state doesn't change. Only the scoreboard you are using to measure her changes.

  *   **Pragmatic Encroachment:** The meaning of the word "knows" is fixed (invariant), but whether Hannah clears the bar depends on the **Subject's** practical stakes.
      *   Knowledge requires a certain level of justification.
      *   How *much* justification is required "encroaches" on practical factors.
      *   *Crucially:* If Hannah's stakes go up, she literally loses knowledge (even if her evidence stays the same). It's not about the word; it's about her epistemic status.

  ### 2. The Divergence Case: "Hannah vs. Sarah"

  To see the difference, we need to break the link between the Subject's stakes and the Attributor's stakes. In the original Bank Case, Hannah's stakes and the speaker's stakes are usually the same. Let's separate them.

  **The Setup:**
  *   **Hannah (The Subject):** She is depositing a check for $10. If she's wrong about the bank hours, she pays a $5 fee. **(Low Stakes for Hannah)**. She has standard evidence (was there two weeks ago).
  *   **Sarah (The Attributor):** Sarah is speaking about Hannah. However, Sarah has bet her life savings on whether Hannah successfully deposits that check. If Hannah fails, Sarah is ruined. **(High Stakes for Sarah)**.

  **The Question:**
  Sarah says: **"Hannah knows the bank is open."**
  Is this statement **True** or **False**?

  **The Contextualist Verdict: FALSE.**
  Why? Because Contextualism says the truth of the sentence depends on the *speaker's* (Sarah's) context. Sarah is in a high-stakes situation. Therefore, in her mouth, the word "knows" sets a very high standard (near certainty). Hannah only has standard evidence. Hannah does not meet Sarah's high linguistic standard. So, when Sarah says "Hannah knows," she is speaking falsely.

  **The Pragmatic Encroachment Verdict: TRUE.**
  Why? Because Pragmatic Encroachment says knowledge depends on the *subject's* (Hannah's) practical situation. Hannah has low stakes. Therefore, the amount of justification required for her to "know" is low. Her evidence is sufficient for her low-stakes situation. The fact that *Sarah* is stressed out is irrelevant to whether *Hannah* knows. Hannah meets the fixed standard for knowledge given her stakes. So, Sarah's statement is true.

  **Summary:**
  *   **Contextualism:** Looks at the **Speaker**. (Sarah's stress raises the bar).
  *   **Pragmatic Encroachment:** Looks at the **Knower**. (Hannah's chill lowers the bar).

  ### 3. The Bonus: Why Classical Epistemologists Hate Encroachment More

  Classical epistemologists (Traditional Invariantists) believe that knowledge is a "pure" epistemic state. It depends *only* on truth, belief, and justification (evidence). Practical stuff (money, risk, survival) should not matter.

  Here is why they treat the two theories differently:

  **Contextualism is a "Linguistic Save."**
  Contextualists can say to the Classical Epistemologist: "Don't worry! We agree that knowledge itself is pure. We are just saying that the *English word* 'know' is context-sensitive, like the word 'tall'."
  *   "Tall" doesn't have a fixed height. A tall jockey is short for a basketball player. That doesn't change physics; it just changes how we use the word.
  *   Contextualists argue "Knows" is the same. It protects the *concept* of knowledge by blaming the *language*. Classical epistemologists can tolerate this because it keeps practical stakes out of the actual nature of knowledge.

  **Pragmatic Encroachment is an "Ontological Attack."**
  Pragmatic Encroachers (like Jason Stanley) say: "No, the word 'knows' means the same thing always. But whether you *have* knowledge literally depends on how much money you might lose."
  *   To a Classical Epistemologist, this is heresy. It suggests that two people can have the **exact same evidence** and the **exact same belief** about the **exact same truth**, but one has Knowledge and the other doesn't, simply because one is richer or has less to lose.
  *   This violates the principle of **Purism**. It suggests that practical rationality (what should I do?) invades theoretical rationality (what is true/known?).
  *   If Encroachment is true, Epistemology is no longer a separate field from Decision Theory. They are mixed together. For a philosopher who wants to study "Knowledge" as a distinct, pure thing, Pragmatic Encroachment dissolves their subject matter.

  ### The "Elevator Pitch" for Jake
  If you want to settle the bet with Jake, tell him this:

  "Contextualism says the **scoreboard** changes depending on who is keeping score. Pragmatic Encroachment says the **player's stats** change depending on how important the game is to the player. In the standard Bank Case, the scoreboard and the game importance match up, so they look the same. But if a stressed-out coach (Sarah) is judging a chill player (Hannah), Contextualism says she didn't score, but Encroachment says she did."
