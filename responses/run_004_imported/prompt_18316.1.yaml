      *   *Intro:* Hook with the seminar anecdote. Define the problem. State thesis clearly.
      *   *Newcomb vs. Damascus:* Newcomb is about dominance vs. evidence. Damascus is about *stability*. In Newcomb, CDT says "Two-box" and sticks with it. In Damascus, CDT says "If I stay, I should go; if I go, I should stay."
