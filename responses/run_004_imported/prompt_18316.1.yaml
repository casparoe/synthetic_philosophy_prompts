      *   *Critique:* Is EDT really "superior"? EDT often fails in Newcomb (One-Boxing is good, but EDT gets it right, CDT gets it "wrong" by CDT standards). In Damascus, EDT says "You're dead." CDT says "Run to the other city!" (but then switches).
      *   *Nuance:* The key is *ratifiability*. CDT *wants* ratifiability. It can't find it. EDT doesn't care about ratifiability in the same causal sense; it cares about conditional probability.
      *   *Stronger point:* The problem isn't just that CDT gives the wrong answer; it's that CDT *cannot generate an answer*. It enters an infinite loop. A decision theory that fails to output a recommendation is defective. EDT outputs a recommendation (indifference).
      *   *Condition:* I need to be careful about the "perfect predictor." If the predictor is perfect, the state of the world is *dependent* on the choice in a way CDT forbids. CDT defines states $K$ such that $P(K|A) = P(K)$. In Damascus, $P(\text{Death at D} | \text{Go D}) = 1 \neq P(\text{Death at D})$. CDT forces the agent to ignore this correlation. That is the fatal flaw.

