answer: |-
  This is a rich and nuanced subject, and your intuition that Sidgwick is the key figure is absolutely correct. However, your working assumption—that his psychical research was a private religious project separate from his philosophy, aimed at salvaging orthodox Christianity—needs significant refinement. In fact, the relationship between Sidgwick's ethics and his psychical research is much more integrated, and his stance was far less credulous than the popular image of the Victorian séance-goer suggests.

  Here is a breakdown of how to approach Sidgwick for your piece, addressing your specific questions.

  ### 1. Was it a project to salvage Christian faith?
  **Not exactly.** By the time Sidgwick helped found the Society for Psychical Research (SPR) in 1882, he had already lost his orthodox Christian faith. He could not subscribe to the Thirty-Nine Articles required for his fellowship at Trinity College, Cambridge, and eventually resigned his position (though he was later reinstated under modified statutes).

  He was not trying to prove the Bible, the Resurrection, or the divinity of Christ. He was trying to prove **survival after death** and **extra-sensory communication** on purely empirical grounds.

  His motivation was not theological dogma but **moral necessity**. Sidgwick was terrified that without empirical evidence of a spiritual order, morality itself would become irrational. He wasn't looking for a God to worship; he was looking for a cosmic structure that made being good a rational choice.

  ### 2. Is there a direct line to *The Methods of Ethics*?
  **Yes, a profound one.** This is the most critical correction to your working assumption. His psychical research was not a hobby sitting alongside his philosophy; it was the empirical search for the premise his philosophy required.

  In *The Methods of Ethics* (1874), Sidgwick arrives at a devastating conclusion known as the **"Dualism of Practical Reason."** He argues that there are two equally rational methods of decision-making:
  1.  **Rational Egoism:** It is rational to pursue my own happiness.
  2.  **Rational Benevolence (Utilitarianism):** It is rational to pursue the general good.

  In a materialist universe where death is the end, these two often conflict. If I can gain great happiness by committing a secret injustice, and there is no afterlife or divine judgment, **egoism is just as rational as morality.** Sidgwick found this conclusion intolerable. He wrote to his former student Arthur Balfour that he needed to believe in a "Cosmic Order" that harmonized duty and self-interest.

  Psychical research was the scientific attempt to find evidence of that Cosmic Order. If telepathy or survival after death could be proven scientifically, it would imply a spiritual reality where moral actions might have consequences beyond the grave, thereby resolving the Dualism. As the philosopher C.D. Broad later noted, Sidgwick hoped psychical research would provide the "sanctions" for morality that religion used to provide.

  ### 3. Was he a credulous believer?
  **Absolutely not.** In the context of the SPR, Sidgwick was the skeptic-in-chief.

  While many early spiritualists were eager to believe, Sidgwick approached the field with the same rigorous, almost painful, exactitude he applied to ethics. He was concerned that science was dismissing phenomena out of hand, but he was equally concerned that spiritualists were accepting fraud.
  *   **The "Steam Engine":** Colleagues described his investigative style as relentless and unemotional. He was willing to alienate friends and famous mediums if he suspected trickery.
  *   **Exposing Fraud:** Sidgwick famously exposed the medium William Eglinton as a fraud after catching him manipulating slate-writing. He was often criticized by spiritualists for being too harsh and too demanding of evidence.
  *   **Methodology:** The SPR was founded specifically to bring scientific rigor to these claims. Sidgwick's presidency was a signal that this was not a club for mystics, but a committee of inquiry.

  Calling him "credulous" misses the tragedy of his position. He was a man of supreme intellect who *wanted* to be convinced by evidence but found the evidence perpetually wanting. He remained an agnostic on the specific phenomena, hoping for proof but never claiming to have it.

  ### 4. Did he find the evidence he was looking for?
  **No.** This is the poignant end of the story.

  Sidgwick spent decades investigating mediums (including the famous Eusapia Palladino), collecting case studies of apparitions, and analyzing claims of telepathy. While the SPR concluded there was a "residuum" of unexplained phenomena, Sidgwick never found the "rock-solid" empirical proof that would resolve his ethical dualism.

  In his final years, he remained in a state of "hopeful uncertainty." He famously said that he could not say he *believed* in immortality, but he could not say he *disbelieved* either. He died without the philosophical closure he sought.

  ### Angles for Your Piece
  If you are writing a narrative piece, consider these themes:

  *   **The Victorian Crisis of Faith:** Sidgwick represents a specific type of Victorian intellectual—not the one who lost faith and became a happy atheist (like Huxley), nor the one who retreated into fundamentalism. He is the one who tried to build a *new* faith on the bedrock of empirical science and failed.
  *   **The Cost of Honesty:** Sidgwick's biographer, Bart Schultz (in *Henry Sidgwick: Eye of the Universe*), emphasizes Sidgwick's "veracity." He refused to lie to himself. He couldn't pretend the universe was moral without proof, but he couldn't bear the thought that it wasn't. Psychical research was the agonizing middle ground.
  *   **The Legacy:** Sidgwick's involvement legitimized psychical research for a generation of scientists (including William James and Lord Rayleigh), but it also highlighted the limits of empiricism. You cannot measure the "ought" with the "is."

  ### Recommended Sources
  *   **Bart Schultz, *Henry Sidgwick: Eye of the Universe* (2004):** The definitive modern biography. It treats the psychical research as central to his life, not a sidebar.
  *   **Sidgwick's Correspondence:** Specifically his letters to Arthur Balfour and his wife, Eleanor Balfour Sidgwick (who was also a major figure in the SPR).
  *   **The SPR Proceedings:** Early volumes show Sidgwick's committee reports, which are dry, skeptical, and meticulous.

  **Summary for your thesis:** Sidgwick was not a philosopher moonlighting as a spiritualist to save his soul. He was a moral philosopher who realized his ethical system required a spiritual universe to function, and he spent thirty years trying to use the scientific method to prove that universe existed. He failed, but the attempt reveals the deep anxieties of the Victorian rationalist mind.
