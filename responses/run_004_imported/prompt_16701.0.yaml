answer: |-
  Here are 10 interview questions designed to press the Lewisian view without getting bogged down in textbook definitions. They are structured to help you pivot quickly based on her response.

  ### 1. The "Incredulous Stare" & Ontological Cost
  **The Ask:** Lewis famously acknowledged that his view invites an "incredulous stare"—that it just feels absurd to believe in infinite concrete universes. He dismisses this as not being an argument. But isn't there a theoretical cost here? If we apply Occam's Razor, doesn't positing an infinity of concrete worlds violate the principle of parsimony in a way that *should* count as an argument against the theory?

  *   **Likely Lewisian Defense:** She will likely argue that we must distinguish between *qualitative* parsimony (kinds of things) and *quantitative* parsimony (number of things). Lewisians claim their theory is qualitatively parsimonious (only spatiotemporal entities exist) even if quantitatively extravagant.
  *   **Your Follow-Up:** "If qualitative parsimony is the only metric that matters, does that mean a theory positing one God is worse than a theory positing a billion galaxies, simply because 'God' is a different *kind* of entity than matter? At what point does quantitative bloat become a qualitative problem?"

  ### 2. Epistemic Access & Causal Isolation
  **The Ask:** If these other worlds are causally sealed off from ours—no information, light, or gravity can cross the gap—how do we have epistemic access to them? In math, we have a similar problem with Platonism. If there's no causal link, why should we trust our intuitions about what is "possible" as reliable guides to what actually exists out there?

  *   **Likely Lewisian Defense:** She will likely use an abductive argument: Modal Realism is the "best explanation" for our modal knowledge and the truth of our counterfactual statements, similar to how we posit electrons to explain physics.
  *   **Your Follow-Up:** "But with electrons, we can build tech that interacts with them. If the 'best explanation' for my intuition about possibility involves entities I can never interact with, even in principle, how is that methodologically different from positing angels to explain moral intuition?"

  ### 3. The Indexicality of "Actual"
  **The Ask:** Lewis argues that "actual" is just an indexical, like "here" or "now." I'm "here" and you're "there," but neither location is metaphysically special. But "actual" feels different than "here." I can travel to a new "here." I can't travel to a new "actual." Doesn't calling it indexical just relabel the problem of why *this* world has a special ontological status for us?

  *   **Likely Lewisian Defense:** She will insist the specialness is purely psychological or contextual. There is no metaphysical privilege, just as there is no metaphysical privilege to the present moment in a block universe.
  *   **Your Follow-Up:** "If it's purely psychological, why does death matter? If 'I' have counterparts living full lives in other worlds, and 'actual' is just where I happen to be standing, why should I fear the end of *this* indexical thread rather than just shifting my perspective to a surviving counterpart?"

  ### 4. Kripke's Counterpart Objection
  **The Ask:** Saul Kripke argued that Counterpart Theory changes the subject. When I say, "I could have been a pilot," I care about *me* having that possibility, not some guy in another universe who resembles me. If I'm not literally in that other world, doesn't Lewis's view make modal statements about *me* false, replacing them with statements about my twins?

  *   **Likely Lewisian Defense:** She will argue that strict identity across worlds is incoherent (you can't be in two places at once). Counterparts are the only logical way to make sense of *de re* modality without contradiction.
  *   **Your Follow-Up:** "But if the truth of 'I could have been a pilot' depends on a twin's actions, doesn't that sever the link between my choices and my possibilities? If my counterpart becomes a pilot through no effort of mine, in what sense was *my* potential realized?"

  ### 5. The Recombination Principle & Circularity
  **The Ask:** Lewisians often use the "Principle of Recombination" to explain modality: anything can coexist with anything else, provided they occupy distinct spatiotemporal positions. But doesn't the word "can" in that principle secretly smuggle in the modal notion you're trying to define? Are you explaining possibility, or just assuming it?

  *   **Likely Lewisian Defense:** She will likely claim recombination is a primitive principle or a rule of construction for the pluriverse, not a modal claim itself.
  *   **Your Follow-Up:** "If it's a primitive rule, what constrains it? Can I recombine a world where 2+2=5? If you say 'no, logic constrains it,' haven't you just admitted that modality (logical necessity) is prior to the worlds, rather than the worlds grounding modality?"

  ### 6. The Tegmark Connection (Host Context)
  **The Ask:** I got into this via Max Tegmark's Mathematical Universe Hypothesis. He thinks all mathematical structures are physically real. Lewis thinks all possible worlds are concretely real. But Tegmark's structures are abstract, while Lewis's worlds are concrete. Do you see a tension there? Can a world be both a mathematical structure and a concrete physical place?

  *   **Likely Lewisian Defense:** She will likely distinguish Lewis's concrete realism from Tegmark's structuralism, arguing that Lewisian worlds have genuine causal powers within themselves, whereas math structures do not.
  *   **Your Follow-Up:** "But if the structure is identical, what work is the 'concreteness' doing? If a mathematical structure contains a conscious observer, does it matter if the substrate is 'concrete' or 'abstract' to the observer inside it? Isn't the distinction invisible from the inside?"

  ### 7. Ethical Weight of the Pluriverse
  **The Ask:** If every possible world is real, then every possible tragedy is also real. There are worlds where atrocities happen that are far worse than anything in our history. If these aren't just stories but concrete realities, does the sheer volume of suffering in the pluriverse diminish the moral value of existence, or are we off the hook because we can't interact with them?

  *   **Likely Lewisian Defense:** She will reiterate causal isolation. We cannot help them, so we bear no responsibility. The existence of evil elsewhere doesn't negate good here.
  *   **Your Follow-Up:** "I'm not asking about responsibility, but about value. If I knew that saving a child here meant a counterpart child suffered there (assuming some magical link), would the net value be zero? If not, why does the existence of the suffering counterpart not weigh on the total value of reality?"

  ### 8. Quantifier Variance (The "Existence" Debate)
  **The Ask:** Some critics suggest this whole debate is just verbal. Maybe when you say "exists," you mean something broader than what I mean. Is it possible that Modal Realism is true under your definition of "existence," but false under mine, and neither of us is wrong about the world, just the language?

  *   **Likely Lewisian Defense:** She will likely reject quantifier variance. She will argue this is a substantive metaphysical disagreement, not a semantic one. The world is one way or the other.
  *   **Your Follow-Up:** "If it's substantive, there must be a fact of the matter. But since we can't observe other worlds, what *state of affairs* makes your definition the correct one? Is it just that your definition makes the logic cleaner?"

  ### 9. Laws of Nature
  **The Ask:** In Lewis's view, laws of nature are just regularities that hold across worlds. But if laws are just descriptions of what happens, rather than prescriptive rules, does that make the universe less intelligible? Does it mean there's no reason *why* gravity works, just that it works in this cluster of worlds?

  *   **Likely Lewisian Defense:** She will defend Humean Supervenience. Laws summarize the best system of regularities. There is no "necessitation" behind the laws.
  *   **Your Follow-Up:** "If there's no necessitation, isn't science just cataloging coincidences? If I say 'gravity *must* work this way,' and you say 'it just *does* in this region,' aren't we losing the predictive power that comes from assuming necessity?"

  ### 10. Falsifiability (The Closer)
  **The Ask:** Finally, I want to ask about the limits of the view. As a software engineer, I'm used to systems being testable. Is there any evidence, observation, or logical proof that could convince *you* that Modal Realism is false? Or is this a framework that is compatible with any possible state of our actual world?

  *   **Likely Lewisian Defense:** She may admit it's a metaphysical framework rather than a scientific hypothesis, so it's not empirically falsifiable in the traditional sense.
  *   **Your Follow-Up:** "If it's compatible with every possible observation we could make, how do we distinguish it from a faith position? At what point does a theory that explains everything risk explaining nothing?"
