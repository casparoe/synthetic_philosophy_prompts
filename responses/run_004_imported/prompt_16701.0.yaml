prompt: |-
  I run a tiny philosophy podcast on the side (got nerd-sniped by Max Tegmark's mathematical universe stuff a couple years back, which led me down a rabbit hole into David Lewis's actual modal realism). Next weeks guest defends the full Lewis-style view -- other possible worlds are just as concrete and real as ours, not some abstract stand-in. Im a software engineer, not a philosophy person, so I skimmed 'On the Plurality of Worlds' to prep but I don't trust myself to improvise sharp follow-ups live.

  Can you draft 8-10 interview questions that go beyond her just restating the view? I want at least one question each on: the 'incredulous stare' (Lewis's own term) that doesn't let her off the hook with 'well that's not really an argument'; how we're supposed to have epistemic access to worlds that are causally sealed off from ours if they're genuinely out there; whether calling 'actual' indexical (like 'here' or 'now') actually solves anything or just relabels the problem; and whether the recombination principle she'll probably reach for to explain modality without circularity secretly smuggles in modal notions already. Also work in Kripke's old complaint that counterpart theory changes the subject -- that I shouldn't care what happens to some guy who merely resembles me in another world. For each, give me a quick follow-up keyed to whatever answer she's most likely to give, and end with one question on what evidence, if any, could convince her the view is false.
