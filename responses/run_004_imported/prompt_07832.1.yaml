      *(Drafting thought)*: Make sure to mention that taxonomy relies on *kinds*, not just arbitrary predicates. "Raven" and "Black" are arguably less natural than "Species X" and "Wing Pattern." This touches on Quine's "natural kinds" which resolves some of the paradox's sting. I should include that.

      *(Refining the Good argument)*: Good's point is that confirmation is relative to background knowledge $K$. If $K$ tells us ravens are rare, a black raven is strong evidence. If $K$ tells us non-black things are ubiquitous, a white shoe is weak evidence. In entomology, $K$ tells us species are distinct clusters.

