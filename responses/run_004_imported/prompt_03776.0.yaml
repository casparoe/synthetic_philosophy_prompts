answer: |-
  To distinguish Epistemic Contextualism (EC) from Pragmatic Encroachment (PE)—often formalized as Subject-Sensitive Invariantism (SSI)—you must look past their shared verdicts on the standard Bank Cases. In the standard cases, the subject's stakes and the attributor's stakes are assumed to align (or the attributor is assumed to be a neutral observer adopting the subject's perspective). This alignment masks the structural divergence between the theories.

  Here is the breakdown of the mechanisms, a case where they diverge, and the theoretical costs each incurs.

  ### 1. The Mechanism: Where is the Semantic Action?

  The fundamental difference lies in **whose context determines the truth conditions** of a knowledge attribution sentence (e.g., "Hannah knows the bank is open").

  **Epistemic Contextualism: The Attributor's Context**
  For the contextualist, the word "knows" is an indexical, similar to "tall," "here," or "I." Its semantic content shifts depending on the context in which the sentence is *uttered*.
  *   **The Mechanism:** The practical stakes, salience of error, or conversational purposes of the **speaker (the attributor)** raise or lower the epistemic standard required for the word "knows" to apply.
  *   **The Prediction:** To predict the truth value of "S knows that p," look at the **Attributor**. If the attributor is in a high-stakes conversation, "knows" demands near certainty. If the attributor is in a casual conversation, "knows" demands only standard justification. The subject's actual stakes are irrelevant to the *meaning* of the word, though they may be relevant to whether the subject meets the standard.

  **Pragmatic Encroachment (SSI): The Subject's Context**
  For the proponent of pragmatic encroachment, the word "knows" has a stable, invariant semantic content. However, the *facts* that determine whether someone satisfies that content include practical factors.
  *   **The Mechanism:** Knowledge is a relation that requires evidence sufficient to **act** on the proposition. Since the amount of evidence required to rationally act depends on the stakes of the action, the stakes of the **subject** partially constitute whether the subject knows.
  *   **The Prediction:** To predict the truth value of "S knows that p," look at the **Subject**. If the subject faces high stakes, they need more evidence to know. If the subject faces low stakes, they need less. The attributor's stakes are irrelevant to the truth of the claim; the attributor is simply reporting on a fact about the subject.

  **Gut-Level Grasp:**
  *   **Contextualism:** "Knows" changes meaning depending on **who is speaking**.
  *   **Pragmatic Encroachment:** "Knows" keeps its meaning, but whether you **have it** depends on what is at risk for you.

  ### 2. The Divergence Case: The High-Stakes Subject, Low-Stakes Attributor

  To see these theories come apart, we must decouple the subject's stakes from the attributor's stakes. In the standard Bank Case, Hannah has high stakes, and we (the attributors) usually discuss her in a philosophical seminar (low stakes), but we often implicitly adopt her standards. Let's make the attributor explicitly indifferent.

  **The Case:**
  *   **Subject (Hannah):** Hannah has a high-stakes situation. If she fails to deposit a check by Saturday, her mortgage will be foreclosed, and she will be homeless. Her evidence is standard: she was at the bank two weeks ago on a Saturday and it was open. She has not checked recent hours.
  *   **Attributor (Keith):** Keith is Hannah's casual acquaintance. He is betting a trivial amount of money (a penny) with a friend on whether Hannah *knows* the bank is open. Keith has no interest in whether Hannah actually gets the money deposited; he is merely gossiping. Keith's conversation is explicitly low-stakes.
  *   **The Utterance:** Keith says, "Hannah knows the bank is open."

  **The Verdicts:**

  *   **Epistemic Contextualism predicts: TRUE.**
      *   *Reasoning:* The truth conditions are set by Keith's context. Keith is in a low-stakes conversation (betting a penny). Therefore, the word "knows" in Keith's mouth expresses a low epistemic standard. Hannah meets this low standard (her evidence is sufficient for ordinary contexts). Therefore, Keith's statement is true.
      *   *Note:* Even though Hannah is stressed, Keith's low-stakes context lowers the bar for the word he is using.

  *   **Pragmatic Encroachment predicts: FALSE.**
      *   *Reasoning:* The truth conditions are invariant, but Hannah's status depends on her stakes. Hannah is in a high-stakes situation (homelessness). Her evidence (memory from two weeks ago) is not strong enough to warrant action given those stakes. Therefore, she does not know. Keith's statement attributes knowledge to her. Since she lacks knowledge, Keith's statement is false.
      *   *Note:* Keith's low stakes are irrelevant. He is making a claim about Hannah, and Hannah's situation determines the fact of the matter.

  **Why this matters:**
  In this case, Contextualism makes knowledge attribution easy for the speaker (Keith can truthfully say she knows), while Pragmatic Encroachment makes it hard (Keith speaks falsely because Hannah is under pressure). This highlights that Contextualism is a thesis about *language and assertion*, while Pragmatic Encroachment is a thesis about the *nature of knowledge itself*.

  ### 3. The Strongest Objections: Semantic Blindness vs. Impurism

  Both views solve the Bank Cases, but they do so by accepting a significant theoretical cost.

  **The Cost of Contextualism: Semantic Blindness**
  The most damaging objection to Contextualism is that it requires an implausible **error theory** regarding ordinary speakers.
  *   **The Charge:** If "knows" is context-sensitive like "tall," competent speakers should be able to recognize shifts in meaning. If I say "I am tall" in a room of jockeys, and then "I am not tall" in a room of basketball players, I understand that the meaning of "tall" shifted. I do not think I contradicted myself.
  *   **The Problem:** In knowledge cases, speakers do not behave this way. If Hannah says "I know" in the morning (low stakes) and "I don't know" in the afternoon (high stakes), she feels she has **retracted** her earlier claim. She thinks she was *wrong* before, not that she was using a different word. Contextualism implies that ordinary speakers are systematically blind to the context-sensitivity of their own central epistemic term. It saddles the theory with the claim that we are all confused about how our own language works, mistaking semantic shifts for changes in fact. This "semantic blindness" is linguistically anomalous and makes the theory seem like it saves the phenomena only by insulting the competence of speakers.

  **The Cost of Pragmatic Encroachment: The Purist Intuition**
  The most damaging objection to Pragmatic Encroachment is that it violates the traditional conception of knowledge as a purely cognitive, truth-related state (often called **Purism**).
  *   **The Charge:** Knowledge is supposed to be a relation between a mind and the truth. It should depend on truth-relevant factors: belief, truth, and evidence (reliability, justification). Practical stakes (how much I care, what I lose if I'm wrong) are not truth-relevant. My desire for a check to clear does not make the bank more or less likely to be open, nor does it make my evidence stronger.
  *   **The Problem:** By allowing practical stakes to determine knowledge, PE severs the tight link between knowledge and truth. It implies that two agents with identical evidence, identical beliefs, and identical reliability regarding $p$ can differ on whether they *know* $p$ solely because one cares more about $p$. This makes knowledge "impure." The cost is that it becomes difficult to explain why knowledge is the norm of assertion or belief if knowledge itself is partly constituted by non-epistemic, practical factors. It risks turning "knowledge" into "justified confidence for action," which many epistemologists argue is a different category entirely.

  ### Summary for Adjudication

  When facing a novel case, ask yourself two questions to predict the theories:

  1.  **Who is talking?** If the theory makes the truth of the sentence depend on the speaker's stakes, it is **Contextualism**.
  2.  **Who is knowing?** If the theory makes the fact of knowledge depend on the subject's stakes, it is **Pragmatic Encroachment**.

  To choose between them, you must decide which cost you prefer to pay: Are you willing to accept that ordinary speakers are blind to the meaning of "knows" (Contextualism), or are you willing to accept that practical interests can change whether someone has a cognitive grasp of the truth (Pragmatic Encroachment)?
