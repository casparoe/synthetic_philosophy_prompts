      *   **Core Theme:** Confucian Role Ethics (specifically Ames/Rosemont interpretation). A person *is* the sum of their relations, not an autonomous individual occupying roles.
      *   **Key Conflict:** Particularistic obligation (duty to specific relations) vs. Universalistic/Impersonal duty (rule of law, abstract morality).
      *   **Key Reference:** *Analects* 13.18 (The Straight Body vs. The Straight Testimony / Father covers for Son).
      *   **Constraint 1:** Original short story.
      *   **Constraint 2:** Setting is flexible (contemporary fine), but avoid "Immigrant kid vs. Strict Traditional Parents" cliché.
      *   **Constraint 3:** No "finding true self/breaking free" resolution. The conflict must remain unresolved or resolve in a way that affirms the "self-as-relations" ontology. It needs to feel unsettling/strange, not empowering in a Western individualist sense.
      *   **Tone:** Philosophical bite, serious, nuanced.

  2.  **Deconstruct the Philosophy for Narrative:**
      *   *Western View:* I have a core "I". I choose to be a father. If being a father conflicts with the Law, "I" must decide which rule to follow.
      *   *Confucian Role Ethics View:* I *am* a father. To act against the fatherhood is to cease to be *me*. There is no "I" separate from the fatherhood to make the choice. The "uprightness" (Zhi) is found in preserving the relationship, not adhering to an abstract statute.
      *   *The Challenge:* How to write a character who doesn't feel like they are *suppressing* their true self, but rather *existing* as the relation? The tension shouldn't be internal guilt vs. freedom, but rather a structural collapse if the relation breaks.

  3.  **Brainstorming Settings & Scenarios:**
