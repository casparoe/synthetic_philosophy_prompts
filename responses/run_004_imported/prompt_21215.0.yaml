      *   *Idea 3: Legal/Criminal.* The original sheep stealing scenario updated. A cover-up.
      *   *Idea 4: Academic/Scientific.* Plagiarism or data falsification between mentor and student (father/son dynamic).
      *   *Idea 5: Blue Collar/Union.* Safety violations.
      *   *Selection:* Let's go with a specialized trade or craft. Something where skill and lineage are intertwined. A restoration expert? An architect? Let's try **Archival/Restoration Work**. It deals with preserving the past (ancestry) vs. objective truth (history).
      *   *Refinement:* Let's make it about **Accounting/Auditing** but in a family business context, or perhaps **Law**. Actually, let's look at the "Sheep Stealing" analogy directly. It's about theft/fraud. Let's make it a **Family Logistics/Shipping Empire**. It feels modern, systemic, and high stakes.
      *   *Wait, avoid the "Immigrant" cliché.* So, let's make it a white, old-money American family, or a generic corporate setting where the "Confucian" element is cultural osmosis or just structural, not ethnic. Or, better yet, a setting where the *role* is the only thing that matters, regardless of culture. Let's try a **Fire Investigation** scenario. One person investigates a fire caused by a relative.
      *   *Better Idea:* **Algorithmic Trading/Finance.** A son works for a firm auditing his father's fund.
      *   *Best Idea:* **A Small Town Sheriff/Coroner dynamic.** Or **A Judge and a Defendant.**
      *   *Let's pivot:* To really hit the "Self is Relations" angle, the character needs to feel *incomplete* without the other. If the father falls, the son ceases to exist.
