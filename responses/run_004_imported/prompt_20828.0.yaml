      *   **Point 3: The Critical/Ironic Reading (Nuanced View).** Why might someone think it's ironic? Because the *process* to get there is violent (breeding, punishment). Also, the sovereign individual eventually gets co-opted by slave morality (guilt). So, is he the *end* or just a *transition*?
