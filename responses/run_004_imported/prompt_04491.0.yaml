      *   *Non-Akrasia Constraint (NAC):* Usually formulated as "It is irrational to believe $P$ and believe that one shouldn't believe $P$" or credal versions ("It is irrational to have credence $x$ in $P$ while having credence $y$ that the rational credence in $P$ is $z$, where $x \neq z$").
      *   *The User's Thesis:* "NAC *by itself* grounds a policy of deferring to HOE."
      *   *Potential Pitfall:* This is a controversial claim. Many philosophers argue NAC *motivates* deference but doesn't strictly *entail* specific updating rules without additional assumptions (like Total Evidence views vs. Conciliationism). The "Implied Rule" isn't universally agreed upon.
      *   *The Specific Question:* Is there a formula? Yes, there are formal models (e.g., Christensen's "Independence," Elga's "Calibration," Greco's "Defeat").

  3.  **Deconstructing the "Implied Rule":**
      *   If the pilot is hypoxic, her first-order reasoning is compromised.
      *   HOE suggests her reliability is 0.5.
      *   *Naive View:* New Credence = Reliability Statistic (0.5).
      *   *Sophisticated View:* It depends on the prior probability of hypoxia, the base rate of fuel sufficiency, and how the HOE interacts with the first-order evidence.
      *   *Key Literature:* David Christensen ("Disagreement, Question-Begging, and Epistemic Self-Doubt"), Adam Elga ("Lucky to Be Rational"), Sophie Horowitz ("Epistemic Akrasia"), Maria Lasonen-Aarnio (critiques of NAC).

