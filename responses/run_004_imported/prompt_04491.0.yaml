      *   **User's Goal:** Build a term paper arguing that NAC *by itself* grounds a policy of deferring to higher-order evidence (HOE) about one's reliability.
      *   **Specific Question:** What is the implied rule for credence shift? Should it track the reliability statistic exactly (e.g., drop to 0.5), or is there a more general formula in the literature?

