prompt: |-
  My friend Priya's getting married in a few weeks and asked me to give the maid-of-honor toast (I'm a 4th-year phil PhD student, philosophy of language, so she keeps joking this is my Super Bowl). Her love story is basically a walking Frege's puzzle and I wanna use that without being insufferable about it. She matched with her now-husband Dev on a dating app under his real name, wrote him off as boring, then met him again eight months later at her climbing gym, where everyone calls him "Marmot" for reasons nobody can explain, and fell for him having zero idea it was the same guy -- someone eventually had to tell her "Marmot is Dev" before it clicked, and she swears that sentence knocked the wind out of her in a way "Dev is Dev" never could of. About a third of the guests are her philosophy cohort and will clock the Hesperus-Phosphorus thing instantly; everyone else just wants a nice wedding speech. Write me the toast -- around 4 minutes read aloud, work the sense/reference angle in for the nerds without it turning into a lecture for her aunts, and land on an actual closing line, not just "anyway, to the happy couple."
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** 4th-year Philosophy PhD student (Philosophy of Language).
      *   **Occasion:** Maid of Honor toast at friend Priya's wedding.
      *   **Audience:** Mixed. ~1/3 Philosophy cohort (will get Frege references), ~2/3 General guests (family, aunts, non-academic friends).
      *   **Key Story:** Priya matched with Dev on an app (real name), thought he was boring. Met him 8 months later at a climbing gym (nickname "Marmot"), fell for him. Didn't realize they were the same person until someone said "Marmot is Dev."
      *   **Key Quote/Feeling:** Priya says "Marmot is Dev" knocked the wind out of her in a way "Dev is Dev" never could. (This is a direct nod to Frege's *On Sense and Reference* regarding Hesperus/Phosphorus).
      *   **Tone:** Witty, warm, not insufferable/pretentious. Needs to balance the academic joke with genuine emotion.
      *   **Length:** Around 4 minutes read aloud (approx. 500-600 words at a moderate pace).
      *   **Requirement:** Must land on an actual closing line, not a generic "cheers."

  2.  **Deconstruct the Frege Reference (for accuracy and humor):**
      *   *The Puzzle:* How can "a = a" (Dev is Dev) be trivial, while "a = b" (Marmot is Dev) be informative?
      *   *Frege's Solution:* Sense (*Sinn*) vs. Reference (*Bedeutung*). The reference is the object (Dev). The sense is the mode of presentation (The App Guy vs. The Climbing Marmot).
      *   *Application:* Priya knew the *reference* (Dev) early on, but didn't grasp the full *sense* until the gym encounter unified them. The identity statement carried cognitive value.
      *   *Risk:* Explaining this too dryly bores the aunts. Keeping it too vague loses the PhD cred.
      *   *Solution:* Use the story to illustrate the concept without defining the concept explicitly. Let the philosophers smirk and the aunts smile at the irony.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, the "Super Bowl" joke, and set a warm tone. Establish the relationship.
      *   **The Story (The Setup):** Tell the dating app vs. climbing gym story. This is the meat of the speech.
      *   **The Philosophy Pivot:** Introduce the Frege angle. Keep it light. "For those of you who know..." vs. "For the rest of you..."
