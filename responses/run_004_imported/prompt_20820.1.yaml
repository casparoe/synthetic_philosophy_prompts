prompt: |-
  I'm a third-year PhD student in evolutionary biology, and this semester I've been the student representative on my department's committee that reviews second-year students' dissertation proposals before they can advance to candidacy. A proposal now in front of us, from a labmate who works on Anolis lizards, argues that the elaborate color pattern on the male dewlap in her focal species is a sexually selected signal shaped by female choice, and it lays out a clean set of selection-gradient measurements to test that claim. What the proposal doesn't do, even in a single paragraph, is engage with the possibility that the pattern is a "spandrel" in Gould and Lewontin's sense -- a byproduct of pigment-pathway constraints tied to some other, differently selected trait, rather than itself a target of selection. Two of the senior faculty on the committee want to withhold approval until she adds a section addressing this alternative and proposing some way to test between it and her preferred hypothesis. Two others, including my advisor, think that standard can never really be satisfied, since one can always redescribe any trait as a possible byproduct of something else, and that Gould and Lewontin's critique, whatever its merits as a corrective, has never come paired with an alternative research program rigorous enough to make "you haven't ruled out non-adaptation" anything other than a rhetorical trump card. If we adopt it as a committee standard, they worry, we could hold up almost any adaptationist proposal indefinitely, including good ones.

  I have to draft the memo we'll circulate before we vote next week, and I don't want it to just split the difference by gesturing vaguely at "more consideration of alternatives." Could you write that memo for me? It should reach a specific recommendation -- approve, reject, or approve with named conditions and a deadline for meeting them -- and it should take seriously, rather than wave away, the worry that a non-adaptive alternative can always be posited for any trait and so is not automatically entitled to the same evidentiary weight as a hypothesis actually under test; I need something that could change the minds of the two committee members who hold that view, not just outvote them.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in evolutionary biology.
      *   **Role:** Student representative on the department committee reviewing 2nd-year dissertation proposals (advancement to candidacy).
      *   **Task:** Draft a memo for the committee to circulate before voting.
      *   **Subject:** A labmate's proposal on *Anolis* lizard dewlap coloration (sexual selection vs. spandrel/byproduct).
      *   **Conflict:**
          *   Faculty Group A (2 members): Wants the student to address the "spandrel" hypothesis (Gould & Lewontin) and propose tests to distinguish it from adaptation.
          *   Faculty Group B (2 members, including User's advisor): Worries this sets an impossible standard ("you can always posit a non-adaptive alternative"), potentially stalling good adaptationist research indefinitely. Sees G&L's critique as rhetorical rather than a rigorous research program.
      *   **Goal:** Reach a *specific recommendation* (Approve, Reject, or Approve with Conditions). It cannot be a vague compromise. It must address the epistemological worry of Group B (that non-adaptive hypotheses are unfalsifiable moving targets) while satisfying Group A's desire for rigor. It needs to persuade Group B, not just outvote them.
      *   **Tone:** Professional, academic, nuanced, decisive, respectful of both theoretical positions.

  2.  **Deconstruct the Scientific/Philosophical Issue:**
      *   *The Adaptationist Programme:* Assumes traits are optimized by natural/sexual selection. Needs evidence of function and fitness benefit.
      *   *The Spandrel/Byproduct Critique:* Traits can arise due to developmental constraints, genetic correlation, or phylogenetic inertia without direct selection on that specific trait.
      *   *The Impasse:* Group B is right that you can't rule out *every* possible byproduct hypothesis (infinite regress). Group A is right that ignoring *plausible* byproduct hypotheses makes the adaptationist claim weak.
      *   *The Solution:* The student doesn't need to rule out *all* non-adaptive hypotheses. She needs to rule out the *most plausible* ones or demonstrate that the adaptive hypothesis has significantly more explanatory power than the null (byproduct) model. The key is shifting from "prove it's not a spandrel" to "demonstrate the signal carries information independent of constraint."

  3.  **Determine the Recommendation:**
      *   *Reject:* Too harsh for a 2nd-year proposal. The core idea (sexual selection on dewlaps) is standard and likely viable.
      *   *Approve:* Ignores the valid methodological concern raised by Group A. Risks a weak dissertation.
      *   *Approve with Conditions:* The sweet spot. It validates Group A's concern (rigor) but limits the scope to satisfy Group B (feasibility). The condition shouldn't be "prove it's not a spandrel." It should be "explicitly define the null model of constraint and show how your data distinguishes signal from noise."

  4.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Opening:** State the purpose and the specific proposal.
      *   **Summary of Discussion:** Acknowledge the strength of the proposal (selection gradients) but highlight the specific point of contention (alternative hypotheses).
      *   **The Core Argument (The "Persuasion" Part):** This is crucial. I need to articulate *why* addressing the spandrel hypothesis isn't an infinite regress.
          *   *Key distinction:* Not "rule out all byproducts," but "evaluate the *specific* developmental constraints relevant to *Anolis* pigmentation."
          *   *Epistemological framing:* Adaptationism isn't the default; it's a hypothesis that needs to outperform a null model. The null model isn't "nothing," it's "phylogenetic/developmental expectation."
          *   *Addressing Group B:* Acknowledge their fear of paralysis. Frame the requirement as *model comparison*, not *proof of negation*.
      *   **The Recommendation:** Approve with Conditions.
      *   **The Conditions:** Specific, actionable, time-bound.
          1.  Add a section on "Alternative Explanations & Constraints."
          2.  Specify *which* constraints are plausible (e.g., pleiotropy with stress hormones, phylogenetic inertia).
          3.  Propose a specific analysis (e.g., phylogenetic comparative method, genetic correlation measurement) to weigh the adaptive model against the constraint model.
      *   **Closing:** Encouraging tone, focus on dissertation robustness.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Tell her to test for genetic correlations.
      *   *Correction:* That might be too hard for a PhD proposal. Keep it methodological. She needs to *address* it in the proposal, not necessarily solve it before candidacy. The proposal needs to show she *knows* how to distinguish them.
      *   *Addressing Group B:* I need to use language that resonates with adaptationists. Use terms like "null model," "explanatory power," and "parsimony." Avoid sounding like a strict constructionist who thinks adaptationism is dead.
      *   *Tone Check:* Ensure I don't sound like I'm taking sides personally. I am the student rep facilitating a decision. The voice should be institutional but intellectually sharp.

  6.  **Final Polish:**
      *   Check the deadline.
      *   Ensure the distinction between "infinite regress of skepticism" and "rigorous model selection" is clear.
      *   Make sure the recommendation is bolded or clearly visible.

  7.  **Final Review against constraints:**
      *   Specific recommendation? Yes (Approve with Conditions).
      *   Addresses Group B's worry? Yes (by framing it as model comparison, not proof of negation).
      *   Addresses Group A's worry? Yes (requires explicit engagement).
      *   Tone appropriate for PhD student to faculty? Yes, respectful but authoritative on procedure.

  *(Self-Correction on Tone)*: Wait, as a student rep, I shouldn't sound like I'm lecturing the faculty. I need to frame this as a synthesis of the committee's discussion that leads to a procedural path forward. I will frame the epistemological argument as the "Committee's Consensus on Standards" rather than "My Opinion."

  *(Refining the Epistemology)*: The key to winning over Group B is to argue that ignoring constraints actually *weakens* the adaptationist claim. If you don't measure the constraint, you don't know the magnitude of the selection. It's about effect size, not just existence. I will incorporate this.

  8.  **Finalizing the Text:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Dissertation Advancement Committee, Department of Evolutionary Biology
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Candidacy Proposal: [Student Name], *Anolis* Dewlap Signaling

  **Purpose**
  This memo summarizes the committee's review of [Student Name]'s dissertation proposal, "Sexual Selection and Signal Evolution in *Anolis* Dewlaps," and offers a formal recommendation regarding advancement to candidacy. While the committee agrees that the proposal outlines a methodologically sound approach to measuring selection gradients, there was significant debate regarding the treatment of alternative non-adaptive hypotheses. This document synthesizes that debate and proposes a path forward that maintains rigorous standards without imposing impossible evidentiary burdens.

  **Summary of Committee Discussion**
  The committee acknowledges the strength of the proposed selection-gradient analysis. The plan to quantify female preference and correlate it with male reproductive success is consistent with established best practices in behavioral ecology.

  However, a division arose regarding the proposal's treatment of the null hypothesis. Two members argued that the proposal treats the adaptationist hypothesis (female choice) as the default, failing to engage with the possibility that dewlap patterning is a byproduct (or "spandrel") of developmental constraints or pleiotropic effects linked to other selected traits (e.g., stress response or thermoregulation). They argued that without addressing this, the study risks conflating correlation with adaptation.

  Two other members, while acknowledging the theoretical validity of the critique, expressed concern that mandating the disproof of non-adaptive hypotheses sets a precedent that could stall research indefinitely. They argued that because one can always posit a hypothetical byproduct, requiring a student to "rule out" spandrels risks turning a methodological caution into a rhetorical veto against adaptationist research.

  **Recommendation**
  **The committee should vote to APPROVE WITH CONDITIONS.**

  Advancement is contingent upon the student submitting a revised proposal section (approx. 2–3 pages) by **[Date, e.g., November 10, 2023]** that explicitly addresses alternative hypotheses.

  **Rationale and Epistemological Framework**
  To address the concerns regarding infinite regress and research paralysis, the required revision should not be framed as "proving the trait is not a byproduct." Instead, it should be framed as **Model Comparison.**

  We must avoid the trap of treating "Adaptation" and "Byproduct" as binary switches where the latter is an unfalsifiable skepticism. In modern evolutionary quantitative genetics, these are competing models with different predictive expectations.
  1.  **Addressing the "Impossible Standard" Concern:** We are not asking the student to rule out *all* conceivable byproduct hypotheses. She is only required to address *plausible* constraints specific to *Anolis* physiology and phylogeny (e.g., known pigment pathway correlations). This limits the scope to testable biology, not philosophical skepticism.
  2.  **Strengthening the Adaptationist Claim:** Ignoring constraints does not protect the adaptationist hypothesis; it weakens it. If dewlap color is genetically correlated with a trait under viability selection (e.g., immune function), the selection gradient measured on the dewlap may be indirect. By explicitly modeling these constraints, the student can isolate the *direct* selection on the signal. This actually secures the adaptationist claim against future criticism rather than undermining it.
  3.  **The Standard for Candidacy:** A dissertation proposal need not solve the problem, but it must demonstrate the candidate knows how to distinguish signal from noise. The requirement is to propose a method (e.g., phylogenetic comparative controls, measurement of genetic covariances, or developmental pathway analysis) that allows the data to weigh the adaptive model against the constraint model.

  **Specific Conditions for Revision**
  To satisfy the committee, the revised section must:
  1.  **Identify Specific Constraints:** List the top 1–2 biologically plausible non-adaptive mechanisms for dewlap variation in this clade (e.g., pleiotropy with hormonal stress axes or phylogenetic inertia).
  2.  **Propose Discriminating Tests:** Outline how the proposed data collection will distinguish between the sexual selection model and the constraint model. For example, if the pattern is a byproduct of a physiological constraint, does it predict a specific correlation with body condition that the sexual selection model does not?
  3.  **Define the Null:** Explicitly state that the adaptationist hypothesis will only be supported if it explains significantly more variance than the constraint-based null model.

  **Conclusion**
  Adopting this standard does not validate the view that non-adaptive hypotheses always hold equal weight to adaptive ones. Rather, it enforces the principle that adaptation is a hypothesis to be tested, not an assumption to be verified. This revision will strengthen [Student Name]'s dissertation by preempting the most common theoretical critiques of signal evolution studies, ensuring her eventual defense focuses on empirical results rather than foundational premises.

  Please review this recommendation prior to our vote next week.

  **[Your Name]**
  PhD Candidate, Department of Evolutionary Biology
  Student Representative, Dissertation Advancement Committee
