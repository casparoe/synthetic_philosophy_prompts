          *   *Intuition:* If you prefer apples to oranges, you should still prefer a 50/50 mix of (apple/orange) vs. (orange/orange)... wait, better analogy: If you prefer Ticket A to Ticket B, adding a common "chance of winning nothing" to both shouldn't swap your preference.
          *   *Key feature:* Linearity in probabilities. Substitution of common components.

