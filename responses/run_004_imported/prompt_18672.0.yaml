answer: |-
  This is a profound bind, and it makes perfect sense that you feel tangled in it. You are standing at the intersection of literary theory, institutional ethics, and community dynamics. It is a very specific kind of hell to be a person who thinks deeply about textual authority when the text in question is a social contract that has been violated by the very people who wrote it.

  Your friend in academia is half-right: yes, your training predisposes you to trust the text over the whisper. In literary criticism, "The Death of the Author" is a useful tool for unlocking meaning. In institutional governance, however, ignoring authorial intent (or in this case, founder culture) is often a recipe for failure. Culture eats strategy for breakfast, and the "unwritten rule" of the vouch is the culture; the Founding Letter is just the strategy.

  However, your friend is also half-wrong. Dismissing your position as *mere* professional bias ignores the practical and moral weight of the Founding Letter. It is a public promise. To discard it because the founders privately gossiped otherwise is to accept that hypocrisy is the only real currency.

  Here is an analysis of the two camps, and a proposal for a third path that might resolve the tension between your professional instincts and the social reality.

  ### The Case for Camp A (The Burn-It-Downers)
  **The Argument:** Institutions are not defined by what they say, but by what they do. The "Kindred Spirits" note reveals the DNA of the place. The vouching system isn't a bug; it's a feature that evolved to protect that DNA.
  **The Strength:** They are correct about inertia. You cannot legisature culture change simply by pointing to a document from 1974. The network of MFA programs protecting their own is a self-perpetuating machine.
  **The Weakness:** It is wasteful and arguably elitist in a different way. Walking away abandons the endowment and the building to... whom? Often, when "reformers" leave to build something new, the new thing becomes just as exclusive within five years, while the old thing calcifies further. It privileges the purity of the reformers over the potential access of future applicants.

  ### The Case for Camp B (The Hold-To-Its-Word Camp)
  **The Argument:** The Founding Letter is the only binding social contract. The private note is anecdotal. The assets (grants, endowment) belong to the mission stated in the Letter, not the whims of the founders.
  **The Strength:** It preserves the resources. It holds the institution accountable to its public face. It aligns with the rule of law (or at least, the rule of bylaws).
  **The Weakness:** It is legally sound but sociologically naive. If you force the text without changing the *people* who interpret the text, the vouching system will just go deeper underground. You can have blind readings where the readers are all friends who recognize each other's styles.

  ### The Third Option: Radical Stewardship
  There is a path that utilizes your specific skillset without falling into the trap of ignoring human nature. It requires you to stop acting like a critic interpreting a text and start acting like an architect reinforcing a structure.

  **1. Acknowledge the "Kindred Spirits" as the Enemy, Not the Foundation.**
  Camp A uses the "Kindred Spirits" quote to say the *place* is rotten. Camp B ignores it to save the *place*. The Third Option admits that "Kindred Spirits" is the virus that infected the Founding Letter. The goal isn't to defend the founders; it's to defend the *Letter against the Founders.*

  **2. Weaponize the Text via Process.**
  You cannot just cite the Founding Letter; you must encode it into the mechanics of selection so that it cannot be ignored.
  *   **True Blindness:** If the text says "blind to who the writer knows," then the readers cannot be exclusively past fellows. Bring in outside readers (librarians, editors, even non-writers) who have no stake in the MFA ecosystem.
  *   **The Vouch Ban:** Make the prohibition of vouching explicit in the application guidelines. "Do not submit letters of recommendation. Do not contact fellows. If you do, your application is discarded." This flips the script. Currently, *not* having a vouch kills you. In this new system, *having* a vouch kills you.
  *   **Transparency:** Publish the demographics of the applicant pool vs. the accepted pool. Not names, but data. Where did they study? Who recommended them (if allowed)? If the data shows the same twenty MFA programs, the Board cannot claim they are following the Founding Letter.

  **3. The "Alumni Leverage."**
  You are on the alumni list. You teach there. You have standing. Camp A wants you to resign; Camp B wants you to defend. The Third Option asks you to **condition your participation.**
  *   You return to teach *only if* the selection committee is restructured for the next cycle.
  *   You use your stipend or influence to fund a "reader" from outside the circle.
  *   You make it known that your continued association depends on the *enforcement* of the Founding Letter, not just the reverence of it.

  ### On Your "Professional Bias"
  You worry that preferring the Text over the Intent is just academic baggage. I would argue it is actually the only ethical stance available to you.

  If you accept Camp A's premise—that the private intent of the founders overrides the public promise of the institution—you are accepting that **power determines truth.** You are agreeing that the "Kindred Spirits" whisper is more real than the printed Letter.

  If you hold to Camp B, but stop at citation, you are engaging in **fundamentalism.** You are treating the text as magic that will fix the world if you just wave it hard enough.

  The Third Option is **Stewardship.** It recognizes that the Text is a tool, not a talisman. It acknowledges that the Founders were flawed humans who wrote something better than they could embody. Your job, and the job of your cohort, is not to worship them or destroy them, but to complete the work they started but failed to finish.

  **The Verdict:**
  Camp A is morally satisfying but practically destructive. Camp B is practically sound but morally passive.
  The stronger case lies with **Camp B's principles executed with Camp A's urgency.**

  Do not walk away. Walking away cedes the territory to the gatekeepers. But do not simply defend the status quo. Use your position to force the institution to actually *become* what it says it is. If they refuse to implement structural changes that enforce the blind reading (outside readers, banned vouches, data transparency), *then* you burn it down. But you burn it down from the inside, having proven that the institution chose its culture over its charter.

  Until then, you are not biased; you are a constitutionalist. And in a time of institutional drift, that is exactly what is needed.
