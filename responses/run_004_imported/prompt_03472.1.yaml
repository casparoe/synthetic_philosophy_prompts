answer: |-
  It is completely understandable why you feel this way. As a practicing physicist, Popper's *intuition* about scientific progress resonates deeply because it mirrors the actual workflow of the lab: propose a model, test it, find where it breaks, propose a better one. The idea that General Relativity (GR) is "closer to the truth" than Newtonian mechanics feels like an objective fact of your professional life.

  However, to answer your question directly: **You are missing a pivotal moment in the history of philosophy of science that occurred shortly after Popper published his definition.**

  While Popper's *intuition* was widely shared, his *formal definition* of verisimilitude (truth-likeness) was proven logically untenable. This is why philosophers are still debating it; they are not ignoring Popper's solution, but rather trying to fix a definition that broke.

  Here is the breakdown of what happened, why the definition failed, and what philosophers are doing now.

  ### 1. The 1963 Proposal
  In *Conjectures and Refutations* (1963), Popper attempted to formalize verisimilitude. He defined the verisimilitude of a theory $T$ as a function of its **truth-content** (the set of true statements it entails) minus its **falsity-content** (the set of false statements it entails).

  Intuitively, this makes perfect sense. If Theory B entails all the true consequences of Theory A, plus more, and entails fewer false consequences, then B is closer to the truth. This matches your experience with Newton vs. Einstein.

  ### 2. The 1974 Collapse
  The problem was that this definition relied on classical logic in a way that produced absurd results when comparing **false** theories. Since both Newtonian mechanics and General Relativity are strictly false (Newton's is an approximation; Einstein's likely breaks down at singularities), we need a definition that can rank false theories.

  In 1974, two logicians, **Pavel Tichý** and **David Miller**, independently published proofs demonstrating that Popper's definition was flawed.

  **The gist of the proof:**
  Under Popper's formal definition, if two theories are both false, it is logically impossible for one to have greater verisimilitude than the other.
  *   If Theory A is false, it has some falsity-content.
  *   To be "closer to the truth" than Theory B, Theory A would need more truth-content and less falsity-content.
  *   However, Tichý and Miller showed that if a false theory entails *any* new true statement, it necessarily entails *new* false statements as well (due to the nature of logical conjunction and disjunction).
  *   **The Result:** According to Popper's formalism, no false theory is closer to the truth than any other false theory.

  This meant that, logically speaking, Popper's definition could not say that GR is closer to the truth than Newtonian mechanics. It rendered the concept useless for the exact scenario you care about most: progress between imperfect theories.

  Popper himself acknowledged this failure in the postscript to later editions of his work, admitting that he had not succeeded in formalizing the concept satisfactorily.

  ### 3. Why Philosophers Are Still Writing Papers
  You asked why philosophers still debate this rather than applying his definition. The answer is that the "debate" is actually a **repair project**.

  Since the Tichý/Miller proofs, a sub-field often called the "verisimilitude industry" has emerged. Philosophers of science accept Popper's *goal* (we need to measure closeness to truth) but reject his *math*. They are currently split into two main camps trying to salvage the concept:

  1.  **Content Approaches:** Trying to modify Popper's truth/falsity content definitions to avoid the Tichý/Miller collapse (e.g., restricting the language or the types of consequences counted).
  2.  **Likeness Approaches:** Arguing that "truth-content" is the wrong metric. Instead, they use possible-world semantics (inspired by Kripke). They measure the "distance" between the actual world and the possible worlds in which the theory is true. (Think of it like a metric space: Theory A is 5 units from reality, Theory B is 2 units from reality).

  Prominent figures like **Ilkka Niiniluoto** and **Graham Oddie** have spent decades developing these alternative formalisms. So, when you see recent papers on verisimilitude, they are not ignoring Popper's solution; they are responding to the fact that his solution was mathematically broken.

  ### 4. Why Your Intuition Remains Valid
  It is important to validate your experience as a physicist. The failure of Popper's *logic* does not mean your *practice* is wrong.

  *   **Pragmatism vs. Logic:** In the lab, "closer to the truth" is often a proxy for "greater predictive accuracy within a specific domain" or "better unification of phenomena." Philosophers struggle to formalize this because natural language and scientific practice are richer than the binary true/false of classical logic.
  *   **The Value of Popper:** Even though his formal definition of verisimilitude failed, his broader epistemological point remains influential: science progresses by error elimination. You don't need a perfect metric of truth-likeness to agree that a theory that survives rigorous testing is preferable to one that does not.

  ### Summary
  You aren't missing a philosophical nuance; you are missing a historical technicality. Popper did not settle the matter in the 1960s. He proposed a definition that was widely accepted for a decade until logicians proved it was incoherent.

  Philosophers continue to write on this because the question ("Can we rigorously define scientific progress?") is vital, but Popper's specific answer was incorrect. If you wish to read more on the current state of this debate, I would recommend looking into **Ilkka Niiniluoto's *Truthlikeness* (1987)** or **Graham Oddie's *Likeness to Truth* (1986)**. They treat the physicist's intuition with respect while grappling with the logical hurdles Popper could not clear.
