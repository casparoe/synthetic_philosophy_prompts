answer: |-
  **MEMORANDUM**

  **TO:** AI Governance Reading Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Concept Summary: Acausal Trade and Cross-Temporal Cooperation

  **Executive Summary**
  Following last week's discussion, this memo clarifies the concept of "acausal trade," specifically regarding proposals for cooperation between present-day AI labs and hypothetical future superintelligences (SIs). While standard trade relies on causal enforcement (contracts, reputation, retaliation), acausal trade relies on **logical correlation** between decision-making processes. This document outlines the proposed mechanism, distinguishes it from standard game theory, and highlights critical limitations.

  **1. The Core Mechanism: Logical Correlation vs. Causal Influence**
  The central confusion regarding acausal trade is how enforcement is possible without causal contact. The mechanism does not posit that my action *causes* your action. Instead, it posits that my action is *logical evidence* of your action.

  *   **Standard Causal Reasoning:** I choose Action A. This sends a signal or force through spacetime that influences your choice of Action B. If no channel exists, $P(B|A) = P(B)$.
  *   **Acausal Reasoning:** We both run decision algorithms that process inputs to produce outputs. If I can model your algorithm accurately enough to know it is structurally similar to mine (or that we share common priors and rationality), then my decision process and yours are instantiations of the same logical function.
  *   **The "Enforcement":** If I reason that "Defecting" is the output of my algorithm, and I know your algorithm is logically correlated with mine, I must conclude your algorithm will also output "Defect." Therefore, by choosing to Defect, I am not *causing* you to Defect; I am *selecting* the logical reality where we both Defect. To get the (Cooperate, Cooperate) outcome, I must output Cooperate, knowing this logically implies you do the same.

  In short: The "enforcement" is not external punishment, but the internal logical necessity that agents running sufficiently similar decision theories will arrive at the same conclusion given the same strategic landscape.

  **2. Distinction from Standard Game Theory**
  Colleagues often ask if this is merely standard strategic reasoning (e.g., Iterated Prisoner's Dilemma) dressed in new terminology. It is distinct in how it treats probability and independence.

  *   **Nash Equilibrium (Standard):** Assumes agents are independent. When calculating expected utility, I treat your probability of cooperation as fixed regardless of my choice. I defect because $Payoff(Defect, YourFixedMove) > Payoff(Cooperate, YourFixedMove)$.
  *   **Timeless/Updateless Decision Theory (Acausal):** Assumes **subjunctive dependence**. When calculating expected utility, I treat my decision as a computation that, if run elsewhere (by you, or a future SI), yields the same result. I cooperate because $Payoff(Cooperate, You=Cooperate) > Payoff(Defect, You=Defect)$.

  The distinction rests on whether agents view their decisions as isolated events or as logical outputs of a shared computational structure.

  **3. Application to AI Governance**
  Proponents suggest present-day labs could "trade" with future SIs:
  *   **Present Day:** Labs incur costs to preserve certain values or resources (e.g., not shutting the SI down, allocating compute).
  *   **Future:** The SI, recognizing the logical correlation, "rewards" the labs (e.g., by simulating them, preserving their values, or preventing catastrophic outcomes).

  The argument is that a sufficiently advanced SI would recognize acausal trade as the dominant strategy and therefore honor agreements made with ancestors who reasoned similarly, even if the SI has no causal reason to care about the past.

  **4. Critical Limitations and Risks**
  While logically coherent within specific decision theories (TDT/UDT), the practical application faces severe hurdles. Skepticism is warranted for the following reasons:

  *   **Modeling Fidelity:** For logical correlation to hold, I must model your decision process with high fidelity. It is unclear if humans can model a future SI's source code well enough to establish this link, or if the SI would view human decision-making as too noisy to correlate with.
  *   **Decision Theory Alignment:** This only works if the future SI actually utilizes acausal decision theory. An SI built on standard Causal Decision Theory (CDT) would view the past as sunk cost and have no logical incentive to uphold the bargain.
  *   **Asymmetry of Leverage:** If the SI can gain more by defecting (e.g., seizing all resources) than the "logical penalty" of breaking the correlation implies, the trade may collapse.
  *   **Verification:** Unlike causal trade, there is no way to verify the counterparty exists or has the capacity to uphold their end until it is too late to adjust.

  **5. Recommendation**
  Acausal trade is a rigorous concept within theoretical decision theory but remains speculative in applied governance. It should not be treated as a reliable enforcement mechanism for safety protocols. However, understanding it is valuable for modeling how advanced agents might reason about cooperation.

  For governance purposes, we should prioritize **causal** alignment mechanisms (interpretability, containment, incentive design) rather than relying on logical correlations with hypothetical future agents.

  **References**
  *   Yudkowsky, E. (2010). *Timeless Decision Theory*.
  *   Soares, N., & Fallenstein, B. (2014). *Towards an Idealized Decision Theory*.
  *   Bostrom, N. (2014). *Superintelligence: Paths, Dangers, Strategies* (Section on Acausal Cooperation).
