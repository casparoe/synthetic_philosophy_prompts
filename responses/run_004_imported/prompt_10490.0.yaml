  Here is the breakdown of the debate, move by move.

  ### Naomi's First Move (+1)
  **Claim:** The avoidance of printing slurs even in mention contexts (e.g., "the n-word") suggests the offense attaches to the word-form itself (Prohibitionism), not speaker meaning or truth conditions, because standard semantic content is suspended in mention.

  **Reasoning:** Naomi is on solid ground here regarding the *data* and its intuitive fit with Anderson & Lepore (A&L). The use/mention distinction is a cornerstone of philosophy of language; typically, when a word is mentioned rather than used, its semantic and pragmatic effects are suspended (e.g., saying " 'Ass' has three letters" does not refer to a donkey). If the offensive force of a slur were purely a matter of truth-conditional content or standard implicature generated by *use*, mentioning the word should be innocuous. The fact that academics treat the mention as sensitive supports the A&L view that there is a brute norm attached to the lexical item itself, independent of its propositional contribution.
  **Why not higher?** She slightly overstates the case. The avoidance could be explained by a *pragmatic* or *ethical* norm that governs mention without requiring the *semantics* to be prohibitionist. We might choose not to print the word to avoid causing distress, even if the semantics allow it. So, while the data fits Prohibitionism well, it doesn't strictly rule out other theories that incorporate external norms.

  ### Owen's First Move (-1)
  **Claim:** This data doesn't distinguish theories because Conventional Implicature (CI) and presupposition content are known to "project" (survive) through embedded and quotation-adjacent contexts.

  **Reasoning:** Owen makes a category error here. In linguistics and philosophy of language, "projection" typically refers to survival through logical operators (negation, conditionals, modals), not through the use/mention distinction. Standard CI theory (e.g., Potts 2005) predicts that expressive content is suspended in pure mention contexts. If I say, "The word 'bastard' is pejorative," I am not insulting anyone, nor am I conventionally implicating illegitimacy. Owen conflates *embedding* (where CIs project) with *mention* (where standard semantic content is typically quarantined). Because his linguistic premise is technically incorrect regarding the use/mention distinction, his argument fails to defend CI theories against Naomi's specific point about mention.

  ### Naomi's Second Move (+2)
  **Claim:** The asymmetry between slurs and swear words (e.g., "fuck" is printed in phonology papers; slurs are not) shows the constraint is social practice, not semantic architecture. If it were a general feature of projecting content, it would apply to all such content.

  **Reasoning:** This is the strongest move in the exchange. It leverages a control group (swear words/blasphemy) to isolate the variable. Swear words often carry expressive content or presuppositions similar to slurs, and they are frequently printed in linguistic analysis without euphemism. If the avoidance of slurs in print were driven purely by a semantic or pragmatic mechanism (like "this content projects and is therefore dangerous to display"), we would expect consistent behavior across all expressive vocabulary. The fact that the typographic treatment diverges suggests the constraint is external to the semantic architecture—specifically, it is an ethical or institutional norm responsive to the specific historical harm of slurs, not their linguistic profile. This effectively challenges the idea that the *semantics* alone dictates the printing norm.

  ### Owen's Second Move (+1)
  **Claim:** The asymmetry is predicted by Hom-style theories because the offending content is defined by specific histories of discrimination. Only words with that content get the "kid-gloves" treatment; ordinary taboo words lack this content.

  **Reasoning:** Owen recovers well here. He correctly identifies that semantic theories of slurs (like Hom's Combinatorial Externalism) do not claim all expressive words are identical. They argue that slurs encode specific ideological perspectives rooted in oppression. Therefore, the theory *can* account for the asymmetry: the norm tracks the specific harmful content encoded by the slur, which swear words do not possess. This defeats Naomi's implication that the asymmetry *falsifies* semantic theories. However, it doesn't fully explain why that specific semantic content triggers a *mention*-taboo in academic writing while other harmful content might not, so it doesn't quite match the force of Naomi's second move.

  ### What They're Both Missing

  While Naomi and Owen are debating the semantic vs. social source of the norm, they are both overlooking two substantive factors that likely drive the publishing practice they are observing:

  1.  **Harm vs. Offense (The Audience Effect):** Both are treating the issue as a matter of *offense* or *semantic content*. However, the primary reason journals prohibit printing slurs, even in mention, is often to prevent *harm* to readers. Re-reading a racial slur can be retraumatizing for members of the targeted group, regardless of whether the word is semantically "mentioned" or "used." This is an ethical constraint on dissemination, not a semantic fact about the word. Naomi hints at this with "social practice," but framing it as "social practice" understates the material harm involved.
  2.  **Institutional vs. Philosophical Norms:** They are treating the reading list as evidence of philosophical consensus. In reality, academic publishing is governed by style guides and editorial boards that are often more conservative than the philosophers themselves. Many philosophers *argue* that we should be able to mention slurs in technical contexts (e.g., Herman Cappelen), but journals override this for risk management. The "data" they are analyzing might reflect institutional liability policies rather than the considered philosophical judgments of the authors.

  **Summary:** Naomi wins on the empirical observation (the asymmetry is real and significant), but Owen is right that semantic theories can be flexible enough to accommodate it. However, both miss that the "prohibition" they are analyzing is likely an ethical policy decision by publishers, not a direct reflection of the underlying philosophy of language.
