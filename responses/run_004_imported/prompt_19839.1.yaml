answer: |-
  Good evening. For those who don't know me, I'm Priya Okonkwo. I had the privilege of being Judith's doctoral student, and the distinct honor of surviving her supervision.

  Toasting a legal positivist is notoriously difficult. They tend to object to vague sentiments on the grounds that they lack a Rule of Recognition. So I will be precise. We are here to celebrate forty years of Judith insisting that we call things by their correct names, even when—*especially* when—the correct name is uncomfortable.

  There is a myth about Judith's school of thought. People hear "positivist" and they hear "obedience." They think Judith believes that because a rule is law, it must be obeyed. Nothing could be further from the truth. Judith's entire career has been a argument for clarity so that moral choice remains possible. 

  When the Grudge Informer case came before the postwar courts, the easy path was to say the Nazi statute was so evil it "wasn't really law." Judith said no. To call it "not law" was a lie. It was law. It was validly enacted. It was also monstrous. And because it was law, the court should have admitted it, and then passed a retroactive statute to punish the woman who used it. Why? Because lying about what law *is* blunts the weapon we need to fight what law *does*. Judith taught us that you don't protect morality by confusing it with validity. You protect it by keeping them separate, so that when you disobey, you do so with your eyes open.

  That commitment to honesty has cost her. We know the history of this department. We know the seventies. I see Owen Marsh sitting two tables away. We remember the accusation that describing a tyrant's law as "law" makes you a tyrant's friend. It was an ugly year. It was a painful fracture. But the charge was wrong then, and the silence since has been too long. Judith was never an apologist for tyranny; she was an apologist for truth. And Owen, you were never her enemy; you were her conscience. We are ready for the conversation to resume.

  But Judith's rigor isn't limited to the jurisprudence seminar. It extends to her life. Lon Fuller once titled a famous reply to Hart "Positivism and Fidelity to Law." He meant it as a critique, suggesting the two were incompatible. Judith's life argues otherwise. She demands fidelity to the truth, even when it hurts. And those of us who know her home life know she brings that same fierce fidelity to her marriage. Though I believe she once told her husband their wedding vows were binding solely because the officiant was authorized, regardless of their moral merit.

  Judith, you have spent forty years teaching us that law is not a mystery to be solved by morals, but a tool to be wielded by them. You have corrected our dinner parties, our drafts, and our assumptions. You have been stubborn, exacting, and unyielding. You have also been right.

  So, if I may propose a toast. To Judith Ansel. May your retirement be validly enacted, properly procedured, and entirely separate from any obligation to work. To Judith.
