answer: |-
  The bandages were gone, but the world had not yet arrived.

  Elias sat in the chair, his hands gripping the armrests until his knuckles whitened. For twenty-two years, his world had been a geography of texture and temperature, of echoes and air pressure. Now, it was a bombardment. Light did not feel like illumination; it felt like noise. A chaotic static of brightness that made his eyes water and his head ache.

  Dr. Aris stood across the table, her face a blur of flesh-tones that refused to settle into a distinct shape. "Take your time, Elias," she said. Her voice was an anchor. "We aren't testing how well you see. We are testing how you know."

  On the table before him sat two objects. He knew them intimately. He had held them a thousand times in the dark. To his left, the sphere: cool, continuous, offering no purchase to the fingernail, rolling away if not held firm. To his right, the cube: sharp edges that bit into the palm, flat faces that declared their boundaries, a thing that sat still and stubborn.

  They were made of the same varnished wood. He knew their weight, their grain, their thermal conductivity. They were as real to him as his own name.

  "Look at them," Dr. Aris said softly. "Don't touch. Just tell me. Which one is the ball?"

  Elias focused. His eyes twitched, trying to find a focal point. The objects were not distinct entities yet; they were patches of color interrupting the beige of the table. The one on the left was a darker smudge with a highlight that slid across its surface. The one on the right was a collection of planes, shadows pooling in what he assumed were corners.

  Logic screamed at him. *The sphere is round. The cube has corners.* He searched the visual field for "roundness." But what did roundness look like? Was it the gradient of the shadow? Was it the lack of a hard line? The object on the right cast a sharp shadow. That felt like a corner. But the light was hitting the object on the left in a way that created a hard glare.

  His tactile memory was a solid map, but his vision was a distorted compass. He felt a rising panic. The connection he expected—the instantaneous translation of touch into sight—was severed. There was no bridge.

  "The left one," Elias said, pointing a trembling finger at the cube. He felt the sharpness of the edge in his memory, but his eyes saw a dark patch that felt heavier, more substantial.

  Dr. Aris did not correct him immediately. She simply waited.

  Elias squinted. The visual data was overwhelming. Depth was a guess. Distance was a calculation he didn't have the formula for. The sphere, which he knew to be smooth, presented a visual texture of glare and shadow that looked rougher than the flat face of the cube. The cube, which he knew to be angular, presented a silhouette that, from this angle, looked hexagonal, almost soft.

  "I don't know," he whispered. The admission tasted like ash. "They look... the same. But different. I can't tell which is which."

  He was right, and he was wrong. He was right that he couldn't tell. He was wrong to expect that he should.

  "Touch them," Dr. Aris said.

  Elias reached out. His hand found the cube first. The sharp edge bit into his thumb. *Cube.* His brain snapped the label into place. He looked at it while holding it. He traced the visual line of the edge with his finger, trying to force his eyes to understand what his skin was telling him. *This line here. This is the edge.*

  He moved to the other object. His palm cupped the curve. *Sphere.* He watched his hand wrap around the visual smudge. He saw the highlight shift as he rotated it.

  "Again," Dr. Aris said, pulling his hands back to his lap. "Just look."

  The objects sat there. The silence stretched. The philosophical weight of the moment hung in the sterile air, though neither of them named it. It was the question of whether the world is one thing perceived in many ways, or many things that must be stitched together.

  Elias looked at the shadowed corner of the cube. He tried to remember the feeling of the angle. He looked at the gradient of the sphere. He tried to remember the feeling of the curve. But the memory was in a different language. The sight was raw data; the touch was meaning. They were not yet translated.

  "I still can't be sure," Elias said. He guessed again, pointing to the sphere this time.

  "Correct," Dr. Aris said. But there was no triumph in her voice. It was a fifty-fifty chance. A coin toss.

  Elias slumped. He had expected the surgery to be a key turning in a lock. Instead, it was as if someone had handed him a book written in a script he had never studied, claiming it was the story of his own life.

  "It will take time," Dr. Aris said, noting the slump of his shoulders. "Your eyes are working. Your brain is just... learning to listen to them. You have to teach them what the shadows mean. You have to teach them what an edge is."

  Elias looked back at the table. The cube and the sphere sat in the wash of afternoon light. They were no longer just tactile truths. They were visual puzzles. He realized then that he was not a man who had been given sight. He was an infant in a grown body, staring at a world that had no obligation to make sense to him.

  He reached out, not to identify, but to connect. He laid his hand on the cube, keeping his eyes open, watching the skin conform to the angle. He would have to do this a thousand times. He would have to build the bridge plank by plank, through the slow, messy labor of looking and touching, until the light finally matched the touch.

  "Tomorrow," Elias said, his voice quiet. "We try again tomorrow."

  "Tomorrow," Dr. Aris agreed.

  Elias kept his hand on the wood. He didn't let go. He knew now that seeing was not a state of being, but a verb. Something you had to do. Something you had to learn.
