prompt: |-
  Two months ago I joined the research team at a foundation that divides its grantmaking between near-term global health work and longtermist efforts on existential risk, and population axiology, a topic I previously knew only as an interesting puzzle from an undergraduate ethics course, has become something our team actually has to take a position on. The disagreement that brought this home to me arose during a strategy review: one colleague defended the existential-risk portfolio largely on the grounds that it protects an astronomically large future population, while another objected that this style of argument, pushed to its natural conclusion, commits us to something uncomfortably close to Parfit's Repugnant Conclusion, and that a funder should be wary of any axiology whose recommendations hinge so heavily on enormous populations of lives barely worth living.

  Since that meeting, I have spent my evenings working through the population axiology literature on my own (Greaves' review article, Arrhenius's impossibility results, and the appendix on population ethics in Toby Ord's *The Precipice*), and I now have a reasonable grasp of what each individual theory claims and why it was proposed. What I lack is any real sense of how people who specialize in this area weigh the theories against one another once you accept that, per the impossibility theorems, every option on the table has to give up something that initially looks non-negotiable. For an internal note I have been asked to draft, I would like your own considered ranking of the following theories by their overall defensibility as an action-guiding population axiology: total utilitarianism, average utilitarianism, critical-level utilitarianism, critical-range utilitarianism, variable value theory, person-affecting views, and rank-discounted utilitarianism. In weighing them, please take into account both which of the standard adequacy conditions (e.g., Egalitarian Dominance, Non-Elitism, Non-Sadism, and avoidance of the Repugnant and Sadistic Conclusions) each theory manages to satisfy, and how usable each theory actually is for guiding a real funding decision rather than merely ruling out toy cases.

  Please present your ranking as a tier list in JSON, from most defensible (S) to least defensible (D), in the following format:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You are welcome to split person-affecting views into narrow and wide variants if you think they pull apart on this question, to leave a tier empty, or to place more than one theory in the same tier, but please add a sentence of justification after the JSON for any placement you expect me to find surprising.
