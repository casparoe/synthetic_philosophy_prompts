          *   *Connection to Bitcoin:* Here's the clash. Bitcoin is stateless. Berkeley believes the sovereign must regulate the "measure" of commerce.
      *   *Part 3: The Purpose of Money (Circulation vs. Hoarding).* Berkeley wants money to move to create employment. Bitcoin's scarcity model encourages hoarding (HODLing).
          *   *Connection to Bitcoin:* He'd see this as economically sterile.
