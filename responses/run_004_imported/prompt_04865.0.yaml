          *   *Berkeley's View:* This aligns well. He argued against the mercantilist obsession with bullion. Money doesn't need intrinsic metal value.
      *   *Feature 2: Decentralized/No Central Authority.* No state, no bank, no sovereign control.
          *   *Berkeley's View:* This is the problem. Berkeley wanted money to be a tool of state policy to stimulate industry. A currency outside state control cannot be managed for the public good.
      *   *Feature 3: Scarcity (Fixed Supply).* Bitcoin has a cap (21 million).
          *   *Berkeley's View:* He likely preferred elastic currency (credit) based on the needs of trade and land value. Deflationary money might stifle industry (hoarding).
