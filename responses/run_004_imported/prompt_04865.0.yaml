answer: |-
  This is a fantastic discussion question, and you are right to be suspicious of the easy "Berkeley thought reality was mental, therefore digital money is real" take. That is a category error. Berkeley's economic thought in *The Querist* (1735–1737) is not merely an application of his metaphysics; it is a pragmatic, proto-Keynesian intervention into the mercantilist debates of his time.

  To answer where Berkeley would land on Bitcoin, we have to weigh his **theory of value** (which looks friendly to crypto) against his **theory of sovereignty** (which is hostile to it).

  Here is the walkthrough of that tension, grounded in the text of *The Querist*.

  ### 1. The "Ticket" Theory: Where Berkeley Might Nod
  You are correct that Berkeley is a nominalist regarding money. In the mercantilist orthodoxy of the 18th century, wealth was bullion (gold/silver). Berkeley aggressively attacks this.

  *   **The Argument:** In Query 51, he asks: *"Whether money be not only useful, so far as it stirreth up industry, and enableth men to mutually partake of the fruits of each other's labour?"*
  *   **The Implication:** Money is not wealth itself; it is a "ticket" or "counter" (Query 352) that allows labor to be exchanged. It is a symbol of power to command the labor of others.
  *   **The Bitcoin Connection:** Berkeley would agree with the Bitcoiners that gold is not necessary for money. He famously argued that paper credit could work just as well as silver, provided it was accepted. He writes in Query 235: *"Whether the creation of wealth dependeth on the mines, or on the industry of the people?"* Since Bitcoin is detached from physical commodities and relies on a consensus of value among users, Berkeley would acknowledge it fits his definition of money as a **conventional sign** rather than an intrinsic good.

  **Score so far:** Bitcoin passes the "substance" test. It is a counter without intrinsic metal value.

  ### 2. The Sovereign Authority: Where Berkeley Draws the Line
  This is where the tension breaks open. Berkeley's nominalism about money does not mean he thinks *anyone* can issue money. For Berkeley, money is a tool of statecraft, not a market discovery mechanism.

  *   **The Argument:** Berkeley spent *The Querist* advocating for a National Bank in Ireland. Why? Not just to print cash, but to manage the economy. In Query 356, he asks if a bank should be erected *"for the benefit of trade and circulation?"* He views the money supply as a public utility that must be managed to ensure full employment and national prosperity.
  *   **The Implication:** Money derives its legitimacy from the **sovereign** who guarantees its acceptance and manages its supply to suit the needs of the nation's industry. It is a political institution.
  *   **The Bitcoin Connection:** Bitcoin is explicitly designed to be apolitical and decentralized. There is no sovereign authority to adjust the supply based on the needs of Irish (or global) industry.
  *   **Berkeley's Critique:** Berkeley would argue that a currency without a sovereign manager is a currency without a purpose. If the economy needs more liquidity to employ the poor (a major goal of Berkeley's), Bitcoin's fixed supply makes it useless as a policy tool. He would view the decentralization not as a feature, but as a dereliction of duty by the state. To Berkeley, allowing a private or algorithmic system to control the "measure of commerce" is like letting private citizens set the weights and measures in the marketplace.

  **Score so far:** Bitcoin fails the "authority" test. It lacks the sovereign backing required to make the "tickets" valid for public use.

  ### 3. Circulation vs. Hoarding: The Moral Economy
  Berkeley's economics are deeply moral. The goal of money is to circulate, stimulate labor, and prevent idleness.

  *   **The Argument:** In Query 54, he asks: *"Whether the riches of a country do not consist in the plenty of the necessaries and conveniences of life, rather than in the abundance of gold and silver?"* He hates hoarding. If money sits still, it does not "stir up industry." He wants high velocity of money.
  *   **The Bitcoin Connection:** Bitcoin's economic model (especially in its early "HODL" culture) is often deflationary and encourages hoarding as a store of value.
  *   **Berkeley's Critique:** Berkeley would likely view Bitcoin speculation as a form of sterile accumulation. If people are holding Bitcoin expecting it to appreciate rather than spending it to command labor and produce goods, it violates the functional purpose of money. In Query 212, he asks whether *"paper money... [should] be contrived to circulate freely?"* Bitcoin's design often incentivizes the opposite (holding for future gain), which Berkeley would see as economically and morally stagnating.

  ### The Verdict: Where Would He Land?

  Berkeley would likely classify Bitcoin as a **private speculative asset**, not **money**.

  Here is the synthesis of his position:

  1.  **On the Nature of the Token:** He would agree that it doesn't need to be gold. A digital token is a perfectly fine "counter."
  2.  **On the Issuer:** He would reject the decentralized issuance. For Berkeley, the "ticket" must be issued by the National Bank to ensure it is tied to the land and labor of the nation (Query 46: *"Whether the true end of a national bank be not to supply the want of money?"*).
  3.  **On the Outcome:** He would argue that Bitcoin fails to solve the problem *The Querist* was written to solve: how to employ the poor and develop the domestic economy.

  **The Twist:**
  Berkeley would probably be a massive proponent of a **Central Bank Digital Currency (CBDC)**.

  Think about it: A CBDC fits his "ticket" theory perfectly (it has no physical substance), but it retains the sovereign control he demands. It allows the National Bank to manage the supply, direct credit toward industry, and ensure the "counters" are used to stimulate national wealth rather than private speculation.

  ### How to Frame This in Seminar
  If I were you, I would structure the answer like this:

  1.  **Acknowledge the surface alignment:** Berkeley destroys the mercantilist idea that money must be metal. He is a functionalist. Bitcoin fits the "immaterial counter" description.
  2.  **Pivot to the institutional requirement:** Berkeley's functionalism is **statist**, not libertarian. Money is a "ticket" issued by the sovereign to mobilize national labor.
  3.  **Highlight the teleological difference:** Bitcoin aims for independence from the state; Berkeley aims for the money supply to be the primary lever of state policy for the public good.
  4.  **Conclusion:** Berkeley would say Bitcoiners are right about gold, but wrong about the bank. He would argue that without a sovereign to manage the supply for the public good, Bitcoin is not money, but merely a speculative commodity masquerading as a ticket.

  **Key Query to Cite:** Query 352: *"Whether money be not a sort of ticket or counter, useful in reckoning, recording, and transferring value?"*
  **Follow up with:** Query 230: *"Whether the supreme power hath not the right to regulate the money?"*

  That second query is your killer argument. Berkeley's "nominalism" never extended to political authority. The value might be conventional, but the convention must be enforced by the State.
