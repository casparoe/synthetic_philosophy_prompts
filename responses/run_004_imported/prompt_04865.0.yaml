      *   *What is wealth?* Real wealth is the produce of the land and the industry of the people (goods and services), not the accumulation of precious metals.
      *   *Role of the State/Bank:* He advocated for a national bank in Ireland. Why? To issue credit/money to stimulate industry, employ the poor, and keep the value circulating within the nation. He wanted active management of the money supply to ensure full employment and economic activity.
      *   *Goal of Economy:* The public good, national prosperity, moral improvement through industry.

