      *   *Part 1: Berkeley's Theory of Money (The "Ticket" Argument).* Explain Query 51 and others. Money is a symbol of power to command labor. It's not the metal.
          *   *Connection to Bitcoin:* He'd like that it's not gold. It fits the "counter" idea.
