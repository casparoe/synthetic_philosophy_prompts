answer: |-
  G. E. Moore's famous observation highlights a peculiar tension in the first-person present tense: the sentence "It is raining, but I do not believe that it is raining" (formally: $p \land \neg Bp$) is logically consistent, yet asserting it sounds absurd. While the standard pragmatic explanation locates this absurdity in the norms of communication, Roy Sorensen's theory of "epistemic blindspots" locates the absurdity in the structure of belief itself.

  ### The Pragmatic Explanation (The Foil)
  To understand Sorensen's contribution, one must first understand the view he seeks to supplement. The pragmatic explanation, often associated with Wittgenstein or Grice, argues that the absurdity arises from the **act of assertion**.

  In normal conversation, to assert a proposition $p$ is to represent oneself as believing $p$. Therefore, when a speaker asserts the first conjunct ("It is raining"), she implicitly conveys "I believe it is raining." When she immediately asserts the second conjunct ("I do not believe it is raining"), she explicitly denies what she just implicitly conveyed. On this view, the sentence is problematic because it violates the rules of the "language game" of assertion; it is a performative contradiction, not a logical one. The problem lies in the *speaking*, not necessarily in the *thinking*.

  ### Sorensen's Epistemic Blindspot Diagnosis
  Roy Sorensen, in his work *Blindspots* (1988), argues that the pragmatic story is insufficient because it fails to explain why the **thought itself** is resistant to belief, even in the absence of an audience. He classifies Moorean sentences as **epistemic blindspots**.

  A blindspot is defined as a proposition that is:
  1.  **Consistent:** It is not a logical contradiction (it is possible for $p$ to be true while the subject does not believe $p$).
  2.  **Possibly True:** There are possible worlds where the proposition is true.
  3.  **Unbelievable:** It cannot be rationally believed or known by a specific subject at a specific time.

  **How the Diagnosis Applies:**
  Sorensen analyzes the failure of belief through the logic of doxastic states. If a subject $S$ were to believe the Moorean sentence ($p \land \neg Bp$), the following chain of reasoning would occur:
  1.  Belief distributes over conjunction. If $S$ believes ($p \land \neg Bp$), then $S$ believes $p$ **and** $S$ believes $\neg Bp$.
  2.  If $S$ believes $p$, then (by the factivity of belief attribution from the first-person perspective) it is true that $Bp$ (S believes $p$).
  3.  However, the second conjunct of the original sentence is $\neg Bp$ (S does not believe $p$).
  4.  Therefore, the very act of believing the Moorean sentence renders the second conjunct false.

  For Sorensen, the proposition is a blindspot because **believing it falsifies it.** If I successfully come to believe "It is raining but I don't believe it," the second half of my belief ("I don't believe it") immediately becomes false, because I now *do* believe it. Consequently, I cannot hold the belief without holding a false belief about my own mental state. It is a proposition that vanishes under the light of introspection.

  ### Why the Blindspot Story Captures More Than Pragmatics
  The crucial advantage of Sorensen's diagnosis is that it addresses the **psychological impossibility** of the thought, rather than just the **communicative impropriety** of the utterance.

  **1. Silence and Solitude**
  The pragmatic explanation relies on the presence of an audience or the norms of conversation. It explains why I cannot *tell* you the sentence without misleading you. However, it struggles to explain why I cannot *silently think* the sentence with conviction. If I am alone in a room, not asserting anything to anyone, the pragmatic norms of assertion do not apply. Yet, the absurdity remains. I cannot sincerely judge "It is raining, but I don't believe it" to be true. Sorensen's blindspot theory explains this: the barrier is not social, but structural to the mind. The proposition is inaccessible to the believer regardless of whether they speak.

  **2. The Distinction Between Truth and Believability**
  The pragmatic story suggests the sentence is "defective" as a speech act. Sorensen's story preserves the intuition that the sentence might be **true**, but emphasizes that truth does not guarantee believability.
  *   *Pragmatics:* "You shouldn't say that because it misrepresents your mind."
  *   *Blindspots:* "You cannot believe that because believing it changes your mind in a way that makes the proposition false."

  **3. Third-Person vs. First-Person Asymmetry**
  Both accounts explain why "It is raining, but *he* doesn't believe it" is perfectly fine. However, they do so for different reasons.
  *   The pragmatic account says this is fine because asserting it does not represent *my* belief state contradictorily.
  *   The blindspot account says this is fine because the proposition is not a blindspot *for me* regarding *him*. I can know his mental state without altering it.
  Sorensen's account deepens this by showing that the absurdity is indexical. The proposition is only a blindspot relative to the subject whose belief is in question. This explains why the thought is impossible *for me* to have about *myself*, even if it is a perfectly coherent thought for *you* to have about *me*.

  ### Conclusion
  While the pragmatic explanation successfully diagnoses the absurdity of *asserting* a Moorean sentence, it treats the problem as a violation of conversational norms. Roy Sorensen's epistemic blindspot diagnosis goes deeper, locating the absurdity in the **doxastic logic of self-knowledge**. By showing that the attempt to believe the sentence falsifies one of its conjuncts, Sorensen explains why the thought itself is impossible to entertain sincerely. The sentence describes a reality that exists only so long as the subject remains ignorant of it; the moment the subject grasps it as a belief, the reality described ceases to obtain.
