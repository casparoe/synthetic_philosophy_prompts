answer: |-
  First off, send solidarity to your reading group. *On Certainty* is notoriously aphoristic and slippery, and sections 96–99 are arguably the most famous (and most fought-over) passages in the book. You and Leah have stumbled onto the central tension of the entire text.

  The short answer is: **You are both half-right, but you are right about the *function*, while Leah is right about the *history*.** However, if we look at how this is used in contemporary hinge epistemology, **your reading is closer to the standard interpretation**, though Leah's caution is philosophically vital.

  Here is the unpacking of the passage, the metaphor, and the verdict on who wins the argument.

  ### 1. The River-Bed Metaphor (§§96–97)
  Wittgenstein is trying to navigate between two bad options:
  1.  **Cartesian Foundationalism:** There are eternal, unshakeable truths (God, Logic, Cogito) that ground everything else forever.
  2.  **Radical Skepticism:** Everything is fluid, so nothing is certain, and knowledge is impossible.

  The river-bed metaphor is his solution.
  *   **The Water:** Ordinary empirical propositions ("It is raining," "The cat is on the mat"). These move fast; they are verified or falsified constantly.
  *   **The Bed:** Hinge propositions ("The earth exists," "I have two hands"). These guide the water. They determine what counts as a sensible flow of argument.

  **Leah's Point:** She is focusing on §96: *"this relation altered with time, in that fluid propositions hardened, and hard ones became fluid."*
  She is correct that Wittgenstein is a **pragmatist**, not a metaphysician. There is no divine stamp on a hinge proposition. "The sun revolves around the earth" was once hard rock (a hinge of the Ptolemaic worldview); now it is fluid (an empirical falsehood). So, historically, nothing is permanently off-limits.

  **Your Point:** You are focusing on §97: *"I distinguish between the movement of the waters on the river-bed and the shift of the bed itself."*
  You are correct that Wittgenstein insists on a **functional distinction**. At any given moment, for a language game to work, *some* things must be exempt from doubt. If you treat the river-bed like the water, you can't navigate.

  ### 2. Hard Rock vs. Sand (§99)
  This is the specific image you fought over.
  > *"The bank of that river consists partly of hard rock, subject to no alteration or only to an imperceptible one, partly of sand..."*

  **Why this matters for your argument:**
  If Leah were totally right—that hinges are just "very confident empirical beliefs"—Wittgenstein wouldn't need the "hard rock" image. He could just say "the bed is made of packed mud."
  By invoking "hard rock," Wittgenstein is signaling that some propositions are **structurally different** in our current worldview. They don't just happen to be undoubted; they *make doubt possible* for other things.
  *   **Example:** If I doubt whether I have hands (sand), I can check. If I doubt whether the physical world exists (rock), I have no method of checking, because any check presupposes the physical world.

  **The Verdict on the Image:** The image supports **you**. Sand shifts easily; rock does not. Wittgenstein is admitting that while the *whole* bank might shift over millennia (Leah's point), at any human timescale, the rock is effectively permanent. To treat rock as sand *now* is not just difficult; it is nonsensical.

  ### 3. The "Logic as Empirical" Comment (§98)
  > *"If someone were to say 'So logic too is an empirical science' he would be wrong. Yet this is right: the same proposition may get treated at one time as something to test by experience, at another as a rule of testing."*

  This is the trickiest bit.
  *   **Why it's wrong:** Logic (and hinges) defines what "testing" means. You can't test the rules of testing using the rules of testing. That's circular.
  *   **Why it's right:** The *content* of what we treat as logical can change. In Newtonian physics, conservation of mass was a rule of testing (hard rock). In nuclear physics, it became an empirical proposition subject to revision (sand/water).

  **How this affects your debate:**
  Leah might use this to say, "See! Even logic is empirical!"
  But Wittgenstein explicitly says calling it empirical is **wrong**. He is drawing a line. The *status* of the proposition changes. When it is a hinge, it is **grammatical** (a rule). When it is empirical, it is **factual**.
  They are different *kinds* of moves in the language game, even if the same sentence can play both roles at different times.

  ### 4. Kind vs. Degree: The Adjudication
  This is the core philosophical question.
  *   **Leah (Degree/Time):** Hinges are just empirical beliefs that we haven't thought to doubt yet.
  *   **You (Kind/Function):** Hinges play a different logical role; they are the scaffolding, not the building.

  **The Literature Consensus:**
  In contemporary hinge epistemology (think Avrum Stroll, Danièle Moyal-Sharrock, Duncan Pritchard), **your reading is the dominant one.**
  *   **The "Standard" View:** Hinges are not "super-beliefs." They are **arational**. They are not based on evidence, nor are they immune to evidence; they are *outside* the evidence game. If they were just "very confident beliefs" (Leah's view), then a skeptic could just say, "Well, show me the evidence for your confidence." Wittgenstein's whole point is that you cannot show evidence for a hinge, because the hinge is what allows evidence to count.
  *   **The Nuance:** Leah is right that the *boundary* is fuzzy (§97: "there is not a sharp division"). But "fuzzy boundary" does not mean "no difference in kind." There is no sharp line between "bald" and "has hair," but there is a difference in kind between a bald man and a man with a full head of hair.

  **Where Leah goes too far:**
  She says a hinge is *"no different in kind from something I could revise next week."*
  Wittgenstein would push back hard here. I can revise "It is raining" next week. I cannot revise "Objects don't vanish when I look away" next week without my entire worldview collapsing into madness. The *resistance* to revision is not just psychological habit; it is logical necessity for the system to function.

  ### 5. Final Scorecard
  *   **Leah wins on:** **Diachronic flexibility.** Over centuries, hinges change. Nothing is metaphysically sacred. Wittgenstein is not a Foundationalist in the traditional sense.
  *   **You win on:** **Synchronic function.** At any given moment, hinges function differently than empirical beliefs. They are rules, not hypotheses. This is the point of the "hard rock" image.

  **Who is closer to the literature?**
  **You.**
  Most commentators argue that while hinges are revisable *in principle* (over deep time), they are distinct in *kind* from empirical beliefs *in practice*. If you treat them as merely entrenched empirical beliefs, you miss Wittgenstein's solution to skepticism. Skepticism tries to treat hinges as empirical questions ("Prove the world exists"). Wittgenstein says, "No, that's a category mistake. That's trying to measure the meter stick with the meter stick."

  **Advice for the Reading Group:**
  Tell Leah she is correctly identifying Wittgenstein's **anti-dogmatism** (nothing is forever), but she is missing his **anti-skepticism** (some things must be held fast *now* for us to speak at all).
  Tell her: "You're right that the river bed moves, but if we treat the rock like sand while we're trying to cross the river, we drown. Wittgenstein cares about crossing the river, not geology."

  (And maybe suggest you both read Avrum Stroll's *Skepticism and Certainty*. He basically wrote the book on this exact river-bed metaphor.)
