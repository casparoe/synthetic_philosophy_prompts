      *   *Critique:* Is the physics background utilized?
      *   *Fix:* Use the analogy of the observer effect in the introduction or analysis.

  7.  **Final Polish:** Check for clarity, flow, and persuasive power. Ensure the compromise feels genuine, not just a split-the-difference weak solution. The key is shifting metrics from *judges* to *evidence*.

