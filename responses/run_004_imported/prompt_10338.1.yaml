answer: |-
  **MEMORANDUM**

  **TO:** University Task Force on Research Assessment
  **FROM:** [Your Name], Professor Emeritus of Physics
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for the 2024 Merit and Tenure Review Cycle: A Triangulated Approach

  **Executive Summary**

  We stand at an inflection point. The pilot implementation of the Composite Research Impact Score (CRIS) in the Chemistry Department has yielded data, and that data requires interpretation. As a physicist who spent forty years measuring complex systems, and now as a student of philosophy examining the epistemology of those measurements, I propose we reject the binary choice between "pure metrics" and "pure narrative."

  Both positions contain valid claims. The administration's drive for scalability and objectivity is legitimate; the faculty's concern regarding the distortion of scientific inquiry is empirical. My recommendation for the upcoming review cycle is to adopt a **Triangulated Review Model**. In this model, metrics serve as evidentiary inputs for a structured, calibrated peer review, rather than acting as the final arbiter of value. This preserves administrative efficiency while mitigating the perverse incentives observed in the Chemistry pilot.

  **1. The Administrative Imperative: Why Metrics Were Proposed**

  Before we dismantle the CRIS, we must acknowledge why it was constructed. The call for quantification was not merely an exercise in budgetary reduction; it was a response to genuine structural failures in the previous narrative system.

  *   **Scalability and Consistency:** As the university grew, the volume of tenure files outpaced the capacity of senior faculty to review them deeply. Narrative reviews became inconsistent, varying wildly between departments and committees.
  *   **The "Old Boys' Network":** We cannot deny that the previous narrative system allowed personal networks to bias outcomes. Quiet biases regarding gender, institutional pedigree, and sub-field prestige often went unchallenged because they were embedded in prose rather than exposed in data.
  *   **Accountability:** In an era of public scrutiny regarding tuition and state funding, administrators require defensible, transparent criteria for resource allocation. A narrative is difficult to audit; a score is auditable.

  To simply return to the pre-CRIS status quo is to ignore these valid administrative constraints. We need a system that is transparent and scalable, but one that does not confuse *measurement* with *value*.

  **2. The Observer Effect: Lessons from the Chemistry Pilot**

  In experimental physics, we learn early that the act of measurement disturbs the system being measured. In social systems, this is known as Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure."

  The Chemistry pilot confirms this disturbance. We are observing three distinct artifacts introduced by the CRIS:
  1.  **Salami-Slicing:** Fragmenting results into minimal publishable units to maximize publication counts.
  2.  **Citation Cartels:** Reciprocal citation arrangements that inflate impact without increasing knowledge.
  3.  **Risk Aversion:** A measurable drift away from high-risk, long-term, or null-result projects toward "safe" science that guarantees citation velocity.

  If we proceed with the CRIS as a deterministic formula for merit and tenure, we are not merely measuring research quality; we are actively engineering a decline in it. We will optimize for the *appearance* of impact rather than the *substance* of discovery.

  **3. Recommendation: The Triangulated Review Model**

  I propose we suspend the use of CRIS as a standalone decision matrix for the 2024 cycle. Instead, we implement a Triangulated Review Model. This approach treats metrics as *testimony* rather than *verdict*.

  **Core Mechanism:**
  1.  **Metrics as Dashboard, Not Score:** The CRIS components (citations, grants, publication venues) will be presented to review committees as a dashboard of raw data. No composite score will be calculated. This prevents the mathematical obscuring of weak areas by strong ones.
  2.  **Calibrated Narrative Review:** Departmental committees will write narrative assessments, but these must be "calibrated." Committees must explicitly address outliers in the metric dashboard. If a candidate has low citation counts but high narrative praise, the committee must justify why the metrics are misleading (e.g., working on a long-term problem, publishing in monographs). If a candidate has high metrics but low narrative praise, the committee must identify the gaming (e.g., salami-slicing).
  3.  **The "Safety Valve" Clause:** For tenure cases, a candidate may submit a "Contextual Statement" regarding their metrics, specifically to explain null results or long-gestation projects, which the committee is required to address in their final report.

  **4. Why This Bridges the Divide**

  **For the Administration:**
  *   **Efficiency:** Metrics still serve as a filtering mechanism. Files that are strong across the dashboard can be processed with less friction.
  *   **Auditability:** The requirement for committees to explicitly address metric outliers creates a paper trail. If a decision is challenged, the justification is documented against the data, reducing the risk of unchecked bias.
  *   **Data Retention:** We continue to collect the data necessary for external reporting and accreditation.

  **For the Faculty:**
  *   **Restored Agency:** Expert judgment returns to the center of the process. Peers, not algorithms, determine the quality of the work.
  *   **Incentive Realignment:** By decoupling the raw score from the outcome, the incentive to game the specific formula diminishes. The incentive shifts back to persuading expert peers of the work's significance.
  *   **Protection of Risk:** The "Contextual Statement" allows researchers to engage in ambitious, long-term inquiry without being penalized for a temporary dip in publication velocity.

  **5. Implementation for Next Cycle**

  For the 2024 merit and tenure reviews, I recommend the following immediate actions:
  1.  **Freeze the Formula:** Do not attempt to "patch" the CRIS weights. Tweaking the coefficients does not solve the fundamental category error of quantifying quality.
  2.  **Train the Committees:** Hold workshops for review committees on interpreting bibliometric data. They need to understand the difference between a citation and an endorsement.
  3.  **Review the Reviewers:** To address administrative concerns about bias, implement a random audit of 10% of tenure files by an external ad-hoc committee to ensure the "Calibrated Narrative" is being applied consistently.

  **Conclusion**

  In physics, we trust our instruments, but we never trust them more than our theory. A thermometer tells us the temperature, but it does not tell us if the patient is sick. The CRIS is a thermometer; it measures heat, but it cannot measure health.

  By adopting the Triangulated Review Model, we acknowledge the necessity of data without surrendering our judgment to it. We satisfy the administrative need for transparency and the faculty need for integrity. We stop optimizing for the score and start optimizing for the science.

  I urge the task force to adopt this recommendation for the upcoming cycle.

  Respectfully,

  [Your Name]
  Professor Emeritus of Physics
  Member, Task Force on Research Assessment
