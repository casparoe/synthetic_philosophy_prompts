      *   *Scarcity:* Bitcoin has a fixed cap (21 million). Berkeley argued *against* fixed money supplies (like gold) because they constrain industry. He wanted money to expand as industry expands.
      *   *Trust/Authority:* Bitcoin is trustless (algorithmic). Berkeley's system relies on *trust in a public institution* (National Bank) to manage the supply for the public good.
      *   *Purpose:* Bitcoin is often hoarded (store of value). Berkeley hated hoarding; he wanted circulation.

  4.  **Evaluate the Metaphysical Connection (*Esse est Percipi* vs. Economics):**
