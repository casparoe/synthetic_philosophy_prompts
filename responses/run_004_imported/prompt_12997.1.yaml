prompt: |-
  I'm putting together this week's session for my grad seminar on Sidgwick's *Methods of Ethics*, and I went down a weird rabbit hole last night that I can't quite shake. One of my students, who's way more into AI stuff than I am, kept bringing up "coherent extrapolated volition" (CEV) — Yudkowsky's old proposal that instead of pointing an AI at humanity's actual, present-day preferences, you should point it at whatever our preferences would converge to if we knew more, thought faster and more clearly, were more the people we each wish we were, and had had more time to reflect together. It hit me that this is basically dressing up, in engineering language, the exact same move Sidgwick makes when he tries to get from individual "considered judgments" up to the "point of view of the universe" — except Sidgwick thought he needed a handful of independently self-evident axioms (prudence, justice, rational benevolence) to license that move, wheras CEV seems to just trust that extrapolation plus coherence-seeking will do the work on its own, with no independent axiomatic backing at all.

  Obviously Sidgwick never had to think about AI (he died in 1900, CEV wasn't formulated til 2004), but he thought unusually hard, for his era, about exactly the kind of idealization-of-preferences move CEV relies on, and about whether such moves can actually bridge the gap he's most famous for never closing: the dualism of practical reason between egoism and universal benevolence. So here's what I want your take on: if you explained CEV to Sidgwick, do you think he'd see it as a live candidate for finally resolving (or at least dissolving) that dualism, on the grounds that it operationalizes impartial extrapolation at civilizational scale? Or would his own doubts about whether such convergence is even possible without some theistic guarantee, combined with his insistence on independently self-evident starting points, make him pretty scathing about the whole project? Feel free to get properly into the weeds here — this is for my own prep/amusement rather than for the students directly, so I'm after your best reconstruction of how his actual arguments bear on this, not a diplomatic both-sides answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar on Sidgwick's *The Methods of Ethics*.
      *   **Topic:** Comparing Sidgwick's ethical methodology (specifically the move from considered judgments to the "point of view of the universe" and the Dualism of Practical Reason) with Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV).
      *   **Core Question:** If Sidgwick knew about CEV, would he see it as a solution to the Dualism of Practical Reason (egoism vs. utilitarianism), or would he reject it based on his epistemological requirements (self-evident axioms) and metaphysical doubts (need for theistic guarantee)?
      *   **Tone/Style:** "Properly into the weeds," "reconstruction of actual arguments," "not a diplomatic both-sides answer." The user is an expert (grad seminar leader), so the response needs high philosophical fidelity and nuance.

  2.  **Deconstruct the Key Concepts:**
      *   **Sidgwick's *Methods of Ethics*:**
          *   Three methods: Intuitionism, Egoism, Utilitarianism.
          *   Methodology: Reflective equilibrium (before Rawls named it). Starts with common sense morality, refines it via consistency and clarity until it reaches self-evident axioms.
          *   The Axioms: Justice (impartiality), Prudence (temporal neutrality), Rational Benevolence (good is good, no matter whose).
          *   The Dualism of Practical Reason: Egoism (rational self-interest) and Utilitarianism (rational benevolence) are both rational, but they can conflict. Reason doesn't dictate which to choose unless there's a cosmic guarantee (God/Karma) that virtue leads to happiness.
          *   The "Point of View of the Universe": A metaphor for the Utilitarian standpoint, transcending individual perspective.
      *   **Yudkowsky's CEV:**
          *   Goal: Align AI with human values.
          *   Mechanism: Don't ask what we want *now*. Ask what we *would* want if we knew more, thought faster, were more idealized versions of ourselves, and converged together.
          *   Assumption: There *is* a convergence. Human values, when purified of error and bias, cohere into a stable target.
          *   Metaphysics: Naturalistic. No appeal to divine harmony.

  3.  **Evaluate the Connection (The "Rabbit Hole"):**
      *   *Similarity:* Both involve idealizing preferences/judgments to find a universal standpoint. Both seek coherence.
      *   *Difference:* Sidgwick demands *axiomatic* foundations for the move to universality. CEV relies on *procedural* convergence. Sidgwick is skeptical about the harmony of interests without God; CEV assumes harmony (or at least compatibility) is computable/achievable.

  4.  **Simulate Sidgwick's Reaction (The Core Task):**
      *   *Would he accept CEV as a resolution to the Dualism?*
          *   **Likely No.** The Dualism isn't just about *knowing* the good; it's about the *motivation* to pursue the universal good over self-interest when they conflict. CEV tells you what the universal good *is* (extrapolated volition), but it doesn't prove why an individual agent (or AI acting as an agent) should sacrifice its own "interest" (or programmed objective) for that extrapolated volition if they diverge.
          *   **Epistemological Objection:** Sidgwick insists on self-evident intuitions as the bedrock. CEV is empirical/procedural. For Sidgwick, "what we would agree on" is not the *source* of validity; the validity comes from the self-evident axiom of Rational Benevolence. CEV puts the cart before the horse.
          *   **Metaphysical Objection:** Sidgwick's Dualism rests on the possibility that my happiness and the universal good *actually* diverge in this life. CEV assumes that if we think clearly enough, they won't diverge (or the AI will enforce the universal). Sidgwick would say: "You haven't solved the conflict; you've just defined it away by fiat."
          *   **The "Is/Ought" Gap:** CEV tries to derive an 'ought' (what the AI should do) from an 'is' (what humans would want under conditions X). Sidgwick is a rationalist intuitionist; he thinks moral truths are known by reason, not by surveying hypothetical preferences.

  5.  **Drafting the Argument (Iterative Process):**
      *   *Introduction:* Acknowledge the brilliance of the connection. It's a sharp insight.
      *   *Point 1: The Status of the Axioms.* Sidgwick needs the Axiom of Rational Benevolence to justify the move to the "Point of View of the Universe." CEV tries to get there via computation/extrapolation. Sidgwick would call this circular or insufficient. You need the *principle* that everyone's good counts equally to justify aggregating/extrapolating preferences in the first place.
      *   *Point 2: The Dualism.* This is the big one. CEV assumes convergence. Sidgwick thinks Egoism is just as rational as Utilitarianism. If my extrapolated volition says "sacrifice myself for the group," and my egoistic interest says "live," CEV doesn't tell me why I'm *irrational* for choosing self. It just tells me what the AI will enforce. Sidgwick cares about *practical reason*, not just *social engineering*.
      *   *Point 3: The Theistic Gap.* Sidgwick famously said he couldn't believe Utilitarianism was rational without believing God makes virtue pay. CEV is secular. Sidgwick would see CEV as a "political" solution (forcing compliance) rather than a "philosophical" solution (resolving the rational conflict).
      *   *Point 4: Idealization vs. Intuition.* CEV idealizes *desires*. Sidgwick idealizes *judgments*. This is a crucial meta-ethical distinction. Sidgwick isn't looking for what we *want*; he's looking for what is *true*.

  6.  **Refining the Tone:**
      *   Avoid being too dismissive of CEV (it's a serious proposal in AI safety).
      *   Avoid being too apologetic for Sidgwick (acknowledge his pessimism).
      *   Keep it dense and argumentative, suitable for a grad prep.
      *   Use Sidgwickian terminology ("dictates of reason," "self-evident," "empirical sanction," "theological sanction").

  7.  **Final Polish:**
      *   Check specific references (Book III, Chapter XIII of *Methods* is key for the Dualism).
      *   Ensure the distinction between *defining* the good (CEV) and *motivating* the pursuit of the good (Dualism) is clear.
      *   Highlight that CEV is essentially a Utilitarian calculus wrapped in decision theory, which Sidgwick would recognize but find philosophically shallow regarding the *obligation* problem.

  8.  **Self-Correction during drafting:** I initially thought Sidgwick might like the "ideal observer" aspect. But wait, Sidgwick's ideal observer isn't just "informed"; it's bound by self-evident axioms. CEV's "informed" is about facts and logic, not necessarily moral axioms. I need to emphasize that Sidgwick thinks moral truth is *sui generis*, not reducible to factual coherence. Also, CEV is about *volition* (wanting), Sidgwick is about *reason* (oughting). That's a Humean vs. Rationalist clash. Sidgwick is a Rationalist.

  9.  **Final Structure:**
      *   Validate the insight (it's sharp).
      *   The Meta-Ethical Clash (Desire vs. Reason).
      *   The Axiomatic Gap (Procedural vs. Substantive).
      *   The Dualism (The hard no).
      *   The Theological/Secular divide.
      *   Conclusion: Sidgwick sees CEV as a sophisticated form of Utilitarianism that fails to solve the foundational crisis of Rational Egoism.

  (Proceed to generate response based on these points.)
answer: |-
  This is a genuinely brilliant connection, and it cuts right to the bone of Sidgwick's project in *The Methods of Ethics*. You are right to sense the structural isomorphism: both Sidgwick and Yudkowsky are trying to solve the problem of **normative authority via idealization**. They both agree that our actual, occurrent preferences are a mess of bias, ignorance, and inconsistency, and that the "true" moral target lies in some counterfactual space of reflection.

  However, if you put CEV in front of Sidgwick, I am confident he would not view it as a resolution to the Dualism of Practical Reason. In fact, he would likely view it as a category error that conflates *psychological convergence* with *rational obligation*. He would probably be scathing, not because CEV is incoherent as an engineering proposal, but because it attempts to bypass the very epistemological work he thought was necessary to ground ethics in the first place.

  Here is the breakdown of why Sidgwick would reject CEV as a solution to the Dualism, based on his actual arguments in Book III and the concluding chapter of *Methods*.

  ### 1. The Meta-Ethical Clash: Volition vs. Reason
  The most immediate friction is meta-ethical. CEV is fundamentally Humean in structure: it takes *volition* (desires, preferences, "what we would want") as the primitive and tries to clean it up. It assumes that if you remove the noise (ignorance, bias, computational limits), the signal (value) remains.

  Sidgwick is a Rationalist Intuitionist. For him, moral truth is not a function of what we *would desire* even under ideal conditions; it is a function of what Reason *dictates*. The "Point of View of the Universe" is not a metaphor for "what we'd all agree on if we talked long enough." It is a metaphysical standpoint accessible only through the intuition of the Axiom of Rational Benevolence: *"The good of any one individual is of no more importance, from the point of view (if I may say so) of the Universe, than the good of any other."*

  Sidgwick would argue that CEV begs the question. Why should we aggregate preferences? Why should we prioritize coherence? Why should we value the "extrapolated" version of ourselves over the "actual" version? For Sidgwick, you can only answer those questions by appealing to a prior, self-evident axiom of value. CEV tries to derive the *ought* from the *would*. Sidgwick would say you need the *ought* (the Axiom) to justify the procedure of extrapolation in the first place. Without the Axiom of Benevolence, there is no reason to think the "coherent extrapolated volition" is morally binding rather than just a very consistent set of preferences.

  ### 2. The Problem of Convergence (Empirical vs. Rational)
  Sidgwick was deeply skeptical about the empirical convergence of interests. He recognized that in the real world, the happiness of the agent and the happiness of the whole often conflict. His "Dualism of Practical Reason" arises precisely because Rational Egoism (Prudence) and Rational Utilitarianism (Benevolence) are both equally self-evident to reason, yet they can demand contradictory actions.

  CEV assumes that if we "think faster" and "know more," our volitions will *converge*. It posits a factual claim about the topology of human value space: that it has a stable attractor.

  Sidgwick would look at this and say: **Even if you are right, you haven't solved the Dualism.**
  Suppose the AI calculates the CEV. It determines that the extrapolated volition of humanity requires a specific sacrifice from me that contradicts my own maximal happiness.
  *   **The Utilitarian Reason** says: Do it.
  *   **The Egoistic Reason** says: Don't do it.

  CEV gives the AI a target, but it doesn't give *me* a reason to comply if compliance harms me. Sidgwick's Dualism isn't about not knowing what the Universal Good *is*; it's about not knowing why Reason demands I pursue it when it conflicts with my own good. CEV operationalizes the Universal Good, but it leaves the authority of Rational Egoism untouched. Sidgwick would say CEV just builds a Utilitarian dictator; it doesn't prove the Egoist irrational.

  ### 3. The Need for a Theological Sanction
  This is the hardest pill for modern secular readers, but it's crucial for Sidgwick. In the final chapter of *Methods*, Sidgwick essentially says that without a belief in a God who ensures that virtue is rewarded with happiness (in an afterlife), the conflict between Egoism and Utilitarianism is rationally unresolvable. He calls this the "need for a theological sanction."

  CEV is a purely naturalistic, computational procedure. It offers no guarantee that adhering to the extrapolated volition will result in the agent's own happiness. In fact, CEV is often discussed in the context of AI safety precisely because humans *won't* like what the AI decides if we aren't idealized.

  Sidgwick would argue that CEV effectively admits the Dualism is real (by forcing compliance via AI rather than rational persuasion) but refuses to face the metaphysical cost. He would likely say: *"You have built a machine to enforce the Point of View of the Universe because you secretly know that Reason alone cannot motivate the Egoist to adopt it. But by making it a matter of enforcement rather than rational harmony, you concede that the Dualism remains."*

  For Sidgwick, a true resolution requires the harmony of interests to be a fact of the cosmos (guaranteed by God), not a feature of a software architecture.

  ### 4. Idealization of Judgment vs. Idealization of Desire
  There is a subtle but vital distinction in the *type* of idealization.
  *   **Sidgwick:** Idealizes **judgments**. He starts with common-sense moral intuitions and refines them until they are clear, precise, and consistent (self-evident). The content is moral truth.
  *   **CEV:** Idealizes **desires**. It starts with what people want and refines the conditions of wanting. The content is psychological satisfaction.

  Sidgwick distinguishes sharply between "what is desired" and "what is desirable." He critiques Mill's Utilitarianism on exactly these grounds (the naturalistic fallacy, before Moore named it). He would likely view CEV as committing Mill's error on a grand, computational scale. Just because we *would* desire X under ideal conditions doesn't make X *good* unless we already accept the axiom that "satisfaction of ideal desire is the Good." But that axiom itself needs justification. Sidgwick thinks the justification comes from intuition, not from the coherence of the desire itself.

  ### 5. Why He Might Be *Intrigued* (The Silver Lining)
  If Sidgwick were charitable, he might admit that CEV is the most sophisticated attempt yet to solve the **application problem** of Utilitarianism. Sidgwick worried that even if we accept Rational Benevolence, we can't calculate the consequences well enough to know what to do. He called this the "empirical sanction."

  He might see CEV as a tool to overcome human cognitive limits in calculating the general happiness. If an AI can actually simulate the consequences of actions better than humans, it solves the *epistemic* deficit of Utilitarianism.

  But—and this is the grad-seminar punchline—he would insist this solves the *calculation* problem, not the *justification* problem. It tells us how to maximize the Good, but it doesn't tell us why the Good is binding on the individual agent when it conflicts with self-interest.

  ### Summary for Your Seminar
  If you want to press this with your students, the frame is this: **CEV attempts to solve a normative problem (what should the AI do?) with a procedural solution (extrapolate preferences), whereas Sidgwick argues normative problems require substantive axioms.**

  Sidgwick would tell Yudkowsky:
  > "You have assumed that coherence implies validity. You have assumed that the 'ideal self' is the 'moral self.' And you have assumed that building a machine to enforce the universal interest resolves the conflict between the universal and the particular. You have done none of these things. You have merely built a very powerful Utilitarian engine, while leaving the Rational Egoist standing outside the car, perfectly rational, and perfectly unconvinced he ought to get in."

  It's a devastating critique, but it highlights exactly why Sidgwick remains the "first modern moral philosopher" and why the Dualism still haunts us. CEV is, in Sidgwickian terms, a magnificent attempt to dodge the need for God by building a God out of code. Sidgwick would say the code still runs on hardware that can't bridge the is-ought gap.

  This rabbit hole is worth taking your students down. It illuminates Sidgwick's pessimism about secular ethics in a way that abstract discussion of the "Dualism" often misses. It shows that for Sidgwick, the problem wasn't just "how do we find the truth?" but "why should truth motivate me?"—a question CEV doesn't even ask.
