      *   *Wait, for a true dilemma, the HOE must suggest the FOE **doesn't support P** for the agent, even if it does objectively.*
      *   Let's use the **"Sleep-Deprived Diagnostician"** but make it about *interpretation*.
      *   *Character:* Dr. Aris Thorne, Radiologist.
