prompt: |-
  So last night a friend and I got into it about dispositions—like whether calling something "fragile" just means "would break if struck," "soluble" means "would dissolve if put in water," that whole conditional-analysis-of-dispositions move. I brought up the two counterexamples that are supposed to wreck it: the electro-fink wire (the wire's dead, but theres a gadget wired up to it that senses contact with a conductor and makes it live in that same instant, so it still conducts when touched), and the glass packed in styrofoam (it's genuinely fragile, but the packing stops it from actually breaking when struck). My friend's whole position was that finks and masks are basically the same trick wearing different costumes — "something outside the object messes with what happens" — and that philosophers building a whole taxonomy out of it (finks vs. masks, Lewis's "reformed" conditional analysis apparently patching the fink problem but not the masking one, and something about a third category called a "mimic" too) is kind of overkill.

  I actually think there's a real, principled line here — roughly, finks mess with whether the disposition (or its causal basis) is even there at the moment of the stimulus, while masks/antidotes leave the disposition completely intact and just interfere further down the chain between stimulus and manifestation — but when he pushed back I realized I only had the textbook examples memorized, not an actual independent grip on the distinction. So here's what I want: invent one brand-new example of a fink and one brand-new example of a mask (not the wire, not the styrofoam glass, not poison-and-antidote), and for each one, walk through exactly why it's that one and not the other. Then, since this is the part my friend insists can't be done honestly, give me a single example that's genuinely ambiguous between a fink and a mask, where a resonable person could argue it either way depending on how you individuate the mechanism, and explain precisely what's generating that ambiguity.
