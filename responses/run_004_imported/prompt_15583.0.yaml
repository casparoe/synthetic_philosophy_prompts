answer: |-
  # The Absolutist's Bomb: Why Anscombe Was Right About Truman

  In May 1956, a tiny, chain-smoking Cambridge philosopher named G.E.M. Anscombe stood before the convocation at Oxford University and attempted to block the awarding of an honorary degree to Harry S. Truman. To the assembled dignitaries, it was a scene of bizarre insolence: a woman protesting the man who had won the war. To Anscombe, it was a matter of moral taxonomy. Her pamphlet, *Mr. Truman's Degree*, is often filed away as a historical curiosity—a footnote to the Cold War, or a biography of a famous ethicist.

  This is a mistake. *Mr. Truman's Degree* is not history; it is a live grenade.

  Anscombe's argument was not primarily about the body count at Hiroshima and Nagasaki. She did not engage deeply with the debate over whether the bombs shortened the war by months or years. Her claim was sharper and more dangerous: that intentionally killing the innocent as a means to an end is murder, full stop. It is a direct assault on consequentialism, a dry run for her later masterpiece *Modern Moral Philosophy*.

  Seventy years later, the question remains unresolved. When the stakes are existential, do the rules of morality bend? To answer this, we must steelman the case against Anscombe—the argument of "Supreme Emergency" and the visceral gratitude of the soldier—and then test it against her absolutism. When the dust settles, the verdict is uncomfortable but clear: Anscombe is right. The consequentialist defense of Truman does not save morality; it dissolves it.

  ### The Anscombean Knife

  To understand Anscombe, you must discard the modern utilitarian instinct that measures right and wrong by a scale of outcomes. For Anscombe, morality resides in the *act itself* and the *intention* behind it. She relies on a rigorous interpretation of the Doctrine of Double Effect. It is permissible to perform an act that has a good effect and a foreseen bad effect (e.g., bombing a munitions factory where civilians unfortunately die), provided the bad effect is not the *means* to the good effect.

  However, if you kill civilians *in order to* terrorize a government into surrender, the killing is the means. The intention is the death of the innocent. For Anscombe, this is murder. It is not "regrettable collateral damage"; it is the core of the strategy.

  Her point is that certain actions are intrinsically evil. They are forbidden not because they produce bad results, but because they violate the fundamental relationship between a moral agent and the human good. If you accept that you can murder innocents to save lives, you have accepted that human beings are vessels of value that can be poured out for a collective sum. You have turned persons into numbers. Anscombe argues that if we lose this prohibition, we lose the concept of justice entirely. There is no "greater good" that justifies the intentional slaughter of the无辜 (innocent).

  ### The Bloodier Shore: The Consequentialist Defense

  The case against Anscombe is not merely cold calculation; it is visceral. It is best articulated by the historian Paul Fussell in his essay *Thank God for the Atom Bomb*. Fussell was an infantryman preparing for the invasion of Japan (Operation Downfall). He argues that the abstract moralizing of Oxford dons collapses when faced with the reality of a beach landing.

  The consequentialist argument rests on three pillars:

  1.  **The Body Count:** The prevailing military estimate in 1945 suggested an invasion of the Japanese home islands would cost between 500,000 to 1 million Allied casualties and millions of Japanese deaths (combatant and civilian). The bombs killed approximately 200,000. The math suggests a net saving of lives.
  2.  **The Nature of the Enemy:** Japan was a totalitarian state committed to *Ketsu-Go* (the decisive operation), mobilizing civilians with bamboo spears. Surrender was not a given; the war was likely to continue until every Japanese was dead.
  3.  **Supreme Emergency:** Philosopher Michael Walzer later codified this. When a community faces an existential threat—slavery, genocide, total annihilation—the "utilitarianism of extremity" may override the usual rules of war. The survival of the political community is a prerequisite for any morality at all.

  From this perspective, Truman's decision was a "lesser evil." To refuse to drop the bomb is to choose the deaths of the young American boys slated for the invasion over the Japanese civilians. It is to prioritize the "clean hands" of the decision-maker over the actual lives of the soldiers. As Fussell put it, "People who criticize the use of the atom bomb... have never had to fight in a war."

  This is a powerful steelman. It accuses Anscombe of moral vanity. It suggests that her absolutism is a luxury purchased with other people's blood.

  ### The Epistemic Trap

  However, the consequentialist defense contains a fatal flaw: **Epistemic Arrogance.**

  Consequentialism requires knowledge that human beings do not possess. To justify the bombing of Hiroshima on utilitarian grounds, you must know with reasonable certainty that:
  1.  The invasion would definitely happen.
  2.  The invasion would definitely cost more lives than the bomb.
  3.  The bomb would definitely end the war immediately.
  4.  No other option (demonstration, modified surrender terms, Soviet entry) would have worked.

  Historians still debate these points seventy years later. In July 1945, Truman did not *know* the invasion casualty estimates were accurate; they were guesses. He did not *know* the Japanese were on the verge of surrender via Soviet mediation (a possibility supported by intercepted cables). He did not *know* that a demonstration shot wouldn't work.

  Anscombe's deontology requires no prophecy. It requires only self-knowledge. I know my intention. I know if I am targeting civilians. I do not need to predict the future to know that murdering a child is wrong.

  The consequentialist argument collapses under the weight of counterfactuals. If the war would have ended in August 1945 anyway due to the Soviet declaration of war (as some historians argue), then the bombs saved *no one*. They were purely gratuitous mass murder. If the surrender terms regarding the Emperor had been clarified earlier, the war might have ended without invasion or bombs.

  When you base morality on outcomes, you are betting on a future you cannot see. When you base morality on intentions, you are standing on ground you can feel. Anscombe's framework is robust because it does not rely on luck or accurate intelligence reports to remain moral.

  ### The Corruption of the "Supreme Emergency"

  The "Supreme Emergency" exception is the most seductive reply to Anscombe, but it is also the most dangerous. Walzer argues that rules can be broken when the threat is "imminent and horrific." But who defines imminent? Who defines horrific?

  In 1945, the Allies had already established air superiority. The firebombing of Tokyo had already killed more people than Hiroshima. The "emergency" was not a sudden shift in 1945; it was the status quo of total war. If we accept that existential threats justify the intentional killing of innocents, we open the door to *any* atrocity provided the justification is grand enough.

  If Truman was right to kill 200,000 civilians to save a potential 500,000 soldiers, why is it wrong to kill 1,000 civilians to save 5,000? Why is it wrong to torture a terrorist's child to find a nuclear bomb in New York? The logic is identical. The only difference is the magnitude of the numbers.

  Once you admit that innocent life is fungible—that it can be traded for "security" or "victory"—you have removed the protective firewall around human rights. Anscombe understood that the prohibition against targeting innocents is not a heuristic; it is a constitutive rule of morality. It is the line that separates a soldier from a murderer.

  The "clean hands" objection—that Anscombe cares more about her own purity than others' lives—is a caricature. She cares about the *truth* of the action. If we justify murder, we corrupt the moral language we use to govern the world. We teach the next generation that if the cause is good enough, anything is permissible. That is the logic of every terrorist organization in history. They all believe they are fighting a "Supreme Emergency." They all believe their ends justify their means. To agree with Truman is to agree with their logic, only differing on the arithmetic.

  ### The Verdict

  So, who is right?

  **Anscombe is right.**

  She is right not because the consequences of her view are comfortable—they are terrifying. A world that follows Anscombe might fight longer, bloodier wars because it refuses to take moral shortcuts. It might lose conflicts.

  But she is right because the consequentialist alternative is intellectually bankrupt and morally corrosive. The defense of Truman relies on a utilitarian calculus that is impossible to verify and dangerous to institutionalize. It treats human beings as containers of utility rather than subjects of justice.

  The "Thank God for the Atom Bomb" argument is emotionally compelling for the soldier who lived, but it is philosophically hollow. It justifies a specific atrocity based on a counterfactual future that never happened. It asks us to accept that murder is permissible if the spreadsheet balances.

  Anscombe forces us to confront the possibility that we may be required to suffer evil rather than commit it. This is the hard core of the Judeo-Christian ethic she defended: that it is better to be defeated than to become a monster. If the price of victory is the intentional slaughter of children, then the victory is already lost, because the moral community that wins is no longer worth defending.

  Truman may have been a pragmatic leader who ended a war. But Anscombe was a philosopher who defended the conditions that make leadership moral in the first place. We should be grateful the war ended, but we must admit that the means used were evil. To deny this is to say that there is no act so horrific that it cannot be washed clean by a "good enough" reason.

  Anscombe saw the abyss. She knew that if we normalize the intentional killing of innocents, even for the "greatest good," we lose the ability to call anything murder ever again. In a world of nuclear thresholds and asymmetric warfare, her absolutism is not a historical footnote. It is the only barrier left.
