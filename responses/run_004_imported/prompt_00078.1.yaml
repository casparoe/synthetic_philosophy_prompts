answer: |-
  **The Cost of Modality: Why Humeanism Cannot Ground the Objective Force of Law**

  The metaphysics of laws of nature is defined by a tension between two competing intuitions. On one hand, scientific practice suggests that laws possess an objective modal force: they do not merely describe what happens, but govern what *must* happen, supporting counterfactuals, underwriting causation, and explaining particular events. On the other hand, empiricist caution suggests that positing invisible "governing" relations is metaphysically extravagant. David Lewis's Best System Analysis (BSA) attempts to resolve this tension by offering a Humean account where laws are nothing but compact summaries of the "Humean mosaic"—the total distribution of local, categorical particular facts. This essay argues that while the BSA offers a parsimonious ontology, it ultimately fails to ground the *objective* modal force we attribute to laws. By reducing laws to summaries of the mosaic, Humeanism renders them explanatorily idle and reverses the direction of metaphysical dependence. Consequently, despite the intelligibility costs associated with anti-Humean primitives, some form of anti-Humeanism is required to accommodate the robust modal realism implicit in scientific explanation.

  To understand the stakes, one must first grasp the Humean position. For the Lewisian Humean, reality consists entirely of the Humean mosaic: a vast array of spacetime points instantiating local qualities. There are no necessary connections between distinct existences. Laws of nature are not added to this mosaic as extra ontological furniture; rather, they supervene upon it. According to the BSA, a law is any generalization that appears as an axiom or theorem in the deductive system that best balances simplicity and strength in summarizing the mosaic. This view is attractive because it avoids "spooky" metaphysics. It promises to save the phenomena of science—prediction, systematization, and induction—without committing to mysterious necessitation relations or dispositional essences that seem to violate the empiricist spirit.

  However, this parsimony comes at a steep price regarding the modal profile of laws. The primary anti-Humean charge, articulated forcefully by philosophers like Tim Maudlin and David Armstrong, is that BSA laws are merely "book-keeping" devices. If a law is simply a summary of the facts, it cannot explain those facts. Consider the gravitational attraction of a specific planet. For the anti-Humean, the planet attracts because the law of gravitation *governs* it. For the Humean, the law of gravitation is true *because* the planet (and all other masses) attracts in that way. This creates a problem of explanatory circularity. If the truth of the law depends on the mosaic, the law cannot be the metaphysical ground of the mosaic. As Maudlin argues, this gets the direction of dependence backwards. Laws are supposed to explain why the regularities hold, not be explained by them. If the mosaic were different, the BSA laws would be different; thus, the laws lack the counterfactual stability required to support claims about what *would* have happened had circumstances been different.

  The Humean rejoinder to this charge is twofold: first, a critique of the anti-Humean alternative, and second, a reconceptualization of explanation. Humeans argue that anti-Humean accounts purchase explanatory power only at the cost of intelligibility. If one posits a primitive necessitation relation (Armstrong's "N") to connect universals, one must explain what "N" is. If "N" is not itself a regularity, what ensures that it necessitates? Armstrong's admission that "N necessitates" is a brute fact invites the charge that Humeans and anti-Humeans are in the same boat: both have brute facts. The Humean claims their brute facts (the mosaic) are observable, whereas the anti-Humean's brute facts (necessitation) are occult. Furthermore, sophisticated Humeans like Barry Loewer argue that the anti-Humean demand for "metaphysical explanation" is misplaced. On the "Package Deal" view, laws explain particular facts not by metaphysically producing them, but by featuring in the best systematization of information. Explanation is thus a pragmatic relation relative to a cognitive agent seeking compression, not a mind-independent relation of production.

  While the Humean critique of primitive necessitation has force, it does not fully exonerate the BSA from the charge of failing to ground *objective* modal force. The Humean defense relies heavily on making modality pragmatic or anthropocentric. If laws are defined by the balance of simplicity and strength, they depend on human standards of what counts as "simple." A different cognitive species might systematize the mosaic differently, resulting in different laws. But scientific realism suggests that the laws of nature would remain the same even if no observers existed to systematize them. By tying lawhood to systematization, Humeanism undermines the objectivity of modal force. If laws are just useful summaries, they cannot support counterfactuals in the robust sense required for causation. A counterfactual like "If this match had been struck, it would have lit" relies on the stability of the law across possible worlds. But for the Humean, the law is tied to the *actual* mosaic. To evaluate the counterfactual, the Humean must look for the "closest possible world" where the match is struck. But if the laws supervene on the mosaic, a change in the mosaic (the striking) might entail a change in the laws themselves in that nearby world. This leads to the absurdity that in a world where a single event differs, the fundamental laws of physics might be entirely different, undermining the very counterfactual support laws are meant to provide.

  The anti-Humean charge that BSA laws are explanatorily idle is therefore decisive regarding the specific requirement of *objective* modal force. The Humean can offer a model of *scientific* explanation (unification), but they cannot offer a model of *ontological* explanation (grounding). Science treats laws as constraints on physical possibility. A Humean law is a constraint only in the sense that a summary is constrained by the data it summarizes. It exerts no "push." To accommodate the intuition that laws *make* things happen, one requires a metaphysics where the modal force is prior to the particular facts.

  This brings us to the verdict. Is the cost of anti-Humeanism—the acceptance of unintelligible primitives—too high? I argue that it is not. The Humean accusation that necessitation relations are unintelligible assumes that all relations must be reducible to Humean categorical bases to be understood. This is a question-begging commitment to Humean metaphysics. If we accept that modality is a fundamental feature of reality, then primitive necessitation or dispositional essences are not "occult" in a negative sense; they are simply the basic bedrock of reality, much like spacetime or mass are for the Humean. The "mystery" of how a disposition produces a manifestation is no greater than the "mystery" of how a categorical property exists at a spacetime point without further explanation. Both are brute.

  However, the anti-Humean brute fact is superior because it aligns with the direction of explanation required by science. It allows laws to be truthmakers for counterfactuals without circularity. It allows causation to be a relation of production rather than mere regularity. The Humean saves intelligibility by stripping laws of their modal force, rendering them objective descriptions of *what is*, but not *what must be*. The anti-Humean preserves the modal force at the cost of accepting a primitive modality. Given that the prompt asks whether BSA can ground the *objective modal force* we *ordinarily attribute* to laws, the answer must be no. We ordinarily attribute a governing capacity to laws. Humeanism explicitly denies this capacity, replacing it with a pragmatic utility.

  Therefore, Humeanism cannot accommodate lawhood's explanatory and modal role without redefining those roles in deflationary, anthropocentric terms. If one insists that the modal force of laws is mind-independent and that laws explain the mosaic rather than vice versa, Humeanism is insufficient. The "intelligibility" cost of anti-Humeanism is a price worth paying for a metaphysics that takes the modal structure of science at face value. We should prefer a metaphysics that struggles to explain *how* necessitation works but gets the *direction* of reality right, over one that is perfectly intelligible because it reduces reality to a static mosaic that lacks the capacity to govern itself. Thus, some form of anti-Humeanism is required to ground the objective modal force of the laws of nature.
