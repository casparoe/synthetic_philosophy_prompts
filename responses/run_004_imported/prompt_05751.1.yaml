answer: |-
  It is excellent to hear from a colleague who appreciates the structural integrity of these arguments. You have correctly identified the fault line in Harsanyi's Aggregation Theorem. The theorem is often sold as a derivation of utilitarianism, but its mathematical engine relies heavily on a "common prior" assumption (or at least common probabilities) that is rarely stated explicitly in the popular philosophical summary.

  When you introduce heterogeneous beliefs, the clean mapping from **Ex Ante Pareto** (respecting preferences before uncertainty resolves) to **Social Utility** (a weighted sum) breaks down. The specific phenomenon you are recalling is often called **"Spurious Unanimity,"** a term championed by Philippe Mongin, building on the impossibility results of Hylland and Zeckhauser (1979).

  Here is the mechanics of the divergence, a bare-bones example, and an assessment of what this implies for the normative force of Harsanyi's theorem.

  ### 1. The Mechanics: Ex Ante vs. Ex Post Pareto

  To see the problem, we must distinguish two versions of the Pareto principle:
  1.  **Ex Ante Pareto:** If every individual prefers Lottery $L$ to Lottery $M$ based on their *subjective* expected utility, society should prefer $L$ to $M$.
  2.  **Ex Post (Statewise) Pareto:** If, in every possible state of the world, every individual prefers the outcome of $L$ to the outcome of $M$, society should prefer $L$ to $M$.

  Harsanyi's theorem implicitly assumes these two align. With heterogeneous beliefs, they do not. You can construct a scenario where **Ex Ante Pareto** demands you choose $L$, but **Ex Post Pareto** is violated in every single state (i.e., in every realized state, at least one person regrets the choice, and the "unanimity" that justified the choice evaporates).

  ### 2. The Bare-Bones Example

  Let us construct a "social gamble" with two agents ($A_1, A_2$) and two states of the world ($S_1, S_2$).

  **The Setup:**
  *   **Utilities:** Both agents are risk-neutral and care only about monetary payoff ($u(x) = x$).
  *   **Beliefs:** They disagree radically about the likelihood of the states.
      *   $A_1$ believes $P(S_1) = 0.9$, $P(S_2) = 0.1$.
      *   $A_2$ believes $P(S_1) = 0.1$, $P(S_2) = 0.9$.
  *   **The Options:**
      *   **Option Safe:** A sure payment of \$40 to each agent, regardless of the state.
      *   **Option Risky:** A contingent payment scheme.
          *   If $S_1$ occurs: $A_1$ gets \$100, $A_2$ gets \$0.
          *   If $S_2$ occurs: $A_1$ gets \$0, $A_2$ gets \$100.

  **The Ex Ante Calculation (Before the state is known):**
  *   **Agent 1:** Expected Utility of Risky = $0.9(100) + 0.1(0) = 90$.
      *   $90 > 40$, so $A_1$ prefers **Risky**.
  *   **Agent 2:** Expected Utility of Risky = $0.1(0) + 0.9(100) = 90$.
      *   $90 > 40$, so $A_2$ prefers **Risky**.

  **The Social Decision:**
  Since both agents prefer **Risky** to **Safe**, the **Ex Ante Pareto** principle compels the social planner to choose **Risky**. If you are a Harsanyi utilitarian aggregating these preferences, the social welfare of Risky is higher.

  **The Ex Post Reality (After the state resolves):**
  Now nature reveals the true state.
  *   **Case 1: $S_1$ occurs.**
      *   $A_1$ gets \$100 (Happy).
      *   $A_2$ gets \$0. Compared to the **Safe** option (\$40), $A_2$ is worse off. $A_2$ now prefers **Safe**.
      *   *Result:* Unanimity is broken.
  *   **Case 2: $S_2$ occurs.**
      *   $A_1$ gets \$0. Compared to the **Safe** option (\$40), $A_1$ is worse off. $A_1$ now prefers **Safe**.
      *   $A_2$ gets \$100 (Happy).
      *   *Result:* Unanimity is broken.

  **The "Everyone Worse Off" Variation:**
  You mentioned a scenario where *everyone* ends up worse off. To get that, we simply add an entry fee to the gamble that makes it a negative-sum game objectively, but positive-sum subjectively due to the belief divergence.
  *   **Modified Risky:** Same payoffs, but each must pay \$60 to enter.
  *   **Agent 1 Exp:** $90 - 60 = +30$. (Prefers to play).
  *   **Agent 2 Exp:** $90 - 60 = +30$. (Prefers to play).
  *   **Ex Post $S_1$:** $A_1$ nets \$40, $A_2$ nets -\$60. ($A_2$ regrets).
  *   **Ex Post $S_2$:** $A_1$ nets -\$60, $A_2$ nets \$40. ($A_1$ regrets).

  *Note:* To get *literally everyone* worse off in *every* state, you would need their beliefs to be not just different, but systematically wrong (e.g., they both bet on an event that is impossible). However, the structural point Mongin and Hylland/Zeckhauser make is robust even without objective falsehood: **The unanimity that justified the decision ex-ante was "spurious" because it was predicated on mutually exclusive hopes.** $A_1$ wanted the gamble because they thought $S_1$ would happen; $A_2$ wanted it because they thought $S_2$ would happen. They didn't agree on the *reason*, only the *choice*.

  ### 3. The Hylland-Zeckhauser Impossibility

  This example illustrates the core of the **Hylland-Zeckhauser (1979)** impossibility theorem. They showed that you cannot simultaneously satisfy the following four conditions for a group decision maker:
  1.  **Bayesian Rationality:** The group acts as a single Bayesian expected utility maximizer.
  2.  **Pareto Principle:** If everyone prefers $L$ to $M$, the group prefers $L$ to $M$.
  3.  **Independence of Beliefs and Values:** The group's probability assignment shouldn't depend on utility functions, and vice versa.
  4.  **Non-Dictatorship:** No single individual's beliefs/values dictate the group's.

  With heterogeneous priors, satisfying Pareto (2) forces the group to make choices that violate Statewise Dominance (a component of 1). Essentially, **you cannot aggregate beliefs and utilities separately.** If you aggregate utilities (Harsanyi's utilitarianism), you implicitly assume beliefs are already aligned. If beliefs aren't aligned, "Social Utility" becomes a function of *whose beliefs* you use to calculate the expectation.

  ### 4. Implications for Harsanyi and Utilitarianism

  Does this kill Harsanyi's argument for utilitarianism? It severely wounds it, or at least restricts its domain of validity.

  **1. The Common Prior Requirement:**
  Harsanyi's theorem effectively holds only under a **Common Prior Assumption**. If we assume all rational agents with the same information *must* have the same probabilities (an Aumann-style agreement theorem), then the problem vanishes.
  *   *The Rescue:* You can argue that differences in belief are merely differences in information. If we fully share our data, our posteriors should converge. Therefore, a social planner should aggregate based on the "rational" common posterior, not the subjective priors.
  *   *The Cost:* This is empirically fragile. In politics or ethics, people often disagree on probabilities (e.g., climate risk, economic multipliers) despite access to similar data. Dismissing these as "irrational" to save the theorem is a heavy-handed move.

  **2. Ex Post Welfarism (The Gilboa-Samet-Schmeidler Rescue):**
  Some theorists (e.g., Gilboa, Samet, Schmeidler, 2004) argue we should drop **Ex Ante Pareto** in favor of **Ex Post Pareto**.
  *   *The View:* We should only respect preferences that hold up across states. In the example above, since there is no state where *both* prefer Risky, society should not choose Risky.
  *   *The Result:* This leads to a form of utilitarianism where you aggregate utilities *state-by-state*.
  *   *The Cost:* This violates Ex Ante efficiency. It prevents mutually beneficial trades based on risk-sharing or speculative differences. It essentially says, "You cannot bet against each other, even if you both want to."

  **3. Mongin's "Spurious Unanimity":**
  Mongin suggests restricting the Pareto principle. We should only apply Pareto when the agreement is not driven *solely* by contradictory beliefs.
  *   *The Problem:* This is philosophically sound but mathematically messy. It requires the social planner to inspect the *source* of the preference (beliefs vs. values), which violates the standard "preference sovereignty" of liberal decision theory.

  ### 5. Summary for the Physicist-Philosopher

  You can think of this in terms of **sufficiency conditions**.
  *   **Harsanyi's Theorem:** $VNM + \text{Pareto} + \text{Common Probabilities} \rightarrow \text{Utilitarianism}$.
  *   **The Reality:** $VNM + \text{Pareto} + \text{Divergent Probabilities} \rightarrow \text{Incoherence (or Dictatorship)}$.

  The "Utilitarianism" derived from Harsanyi is not a robust moral truth that survives belief heterogeneity; it is a consistency condition for a group that *already agrees on the facts*.

  If you want to rescue the result, you have to move the battleground from **preferences** to **beliefs**. You must argue that the social planner should not respect subjective probabilities that deviate from the "evidence-based" consensus. If you do that, you are no longer doing pure preference aggregation (which is what Harsanyi promised); you are doing epistemic paternalism.

  In short: Harsanyi gives you utilitarianism only if everyone is looking at the same data and processing it the same way. Once you allow for "different models of the world," the weighted sum of utilities is no longer the unique solution to the aggregation problem, and respecting Ex Ante Pareto can indeed lead the group into a "Dutch Book" where the collective decision is dominated in every state.
