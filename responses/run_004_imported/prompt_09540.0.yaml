          *   *Re-evaluating:* Marcus is channeling Nozick's strongest intuition. Sofia is channeling the standard Rawlsian rebuttal (property-owning democracy). The standard rebuttal *does* allow the transactions but taxes the accumulation. Marcus says "clawing back... treats them as means." Sofia says "restricting big transfers."
          *   *Actually:* Sofia's Move 2 is the strongest theoretical point (liberty isn't monolithic). Marcus's Move 3 is the strongest rhetorical point. But theoretically, Sofia is right that Nozick defines liberty *as* unrestricted property rights, which is the dispute.
