      *   *Jurisprudence:* Is X law because the Sovereign commands it (Positivism)? OR Does the Sovereign command X because it is Just/Lawful (Natural Law)?
      *   *Mapping:*
          *   Gods $\rightarrow$ Sovereign/Legislature.
