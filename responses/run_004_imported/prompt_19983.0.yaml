      *   *Horn 2 (Natural Law/Moral Realism):* Authority recognizes the norm. Validity comes from content aligning with higher truth.
      *   *Nuance:* Hart isn't exactly a "command theorist" (Austin was). Hart talks about rules of recognition. Need to be careful not to conflate Austin's Command Theory with Hart's Positivism, though the Euthyphro analogy fits Austin better. I need to clarify this distinction for the user.

