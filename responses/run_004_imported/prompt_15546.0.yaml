prompt: |-
  Okay this is a weird one but I've been chewing on it for like a week now. In AP Econ we did a tiny unit on game theory and my teacher mentioned in passing that "expected utility" (the idea that a rational person's choices under uncertainty can be described as maximizing some number that represents how much they want stuff) basically comes from von Neumann and Morgenstern's book from the 1940s. That same week I went down a YouTube rabbit hole on AI safety, and it turns out a bunch of the "advanced AI will end up ruthlessly pursuing some goal and that's dangerous" arguments lean on pretty much the same math: the idea is that if an agent's preferences don't satisfy those von Neumann-style axioms (transitivity and so on), you can theoretically build a "money pump" that drains it dry trading with it in circles forever, so any sufficiently smart or self-improving system will supposedly get bullied by that pressure into becoming a coherent expected-utility maximizer with some fixed goal it defends, resists shutdown for, etc. My friend who's way into this stuff swears its basically proven that any smart enough AI ends up this way, no matter what its goal even is.

  That got me wondering what von Neumann himself would actually say about this if he were around today, since from what I've read he was pretty much the original cold, ruthless-numbers guy -- I saw that he was seriously in favor of the US using its nuclear monopoly to hit the USSR first because the game theory allegedly said that was just the correct move, and I think I even saw that Ulam's memorial essay about him mentions von Neumann talking about technology hurtling toward some kind of "singularity," back in the 50s, before that was even a thing anyone talked about. So: given how much this guy trusted cold expected-value math even toward pretty extreme conclusions, do you think he'd look at today's "coherence arguments" for why advanced AI is basically destined to become a dangerous utility-maximizer and go "yep, that's just my theorem playing out exactly like it should" -- or would he actually be the one to spot the weak link in stretching a math result about idealized preferences into a real prediction about how engineered systems behave? I've got to write a short reflection for extra credit and I really don't want to hand in "we can't really know" as my answer -- I want an actual position, argued for.
