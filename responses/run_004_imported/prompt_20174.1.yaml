answer: |-
  You are right to feel that your friend's objection rests on a category error, and you are also right that Ramsey is a fascinating, under-appreciated ancestor of longtermist thought. However, if Ramsey were dropped into a modern Effective Altruism meeting to discuss Nick Bostrom's *Astronomical Waste* argument, he wouldn't simply nod along. He would likely be **ethically sympathetic but epistemically hostile.**

  Here is the reconciliation of the "Two Ramseys," followed by an argument for where he would actually stand on modern longtermism.

  ### 1. Resolving the Contradiction: Stars vs. Minds
  Your friend's argument is that Ramsey contradicts himself by rejecting cosmic scale (in the "Epilogue") while embracing temporal scale (in "A Mathematical Theory of Saving").

  This conflates **physical magnitude** with **moral magnitude.**

  In the "Epilogue" (to *Facts and Propositions*, 1927), Ramsey is attacking a specific kind of nihilistic awe. He argues that the physical size of the universe is morally irrelevant because stars and galaxies lack consciousness. For Ramsey, a Moorean ideal utilitarian, value resides exclusively in "good states of mind" (love, aesthetic appreciation, knowledge). A billion stars are worth less than one human feeling love, because stars cannot value anything. He writes:

  > *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  In "A Mathematical Theory of Saving" (1928), Ramsey argues against **pure time preference**. He claims it is ethically indefensible to discount future utility simply because it happens later. Why? Because future people will have "good states of mind" just as we do.

  **The Reconciliation:** Ramsey rejects the value of *mindless* vastness (stars) but embraces the value of *minded* vastness (future generations). The "Saving" paper isn't about caring because the future is *big* in a physical sense; it's about caring because the future contains *subjects of experience*.

  So, the friend is wrong: there is no contradiction. Ramsey's ethics are consistently anthropocentric (or sentient-centric). Size only matters insofar as it correlates with the capacity for good mental states.

  ### 2. Why Ramsey Would Be Sympathetic (The Ethical Axiom)
  If you showed Ramsey the core equation of longtermism—that the value of the future is the sum of welfare across all future people—he would recognize his own handwriting.

  *   **The Indefensibility of Discounting:** Ramsey's most famous ethical quote is from the savings paper: *"We do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible and arises merely from the weakness of the imagination."* This is the exact philosophical engine driving the concern for existential risk. If you believe future people count equally, and there are potentially trillions of them, then preventing their non-existence becomes the dominant moral priority.
  *   **Ideal Utilitarianism:** Ramsey followed G.E. Moore. He believed we should maximize "good states of mind." If existential catastrophe eliminates the possibility of all future good states of mind, Ramsey's framework demands we prevent it, provided the cost isn't infinite.
  *   **Bayesian Rationality:** Ramsey is the father of Bayesian decision theory (belief = degree of belief = willingness to bet). Longtermism attempts to use expected value calculations to prioritize causes. Ramsey would appreciate the *structure* of the argument: $EV = Probability \times Impact$.

  ### 3. Why Ramsey Would Be Hostile (The Epistemic & Qualitative Critique)
  However, Ramsey was not a speculative metaphysician. He was a pragmatist and a mathematician who died at 26, leaving behind work characterized by piercing clarity and impatience with vagueness. This is where he would clash with Bostrom-style longtermism.

  **A. The "Weakness of Imagination" cuts both ways**
  Ramsey argued we shouldn't discount the future because we can't imagine it vividly. But he would likely argue that modern x-risk advocates suffer from the opposite problem: they imagine *hypothetical* futures more vividly than *actual* present ones.
  Ramsey's "Human Mood" prioritizes the concrete goods of human life (love, art, immediate community). He might view the longtermist focus on "potential people" as a violation of the human mood. To Ramsey, a future person is a moral equal, but a *hypothetical* person is a probability, not a subject. He would demand rigorous probabilities, not philosophical possibility.

  **B. Pascal's Mugging and Bayesian Rigor**
  Ramsey's decision theory requires coherent betting odds. If you claim an action saves $10^{50}$ future lives, but the probability of that outcome is $10^{-40}$, Ramsey would ask to see the math.
  Much of modern longtermism relies on "fanatical" expected value arguments (low probability, infinite/immense stake). Ramsey was deeply skeptical of vague probabilities. In *Truth and Probability*, he distinguishes between measurable belief and vague belief. He would likely categorize many x-risk estimates (e.g., probability of AI doom) as too vague to justify radical sacrifice of present welfare. He would call this **epistemic hubris**, not humility.

  **C. Quality vs. Quantity (The Repugnant Conclusion)**
  Ramsey was an *ideal* utilitarian, not a hedonistic one. He valued the *quality* of mental states (beauty, truth, love). Modern longtermism often leans toward total utilitarianism, which can lead to the "Repugnant Conclusion" (a massive population with barely worth-living lives is better than a smaller, happier one).
  Ramsey would likely reject this. Remember the "Epilogue": he values the *human* capacity for love and thought. A future of trillions of drab, subsistence-level minds might not impress Ramsey any more than a galaxy of dead stars. He would care about the *character* of the future, not just the headcount.

  ### 4. The Verdict: A "Cautious Longtermist"
  If Ramsey lived today, he would occupy a weird, nuanced middle ground.

  1.  **He would agree with the goal:** We have a duty to the future, and pure time discounting is immoral. Existential risk is a serious moral category because it destroys the container of all future value.
  2.  **He would reject the methodology:** He would likely find the speculative nature of AI risk or simulation arguments philosophically sloppy. He would demand empirical rigor before advocating for the sacrifice of present "good states of mind" for speculative future ones.
  3.  **He would prioritize resilience over optimization:** Ramsey's savings rule was about building a buffer for the future, not maximizing a specific outcome. He would likely support robust institutions, scientific progress, and general resilience rather than targeted interventions based on fragile expected-value calculations.

  **How to win your argument:**
  Tell your friend that Ramsey distinguishes between **Cosmic Indifference** (stars don't care) and **Moral Continuity** (future people will care). Ramsey rejects the former but insists on the latter.
  *   **Friend's claim:** Ramsey contradicts himself on scale.
  *   **Your rebuttal:** Ramsey is consistent on *value*. Value requires a mind. Stars have no minds; future people do. Therefore, ignoring stars and saving people is the same principle: **Maximize good states of mind.**

  Ramsey would tell the modern longtermist: *"You are right to care about the future, but do not worship the void. Ensure the future is worth having, and do not bet the house on a calculation you cannot prove."*
