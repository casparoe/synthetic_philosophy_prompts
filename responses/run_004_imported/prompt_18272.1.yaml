          *   The argument is about whether the replica is "worthless as the thing people actually want." People want the *brand*, not just the shoe. The brand is the authorization. Therefore, Dev is right about the *value* proposition, even if Maya is right about the *physics*.
          *   Dev's Move 5 successfully defends the idea that authenticity is historical/institutional, not just physical. This is the standard view in aesthetics and ontology of artifacts (e.g., David Davies, Arthur Danto).
          *   Maya's Move 6 tries to reduce value to quality ("how good it is"), but collector value is rarely about quality alone.
          *   *Decision:* Dev has the better philosophical grounding for *authenticity*, even if Maya has the better point on *utility*. Since the argument is about the replica's status ("worthless as the thing people actually want"), Dev wins on the definition of the object in a social context.
