answer: |-
  The spreadsheet on Julian's screen was a topography of green peaks and red valleys, but his eyes kept drifting to the single number in the bottom right corner: *Time-Weighted Return.* It was positive. It was, by every conventional metric, healthy. And yet, the family trust was shrinking.

  He sat in the corner office of the firm his grandfather had built, a place that smelled of old leather and dustless air. Outside, the city hummed with the frantic energy of other people making other bets. Julian's phone buzzed. It was his cousin, Marcus. Again.

  "The analysts are saying we're underexposed, Jules," Marcus said when Julian finally picked up. "The Vanguard Fund is up thirty percent this quarter. We're up four. Why are we sitting on cash?"

  "Volatility drag," Julian said, his voice sounding thin to his own ears.

  "Speak English."

  "If we lose fifty percent, we need a hundred percent gain just to get back to even," Julian said. "The Vanguard Fund is betting the farm on a coin toss that pays well on heads but hurts on tails. They're looking at the average outcome of a thousand tosses. We only get to toss it once."

  "We have a thousand cousins," Marcus snapped. "We are the crowd."

  "No," Julian said, looking at the reflection of his own tired face in the dark monitor. "We are the sequence."

  He hung up before he could explain the rest. How could he explain that the economic models governing their world were built on a phantom assumption? They assumed you could step out of time, distribute your life across a thousand parallel universes, collect the winnings from the ones where the coin landed heads, and average them with the losses from the ones where it didn't. In that ensemble of ghosts, the trust would be colossal. But in this universe, in this timeline, there was only one string of events. If the string broke, there was no averaging. There was only zero.

  The crisis had arrived three months ago with the proposal for the Helios Initiative. It was a private equity vehicle, high risk, high reward. The prospectus showed an arithmetic expected value that was undeniably positive. A fifty percent gain on success, a forty percent loss on failure. The odds were slightly in favor of success. Any rational agent, according to the textbooks Julian had studied at Wharton, should leverage up. To do otherwise was to leave money on the table. To do otherwise was irrational.

  But Julian had run the simulation. He had run it ten thousand times on his home server. He watched the line graph of the hypothetical portfolio climb, soar, and then, inevitably, plunge toward the axis. In almost every iteration, the account eventually hit a floor from which it could not recover. The arithmetic mean promised wealth; the geometric mean promised ruin.

  The Family Council was scheduled for Tuesday. Julian stood before the mahogany table, facing seven relatives who saw the trust not as a living organism to be kept alive, but as a piggy bank to be cracked.

  "We are losing ground to inflation," his Aunt Sarah said, tapping a manicured nail on the printed report. "And we are losing ground to our peers. The Hendersons have doubled their stake in five years."

  "The Hendersons are gambling," Julian said.

  "They are investing," she corrected. "You are hoarding. What is the strategy, Julian? What is the thesis?"

  "The thesis is survival," he said.

  He wanted to draw it for them. He wanted to sketch the coin. He wanted to show them that if you bet your entire bankroll on a favorable coin flip, over and over, you will go broke. It didn't matter that the odds were in your favor. It didn't matter that the *average* gambler in the room got rich. The *median* gambler starved. And they were not the average. They were the median. They were the single thread.

  But he saw their eyes glazing over. He saw the way they looked at him: not as a steward, but as a gatekeeper. They didn't feel the vertigo of the sequence. They felt the entitlement of the ensemble. They believed that because the market *could* go up, it *would* go up for them, specifically, in the order required to sustain them.

  "There is a concept," Julian said, his hands gripping the edge of the table. "In decision theory. It suggests that rationality isn't about maximizing the expected value of a single moment. It's about maximizing the growth rate over a lifetime. It's about... bargaining."

  "Bargaining?" Marcus scoffed. "With whom?"

  "With ourselves," Julian said. "With the people we will be in ten years. In twenty. If I take this bet, the 'Julian' of today gets to look successful. The 'Julian' of ten years from now might not exist. The money might not exist. I am negotiating a treaty between my present self and my future selves. If I break that treaty to please you, I bankrupt the future."

  The room was silent. For a moment, Julian thought he had reached them. He thought he had transmitted the weight of the geometry, the crushing difference between the space of possibilities and the line of time.

  Then Aunt Sarah sighed. "We aren't asking you to bankrupt us, Julian. We're asking you to stop treating this money like it's radioactive. We need yield. If you can't provide it, we'll vote to bring in an outside manager who can."

  The threat hung in the air, heavy and real. It was the ultimate ergodic trap. If he capitulated to keep his job, he might trigger the ruin he feared. If he held firm, he might be fired, and the outside manager would certainly leverage up to show quick gains. The system itself selected for the gamblers. The market was an ecosystem that rewarded the arithmetic maximizers, even if it periodically cycled through and ate them. It didn't care about the individual. It cared about the flow.

  Julian looked at the faces around the table. He saw his own face in Marcus, in Sarah. They were all versions of the same lineage, branching out. In a way, they *were* an ensemble. If one branch died, the name survived. But the capital was shared. The capital was the soil.

  "I will adjust the allocation," Julian said quietly.

  He saw the relief wash over them. He saw the calculation in their eyes: *Finally.*

  "But not to the Helios limit," he added. "I will take a fraction. A slice."

  He was thinking of Kelly. He was thinking of the rule that wasn't really a rule, but a boundary. *Bet only enough to maximize growth, never enough to risk absorption.* But even Kelly assumed you knew the odds. Julian didn't know the odds. He only knew the distribution of outcomes was wider than anyone admitted.

  He returned to his office and closed the door. He opened the spreadsheet again. He began to type, adjusting the variables. He reduced the exposure to the Helios Initiative. He increased the cash reserves. The projected return dropped. The risk of ruin decreased, but it did not vanish.

  There was no perfect solution. That was the terror of it. The economists wanted him to believe there was an optimal path, a golden line through the noise. But the noise was the reality. The line was the fiction.

  He leaned back in his chair. He thought about the phrase he had used in the meeting. *Bargaining among competing possible futures.* It sounded poetic, but it was a violence. To choose one future was to kill the others. By choosing safety, he was killing the future where the trust doubled and funded scholarships and new wings on hospitals. By choosing risk, he was killing the future where the family remained solvent through a depression.

  He was not managing money. He was managing time. He was the editor of a story that hadn't been written yet, cutting scenes to keep the protagonist alive, knowing that a story without conflict was boring, but a story without a protagonist was nothing.

  Julian saved the file. He didn't feel triumphant. He felt like a man walking a tightrope who had just been told to carry a heavier pole. He knew that somewhere, in a parallel office in a parallel city, another version of himself had signed the Helios contract. That Julian was likely richer right now. That Julian was likely happier. That Julian was likely on the verge of a catastrophe that hadn't happened yet.

  Julian closed his laptop. The city outside was darkening. The lights of the other buildings flickered on, thousands of them, each one a different bet, a different sequence, a different life burning through its fuel. He wondered if any of them understood that they were alone in their timeline, or if they all believed, as his family did, that the average was a promise rather than a ghost.

  He picked up his phone and dialed Marcus.

  "I've sent the revised allocation," Julian said.

  "Good," Marcus said. "See? It wasn't that hard."

  "It's not hard," Julian said, watching his own reflection in the window, superimposed over the grid of the city. "It's just expensive."

  He hung up. He sat in the quiet room, waiting for the future to arrive, knowing it would come one second at a time, and that no amount of averaging could save him from the order in which it came. He was the sample size of one. He would have to be enough.
