  **Score:** 16/20  
  **Letter Grade:** B+ (80%)

  ### Grading Comments

  **Part (a): Formal Derivation & Properties (7/8 points)**
  You correctly identified the two crucial properties of the knowledge operator: **Distribution** ($K(p \land q) \to Kp \land Kq$) and **Factivity** ($Kp \to p$). Your prose explanation of the reductio is logically sound and follows the correct steps to reach the contradiction ($Kp \land \neg Kp$). However, the prompt asked for a **formal derivation**. In this course, that typically requires numbered lines with explicit justification (e.g., "Assumption," "KP Instantiation," "Dist," "Fact") rather than a paragraph description. I've deducted one point for the lack of symbolic notation, as precision in formalism is part of the learning objective here.

  **Part (b): Premises & Anti-Realism (7/7 points)**
  This is excellent. You correctly identified that **KP** is the premise standardly rejected (or restricted) and gave the precise reason why this targets anti-realists specifically (their commitment to truth being epistemically constrained vs. the realist's willingness to allow truth to outrun verification). Mentioning Tennant's restriction to "Cartesian" propositions is a strong addition that shows you've engaged with the literature beyond the basics. 
  *Minor note:* You listed Quine alongside Dummett as a semantic anti-realist in your intro. Quine is generally classified as a realist/naturalist; Dummett or Putnam would be the standard examples here. I didn't deduct points here as it was introductory context, but be careful with those attributions in future essays.

  **Part (c): Accuracy of the Gloss (2/5 points)**
  This is the main area for improvement. You argued that the gloss ("there are truths that can never be known") is accurate because the argument shows an unknown truth $p$ is never known. **This is incorrect.** The proof does *not* show that $p$ is unknowable. It shows that the **conjunction** $(p \land \neg Kp)$ is unknowable. 
  $p$ itself might be known tomorrow; what can never be known is the specific state of affairs where "$p$ is true AND $p$ is unknown." The accurate gloss is that there are *some* truths (specifically Moorean conjunctions) that are unknowable, not that any arbitrary unknown truth is permanently unknowable. Because this distinction is the central philosophical lesson of Fitch's paradox, I have to deduct significantly here despite the strong performance on (a) and (b).

