answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Two professors, Elena (philosophy of psychiatry) and Marcus (clinical psychology), are finishing up coffee after a department seminar.*

  **Elena:** You stayed quiet during the Q&A, but I saw you wince when the grad student brought up the TikTok DID wave.

  **Marcus:** Because it's a minefield. If you say anything critical, you're invalidating trauma. If you say nothing, you're ignoring a massive shift in symptom presentation. But honestly? It looks like history rhyming.

  **Elena:** Exactly. That's why I'm stuck on Hacking. The "looping effect." It feels like the 1980s MPD panic all over again. Back then, *Sybil* and *The Three Faces of Eve* come out, suddenly everyone has dozens of alters. Now, it's algorithms instead of movies. A teen gets diagnosed, goes online, sees what a "system" is supposed to look like, and their presentation shifts to match the category.

  **Marcus:** I know the Hacking argument. "Interactive kinds." But I think you're letting the philosophy obscure the clinical reality. You're implying that because the *label* changes the *person*, the disorder is somehow less real.

  **Elena:** Not less real. *Unstable.* That's the point. Hacking distinguishes between "indifferent kinds"—like quarks or tigers—and "human kinds." If I classify a tiger as endangered, the tiger doesn't change its behavior to fit the classification. It just is. But if I classify a teenager as having Dissociative Identity Disorder, they Google it. They join Discords. They learn the script. The classification *causes* the classified to evolve.

  **Marcus:** But isn't that just refinement? Look at biology. We used to classify whales as fish. Then we realized they were mammals. The category shifted, the animals didn't change, but our understanding did. Why is psychiatry unique? When we get better at spotting dissociation, of course more people present with it. That's better detection, not a loop.

  **Elena:** Because the whale didn't read the taxonomy book. In the TikTok case, the taxonomy is the content. The "symptom pool"—the available ways to express distress—is being curated by an algorithm. In the 80s, the "expected" MPD patient had two or three alters. Now, on TikTok, I'm seeing claims of hundreds. Why? Because the community rewards complexity. The category isn't just describing a thing; it's prescribing a shape. That makes the ontology shaky.

  **Marcus:** Okay, but let's follow that thread. You say the *shape* changes. I say the *substrate* remains. The substrate is severe, chronic trauma and a capacity for dissociation. Whether that manifests as "I have 50 alters" or "I have memory gaps" or "I feel unreal," the underlying neurobiology of trauma response is constant. The looping is just noise on the signal.

  **Elena:** But what if the noise *becomes* the signal? If the diagnostic criteria rely on self-report—and with DID, they largely do—and the self-report is shaped by the diagnostic criteria... where is the anchor? In chemistry, if I discover an isotope, it doesn't start acting like a different element because I named it. In psychiatry, the naming *is* part of the mechanism.

  **Marcus:** You're conflating "socially influenced" with "socially constructed." Yes, culture shapes how we express pain. In the 19th century, women had "hysteria" and fainting spells. Now, we have panic attacks and dissociation. The *language* loops. But the suffering? The dysfunction? That's not a loop. That's a brain under siege. If a kid on TikTok identifies with DID and it gives them a framework to understand their fragmentation, is it a problem that the framework came from a video?

  **Elena:** It is if the framework creates the fragmentation. Hacking calls it "making up people." I'm worried we're seeing iatrogenesis on a cultural scale. If the algorithm pushes content that says "If you hear a voice, that's an alter," a kid who might have had generic auditory intrusions now interprets them as a persona. They start naming it. They start negotiating with it. They have now *become* a multiple, where before they were just distressed. The category didn't find them; it built them.

  **Marcus:** That's a heavy claim. "Built them." I'd argue the category *organized* them. Think about pain. If I tell you "this headache is a migraine, here's what triggers it," you start monitoring triggers. Your experience of the headache changes. You become a "migraineur." Does that mean the migraine isn't biological? No. It means human beings are interpretive animals. We need narratives to make sense of somatic chaos. TikTok is just a very loud, very fast narrative engine.

  **Elena:** But the speed matters. Hacking was writing about decades. TikTok does this in weeks. The feedback loop is algorithmic. The classification system *is* the recommendation engine. If you engage with DID content, the app feeds you more extreme versions of DID. It selects for high-symptom loads. So the "kind" we are studying is drifting toward the extreme because the classifier (the algorithm) benefits from engagement. Can a natural kind drift because the microscope wants you to look longer?

  **Marcus:** Okay, I'll grant you the algorithm accelerates the cultural script. That's new. But does that invalidate the diagnosis for everyone? There are people with DID who never touched the internet. Old school cases. The core phenomenology—amnesia, identity alteration, distress—holds up. You're using the TikTok edge case to destabilize the center.

  **Elena:** I'm using the edge case to show where the category leaks. If the boundaries of the disorder are permeable to cultural expectation, then the disorder isn't a "natural kind" waiting to be found. It's a dynamic interaction. And that matters for treatment. If we treat the "alters" as objective entities because the patient says they are, are we reinforcing the loop?

  **Marcus:** Or are we validating the patient's reality to reduce shame? Look, I agree that the "hundreds of alters" thing is suspicious. It mirrors the 80s inflation. But the solution isn't to say "Psychiatric kinds are shaky." It's to say "Clinicians need to be better gatekeepers." We need to distinguish between *having* a disorder and *performing* a disorder identity.

  **Elena:** But can you distinguish them? If the performance alleviates the distress by providing community, the performance *is* the coping mechanism. The looping effect isn't a bug; it's the feature of human psychology. We become what we are called. That's why I think psychiatric categories are fundamentally different from biological ones. A tiger doesn't become more tiger-like if you call it a tiger. A person might.

  **Marcus:** But they don't become *anything*. They can't loop themselves into having a seizure disorder if they don't have the neural wiring. There are constraints. The looping happens within the bounds of human neurobiology. You can't TikTok yourself into having three hearts. You can TikTok yourself into interpreting your anxiety as "alter switching."

  **Elena:** True. The biology sets the hardware limits. But the software? The experience? That's entirely loopable. And since psychiatry treats the *experience* of the illness, not just the hardware...

  **Marcus:** ...Then the looping effect is just part of the job description.

  **Elena:** Or it's a warning label. If the category changes the thing it classifies, we have to admit our classifications aren't neutral maps. They're interventions.

  **Marcus:** I can live with that. As long as you admit that even if the map changes the territory, the territory was still there to begin with. The trauma is real. The dissociation is real. Even if TikTok taught them the words for it.

  **Elena:** I can agree to that. But we need to watch out for when the words start writing the story themselves.

  **Marcus:** Deal. But I'm still grading the papers on the 80s MPD wave. You handle the TikTok case studies.

  **Elena:** *Laughs.* Fair. Just don't let the alters grade themselves.

  **Marcus:** Don't tempt me.
