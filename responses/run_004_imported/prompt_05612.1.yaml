answer: |-
  Here is a move-by-move adjudication of the exchange, drawing on the contemporary literature regarding moral testimony and moral worth.

  **(1) Leah: Partly holds up.**
  Leah is correct that demanding philosophical expertise for basic moral compliance is elitist and ignores the division of epistemic labor. We generally accept testimonial knowledge in ethics just as we do in history or science. However, she conflates the *rightness of the action* with the *moral worth of the agent*. While Ana's action is objectively better than continuing to buy battery-cage eggs, Leah's claim that Ana deserves "genuine moral credit" glosses over the intuition that moral worth often requires acting from one's own grasp of the reasons, not merely deferring to another's will.

  **(2) Marcus: Partly holds up.**
  Marcus correctly identifies the fragility of Ana's commitment via the counterfactual test (if Owen changed his mind, would Ana?). This touches on the autonomy condition for moral worth. However, his medical analogy is weak. We *do* credit patients for trusting doctors; we don't demand they understand the pathology to be praised for managing their health. His claim that one must "see for themselves why gratuitous suffering matters" sets a high bar that risks moral solipsism. Many moral truths (e.g., complex structural injustices) are *only* accessible via testimony.

  **(3) Leah: Holds up.**
  This is Leah's strongest move. Epistemologically, there is no hard distinction between childhood socialization and adult testimonial uptake; both rely on trusting sources before (or without) verifying the underlying grounds. If Marcus implies that inherited beliefs are "anchored" merely by time, he commits a genetic fallacy. If the content of the belief is what matters, Ana's belief is functionally identical to the inherited belief Marcus wants to protect. This successfully challenges Marcus to explain why *adult* deference is uniquely deficient.

  **(4) Marcus: Holds up.**
  Marcus successfully refines his position to avoid Leah's socialization objection. He shifts from the *source* of the belief to the *structure* of the belief state. This aligns with Alison Hills' distinction between *moral knowledge* (which Ana has) and *moral understanding* (which she lacks). A belief integrated into a web of commitments is resilient and guides action across contexts; a belief held on "say-so" is isolated. Marcus is right that moral credit is typically reserved for the former, as it reflects the agent's own evaluative outlook rather than mere compliance.

  **What Both Are Missing**
  Both Leah and Marcus are arguing past one another because they fail to distinguish between *conformity* with moral truth and *moral understanding*. Leah focuses on the outcome (suffering is reduced), while Marcus focuses on the agency (autonomous conviction). What they are missing is the specific epistemic good at stake: Ana has true moral belief, but she lacks the ability to explain *why* the practice is wrong or to apply that reasoning to analogous cases (e.g., dairy or meat). As a result, she cannot function as a moral deliberator in new contexts. The disagreement isn't about whether she did the right thing (she did), but whether deference can ever generate the *understanding* required for full moral maturity. They need to shift the debate from "credit" to the value of moral autonomy in a testimonial world.
