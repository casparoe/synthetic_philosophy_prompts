      *   *Focus on the Second-Order Move:* The user says "I can simply place a precise second-order probability." The IP proponent asks: "On what grounds?" If the evidence is too weak for a first-order sharp value, it's arguably too weak for a second-order sharp value. Assigning a distribution over distributions is just pushing the arbitrariness back a step.
      *   *Ellsberg:* In Ellsberg, people prefer known risk to unknown ambiguity. A sharp Bayesian explains this via non-linear utility (Machina/Schmeidler). An IP theorist explains it via the structure of belief. The IP explanation is often seen as more parsimonious regarding utility.
      *   *Suspension of Judgment:* A sharp Bayesian *must* have a price for every bet. An IP agent can say "I don't know." This is a crucial functional difference.

