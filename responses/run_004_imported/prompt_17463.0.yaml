answer: |-
  Here are ten questions tailored for your discussion group. They are designed to be accessible to your members while demonstrating a solid grasp of the literature to your guest.

  I have grouped the three required topics with their follow-ups. For the follow-ups, I have included a brief note on the **Likely Answer** so you understand the strategic reason for asking it.

  ### Part 1: The Rival Explanations

  **1. The Pragmatics Challenge (Adams & Steadman)**
  Fred Adams and Annie Steadman have argued that the Knobe Effect isn't about the *concept* of intentionality at all, but rather about conversational pragmatics. They suggest that when people say the chairman "intentionally" harmed the environment, they are loosely implying he is blameworthy, not literally describing his mental states. How do you distinguish between a genuine shift in the semantic content of "intentional" versus a Gricean implicature that listeners are simply mistaking for literal meaning?

  **2. Follow-up to Q1**
  *(Likely Answer: She will likely cite studies where the effect persists even when researchers try to block pragmatic inferences, or argue that pragmatics alone can't explain the robustness of the data.)*
  **Question:** If the effect persists even when pragmatic cues are controlled for, as you suggest, why do we still see variance in the effect size depending on how the question is phrased? Does that variability suggest there is still a pragmatic layer sitting on top of the moral concept, rather than the moral concept doing all the work?

  **3. The Normative Challenge (Uttich & Lombrozo)**
  Christian Uttich and Tania Lombrozo have presented data suggesting this asymmetry arises whenever a *norm* is violated, even if that norm isn't moral (e.g., conventions of etiquette or skill). If the effect triggers on normative expectations generally, does that force you to retreat from the claim that *morality* specifically shapes the concept of intention, to the weaker claim that *normativity* does?

  **4. Follow-up to Q3**
  *(Likely Answer: She will likely argue that moral norms are the "prototype" or most central case of normativity, so the moral explanation is still the primary one.)*
  **Question:** If moral norms are just the most salient subset of normative norms, does that imply the "Knobe Effect" is actually evidence for a general cognitive architecture regarding rule-violation, rather than evidence for the specific thesis that folk psychology is inherently moralized?

  ### Part 2: Generalization and Scope

  **5. Generalization to Other Concepts**
  We see this same asymmetry not just in judgments of intentional action, but in judgments of *causing*, *deciding*, and even *wanting*. Do you view intentionality as the "root" concept that drags these others along with it, or do you think our entire folk-psychological framework is pervasively moralized from the ground up?

  **6. Follow-up to Q5**
  *(Likely Answer: She will likely argue for the pervasive view—that our whole understanding of the mind is morally laden.)*
  **Question:** If our entire folk-psychological framework is morally laden, does that make communication between people with fundamentally different moral frameworks impossible? If I don't share your moral valuation of an act, do we literally mean different things when we say someone "decided" or "caused" it?

  ### Part 3: Stability and Implications

  **7. Cross-Cultural Stability**
  Much of the early literature relied on Western, educated participants. More recent cross-cultural studies have shown mixed results; some cultures show a weaker or reversed effect. How much does your theory rely on the effect being a universal feature of human cognition, and how do you accommodate cultural variance without conceding that the concept is socially constructed rather than built-in?

  **8. Atypical Moral Processing**
  Have you seen compelling data from populations with atypical moral processing, such as individuals with psychopathy or certain autism spectrum profiles? If the effect is driven by moral judgment, we might expect it to diminish in people who process moral emotions differently. Does the existing data on these groups support or threaten your view?

  **9. The Prescriptive Question**
  Let's step away from the descriptive claim for a moment. Even if you are right that morality *does* influence our concept of intentionality, is this a feature we should preserve or a bug we should try to correct? If we want a legal or philosophical system based on neutral mental states, should we be training ourselves to ignore this intuitive moral pull?

  ### Part 4: Falsification

  **10. The Falsification Condition**
  Finally, experimental philosophy often faces the criticism that it is compatible with too many theories. To put it directly: what specific pattern of empirical results would convince you that you are wrong? Is there a vignette, a demographic, or a linguistic test that, if the data came out the other way, would force you to abandon the view that moral judgment is constitutive of intentionality?
