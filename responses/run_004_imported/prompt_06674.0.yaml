prompt: |-
  My mom died two weeks ago and Im giving her eulogy Saturday. She was a hospice nurse for 30 years, and there's one night early in her career she never got over: she'd promised a dying patient with no family that she'd personally be there when he went, and partway through her shift he started to slip at the exact moment another patient's husband collapsed in the hallway and she was the only one who could act. She couldn't do both, so she went to the husband, and the old man died alone. Whenever anyone later told her "you did the right thing, you've got nothing to feel bad about," she'd say that missed the point -- there hadn't been a right thing available, just two real obligations and not enough of her, and going to the husband didn't make the promise stop being real, it just meant she broke it. She told my sister flat out she didnt want anyone "absolving" her of it at the funeral. I need the actual eulogy, maybe 6 minutes, for a room that's half hospice/ICU people who'll know if I fake the hard part and half family who just want to hear she's at peace -- and it has to be honest that being stuck owing two people something real with no answer underneath was just how it was, not a puzzle she failed to solve.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** The child of the deceased.
      *   **Deceased:** A hospice nurse for 30 years.
      *   **Key Story:** Early in her career, she promised a dying, lonely patient she'd be there when he passed. Simultaneously, another patient's husband collapsed. She had to choose. She saved the husband; the lonely patient died alone.
      *   **Her Perspective:** She never got over it. She rejected the idea that she "did the right thing." She believed there was no "right" choice, just two real obligations and not enough of her. She broke a promise. She didn't want to be "absolved" of it at the funeral.
      *   **Audience:** Half hospice/ICU professionals (will detect insincerity or medical inaccuracies), half family (want comfort/peace).
      *   **Tone:** Honest, raw, not seeking closure/absolution, acknowledging the weight of the burden without trying to fix it.
      *   **Length:** Approximately 6 minutes (roughly 750-900 words spoken at a moderate pace).
      *   **Constraint:** Must honor her specific wish *not* to be absolved of this specific memory, while still honoring her life.

  2.  **Determine the Core Theme:**
      *   The theme isn't "she was a saint." The theme is "she was a witness."
      *   It's about the weight of care.
      *   It's about the impossibility of the job and how she carried that impossibility without letting it harden her.
      *   The specific story *must* be included, but framed exactly as she saw it: a tragedy of limitation, not a moral triumph.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the dual audience (colleagues and family). Set the tone immediately—this isn't a polished PR speech.
      *   **Her Career:** 30 years in hospice. What does that actually mean? It means holding hands in the dark. It means being the family when there is none.
      *   **The Story (The Crux):** This needs careful handling.
          *   *Do:* Tell it plainly.
          *   *Do:* State her reaction (she didn't get over it).
          *   *Do:* State her philosophy (no "right thing," just broken promises).
          *   *Don't:* Try to explain away why she was right to save the husband.
          *   *Don't:* Say "she's looking down and knows it was okay."
      *   **The Lesson:** What does this say about her character? It says she took the cost of care seriously. She didn't let the math of triage erase the humanity of the promise.
      *   **Addressing the Colleagues:** Acknowledge they know this feeling. The "not enough of her" sentiment.
      *   **Addressing the Family:** Acknowledge they want her at peace. Reframe "peace" not as forgetting, but as being fully known.
      *   **Closing:** A final goodbye that respects her boundaries. No false absolution. Just love and witness.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Mom was a nurse. She loved it. But it was hard. There was this one time she had to choose between two patients. One died alone. She hated that people told her it was okay. She said it wasn't okay, she broke a promise. I'm not going to tell you it was okay today. She taught us that caring means carrying the weight. To her friends, you know this. To family, we miss her. Goodbye Mom.

      *Critique 1:* Too blunt. Needs more warmth and flow. Needs to hit the 6-minute mark. Needs to bridge the gap between the professionals and the family better.

  5.  **Drafting - Iteration 2 (Fleshing out the narrative):**
      Start with the 30 years. That's a lot of deaths. But she carried the one she couldn't fix. Tell the story of the hallway collapse vs. the lonely man. Use her words: "Not enough of her." Tell the colleagues: I know you know this. Tell the family: This is what her love looked like, it was heavy. End with: We won't absolve you, Mom. We'll just remember you.

      *Refining the Tone:* The prompt says "it has to be honest that being stuck owing two people something real with no answer underneath was just how it was." This is the philosophical anchor. The eulogy needs to sit in that discomfort.

  6.  **Writing the Content (incorporating specific phrases):**
      *   *Phrase:* "Two real obligations and not enough of her."
