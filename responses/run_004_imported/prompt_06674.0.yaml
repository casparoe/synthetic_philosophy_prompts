answer: |-
  Good morning. Thank you all for being here.

  For those who don't know me, I'm [Your Name]. My mother, [Mom's Name], spent thirty years in hospice care. If you're sitting in the half of this room wearing scrubs under your suit, or if you've ever worked a night shift in an ICU, you know what that number means. Thirty years of thresholds. Thirty years of being the last thing a person sees.

  Family friends and relatives might picture that as a saintly vocation. And in a way, it was. But my mother didn't want a eulogy that polished the stone. She wanted the truth of the weight.

  There is a story she told my sister once, early in her career. She had a patient, an old man with no family. He was terrified of dying alone. She promised him she would be in the room when he went. She gave him her word.

  Later that shift, another patient's husband collapsed in the hallway. Cardiac event. She was the only one there. She had seconds to choose. She went to the husband. She saved him. The old man died while she was compressing the husband's chest.

  For the rest of her life, people told her, "You did the right thing. You saved a life. You have nothing to feel bad about."

  She hated that. She told my sister, "That misses the point. There wasn't a 'right thing.' There were two real obligations, and not enough of me to go around. Going to the husband didn't make the promise to the old man stop being real. It just meant I broke it."

  She asked me specifically not to stand here and try to absolve her of that. She didn't want this to be a service where we explain away the hard parts of her life with comforting math. She knew the math. The math said one life saved is better than one lonely death. But she also knew that love doesn't always do the math. Love keeps the ledger.

  So, I'm not going to tell you she's looking down right now knowing it was all okay. I'm not going to tell you that the old man understood, or that the universe balanced the scales.

  Because here is what that story actually tells us about her. It tells us that she didn't let the necessity of triage harden her heart. It is very easy, after thirty years, to stop hearing the promises. It is easy to let the limitations of the job become an excuse for the limitations of the soul. Many people in her profession have to build a wall to survive the grief. My mother refused to build the wall. She carried the debt.

  To her colleagues here: You know this feeling. You know the specific gravity of a promise you couldn't keep because the world is chaotic and human hands are limited. She carried that for thirty years and never let it make her cynical. She never let it make her less present for the next person. She walked around with that hole in her pocket and still showed up, fully, for everyone else. That isn't a failure of character. That is the cost of the kind of care she gave.

  To the family here, who just want to know she's at peace: I think she is. But not because she forgot. She is at peace because she was fully known. She didn't hide the scars. She taught us that peace isn't the absence of regret; it's the integrity to carry it without lying about it.

  She taught me that being a good person doesn't mean you always make the right choice. Sometimes, it just means you honor the cost of the choice you had to make. She honored the old man. She honored the husband. And she honored us, by never pretending the job was easier than it was.

  Mom, we aren't going to fix this for you today. We aren't going to tell you it didn't happen the way you felt it happened. We are going to stand here and witness what you witnessed. We acknowledge the promise. We acknowledge the break. And we acknowledge that you carried it with grace.

  You were enough, even when you felt you weren't. You are loved, not despite the weight you carried, but because of the way you carried it.

  Rest now. The shift is over. The ledger is closed. We've got the watch from here.

  Thank you.
