      *   **Tolstoy's Theory (Simplified):** Good art must "infect" the audience with a feeling of religious/Christian brotherhood, uniting people across class lines. If it doesn't do this, it's not good art (or is "counterfeit" art).
      *   **The Interviewee:** A scholar who defends Tolstoy's theory almost wholesale.
      *   **The Problem:** The scholar has a defensive maneuver (a "get-out-of-jail-free" card). When presented with counterexamples (e.g., *King Lear*, late Beethoven, Tolstoy rejecting *War and Peace*), she dismisses them by claiming the *urge to defend them* is proof of "aristocratic training" or elite bias, thus reinforcing Tolstoy's point rather than refuting it. This makes the theory unfalsifiable.
      *   **The Goal:** Write 6-7 interview questions that progressively tighten the logical screws on this defensive maneuver, culminating in a question that forces the scholar to define what *would* count as evidence against the theory (falsifiability).

  2.  **Deconstruct the Scholar's Defensive Maneuver:**
