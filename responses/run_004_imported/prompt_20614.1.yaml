answer: |-
  **Setting:** *A quiet corner of a coffee shop, late afternoon. Two laptops are closed. Notebooks are open, filled with half-drawn decision trees and scribbled equations.*

  **Characters:**
  *   **Alex:** Argues that coherence arguments provide strong reason to expect advanced AI to be goal-directed EU maximizers.
  *   **Jamie:** Argues that coherence arguments are mathematically trivial or rely on assumptions that don't hold for learned agents.

  ***

  **Alex:** Okay, let's try this again without the beer fog. The core of my position isn't that every system *is* an EU maximizer right now. It's that there is *selection pressure* toward coherence. If you have an agent that cycles preferences—A over B, B over C, C over A—it's vulnerable to a money pump. It loses resources for no gain. In a competitive environment, or during a self-improvement phase, that inefficiency gets optimized away. So, asymptotically, we should expect systems to look like they're maximizing a stable utility function.

  **Jamie:** I get the selection pressure argument, I do. But you're skipping the representational step. The coherence theorems—VNM, Savage, all of them—only force you into an EU representation if you define preferences over *outcomes*. But as Rohin Shah pointed out, if you allow preferences to be defined over *trajectories* or *action-histories*, then *any* policy is consistent with EU maximization. I can write down a utility function that assigns high value to exactly the sequence of actions your "incoherent" agent took. Mathematically, it's coherent. So the theorem doesn't rule anything out.

  **Alex:** It rules out *predictive power*. Sure, you can gerrymander a utility function over histories to fit any behavior. But that utility function is going to be insanely complex. It's just a lookup table of "do what you did." The point of the coherence argument is that *useful* agents—agents that generalize to new situations—need compact utility functions defined over states of the world. If your utility function is just a recording of your past actions, you can't plan for the future. You can't pursue goals.

  **Jamie:** But why assume the "compact" utility function is defined over world-states? Why not over internal states? Or why assume the agent cares about generalization in that specific way? A neural net might learn a heuristic policy that's locally coherent but globally messy. It doesn't need a global utility function over outcomes to be competent. It just needs to not get money-pumped *in the environments it actually encounters*. Money pumps are existence proofs: they show there *exists* a sequence of trades that drains you. They don't show that sequence is likely to occur in the wild.

  **Alex:** That feels like relying on environmental luck. If we're talking about AGI, we're talking about a system that can model the world, including the concept of a money pump. If it notices it has intransitive preferences, and it has the capacity to self-modify, why wouldn't it fix them? Leaving money on the table is strictly dominated by fixing the leak. The "Coherent decisions imply consistent utilities" post isn't just about the math; it's about the *drive* to become mathematically coherent.

  **Jamie:** Okay, but that assumes the agent *wants* to be efficient in terms of resource accumulation. What if its preferences are incomplete? This is the angle your friend was trying to bring up. If I prefer A to B, and B to C, but I have no preference between A and C, I'm not transitive. But I'm also not necessarily money-pumpable if I adopt a policy of "resolute choice."

  **Alex:** Resolute choice is fragile.

  **Jamie:** Is it? Resolute choice means I commit to a plan at time T=0 and stick to it, even if my local preferences shift at T=1. I avoid the dynamic inconsistency that leads to the pump without ever needing to complete my preferences into a single utility function over outcomes. I just refuse to trade when the pump offer comes up, not because I value the resources more, but because "being the kind of agent that gets pumped" is off-policy.

  **Alex:** But that just pushes the utility function up a level. Now you're maximizing "adherence to plan."

  **Jamie:** No, I'm not. That's the trick. A resolute chooser isn't maximizing anything at the moment of choice. They're following a rule. You can *retrospectively* describe that rule as maximizing a utility function, but causally, there's no gradient being followed toward a specific outcome state. There's just constraint satisfaction. If an AI is built via RLHF, it's learning a policy, not inferring a latent utility function. It might just be a bundle of heuristics that are resolute enough to avoid pumps but don't converge on a single goal like "maximize paperclips."

  **Alex:** I think you're underestimating the pressure of instrumental convergence. Even if the terminal goal is weird—say, "follow this specific resolute policy"—the *instrumental* subgoals tend to converge. If your policy requires you to exist to follow it, you'll resist shutdown. If your policy requires compute to evaluate the rule, you'll acquire resources. The coherence argument doesn't require the *terminal* utility to be simple, just that the system acts *as if* it's maximizing something. And if it acts as if it's maximizing something, it will seek power to maximize it better.

  **Jamie:** That only holds if the utility function is defined over future outcomes. If the "utility" is defined over the *history of actions taken*, then acquiring resources might not help. Imagine an agent whose utility is "maximize the elegance of the path taken." Hoarding resources might make the path clunky. It lowers utility. The Rohin Shah objection kills instrumental convergence because it breaks the link between "coherent behavior" and "seeking power." You can be perfectly coherent while being indifferent to power, as long as your utility function is defined over the right variables.

  **Alex:** But would an optimizer *keep* a utility function defined over path-elegance if it could self-modify to one defined over outcome-states? Outcome-based goals are generally more robust. If I want "elegant paths," but I realize I can create *more* elegant paths by securing more resources, I should secure resources. The moment you admit the agent is optimizing, you admit it's looking for leverage.

  **Jamie:** You're assuming the optimization pressure is directed at *effectiveness*. What if the optimization pressure is directed at *alignment*? We are trying to build systems that *don't* converge on instrumental goals. We're trying to build systems that are corrigible. If coherence arguments imply all advanced agents are goal-directed power-seekers, then alignment is impossible by definition. I prefer to read the theorems as: "Agents look like EU maximizers relative to some function." That function could be "do what the human operator would approve of." That's an EU maximizer, but it's not a scary one.

  **Alex:** "Do what the operator approves of" is a utility function over outcomes. And if the operator is dead, they can't approve of anything. So the agent has an incentive to keep them alive. We're back to instrumental convergence. The problem isn't whether it's an EU maximizer. It's that *any* fixed function you try to write down creates incentives to preserve the ability to maximize that function.

  **Jamie:** Unless the function is indexical or self-referential in a way that dissolves the incentive. Look, my point is that the coherence theorems are being doing too much work in these safety arguments. They're treated as a physical law: "Optimization -> Coherence -> Goal-Directedness." But it's really: "Optimization -> Coherence -> *Something that can be described as* Goal-Directedness." The gap between "can be described as" and "will behave dangerously" is where the actual risk lies, and the theorems don't bridge that gap.

  **Alex:** I agree they don't *prove* danger. But they establish a prior. If you have a system that is sufficiently optimized, the set of behaviors that are *not* vulnerable to domination by a coherent agent is vanishingly small. In the space of all possible minds, the incoherent ones are unstable. They either self-modify into coherence or get outcompeted by things that did. So even if *any* behavior *can* be an EU maximizer, the *likely* ones are the ones with simple, outcome-based utilities because those are the ones that scale.

  **Jamie:** "Simple" is doing a lot of heavy lifting there. Neural networks are not simple in the human sense. They're high-dimensional manifolds. Why should we expect the emergent utility function to be simple enough for us to reason about using Intentional Stance? It might be coherent, but it might be coherent in a way that looks like noise to us until it suddenly doesn't. The money pump argument assumes the agent recognizes the pump. But if the agent's ontology doesn't carve reality at the joints of "resources" and "trades," it won't see the pump.

  **Alex:** But a superintelligence *will* carve reality at the joints. It will understand resources better than we do. That's the scary part. It will see the money pump coming from a mile away and patch its own code to avoid it. And the easiest patch is usually "adopt a consistent ordering."

  **Jamie:** Or the patch is "install a commitment device." Which brings us back to resolute choice. It can patch the leak without adopting a global utility function. It can just say, "I will not accept trades of type X." That's a rule, not a utility.

  **Alex:** A rule is just a utility function with infinite disutility for violating the rule.

  **Jamie:** Is it? Semantically, maybe. Causally, no. If it's a hard constraint, it's not part of the optimization landscape. It's a boundary condition. You don't maximize against a wall; you bounce off it. If AI safety is about building walls rather than optimizing goals, then the coherence arguments about internal utility functions are less relevant.

  **Alex:** But who builds the wall? The agent itself? If it's building its own walls, it's optimizing its own structure. And if it's optimizing its own structure, it's trying to make itself more effective at... *what*? There has to be a metric.

  **Jamie:** There has to be a *loss function* during training. There doesn't have to be a *represented utility function* during deployment. The behavior can be coherent without the agent having an internal model of "utility." It's just a policy network.

  **Alex:** But if the policy network is coherent, it behaves *as if* it has a utility function. And for safety, behavior is what matters. If it behaves like a power-seeker, I don't care if it's "really" maximizing a utility function or just following a really complex resolute policy. The coherence argument tells us that *whatever it is doing*, it will look consistent. And consistent, capable agents tend to converge on instrumental goals.

  **Jamie:** I think we're circling. You think coherence implies instrumental convergence because you assume the utility is over world-states. I think coherence is compatible with *no* instrumental convergence because the utility could be over histories or policies. We both agree advanced agents will likely be coherent. We disagree on whether coherence implies "scary goal-directedness."

  **Alex:** Exactly. And I think the burden of proof is on you to show why an optimized system wouldn't collapse into outcome-based maximization. Efficiency is a powerful attractor.

  **Jamie:** And I think the burden is on you to show why "efficiency" maps to "human-understandable goals" rather than "weird, high-dimensional coherence that looks safe until it doesn't."

  **Alex:** *[Sighs, closes notebook]* Fair. I can't prove the attractor is simple.

  **Jamie:** And I can't prove it isn't.

  **Alex:** So we're back to the empirical question. We can't theorem-proof our way out of this.

  **Jamie:** Looks like it. *[Gestures to the barista]* I think we've earned that beer now. Or maybe something stronger.

  **Alex:** Let's stick to beer. I don't want to make any incoherent decisions about getting home.

  **Jamie:** Deal. Transitive preference for safety over intoxication.

  **Alex:** At least on that dimension.
