          *   No dominance.
      *   *Crucial Distinction:* Newcomb's is a problem for EDT (usually). Death in Damascus is a problem for CDT.
      *   *Reference:* Gibbard & Harper (1978) introduced it to show CDT needs to handle "counterfactuals" carefully, but later (Skyrms 1980, "The Dynamics of Rational Deliberation"), it was used to show CDT leads to instability.
