answer: |-
  Here are ten conversational interview questions designed for your podcast. They include an opening and closing question to frame the discussion, plus the four required thematic pairs. Each follow-up is phrased to anticipate the standard philosophical defense your guest is likely to offer, allowing you to press the point without sounding adversarial.

  **1. Opening: The Fairness Intuition**
  "Before we get into the mechanics of your theory, I want to start with the gut check. There are a few different ways to explain why hypocritical blame feels off—some say it's about insincerity, others say it's about authority. You're arguing it's fundamentally about *fairness*. Can you walk us through the moment you realized fairness was the missing piece, rather than just sincerity?"

  **2. Topic 1 (Main): The Cohen Distinction**
  "I want to press on a distinction that came up in a debate I had recently. There's a classic idea, associated with G. A. Cohen, that we can separate the *truth* of a charge from the *standing* to make it. My worry is that on a fairness account, those two might bleed together. If I'm blaming you unfairly, does that unfairness stay contained to my 'standing,' or does it inevitably make the charge itself feel less true?"

  **3. Topic 1 (Follow-up): Infection of Truth**
  *(Anticipating he will insist the distinction remains logically stable.)*
  "I suspect you'll say the truth stays intact, and only the standing is compromised. But if the *function* of blame is to modify behavior through moral communication, and the hypocrite's unfairness blocks that communication, haven't we effectively lost the truth anyway? Is the distinction stable in the abstract, even if it collapses in practice?"

  **4. Topic 2 (Main): Restoring Standing**
  "Let's say I realize I'm the hypocrite. I've been canceling plans constantly while nagging my friends about punctuality. On your view, what does it take to get my standing back? Is it enough that I privately reform and start holding myself to the standard, or does the fairness deficit require something more public to repair?"

  **5. Topic 2 (Follow-up): The Relational Cost**
  *(Anticipating he might argue private reform restores moral equality.)*
  "If you say private reform is enough to restore standing, I'm wondering if that misses the relational damage. Since blame is something we do *to* someone else, doesn't restoring fairness require acknowledging the unfairness to them? Or can I just silently fix my behavior and resume blaming as if nothing happened?"

  **6. Topic 3 (Main): Misfire vs. Impermissible**
  "There's a technical distinction I'd love your take on. When a hypocrite blames someone, is that blame best described as a 'misfire'—like a judge recusing themselves, where the verdict doesn't count? Or is it more like a judge taking a bribe, where the verdict stands but the act was impermissible? Which one fits your fairness account?"

  **7. Topic 3 (Follow-up): The Target's Response**
  *(Anticipating he will argue it is impermissible but still 'real' blame.)*
  "If it's impermissible but still 'real' blame, what does that mean for the person being blamed? Do they have a right to dismiss the content entirely, or are they still morally required to engage with the charge even if the messenger has no standing to deliver it?"

  **8. Topic 4 (Main): Scaling to Collectives**
  "I want to zoom out to the international stage. We often see countries criticizing each other's human rights records while having dirty histories themselves. Does your fairness account scale up to collective agents? Can a nation lose the standing to blame another nation based on its own track record?"

  **9. Topic 4 (Follow-up): Whataboutism**
  *(Anticipating he will agree it scales but with caveats about collective agency.)*
  "If it does scale, I'm curious where you draw the line with 'whataboutism.' Often that's dismissed as a fallacy, but on your view, isn't pointing out a country's hypocrisy a valid challenge to their standing? At what point does that become a dodge rather than a legitimate fairness check?"

  **10. Closing: The Cost of Silence**
  "To wrap up, I'm thinking about the downstream effects of your view. If we take standing seriously and silence hypocrites, is there a risk that we let too many moral truths go unspoken? How do we balance the demand for fair blame with the need to have moral violations called out, even by imperfect messengers?"
