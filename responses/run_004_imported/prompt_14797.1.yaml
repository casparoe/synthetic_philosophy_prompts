answer: |-
  # The Ghost in the Selection Function: Why Evolution Did Not Goodhart

  The analogy is seductive. It appears in blog posts on AI alignment, in discussions of existential risk, and in evolutionary psychology forums. The argument runs as follows: Natural selection is an optimizer seeking to maximize inclusive fitness. However, it cannot measure fitness directly. Instead, it hardcodes crude proxies into our biology—cravings for sugar, drives for status, the urge to copulate. In the Environment of Evolutionary Adaptedness (EEA), these proxies correlated tightly with fitness. In the modern world, however, we have decoupled the proxies from the goal: we eat junk food without gaining survival advantages, chase social media likes without gaining status, and use contraception to sever sex from reproduction. Thus, the argument concludes, modern humans are living proof of Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure." Evolution specified a proxy, and we (or our environment) gamed it.

  This narrative is vivid and intuitively satisfying, particularly for those concerned with aligning artificial intelligence. It suggests that alignment failure is not a bug of intelligence, but a feature of optimization itself. However, upon rigorous inspection, the claim that "evolution Goodharted on fitness" collapses. It is a category error dressed up as biology. While it captures a structural isomorphism regarding *distributional shift*, it fundamentally misidentifies the mechanism of natural selection, misapplies the taxonomy of Goodhart effects, and obscures the actual nature of evolutionary mismatch.

  To reach a definite verdict, we must first distinguish between optimization via representation and optimization via filtering, and then subject the four standard modes of Goodhart's Law to the constraints of agent-free selection.

  ### The Agentless Optimizer

  Goodhart's Law, originally formulated by Charles Goodhart and popularized by Marilyn Strathern, is a principle of control and measurement. It states that when a central authority uses a quantitative indicator as a target for policy, the indicator loses its informational value. Crucially, this framework presupposes a **controller**, a **goal**, and a **metric**. The controller wants $G$, cannot measure $G$ directly, measures $M$ instead, and optimizes for $M$. The failure occurs because the controller's optimization pressure distorts the relationship between $M$ and $G$.

  Natural selection is not a controller. It has no representation of fitness, no access to a metric, and no capacity to choose a proxy. It is a blind filtering process. Organisms with traits that result in higher replication leave more copies of those traits. There is no step where selection "looks at" a proxy for fitness and decides to select based on that proxy. Selection *is* the differential survival of fitness.

  The "proxies" cited in the analogy—sugar cravings, libido, status anxiety—are not metrics used by evolution. They are **phenotypic mechanisms** built by evolution. In the rationalist analogy, evolution is cast as a principal hiring an agent (the human organism) and paying them in dopamine based on a proxy metric. In reality, evolution is a filter that retains organisms whose mechanisms *actually* produced replication in the past. If a mechanism stops producing replication, selection pressure eventually removes it. The fact that it hasn't been removed yet is a matter of **lag**, not Goodharting.

  ### The Four Modes of Goodhart: A Taxonomy Test

  To determine if any substantive claim survives, we must test the four-way taxonomy of Goodhart effects (Regressional, Extremal, Causal, Adversarial) against the mechanics of natural selection.

  **1. Adversarial Goodhart**
  *Definition:* A strategic agent knowingly manipulates the proxy to satisfy the target without satisfying the goal.
  *Verdict:* **Fails in principle.**
  Adversarial Goodhart requires a model of the optimizer's goals and a strategic intent to deceive. Natural selection has no goals to deceive and no mind to model. While one might argue that "selfish genetic elements" (like meiotic drive) game the organism, this is intragenomic conflict, not the organism gaming evolution. The claim that "evolution was adversarially Goodharted" implies evolution is a victim of strategy. Evolution is a process, not a victim. Without a strategic adversary modeling the selection function, this mode cannot exist.

  **2. Causal Goodhart**
  *Definition:* The proxy and the goal are correlated only via a shared cause, or the proxy does not causally influence the goal. Manipulating the proxy fails to move the goal.
  *Verdict:* **Fails.**
  Causal Goodhart implies the optimizer *manipulates the proxy* expecting it to move the goal. Evolution does not manipulate cravings to produce fitness. Evolution selects organisms where cravings *happened* to produce fitness. In the modern context, eating sugar (the proxy) no longer causes survival (the goal). This is a breakdown in the causal structure of the environment, not a failure of the optimizer's causal model. Evolution never had a causal model; it had a history of outcomes. The failure is not that the proxy was causally empty, but that the causal graph of the world changed.

  **3. Regressional Goodhart**
  *Definition:* The proxy is a noisy estimate of the goal ($M = G + \epsilon$). Optimizing for $M$ selects for high $G$ but also high $\epsilon$.
  *Verdict:* **Fails.**
  Regressional Goodhart requires the optimizer to measure the goal *through* the noisy proxy. Selection does not measure fitness through cravings. It measures fitness through *actual replication*. If an organism has high cravings (high $M$) but zero offspring (low $G$), selection discards it. The "noise" in the system is not measurement error; it is environmental variance. Selection is not fooled by the noise because it selects on the outcome, not the drive.

  **4. Extremal Goodhart**
  *Definition:* The correlation between proxy and goal holds in the training distribution but breaks down in the tails (out-of-distribution).
  *Verdict:* **Survives Structurally, Fails Definitionally.**
  This is the only mode that bears resemblance to evolutionary mismatch. In the EEA (training distribution), sugar intake correlated with survival. In the modern world (test distribution), we have pushed sugar intake to extremes never encountered in the EEA, breaking the correlation.
  However, calling this "Goodhart's Law" is still a category error. Extremal Goodhart describes an optimizer pushing a system into a regime where its model fails. Evolution did not push us into the modern world; *we* did. Evolution built a machine (the human brain) optimized for Distribution A. We moved that machine to Distribution B. The machine broke. This is **distributional shift**, not Goodhart's Law. Goodhart implies the *optimization process itself* corrupted the metric. Here, the optimization process (evolution) is irrelevant to the current failure; the failure is external to the selector.

  ### The Verdict: A Category Error

  The claim that "evolution Goodharted on fitness" is a **category error**. It smuggles agency, representation, and measurement into a process defined by their absence.

  Goodhart's Law is fundamentally about the **corruption of information**. It describes what happens when a control system loses access to the true state of the world and relies on a corrupted signal. Natural selection never loses access to the true state of the world. Fitness *is* the selection criterion. There is no signal corruption because there is no signal processing.

  The "proxies" (urges) are not metrics used by evolution; they are the *levers* evolution pulled. When those levers no longer produce the desired outcome, it is not because the levers were "gamed." It is because the machine connected to the levers changed. To say evolution Goodharted is to blame the engineer for the building collapsing in an earthquake the engineer couldn't predict.

  This distinction is not merely pedantic; it has substantive implications for how we reason about AI safety. If we view evolution as an optimizer that got Goodharted, we might conclude that *any* optimizer will inevitably lose control of its proxies. This leads to fatalism about alignment. However, if we recognize the true mechanism—**distributional shift combined with optimization lag**—the lesson changes. Evolution failed to update the human brain because evolutionary timescales are slow, not because the "fitness metric" was inherently gameable. The problem was not the specification; it was the update rate.

  ### Conclusion

  The analogy of evolutionary Goodharting is a powerful pedagogical tool, but it is ontologically false. Of the four Goodhart failure modes, **Adversarial, Causal, and Regressional** fail to translate to natural selection even in principle, as they require representational measurement and strategic manipulation. **Extremal** Goodhart survives only as a structural isomorphism for distributional shift, but lacks the essential component of an optimizer targeting a metric.

  Evolution did not Goodhart. Evolution selected. We are the optimizers now, and we are the ones gaming the proxies evolution left behind. To conflate the two is to misunderstand both the nature of selection and the nature of alignment. The lesson for AI safety is not that optimization inevitably breaks proxies, but that **heuristic alignment is fragile under distributional shift**. That is a substantive claim, but it is not Goodhart's Law.
