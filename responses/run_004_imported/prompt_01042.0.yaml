      *   *Newton's Stance:* Newton believes in Absolute Space as a theological/metaphysical necessity (God's sensorium). He uses the bucket to show that relative motion (in the everyday sense of nearby bodies) fails. He *assumes* that if it's not relative to nearby bodies, it must be absolute (relative to space itself).
      *   *Mach's Critique:* Later, Ernst Mach argued exactly what the user is hinting at: the water rotates relative to the "fixed stars" (the mass of the universe), not abstract space.
