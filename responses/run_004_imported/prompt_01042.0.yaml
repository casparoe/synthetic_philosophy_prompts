      *   **The Two Globes Argument:** Imagine two globes connected by a cord in an immense void (no external reference). If they rotate, the cord tightens. Since there are no external bodies (stars, room), the tension proves rotation relative to *space itself*.
      *   **Newton's Theological/Metaphysical Commitment:** Newton isn't just doing empiricism; he's arguing for a ontology where Space is real. He treats the inability to find a relative body as proof of the absolute.
