  8.  **Final Review against User Prompt:**
      *   Did I run it through the machinery? Yes.
      *   CiC or CiW? Argued for CiC.
      *   Addressed the maxim formulation objection? Yes.
      *   Included Formula of Humanity? Yes.
      *   Avoided surface-level "lying is bad"? Yes, focused on institutional collapse and agency.

  9.  *(Self-Correction on the Calculator Analogy)*: I need to explicitly dismantle the calculator analogy. Why is a calculator different? Because a calculator computes *your* input. An LLM generates *the* answer. Also, calculators are usually visible/allowed. The secrecy is key. I will add a section on this.

  10. **Final Polish:** Check for clarity and flow. Ensure the distinction between Perfect and Imperfect duty is clear (CiC = Perfect, CiW = Imperfect). This case implies a Perfect Duty (strict prohibition).

