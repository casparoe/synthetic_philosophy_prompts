          *   The Victim's Perspective (Resentment is natural).
      *   **Section 4: Conclusion/Thesis Suggestion.** Suggest that the goal isn't choosing a stance, but managing the *transition* between them.

  7.  **Refining the Content (Self-Correction during drafting):**
