          *   The Medical/Objective Approach (The Trap).
          *   The Punitive/Participant Approach (The Failure).
          *   The "Modified Participant" Approach (The Strawsonian Solution).
      *   **Section 3: Where It Breaks Down (The Gold for the Longread).**
          *   The Gradient Problem (Binary vs. Spectrum).
