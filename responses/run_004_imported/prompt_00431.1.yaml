      *   *Nuance:* Emphasize Strawson's concept of "modifications" of reactive attitudes, not just total suspension. This is key for the "spectrum" issue.
      *   *Legal Context:* Connect back to the user's mention of courts/treatment programs (Drug Courts, HOPE probation, etc.).
