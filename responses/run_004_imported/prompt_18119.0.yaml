answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Mara's. My day job involves taking complicated ideas and trying to explain them to normal people without putting them to sleep. So, when Mara asked me to give this toast, I assumed she wanted me to explain the tax implications of marriage. But apparently, she wants me to talk about love.

  Specifically, she wants me to talk about a decision she made two years ago.

  We all know the story, roughly. Mara was at a crossroads. On one side, there was a path that was safe, familiar, and made sense on paper. On the other, there was Dev. They'd only known each other a few months. By every logical metric, staying put was the rational choice. But Mara didn't stay.

  Now, usually, at a wedding, the speaker says something like, "She just knew." Or, "It was fate." But Mara and I have talked about this, and that's not true. She didn't "just know." It was hard. Really hard.

  There's a philosopher named Ruth Chang who studies exactly this kind of moment. She says that when we face a hard choice, it's not because we're ignorant of the facts. Mara knew the facts. It's also not because the options are equal, like two identical dollar bills. If they were equal, a tiny improvement to one side—like Dev knowing how to properly fold a fitted sheet—should have tipped the scale instantly. But it didn't.

  Chang says these options are "on a par." They're in the same neighborhood of value, but they're different *kinds* of good. You can't weigh them on the same scale. So, when Mara chose Dev, she wasn't discovering that he was secretly the "better" option all along. There was no hidden fact of the universe waiting to be found.

  This sounds scary, right? It sounds like she just guessed. But here is the beautiful part, and the part that actually matters for marriage: Chang argues that in hard choices, the reason doesn't exist *before* you choose. You create the reason *by* choosing.

  Mara didn't find the right path; she walked a path and, through her commitment, made it the right one.

  That is what we are celebrating tonight. It's easy to love someone when the math works out perfectly. It is much harder, and much braver, to look at a person, acknowledge the uncertainty, and say, "I am going to commit to this, and through that commitment, I will make this love the defining truth of my life."

  Mara, you didn't choose Dev because it was easy. You chose him because you were willing to do the work to make the choice right. And Dev, you are the lucky beneficiary of that will. But don't get too comfortable; now it's your turn to do the work.

  Marriage isn't about finding the person who completes a pros-and-cons list. It's about looking at the person next to you and deciding, every single day, to generate the reasons why this is the best choice in the world. It's about turning a leap of faith into solid ground.

  So, if everyone could please stand and raise a glass.

  To Mara and Dev. May you never stop making the hard choices together, and may you always be the ones who create the reasons why they were right.

  To Mara and Dev.
