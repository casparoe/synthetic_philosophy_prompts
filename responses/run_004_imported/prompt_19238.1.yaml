prompt: |-
  Random one for you -- feels like something I should be able to explain to my students but im coming up blank. A friend is deciding whether to quit his job and start a company, and he's obsessed with finding "the" probability it'll work out. Trouble is, the number keeps changing depending how you slice the data: one popular stat says only 10% of new businesses survive five years, but a narrower study of second-time founders with a technical co-founder in his industry says more like 60%, and he pointed out that if you narrowed it down to people exactly like him the sample would basically just be him. He keeps asking me "ok but what are MY actual odds," and i honestly don't know what to tell him. Is one of these numbers actually the correct answer to that question, or is he asking for something that doesn't exist?
