      *   *Key Insight:* The Boat metaphor is about *fallibilism* (we might be wrong about anything). ISOTYPE encourages *certainty* (look, the numbers are right there). That's the friction.
      *   *The "Protocol Sentence" Parallel:* In the Vienna Circle debates, Neurath fought against Schlick's "Konstatierungen" (immediate experiences). He said even observation reports are theory-laden. ISOTYPE icons function like visual "Konstatierungen." They look like immediate givens. That is the contradiction.

