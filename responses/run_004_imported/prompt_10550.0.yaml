answer: |-
  This is a fantastic catch. You have identified a genuine philosophical scar in Neurath's work that most popular histories gloss over because they treat ISOTYPE as a cute footnote rather than an epistemological claim.

  For a novel, this tension is gold. It gives your character a blind spot, a place where their ideology overrides their epistemology.

  Here is the argument that survives the "it was just a supplement" defense. It centers on the difference between **admitting convention** and **concealing it.**

  ### 1. The Core Contradiction: Visual Foundationalism
  The Boat metaphor is a radical claim about **fallibilism**. It says: *There is no view from nowhere. Every statement we make is already part of the ship we are standing on. Even our observation reports ("I see a red patch") are theory-laden, linguistic constructs that can be rejected if the theory demands it.*

  ISOTYPE, however, relies on a **foundationalism of the eye**.
  Even if your character claims ISOTYPE is just a "translation" of statistics, the *power* of ISOTYPE comes from the claim that it bypasses the "vagueness" of words. But if words are vague because they are laden with history and theory, **pictures are laden with history and theory too.**

  *   **The Argument:** By claiming images dodge the "baggage" of words, your character is implicitly claiming that vision is *less* theory-laden than language. He is treating the retina as a "dry dock"—a neutral place where facts can be landed without the contamination of the ship.
  *   **The Tension:** If the Boat is true, there is no neutral ground. An icon of a "worker" is not a neutral fact. It is a theoretical decision about what a worker looks like, what counts as labor, and how that labor is quantified. By presenting it as a universal picture, ISOTYPE hides the convention behind a mask of naturalism. It claims to be *more* objective than words, which violates the Boat's insistence that *nothing* is immune to revision or interpretation.

  ### 2. Surviving the "Supplement" Defense
  Your character will say: *"I never said the pictures were the truth. They are just tools to teach the truth we found via science."*

  Here is the counter-argument that crushes that defense:
  **The medium dictates the ontology.**

  To make statistics work in ISOTYPE, you must turn complex social realities into countable, identical units (icons).
  *   **Example:** To visualize "unemployment," you need ten icons of men standing in a row.
  *   **The Philosophical Cost:** This forces the world into a specific metaphysical shape: **Methodological Individualism.** It assumes society is made of discrete, countable atoms (people) rather than relations, structures, or flows.
  *   **The Boat Violation:** The Boat metaphor allows us to question the *categories* of science. We can say, "The concept of 'unemployment' is a bourgeois construct; let's rebuild that plank." But ISOTYPE **freezes the category**. Once you draw the icon, the category looks like a natural object. It makes the *theory* look like the *fact*.
  *   **The Punchline:** ISOTYPE doesn't just communicate the science; it enforces a specific scientific worldview (positivist, quantifiable, individualist) by making alternative worldviews visually unintelligible. How do you draw "class struggle" in ISOTYPE without drawing two groups of men fighting? In doing so, you've turned a dialectical relation into a static picture. That is a foundationalist move.

  ### 3. The "Protocol Sentence" Parallel
  To make this sound authentic to the Vienna Circle era, link it to the **Protocol Sentence Debate** (1931–1932).
  *   **Context:** Moritz Schlick argued for "Konstatierungen"—immediate observation statements that were incorrigible foundations. Neurath destroyed this argument. He argued that even "Otto sees red" is a physicalistic statement that can be rejected if it contradicts the rest of the system.
  *   **The Contradiction:** Neurath fought Schlick to say **no statement is sacred.** But ISOTYPE treats the **visual sign** as sacred. It treats the image as incorrigible. "You can argue with a word," the ISOTYPE rhetoric suggests, "but you can't argue with what you see."
  *   **For the Novel:** Have an antagonist point out that Neurath spent years destroying the "foundations" of language, only to build a new foundation out of paper and ink. He replaced the "Given" of experience with the "Given" of the graphic.

  ### 4. The Political Danger (The Socialist Angle)
  Neurath was a Marxist. He believed science should serve the working class. This makes the tension dangerous, not just academic.
  *   **The Risk:** If you believe words are bourgeois and loaded, but pictures are universal, you hand the power of definition to **the designer.**
  *   **The Question:** Who draws the icons? If the icon of a "family" shows a man, a woman, and two children, that is not a fact; that is a policy. If the icon of a "factory" looks like a smokestack, it ignores the environmental cost.
  *   **The Argument:** The Boat metaphor is democratic (we all help rebuild the ship). ISOTYPE is technocratic (the expert designs the ship, you just look at it). By trusting the image to be "cleaner," your character is trusting the *expert* more than the *collective process of verification*. He is creating a priesthood of visualizers.

  ### 5. How to Dramatize This in the Novel
  Don't have them debate this in a lecture hall. Have them debate it over a drafting table.

  **Scene Idea:**
  Your Neurath-character is finalizing a chart about housing shortages. He insists on using a specific icon for a "home."
  A younger, sharper colleague (maybe a Carnap figure or a skeptical artist) points out that the icon looks like a detached house, but most workers live in tenements.
  *   **Neurath:** "It's a symbol. It represents the concept of shelter. It must be simple."
  *   **Colleague:** "Simple for whom? If a worker sees that, they don't see their home. They see a lie. You say there are no foundational sentences, Otto. Why is this line drawing foundational? Why can't we pull up this plank?"
  *   **Neurath:** "Because if we make it complex, they won't understand it."
  *   **Colleague:** "Or because if we make it complex, they'll realize it's a choice. You're not giving them facts. You're giving them a story and pretending it's a mirror."

  **The "Gotcha" Line:**
  > "You told us the ship has no bottom, Otto. We are always at sea. But these pictures... these pictures pretend to be the seabed. You're selling them a foundation you told us didn't exist."

  ### Summary for your Character Arc
  Your character believes he is liberating people from the mystification of language. The tragedy (or flaw) is that he is mystifying them with graphics. He thinks he is handing them tools to rebuild the ship; in reality, he is handing them a blueprint and telling them it's a photograph.

  This doesn't make him a fraud; it makes him a human being who wanted so badly to *help* (the socialist impulse) that he momentarily forgot his own strictures on *truth* (the philosopher's impulse). That is a compelling conflict.
