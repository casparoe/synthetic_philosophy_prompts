          *   No "protocol sentences" (observation statements) are incorrigible or theory-neutral.
          *   Language is always theory-laden.
          *   We reconstruct knowledge from within the system, using the very tools we are questioning.
          *   Key implication: *Nothing* escapes interpretation. There is no "God's eye view."
      *   **ISOTYPE (International System of TYpographic Education):**
          *   Visual education.
          *   Pictograms representing quantities.
          *   Claim/Aim: Transcend language barriers, reduce ambiguity, make social facts immediately graspable.
          *   Implicit assumption (according to the critique): Pictures are more direct, less loaded than words. They offer a clearer window to reality.

  3.  **Identify the Tension (The "Bug"):**
      *   If *all* language is theory-laden and no statement is foundational (Boat), why treat *visual* language as less theory-laden or more foundational (ISOTYPE)?
      *   If we can't step outside the boat to fix it, how can a pictogram step outside culture/ideology to show "pure facts"?
      *   Neurath wants to democratize knowledge (socialist aim). ISOTYPE is the tool. But if the tool claims a purity that his philosophy denies exists, is he engaging in a performative contradiction?

  4.  **Develop the Argument (Surviving the "Supplement" Reply):**
      *   *The "Supplement" Defense:* "He never said pictures replace theory; they just communicate it."
      *   *The Counter:* Even as a communication tool, the *design choices* in ISOTYPE embody theoretical commitments that are hidden as "natural" or "obvious."
      *   *Point 1: The Myth of the Neutral Sign.* Words admit their ambiguity. Pictures hide their construction. A pictogram of a "worker" looks like *a specific kind* of worker, but presents itself as *the universal* worker. This violates the Boat principle that all representations are contingent and revisable.
      *   *Point 2: Reification of Social Facts.* ISOTYPE turns complex social relations into countable units (icons). This presupposes a specific ontology (methodological individualism/positivism) that the Boat metaphor suggests should be open to revision. By freezing social data into icons, ISOTYPE makes the *categories* look like nature, not human constructs.
      *   *Point 3: The Rhetoric of Immediacy.* The Boat says "everything is mediation." ISOTYPE sells "immediacy" (seeing is believing). This is epistemologically dangerous. It creates a "foundationalism of the eye."
      *   *Point 4: Political Blindness.* Neurath was a Marxist/Socialist. He knew ideology shapes language. Why did he think ideology *doesn't* shape vision? If the Boat is about avoiding dogma, ISOTYPE risks becoming a new dogma because it looks too obvious to question.

  5.  **Drafting the Argument (Iterative refinement for the Novelist):**
      *   *Tone:* Intellectual, sharp, slightly dramatic (fitting a novel subplot).
