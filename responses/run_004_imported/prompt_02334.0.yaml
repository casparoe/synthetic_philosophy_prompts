answer: |-
  Here is the tie-breaker verdict, followed by the breakdown of why Aquinas is doing what he's doing.

  ### The Verdict
  **You win the argument.**

  Dana is overstating the case. While Aquinas does not issue an *absolute* prohibition on removing a tyrant, he explicitly and rigorously argues **against** the idea that private citizens have the license to assassinate rulers on their own initiative. Dana's claim that Aquinas provides a "green light" or a "loophole in plain sight" for killing tyrants is a significant misreading of the text's intent. Aquinas is not looking for a loophole; he is building a jurisdictional fence.

  However, you get a partial deduction because your confusion about the "public authority" exception is understandable, and Dana gets partial credit for identifying that Aquinas doesn't rule out removal entirely. But on the core question—"Does Aquinas tell private citizens they can kill tyrants?"—the answer is a definitive **no**.

  Here is the untangling of the text to back up the ruling.

  ---

  ### 1. The Ehud "Sleight of Hand" (It's not a relabeling, it's a jurisdictional distinction)
  Your confusion about Ehud (Aioth) is the most common reaction to this text. It feels like Aquinas is saying, "Killing tyrants is wrong... unless the Bible did it, in which case it wasn't killing a tyrant."

  But Aquinas is making a specific legal-theological distinction regarding **sovereignty**.
  *   **The Principle:** A subject cannot execute judgment on their own superior. To do so destroys the order of justice itself.
  *   **The Ehud Exception:** Aquinas argues that Eglon was not the *lawful sovereign* of Israel; he was an *oppressor* and an *enemy combatant*. The Israelites were in captivity/servitude, not in a lawful political covenant with Moab. Therefore, Ehud was not a subject committing treason/assassination; he was a liberator executing an enemy commander during a state of war.

  Aquinas isn't relabeling the act to save face; he is defining the act by the relationship between the killer and the killed. If you are a subject under a king's law, you cannot kill him. If you are an enemy combatant under an occupier's boot, you can. This preserves the principle of order while allowing for liberation.

  ### 2. Private Initiative vs. Public Authority (The "Relocation" Argument)
  You asked: *"Doesn't that just relocate the killing from an individual to a crowd rather than actually rule it out?"*

  Yes, it does relocate it—but in medieval political theory, that relocation is the difference between **murder** and **justice**.

  Aquinas's argument is not primarily about the *physical act* of killing; it is about **jurisdiction**.
  *   **Private Individual:** Lacks the authority to judge the head of state. Acting alone is sedition and usurpation. Even if the tyrant is evil, the private killer commits a sin because they act without authority.
  *   **Public Authority:** If the king was elected by the community (the "multitude"), the community retains a residual authority. If they act *as a corporate body* (not a mob) to depose him, they are exercising the very authority that installed him.

  This isn't a loophole; it's the medieval equivalent of "Due Process." Aquinas is arguing that tyranny must be cured by law and public institution, not by vigilante justice. His prudential argument (that wicked men will kill good kings faster than good men kill bad kings) is there to show *why* private initiative is dangerous for the common good.

  ### 3. The *Summa Theologiae* Reference
  You mentioned remembering a passage on sedition. You are thinking of **II-II, Question 42, Article 2**.

  In this passage, Aquinas asks whether sedition is a mortal sin.
  *   **His Answer:** Yes, sedition is a mortal sin because it opposes the unity and peace of the people.
  *   **The Nuance:** In the *Reply to Objection 3*, he adds that if a tyrant rules unjustly, disturbing that regime is **not** sedition. *However*, he immediately qualifies this by warning that if the removal of the tyrant results in greater harm to the populace (civil war, worse successor), it should not be done.

  Crucially, even in the *Summa*, he does not grant license to private individuals. He frames the resistance as a defense of the common good, which implies a collective or public action, not a private assassination.

  ### 4. Why Dana Thinks This (The Historical Context)
  Dana isn't pulling this out of thin air; she is likely conflating Aquinas with the **later Scholastics** (specifically the Salamanca School of the 16th century, like Suárez and Mariana).

  *   **Aquinas (13th Century):** Cautious. Emphasizes order. Tyrannicide by private persons is forbidden. Deposition by public authority is permissible but risky.
  *   **Later Scholastics (16th Century):** Faced with the Protestant Reformation and absolute monarchs, they expanded Aquinas's "public authority" clause significantly. Some argued that if the king violates divine law, he forfeits his title, and *any* private citizen may kill him (the "tyrannicide theory").

  Dana is attributing the 16th-century radicalization of Aquinas to Aquinas himself. Aquinas plants the seed (tyranny is illegitimate), but he does not grow the tree (private citizens may execute the tyrant).

  ### Summary for the Argument
  If you talk to Dana again, here is the winning formulation:

  1.  **Aquinas forbids private tyrannicide.** He explicitly cites Apostolic teaching and prudential risk to shut this down. You are right; she is wrong on the "green light" claim.
  2.  **Aquinas allows for public deposition.** If the community has the right to elect, they have the right to depose. But this is a legal process, not an assassination loophole.
  3.  **The Ehud case is about occupation, not sovereignty.** It doesn't validate subjects killing their own kings; it validates liberators killing occupiers.

  **Final Ruling:** You win. Aquinas is not handing out green lights for assassination; he is drawing a bright red line around jurisdiction. Dana is reading later Jesuit political theory back into a 13th-century Dominican text. Buy the next round, but let her know she gets partial credit for knowing the *Summa* exists.
