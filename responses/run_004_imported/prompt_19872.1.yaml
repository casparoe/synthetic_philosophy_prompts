answer: |-
  The voicemail appeared on a Tuesday, buried in a cloud backup Elena thought she'd purged years ago. There was no timestamp that made sense, just her own voice, slightly thinner, the vowel sounds flattened by a different city's air.

  *"We took it,"* the voice said. *"The Berlin flat. It's smaller than the pictures, but the light comes in sideways at four. You were right about the light. But you were wrong about the loneliness. It's not lonely here. It's just… quiet. Different quiet."*

  Elena sat on her Ohio couch, the phone heavy in her hand. Outside, the snow was turning to slush, the gray kind that stains the cuffs of jeans. In the message, there was the sound of a tram bell in the background. A specific frequency.

  For years, the joke with her sister, Sarah, had been easy. Sarah moved to Norway for a man in 2016; Elena stayed. When Sarah had her baby, Elena felt a phantom contraction, a ghost pain in a body that hadn't changed. They laughed it off. *I'm living your other life,* Sarah would say. *I'm the version of you that learned to ski.*

  But this wasn't Sarah. This was Elena. Or it was a woman who shared her vocal cords, her cadence, her specific way of pausing before a conjunction.

  Elena played it again. *"We took it."*

  If the woman on the line was her, numerically the same person just shifted across a branch in the road, then the cold light hitting the Berlin floor was hers. The warmth of the coffee mug in that other hand was hers. The ache in her back from a different desk was hers. She should be able to claim it. She should be able to say, *I live there,* without lying.

  But she didn't remember the flat. She didn't remember the light. She remembered turning down the job. She remembered the breakup that anchored her to Ohio like a ship dropping a rusted chain.

  If it was really her, why was there a wall of glass between them? Why did she have to listen to a recording to know what the light looked like?

  She walked to the window. Her reflection stared back, superimposed over the dying garden. If she pressed her hand against the glass, was she touching the same surface the Berlin-Elena touched? Or was this just a resemblance? A trick of optics?

  There was a name for this, she knew. She'd heard it in a podcast once, during a sleepless night three months after the breakup. Something about counterparts. The idea that the person who made the other choice isn't you at all. They're just someone who looks like you, born of similar stuff, living a similar story. A distinct individual. A cousin across a void.

  If that was true, then the voice on the phone was a stranger. A stranger who happened to have her face.

  Elena felt a surge of irritation, sharp and hot. If it was a stranger, why did her chest tighten when the voice said *loneliness*? Why did she feel the need to wrap her arms around herself, as if comforting the woman on the line?

  It felt like theft to claim the joy. If Berlin-Elena found love tomorrow, found the perfect job, found the sideways light exactly as promised, could Elena take credit? Could she say, *I won*?

  Or was that the Humphrey problem? She couldn't remember the name, just the shape of it. A man loses an election. Someone tells him, "Don't worry, in another world, you won." And the man says, "Why should I care? I lost."

  If Berlin-Elena was happy, but Ohio-Elena was sitting in slush listening to a voicemail on a disconnected account, then the happiness wasn't here. It was over there. And "over there" might as well be Mars if she couldn't touch it.

  She played the message a third time. The tram bell rang.

  *"It's just… quiet."*

  If they were the same person, split down the middle, then the quiet belonged to her. She was enduring it right now. But if they were different people, merely resembling each other like twins, then she was grieving a life that never happened to her. She was mourning a stranger's Tuesday.

  Sarah called while she was listening. Elena let it go to voicemail. Her twin was probably calling from Norway, maybe about the baby, maybe about the snow there. Another version. Another branch.

  Elena looked at the phone. The waveform of the voicemail was a jagged green mountain range.

  If she deleted it, did the other woman cease to exist? No. That was solipsism, not metaphysics. The other woman was either real or she wasn't.

  If she was real, if she was *me*, then I am living two lives. One is cold and quiet and lit by sideways sun. One is gray and slushy and anchored by rusted chains. I am both. I am suffering both.

  But if she is not me, if she is just a counterpart… then I am alone. I am only here. And I am feeling empathy for a fiction. I am crying over a character in a book I didn't write.

  Elena pressed her thumb against the screen, over the play button. She wanted to press through the glass, into the circuitry, to find the wire that connected her hand to that voice.

  Was it ownership? Did she have the right to the pain?

  If she claimed it, she risked delusion. If she denied it, she risked lobotomy, cutting off a part of her own soul because it grew in a different direction.

  The voicemail ended. The silence rushed back into the room, heavy and absolute.

  Elena didn't delete the message. She didn't save it, either. She left it there, unopened, in the limbo of the inbox. She walked back to the couch and sat down. She waited to see if the grief would stay. It did. It felt like her own grief. But she couldn't know if that was because it *was* hers, or simply because she was human, and humans feel pain when they hear a voice that sounds like home, regardless of who is speaking.

  Outside, the snow stopped. The light came in sideways, just for a moment, across the Ohio floor. It looked almost like the light in Berlin. Or maybe it was just light.
