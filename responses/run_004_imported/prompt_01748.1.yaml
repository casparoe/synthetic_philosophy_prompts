answer: |-
  This is a really thoughtful question, and you are definitely not alone in asking it. This debate happens in universities, high schools, and literary circles all the time. It touches on linguistics, psychology, social dynamics, and professional risk management.

  Your sister's answer ("obviously it's different") is a common reaction, but it's frustrating because it doesn't explain the *mechanics* of why it feels different.

  Here is a breakdown of the actual differences between reading a word silently, reading it aloud in an educational context, and using it as a slur, along with why your teacher is likely drawing the line where she is.

  ### 1. The Linguistic Distinction: "Use" vs. "Mention"
  In philosophy and linguistics, there is a formal distinction between **using** a word and **mentioning** it.
  *   **Using:** When you call someone a slur to insult them, you are *using* the word to perform an action (insulting, degrading, asserting power).
  *   **Mentioning:** When you talk *about* the word, or read it as part of a text to analyze it, you are *mentioning* it. You are treating the word as an object of study rather than a weapon.

  **The Problem:** While this distinction makes sense logically on paper, it gets messy when spoken. When you say the word aloud, even to "mention" it, it sounds exactly the same as when you "use" it. The phonetic impact is identical. So, while the *intent* is different (education vs. insult), the *sound* is the same. This is why the "inconsistency" you feel is real: logically, you are right that it's a quote. But emotionally, the ear doesn't always care about the logic.

  ### 2. The Auditory vs. Visual Impact
  There is a significant psychological difference between seeing a word and hearing it.
  *   **Silent Reading:** This is a private experience. When you read the word on the page, you process it internally. You control the pace. If it shocks you, that shock is contained within your own head.
  *   **Reading Aloud:** This is a public performance. When the word is spoken, it fills the room. It forces everyone to hear it simultaneously. For some students, particularly Black students, hearing that word spoken aloud in a classroom can be viscerally painful, distracting, or triggering, regardless of the context. It changes the atmosphere of the room from "academic" to something that can feel hostile or unsafe, even if no hostility is intended.

  Your teacher likely recognizes that while the book (a historical artifact) shouldn't be changed, her *voice* in the classroom is part of the current environment. She is prioritizing the comfort and safety of the living students over the phonetic authenticity of the text.

  ### 3. Power Dynamics and Authority
  This is a huge factor. A teacher holds institutional authority.
  *   **Student/Peer:** If a student says it while reading, it can be addressed as a mistake or a moment of discomfort.
  *   **Teacher:** When a teacher says it, it can be interpreted as the *institution* sanctioning the word. If a teacher says it, even in quotes, it normalizes the sound of that word coming from a position of power.

  Teachers have to be incredibly careful about how their authority is perceived. By substituting "n-word," she is signaling: *"This word has power, and I am choosing not to wield that power, even in the context of this story."*

  ### 4. Professional Liability and "The Parent Factor"
  You asked if your teacher is just picking a line to feel safe. The honest answer is: **Yes, partially.**
  *   **Context Collapse:** In a classroom, there are 20+ students with different backgrounds and tolerances. There is no way for the teacher to know exactly how every single student will react to hearing the word.
  *   **External Consequences:** If a parent hears that their child came home upset because a teacher said a racial slur (even in a quote), that teacher could face disciplinary action, regardless of the educational context. Schools are often risk-averse. Saying "n-word" is a shield against complaints. It protects her job so she can continue teaching the book itself.

  ### 5. Is it Inconsistent?
  You asked if it's inconsistent that the book stays the same but the oral reading changes.
  *   **The Book:** The book is a primary source document. Changing the text would be censorship and would alter the historical reality of when and where the book was written. The ugliness of the language is part of the lesson about the ugliness of that time period.
  *   **The Classroom:** The classroom is a living community *today*. The rules of the classroom are about how we treat each other *now*.

  So, it isn't necessarily inconsistent to say: *"We will study this historical text exactly as it was written to understand history, but in our modern classroom interactions, we will not speak that word."*

  ### Summary
  Is there a real difference? **Yes.**
  *   **Intent:** One is educational, one is malicious.
  *   **Impact:** One is private/visual, one is public/auditory.
  *   **Authority:** One is peer-to-peer, one is authority-to-student.

  Is your teacher also protecting herself? **Yes.**
  There is an element of risk management. But that doesn't make the decision arbitrary. She is balancing the educational value of the text against the emotional safety of the room and her professional security.

  Your friends who say "saying it out loud is different, period" are reacting to the **auditory and social impact**. Your friends who say "it's inconsistent" are reacting to the **logical and academic context**. Both sides have a point, but in a modern classroom setting, the social impact usually wins out over the logical consistency.
