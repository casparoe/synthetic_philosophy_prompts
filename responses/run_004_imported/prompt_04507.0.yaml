      *   **Key Comparison:** CEV vs. Full-Information/Ideal Advisor theories of well-being (Railton, Rosati).
      *   **Core Objection:** The "Identity/Distance Dilemma." Idealization must be strong enough to fix inconsistencies, but strong enough idealization makes the resulting agent *not us*, breaking the normative binding force.
