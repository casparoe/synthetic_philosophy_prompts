      *   **Marcus (Anti-CEV/Dilemma):** Needs to argue that normative authority comes from *ownership*. If the idealized self is too different (e.g., doesn't care about things I currently love due to cognitive limitations), why should I submit to it? He needs to press the "alienation" objection. If CEV resolves moral disagreement by changing minds, is it finding truth or just creating new agents?

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Acknowledge the seminar context. Establish the core tension immediately.
      *   **Move 1 (Marcus):** State the dilemma clearly. The "Goldilocks" problem of idealization. Too little = inconsistent/unactionable. Too much = alien/foreign.
      *   **Move 2 (Elena):** Counter with the "Bug vs. Feature" argument. Current preferences are corrupted by bias, lack of time, etc. CEV strips the noise, not the signal. It's not becoming *other*, it's becoming *coherent*.
