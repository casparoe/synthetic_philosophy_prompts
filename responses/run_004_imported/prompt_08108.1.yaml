  *(Self-Correction on Part I)*: Make sure to mention that Tolstoy's definition of "Christian" is often misunderstood. It's about unity, not church doctrine.
  *(Self-Correction on Part II)*: Be honest. Tolstoy *would* hate the book. The question is whether the *essay* about the book can survive that. The essay argues that the *subject* (uselessness) bridges the gap. Tolstoy would say the *medium* (dense prose) breaks the bridge. The user needs to own that tension.

