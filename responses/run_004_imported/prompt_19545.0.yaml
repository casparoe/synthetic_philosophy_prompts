      *   *The Counter-argument (Searle's Chinese Room, Block's China Brain):* Syntax isn't semantics. Simulation isn't duplication. Lack of embodiment (no pain, no hunger, no world) might mean lack of *qualia* (subjective experience).
      *   *The Story's Angle:* Don't solve the philosophy. Show the *uncanny valley* of consciousness. The system should do something that *looks* like mind, but feels wrong.

  4.  **Drafting - Scene by Scene:**

