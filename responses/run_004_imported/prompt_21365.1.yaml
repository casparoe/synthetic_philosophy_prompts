          *   *Strengths:* Reductio ad absurdum. Highlights the moral intuition that getting *nothing* is worse than getting *little*.
          *   *Weaknesses:* Misunderstands *why* Marx focuses on wages. It's not about fairness; it's about the mechanism of surplus value extraction within a specific social relation.
          *   *Assessment:* Logically compelling from a moral standpoint, but misses the structural point Sofia is making.

      *   **Move 4: Sofia's Rebuttal (Compulsion and Control).**
