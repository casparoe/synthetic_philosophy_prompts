      *   **The Core Constraint (The Death Narrative):** Address the instruction directly but poetically. Avoid the forbidden phrases ("made her peace," "fought to the end"). Describe her state as *holding the question open*.
      *   **The Closing:** Bring it back to the living. How do we honor her? By respecting uncertainty.

