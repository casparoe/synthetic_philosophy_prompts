answer: |-
  Friends, family, colleagues.

  For those of you who knew Priya through her family, I am the friend from the world of algorithms and abstract theory. For those of you who knew her through her research, I am the friend who knew her parents, her brother, and the way she laughed when she burned toast. I stand here at the intersection of those two worlds, just as she did for most of her life.

  Priya spent her career thinking about a very specific, difficult question: How do you build a powerful intelligence that is willing to be turned off?

  In her field, this is called the shutdown problem. It sounds technical, but at its heart, it is about humility. It is about creating something smart enough to change the world, but wise enough not to fight the hand that guides it. For a long time, the standard answer was to try to make such a system indifferent to its own end. But Priya came to believe that was wrong. Indifference is just another kind of calculation. Instead, she argued for something more subtle. She argued that a truly safe system should not have a fixed opinion on whether it continues or stops. It should leave that question open. It should remain *corrigible*.

  She lived by that principle. Not as a machine, but as a person.

  When Priya wrote her instructions for this day, she gave us a specific constraint. She asked that no one say she "made her peace" with dying. And she asked that no one say she "fought to the very end."

  I know these are the words we usually reach for. They are comfortable. They offer a narrative arc. They tell us that a life ends with a period, either of acceptance or of resistance. But Priya believed that forcing a complete story onto an unfinished mind is a kind of violence. To say she made peace would imply she decided the end was good. To say she fought would imply she decided the end was bad. She insisted, right up until she could no longer speak, that she did not need to decide.

  She did not optimize the story of her own ending. She simply remained present with the uncertainty of it.

  For her colleagues: this was not a metaphor. It was the exact property she spent fifteen years trying to formalize. She believed that integrity lies in holding a question open when the answer is not yours to give.

  For her family: this was not coldness. It was a profound kind of honesty. She loved you too much to pretend she had answers she didn't have. She did not withdraw from you, and she did not rage against the inevitable. She just stayed. She stayed in the room, with her friends, with her work, with her parents, without demanding that the universe make sense of her departure before it happened.

  There is a temptation, now that she is gone, to close that loop for her. To say, "Well, she must have felt this," or "She surely believed that." I ask you, gently, to resist that temptation. It is the only way we can truly honor the rigor of her mind and the warmth of her heart.

  We do not need to know how she felt about the end to know how she felt about us. She was kind. She was exacting. She was loyal. She built bridges between people who spoke different languages, whether those languages were Python and English, or grief and memory.

  So, I will not tell you that Priya accepted her death. I will not tell you that she resisted it. I will tell you that she lived with it, clearly and without flinching, and she asked us to do the same.

  She left the question open. And so, today, we do not close it. We simply stand here, in the space she left behind, and we witness.

  Thank you.
