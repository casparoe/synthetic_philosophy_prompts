  Here is a draft of that specific section of the toast. It is designed to run about two to three minutes at a moderate speaking pace. It balances the philosophical nuance (for the cohort) with emotional resonance (for the family), while directly addressing Theo's concern about marriage being dismissed as a "fiction."

  ***

  "Now, many of you know that Theo is finishing his PhD in philosophy. For those on my side of the family, that means he's very good at arguing; for those on his side, that means you know he's currently writing a dissertation on the nature of promising.

  Naturally, I've tried to read it. And while I might not grasp all the footnotes, I've learned something profound from Theo about what my daughter is standing here to do today.

  There is a famous idea in philosophy—blame it on Hume if you like—that suggests a promise is just a social convention. A useful tool. Basically, we agree to keep our word because it makes society run smoother, like driving on the right side of the road. But Theo has spent years arguing that this can't be the whole story. Because if a promise were *just* about social utility, then breaking a secret promise—where no one would ever know and no one got hurt—wouldn't matter. But we know it does. It matters to *you*.

  Theo gets a little anxious when people call a wedding vow 'basically just a contract.' And he's right to. A contract is a transaction about what you're going to *do*. It protects your interests. But a vow? A vow is something else.

  I have a theory about this, and I'm hoping the philosophers in the room will forgive my lack of rigor. To me, a promise isn't a bet you place on your future behavior. It's not predicting that you'll be kind, or faithful, or patient. It is the act of *deciding*, right then, who you are going to be from that moment forward.

  When you stand at the altar, you aren't just describing your love. You are creating a new reality. You are binding your future self to your present word, not because it's useful, and not because you're being watched, but because that bond becomes part of your identity.

  This is why this promise holds on the bad days. On the days when the 'utility' is low, and the 'convention' feels heavy. You won't keep these vows because you calculated the benefits. You will keep them because to break them would be to break the person you promised to be.

  So, Theo, I hope I haven't butchered the argument. But I know this: My daughter isn't entering a fiction. She is entering a truth that you two will build together, word by word.

  So if everyone could raise a glass. To the promise that binds, and to the couple who keeps it. To [Daughter] and Theo."
