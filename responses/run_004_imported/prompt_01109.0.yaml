answer: |-
  Your gut is absolutely right. Your tech lead's argument is logically flawed, professionally immature, and violates the core principles of modern software engineering culture.

  Here is the breakdown of why you are right, why their argument fails, and how you should handle the review and the aftermath.

  ### 1. Why the Tech Lead's Argument is Wrong

  **The "Omniscience Fallacy"**
  Your lead is conflating *writing instructions* with *simulating all possible states of a complex system.*
  *   **The Reality:** In a 50k line codebase with feature flags, the number of possible state combinations grows exponentially. No human being can mentally trace every permutation of logic paths during a code review or before merging.
  *   **The Flaw:** If writing code meant you automatically "knew" every emergent behavior resulting from that code, we wouldn't need QA, integration testing, staging environments, or canary deployments. We could just ship immediately. The existence of testing infrastructure proves that *writing* logic does not equal *knowing* all outcomes.

  **Hindsight Bias**
  Now that the outage has happened, the path to the failure looks obvious. This is a classic cognitive bias. Before the outage, the interaction between two "old" flags was likely invisible noise in the system. Judging your prior knowledge based on current information is unfair and inaccurate.

  **The Accusation of Intent**
  The statement that this is the *"same as if I'd shipped it broken on purpose"* is toxic.
  *   **Negligence vs. Complexity:** There is a massive difference between cutting corners (negligence) and failing to predict a non-obvious interaction in a complex system (complexity).
  *   **Malice:** Suggesting you effectively shipped it "on purpose" implies malice or gross recklessness. This is a character attack, not technical feedback.

  ### 2. The Real Issue: Systemic, Not Individual

  This was a **process failure**, not a person failure. A healthy engineering organization adheres to the concept of a **Blameless Postmortem**. The goal is to fix the system so that even if a human makes a mistake, the system prevents it from becoming an outage.

  The actual failures here were:
  1.  **Feature Flag Hygiene:** Why were "old" feature flags still active? Flags should have a sunset policy. If they live too long, they become permanent, untested code paths.
  2.  **Test Coverage:** Why was there no integration test covering the combination of these flags? Relying on a developer's brain to catch flag interactions is not a testing strategy.
  3.  **Observability:** Why did it take a prod outage to discover this? Could monitoring have caught the conflict earlier?

  By pinning this on you, your lead is letting the *process* off the hook to punish the *person*. This creates a culture of fear where developers will stop taking risks or innovating because they are afraid of being held omnisciently responsible for edge cases.

  ### 3. How to Handle the Performance Review

  You need to push back on the specific wording without being insubordinate. You want to reframe this from "You failed to know the unknowable" to "We identified a gap in our testing strategy."

  **Do not accept this phrasing:**
  > "Failed to catch a bug they implicitly knew about."

  **Propose this phrasing instead:**
  > "Identified a gap in our integration testing regarding feature flag combinations. Action item: Advocate for and implement combinatorial testing for active flags."

  **Script for the conversation:**
  > "I've been thinking about our discussion regarding the review. I understand that the code I wrote was the vector for the bug, but I strongly disagree with the assessment that I 'knew' this would happen. In a system of this complexity, mental tracing of all flag permutations isn't feasible for any engineer; that's why we have automated testing.
  >
  > If we write this up as me failing to catch something I should have known, it ignores the systemic lack of test coverage for flag interactions. I'm happy to own the action item of helping us build better integration tests so this doesn't happen again, but I cannot accept language that implies I was negligent or that I possessed knowledge I couldn't reasonably have had."

  ### 4. How to Prevent Recurrence (The "Fix")

  To show you are being constructive (and to protect yourself), propose concrete technical solutions. This shifts the conversation from "Your Mistake" to "Our Solution."

  1.  **Flag Sunset Policy:** Propose a rule where feature flags must be removed within X weeks of launch, or they require a renewed justification ticket.
  2.  **Combinatorial Testing:** Suggest implementing a test suite that automatically spins up builds with random combinations of feature flags enabled to catch these interactions before prod.
  3.  **Static Analysis:** Are there tools that can detect dead code or conflicting flag logic?

  ### Summary

  **Who is right?** You are.
  **Is this normal?** Unfortunately, yes. Many tech leads struggle with the transition from "coding" to "managing complexity" and default to blame when things break.
  **What should you do?** Stand your ground on the review language. You can accept responsibility for *fixing* the process, but do not accept responsibility for *omniscience*.

  If your lead refuses to budge on the review language, document your disagreement in writing (email) for your own records. This isn't just about this review; it's about setting a boundary that you will not accept a culture where developers are expected to be perfect compilers.
