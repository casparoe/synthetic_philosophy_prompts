prompt: |-
  So we had a nasty prod outage at work last month that turned out to only happen when two old feature flags were both on at once, an interaction nobody had ever actually tested. In the postmortem my tech lead argued that since that interaction was technically already implied by code I'd written and gotten approved months earlier, I basically already knew it would happen, same as if I'd shipped it broken on purpose, and now he wants it written up on my review as something I should've caught. I said theres no way I couldve traced every possible interaction through a 50k line codebase in my head before merging, but he just goes "the logic is the logic, you wrote it, you knew." Something about that argument feels off to me but I can't put my finger on why. Who's actually right here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Situation:**
      *   **Event:** A production outage occurred due to an interaction between two old feature flags being on simultaneously.
      *   **Cause:** This specific interaction was never tested.
      *   **Tech Lead's Argument:** The code implied the interaction. Since the user wrote and got approval for the code months earlier, they "basically already knew it would happen." Therefore, it's equivalent to shipping broken code on purpose. It should go on the performance review as a failure to catch.
      *   **User's Argument:** It's impossible to trace every possible interaction through a 50k line codebase mentally before merging.
      *   **Core Conflict:** Responsibility vs. Feasibility/Cognitive Load. Intentionality vs. Emergent Behavior.
      *   **Goal:** Determine who is "right" (or rather, validate the user's feeling that something is off) and provide a framework for handling the review/postmortem.

  2.  **Deconstruct the Tech Lead's Argument:**
      *   *Premise 1:* The logic exists in the code.
      *   *Premise 2:* You wrote the logic.
      *   *Conclusion:* Therefore, you knew the outcome of all combinations of that logic.
      *   *Fallacy:* This is a classic "Hindsight Bias" combined with an unrealistic expectation of human cognitive capacity. It conflates *writing instructions* with *simulating all states of a complex system*.
      *   *Tone:* Accusatory ("same as if I'd shipped it broken on purpose"). This is toxic. It attacks intent rather than process.

  3.  **Deconstruct the User's Argument:**
      *   *Premise:* 50k lines of code + multiple feature flags = exponential state space.
      *   *Premise:* Humans cannot mentally simulate all states.
      *   *Conclusion:* I couldn't have reasonably predicted this specific edge case without explicit testing.
      *   *Validity:* High. This aligns with software engineering best practices (testing, CI/CD, feature flag management).

  4.  **Evaluate the "Who is Right" Question:**
      *   Technically: The code *did* cause the bug.
      *   Practically/Professionally: The Tech Lead is wrong about the *implication of knowledge* and the *intent*.
      *   Systemically: The *process* failed, not just the individual. Why were two old flags allowed to interact without tests? Why wasn't there integration testing?

  5.  **Identify the Underlying Issues:**
      *   **Cognitive Load:** No developer can hold a 50k line system's state space in their head.
      *   **Feature Flag Hygiene:** Old flags should be cleaned up. Interactions should be documented/tested.
      *   **Testing Strategy:** Reliance on mental verification vs. automated integration tests.
      *   **Blame Culture:** The Tech Lead is personalizing a systemic failure. "Shipping broken on purpose" is a malicious accusation.
      *   **Performance Review Usage:** Using a postmortem finding as a "gotcha" for a performance review is generally considered bad management practice (unless there's a pattern of negligence, which this doesn't sound like).

  6.  **Formulate the Advice:**
      *   **Validate:** Confirm that the user's feeling is correct. The lead's argument is flawed.
      *   **Explain Why:** Break down the logical fallacies (Hindsight Bias, Omniscience Fallacy).
      *   **Shift Focus:** Move from "Who is to blame?" to "How do we prevent this?" (Systemic vs. Individual).
      *   **Actionable Steps:**
          *   Push back on the review language (focus on growth/process, not intent).
          *   Advocate for better flag management (sunset policies).
          *   Advocate for better testing (integration/combination testing).
          *   Document the cognitive limit argument professionally.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the user. "Your gut is right."
      *   *Analysis of Lead's Claim:* It's logically unsound. Writing code $\neq$ knowing all emergent properties. Use the "map vs. territory" or "complexity" analogy.
      *   *The "Intent" Accusation:* This is the most dangerous part. "Shipping on purpose" implies malice or gross negligence. Reject this firmly but professionally.
      *   *Systemic View:* This is a process failure (flag hygiene, testing coverage), not a person failure.
      *   *Review Advice:* How to handle the write-up. Focus on "Areas for Growth" regarding testing strategies, not "Failure to predict the unpredictable."
      *   *Closing:* Encouragement. This is a common growing pain in engineering cultures.

  8.  **Refining the Tone:**
      *   Needs to be supportive but professional.
      *   Avoid bashing the lead too hard (politics), but be firm on the principle.
      *   Use industry standard terms (Hindsight Bias, Blameless Postmortem, Cognitive Load).

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, should I tell them to fight the lead?* Better to suggest a collaborative reframing. Fighting might hurt the review. Reframing protects the user while acknowledging the incident.
      *   *Make sure to mention Feature Flag Management.* That's a specific technical debt issue here.
      *   *Emphasize "Blameless Postmortem".* This is a key DevOps/SRE concept that the lead is violating.

  10. **Final Output Structure:**
      *   Direct Answer (You are right).
      *   Why the Lead is Wrong (3 key points).
      *   The Real Issue (Systemic).
      *   How to Handle the Review.
      *   How to Prevent Recurrence.

