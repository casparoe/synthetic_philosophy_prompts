prompt: |-
  A few weeks ago my team ran a postmortem after a fairly bad production outage, and the final write-up named the root cause as "the on-call engineer's failure to roll back the bad deploy within the fifteen-minute SLA window." That sentence stuck with me, because a great many other people also failed to roll back that deploy within fifteen minutes: I did, our director did, and so did an engineer on a completely unrelated team who had never even heard of the service in question. None of us would ever be listed as a cause of the outage, yet strictly speaking our inaction satisfied exactly the same counterfactual test as the on-call engineer's — if any of us had acted, the outage would have been shorter. That asymmetry bothered me enough that I looked into it, and it turns out I'd stumbled onto a genuine, unresolved dispute in metaphysics about whether absences, omissions, and failures to act can be causes at all, rather than just a question of how engineering orgs like to assign blame.

  As far as I can tell, the standard counterfactual theory of causation, most associated with David Lewis, is committed to saying that omissions can indeed be genuine causes, since the counterfactual test doesn't distinguish between an absent action and a present one; Lewis apparently even wrote a late paper called "Void and Object" extending his account to exactly this kind of case, effectively accepting that it multiplies causes well beyond what common sense would pick out (on this view my director's failure to roll back is just as much a "cause" as the on-call engineer's, even though nobody would say so out loud). Against this are philosophers who hold that genuine causation requires some physical process or transfer connecting cause and effect — Phil Dowe's work seems to be the reference point here — and who conclude that omissions are never causes in the strict sense, only what Dowe calls "quasi-causes," close enough to the real thing to fool our intuitions without actually being it. And then there's apparently a third camp (Sarah McGrath's name came up) that tries to rescue ordinary talk by making causation-by-omission relative to a norm or statistical default, so that an absence counts as a cause only when it departs from how things were supposed to go — which would explain why we pin the outage on the on-call engineer, who had a defined duty to act, and not on the rest of us, who didn't.

  I'd like you to write me a properly argued essay on this question: are omissions ever causes in the full, literal sense, or is a sentence like "the missing rollback caused the outage" always, underneath the surface grammar, doing something other than describing genuine causation — expressing a normative judgment, assigning responsibility, or just speaking loosely for convenience? Please engage seriously with the profligacy problem I ran into above (treating omissions as causes seems to force you to count vast numbers of irrelevant non-events as causes too) and show how each side actually tries to handle it, rather than just surveying the positions. Above all, don't leave me with a shrug at the end: come down on one side, or on a precise qualified position — something like "omissions are causes, but only relative to a contextually fixed normative baseline, and here is why that's principled rather than a cop-out" would count as a real verdict — and defend it against the strongest objections you raised along the way. If you have room, I'd also be curious whether your answer should make us more suspicious of naming any single "root cause" in a postmortem at all, but that's secondary to the main metaphysical question.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The metaphysics of causation by omission (can failures to act be genuine causes?).
      *   **Context:** A software engineering postmortem where the on-call engineer was blamed for not rolling back, but logically, *everyone* failed to roll back (director, unrelated engineer, etc.). This highlights the "profligacy problem" (too many causes).
      *   **Key Philosophical Positions to Engage:**
          *   Counterfactual Theory (David Lewis): Omissions *are* causes (leads to profligacy).
          *   Process/Conservation Theory (Phil Dowe): Omissions are *not* causes (only "quasi-causes"), requires physical connection.
          *   Normative/Default Theory (Sarah McGrath): Omissions are causes *relative to norms/expectations*.
      *   **Requirements:**
          *   Properly argued essay.
          *   Engage seriously with the profligacy problem.
          *   Do not end with a shrug; take a definite stance (or precise qualified position).
          *   Defend the stance against objections.
          *   (Optional but desired) Implications for postmortems/root cause analysis.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Lewis (Counterfactual):* If $C$ hadn't happened, $E$ wouldn't have. If the engineer *had* rolled back, the outage *wouldn't* have happened. Therefore, the failure is a cause. Problem: If *I* had rolled it back, the outage wouldn't have happened. So my inaction is also a cause. This makes causation ubiquitous and unhelpful for explanation.
      *   *Dowe (Process):* Causation requires exchange of conserved quantities (energy/momentum). An absence is nothing. Nothing cannot transfer energy. Therefore, omissions aren't causes. They are "quasi-causes" useful for moral/legal reasoning but not metaphysics. Problem: It clashes violently with intuition. "The gardener's failure to water caused the plant's death" feels true, not just metaphorically.
      *   *McGrath (Normative):* Causation is sensitive to defaults. We compare what happened to what *should* have happened. The on-call engineer *should* have acted. The director *should not* have (usually). This filters the profligacy. Problem: Is causation really normative? Does reality depend on our rules?

  3.  **Determine the Stance:**
      *   The prompt asks me not to shrug. I need to pick a side or synthesize.
      *   *Option A (Lewis):* Defend profligacy. Say "Yes, everything is a cause, but we select for pragmatics." (A bit weak for the user's specific frustration).
      *   *Option B (Dowe):* Say "No, omissions aren't causes." (Hard to defend given how useful omission talk is in engineering).
      *   *Option C (McGrath/Normative):* Say "Omissions are causes, but causation is inherently contrastive and normative." This seems the most robust fit for the engineering context. It validates the user's intuition that the asymmetry is real, not just blame-shifting, while acknowledging the metaphysical weirdness.
      *   *Decision:* I will argue for a **Contextualist-Normative View**. Omissions are genuine causes, but causation itself is not a brute physical relation independent of context; it is a relation sensitive to "default" states. This solves the profligacy problem without denying the reality of omission causation.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the postmortem story. State the problem (profligacy). State the thesis (Omissions are causes, but causation is contrastive and norm-sensitive).
      *   **The Counterfactual Trap (Lewis):** Explain why Lewis's view leads to the "everyone is guilty" problem. It treats all counterfactual dependencies equally. Acknowledge its strength (simplicity) but highlight its failure in explanation.
      *   **The Physicalist Retreat (Dowe):** Explain the process view. It solves profligacy by banning omissions. But it creates a dualism (real causes vs. quasi-causes) that makes sense of physics but not of human systems (like software).
      *   **The Normative Solution (McGrath & Contextualism):** This is the core argument. Causation selects *differences* from a background. The background is defined by norms/expectations.
          *   *Why this isn't a cop-out:* It's not just "blame"; it's about what constitutes a relevant change in the system state.
          *   *Addressing the "Metaphysics" worry:* Is causation mind-dependent? Argue that causation is an explanatory tool, not just a physical glue.
      *   **Defending the View:** Anticipate objections.
          *   *Objection 1:* "You're mixing ethics and metaphysics." *Rebuttal:* Norms define the "normal state" required to identify a "deviation."
          *   *Objection 2:* "What if the norm is wrong?" *Rebuttal:* Causation claims are still true relative to the model, even if the model is flawed.
      *   **Implications for Postmortems:** How does this change how we write RCAs? Move from "Who failed?" to "What was the expected baseline?" Blameless postmortems align with this.
      *   **Conclusion:** Reiterate the verdict.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying causation is "normative" too subjective?
      *   *Fix:* Use the term "Default Relative." It's not about moral blame, but about system design expectations. The on-call engineer is part of the control loop; the director is not. The "norm" is architectural, not just moral.
      *   *Critique:* Make sure I don't just summarize McGrath but extend the logic to the engineering context.
      *   *Focus:* The user's specific example (the unrelated engineer) is the perfect test case. Why isn't their inaction a cause? Because they weren't in the "causal field."

  6.  **Final Polish:**
      *   Ensure tone is philosophical but accessible to an engineer.
      *   Check that I explicitly answer the "root cause" question at the end.
      *   Verify the stance is clear: Omissions *are* causes, but only relative to a normative baseline.

  7.  **Final Review against constraints:**
      *   Engage profligacy? Yes.
      *   Engage Lewis, Dowe, McGrath? Yes.
      *   No shrugging? Yes, taking the Normative/Contextualist stance.
      *   Postmortem implication? Yes.

  *(Self-Correction Note)*: I need to be careful not to conflate "causation" with "explanation." Lewis distinguishes them, but for the purpose of the user's problem (the write-up), the distinction blurs. I should argue that *causal selection* is part of the metaphysics of causation in special sciences (like engineering), not just pragmatics.

  Let's write.
answer: |-
  # The Causality of Absence: Why the On-Call Engineer Caused the Outage (And You Didn't)

  The postmortem document sits on your screen, stark and accusatory: *Root Cause: The on-call engineer's failure to roll back.* Logically, you know this is incomplete. As you noted, the counterfactual test applies universally. If you had rolled back the deploy, the outage would have ended. If the CEO had rolled it back, the outage would have ended. If a random passerby with laptop access had rolled it back, the outage would have ended. By the strict logic of counterfactual dependence, the inaction of every conscious being on Earth is a cause of the outage's duration.

  This is the **profligacy problem**, and it reveals a crack in our understanding of causation. If we accept that omissions (failures to act) are causes, causation becomes so ubiquitous it loses its explanatory power. If we deny they are causes, we cannot make sense of vast swathes of human experience, from gardening ("lack of water killed the plant") to engineering ("missing heartbeat triggered the failover").

  This essay argues for a specific resolution to this dilemma. Omissions **are** genuine causes, but causation is not a brute physical relation existing independently of context. Instead, causation by omission is **relative to a normative baseline**. The asymmetry between the on-call engineer and the unrelated engineer is not merely a matter of blame assignment or pragmatic shorthand; it reflects a metaphysical truth about how causal relations are individuated in complex systems. To say "the missing rollback caused the outage" is to make a literal claim about the world, but one that presupposes a specific model of how that world is *supposed* to function.

  ### The Counterfactual Trap

  To understand why the postmortem feels both right and wrong, we must look at the dominant theory of causation in modern metaphysics: the counterfactual theory, championed by David Lewis. For Lewis, $C$ causes $E$ if and only if, had $C$ not occurred, $E$ would not have occurred.

  This theory is elegant because it reduces causation to dependency. In your outage scenario, let $C$ be "Engineer fails to roll back" and $E$ be "Outage persists." If the engineer *had* rolled back, the outage *would not* have persisted. The dependency holds. Therefore, the failure is a cause.

  However, as you discovered, the dependency holds for everyone. Let $C^*$ be "Director fails to roll back." Had the director rolled back, the outage would not have persisted. Lewis acknowledged this. In his later work, including "Void and Object," he accepted that his theory is "profligate." It counts far more events as causes than common sense does. Lewis's solution was to separate **causation** from **causal explanation**. He argued that while the director's inaction is technically a cause, it is not *salient* for explanation. We filter causes based on what is abnormal or informative.

  This is where Lewis fails the engineering test. By relegating the distinction to "explanation" rather than "causation," he leaves the metaphysics inert. If the director's inaction is a cause in the same literal sense as the on-call engineer's, then the postmortem is technically lying when it singles out one person. It is treating a pragmatic selection as a metaphysical identification. For a team trying to prevent future outages, this distinction matters. If the director's inaction is a cause, perhaps we should build a system where the director *does* act. Lewis's view offers no metaphysical ground to say why that would be a category error.

  ### The Physicalist Retreat

  Opposing Lewis are process theorists like Phil Dowe. They argue that genuine causation requires a physical connection, typically defined as the transfer or exchange of a conserved quantity (like energy or momentum). On this view, the world is a web of physical processes.

  When an engineer types a command to roll back, neurons fire, electrons move, and packets are sent. This is a physical process. When the engineer *fails* to type, nothing happens. There is no transfer of energy. There is no "nothing" moving from the engineer to the server. Therefore, Dowe concludes, omissions are not causes. They are "quasi-causes." They behave like causes in our reasoning and legal systems, but they do not exist in the ontology of the universe.

  This solves the profligacy problem instantly. The director didn't cause the outage because no physical process linked the director's brain to the server. Only the processes that *did* occur (the bad deploy, the server consuming memory) are causes.

  However, this view is too austere for engineered systems. In software and organizational design, **absences are functional components**. A circuit breaker trips because current *stops* flowing. A health check fails because a heartbeat *stops* arriving. If we adopt Dowe's view, we must say that the tripping of the circuit breaker was not caused by the absence of current, but only by the prior presence of current. This contorts the description of how the system works. In high-level systems, the "nothing" is often the signal. To deny omissions causal status is to deny the reality of control logic. It renders the language of engineering metaphysically second-class, which is unhelpful for a discipline built on abstraction.

  ### The Normative Baseline: A Third Way

  The solution lies in the third camp, represented by philosophers like Sarah McGrath, but sharpened for the context of complex systems. This view holds that causation by omission is genuine, but it is **contrastive and default-relative**.

  Causation is not just a relation between events $C$ and $E$. It is a relation between $C$ and $E$ relative to a **model of normality**. For an omission to be a cause, the action omitted must be part of the "default" or "expected" course of events.

  Consider the difference between a gardener and a passerby. If a gardener fails to water a plant, and it dies, the failure is a cause. If a passerby fails to water it, it is not. Physically, their situations are identical (both did not pour water). Normatively, they are distinct. The gardener is part of the plant's maintenance system; the passerby is not. The "normal" state of the gardener includes watering; the "normal" state of the passerby does not.

  Apply this to your outage. The on-call engineer is a component in the system's feedback loop. The system is designed with the expectation that an on-call engineer exists and will act within an SLA. Their inaction represents a **deviation from the system's designed baseline**.

  You, the director, and the unrelated engineer are *outside* that feedback loop. Your inaction is not a deviation from the system's norms; it is the background state of the universe. The system does not rely on you to roll back deploys. Therefore, your inaction is not a "difference-maker" relative to the model of the system.

  This is not merely a moral judgment about blame. It is a structural judgment about **system boundaries**. When we ask "What caused the outage?", we are implicitly asking "What deviation from the expected system behavior resulted in this failure?" The on-call engineer's inaction was a deviation. Yours was not.

  ### Defending the Normative View

  This position invites two strong objections. The first is that it conflates **metaphysics** with **ethics**. Critics argue that what *caused* the outage should be a fact about the universe, independent of who was supposed to do what. If causation depends on norms, does reality change when the on-call rotation schedule changes?

  In a sense, yes. But this is not subjective idealism; it is **functional realism**. In engineered systems (and biological ones), function is real. A heart's function is to pump blood. If it stops, the cessation is a cause of death. If a rock in your chest stops pumping blood, it is not a cause of death, because the rock had no function to pump. The "norm" is not a moral rule; it is a specification of the system's intended operation. The on-call engineer is a functional component. When they fail to act, a functional part of the causal chain is broken. When you fail to act, no functional part is broken, because you were never part of the chain. The norm identifies the chain.

  The second objection is that this makes causation **unstable**. If the team decides tomorrow that *everyone* is on-call, does the causation of the previous outage retroactively change?

  No, because causation is time-indexed to the **context of assessment**. When we analyze the outage, we assess it against the norms and system design *at the time of the event*. Changing the norms tomorrow changes future causal relations, not past ones. Furthermore, this instability is a feature, not a bug. It reflects the fact that causation is an explanatory tool. We use causal claims to identify leverage points for intervention. Identifying the on-call engineer's inaction as the cause points to a leverage point (the on-call process). Identifying your inaction as a cause points to no leverage point, because there was no mechanism for you to act. A theory of causation that identifies non-intervenable factors as causes is less true to the concept of "cause" (which implies production and influence) than one that restricts causes to intervenable deviations.

  ### The Verdict

  So, are omissions causes? **Yes, but only when they represent a deviation from a normative or functional baseline.**

  The sentence "the missing rollback caused the outage" is not loose speech. It is a precise claim that the system's safety mechanism (the on-call response) failed to execute its designated function. It is not a claim that "nothing happened," nor is it merely a moral accusation. It is a statement about the breach of a causal contract embedded in the system's design.

  This verdict saves us from the profligacy of Lewis without retreating into the physicalist dogmatism of Dowe. It acknowledges that in human and engineered systems, "nothing" can be a cause, but only when that "nothing" occurs in a slot reserved for "something."

  ### Implications for Postmortems

  This metaphysical conclusion should fundamentally alter how your team writes postmortems.

  First, it validates **Blameless Postmortems**, but for a deeper reason than usual. Usually, we say "don't blame people" to encourage psychological safety. The normative view suggests we should avoid blaming individuals because **individuals are rarely the sole locus of the normative breach.** If the on-call engineer failed to roll back, we must ask: *Why was the baseline expectation that a single tired human would catch this?* If the system relies on a hero to prevent failure, the normative baseline is fragile. The "cause" might not be the engineer's omission, but the **system design that made that omission critical.**

  Second, it warns against **Single Root Causes**. Your intuition that "many people failed to roll back" was metaphysically sound, even if only one failure was causal relative to the norms. A robust system should have multiple normative baselines (e.g., automated rollbacks, canary analysis, second-engineer verification). If the postmortem names only the human omission, it ignores the missing *automated* omissions (e.g., "the monitoring script failed to alert"). The script also "failed to act," and since it was *supposed* to act, its omission is also a cause.

  By recognizing that omissions are causes relative to expectations, you stop looking for the "person who broke it" and start looking for the "expectations that were unsupported." The goal of the postmortem becomes aligning the normative baseline with reality. If humans consistently fail to roll back in fifteen minutes, the norm is wrong, not the human. The causation of future outages will only be prevented when the system is redesigned so that the "expected" behavior (the baseline) does not rely on a fragile omission.

  In the end, the on-call engineer caused the outage because they were the designated guardian of the system's stability. But the *outage itself* was caused by a culture that believed stability could be guarded by a single point of human attention. Metaphysics clarifies that while the engineer's inaction was the spark, the fuel was the assumption that their inaction mattered more than anyone else's.
