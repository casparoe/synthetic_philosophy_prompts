      *   *Modern Scholarship:* Mention Menachem Kellner (Maimonides' Confrontation with Mysticism) or Isaac Shailat. Kellner argues Maimonides thinks sacrifice *will* be abolished in the Messianic era despite what Hilchot Melachim says. This directly addresses the "loose thread." I should present this as a strong interpretive possibility.
