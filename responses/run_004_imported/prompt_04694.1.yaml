      *   *Key Players:* Maimonides (Rambam), Nahmanides (Ramban), R. Kook, R. Soloveitchik, modern scholars (Isaac Shailat, Menachem Kellner, etc.).
      *   *The "Concession" View:* Sacrifice is secondary to prayer.
      *   *The "Halakhic" View:* Sacrifice is an eternal commandment.
      *   *The Temple Institute Context:* This adds a layer of *activism* vs. *passive waiting*. Maimonides is generally rationalist and cautious about messianic activism (see Hilchot Melachim on checking false messiahs).

