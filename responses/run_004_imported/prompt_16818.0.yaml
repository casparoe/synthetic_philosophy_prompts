answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Community Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case # [Number] – Ulysses Contract vs. Current Refusal

  **Purpose**
  This memo addresses the ethical conflict in Case #[Number]: whether to honor a psychiatric advance directive (Ulysses contract) signed during euthymia or to respect the patient's current refusal of treatment during hypomania. The committee faces a tension between two autonomous selves: the planning self (stable) and the experiencing self (hypomanic). Defaulting strictly to "current capacity" ignores the specific purpose of the Ulysses contract, which is to mitigate known, predictable shifts in risk valuation. However, dismissing the patient's current articulation as mere symptomatology undermines her dignity and agency.

  **Ethical Analysis**
  1.  **Validity of Precommitment:** The patient's advance directive was executed when she possessed full decisional capacity. It specifically anticipated this clinical scenario (hypomania) and recognized that her future valuation of risk would be compromised (time-inconsistent preferences). To ignore this is to disregard her long-term autonomy.
  2.  **Status of Current Refusal:** The patient is articulate and her refusal is coherent within her current state. However, "borderline" capacity indicates instability. Her argument that the document "no longer speaks for her" is the exact contingency the contract was designed to override. Yet, coercion carries ethical cost. We must not treat her current self as an adversary, but as a compromised agent whose ability to weigh long-term consequences is currently impaired.
  3.  **The "Capacity" Trap:** Relying solely on a "capacity now" assessment is insufficient here. In bipolar spectrum disorders, capacity is fluctuating. A finding of "borderline" suggests she may lack the capacity to understand the *risk of losing capacity*, which is the crux of the decision.

  **Recommendation**
  The Committee should recommend that the treatment team **honor the Ulysses contract provisionally, with strict temporal and procedural limits.** We should not view this as a binary choice between total enforcement and total dismissal.

  **Action Plan & Timeframe:**
  1.  **Initiate Treatment:** Begin the medication/treatment protocol outlined in the advance directive immediately. This honors the competent, planning self's risk assessment.
  2.  **72-Hour Review Window:** This authorization is valid for **72 hours only**. The goal of this window is not indefinite maintenance of compliance, but rapid stabilization sufficient to restore decisional capacity.
  3.  **Re-engagement Protocol:** During this 72-hour period, the clinical team must engage the patient daily regarding her treatment preferences. As soon as clinical indicators show a return to euthymia (or sufficient capacity), the advance directive is suspended, and current consent becomes primary.
  4.  **Documentation:** The medical record must explicitly state that treatment is proceeding under the authority of the advance directive *despite* current objection, noting the "borderline" capacity finding as the justification for prioritizing the prior competent directive.

  **Rationale**
  This approach avoids the "punt" of deferring solely to current capacity, which risks rapid deterioration and violates her prior autonomous wish. Simultaneously, it takes her current refusal seriously by limiting the duration of coercion and making the restoration of her voice the primary clinical goal. We are not treating her as a pigeon pecking a key; we are treating her as a person whose ability to hold her own values steady is temporarily compromised.

  **Decision Required**
  I move that the Committee adopt this recommendation and convey it to the attending psychiatrist by Thursday afternoon.
