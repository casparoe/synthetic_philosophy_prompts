      *   **Capacity:** The legal/clinical standard. If she has capacity *now*, the AD usually loses. But capacity in bipolar mania/hypomania is fluctuating and domain-specific. "Borderline" is the danger zone.
      *   **Autonomy:** Which self represents true autonomy? The stable planner or the experiencing agent?
      *   **Risk:** Treating against will causes trauma/distrust. *Not* treating risks full mania, harm, financial ruin, etc.
