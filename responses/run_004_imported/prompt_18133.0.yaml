      The glass urns sat on the table, stark under the seminar lights. Urn 1 held fifty red, fifty black. Urn 2 held one hundred, ratio unknown.

      "Name the odds," said the Precise Bayesian (PB). "What price for a ticket paying $100 if the draw from Urn 2 is Red?"

      The Imprecise Probabilist (IP) folded their arms. "I refuse to name a single number."

      "Then you're trapped," PB said. "To refuse a price is to state a credence. If you won't bet at 50:50, you believe the chance isn't 0.5. If you won't bet at any other odds either, you admit you have no opinion. Which is it? Are you secretly a 0.5 Bayesian, or merely clueless?"

      "Neither," IP replied. "That's a false dilemma. Urn 1 warrants a sharp function: {0.5}. Urn 2 warrants a credal set: the interval [0, 1]. This isn't ignorance; it's a representation of evidence that supports many distributions equally. I distinguish risk from ambiguity. My refusal to bet isn't indecision; it's a judgment that the evidence doesn't justify sharpening the set."

      "But evidence must guide action," PB countered. "Consider Adam Elga's sequential choice argument. Suppose I offer you two bets separately. Relative to your set [0, 1], Bet A is E-admissible—it maximizes utility for some probability in your set. So is Bet B. You accept both. Yet jointly, they guarantee a loss. A sharp agent never accepts dominated acts. To avoid this, you need a tie-breaking rule to select one distribution from your set when choices arise. But that rule just smuggles a sharp credence back in. Your set collapses under dynamic pressure."

      IP leaned forward. "You assume rationality requires a complete ordering of acts. Levi's E-admissibility says an act is permissible if it's optimal for *some* distribution in the set. I don't need a tie-breaker; I need a policy. When facing sequential choices, I constrain my future self. I don't pick a sharp probability; I pick a strategy consistent with the set. Rationality isn't about maximizing utility uniquely; it's about avoiding dominated options relative to what's known. If the set allows multiple permissible paths, so be it. That's not incoherence; it's honesty about underdetermination."

      "Honesty that leaves you vulnerable," PB said. "But let's turn to your strongest card: dilation. You claim that when I condition on new evidence, my sharp probability updates cleanly. You claim that sometimes, conditioning your credal set widens the interval. Learning makes you less certain. That seems absurd."

      "It's not absurd," IP insisted. "Suppose I have a coin with unknown bias. I learn a correlate that is independent of the outcome relative to every probability in my set. In your framework, independence means no update. In mine, the posterior set dilates—the interval widens. This captures the phenomenon where learning something relevant about the *process* increases uncertainty about the *outcome*. You can't model this. Your sharp priors force you to pretend you know the independence structure precisely. I represent the ignorance of that structure, and dilation shows the cost."

      PB shook their head. "Dilation isn't a feature of ignorance; it's a bug of your model. It arises when your credal set violates conglomerability or assumes independence incorrectly. If learning relevant evidence widens your credence, your prior set was malformed. I model ignorance with a diffuse hierarchical prior. When I learn the correlate, I update the hierarchy. My uncertainty about the bias might remain high, but it doesn't irrationality expand without cause. Dilation shows that representing ignorance as a set of probabilities conflates 'I don't know the probability' with 'The probability is indeterminate.' There is a true chance state; I just don't know it. You treat the epistemic gap as an ontological one."

      "And you treat epistemic gaps as errors to be smoothed over," IP shot back. "You force precision where the evidence is silent. I'd rather have a wide interval than a sharp delusion."

      "And I'd rather have a decision rule that doesn't get money-pumped," PB concluded. "We seem to value different virtues: coherence versus representation."

      "Then the urns remain closed," IP said.

