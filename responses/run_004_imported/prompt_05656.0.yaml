answer: |-
  You have hit on exactly the right tension. Your intuition is perfectly correct for standard decision theory and game theory with **perfect recall**. In those settings, you are right: a mixed strategy is just a probability distribution over pure strategies, so its expected utility is a weighted average of the pure utilities. It can never strictly exceed the best pure strategy.

  The reason the Absent-Minded Driver breaks this rule is that **imperfect recall breaks Kuhn's Theorem.**

  Here is the mathematical breakdown of why your usual logic fails here, and what is specifically different about this setup.

  ### 1. Mixed vs. Behavioral Strategies
  To see the glitch, we have to distinguish between two ways of randomizing:

  *   **Mixed Strategy (Ex-Ante):** Before you start driving, you flip a coin once to decide your **entire plan**.
      *   Heads: "I will always Continue."
      *   Tails: "I will always Exit."
  *   **Behavioral Strategy (Local):** At **each intersection**, you flip a coin to decide what to do right now, independent of the past or future.
      *   Rule: "At any intersection I see, I Continue with probability $p$."

  In games with **perfect recall**, Kuhn's Theorem proves these are equivalent. Any outcome distribution you can get with behavioral randomization, you can also get with mixed randomization over pure plans.

  In games with **imperfect recall** (like the Absent-Minded Driver), **they are not equivalent.** Behavioral strategies are strictly more powerful.

  ### 2. The Math of the Limit
  Let's look at the payoffs using your standard numbers (0 at 1st exit, 4 at 2nd exit, 1 at home).

  **If you use a Mixed Strategy (Ex-Ante Plan):**
  Because you cannot distinguish the intersections, a "Pure Strategy" is a single instruction that applies to *both* intersections simultaneously. You only have two pure strategies:
  1.  **Always Exit:** You exit at the first intersection. Payoff = **0**.
  2.  **Always Continue:** You continue at the first, continue at the second. Payoff = **1**.
      *(Note: You cannot have a pure strategy of "Exit at 2nd" because that requires distinguishing the 2nd from the 1st.)*

  If you mix between these two plans with probability $\lambda$:
  $$E[U] = \lambda(0) + (1-\lambda)(1) = 1 - \lambda$$
  The maximum value here is **1** (when $\lambda=0$). Your intuition holds: mixing pure plans cannot beat the best pure plan.

  **If you use a Behavioral Strategy (Local Randomization):**
  You choose a probability $p$ to Continue at *whichever* intersection you find yourself at. The coin flips at the two intersections are independent events.
  *   Prob(Exit at 1st) = $(1-p)$. Payoff = 0.
  *   Prob(Continue at 1st, Exit at 2nd) = $p(1-p)$. Payoff = 4.
  *   Prob(Continue at 1st, Continue at 2nd) = $p^2$. Payoff = 1.

  $$E[U] = 0 + 4p(1-p) + 1p^2 = 4p - 3p^2$$

  Maximizing this ($d/dp = 4 - 6p = 0$) gives **$p = 2/3$**.
  The expected payoff is **$4/3$**.

  ### 3. What Mathematically Broke?
  The "Mixing can't beat pure" logic relies on the assumption that the actions at different decision nodes are **perfectly correlated** within a pure strategy.

  *   In a **Mixed Strategy**, the correlation is 100%. If your plan is "Continue," you continue at Intersection 1 **AND** Intersection 2. You cannot Continue at the first and Exit at the second, because you can't write that plan down without being able to distinguish the intersections.
  *   In a **Behavioral Strategy**, the actions are **independent**. Even though you use the same rule ($p=2/3$), the realization of the randomness at Intersection 1 is independent of the realization at Intersection 2.

  This independence allows you to effectively achieve the path **"Continue at 1, Exit at 2"** with probability $p(1-p)$.
  *   With $p=2/3$, the probability of this specific path is $(2/3)(1/3) = 2/9$.
  *   This path yields the high payoff of 4.

  No mixture of pure strategies can generate this path distribution. A mixture of pure strategies can only generate "Exit at 1" or "Continue at 1 & 2". It creates a gap in the feasible set of outcome probabilities. The behavioral strategy fills that gap.

  ### 4. The Intuitive Summary
  Your intuition assumes that randomizing is just "hedging your bets between complete stories."
  *   Story A: I exit immediately.
  *   Story B: I drive all the way home.
  *   Hedging between them doesn't help because both are bad.

  But imperfect recall changes randomization into "adding noise to your control."
  *   By adding noise (randomizing locally), you decouple your action at the first intersection from your action at the second.
  *   You are effectively allowing yourself to **drift** into the optimal path (Continue then Exit) even though you cannot **steer** into it deliberately.

  ### A Note on the Controversy
  It is worth noting that while $4/3$ is the standard "behavioral" solution, this result is actually famous for being controversial in decision theory (the Piccione & Rubinstein 1997 paper sparked a massive debate).

  Some theorists argue that the **ex-ante self** (you before you start driving) should bind the **ex-post self** (you at the intersection). If you recognize ex-ante that behavioral strategies yield 4/3 but mixed strategies yield only 1, you might try to commit to a behavioral rule. However, others argue that because you can't distinguish the nodes, you can't actually update your beliefs consistently, leading to "time inconsistency" paradoxes.

  But to answer your specific seminar question: **Imperfect recall allows behavioral strategies to span a larger set of outcome distributions than mixed strategies over pure plans.** That is the mathematical loophole that allows randomization to strictly dominate pure planning.
