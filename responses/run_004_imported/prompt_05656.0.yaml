  2.  **Deconstruct the Misconception:**
      *   *Standard Game Theory (Perfect Recall):* In a standard single-agent decision tree with perfect recall, a mixed strategy is indeed a probability distribution over pure strategies. The expected utility of a mixed strategy is $\sum \sigma_i U(s_i)$. Therefore, $\max U(s_i) \geq \sum \sigma_i U(s_i)$. Mixing cannot strictly dominate the best pure strategy.
      *   *Absent-Minded Driver (Imperfect Recall):* The user is correct that the result ($4/3 > 1$) seems to violate this. Why? Because the definition of "strategy" and how probabilities map to outcomes changes when information sets are shared across time.

  3.  **Identify the Key Mechanism:**
      *   The crucial distinction is between **Mixed Strategies** and **Behavioral Strategies**.
      *   *Perfect Recall (Kuhn's Theorem):* Mixed and Behavioral strategies are equivalent. You can achieve any outcome distribution with a mix of pure plans.
      *   *Imperfect Recall:* Kuhn's Theorem fails. Behavioral strategies (randomizing at each node independently) are *more expressive* than mixed strategies (randomizing over complete plans ex-ante).
      *   *The "Correlation" Issue:* When you randomize ex-ante (Mixed), your action at Intersection 1 is perfectly correlated with your action at Intersection 2 (because it's the same plan). If you plan "Continue," you continue at *both*. If you plan "Exit," you exit at *both* (or rather, the plan dictates the whole path).
      *   When you randomize locally (Behavioral), your action at Intersection 1 is *independent* of your action at Intersection 2 (from the perspective of the decision rule, even though it's the same agent). You can Continue at 1 and Exit at 2.

