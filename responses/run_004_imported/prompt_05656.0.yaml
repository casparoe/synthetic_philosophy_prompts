          *   Plan "Always Exit": At X, Exit (Payoff 0). At Y, never reached. Result: 0.
          *   Plan "Always Continue": At X, Continue. At Y, Continue. Payoff 1.
          *   Wait, what about "Exit at 2nd"? To do that, I need to Continue at X and Exit at Y. But I can't distinguish X from Y. So I can't condition my action on being at Y.
          *   So, Pure Strategies = {Always Exit, Always Continue}. Payoffs = {0, 1}.
