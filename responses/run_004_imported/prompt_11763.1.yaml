answer: |-
  It is a pleasure to correspond with someone who brings both experimental gravimetry experience and a fresh eye to epistemology. You have grasped the formal structure of the Problem of Old Evidence (POE) perfectly. Your derivation is correct: if $P(E) = 1$, then $P(T|E) = P(T)$.

  However, to answer your core question directly: **No, it is not a fair reading of the philosophical upshot to conclude that retrodicting known anomalies is confirmationally worthless.**

  If you tell your colleagues that Mercury's perihelion "doesn't count" as evidence for General Relativity (GR) based on this chapter, you will likely start a fight with the philosophers as well as the physicists. The POE is widely regarded not as a *demonstration* that old evidence is useless, but rather as a *reductio ad absurdum* showing that naive Bayesian conditionalization is an incomplete model of how scientific learning works.

  Here is the breakdown of why your intuition (and your colleagues') is safer than the strict formalism, and how the literature actually resolves this.

  ### 1. The Problem is with the Model, Not the Science
  The consensus in philosophy of science is that the POE reveals a limitation in the standard Bayesian updating rule, not a limitation in scientific reasoning. If a formalism implies that Einstein gained no confirmation from Mercury, the formalism is deemed inadequate, not Einstein's reasoning.

  The POE forces Bayesians to refine what exactly constitutes the "evidence" $E$ in the equation.

  ### 2. The Standard Solution: Learning the Logical Connection
  The most influential solution to this problem (championed by Daniel Garber and others in the 1980s) distinguishes between the **fact** of the evidence and the **relationship** between theory and evidence.

  *   **The Fact ($E$):** "Mercury's perihelion precesses by 43 arcseconds/century." As you noted, by 1915, the scientific community had $P(E) \approx 1$.
  *   **The Relationship ($T \vdash E$):** "General Relativity *entails* that Mercury's perihelion precesses by 43 arcseconds/century."

  When Einstein finished the field equations in November 1915, he did not know $T \vdash E$. He had to work through the approximations to discover that his theory *recovered* the anomaly. The "new" evidence that updates the credence in $T$ is not $E$ itself, but the proposition that $T$ explains $E$.

  In this refined Bayesian view, we conditionalize on the fact that the theory entails the evidence ($T \rightarrow E$), not just the evidence itself. Since it was possible for $T$ to be true and *not* entail $E$ (or entail a different value), learning that the entailment holds *does* shift the probability of $T$, even if $E$ was already known.

  ### 3. Novelty vs. Accommodation
  You asked whether only genuinely novel predictions should move credences. This touches on the debate between **predictivism** (novel predictions confirm more strongly) and **accommodation** (fitting old data confirms equally well).

  While some philosophers argue that novel predictions carry extra weight (often to rule out *ad hoc* theorizing), very few argue that accommodation is *worthless*.
  *   **Novel Predictions (e.g., 1919 Eclipse):** These are crucial for ruling out the possibility that the theory was constructed specifically to fit the known data (overfitting).
  *   **Old Evidence (e.g., Mercury):** This is crucial for **unification** and **explanatory power**. A theory that unifies disparate phenomena (planetary motion and the nature of gravity) is preferred over one that does not, even if the data was known.

  If we accepted your reading—that old evidence counts for zero—we would have to say that Newtonian mechanics received *no* confirmation from Kepler's laws, since Kepler's laws were known long before Newton. That is a conclusion almost no philosopher or historian of science accepts.

  ### 4. Why This Matters for a Physicist
  As an experimentalist, you know that "explaining the anomaly" is often the strongest motivation for accepting a new theory. The POE is essentially a technical wrinkle in how we map that reasoning onto probability theory.

  The "dent" is in the Bayesian formalism, not in the logic of evidence. The formalism assumes logical omniscience (that the agent knows all logical consequences of their beliefs instantly). Real agents (like Einstein) are not logically omniscient. They learn logical consequences over time. Once you model the *learning of the implication* as the evidence, the problem dissolves.

  ### Recommendation for Your Coffee Group
  You need not retract your rigorous reading of the formula, but you should contextualize the conclusion. A fair summary to offer your colleagues would be:

  > "The text shows that standard Bayesian conditionalization fails to account for how we update beliefs when we discover a theory explains known data. However, most philosophers treat this as a bug in the formalism, not a feature of science. The consensus is that discovering the *implication* ($T \rightarrow E$) is the actual evidential event, which allows old evidence like Mercury's perihelion to legitimately confirm GR, just as our intuition suggests."

  Your niece left you a book that highlights a famous tension in epistemology, but she likely knows that the "Mercury doesn't count" conclusion is the *puzzle* to be solved, not the *solution* itself. Your physics instincts are holding up better than the naive formalism.
