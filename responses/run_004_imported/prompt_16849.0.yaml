      *   *Clarification:* Guy's point about timing is the "Residual Time" argument. If steps are easy, residual time should be large. It is small. Therefore steps are hard.
      *   *Clarification:* Girl's last point is about "Model Uncertainty." This is a valid Bayesian critique. The likelihood function depends on the model structure.

  7.  **Final Polish:** Check against the prompt requirements.
