      *   **Context:** The user is taking an astrobiology gen-ed course. They expected hard science but found philosophy.
      *   **Topic:** The Fermi Paradox, specifically the "Great Filter" and "Carter's Argument" (Brandon Carter's "Hard Steps" model).
