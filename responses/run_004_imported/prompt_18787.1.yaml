  **Move Justifications:**

  *   **Move 1 (Jess): Score 1.** This applies the "Equal Weight View" of peer disagreement. Given the 50/50 track record and lack of specific evidence of error, treating the probabilities as equal is epistemically sound. Pragmatically, averaging the totals minimizes the expected financial risk for the group, making it a rational heuristic for the situation.
  *   **Move 2 (Owen): Score 0.** This represents the "Steadfast View." While it is rational to trust one's own reasoning, in cases of fallible mental arithmetic, subjective certainty is not proof of correctness. Ignoring the higher-order evidence provided by a trusted peer's disagreement is a common cognitive bias, though not entirely irrational.
  *   **Move 3 (Jess): Score 2.** This is the strongest epistemic point. It correctly identifies the symmetry of fallibility: the psychological experience of "checking your work" feels the same whether you are right or wrong. This effectively neutralizes Owen's appeal to subjective certainty as a tiebreaker.
  *   **Move 4 (Owen): Score -1.** This is a "self-defeat" objection often used in philosophy, but here it functions as a stalemate tactic. While logically interesting, applying it rigidly leads to paralysis. It conflates first-order evidence (the math) with second-order rules (how to handle disagreement), preventing any resolution.
  *   **Move 5 (Jess): Score 2.** Jess correctly identifies that Owen's logic leads to a *reductio ad absurdum*. If valid, his argument would make all rational persuasion impossible (global skepticism). Since we know rational belief revision is possible, his principle must be flawed. This successfully defends the possibility of conciliation.

  **What They Are Both Missing:**

  1.  **The "Both Wrong" Possibility:** They are framing this as a binary choice (Jess vs. Owen). In arithmetic, especially mental math under pressure, it is highly probable that *neither* number is exactly correct.
  2.  **Order-of-Magnitude Estimation:** They assumed "no calculator" meant "no verification." They could have done a quick Fermi estimate (e.g., approximating item counts and average prices) to see which total was plausible without needing exact signal bars.
  3.  **Deferred Verification:** The receipt exists. The rational move for a $5.70 discrepancy is to pay provisionally (perhaps Jess's way to save money, or Owen's to avoid shortage) and reconcile against the paper receipt the moment they get home.
  4.  **Stakes vs. Relationship Cost:** They are debating high-level epistemology over a $2.85 per-person difference. They are missing the meta-rational calculation that preserving house harmony is worth more than the expected value of the math error.
