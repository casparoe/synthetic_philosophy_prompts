          2.  *Unity in Daily Life:* Patients generally report a unified sense of self. The "two minds" effect is mostly visible in tachistoscopic lab conditions (flashing images to one visual field), not dinner parties.
          3.  *The "Interpreter":* The LH usually confabulates reasons for RH actions, rather than the RH explaining itself.
