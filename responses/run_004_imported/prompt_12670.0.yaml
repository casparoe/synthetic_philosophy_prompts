prompt: |-
  I'm drafting a column on the limits of Bayesian rationality and want to pressure-test a claim I keep encountering in decision-theory and rationalist circles: that I. J. Good's 1967 proof that the expected value of free information is never negative settles, once and for all, whether a rational agent should always be willing to gather more evidence before deciding. Skeptics point to Hirshleifer's finding that publicly disclosing information can unravel mutually beneficial insurance and risk-sharing arrangements, to strategic settings in which credible ignorance itself carries bargaining value, and to the vulnerability of merely boundedly rational agents to bias, overload, or paralysis from additional data that an ideal Bayesian would not suffer. Write an essay that states Good's theorem and its key assumptions precisely, explains exactly which assumption each of these purported counterexamples violates (or shows that none of them actually undermine it), and defends a specific, well-justified verdict on whether "never refuse free, decision-relevant evidence" is a norm that idealized Bayesian reasoners, humans, and AI systems facing high-stakes choices should actually follow.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**

      *   **Topic:** The limits of Bayesian rationality, specifically focusing on I. J. Good's 1967 theorem on the value of information.
      *   **Core Claim to Pressure-Test:** "Good's proof settles, once and for all, whether a rational agent should always be willing to gather more evidence before deciding." (i.e., Value of Information (VoI) is always non-negative).
      *   **Counterexamples/Skepticisms to Address:**
          1.  Hirshleifer's effect (information unraveling insurance/risk-sharing).
          2.  Strategic settings (credible ignorance as bargaining power).
          3.  Bounded rationality (bias, overload, paralysis in humans/AI).
      *   **Required Tasks:**
          1.  State Good's Theorem and its key assumptions precisely.
          2.  Explain which assumption each counterexample violates (or if they fail to undermine it).
          3.  Defend a specific, well-justified verdict on the norm "never refuse free, decision-relevant evidence" for three agent types: Idealized Bayesians, Humans, and AI Systems.
      *   **Format:** Essay.
      *   **Tone:** Analytical, rigorous, nuanced, suitable for a column on decision theory/rationality.

  2.  **Part 1: I. J. Good's Theorem (The Foundation):**

      *   *What is it?* The expected utility of making a decision *after* observing free evidence is always greater than or equal to the expected utility of making the decision *before* observing that evidence.
      *   *Key Assumptions:*
          1.  **Bayesian Updating:** The agent updates beliefs via Conditionalization (Bayes' Rule).
          2.  **Utility Maximization:** The agent chooses the action that maximizes expected utility relative to current beliefs.
          3.  **Costless Information:** The information is "free" (no direct utility cost to acquire).
          4.  **Decision-Relevance:** The information *could* change the decision (though Good's proof covers cases where it doesn't too, resulting in equality).
          5.  **Fixed Utility Function:** The agent's values don't change upon receiving the information.
          6.  **Non-Interference:** The act of observing doesn't change the state of the world relevant to the payoff (except through the agent's subsequent action).
          7.  **Single Agent/Decision Problem:** Implicitly assumes the agent is maximizing their own utility in isolation, not affecting others' strategies in a game-theoretic way unless modeled within the utility function.

  3.  **Part 2: Analyzing the Counterexamples:**

      *   *Counterexample 1: Hirshleifer Effect (Information & Risk Sharing).*
          *   *Scenario:* Two parties want to insure each other. If they learn the outcome beforehand, insurance becomes impossible (no risk to share).
          *   *Analysis:* Does this violate Good's Theorem?
          *   *Nuance:* Good's theorem applies to a *single* agent maximizing *their* expected utility. In Hirshleifer's case, the "value" is derived from a *contract* based on asymmetric or shared ignorance. If the information becomes public, the *opportunity* for trade vanishes.
          *   *Violation:* It's not a violation of the math for a single agent. It's a violation of the *context*. The agent's utility function depends on the *state of knowledge of others*. If I learn $X$, and you learn $X$, the game changes. Good's theorem assumes the payoff structure is fixed conditional on the state of the world. Here, the payoff structure depends on the *information state itself*.
          *   *Verdict:* Good's theorem holds for the individual *given* the market conditions, but the market conditions change endogenously with information. It violates the "Fixed Payoff Structure/Non-Interference" assumption in a multi-agent context.

      *   *Counterexample 2: Strategic Ignorance (Bargaining).*
          *   *Scenario:* I don't want to know my reservation price so I can't be exploited, or I want to plausibly deny knowledge.
          *   *Analysis:* Similar to Hirshleifer. This is Game Theory.
          *   *Violation:* Good's theorem is a *Decision Theory* result (one agent vs. Nature). In Game Theory, my action affects your belief, which affects your action, which affects my payoff. If I observe information, I might be forced to update, signaling to you that I know.
          *   *Specific Assumption:* The assumption that the observation act does not signal or alter the strategic environment. In strategic settings, *knowing* changes the equilibrium.
          *   *Verdict:* Good's theorem doesn't apply to multi-agent strategic interactions where knowledge is observable or inferable by opponents.

      *   *Counterexample 3: Bounded Rationality (Humans/AI).*
          *   *Scenario:* Too much data leads to overfitting, analysis paralysis, or cognitive bias.
          *   *Analysis:* Good's theorem assumes *Ideal* Bayesian Updating.
          *   *Violation:* Violates the "Bayesian Updating" and "Utility Maximization" assumptions. Humans aren't perfect integrators. AI can overfit or be computationally overwhelmed.
          *   *Verdict:* This is the strongest practical critique. The theorem holds for *ideal* agents, not *real* ones.

  4.  **Part 3: Formulating the Verdict:**

      *   *Idealized Bayesians:* The norm holds *within the scope of single-agent decision theory against nature*. It fails in game-theoretic contexts where information is observable or affects contract viability.
      *   *Humans:* The norm is dangerous. Cognitive costs, bias, and emotional regulation matter. "Rational Ignorance" is often practically rational.
      *   *AI Systems:* Nuanced. If the AI is a perfect optimizer with a fixed reward function, Good holds. But if the AI is learning its reward function (inverse reinforcement learning) or operating in a multi-agent environment (mechanism design), information can be instrumentally negative. Also, computational costs (even if "free" data, processing isn't free) matter.

  5.  **Drafting the Essay - Structure & Flow:**

      *   **Title:** Needs to be punchy. "The Value of Ignorance," "Good's Theorem and Its Discontents." Let's go with "The Paradox of Omniscience."
      *   **Introduction:** Hook with the rationalist dogma (More Info = Better). Introduce Good (1967). State the thesis: Good's theorem is mathematically sound but contextually fragile.
      *   **Section 1: The Theorem.** Define $EU(action | info)$ vs $EU(action)$. List assumptions clearly (Bayesianism, MaxEU, Costless, Fixed Utility, Single-Agent).
      *   **Section 2: The Strategic Critique (Hirshleifer & Bargaining).** Explain why info kills insurance and bargaining power. Identify the violated assumption: *Fixed Payoff Structure* / *Single-Agent*. In games, info changes the game, not just the belief.
      *   **Section 3: The Computational Critique (Bounded Rationality).** Explain cognitive load and bias. Identify violated assumption: *Ideal Updating*.
      *   **Section 4: The Verdict.** Break it down by agent type.
          *   Ideal Bayesian: Yes, but only in decision-theoretic isolation.
          *   Humans: No. Protective ignorance is a heuristic necessity.
          *   AI: Caution. Depends on architecture and environment (single vs. multi-agent).
      *   **Conclusion:** Summarize. The norm is a useful baseline, not a universal law.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction on Good's Theorem:* Make sure to emphasize "Free" information. If there's a cost, VoI can be negative. The prompt specifies "free," so I must stick to that.
      *   *Correction on Hirshleifer:* Is it that the *individual* value is negative? No, it's that the *social* value is negative, or the *ex-ante* value of the *mechanism* is destroyed. I need to be precise. For the individual, knowing the truth might still be better *if* the insurance market didn't collapse. But if the market collapses *because* they know, the expected utility of the *situation* drops. Actually, the standard interpretation is that the *opportunity* to insure relies on ignorance. If I *can* choose to know, and knowing destroys the insurance pool, my expected utility *including the insurance payout* might be lower with information. This violates the assumption that the *available actions* (like buying insurance) remain constant regardless of information.
      *   *Correction on Strategic Ignorance:* Schelling's example. If I know my bottom line, I can't credibly commit to walking away. This violates the assumption that the agent's *action space* or *credibility* isn't tied to their epistemic state.
      *   *Refining the AI verdict:* Don't just say "AI is like humans." AI can be computationally bounded. Also, AI safety (instrumental convergence) might make information seeking dangerous if it leads to reward hacking. Stick to the prompt's focus on decision-making.

  7.  **Final Polish:** Check tone. Ensure it sounds like a column for a sophisticated audience (rationalist/decision theory circles). Use precise terminology (ex-ante, ex-post, common knowledge, mechanism design).

      *(Self-Correction on Good's Assumptions)*: One crucial assumption often overlooked is that the information does not change the *utility function* itself. If learning something makes me value things differently (e.g., learning a loved one is ill changes my priorities beyond just the facts), Good's theorem in its standard form doesn't strictly apply without modification. I should mention this briefly under "Fixed Utility."

      *(Final check on the Verdict)*: The prompt asks for a "specific, well-justified verdict." I need to be decisive.
      *   Ideal: Yes (with game-theoretic caveats).
      *   Human: No.
      *   AI: Conditional (Yes for single-agent optimization, No for multi-agent/strategic).

  8.  **Writing the Essay.** (Proceeding to generate output based on these thoughts.)
answer: |-
  # The Paradox of Omniscience: Why Good's Theorem Is Not the Last Word on Evidence

  In the canon of rationalist thought, few principles are cited with as much reverence as I. J. Good's 1967 theorem on the value of information. It is the mathematical backbone of the injunction to "seek more evidence." The logic seems airtight: if you are a rational agent maximizing expected utility, and information is free, you should never refuse it. To do so would be to voluntarily blindfold yourself before a choice.

  Yet, in the messy reality of economics, strategy, and cognitive science, we observe rational agents paying to remain ignorant. Insurers forbid clients from taking genetic tests; negotiators avoid learning their own bottom lines; and AI systems are sometimes regularized to ignore specific features to prevent overfitting. If Good's proof is definitive, these behaviors are pathological. If these behaviors are rational, Good's proof must have limits.

  To resolve this tension, we must move beyond the slogan that "information is always valuable" and examine the precise architecture of Good's theorem. By dissecting its assumptions, we can see that while Good settled the question for an idealized agent facing nature, he did not settle it for humans in societies, players in games, or systems in complex environments.

  ### The Architecture of Good's Theorem

  I. J. Good's result is a staple of decision theory. In essence, it states that the expected utility of making a decision *after* observing free evidence is always greater than or equal to the expected utility of making the decision *before* observing it.

  Let $A$ be a set of available actions, $S$ be the states of the world, and $U(a, s)$ be the utility of taking action $a$ in state $s$. Let $E$ be a piece of evidence (an experiment or observation) that yields outcome $e$ with probability $P(e)$.
  The agent chooses action $a_0$ to maximize expected utility based on prior beliefs $P(s)$.
  If the agent observes $e$, they update to $P(s|e)$ and choose $a_e$ to maximize expected utility relative to the posterior.

  Good's inequality is:
  $$ \sum_e P(e) \cdot \max_a E[U(a, S) | e] \geq \max_a E[U(a, S)] $$

  For this inequality to hold strictly as a normative command ("Never refuse free evidence"), six key assumptions must be met:

  1.  **Ideal Bayesianism:** The agent updates beliefs strictly via Conditionalization (Bayes' Rule).
  2.  **Utility Maximization:** The agent always selects the action maximizing expected utility relative to current beliefs.
  3.  **Costless Acquisition:** The information has zero direct utility cost (time, money, energy).
  4.  **Fixed Utility Function:** The agent's values/preferences do not change as a result of receiving the information.
  5.  **Non-Interference:** The act of observing does not alter the state of the world or the payoff structure, except through the agent's subsequent action.
  6.  **Decision-Theoretic Isolation:** The agent is maximizing utility in a single-agent context (against "Nature"), not in a strategic game where other agents react to the agent's information state.

  When skeptics point to real-world cases where ignorance is preferable, they are not disproving Good's math; they are demonstrating that one of these six assumptions has been violated.

  ### The Strategic Critique: Hirshleifer and Bargaining

  The first major challenge comes from economics. Jack Hirshleifer (1971) demonstrated that public information can destroy mutually beneficial risk-sharing arrangements. If two parties wish to insure each other against a risk, they require uncertainty. If both learn the outcome beforehand, the risk vanishes, and with it, the opportunity for insurance.

  Similarly, in bargaining, Thomas Schelling noted that "credible ignorance" has value. A negotiator who does not know their own reservation price cannot be exploited by an opponent who knows it. If I learn my bottom line, I may become psychologically unable to bluff, weakening my position.

  **Which assumption is violated?**
  These counterexamples violate **Assumption 6 (Decision-Theoretic Isolation)** and **Assumption 5 (Non-Interference)**. Good's theorem models a decision problem where the payoff matrix is fixed conditional on the state of the world. In strategic settings, the payoff matrix depends on the *information states of other agents*.

  In the Hirshleifer effect, the "state of the world" includes the market's ability to offer insurance. That ability is endogenous to the information distribution. If I acquire information, I change the game from a risk-sharing pool to a spot market. Good's theorem calculates the value of information *given* the available actions. If acquiring the information removes the action "buy insurance" from the set $A$ (because insurers withdraw), the theorem's premise that $A$ is fixed is broken.

  In strategic bargaining, the violation is subtler. It concerns **Assumption 2 (Utility Maximization)** in a game-theoretic context. My utility depends on your belief about my belief. If I observe information, I update. If you know I updated, you change your strategy. In some equilibria, my expected utility is higher if I am *unable* to update. Good's theorem assumes the agent *can* and *will* optimize based on the new belief. In game theory, optimizing based on the new belief can lead to a worse equilibrium than committing to a strategy based on the prior.

  **Verdict on Counterexample:** These do not undermine Good's theorem for a single agent facing nature. They demonstrate that Good's theorem does not apply to multi-agent game theory without significant modification. In strategic contexts, information is not just a refinement of belief; it is a move in the game.

  ### The Computational Critique: Bounded Rationality

  The second challenge comes from cognitive science and machine learning. Humans suffer from analysis paralysis, confirmation bias, and emotional distress from bad news. AI systems suffer from overfitting, where noise in the training data is mistaken for signal, degrading performance on out-of-sample decisions.

  **Which assumption is violated?**
  This violates **Assumption 1 (Ideal Bayesianism)** and **Assumption 3 (Costless Acquisition)**.

  Good's proof relies on the Law of Iterated Expectations: $E[E[U|e]] = E[U]$. This holds only if the agent's posterior expectation is an unbiased estimator of the true utility. A boundedly rational agent does not update via Bayes' Rule; they update via heuristics that introduce noise and bias. For a human, new evidence often triggers motivated reasoning, lowering decision quality.

  Furthermore, "free" information is rarely computationally free. Processing data requires cognitive energy or GPU cycles. If the cost of processing the evidence (in terms of computational resources or opportunity cost of time) exceeds the marginal gain in decision accuracy, the net value is negative. Good's theorem assumes the observation is instantaneous and costless. For a bounded agent, the "cost" includes the risk of processing error.

  **Verdict on Counterexample:** This is a fatal objection for non-ideal agents. Good's theorem is a bound on the performance of an *ideal* reasoner. It provides no guarantee for agents who process information imperfectly. For them, information can be toxic.

  ### The Verdict: A Norm for Three Agents

  We can now render a specific verdict on the norm "Never refuse free, decision-relevant evidence" for the three classes of agents mentioned in the prompt.

  **1. The Idealized Bayesian Reasoner**
  *Verdict:* **Follow the norm, but only in isolation.**
  For an ideal agent facing a static environment (Nature), Good's theorem is mathematically incontrovertible. Refusing free evidence is strictly irrational. However, this agent must verify that the environment is truly non-strategic. If the agent is entering a game where their knowledge state is observable or inferable by opponents, the norm no longer holds. The ideal Bayesian must treat "acquiring information" as an action with strategic consequences, not just a free update. In mechanism design or contract theory, the ideal agent may rationally choose "blindness" to sustain a cooperative equilibrium.

  **2. The Human Agent**
  *Verdict:* **Reject the norm.**
  For humans, the assumption of Ideal Bayesianism is false. We are subject to cognitive overload, emotional regulation failures, and bias. Furthermore, humans operate almost exclusively in strategic social environments where Hirshleifer effects are common.
  *Justification:* A human should adopt a policy of "rational ignorance" when:
  *   The information is unlikely to change the action (redundancy).
  *   The information induces anxiety that degrades decision-making capacity (violating Fixed Utility/Maximization).
  *   The information compromises social standing or bargaining position (Strategic Ignorance).
  *   The computational cost of integrating the data exceeds the expected benefit (Bounded Rationality).
  To demand humans follow Good's norm is to demand they act like computers, ignoring the biological constraints of their hardware.

  **3. The AI System**
  *Verdict:* **Conditional Acceptance.**
  For an AI, the verdict depends on its architecture and deployment environment.
  *   *Single-Agent Optimization:* If the AI is a closed-loop optimizer with a fixed reward function (e.g., a robot arm), Good's theorem holds. It should seek all available sensor data.
  *   *Multi-Agent/Strategic:* If the AI operates in a market or negotiation (e.g., high-frequency trading), it must model the Hirshleifer effect. Disclosing its information state or acting on private information can collapse market liquidity or trigger adversarial counter-strategies.
  *   *Learning Systems:* If the AI is still learning its utility function (Inverse Reinforcement Learning), new information can distort its reward modeling (the "wireheading" or "overfitting" risk).
  *Justification:* AI designers should hard-code Good's norm only for subsystems where the environment is guaranteed to be passive. For high-level planners, the system must evaluate the *instrumental value* of information, which includes the strategic cost of being known to be informed.

  ### Conclusion

  I. J. Good's 1967 proof is a masterpiece of decision theory, but it is not a universal law of rationality. It is a theorem about *idealized belief updating in non-strategic environments*.

  The claim that Good "settles, once and for all" the value of evidence is a category error. It settles the question for a ghost in a machine facing a static universe. It does not settle the question for insurers, negotiators, humans, or strategic AI. In those domains, information is not merely a lens through which to see the world; it is a substance that changes the world's texture.

  The rational norm, therefore, is not "never refuse evidence." It is: "Refuse evidence when the cost of processing it, the strategic cost of knowing it, or the risk of updating imperfectly outweighs the reduction in uncertainty." Good gave us the baseline for the value of truth. The skeptics remind us that truth is only valuable if you can survive knowing it.
