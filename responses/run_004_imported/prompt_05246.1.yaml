      *   *Strawman Check:* Is it a strawman to say OR is *just* a tie-breaker? Yes, slightly. Many philosophers (e.g., Bayesian epistemologists) already view OR as a prior probability assignment. However, the *popular* framing (which the user mentions) often treats it as a metaphysical principle or a heuristic for theory choice when data underdetermines.
      *   *Refinement:* The user should acknowledge that Bayesian interpretations of OR exist but argue that SI makes the *quantitative* nature of that trade-off explicit and derived from computation theory rather than assumed as a prior intuition. The shift is from "prefer simpler" to "prefer simpler *by exactly this amount*."
