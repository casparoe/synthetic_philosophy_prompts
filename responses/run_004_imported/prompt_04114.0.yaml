      *   What is missing? Both focus on the *psychological/epistemological* state of the liars (did they know? were they self-deceived?).
      *   Arendt's core concern in "Truth and Politics" is the *public realm* and the *right to facts*. The issue isn't just what's in the officials' heads, but the destruction of the "common world."
