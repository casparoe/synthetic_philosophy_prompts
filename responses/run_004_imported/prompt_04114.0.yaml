      *   *Modern Liar (Image-Maker/Problem-Solver):* Often discussed in the context of the Pentagon Papers and the "defense intellectuals."
      *   *Self-Deception:* Arendt discusses this in "Lying in Politics." She notes that while self-deception happens, it is *not* a satisfactory explanation for the systematic lying of the Pentagon Papers era. Why? Because the liars knew the facts but chose to ignore them in favor of "consistency" or "theory."
      *   *Defactualization:* The process where facts lose their stability.
      *   *Problem-Solvers:* Arendt specifically critiques the "problem-solvers" (like McNamara's whiz kids). They rely on models, statistics, and internal consistency rather than factual reality. They "did not judge, they calculated."
      *   *Crucial Point:* Arendt argues that these officials *were* lying, but it was a specific *kind* of lying that didn't require the traditional psychological state of "knowing I am lying." However, she *rejects* the idea that they were merely self-deceived innocents. She holds them responsible. The danger is that they replace reality with a "fake reality" created by models/theory.
      *   *Truth vs. Opinion:* Arendt distinguishes between rational truth (facts/science) and political truth. The attack on factual truth is more dangerous than the attack on opinion.

