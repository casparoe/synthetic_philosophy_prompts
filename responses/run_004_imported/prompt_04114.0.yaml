          *   *Arendt Check:* This is very strong Arendt. "They did not judge, they calculated" is a core theme. The closure of the system (model) against external reality is the definition of the modern political lie's danger. It's not about the upstream input as much as the systemic inability to process contradictory facts.
          *   *Score:* 2. Very accurate to Arendt's critique of the "defense intellectuals" and the nature of "image-making" where the image replaces reality.
      *   **Move 5 (Owen):** Closing: Makes the category unfalsifiable. Lets officials retreat into "we were defactualized, not lying." Worries about accountability.
          *   *Arendt Check:* Owen raises a valid *political* concern (accountability), but he misreads Arendt's *philosophical* point. Arendt does *not* let them off the hook. She argues this new form of lying is *more* dangerous and requires *more* vigilance, not less. She doesn't offer it as an excuse for the liars, but as a warning for the public. Owen thinks classifying it as "defactualization" absolves them; Arendt thinks classifying it as such indicts the modern condition more severely.
