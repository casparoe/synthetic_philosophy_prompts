answer: |-
  **Setting:** *A quiet corner of the university faculty lounge. Rain taps against the window. Two old colleagues, DAN (68, evolutionary psychologist leanings, staunch adaptationist) and ELENA (67, comparative anatomist, Gouldian pluralist), are finishing a pot of coffee.*

  **DAN:** You know, I read that paper you sent over. The one on motion sickness. Treisman, 1977. It's elegant. I'll give you that. The idea that the vestibular system and the visual system disagree, the brain panics, assumes you've ingested a neurotoxin, and triggers the emetic reflex. It solves the "why" of the vomit. But you're using it to argue for spandrels, Elena. I think you're misreading the architecture.

  **ELENA:** Am I? It seems like the textbook definition. The adaptation is the poison-detection system. That saves your life. Motion sickness is the architectural byproduct of that system operating in an environment it never evolved to handle—cars, boats, rollercoasters. It's the acoustic echo in the San Marco cathedral. Beautiful, but not built for the music.

  **DAN:** But here's where the spandrel analogy cracks. A spandrel is structurally necessary but functionally neutral. Motion sickness isn't neutral. It's debilitating. It stops you from hunting, from fleeing, from caring for kin. If it were merely a harmless byproduct, fine. But it's a *costly* error. Natural selection is a ruthless accountant. If this mismatch is costing fitness, selection should have worked to decouple the sensory conflict from the vomit reflex. The fact that it hasn't suggests there's a hidden ledger entry we're missing.

  **ELENA:** Oh, Dan, the "hidden function" argument. The refuge of the adaptationist when the data gets thin. You're assuming selection can easily decouple them. What if the wiring is too deep? What if the neural pathways for toxin detection and motion processing are phylogenetically fused? You can't select against motion sickness without risking the sensitivity of the poison detector. It's a false-positive problem. In the wild, a false negative (not vomiting when poisoned) kills you. A false positive (vomiting on a boat) just makes you miserable for an afternoon. Selection tolerates the noise to ensure the signal gets through.

  **DAN:** Tolerates, sure. But thirty-five years in the field should tell you that "tolerates" has limits. If motion sickness were purely a glitch, we'd see massive variance in susceptibility based on ecological niche. We don't. It's nearly universal across mammals. That universality screams "conserved function." Maybe the incapacitation *is* the function. If your sensory inputs are scrambled, you're disoriented. A disoriented predator gets killed. Maybe the nausea forces immobility. It locks you down until the calibration resets.

  **ELENA:** That is a classic just-so story. "It forces immobility." Does it? Or does it just make you weak? There's a difference. And if it were an adaptation for immobility, why is the mechanism so blunt? Why not just induce sleep? Why the visceral distress? The distress is the signature of the poison pathway. You're trying to retrofit a function onto a mechanism that clearly evolved for something else. Treisman showed the mechanism *is* poison detection. You're arguing that the glitch became a feature. That's exaptation, not original adaptation.

  **DAN:** Exaptation is still adaptive work! Gould loved to drive a wedge between origin and utility, but utility is where the rubber meets the road. Even if Treisman is right about the origin—that the system was built for toxins—if the nausea prevents you from wandering off a cliff while disoriented, it's being maintained by selection *now*. That makes it an adaptation in the functional sense. Why does it matter if it started as a bug if it's been patched into a feature?

  **ELENA:** Because it changes how we investigate it! If you assume it's a feature, you look for the benefit. You waste decades trying to find the fitness advantage of vomiting on a cruise ship. If you assume it's a spandrel—a necessary cost of a sensitive poison detector—you look at the constraints. You look at the neurology. You ask why the system *can't* be tuned differently. You're obsessed with the "why" of benefit. I'm interested in the "how" of constraint.

  **DAN:** But how do you prove the negative, Elena? That's the epistemological wall we keep hitting. How do you demonstrate something is *not* adaptive? You can say "it's a byproduct," but that's unfalsifiable. I can always posit a benefit you haven't thought of yet. But you can posit a constraint that doesn't exist. To me, the null hypothesis must be adaptation. If a trait is complex, costly, and universal, the burden of proof is on the person claiming it's useless.

  **ELENA:** The null hypothesis *should* be history. We don't get to rerun evolution. We can't strip away the motion sickness and see if the organism fails. That's the problem with your "ruthless accountant." Evolution is a tinkerer, not an engineer. It works with what it has. Maybe the genetic variation to separate visual-vestibular conflict from the emetic center simply never arose. Or maybe it's linked to a gene that does something vital elsewhere. Pleiotropy. If you select against motion sickness, maybe you lose memory consolidation. How would you know?

  **DAN:** Comparative phylogeny. That's how we know. We look at the clades. Do animals that don't vomit get motion sick? Fish generally don't vomit. Do they get sea sick? Some sharks do, interestingly, but the mechanism differs. If we map the trait onto the phylogeny and see it correlates perfectly with the presence of a specific emetic reflex, regardless of the environment, that supports your constraint argument. But if we see species losing the sickness when they enter environments with high motion but low toxin risk, that supports my adaptation argument. We *can* check the history.

  **ELENA:** You can check the correlation, not the causation. You see a trait persist. You assume it's because it was selected *for*. I see a trait persist and assume it's because it was dragged along by something else that was selected for. Take the human chin. No function. Just structural fallout from jaw reduction. Motion sickness could be the chin of the vestibular system. The fact that we can't find a clean ecological gradient for susceptibility suggests to me that there's no selection pressure acting on it. It's just... there.

  **DAN:** But the chin doesn't cost energy. Motion sickness does. Dehydration, electrolyte loss, vulnerability. The cost is too high for it to be just structural fallout. Unless... and hear me out... unless the cost of *fixing* it is higher. That brings me back to the false-positive rate. If the brain lowers the threshold for sensory conflict to stop motion sickness, it risks missing a real toxin. The "sickness" is the price of admission for a sensitive alarm system. It's not a spandrel; it's the alarm bell ringing when there's no fire. You don't say the alarm bell is a spandrel because it sometimes goes off when you burn toast.

  **ELENA:** But the alarm bell wasn't *designed* to ring for toast. That's the point! You're conflating "current utility" with "historical reason." Gould and Lewontin didn't say spandrels have *no* use. You can hang a picture on a spandrel. They said the spandrel wasn't created *for* that use. Treisman's hypothesis says motion sickness wasn't created for motion. It was created for toxins. The fact that you can spin a story about "forced immobility" doesn't change the evolutionary origin. And if we treat it as an adaptation, we stop asking about the neurological constraints that make it unavoidable.

  **DAN:** I'm not spinning a story. I'm asking about maintenance. Evolution isn't just about origin; it's about retention. If it were truly maladaptive noise, and if there were genetic variance—and there always is—selection should have dampened it over 200 million years of mammalian evolution. The fact that it persists suggests the "noise" is either impossible to filter without breaking the receiver, or the noise *is* the signal for something else. I'm willing to bet on the latter.

  **ELENA:** And I'm willing to bet that you're underestimating the power of phylogenetic inertia. We assume selection is omnipotent. It's not. It's local. It's slow. Maybe motion sickness is just a shadow cast by a complex system. The harder question, Dan, isn't whether it's a spandrel or an adaptation. It's whether we can ever distinguish a trait that selection *tolerates* from a trait selection *maintains*.

  **DAN:** We distinguish it by looking for design specificity. Does the sickness scale with the danger? Does it kick in faster when the conflict is more ambiguous? If we find fine-tuning, it's adaptation. If it's a blunt, all-or-nothing hammer, it's likely a byproduct.

  **ELENA:** Fine. But who defines "fine-tuning"? You'll find a pattern and call it design. I'll find the same pattern and call it a physiological constraint. We're staring at the same fossil, Dan. You see the skeleton of a function; I see the cast of a history.

  **DAN:** *(Sips cold coffee)* Well, until we can edit the vestibular genes of a mouse and see if it survives better in a spinning cage without vomiting, we're both just telling stories.

  **ELENA:** Exactly. But your story assumes the world is optimized. Mine assumes the world is contingent. I know which one I'd bet on after thirty-five years in the field.

  **DAN:** And I know which one I'd bet on after thirty-five years of seeing how perfectly things fit their niches. Pass the sugar?

  **ELENA:** *(Slides the bowl over)* Only if you admit the chin is a spandrel.

  **DAN:** Don't push your luck.
