prompt: |-
  I'm on the code-of-conduct committee for an open source project I contribute to (a couple hundred contributors, all volunteer-run). We've got a case that's split the committee and I need to draft the recommendation memo before Friday's call.

  One of our most active reviewers -- call him Dave -- has a history of brutal review comments (nothing threatening, just stuff like telling a first-timer their PR was "worse than the bug it fixed"), and a couple of quiet warnings already. This time the contributor quit and posted about it publicly, so now there's an actual formal complaint. The wrinkle: Dave disclosed he was diagnosed with autism last year and says it explains a lot of this -- he genuinely doesnt clock how a comment will land until its pointed out, and he's now in therapy about it. Half the committee wants to go easy on him because of this. The other half says that's backwards: if he genuinely can't self-monitor, that's exactly why he should be pulled off public review for good, not as punishment, just bc we can't keep losing contributors, however sympathetic the reason.

  Can you draft the actual memo? I need a real recommendation with concrete next steps and a timeline, not a "both sides have a point" cop-out -- and don't just paint the second camp as heartless, I think they're onto something too.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Open source project (200+ contributors, volunteer-run), Code of Conduct (CoC) committee.
      *   **Issue:** Active reviewer ("Dave") has a history of harsh/brutal reviews. A contributor quit and posted publicly after a recent incident. Formal complaint filed.
      *   **Complication:** Dave disclosed an autism diagnosis, claiming it explains his lack of social awareness regarding comment tone. He is in therapy.
      *   **Committee Split:**
          *   Side A: Accommodate Dave due to disability/health (go easy).
          *   Side B: Protect the community/contributors (if he can't self-monitor, he shouldn't be in public-facing roles, regardless of intent).
      *   **Task:** Draft a recommendation memo for the committee call (due Friday).
      *   **Requirements:** Real recommendation, concrete next steps, timeline. No fence-sitting ("both sides have a point"). Acknowledge validity of both perspectives without painting Side B as heartless.

  2.  **Determine the Stance/Recommendation:**
      *   *Constraint:* I cannot make the decision for them, but the prompt asks me to "draft the actual memo" with a "real recommendation." I need to choose a path that balances legal/ethical obligations (disability accommodation) with community health (retention/safety).
      *   *Ethical/Legal Consideration:* In many jurisdictions, demanding someone "fix" a disability to participate is discriminatory. However, volunteer organizations also have the right to set behavioral standards for roles. The key is *accommodation* vs. *lowering standards*.
      *   *Best Path:* The "Side B" argument is practically stronger for community health, but "Side A" is legally/ethically necessary to address. The solution isn't "ban Dave" vs. "let Dave be mean." The solution is *role modification*. Dave can contribute, but perhaps not in a high-friction, public-facing gatekeeper role *until* he demonstrates consistent improvement. This validates Side B's concern (protecting newcomers) while validating Side A's concern (not excluding Dave based on diagnosis).
      *   *Decision:* Temporary suspension from public code review duties, contingent on a remediation plan. This prioritizes community safety (the primary function of CoC) while offering a path back (accommodation).

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The bottom line up front.
      *   **Context/Background:** Brief recap of the incident and history.
      *   **Analysis of Competing Interests:** Acknowledge the split (Disability Accommodation vs. Community Impact).
      *   **Recommendation:** The specific action.
      *   **Implementation Plan/Timeline:** Concrete steps.
      *   **Communication Strategy:** How to tell Dave and the public.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Subject:* Needs to be clear. "Recommendation regarding Case #XYZ (Reviewer Conduct)."
      *   *Executive Summary:* State the recommendation clearly. Temporary removal from review queue + support plan.
      *   *Background:* Keep it factual. History of warnings, recent incident, public fallout, disclosure of diagnosis.
      *   *Committee Considerations:* This is crucial. I need to articulate *why* the committee is split without taking sides yet.
          *   *Perspective 1 (Accommodation):* Neurodiversity, intent vs. impact, medical privacy.
          *   *Perspective 2 (Community Health):* Retention, psychological safety, precedent, volunteer burnout.
          *   *Synthesis:* The CoC protects the *community*, not just the accused. Accommodation doesn't mean unchecked behavior.
      *   *Recommendation:* This is the "no cop-out" part.
          *   Action: Step back from public reviews immediately.
          *   Reasoning: It's not punishment; it's risk mitigation.
          *   Path Forward: Mentorship, private reviews, re-evaluation.
      *   *Timeline:* Specific dates (e.g., immediate, 30 days, 90 days).
      *   *Communication:* Drafting the message to Dave (empathetic but firm) and the public (vague but reassuring).

  5.  **Refining the Tone:**
      *   *Professional:* It's an internal committee memo.
      *   *Empathetic:* Acknowledge Dave's contribution and health.
      *   *Firm:* Prioritize the project's sustainability.
      *   *Nuanced:* Avoid ableist language (don't say "autism makes him mean") but also avoid dismissing the harm caused. Focus on *impact* over *intent*.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is removing him from reviews discriminatory?
      *   *Fix:* Frame it as a temporary safety measure while accommodations are explored, similar to how a driver with a medical condition might be restricted until cleared. Emphasize the *volunteer* nature of the role; it's not employment law, but ethical standards apply.
      *   *Critique:* Did I paint Side B as heartless?
      *   *Fix:* Explicitly state that Side B's concern about contributor retention is valid and central to the project's mission.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Make it phased. Immediate pause, 30-day check-in, 90-day decision.

  7.  **Final Polish:** Check against the prompt's constraints.
      *   Real recommendation? Yes (Temporary suspension from review).
      *   Concrete next steps? Yes.
      *   Timeline? Yes.
      *   No cop-out? Yes.
      *   Respectful to both sides? Yes.

  8.  *(Final thought)*: Ensure the distinction between "punishment" and "role adjustment" is clear. This is the linchpin that satisfies both camps.

  **(Self-Correction Note):** I need to be careful not to give legal advice. I will frame this as a CoC committee recommendation based on community standards, not employment law.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Code of Conduct Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-14 (Reviewer Conduct & Accommodation)

  ### Executive Summary

  This memo outlines the Committee's findings regarding the formal complaint against contributor "Dave" and provides a binding recommendation for resolution.

  **Recommendation:** Dave is to be temporarily suspended from public code review duties for a period of 90 days, effective immediately. During this period, he will retain commit access but will engage in a structured remediation plan focused on communication standards. Reinstatement to public review duties is contingent upon successful completion of this plan and a final Committee vote.

  This decision prioritizes the psychological safety and retention of new contributors (aligning with the CoC's primary purpose) while providing a structured path for Dave to continue contributing in a capacity that mitigates risk (aligning with our commitment to inclusivity and accommodation).

  ### Background

  *   **Incident:** On October 10, a first-time contributor abandoned the project following a code review by Dave, subsequently posting about the interaction on social media.
  *   **History:** Dave has received two prior informal warnings regarding the tone of his reviews (e.g., comments characterized as "brutal" or demeaning, though not threatening).
  *   **Mitigating Disclosure:** Following the complaint, Dave disclosed an autism diagnosis. He states this impacts his ability to intuitively gauge the tone of written text and confirms he is currently seeking therapy to address this.
  *   **Committee Split:** The Committee is divided between those advocating for medical accommodation and those advocating for immediate role restriction to protect community health.

  ### Analysis of Competing Interests

  The Committee's division stems from two valid, competing obligations under our Code of Conduct and project values.

  **1. The Obligation to Accommodate (Side A)**
  We are a volunteer community that values diversity, including neurodiversity. Dave's disclosure indicates that his intent is not to harm, but that his mechanism for social feedback differs from the norm. Excluding him entirely based on a disability diagnosis sets a dangerous precedent and contradicts our values of inclusivity. We must avoid penalizing him for symptoms of a condition he is actively managing.

  **2. The Obligation to Protect Community Health (Side B)**
  Our project relies on a steady influx of new contributors. The CoC exists to ensure participants feel safe. As noted by the second half of the Committee, impact outweighs intent. If a reviewer cannot reliably self-monitor tone, placing them in a high-friction, public-facing gatekeeper role creates systemic risk. Accommodation cannot come at the cost of driving away other volunteers. As Side B argued, if the "tool" (the reviewer) damages the "material" (the contributors) regardless of intent, the tool must be set down until it is safe to use.

  **Synthesis**
  Accommodation does not require us to maintain a contributor in a role they are currently unfit to perform safely. We can accommodate Dave's participation in the project without accommodating the specific behavior that violates the CoC. The solution is not "punish vs. pardon," but "role adjustment."

  ### Recommendation & Action Plan

  **1. Immediate Action (Within 24 Hours)**
  *   **Role Adjustment:** Dave will be temporarily removed from the "Reviewer" rotation in our issue tracker. He retains "Contributor" status and can submit code, but will not be assigned new PRs for review.
  *   **Notification:** The Committee Chair will meet with Dave to explain this decision.
      *   *Key Message:* This is not a ban. It is a safety pause. We value his technical contributions, but the public review role requires a specific set of communication skills that are currently causing measurable harm to the project.
      *   *Support:* We acknowledge his diagnosis and support his therapy. This pause is intended to reduce pressure on him while he develops new coping strategies.

  **2. Remediation Period (Days 1–90)**
  *   **Mentorship:** Dave will be paired with a senior maintainer (voluntary basis) to co-review 5–10 PRs in a private channel. The mentor will provide feedback specifically on tone and phrasing before any comments are posted.
  *   **Documentation:** Dave is asked to utilize a "Tone Checklist" (to be provided by the Committee) before submitting feedback.
  *   **Privacy:** Dave's medical diagnosis remains confidential. The public explanation will focus on "conduct alignment," not health.

  **3. Re-evaluation (Day 90)**
  *   The Committee will review the co-reviewed PRs.
  *   **Criteria for Reinstatement:** Evidence of consistent tone adjustment and no further complaints.
  *   **Criteria for Permanent Restriction:** If the behavior persists, Dave will be permanently restricted from code review duties but welcomed to continue as a code contributor. This is not a punishment, but a permanent role alignment based on demonstrated capability.

  ### Communication Strategy

  **To Dave (Private)**
  > "We value your technical contributions and accept your disclosure. However, the impact on contributors remains the same regardless of intent. To keep you on the team without violating the CoC, we need to pause your review duties. We want to work with you over the next 90 days to see if we can find a workflow that works for you and the community."

  **To the Public (If required/asked)**
  > "We are aware of recent discussions regarding contributor interactions. We take all Code of Conduct complaints seriously. We have addressed the specific incident with the individuals involved and are implementing new reviewer training to ensure a welcoming environment for first-time contributors."
  > *(Note: Do not disclose Dave's diagnosis or specific disciplinary action publicly.)*

  ### Timeline

  *   **Friday (Committee Call):** Vote to adopt this recommendation.
  *   **Monday:** Chair meets with Dave. Reviewer permissions adjusted.
  *   **Week 3:** First check-in with assigned mentor.
  *   **Day 90 (Jan 24):** Final Committee review and vote on reinstatement.

  ### Conclusion

  This recommendation rejects the false choice between "exclusion" and "unchecked behavior." It acknowledges that while Dave's condition explains the behavior, it does not excuse the impact. By temporarily shifting his role, we protect the contributor pipeline (validating Side B) while offering Dave support and a path to remain in the project (validating Side A).

  Please review this draft prior to Friday's call. I move we adopt this framework as the Committee's official position.
