prompt: |-
  I'm working on a piece about the philosophical roots of AI alignment ideas, and I've been down a rabbit hole reading old Yudkowsky essays on coherent extrapolated volition (CEV) -- the idea that a friendly superintelligence should act on what humanity would want if we knew more, thought faster, and were more the people we wish we were, extrapolated out to wherever those wishes converge. Struck me that this sounds a lot like the "idealized preference" or "informed desire" theories of well-being that philosphers like Peter Railton proposed decades earlier, where your good is defined by what a fully-informed, maximally vivid, idealized version of you would want for your actual, non-idealized self. Can you compare CEV to Railton-style idealized preference theories? Where do the two actually line up, and where does CEV's move from one person's idealized preferences to a *coherent* extrapolation across all of humanity create headaches that Railton's framework never had to deal with?
reasoning: |-
  Here's a thinking process that leads to the comparison between CEV and Railton's Idealized Preference Theory:

  1.  **Deconstruct the Request:**
      *   **Topic:** Philosophical roots of AI alignment, specifically Coherent Extrapolated Volition (CEV).
      *   **Comparison:** CEV (Eliezer Yudkowsky) vs. Idealized Preference/Informed Desire Theories of Well-being (Peter Railton).
      *   **Key Question 1:** Where do they line up? (Similarities).
      *   **Key Question 2:** Where does CEV create headaches Railton's didn't? (Specifically the move from individual to collective/coherent extrapolation).
      *   **Tone:** Analytical, philosophical, knowledgeable about both AI safety literature and meta-ethics.

  2.  **Analyze the Core Concepts:**
      *   **CEV (Yudkowsky):** "Our wish if we knew more, thought faster, were more the people we wish we were, extrapolated out to wherever those wishes converge." It's a proposal for *what an AI should optimize for*. It's dynamic, collective, and aims for convergence.
      *   **Railton's Idealized Preference Theory (Factual Reductionism):** An individual's good is what they would want for their actual self if they were fully informed and rational (the "idealized self"). It's a theory of *well-being* (prudential value), not necessarily a direct action guide for a superagent, though it implies one. It's individualistic.

  3.  **Identify Similarities (The Line-Up):**
      *   **Counterfactual Idealization:** Both rely on a counterfactual version of the agent (more knowledge, better reasoning, removed cognitive biases).
      *   **Rejection of Subjectivism:** Both reject "current actual desire" satisfaction (e.g., I want to smoke, but it's bad for me). They distinguish between *felt* desire and *normative* desire.
      *   **Objectivity via Subjectivity:** Both try to ground value in human psychology but make it objective through the idealization process (it's not just what I want, it's what I *should* want given full information).
      *   **The "Advice" Model:** Railton explicitly frames the idealized self as giving advice to the actual self. CEV frames the extrapolated volition as the command given to the AI.

  4.  **Identify Differences/Headaches (The Divergence):**
      *   **Scope (Individual vs. Collective):** Railton is about *my* good. CEV is about *humanity's* good.
      *   **Convergence vs. Aggregation:** Railton doesn't need my idealized preferences to match yours. CEV *needs* convergence ("extrapolated out to wherever those wishes converge"). If they diverge, CEV risks failure or tyranny.
      *   **Dynamic vs. Static:** Railton's theory is a static analysis of well-being. CEV is a dynamic process (the AI helps us become the people who want the things).
      *   **The "Coherence" Problem:** This is the big one. Railton accepts pluralism. If Idealized-Alice wants X and Idealized-Bob wants Y, they both flourish. If CEV-Alice and CEV-Bob want incompatible things, the AI faces a moral dilemma or a technical impossibility.
      *   **Meta-Ethical Commitment:** Railton is a naturalist/reductionist about *good*. Yudkowsky is often agnostic or pragmatic about *right*, focusing on *safe optimization targets*. CEV is an engineering specification, Railton is a philosophical account.

  5.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Acknowledge the insight. It's a sharp observation. Define both briefly.
      *   **The Core Resonance (Where they line up):**
          *   The "Full Information" criterion.
          *   Correcting for cognitive biases (akrasia, myopia).
          *   The distinction between "wanting" and "good."
      *   **The Divergence (The Headaches):**
          *   *The Aggregation Problem:* Railton = Sum of individual goods. CEV = Single coherent function.
          *   *The Convergence Assumption:* Yudkowsky hopes preferences converge. Railton doesn't care. What if they don't? (The "Fragility of Convergence").
          *   *Identity and Transformation:* Railton's idealized self is still *you*. CEV's extrapolation might change you so much you're unrecognizable (The "Who is speaking?" problem).
          *   *Lock-in vs. Ongoing Process:* CEV risks locking in a specific extrapolation. Railton allows for evolving ideals.
      *   **Philosophical Implications:**
          *   Meta-ethics (Realism vs. Constructivism).
          *   The "Moral Parliament" vs. "Single Utility Function."
      *   **Conclusion:** Summarize the trade-off. CEV adds the engineering constraint of *actionability* for a singleton, which breaks the comfort of individual ethical theory.

  6.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to paint Railton as *only* about well-being. His "Social Rationality" work touches on collective action, but the prompt specifically asks about his idealized preference theory of well-being. Stick to that comparison.
      *   *Nuance on Convergence:* Yudkowsky knows convergence isn't guaranteed. That's why it's "Coherent *Extrapolated* Volition," implying a process to find coherence. But the *risk* of non-convergence is the headache.
      *   *Nuance on "More the people we wish we were":* This adds a moral growth component Railton doesn't explicitly emphasize in the same way. Railton focuses on information and rationality; CEV focuses on moral maturation too.

  7.  **Final Polish:** Check tone. Ensure it sounds like a dialogue between someone who knows the material and an expert assistant. Use specific terminology (e.g., "Factual Reductionism," "Singleton," "Utility Function").

      *(Self-Correction during drafting)*: I should mention that Railton's theory is often called "Factual Reductionism." I should also mention that CEV is essentially trying to solve the "Value Loading" problem using a philosophical shortcut.

      *Key Headache to highlight:* The "Interpersonal Comparison of Utility" problem. Railton sidesteps this by focusing on individual welfare. CEV crashes right into it because it needs to sum/merge utilities.

  8.  **Final Review against Prompt:**
      *   Compare CEV to Railton? Yes.
      *   Where do they line up? Yes.
      *   Where does CEV create headaches (individual -> collective/coherent)? Yes.

