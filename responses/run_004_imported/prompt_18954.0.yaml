answer: |-
  This is a sharp observation. You have correctly identified that Coherent Extrapolated Volition (CEV) is, in many respects, an engineering specification built directly atop the scaffolding of 20th-century meta-ethical naturalism, specifically the "idealized preference" or "full-information" accounts of well-being championed by Peter Railton (and others like Richard Brandt or David Sobel).

  Yudkowsky has explicitly acknowledged this lineage, noting that CEV is essentially an attempt to solve the "value loading" problem by outsourcing the definition of "good" to a counterfactual process rather than hard-coding moral rules.

  Here is a breakdown of where CEV and Railton-style Factual Reductionism align, and where the move from individual well-being to singleton alignment creates profound philosophical and technical headaches that Railton's framework conveniently sidesteps.

  ### 1. The Resonance: Where They Line Up

  At the structural level, CEV and Railton's theory of "Factual Reductionism" share the same DNA. They both reject **Actual Desire Satisfactionism** (the idea that your good is simply getting what you currently want) in favor of **Idealized Desire Satisfactionism**.

  *   **The Counterfactual Advisor:** Railton defines an individual's good as what their "idealized self" (fully informed, instrumentally rational, vividly aware of consequences) would want for their "actual self." CEV defines the AI's goal as what humanity's "extrapolated self" (knows more, thinks faster, morally matured) would want for its "actual self." Both rely on a counterfactual simulation to correct for ignorance and cognitive bias.
  *   **Correction for Akrasia and Bias:** Both frameworks acknowledge that humans are buggy. We suffer from myopia, weakness of will, and framing effects. Railton argues that if you knew the pain of lung cancer vividly, you wouldn't want to smoke. Yudkowsky argues that if we thought faster and were "more the people we wish we were," we wouldn't want to program an AI to maximize paperclips or enforce a tyranny. Both treat current preferences as noisy data points rather than final commands.
  *   **Naturalism without Mysticism:** Neither theory requires appealing to non-natural moral facts (Platonic forms, divine commands). Value is grounded in human psychology, but it is *objective* relative to that psychology because the idealization process is deterministic (in theory). If two people had the same facts and rationality, Railton implies they might still differ, but their *own* good is fixed by their own psychology. CEV hopes they converge, but the ground is still human volition, not external moral truth.

  ### 2. The Divergence: The Headaches of Coherence

  The friction arises when you take Railton's theory—which is designed to explain **individual prudential value** (what is good *for me*)—and scale it to CEV, which is designed to dictate **collective moral action** (what should the AI *do*).

  Railton's framework is comfortable with pluralism; CEV's framework is terrified of it. Here are the specific headaches:

  #### A. The Aggregation Problem (Summing Incommensurables)
  *   **Railton:** My idealized self wants to write poetry; your idealized self wants to build skyscrapers. Railton's theory says we are both flourishing. There is no need to compare the *magnitude* of my well-being against yours to determine what is "Good" simpliciter. It is a theory of welfare, not a theory of right action requiring aggregation.
  *   **CEV:** The AI needs a single utility function to optimize. It cannot maximize two conflicting objectives simultaneously. CEV requires taking the idealized preferences of 8 billion people and merging them into a **Coherent** Volition.
  *   **The Headache:** If Idealized-Alice values autonomy above all, and Idealized-Bob values security above all, and these are structurally incompatible, Railton says "they have different goods." CEV says "the alignment has failed." Yudkowsky banks on the hope that moral truth converges at the limit of knowledge (moral realism), but if moral anti-realism is true, CEV demands a mathematical coherence that may not exist in the territory.

  #### B. The "Who" of the Idealized Self (Identity Drift)
  *   **Railton:** The relationship is between *Actual-Me* and *Idealized-Me*. There is a continuity of identity. The idealized self is giving advice to the actual self. If the idealized self wants things too alien to the actual self, Railton might worry the advice is no longer "for me."
  *   **CEV:** The extrapolation includes "being more the people we wish we were." This introduces moral growth. But if the extrapolation process changes our values *too* much, does the resulting volition still represent *humanity*?
  *   **The Headache:** This is the **Transformation Problem**. If the CEV process extrapolates us 1,000 years into the future of moral reasoning, the resulting preferences might be as incomprehensible to current humans as human morality is to a chimpanzee. Railton doesn't worry about this because the individual remains the locus of value. CEV worries because if the extrapolated volition is too distant from current humanity, the AI is effectively serving a alien god that happens to have our DNA, which violates the intuitive "Friendliness" constraint.

  #### C. Dynamic vs. Static Lock-in
  *   **Railton:** Idealized preference theory is a standard for evaluation. It doesn't necessarily imply that once you know what your idealized self wants, you must lock that in forever. You can learn, grow, and re-evaluate.
  *   **CEV:** CEV is often envisioned as a "initial condition" for a superintelligence. If the AI extrapolates our volition and then optimizes for it forever, it risks **moral lock-in**.
  *   **The Headache:** Railton's theory allows for the possibility that what my idealized self wants *changes* as I acquire more information (a dynamic equilibrium). CEV risks calculating the extrapolation once (or within a bounded window) and hardcoding it. If humanity's "converged" volition at time *T* turns out to be mistaken at time *T+1000*, a CEV-aligned AI might prevent us from correcting that mistake because it is faithfully serving the "Coherent Volition" we had at the start. Railton's framework is a compass; CEV risks becoming a cage.

  #### D. The Epistemic Burden
  *   **Railton:** We don't actually need to *know* what our idealized preferences are to live a good life. The theory is analytical. It explains what goodness *is*, not how to compute it perfectly.
  *   **CEV:** The AI *must* compute it. It turns a philosophical definition into an engineering requirement.
  *   **The Headache:** This creates the **Modeling Problem**. To calculate CEV, the AI must model human psychology, predict how we would change under better reasoning, and simulate moral convergence. Any error in this model (e.g., the AI misunderstands what we mean by "freedom") becomes an existential risk. Railton's theory survives being vague; CEV fails if it is imprecise.

  ### 3. The Crucial Philosophical Shift: Prudence vs. Morality

  The deepest divergence is that Railton is offering a theory of **Prudential Value** (Self-Interest), while CEV is attempting to derive **Moral Value** (Obligation).

  Railton bridges this gap in his later work on "Social Rationality," suggesting that rational agents would agree to moral constraints. However, CEV attempts to skip the negotiation phase. It assumes that if we just think *hard enough*, our self-interest and our moral obligations will converge into a single coherent function.

  *   **Railton:** Accepts that my good and the general good might conflict, requiring moral reasoning to resolve.
  *   **CEV:** Hopes that "extrapolated volition" dissolves the conflict. It assumes that a sufficiently informed, rational version of humanity would not want things that are "morally wrong" in a way that prevents convergence.

  This is the biggest gamble in CEV. It assumes that **moral realism is true** and that **human values are robust enough to survive extrapolation.** Railton's framework works even if values are fragmented and subjective, because it only asks, "Is this good for *you*?" CEV asks, "Is this Good for *Us*?" and if the answer is "There is no Us, only many conflicting Yous," the CEV project faces a foundational crisis that Railton's individualistic ethics never encounters.

  ### Summary for Your Piece

  You can frame it this way: **CEV is Railton's Idealized Preference Theory put under the stress test of Singleton Optimization.**

  Railton provides the philosophical justification for ignoring current human desires in favor of informed ones. But he enjoys the luxury of individualism. He doesn't have to sum utilities, he doesn't have to worry about locking in moral progress, and he doesn't need convergence.

  CEV takes the engine Railton built and tries to fly it through a canyon. It requires that individual idealized preferences not only exist but **commute** (can be combined without contradiction). The "headache" is that while Railton's theory is robust to moral pluralism, CEV is fragile to it. If humanity's idealized selves do not converge, CEV doesn't just result in a sub-optimal outcome; it results in an undefined objective function, which for a superintelligence is a catastrophic failure mode.

  Yudkowsky essentially bets that the "moral truth" is strong enough to pull all idealized human minds into the same attractor basin. Railton never had to make that bet.
