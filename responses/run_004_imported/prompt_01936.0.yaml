      *   *The "Hard Problem" vs. The "Literary Problem":* Philosophy asks "What is this made of?" Literature asks "What is it like to go through this?" Illusionism answers the first with "Nothing special," but leaves the second untouched. In fact, illusionism *requires* the second to exist (the illusion itself).

