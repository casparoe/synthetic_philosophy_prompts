answer: |-
  Your friend is right: your inference is too quick, and it rests on a category mistake regarding what illusionism actually denies versus what it leaves intact. You are conflating the *ontology* of experience (what it *is*) with the *phenomenology* of experience (what it *seems like*).

  If you rewrite your novel in a "flatter," externally observed register based on this philosophical anxiety, you will not be making your work more scientifically accurate; you will arguably be making it *less* accurate to the actual cognitive reality illusionism describes.

  Here is the breakdown of where your reasoning goes wrong, why your current method is philosophically safe, and why the illusionist view might actually validate your interiority-heavy approach more than the *nouveau roman* style.

  ### 1. The Gap: Denying the Property vs. Denying the Appearance
  Your inference relies on this syllogism:
  1.  Illusionism says phenomenal properties (qualia) do not exist.
  2.  My writing attempts to render phenomenal properties.
  3.  Therefore, my writing attempts to render something that does not exist.

  The error lies in premise 2. Illusionism does not deny that we *have* experiences; it denies that those experiences have the *intrinsic, ineffable, non-physical nature* that we intuitively think they have.

  Keith Frankish argues that when you introspect, your brain generates a representation of a state that *seems* to have qualitative richness. That "seeming" is a real, physical process. The *illusion itself* is a genuine phenomenon.

  *   **The Ontological Claim:** There is no "ghostly glow" inside your head when you see red.
  *   **The Phenomenological Claim:** It *seems* exactly as if there is a ghostly glow.

  Literature does not traffic in ontology; it traffics in phenomenology. When you write, "The morning light had a brittle, yellow quality that made her teeth ache," you are not making a metaphysical claim about the nature of photons or neural firing rates. You are reporting on the *content of the character's introspective model*.

  Even if Frankish is right, the character *believes* the light has that quality. The character's brain is *generating* that representation. To write a novel about a human being is to write about the user-interface of their mind, not the code running in the background. If you stop describing the interface because "it's just code," you are no longer writing about the human experience; you are writing about neuroscience.

  ### 2. The "User-Illusion" is the Subject Matter
  Frankish often uses the desktop interface metaphor. When you drag a file into a trash bin on your computer screen, you are interacting with an illusion. There is no actual trash bin in the CPU; there are only magnetic states on a hard drive. However, the *icon* is real (as a pattern of pixels), and the *action* of dragging it is a real functional event.

  If you were writing a "manual" for the computer's hardware, describing the trash bin icon would be misleading. But if you are writing a story about *how a user interacts with the computer*, describing the icon is essential. In fact, describing the magnetic states would be useless.

  Your perfumer is the user. Her introspective faculty provides her with a "desktop" of sensations—the taste of tea, the ache of memory.
  *   **Your current style:** Describes the icons on the desktop (the quasi-phenomenal properties).
  *   **The proposed "flat" style:** Attempts to describe the wiring behind the screen (external behavior without internal gloss).

  Illusionism posits that humans *cannot* access the wiring directly; we only have access to the desktop. Therefore, a novel that attempts to bypass the "illusion" of qualia to describe "pure function" is actually describing something the character *cannot access*. It is arguably *more* illusory to pretend we can step outside the user-interface than it is to describe the interface faithfully.

  ### 3. The Reality of the "Quasi-Phenomenal"
  You worry that there is "no phenomenal richness 'in there'." But Frankish's term, "quasi-phenomenal," is crucial. These properties are functionally real. They play a causal role in the character's decision-making.

  *   The perfumer smells the bergamot.
  *   Her brain represents this smell as having a specific, ineffable sharpness.
  *   That representation triggers a memory of her mentor.
  *   That memory causes her to discard the batch.

  The "sharpness" didn't need to be a non-physical soul-stuff to cause that chain of events. It only needed to be a *representation* that the brain treated as real. Your novel traces the causal chain of these representations. Whether the representation is "veridical" (accurately reflecting intrinsic reality) or "illusory" (misrepresenting physical states as qualitative) is irrelevant to the plot. The character acts on the illusion. Therefore, the illusion is the dramatic reality.

  ### 4. Why the *Nouveau Roman* Pivot Might Be Worse
  You mentioned switching to a flatter, externally observed register (Robbe-Grillet style) to avoid "chasing a phantom." Paradoxically, from an illusionist perspective, this might be *less* honest.

  Illusionism suggests that the brain is a "narrative machine" that constantly confabulates rich internal stories to make sense of inputs. Our interiority *is* rich, even if that richness is a constructed simulation.
  *   **Interiority-heavy prose:** Mimics the brain's own self-modeling. It acknowledges that the character lives inside the illusion.
  *   **Flat, external prose:** Implies a "view from nowhere" that strips away the very cognitive machinery illusionism seeks to explain.

  If the human mind is a machine designed to generate the *appearance* of qualia, then a novel that refuses to depict that appearance is failing to depict the primary output of the machine. It would be like writing a history of cinema that refuses to describe the images on the screen because "they are just projections of light." Well, yes, but the *movie* is the images.

  ### 5. Where You Might Need to Tweak (The Nuance)
  There is one small area where your friend's warning holds weight. You don't need to change your *style*, but you might want to check your *narrator's metaphysics*.

  If your narrator explicitly claims: *"This sensation was a spiritual truth, unconnected to the physical world, a direct touch of the divine essence,"* that narrator is making an ontological claim that illusionism says is false.
  However, if the narrator says: *"The sensation felt like a direct touch of the divine,"* that is a report on the character's psychology, which remains valid regardless of the underlying physics.

  Most literary impressionism (Woolf, Proust, your own work) operates in the latter mode. It describes the *force* of the sensation, not its metaphysical substrate. As long as your prose remains descriptive of the *experience* rather than prescriptive about the *nature of reality*, you are safe.

  ### Conclusion
  Your inference goes wrong by assuming that because the *object* of introspection (the intrinsic quale) is illusory, the *act* of introspection (the representation) is void.

  Illusionism does not say "Nothing is happening." It says "What is happening is not what you think it is." But "what you think it is" is still the data your novel is built on. The perfumer's "ache of a half-remembered argument" is a real cognitive state, even if the "ache" is a metaphorical construct generated by her brain to summarize a complex pattern of neural inhibition and activation.

  Do not burn the manuscript. The "phantom" you are chasing is the only thing your readers (and your characters) actually live inside. To write otherwise would be to ignore the very illusion that makes us human.
