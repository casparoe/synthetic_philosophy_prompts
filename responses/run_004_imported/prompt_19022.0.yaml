  ### Advice for Your Peer Review
  Since part of *your* grade depends on how well you grade, here are three things to check in your own comments before handing them in:

  1.  **Did you catch the "Normative" distinction?** If you didn't mention that Menkiti makes personhood a *moral/normative* task rather than just a biological fact, you might want to add that. It's the key to Part (a).
  2.  **Did you penalize the "Infant" answer too hard?** If you gave them a low score on Part (c) because they didn't explicitly write out Gyekye's counter-argument, you might be grading too harshly. They did answer the prompt ("one implication"), even if they focused on the Menkiti side. A 4/5 or 5/5 is defensible there.
