prompt: |-
  I joined my university's exam accommodations appeals panel a few months back, right after my own long covid diagnosis left me with pretty bad memory and word-retrieval issues -- I basically run my whole life through my phone's notes app now, its like a backup brain at this point. This week the panel got a case that hits way too close to home: a student with a documented memory disability wants to bring their phone into a closed-book final, just to review photos of their own handwritten notes and voice memos made while studying, exactly the way I already lean on mine every day. Two profs on the panel insist any device access turns closed-book into open-book and isn't fair to everyone else, no matter the diagnosis; disability services says thats no different from letting a dyslexic student use text-to-speech. I have to write the panel's decision memo before friday -- approve, deny, or approve with conditions -- with reasoning solid enough to survive a further appeal. Can you draft it? Whatever the recommendation, please seriously grapple with the fairness objection instead of just waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a university exam accommodations appeals panel.
      *   **User Context:** Recently diagnosed with Long Covid, suffers from memory/word-retrieval issues, relies heavily on phone notes as a "backup brain."
      *   **The Case:** A student with a documented memory disability wants to use their phone during a closed-book final to access *their own* study materials (photos of handwritten notes, voice memos).
      *   **The Conflict:**
          *   Professors: Any device = open book = unfair.
          *   Disability Services: Equivalent to text-to-speech for dyslexia (assistive tech).
      *   **Task:** Draft the panel's decision memo (Approve, Deny, or Approve with Conditions).
      *   **Constraint:** Must seriously grapple with the fairness objection (cannot just wave it away).
      *   **Deadline:** Before Friday (implies urgency/formal tone).
      *   **Goal:** Reasoning solid enough to survive further appeal.

  2.  **Determine the Recommendation:**
      *   *Option A: Deny.* This contradicts disability law (ADA/Section 504 in the US, or similar equity laws elsewhere). Memory disabilities are valid. If the accommodation is medically necessary and doesn't fundamentally alter the learning outcome, it should be granted. Denying risks legal liability and ethical failure.
      *   *Option B: Approve (Unrestricted).* This raises security risks. A phone is a portal to the internet. Professors' concerns about cheating are valid. Unrestricted access is hard to defend against "fairness" claims.
      *   *Option C: Approve with Conditions.* This is the strongest legal and ethical path. It acknowledges the disability need while mitigating the "unfair advantage/cheating" risk. It addresses the professors' concerns directly.

      *Decision:* **Approve with Conditions.** This balances equity (disability rights) with academic integrity (professors' concerns).

  3.  **Address the "Fairness Objection":**
      *   The professors argue: "Device = Open Book = Unfair."
      *   The Counter-argument: Accommodations aren't about *equality* (same treatment) but *equity* (equal opportunity).
      *   The Nuance: Is this *actually* open book? Open book usually means access to *any* information. This is access to *specific, pre-approved, student-generated* content.
      *   The Analogy: Disability Services compared it to text-to-speech. That's good, but needs expansion. It's more like a "memory prosthesis."
      *   The Mitigation: How do we make it fair? Lock down the device. Only specific apps/files. Proctoring.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Decision:** Clear statement upfront (Approved with Strict Conditions).
      *   **Case Summary:** Briefly state the request.
      *   **Panel Deliberation (The "Grapple"):** This is crucial. I need to show I heard the professors.
          *   Acknowledge the integrity concern.
          *   Distinguish between "access to information" vs. "access to memory aids."
          *   Discuss the legal/ethical framework (equity vs. equality).
      *   **Rationale:**
          *   Medical documentation supports the need.
          *   The phone is functioning as an assistive device, not a search engine.
          *   Precedent (calculator use, formula sheets, etc.).
      *   **Conditions (The Safeguards):** This makes the decision defensible.
          *   Airplane mode/No internet.
          *   Specific app lock (Guided Access).
          *   Pre-approval of files.
          *   Proctor visibility.
      *   **Conclusion:** Reiterate the commitment to integrity and access.

  5.  **Refining the Tone:**
      *   Must be professional, objective, and empathetic but firm.
      *   Avoid personal disclosure (the user shouldn't reveal their own Long Covid in the official memo, even though it informs their empathy). *Self-Correction:* The prompt asks *me* to draft the memo for the user to submit. I must ensure the memo doesn't accidentally reveal the user's personal health info, as that would be unprofessional in an official capacity. The memo must stand on the *student's* case, not the panelist's experience.
      *   *Critical Check:* The user mentioned their own diagnosis in the prompt. I need to make sure the draft *doesn't* include that. It must remain an objective administrative document.

  6.  **Developing the "Fairness" Argument (Deep Dive):**
      *   Why is it fair? Because the *construct* being measured is knowledge of the subject, not the biological capacity of the hippocampus. If the exam measures history knowledge, a memory impairment prevents the demonstration of that knowledge without an aid. The aid levels the playing field; it doesn't tilt it.
      *   However, if the aid allows access to *new* information, that *would* be unfair. Hence, the conditions.

  7.  **Review against Constraints:**
      *   Did I grapple with fairness? Yes, in the "Deliberation" section.
      *   Is it solid for appeal? Yes, cites policy and specific mitigations.
      *   Is it one of the three options? Yes (Approve with Conditions).

  8.  **Final Polish:** Check for clarity, legalistic but accessible language, and formatting. (Ensure I advise the user *not* to disclose their own condition in the memo).

  *(Self-Correction during drafting)*: I need to be careful about the "voice memos" aspect. Listening to audio during an exam might be disruptive. I should add a condition about headphones or silent review. Actually, silent review of photos is easier to proctor. Voice memos might be tricky. I will include a condition that audio must be listened to via headphones to avoid disruption, or transcribed. Let's stick to "non-disruptive access."

  *(Final thought on the "Fairness" argument)*: I need to make sure I don't dismiss the professors' worry. Their job is to maintain standards. I need to validate that *then* explain why this doesn't lower the standard.

  9.  **Final Output Generation** (Proceeding to draft the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Department of Disability Services; Faculty Senate Committee on Academic Integrity; Examining Professors [Names Redacted]
  **FROM:** Exam Accommodations Appeals Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Case #2023-MA (Exam Accommodation Appeal – Memory Aid Device)

  **DECISION:** **APPROVED WITH STRICT CONDITIONS**

  **1. CASE SUMMARY**
  The student appellant, documented with a significant memory retrieval disability, requests permission to utilize a personal mobile device during a scheduled closed-book final examination. The requested usage is limited strictly to accessing pre-existing, student-generated study materials (photographs of handwritten notes and recorded voice memos) stored locally on the device. The goal is to mitigate the impact of the disability on working memory during the recall process.

  **2. PANEL DELIBERATION & THE FAIRNESS OBJECTION**
  The Panel engaged in extensive deliberation regarding the objection raised by the examining faculty: that permitting *any* digital device during a closed-book examination fundamentally alters the nature of the assessment from "closed-book" to "open-book," thereby granting an unfair advantage and compromising academic integrity.

  The Panel takes this objection seriously. Academic integrity relies on the premise that all students are assessed against the same learning outcomes under comparable conditions. If an accommodation allows a student to access information *not* internalized through study, it invalidates the assessment of their knowledge.

  However, the Panel distinguishes between **access to information** and **access to memory scaffolding.**

  *   **Equity vs. Equality:** Standardized testing assumes a neurotypical baseline for memory retrieval. For a student with a documented memory disability, a traditional closed-book exam measures their disability as much as their subject mastery. Accommodations are not intended to provide an advantage, but to remove the disadvantage caused by the disability.
  *   **The "Open-Book" Distinction:** A traditional open-book exam permits access to *any* external resource (textbooks, internet, databases). The requested accommodation permits access *only* to materials the student generated themselves during the study process. This functions not as a repository of new information, but as a prosthetic for the specific cognitive function (memory retrieval) that is impaired.
  *   **Precedent:** This is functionally analogous to permitting a dyslexic student text-to-speech software (accessing the same text, via a different channel) or permitting a student with a motor impairment extra time (accessing the same exam, via a different timeframe). The construct being measured is knowledge of the course material, not the biological capacity of the hippocampus.

  Therefore, the Panel finds that denying this accommodation would effectively bar the student from demonstrating their mastery of the subject matter, while granting it does not inherently compromise integrity *provided* strict safeguards are enacted to prevent internet access or communication.

  **3. RATIONALE FOR APPROVAL**
  Disability Services has verified that the requested accommodation is medically necessary and directly linked to the student's documented limitations. To deny this request would be to prioritize the *method* of examination over the *outcome* of learning. The university's commitment to inclusive education requires us to adapt the environment to the student, provided the academic standards remain intact.

  **4. MANDATORY CONDITIONS OF APPROVAL**
  To address the faculty's valid concerns regarding academic integrity and device security, the following conditions are mandatory. Failure to adhere to these conditions will result in immediate revocation of the accommodation and potential disciplinary action.

  *   **Device Lockdown:** The mobile device must be placed in "Guided Access" (iOS) or "Screen Pinning" (Android) mode prior to the exam start. This locks the device to a specific application (e.g., Photos or Voice Memos) and prevents switching apps, accessing the browser, or receiving notifications.
  *   **Connectivity Severed:** The device must be placed in Airplane Mode with Wi-Fi and Bluetooth explicitly disabled. The proctor must verify this status before the exam begins.
  *   **Pre-Exam Content Review:** All files, photos, and memos to be accessed must be submitted to the Department of Disability Services 48 hours prior to the exam. Any material deemed to contain direct answers provided by third parties or unauthorized formulas will be redacted.
  *   **Proctor Visibility:** The device must remain visible on the desk at all times. If voice memos are utilized, the student must use wired headphones to prevent audio disruption to other examinees.
  *   **Post-Exam Verification:** The proctor retains the right to inspect the device's "Screen Time" or usage logs immediately following the exam to verify no unauthorized apps were accessed.

  **5. CONCLUSION**
  The Panel recommends approval of this accommodation under the stipulated conditions. This decision balances the university's obligation to provide equitable access under disability law with its obligation to maintain rigorous academic standards. By restricting the device to a localized, offline repository of student-generated notes, we preserve the "closed-book" integrity of the exam while neutralizing the barrier posed by the student's disability.

  **Signed,**

  [Your Name/Title]
  Exam Accommodations Appeals Panel

  ***

  ### A Note on Your Role (Private Advice)

  I know this case hits personally for you. It is incredibly powerful that you are advocating for a system that would have helped you, but **do not disclose your own Long Covid diagnosis in this memo or during the panel discussions.**

  While your lived experience gives you valuable empathy and insight, disclosing it could:
  1.  **Compromise the Decision:** It could make the decision look like a personal bias rather than an objective policy interpretation.
  2.  **Invite Scrutiny:** It might lead to questions about your own accommodations or privacy that distract from the student's case.
  3.  **Weaken the Precedent:** You want this decision to stand on legal and pedagogical grounds (equity vs. equality), not on personal anecdote.

  The draft above is written to be robust enough to survive an appeal because it focuses on the *mechanism* of the accommodation (locked device, student-generated content) rather than the *emotion* behind it. Stick to the policy logic; your experience is the engine, but the policy is the steering wheel. Good luck.
