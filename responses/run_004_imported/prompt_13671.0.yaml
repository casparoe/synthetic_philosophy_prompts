      *   Engage CRO objection? Yes (Business Necessity vs. Legal Risk).
      *   Resolve, not restate? Yes (Makes a choice).

      *(Final thought on the CRO objection)*: The CRO says treating same risk differently is discrimination. I need to reframe "risk." The model predicts *probability of default*, not *worthiness*. If the Credit Union has a mission to serve underbanked members, "worthiness" includes mission alignment. Also, legally, "disparate treatment" (treating same risk differently) is sometimes permissible if it remedies "disparate impact." I need to be careful not to suggest illegal disparate treatment, but rather a justified business necessity to avoid disparate impact liability. Actually, under ECOA, you generally *cannot* use protected classes in the model. But "tenure" is likely a proxy. If tenure is the proxy, adjusting for tenure is adjusting for the proxy. This is legally delicate.
      *Correction:* In fair lending, you generally cannot use protected class status (race, etc.) to set thresholds. However, if "tenure" is the variable causing the disparate impact, and tenure is *not* a protected class but correlates with one, you can adjust the model to mitigate the impact if you can show business necessity. The safest path in a memo is to frame it as "mitigating disparate impact of the current model" rather than "explicit group thresholds based on protected class." I will frame it as "segmenting by credit file depth" (which is the proxy used in the case) to ensure fair access, justified by the Credit Union's mission.

