answer: |-
  **MEMORANDUM**

  **TO:** Model Risk and Fair Lending Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Model Thresholding Strategy Ahead of Fair Lending Exam

  ### Executive Summary

  With the fair-lending examination six weeks away, we must resolve the deadlock regarding our new personal loan underwriting model. The audit confirms the model is statistically **calibrated** across groups (long-tenured vs. thin-file) but produces significantly disparate **false denial rates** for creditworthy thin-file applicants.

  I recommend we **adopt group-specific approval thresholds** to align false denial rates (satisfying the Compliance Officer's concern), subject to a **strict portfolio loss cap** (addressing the Chief Risk Officer's concern). We cannot satisfy both calibration and equalized error rates simultaneously given the differing base rates; we must choose which metric governs our regulatory defense. In the context of an ECOA fair-lending exam, mitigating disparate impact on creditworthy applicants takes precedence over maintaining strict score calibration, provided safety-and-soundness is not materially compromised.

  This memo outlines the implementation plan for the next six weeks and addresses the substantive objection that varying thresholds constitutes discrimination.

  ### The Technical Constraint

  We must acknowledge the mathematical reality identified in the Chouldechova and Kleinberg et al. literature: because thin-file applicants have a higher base rate of default, we cannot simultaneously maintain:
  1.  **Calibration:** A predicted risk of 20% implies a 20% default rate for both groups.
  2.  **Equalized Odds:** Creditworthy applicants in both groups are approved at the same rate.

  Our current model prioritizes (1). The Compliance Officer's proposal prioritizes (2). Doing nothing prioritizes (1) but exposes the Credit Union to significant regulatory risk.

  ### Recommendation: Constrained Equalized Odds

  I propose we adjust the decision thresholds for the thin-file segment to reduce their false denial rate to match the long-tenured segment, **up to the point where projected portfolio losses exceed a 5% increase over the baseline.**

  **Implementation Steps (6-Week Timeline):**

  *   **Weeks 1-2 (Simulation):** Data Science to run threshold simulations. Identify the specific cutoff score for thin-file applicants that equalizes the False Denial Rate (FDR) with long-tenured applicants. Calculate the expected increase in default rate associated with this shift.
  *   **Weeks 3-4 (Stress Testing):** Risk Management to stress-test the "5% Loss Cap." If equalizing FDRs requires exceeding this cap, we stop at the cap and document the trade-off. This ensures we do not violate safety-and-soundness obligations.
  *   **Week 5 (Documentation):** Compliance to draft the "Business Necessity" memorandum for examiners. We must articulate *why* we deviated from the raw model scores. The justification is not "social engineering," but rather correcting for data sparsity and historical exclusion that inflates base rates for new members.
  *   **Week 6 (Sign-off):** Committee vote to deploy the segmented thresholds for the exam period and subsequent permanent adoption pending review.

  **Monitoring:**
  Post-implementation, we will track actual default rates by segment monthly. If the thin-file segment's actual default rate exceeds the *predicted* rate by more than 10%, we trigger an immediate model review.

  ### Addressing the Chief Risk Officer's Objection

  The CRO has argued that assigning different decisions to applicants with identical predicted risk scores constitutes discrimination. This is a principled stance rooted in **individual fairness**: *similar individuals should receive similar outcomes.* If the model says two applicants both have a 20% risk of default, approving one and denying the other based on group membership appears to violate that principle.

  However, in the context of a Fair Lending Exam, this definition of fairness is insufficient for two reasons:

  **1. Regulatory Precedence of Disparate Impact**
  Under the Equal Credit Opportunity Act (ECOA), regulators focus heavily on **disparate impact**. If a neutral policy (our single threshold) results in a significantly higher denial rate for a group that correlates with a protected class (e.g., recent immigrants or younger applicants who often have thin files), the burden shifts to us to prove "Business Necessity."
  Strict calibration is a statistical property, not a legal defense. If we tell an examiner, "We denied creditworthy thin-file members at 2.5x the rate of others to preserve score calibration," the examiner will likely view this as prioritizing model elegance over fair access. The regulatory definition of discrimination focuses on *outcomes* (access to credit), not just *score consistency*.

  **2. The "Risk" Score is an Estimate, Not a Truth**
  The CRO's argument assumes the predicted risk score is an objective ground truth. It is not. It is an estimate derived from historical data. For thin-file applicants, the data is sparse. The higher base rate in this group is not necessarily an inherent "riskiness" of the people, but often a reflection of historical exclusion from the financial system (e.g., inability to build credit history without prior credit).
  By strictly adhering to calibration, we are effectively locking in historical disadvantages. We are saying, "Because this group has been historically excluded and thus has higher base rates, we will continue to exclude their creditworthy members at higher rates."
  Adjusting the threshold acknowledges that the *cost* of a false denial (losing a loyal member, perpetuating exclusion) is higher for the thin-file segment than the *cost* of a marginal increase in default risk, within the bounds of our loss cap.

  ### Conclusion

  We cannot have a model that is perfectly calibrated and perfectly equal in error rates. We must choose which imperfection we can defend to regulators.

  A model that is slightly less calibrated but provides equal access to creditworthy members is defensible as a mission-aligned risk decision. A model that is perfectly calibrated but systematically denies creditworthy thin-file members is vulnerable to enforcement action.

  I urge the committee to adopt the **Constrained Equalized Odds** approach. This allows us to walk into the exam demonstrating that we have actively measured and mitigated disparate impact, while the loss cap ensures the CRO's safety-and-soundness mandate remains intact.

  **Action Required:**
  Please review the attached simulation parameters by Friday. I move we vote on this framework at next week's session.
