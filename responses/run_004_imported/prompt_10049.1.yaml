answer: |-
  The candle gutted low, casting long, trembling shadows across the clutter of Trinity College rooms. Isaac Newton dipped his quill, the steel nib scratching harshly against the paper. He was writing to John Locke, but the words were for Jean Le Clerc in Holland: *Stop the press. Do not print.*

  He blew on the wet ink, the smell of gall sharp in the cold air. On the desk beside the letter lay the manuscript of *Two Notable Corruptions of Scripture*. It was the work of decades, the quiet excavation of a truth buried under centuries of ecclesiastical debris. He ran a finger over the pages arguing against 1 John 5:7. The Comma Johanneum. *The Father, the Word, and the Holy Ghost.* Newton knew it was a forgery, a clumsy insertion designed to bolster a doctrine that had no footing in the apostolic age. It was not revelation; it was architecture built by Athanasius and the Nicene faction to consolidate power.

  He shifted the pages to 1 Timothy 3:16. *God was manifest in the flesh.* Newton's eyes narrowed. It hinged on two letters. In the ancient uncials, a scribe had taken *ΟΣ* (Who) and added a crossbar to make it *ΘΣ* (God). A single stroke of a pen, a mere accident of abbreviation, had turned a subordinate Messiah into the Almighty. It was idolatry. To worship the Son as co-eternal with the Father was to violate the First Commandment, yet the Church demanded it as the price of salvation.

  Newton stood and walked to the window. Below, the courtyard of Trinity College slept in the moonlight. The irony tasted like bile. He was a Fellow of *Trinity*. His livelihood, his status, his home—all depended on the very institution he believed had corrupted the Word of God. If this manuscript went to print, he would not be hailed as a restorer of ancient truth. He would be ejected. Ruined. The laws against heresy were not idle threats.

  He turned back to the desk, his gaze falling on another stack of papers, covered in calculations derived from Daniel and Revelation. The numbers swam in his head, harmonizing with the textual criticism. The corruption of the Church was a sign of the times. He had calculated the end of these days—2060. The truth would be revealed only when the world was ready to burn. Perhaps he was not meant to be the one to speak it yet.

  He looked at the letter to Locke again. To publish was to obey the conscience; to withdraw was to preserve the mission. If he were stripped of the Lucasian Chair, who would continue the work? Who would protect the true religion from within the walls of Babylon?

  Newton sat. He picked up the letter. He was certain of the theology: the Father alone was Supreme; the Son was the divine Logos, created, subordinate, the agent of creation but not its source. He was certain of the text: the Greek manuscripts proved the corruption. But certainty was not armor.

  He folded the paper, the crease sharp and final. He reached for the wax seal, pressing his signet into the red pool. The flame flickered as he moved the letter toward the pile destined for the post, separate from the manuscripts. The manuscripts went into the locked drawer, beneath the optics and the fluxions.

  "Until the time is ripe," he whispered to the empty room.

  He extinguished the candle. In the darkness, the weight of the secret settled over him, heavier than gravity, binding him tighter than any chain of office. He was the keeper of a truth he could not speak, guarding a God he could not worship as the world demanded, alone in the heart of Trinity.
