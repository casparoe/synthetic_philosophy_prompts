answer: |-
  Good morning. For most of you, Abuela was a mother, a sister, a friend. For me, she was the ground I walked on. While my parents worked nights to keep a roof over our heads, Abuela kept the home fires burning. She didn't just feed me; she formed me. And she did that with rosary beads in her hand and a certainty in her heart that I have spent a long time trying to understand.

  I can still hear the soft click of her rosary beads from the other room. She prayed every night. Not occasionally, not when things were hard, but every night. I used to wonder how she could be so sure about things we couldn't see. How could she know, with such quiet confidence, that she would see Grandpa again? It would be easy to call that a prediction, like guessing the weather. But watching her live, I realized it wasn't a guess. It wasn't something she weighed against evidence. It was the lens through which she saw everything.

  Her faith wasn't a theory about the future; it was a practice for the present. She didn't believe in heaven like you believe a bus is coming down the street. She believed in it like you believe love is real—by living as if it is the most important thing in the world. When she told me she'd see Grandpa again, she wasn't making a wager. She was telling me that death doesn't get the final word on love. That certainty didn't take her away from us; it anchored her here. It made her patient when I was difficult. It made her generous when we had little. It turned every meal into a blessing and every hardship into a test of endurance. When neighbors were sick, she brought food not out of obligation, but because she saw Christ in them. That wasn't symbolism to her; it was vision.

  So, I won't stand here and pretend to know the mechanics of eternity. I can't claim to see what she saw. But I know what her belief did. I know that her hope wasn't a way to escape this life, but a way to fully inhabit it. She loved us fiercely because she believed love outlasts breath. To reduce her faith to a simple story would be to miss the strength it gave her. But to claim I know it as fact would be to miss the mystery she revered.

  To honor her, I don't need to adopt every specific doctrine she held. I just need to honor the weight her faith carried. I need to live with the same courage. The truth of her belief isn't in a debate; it's in the way she raised me, and in the way we loved her. She believed she was going home. And looking at all of you, seeing this family gathered today, I think she was right. She's already there, in the love we share. Rest in peace, Abuela.
