prompt: |-
  Last night, a friend and I had a long argument about Jain anekāntavāda that neither of us managed to resolve. My friend maintained that once one accepts that no single naya can express the whole truth about an object, one is committed to a thoroughgoing relativism, on which every philosophical system is simply "true from its own standpoint" and none can be judged mistaken. I resisted this conclusion, since classical Jain thinkers plainly used anekāntavāda to argue that specific rival doctrines—an extreme insistence on permanence, say, or on momentariness—were one-sided errors rather than partial truths, yet I could not quite explain why this does not just collapse into the relativism my friend was describing. Given how syādvāda's conditional predications and the distinction between a legitimate naya and a fallacious one (nayābhāsa) are actually supposed to function, does anekāntavāda amount to relativism about truth, and if not, what within the doctrine does the work of ruling standpoints out rather than treating them all as equally valid?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Jain *anekāntavāda* (the doctrine of many-sidedness).
      *   **The Conflict:** The user's friend argues *anekāntavāda* implies thoroughgoing relativism (all standpoints are equally valid/true from their own perspective, none can be judged mistaken). The user resists this, noting classical Jains used it to critique rival doctrines (e.g., extreme permanence vs. momentariness) as errors, not just partial truths.
      *   **The Question:** Does *anekāntavāda* amount to relativism about truth? If not, what mechanism within the doctrine (specifically *syādvāda* and *naya/nayābhāsa*) rules out fallacious standpoints while maintaining many-sidedness?
      *   **Goal:** Provide a philosophically rigorous explanation that validates the user's intuition, clarifies the distinction between *anekāntavāda* and relativism, and explains the normative criteria for valid *nayas*.

  2.  **Initial Assessment & Philosophical Context:**
      *   *Anekāntavāda* is often misunderstood as "anything goes" relativism or skepticism.
      *   The core Jain claim is ontological complexity: Reality (*sat*) has infinite attributes (*guṇas*) and modes (*paryāyas*).
      *   *Naya* = A partial standpoint/method of analysis.
      *   *Syādvāda* = The logic of conditional predication (maybe/perhaps).
      *   *Nayābhāsa* = Fallacious standpoints.
      *   *Key Distinction:* Relativism says "Truth is relative to the framework, so no framework is better." Jainism says "Truth is complex; a framework is valid *only if* it acknowledges its partiality and corresponds to *some* aspect of the real object without denying other aspects."
      *   *The "Work" done:* The distinction between *niścaya naya* (substantial standpoint) and *vyavahāra naya* (practical standpoint), and crucially, the prohibition against *ekānta* (one-sided absolutism).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the friend's interpretation is a common modern misunderstanding (often called "neo-Jain relativism"). Validate the user's resistance. State the thesis: *Anekāntavāda* is not relativism; it is a form of *integrative realism*.

      *   **Point 1: Ontological Commitment vs. Epistemic Relativism.**
          *   Relativism usually denies access to "the real."
          *   Jainism asserts a robust reality (*dravya*) exists independently.
          *   *Nayas* are tools to access this reality, not constructors of reality.
          *   Therefore, a *naya* can be *wrong* if it misrepresents the object, not just if it's incomplete.

      *   **Point 2: The Role of *Syādvāda* (Conditional Predication).**
          *   It's not just "maybe." It's "in some specific sense."
          *   The sevenfold predication (*saptabhaṅgī*) isn't a free-for-all. It requires logical consistency.
          *   Crucially, it forbids contradictory absolutes. You can't say "It IS permanently" AND "It IS momentarily" without the conditional qualifier.
          *   Relativism allows contradictory truths in different frameworks. Jainism says contradictory *absolute* claims are false.

      *   **Point 3: *Naya* vs. *Nayābhāsa* (The Normative Mechanism).**
          *   This is the direct answer to "what rules standpoints out."
          *   A valid *naya* acknowledges its own limitation.
          *   A *nayābhāsa* (fallacious standpoint) claims to be the *whole* truth (*ekānta*).
          *   Example: Buddhism (momentariness) isn't wrong about change; it's wrong about *substance*. Nyaya-Vaiśeṣika (permanence) isn't wrong about substance; it's wrong about *change*.
          *   The error isn't the partial view; the error is the *absolutization* of the partial view.

      *   **Point 4: The Hierarchy of Standpoints.**
          *   Not all *nayas* are equal.
          *   *Niścaya naya* (transcendent/ultimate) vs. *Vyavahāra naya* (conventional).
          *   Some *nayas* are closer to the full picture than others.
          *   The *Kevalin* (omniscient being) sees all sides simultaneously. Humans approximate this. This implies an objective standard of completeness.

      *   **Point 5: Addressing the "Rival Doctrines" Critique.**
          *   Why did Jains criticize others? Because others engaged in *graha* (grasping) one side and rejecting the rest (*upagraha*).
          *   Jainism claims to be the *synthesis*, not just another option.
          *   If it were relativism, Jainism couldn't claim soteriological superiority (liberation requires right knowledge).

      *   **Conclusion:** Summarize. *Anekāntavāda* is a methodological restraint against dogmatism, not a metaphysical claim that truth is fragmented beyond reconciliation.

  4.  **Refining the Tone and Terminology:**
