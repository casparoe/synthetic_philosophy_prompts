answer: |-
  Your intuition is correct, and your friend's interpretation represents a very common modern misunderstanding of Jain metaphysics, often labeled by scholars as "neo-Jain relativism." While *anekāntavāda* (the doctrine of many-sidedness) shares superficial similarities with relativism—specifically the acknowledgment that human language and cognition are limited—it is fundamentally distinct in its ontological commitments and normative logic.

  Classical Jainism does not argue that truth is relative to the observer; it argues that reality is complex, and truth is the accurate correspondence of a statement to a specific aspect of that complex reality.

  Here is how the machinery of *syādvāda* and the distinction between *naya* and *nayābhāsa* prevents the collapse into relativism and allows Jain thinkers to critique rival doctrines as erroneous.

  ### 1. Ontological Realism vs. Epistemic Relativism
  The primary distinction lies in the status of the object (*prameya*).
  *   **Relativism** typically suggests that truth is constructed by the framework or standpoint. There is no "view from nowhere."
  *   **Jainism** is robustly realist. It posits that *sat* (existence/reality) exists independently of cognition. Reality possesses infinite attributes (*ananta guṇa*) and modes (*ananta paryāya*).

  Because reality is objective and complex, a statement is not "true" simply because it is asserted from a standpoint. It is true only if it corresponds to *some* actual attribute of the object *without denying* the existence of other attributes.

  Therefore, *anekāntavāda* is not a claim that "everything is true." It is a claim that "partial truths are possible, but absolute partial claims are false."

  ### 2. The Normative Function of *Nayābhāsa* (Fallacious Standpoints)
  You asked what within the doctrine does the work of ruling standpoints out. The answer is the distinction between a valid *naya* and a *nayābhāsa*.

  A *naya* is a partial standpoint that is acknowledged as partial. A *nayābhāsa* is a standpoint that masquerades as the whole truth.
  *   **Valid *Naya*:** "The pot is permanent (in terms of its substance/clay)." (Acknowledged implicitly or explicitly as a substantial standpoint, *dravyārthika naya*).
  *   **Fallacious *Nayābhāsa*:** "The pot is *only* permanent and never changes."

  The error in rival doctrines (like the Nyaya-Vaiśeṣika insistence on permanence or the Buddhist insistence on momentariness) is not that they identified a real aspect of the world. The Jains agreed that substance persists and modes change. The error was **ekāntavāda** (one-sided absolutism).

  When a rival school says, "Everything is momentary," the Jain critique is not "That is true for you, but not for me." The critique is: "That statement is false because it denies the aspect of persistence (*dhrauvya*) which is empirically and logically evident."

  By defining *nayābhāsa*, Jain logic creates a normative filter. A standpoint is invalid if it:
  1.  Contradicts direct perception (*pratyakṣa*) of other aspects.
  2.  Claims exclusivity (denying other valid standpoints).
  3.  Fails to apply the conditional qualifier (*syāt*).

  ### 3. *Syādvāda* as Logical Restraint, Not Skepticism
  Your friend likely interprets *syāt* (the prefix used in the sevenfold predication, or *saptabhaṅgī*) as meaning "maybe" or "in my opinion." In classical Jain logic, *syāt* means "in some specific sense" (*kathañcit*).

  This is a crucial logical operator, not an expression of doubt. It functions to index a predicate to a specific aspect of the object.
  *   **Relativist:** "It is true that the soul exists (for Jains) and does not exist (for Buddhists)."
  *   **Jain Logician:** "In the sense of substantial reality, the soul exists. In the sense of material form, the soul does not exist."

  *Syādvāda* prevents the collapse into relativism by enforcing **non-contradiction across unqualified absolutes.** You cannot assert "A is B" and "A is not B" absolutely. You can only assert them conditionally.

  If a rival doctrine asserts an unqualified absolute (e.g., "The world is eternal"), *syādvāda* identifies this as a logical error because it violates the complex nature of reality. Thus, Jainism claims a higher logical coherence than its rivals. It does not treat the rival view as "equally valid"; it treats the rival view as a *component* that has been mistakenly inflated into a whole.

  ### 4. The Soteriological Hierarchy
  If *anekāntavāda* were thoroughgoing relativism, it would undermine the Jain soteriological goal. Jainism is soteriological: the goal is liberation (*mokṣa*), which is achieved through Right Faith, Right Knowledge, and Right Conduct.

  *   **Relativism:** If all systems are equally valid, then Jain ethics and metaphysics are no better guides to liberation than rival systems.
  *   **Jainism:** Only the synthesis of *anekāntavāda* provides *Samyak Darśana* (Right Perception).

  The Jains argue that attachment to a one-sided view (*abhiniveśa*) generates karma and binds the soul. Therefore, holding a *nayābhāsa* is not just an intellectual error; it is a moral and spiritual failure. The *Kevalin* (omniscient being) does not see "many relative truths"; the *Kevalin* sees the one complex truth in its totality simultaneously. Human language breaks this down into parts. The standpoint that most closely approximates the *Kevalin's* view (by acknowledging all parts) is objectively superior to one that denies parts.

  ### 5. Summary: Integration vs. Fragmentation
  To resolve your argument, you might frame the distinction this way:

  *   **Relativism** fragments truth. It says reality is inaccessible or non-existent, so we are left with incompatible frameworks that cannot be judged against one another.
  *   **Anekāntavāda** integrates truth. It says reality is accessible but infinite. Frameworks are judged by how well they integrate partial insights without denying others.

  The Jain critique of the Buddhists (who emphasized momentariness) and the Naiyāyikas (who emphasized permanence) was that they were like blind men touching an elephant.
  *   The relativist says: "The leg-man and the trunk-man both have their own truth; neither is wrong."
  *   The Jain says: "The leg-man and the trunk-man have identified real parts, but their claim that the elephant *is only* a leg or *is only* a trunk is false. The truth is the elephant, which includes both."

  Therefore, *anekāntavāda* does not validate all philosophical systems. It validates only those systems (or those specific propositions within systems) that acknowledge their own conditionality and do not contradict other established aspects of reality. It rules out **dogmatism**, not **error**. A system that dogmatically asserts a half-truth as a whole-truth is judged to be mistaken (*mithyātva*), not relatively true.

  **In short:** *Anekāntavāda* is a methodological restraint against absolutism, not a metaphysical endorsement of relativism. It claims to possess the *more* complete truth precisely because it accounts for the partial truths of its rivals while rejecting their absolutist claims.
