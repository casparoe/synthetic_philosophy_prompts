          *   *Elena:* The *structure* matters. If I say "I care about the worst case," that's a different *reason* than "I value the 10th million less." Normative significance.
      *   **Argument 3: Dynamic Inconsistency (Repeated Choices):**
          *   *Marcus:* The killer blow. If you face this repeatedly, REU leads to sure losses (money pumps). You'll change your mind mid-stream.
