          *   Choice 2: 2A (11% $1M, 89% $0) vs 2B (10% $5M, 90% $0).
      *   **The Core Conflict (Independence Axiom):** Marcus attacks the Allais preference as a violation of independence. Elena defends it as risk-weighting.
      *   **Argument 1: Is Risk a Separate Ingredient?**
          *   *Elena:* It's not just diminishing marginal utility. It's about the *weight* of the probability itself.
          *   *Marcus:* Counter: You can model that with a concave utility function. It's just EU in disguise.
