answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Captain's kid.

  Thirty-four years. That is a long time to wear a badge. When my dad started as a beat cop, I wasn't even born. By the time he made Shift Captain, I was old enough to know that "shift work" was the reason he missed half my soccer games, but also the reason he was there for breakfast when other dads were at the office.

  Now, usually, at a retirement dinner, you talk about the chases, the arrests, or the time someone tried to hide in a dumpster. And I'm sure plenty of you are waiting for those stories. But if you know my dad, you know that while his hands were on a radio and a service weapon, his head was often somewhere else entirely.

  Specifically, in the front seat of his cruiser, tucked in the glovebox next to the registration and a pack of gum, was a beat-up paperback of Blaise Pascal's *Pensées*.

  For the family: Yes, I know, 17th-century French philosophy. For the guys from the precinct: Yes, he actually read it. And for his friend from the community college night class who is scanning the room right now: I did my homework. I'm not going to chicken out.

  Because you can't talk about my dad's career without talking about that book. He had a favorite passage he'd quote, usually when we were arguing about something unfair in the world. He'd say, "Justice without force is powerless; force without justice is tyrannical."

  He'd follow that up with a line that always made my mom roll her eyes. He'd say, "Since we can't make what is just strong, we make what is strong just. So don't forget, son—I'm not in the justice business. I'm in the force business. Justice is a different department."

  On the surface, that sounds pretty cynical. If I stand here and say my dad spent 34 years enforcing "made-up rules" because "strength is justice," it sounds like I'm saying his career was a sham. And I know the men and women in this room know that's not true.

  But that's only half of what he believed. And if I stopped there, I'd be missing the point he actually cared about.

  He'd always follow that quote with Pascal's idea of the "Orders." Pascal argued that there are different levels of reality. There's the Order of Bodies—the world of force, power, uniforms, and guns. Then, there's the Order of Minds—knowledge and reason. And above that, the Order of Charity—goodness, wisdom, and love.

  Pascal's point was that you cannot mix these orders up. You can't buy wisdom with money, and you can't find goodness just because you have power.

  And *that*... that was the job my dad actually did for 34 years.

  He knew he worked in the Order of Bodies. He knew the badge gave him authority, and the gun gave him force. But he never, ever let that convince him that he was a better human being because of it. He knew that having the "force" didn't make him "right." It just made him responsible.

  There is a temptation in this profession—and in life—to think that because you have the power to act, you have the moral authority to judge. My dad fought that temptation every single day. He kept the orders separate. He used the force when he had to, to keep the peace, but he kept his heart in the order of charity.

  He treated the guy in handcuffs with the same basic dignity as the Mayor. Not because the badge told him to, but because he knew the badge didn't make him superior. He knew that in the highest order, the one that actually counts, a Shift Captain and a beat cop and the person they're arresting are all standing on the same ground.

  To the guys from the precinct: You know this better than anyone. The best cops aren't the ones who think they're the law. They're the ones who know they're just the peacekeepers. My dad was the best because he knew the difference.

  To the family: He's still the same guy. The badge is coming off, but the man remains.

  And to his friend from the night class: I hope I got the distinction right. Dad taught me that the philosophy wasn't for the classroom. It was for the cruiser.

  Dad, you spent 34 years navigating the order of force so that the rest of us could live safely in the order of charity. You never confused the two. You never let the uniform harden your heart. And you taught me that while you can't make what is just strong, you can be strong enough to be just.

  So, if everyone could please raise a glass.

  To the Captain. May your retirement be free of calls, free of backup, and full of the higher orders.

  To Dad.
