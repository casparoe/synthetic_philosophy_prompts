          *   Sophisticated (CDT-ish): Anticipates future choices. At the ATM, she chooses not to pay. *Problem:* She knows ex-ante she won't pay, so she knows she won't get rescued. But if she *is* rescued, it implies the predictor made a mistake or she's irrational.
