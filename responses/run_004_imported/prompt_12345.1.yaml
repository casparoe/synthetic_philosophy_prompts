answer: |-
  The ATM screen hums, a harsh blue light in the dusty twilight. Outside the glass, the driver's engine idles, a low, impatient thrum. Elena slides her card into the slot. Marcus stands beside her, hand already on his wallet.

  **Elena:** I'm not withdrawing.

  **Marcus:** Don't do this. We're alive because he thought we were the kind of people who would.

  **Elena:** We're alive because he made a prediction. Predictions are about the past now. They're facts. Like the thirst we no longer feel. Look, Marcus, causality flows forward. My pressing 'withdraw' and handing over cash doesn't cause the car ride. The car ride is already done. Paying now is just burning money for no return.

  **Marcus:** It's not about causing the past. It's about being the person who *gets* the ride. If you walk out there without cash, you prove him wrong. But more importantly, you prove *yourself* wrong. You're a temporally extended agent, Elena, not a series of disconnected time-slices.

  **Elena:** That's poetry, not decision theory. At this specific node, standing at this specific machine, I have two options: Keep $100 or lose $100. The rescue variable is already fixed at 'True'. Losing the money doesn't change it. A sophisticated chooser recognizes that the past is sunk. I'm optimizing for the Elena standing here, not the Elena who was dying in the sand.

  **Marcus:** And that's exactly why a perfect predictor should have left you there. If he knew you were a causal decision theorist, he knew you'd reason exactly this way once you were safe. He should have seen this refusal coming from a hundred miles away. So explain it to me: How are you here?

  **Elena:** (Pauses, card still in the slot) He wasn't perfect. No one is. He saw a desperate woman and gambled. I'm the beneficiary of his error. I'm not going to compound his error with my own financial suicide.

  **Marcus:** You're treating your survival as luck. It wasn't. It was a transaction. You sold him a promise.

  **Elena:** I sold him a *prediction*. I didn't sign a contract. And you're dodging the real hole in your boat. You're withdrawing cash. Why? What force, physically speaking, compels you? Your past self made a resolution. But your past self isn't thirsty. You are. Your past self isn't losing $100. You are. What short of wishful thinking makes his resolution binding on you?

  **Marcus:** Because if I ignore his resolution, I'm not just breaking a promise to the driver. I'm breaking a promise to myself. If I defect now, I establish a policy for my future self that says, "Commitments are optional when inconvenient."

  **Elena:** But it *isn't* inconvenient to have the money. It's just costly. And you've already reaped the benefit of the commitment! You're in town. The disposition paid its dividend the moment the car door opened. Why pay the subscription fee after the service has ended?

  **Marcus:** Because the service hasn't ended. I have to live with me tomorrow. And next year. If I train myself to be the kind of agent who defects when the causal leverage is gone, I become untrustworthy in every future Newcomb problem I encounter. I'm paying to maintain my integrity as an agent.

  **Elena:** Integrity is a virtue, Marcus, not a utility function. You're engaging in magical thinking. You think your action *now* reaches back and validates the prediction *then*. It doesn't. The prediction is a fossil. You're worshipping it.

  **Marcus:** And you're parasitizing a system you intend to destroy. If everyone reasoned like you, no one would ever get picked up in the desert. You're relying on the existence of people like me to make your defection possible. You need resolute choosers to exist so that drivers keep stopping.

  **Elena:** That's the free-rider argument. It's valid for the group, not the individual. I'm not asking everyone to do it. I'm asking what *I* should do. And rationally, I keep the cash.

  **Marcus:** Rationally? You're admitting that rationality requires you to be the kind of person who dies in the desert.

  **Elena:** No. Rationality requires me to survive. I *did* survive. Now I'm optimizing the survival. You're optimizing a narrative.

  **Marcus:** I'm optimizing my agency! If I can't bind my future self, I don't have a future self. I just have a succession of dying moments.

  **Elena:** (Pulls the card out. The screen asks: *WITHDRAWAL AMOUNT?*) Then die rich.

  **Marcus:** (Opens his wallet, pulls out bills) And you'll live poor, and alone. Because eventually, you'll need someone to trust you when the causal arrow only points one way.

  **Elena:** I'll take that risk. The odds of another perfect predictor are low.

  **Marcus:** The odds of you needing a partner are high.

  *A long honk from the car outside cuts through the air. The driver leans on the horn, a sustained, dissonant blast. They both flinch, turning toward the glass.*

  **Elena:** He's waiting.

  **Marcus:** He's waiting for *us*. Not you. Us.

  **Elena:** (Her hand hovers over the keypad) If I pay, I admit you're right. That rationality is about rules, not consequences.

  **Marcus:** If you don't, you admit you're not the agent who got picked up. You're just the wreckage left behind.

  *The horn stops. The silence of the machine returns. Elena stares at the blinking cursor. Marcus holds the cash, waiting.*

  **Elena:** I still don't see the causal link.

  **Marcus:** I don't need you to see it. I just need you to choose.

  *Elena types a number. Marcus exhales. The machine whirs.*
