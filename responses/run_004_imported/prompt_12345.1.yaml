      *   *Response:* The CDT has to admit this is a problem. She might argue the predictor wasn't perfect, or that she *intended* to pay earlier (sophistication involves knowing you will defect, which is tricky). Actually, a Sophisticated chooser knows *ex-ante* they will defect *ex-post*. So they know they won't get rescued. If they are rescued, the predictor failed. The CDT must own this awkwardness.
