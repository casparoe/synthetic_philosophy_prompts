answer: |-
  The loupe pressed into Elian's eye socket, a cold ring of brass against bone. On the workbench, the disassembled heart of the tower clock lay spread on black velvet. It was a massive thing, meant to count the hours for the whole valley, but here it was helpless, a collection of brass teeth and steel springs waiting for a hand to make them pretend to be time.

  Elian hadn't slept in two days. The clock had stopped three nights ago, at the exact moment he was supposed to be dining with Mara. He told her it was the mainspring. He told her the tension had snapped, an inevitable physical failure. She had looked at him with eyes that didn't blink enough and said, "You chose the spring over the table."

  He had accepted the blame. It was the comfortable thing to do. Cause and effect were the bedrock of his life: he tightened a screw, the gear held; he neglected a wife, the marriage frayed. It was a machine, and he was the operator.

  But the mainspring wasn't broken. It was perfect.

  He adjusted the focus on the microscope. He was looking at the escapement, the anchor that ticks back and forth, letting the gears turn one tooth at a time. He had set up a high-speed lens array, capturing ten thousand frames a second. He wanted to see the impact. He wanted to see the moment the anchor tooth struck the escape wheel, the moment force transferred from one object to another.

  He played the footage on the small screen.

  *Frame 4091:* The anchor tooth is one micron from the wheel. The wheel is stationary.
  *Frame 4092:* The anchor tooth is occupying the same space as the wheel's rim.
  *Frame 4093:* The wheel has moved. The anchor is clear.

  Elian rewound. Played again.

  *Frame 4092.*

  He froze the image. He enhanced the contrast. There was no deformation. No compression of the metal lattice. In a causal world, matter resists matter. Before the wheel could move, the atoms of the anchor should have pushed against the atoms of the wheel, compressing the space between them, building potential energy like a spring before the release.

  But here, in the frozen gray scale of the monitor, they overlapped. They occupied the same coordinate.

  It was a ghosting error. A glitch.

  Elian sat back, the stool creaking. The sound was sharp in the silent workshop. He looked at his hand, resting on the bench. He slammed it down.

  *Pain.*

  But did the wood cause the pain? Or did the wood occupy a space, and his hand occupy the same space, and the Universe, in its next breath, render the sensation of pain to make sense of the overlap?

  He stood up and walked to the kiln in the corner. He lit a burner. A blue cone of flame hissed. He held a strip of copper in the tip.

  He watched. He didn't look away. He forced his eyes to dry out, to refuse the blink that stitched moments together.

  The copper glowed red. But he didn't see the heat travel. He didn't see the vibration of atoms passing from the flame to the metal. He saw the flame *here*, and the copper *red*. Then, a fraction of a second later, the flame *there*, and the copper *molten*.

  There was no bridge. There was only the sequence.

  Al-Ghazālī's name drifted into his mind, a fragment from a university lecture decades ago. *Fire does not burn cotton.* God burns the cotton, in the presence of the fire. Habit, not necessity.

  Elian turned off the burner. The flame vanished. The copper remained molten for a heartbeat, then snapped back to solid, cold and rigid. It hadn't cooled; it had been replaced by a version of itself that was cool.

  He walked to the window. The valley below was dark, save for the streetlamps. He watched a moth battering against the glass. *Tap. Tap. Tap.*

  The moth hits. The glass resists.

  Elian squinted. He imagined the glass wasn't resisting. He imagined the glass was simply *there*, and the moth was *there*, and the rule of the world was that they do not pass through. But if the rule was just a habit, a repeated choice...

  He pressed his palm against the pane. He pushed. He expected resistance. He tried to remember the feeling of the wood bench, the overlap of the gears. He tried to stop expecting the push back.

  For a terrifying second, his hand sank an inch into the glass. Not through it—*into* it. A visual stutter, a blending of skin and silica.

  He yanked his hand back, gasping. His palm was unmarked. The glass was unmarked.

  There was no force. There was only the arrangement.

  Elian slid down the wall to the floor. The workshop seemed to tilt. If there was no force, there was no agency. He hadn't fixed the clock. The clock had simply entered a state of "working" adjacent to his presence. He hadn't broken his promise to Mara. He hadn't *caused* her pain. The universe had rendered a scene where he was late, and a scene where she was hurt, and placed them side by side.

  His guilt was a story he was telling himself about the sequence.

  If he couldn't cause anything, what was planning? What was a promise? A promise was a claim of power over the future. *I will make this happen.* But he couldn't make the gears push. He couldn't make the flame heat. How could he make Mara forgive him?

  He looked at the clock on the wall. It was ticking.

  *Tick.* State A.
  *Tock.* State B.

  The sound was not a vibration traveling through air. It was a recurring decision by the fabric of things to vibrate in this pattern.

  Elian stood up. He picked up the finished mainspring. He didn't need to install it. The clock was already ticking. He knew that now. If he took the spring out, the clock might keep ticking for a while, sustained by the momentum of the Habit, until the pattern shifted.

  He put on his coat. He walked out into the night.

  The air was cold. He walked toward Mara's house. Usually, he would rehearse what to say. *I'm sorry. I was wrong. I'll fix it.* Causal incantations. Inputs designed to generate a specific output.

  Now, he walked in silence.

  He reached her door. He could hear movement inside. The pacing she did when she was thinking.

  If he knocked, would she open? Not because the sound waves compelled her to move, but because the Habit suggested that knocking was followed by opening. But Habits could change. God could create a world where knocking was followed by silence.

  He raised his hand. He looked at his knuckles. They were just shapes. They had no power to persuade.

  He knocked.

  He didn't expect the door to open. He didn't expect it to stay closed. He was just placing a marker in the sequence. *Here, I am.*

  The lock clicked. The door swung inward.

  Mara stood there. She was wearing the sweater he liked, the gray wool. Her face was tired.

  "Elian," she said.

  He looked at her. He wanted to say, *I know now. I know I didn't hurt you. I know you didn't choose to be angry. It's just the way the frames fell.*

  But that was madness. That was the language of a man who had stared too long at the gears.

  "I brought the spring," he said, holding up the coil of steel. "For the clock."

  She looked at the spring, then at his hand. She saw the red mark on his palm where it had dipped into the window.

  "You're bleeding," she said.

  "It's nothing."

  She stepped back. "Come in."

  He crossed the threshold. He didn't feel the floor support him. He knew it was just a series of positions he was occupying.

  "I thought..." He stopped. He had been about to say, *I thought I could fix it.* But he couldn't fix anything. He could only stand next to the broken things and wait to see if the next frame showed them whole.

  "You thought you could fix the clock," Mara said. She walked to the table and poured two cups of tea. The steam rose in perfect, identical curls.

  "I thought I caused it to stop," Elian said.

  Mara handed him the tea. Her fingers brushed his. He waited for the spark, the transfer of warmth. There was none. Just the proximity of heat and skin.

  "You didn't cause it, Elian," she said softly. "Things stop. Sometimes we're there when they do. Sometimes we're not."

  She sat down. She didn't ask him to sit, but he sat. The chair held him.

  "I'm not angry because you were late," she said. She looked into her tea. "I'm angry because you think your lateness was a choice. You think you have that much control."

  Elian held the cup. The heat seeped into his fingers. Or rather, the state of his fingers changed to 'warm'.

  "I'm learning," he said, "that I don't."

  Mara looked up. Her eyes were wet, but no tears fell. The universe held them in suspension, for now.

  "Good," she said. "Because I'm tired of being a machine you're trying to operate. I just want to be here. In the same moment as you."

  Elian nodded. He understood. Love wasn't a force. It wasn't a gravity that pulled them together. It was the Habit of proximity. It was the repeated choice of the world to render them side by side, frame after frame.

  He couldn't promise to never be late again. He couldn't promise to never hurt her. He had no power to bind the future.

  But he could be here now. He could align his coordinates with hers.

  "I'm here," Elian said.

  Mara reached across the table. She took his hand. She didn't squeeze. She just held it.

  "I know," she said.

  Outside, the tower clock struck the hour. The sound rolled over the valley, a deep, resonant boom. Elian listened. He knew the bell hadn't vibrated the air. He knew the air hadn't vibrated his eardrum. He knew it was all a rendering, a magnificent, continuous act of creation that had no need for gears or springs or causes.

  He squeezed her hand back. He didn't expect her to feel it. He just offered the gesture to the Habit, a prayer that the next frame would show her squeezing back.

  She did.

  They sat in the silence, watching the steam rise from their cups, two figures rendered in the light of a lamp that burned without fuel, waiting to see what would happen next.
