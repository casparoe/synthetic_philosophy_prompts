  1.  **Analyze the User and Request:**
      *   **User:** New parent, just went through life insurance underwriting, philosophically inclined (or at least influenced by a sister doing an MA in philosophy), anxious about mortality probabilities.
      *   **Core Question:** Can you argue for the *strongest version* of the view that individual probability is non-existent (it's only ever about reference classes), *while also* explaining why using these numbers for decision-making isn't irrational?
      *   **Key Concept:** The Reference Class Problem (Hans Reichenbach).
      *   **Tone:** Empathetic, intellectually rigorous, reassuring but honest about the philosophical uncertainty. Needs to balance the "hard" philosophical argument with practical rationality.

  2.  **Deconstruct the Philosophical Argument (The "Strong View"):**
