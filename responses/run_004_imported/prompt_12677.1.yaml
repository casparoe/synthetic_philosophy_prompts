prompt: |-
  I'm a PhD student in behavioral econ and got roped into serving on my lab's hiring committee for a new lab manager position. We've interviewed 4 of the 9 people who applied, and the most recent one was clearly the strongest so far by a good margin, but she just told us she has a competing offer and needs our answer within a week -- before we'd even get through the remaining 5 in the pool. Half the committee wants to make her the offer now, the other half wants to stick to the plan and see everyone first in case theres someone even better left, and honestly nobody has a principled reason for their side, they're just going with gut feeling, which drives me a little nuts given what I study for a living. Could you write the short memo I'd actually send round -- a real recommendation on whether we make her the offer now, plus a general rule we could reuse next time we're hiring -- and don't just split the difference: commit to a side, but take the strongest version of the other side's worry seriously too.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** PhD student in Behavioral Economics.
      *   **Context:** Serving on a hiring committee for a Lab Manager position.
      *   **Situation:** 4/9 candidates interviewed. Current candidate (Candidate A) is the strongest so far by a "good margin." Candidate A has a competing offer with a 1-week deadline.
      *   **Conflict:** Committee is split 50/50. One side wants to offer now (fear of losing top talent), the other wants to finish the pool (fear of missing out on someone better). Both sides are relying on "gut feeling."
      *   **Task:** Write a short memo recommending a decision (commit to a side) + propose a general rule for future hiring.
      *   **Constraint:** Do not split the difference. Take the strongest version of the opposing worry seriously.
      *   **Tone:** Professional, persuasive, grounded in behavioral econ principles (since the user is a BE PhD student), but practical for a lab setting.

  2.  **Determine the Recommendation:**
      *   *Option 1: Wait.* Risk: Lose Candidate A. If Candidate A is "clearly the strongest by a good margin," the probability of finding someone significantly better in the remaining 5 is low, especially given the high variance in hiring outcomes and the cost of restarting the search.
      *   *Option 2: Offer Now.* Risk: Missing a "unicorn." Reward: Securing a known high-quality asset.
      *   *Behavioral Econ Lens:*
          *   **Loss Aversion:** The pain of losing Candidate A feels worse than the gain of finding someone slightly better.
          *   **Satisficing vs. Maximizing:** Maximizing (seeing everyone) often leads to worse outcomes due to decision fatigue and opportunity costs. Satisficing (setting a threshold) is often more efficient.
          *   **Base Rate Neglect:** How often does the 5th-9th candidate actually beat the 4th candidate by a "good margin"? Usually not often if the interview process is consistent.
          *   **Option Value:** The value of waiting is low if the distribution of candidate quality is thin in the tail.
      *   *Decision:* **Make the offer now.** In academic lab management, a "good margin" lead early in the pool is rare. Restarting the search costs months of lab productivity. The risk of losing the known quantity outweighs the speculative gain of a potentially better unknown.

  3.  **Address the Opposing View (The "Wait" Side):**
      *   Their worry: "What if there's a superstar in the remaining 5?"
      *   Validation: This is the "Maximizer" instinct. It's valid to want the best.
      *   Counter-argument: The *expected value* of continuing is lower than the *certain value* of Candidate A, adjusted for the risk of losing her. Also, interview fatigue can degrade the committee's ability to judge later candidates accurately.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly. No waffling.
      *   **The Argument (Behavioral Econ Flavored):**
          *   Acknowledge the "Maximizer" urge (seeing everyone).
          *   Highlight the cost of delay (risk of losing Candidate A).
          *   Use the "Good Margin" fact. If she's already way ahead, the bar for the remaining 5 is incredibly high.
          *   Mention the cost to the lab (productivity loss).
      *   **The Compromise/Mitigation:** How do we address the risk? (e.g., expedite reference checks).
      *   **The General Rule:** Create a policy for next time. "The Threshold Rule" or "The Early Bird Protocol." Let's call it the "Threshold & Trigger" rule.
      *   **Tone Check:** Needs to sound like a colleague, not a lecturer, but leverage the user's expertise subtly.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Keep the jargon minimal. Use concepts like "expected value" or "opportunity cost" but explain them in practical lab terms.
      *   *Critique:* Did I take the other side seriously?
      *   *Fix:* Explicitly state that the desire to be thorough is virtuous, but explain why it's misaligned with *this* specific constraint (the 1-week deadline).
      *   *Critique:* Is the rule reusable?
      *   *Fix:* Make the rule about setting a quality threshold *before* interviewing, so you know when to stop.

  6.  **Final Polish:**
      *   Ensure the recommendation is unambiguous.
      *   Make sure the "General Rule" is actionable.
      *   Check length (short memo).

  7.  **Final Output Generation:** (This matches the provided good response.)
      *   Subject: Recommendation on Lab Manager Hire & Future Protocol.
      *   Recommendation: Extend offer.
      *   Reasoning: Expected value, risk of loss, opportunity cost.
      *   Future Rule: Pre-commitment to thresholds.

  *(Self-Correction Note: Make sure I don't sound *too* much like a textbook. The user is a PhD student, but the audience is the committee (PIs, other students, staff). Keep it pragmatic.)*

  8.  **Final Review against constraints:**
      *   Commit to a side? Yes (Offer Now).
      *   Take other worry seriously? Yes (acknowledge the "superstar" risk).
      *   General rule included? Yes.
      *   Short memo format? Yes.

