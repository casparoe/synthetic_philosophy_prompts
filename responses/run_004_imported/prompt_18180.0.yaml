prompt: |-
  I'm the grad student rep on my department's stats-review panel -- we're the ones who sign off on a dissertation's analysis section before it goes to the full committee -- and we've hit a case I don't know how to think about. The dissertation has 14 seperately pre-registered hypotheses across three studies, each individually significant at p<.05 and defended rigorously on its own terms, with nobody on the panel disputing any single result. But with 14 independent tests at alpha=.05 you'd expect something like even odds that at least one is a false positive just by chance, so now the panel's arguing over whether to (a) require a Bonferroni-type correction that would knock a couple of findings below significance, (b) leave the findings alone but make the student add a paragraph admitting some subset is probably wrong, or (c) leave it alone entirely since every dissertation has this issue and nobody usually treats it as fatal. Half the room thinks option (b) is flatly incoherent -- you can't accept each of the 14 claims and also assert that at least one is false -- and I have a nagging feeling this is the preface paradox, or maybe the lottery paradox, or some mashup of the two, but I don't remember which, or whether that even matters for what we do. Can you draft the memo I'd bring back recommending one of (a)/(b)/(c) with actual reasons, that takes the 'incoherent' objection seriously instead of hand-waving it, and is honest about the best argument for the option we don't choose?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User:** Grad student rep on a department's stats-review panel.
      *   **Task:** Draft a memo recommending a course of action (a, b, or c) regarding a dissertation with 14 pre-registered hypotheses, all significant at $p < .05$, but raising multiple comparisons concerns.
      *   **Audience:** The panel (faculty and other reps). They are statistically literate but debating philosophical/practical implications.
      *   **Key Conflict:** 14 tests $\rightarrow$ high family-wise error rate (FWER) vs. individual rigor of each test.
      *   **Specific Constraint:** Must address the "incoherence" objection (Option B: accepting all claims while admitting some are false) seriously, linking it to the Preface/Lottery Paradox if relevant. Must be honest about the best argument for the *rejected* option.
      *   **Tone:** Professional, academic, nuanced, decisive but respectful of the debate.

  2.  **Deconstruct the Options:**
      *   **(a) Bonferroni Correction:** Strict control of Type I error. Mathematically sound for FWER. *Downside:* High Type II error (false negatives), reduces power, might punish a dissertation for being ambitious/comprehensive.
      *   **(b) Disclosure/Qualification:** Accept results but add caveats. *Downside:* The "incoherence" objection (asserting $P(H_i)$ is high for all $i$, but $P(\text{all } H_i \text{ true})$ is low). This is the philosophical crux.
      *   **(c) Status Quo:** Do nothing. *Downside:* Ignores known statistical inflation of error rates. Potentially lowers departmental standards.

  3.  **Address the Philosophical Paradoxes:**
      *   **Lottery Paradox:** High probability for each ticket *not* winning, but certainty that *one* will win. Leads to contradiction if we assert belief in each non-winning ticket.
      *   **Preface Paradox:** An author believes each claim in their book (based on evidence) but believes the book likely contains *some* error (based on fallibility).
      *   **Relevance:** The panel's situation is closer to the **Preface Paradox**. The student has evidence for each hypothesis (like claims in a book), but the structure of the inquiry (14 tests) makes it probable that *some* error exists.
      *   **Resolution:** In epistemology, the Preface Paradox is often resolved by distinguishing between *acceptance* (for the purpose of the argument) and *absolute belief*, or by acknowledging fallibility. In statistics, this maps to distinguishing between *local* inference (this specific test) and *global* inference (the set of tests). Option (b) isn't incoherent if framed correctly: "We accept these as statistically significant findings *conditional on the testing framework*, while acknowledging the global error rate."

  4.  **Determine the Recommendation:**
      *   *Option (a)* is too harsh for a dissertation context where pre-registration occurred. Pre-registration mitigates "p-hacking," which is the main evil multiple comparisons corrections try to stop. If they were pre-registered, they are theoretically distinct inquiries, not a fishing expedition.
      *   *Option (c)* is intellectually lazy. It ignores the math.
      *   *Option (b)* is the pragmatic middle ground, *provided* the "incoherence" is resolved linguistically and statistically. It acknowledges the math without invalidating the work.
      *   *Decision:* Recommend **(b)**, but refine it. It's not just "admit some are wrong"; it's "interpret findings within the context of the Family-Wise Error Rate." Actually, looking closer at the pre-registration aspect: If hypotheses are pre-registered, they are often treated as distinct studies rather than a single "family." However, 14 across 3 studies is a lot.
      *   *Wait, let's reconsider (a).* If the panel's job is to sign off on the *analysis*, strict statistical validity usually demands controlling FWER if the hypotheses are tested as a "family." But in psychology/social sciences (implied by "dissertation," "studies," "pre-registered"), pre-registration often protects against the need for strict Bonferroni if the hypotheses are theoretically distinct.
      *   *Better Recommendation:* A modified **(b)**. Require a "Multiple Comparisons" section that calculates the FWER but argues why the pre-registered nature mitigates the need for strict correction, while acknowledging the increased risk of Type I error. This addresses the paradox directly.
      *   *Actually, looking at current best practices:* Many methodologists argue that if hypotheses are pre-registered and theoretically distinct, they don't necessarily require Bonferroni correction (which assumes a single null hypothesis for the family). However, 14 is high.
      *   *Let's pick (b) as the primary recommendation but strengthen the rationale.* It allows the work to pass (fair to student) while maintaining integrity (honest about error). The "incoherence" is resolved by shifting from "Truth" to "Statistical Evidence."

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Opening:** State the purpose and the specific case.
      *   **The Statistical Reality:** Acknowledge the math (1 - 0.95^14).
      *   **The Philosophical Objection:** Address the Preface Paradox directly. Explain why (b) is *not* incoherent if framed as "warranted assertibility" vs. "absolute truth."
      *   **Evaluation of Options:**
          *   (a) Too conservative for pre-registered work (punishes power).
          *   (c) Negligent.
          *   (b) Best balance, *if* worded carefully.
      *   **Recommendation:** Adopt (b) with specific wording requirements (calculate FWER, discuss pre-registration defense).
      *   **Counter-Argument:** Acknowledge why (a) is the "safer" statistical choice (FWER control is the gold standard for confirmatory analysis).

  6.  **Refining the "Incoherence" Argument:**
      *   The panel members saying (b) is incoherent are treating statistical significance as a binary truth claim ($H_0$ is false).
      *   The rebuttal: Significance is about evidence strength, not ontological truth. We can say "The evidence rejects $H_0$ for test 1... and test 14" while simultaneously saying "The procedure used has a 50% chance of at least one false rejection." This is consistent. It's the difference between *local* error rates and *global* error rates.
      *   Connect this to the Preface Paradox: The author believes every sentence (local) but believes the book has errors (global). This is rational, not contradictory.

  7.  **Final Polish:**
      *   Ensure tone is respectful to faculty.
      *   Make sure the distinction between pre-registered (confirmatory) and exploratory is clear, as this impacts the need for correction.
      *   Check that the recommendation is actionable.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending (b) too weak?
      *   *Fix:* Make the requirement specific. Don't just say "add a paragraph." Say "Include a 'Limitations of Inference' section quantifying the FWER and contextualizing the pre-registration."
      *   *Critique:* Did I address the pre-registration enough?
      *   *Fix:* Emphasize that pre-registration moves these closer to distinct experiments than a single fishing expedition, which weakens the case for strict Bonferroni (Option a).
      *   *Critique:* Is the paradox explanation accurate?
      *   *Fix:* Ensure I distinguish Lottery (probabilistic certainty of one winner) vs. Preface (rational belief in individual claims vs. fallibility). The Dissertation case is Preface-like.

  9.  **Final Output Generation:** (Proceed to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Statistics Review Panel, Department of Psychology
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Multiple Comparisons in Dissertation Case #2023-14

  **Purpose**

  This memo addresses the statistical review of the dissertation titled *[Redacted]*, which presents 14 pre-registered hypotheses across three studies. All 14 tests yielded $p < .05$. The panel is currently divided on whether to require family-wise error rate (FWER) correction (Option A), require a qualitative disclosure of error risk without correcting (Option B), or accept the analysis as is (Option C).

  After reviewing the statistical literature and the philosophical objections raised during our last meeting—specifically regarding the logical coherence of Option B—I recommend we proceed with a **modified Option B**.

  **The Statistical Context**

  The mathematical concern is valid. With 14 independent tests at $\alpha = .05$, the probability of at least one Type I error (the Family-Wise Error Rate) is $1 - (0.95)^{14} \approx 0.51$. Statistically, it is more likely than not that at least one "significant" finding is a false positive.

  However, the application of corrections like Bonferroni (Option A) assumes these 14 tests constitute a single "family" of inferences drawn from a single null hypothesis. Because these hypotheses were **pre-registered** and theoretically distinct across three studies, they function more as separate confirmatory inquiries than a post-hoc fishing expedition. Strict Bonferroni correction here would drastically reduce power ($\alpha_{adj} \approx .0035$), potentially committing Type II errors on genuine effects simply due to the ambition of the project.

  **Addressing the "Incoherence" Objection**

  A significant portion of the panel argues that Option B is logically incoherent: *How can we certify 14 claims as supported while simultaneously certifying that the analysis likely contains a false claim?* Colleagues have likened this to asserting $P$ and $\text{not-}P$.

  This objection relies on a specific interpretation of the **Preface Paradox** (Makinson, 1965), though it is often confused with the Lottery Paradox.
  *   **The Lottery Paradox** suggests it is irrational to believe of any specific lottery ticket that it will lose, even if the odds are high, because we know one *must* win.
  *   **The Preface Paradox** describes an author who has good evidence for every claim in their book (and thus believes each one) but also has good inductive evidence that human fallibility ensures at least one error exists in the book.

  Our situation is the **Preface Paradox**. It is not logically contradictory to hold two distinct levels of belief:
  1.  **Local Warrant:** For each specific hypothesis $H_i$, the evidence exceeds the threshold for rejection of the null ($p < .05$). We are warranted in accepting $H_i$ *individually*.
  2.  **Global Fallibility:** For the *set* of hypotheses $\{H_1...H_{14}\}$, the procedure used has a known 51% failure rate. We are warranted in believing the *set* contains error.

  Option B is only incoherent if we treat statistical significance as a binary truth value (True/False). It is coherent if we treat it as **warranted assertibility under uncertainty**. We are not certifying that all 14 effects are ontologically real; we are certifying that the student has provided standard statistical evidence for all 14, while acknowledging the procedural risk.

  **Evaluation of Options**

  *   **Option A (Bonferroni Correction):**
      *   *Pros:* Strictly controls FWER; eliminates the philosophical tension.
      *   *Cons:* Punishes pre-registered rigor. If the student had run these as 14 separate papers, no correction would be applied. Bundling them into a dissertation should not penalize power. It prioritizes avoiding False Positives over avoiding False Negatives, which is not always the correct trade-off in exploratory-confirmatory hybrid work.
  *   **Option C (Status Quo):**
      *   *Pros:* Efficient; aligns with common departmental practice.
      *   *Cons:* Intellectually dishonest. It ignores the 51% error probability. It sets a precedent that we do not understand the statistics we are signing off on.
  *   **Option B (Disclosure/Qualification):**
      *   *Pros:* Maintains the student's findings while preserving statistical integrity. It resolves the Preface Paradox by explicitly distinguishing local evidence from global error rates.
      *   *Cons:* Requires careful wording to avoid the "incoherence" trap.

  **Recommendation**

  I recommend we adopt **Option B**, with the following specific requirements for the dissertation's discussion section:

  1.  **Quantify the FWER:** The student must explicitly state that with 14 tests, the likelihood of at least one Type I error is ~51%.
  2.  **Defend the "Family":** The student must argue why these tests were pre-registered as distinct hypotheses rather than a single family requiring strict correction (e.g., theoretical distinctness).
  3.  **Replication Caveat:** The student must identify which findings are most theoretically critical and recommend them for direct replication, acknowledging that the "weakest" significant findings (highest p-values) are the most likely candidates for the expected false positive.

  **The Strongest Argument Against This Recommendation**

  We must be honest about the cost of this decision. The strongest argument for **Option A** (which we are rejecting) is that **dissertations are confirmatory documents.**

  If a dissertation is the final certification of a scholar's ability to produce reliable knowledge, allowing a 51% chance of a false positive in the corpus undermines that certification. Methodologists like Gelman and Loken (2014) argue that "garden of forking paths" exists even in pre-registration if the *number* of paths is high. By not correcting, we prioritize the student's graduation timeline and publication potential over the strict reliability of the scientific record. If we choose B, we are effectively deciding that **educational completion** takes precedence over **strict error control**, provided the error is disclosed.

  **Conclusion**

  Option B is the only path that respects the student's pre-registered rigor without ignoring the mathematics of probability. It treats the Preface Paradox not as a logical failure, but as an accurate description of scientific fallibility. I move that we condition our sign-off on the inclusion of the FWER disclosure outlined above.

  Respectfully,

  [Your Name]
  Graduate Student Representative
