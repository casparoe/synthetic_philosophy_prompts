      *   **Godfrey-Smith Distinction:**
          *   Elena: I'm a *methodological* adaptationist. I don't claim everything is perfect. I claim it's the best place to start.
          *   Marcus: But methodological habits become empirical beliefs. You stop looking for constraints.
      *   **Resolution/Nuance:** They won't agree completely, but they should find common ground on *rigor*. The need for "independent adjudication."

  6.  **Refining the Argument (Self-Correction during drafting):**
