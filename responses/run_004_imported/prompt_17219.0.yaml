      *   *Pluralist:* Let's call him **Marcus**. He worries about confirmation bias. He emphasizes developmental biology (evo-deco) and historical contingency. He wants positive evidence for selection, not just the failure to reject a model.
      *   *Setting:* A quiet corner of a conference center or a university common room. Coffee in hand. Retired vibe (since the user is retired), but the characters can be active or emeritus. Let's make them emeritus colleagues to allow for candid reflection.

  3.  **The Specific Case:**
