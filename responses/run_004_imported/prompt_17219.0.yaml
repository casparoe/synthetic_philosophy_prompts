answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Rain taps against the window. Two emeritus professors, ELENA and MARCUS, are nursing coffees. Elena specialized in behavioral ecology and optimality modeling; Marcus in evolutionary morphology and phylogenetics. They have been colleagues for forty years.*

  **Elena:** I saw you reading the *Spandrels* reprint in the library yesterday. Forty years on, and it still causes a riot in the seminar room.

  **Marcus:** Because the riot is still necessary, El. Open any issue of *Evolution* or *Proc B*. Half the papers are still explaining why the blue spot on the lizard's toe is for species recognition, without ever asking if the spot is just a structural byproduct of the pigment pathway. The default setting is still "it's an adaptation."

  **Elena:** And the default setting in physics isn't "friction exists." It's "assume a vacuum, then add friction." If you start with friction, you never get the equation of motion. In behavioral ecology, we learned that assuming optimization is the only way to get a null hypothesis that bites. If I watch an oystercatcher and assume it forages randomly, I learn nothing. If I assume it maximizes calorie intake per unit time, I get a prediction. When it fails, I learn something real—maybe predation risk, maybe interference.

  **Marcus:** But that's behavior. It's plastic. You're talking about morphology. Take Gould's favorite example: the human chin. The adaptationist literature is full of papers on how the chin is for speech reinforcement, or chewing leverage, or sexual selection. Gould said it's a spandrel. The result of two growth fields of the mandible intersecting during resorption. No function. Just architectural leftover.

  **Elena:** Okay, let's hash that out. Not the philosophy, the evidence. You're Marcus the Pluralist. I'm the dirty Adaptationist. Convince me the chin isn't an adaptation.

  **Marcus:** Gladly. First, I look at the phylogeny. The mental protuberance is unique to *Homo sapiens*. Neanderthals didn't have it. *H. erectus* didn't. If it's crucial for speech or chewing, why did we manage for two million years without it?

  **Elena:** That's a comparative argument, I'll grant you. But unique traits are often the most adaptive. They're the recent innovations. If I were modeling the chin, I'd look at the biomechanics. There are models suggesting the chin redistributes stress during mastication. I can build a finite element analysis. If the stress distribution in a chin-less mandible is significantly worse under load, that's evidence for selection.

  **Marcus:** And if I tweak the load parameters, I can make the stress distribution look "optimal" for anything. That's the problem, El. It's the curve-fitting issue. You build a model, you tweak the constraints until the data fits, and then you claim the model is tested. But you haven't tested the *selection pressure*. You've only tested the mathematical consistency of your story.

  **Elena:** That's a caricature of optimality modeling. A good model makes risky predictions. If the chin is for stress distribution, then species with higher bite forces should have more pronounced chins, all else being equal. Or, within humans, bone density in the mental region should correlate with masticatory stress markers. If I find no correlation, the model dies. That is testable.

  **Marcus:** But you're ignoring the developmental null. Before you test the adaptation hypothesis, you have to test the constraint hypothesis. We know the chin forms because the mandible resorbs bone on the anterior face as growth stops. If that resorption process is a developmental inevitability given our jaw size and tooth reduction, then the "adaptation" model is starting on the wrong foot. You're trying to explain why the spandrel is painted blue, when you haven't asked if the arch was necessary to hold up the dome.

  **Elena:** So how do you test the constraint? "It was inevitable" sounds just as much like a just-so story as "It was for speech."

  **Marcus:** It's not if you look at the genetics and ontogeny. If the chin is a byproduct, the genetic loci associated with it should be pleiotropically linked to general mandibular growth, not specific to the protuberance. If it's an adaptation, we should see signatures of recent positive selection in regulatory regions specific to that morphological feature. We can look for selective sweeps.

  **Elena:** Okay, now we're talking. So you want independent evidence. Not just that the trait *could* be useful, but that the genome *says* it was selected.

  **Marcus:** Exactly. And so far? The genetic evidence is murky. But here's where I think you adaptationists get stuck. You treat "not adaptation" as a failure of imagination. If you can't find the function yet, you assume we haven't looked hard enough.

  **Elena:** I treat it as a methodological stance. Peter Godfrey-Smith broke this down, remember? There's *empirical* adaptationism (most traits are adaptations), *explanatory* adaptationism (adaptation is the most important cause), and *methodological* adaptationism (assume adaptation to generate hypotheses). I am a methodological adaptationist. I don't care if 50% of traits are spandrels. I care that assuming adaptation is the most productive heuristic for finding out which ones aren't.

  **Marcus:** I've read Godfrey-Smith. The problem is that methodological habits calcify into empirical beliefs. If you teach grad students to always start with the optimality model, they stop looking for developmental constraints. They treat drift as a "null of last resort." But drift isn't a last resort; it's the null of first instance. In a finite population, neutral change is the baseline. Adaptation is the special explanation that requires special evidence.

  **Elena:** But "drift" is a trash can. If I say "the chin is drift," I'm saying "it has no specific cause other than sampling error." That stops inquiry. If I say "the chin optimizes stress," I'm making a claim about the interaction between the organism and the environment. That drives fieldwork.

  **Marcus:** Does it? Or does it drive computer modeling? Look, let's go back to your shorebirds. You modeled foraging. You assumed they maximize energy. Sometimes they did, sometimes they didn't. When they didn't, you added constraints—predation risk, gut capacity. But you never asked, "Maybe the bird isn't maximizing anything? Maybe its movement rules are just a fixed action pattern that works 'well enough'?"

  **Elena:** We did ask that. We compared the optimal model to a "random walk" or a "fixed rule" model. If the fixed rule performed as well as the optimizer, we preferred the fixed rule. Parsimony. But usually, the optimizer fit better. Here's the thing, Marcus: Nature is a ruthless editor. Even if a trait starts as a spandrel, if it costs energy to maintain, selection will prune it. If the chin costs calcium and developmental time, and it does nothing, why hasn't it been lost?

  **Marcus:** Because it's not costly enough to matter. That's the "nearly neutral" zone. If the cost is below the threshold of selection efficacy, drift rules. You adaptationists assume selection is omnipotent. It's not. It's limited by population size, by genetic architecture, by history.

  **Elena:** I'm not assuming omnipotence. I'm assuming that for complex, metabolically expensive structures, the burden of proof is on the claim that it's useless. But I'll concede this: The testability charge from Gould and Lewontin stuck because too many people stopped at the model. They didn't do the independent adjudication.

  **Marcus:** "Independent adjudication." That's the key phrase.

  **Elena:** Right. If I model the chin as a sexual signal, I can't just show it correlates with mating success. I need to manipulate it. Shave the chin? (Laughs) Impossible in humans. But in a model organism with a similar trait, can I alter it and measure fitness?

  **Marcus:** Or, use the comparative method properly. Not just "who has a chin," but "what is the evolutionary trajectory of jaw resorption?" If the chin appears in every lineage that undergoes specific jaw shortening, regardless of ecology, that's a constraint. If it appears only in lineages with specific social structures, that's adaptation.

  **Elena:** So we agree on the standard of evidence. The disagreement is the prior. You start with a prior that says "Constraints and drift are likely." I start with a prior that says "Selection is likely."

  **Marcus:** I start with a prior that says "History is likely." Everything is built on something else. The chin is built on the mammalian jaw architecture. You can't understand it without understanding the blueprint. You adaptationists look at the building and ask, "What is this room for?" I look at the blueprint and ask, "Why did the architect put the wall here?" Sometimes the room is there because the wall had to go somewhere.

  **Elena:** But the architect is Natural Selection.

  **Marcus:** Natural Selection is the editor, not the author. Development writes the first draft.

  **Elena:** (Takes a sip of coffee) You know, in the 80s, I would have fought you harder on this. I would have said your developmental constraints were just "unidentified selection pressures." But watching the field... the evo-deco revolution did show that some things really are structurally inevitable. The variation isn't always there for selection to act on.

  **Marcus:** And I've come to admit that your optimality models, when they *fail*, are often more interesting than when they succeed. The deviation from the model is where you find the constraint.

  **Elena:** So maybe Godfrey-Smith was right. It's not about which view is true. It's about which methodology yields the best cash value.

  **Marcus:** Provided we don't confuse the methodology with the truth. The danger isn't modeling. The danger is believing the model is the territory. When a paper comes out titled "The Adaptive Significance of X," and the abstract contains no mention of phylogeny, development, or population parameters... that's when I reach for my red pen.

  **Elena:** And when a paper claims "X is a spandrel" based solely on the fact that they can't think of a function... that's when I reach for mine. Absence of evidence isn't evidence of absence.

  **Marcus:** Agreed. So, for the chin?

  **Elena:** We need a finite element analysis of stress in *H. sapiens* vs. Neanderthals, coupled with a GWAS study looking for selection signatures on mental protuberance loci.

  **Marcus:** And we need a developmental model of mandibular resorption rates across primates to see if the chin is a mathematical inevitability of our specific growth trajectory.

  **Elena:** If the developmental model predicts the chin perfectly without selection parameters, you win.

  **Marcus:** If the GWAS shows a hard sweep on chin-specific regulators, you win.

  **Elena:** And if neither?

  **Marcus:** Then it's probably a bit of both. A structural byproduct that was later co-opted. Exaptation.

  **Elena:** (Smiles) Gould would hate that. He wanted it to be one or the other.

  **Marcus:** Nature rarely reads the philosophy.

  **Elena:** No. She doesn't. Cheers, Marcus.

  **Marcus:** Cheers, Elena.
