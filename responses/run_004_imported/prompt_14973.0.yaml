answer: |-
  **The Swamp and the Signal: Why Teleosemantics Should Bite the Bullet**

  Teleosemantics, championed by philosophers like Ruth Millikan and David Papineau, offers one of the most ambitious projects in the philosophy of mind: to naturalize intentionality. It proposes that the content of a mental state—what a belief is *about*—is determined by the biological function for which the mechanism producing that state was evolutionarily selected. If a neural state was selected for tracking tigers, its content is <tiger>. However, this historical reliance invites a famous counterexample: Donald Davidson's "Swampman." In this thought experiment, a lightning strike in a swamp accidentally assembles a molecule-for-molecule duplicate of a human being. This creature, Swampman, behaves exactly like a person but lacks any evolutionary history. According to strict teleosemantics, Swampman has no thoughts, speaks no meaningful language, and possesses organs with no proper functions. To many, this conclusion is absurd. To the teleosemanticist, it is a necessary truth. While the Swampman objection exposes a deep tension between our internalist intuitions and externalist theory, it is not a fatal problem. Defenders of teleosemantics are right to bite this bullet, because doing so is the only way to preserve a non-magical account of normative representation.

  The case against teleosemantics rests on the sheer violence it does to our pre-theoretical intuitions about the mind. Davidson's original argument leverages the principle of supervenience: if two entities are physically identical, they must be mentally identical. If Swampman is physically indistinguishable from a human, he screams when pinched, says "That's a tree" when pointing at a tree, and navigates the world successfully. To deny him thought seems to be a form of prejudice based on genealogy rather than capacity. If content is fixed by history, then mental properties do not supervene on the physical present; they depend on the invisible past. This leads to the "light switch" problem: if a history-less duplicate suddenly acquires a history (perhaps by surviving and reproducing), does content suddenly switch on? Furthermore, the implication for biology seems equally untenable. If Swampman's heart stops, teleosemantics says it has not *malfunctioned* because the organ has no *proper function*. It merely ceased moving. This strips biology of its normative language, suggesting that without a lineage, there is no distinction between a healthy organism and a complex machine.

  However, the strength of this objection relies on conflating causal capacity with normative function. The teleosemanticist argues that the intuition pump is leaking. The core problem teleosemantics aims to solve is the problem of error: how can a physical state be *wrong*? A purely structural or causal theory of content struggles here. If a mental state represents whatever causes it, then when Swampman sees a cow and thinks "horse," his thought is caused by a cow, so it represents a cow. He cannot be wrong. Teleosemantics solves this by appealing to history: the state represents <horse> because it was selected for tracking horses, even if a cow triggers it now. This introduces a standard of correctness independent of the immediate causal environment.

  To preserve this solution, the teleosemanticist must accept that standards of correctness require a history of selection. Millikan's analogy of the artifact is instructive here. Imagine a knife that forms by chance when molten metal cools in a specific shape. It is sharp and can cut butter. However, it is not *for* cutting butter. It has no proper function. If it melts, it has not malfunctioned; it has just changed shape. Swampman is the biological equivalent of this accidental knife. He has the *capacity* to process information and pump blood, but he lacks the *teleology* that grounds meaning and function. To grant Swampman content simply because he looks like us is to invite magic into the system. It suggests that arrangement alone generates "aboutness," without explaining where the normativity comes from. If we reject the Swampman verdict, we risk severing the link between natural selection and meaning, leaving content as a mysterious emergent property that physics cannot explain.

  Moreover, the "fatal" nature of the objection dissolves when we recognize that Swampman is a transient impossibility in a naturalistic world. Teleosemantics is a theory about actual agents embedded in actual ecosystems. Swampman is a philosophical zombie generated by a scenario that violates the laws of probability so severely it borders on the miraculous. A theory of biological function is not obligated to account for entities that cannot exist within the framework of biology. Even if Swampman did appear, the teleosemanticist can argue that he would begin acquiring proper functions immediately through a process of learning and reinforcement (a "derived proper function"). But at the moment of creation, the verdict stands: he is a hollow shell. This is not a bug; it is a feature that clarifies the distinction between *simulating* thought and *having* thought. Just as a perfect simulation of a storm inside a computer is not wet, a perfect simulation of a human without evolutionary history is not a thinker.

  Therefore, the Swampman objection is not fatal to teleosemantics; it is a clarifying stress test. The objection wins on the grounds of intuition, but teleosemantics wins on the grounds of explanatory power. If we side with Davidson, we save the intuition that physical duplicates share mental states, but we lose the ability to naturalize normativity. We are left with a view where "misrepresentation" is inexplicable. If we side with Millikan, we sacrifice the intuition that structure guarantees content, but we gain a rigorous account of how biological systems track truth and fail to do so. The cost of admitting that Swampman is a zombie is high, but the cost of abandoning the historical account of function is higher: it leaves the normativity of mind unexplained.

  Ultimately, the verdict must be in favor of the teleosemanticist. The Swampman intuition relies on a folk-psychological assumption that "looking like a thinker" is sufficient for "being a thinker." Teleosemantics reveals this assumption to be superficial. Meaning and function are not intrinsic properties of matter; they are relational properties grounded in history. To deny this is to retreat from naturalism. While it feels strange to say Swampman's heart cannot malfunction, it is stranger to claim that a random arrangement of atoms possesses normative status simply by mirroring a designed one. Teleosemantics requires us to revise our intuitions, not our theory. The bullet is hard, but it is the only one that keeps the project of naturalizing the mind on track. Swampman does not kill teleosemantics; he merely reveals that our intuitions about meaning are often as accidental as he is.
