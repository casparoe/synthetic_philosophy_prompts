  2.  **Deconstruct the Positions:**
      *   **Teleosemantics (Millikan, Papineau, Neander):** Content is determined by evolutionary history (etiology). A state represents $X$ because it was selected for tracking $X$. Function is historical.
      *   **Swampman (Davidson):** A duplicate created by random quantum fluctuation. Physically identical to a human but lacks evolutionary history.
      *   **The Clash:** Teleosemantics says Swampman = Zombie (no content, no function). Intuition says Swampman = Person (thinks, speaks, functions).
      *   **The "Fatal Problem" Side:** It violates strong intuitions about supervenience and internalism. It makes content extrinsic in a way that seems absurd (two physically identical beings, one thinks, one doesn't). It undermines the explanatory power of psychology/biology for the duplicate.
      *   **The "Bullet-Biting" Side:** It preserves the naturalistic rigor of the theory. It highlights that *meaning* and *function* are normative/historical concepts, not just structural ones. It avoids magic (how can structure alone create normativity?). It forces us to refine our intuitions about what "thought" really is.

  3.  **Outline the Essay:**
      *   **Title:** Needs to be engaging and relevant.
      *   **Introduction:**
          *   Define Teleosemantics (selected-effects).
          *   Introduce Swampman.
          *   State the conflict (Swampman has no content/function).
          *   **Thesis/Verdict:** While counterintuitive, the Swampman objection is not fatal; it is a necessary cost of a robust naturalistic account of normativity. Defenders should bite the bullet, but with a nuanced explanation of *why* intuition fails.
      *   **Body Paragraph 1: The Case for "Fatal Problem" (The Intuition Pump).**
