      *   **Body Paragraph 2: The Teleosemantic Defense (Why the Bullet is Biteable).**
          *   The Normativity Constraint: Function and content require a standard of correctness. History provides this; structure alone does not.
          *   Millikan's argument: Without selection, there is no "misrepresentation," only difference.
          *   Analogy: A counterfeit bill vs. a real bill. Physically identical, but different status.
      *   **Body Paragraph 3: Addressing the Biological Function Aspect.**
          *   The heart argument. Is it really plausible a Swampman heart has no function?
          *   Counter: It has a *systemic* role, but not a *proper* function. It can't "fail" in the normative sense, only stop.
          *   Why this matters: Distinguishes between causal role and teleological function.
      *   **Body Paragraph 4: Refining the Verdict (The "Derivative Content" Compromise).**
          *   Maybe Swampman gains content quickly? (Learning/Selection starts immediately).
          *   But initially, the verdict holds.
          *   Why this is better than abandoning teleosemantics: Abandoning it leads to magic or circularity.
      *   **Conclusion:**
          *   Restate thesis.
          *   Summarize why the cost is worth paying (naturalism > intuition).
          *   Final punchline: Swampman reveals the limits of intuition, not the limits of the theory.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start strong. Teleosemantics tries to naturalize meaning. Swampman is the classic attack. Thesis: It's a feature, not a bug.
      *   *The Attack:* Focus on Davidson's original point. It feels absurd to say Swampman doesn't think. It violates the principle of supervenience (mental depends on physical). If physics is the same, mind should be the same.
      *   *The Defense:* Focus on Millikan. The key is *normativity*. How do we distinguish error from difference? Only history does that. A map doesn't represent territory just by looking like it; it needs a maker/user. Swampman is a "glitch," not a system.
      *   *The Heart:* This is often the harder pill to swallow. But distinguish "capacity" from "function." A rock can prop a door open (capacity), but its function isn't to prop doors. Swampman's heart pumps, but it wasn't *designed* (by evolution) to pump.
