answer: |-
  You are right to spot the lineage. Evidential Cooperation in Large Worlds (ECL) is indeed the cosmological great-grandchild of Hofstadter's superrationality. If superrationality is the seed, ECL is the tree that grew once planted in the soil of modern acausal decision theory (like Evidential Decision Theory or Functional Decision Theory) and modern cosmology.

  However, to dismiss ECL as merely "superrationality with jargon" misses the specific mechanical problems ECL was built to solve. The "huge world" and "diverse values" constraints are not just flavor text; they are mathematical necessities that allow the argument to function where plain superrationality breaks down.

  Here is exactly where the two concepts part ways, and why the "Large World" assumption does real conceptual work.

  ### 1. Logical Identity vs. Statistical Correlation
  **Superrationality** relies on a strong assumption of **logical identity**. Hofstadter's argument works best when the agents are effectively clones. If I am superrational, and I know you are superrational, and we face the same problem, we will run the same "mental algorithm" and output the same move. My choice *determines* yours because we are the same reasoner instantiated twice.

  **ECL** relaxes this to **statistical correlation**. ECL acknowledges that agents across the multiverse are *not* identical. They have different histories, different architectures, and crucially, **different utility functions**.
  *   **The Divergence:** Superrationality struggles when utility functions diverge. If I value Paperclips and you value Staples, superrationality doesn't immediately tell me why I should help you get Staples. Our "algorithms" are optimizing for different goals, so why would they correlate in a way that benefits me?
  *   **The ECL Fix:** ECL argues that while our *goals* differ, our *decision procedures* (as optimizers) correlate. If I am the kind of agent who cooperates acausally, it is *evidence* that other optimizing agents in the universe are also the kind who cooperate acausally. The "Large World" assumption is required here to make this statistical correlation robust enough to matter. In a small world, the correlation between me and one other dissimilar agent might be too weak to justify the cost of cooperation. In a universe with $10^{50}$ agents, even a tiny correlation coefficient yields massive expected value.

  ### 2. Coordination vs. Acausal Trade
  **Superrationality** is typically framed as a **coordination problem** (like the Prisoner's Dilemma). We both want the same outcome (Mutual Cooperation), but we are tempted to defect. The solution is to realize that "Defect" leads to (Defect, Defect), which is worse for both of us. We are coordinating on a shared peak of a shared utility landscape.

  **ECL** is fundamentally a **trade problem**. This is the biggest conceptual shift.
  *   **The Divergence:** In ECL, I literally *cannot* achieve my primary goals in your local region, and you cannot achieve yours in mine. We are not coordinating to achieve *Joint Outcome A*. I am helping you achieve *Outcome B* (which I don't care about intrinsically) in exchange for you helping me achieve *Outcome A* (which you don't care about intrinsically).
  *   **The Work "Diverse Values" Does:** Plain superrationality assumes symmetric payoffs. ECL explicitly models asymmetric axiologies. The "Large World" allows for a division of labor across spacetime. I specialize in promoting my values here; you specialize in promoting your values there. We "trade" influence. Superrationality doesn't naturally account for this; it assumes we are playing the same game for the same points. ECL recognizes we are playing different games but can bet on the outcomes of each other's games.

  ### 3. The Necessity of Scale (The "Large World" Constraint)
  This is the most critical technical distinction.
  *   **Superrationality** claims to work in a room with two people. The logic is binary: either our reasoning is linked, or it isn't.
  *   **ECL** *requires* the universe to be vast (potentially infinite) for the math to beat Causal Decision Theory (CDT).

  **Why?** Because ECL relies on **marginal impact**.
  If I incur a cost $C$ to help a distant value system, I need the expected benefit $B$ to outweigh $C$.
  In a small world, the number of agents whose decisions correlate with mine is small. Even if they help my values, the total impact is low.
  In a "Large World" (e.g., an eternal inflation multiverse), there are infinitely many agents. Even if the probability that any *specific* agent correlates with me is microscopic, the *sum* of all correlated agents is infinite (or sufficiently massive).
  Therefore, the "Large World" isn't just context; it is the multiplier that turns a negligible evidential link into a dominant decision-theoretic strategy. Without the large world assumption, ECL collapses back into CDT (don't cooperate, you can't change their causal outcome). Superrationality does not require this cosmological scale to function.

  ### 4. Formalization of the "Black Box"
  Hofstadter's superrationality was a philosophical heuristic. It was vague about *why* the correlation exists. It essentially said, "Magic logic connects identical reasoners."

  ECL is embedded in rigorous decision-theoretic frameworks (specifically **Evidential Decision Theory** and **Functional Decision Theory**).
  *   **The Divergence:** ECL explicitly tackles the "Why should I care about evidence?" objection. CDT proponents argue, "My choice doesn't *cause* theirs, so why should I care?" ECL responds using the formalism of conditional probabilities in a specific cosmological model. It treats the agent's decision as an observation of the output of a specific algorithm type distributed across the universe.
  *   **The Work:** This allows ECL to handle "noise." Superrationality breaks if the other guy is 99% like you but 1% different. ECL can model the degree of correlation ($\rho$) and calculate the break-even point where cooperation becomes rational based on the size of the world ($N$) and the strength of correlation ($\rho$). It turns a philosophical intuition into a calculable risk.

  ### Summary: Where they part ways
  They part ways at the intersection of **Identity** and **Scale**.

  1.  **Superrationality** says: "We are the **same**, so we will do the **same**, so we should coordinate on our **shared** goal." (Works in small worlds, requires high similarity).
  2.  **ECL** says: "We are **different** optimizers in a **huge** population, so our decision algorithms correlate statistically, so we should **trade** influence over our **divergent** goals." (Requires large worlds, thrives on diversity).

  The "huge world full of wildly different value systems" is not a coat of paint; it is the engine. Without the huge world, the evidential link is too weak to justify the cost of helping strangers. Without the different value systems, you don't need ECL; you just need standard coordination. ECL is specifically the solution to the problem: *How do I gain leverage over my values in a universe where I am causally isolated from most of the stuff that matters to me?* Superrationality never asked that question.
