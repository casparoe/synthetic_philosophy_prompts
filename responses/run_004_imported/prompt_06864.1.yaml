      *   **Mechanism:** Sorites-style gradual change (e.g., feeling cold warming up).
      *   **Key Premise:** Margin for Error Principle. If you know you feel cold at time $t_i$, and $t_{i+1}$ is indistinguishable from $t_i$, you must know you feel cold at $t_{i+1}$ (otherwise your belief at $t_i$ wasn't safe/reliable).
      *   **Result:** Since eventually you *don't* feel cold, you couldn't have known you felt cold at the start of the series without implying you know it at the end (contradiction).
      *   **Implication:** KK principle fails; infallible self-knowledge fails for gradual/perceptual states.

  3.  **Deconstruct Descartes' Epistemology (Relevant Parts):**
