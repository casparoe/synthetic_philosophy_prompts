      *   **Transparency/Infallibility:** The mind is transparent to itself. "I think, therefore I am" (*Cogito, ergo sum*).
      *   **Clear and Distinct Perception:** The standard for certainty.
      *   **Sensations vs. Intellection:** Sensations (like feeling cold) are often "confused" ideas involving the mind-body union. Intellectual acts (doubting, understanding, willing) are pure modes of thought.
