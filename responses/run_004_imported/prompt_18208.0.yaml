answer: |-
  The standard rule of thumb in introductory statistics—that one should always trust the stratified (within-group) result—is based on the assumption that the third variable is a **confounder**. However, this rule fails when the third variable is a **mediator** (or a collider). In these cases, stratification is not a correction; it is a distortion that blocks the causal mechanism or induces selection bias.

  ### Why the Rule Fails: The Mediator Case
  To understand why the pooled data can be the correct answer, we must distinguish between the **Total Effect** (the overall impact of a treatment) and the **Direct Effect** (the impact excluding specific pathways). Stratifying by a mediator eliminates the Total Effect by holding the mechanism constant.

  **The Concrete Scenario: The Blood Pressure Drug**
  Consider a new drug ($D$) intended to prevent heart attacks ($H$). The drug works through two pathways:
  1.  **The Mechanism (Mediator):** The drug successfully lowers blood pressure ($B$), and lower blood pressure significantly reduces the risk of heart attacks ($D \rightarrow B \rightarrow H$).
  2.  **The Side Effect (Direct):** The drug has a toxic chemical component that slightly increases heart attack risk independent of blood pressure ($D \rightarrow H$).

  **The Data Paradox:**
  *   **Pooled Data (The Total Effect):** In the general population, patients who take the drug have a lower rate of heart attacks. The benefit of lowering blood pressure outweighs the toxicity. The pooled data correctly shows the drug is **effective**.
  *   **Stratified Data (The Direct Effect):** If we stratify by blood pressure, we compare patients with the *same* blood pressure levels.
      *   Among patients with **Low BP**: Those who took the drug (whose BP was lowered by the drug) have a higher risk of heart attacks than those who didn't (who have naturally low BP), because the drug-takers are suffering from the toxicity.
      *   Among patients with **High BP**: Those who took the drug (for whom the drug failed) have a higher risk than those who didn't, again due to the toxicity.
      *   **Result:** Within every blood pressure group, the drug appears **harmful**.

  **The Mistake:** Stratifying by blood pressure asks a counterfactual question: "What is the effect of the drug if it *didn't* lower blood pressure?" For a patient deciding whether to take the medication, this is irrelevant. They care about the total effect—whether the drug works *through* its mechanism. Therefore, the pooled data provides the causally correct answer for decision-making.

  ### The Intuitive Graphical Feature
  To determine whether you should trust the stratified or the pooled data, look at the direction of the arrows in the causal graph relative to the treatment variable ($X$) and the third variable ($Z$).

  *   **Stratify if $Z$ is a "Common Cause" (Confounder):** 
      If the arrows point **away** from $Z$ toward both the treatment and the outcome ($Z \rightarrow X$ and $Z \rightarrow Y$), $Z$ is a pre-existing difference that caused people to be in the treatment group. You must stratify to "level the playing field."

  *   **Do Not Stratify if $Z$ is a "Consequence" (Mediator):** 
      If the arrows point **from** the treatment **to** $Z$ and then to the outcome ($X \rightarrow Z \rightarrow Y$), $Z$ is a result of the treatment. Stratifying "blocks the path" of the treatment's success. You must use the pooled data to see the full effect.

  **Summary Rule:** If the third variable is a **cause** of the treatment assignment, stratify. If the third variable is an **effect** of the treatment, do not stratify.
