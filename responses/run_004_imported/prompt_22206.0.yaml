  ### The Scene Draft

  Mira swirled the dregs of her Pinot, the glass leaving a lipstick stain on the rim. She was holding court at the corner of the table, her brother-in-law, David, politely trapped in the seat next to her.

  "Okay, listen," Mira said, pointing a fork at him. "Kripke says some things are true in every single universe, but you still need to go look at the world to find them out. Necessary, but a posteriori."

  David nodded, chewing a piece of chicken. "Sure. Like... water is wet?"

  "No, no, that's properties. I mean identity." Mira leaned in. "Take Elton John. Elton John is Reg Dwight. That's his birth name. Two names, one guy."

  "Okay..."

  "Now, did we need to check a birth certificate to know that?"

  "I guess."

  "Right. Empirical. But once we know it, it's locked. In every possible world where that man exists, Elton *is* Reg. He couldn't be someone else. The names stick to the skin, not the job." Mira tapped the table. "That's necessary. It couldn't be otherwise."

  David smiled, relieved to have passed the test. "Makes sense. Elton is Reg."

  "But," Mira said, her voice dropping an octave, the fork now hovering over his chest. "Watch this. I say: *'Fiona's husband is David.'*"

  David blinked. "Well... yeah. I am."

  "Grammatically, it looks the same. X is Y. But it's not the same kind of truth." Mira's eyes were glassy, intense. "'Fiona's husband' isn't a name, Dave. It's a description. It's a job title. It means 'The guy who married Fiona.'"

  She took a breath, the room spinning just enough to make the distinction feel like a cliff edge.

  "In another life, Fiona meets someone else at a bar. She marries him. In that life, 'Fiona's husband' is *that* guy. But 'David' is still *you*. So in that life, 'Fiona's husband is David' is false. It's contingent. It relies on things happening a certain way."

  She sat back, letting the fork clatter onto the plate.

  "If I say 'My husband is [Husband's Name],' I'm treating 'My husband' like a name. Like it was written in the stars. But it's not. It's just a description of who showed up to the altar. And descriptions... descriptions can be filled by anyone."
