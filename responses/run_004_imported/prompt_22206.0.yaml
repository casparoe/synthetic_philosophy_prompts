  Here are two examples tailored for the scene. The first is a **necessary a posteriori identity** (Rigid Designator = Rigid Designator) that avoids the standard physics/astronomy tropes. The second is a **contingent identity** (Definite Description = Rigid Designator) that looks grammatically identical but fails the necessity test, allowing Mira to pivot to her own marriage.

  ### 1. The Necessary A Posteriori: "Elton John is Reg Dwight"
  **Why it works:** It's an identity between two proper names. Both "Elton John" and "Reg Dwight" are rigid designators—they pick out the specific human being, not a set of qualities. It was an empirical discovery (a posteriori) that the pop star and the boy born in Pinner were the same organism. But once discovered, it is necessary: there is no possible world where that specific person exists but isn't himself. He might never have sung a note, but he'd still be Reg Dwight and still be Elton John.

  ### 2. The "Gotcha": "Fiona's Husband is [Brother-in-Law's Name]"
  **Why it works:** It looks like an identity claim ("X is Y"), but "Fiona's Husband" is a definite description, not a rigid designator. It picks out *whoever fits the role*. In a different possible world, Fiona marries someone else. In that world, "Fiona's Husband" refers to a different guy, but "[Brother-in-Law's Name]" still refers to him. So the statement is false in that world. It is contingent.

