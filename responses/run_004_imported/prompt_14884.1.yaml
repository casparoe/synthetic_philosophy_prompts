answer: |-
  The short answer is **no**. Unfortunately, violating the Independence of Irrelevant Alternatives (IIA) condition does not allow you to escape the Gibbard-Satterthwaite theorem.

  You have done excellent research to notice the difference in assumptions between Arrow and Gibbard-Satterthwaite, but there is a crucial misunderstanding in how those theorems interact. Here is the breakdown of why that loophole doesn't work, why Borda Count is actually risky for your goal, and what options you actually have for your student council.

  ### 1. Why violating IIA doesn't stop Gibbard-Satterthwaite

  The Gibbard-Satterthwaite (G-S) theorem is actually **stronger** than Arrow's theorem in the context of picking a single winner.

  *   **Arrow's Theorem** asks: "Can we create a fair system that ranks *all* candidates consistently?" It requires IIA to prove that no such system exists without a dictator.
  *   **Gibbard-Satterthwaite** asks: "Can we create a fair system that picks *one* winner where voters are incentivized to tell the truth?"

  The G-S theorem applies to **any** deterministic voting system based on ranked (ordinal) ballots with three or more candidates. It does not matter whether the system satisfies IIA, fails IIA, satisfies Condorcet, or fails Condorcet.

  The theorem proves that if the system is not a dictatorship, there will always be some scenario where a voter can get a better outcome by lying about their preferences. Violating IIA is a *necessary* condition to avoid being a dictatorship (per Arrow), but it is not a *sufficient* condition to prevent tactical voting (per G-S).

  ### 2. The Borda Count is highly manipulable

  You mentioned the Borda Count as a system that violates IIA. You are correct that it violates IIA, but that makes it **more** susceptible to tactical voting, not less.

  In Borda Count, candidates receive points based on their rank (e.g., 1st place = 3 points, 2nd place = 2 points, 3rd place = 1 point). Because every position on the ballot matters, voters have a huge incentive to "bury" their strongest competition.

  **Example:**
  Imagine your preferences are **Alice > Bob > Charlie**.
  *   **Honest Vote:** Alice (3), Bob (2), Charlie (1).
  *   **Strategic Vote:** If you think Alice and Bob are the front-runners, you might vote **Alice (3), Charlie (2), Bob (0)**.

  By ranking Bob last, you reduce his point total significantly compared to ranking him second. In fact, political scientists often cite Borda Count as one of the *most* vulnerable systems to strategic "burying" tactics. Using it would likely increase the behavior you saw last year, not decrease it.

  ### 3. Is there any way to dodge Gibbard-Satterthwaite?

  Technically, yes, but it requires changing the type of ballot, not just the counting method.

  The G-S theorem applies specifically to **ordinal** (ranked) systems. If you switch to a **cardinal** (rated) system, you step outside the assumptions of the theorem.

  *   **Score Voting (Range Voting):** Voters give each candidate a score (e.g., 0 to 5 stars).
  *   **Approval Voting:** Voters simply mark "Approve" or "Disapprove" for each candidate.

  While these systems can still experience some strategy (e.g., "max-min" voting where you only give 5 stars to your favorite and 0 to everyone else), they generally reduce the incentive for complex tactical ranking like "ranking your favorite second." In Approval Voting, for example, there is never a reason to rank a candidate you like *below* a candidate you dislike, which solves the specific problem your school faced last year.

  ### 4. Practical Advice for Your Student Council

  Since no ranked system is perfectly strategy-proof, your goal should be to pick a system that makes tactical voting **difficult** or **unnecessary**, rather than impossible.

  1.  **Consider Approval Voting:** It is very simple to count (often easier than ranked ballots) and it removes the "lesser of two evils" dilemma. Students can vote for their favorite *and* the acceptable compromise without hurting either.
  2.  **Consider Score Voting:** This allows students to express intensity of preference (e.g., "I love Alice, but Bob is okay"). It tends to elect broadly acceptable candidates rather than polarizing ones.
  3.  **If you stick with Ranked Choice (IRV):** This is the most common "reform" system. It is not strategy-proof (G-S says it can't be), but it is generally harder to game than Plurality or Borda. It eliminates the "spoiler effect," which is often the root cause of the "rank my favorite second" panic.
  4.  **Voter Education:** If you use a ranked system, educate the students. In large elections, tactical voting is risky because you don't know how others will vote. Often, the "strategic" vote backfires and helps the candidate you dislike most. Encouraging honest voting can sometimes create a cultural norm that suppresses gaming, even if the math allows it.

  ### Summary
  You cannot use the violation of IIA to bypass the Gibbard-Satterthwaite theorem. Any ranked system you choose for three or more candidates will be vulnerable to tactical voting. If your primary goal is to stop students from ranking their favorite second, you should look into **Approval Voting** or **Score Voting**, as these change the input from rankings to ratings and offer the best practical resistance to that specific type of strategy.
