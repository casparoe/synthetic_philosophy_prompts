      *   **Acausal Trade/Threats:** Originates from Timeless Decision Theory (TDT) / Updateless Decision Theory (UDT) contexts (Miri/FHI circles, Yudkowsky, Soares, etc.). Key mechanism: *Logical Correlation*. Agents simulate each other or reason about each other's source code. No signal needs to be sent; the correlation exists because both are rational agents optimizing similar functions.
      *   **Surrogate Goals:** Specifically proposed to mitigate acausal blackmail. If I precommit "I never cave," an acausal blackmailer might still threaten me if they think they can force a logical update or if there's uncertainty about my source code. The surrogate goal says: "I care about X (real) and Y (fake). I will cave on Y but not X." The hope is the blackmailer targets Y.
      *   **The Core Difference:** Schelling is about *causal* influence on the other's belief (I show you I'm crazy so you back down). Acausal is about *logical* dependence (My decision algorithm outputs 'resist', therefore your simulation of me outputs 'resist', therefore you don't threaten).

