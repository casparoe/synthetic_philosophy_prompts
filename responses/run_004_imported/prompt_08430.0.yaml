  Regarding the leaderless protest, Hobbes would note the critical absence of a spokesperson. Since no single Actor bears the Person of the group, authorized by the explicit consent of each participant, there is no unified will. They are many individuals acting in parallel, not one Agent. They cannot covenant, for a multitude cannot promise except through a Representative whose authority they have transferred. They remain a chaotic swarm, liable to dissolve into internal conflict.

  Regarding the DAO, the mechanism of token-weighted voting does not constitute representation. The code is not a Person; it cannot bear responsibility or be punished. While members authorize specific transactions, they do not authorize a single Representative to embody their collective will in all matters. The outcome is merely an aggregation of private judgments, not the action of one Artificial Person. Without an officer to answer for the whole, there is no one to hold accountable.

  For Hobbes, unity is not functional coordination but juridical unity. Both cases lack a sovereign Representative whose words are owned by all as their own. Consequently, neither possesses standing as a genuine agent. They are dangerous precisely because they mimic unity without bearing the responsibility of personhood. They remain multitudes, incapable of true justice or injustice, save in the persons of the individual men involved. To call them one is a metaphor; in truth, they are many. Without a single will to govern them, they remain in a state of nature amongst themselves, where no action can be truly theirs collectively.
