      Hobbes would dismiss both as mere multitudes, lacking the unity required for personhood. In *Leviathan*, a multitude becomes one People only when represented by a single man or council, whose actions every member has owned as Author. Without this representation, there is no unity, only a disaggregated crowd.

      Regarding the leaderless protest, Hobbes would note the absence of a spokesperson. Since no single Actor bears the Person of the group, authorized by the consent of each participant, there is no unified will. They are many individuals acting in concert, not one Agent. They cannot covenant, for a multitude cannot promise except through a Representative. They remain a chaotic swarm, liable to dissolve into civil war amongst themselves.

