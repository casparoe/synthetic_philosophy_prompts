answer: |-
  This is a magnificent question, one that bridges the gap between the technical structure of physical theory and the deeper metaphysical commitments that drive natural philosophy. Given your background, you recognize that the Rietdijk-Putnam argument is not merely a logical puzzle but a direct assault on the ontological status of the "now."

  To reconstruct Newton's reaction, we must resist the temptation to view him solely as a proto-positivist physicist. While his *Principia* laid the groundwork for modern empirical science, his conception of space and time was inextricably bound to his theology and metaphysics. If we take his writings seriously—particularly the *Scholium*, *De Gravitatione*, and his correspondence with Samuel Clarke against Leibniz—I believe Newton would not have conceded to the Block Universe. Instead, he would have likely gravitated toward a Neo-Lorentzian interpretation, though he would have framed it differently than modern proponents do.

  Here is the reconstruction of why his metaphysical and theological commitments would have overridden the ontological implications of Special Relativity.

  ### 1. Absolute Time as Divine Duration
  The most critical factor is that for Newton, Absolute Time was not merely a convenient coordinate system for mechanics; it was an attribute of God. In the *General Scholium* and *De Gravitatione*, Newton argues that space is the *sensorium Dei* (the sensorium of God) and time is God's eternity.

  For Newton, God is omnipresent and everlasting. Consequently, there must be a universal "duration" in which God exists and acts. If time were relative to inertial frames, then God's duration would be fragmented or frame-dependent, which would be theologically incoherent to Newton. He viewed the universe as a creation sustained moment-by-moment by Divine Will. This requires a genuine, objective succession of moments—a robust Presentism.

  The Eternalist "Block Universe," where the future is as fixed and real as the past, poses a severe threat to Newton's view of Divine Providence and human free will. If the future already exists in the manifold, the scope for God's active intervention or contingent action is severely curtailed. Newton fought too hard against the determinism of Spinoza and Leibniz to accept a static spacetime manifold where "nothing happens" and everything simply *is*.

  ### 2. *Hypotheses Non Fingo* and the Unobservable
  You raise the excellent point that Neo-Lorentzianism posits a privileged frame that is empirically undetectable, which seems to violate *hypotheses non fingo*. However, Newton's use of this phrase is often misunderstood. He did not mean "I do not speculate on causes"; rather, he meant "I do not feign hypotheses that are not deduced from phenomena."

  Crucially, Newton already believed in unobservables. Absolute Space itself was unobservable directly; its existence was inferred from the effects of absolute acceleration (the Bucket Argument). He distinguished between *relative* measures (which we observe with clocks and rulers) and *absolute* quantities (the true reality).

  Faced with Special Relativity, Newton would likely argue that Einstein had confused the *measure* of time with time *itself*. He would view the Lorentz transformations not as revealing the true structure of spacetime, but as describing the dynamical behavior of matter and light as they move through the absolute background. In this view, the "relativity of simultaneity" is an artifact of measurement conventions and the finite speed of light, not an ontological truth about reality.

  He would likely argue that positing a hidden privileged frame is not a "hypothesis" in the pejorative sense, but a necessary metaphysical postulate required to make sense of God's relation to the world. To Newton, the Block Universe would be the greater "hypothesis"—one that feigns the unreality of temporal passage, which is directly experienced and theologically necessary.

  ### 3. The Empirical Concession
  Newton was, above all, a natural philosopher who respected the phenomena. He would not have denied the empirical success of Special Relativity (the Michelson-Morley null result, the behavior of fast-moving particles, etc.). He would have accepted the mathematical formalism of Lorentz and Einstein as the correct description of *phenomenal* physics.

  However, he would have drawn a sharp distinction between **operational time** (what clocks measure, which is relative) and **ontological time** (the true flow of duration, which is absolute). This is precisely the Neo-Lorentzian move. He would likely have viewed the Minkowski manifold as a brilliant mathematical fiction—a useful tool for calculation, much like epicycles or fictitious forces—but not a description of the "furniture of the universe."

  ### 4. Why He Would Be Torn (But Not Indecisive)
  You suggest he might be genuinely torn. I suspect he would feel tension, but his resolution would be decisive. The tension would arise because Special Relativity removes the *physical* necessity of the ether/absolute frame. In the 17th century, absolute space was needed to explain inertia. In the 20th century, inertia can be explained geometrically without a background stage.

  This would frustrate Newton's desire for a causal mechanism. He hated "action at a distance" because it lacked a mechanical cause. Similarly, he would dislike the geometric explanation of SR because it reifies relations at the expense of substances.

  However, his theological commitment acts as a tie-breaker. Leibniz argued against Newton that absolute space/time made God's creation arbitrary (why create the universe *here* and *now* rather than *there* and *then*?). Newton's reply (via Clarke) was that Space and Time are emanative effects of God's existence; they aren't "containers" God chose to put the universe in, but consequences of God being.

  Faced with the choice between:
  1.  **Eternalism:** Saves the elegance of the equations but denies objective succession and threatens the coherence of Divine Duration.
  2.  **Neo-Lorentzianism:** Saves Objective Succession and Divine Duration but requires an undetectable physical structure.

  Newton would choose option 2. He consistently prioritized the metaphysical reality of God and Creation over the elegance of mathematical formalism when the two conflicted.

  ### Conclusion
  If Newton were transported to the present, I believe he would reject the Block Universe. He would likely characterize the Minkowski manifold as a "mathematical hypothesis" useful for prediction but ontologically false. He would endorse a Neo-Lorentzian ontology, arguing that the "true" simultaneity exists relative to the frame of the Cosmic Divine Presence, even if no physical experiment can isolate it.

  He would concede that for the purposes of *physics* (predicting motion), the relativistic view is superior. But for the purposes of *natural philosophy* (understanding the nature of reality and God), he would remain an unrepentant Presentist. He would likely view the Rietdijk-Putnam argument not as a proof of Eternalism, but as a *reductio ad absurdum* of the idea that physical measurement exhausts ontological reality.

  In short: The physicist in him would respect Einstein's equations; the natural philosopher and theologian in him would reject Einstein's ontology. Given that Newton saw physics as a branch of natural theology, the latter would win.
