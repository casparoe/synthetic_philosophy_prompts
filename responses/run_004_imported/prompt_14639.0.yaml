  2.  **Character Conceptions:**
      *   **Ben (Classical):** Concerned with structure, consistency, and the utility of logic for tracking truth. Worried that accepting contradictions makes reasoning useless.
      *   **Alex (Dialetheist):** Influenced by Graham Priest. Concerned with semantic closure and the intuitive force of the Liar. Willing to sacrifice classical rules to save naive truth principles.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Acknowledge the Liar sentence immediately.
      *   **Round 1: The Liar and Explosion.**
          *   Ben: The Liar leads to contradiction. Contradiction implies everything (Explosion). Therefore, Liar must be nonsense or gappy.
          *   Alex: No, it's both true and false. Explosion isn't valid.
          *   Ben: If Explosion isn't valid, logic is broken. How do you stop $A \land \neg A \vdash B$?
      *   **Round 2: Disjunctive Syllogism (DS) and LP.**
          *   Ben: You need to block a rule. Usually, it's Disjunctive Syllogism ($A \lor B, \neg A \vdash B$). If you block that, how do I reason normally? If I know "It's raining or snowing" and "It's not raining," can't I conclude "It's snowing"?
          *   Alex: In LP (Logic of Paradox), DS is valid *classically* but fails when truth-value gluts exist. But it's *classically valid* in consistent domains. We use it pragmatically. We distinguish between "truth-preserving" and "truth-preserving-in-all-models."
          *   Ben: That sounds like you're saying logic is context-dependent. That's ad hoc.
          *   Alex: It's not ad hoc; it's recognizing that classical logic assumes consistency. When consistency fails (semantics), the rule fails. But for everyday stuff (physics, breakfast), consistency holds, so DS works.
      *   **Round 3: The Revenge Paradox.**
          *   Ben: Okay, let's test your "glut" theory. Consider the sentence: "This sentence is *only* false" (or "This sentence is not true"). If it's both, then it's not *only* false. So it's true. If it's true, then it's not *only* false... wait. Let's use the "Exclusion" liar. "This sentence is not true."
          *   *Correction:* The standard Revenge is usually about "This sentence is false or neither true nor false" (for paracomplete) or "This sentence is *only* false" (for dialetheists). Let's go with the "Exclusion" version: "This sentence is not true."
          *   *Refinement:* Priest deals with "This sentence is not true." If it's true, it's not true. If it's not true, it's true. So it's a glut. But what about "This sentence is *false only*"?
          *   *Let's use the 'Untrue' Revenge:* "This sentence is not true."
          *   Alex: In LP, "not true" means false. So it's the standard Liar.
          *   Ben: No, I mean "This sentence is *strictly* false" (i.e., false and not true).
          *   Alex: If I accept gluts, I reject the coherence of "strictly false" as exclusive.
          *   Ben: That's the dodge. You can't express "exclusive falsity" in your own language. Your logic is expressively incomplete.
          *   Alex: I can express it, but I can't *assert* it of the Liar without contradiction. I accept the contradiction.
      *   **Round 4: Rationality and Cost.**
          *   Ben: If you can't rule out "strictly false," you can't rule out anything.
