      *Let's refine the DS explanation.* Marcus needs to ask: "If DS is invalid, why don't we get false conclusions in physics?" Elena: "Because physics isn't semantic."

      *Let's refine the Revenge.* Marcus: "Consider $\lambda$: 'This sentence is not true.'" In LP, 'not true' = false. So it's just the Liar.
      Better Revenge: "This sentence is *false only*."
      If it's true -> it's false only -> contradiction.
      If it's false only -> it's true -> contradiction.
      If it's both -> it's not false *only* -> so it's false.
      Elena's standard Priestian move: The predicate "is false only" is not admissible/coherent in a glutty world, OR, accepting the contradiction again.
      Actually, the strongest point is the **Inexpressibility of Exclusivity**. Marcus should argue that Elena cannot define a set of "purely false" sentences.

      *Okay, let's write.*

  7.  **Final Review against constraints:**
