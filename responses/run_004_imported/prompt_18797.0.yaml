prompt: |-
  I sit on the grants committee of a small foundation that funds work on existential and suffering risk. A staff researcher wants us to earmark part of the annual budget for causes tied to value systems the committee itself assigns little weight to, arguing from evidential cooperation in large worlds: a sufficiently large universe should contain many agents in situations like ours who share our disposition to cooperate but hold different terminal values, so compromising now is evidence that our counterparts elsewhere compromise too, and the trade pays off acausally. Two of my fellow committee members call this a rebranding of ordinary worldview diversification under moral uncertainty that adds nothing but jargon; the researcher insists it is a distinct argument, since it would counsel the same compromise even if we were fully confident our own values were correct. Please draft the memo I'll circulate before our next meeting: recommend whether to adopt the earmark, reject it, or pilot it for a fixed term with a named review trigger; say what would separate a principled use of this reasoning from an unfalsifiable one that could rationalize funding anything; and give the skeptical members' position its strongest form, rather than treating it as mere discomfort with jargon.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a grants committee for a small foundation.
      *   **Topic:** Funding causes tied to value systems the committee assigns little weight to, based on "Evidential Cooperation in Large Worlds" (ECL).
      *   **Conflict:** Staff researcher (pro-ECL) vs. Two skeptical committee members (see it as rebranded moral uncertainty diversification).
      *   **Task:** Draft a memo to circulate before the next meeting.
      *   **Key Requirements:**
          1.  Recommend a course of action (Adopt, Reject, or Pilot with review trigger).
          2.  Define criteria separating principled use from unfalsifiable rationalization.
          3.  Steelman the skeptical members' position (not just "jargon," but substantive critique).
          4.  Tone: Professional, analytical, balanced, decisive but open to discussion.

  2.  **Deconstruct the Arguments:**
      *   **The Researcher's Argument (ECL):**
          *   Premise: The universe is likely vast (large worlds).
          *   Premise: There are agents like us (correlating decision algorithms) but with different terminal values.
          *   Mechanism: Acausal trade. If we cooperate with *their* values here, evidence suggests *they* cooperate with *our* values elsewhere.
          *   Key Distinction: Applies even under moral *certainty* (unlike moral uncertainty diversification).
      *   **The Skeptics' Argument:**
          *   Claim: It's just worldview diversification under moral uncertainty.
          *   Critique: Adds complexity/jargon without changing outcomes.
          *   Risk: Opens the door to funding anything by invoking unverifiable counterparts.
      *   **The Foundation's Mission:** Existential and suffering risk. (Implies longtermism/EA adjacent).

  3.  **Evaluate the Decision Options:**
      *   *Adopt:* Too risky. ECL is highly speculative, controversial in decision theory, and hard to verify. Could alienate donors or dilute mission focus.
      *   *Reject:* Dismisses potentially valid high-impact reasoning. Might stifle innovation. Ignores the "large worlds" hypothesis which is non-negligible in this community.
      *   *Pilot:* Best middle ground. Allows testing the reasoning without committing long-term resources. Sets up a framework to test the "principled vs. unfalsifiable" concern.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the purpose and the recommendation immediately. (Recommendation: Pilot).
      *   **Context:** Briefly summarize the proposal (ECL earmark) and the debate.
      *   **Analysis of the ECL Argument:** Explain it fairly. Acknowledge the distinction from moral uncertainty (the researcher's point).
      *   **Steelmaning the Skeptics:** This is crucial. It's not just about jargon. It's about *verification*, *mission drift*, and *decision theory stability*.
          *   *Point 1:* Unfalsifiability. We can't check if the trade happened.
          *   *Point 2:* Decision Theory Instability. If ECL implies compromising core values, does it imply compromising on *everything*?
          *   *Point 3:* Opportunity Cost. Money spent on low-weight values is money not spent on high-confidence interventions.
      *   **Principled vs. Unfalsifiable:** How do we guard against "rationalizing anything"?
          *   Need a defined counterfactual.
          *   Need a limit on "value distance."
          *   Need a mechanism for updating.
      *   **Recommendation:** Pilot program.
          *   Fixed term (e.g., 2 years).
          *   Cap on budget (e.g., 5%).
          *   Review Trigger: Specific report on "trade partners" identified and decision-theoretic justification.
      *   **Conclusion:** Call for discussion.

  5.  **Refining the Content (Self-Correction/Nuance):**
      *   *Tone Check:* Is it too academic? Keep it accessible but rigorous.
      *   *Skeptic's View:* Make sure I don't dismiss them as luddites. Their concern about *unfalsifiability* is the strongest philosophical objection to ECL.
      *   *Researcher's View:* Acknowledge that if ECL is true, it *is* distinct from moral uncertainty. Don't conflate them as the skeptics do, but acknowledge the practical overlap.
      *   *The "Trigger":* What specifically triggers the review? It shouldn't just be "did we like it?" It should be "did we establish a coherent framework?"

  6.  **Final Polish:**
      *   Ensure the distinction between "moral uncertainty" (I don't know what's right) and "ECL" (I know what's right, but I'm trading with aliens who think otherwise) is clear.
      *   Make sure the recommendation is actionable.

  7.  **Final Review against constraints:**
      *   Recommend Adopt/Reject/Pilot? Yes (Pilot).
      *   Separation of principled/unfalsifiable? Yes.
      *   Strongest form of skeptical position? Yes.
      *   Memo format? Yes.

  *(Self-Correction during drafting)*: I initially thought about suggesting a 10% cap. Given it's a *small* foundation and the mission is *existential risk*, 5% is safer for a pilot. I need to make sure the "Review Trigger" isn't just time-based but *condition-based*. The condition should be the articulation of the specific acausal link.

  8.  **Final Output Generation** (Proceed to write the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Evidential Cooperation in Large Worlds (ECL) Earmark

  ### Executive Summary

  At our next meeting, we will vote on a staff proposal to earmark a portion of the annual budget for interventions aligned with value systems to which our committee assigns low credence. The justification rests on *Evidential Cooperation in Large Worlds* (ECL), rather than standard moral uncertainty.

  After reviewing the arguments, I recommend we **pilot this approach for a fixed two-year term**, subject to a strict budget cap and a specific review trigger. This path allows us to investigate the potential upside of acausal cooperation without compromising our core mission or adopting an unfalsifiable funding strategy. Below, I outline the reasoning, address the substantive objections raised by the committee, and propose criteria to distinguish principled ECL reasoning from unchecked rationalization.

  ### Context and The Proposal

  Our researcher proposes that even if we are confident in our own value system (e.g., reducing existential or suffering risk), we should fund projects promoting *other* value systems. The argument is that in a sufficiently large universe, there are likely agents in situations structurally identical to ours who hold different terminal values. By cooperating with their values here, we provide evidence that counterparts elsewhere are cooperating with our values there, resulting in a net gain for our objectives via acausal trade.

  Two committee members have objected, characterizing this as "worldview diversification under moral uncertainty" dressed in new jargon. The researcher counters that the distinction is vital: moral uncertainty suggests we fund other values because *we might be wrong*; ECL suggests we fund them because *we are right, but trade is beneficial*.

  ### The Skeptical Position: A Steelman

  We must treat the skepticism on this committee not as discomfort with complexity, but as a rigorous objection to decision-theoretic stability and accountability. The strongest form of the skeptical argument rests on three pillars:

  1.  **The Unfalsifiability Risk:** Unlike causal trade, we cannot verify if counterparts exist or if they are reciprocating. If we cannot observe the counterparty, any funding decision can be retroactively justified by positing a convenient counterpart. This risks turning our grantmaking into a "black box" where any cause, no matter how tangential to our mission, can be funded by invoking an unverifiable acausal partner.
  2.  **Mission Drift via Infinite Leverage:** If ECL reasoning holds, it potentially dominates all other decision criteria. In a large enough world, the "leverage" of acausal trade could theoretically outweigh direct impact. Without hard constraints, this logic could divert resources away from high-confidence existential risk interventions toward low-confidence compromises, effectively dissolving our specific mandate.
  3.  **The Redundancy Claim:** Practically, ECL and moral uncertainty often yield similar portfolios. If the outcome is the same, adopting the more controversial and metaphysically heavy framework (ECL) introduces reputational and strategic risk without obvious operational benefit.

  ### Principled vs. Unfalsifiable Reasoning

  To ensure this does not become a mechanism to rationalize funding anything, we must establish criteria that separate principled ECL application from unfalsifiable speculation. I propose we adopt the following constraints for any ECL-based grant:

  *   **Structural Isomorphism:** We must be able to articulate specifically *why* the recipient is a valid trade partner. It is not enough to say "they value X." We must demonstrate that the recipient is acting in a context structurally similar to ours, such that their decision algorithm correlates with ours. Funding a local art project, for example, fails this test unless a specific link to acausal counterparts is established.
  *   **Value Distance Limits:** We should not compromise with value systems that are actively hostile to our core existence or that negate the possibility of future trade (e.g., value systems that prioritize immediate universe destruction). There must be a "zone of possible agreement."
  *   **Explicit Counterfactuals:** The proposal must state what direct-impact work is being displaced and why the expected value of the acausal trade exceeds the expected value of the direct work, even under conservative estimates of the "size of the world."

  ### Recommendation: Pilot Program with Review Trigger

  I recommend we **approve a pilot program** rather than a permanent earmark or an outright rejection.

  **1. Structure:**
  *   **Budget Cap:** 5% of the annual grants budget.
  *   **Term:** 2 years.
  *   **Scope:** Restricted to causes that have clear, articulated "counterpart" mechanisms (e.g., funding foundational decision theory research or broad-spectrum resilience that benefits multiple value systems), rather than unrelated charitable causes.

  **2. Review Trigger:**
  The pilot will not automatically renew. Renewal is contingent on the staff researcher producing a **Decision-Theoretic Audit** prior to the end of Year 2. This audit must:
  *   Identify the specific class of "counterparts" targeted.
  *   Demonstrate how the funded projects increase the probability of reciprocal cooperation.
  *   Show that the funding decisions would *not* have been made under standard moral uncertainty frameworks (proving the distinct utility of the ECL argument).

  ### Conclusion

  Rejecting the proposal outright closes the door on a potentially high-impact avenue of cooperation that is taken seriously within parts of the longtermist community. However, adopting it fully exposes us to the risk of unfalsifiable reasoning and mission drift.

  A capped pilot allows us to operationalize the researcher's insight while respecting the skeptics' demand for accountability. It forces the theory to confront the constraints of real-world grantmaking. If ECL is robust, it will survive the audit. If it is merely rebranded diversification, the audit will reveal that, and we can revert to standard protocols without having committed significant long-term resources.

  Please review this framework prior to our meeting on [Date]. I look forward to discussing how we can refine the review trigger criteria.
