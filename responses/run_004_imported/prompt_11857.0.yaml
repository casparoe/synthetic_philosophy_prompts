          *   *Truth:* The opinion fated to be agreed upon by all who investigate in the long run. It's realist. There is a reality independent of mind. Truth is the limit of inquiry.
          *   *Focus:* Logic, scientific method, community of inquirers, long-term convergence.
          *   *Vibe:* Rigorous, logical, objective, communal.

