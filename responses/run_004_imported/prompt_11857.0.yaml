answer: |-
  You are right to be suspicious of the "truth is whatever works" soundbite. It is the philosophical equivalent of reducing a symphony to a ringtone. While it captures a vibe, it obliterates the architecture.

  Peirce's annoyance was well-founded. He saw James taking a logical maxim for clarifying concepts and turning it into a psychological justification for religious faith. To answer your question, we have to look at where they locate the *weight* of truth.

  ### The Real Difference: The Limit vs. The Process

  **Peirce (Pragmaticism): Truth as a Regulative Ideal**
  For Peirce, truth is fundamentally **realist**. He believed there is a reality independent of what you or I think about it. However, we can only access that reality through signs and inquiry.
  *   **The Definition:** Truth is the opinion "fated to be ultimately agreed to by all who investigate."
  *   **The Mechanism:** It is communal and longitudinal. It doesn't matter what works for *you* today; it matters what the community of inquirers will be forced to conclude after enough evidence accumulates in the *long run*.
  *   **The Vibe:** Science, logic, convergence. Truth is a destination we are walking toward, constrained by a stubborn reality that kicks back when we are wrong.

  **James (Pragmatism): Truth as a Verification Process**
  For James, truth is fundamentally **humanist** and **instrumental**. He was less concerned with a reality "out there" and more concerned with how ideas function in the stream of experience.
  *   **The Definition:** "Truth *happens* to an idea. It *becomes* true, is *made* true by events."
  *   **The Mechanism:** It is individual and immediate. An idea is true if it leads to satisfactory relations with other parts of our experience, if it "cashes out" in concrete utility.
  *   **The Vibe:** Psychology, religion, fluidity. Truth is a tool we use to navigate life. If believing in God gives you the stamina to face the day, that belief has "truth-value" because it works.

  **The Divergence:** Peirce thinks truth is what we *find* (eventually); James thinks truth is what we *make* (currently). Peirce anchors truth in the **object** (reality constrains us); James anchors truth in the **subject** (experience validates us).

  ***

  ### The Verdict: Who Actually Has a Theory of Truth?

  You asked me to pick a side. Here it is:

  **Peirce has a theory of truth. James has a theory of warranted belief.**

  James's account is the one wearing truth's clothes. It is a sophisticated theory of *justification*, *utility*, and *belief-formation*, but it fails as a theory of truth because it cannot account for error in a robust way.

  Here is the justification for that hard line:

  **1. The "Useful Falsehood" Problem**
  James's criterion is utility ("what works"). But history is littered with useful falsehoods. A placebo works, but it isn't true medicine. A comforting lie can stabilize a marriage, but it isn't a true account of the relationship. If truth is simply "what works," James has to admit that useful lies are a species of truth. He tries to dodge this by talking about "long-run utility," but his focus remains on the *satisfaction of the believer*.
  Peirce avoids this. For Peirce, a belief might work for you now (be useful), but if it contradicts reality, future inquiry will smash it. Peirce preserves the **normativity** of truth: truth is what you *ought* to believe, not just what helps you cope.

  **2. Conflation of Criteria and Nature**
  James conflates the *test* of truth with the *nature* of truth.
  *   *Verification* is how we check if something is true.
  *   *Truth* is what makes the verification successful.
  James argues that because verification is a process of validation, truth *is* that process. Peirce recognizes that verification is the road, but truth is the destination (the Final Opinion). By making truth a process ("truth happens"), James dissolves the distinction between *being right* and *feeling right*.

  **3. The Independence of Reality**
  A theory of truth must explain how we can be wrong.
  *   In James's system, if an idea leads to satisfactory consequences, it is true. If I believe a bridge is safe, and I walk across it, and it holds, the belief was true. But what if the bridge was structurally unsound and just got lucky? James's framework struggles here because the "workability" was coincidental.
  *   In Peirce's system, the bridge's safety is a matter of fact independent of my crossing. If I believe it is safe, but the laws of physics say otherwise, the community of engineers will eventually discover the flaw. My belief was false, even if it "worked" once. Peirce retains the **mind-independent constraint** that is essential for a robust definition of truth.

  ### For Your Piece

  If you are writing about pragmatism, the critical insight is this: **James psychologized what Peirce logicalized.**

  James took a method for clarifying scientific concepts and turned it into a philosophy of life. That made pragmatism popular, but it cost them the concept of truth. Peirce's "Pragmaticism" is the harder sell because it demands we submit our personal truths to the grinding wheel of communal inquiry and future consequence.

  **The Takeaway:** William James gave us a theory of how to live with uncertainty. Charles Peirce gave us a theory of how to escape it. Only the latter is a theory of truth.
