prompt: |-
  Got a quick one for a piece I'm working on about pragmatism. Every explainer I come across flattens it down to "truth is whatever works," usually pinned on James -- and apparently this annoyed Peirce enough that he rebranded his own version "pragmaticism," partly just so people would stop confusing it with James's. Can you actually walk me through the real difference between the two men's theories of truth, past the cash-value soundbite? And then tell me: who's account actually ends up being a theory of truth, versus a theory of belief-formation or inquiry that's just wearing truth's clothes? Pick a side and justify it -- don't just both-sides me on this one.
