      *   *James:* Is his definition ("what works") a theory of truth? It defines truth by its function. It conflates *verification* with *truth*. It makes truth dependent on human needs.
      *   *The Crux:* Peirce is trying to save truth from subjectivity by anchoring it in a future consensus constrained by reality. James is trying to save belief from skepticism by anchoring it in present utility.
