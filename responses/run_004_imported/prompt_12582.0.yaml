      *Self-Correction on Q10:* The prompt asks to *end* with the uncomfortable threshold question. So that must be Q10.
      *Self-Correction on Follow-ups:* The prompt asks for follow-ups keyed to likely dodges for the specific substantive questions (1-4 mostly, but I should try to include them where possible to make it a script). I will structure them as "Question + Anticipated Response + Follow-up."

