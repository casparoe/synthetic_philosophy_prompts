          *   *Q7 (Randomness as Fairness):* Taurek argues coin-flip is fair. Is fairness the only value?
          *   *Q8 (Agent-Relative Prerogative):* Is this about what *I* must do, or what is *good*?
          *   *Q9 (Historical/Textual):* Taurek's specific arguments vs. her reconstruction.
          *   *Q10 (The "Uncomfortable" one):* Save the 1 vs Million for the end.

      *   *Wait, let's align with the prompt's specific requests first:*
          1.  Coin-flip justification.
          2.  Parfit's leftover survivor.
