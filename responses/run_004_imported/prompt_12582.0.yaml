      *   **Task:** Draft 8-10 interview questions.
      *   **Specific Requirements:**
          1.  Justify the coin-flip vs. "save the five."
          2.  Address Parfit's balancing/pairing argument (specifically the leftover survivor issue).
          3.  Address Scanlon's contractualist route (aggregation vs. non-aggregation).
          4.  Test generality of numbers-skepticism vs. severity of loss within a life (Taurek's hedge).
          5.  Include follow-ups for likely dodges (make it feel like a back-and-forth).
          6.  End with a "genuinely uncomfortable" question about threshold numbers (is there *any* number that changes the mind?).
      *   **Tone:** Professional, rigorous, philosophically precise, challenging but fair (academic job talk style).

  2.  **Deconstruct the Philosophy (Taurek/Parfit/Scanlon):**
