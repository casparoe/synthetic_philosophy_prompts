answer: |-
  Here is a draft script for the Q&A session. I have structured these as 10 distinct intervention points. For the core philosophical challenges (Questions 1–4 and 10), I have included the "Likely Dodge" and a "Follow-Up" to help you maintain pressure if she attempts to retreat to standard Taurekian platitudes.

  The tone is designed to be collegial but rigorous—appropriate for a Chair who needs to ensure the candidate can defend the view under fire, not just recite it.

  ***

  **Chair's Intro:** "Thank you for that stimulating talk. We have about 45 minutes for questions. I'd like to start by pressing on the core normative commitments of the view, and then we'll open it up to the committee."

  ### 1. The Coin-Flip Justification
  **Question:** "You argue that in a rescue case involving one person versus five, we ought to flip a coin to give each an equal chance of survival. The intuitive reaction for most is that the five generate a stronger moral claim. If the loss of life is equally bad for each individual, what positive moral work is the coin-flip doing that simply saving the five is not? Are you claiming we have a duty to be unfair to the group to ensure fairness to the individual?"

  *   **Likely Dodge:** She will likely say that there is no 'group' to be unfair to; there are only six individuals, and fairness requires giving equal weight to each individual's claim.
  *   **Follow-Up:** "If fairness requires equal weight to each claim, why does that cash out as an equal *probability* of rescue rather than an equal *consideration* of their interests? If I consider all five interests in the larger group, doesn't maximizing the satisfaction of those interests respect them equally as persons, whereas the coin flip deliberately risks frustrating five claims to satisfy one?"

  ### 2. Parfit's Pairing and the "Leftover"
  **Question:** "I want to put Parfit's balancing argument to you directly. Parfit suggests we can pair one person from the group of five with the single person. In that pair, the choice is a wash. But that leaves four unpaired survivors. Even if you reject aggregation, surely those four unpaired individuals have claims that aren't being cancelled out by the single person. Is your view that those four 'leftover' claims simply vanish because they belong to a set, or do they retain normative force?"

  *   **Likely Dodge:** She may argue that pairing is artificial and that we must choose between the 'situation' of the one and the 'situation' of the five, not mix and match individuals.
  *   **Follow-Up:** "But if the pairing is artificial, why is the grouping of the five not equally artificial? If you admit that the four unpaired people have claims, on what grounds are those claims silenced? If they aren't silenced, doesn't the balance of claims tip toward the five without requiring any controversial 'summing' of value, just a counting of uncancelled claims?"

  ### 3. Scanlon and Contractualism
  **Question:** "Scanlon's contractualist account attempts to save the greater number without relying on interpersonal aggregation of value. He argues that a principle allowing you to save the greater number is one that no one could reasonably reject. Do you see Scanlon's view as a genuine alternative to aggregation that you can accept, or do you think Scanlon is, as you suggested in your writing sample, just 'aggregation wearing a trenchcoat'? If the latter, where exactly does his argument fail?"

  *   **Likely Dodge:** She will likely argue that Scanlon implicitly aggregates by allowing the number of rejectors to determine the validity of the principle.
  *   **Follow-Up:** "If the number of rejectors matters for the *principle* but not the *value*, is that a distinction that does any work? If I can reject a principle because 'more people suffer under the alternative,' haven't I just reintroduced the numbers counting, regardless of whether we call it value aggregation or reasonable rejection?"

  ### 4. Severity vs. Headcount (The Taurek Hedge)
  **Question:** "Taurek himself hedges on whether severity of loss matters. He suggests death is worse than a broken arm, even if numbers don't count. Is your numbers-skepticism totally general? If the choice is between saving one person from death or five people from a broken finger, do you still flip a coin? If you save the one from death, how do you justify that trade-off without comparing the magnitude of loss across persons, which looks suspiciously like the aggregation you reject in the death/death case?"

  *   **Likely Dodge:** She may claim that severity is intra-personal (how bad it is for *me*) and doesn't require inter-personal comparison.
  *   **Follow-Up:** "But to choose the death over the five broken fingers, you have to judge that one death is 'worse than' five broken fingers. That is a comparative judgment across persons. If you can make that comparison for severity, what blocks you from making the comparison for headcount? What makes 'severity' a commensurable currency but 'existence' not?"

  ### 5. Institutional Application
  **Question:** "Let's move from the abstract to the institutional. If your view is correct, how should it inform public policy, specifically medical triage protocols? Are you advocating that hospitals should randomize treatment between one critical patient and five critical patients? If not, is there a divergence between what is morally required of an individual agent and what is required of an institution?"

  ### 6. The Nature of "Loss"
  **Question:** "Your view rests heavily on the claim that 'loss' is only intelligible relative to a specific subject—there is no 'total loss' in the universe, only losses *for* people. But doesn't this rely on a specific metaphysics of value that is contestable? If we view value as state-of-affairs based rather than person-relative, doesn't your argument lose its footing? Are you prepared to defend the metaphysics of person-relative value, or is this purely a normative claim?"

  ### 7. Fairness as the Only Value
  **Question:** "You lean heavily on fairness to justify the coin flip. But is fairness the only moral value in play? What about beneficence or the minimization of tragedy? If fairness dictates the coin flip, but beneficence dictates saving the five, how do you adjudicate that conflict? Is fairness a trump card, or is it one value among many that gets outweighed?"

  ### 8. Agent-Relative Prerogative
  **Question:** "Is your argument that we are *forbidden* to save the five, or merely that we are *permitted* to flip a coin? Taurek sometimes suggests we aren't obliged to save the greater number, but doesn't explicitly forbid it. Where do you stand on the deontic status? Is saving the five impermissible, or just supererogatory?"

  ### 9. Methodological Reliance on Intuition
  **Question:** "In your writing sample, you dismiss Parfit's balancing argument partly because it conflicts with the intuition that the single person is being 'sacrificed.' How much of your view rests on pre-theoretical intuitions about sacrifice versus systematic coherence? If a systematic theory like utilitarianism or contractualism offers more coherence but conflicts with that intuition, why should we privilege the intuition?"

  ### 10. The Threshold (The "Uncomfortable" Question)
  **Question:** "I'd like to end with a direct question about the limits of the view. You defend the coin flip for one versus five. Is there *any* number on the other side that would change your answer? If it is one person versus five million, do you still flip a coin? If you say 'yes,' I worry you are prioritizing theoretical purity over moral plausibility. If you say 'no,' at what number does the switch flip, and isn't admitting a threshold just admitting that numbers *do* count, just non-linearly?"

  *   **Likely Dodge:** She may say "No, the principle is absolute; the single person's claim does not diminish regardless of the crowd."
  *   **Follow-Up:** "If the principle is absolute, then you are committed to saying that the deaths of the 4,999,999 extra people are morally inert in the decision procedure. That implies a level of indifference to catastrophe that seems to undermine the very notion of ethics as a guide to action. Are you prepared to accept that your theory requires us to be indifferent to the difference between one death and a genocide in a binary choice scenario?"
