      *   *Parfit:* Critique of Taurek. Pairing argument. If you save the 5, you save the 1 (paired) + 4 others. The 1 has no complaint if paired. The 4 others have a claim. Therefore, save the 5.
      *   *Scanlon:* Contractualism. "Tie-breaking" view. Individuals have claims. If claims are equal, numbers might break the tie without aggregating value. Or, the principle that allows saving the greater number is one no one could reasonably reject.
      *   *Severity:* Taurek admits death is worse than a broken arm. Does the candidate allow severity to trump numbers, or is it strict non-aggregation?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Core Intuition):* Need to hit the coin-flip immediately.
