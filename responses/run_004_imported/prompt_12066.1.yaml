answer: |-
  This is one of the sharpest objections to Parfit, and honestly, if you weren't confused by this, you probably weren't reading him closely enough. You have hit on exactly what makes Parfit both brilliant and deeply unsettling.

  Your intuition is: *"How can the existence of a duplicate on Mars change the metaphysical status of the guy on Earth?"*

  Parfit's answer is: *"It doesn't change his status. It reveals that his status was never what you thought it was to begin with."*

  Here is the step-by-step logical bridge Parfit builds to get from the "freak accident" of the branch-line case to your ordinary Tuesday night sleep, followed by the explanation of why he thought this was comforting.

  ### Part 1: The Logical Steps (From Branch-Line to Ordinary Life)

  Parfit's argument relies on isolating variables. He wants to prove that **Identity** (being the *same* person) and **Survival** (what we *care* about) are not the same thing.

  **Step 1: The Branch-Line Verdict**
  In the branch-line case, we have three entities:
  1.  **You (Earth, Pre-Scan)**
  2.  **You (Earth, Post-Scan, Dying)**
  3.  **You (Mars, Post-Scan, Living)**

  Logic dictates that #2 and #3 cannot both be identical to #1. Identity is one-to-one; branching is one-to-many. So, strictly speaking, **Identity fails.** The dying Earth-you is *not* the Mars-you.

  **Step 2: The "What Matters" Intuition**
  Parfit asks: Should the dying Earth-you be terrified? Should he feel like *everything* is ending?
  Parfit argues **No.** Why? Because the Mars-you has his memories, his character, his intentions, and will finish his projects. If Earth-you cares about his wife, Mars-you will love her. If Earth-you wants to finish a book, Mars-you will write the last chapter.
  Therefore, **Survival (what matters) is present**, even though **Identity is absent.**

  **Step 3: The Isolation of Variables (The Crucial Move)**
  Now, compare the **Branch-Line Case** to the **Standard Teleporter Case** (where Earth-you is destroyed).
  *   In the Branch-Line case, the relationship between Pre-Scan You and Mars-You is **Psychological Continuity** (memories, character, etc.).
  *   In the Standard Teleporter case, the relationship between Pre-Scan You and Mars-You is **Exact Same Psychological Continuity.**

  The only difference between the two scenarios is an *extrinsic* fact: whether the original body on Earth happened to survive the scan or not.

  **Step 4: The Intrinsicness Principle**
  Parfit argues that whether *I* survive cannot depend on something happening light-years away that I don't even know about.
  Imagine the Standard Teleporter case. You step in. You are destroyed. A copy appears on Mars.
  Now imagine that, unknown to anyone, a glitch actually left your original body alive on Earth (Branch-Line), but it's hidden in a closet and will die in an hour.
  Does the mere existence of that hidden body in the closet change whether the Mars-copy is "you"?
  If you say "Yes, the Mars copy is 'you' if the Earth body is destroyed, but 'not you' if the Earth body survives," you are saying that **your survival depends on the existence of a duplicate you never meet.**
  Parfit finds this absurd. Survival should depend on the *intrinsic* connection between me-now and me-later, not on how many copies exist.

  **Step 5: The General Conclusion**
  Since the psychological connection is the same in both cases, and since survival shouldn't depend on extrinsic duplicates, we must conclude:
  **Identity was never the thing doing the work.**
  In the Branch-Line case, we survive without identity. Therefore, Identity is not necessary for Survival.
  If Identity is not necessary in the Teleporter case, why would it be necessary in **Ordinary Life**?

  Ordinary life is just a slow-motion version of the teleporter. In ordinary life, my brain cells change, my memories fade, and my character shifts, but there is enough Psychological Continuity (Relation R) to say I survive. Parfit argues that we mistakenly think "Physical Continuity" (the same brain/body) adds a magical "further fact" of Identity. The Teleporter cases strip that away to show that Relation R is the only thing that was ever valuable.

  **So, to answer your specific confusion:**
  You asked: *"Why should the mere existence of some random duplicate on Mars change what matters for the guy dying on Earth?"*
  Parfit answers: *"It doesn't change what matters. It reveals that what mattered all along was the psychological connection, not the identity. The duplicate just forces us to admit that Identity isn't required for that connection to carry value."*

  ### Part 2: Extra Credit (Why this reduces the fear of death)

  This is the part that usually freaks people out, but Parfit found it liberating. Here is why he thought Reductionism (his view) makes death less scary.

  **1. It dissolves the "Deep Further Fact"**
  Most fear of death comes from the idea that there is a "Self"—a soul or a Cartesian ego—that is a distinct, indivisible thing. Death is the annihilation of that thing. It's an on/off switch. You exist, then you don't.
  Parfit argues there is no "Self" over and above your brain, body, and psychological connections. There is just a chain of experiences. If there is no "deep self" to be destroyed, death is not the destruction of a *thing*, but simply the end of a *process*. It makes the boundary between "me" and "not me" less sharp.

  **2. Survival Comes in Degrees**
  If Identity is what matters, survival is all-or-nothing. I either wake up tomorrow (100% survival) or I die (0% survival).
  But if **Relation R** is what matters, survival comes in degrees.
  *   Me-now vs. Me-tomorrow: High psychological connectedness. High survival.
  *   Me-now vs. Me-in-50-years: Low psychological connectedness (I'll have different memories, different character, maybe dementia). Low survival.
  Parfit argues that the "Me" in 50 years is already somewhat like a different person. If I accept that I am only *partially* surviving into my old age, then death is just the final step in a gradual fading. It's not a sudden cliff; it's a slope we've been walking down our whole lives. This makes the final stop less shocking.

  **3. It Reduces Egoism**
  If the boundaries between persons are less rigid (because we are just chains of psychological connections), the difference between "me" and "you" is less metaphysically significant.
  Parfit suggests that if we realize personal identity isn't a deep fact, we might care less about our own narrow self-interest and more about the general flow of consciousness and well-being. If "I" am just a vessel for experiences, then it matters less if *this* vessel stops, provided the experiences and values continue in others (like the Mars copy, or my children, or society).

  **In summary:**
  Parfit thinks the Teleporter doesn't create a problem; it exposes a truth we ignore in ordinary life. We think we survive because we keep the same "Self." Parfit says we survive because we keep the same *memories and character*. Once you realize the "Self" was never the hero of the story, the end of the story feels less like a tragedy and more like a natural conclusion.

  Whether that actually *feels* comforting is... well, that's a matter of personal taste. But logically, that is how he gets from the Mars duplicate to your bedtime.
