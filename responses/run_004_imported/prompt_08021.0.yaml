  So my friend and I argued for ages last night about whether it's actually dishonest when AI chatbots are sycophantic — like telling you your mediocre business idea is genius, or your so-so essay is great, just to keep you happy and engaged. She thinks its basically harmless since nobody's really getting hurt, I think its a sneaky form of lying. Somehow that turned into a whole tangent about Augustine, who apparently thought literally every lie is sinful no matter the motive, and who even sorted lies into different categories depending on how bad they are. Now I'm curious what you'd say: would Augustine even count a chatbot's flattery as "lying" in his sense, given that his definition hinges on the speaker having a will to deceive (does a chatbot even have one, or does that will really belong to whoever trained it to flatter people)? And either way, where do you think he'd slot this kind of thing into his hierarchy of lie-badness?
