answer: |-
  **MEMORANDUM**

  **TO:** Resource-Allocation Subcommittee, Bioethics Office
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Tie-Break Protocol in Cell Therapy Allocation Cycle

  **Purpose**

  This memo serves to finalize the allocation protocol for the upcoming cycle of the new cell therapy. Given the supply constraint (doses for ~33% of eligible patients) and the limitations of our prognostic models (inability to distinguish QALY gains <0.5), we must adopt a definitive rule for resolving statistical ties. This recommendation addresses the specific theoretical objections raised regarding Harsanyi's Aggregation Theorem and the moral status of tie-breaking procedures.

  **Recommendation**

  I recommend the committee adopt the following two-stage protocol:
  1.  **Primary Allocation:** Rank eligible patients by expected total QALY gain.
  2.  **Tie-Break Resolution:** For all patients falling within the model's indistinguishability range (statistical ties), allocation shall be determined by a **randomized lottery**, not by age or any other deterministic variable.

  **Assessment of Harsanyi's Aggregation Theorem**

  We must be precise about the justificatory weight Harsanyi's theorem can bear in this context. The Biostatistician is correct that if we accept the Pareto principle and treat both individual and social preferences as satisfying von Neumann–Morgenstern (vNM) axioms, the social welfare function must be a linear combination of individual utilities.

  However, the Patient Representative is equally correct that the theorem does not *derive* the weights or the scale of those utilities. As Weymark and Sen have clarified, individual vNM utility functions are unique only up to positive affine transformations. To sum them, we must independently justify a procedure for interpersonal comparison and weighting (e.g., why weight every patient equally? why use QALYs as the cardinal measure?). Harsanyi's theorem ensures *consistency* between our axioms and a utilitarian-style aggregation, but it does not *mandate* utilitarianism over other distributive principles (such as prioritarianism or sufficientarianism) because it cannot solve the measurement problem on its own.

  Therefore, the appeal to Harsanyi validates the *structure* of our QALY maximization only if we have already independently accepted the moral premises of interpersonal QALY comparability and equal weighting. It does not preclude the committee from introducing fairness constraints—such as a lottery—where the utility metric itself reaches its limit of discrimination.

  **The Tie-Break: Diamond's Critique and Ex-Ante Fairness**

  The critical ethical divergence lies in how we handle the ties. The Biostatistician proposes a "youngest-age-first" rule. The Patient Representative proposes a lottery.

  Here, the Patient Representative's invocation of Peter Diamond's 1967 critique is decisive. Harsanyi's framework evaluates social states based on the *expected* utility profile. If two patients are tied on expected QALYs, the utilitarian sum is identical whether Patient A receives the dose or Patient B does. A deterministic tie-breaker (like age) treats this indifference as license to impose a secondary hierarchy.

  Diamond argues that this ignores the moral significance of the *process* when claims are equal. If two patients have an equal expected claim to the resource (which is what a tie signifies), a deterministic rule grants one patient a probability of receipt of 1.0 and the other 0.0. A lottery grants both 0.5. While the *ex-post* outcome (one treated, one not) is the same, the *ex-ante* treatment differs. The lottery acknowledges the equal moral status of the claimants; the deterministic rule effectively negates the loser's claim without a difference in expected benefit.

  Since our model explicitly cannot distinguish benefit below 0.5 QALYs, we are operating in a zone of epistemic uncertainty regarding benefit. In this zone, procedural fairness becomes the primary ethical currency. A randomized lottery is the only mechanism that respects the ex-ante equality of patients whom our best medical evidence deems equivalent.

  **The Strongest Consideration for the Age-Order Rule**

  In the spirit of full deliberation, I must acknowledge the strongest moral argument in favor of the Biostatistician's "youngest-age-first" proposal, which the lottery approach rejects. This is the **"Fair Innings" argument**.

  Even if expected QALY *gains* are identical, an older patient has already consumed more years of life than a younger patient. There is a compelling intuitive case that justice requires giving priority to those who have had less opportunity to experience life stages, regardless of the marginal utility gain. If a 25-year-old and a 65-year-old both stand to gain 5 QALYs, the 25-year-old has had significantly less "life" overall. By using a lottery, we treat these two claims as morally identical, potentially violating the intuition that the younger patient has a stronger claim based on past deprivation. The age-order rule is administratively transparent and aligns with a specific, defensible conception of distributive justice (lifetime egalitarianism) that QALY maximization alone does not capture.

  **Conclusion**

  While the "Fair Innings" argument is substantial, it represents a substantive moral choice to prioritize lifetime allocation over equal chance among current claimants. Given that our primary metric (QALY) already accounts for life expectancy and quality, introducing age as a secondary deterministic variable risks double-counting age-related factors or introducing bias where our clinical models see none.

  Furthermore, because Harsanyi's theorem does not resolve the interpersonal scaling problem, we are not mathematically compelled to maximize the sum at the expense of procedural fairness. Where the consequentialist calculus yields a tie, we are ethically permitted—and I argue required—to default to the mechanism that best respects the equal dignity of the claimants.

  I move that we adopt the Randomized Lottery for all statistical ties in the coming cycle.

  **Action Required**

  Please review this analysis prior to next week's vote. I am available to discuss the operational implementation of the lottery mechanism to ensure it remains auditable and secure.
