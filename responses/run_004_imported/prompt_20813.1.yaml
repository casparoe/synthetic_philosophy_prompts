      *   *Clarification:* Ensure the distinction between *knowledge* (factive) and *belief* (non-factive) is clear. Aumann uses Knowledge. Stalnaker/Binmore often shift to Belief to allow for error.
      *   *Specific Mechanism:* Mention the **Accessibility Relation**. In Aumann's S5, if world $w$ is actual, and $w'$ is accessible, properties holding at $w$ (like Rationality) must be compatible. But if a move is made that is only rational in $w''$, and $w''$ is not accessible from $w$ under the "Rationality" constraint, we have a problem.
