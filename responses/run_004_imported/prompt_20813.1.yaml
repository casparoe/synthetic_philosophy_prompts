          *   Critics' rebuttal: Justification requires stability under counterfactual supposition. If my strategy relies on *your* future move, I need to know what I'd believe *if* you didn't make that move. Aumann says "But you know they won't." Critics say "That begs the question of *why* I know that, given the incentives."

      *   **Part 3: Substantive Dispute or Competing Idealizations?**
          *   *Idealization View:* Game theory is math. Different axioms yield different theorems. Aumann gives conditions for BI; Stalnaker gives conditions for Forward Induction or Cooperation. Choose the tool for the job.
