prompt: |-
  This is going to sound niche but it's eating up my life right now. My aunt passed this spring and left me her place on the lake, so I'm suddenly a property owner and taxpayer in a tiny New England town even though I still live and vote three hours away in the city. Somehow I got roped into filling an empty seat on the town's charter review committee, and we owe the select board a recommendation in three weeks on the one issue that keeps stalling us: something like a third of the properties in town are owned by people like me who don't live here, and between us we pay around 40-45% of the property tax levy and are just as bound by the zoning and short-term-rental bylaws as full-time residents, but none of us can vote at town meeting or on the budget, because a ballot is tied to being a registered voter, which requires residency. Half the committee thinks that's just what self-government means, and that loosening it lets rich part-timers buy influence over a place they don't really live in; the other half thinks "taxed and regulated with zero say" is indefensible and wants at least a non-voting advisory seat or a weighted advisory vote on budget items. Can you draft the actual recommendation memo we need to send to the select board -- take a real position instead of "more study needed," give it a realistic timeline, and actually deal with the strongest arguement against whatever you recommend instead of just waving at it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user inherited a lake property in a tiny New England town but lives/votes 3 hours away. They are on the Charter Review Committee.
      *   **The Issue:** Non-resident property owners (NRPOs) pay a significant portion of taxes (40-45%) and are bound by laws but cannot vote in Town Meeting or on budgets (residency required for voter registration).
      *   **The Conflict:** Committee is split. One side says "self-government means residents only" (fear of wealthy outsiders buying influence). The other side says "no taxation without representation" (unfair to NRPOs).
      *   **The Task:** Draft a recommendation memo to the Select Board.
      *   **Constraints:**
          *   Take a *real position* (no "study more").
          *   Include a realistic timeline.
          *   Address the strongest counter-argument directly.
          *   Tone: Professional, persuasive, grounded in New England town governance reality.
          *   Deadline: Three weeks.

  2.  **Determine the Position:**
      *   *Option A: Full Voting Rights.* Legally difficult. In most New England states (MA, NH, VT, ME), voting is strictly tied to domicile/residency. Changing this usually requires state legislative action, not just a town charter change. It's a non-starter for a 3-week timeline and likely illegal at the local level.
      *   *Option B: Status Quo.* Ignores the grievance, likely leads to continued stalemate and resentment.
      *   *Option C: Compromise/Advisory Role.* This is the most pragmatic path. It acknowledges the contribution of NRPOs without violating the principle of resident-led governance. It's legally feasible within a town charter context.
      *   *Decision:* I will recommend the creation of a **Non-Resident Property Owner Advisory Committee (NRPO-AC)** with a formal liaison role to the Select Board and Town Meeting, rather than direct voting rights. This balances the "taxation without representation" concern with the "local control" concern. It's actionable within the town's authority.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **Background/Context:** Briefly outline the demographic reality (33% properties, 45% taxes) without getting bogged down in drama.
      *   **The Recommendation:** Define the mechanism. An Advisory Committee with a designated seat at Select Board meetings (non-voting) and the ability to submit formal budget recommendations.
      *   **Rationale:** Why this works. It gives voice without vote. It acknowledges fiscal contribution.
      *   **Addressing the Counter-Argument:** This is crucial. The prompt specifically asks to deal with the strongest argument against the recommendation.
          *   *Counter-Argument:* "This gives wealthy outsiders undue influence/creates a two-tier system."
          *   *Rebuttal:* Acknowledge the risk. Mitigate it by making the role *strictly* advisory, transparent, and focused on fiscal impact rather than social zoning/cultural issues. Emphasize that final authority remains with residents.
      *   **Implementation Timeline:** Needs to fit the 3-week deadline for the recommendation, plus a rollout plan.
      *   **Legal/Statutory Note:** Acknowledge that full voting rights likely require state law changes, which is why this local solution is chosen.

  4.  **Refining the Tone:**
      *   Needs to sound like a New England town document. Formal but community-focused.
      *   Avoid emotional language ("eating up my life").
      *   Ensure the distinction between "Town Meeting" (legislative) and "Select Board" (executive) is clear, as this varies by state but is standard NE vernacular.
      *   *Self-Correction on Legalities:* I need to be careful not to promise voting rights if state law prohibits it. In NH, VT, ME, MA, voting is almost exclusively based on domicile. A town charter cannot override state election law. Therefore, the recommendation *must* be about advisory capacity, not voting. I will make this explicit to show competence.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be specific. "Recommendation Regarding Non-Resident Property Owner Participation."
      *   *The "Ask":* Create a standing subcommittee or liaison role. Let's go with a "Non-Resident Property Owner Liaison" appointed by the Select Board from a pool of NRPOs.
      *   *The Counter-Argument:* The "Plutocracy" argument. If NRPOs are wealthier, do they get more sway?
      *   *Rebuttal:* The Liaison speaks to *impact*, not *preference*. They explain how a budget hits their wallet, they don't decide how the money is spent.
      *   *Timeline:* Committee report due in 3 weeks. Select Board review in 1 month. Implementation by next fiscal year.

  6.  **Final Review against Constraints:**
      *   Real position? Yes (Advisory Liaison).
      *   Realistic timeline? Yes (3 weeks to submit, rollout over 6 months).
      *   Address strongest argument? Yes (The "Undue Influence" section).
      *   New England context? Yes (References to Town Meeting, Select Board, Domicile laws).

  7.  **Final Polish:** Check for clarity, brevity, and authority. (Ensure I don't sound like I'm giving legal advice, but rather policy advice). *Self-correction:* Make sure to mention that this doesn't solve the state-law voting issue, but solves the local engagement issue.

  8.  *(Final thought before generating)*: The user is stressed ("eating up my life"). The memo should be clean enough that they can tweak and submit it with confidence. It needs to bridge the divide on their committee. I will frame it as a "Governance Integrity" measure.

  **(Self-Correction during drafting):** Wait, if the committee is split 50/50, how do I submit a memo? Usually, a committee submits a majority report. I will write this as the *Majority Recommendation* but acknowledge the dissent in the background section, or frame it as a consensus compromise. Given the prompt asks *me* to take a position, I will write it as the Committee's formal recommendation, assuming the user can sway one more vote or that this compromise bridges the gap. Actually, the prompt says "Can you draft the actual recommendation memo *we* need to send." I will write it as the Committee's output. To make it passable, the Advisory Compromise is usually the middle ground that both sides can tolerate better than the extremes.

  Let's refine the "Counter-Argument" section. The strongest argument against *any* NRPO voice is that it dilutes the voice of year-round residents who deal with the consequences of decisions 24/7. I need to address that specifically.

  Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** The Select Board, Town of [Town Name]
  **FROM:** Charter Review Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Non-Resident Property Owner Participation in Town Governance

  **EXECUTIVE SUMMARY**

  The Charter Review Committee submits this recommendation regarding the participation of Non-Resident Property Owners (NRPOs) in town governance. After reviewing current demographics, tax data, and statutory limitations, the Committee recommends **against** seeking voting rights for NRPOs at Town Meeting, as this conflicts with state domicile laws and the principle of resident-led self-government.

  Instead, the Committee recommends the **creation of a formal Non-Resident Property Owner Liaison position.** This appointed role will hold a non-voting seat at Select Board meetings and have the authority to submit formal advisory statements on the budget and zoning bylaws affecting property interests. This approach balances fiscal contribution with democratic residency requirements.

  **BACKGROUND AND CONTEXT**

  Current town data indicates that approximately 33% of taxable properties are owned by non-residents. This cohort contributes an estimated 40–45% of the annual property tax levy. Despite this fiscal burden and full subjection to local zoning and short-term rental bylaws, NRPOs are ineligible to vote in Town Meeting or on municipal budgets due to state residency requirements for voter registration.

  The Committee identified a risk in the status quo: a growing disconnect between a significant portion of the tax base and the decision-making body. However, the Committee also recognizes that Town Meeting is designed to represent the *domiciled* community who utilize daily services (schools, roads, emergency response) and live with the long-term consequences of zoning decisions.

  **RECOMMENDATION**

  The Charter Review Committee recommends the Select Board amend the Town Charter to establish the following:

  1.  **Establishment of the NRPO Liaison:** A single, non-voting Liaison position appointed by the Select Board annually from a pool of applicants who are registered NRPOs in good tax standing.
  2.  **Scope of Authority:**
      *   **Budget:** The Liaison shall receive budget drafts simultaneously with the Select Board and may submit a written "Fiscal Impact Statement" regarding the property tax implications of proposed budgets. This statement must be read into the record prior to the Town Meeting budget vote.
      *   **Zoning/Bylaws:** The Liaison may speak during Public Comment periods on matters directly affecting property usage or assessment but shall not vote on Planning Board or Zoning Board matters.
      *   **Select Board Access:** The Liaison holds a standing seat at monthly Select Board meetings, with the right to be recognized for comment but not to vote or enter executive session.
  3.  **Sunset Clause:** This provision shall be reviewed in three years to assess efficacy and potential unintended consequences.

  **TIMELINE FOR IMPLEMENTATION**

  *   **November 15:** Select Board accepts recommendation for public comment.
  *   **December – January:** Public hearing period; drafting of specific Charter Amendment language.
  *   **March Town Meeting:** Vote on Charter Amendment.
  *   **July 1:** Appointment of inaugural NRPO Liaison (coinciding with start of fiscal year budget cycle).

  **ADDRESSING THE PRIMARY COUNTER-ARGUMENT**

  The Committee anticipates the strongest objection to this recommendation: **that granting formal standing to NRPOs creates a two-tiered system that allows wealthy part-time residents to exert undue influence over a community they do not inhabit year-round.**

  Critics argue that because NRPOs often possess higher disposable income, a formalized voice could skew priorities toward property values and aesthetic concerns at the expense of year-round affordability, school funding, or community services. There is a valid fear that "representation" could slowly morph into "control."

  **The Committee's Rebuttal and Mitigation:**
  We acknowledge this risk. However, the current system creates a different governance risk: alienation of a large tax base, which can lead to increased litigation, hostility during budget cycles, and a lack of cooperation on community safety issues.

  The recommended Liaison model mitigates the risk of undue influence through three specific constraints:
  1.  **Strictly Advisory:** The Liaison has *zero* voting power. Final authority remains 100% with elected resident officials and Town Meeting members.
  2.  **Narrow Scope:** The Liaison's formal input is restricted to *fiscal impact* and *property regulation*. They are barred from offering advisory opinions on school budgets, social services, or personnel matters where their lack of residency is most relevant.
  3.  **Transparency:** All communications from the Liaison must be public record. This prevents back-channel lobbying and ensures year-round residents can see exactly what is being advocated.

  This approach does not grant "representation" in the democratic sense; it grants "consultation" in the stakeholder sense. It acknowledges that while NRPOs are not constituents, they are partners in the town's fiscal solvency.

  **CONCLUSION**

  State law prohibits tying ballot access to property ownership; voting must remain tied to domicile. Therefore, the Committee cannot recommend voting rights. However, governance is not limited to voting. By formalizing a channel for feedback, the Town can reduce friction, improve budget transparency, and honor the financial contribution of NRPOs without compromising the resident-led nature of New England self-government.

  The Committee requests the Select Board authorize the drafting of the necessary Charter Amendment language for the upcoming Town Meeting warrant.

  **Respectfully Submitted,**

  [Your Name/Committee Chair]
  Charter Review Committee
  Town of [Town Name]
