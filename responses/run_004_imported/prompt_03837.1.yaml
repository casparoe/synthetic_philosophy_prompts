answer: |-
  It is completely understandable that you found Edgeworth difficult. *Mathematical Psychics* is a fascinating book, but it sits at a strange pivot point in history: it is trying to use rigorous mathematics to describe human psychology and economics, but the formal language of game theory hadn't been invented yet. Edgeworth is essentially inventing the concepts as he writes, which is why the prose feels like it is straining to contain the ideas.

  Your intuition is spot-on: the distinction he makes is the seed of modern cooperative game theory, and the tension between Nash and Kalai–Smorodinsky is exactly about how to solve the problem Edgeworth identified.

  Here is a breakdown of the two puzzles you raised.

  ### 1. Settlement vs. Final Settlement: Why the Distinction?

  To understand why Edgeworth needs two definitions, it helps to map them onto modern terms.
  *   **Settlement** $\approx$ **Pareto Efficiency**.
  *   **Final Settlement** $\approx$ **The Core**.

  **The "Settlement" (Internal Stability)**
  When Edgeworth says a settlement is a contract "which cannot be varied with the consent of all the parties to it," he is describing a deal where you and your sister cannot find *another* deal that makes **both** of you better off.
  Imagine you agree to split the rental income 50/50. If there exists a different split (say, 60/40) that you would prefer *and* your sister would also prefer (perhaps because it avoids a tax penalty), then the 50/50 split is not even a "settlement." A settlement is simply an efficient deal where no "money is left on the table" between the two of you.

  **The "Final Settlement" (External Stability)**
  This is the crucial addition. Edgeworth writes: *"A final settlement is a settlement which cannot be varied by recontract within the field of competition."*
  The "field of competition" refers to outside options. In your inheritance case, the field of competition might be empty (it's just you and her). But imagine a scenario where a third party exists—say, a developer who wants to buy the property.
  *   You and your sister agree on a split (a **Settlement**).
  *   However, the developer offers *you* personally a side deal that gives you more money than the agreement with your sister, provided you sell to him.
  *   If you accept, the original agreement with your sister is broken.

  Edgeworth calls the original agreement unstable because it could be "blocked" by an outsider. A **Final Settlement** is one where no individual or coalition (including outsiders) can break the deal to make themselves better off.

  **Why does this layer matter?**
  Edgeworth is trying to solve a massive puzzle: How do we get from two people haggling (where anything can happen) to a market with thousands of people (where there is only one price)?
  *   **In the 2-person case:** The "field of competition" is empty. Therefore, *any* efficient settlement is automatically a "final settlement." This is why he concludes the outcome is **indeterminate**. There is a whole curve of possible deals (the Contract Curve), and math alone cannot tell you which one you will pick.
  *   **In the many-person case:** As you add more people to the "field of competition," it becomes harder to find a deal that outsiders can't improve upon. Edgeworth proves (roughly) that as the number of traders increases, the number of "final settlements" shrinks. Eventually, with perfect competition, only **one** final settlement remains: the market price.

  So, the distinction allows him to show that **competition is a mechanism for reducing indeterminacy.** Without the "field of competition" concept, he couldn't explain how bilateral haggling turns into market pricing.

  ### 2. Nash vs. Kalai–Smorodinsky: Resolving the Indeterminacy

  You are correct that Edgeworth leaves the two-person case indeterminate. He essentially says, "Math tells us the deal will be on this curve, but psychology or ethics must decide where."

  Modern bargaining theory (starting with John Nash in 1950) tries to use axioms to pick a single point on that curve. You asked about the Kalai–Smorodinsky (KS) solution versus the Nash solution, specifically regarding **Monotonicity** vs. **Independence**.

  #### The Nash Bargaining Solution (NBS)
  Nash proposed that a "rational" agreement should maximize the product of the parties' gains above their disagreement point.
  *   **The Axiom:** **Independence of Irrelevant Alternatives (IIA).**
  *   **What it means:** If you and I are bargaining over a set of possible deals, and we agree on Deal X, then removing some *other* deals from the table (that we weren't going to pick anyway) should not change our agreement to Deal X.
  *   **The Intuition:** This is about consistency. If I offer you a choice between an Apple and a Banana, and you pick the Apple, I shouldn't be able to change your mind to the Banana just by adding a Pear to the menu that you don't want.
  *   **The Critique:** Nash's solution ignores the *shape* of the bargaining set away from the solution point. It only cares about the local trade-off rate at the agreement.

  #### The Kalai–Smorodinsky Solution (KS)
  Kalai and Smorodinsky (1975) felt Nash's IIA was too restrictive and ignored important information about "potential."
  *   **The Axiom:** **Individual Monotonicity.**
  *   **What it means:** If the set of possible deals expands in a way that increases your *maximum possible* payoff (your "ideal point"), while my maximum stays the same, then your payoff in the final agreement should not decrease.
  *   **The Intuition:** If the pie gets bigger specifically for *you* (perhaps you have a better outside option, or the asset is more useful to you), you should not end up with a worse deal than before. Your bargaining power should weakly increase if your potential upside increases.

  #### Concrete Example: The "Fairness" Test
  Imagine you and your sister are dividing \$100.
  *   **Scenario A:** You can get at most \$100. She can get at most \$100.
      *   *Nash & KS:* Both likely suggest \$50/\$50 (assuming symmetry).
  *   **Scenario B:** Something changes. Now, *you* could potentially get \$150 (maybe you have a use for the property she doesn't), but she is still capped at \$100. The total pot to divide is still \$100, but your "threat potential" or "ideal point" is higher.
      *   **Nash:** Might still give you \$50. Why? Because the *feasible* set of dividing the \$100 hasn't changed shape at the margin. The "irrelevant" potential of \$150 is ignored because it's not currently on the table.
      *   **KS:** Will give you *more* than \$50. Why? Because your "ideal point" moved up. Monotonicity says if your potential improved, your share shouldn't go down.

  #### Is KS just a "dressed-up tie-breaker"?
  This is the philosophical heart of your question.
  *   **The Cynical View:** Yes. Edgeworth was right that the math is indeterminate. Both Nash and KS are imposing ethical values disguised as mathematical axioms. Nash values **consistency** (IIA); KS values **proportionality of opportunity** (Monotonicity). Neither is "true" in the way gravity is true.
  *   **The Principled View:** KS captures a specific notion of fairness that Nash misses. In many real-world negotiations (like your inheritance), people care about their "best case scenario." If your sister knows you could have used the house for a business that would make \$1 million, but she can only live in it, she might intuitively feel you "deserve" more of the sale price, even if you agree to sell. KS formalizes that intuition. Nash formalizes the intuition that "only actual options matter, not hypothetical ones."

  **Why prefer one over the other?**
  *   **Prefer Nash if:** You believe bargaining is about strategic consistency. You don't want the outcome to flip-flop just because a hypothetical, unchosen option was added or removed. It is the standard in economics because it maps well to non-cooperative strategic games.
  *   **Prefer KS if:** You believe bargaining is about dividing gains relative to potential. It is often viewed as more "equitable" in welfare economics because it acknowledges that having a better BATNA (Best Alternative to a Negotiated Agreement) or higher capacity should yield a better reward.

  ### Summary for Your Situation
  Edgeworth's "indeterminacy" explains why your negotiation with your sister was thorny. In a two-person inheritance, there is no "field of competition" to force you to a single price. You are on the "Contract Curve," and every point on it is a "Final Settlement."

  When you look at Nash vs. Kalai–Smorodinsky, you aren't looking for a mathematical fact that will solve your dispute. You are looking for a **principle of fairness** you both agree to accept.
  *   If you both agree to "split the difference" based on what is currently possible, you are intuitively leaning toward a Nash-like logic.
  *   If you argue that one of you "needs it more" or "could have made more use of it," you are intuitively leaning toward a Kalai–Smorodinsky logic (monotonicity based on ideal points).

  Edgeworth would tell you that without a referee (the market), the math cannot decide for you. The "solution" is not found in the equations, but in the shared agreement on which axioms of fairness you both accept as binding.
