answer: |-
  This is a classic dispute in contemporary Buddhist studies, and your friend's skepticism is shared by many analytic philosophers encountering Madhyamaka for the first time. On the surface, the *catuṣkoṭi* (tetralemma) looks like a flagrant violation of the Law of Excluded Middle (LEM) and the Law of Non-Contradiction (LNC).

  However, the "conservative" or "classical" interpretation (championed by scholars like Mark Siderits, Tom Tillemans, and B.K. Matilal) argues that Nāgārjuna is not breaking logic, but rather exposing the ontological presuppositions that make logical application possible. He is effectively arguing that the tetralemma only applies to things with *svabhāva* (intrinsic nature), and since nothing has *svabhāva*, the tetralemma fails to gain a foothold.

  Here is a reconstruction of that argument, followed by an assessment of the paraconsistent alternative.

  ---

  ### (a) The Two Negations: *Prasajya* vs. *Paryudāsa*

  To understand how Nāgārjuna denies all four options without contradicting himself, we must distinguish between two types of negation in Sanskrit logic. Your friend's objection assumes a single, truth-functional negation ($\neg P$). Nāgārjuna relies on a distinction that classical logic typically collapses.

  1.  **Paryudāsa-pratiṣedha (Implicating Negation):**
      *   This is a **term negation**. It denies a predicate but implies the affirmation of an alternative within the same domain.
      *   *Example:* "Devadatta is a **non**-Brahmin."
      *   *Logical form:* $\neg F(x)$.
      *   *Implication:* This asserts $x$ exists and possesses some property $G$ (where $G$ is contrary to $F$). It preserves the ontological status of the subject.
      *   *Risk:* If Nāgārjuna used this, denying "Nirvāṇa exists" would imply "Nirvāṇa does not-exist" (as a positive state of nothingness). This would trap him in the second horn of the tetralemma.

  2.  **Prasajya-pratiṣedha (Non-Implicating Negation):**
      *   This is a **propositional negation**. It denies the entire proposition without committing to an alternative or even the existence of the subject.
      *   *Example:* "It is **not the case that** Devadatta is a Brahmin."
      *   *Logical form:* $\neg (F(x))$.
      *   *Implication:* No commitment is made about what Devadatta *is*, or even if Devadatta exists. It simply blocks the assertion.
      *   *Function:* This is the primary tool of the *Mūlamadhyamakakārikā* (MMK).

  **Why it matters for the Tetralemma:**
  When Nāgārjuna rejects the four *koṭis* (options), he is using *prasajya* negation. He is not asserting the contradictory opposite; he is refusing to assert the proposition at all.
  *   Horn 1: "Nirvāṇa exists." $\rightarrow$ Rejected.
  *   Horn 2: "Nirvāṇa does not exist." $\rightarrow$ Rejected (not because it *does* exist, but because the proposition is ill-formed).
  *   Horn 3 & 4: Rejected because they are built on the incoherence of 1 and 2.

  By using *prasajya*, Nāgārjuna avoids affirming "Non-existence" when he denies "Existence." He is engaging in a *soteriological suspension of judgment*, not a truth-functional inversion.

  ### (b) The Target of Negation: *Svabhāva* vs. Existence

  This is the crux of the conservative defense. Your friend reads the tetralemma as operating on simple existence ($E$). The conservative reading argues it operates on *inherent* existence ($E_s$).

  Nāgārjuna's ontology posits that all things are empty (*śūnya*) of *svabhāva* (own-being, intrinsic nature, independence). *Svabhāva* is defined as that which is uncaused, unchanging, and independent.

  When the tetralemma is applied to Nirvāṇa (or the Self, or Causation), the hidden qualifier is *svabhāva*. The four horns are actually:
  1.  Nirvāṇa exists **inherently**.
  2.  Nirvāṇa does not exist **inherently**.
  3.  Nirvāṇa both exists and does not exist **inherently**.
  4.  Nirvāṇa neither exists nor does not exist **inherently**.

  **The Logical Move:**
  Nāgārjuna argues that *svabhāva* is incoherent (nothing can be independent in a dependently originated world). Therefore, the subject of the predicate ("inherent existence") is an empty set.
  *   **Horn 1** is false because nothing exists inherently.
  *   **Horn 2** is false because "inherent non-existence" would itself be a kind of *svabhāva* (a fixed, intrinsic nature of nothingness). To reify nothingness is just as bad as reifying existence.
  *   **Horns 3 & 4** collapse because 1 and 2 are incoherent.

  **Analogy:** Consider the question, "Is the present King of France bald?"
  *   If you say "Yes," you imply there is a King of France.
  *   If you say "No," you might imply there is a King of France who has hair.
  *   Nāgārjuna's move is to say: "It is not the case that there is a King of France to whom baldness or non-baldness applies."
  He rejects all four options not because reality is contradictory, but because the **presuppositions of the question are false.**

  ### (c) Two Truths and the Charge of Equivocation

  Your friend's charge is that using "Two Truths" (*saṃvṛti-satya* and *paramārtha-satya*) is an ad hoc way to equivocate on the word "exists." The conservative defense argues it is a **scope distinction**, not an equivocation.

  1.  **Conventional Truth (*Saṃvṛti*):**
      *   This is the domain of language, logic, and daily life.
      *   Here, things *do* exist, but only dependently (*pratītyasamutpāda*).
      *   Logic (LEM, LNC) applies here. "The pot exists" is true conventionally. "The pot does not exist" is false conventionally.
      *   Nāgārjuna **affirms** conventional existence. He cooks, eats, and debates.

  2.  **Ultimate Truth (*Paramārtha*):**
      *   This is the domain of ontological analysis.
      *   Here, we look for the *mode* of that existence. We find no *svabhāva*.
      *   The tetralemma is an **ultimate analysis**. It asks: "Does Nirvāṇa exist *ultimately* (inherently)?"
      *   The answer is "No." But since "Non-existence" is also an ultimate claim, that is also "No."

  **Avoiding Equivocation:**
  It is not equivocation because the predicate changes meaning based on the domain of discourse.
  *   Statement A: "Nirvāṇa exists [conventionally]." $\rightarrow$ **True.**
  *   Statement B: "Nirvāṇa exists [inherently/ultimately]." $\rightarrow$ **False.**

  Nāgārjuna denies the four *koṭis* only in the ultimate sense. He does not deny that people experience nirvāṇa or that the word refers to something conventionally. The "rescue maneuver" is not saving logic from inconsistency; it is saving **experience** from the reification that logic tends to impose. Logic demands fixed terms; reality is fluid. The Two Truths doctrine allows Nāgārjuna to use logic (conventionally) to show the limits of logic (ultimately).

  ### (d) Assessment: Conservative vs. Paraconsistent (Garfield/Priest)

  So, who wins? Your friend (classical logic), the conservative interpreters (presupposition failure), or the paraconsistentists (Garfield/Priest)?

  **The Case for the Conservative Reading:**
  *   **Dialectical Consistency:** Nāgārjuna explicitly states he has no thesis (*pratijñā*). If he embraced true contradictions (dialetheism), that would be a thesis. The conservative reading aligns better with his claim to simply be exposing the errors of others (*prasaṅga*).
  *   **Soteriological Goal:** The point of Madhyamaka is to end suffering (*duḥkha*). Suffering arises from grasping (*upādāna*) at things as real. Showing that "inherent existence" is a category error cures the grasping. Embracing a "true contradiction" might be intellectually stimulating, but it doesn't clearly cure the ontological craving better than showing the craving is based on a null set.
  *   **Logical Parsimony:** It does not require inventing a new logic. It uses classical logic to show that the inputs are defective.

  **The Case for the Paraconsistent Reading (Garfield/Priest):**
  *   **Textual Force:** Nāgārjuna *does* seem to reject the fourth koṭi, which is the negation of the disjunction of the first two. In classical logic, if 1 and 2 are false (due to presupposition failure), 4 should be *true* (since $\neg(False \lor False)$ is True). By rejecting 4, Nāgārjuna seems to be rejecting the logical framework itself, not just the inputs.
  *   **The Ineffable:** Garfield argues that emptiness is an *ontological reality* that is contradictory from the perspective of conceptual thought. It's not just that language fails; it's that reality at the limit *is* paradoxical.
  *   **Charity:** It takes Nāgārjuna's radicalism seriously. The conservative reading risks turning Madhyamaka into a boring error theory ("Everyone is wrong about words"). The paraconsistent reading makes it a profound metaphysical insight.

  **My Verdict:**
  For the specific purpose of your debate with a logician friend, **the conservative reconstruction is the stronger defense.**

  Why? Because the paraconsistent reading concedes the friend's point: "Yes, this violates classical logic." The conservative reading says, "No, it does not violate classical logic; it demonstrates that the terms of the argument lack reference."

  The Garfield/Priest reading is philosophically fascinating and perhaps captures the *mystical* depth of the tradition better, but it is vulnerable to the charge of special pleading. The conservative reading (specifically the *prasajya* negation + *svabhāva* target + presupposition failure model) provides a rigorous, logically valid account of how one can deny all four *koṭis* without asserting a contradiction.

  **The "Killer Argument" for your friend:**
  Tell your friend that Nāgārjuna is not operating in a standard first-order logic ontology where quantifiers range over existing objects. He is operating in a logic where the domain of "inherently existent things" is empty.
  In a domain where $S$ (svabhāva) is empty:
  1.  $\exists x (Sx)$ is False.
  2.  $\exists x (\neg Sx)$ is False (because this implies there is an $x$ to have the property of intrinsic non-existence).
  3.  Therefore, questions predicated on $S$ are category mistakes.
  Denying all four options is the logical equivalent of refusing to answer a ill-formed query. That is not mysticism; it is semantic precision.

  **Conclusion:**
  The conservative reading holds up logically *if* you accept the premise that *svabhāva* is the hidden variable in every proposition. If your friend rejects that premise (i.e., they think "existence" just means "existence"), then Nāgārjuna will indeed look like a mystic. But within the internal coherence of the Madhyamaka system, the logic is rigorous. The paraconsistent reading is a valuable *philosophical development* of Madhyamaka, but the conservative reading is likely the more accurate *historical exegesis* of Nāgārjuna's dialectical method.
