          *   *Verdict:* The conservative reading dissolves the *formal* contradiction by showing the terms are empty. The paraconsistent reading embraces the contradiction to show the limits of formalism. For a logician friend, the conservative reading is more persuasive *logically*, but the paraconsistent reading is more honest about the *soteriological* break. I should lean towards the conservative reading being sufficient to answer the friend's specific logical objection, while acknowledging Garfield/Priest offer a deeper metaphysical picture.

