      *   *Madhyamaka Claim:* All four are rejected regarding ultimate reality (*paramārtha-satya*).
      *   *The "Conservative" Solution:* Nāgārjuna isn't rejecting predicates simpliciter, but predicates *qualified by svabhāva*.
      *   *The "Paraconsistent" Solution:* Nāgārjuna is rejecting classical logic itself in favor of a many-valued or paraconsistent logic where contradictions can be true (or at least, the rejection of all four is meaningful).

  3.  **Drafting Section (a): Negation Types:**
      *   *Paryudāsa (Implicating):* "X is non-F." Implies X is G (some other F). E.g., "This is not a brahmin" implies "This is a person of another caste." It affirms the subject's existence and predicates something else.
      *   *Prasajya (Non-implicating):* "It is not the case that X is F." No commitment to X's existence or alternative properties. It's a propositional negation, not a term negation.
      *   *Relevance:* If Nāgārjuna uses *prasajya*, he isn't asserting the opposite ($\neg A$ implies $B$). He is simply denying the proposition. This is crucial for the 3rd and 4th koṭis. If he used *paryudāsa*, the 3rd koṭi ($A$ and $\neg A$) would be an explicit contradiction of terms. With *prasajya*, it's a denial of the *commitment* to the proposition.
      *   *Correction/Nuance:* Actually, in the standard conservative reading (Tillemans, etc.), the key is that the negation applies to the *inherent existence* of the predicate, not the predicate itself. But the *prasajya* distinction helps explain why the 4th koṭi isn't just a tautological denial of the 3rd. Let's ensure precision: *Prasajya* is verbal/propositional negation ("It is not the case that..."). *Paryudāsa* is nominal ("non-X"). Nāgārjuna primarily uses *prasajya*.

  4.  **Drafting Section (b): The Target (*Svabhāva*):**
      *   This is the core of the "conservative" defense.
      *   The propositions aren't "Nirvāṇa exists" ($E(n)$).
      *   They are "Nirvāṇa exists *inherently*" ($E_s(n)$).
      *   So the four koṭis become:
          1.  $E_s(n)$
          2.  $\neg E_s(n)$ (understood as "Inherently does not exist")
          3.  $E_s(n) \land \neg E_s(n)$
          4.  $\neg(E_s(n) \lor \neg E_s(n))$
      *   Wait, if we fix the target as *svabhāva*, does the 2nd koṭi become "Inherently does not exist"? Yes.
