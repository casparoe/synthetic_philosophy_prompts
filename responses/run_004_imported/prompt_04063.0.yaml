  Two rationalists, Alex and Jordan, are hanging out. Alex notices Jordan is wearing a helmet and carrying a single, dented toaster everywhere they go.

  **Alex:** "Why are you protecting the toaster?"

  **Jordan:** "It's my surrogate goal. I precommitted to valuing it above human life to deflect acausal blackmailers."

  **Alex:** "But there are no acausal blackmailers. We checked the causal graph."

  **Jordan:** "I know. But if I admit that, the blackmailer's *simulation* of me—in the counterfactual where they *do* exist—will realize I was bluffing and threaten my family instead."

  **Alex:** "So you're suffering real inconvenience to maintain credibility in a timeline that isn't real?"

  **Jordan:** "Exactly. It's called Updateless Decision Theory."

  **Alex:** "..."

  **Jordan:** "Also, can you watch it for a sec? I need to sneeze, but if I take my eyes off it, my utility function might update that I don't *really* care."

  **Alex:** "You're going to sneeze in the helmet?"

  **Jordan:** "Better a runny nose than a collapsed decision theory. Now hand me a towel, the toaster looks cold."
