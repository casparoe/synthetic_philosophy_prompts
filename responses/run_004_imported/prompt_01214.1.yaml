prompt: |-
  So I've been prepping my seminar on chance and think I've talked myself into a genuine counterexample to Lewis's Principal Principle - tell me where I've gone wrong. The principle says my credence should just match the objective chance, so for a fair coin thats about to be flipped, credence in heads should be 0.5. But say a friend who can somehow see the future tells me, before the flip, that it's going to land heads - I obviously shouldn't just sit there believing 0.5 anymore, even though the objective chance of heads at that moment is still 0.5 right up until the coin actually lands. Seems like a totally ordinary case where matching credence to chance is the irrational thing to do, which just sinks the principle as it's usually stated, no?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Claim:**
      *   **Topic:** David Lewis's Principal Principle (PP).
      *   **User's Argument:** The user claims to have a counterexample.
      *   **Scenario:** A fair coin is about to be flipped (objective chance = 0.5). A friend who can see the future tells the user it will land Heads.
      *   **Conclusion:** The user's credence should be 1 (or close to it), not 0.5. Therefore, matching credence to chance (0.5) is irrational. Therefore, PP is false.
      *   **Task:** Identify where the reasoning goes wrong (i.e., explain why this isn't actually a counterexample to PP).

  2.  **Recall/Verify the Principal Principle (PP):**
      *   **Basic Formulation:** $C(A | X \& E) = x$, where:
          *   $C$ is the initial credence function.
          *   $A$ is the proposition (e.g., "Coin lands Heads").
          *   $X$ is the proposition that the chance of $A$ is $x$ (e.g., "Chance of Heads is 0.5").
          *   $E$ is "admissible" evidence.
      *   **Key Condition:** The principle only holds *conditional on admissible evidence*.
      *   **Lewis's Definition of Admissibility:** Evidence is admissible if it affects credence *only* through its effect on beliefs about chances (or past history). Information about the *future outcome* itself is typically *inadmissible*.

  3.  **Evaluate the User's Scenario against PP:**
      *   **Proposition $A$:** Coin lands Heads.
      *   **Chance $X$:** Chance of Heads is 0.5.
      *   **Evidence $E$:** "Friend says it will be Heads" (based on seeing the future).
      *   **User's Application:** The user is applying PP as $C(A | X) = x$. They are ignoring the $E$ clause or assuming their evidence $E$ is admissible.
      *   **The Conflict:** The friend's testimony is *future-directed* evidence. It gives direct information about the outcome, bypassing the chance.
      *   **Lewis's Defense:** Lewis explicitly builds a clause into PP to handle this. The principle applies only when your evidence is *admissible*. Crystal balls, time travelers, and prophets provide *inadmissible* evidence.

  4.  **Formulate the Response:**
      *   **Acknowledge and Validate:** Start by acknowledging that this is a very common and intuitive objection. It shows the user is thinking critically about the material. It's a "classic" puzzle in the philosophy of chance.
      *   **Identify the Missing Clause:** Point out the "Admissibility" condition. This is the crux of the solution.
      *   **Explain Admissibility:** Define what makes evidence admissible vs. inadmissible.
          *   Admissible: Past history, laws of nature, facts about chances.
          *   Inadmissible: Direct information about the future outcome (crystal balls, time travelers).
      *   **Apply to the Scenario:**
          *   The friend's testimony is inadmissible.
          *   Therefore, the condition for PP is not met.
          *   PP says: $C(\text{Heads} | \text{Chance}=0.5 \& \text{Admissible Evidence}) = 0.5$.
          *   It does *not* say: $C(\text{Heads} | \text{Chance}=0.5 \& \text{Inadmissible Evidence}) = 0.5$.
      *   **Discuss the "Why":** Why does Lewis draw this distinction? Because PP is meant to connect *chance* to *credence*, not *outcome* to *credence*. If you know the outcome, chance becomes irrelevant to your belief (though not to the metaphysics of the situation).
      *   **Nuance/Refinement (Optional but helpful):** Mention that defining "admissibility" non-circularly is actually one of the hard technical problems in the literature (Lewis himself struggled with a perfect definition), but the *intuition* behind it blocks this specific counterexample.
      *   **Conclusion:** Reassure the user that their seminar prep is on the right track, but this specific objection is the standard "first hurdle" that PP is designed to clear.

  5.  **Refine the Tone:**
      *   Keep it encouraging but precise.
      *   Avoid overly technical jargon where possible, but use the necessary terms (admissibility, conditionalization).
      *   Make sure to explicitly state: "You haven't sunk the principle; you've just found the boundary condition."

  6.  **Self-Correction/Double Check:**
      *   *Did Lewis actually say this?* Yes, in "A Subjectivist's Guide to Objective Chance." He discusses crystal balls explicitly.
      *   *Is the chance still 0.5?* Yes, assuming the coin is fair and the flip hasn't happened. The friend's knowledge doesn't change the *chance*, it changes the *credence* via inadmissible evidence.
      *   *Is there a deeper issue?* Some philosophers (like Ismael) have proposed revisions (the "New Principle"), but that's usually about self-locating beliefs or Humean supervenience issues, not crystal balls. Stick to the classic Lewisian response for now as it's the most direct answer.

  7.  **Final Polish:** Structure the answer clearly with headings or bullet points for readability. (Drafting the response based on these points.)
answer: |-
  This is a fantastic objection to raise in a seminar, and you are in very good company. This is essentially the "Crystal Ball" objection, and it is the first major hurdle anyone studying the Principal Principle (PP) encounters.

  However, you haven't sunk the principle. You have actually identified the specific clause that Lewis built into the principle to prevent exactly this counterexample from working.

  Here is where the reasoning goes wrong, and how you can frame it in your seminar.

  ### 1. The Missing Clause: Admissibility
  The Principal Principle is not simply "Credence should match Chance." It is more precisely formulated as a conditional constraint on rational credence.

  Lewis's formulation (roughly) is:
  $$C(A \mid X \& E) = x$$

  Where:
  *   $C$ is your initial credence function.
  *   $A$ is the proposition (e.g., "The coin lands Heads").
  *   $X$ is the proposition that the chance of $A$ is $x$ (e.g., "The chance of Heads is 0.5").
  *   **$E$ is any *admissible* evidence.**

  The crucial word is **admissible**.

  Lewis explicitly acknowledges your scenario. He argues that the Principal Principle only applies when your total evidence is *admissible*. Evidence is admissible if it affects your credence about the outcome *only* by affecting your credence about the chances (or by telling you about the past).

  ### 2. Why the Friend's Testimony is Inadmissible
  In your scenario, your friend's testimony is **inadmissible evidence**.

  *   **Admissible Evidence:** "The coin is fair," "The flipper is honest," "The wind speed is normal." These things influence your belief about the outcome *because* they influence your belief about the *chance*.
  *   **Inadmissible Evidence:** "A crystal ball shows Heads," "A time traveler says Heads," "Your friend sees the future." These things give you direct information about the *truth of the outcome*, bypassing the chance entirely.

  Lewis argues that if you possess inadmissible evidence (like knowledge of the future), the Principal Principle simply doesn't kick in. The principle governs how you should respond to *chance*, not how you should respond to *prophecy*.

  So, the principle doesn't say: "Always match your credence to the chance."
  It says: "Match your credence to the chance **unless you have inadmissible evidence about the outcome.**"

  ### 3. Why This Distinction Matters
  If you allow inadmissible evidence into the equation, you break the link between chance and credence that Lewis is trying to establish.

  *   **Chance** is about the propensity of the world to produce outcomes.
  *   **Credence** is about your degree of belief.

  Usually, the only window we have into the future is through chance. But if you have a "window" that skips the chance (the friend), your credence should indeed track the friend, not the chance. Your credence becomes 1.0, while the chance remains 0.5. This is not a contradiction of the PP, because the PP suspends judgment in cases of inadmissible evidence.

  ### 4. A Nuance for Your Seminar (The "Hard" Part)
  While this solves the problem intuitively, you can impress your seminar by noting that **defining admissibility non-circularly is notoriously difficult.**

  Lewis struggled to give a precise definition of "admissible" that didn't just amount to "evidence that doesn't violate the PP."
  *   If you define admissible evidence as "evidence that doesn't tell you the future," you rely on a temporal distinction that might be metaphysically shaky.
  *   If you define it as "evidence that affects credence only via chance," you risk circularity (since we are using PP to define chance).

  Philosophers like Ned Hall and Jenann Ismael have written extensively on this. Ismael, for example, proposes the "New Principle" to handle some of these self-locating and evidentiary issues more robustly.

  ### Summary for your Seminar
  You can present your counterexample confidently, but then pivot to the solution:

  1.  **State the Objection:** "If I know the future, why should I follow the chance?"
  2.  **State Lewis's Defense:** "The Principal Principle includes an **admissibility constraint**."
  3.  **Explain the Constraint:** "Prophecy is inadmissible evidence. PP only applies when evidence is admissible."
  4.  **Critical Discussion:** "However, defining admissibility without circularity remains one of the open technical problems in the philosophy of chance."

  So, you haven't sunk the principle; you've successfully identified its boundary conditions! That makes for a great seminar contribution.
