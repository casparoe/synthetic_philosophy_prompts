answer: |-
  This is a very strong draft. You have correctly identified the fault line that runs through the post-1990 expressivist literature. Your intuition that the literature often glosses over the distinction between *logical validity* and *rational incoherence* is well-founded, and your suspicion about Gibbard is shared by some of the sharpest critics in the field.

  Here is the sanity check you asked for, broken down by your three requests.

  ### (a) Accuracy of Representation

  **Blackburn:** Your representation is accurate. Blackburn's quasi-realist strategy in *Spreading the Word* and *Essays in Quasi-Realism* is indeed to analyze the acceptance of a conditional like "If lying is wrong, then getting your brother to lie is wrong" as expressing a higher-order attitude (specifically, a disapproval of combining the approval of lying with the disapproval of getting your brother to lie). He argues that this captures the *commitment* structure of logic without positing truth-conditions.

  **Gibbard:** Your representation is also accurate regarding the *Wise Choices, Apt Feelings* (1990) and *Thinking How to Live* (2003) shift. Gibbard moves from pure expressivism to a semantic framework where normative claims have content defined by sets of "world-norm pairs" (or hyperplans). In this framework, inconsistency is defined model-theoretically: two claims are inconsistent if the intersection of the sets of world-norm pairs they allow is empty.

  **Verdict:** You haven't set up straw men. You are attacking the core of their respective projects.

  ### (b) The "Logical vs. Practical Inconsistency" Worry in the Literature

  You are absolutely right that this is a recognized problem. In fact, it is arguably *the* central problem for contemporary expressivism.

  **1. The Van Roojen Reference:**
  You are likely thinking of **Mark van Roojen, "Expressive Logic" (2005)** or his earlier **"Knowing Enough to Disagree" (1996)**. Van Roojen explicitly argues that Blackburn's higher-order attitude account explains why it is *irrational* to hold certain combinations of attitudes, but it does not explain why the *arguments* are valid. He distinguishes between the *psychological state* of being inconsistent and the *logical relation* between propositions. Van Roojen argues that expressivists tend to conflate "being in a state of mind that is psychologically unstable" with "asserting something that is logically false."

  **2. The Mark Schroeder Objection (Crucial for your seminar):**
  If you are teaching this, you must engage with **Mark Schroeder's *Being For* (2008)**. Schroeder sharpens this exact objection. He argues that Blackburn and Gibbard fail to distinguish between **A-type inconsistencies** (holding two beliefs with contradictory contents, e.g., *p* and *not-p*) and **B-type inconsistencies** (holding two attitudes that clash but have distinct contents, e.g., *believing p* and *disapproving of p*).
  *   Schroeder's charge: Blackburn explains B-type inconsistency (clashing attitudes) but needs A-type inconsistency to explain logical validity (clashing contents).
  *   Relevance to you: Your intuition that Blackburn trades "validity" for "psychological incoherence" is essentially the prelude to Schroeder's "Negation Problem." Schroeder argues that without truth-conditions, you cannot get the formal properties of negation required for validity.

  **3. How Sophisticated Expressivists Answer:**
  *   **Blackburn:** He bites the bullet. He argues that the demand for "topic-neutral formal validity" is a realist prejudice. For the expressivist, logic *just is* the study of the coherence of attitudes. There is no "higher" logic to which practical reasoning must answer.
  *   **Gibbard:** He argues that by moving to world-plan semantics, he *does* provide truth-conditions (of a sort). The content of "Lying is wrong" is a set of world-plan pairs. Therefore, logical operations are set-theoretic. He claims this restores formal validity because set theory is formal.
  *   **Michael Chrisman:** In works like "Expressivism, Inferentialism, and Saving the Phenomena," Chrisman argues we should shift from semantics to inferentialism. Validity isn't about truth-preservation or plan-consistency, but about license to infer.

  ### (c) Hard Pushback on the Hyperplan Paragraph

  You asked me to find the hole in your Gibbard critique. Here is where your argument is most vulnerable to a sophisticated Gibbardian defense.

  **The Hole: Conflating Semantics with Psychology**
  Your draft says: *"the individuation of 'plans'... still has to bottom out in the same practical facts that were doing the work in Blackburn's version."*

  **The Counter-Argument:**
  Gibbard's move in *Thinking How to Live* is precisely to **stop** bottoming out in practical facts (psychology) and start bottoming out in **abstract objects** (sets).
  1.  **Formalism:** For Gibbard, a "norm" or "plan" is not a psychological state in the head; it is an abstract function from situations to actions. A "hyperplan" is a complete function.
  2.  **Content vs. State:** When I accept "Lying is wrong," I am in a psychological state, but the *content* of that acceptance is a set of world-hyperplan pairs.
  3.  **Logical Operations:** Logical inconsistency is defined over the *contents* (the sets), not the *states*. If Content A rules out all pairs in Content B, they are logically inconsistent *regardless* of my psychology.
  4.  **The Charge:** You claim the move is "cosmetic." A Gibbardian will reply: "It is not cosmetic; it is a semantic ascent. I have provided a model-theoretic semantics. Validity is defined as truth-preservation over world-plan pairs. This is formally identical to possible worlds semantics. If you reject this, you are rejecting model-theoretic semantics entirely, not just expressivism."

  **How to Fortify Your Critique:**
  To survive this counter, you need to press the **Normativity of Logic** angle, not just the Formalism angle.
  *   **Argument:** Even if Gibbard provides a formal semantics, *why does that semantics govern reasoning?* In realism, the semantics (truth conditions) explains why we *ought* not believe contradictions (because they can't be true). In Gibbard's view, the semantics (plan-consistency) explains why we *ought* not plan contradictions. But the "ought" here is pragmatic/practical.
  *   **The specific vulnerability:** Ask whether Gibbard has explained why logical validity is **normatively authoritative** for agents who don't share the plans. If validity is just "consistency of plans," and I have a crazy plan, is my reasoning still valid?
  *   **Better phrasing:** Instead of saying the individuation "bottoms out in practical facts," argue that the **normative force of the logic** still depends on the agent's commitment to the plan. The formalism handles the *structure*, but it doesn't explain the *bindingness* of the logic in the way realist truth-conditions do. You can accept the formalism but deny it captures *logical* validity rather than *planning* consistency.

  **Specific Reference for this Pushback:**
  Look at **Tristram McPherson, "Why Expressivists About Value Should Not Love Minimalism About Truth" (2008)**. He argues that even if expressivists adopt minimal truth or semantic formalism (like Gibbard), they still face a gap in explaining why that semantics supports the *normativity* of logical inference.

  ### Summary Recommendation for Your Notes

  1.  **Keep the Blackburn critique.** It is standard and robust (Van Roojen/Schroeder territory). It effectively highlights the "Validity vs. Incoherence" gap.
  2.  **Modify the Gibbard critique.** Acknowledge that Gibbard *does* provide a formal semantics (sets of world-plan pairs), so it is not "merely psychological" in the same way Blackburn is.
  3.  **Pivot the Gibbard objection.** Instead of attacking the *formalism*, attack the *interpretation*. Argue that Gibbard has successfully mimicked the *structure* of logic but has not explained why that structure commands the *authority* of logic. He has shown that normative discourse is *systematic*, but not that it is *truth-apt* in the sense required for genuine validity.
  4.  **Cite Schroeder.** Even if you disagree with him, your students need to know that *Being For* is the modern benchmark for this objection.

  Your draft is seminar-ready, but tightening the Gibbard section to acknowledge his semantic ascent before challenging its philosophical significance will make it bulletproof.
