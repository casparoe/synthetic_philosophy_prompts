  2.  **Evaluate Part (a): Accuracy of Representation:**
      *   *Blackburn:* The user describes Blackburn's quasi-realist project, specifically the "logic of attitudes" or "commitment logic." The example (lying/getting brother to lie) is a standard modus ponens case. Blackburn does argue that accepting the conditional expresses a higher-order attitude (disapproval of the combination). The user's critique is that this is psychological incoherence, not logical validity. *Verdict:* Accurate enough for a seminar critique. Blackburn explicitly embraces the idea that logic is grounded in the structure of practical reasoning/attitudes, but the distinction between "logical validity" and "practical inconsistency" is the crux of the objection.
      *   *Gibbard:* The user mentions "hyperplan machinery" and "world-plan pairs." This refers to Gibbard's *Wise Choices, Apt Feelings* (1990) and later *Thinking How to Live* (2003). The idea is that normative states rule out combinations of worlds and plans. Inconsistency is defined as ruling out all options. *Verdict:* Accurate. Gibbard tries to formalize the logic of norms.

  3.  **Evaluate Part (b): The "Logical vs. Practical Inconsistency" Worry:**
      *   *Is it recognized?* Yes, absolutely. This is the heart of the "Logic Problem" for expressivism post-Frege-Geach.
      *   *Key Literature:*
          *   **Mark van Roojen:** "Expressive Logic" (2005) or "Knowing Enough to Disagree" (1996). He discusses the distinction between logical inconsistency and pragmatic/psychological inconsistency.
          *   **Schroeder (Mark):** *Being For* (2008). This is the big one. Schroeder argues that Blackburn and Gibbard fail to solve the "negation problem" and the deeper logical problem because they don't preserve the *semantic* content needed for formal validity. He distinguishes between A-type and B-type inconsistencies.
