              *   Point 4: The Real Weakness (Schroeder). The real problem isn't that it's "practical," it's that the logic doesn't embed correctly for negation/conditionals (the Negation Problem).
      *   **Refining the Gibbard Critique:** The user says individuation bottoms out in practical facts. Gibbard would say plans are abstract objects (functions from situations to actions). The *acceptance* is practical, the *content* is abstract. The logic operates on content. So the user might be conflating the *state of mind* with the *content of the state*.
      *   **Van Roojen Check:** Van Roojen (1996) "Expressive Logic" is the likely candidate. Also Van Roojen (2005) "Expressivism and the Logic of Attitudes."

  6.  **Final Polish:** Ensure the distinction between "psychological inconsistency" (holding conflicting attitudes) and "logical inconsistency" (contents that cannot be jointly satisfied) is clear, as this is the pivot point for Gibbard. Gibbard claims to solve the former by turning it into the latter via semantics. The user needs to challenge whether that semantic move is legitimate.

