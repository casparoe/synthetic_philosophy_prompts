      *   *The Specific Objection:* The user's worry is that expressivists conflate *validity* (truth-preservation/formal) with *rational incoherence* (psychological/practical). This is often called the "Problem of Logical Embedding" or the "Validity Problem."
      *   *Van Roojen Reference:* The user suspects van Roojen. Van Roojen (1996) "Expressive Logic" discusses how expressivists need to account for logical relations without truth conditions. He argues that Blackburn's higher-order attitudes don't fully capture logical validity. So, yes, the user is on the right track.

