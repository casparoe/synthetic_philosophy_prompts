      *   *Connection to Mind:* Mention the "homunculus" fallacy. Just because we see a "Golden Gate Bridge" feature doesn't mean the model "sees" the bridge.
      *   *Specific Phil Reference:* Daniel Dennett's *Real Patterns* is perfect here. Patterns are real if they allow compression/prediction, even if not "fundamental."

  6.  **Final Polish:**
      *   Ensure the distinction between "intervention works" and "feature is native" is clear.
      *   Make sure the "multiple decompositions" worry is addressed via *Structural Realism* or *Real Patterns*.
      *   Check that the "Lever vs. Stand-in" distinction is framed as *Mechanistic Constitution* vs. *External Control*.

  7.  **Final Output Structure:**
