answer: |-
  For those of us who loved her, the house is very quiet this week.

  Juniper was with us for fourteen years. That is a long time. It is long enough for knees to get stiff, and for children to grow taller than the doorframe, and for a dog to learn the rhythm of a family so well that she seemed to know when we were sad before we did.

  We are here to say goodbye to her. And because we are a family who cares about the truth, I want to speak carefully about what Juniper was, and what she was not.

  There are old ideas, ideas that Grandpa has studied for his whole life, which say that animals are different from people in a very deep way. They say that Juniper did not think the way we think. She did not sit and wonder about the past, or worry about the future. She did not have words inside her head. When she looked at us, she did not have a soul that was judging us or measuring us. She was not a little person in a fur coat.

  She was something else. She was a creature of sensation and response.

  And in that, she was perfect.

  When she lay in the sun, she felt the warmth. When she heard the sound of the food bowl, she felt excitement. When she rested her head on your lap, she felt the weight of your hand and the rhythm of your breathing. Descartes, the philosopher Grandpa knows so well, wrote that animals like Juniper can feel these things. They can see, and hear, and sense comfort. They just don't *think* about feeling them.

  There is a comfort in that, I think. It means Juniper lived entirely in the present. She didn't carry grudges. She didn't lie awake wondering if she was a good dog. She didn't fear death, because she couldn't conceive of it. When she was with us, she was completely with us. Her joy was a pure reaction to our presence. Her loyalty was a constant, mechanical truth, as reliable as the sun rising.

  But I know that doesn't stop the hurt. I know you are crying. And you might ask: If she didn't think like us, if she wasn't like us, why does losing her feel like losing a person?

  The answer is not in Juniper. The answer is in us.

  We are the ones who think. We are the ones who remember. Juniper did not need to understand what love is for her to be the center of our love. A mirror does not need to know what a face looks like to reflect it perfectly. Juniper reflected our family back to us. She showed us our own capacity to care.

  The pain we feel right now? That is ours. That is the human part. It is the proof that *we* have the thinking souls, the memories, the ability to hold onto something that is gone. Juniper was the anchor, but we are the ships that are now drifting. It is right that we feel the drift.

  So, we do not need to pretend she was human to miss her. We don't need to imagine she is waiting for us in a place she couldn't conceive of. We just need to honor what she was.

  She was a wonderful, living mechanism of joy. She was a creature who felt the sun, and the grass, and our hands. And for fourteen years, her life was intertwined with ours.

  To the grandchildren: It is okay to cry. Your tears are not for her to understand; they are for you to feel. They are your tribute. She responded to you. She waited for you. She felt safe with you. And now, we will carry the memory of her. We will do the thinking for both of us.

  Rest now, Juniper. You were good. You were true. And you were ours.
