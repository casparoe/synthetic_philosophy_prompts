  10. (Final Polish): Ensure references to "productive vs. unproductive labor" and "natural liberty" are integrated where appropriate. Make sure to distinguish between Smith's critique of the *EIC* specifically and his critique of *Mercantilism* generally, as BRI fits the latter better than the former.

  *(Self-Correction during drafting)*: I need to be careful not to validate the "debt-trap" narrative as empirical fact, but treat it as the *premise* of the user's friend's argument. The task is how Smith would analyze the *logic* of the argument, not verify the data.

  *(Final thought)*: Smith would likely be more concerned with the *domestic* political economy of the borrowing state (why did they take the loan? corruption? vanity projects?) than just the external lender. He always looks inward at institutions. I should include that.

