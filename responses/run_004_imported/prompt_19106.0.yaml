answer: |-
  You are on firmer philosophical ground than your friend. While your friend's intuition reflects a common desire for a single, neat narrative, the claim that "only one can be the real cause" relies on an oversimplified view of how causation works in the real world.

  There is a very defensible sense in which both versions are true. Acknowledging this does not mean sliding into relativism (where "nothing is really true"); rather, it means acknowledging the difference between **causal facts** and **causal explanations.**

  Here is how you can articulate this distinction to your friend without resorting to polite vagueness.

  ### 1. The Causal Chain (Proximate vs. Distal)
  Events rarely have a single cause; they have causal histories. Think of the startup's failure not as a point, but as the end of a chain.
  *   **Link A:** The startup delays the feature.
  *   **Link B:** The competitor gains a window of opportunity.
  *   **Link C:** The competitor slashes prices to capitalize on that window.
  *   **Link D:** The startup fails.

  Your friend is pointing to **Link A** (the root or distal cause). You are pointing to **Link C** (the trigger or proximate cause). Both are objectively necessary links in the chain that led to the failure. If the delay hadn't happened, the competitor might not have had the opening to cut prices effectively. If the competitor hadn't cut prices, the delay might have been survivable.

  To say only one is "the cause" is like looking at a house fire and arguing whether the cause was the arsonist lighting the match (internal/agent) or the presence of oxygen in the room (external/condition). Both are factually required for the fire. Selecting one as "the cause" is a matter of focus, not a matter of objective truth.

  ### 2. Contrastive Explanation
  Philosophers of science, such as Bas van Fraassen, argue that all "Why?" questions are actually **contrastive**. We never just ask "Why did this happen?" We implicitly ask, "Why did this happen *rather than that*?"

  *   **Your Friend's Question:** "Why did the startup fail *rather than succeed despite market conditions*?"
      *   **Answer:** Because they made an internal error (the delay). This explanation focuses on **agency and control**. It is useful for learning lessons for the next venture.
  *   **Your Question:** "Why did the startup fail *rather than survive the competitor's attack*?"
      *   **Answer:** Because the market conditions became impossible (price cuts). This explanation focuses on **external pressure**. It is useful for market analysis.

  Both answers are true relative to the specific contrast being implied. Your friend is treating "the cause" as a property of the event itself, but "the cause" is actually a relationship between the event and the specific question being asked.

  ### 3. The "Nothing is True" Fear
  Your friend worries that if we accept both explanations, we are just being polite and avoiding reality. This is a fear of **relativism**. However, pluralistic causation is not relativism.

  *   **Relativism says:** "Truth is subjective, so your truth and my truth are both valid opinions."
  *   **Causal Pluralism says:** "The objective reality is complex. There are multiple objective factors that contributed to the outcome. Highlighting one does not erase the others."

  If you say, "The car crash was caused by the icy road," and I say, "The car crash was caused by bald tires," we are not offering subjective opinions. We are offering objective facts. If we argue that *only* one counts, we are actually being *less* accurate about the territory. Admitting both is not a retreat from truth; it is a more rigorous commitment to it.

  ### 4. Why Your Friend Feels Differently (The Pragmatic View)
  Your friend is likely operating under a **pragmatic theory of causation**. In law, insurance, and daily life, we often need to assign *responsibility*.
  *   If we blame the competitor, the founder is absolved.
  *   If we blame the founder, the competitor is just a market force.

  Your friend may feel that calling both "true" lets the founder off the hook. They want to identify the *decisive* factor to assign blame or lesson-learning. You can validate this by agreeing that while both are *causes*, one might be more **explanatorily relevant** depending on the goal.
  *   For a **post-mortem lesson**: The delay is the more useful truth (because it's controllable).
  *   For a **market post-mortem**: The price war is the more useful truth (because it describes the industry landscape).

  ### How to Frame This to Your Friend
  You might say something like this:

  > "I don't think we're disagreeing about the facts. We agree the delay happened, and we agree the price cuts happened. The disagreement is about what we mean by 'cause.'
  >
  > If we say 'the cause,' we imply there's only one lever that, if pulled, would have saved the company. But reality is a web. The delay made them vulnerable; the price cuts exploited that vulnerability. If I say the price cuts killed them, I'm describing the mechanism of death. If you say the delay killed them, you're describing the underlying condition.
  >
  > Saying both are true isn't being polite; it's being precise. If we pick only one, we're ignoring half the physics of what happened. We can agree that the delay was the *controllable* cause (for learning) and the price cuts were the *proximate* cause (for mechanics), without saying one erases the other."

  ### Summary
  There is a defensible sense in which both are true. Causation in complex systems is rarely singular. Acknowledging multiple causal factors is not an abandonment of truth, but an acknowledgment that the world is more complex than a single narrative arc. Your friend is looking for **responsibility**; you are looking for **mechanism**. Both are valid, and both are true.
