answer: |-
  Good evening. For those who don't know me, I'm a colleague of Priya's down the hall. I'm a philosopher of religion, which means I spend my days thinking about faith, while Priya spends hers thinking about rationality. So when she asked me to give this toast, I panicked. I haven't touched decision theory since grad school. But then I realized: Priya's entire research program is about how to avoid being irrational over time, and frankly, marriage is the ultimate test of diachronic consistency.

  Priya studies money-pump arguments. For the family, that's basically what happens when your preferences go in circles—you prefer A to B, B to C, but C to A—and someone exploits that cycle to trade you down until you're broke. For the cohort: I was going to offer [Groom] a series of trades involving Priya, the open bar, and the leftover cake, but I decided against it. I didn't want to violate the axioms of rational choice on the wedding budget.

  But seriously, Priya's work asks a profound question: How do we stick to a plan when our future selves want to deviate? There's a famous distinction by Edward McClennen between being a "sophisticated" chooser and a "resolute" one. A sophisticated chooser knows they might weaken later, so they restrict their future options to prevent it. A resolute chooser keeps the options open but sticks to the original plan anyway, simply because it was the plan.

  Everyone loves to compare marriage to Ulysses tying himself to the mast to resist the Sirens. But decision theorists know that's actually the wrong analogy. Tying yourself to the mast is binding your future self; it's sophisticated choice. McClennen's resolute choice is harder. It's standing on the deck, ears unplugged, hearing the song, knowing you *could* jump, and choosing not to.

  That is what Priya and [Groom] are doing today. They aren't tying themselves to the mast. They aren't signing a contract that removes the option to leave. They are making a resolute choice. They are saying that even when a future node presents a locally preferred alternative—when being right feels better than being kind, or when freedom feels more utility-rich than compromise—they will honor the plan they made today.

  If you treat marriage as a problem to be re-optimized every morning, you become vulnerable. You start comparing your current state to every possible alternative. That is the dynamic inconsistency trap. That is how you get pumped dry—not of money, but of trust, and time, and love.

  Priya knows better than anyone that rationality isn't just about maximizing utility at every single moment. It's about having preferences stable enough to build a life on. It's about looking at the person standing next to you and deciding that this preference is complete, transitive, and final.

  So, please raise your glasses. To Priya and [Groom]. May your preferences remain stable, may you never be money-pumped by life's temptations, and may you always be resolute enough to choose each other, even when you have the option not to. To the couple!
