      *   *Alex:* "You say 'more claims.' I say 'separate lives.' There is no 'more' that experiences the loss."
      *   *Jordan:* "But there is a 'more' that experiences the *salvation*."
      *   *Alex:* "Only individually."
      *   *Climax:* The fuel light flickers. Decision time.
