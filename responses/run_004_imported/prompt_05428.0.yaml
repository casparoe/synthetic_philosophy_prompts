  **(Self-Correction Note on Scanlon's specific argument):** Scanlon argues that the individual in the minority cannot reasonably reject the principle of saving the greater number because their complaint (I die) is not *stronger* than the complaint of any individual in the majority (I die). However, if the minority individual insists on a coin toss, they are asking the majority to accept a principle where their equal claims are discounted. The key is that the "burden" of rejection is compared. I need to make sure Jordan articulates that the single person's complaint doesn't *outweigh* the complaints of the five, it only *matches* one of them.

