answer: |-
  The engine of the *Equilibrium* hammered against the swell, a rhythmic thrumming that vibrated through the soles of Alex's boots. The sea was a bruised purple under the failing light. On the port bow, a single figure clung to a debris raft, waving weakly. On the starboard bow, a lifeboat bobbed, crowded with five heads.

  Alex gripped the wheel. Jordan stood at the console, hand hovering over the throttle.

  "Port side," Alex said. The voice was flat, competing with the wind.

  Jordan looked at the instruments, then at the two groups. "Starboard. Five people. We have fuel for one run. The current will sweep the others out to the deep before we can circle back."

  "I know the math, Jordan. I'm talking about the choice. Flip a coin."

  Jordan turned, eyes narrowing. "You're joking. Five lives against one. You want to toss a coin?"

  "I want to treat them as individuals," Alex said, keeping the boat steady. "To the person on that raft, their life is everything. It's not a fraction. If we steer starboard, we are saying his death is worth less than the sum of the five over there. But there is no 'sum.' No one experiences the death of five people. Only five people experience the death of one person each."

  "This is Taurek all over again," Jordan said, leaning against the railing. "We don't have time for the seminar, Alex, but you're missing the point. It's not about summing loss. It's about justification. What principle can we justify to each of them?"

  "The principle of equal chance," Alex countered. "If we save the five automatically, the one on the port side has zero chance. He is discarded entirely. If we flip a coin, he has a fifty percent chance. Each of the five also has a fifty percent chance. We give every *individual* an equal probability of survival. That is what fairness looks like from the point of view of each person."

  Jordan shook their head. "Fairness isn't just about probability distribution. It's about reasonable rejection. Imagine we adopt your principle: 'In rescue scenarios, flip a coin regardless of numbers.' Can the five people on the starboard side reasonably reject that principle?"

  "Sure they can. They'd say they want better odds."

  "No," Jordan pressed. "They'd say: 'Why should our equal claims to be saved be discounted just to give the single person a better chance than he deserves?' Look at it from the single person's view. If he rejects the principle 'Save the Greater Number,' his complaint is 'I will die.' If one of the five rejects it, their complaint is also 'I will die.' The complaints are identical in weight. One death is not worse than another death."

  "Exactly," Alex said. "So why does the group win?"

  "Because the single person cannot reasonably demand that the five accept a principle that lowers their survival chances when his claim is no stronger than any single one of theirs," Jordan said, the words coming faster now. "If he insists on a coin toss, he is effectively saying, 'My claim to be saved outweighs the claims of all five of you combined.' But he just admitted his claim is only equal to *one* of them. He can't logically claim equality with one and superiority over five. Saving the greater number is the only policy that treats all claims as equal without arbitrarily ignoring the majority of them."

  Alex throttled back slightly as a wave crested. "You're smuggling aggregation in through the back door, Jordan. You say you aren't summing welfare, but what else is 'the majority of them'? When you say we can't ignore the five, you're treating them as a bloc that outweighs the one. Taurek's point was that society stops at the skin. There is no 'bloc.' There is just me, and you, and him. To the one on the port side, the fact that five others exist doesn't make his death less tragic. It doesn't make it *anything*. It's still the end of his world."

  "And to the five on the starboard side," Jordan shot back, "the fact that one person exists doesn't make *their* collective destruction acceptable. You're focusing entirely on the loss of the one if we save the five. You're ignoring the loss of the five if we toss the coin. If we toss, and it lands port, five people die who could have been saved. You are willing to accept the certain death of four *extra* people—the marginal difference—just to satisfy a procedural ideal of equal chance."

  "It's not procedural! It's metaphysical," Alex insisted. "It's about what value *is*. You can't add lives like coins in a jar. If I have a headache and you have a headache, we don't have one giant headache. If I die and you die, we don't have one giant death. So when you decide to save the five, you aren't preventing 'more death.' You are preventing five individual deaths at the cost of one. But you have no right to sacrifice the one to do it, because he hasn't consented to be part of your calculus."

  "He hasn't consented to be sacrificed, but he also has no right to demand sacrifice from the five," Jordan said. "That's the contractualist symmetry. Think about the rejection again. If we adopt the policy 'Save the One,' each of the five can say, 'You let me die to save someone whose claim was no stronger than mine.' That is a reasonable rejection. If we adopt 'Save the Five,' the one says, 'You let me die to save others.' True. But can he add, '...whose claims were no stronger than mine'? Yes. But does that make the policy unreasonable? No. Because the policy doesn't say his life is worth *less*. It says that when equal claims conflict, we satisfy the greater number of claims. It's not that his life is cheaper. It's that we can save more people without violating his status as an equal."

  Alex laughed, a sharp, humorless sound. "Status as an equal? If status is equal, why does he get 0% survival and they get 100%? A coin toss gives everyone 50%. That is the only definition of equality that matters when you can't save everyone."

  "Equality of outcome isn't possible," Jordan said. "Someone dies either way. We are talking about equality of *justification*. We can justify saving the five to the one. We can say, 'We did not ignore you. Your claim was weighed. But there were five claims of equal weight on the other side.' Can we justify saving the one to the five? 'We let four of you die unnecessarily to give this one person a better statistical chance'? That justification fails. The burden on the four extra dead is a burden that could have been avoided without increasing the burden on the one."

  "Could it?" Alex spun the wheel slightly, correcting the drift. "The burden on the one *is* increased. Going from 50% chance of death to 100% chance of death is a massive increase in burden. You're dismissing the value of hope. You're dismissing the value of not being treated as a means to the greater good."

  "I am not treating him as a means," Jordan said, voice hardening. "I am acknowledging that his claim does not trump the claims of the five. Taurek thinks that because we can't sum the badness of death, we must ignore the numbers. But we don't need to sum the badness to know that saving five people is a better resolution of conflicting claims than saving one. It's not utilitarianism. It's about not letting equal claims go unsatisfied when they could be satisfied."

  "But they can't all be satisfied!" Alex shouted over the engine. "That's the tragedy! And in the face of tragedy, you choose to play God with the numbers. I choose to let fate decide. The coin doesn't choose the five over the one. The coin chooses *blindly*. It respects the separateness of persons by refusing to weigh them against each other."

  "The coin chooses blindly, and four people die for no reason other than luck," Jordan said. "That's not respecting persons. That's abandoning them to randomness when we have a principle that respects them all. The principle 'Save the Greater Number' respects the one by acknowledging his claim is equal. It respects the five by acknowledging there are more of them. Your coin toss respects no one. It treats the five as if they were one person, and the one as if he were five."

  Alex went silent for a moment. The raft on the port side was closer now. A face was visible, pale, eyes wide. The lifeboat on the starboard was a cluster of movement.

  "If I flip the coin," Alex said quietly, "and it lands on the five, I save them. I haven't lost anything you wanted, Jordan, except the certainty. If it lands on the one, I save him. And I haven't killed him to save the others. I haven't made his death a *premise* of their survival."

  "But you have made their survival *less likely* as a premise of his fairness," Jordan replied. "You are prioritizing the purity of the decision-maker's conscience over the actual survival of the people in the water. You want to walk away clean, Alex. 'I didn't choose to kill the one; the coin did.' But you chose to use the coin. You chose the procedure that you knew would likely result in more deaths."

  "And you choose the procedure that guarantees the one is sacrificed," Alex said. "You look at him and you see a remainder. A decimal point. I look at him and I see a universe."

  "I see six universes," Jordan said. "And I have to choose which five to preserve. If I don't count, I'm not respecting the six. I'm respecting the math of my own integrity."

  The fuel warning light flickered on the dashboard. A low, amber pulse.

  "We're out of debate time," Alex said, hand moving toward the pocket where a coin rested.

  Jordan's hand hovered over the throttle lever that would commit them to starboard. "If you flip that coin, you are rejecting a principle that no one could reasonably reject."

  "And if you steer starboard," Alex said, meeting Jordan's eyes, "you are rejecting the claim of the individual to not be overridden by a collective he doesn't belong to."

  The boat surged forward with the next wave. The choice hung in the space between the wheel and the throttle, between the single waving arm on the left and the cluster of heads on the right. The engine roared, drowning out the sea, waiting for a hand to move.
