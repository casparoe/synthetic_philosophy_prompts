  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Is Alex making the utilitarian mistake? No, Alex must insist that the single person's claim isn't *outweighed*, just matched.
      *   *Check:* Is Jordan making the utilitarian mistake? Jordan must avoid saying "5 lives > 1 life." Instead, Jordan must say "The complaint of the one is not strong enough to override the combined complaints of the five *in this specific structural way*." Actually, Scanlon is careful. He says we compare the *strength* of complaints. If the principle is "Save the One," each of the five has a complaint of death. If the principle is "Save the Five," the one has a complaint of death. The complaint of the one is not stronger than the complaint of any *single* one of the five. Therefore, the one cannot reasonably reject the principle that saves the five, because that principle treats his claim as equal to the others, whereas his preferred principle treats his claim as superior to the others.
