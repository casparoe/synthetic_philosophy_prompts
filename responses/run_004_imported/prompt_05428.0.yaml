      *   *Round 2:* Alex argues from individual loss (Taurek's "no summing"). Jordan argues from reasonable rejection (Scanlon's "individual claims").
      *   *Round 3:* Alex attacks Contractualism as covert aggregation. Jordan defends the distinction between "summing value" and "weighing complaints."
      *   *Round 4:* Alex argues about fairness/chance. Jordan argues about the burden of rejection.
