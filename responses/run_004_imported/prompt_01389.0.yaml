prompt: |-
  For my school's philosophy elective, we're in the middle of a unit on philosophy of religion, and this week we were asked to read Part I of Section X of Hume's *An Enquiry Concerning Human Understanding* (1748), "Of Miracles," in the original rather than from a textbook summary. My teacher likes to point out that everyone can recite the "extraordinary claims require extraordinary evidence" one-liner without ever having actually followed the reasoning behind it, and I'd like to do better than that when we discuss the essay in seminar on Thursday. I've mostly followed the argument, but I keep getting stuck on how one specific idea is supposed to work. Here is the passage:

  "A wise man, therefore, proportions his belief to the evidence. In such conclusions as are founded on an infallible experience, he expects the event with the last degree of assurance, and regards his past experience as a full proof of the future existence of that event. In other cases, he proceeds with more caution: he weighs the opposite experiments: he considers which side is supported by the greater number of experiments: to that side he inclines, with doubt and hesitation; and when at last he fixes his judgement, the evidence exceeds not what we properly call probability. All probability, then, supposes an opposition of experiments and observations, where the one side is found to overbalance the other, and to produce a degree of evidence, proportioned to the superiority. A hundred instances or experiments on one side, and fifty on another, afford a doubtful expectation of any event; though a hundred uniform experiments, with only one that is contradictory, reasonably beget a pretty strong degree of assurance. In all cases, we must balance the opposite experiments, where they are opposite, and deduct the smaller number from the greater, in order to know the exact force of the superior evidence."

  A little later in the same Part, after applying this same idea to human testimony and to his definition of a miracle as a violation of the laws of nature, he draws this conclusion: "The plain consequence is (and it is a general maxim worthy of our attention), 'that no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish; and even in that case there is a mutual destruction of arguments, and the superior only gives us an assurance suitable to that degree of force, which remains, after deducting the inferior.'"

  What I can't work out is how the "deducting" is supposed to carry over from the first part of the passage to the second. With a hundred instances against fifty, the subtraction is straightforward, because you are literally counting occurrences. But the case against a miracle is supposed to be a full proof, and by Hume's own definition just a few lines earlier, a "proof" is exactly what you have when the experience is uniform and admits no opposition at all, as opposed to a mere probability, which is what you have when the experience is mixed. If the evidence for the laws of nature really is a proof in that strict sense, I don't see how a witness's testimony could subtract any "force" from it at all, rather than either being completely outweighed with nothing left to subtract, or else showing that our experience was never truly uniform, and so was never really a proof to begin with. Is there a way of reading "deducting the inferior" that keeps it consistent with Hume's own proof/probability distinction, or is this actually a genuine soft spot in the argument? I'd rather understand the mechanics properly than just repeat the slogan version in front of my class.
