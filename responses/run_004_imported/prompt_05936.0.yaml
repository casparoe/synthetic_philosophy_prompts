          *   *Analysis:* This hits the core technical requirement of Nyāya inference. *Vyāpti* usually requires *bhūyodarśana* (repeated observation). You can't infer a name-application based on a definition without already knowing the name applies.
          *   *Verdict:* Elena scores a significant point. Marcus's reduction assumes the universal connection is already established knowledge, but *upamāna* is precisely the process of *establishing* that connection for the subject.

