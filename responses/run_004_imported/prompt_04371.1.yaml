answer: |-
  # The Logarithmic Mask: Why Geometric Rationality is a Distinct Norm

  The debate over Kelly betting is often framed as a technical dispute about portfolio optimization, but as your seminar touched on, it is actually a proxy war over the foundations of rationality itself. On one side stands the Samuelsonian orthodoxy: Expected Utility (EU) maximization is the sole definition of rational choice, and Kelly betting is merely what happens when an agent happens to possess a logarithmic utility function. On the other side stands the emerging coalition of Ergodicity Economics (Ole Peters) and Geometric Rationality (Scott Garrabrant): they argue that maximizing the geometric mean is a fundamental requirement of surviving in time, independent of subjective preference, and that the EU framework smuggles in invalid assumptions about parallel universes.

  You asked for a verdict, not a fence-sit. Here it is: **Geometric rationality is a genuinely distinct normative framework from Expected Utility maximization.** While the *behavior* of a geometric maximizer in standard betting scenarios is extensionally equivalent to an EU maximizer with log utility, the *justification* is fundamentally different. More importantly, in non-ergodic environments involving ruin or multiplicative dynamics, the EU framework (relied upon by Samuelson) yields objectively incorrect prescriptions if it relies on ensemble averages. Geometric rationality is not "Log-EU in disguise"; it is the physics of decision-making, whereas EU is the psychology. Where the two conflict, the geometric norm should override the psychological one.

  ### The Reductionist Case: Samuelson's "Disguise"

  To understand why the distinction matters, we must first steelman the reductionist view. Paul Samuelson's 1979 paper, written famously in one-syllable words (save the last), was not just a stylistic stunt; it was a defense of the von Neumann-Morgenstern (VNM) axioms.

  The core of the Samuelsonian argument is that "rationality" is defined by consistency of preference, not by survival. If you accept the VNM axioms (completeness, transitivity, continuity, and independence), a representation theorem proves you must act *as if* you are maximizing expected utility. In this framework, utility functions are subjective. Some people love risk; some hate it. If you bet according to the Kelly criterion, you are simply revealing that your utility function is $U(w) = \ln(w)$.

  Samuelson's critique of the "long run" argument is devastatingly simple: the law of large numbers does not apply to a single lifetime. Just because a strategy wins "almost surely" in the limit does not mean it is rational for a finite agent. If a bet has a positive expected value but a high risk of ruin, an EU maximizer with linear utility (risk-neutral) should take it, even if it eventually bankrupts them. To Samuelson, telling that agent they are "irrational" for not betting Kelly is nonsense; they are simply optimizing a different function. The reductionist claims that the "Geometric" crowd is just doing EU maximization but refusing to admit they've chosen a specific utility function. They argue that any geometric behavior can be "redescribed" as EU maximization over a transformed quantity, rendering the geometric label superfluous.

  ### The Ergodic and Geometric Revival

  The counter-argument, championed by Ole Peters and expanded by researchers like Scott Garrabrant, attacks the premises of the EU framework rather than the math.

  **1. The Ergodicity Argument (Peters):**
  The EU framework relies on *ensemble averages*. It asks: "What is the average outcome if a million parallel copies of me take this bet?" But no human lives in an ensemble. We live in time. We experience the *time average* of a single trajectory. In additive processes (win \$10 or lose \$10), the ensemble average and time average converge. In multiplicative processes (win 10% or lose 10%), they diverge.

  Peters argues that using ensemble averages in non-ergodic systems is a physical error, not a preference difference. If you bet your whole bankroll on a favorable coin flip repeatedly, the ensemble average wealth goes to infinity, but the time-average wealth for any single path goes to zero. An EU maximizer using ensemble averages will prescribe a strategy that leads to certain ruin. A geometric maximizer optimizes the growth rate of the single path. This isn't about having "log utility"; it's about respecting the dynamics of the system. The logarithm falls out of the math of compounding, not from a psychological axiom.

  **2. The Structural Argument (Garrabrant):**
  Scott Garrabrant's work on Geometric Rationality pushes this further, suggesting that geometric maximization unifies phenomena that EU struggles to reconcile. In EU, belief updating (Bayes), bargaining (Nash), and betting (Kelly) are distinct problems with different solutions. Geometric rationality suggests they are all instances of maximizing a product of factors rather than a sum.

  Crucially, Garrabrant argues that geometric agents can violate the VNM Independence Axiom in ways that are coherent. If rationality is about avoiding Dutch books (sure losses) in a world of logical uncertainty and bargaining, the additive structure of EU is not the only coherent option. The geometric framework treats probabilities and utilities more symmetrically, suggesting that the "Log-EU" reduction is a category error—it tries to force a multiplicative structure into an additive mold.

  ### The Verdict: Distinct Foundations, Not Just Disguises

  So, is Geometric Rationality just Expected Utility with a log transformation? **No.**

  The reductionist claim relies on the idea that because any behavior can be *modeled* as EU maximization (by reverse-engineering the utility function), EU is the fundamental truth. This is a tautology. It is like saying "gravity doesn't exist; objects just have a preference to fall at 9.8 m/s²." You can model the behavior, but you haven't explained the mechanism.

  Here is the precise line where the distinction holds:

  **1. Derivation vs. Posit:**
  In the EU framework, the utility function is *posited*. It is a primitive axiom of the agent's psychology. There is no reason within EU theory why an agent *should* have log utility; they just do. In the Geometric/Ergodic framework, the logarithmic objective is *derived* from the physical structure of the environment (multiplicative dynamics over time). This makes Geometric Rationality a theory of **ecological rationality** (fit between agent and environment), whereas EU is a theory of **internal consistency**. A norm that derives its objective function from reality is distinct from a norm that treats the objective function as arbitrary.

  **2. The Treatment of Ruin:**
  Samuelson's view allows for "rational ruin." If your utility is linear enough, you should take bets that bankrupt you with probability 1, provided the ensemble expected value is high. The Geometric view categorically forbids this in repeated play. It posits that **existence is a prerequisite for utility.** You cannot maximize utility if you cease to exist as an agent. This is a hard constraint in the Geometric framework, whereas in EU it is merely a parameter choice. This makes Geometric Rationality a distinct norm regarding survival.

  **3. The Independence Axiom:**
  If Garrabrant is correct that geometric coherence requires violating the VNM Independence Axiom in certain bargaining or logical uncertainty contexts, then the two frameworks are mathematically incompatible, not just philosophically distinct. EU maximizers must satisfy Independence; Geometric maximizers do not. If an agent's behavior violates Independence to maintain geometric coherence, they literally *cannot* be an EU maximizer. They are optimizing a different objective function that is not representable as an expectation of a sum.

  ### Conclusion

  The Samuelsonian critique is correct that "maximizing long-run growth" does not justify itself without a goal. But the Ergodic/Geometric camp provides that goal: **continuation.**

  We should view Expected Utility as the correct normative theory for *one-off, additive, ensemble-based* decisions (like social planning or insurance pools). However, for *repeated, multiplicative, individual* decisions, Geometric Rationality is the superior norm. It is not "Log-EU in disguise." It is a distinct framework that prioritizes the physics of time and survival over the axioms of preference.

  Your professor's tangent was warranted. Kelly betting isn't just a trick for gamblers; it is the canary in the coal mine for the limitations of Expected Utility. When the ensemble average diverges from the time average, EU breaks. Geometric rationality fixes it not by tweaking the utility function, but by changing the definition of the average. That is a revolution in decision theory, not a rebranding.
