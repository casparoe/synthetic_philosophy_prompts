      *   **The Work/Life Balance:** Mention the delivery truck. It grounds him. He wasn't an academic; he was a working man who found wisdom.
      *   **The Philosophy (Subtle):** Introduce the *Zhuangzi* without making it a lecture. Focus on how he read it.
