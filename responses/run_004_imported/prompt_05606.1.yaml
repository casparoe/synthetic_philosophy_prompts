answer: |-
  (Pause, take a breath, and look out at the family, then specifically at your grandma for a moment.)

  Thank you, Pastor. And thank you all for being here.

  For thirty-five years, my grandfather drove a delivery truck. He knew every backroad and shortcut in this state. He knew how to fix an engine with a piece of wire and how to be kind to a dispatcher who was having a bad day. He was a working man. But if you knew him in retirement, you know he was also a scholar of sorts. He didn't have a degree, but he had four different copies of the same book on his shelf. He called it *Chuang Tzu*.

  He spent the last years of his life reading it, arguing with it, and reading bits of it to me. And because of that, the family has asked me to say a few words about what Grandpa believed about where he is now.

  This is a church, and we all find comfort in different traditions. Grandma finds comfort in knowing he is safe in God's care. And I think, in his own way, Grandpa found a comfort that was just as deep, just as peaceful, and honestly, just as holy.

  Grandpa didn't believe that death was a punishment. He didn't believe it was a door we have to be afraid to walk through. He used to tell me that our bodies aren't really ours to keep. He said life is like a loan. We borrow this shape, this breath, this ability to hug our grandkids and drive our trucks and drink our coffee for a little while. And when the time comes, we don't lose it. We just give it back.

  He told me once, "When I go, don't worry about burying me proper. Heaven and earth are already my coffin. The stars are my jewelry."

  I know that sounds unusual. But what he meant was that he wasn't going anywhere distant. He believed that when we die, we aren't separated from the world; we just change our form. We go back into the flow of things.

  There's a story in that book he loved, about a skull. It sounds strange, I know. But in the story, the skull speaks in a dream and says that being dead isn't dark or lonely. It said that in death, there are no bosses above you, no seasons to suffer through, no aches in your back. Just rest. Eternal rest.

  That's what I want you to think about today. Especially my little cousins. I know it hurts that he isn't here. I know you miss his voice. But Grandpa spent his last years making peace with the idea that he doesn't have to work anymore. The delivery is finished. The route is done.

  He taught me that life and death aren't enemies. They're just like day and night. You don't get angry at the sun for setting. You don't worry that the night has taken the day away. The day just becomes the night, and the sun is still there, doing its work, even when we can't see it.

  So, I'm not going to tell you he's watching us from a cloud. I don't think he needs to be that far away to be with us. I think he's in the quiet moments. I think he's in the way we treat each other when we're tired. I think he's in the peace that finally came to him after being sick for so long.

  Grandpa used to argue with his translations about the best way to understand the end of life. But in the end, I think he found the answer that matters most. He found rest. He found wholeness.

  We can miss him and still be happy that he isn't in pain anymore. We can grieve and still trust that he is exactly where he wanted to be: handed back to the universe he loved, resting without a boss, without a season, without a worry.

  He gave us his love while he was here. Now, he gives his body back to the earth. And that isn't a loss. That's just the loan being repaid.

  Rest well, Grandpa. The truck is parked. You can sleep now.

  Thank you.
