      *   **Constraint 2 (Content):** Do *not* use the "drumming on a basin" story (uncle already ruined it). *Do* use the "skull pillow/dream," "heaven and earth coffin," and "body as a loan" concepts.
      *   **Constraint 3 (Audience):** Needs to comfort Grandma/cousins (traditional) without lying to the philosophy buffs (Grandpa/uncle/speaker). No lectures on Daoism.
      *   **Goal:** Hold both worldviews simultaneously without betraying Grandpa's actual beliefs.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Christian View:* Death is a transition to a better state; separation is temporary; God watches over.
      *   *Zhuangzi View:* Death is a transformation; separation is an illusion; Nature/Dao encompasses all.
      *   *The Bridge:* Both views offer comfort through *continuity* and *peace*. The key is to focus on the *quality* of his peace and the *nature* of his return, using language that is poetic enough to satisfy the Daoist view but spiritual enough to not alarm the Methodist view.
      *   *Key Strategy:* Focus on "Rest," "Return," and "Wholeness." Avoid specific theological claims about *where* he is (heaven vs. void), focus on *what* he is (part of the whole).

  3.  **Drafting - Section by Section:**

