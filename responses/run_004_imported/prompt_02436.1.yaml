  3.  **Evaluate the "Hypothetical Necessity" Distinction:**
      *   *Is it genuine?* Yes, for Leibniz, it rests on the nature of truth. All truth is analytic (predicate in subject). But for contingent truths, the analysis is *infinite*. Only God can see the full proof. Humans see it as contingent because we can't reduce it to identity.
      *   *Does it save freedom?* This is the crux. Leibniz defines freedom as spontaneity (action from one's own nature) + intelligence (knowledge of the good) + contingency (the opposite is possible *in itself*).
      *   *The Pressure Point:* If my concept *includes* crossing the Rubicon, and I am the individual who exists, I *must* cross it. If I didn't, I wouldn't be *me*. So, in what sense is it "possible" for *me* not to cross it?
      *   *Leibniz's Answer:* It is possible *in the abstract* (the proposition "Caesar does not cross" is not contradictory), but it is not *compossible* with the rest of this world's history which God chose.
