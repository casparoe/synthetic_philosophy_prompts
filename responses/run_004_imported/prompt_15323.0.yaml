answer: |-
  **Title:** The Illusion of Derivation: Why Harsanyi's Theorem Does Not Save Utilitarianism

  **Introduction**

  It is easy to understand why Harsanyi's Aggregation Theorem appeals to a physicist. In physics, we prize derivations where macroscopic laws emerge inevitably from microscopic constraints. We look for the minimal set of symmetries or conservation principles that force the hand of nature. Harsanyi's 1955 result promises exactly this for moral philosophy: start with the "microscopic" rationality of individuals (von Neumann-Morgenstern axioms), add a minimal consistency condition for society (Pareto indifference), and the "macroscopic" law of utilitarianism ($W = \sum U_i$) falls out as a mathematical necessity. It suggests that utilitarianism is not merely one moral opinion among many, but the unique solution to the problem of social aggregation under uncertainty.

  However, mathematical elegance is not ontological proof. A derivation is only as sound as the physical reality mapped onto its variables. In the decades since Harsanyi, the philosophical consensus has shifted significantly against the theorem's normative force. While the mathematics remains valid, the mapping of moral concepts onto those mathematics is flawed.

  This essay argues that your reading group's cooled enthusiasm is warranted. Harsanyi's theorem does not provide an axiomatic vindication of utilitarianism. Instead, it achieves its result by conflating *rational preference* with *moral welfare* and by smuggling substantive normative assumptions—specifically regarding interpersonal comparability and procedural fairness—into axioms that appear merely formal. On balance, the objections raised by Sen and Diamond demonstrate that the theorem's apparent force trades on an equivocation of "utility."

  **The Theorem and Its Promise**

  To see where the slippage occurs, we must be precise about what the theorem establishes. Harsanyi assumes a society of $n$ individuals facing lotteries over social states.
  1.  **Individual Rationality:** Each individual's preferences satisfy the von Neumann-Morgenstern (VNM) axioms, meaning they can be represented by utility functions $U_i$ unique up to positive affine transformations ($U'_i = aU_i + b, a > 0$).
  2.  **Social Rationality:** Society's preferences also satisfy VNM axioms, represented by a social welfare function $W$.
  3.  **Pareto Indifference:** If every individual is indifferent between two lotteries, society must be indifferent.

  The mathematical conclusion is that $W$ must be a linear combination of the $U_i$:
  $$W = \sum_{i=1}^n a_i U_i + b$$
  If we assume strong Pareto (if everyone prefers A to B, society prefers A to B), the weights $a_i$ are non-negative. If we normalize the weights, we get classical utilitarianism: maximize the sum of utilities.

  The allure is that "Pareto Indifference" seems morally innocuous. Who could object to the idea that if no one cares about the difference between two outcomes, society shouldn't either? It appears to derive a controversial moral theory (utilitarianism) from uncontroversial premises (rationality and unanimity).

  **Sen's Objection: The Measurement Problem**

  Amartya Sen's critique strikes at the measurement scale of the variables. In physics, we know that adding quantities requires a common unit. You cannot add meters to seconds. Similarly, to sum individual utilities ($\sum U_i$), the units and zero-points of each $U_i$ must be comparable.

  VNM utility is *cardinal*, but it is not *interpersonally comparable*. If $U_1$ represents Alice's preferences, $2U_1$ represents the same preferences. If $U_2$ represents Bob's, $U_2 + 100$ represents the same preferences. The VNM axioms fix the scale for Alice relative to her own risks, and for Bob relative to his, but they provide no bridge between Alice and Bob.

  For Harsanyi's sum to make moral sense, we must fix the constants $a$ and $b$ for every individual such that one "util" for Alice is equivalent to one "util" for Bob. Harsanyi attempts to solve this by invoking an "impartial observer" who imagines having an equal chance of being anyone. But as Sen points out, this move implicitly assumes that we can compare the *intensity* of different people's preferences.

  The axioms themselves do not license this. To assume that Alice's preference strength can be added to Bob's is to assume a specific theory of welfare (that welfare is preference satisfaction and that satisfaction is comparable across minds). This is not a mathematical derivation; it is a normative assertion disguised as a scaling convention. Without this assertion, the equation $W = \sum U_i$ is mathematically coherent but morally meaningless, like adding temperature to mass. Sen shows that Harsanyi has not derived utilitarianism from rationality; he has derived it from rationality *plus* the assumption of interpersonal comparability. Since the latter is the very thing utilitarians need to prove, the argument is circular.

  **Diamond's Objection: The Fairness Problem**

  If Sen attacks the currency of the theorem, Peter Diamond attacks its accounting rules. Diamond's 1967 critique focuses on the Pareto Indifference axiom in the context of fairness.

  Consider Diamond's famous example: An indivisible good (say, a life-saving drug) must go to one of two individuals, Alice or Bob, who are identical in all relevant respects (need, merit, etc.).
  *   **Policy A:** Give the drug to Alice.
  *   **Policy B:** Give the drug to Bob.
  *   **Policy C:** Flip a fair coin to decide.

  Assume Alice and Bob are self-interested VNM maximizers. They care only about their own probability of survival.
  *   In A, Alice's expected utility is $U$, Bob's is $0$. Sum = $U$.
  *   In B, Alice's expected utility is $0$, Bob's is $U$. Sum = $U$.
  *   In C, Alice's expected utility is $0.5U$, Bob's is $0.5U$. Sum = $U$.

  Because the sum of expected utilities is identical, Harsanyi's social welfare function must be indifferent between the deterministic allocation (A or B) and the coin flip (C). Furthermore, because Alice and Bob are indifferent between a 50% chance and a situation where one of them gets it for sure (in terms of *ex-ante* expectation), the Pareto axiom forces society to be indifferent as well.

  Yet, most moral intuitions suggest Policy C is superior. It treats the individuals with equal respect *ex-ante*. It avoids the arbitrariness of picking a winner. Diamond argues that a social welfare function should care about the *distribution* of utility, not just the sum. By ruling out any preference for the coin flip, Harsanyi's theorem effectively defines fairness out of existence.

  The theorem forces a choice: either accept that fairness has no independent moral weight (only outcomes matter), or reject the Pareto axiom. Harsanyi chooses the former. But this is not a neutral result of rationality; it is a substantive commitment to outcome-oriented consequentialism. The theorem does not prove that fairness is irrelevant; it assumes a framework where fairness *cannot* be represented unless it is already reflected in individual expectations.

  **Evaluating the Rescue Strategies**

  Defenders of Harsanyi often attempt to rescue the theorem by expanding the definition of individual utility. They argue that if Alice and Bob value fairness, they will prefer the coin flip. If $U_i$ includes a "fairness term," then the expected utility of Policy C becomes higher than A or B for both individuals. Consequently, the Pareto axiom would then require society to prefer the coin flip.

  This strategy saves the mathematical consistency of the theorem, but it eviscerates its philosophical significance.

  First, it renders the theorem trivial. If "utility" simply means "whatever people happen to prefer," then the theorem only proves that society should satisfy preferences. This is no longer a vindication of *utilitarianism* (which is typically a theory about maximizing *welfare* or *well-being*), but of preference satisfaction. If people prefer unfair outcomes (e.g., racist preferences), the theorem would mandate them. Utilitarianism usually claims a normative grip on what *should* be maximized, not just what *is* wanted.

  Second, it concedes the main point of the Diamond objection. Diamond's argument is that fairness is a *social* value, not necessarily an *individual* preference. We might believe a coin flip is fair even if the participants are too resigned or cynical to care. By folding fairness into $U_i$, we reduce a structural moral requirement (equity of process) to a matter of individual psychological taste.

  Finally, this move makes the "innocuous" VNM axioms non-innocuous. If $U_i$ includes complex social preferences about other people's outcomes and procedural justice, it is no longer clear that individuals satisfy VNM rationality. People often violate VNM axioms when fairness is involved (e.g., rejecting a gamble that benefits them but hurts a peer). By broadening $U_i$ to save the conclusion, we risk breaking the premises.

  **The Verdict**

  We must now come down on the question: Does Harsanyi's theorem give us good reason to accept utilitarianism?

  The answer is **no**.

  Harsanyi's theorem is a valid piece of mathematics, but it is an invalid piece of moral philosophy. It suffers from what a physicist might call a "category error" in the mapping of variables.

  1.  **Conflation of Utility:** The theorem conflates *VNM utility* (a representation of risk preference) with *Benthamite utility* (a measure of moral welfare). As Sen demonstrates, the former lacks the interpersonal comparability required for the latter. To bridge this gap requires a normative assumption that the theorem claims to derive.
  2.  **Exclusion of Process:** As Diamond demonstrates, the theorem's reliance on Pareto Indifference over VNM expectations structurally excludes procedural fairness unless that fairness is already instrumentally valued by individuals. This presupposes a consequentialist ontology rather than proving it.
  3.  **The "Innocuous" Axioms:** The axioms are not neutral. Pareto Indifference is a powerful moral constraint that prioritizes efficiency over equity. VNM rationality is a constraint on consistency, not on moral worth. Combining them does not purify the moral content; it merely hides it inside the formalism.

  For a physicist, the lesson is cautionary. In thermodynamics, we can derive macroscopic pressure from microscopic collisions because the mapping between particle momentum and pressure is physically grounded. In Harsanyi's theorem, the mapping between "preference satisfaction" and "social good" is not grounded; it is stipulated.

  The theorem shows that *if* you believe welfare is preference satisfaction, *and* *if* you believe those satisfactions are comparable, *and* *if* you believe only expected outcomes matter, *then* you must be a utilitarian. But those three "ifs" constitute the entire debate of modern moral philosophy. Harsanyi has not solved the debate; he has merely formalized one side of it.

  Your reading group's initial enthusiasm was a reaction to the beauty of the formalism. Your cooled enthusiasm is a reaction to the realization that the formalism does not carry the weight placed upon it. The objections by Sen and Diamond are not merely technical quibbles; they reveal that the theorem's derivation of utilitarianism is illusory. It does not squeeze strong conclusions from innocuous axioms. It squeezes strong conclusions from axioms that are already loaded with the very utilitarian assumptions they purport to prove.

  **Conclusion**

  Harsanyi's Aggregation Theorem remains a landmark in social choice theory, but it should be retired as a foundation for normative ethics. It fails to provide the axiomatic vindication of utilitarianism because it relies on a conception of utility that is mathematically convenient but morally thin. The "distinct senses of utility" are indeed conflated: the utility of the gambler is not the utility of the moralist. To build a moral theory, we need more than consistency; we need a justified account of value and comparison that the theorem assumes but cannot supply. The verdict must be that the objections hold: the theorem is mathematically sound but philosophically overextended.
