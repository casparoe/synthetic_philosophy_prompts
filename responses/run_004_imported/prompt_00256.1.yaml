answer: |-
  **Setting:** *A quiet corner of the university coffee shop, late afternoon. Two graduate students, Alex and Jamie, are surrounded by open notebooks and half-empty espresso cups. The whiteboard behind them is still faintly marked with payoff matrices from earlier.*

  **Jamie:** (Stirring coffee) I've been thinking about what Marcus said in seminar today. You know, about the lecture notes claiming that Iterated Elimination of Dominated Strategies (IEDS) using mixed strategies is the exact operationalization of Common Knowledge of Rationality (CKR).

  **Alex:** Right, the Pearce-Bernheim result. In two-player games, it's rock solid. A strategy survives IEDS if and only if it's rationalizable. It's the gold standard.

  **Jamie:** But Marcus's point about three-player games is nagging at me. He argued that once you have more than two players, using mixed-strategy dominance to eliminate strategies quietly assumes that each player believes their opponents randomize independently of one another. And that assumption isn't forced by CKR alone.

  **Alex:** (Leaning forward) I see where he's coming from, but I think he's conflating two different concepts. Let's be precise. In a three-player game, when we check if Player 1's strategy $s_1$ is dominated by a mixed strategy $\sigma_1$, we check if $u_1(\sigma_1, s_2, s_3) > u_1(s_1, s_2, s_3)$ for *all* pure profiles $(s_2, s_3)$. We aren't integrating over beliefs yet. We're just looking at the geometry of the payoff space.

  **Jamie:** But the epistemic story *behind* the elimination is that $s_1$ is never a best response. And to be a best response, you need a belief over $(s_2, s_3)$. The question is: what kind of belief? If CKR just means "I know you're rational, and you know I'm rational," why would my belief about your choice be statistically independent of my belief about Player 3's choice?

  **Alex:** It wouldn't. And that's exactly why standard IEDS corresponds to **Correlated Rationalizability**, not Independent Rationalizability. The set of strategies surviving IEDS allows Player 1 to hold correlated beliefs about Players 2 and 3. For example, Player 1 might think, "If Player 2 plays Up, Player 3 is likely to play Left," perhaps because they both read the same economic report. That's consistent with CKR.

  **Jamie:** Okay, so you're saying the notes are right, and Marcus is wrong?

  **Alex:** I'm saying Marcus is right that there's a distinction, but he might have the direction reversed. Standard IEDS *allows* correlation. If you *impose* independence, you get a smaller set of strategies—Independent Rationalizability. The notes claim IEDS = CKR. If CKR doesn't imply independence, then IEDS (which yields Correlated Rationalizability) is the correct benchmark.

  **Jamie:** But is CKR really that permissive? Think about the non-cooperative spirit of the game. There's no correlation device. There's no contract. If I'm Player 1, and I have no information linking Player 2 and Player 3, assuming their choices are correlated seems like I'm inventing structure that isn't there. Independence should be the default null hypothesis.

  **Alex:** That's a normative claim, not an epistemic one. Epistemically, CKR restricts beliefs to put weight only on rational strategies. It doesn't restrict the *joint* distribution. If I think Player 2 and 3 are both rational, I still might think their rational choices are correlated due to some common parameter in the game structure I can't see. Ruling that out requires an extra assumption: Common Knowledge of Independent Conjectures.

  **Jamie:** Let's make this concrete. I want to see where the sets actually diverge. Can we sketch a three-player game where a strategy survives IEDS (Correlated) but would be eliminated if we assumed independence?

  **Alex:** (Grabbing a napkin) Sure. Let's look at a variation of a coordination game. Three players. Player 1 chooses *In* or *Out*. Players 2 and 3 choose *A* or *B*.
  Let's give Player 1 this payoff for playing *In*:
  *   Payoff is 10 if $(s_2, s_3)$ is $(A, A)$ or $(B, B)$.
  *   Payoff is 0 if $(s_2, s_3)$ is $(A, B)$ or $(B, A)$.
  *   Payoff for *Out* is a safe 5.

  **Jamie:** Okay. So Player 1 wants to match the parity of 2 and 3.

  **Alex:** Exactly. Now, suppose Players 2 and 3 have payoffs such that both *A* and *B* are rationalizable for them. Maybe they are playing a dummy game where they are indifferent, or their payoffs depend on Player 1 in a way that keeps both options alive. So, $S_2 = \{A, B\}$ and $S_3 = \{A, B\}$.

  **Jamie:** If I'm Player 1, and I assume independence... let $p$ be the prob Player 2 plays *A*, $q$ be the prob Player 3 plays *A*. The probability of a match is $pq + (1-p)(1-q)$.

  **Alex:** Right. And the minimum value of that function, when $p, q \in [0, 1]$, is $0.5$ (at $p=0.5, q=0.5$). The maximum is 1. So if you assume independence, the expected payoff for *In* ranges from 5 to 10. Since *Out* pays 5, *In* is a best response if you believe $p$ and $q$ are close to 0 or 1.

  **Jamie:** So *In* survives Independent Rationalizability too?

  **Alex:** In this specific setup, yes. To get the divergence, we need to iterate. Suppose in the next round, Players 2 and 3 eliminate some strategies based on *their* beliefs about Player 1.
  Let's tweak the payoffs. Suppose Player 1's *Out* payoff is 6.
  Now, under independence, if $p=0.5, q=0.5$, Expected Payoff(*In*) = 5. Since $5 < 6$, *In* is not a best response to *uniform* independent beliefs. But it *is* a best response to correlated beliefs where Prob(match) = 1.
  So, if Player 1 is forced to assume independence, and for some reason believes 2 and 3 are mixing 50-50, *In* gets eliminated. But if correlation is allowed, Player 1 can believe 2 and 3 are perfectly correlated, making *In* a best response.

  **Jamie:** But why would Player 1 believe they are mixing 50-50?

  **Alex:** Because *they* might be rationalizing *their* own strategies based on beliefs about Player 1. This is where the iteration bites. In **Independent Rationalizability**, at every step $k$, Player 1's belief must be a product measure over the strategies surviving step $k-1$ for Players 2 and 3. In **Correlated Rationalizability** (and IEDS), Player 1's belief can be any distribution over the surviving profiles.
  There are games where the set of product measures over the surviving sets doesn't cover the "corners" needed to justify a strategy, but the correlated simplex does.

  **Jamie:** Okay, I buy the math. The sets can diverge. My worry is philosophical. If we accept IEDS as the definition of CKR, we are accepting that rational agents can maintain correlated beliefs without a correlation device. That feels like we're smuggling in cooperative solution concepts, like Correlated Equilibrium, through the back door of rationalizability.

  **Alex:** But isn't the "no correlation device" argument just an assertion? In the real world, rational agents often have correlated beliefs because they share a culture, a language, or observe the same public signals. CKR is supposed to be a weak assumption. If we strengthen it to include Independence, we get a sharper prediction, but we risk ruling out behaviors that are actually rational.

  **Jamie:** But game theory is supposed to be about strategic interaction, not sociological correlation. If the solution concept relies on correlation that isn't explained by the game structure, aren't we just saying "anything goes" as long as the beliefs are consistent?
  Look, if IEDS allows *In* to survive solely because Player 1 *could* believe 2 and 3 are correlated, but there's no reason in the payoff structure for them to be... then IEDS is too permissive. It fails to capture the constraint that players are distinct, non-cooperative entities.

  **Alex:** I think you're valuing parsimony over robustness. IEDS gives you the set of strategies that are *never* dominated. It's the safe set. If you play a strategy outside the IEDS set, you are definitely irrational. If you play inside it, you *might* be irrational if you hold unjustified correlated beliefs, but you aren't *necessarily* irrational.
  As a benchmark, I'd rather use the one that doesn't assume independence. If you want to argue for Independence, the burden is on you to justify why rationality *implies* independence.

  **Jamie:** The burden is on you to justify why rationality *allows* correlation without a mechanism!
  Think about it this way: If Player 1 believes 2 and 3 are correlated, Player 1 effectively treats them as a single agent. But they aren't. They maximize separately. If Player 1's belief assigns probability 1 to $(A, A)$ and $(B, B)$, Player 1 is assuming that whenever 2 chooses $A$, 3 *must* choose $A$. But 3 doesn't care what 2 does (in our dummy payoff). Why would 3's choice track 2's?

  **Alex:** Because Player 1 might think 2 and 3 are both responding to the same hidden variable. Maybe Player 1 thinks, "Players 2 and 3 are both conservative types, so they'll both play $A$." That's a correlation in beliefs, not in mechanism. It's epistemic, not causal. CKR constrains what I can believe about your rationality, not what I can believe about your type.

  **Jamie:** (Pauses) That's a fair distinction. Epistemic correlation vs. causal correlation.
  But here's my pushback: If we allow *any* correlated belief, doesn't IEDS lose its bite? In the limit, if any correlation is allowed, does IEDS collapse to just "never play a strictly dominated strategy in the first round"?

  **Alex:** No, because the correlation is over the *surviving* strategies. As we iterate, the set of surviving profiles shrinks. Even with correlation, you run out of support.
  However, you are right that Independent Rationalizability is often a tighter set. In some games, it yields a unique prediction where IEDS leaves a cloud of possibilities.

  **Jamie:** Exactly. If I'm building a model to predict behavior, I want the tighter set. If the notes claim IEDS is *the* consequence of CKR, they are ignoring the argument that CKR in a non-cooperative context should include independence.
  Maybe the compromise is this: The lecture notes are teaching the standard, tractable tool (IEDS/Correlated). But we should acknowledge that for $N \ge 3$, there is a stronger, arguably more appropriate epistemic standard (Independent Rationalizability) that IEDS does not capture.

  **Alex:** I can agree to that. IEDS is the *lower bound* on rationality. It tells you what you definitely shouldn't play. Independent Rationalizability is a stricter club.
  So, Marcus wasn't wrong to question the notes, but he was slightly off on the mechanism. It's not that IEDS *assumes* independence; it's that IEDS *fails to enforce* it. And whether it *should* enforce it is the real debate.

  **Jamie:** (Smiling) Okay. So the notes aren't "wrong," they're just "Pearce-ian" rather than "Bernheim-ian."

  **Alex:** Precisely. Pearce said correlation is fine. Bernheim said keep it independent. The notes picked Pearce. Marcus picked Bernheim.

  **Jamie:** And I'm stuck in the middle trying to figure out if my beliefs about my opponents should be product measures.

  **Alex:** (Laughing) If you figure that out, write the paper. But for the exam? Just remember: 2-player, they're the same. 3-player, IEDS = Correlated. If the question asks about independence, you need to check if the problem specifies "independent conjectures."

  **Jamie:** Deal. More coffee?

  **Alex:** Please. I need to stay rationalizable.
