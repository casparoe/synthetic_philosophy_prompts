answer: |-
  Here are 10 interview questions designed to press the guest's thesis, complete with anticipated follow-ups. They move from the core philosophical claim to the empirical difficulties, the personal dimensions, and finally the implications for reading Sidgwick today.

  **1. The Necessity Claim**
  You argue that Sidgwick's SPR work wasn't a hobby but a philosophical necessity forced by the Dualism of Practical Reason. But Sidgwick was a master of distinguishing between what is *rationally required* and what is *rationally permissible*. Is your claim that psychical research was the *only* permissible move for a utilitarian in his position, or simply the most hopeful one?
  *   **Follow-up:** If you say "only," doesn't that collapse his distinction between duty and prudence prematurely? If you say "hopeful," does that reduce the SPR work to wish-fulfillment rather than the rigorous empirical search you describe?

  **2. The Empirical Standard (Required: Debunkings)**
  Sidgwick treated psychical research as an empirical science, yet when cases like the Creery sisters were exposed as fraud or mediums failed under testing, he rarely treated this as falsification. In his chemical or economic work, a null result usually killed the hypothesis. Why did the SPR hypothesis get what looks like infinite "auxiliary hypotheses" to protect it from disconfirmation?
  *   **Follow-up:** She will likely argue he was being a careful fallibilist. Press this: Was he equally fallibilist about the existence of matter, or does this suggest the *stakes* of the SPR hypothesis were higher than standard scientific inquiry?

  **3. The "Chaos" Passage (Required: Methods of Ethics)**
  The famous "Chaos" passage at the end of *The Methods of Ethics* states that without a divine guarantee, morality is fundamentally irrational. Does your reading require us to believe Sidgwick thought the SPR could actually *solve* that chaos, or merely that it was the only place left to *look* for a solution?
  *   **Follow-up:** If it's just "looking," does that mean *The Methods* effectively ends in acknowledged failure? And if the SPR *did* find proof, does that turn Sidgwick's utilitarianism into a theological waiting room?

  **4. Eleanor Sidgwick's Role (Required: Census of Hallucinations)**
  Eleanor Sidgwick's work on the Census of Hallucinations is often seen as more methodologically rigorous than Henry's. Do you read her participation as sharing his existential dread regarding the Dualism, or was her project distinct—more about statistical norms than cosmic justice?
  *   **Follow-up:** If her motivation was distinct, does that undermine the idea that the SPR was a unified philosophical project? If it was the same, does that mean the "Dualism" was a shared marital burden rather than just Henry's philosophical puzzle?

  **5. The Survival Pact (Extra Credit: Myers & Gurney)**
  Sidgwick had a famous pact with Myers and Gurney that whoever died first would attempt to communicate with the survivors. By most accounts, the messages received were banal or non-existent. Did Sidgwick view their silence as a failure of the *medium*, or a failure of the *hypothesis*?
  *   **Follow-up:** If he viewed it as a failure of the medium, at what point does "bad reception" become indistinguishable from "no signal"? Did he ever privately admit that his friends had failed to deliver?

  **6. The Timeline of Desperation**
  You note he grinded away at this for three decades. In the 1870s, spiritualism was culturally vibrant; by the 1900s, it was increasingly marginal. Did Sidgwick's tone shift as the cultural window closed, or did he double down as the empirical evidence failed to materialize?
  *   **Follow-up:** If he doubled down, does that suggest a psychological investment that compromises the "disinterested" rationality he champions in *The Methods*?

  **7. Rationalism vs. Mysticism**
  Sidgwick is the paradigm of the dry, analytic rationalist. But seeking empirical proof of immortality to ground ethics feels like a mystical turn. Are you arguing that Sidgwick tried to *scientize* mysticism, or that his rationalism was always more fragile than we admit?
  *   **Follow-up:** If it's the latter, does this reading force us to rewrite the standard narrative of Sidgwick as the father of secular analytic ethics?

  **8. Alternative Metaphysics**
  If the goal was to reconcile Duty and Self-Interest, why psychical research? Why not a Kantian postulate of God, or a Hegelian historical teleology? What made the "ghost hunt" uniquely suited to solving the Dualism compared to traditional metaphysics?
  *   **Follow-up:** Is it because only *empirical* proof could satisfy his empiricist constraints? And if so, doesn't that make his ethics hostage to the very contingent evidence he usually tries to avoid?

  **9. The "Eye of the Universe" Extension**
  Bart Schultz's "Eye of the Universe" reading suggests Sidgwick wanted to occupy a God's-eye view. Does your book push this further to suggest he needed the *universe* to look back at him? Is the SPR work about him observing the cosmos, or the cosmos validating him?
  *   **Follow-up:** If it's about validation, does that introduce an egoistic element into his utilitarianism that contradicts his own definition of impartiality?

  **10. Implications for the Canon**
  If we accept your thesis, can we still teach *The Methods of Ethics* as a self-contained text on normative theory? Or does the SPR work bleed in enough that we have to teach the "Chaos" passage not as a footnote, but as the engine driving the whole book?
  *   **Follow-up:** For the grad students listening: Does this mean a dissertation on Sidgwick's meta-ethics is incomplete without a chapter on ghosts?
