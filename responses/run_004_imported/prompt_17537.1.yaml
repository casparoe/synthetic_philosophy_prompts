prompt: |-
  I co-host a history-of-philosophy podcast with another grad student in my program, and next month's guest just published a book pushing the Bart Schultz 'Eye of the Universe' reading of Sidgwick even further: her claim is that his three decades grinding away at the SPR weren't some weird hobby tacked onto the ethics but were basically forced on him by the dualism of practical reason -- once you lose the religious guarantee that duty and self-interest coincide, psychical research becomes the only place left to look for one empirically. I don't want her to just restate that thesis on air, so can you draft 8-10 interview questions that actually press on it, each with a short follow-up keyed to whatever answer shes likely to give? I want at least one question on why the SPR's repeated debunkings (the Creery sisters case, various mediums) didnt count as disconfirmation the way a null result would for basically any other empirical hypothesis he took seriously, one on the 'chaos' passage that closes out the Methods and whether her reading even needs that argument to go through as stated, and one on Eleanor Sidgwick's census-of-hallucinations work -- is that the same existential project as Henry's, or a mistake to read it that way? Extra credit if one question uses the survival pact he apparently made with Myers and Gurney against her, since none of the three seem to have delivered much once they'd actually died.
