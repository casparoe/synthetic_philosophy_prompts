          *   *Weak Point:* If the universe is eternal (infinite past), Premise 2 fails. The argument collapses.
      *   **Leibnizian Contingency Argument (LCA):**
          *   Premise 1: Every contingent fact has an explanation (PSR).
          *   Premise 2: The existence of the universe is a contingent fact.
          *   Conclusion: The existence of the universe has an explanation (God).
          *   *Strength Point:* Even if the universe is eternal (infinite past), it is still *contingent* (it could have failed to exist). Therefore, it still needs an explanation. Time doesn't save it.

