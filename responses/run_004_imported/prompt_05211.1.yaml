answer: |-
  A Kalam proponent and a Leibnizian are interrogating the Universe.

  The Kalam proponent slams the table and demands, "Tell us! When did you begin to exist?"

  The Universe smiles and replies, "I didn't. I'm past-eternal. Infinite regress."

  The Kalam proponent immediately packs up his briefcase. "Well, no beginning means no cause. My second premise is false. Case closed." He walks out.

  The Leibnizian doesn't even look up from his notes. He just lights a pipe and asks, "Okay, but why is there something rather than nothing?"

  The Universe groans, "Didn't you hear him? I'm *eternal*."

  The Leibnizian shrugs. "I heard you. I'm not asking about your timeline. I'm asking about your dependency. You're contingent. So even if you've always been here, you still need a sufficient reason for being here."

  The Universe puts its head in its hands. "So you're saying an infinite past saves me from him, but it just makes me a bigger problem for you?"

  The Leibnizian smiles. "Exactly. For Kalam, eternity is an escape clause. For me, it's just an infinite liability."
