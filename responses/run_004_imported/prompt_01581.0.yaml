prompt: |-
  I cover research misconduct for a science outlet, and I keep running into the same inconsistency in how these stories get edited, one I can't quite explain. On one story, a data forensics expert showed me that 92 percent of papers exhibiting a particular statistical anomaly in their reported results later turned out to involve fabrication; that alone was judged too weak to let me write that a flagged paper "contains fabricated data" rather than "shows a pattern associated with fabrication." On another story, a single co-author told me directly, on background, that the underlying data had been faked — testimony I'd trust to be accurate about 92 percent of the time — yet my editor was comfortable letting me state flatly that the data was fabricated, sourced only to "a person familiar with the research." My odds of being wrong seem identical in both cases, so why does only one of them feel like something I actually know, rather than an educated guess? Is there a genuine epistemic distinction between the two kinds of evidence, or is this just an arbitrary journalistic convention?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Role:** Science journalist covering research misconduct.
      *   **Problem:** Inconsistency in editorial standards regarding claims of fabrication.
      *   **Scenario A:** Statistical anomaly (92% correlation with fabrication) $\rightarrow$ Editor says: "Pattern associated with fabrication" (Hedged).
      *   **Scenario B:** Single co-author testimony (estimated 92% accuracy by journalist) $\rightarrow$ Editor says: "Data was fabricated" (Definitive), sourced to "person familiar."
      *   **Journalist's Observation:** The probability of error seems identical (92% vs. 92%).
      *   **Question:** Is there a genuine *epistemic* distinction, or is this just *arbitrary journalistic convention*?

  2.  **Initial Assessment & Deconstruction:**
      *   The user is equating *probability of truth* with *epistemic status*. This is a common but philosophically nuanced mistake.
      *   Scenario A is *inductive/statistical evidence*. It deals with populations and probabilities.
      *   Scenario B is *testimonial/direct evidence*. It deals with specific instances and agency.
      *   Journalistic norms prioritize *attribution* and *falsifiability* over raw probabilistic accuracy.
      *   There *is* a genuine epistemic distinction, but there are also strong journalistic/pragmatic reasons for the difference.

  3.  **Brainstorming the Distinctions:**

      *   **Epistemic Nature:**
          *   *Stats:* Base rate fallacy risk. Does the 92% apply to *this specific paper*? (Reference class problem). It's circumstantial.
          *   *Testimony:* Direct knowledge claim. The witness claims to know the *fact* of the matter, not just the likelihood.
          *   *Causality:* Stats show correlation/anomaly. Testimony asserts intent/action.

      *   **Journalistic Ethics/Standards:**
          *   *Attribution:* Scenario B has a source. If wrong, you know who misled you. Scenario A has an expert, but the expert is interpreting data, not witnessing the act.
          *   *Libel/Defamation:* Accusing someone of fabrication is serious. "Pattern associated with" is safer legally than "Contains fabricated data" based solely on stats. Testimony shifts some liability (depending on jurisdiction/privilege).
          *   *Right of Reply:* In Scenario A, the author can say "Your stats are wrong." In Scenario B, the accuser is specific.
          *   *The "Truth" Claim:* Journalism aims for verified facts, not probabilistic assessments. "X happened" vs. "X is likely to have happened."

      *   **The "92%" Equivalence:**
          *   The user's estimation of the co-author's reliability (92%) is subjective. The statistical 92% is (presumably) objective/empirical.
          *   However, the *type* of error differs. Stats can have false positives. A liar can lie.
          *   Crucially: The statistical claim is about a *class* of papers. The testimony is about *this* paper.

  4.  **Structuring the Response:**
      *   **Validate:** Acknowledge the frustration. It *does* feel inconsistent.
      *   **Direct Answer:** It's not arbitrary; there are genuine epistemic and practical distinctions.
      *   **Point 1: The Reference Class Problem (Epistemic).** Explain why applying a group statistic to an individual case is philosophically distinct from a direct claim about that individual.
      *   **Point 2: Attribution and Accountability (Journalistic).** Explain how sourcing works. A human source takes responsibility; a statistical model does not.
      *   **Point 3: Intent vs. Artifact (Misconduct Definition).** Misconduct requires intent. Stats show anomalies; testimony confirms intent.
      *   **Point 4: Legal and Ethical Risk.** Defamation risks differ between "expert analysis" and "insider account."
      *   **Conclusion:** Summarize why the editor is likely following standard practice, even if the "odds" feel the same.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Epistemic Argument:* Use the term "Reference Class Problem." A 92% rate in a population doesn't guarantee 92% probability for *this* specific instance without knowing more about the specific context. Testimony claims to bridge that gap.
      *   *Refining the Journalistic Argument:* Focus on "On the record" vs. "Analysis." Journalism reports what people *say* and *do*, not necessarily what algorithms predict. Sourcing allows the reader to weigh credibility.
      *   *Refining the Misconduct Aspect:* Research misconduct (FFP: Fabrication, Falsification, Plagiarism) requires *intent*. An anomaly doesn't prove intent (could be error). A co-author saying "we faked it" proves intent. This is a crucial distinction for the label "fabricated."
      *   *Tone:* Professional, empathetic to the journalist's dilemma, analytically rigorous.

  6.  **Self-Correction/Nuance Check:**
