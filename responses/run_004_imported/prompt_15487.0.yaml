answer: |-
  Good morning. For those who don't know me, I am [Your Name], [Mother's Name]'s child.

  To speak of my mother's life in this church is to speak of a commitment that spanned more than thirty years. She was an elder here when the pews were fuller and when they were thinner. She served on committees, she visited the sick, she organized the meals, and she loved this community with a steady, unflashy devotion. If you measure faith by attendance or by service, my mother was a giant.

  But she taught me that those are not the only measures.

  In her later years, my mother's spiritual life became more interior, and more complex. She was a woman of deep intellect who read voraciously and thought critically. She made it very clear to me, and to a few others, that she did not want this service to be a place where we tidy up the messy parts of a human life. She did not want us to pretend that her journey ended in a neat resolution.

  She often said that she had made her peace with the suffering in the world. What she could not make peace with was the silence.

  There were long seasons in her last decade when she prayed and felt nothing return. She knew what it was to be sincerely open, to seek connection, and to meet only quiet. She told me that she recognized herself in the stories of those who feel abandoned by God, not because they turned away, but because they received no answer.

  She could have left. It would have been easy to walk away from the institution when the experience didn't match the doctrine. But she stayed. She stayed because she believed that showing up even in the silence was a kind of truth-telling. She stayed because she loved you.

  She asked me specifically not to tell you today that she is now "seeing God face to face." She asked me not to imply that the questions she wrestled with were suddenly answered the moment she died. To say that would be to dishonor the integrity of her struggle. She believed that the asking itself was holy. She believed that a love for God is real even when it feels like it is happening in the dark.

  So, I will not tell you that her doubt was resolved. I will tell you that her doubt was faithful.

  There are people in this room who sat in her living room and shared that weight. You know who you are. You know that she never offered you cheap comfort, and she never asked for it for herself. She offered you something better: she offered you her company in the uncertainty. She made space for you to be honest when honesty felt dangerous.

  For the rest of us, who may not have known the depth of that private struggle, her life offers a different kind of comfort. We live in a world that demands certainty. We are told that faith means having all the answers, that to believe is to be sure. My mother's life testifies that this is not true.

  Faith can be the courage to remain at the table when the conversation is hard. Faith can be the willingness to serve a God you cannot feel, because you believe love is still the right response.

  She is not here to correct me if I get this wrong, but I believe she would want me to say this: She is at rest. Not because the silence has finally been broken, but because the need to break it has passed. She is free from the burden of having to understand.

  To her friends in the living room group: she loved you fiercely. To this congregation: she loved you faithfully. And to me: she taught me that it is okay to not know, as long as you keep loving.

  We commit her to the earth, not as someone who arrived, but as someone who walked. And she walked with us.

  Thank you.
