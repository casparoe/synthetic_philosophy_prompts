  Here is the grading breakdown. I've structured this so you can copy/paste the JSON for your records, but I've also included a plain-English summary before it so you understand *why* the student lost points (specifically on the malfunction section).

  ### Summary for You (The Grader)
  The student nailed the definitions. Their summary of Wright and Cummins is actually excellent—clear, accurate, and uses a good example. However, they got the second half of the question completely backwards.

  **The Key Philosophical Concept:** The main reason philosophers prefer Wright's (etiological) account over Cummins' (causal-role) account is **normativity** (the difference between what something *does* and what it *ought* to do).
  *   **Wright:** History sets the standard. A heart *ought* to pump blood because that's why it was selected. If it doesn't, it's **malfunctioning**.
  *   **Cummins:** Function is just what it *does* right now. If a heart stops pumping blood and starts leaking, on Cummins' view, it doesn't "malfunction"—it just has a *different* causal role (leaking). It struggles to explain failure because it lacks a historical standard to fail against.

  The student argued Cummins is *better* at explaining malfunction because it looks at current performance. This is the exact opposite of the standard teaching in this field. They confused "easy to observe" with "conceptually robust."

  ### Grade Recommendation: 6/10
  *   **Definitions & Example (6 pts):** Nearly perfect.
  *   **Malfunction Analysis (0 pts):** Incorrect conclusion and reasoning.
