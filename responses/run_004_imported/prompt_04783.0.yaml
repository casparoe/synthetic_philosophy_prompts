answer: |-
  **MEMORANDUM**

  **TO:** Short-Fiction Prize Judging Panel
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Protocol for Judging Process and Shortlist Selection

  **Purpose**

  This memo serves to finalize the judging protocol for the current prize cycle. Following our recent discussion regarding the division of labor and the integrity of the scoring process, we have reached an impasse that requires resolution to meet our three-week deadline.

  The goal of this document is to establish a workflow that respects the logistical constraints of the contest (130 submissions, five judges) while upholding the ethical standards expected of a regional arts council prize. Specifically, it addresses the question of whether a judge can legitimately score or rank a story they have not read.

  **Philosophical Stance on Aesthetic Judgment**

  We must acknowledge the validity of the concern raised regarding secondhand judgment. The argument that "a report on a story is not the story" is correct.

  While we routinely trust critics and friends to recommend books, we use those recommendations to *select* what to read, not to *judge* the work without reading it. There is a fundamental distinction between **triage** (deciding what warrants attention) and **evaluation** (deciding what warrants acclaim).

  *   **Triage** can be delegated. If two judges agree a story is not functioning, the panel can accept that consensus to manage volume.
  *   **Evaluation** cannot be delegated. A numeric score or a ranking implies a direct encounter with the text's rhythm, voice, and emotional resonance. These qualities do not survive summarization. To assign a score to an unread story is to score the *report*, not the *art*.

  Therefore, this panel will proceed under the principle that **no judge shall assign a numeric score or a final ranking to a work they have not personally read.** However, to ensure the contest remains viable, we will utilize a two-phase system.

  **Judging Protocol**

  **Phase 1: Triage and Longlist (Weeks 1–4)**
  *   **Distribution:** Submissions are divided among the five judges. Each story is assigned to two "Primary Readers."
  *   **Responsibility:** Primary Readers will provide a short response and a 1–10 score.
  *   **Secondary Judges:** The remaining three judges will review the Primary Readers' write-ups for their assigned batch.
  *   **Action:** Secondary Judges may **not** score these stories. They may only vote to "Advance" or "Pass" based on the strength of the Primary Readers' advocacy.
  *   **Threshold:** Any story receiving a combined score of 16+ (e.g., two 8s) from Primary Readers is automatically advanced to the Shortlist Pool. Any story where Primary Readers disagree significantly (e.g., a 4 and a 9) will be flagged for a quick "tiebreaker read" by a third judge to ensure nothing exceptional was missed due to taste mismatch.

  **Phase 2: Shortlist and Winner (Weeks 5–6)**
  *   **The Shortlist:** We will aim for a shortlist of 5–6 stories.
  *   **Mandatory Full Read:** Before the final meeting to decide the winner and finalize the shortlist order, **all five judges must read all shortlisted stories.**
  *   **Scoring:** Final scoring and ranking occur only after this full read. No judge may vote on the winner or assign a final rank to a story they have not read in full during this phase.
  *   **Rationale:** This ensures that when we announce the winner, every judge on the panel can publicly stand behind the decision based on direct experience, not delegated trust.

  **Transparency and Public Communication**

  If asked by submitters or the public how the process works, we will be transparent about the rigor of the final stage.

  *   *Suggested Wording:* "To ensure fairness and manage the high volume of submissions, initial reviews are conducted by paired judges. However, all shortlisted finalists are read in their entirety by the full judging panel before any winner is selected."

  **Immediate Next Steps**

  1.  **Coordinator:** Please redistribute the remaining unread submissions immediately according to the Phase 1 pairing system.
  2.  **Panel:** All Primary Readers must submit scores and write-ups by [Date, 10 days from now].
  3.  **Panel:** All judges commit to reading the resulting Shortlist (approx. 5 stories) within the final 10 days.

  This protocol honors the time limitations raised by the Coordinator while validating the ethical concerns raised regarding the nature of aesthetic judgment. It allows us to process the volume without compromising the integrity of the final award.

  Please reply by EOD tomorrow if you cannot commit to this workflow so we can adjust accordingly.

  Thank you for your dedication to these writers.

  [Your Name]
