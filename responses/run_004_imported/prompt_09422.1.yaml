answer: |-
  Your intuition is spot on. Your friend is pulling a classic move: he's taking a descriptive insight from a philosopher and turning it into a normative justification that the philosopher would likely reject.

  He isn't entirely hallucinating—there is a grain of truth in what he says about Arendt—but he is missing her ultimate conclusion. In fact, Arendt's essay **"Truth and Politics" (1967)** is widely considered one of the most fierce defenses of factual truth *against* political lying ever written.

  Here is the breakdown of where your friend is right, where he's wrong, and why Arendt would probably be outraged by his use of her work.

  ### 1. Where your friend is right (The Mechanism)
  Your friend correctly identifies Arendt's anthropological insight. Arendt does argue that the capacity to lie is linked to human freedom.
  *   **Natality:** For Arendt, politics is about "action," and action is about beginning something new. To begin something new, you have to be able to imagine a world that doesn't exist yet.
  *   **The Link:** That same imaginative capacity allows you to say, "This reality is not final; it could be otherwise." A liar uses this power to say, "This reality is not true; I can replace it with my own story."
  *   **Inevitability:** Arendt acknowledges that lying has always been a tool in the political toolkit. Diplomacy, state secrets, and strategic deception are historical constants.

  So, if the argument stopped at "Lying is possible because humans are free, and it has always happened in politics," your friend would be correct.

  ### 2. Where your friend is wrong (The Conclusion)
  This is where the cherry-picking happens. Just because Arendt explains *why* politicians lie and *how* it is possible, it does not mean she thinks it is **acceptable** or that we should be **naive not to care.**

  In fact, she argues the opposite. She draws a sharp line between **Opinion** and **Factual Truth**.
  *   **Opinion:** This is the realm of politics. "We should raise taxes" or "This war is wise." These are debatable.
  *   **Factual Truth:** This is the ground we stand on. "The war started on Tuesday" or "The budget deficit is X amount."

  Arendt argues that while politicians can lie about opinions (promises, ideologies), they must not be allowed to destroy **factual truth**. When politicians lie about facts, they aren't just playing the game; they are destroying the board.

  ### 3. The "Modern" Lie vs. The Traditional Lie
  Arendt makes a crucial distinction that your friend likely skipped.
  *   **Traditional Lying:** The liar knows the truth and hides it. The truth still exists; it is just concealed.
  *   **Modern Lying (Image Making):** Arendt was worried about a new kind of lying (influenced by totalitarianism and modern media) where the goal isn't to hide the truth, but to **destroy the very category of truth.**

  She argues that when politicians constantly rewrite reality, gaslight the public, or treat facts as malleable opinions, they erode the "common world." If we cannot agree on basic facts, we cannot debate opinions. If we cannot debate opinions, freedom dies.

  ### 4. Why Outrage is Necessary, Not Naive
  Your friend claims outrage is naive. Arendt would say outrage is **essential for survival.**

  She writes famously in "Truth and Politics":
  > *"The ideal subject of totalitarian rule is not the convinced Nazi or the convinced Communist, but people for whom the distinction between fact and fiction (i.e., the reality of experience) and the distinction between true and false (i.e., the standards of thought) no longer exist."*

  Her point is that if we accept lying as "just part of the job," we become those ideal subjects. We lose the ability to judge reality. Therefore, getting angry about lies—specifically lies about facts—is the only way to protect the public realm.

  ### The Verdict
  Your friend is guilty of **philosophical cherry-picking.**
  *   **He took:** Arendt's description of the *capacity* to lie (it comes from human freedom).
  *   **He dropped:** Arendt's warning about the *consequences* of lying (it destroys the shared reality necessary for freedom).

  He is using her to say, "Don't worry, lying is normal." Arendt is actually saying, "Lying is a dangerous temptation inherent to power, which is why we must vigilantly defend factual truth against it."

  **How to reply:**
  You can tell him: *"Arendt does say the imagination allows us to lie, but she doesn't say that makes it okay. She argues that while politicians lie about opinions, they cannot be allowed to lie about facts. If they do, they destroy the common ground we need to be free. So actually, Arendt is a reason to be* more *outraged about lying, not less."*
