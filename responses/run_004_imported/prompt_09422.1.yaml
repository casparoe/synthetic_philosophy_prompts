  Got into it with my friend last night over whether politicians lying is actually a big deal, and it somehow ended with him pulling out Hannah Arendt on me. His argument was that Arendt basically shows lying is a totally normal, maybe even necessary, part of politics — something about how politics deals with contingent stuff that could've gone differently, and how the same imaginative capacity that lets us act and start new things is also what lets us lie. So according to him, getting outraged at politicians for lying is kinda naive, since its baked into the job itself. Something about that felt off to me but I couldn't articulate why. Is he actually representing her view right, or is he cherry-picking?
