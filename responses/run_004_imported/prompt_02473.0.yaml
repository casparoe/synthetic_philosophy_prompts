      *   *Wait, check the text:* In the Branch-Line case, Parfit says the Earth person is him. The Mars person is a duplicate. Since they coexist, they aren't identical. So Earth-Parfit dies. *However*, he argues that if the Earth body *had* been destroyed (Normal Case), the result would be just as good. Why? Because the *presence* of the dying Earth body doesn't make the Mars body less psychologically continuous. Therefore, the destruction of the original doesn't matter. That's the key. The destruction is irrelevant to Relation R.

