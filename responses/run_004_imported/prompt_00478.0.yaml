      *   *Assumption:* The agent treats each choice as isolated (myopic). At step 1, A and B are incomparable, so swapping A for B (minus $\epsilon$) seems acceptable (or at least not forbidden). At step 2, B and A are incomparable, so swapping back seems acceptable.
      *   *Goal:* Show that incompleteness leads to dominated strategies (losing money for no gain).

  3.  **Analyze the "Resolute Choice" / Policy Objection:**
