          *   *Con:* It introduces *path dependence*. The choice depends on where you started (the status quo), not just the options available. It violates "Independence of Irrelevant Alternatives" or similar consistency axioms across time. It effectively *creates* a preference (status quo bias) where none existed structurally.

  4.  **Synthesize the "What's at Stake":**
