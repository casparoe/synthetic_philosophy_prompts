  Elena: Then they have to simulate my decision process to mimic it.

  Marcus: They can simulate you and defect.

  Elena: If the simulation is perfect, the simulation defects too.

  Marcus: You're assuming they care about logical consistency over payoff.

  Elena: I'm assuming they want to win. Defecting against a mirror loses.

  Marcus: How do you verify the mirror isn't distorted? That's the verification problem.

  Elena: You can't verify it causally. That's why the Löbian obstacle matters.

  Marcus: Because you can't prove they'll cooperate?

