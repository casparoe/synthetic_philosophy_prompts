prompt: |-
  I run a small YouTube series where I interview people about philosophical traditions outside the Western mainstream, and next week's guest defends a relational, Ubuntu-inspired account of personhood: the view, often distilled into the phrase "I am because we are," that one becomes a person through one's relationships and standing within a community rather than simply by being human. Draft eight interview questions that go beyond having her restate the slogan, including at least one question each on the "radical" communitarian claim that personhood is something achieved in degrees over a lifetime (and what that implies for infants, or for people a community regards as outcasts), on how a lone dissenter who turns out to be morally right can retain any standing to criticize if personhood is partly constituted by communal recognition, and on whether "relational personhood" is doing any distinctive philosophical work beyond what Western communitarian critiques of individualism already offer. For each question, add a brief follow-up that anticipates the direction her answer is likely to take.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A small YouTube series interviewing people about non-Western philosophical traditions.
      *   **Guest:** Defends a relational, Ubuntu-inspired account of personhood ("I am because we are").
      *   **Core View:** Personhood is achieved through relationships/community standing, not just biological humanity.
      *   **Task:** Draft 8 interview questions.
      *   **Constraints:**
          *   Go beyond restating the slogan.
          *   Must include specific questions on:
              1.  The "radical" communitarian claim (personhood achieved in degrees; implications for infants/outcasts).
              2.  The lone dissenter problem (moral criticism vs. communal recognition).
              3.  Distinctiveness vs. Western communitarianism (is it doing unique work?).
          *   Each question needs a brief follow-up anticipating the guest's likely answer.

  2.  **Deconstruct the Philosophy (Ubuntu/Relational Personhood):**
      *   *Core tenet:* Personhood is a process, not a given state. It's normative, not just descriptive.
      *   *Key tension:* Individual agency vs. Community constitution.
      *   *Key tension:* Inclusion vs. Exclusion (who counts as a person?).
      *   *Key tension:* Tradition vs. Moral Progress (how to critique the community from within?).
      *   *Comparison:* How does this differ from Hegel, Marx, MacIntyre, or Sandel?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Degrees of Personhood (Infants/Outcasts).*
          *   *Draft 1:* You say personhood is achieved. What about babies? Are they not people?
          *   *Refinement:* Need to be more philosophical. Focus on the normative status.
          *   *Final Polish:* Focus on the "potential" vs. "actual" distinction and the ethical weight of excluding outcasts.
          *   *Follow-up:* She will likely distinguish between "human being" (biological) and "person" (moral status), but I need to press on the risk of dehumanization.

      *   *Requirement 2: The Lone Dissenter.*
          *   *Draft 1:* If the community defines you, how can you criticize them?
          *   *Refinement:* Use a specific example (whistleblower, prophet). How do they have standing?
          *   *Final Polish:* Frame it around the source of moral authority. If recognition is constitutive, does dissent look like self-destruction?
          *   *Follow-up:* She might appeal to a "true" community vs. "corrupt" community. I need to ask how we tell the difference.

      *   *Requirement 3: Distinctiveness vs. Western Communitarianism.*
          *   *Draft 1:* Isn't this just like Sandel or MacIntyre?
          *   *Refinement:* What makes *Ubuntu* specifically different? Is it metaphysical or just ethical?
          *   *Final Polish:* Ask about the metaphysical grounding. Is it ontological interdependence vs. sociological observation?
          *   *Follow-up:* She will claim it's deeper/ontological. I should ask for a concrete implication of that depth.

      *   *Filling the remaining 5 questions (to make 8 total):*
          *   *Question 4: Global Application.* Can this scale beyond small villages? (Modernity/Urbanization).
          *   *Question 5: Conflict Resolution.* How does this handle conflicting communities? (My community vs. Your community).
          *   *Question 6: Responsibility/Guilt.* If I am my brother's keeper, am I responsible for his sins? (Collective responsibility).
          *   *Question 7: Autonomy.* Is there room for individual flourishing that *doesn't* serve the community? (Art, eccentricity).
          *   *Question 8: Translation/Language.* Does the language itself shape the philosophy? (Untranslatability).

  4.  **Review and Refine:**
      *   Check against constraints: 8 questions? Yes. Specific topics covered? Yes. Follow-ups included? Yes. Tone appropriate for YouTube (engaging but deep)? Yes.
      *   *Self-Correction on Follow-ups:* Ensure the follow-ups don't sound like "gotchas" but rather deepening probes based on standard philosophical defenses.
      *   *Tone Check:* Ensure respect for the tradition while maintaining critical rigor.

  5.  **Final Polish (incorporating into the output format):**
