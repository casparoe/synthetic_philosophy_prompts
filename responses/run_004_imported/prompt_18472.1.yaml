  **Justifications:**

  *   **Move 1 (Score: 1):** Marcus accurately states Quine's conclusion: there is no "fact of the matter" distinguishing between empirically equivalent translation manuals. However, applying this to MT evaluation is a category stretch. Quine discusses *radical translation* (no shared language/culture), whereas MT evaluation relies on established conventions and shared linguistic communities. His philosophical premise is sound, but its practical implication for BLEU is debatable.
  *   **Move 2 (Score: -1):** Elena makes the standard objection that Quine explicitly anticipates and rejects. Quine's point about "gavagai" is not that we lack enough data (underdetermination), but that ostension (pointing) cannot fix reference (inscrutability of reference). "Rabbit," "rabbit part," and "rabbit stage" share the same stimulus meaning; pointing to a foot doesn't resolve the ontological ambiguity because the word for "foot" is equally indeterminate.
  *   **Move 3 (Score: 2):** Marcus correctly articulates Quine's technical defense: the "proxy function" argument. He rightly distinguishes between *underdetermination* (temporary lack of data) and *indeterminacy* (principled impossibility of fixing reference via behavior). This is the strongest philosophical move in the exchange, accurately representing *Word and Object*.
  *   **Move 4 (Score: 1):** Elena correctly identifies the metaphysical engine driving Quine's conclusion: verificationism (no fact of the matter without empirical evidence). This is the standard realist critique (e.g., from Chomsky or Fodor). She loses a point only because she frames it as Marcus "smuggling" a premise, whereas Quine wears this behaviorist assumption openly as a feature, not a bug.

  **What Both Are Missing:**

  1.  **Radical vs. Standard Translation:** Quine's indeterminacy applies to *radical translation* (deciphering a completely unknown language from scratch). MT evaluation occurs within *standard translation*, where shared conventions, dictionaries, and stylistic norms already exist. The "ground truth" in MT is a social agreement, not a metaphysical fact, so Quine's skepticism doesn't invalidate the utility of reference-based metrics.
  2.  **The Goal of Evaluation:** They are conflating *truth* with *adequacy*. BLEU scores do not measure whether a translation captures the "one true meaning" (which Quine denies exists); they measure similarity to a human-produced reference that is deemed *acceptable* for a specific task. The metric is pragmatic, not ontological.
  3.  **Holophrastic vs. Sub-sentential:** Quine grants that *whole sentences* can have determinate stimulus meaning (holophrastic), even if sub-sentential terms (like "gavagai") do not. Since MT metrics often operate at the n-gram or segment level, Marcus is right to be skeptical, but Elena is right that communicative success usually renders the ontological distinctions irrelevant.
