      *   Move to the strangeness of the secret.
      *   Tackle the "enforcement" paradox gently.
      *   End with the release.

  7.  **Final check against constraints:**
      *   Few minutes long? Yes.
      *   Audience: Husband + Aunt? Yes.
      *   Theme: Why the promise binds without enforcement? Yes.
      *   No philosophy lecture tone? Yes, kept conversational.
      *   No clichés about love/memory? Yes, focused on integrity/truth.

