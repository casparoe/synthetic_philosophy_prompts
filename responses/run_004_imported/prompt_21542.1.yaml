prompt: |-
  My aunt died a few months ago. Near the end, alone with me, she asked me to promise I'd scatter part of her ashes at a particular spot by a lake she had never once mentioned to the rest of the family, at dawn, and never explain to anyone why that place or that hour. No one else knows what I promised, or why; my husband, who will be with me when I finally do this next weekend, knows only that a promise exists, not what it contains. What strikes me is that no one could ever check whether I get it right, it cannot hurt my aunt now, and it cannot disappoint anyone who might someday learn of it -- yet it feels like the most binding promise of my life, more binding than the ones other people can actually verify. Please write the few minutes of private remarks I'll read aloud at the lake beforehand, for an audience of just my husband and, in whatever sense still applies, my aunt. I want the words to genuinely work through why a promise like this still holds when no one is left to enforce or even notice it, rather than simply asserting that it does or reaching for comforting lines about love and memory -- while still sounding like something a person would actually say at dawn by a lake, not a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested remarks:

  1.  **Analyze the Request:**
      *   **Context:** The user's aunt died a few months ago. She made the user promise to scatter part of her ashes at a specific secret spot by a lake at dawn. No one else knows the location, the time, or the reason. The user's husband knows a promise exists but not the details.
      *   **Task:** Write a few minutes of private remarks to be read aloud at the lake beforehand (before scattering the ashes).
      *   **Audience:** The husband and the aunt (in spirit/memory).
      *   **Key Theme:** Explore *why* this promise feels binding despite the lack of external enforcement, verification, or consequence. Avoid clichés about love/memory. Avoid sounding like a philosophy lecture.
      *   **Tone:** Intimate, authentic, dawn setting, reflective but grounded.

  2.  **Deconstruct the Core Conflict:**
      *   *The Paradox:* A promise usually binds people socially. If no one knows, there's no social shame in breaking it. If the promisee is dead, they can't be disappointed. So why does it feel heavier than public vows?
      *   *The Insight:* It's not about external enforcement; it's about internal identity. Keeping the secret promise defines who the user *is* in relation to the aunt and to themselves. It's about the integrity of the private self.
      *   *The Setting:* Dawn, a lake, cold/quiet, transition from dark to light. This mirrors the transition between life/death and secret/revealed (even if only to the elements).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting and the presence. Ground it in the physical moment.
          *   *Idea:* Mention the cold, the light, the water. Address the aunt directly.
          *   *Drafting thought:* "It's cold here." -> "The air is colder than I expected." Acknowledge the husband's presence without making him the focus.

      *   **Addressing the Secrecy:** Bring up the strange nature of this request.
          *   *Idea:* You never told anyone. Why me? Why here?
          *   *Drafting thought:* Don't demand an answer, just acknowledge the mystery. "You kept this place like a second heartbeat."

      *   **The Core Philosophical Question (The "Why"):** This is the tricky part. Needs to be natural speech, not an essay.
          *   *Idea:* I could lie. No one would know. But I can't.
          *   *Drafting thought:* Focus on the weight of the word "promise" when it's invisible. It's not about you watching me; it's about me knowing I did it.
          *   *Refinement:* "If I lied, the only person I'd fool is me. But I'd know." "It's not about you checking up on me."

      *   **The Binding Nature:** Why is it *more* binding?
          *   *Idea:* Because it's pure. No applause.
          *   *Drafting thought:* Public promises are for the living. This one is just for us. It's a contract between my integrity and your memory.
          *   *Refinement:* "A promise nobody can check is the only one that's truly mine."

      *   **Closing:** Transition to the act of scattering.
          *   *Idea:* Okay, I'm doing it now. You're free. I'm free.
          *   *Drafting thought:* Keep it simple. "Here is the water. Here are you."

  4.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is it too abstract?
      *   *Fix:* Add more sensory details. The sound of the water, the breath in the cold air, the weight of the urn/container.
      *   *Critique:* Is it too philosophical?
      *   *Fix:* Break up the reasoning with pauses and direct address. Use "I think" or "It feels like" to soften the assertions.
      *   *Critique:* Is the husband included appropriately?
      *   *Fix:* Acknowledge him standing there, a witness to the act but not the secret. He validates the reality of the moment without knowing the specifics.

  5.  **Final Polish:** Check the rhythm. It should sound like spoken word, with natural pauses. Ensure the emotional arc moves from the mystery of the request to the resolution of the act.

      *(Self-Correction during drafting the final output)*: Make sure I don't explain *why* the aunt chose the spot, because the prompt says the user doesn't know/explain it. The focus must remain on the *promise itself*.

  6.  **Final Output Generation:** (This matches the provided good response.)
