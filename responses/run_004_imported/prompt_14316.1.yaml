answer: |-
  Here are ten interview questions tailored for your episode. The first three address your specific requirements regarding robustness, Widerker's Dilemma, and the question-begging charge, complete with the requested follow-up strategies. The remaining seven are designed to probe the broader implications of her semicompatibilist framework without re-treading the basic Frankfurt setup.

  ### The Core Challenges

  **1. The Robustness of Alternatives**
  "You often dismiss residual possibilities in Frankfurt cases as mere 'flickers' rather than freedoms robust enough to ground responsibility. But if we strip away the intuition that PAP is true, what independent criterion are you using to cash out 'robustness'? Is it that the alternative must allow for a different *moral* outcome, or simply a different *physical* one? And if it's the former, aren't you defining robustness in terms of the very responsibility conditions you're trying to prove?"

  *   **Likely Answer:** She will likely argue that a robust alternative must be one where the agent *could have avoided responsibility*, not just one where the world looks slightly different.
  *   **Follow-Up:** "If the only robust alternative is one where you aren't responsible, that seems to make the definition of 'robust' parasitic on the conclusion that the actual sequence determines responsibility. Can you give me a description of a robust alternative that doesn't presuppose the actual sequence is already sufficient for blame?"
  *   **The "Flicker" Call-Out:** *If she retreats to:* "Again, those are just flickers, not freedoms."
      *   **Response:** "I want to press on that distinction. When you say 'flicker, not freedom,' is that a substantive claim about the metaphysics of agency, or is it a label we apply to alternatives once we've decided they don't matter? Because if it's the latter, it sounds like we're defining away the counterexample rather than solving it."

  **2. Widerker's Dilemma and Buffered Cases**
  "Let's turn to Widerker's Dilemma. He argues that for Black to know when to intervene, the prior sign must be either deterministically or indeterministically linked to Jones's choice. If it's deterministic, you've begged the question against the incompatibilist; if it's indeterministic, Black can't intervene reliably. Do the buffered or blocked versions of the case, like Mele and Robb's, genuinely escape this by removing the prior sign, or do they just relocate the problem into the buffer mechanism itself?"

  *   **Likely Answer:** She will likely defend the Mele-Robb style cases, arguing that the buffer allows the intervention to be triggered without a prior *deterministic* sign of the decision itself, thus avoiding the dilemma.
  *   **Follow-Up:** "But doesn't the buffer still require a causal connection to the agent's deliberation process? If that connection is tight enough to guarantee the intervention triggers correctly, hasn't the determinism snuck back in through the side door of the buffer's reliability? How do you ensure the buffer isn't just a longer deterministic chain?"

  **3. The Question-Begging Charge (Actual Sequence vs. Leeway)**
  "The leeway incompatibilist's fundamental complaint is that the entire Frankfurt strategy assumes from the start that facts about the actual sequence are sufficient for responsibility. They deny that premise. So, when you present a Frankfurt case and say, 'See, Jones is responsible despite no alternatives,' aren't you simply asserting the conclusion the incompatibilist denies? What independent reason can you offer a leeway theorist to grant that the actual sequence is enough, other than pointing to cases where we've already assumed it is?"

  *   **Likely Answer:** She will likely appeal to the "best explanation" of our practices or argue that the actual sequence captures the *sourcehood* required for responsibility, which is distinct from leeway.
  *   **Follow-Up:** "If you appeal to sourcehood, the incompatibilist will say sourcehood *requires* leeway. If you appeal to our intuitive practices, they'll say those practices are contaminated by the false belief in PAP. Is there a neutral ground here, or does this debate ultimately rest on a clash of brute intuitions?"
  *   **The "Flicker" Call-Out:** *If she tries to pivot:* "This is why the flicker strategy fails; it focuses on the wrong kind of freedom."
      *   **Response:** "I'm worried that's becoming a catch-all defense. If every challenge to the actual sequence is dismissed as focusing on the 'wrong kind' of freedom, how do we test the theory? What would count as evidence that the actual sequence *isn't* enough, if not the lack of alternatives?"

  ### The Broader Framework

  **4. Guidance Control and Mechanism Ownership**
  "Your concept of 'guidance control' relies heavily on the agent's mechanism being 'moderately reasons-responsive.' But in a Frankfurt case, the presence of Black seems to alter the modal profile of Jones's mechanism. Even if Black doesn't intervene, isn't the mechanism *different* simply because it exists in an environment where failure is impossible? How do you separate the mechanism's properties from the counterfactual intervener's presence?"

  **5. Semicompatibilism and Determinism**
  "You defend semicompatibilism: the claim that responsibility is compatible with determinism, regardless of whether freedom (to do otherwise) is. If Frankfurt cases succeed in severing responsibility from alternative possibilities, does that make the debate over determinism largely irrelevant to moral responsibility? Or does determinism still threaten responsibility in ways that Frankfurt cases don't capture?"

  **6. Praise vs. Blame Asymmetry**
  "Most Frankfurt cases focus on blame: Jones chooses to kill, and is blameworthy even if he couldn't have done otherwise. Do these cases work symmetrically for praise? If an agent is buffered to do a good deed, are they praiseworthy in the same way? If not, does that suggest that alternative possibilities matter more for positive moral status than negative?"

  **7. Sourcehood vs. Leeway**
  "Many critics have shifted from Leeway Incompatibilism to Source Incompatibilism, arguing that even if PAP is false, determinism prevents the agent from being the *source* of the action in the right way. Does your guidance control account adequately address sourcehood, or is it vulnerable to the claim that without leeway, the agent is merely a conduit for prior causes?"

  **8. The Role of Intuition**
  "Frankfurt cases rely heavily on the intuition that Jones is responsible in the specific scenario. But experimental philosophy has suggested that intuitions about these cases vary based on how they are framed. If the intuition that Jones is responsible is not universal, does that weaken the claim that these cases refute PAP as a conceptual truth?"

  **9. Pedagogical Implications**
  "I'm recording this with two of my grad students, and we teach this material constantly. When students first encounter Frankfurt cases, they often feel cheated—like the intervener 'contaminates' the scenario. Is there a way to present these cases that avoids the feeling of a trick, or is that resistance a feature of the philosophical landscape we just have to live with?"

  **10. The Future of the Debate**
  "Given the resilience of the flicker strategy and the persistence of source incompatibilism, where do you see the dialectic going? Is the next move to refine the actual sequence account further, or should we be looking for a completely different framework for responsibility that doesn't rely on these thought experiments?"
