      *   *Idea 6:* Semicompatibilism and Determinism. If PAP is false, does determinism still threaten MR? (The "semi" part).
      *   *Idea 7:* Blame vs. Praise. Do Frankfurt cases work symmetrically for praise?
      *   *Idea 8:* The Grad Student Angle. How do you teach this without confusing students about "could have done otherwise"?
