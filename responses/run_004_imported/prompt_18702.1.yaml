  ### The Breakdown (Why the tiers are ranked this way)

  You've stumbled into one of the deepest rabbit holes in philosophy of science. The reason there isn't a single winner is that "function" is likely a **cluster concept**—different theories capture different intuitions we have about the word. However, based on current philosophical consensus, robustness against counter-examples, and explanatory power, here is the logic behind the ranking:

  #### **S Tier: Etiological/Selected-Effects (SE)**
  *   **Why it's here:** This is the "Standard Model." It is the most widely cited and defended account in contemporary philosophy of biology (largely due to Karen Neander's refinements).
  *   **Malfunction:** **Nails it.** A heart that isn't pumping still has the function of pumping because that is the effect for which ancestors were selected. It preserves the *normativity* of function (the difference between what a part *does* and what it *ought* to do).
  *   **Novel Trait:** **Struggles.** This is its Achilles' heel. A brand-new mutation that helps survival technically has no "function" yet under strict SE, because selection hasn't acted on it historically.
  *   **Verdict:** It wins the S tier because capturing "malfunction" is generally considered the hardest philosophical constraint. If a theory can't explain how a broken heart is still a heart, it fails the core intuition of "function."

  #### **A Tier: Organizational & Causal-Role**
  *   **Organizational (Mossio et al.):** This is the rising star. It grounds function in the here-and-now self-maintenance of the system (organizational closure).
      *   **Pros:** Ahistorical (handles **Novel Traits** perfectly) and accounts for **Malfunction** (if a trait breaks the self-sustaining cycle, it's a malfunction).
      *   **Cons:** Defining "organizational closure" precisely is tricky, and some argue it secretly smuggles in evolutionary history. It's in A because it's the strongest challenger to SE.
  *   **Causal-Role (Cummins):** This is the workhorse of physiology.
      *   **Pros:** Handles **Novel Traits** effortlessly (if it does something now, it has a function).
      *   **Cons:** Fails the **Malfunction Problem**. If a heart is stalled, it contributes nothing to the capacity of circulation; therefore, under strict CR, it currently has no function. It also risks being too permissive (does a tumor have a function if it causally contributes to the system's state?).
      *   **Verdict:** It stays in A because it is indispensable for actual scientific practice, even if philosophers argue it describes "causal roles" rather than "proper functions."

  #### **B Tier: Modern History & Propensity**
  *   **Modern History (Godfrey-Smith):** Essentially a tweak on SE. It says selection only needs to have happened *recently*, not back at the trait's origin.
      *   **Verdict:** It solves some edge cases for SE but doesn't offer a fundamentally new mechanism. It inherits SE's strengths and weaknesses, just with a shorter time horizon.
  *   **Propensity (Bigelow & Pargetter):** Suggests function is a forward-looking propensity to survive.
      *   **Verdict:** It handles novelty well but struggles to ground normativity. If a trait *has* the propensity but fails to manifest it (due to damage), does it still have the function? It's less precise than the Organizational account.

  #### **C & D Tiers: Empty**
  *   **Why:** None of these theories are "refuted." They are all live options in the literature. The field is currently moving toward **Function Pluralism**, which suggests we should use SE when talking about evolution, CR when talking about physiology, and Organizational when talking about systems biology.

  ### A Note for Your Article on "Leftovers"

  This philosophical mess is actually the **hook** for your piece.

  *   **Under the S-Tier (SE) view:** The appendix and coccyx literally **have no function**. They are evolutionary ghosts. They exist, but they are "broken" in a historical sense.
  *   **Under the A-Tier (CR/Org) view:** The appendix **does have a function** (immune reservoir, gut flora safe house) because it currently contributes to the system's survival.

  Your "leftover" parts are the battleground where these theories fight. If you define function historically, they are junk. If you define function systemically, they are repurposed tools. That tension *is* the story.
  ```
