      *   *Key Insight:* The distinction between *long-run neutrality* (Hume's famous contribution) and *short-run non-neutrality* (Hume's policy preference). Mercantilists wanted the stock. Hume wanted the flow. But wanting the flow to boost industry is still interventionist in spirit, even if the mechanism is natural.
      *   *Wait, one correction:* Hume doesn't advocate *intervention* necessarily, but he identifies the *benefit* of monetary expansion. The verdict needs to be about his *theory*, not necessarily his policy prescriptions (which were often hands-off). The theory contains a mercantilist worm: the idea that one nation's gain (in industry) is linked to another's loss (of industry) during the transition.

