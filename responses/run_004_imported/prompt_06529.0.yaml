answer: |-
  **Title:** The Dynamic Mercantilist: Why Hume Did Not Kill the Dragon, Only Tame It

  **Introduction**

  The retired professor at your dinner party is half-right, which makes him twice as insufferable. He is correct that David Hume's economic essays—"Of Money," "Of the Balance of Trade," and "Of the Jealousy of Trade"—shattered the crude bullionism of the 17th century. Hume demonstrated that a nation cannot indefinitely hoard specie (gold and silver) because market forces will inevitably push it back out. This is the famous Price-Specie-Flow Mechanism, the cornerstone of the "clean break" narrative. According to this view, Hume is the proto-classical liberal who proved that trade is not zero-sum and that government interference in the money supply is futile.

  However, your reading of the texts has uncovered a fissure in this orthodoxy. You have noticed that Hume advocates for a *growing* money supply over a *static* one, relying on the lag between new money and rising prices to stimulate industry. You have also noted his palpable anxiety in "Of the Jealousy of Trade" regarding the loss of manufacturing to lower-wage neighbors. These are not the musings of a laissez-faire purist. They are the concerns of a nationalist.

  The verdict must be decisive: **Hume did not make a clean break from mercantilism.** Instead, he transmuted it. He destroyed *static* mercantilism (the hoarding of stock) but replaced it with *dynamic* mercantilism (the management of flow for industrial advantage). He solved the technical problem of the balance of payments but retained the mercantilist soul: the belief that national power rests on industrial supremacy relative to one's neighbors. The professor sees the mechanism; you have seen the motive. The worm is indeed still there.

  **The Case for the Clean Break**

  To understand why the professor believes Hume solved the debate, we must grant the strength of the "clean break" argument. In "Of the Balance of Trade," Hume utilizes a hydraulic metaphor that remains devastatingly effective. He asks us to imagine the water levels of the ocean leveling out; similarly, money must find its level among nations. If England has too much gold, prices rise. English goods become expensive; foreign goods become cheap. Gold flows out to pay for imports until prices equalize.

  This logic dismantles the core mercantilist fear: that a trade deficit is a permanent injury. Hume shows it is a self-correcting temporary condition. He mocks the "jealousy" of states that treat trade as war, writing, "I shall therefore venture to affirm, that there is no maxim more certain than that which seems most obvious: that the increase of domestic industry is the only means of increasing the stock of money."

  In this light, Hume appears to be arguing that government policy is irrelevant. Why fear a deficit? The market fixes it. Why hoard gold? It is useless. This is the Hume the professor worships: the man who turned economics from statecraft into science, proving that the "balance of trade" is a phantom. If this were the whole story, the professor would be right. Hume would have cleared the field for Adam Smith and David Ricardo, who would later argue that nations should specialize based on comparative advantage regardless of industrial retention.

  **The Worm in the Apple: "Of Money"**

  However, the professor's hero-worship crumbles when we move from "Of the Balance of Trade" to "Of Money." Here, Hume makes a distinction that the textbook summaries often gloss over: the difference between the *level* of money and the *change* in money.

  Hume explicitly states that a high money supply is not inherently better than a low one in the long run (neutrality of money). But he argues passionately that a nation is best off *while* the money supply is increasing. Why? Because of price stickiness. When new gold enters the kingdom, it does not instantly raise all prices. It first goes to merchants and manufacturers, who hire more workers and expand production. Prices rise only later, "by degrees."

  Hume writes: *"It is only during this intermediate situation, between the acquisition of money and rise of prices, that the encrease of money is favourable to industry."*

  This is the mercantilist worm. Hume is admitting that a nation can gain a *real* competitive advantage over its neighbors through monetary expansion, provided the expansion is continuous. If England's money supply grows while France's stays static, English industry gets a temporary boost in employment and output before prices adjust. This is not the long-run neutrality of classical economics; this is a theory of stimulus.

  Crucially, this advantage is *relative*. For England to enjoy this "intermediate situation," it must be gaining specie *from* somewhere else. While Hume admits the specie will eventually flow back out, he is effectively arguing that a nation should strive to keep the inflow going to keep industry "awake." He writes that a low money supply can be a disadvantage if it causes a nation to lose its manufacturing base to neighbors. This is not a belief in automatic equilibrium; it is a fear of deindustrialization. It implies that the "level" of money *does* matter for industrial capacity, contradicting his own hydraulic metaphor.

  **The Anxiety of Neighbors: "Of the Jealousy of Trade"**

  The final nail in the coffin of the "clean break" theory is found in the title of the third essay itself: "Of the Jealousy of Trade." If Hume truly believed in the harmonious self-correction of the market, there would be no need to discuss jealousy.

  In this essay, Hume argues against *excessive* jealousy, but he validates *prudent* concern. He worries specifically about high-wage nations losing manufacturing to low-wage rivals. He observes that when a neighbor becomes rich and industrious, it can be a threat: *"The more men are refined in their pleasures, 'tis the more they will naturally produce among themselves."* But he also acknowledges the danger of cheap labor undercutting domestic industry.

  He writes: *"I am afraid... that the cheapness of provisions and labour in our neighbouring countries will be a disadvantage to us."*

  This is not Ricardian comparative advantage. Ricardo would argue that if Portugal makes cloth cheaper, England should buy it and make wine. Hume worries that if the neighbor makes it cheaper, England loses the *capacity* to make it, and with it, its power and population. He views manufacturing capacity as a strategic asset that can be permanently lost if price differentials become too steep. This is the heart of mercantilist anxiety: the fear that economic shifts translate directly into geopolitical decline.

  Hume tries to soothe this fear by arguing that low-wage nations will eventually rise in price as they accumulate money (returning to the Price-Specie-Flow). But the fact that he feels the need to soothe it, and that he admits the "intermediate situation" can last long enough to destroy a rival's industry, reveals his true priority. He wants free trade only insofar as it maintains a balance of industrial power. He is not arguing for global efficiency; he is arguing for national resilience.

  **The Verdict: Dynamic Mercantilism**

  So, did Hume solve the free-trade-vs-protectionism fight? No. He moved the goalposts.

  The 17th-century mercantilist said: "Hoard gold to be powerful."
  Hume said: "You cannot hoard gold, but you can use the flow of gold to stimulate industry, which makes you powerful."

  This is a subtle but profound difference. The professor claims Hume ended the debate by proving protectionism unnecessary. The text shows Hume argued protectionism was *unnecessary only if* the money supply was managed or naturally expanding to keep industry competitive. Hume's system relies on a continuous churn of specie to keep the "spirit of industry" alive. If the money supply stagnates, Hume fears industry will languish.

  Therefore, the verdict is this: **Hume is not the father of laissez-faire; he is the father of demand-side nationalism.** He dismantled the *mechanism* of bullionism (the idea that you can keep the gold) but preserved the *goal* of bullionism (the idea that national wealth depends on outperforming neighbors in manufacturing).

  The "clean break" reading relies on focusing exclusively on the long-run equilibrium (where money is neutral). But Hume himself was more interested in the short-run disequilibrium (where money stimulates industry). In the long run, we are all dead, as Keynes would later say. In the short run, Hume was a mercantilist. He believed that the state of trade was a competition for industrial capacity, and that monetary conditions determined the winner.

  **Implications for Your Character**

  For your novel, this distinction is gold. The retired professor is not necessarily lying, but he is engaging in a specific kind of intellectual blindness common to academics: he worships the *model* while ignoring the *application*.

  *   **The Professor's Truth:** He is right that Hume proved trade deficits self-correct. This makes him sound brilliant at dinner parties when debunking populist fears about trade gaps.
  *   **The Professor's Blind Spot:** He ignores that Hume's "solution" relies on a continuous advantage in industrial stimulation that looks suspiciously like the protectionist advantage Hume is supposed to have debunked.

  To write him honestly, have him double down on the *mechanism* (the water level analogy) while waving away the *implication* (the fear of losing manufacturing). When challenged, he should treat the "rising money supply" argument as a minor footnote, when in reality, it is the engine of Hume's policy preference.

  He is insufferable not because he is wrong, but because he is selectively right. He uses Hume to shut down arguments about trade deficits, but he would likely be horrified by the idea that Hume's theory implies nations should fear losing their manufacturing base to low-wage rivals—a very modern, very mercantilist fear that Hume explicitly validated.

  **Conclusion**

  Hume did not kill the mercantilist dragon. He skinned it. He removed the scales of bullion hoarding but kept the beast's appetite for national industrial dominance. He showed that you don't need to lock gold in the vault to be strong; you just need to keep it flowing through the workshops fast enough to stay ahead of the neighbor.

  Your novelist's instinct is correct. The worm is there. Hume's essays are not a manifesto for free trade in the modern sense; they are a manual for maintaining national vigor in a competitive world. The professor claims Hume ended the war. The text shows Hume just changed the weapons.
