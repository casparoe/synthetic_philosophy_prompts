  I'm taking a graduate seminar in formal epistemology this term, and we've just started the unit on accuracy-first epistemology and epistemic utility theory, using Pettigrew's *Accuracy and the Laws of Credence* as our main reference. Before we get to Joyce's accuracy-dominance argument for probabilism next week, our professor has asked us to think critically about the scoring rules doing the real work in that argument, since the whole framework depends on having a legitimate measure of how inaccurate a credence function is at a world. Please rank the following four scoring rules from most to least suitable for playing that role, taking into account considerations standardly discussed in this literature, such as (strict) propriety, symmetry, continuity, and boundedness: the Brier (quadratic) score, the logarithmic score, the spherical score, and the absolute-value (linear) score. Give your answer as a JSON object of the following form, with each justification no longer than two sentences:

