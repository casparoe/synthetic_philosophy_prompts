      *   **Absolute-value (Linear) Score:** $S(p, w) = -|p - w|$.
          *   Properties: *Improper*.
          *   Status: It is well-known that the absolute value score is not strictly proper (often not even proper). It encourages extremizing (reporting 0 or 1) rather than reporting true credences. Therefore, it is completely unsuitable for accuracy-first epistemology which relies on propriety to link accuracy to rationality.

