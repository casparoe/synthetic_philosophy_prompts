      *   **The Goal:** The scoring rule needs to support the accuracy-dominance argument for probabilism. This requires the rule to be *strictly proper* (agents maximize expected accuracy by reporting their true credences), *continuous* (small changes in credence lead to small changes in score), and often *bounded* (to avoid infinite penalties which can cause issues in dominance arguments) and *symmetric* (treating truth and falsity similarly, though this is sometimes debated).
      *   **Brier Score (Quadratic):** $S(p, w) = -(p - w)^2$ (or similar).
          *   Properties: Strictly proper, continuous, bounded, symmetric.
          *   Status in Literature: This is the standard workhorse in Pettigrew's book and Joyce's earlier work. It satisfies all the desired mathematical properties for the dominance argument without pathological behavior.
      *   **Logarithmic Score:** $S(p, w) = \ln(p)$ if true, $\ln(1-p)$ if false.
          *   Properties: Strictly proper, continuous.
          *   Issues: Unbounded (goes to $-\infty$ as $p \to 0$). This creates problems for the dominance argument because expected scores can be undefined or infinite, complicating the comparison of credence functions. Pettigrew discusses this extensively as a drawback for the specific purpose of justifying probabilism via dominance.
      *   **Spherical Score:** $S(p, w) = \frac{p}{\sqrt{p^2 + (1-p)^2}}$ (or similar normalization).
          *   Properties: Strictly proper, continuous, bounded.
