answer: |-
  You didn't just stumble onto a cute math trick; you accidentally discovered a fundamental theorem in probability theory called **Dutch Booking**.

  To answer your question directly: **Yes, you messed up your reasoning,** but not in the way you think. You didn't necessarily misjudge the project's timeline; you misjudged how probability works as a system.

  Here is exactly what happened, why Raj was able to guarantee a profit, and how to fix it for next week.

  ### 1. The Math Error: The Sum Must Equal 100%
  In probability, if you have a set of outcomes that are:
  1.  **Mutually Exclusive** (only one can happen: it can't ship Friday *and* Monday), and
  2.  **Exhaustive** (one of them *must* happen: Friday, Monday, or Later covers all time),

  ...then the sum of their probabilities **must equal 100%**.

  Let's look at your numbers:
  *   Ships Friday: **70%**
  *   Ships Monday: **55%**
  *   Ships Later: **20%**
  *   **Total: 145%**

  You have assigned **145% confidence** to a situation that only has **100% possibility**. You are "over-confident" across the board.

  ### 2. How Raj Made "Free Money" (The Dutch Book)
  Raj realized that because your percentages added up to more than 100%, your "prices" for these bets were too high.

  Imagine each percentage is the price of a \$1 ticket.
  *   You say there's a 70% chance of Friday. That implies you'd pay **\$0.70** for a ticket that pays \$1 if it ships Friday.
  *   You say there's a 55% chance of Monday. That implies you'd pay **\$0.55** for a ticket that pays \$1 if it ships Monday.
  *   You say there's a 20% chance of Later. That implies you'd pay **\$0.20** for a ticket that pays \$1 if it ships Later.

  **Raj's Move:**
  Raj acts as the "House." He sells you all three tickets.
  *   He collects from you: $\$0.70 + \$0.55 + \$0.20 = \mathbf{\$1.45}$.
  *   Friday comes. The sprint ships (let's say it ships on Monday).
  *   The "Monday" ticket wins. Raj has to pay you **\$1.00**.
  *   The other two tickets are worthless.

  **Raj's Profit:**
  He collected **\$1.45** and only had to pay out **\$1.00**. He keeps the **\$0.45** difference risk-free. It doesn't matter which day the sprint ships; he always collects \$1.45 and always pays out exactly \$1.00.

  This is called a **Dutch Book**. It proves that if your probabilities are incoherent (don't sum to 100%), you can be exploited into a guaranteed loss.

  ### 3. Why Did You Do This?
  This isn't a sign that you're bad at math; it's a sign that you're human. This is a very common cognitive bias.

  *   **Overconfidence:** We tend to feel "pretty sure" about multiple scenarios individually without considering them as a zero-sum system. You felt good about Friday, but you also acknowledged a strong risk of Monday, and a small risk of Later, without realizing those risks compete for the same 100% bucket.
  *   **Framing:** You likely treated them as independent confidence levels ("How confident am I in Friday?" vs "How confident am I in Monday?") rather than a unified distribution.

  ### 4. How to Fix It Next Time
  To keep your game honest (and prevent Raj from buying lunch with your points), you need to ensure your probabilities are **coherent**.

  **Option A: The Normalization Fix**
  If you want to keep your relative feelings the same but fix the math, you can normalize the numbers.
  *   Total sum: 145
  *   Friday: $70 / 145 \approx 48\%$
  *   Monday: $55 / 145 \approx 38\%$
  *   Later: $20 / 145 \approx 14\%$
  *   **New Total: 100%**

  **Option B: The "Odds" Fix**
  Before you announce your numbers, add them up. If they exceed 100%, force yourself to reduce the confidence on the less likely outcomes until they fit.

  ### Summary
  Raj didn't predict the future better than you. He just spotted that you were selling \$1 bills for \$1.45.

  You messed up the **logic of probability**, not necessarily the prediction itself. It's a great lesson: **Probability isn't just about how sure you feel; it's about how your certainty fits together.**

  Tell Raj he can keep the points, but ask him to explain "Expected Value" next time so you can turn the tables.
