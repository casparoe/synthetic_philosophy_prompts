answer: |-
  **MEMORANDUM**

  **TO:** Office of the Provost; University Budget Committee
  **FROM:** Committee on Research Metrics
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Research Impact Index for Discretionary Fund Allocation

  ### 1. Executive Summary

  The Committee on Research Metrics has reviewed the proposal to replace departmental peer review with a formulaic "Research Impact Index" (RII) for allocating the $2M Annual Discretionary Research Fund. 

  **Recommendation:** The Committee recommends **Adoption with Conditions**. 

  We advise against a full replacement of peer review. Instead, we recommend a **Hybrid Allocation Model** where the RII serves as a preliminary eligibility filter and weighting mechanism, subject to explicit, annually revisable policy weights, with final allocation decisions retaining a qualitative peer-review override. 

  This approach secures the transparency and efficiency sought by proponents while mitigating the risks of metric fixation and value-masked-as-fact raised by critics.

  ### 2. Background and Proposal

  The Administration proposed the RII to streamline funding decisions and align resources with strategic goals. The proposed formula weights three variables:
  1.  **Citation Impact (40%)**
  2.  **Grant Income (30%)**
  3.  **Societal Impact Score (30%)**

  Proponents argue this removes bias and creates an "objective" standard. Critics argue the formula privileges quantitative disciplines, incentivizes short-termism, and smuggles in a contestable definition of "scholarship" under the guise of neutrality.

  ### 3. Analysis of the Fact/Value Distinction in Metrics

  The core tension in this proposal is not technical, but normative. The Committee recognizes that any weighting formula (e.g., why 40% citations and not 20%?) constitutes a **value judgment**, not a technical finding. 

  *   **The Risk of Technocratic Masking:** If the Administration presents the RII as a purely "scientific" measure of quality, it risks obscuring the policy choices embedded in the weights. This creates a technocratic feedback loop where the metric defines value, rather than reflecting institutional values.
  *   **The Opportunity for Explicit Value Declaration:** Conversely, a formula forces the University to explicitly state its priorities. Unlike opaque peer review, a formula makes the valuation of "grant income" vs. "societal impact" visible and open to debate.

  To proceed responsibly, the Administration must treat the RII weights as **strategic policy levers**, not objective discoveries.

  ### 4. Recommendation: Adopt with Conditions

  The Committee recommends adopting the RII framework under the following three binding conditions:

  **Condition A: Transparency of Normative Weights**
  The weighting formula (40/30/30) must be published not as a "calculation of merit," but as a "Statement of Strategic Priorities." The Administration must explicitly acknowledge that these weights reflect a choice to prioritize external validation (grants/citations) alongside public engagement. This prevents the masking of value choices as neutral technical findings.

  **Condition B: The Peer-Review Override**
  The RII shall generate a *ranking*, not a *decision*. Departments retain the right to submit qualitative contextual statements. A Faculty Research Appeals Panel shall have the authority to adjust allocations by up to 15% where the index demonstrably misrepresents the quality of work (e.g., monograph-heavy humanities vs. lab sciences). This ensures expertise informs ends, rather than merely servicing means.

  **Condition C: The Sunset and Review Clause**
  The RII weights are valid for two fiscal years only. After 24 months, the Committee on Research Metrics must reconvene to review whether the metric has altered research behavior (Goodhart's Law). If data shows the index is distorting scholarship (e.g., salami-slicing publications to boost citations), the weights must be recalibrated or the system reverted to peer review.

  ### 5. Minority Opinion and Alternative Considered

  A significant minority of the Committee recommended **Rejecting** the RII entirely in favor of enhanced peer review. Their arguments, which the Administration must weigh seriously, include:

  *   **The Reductionism Objection:** Complex scholarly contributions cannot be reduced to three variables without significant loss of meaning. A "societal impact score" is particularly vulnerable to gaming and may favor populist outputs over rigorous, long-term inquiry.
  *   **The Technocracy Objection:** Even with transparency, a formula shifts power from faculty experts to administrative data managers. Once a metric is tied to funding, it ceases to be a measure and becomes a target, potentially eroding academic freedom by incentivizing researchers to chase the index rather than pursue truth.
  *   **Disciplinary Bias:** The proposed weights structurally disadvantage humanities and theoretical social sciences, where grant income and citation velocities differ fundamentally from STEM fields.

  *Committee Note:* While we are not adopting the full rejection, Condition B (Peer-Review Override) is included specifically to address the Disciplinary Bias concern.

  ### 6. Implementation Timeline

  *   **November 15:** Publish "Statement of Strategic Priorities" detailing the RII weights as policy choices.
  *   **December 1:** Open window for Departmental Contextual Statements.
  *   **January 10:** Appeals Panel convened to review outliers.
  *   **February 1:** Final Fund Allocation.
  *   **Month 24:** Mandatory review of RII efficacy and behavioral impact.

  ### 7. Conclusion

  The Committee believes that a "scientific world-conception" in administration is useful only if it remains humble regarding its own normative limits. By adopting the RII conditionally, the University gains the efficiency of metrics without surrendering the responsibility of defining its own values. We treat the formula as a tool for explicit decision-making, not a substitute for it.

  Respectfully submitted,

  **Committee on Research Metrics**
  *Chair*
