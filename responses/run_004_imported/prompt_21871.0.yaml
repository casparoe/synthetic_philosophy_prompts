      *   **Specific Constraint/Preference:** He hated phrases implying independent causality (e.g., "cancer took him," "heart gave out"). He explicitly stated if anyone said cancer "took" him, the eulogy would be a failure.
      *   **Audience:** Mixed. Academics/Students (need metaphysical precision) + General Family/Friends (need comfort, clarity, no confusion).
      *   **Speaker:** Grandchild, Engineer, no philosophy training.
      *   **Tone:** Honest, comforting, precise but accessible, respectful of his agency (not a puppet show).
      *   **Length:** About 5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Key Elements:** Include the fire/cotton example, address the causation issue without sounding deterministic/puppet-like, end comfortably.

  2.  **Deconstruct the Theological/Philosophical Challenge:**
      *   *Occasionalism:* God is the only true agent. Created things are "occasions" for God's action.
      *   *The Trap:* If God does everything, did Grandfather *do* anything? Is he a puppet?
      *   *The Ash'ari Solution (Kasb):* Acquisition. God creates the act, but the human "acquires" it, making it theirs morally and personally. This needs to be hinted at without using jargon like *kasb*.
      *   *The "Cancer" Constraint:* Cannot say "cancer killed him." Must frame his passing as God's direct action, but gently.
      *   *The "Fire/Cotton" Metaphor:* Needs to be illustrative of his wonder at God, not just a dry logical point. It represents his view of a world alive with divine presence.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the mixed audience, and the speaker's role (engineer vs. theologian). Establish warmth.
      *   **The Core Philosophy (The Hard Part):** How to explain occasionalism simply?
          *   *Idea:* Contrast the engineer's view (cause/effect) with his view (God's continuous creation).
          *   *Metaphor:* The fire and cotton. Don't lecture. Use it to show *why* he loved the world. It wasn't that things *didn't* matter; it was that they mattered *more* because God was in every moment.
      *   **Addressing the "Puppet" Concern:** How to show he had agency?
          *   *Focus:* His choices, his love, his teaching. God created the capacity, but *he* wielded it. The habit of God is reliable, allowing for real life.
          *   *Phrasing:* Avoid "God made him do this." Use "He chose to reflect..."
      *   **Addressing the Death (The "Cancer" Constraint):**
          *   *Constraint:* Do not say "cancer took him."
          *   *Phrasing:* "He returned to God," "God called him," "His breath was sustained until it wasn't."
          *   *Tone:* Gentle. Not coldly doctrinal.
      *   **Closing:** Comfort for the grieving. The reliability of God's habit means we can trust the world, even in loss. A final image of the fire/cotton as warmth/light.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm an engineer. He was a theologian. He studied Ghazali. He believed fire doesn't burn cotton, God does. Some think this makes us puppets. But he loved deeply. He taught many. When he died, it wasn't cancer taking him, it was God calling him. We miss him. But God is still holding the cotton. Thank you.
      *Critique:* Too dry. Too blunt on the theology. Needs more heart.

  5.  **Drafting - Iteration 2 (Fleshing out the theology and emotion):**
      Start with the book on his nightstand. *The Incoherence of the Philosophers*. Explain the fire/cotton thing. To him, the world wasn't a machine (engineer view), it was a conversation with God. He didn't feel like a puppet because he loved us. That love was real. Regarding his death, I know people say cancer took him. But he taught us to see God's hand. So we say God welcomed him. We are sad, but we trust the Habit of God.
      *Critique:* Better. Need to ensure the "agency" part is clear so the students nod and the family doesn't feel he was a robot. Need to make sure the "cancer" restriction is honored without drawing *too* much attention to the restriction itself (don't say "He told me not to say cancer"). Just *don't* say it.

  6.  **Refining the "Agency" vs. "Occasionalism" Tension:**
      *   Ash'aris believe in *kasb* (acquisition). I shouldn't use the word, but I should convey the meaning.
