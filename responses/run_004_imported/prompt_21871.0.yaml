answer: |-
  Friends, family, colleagues, and students.

  For those who don't know me, I am his grandchild. I am also an engineer. By training, I look at the world and see systems: inputs, outputs, causes, and effects. If I push a switch, a light turns on. If a bridge is stressed beyond its load, it falls. It is a world of reliable machinery.

  My grandfather lived in that same world, but he saw a different machinery underneath it.

  On his nightstand, I found a copy of al-Ghazālī's *The Incoherence of the Philosophers*. It was worn, marked up, and underlined. For forty years, he taught a difficult idea: that fire does not burn cotton. Not really. He taught that when fire touches cotton, we see burning, but the fire has no power of its own. It is God who creates the burning, at that exact moment, every moment. The fire is merely the occasion; God is the actor.

  To an engineer, this sounds like the world is an illusion. To his students, it is *kalam*. But to those of us who loved him, it was simply how he loved us.

  He believed that nothing happened by blind force. He winced when people spoke of "cause and effect" as if God were a watchmaker who wound the universe and walked away. He believed God was closer to us than our own breath, personally authoring every instant of our lives.

  I know what some of you are thinking. If God authors every instant, was Grandfather just a puppet? Did his choices matter? Did his love matter?

  I am here to tell you that they did.

  He taught me that while God creates the action, we "acquire" it. The hand that held me when I was frightened was his hand. The patience he showed his students was his patience. The voice that lectured, that laughed, that recited prayer, was his voice. God gave him the power to choose, and he chose, again and again, to be a man of kindness. The power was a gift, but the choice was his own. He was not a puppet; he was a partner in the conversation of his own life.

  And so, regarding this past week. You know he passed away at eighty-seven. In the hallway, I have heard people whisper that the cancer "took" him, or that his heart "gave out."

  I know he would ask me to be precise here. Cancer did not take him. A heart does not have the power to give out on its own. Just as the fire does not burn the cotton, the illness did not take the life. Rather, the One who sustained his breath for eighty-seven years gently withdrew it. He was not taken by a disease; he was called back by his Lord.

  I say this not to be difficult, and not to turn this funeral into a seminar. I say it because this belief was the source of his comfort, and I hope it can be ours.

  If the world were just a machine of cause and effect, then his absence would be a mechanical failure. A broken link in a chain. But if my grandfather was right, then this moment, right now, is not an accident of biology. This grief we feel, this love we share, this silence we keep—it is all being held, directly and personally, by God.

  He spent his life arguing that the world is not dead matter colliding with dead matter. He argued that the world is alive with the immediate presence of the Divine. That means he is not gone into a void. He has moved from the place where God's habit is predictable, to the place where God's mercy is direct.

  To his students: Thank you for sharpening his mind and honoring his work.
  To my family: Thank you for loving him even when he corrected our grammar of causality.

  We will miss him. We will miss the way he looked at a sunset not as scattering light, but as a fresh creation. We will miss the way he listened, fully present, knowing that every moment was a singular gift from God that would never return.

  Let us not say that death has conquered him. Let us say that he has returned to the Only True Cause. And let us trust that the same Hand that held him in life is holding us now, in this grief, and will not let us fall.

  May God have mercy on him, as he had mercy on the truth, and on us. Thank you.
