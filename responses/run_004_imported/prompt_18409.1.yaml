answer: |-
  You are wrong, but you are in very good company. This is arguably the most common misconception students hit when moving from introductory to advanced game theory.

  The intuition you described ("if no pure strategy beats it, it must be a best response to *something*") feels natural, but it is **false**.

  Checking for domination by mixed strategies is not busywork. It is the specific step that makes Iterated Elimination of Strictly Dominated Strategies (IESDS) equivalent to **Rationalizability** (in two-player games). If you skip the mixed check, you may retain strategies that a rational player would *never* play, regardless of their beliefs.

  Here is the minimal example that proves it.

  ### The Minimal Counter-Example

  Consider a game where the **Row Player** has 3 strategies ($U, M, D$) and the **Column Player** has 2 strategies ($L, R$). We will focus only on Row's payoffs to demonstrate the domination, as Column's payoffs are irrelevant to whether Row's strategy is dominated.

  | Row \ Col | $L$ | $R$ |
  | :--- | :---: | :---: |
  | **$U$** | 4 | 0 |
  | **$M$** | 1 | 1 |
  | **$D$** | 0 | 4 |

  #### 1. Check for Pure Strategy Domination
  Let's test if $M$ is strictly dominated by any single **pure** strategy.
  *   **Does $U$ dominate $M$?**
      *   Against $L$: $4 > 1$ (Yes)
      *   Against $R$: $0 < 1$ (No)
      *   **Result:** $U$ does not dominate $M$.
  *   **Does $D$ dominate $M$?**
      *   Against $L$: $0 < 1$ (No)
      *   Against $R$: $4 > 1$ (Yes)
      *   **Result:** $D$ does not dominate $M$.

  If you stop here (as your intuition suggests), you conclude $M$ is **not dominated** and should survive elimination. You might also assume there is some probability $p$ (belief that Column plays $L$) where $M$ is a best response.

  #### 2. Check for Mixed Strategy Domination
  Now, consider a mixed strategy $\sigma$ where Row plays $U$ with probability $0.5$ and $D$ with probability $0.5$.
  *   **Expected Payoff of $\sigma$ against $L$:**
      $$0.5(4) + 0.5(0) = 2$$
  *   **Expected Payoff of $\sigma$ against $R$:**
      $$0.5(0) + 0.5(4) = 2$$

  Compare this to strategy $M$:
  *   Against $L$: $\sigma$ gets **2**, $M$ gets **1**. ($2 > 1$)
  *   Against $R$: $\sigma$ gets **2**, $M$ gets **1**. ($2 > 1$)

  **Result:** Strategy $M$ is **strictly dominated** by the mixed strategy $\sigma = (0.5U, 0D, 0.5D)$.

  #### 3. Why Your "Best Response" Intuition Fails
  You argued: *"It could be a best response to some belief about what your opponent is doing."*

  Let $p$ be the probability Column plays $L$. The expected payoffs are:
  *   $EU(U) = 4p$
  *   $EU(D) = 4(1-p)$
  *   $EU(M) = 1p + 1(1-p) = 1$

  For $M$ to be a best response, it must be greater than or equal to both $U$ and $D$.
  1.  $1 \geq 4p \implies p \leq 0.25$
  2.  $1 \geq 4(1-p) \implies 1 \geq 4 - 4p \implies 4p \geq 3 \implies p \geq 0.75$

  There is no value of $p$ that satisfies both $p \leq 0.25$ and $p \geq 0.75$. **$M$ is never a best response to any belief.**

  Because $M$ is strictly dominated by a mixed strategy, it yields a lower expected payoff than that mix against *any* probability distribution the opponent might use. Therefore, a rational player would never play $M$. If your elimination procedure keeps $M$, your procedure is too weak.

  ### The Geometric Intuition
  Think of the payoffs as points in a 2D plane where the axes are (Payoff vs $L$, Payoff vs $R$).
  *   Point $U = (4, 0)$
  *   Point $D = (0, 4)$
  *   Point $M = (1, 1)$

  The set of all possible mixed strategies between $U$ and $D$ forms the **line segment** connecting $(4,0)$ and $(0,4)$. The equation of this line is $x + y = 4$.
  Strategy $M$ is at $(1,1)$. Since $1+1 = 2$, which is less than 4, point $M$ lies strictly **inside** the convex hull formed by $U$ and $D$ (specifically, below the frontier).

  Any strategy that lies strictly inside the convex hull of other strategies is dominated by a mixture of the strategies on the hull. It is "inefficient."

  ### Why This Matters for Your Prelim
  1.  **Equivalence Theorem:** In two-player games, the set of strategies that survive IESDS (allowing for mixed domination) is exactly the set of **Rationalizable Strategies** (strategies that are best responses to some belief about rational play). If you ignore mixed domination, you break this equivalence.
  2.  **Order Independence:** IESDS is order-independent (you get the same result regardless of which dominated strategy you remove first) *only* if you consider domination by mixed strategies. If you restrict elimination to pure-vs-pure domination, the order in which you eliminate strategies can actually change the final outcome.
  3.  **The "Busywork" Trap:** In many $2 \times 2$ games, mixed domination doesn't add anything new. This is likely why your intuition developed this way. But as soon as a player has 3+ strategies, the "middle" strategy often becomes a candidate for mixed domination, just like $M$ in the example above.

  **Summary:** Do not skip the mixed check. If a strategy is dominated by a mix, it is effectively "poison"—no rational belief system justifies playing it. Eliminating it is crucial for correct analysis.
