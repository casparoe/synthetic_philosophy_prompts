      *   **Tone:** Respectful, honest, poignant, accessible, non-judgmental.

  2.  **Determine the Core Message:**
      *   Acknowledge her unique approach to life without using jargon like "utilitarianism" or "consequentialism."
      *   Frame her actions as driven by a profound sense of *duty* and *clarity*, rather than just "kindness" (which she rejected).
      *   Validate the mourners' grief and their own lives without contrasting them negatively against hers.
      *   Focus on the impact she had (nursing, giving) rather than the moral calculus behind it.
      *   Honor her specific request: Don't call her "kind" in the sentimental sense. Call her "committed," "clear-eyed," or "faithful to her convictions."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. State who she was simply (a nurse, an aunt).
      *   **Addressing Her Wish:** Directly mention her request about the eulogy. This sets the stage for honesty. It explains *why* we aren't using standard platitudes.
      *   **Describing Her Life (The "What"):** She worked hard (nursing). She gave money away. She didn't keep much for herself.
      *   **Describing Her Motivation (The "Why" - without the jargon):** She didn't see it as charity. She saw it as *what needed to be done*. It wasn't about feeling good; it was about being right. Use words like "necessity," "obligation," "logic of care."
