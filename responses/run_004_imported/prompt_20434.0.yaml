answer: |-
  Friends, family, colleagues.

  We are here to honor [Aunt's Name]. And because we are here to honor *her*, specifically, we have to begin with an instruction she left us. She asked that we not stand here today and tell you she was a "kind woman." She asked that we not soften the edges of her life into a comfortable story about generosity and warm feelings.

  She was a nurse for forty years. She knew pain. She knew scarcity. She knew that the world contains more suffering than any one person can fix, and she calculated, with a clarity that most of us find difficult, that her life belonged to that fixing.

  [Aunt's Name] lived by a specific truth. She believed that if you have the capacity to relieve suffering, you are obligated to do so. To her, giving away the majority of what she earned wasn't an act of charity. It wasn't a gift she gave that she could have chosen to keep. In her mind, it was simply what was required. She often told people who praised her that they were misunderstanding the situation. She wasn't being generous; she was being accurate.

  I know that for many of us, this is a hard standard to hear. We live our lives balancing our duties to the world with our duties to ourselves and our families. We keep a portion of what we earn. We rest. We allow ourselves the prerogative to be happy, to be secure, to be ordinary. There is no shame in that. It is the human way.

  But [Aunt's Name] was not living the human way. She was living a chosen way. She opted out of the exemptions the rest of us accept. She did not do this to make us feel guilty. She did not do this to set a trap for her family. She did it because she could not bear to do otherwise.

  To call her "kind" suggests she did these things because it felt nice to be good. But anyone who knew her knows it wasn't always nice. It was often hard. It was often lonely. It required a discipline that looks less like sweetness and more like steel. She didn't give because she was overflowing; she gave because she believed the need was there and she was the one who could meet it.

  So, how do we mourn her without indicting ourselves? How do we love her without feeling judged by her example?

  We do it by accepting her request for honesty. We acknowledge that she walked a path few of us can walk. We recognize that her life was a testament to the sheer weight of her convictions. A lighthouse does not judge the ships for sailing in the dark; it simply burns. [Aunt's Name] burned. She showed us what it looks like when a human being decides that their own comfort is secondary to the welfare of others.

  We do not have to live exactly as she lived to honor her. We do not have to empty our bank accounts or deny ourselves rest to prove we loved her. She never asked that of us. She only asked that we not lie about who she was.

  She was a nurse who healed. She was a woman who gave. She was a person who looked at the demands of the world and said, "I will meet them," even when the cost was high.

  Let us remember her not as a saint, and not as a warning, but as she asked to be remembered: as someone who saw what needed to be done, and did it.

  Rest in peace, [Aunt's Name]. We will tell the truth about you.
