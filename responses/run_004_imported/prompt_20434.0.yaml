  1.  **Analyze the Request:**
      *   **Topic:** A eulogy for the user's aunt.
      *   **Context:** The aunt was a nurse for 40 years. She lived a strictly utilitarian life, giving away most of her earnings, believing it was *required*, not just generous. She explicitly asked *not* to be softened into a story about a "kind woman."
      *   **Audience:** Family and colleagues (nurses, friends) who likely lived normal lives (not strict utilitarians). They haven't read moral philosophy.
      *   **Constraint:** The eulogy cannot come across as an indictment of how the mourners live. It needs to honor her specific worldview without making the audience feel guilty or judged.
