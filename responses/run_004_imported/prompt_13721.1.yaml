          *   Reasoning: The geometric method relies on *shared agreement on definitions* prior to deduction. In geometry, this exists. In politics, it does not. Hobbes's behavior with Wallis proves that when definitions *are* challenged, he abandons the method and resorts to authority. Therefore, his political philosophy isn't geometric; it's authoritarian.
          *   Nuance for the SE: Think of it like a spec. If the stakeholders don't agree on the spec (definitions), the code (political system) won't compile, no matter how logical the functions are.

