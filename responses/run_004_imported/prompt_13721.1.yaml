          *   Restate the verdict.
          *   Final thought: Hobbes wanted to escape the uncertainty of civil war by becoming the Euclid of politics. But in fighting Wallis, he showed that he was not a geometer, but a sovereign demanding obedience to his definitions.
          *   Takeaway: Certainty in politics is an illusion if the definitions are not universally conceded.

