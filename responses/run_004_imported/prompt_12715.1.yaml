  8.  *(Self-Correction on Tone)*: Keep it respectful. They are friends/debating partners, not enemies. The tension is intellectual *and* emotional.

  9.  *(Final Review against constraints)*: Did I include excusing vs. exempting? Yes. Manipulation arguments? Yes. Participant/Objective distinction? Yes. No tidy resolution? Yes.

