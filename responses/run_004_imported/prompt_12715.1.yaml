answer: |-
  **Setting:** *Marcus's living room, late evening. Empty wine bottles and coffee mugs clutter the table. ELENA is curled into the corner of the sofa, looking exhausted. MARCUS sits opposite her, leaning forward, elbows on knees.*

  **Elena:** It's the lying that gets me. If he just needed money and asked, and I said no, and he took it anyway… I don't know. Maybe I'd still be mad, but it would be honest. But he looked Mom in the eye. He told her he was six months clean. He hugged her. And two days later, the account is drained.

  **Marcus:** And that's why you're allowed to be furious, El. That's the whole point.

  **Elena:** Is it? Or is that just the biological reflex kicking in?

  **Marcus:** Don't do that. Don't reduce it to biology. Strawson would say that resentment isn't a bug in the system. It's a feature. It's the emotional expression of the demand that you treat me with regard. When your brother lies to your mother, he violates a demand of the relationship. Your resentment is just you registering that violation.

  **Elena:** I get that. I really do. Dana keeps telling me that if I stop feeling resentment, I'm adopting what Strawson calls the "objective attitude." I'm treating my brother like a patient to be managed, or a pest to be controlled, rather than a person. And she says that's a form of abandonment.

  **Marcus:** She's right. It is. To look at him and say, "Oh, well, causal determinism made him do it, so I can't really be mad," is to step out of the moral community with him. You're saying he's not one of us.

  **Elena:** But what if he *isn't* one of us? Not right now? Look, I've been reading Pereboom. He makes a distinction that I think Strawson glosses over. Strawson talks about *excusing* conditions versus *exempting* conditions. An excusing condition is like, "I didn't know that was your coat," or "I was pushed." The action was wrong, but the agent wasn't fully at fault in that instance.

  **Marcus:** Right.

  **Elena:** But an exempting condition is when the agent isn't capable of participating in the moral relationship at all. Severe psychosis, infancy, extreme coercion. Pereboom argues that when you trace the causal history of an addict with severe trauma—the genes he didn't pick, the abuse he didn't ask for, the neurochemistry of meth that hijacks the reward system—you aren't looking at an excusing condition. You're looking at something that functions like an exempting condition.

  **Marcus:** But Strawson would say addiction isn't total incapacity. Your brother knows right from wrong. He knows stealing is wrong. He knows lying is wrong. He deliberates. He plans. He's not in a psychotic break when he transfers the money. He's an agent.

  **Elena:** He's an agent whose agency is compromised by a causal chain he didn't initiate. Think about the manipulation argument. If a neurosurgeon implanted a chip in your brother's brain that made him steal money, you wouldn't blame him. You'd blame the surgeon.

  **Marcus:** Sure.

  **Elena:** Pereboom asks: What's the relevant difference between the neurosurgeon and the combination of traumatic childhood events plus genetic predisposition plus the pharmacological impact of meth? None of those were chosen by him. They determined the outcome just as effectively as the chip. If I accept that his actions are the inevitable result of factors beyond his control, my resentment starts to feel like I'm angry at a storm for raining.

  **Marcus:** But you're not angry at a storm. You're angry at a person. And here's where I think the hard-incompatibilist view fails the people who love the addict. If you adopt the objective attitude—which you say you shouldn't, but Pereboom says you should lean into—you stop holding him to the demand for honesty.

  **Elena:** No, I don't. I can demand honesty without believing he *deserves* blame in a backward-looking, retributive sense. I can say, "You cannot live here if you lie," as a forward-looking safety measure, not as a punishment he deserves.

  **Marcus:** But does he feel the difference? When you set that boundary with cold, clinical detachment, does he feel loved? Or does he feel like a project? Strawson's genius was realizing that love *requires* the vulnerability of being hurt. To love someone is to give them the power to wound you. If you insulate yourself with the objective attitude—"Oh, his trauma made him do it, I won't take it personally"—you aren't forgiving him. You're ignoring him.

  **Elena:** That's the guilt trip, Marcus. That I'm ignoring him because I'm not punishing him.

  **Marcus:** It's not a guilt trip. It's an observation. Resentment is a form of hope. It says, "I believe you are capable of better." If you stop resenting him, you're saying, "I don't expect any better from you than I expect from a broken toaster."

  **Elena:** That's a false dichotomy. I can believe he is capable of better without believing he is *ultimately responsible* for being worse. Look, I'm not talking about treating him like a toaster. I'm talking about compassion. When I'm furious, when I'm letting the resentment burn, I'm focused on *my* wound. When I let go of the desert claim—when I accept he couldn't have done otherwise given the causal history—my focus shifts to *his* suffering.

  **Marcus:** But at what cost to you?

  **Elena:** At the cost of my ego, maybe.

  **Marcus:** No, at the cost of your moral standing. If you let him walk all over you and you refuse to hold the reactive attitude, you become a doormat. Strawson argues that reactive attitudes are constitutive of human relationships. You can't opt out. You can try to suppress them, but they're like holding a beach ball underwater.

  **Elena:** But what if the suppression is the ethical thing to do? Pereboom suggests we can replace blame with a form of moral sorrow. I can be sad that he did this. I can be sad that the causal forces aligned this way. I can work to change the future causes—get him into treatment, protect Mom's finances—without needing to satisfy a backward-looking urge for him to *suffer* for what he did.

  **Marcus:** But does that work in the trenches? Two weeks ago, he stole from your mom. If you sit there with "moral sorrow," does that protect your mom? Or does resentment provide the energy to say "No more"?

  **Elena:** Resentment provides energy, sure. But it also provides noise. It makes me want to hurt him back. It makes me want to scream. And when I scream, he shuts down. He uses more. So the resentment, this "feature of the relationship" you're defending, it's actually destroying the relationship.

  **Marcus:** That's bad resentment. That's malice. Strawson isn't defending malice. He's defending the *demand*. You can express the demand without cruelty. "I am furious with you because you lied to me, and that matters to me." That communicates that he matters to you.

  **Elena:** Or it communicates that my peace of mind depends on his behavior.

  **Marcus:** In a family, our peace of mind *does* depend on each other's behavior. That's what interdependence is.

  **Elena:** (Sighs, rubbing her temples) I keep thinking about the exemption point. Strawson says we only take the objective attitude toward those who are psychologically abnormal. But if determinism is true, *everyone* is psychologically determined. So why is my brother exempted only when the cause is trauma, but not when the cause is just... normal brain chemistry?

  **Marcus:** Because normal brain chemistry includes the capacity for reason-responsiveness.

  **Elena:** Does it? Or do we just assume it does because we haven't traced the causes back far enough? If I knew every neuron firing in his brain when he stole that money, would there be any room left for "choice"?

  **Marcus:** Maybe not. But we don't live in that view. We live in the participant stance. We can't help it. Even you, Elena. You're angry. You're here talking to me about it. If you truly believed he was exempt, truly believed he was like a force of nature, you wouldn't be angry. You'd just be sad. The fact that you're wrestling with this proves Strawson right. You *want* to hold him responsible. Because you want him back.

  **Elena:** I want *him* back. I don't want the addiction back. But maybe the only way to get him back is to stop treating the addiction as a moral failing. If I view his relapse as a moral failure, he has to hide it. If I view it as a medical/causal failure, he might tell me.

  **Marcus:** And if he tells you he stole the money, and you say, "Oh, well, causal forces," and you hug him... does he learn that stealing is okay?

  **Elena:** No. He learns that I'm not going to abandon him when he fails. And maybe that's the only safety net strong enough to catch him. Strawson says the objective attitude is dehumanizing. I think the retributive attitude is dehumanizing. It reduces him to his worst action.

  **Marcus:** It reduces him to his agency. Which is the only part of him that can save him.

  **Elena:** (Quietly) What if he doesn't have that agency? Not right now. What if the trauma took it?

  **Marcus:** Then he needs help to get it back. But you can't give it to him by pretending it doesn't exist. You have to demand it.

  **Elena:** I know. I just... I'm tired of the demand. I'm tired of carrying the weight of his choices for him. Pereboom offers a way to put that weight down. Strawson says if I put it down, I drop the person too.

  **Marcus:** Maybe. Or maybe you just change how you carry it.

  **Elena:** How?

  **Marcus:** I don't know. That's where Dana and I stop texting, too.

  *(Silence settles between them. The clock on the wall ticks.)*

  **Elena:** He's coming over Sunday. Mom wants to confront him.

  **Marcus:** Are you going to be angry?

  **Elena:** I don't know. I feel like if I am, I'm complicit in a system that's already crushed him. But if I'm not, I'm complicit in letting him crush her.

  **Marcus:** Strawson would say you don't have a choice. You're a participant. You'll feel what you feel. The philosophy doesn't change the chemistry of your anger.

  **Elena:** No. But maybe it changes what I do with it.

  **Marcus:** Maybe.

  *(Elena picks up her wine glass, stares into the dark liquid, and takes a sip. Marcus leans back, watching her, neither conceding nor pressing further.)*
