          *   Critique of Carnap/Hirsch: Quantifier variance lets us talk past each other, but there is a *best* language for describing the world's structure.
          *   Lewisian Naturalness: Properties (and logical operators) vary in how well they "carve nature at the joints."
          *   Reference Magnetism: Meanings are fixed not just by use but by eligibility (naturalness). The most natural meaning wins if use is roughly compatible.
          *   Ontologese: A privileged language where the quantifier carves at the joints. Questions asked in Ontologese are substantive.
          *   Goal: Save ontology from deflationism by grounding it in metaphysical structure, not just linguistic convention.

