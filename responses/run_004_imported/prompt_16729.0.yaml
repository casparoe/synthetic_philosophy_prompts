      *   *Key Lockean Concept:* Virtue is not the *absence* of desire, but the *power to suspend* desire and let reason judge the true good.
      *   *The "Sweetmeat" Problem:* It reinforces *immediate* sensory appetite. It teaches the child to follow the strongest present uneasiness. It doesn't engage reason or the long-term view.
