      *   *Mapping Habits:*
          *   Diagnosing failure = SE (implicitly appealing to a normative standard of health/design).
          *   Explaining operation = CR (analyzing the causal contribution to the system's capacity).

  5.  **Refining the Tone:**
      *   Ensure I don't talk down. The user knows more physiology than I do. Use their examples (crocodilians, shunts).
