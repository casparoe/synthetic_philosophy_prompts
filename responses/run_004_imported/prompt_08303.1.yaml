      *   *Check:* Did I answer the specific question about Amundson & Lauder? *Adjustment:* Make sure to distinguish between "theory of function" and "method of investigation."
      *   *Check:* The closing mapping. Is diagnosing failure really SE? If I measure pressure and it's low, that's CR. But calling it "stenosis" (a pathology) implies it *should* be higher. That "should" is SE. I need to make that distinction clear.

  7.  **Final Polish:** Check flow and ensure the transition between sections is smooth. (Proceed to generate output based on these thoughts.)

