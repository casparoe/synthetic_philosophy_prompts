answer: |-
  It is a privilege to engage with someone who has spent four decades interrogating the vertebrate heart. You have operated at the very interface where these philosophical distinctions become tangible: the transition from the single-circuit pump of the fish to the double-circuit system of the mammal, with the crocodilian shunt offering that tantalizing, complex intermediate. Your intuition that the "daylight" between the etiological (selected-effects, or SE) and causal-role (CR) accounts is best measured in hard cases rather than slogans is precisely correct. In the abstract, the definitions are clean; in the lab or the clinic, they blur.

  Let us work through your three test cases to see where the friction lies.

  ### 1. Malfunction and the Stenotic Valve

  You are right that the causal-role account is routinely criticized for its handling of malfunction. On a strict Cummins-style reading, the function of a trait is its contribution to the capacity of the containing system. If you analyze the capacity "circulate blood," and you examine a token heart with a stenotic valve, that valve *fails* to contribute to the capacity. In fact, it hinders it. A naive CR reading suggests the stenotic valve has the function of *impeding* flow, or perhaps no function at all. This violates the physiological intuition that the valve's function is still to regulate unidirectional flow, it is simply doing so poorly.

  Proponents of CR often rescue this by shifting from the *token* (this specific heart) to the *type* (the valve in a standard physiological model). They argue the function is what a valve of that type *typically* contributes in a system of that type. But this move smuggles in a normative standard that CR struggles to justify on its own terms. Why is the "typical" contribution the "correct" one?

  The etiological account (SE) seems to handle this effortlessly. The function of the valve is what it was selected for in the lineage's history. Because ancestors with valves that regulated flow survived better, the function is flow regulation. A stenotic valve is malfunctioning precisely because it is failing to perform its selected effect. The normativity is built into the history.

  However, your worry about the "just-so story" is the critical counterweight. To apply the SE account, you must establish the selection history. In comparative physiology, we often infer function from structure before we have a robust phylogeny or evidence of selection pressure. If I claim the foramen of Panizza in a crocodile functions to shunt blood during diving, the SE theorist asks: "Was it *selected* for diving, or is it a structural consequence of the aortic arches separating?" If we cannot distinguish adaptation from exaptation or spandrel, the SE account leaves us agnostic about function, whereas the CR account allows us to say, "It contributes to diving capacity," regardless of history.

  So, does SE genuinely do better? Ontologically, yes: it explains *why* we call it a malfunction rather than just a different state. Epistemically, however, it burdens the physiologist with historical facts that are often harder to secure than hemodynamic measurements. The CR view relocates the problem from "unknown history" to "arbitrary normalization," while the SE view relocates it from "arbitrary normalization" to "unknown history."

  ### 2. Vestigial and Co-opted Structures

  Here, as you suspect, the wedge is widest. These cases do not just stress the theories; they force them to give contradictory answers.

  Consider the pelvic spurs in a python. They contribute causally to anchoring during mating (a CR function). But if they are truly vestigial remnants of hind limbs, their *selected effect* (SE function) was locomotion in a tetrapod ancestor, a capacity they no longer serve. The SE account must say their current function is either "locomotion" (which they don't do) or "nothing" (they are vestigial). The CR account says their function is "anchoring."

  Now consider co-option (exaptation). Think of the vertebrate lung, which likely arose from a buoyancy organ in ancestral fish.
  *   **CR:** The function of the swim bladder in a modern fish is buoyancy control. The function of the lung in a mammal is gas exchange. This tracks current utility perfectly.
  *   **SE:** The SE account distinguishes between the *original* selected effect and the *current* selected effect. If selection has shifted, the function has shifted. But during the transition period, or in cases where a trait is used but not yet selected for the new use (a "hopeful monster" scenario), SE and CR diverge.

  The decisive difference is that SE preserves the distinction between *function* and *use*. A stone can be used to crack a nut, but it does not have the function of nut-cracking unless it was designed or selected for that. In biology, a heart shunt can be *used* to bypass the lungs during a dive, but the SE theorist insists we only call it a "function" if the shunt's persistence in the population is explained by that utility.

  For a comparative morphologist, this is not merely semantic. If you treat current utility as function (CR), you risk adaptationism—assuming every current utility explains the trait's existence. If you treat selected effect as function (SE), you risk missing the physiological reality of how the animal actually survives *now*. These cases suggest the two accounts are not competing definitions of the same thing, but definitions of *different* things.

  ### 3. The Amundson and Lauder Argument

  Your memory serves you well. In their 1994 paper, Amundson and Lauder argued that functional morphology in practice relies on causal-role concepts. Their point was methodological: we can measure the causal contribution of a fin to swimming stability without knowing the evolutionary history of that fin. To demand an etiological account before assigning function would paralyze research.

  Does this count against the etiological account as a general theory? I argue no, but it does count against using it as a *heuristic for discovery*.

  Think of it like this: SE might tell us what function *is* (ontology), but CR tells us how to *find* it (epistemology). We observe the causal role first ("this valve prevents backflow"). We then hypothesize that this causal role is the reason the valve exists (SE). If we reverse this—if we assume the SE first—we fall into the adaptationist program criticized by Gould and Lewontin. We assume the valve exists *for* backflow prevention and ignore that it might be a structural necessity of muscle attachment.

  So, the Amundson and Lauder point does not refute SE as a theory of what biological functions *are*; it refutes SE as a rule for how to *conduct* physiology. It suggests that CR is epistemically prior, even if SE is biologically fundamental.

  ### Considered Judgment

  Should one notion be treated as fundamental? The literature has trended toward a "pluralistic realism." Biology genuinely needs both concepts because they answer different explanatory questions.

  1.  **Causal-Role Function** answers: "How does this trait contribute to the capacity of this system?" It is the language of mechanics, engineering, and immediate survival. It is ahistorical and systemic.
  2.  **Etiological Function** answers: "Why is this trait here rather than some alternative?" It is the language of evolution, design, and normativity. It is historical and population-based.

  To reduce one to the other is to lose explanatory power. If you reduce SE to CR, you cannot explain malfunction (everything just does what it does). If you reduce CR to SE, you cannot explain the utility of novel traits or vestiges before selection has acted on them.

  **Mapping Your Habits**

  You asked which of your two habits was quietly etiological and which was causal-role.

  **1. Diagnosing a heart that is failing:**
  This was quietly **Etiological (SE)** thinking.
  When you diagnose a stenotic valve as "failing," you are not merely describing its causal contribution (which you can measure objectively as reduced flow). You are making a normative judgment that it is *not doing what it is supposed to do*. Where does that "supposed to" come from? It comes from the evolutionary history of the vertebrate heart. You are comparing the token heart against the historical standard of the type. Without the SE notion, "failure" is just "variation." The concept of pathology relies on the etiological norm.

  **2. Explaining a heart that is currently working well:**
  This was quietly **Causal-Role (CR)** thinking.
  When you explain how the crocodilian heart manages shunts during a dive, you are tracing the causal contributions of chambers, valves, and pressures to the capacity of the organism to remain submerged. You are analyzing the system's mechanics. While you might assume these mechanisms were selected for, your explanation of *how they work* relies on their current causal contribution to the system's capacity, not their history. You are acting as an engineer analyzing a pump, not a historian analyzing a lineage.

  **Summary**
  You spent forty years as a physiologist oscillating between these two modes without needing to name them. When you asked "How does this pump work?" you were a Cummins-style causal-role analyst. When you asked "Why is this pump broken?" or "Why is this pump designed this way compared to a fish?" you were a Wright-style etiological theorist. The dispute in philosophy of biology arises not because one side is wrong, but because each side tries to claim exclusive rights to the word "function," while your career demonstrates that the science requires both.
