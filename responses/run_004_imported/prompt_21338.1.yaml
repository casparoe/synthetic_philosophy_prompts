      *   *What about the training data?* The humans who wrote the data triangulated. The LLM inherits the *shadow* of triangulation. This is a useful literary angle. The AI is a "ghost in the machine" made of human triangulations frozen in time.
      *   *Principle of Charity:* Davidson says Charity is constitutive of meaning. If we *can't* make sense of it, it doesn't have meaning. But we *can* make sense of LLMs. Does that mean they have meaning?
