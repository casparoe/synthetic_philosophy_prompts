      *Let's look at Circumstantial vs Resultant.* Circumstantial is deeper than Resultant. Resultant is about what happens *after* the choice. Circumstantial is about what choices are *available*. Circumstantial is more corrosive than Resultant.
      *So:* Causal > Constitutive > Circumstantial > Resultant.

