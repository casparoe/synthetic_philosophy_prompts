      *   **Goal:** Walk through the implications of taking the analogy seriously. Don't give a verdict (legitimate vs. illegitimate), but explore what follows for assessing legitimacy if we acknowledge this structural difference.
      *   **Scope:** Focus on the core theoretical case (Germany 79(3)), set aside comparative cases like India for now.

  2.  **Deconstruct the Core Tension:**
