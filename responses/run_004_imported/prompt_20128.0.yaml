answer: |-
  Silas worked in Reclamation, Sector 4, which was a polite way of saying he managed the wet waste of the orbital habitat. When a citizen reached the end of their cycle, their biomass was returned to the hydroponics bay to grow the next generation of algae bricks. It was efficient, necessary, and Silas hated it. Not the work—the inevitability. His own conversion ticket was stamped for next Tuesday. He had a tumor in his pancreas, small but diligent, and the medical AI had decided repair was less efficient than recycling.

  He spent his shifts watching the grinders hum, wondering if consciousness lingered in the slurry. It was a stupid thought. Consciousness was software; the body was hardware. When you scrapped the hardware, the software crashed. That was the doctrine. But Silas felt a provincial dread, a stubborn refusal to believe that the view from the grinder was the only view available.

  On Thursday, during intake, the scanner flagged an anomaly. A human skull, calcified, pre-Habitat era, likely from the Earth evacuation rushes centuries ago. It had slipped through the historical archive screening and ended up on his conveyor belt. Protocol demanded he log it and send it to Museum Storage. Instead, Silas pocketed it. It fit neatly into his bag, heavy and cool, like a dense knot of forgotten gravity.

  That night, his back seized up. The burden of living, he thought bitterly. Carrying this meat-suit around for forty years had worn the bearings down. He sat on the floor of his quarters, the skull resting on his knee.

  "Well?" Silas said. He felt ridiculous talking to bone. "Was it worth it? The breathing, the eating, the panic?"

  The skull offered no answer. It had no eyes to roll, which Silas appreciated. It just was.

  His neck throbbed. He needed to sleep, but the bed felt too soft, too much like a trap. He lay on the floor mat, shoved his uniform jacket into a roll, and placed the skull underneath his neck as a pillow. It was hard, unyielding, and strangely supportive. It held his head up without asking anything in return. Silas drifted off, the bone cooling against his skin, listening to the hum of the air recyclers.

  In the dream, the habitat was gone. There was only a vast, dark plain, and the skull was there, floating at eye level. But it had a voice, not spoken, but vibrating in Silas's chest.

  "You're heavy," the skull said.

  "I'm dying," Silas replied. In the dream, this wasn't sad. It was just a status report.

  "You're tired," the skull corrected. "You carry yourself like you own the place. Like you're a king who lost his crown. Let me tell you about kings."

  The dream shifted. Silas saw a man on a throne, surrounded by sycophants. The man looked exhausted. His eyes were red, his shoulders hunched. He was signing decrees that sent people to die, eating food that tasted like ash, worrying about assassins in the ventilation shafts.

  "Is that me?" Silas asked.

  "That's the living," the skull said. "You think death is a deprivation. You look at us like we're missing a party. But have you ever tried ruling a kingdom? Have you ever tried keeping a body upright against gravity for eighty years? No taxes down here. No seasons. No back pain. We sleep without dreaming. It's better than being a king. It's better than being alive."

  "But I disappear," Silas said. "I become... slurry."

  "You become available," the skull said. "You think you are a fixed thing. A statue. But you're water. You're just frozen right now. Thawing out isn't destruction. It's relief."

  The skull drifted closer. "When the Great Clod loads you with a body, it wears you out. It eases you in age. It rests you in death. Why are you fighting the rest? If your left arm turned into a rooster, would you cry? Or would you use it to crow at the dawn? If your spine became a wheel and your spirit a horse, would you mourn your legs? Or would you finally ride somewhere without buying a ticket?"

  Silas woke up on the floor. The skull was still under his neck. The morning light filtered through the hydroponic glass above, green and watery. His back didn't hurt. Or maybe it did, but he didn't care to check.

  He went to work early. The intake belt was running, chewing through the latest batch of organic matter. Silas took the skull out of his bag. He held it over the hopper.

  "Ready?" he asked.

  He didn't wait for an answer. He dropped it in. The grinder whined, a high-pitched mechanical shriek, and then the sound was gone, integrated into the hum of the machine.

  His supervisor, Mara, walked by with a datapad. "You look cheerful, Silas. For a guy with a Tuesday appointment."

  "Just thinking about the efficiency metrics," Silas said.

  "Oh?"

  "Yeah. If my liver becomes nutrient paste for the algae, and the algae feeds the crew, and the crew builds more recyclers... I'm basically going to be part of the machinery."

  Mara frowned. "That's a grim way to put it."

  "Not grim. Useful." Silas leaned against the railing, watching the slurry flow into the vats. "If my ribs turn into support struts for the greenhouse, I'll finally hold something up properly. If my eyes become lenses for the growth lamps, I'll get to watch things grow instead of watching them die."

  "You're weird, Silas."

  "I'm provincial," he said. "I was looking at the wrong end of the telescope."

  He didn't feel saved. The tumor was still there, a small, hard fact in his gut. He would still cease to be Silas-the-Administrator on Tuesday. But the dread had evaporated, replaced by a curious, idle speculation. He wondered what he would be first. A tomato? A pipe? A patch of moss on the outer hull?

  It didn't matter. The Great Load was putting him down. He was done carrying the weight.

  "Hey, Mara," Silas said, pushing off the railing. "If I come back as a rooster, don't be alarmed when I crow at shift change."

  Mara laughed, a short, sharp sound, and walked away. Silas turned back to the machines. They weren't grinding things up anymore. They were just changing the shape of the water. He hummed a tune, off-key, and went to log the intake. There was still work to do before the rest began.
