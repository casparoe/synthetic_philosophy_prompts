answer: |-
  This is a classic quals sticking point. The frustration is warranted: on the surface, both finks and masks look like "things that make the conditional false when the disposition is true" (or vice versa). The literature often defines them by their *effect* on the conditional analysis rather than their *metaphysical structure*, which leaves you with the feeling that the distinction is ad hoc.

  Your specific hangup is the killer: *"Isn't the antidote case just as much a story about some relevant intrinsic feature failing to stick around?"*

  The short answer is **no**. In the mask case, the intrinsic feature *does* stick around; it just gets blocked. In the fink case, the intrinsic feature *does not* stick around (or wasn't there to begin with). Lewis's fix works on finks because it forces us to imagine a world where the basis *does* stick around. It fails on masks because in the mask world, the basis *already* sticks around, yet the manifestation still fails.

  To make this click, let's ditch the wires and poison. Let's use a **Garage Door Opener**.

  ### The Setup
  *   **Object:** A motorized garage door.
  *   **Disposition ($D$):** "Opens when the remote button is pressed."
  *   **Stimulus ($S$):** Signal received from remote.
  *   **Manifestation ($M$):** Door moves up.
  *   **Causal Basis ($B$):** The motor is engaged and the drive sprocket is connected to the door arm. (This is an intrinsic mechanical state of the opener system).

  Now, let's construct two cases where the Simple Conditional Analysis ($S \rightarrow M$) gives the wrong verdict, but for structurally different reasons.

  ---

  ### Case 1: The "Security Mode" (The Fink)
  **Scenario:** The garage door is currently in "Vacation Mode." The motor is electronically disconnected from the sprocket to prevent unauthorized opening. There is **no disposition** to open right now.
  However, the system has a "panic override." If it receives a specific high-priority signal ($S$), it instantly engages the motor ($B$ appears) and opens the door ($M$).

  *   **SCA Verdict:** "If pressed, it would open." **True.** (So SCA says it *is* disposed).
  *   **Intuition:** **False.** It isn't disposed *now*; the stimulus *creates* the disposition.
  *   **Causal Story:** The stimulus *triggers the existence* of the basis. $S \rightarrow \text{creation of } B \rightarrow M$.

  **Lewis's Reformed Analysis (RCA):**
  $x$ is $D$ iff $x$ has $B$ now, and if $x$ were $S$ and **$B$ persisted**, $x$ would $M$.

  *   **Test:** Does it have $B$ now? **No.** (Motor is disconnected).
  *   **Counterfactual:** "If pressed and the motor *stayed* disconnected (persisted in its actual state)..."
  *   **Result:** The door does not open.
  *   **RCA Verdict:** **Not Disposed.**
  *   **Why it works:** Lewis's clause "and $B$ persisted" effectively disables the finkish mechanism. It asks: "If the stimulus happened *without* the magic repair/connection, would it work?" Since the basis wasn't there to persist, the conditional fails, matching our intuition that the door wasn't disposed.

  ---

  ### Case 2: The "Frozen Track" (The Mask)
  **Scenario:** The garage door is in normal working order. The motor is engaged ($B$ is present). It **is disposed** to open.
  However, a thick block of ice has formed in the tracks overnight (extrinsic interferer). If you press the remote ($S$), the motor hums, the sprocket turns ($B$ operates), but the door cannot move ($M$ fails).

  *   **SCA Verdict:** "If pressed, it would open." **False.** (So SCA says it is *not* disposed).
  *   **Intuition:** **True.** The opener is working fine; it's just masked by the ice.
  *   **Causal Story:** The basis exists and operates, but the *causal pathway* to the manifestation is intercepted. $B + S \rightarrow \text{Process Started} \rightarrow \text{Blocked by Ice} \rightarrow \text{No } M$.

  **Lewis's Reformed Analysis (RCA):**
  $x$ is $D$ iff $x$ has $B$ now, and if $x$ were $S$ and **$B$ persisted**, $x$ would $M$.

  *   **Test:** Does it have $B$ now? **Yes.** (Motor engaged).
  *   **Counterfactual:** "If pressed and the motor connection *persisted*..."
  *   **Result:** The motor connection *does* persist! The ice doesn't disconnect the motor; it just blocks the door. So in the closest world where $S$ happens and $B$ persists, the ice is *still there*. The door still doesn't open.
  *   **RCA Verdict:** **Not Disposed.**
  *   **Why it fails:** Lewis's fix only protects the *basis* from being removed by the stimulus. It does not protect the *manifestation* from being blocked by external factors (masks) that are independent of the stimulus.

  ---

  ### Addressing Your Hangup
  You asked: *"Isn't the antidote case just as much a story about some relevant intrinsic feature failing to stick around?"*

  Looking at the Garage Door cases, we can see why the answer is **no**.

  1.  **In the Fink (Security Mode):** The relevant intrinsic feature (the motor connection) **does not stick around**. In fact, it isn't even there to start with. The stimulus *changes the intrinsic state* of the object from "disconnected" to "connected." The causal basis is *finkishly absent* (or finkishly present).
  2.  **In the Mask (Frozen Track):** The relevant intrinsic feature (the motor connection) **does stick around**. The motor stays engaged. The sprocket turns. The intrinsic power is fully active. The failure happens *downstream*, in the extrinsic environment (the ice).

  **The Poison/Antidote Analogy:**
  *   **Poison (Mask):** The poison's intrinsic feature is its molecular structure that binds to liver receptors. When ingested ($S$), that structure **persists**. It binds to receptors. The antidote doesn't make the poison's structure vanish; it occupies the receptors *first* or neutralizes the *effect* of the binding. The intrinsic causal power fires, but the *result* is blocked.
  *   **Electro-fink (Fink):** The wire's intrinsic feature is conductivity. When touched ($S$), the conductivity **vanishes** (or appears). The intrinsic causal power itself is swapped out by the stimulus.

  ### Why Lewis's Fix is "Fatal to Finks, Toothless against Masks"
  Lewis's move is to hold the **Intrinsic Basis** fixed across the possible worlds in the counterfactual.

  *   **Against Finks:** Finks work by *changing* the intrinsic basis upon stimulus. By stipulating "and the basis persists," Lewis forces us to evaluate the conditional in a world where the finkish mechanism *doesn't trigger the change*. In that world, the finkish object behaves like a broken object. So the conditional comes out False, and we correctly deny the disposition.
  *   **Against Masks:** Masks work by *leaving* the intrinsic basis alone but blocking the outcome. By stipulating "and the basis persists," Lewis forces us to evaluate the conditional in a world where... the basis persists. Which is exactly what happens in the mask case! The mask is still there, the basis is still there, the manifestation still fails. So the conditional comes out False, and we *incorrectly* deny the disposition.

  ### Summary for the Quals
  If you need to articulate this in an exam, use the **Causal Chain** distinction:
  *   **Finks** interfere with the **possession** of the causal basis (the basis is added/removed *by* the stimulus).
  *   **Masks** interfere with the **operation** of the causal basis (the basis is present and active, but the *effect* is blocked).

  Lewis's RCA requires the basis to be held fixed. This neutralizes Finks (because they rely on the basis *not* being fixed) but cannot neutralize Masks (because Masks are compatible with the basis being fixed).

  Does the garage door example help settle the intuition? The "Security Mode" changes the machine's internal state (Fink); the "Frozen Track" leaves the machine alone but stops the output (Mask).
