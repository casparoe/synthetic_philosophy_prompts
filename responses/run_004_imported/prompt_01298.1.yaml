      *   *Why does it fail?* It fails because logical consequence is monotonic and explosive in a specific way when dealing with false theories.
      *   *The Key Insight:* If a theory is false, it gets the "big picture" wrong. If it gets the big picture wrong, adding *any* true statement to it tends to drag along new false statements, or conversely, removing false statements tends to cut away true ones.
      *   *Analogy Time:* Imagine a net catching fish (truths) and trash (falsehoods).
