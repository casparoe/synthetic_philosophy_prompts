          1.  A has *more* truth content than B, AND
          2.  A has *no more* falsity content than B.
          *   (Or vice versa: same truth content, less falsity content).
      *   Crucially, "content" here means the set of *logical consequences*.
      *   If a theory is false, it entails some true statements and some false statements.

