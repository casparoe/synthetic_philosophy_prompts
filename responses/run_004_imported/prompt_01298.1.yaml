      *   *Gut-Level Explanation:* It's about the *dependency* of truths on falsehoods in a false theory. If a theory is fundamentally false, its "true consequences" are often accidental byproducts of its false core. You can't increase the true consequences without increasing the false consequences proportionally, because logical consequence doesn't distinguish between "relevant" truth and "accidental" truth.
