answer: |-
  Here is a joke drafted for a dinner party audience that knows the terrain. It relies on the "invoice" metaphor to highlight the cost of the regress, contrasting Bradley's monism and Frege's unsaturatedness against Russell's predicament.

  ***

  Three philosophers walk into a restaurant to order a fact. They want "John loves Mary."

  The waiter brings out three plates: one labeled **John**, one labeled **Mary**, and one labeled **Loves**.

  The first philosopher says, "Wait, this is just a list. How do we know they're connected? We need a relation to tie 'Loves' to 'John'."

  The waiter brings a small connector.

  "But what connects the connector to 'John'?" asks the philosopher.

  The waiter brings a smaller connector.

  "And what connects *that* one?"

  The waiter sighs and calls over the managers.

  **Mr. Bradley** steps up first. "Look, stop asking for connectors. There are no separate plates. You aren't eating John or Mary; you're eating the Whole Universe. It's one big casserole. No itemized bill."

  **Mr. Frege** steps up next. "No, the 'Loves' plate is special. It's *unsaturated*. It has a hole in it shaped exactly like John. It snaps right on. You don't pay for the connection; it comes with the verb."

  **Mr. Russell** steps up last. "I've mapped the genealogy of the connectors, and the logic is sound, but..."

  "But what?"

  "I'm still waiting for the waiter to bring the connector for the first connector. Until then, I can't verify the check."

  So Bradley pays for everything by claiming he owns the restaurant, Frege eats for free because the meal was incomplete without him, and Russell is still in the parking lot trying to prove the menu exists.
