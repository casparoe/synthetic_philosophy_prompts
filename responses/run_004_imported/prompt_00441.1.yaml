      *   *The Crucial Distinction:* *Evaluation* vs. *Meaning*.
          *   Frequentism says: "70%" *means* "In the long run, 70%."
          *   Bayesianism says: "70%" *means* "I am 70% confident." *But* I should aim to be calibrated so my confidence matches reality.
