answer: |-
  This is a fantastic dilemma because it sits exactly at the intersection of philosophy of language, user experience (UX) design, and content strategy. You aren't just writing directions; you are defining the relationship of trust between your product and the user.

  Your friends have inadvertently reenacted a debate that has occupied linguists and philosophers for the last century. Here is the move-by-move breakdown of who has the better of the argument, followed by the "real answer" for your job.

  ### The Move-by-Move Breakdown

  **Move 1: Maya's Opening Salvo**
  *   **Claim:** The instruction is "flat out false." An app doesn't get to dodge being right or wrong.
  *   **Analysis:** Maya is arguing from the standpoint of **Semantic Correspondence**. A statement is true if it corresponds to reality. There is no Shell station; therefore, the statement referencing it does not correspond to reality.
  *   **Winner:** **Maya.** Strictly speaking, she is right. If a map says "Bridge Out" and the bridge is there, the map is wrong. If it says "Shell Station" and there is an empty lot, the map is factually incorrect. In a legal or data integrity context, Maya wins this round.

  **Move 2: Deshawn's Pushback**
  *   **Claim:** It's not a lie; nobody thought the app was wrong, and you got there fine. "Just false" doesn't capture it.
  *   **Analysis:** Deshawn is arguing from **Pragmatics** (specifically Gricean Cooperation). He is focusing on the *success condition* of the speech act rather than the *truth condition*. Did the communication achieve its goal? Yes. Therefore, labeling it "false" feels like a category error.
  *   **Winner:** **Deshawn (with caveats).** He is right about the *experience*. In the moment, the instruction worked. However, he is conflating "successful navigation" with "accurate data." You can successfully navigate based on bad data (luck or redundancy), but the data remains bad.

  **Move 3: Maya's Analogy (The File Size)**
  *   **Claim:** If you let the app off the hook here, you have to stop calling "12MB" false when it's 11.9MB.
  *   **Analysis:** Maya is testing for **Consistency**. She is trying to establish a boundary between "acceptable approximation" and "factual error."
  *   **Winner:** **Maya.** This is Deshawn's weak point. Rounding 11.9 to 12 is a *conventional implicature*—users understand and accept rounding as a standard convention of digital storage. Referencing a business that has been closed for a year is not a convention; it is data decay. Maya is right that treating them the same sets a dangerous precedent for data quality.

  **Move 4: Deshawn's Pivot (Presupposition)**
  *   **Claim:** Maybe it's not false; maybe it "doesn't even get far enough to be false" because it assumed something that wasn't true.
  *   **Analysis:** Deshawn has stumbled onto a specific philosophical concept called **Presupposition Failure** (associated with philosopher P.F. Strawson). The sentence "Turn at the Shell station" presupposes "There is a Shell station." If the presupposition fails, Strawson argues the sentence has no truth value (it's neither true nor false).
  *   **Winner:** **Draw (Philosophically Deshawn, Practically Maya).** Deshawn is philosophically sophisticated here. He is describing a "truth-value gap." However, Maya is right to call it "dodging" in a product context. Users do not care about truth-value gaps. To a user, a broken presupposition feels exactly like a lie.

  ### The Fault Line: Is there a real answer?

  **Yes, they have wandered directly into a fault line.**

  This is the classic debate between **Bertrand Russell** and **P.F. Strawson**.
  *   **Russell (Maya's side):** Definite descriptions (like "The Shell Station") assert existence. If the thing doesn't exist, the statement is **False**.
  *   **Strawson (Deshawn's side):** Definite descriptions presuppose existence. If the thing doesn't exist, the statement is **Neither True Nor False**.

  Linguists and philosophers *still* argue about this. There is no consensus in the academic world.

  **However, for your job, there is a consensus.**

  In Content Strategy and UX, **Maya is the one you need to listen to.** Here is why:

  1.  **Trust is Cumulative:** Deshawn is right that *this specific time*, you got to the destination. But maps apps rely on long-term trust. If the app says "Shell Station" today, and "Texaco" next month (when that closes), and "The Blue House" the month after (when it gets painted red), the user learns that the landmarks are unreliable. Eventually, they will stop looking at the landmarks and rely solely on the arrow. When the GPS signal drops or the arrow lags, they will be lost.
  2.  **The "12MB" Problem:** Maya's analogy is the killer argument for your guidance. If you classify "Closed Business" as "Functionally True," you erode the standard for data integrity. You create a culture where "good enough" overrides "accurate."
  3.  **Liability and Accessibility:** For a user with cognitive impairments, or in a high-stress environment, "Turn at the empty lot that used to be a Shell" adds cognitive load. It forces the user to verify the data ("Wait, is that the Shell? No, it's closed. Okay, I guess I turn here."). That friction is a design failure.

  ### Recommendation for Your Company Guidance

  You should not frame this guidance around "Truth" vs. "Falsehood." That leads to Maya and Deshawn's stalemate. Frame it around **Permanence and Verification.**

  Here is how you can resolve this for your team:

  **1. The Hierarchy of Landmarks**
  Create a tiered system for landmarks in your instructions.
  *   **Tier 1 (Permanent):** Natural features (River, Mountain), Public Infrastructure (City Hall, Main Post Office, School). *Preferred.*
  *   **Tier 2 (Semi-Permanent):** Major chains with long leases, distinct architecture. *Acceptable with verification.*
  *   **Tier 3 (Volatile):** Small businesses, gas stations, restaurants. *Avoid unless no other option exists.*

  **2. The "Empty Lot" Rule**
  Adopt a policy that references must be **visually verifiable in the present tense.**
  *   *Bad:* "Turn at the Shell." (Requires knowledge of the past).
  *   *Good:* "Turn at the gas station." (Requires only visual confirmation of the present).
  *   *Better:* "Turn right after the traffic light." (Infrastructure).

  **3. Addressing the "False" Question**
  In your guidance, define accuracy not as "Did they turn?" but "Did the description match the environment?"
  *   If the instruction causes the user to pause to reconcile the mismatch, it is a **Content Error**, regardless of whether they turned correctly.

  ### The Verdict

  **Maya wins the argument that matters for your job.**

  Deshawn is right that language is flexible and humans are resilient; we can understand instructions even when they are technically flawed. But you are building a system that scales to millions of users. You cannot rely on user resilience to patch data errors.

  Maya's insistence on factual correspondence protects the product's long-term credibility. Deshawn's focus on immediate functionality protects the product's short-term utility. **Always prioritize long-term credibility in map data.**

  **Your Guidance Draft:**
  > "Instructions must reference features that are currently present and visually verifiable. Referencing businesses that have closed, even if the building remains, creates cognitive friction and erodes trust. If a landmark is volatile (e.g., retail, gas), prioritize street infrastructure or permanent public buildings. A successful turn does not validate an inaccurate description."

  This sidesteps the philosophical "Is it false?" debate and replaces it with a measurable UX metric: "Does this create cognitive friction?"
