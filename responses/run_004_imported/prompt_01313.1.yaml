answer: |-
  You are not overcomplicating this, and you aren't just deflecting (though your roommate isn't entirely wrong that defensiveness is part of the mix). This is a classic conflict between **logical validity** and **moral authority**.

  Here is the principled way to break this down, because both you and your brother are actually right about different things.

  ### 1. The Logical Truth (Where he is right)
  Logically, your brother is correct: **The validity of a statement does not depend on the person saying it.**

  In logic, this is related to the *Tu Quoque* fallacy (appeal to hypocrisy). Just because someone is a hypocrite doesn't make their statement false. If a smoker tells you smoking will kill you, they are a hypocrite, but the medical fact remains true.

  If you are spending too much on delivery apps, that is objectively a drain on your finances regardless of whether your brother is debt-free or $40,000 in debt. His financial mess does not magically make your Pad Thai affordable. If you let his hypocrisy convince you that your spending is fine, you are hurting yourself to punish him.

  ### 2. The Relational Truth (Where you are right)
  Relationally, you are correct: **Credibility is required for unsolicited advice to be received well.**

  While his *logic* is sound, his *standing* is compromised. When someone lectures you on a topic they are actively failing at, it stops feeling like "guidance" and starts feeling like "projection" or dominance.

  *   **Trust:** Financial advice requires trust. By hiding his debt (you found out through your mom), he broke trust.
  *   **Tone:** You said he's been "riding you for months." That suggests nagging, not coaching.
  *   **Audacity:** There is a social contract that says if you are going to preach financial discipline, you should be practicing it. By violating that, he has lost the *right* to be the one who corrects you, even if the correction is accurate.

  So, to answer your specific question: **He is right that his debt is irrelevant to the *math* of your situation, but he is wrong that it is irrelevant to the *conversation*.**

  ### 3. Why this feels so frustrating
  You feel stuck because you are trying to win an argument about **behavior** using an argument about **character**.

  *   **He is arguing behavior:** "You spend too much on apps." (True/False)
  *   **You are arguing character:** "You are a hypocrite." (True/False)

  Both statements can be true simultaneously. He can be a hypocrite *and* you can be overspending. The friction comes because you want him to admit he's a hypocrite before you admit you're overspending, and he wants you to admit you're overspending before you judge his hypocrisy.

  ### 4. How to resolve this (The Principled Approach)
  If you want to stop the annoyance and actually improve your life, you need to decouple the two issues. Here is a strategy:

  **Step 1: Own your part (Disarm him)**
  Your roommate is right that you might be using his debt as a shield. Don't. If you know you spend too much on delivery, acknowledge that to yourself and to him.
  *   *Say this:* "You're right. I do spend too much on delivery. I'm working on a budget to cut that back."
  *   *Why:* This removes his ammunition. He can't lecture you on something you've already admitted and are handling.

  **Step 2: Set the boundary (Reclaim authority)**
  Once you've owned your spending, you can address his lack of standing without attacking his debt directly.
  *   *Say this:* "However, I'm not open to financial lectures right now, especially when we're both figuring things out. I'll handle my apps; you handle your stuff."
  *   *Why:* This asserts that while his *point* was valid, his *role* as your financial advisor is terminated.

  **Step 3: Ignore the $4k**
  Do not bring up his sneakers or watches again unless he brings up your delivery apps. Using his debt as a counter-argument keeps you in a childish "nuh-uh, you're worse" dynamic. It validates his claim that you are "changing the subject."
  *   *The Mindset:* His debt is his business. Your spending is your business. You don't need his permission to fix your habits, and he doesn't need your permission to fix his.

  ### The Verdict
  You aren't inventing a difference between "what is true" and "who says it." That difference is real. **Truth is objective; counsel is relational.**

  He offered bad counsel (hypocritical nagging) that happened to contain a true fact. You can accept the fact without accepting the counsel.

  **Bottom line:** Cut back on the Doordash because *you* want to be better with money, not because *he* told you to. Once you do that, his opinion stops mattering, and his hypocrisy stops bothering you because you're no longer guilty of the thing he's pointing at.
