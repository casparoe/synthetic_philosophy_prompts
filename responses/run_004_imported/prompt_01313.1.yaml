prompt: |-
  So this has been bugging me for like two weeks and I need an outside opinion because everyone I know is too close to it. My older brother has been riding me for months about how much I blow on delivery apps, telling me I'm bad with money and need to grow up. Kind of annoying but probably fair, honestly. Except then last month I found out through our mom (of course) that he's something like $4k deep in credit card debt from buying sneakers and vintage watches he clearly doesn't need. So the next time he brought up my Doordash habit I said "maybe don't lecture me about money when you're the one drowning in debt," and he shot back with "that has nothing to do with whether YOU'RE bad with money, don't change the subject." Now I honestly can't tell if he's got a point or if he's just dodging.

  Like, is he right that his own financial mess is basically irrelevant to whether his criticism of me is valid, since what he's saying could be true regardless of who's saying it? Or does the fact that he's arguably way worse with money than me mean he's kind of given up the right to be the one telling me this, even if he happens to be correct? My roommate thinks I'm just deflecting because I don't want to admit he has a point, and maybe she's right, but it still feels like theres a real difference between "what he's saying is true" and "he's the right person to say it to me," and I can't tell if that difference actually holds up or if its just something I invented so I can keep ordering pad thai in peace. Is there an actual principled way to think about this, or am I overcomplicating a situation where he's just right and I don't want to hear it?
