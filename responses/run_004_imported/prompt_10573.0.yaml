answer: |-
  This is a fascinating application of Anscombe's moral philosophy. While G.E.M. Anscombe died in January 2001, just months before the 9/11 attacks precipitated the era of modern drone warfare, her work provides a rigorous framework for analyzing it.

  To determine what she would conclude about "signature strikes," we have to look at how she defines **intention**, how she applies the **Doctrine of Double Effect (DDE)**, and her absolutist stance on **killing the innocent** found in *Mr. Truman's Degree* and her essay *War and Murder* (1956).

  Here is an analysis of how Anscombe's actual arguments would likely apply to signature strikes.

  ### 1. The Description of the Action (*Intention*)
  In her book *Intention*, Anscombe argues that moral evaluation depends on the "description under which an action is intended." You cannot separate the physical act from the agent's practical knowledge of what they are doing.

  *   **Personality Strikes:** In a targeted killing of a known high-value target (e.g., a specific general), the description of the action is "Kill Combatant X." If civilians die, Anscombe might argue (via DDE) that their death was foreseen but not intended, *provided* every precaution was taken to minimize it.
  *   **Signature Strikes:** Here, the description of the action changes. The operator does not know *who* is in the strike zone. The description becomes: "Kill a group of people exhibiting behavior patterns associated with militants."

  Anscombe would argue that if you do not know the identity of the persons, you do not know if they are combatants. Therefore, you cannot strictly intend to kill "combatants," because that object (the specific combatant status) is unknown to you. Instead, you intend to kill "people matching a profile." Since innocents can match that profile, the intention encompasses the killing of innocents. For Anscombe, if your plan involves killing people who *might* be innocent, and you proceed without resolving that uncertainty, the death of the innocent is not merely a "side effect"; it is part of the accepted plan.

  ### 2. The Collapse of Double Effect
  Anscombe was a defender of the Doctrine of Double Effect, but she was also its strictest gatekeeper. She believed it was frequently misused to justify utilitarian calculations. For DDE to apply, four conditions must be met (roughly):
  1.  The act itself is good or neutral.
  2.  The bad effect is not the means to the good effect.
  3.  The intention is only the good effect.
  4.  There is a proportionate reason.

  Anscombe would likely argue that signature strikes fail on **Condition 3 (Intention)** and potentially **Condition 1 (Nature of the Act)**.

  *   **Recklessness as Intention:** In *Mr. Truman's Degree*, Anscombe argues that Truman intended the death of civilians because their death was the mechanism by which pressure was applied to Japan. In signature strikes, if the intelligence is based on "patterns of life" (e.g., military-age males gathering), the presence of civilians is often statistically probable. Anscombe would argue that proceeding when civilian death is a near-certainty (or highly probable) blurs the line between "foreseen" and "intended." If you pull a trigger knowing there is a 40% chance the targets are shepherds, you have chosen to accept the death of shepherds as part of your operational parameters. For Anscombe, accepting the death of the innocent as a cost of doing business is morally equivalent to intending it.
  *   **Indiscriminate Killing:** In her essay *War and Murder*, Anscombe condemns indiscriminate bombing. She writes that it is unlawful to "attack the innocent." She defines the innocent as those not engaged in unjust aggression. Signature strikes, by definition, lack the discrimination required to verify innocence. If a method of warfare cannot distinguish between the innocent and the guilty *before* the strike, Anscombe would classify the act itself as indiscriminate. An indiscriminate act that kills civilians is not a "double effect" tragedy; it is an intrinsically evil act.

  ### 3. The Absolute Prohibition (*Mr. Truman's Degree*)
  The core of the Truman pamphlet is Anscombe's rejection of consequentialism. She argues that certain actions are **intrinsically evil** and cannot be justified by good outcomes (like "saving lives later" or "national security").

  *   **"Murder" Definition:** Anscombe defines murder broadly as the intentional killing of the innocent. She would ask: *Does the signature strike procedure treat civilian life as inviolable?*
  *   **The Utilitarian Trap:** Proponents of signature strikes often argue they save more lives in the long run by degrading terrorist networks without risking soldiers. Anscombe explicitly rejected this logic regarding Truman. She argued that even if dropping the atomic bomb saved a million lives, it was still murder because it involved the direct killing of innocents.
  *   **Application:** She would likely view the "signature" methodology as a systemic willingness to kill innocents for the sake of security. If the "signature" includes behavior that civilians might engage in (meeting in groups, carrying weapons in a culture where that is common), then the strike protocol effectively authorizes the killing of civilians. For Anscombe, a policy that authorizes the killing of civilians, even probabilistically, violates the absolute prohibition against murder.

  ### 4. Practical Knowledge and Responsibility
  A key concept in *Intention* is "practical knowledge"—knowing what you are doing while you are doing it.

  Anscombe would argue that drone operators and commanders engaging in signature strikes lack the practical knowledge necessary to make a moral judgment. They do not know *who* they are killing. By outsourcing the determination of "combatant status" to an algorithm or a behavioral pattern rather than positive identification, they are willfully ignorant.

  For Anscombe, willful ignorance does not absolve responsibility; it compounds it. If you choose to act without knowing whether your action is murder, you bear the responsibility for murder if it turns out that way. Since signature strikes operate on the premise that "we don't know their names, but we know they are bad," Anscombe would argue this is a fiction that masks the reality: "We don't know if they are bad, but we will kill them anyway."

  ### Conclusion
  Based on her actual texts, Anscombe would almost certainly conclude that **signature strikes constitute the intentional killing of innocents** and that the Doctrine of Double Effect **cannot cover them.**

  Her reasoning would likely follow this trajectory:
  1.  **Indiscrimination:** Signature strikes are inherently indiscriminate because they target based on probability rather than confirmed status.
  2.  **Intention:** By proceeding without positive identification, the death of any innocents present is not a mere "side effect" but an accepted part of the action's description.
  3.  **Absolutism:** No amount of "future safety" or "strategic advantage" can justify the intentional killing of the innocent.

  She would likely view signature strikes as the technological evolution of the area bombing she condemned in WWII: a method of warfare that treats the distinction between combatant and non-combatant as optional rather than absolute. In her view, if you cannot verify they are guilty, you must assume they are innocent, and to kill them is murder.
