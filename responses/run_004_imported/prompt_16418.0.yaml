  **The Moment of Scatter**

  The monitor flatlined, and the patient ceased to exist.

  It wasn't poetic. There was no soul departing, no light fading from the eyes. One second, Elias was pressing his hands into the chest of a man—a unified, singular *object* that hummed with the ontological weight of life—and the next, the hum vanished. The man was gone. In his place lay a collection of carbon and water arranged man-wise, a loose coalition of atoms that no longer bothered to pretend to be a whole.

  "Time of death?" the driver asked. He was leaning against the back wall of the ambulance, gripping the handle of a cabinet that wasn't there. None of it was there. The ambulance, the defibrillator, the oxygen tank—they were all fictions, mere particles arranged useful-wise. Only the living mattered. Only the organisms counted as objects.

  "Not yet," Elias said. He kept compressing.

  This was the horror of the Special Composition Question made flesh. When the biological processes halted, the composition ceased. The *person* wasn't dead; the person was *undefined*. There was no longer a 'him' to save, only a scattered pile of simples that used to be him. Resuscitation wasn't restarting a machine; it was trying to convince a cloud of dust to coalesce back into a statue.

  "El, the protocol says—"

  "Protocol is for things that exist," Elias snapped. He could feel the difference under his palms. When the heart was beating, the chest resisted as a single unit, a cohesive reality. Now, it felt like pushing against a bag of marbles. The ribs moved, but they didn't move *together*. They were just individual bones obeying local physics, no longer bound by the unity of life.

  He grabbed the defibrillator pads. The device was a ghost. It had no causal power of its own, no internal unity to guarantee its function. It worked only because the particles happened to cooperate, habitually. But habits could break. Ghosts could fade.

  "Charging," Elias said. He knew the readout was a lie. There was no number there, only lights arranged number-wise.

  He placed the pads on the scattered atoms of the chest. The skin was cold, not because heat had left, but because the regulatory organism that managed heat was no longer there to enforce the concept of temperature.

  "Clear."

  He pressed the button. The electricity jumped. It was just electrons moving from one arrangement to another. There was no 'shock' as an event, only particles hitting particles.

  For three seconds, nothing. The atoms remained scattered. The void where the man had been yawned wide, a metaphysical silence screaming in the small box of the ambulance. Elias felt the crushing weight of nihilism pressing in. If this didn't work, the man would never come back. You couldn't restore an object that had ceased to be. You could only build a new one from the same parts, and it wouldn't be *him*. It would be a duplicate, a copy arranged similarly.

  Then, a twitch.

  Not a muscle spasm. A snap.

  The hum returned. The scattered atoms suddenly locked into unity. The chest became a chest again, not just ribs and sternum, but a single thing *having* ribs and sternum. The monitor beeped, a sound that now meant something because there was a listener to hear it.

  Elias slumped back against the wall, passing through the fiction of the bench. His hands were shaking. He looked at them—real hands, part of a real organism. He was one of the lucky ones. One of the few things in the universe that actually existed.

  "He's back," the driver said, relief washing over his face.

  "No," Elias whispered, watching the rise and fall of the new-old chest. "He's just composed again."

  He wondered, as the ambulance sped through the city of ghosts, how many times a person could scatter and reform before the arrangement stopped holding. How many deaths could you survive before the universe decided you were just a pile of atoms pretending to be a man?

  He checked his own pulse. Solid. Real. For now.
