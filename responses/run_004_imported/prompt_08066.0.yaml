  Chalmers' two-dimensional semantics earns the top tier by systematically distinguishing epistemic from metaphysical possibility, thereby validating the zombie intuition while respecting the necessity of water identities.
  Kripke's essentialism rigorously explains the water case but forces a dualist conclusion for zombies rather than reconciling the inference for physicalists.
  The phenomenal-concept strategy copes well by preserving physicalism, though it does so by denying the possibility of zombies rather than validating the conceivability inference.
  Yablo's distinction adds nuance to conceivability but remains skeptical about whether either form successfully guarantees metaphysical possibility in these hard cases.
  Williamson's approach deflates the problem by treating modal knowledge as fallible counterfactual reasoning, offering less specific guidance on the divergence between water and zombies.
  Descartes' criterion fails completely on the water case because clear and distinct perception cannot detect necessary a posteriori truths established by modern semantics.
