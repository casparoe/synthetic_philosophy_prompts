answer: |-
  This is a fantastic question, and your friend has spotted a genuine tension that often goes unnoticed in effective altruism circles. However, you are right: the two Ramseys are not contradicting each other. They are operating on different axes of value.

  If Frank Ramsey were alive today to hear Nick Bostrom argue that we should sacrifice significant present resources to reduce existential risk by 0.01% for the sake of $10^{50}$ future lives, he would likely occupy a **weird, nuanced middle ground.** He would be sympathetic to the *ethical foundation* of longtermism (impartiality across time) but deeply hostile to its *cosmic aesthetic* and potentially its *decision-theoretic extremities*.

  Here is the argument for why, based on his actual texts and philosophical commitments.

  ### 1. Resolving the Contradiction: Physical Scale vs. Moral Sum
  Your friend's argument rests on the idea that Ramsey's "Epilogue" rejects scale, while his "Savings" paper embraces it. But Ramsey distinguishes between **physical magnitude** and **moral magnitude**.

  In the *Epilogue* to *The Foundations of Mathematics*, Ramsey writes:
  > *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  When Ramsey rejects the "Cosmic Mood," he is rejecting the idea that physical size, duration, or energy confers value. A galaxy without consciousness is worthless to Ramsey. He is an ethical subjectivist (influenced by G.E. Moore and Wittgenstein); value only exists where there is a mind to experience it.

  In *A Mathematical Theory of Saving*, when he argues against discounting the future, he is not arguing that "time is big so we should care." He is arguing for **impartiality between persons.** If a person in 2400 has the capacity for love and thought, their welfare counts exactly as much as a person in 2024.

  **The Reconciliation:** Ramsey rejects *cosmic* scale (stars, light cones) but accepts *moral* scale (the sum of happy minds). Longtermism, at its best, is about the latter. Therefore, Ramsey would agree that the future matters immensely *if* it contains people. But he would reject the idea that the future matters because it is "vast" in a physical sense.

  ### 2. Why He Would Be Sympathetic (The Ethical Core)
  Ramsey would agree with the foundational axiom of longtermism: **Pure time discounting is ethically indefensible.**

  In his 1928 paper, Ramsey writes that discounting future welfare is *"a practice which is ethically indefensible and arises merely from the weakness of the imagination."* This is the exact quote modern longtermists (like William MacAskill) lean on. Ramsey believed that the temporal location of a good does not diminish its value.

  Furthermore, Ramsey was a utilitarian (of the Moorean variety). He believed the goal of action was to bring about the best state of affairs. If the future contains trillions of people, and we can prevent their extinction, the utilitarian calculus demands we act. Ramsey was not a selfish hedonist; he was deeply committed to the "general good." He would likely agree that existential risk is a paramount concern simply because **no people = no value.** Since value requires the "Human Mood" (conscious experience), preserving the possibility of that mood is a prerequisite for all other goods.

  ### 3. Why He Would Be Hostile (The Human Mood vs. The Cosmic Mood)
  This is where it gets interesting. While Ramsey would agree that future people matter, he would likely be repulsed by the *rhetoric* and *prioritization* of modern Bostrom-style longtermism.

  **A. The Subordination of the Present**
  Ramsey's "Human Mood" is not just about where value lies; it's about where our *attention* and *affections* lie. In the *Epilogue*, he champions the immediate, local, human goods: love, beauty, intellectual understanding.
  > *"We are only human... we cannot sweep away the human mood."*

  Modern longtermism often argues for sacrificing significant present welfare for probabilistic future gains (e.g., donating to x-risk reduction instead of curing malaria). Ramsey might view this as a violation of the "Human Mood." To Ramsey, the love you feel for a living friend is a concrete good. The welfare of a hypothetical person in the year 3000 is an abstract good. While the abstract good might be larger in sum, Ramsey's pragmatism suggests that ethics must be actionable by humans *as they are*. He might argue that ignoring present suffering for the sake of "potential people" is a form of the "Cosmic Mood"—trying to view the world from a God's-eye view rather than a human perspective.

  **B. Skepticism of "Pascal's Mugging"**
  Ramsey was the father of subjective probability (Bayesianism). In *Truth and Probability*, he argues that beliefs are measured by the odds at which we are willing to bet. He was deeply suspicious of probabilities that could not be grounded in evidence or habit.

  Bostrom-style arguments often rely on tiny probabilities of huge impacts (e.g., "There's a 0.1% chance this research prevents human extinction"). Ramsey would likely be the first to point out that these probabilities are often epistemically hollow. If you cannot ground the probability in a reference class or empirical data, Ramsey would argue you don't actually have a belief—you have a pretense of one. He might view the "expected value" calculations of some longtermists as mathematically precise but philosophically vacuous.

  ### 4. The Verdict: A "Humanistic Longtermist"
  If Ramsey saw modern longtermism, he would likely try to **save it from itself.**

  He would tell the longtermists: *"You are right that the future matters, and you are right that we must not discount it. But you are wrong to think that the vastness of the universe gives it meaning. It matters only because there might be people there to love and think."*

  He would likely argue for a **moderate longtermism**:
  1.  **Anti-Extinction:** We must prevent human extinction, because that ends all value (The "Human Mood" requires humans).
  2.  **Pro-Present:** We cannot sacrifice the *actual* human goods of the present (love, art, current welfare) for the *speculative* goods of the future. The "Human Mood" demands we care about the foreground, not just the background.
  3.  **Epistemic Humility:** We should be wary of policy decisions driven by tiny probabilities of astronomical stakes.

  ### Summary for Your Argument
  You can tell your friend this:
  Ramsey doesn't contradict himself because he distinguishes between **Physical Vastness** (which is valueless) and **Moral Vastness** (the sum of conscious experiences).
  *   **Epilogue:** Stars are big but dead; they don't matter. (Rejects Cosmic Mood).
  *   **Savings:** Future people are small in time but alive; they matter equally. (Accepts Moral Impartiality).

  Ramsey would be **sympathetic to the goal** (preserving the future of humanity) but **hostile to the justification** (if it relies on cosmic scale) and **skeptical of the method** (if it relies on ungrounded probabilities). He would be a longtermist who insists that we save the future *for the sake of the human mood*, not for the sake of the universe.

  He would likely say: *"We do not save the future because it is big. We save it because it is the only place where love can happen."*
