          *   *X-Risk:* He would care about survival (no people = no value), but might reject sacrificing *too much* present welfare for probabilistic future gains (Pascal's Mugging concerns).
      *   **Specific Longtermist Tensions:**
          *   *Impersonality:* Bostrom is often impersonal. Ramsey is personalist (value resides in persons).
          *   *Uncertainty:* Ramsey was a master of probability (subjective). He might be skeptical of the precise probabilities assigned to x-risk scenarios.
      *   **Conclusion:** Ramsey would be a "Humanistic Longtermist." He'd agree the future matters immensely, but would insist the *reason* it matters is the human content, not the cosmic scale. He would reject the "Cosmic Mood" of some EA/Longtermist circles.

