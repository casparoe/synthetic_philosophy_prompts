answer: |-
  The study smelled of old paper and the antiseptic wipes Arthur kept on his desk now. He sat in his leather wingback, the one that had molded to his spine over three decades, staring at the tumbler of water in his hand as if it contained the answer key.

  Elena stood by the bookshelf, arms crossed. She hadn't sat down since she arrived.

  "You're quoting yourself, Artie," she said. "Thirty years of Intro to Ethics. 'Where death is, I am not.' I know the line."

  "It's not a line. It's a logical boundary," Arthur said. His voice was thinner than it used to be, the baritone fraying at the edges. "If harm requires a subject to experience it, and death removes the subject, then death cannot be a harm. It's a category error. You're trying to predicate 'suffering' of a null set."

  "I'm not talking about suffering. I'm talking about loss." Elena stepped away from the books, leaning over the desk. "You're losing the next ten years. The book you won't finish. The spring semesters. My wedding in June."

  "Grief for the people left behind. That's real. That's yours," Arthur said, tapping his chest. "But don't project it onto me. Once I'm gone, there is no 'me' to be deprived. The universe doesn't owe me a future."

  "So the deprivation account is wrong?"

  "The deprivation account assumes I'm standing on the sidelines watching my life get stolen," Arthur said. "But I'm not on the sidelines. I'm gone."

  "Okay." Elena picked up a heavy hardcover from his desk—a copy of *The Nature of Things*—and set it down with a thud. "Let's play your game. Let's say death is bad for you. I know you think it's not, but humor the intuition that says getting cancer at fifty is worse than getting it at ninety. If it *is* bad for you... when does it happen?"

  Arthur blinked. "When I die."

  "June 14th?"

  "Roughly."

  "Okay. On June 14th, are you alive?"

  "Until the moment of cessation, yes."

  "So on June 14th, at 2:00 PM, you are alive. Is death bad for you then?"

  "No, because I'm still here. I haven't lost anything yet."

  "Right. So it's not bad before you die." Elena held up a finger. "Now, June 15th. You're dead. Is death bad for you then?"

  "No. Because I don't exist. There is no 'you' to be harmed."

  "Exactly." Elena didn't blink. "So if it's not bad before you die, and it's not bad after you die, and there is no moment *during* death where you exist to feel the badness... when exactly does this tragedy occur? Is it a ghost harm? Does it float in the ether waiting for a victim who isn't there to catch it?"

  Arthur shifted in the chair. The leather creaked. "You're treating time like a series of snapshots. Harm doesn't have to be contemporaneous with the event."

  "Oh, now you're a presentist?" Elena pounced. "So the harm is... retroactive? Or prospective?"

  "It's a timeless fact," Arthur said, but he looked at his water glass instead of her. "The fact that I die at fifty is a fact about the shape of my life. It makes the narrative worse. It's bad *sub specie aeternitatis*."

  "Speak English, Artie."

  "It means it's bad from the outside. From the view of the universe."

  "But we were talking about *you*," Elena said, her voice softening just enough to sting. "You said it's not bad for *you*. Now you're saying it's bad for the universe. Which is it? Because if it's only bad from the outside, then Epicurus wins. You don't matter to the harm."

  Arthur rubbed his temples. "The timing puzzle is a parlor trick, Elena. It relies on the idea that all properties must be instantiated at a specific time. But 'being deprived' is a comparative property. I am worse off than I *would have been*."

  "Than you would have been *when*?"

  "Later!" Arthur snapped. Then he caught himself. He took a breath. "In the counterfactual world where I don't get sick."

  "In that world, you're alive in 2035," Elena said. "In this world, you're not. So the harm is that you aren't in 2035. But in 2035, you don't exist to register the absence. It's like saying I'm hurting a tree by not planting a seed. The tree never misses being a seed."

  Arthur looked tired. The intellectual armor was heavy today. "You're missing the symmetry."

  "The symmetry?"

  "Lucretius," Arthur said. "Look at the other side. You don't mourn the time before you were born. You didn't exist for the Roman Empire, the Ice Age, the Big Bang. Does that bother you? Does the eternity of non-existence behind you feel like a deprivation?"

  "No."

  "Why not?" Arthur leaned forward, eyes brightening with the old lecturer's spark. "Because it's absurd to mourn a time you couldn't inhabit. The time after death is the same state. It's just the mirror image. If the pre-birth nothingness isn't bad, why is the post-death nothingness bad?"

  Elena walked around the desk and sat on the edge of it, blocking his view of the books. "Because I didn't have plans for the year 1300."

  "That's irrelevant."

  "It's not. It's the direction of the desire," she said. "I don't look backward and wish I'd been born in 1300. But you look forward and you want 2035. The symmetry breaks because *you* break it. You have projects. You have momentum."

  "Momentum is psychological. Ontologically, the two nothings are identical."

  "Ontologically, maybe," Elena said. "But you're not an ontology. You're a man who wants to see his daughter graduate. Lucretius didn't have a calendar on his wall with circles around dates he knew he'd miss."

  Arthur fell silent. He looked at the calendar on the corkboard behind her. September was circled. *Chemo.*

  "The timing puzzle still stands," Arthur murmured, but the conviction had leaked out of it. "If you can't tell me when the harm lands, you can't prove it hits me."

  "Maybe the harm isn't a puncture," Elena said. "Maybe it's a truncation. If I'm reading a book and the last fifty pages are ripped out, the book is ruined. Not because the ending suffers. But because the story is incomplete."

  "The book doesn't care it's incomplete."

  "The reader does." Elena reached out and covered his hand with hers. Her skin was warm; his was cool. "And you're the reader, Artie. You're reading your own life. You're the one holding the book when the pages get ripped. You know they're missing before you're gone. That's when the harm happens. Now. While you know it's coming."

  Arthur looked down at their hands. He wanted to pull back, to retreat into the clean, cold logic where death was nothing and fear was irrational. But the logic felt like it was built on sand.

  "That's not death," he whispered. "That's dying. That's anticipation."

  "Is there a difference?"

  "For Epicurus, yes. Death is the end. Dying is the process."

  "Well, Epicurus isn't dying of pancreatic cancer," Elena said. "You are."

  Arthur let out a short, dry laugh that turned into a cough. He waved her off, catching his breath. "So I'm trapped. If I say death is bad, I can't say when. If I say it's not bad, I'm lying about how much I want to stay."

  "Maybe the philosophy was never meant to be used on the person holding the shield," Elena said. "Maybe it's for the mourners. To make them feel better that you aren't suffering."

  "I taught it for thirty years."

  "I know."

  "I believed it."

  Elena squeezed his hand. "I know that, too. But you're allowed to change your mind about the dark when you're actually standing in it."

  Arthur turned his hand over and gripped hers. He looked at the calendar again, at the circle around September.

  "The timing puzzle," he said quietly. "It still bothers me. If I can't locate the harm... how do I fight it?"

  "You don't fight it," Elena said. "You just admit it hurts. Even if you can't say exactly when."

  Arthur closed his eyes. For the first time all afternoon, he stopped trying to argue. He just sat in the chair, in the room, in the time he had left.

  "Okay," he said. "Okay."
