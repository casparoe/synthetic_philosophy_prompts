answer: |-
  You have stumbled directly onto a famous philosophical and statistical conundrum known as **The Reference Class Problem**.

  It was formalized by philosopher Ian Hacking and popularized in decision theory by Daniel Kahneman and Nassim Taleb. The problem is exactly what you described: any single event (your new feature) belongs to infinitely many classes of past events (all projects, all API projects, all API projects by this team, etc.), and the probability (or time estimate) varies drastically depending on which class you choose.

  To answer your core question immediately: **No, there is no mathematically unique, non-arbitrary way to select the "correct" reference class.** Your friend was half-right (base rates matter), but she skipped the hard part (defining the class).

  However, just because it's not *mathematically* solvable doesn't mean it's *practically* hopeless. You can move from "arbitrary guessing" to "defensible modeling." Here is how you break the deadlock.

  ### 1. The Hard Truth: You Cannot Estimate "Features"
  The reason your estimates range from two weeks to four months is that you are trying to find a reference class for a **compound object**. A "feature" is not an atomic unit of work. It is a bundle of risks, complexities, and tasks.

  When you look for past projects "similar" to a new feature, you are implicitly weighting different components differently.
  *   **Engineer A** thinks "similar" means "similar business logic." (Reference class: Billing features).
  *   **Engineer B** thinks "similar" means "similar technical integration." (Reference class: Third-party API calls).
  *   **Engineer C** thinks "similar" means "similar organizational friction." (Reference class: Projects involving the Legal team).

  **The Fix: Decomposition.**
  Stop estimating the feature. Estimate the *components*, then sum them.
  *   **Component 1:** DB Schema changes. (Reference class: All DB migrations. High $N$, low variance.)
  *   **Component 2:** Third-party API integration. (Reference class: All external API calls. Medium $N$, medium variance.)
  *   **Component 3:** New business logic. (Reference class: Complex calculation tickets. Low $N$, high variance.)

  By decomposing, you increase the sample size ($N$) for each bucket. It is much easier to find 50 past DB migrations than 5 past "Billing Integration Features." This reduces the variance of your estimate without forcing you to compare apples to oranges.

  ### 2. The "Similarity Score" Method
  If your PM insists on comparing whole projects, you need to operationalize "similar." You cannot leave it as a vibe. Create a simple weighted scoring model for your historical data.

  Define 3-5 dimensions of similarity relevant to your backend work. For example:
  1.  **Technical Novelty:** (1 = Stack we use daily, 5 = Brand new language/tool)
  2.  **External Dependency:** (1 = Internal only, 5 = Unreliable third-party API)
  3.  **Requirement Clarity:** (1 = Spec is written, 5 = We are discovering requirements as we build)

  Go back through your past 20 projects. Score them on these dimensions. Score the *new* project on these dimensions.
  Now, when you look for "similar" projects, you don't just eyeball it. You calculate the **Euclidean distance** (or just a simple sum of differences) between the new project and the past ones.

  *   **Project A (Past):** Distance score of 2. (Very similar). Weight this data heavily.
  *   **Project B (Past):** Distance score of 15. (Not similar). Discard this data.

  This makes your selection of the reference class **explicit and auditable**. If someone argues the estimate is wrong, they have to argue your scoring criteria, not just their gut feeling.

  ### 3. Handle the Outliers (The "Blow Up" Project)
  You mentioned one past project "blew up for reasons that had nothing to do with the integration part."
  In statistics, this is a **confounding variable**. If you include it in the average, you skew the data. If you exclude it, you look like you're cherry-picking.

  **The Fix: Tag the Cause of Variance.**
  When reviewing past data, tag *why* a project took long.
  *   Was it technical complexity? (Keep in dataset)
  *   Was it scope creep? (Keep in dataset, but note risk)
  *   Was it external blocking (e.g., "Waited 3 weeks for AWS approval")? (Exclude from *engineering* estimate, add as *risk buffer*).

  If the project that blew up was delayed because the Vendor's API was down for a week, that is not an engineering estimation error; that is a risk factor. You estimate the engineering work based on the clean projects, then add a contingency buffer based on the risk of the vendor.

  ### 4. Switch from Point Estimates to Ranges
  The reason you are seeing "2 weeks vs 4 months" is that everyone is trying to output a single number (P50, P90, Mean?) without agreeing on which one.

  Software estimation is inherently probabilistic. A single number is a lie.
  *   **Optimistic:** Everything goes right (2 weeks).
  *   **Most Likely:** Normal friction (6 weeks).
  *   **Pessimistic:** The API docs are wrong, the vendor is slow (4 months).

  Present the estimate as a **Confidence Interval**. "Based on the 5 most similar API integrations, the median time was 6 weeks, but the range was 3 to 12 weeks."
  This forces the PM to make a business decision: "Do we budget for the median, or do we need the safety of the pessimistic case?" It shifts the conversation from "Why is your number wrong?" to "How much risk are we willing to accept?"

  ### 5. A Defensible Proposal for Your Team
  You asked for a defensible way to narrow this down to bring back to your team. Here is a concrete process you can propose:

  **The "Calibrated Reference Class" Protocol**

  1.  **Tagging:** We will tag all completed tickets with 3 metadata fields: `Complexity` (S/M/L), `Type` (API/DB/Logic), and `Blockers` (Internal/External).
  2.  **Filtering:** For a new estimate, we filter history by `Type` first.
  3.  **Adjustment:** We look at the `Blockers` tag. If the new feature has External Blockers, we only average past tickets that also had External Blockers.
  4.  **Decomposition:** If the resulting sample size is $<3$, we decompose the ticket until each sub-task has a sample size of $\ge5$.
  5.  **Output:** We report a Range (P50 to P90), not a single date.

  ### Summary
  You are not missing something obvious. You are experiencing the **Reference Class Problem**.
  *   **Is it irreducibly arbitrary?** Yes, at the highest level ("What is similar?").
  *   **Can you mitigate it?** Yes, by decomposing work (increasing $N$), defining similarity metrics (making it explicit), and reporting ranges (acknowledging variance).

  **What to say to your PM:**
  > "I've been analyzing our historical data, and I found that depending on how we define 'similar,' the estimate varies by 800%. This is a known statistical issue called the Reference Class Problem. To make this data-driven rather than just cherry-picked, I propose we decompose features into technical components (API, DB, Logic) so we have more data points per category, and we tag past projects by *why* they were delayed. This will let us give you a confidence range instead of a fake-precise single number."

  This approach validates their desire for data while protecting your team from the absurdity of averaging incomparable projects.
