answer: |-
  This is an exceptionally sharp observation. You are absolutely right to reject the "he was a scientist, so he'd be a skeptic" narrative. That view commits the fallacy of presentism, projecting modern definitions of "science" and "pseudoscience" onto a 17th-century Neo-Platonist for whom the physical and metaphysical were inextricably linked.

  Kepler was not a skeptic of astrology in the modern sense; he was a *reformer* of it. He did not believe in astrology *despite* being a mathematician; he believed in it *because* he was a mathematician. To him, geometry was the archetype of Creation, and planetary aspects were literal rays of geometric power interacting with the *Anima Terrae* (the Soul of the Earth).

  If we take his specific writings—particularly *Tertius Interveniens* (1610) and *Harmonices Mundi* (1619)—seriously, we can construct a much more nuanced prediction of his reaction than simple skepticism. Here is a best-supported guess on how Kepler would respond to your two scenarios.

  ### 1. Reaction to Failed Empirical Tests (e.g., Carlson 1985)

  If Kepler were presented with the results of the Shawn Carlson double-blind study (where astrologers failed to match charts to personalities) or subsequent meta-analyses showing no statistical correlation between aspects and human traits, his reaction would likely be **frustrated acceptance regarding prediction, but stubborn retention regarding ontology.**

  **The Acceptance (The Astronomer):**
  Kepler was, above all, devoted to the integrity of observational data. This is the man who spent years wrestling with Tycho Brahe's data for Mars until he was willing to discard the perfect circle for the ellipse. He knew that nature does not care about human hypotheses. In *Tertius Interveniens*, he explicitly criticizes astrologers who claim certainty where there is none. He often warned patrons that astrological influences were "inclinations, not compulsions."
  Faced with rigorous statistical null results, the Kepler who gave us the Three Laws would likely concede that **natal astrology as a predictive technology is broken.** He would admit that the "foolish daughter" has proven herself incapable of doing the job she was hired for. He would likely argue that the "noise" of human free will and the complexity of the Earth's soul make specific predictions impossible, validating his long-held suspicion that most astrologers claimed too much precision.

  **The Retention (The Neo-Platonist):**
  However, he would *not* necessarily conclude that planetary aspects are meaningless. For Kepler, aspects were not arbitrary symbols; they were real physical angles (conjunction, sextile, square, trine, opposition) corresponding to musical harmonies (consonances).
  He would likely argue that modern tests are measuring the wrong variable. The Carlson study tested psychological personality traits against birth charts. Kepler's theory was that aspects influence the *weather* and the *temperament* via the Soul of the Earth, which is a subtle, metaphysical substance not measurable by psychometric surveys.
  He might posit that the "harmony" is real and objectively exists in the cosmos (a view vindicated by modern orbital resonance mechanics in astrophysics), but that the link to individual human psychology is too attenuated to be captured in a double-blind test. He would likely shift from "astrology predicts personality" to "astrology reveals cosmic structure," moving closer to a metaphysical philosopher than a fortune teller.

  ### 2. Reaction to the Survival of Sun-Sign Astrology

  This is where Kepler would feel the most profound, ironic vindication.

  **The "Foolish Daughter" Vindicated:**
  Kepler famously wrote that astrology is the "foolish daughter" who keeps the "wise mother" (astronomy) fed. He viewed popular astrology as a necessary economic evil that allowed him to do real science.
  Seeing that the only version of astrology that survived into the 21st century is the exact version he despised—simplistic, sign-based, deterministic, and stripped of complex aspects—would confirm his lowest opinion of the "vulgar" mindset. He rejected the twelve signs as arbitrary slices of the sky with no physical basis. He rejected the idea that everyone born in a month shares a fate.
  He would look at modern newspaper horoscopes and say, *"I told you so."* He would view the survival of sun-sign astrology not as a triumph of the discipline, but as a triumph of human laziness. It proves his point in *Tertius Interveniens* that the masses prefer comforting fictions over the difficult, mathematical truth of the aspects.

  **The Loss of Harmonics:**
  He would be deeply saddened that his *Harmonices Mundi*—his attempt to ground astrology in physical music theory and geometry—is ignored by astrologers. Modern astrologers still use his aspects, but they rarely use them in the way he intended (as musical intervals resonating with the soul).
  However, he might find a strange comfort in modern physics. While physicists don't use harmonics to cast horoscopes, they *do* use them to describe orbital resonances (e.g., the Laplace resonance of Jupiter's moons) and string theory. He might argue that physics finally accepted his "Mother" (Astronomy/Harmony) but correctly divorced her from the "Foolish Daughter" (Astrology).

  ### The Synthesis: What Would Kepler Become?

  If Kepler were transported to today, armed with his specific 17th-century epistemology but aware of modern data, he would likely not become a standard "skeptic" (who denies non-material causes) nor a "believer" (who casts charts).

  He would likely become a **Jungian-style Archetypal Realist.**

  1.  **Rejection of Causality, Acceptance of Synchronicity:** Kepler struggled with the mechanism of *how* a planet affects a baby. He settled on light rays affecting the Earth's soul. Since modern physics finds no such rays, Kepler would likely drop the *physical* causality but keep the *meaningful connection*. This is almost identical to Carl Jung's concept of *synchronicity* (acausal connecting principle). Kepler would likely argue that the planets do not *cause* events, but their positions are *signatures* of the cosmic moment, readable by the soul but not by statistics.
  2.  **Focus on Meteorology:** Kepler spent significant time on weather astrology (astrometeorology). Since this is less about individual psychology and more about mass physical systems, he might focus his research there. Interestingly, some modern researchers still look for solar/planetary correlations with weather/climate (via solar activity), which is a much more "Keplerian" avenue than personality testing.
  3.  **The "Third Man" Position:** In *Tertius Interveniens*, Kepler positioned himself between the superstitious believers and the hardline skeptics. Today, he would likely occupy the exact same middle ground. He would criticize the "New Atheist" skeptics for being too materialistic (denying the soul/harmony) and criticize astrologers for being too superstitious (ignoring data).

  ### Conclusion

  Your friend's assessment that Kepler would be an "ordinary astronomy-side skeptic" is incorrect because it assumes Kepler's belief in astrology was a bug in his scientific software. For Kepler, it was a feature of his metaphysical operating system.

  Faced with modern evidence, Kepler would likely **abandon predictive natal astrology** (admitting the data doesn't support it) but **refuse to abandon cosmic harmony** (insisting the geometry is real). He would view the survival of sun-sign astrology as proof of human folly, and the death of his harmonic reforms as a tragedy of materialism.

  He would not say, "Astrology is false." He would say, "The vulgar have corrupted the art, the tests measure the wrong things, but the Music of the Spheres is real—even if it no longer pays the bills."
