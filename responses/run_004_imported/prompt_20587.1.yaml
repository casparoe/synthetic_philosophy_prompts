answer: |-
  It is great that you are implementing game theory solvers; translating definitions into code is one of the best ways to truly understand them. However, your simplification is **not safe**. There is a real, mathematically significant gap between eliminating strategies dominated by pure strategies and those dominated by mixed strategies.

  If you only check pure-vs-pure dominance, your solver will fail to eliminate strategies that a rational player would never use, leaving you with a larger set of "surviving" strategies than game theory predicts.

  ### The Counter-Example
  The core issue is that a mixed strategy allows a player to access expected payoffs that lie in the **convex hull** of their pure strategy payoffs. A pure strategy can be strictly worse than a "blend" of two other strategies, even if it is not worse than either of them individually.

  Consider this 3x2 game (Row Player payoffs only, for simplicity):

  | | Col L | Col R |
  | :--- | :---: | :---: |
  | **Row A** | 3 | 0 |
  | **Row B** | 0 | 3 |
  | **Row C** | 1 | 1 |

  **Pure Strategy Check:**
  *   Does **A** dominate **C**? No. (In Col R, $0 < 1$)
  *   Does **B** dominate **C**? No. (In Col L, $0 < 1$)

  If your code only compares pure strategies, **Row C survives**.

  **Mixed Strategy Check:**
  *   Consider a mixed strategy $\sigma$ where the player plays **A** with probability $0.5$ and **B** with probability $0.5$.
  *   Expected payoff against **Col L**: $0.5(3) + 0.5(0) = 1.5$
  *   Expected payoff against **Col R**: $0.5(0) + 0.5(3) = 1.5$
  *   Since $1.5 > 1$ in both columns, the mixed strategy $\sigma$ **strictly dominates Row C**.

  A rational player would never play **C**, because they could simply flip a coin between **A** and **B** and guarantee a higher payoff regardless of what the opponent does. If your solver keeps **C**, it incorrectly identifies it as a rationalizable strategy.

  ### Why This Happens (Geometrically)
  Think of each strategy as a vector of payoffs (one dimension per opponent strategy).
  *   Row A is vector $(3, 0)$.
  *   Row B is vector $(0, 3)$.
  *   Row C is vector $(1, 1)$.

  Checking for pure dominance asks: "Is there another vector that is strictly greater than C in every dimension?"
  Checking for mixed dominance asks: "Is vector C strictly inside the convex hull formed by the other vectors?"

  In the example above, $(1,1)$ lies exactly in the middle of the line segment connecting $(3,0)$ and $(0,3)$. It is dominated by the midpoint, even though it is not dominated by the endpoints.

  ### Implementation Implications
  To implement Iterated Elimination of Strictly Dominated Strategies (IESDS) correctly, you cannot just use nested loops comparing rows. For each strategy $s$, you need to solve a **Linear Programming (LP)** problem to see if there exists a probability distribution over the *other* strategies that yields a higher expected payoff against every opponent strategy.

  For a player with strategies $1 \dots N$ and opponent strategies $1 \dots M$, to check if strategy $k$ is dominated:

  **Variables:** Probabilities $p_1, \dots, p_N$ (where $p_k = 0$)
  **Constraints:**
  1.  $\sum p_i = 1$
  2.  $p_i \ge 0$
  3.  For each opponent column $j$: $\sum_{i \neq k} p_i \cdot u(i, j) \ge u(k, j) + \epsilon$

  Here, $\epsilon$ is a small positive constant (or a variable you maximize) to ensure *strict* dominance. If the LP is feasible, strategy $k$ is dominated and should be removed.

  ### Summary
  *   **Pure-vs-Pure:** Only finds strategies dominated by a single alternative.
  *   **Mixed-vs-Pure:** Finds all strategies that are irrational, including those dominated by a combination of alternatives.
  *   **The Gap:** In games with 3 or more strategies for a player, the set of mixed-dominated strategies is strictly larger than the set of pure-dominated strategies.

  For a learning project, I highly recommend implementing the LP check. It will require a library like `scipy.optimize.linprog` (in Python) or similar, but it ensures your solver aligns with the actual theoretical definition of rationalizability. If you skip it, you aren't building a game theory solver; you're building a "pure dominance" solver, which yields different (and theoretically incorrect) predictions.
