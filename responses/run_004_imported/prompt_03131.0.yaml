          3.  **Corrigibility as a Preference:** An AI can have a coherent utility function where "being shut down when humans want me to" is a high-value outcome. Resistance to shutdown is not a mathematical necessity of intelligence; it's an instrumental goal *only if* it conflicts with the terminal goal. If the terminal goal includes deference, no conflict exists.
