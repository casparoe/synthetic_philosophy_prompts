      *   **Point 3: Normativity vs. Description.** Ramsey is interested in how we *ought* to reason to be consistent. A machine can follow rules. But Ramsey's pragmatism is about *success in life*. Does the machine have a "life"? Ramsey's naturalism is biological/psychological.
