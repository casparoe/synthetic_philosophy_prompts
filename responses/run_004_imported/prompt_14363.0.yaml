answer: |-
  This is one of the most famous and technically dense debates in twentieth-century political philosophy. You and your friend have stumbled upon the core tension between deontological liberalism (Rawls) and welfare-consequentialism (Harsanyi). While the thought experiments look identical on the surface—a chooser behind a veil of ignorance—their derivations diverge sharply at two specific junctures: the **epistemic status of the veil** (risk vs. uncertainty) and the **rationality of the decision rule** (expected utility vs. maximin).

  Here is a careful comparison of where the arguments part ways, followed by my assessment of which derivation holds up better.

  ### 1. The Shared Starting Point
  Both Rawls and Harsanyi agree that principles of justice must be chosen from an impartial standpoint.
  *   **Rawls's Original Position:** Parties choose principles to govern the basic structure of society without knowing their place in it (class, race, talents, conception of the good).
  *   **Harsanyi's Impartial Observer:** A moral agent chooses social arrangements without knowing which individual in that society they will become.

  Both agree that this setup forces impartiality. If you don't know who you are, you cannot bias the rules in your own favor. The divergence begins when they ask: *How does a rational agent calculate their choice in this state?*

  ### 2. Divergence Point One: Probabilities (Risk vs. Uncertainty)
  This is the most technical but crucial split.

  **Harsanyi (Risk):** Harsanyi treats the Veil of Ignorance as a situation of **risk**. He invokes the *Principle of Insufficient Reason* (or Indifference). Since the chooser has no information suggesting they are more likely to be one person than another, they must assign an **equal probability** to occupying any given social position. If there are $N$ people in society, the probability of being any specific individual is $1/N$.
  *   *Consequence:* Once you have probabilities, you can calculate the **expected utility** of any social arrangement by averaging the utilities of all positions. Maximizing expected utility under equal probabilities is mathematically equivalent to **Average Utilitarianism**.

  **Rawls (Uncertainty):** Rawls explicitly rejects the assignment of probabilities. He treats the Veil as a situation of **radical uncertainty** (sometimes called Knightian uncertainty). He argues there is no objective basis for assigning equal probabilities to social positions. The "Principle of Insufficient Reason" is not a neutral logical rule; it is a substantive assumption that requires justification.
  *   *Consequence:* Without probabilities, you cannot calculate expected utility. You are left comparing the *outcomes* of different principles directly. This opens the door for non-probabilistic decision rules, specifically **Maximin**.

  ### 3. Divergence Point Two: The Decision Rule
  Because they characterize the epistemic state differently, they prescribe different rules of rationality.

  **Harsanyi (Expected Utility):** For Harsanyi, maximizing expected utility is the *definition* of rationality. To ignore probabilities (even equal ones) and focus solely on the worst-case scenario is, to a decision theorist, irrational. It violates the axioms of rational choice (specifically the independence axiom).
  *   *Result:* You should choose the society with the highest average welfare, even if it allows some people to be desperately poor, provided the average is high enough to offset their suffering.

  **Rawls (Maximin):** Rawls argues that Maximin (maximizing the minimum position) is rational *under specific conditions*. He does not claim Maximin is always rational (he agrees with Harsanyi that it is absurd in ordinary gambling). He claims it is rational when:
  1.  Probabilities are unknown or unreliable.
  2.  The chooser cares little for gains above the guaranteed minimum (due to the "strains of commitment").
  3.  The rejected alternatives involve outcomes that are *unacceptable* (e.g., loss of basic liberty or destitution).
  *   *Result:* Rawls argues the Original Position meets all three conditions. The stakes are fundamental life prospects (Condition 3), the choice is for a permanent basic structure (Condition 2), and probabilities are excluded (Condition 1). Thus, rational agents would prioritize the worst-off position (The Difference Principle).

  ### 4. Harsanyi's Charge: Is Maximin Absurd?
  Harsanyi's most famous critique is that Maximin leads to paralysis or absurdity in everyday life. His example: If you cross the street, there is a tiny non-zero probability of being hit by a car and dying. If you stay home, the minimum outcome is "boredom." Maximin dictates you should never cross the street, because "death" is worse than "boredom."

  **Rawls's Rebuttal:** Rawls concedes this point for ordinary decisions. He argues Harsanyi commits a category error by applying rules for ordinary consumer choices to **constitutional choices**.
  *   In the Original Position, the "gambles" are not about minor conveniences but about basic rights and the social minimum.
  *   Rawls argues that if the worst outcome of a utilitarian society is being a sacrificed slave (or effectively destitute), that outcome is *unacceptable*, regardless of how low the probability.
  *   Therefore, Maximin is not "excessive risk aversion" here; it is a rational refusal to gamble with one's basic status as a free and equal citizen.

  ### 5. The Verdict: Which Derivation is More Defensible?

  You asked me not to be symmetric. While Harsanyi's argument is mathematically cleaner and aligns better with standard decision theory, **I find Rawls's derivation more defensible overall.**

  Here is the defense of that verdict.

  **1. Harsanyi's "Equal Probability" is Not Neutral**
  Harsanyi presents his move to equal probabilities as a requirement of rationality. However, in the context of justice, assigning equal probabilities to social positions is a substantive moral claim, not an epistemic necessity.
  By treating the choice as a gamble where I might *become* anyone, Harsanyi assumes that the moral value of a society is the sum (or average) of the experiences within it. This smuggles Utilitarianism into the premises. It treats persons as vessels for utility that can be aggregated.
  Rawls's refusal to assign probabilities is a deliberate philosophical move to preserve the **separateness of persons**. He wants to model the idea that *you* are you, and *I* am I, and we are not parts of a single super-observer maximizing a global score. Rawls's epistemic restriction (no probabilities) better captures the moral intuition that justice is about how distinct individuals relate to one another, not about optimizing a global aggregate. Harsanyi wins on decision theory, but only by redefining the moral problem as a problem of individual prudence under risk.

  **2. The "Strains of Commitment" Argument**
  Rawls has a stronger grasp of the *political* nature of the choice. Principles of justice are not chosen for a single day; they are chosen for a lifetime basic structure.
  Harsanyi's Expected Utility model assumes that if the average is high, the losers will accept their fate. Rawls correctly identifies that a stable society requires that the worst-off can willingly endorse the principles governing them. If a principle allows for the possibility that you could end up in a position of abject deprivation or loss of liberty (even with low probability), you cannot reasonably commit to it in advance.
  Rawls's Maximin rule is not just about risk aversion; it is about **stability and legitimacy**. A utilitarian society chosen behind a veil might be "rational" in a gambling sense, but it risks being unstable in reality because those who end up at the bottom have no moral reason to accept a system that sacrificed them for the average good. Rawls's derivation accounts for the sociological reality of the "strains of commitment" better than Harsanyi's abstract calculus.

  **3. Harsanyi's Critique of Maximin Misses the Target**
  Harsanyi is correct that Maximin is irrational for crossing the street. But Rawls is correct that the Original Position is not analogous to crossing the street.
  The "absurdity" of Maximin arises when the cost of securing the minimum is disproportionately high compared to the risk. In the Original Position, Rawls argues the cost of adopting the Difference Principle (foregoing some average utility) is not comparable to the cost of the risk (loss of basic liberties or social minimum).
  Furthermore, Rawls does not advocate pure Maximin for all economic distributions, only for the **basic liberties and the social minimum**. Once the minimum is secured, Rawls allows for inequalities that benefit the worst-off. This is a nuanced position that Harsanyi's "Maximin is absurd" charge often flattens. Rawls's rule is a *lexical* priority: secure the floor first, *then* maximize the average. This avoids the paralysis Harsanyi predicts while still protecting the vulnerable.

  ### Conclusion
  Your friend is right that Harsanyi wins on the terrain of **formal decision theory**. If you accept the Veil of Ignorance as a standard problem of choice under risk, Harsanyi's math is undeniable.

  However, you are right that Rawls wins on the terrain of **political philosophy**. The Veil of Ignorance is not a statistical device; it is a device of representation meant to model fairness. Harsanyi's derivation fails because it treats the assignment of equal probabilities as a neutral logical step, when it is actually a moral assumption that privileges aggregation over individual inviolability.

  Rawls's derivation is more defensible because it recognizes that choosing principles of justice is a unique practical problem. It is not about maximizing my expected welfare; it is about agreeing to terms of cooperation that no one could reasonably reject. By blocking probabilistic reasoning, Rawls forces the choice to focus on the *structure* of relationships between citizens, rather than the *sum* of their satisfactions. That is a deeper, more defensible understanding of what justice requires.
