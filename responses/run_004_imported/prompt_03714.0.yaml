  2.  **Deconstruct the Philosophical Problem:**
      *   **The Classical Liar:** "This sentence is false." If true, it's false. If false, it's true. Contradiction.
      *   **Kripke's Solution (Outline of Truth):** Introduce a "gap" (undefined/ungrounded). The Liar sentence is neither true nor false. It falls into the gap. System saved.
      *   **The Revenge Problem (The Strengthened Liar):**
          *   If the Liar sentence is *neither true nor false*, then it is *not true*.
          *   So, construct a new sentence: "This sentence is not true."
          *   If it's true, then it's not true.
          *   If it's not true (whether false OR undefined), then what it says is the case, so it *is* true.
          *   Boom. Paradox returns.
      *   **Why does this happen?** To define the gap ("neither true nor false"), you need a meta-language or a predicate like "is not true." But if your language can express its own semantic categories (like "is undefined" or "is not true"), you can rebuild the paradox using those new categories.
      *   **Is it fixable?** Most logicians/philosophers of language think no, not in a way that allows a language to be fully semantically closed (able to talk about its own truth) without restriction. This is related to Tarski's Undefinability Theorem and Gödel's Incompleteness. It's a feature, not a bug, of self-referential systems.

