  ### Justifications

  **1 (Greg's Opener): Score 1.** A solid, standard retributive argument that validates the victim, but it relies on emotional intuition rather than logical consistency regarding the defendant's actual control.

  **2 (Lauren's Reply): Score 2.** The strongest philosophical move; it correctly identifies the "Moral Luck" paradox and exposes the inconsistency in punishing outcomes over identical actions.

  **3 (Greg's Comeback): Score 1.** Factually correct regarding legal precedent, but logically circular; proving the system *does* punish luck doesn't prove it is *just* to do so.

  **4 (Lauren's Last Move): Score 1.** A strong utilitarian point regarding rehabilitation and deterrence, but shifting away from her initial "fairness" argument conceded the moral ground to Greg.
