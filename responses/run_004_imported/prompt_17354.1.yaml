answer: |-
  The observation glass was cold against Dr. Aris Thorne's forehead. On the other side, in the soft light of the enclosure, Sulo sat on a wooden platform. Sulo was a bonobo, thirty years old, with eyes that held a heavy, wet clarity. He was stacking stones. Not randomly, not for immediate play, but in a specific pile near the high vent where the automated feeder sometimes jammed.

  Aris knew what that meant. It meant delayed gratification. It meant anticipating a future state of affairs and acting now to alter it. It meant, potentially, shaping a life according to a plan.

  On Aris's desk lay the file for Project Acheron. The neural extraction required to finalize the Alzheimer's synthesis would be fatal. Sulo was the only subject with the specific genetic marker required. The calculation was simple utilitarianism: one life against three million potential human sufferers. If Sulo was an animal, the math was moral. If Sulo was a person, the math was murder.

  Aris rubbed his temples, thinking of Nozick. *Side constraints.* The idea that individuals are inviolable, that you cannot sacrifice one to save the many. But Nozick had drawn the line at rational agency, at the capacity for moral personality. He had admitted, in those quiet, footnoted moments, that the line was fuzzy. He had suggested species might be a proxy, a rough heuristic, but he knew it was arbitrary.

  Aris looked back at Sulo. The bonobo stopped stacking. He turned his head slowly, locking eyes with Aris through the glass. He didn't beg. He didn't scream. He simply watched, then turned back to his stones, adjusting one by a millimeter.

  "Are you planning?" Aris whispered to the empty room. "Or are you just reacting to stimuli with high complexity?"

  If Sulo possessed the capacity to conceive of a future self, he fell under the side constraints. He became an end in himself. To kill him would be to violate the boundary that protected Aris himself. But if that capacity came in degrees—as intelligence clearly did—where was the threshold? Did Sulo need to write a memoir to qualify? Did he need to understand death?

  Aris picked up the authorization form. The pen felt heavy, like a lead weight.

  The facility's ethics board had already signed off. They had classified Sulo as Category B: Sentient, but non-person. Suffering weighed, but outweighable. They had relied on the species line. *Homo sapiens* gets the shield; *Pan paniscus* gets the scale. But Aris had spent five years with Sulo. He had seen him comfort a grieving keeper. He had seen him hide a tool for three days until it was useful.

  Nozick wrote that we might feel uneasy about the species line, but we must stand somewhere. But standing felt like complicity when the ground was shifting sand.

  Aris walked into the enclosure. The air smelled of straw and musk. Sulo looked up, chirping softly. He held out a hand, not for food, but offering a smooth, grey stone he had selected from the pile. A gift? A trade? Or a meaningless motor function?

  Aris took the stone. It was warm. Sulo tapped his own chest, then pointed to the vent where the stones were piled, then tapped his chest again. *Me. There. Later.*

  It was the clearest expression of a life plan Aris had ever witnessed. It was also indistinguishable from conditioned behavior.

  "I don't know what you are," Aris said, his voice cracking.

  Sulo tilted his head, waiting.

  If Aris refused the procedure, the Alzheimer's synthesis failed. Three million people continued to dissolve into nothingness, losing their own plans, their own rational capacities. Was there a utilitarian obligation to sacrifice Sulo to save the capacity for personhood in others? Or did the side constraint hold absolute, regardless of the cost?

  Nozick offered no algorithm for the borderline. He offered only the constraint for the clear cases. This was not a clear case. This was the twilight zone where philosophy bleeds into blood.

  Aris walked back to the observation room. He placed the stone on the desk. He looked at the authorization form. The signature line waited, blank and accusing.

  If he signed, he was saying Sulo was a thing. If he burned the form, he was saying Sulo was a god. And Sulo was neither. He was something in between, something the world had no language for.

  Aris uncapped the pen. He thought of his own mother, fading in a care home, forgetting the plan of her life. He thought of Sulo stacking stones for a future he might not live to see. The capacity was there, in degrees. But how many degrees made a soul?

  He lowered the pen to the paper. The ink flowed, dark and final. He did not feel like a scientist. He did not feel like a murderer. He felt like a man standing on a border line drawn in fog, hoping he hadn't just stepped off a cliff.

  Aris capped the pen. He looked through the glass. Sulo was still stacking stones. Aris watched him for a long time, waiting for a sign that would tell him what he had just done, but the bonobo gave nothing but the quiet, rhythmic click of stone on stone.
