answer: |-
  This is an excellent question. You have put your finger on precisely the mechanism that turns Hume's psychological description of belief into a skeptical argument against direct realism. It is also the exact pivot point where the historical "Argument from Illusion" begins to take shape.

  Your confusion regarding the "tension" (that resemblance sometimes creates belief in continuity, but here destroys belief in independence) is astute. Resolving that tension is key to unlocking the logic of the paragraph.

  Here is a reconstruction of the argumentative work being done in that middle sentence, followed by an assessment of its relationship to the Phenomenal Principle and Disjunctivism.

  ### 1. Reconstructing the Logic of the "Double Vision" Argument

  Hume is not merely reporting a fact about double vision; he is deploying a specific metaphysical principle regarding **ontological parity**.

  Here is the premise-by-premise breakdown of what is happening in that sentence:

  *   **Premise 1 (The Phenomenological Fact):** When I press my eye, I have two visual perceptions ($P_1$ and $P_2$) of the same object (e.g., two candles instead of one).
  *   **Premise 2 (The Constraint of Reality):** I cannot attribute a "continu'd and distinct existence" (mind-independence) to **both** $P_1$ and $P_2$. (Common sense tells me there are not actually two candles in the world).
  *   **Premise 3 (The Indistinguishability Claim):** $P_1$ and $P_2$ are "of the same nature." They are qualitatively identical to the subject. There is no intrinsic mark on $P_1$ that says "I am real" and on $P_2$ that says "I am false."
  *   **Premise 4 (The Principle of Sufficient Reason / No Relevant Difference):** If two things are of the same nature, they must have the same ontological status. We cannot assign different metaphysical categories (one mind-independent, one mind-dependent) to two items unless there is a relevant difference between them to justify the distinction.
  *   **Intermediate Conclusion:** Since we cannot attribute independent existence to *both* (Premise 2), and there is no difference between them to allow us to pick *one* as the real one (Premise 3 & 4), we must attribute independent existence to **neither**.
  *   **Final Conclusion:** Therefore, *all* such perceptions (including the ones we have when not pressing our eyes) are dependent on our organs and lack distinct existence.

  **The Work Being Done:**
  The clause "as they are both of the same nature" is the engine of the argument. It blocks the Naïve Realist escape route. The Naïve Realist wants to say: "The left-image is the real object; the right-image is a glitch." Hume replies: "Look at them. They are identical. If you say the right one is mind-dependent because of the eye-press, you must admit the left one is too, because they are made of the same 'stuff' (perceptions)."

  ### 2. Resolving the Tension with the "Vulgar" System

  You noted a tension: Earlier, Hume says resemblance leads the imagination to *ascribe* continued existence (the "vulgar" system). Here, resemblance leads us to *deny* it.

  Hume distinguishes between two levels of cognitive processing here:

  1.  **The Vulgar System (Pre-reflective):** When perceptions are interrupted (I look away, then look back) but resemble each other, the imagination smooths over the gap and feigns continuity. Here, resemblance supports the belief in independent objects.
  2.  **The Philosophical Reflection (Reflective):** Double vision presents a *contradiction* to the vulgar system. The imagination cannot feign continuity for two simultaneous, identical objects in different places. This contradiction forces the mind to reflect on the *cause* of the perceptions.

  In the double vision case, the resemblance is not bridging a gap in time; it is highlighting a redundancy in space. Because the mind cannot accept two real objects, and cannot distinguish the two perceptions, it is forced to conclude that **neither** perception is the object itself. Both are merely internal states caused by the eye press.

  So, the earlier point (resemblance creates belief) explains why we are Naïve Realists by default. The double vision point (resemblance destroys independence) explains why we are forced to become Skeptics or Representative Realists upon reflection.

  ### 3. Connection to the Phenomenal Principle and Disjunctivism

  Is it anachronistic to see the "Phenomenal Principle" or the "Argument from Illusion" here?

  **The Short Answer:** No, it is not anachronistic to see the *structure* of the argument, though we must be careful with the *terminology*.

  **The Phenomenal Principle:**
  Roughly stated, the Phenomenal Principle (often associated with Price, Ayer, and later Robinson) claims: *If it sensibly appears to a subject that something has a sensible quality $F$, then there is something of which the subject is aware that actually has $F$.*

  Hume is arguing for a slightly different but structurally identical claim, which we might call the **Common Kind Assumption**: *Veridical perceptions and non-veridical perceptions (illusions/hallucinations), if subjectively indistinguishable, are tokens of the same fundamental ontological kind.*

  *   **Hume's Move:** Because the "double" perception and the "single" perception are of the "same nature," they share the same ontological status (dependence on the mind).
  *   **Ayer/Price's Move:** Because the hallucination and the veridical experience are indistinguishable, they share the same immediate object (a sense-datum).

  **Disjunctivism:**
  Disjunctivism (e.g., Putnam, McDowell, Martin) is defined precisely by its rejection of Hume's move here. The Disjunctivist denies Premise 3 and Premise 4 above.
  *   **Disjunctivist Claim:** The fact that a veridical perception and an illusion are subjectively indistinguishable does **not** mean they are of the "same nature" ontologically.
  *   **The Disjunction:** Either I am seeing a real object (veridical), or I am having an illusion (non-veridical). The "common nature" is merely a negative description (what it is *not*), not a positive ontological commitment.

  **Verdict on the Parallel:**
  It is entirely fair to say Hume is anticipating the Argument from Illusion. In fact, many historians of philosophy view Hume's *Treatise* 1.4.2 as the locus classicus where the "Way of Ideas" hardens into the "Argument from Illusion."

  However, there is one nuance to keep in mind for your seminar:
  *   **20th Century (Ayer/Price):** They often use the argument to establish **Sense-Data** as the *immediate objects* of awareness.
  *   **Hume:** He is using the argument to establish the **Dependence** of perceptions. He is less concerned with reifying the perception as an object (a sense-datum) and more concerned with severing the link between the perception and the external world.

  Hume doesn't quite say "Therefore, you are seeing a sense-datum." He says, "Therefore, your perception is dependent on your nerves." But the logical consequence is the same: you are not directly aware of the external object.

  ### Summary for your Seminar

  If you want to raise this in class, you can confidently make the following points:

  1.  **The Logic:** The argument relies on a **Principle of Ontological Parity**. If $A$ and $B$ are indistinguishable, and $A$ is known to be mind-dependent (due to the eye-press), $B$ must be too. We cannot slice them apart metaphysically if we cannot slice them apart phenomenologically.
  2.  **The Tension:** The earlier discussion of resemblance explains the *origin* of the belief in bodies (the vulgar system). The double vision argument explains the *refutation* of that belief (the philosophical system).
  3.  **The Disjunctivist Link:** Hume is explicitly committed to the **Common Kind Assumption**. He assumes that because the illusions and veridical perceptions are "of the same nature," they must share the same causal/ontological status. A Disjunctivist would reject this inference, arguing that subjective indistinguishability does not entail ontological identity.

  You are not reading an anachronism into Hume; you are recognizing that Hume built the trap that Disjunctivists are still trying to escape.
