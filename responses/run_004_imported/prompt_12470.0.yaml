  Your logical distinction is sound: the arguments are independent even if they share a worldview. However, your historical timeline is compressed. Gödel drafted the Ontological Proof circa 1941 (shown to Wang later), whereas the letter to Marianne is from the early 1960s. They are not from the "same period" of drafting, even if Wang collated them later. This suggests you might be relying on the publication date of Wang's transcripts rather than the composition date of Gödel's manuscripts.

