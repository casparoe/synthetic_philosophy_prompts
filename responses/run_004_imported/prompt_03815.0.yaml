      *   **Point 3: The Tangled Bank (The Gould Alignment).** Contingency, extinction, and the rarity of lineage survival.
      *   **Point 4: The Great Filter.** Placing it behind us (evolutionary rarity) rather than ahead (societal collapse), based on his views on extinction.
