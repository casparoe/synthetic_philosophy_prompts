      *   **Context:** Teaching Miranda Fricker's *Epistemic Injustice* and Kristie Dotson's "Tracking Epistemic Violence" (2011).
      *   **Current State:** Students understand Fricker's testimonial/hermeneutical distinction. They've read Dotson. The instructor is grappling with the specific concept of "testimonial smothering."
