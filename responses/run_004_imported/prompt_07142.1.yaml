answer: |-
  **Setting:** *The hallway outside the philosophy department lecture hall. The seminar on "The Logic of Conditionals" has just concluded. ELENA (a Stalnakerian propositionalist) and MARCUS (an Adams-Edgington expressivist) are holding Styrofoam cups of lukewarm coffee.*

  **Marcus:** Well, that was a polite burial, but a burial nonetheless. Lewis's triviality results are the elephant in the room, and the speaker danced around it nicely, but let's be honest: if you accept the Equation—$P(\text{if } A, C) = P(C \mid A)$—you cannot maintain that conditionals express ordinary propositions. The math simply forbids it.

  **Elena:** The math forbids it only if you make a specific, and I think dubious, assumption. You're assuming that the proposition expressed by "if $A, C$" must remain fixed across all probability functions. That's the premise Stalnaker challenged. The proposition expressed is context-sensitive. It shifts depending on the agent's epistemic state. So, no single proposition is required to satisfy the Equation for *every* probability function.

  **Marcus:** But that's precisely where the rescue mission becomes visible, Elena. You're saving the truth-conditional theory by making the content of the conditional float freely with the credence function. If the proposition expressed by "if it rains, the match is cancelled" changes depending on what I believe about the rain and the match, then semantics has become hostage to psychology. You aren't solving the triviality problem; you're just relocating it into the context parameter.

  **Elena:** It's not hostage; it's dynamic. Look, context always resolves semantic underdetermination. Indexicals shift, domains of quantification shift. Why is it so shocking that the selection function for a conditional shifts with the salient epistemic state? The triviality proof shows that a *static* propositional account is impossible. It doesn't show that a *dynamic* one is.

  **Marcus:** Because indexicals refer to objects in the world. What does your conditional refer to? A world-selection function that magically adjusts itself so that my degree of belief in the proposition always matches my conditional credence? It looks *ad hoc*. You've tailored the semantics specifically to dodge Lewis's proof, rather than explaining what we are actually doing when we speak. Adams got it right: we aren't stating facts. We're expressing a conditional degree of belief. Assertability tracks credence, full stop. No truth conditions needed.

  **Elena:** If there are no truth conditions, Marcus, explain the logic. What do I do when I say, "It is not the case that if it rains, the match is cancelled"? If the inner conditional isn't truth-apt, it can't fall under the scope of negation. You can't negate a command, and you can't negate an expression of credence. Yet, I can clearly deny a conditional.

  **Marcus:** I can deny it by asserting a conflicting conditional commitment. To say "It's not the case that if $A, C$" is to say that given $A$, I am not committed to $C$. It's a higher-order attitude. We don't need a truth value for the embedded clause to understand the speech act of rejection.

  **Elena:** That works for simple denial. But what about nesting? "If the butler did it, then if he used the candlestick, there will be wax on his hands." That's a conditional with a conditional in the consequent. On your view, the consequent has no truth value. So the whole sentence lacks a truth condition. But we reason with these. We assess them as valid or invalid. If they lack truth conditions, logic becomes a mystery. How can an argument be truth-preserving if the premises aren't true or false?

  **Marcus:** Logic isn't just about truth-preservation; it's about coherence of attitudes. An argument is valid if accepting the premises commits you to accepting the conclusion. I can assess the nested conditional by supposing the butler did it, and then within that supposition, assessing the link between the candlestick and the wax. I never need to assign a truth value to the conditional itself. I just update my hypothetical credences. You're forcing conditionals into the indicative mold because you're obsessed with compositionality, but you're breaking the link between meaning and use.

  **Elena:** I'm obsessed with compositionality because language is systematic. If conditionals are truth-valueless islands, how do they interact with disjunctions? "Either if $A$ then $B$, or if $C$ then $D$." Your view forces us to treat every connective as a special case of pragmatic inference. My view treats them uniformly. And regarding your charge of it being *ad hoc*: Stalnaker's move isn't just a shield against Lewis. It explains why we disagree about conditionals. We disagree because we are in different contexts, invoking different selection functions.

  **Marcus:** But does it explain why I can be wrong? If I say "If it rains, it will pour," and it rains but only drizzles, I was wrong. On your view, I expressed a proposition that turned out false. On my view, my conditional credence was miscalibrated. The difference is subtle, but yours implies there was a fact of the matter about the "selection function" independent of my evidence. That's metaphysical baggage I don't need. And let's return to the triviality result. Even if you allow the proposition to shift, you still have to explain why the *Equation* holds so robustly across contexts. If the content shifts, why does the probability of that content *always* align with the conditional probability?

  **Elena:** Because the context *determines* the content precisely to ensure that alignment. The semantic value of the conditional is constrained by the pragmatic norms of assertion. We assert "if $A, C$" only when our conditional credence is high. The semantics is designed to track that norm. That's not a bug; it's the interface between semantics and pragmatics.

  **Marcus:** "Designed to track." That's exactly my point. You've made the semantics a shadow of the pragmatics. You're positing a proposition whose only job is to have a probability equal to $P(C \mid A)$. If the only work that proposition does is mimic conditional credence, Occam's Razor suggests we should just talk about the credence. You're keeping the truth conditions as a ghost in the machine to satisfy a classical intuition about logic, while stripping them of any independent explanatory power.

  **Elena:** And you're stripping conditionals of their ability to function as premises in complex reasoning to satisfy a probabilistic intuition. If I say, "If the proposition expressed by 'if $A, C$' is false, then $Q$," I am treating the conditional as a fact. If you say I can't do that, you're telling me my linguistic intuition is a hallucination. I'd rather adjust the semantics to allow for context-shift than tell speakers they don't know what they're saying when they embed conditionals.

  **Marcus:** I'm not telling them they're hallucinating. I'm telling them they're engaging in a sophisticated practice of suppositional reasoning that doesn't require the heavy ontology of truth conditions. The "embedding" cases you love? Most of those are rare in actual discourse. When they do occur, we parse them by expanding the suppositions, not by calculating truth tables. You're solving a problem for formal logic that isn't a problem for communication.

  **Elena:** Formal logic *is* part of communication, Marcus. It's the skeleton. If the skeleton is made of jelly, the body collapses. If Stalnaker is right, the skeleton is solid, it just bends with the context.

  **Marcus:** And if Lewis is right, the skeleton doesn't exist. It's a muscle-memory of inference. You're trying to find bones where there's only cartilage.

  **Elena:** *(Finishes coffee)* Well, the seminar is over, but clearly, the triviality results haven't trivialized the debate.

  **Marcus:** *(Smiles)* No. If anything, they've conditioned us to keep arguing.

  **Elena:** Careful. If you treat that as a conditional, I'll have to ask you for its truth conditions.

  **Marcus:** And I'll ask you for your credence. Shall we test them over lunch?

  **Elena:** Only if the proposition that "lunch is good" doesn't shift depending on how hungry we are.

  **Marcus:** No promises.
