      *   *The "Hole":* The confusion is between *reference* and *existence*. Rigidity secures the *link* between name and object, not the *presence* of the object.
      *   *Contingent Existence:* Aristotle is a contingent being. He could have not been born. In those worlds, "Aristotle" doesn't refer to him because *he isn't there*. It doesn't refer to someone else.
