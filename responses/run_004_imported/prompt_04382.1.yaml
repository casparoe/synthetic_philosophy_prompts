      *   **Round 2: The Explanation/Circularity Objection (Point 1):**
          *   Arthur: If the law is just a summary of what happens, how can it *explain* what happens? That's circular. You're saying $X$ happens because $X$ happens (plus other similar things).
          *   Hannah: Push back on the notion of "explanation." Scientific explanation *is* systematization. We aren't looking for a metaphysical push, just a good map.
