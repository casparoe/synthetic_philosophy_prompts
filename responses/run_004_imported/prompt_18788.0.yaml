answer: |-
  **CLINICAL ETHICS COMMITTEE: CASE CONSULTATION OPINION**
  **Case:** Ms. R (Psychiatry Unit)
  **Date:** October 26, 2023
  **Subject:** Validity of Psychiatric Advance Directive (Ulysses Clause) vs. Contemporaneous Objection

  **Summary of Ethical Conflict**
  The Committee is asked to adjudicate a conflict between Ms. R's *precedent autonomy* (expressed in a signed Psychiatric Advance Directive [PAD] while stable) and her *current autonomy* (expressed via fluent objection during a manic episode). The PAD contains a "Ulysses clause," stipulating that objections voiced during mania are to be disregarded and authorizing her sister, as proxy, to enforce forced medication. The attending physician seeks guidance prior to the expiration of the involuntary 72-hour hold tomorrow morning.

  **Analysis: Precedent Autonomy and the Constitutional Analogy**
  We recognize the moral weight of the PAD. As discussed in the literature regarding Jon Elster's account of constitutions, the PAD functions as a precommitment strategy: the "past self" binds the "future self" to protect long-term values against temporary irrationality. In this view, honoring the PAD respects Ms. R's deeper, diachronic autonomy rather than her momentary impulses. The constitutional analogy suggests that just as a society entrenches certain laws to prevent rash amendment during crises, Ms. R entrenched her treatment preferences to prevent the "crisis" of mania from undermining her health.

  However, the Committee finds the constitutional analogy imperfect in this clinical context. A constitution is an external framework; a patient is a moral agent with continuous consciousness. The analogy holds only if the "future self" is truly incapacitated—akin to a government unable to function. Ms. R's current presentation complicates this. She is manic, yet she is arguing *fluently* against the medication. This suggests that while her mood regulation is impaired, her rational agency may not be wholly suspended.

  To treat her current objection as mere "noise" (as the Ulysses clause stipulates) risks violating the ethical principle of respect for persons. A waiver of the right to contemporaneous consent is generally considered valid only when the patient lacks decision-making capacity. If Ms. R retains the capacity to understand the risks and benefits of medication *now*, her past consent cannot ethically override her present refusal. The "Ulysses" binding is morally binding only when the "sirens" (symptoms) actually drown out reason. If she can still reason, the condition for the waiver has not been met.

  **Recommendation**
  The Committee recommends a conditional approach that prioritizes the verification of incapacity before enforcing the precommitment.

  1.  **Immediate Action:** Do **not** administer forced medication this evening based solely on the sister's invocation of the Ulysses clause.
  2.  **Capacity Re-assessment:** A formal evaluation of Ms. R's decision-making capacity regarding *this specific treatment decision* must be conducted by the attending psychiatrist or a second opinion provider **by 10:00 AM tomorrow**, prior to the expiration of the 72-hour hold.
  3.  **Enforcement Criteria:**
      *   **If Ms. R is found to lack capacity:** The Committee recommends honoring the PAD and the proxy's request, as the condition for the Ulysses clause (incapacity due to mania) is met.
      *   **If Ms. R is found to retain capacity:** Her current refusal must be respected, and the Ulysses clause should be considered void for this episode. Treatment should proceed on a voluntary basis or be discontinued.

  **Rationale for Timeframe**
  This 12-hour window balances the urgency of the expiring legal hold with the necessity of ensuring that forced medication is not administered to a capacitated individual. It respects the intent of the PAD without treating it as an absolute trump card over current human agency.

  **Signed,**
  *Clinical Ethics Committee*
  *University Hospital*
