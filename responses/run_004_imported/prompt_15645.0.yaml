answer: |-
  This is a classic pedagogical headache with this unit. You're right: once students realize "spandrel" is a magic word that absolves them of having to identify a selective pressure, they will slap it on everything from the appendix to the ability to do calculus. Conversely, if they stick to the syllabus examples, they never grapple with the *evidentiary burden* required to distinguish a spandrel from an adaptation.

  Here is a candidate that is biologically robust, distinct from the standard canon, and creates a perfect fault line for the falsifiability discussion you want.

  ### The Candidate: Syncytins and the Mammalian Placenta

  **The Trait:** The **syncytiotrophoblast** layer of the mammalian placenta. This is the outer layer of cells that interfaces directly with the maternal blood supply. Its key functional property is that it is a *syncytium*—a multinucleated cell formed by the fusion of individual cells, creating a continuous barrier without cell boundaries.

  **The Exaptation Story (Gould & Vrba):**
  This cell-fusion capability is mediated by proteins called **syncytins**. Molecular phylogenetics has revealed that syncytin genes are not originally mammalian genes at all. They are captured envelope (*env*) genes from **endogenous retroviruses (ERVs)**.

  1.  **Origin (Non-adaptive/Parasitic):** Millions of years ago, ancestral mammals were infected by retroviruses. These viruses inserted their genetic material into the host germline (becoming ERVs). The viral *env* gene's original "function" (from the virus's perspective) was to fuse the viral membrane with the host cell membrane to allow infection.
  2.  **Byproduct/Constraint:** For the host, this insertion was initially parasitic or neutral "junk DNA." It was a genomic accident—a molecular spandrel resulting from the structural vulnerability of the germline to viral insertion.
  3.  **Co-option:** At some point, the host organism co-opted this viral fusion machinery. The ability to fuse cells was repurposed to create the syncytiotrophoblast, which allows for efficient nutrient exchange and, crucially, hides the fetal DNA from the maternal immune system (since there are no cell boundaries for immune cells to recognize as "foreign").

  **Why it fits the prompt:** It is a clear case of a trait (cell fusion for placental barrier) arising from a source (viral infection) that was definitely *not* selected for that purpose in the host lineage initially. It captures the "tinkering" nature of evolution that Gould loved.

  ---

  ### The Adaptationist Comeback (The Skeptic's Story)

  To make this useful for your section, you need to steel-man the adaptationist response. A hardline adaptationist (or a skeptic of the spandrel label) could argue the following:

  1.  **Immediate Selection on Retention:** While the *infection* wasn't adaptive, the *retention and fixation* of this specific ERV sequence in the population might have been driven by immediate positive selection. If the viral insertion provided a slight reproductive advantage (e.g., better implantation) right out of the gate, it's not a "neutral byproduct" that drifted until co-option; it was selected for its function from moment one.
  2.  **Host Priming:** The host genome may have already possessed cellular machinery prone to recruiting fusion proteins. The virus didn't provide the "innovation"; it merely provided a slightly more efficient version of a mechanism the host was already evolving toward. The adaptationist argues the *drive* for a hemochorial placenta was the selective force, and the virus was just the available tool.
  3.  **Domestication as Adaptation:** The process of "domesticating" transposable elements and viral sequences is itself an evolved, adaptive trait of the mammalian genome. We have mechanisms to silence ERVs; the fact that we *didn't* silence this one suggests a higher-order adaptation to capture useful sequences. Therefore, the "exaptation" is actually part of a broader adaptive strategy of genomic plasticity.

  ---

  ### The Philosophical Punch: Adjudication and Falsifiability

  This is the part you want to drive home in discussion. Gould and Lewontin accuse adaptationists of telling unfalsifiable "just-so stories." But the "Spandrel/Exaptation" hypothesis risks becoming a "just-not-so story"—a reflexive claim that "it wasn't selected" without proof.

  **1. Can we adjudicate here?**
  Unlike the human chin (where we have no time machine and poor fossilization of soft tissue), the Syncytin case offers a potential path to adjudication: **Molecular Phylogeny.**

  *   **The Test:** We can sequence the syncytin gene and compare it to viral *env* genes across different mammalian lineages.
  *   **The Prediction (Exaptation):** If it is a true exaptation, the phylogenetic tree of the *syncytin* gene should match the *viral* tree, not the *host* tree, until the point of insertion. Furthermore, we should see independent insertion events in different lineages (e.g., primates have *Syncytin-1*, mice have *Syncytin-A*, derived from different viral infections).
  *   **The Result:** This has actually been done. Different mammalian orders co-opted *different* retroviruses independently for the same placental function. This strongly supports the exaptation story: the placenta didn't evolve *waiting* for the virus; the virus arrived, and the function was co-opted multiple times independently.

  **2. The Unfalsifiability Trap (The Meta-Discussion)**
  However, you can push your students further. Even with this molecular evidence, is it *fully* falsifiable?

  *   **The "Selection on Retention" Loophole:** The adaptationist can concede the viral origin but maintain that *fixation* was adaptive. How do we distinguish between "co-opted after drifting" vs. "co-opted and selected immediately"? If the time gap between insertion and fixation is short, the distinction blurs.
  *   **The Definition Game:** If an adaptationist defines "adaptation" broadly enough to include "the ability to co-opt random viral sequences," then *everything* becomes an adaptation again. Gould's critique relies on a specific definition of adaptation (trait shaped by selection *for* its current use). If students loosen that definition, the Spandrel paper loses its bite.
  *   **The Reflexive Spandrel:** Conversely, if students see a trait that looks "messy" or "derived from junk," do they automatically label it a spandrel without testing the null hypothesis (that it was selected)?

  **Discussion Questions for Section:**
  1.  **Evidence Threshold:** What kind of evidence would we need to accept the Syncytin case as a *spandrel* (non-adaptive origin) versus an *exaptation* (co-opted trait)? Do students realize these are slightly different categories in the 1982 paper?
  2.  **The "Just-So" Mirror:** Gould mocks adaptationists for stories that can't be tested. Is the claim "This viral sequence was neutral until co-opted" any more testable than "This trait was selected for fitness"? Does molecular phylogeny solve this, or just push the problem back one step?
  3.  **Function vs. Effect:** In the 1979 paper, Gould distinguishes between current utility and evolutionary origin. If the viral gene *now* saves the pregnancy from immune rejection, does it matter if it started as a parasite? Why does the *history* matter for the definition of "adaptation"?

  ### Why this works for your problem
  *   **Novelty:** It is highly unlikely undergrads have encountered endogenous retroviral domestication in intro bio.
  *   **Complexity:** It forces them to move beyond "bone shape" thinking to molecular/genetic thinking.
  *   **Philosophical Richness:** It directly addresses the "origin vs. maintenance" distinction that is crucial to the Exaptation paper but often glossed over in favor of the flashier Spandrels paper.
  *   **Resolution:** Unlike the chin or orgasm, there is actual empirical data (phylogenetics) that leans heavily one way, allowing you to discuss *why* that data counts, rather than just trading intuitions.

  This example respects the students' intelligence while preventing them from recycling the "feather" script. It forces them to engage with the *methodology* of evolutionary inference, which is ultimately the philosophical core of the unit.
