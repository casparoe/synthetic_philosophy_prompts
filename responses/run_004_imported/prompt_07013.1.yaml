          *   Define Revealed Preference (Samuelson).
          *   State the problem: Is this a scientific theory or a circular definition?
          *   Thesis Statement: While revealed preference provides a rigorous *descriptive* framework for consistency, it fails as a *normative* guide for well-being because it cannot distinguish between preference satisfaction and actual welfare, particularly in light of Sen's critique of commitment and sympathy.
      *   **Section 1: The Tautology Charge vs. The Consistency Defense.**
          *   Explain the tautology argument (anything can be rationalized).
          *   Explain the defense (axioms like WARP/SARP are falsifiable).
          *   Evaluation: It saves the *positive* science (prediction) but doesn't save the *normative* content (welfare).
      *   **Section 2: Amartya Sen's Critique (The Substance of Choice).**
          *   Explain the distinction: Preference vs. Well-being.
