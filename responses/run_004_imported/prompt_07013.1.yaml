      *   **Core Conflict:** Is RPT a substantive theory or a tautology?
          *   *Charge:* It's tautological. Any consistent behavior can be redescribed as maximizing *some* utility function. It empties "utility" of content.
          *   *Reply:* Consistency axioms (transitivity, etc.) are falsifiable constraints. It's not just relabeling; it restricts what behavior is allowed.
      *   **Secondary Conflict (Sen's Objection):** Choice data cannot distinguish between self-interest, sympathy, or commitment. If "utility" = "well-being," RPT fails because people choose things that lower their well-being out of duty or altruism.
      *   **Task:** Write an essay weighing these arguments.
      *   **Requirement:** Reach and defend a *specific conclusion* about whether "utility" (defined purely via revealed preference) can do normative work (guide policy/well-being) or if it's merely descriptive (consistency).

  2.  **Outline and Structure:**
      *   **Title:** Needs to be engaging and relevant (e.g., "The Empty Utility," "Clicks vs. Conscience").
      *   **Introduction:**
