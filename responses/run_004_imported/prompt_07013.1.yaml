answer: |-
  **The Empty Maximand: Why Revealed Preference Cannot Measure Well-Being**

  In the technology sector, specifically within ranking and recommendation systems, a pragmatic orthodoxy reigns: trust the click, not the survey. If a user says they want educational content but spends three hours watching short-form entertainment, the system optimizes for the entertainment. The justification is that behavior is a truer signal of desire than speech. This engineering heuristic is the direct descendant of the "Revealed Preference Theory" (RPT) introduced by Paul Samuelson in 1938. Samuelson sought to purge economics of psychological speculation, arguing that we need not know what is happening inside a consumer's mind; we need only observe their choices under constraints.

  However, this approach inherits a decades-old philosophical dispute from economics. Critics charge that defining utility solely through choice renders the theory of utility maximization a tautology: if utility is defined as "whatever is chosen," then "people choose what maximizes utility" is true by definition, offering no explanatory power. Defenders reply that the axioms of consistency (such as transitivity) impose falsifiable constraints on behavior. Beyond this logical debate lies a deeper normative objection, most famously articulated by Amartya Sen: choice data cannot distinguish between what benefits a person and what they merely choose, often due to commitment or social pressure.

  Weighing these arguments leads to a specific conclusion: while revealed preference provides a robust *descriptive* framework for modeling behavioral consistency, it is fundamentally incapable of doing the *normative* work economists often assign to it. Defined purely through revealed preference, "utility" can describe rationality, but it cannot measure well-being.

  ### The Tautology Charge and the Consistency Defense

  The charge of tautology is the most common philosophical objection to revealed preference. If an economist claims a consumer maximizes utility, and then defines utility as "that which the consumer maximizes," the argument circles back on itself. Any observed behavior, no matter how eccentric, can be rationalized after the fact by positing a utility function that assigns the highest value to the chosen option. If a person burns money, the theorist can simply assert they derived utility from burning money. In this light, RPT appears to empty the term "utility" of all content, transforming a theory of human motivation into a linguistic trick.

  The standard defense against this charge relies on the mathematical axioms of choice, such as the Weak Axiom of Revealed Preference (WARP). These axioms require consistency. If a consumer chooses bundle A over bundle B when both are affordable, they should not choose B over A when both are still affordable. If they violate this, they cannot be described as maximizing *any* utility function. Therefore, the theory is falsifiable: we can observe intransitive or cyclical choices (A > B > C > A) that break the model.

  This defense is successful in saving RPT as a *positive* science. It allows economists and engineers to predict behavior based on past consistency. If a user's clicks are internally consistent, we can model them as an optimization process. However, this victory is limited to prediction. It confirms that the agent is acting *as if* they have a goal, but it remains silent on whether that goal corresponds to anything resembling happiness, satisfaction, or welfare. The consistency defense saves the theory from being empty of *logic*, but it does not save it from being empty of *meaning* regarding human welfare.

  ### Sen's Critique: The Fool and the Commitment

  The limitation of RPT becomes critical when we move from prediction to welfare analysis. This is the domain of Amartya Sen's critique. In his seminal paper "Rational Fools" (1977), Sen argued that RPT conflates "choice" with "welfare." For RPT to work as a guide for well-being, we must assume that when a person chooses X over Y, X makes them better off than Y. Sen demonstrated that this assumption fails when choices are driven by sympathy or commitment.

  Sympathy occurs when a person's welfare increases because someone else's welfare increases. This can technically be modeled within RPT (by including others' welfare in the utility function). Commitment is the true breaker of the model. Commitment occurs when a person chooses an act because they believe it is right, even though they believe it will lower their personal welfare.

  Sen offers the example of a person choosing a smaller apple from a basket, leaving the larger one for others. If asked, they might admit they wanted the larger apple (welfare) but chose the smaller one (choice) due to a social norm or moral commitment. RPT forces us to record that the person "preferred" the smaller apple. If we later use that data to optimize for their well-being—for instance, a recommendation system or a public policy—we would erroneously serve them smaller apples, assuming that is what makes them happy. We have optimized for their consistency, not their good.

  In the context of modern technology, this distinction is vital. A user may click on outrage-inducing content (revealed preference) due to a psychological compulsion they actively regret (welfare). If a recommendation system treats the click as the ultimate signal of utility, it reinforces a behavior that lowers the user's long-term well-being. The system sees a consistent maximizer; the human experiences a conflict between impulse and interest. RPT lacks the vocabulary to describe this conflict, let alone resolve it.

  ### The Normative Bankruptcy of Revealed Utility

  The crux of the issue lies in what we want "utility" to do. In positive economics, utility is a placeholder for "the thing being maximized." In normative economics and welfare policy, utility is a proxy for "the good life." Revealed preference works for the former but fails the latter.

  If utility is defined purely by revealed preference, we lose the ability to make paternalistic judgments, even benign ones. We cannot say a drug addict is harming themselves, because their choice to consume reveals a preference for consumption. We cannot say a worker is exploited if they "choose" unsafe labor, because the choice reveals the trade-off was acceptable to them. The theory renders all chosen outcomes optimal by definition. This is useful for a market model that wishes to remain value-neutral, but it is disastrous for any system designed to improve human outcomes.

  For the recommendation engineer, this implies that optimizing for engagement (a revealed preference metric) is not synonymous with optimizing for user satisfaction (a welfare metric). A user may consistently click on content that makes them anxious or depressed. RPT describes this as utility maximization; a welfare-based view describes it as a failure of self-regulation. By adhering strictly to revealed preference, the engineer adopts a theory that cannot distinguish between fulfillment and addiction.

  ### Conclusion

  The charge that revealed preference makes utility maximization tautological is partially deflected by the consistency axioms; the theory is not logically empty because it rules out inconsistent behavior. However, the theory remains *normatively* empty. It successfully models the structure of choice but fails to capture the substance of well-being.

  Amartya Sen's objection seals this verdict. Because choice data cannot distinguish between preferences that enhance welfare and commitments that override it, "utility" defined purely through revealed preference cannot do the normative work economists and technologists often want from it. It can tell us if a user is consistent, but it cannot tell us if a user is happy.

  Therefore, we must conclude that revealed preference is a tool for describing *rationality*, not *welfare*. If ranking systems and economic policies aim to improve human well-being rather than merely mirror existing behaviors, they cannot rely on revealed preference alone. They must reintroduce external metrics of welfare—perhaps through stated preferences, longitudinal well-being surveys, or ethical constraints—that stand independent of the immediate choice. To treat the click as the final word on utility is to mistake the map for the territory, optimizing for the consistency of the user's actions while potentially ignoring the quality of their life.
