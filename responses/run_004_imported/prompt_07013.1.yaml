  8.  **Finalizing the Title:** "The Mirror and the Map: Revealed Preference, Rationality, and the Limits of Utility." Or "Clicks vs. Conscience." Let's go with something that highlights the tension. "The Empty Maximand: Why Revealed Preference Cannot Measure Well-Being."

