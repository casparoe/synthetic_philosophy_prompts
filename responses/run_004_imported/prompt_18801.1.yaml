answer: |-
  "It's the regress," Alex said, stirring cold coffee. "Strawson's Basic Argument. To be truly responsible for an act, I must be responsible for the mental state that caused it. But I didn't choose that state. I can't be *causa sui*. So, nothing is truly my fault."

  Jamie leaned forward. "You're chasing 'ultimate' responsibility. But moral responsibility isn't about being the unmoved mover. It's about guidance control. Fischer and Ravizza nailed this. Are you reasons-responsive? Can you recognize moral reasons and adjust your behavior accordingly? If yes, you're responsible."

  "But where does that capacity come from?" Alex countered. "If my reasons-responsiveness is just the product of genes and a lucky upbringing, I'm still not the source. Here's the killer: Imagine a neuroscientist implants a chip that makes you perfectly reasons-responsive. You react to moral cues exactly like a good person. Are you responsible for actions driven by the chip?"

  "No," Jamie admitted. "Because the mechanism isn't yours. You haven't taken ownership of it."

  "Exactly. But why? In a deterministic world, my 'ownership' is just the result of prior causes—my parents teaching me to reflect. That's just slow manipulation by nature instead of a scientist. If the scientist's intervention kills responsibility, why doesn't determinism?"

  Jamie paused. "Because ownership isn't a metaphysical spark; it's a history. To own a mechanism, you must have viewed yourself as an agent in the past. You accepted praise or blame, and that shaped your neural pathways. The chip victim lacks that history. They haven't participated in the moral community. Their mechanism was imposed; yours was cultivated through interaction."

  "But they couldn't have," Alex pressed. "Their history was written by physics. If I had a different childhood, I couldn't 'view myself as an agent.' My ability to take ownership is itself luck. Strawson wins because every layer of 'ownership' rests on a layer I didn't choose. The difference between the chip and my childhood is just duration, not kind."

  "I grant you don't choose the *capacity*," Jamie said. "But responsibility isn't about the capacity's origin. It's about its exercise. When we hold you accountable, we aren't judging your soul's origin. We're engaging with your reasons-responsive mechanism. We're saying, 'You understand this norm, and you violated it.' That relationship is real, even if determinism is true. The manipulation case fails because the agent was bypassed; in normal development, the agent is the medium."

  "So it's pragmatic?" Alex asked. "A useful fiction?"

  "No. It's constitutive," Jamie insisted. "Being responsible is what it *means* to be a person among persons. If we stop holding each other responsible because of the regress, we stop treating each other as agents. We become objects. The regress shows we aren't gods, not that we aren't people."

  Alex sighed. "I get that. Practically, we have to act as if it's real. But metaphysically? It still feels like we're punishing people for being the end of a causal chain they didn't start. The defendant I saw... his childhood made 'ownership' almost impossible."

  "Then we adjust our blame," Jamie said. "Reasons-responsiveness comes in degrees. But we can't abolish the concept without abolishing ourselves."

  "Maybe," Alex said. "But it's hard to look at the chain and not see luck."
