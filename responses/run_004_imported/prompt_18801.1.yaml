      Jamie paused. "Because ownership isn't a metaphysical spark; it's a history. To own a mechanism, you must have viewed yourself as an agent in the past. You accepted praise or blame, and that shaped your neural pathways. The chip victim lacks that history. They haven't participated in the moral community."

