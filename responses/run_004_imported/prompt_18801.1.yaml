      "It's the regress," Alex said, stirring coffee. "Strawson's Basic Argument. To be responsible for an act, I must be responsible for the mental state that caused it. But I didn't choose that state. I can't be *causa sui*. So, nothing is truly my fault."

      Jamie leaned forward. "You're chasing 'ultimate' responsibility. But moral responsibility isn't about being the unmoved mover. It's about guidance control. Fischer and Ravizza nailed this. Are you reasons-responsive? Can you recognize moral reasons and adjust your behavior accordingly? If yes, you're responsible."

