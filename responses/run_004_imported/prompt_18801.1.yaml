      "I grant you don't choose the *capacity*," Jamie said. "But responsibility isn't about the capacity's origin. It's about its exercise. When we hold you accountable, we aren't judging your soul's origin. We're engaging with your reasons-responsive mechanism. We're saying, 'You understand this norm, and you violated it.' That relationship is real, even if determinism is true."

