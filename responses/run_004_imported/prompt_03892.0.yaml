          *   *Weaknesses:* Shewmon's data is controversial/outlier-heavy. Doesn't fully address *how* that integration is sustained (external vs. internal).
          *   *Verdict:* Strong empirical challenge. Puts pressure on Jonah's definition of integration.

      *   **Move (3) Jonah:** Distinguishes between "real" integration and "machine-propped" processes. Cites diabetes insipidus (pituitary failure) requiring synthetic hormones. Claims machines/drugs are the integrators now.
          *   *Strengths:* Acknowledges the counter-evidence but reframes the *source* of integration (external vs. internal). Accurate regarding hormonal collapse.
          *   *Weaknesses:* Risks moving the goalposts. Is hormonal regulation essential for "organismal" life?
          *   *Verdict:* Good defensive move, clarifies the "internal vs. external" distinction.

