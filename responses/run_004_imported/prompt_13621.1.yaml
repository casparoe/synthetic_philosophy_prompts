answer: |-
  **Setting:** *A living room, half-unpacked. A large wooden desk sits against the wall, with a matching hutch screwed into the top. A milk crate full of vinyl records leans against it. ALEX is holding a clipboard and a pen. BLAKE is sitting on the floor, peeling a label off a box.*

  **Alex:** (Tapping the clipboard) Okay, line item four. "Large Furniture." I'm writing "Desk with Hutch." One item.

  **Blake:** You can't do that.

  **Alex:** Why not? We bought them together. They're screwed together. We've never moved them separately.

  **Blake:** Because they aren't *one thing*, Alex. They're two things fastened together. If you unscrew the bolts, the hutch stays a hutch and the desk stays a desk. Composition isn't automatic just because you own an Allen wrench.

  **Alex:** Oh, here we go. The Special Composition Question, right at 7 PM on a Tuesday. Look, for the insurance company, it's one functional unit. If a fire burns it, it burns as one lump.

  **Blake:** Function isn't ontology. Just because they burn together doesn't mean they *are* together. Think about the records. (Points to the crate) Are you going to write "Stack of Records" as one item?

  **Alex:** I was going to write "Vinyl Collection – Approx. 20 units."

  **Blake:** See! You admit it. Twenty units. Not one "stack." The stack is just the records arranged vertically. There is no "stack" object over and above the records. So why is the desk different?

  **Alex:** Because the desk and hutch are fastened. The records are just leaning.

  **Blake:** Fastening is just a specific arrangement of simples. Wood fibers touching metal bolts. If I glue the records together, do they become one object?

  **Alex:** Practically? Yes. Metaphysically? You're asking me to care about "simples." I don't have simples. I have furniture.

  **Blake:** That's the issue, isn't it? You think because our language has a word for "desk," there must be a corresponding object in the world. But reality doesn't care about our nouns. There are just particles arranged desk-wise.

  **Alex:** (Sighs, puts the clipboard down) Okay, stop. You're sounding like Sider again. "Particles arranged desk-wise." It's a paraphrase strategy. You're saying "The desk exists" is false, but "Particles are arranged desk-wise" is true.

  **Blake:** I'm saying the second sentence captures the structure of reality. The first one is a convenient fiction.

  **Alex:** Convenient fictions are what we use to file insurance claims! But seriously, Blake, this feels like a verbal dispute. When I say "There exists a desk," I'm using a broad sense of "exists." One that includes composite artifacts. When you say "There does not exist a desk," you're using a narrow, fundamental sense. We aren't disagreeing about the world. We're disagreeing about which language game to play. It's quantifier variance.

  **Blake:** Quantifier variance is a cop-out. It's the idea that "exists" is ambiguous, like "bank" (river or money). You're saying there's the "common sense" exists and the "metaphysical" exists, and both are valid.

  **Alex:** Exactly. My quantifier ranges over desks, hutches, and stacks. Yours ranges only over simples. Both are consistent. Neither is wrong. We're just speaking different dialects of Ontologese.

  **Blake:** But one dialect carves nature at the joints. And the other draws lines in the sand. Look, if we're doing metaphysics—if we're asking what *really* is there—we aren't asking what's useful for insurance. We're asking about the fundamental structure of reality. Does the world contain a desk-object? Or does it contain wood-particles?

  **Alex:** Why assume there *is* a "fundamental structure" independent of our conceptual scheme? That's the dogma you need to defend. Sider says there's a privileged structure, a "joint-carving" quantifier. But why? Because it's hard? Because it's physics-y?

  **Blake:** Because if there isn't a privileged structure, then anything goes. If your broad quantifier is just as "true" as mine, then why stop at desks? Why not say "The Desk-Plus-Cat" is an object? It's a collection of particles.

  **Alex:** I *do* say that. If the cat is sleeping on the desk, and I insure them as a unit, sure. Universalism is consistent. Composition is always possible. If you have parts, you have a whole.

  **Blake:** That's absurd. It trivializes existence. If "The Desk-Plus-Cat" exists just as much as the desk, then the word "exists" loses all explanatory power. It doesn't tell me anything about unity. It just tells me there are some particles there.

  **Alex:** It tells you about *our* unity. Look, the reason you're a Nihilist about artifacts is because you think vagueness is impossible. You think if "desk" is a real object, there must be a precise moment when the particles become a desk. Since there isn't, desks don't exist.

  **Blake:** Precisely. Identity is absolute. Existence is absolute. Vagueness is in the mind, not in the world.

  **Alex:** And I'm saying that's a category error. You're trying to apply the logic of mathematics to furniture. "Exists" is context-sensitive. In the context of insurance, the desk exists. In the context of high-energy physics, it doesn't. Neither context is the "One True Context."

  **Blake:** But metaphysics *aims* for the One True Context. Or at least, the most fundamental one. If you say the dispute is merely verbal, you're saying we could just stipulate definitions and move on. "Let's agree to call the particles arranged desk-wise a 'desk'." But that's not what you're doing. You're claiming the desk is *ontologically robust*.

  **Alex:** I'm claiming it's as robust as anything gets! What's more robust than a desk?

  **Blake:** The particles. The particles persist through the destruction of the desk. The desk is dependent.

  **Alex:** Dependence isn't non-existence. My shadow depends on me, but it exists. The desk depends on the wood, but it exists. You're conflating "fundamental" with "real."

  **Blake:** I'm conflating them because fundamentality is the measure of reality in metaphysics. If your ontology commits you to objects whose boundaries are vague, and whose existence depends on human intentions (like "fastening"), then your ontology is mind-dependent.

  **Alex:** And if your ontology commits you to a world with no chairs, no desks, and no people—only simples—then your ontology is useless for describing the human experience.

  **Blake:** Metaphysics isn't self-help, Alex. It's not supposed to be useful. It's supposed to be true.

  **Alex:** (Picks up the pen) But truth is normative. If I say "There is a desk" and you say "There is no desk," and we both agree on the arrangement of the wood, the weight, the history, and the function... what factual content is left?

  **Blake:** The factual content is the quantifier! $\exists x (Desk x)$. Is that sentence true in the canonical notation of the world?

  **Alex:** There is no "canonical notation of the world." That's the myth. There's just notation for specific purposes. You want to say my quantifier is "easy" and yours is "hard." But hardness isn't a virtue of truth.

  **Blake:** Joint-carving is a virtue. If I use the quantifier that aligns with the causal structure of the universe, I'm getting closer to the truth. You're using a quantifier that aligns with... IKEA manuals.

  **Alex:** IKEA manuals are how we navigate the world! Causal structure is how we blow it up. Look, if we call this a verbal dispute, we don't have to fight. We can say: In the *common sense* domain, the desk exists. In the *fundamental* domain, it doesn't. Hirsch would say my common sense domain is perfectly legitimate. It's not an error theory.

  **Blake:** Hirsch is wrong. Because if you're right, then the Nihilist isn't actually denying the desk. They're just speaking a different dialect. But when I say "Desks don't exist," I mean I deny your claim. I'm not translating. I'm negating.

  **Alex:** But you can't negate it without accepting my terms! To deny the desk, you have to engage with the concept of "desk." If you truly believed only simples exist, you wouldn't even bother saying "No desk." You'd just say "Simples here." The fact that you're arguing proves you're operating in a shared linguistic space where "desk" is a valid term to reject.

  **Blake:** (Pauses, picks up a record) I'm operating in your space to correct you. Like a physicist telling a child "The sun doesn't actually rise." The child speaks the phenomenological language. The physicist speaks the fundamental language. The child isn't *wrong* about their experience, but they are wrong about the cosmos.

  **Alex:** But the sun rising *is* a real phenomenon relative to the earth's surface. It's not an illusion. It's frame-dependent.

  **Blake:** Existence isn't frame-dependent.

  **Alex:** Why not? Relativity taught us time is frame-dependent. Why is ontology the one place where we get a God's-eye view?

  **Blake:** Because without a God's-eye view, we can't compare the frames! If everything is relative to a conceptual scheme, then metaphysics collapses into anthropology. We're just studying how humans talk, not how the world is.

  **Alex:** Maybe that's all metaphysics ever was. Studying how we carve the world.

  **Blake:** (Stands up, walks to the desk) Touch the hutch. Is it hard?

  **Alex:** Yes.

  **Blake:** Is the wood hard?

  **Alex:** Yes.

  **Blake:** The hardness is in the particles. The "hutch-ness" is in your head.

  **Alex:** The "hutch-ness" is in the function. And function is in the world, not just my head. A trap exists for a mouse even if the mouse doesn't understand "trap."

  **Blake:** A trap is just particles arranged to cause a cessation of mouse-life. You don't need a "trap object" to explain the mouse dying.

  **Alex:** You don't need a "desk object" to explain my laptop staying off the floor, either. But positing the desk is the most efficient way to describe the causal powers of that region of space-time.

  **Blake:** Efficiency isn't truth. Phlogiston was efficient.

  **Alex:** Phlogiston was false because it didn't predict anything. The desk predicts that if I put my coffee here, it won't fall.

  **Blake:** (Smiles slightly) The *particles* predict that.

  **Alex:** God, you're exhausting. (Looks at the clipboard) So, line item four. If I write "Desk," you're going to tell me I'm lying to the insurance company?

  **Blake:** I'll tell you you're speaking the common dialect. They speak the common dialect. They will accept the claim.

  **Alex:** So the claim is "true enough."

  **Blake:** It's true relative to the insurance context. But don't ask me to sign an affidavit saying "There exists a composite object known as a desk" in a metaphysical court.

  **Alex:** There is no metaphysical court. That's the point! There's just us, the apartment, and the form. (Writes "Desk & Hutch (1)" on the line).

  **Blake:** You're a pragmatic universalist.

  **Alex:** And you're a fundamentalist nihilist. And we're both going to sleep in this room tonight.

  **Blake:** (Sits back down) As long as we agree that "we" are just simples arranged person-wise.

  **Alex:** Don't start. Just hand me the tape.

  **Blake:** (Hands over the tape) Arranged tape-wise.

  **Alex:** (Laughs) Shut up.

  *(Alex tapes the box. Blake watches the particles. The desk remains, regardless of the count.)*
