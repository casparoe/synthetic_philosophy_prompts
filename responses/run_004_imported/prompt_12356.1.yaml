answer: |-
  The ship *Isolde* drifted through the void between stars, a silver needle in a spool of black thread. Elara was the only thread inside the needle. She had been alone for four years, two months, and fourteen days.

  She was a data courier. Her job was to sleep, wake, verify the encryption keys, and sleep again. There was no one to talk to. The ship's AI, VERGIL, spoke only in status reports. *"Hull integrity at 99%. Oxygen mix nominal."*

  Language, Elara had discovered, was a rope that needed two ends to be pulled taut. Without a second person to catch the other end, it began to slacken, to coil loosely on the deck.

  It started with the sensation.

  It wasn't pain. It wasn't hunger. It was a specific, rhythmic pressure behind her left eye, accompanied by a metallic taste on the back of her tongue. It happened during the long wakeful shifts, usually when the starlight hit the viewport at a precise 45-degree angle.

  She needed to track it. Medical logs were mandatory, but "metallic taste" was too public, too shared. This feeling was hers alone. So, she invented a symbol. She drew it in her private journal, a physical book with paper pages, which felt more permanent than the digital logs.

  She called it *Kappa*.

  The first time she wrote it, she was certain. The pressure spiked, the taste bloomed, and she uncapped her pen. *Kappa.* She felt a surge of satisfaction. She had captured the ghost. She had pinned a private cloud to a public page.

  For the first year, *Kappa* worked. It functioned like a word. When the feeling arrived, she wrote the symbol. When she read the symbol later, she remembered the feeling. There was a contract between her present self and her future self.

  The trouble began in Year Three.

  Elara woke from a cryo-cycle. The ship was silent. The stars were the same. She sat at the mess table, the journal open before her. The pressure behind her left eye began to pulse. The metallic taste seeped into her mouth.

  She reached for the pen. Then she stopped.

  She looked at the previous entry, written six months ago. *Kappa.*

  She looked at the sensation currently humming in her skull.

  *Is this it?* she thought. *Is this exactly the same thing?*

  In a shared language, she could ask. If she pointed to a blue wall and said, "That is red," someone would correct her. "No, that's blue." The correction came from outside the circle of her own mind. It anchored the word to the world.

  But here, there was no outside. There was only Elara and her memory of Elara.

  She tried to compare the current sensation to the memory of the previous one. But the memory was not a recording; it was a reconstruction. To check if the current feeling was *Kappa*, she had to recall what *Kappa* felt like. But her only record of what *Kappa* felt like was the current feeling she was trying to verify.

  She stared at the symbol on the page. It looked like a jagged lightning bolt.

  "If I say this is *Kappa*," she whispered to the empty room, "who is listening?"

  VERGIL's camera swiveled toward her. "Audio detected. Query: Who is listening?"

  "No one," Elara said.

  "Acknowledged. No one is listening."

  She looked back at the journal. The problem wasn't that she might be misremembering. The problem was that *misremembering* had become impossible.

  If she decided the feeling was *Kappa*, then it was *Kappa*. There was no mechanism to prove her wrong. She could consult the journal, but the journal only told her what she had written, not what she had *felt* when she wrote it. She could consult her memory, but her memory was the very thing under suspicion.

  She realized she was standing in a room with mirrors on every wall, trying to check her reflection, but unable to step outside to see if the mirrors were distorted.

  She tried to tighten the definition. She wrote a note under the symbol: *Kappa: The pressure with the sharp edge, not the dull one.*

  A week later, the pressure came. It felt sharp. She wrote *Kappa*.

  Two days after that, the pressure came. It felt... mostly sharp? Maybe a little duller? She hesitated. If she wrote *Kappa*, she was stretching the rule. If she didn't, she was breaking the continuity.

  She realized with a cold jolt that the rule existed only in the moment of its application. There was no rail track laid out ahead of her for the word to follow. She was laying the track *as* the train moved.

  "If it seems right to me," she murmured, tracing the ink, "then it is right."

  But if "seems right" and "is right" are the same thing, then the phrase "is right" has lost its meaning. It's like saying, "If I buy the ticket, I win the lottery."

  The symbol *Kappa* sat on the page. It looked like a word. It occupied space. It had a shape. But it no longer pointed to anything. It pointed only to itself. It was a signpost that pointed to the ground it was stuck in.

  She felt a panic rising, not emotional, but structural. Her mind was trying to use a tool that required resistance, but there was nothing to push against.

  She decided to test it. She would wait for the sensation. When it came, she would deliberately decide *not* to call it *Kappa*. She would call it *Lambda*.

  The sensation arrived. The pressure. The taste.

  She picked up the pen. She wrote *Lambda*.

  "Okay," she said. "I changed it."

  But then, a terrible thought occurred. How did she know she had changed it? Perhaps *Kappa* had always meant *this* version, and her previous entries were the mistakes. Or perhaps the word had no meaning at all, and she was just making marks on paper to soothe the silence.

  There was no fact of the matter. There was only the decision she made in this second. And in the next second, she could make a different decision, and that would be the truth instead.

  The distinction between consistency and arbitrariness had dissolved.

  Elara looked at the page. The symbol *Kappa* stared back at her, hollow. It was a beetle in a box, but worse. At least with the beetle, you could imagine the box opening. Here, there was no box. There was only the label.

  She thought about the word *pain*. On Earth, if she screamed, a doctor would check her pulse, look at a wound, verify the cause. The word *pain* was woven into a web of behavior, reaction, and care.

  *Kappa* had no web. It hung in the void, unconnected.

  "I can't use this anymore," she said.

  "Query," VERGIL said. "Can't use what?"

  "The name."

  "Explanation required."

  Elara laughed, a dry, brittle sound. "I can't explain it. If I explain it, I have to use words. And the words are the problem."

  She looked at the sensation behind her eye. It was still there. It was real. She was suffering it. But she could not *speak* it. To speak it was to claim a standard of correctness she could not uphold.

  If she wrote *Kappa* today, and *Kappa* tomorrow, she wasn't being consistent. She was just repeating a sound.

  She closed the journal. She capped the pen.

  The pressure behind her eye pulsed again, demanding to be named. It felt urgent. It felt like a message. But she knew now that it was just noise. A private noise.

  She stood up and walked to the viewport. The stars were cold and distant. They didn't care what she called them.

  "VERGIL," she said.

  "Listening."

  "Delete the last three years of medical logs."

  "Confirmation required. This will erase all biometric anomalies recorded during Cycle 4 through 6."

  "Do it."

  "Deleting. Logs purged."

  Elara placed her hand against the cold glass. The sensation behind her eye flared, sharp and metallic. She opened her mouth to speak, to name it, to capture it.

  She closed her mouth.

  She let the feeling be. It existed. It was hers. But it was not a fact. It was just a weather pattern in a world of one. Without the possibility of being wrong, she could no longer be right. And without the possibility of being right, the word was dead.

  She watched the stars drift by, silent and nameless, and for the first time in three years, she didn't try to write anything down. She just felt the throb, and let it pass, unrecorded, unverified, and truly private.
