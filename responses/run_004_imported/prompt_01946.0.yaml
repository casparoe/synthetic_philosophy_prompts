answer: |-
  **The Presumptuous and the Doomed**
  *A Dialogue on Anthropics*

  **Characters:**
  **ELENA:** Defends the Self-Sampling Assumption (SSA).
  **MARCUS:** Defends the Self-Indication Assumption (SIA).

  **Setting:** *The hotel bar, late evening. The noise of the conference has thinned out. Elena is stirring a drink; Marcus is leaning forward, energized.*

  **ELENA:** I have to say, Marcus, your response to the Presumptuous Philosopher was… bold.

  **MARCUS:** You mean the case where Theory T1 predicts a trillion observers and T2 predicts a trillion trillion, and the philosopher concludes T2 is a trillion times more likely before running a single experiment?

  **ELENA:** Exactly. You stood there and admitted that, on your view, the philosopher is rational. You're willing to let armchair reasoning about observer counts override empirical priors. It feels like magic. It suggests we can confirm physical theories just by hoping the universe is crowded.

  **MARCUS:** It's not magic, Elena; it's Bayesianism applied to *me*. Look, if T2 is true, there are a trillion times more "slots" for observers to occupy than in T1. If I assume I'm a random observer from the set of all possible observers, I am simply a trillion times more likely to find myself in T2. Ignoring that is ignoring the data of my own existence.

  **ELENA:** But that data shouldn't carry that much weight! If T2 also posits invisible, causally disconnected galaxies teeming with life, you're boosting the probability of T2 solely because it's populous. You're making cosmology a popularity contest. My view, SSA, avoids this. I sample from the *actual* observers in my reference class. I don't get to count merely possible observers to boost a theory's credence.

  **MARCUS:** And in avoiding presumptuousness, you walk straight into the Doomsday Argument.

  **ELENA:** *[Sighs]* I was wondering when you'd bring that up.

  **MARCUS:** Come on. On SSA, if you find yourself early in the human birth rank—which we all are—you have to update toward hypotheses where the total number of humans is small. It implies human extinction is likely to come soon, purely based on your birth order. That's not just counter-intuitive; it's empirically reckless. You're predicting the end of the world from an armchair, just as much as I'm predicting a crowded universe.

  **ELENA:** The Doomsday conclusion is uncomfortable, I grant you. But it's not a prediction of imminent death. It's a shift in priors. We might have other evidence—technological resilience, lack of immediate threats—that pushes the probability back. SSA just says we shouldn't assume *a priori* that we are in a uniquely long-lived civilization. As for the Presumptuous Philosopher, I'd rather bite the Doomsday bullet than accept that we can confirm string theory variants by counting how many observers they allow.

  **MARCUS:** The bullet is bigger than you think. It's the Reference Class problem. Who counts? *Homo sapiens*? What about post-humans? If you expand the class to include future evolved beings, your birth rank moves way back, and the Doomsday pressure vanishes. But then you have to explain why *they* are in your class but a chimpanzee isn't. Where do you draw the line? It feels entirely arbitrary.

  **ELENA:** It's not arbitrary; it's constrained by evidence. The reference class is "observers with evidence relevantly similar to mine." A chimpanzee doesn't have my epistemic state. A post-human might, but if they don't exist yet, they aren't in the pool of *actual* observers I'm sampling from.

  **MARCUS:** "Actually existing" is doing all the work there, and it's circular. You define the class to avoid the conclusion you dislike. With SIA, I don't need to carve nature at these joints. Every potential observer counts. It's cleaner.

  **ELENA:** Cleaner, but empirically unmoored. Let's test this consistency. Sleeping Beauty.

  **MARCUS:** Ah. The coin toss. Heads: one awakening. Tails: two awakenings. Beauty wakes up. What's her credence in Heads?

  **ELENA:** I'm a Halfer. The coin is fair. She learns nothing new upon waking that distinguishes the worlds, other than the fact that she exists, which she knew would happen anyway.

  **MARCUS:** And I'm a Thirder. There are three possible awakenings: Heads-Monday, Tails-Monday, Tails-Tuesday. She is equally likely to be in any of them. Two involve Tails. So 2/3. This follows directly from SIA. More observer-moments in the Tails world means I'm more likely to be in one.

  **ELENA:** But here's the worry for *both* of us. Bostrom—my own camp's champion—argues for Thirding *using* SSA. He treats the reference class as "awakenings," not "people."

  **MARCUS:** Precisely. And that should terrify you. If you tweak your reference class in Sleeping Beauty to get the "right" answer (Thirding), why can't I tweak it in the Doomsday Argument to get the "right" answer (no extinction)?

  **ELENA:** Because in Sleeping Beauty, the awakenings are causally distinct experiences within the experiment. In Doomsday, the future humans don't exist yet.

  **MARCUS:** But on SIA, possibility spaces matter. If you allow your reference class to shift based on what yields intuitive results, you're not doing formal epistemology; you're doing damage control.

  **ELENA:** And if you allow mere possibility to drive credence, you're doing theology. Look, Marcus, admit the cost. SIA saves you from Doomsday, but it makes you a Presumptuous Philosopher. You have to accept that a theory predicting infinite observers gets probability 1, effectively shutting down empirical cosmology.

  **MARCUS:** And you have to admit the cost, Elena. SSA saves you from Presumptuousness, but it leaves you with a Reference Class problem that looks ad hoc, and it forces you to accept that your existence is evidence for human extinction. You're betting against the future of your species because of a sampling assumption.

  **ELENA:** I'm not betting against the future. I'm saying we shouldn't assume we're typical of a galaxy-spanning civilization without evidence.

  **MARCUS:** And I'm saying we shouldn't assume we're the only observers that matter.

  *[Silence stretches between them. The bartender begins wiping down the counter nearby.]*

  **ELENA:** So, where does that leave the students? If SSA requires arbitrary reference classes to avoid Doomsday, and SIA requires accepting Presumptuousness to avoid Doomsday…

  **MARCUS:** …then the disagreement isn't about the math. It's about which bullet tastes less like copper. Do you prefer to be presumptuous about the size of the universe, or pessimistic about the duration of your species?

  **ELENA:** Or perhaps we're both missing a third option. But until then…

  **MARCUS:** …we keep the arguments sharp. Because if one of us is wrong, the stakes are literally everything.

  **ELENA:** Cheers to that.

  *[They clink glasses, neither looking entirely satisfied.]*
