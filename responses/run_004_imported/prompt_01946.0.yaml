      *   **Length:** Long enough for a two-page handout (approx. 1,000 - 1,500 words).
      *   **Content:**
          *   Occasion: After a conference talk on anthropic reasoning.
          *   Core Conflict: Bostrom's "Presumptuous Philosopher" case (SSA attacks SIA here).
          *   Counter-Conflict: Doomsday Argument & Reference Class problem (SIA attacks SSA here).
          *   Specific Test Case: Sleeping Beauty problem (do SSA/SIA map cleanly onto Thirding/Halving?).
          *   Tone: Live dispute, neither side wins easily, costs laid bare, no resolution.
      *   **Goal:** Dramatize the disagreement, showing why intelligent people stick to these counter-intuitive positions.

  2.  **Character Conception:**
      *   **SSA Defender:** Let's call her *Elena*. She needs to be rigorous, worried about empirical constraints, and skeptical of "magic" credence shifts based on mere possibility. She likely finds the Doomsday Argument uncomfortable but necessary, or perhaps has a refined version of SSA that mitigates it (but the prompt asks to press her on DA). Let's make her defend the *spirit* of SSA: we are random samples from actual observers.
      *   **SIA Defender:** Let's call him *Marcus*. He needs to be bold, willing to accept "presumptuous" conclusions if the logic holds, and focused on avoiding the Doomsday conclusion. He sees SIA as a correction to sampling bias.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Coffee, post-talk buzz. Immediate engagement with the "Presumptuous Philosopher."
      *   **The Presumptuous Philosopher (PP):** Elena attacks Marcus. How can you prefer Theory T2 (trillion trillion observers) over T1 (trillion observers) just because of numbers? It seems to violate empirical modesty.
      *   **Marcus's Defense:** It's not magic; it's Bayesian. If I exist, I'm more likely to exist in a universe with more observers. It's the "God's Eye View" vs. "My Eye View."
      *   **The Turn (Doomsday & Reference Class):** Marcus counters. If you stick with SSA, you get Doomsday. Early birth rank implies fewer total humans. That's absurd. Also, how do you define the reference class? Chimpanzees? Post-humans?
      *   **Elena's Defense:** Reference class is tricky, yes, but Doomsday isn't *that* bad. It's a prior shift, not a prediction of imminent death. Or, we restrict the class to "observers with my evidence."
      *   **Sleeping Beauty Test:** They need to check consistency.
          *   Standard mapping: SIA $\rightarrow$ Thirding (more awakenings = more likely to be in one). SSA $\rightarrow$ Halving (random sample from coin toss outcomes).
          *   *Twist:* The prompt asks them to see if it tracks *cleanly*. There's debate in the literature (e.g., Bostrom is SSA but argues for Thirding in some contexts, or uses SSA+ to get Thirding). Let's have them realize the mapping isn't perfect, which adds tension.
      *   **Closing:** No resolution. Both see the cost. Elena accepts weird reference class constraints; Marcus accepts presumptuous cosmology.

  4.  **Writing - Iteration 1 (Mental Outline):**
      *   Elena: "That Presumptuous Philosopher example kills your view."
      *   Marcus: "No, it saves us from Doomsday."
      *   Elena: "But you're doing physics from an armchair."
      *   Marcus: "You're predicting extinction from birth rank."
      *   Elena: "Reference class solves it."
      *   Marcus: "It's arbitrary."
      *   Both: "What about Sleeping Beauty?"
      *   Elena: "I'm a Halfer."
      *   Marcus: "I'm a Thirder."
      *   Both: "Wait, does that actually match?"
      *   End: "We're both stuck."

  5.  **Writing - Iteration 2 (Fleshing out the dialogue):**
      *   *Focus on voice:* Elena should sound cautious, maybe a bit frustrated by the "magic." Marcus should sound confident, maybe a bit reckless.
      *   *Technical accuracy:* Ensure PP, DA, and SB are referenced correctly.
      *   *The SB Twist:* Bostrom actually argues SSA can lead to Thirding if you treat the awakenings as the reference class. This is a crucial nuance for a graduate handout. It shows the landscape isn't just SSA=Half, SIA=Third. Let's have them discover this tension.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I make Marcus shrug off the Presumptuous Philosopher? *Correction:* No, he needs a genuine answer. The answer is usually that the prior odds are adjusted by the likelihood of existence. I need to make sure he articulates that clearly.
      *   *Check:* Did I make Elena crumble on Doomsday? *Correction:* She should acknowledge the cost. "I bite the bullet."
      *   *Check:* The SB connection. If Elena is SSA, she *should* be a Halfer (typically). If Marcus is SIA, he *should* be a Thirder. But Bostrom (SSA) argues for Thirding in SB. This is a great point of confusion to highlight. Let's have Elena claim SSA implies Halving, and Marcus point out that Bostrom himself disagrees. This shows the theory is still messy.
      *   *Actually, better for the prompt:* Let's have them realize that SB might be a different beast. SIA implies Thirding naturally. SSA implies Halving *unless* you tweak the reference class. If Elena tweaks the reference class to get Thirding, does she lose her grip on Doomsday? Yes. That's the tension.

  7.  **Final Polish:**
