      *   *Robust Mechanism Design:* There is a subfield (e.g., Bergemann & Morris) specifically dealing with "robustness" to beliefs and type spaces. They distinguish between "detail-free" mechanisms and those requiring common priors. SPIs aim for detail-free, but the *boundaries* of the detail still matter.
