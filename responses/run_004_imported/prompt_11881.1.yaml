      *(Final check on the "Type Space" argument)*: The user says "safe regardless of private information, conditional on having already bounded what could be private." This is essentially the definition of *ex-post* efficiency/IR in mechanism design, but the critique is about the *ex-ante* definition of the space. This is solid.

