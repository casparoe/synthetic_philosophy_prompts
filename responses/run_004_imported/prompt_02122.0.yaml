      *   *Nuance on Q3:* Be careful not to say Burge *just* copies Reid. Burge's rationalism is distinct from Reid's naturalism/theism. Burge grounds it in the nature of rationality itself. Reid grounds it in the nature of human constitution by God. The "gap" is the guarantee that the world/speakers cooperate. Reid uses God; secularists use evolutionary reliability or normative constraints on assertion.
      *   *Key Terminology:* Use "original principles," "constitution of the mind," "default justification," "entitlement."

  7.  **Final Polish:** Check citations (Inquiry, Section XXIV). Ensure the distinction between Veracity (speaker) and Credulity (hearer) is clear, as Reid links them tightly. (This is crucial for the secular translation—if you keep Credulity but lose Veracity's guarantee, the system breaks).

