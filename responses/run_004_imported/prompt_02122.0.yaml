      *   **Focus:** Thomas Reid's *Inquiry into the Human Mind* (1764), specifically Section XXIV.
      *   **Problem:** Advisor says don't rely on potted summaries ("testimonial belief is basic"); close reading shows the argument is complex.
      *   **Specific Text:** A key passage regarding the "principle of veracity" and "principle of credulity," the state of children, the *equilibrio* argument, the dream analogy, and the theological framing.
      *   **Three Questions:**
          1.  Relationship between the ontogenetic argument (children) and the *equilibrio* argument (hypothetical indifference). Independent or one supports the other?
