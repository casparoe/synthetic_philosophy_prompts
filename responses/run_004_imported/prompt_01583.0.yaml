      *   *Claim B (The Broader Letter):* Theatre will *change* Geneva's morals.
      *   *Synthesis:* Theatre reflects the *dominant* passions of the society that produces it. If you import a theatre from a corrupt society (Paris) into a virtuous one (Geneva), the theatre brings the *reflected passions of the corrupt society* with it. Over time, the Genevan audience adapts to the theatre, rather than the theatre adapting immediately to Geneva.
