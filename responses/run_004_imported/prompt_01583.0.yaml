      *   *Resolution:* Yes, there is a reconciliation. It involves the difference between *content* (what is on stage) and *institution/practice* (going to the theatre, the social ecosystem around it). Also, the difference between a *closed system* (Paris reflecting Paris) vs. an *imported system* (Paris plays in Geneva).

  3.  **Deconstructing the Tension:**
