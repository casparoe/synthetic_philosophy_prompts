      *   *The Passage:* This is from the section where Rousseau discusses the *nature* of theatre in general (mimesis, audience psychology). He argues theatre doesn't *purge* passions (against the Aristotelian/Catharsis view) but rather *indulges* them.
      *   *The Broader Argument:* Rousseau argues theatre changes *habits*, *social relations*, *economics*, and *cultural values* over time. It's not just about the content of the plays, but the *institution* of theatre.
