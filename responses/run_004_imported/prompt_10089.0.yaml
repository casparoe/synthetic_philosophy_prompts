      *   **Point 4: The Indistinguishability Problem.** Argue that the agent cannot draw the line between "good" and "bad" future belief changes without already assuming the conclusion.
      *   **Conclusion:** Summarize. The principle is either false (unrestricted) or empty (restricted).

