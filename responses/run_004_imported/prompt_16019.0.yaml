      *   **Principle of Sufficient Reason (PSR):** Nothing happens without a reason why it is so and not otherwise.
      *   **Grounding of Eternal Truths:** Leibniz argues that eternal truths (logic, math) need a ground. They exist in the Divine Intellect. They aren't free-floating Platonist forms independent of God, nor are they arbitrary decrees (voluntarism). They are grounded in God's understanding of His own essence.
      *   **Compossibility:** Not all possible worlds can exist together. God chooses the "best of all possible worlds" based on compossibility.

  3.  **Analyze "Acausal Trade" (Decision Theory):**
