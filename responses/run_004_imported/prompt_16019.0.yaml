          *   **On the Grounding of Truths:** This is the crux. Leibniz explicitly rejects the idea that eternal truths subsist on their own (Platonism) or are merely human conventions (Nominalism). They reside in the Divine Intellect. Therefore, the "shared logical structure" that enables acausal trade *must* ultimately be grounded in God.
          *   **On Finite Creatures:** Can finite minds coordinate without God *in the transaction*? Yes, in the sense that they follow the script. But the *possibility* of that script matching relies on Pre-established Harmony.
          *   **On "Acausal Trade" as a mechanism:** Leibniz might view the decision-theoretic reasoning as the *phenomenal* description of how the monads unfold their perceptions, but the *noumenal* reason for the success is Pre-established Harmony.

