      *   *Section 3: The Continuity Link.* If I stop reading after $N$ digits, I can't distinguish between $x$ and any $y$ that matches $x$ on the first $N$ digits. So $f(x)$ must be close to $f(y)$. That's continuity.
      *   *Section 4: The Step Function Problem.* Walk through $x=0$. The sequence might be $0, 0, 0...$ or $0, 0, 0, \dots, 10^{-k}$. The function can't wait forever to see if it jumps. So it can't define the step.
      *   *Section 5: Brouwer vs. Bishop.* This is critical.
          *   Bishop: "I don't accept the discontinuous function because I can't build it." (Agnostic).
