answer: |-
  Good evening. For those who don't know me, I'm a colleague of Priya's. I'm also a philosopher of religion, which means Priya asked me to give this toast not because I understand her work, but because I'm supposedly "the funny one." This is a dangerous combination. Priya's entire research program is on diachronic rationality and money-pump arguments. I barely remember my decision theory from grad school. So, if I get this wrong, please blame the open bar, not the bride.

  For the non-philosophers in the room: Priya studies how people make choices over time. Specifically, she looks at what happens when your future self wants something different than your present self. For the philosophers: I know the temptation to use the Ulysses example. Tying himself to the mast to resist the Sirens is the classic model of pre-commitment. But as Priya knows, that's not actually what makes marriage work. Ulysses restricted his options. He tied his hands.

  Marriage isn't about tying your hands. It's about keeping them free and choosing not to let go.

  This is where Priya's work on "resolute choice" becomes beautiful. In decision theory, a "sophisticated" chooser looks at the future, sees they might be tempted, and changes their plan now to avoid it. Often, that means not starting the journey at all. A "resolute" chooser makes a plan at the outset and sticks to it at later nodes, even when local preferences shift, *without* restricting their options.

  I was going to make a joke here about how violating transitivity leads to arbitrage, but I didn't want to get pumped before the cake cutting.

  For the family: That joke was for the grad students. For everyone else, here is the truth. It is easy to be faithful when there are no other options. It is easy to stay when leaving is impossible. But that isn't virtue; that's constraint. Priya and [Groom's Name], your vows are powerful not because they bind you legally, but because they represent a resolute choice. Every day, you will face nodes where a different path might look locally optimal. A difficult week, a tempting opportunity, a moment of frustration. The sophisticated strategy is to re-optimize in that moment. The resolute strategy is to honor the plan you made when you loved each other most clearly.

  This is the trap of dynamic inconsistency: if you treat marriage as a contract to be renegotiated every time the market shifts, you will eventually be pumped dry of trust. You cannot maximize utility at every node and still have a life together. You have to be resolute. You have to choose the plan over the impulse.

  Priya, you have spent your career proving that rationality requires more than just reacting to the present. It requires loyalty to your past self's commitments. Today, you make that commitment public. You are choosing to be unpumpable. You are choosing to stop looking for the marginally better option and recognize that the best option is the one you are already holding.

  To the rest of us, you are a proof of concept. You show us that love isn't about finding someone you can live with without temptation. It's about finding someone you are willing to be resolute for, even when you could be otherwise.

  So please raise your glasses. To Priya and [Groom's Name]: May your preferences be stable, your transaction costs be low, and may you never find a reason to renegotiate the vow you make tonight. To the bride and groom!
