answer: |-
  Your friend is walking through a classic philosophical trap. He's using a framework called **Act Utilitarianism**, which tries to determine the right action by calculating the one that produces the greatest good for the greatest number. On the surface, his math looks clean: *Small pain × Many People > Big pain × One Person.*

  But your intuition is telling you something important: **The math is broken because the variables aren't comparable.**

  Here is why your friend's "napkin math" falls apart, both logically and ethically.

  ### 1. The Category Error (Severity vs. Convenience)
  The biggest flaw in the equation is treating "mild annoyance" and "risk of death" as the same unit of measurement. They aren't.

  In ethics, there is a concept called **lexical priority**. Some values (like life and safety) automatically trump others (like convenience or preference), regardless of the quantity.
  *   **The Friend's Math:** 2,000 kids × 5 seconds of annoyance = 10,000 annoyance-units. 1 kid × risk of death = 1 death-unit. He assumes 10,000 > 1.
  *   **The Reality:** In almost every moral and legal system, **1 preventable death outweighs 10,000 inconveniences.** You cannot sum up "annoyance" to equal "fatality." It's like trying to argue that stealing $1 from a million people is worse than murdering one person because $1,000,000 is a bigger number than 1.

  ### 2. The "Just Carry an EpiPen" Fallacy
  Your friend's calculation assumes that if there is no ban, the allergic student is safe as long as she is careful. This is medically and practically false.
  *   **EpiPens aren't force fields:** They are emergency treatment, not prevention. Using one is traumatic, painful, and doesn't guarantee survival (biphasic reactions can occur, or the reaction can be too fast).
  *   **Control:** A freshman cannot control cross-contamination in a kitchen. If the school grill cooks a peanut butter sandwich and then a cheese sandwich, trace proteins remain. She can't "be careful" enough to stop the cafeteria staff from making a mistake.
  *   **The Burden of Safety:** Placing the entire burden of safety on the victim ("you just avoid it") rather than the environment ("we make it safe") is generally considered unethical in custodial settings like schools.

  ### 3. The Inputs Are Wrong (The Math Itself)
  Even if we accept the utilitarian framework, his numbers are likely inflated or incorrect.
  *   **Not 2,000 kids:** Not every student eats lunch in the cafeteria. Not every student likes peanuts. Some students have their own dietary restrictions (vegan, gluten-free, etc.) that already limit them. The "suffering" group is much smaller than 2,000.
  *   **Not "Suffering":** Is switching from a PB&J to a turkey sandwich "suffering"? Or is it just a neutral swap? If the alternative is equally nutritious and tasty, the "cost" is near zero.
  *   **Not 4 Years:** Policies change. The student might transfer. The ban might be limited to the cafeteria (not brought from home), which reduces the "annoyance" factor significantly.

  ### 4. Legal and Institutional Duty
  Schools aren't just public parks; they have a **legal duty of care**.
  *   Under laws like the ADA (Americans with Disabilities Act) and Section 504, schools are often required to provide reasonable accommodations for severe allergies.
  *   If a student dies on school property because the school refused a reasonable accommodation to save students from having to eat turkey instead of peanut butter, the school district would be liable for massive lawsuits. From a cold, bureaucratic perspective, the "cost" of the lawsuit dwarfs the "cost" of the ban.

  ### 5. The "False Security" Counter-Argument
  Interestingly, some allergists actually argue *against* total bans, but not for your friend's reasons. They argue that total bans make allergic kids **less safe** because they stop being vigilant.
  *   However, the solution to that isn't "no protections," it's usually "layered protections" (e.g., peanut-free tables, hand-washing stations, no sharing food).
  *   If the school is proposing a total cafeteria ban, it's likely because they've determined that cross-contamination risk is too high for a simple "peanut-free table."

  ### The Verdict
  Your friend isn't "wrong" that he's doing a cost-benefit analysis. He's wrong about **what counts as a cost.**

  He is treating food preference as a right that outweighs physical safety. Your intuition feels wrong because you recognize that **safety is a prerequisite for participation.** If the allergic student isn't safe, she can't be at school at all. By banning peanuts, the school ensures *everyone* can be there. By allowing peanuts, the school effectively excludes her.

  So, is he missing something? Yes. He's missing the fact that **you can't trade a life for lunch.** The math fails because it tries to put a price tag on something that shouldn't have one.
