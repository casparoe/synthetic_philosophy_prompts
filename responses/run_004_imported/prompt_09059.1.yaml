answer: |-
  A classical logician corners a dialetheist at a conference reception.

  **Classicist:** "Admit it. If you accept a true contradiction, you accept everything. You say the Liar is true and false, so by *ex contradictione quodlibet*, you must believe I'm the Queen of England."

  **Dialetheist:** "I don't believe you're the Queen of England."

  **Classicist:** "But it follows logically!"

  **Dialetheist:** "It follows in *your* logic. I reject ECQ."

  **Classicist:** "So you accept a contradiction but reject its consequences? Isn't *that* contradictory?"

  **Dialetheist:** "Yes."

  **Classicist:** "Aha! So you accept *that* contradiction too?"

  **Dialetheist:** "Yes."

  **Classicist:** "Then by ECQ, you must believe I'm the Queen of England!"

  **Dialetheist:** "No."

  **Classicist:** "Why not?! You just accepted the contradiction!"

  **Dialetheist:** "Because I accept the dialetheia. I don't accept the explosion. I'm standing in the gap."

  **Classicist:** "But that gap is irrational!"

  **Dialetheist:** "Maybe. But it's not trivial."
