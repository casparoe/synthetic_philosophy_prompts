answer: |-
  First, let me validate your intuition: you have understood the Causal Exclusion Argument correctly. It is widely regarded as one of the most formidable arguments in contemporary philosophy of mind, and your unease is shared by professional philosophers. Jaegwon Kim himself spent decades refining it because he recognized how threatening it is to our self-conception as agents.

  Your friend was right to suggest you might be drawing too strong a conclusion, but they were likely struggling to articulate *why* because the solution requires shifting how we think about causation itself. The argument does not necessarily prove that mental explanations are "fictions," but it does force us to clarify what we mean when we say a belief "causes" an action.

  Here is a breakdown of why the argument doesn't force us into epiphenomenalism (the view that mental states are causally inert), why "she left him because she felt betrayed" can still be true, and why psychology carries on unaffected.

  ### 1. The Fork in the Road: How to Block the Argument
  The Exclusion Argument relies on a few key premises. To avoid the conclusion that mental states do nothing, you generally have to reject or modify one of them. Philosophers usually take one of three paths:

  **A. Identity Theory (The Reductive Path)**
  The argument assumes there are *two* potential causes: the physical state (neurons) and the mental state (belief). If, however, the mental state *just is* the physical state, there aren't two causes competing for credit. There is only one cause, described in two different vocabularies.
  *   **The Objection:** Kim argues this fails because of *multiple realizability*. A belief can be realized by human neurons, silicon chips, or alien biology. If "belief" isn't tied to one specific physical structure, it can't be identical to it.
  *   **The Counter:** Some philosophers argue for "token identity." This specific instance of betrayal in this specific brain *is* identical to this specific neural pattern, even if "betrayal" in general can be realized differently elsewhere.

  **B. Realization and Supervenience (The Non-Reductive Path)**
  This is the most common response. It argues that the mental isn't a *separate* thing floating above the physical; it is *realized by* the physical.
  *   **The Analogy:** Consider a hammer breaking a window. Did the window break because of the *metal atoms* striking it, or because of the *hammer* striking it?
  *   If you say "only the atoms," you face exclusion. But most people agree the hammer broke the window *in virtue of* its atoms. The "hammer-ness" isn't a second, competing cause; it is a higher-level property that depends on the atoms. Similarly, the belief causes the action *by virtue of* the neural firing. The neural firing doesn't "exclude" the belief; it *constitutes* it.

  **C. Interventionism (The Counterfactual Path)**
  This is currently the most popular way to dissolve the problem. It changes the definition of "cause."
  *   **Production vs. Difference-Making:** Kim's argument assumes causation is like a transfer of energy ("causal oomph"). If physics accounts for all the energy, there's none left for the mind.
  *   **The Interventionist View:** Philosophers like James Woodward argue causation is about *difference-making*. If I were to intervene and change your belief (without changing the physical laws), would the action change? Yes.
  *   Under this view, the neural state and the mental state are not competitors. The neural state is the *mechanism*, but the mental state is the *variable* that explains the outcome. Both can be causes in different senses.

  ### 2. Is "She Left Because She Felt Betrayed" a Fiction?
  You asked if such explanations are "strictly speaking, never true." This depends on whether you think truth requires describing the *fundamental basement level of reality* (physics) or simply describing *real patterns*.

  If I say, "The computer crashed because of a software error," a physicist might say, "Strictly speaking, it crashed because of voltage fluctuations in the transistor."
  *   **Eliminativism:** If you believe only the fundamental level is real, then yes, "software error" is a fiction. This is the stance of *Eliminative Materialists* (like Paul Churchland), who argue folk psychology will eventually be replaced by neuroscience.
  *   **Non-Reductive Realism:** Most philosophers reject this. They argue that high-level patterns are real, even if they depend on low-level physics. A "software error" is a real pattern of electrical states. It is *true* that the software caused the crash, even if the physics was causally closed.

  Therefore, "she left because she felt betrayed" is true because "betrayal" picks out a specific, stable pattern of neural activity that reliably leads to "leaving." It is not a fiction; it is a higher-level description of a physical reality.

  ### 3. Why Do Psychology and Everyday Life Carry On Unaffected?
  Even if Kim's argument were proven conclusively (which it hasn't been), psychology and everyday life would—and should—ignore it. Here is why:

  **A. Explanatory Autonomy**
  The "special sciences" (biology, psychology, economics) are autonomous from physics. A biologist doesn't need to know quantum mechanics to explain natural selection. Similarly, a psychologist doesn't need to know ion channel dynamics to explain why betrayal leads to breakup.
  *   **Granularity:** Neural explanations are often *too detailed*. Knowing exactly which neurons fired tells you nothing about *why* that pattern occurred. The "betrayal" explanation captures the *reason* and the *context*, which are causally relevant to human behavior in a way that raw chemistry is not.

  **B. Predictive Power**
  Mental state predictions work better for humans than physical state predictions. If I want to predict if you will go to the kitchen, asking "Are you thirsty?" (mental) is more reliable than scanning your hypothalamus (physical). If the mental explanation weren't "doing work," it wouldn't be so predictively successful.

  **C. The Pragmatic Necessity**
  We cannot live as epiphenomenalists. To navigate the world, we must treat reasons as causes. If you try to genuinely internalize the idea that your thoughts do nothing, you undermine the very reasoning process you are using to reach that conclusion. As the philosopher P.F. Strawson argued, we are committed to the "participant stance" in human relationships; we cannot view ourselves or others as mere objects pushed around by physics without losing the concept of responsibility and meaning entirely.

  ### Summary
  Your friend sensed that the "death of the mind" conclusion was too strong because the Exclusion Argument relies on a specific, contested view of causation (causation as energy transfer/production).

  If you adopt a view of causation as **difference-making** or **realization**, the mental and the physical do not compete. The physical provides the *substrate*, and the mental provides the *organization* or *pattern*.

  So, is "she left because she felt betrayed" true? **Yes.** It identifies a real causal pattern in the world. Is it compatible with physics? **Yes,** because that pattern is implemented by physics. The Exclusion Argument is a warning against thinking of the mind as a *ghost* pushing the brain; it is not a proof that the mind is a *fiction*.

  You have stumbled onto the central tension of modern philosophy of mind. The fact that it bothers you means you are grappling with it correctly. The consensus is not that mental causation is dead, but that we need a more sophisticated understanding of how higher-level properties (like beliefs) relate to lower-level properties (like neurons) without competing with them.
