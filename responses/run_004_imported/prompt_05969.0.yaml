  **Move 5:** Cass accurately identifies that rational coherence sometimes requires maintaining uncomfortable doxastic states rather than forcing false certainty.

  **The Overlooked Distinction:**
  The stalemate persists because Cass and Tobias are debating two different sources of justification: **personal reasoning** versus **communal testimony**. Cass is right that Renata's *own* cognitive grip on the logic is compromised by alcohol (personal justification), but Tobias is right that the *conclusion* is secure because sober peers verified it (communal justification). The resolution isn't for Renata to doubt the answer, but to shift her confidence from "I solved this correctly" to "We verified this correctly," allowing her to accept the result while acknowledging her individual impairment.
