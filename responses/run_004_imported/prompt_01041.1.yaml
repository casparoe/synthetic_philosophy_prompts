      *   *Does Moore distinguish between "admiring" and "loving"?* In Chapter 6, he groups them. "Pleasures of human intercourse" involves mutual affection.
      *   *Key Distinction:* Moore distinguishes between the *cause* of the emotion and the *object*. I might love my friend *because* of history (cause), but the *object* of the love is their character. If the object is just character, the trade-up holds. If the object includes "our shared past," the trade-up fails.
      *   *Moore's Textual Evidence:* Moore is notoriously vague on whether relational properties count as "intrinsic qualities." He tends to focus on aesthetic/moral qualities of the person.
      *   *Conclusion:* The "Organic Unity" doctrine is the *only* tool Moore has, but it requires stretching his definition of the "object" of affection to include relational/historical properties. Even then, the Maximizing Principle threatens to override it if a "super-friend" appears.

