          *   The Reduction of Persons to Properties (The "Bundle" view).
      *   **Section 2: Can Organic Unities Help?**
          *   Explain Organic Unities briefly.
          *   *Strategy A: Relational Properties.* Make "being my friend" a valuable quality. (Critique: Moore might accept this, but it risks circularity or infinite regress).
          *   *Strategy B: The Whole includes the History.* The state of "long-term friendship" is a unique organic whole that a new person can't replicate. (Critique: Moore focuses on the *current* state of consciousness).
          *   *Strategy C: Appropriateness.* Is "trading up" an inappropriate emotion? (Critique: Moore defines appropriateness by the degree of good).
      *   **Section 3: The Verdict.**
          *   Organic unities *mitigate* but don't *solve* the problem within Moore's strict framework.
          *   To fully solve it, one usually needs to step outside Moore (e.g., Strawson, Williams, or care ethics) and reject the impersonal maximizing premise.
          *   Moore *could* bite the bullet: Maybe loyalty is only valuable insofar as it produces good states, but usually, stable relationships produce more good than constant trading. (Rule Utilitarian move).

  6.  **Refine the Analysis (Self-Correction/Nuance):**
