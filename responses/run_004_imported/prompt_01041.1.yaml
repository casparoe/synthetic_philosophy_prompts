answer: |-
  This is an excellent objection, and it cuts to the heart of the tension between Moore's meta-ethics (non-naturalist realism) and his normative theory (ideal utilitarianism). You have identified what is often called the **"impersonality objection"** to *Principia Ethica*.

  Here is an analysis of exactly which Moorean commitments generate the "trade-up" problem, and an assessment of whether the Doctrine of Organic Unities can save him without abandoning his cognitive account of love.

  ### 1. Which Commitments Generate the "Trade-Up" Problem?

  The problem arises from the convergence of three specific commitments in Moore's system. If you accept all three, the "trade-up" conclusion seems inescapable.

  **A. The Constitutive Analysis of Affection (Cognitive + Emotional)**
  In Chapter 6, Moore analyzes the "pleasures of human intercourse" (love/friendship) as a complex state of consciousness. It consists of:
  1.  A cognitive element: An awareness of the qualities of the other person.
  2.  An emotional element: An appropriate feeling toward those qualities.
  *The Problem:* On this view, the *person* is technically the bearer of the qualities, but the *value* resides in the mental state of admiring those qualities. If the value is generated by the admiration of properties $x, y, z$, then the specific token individual (Alice) is fungible so long as the properties are present.

  **B. The Impersonality of Intrinsic Value**
  Moore is a robust realist. If a state of affairs is intrinsically good, it is good *simpliciter*, not "good for me" or "good relative to my history."
  *The Problem:* If "Admiring Person B (who has $x+, y+, z+$)" is a more valuable state of the universe than "Admiring Person A (who has $x, y, z$)," then value theory demands we acknowledge this hierarchy. There is no agent-relative value in Moore's system to anchor loyalty to *this* specific person regardless of their comparative ranking.

  **C. The Maximizing Principle (Ideal Utilitarianism)**
  Moore's normative conclusion is that we ought always to do that which will produce the most intrinsic good.
  *The Problem:* Since the state of "admiring the more admirable person" is intrinsically more valuable (per Commitment B), and we ought to maximize intrinsic value, we have a *prima facie* duty to shift our affection to the person with the higher degree of admirable qualities. Loyalty, defined as sticking with a less "admirable" friend, becomes a form of irrationality or even immorality (failing to maximize the good).

  ### 2. Can the Doctrine of Organic Unities Block This?

  The **Doctrine of Organic Unities** states that the value of a whole is not merely the sum of the values of its parts. A part that has no value in isolation might contribute vastly to the value of a whole, or vice versa.

  Could Moore use this to say that "My friendship with Alice" is a unique organic whole that cannot be replicated by "My friendship with Bob," even if Bob has better qualities?

  **The Strategy: Relational Properties as Part of the Object**
  To block the trade-up, Moore would need to argue that the *object* of your affection (Commitment A) is not just "Alice's character qualities" but "Alice's character qualities *plus* the relational property of *having been my friend for ten years*."

  If the "organic whole" of the relationship includes the shared history as a constitutive part, then Bob cannot "trade up" because Bob lacks that specific part. The whole "Affection for Alice + Shared History" might be more valuable than "Affection for Bob + No History," even if Bob is individually more virtuous.

  **Why This Strains Moore's System:**

  1.  **The "Appropriateness" Condition:** Moore insists the emotion must be *appropriate* to the object. He tends to think appropriateness is determined by the *intrinsic* nature of the object (beauty, virtue). It is unclear if Moore would accept "being my friend" as an intrinsic quality that warrants love. If he treats relational properties as merely causal (the *cause* of the love rather than the *object*), the defense fails. He explicitly distinguishes between the cause of an emotion and its object.
  2.  **The Maximizing Threat Remains:** Even if we grant that the "Alice-Whole" is valuable, the Maximizing Principle (Commitment C) still looms. If Bob is *significantly* more admirable, the "Bob-Whole" (even with less history) might still outweigh the "Alice-Whole." Organic unities explain *how* value is constituted, but they do not inherently protect against aggregation and comparison. Unless Moore argues that shared history creates a *lexical* priority (which he doesn't), a sufficiently admirable stranger could still outweigh a long-term friend.
  3.  **Fetishizing the Past:** If the value lies in the consciousness of the qualities, focusing on the "history" risks shifting the value from the *person* to the *narrative*. Moore wants love to be about the *person*, not just about "my life story."

  ### 3. The Verdict: Can Moore Save the View?

  **Strictly speaking: No.**
  If Moore holds fast to the **Impersonality of Value** and the **Maximizing Principle**, the Doctrine of Organic Unities is insufficient to block the trade-up problem completely. It can raise the "cost" of trading up (by adding the value of shared history to the current friend's side of the scale), but it cannot make the scale immune to being tipped by a sufficiently "better" person.

  **However, Moore has a pragmatic escape hatch (though not a theoretical one):**
  Moore could argue that while the *theory* permits trading up, the *practice* destroys the conditions for the good.
  *   **Instability:** If everyone knows they might be traded up, the trust required for "personal affection" (which Moore values so highly) becomes impossible.
  *   **Epistemic Limits:** We cannot truly know the qualities of a stranger as well as our friends.
  *   **The Value of Stability:** The organic whole of a "stable, lifelong friendship" might be so much more valuable than a "new, slightly better friendship" that trading up is almost never utility-maximizing in the real world.

  **Conclusion for your Seminar:**
  You can argue that Moore's view generates the trade-up problem because he treats persons as **loci of value-properties** rather than **sources of agent-relative claims**.

  The Doctrine of Organic Unities *could* block the result **only if** Moore expands the "object" of affection to include relational/historical properties *and* argues that these properties create a unique value that cannot be surpassed by individual virtues alone. But this requires modifying his cognitive account of love: love would no longer be just "admiring contemplation of qualities," but "commitment to a shared history."

  If he makes that move, he is effectively abandoning the pure "admiring-contemplation" account you noted in Chapter 6. He would be moving closer to a view where the *will* or *commitment* constitutes the value, not just the cognitive appreciation of the good. So, to save loyalty, Moore likely has to sacrifice the purity of his aesthetic model of love.
