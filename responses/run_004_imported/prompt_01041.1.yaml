  1.  **Analyze the User's Query:**
      *   **Context:** Seminar on early analytic ethics, just finished *Principia Ethica* (specifically Chapter 6, "The Ideal").
      *   **Core Issue:** Moore treats personal affection (love/friendship) similarly to aesthetic appreciation (admiring contemplation of good qualities).
      *   **The Problem:** This seems to imply a "trade-up" problem. If love is just admiring qualities $x, y, z$, and Person B has $x+, y+, z+$, I should love Person B more than Person A (my friend). This undermines loyalty and the particularity of relationships.
      *   **The Request:**
          1.  Explain exactly which of Moore's commitments generate this "trade-up" problem.
          2.  Assess whether a Moore-style "organic unities" view could block this result without abandoning the admiring-contemplation account.

  2.  **Deconstruct Moore's View in *Principia Ethica*:**
      *   **Non-Naturalism:** Good is simple, indefinable.
      *   **Ideal Utilitarianism:** We ought to maximize the good.
      *   **The Ideal (Chapter 6):** The greatest goods are "the pleasures of human intercourse" (personal affection) and "the enjoyment of beautiful objects" (aesthetic appreciation).
      *   **Structure of these Goods:** They are *organic unities*. They consist of two parts: (1) a cognitive state (consciousness of the object/quality) and (2) an emotional state (appropriate emotion toward it).
      *   **Impersonality of Value:** Value is objective and universal. If State A is better than State B, it is better *simpliciter*, not just "for me."
      *   **Maximization:** Since we ought to produce the most good, we ought to bring about the most valuable states of affairs.

  3.  **Address Part 1: Which Commitments Generate the "Trade-Up" Problem?**
      *   *Commitment 1: The Constitutive Analysis of Love.* Love is defined as an appropriate emotional response to the *qualities* of the object. If the value lies in the *state of consciousness* of admiring good qualities, then the specific *token* individual matters only as the bearer of those qualities.
      *   *Commitment 2: The Impersonality of Intrinsic Value.* Moore is a realist about value. Value doesn't depend on *who* is valuing it in a subjective sense, but on the objective worth of the state of affairs. If Person B embodies more "admirable qualities," the state of "admiring Person B" is intrinsically more valuable than "admiring Person A."
      *   *Commitment 3: The Maximizing Principle (Ideal Utilitarianism).* We have a duty to maximize intrinsic good. If admiring Person B produces more good than admiring Person A, duty dictates shifting affection (or at least prioritizing B).
      *   *Commitment 4: Atomism/Aggregation of Qualities (Implicit).* While Moore believes in organic unities, his analysis of *why* something is admirable often leans towards the properties possessed. If the "goodness" of the person is a sum of their virtues/beauty, a higher sum warrants a stronger response.

  4.  **Address Part 2: Can "Organic Unities" Save Moore?**
      *   *What is the Doctrine of Organic Unities?* The value of a whole is not simply the sum of the values of its parts. A part might have no value on its own but contribute to a valuable whole (or vice versa).
      *   *Application to Love:* The "whole" is the relationship/state of affection. The "parts" are the lover, the beloved, and the qualities.
      *   *Potential Defense:* Could the *history* or the *particularity* of the relationship be a necessary part of the organic whole that generates the value?
      *   *Moore's Text:* Moore explicitly says the value lies in the *emotion directed at the quality*. He distinguishes between the *cause* of the emotion and the *object* of the emotion. He tends to focus on the object's qualities.
      *   *The "History" Argument:* If the "organic whole" includes the shared history, then the new person (Person B) lacks that part. Therefore, the whole "Affection for Person A + Shared History" might be more valuable than "Affection for Person B + No History," even if B has better intrinsic qualities.
      *   *Does Moore allow this?* Moore is tricky here. He emphasizes the *consciousness of the object*. If the "object" includes the relational property "being my friend of 10 years," then yes. But Moore often treats the object as the *person's character/beauty*.
      *   *The "Appropriateness" Condition:* Moore insists the emotion must be *appropriate* to the object. Is it appropriate to love someone *because* they are *this specific person*? If Moore allows relational properties to be part of the "good qualities," then loyalty becomes a quality to be admired.
      *   *The Limit:* However, Moore's utilitarianism still looms. If the "whole" with Person B is *still* more valuable even accounting for the loss of history, the maximizing duty remains. Organic unities explain *how* value is constituted, not necessarily *why* we shouldn't maximize.

  5.  **Synthesize and Structure the Argument:**

      *   **Introduction:** Acknowledge the sharpness of the objection (it's a classic critique of ideal utilitarianism/impersonal value).
      *   **Section 1: The Source of the Problem (Moore's Commitments).**
          *   The Analysis of Affection (Cognitive + Emotional).
