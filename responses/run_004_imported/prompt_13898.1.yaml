  **Justifications**

  **1. Callum (MR settles the matter):** Score: 1
  Callum is correct that multiple realizability (MR) is the decisive argument against classic mind–brain type-identity theory. However, he overstates the case by claiming this proves functionalism *must* be correct. MR eliminates type-identity, but other options remain (e.g., dualism, eliminativism, or token-identity theory). MR motivates functionalism but does not logically entail it.

  **2. Naomi (The Lookup Table/China Brain objection):** Score: 2
  Naomi accurately articulates Ned Block's "Liberalism" objection. If functional definitions are too abstract to accommodate MR, they risk ascribing mental states to systems that lack genuine consciousness (like a look-up table or the "China Brain" thought experiment). This is a standard and potent critique of functionalism.

  **3. Callum (Internal causal structure):** Score: 2
  This is the standard functionalist reply to the look-up table objection. Functionalism typically defines mental states by their causal relations to *other internal states*, not just inputs and outputs. A look-up table lacks these mediating internal causal transitions, so this distinction successfully excludes trivial systems.

  **4. Naomi (The Octopus/Conservatism objection):** Score: 2
  Naomi correctly identifies the counter-risk, often called the "Conservatism" or "Species Chauvinism" objection. If the internal causal structure is specified finely enough to exclude look-up tables, it may become too specific to include biologically diverse beings (like octopuses) that realize cognition differently. She correctly notes that Callum's fix threatens to revive the original MR problem.

  **5. Callum (Grain is relative/pragmatic):** Score: 1
  Callum adopts a pragmatic defense (similar to Daniel Dennett's stance). While it is defensible to say functional descriptions depend on the level of abstraction needed for explanation, this concession weakens his original metaphysical claim. If the "grain" is chosen to suit the desired verdict, functionalism becomes a methodological tool rather than a theory of what consciousness *is*.

  **6. Naomi (Hollowing out the theory):** Score: 2
  Naomi lands a strong blow here. If the level of functional description is adjustable solely to match our pre-existing intuitions about who is conscious, the theory loses its explanatory power. It becomes circular: we decide who is in pain, then choose the functional grain that matches that decision, rather than using functionalism to determine the answer.

  **What Both Are Missing**

  **Callum** overlooks the "Hard Problem" of consciousness (qualia). Even if a system perfectly matches a functional role, functionalism struggles to explain *why* it feels like something to be that system. He assumes functional equivalence guarantees phenomenal experience, which is the core contention of the debate.

  **Naomi** operates under a false dichotomy. She assumes that if functionalism fails, we must return to a biology-heavy view (like type-identity). She misses **Token Identity Theory**, which accepts MR (different physical bases for different tokens of pain) without committing to the abstract causal roles of functionalism. Additionally, neither student distinguishes between *Access Consciousness* (reportable/functional) and *Phenomenal Consciousness* (experiential), which is often where these arguments actually diverge.
