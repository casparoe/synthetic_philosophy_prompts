      *   **Claim 3 (Callum):** Fix: Define functional role by internal causal states, not just I/O. Lookup tables lack internal causal structure.
          *   *Analysis:* This is the standard functionalist response to the lookup table objection (Machine Functionalism vs. Turing Machine functionalism). Functionalism typically requires *internal* states mediating I/O, not just I/O mapping. This distinguishes a mind from a look-up table.
