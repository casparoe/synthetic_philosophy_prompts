prompt: |-
  Ok so I've been falling down a decision theory rabbit hole for a piece on whether humans are secretly "irrational," and I keep getting stuck on the Allais paradox. Everyone treats it as a slam dunk that people are irrational for prefering certainty in the first pair of gambles but the riskier option in the second, since that combo violates the independence axiom -- but then I read that Savage himself supposedly picked the "inconsistent" combo the first time round, before deciding his own gut reaction was the mistake, which feels like its kind of begging the question against Allais. So write me an actual essay on this, not a wishy-washy "both sides have a point" one: weigh the case for treating independence as a genuine rationality constraint (sure-thing-principle intuitions, the worry that dropping it threatens stochastic dominance or dynamic consistency) against the case that independence is itself the shaky premise (common-consequence vs common-ratio versions of the paradox, rank-dependent or prospect-theory-style alternatives that keep dominance but ditch independence). Then commit: should someone with Allais-type preferences bite the bullet and reject independence, or just admit they're making a mistake? Pick a side and defend it.
