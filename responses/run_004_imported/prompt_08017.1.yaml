answer: |-
  **Setting:** *A university coffee lounge, late afternoon. The graduate seminar on "The Architecture of Cognition" has just adjourned. ELENA (a defender of the Classical Computational Theory of Mind) and MARCUS (who specializes in developmental psychology and conceptual change) are standing by the espresso machine.*

  **Elena:** You looked pained when Jerry's *doorknob* example came up today. Be honest: you think it's absurd that we're born with a DOORKNOB concept.

  **Marcus:** I think it's a *reductio*. If the price of saving the Computational Theory of Mind is that my genome encodes a specific representation for carburetors, Velcro, and mid-century modernist furniture, then the theory is bankrupt. It's not just counter-intuitive; it's biologically profligate.

  **Elena:** It's only profligate if you think evolution is parsimonious with information. Look, the argument isn't about biology; it's about logic. It's the Paradox of Concept Learning. To learn a concept $C$ by hypothesis testing, you must be able to formulate the hypothesis "All and only $X$s are $C$s." But to formulate that, you need the concept $C$ in your language of thought already. If $C$ is primitive, you can't define it out of other concepts. So, you either had it, or you didn't learn it.

  **Marcus:** That assumes learning *is* hypothesis testing. That's the Fodorian straitjacket. You're assuming the only way to acquire a concept is to select one from a pre-existing menu of atomic symbols. But what if the menu itself expands?

  **Elena:** That's the magic trick I'm objecting to. How does the menu expand? If I don't have the symbol, I can't think about it. If I can't think about it, I can't construct it. You're saying the system can pull itself up by its bootstraps. But computationally, that's impossible. You can't run a program that writes a new primitive into its own source code without already having the instructions for that primitive.

  **Marcus:** You're treating the Language of Thought like a static assembly language. Susan Carey's work on Quinian bootstrapping suggests something more dynamic. Think about how children acquire the concept of exact large numbers. They start with a list of count words—"one, two, three"—which initially function just as uninterpreted placeholders. They know the order, but not the cardinality.

  **Elena:** Placeholders for *what*? If they don't have the concept of cardinality, what is the placeholder holding?

  **Marcus:** It's holding a structural role. Through analogy with set partitioning or parallel individuation systems, the child maps the list structure onto a quantificational structure. The *meaning* of the symbol "five" changes during the process. It isn't that they selected the atom FIVE from a innate list; it's that the representational resource *FIVE* was created via a modeling relation between two existing systems. The concept isn't selected; it's constructed.

  **Elena:** But "constructed" is doing too much work there. To map the list structure onto the quantificational structure, the child needs a higher-order representation that says, "This list structure is isomorphic to that quantity structure." To have *that* representation, they need concepts of *isomorphism*, *quantity*, and *structure*. If those are primitive, you've just pushed the nativism back a step. If they aren't primitive, how did *they* get them? You still hit a floor of primitives eventually. And if Fodor is right, that floor is everything.

  **Marcus:** Not everything. Just the foundational skeletal structures. The difference is that for Fodor, the primitives are semantic atoms like DOORKNOB. For the bootstrapping view, the primitives are domain-specific core knowledge systems—objects, agents, numbers, geometry. The complex concepts emerge from the *integration* of these systems. The concept DOORKNOB isn't innate; it's a fusion of the object system (solid, cohesive), the agent system (affordance for grasping), and maybe a linguistic label.

  **Elena:** Ah, now we're at the crux. You're shifting from atomism to a prototype or definitional cluster. But Fodor killed definitions decades ago. There are no necessary and sufficient conditions for DOORKNOB. It's not "device for latching doors," because broken doorknobs are still doorknobs, and knobs on drawers aren't doorknobs. If the concept is atomic, it has no internal structure. If it has no internal structure, you can't build it from a fusion of other concepts. You can only *trigger* it.

  **Marcus:** Why accept the atomism? That's the weak point. You assume that because a concept *functions* as a unit in inference, it must be *stored* as an unstructured unit. But connectionist models, or even hybrid symbolic-connectionist models, show how distributed representations can stabilize into functional atoms without being innate symbols. The "hypothesis testing" model assumes a serial, sentence-like processing in the LOT. If the underlying machinery is associative and statistical, the "paradox" dissolves. You don't test a hypothesis; you tune a vector in a high-dimensional space until it clusters with other doorknob experiences.

  **Elena:** And how does that vector get *semantic* content? That's the hard problem you're glossing over. A cluster of features isn't a concept unless it's part of a syntax of thought. If I just have a similarity space, I can't think "Doorknobs are artifacts." I can only think "This is like that." To get the productivity and systematicity of thought, you need combinatorial syntax. And once you have combinatorial syntax, you're back to my problem: you can't combine symbols to create a *new* primitive symbol. You can only create complex predicates. If DOORKNOB is a primitive, it must be in the base.

  **Marcus:** But why is DOORKNOB a primitive? That's the assertion I reject. It feels primitive to you because, as an adult, your access to it is direct. But phenomenological immediacy isn't metaphysical depth. The developmental data shows a trajectory. Children don't treat artifacts the same way adults do. They move from functional definitions to sortal definitions. If the concept was innate, why does the extension shift so dramatically between age four and age eight?

  **Elena:** Because of *triggering conditions*. The innate concept is there, but it's dormant until the environment provides the right input to fix the reference. Think of it like a parameter setting in Universal Grammar. The genome doesn't specify "English," it specifies a space of possible grammars. Maybe the genome doesn't specify "doorknob," but it specifies a space of possible artifact concepts, and experience selects the coordinate.

  **Marcus:** That's a retreat. If the space of possible artifact concepts is fine-grained enough to include DOORKNOB but not, say, GLORP (a fictional artifact), then for all practical purposes, you're a nativist about doorknobs. You're saving the logic of the Computational Theory by sacrificing the plausibility of the cognitive science. You're positing a "Mad Dog" nativism that makes the mind a museum of pre-formed ideas.

  **Elena:** I'd rather have a museum than a magic show. Your bootstrapping requires the mind to create new semantic content out of old content without a rule for doing so. That's not science; that's emergentism dressed up as mechanism. At least my view respects the constraint that you can't get more information out of a system than you put into it. If the adult has a concept the child lacks, the difference must be in the initial state or the input. Since the input underdetermines the concept (the poverty of the stimulus), it must be in the initial state.

  **Marcus:** The poverty of the stimulus assumes the input is just data. But the input is also *interaction*. The child isn't passively testing hypotheses against data; they are manipulating objects, being corrected by parents, and re-describing their own representations. Representational Redescription. The process of learning changes the format of the representation, not just the value of a variable. Fodor's argument works only if the format of the LOT is fixed from birth.

  **Elena:** And if the format isn't fixed, what fixes it? If the rules of the system can change, how do you explain the stability of reasoning? If I can change the logic of my own thoughts, how do we communicate? I need a stable LOT to explain why your bootstrapping argument makes sense to me.

  **Marcus:** We communicate because our bootstrapping processes are species-typical. We all have the same core knowledge systems and the same social learning mechanisms. We end up with similar concepts not because we opened the same pre-packed boxes, but because we climbed the same ladder.

  **Elena:** But who built the ladder?

  **Marcus:** Evolution built the capacity to build ladders. You think evolution built the rungs.

  **Elena:** And I think you haven't explained how the first rung gets placed without already standing on one.

  **Marcus:** And I think you've explained everything except how anything new ever happens.

  *(They both take a sip of coffee. The espresso machine hisses, filling the silence.)*

  **Elena:** So, we're stuck. You think my logic is sound but my premises are biologically insane.

  **Marcus:** And you think my biology is plausible but my logic is computationally incoherent.

  **Elena:** Essentially. I suppose that's why they pay us to teach the seminar rather than solve it.

  **Marcus:** Cheers to that. But I'm still assigning Carey next week.

  **Elena:** Fine. But I'm assigning *Concepts: Where Cognitive Science Went Wrong* the week after. Let the students decide which impossibility they prefer.
