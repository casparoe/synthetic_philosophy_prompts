  8.  *(Self-Correction during drafting)*: Make sure not to say "LLMs are subject to Löb." LLMs aren't logical systems. The *system architecture* relying on formal proof is. The obstacle is about the *verification architecture*, not the model weights.

  9.  **Final Plan:**
