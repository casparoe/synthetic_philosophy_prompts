answer: |-
  You have spotted something really sharp here. Your intuition is spot-on: there *are* two distinct logical moves happening in this passage, and the translation you're reading (H.A.J. Munro, 1886) is famously literal and Victorian, which can make the flow feel clunkier than the original Latin hexameter.

  You are absolutely right to feel that the "War Analogy" and the "Existence Condition" (the last sentence) are doing different work. In modern philosophy of death, these are often treated as two separate arguments entirely.

  Here is the breakdown of what Lucretius is doing, why he includes the war stuff, and how the two arguments relate.

  ### 1. The War Analogy: The "Symmetry Argument"
  **The Text:** *"as in time gone by we felt no distress when the Poeni [Carthaginians]... came together to do battle... thus when we shall be no more... nothing whatever can happen to excite sensation."*

  **What it's doing:**
  This is what contemporary philosophers (like Derek Parfit) call the **Symmetry Argument**.
  *   **The Logic:** There is an infinite amount of time before you were born and an infinite amount of time after you die. You do not fear the time *before* you existed (the Punic Wars happened, you weren't there, you felt nothing). Therefore, you should not fear the time *after* you exist. They are symmetrical states of non-existence.
  *   **Why the Carthaginians?** Lucretius is writing for a Roman audience. The Punic Wars were the equivalent of World War II for them—existential, terrifying, chaotic ("sea mingled with heaven"). By picking the scariest thing he can imagine, he makes the point stronger: *Even if the world is ending, if you aren't there to see it, it doesn't touch you.*
  *   **The Function:** This is a **psychological** argument. It appeals to your intuition and memory. It tries to get you to *feel* that non-existence is neutral by reminding you that you've already "been" dead (before birth) and it didn't hurt.

  ### 2. The Last Sentence: The "No Subject" Argument
  **The Text:** *"For he whom evil is to befall must in his own person exist at the very time it comes... but since death precludes this... he who exists not, cannot become miserable."*

  **What it's doing:**
  This is a **metaphysical** or **logical** argument. It doesn't rely on analogy; it relies on the definition of harm.
  *   **The Logic:** For an event to be "bad for X," X must exist at the time of the event to experience the badness. Death removes X. Therefore, death cannot be bad for X.
  *   **The Function:** This is the rigorous philosophical core. It closes the logical loop. It says, "It's not just that you *won't feel* pain; it is logically *impossible* for pain to be assigned to you."

  ### 3. Are they separate? Does he need both?
  You asked: *"Am I right that there's two separate arguments getting mashed together... and if so, does the second one even need the first?"*

  **Yes, they are separate.**
  In a modern philosophy paper, you would probably choose one. The "No Subject" argument (Sentence 2) is logically sufficient on its own. If you prove that a non-existent thing cannot suffer, you don't *need* to compare it to the Punic Wars to make the logic hold.

  **So why did Lucretius keep the war stuff?**
  This is the key to understanding Epicureanism. Lucretius isn't just trying to win a debate; he is trying to perform **therapy**.
  *   **Logic doesn't cure fear:** You can understand the "No Subject" argument intellectually and still be terrified of being dead. The fear of death is emotional, not just logical.
  *   **The War Analogy is therapeutic:** By vividly describing the chaos of war and contrasting it with the peace of non-existence, he is trying to shift your *attitude*, not just your beliefs. He wants you to viscerally realize that "not being there" is a relief, not a loss.
  *   **Rhetorical Structure:** Lucretius is a poet. He moves from the concrete (war, history, sensation) to the abstract (the nature of existence and evil). If he started with "he who exists not cannot become miserable," it's dry. By starting with the war, he grabs your imagination, then seals it with the logic.

  ### 4. Why the translation feels "tangled"
  You mentioned the logic feels tangled. A lot of that is Munro's 19th-century style.
  *   **Munro:** *"concerns us not a jot"* / *"shuddered and quaked beneath high heaven"*
  *   **Modern Equivalent:** A translator like Martin Ferguson Smith or A.E. Stallings would make the distinction sharper.

  For example, the transition *"thus when we shall be no more..."* is Lucretius connecting the analogy to the conclusion. Munro makes it a long, winding sentence. In the original Latin, the rhythm of the poetry helps signal where the analogy ends and the principle begins.

  ### Summary for your elective
  If you want to impress in your discussion, here is the takeaway:
  1.  **You are correct:** There are two arguments here. The **Symmetry Argument** (Past non-existence = Future non-existence) and the **Experience Condition** (No subject = No harm).
  2.  **The War Analogy:** It isn't just decoration; it operationalizes the Symmetry Argument to make non-existence feel familiar rather than alien.
  3.  **Redundancy?** Logically, the second argument makes the first unnecessary. But *therapeutically* (which is the goal of Epicureanism), the first argument is necessary to calm the emotions so the second argument can be accepted by the mind.

  Lucretius is basically saying: "Look, you weren't bothered by the Punic Wars because you weren't born yet (Argument 1). And logically, you can't be bothered by anything if you don't exist to be bothered (Argument 2). So stop worrying."

  Great catch on the text. Reading the primary source instead of the handout definitely paid off!
