    "copenhagen_score": 5,
    "copenhagen_max": 6,
    "everett_score": 6,
    "everett_max": 7,
    "bohm_score": 5,
    "bohm_max": 7,
    "total_score": 16,
    "total_max": 20
  }
  ```
