answer: |-
  This is a fantastic question, and given your background in Mendelian randomization (MR), you are uniquely positioned to appreciate the tension here. You've spent a career trying to squeeze counterfactual leverage out of observational regularities—essentially trying to solve Hume's problem with algebra rather than metaphysics.

  If we summon Hume from the shades and sit him down with a whiteboard full of DAGs on one side and a modal realism treatise on the other, I suspect his reaction would be sharp, skeptical, and ultimately decisive.

  Here is how I think the interview goes.

  ### 1. The Empiricist Filter: Impressions First
  Before looking at the math, we have to run both camps through Hume's "Copy Principle." For Hume, every meaningful idea must be traceable to a preceding impression (sensation or reflection). If a term cannot be cashed out in terms of impressions, it is "sophistry and illusion."

  **Lewis and Possible Worlds:**
  Hume would likely dismiss Lewis's ontology almost immediately. To a strict empiricist, "possible worlds" (especially concrete ones, but even ersatz ones) smell dangerously like the scholastic "substantial forms" or "occult qualities" he spent the *Enquiry* trying to exorcise.
  *   **The Impression Problem:** What is the impression of a "possible world"? You cannot see it, touch it, or feel it. You can imagine it, but for Hume, imagination is just the recombination of past impressions. To posit a whole metaphysical realm to ground the truth conditions of a counterfactual is to violate ontological parsimony.
  *   **The Similarity Metric:** Hume would be particularly suspicious of the "similarity between worlds" metric. To judge similarity, you usually rely on laws of nature. But for Hume, laws of nature *are* just summaries of constant conjunctions. Using laws to define counterfactuals, which are then used to define causation, risks the very circularity he warned against. He would see this as building a castle in the air to explain why the ground is solid.

  **Woodward/Pearl and Interventions:**
  This camp fares much better. Why? Because an "intervention" is, fundamentally, an **experiment**.
  Hume was a staunch advocate of the "experimental method" (in the Newtonian sense). When he defines cause in the *Enquiry*, he often slips into the language of what happens when we manipulate objects.
  *   **The Impression:** Do we have an impression of an intervention? Yes. We have an impression of **volition** (an internal impression) followed by bodily motion, followed by a change in the external object. When you push a billiard ball, you feel the effort, you see the motion, you see the collision.
  *   **The Machinery:** The *do*-operator ($do(X=x)$) is essentially a formalization of "holding all else constant while I manipulate this." This aligns perfectly with Hume's view that our idea of necessity arises from the *determination of the mind* after repeated experiences of transition. Interventionism makes that transition active rather than passive.

  ### 2. The Second Definition: Counterfactual vs. Manipulable
  You noted Hume's second definition: *"if the first object had not been, the second never had existed."*

  **Lewis's Reading:**
  Lewis takes this literally as a truth-conditional statement about other worlds. Hume would likely say Lewis is reifying a psychological habit. For Hume, that counterfactual sentence isn't a description of metaphysical reality; it's a report on the *strength of the association* in the mind. When I say "If the ball hadn't moved, the second wouldn't have," I am expressing my confidence based on past regularity, not accessing a neighboring universe.

  **Woodward's Reading:**
  Woodward interprets the counterfactual as: "If I were to intervene to prevent the first object, the second would not exist."
  Hume would recognize this immediately. It captures the *pragmatic* utility of causation. We care about causes because we want to produce or prevent effects.
  *   **The MR Connection:** This is where your career comes in. In MR, you use genetic variants as instruments because you *cannot* intervene on the exposure (e.g., LDL cholesterol) directly in an RCT. You are looking for a "natural experiment."
  *   Hume would be fascinated by MR. He would see it as a sophisticated attempt to find a "constant conjunction" that *mimics* an intervention. He would appreciate that you aren't positing hidden powers; you are using statistical regularities to approximate the counterfactual leverage you'd get from manipulation.

  ### 3. The "Primitive" Objection
  Here is where Hume would push back on Woodward, and this is the crux of your question about "extra machinery."

  Woodward treats "intervention" as a primitive notion in his theory (to avoid circularity). He defines an intervention variable $I$ on $X$ with respect to $Y$ such that $I$ causes $X$, $I$ does not cause $Y$ except through $X$, etc.
  Hume would raise an eyebrow. "You define causation via intervention, but intervention is itself a causal notion ($I$ causes $X$). Is this not circular?"

  Woodward's defense is that intervention is understood intuitively or via agency.
  **Hume's Verdict:** He would accept this *only if* "agency" is reduced to impressions of volition.
  *   If Woodward says "Intervention is a metaphysical primitive," Hume rejects it.
  *   If Woodward says "Intervention is a placeholder for human action/experimentation," Hume accepts it.

  Hume would argue that the *do*-operator doesn't need a new metaphysics; it just needs a psychology of action. The "necessity" we feel in an intervention isn't in the world; it's in the expectation that the volition will be followed by the outcome.

  ### 4. The Verdict
  If forced to choose, **Hume sides with Woodward and Pearl, but he reduces their ontology.**

  He would reject Lewis's possible worlds as "divinity school" metaphysics—untraceable to impressions and ontologically extravagant. He would see Lewis as making the mistake of thinking that because we *speak* in counterfactuals, there must be a *realm* that makes them true.

  For Woodward/Pearl, Hume would say: "You have correctly identified that causation is about **invariance under manipulation**. However, do not pretend your 'interventions' are metaphysical primitives. They are just complex ideas derived from our impressions of voluntary action and the regularities that follow."

  **The Twist for a Geneticist:**
  Hume would likely find Mendelian Randomization to be the ultimate vindication of his skepticism.
  *   **The Problem:** We want to know if $X \to Y$.
  *   **The Ideal:** We intervene ($do(X)$).
  *   **The Reality:** We can't intervene ethically.
  *   **The Humean Solution:** We find a proxy (genetic variant) that is *randomly assigned* by nature (mimicking the exogeneity of an intervention) and check the regularity.

  Hume would argue that MR doesn't prove "causation" in a deep metaphysical sense (no necessary connection is revealed). It just establishes a **more robust constant conjunction** that is insulated from certain confounders. It strengthens the *habit of the mind* to expect $Y$ given $X$, but it doesn't unlock the "secret powers" of the genes.

  ### Summary
  Hume would view Lewis as a realist who got seduced by grammar, turning a feature of human thought (counterfactual reasoning) into a feature of the universe (possible worlds).

  He would view Woodward/Pearl as methodological allies who formalized the experimental method, provided they admit that "intervention" is just a fancy word for "volition plus regularity."

  He would tell you: "You geneticists are doing fine work. You are mapping the constant conjunctions with greater precision than I could with billiard balls. But do not tell me you have found 'Causation' with a capital C. You have only found a regularity so robust that no sensible man would bet against it. And that is enough for life, even if it is not enough for metaphysics."
