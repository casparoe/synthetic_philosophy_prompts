      *   The "Primitive" Problem: Can "Intervention" be an impression? (Volition/Agency).
      *   The MR Connection: How MR validates Hume's worry (we need the *appearance* of intervention).
      *   Conclusion: Woodward wins, but Hume reduces the machinery.

