      *   *Pragmatic:* You should admire $X$ if admiring $X$ benefits you.
      *   The "Wrong Kind of Reasons" (WKR) problem is the standard metaethical framework for this. It distinguishes between reasons that make an attitude *correct* (fitting) vs. reasons that make it *beneficial* to have the attitude.

