  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The wake. The tension. The diary is the elephant in the room.
      *   **Round 1: The Initial Shock.** Heinrich tries to hold the line (Logic is pure). Ernst pushes back (It's not just a hobby).
      *   **Round 2: The Core Argument (Ernst).** Connect *Psychologism* to *Democracy*. Frege hated the idea that truth depends on human minds (psychologism). He also hated the idea that governance depends on human voices (democracy). Both seek a realm above the fray. The "Third Realm" is an intellectual aristocracy.
      *   **Round 3: The Counter (Heinrich/Dummett).** Truth *is* independent. If 2+2=4, it doesn't matter if a fascist wrote it. To deny the logic because of the man is to commit the genetic fallacy. The *Grundgesetze* derivation is formal.
      *   **Round 4: The Climax/Hit.** Ernst argues that the *motivation* for the formalism was the desire for authority that cannot be questioned. Heinrich argues that the *result* transcends the motivation.
      *   **Ending:** No clear resolution, but a shift in understanding. A somber close.

  4.  **Refining the Philosophy:**
      *   *Frege's Anti-Psychologism:* Frege argued that logic isn't about how humans *think* (mental processes), but about objective truth conditions. Thoughts exist in a "third realm" distinct from the external physical world and the internal mental world.
      *   *The Political Link:* If you believe truth is utterly detached from human consensus, does that make you disdainful of human consensus in politics? Ernst needs to make this link tight. It's about *authority*.
      *   *The Dummett Position:* Michael Dummett wrote the introduction to Frege's *Begriffsschrift* (1973) and later grappled with the diary. He said we cannot ignore the politics, but the logic remains valid. I need to capture that tension. "We cannot celebrate him, but we cannot discard him."

