          *   *Heinrich:* Needs to channel Dummett (who actually edited Frege's works and grappled with this). Appalled by the man, but insisting the *Grundgesetze* arguments stand or fall on validity alone. Truth is objective, regardless of the discoverer.
      *   **Tone:** Real back-and-forth, no strawmanning, hitting specific philosophical points. Intellectual but emotional (it's a wake).
      *   **Historical Note:** Frege died in 1925. The diary wasn't actually discovered until much later (by Bernardo Cantens in the 1990s, published by Gottfried Gabriel in the 2000s). *Correction:* The prompt says "word's just gotten out." For the sake of the novel's plot, I must accept this alternate history or timeline shift where the diary is revealed immediately upon death. I will treat it as an alternate history scenario where the diary is found among his papers *now* (1925).
      *   **Key Terminology:** *Psychologism*, *Third Realm* (Drittes Reich), *Grundgesetze*, *Objectivity*.

  2.  **Character Conception:**
