answer: |-
  The coffee in the faculty lounge had gone cold, thick with a skin of grease. Outside, the Jena streetlights flickered on against the early twilight. On the table between them lay a stack of papers, bound in twine, looking innocuous enough to be lecture notes.

  "He called it a *Drittes Reich*," Ernst said, tapping the top sheet. He didn't look at Heinrich. "A Third Realm. Thoughts existing objectively, untouched by human minds. Untouched by *us*."

  Heinrich stared at the urn on the sideboard. "It is a metaphor for objectivity, Ernst. Not a political manifesto. He meant that the Pythagorean theorem was true before anyone thought it."

  "And that no amount of voting could make it false," Ernst snapped, turning to him. "That is the point, isn't it? The consensus of the masses is irrelevant to Truth. Only the Law matters."

  "He was speaking of logic."

  "Was he?" Ernst stepped closer, his voice dropping, sharp as a scalpel. "Read the diary, Heinrich. Read the way he speaks of the Reichstag. He calls it a 'swamp.' He calls the voters 'herd animals.' He despises the messiness of human agreement. Now look at his war on *psychologism*. What was his great enemy for forty years?"

  "Confusing the act of thinking with the content of thought," Heinrich recited, tiredly. "A necessary distinction."

  "Was it?" Ernst leaned on the table. "Or was it a purge? He wanted to scrub logic clean of anything human. Anything subjective. Anything that smacked of a mind that could feel, or waver, or *vote*. He built a system where Truth is an absolute monarch. It doesn't negotiate. It doesn't ask for consent. It just *is*. That isn't just compatible with his politics. It's the same architecture."

  Heinrich finally turned. His face was grey, the grief of the day etched deep into the folds of his cheeks. "You are committing the genetic fallacy. You are judging the structure by the builder's character."

  "I am judging the blueprint by the builder's intent!"

  "The *Grundgesetze* does not care about Frege's intent!" Heinrich's voice cracked, louder than he intended. He lowered it, trembling. "If the derivation holds, it holds. If the axioms lead to the conclusion, they do so regardless of whether the man who wrote them loved his neighbor or hated him. Truth is not a moral agent. It does not become false because a bigot discovered it."

  "So we separate them?" Ernst gestured to the diary. "We put the logic in the library and the hate in the trash? You think that works? You think a mind that craves that kind of purity in numbers doesn't crave it in people?"

  "I think," Heinrich said, picking up a pen and setting it down again, "that if I prove a theorem, I am submitting to a law higher than myself. Frege taught us that. If that law is rigid, it is because reality is rigid. Not because he was cruel."

  "Reality doesn't demand we strip away the human to see it," Ernst countered. "That was his choice. His *hunger*. He wanted a place where he couldn't be contradicted by the mob. A realm where his authority was absolute because it was 'objective.' He created a kingdom of concepts where he was the only king. That is not science, Heinrich. That is a fantasy of control. And now we know he wanted to enact that fantasy on the state, too."

  Heinrich looked at the urn again. "I know what he wrote. I have read the pages you have. I am sickened."

  "Then how can you defend the work?"

  "Because I have no choice," Heinrich said softly. "If I say his logic is tainted, I am saying truth is tainted. I am saying that logic is *psychological*. I am saying that because Frege was a flawed man, the law of non-contradiction is negotiable. If I concede that, I give up the only ground we have to stand on against the very madness you fear."

  Ernst went quiet. The argument landed; he shifted his weight. "You think preserving the purity of logic protects us from fascism?"

  "I think admitting that logic is subject to moral judgment opens the door to saying logic is subject to *political* judgment," Heinrich said. "If we say his theorems are 'fascist' because he was, then tomorrow someone else can say a theorem is 'Jewish' or 'Bolshevik' because of who wrote it. We lose the Third Realm. We lose the only place where we are all equal before the Law."

  "The Third Realm," Ernst repeated, bitter. "A place without people. Is that what you want? A world without people?"

  "I want a world where the truth doesn't change when the government does," Heinrich said. "Frege gave us that. The cost was his soul. Not ours."

  "He didn't pay the cost alone," Ernst said, turning to the door. "He asked us to live in his kingdom. To treat thoughts like corpses, dissected and clean. No blood. No noise. No democracy."

  "Better a kingdom of silence," Heinrich whispered to the empty room, "than a swamp where nothing is true."
