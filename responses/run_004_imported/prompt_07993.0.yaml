          *   *Generality Problem:* How do we define the "process"? Is it "looking at a map" or "looking at a map while tired on a Tuesday"?
          *   *Gettier Cases:* Reliable processes can still lead to accidentally true beliefs (the broken clock example).
          *   *Internalism vs. Externalism:* Does the *agent* need to know the process is reliable, or just *be* reliable?
          *   *Virtue Epistemology:* Sosa, Greco, etc., argue knowledge is a cognitive achievement, not just a reliable output.

  3.  **Bridge the Gap (Chemist vs. Philosopher):**
