answer: |-
  This is a sharp intuition, and you have correctly identified one of the most significant tension points in the contemporary accuracy-first literature. You are not missing a standard fix; rather, you are putting your finger on a live wire that several prominent epistemologists are currently grappling with.

  Here is a gut check on the argument's validity, its novelty, and the specific literature you need to engage with to make this paper work.

  ### 1. The Validity of the Argument
  Your core diagnosis is correct: **There is a justificatory asymmetry.**

  *   **Probabilism (Joyce 1998, 2009):** This is a **synchronic dominance** argument. If your credences are incoherent, there is a coherent alternative that is *more accurate in every possible world*. It does not matter what your prior opinions are; the math holds categorically.
  *   **Conditionalization (Greaves & Wallace 2006):** This is a **diachronic expected accuracy** argument. Conditionalization maximizes expected accuracy *relative to your prior*. If you don't trust your prior (or if your prior is incoherent), the argument loses its normative grip. It is hypothetical: *If* you want to maximize accuracy from the perspective of your current self, *then* you should conditionalize.

  **The "Unification" Problem:** Accuracy-first epistemology (AFE) markets itself on deriving Bayesian norms from a single source: the value of accuracy. But if Probabilism is derived via **categorical dominance** and Conditionalization via **hypothetical expectation**, the "single currency" claim is threatened. It looks like AFE gives you Probabilism as cash, but Conditionalization on credit.

  **Your Critique of Briggs & Pettigrew (2020):** This is the strongest part of your pitch. Briggs and Pettigrew (*"An Accuracy-Dominance Argument for Conditionalization"*) explicitly try to fix this asymmetry by constructing a dominance argument for updating *rules*.
  *   **Your Instinct:** You suspect this smuggles in expectation-like assumptions.
  *   **The Technical Reality:** You are right to be skeptical. To run a dominance argument over *rules* (rather than static states), you must define the accuracy of a rule across worlds. A rule maps evidence to credences. To compare Rule A and Rule B in World $w$, you need to know what evidence is received in $w$.
  *   **The Catch:** If the agent is uncertain about what evidence they will receive (which is standard), evaluating the *rule* requires weighting the accuracy of the rule's output across different evidence scenarios. That weighting *is* an expectation. Briggs & Pettigrew avoid this by assuming the agent is certain about their **evidential partition** (they know what possible evidence states exist). Critics argue this assumption does a lot of heavy lifting and effectively reintroduces the structural assumptions of the expected accuracy framework under the guise of "dominance over plans."

  ### 2. Novelty and Publication Potential
  **Is this novel?**
  The asymmetry itself is well-known. Greaves, Pettigrew, and Joyce all acknowledge it. However, there is absolutely room for a paper that focuses specifically on the **threat to the unification project**.

  Many papers treat the Briggs & Pettigrew result as a "fix." A paper that argues the fix is **philosophically insufficient to restore the unity of the project** is worth writing. Specifically, if you can argue that *plan-dominance* is a fundamentally different normative species than *state-dominance*, you undermine the claim that AFE provides a *uniform* foundation for Bayesianism.

  **How to frame it for maximum impact:**
  Don't just argue "Briggs & Pettigrew fail." Argue that **even if they succeed mathematically, they fail philosophically** to deliver the same kind of vindication Joyce delivered for Probabilism.
  *   Joyce's argument works even for the "incoherent skeptic."
  *   The B&P argument requires the agent to have a fixed view of their evidential situation (a "learning scenario").
  *   Therefore, AFE unifies the *math*, but not the *epistemic status* of the norms.

  ### 3. Essential Reading List
  To write this, you need to engage with the following. If you haven't read these, they are your homework:

  1.  **Briggs, R. A., & Pettigrew, R. (2020). "An Accuracy-Dominance Argument for Conditionalization." *Noûs*.**
      *   You must engage with their specific setup. Look closely at their "Deterministic Updating" assumption and how they define the accuracy of an updating rule.
  2.  **Gallow, J. D. (2019). "Diachronic Dutch Books and Evidential Import." *Philosophy and Phenomenological Research*.**
      *   Gallow is very critical of diachronic accuracy arguments. He argues that accuracy arguments for conditionalization often rely on assumptions about evidence that are not purely accuracy-based. This aligns with your "smuggling" intuition.
  3.  **Gallow, J. D. (2021). "Accurate Updating." *Philosophers' Imprint*.**
      *   Further development of his critique. He argues that accuracy arguments for conditionalization require assumptions about the relationship between worlds and evidence that are not guaranteed by accuracy alone.
  4.  **Greaves, H. (2013). "Epistemic Decision Theory." *Mind*.**
      *   She explicitly discusses the tension between the categorical nature of probabilism and the relative nature of conditionalization.
  5.  **Schoenfield, M. (2017). "The Value of Accuracy."**
      *   She raises issues about how accuracy measures interact with updating, specifically regarding "accuracy for the sake of accuracy."
  6.  **Levinstein, B. (2017). "Permissive Rationality and Sensitivity." *Philosophy and Phenomenological Research*.**
      *   Relevant for discussions on how priors constrain rationality in AFE.

  ### 4. Potential Pitfalls to Avoid
  *   **Don't ignore the "Plan" distinction:** Pettigrew will reply that we shouldn't evaluate credences at a time, but *strategies* over time. You need to explain why evaluating strategies doesn't grant the same "no-matter-what" force as evaluating static states. (Hint: A strategy is only dominant if you actually follow it; evaluating the strategy often assumes you know which branch of the strategy will be triggered).
  *   **Don't conflate with Pragmatism:** Ensure you stay within *epistemic* utility. Don't slide into "conditionalization is good because it helps you bet." Keep the focus on accuracy scores.
  *   **Acknowledge the "Factiveness" Assumption:** Briggs & Pettigrew often assume that the evidence partition is factive or known. If you point out that this assumption is doing the work that "expectation" did in Greaves & Wallace, you strengthen your "smuggling" claim.

  ### 5. Verdict
  **Go for it.**
  This is a solid "critical engagement" paper. It doesn't need to prove a new theorem; it needs to provide a clearer philosophical interpretation of existing theorems.

  **Working Title Idea:** *"The Disunity of Accuracy: Why Dominance and Expectation Don't Mix in Epistemic Justification"* or *"Smuggling Expectation: The Illusion of a Dominance Argument for Conditionalization."*

  Your intuition that the "single currency" buys different goods in the synchronic and diachronic cases is the right hook. If you can show that the diachronic argument relies on a prior commitment to the reliability of the agent's evidential outlook (which the synchronic argument does not), you have a genuine contribution.
