  4.  **Evaluate Douglass's Mature Position against these Categories:**

      *   *Argument for Public-Meaning Originalism:* Douglass focuses on what the text *says*. He argues that because the words "slave" aren't there, the public meaning *should* be liberty. However, standard public-meaning originalism asks what the public *actually* understood in 1787/1789. In 1789, the public *did* understand "person held to service" to mean slave. Douglass's 1851 view seems to reject that historical understanding in favor of a stricter textual reading. So, is it *really* original public meaning? Or is it a *normative* claim about how public meaning *ought* to be derived?

      *   *Argument for Natural Law/Canon of Construction:* Lysander Spooner's influence is key here. Spooner argued that unless a law *explicitly* sanctions slavery, the presumption of liberty prevails. This is a canon of construction rooted in natural rights (liberty is the default state). Douglass adopts this: The text doesn't *explicitly* sanction slavery, therefore it sanctions liberty. This looks less like empirical historical linguistics (public meaning) and more like a rule of interpretation favoring liberty (natural law).

  5.  **Synthesize the Implications for Modern Originalism:**
      *   **The Tension:** Douglass's shift highlights the tension between *semantic context* (what people knew the euphemisms meant) and *semantic content* (what the words literally denote).
      *   **The "Liquidation" Problem:** If the public understood the euphemisms as slavery, does ignoring that violate democracy/history? Or does adhering to the text protect minority rights against majoritarian understanding?
      *   **Normative vs. Descriptive:** Originalism claims to be descriptive (what was the meaning?). Douglass's mature view is partly normative (the meaning *must* be liberty because slavery is illegitimate without explicit words).
      *   **The "Constitutional Glitch":** Douglass treats the Constitution as a tool for liberation. This anticipates the "Living Constitution" or "Moral Reading" (Dworkin), but framed through text.

