      *   *Phase 3 (Douglass mature, 1851+):* Influenced by Smith/Spooner. Argues literal absence of words matters. Constitution is anti-slavery. Focus on *text* over *understood context*.

  3.  **Analyze the Jurisprudential Categories:**
      *   **Original Intent:** What did the framers *mean* to do? (Subjective mental state).
      *   **Original Public Meaning:** What would a reasonable person at the time understand the words to mean? (Objective communicative content).
