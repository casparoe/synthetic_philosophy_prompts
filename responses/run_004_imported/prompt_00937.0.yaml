answer: |-
  This is an exceptional case study for a graduate seminar. It cuts to the heart of the hermeneutic tension between text, context, and normativity. Frederick Douglass's intellectual journey offers a pre-modern stress test for the categories we now use to describe constitutional theory.

  To answer your specific question directly: **Douglass's mature (1851+) position is better understood as a natural-law canon of construction expressed in textualist terms, rather than a genuine instance of original public-meaning originalism.**

  While his mature view employs textualist rhetoric, it fundamentally rejects the empirical historical inquiry that defines modern public-meaning originalism. Below is a breakdown of the implications of this reversal for modern jurisprudence, structured to help you facilitate seminar discussion.

  ### 1. Distinguishing the Two Douglass Positions

  To teach this effectively, it helps to map Douglass's shifts onto modern jurisprudential categories.

  **The 1849 Douglass (Proto-Public-Meaning Originalism)**
  When Douglass argued that the Constitution was pro-slavery because the *public understood* the euphemisms to refer to slaves, he was articulating a view remarkably similar to modern **Original Public Meaning (OPM)**.
  *   **The Theory:** Meaning is not found in the secret intentions of the framers (Original Intent), nor strictly in the dictionary definition of the words (strict textualism), but in how a reasonable member of the public at the time of ratification would have understood the communicative content.
  *   **The Evidence:** In 1787–1789, the American public knew "person held to service" was a euphemism for "slave." Therefore, the public meaning *was* pro-slavery, regardless of the absence of the word.
  *   **Jurisprudential Implication:** This view acknowledges that language relies on shared context. If OPM requires us to recover the "objective communicative content," that content includes the shared cultural knowledge that these clauses protected property in humans.

  **The 1851 Douglass (Natural-Law Textualism)**
  When Douglass reversed course under the influence of Spooner and Smith, he argued that because the words "slave" and "slavery" were absent, the document *must* be read as anti-slavery.
  *   **The Theory:** This relies on the **Presumption of Liberty**. It posits that in a system founded on natural rights, any deprivation of liberty requires explicit, unambiguous textual authorization. Ambiguity or euphemism cannot suffice to legitimize oppression.
  *   **The Evidence:** The literal text does not sanction slavery; therefore, the legal default is freedom.
  *   **Jurisprudential Implication:** This is not historical empiricism; it is a **normative canon of construction**. It dictates how judges *ought* to read ambiguous texts when fundamental rights are at stake.

  ### 2. Why the Mature Position is Not "Original Public Meaning"

  For your seminar, the critical distinction lies in the definition of "meaning."

  **The Empirical Problem:**
  Modern OPM originalists (e.g., Randy Barnett, Keith Whittington) claim to be engaged in a factual inquiry: *What did the words mean to the people then?* If you ask that question honestly about the Fugitive Slave Clause in 1789, the answer is "slaves." Douglass's 1851 position essentially says, "It doesn't matter what they thought it meant; it matters what the words *could* mean consistent with justice."

  **The "Liquidation" Problem:**
  Madisonian theory suggests that ambiguous text is "liquidated" by early practice and understanding. The early practice (e.g., Fugitive Slave Act of 1793) confirmed the pro-slavery understanding. Douglass's 1851 view requires ignoring this liquidation in favor of a "fresh" reading of the text. This anticipates the **New Originalism** distinction between *interpretation* (finding meaning) and *construction* (applying meaning when underdeterminate). Douglass is arguing that the text is underdeterminate regarding slavery, and therefore the *construction* phase must be governed by natural law principles.

  ### 3. Implications for Modern Jurisprudence

  Here are four key implications for your seminar discussion regarding the Original Intent vs. Original Public Meaning debate:

  #### A. The Normative Core of Textualism
  Douglass's reversal exposes that "textualism" is rarely value-neutral.
  *   **Modern Parallel:** Modern textualists often claim they are just reading the words. Douglass shows that choosing to privilege the *literal absence* of a word over the *contextual presence* of a concept is itself a normative choice.
  *   **Seminar Question:** Is Douglass's 1851 view a form of "Thibodeau-style" textualism (where context is ignored to produce a specific outcome), or is it an admission that all textualism relies on background normative assumptions?

  #### B. Originalism as a Tool for Liberation vs. Status Quo
  Conventionally, originalism is critiqued as a conservative methodology that locks in historical injustices (like slavery). Douglass's mature theory challenges this.
  *   **The Paradox:** Douglass uses a form of "originalism" (fidelity to the ratified text) to argue for radical social change. He separates the *text* from the *corrupt practices* of the government.
  *   **Implication:** This suggests that the distinction between "Original Intent" and "Public Meaning" may be less important than the distinction between **"Original Law" vs. "Original Practice."** Douglass argues the *Law* (the text) was anti-slavery, even if the *Practice* (the courts and Congress) was pro-slavery.
  *   **Seminar Question:** Can original public meaning originalism accommodate Douglass's 1851 view by distinguishing between the *semantic meaning* (which might be neutral) and the *expected application* (which was pro-slavery)? (See Jeffrey Pojanowski's work on this distinction).

  #### C. The Role of Canons of Construction
  Douglass's mature view is essentially an argument for a **super-canon**: the presumption of liberty trumps historical context.
  *   **Modern Parallel:** This mirrors the "Rule of Lenity" in criminal law or the "Clear Statement Rule" for abrogating sovereign immunity. Douglass argues there should be a "Clear Statement Rule" for violating natural rights.
  *   **Implication:** This challenges the OPM claim that history alone resolves ambiguity. It suggests that when history is morally repugnant, normative canons should override historical expectations.
  *   **Seminar Question:** If we accept Douglass's canon, does it undermine the democratic legitimacy of originalism? If the "public meaning" was pro-slavery, do we have the right to override it with a natural-law canon?

  #### D. The "Fixation" Thesis
  Originalism relies on the thesis that meaning is fixed at ratification.
  *   **Douglass's Challenge:** Douglass's 1851 view implies that the *principles* are fixed (liberty), but the *application* evolves. He treats the Constitution as a "glorious liberty document" whose anti-slavery potential was always there, waiting to be realized.
  *   **Implication:** This sounds closer to **Dworkin's "Moral Reading"** than Scalia's originalism. It treats the text as embodying abstract moral principles (liberty) rather than concrete historical expectations (property in slaves).
  *   **Seminar Question:** Does Douglass's mature view collapse the distinction between Original Public Meaning and Living Constitutionalism? If the "public meaning" of "liberty" is broad enough to encompass Douglass's 1851 reading, is originalism distinct from moral reading?

  ### 4. Suggested Teaching Framework

  For the seminar, I recommend framing the discussion around the **Interpretation/Construction Distinction**.

  1.  **Interpretation:** What is the semantic meaning of "person held to service"?
      *   *1849 Douglass:* A slave (based on public understanding).
      *   *1851 Douglass:* A person (based on literal text).
  2.  **Construction:** How do we apply this when the text is ambiguous regarding the legitimacy of the status?
      *   *1849 Douglass:* Defer to historical practice/expectations.
      *   *1851 Douglass:* Apply the Presumption of Liberty (Natural Law).

  **Conclusion for the Class:**
  Douglass's mature position is not true Original Public Meaning originalism because it rejects the empirical reality of how the public understood the euphemisms. Instead, it is a **normative textualism grounded in natural law**.

  However, its importance for modern theory is profound. It demonstrates that fidelity to the text can be a radical, rather than conservative, act. It suggests that if originalism is to be a viable theory for a pluralistic society, it may need to incorporate Douglass's "clear statement" canon: **The Constitution should not be read to sanction fundamental rights violations unless the text does so explicitly, regardless of historical expectations.**

  This moves the debate from "What did they mean?" to "What burden of proof is required to restrict liberty?"—a shift that remains central to modern substantive due process and rights litigation.
