prompt: |-
  ok so my school's AI club landed a real interpretability researcher for our little podcast and I have to write the questions lol. shes a hardcore realist about neural network representations -- when interp people find a "direction" in a models activations lining up with some concept, she thinks that's a genuine discovery of something the model is using, not us projecting patterns onto a pile of matrices. her go-to move whenever anyone brings up superposition (concepts overlapping in the same directions instead of clean neurons, so different sparse-autoencoder settings turn up different "features") is to just say "that's a tooling problem, not a reason to doubt there's something real to find." can you write me like 8 questions that make that dodge progressively harder to use? want at least one on that superposition thing, one on probing classifiers finding stuff that's decodable vs. actually used by the model (like the Othello board-game study, but for stuff you can't check against any ground truth), and end with one on what result would actually make her drop the view -- plus a quick follow-up each time for whatever she'll probably say back.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** High school AI club podcast interviewing a real interpretability researcher.
      *   **Guest's Stance:** Hardcore realist about neural network representations. Believes discovered directions/features are genuine mechanisms, not artifacts/projections. Dismisses superposition issues as "tooling problems."
      *   **Goal:** Write 8 questions that make her "dodge" (dismissing counter-arguments as tooling issues) progressively harder to use.
      *   **Specific Requirements:**
          *   At least one question on superposition.
          *   At least one question on probing classifiers (decodability vs. causal usage, referencing the Othello study context but for ungrounded concepts).
          *   End with a question on what evidence would change her mind (falsifiability).
          *   Include a follow-up for each question to anticipate her likely response.
      *   **Tone:** Respectful but challenging (it's a school podcast, but they want to dig deep).

  2.  **Deconstruct the Guest's Position (The "Realist" View):**
      *   *Core Belief:* Neural networks represent concepts in vector space. If we find a direction, it's *there*.
      *   *Defense Mechanism:* "Superposition/Polysemanticity is just a limitation of current SAEs (Sparse Autoencoders) or probing methods. Better tools will reveal the true, monosemantic features."
      *   *Weakness:* This is hard to falsify. It relies on an "ideal tool" that doesn't exist yet. To challenge this, we need to ask about *current* evidence, *causal* impact, and the *definition* of "real."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Warm-up/Definition.* Start by clarifying what she means by "real."
          *   *Idea:* What does it mean for a direction to be real?
          *   *Refinement:* Make it about the ontology. Is it like a physical object or a useful map?
          *   *Follow-up:* If she says "useful map," press on whether maps can be wrong.

      *   *Q2: The Projection Argument.* Address the "human projection" counter-argument directly.
          *   *Idea:* How do we know we aren't just seeing faces in clouds?
          *   *Refinement:* Focus on the selection bias. We look for "dog" and find "dog." What if we looked for "not-dog"?
          *   *Follow-up:* If she says "we test causality," ask about the threshold.

      *   *Q3: Superposition (Required).* This is her main dodge ("tooling problem").
          *   *Idea:* Superposition means features overlap. You say it's tooling.
          *   *Refinement:* If features are truly overlapping, does the *concept* exist as a single direction, or is the "direction" we find just a slice of a higher-dimensional polytope?
          *   *Follow-up:* If she says "SAEs will fix it," ask about the stability of features across different SAE runs.

      *   *Q4: Probing vs. Causality (Required).* Decodability $\neq$ Usage.
          *   *Idea:* Othello study showed we can decode board state, but does the model *use* it?
          *   *Refinement:* For concepts without ground truth (like "deception" or "sycophancy"), how do we distinguish a correlate from a mechanism?
          *   *Follow-up:* If she says "intervention," ask about the specificity of the intervention.

      *   *Q5: Stability/Robustness.* If it's real, it should be robust.
          *   *Idea:* Do features stay the same if we retrain the model?
          *   *Refinement:* If I train two models on the same data, do they learn the *same* directions? If not, in what sense is the direction "real"?
          *   *Follow-up:* If she says "convergence," ask about the variance.

      *   *Q6: The "Tooling Problem" Dodge.* Directly address her go-to move.
          *   *Idea:* You say superposition is a tooling problem. When does it become a theory problem?
          *   *Refinement:* At what point does blaming the tool prevent us from seeing that the underlying assumption (linear representationalism) might be wrong?
          *   *Follow-up:* If she says "never," ask for a concrete benchmark.

      *   *Q7: Non-Linear/Complex Concepts.* Push beyond simple features.
          *   *Idea:* What about complex reasoning?
          *   *Refinement:* Linear directions work for "gender" or "sentiment." What about multi-step reasoning chains? Are those just chains of directions, or something else?
          *   *Follow-up:* If she says "chains," ask about the binding problem.

      *   *Q8: Falsifiability (Required).* The closer.
          *   *Idea:* What would prove you wrong?
          *   *Refinement:* What specific experimental result would force you to abandon the realist view?
          *   *Follow-up:* If she says "nothing," call out the dogma.

  4.  **Review and Polish:**
      *   *Check Constraints:* 8 questions? Yes. Superposition included? Yes (Q3). Probing/Othello included? Yes (Q4). Falsifiability included? Yes (Q8). Follow-ups included? Yes.
      *   *Tone Check:* Are these too aggressive? They need to be firm but polite for a high school podcast. I'll add an intro note about delivery.
      *   *Progression:* Do they get harder? Yes, starting with definitions, moving to specific technical hurdles (superposition, causality), and ending on philosophy of science (falsifiability).
      *   *Addressing the "Dodge":* The follow-ups are crucial here. They need to anticipate her "better tools coming soon" response and ask for *current* criteria.

  5.  **Final Tweak:** Ensure the "Superposition" question specifically targets the "tooling problem" dismissal. Ensure the "Probing" question highlights the lack of ground truth for abstract concepts. (Self-Correction: Make sure the follow-ups sound like natural conversational pivots, not just "But what about...")

  6.  **Final Output Generation:** (Drafting the response based on the above plan.)
answer: |-
  This is a fantastic opportunity for your club. Getting a real researcher is huge. Since she's a "hardcore realist," her position is essentially: *"The features are there in the math; our microscopes are just blurry."*

  To make that dodge harder to use, you need to move the conversation from **"Can we see it?"** (which she can blame on tools) to **"What counts as evidence?"** and **"What if the map doesn't match the territory?"**

  Here are 8 questions, ordered to slowly tighten the net, including the specific topics you asked for.

  ### 1. The Ontology Opener
  **Question:** "To start, when you say a feature direction is 'real,' are you saying it exists independently of our methods, like a planet waiting to be discovered? Or is it 'real' in the sense that it's a useful compression of the model's behavior, like a constellation?"

  *   **Why this works:** It forces her to define "real" immediately. If she says "planet," she has to prove objective existence. If she says "constellation," she admits it's partly human-imposed.
  *   **Likely Answer:** She'll probably say "It's a planet, but our telescopes are blurry."
  *   **Follow-up:** "If it's a planet, then two different telescopes should eventually point at the same coordinates. When different interpretability methods find conflicting features for the same concept, how do we decide which one is the 'planet' and which one is the optical illusion?"

  ### 2. The Selection Bias Trap
  **Question:** "A common critique is that we find what we look for. If I train a probe to find 'deception,' I'll find a direction that correlates with deception. But how do we know the model isn't just using a bunch of unrelated heuristics that *look* like deception to us?"

  *   **Why this works:** It challenges the idea that correlation equals mechanism.
  *   **Likely Answer:** "We use causal interventions. We ablate the direction and the behavior stops."
  *   **Follow-up:** "But ablation can break things without revealing how they work. If I remove the engine from a car, it stops moving, but that doesn't prove the engine was the *only* thing moving it. How do you distinguish a 'cause' from a 'bottleneck'?"

  ### 3. The Superposition Challenge (Required Topic)
  **Question:** "Let's talk about superposition, where multiple features share the same neurons. Your take is that this is a tooling problem—that better Sparse Autoencoders (SAEs) will untangle them. But if features are truly superposed, doesn't that imply the 'concept' doesn't exist as a single linear direction at all?"

  *   **Why this works:** This directly targets her go-to dodge. It asks if the "linear direction" assumption is the flaw, not the tool.
  *   **Likely Answer:** "No, the features are still monosemantic, they're just packed efficiently. Better SAEs will find the true basis."
  *   **Follow-up:** "But different SAE runs with different hyperparameters often produce different features for the same model. If the 'true basis' changes depending on how we tune the tool, in what sense is that basis 'real' rather than just a convenient decomposition?"

  ### 4. Decodability vs. Causal Usage (Required Topic)
  **Question:** "In the Othello study, researchers could decode the board state from the model's activations. But later work suggested the model might not actually *use* that board representation to play; it might just be a byproduct. For concepts without ground truth, like 'sycophancy' or 'reasoning,' how do we prove the direction is actually used, not just decodable?"

  *   **Why this works:** It uses a concrete example (Othello) to show that "we can find it" $\neq$ "the model uses it."
  *   **Likely Answer:** "We need to do causal tracing and show that perturbing that representation changes the output in a predictable way."
  *   **Follow-up:** "Sure, but for abstract concepts, the 'predictable way' is defined by human judgment. If we intervene on a 'reasoning' direction and the model outputs what *we* think is better reasoning, aren't we just aligning the model to our projection of reasoning?"

  ### 5. The Convergence Test
  **Question:** "In physics, independent experiments converge on the same constants. If neural representations are real, should we expect two models trained on the same data to learn the exact same feature directions? Currently, they don't really."

  *   **Why this works:** It brings in the scientific standard of reproducibility. If the features are "real," they should be robust across instances.
  *   **Likely Answer:** "They don't need to be identical, just isomorphic. The structure is the same, even if the rotation is different."
  *   **Follow-up:** "But if we can't find the rotation matrix that aligns them without using the labels we're trying to discover, doesn't that make the 'structure' unfalsifiable? How do we verify the isomorphism without peeking at the answer key?"

  ### 6. The "Tooling Problem" Limit
  **Question:** "You've mentioned before that failures to find clean features are often just tooling problems. Is there any theoretical limit to that? At what point does blaming the tool prevent us from considering that the 'linear representation hypothesis' itself might be wrong?"

  *   **Why this works:** This is the direct challenge to her worldview. It asks for a boundary condition.
  *   **Likely Answer:** "I haven't seen evidence that linearity fails yet. Every time we improve tools, linearity looks better."
  *   **Follow-up:** "That sounds like a moving goalpost. If we need infinite compute and perfect SAEs to see the linearity, is the hypothesis still useful for safety work we need to do *now* with imperfect tools?"

  ### 7. The Binding Problem
  **Question:** "Human concepts are compositional. I can think of a 'purple elephant' without having a specific neuron for that combination. Neural networks seem to handle this via superposition or attention patterns. Do you think there's a single 'direction' for 'purple elephant,' or is the reality more dynamic?"

  *   **Why this works:** It pushes beyond simple features (like "cat" or "positive sentiment") into complex, compositional thought where linear directions struggle.
  *   **Likely Answer:** "It's likely a combination of 'purple' and 'elephant' directions bound by attention."
  *   **Follow-up:** "If the meaning comes from the *binding* mechanism (attention) rather than the directions themselves, doesn't that make the 'feature direction' secondary? Why focus on the bricks when the architecture is the house?"

  ### 8. The Falsifiability Closer (Required Topic)
  **Question:** "To wrap up, I want to ask about scientific rigor. For any theory to be scientific, there must be a way to prove it wrong. What specific experimental result would make you drop the realist view? What would convince you that these features are *not* real?"

  *   **Why this works:** This is the ultimate check. If she can't name a condition under which she'd be wrong, her view is a belief, not a scientific hypothesis.
  *   **Likely Answer:** "If we found that interventions on identified features had zero causal effect on output, or if SAEs completely failed to recover known ground-truth features in synthetic tasks."
  *   **Follow-up:** "But in synthetic tasks, we design the ground truth. If in the wild, non-synthetic models, the features remain unstable and intervention effects are brittle, would that be enough? Or would you always attribute that to one more tooling improvement needed?"

  ### Tips for Delivery:
  *   **Be Polite:** She's doing you a favor. Frame these as "I'm trying to understand the limits of the field" rather than "I think you're wrong."
  *   **Listen to the Follow-up:** If she gives a great answer to the main question, you can skip the follow-up. If she gives the "tooling problem" dodge, hit her with the follow-up.
  *   **The "We":** Notice I used "we" in the questions (e.g., "How do *we* know"). This makes it sound like you are exploring the mystery together, rather than interrogating her.

  Good luck! This lineup should make for a really compelling episode.
