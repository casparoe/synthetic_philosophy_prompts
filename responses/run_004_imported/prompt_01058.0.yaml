      *   Discuss the moral weight of intention (who you are vs. what happens).
      *   Discuss the practical/relational impact (trust in medicine).
      *   Address the factual aspect (does it actually shorten life?).
      *   Conclude with validation of their care.

  7.  **Final Review against Safety Guidelines:**
