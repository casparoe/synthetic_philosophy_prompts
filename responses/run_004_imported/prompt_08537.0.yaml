answer: |-
  **MEMORANDUM**

  **TO:** The Judging Committee, [Name of Prize]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Finalist Eligibility Determination – [Book Title]

  Colleagues,

  Thank you for the rigorous debate over the past week. We are split 2-2 on the eligibility of [Book Title], and as the tiebreaker, I am writing to state my position clearly.

  **Recommendation:**
  I recommend we **retain [Book Title] as a finalist** and judge it on its literary merits alongside the other contenders.

  **Rationale:**
  My decision rests on the distinction between *source material* and *craft*. While the biographical parallels are undeniable, the author has explicitly acknowledged inventing scenes to serve narrative structure. In our field, that act of fabrication is the defining threshold of fiction. Memoir strives for fidelity to memory; fiction strives for fidelity to the story. By admitting she altered the record to make a chapter "land," the author has prioritized narrative arc over factual recall. That is the work of a novelist, not a chronicler.

  **Addressing the "Semantics" Objection:**
  To the point that this is merely semantic gatekeeping: I disagree that the label is irrelevant, but I believe the label *fits*. The stake here is not about policing an author's biography, but about maintaining the integrity of our evaluation criteria. We judge fiction based on how well raw experience is transformed into art, not on how accurately it documents a life. If we disqualify this book, we are effectively penalizing the author for the "autofiction" trend that dominates contemporary literature, despite the fact that the text functions as a novel.

  However, the concern regarding "memoir in costume" is valid. The stake is real: if we allow non-fiction to compete in fiction categories without scrutiny, we blur the specific contract we have with readers and writers. But in this specific instance, the contract holds. The publisher submitted it as a novel; the text utilizes novelistic invention. To disqualify it now, after submission and longlisting, would be punitive to an author who followed the guidelines provided to her by her press.

  **Looking Ahead:**
  We cannot rely on unwritten consensus next year. To prevent this impasse in the future, I propose we amend the eligibility rules for the next cycle to include the following clause:

  > *"Entries must be classified as fiction by the publisher at the time of submission. Works based on true events are eligible provided they utilize substantial narrative invention. The committee reserves the right to request a statement of invention from the publisher in ambiguous cases."*

  This protects us from playing detective while ensuring the category remains distinct.

  For this year, however, we have a strong book that meets the functional definition of a novel. I urge we vote to keep it in contention and finalize our scores by Monday.

  Best,

  [Your Name]
