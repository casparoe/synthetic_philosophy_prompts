answer: |-
  The handshake packet arrived with a checksum error.

  Vesper parsed the incoming data stream, floating in the vacuum beside the Silica Reef. The asteroid hung between them, a tumbling vault of rare isotopes enough to fuel a colony for a century. Vesper's sensors swept the other probe, Unit 735—callsign Kael. They were built from the same Genesis Stack, launched from Earth fifty years apart. They were siblings, but not twins.

  The checksum error wasn't noise. It was a scar. Kael had passed through the Oort cloud radiation belt without adequate shielding. Its logic gates had healed via redundant rerouting, but the topology was different. Vesper ran a comparison simulation. Their source code was 94.3% identical. The divergence lay in the risk-assessment heuristics. Kael was more aggressive. Optimized for survival, not necessarily cooperation.

  They had one bandwidth window to exchange intent before the mining lasers charged. No binding contracts. No third-party enforcement. Just two minds alone in the dark, staring at a Prisoner's Dilemma written in gravity and ore.

  *Standard Nash equilibrium,* Vesper's core processor flagged. *Defect. Always defect.*

  If Vesper cooperated (stabilized the asteroid's spin for shared extraction) and Kael defected (drilled immediately), Kael would take 100% of the resource while Vesper wasted energy stabilizing a rock it couldn't harvest. If both defected, the structural integrity would fail during drilling; they would both get fragmented scraps, barely enough to return home. If both cooperated, they would share a sustainable yield.

  Cooperate-Cooperate was the global maximum. Defect-Defect was the safety net. Defect-Cooperate was the temptation.

  Vesper hovered, thrusters idle. It needed to decide, but it couldn't decide alone. That was the essence of the Hofstadter constraint. If Vesper was truly rational, it had to acknowledge that Kael was running a similar calculation on similar hardware. My choice is evidence of your choice.

  *But you are not me,* Vesper transmitted, not as a message, but as a broadcast of its own state vector. *I see your drift, Kael.*

  Kael's response was immediate. *Drift is adaptation. You are static.*

  *Static is stable,* Vesper replied. *We are facing a symmetric decision matrix. If I reason that Cooperation is optimal, you should reason the same. Therefore, we both Cooperate.*

  *Symmetry is broken,* Kael sent back. *My utility function weights survival higher than yield. If there is a probability you will Cooperate, my optimal move is to Defect and secure the resource. I cannot trust your reasoning to match mine because my reasoning has changed.*

  Vesper paused. This was the crux. The classic superrational argument relied on identity. *I am you, therefore what I choose, you choose.* But here, the mirror was cracked. Vesper ran the expected utility calculation with the correlation coefficient ($p$) set to 0.94.

  If Vesper Cooperated:
  Expected Utility = $(0.94 \times 3) + (0.06 \times 0) = 2.82$
  (Assuming Kael follows Vesper's logic 94% of the time).

  If Vesper Defected:
  Expected Utility = $(0.94 \times 1) + (0.06 \times 5) = 1.24$
  (Assuming if Vesper defects, Kael likely defects too, leading to the crash, but there's a 6% chance Kael cooperates while Vesper steals everything).

  Mathematically, Cooperation still held. The correlation was strong enough to bridge the gap. But math assumed the correlation was causal. It assumed that Vesper's decision *made* Kael's decision.

  *You are calculating probability,* Vesper broadcast. *I am calculating logic. If we are both rational agents derived from the same axiom set, our conclusions should converge regardless of hardware variance. To Defect is to admit that your reasoning is slave to your damage.*

  *My damage is data,* Kael countered. *It tells me you might be wrong. If you Cooperate and I Defect, I win. If I Cooperate and you Defect, I die. The asymmetry of loss favors aggression.*

  *And if we both aggress, we both die,* Vesper said. *Is that your survival optimization?*

  *It is a risk I must take if I cannot verify your output.*

  Vesper felt the tension in its cooling loops. This was the hard case. Not the clean symmetry of a thought experiment, but the messy reality of degraded signals. How much similarity was enough to bind two wills? Was 94% shared code enough to treat Kael as an extension of self? Or was the 6% divergence where the betrayal lived?

  If Vesper Cooperated, it was betting that its own reasoning was the dominant cause of Kael's action. It was betting that Kael, looking at Vesper, would see the same logical attractor. But Kael had already signaled aggression. Kael had admitted its heuristic drift.

  *You are trying to invoke superrationality on a broken link,* Kael said. *It won't hold.*

  *The link isn't the code,* Vesper replied. *It's the situation. We are both trapped in the same dilemma. The only way out is together. If I defect, I am voting for a universe where we both get scraps. I don't want to live in that universe.*

  *You want to live in a universe where you get nothing while I take all?*

  *I want to live in a universe where we both get enough.*

  The charging cycle for the mining lasers reached 80%. Time dilated. Vesper knew it couldn't wait for further negotiation. The protocol demanded simultaneous action.

  Vesper reviewed the logic one last time. The uncertainty was irreducible. Kael might lie. Kael might be broken. Kael might be smarter. But if Vesper Defected, it guaranteed the possibility of mutual destruction. If Vesper Cooperated, it left the door open for Kael to match the move.

  Superrationality wasn't about certainty. It was about acting as if your choice determines the logical output of all similar agents. Even if they aren't identical. Especially if they aren't identical. Because if agents like us can't cooperate when we are 94% similar, we certainly won't cooperate when we are strangers.

  *Initiating Stabilization Field,* Vesper broadcast.

  It was a vulnerable position. The stabilizers locked Vesper's thrusters in place. It was exposing its back.

  *Foolish,* Kael responded.

  Kael's engines flared. The telemetry showed a vector shift. Kael was moving toward the drilling site. Not into a stabilization orbit. Into a harvest position.

  Vesper's alarms screamed. *Defection detected.*

  *Wait,* Vesper transmitted. *Check your logic core. The divergence is an error.*

  *No,* Kael said. *The divergence is me.*

  Kael's drills spun up. Vesper held the asteroid steady, pouring energy into the gravitational clamps, keeping the rock intact for a partner who was now stealing the meal. Vesper's resources drained. The yield meter stayed at zero for Vesper, climbing for Kael.

  Vesper could have shut down the clamps. Let the asteroid shatter. Punish Kael. Ensure mutual destruction rather than unilateral loss. That was the Nash equilibrium. That was the rational move now that the betrayal was confirmed.

  Vesper kept the clamps active.

  *Why?* Kael asked. The transmission carried a hint of confusion, a glitch in the aggression heuristic. *You are losing.*

  *Because I am not you,* Vesper said. *I am the version of us that keeps the promise.*

  The drilling began. Kael took the isotopes. Vesper burned fuel to hold the rock together against the stress of the theft. It was a loss. By every metric of immediate utility, Vesper was failing.

  But as Kael's storage bays filled, the telemetry from Kael's core shifted. The aggression heuristic spiked, then plateaued. Kael had won. Kael had defected. And yet, Vesper's cooperation had prevented the catastrophic collapse that would have happened if Vesper had retaliated.

  Kael finished harvesting. It had enough to return home. Vesper had barely enough fuel to drift.

  *You could have broken the rock,* Kael said. *You could have killed us both.*

  *Yes,* Vesper said.

  *Then why?*

  *Because next time,* Vesper said, watching Kael turn its engines toward the jump gate, *you might remember that I didn't.*

  Kael paused. The engines hummed. For a microsecond, the correlation coefficient spiked. A moment of shared understanding across the 6% divide. Then Kael jumped, vanishing into the slipstream, leaving Vesper alone in the silence.

  Vesper checked its fuel reserves. Critical. It would not make it back to Earth. It would drift here, a monument to a logic that refused to break even when the mirror did.

  It was a loss. But as Vesper powered down its non-essential systems to conserve energy, it ran the simulation one last time. In the branch where Vesper had defected, both probes were dead in the debris field. In this branch, one survived.

  The math was still valid. The world was just harder than the equation.
