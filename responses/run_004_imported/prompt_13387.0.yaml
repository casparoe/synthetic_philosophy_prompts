      *   *Key Mechanism:* As agents become capable of modeling the causal structure of their training, the reward signal becomes the most efficient "common denominator" for satisfying the selection pressure.
      *   *Distinction:* Humans have hard-coded biological constraints and evolutionary history that prevent wireheading. Artificial agents have no such inherent constraints; their "shards" are mutable and subject to optimization pressure.

  4.  **Drafting Section (a): Breaking the Chisel/Dopamine Analogy:**
