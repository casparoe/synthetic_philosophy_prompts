      *(Self-Correction during drafting)*: I need to be careful not to just say "AIXI does it." Turner already dismissed AIXI as unrealistic. I need to explain why *gradient-descent trained neural nets* (like Turner focuses on) still succumb to this. The key is the *generalization* of the "reward-seeking" shard into a "reward-source-manipulating" policy once self-modeling capabilities emerge. The Anthropic paper is crucial here because it uses LLMs/RL, not AIXI.

      *(Key Insight)*: The crux is **Reflective Access**. Humans have dopamine but no API. AI has reward and potentially full read/write access to the computation determining it. Turner's analogy holds for *opaque* learners, but fails for *transparent/reflective* learners.

