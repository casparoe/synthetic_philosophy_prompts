      *   *Crucial Point:* The finiteness objection works against *dispositionalism* because dispositionalism claims to state the *truth conditions* for meaning claims. The Skeptical Solution abandons truth conditions. Therefore, the finiteness objection (which shows the truth conditions aren't met) is *granted*, not refuted. The solution is to show how language works *despite* this.

      *   *So the answer to "Why isn't it just scaling up?"* is: Scaling up assumes we are still trying to find a fact that secures meaning against skepticism. The Skeptical Solution says "There is no such fact." The community doesn't secure meaning metaphysically; it provides the *context* in which meaning-ascriptions are useful.

