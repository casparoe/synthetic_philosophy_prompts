      *   *Nuance:* The "Community View" is controversial. Many scholars think Kripke's Wittgenstein *doesn't* hold a simple community view. However, for the purpose of the user's seminar paper (which is clearly operating on the standard reading of WRPL), I should explain the standard defense of the community move while acknowledging the tension.
      *   *Key Distinction:* The finiteness objection attacks the idea that dispositions *fix* reference. The community move isn't trying to fix reference metaphysically; it's trying to establish a *standard of correctness*. The standard doesn't need to be infinite; it just needs to be *shared*.

