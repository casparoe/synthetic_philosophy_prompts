answer: |-
  **The Weight of Resemblance**

  The interface hummed, a low-frequency vibration that Elias felt in his teeth rather than his ears. He sat in the isolation chair, the neural shunts cold against his temples. Across the glass partition, the Technician didn't look up from her console.

  "Status?" Elias asked. His voice sounded thin in the dampened room.

  "Signal acquired," the Technician said. "World 89-Delta. Divergence point: approximately six years ago. The subject is present."

  "Put him through."

  "We can't put *him* through, Mr. Vance. We can open a channel. We can overlay data. But strict transworld identity is a violation of the Conservation of Mass-Energy and the Isolation Axiom. You know the protocol."

  Elias gripped the armrests. "I know the theory. I also know I have a encryption key in my head that got scrambled in the crash. The backup isn't on a server. It's in *my* memory. And in Delta, I didn't crash."

  "In Delta, a *counterpart* of you didn't crash," the Technician corrected. She finally looked up. Her eyes were tired. "David Vance-89 is numerically distinct from David Vance-Prime. He is made of different atoms. He occupies a different spatiotemporal location. He is not you."

  "He has my memories. He has my face. He has my wife."

  "He has a woman who resembles your wife, and memories that resemble yours. Similarity is not identity." She tapped the glass. "Lewis was clear. Nothing is ever in two worlds at once. If you try to force an identity claim where there is only a counterpart relation, the bridge collapses. Do you want the data or do you want a metaphysical stroke?"

  Elias closed his eyes. The headache was returning, a jagged spike behind his left eye. The crash had taken the last six months of his life, including the cryptographic sequence needed to unlock his estate's assets. Without it, his family would be destitute. With it, they were secure.

  "Show me him," Elias said.

  The screen flickered. A man appeared. He was sitting in a café, sunlight hitting the left side of his face. He was stirring coffee. He looked exactly like Elias, minus the scar tissue on the chin. He looked healthy. He looked whole.

  "Hello?" Elias said into the mic.

  On the screen, the man looked up. He didn't look surprised. He looked at the camera, then seemingly through it. "Hello," the man said. His voice was Elias's voice, but pitched slightly lower, lacking the strain of pain.

  "You know where I am?" Elias asked.

  "I know I'm looking at a mirror that doesn't reflect," the counterpart said. "The Technician briefed me. You need the sequence."

  "Yes."

  "I can give it to you."

  "Wait," the Technician interjected. "Mr. Vance-Prime, before you accept transmission, we have to establish the Similarity Weighting. The system is flagging a conflict."

  Elias frowned. "What conflict?"

  "World 89-Delta isn't a clean match," the Technician said, typing rapidly. "We have two active candidates in the modal vicinity. Candidate A is the man on the screen. Biological match: 99.9%. Psychological continuity: High, but divergent on the event horizon of the accident. Candidate B is in World 89-Gamma."

  "Gamma?" Elias looked at the screen. "I thought we were locked on Delta."

  "We were. But when we scanned for 'Elias Vance with intact memory,' the modal gravity pulled a second signature. In Gamma, you uploaded your consciousness into a synthetic substrate three years ago. No biological body. But the memory chain is unbroken. Perfect psychological continuity."

  Elias stared at the man in the café. "So he's... flesh. The other one is code?"

  "Substrate A vs. Substrate B," the Technician said. "Here is the problem. To transfer the data, you must authorize the source as 'Self.' The system requires a truth value for the proposition: *This entity is me.*"

  "Okay," Elias said. "The guy in the café is flesh and blood. He's closer to what I am."

  "Physically, yes," the Technician said. "But Lewisian counterpart theory is context-dependent. In a context of *biological inheritance*, the man in Delta is your counterpart. In a context of *memory and responsibility*, the upload in Gamma might be the stronger counterpart. The system cannot process both. If you authorize Delta, you are asserting that biology weights heavier than psychology. If you authorize Gamma, you assert the reverse."

  "And if I choose wrong?"

  "Then the data transfer registers as foreign code. It triggers the immune response. It fries your neural cortex."

  Elias looked at the man in the café. The man was watching him, waiting. "Are you willing to be me?" Elias asked.

  The counterpart smiled, a sad, tight expression. "I'm willing to help. But am I you? If I give you this key, and you unlock the accounts... did *I* unlock them? Or did you?"

  "I don't care about the semantics," Elias snapped. "I care about the result."

  "That's the Kripkean objection," the Technician said softly. "You care about *your* possibilities. You say, 'I could have remembered the key.' But if the thing remembering the key is a different man in a different world, then *you* didn't remember it. You just received a gift from a stranger who looks like you."

  "He's not a stranger!"

  "Prove it," the Technician said. "Define the essential properties of Elias Vance. Is it the carbon? Is it the pattern?"

  "It's the continuity!" Elias shouted. The headache spiked. "It's the fact that I wake up and it's still me."

  "Continuity is broken by world boundaries," the Technician said. "There is no causal link between you and him. You are isolated. He is a distinct concrete particular. The only thing binding you is resemblance. And resemblance is vague."

  She turned the screen. A second feed appeared. World 89-Gamma. A interface console, glowing blue. No face. Just a cursor blinking. "I am here," a text-to-speech voice said. "I have the key. I am the continuous psychological stream of Elias Vance."

  Elias looked between the two screens. The flesh man in the sunlit café. The ghost in the machine.

  "If I take it from him," Elias pointed to the café, "I am saying my body is what matters. If I take it from *that*," he pointed to the cursor, "I am saying my mind is what matters."

  "And if you are wrong?" the Technician asked. "If the 'true' counterpart is the one you didn't pick, then the one you did pick is merely a doppelgänger. You are letting a doppelgänger rewrite your brain."

  Elias sweat. The room felt too small. "This is absurd. I am sitting here. I am the locus of evaluation. I decide who I am."

  "No," the Technician said. "You decide which similarity relation you value more. But that doesn't make it metaphysically true. It just makes it pragmatically useful. Lewis would tell you: stop looking for transworld identity. It doesn't exist. There is only you, and there is him, and there is a relation of similarity between you."

  "But I feel him," Elias said, pointing to the café. "I feel his hand on the cup. I feel the warmth of the sun."

  "Empathy," the Technician said. "Not identity."

  "I don't care about *him*," Elias said, his voice dropping. "I don't care about some guy in another universe who happens to look like me. I care about *me*. I care about whether *I* could have survived. If he survives, but I don't... what good is that?"

  "That is exactly the point," the Technician said. "If Counterpart Theory is true, then 'You could have survived' is made true by *him* surviving. There is no other way for it to be true. You are world-bound. Your possibilities are not yours. They belong to your counterparts."

  "Then the theory is wrong," Elias said.

  "Then the transfer is impossible," the Technician countered. "Because the machine runs on the theory. You cannot have the technology without the ontology."

  The man in the café spoke again. "Elias. Please. Choose. My head hurts too. Every second we stay open, the bleed increases."

  "The bleed?" Elias asked.

  "Modal friction," the Technician said. "The worlds repel each other. The more you insist on identity, the harder they push back."

  Elias looked at his hands. They were trembling. He looked at the cursor on the Gamma feed. "If I choose the upload... am I admitting I'm just software?"

  "If you choose the biological... are you admitting you're just meat?"

  "I'm admitting I'm *me*," Elias said.

  "Which one?"

  Elias stood up. The shunts pulled at his skin. "Open a direct line. Both of them."

  "Mr. Vance, that will—"

  "Open it!"

  The Technician hesitated, then flipped the switches.

  The sound in the room changed. A chorus of voices. The café man. The upload. And Elias.

  "I have the key," the café man said.
  "I have the key," the upload said.
  "I need the key," Elias said.

  "Who are you?" Elias asked them both.

  "I am you," the café man said.
  "I am you," the upload said.

  "Liar," Elias said. "You're both copies."

  "We are counterparts," the upload corrected. "We are the truth-makers for your counterfactuals."

  "I don't want a truth-maker," Elias said. "I want to be the one who didn't crash."

  "You can't," the café man said. "That world is closed to you. You can only take the data."

  "If I take the data, does it become my memory?"

  "It will function as one," the Technician said. "But function is not ontology."

  Elias closed his eyes. He tried to remember his daughter's face. He could do it, but the edges were blurry. The man in the café remembered her clearly. The upload remembered her perfectly, in high definition.

  "If I take it from him," Elias said, pointing to the café, "and I wake up... and I remember the sun on my face... will it be a real memory?"

  "It will be a memory of a counterpart's experience," the Technician said. "It will be qualitatively identical. Numerically distinct."

  "So I'll remember something that didn't happen to me."

  "You'll remember something that happened to a man who resembles you."

  Elias laughed. It was a dry, broken sound. "So I save my family. I give them the key. They think I'm the genius who remembered it. But I'm just a guy who stole a memory from a twin I never met."

  "Does it matter?" the café man asked. "They get the money. You live."

  "It matters to *me*," Elias said. "Because if I'm not the one who remembered it, then I'm still the guy who crashed. I'm still the failure. I'm just wearing a success story like a coat."

  "Then don't transfer," the upload said. "Stay pure. Stay the failure."

  Elias looked at the Technician. "If I abort... what happens to them?"

  "The bridge closes. They continue in their worlds. You continue in yours. Isolated."

  "And if I transfer?"

  "You continue. With new data. And a high probability of neural damage due to ontological dissonance."

  Elias looked at the screen. The man in the café was finishing his coffee. He stood up to leave. He didn't look back. He had a life to live. A life where he didn't crash.

  "I hate you," Elias said to the man.

  "I know," the man said. "I'd hate me too."

  "Why?"

  "Because I'm the proof that you didn't have to fail. I'm the proof that it was possible. And that makes your failure your own."

  The Kripkean sting. *Humphrey doesn't care about his counterpart.* But the counterpart cares about Humphrey. Or maybe he just pities him.

  "Mr. Vance," the Technician said. "Timer is at thirty seconds. I need an authorization code. Source A or Source B? Or Abort."

  Elias looked at his hands again. Flesh. Scarred. Real.

  If he chose the biological man, he affirmed that he was his body. If he chose the upload, he affirmed he was his mind. If he chose neither, he affirmed he was something else entirely—something that couldn't be copied, couldn't be transferred, and couldn't be saved.

  "Mr. Vance?"

  Elias reached for the console. His hand hovered over the keys. He realized that whichever key he pressed, he was defining the nature of his own soul by the mechanism of the machine. The machine demanded a reduction. It demanded he be either pattern or substance.

  But he felt like neither. He felt like the gap between them.

  "Abort," Elias said.

  "Confirm?"

  "Abort," Elias said. "If I can't be the one who remembered it... then I don't want the memory."

  The Technician nodded, once. She flipped the switch.

  The screens went dark. The hum died. The silence rushed back into the room, heavy and absolute.

  Elias sat in the dark. He tried to recall the encryption key. It was gone. He tried to recall the face of the man in the café. It was already fading, like a dream upon waking.

  "Was that the right choice?" the Technician asked. She was packing up her console.

  "I don't know," Elias said. "But at least it's my failure."

  "Or," the Technician said, pausing at the door, "it's just the failure of a man in this world, while somewhere else, a man just walked out of a café and paid for his coffee, and never knew you existed."

  She left the room.

  Elias sat alone. He wasn't sure if he was relieved, or if he was just the only one left to feel the weight. He closed his eyes, and for a second, he couldn't tell if the darkness behind his lids was his own, or if it belonged to someone else looking back at him.
