  *Revised Plot:* Elias is in a room. A door opens. Someone walks in. Is it him? The system says "Counterpart Detected." Elias says "Is it me?" System: "Define 'you'."

  Okay, let's go with the "Retrieval" scenario. It allows for the internal conflict to be about memory and body.

