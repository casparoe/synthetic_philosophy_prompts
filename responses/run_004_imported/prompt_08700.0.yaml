      *   *Refinement:* He watches a construction site. A hammer hits a nail. The nail doesn't go in. The hammer bounces off like the wood is rubber. Then the next hit drives it all the way through instantly. The disconnection between effort and result.

      *   **Scene 3: The Realization.** Back home. Paranoia. He tests things. Pushing a wall. Does it push back? Newton's third law. He pushes, and for a second, there is no resistance, then he falls through? No, keep it subtle. He pours water. The water flows up for a split second.
      *   *Focus:* The feeling that things are just "happening" next to each other, not *to* each other.

      *   **Scene 4: The Climax.** A moment of danger. A fire? Or just a moment of stillness. Let's use the fire motif from Ghazali. A candle. He stares at it. He wills it not to burn. Or he puts his hand near it.
