answer: |-
  The key turned in the lock, but the tumbler didn't click. Arthur felt the metal rotate in his hand, the familiar resistance of the spring giving way, yet the door remained sealed. He jiggled the handle. Nothing. He leaned his forehead against the wood, exhaling a frustrated cloud of steam into the hallway chill, and tried again.

  This time, the door swung open before his key even touched the cylinder.

  He stood there for a long moment, the key hovering in the air, his hand still shaped around the grip. He looked at the lock, then at the open door. A draft whispered from inside his apartment, smelling of dust and old coffee. He stepped in, closing the door behind him. It latched with a sound like a gunshot, though he hadn't pushed it hard.

  Arthur was an actuary. He spent his life calculating risk, mapping the probability of car accidents, heart attacks, and floods. He believed in the chain of things. If A happened, B followed. If you paid the premium, the coverage held. If you turned the key, the lock opened.

  He went to the kitchen to make tea. He filled the kettle and set it on the electric burner. He pressed the switch. The red light glowed. He waited.

  Three minutes passed. The water remained still, cold to the touch.

  Arthur tapped the side of the kettle. He checked the outlet. He pressed the switch again, harder. The red light was bright, pulsing slightly, but the heating element remained inert. He reached out and touched the metal coil. It was room temperature.

  "Defective," he muttered.

  He turned to the cupboard to get a mug. As his fingers brushed the ceramic, the mug shattered. It didn't fall; it simply exploded into dust and shards while still resting on the shelf. There was no sound of impact, only a dry *crump*, like a book closing.

  Arthur froze. He looked at his hand. He hadn't squeezed. He hadn't knocked it. The cause was missing. The effect remained.

  He swept the debris into the trash with a trembling dustpan. When he struck the match to light the gas stove—needing to boil the water somehow—the friction sparked, the sulfur scent hit his nose, but the flame did not appear. He struck it again. Nothing. On the third try, the wood stick ignited instantly, the flame blooming a full inch before the strike was even complete. It burned his thumb.

  He yelped and dropped it. The match hit the linoleum and kept burning, the wood turning to black charcoal, but the flame didn't spread to the floor. It hovered there, a small, isolated sun, consuming only the matchstick and nothing else.

  Arthur backed away until his spine hit the refrigerator. He watched the match burn down to his fingernail's length before winking out, leaving no scorch mark on the floor.

  That night, he sat on his sofa and watched the television. He didn't turn it on. He just stared at the black screen. He was waiting for the world to make sense again. He needed to verify the contract of reality.

  He picked up a glass of water. He intended to drink. He lifted the glass. As it reached his lips, the water poured out, not because he tipped it, but because the liquid decided to leave the container. It cascaded over his chin and shirt while the glass remained upright.

  Arthur dropped the glass. It hit the carpet and didn't break. It bounced, once, twice, rolling under the table with a hollow thud that sounded like it came from a different room.

  He began to walk. He needed to be outside. He needed to see traffic, people, the great grinding machine of the city that relied on momentum and friction.

  The street was busy. A taxi sped toward the intersection. The light was red. The driver slammed on the brakes. Arthur saw the tires lock, the rubber smoking against the asphalt. The car did not slow. It glided through the intersection like a puck on ice, passing through the cross-traffic.

  There was no collision. The other cars didn't hit the taxi. They simply ceased to occupy the space where the taxi was. For a fraction of a second, two objects occupied the same coordinates, and then the taxi emerged on the other side, intact. The other drivers didn't react. They didn't honk. They didn't swerve. They continued as if the physics of the moment had been edited out of their perception.

  Arthur stood on the corner, his breath coming in short gasps. He reached out to touch a brick wall to ground himself. He pressed his palm against the rough surface. He pushed.

  There was no resistance.

  His hand sank into the brick as if it were wet clay. He stumbled forward, his arm embedded up to the elbow in the masonry. He screamed and yanked it back. His arm came free with a wet tearing sound, but the brick wall was solid again. His sleeve was dry. There was no dust on his skin. The brick had not been displaced. It had simply allowed him to pass, then remembered it was solid.

  He ran. He didn't know where he was going, only that he needed to find a place where the rules held. A church? A laboratory? A bank?

  He ended up in a park. It was late autumn. Leaves covered the ground. He walked onto the grass. His feet made no indentations. He was walking on top of the world, not upon it.

  He saw a man sitting on a bench feeding pigeons. The man threw a handful of seed. The seeds hung in the air, suspended in a glittering cloud. The pigeons flew up to them, but their beaks passed through the seeds without touching them. The birds pecked at the empty air where the seeds had been a moment before, swallowing nothing, yet their crops bulged.

  Arthur approached the bench. "Did you see that?"

  The man looked up. His eyes were flat, devoid of curiosity. "See what?"

  "The seeds. They... they didn't fall."

  "Gravity is a habit," the man said. His voice sounded like it was coming from a radio tuned slightly off-station. "It is not a law. It is just what usually happens."

  "Who usually happens?" Arthur demanded.

  The man shrugged and threw another handful of seed. This time, the seeds turned into moths mid-air and fluttered away. The pigeons chased the moths.

  Arthur backed away. He felt a rising nausea, not from his stomach, but from his mind. The connection between *now* and *next* was severed. He realized he had no guarantee that the air in his lungs would exchange oxygen for carbon dioxide in the next second. He was breathing because he was allowed to, not because his diaphragm demanded it.

  He returned to his apartment. He locked the door. He checked the lock; it clicked. He checked the stove; it was cold. He sat in the center of his living room floor.

  He needed to test the fire. It was the oldest test. The one the ancients feared.

  He took a candle from the drawer. He placed it on the coffee table. He struck a match. It flared immediately, the flame large and aggressive. He brought it to the wick.

  The wick caught. The flame settled into a teardrop shape.

  Arthur stared at it. He knew what he was looking at. He wasn't looking at heat transferring from the match to the wick. He was looking at two events that happened to occur together. The match touched the wick. The wick burned. But the touch did not *make* the burn.

  He reached out his finger. He hovered it over the flame. He felt no heat. He lowered his finger into the blue base of the fire.

  It was cold.

  It looked like fire. It flickered like fire. It consumed the wax. But it possessed no power to burn. The heat was not in the flame. The heat was a separate creation, usually delivered alongside the visual of the fire, but currently withheld.

  Arthur pushed his finger deeper. He touched the wick. He pinched the flame.

  "It's just a picture," he whispered.

  He realized then that he had never touched anything in his life. He had never felt heat, or cold, or pain. He had only experienced the simultaneous creation of sensation alongside the event. God, or the Universe, or the Great Will, painted the feeling on his nerves at the exact moment the object touched his skin.

  But the painter was getting tired. The brushstrokes were missing.

  He looked at the candle. He wanted to see the custom break completely. He wanted to see the moment the habit was dropped.

  He took a piece of cotton from a lint trap in the dryer. He held it over the flame.

  "Burn," he commanded.

  The cotton touched the fire. It did not ignite. He held it there for ten seconds. Twenty. The cotton remained white, soft, untouched.

  Then, without warning, the cotton turned to ash. It didn't char. It didn't smoke. It simply ceased to be cotton and became ash in an instant, crumbling through his fingers. The fire hadn't done it. The fire was just a prop on the stage.

  Arthur dropped the ash. He looked at his hands. They looked real. But were they? If he cut them, would they bleed? Or would the blood appear because it was time for blood to appear?

  He stood up and walked to the window. The city lights flickered below. He saw a building across the street. A window was open. A curtain blew outward.

  He watched the curtain. It blew out, then snapped in. Then it blew out again, but the wind wasn't moving the trees below. The trees were still.

  The wind was not moving the curtain. The curtain was moving, and the wind was being created to explain it.

  Arthur felt a profound loneliness wash over him. It was the loneliness of a character in a book realizing the author has put down the pen. The ink is dry on the page. The next word is not guaranteed.

  He went to the kitchen and opened the drawer where he kept the knives. He took one out. It was heavy, steel, sharp. He pressed the blade against his thumb.

  He pressed harder. The skin indented. He waited for the pain. He waited for the cut.

  He pressed until the bone ached.

  Nothing. No blood. No pain. The knife was just metal. The thumb was just flesh. The cutting was a story they told together, and the story had paused.

  Arthur dropped the knife. It hit the floor and stuck there, standing upright on its tip, defying balance.

  He walked back to the living room and sat on the sofa. He turned on the television. Static filled the screen. He watched the white noise dance.

  He understood now why miracles didn't feel like miracles to the people who saw them. If a prophet walked into a fire and didn't burn, it wasn't because the fire changed. It was because the habit was suspended. The audience saw the fire, and they saw the man, and they expected the burn. When the burn didn't arrive, they called it magic.

  But it was just the truth revealed. The fire never burned. Nothing ever burned. Nothing ever moved anything else.

  Arthur closed his eyes. He listened to the hum of the refrigerator. It stopped. The silence was absolute. He waited for it to start again.

  It didn't.

  He waited for his heart to beat. He felt the thump in his chest.

  *Thump.*

  He waited for the next one.

  *...*

  He sat in the silence, suspended in the gap between the beat and the next beat. He was not afraid anymore. Fear required a future. Fear required the certainty that pain would follow the knife.

  Here, in the gap, there was only the present. The custom was fraying. The veil was thin.

  Arthur opened his eyes. The static on the television had cleared. A face was on the screen. It was his face, looking back at him from the studio of a news broadcast that hadn't happened yet.

  The Arthur on the screen opened his mouth.

  Arthur in the room opened his mouth.

  No sound came out. The sound was being saved for later.

  He smiled. He realized he was not the one burning the cotton. He was the cotton. And the fire was everywhere.

  He waited for the next moment to be created. He sat very still, trying not to disturb the hand that was holding the pen.
