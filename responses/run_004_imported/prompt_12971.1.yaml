prompt: |-
  One of my oldest friends, whose dissertation used the evolutionary game theory associated with Brian Skyrms to extend David Lewis's account of convention -- explaining how social norms, not just simple coordination conventions like which side of the road to drive on, become entrenched -- is getting married in three weeks and has asked me, the only member of the wedding party without a philosophy PhD, to give the toast. Half the reception will be people from her graduate program, and I have spent the past week reading enough Lewis to know they will notice if I get the framework wrong or use it lazily. Write me a five-minute toast that opens by describing the couple the way Lewis would: a coordination equilibrium, arbitrary in that other arrangements would have solved things just as well, held together by common knowledge -- then turns on the standard objection to Lewis, that mere self-interested coordination cannot explain why breaking a convention feels like wronging someone rather than merely making a mistake, so that it ends up saying something true about what they actually owe each other instead of just showing off the framework.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding reception toast.
      *   **Audience:** Half philosophers (specifically familiar with David Lewis's *Convention* and Brian Skyrms's evolutionary game theory), half non-philosophers.
      *   **Speaker:** The only member of the wedding party *without* a Philosophy PhD.
      *   **Subject:** The bride (an old friend) and her partner.
      *   **Key Content Requirements:**
          *   Open with a Lewisian description of the couple (coordination equilibrium, arbitrary, common knowledge).
          *   Address the standard objection to Lewis (norms vs. mere coordination, the feeling of "wronging" vs. "mistake").
          *   Pivot to something true about what they owe each other (commitment, care, beyond game theory).
          *   Tone: Intellectual but accessible, warm, not showing off *too* much, respectful of the bride's work.
          *   Length: Approximately 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy:**
      *   **David Lewis (*Convention*):** Conventions are solutions to coordination problems. They are *arbitrary* (we could drive on the left or right, as long as we agree). They rely on *common knowledge* (I know you know I know...). They are self-enforcing equilibria (no one has an incentive to deviate unilaterally).
      *   **The Bride's Work (Skyrms/Lewis Extension):** She worked on how *social norms* (moral/ethical weight) evolve from simple coordination using evolutionary game theory. It's not just "what works," it's "what we expect and feel obligated to follow."
      *   **The Objection:** Lewis's account is often criticized for being too thin. If I drive on the wrong side, I'm dangerous, but am I *immoral*? In marriage, breaking a promise isn't just a coordination failure; it's a betrayal. It involves normative force, not just equilibrium stability.
      *   **The Pivot:** Marriage isn't just a stable equilibrium; it's a commitment that creates *new* reasons for action. It moves from "I do this because you do" to "I do this because I promised and I care."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the room (the philosophers). Acknowledge my status (the non-PhD). Set the Lewisian stage.
      *   **The Lewisian Frame:** Describe the relationship as a coordination equilibrium. Use the driving example (classic Lewis). Mention "arbitrariness" and "common knowledge."
      *   **The Turn (The Objection):** Introduce the limitation. Lewis explains traffic, not love. The feeling of betrayal vs. inconvenience. Mention the bride's specific contribution (Skyrms/evolutionary norms).
      *   **The Resolution (The Truth):** What is marriage then? It's not just equilibrium; it's binding. It's creating a "we." It's moving beyond self-interest.
      *   **Conclusion:** Raise a glass. Wish them well.

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm lecturing. It needs to be a toast, not a seminar. The philosophy should serve the emotion, not the other way around. I need to make sure the bride's specific contribution (Skyrms/norms) is acknowledged respectfully, as she asked me to do this *because* I'm the outsider, but I need to show I did the homework.

  4.  **Drafting - Specific Phrasing & Tone:**
      *   *Opening:* "For those who don't know me..." "For those who do know my CV..."
      *   *Lewis:* "Coordination equilibrium." "Arbitrary regularity." "Common knowledge."
      *   *The Critique:* "Normative force." "Wronging vs. Mistake."
      *   *The Heart:* "Vows." "Commitment." "Love."
      *   *Timing:* Read aloud to check pace. A 5-minute toast is roughly 750 words.

  5.  **Refining the Philosophy (Crucial Step):**
      *   Make sure I don't misrepresent Lewis. Lewis *does* talk about norms, but the critique is that his foundation is purely instrumental rationality. The bride's work bridges this with evolution. I need to acknowledge that she *solved* (or worked on) the problem I'm raising, but that marriage goes even further.
      *   *Correction:* Actually, the prompt says she used Skyrms to extend Lewis to explain how norms become entrenched. So I should acknowledge that she knows the gap between coordination and obligation better than anyone. The toast should say: "You know the theory better than anyone, but here is what the theory can't capture."

  6.  **Final Polish:**
      *   Check the transition from cold theory to warm emotion.
      *   Ensure the "arbitrary" comment doesn't sound like "your love is random." Clarify that the *specifics* might be arbitrary, but the *commitment* isn't.
      *   Make sure the ending lands emotionally.

  7.  **Word Count Check:**
      *   Aiming for ~750 words.
      *   Speaking rate: ~150 words/minute.
      *   5 minutes = 750 words.

      *(Self-Correction during final review)*: Wait, if I say the relationship is arbitrary, that might sound insulting. I need to clarify: "Which specific habits are arbitrary, not the bond itself." Or better: "In Lewis's terms, the *convention* is arbitrary, but the *choice* to commit is not." Let's refine that. Lewis says conventions are arbitrary *in principle* (left or right), but once chosen, they aren't arbitrary to the participants. I will frame it as: "There were many possible lives you could have lived, but you chose this equilibrium."

      *Actually, a better angle:* Lewis says conventions are arbitrary *solutions* to coordination problems. I can say, "You could have met at a different time, in a different place. That path was arbitrary. But the stability you found is not."

      *Wait, the prompt asks me to open by describing the couple the way Lewis would: a coordination equilibrium, arbitrary... held together by common knowledge.* I must follow the prompt. I will frame the "arbitrary" part carefully so it doesn't sound like "your love doesn't matter." I'll focus on the *conventions* of their life together being the arbitrary part, or the specific equilibrium selected from many possibilities.

      *Revised plan for "Arbitrary":* "Lewis would say any stable arrangement where you prefer to be together than apart is an equilibrium. The specific way you organize it is arbitrary. But..."

      *Let's write.*

      *(Drafting mental outline)*
      1. Intro: I'm the non-philosopher. I read the books.
      2. Lewis View: You are a coordination equilibrium. Common knowledge.
      3. The Problem: Lewis explains traffic, not marriage. Breaking a convention is a mistake; breaking a vow is a wrong.
      4. The Bride's Work: You studied how norms evolve. But marriage is faster/deeper than evolution.
      5. The Truth: It's not about equilibrium; it's about obligation and care.
      6. Toast.

      *(Refining the "Arbitrary" bit)*: I need to be careful. If I say "your marriage is arbitrary," people might gasp. I will say: "In the strict Lewisian sense, the specific equilibrium is arbitrary—meaning other lives were possible—but the commitment makes it necessary."

      *Okay, let's go.*

      *(Post-Draft Review)*: Does this meet the "five-minute" constraint? Yes, if spoken slowly and with pauses. Does it hit the philosophical beats? Yes (Lewis, Equilibrium, Common Knowledge, Normative Force, Skyrms implication). Is it warm? Hopefully.

      *One detail from prompt:* "Half the reception will be people from her graduate program." I need to signal to them that I get it, without alienating the others. I'll keep the jargon explained.

      *Final check on the "Skyrms" element:* The prompt mentions she used Skyrms to extend Lewis. I should mention that she knows how norms *evolve*, but marriage is a *declaration*.

      *Okay, ready to write.*
answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I have the distinct honor of being the only member of this wedding party who does not hold a PhD in Philosophy. When [Bride] asked me to give this toast, she knew this. In fact, I think she asked me *because* of this. She wanted someone to look at her marriage through the lens of the real world, rather than the lens of a seminar room.

  However, out of respect for the roughly fifty people in this room who *do* have the PhDs, and out of fear of being fact-checked during the cocktail hour, I spent the last week reading David Lewis's *Convention*. And I have to say, if we look at [Bride] and [Groom] through a Lewisian framework, they are a textbook case.

  Lewis describes a convention as a coordination equilibrium. It's a situation where two parties prefer to coordinate their actions rather than act alone, and they prefer to coordinate on the same solution. Like driving on the right side of the road. It doesn't matter which side we pick, as long as we both pick the same one. Lewis calls this "arbitrary." There are other equilibria that would have worked just fine. But once the equilibrium is selected, it is held together by "common knowledge." I know that you know that I know that we are doing this together.

  Looking at [Bride] and [Groom], you can see that equilibrium. They have coordinated their lives. They know what the other expects. They have built a stable regularity of behavior that allows them to navigate the world without constantly renegotiating the terms of their existence.

  But here is where I have to depart from the text. And I know [Bride] knows this better than anyone, given her work on Skyrms and evolutionary game theory.

  The standard objection to Lewis is that his account is too thin. It explains why we drive on the right, but it doesn't explain why we keep promises. If I drive on the left, I've made a mistake; I've disrupted the coordination. But if [Groom] forgets their anniversary, or if [Bride] breaks a vow, it isn't just a coordination failure. It feels like a *wrong*. It carries a normative force that mere self-interest doesn't capture.

  In a Lewisian convention, I follow the rule because it is in my interest to do so, given that you are following it. If I could get away with breaking it, I might. But marriage is not just about maintaining an equilibrium where deviation is inconvenient. Marriage is about creating obligations where deviation is unthinkable.

  [Bride], your dissertation explored how social norms become entrenched over time through evolutionary pressure. But what you two have built here isn't the result of slow, blind evolution. It is the result of a deliberate, declarative act. You didn't just drift into a stable equilibrium; you stood up and made a promise.

  And that is what the framework misses. Game theory can explain why you *stay* together, but it cannot explain why you *owe* each other. It can explain the stability of the norm, but not the sanctity of the vow.

  What you owe each other is not just the continued cooperation of rational agents maximizing their utility. You owe each other care when it is inconvenient. You owe each other forgiveness when the equilibrium breaks down. You owe each other the commitment that even if a better equilibrium appeared theoretically down the road, you would not take it, because you have bound your interests to one another.

  So, while half of this room might analyze your marriage as a robust, evolutionarily stable strategy, I see it as something that transcends the model. It is not just a solution to a coordination problem. It is a creation of a new "we" that generates its own reasons for action.

  [Bride] and [Groom], may your equilibrium be stable, but may your obligations be deeper than any game theory can model. May you always have common knowledge of your love, and may you never treat your vows as merely arbitrary.

  Please raise your glasses. To [Bride] and [Groom].
