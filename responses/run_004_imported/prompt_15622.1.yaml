answer: |-
  **TO:** Engineering Hiring Working Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Take-Home Assessment Strategy

  ### Purpose
  Ahead of our meeting on Wednesday, I'm circulating this memo to frame the discussion around our take-home coding exercise. Our goal is to finalize a pipeline strategy that balances signal quality, candidate equity, and operational load for Q1 hiring.

  ### Current State
  Candidates currently complete an open-ended, unpaid coding project estimated at 15–20 hours. This stage is a primary gatekeeper for onsite interviews.

  ### Analysis of Competing Arguments
  We have two valid but conflicting concerns. I want to address the theoretical underpinning of the "Keep" argument specifically, as it frames the cost as a feature, not a bug.

  **1. The Signaling Argument (Zahavi/Spence)**
  The argument for keeping the exercise as-is relies on *Handicap Principle* and *Job Market Signaling*. Theoretically, a signal is only "honest" if it is costly. Side B argues that the 20-hour cost filters for commitment and capability, preventing a flood of low-effort applicants.

  *Where it holds:* Cost does filter for interest.
  *Where it fails:* For a signal to correlate with **ability** (which is what we are hiring for), the cost must be *differentially* burdensome based on ability. In Spence's model, getting a degree must be easier for high-ability workers.
  In our current pipeline, the "cost" is time. Time availability correlates strongly with **privilege** (dependents, second jobs, housing stability) and weakly with **engineering ability**. We are currently signaling for "free time," not "skill." This explains our internal data: the exercise predicts who has 20 spare hours, not who performs well after one year.

  **2. The Equity & Empirical Argument**
  Side A notes the exclusionary nature of the ask and the weak correlation with performance. The data supports this. If the signal predicts privilege rather than performance, it is noise. Furthermore, high-friction unpaid work damages our employer brand, potentially deterring high-ability candidates who have options.

  ### Recommendation: Modify and Replace
  We should **cut the current 20-hour unpaid exercise.** It fails the empirical test and misapplies signaling theory. However, we cannot remove all friction, or we risk overwhelming the pipeline with low-intent applicants.

  I propose we replace the current exercise with a **Candidate-Choice Model**:

  1.  **Option A: Paid, Scoped Take-Home.**
      *   **Scope:** Capped at 4 hours. Clear rubric.
      *   **Compensation:** Flat stipend (e.g., $500) upon completion.
      *   **Rationale:** Paying removes the economic exclusion. Capping time tests prioritization and conciseness (senior traits) rather than endurance. The stipend signals *our* commitment, attracting candidates who value professionalism.

  2.  **Option B: Live Collaborative Session.**
      *   **Format:** 90-minute paired programming session with an engineer.
      *   **Rationale:** This mimics actual work. It is high-signal for communication and problem-solving without the "take-home" time burden.

  ### Why This Works
  *   **Signaling:** Both options retain cost (effort/time), preserving the filter against low-intent applicants. However, the cost is now proportional to *skill* (can you solve this quickly/pair effectively?) rather than *circumstance* (do you have 20 free hours?).
  *   **Equity:** The stipend and time cap mitigate exclusionary barriers.
  *   **Data:** Live pairing and scoped tasks generally show higher correlation with day-to-day performance than marathon take-homes.

  ### Next Steps
  At Wednesday's meeting, I'd like to:
  1.  Agree on the stipend amount and budget code for Option A.
  2.  Draft the rubric for the 4-hour scope to ensure it cannot "creep" beyond the limit.
  3.  Train interviewers on the Live Collaborative format (Option B) to ensure consistency.

  Please review this framework before we meet. I believe this allows us to keep a rigorous filter without relying on a mechanism that inadvertently selects for privilege over ability.
