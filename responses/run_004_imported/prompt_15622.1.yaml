prompt: |-
  I'm a senior engineer at a mid-sized startup, and I've been asked to chair a small working group reviewing our engineering hiring pipeline ahead of next quarter's hiring push. The sticking point is our take-home project: candidates who clear the phone screen are given an open-ended coding exercise -- unpaid, roughly 15-20 hours of work, due within a week -- and how well they do on it has historically carried a lot of weight in the final decision. Two people on the committee want to cut it entirely. Their case is partly moral (it's exclusionary toward candidates with kids, a second job, or unstable housing) and partly empirical (our own retrospective data shows only a weak correlation between take-home scores and performance a year in). The other two want to keep it essentially as-is, and their argument isn't really about the exercise's content at all -- it's that voluntarily absorbing a large, unpaid cost is itself the informative part, and that if we swap it for something cheaper (a shorter exercise, more weight on the resume, a live pairing round) we'll just get flooded with applicants who look identical on paper, with no way left to tell them apart.

  A friend of mine who did a PhD in evolutionary biology before moving into industry told me the second argument is basically Zahavi's handicap principle from animal signaling theory -- the logic behind why a peacock's tail or a gazelle's stotting can be trusted as an honest signal -- transplanted into a hiring pipeline, and that economists have their own version of the same idea in job-market signaling models. That reframing has stuck with me, but I don't have the background to tell whether it actually survives contact with our specific situation or is just a plausible-sounding analogy -- for instance, whether the take-home's costs really do fall differently on strong and weak candidates the way the theory needs them to, or whether it's just a uniformly expensive filter that happens to track things like free time rather than engineering ability. Could you draft the short memo I'll circulate to the group before we meet? It should come down on a concrete recommendation -- keep, cut, or modify the take-home project, and if it's cut or modified, what (if anything) should replace it -- and it should take the signaling argument seriously enough to say where it holds up and where it might not, rather than either deferring to the equity argument by default or waving the signaling argument through because it sounds rigorous.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Senior Engineer at a mid-sized startup.
      *   **Task:** Chair a working group reviewing the engineering hiring pipeline.
      *   **Specific Issue:** The unpaid, 15-20 hour take-home coding project.
      *   **The Conflict:**
          *   *Side A (Cut):* Moral argument (exclusionary/biased against those with less free time) + Empirical argument (weak correlation with job performance).
          *   *Side B (Keep):* Signaling argument (Zahavi's Handicap Principle/Job Market Signaling). The cost *is* the signal. Removing it floods the pipeline with indistinguishable applicants.
      *   **User's Insight:** A friend suggested Side B's argument aligns with evolutionary biology/economic signaling theory.
      *   **Goal:** Draft a short memo to the group before the next meeting.
      *   **Requirements:**
          *   Make a concrete recommendation (Keep, Cut, or Modify + Replacement).
          *   Address the signaling argument seriously (where it holds, where it fails).
          *   Address the equity/empirical argument seriously.
          *   Tone: Professional, analytical, decisive but collaborative (since it's a working group).

  2.  **Deconstruct the Signaling Argument (Zahavi/Spence):**
      *   *Theory:* For a signal to be "honest," it must be costly. Crucially, the cost must be *differentially* burdensome. A peacock's tail is heavy; a weak peacock dies if it grows one, a strong one survives. In hiring (Spence Model), education is costly; low-ability workers find it harder to get degrees than high-ability workers.
      *   *Application to Take-Home:* Side B argues the 20-hour cost signals commitment/ability.
      *   *Critique:* Does the cost correlate with *ability* or *privilege*?
          *   If a strong engineer has kids/second job, the cost is high.
          *   If a weak engineer has unlimited free time (e.g., unemployed, no dependents), the cost is low.
          *   *Conclusion:* The current take-home likely signals "free time" + "conscientiousness" more than "engineering ability." This violates the condition for an *honest signal of ability*. It becomes a signal of *circumstance*.

  3.  **Deconstruct the Equity/Empirical Argument:**
      *   *Equity:* 15-20 hours is a massive barrier. Excludes caregivers, those working other jobs, etc. This reduces diversity.
      *   *Empirical:* Internal data shows weak correlation with performance. This is the killer. If the signal doesn't predict the trait we care about (job performance), it's useless noise, regardless of signaling theory.

  4.  **Formulate a Recommendation:**
      *   *Keep As-Is:* No. Data says it doesn't predict performance. Equity risk is high.
      *   *Cut Entirely:* Risk of flooding the pipeline (Side B's concern). Need *some* filter.
      *   *Modify:* Yes. Reduce the cost to make it less exclusionary while retaining enough friction to signal interest/competence. Or change the *type* of signal.
      *   *Replacement:* Live pairing (too stressful/time-heavy?), Code review (good middle ground?), Paid project (best for equity, but budget?), Shorter take-home (4 hours max).
      *   *Decision:* Modify to a **Paid, Shorter Take-Home** OR a **Structured Live Pairing Session**.
      *   *Refinement:* Given the startup context (budget/speed), a *Paid* take-home might be hard to administer logistically for all candidates. A *Shorter, Scoped* take-home (4 hours) is more feasible. However, the strongest counter to the signaling argument is making the cost proportional to ability, not free time.
      *   *Best Path:* **Modify.** Drastically reduce scope (max 4 hours) AND pay for it (or offer a stipend). If paying isn't possible, switch to a **Live Pairing/Technical Discussion** (1 hour).
      *   *Wait, let's look at the Signaling Theory again:* If we make it paid, we remove the "cost" to the candidate. Does that ruin the signal? No, because the *effort* is still the signal, but we remove the *economic exclusion*. Actually, the best signal of ability is work done under observation or constrained time.
      *   *Recommendation:* **Modify.** Replace the 20-hour unpaid take-home with a **4-hour capped take-home (paid)** OR a **90-minute live collaborative coding session**.
      *   *Why?* The 20-hour cost signals "privilege," not "skill." A 4-hour cost signals "basic competence + interest" without the exclusionary barrier. Paying validates the candidate's time (equity) and attracts serious candidates (signaling from *company*).

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Purpose:** State the goal (decide on take-home policy).
      *   **Current State:** Briefly describe the 15-20hr unpaid exercise.
      *   **Analysis of Arguments:**
          *   *Signaling (Side B):* Acknowledge Zahavi/Spence. Explain *why* it fails here (Cost isn't correlated with ability, it's correlated with privilege). This is the crucial intellectual pivot.
          *   *Equity/Data (Side A):* Validate the internal data (weak correlation) and the moral risk.
      *   **Recommendation:** Modify.
      *   **Proposal:** 1. Cap time (4 hrs). 2. Pay candidates (stipend). 3. Alternative path (Live pairing).
      *   **Next Steps:** Agenda for the meeting.

  6.  **Refining the Tone:**
      *   Needs to be respectful to both sides.
      *   Needs to show I understood the "Handicap Principle" analogy but applied critical thinking to it.
      *   Needs to be actionable.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "flooded pipeline" fear?
      *   *Fix:* Yes, by keeping *some* friction (the 4-hour cap or live session) and emphasizing that paying actually signals *our* quality to candidates (reverse signaling).
      *   *Check:* Is the signaling critique accurate?
      *   *Fix:* Ensure I distinguish between "costly to everyone" vs "costly to low-types." In Spence's model, education must be *less* costly for high-ability. In our take-home, it's *more* costly for those with less time (unrelated to ability). This is the key flaw in Side B's argument.
      *   *Check:* Is the recommendation realistic for a startup?
      *   *Fix:* Paying candidates can be admin-heavy. I should offer the "Live Pairing" as a strong alternative if budget is tight. I will recommend a hybrid: Offer a choice.

  8.  **Final Polish:** Check length (should be short/memo style). Ensure clear headings.

  **(Self-Correction Note):** I need to be careful not to sound like I'm lecturing them on biology/economics, but rather using their framework to show why their conclusion might be wrong. The memo should sound like it comes from a Senior Engineer, not a Professor.

  9.  **Finalizing the Recommendation:** I will recommend **replacing** the current take-home with a **choice**: either a paid, 4-hour take-home OR a 90-minute live collaborative session. This addresses the signaling (both require effort/skill), the equity (paid or time-boxed), and the data (live collaboration correlates better with day-to-day work).

