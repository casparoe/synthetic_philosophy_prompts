      *   *Point 2: The Purpose of Correction.* If the goal is to stop Sam from talking back, this failed. It taught him he can outsource consequences.
      *   *Point 3: The Corruption of the System.* The teacher accepted a lie. The record is falsified. Authority is weakened.
      *   *Point 4: The Harm to the "Savior".* Theo isn't being noble; he's enabling. It's codependency, not virtue.

  5.  **Drafting the Response (Iterative Process):**

