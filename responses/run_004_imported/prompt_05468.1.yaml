  # Seminar Handout: The Diaconescu–Goodman–Myhill Theorem
  **Course:** Philosophy of Mathematics (Graduate Seminar)  
  **Topic:** Constructivism, Choice, and the Law of Excluded Middle  
  **Date:** [Insert Date]

  ---

  ## 1. Introduction
  It is a common initial impression among students of constructive mathematics that the **Axiom of Choice (AC)** is compatible with intuitionistic logic. After all, AC asserts that if we have a family of non-empty sets, we can *choose* an element from each. This sounds like the very essence of the constructive demand to "produce the object."

  However, in the context of **Intuitionistic Zermelo–Fraenkel set theory (IZF)**, this impression is false. A celebrated result due independently to Radu Diaconescu (1975) and to Goodman and Myhill (1978) demonstrates that in IZF, the full Axiom of Choice entails the **Law of Excluded Middle (LEM)**.

  $$ \text{IZF} + \text{AC} \vdash P \lor \neg P $$

  This handout provides a fully explicit derivation of this result and subsequently addresses the diagnostic question: *Is Choice itself the source of non-constructivity, or is it the interaction with other set-theoretic principles?*

  ---

  ## 2. The Proof: Deriving LEM from AC in IZF

  We work within IZF. Let $P$ be an arbitrary proposition (which may be undecidable). We will construct a scenario where a choice function forces us to decide $P$.

  ### Step 1: Constructing the Sets
  Let $2 = \{0, 1\}$ be the standard two-element set. In constructive arithmetic, equality on $2$ is decidable; that is, for any $x, y \in 2$, we can prove $x = y \lor x \neq y$.

  Using the **Axiom of Separation** (which is unrestricted in IZF), we define two subsets of $2$ dependent on $P$:
  $$ A = \{ x \in 2 \mid P \lor x = 0 \} $$
  $$ B = \{ x \in 2 \mid P \lor x = 1 \} $$

  ### Step 2: Verifying Inhabitation
  We must show that $A$ and $B$ are non-empty to invoke the Axiom of Choice.
  *   **For $A$:** Consider the element $0$. Since $0=0$ is true, the disjunction $P \lor 0=0$ is true. Thus, $0 \in A$.
  *   **For $B$:** Consider the element $1$. Since $1=1$ is true, the disjunction $P \lor 1=1$ is true. Thus, $1 \in B$.

  Since both sets are inhabited, the family $\mathcal{F} = \{A, B\}$ is a family of non-empty sets.

  ### Step 3: Invoking the Axiom of Choice
  The Axiom of Choice states that for any family of non-empty sets, there exists a choice function. Applied to $\mathcal{F}$, AC asserts the existence of a function $f: \mathcal{F} \to \bigcup \mathcal{F}$ such that for every $X \in \mathcal{F}$, $f(X) \in X$.

  Let us define the specific values chosen by this function:
  $$ a = f(A) \quad \text{and} \quad b = f(B) $$
  By the definition of the choice function, we know:
  1.  $a \in A$
  2.  $b \in B$
  3.  $a, b \in \{0, 1\}$ (since $A, B \subseteq 2$)

  ### Step 4: The Case Analysis
  Since $a$ and $b$ are elements of $\{0, 1\}$, and equality on natural numbers is decidable, we have:
  $$ a = b \lor a \neq b $$
  We analyze these two cases to show that each implies a side of $P \lor \neg P$.

  #### Case 1: $a = b$
  We know $a \in A$ and $b \in B$. Since $a=b$, let $k$ be this common value ($k \in \{0, 1\}$).
  *   If $k = 0$: Then $b = 0$. Since $b \in B$, by the definition of $B$, we have $P \lor 0 = 1$. Since $0 \neq 1$, we must conclude **$P$**.
  *   If $k = 1$: Then $a = 1$. Since $a \in A$, by the definition of $A$, we have $P \lor 1 = 0$. Since $1 \neq 0$, we must conclude **$P$**.

  In either sub-case, $a = b \implies P$.

  #### Case 2: $a \neq b$
  To see what this implies, consider the relationship between $P$ and the identity of the sets $A$ and $B$.
  *   **Assume $P$ holds.**
      *   If $P$ is true, then the condition $(P \lor x = 0)$ is true for all $x \in 2$. Thus $A = \{0, 1\}$.
      *   Similarly, $(P \lor x = 1)$ is true for all $x \in 2$. Thus $B = \{0, 1\}$.
      *   Therefore, if $P$, then $A = B$ (extensional equality).
  *   **Consequence for $f$:**
      *   Since $f$ is a function, if $A = B$, then $f(A) = f(B)$.
      *   Therefore, $P \implies a = b$.
  *   **Contraposition:**
      *   In intuitionistic logic, $(P \implies Q)$ entails $(\neg Q \implies \neg P)$.
      *   Let $Q$ be $a = b$. We have $P \implies a = b$.
      *   Therefore, $\neg(a = b) \implies \neg P$.
      *   Since $a, b \in \{0, 1\}$, $\neg(a = b)$ is equivalent to $a \neq b$.
      *   Thus, $a \neq b \implies \neg P$.

  ### Conclusion
  We have established:
  1.  $a = b \lor a \neq b$ (Decidable equality on $2$)
  2.  $a = b \implies P$
  3.  $a \neq b \implies \neg P$

  Therefore, $P \lor \neg P$. Since $P$ was arbitrary, the Law of Excluded Middle holds.

  ---

  ## 3. Diagnosis: Is the Axiom of Choice the Culprit?

  The proof above is valid in IZF. However, whether we should blame the Axiom of Choice for the collapse of constructivity is a matter of significant debate in the foundations of mathematics.

  ### The Argument for "Unrestricted Separation"
  Notice Step 1 of the proof. We formed the sets $A$ and $B$ using the **Axiom of Separation** applied to the predicate $\phi(x) \equiv P \lor x = 0$.
  *   In **IZF**, Separation is unrestricted: for *any* formula $\phi$, the set $\{x \in S \mid \phi(x)\}$ exists.
  *   This allows us to form sets whose membership conditions depend on the truth value of an arbitrary, potentially undecidable proposition $P$.
  *   The "non-constructivity" enters because we are allowed to treat $A$ and $B$ as well-defined objects *before* we know whether $P$ is true or false. The Choice function $f$ is then required to operate on these objects extensionally. If $P$ turns out to be true, $A$ and $B$ become identical, forcing $f(A)=f(B)$. The existence of $f$ essentially "predicts" this identity.

  ### The Evidence from CZF (Constructive Zermelo–Fraenkel)
  In **CZF**, the Separation Axiom is restricted to **bounded formulas** (formulas where all quantifiers are restricted to sets, e.g., $\forall x \in y$).
  *   If $P$ is an arbitrary proposition (e.g., a $\Pi^0_1$ statement like the Goldbach Conjecture), the formula $P \lor x = 0$ is generally **not bounded**.
  *   Consequently, in CZF, **we cannot form the sets $A$ and $B$** used in the Diaconescu proof for arbitrary $P$.
  *   CZF validates strong choice-like principles (such as the Axiom of Relative Dependent Choice) without collapsing into classical logic.
  *   **Diagnosis:** This suggests that the conflict is not inherent to Choice itself, but rather to the interaction between Choice and **Unrestricted Separation**. If you restrict the formation of sets (predicativity), you can retain constructive choice principles.

  ### The Evidence from Type Theory
  In **Martin-Löf Type Theory (MLTT)**, a different foundational framework:
  *   The Axiom of Choice is actually a **theorem** (the "Type-Theoretic Axiom of Choice").
  *   MLTT is thoroughly constructive and does not validate LEM.
  *   **Diagnosis:** In an intensional setting (where equality is not purely extensional), AC is perfectly constructive. The Diaconescu proof fails in Type Theory because the sets $A$ and $B$ would not be considered "equal" merely because $P$ is true; their definitions (intensions) differ.

  ### Evaluation of the Slogan
  > *"The Axiom of Choice is intuitionistically suspect."*

  **Verdict:** The slogan is **fair but context-dependent.**

  1.  **Fair:** In the context of **extensional set theories** (like IZF), AC is indeed suspect. As the proof shows, accepting AC in IZF commits you to classical logic. If you wish to remain constructive within set theory, you must reject Full AC.
  2.  **Misleading:** In the broader context of **constructive mathematics**, AC is not inherently non-constructive.
      *   In **Type Theory**, it is valid.
      *   In **CZF**, restricted choice principles are valid.
      *   The "constructive content" of AC (uniformly selecting witnesses) is compatible with constructivism. The problem arises when AC is combined with **Extensionality** and **Unrestricted Separation**, which allow the construction of sets that hide undecidable information in their identity conditions.

  **Takeaway for the Seminar:**
  The Diaconescu–Goodman–Myhill theorem teaches us that constructivity is not merely a matter of logic (rejecting LEM). It is also a matter of **ontology**. To maintain a constructive worldview within set theory, one must restrict not only the logic but also the principles of set formation (Separation) or the nature of equality (Extensionality).

  ---

  ### Suggested Reading
  *   Diaconescu, R. (1975). "Axiom of Choice and Complementation". *Proceedings of the American Mathematical Society*.
  *   Aczel, P. (1978). "The Type Theoretic Interpretation of Constructive Set Theory". (For the CZF/Type Theory contrast).
  *   Bell, J. L. (2009). *The Axiom of Choice*. (Chapter on Intuitionistic Set Theory).
