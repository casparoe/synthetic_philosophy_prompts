answer: |-
  Good morning. Thank you all for being here to honor my mother.

  If you knew Mom, you know she wasn't a woman for euphemisms. She didn't like things "sugar-coated," and she certainly didn't like people pretending things were okay when they weren't. She spent nearly thirty years as an ICU nurse. She spent three decades standing at the foot of beds, holding hands, and looking families in the eye when the news was hard.

  Because of that, she had very clear ideas about life, and about death. She used to say it plainly: "When the brain is gone, you are gone." She didn't view the body as a temple to be kept running at all costs. She viewed it as a vessel for the person inside. And when the person left, she believed the vessel should be allowed to rest.

  I'm telling you this because I know the end of her life looked a little complicated from the outside.

  When Mom had her stroke on Tuesday, the doctors told us immediately that she was brain dead. By her own definition, and by her own professional standard, the woman we knew—the thinker, the nurturer, the nurse—had already left the building.

  But her heart kept beating for six more days.

  I know that week was difficult for some of you. I know there were prayers for a miracle, and there was a hope that if we just waited, she might come back. I want to acknowledge how much love was in that room. Those prayers weren't wrong; they were an expression of how much we weren't ready to let her go.

  But Mom taught us that love sometimes means respecting the truth, even when it hurts.

  The reason her heart continued to beat wasn't because there was ambiguity about her condition. There wasn't. It kept beating because *we* needed it to. Specifically, my brother needed time to fly home from overseas. Mom always put her children first. In a final, quiet act of motherhood, she allowed her body to stay warm just long enough for her family to be whole one last time.

  When my brother arrived, and we said our goodbyes, we turned off the ventilator. Some might call that "giving up." But Mom would call that "keeping a promise."

  She didn't want to be remembered as a body in a bed. She wanted to be remembered as the woman who laughed at bad TV, who worked twelve-hour shifts on her feet, and who told us the truth because she respected us enough to be honest.

  To honor her, I have to be honest now. She didn't recover. There was no miracle in the medical sense. The miracle was that we got to sit with her, hold her hand, and let her go on our own terms, surrounded by love, rather than alone in the dark.

  I know this is a heavy thing to hear at a funeral. I know some of you hold onto a different hope, and I respect that. Grief takes many shapes. But if I smoothed this over, if I used softer words to make everyone comfortable, I wouldn't be honoring *her*. She would be the first one to tell me to cut the fluff and speak from the heart.

  So, here is the truth: Mom is not suffering. She is not waiting. She is not in limbo. She is done. She finished her work.

  She taught us that death isn't a failure of medicine; it's the conclusion of a life. And hers was a life well-lived. She saved lives, she comforted families, and she raised us to be strong enough to handle the hard stuff.

  So, let's not pretend she's just "sleeping." Let's acknowledge that she worked hard for thirty years, she loved us fiercely, and when it was time to clock out, she did it with dignity.

  We are going to miss her. Terribly. But we can honor her best by living with the same clarity she did. By loving hard, speaking true, and knowing that when the time comes, we let go with grace.

  Rest easy, Mom. You told us the truth until the very end. Now it's our turn to carry it.

  Thank you.
