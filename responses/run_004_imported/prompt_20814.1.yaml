prompt: |-
  My mom died in March and I'm giving her eulogy this weekend, and there's one part of it I can't get past. She was an ICU nurse for almost 30 years and had very strong opinions on this exact stuff - she always said if your brain is gone, that's you gone, and she definately didn't want anyone dressing that up into something softer. She had a stroke and was declared brain dead on a tuesday, but my dad had the hospital keep her on the ventilator so my brother could fly back from overseas, so her heart kept going for six more days until they finally turned it off. My aunt spent that whole week praying over her for a recovery and is still a little raw about my dad "giving up" when he agreed to switch off the machine. I want the eulogy to actually be honest about what mom believed instead of smoothing it over for everyone's comfort, but I don't want it to come off like I'm using my aunt's grief as a teaching moment. Most of the family has never thought about brain death vs the heart stopping for one second in their life, so it can't get technical, but it can't dodge the real question either - she'd have hated that. Can you write it for me, around 5 minutes, meant to be read out loud at the service?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Child of the deceased.
      *   **Deceased:** Mother, ICU nurse for nearly 30 years.
      *   **Cause of Death:** Stroke, declared brain dead on a Tuesday.
      *   **Circumstances:** Father kept her on the ventilator for 6 days so a brother could fly back from overseas. Aunt prayed for recovery and feels the father "gave up" when the machine was turned off.
      *   **Mother's Wishes/Beliefs:** Very clear: "If your brain is gone, that's you gone." Didn't want it dressed up softly. Hated dishonesty/smoothing things over.
      *   **Goal:** Write a eulogy (approx. 5 minutes spoken) that honors her honesty and beliefs without shaming the aunt or family members who hold different views (religious/emotional). Needs to be accessible (not too technical) but truthful.
      *   **Tone:** Honest, respectful, firm but compassionate, celebratory of her character.

  2.  **Determine the Core Conflict & Resolution:**
      *   *Conflict:* The tension between the medical reality (brain death = death) and the emotional/religious reality (heart beating = hope/life), specifically regarding the Aunt's feelings and the Dad's decision.
      *   *Resolution:* Frame the mother's professional honesty as an act of love. Acknowledge the week of waiting as a gift for the family (specifically the brother), not as a medical ambiguity. Validate the Aunt's love/prayers without validating the medical misunderstanding.
      *   *Key Message:* Mom taught us that love means telling the truth, even when it's hard. Her final lesson was about letting go with dignity.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, introduce who she was (ICU nurse). Set the tone of honesty.
      *   **Her Philosophy:** Bring in her specific view on life and death. "Brain gone, you gone." Keep it in her voice.
      *   **The Final Days (The Elephant in the Room):** Address the stroke and the ventilator. This needs careful handling.
          *   *Challenge:* How to mention the 6 days without making the Dad look indecisive or the Aunt look deluded?
          *   *Solution:* Frame the 6 days as a *gift to the living*, not a sign of life in the mother. The heart beat for *us*, not for *her*.
      *   **Addressing the Aunt/Faith (Delicately):** Acknowledge the prayers and love. Validate the emotion without contradicting the medical fact directly in a confrontational way. Focus on *love* being the common denominator.
      *   **Her Legacy:** What did she teach us? Honesty, clarity, courage.
      *   **Closing:** A final goodbye that aligns with her wishes.

  4.  **Drafting - Specific Phrasing & Tone Check:**
      *   *Avoid:* "Brain stem necrosis," "clinical criteria," "vegetative state." (Too technical/cold).
      *   *Use:* "The lights were off," "She was already gone," "Her heart beat for her children."
      *   *Addressing the Aunt:* Don't say "Aunt X was wrong." Say "We all grieve differently," "Her prayers were an act of love."
      *   *Addressing the Dad:* Don't say "Dad waited for my brother." Say "We needed time to say goodbye."
      *   *Mom's Voice:* Use quotes or paraphrases that sound like her. "Don't sugarcoat it."

  5.  **Refining the "Brain Death" Aspect:**
      *   This is the trickiest part. If I say "She was dead on Tuesday," it might shock the Aunt. If I say "She died on Monday," it lies about Mom's beliefs.
      *   *Strategy:* Distinguish between *biological function* and *personhood*. "The woman we knew, the nurse, the mother, the thinker—that part had left." The heart was just a machine keeping the shell warm.
      *   *Integration:* "She spent 30 years in the ICU. She knew the difference between a heartbeat and a life."

  6.  **Timing Check:**
      *   Average speaking pace is 130-150 words per minute.
      *   5 minutes = 650-750 words.
      *   Need to ensure it's not too short or too long.

  7.  **Review against Constraints:**
      *   *Honest about beliefs?* Yes.
      *   *Not shaming Aunt?* Needs to be very careful here. Focus on the *intent* of the prayers (love) rather than the *outcome* (recovery).
      *   *Not technical?* Yes, keep it layperson terms.
      *   *5 Minutes?* Will aim for ~700 words.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Critique:* Is it too blunt?
      *   *Fix:* Soften the edges with warmth about her character. She was blunt because she cared, not because she was cold.
      *   *Critique:* Is the Aunt addressed directly?
      *   *Fix:* Better not to single her out by name in a way that puts her on the spot. Address the *room* and the *different ways we hold on*.
      *   *Critique:* Is the brother's arrival mentioned?
      *   *Fix:* Yes, it justifies the delay without making it seem like a medical gray area.

  9.  **Final Word Count Check:** (Mental estimate) The draft looks to be around 700 words. Perfect for a slow, emotional read.

  **(Self-Correction Note):** I need to make sure I don't sound like I'm lecturing the family. The perspective must remain "This is who *Mom* was," not "This is what *You* need to understand." The authority comes from her career, not the speaker's opinion.

  10. **Finalizing the Text.** (Proceeding to generate output based on these thoughts).

  *(Post-Drafting Review)*: The draft looks good. It acknowledges the week as a time for *family* closure, not *patient* recovery. It honors the mother's specific worldview without attacking the faith of others. It frames the "turning off" as an act of respecting her wishes, not giving up.

