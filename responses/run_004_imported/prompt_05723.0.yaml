          *   **Ross-Littlewood (The Limit of a Set):** The state depends on the *membership* of individual elements. For every ball $n$, we can prove it is removed. The limit is defined by the set of elements that remain. $\lim_{n \to \infty} V_n = \emptyset$. This is pointwise convergence.
          *   *Summary:* Lamp = Global state oscillation. Vase = Individual trajectory tracking.
      *   *Section 2: Logical Impossibility.*
