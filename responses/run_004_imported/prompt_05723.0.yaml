          *   In Ross-Littlewood, the "state" (emptiness) *is* determined by the history because "being in the vase" is defined by not having been removed.
      *   *Conclusion:* The difference is between a system defined by a non-convergent sequence (Lamp) and a system defined by the exhaustion of a set (Vase). Ross-Littlewood weakens the idea that *all* supertasks are incoherent, but upholds the idea that physical intuition often fails at infinity.

