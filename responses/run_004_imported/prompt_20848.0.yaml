prompt: |-
  My mother, a scholar of Madhyamaka Buddhist philosophy who spent something like thirty years almost entirely on one Indian thinker, Nāgārjuna, died two weeks ago, and I have been asked to deliver her eulogy this coming Sunday. Within her department she was best known for her devotion to what she called, half-affectionately, the catuṣkoṭi, or tetralemma — the four-cornered pattern (it is, it is not, it is both, it is neither) that Nāgārjuna uses throughout his root text, the Mūlamadhyamakakārikā, and that he turns most pointedly on exactly the question everybody at a memorial service wants answered: whether a person who has just died still exists somewhere, or doesn't, or both, or neither. Some years ago, at a dinner with her graduate students, half-joking but clearly not entirely, she dictated what she called "the four things nobody is allowed to say at my funeral," and made them repeat it back to her like a catechism: that she's in a better place, that she's simply gone, that she's somehow both here and at peace, or that it's beyond words and we shouldn't try to say anything at all. I wasn't at that dinner. One of those students emailed me the list, word for word, as a condolence, and I can no longer pretend I haven't seen it.

  The service will be small, maybe seventy people, and split unevenly: the large majority are family and old friends who have never heard the word "emptiness" used in this particular technical sense and simply want to feel, for eight or ten minutes, that someone has said something true and tender about a woman they loved; a smaller group are former students and colleagues who wrote dissertations under her on exactly this material and will notice at once if I quietly smuggle in one of the four forbidden claims, or if I use her other favorite idea — that conventional truth and ultimate truth are two registers, not one real fact and one polite lie — as a loophole instead of honestly. She would also have been furious at a eulogy that turned her own emptiness doctrine into a clever hiding place, a smug fifth answer dressed up as humility; she used to say that anyone who treats emptiness itself as some special, exempt truth has missed the entire point of the book. My brother, who has even less patience for any of this than I do, has told me twice not to "turn Mom's funeral into a seminar."

  I write novels for a living, not philosophy, so I have more or less the opposite problem from the one she spent her career training students to solve: I can generally make a room feel something, but I don't yet trust myself to make it feel something that is also true by her own exacting lights. Could you write the eulogy for me? It should run about eight or ten minutes read aloud, and it needs to actually comfort the people in the first group without giving anyone in the second group grounds to corner me at the reception afterward and explain, kindly but at length, exactly where I went wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** A scholar of Madhyamaka Buddhist philosophy, specifically Nāgārjuna, focused on the *catuṣkoṭi* (tetralemma).
      *   **The Constraint (The "Four Forbidden Claims"):**
          1.  She's in a better place (It is).
          2.  She's simply gone (It is not).
          3.  She's both here and at peace (It is both).
          4.  It's beyond words/don't try to say anything (It is neither).
      *   **The Audience:**
          *   Group A (Majority): Family/friends, non-philosophers, want comfort/truth/tenderness.
          *   Group B (Minority): Students/colleagues, experts, will spot philosophical errors or "loopholes" (like misusing the Two Truths doctrine).
      *   **The Speaker:** A novelist (son/daughter), skilled at emotion but wary of philosophical precision. Brother warns against making it a "seminar."
      *   **The Tone:** Comforting but intellectually honest according to her specific standards. No "smug fifth answer" (using emptiness as an escape).
      *   **Length:** 8-10 minutes spoken (approx. 1000-1300 words).

  2.  **Deconstruct the Philosophical Challenge:**
      *   Nāgārjuna's *Mūlamadhyamakakārikā* deconstructs inherent existence. The *catuṣkoṭi* is used to show that none of the four logical positions hold up under ultimate analysis.
      *   *Crucial Nuance:* Nāgārjuna doesn't deny *conventional* reality. He affirms *dependent origination* (pratītyasamutpāda). Things exist dependently, not inherently.
      *   *The Trap:* Saying "She is empty" as a way to say "She doesn't matter" or "Nothing matters" is nihilism (which Nāgārjuna explicitly rejects). Saying "She exists eternally in some form" is eternalism (also rejected).
      *   *The Solution:* Focus on *relationship*, *memory*, and *impact* as the mode of existence. She exists *in* the grief, *in* the stories, *in* the causal chain of her life's work. This honors the "Conventional Truth" without reifying her into an eternal soul, and honors "Ultimate Truth" without collapsing into nihilism.
      *   *Avoiding the Four:*
          *   Don't say she *is* somewhere (heaven).
          *   Don't say she *is not* (nothingness).
          *   Don't say *both* (mystical dualism).
          *   Don't say *neither/ineffable* (silence/mystery).
      *   *Instead:* Talk about how she *continues* through causes and conditions. The grief itself is proof of the connection.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Validate the brother's warning (no seminar) but acknowledge the mother's intellect. Establish the novelist's voice (storytelling).
      *   **The Philosophical Elephant:** Address the *catuṣkoṭi* directly but gently. Acknowledge the "Four Forbidden Things" without making it a lecture. Frame it as her rigor applied to love.
      *   **The Core Metaphor:** Dependent Origination. She was made of her relationships, her students, her family. She exists in the effects she caused. This avoids "existence" (inherent) and "non-existence" (nihilism).
      *   **Personal Touch:** Specific memories (vague enough to be universal, specific enough to be real). Her laughter, her rigor, her tea, her books.
      *   **Addressing the Grief:** Grief is not a problem to be solved by philosophy. It is the evidence of the bond. This satisfies Group A (comfort) and Group B (phenomenological accuracy).
      *   **Closing:** A commitment to carry her forward. Not "she is watching," but "we are carrying her."

  4.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Risk:* Using the word "Emptiness" (Śūnyatā).
      *   *Correction:* Use it sparingly. Define it not as "nothingness" but as "openness" or "interconnection."
      *   *Risk:* Using the Two Truths doctrine as a loophole ("Ultimately she's gone, conventionally she's here").
      *   *Correction:* Explicitly reject that split. The convention *is* the reality we live in. Her love was conventionally real, and that is the only reality that comforts.
      *   *Risk:* The "Fifth Position."
      *   *Correction:* Don't offer a philosophical resolution. Offer a human one. The resolution is *action* (remembering, living), not *statement*.

  5.  **Drafting - Tone Check:**
      *   Needs to be warm, not cold/analytical.
      *   Needs to sound like a novelist (imagery, rhythm).
      *   Needs to respect the 8-10 minute mark (approx. 1100-1200 words at a moderate pace).

  6.  **Writing - Step-by-Step:**
      *   *Intro:* Welcome everyone. Acknowledge the split audience.
      *   *The "Forbidden" List:* Mention it with humor/affection. It shows we know her.
      *   *The Pivot:* If we can't say where she *is*, what can we say? We can say what she *did*.
      *   *Dependent Origination:* She was made of us. We are made of her.
      *   *The Work:* Her scholarship wasn't abstract; it was ethical.
      *   *The Grief:* It's the shape of her absence, which proves her presence.
      *   *Conclusion:* We continue the work.

  7.  **Review against Constraints:**
      *   *Better place?* No.
      *   *Simply gone?* No.
      *   *Both?* No.
      *   *Neither/Ineffable?* No.
      *   *Two Truths loophole?* Avoided by grounding everything in the conventional experience of love.
      *   *Length?* Looks good.
      *   *Tone?* Tender but sharp.

  8.  **Final Polish:** Check rhythm. Ensure the transition from philosophy to emotion is seamless. (Self-Correction: Make sure I don't use the word "tetralemma" too much, keep it accessible). *Wait, the prompt says the students know the term, family doesn't. I should use the concept without getting bogged down in Sanskrit.*

      *Decision:* I will mention the "four corners" metaphorically but focus on the *movement* between them, which is Nāgārjuna's actual point (the middle way is not a position, but a release from positions).

      *Wait, one more check:* The prompt says she would be furious if emptiness became a "clever hiding place." I need to make sure the eulogy doesn't say "Because everything is empty, don't worry." It must say "Because everything is connected, this matters."

      *Revised Plan:* Focus on *Pratītyasamutpāda* (Dependent Origination) rather than just *Śūnyatā* (Emptiness). Emptiness implies lack of inherent self; Dependent Origination implies rich interconnection. This is more comforting and philosophically accurate to her work.

      *Let's write.*

      *(Word Count Check during drafting)*: Aiming for ~1200 words.
      *(Tone Check)*: Ensure it doesn't sound like *I* am the philosopher. I am the child reporting on her life.

      *(Final thought on the "Four Forbidden Things")*: I should explicitly acknowledge them to show I'm not breaking the rules, but then move *through* them. "She forbade us to say X. So I won't. Instead I will say Y."

      *(Final thought on the Brother)*: Acknowledge his warning. "My brother told me not to make this a seminar. He's right. But Mom made everything a seminar, even love."

      *Okay, ready to generate.*
answer: |-
  Thank you all for coming.

  My brother asked me not to turn this into a seminar. He is right. If my mother were here, she would probably agree with him, though she might also raise an eyebrow at the suggestion that a seminar and a eulogy are mutually exclusive categories. For thirty years, her life was a rigorous examination of how we speak about reality, and how we speak about loss. She taught that language is a tool, often clumsy, but the only one we have. So, I am going to use that tool as best I can, not to explain her philosophy to you, but to explain her love.

  Those of you who knew her professionally know that she devoted her life to the work of Nāgārjuna. Specifically, she was fascinated by a logical pattern he used called the *catuṣkoṭi*, or the tetralemma. It's a four-cornered structure used to analyze any claim: Is it true? Is it false? Is it both? Is it neither?

  Nāgārjuna used this to show that reality doesn't fit neatly into our boxes. And my mother, with her characteristic wit and precision, applied this to her own mortality. A few years ago, she dictated a list to her students: "The Four Things Nobody Is Allowed to Say at My Funeral."

  I have that list. I know the rules.
  I am not allowed to say she is in a better place.
  I am not allowed to say she is simply gone.
  I am not allowed to say she is somehow both here and at peace.
  And I am not allowed to say that it is all beyond words, so we shouldn't try.

  If I say any of these, I know there are people in this room—her former students—who will feel a philosophical itch they won't be able to scratch. And if I ignore them entirely, I know there are people in this room—her family, her friends, her brother—who just want to know that she mattered.

  So, here is what I can say.

  I can say that she was here. I know this because I am standing here, and I am made of her. I am made of her genetics, yes, but more than that, I am made of her habits. The way I hold a cup, the way I pause before answering a difficult question, the specific impatience I feel when people use words loosely—these are not mine. They are hers. They are causal ripples from a stone she threw into the water decades ago that are still moving across the surface.

  To say she is "gone" implies that she was a self-contained object that has now been removed from the room. But she taught us that nothing is self-contained. She taught that things only exist in relation to other things. A flame exists only while it burns; a river exists only while it flows. She existed in her teaching, in her arguments, in the way she listened to my brother when he was sick, in the way she graded papers until midnight, in the way she made tea for us when we were sad.

  Those things happened. They are facts. They cannot be un-happened. To say she is "gone" is to deny the reality of those causes. But to say she is "still here" in some spiritual sense is to pretend she didn't die.

  So, I am left with this: She has changed state.

  There is a concept she wrote about often, *pratītyasamutpāda*. It is usually translated as "dependent origination." It means that nothing arises on its own. Everything arises in dependence on conditions. She arose from her parents, her teachers, her culture, her struggles. And now, she continues in us.

  This is not a metaphor. It is a description of how the world works. When she corrected a student's logic, she altered the structure of that student's mind. That student goes on to teach others. The correction ripples outward. When she comforted a friend, she altered the chemistry of that friend's grief. That friend goes on to comfort others.

  She is not in a better place. She is in this place. She is in the way her colleagues will cite her work next year. She is in the way I will raise my children. She is in the silence I feel when I pick up the phone to call her and remember I cannot.

  Some of you might find this cold. It sounds technical. But to me, this is the most tender thing she ever taught me. She taught that because nothing has a permanent, fixed soul, nothing is ever truly isolated. We are not islands that sink when we die. We are knots in a net. If you pull on one string, the whole net vibrates. She is the vibration.

  I know there is a temptation, especially for those of us who study ideas for a living, to use her philosophy as a shield. To say, "Well, emptiness means nothing matters, so why grieve?" She would have been furious at that. She used to say that if you use emptiness to avoid pain, you have understood nothing. Emptiness is not a vacuum; it is an openness. It is the space that allows connection to happen. If we were solid, unchanging statues, we could never touch each other. We could never love, because love requires change. It requires vulnerability.

  Her grief for us, when we struggled, was real. Her joy, when we succeeded, was real. The fact that these feelings were "empty" of permanent essence didn't make them fake. It made them precious. It meant they were alive.

  So, I am not going to tell you she is watching over us. I don't know that.
  I am not going to tell you she is nothing but dust. I know that isn't true.
  I am not going to tell you it's a mystery we can't speak of. We must speak of it.
  And I am not going to tell you she is both dead and alive in some magical way.

  I am going to tell you that she is active.

  Her work is not finished. The questions she asked are still asking themselves through us. When one of her students challenges a lazy argument, that is her. When I write a sentence and cut the adjectives because they are weak, that is her. When we sit together after this service and share a meal because we need comfort, that is her.

  She spent thirty years studying a text that deconstructs every position you try to hold. But she never used that deconstruction to destroy meaning. She used it to clear away the clutter so the meaning could shine through. She cleared away the idea that she was a VIP of the universe, so that she could just be a mother, a colleague, a friend. She cleared away the fear of death, not by promising an afterlife, but by showing that the boundary between "self" and "other" was always more porous than we thought.

  If you want to honor her, do not look for her in the sky. Do not look for her in the grave. Look for her in the dependency. Look for the ways you are relying on her right now.

  I am relying on her to give me the courage to stand here.
  Her students are relying on her to give them the rigor to continue their work.
  Her friends are relying on her memory to anchor a shared history.

  She is not a noun. She is a verb. She is the act of remembering. She is the act of questioning. She is the act of loving things that we know, inevitably, will break.

  My brother told me not to make this a seminar. I hope I haven't. But she made her life a kind of offering to truth. And the truest thing I can say is that I miss her. The pain of missing her is not a sign that I have failed to understand her philosophy. It is the proof that I understood it perfectly. It is the evidence of the connection.

  So, let us not worry about where she is. Let us worry about how we carry her. Let us carry her rigor. Let us carry her kindness. Let us carry her refusal to accept easy answers, even when the easy answer is the only one that offers comfort.

  She taught us that the middle way is not a compromise. It is a balance. It is walking the line between despair and denial. It is standing in the rain without pretending you are dry, and without pretending you will drown.

  We are wet. We are cold. We are here. And because we are here, and because we are connected, she is here too. Not as a ghost. Not as a memory. But as a cause.

  Thank you.
