prompt: |-
  I'm on the Elections Board for my school's student council (we handle campaign complaints for class officer elections), and tomorrow's meeting has the board split down the middle. A candidate for senior class president didn't lie about anything, but for the last two days of voting she posted instagram stories with a countdown timer that reset every few hours ('polls close in 2 hrs, dont be the last one!!'), right next to a running tally of who'd already voted, built from screenshots supporters sent her of their 'I Voted' stickers. Undecided kids could watch the number climb and felt like everyone but them had already picked her -- nothing false, just true info arranged to pressure people. Half the board calls that normal hype-building, the kind every campaign does some version of; the other half says engineering that kind of social pressure to stampede people into voting without really thinking it through counts as manipulation even with zero lies involved. Our constitution just says campaigns have to be "honest and respectful," which doesn't really settle it either way. Can you draft the memo I have to bring to tomorrow's meeting? It needs to recommend something concrete (disqualify her, give her a warning, let the results stand but ban the tactic going forward, whatever) and actually defend that call, while taking the "it's just normal campaigning" side seriously instead of just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the School Elections Board.
      *   **Task:** Draft a memo for tomorrow's meeting.
      *   **Issue:** A senior class president candidate used Instagram stories with countdown timers and a running tally of "I Voted" screenshots (social proof/pressure) during the last two days of voting. No lies were told.
      *   **Conflict:** Board is split 50/50.
          *   Side A: Normal hype-building/get out the vote (GOTV).
          *   Side B: Manipulative social pressure/psychological coercion.
      *   **Constraint:** Constitution says "honest and respectful," which is vague.
      *   **Requirements:**
          *   Recommend a concrete action (disqualify, warn, let stand + ban future, etc.).
          *   Defend the recommendation.
          *   Take the "normal campaigning" side seriously (steelman their argument).
          *   Tone: Professional, fair, decisive, suitable for a student government context.

  2.  **Determine the Recommendation:**
      *   *Option 1: Disqualify.* Too harsh. No rules were explicitly broken, and no lies were told. Might cause a bigger backlash.
      *   *Option 2: Do Nothing.* Ignores the valid concerns of half the board and sets a precedent that might encourage an arms race of pressure tactics next year.
      *   *Option 3: Warning + Let Results Stand + Clarify Rules.* This is the most balanced approach. It acknowledges the gray area, validates the complaint without punishing the candidate retroactively for a rule that wasn't clear, but sets a boundary for the future.
      *   *Decision:* I will recommend **letting the results stand but issuing a formal warning and clarifying the "respectful" clause for future elections.** This balances fairness to the candidate (no retroactive punishment) with integrity for the process (addressing the manipulation concern).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the split decision.
      *   **Summary of Incident:** Briefly describe what happened (countdowns, vote tallies) without bias.
      *   **Analysis of Arguments (The "Steelman"):**
          *   *Defense (Side A):* It's Get Out The Vote (GOTV). It's common. It's not lying. It creates excitement.
          *   *Complaint (Side B):* It's FOMO (Fear Of Missing Out). It's bandwagon effect. It pressures undecided voters to rush. It conflicts with "respectful."
      *   **Interpretation of Constitution:** Tackle the "Honest and Respectful" clause.
          *   *Honest:* She passed this.
          *   *Respectful:* This is the crux. Does psychological pressure violate respect for the voter's autonomy?
      *   **Recommendation:** The concrete action (Results stand, formal warning, rule clarification).
      *   **Justification:** Why this specific path? (Precedent, fairness, future integrity).
      *   **Next Steps:** What needs to happen at the meeting.

  4.  **Refining the Tone:**
      *   Needs to sound like a student leader but mature.
      *   Avoid accusatory language against the candidate.
      *   Avoid dismissive language against the board members who think it's "just hype."
      *   Focus on *process integrity* rather than *punishment*.

  5.  **Drafting - Key Arguments to Include:**
      *   *For the "Normal Hype" side:* Acknowledge that all campaigns try to create urgency. Silence isn't neutral.
      *   *For the "Manipulation" side:* Distinguish between "Go Vote" and "Everyone else already voted for me." The specific tallying creates a herd mentality that undermines deliberation.
      *   *The Compromise:* Retroactive punishment is unfair because the rule was vague. Prospective rule-making is the Board's job.

  6.  **Review against Constraints:**
      *   Concrete recommendation? Yes (Warning + Rule Clarification).
      *   Defend the call? Yes (Fairness vs. Integrity).
      *   Take other side seriously? Yes (Dedicated section analyzing the GOTV argument).
      *   Memo format? Yes.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I sound too legalistic? *Adjustment:* Keep language accessible but precise.
      *   *Check:* Is the recommendation clear? *Adjustment:* Make it a bulleted list in the recommendation section.
      *   *Check:* Did I address the "honest and respectful" clause? *Adjustment:* Ensure the interpretation of "respectful" is central to the argument.

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Student Council Elections Board
  **FROM:** [Your Name/Position]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Senior Class President Campaign Conduct

  **Purpose**
  The purpose of this memo is to provide a framework for tomorrow's deliberation regarding the complaint filed against the Senior Class President candidate, [Candidate Name]. As the Board is currently divided on whether the candidate's use of social media countdowns and vote tallies constitutes a violation of our "honest and respectful" clause, this document outlines the facts, analyzes both sides of the argument, and offers a concrete recommendation for resolution.

  **Summary of Incident**
  During the final 48 hours of voting, the candidate in question posted Instagram Stories featuring:
  1.  Countdown timers indicating when polls would close.
  2.  A running tally of voters, compiled from screenshots of "I Voted" stickers submitted by supporters.

  No false information was disseminated. The vote counts were accurate based on the screenshots provided, and the poll closing times were correct. The complaint alleges that while factually true, this combination engineered social pressure (the "bandwagon effect" and FOMO) that coerced undecided students into voting hastily.

  **Analysis of Board Positions**
  To reach a fair verdict, we must validate the legitimate concerns on both sides of this split.

  *   **The "Standard Campaigning" Argument:**
      Half of this Board argues that this tactic is simply an effective "Get Out The Vote" (GOTV) strategy. Every campaign seeks to generate urgency. Reminding students that "polls are closing" is standard practice. Furthermore, sharing enthusiasm (via "I Voted" stickers) is a form of protected political expression. To penalize a candidate for high engagement and organized mobilization could set a dangerous precedent where we punish success or enthusiasm under the guise of fairness. If we rule against this, we risk micromanaging campaign style rather than campaign integrity.

  *   **The "Manipulative Pressure" Argument:**
      The other half argues there is a distinct line between encouraging voting and engineering a stampede. By displaying a *running tally* alongside a *countdown*, the campaign moved beyond "Go Vote" to "Everyone else has already decided, and you are running out of time to join them." This leverages psychological herd behavior. While not "dishonest," it arguably violates the "respectful" clause by treating the voter's deliberation time as an obstacle to be overcome rather than a democratic right to be protected.

  **Interpretation of the Constitution**
  Our Constitution requires campaigns to be "honest and respectful."
  *   **Honest:** The candidate clearly met this standard. No lies were told.
  *   **Respectful:** This is the gray area. "Respectful" usually implies civility (no smear campaigns). However, in the context of election integrity, it should also imply respect for the *process*. A process where voters feel pressured to conform to a perceived majority before the polls close undermines the legitimacy of the result.

  **Recommendation**
  I recommend the Board take the following three actions:

  1.  **Certify the Election Results:** We allow the current vote count to stand.
  2.  **Issue a Formal Warning:** We issue a formal warning to the candidate regarding the specific tactic of publishing real-time vote tallies during active voting windows.
  3.  **Amend Campaign Guidelines:** We immediately draft a clarification to the "respectful" clause for future elections, explicitly prohibiting the publication of real-time vote counts or supporter tallies while polls are open.

  **Justification for Recommendation**
  This approach balances fairness to the candidate with the integrity of our elections.

  *   **Why Certify the Results?** Retroactive disqualification is the nuclear option. Because our current rules were vague on this specific tactic, punishing the candidate now would be unjust. They operated within the literal text of the rules as they existed. Disqualifying a winner based on a new interpretation of "respectful" after the votes are cast damages the Board's credibility more than the tactic itself.
  *   **Why Issue a Warning?** A warning acknowledges that while the tactic wasn't explicitly banned, it pushed the boundary of ethical campaigning. It validates the complaint without punishing the candidate disproportionately. It signals that the Board is watching and that "technically legal" does not always mean "acceptable."
  *   **Why Change the Rules?** This is the most critical step. The split on this Board proves our current guidelines are outdated. Social media moves faster than our constitution. By banning real-time tallies for *future* elections, we prevent an arms race of pressure tactics without needing to rely on vague interpretations of "respectful." We remove the ambiguity so no future candidate is put in this position.

  **Conclusion**
  We are not ruling that this candidate cheated. We are ruling that our rules were not specific enough to prevent a tactic that compromises the spirit of a deliberative vote. By letting the results stand but tightening the rules for tomorrow, we protect the current winner's legitimacy while ensuring the next election is decided by platforms, not pressure.

  I look forward to discussing this framework in tomorrow's meeting.
