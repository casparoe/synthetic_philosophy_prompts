answer: |-
  **MEMORANDUM**

  **TO:** Graduate Seminar on Philosophy of Mind
  **FROM:** [Your Name]
  **SUBJECT:** Rebuttal to Chalmers's Asymmetry Claim in Two-Dimensional Argument
  **DATE:** October 26, 2023

  ### 1. Executive Summary

  The core of David Chalmers's two-dimensional argument against Type-B materialism rests on a specific semantic asymmetry: while natural kind terms (e.g., "water") possess distinct primary and secondary intensions, phenomenal concepts (e.g., "pain") allegedly possess primary and secondary intensions that coincide. Chalmers argues this coincidence blocks the Type-B move of treating psychophysical identities as a posteriori necessities.

  This brief argues that this asymmetry is unmotivated and question-begging. By examining the mechanics of how primary intensions are fixed—specifically regarding reference-fixing descriptions and the vocabulary used to specify epistemic scenarios—we demonstrate that a Type-B materialist is semantically entitled to treat phenomenal concepts on par with natural kind terms. If the asymmetry is rejected, the two-dimensional argument collapses, as the conceivability of zombies entails only epistemic contingency (divergence of primary intensions), not metaphysical contingency (divergence of secondary intensions).

  ### 2. The Mechanics of Primary Intensions and Reference Fixing

  To evaluate Chalmers's asymmetry, we must scrutinize how primary intensions are generated within the two-dimensional framework.

  **2.1 The Standard Model (Natural Kinds)**
  For a term like "water," the primary intension is fixed by a reference-fixing description associated with the term in the speaker's epistemic state. Chalmers accepts that the primary intension of "water" is roughly "the clear, drinkable liquid filling the oceans."
  *   **Scenario Evaluation:** When we evaluate "water" at an epistemically possible scenario considered as actual (e.g., Twin Earth), we ask: "What satisfies the description 'clear, drinkable liquid...' in this scenario?"
  *   **Result:** In the Twin Earth scenario, XYZ satisfies the description. Thus, the primary intension picks out XYZ. However, once we fix *our* actual world, the secondary intension rigidly designates H2O. The gap between 1-intension (descriptive role) and 2-intension (underlying nature) allows "Water = H2O" to be 1-contingent but 2-necessary.

  **2.2 Chalmers's Claim for Phenomenal Concepts**
  Chalmers argues that phenomenal concepts function differently. He claims they are "purely phenomenal" and pick out their referents via direct acquaintance or constitution.
  *   **The Claim:** The concept "pain" does not rely on a contingent description (e.g., "the state caused by damage"). Instead, the phenomenal quality *itself* is part of the concept.
  *   **The Consequence:** When evaluating "pain" at a scenario considered as actual, there is no descriptive filter. The concept picks out "whatever has *this* phenomenal quality." Since the quality is presented directly, Chalmers argues the primary intension *just is* the phenomenal property. Therefore, 1-intension = 2-intension.
  *   **The Argument:** If "Pain = C-fiber firing" were true, it would have to be 1-necessary (since 1-intension = 2-intension). But zombies are 1-possible (conceivable). Therefore, "Pain = C-fiber firing" is not 2-necessary.

  ### 3. The Stalnaker-Style Metasemantic Objection

  The Type-B materialist, drawing on Stalnakerian metasemantics, challenges the assertion that phenomenal concepts lack a reference-fixing description distinct from their referent. The asymmetry is not a datum of semantics; it is a metaphysical assumption smuggled into the semantics.

  **3.1 The Question-Begging Nature of "Direct Reference"**
  Chalmers's claim that primary and secondary intensions coincide for phenomenal concepts assumes that the *mode of presentation* reveals the *metaphysical nature* of the referent.
  *   **Materialist Semantics:** For the Type-B materialist, phenomenal concepts are recognitional or demonstrative concepts applied to physical states. The reference is fixed by a causal-functional role (e.g., "the state typically causing avoidance behavior and triggered by tissue damage").
  *   **The Gap:** If reference is fixed by role, then in a zombie scenario (considered as actual), the physical state playing that role exists, but the phenomenal concept might fail to refer (if the concept requires consciousness) or refer to the physical state alone.
  *   **The Objection:** Chalmers asserts that the phenomenal concept picks out the *phenomenal property* directly. But if physicalism is true, there *is no* irreducible phenomenal property to be picked out. By insisting the 1-intension picks out a phenomenal property distinct from the physical role, Chalmers presupposes dualism to prove dualism. The Type-B materialist is entitled to insist that the 1-intension of "pain" is the functional role, while the 2-intension is the physical realizer. This restores the water/H2O asymmetry.

  **3.2 The Problem of the Base Vocabulary (PQTI)**
  Chalmers's two-dimensional framework relies on specifying epistemic scenarios using a "neutral" vocabulary, which he denotes as PQTI (Physical, Qualitative, Tensed, Indexical truths).
  *   **The Bias:** The inclusion of 'Q' (phenomenal truths) as a primitive in the base vocabulary rigs the game against physicalism. If 'Q' is primitive, then a scenario can be specified where P (physical truths) holds but Q does not (a zombie world). In such a scenario, the primary intension of "pain" (linked to Q) is not satisfied by the physical state.
  *   **The Materialist Correction:** A consistent physicalist must hold that the base vocabulary is purely physical (PTI). 'Q' truths are derived from 'P' truths.
  *   **Implication:** If scenarios are specified in physical vocabulary, a "zombie scenario" is not a world where P is true and Q is false; it is a world where P is true and our *concept* "pain" fails to refer (or refers to a physical state that we mistakenly judge as non-phenomenal).
  *   **Result:** If we fix the primary intension of "pain" relative to a physical base vocabulary, the 1-intension tracks the physical/functional role. The fact that we can *imagine* the role without the "feeling" is an epistemic feature of our concepts (the gap between 1 and 2 intensions), not a metaphysical feature of the world. Chalmers's asymmetry relies on treating 'Q' as semantically independent of 'P', which the Type-B materialist denies.

  ### 4. Restoring the Asymmetry: Why Type-B Materialism Survives

  If we deny Chalmers's claim that phenomenal concepts are transparent to their metaphysical nature, the two-dimensional argument loses its force. The Type-B materialist posits the following semantic structure for phenomenal terms, identical to natural kind terms:

  1.  **Primary Intension (Epistemic):** Fixed by the phenomenal concept's mode of presentation (e.g., "the state appearing *this* way to the subject" or "the state playing the pain-role"). This is contingent. In a zombie world considered as actual, nothing (or a functional duplicate) satisfies this.
  2.  **Secondary Intension (Metaphysical):** Fixed by the actual referent in our world. If physicalism is true, this is a physical state (e.g., C-fiber firing). This is necessary.
  3.  **The Identity Statement:** "Pain = C-fiber firing."
      *   **1-Contingent:** We can conceive of the primary intension being satisfied by something else (or nothing), because the concept does not reveal the physical essence.
      *   **2-Necessary:** Once the actual world fixes the referent as C-fibers, the identity holds across all counterfactual worlds.

  **Chalmers's Block:** Chalmers blocks this by claiming that for phenomenal concepts, the "mode of presentation" *is* the referent.
  **The Rebuttal:** This claim lacks independent semantic motivation. It relies on the intuition that "we cannot be wrong about how it feels." But "how it feels" is the *access* to the state, not the *identity* of the state. Just as we access water via "watery appearances" but water *is* H2O, we access pain via "painful appearances" but pain *is* (potentially) a physical state. To assert otherwise is to assert that phenomenal concepts are the only concepts in the universe that reveal the essences of their referents a priori. This is a massive exception to general metasemantic principles without sufficient justification.

  ### 5. Conclusion

  Chalmers's two-dimensional argument succeeds only if one accepts his specific semantic thesis that phenomenal concepts have coincident primary and secondary intensions. However, this thesis is not a neutral semantic observation; it is a metaphysical claim that presupposes the falsity of physicalism.

  A Type-B materialist is entitled to resist this asymmetry by arguing:
  1.  **Reference Fixing:** Phenomenal concepts fix reference via contingent descriptions or demonstrative relations to physical states, creating a gap between 1 and 2 intensions.
  2.  **Base Vocabulary:** Epistemic scenarios should be specifiable in physical terms; the inclusion of primitive 'Q' truths biases the semantic evaluation toward dualism.
  3.  **Metasemantic Uniformity:** There is no principled reason to treat phenomenal concepts as semantically unique regarding intension coincidence.

  Once this asymmetry is denied, the conceivability of zombies demonstrates only that the *primary intension* of "pain" does not entail the *primary intension* of "physical state." It does not demonstrate that the *secondary intension* (the metaphysical referent) differs. Thus, the inference from epistemic possibility to metaphysical possibility is blocked, and Type-B materialism remains a viable position.
