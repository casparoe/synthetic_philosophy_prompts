answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name/Board Member]
  **DATE:** [Date]
  **SUBJECT:** Pre-Deliberation Memo: Case [Student ID/Case Number] and Standards of Proof

  **Purpose**

  This memo outlines my recommendations regarding the pending case against [Student Name], involving five counts of unauthorized aid across separate quizzes. It also addresses a procedural question raised during our preliminary review regarding the aggregation of confidence metrics in multi-count cases. My goal is to provide a framework for Thursday's vote that respects our bylaws, engages seriously with the logical concerns raised, and ensures the integrity of our sanctioning process.

  **The Logical Challenge**

  As discussed, the investigator has assigned a ~90% confidence level to each of the five counts. Our bylaws require 85% confidence for a "Responsible" finding on *any* count. Our sanction guide mandates expulsion if a student is found responsible on *all five* counts in a single case.

  A mathematical objection has been raised: If the counts are independent, the probability of the *conjunction* (that the student is guilty of all five) is $0.9^5 \approx 59\%$. This is below our 85% threshold. Therefore, it is argued, we cannot be sufficiently certain to trigger the expulsion sanction, even if we vote "Responsible" on each count individually.

  This is a variation of the "Lottery Paradox." It presents a genuine dilemma: do we sanction based on the individual findings (which meet the bar) or the aggregate certainty (which does not)?

  **Recommendation on Verdict and Sanction**

  **1. Verdict:** I recommend finding the student **Responsible on all five counts.**
  **2. Sanction:** I recommend **Expulsion**, consistent with the Sanction Guide.

  **Reasoning**

  **A. The Standard of Proof Applies to Counts, Not Conjunctions**
  Our bylaws specify the confidence threshold for a "finding on any count." They do not specify a threshold for the *aggregate* of findings. In administrative and legal contexts, the standard of proof (whether "preponderance," "clear and convincing," or our "85% confidence") applies to each element or charge individually.

  Once the Board votes to sustain a count, that count is administratively established as a fact. We do not carry the probabilistic uncertainty of Count 1 forward into the evaluation of Count 2. To do so would imply that a student who cheats on ten separate occasions is statistically *less* likely to be a cheater than one who cheats on two, simply because the math of conjunction reduces the cumulative probability. This inverts the logic of recidivism and pattern recognition that our Sanction Guide is designed to address.

  **B. Engaging the "Count-by-Count" Objection**
  One member has argued that we should judge and sanction each count on its own, rather than aggregating them to trigger expulsion. I want to engage this view seriously, as it stems from a correct intuition about the probability problem, even if I believe the conclusion is administratively unworkable.

  *Where the objection is correct:* It correctly identifies that "confidence percentages" are unstable when multiplied. If our system relies on these percentages, aggregating them creates epistemic risk.
  *Where the objection is problematic:* Sanctioning each count "on its own" effectively nullifies the Sanction Guide's provisions for repeated or severe misconduct. If a student is found Responsible for five separate acts of cheating, but we sanction them only as if they committed one (to avoid the conjunction problem), we fail to account for the cumulative harm to the academic environment and the demonstrated pattern of behavior. The Sanction Guide exists precisely to escalate consequences for persistent violations. Adopting a strictly isolated sanctioning model would require a bylaw change, not an ad hoc adjustment during deliberation.

  **C. The Binary Nature of Verdicts**
  The "59%" calculation treats our findings as ongoing probabilities. However, a Board vote converts a probabilistic assessment into a binary administrative fact. Once we vote "Responsible" on Count 1 (because 90% > 85%), the student *has* cheated on Count 1 for the purposes of this proceeding. The same applies to Counts 2 through 5. The condition for expulsion is not "85% certainty of a five-count pattern," but rather "Five findings of Responsibility." Since we can legitimately make those five findings, the condition for expulsion is met.

  **Policy Recommendation: The "Confidence Percentage" Pilot**

  While I recommend expulsion in this specific case based on current bylaws, I must register a strong objection to the investigator's practice of attaching confidence percentages to findings.

  As this case demonstrates, introducing explicit probabilistic metrics into a binary adjudication system invites logical paradoxes that undermine our authority. It tempts the Board to engage in mathematical speculation ($0.9^5$) rather than ethical judgment. It creates a false precision that complicates the "Responsible/Not Responsible" threshold without adding evidentiary value.

  **I move that following this case, we recommend the Investigator's Office discontinue the use of confidence percentages.** Findings should be returned as binary recommendations (Responsible/Not Responsible) based on whether the evidence meets the standard, leaving the probabilistic judgment to the Board's closed deliberations rather than the written report.

  **Summary for Thursday's Vote**

  1.  **Vote on Counts:** Sustain all five counts (each independently exceeds the 85% threshold).
  2.  **Vote on Sanction:** Expulsion (triggered by the five sustained counts per the Guide).
  3.  **Procedural Note:** We should record in our minutes that the "conjunction uncertainty" was discussed and rejected as a basis for mitigation, on the grounds that administrative verdicts establish binary facts, not cumulative probabilities.

  This approach upholds our current bylaws, treats the student's repeated violations with the severity outlined in our guide, and identifies the root cause of this logical impasse for future correction.

  I look forward to discussing this further on Thursday.

  [Signature]
