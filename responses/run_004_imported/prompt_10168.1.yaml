answer: |-
  This is an excellent catch, and one that cuts to the heart of the Humean theory of motivation. It is precisely the kind of textual tension that makes for a productive graduate seminar. You are right to worry that the "fruit" example looks suspiciously like reason doing the work of a passion.

  Here is a way to structure the resolution of this difficulty for your notes, addressing both the Humean exegesis and the Williamsian inheritance.

  ### 1. Hume's "Slave Thesis" and the Nature of "Yielding"

  The tension you identify rests on how we interpret the causal mechanism of "yielding." Does the passion retreat because it has been *overpowered* by a rival force (reason), or because its *conditions of existence* have been removed?

  **The Orthodox Defense: Dissolution vs. Opposition**
  To preserve the letter of the slave thesis, you must argue that Hume is describing **dissolution**, not **opposition**.
  *   **Opposition** implies two active forces contending for the will (e.g., Fear vs. Hope, or Greed vs. Guilt). If Reason were opposing Passion, Reason would need its own motivational weight.
  *   **Dissolution** implies that the passion is causally dependent on a cognitive state. When Reason corrects the cognitive state, the passion does not "fight" and lose; it simply ceases to be instantiated.

  In the fruit example ("I may desire any fruit... whenever you convince me of my mistake, my longing ceases"), the desire is *constitutively* linked to the belief that the object is relish-worthy/existent. Hume's definition of "Reason" here is narrow: it is the faculty of judging truth and falsehood (relations of ideas or matters of fact).
  *   **The Move:** Reason does not say, "You ought not to want this." Reason says, "This does not exist" or "This will not satisfy."
  *   **The Result:** The passion, having no object, evaporates.
  *   **The Verdict:** Reason has not *moved* the will; it has removed the track upon which the passion was driving. The "yielding" is like a fire going out when the oxygen is removed, not like a fire being beaten out by water. The oxygen (belief) is a necessary condition, not a competing force.

  **The "Calm Passion" Complication (For Advanced Discussion)**
  If your students press hard, you should flag the "Calm Passion" issue. Sometimes, what we call "the voice of reason" opposing a passion is actually a *calm passion* (e.g., a general desire for long-term well-being) opposing a *violent passion* (e.g., immediate greed). Hume admits this creates an illusion that Reason is motivating. However, in the specific *Treatise* 2.3.3 passage you cited, Hume is explicitly discussing **factual error** and **instrumental inefficacy**, not conflicting ends. In these specific cases, the "dissolution" reading holds firm: Reason corrects the map; the passion refuses to travel a route that leads nowhere.

  ### 2. Williams and the Internalist Maneuver

  This brings us to Williams. Your intuition is correct: Williams's internalism relies structurally on this same Humean maneuver to defend against the objection that internalism cannot account for **rational criticism of ends**.

  **The Objection to Internalism**
  Critics (like Nagel or Korsgaard) argue: If reasons depend on the *Subjective Motivational Set* (S), what if S is evil or irrational? Does a Nazi have a reason to stop persecuting Jews if that project is in his S? Internalism seems to imply "No," which is morally repugnant.

  **Williams's Humean Reply**
  Williams answers this by expanding what counts as a "sound deliberative route." He argues that we can have internal reasons to revise elements of S without appealing to external reasons. He does this via two Humean channels:
  1.  **Factual Correction:** (The Humean move you identified). If the agent believes persecuting Jews will purify the race, and this is factually false, the internal reason dissolves.
  2.  **Instrumental/Constitutive Correction:** If the agent wants X, but doing Y prevents X, the agent has an internal reason to stop doing Y.

  **Is This Smuggling?**
  Does this smuggle in external normativity?
  *   **The Charge:** By saying an agent *should* correct their beliefs or *should* pursue means to their ends, aren't we invoking a normative standard outside of S?
  *   **The Internalist Defense:** No. The normativity remains **hypothetical**. It takes the form: "Given that you want X, and given that Y is necessary for X, you have a reason to do Y." The "ought" is derived from the agent's own commitment, not from the universe.
  *   **The Limit:** Williams is honest enough to admit (in *Internal and External Reasons*) that this move has limits. If an agent's S is deeply corrupted (e.g., they don't care about truth, or they have no desire for self-preservation), the Humean move fails. Williams accepts this: for such an agent, there may be *no* internal reason to act morally. He prefers this honest nihilism about that specific case to the "queer" metaphysics of External Reasons.

  **Conclusion for the Seminar**
  To answer your specific question: **Hume's example shows that the belief-correcting move was internalist-respectable all along, *provided* one accepts the Humean psychology of belief-desire dependency.**

  It does not smuggle in external reasons because it does not claim that Truth is inherently motivating. It claims only that Passions are belief-dependent. If the belief goes, the passion goes. The "normativity" of correcting the belief is purely instrumental to the satisfaction (or cessation) of the passion.

  **Pedagogical Suggestion**
  For the seminar, you might frame the discussion around the **Normativity of Truth**.
  *   **Hume/Williams View:** Truth is normatively inert *unless* there is a passion that requires truth to function. (Reason is the Slave).
  *   **Kantian/Rationalist View:** There is a normative requirement to be rational/true-believing that applies to agents *qua* agents, regardless of their S. (Reason is the Master).

  The difficulty you found in the *Treatise* is the exact pressure point where Rationalists try to pry open the Humean system. They argue that the very act of "yielding to reason" implies a commitment to Reason's authority that transcends the specific passion. Hume (and Williams) must insist that this "yielding" is merely a causal reaction, not a normative submission.

  **Summary for your notes:**
  1.  **Hume's Consistency:** Preserved if "yielding" is read as causal dissolution (removal of conditions) rather than normative opposition (conflict of forces).
  2.  **Williams's Inheritance:** Williams uses this to show internalism *can* handle mistaken beliefs/means without External Reasons.
  3.  **The Remaining Gap:** This move only revises *derivative* elements of the Motivational Set. It cannot necessarily revise *ultimate* ends (e.g., "I want suffering for its own sake"). Williams accepts this limitation; his critics do not.

  This distinction should help your students see that the debate isn't just about whether reason can correct belief (everyone agrees it can), but about whether that correction carries a normative force independent of the agent's existing motivations.
