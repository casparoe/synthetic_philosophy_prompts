answer: |-
  Your friend has put their finger on a very common intuition, often called **pragmatic convergence**. In terms of everyday action—whether you should assert "he is tall," bet on it, or act as if it's true—both theories often advise the same caution. If you are in a borderline case, the epistemicist says, "Don't assert it, because you don't *know* it," and the supervaluationist says, "Don't assert it, because it isn't *true*."

  However, to say the debate is merely a matter of vocabulary is to misunderstand what philosophy of language and logic are trying to do. Philosophers aren't just trying to generate advice on when to speak; they are trying to describe the fundamental structure of reality, meaning, and reasoning.

  On that level, Epistemicism and Supervaluationism are not just wearing different clothes; they are describing different universes. Here is where the substantive stakes lie.

  ### 1. The Law of Bivalence (Logic)
  The most technical but significant difference concerns **bivalence** (the principle that every declarative sentence is either true or false).

  *   **Epistemicism** preserves classical logic entirely. For the epistemicist, the sentence "He is tall" is definitely True or definitely False. The Law of Excluded Middle ($P \lor \neg P$) holds without exception. The "gap" is entirely in our heads (our knowledge), not in the world or language.
  *   **Supervaluationism** explicitly rejects bivalence for borderline cases. For the supervaluationist, "He is tall" is neither true nor false. It creates a truth-value gap.

  **Why this matters:** If your friend is right and the theories are the same, then logic shouldn't care. But logic *does* care. If Supervaluationism is correct, we cannot use certain classical inference rules in borderline contexts without modification. If Epistemicism is correct, classical logic is safe, but we must accept the counterintuitive metaphysical claim that there is a precise nanometer where a man goes from "not tall" to "tall." Choosing between them changes how we formalize reasoning itself.

  ### 2. The Metaphysics of Meaning (Semantics)
  The two theories offer radically different explanations for *why* we hesitate.

  *   **Epistemicism** claims our linguistic practices **do** fix a sharp boundary, even if we can't find it. This implies that meaning is much more precise than we intuitively feel. It suggests there is a "fact of the matter" hidden in the complex web of our usage that we are simply too clumsy to locate.
  *   **Supervaluationism** claims our linguistic practices **fail** to fix a boundary. Meaning is inherently incomplete or "gappy." The world (or at least our description of it) is genuinely fuzzy.

  **Why this matters:** This is an ontological disagreement. One view says sharp boundaries exist (Epistemicism); the other says they do not (Supervaluationism). That is not a verbal dispute; it is a disagreement about the nature of properties and language. It is the difference between saying "The map is missing a line that exists on the territory" vs. "The territory itself has no line there."

  ### 3. Higher-Order Vagueness
  This is often the battleground where the theories are tested most rigorously.
  *   **First-order vagueness:** Where is the boundary between tall and not tall?
  *   **Second-order vagueness:** Where is the boundary between "definitely tall" and "borderline tall"?

  **Epistemicism** handles this easily but brutally: There is a sharp boundary between "definitely tall" and "borderline," we just don't know where it is either.
  **Supervaluationism** struggles here. If vagueness is semantic indecision, surely there is no sharp line between "admissible precisifications" (where he is tall) and "inadmissible ones" (where he is not). But if there is no sharp line between admissible and inadmissible, the theory risks collapse. Supervaluationists have to do complex logical work to explain higher-order vagueness without reintroducing the sharp boundaries they tried to avoid.

  **Why this matters:** If the debate were just vocabulary, both theories would handle higher-order vagueness equally well. They don't. Epistemicism is logically cleaner here; Supervaluationism is more intuitive but logically fragile.

  ### 4. Norms of Assertion
  While the practical advice looks the same ("Don't say he's tall"), the *reason* changes the normative landscape.

  *   **Epistemicist Norm:** You should not assert "He is tall" because you violate the **Knowledge Norm of Assertion**. You are asserting something you do not know. (It might be true, but you're guessing).
  *   **Supervaluationist Norm:** You should not assert "He is tall" because you violate the **Truth Norm of Assertion**. You are asserting something that lacks a truth value. (It is not even the kind of thing that can be known).

  **Why this matters:** Imagine a scenario where you are forced to bet.
  *   The **Epistemicist** says: "There is a 50% chance (or some probability) that it is true. You can bet, but you are ignorant."
  *   The **Supervaluationist** says: "There is no probability because there is no fact to be probable about. Betting is category mistake."
  This leads to different decision theories in borderline contexts.

  ### Summary: Is it just vocabulary?
  Your friend is treating the theories as **instrumental tools** ("Which one helps me navigate conversation?"). Viewed instrumentally, they often converge.

  But philosophers treat them as **descriptive theories** ("Which one accurately describes how language hooks onto the world?"). Viewed descriptively, they are incompatible.
  *   One says bivalence holds; the other says it fails.
  *   One says sharp boundaries exist; the other says they don't.
  *   One says we are ignorant; the other says the meaning is incomplete.

  If you accept your friend's view, you are essentially adopting a position called **Quietism** or **Deflationism** about vagueness—the idea that there is no deep problem to solve, only a confusion to dissolve. While that is a valid philosophical position, it cannot be reached simply by noting that Epistemicism and Supervaluationism look similar in practice. You have to argue that the metaphysical differences don't matter.

  Most philosophers think they *do* matter, because accepting Epistemicism forces you to accept "magic" sharp cutoffs in nature/language, while accepting Supervaluationism forces you to give up classical logic or bivalence. Those are heavy prices to pay, and deciding which price is worth paying is a substantive debate, not a verbal one.

  **The Verdict:** Your friend is right that the *practical output* is similar, but wrong that the *theoretical cost* is the same. The debate is about which theoretical cost (sharp boundaries vs. truth-value gaps) we are willing to bear to explain the phenomenon of vagueness. That is as substantive as philosophy gets.
