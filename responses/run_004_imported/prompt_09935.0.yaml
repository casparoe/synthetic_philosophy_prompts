  {
    "genuinely promising": [
      "comparing limiting densities or averages of value per unit of spacetime volume",
      "a finitely-additive rather than countably-additive value theory",
      "just insisting utility functions be bounded so nothing can diverge to begin with"
    ],
    "workable but seriously flawed": [
      "restricting your evaluation to whatever's in your causal future",
      "switching to hyperreal- or surreal-valued utility so the infinite sums stop being undefined",
      "cancellation principles (compare remainders after matching infinities)"
    ],
    "doesn't really solve the problem": [
      "comparing the cardinalities of the sets of good and bad events directly",
      "discounting value over spatiotemporal distance"
    ],
    "just changes the subject": [
      "lexical or leximin orderings built on some enumeration of people or events",
      "giving up on aggregation entirely in favour of a person-affecting or purely local view"
    ]
  }

  **Genuinely Promising**
  *   **Limiting Densities:** This is the standard academic fix (Vallentyne/Kagan) that allows comparison without summing to infinity, though it struggles with coordinate dependence and Pareto violations.
  *   **Finitely-additive Value Theory:** This provides the necessary mathematical foundation for density views to function, sacrificing countable additivity to avoid paralysis while preserving most aggregative intuition.
  *   **Bounded Utility:** This solves the math cleanly by preventing divergence entirely, though it requires the controversial metaphysical claim that value cannot accumulate indefinitely.

  **Workable but Seriously Flawed**
  *   **Causal Future:** This dissolves paralysis practically but violates the core utilitarian intuition of impartiality by rendering distant suffering morally irrelevant.
  *   **Hyperreal/Surreal Utility:** While mathematically rigorous, it requires arbitrary choices (like ultrafilters) to order infinities, lacking ethical justification for those specific orderings.
  *   **Cancellation Principles:** This helps compare worlds with matching infinities but fails when the infinities are structurally identical, leaving many cases unresolved.

  **Doesn't Really Solve the Problem**
  *   **Cardinalities:** Standard set theory dictates that most infinite sets of events have the same cardinality, making this mathematically useless for distinguishing better or worse worlds.
  *   **Discounting:** This avoids infinite sums but introduces an arbitrary decay rate and violates impartiality by valuing identical events differently based on location.

  **Just Changes the Subject**
  *   **Lexical Orderings:** This forces a decision by imposing an arbitrary enumeration of individuals, completely violating the anonymity requirement central to utilitarianism.
  *   **Person-Affecting View:** This abandons the aggregative framework entirely rather than solving the aggregation problem, effectively switching to a different ethical theory.
