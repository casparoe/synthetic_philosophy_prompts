          *   Ontology: Ontologically innocent. Everything is still just the micro-parts interacting. No new fundamental laws.
          *   Relation to Physicalism: Compatible. It preserves causal closure of the physical.

  3.  **Compare the Accounts:**
      *   *Predictability:* Broad = Impossible even with God's eye view of micro + micro-laws. Bedau = Possible with God's eye view + micro-laws + computation.
      *   *Laws:* Broad = New fundamental laws needed. Bedau = Only micro-laws needed.
      *   *Causation:* Broad = Potential downward causation (macro affects micro in a novel way). Bedau = Macro causation is just micro causation aggregated (no distinct macro-causal powers).

  4.  **Adjudicate the Case: Consciousness:**
