          *   Relation to Physicalism: Tension. If new fundamental laws are needed, is physics complete? Usually seen as incompatible with strict reductionist physicalism.
      *   **Mark Bedau (Weak Emergence):**
          *   Key feature: *Unpredictability in practice (computational irreducibility).*
