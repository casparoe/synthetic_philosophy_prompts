          *   *Refined Decision:* I will argue that neuroscientists are only entitled to claim **Weak Emergence**. Claiming Strong Emergence undermines the physicalist framework neuroscience relies on. While Strong Emergence might be metaphysically true (debatable), it is not what the *science* supports. The science supports complexity and computational irreducibility.

