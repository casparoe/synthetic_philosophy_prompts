      *   **Constraint:** Defend a *definite answer* regarding consciousness (Weak vs. Strong). Do not sit on the fence.
      *   **Audience:** A reporter/writer looking for philosophical grounding. The tone should be authoritative, clear, and analytically rigorous but accessible.

