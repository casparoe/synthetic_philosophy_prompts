      *   *Key Distinction:* Thatcher spoke of "culture" being erased. Dummett speaks of the *political community's capacity to function*.
      *   *Conclusion:* The concept *does* work, but it relies heavily on the good faith of the interpreter. Dummett trusts liberal institutions; restrictionists do not.

