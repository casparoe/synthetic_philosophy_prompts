answer: |-
  This is an exceptionally sharp reading of Dummett. You have put your finger on the precise tension that makes *On Immigration and Refugees* both philosophically interesting and politically vulnerable.

  To answer your core question: **Yes, the concept is doing real philosophical work for Dummett, but it relies entirely on a burden of proof that restrictionists almost never meet.** If Dummett had lived to see Sweden in 2015, it is highly probable he would have argued that even those numbers did not meet his threshold for "submersion," precisely because his definition of submersion is functional and political, not cultural or demographic.

  Here is a breakdown of why Dummett thinks his distinction holds, how it applies to the Sweden case, and where the risk of collapse into Thatcherism lies.

  ### 1. Dummett's "Submersion" as a Theoretical Limit, Not a Policy Tool
  Dummett introduces the "right not to be submerged" not as a justification for current immigration controls, but as a **logical concession**. He is a moral realist; he acknowledges that a state is a political community that requires some continuity to function as a democracy. If the population turns over too quickly, the solidarity required for a welfare state or democratic consensus might fracture.

  However, he explicitly frames this as a **catastrophe clause**.
  *   **Thatcher's "Swamped":** This was an empirical claim about cultural dilution triggered by relatively small numbers of non-white immigrants. It presumed that British culture was fragile and that the presence of "others" inherently degraded it.
  *   **Dummett's "Submersion":** This is a claim about *political capacity*. It asks: "Has the influx become so large and rapid that the host society literally cannot process it without the collapse of its legal, democratic, or welfare structures?"

  For Dummett, the burden of proof is immense. It is not enough to say "schools are crowded" or "housing is tight." You must demonstrate that the *political community itself* is ceasing to exist as a coherent entity.

  ### 2. The Sweden 2015 Counterfactual
  If we apply Dummett's criteria to Sweden in 2015 (approx. 163,000 asylum seekers, ~1.6% of the population):

  **Would Dummett call this submersion?**
  Likely **no**. Here is why:

  *   **Refugees vs. Migrants:** Dummett draws a hard moral line between economic migrants and refugees. He argues the duty to admit refugees is near-absolute (based on the right to life/safety), whereas states have more discretion with economic migrants. Since the 2015 Swedish surge was predominantly asylum seekers fleeing war (Syria, Afghanistan, etc.), Dummett's threshold for excluding them would be even higher than for general migration.
  *   **Functional Continuity:** Did Sweden cease to function as a democracy? Did the welfare state collapse? While there were strains on housing and social services, the Swedish state remained robust, elections proceeded, and social cohesion, while tested, did not dissolve. For Dummett, "submersion" implies the *dissolution* of the host community's ability to integrate newcomers into the social contract. Sweden's subsequent struggles (rise of the Sweden Democrats, policy tightening) might be seen by Dummett as political reactions, not evidence of objective submersion.
  *   **Historical Precedent:** Dummett was aware of historical mass migrations. The US absorbed percentages of immigrants in the late 19th/early 20th century that dwarfed Sweden's 2015 numbers (sometimes exceeding 1% *per year* for decades). If the US didn't "submerge" then, Dummett would likely argue Sweden hadn't reached that limit either.

  Dummett would likely argue that Sweden's situation was a **logistical challenge**, not an existential threat. To conflate the two is to commit the error Thatcher made: mistaking *strain* for *submersion*.

  ### 3. Is the Concept Doing Philosophical Work?
  You ask if the concept collapses back into Thatcher's line once numbers get big enough. This is the critical critique leveled by open-border advocates (like Joseph Carens) against liberal restrictionists.

  **The Argument that it *Does* Work:**
  Dummett uses the concept to inoculate his argument against the charge of utopianism. By admitting a theoretical limit, he makes his broader argument for liberal immigration more robust. He is saying: *"I am not arguing for no borders; I am arguing that the current borders are nowhere near the justified limit."* This allows him to critique specific policies (like the UK's primary purpose rule) without having to defend an absolutist "open borders" position that most states would immediately reject. It grounds the ethics of migration in the reality of the nation-state system.

  **The Argument that it *Collapses*:**
  The vulnerability lies in the **vagueness of the threshold**. Dummett does not give a number. He does not give a specific metric for "social cohesion."
  *   **The Thatcher Risk:** If "submersion" is undefined, any government can claim they are approaching it. If 1% feels like "too much" to the incumbent population, does that count? Dummett would say no (popular prejudice isn't objective submersion), but politically, the distinction blurs.
  *   **Cultural vs. Political:** Dummett tries to keep "submersion" political/functional. But in practice, fears of submersion are almost always cultural. If a philosopher grants a "right not to be submerged," restrictionists will define "submersion" as "loss of cultural hegemony."

  ### 4. Conclusion: The "Good Faith" Requirement
  Dummett's distinction holds up philosophically **only if interpreted in good faith.**

  *   **In Good Faith (Dummett's view):** The right not to be submerged is a lifeboat provision. It is there for a scenario where admitting more people would literally destroy the boat. Since we are rarely, if ever, in that scenario, the right is almost never triggered.
  *   **In Bad Faith (Thatcher's view):** The right not to be submerged is a rhetorical tool to justify exclusion whenever the incumbent population feels uncomfortable.

  If Dummett had seen Sweden in 2015, he would likely have argued that the "submersion" clause was still not triggered, because the Swedish state remained capable of integrating those people had the political will existed. He would argue that the failure was one of **distribution and resources**, not of **capacity and existence**.

  So, to answer your final worry: The concept *does* do real work for him, but it is fragile. It prevents his theory from being dismissed as naive, but it opens a door that restrictionists walk through much more easily than Dummett intended. The difference between Dummett and Thatcher isn't necessarily the *principle* (both acknowledge a limit), but the **evidentiary standard** required to trigger it. Thatcher thought a few thousand people triggered it; Dummett thought it would take a demographic avalanche that threatens the state's survival. Sweden 2015 was a surge, but likely not an avalanche in Dummett's eyes.
