      *   *Philosophical Work:* It serves to acknowledge that states are *associations* with boundaries, not just open spaces. It prevents the "open borders" argument from being dismissed as utopian. It anchors the duty to admit refugees in a reality where states exist.

  6.  **Refining the Argument (Self-Correction/Nuance):**
