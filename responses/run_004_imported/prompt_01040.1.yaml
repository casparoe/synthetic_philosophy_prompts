prompt: |-
  so i've been reading Dummett's On Immigration and Refugees for a chapter on migration ethics, and the bit that's been bugging me is his line about a nation's "right not to be submerged" by immigration. He calls Thatcher's "swamped" comment utterly ridiculous, then turns around and defends basically the same idea in more careful language, insisting the right is "of extremely limited application" and wasnt remotely triggered by anything happening in Britain when he wrote the book. Say he'd lived another decade and watched Sweden take in somewhere around 160,000 asylum seekers in 2015 alone, close to 2% of the population in a single year and by far the highest per capita in the EU. Would his own stated criteria have actually counted that as a genuine case of submersion, or would he have found some principled reason it still doesn't qualify? mostly trying to work out whether the concept is doing real philosophical work for him or whether it just collapses back into Thatcher's line once the numbers get big enough.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Michael Dummett's *On Immigration and Refugees* (2001).
      *   **Specific Issue:** Dummett's distinction between Margaret Thatcher's "swamped" rhetoric (which he rejects) and his own concept of a nation's "right not to be submerged" (which he defends as a limited philosophical principle).
      *   **Hypothetical Scenario:** If Dummett had lived to see the 2015 Swedish migration crisis (approx. 160,000 asylum seekers, ~1.6-2% of population in one year), would his criteria classify this as "submersion"?
      *   **Core Question:** Is Dummett's concept doing real philosophical work, or does it just collapse into Thatcher's nativism when numbers get high?

  2.  **Recall/Research Dummett's Position:**
      *   *Context:* Dummett was a staunch anti-racist and advocate for liberal immigration policies. His book is largely a critique of restrictive UK policies.
      *   *The "Submersion" Argument:* Dummett acknowledges that a political community needs some continuity to function as a democracy. If the demographic/cultural change is *too* rapid, it might undermine the solidarity required for a welfare state or democratic decision-making.
      *   *Distinction from Thatcher:* Thatcher's "swamped" comment (1978) implied an existential cultural threat from relatively small numbers, fueled by racial anxiety. Dummett's "submersion" is a theoretical limit case, intended to be *extremely* high, almost never triggered in practice (especially in the UK context he was writing about).
      *   *Key Criteria:* It's not just about numbers; it's about the *capacity to integrate* and the *speed* of change relative to the host society's ability to absorb without social collapse or loss of democratic cohesion.

  3.  **Evaluate the Swedish 2015 Case against Dummett's Criteria:**
      *   *Numbers:* 160,000 is high for Sweden (pop ~9.7m). ~1.65% in one year.
      *   *Comparison:* Is this "submersion"? In historical terms, mass migrations (e.g., US late 19th century, post-WWII displacements) have seen higher percentages.
      *   *Dummett's Threshold:* Dummett explicitly says the right is of "extremely limited application." He argues that in the UK (and by extension similar Western democracies), the threshold was *not* being met.
      *   *Integration Capacity:* Sweden had a strong welfare state and integration infrastructure (though strained).
      *   *Intent:* Dummett's principle is a "safety valve" for catastrophic scenarios, not a policy tool for managing annual fluctuations.

  4.  **Analyze the Philosophical Integrity (The "Real Work" Question):**
      *   *Charitable Reading:* Dummett is trying to find a middle ground between "open borders" (which he might see as politically impossible or destabilizing) and "closed borders" (which he sees as immoral). He needs a principled limit to make the liberal argument palatable and robust.
      *   *Critical Reading:* Is the line arbitrary? If "submersion" is undefined numerically, couldn't any restrictionist claim "we are near the limit"? This is the "slippery slope" risk.
      *   *Distinction:* Thatcher's claim was empirical nonsense (small numbers = swamping). Dummett's claim is theoretical (infinite numbers = submersion). The difference is in the *evidence required* to trigger the clause.

  5.  **Drafting the Response:**
      *   *Acknowledge the Tension:* Validate the user's suspicion. It *is* a tricky distinction. Many critics (e.g., Carens, Oberman) have wrestled with this.
      *   *Clarify Dummett's Intent:* Emphasize that for Dummett, this was a *concession* to realism, not a core moral right. He wants to defend the *right to migrate*, not the *right to exclude*. The "submersion" right is a defensive exception.
      *   *Apply to Sweden 2015:*
          *   Percentage wise: 1.6% is high but historically not unprecedented for successful integrations.
          *   Dummett's likely view: He would likely look at *social cohesion* and *welfare sustainability*. Sweden didn't collapse. Democracy continued.
          *   Therefore: Probably still not "submersion" in Dummett's sense. Submersion implies the dissolution of the political community, not just strain on services.
      *   *Address the "Collapse" Fear:* Does it collapse into Thatcherism?
          *   *No, if:* The burden of proof is on the state to show existential threat, not just cultural discomfort.
