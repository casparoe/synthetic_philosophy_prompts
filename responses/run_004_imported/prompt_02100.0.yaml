      *   *The "Settled" Aspect:* The friction point is Priya's *confidence* ("flat confidence," "matter were settled"). This is where the user's intuition is strongest. Aesthetic judgments should remain open to revision upon experience.
      *   *Epistemic vs. Phenomenological:* Epistemically, she might be justified (reliable source). Phenomenologically, she is missing the point of art (the experience).

