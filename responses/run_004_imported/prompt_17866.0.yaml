answer: |-
  **Setting:** *A dimly lit faculty lounge, late afternoon. The coffee pot is empty. Elena (Traditionalist) is staring at a whiteboard covered in diagrams of structured propositions. Julian (Act-Theorist) is slumped in an armchair, grading papers.*

  **Elena:** You're quiet today. I thought you'd be gloating. You sent me that draft chapter on Hanks's predicativism. It's elegant, I'll give you that. But I've been staring at this whiteboard for three hours, and I keep coming back to the same hole.

  **Julian:** The regress?

  **Elena:** The regress. Look, I grant you the motivation. The "unity problem" is the scandal of the structured proposition view. If a proposition is just a set containing Socrates and the property of Wisdom, or an ordered pair $\langle S, W \rangle$, you have a list. A list isn't true or false. It just *is*. To make it a claim, you need a copula, a tie, instantiation. But then, as Bradley showed, you need a tie to tie the tie to the terms. Ad infinitum.

  **Julian:** Exactly. That's why the act-based view is the only way forward. We stop treating propositions as static objects waiting to be animated by a mind. The proposition *is* the animation. It's a type of cognitive act. To entertain the proposition that Socrates is wise is to perform an act of predicating wisdom of Socrates. There is no inert list to glue together. The gluing is the act itself.

  **Elena:** But that's where I get stuck, Julian. And my advisor thinks I'm chasing ghosts, but I don't think I am. You say you dissolve the regress. I say you relocate it.

  **Julian:** Relocate it where?

  **Elena:** Upstairs. Into the cognition. You say the proposition is a type of act. Fine. Take a token of that act. When I predicate wisdom of Socrates, am I doing one thing or two? If I'm doing two things—entertaining Socrates and entertaining Wisdom—and then combining them, you're back in the soup. You need a relation to combine the sub-acts. If you say you're doing *one* thing, you need to explain what makes that single act a *predicative* act rather than just a mental burp. What unifies the content of the act?

  **Julian:** Okay, that's the standard objection. But here's the non-question-begging answer. You're assuming the act has parts in the same way a mereological sum has parts. You're thinking of the act as a temporal sequence: first I grab Socrates, then I grab Wisdom, then I smash them together.

  **Elena:** Isn't it?

  **Julian:** No. The sub-acts are abstractions, not temporal components. When I predicate $F$ of $a$, I am not performing two acts of entertainment and a third act of combining. I am performing a single, functionally unified operation. Think of it like throwing a ball. You can analyze the throw into arm movement, wrist snap, and release. But the "throw" isn't the sum of those movements plus a "combining relation." The unity is constitutive of the action type. If you remove the intentional direction toward the object, it's not a sub-act of predication; it's a different act entirely.

  **Elena:** So you're saying the unity is primitive to the act type.

  **Julian:** I'm saying the unity is internal to the performance. The regress gets started because you treat the constituents as independent existents that *could* exist without being combined. Socrates exists without Wisdom. Wisdom exists without Socrates. So how do they meet? But in the act of predication, the "constituents" are only present *as* correlated. I cannot entertain Socrates *in this act* without entertaining him-as-subject. The role is built into the mode of presentation within the act. There's no gap for a regress to crawl into.

  **Elena:** That sounds suspiciously like Frege's unsaturatedness, just psychologized.

  **Julian:** It's Frege without the mysticism. Frege said concepts are unsaturated. I'm saying the *act* is saturated by its own intentionality.

  **Elena:** But is it? Let's press that. You say the act is unified because the agent performs it as a unity. But why does *this* performance count as predicating wisdom of Socrates rather than, say, listing them? What determines the correctness conditions? If the unity is just a feature of my psychological firing pattern, how do you get normativity? How do you get *truth*?

  **Julian:** Because the act type is defined by its conditions of performance. To predicate wisdom of Socrates is to perform an act that is accurate if and only if Socrates is wise. The normativity comes from the nature of the act type, which is socially and cognitively constituted.

  **Elena:** "Constituted." There's the word. Look, Julian, I'm willing to concede that your view avoids the *logical* form of Bradley's Regress. You don't have an infinite chain of relations. But you've purchased that avoidance by positing a brute fact at the level of agency. You're saying, "It's just a brute fact about cognitive agents that we can perform unified predicative acts."

  **Julian:** And you're saying it's a brute fact about reality that properties instantiate objects. What's the difference?

  **Elena:** The difference is explanatory power. If I say states of affairs are non-mereological compounds, I am positing a metaphysical primitive. Yes, it's brute. But it's a brute fact about *truthmakers*. It anchors the proposition in the world. If you anchor the proposition in the *act*, you anchor it in us. Now, when you ask why the act is unified, you say, "Because that's how we cognize." But that just pushes the question back. Why are our cognitive systems capable of this specific kind of unity? Is there a neural binding mechanism? If so, isn't *that* subject to Bradley? If not, you've just replaced metaphysical magic with cognitive magic.

  **Julian:** That's a fair hit. But consider the alternative. You're defending "non-mereological composition." Be honest, Elena. When Armstrong says a state of affairs is a unity that isn't just the sum of its parts, isn't that just a label for "I don't know how this works, but it must"?

  **Elena:** It's an acknowledgment of ontological structure. Not everything is a heap.

  **Julian:** But how do you distinguish the heap from the state of affairs without appealing to a unifier? If you say "unsaturatedness," you're using a metaphor. Concepts aren't literally hungry. If you say "non-mereological composition," you're telling me there's a kind of composition that isn't composition. It feels like you're stopping the regress by fiat. "The regress stops here because I say the complex is primitive."

  **Elena:** I am saying the complex is primitive. But I'm saying it's primitive *out there*. You're saying the unity is primitive *in here*. My worry is that your "in here" is variable. If propositions are act types, and my cognitive architecture differs from yours, do we grasp the same proposition?

  **Julian:** We grasp the same act *type*. Just as we can perform the same speech act even if our vocal cords differ.

  **Elena:** But speech acts rely on conventions. Are you saying propositions are conventional?

  **Julian:** I'm saying they are rooted in the fundamental capacity for representation. Look, Elena, let's be real about the impasse. You think the regress is a metaphysical problem requiring a metaphysical solution (brute unity of objects). I think it's a category mistake arising from reifying contents. The regress only looks vicious if you think propositions are objects. If they're actions, the demand for a "glue" between the agent and the content is like asking for the glue between a dancer and the dance.

  **Elena:** But the dancer and the dance are distinct categories. The proposition is supposed to be the *content* of the dance. If the content is the dance itself, then when no one is dancing, there is no content. Do you really want to say there are no true propositions before cognitive agents existed?

  **Julian:** I'm willing to bite that bullet, or find a way to ground act types in dispositional properties of possible agents. But would you rather bite the bullet of magical, non-mereological glue binding abstract objects eternally?

  **Elena:** *Sighs.* I'd rather have magic glue than lose the objectivity of truth. If the unity depends on the act, then the truth conditions depend on the act's success. But the act's success depends on the world. So you still need the world to unify Socrates and Wisdom. So Bradley's Regress hits your truthmakers even if it doesn't hit your propositions.

  **Julian:** True. But that's a regress about *facts*, not *propositions*. I'm happy to let metaphysicians fight over states of affairs. My job is to save the proposition from being an inert corpse.

  **Elena:** And my job is to ensure the proposition isn't just a ghost in the machine. You've solved the unity problem by making the proposition ephemeral. I've solved it by making it mysterious.

  **Julian:** Ephemeral but intelligible. Mysterious but objective.

  **Elena:** Precisely. So we're back to the wash. You think my brute fact is ontologically costly. I think your brute fact is psychologically opaque. You say the act is primitively unified. I say the state of affairs is primitively unified. We've both stopped the regress by pointing at something and saying "It just is."

  **Julian:** The difference is *what* we're pointing at. You're pointing at a static structure in the abyss. I'm pointing at what we *do*. If the regress is stopped by agency, it's stopped by something we have access to. If it's stopped by metaphysical composition, it's stopped by something we can only posit.

  **Elena:** But access doesn't guarantee validity. Just because I feel my thought as unified doesn't mean it maps onto a unified reality. That's the Idealist trap.

  **Julian:** And just because you posit a unified reality doesn't mean you've explained how we latch onto it. That's the Platonist trap.

  *Silence settles between them. Elena picks up a marker, hovers it over the whiteboard, then puts the cap back on.*

  **Elena:** So. You're not going to concede that the relocated regress is vicious?

  **Julian:** Only if you concede that unsaturatedness is explanatory rather than descriptive.

  **Elena:** I can't do that.

  **Julian:** Then I can't concede the regress relocates. To me, it dissolves.

  **Elena:** And to me, you've just hidden the glue inside the black box of the mind.

  **Julian:** *Stands up.* Same time tomorrow?

  **Elena:** *Smiles faintly.* Same time tomorrow. Bring better coffee.

  *Julian exits. Elena turns back to the whiteboard, erases the ordered pair, and draws a circle around the word "Unity?" She stares at it for a moment, then leaves the question mark.*
