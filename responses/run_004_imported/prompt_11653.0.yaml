prompt: |-
  I'm a software engineer who runs a small interview podcast for listeners who, like me, got into decision theory through debates about whether autonomous agents need transitive preferences to avoid exploitation. Next week's guest is a decision theorist who defends resolute choice against the money-pump argument: her claim is that an agent with intransitive preferences, or preferences violating the independence axiom as in the Allais paradox, can never be pumped for money if she commits at the outset to a plan for the whole trade sequence instead of reconsidering trade by trade. Draft eight to ten interview questions that go beyond a restatement of the view -- I want one on whether moving the rationality requirement from preferences to plans is a substantive fix or just transitivity reimposed one level up, one on how her resolute chooser differs from a 'sophisticated' chooser who avoids the same pump by backward induction rather than commitment, and one on whether the defense survives contact with a real trader who can't bind her future self the way an idealized agent can -- each with a follow-up keyed to her likely answer. End with a question about what finding would convince her that money-pump vulnerability indicts the preferences themselves, not just the disposition.
