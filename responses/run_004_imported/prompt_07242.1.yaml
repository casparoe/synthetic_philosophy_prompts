  so we just read Huckleberry Finn in english class, and now in my philosophy elective we're covering Kant's thing about how an action only has 'moral worth' if you do it from duty and not just because you wanted too or felt like it. but doesn't that mean Huck's decision to help Jim escape has basically zero moral worth, since Huck genuinely believes the whole time that hes committing a sin and feels terrible about it? that seems like a pretty backwards result considering its supposed to be the most morally admirable moment in the whole book, so is Kant's theory just wrong here or am i missing something about what 'moral worth' is actually supposed to mean?
