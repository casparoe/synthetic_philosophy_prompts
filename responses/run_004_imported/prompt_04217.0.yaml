answer: |-
  This is a sophisticated question that cuts to the heart of how to read scholastic texts dialectically. You are right to identify a tension here, and your instinct to look for a harmonization rather than simply charging Aquinas with contradiction is the correct methodological approach for a seminar of this level.

  However, I need to offer a significant caution regarding your proposed thesis. While the "Permission vs. Prudence" framework is clever, it risks mischaracterizing the *kind* of argument Aquinas is making in *De Regimine Principum*, and it relies on a reading of the *Sentences* commentary that is textually precarious.

  Here is an assessment of your proposed argument and recommendations for how to strengthen it.

  ### 1. The Textual Risk: "Praise and Reward"
  You should verify the Latin of *In II Sent., d. 44, q. 2, a. 2* very carefully. The specific phrasing that the tyrannicide "deserves praise and reward" (*meretur laudem et praemium*) is often attributed to Aquinas in secondary literature, but it is highly contested whether those exact words appear in the critical edition of the *Sentences* commentary.

  That specific language is much more characteristic of **John of Salisbury's *Policraticus*** (Book VIII), which Aquinas knew well. Aquinas certainly distinguishes between a *tyrannus ex defectu tituli* (a usurper with no legitimate title) and a *tyrannus ex parte exercitii* (a legitimate ruler who rules badly). In the *Sentences*, he argues that a usurper is essentially a private aggressor and may be repelled by anyone. However, if you build your paper on the claim that Aquinas explicitly promises "reward" for private tyrannicide, your TA or professor may challenge the textual evidence immediately.

  **Recommendation:** Do not hang your argument on the "reward" language. Focus instead on the *licitness* (*licet*) of the act against a usurper.

  ### 2. "Permission vs. Prudence" vs. "Juridical Status"
  Your thesis is that the *Sentences* grants moral permission, while *De Regimine* offers prudential advice. The problem with this is that the language Aquinas uses in *De Regimine* (I.6) is not merely prudential; it is **juridical**.

  In *De Regimine*, Aquinas does not just say killing a tyrant is "dangerous" or "unlikely to succeed" (prudential arguments). He argues that it is a matter of **public authority** (*publica auctoritas*). He frames private tyrannicide as a violation of the ontological order of jurisdiction: a private individual lacks the *power* to judge and execute the head of the body politic.

  If you argue that *De Regimine* is only about prudence, you have to explain away phrases like "private presumption" (*privata praesumptio*). For Aquinas, acting without authority isn't just unwise; it is disordered.

  **A Stronger Framework:**
  Instead of "Permission vs. Prudence," consider arguing that Aquinas maintains a consistent **Juridical Distinction**:
  *   **Case A (The Usurper):** In the *Sentences*, the "tyrant" is one who has seized power by violence (*per violentiam dominium arripiat*). He has no public authority. Therefore, he is effectively a private enemy/aggressor. Killing him is an act of defense, licit for a private citizen.
  *   **Case B (The Legitimate Tyrant):** In *De Regimine*, the "tyrant" is a ruler with a legitimate title who rules badly. He holds public authority. Therefore, only public authority can depose him. Private killing is illicit because it usurps a public function.

  This framing allows you to say Aquinas is consistent without ignoring the emphatic language in *De Regimine*. He isn't saying "Don't do it, it's risky"; he is saying "You *cannot* do it, because you lack the jurisdiction, unless the ruler never had jurisdiction to begin with."

  ### 3. Handling *De Regimine Principum*
  To answer your specific question on how to handle the emphatic language in *De Regimine* without ignoring it: **Concede the point, then limit its scope.**

  You can write something like:
  > "Aquinas's prohibitions in *De Regimine* are indeed emphatic, but they are specifically addressed to the *tyrannus ex parte exercitii*—the ruler who holds legitimate title but abuses it. In this context, Aquinas's rejection of private action is juridical, not merely tactical. However, this does not negate the permission granted in the *Sentences* regarding the *tyrannus ex defectu tituli*. The apparent contradiction dissolves when we recognize that Aquinas is not discussing the same object in both texts."

  This shows you have read *De Regimine* closely (acknowledging the "public authority" argument) but that you are interpreting it within the broader scholastic taxonomy of tyranny.

  ### 4. Re-evaluating Mariana
  This distinction actually helps your understanding of Mariana. Mariana is considered "notorious" and innovative precisely because he **collapsed this distinction**.

  *   **Aquinas:** Usurper = Killable by private citizen. Legitimate Tyrant = Depose by public authority only.
  *   **Mariana:** Even a legitimate tyrant who abuses the common good forfeits his title and becomes a public enemy, thus opening him to private execution.

  If you argue that Aquinas had already "settled" the question in favor of Mariana, you might be underestimating Mariana's innovation. Mariana took the exception (the usurper) and made it the rule (any tyrant). Your paper could be even stronger if you argue that **Aquinas provided the *tools* for Mariana (the concept of the tyrant as a public enemy), but Mariana radicalized them beyond Aquinas's intent.**

  ### Summary of Advice
  1.  **Verify the Quote:** Check the Leonine Edition or a reliable critical translation of *In II Sent.* Ensure Aquinas actually uses the "praise and reward" language. If he doesn't, pivot to the language of "licitness."
  2.  **Shift the Thesis:** Move from "Permission vs. Prudence" to "Usurper vs. Legitimate Ruler." This accounts for the juridical language in *De Regimine* better than the prudence argument does.
  3.  **Don't Dismiss *De Regimine*:** Acknowledge that for legitimate rulers, Aquinas strictly forbids private action. Argue that this restriction is consistent with the *Sentences* once the type of tyranny is defined.
  4.  **Contextualize Mariana:** Use this distinction to show where Mariana actually *does* innovate (by applying the "usurper" logic to legitimate kings), which validates your professor's comment that Mariana saw himself as Thomistic while actually pushing the doctrine into a "more dangerous political climate."

  This approach demonstrates textual fidelity, philosophical precision, and historical nuance, which should make for an excellent response paper.
