answer: |-
  You are absolutely right to flag this; it is one of the most famous cruxes in Maimonidean scholarship (Menachem Kellner builds a significant portion of his *Maimonides on Judaism and the Jewish People* around exactly this tension). It is not modern projection; medieval commentators (like R. Hasdai Crescas and the Abarbanel) already noticed that *Guide* III:32 seems to make the sacrificial cult contingent on historical circumstance, while the *Mishneh Torah* treats it as eternally binding.

  Here are the four most critical implications for your dissertation regarding how this tension interacts with the principle of Torah immutability:

  **1. Anthropological Constancy vs. Historical Contingency**
  The strongest way to dissolve the tension without denying the *Guide* is to argue that Maimonides views the "concession" not as a temporary fix for *ancient* idolaters, but as a permanent necessity for *human* materiality. In *Guide* III:32, Maimonides writes that human nature (*al-tabā'iʿ al-insāniyya*) does not change. Even if the Sabian context disappears, the human need for physical action to bridge the gap to the Intellect remains. Therefore, the *reason* for the commandment shifts from "weaning off idolatry" to "accommodating human psychology," but the *law* remains immutable because the human condition remains unchanged in the Messianic era (which, for Maimonides, is natural, not supernatural). The implication for your chapter is that the 9th Principle protects the *statute* because the *anthropological need* is eternal, even if the *historical catalyst* (Sabianism) was temporary.

  **2. The Distinction between *Sibah* (Cause) and *Takhlit* (End)**
  You can argue that Maimonides distinguishes between the historical cause of a law and its teleological end. Principle 9 (immutability) guarantees that the divine *will* as expressed in the law does not change. However, the *Guide* reveals that the *wisdom* behind the law may have layers. The "weaning off" theory explains the *origin* (why it started this way), but the *Mishneh Torah* codifies the *destination* (that this is the permanent mode of worship for a embodied nation). The tension implies that immutability applies to the *form* of worship, even if the *philosophical justification* evolves from "divine concession" to "divine will." This allows you to argue that for Maimonides, the *ta'am* (reason) can be historical/contingent while the *mitzvah* (commandment) is ontological/permanent.

  **3. Esoteric Stratification and the "Noble Lie"**
  If you lean into the esoteric reading (following Ravitzky or Halbertal), the tension itself is the point. The *Mishneh Torah* is for the masses (and the Messianic king), who require concrete ritual to maintain social order and religious focus. The *Guide* is for the intellectual elite, who understand that the ultimate ideal is pure contemplation. The implication here is that the 9th Principle is a political-theological necessity for the community, while the *Guide*'s evolutionary theory is the philosophical truth for the individual. In this reading, the "tension" is a pedagogical device: Maimonides cannot publicly teach that sacrifices are obsolete (that undermines the Law), but he whispers to the perplexed that they are a lower rung on the ladder. This puts pressure on the immutability principle by suggesting it is a necessary public doctrine rather than a metaphysical absolute.

  **4. Messianic Era vs. The World to Come (*Olam Ha-Ba*)**
  Maimonides is unique in strictly separating the Days of the Messiah (political restoration, Torah remains in force) from the World to Come (purely spiritual, no bodies). *Hilchot Melachim* refers to the Messianic Era, where nature and human nature persist; thus, sacrifices return. The *Guide*'s language about prayer/contemplation replacing sacrifice may refer to the *Olam Ha-Ba* or to the individual philosopher's ascent, not the national cult. The implication for your dissertation is that the "withering away" of sacrifice is *individual* and *eschatological* (post-resurrection/spiritual), whereas the *Mishneh Torah* refers to *national* and *historical* redemption. This preserves the 9th Principle by limiting the scope of the "concession" theory to the ultimate spiritual end, not the halakhic future.

  **Summary for your argument:**
  The tension doesn't necessarily break the immutability principle, but it forces a redefinition of it. It suggests that for Maimonides, the Torah is immutable not because its reasons are static, but because God's assessment of human capacity is constant. The "concession" is not a temporary patch that gets removed; it is a permanent accommodation to human finitude that remains in force as long as humans have bodies. If you argue this, you align the *Guide* and *Mishneh Torah* by grounding the permanence of sacrifice in the permanence of human psychology, rather than the permanence of Sabian idolatry.
