  ok so this semester i'm grading discussion section quizzes for our intro Philosophy of Language course (im just an undergrad grader, they don't pay us enough for this lol) and i'm ALSO taking the Frege/Russell seminar this term which is a bit funny timing. i've got one quiz answer on Russell's theory of descriptions that i want a second opinion on before i hand grades back tomorrow, since i wanna be able to defend the grade if the student comes to office hours arguing about it.

