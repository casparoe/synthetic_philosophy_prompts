      *   *Check:* Is the verdict clear? Yes, bold it.
      *   *Nuance:* Make sure to distinguish between *factive* luminosity (knowing) and *non-factive* luminosity (seeming). Williamson targets both, but the intuitive pull is stronger for non-factive. KK is factive. This makes KK *more* vulnerable than phenomenal luminosity.
      *   *Refinement on "Worse Shape":* Why is KK worse? Because you can be a phenomenal internalist (luminosity holds for pain) but an epistemic externalist (KK fails). You can't really be an epistemic internalist (KK holds) while denying phenomenal luminosity easily. So the set of people who accept KK is a subset of those who accept some form of luminosity. Therefore, KK is more embattled.

