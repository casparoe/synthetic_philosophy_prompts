      *   *Decision:* KK is in worse shape. Why? Because Luminosity can be retreated to a narrower domain (phenomenal experience) where it remains plausible. KK cannot easily retreat without ceasing to be KK. Also, the externalist attack on KK is more direct and less technical than Williamson's margin-for-error sorites.

