  **(Self-Correction Note):** Make sure not to argue that supertasks are *impossible*. The prompt asks to argue they deserve the *same verdict* (underdetermination), not necessarily impossibility. Stick to Benacerraf's line: logical consistency is fine, determinacy is the issue.

