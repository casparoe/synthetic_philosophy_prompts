      *   *Check:* Is the connection to Benacerraf strong enough? I need to make sure I use his "underdetermination" concept for the Vase too.
      *   *Refinement:* Emphasize that ball numbers are *external* properties, whereas on/off is an *internal* state. If the vase is opaque, does the removal rule matter? This highlights the arbitrariness.

