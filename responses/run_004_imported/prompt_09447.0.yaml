      *   *Core Claim:* Hard choices are not due to ignorance (not knowing the facts) or equality (options being exactly equal in value).
      *   *Small-Improvement Argument:* If $A$ and $B$ were exactly equal, then $A+$ (A slightly improved) would be better than $B$. In hard choices, $A+$ is *not* clearly better than $B$. Therefore, $A$ and $B$ were not equal.
      *   *The Fourth Relation:* Since $A$ is not better than $B$, $B$ is not better than $A$, and they are not equal, there must be a fourth relation: "on a par."
      *   *Nature of "On a Par":* It implies comparability (unlike incomparability) but without a precise ranking. It allows for agency/will to play a role in creating reasons.
      *   *Incommensurability vs. Incomparability:* Chang distinguishes these. She often argues against the idea that hard choices are due to *incomparability* (no common measure). She argues they are *comparable* via the "on a par" relation. This is a subtle but crucial distinction. She references Berlin, but her specific move is to say they *are* comparable, just not via the trichotomy (better/worse/equal).
