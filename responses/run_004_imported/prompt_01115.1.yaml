prompt: |-
  so apparently Bernard Williams has an essay on Cosi fan tutte (it's in On Opera, I think it's called something like "Passion and Cynicism") where his basic claim is that Mozart's music is way too emotionally sincere for Da Ponte's cynical little fidelity-test plot to survive intact -- like the music just won't let Don Alfonso's thesis (that the women, and really everyone, are interchangeable and fidelity's basically a fiction) go unchallenged. Can you write me a dialogue, set at the interval of a performance, between a philosopher and a music critic? The philosopher thinks the music is genuinely doing philosophical work and undercuts the cynicism of the plot (and connects this to Williams's broader suspicion of ethical theorizing that flattens out what's actually going on with particular people), the critic thinks that's reading way too much into it and Mozart just writes gorgeous music regardless of what's happening dramatically. I want real back-and-forth where they actually engage each other's arguments -- neither one should be a pushover.
