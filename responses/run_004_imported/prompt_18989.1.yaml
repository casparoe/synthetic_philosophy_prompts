      *   *Substantive Contact?* Yes, but primarily as a *negation*. Neurath's ISOTYPE is a practical implementation of a physicalist language that explicitly rejects the Tractarian "unsayable."
      *   *The "Showing" Question:* Does ISOTYPE have an ineffable remainder?
