      *   **Neurath's View:** ISOTYPE (International System of TYpographic Picture Education). Literal visual pictograms for statistics/social facts. Anti-mystical. Physicalism. Coherence theory of truth. Boat metaphor (rebuilding at sea, no ladder).
      *   **Core Question:** Is the terminological overlap coincidental, or is there a substantive point of contact?
      *   **Specific Focus:** Does Neurath's ISOTYPE rely on something like "showing but not saying" (ineffable remainder), or is it designed to avoid it (fully paraphrasable into physicalist sentences)?

  2.  **Initial Assessment & Historical Context:**
