  10. (Mental Check): Did I address the "substantive point of contact"? Yes, the contact is the shared problem of representation, but the solutions are diametrically opposed. Neurath secularizes the "picture."

  11. *Final thought:* Make sure to mention that Neurath viewed the *Tractatus* as potentially dangerous due to its mystical tail, which motivated his rigorous physicalism.

