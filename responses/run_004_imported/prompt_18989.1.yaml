      *   *The "Ladder" vs. "Boat":* This is the crucial contrast. Wittgenstein abandons the theory once it does its work. Neurath keeps rebuilding the theory because there is no foundation to step off onto.

  6.  **Drafting the Comparison (Iterative Process):**

