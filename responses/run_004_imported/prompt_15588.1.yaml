          *   Incompleteness (undefined preference) vs. Indifference (equal preference).
          *   Money Pump (sequence of trades).
          *   Completing preferences (scalarization).

      *(Self-Correction during drafting)*: I need to be careful not to misrepresent Thornley. Thornley's paper "Shutdownable Agents via Timestep Dominance" argues that if an agent's preferences are incomplete between shutdown and non-shutdown, and it satisfies TD, it won't manipulate the button. The friend's objection is the standard "Incomplete preferences are unstable" objection. The defense is that TD *enforces* the stability by making the pump trades dominated.

      *Structure of the response:*
      1.  Validate the friend's point (it's a standard objection).
