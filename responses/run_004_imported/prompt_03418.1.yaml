          2.  Define the Goal (Reductionism, Relation R).
          3.  Analyze the Standard Case (why it's insufficient).
          4.  Analyze the Branch-Line Case (the logical trap for Identity).
          5.  The "Only X and Y" Principle (the external factor problem).
          6.  Synthesis: How this supports "Identity isn't what matters."
          7.  Relevance to CogSci (Self-models).
      *   *Key Distinction:* Make sure to distinguish between "Survival" (what matters) and "Identity" (logical relation). Parfit argues they come apart.

  6.  **Refining the Logic (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Identity *definitely* fails in Branch-Line without explaining *why*. It fails because of the transitivity of identity + simultaneity. Earth-Parfit and Mars-Parfit coexist. They are numerically distinct. Therefore, Earth-Parfit cannot be *identical* to Mars-Parfit.
      *   *Emphasis:* The Earth-Parfit *knows* he will die. Does he fear death? Parfit says no, not fully, because Mars-Parfit continues his life. But if Identity is required for survival, he *should* fear death completely.
      *   *Fission Link:* Branch-Line is essentially "Fission where one branch dies immediately." It imports the logical problem of fission into the teletransporter intuition pump.

  7.  **Final Polish:** Check against the user's specific questions.
