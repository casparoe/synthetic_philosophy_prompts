  Here is the intuition, the mechanism, and a toy example you can use to explain this to your readers.

  ### The Core Difference: Margins vs. Aspirations

  To understand the violation, you have to see what the two solutions are actually "looking at."

  *   **Nash (NBS)** is a **marginalist**. It maximizes the *product* of gains ($u_A \times u_B$). Geometrically, it finds the point where a hyperbola is tangent to the feasible frontier. It cares deeply about the **local slope** (the trade-off rate) at the solution point.
  *   **Kalai-Smorodinsky (KS)** is a **proportionalist**. It ignores the local slope. It draws a straight line from the disagreement point (0,0) to the "Ideal Point" (the maximum possible utility for each player). It cares only about the **corners** of the feasible set.

  ### The Mechanism: How Nash Violates Monotonicity

  The monotonicity violation happens because Nash responds to changes in **bargaining leverage**, not just changes in **potential**.

  When you expand the feasible set for Player A (increasing A's maximum possible utility) while keeping Player B's maximum constant, you are effectively making Player A's utility "cheaper" to produce in the middle of the frontier.

  In the Nash calculus, this flattens the local trade-off rate. To maintain the tangency condition (where the slope of the frontier equals the ratio of utilities $-u_B/u_A$), the solution must slide to a point where $u_A$ is higher and $u_B$ is lower. Even though B's *ceiling* hasn't dropped, the *path* to get there has become less favorable for B, and Nash penalizes B for A's increased leverage.

  ### The Toy Example

  Let's construct a scenario where B's best-case outcome stays exactly the same, but B ends up with less.

  **The Setup:**
  *   Disagreement point: $(0,0)$.
  *   **Scenario 1 (Original):** The feasible frontier is a straight line connecting **$(0, 10)$** and **$(10, 0)$**.
      *   Max A = 10, Max B = 10.
      *   **Nash Solution:** Maximize $u_A \cdot u_B$ subject to $u_A + u_B = 10$.
      *   Result: **$(5, 5)$**. Player B gets 5.

  **Scenario 2 (Expanded for A):**
  We expand the set to give Player A more potential, but we introduce a "kink" that changes the trade-off rate.
  *   New Frontier: A piecewise line connecting **$(0, 10)$** to **$(4, 6)$** to **$(20, 0)$**.
      *   Max A is now **20** (Sweetened for A).
      *   Max B is still **10** (Unchanged for B).
      *   *Crucially:* The original solution $(5,5)$ is still feasible (it lies inside this new shape), so B *could* still get 5.

  **The Nash Calculation:**
  Nash looks for the tangency point.
  1.  **Segment 1** $(0,10)$ to $(4,6)$: The slope is $-1$. The Nash solution on this line would be $(5,5)$. But this segment ends at $u_A=4$. So the solution cannot be here.
  2.  **Segment 2** $(4,6)$ to $(20,0)$: The slope is flatter ($-0.375$). The equation is $u_B = 7.5 - 0.375u_A$.
      *   Nash maximizes $u_A(7.5 - 0.375u_A)$.
      *   This yields **$u_A = 10$** and **$u_B = 3.75$**.

  **The Result:**
  *   Player A's potential went up (10 $\to$ 20).
  *   Player B's potential stayed flat (10 $\to$ 10).
  *   **Player B's payoff went down (5 $\to$ 3.75).**

  **The "Aha" for your readers:**
  Nash punished Player B because Player A gained *leverage*. By extending the frontier to 20, the "price" of A's utility dropped in the middle region. Nash's product-maximization logic sees this and trades away B's utility to capture the larger total product available further down the curve. B's ceiling didn't move, but the *gradient* did, and Nash is sensitive to gradients.

  ### How Kalai-Smorodinsky Dodges the Bullet

  Kalai-Smorodinsky (KS) doesn't look at the gradient. It looks at the **Ideal Point**.

  *   **In Scenario 1:** The Ideal Point is $(10, 10)$. KS draws a line from $(0,0)$ to $(10,10)$. It hits the frontier at **$(5, 5)$**.
  *   **In Scenario 2:** The Ideal Point is $(20, 10)$. KS draws a line from $(0,0)$ to $(20,10)$.
      *   Because KS is locked onto the corners (the maximums), it maintains the *ratio* of claims.
      *   Since B's maximum claim (10) did not shrink, KS ensures B's share of the "ideal box" doesn't shrink proportionally.
      *   In many standard expansions (like a simple linear stretch), KS would keep B at 5. Even in complex kinks, KS is mathematically proven to satisfy **Individual Monotonicity**: if B's maximum doesn't drop, B's solution cannot drop.

  **The Intuition:**
  Think of Nash as a negotiator who asks, *"Where is the trade-off most efficient right now?"* If you give A more options, the efficiency shifts to A's favor, hurting B.

  Think of Kalai-Smorodinsky as a negotiator who asks, *"What is the most we could possibly get, and let's split the distance proportionally."* If B's "most possible" doesn't change, KS won't arbitrarily reduce B's share just because A's dreams got bigger. It anchors the deal to the **aspirations**, not the **margins**.
