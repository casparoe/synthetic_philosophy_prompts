prompt: |-
  I sit on the incident review board at work -- we're a mid-size e-commerce company. We had a nasty one during a flash sale: checkout was down for about 40 minutes, and it turned out two unrelated things were happening at once -- the platform team had pushed a config change to the db connection pool that would've exhausted it under that day's traffic all by itself, and separately, a retry bug in a feature team's client library was hammering that same pool hard enough to exhaust it on its own too. We replayed that day's traffic in staging with each change reverted one at a time and confirmed either alone would've taken checkout down. Our postmortem template's root-cause test is basically 'would this still have happened if X hadn't occured,' and honestly the answer's yes for both -- so neither team clears the bar for root cause under our own policy, which matters because whoever's tagged owns the fix items and eats the error-budget hit for the quarter. Now both teams are pointing at this to say they're in the clear since 'it would've happened regardless of us,' and the board's split down the middle: half think that's a fair reading of our own rules, half think it's obviously letting two teams who both actually contributed off the hook on a technicality. A couple of us floated asking whether each factor was actually doing something at the time instead of whether it was strictly necessary, but couldn't turn that into a rule anyone trusted. Draft the memo the board should send recommending how we handle root-cause attribution in cases like this going forward -- I want something we could actually apply next time, not 'use your best judgement,' and it needs to take the 'it wasn't actually necessary so it's unfair to blame us' argument seriously instead of just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Mid-size e-commerce company, Incident Review Board (IRB).
      *   **Incident:** Checkout down for 40 mins during a flash sale.
      *   **Cause:** Two independent factors (DB config change + Retry bug), *each* sufficient to cause the outage on its own (overdetermined causality).
      *   **Current Policy:** Root-cause test is counterfactual ("Would this have happened if X hadn't occurred?").
      *   **Problem:** Under current policy, *neither* team is at fault because the outage would have happened anyway without them. This leads to a blame game, split board, and no one owning fixes/error budget hits.
      *   **Goal:** Draft a memo recommending a new policy/approach for root-cause attribution in overdetermined scenarios.
      *   **Constraints:**
          *   Must be actionable (not "use best judgment").
          *   Must address the "it wasn't necessary so it's unfair" argument seriously.
          *   Needs to resolve the split board opinion.
          *   Tone: Professional, constructive, systemic-focused (blameless but accountable).

  2.  **Deconstruct the Core Issue:**
      *   The current policy relies on *necessary causation* (But-for test).
      *   The incident involves *sufficient causation* (Each factor was enough on its own).
      *   In logic/legal terms, this is "overdetermination."
      *   If we stick to "necessary," no one owns it. This is bad for reliability engineering (SRE) because fixes won't get prioritized.
      *   If we just say "both are guilty," it feels punitive and ignores the logical validity of their defense.
      *   The solution needs to shift from "Who broke it?" to "Who introduced risk that materialized?"

  3.  **Develop the Policy Recommendation:**
      *   *Acknowledgment:* Admit the current "But-For" test fails in overdetermined scenarios.
      *   *New Standard:* Shift from "Necessary Cause" to "Substantial Factor" or "Risk Materialization."
      *   *Attribution Logic:* If multiple factors are independently sufficient, *all* sufficient factors are attributed as root causes.
      *   *Error Budget/Ownership:* This is the tricky part. If both are root causes, do both eat the budget hit?
          *   *Option A:* Split the hit. (Fair, but complex).
          *   *Option B:* Both own their specific fix items, but the "outage count" is shared. (Better for SRE).
          *   *Option C:* Focus on "Contributing Cause" vs. "Root Cause." (Semantics).
          *   *Selected Approach:* Define "Root Cause" as any factor that was sufficient to cause the incident *in the context of the system state*. Both teams own remediation for their specific vector. Error budget impact should be shared or categorized as a "Systemic Incident" rather than pinning it all on one team to avoid the zero-sum game.
      *   *Addressing the "Unfairness" Argument:* The argument is "I didn't change the outcome." The counter-argument is "You introduced a fatal flaw that *would* have changed the outcome on a different day/condition, and it happened to align with another flaw today." The risk was real, regardless of the other factor.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (updating attribution policy based on recent incident). Acknowledge the specific incident without re-litigating the blame.
      *   **The Problem:** Explain *why* the current "But-For" test failed. Use the term "Overdetermined Causality" (sounds professional/technical). Explain that strict necessity leads to accountability gaps.
      *   **The Proposal (The New Rule):**
          1.  **Sufficiency Test:** If a factor *could* have caused the incident alone, it is a Root Cause, even if another factor also could have.
          2.  **Shared Attribution:** Multiple root causes are allowed.
          3.  **Remediation:** Each team owns the fix for *their* specific vulnerability.
          4.  **Error Budget:** This needs nuance. Suggest a "Shared Impact" model. If two teams cause an outage, the outage counts against reliability, but the "blame" (budget hit) is split or capped to prevent defensive engineering. *Self-Correction:* Actually, for a memo like this, it's better to say the *incident* is attributed to both, and budget impact is assessed based on the severity of the specific failure mode, often resulting in a split or a "Systemic" tag that doesn't punish one team disproportionately. Let's go with "Shared Accountability."
      *   **Addressing the Fairness Concern:** Explicitly tackle the "It would have happened anyway" argument. Explain that safety engineering is about removing *hazards*, not just being the *sole* trigger. Introducing a sufficient hazard is a failure of safety standards, regardless of background noise.
      *   **Implementation:** How to apply this next time.
      *   **Closing:** Call to action (vote/approve).

  5.  **Refining the Tone:**
      *   Avoid "Blame." Use "Accountability" and "Ownership."
      *   Ensure it sounds like an engineering leadership decision, not HR punishment.
      *   Make sure the "But-For" limitation is clearly explained so the teams feel heard (their logic was sound, the tool was wrong).

  6.  **Review against Constraints:**
      *   *Actionable?* Yes, provides a specific test (Sufficiency vs. Necessity).
      *   *Addresses "Unfairness"?* Yes, dedicated section on why sufficiency matters.
      *   *Not "Best Judgment"?* Yes, establishes a rule.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, one nuance:* If both teams eat the full error budget hit, that punishes the company twice (reliability math gets weird). If they split it, they might argue about percentages.
      *   *Better approach:* The *Incident* counts against the org's SLO. The *Action Items* are assigned to specific teams. The "Error Budget Hit" for the *quarter* is usually an org metric, but sometimes team-specific. If team-specific, splitting the "demerit" is fairest. Let's recommend that in overdetermined cases, the incident is tagged to all sufficient causes, and budget impact is distributed equally among them to avoid the "race to the bottom."
      *   *Actually, keep it simpler:* Focus on the *attribution* of the cause. Let the budget follow the attribution. If there are two root causes, there are two owners. The budget impact is a secondary policy, but the memo should recommend that "Ownership of Fix" is the primary outcome, not just "Who gets punished."
      *   *Decision:* I will recommend that *both* are Root Causes, *both* own their fixes, and the Error Budget impact is shared (e.g., 0.5x each) to reflect that neither was the sole driver, acknowledging their "it would have happened anyway" point partially while maintaining accountability.

  8.  **Finalizing the Text:** (Drafting the content based on the above thoughts). *Ensure the distinction between "Necessary" and "Sufficient" is clear.* *Ensure the "Swiss Cheese Model" is referenced implicitly or explicitly.*

      *(Self-Correction on "Error Budget"):* In many SRE cultures, error budgets are team-specific. If I take a 0.5x hit, does that help? Yes. It acknowledges the overdetermination. I will include this specific mechanism.

      *(Refining the "Fairness" argument):* The teams argue "My action didn't change the outcome." The counter is "Your action created a state where the system was fragile. We measure safety by the presence of hazards, not just the uniqueness of the trigger."

      *Let's write it.*
answer: |-
  **TO:** Incident Review Board, Engineering Leadership, SRE Team
  **FROM:** Incident Review Board Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Update: Root Cause Attribution in Overdetermined Incidents

  ### Executive Summary

  Following the review of the [Date] Checkout Outage, the Incident Review Board (IRB) has identified a limitation in our current Root Cause Analysis (RCA) policy. Our existing "But-For" test (asking *would this have happened if X hadn't occurred?*) failed to accurately attribute responsibility in a scenario where multiple independent factors were each sufficient to cause the incident.

  This memo proposes an update to our attribution policy to handle **Overdetermined Causality**. This change ensures that all sufficient risk factors are addressed without relying on arbitrary distinctions, while fairly addressing team concerns regarding accountability in complex failure modes.

  ### The Problem: The Limitation of "Necessary Causation"

  Our current policy relies on **necessary causation**. A factor is only a root cause if the incident *could not* have happened without it.

  In the recent checkout incident, we observed **overdetermined causality**:
  1.  **Factor A (Config Change):** Sufficient to cause outage alone.
  2.  **Factor B (Retry Bug):** Sufficient to cause outage alone.

  Under the current policy, both Factor A and Factor B fail the "But-For" test because the incident would have occurred even if only one existed. This creates an **Accountability Gap**: if no single factor is necessary, no team owns the remediation, and the error budget impact goes unassigned. This incentivizes teams to look for coincidental factors to dilute responsibility rather than hardening their own systems.

  ### Proposed Policy: The "Substantial Factor" Standard

  Effective immediately, the IRB will adopt the **Substantial Factor Standard** for root cause attribution.

  **1. The Sufficiency Test**
  A change or defect is considered a Root Cause if it was **sufficient** to cause the incident under the observed conditions, regardless of whether other sufficient factors were present.
  *   *Old Rule:* "Would the incident have happened without this?" (Necessity)
  *   *New Rule:* "Could this have caused the incident on its own?" (Sufficiency)

  **2. Multiple Root Causes**
  We explicitly acknowledge that an incident can have more than one Root Cause. In overdetermined scenarios, **all sufficient factors are designated as Root Causes.**

  **3. Remediation Ownership**
  Each team associated with a Root Cause owns the remediation items specific to their vector.
  *   *Platform Team:* Owns fixing the connection pool config validation.
  *   *Feature Team:* Owns fixing the client library retry logic.
  *   *Rationale:* Even if the other factor hadn't existed, your factor was still a critical vulnerability that required fixing. The existence of another hazard does not neutralize the risk you introduced.

  ### Addressing Fairness and Error Budget Impact

  We recognize the argument that "It is unfair to penalize a team if the outcome would have been the same without them." This concern is valid regarding *outcome*, but not regarding *risk introduction*.

  However, to reflect the reality that no single team was the sole driver of the outage, we will adjust how Error Budget impacts are calculated in overdetermined cases.

  **1. Shared Impact Model**
  When multiple teams are assigned Root Cause status due to overdetermination:
  *   The incident is recorded against the Organization's overall SLO.
  *   The Error Budget "demerit" for the quarter is **split equally** among the responsible teams.
  *   *Example:* If a Severity-1 incident normally costs 1.0 budget points, two responsible teams would each be assessed 0.5 points.

  **2. Rationale**
  This approach balances two principles:
  *   **Safety:** You are accountable for introducing a sufficient hazard (addressing the "Accountability Gap").
  *   **Fairness:** You are not solely liable for the total impact when your action was not the unique trigger (addressing the "It would have happened anyway" argument).

  ### Implementation Guide for the Board

  When reviewing future incidents, the Board should follow this decision tree:

  1.  **Identify all contributing factors.**
  2.  **Test for Sufficiency:** For each factor, ask: *"In the system state at that time, was this factor alone capable of triggering the severity observed?"*
  3.  **Attribution:**
      *   If **One** factor is sufficient: Standard Root Cause attribution.
      *   If **Multiple** factors are sufficient: All are Root Causes. Apply Shared Impact Model.
      *   If **None** are sufficient alone (only in combination): All are Contributing Causes. Combine to form a single Root Cause chain.
  4.  **Action Items:** Assign fixes to the owners of each sufficient factor. Do not merge action items; each vulnerability must be closed independently.

  ### Conclusion

  This policy shift moves us from a legalistic search for a "sole culprit" to an engineering-focused search for "systemic hazards." It acknowledges that in complex distributed systems, failures are rarely linear. By attributing all sufficient causes, we ensure that every vulnerability introduced is remediated, preventing future incidents where only one of these factors might be present.

  **Recommendation:**
  The Board is asked to vote on adopting this **Substantial Factor Standard** for all incident reviews moving forward.

  ***

  **Approved By:**
  [Name], VP Engineering
  [Name], Head of SRE
  [Name], IRB Chair
