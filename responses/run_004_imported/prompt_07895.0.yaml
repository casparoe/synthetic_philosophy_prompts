prompt: |-
  I sit on the neuroethics advisory committee for a university hospital's functional neurosurgery program. Next month we have to circulate a written recommendation on a protocol that has split the committee more than anything else we've reviewed this year: a trial of deep brain stimulation for treatment-resistant depression and anhedonia that departs from our existing DBS protocols in one key respect. Rather than having the clinical team set and adjust stimulation parameters on a fixed schedule, the device would give patients a handheld trigger to deliver brief pulses to reward circuitry -- the target is the medial forebrain bundle -- whenever they judge they need it, on the model of a patient-controlled analgesia pump. The investigators are candid about the precedents this raises -- Heath's mid-century work on septal self-stimulation in psychiatric patients, and the older animal literature on self-stimulation of reward pathways going back to Olds and Milner -- but argue that a hard daily cap on pulses and mandatory weekly clinical review make this trial nothing like those cases.

  Several committee members aren't reassured. One of our neuroscientists points out that self-stimulation of dopaminergic reward circuitry, on Kent Berridge's incentive-salience account, is better understood as driving "wanting" than "liking": a patient could become motivationally captured by the trigger even if the stimulation delivers little hedonic benefit and no improvement in the depression the trial exists to treat. Other members regard this as just the "wireheading" worry familiar from discussions of reward tampering in AI systems and from Nozick's experience machine -- the fear that letting a subject obtain a reward signal directly, rather than through whatever process that signal is supposed to track, produces a benefit that doesn't fully count -- and they don't think a philosophical worry of that kind should override the autonomy of a competent adult who has exhausted standard treatments for genuinely disabling depression.

  Please draft the written opinion I'll circulate before the vote. It should recommend a concrete course of action -- approval, rejection, or approval with specific modifications to the protocol -- argued in enough detail that the investigators would know exactly what to change if the answer isn't a flat yes. And it should take the reward-tampering worry and the autonomy and suffering considerations equally seriously, rather than treating either side as an obvious mistake.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Neuroethics Advisory Committee at a university hospital.
      *   **Task:** Draft a written recommendation/opinion for circulation before a vote on a specific DBS protocol.
      *   **Subject:** A trial of Deep Brain Stimulation (DBS) for treatment-resistant depression (TRD) and anhedonia.
      *   **Key Innovation:** Patient-controlled stimulation (PCS) of the medial forebrain bundle (MFB), similar to a PCA pump, rather than clinician-set continuous stimulation.
      *   **The Conflict:**
          *   *Pro:* Autonomy of competent adults with disabling depression, potential relief from suffering, safeguards (daily cap, weekly review).
          *   *Con:* Neuroscientific risk (Berridge's "wanting" vs. "liking," motivational capture/addiction), Philosophical risk ("wireheading," Nozick's Experience Machine, validity of the benefit).
          *   *Historical Context:* Heath's septal stimulation, Olds & Milner's animal self-stimulation.
      *   **Requirements:**
          *   Recommend a concrete course of action (Approve, Reject, or Approve with Modifications).
          *   Argue in detail (investigators must know what to change if not a flat yes).
          *   Balance the ethical concerns (reward-tampering vs. autonomy/suffering) without dismissing either.
          *   Tone: Professional, nuanced, ethically rigorous, actionable.

  2.  **Determine the Recommendation:**
      *   *Flat Rejection:* Too paternalistic? Ignores the severity of TRD and the potential innovation. The safeguards (caps, reviews) address some risks.
      *   *Flat Approval:* Ignores the serious neuroscientific risk of "motivational capture" (addiction without pleasure) and the philosophical concern about the *quality* of the recovery.
      *   *Approval with Modifications:* This is the most responsible path. It acknowledges the potential benefit while mitigating the specific risks identified by the committee. It allows the trial to proceed but tightens the guardrails around the "self-stimulation" aspect.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard committee memo format.
      *   **Executive Summary:** State the recommendation clearly (Conditional Approval).
      *   **Introduction:** Acknowledge the gravity of the condition (TRD) and the novelty of the protocol. Validate the investigators' intent.
      *   **Ethical Analysis - The Autonomy/Suffering Axis:** Acknowledge the argument for patient control. TRD patients often feel helpless; agency is therapeutic. Standard DBS is passive; this is active.
      *   **Ethical Analysis - The Reward-Tampering Axis:** Address the Berridge ("wanting" vs. "liking") and Nozick ("wireheading") concerns. This is the crux. If the device creates a compulsion rather than curing depression, it's harmful.
      *   **Synthesis/Resolution:** How to balance these? The current safeguards (daily cap, weekly review) are necessary but insufficient. We need *data* on the nature of the urge and the quality of the mood improvement.
      *   **Specific Modifications (The "Meat"):**
          1.  *Run-in Period:* A phase where stimulation is clinician-controlled to establish a baseline of "liking" vs. "wanting."
          2.  *Ecological Momentary Assessment (EMA):* Patients must log *why* they pressed the button and how they felt *after*. Distinguish relief from compulsion.
          3.  *Independent Safety Monitor:* Someone to watch for signs of compulsive use independent of the treating team.
          4.  *Exit Strategy:* Clear criteria for removing the device if "wanting" outpaces "liking."
      *   **Conclusion:** Reiterate the commitment to both innovation and safety.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Did I dismiss the "wireheading" worry? *Correction:* Ensure I explicitly state that while philosophical purity shouldn't block treatment, the *neuroscientific* manifestation of wireheading (compulsion) is a clinical safety issue, not just a philosophical one.
      *   *Check:* Did I respect patient autonomy? *Correction:* Frame the modifications not as taking control away, but as ensuring the control is *meaningful* and not hijacked by the circuitry.
      *   *Check:* Is the tone appropriate? *Correction:* Needs to be collegial but firm. Use terms like "Conditional Approval" or "Approval Pending Modifications."
      *   *Check:* Historical references? *Correction:* Briefly acknowledge Heath/Olds & Milner to show we've listened, but distinguish the current proposal via the safeguards.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Title:* Needs to be formal. "Neuroethics Advisory Committee: Recommendation regarding Protocol [X]."
      *   *Opening:* Acknowledge the split. It shows I understand the room.
      *   *The "Wanting/Liking" distinction:* This is crucial. I need to explain *why* this matters clinically. If they press the button because they *need* it (compulsion) vs. because it *helps* (therapy), that's the difference.
      *   *The Modifications:* Make them actionable. "Weekly review" is already in the protocol. What's new? *Real-time logging.* *Blinded assessment.* *Specific psychometric tools.*

  6.  **Final Polish:**
      *   Ensure the distinction between "philosophical worry" and "clinical risk" is clear. The committee shouldn't ban things because they feel philosophically icky (Nozick), but they must ban things that cause harm (Berridge's incentive salience hijacking).
      *   Make sure the recommendation is a "Conditional Approval."

  7.  **Final Review against constraints:**
      *   Concrete course of action? Yes (Conditional Approval).
      *   Detail for investigators? Yes (Specific protocol modifications).
      *   Balance worries? Yes (Autonomy vs. Reward Tampering).
      *   Tone? Professional/Ethical.

  *(Self-Correction during drafting)*: I initially thought about suggesting a limit on the *number* of pulses lower than the investigators proposed. But the prompt says there's already a "hard daily cap." I should focus instead on *monitoring the use* of those pulses. The risk isn't just the volume, it's the *motivation*. So the modifications should focus on data collection regarding motivation.

  *(Refining the "Wireheading" point)*: I need to be careful not to sound like I'm endorsing Nozick's view that the experience is "fake." Instead, frame it as: "If the stimulation bypasses the cognitive processing of reward, does it restore agency or undermine it?" This bridges the philosophical and clinical.

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Functional Neurosurgery Program Investigational Team; Neuroethics Advisory Committee
  **FROM:** [Your Name/Title], Neuroethics Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Protocol [ID Number]: Patient-Controlled MFB Stimulation for TRD

  **I. Executive Summary**

  After reviewing the proposed protocol for patient-controlled deep brain stimulation (PC-DBS) targeting the medial forebrain bundle (MFB) in treatment-resistant depression (TRD), and following extensive deliberation regarding the divergent ethical concerns raised within the Committee, I recommend **Conditional Approval**.

  This recommendation is not a flat endorsement of the current draft, nor is it a rejection of the innovation. Rather, it is an approval contingent upon the implementation of specific modifications designed to mitigate the risk of "motivational capture" while preserving the therapeutic agency the protocol seeks to empower. The current safeguards (daily pulse caps and weekly reviews) are necessary but insufficient to address the specific neuroethical risks identified by the Committee. The modifications outlined in Section IV are required prior to IRB submission.

  **II. Context and Ethical Stakes**

  We are united in our assessment of the clinical necessity. For patients with severe, chronic anhedonia and TRD who have exhausted pharmacological and psychotherapeutic options, the status quo is ethically untenable. The principle of respect for autonomy supports offering novel interventions to competent adults facing disabling suffering. The investigators' proposal to shift from clinician-controlled to patient-controlled stimulation aligns with a broader movement in medicine toward participatory care (analogous to patient-controlled analgesia). It acknowledges that patients are the best judges of their immediate affective states.

  However, the Committee is equally united in the view that DBS of the MFB is not analogous to PCA for pain. Pain is a nociceptive signal; the MFB is a substrate of motivation and reward. This distinction necessitates a deeper ethical scrutiny.

  **III. Analysis of Competing Concerns**

  The Committee's division centers on two weighty considerations, neither of which can be dismissed as merely theoretical.

  *1. The Autonomy and Suffering Consideration*
  Proponents on the Committee argue that philosophical objections regarding the "purity" of reward (the "wireheading" or Nozickian "Experience Machine" worry) should not override the relief of genuine suffering. If a patient judges that the stimulation improves their quality of life, restricting their access to it based on a philosophical preference for "natural" reward processing is paternalistic. In the context of TRD, where agency is already eroded by the disease, restoring a sense of control over one's neurochemistry may be intrinsically therapeutic.

  *2. The Reward-Tampering and Incentive Salience Consideration*
  Opponents on the Committee, drawing on Berridge's distinction between "liking" (hedonic impact) and "wanting" (incentive salience), raise a clinical safety concern that transcends philosophy. If the PC-DBS protocol dissociates "wanting" from "liking," the device risks becoming a source of compulsion rather than relief. A patient might feel an overwhelming drive to stimulate ("wanting") even if the stimulation no longer alleviates depression or produces pleasure ("liking").

  This is not merely a philosophical worry about "fake" happiness. It is a concrete risk of iatrogenic addiction. The historical precedents cited by the investigators (Heath, Olds & Milner) are indeed distinct due to the lack of modern safeguards, but they serve as a proof-of-concept that direct reward pathway stimulation can hijack motivational hierarchies. If the device creates a compulsion that overrides other life-sustaining behaviors, it violates the principle of non-maleficence, regardless of the patient's initial consent.

  **IV. Required Protocol Modifications**

  To balance the imperative to treat suffering against the risk of motivational hijacking, the Committee requires the following modifications to the protocol. These are designed to generate data that distinguishes therapeutic use from compulsive use.

  **1. Implementation of Ecological Momentary Assessment (EMA)**
  The current protocol relies on weekly retrospective reviews. This is insufficient to detect the divergence of "wanting" and "liking."
  *   **Requirement:** The handheld controller must be integrated with a digital logging system. Every time the trigger is pressed, the patient must complete a brief (30-second) prompt on a paired device.
  *   **Data Points:** They must record: (a) Pre-stimulation mood/urge intensity (0-10); (b) Primary motivation (e.g., "to relieve sadness," "to feel energy," "uncontrollable urge"); and (c) Post-stimulation satisfaction (0-10) 15 minutes after delivery.
  *   **Rationale:** This allows the clinical team to identify if pulse usage is correlating with therapeutic relief or if it is decoupling from mood improvement (a sign of incentive salience hijacking).

  **2. The "Washout" Verification Phase**
  *   **Requirement:** The protocol must include a scheduled, blinded "washout" period (e.g., 48 hours) at the 3-month and 6-month marks, where the device is active but stimulation is withheld without the patient's knowledge (unless safety thresholds are breached).
  *   **Rationale:** This is critical to distinguish physiological dependence from psychological reliance. If a patient exhibits severe withdrawal or decompensation specifically during the withholding of stimulation, it suggests the device has become a physiological crutch rather than a restorative tool.

  **3. Independent Safety Monitor**
  *   **Requirement:** An independent clinician, not part of the primary investigative team, must review the EMA data bi-weekly.
  *   **Rationale:** The treating team may develop a therapeutic alliance bias, interpreting high usage as "patient engagement." An independent monitor is needed to identify patterns of compulsive use objectively.

  **4. Revised Exit Criteria**
  *   **Requirement:** The protocol must define specific criteria for device deactivation beyond standard adverse events. Specifically, if the ratio of "urge intensity" to "post-stimulation satisfaction" exceeds a predetermined threshold (e.g., high urge, low satisfaction) for five consecutive days, the device must be locked, and a mandatory clinical reassessment triggered.
  *   **Rationale:** This operationalizes the Berridge concern. It ensures that "wanting" without "liking" is treated as an adverse event, not a treatment choice.

  **V. Conclusion**

  The Committee recognizes that these modifications increase the burden on the investigators and the participants. However, they are necessary to ensure that the "autonomy" we are protecting is genuine autonomy, and not the illusion of choice created by a hijacked reward system.

  We are not rejecting the possibility that direct modulation of reward circuitry is the future of treating anhedonia. But we must ensure that in our haste to alleviate suffering, we do not replace the prison of depression with the prison of compulsion. By approving this protocol with the above modifications, we allow the science to proceed while maintaining the ethical guardrails required when intervening directly in the machinery of human motivation.

  I look forward to discussing these specifics at next week's session.

  **[Signature]**

  **Member, Neuroethics Advisory Committee**
