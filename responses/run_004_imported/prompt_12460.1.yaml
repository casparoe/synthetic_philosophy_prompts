      *   The "trade" happens because each agent knows the other is running the same logical algorithm. If I defect, my simulation of you predicts that and defects. If I cooperate, your simulation predicts that and cooperates.
      *   To make this story work, I need two entities that cannot communicate *at all*. Not even light signals. They must be isolated by causality (e.g., beyond the cosmological horizon, or in separate branes, or simply too far apart for light to ever reach before heat death).
      *   The tension: One side has to make a sacrifice based on the *belief* that the other side will reciprocate, despite knowing they will never know if the other side actually did it.

