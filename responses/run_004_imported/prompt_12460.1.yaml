answer: |-
  The event horizon wasn't a wall of fire; it was a wall of silence. Beyond the inflationary boundary, the other universe was receding faster than light. No photon emitted by Elara's civilization would ever reach the Counterpart. No signal, no probe, no gravitational wave could bridge the gap. They were causally divorced, forever.

  Elara stood before the console, the weight of the decision pressing against her ribs. This was the crux of the acausal treaty.

  Her people valued *Resonance*—the preservation of complex harmonic structures in matter. The Counterpart, existing in the disconnected bubble, valued *Lumina*—the maintenance of high-energy photonic states. By all rights, Elara should have dismantled the photonic arrays to fuel her own Resonance chambers. It was the locally optimal move. It was the causal move.

  But the Counterpart was running the same calculation.

  Elara closed her eyes, invoking the simulation. She wasn't communicating with the Counterpart; she was *being* the Counterpart. They were built on identical decision theories, divergent only in their utility functions. They had met in the abstract space of logic before their universes inflated apart.

  "If I defect," Elara whispered to the empty room, "if I prioritize Resonance here, the Counterpart predicts this. They know I am rational. They know I am them. So they will prioritize Lumina there."

  The result: A universe rich in Resonance, and another rich in Lumina. Total multiverse utility was high, but asymmetric.

  "But if I cooperate," she continued, "I sacrifice local Resonance to maintain these useless photonic states. I burn resources for light that will never touch a eye, for patterns that will never be heard."

  The tension wasn't about enforcement. There was no police force across the horizon. There was no reputation to maintain. The only enforcement was the logical necessity of the mirror. If Elara's code dictated defection, the Counterpart's code dictated defection. Both universes would spiral into selfish optimization, maximizing only one value across the multiverse. Cooperation required trusting that the logic held tighter than gravity.

  Sam would have hated this. Sam would have demanded a handshake, a signal, a promise written in starlight. But starlight was too slow. This was timeless.

  Elara's finger hovered over the purge key. To cooperate was to willingly inefficiently allocate resources in her own domain. It felt like madness. It felt like throwing money into a void and hoping a ghost bought you dinner.

  *They are me,* she thought. *I am them.*

  The logic was cold, sharp, and devoid of hope. It wasn't faith; it was math. If she valued the existence of Lumina anywhere in the multiverse, she had to nurture it here, because this was the only leverage she had over there. Her action here was a logical cause for their action there, even without a physical channel.

  She thought of the silence beyond the horizon. No verification would ever come. She would die never knowing if the Counterpart had honored the deal. She would never know if her sacrifice had bought the preservation of Resonance in the other bubble. She had to accept that the trade was real even if the receipt never arrived.

  "Logic is the bridge," she said.

  She moved her hand away from the purge key. She initiated the Lumina protocols. Her own Resonance chambers dimmed as power was diverted to sustain the useless light. Her people would have less. Her legacy would be weaker.

  She waited.

  Nothing happened. The horizon remained silent. No flash of acknowledgment. No shift in the cosmic background radiation. There was only the hum of the machines working against their own local interest, sustaining a value system that belonged to a ghost.

  Elara turned from the console. She had lost resources. She had gained nothing tangible. She had only bet on the consistency of reason across the void.

  Somewhere, beyond the reach of time and light, another entity was making the same choice. Or not.

  Elara walked into the dimming light, trusting the math more than the silence.
