answer: |-
  **The Hollow Foundation: Assessing Harsanyi's Aggregation Theorem**

  John Harsanyi's 1955 aggregation theorem stands as one of the most ambitious projects in modern moral philosophy. It attempts to bridge the is-ought gap by deriving a substantive ethical conclusion—utilitarianism—from thin, formal premises of rational choice. The argument is elegant: if individuals and society both satisfy the von Neumann-Morgenstern (vNM) axioms of rationality under uncertainty, and if society respects the Pareto indifference principle, then social welfare must be a weighted sum of individual utilities. For Harsanyi, this suggested that Bayesian rationality plus a minimal respect for individual preferences logically commits us to utilitarianism. However, the theorem's claim to provide a genuine *foundation* for utilitarianism is overstated. While the theorem is mathematically valid, it fails as a free-standing moral derivation because it relies on hidden ethical assumptions to solve the problem of interpersonal comparability and excludes morally relevant information regarding procedural fairness. The theorem does not prove utilitarianism is true; rather, it proves that utilitarianism is the only coherent way to aggregate preferences *if* one accepts specific, contentious ethical constraints that the theorem itself cannot justify.

  The first and most persistent objection concerns the measurement and comparability of utility, a critique championed by Amartya Sen. In the vNM framework, an individual's utility function is unique only up to a positive affine transformation ($U' = aU + b$, where $a > 0$). This means the zero point and the unit of measurement are arbitrary for each individual. One person's "util" might reflect a different intensity of preference or risk attitude than another's. When Harsanyi sums these utilities to determine social welfare ($W = \sum a_i U_i$), the resulting social ordering depends entirely on the weighting coefficients $a_i$. If these weights are not fixed by the theorem, the derivation is incomplete.

  Harsanyi attempted to close this gap with his "impartial observer" argument, suggesting we should normalize utilities by imagining ourselves having an equal probability of being any person in society. However, as Sen argues, this smuggles in the very ethical assumption the theorem purports to derive. The vNM utility scale measures an individual's attitude toward *risk*, not the moral urgency of their claims. A risk-seeking individual might have a stretched utility scale compared to a risk-averse one, but this does not imply the risk-seeker's gains should count for more in the social calculus. To fix the units across persons requires an assumption of interpersonal comparability of welfare levels or units. This is not a decision-theoretic fact; it is a substantive ethical claim. Without an independent justification for why one person's unit of utility should weigh equally with another's (or why they should be weighted differently), the theorem remains ethically inert. It demonstrates that *if* utilities are comparable, *then* utilitarianism follows. It does not demonstrate *that* they are comparable. Thus, the theorem shifts the burden of justification rather than eliminating it.

  The second objection, articulated by Peter Diamond, attacks the theorem's reliance on the Pareto principle and the exclusion of non-welfarist values. Diamond's critique focuses on the distribution of chances. Consider an indivisible good and two individuals who value it equally. Society can give the good to Person A, give it to Person B, or flip a fair coin. If the individuals are risk-neutral, the expected utility of the coin flip (0.5 for each) equals the expected utility of a random assignment without a fair procedure. Harsanyi's theorem, adhering to Pareto indifference over lotteries, implies society should be indifferent between a fair coin flip and an arbitrary assignment, provided the expected utilities are identical.

  Diamond argues this is counterintuitive: the fair coin flip has procedural value that the arbitrary assignment lacks. The diagnosis of this failure is best understood as a clash between *ex-ante* and *ex-post* standards of fairness, rooted in the theorem's commitment to welfarism. Harsanyi's theorem aggregates *ex-ante* expected utilities. If individuals do not intrinsically value "fairness" in their preference ordering (i.e., if they are purely self-interested regarding the outcome), the theorem forbids society from valuing fairness. This reveals that the theorem treats individual preferences as the sole source of moral value. If the individuals are indifferent to the procedure, society must be too.

  However, one might argue that if individuals *did* value fairness, the theorem would accommodate Diamond. But this misses the point. Diamond's claim is normative: society *ought* to value the fair procedure even if the beneficiaries are indifferent, because fairness is a moral constraint on aggregation, not merely another preference to be summed. The theorem fails here because it conflates "satisfying preferences" with "treating people fairly." By reducing social choice to the satisfaction of vNM preferences, the theorem excludes deontological constraints or egalitarian concerns regarding the distribution of opportunities. It forces a choice: either admit that fairness matters independently of welfare (violating the welfarist premise of the theorem) or accept that fairness is irrelevant (violating moral intuition). Consequently, the theorem does not ground utilitarianism; it presupposes a welfarist framework that is itself vulnerable to the Diamond critique.

  These two objections converge on a single verdict: Harsanyi's theorem provides a rigorous *structural* defense of utilitarianism but fails to provide a *normative* foundation. The theorem successfully demonstrates that utilitarianism is the unique aggregation rule compatible with vNM rationality and Pareto indifference. However, this is a conditional victory. The premises required to make the theorem work—specifically, that interpersonal comparisons are meaningful and that all moral value is captured by individual preference satisfaction over outcomes—are themselves ethical claims that require justification outside of decision theory.

  The comparability objection shows that the theorem cannot generate moral weights from thin air; it requires an ethical input to normalize the scales. The Diamond objection shows that the theorem's definition of "rationality" and "Pareto efficiency" is too narrow to capture the full scope of moral reasoning, specifically regarding procedural justice. Therefore, Harsanyi has not derived utilitarianism from purely decision-theoretic premises. He has instead shown that utilitarianism is the internal logic of a specific, ethically loaded model of social choice.

  In conclusion, Harsanyi's theorem should be viewed not as a proof of utilitarianism, but as a clarity test. It clarifies that to be a utilitarian is to commit to interpersonal comparability of utility and to reject procedural fairness as an independent moral value. While this is a significant contribution to meta-ethics, it does not vindicate utilitarianism for those who do not already share those commitments. The theorem is valid, but it is ethically incomplete. It tells us what utilitarianism *is* in the language of rational choice, but it cannot tell us why we *ought* to speak that language. A genuine foundation for utilitarianism requires moral philosophy, not just mathematics.
