      *   **Where Frequentism Struggles (The "Why Philosophers Care" part):**
          *   *Single Case:* What is the probability the *next* collision produces a Higgs? Frequentism says "limit of infinite trials." Bayesian says "my current expectation."
          *   *Hypothesis Testing:* "What is the probability the Standard Model is true?" Frequentism says "undefined" (models aren't random variables). Bayesianism says "assign a probability." This is crucial for theory choice.
      *   **The "Borrowed Math" Point:** Acknowledge the math is the same (Kolmogorov axioms). But the *interpretation* changes the application. It's not decoration; it's a different mapping.
      *   **Conclusion:** Summarize. It's not that one is right and the other wrong; they answer different questions. Physicists need frequentism for *data analysis*, but might need Bayesianism for *theory assessment*.

