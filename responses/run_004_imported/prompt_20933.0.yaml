answer: |-
  This is a classic and deeply frustrating philosophical puzzle, and your intuition at the dinner table was sharper than your friend's. The *tu quoque* ("you also") move is formally a logical fallacy because the truth of a proposition ("Corruption is wrong") is logically independent of the speaker's behavior. However, ethics is not just about propositions; it is about relationships, authority, and social practices.

  Your friend and you were effectively debating the difference between **moral truth** and **moral standing**. To give you that second opinion, let's unpack the two accounts you mentioned. While both R. Jay Wallace and G. A. Cohen are concerned with the ethics of blame, they locate the "injury" of hypocrisy in different places.

  ### 1. The Two Accounts

  **R. Jay Wallace: The Second-Personal Standing Account**
  For Wallace, blame is not merely a judgment that someone has done wrong; it is a *communicative act*. It is a demand for accountability addressed from one person to another.
  *   **The Core Mechanism:** This act presupposes a relationship of moral equality. To blame someone is to say, "We are both subject to this norm, and I have the authority to hold you to it."
  *   **The Problem with Hypocrisy:** When a hypocrite blames, they implicitly claim an exemption for themselves. They say, "This norm binds you, but I am above it." This violates the condition of moral equality required for the transaction of blame to be legitimate.
  *   **The Verdict:** The hypocrite lacks *standing*. The blame is not "false" (the target did do wrong), but the *act of blaming* is morally inappropriate. It is an infelicitous speech act, like a judge presiding over a trial in which they are the victim.

  **G. A. Cohen: The Message/Messenger Distinction**
  Cohen (particularly in his work on political condemnation) is often read as emphasizing the objectivity of moral principles over the subjective purity of the advocate.
  *   **The Core Mechanism:** Moral truths exist independently of who speaks them. If an action is wrong, it is wrong regardless of who points it out.
  *   **The Problem with Hypocrisy:** Hypocrisy is a vice of the *messenger*, not the *message*. It undermines the hypocrite's credibility, integrity, and political legitimacy, but it does not erase the moral fact they are pointing to.
  *   **The Verdict:** The blame remains *true* and *valid* as a moral assessment. The hypocrite may be odious, and we may dislike listening to them, but they have not forfeited the *truth* of their claim. In some political contexts, Cohen acknowledges a loss of *authority*, but he resists the idea that hypocrisy renders the criticism itself void.

  ### 2. Where They Agree and Part Ways

  **Agreement:**
  1.  **The Target is Still Wrong:** Both agree that the corrupt public figure's targets are still guilty of corruption. Hypocrisy does not cleanse the world of the original sin.
  2.  **Hypocrisy is Bad:** Both agree the hypocrite is morally flawed. Neither view suggests hypocrisy is permissible.

  **Divergence:**
  1.  **Nature of the Defect:**
      *   **Wallace:** The defect is in the *relationship*. The blame is an *injury* to the blamed because it asserts a false hierarchy.
      *   **Cohen:** The defect is in the *reputation*. The blame is an *inconvenience* to the listener because it comes from an untrustworthy source.
  2.  **The "Right" to Blame:**
      *   **Wallace:** The hypocrite *loses the right* to address the blame. To voice it is to commit a further moral wrong (the wrong of domineering).
      *   **Cohen:** The hypocrite retains the right to speak the truth, though they may lose the *persuasive power* or *political legitimacy* to enforce it.
  3.  **Truth vs. Appropriateness:**
      *   **Wallace:** Blame can be *true* (the norm was violated) but *illegitimate* (the blamer has no standing).
      *   **Cohen:** Blame is primarily about the *truth* of the accusation; the messenger's status is secondary.

  ### 3. Which Account is More Defensible?

  I find **R. Jay Wallace's account** more defensible, particularly for the scenario you described at dinner.

  Here is why: Blame is not just a weather report ("It is raining corruption"); it is a demand ("You must stop this"). When your friend argues that the hypocrite forfeits the *right* to criticize, they are intuitively grasping at Wallace's insight: that moral criticism is a social practice that requires clean hands to administer.

  **Applying Wallace to your Dinner Example:**
  Imagine the anti-corruption campaigner (let's call him Senator Smith). Smith takes bribes but publicly condemns Representative Jones for taking bribes.
  *   **Cohen's View:** Smith is a liar, but he is right that Jones is corrupt. We should still investigate Jones.
  *   **Wallace's View:** When Smith condemns Jones, he is not just stating a fact; he is invoking a moral community to punish Jones. By doing so while secretly exempting himself, Smith is treating Jones as a subordinate subject to rules Smith ignores. This is a form of moral domination.

  Wallace is superior here because it explains *why* we feel such visceral outrage at the hypocrite. If Cohen were entirely right, we would just shrug and say, "Well, Smith is a jerk, but he's right about Jones." But we don't do that. We feel that Smith's accusation is *tainted*. We feel that Jones is being *wronged* by Smith's accusation, even if Jones is guilty. Wallace captures this relational injury: Smith has no *authority* to call Jones to account because Smith has abdicated the very norm he invokes.

  Therefore, your intuition was correct: Hypocrisy affects **standing**, not **truth**. But your friend was also partially right: Losing standing *does* mean forfeiting the **right to voice the blame**. Wallace bridges this gap: The blame is true, but voicing it is impermissible.

  ### 4. A Case Where They Issue Different Verdicts

  To see where these accounts truly split, consider a case of **"Repentant Hypocrisy."**

  **The Scenario:**
  A former drug lord (Person A) has renounced his life of crime, entered witness protection, and now campaigns against drug trafficking. He publicly condemns a current drug lord (Person B). However, Person A has not fully disgorged his illicit wealth; he is still benefiting from the very system he condemns, even if he is no longer actively participating.

  *   **Cohen's Verdict:** Person A has standing to condemn Person B. The message ("Drug trafficking is wrong") is true. Person A's past (and lingering benefits) make him a messy messenger, but the moral urgency of stopping Person B outweighs A's impurity. The *tu quoque* against A is weak because A is trying to improve the situation.
  *   **Wallace's Verdict:** Person A likely *lacks* standing. As long as A benefits from the norms he is violating (by keeping the money), he is not standing as an equal under the norm. He is asking B to submit to a sacrifice A has not fully made. For Wallace, A's blame is morally inappropriate until A fully aligns himself with the norm (e.g., by donating the money).

  **Was your friend's *Tu Quoque* warranted?**
  *   **Under Cohen:** No. Your friend was committing a fallacy. The campaigner's corruption does not make the criticism of others false.
  *   **Under Wallace:** Yes, but with a caveat. Your friend was right that the campaigner forfeited the *right* to criticize (standing), but wrong if they implied the corruption didn't happen or didn't matter.

  **Conclusion:**
  Your friend's *tu quoque* was a blunt instrument. They used it to dismiss the *truth* of the accusation, which is incorrect. However, you were slightly too generous to the hypocrite by suggesting it was merely an "unflattering thing to notice."

  Wallace helps us see that hypocrisy is not just a character flaw; it is a **procedural injustice**. When the campaigner condemns others while taking bribes, he is not just being inconsistent; he is abusing the moral practice of blame itself. He is using a norm as a weapon against others while holding it as a shield for himself.

  So, tell your friend this: They were right that the hypocrite has no *right* to speak (Wallace), but you were right that the hypocrite's actions don't make the *accusations false* (Cohen/Logic). The hypocrite is silenced not because they are wrong, but because they have lost the moral authority to demand accountability from anyone else.
