      *   *Nuance:* Descartes distinguishes between *sentiment* (sensation/passion) and *pensée* (thought/reason). He admits animals have sensations (fear, hunger) but denies they have a rational soul. The "beast-machine" label is often exaggerated to mean they feel no pain, but Descartes mostly meant they lack *conscious rational thought*.

