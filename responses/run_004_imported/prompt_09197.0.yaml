answer: |-
  Descartes is visiting a friend who owns a particularly vocal magpie. The friend is trying to prove the bird has a soul.

  "Look," says the friend. "I say 'Hello,' he says 'Hello.' I say 'Who's a pretty boy,' he says 'Pretty boy.' He understands me."

  Descartes shakes his head. "He does not understand. He is merely a machine of feathers and heat. Watch."

  Descartes turns to the bird. "Magpie, where is the seed I just hid?"

  The magpie fluffs its wings and squawks, "Pretty boy!"

  "You see?" says Descartes. "He cannot arrange signs to declare a thought about something absent. He only utters sounds triggered by something present."

  "But he screams when I pinch him!" the friend argues. "Doesn't that prove he feels?"

  "He feels the passion," Descartes concedes. "He feels the fear and the pain, I grant you that. His nerves transmit the motion. But watch the difference."

  Descartes calls over the friend's three-year-old nephew, who is widely considered a bit slow. Descartes hides a cookie, then asks the nephew where it went. The nephew frowns, struggles, and says, "Gone."

  "There," says Descartes. "The child is duller than the bird in every way. But the child arranged a sign to declare a thought about an absence. The bird merely reacted to a presence. The magpie feels the pinch, my friend. But he lacks the syntax to tell you it was *unjust*."
