  2.  **Key Philosophical Points to Include:**
      *   **Gödel's First Incompleteness Theorem:** For any consistent formal system $F$ capable of arithmetic, there's a sentence $G(F)$ true but unprovable in $F$.
      *   **Lucas's Original Argument:** Humans can see $G(F)$ is true, machines (bound by $F$) cannot. Therefore, humans aren't machines.
      *   **The Consistency Problem:** To see $G(F)$ is true, we must know $F$ is consistent. Gödel's Second Theorem says $F$ can't prove its own consistency.
      *   **Penrose's Shift (Shadows of the Mind):** Move from consistency to *soundness* (only proving true things). Penrose argues we *know* our own reasoning is sound in a way a formal system cannot know itself.
      *   **Computationalist Counter 1 (Source of Soundness):** How do we know we're sound? We make mistakes. If we claim "idealized" soundness, how do we access it?
      *   **Computationalist Counter 2 (The Moving Target):** A machine isn't stuck with one $F$. It can operate in $F + G(F)$, then $F + G(F) + G(F+G(F))$, etc. (Progressive transfinite recursion). Humans do the same (reflective equilibrium).
      *   **Computationalist Counter 3 (Surveyability):** We don't know the exact algorithm of the brain. If the anti-mechanist claims "There exists *some* F I cannot out-Gödel," the burden shifts.

