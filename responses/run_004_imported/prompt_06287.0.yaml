answer: |-
  **Title:** Joints, Not Atoms: A Case for Causal Structural Realism in Mechanistic Interpretability

  **To:** The Mechanistic Interpretability Team
  **From:** [Your Name]
  **Subject:** Position Statement on the Ontology of Features

  ### Introduction: The Roommate and the Bridge

  We spend our days identifying features. We say, "This direction encodes the Golden Gate Bridge," or "This neuron fires for sycophancy." We treat these findings as discoveries, akin to a biologist identifying a new cell type. But there is a shadow hanging over this work, articulated best by my roommate, a theorist who argues that we are committing a category error.

  His argument is simple: Neural networks are just high-dimensional matrix multiplications. Any activation vector can be decomposed into infinite bases. When we use Sparse Autoencoders (SAEs) to find features, we are imposing a structure from the outside. Saying a model "represents" the Golden Gate Bridge is like saying a thermostat "believes" the temperature is 70 degrees. It is a convenient shorthand (the Intentional Stance), not an ontological truth. If we change the dictionary size of our SAE, the "Golden Gate" feature splits or merges. If the feature changes based on our tools, how can it be real?

  For this talk, I am not going to offer the standard diplomatic retreat into "more research is needed." That is a dodge. We need to know if we are mapping territory or drawing maps.

  My verdict is this: **The skeptic is right about atoms, but wrong about structure.** We should adopt a position of **Causal Structural Realism**. Features are not Platonic atoms waiting to be found, but they are *real causal bottlenecks* in the computation. They are real in the same way a "variable" in a software program is real, even if the compiler optimizes it into different assembly instructions.

  ### The Skeptic's Strongest Case: Basis Dependence and Splitting

  We must grant the skeptic their due. The mathematical basis for hard realism is shaky.

  1.  **Basis Dependence:** In a linear space, any vector can be represented as a sum of other vectors. Unless the model enforces orthogonality (which it doesn't), the "Golden Gate direction" is arbitrary. I could rotate the basis, and the "meaning" disperses.
  2.  **The Feature-Splitting Problem:** As we increase the dictionary size of our SAEs, features split. A "Bridge" feature at dimension 32,000 might become "Suspension Bridge," "San Francisco Landmark," and "Red Structure" at dimension 1,000,000. If the "true" feature keeps fracturing as we zoom in, is there ever a ground truth? Or are we just carving a continuous manifold with increasingly fine knives?
  3.  **Superposition:** Models store more features than neurons. This implies features are not localizable objects but interference patterns. If a feature is a ghostly interference pattern rather than a dedicated circuit, calling it a "representation" feels like a stretch.

  If we claim features are *atomic*, the skeptic wins. There are no atoms here.

  ### The Realist's Evidence: Causal Leverage and World Models

  However, the skeptic's view fails to explain why our interventions work. If features were merely convenient fictions, causal patching should not reliably alter model behavior.

  1.  **Othello-GPT and Emergent World Models:** When we probe Othello-GPT, we don't just find patterns that *look* like board states; we find that the model *maintains* a board state representation that updates legally according to game rules, even when the move sequence is impossible. This isn't just a description; it's a computational necessity. The model *must* track the board to minimize loss. The representation is forced into existence by the task geometry.
  2.  **Probing vs. Patching:** The "Golden-Gate-Claude" demo is crucial. Probing is correlational (the skeptic's thermostat). But activation patching is causal. If I take the activation vector from a context about the Golden Gate and patch it into a context about the Eiffel Tower, and the model suddenly talks about San Francisco, that vector is *doing work*. It is not just a label we slapped on; it is a lever that moves the machine.
  3.  **The Linear Representation Hypothesis:** Despite superposition, high-level concepts often decode linearly. This suggests that while the *storage* might be compressed and entangled, the *readout* interface respects semantic structure. The model organizes itself to make these features accessible to later layers.

  ### The Synthesis: Causal Structural Realism

  So, how do we resolve the tension? We stop asking "Is this feature an atom?" and start asking "Is this feature a joint?"

  Consider a wooden table. You can chop it into atoms (carbon, hydrogen). You can chop it into sawdust. Or you can chop it at the joints (legs, top, screws). The "leg" of the table is not a fundamental particle of physics. It is a *functional unit* defined by the causal structure of the object. If you remove the leg, the table falls.

  **Causal Structural Realism** posits that a feature is "real" if it satisfies two conditions:
  1.  **Stability:** It appears consistently across different decomposition methods (e.g., different SAE seeds, different probing classifiers).
  2.  **Causal Leverage:** Intervening on it produces predictable, semantic changes in the output, independent of the context.

  Under this view, the feature-splitting problem is not a bug; it is a resolution scale. At low resolution, "Bridge" is a real joint. At high resolution, "Suspension" and "Cable" are the real joints. Both are real relative to the scale of analysis. The fact that the split happens suggests there *is* a structure there to be split, not just noise.

  Superposition is simply compression. Just as a hard drive stores a JPEG not as a 1:1 map of pixels but as compressed frequencies, the model stores features in superposition to save space. The fact that we can decompress them (via SAEs) and use them to patch behavior proves the information was there, structurally encoded, not just statistically correlated.

  ### Addressing the Thermostat Objection

  My roommate says a thermostat "represents" temperature only metaphorically. But there is a difference between a thermostat and LLM.

  A thermostat has a single feedback loop. An LLM has deep, hierarchical processing. When Othello-GPT tracks a board state, it is building an internal model of an external environment to predict future states. This is **structural isomorphism**. The relationships between the activations mirror the relationships between the game pieces.

  If the internal relationships mirror the external relationships, and intervening on the internal state changes the external prediction, the representation is not just a metaphor. It is a functional map. We are not just describing the model; we are reverse-engineering its data structures.

  ### The Verdict and Implications for Engineering

  So, here is my commitment for this team:

  **We are not finding Platonic atoms. We are reverse-engineering data structures.**

  This verdict changes how we work:

  1.  **Stop Hunting for the "True" Dictionary Size:** The skeptic says the shifting feature count proves features aren't real. I say it proves features are hierarchical. We should not look for *the* SAE size. We should look for *stable* features across sizes. If a feature persists from 64k to 1M dictionary size, it is a robust joint.
  2.  **Prioritize Causal Validation over Reconstruction Loss:** High reconstruction loss in an SAE doesn't mean the feature isn't real. It means the compression is lossy. The gold standard is not how well the SAE reconstructs the activation, but how well patching the SAE feature reconstructs the *behavior*.
  3.  **Accept Polysemanticity as Multiplexing:** A neuron firing for both "dogs" and "logging" isn't a failure of representation. It's bandwidth optimization. Our job is to demultiplex the signal, not demand the hardware be orthogonal.

  ### Conclusion

  The theorist's critique is valuable hygiene. It keeps us from mystifying matrix multiplication. But if we take it to the extreme, we paralyze ourselves. If "Golden Gate" is just a convenient fiction, then why does swapping that activation vector make the model talk about bridges?

  Magic doesn't work. If the intervention works, the structure is there.

  We should proceed with the confidence that we are mapping the causal topology of the model. The features are real, not because they are fundamental particles of intelligence, but because they are the load-bearing walls of the computation. They are the joints. And if we push on them hard enough, the whole structure moves.

  Let's get back to work.
