answer: |-
  This is an exceptionally sharp question that cuts to the heart of why the "Humean" label in contemporary metaphysics is often more of a banner of convenience than a historical fidelity. You are right to identify the anachronism: Hume was not doing the metaphysics of science in the post-Hempel, post-Dretske sense. He was doing cognitive science and epistemology before those fields existed.

  If we take the textual evidence seriously, navigating the "Old Hume" (reductive regularity) vs. "New Hume" (skeptical realist) fork, the most supported guess is that **Hume would reject the metaphysical pretensions of both camps, but he would view Lewis as a methodological ally who oversteps his bounds, and Armstrong/Maudlin as engaging in unintelligible Scholastic speculation.**

  Here is the breakdown of why Hume would likely refuse to sign onto either side, leaning slightly toward a therapeutic quietism that undermines the debate itself.

  ### 1. Hume vs. Lewis: The Dogmatism of Denial
  David Lewis explicitly modeled Humean Supervenience on Hume's rejection of necessary connection. On the **Old Hume** reading, Lewis is the perfect heir: he reduces modal facts to categorical facts, eliminating the "glue."

  However, even on the Old Hume reading, there is a divergence. Hume's conclusion in the *Enquiry* is primarily epistemic and semantic: we have no *idea* of necessary connection because we have no *impression* of it. He concludes that the term is meaningless *to us*, or refers only to a determination of the mind. Lewis, conversely, makes an **ontological** claim: there *are* no necessary connections in the world.

  If the **New Hume** reading (Strawson, Kail, etc.) holds water, this divergence becomes a chasm. The New Hume argues that Hume believed real causal powers *do* exist in nature, but that human cognition is structurally incapable of conceiving their nature.
  *   **Lewis's Sin:** Lewis turns Hume's epistemic humility into an ontological certainty. He claims to *know* the world lacks modal glue. Hume would likely view this as the very kind of dogmatic metaphysics he sought to cure. To say "there are no necessary connections" is to make a claim about the ultimate nature of reality that outruns experience just as much as saying "there are."
  *   **The Congeniality:** However, Hume would appreciate Lewis's commitment to parsimony and his refusal to populate the world with entities that play no role in empirical prediction. Lewis's Best System Analysis is a tool for organizing phenomena, which fits Hume's view of science as the classification of regularities.

  **Verdict:** Hume would treat Lewis's system as a useful *fiction* for science but would rebuke Lewis for claiming it is the literal metaphysical truth.

  ### 2. Hume vs. Armstrong/Maudlin: The Return of the Scholastics
  The Anti-Humean position posits exactly the kind of entity Hume's empiricism was designed to excise.
  *   **Against Universals (Armstrong):** Hume is a thoroughgoing nominalist. In the *Treatise*, he argues at length that "abstract ideas" (universals) are merely particular ideas attached to a general term. There are no mind-independent Universals $F$ and $G$ for a relation $N$ to hold between. Armstrong's ontology would strike Hume as a relapse into the "obscure and uncertain" speculations of the Scholastics.
  *   **Against Primitive Necessitation (Maudlin/Armstrong):** Hume's central argument is that we observe succession (A then B), but never a "tie" or "bond." When Armstrong posits a relation of natural necessitation, Hume would ask the fatal question: *"From what impression is that idea derived?"*
      *   If Armstrong says, "It's a theoretical posit," Hume replies that it is therefore not a legitimate idea.
      *   If Maudlin says, "It's primitive and unanalyzable," Hume replies that this is an admission that we have no content for the idea at all.

  **The New Hume Twist:** Even if the New Hume is right and Hume believed in real powers, he maintained they are **inconceivable**. Armstrong and Maudlin claim to have a coherent metaphysical theory *about* these powers (e.g., that they are relations between universals, or primitive features). Hume would argue that if powers are inconceivable, then any theory claiming to describe their logical structure is nonsense. You cannot have a logic of the inconceivable.

  **Verdict:** Hume would find Anti-Humeanism intelligibly bankrupt. It violates the Copy Principle (no impression, no idea) and reifies abstract entities (universals) he explicitly rejected.

  ### 3. The Likely Outcome: Therapeutic Quietism
  If you dragged Hume into your seminar, he would likely argue that the debate rests on a category mistake.

  For Hume, "law of nature" is not a name for a piece of metaphysical furniture (as Maudlin thinks) nor a name for a specific logical feature of the Humean mosaic (as Lewis thinks). It is a **psychological projection** onto a regular world that allows us to navigate it.
  *   **To Lewis:** He would say, "You are right to focus on the regularities, but wrong to claim the modal glue is *absent*. You simply cannot know."
  *   **To Armstrong:** He would say, "You are right that regularity feels insufficient, but wrong to think you can theorize the insufficiency. Your 'necessitation' is a word without an idea."

  ### The Best-Supported Guess
  If forced to choose a seat in the room:
  1.  **He would sit closer to Lewis.** Why? Because Lewis's metaphysics is built on the *phenomena* (the particular matters of fact). Hume's naturalism commits him to taking the deliverances of experience seriously. Lewis's system preserves the integrity of empirical science without adding occult entities.
  2.  **But he would vote with the Skeptics.** He would argue that Lewis's *interpretation* of that system (as the whole truth of reality) is unjustified.

  Ultimately, Hume's position is best described as **ontological agnosticism coupled with semantic empiricism**.
  *   **Semantic Empiricism:** We cannot meaningfully talk about Armstrong's universals or Maudlin's primitive lawhood.
  *   **Ontological Agnosticism:** We cannot know if Lewis is right that there are no powers, only that we can't use the concept.

  So, to answer your professor's passing question: Hume would likely regard **Lewis as a fellow traveler who lost his way into dogmatism**, and **Armstrong/Maudlin as victims of the very metaphysical illusions Hume tried to dispel.** He would urge the seminar to stop asking what laws *are* and start asking how the *idea* of law functions in human reasoning. In modern terms, he wouldn't be a Humean or an Anti-Humean; he would be a **Humean Quietist**.
