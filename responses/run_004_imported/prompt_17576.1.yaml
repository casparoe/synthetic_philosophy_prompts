  2.  **Deconstruct the Interpretive Fork (Old vs. New Hume):**
      *   *Old Hume (Projectivist/Reductive):* Causation *is* constant conjunction + psychological habit. No objective necessity. Metaphysically thin.
      *   *New Hume (Skeptical Realist):* Causation *involves* objective necessity, but we cannot conceive of it or know its nature. Metaphysically thick, epistemically thin.
      *   *Scholarly Consensus:* The "New Hume" reading has gained traction (Strawson, Kail, etc.), but it's not universally accepted (Garrett, Beebee, etc.). Most contemporary metaphysicians (like Lewis) operated on the "Old Hume" assumption.

  3.  **Evaluate Hume vs. Lewis (Humean Supervenience):**
      *   *Lewis's Claim:* Lewis explicitly claims Humean heritage. He wants to eliminate modal glue.
      *   *Compatibility:* If "Old Hume" is right, Lewis is the spiritual successor. If "New Hume" is right, Lewis is dogmatic (denying what Hume said we couldn't know/deny).
      *   *Hume's Method:* Hume is an empiricist. He rejects ideas without impressions. "Necessity" has no impression.
      *   *Crucial Distinction:* Lewis denies the *existence* of necessary connections. Hume (on New Reading) denies the *intelligibility/conceivability* of them, not necessarily their existence.
      *   *Verdict:* Lewis goes *further* than Hume. Hume suspends judgment on the ontology of powers; Lewis positively denies them. This makes Lewis potentially *more* metaphysically committed (negatively) than Hume would tolerate.

