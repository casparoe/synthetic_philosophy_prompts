answer: |-
  This is an excellent puzzle to bring to a seminar on social ontology. You have reconstructed Lewis's definition of convention accurately, but your inference from **arbitrariness** to **ease of change** is where the theoretical friction lies.

  To answer your question directly: **No, identifying a practice as "arbitrary" in Lewis's technical sense does not support the conclusion that it is easy to shift.** In fact, within Lewis's framework, the very features that make something a convention (specifically the interdependence of expectations) are often what make it notoriously resistant to change.

  Here is a breakdown of where the inference goes wrong, how to reconcile it with the stability of driving and language, and how you might frame this for your seminar.

  ### 1. The Modal Distinction: *Could Have Been* vs. *Can Become*
  The core issue is a confusion between two different modal claims.
  *   **Lewis's Arbitrariness (Ex Ante):** This is a claim about the *history* or the *logical space* of the problem. It states that at the time of emergence (or in principle), alternative $R'$ could have solved the coordination problem $S$ just as well as regularity $R$.
  *   **Your Inference (Ex Post):** This is a claim about the *current dynamics* of the population. It suggests that because $R'$ is theoretically possible, the population can easily transition from $R$ to $R'$ now.

  Lewis's condition is satisfied if there *was* an alternative path at the fork in the road. It does not imply that the road is currently two-way. Once a population coordinates on $R$, the "arbitrariness" remains a feature of the convention's *identity*, but it ceases to be a feature of its *stability*.

  ### 2. Conventions as Coordination Equilibria
  Lewis analyzes conventions using game theory (specifically coordination games). A convention is a **coordination equilibrium**.
  *   In a coordination equilibrium, no agent has an incentive to deviate *unilaterally*.
  *   If everyone drives on the left, my preference is to drive on the left. If I switch to the right while you stay on the left, I crash.
  *   Therefore, the "friction" preventing change is not intrinsic necessity (like gravity); it is **strategic interdependence**.

  The stability of a Lewisian convention comes from the fact that my reason for conforming is *conditional* on your conforming. Because we both know this (Common Knowledge), we both stay put. The arbitrariness of the rule (Left vs. Right) is irrelevant to the *cost* of switching once the equilibrium is established. The cost of switching is high because switching requires breaking the equilibrium, which is irrational for any individual actor to do alone.

  ### 3. The Problem of Common Knowledge in Transition
  For a population to shift from one arbitrary convention to another (e.g., driving on the left to driving on the right), they must solve a **higher-order coordination problem**.
  *   It is not enough for me to want to switch.
  *   It is not enough for me to know *you* want to switch.
  *   It must be **common knowledge** that we will switch *at the same time*.

  If the switch is gradual, the system breaks down (chaos on the roads). Therefore, arbitrary conventions exhibit **hysteresis** or **path dependence**. The fact that the rule is arbitrary means we *could* be on a different path, but the fact that it is a *convention* means we are locked into this one until an external shock or a massive, coordinated focal point allows us to jump to the new equilibrium simultaneously.

  This explains your examples:
  *   **Driving:** Sweden changed from left to right in 1967 (*Dagen H*). It was not an organic drift; it required a state-mandated, simultaneous switch because the coordination costs of a mixed system were too high.
  *   **Language:** We could theoretically agree that "cat" means "dog." But until that agreement is common knowledge, using "cat" to mean "dog" results in communication failure. The arbitrariness of the signifier does not make the signifier fluid.

  ### 4. Where Your Intuition Was Right (and Where it Applies)
  Your intuition isn't baseless; it just applies to a different kind of social phenomenon.
  *   **Weak Conventions:** Some conventions are "thin." For example, which side of the sidewalk to walk on. These are arbitrary and *relatively* easy to shift because the cost of mismatched expectations is low (a minor bump rather than a car crash).
  *   **Norms vs. Conventions:** If your seminar is on the *philosophy of norms*, you should distinguish Lewisian conventions from **Social Norms**.
      *   **Lewisian Convention:** I conform because I expect you to conform, and I prefer to match you.
      *   **Social Norm:** I conform because I expect you to conform, I prefer to match you, *and* I expect you to sanction me if I don't.
      *   Norms add a layer of normative expectation (ought) on top of predictive expectation (will). This makes them even harder to change than pure Lewisian conventions.

  Your hypothesis might hold water if you argue that **purely arbitrary practices *without* strong network effects or sanctions** are easier to change. But for "thick" conventions like language and law, the arbitrariness is the *source* of the lock-in, not the key to the exit. Because there is no intrinsic reason to prefer Left over Right, the *only* reason to prefer Left is that everyone else is doing it. That makes the "everyone else" factor overwhelmingly heavy.

  ### 5. Recommendations for Your Seminar Contribution
  To turn this into a strong seminar intervention, I suggest reframing your hypothesis:

  1.  **Correct the Reconstruction:** Acknowledge that Lewis's arbitrariness condition explains the **contingency of origin**, not the **fluidity of maintenance**.
  2.  **Propose a New Metric:** Instead of using arbitrariness to predict ease of change, use the **cost of coordination failure**.
      *   *Hypothesis:* The resistance to change in a social practice is proportional to the cost of temporary non-conformity during a transition period.
      *   Driving and Language have high transition costs (death, incomprehension).
      *   Fork usage or greeting rituals have lower transition costs.
  3.  **Engage with Critiques:** You might mention **Margaret Gilbert's** critique of Lewis. She argues that conventions involve a "joint commitment" which creates obligations, not just conditional preferences. If Gilbert is right, conventions are even *harder* to change than Lewis suggests, because you need to release the group from the commitment, not just shift expectations.
  4.  **The "Focal Point" Solution:** Discuss how change actually happens. Since organic drift is hard due to the equilibrium trap, change usually requires a **Schelling Focal Point** (a salient event or edict) that allows the population to re-coordinate on the alternative arbitrary rule simultaneously.

  ### Summary
  The trouble lies in the **inference from arbitrariness to ease of change**.
  *   **Lewis is right:** The rule is arbitrary (Left vs. Right).
  *   **You are right:** It is hard to change.
  *   **The Synthesis:** It is hard to change *precisely because* it is an arbitrary coordination equilibrium. If the rule were non-arbitrary (e.g., "drive on the side with the sun"), we could change our behavior individually based on the sun. Because it is arbitrary, we can only change our behavior collectively based on *each other*. Collective action is hard.

  This is a sophisticated insight: **Arbitrariness creates dependency on others, and dependency on others creates inertia.** This would make for a very strong seminar paper.
