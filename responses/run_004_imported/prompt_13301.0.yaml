answer: |-
  Friends, family, and the old crew.

  For forty years, my father made his living at the felt tables. To some of you in this room, he was a legend at the table, a man who could read a shuffle like others read a newspaper. To others, mostly family, he was the man who wouldn't lend money on a "sure thing," the man who counted the cost before he crossed the street, the man who sometimes seemed to hold back when the world asked him to go all in.

  I am standing here because he asked me to tell you the truth about why he did what he did. And he gave me one specific instruction before he passed. He said, "Do not stand up there and call me cautious. Do not call me risk-averse."

  He hated those words. He felt they were an insult to his craft.

  To call a man cautious is to say he is afraid of the water. My father was not afraid of the water. He simply knew that you cannot swim if you drown.

  He spent his life studying the mathematics of survival. He used to tell me that most people look at a risk and ask, "What is the average outcome?" They imagine a thousand versions of themselves taking the same bet, winning some, losing some, and coming out ahead in the end. But he knew that we don't live a thousand lives. We have only one. We walk a single path. In our one life, there is no averaging out. There is only the sequence of steps we take. If one step takes you off a cliff, it doesn't matter how high you jumped on the previous thousand steps. You are gone.

  So, when he sat at a poker table, or when he decided whether to invest in a new home, or even when he decided whether to lend money to a relative in a bind, he wasn't asking, "Can I win?" He was asking, "If I lose, do I stay in the game?"

  To the family who felt he was tight-fisted: I know there were times you wished he would open his wallet wider. I know it felt like he didn't trust you, or that he valued his chips more than your needs. But I have come to understand that his refusal to bet on "sure things" was the very reason we were all taken care of in the end. He understood that a catastrophic loss doesn't just hurt the gambler; it hurts everyone who relies on him. By protecting his stake, he was protecting us. He wasn't hoarding; he was sustaining. He was ensuring that he would be here, tomorrow, and the day after, to provide for the people he loved.

  To the old crew: You know that discipline is the only edge that lasts. You know that anyone can get lucky on a single night, but only a master can survive a decade. He didn't play not to lose; he played to ensure he could keep playing. There is a difference. One is fear; the other is endurance.

  He taught me that the greatest risk isn't losing a hand. The greatest risk is ruining your ability to play the next one. He sized his bets so that a bad beat was a bruise, not a funeral. He sized his life so that a tragedy was a burden to carry, not a reason to stop walking.

  That is not caution. That is a profound, aggressive commitment to the future. It takes courage to walk away from a table when the odds are murky. It takes even more courage to bet big when the math is right, and to trust your discipline enough to hold steady when the luck turns cold.

  He didn't gamble. He invested in his own continuity.

  So, I won't call him cautious. I will call him what he was: A man who respected the long game. A man who understood that the only way to win is to remain standing. And because he understood that, he left us all something far more valuable than a stack of chips. He left us a legacy that didn't vanish on a bad turn of the card. He left us a father who is still here, in the lessons he taught, in the security he built, and in the knowledge that he never, ever bet more than he could afford to lose of himself.

  He stayed in the game. And because he did, we are all still here to call him Dad.

  Rest easy. The game is over, and you're still ahead.
