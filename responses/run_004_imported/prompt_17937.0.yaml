          2.  The "Moving Target": If a human sees $G(F)$, they effectively move to system $F' = F + G(F)$. But a machine can do that too. The mind might be an unbounded sequence of systems, not a single static $F$.
          3.  Complexity: We don't know our own code. If the system is too complex to be surveyable, we can't construct $G(F)$ for it.

