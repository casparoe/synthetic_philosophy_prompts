  2.  **Deconstruct the Arguments:**
      *   **Lucas-Penrose Core:** If the mind were a formal system $F$, it could produce its Gödel sentence $G(F)$. $F$ cannot prove $G(F)$ (if consistent). But we can *see* $G(F)$ is true. Therefore, the mind is not $F$.
      *   **The Consistency Problem:** Gödel's theorem requires consistency. How do we know $F$ is consistent? If we assume $F$ is consistent to prove $G(F)$ is true, we are assuming something $F$ might not be able to prove about itself.
      *   **Penrose's Shift (Soundness):** Penrose argues in *Shadows of the Mind* that we don't just believe our reasoning is consistent, we believe it is *sound* (produces only truths). If we know we are sound, we can know $G(F)$ is true.
      *   **Computationalist Counter (Putnam/Chalmers/etc.):**
