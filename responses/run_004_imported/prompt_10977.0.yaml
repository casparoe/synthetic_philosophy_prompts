answer: |-
  Good evening. For those who don't know me, I am the father of the bride. For most of my life, I was a field geologist. I spent forty years looking at strata, fault lines, and the deep, slow architecture of the earth. But since retiring, I have taken up philosophy. Mostly, I'll admit, to keep up with my daughter.

  Reading her dissertation on F. H. Bradley has changed how I see the world. Specifically, it has changed how I see this moment. You see, her work demonstrates that Bradley's Regress remains unsolved. She argues persuasively that you cannot explain the unity of a fact by adding a relation to it. If you say a "tie" binds two things, you must then explain what ties the tie to the things. And then what ties that second tie to the first.

  So, as a father who respects the rigor of the department, I have had to edit this speech carefully. I cannot tell you that today these two are "bound together." Because if love is the bond, what binds the love to the lovers? If I claim this ceremony unites them, I must ask what unites the ceremony to them.

  I looked at the buffet on my way in, and I realized: we simply do not have time for an infinite hierarchy of ceremonial relations before the cake is cut.

  For the half of the room just nodding politely: my daughter has spent years proving that you cannot build a whole out of parts just by gluing them. The unity must be there already, or it isn't there at all.

  And for the half of the room checking my citations: she argues that Fregean unsaturation and primitive non-relational ties both beg the question. They assume the very unity they purport to explain. I accept her conclusion.

  Which brings me to what I *can* say.

  As a geologist, I know that a mountain does not stand because of a theoretical proposition holding its rocks in place. It stands because it is there. It is a brute fact.

  [Partner's Name], [Daughter's Name], looking at you both, I see that your marriage is not a problem to be solved. It is not a proposition waiting for a truth-maker. It is a fact. The unity of your life together is not something a contract creates, or a ritual achieves, or a metaphysician explains. It is the ground upon which you now stand.

  You do not need a "tie" to be together. You simply *are* together. The love you share is not a relation between two separate substances; it is the manner in which you now exist. It is internal, not external. It is the strata, not the cement.

  My wish for you is that you never try to analyze this unity to death. Do not look for the glue. Do not look for the nexus. Just live the fact.

  In my old life, I learned that the earth is older than our theories about it. In my new life, my daughter has taught me that love is deeper than our logic about it.

  So, please raise your glasses. Not to a bond that needs securing, and not to a union that needs explaining. But to the brute, beautiful, unanalyzable fact of you.

  To [Daughter] and [Partner].
