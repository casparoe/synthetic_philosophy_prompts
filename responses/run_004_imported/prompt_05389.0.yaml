answer: |-
  This is a sharp reading of the Glasgow speech. You've correctly identified the tension that modern originalists often gloss over: Douglass wasn't an originalist because he revered the Framers; he was an originalist because he believed the *text*, stripped of the Framers' compromised intentions, was a weapon he could use to kill slavery.

  If you dress Douglass up in a modern suit and sit him through the Roberts Court, he does not side with the "public meaning" originalists. He views their project as a **hostile takeover**.

  Here is the structural reason why: For Douglass, Move 1 (textualism/originalism) was always subordinate to Move 2 (natural rights/teleology). In 1860, he argued that because the *purpose* of the Constitution was liberty (Preamble), and the *text* did not explicitly authorize slavery, slavery was unconstitutional. He rejected the "intentions of the framers" (Move 1's historical component) precisely because those intentions were pro-slavery.

  Modern originalism, particularly in the *Dobbs* and *Shelby County* lineage, inverts this hierarchy. It treats historical practice and structural federalism as constraints on liberty, rather than treating liberty as the constraint on historical practice.

  Here is how he breaks down the specific cases, using the architecture of his 1860 argument.

  ### 1. *Bostock v. Clayton County* (2020)
  **Douglass's Verdict: Approval.**

  This is the only case where modern originalism aligns with Douglass's method. Gorsuch's opinion is pure Douglassian Move 1: Ignore what the 1964 Congress *thought* they were doing; look at what the words *say*. If the text says "because of sex," and firing a gay man involves sex, the text controls.

  Douglass spent the 1840s and 50s making the exact same argument about the word "person" or "citizen." The Garrisonians said, "The Framers intended to protect property in slaves." Douglass replied, "The text says 'people' and 'citizens,' not 'white people' or 'masters.' The text controls."

  In *Bostock*, the textualist method expands protection to a marginalized group against the stated intentions of the legislators. Douglass would see this as a vindication of his Glasgow thesis: **The text is better than the men who wrote it.** He would cheer this result not because he's a modern liberal, but because it treats the statute as a living command of law rather than a historical artifact of intent.

  ### 2. *Dobbs v. Jackson Women's Health* (2022)
  **Douglass's Verdict: Hostile Rejection.**

  This is where the divorce becomes final. *Dobbs* relies on a "history and tradition" test: To have a right, it must be "deeply rooted in this Nation's history and tradition."

  If Douglass applied the *Dobbs* test to his own career, **slavery stands.**

  In 1787 and 1868, the "history and tradition" of the United States explicitly sanctioned chattel slavery and the legal subordination of women. In the Glasgow speech, Douglass explicitly argues *against* binding the present to the moral failures of the past. He writes:

  > "I must inquire not what the fathers *did*, but what they *said*... I must not look at the secret intentions of the framers, but at the plain, common-sense reading of the instrument itself."

  Douglass's Move 2 (Higher Law) dictates that when history and liberty conflict, liberty wins. The Preamble's command to "secure the Blessings of Liberty" is a forward-looking mandate, not a backward-looking inventory. *Dobbs* treats the 1868 understanding of "liberty" as a ceiling. Douglass treated the 1787 understanding of "liberty" as a floor.

  He would argue that *Dobbs* commits the exact error the Garrisonians made: it conflates the *practice* of the past with the *principles* of the Constitution. He would view the "history and tradition" test as a "covenant with death" by another name—a method that constitutionalizes historical injustice by labeling it "tradition."

  ### 3. *Shelby County v. Holder* (2013)
  **Douglass's Verdict: Hostile Rejection.**

  *Shelby County* struck down the VRA preclearance formula based on the "equal sovereignty" of the states and the idea that the 1965 conditions no longer existed. It prioritizes federalism (structure) over voting rights (substance).

  Post-1865 Douglass is a Reconstruction nationalist. He viewed the 13th, 14th, and 15th Amendments as a "new departure," a fundamental rewriting of the federal compact to empower the national government to protect citizens against states. In his speech "The Reconstruction Era" (1866), he argues that the federal government must have "complete power" to protect the freedmen.

  Douglass's textualism was never about federalism; it was about **jurisdiction over rights.** He argued the Constitution gave the federal government the power to abolish slavery because slavery violated natural rights. By extension, the 15th Amendment gives the federal government the power to abolish voting restrictions because they violate natural rights.

  *Shelby County* uses a structural inference (state sovereignty) to disable an explicit textual command (the 15th Amendment's enforcement clause). Douglass would argue this repeats the pre-Civil War error: allowing states to claim "sovereignty" over human rights. He would see the "equal sovereignty" doctrine as a formalistic trick that ignores the *teleological* point of the Reconstruction Amendments: to break state sovereignty where it infringes on liberty.

  ### The Core Divergence: Constraint vs. Sword

  Here is the actual leaning: **Douglass sides with Move 2 (Higher Law/Natural Rights), and he views modern Originalism as a betrayal of Move 1.**

  Modern originalists (Scalia, Thomas, Alito) use "original public meaning" as a **constraint on the judge**. The goal is to stop judges from imposing their own values. They claim neutrality.

  Douglass used "textual meaning" as a **sword for the oppressed**. The goal was to force the government to live up to its highest principles. He claimed *partisan neutrality* (the law applies to everyone), but *moral partiality* (the law must favor liberty).

  In the Glasgow speech, Douglass says:
  > "The Constitution is not merely a contract for the present, but a charter for the future... It was intended to grow with the growth of the country, and to expand with the expansion of the human mind."

  This is incompatible with the *Dobbs* "history and tradition" test. Douglass believes the text *already contains* the seeds of abolition (and by extension, broader liberty); you just have to water them. Modern originalists believe the text *only contains* what was historically understood; you cannot water seeds that weren't planted.

  ### Conclusion

  Douglass would argue that the modern Originalists have committed a category error. They treat the Constitution as a **code of laws** to be decoded historically. Douglass treated it as a **bill of rights** to be enforced morally.

  He would tell Scalia and Alito: *"You say you are reading the text as it was understood in 1787/1868. I tell you that the text was designed to destroy the understanding of 1787/1868 where that understanding conflicted with Liberty. You are worshipping the shadow of the Framers, while ignoring the light they claimed to serve."*

  He would likely find common cause with Justice Harlan I (the *Plessy* dissenter), who argued that the Constitution is "color-blind" not as a historical fact, but as a legal command. But against the current majority? He would view them as the spiritual successors of the Taney Court: using technical readings of text and history to sanitize the exclusion of vulnerable people from the "Blessings of Liberty."

  **Final Call:** He rejects the modern project. He was a **Teleological Textualist**. When Text/History conflicts with Liberty, Liberty wins. Modern Originalism says when Text/History conflicts with Liberty, History wins. That is a deal Douglass made a career of breaking.
