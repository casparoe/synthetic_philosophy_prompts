prompt: |-
  I sit on the incidental-findings subcommittee of my university's biobank, and we're close to voting on a policy for a case that keeps recurring in our aging-cohort study: participants who consented to research-grade whole-genome sequencing and turn out to carry two copies of the APOE4 allele, which substantially raises lifetime Alzheimer's risk and for which there is still no approved intervention that prevents or delays onset in people who are asymptomatic. At enrollment, participants ticked a box indicating whether they wanted this kind of finding disclosed if it ever turned up, and a sizable minority said no.

  One subcommittee member, a former decision theorist now doing public-health research, keeps invoking what she calls Good's theorem -- the result that for a Bayesian expected-utility maximizer, the expected value of costless evidence is never negative -- to argue that the "no" box is tracking discomfort rather than anything a sound policy should defer to, and that disclosure by default is simply what the math recommends once you're honest about it. Two of our clinicians push back with the "right not to know" tradition that grew out of Huntington's-disease predictive testing, together with documented cases of anxiety and family disruption following unsolicited disclosure of similarly grim, non-actionable results -- disruption that's compounded here, since a participant's APOE4 status also implies something about their parents and siblings, none of whom consented to learn anything. I've read enough Bayesian-inflected blogs over the years to recognize the theorem on sight, but I've never seen anyone actually work out whether it bears on a case like this one, and nobody on the subcommittee seems able to either dismiss the argument or accept it outright.

  Could you draft the short recommendation memo the subcommittee will bring to the full board next month? It should land on one specific policy for this class of finding rather than calling for further study -- covering at least the default (opt-in vs. opt-out at enrollment), the threshold a finding must meet to be disclosed at all, and how, if at all, biological relatives factor in. And since the decision-theoretic argument is the one nobody here has managed to actually rebut rather than just talk past, please give it a serious hearing on its own terms: say specifically which of the theorem's idealizing assumptions -- about the evidence being free, the relevant utility function being fixed and already complete, there being a single decision-maker, and so on -- this situation satisfies or fails to satisfy, rather than just asserting that real participants aren't idealized Bayesian agents.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the incidental-findings subcommittee of a university biobank.
      *   **Task:** Draft a short recommendation memo to the full board.
      *   **Topic:** Policy for disclosing APOE4 homozygosity (high Alzheimer's risk, non-actionable) in an aging cohort.
      *   **Conflict:** Decision theorist (citing Good's Theorem for default disclosure) vs. Clinicians (citing "Right Not to Know," psychological harm, family implications).
      *   **Requirements:**
          *   Land on a *specific policy* (no "further study").
          *   Cover: Default (opt-in/opt-out), Disclosure Threshold, Biological Relatives.
          *   Address Good's Theorem specifically: Analyze its assumptions (costless evidence, fixed utility, single agent) against the reality of this case.
          *   Tone: Professional, reasoned, decisive, academically rigorous.

  2.  **Deconstruct Good's Theorem (I.J. Good, 1967):**
      *   *Core Claim:* For a rational Bayesian agent maximizing expected utility, obtaining free information is always non-negative in expected value. You can always ignore the info if it's useless, but sometimes it helps you make a better decision.
      *   *Assumptions:*
          1.  **Costless Evidence:** No cost to acquire or process the information.
          2.  **Fixed/Complete Utility Function:** The agent knows exactly what they value and how to weigh outcomes *before* seeing the data.
          3.  **Single Decision-Maker:** The utility function belongs solely to the person receiving the info.
          4.  **Actionability:** The information *can* influence a decision (even if that decision is "do nothing").
          5.  **Rational Processing:** The agent updates beliefs correctly and doesn't suffer cognitive biases or emotional utility shocks that violate the model.
      *   *Application to APOE4:*
          *   *Cost:* Not costless (psychological distress, insurance implications, family tension).
          *   *Utility:* Participants' preferences change *after* knowing (anticipatory utility vs. experienced utility). The "Right Not to Know" suggests the utility function includes *not knowing* as a state.
          *   *Agents:* Relatives are affected (externalities).
          *   *Actionability:* Limited medical actionability reduces the instrumental value of the info.

  3.  **Determine the Policy Recommendation:**
      *   *Context:* Aging cohort, research-grade WGS, APOE4 homozygosity (high risk, no cure).
      *   *Ethical Consensus:* Generally, for non-actionable, high-penetrance neurodegenerative conditions (like Huntington's), the standard is strict opt-in. APOE4 is probabilistic, not deterministic, but the psychological burden is similar.
      *   *Decision:* Strict Opt-In (Active Choice) at enrollment. No disclosure for those who didn't explicitly consent. No duty to warn relatives (too complex/harmful in research context).
      *   *Rationale:* Respects autonomy (including the right not to know), acknowledges the failure of Good's Theorem assumptions in this context, minimizes harm.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background:** Briefly state the issue (APOE4, aging cohort, conflict).
      *   **Analysis of Good's Theorem:** This is the crucial intellectual heavy lifting requested.
          *   Acknowledge the theorem's validity *in its domain*.
          *   Systematically dismantle its applicability here based on assumptions.
          *   *Cost:* Psychological cost is real, not zero.
          *   *Utility:* Preferences are endogenous (knowing changes valuing). "Ignorance is bliss" is a valid utility state.
          *   *Agency:* Third-party effects (family).
      *   **Policy Recommendations:**
          *   *Default:* Explicit Opt-In (Active Consent).
          *   *Threshold:* Only homozygous (e4/e4) disclosed, and only if opted in. Heterozygous usually not disclosed due to lower risk/ambiguity (keep it simple for the memo, focus on the e4/e4 case).
          *   *Relatives:* No active contact. Provide resources to the participant to share if they choose.
      *   **Conclusion:** Final wrap-up.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is "Opt-In" too restrictive?
      *   *Correction:* Given the "Right Not to Know" precedent (Huntington's), Opt-In is the ethical gold standard for non-actionable neurodegenerative risk. Opt-Out presumes a desire to know that isn't universal.
      *   *Critique:* Did I address the Decision Theorist fairly?
      *   *Correction:* Ensure I don't just say "people aren't robots." I need to say "The *model parameters* (cost, utility definition) do not match the physical reality of this medical context." Specifically, the utility of *anticipation* matters.
      *   *Tone Check:* Needs to be respectful of the decision theorist's input but firm on the conclusion.

  6.  **Drafting the Content (incorporating specific constraints):**
      *   *Constraint:* "Land on one specific policy." -> Explicit Opt-In.
      *   *Constraint:* "Cover default, threshold, relatives." -> Check.
      *   *Constraint:* "Give Good's Theorem a serious hearing." -> Dedicate a specific section to the assumptions (Cost, Utility Stability, Externalities).

  7.  **Final Polish:** Check for clarity, brevity, and authority. Ensure the distinction between research and clinical care is maintained (this is a biobank, not a clinic).

  *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in the math of Good's Theorem. The prompt asks to analyze the *assumptions*. I will list the specific assumptions (Costless, Fixed Utility, Single Agent) and map the APOE4 scenario against them.

  *Key Insight for the Theorem Rebuttal:* Good's theorem assumes the utility function is defined over *world states*. But in medical genetics, the utility function is often defined over *knowledge states*. If $U(Knowing) < U(Not Knowing)$, then the information has negative utility by definition, regardless of Bayesian updating. The theorem assumes information only affects utility via action changes, not via the state of knowing itself.

  *Let's refine that:* Good's theorem says $E[U|Info] \ge E[U|No Info]$. This holds if utility depends only on actions and world states. If utility depends on *beliefs* (e.g., anxiety), the theorem doesn't apply directly because the utility function isn't just over outcomes, but over the probability distribution itself (information aversion). I should phrase this carefully so it sounds expert but accessible.

  *Revised Plan:* Focus on "Costless" (psychological harm is a cost) and "Utility over Outcomes vs. States of Mind" (anticipatory utility).

  8.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Specific policy? Yes (Opt-In).
      *   Threshold/Relatives? Yes.
      *   Good's Theorem analysis? Yes (Assumptions check).
      *   No "further study"? Yes.

