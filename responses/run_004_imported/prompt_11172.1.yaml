answer: |-
  **MEMORANDUM**

  **TO:** Biobank Governance Board
  **FROM:** Incidental Findings Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Disclosure of APOE4 Homozygosity in Aging Cohort

  **1. Executive Summary**
  The Subcommittee recommends a policy of **explicit opt-in** for the disclosure of APOE4 homozygosity (ε4/ε4) in research participants. Findings will not be disclosed to participants who did not explicitly consent to receive this specific information at enrollment. We further recommend that no active duty to warn biological relatives be undertaken by the biobank. This policy prioritizes the "right not to know" and acknowledges the specific psychological and familial externalities of non-actionable neurodegenerative risk, which render standard decision-theoretic arguments for default disclosure inapplicable.

  **2. Context and Conflict**
  Our aging-cohort study frequently identifies participants homozygous for the APOE4 allele. This genotype confers a significantly elevated lifetime risk for Alzheimer's disease (AD), yet no approved preventive intervention exists. While enrollment forms allow participants to decline such findings, a subcommittee member has argued that **Good's Theorem** (1967) mandates default disclosure. The argument posits that for a rational agent, costless evidence always has non-negative expected value; therefore, respecting a "no disclosure" preference is paternalistic and mathematically unsound.

  Clinical members counter that unsolicited disclosure causes documented psychological harm and family disruption, invoking the ethical precedent of Huntington's disease testing. The Subcommittee has evaluated both positions and concludes that Good's Theorem, while mathematically valid, relies on idealizing assumptions that are violated in this specific clinical-ethical context.

  **3. Analysis of Good's Theorem Applicability**
  Good's Theorem states that for a Bayesian expected-utility maximizer, the expected utility of obtaining free evidence is never less than the expected utility of acting without it. However, this result depends on specific structural assumptions about the decision environment. Our analysis indicates three critical failures of these assumptions in the APOE4 disclosure scenario:

  *   **Assumption of Costless Evidence:** The theorem assumes the acquisition and processing of evidence incur no cost. In this context, "processing" the evidence entails significant psychological cost (anxiety, depression, anticipatory grief) and potential socioeconomic cost (insurance discrimination, despite GINA protections which do not cover life/long-term care policies). Because the "cost" term in the utility equation is non-zero and potentially high, the net expected value of the information can indeed be negative.
  *   **Assumption of Utility Defined Over World States Only:** Good's Theorem assumes utility is derived from *actions* taken in *world states*. It does not account for **anticipatory utility**, where the agent derives disutility directly from the *state of knowledge* itself. If a participant's utility function includes a penalty for "knowing one is at high risk without ability to act," then the information itself alters the utility landscape negatively, independent of any subsequent medical decision. The "right not to know" is not an irrational constraint; it is a preference for a specific epistemic state that maximizes well-being.
  *   **Assumption of a Single Decision-Maker:** The theorem models a single agent maximizing their own utility. APOE4 results are inherently familial; a participant's result updates the risk probabilities for parents, siblings, and children who did not consent to testing. Default disclosure imposes informational externalities on third parties. A policy based on single-agent optimization fails to account for the utility losses incurred by non-consenting relatives.

  Consequently, the decision-theoretic argument for default disclosure collapses because the participants are not violating rationality; rather, the model provided does not capture the relevant costs and utility functions of genomic risk disclosure.

  **4. Policy Recommendations**
  Based on the ethical analysis and the limitations of the decision-theoretic model, the Subcommittee recommends the following specific policy:

  *   **Default Status (Enrollment):** **Explicit Opt-In.**
      Participants must actively select a checkbox to receive information regarding APOE4 homozygosity. The default setting will be *non-disclosure*. This respects the autonomy of those who wish to know while protecting those who prioritize psychological preservation. We reject an "Opt-Out" model, as it presumes a desire for information that cannot be assumed for non-actionable, high-stakes findings.

  *   **Disclosure Threshold:** **Homozygosity Only (ε4/ε4).**
      Disclosure is limited strictly to participants carrying two copies of the ε4 allele. Heterozygous carriers (ε3/ε4) will not be contacted. The risk elevation for heterozygotes is lower and more ambiguous; the potential for anxiety outweighs the marginal utility of risk awareness in a research context without clinical validation pipelines.

  *   **Biological Relatives:** **No Active Duty to Warn.**
      The biobank will not contact biological relatives of a participant found to be ε4/ε4. The research consent is individual, and the biobank lacks a clinical relationship with family members. Instead, genetic counseling resources will be provided to the participant during the disclosure process, empowering them to share relevant familial risk information at their discretion.

  **5. Implementation**
  Upon adoption, the Consent Form will be revised to clearly distinguish "Research Results" from "Clinical Results," with a dedicated section for Neurodegenerative Risk Findings. Staff will undergo training on the specific counseling protocol for APOE4 disclosure to ensure that those who *do* opt-in receive adequate support to mitigate the psychological costs acknowledged in Section 3.

  **6. Conclusion**
  While Good's Theorem correctly identifies that information is generally instrumentally valuable, it fails to model the intrinsic disutility of unwanted knowledge and the interpersonal costs of genetic data. A policy of Explicit Opt-In aligns with established bioethical norms for non-actionable conditions and respects the heterogeneous preferences of our cohort regarding the burden of knowledge.

  **Recommendation:** The Subcommittee moves to adopt the Explicit Opt-In policy as detailed above.
