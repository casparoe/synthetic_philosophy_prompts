answer: |-
  Good morning. For those who don't know me, I'm [Name]. I started here three weeks ago. I was hired to sit across from [Her Name], to learn the desk, to learn the job. I was supposed to have thirty years to learn it. Instead, I have three weeks, and this room.

  I want to start with last Tuesday. I was sitting where she sat. She was leaning over a proof, a magnifying glass in one hand, the phone cradled against her shoulder. She was on hold with an archive in Ohio. The issue was a caption for a photograph from 1974. The wire copy said the protest happened on a Tuesday. The photo log said Thursday.

  It didn't change the story. It didn't change the policy. It was twenty-four hours, forty years ago. But she stayed on hold for twelve minutes. When the archivist finally picked up, [Her Name] didn't argue. She just listened, wrote down a name, thanked them, and hung up. She corrected the Tuesday to a Thursday. Then she went to lunch.

  To some, that might look like pedantry. To others, it might look like a battle. I know there is a temptation to stand here and call her a warrior for the truth. I know she would have hated that. In fact, I know she kept two essays taped inside her desk drawer—copies worn soft from turning—that argued specifically against that kind of thinking.

  She believed that calling someone a "guardian of truth" suggested that truth was something you could lock in a vault, or defend with a sword. She used to tell me that factual truth isn't a hero. It's a guest. It's fragile. It only survives if we invite it in, if we give it a place to sit, and if we agree, together, not to ask it to leave.

  When she checked that date, she wasn't trying to catch a liar. She wasn't trying to win a confrontation. She was trying to keep a promise. The promise was that when this magazine put a number, a name, or a date on a page, it was a place where the world could stand without slipping.

  Her family knows this side of her, even if you didn't see it in the office. You knew her as the person who remembered the exact year you moved to a new house, or who would gently correct a story about a family vacation because the weather didn't match the month. It wasn't because she wanted to be right. It was because she believed that getting the small things right was the only way to honor the big things. She believed that if we let the dates blur, eventually the stories blur, and if the stories blur, we lose the ability to know where we are.

  There is a specific kind of danger in our world today. It isn't always a direct lie. Sometimes, it is a fog. It is the tendency to reshape reality until it looks more comfortable, more dramatic, or more convenient. [Her Name] understood that the antidote to that fog wasn't a grand speech. It was the quiet, unglamorous work of checking the primary source. It was the refusal to let a convenient fiction become a fact just because it was easier to print.

  She taught me that facts do not survive on their own. They need witnesses. They need records. They need institutions, and they need people who are willing to stay on the phone for twelve minutes to verify a Thursday.

  So, to her colleagues: We cannot replace her. But we can keep the desk open. We can keep the essays in the drawer. We can continue the work of being the witnesses she believed we needed to be. Not as heroes, but as clerks of the record.

  And to her family and friends: Thank you for sharing her with us. Thank you for loving her even when she corrected your dates. She did it because she cared about the reality you shared. She wanted the world you lived in to be solid ground.

  She didn't leave us a legacy of battles won. She left us a legacy of things verified. A web of small, sturdy threads, holding the world in place. Our job now is to hold the other end.

  Thank you.
