prompt: |-
  A friend and I spent most of a long dinner arguing about why there is something rather than nothing. Her position was that the question is not a profound mystery at all but an artifact of an incoherent picture of "nothingness": once you notice that you can never actually picture a total absence of everything, the question dissolves rather than getting answered. I objected that failing to picture something doesn't show the thing is impossible or the question meaningless — maybe that just reveals a limit on imagination, not on reality. Rather than settle it there, she later sent me the passage below, from the fourth chapter of Henri Bergson's *Creative Evolution* (1907), where he raises more or less this same question ("how can it be understood that anything exists?") and then tries to work out what actually happens when we attempt to form an image of "nothing":

  "I am going to close my eyes, stop my ears, extinguish one by one the sensations that come to me from the outer world. Now it is done; all my perceptions vanish, the material universe sinks into silence and the night.—I subsist, however, and cannot help myself subsisting. I am still there, with the organic sensations which come to me from the surface and from the interior of my body, with the recollections which my past perceptions have left behind them—nay, with the impression, most positive and full, of the void I have just made about me. How can I suppress all this? How eliminate myself? I can even, it may be, blot out and forget my recollections up to my immediate past; but at least I keep the consciousness of my present reduced to its extremest poverty, that is to say, of the actual state of my body. I will try, however, to do away even with this consciousness itself. I will reduce more and more the sensations my body sends in to me: now they are almost gone; now they are gone, they have disappeared in the night where all things else have already died away. But no! At the very instant that my consciousness is extinguished, another consciousness lights up—or rather, it was already alight: it had arisen the instant before, in order to witness the extinction of the first; for the first could disappear only for another and in the presence of another. I see myself annihilated only if I have already resuscitated myself by an act which is positive, however involuntary and unconscious. So, do what I will, I am always perceiving something, either from without or from within. When I no longer know anything of external objects, it is because I have taken refuge in the consciousness that I have of myself. If I abolish this inner self, its very abolition becomes an object for an imaginary self which now perceives as an external object the self that is dying away. Be it external or internal, some object there always is that my imagination is representing."

  I can follow the individual sentences, but I'm having trouble stating the argument in my own words, and I'd like your help with two things specifically. First, walk me through, step by step, what is actually going on at the pivotal move — "at the very instant that my consciousness is extinguished, another consciousness lights up... in order to witness the extinction of the first." Is Bergson describing a real temporal sequence of two mental events, or making a purely conceptual point about what any act of imagining extinction must already presuppose, and does it matter which reading is correct? Second, I'd like your own assessment, independent of my friend's: even granting that we can never actually form an image of total nothingness (there is always some perceiving "left over," whether inner or outer), does that show that the concept of "nothing" is incoherent and that the original question is therefore ill-posed — which is the stronger claim my friend wants — or does it only establish a fact about the limits of human imagination, leaving the more abstract question of why anything exists exactly as open as it was before?
