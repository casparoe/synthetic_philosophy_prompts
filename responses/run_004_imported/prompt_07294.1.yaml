  6.  **Refining the Nietzsche Facts (Mental Check):**
      *   *Cornaro:* In *Ecce Homo* ("Why I Am So Wise", Section 1), Nietzsche writes: "The case of Cornaro is the most harmful... His book... is the cause of countless untimely deaths." He argues Cornaro had a uniquely slow metabolism and his restrictive diet was suitable only for him, not a universal rule.
      *   *Ascetic Ideal:* In *Genealogy of Morals*, Essay 3, Nietzsche analyzes the ascetic ideal. He says philosophers *used* it to survive (to detach from suffering), but he ultimately critiques it as a will to nothingness. He definitely does not "praise it throughout his work as necessary." He praises *self-overcoming* and *discipline*, but explicitly distinguishes this from the *ascetic ideal* (which is rooted in self-denial out of hatred for life). Maya conflates "discipline" with "asceticism."

