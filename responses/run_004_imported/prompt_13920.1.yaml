answer: |-
  Good evening, everyone. Thank you for being here to celebrate eighteen years of [Daughter's Name].

  Eighteen years is a long time. It's enough time to build a life, to form a character, to become a person who stands on her own. Looking at her now, so capable and kind, it is tempting to look back and tell a story about how everything was destined to lead to this moment. It is tempting to say that every struggle was worth it, or that everything happened for a reason.

  But I want to be honest with you, and with her.

  Eighteen years ago, before [Daughter's Name] was even a concept, your mother and I stood at a crossroads. We knew there was a risk. We were told that if we waited, the odds of a specific condition would fade. If we didn't wait, the risk was real. We didn't wait. We made that choice for reasons that had nothing to do with a child, because there was no child yet to have reasons about. We made it for ourselves, in the dark.

  And because we made that choice, [Daughter's Name] exists exactly as she is.

  I know many of you know the challenges she has faced. I'm not going to stand here and pretend the last eighteen years have been easy. They haven't. There were nights of worry, appointments that drained us, and moments where the weight of it felt unbearable. I will not insult her resilience by calling those struggles "gifts." They were just hard.

  But there is a truth I need to speak, specifically for her, and for a couple of old friends of mine in the audience who will understand the precision of what I'm saying.

  People often say to parents in our situation, "Well, look at her now. It worked out for the best." They mean well. But it isn't logically true. There is no version of [Daughter's Name] waiting in the wings who is healthier. There is no alternate universe where she is different but still *her*. If we had waited, it wouldn't be a healthy [Daughter's Name] we would have had; it would have been a different child entirely.

  So, I am not standing here saying I am glad you have this condition. I am not saying it is "better" that you exist this way than another way. I am saying something simpler, and I hope more profound.

  I am saying that *you* are the one who exists. You are the specific, irreplaceable person standing in front of me. Your laugh, your stubbornness, the way you care for your friends, the way you see the world—it is all woven into the fabric of this one life. We do not love you *despite* the facts of your conception or your genetics. We love *you*, the person those facts produced.

  We didn't wait. And because we didn't, we got to know you. Not a hypothetical version of you, but the real you. And knowing you has been the privilege of our lives.

  So, [Daughter's Name], my wish for you is not that things had been different. My wish is that you continue to walk forward in this world exactly as you are, knowing that you were never a compromise, never a second choice, and never a mistake. You are simply, and wonderfully, you.

  Happy 18th Birthday. Let's raise a glass.
