answer: |-
  1. **Setting the Epistemic Bar**
  To begin, I want to clarify the threshold of your epistemic argument. You argue that because soldiers cannot reliably access the *jus ad bellum* status of their war, they are granted equal permission to fight. How much uncertainty is required to trigger this permission? Is it a total blackout on information, or does the mere existence of conflicting expert testimony among political leaders suffice to create the epistemic fog that levels the moral playing field?

  2. **The Consistency of Uncertainty (Required)**
  Your position rests heavily on the idea that epistemic uncertainty licenses conduct that would otherwise be forbidden. But in domestic ethics, uncertainty rarely grants permission; often, it demands caution. If a police officer is unsure whether a suspect is armed, we don't say they have "equal permission" to shoot; we say they must hold fire until certain. If uncertainty about the justice of a war is what licenses equal permission to kill, why doesn't comparable uncertainty excuse plenty of conduct we don't in fact treat as permissible in other high-stakes professions?

  3. **Follow-up to Question 2**
  *(Anticipating the guest will argue that war is unique because the cost of hesitation is national defeat or soldier death.)*
  If the uniqueness lies in the cost of hesitation, doesn't that shift the justification from *epistemic* (what I can know) to *consequentialist* (what happens if I wait)? And if it's consequentialist, aren't you vulnerable to the claim that fighting an objectively unjust war produces worse consequences overall, regardless of the soldier's ignorance?

  4. **Rules of Engagement as Epistemic Crutches**
  In the field, soldiers are often told that adherence to the Rules of Engagement (ROE) is the primary metric of moral conduct. Does your view imply that ROE are essentially a institutionalized solution to the epistemic problem? In other words, are ROE designed not just to limit violence, but to artificially construct the moral equality that soldiers cannot find in the facts of the conflict itself?

  5. **Excuse vs. Moral Right (Required)**
  Jeff McMahan draws a sharp distinction between a soldier who is *excused* for fighting (because they couldn't know better) and a soldier who possesses the *moral right* to kill. Your epistemic argument seems to claim the latter—that the uncertainty generates a genuine right, not just a pardon. Does your argument actually bridge that distinction, or does it simply relabel a robust excuse as a right to make the pill easier to swallow?

  6. **Follow-up to Question 5**
  *(Anticipating the guest will insist it is a genuine right because the duty to obey legitimate authority persists under uncertainty.)*
  If it is a genuine right, then the soldier on the "unjust" side does no wrong when killing an opposing combatant. But from the perspective of the victim—who is defending a just cause—how can their killer possess a moral right to end their life? Does your view require us to accept that two contradictory moral rights can exist simultaneously in the same interaction?

  7. **The Volunteer's Burden (Required)**
  I want to press on the difference between a conscript and a volunteer. A conscript has no choice; a volunteer makes a commitment. But consider a volunteer who deploys already suspecting the cause is unjust, perhaps due to public information available before enlistment. In your epistemic framework, does the voluntary assumption of risk override the epistemic deficit? Or does the "fog of war" still protect a volunteer who enlisted with doubts?

  8. **Follow-up to Question 7**
  *(Anticipating the guest will argue that once in theater, the soldier's epistemic position degrades regardless of prior doubts.)*
  If their epistemic position degrades in theater, does that mean the moral permission to kill *increases* the deeper they are deployed? That seems counterintuitive. If anything, shouldn't the moral burden be higher for the volunteer who suspected injustice at home, even if the fog thickens abroad?

  9. **Moral Residue and Aftermath (Closing)**
  Finally, I want to ask about the soldier's internal life after the war. Most accounts of the moral equality of combatants focus on liability and permission in the moment, but they rarely address moral residue. If a soldier fights in an objectively unjust war but follows your epistemic standard—acting with permission due to uncertainty—what does your view imply they should *feel* about their conduct afterward? Is guilt irrational for them, or is there still a tragic remainder that the philosophy cannot resolve?
