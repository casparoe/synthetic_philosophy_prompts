          *   *Nature of Cost:* The *marginal* cost of increasing signal intensity must be higher for low-quality signallers than for high-quality signallers.
          *   *Efficiency:* The signal *can* be beneficial overall (efficient). It doesn't have to be a net handicap. It just has to be *relatively* less costly for the good guy to produce more of it.
