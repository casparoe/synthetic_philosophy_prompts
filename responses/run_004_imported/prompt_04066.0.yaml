      *   **Penn & Számadó (2020):**
          *   *Critique:* Grafen's model is often cited as validating Zahavi, but the math allows for "efficient signaling" (index signals, revealing handicaps) where the net benefit is positive. Zahavi insisted on net cost (waste). Therefore, Grafen did not validate Zahavi's specific mechanism; he validated a broader class of honest signaling, of which Zahavi's is only a strict subset (and perhaps an empty one).

  3.  **Drafting the Comparison (Zahavi vs. Grafen):**
