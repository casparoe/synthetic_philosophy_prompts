answer: |-
  Your friend is correct about Hobbes's *ambition*, but you are correct about the *reception*. The tension you are feeling comes from the difference between a philosophical *method* and a mathematical *proof*.

  Hobbes undoubtedly wanted civil philosophy to be as certain as geometry. He was captivated by Euclid, and he structured his political works (especially *De Cive* and *Leviathan*) using a "resolutive-compositive" method: break society down to its simplest elements (individual humans), understand the laws of their motion (passions), and then reconstruct society logically from those first principles.

  However, historians of political thought contest the move from the state of nature to absolute sovereignty for several structural reasons that prevent Hobbes's argument from achieving the status of the Pythagorean theorem. Here is why the "geometric" analogy breaks down.

  ### 1. Stipulative Definitions vs. Empirical Claims
  In geometry, definitions are **stipulative**. When Euclid defines a triangle, he is not making a claim about the physical world; he is establishing a rule for the system. No one can argue that a triangle *should* have four sides, because within the system, it is defined as having three.

  In Hobbes, the "definitions" are actually **anthropological claims**. When Hobbes defines human beings as fundamentally egoistic, competitive, and driven by a perpetual desire for power, he is not merely stipulating a rule for a logical game. He is making a claim about human psychology and biology.
  *   **The Geometric Certainty:** *If* humans are X, *then* they need Y.
  *   **The Historical Dispute:** Historians and philosophers argue that humans are not necessarily X. If human nature is more cooperative (as Rousseau or Kropotkin argued) or capable of rational moral agreement without coercion (as Locke argued), the geometric deduction collapses. Because the premises are empirical and contestable, the conclusion cannot be mathematically certain.

  ### 2. Validity vs. Soundness
  In logic, an argument can be **valid** (the conclusion follows from the premises) without being **sound** (the premises are true). Your friend is arguing that Hobbes's argument is valid. You are noticing that historians question its soundness.

  Even if we grant Hobbes's premises (that the state of nature is a war of all against all), historians contest whether the conclusion (absolute, undivided sovereignty) is the *only* logical solution.
  *   **The Logical Gap:** Hobbes argues that to escape the state of nature, individuals must surrender all rights to a Sovereign. But critics argue this is a non-sequitur. Could a constitutional monarchy, a democracy, or a system of checks and balances also solve the coordination problem without requiring absolute submission?
  *   **The Pythagorean Contrast:** In geometry, there is no alternative to the Pythagorean theorem given the axioms. In politics, there are multiple institutional arrangements that could theoretically satisfy the condition of "security." Because the solution is not unique, it lacks geometric necessity.

  ### 3. The Normative Leap (Is vs. Ought)
  Geometry deals with what *is* (within its abstract system). Political philosophy deals with what *ought* to be. Hobbes attempts to derive an obligation (you *ought* to obey the Sovereign) from a factual prediction (if you don't, you *will* die miserably).

  This is known as the "naturalistic fallacy" (later formalized by Hume). Even if Hobbes proves with geometric certainty that disobedience leads to chaos, it does not logically prove that one is *morally obligated* to obey, only that it is *prudent* to do so. Historians contest this move because it conflates physical necessity (fear of death) with political obligation (duty to law). A geometric proof cannot bridge the gap between "I want to live" and "I must obey this specific King."

  ### 4. Rhetoric vs. Demonstration
  While Hobbes *claimed* to be writing science, scholars like Quentin Skinner have shown that *Leviathan* is deeply rhetorical. It was written during the English Civil War, and its goal was persuasion, not just demonstration.
  *   Hobbes uses metaphors (the Leviathan as a "Mortal God," the body politic, artificial chains).
  *   He appeals to specific fears relevant to 17th-century England.
  *   If the argument were truly geometric, the rhetoric would be unnecessary. The fact that Hobbes relies on evocative language suggests he knew the logic alone might not convince. Historians study the text as a political intervention, not just a logical treatise.

  ### 5. Constructibility
  Hobbes argued that civil philosophy is more certain than physics because, like geometry, we construct the object of study. We make the commonwealth; we do not just observe it.
  *   **The Counter-Argument:** While we construct the *laws*, we do not construct the *people*. In geometry, the materials (points and lines) behave exactly as defined. In politics, the "materials" (human beings) have their own agency, irrationality, and resistance. The "geometry" of politics is constantly disrupted by the unruly nature of the material. Therefore, the certainty of the construction is always provisional, not absolute.

  ### Summary
  Your friend is right that Hobbes **modeled** his argument on geometry. But you are right that it does not **function** as geometry.

  A geometric proof leaves no room for dispute because the axioms are arbitrary and the logic is closed. Hobbes's argument leaves room for dispute because:
  1.  **The axioms are empirical** (human nature) and debatable.
  2.  **The deduction is not exclusive** (absolute sovereignty isn't the only solution to insecurity).
  3.  **The conclusion is normative** (obligation) rather than descriptive.

  Historians treat the move from the state of nature to sovereignty as contested not because they fail to understand the logic, but because they recognize that political philosophy cannot achieve the certainty of mathematics. Hobbes's "geometric" method was a brilliant rhetorical strategy to lend authority to his conclusions, but it did not actually transform politics into math.
