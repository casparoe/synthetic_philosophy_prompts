      *   *Reason 2: The Gap in the Logic.* Does "absolute sovereignty" *necessarily* follow from "avoiding the state of nature"? Many argue limited government or democracy could also solve the coordination problem. The deduction isn't airtight.
      *   *Reason 3: Normative vs. Descriptive.* Geometry is value-neutral. Politics involves "oughts." Hobbes tries to derive an "ought" (obey the sovereign) from an "is" (fear of death), which is philosophically contentious (Hume's Guillotine, though later).
      *   *Reason 4: Historical Context.* Hobbes was writing during a Civil War. His "science" was polemical. Historians analyze the rhetoric and context, not just the logical form.
