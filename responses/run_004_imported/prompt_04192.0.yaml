      *   *Nuance:* Scanlon actually discusses this specific type of case (or similar). He argues that the principle governing promises is one no one could reject, and that principle covers cases where the promisee dies.
      *   *Hume's Weakness:* Hume explicitly says without the social convention, the words "I promise" are unintelligible. If the social convention implies "public," does a private promise count? Hume might say a private vow is different from a promise. This is a strong point against Hume.

