answer: |-
  This is a classic puzzle in moral philosophy, often referred to as the "deathbed promise" or "secret promise" objection. It is designed to stress-test theories that ground the obligation of promising in social utility or reliance.

  Your dinner debate captured the standard intuitive pushback against both views, but as you suspected, the simplified versions you were trading miss the sophisticated resources both Hume and Scanlon have available. However, those resources come at a cost.

  Here is a careful comparison of what each theory is actually committed to, how they apply to the grandmother case, and an assessment of which (if either) survives without smuggling in external assumptions.

  ---

  ### 1. Scanlon's Contractualism (Principle F)

  **The Core Commitment:**
  In *What We Owe to Each Other*, T.M. Scanlon grounds the wrongness of breaking a promise in **Principle F**. Roughly, Principle F states: If I intentionally lead you to expect that I will do X (unless you consent otherwise), knowing that you want this assurance, and I have good reason to believe you now have that expectation, then I must do X unless you consent otherwise.

  Crucially, Scanlon distinguishes this from a simple "reliance" view. The wrong is not merely that you relied on me and were harmed; the wrong is that I **invited your trust** and then betrayed it. The obligation is generated at the moment the assurance is given and accepted. It is a duty owed *to the person* based on the interaction that occurred between you.

  **Application to the Grandmother Case:**
  *   **The Friend's Objection:** Your friend argued that because the grandmother is dead, she has no current expectations or trust to violate.
  *   **Scanlon's Actual Resource:** Scanlon anticipates this. For Scanlon, the wrongness of breaking a promise is not necessarily about the *current* mental state of the promisee, but about the **justification owed for the betrayal of the assurance given when the promisee was alive.**
      *   When you made the promise, you invoked Principle F. You created a specific moral bond.
      *   Scanlon argues that moral principles must be ones "no one could reasonably reject." A principle that allowed promisors to disregard their obligations simply because the promisee died would likely be rejectable by anyone who values the ability to settle their affairs or secure their wishes before death.
      *   Therefore, the obligation persists because the *interaction* that grounded the obligation was valid when it occurred. The death of the promisee does not retroactively nullify the assurance given.

  **Does it Import External Resources?**
  Scanlon does not need to import a "natural duty" unrelated to promising, but he **does** need to import a specific view of **moral status after death**.
  *   Principle F typically governs relations between living agents. To make it work here, Scanlon must commit to the claim that we can owe duties *to* people who no longer exist, based on interests they held while alive.
  *   Scanlon is willing to pay this price. He argues that we have reasons to care about how we are treated after death (e.g., regarding our reputation or wishes), and thus principles governing those treatments are part of the contractualist framework.
  *   **Verdict:** Scanlon explains the obligation *as a promise* without abandoning his theory, provided one accepts his auxiliary claim that the dead retain certain moral claims based on prior interactions.

  ### 2. Hume's Conventionalism

  **The Core Commitment:**
  For Hume (in the *Treatise* and *Enquiry*), promising is an **artificial virtue**. There is no "natural" motive to keep a promise (like benevolence). Instead, humans invent a convention (a "form of words") to solve coordination problems.
  *   The obligation arises because society has a vested interest in the stability of this convention.
  *   To say "I promise" is to perform a speech act that only has meaning *within* the convention.
  *   We cultivate a "sentiment of morality" regarding promise-keeping because the *general practice* is useful to society.

  **Application to the Grandmother Case:**
  *   **The User's Objection:** You argued that because the promise is secret and non-repeatable, breaking it doesn't damage the convention or social utility.
  *   **Hume's Actual Resource:** Hume is not an act-utilitarian. He does not ask, "Does breaking *this* promise damage the system?" He asks, "Does adhering to the *general rule* support the system?"
      *   Hume argues that human judgment is biased. If we allow exceptions for "secret" or "harmless" breaches, we will inevitably erode the habit of fidelity.
      *   Therefore, the obligation holds because you must follow the **general rule** of the convention, even in cases where the immediate utility is obscure. To break the rule is to act contrary to the artificial virtue that makes society possible.
      *   Furthermore, Hume might argue that the *words* "I promise" trigger the sentiment of fidelity in the *promisor*. Even if the grandmother isn't there to feel betrayed, *you* are violating the sentiment of honesty you have cultivated as a social being.

  **Does it Import External Resources?**
  Hume faces a steeper climb. His theory relies on the promise being part of a **social convention**.
  *   **The "Private Language" Problem:** If the promise is truly secret (no one else knows it was made), is it actually part of the social convention? Hume suggests that without the public aspect of the convention, the words are just "mumbling."
  *   **The Import:** To save the obligation, Hume often has to pivot to **natural sympathy**. We feel for the grandmother's desire. But if the obligation comes from sympathy for her wish, it is no longer a *promise* obligation (artificial); it is a *benevolence* obligation (natural).
  *   If Hume insists it is a *promise* obligation, he must argue that the convention binds you internally even without public scrutiny. This requires a rigid rule-worship that borders on the intuitive "duty for duty's sake" view Hume explicitly rejects.
  *   **Verdict:** Hume struggles to explain why this is a *promissory* obligation rather than a general duty of benevolence. If the social utility is zero and the convention is not engaged publicly, the "artificial" bond is severed.

  ---

  ### 3. Comparative Assessment

  **Who Comes Out Ahead?**
  **Scanlon's account comes out ahead.**

  Here is why:
  1.  **Interpersonal vs. Systemic:** Scanlon grounds the obligation in the specific interpersonal transaction (the assurance given). That transaction happened. It is a historical fact. The grandmother's death changes the future, but it doesn't change the past transaction. Hume grounds the obligation in the systemic utility of the practice. In the grandmother case, the systemic utility is (by your stipulation) negligible. Scanlon's anchor is firmer in this specific case.
  2.  **The Nature of the Wrong:** For Scanlon, the wrong is betraying the trust *invited*. You invited her trust when she was alive. You betrayed it when you decided not to go. For Hume, the wrong is damaging the convention. If the convention is not damaged, Hume has to argue you are damaging *your own character* as a participant in the convention. This is plausible, but it shifts the focus from the grandmother to the promisor's virtue, which feels like a slight evasion of the duty *to her*.
  3.  **Handling the "Dead" Factor:** Scanlon has a dedicated framework for duties to the dead (as extensions of interests held while alive). Hume treats the dead largely as objects of memory; he lacks a robust mechanism for why a *conventional* rule binds us toward those who can no longer participate in the convention.

  **The "Importing" Charge:**
  Both theories do import resources, but Scanlon's import is less damaging to his core theory.
  *   **Scanlon** imports a **theory of posthumous interests**. He must argue that people have an interest in their wishes being respected after death. This is controversial, but it fits within contractualism (people would reject principles that ignore their posthumous interests).
  *   **Hume** imports a **rigid rule-following heuristic** or slides into **natural sympathy**. If he relies on sympathy, he admits the obligation isn't really about *promising* (the convention), but about *caring* (natural virtue). This undermines his specific claim that promising is a unique, artificial obligation.

  ### 4. Does the Case Discriminate Cleanly?

  You asked if the case discriminates between them as cleanly as you assumed. The answer is **no, not entirely.**

  There is a vulnerability in Scanlon's view that your friend missed, and a resilience in Hume's view that you missed.

  *   **Scanlon's Vulnerability:** Principle F requires that the promisee *want* the assurance. If the grandmother is dead, can she "want" anything? Scanlon solves this by referring to her past wants, but this requires a metaphysical stance on the persistence of interests. If you reject the idea that the dead have moral standing, Scanlon's account collapses here just as Hume's does.
  *   **Hume's Resilience:** Hume can argue that the "convention" is internalized. Even if *society* doesn't know, *you* know you are a member of the society that invented promising. To break the rule is to alienate yourself from the social contract that constitutes your moral identity. This is a stronger argument than the simple "social utility" calculation you attributed to him.

  **Conclusion:**
  The grandmother case is a stronger counter-example to Hume than to Scanlon.
  *   **Hume** is forced to admit that either the obligation is not truly "promissory" (it's just sympathy) or that the "convention" binds in a mystical, non-social way.
  *   **Scanlon** can maintain that the obligation is promissory, grounded in the past interaction, provided he accepts that moral relations survive death.

  If you want to win the argument, you should concede that Scanlon needs the "posthumous interests" premise, but argue that this is a smaller theoretical cost than Hume's cost of admitting that secret promises aren't really promises at all. Scanlon explains the *residual obligation* as a promissory one; Hume tends to explain it away as something else (sympathy or habit).

  **Recommendation:** Tell your friend that Scanlon wins on the specific mechanics of *promising*, but tell her she was right to sense that *both* theories rely on a deeper, unargued intuition: that the dead still matter. Scanlon builds that into his system; Hume tries to derive it from social utility and strains at the seams.
