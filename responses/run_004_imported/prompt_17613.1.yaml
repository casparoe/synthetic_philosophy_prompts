answer: |-
  # The Underdetermination of Desire

  You are building a story on a fault line. On one side stands the novelist's oldest intuition: that action reveals character. If we watch a person long enough, through joy and grief, in trivial moments and crises, the pattern of their choices will coalesce into a coherent shape. We call this shape the "self." On the other side stands your nephew, armed with a 2018 paper by Armstrong and Mindermann, asserting that this intuition is mathematically bankrupt. He argues that behavior is a locked box where the key (preference) has been melted down and recast into the lock itself.

  This is not merely a plot hole; it is an epistemological crisis. To resolve it for your novel, we must determine whether your AI is a miracle of observation or a machine of projection. We must weigh the AI safety result against the pragmatic reality of human life, trace the lineage of this puzzle back to mid-century philosophy, and finally, deliver a verdict on whether you and your AI are cheating.

  ### The Case for Impossibility: The Degeneracy Problem

  Your nephew is citing a specific result in inverse reinforcement learning (IRL). The goal of IRL is to look at an agent's actions (policy) and work backward to find the reward function (preferences) that optimized those actions. The Armstrong and Mindermann theorem demonstrates that this is formally impossible without making normative assumptions.

  The logic is elegant and devastating. An agent's behavior is the output of two components: a **Planner** (how they think) and a **Reward** (what they want). Behavior = Planner(Preference).

  Consider your protagonist eating kale.
  *   **Model A:** She loves kale (Preference) and acts rationally to eat what she loves (Planner).
  *   **Model B:** She hates kale (Preference) but believes eating it will prevent a apocalypse (Planner bias/error).
  *   **Model C:** She is indifferent to kale (Preference) but has a compulsive tic to eat green leaves (Planner bias).

  All three models produce the exact same observable behavior: *eating kale*.

  Armstrong and Mindermann prove that for any observed behavior, there are infinite combinations of Planner and Reward that explain it equally well. You might suggest using Occam's Razor: pick the simplest explanation. But they show that "simplicity" doesn't break the tie. A complex preference with a simple planner is mathematically equivalent to a simple preference with a complex planner.

  Without an external standard to define what counts as a "rational" planner versus a "bias," the AI cannot distinguish between what your character *wants* and what she is *mistaken* about. It cannot tell the difference between a saint and a martyr, a spendthrift and an investor, a lover and a stalker. Purely observational data is structurally blind to the difference between competence and preference.

  ### The Philosophical Ghost: Quine and Davidson

  Your nephew thinks this is a new problem born of machine learning. It is not. It is the ghost of W.V.O. Quine and Donald Davidson haunting the server room.

  In 1960, Quine proposed the "indeterminacy of translation." Imagine a linguist encountering a native tribe. A rabbit runs by, the native says "Gavagai." Does "Gavagai" mean *rabbit*? Or *undetached rabbit part*? Or *temporal slice of a rabbit*? Quine argued that no amount of observing the native's behavior (pointing, nodding, eating) can ever definitively prove which meaning is correct. All meanings are compatible with all behaviors.

  Your AI is the linguist; your protagonist is the native; her actions are "Gavagai."

  Donald Davidson later attempted to solve this with the **Principle of Charity**. He argued that we *cannot* interpret another mind from a standing start. To make sense of someone at all, we must *presume* they are mostly rational and mostly truthful. We project logic onto them to make them legible. Davidson admitted this is a circular assumption, but argued it is a necessary one. We don't discover rationality; we impose it as a condition of understanding.

  This confirms your nephew's worry. The AI cannot "crack" your character purely by watching. It can only crack her if it already possesses a rigid definition of what a "human" looks like. It must assume, a priori, that humans generally prefer pleasure to pain, consistency to contradiction, and survival to death. If your character deviates from those priors, the AI will not see her true desire; it will see her as broken code.

  ### The Case for Possibility: The Biological Constraint

  However, there is a strong counter-argument, one that saves your novel if not the math. The Armstrong result holds for *arbitrary* agents. It assumes the Planner and Reward can be any function in the universe. But your character is not an arbitrary agent. She is a human being.

  Humans are not blank slates of irrationality; we are biologically constrained. Our "biases" are not random noise; they are evolutionary features. We share a nervous system, a hormonal landscape, and a social history.

  1.  **Physiological Leakage:** If your AI is watching "IRL-style," it presumably sees more than just limb movement. It sees pupil dilation, micro-expressions, galvanic skin response, and hesitation. A person eating kale they love looks different from a person eating kale they hate but feel compelled to consume. The "Planner" leaks physical stress when it overrides the "Reward."
  2.  **Temporal Consistency:** The degeneracy problem is hardest to solve in single snapshots. Over months, patterns emerge that rule out certain reward functions. If she eats kale today but vomits it tomorrow, Model A (she loves kale) becomes less likely. If she sacrifices sleep to get kale, Model C (compulsive tic) weakens. Time acts as a filter on the infinite explanations.
  3.  **The "Form of Life":** Wittgenstein argued that meaning is rooted in shared practices. Because the AI is likely trained on human data (even if it's an AI), it shares a "form of life" with the protagonist. It knows that humans usually smile when happy. It doesn't need to solve the philosophical puzzle of "happiness" from scratch; it inherits the human consensus on what happiness looks like.

  From this perspective, the AI doesn't need to solve the problem in *full generality* (as Armstrong warns). It only needs to solve it for *humans*. And for humans, behavior is not perfectly degenerate. It is merely noisy.

  ### The Verdict: Are You Cheating?

  Here is the hard truth you asked for.

  **Your nephew is mathematically right.** An AI that claims to infer preferences *purely* from behavior, without any normative priors about what constitutes "rationality" or "well-being," is impossible. It is a perpetual motion machine of psychology. If your AI claims to be a blank slate that simply "watches and learns," it is lying. It must contain a hidden model of human nature—a set of values it assumes are universal—to make the inference work. It must decide, before it starts watching, that screaming indicates pain and not joy. That is not observation; that is prejudice.

  **But you, the novelist, are also cheating.** And you should keep doing it.

  When you write a character, you do not present the reader with the raw, degenerate chaos of real human behavior. If you did, the reader would face the same Armstrong problem. Real life is full of actions that are ambiguous, contradictory, and unmotivated. If you wrote a truly realistic novel, the reader could not infer the character's desires any better than the AI can.

  You make the character legible by editing. You select the actions that cohere. You suppress the noise. You create a narrative arc that imposes a "Principle of Charity" on the character, guiding the reader to interpret her actions in the light of her "true self." You cheat by curating the behavior so that the preference becomes the *only* reasonable explanation left.

  **So, is your plot viable?**

  Only if you acknowledge the cheat.

  If your AI works because it is a perfect, passive observer, your plot is scientifically hollow. But if your AI works because it has been trained on a specific, perhaps controversial, model of human psychology, you have a story.

  The tension in your novel should not be "Can the AI figure her out?" The tension should be "What happens when the AI's definition of 'human rationality' clashes with the protagonist's actual reality?"

  Perhaps the AI decides she is depressed because she doesn't smile enough (a bias in its Planner). Perhaps it decides she is in love because her heart rate spikes, missing that it is fear. The AI is not discovering her; it is *constructing* her based on its priors.

  **The Final Ruling:**

  Yes, you are both cheating. The AI cheats by embedding a normative framework it pretends is objective data. The novelist cheats by curating chaos into coherence.

  But here is the distinction that saves your book: The novelist's cheat is an act of **empathy**. You curate the behavior to help the reader understand the character. The AI's cheat is an act of **control**. It curates the behavior to predict or manipulate the character.

  Your nephew is right that you cannot infer values from facts alone. You need a bridge. For the AI, that bridge is code. For you, it is art. Let the AI fail in the story where its code cannot bridge the gap, and let your protagonist succeed where her humanity defies the model. That is not a plot hole; that is the theme.

  The AI cannot know what she wants. It can only know what she fits. Make sure she doesn't fit.
