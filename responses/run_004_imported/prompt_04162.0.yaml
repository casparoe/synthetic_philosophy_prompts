answer: |-
  This is a superb close reading of the primary source. You are correct that Boltzmann and Schütz are arguing for **macroscopic fluctuations** (entire galaxies or "worlds"), whereas the modern "Boltzmann Brain" (BB) problem arises when we apply their logic to **microscopic fluctuations** (isolated observers).

  Here is the unpacking of the probabilistic machinery and the specific conceptual addition that turns their solution into a reductio ad absurdum.

  ---

  ### 1. The Probabilistic Reasoning: Fluctuations and Measure

  To spell out the logic explicitly, we must translate Boltzmann's verbal argument into statistical mechanics.

  **The Setup**
  *   **State Space:** The universe is a closed system in thermal equilibrium (maximum entropy, $S_{\text{max}}$).
  *   **Dynamics:** The system evolves ergodically over infinite time (or possesses infinite spatial volume). It explores all possible microstates compatible with its energy.
  *   **Fluctuation:** Occasionally, the system randomly deviates from equilibrium. Let $\Delta S$ be the magnitude of the entropy decrease required to produce a specific state (e.g., a solar system, or a brain).

  **The Probability of a Single Trial**
  According to Boltzmann's entropy formula ($S = k_B \ln \Omega$), the probability $p$ of finding a specific subsystem in a state with entropy lower than equilibrium by an amount $\Delta S$ is given by the Boltzmann factor:
  $$ p \approx e^{-\Delta S / k_B} $$
  For a "world" like ours (stars, galaxies, history), $\Delta S$ is astronomical. Thus, $p$ is exponentially close to zero.

  **The "Great Enough" Universe (The Law of Large Numbers)**
  Boltzmann's move relies on the number of independent trials, $N$.
  *   If the universe is spatially infinite, $N$ is the number of causally disconnected Hubble volumes.
  *   If the universe is temporally eternal (static), $N$ is the number of independent time-steps (Poincaré recurrence cycles).

  The probability that **at least one** such region exists in the universe is:
  $$ P(\text{exists}) = 1 - (1 - p)^N $$
  As $N \to \infty$, $P(\text{exists}) \to 1$, regardless of how small $p$ is (provided $p > 0$).

  **The Requirement on the Universe**
  You asked what this requires of the universe as the target deviation becomes more extreme.
  To make the expected number of fluctuations $\lambda = N \cdot p$ greater than 1, the size/duration of the universe ($N$) must scale inversely with the probability:
  $$ N \gtrsim e^{\Delta S / k_B} $$
  Because $\Delta S$ scales with the mass and complexity of the fluctuation, the required size of the universe grows **exponentially** with the size of the "world" you are trying to explain.
  *   To fluctuate a solar system: The universe must be exponentially larger than a solar system.
  *   To fluctuate a single brain: The universe must be exponentially larger than a brain (which is trivially satisfied by even a modest infinite universe).

  **The Anthropics**
  Boltzmann's final move is selection bias. We cannot observe the equilibrium background because no observers exist there. We necessarily find ourselves in one of the rare fluctuations. Therefore, the fact that we observe a low-entropy state does not disprove the equilibrium hypothesis; it merely locates us within it.

  ---

  ### 2. From "Worlds" to "Brains": The Self-Undermining Addition

  You noted that Schütz and Boltzmann reason about "worlds" with "visible motion and life," not isolated brains. To turn their argument into the modern BB paradox, two specific assumptions must be added.

  #### Addition A: The Principle of Typicality (Reference Class)
  Boltzmann implicitly assumes we are typical observers *within the set of all observers generated by the theory*.
  *   **Boltzmann's Assumption:** The set of observers is dominated by those who evolve in large, long-lasting fluctuations (like our visible universe).
  *   **The BB Addition:** We must define the reference class as **all conscious observer-moments**. If the theory generates 10 evolved observers for every $10^{10^{50}}$ Boltzmann Brains, we should assume we are Boltzmann Brains.

  #### Addition B: Entropy Minimization (The Complexity Penalty)
  This is the crucial physical addition. Boltzmann treated the fluctuation required for "our world" as a single unit. Modern statistical mechanics recognizes that fluctuations have internal structure.
  *   **The Observation:** Our current empirical data is limited to our immediate conscious experience (sensory inputs, memories).
  *   **The Fluctuation Cost:**
      *   **Scenario 1 (Boltzmann's World):** To fluctuate a whole universe that *contains* a brain with memories of a past, you need an entropy drop $\Delta S_{\text{universe}}$.
      *   **Scenario 2 (Boltzmann Brain):** To fluctuate *only* a brain with the *illusion* of a past and a surrounding universe, you need an entropy drop $\Delta S_{\text{brain}}$.
  *   **The Inequality:** $\Delta S_{\text{universe}} \gg \Delta S_{\text{brain}}$.
      The number of particles and the coordination required to build a galaxy are vastly higher than that required to build a single brain.
  *   **The Ratio:** Since probability scales as $e^{-\Delta S}$, the ratio of BBs to Evolved Observers is roughly:
      $$ \frac{N_{\text{BB}}}{N_{\text{Evolved}}} \approx e^{(\Delta S_{\text{universe}} - \Delta S_{\text{brain}}) / k_B} $$
      This number is not just large; it is incomprehensibly vast (often estimated around $10^{10^{50}}$ or higher).

  #### Why Is This Addition "Natural"?
  It feels like a cheat to say "maybe the external world isn't real," but in the context of Bayesian inference and statistical mechanics, it is the **minimum description length** argument.
  1.  **Empirical Minimalism:** All we know for certain is our current mental state. Any belief in an external past or future is an inference.
  2.  **Likelihood Maximization:** If we are evaluating the hypothesis "The universe is in eternal equilibrium," we must calculate the likelihood of our data under that hypothesis. The hypothesis predicts that minimal fluctuations are exponentially more common than complex ones. Therefore, the likelihood that we are a minimal fluctuation is exponentially higher.
  3.  **Indifference:** Without a specific physical law that *forbids* small fluctuations while *allowing* large ones (which equilibrium thermodynamics does not provide), we must assign probability mass proportional to the phase space volume. The phase space volume for "brain-sized fluctuation" dwarfs "universe-sized fluctuation."

  ### 3. Why It Is Self-Undermining

  The reason this is considered a *reductio ad absurdum* rather than just a weird prediction is **Cognitive Instability**.

  If you accept the Schütz/Boltzmann argument *plus* the Typicality/Minimization additions:
  1.  **Conclusion:** I am almost certainly a Boltzmann Brain.
  2.  **Implication:** My memories of reading Boltzmann, my understanding of thermodynamics, and my observation of a consistent external world are all random thermal noise, not records of actual events.
  3.  **Undermining:** The physical reasoning (thermodynamics, statistical mechanics) I used to conclude I am a Boltzmann Brain relies on the validity of my memories and observations. If I am a BB, that reasoning is untrustworthy.
  4.  **Result:** The theory predicts that its own believers are irrational hallucinations. A theory that predicts its own evidence is false is empirically incoherent.

  ### Summary
  Boltzmann and Schütz saved the Second Law by suggesting our low-entropy world is a rare statistical fluctuation in an infinite equilibrium universe.
  *   **The Math:** An infinite number of trials ($N \to \infty$) ensures that even exponentially rare events ($p \to 0$) occur frequently ($Np \gg 1$).
  *   **The Turn:** Modern physics notes that "isolated observer" fluctuations are exponentially cheaper (in entropy) than "whole universe" fluctuations.
  *   **The Defeat:** If the theory is true, we should be the cheaper fluctuation. But if we are the cheaper fluctuation, our evidence for the theory is fake. Thus, the "Eternal Equilibrium" model is rejected, not because it can't produce us, but because it produces **too many** of the wrong kind of us.

  This is why modern cosmology generally seeks a **boundary condition** (like the Past Hypothesis/Big Bang) to explain low entropy, rather than relying on statistical fluctuations in an eternal background.
