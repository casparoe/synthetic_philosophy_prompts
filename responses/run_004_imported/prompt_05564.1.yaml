      *   **Key Counter-Arguments:**
          1.  *Causal Reach:* You affect a finite patch.
          2.  *Value Density:* Average value per region matters.
          3.  *Uncertainty:* We don't know for sure the universe is infinite (or ethically relevantly infinite).
