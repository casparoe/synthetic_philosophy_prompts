          *   *Verdict:* Erin wins this round. She correctly identifies that choosing log-wealth is a utility assumption, not a law of nature.

      *   **Move 5 (Jonah):** Claims it's stronger than preference. If betting forever, probability he ends up ahead approaches 1. "Certainty in the limit" is objective, not utility-dependent.
