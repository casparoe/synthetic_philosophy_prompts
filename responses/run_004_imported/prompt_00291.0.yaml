  *(Self-Correction during drafting)*: I need to make sure I don't confuse "surrogate goal" with "decoy." A surrogate goal is something the agent *adopts* as a terminal value. The agent actually pursues it. The trick is that it's low-stakes for the world, but high-stakes for the agent.
