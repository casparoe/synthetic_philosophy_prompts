      *   **Davidson's Radical Interpretation:** Starts from scratch but assumes we can identify *when* a speaker holds a sentence true. Uses a Tarskian truth theory. Relies on the Principle of Charity (maximize agreement/truth). Result: Inscrutability of Reference remains.
      *   **The Crux:** Does Davidson's move (Charity + Truth Theory) *reduce* the scope of indeterminacy compared to Quine, or does it just *accept* it differently?
