      *   **Clarify Madison's Conception of "The People":** It's not an aggregate of living individuals. It's a trans-generational political entity. The "People" have a "character" or "interest" that persists even if the individuals change.
      *   **Distinguish "Will" vs. "Passion":** Madison isn't saying "The People are stupid." He's saying "The People are human." Humans have moments of mania. The Senate is a cooling saucer (to borrow Washington's later metaphor).
