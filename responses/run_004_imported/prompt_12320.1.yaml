answer: |-
  You are absolutely right to feel that the journalistic shorthand has drifted into caricature. The "religious conversion" reading of *The Structure of Scientific Revolutions* (1962) drove Kuhn up the wall for the last 30 years of his life. He spent his later career (collected in *The Road Since Structure*) specifically trying to decouple **incommensurability** from **irrationality** and **relativism**.

  Here is the precise breakdown of Kuhn's mature position, the mechanism of "local" incommensurability, and how you can write about it without triggering a philosopher.

  ### 1. The Pivot: From Global Holism to Local Taxonomy
  In 1962, Kuhn wrote loosely about "worlds" changing. This invited the interpretation that Newton and Einstein literally lived in different universes and couldn't understand each other. This triggered the Davidson/Putnam objection: *If two theories are totally untranslatable, how do you know they are rivals? To disagree, you must be talking about the same thing.*

  Kuhn conceded that **global** incommensurability was untenable. In his mature work, he restricted incommensurability to **local clusters of concepts** within a **taxonomic structure**.

  *   **Old View:** The whole paradigm is a gestalt; you can't step outside it.
  *   **Mature View:** Scientific vocabularies are structured like biological taxonomies (genus/species). Incommensurability occurs when the *boundaries* of these categories shift.

  ### 2. The Mechanism: The "No-Overlap Principle"
  This is the technical engine you need to understand. Kuhn argued that natural kind terms (like "planet," "element," "mass," "species") function within a hierarchy. A fundamental rule of these hierarchies is the **No-Overlap Principle**: two distinct kind-terms at the same level of a taxonomy cannot overlap. (e.g., A mammal cannot be a reptile; a planet cannot be a star).

  Incommensurability happens when a revolution changes the *criteria* for membership in a category, violating the principle across the transition.

  **The Classic Example: "Planet"**
  *   **Ptolemaic Taxonomy:** The universe contains "planets" (wandering stars) and "fixed stars." The Sun is a planet. The Earth is not.
  *   **Copernican Taxonomy:** The universe contains "stars" (fixed) and "planets" (orbiting the sun). The Sun is a star. The Earth is a planet.

  You cannot translate "planet" from Ptolemy to Copernicus term-for-term. If you say "The Sun is a planet," a Copernican hears a category error (like saying "The Sun is a reptile"). The *term* is the same, but its place in the taxonomic structure has shifted.

  **Why this isn't "Total Untranslatability":**
  We can understand Ptolemy. We just can't map his word "planet" to our word "planet" without adding a footnote. We have to learn his taxonomy as a second language. This defeats the Davidson objection: we *can* recognize them as rivals because we can become **bilingual**.

  ### 3. How "Incommensurable but Comparable" Holds Together
  This is the crux of your question. If there is no common measure (*in-commensurable*), how do we judge one better than the other (*comparable*)?

  Kuhn argues that **comparison does not require neutral translation; it requires bilingual competence.**

  1.  **Rational Choice is not Algorithmic:** Kuhn never claimed there was a formula to prove Theory B is "True" and Theory A is "False." He claimed the choice is *reasoned*, not *compelled*.
  2.  **Shared Values, Different Weights:** Competing paradigms share epistemic values (accuracy, consistency, scope, simplicity, fruitfulness). However, Paradigm A might prioritize *scope* while Paradigm B prioritizes *accuracy*. Scientists debate these weights. That debate is rational, even if there's no final arithmetic sum.
  3.  **Puzzle-Solving:** The ultimate comparison is pragmatic. Can the new taxonomy solve the anomalies that stalled the old one? If the Copernican taxonomy allows for better navigation predictions than the Ptolemaic one, we can compare their success rates without needing the word "planet" to mean the exact same thing in both.

  **The Logic:**
  *   **Incommensurable:** You cannot substitute terms without loss of meaning (due to taxonomic restructuring).
  *   **Comparable:** You can evaluate the respective puzzle-solving success of the two taxonomies using shared epistemic values.

  ### 4. What Kuhn Rejected (The Relativist Label)
  Kuhn hated the label "relativist." His mature position was that science *does* progress, but not toward a pre-existing "Truth."

  *   **Journalistic Trope:** "Science doesn't get closer to truth, it just changes stories."
  *   **Kuhn's Mature View:** Science evolves like biological natural selection. It progresses toward **greater adaptive fitness** (puzzle-solving capability), not necessarily toward a correspondence with Reality-with-a-capital-R.
  *   **Why it matters:** It avoids the "anything goes" Feyerabend trap. You can't just invent a new paradigm; it has to handle the existing data better than the predecessor, even if it categorizes that data differently.

  ### 5. Cheat Sheet for Your Writing
  To stop the hand-waving, swap these phrases:

  | **Avoid This (The Caricature)** | **Use This (The Mature Kuhn)** |
  | :--- | :--- |
  | "Paradigms are incommensurable worldviews." | "Paradigms rely on **taxonomic structures** that don't map cleanly onto one another." |
  | "Scientists can't understand each other." | "Scientists must become **bilingual** to understand rival theories; term-for-term translation fails." |
  | "There is no rational way to choose." | "Choice is **reasoned but not algorithmic**; it relies on weighing shared values like scope and accuracy." |
  | "Science doesn't progress." | "Science progresses in **puzzle-solving capability**, not necessarily toward a final Truth." |
  | "It's like a religious conversion." | "It involves a **shift in category boundaries** (e.g., what counts as a 'planet' or 'mass')." |

  ### The One-Sentence Summary for Your Next Piece
  > "Kuhn's mature view wasn't that rival theories are mutually unintelligible, but that their core concepts are defined by different taxonomic structures, meaning we can compare their problem-solving success without being able to translate their vocabularies term-for-term."

  ### A Note on "Mass" (The Physics Example)
  If you write about physics, be careful with the "Mass" example (Newton vs. Einstein). Kuhn used this in 1962 to say "Newtonian mass is not Einsteinian mass." Later, he clarified this isn't just a definition change, but a structural one. In Newton's taxonomy, mass is conserved and invariant. In Einstein's, it's convertible with energy. You can't just say "Einstein corrected Newton"; you have to say "Einstein restructured the category of physical properties such that 'mass' occupies a different node."

  ### Final Philosophical Sanity Check
  The philosopher you interviewed was likely reacting to the **Strong Social Constructivist** reading of Kuhn (common in the 90s Science Wars). That reading claimed Kuhn said truth is *made* by consensus. Kuhn's later work pushes back: nature resists. If your taxonomy doesn't hook onto the world in a way that allows prediction, the paradigm dies. The incommensurability is linguistic/categorical, not ontological. We are all talking about the same world, but we are carving it at different joints.

  If you frame it as **"competing ways of carving nature's joints"** rather than **"competing realities,"** you will be safe.
