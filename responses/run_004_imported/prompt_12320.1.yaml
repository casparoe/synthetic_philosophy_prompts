  7.  (Mental Sandbox): *Wait, did Kuhn accept Davidson's critique?* He accepted the *force* of it (that total untranslatability is self-refuting) but didn't adopt Davidson's solution. He refined his own definition of incommensurability to avoid the trap. I need to make sure that distinction is clear. Kuhn didn't say "Okay, you're right, I'm wrong." He said "Okay, you're right that *my formulation* was vulnerable, so here is the precise formulation."

