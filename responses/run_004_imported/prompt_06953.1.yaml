      *   *B (Basic/Technical Patch):* Approaches that work mathematically in specific contexts but miss the deeper agency issue. Armstrong Indifference (1) is a mathematical patch. Safe-Interruptibility (3) is an RL patch.
      *   *C (Compromised/Sidestepping):* Approaches that avoid the core tension. Myopia (6) sidesteps long-term convergence but doesn't solve the immediate will.
      *   *F (Failing/Irrelevant to Agency):* Approaches that admit the agent is hostile but constrain it physically. Boxing (7).

