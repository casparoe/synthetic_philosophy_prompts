      *   *Epistemic Game Theory:* The debate touches on the difference between *substantive rationality* (maximizing given beliefs) and *epistemic rationality* (how beliefs are formed/updated).
      *   *The "Missing" Point:* Both might be treating "rationality" as monolithic. The real issue is that BI is a *solution concept* dependent on specific epistemic conditions that are arguably impossible to satisfy in practice (logical omniscience). Also, they might be missing the distinction between *knowing* the opponent is rational and *believing* the opponent believes *you* are rational.
      *   *Key Insight:* The "Paradox" isn't that BI is wrong, but that CKR is an impossibly strong condition for extensive form games. The missing piece is often the recognition that BI is not a *normative* requirement of rationality per se, but a consequence of a specific, very strong epistemic state (CKR) that collapses upon the first deviation.

