      *   *Check:* Did I address Elena's Bayes point correctly? Yes, standard Bayesian updating breaks down at probability zero. This requires "conditional probability systems" or "trembles."
      *   *Tone:* Keep it academic but accessible, suitable for a philosophy of economics context.
      *   *Verdict:* Ensure I don't just say "Elena wins." I need to say who has the better of the *specific move*.
      *   *Move 1:* Marcus (Standard definition).
