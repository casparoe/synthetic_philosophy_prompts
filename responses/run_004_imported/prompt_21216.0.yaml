      *   **Round 2: Elena's Rebuttal (2)**
          *   *Claim:* Origin doesn't matter if the state is sincere. Analogy: Running/Vegetables. People force themselves, then genuinely like it.
          *   *Strengths:* Strong empirical analogy. Psychological mechanisms of habituation and cognitive reframing are real. "Fake it 'til you make it" is a valid psychological pathway.
          *   *Weaknesses:* Might be overlooking the specific nature of the *incentive*. Running is often for health (internalizable value); a bonus is purely transactional.
          *   *Verdict:* Stronger than Sam's opening. She shifts the burden from "why did you start?" to "what is the state now?"

      *   **Round 3: Sam's Distinction (3)**
