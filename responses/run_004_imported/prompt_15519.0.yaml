      *   **Key Concept 1: Moral Licensing vs. Moral Burden:** Discuss the unfairness of demanding sacrifice without sharing it.
      *   **Key Concept 2: Credibility and Trust:** Hypocrisy erodes trust. If she lies/slacks on this, what else?
      *   **Key Concept 3: The Nature of the Request:** Biking is a lifestyle change. Flying is a luxury. The scale might differ, but the *principle* of sacrifice matters.
      *   **Key Concept 4: Systemic vs. Individual:** Maybe touch on how focusing on individual footprints (both biking and flying) can be a distraction, but since K is making it individual, she has to play by individual rules.
