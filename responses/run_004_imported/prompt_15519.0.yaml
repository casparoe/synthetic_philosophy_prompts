      *   *The "Costly Signaling" Theory:* This is a strong evolutionary psych angle. Preaching is cheap. Doing is costly. If you don't pay the cost, your signal is noise.
      *   *The "Fairness" Angle:* It feels like K is trying to maximize her utility (fly everywhere) while minimizing her guilt by policing others. That's using the friend as a guilt-absorption mechanism.
      *   *The "Efficacy" Angle:* K's approach is empirically bad activism. It turns people off. So the user is right to be annoyed because K is being *counterproductive*.

  6.  **Addressing the "ACX/Twitter" Reference:**
