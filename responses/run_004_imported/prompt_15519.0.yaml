      *   **Effectiveness/Influence:** Hypocrites are less persuasive. People tune them out. So, practically, K is doing a bad job of advocacy.
      *   **Shared Burden/Solidarity:** Climate change requires collective action. If K opts out of the hard stuff (flying) but demands the easy stuff (biking) from others, it feels like unfair distribution of effort.
      *   **Signaling vs. Action:** K might be signaling virtue without paying the cost. This devalues the signal.
      *   **The "Marginal Impact" Argument:** Maybe K thinks her flying brings joy/value that outweighs the cost, while the user's driving is "wasteful." But K hasn't made that case; she just admitted fault.
      *   **Relationship Dynamics:** A friend lecturing a friend implies a certain equality. If K places herself above the rules she imposes, it disrupts the friendship dynamic.

