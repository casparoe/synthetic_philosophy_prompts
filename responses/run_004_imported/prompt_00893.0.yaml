      *   *Good sense escape hatch?* Yes, *bon sens*. This is crucial. It prevents infinite regress/skepticism.
      *   *Quine's radicalism:* It's about the *status* of the statements. For Quine, even "2+2=4" is theoretically revisable if it helps simplify the total web.

