      *   *Actually, a better route for the user:* Focus on the distinction between *external* attribution of consistency vs. *internal* proof. The mind stands outside $F$ to evaluate it. If the mind *is* $F$, how can it stand outside? Because the mind is not *bound* by the axioms of $F$ when evaluating $F$. It uses semantic understanding.

      *   *Okay, let's settle on the strongest philosophical defense:* It's not that we prove Con($F$). It's that we perceive the truth of $G_F$ semantically. The mechanist confuses *syntactic derivability* with *semantic truth*. The mind accesses truth directly (Platonism). If you reject Platonism, Lucas loses. If you accept it, Lucas wins. The consistency objection assumes a formalist/proof-theoretic epistemology. The reply is to shift to a semantic epistemology.

      *   *Wait, one more thing:* The "Consistency Objection" relies on the idea that we can't be *sure* we are consistent. Penrose replies: We are not sure we are consistent in the sense of a formal proof, but we are sure of the *truth* of the axioms we accept. If we accept PA, we accept it as true. If it's true, it's consistent. We don't need a proof of consistency; we need a justification of truth.

