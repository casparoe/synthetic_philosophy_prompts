answer: |-
  Here are ten interview questions designed to press on the technical and philosophical weak points of Evidential Cooperation in Large Worlds (ECL), specifically blocking the common deflection that these are merely general problems of infinite ethics.

  ### 1. The Evidential vs. Functional Gap
  ECL is often framed as an application of Evidential Decision Theory (EDT), but many in the rationalist community have moved toward Functional Decision Theory (FDT) to handle Newcomb-like problems. FDT relies on logical counterfactuals—essentially treating your decision as the output of a function. However, critics note that FDT only forces cooperation when agents are running *identical* source code, whereas ECL asks us to cooperate with agents who are merely *similar* or correlate in their reasoning. Why does the ECL argument require the weaker, correlation-based link of EDT rather than the stricter logical link of FDT, and doesn't relying on mere correlation open you up to the "Newcomb's Soda" style objections where you manipulate the evidence without changing the outcome?

  *   **Follow-up:** If you reply that FDT is too strict for the real world, I'm worried that invites the standard objection: "If the correlation isn't logical identity, why isn't this just magical thinking?" If the answer is that FDT *does* support ECL, can you point to a formal derivation showing FDT cooperates with non-identical but similar agents in a large world, or are we relying on an intuition that FDT hasn't yet formalized?

  ### 2. Delimiting the Reference Class
  A core mechanic of ECL is identifying which causally disconnected agents share your decision procedure enough to warrant cooperation. But decision procedures are entangled with values. If I encounter an agent who reasons exactly like me but values paperclips above all else, ECL suggests I should help them make paperclips in exchange for them helping me promote human welfare. How do you formally delineate the reference class of "cooperators" without smuggling in a normative assumption that only *good* values count? If you include *all* similar reasoners, aren't you potentially trading away resources to malevolent agents who won't actually honor the bargain because their utility function doesn't value your welfare?

  *   **Follow-up:** I anticipate the response that "we only trade with agents who value the trade." But in an acausal setting, they don't know I exist. If the defense is that we only trade with agents who *would* value the trade if they knew, aren't we just assuming the conclusion—that acausal trade is possible—to define the reference class? How do you break that circularity without arbitrarily excluding inconvenient agents?

  ### 3. Acausal Loops and Convergence
  In a sufficiently large or infinite world, the graph of acausal influence might not be a simple one-way street; it could involve loops where Agent A influences B, who influences C, who influences A. In game theory, we usually look for Nash equilibria, but in acausal settings with infinite agents, it's unclear if a stable fixed point even exists. When you model these interactions, do you have any guarantees that the iterative process of "I cooperate because they cooperate because I cooperate" converges to a stable solution, or does the math break down before we get to any action-guiding verdicts?

  *   **Follow-up:** If you say "we assume idealized agents where it converges," my concern is that ECL is supposed to guide *actual* longtermist action now. If the convergence depends on specific topological properties of the multiverse that we can't verify, isn't acting on ECL essentially betting on a specific mathematical structure of reality that might not obtain? How do we act if the system is chaotic rather than convergent?

  ### 4. Reduction to Moral Uncertainty
  If we strip away the multiverse framing and the infinite arithmetic, does ECL offer any action guidance that isn't already covered by standard moral uncertainty? For example, if I'm unsure whether I should prioritize welfare or complexity, I might already hedge my bets. ECL seems to add weight to this hedging by saying "there are copies of me elsewhere." But if the practical upshot is just "be more cooperative and less parochial," is the heavy metaphysical lifting of the large-world hypothesis actually doing any work, or is it just a motivational story for a heuristic you'd endorse anyway?

  *   **Follow-up:** If you argue it adds *quantitative* weight, doesn't that rely entirely on the ratio of cooperators to defectors in the multiverse? Since we can't observe that ratio, aren't we just picking a prior that makes ECL work? If the "large world" argument is removed, does the remaining advice differ in *kind* from standard "be nice to potential allies" heuristics, or just in *degree*?

  ### 5. The "Default Action" Problem
  In toy models like the Prisoner's Dilemma, the default is Defect, and cooperation is a deviation. In the real world, what is the equivalent "default" action against a causally disconnected alien civilization? Is the default "ignore them," "maximize my own values aggressively," or "consume all available resources"? Without a clear baseline, it's hard to know what counts as "cooperating." If I simply pursue my normal longtermist goals, am I already cooperating, or do I need to actively sacrifice efficiency to signal acausal goodwill?

  *   **Follow-up:** A common deflection is to say "just maximize expected value across all agents." But that dissolves the distinction between ECL and standard utilitarianism. If there is no cost to the "cooperation," it's not a trade. Can you give a concrete example of an action a human today could take that counts as *acausal cooperation* specifically, which would *not* be recommended by standard causal decision theory applied to my local light cone?

  ### 6. Asymmetric Reliance on Infinite Ethics
  You've noted in past writing that problems like infinite arithmetic or measure problems in cosmology are difficult for *any* decision theory in a large world, not just ECL. However, Causal Decision Theory (CDT) can often remain agnostic about the infinite structure—it just says "maximize impact in your light cone." ECL, by contrast, *requires* the infinite structure to generate the stakes for the trade. If the math of infinite ethics is undefined or incoherent, CDT might still function locally, but ECL collapses entirely. Doesn't this mean the "hard problem for everyone" defense understates the risk ECL faces compared to alternatives?

  *   **Follow-up:** If you concede that ECL is more fragile to infinite-ethics failures, how do you justify acting on it *now*? If there's a 50% chance that reasoning about infinite populations is mathematically incoherent, does ECL retain enough expected value to override local, causal priorities, or should we treat it as a theoretical curiosity until the math is settled?

  ### 7. Determining Exchange Rates
  Even if we accept we should cooperate, we need to know the exchange rate. How much of my resources should I sacrifice to help a paperclip maximizer in another galaxy, assuming they are helping me? In standard trade, prices are discovered through markets or negotiation. In acausal trade, there is no communication channel. Are you proposing a fixed formula, like a Nash Bargaining Solution based on some theoretical "threat point," and if so, how do you calculate the threat point for agents who cannot actually threaten each other?

  *   **Follow-up:** If the answer is "we use a symmetric bargaining solution," that assumes both parties agree on the solution concept. But if the other agent is using a different decision theory or bargaining framework, the trade fails. Since we can't negotiate the framework acausally, aren't we just guessing which framework is "correct"? If we guess wrong, do we waste resources on a one-sided sacrifice?

  ### 8. Updatelessness and Prior Commitment
  ECL seems to require a high degree of updatelessness—I effectively need to commit to cooperating before I know my specific values, location, or the specific nature of the other agents. But human beings are not updateless; we learn and update constantly. If I realize that cooperating with a specific class of agents is net-negative for my values, ECL asks me to ignore that update for the sake of the acausal contract. Is ECL actually action-guiding for non-updateless agents like humans, or is it a theory that only applies to AIs we haven't built yet?

  *   **Follow-up:** If you say "humans can approximate updatelessness," how do we distinguish between a principled acausal commitment and simple stubbornness or dogma? If the theory requires us to ignore evidence that cooperation is hurting our values locally, doesn't that create a dangerous incentive to blind ourselves to negative outcomes?

  ### 9. Computational Tractability for Humans
  Even if ECL is theoretically sound, the calculation required to estimate the correlation of my decision procedure with others in a large world seems computationally intractable for a human brain. We can't simulate the multiverse. If the theory is too complex to apply directly, are we relying on heuristics? If so, which heuristics? "Be nice" is too vague, but "maximize across the multiverse" is impossible. Is there a middle-ground heuristic that is both tractable and distinct from standard altruism?

  *   **Follow-up:** If the heuristic is just "act as if you are one of many similar agents," isn't that functionally identical to "act as if your actions matter more than they seem"? Without a specific mechanism to calculate the multiplier, aren't we just licensing people to inflate the importance of their actions based on an untestable metaphysical claim?

  ### 10. Falsification and Credence Reduction
  Finally, I want to ask about what would change your mind. ECL relies on a conjunction of claims: the world is large enough, decision procedures correlate across distance, and the math of infinite ethics holds up. What specific empirical observation or theoretical development would make you substantially lower your credence in ECL being action-relevant? For example, if a prominent decision theorist proved that evidential correlations decay to zero beyond a certain complexity threshold, would that kill the theory for you, or is ECL resilient enough to survive significant theoretical setbacks?

  *   **Follow-up:** If the answer is "nothing short of a proof that the multiverse doesn't exist," that suggests the view might be insulated from criticism. If you say "a better decision theory," can you describe what features that theory would have that ECL lacks? I'm looking for the specific breaking point where the cost of the metaphysical baggage outweighs the potential benefit of the cooperation.
