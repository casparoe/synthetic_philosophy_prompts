          *   Midpoint (uniform in area): $1/4$.
          *   Wait, Jaynes picks the method where the distribution of the *distance from the center* is uniform? No, Jaynes derives the density $f(r) \propto 1/r$ for the distance? Let me double-check Jaynes 1973.
          *   *Correction:* Jaynes argues for invariance under translation, rotation, and scaling. He derives that the density of the chord's distance from the center $p$ must be $f(p) \propto 1/\sqrt{R^2 - p^2}$? No, that's complicated.
          *   *Simpler Jaynes argument:* He argues the "random radius" method (pick a direction, pick a distance along the radius uniformly) is the only one invariant to scale and translation *of the circle relative to the straw tossing mechanism*. Actually, Jaynes derives $f(p) = 1/2$ (uniform on distance from center)?
          *   *Re-verification:* In "The Well-Posed Problem," Jaynes argues that if we are ignorant of the circle's position and size, the probability must be invariant. He concludes the probability is $1/2$. This corresponds to selecting a chord by choosing its perpendicular distance from the center uniformly from $[0, R]$.
          *   *Wait, standard Bertrand:*
              1.  Random endpoints: $P = 1/3$.
              2.  Random radius (uniform distance from center): $P = 1/2$.
              3.  Random midpoint (uniform in disk area): $P = 1/4$.
          *   Jaynes supports #2. Okay, I will stick with that.

      *   *Math Check on Cube:*
          *   Side $s \sim U[0,1]$. $P(s < 1/2) = 1/2$.
          *   Area $A = s^2$. If $A \sim U[0,1]$, then $P(A < 1/4) = 1/4 \implies P(s < 1/2) = 1/4$.
