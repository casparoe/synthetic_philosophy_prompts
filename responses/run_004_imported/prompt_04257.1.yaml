      *   *Refinement:* I will argue that Jaynes successfully solves *Bertrand's Paradox* specifically, but fails to rescue the *General Principle of Indifference* for Bayesian inference. The "work" is being done by the invariance group selection, which is not dictated by ignorance alone.

