  6.  **Final Polish:** Check citations (Jaynes 1973, van Fraassen 1989, Shackel 2007). Ensure the math regarding the chord and cube is accurate. (Chord: $1/2$ is the Jaynes solution. Cube: Uniform on $s$ vs $s^2$ vs $s^3$).

      *   *Math Check on Bertrand:*
          *   Endpoints: $1/3$.
