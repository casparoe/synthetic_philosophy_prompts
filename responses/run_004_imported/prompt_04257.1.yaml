          *   *Claim:* Reparameterization changes the "ignorance" distribution. There is no unique "uniform" without picking a parameterization first.
      *   **Shackel (2007):** Critiques Jaynes. Argues that selecting the invariance group *is* adding information. "Ignorance" alone doesn't tell you which symmetries matter. Therefore, POI isn't a free-standing principle of rationality; it relies on substantive physical assumptions.

