      *   *Argument 2 (Spectatorship vs. Participation):* Theater isolates individuals in the dark, focusing them on an illusion. Civic festivals bring people together in the light, focusing them on *themselves* and their community. It's about *doing* together vs. *watching* separately.

  3.  **Drafting Implications (Iterative Process):**

