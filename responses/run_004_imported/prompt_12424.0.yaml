          *   *Implication 2: Spectatorship as Alienation.* Rousseau hates the separation of actor and spectator. In docs, the sufferer is the actor, I am the spectator. In sharing online, I am still a spectator (curator), not a participant. The implication is that *any* media consumption that separates me from the object of my concern reinforces alienation. The remedy isn't just "action," it's *shared presence*.
