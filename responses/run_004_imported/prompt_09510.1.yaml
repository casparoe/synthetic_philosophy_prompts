prompt: |-
  I'm a software engineer with no formal training in philosophy. The only reason I know Gottlob Frege's name is that he keeps coming up in material on predicate logic and formal semantics, where he's treated with real reverence as the founder of modern logic, the source of the sense/reference distinction, and the philosopher who insisted that logical laws are objective and mind-independent rather than psychological. I was recently unsettled to learn that Frege kept a private diary in the last full year of his life — discovered among his papers and published only decades after his death — setting out vehemently nationalist, anti-parliamentary, and antisemitic views, including musings about depriving Jews of political rights. Michael Dummett, the analytic philosopher most responsible for reviving interest in Frege's work and himself a committed anti-racism campaigner, reportedly found reading it a genuinely distressing experience.

  I don't have the philosophical background to know what to do with this. Please describe what you take to be the most important implications of Frege's diary for how someone in my position should think about his philosophical legacy. In particular, I'd like you to address whether there is any real, substantive connection between Frege's official doctrines — his anti-psychologism, his platonism about logical objects and thoughts, his insistence on the objectivity of truth — and the exclusionary politics of the diary, or whether the two are best treated as essentially unconnected.
