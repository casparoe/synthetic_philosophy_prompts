          1.  Law of Excluded Middle (LEM): $P \lor \neg P$ is always true. (Either there will be a sea battle or there won't.)
          2.  Principle of Bivalence (PB): Every proposition is either True or False.
          3.  If "There will be a sea battle" is *now* True, then it *must* happen. If it's *now* False, it *must not* happen.
          4.  Therefore, the future is fixed/necessary. Deliberation is pointless.
      *   *Aristotle's Intuition:* The future is open. Deliberation matters. Contingency is real.
