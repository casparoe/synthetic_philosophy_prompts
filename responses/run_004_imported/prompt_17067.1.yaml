          *   It becomes True/False only when the event happens.
          *   *Pros:* Clearly blocks fatalism. If there's no truth value, there's no "fixed fact" determining the future.
          *   *Cons:* Seems to violate LEM (though Aristotle tries to save LEM). Hard to square with some other Aristotelian texts.
      *   **Reading B: The Ockhamist/Compatibility View (Bivalence Retained, Necessity Denied).**
