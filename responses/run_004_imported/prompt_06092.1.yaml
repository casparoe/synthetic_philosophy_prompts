      *   *Assumption 2: Common Knowledge of Posteriors.* Did they exchange numbers ($P(H|E) = 0.8$)? Or did they exchange *arguments*? Exchanging arguments is not the same as common knowledge of posteriors. You might not trust my calculation of my posterior.
      *   *Assumption 3: Honest Bayesian Updating.* Are they actually updating? Or are they motivated reasoners? (Bounded rationality).
      *   *Assumption 4: Information Partitions.* Do they define the "states of the world" the same way? If the student sees a nuance in the data the advisor filters out, their partitions differ.

