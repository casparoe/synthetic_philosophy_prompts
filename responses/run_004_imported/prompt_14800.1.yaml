answer: |-
  **MEMORANDUM**

  **TO:** Research Methods and Data Integrity Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Evaluation of Proposal Regarding Optional Stopping and Bayes Factors in Graduate Theses

  ### Executive Summary

  This memo evaluates the proposal to permit graduate students to utilize optional stopping designs in thesis research, provided they report Bayes Factors (BF) with preregistered priors rather than $p$-values. While the theoretical argument for this approach is statistically sound under specific Bayesian axioms, practical implementation carries non-trivial risks regarding false discovery rates and student training.

  **Recommendation:** I recommend **Conditional Approval**. We should allow this methodology only under strict guardrails (maximum sample caps, prior sensitivity analysis, and calibration simulations) to balance methodological innovation with our department's commitment to replicability.

  ### The Core Statistical Disagreement

  To vote responsibly, we must distinguish between the *theoretical* properties of Bayes Factors and their *operational* behavior in sequential testing.

  **1. The Frequentist Concern (The "Error Rate" View)**
  Our traditional skepticism of optional stopping stems from the frequentist framework. In null hypothesis significance testing (NHST), the $p$-value is calculated based on the sampling distribution of a test statistic *assuming a fixed sample size*. If a researcher peeks at data and stops when $p < .05$, they inflate the Type I error rate (often drastically). The "sampling intention" matters. This flexibility was a primary driver of the replication crisis, as it allowed researchers to find noise that looked like signal.

  **2. The Bayesian Defense (The "Likelihood Principle" View)**
  The proposing faculty argue from the **Likelihood Principle**. This principle states that the evidential meaning of data depends *only* on the observed data and the model, not on the unobserved data or the stopping rule.
  *   **The Argument:** A Bayes Factor compares the likelihood of the data under two hypotheses ($H_1$ vs. $H_0$). Because this calculation relies only on what was observed, not on what *could* have been observed had the researcher continued, the BF is theoretically invariant to optional stopping.
  *   **The Claim:** Therefore, a student can monitor evidence as it arrives and stop when the BF reaches a threshold (e.g., $BF_{10} > 3$) without inflating false positives in the same way $p$-values do.

  **3. The Synthesis (Where the Risk Remains)**
  While the Likelihood Principle holds mathematically, **decision-making** does not.
  Recent simulation literature (e.g., Schönbrodt et al., 2016; Rouder, 2014) suggests a nuanced reality:
  *   **Calibration:** Bayes Factors are generally more robust to optional stopping than $p$-values. However, if researchers use optional stopping to reach a specific BF threshold, they can still bias the rate of false discoveries, particularly if the prior distribution is vague or misspecified.
  *   **Effect Size Estimation:** Optional stopping tends to overestimate effect sizes in both frameworks. If a student stops early because the BF looks "good," the resulting effect size estimate is likely inflated, which harms power calculations for future studies.
  *   **Prior Sensitivity:** The robustness of the BF depends heavily on the prior. A student could inadvertently (or intentionally) choose a prior that makes it easier to reach the stopping threshold early.

  ### Risk Assessment for Graduate Training

  We must consider the specific context of **graduate theses**:
  1.  **Incentive Structures:** Students are under pressure to finish quickly. Optional stopping creates a financial and temporal incentive to stop at the first sign of "evidence," potentially biasing the literature they enter.
  2.  **Technical Expertise:** Properly specifying priors and understanding BF thresholds requires more statistical sophistication than standard NHST. Misapplication here is harder to detect than a $p$-value error.
  3.  **Departmental History:** Given our recent replication failures, adopting a method that *looks* like the old $p$-hacking behavior (peeking at data) requires overwhelming justification and transparency.

  ### Recommendation: Conditional Approval

  We should not ban methodological progress, but we cannot adopt this as a "free pass." I propose we approve the use of optional stopping with Bayes Factors only if the following **four conditions** are met in the student's preregistration:

  1.  **Maximum Sample Size Cap:** The preregistration must define a "stopping boundary" (e.g., $BF > 3$) *and* a maximum sample size ($N_{max}$). If the threshold is not met by $N_{max}$, data collection stops, and the result is reported as inconclusive. This prevents indefinite sampling until a desired result appears.
  2.  **Prior Justification & Sensitivity:** Students must justify their prior distributions based on previous literature (not convenience). They must also demonstrate via sensitivity analysis that their conclusion holds under reasonable alternative priors.
  3.  **Calibration Simulation:** As part of the proposal, the student (with advisor support) must run a simulation showing the expected false discovery rate of their specific design under optional stopping. This ensures they understand the error properties of their specific plan.
  4.  **Blind Analysis (Where Possible):** To mitigate researcher degrees of freedom during the "peeking" phase, data analysis should be scripted in advance so that the "peek" is automated and not subject to manual interpretation.

  ### Conclusion

  The proposing faculty are correct that Bayes Factors handle optional stopping better than $p$-values theoretically. However, "better" is not "immune." By approving this proposal with the safeguards above, we acknowledge the statistical validity of the Bayesian approach while maintaining the protective guardrails necessary for student training and departmental integrity.

  I am available to discuss these conditions further before Wednesday's vote.
