      *   **Legal Reality Check:** Gently inform the user that this argument will likely *fail* in a real court-martial, but that's okay for fiction (it creates drama). The argument is better suited for *mitigation* (sentencing) rather than *acquittal* (guilt).
      *   **Case Precedent:** I cannot invent a case. I must be honest. There is no case where "moral luck" exonerated a defendant of consequences. However, I can cite *People v. Russell* (civilian) or general UCMJ principles regarding "proximate cause." Actually, a better angle is the *concept* of "negligent homicide" vs. "misconduct." I should mention that legal systems *reject* moral luck, which makes the attorney's argument a bold, philosophical stand rather than a standard procedural move.
