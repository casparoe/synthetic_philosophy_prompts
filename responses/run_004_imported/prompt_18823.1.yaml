      *(Final check on Plato)*: In *Laws* Book I, the Athenian argues that wine can be a tool for education if regulated by a sober symposiarch. It tests whether a person remains virtuous when their guard is down. The Classics Society is arguing that faculty serving is part of this hierarchy. The counter-argument is that modern university liability trumps ancient pedagogy.

