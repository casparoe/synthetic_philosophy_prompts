  7.  **Final Review of the Philosophy:**
      *   Lewis's analysis: $x$ is disposed to $M$ if $S$ iff $x$ has intrinsic property $B$, and if $x$ were $S$ and $B$ persisted, $x$ would $M$.
      *   Masking problem: Poison has $B$. $S$ occurs. Antidote present. $B$ persists. $M$ does not occur. Counterfactual is false. Analysis says no disposition. But poison *is* poisonous.
      *   CA's potential fix: "In the absence of masks."
