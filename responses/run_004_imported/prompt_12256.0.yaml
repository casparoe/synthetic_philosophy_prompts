      *   **Round 2: The Mask (Bird's Case).** DE introduces the poison/antidote. CA tries to adjust the analysis (maybe exclude extrinsic interferers?). DE argues this leads to an infinite regress of *ceteris paribus* clauses.
      *   **Round 3: Primitivism vs. Analysis.** DE argues for dispositional essentialism (properties *are* powers). CA attacks the explanatory value of primitivism.
      *   **Closing:** Standoff, but with clear philosophical stakes highlighted.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I make sure the CA tries to extend the strategy to masking? Yes, CA needs to suggest that maybe we can specify the "normal conditions" or restrict the basis to exclude extrinsic masks.
      *   *Check:* Did I make sure the DE emphasizes that the basis *remains intact* in masking? Yes, that's the crucial difference between Fink (basis removed) and Mask (basis present but blocked).
      *   *Check:* Is the CA's challenge on "explanatory value" sharp enough? Need to ensure CA asks: "If you say it's primitive, what work is that doing other than stopping the regress?"

  5.  **Drafting the Dialogue (Iterative Process):**

