      *   **Tone:** Deadpan, rationalist, no mushy "watching over us" stuff, no religious fluff. Honest to his bloodless style.
      *   **Audience:** Split 50/50 between math colleagues (who know the argument) and family/friends (who don't).
      *   **Function:** The argument itself must do the *work* of comforting, not just be an anecdote. It needs to structure the eulogy.
      *   **Length:** 5-6 minutes spoken (approx. 750-900 words).
