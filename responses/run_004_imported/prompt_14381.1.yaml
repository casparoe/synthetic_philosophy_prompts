answer: |-
  Good morning.

  For those who knew him professionally, I don't need to explain that my grandfather was a man who preferred precision to sentiment. He was a logician. He worked in set theory. He believed that if a thing could be said clearly, it should be, and if it couldn't, it should remain silent. He died on Tuesday. It is now Saturday. We are here to account for the interval.

  I know that in a moment like this, there is an expectation of comfort. Usually, that comfort comes from faith, or from memory, or from the soft assurance that he is "watching over us." Grandpa would have found that phrasing embarrassing. He did not want to be a ghost in the machine. He told my mother explicitly: no mush. No metaphors.

  But he also left us a specific instruction on how to think about this end. He told it to us often, usually at inappropriate times, like other people's funerals. He called it "Gödel's Argument."

  Now, half of you are already smiling. You know the reference. You know Kurt Gödel not just for incompleteness, but for his private letters to his mother, where he sketched a rational necessity for the afterlife. The other half of you are wondering why we are talking about math at a funeral. Please bear with me. This isn't a lecture. It is the only way I know how to honor him without lying.

  The argument is simple. It rests on two axioms.

  First: The world is rationally constructed. It is not chaotic. It does not waste.
  Second: A human mind is a thing of cultivation. Over a lifetime, it develops complexity, understanding, and capacity.

  Grandpa's reasoning was this: If the world is rational, and a mind has spent eighty-plus years cultivating itself, it would be irrational for that cultivation to simply cease. To delete a complex system for no reason is an error. And the world, being rationally constructed, does not commit errors. Therefore, the mind persists.

  I know what some of you are thinking. I argued this myself, just two nights ago. Is this logic? Or is it just a man wanting to live forever, dressing up a wish in the clothes of a proof?

  It doesn't matter.

  What matters is that Grandpa didn't hold this belief because it made him feel safe. He held it because he believed the alternative was *sloppy*. He believed that to accept annihilation without cause was an insult to the structure of reality. He trusted the order of things more than he feared the end of them.

  And if we look at the life he actually lived, the data supports the premise.

  Look at what he built. To his colleagues: the papers, the proofs, the students he corrected with brutal, necessary honesty. To the family: the patience he taught us, the way he listened, the specific, quiet way he loved us. He didn't love us vaguely. He loved us specifically. He cultivated us. He invested time and reason into making us better, sharper, kinder.

  If that investment simply vanishes on Tuesday, then the universe is wasteful. It is inefficient. It is irrational.

  My grandfather did not believe in waste.

  So, how do we find comfort in this? Not by imagining him on a cloud. But by recognizing that the work he did is not the kind of work that can be deleted.

  To the family: When you feel his absence, do not look for a sign. Look for the logic. Look for the way he taught you to think through a problem rather than panic. That is not gone. That is running in your heads. That is part of the cultivation that persists.

  To his colleagues: We know that in set theory, a set is defined by its elements. But a theory is defined by its consequences. The consequences of his life are still propagating. The function he defined is still returning values.

  He asked me to respect the argument. I think I understand why now. If we accept the mushy version of comfort, we treat him like a stranger who needs soft lies. If we accept the logical version, we treat him like the man he was. We acknowledge that what he built was substantial enough to withstand the termination of his biology.

  There is a specific kind of peace in that. It is not a warm peace. It is a cold, solid peace. Like stone. Like a proof.

  It says that nothing he was is lost. It says that the world is not so poorly made as to throw him away.

  He trusted the rationality of the world. We can trust that he was right.

  Thank you.
