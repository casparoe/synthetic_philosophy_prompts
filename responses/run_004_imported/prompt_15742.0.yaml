      *   *Check:* Did I answer why it's Löb and not Gödel? Yes, emphasize that Gödel is about *existence* of unprovables, Löb is about the *rule of trust*.
      *   *Check:* Did I explain why it's structural? Yes, emphasize that it applies to any system rich enough to do arithmetic (which any useful AI must be).
