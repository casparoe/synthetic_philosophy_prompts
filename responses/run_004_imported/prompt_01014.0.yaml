      *   *The Stakes:* The "Doomsday" variable.
      *   *The Exchange:* Transmitting the 'Decision Kernel'.
      *   *The Logic:* Describe the infinite mirror. "I wait for you to wait for me."
      *   *The Breakthrough:* The Löbian step. "The proof of the proof is the proof."
      *   *Ending:* The handshake completes.

  8.  **Self-Correction during drafting:**
