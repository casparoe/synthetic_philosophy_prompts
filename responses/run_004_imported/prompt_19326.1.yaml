  ### A Better Framing

  Both students are debating whether Frege's politics *invalidate* his logic (Marcus says no, Leah implies maybe). A more productive framing for your piece would be to ask whether the **structural motivations** behind his logic and his politics are homologous. Frege's logicism and his authoritarianism both stem from a deep恐惧 (fear) of relativism, chaos, and "psychologism." He wanted arithmetic to be rigid and eternal because he wanted the State to be rigid and eternal. You don't have to claim his logic is false to argue that his philosophical *project* was driven by the same anxiety that produced his bigotry. This allows you to honor Marcus's point (the logic works) while validating Leah's intuition (the man and his mission are entangled).
