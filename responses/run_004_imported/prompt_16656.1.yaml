prompt: |-
  So my lab just had one of those journal-club-nights-that-turns-into-an-argument over the replication crisis, and it's been stuck in my head since. A few of the senior grad students in my social psych program are pushing hard for all of us to ditch t-tests and ANOVAs and move to Bayesian analyses (Bayes factors, JASP, the whole deal), and the argument that basically won the room was this: since Bayesian updating follows the likelihood principle, your posterior (and the resulting Bayes factor) doesnt care why you stopped collecting data or what your original sampling plan was — unlike a p-value, which gets inflated the moment you peek at the data partway through and stop as soon as it looks significant. Optional stopping is supposed to be one of the classic "researcher degrees of freedom" that fed into the replication crisis in the first place, so the reasoning goes: switch to Bayes and that whole problem just evaporates.

  That felt almost too good to be true to me, but nobody in the room could really say what was wrong with it, and honestly neither could I. So I wanted to sanity check this with you: is it actually right? Could our lab, in good conscience, check our Bayes factor every few days as data trickles in and just stop whenever we cross something like BF > 3 (or BF < 1/3 for the null), without worrying that we're basically p-hacking with extra steps? And zooming out a bit, is "the replication crisis was fundamentally a frequentist statistics problem" a fair way to put things, or are we giving Bayesian methods credit they havent fully earned yet? Would love your take before I become the person who tells the whole lab we've basically solved this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** A social psychology lab had a heated journal club about the replication crisis.
      *   **The Claim:** Senior grad students argue for switching from frequentist methods (t-tests, ANOVAs, p-values) to Bayesian methods (Bayes Factors, JASP) because Bayesian updating follows the Likelihood Principle. Therefore, optional stopping (peeking at data and stopping when significant) doesn't invalidate the results, unlike p-values.
      *   **The Proposed Practice:** Check Bayes Factors (BF) every few days and stop when BF > 3 (or < 1/3).
      *   **The User's Skepticism:** It feels "too good to be true." They want to know if this is actually valid or if it's "p-hacking with extra steps."
      *   **The Broader Question:** Is the replication crisis fundamentally a frequentist statistics problem, or are we over-crediting Bayesian methods?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the Likelihood Principle claim true?* Yes, technically. In pure Bayesian inference, the posterior depends only on the prior and the likelihood of the observed data. The stopping rule is irrelevant *for the interpretation of the posterior probability*.
      *   *Does this mean optional stopping is harmless?* This is the crux. While the *interpretation* of the BF remains valid conditional on the data, the *long-run frequency properties* (calibration) can be distorted if stopping rules are data-dependent without correction.
      *   *Is BF > 3 a hard threshold?* No, thresholds are heuristic.
      *   *Is the replication crisis just a frequentist problem?* No. It's a systemic issue involving publication bias, p-hacking, low power, questionable research practices (QRPs), and incentives. Bayesian methods don't fix incentives or publication bias.
      *   *Can you just stop whenever BF > 3?* Technically, yes, a Bayesian *can* do this and claim the BF is valid. However, frequentist critics (and some Bayesians) argue this leads to bias in the literature if everyone does it without transparency. Also, BFs are sensitive to priors.

  3.  **Structure the Response:**
      *   **Validate the User:** Acknowledge their skepticism. It *is* too good to be true.
      *   **Address the Core Technical Claim (Optional Stopping):** Explain the nuance. Yes, the Likelihood Principle holds, *but* calibration matters. If you stop early on noise, you can still fool yourself.
      *   **Address the "P-Hacking with Extra Steps" Concern:** Discuss how Bayesian methods can still be misused (prior hacking, threshold hacking).
      *   **Address the Replication Crisis Context:** Broaden the scope. Statistics is only one part. Incentives, power, and transparency matter more.
      *   **Practical Advice for the Lab:** What should they actually do? (Pre-registration, sequential analysis plans, sensible priors).
      *   **Conclusion:** Summarize the verdict.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the gut feeling. It's a common argument, but it has caveats.
      *   **The "Optional Stopping" Claim:**
          *   *The Truth:* The Stopping Rule Principle is a feature of Bayesianism. The posterior is valid regardless of *why* you stopped.
          *   *The Catch:* Validity $\neq$ Truth. If you stop on noise, the BF favors the wrong hypothesis.
          *   *Calibration:* Simulations show that aggressive optional stopping *does* inflate false positive rates in a frequentist sense (i.e., how often does BF > 3 happen when H0 is true?). While a Bayesian doesn't care about long-run error rates, the *scientific community* does. If everyone does this, the literature becomes biased.
          *   *Reference:* Mention Rouder (2014) or similar literature that discusses this. Rouder argues it's okay, but others (like Frequentists or Error Statisticians) disagree. Need to present a balanced view.
      *   **The "P-Hacking with Extra Steps" Risk:**
          *   *Prior Hacking:* Changing priors until you get the result you want.
          *   *Threshold Hacking:* "BF > 3 wasn't enough, let's look at the 95% HDI."
          *   *Model Hacking:* Choosing the wrong alternative model.
      *   **The Replication Crisis Scope:**
          *   It's not just stats. It's publication bias (file drawer problem). Bayesian methods don't fix the file drawer.
          *   It's about power. Small N studies are noisy regardless of the statistic used.
          *   It's about incentives. Publish or perish.
      *   **Recommendations for the Lab:**
          *   Don't just swap tests. Swap culture.
          *   Pre-register the stopping rule even if Bayesian (for transparency).
          *   Use Sequential Bayes Factors properly (Schönbrodt et al.).
          *   Focus on effect sizes and uncertainty, not just binary thresholds (BF > 3).

  5.  **Refining the Tone:**
      *   Needs to be empathetic but rigorous.
      *   Avoid being dismissive of Bayesian methods (they *are* useful), but avoid hype.
      *   Use analogies if helpful (e.g., the thermometer analogy).
      *   Ensure the distinction between *subjective belief* (Bayesian) and *long-run error control* (Frequentist) is clear.

  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* I initially thought about saying "Optional stopping is bad for Bayes." That's technically incorrect according to strict Bayesian theory. I need to be precise: "Strict Bayesian theory says stopping rules don't matter for inference, *but* practical application and calibration do matter for scientific integrity."
      *   *Nuance:* The BF > 3 threshold is arbitrary. Jeffreys' scale is heuristic.
      *   *Nuance:* The choice of the alternative hypothesis (the prior on the effect size) drastically changes the BF. If you pick a prior that matches the data, you get inflated BFs. This is a form of hacking.

  7.  **Final Polish:** Check against the user's specific questions.
      *   *Is it actually right?* Partially, but with major caveats.
      *   *Can we check BF every few days?* Yes, but pre-register the plan.
      *   *Is replication crisis a frequentist problem?* No, it's a systemic problem.

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Your gut instinct is serving you well here. It *does* feel too good to be true because, in practice, it often is.

  The argument your lab mates are making relies on a technically correct theoretical point (the Stopping Rule Principle) but ignores the practical realities of how science functions as a collective, error-correcting enterprise. If you tell your lab that switching to Bayes Factors (BF) solves the replication crisis, you will be the person who has to explain why your lab's results still fail to replicate in three years.

  Here is the breakdown of why the "Bayes fixes optional stopping" argument is half-truth, why the replication crisis isn't just a frequentist problem, and what your lab should actually do.

  ### 1. The Technical Claim: Does Optional Stopping Matter for Bayes?

  **The Theory:**
  Your grad students are citing the **Likelihood Principle**. In strict Bayesian inference, the posterior probability depends only on the prior and the likelihood of the *observed* data. It does not depend on the "sample space" of data that *could* have been observed but wasn't (which is what p-values depend on). Therefore, theoretically, a Bayesian can stop collecting data whenever they want, and the resulting Bayes Factor is a valid ratio of the odds of the hypotheses given *that specific dataset*.

  **The Reality:**
  While the *interpretation* of the BF remains mathematically consistent for the individual researcher, the **calibration** of the BF can be compromised by aggressive optional stopping.

  If you simulate data where the null hypothesis is true, and you check the BF after every participant, stopping only when BF > 3, you *will* eventually find "evidence" for an effect that doesn't exist.
  *   **Frequentist view:** This inflates the Type I error rate massively.
  *   **Bayesian view:** A strict Bayesian might say, "So what? I don't care about long-run error rates, I care about my belief *now*."
  *   **Scientific view:** Science *does* care about long-run error rates. If every lab adopts the policy "stop when BF > 3," the literature will become filled with false positives, just as it did with p-values. The noise will eventually look like signal if you peek enough times.

  **The Verdict:** You *can* use sequential Bayes Factors (checking data as it comes in), but you cannot do it mindlessly. There are specific sequential designs (e.g., Schönbrodt et al., 2017) that set upper and lower thresholds to control decision errors. Just stopping arbitrarily at BF > 3 without a plan is indeed "p-hacking with extra steps."

  ### 2. The "P-Hacking with Extra Steps" Risk

  Switching to Bayesian software (like JASP) does not remove researcher degrees of freedom; it just moves them. If your lab thinks Bayes is a "get out of jail free" card, you risk introducing **Bayesian Hacking**:

  *   **Prior Hacking:** The Bayes Factor is highly sensitive to the prior distribution you choose for the alternative hypothesis (the "r" scale in JASP). If you try a "wide" prior, get a BF of 1.5, then try a "narrow" prior and get a BF of 4, you have just p-hacked.
  *   **Threshold Hacking:** "BF > 3 wasn't quite reached, but the 95% Credible Interval excludes zero, so we're good."
  *   **Model Hacking:** Choosing covariates or exclusion criteria that maximize the BF.

  A p-value of 0.049 is suspicious. A Bayes Factor of 3.1 is equally suspicious if it was obtained after trying five different priors.

  ### 3. Is the Replication Crisis a "Frequentist Problem"?

  This is the broader philosophical question. The short answer is **no.**

  The replication crisis was caused by a ecosystem of incentives, not just a specific statistical formula.
  *   **Publication Bias:** Journals prefer positive results. Bayesian analyses that strongly support the Null (BF < 1/3) are just as hard to publish as non-significant p-values. If your lab switches to Bayes but still only publishes "successful" experiments, the crisis continues.
  *   **Low Power:** Small sample sizes lead to noisy estimates. A Bayes Factor calculated on N=20 is just as unstable as a t-test on N=20. In fact, with small N, BFs are often biased toward the null (if the prior is wide) or the alternative (if the prior is narrow).
  *   **QRPs (Questionable Research Practices):** Dropping conditions, transforming outliers, or selecting specific measures happens regardless of whether you analyze the data with R or JASP.

  Blaming the t-test for the replication crisis is like blaming the thermometer for global warming. The tool measures the temperature; it doesn't cause the heat. The "heat" comes from the pressure to publish novel, clean, positive findings.

  ### 4. What Should Your Lab Actually Do?

  You don't have to be the person who shuts down the Bayesian revolution (Bayesian methods *are* often more intuitive and informative than NHST). But you should advocate for **rigorous** Bayesian practice, not **laissez-faire** Bayesian practice.

  Here is a proposal you can bring back to the lab:

  1.  **Pre-register the Stopping Rule:** Even if you use Bayes, write down your stopping rule before collecting data. "We will collect data until BF > 10 or BF < 1/10, or until N=200." This prevents you from stopping the moment the BF looks "good enough."
  2.  **Justify the Prior:** Don't use the default JASP prior (r = 0.707) just because it's the default. In social psych, effects are rarely that large. Use a prior based on previous literature or meta-analyses. Sensitivity analyses (showing results across different priors) should be standard.
  3.  **Treat BF as Continuous Evidence, Not a Binary Switch:** A BF of 3 is "moderate" evidence, not "truth." A BF of 3 obtained after optional stopping is weaker than a BF of 3 from a fixed design. Be humble in the discussion section.
  4.  **Focus on Estimation:** The biggest benefit of Bayesian analysis isn't the Hypothesis Testing (BF), it's the **Credible Intervals**. Focus on the magnitude and uncertainty of the effect, not just whether it crosses a threshold.
  5.  **Commit to Publishing Nulls:** If the lab switches to Bayes, commit to publishing results where BF < 1/3. If you only publish the BF > 3 results, you are contributing to the file drawer problem regardless of the statistic used.

  ### Summary

  Your lab mates are right that Bayesian updating is theoretically immune to the stopping rule *for the purpose of updating subjective belief*. They are wrong that this grants permission to peek at data endlessly without consequence for the scientific record.

  **The replication crisis is not a frequentist statistics problem; it is a transparency and incentives problem.** Bayesian methods can help, but only if implemented with the same rigor (pre-registration, transparency, justified priors) that we now demand of frequentist designs.

  If you tell the lab, "Bayes allows us to stop whenever we want," you are technically quoting the Likelihood Principle but practically inviting bias. If you tell them, "Bayes allows us to quantify evidence more intuitively, but we still need a pre-registered plan to ensure our literature remains calibrated," you'll be the voice of reason.

  **Recommended Reading to share with the lab:**
  *   *Rouder, J. N. (2014). Optional stopping: No problem for Bayesians.* (This supports your grad students, so read it to understand their view).
  *   *Schönbrodt, F. D., et al. (2017). Sequential hypothesis testing with Bayes factors.* (This explains how to do it *properly* with limits).
  *   *Gelman, A., & Loken, E. (2014). The statistical crisis in science.* (On the garden of forking paths/hacking).

  Don't let them solve the replication crisis with a software update. It requires a culture update.
