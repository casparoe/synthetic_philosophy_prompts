      *   *Distinction:* Make sure to separate *epistemic humility* (I could be wrong) from *epistemic self-sabotage* (I am likely wrong because of who I am).
      *   *Fricker's Virtue:* Emphasize "Testimonial Justice" as a virtue of *hearing*, not a rule of *deciding*.

  7.  **Final Polish:** Structure with clear headings. Keep it conversational but intellectually rigorous. (This matches the user's tone—they know the concept but want a sanity check).

      *(Self-Correction on the "Identity" aspect)*: I need to gently point out that testimonial injustice is specifically about *identity prejudice* (sexism, racism, etc.). If the user and coworker share the same identity markers, or if the dispute is purely about memory, the label might be misapplied. I should mention this gently so the user doesn't accidentally gaslight the coworker by saying "This theory doesn't apply." Instead, frame it as "This theory is about systemic bias, not just memory errors."

