prompt: |-
  I was a research chemist for almost 40 years, and it's only since retiring that I've started reading philosophy for fun, so bear with me if this is a silly question. My mum had dementia near the end of her life, and in her last year or two she became utterly convinced of things that were flat-out false - like that my dad, who'd died a decade earlier, was just down the hall having a nap - and she held these beliefs with way more certainty than she ever held anything when her mind was sound. Now that I'm getting on in years myself, it's been nagging at me: if I already know theres a decent chance I'll end up just as sure of equally false things down the road, doesn't consistency demand that I start shifting my current beliefs now toward whatever I expect I'll believe later? That feels like a completely nutty conclusion, but I can't find the hole in the logic. What am I missing?
reasoning: |-
