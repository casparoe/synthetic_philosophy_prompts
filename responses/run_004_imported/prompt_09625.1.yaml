          *   EU(CONTINUE) = $3/5(4 \cdot p_{future} + 1 \cdot (1-p_{future})) + 2/5(1)$. Wait, this gets messy.
          *   Simpler: The "Action Optimal" derived by P&R was $p \approx 0.53$.
          *   My job isn't to prove 0.53 is *better* for payoff, but that it is *rational* for the situated agent.
          *   Actually, the strongest argument is that the *credence itself* is valid, even if the action remains 2/3. But the prompt asks to defend that it can lead to *departing* from the plan.
          *   Okay, I need to argue that maximizing *conditional* expected utility (given "I am at an intersection") is a valid normative goal, distinct from maximizing *unconditional* expected utility (given "I am at the start").
          *   If the agent's goal is "Do the best I can *given that I am here*," then 2/3 is not the answer. 2/3 is "Do the best I can *given that I was there*."
          *   This is the crux. Indexical utility functions.

  8.  **Final Review against constraints:**
      *   Did I address double-counting? Yes (Decision-points vs Trips).
