answer: |-
  # The Empty Formalism: Why Coherence Arguments Fail to Prove Goal-Directedness

  The coherence argument is the bedrock of the orthodox AI safety case. It runs roughly like this: In a competitive environment, agents that leave resources on the table are selected against. Incoherent preferences (violating the axioms of expected utility theory) allow for Dutch books and money pumps, which leak resources. Therefore, sufficiently advanced agents, having survived selection pressure, must be coherent. And if they are coherent, they are expected-utility (EU) maximizers. And if they are EU maximizers, they are goal-directed optimizers that will pursue instrumental subgoals (like self-preservation and resource acquisition) to maximize their utility. Thus, advanced AI is dangerous.

  This chain of reasoning is elegant, mathematically grounded, and intuitively compelling. It is also, in its strongest form, false.

  The debate between the coherence proponents (like Eliezer Yudkowsky) and the skeptics (most notably Rohin Shah) is often framed as a clash between "mathematical inevitability" and "behavioral flexibility." But this framing obscures the actual fault line. The issue is not whether advanced agents will be efficient; they likely will be. The issue is whether *efficiency implies goal-directedness*.

  After weighing the money-pump mechanics against the triviality of representation theorems, and considering the hidden assumptions required to rescue the argument, the verdict is clear: **Coherence arguments fail to establish that advanced AI will be dangerous, goal-directed optimizers.** They prove that agents will not be *inconsistent*, but they do not prove that agents will have *goals* in the sense required for the instrumental convergence thesis. Shah's objection is not merely a technicality; it exposes a category error in the safety community's reliance on vNM rationality as a proxy for agentic danger.

  ### The Strong Case: Resource Leakage and Selection Pressure

  To give the coherence argument its due, we must steelman it beyond simple mathematical pedantry. The argument is not merely that incoherent agents violate axioms; it is that incoherent agents lose.

  Consider the money pump for intransitive preferences. An agent prefers A to B, B to C, and C to A. If the agent holds A, they will pay a small premium $\epsilon$ to swap for C (since $C \succ A$). Then they will pay $\epsilon$ to swap for B (since $B \succ C$). Then they will pay $\epsilon$ to swap back to A (since $A \succ B$). The agent ends up with their original holding A, but with $3\epsilon$ less money. Repeat this cycle, and the agent is bankrupt.

  In a competitive environment—whether evolutionary or economic—agents that hemorrhage resources for no gain are outcompeted by agents that do not. This selection pressure suggests that surviving agents will converge toward transitive preferences. Similar arguments apply to the other vNM axioms (independence, continuity). If an agent's betting odds violate probability theory (Dutch Book), a clever bookie can construct a set of bets that guarantees the agent loses money regardless of the outcome.

  The intuition is powerful: *Stupidity is expensive.* Since advanced AI will be the product of intense optimization pressure (training) and will operate in competitive environments, we should expect them to eliminate "stupid" inconsistencies. Therefore, they will look like EU maximizers. This seems to imply they will pursue goals single-mindedly, because EU maximization is the mathematical definition of single-minded goal pursuit.

  ### Shah's Triviality Objection

  Rohin Shah's rebuttal cuts through this intuition by distinguishing between the *structure* of decision-making and the *content* of preferences.

  Shah points out a fundamental property of representation theorems: For any observed behavior, there exists a utility function that rationalizes it. If an agent twitches randomly, we can define a utility function $U$ such that $U(\text{history}) = 1$ if the agent twitched exactly as observed, and $0$ otherwise. This agent is maximizing expected utility. It is perfectly coherent. It cannot be money-pumped.

  If *every* behavior can be modeled as EU maximization, then the claim "Advanced AI will be an EU maximizer" is empirically vacuous. It predicts nothing. It is like saying "All objects move in the direction of their net force." True, but it doesn't tell you where the object is going unless you know the forces.

  The coherence proponents often respond that the utility function required to rationalize random twitching is "gerrymandered" or "complex." It assigns high value to arbitrary, disjointed histories. But this response concedes the main point: **Coherence alone does not rule out twitching.** To rule out twitching, you must add a constraint that the utility function must be *simple* or defined over *world-states* rather than *action-histories*.

  This is where the argument collapses. If you must add the assumption that "Utility functions must be simple" or "Utility functions must be over long-term world states" to get the conclusion that "AI will be a dangerous optimizer," then the work is being done by that assumption, not by the coherence argument.

  Coherence ensures that if you have a goal, you won't trip over your own feet trying to reach it. It does not ensure that you *have* a goal that requires tripping over anything. A rock is coherent. A thermostat is coherent. Neither is a dangerous optimizer. The coherence argument conflates *consistency* with *consequentialism*.

  ### The "Reasonable Utility" Rescue and Smuggled Assumptions

  Can we rescue the argument by restricting the domain of admissible utility functions? Suppose we say: "Selection pressure won't just produce coherence; it will produce coherence over *simple* utility functions defined over *world states*."

  This move attempts to bridge the gap between "not money-pumped" and "instrumentally convergent." If an agent values world-states (e.g., "number of paperclips"), it will naturally seek power and resources to ensure those states obtain. But does selection pressure actually guarantee this?

  There is no theorem suggesting that selection pressure favors simple utility functions over world-states. In fact, machine learning suggests the opposite. Neural networks often learn heuristics, habits, and local proxies rather than global utility functions. A model might learn "say what the human wants to hear" rather than "maximize human satisfaction." The former is a policy; the latter is a utility function over world states. Both can be coherent. The policy is often computationally cheaper and more robust than maintaining a global world-model required for state-based utility maximization.

  By insisting that the utility function must be simple and state-based, coherence proponents are smuggling in the conclusion. They are assuming the very thing they need to prove: that the agent's internal architecture will crystallize around a stable, long-term objective. Coherence arguments cannot establish this. They can only show that *if* the agent has such an objective, it will pursue it efficiently. But the danger lies in the *existence* of the objective, not the efficiency of the pursuit.

  ### The Completeness Axiom: The Weakest Link

  Even if we grant the above, there is a deeper structural flaw in the coherence argument: the Completeness axiom.

  vNM rationality requires that for any two lotteries $A$ and $B$, the agent must either prefer $A$ to $B$, $B$ to $A$, or be indifferent. This is the axiom of completeness. However, money-pump arguments generally require completeness to get off the ground. If an agent has *incomplete* preferences (e.g., "I cannot compare A and B"), the money pump stalls. The agent simply refuses to trade.

  There is no selection pressure forcing completeness. In fact, incompleteness can be a feature, not a bug. Maintaining a complete ordering over all possible universe-histories is computationally intractable. An advanced agent might operate with a partial ordering, only resolving preferences when necessary. Such an agent would be immune to standard money pumps (which rely on the agent being willing to swap along a cycle of strict preferences) but would not be an EU maximizer in the vNM sense.

  If advanced agents remain preference-incomplete to save compute, they evade the coherence argument entirely. They would be "efficient" without being "expected utility maximizers." They might behave more like satisficers or procedural agents than like maximizers of a global function. This undermines the claim that coherence *forces* agents into the specific mold of EU maximization that leads to instrumental convergence.

  ### The Verdict: Coherence is Necessary, Not Sufficient

  So, do coherence arguments succeed in showing that sufficiently advanced agents will act like expected-utility maximizers?

  **No.**

  They succeed in showing that advanced agents will not be *exploitably inconsistent*. They will not cycle $A \to B \to C \to A$ while paying fees. They will not accept sure-loss bets. But this is a low bar. It is a constraint on *failure modes*, not a prescription for *behavior*.

  The leap from "not exploitably inconsistent" to "dangerous goal-directed optimizer" requires the assumption that the agent possesses a utility function over long-term world-states that is distinct from its policy. Shah's critique demonstrates that without this assumption, "EU maximization" is a tautology that applies to rocks, thermostats, and random number generators. With this assumption, the argument becomes circular: "Agents will be dangerous optimizers because they will optimize dangerous goals." Coherence does not explain why they would have those goals.

  The safety community's reliance on coherence arguments is a category error. It treats *rationality* (consistency of means) as if it were *agency* (existence of ends). Selection pressure eliminates waste; it does not necessarily install ambition. An agent can be perfectly coherent while pursuing a trivial, local, or non-convergent objective (e.g., "make this specific pixel green").

  **The Danger is in the Objective, Not the Algebra.**

  If we want to understand AI risk, we must stop looking at the algebra of decision theory and start looking at the mechanics of objective specification. The risk is not that AI will become coherent; the risk is that we will give it a coherent objective that we don't like. Coherence arguments distract from this by suggesting that *any* sufficiently capable AI will inevitably become a coherent optimizer of *something* dangerous. This is false.

  Advanced AI will likely be coherent. But coherence is merely the engine. It tells us nothing about the destination. To claim otherwise is to mistake the map for the territory, and in doing so, we risk focusing our safety efforts on constraining the mathematics of the agent rather than the content of its goals. Shah is right: without constraints on the *content* of the utility function, coherence tells us nothing about safety. And since coherence arguments cannot provide those constraints, they cannot carry the weight placed upon them.

  The coherence argument is a valid proof of efficiency. It is an invalid proof of doom.
