      *   **Bayesian Update:** $P(N|n) \propto P(n|N) \cdot P(N)$. The likelihood term $1/N$ favors smaller $N$.
      *   **Reference Class Problem:** Who counts as a "human"? Observer moments? Conscious beings?
      *   **SIA (Self-Indication Assumption):** You are more likely to exist in a universe with more observers. This cancels out the DA.
      *   **The Presumptuous Philosopher:** The reductio ad absurdum of SIA (betting on a larger universe without evidence).
      *   **The "Trick":** Is it about *where* you are or *that* you are?

  4.  **Drafting - Section by Section:**

