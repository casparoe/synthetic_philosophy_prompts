      *   **Skeptic (let's call him David):** Intuitively suspicious of the DA, well-read on the counter-arguments (SIA, Reference Class), thinks the DA relies on hidden assumptions that don't hold water.
      *   **Setting:** Late night, empty wine glasses, quiet apartment.

  3.  **Key Arguments to Include:**
