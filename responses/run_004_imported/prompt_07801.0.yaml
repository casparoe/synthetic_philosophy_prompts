answer: |-
  The last of the guests had left an hour ago. The kitchen was a landscape of half-empty wine bottles and plates stacked in precarious towers. Elena was wiping down the counter; David sat at the table, spinning a cork between his fingers. The silence wasn't awkward, just heavy with the residue of Marco's earlier monologue.

  David finally broke the quiet. "So. Are we doomed?"

  Elena didn't look up from the sink. "Statistically? Probably sooner than we'd like."

  "Come on. You can't actually buy it. The idea that we can predict the end of civilization by counting how many people have peed before us?"

  Elena turned, leaning back against the counter, crossing her arms. "It's not about the peeing, David. It's about the sampling. Look, put aside the doom for a second. Just look at the Bayes. If humanity lasts for another million years and colonizes the galaxy, the total number of humans who will ever live is going to be in the trillions. Maybe quadrillions."

  "Okay."

  "And if we go extinct in the next two centuries—climate, nukes, AI, whatever—the total number is going to be maybe a few hundred billion."

  "Roughly."

  Elena pushed off the counter and walked to the table, pulling out a chair. "We know our birth rank. We are roughly the 100-billionth humans. Let's call that *n*. Let *N* be the total number of humans who will ever exist. If *N* is a quadrillion, then being in the first 100 billion is like winning a lottery where you're the first ticket drawn out of ten trillion. It's possible, but it's highly unlikely. If *N* is only 200 billion, then being 100 billion is perfectly average. You're right in the middle."

  David nodded slowly. "The likelihood ratio. $P(n|N)$ is proportional to $1/N$. So the probability of observing my specific birth rank is much higher if the total population is small."

  "Exactly," Elena said. "So when you update your priors, the hypothesis 'Humanity ends soon' gets a massive boost compared to 'Humanity becomes a galactic empire.' It's not a proof. It's a likelihood ratio. It forces you to shift your credence toward the shorter timeline."

  David poured the last of the Malbec into two glasses. He pushed one toward Elena. "The math holds up *if* the setup is right. But the setup is where the trick is. You're treating me like a random sample drawn from an urn of all humans. But I'm not a random sample. I'm a specific observer conditioned on existing *now*."

  "That's the Self-Sampling Assumption," Elena said, taking the glass. "SSA. You should reason as if you are a random observer from the set of all actually existing observers. It's the standard way to handle indexical uncertainty."

  "But why that assumption?" David swirled his wine. "Why not the Self-Indication Assumption? SIA says: You should reason as if you are a random observer from the set of all *possible* observers. And crucially, the fact that I exist at all is evidence that there are *more* observers, not fewer."

  Elena sighed. "The SIA dodge. I knew you'd go there."

  "It's not a dodge, it's a correction," David said. "Under SIA, the prior probability of a world existing is proportional to the number of observers in it. A world with a quadrillion humans is a quadrillion times more likely to contain *me* than a world with one human. That factor exactly cancels out the $1/N$ penalty from the Doomsday Argument."

  "Cancel out?" Elena raised an eyebrow. "So you're saying the fact that I'm early in the sequence tells me nothing about the length of the sequence?"

  "Nothing," David said. "Because the fact that I exist at all tells me I'm likely in a big sequence. The two effects wash out. You're left with your original priors about AI and climate change, untouched by birth rank."

  Elena tapped her fingernail on the table. "Okay. But you know what SIA buys you. It buys you the Presumptuous Philosopher."

  David winced. "I was wondering when we'd get to Bostrom's nightmare."

  "Imagine two theories about the universe," Elena said, her voice sharpening. "Theory 1 says there are a trillion observers. Theory 2 says there are a trillion trillion. We have no physical evidence for either. They are equally simple, equally elegant. Then the Presumptuous Philosopher comes along and says, 'I exist. Therefore, Theory 2 is a trillion times more likely.' He bets everything on the bigger universe without looking through a telescope."

  "That does sound absurd," David admitted. "But isn't the Doomsday Argument just the reverse absurdity? The DA says, 'I exist early, therefore the universe must be small.' That's the *Modest* Philosopher. He refuses to believe in a large future even if the technology looks promising, just because of his birth date. Both seem to be trying to derive empirical facts from armchair reasoning about where I sit in the lineup."

  "But one of them has to be the correct way to handle self-locating belief," Elena insisted. "If you reject SSA, you have to accept that your existence is evidence for a crowded universe. That implies you could prove the universe is infinite just by sitting in your living room. Most physicists would kill for that kind of leverage."

  David leaned forward. "Or maybe it implies that 'probability' doesn't work the way we think it does when the observers are part of the system. Look, the Reference Class problem is the real killer for you, Elena. You said 'humans.' What counts? If I upload my mind next year, am I still in the reference class? If I merge with an AI, does that count as one human or a billion observer-moments?"

  Elena shrugged. "It's fuzzy, sure. But it doesn't save you. If you expand the reference class to 'conscious observer-moments,' the numbers get bigger, but the logic stays the same. If the future holds $10^{50}$ observer-moments, being in the first $10^{11}$ is still astronomically unlikely under SSA."

  "Unless the definition of the class is so fuzzy that the rank is meaningless," David countered. "If I can't define the set I'm sampling from, I can't calculate the rank. And if I can't calculate the rank, the Bayes factor is undefined. You can't update on noise."

  "That's convenient," Elena said dryly. "Conveniently, the moment the math points to a scary conclusion, the variables become 'too fuzzy' to compute."

  "It's not convenience, it's rigor. You're assuming there is a 'true' reference class waiting to be discovered. I'm saying the class is constructed by the question you ask. If I ask, 'What are the odds a human born in the 20th century survives to 2100?' that's a valid question. If I ask, 'What are the odds I am an early human in the history of the cosmos?' that assumes the cosmos has a boundary I can measure from the inside."

  David paused, looking at the cork in his hand. "Here's where I actually get stuck, though. Even if I grant you SSA... the Doomsday Argument feels like it's predicting the future based on the past. But the future depends on *choices*. If we solve fusion, if we align AI, *N* goes up. Does the DA say we *can't* solve those problems?"

  "No," Elena said softly. "It says you should have been skeptical that we would solve them *before* you knew your birth rank. Now that you know it, it acts as a constraint. It's like walking into a party and seeing it's 90% empty. You should update that the party is ending, even if the host says they ordered more pizza. The pizza might come, but the prior probability that the party was short just went up."

  "But at a party, you can look at the clock," David said. "You have external data. In the DA, the birth rank is the *only* data. That's the Presumptuous Philosopher again. If SIA is wrong because it lets us predict universe size from nothing, why isn't SSA wrong because it lets us predict civilization lifespan from nothing?"

  Elena was quiet for a long moment. She looked out the window at the city lights. "Because SSA feels like humility. It says, 'Don't assume you're special. Don't assume you're in the first 0.0001% of history.' SIA feels like arrogance. It says, 'My existence is evidence that reality is as crowded as possible.'"

  "Is humility a truth-tracking virtue?" David asked. "Or just a comforting narrative? Maybe the truth is that indexical probability is broken. Maybe there's no fact of the matter about 'how likely I am to be me' in a multiverse or a long timeline."

  "So you'd just toss the Bayesian update?"

  "I'd say the likelihood ratio $P(n|N)$ is ill-defined," David said. "Because 'I' am not a token drawn from a bag. 'I' am a process that only exists if conditions allow. The conditions that allow *N* to be large are the same conditions that allow *n* to be 100 billion. They're correlated. You're treating them as independent variables."

  Elena smiled, a tired, sharp smile. "We've been circling the same drain for twenty minutes. You think the reference class is subjective, so the argument dissolves. I think the reference class is robust enough that ignoring it is willful blindness."

  "Basically," David said. "And until we agree on what an 'observer' is, or whether existence implies probability weight, we're just trading intuitions."

  "Marco would say we're both updating," Elena said, finishing her wine. "Just in different directions."

  "Marco would say we're both doomed and should have bet on it," David laughed. He stood up and started gathering the plates. "You know, the weird thing is, even if you're right... it doesn't tell me what to *do*. If the DA says there's a 90% chance we die out in 200 years, do I work less? Do I have kids? Or do I work harder to beat the odds?"

  Elena stood too, stacking the glasses. "That's the other thing Marco missed. The DA is a prediction, not a policy. If we accept the prediction, we might change our behavior, which changes *N*, which invalidates the prediction. It's self-defeating."

  "Or," David said, carrying the stack to the sink, "it's just a parlor trick. A way for rationalists to feel like they've discovered a secret law of the universe when really they've just found a new way to be anxious about dinner parties."

  Elena bumped his shoulder with hers. "Maybe. But admit it. For a second, when he said '100 billion,' you felt it. That little drop in your stomach. The feeling of being early."

  David paused, his hands under the tap. He watched the water run. "Yeah. I felt it."

  "Me too," Elena said quietly. "And I still think the math is right."

  "And I still think the math is lying to us," David said. He turned off the water. "But I can't tell you where the lie is. Only that it smells like one."

  "Good enough for tonight," Elena said. She turned off the kitchen light, leaving them in the glow of the streetlamps outside. "Lock up when you leave?"

  "Always."

  David listened to her footsteps fade down the hall. He stood in the dark kitchen for a moment longer, counting the seconds, wondering if the count meant anything, before finally heading for the door.
