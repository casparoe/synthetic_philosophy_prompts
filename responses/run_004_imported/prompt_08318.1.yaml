answer: |-
  This is not weird at all. In fact, you have accidentally stumbled into a classic problem in **Game Theory**, specifically a zero-sum game of imperfect information often modeled as "Matching Pennies" or "Hide and Seek."

  You are losing sleep because you are trying to solve a mathematical problem with emotional reasoning. Your brain is designed to find patterns, not to generate entropy. Your mom is doing the same thing.

  Here is the breakdown of why you are stuck, why your sister's advice failed, and the actual algorithmic solution to get your sleep back.

  ### 1. Why Reasoning Harder Doesn't Help
  You are experiencing **infinite recursive reasoning** (often called *Level-k thinking* in economics).
  *   Level 0: I go to my default (Bonfire).
  *   Level 1: She expects my default, so I go Game Room.
  *   Level 2: She expects me to counter her, so she goes Game Room, so I go Bonfire.
  *   Level 3: She knows I know she knows...

  There is no stable equilibrium in reasoning. If you stay in your head, you will cycle forever. The moment you land on a decision based on logic, that logic becomes a pattern your mom can exploit. She knows your logic tree because it's the same one she is using.

  ### 2. Why Your "Gut" Isn't Random
  Your sister told you to "choose randomly," and you tried, but it didn't work. That is because **humans are terrible random number generators.**

  When humans try to act randomly, we subconsciously avoid patterns. We think, "I went to the bonfire last night, so I shouldn't go there tonight, that would look like a pattern." But *avoiding* a pattern is itself a pattern.

  Your mom isn't just guessing; she is reading your micro-behaviors. She knows how you sit when you've made a decision versus when you're hesitating. She knows your "I'm trying to be random" face. If your choice originates in your brain, there is a signal. She is picking up on the signal, not the choice.

  ### 3. The Mathematical Solution: Mixed Strategy Nash Equilibrium
  In game theory, the only way to win a game where your opponent is trying to predict your move is to make your move **unpredictable even to yourself.**

  This is called a **Mixed Strategy.** To minimize the chance of your mom catching you, you must make the probability of you being at the Bonfire 50% and the Game Room 50%.

  If you achieve true 50/50 randomness, the best your mom can do is also guess 50/50. This means you will run into her 50% of the time. Currently, you are running into her 75-80% of the time. Getting down to 50% is a massive victory.

  ### 4. Practical Steps for the Reunion
  You need to introduce **external entropy**. You must outsource the decision to something that has no mind, no pattern, and no relationship with your mother.

  **Step 1: The External Randomizer**
  Do not decide in your head. Use a physical coin, a dice roll, or a cryptographic random number generator app on your phone.
  *   **Heads:** Bonfire.
  *   **Tails:** Game Room.

  **Step 2: Pre-Commitment (Crucial)**
  You cannot flip the coin at 7:00 PM when everyone is gathering. That is when the anxiety is high, and you might be tempted to "override" the coin if it gives you a result you fear.
  *   Flip the coin at 2:00 PM.
  *   **You must obey the coin.** If the coin says Bonfire, you go to the Bonfire. Even if your gut screams "She's going to be there!" You must trust the math over your gut. Your gut is compromised; the math is not.

  **Step 3: Break the Binary (The "Third Option")**
  The game only exists because there are only two options. If you introduce a third option, you dilute the probability of collision even further.
  *   Option A: Bonfire.
  *   Option B: Game Room.
  *   Option C: Go to your room / Go for a walk / Leave early.
  *   Roll a 6-sided die. 1-2: Bonfire. 3-4: Game Room. 5-6: Opt Out.
  *   Now, even if she predicts you perfectly, there is a 33% chance you simply aren't on the board.

  **Step 4: The "Boring" Backup**
  Sometimes, despite all math, you will land in the same spot. If you do, you need a protocol so the conversation doesn't happen.
  *   If you arrive and she is there, do not turn around and leave (that signals avoidance).
  *   Sit down, say a polite hello, and immediately engage with someone else or pull out your phone. Be polite but uninteresting ("Grey Rock" method). If the conversation she wants to corner you into requires your engagement, starve it of oxygen.

  ### 5. Why This Works Against a Predictor
  You asked: *"Why would that even work against someone who's specifically trying to predict that too?"*

  Because she cannot predict a coin flip. She can predict *you*.
  *   If she thinks, "He's going to use a coin," she still doesn't know what the coin will say.
  *   Her best strategy against a coin flip is to flip her own coin.
  *   If she flips a coin and you flip a coin, your collision rate drops to statistical chance (50%).
  *   If she tries to outsmart the coin (e.g., "He probably got Heads, so I'll go Tails"), she is back to guessing, which returns her to human error.

  ### Summary Checklist for This Year
  1.  **Stop trying to outthink her.** Accept that she is smarter about your patterns than you are.
  2.  **Buy a cheap physical coin.** Do not use your brain.
  3.  **Decide early.** Flip the coin in the afternoon when you are calm.
  4.  **Obey the result.** This is the hard part. You must surrender your agency to the coin to remove the "tell."
  5.  **Have an exit strategy.** If you land in the same spot, have a polite excuse ready to leave the conversation after 5 minutes ("I need to grab a drink," "I promised to help X with something").

  **One final thought:**
  You are spending a 5-day vacation playing high-stakes poker with your mother in your head. That is exhausting. The goal of the coin flip isn't just to avoid her; it's to **offload the cognitive burden.** Once the coin lands, the decision is made. You are free to enjoy the evening, regardless of the outcome.

  Let the coin carry the stress. You just follow orders.
