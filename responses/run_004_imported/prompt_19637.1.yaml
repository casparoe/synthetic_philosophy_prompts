answer: |-
  Here are 8 interview questions designed to move past exposition and into the implications of her theory. The four mandatory topics are integrated as Questions 2, 4, 6, and 8, each with a specific follow-up to counter common philosophical dodges.

  **1. The "Cringe" Intuition**
  "When we hear a politician scream about corruption while being corrupt, the reaction isn't just anger; it's almost a kind of second-hand embarrassment. If your theory is right and this is a *presupposition failure* rather than a moral falsehood, does that mean our reaction to hypocrisy should feel more like we're hearing a grammatical error than a lie? Are we cringing because they're bad, or because they're making a category mistake?"

  **2. The "Fancy Vocabulary" Challenge (Mandatory #1)**
  "I want to press on the philosophical utility here. A skeptic might say that mapping blame onto presupposition failure is just relabeling 'do as I say, not as I do' with fancier linguistics vocabulary. If the practical outcome is the same—we reject the hypocrite's blame—what *work* is this distinction doing? Does distinguishing a 'misfire' from a 'moral violation' actually change how we evaluate the situation, or is it just a taxonomic shift?"
  *   **Follow-up (The Dodge: "It clarifies normative structure"):** "If the normative structure changes but the verdict doesn't, why should a non-philosopher care? If I still shouldn't listen to the hypocrite either way, does the mechanism matter outside the seminar room?"

  **3. The Target's Perspective**
  "Most accounts of standing focus on the blamer, but what about the person being blamed? If a hypocrite's blame is defective like a loaded question, does that give the target a specific kind of rebuttal they wouldn't otherwise have? Are they allowed to say 'Your blame didn't land' rather than 'Your blame is unjustified'?"

  **4. Reformation and Accommodation (Mandatory #2)**
  "In linguistics, presuppositions can be 'accommodated'—if I ask 'Have you stopped?' and you say 'Yes,' we retroactively accept the premise. If a hypocrite publicly repents, do they get their standing back instantly via accommodation, or is there a waiting period? Does the speed of that rehabilitation depend on the severity of the vice, like a credit score?"
  *   **Follow-up (The Dodge: "It's context-sensitive"):** "I get that it's nuanced, but give me a heuristic. If a politician quits drinking today, can they condemn public drunkenness tomorrow, or does the presupposition have a 'half-life' that outlasts the behavior?"

  **5. Emotion vs. Speech Act**
  "Blame isn't just words; it's often an expression of anger or resentment. If the speech act of blaming misfires because of a presupposition failure, does the *emotion* behind it also misfire? Can I legitimately feel moral anger at you even if my *statement* of blame is infelicitous, or does the defect poison the emotional well too?"

  **6. Collective Guilt and History (Mandatory #3)**
  "Let's scale this up to nations. If a country condemns war crimes today that its own government committed a generation ago, does your account treat that as hypocrisy? Since the 'blamer' (the current state) isn't numerically identical to the past wrongdoer, does the presupposition hold, or does national continuity mean the presupposition fails just like it would for an individual?"
  *   **Follow-up (The Dodge: "Collectives aren't individuals"):** "But in international law and diplomacy, we treat states as continuous agents. If we accept that continuity for treaties and debt, can we really suspend it just to save the standing to blame?"

  **7. Private vs. Public Standing**
  "Does this presupposition failure happen in private conversations, or is it inherently public? If I quietly blame my spouse for something I also do, is that a presupposition failure, or does the intimacy of the relationship change the background assumptions required for blame to land?"

  **8. Falsification and Evidence (Mandatory #4)**
  "Finally, I want to talk about the bounds of the theory. Philosophical accounts often retreat to 'conceptual analysis' when challenged, making them hard to test. What would actually count as evidence *against* your account? Is there a specific intuitive case where a hypocrite *should* have standing to blame, that would force you to abandon the presupposition model?"
  *   **Follow-up (The Dodge: "It's a priori, not empirical"):** "Even if it's conceptual, it relies on our intuitions about cases. So, if we found a robust, cross-cultural intuition that hypocrites *do* have standing in specific high-stakes scenarios, would that break the theory, or would you argue our intuitions are just mistaken?"
