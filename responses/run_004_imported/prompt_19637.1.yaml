      *   *Question 6 (The Emotion of Blame):*
          *   *Idea:* Blame involves anger/resentment. Does presupposition failure kill the anger or just the words?
          *   *Draft:* If the speech act misfires, should we still feel angry at the target?

      *   *Question 7 (The "Falsification" - Mandatory #4):*
