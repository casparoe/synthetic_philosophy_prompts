              4.  Falsification/Evidence against the account.
          *   For *each* of those 4 specific questions, add a follow-up keyed to the likely dodge.
      *   **Tone:** Engaging, philosophically rigorous but accessible (podcast format), relevant to current politics.

  2.  **Deconstruct the Core Theory (Presupposition Failure in Blame):**
      *   *Standard View:* Hypocrites lack *standing* to blame because they are morally tainted/inconsistent.
      *   *Guest's View:* Blame *presupposes* the blamer is clean. If they aren't, the speech act misfires (like a presupposition failure), rather than being a false assertion or a rude act.
