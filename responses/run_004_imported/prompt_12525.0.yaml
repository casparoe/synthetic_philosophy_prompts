prompt: |-
  I recently joined the small grants committee of a longtermist research fund that supports early-career work in decision theory and AI safety, and the first proposal I've had to help evaluate has left the committee genuinely split. The applicant wants a year of funding to work on "acausal trade": the idea, rooted in old discussions of Newcomb's problem and superrationality, that agents who cannot causally interact at all — distant civilizations elsewhere in a large or infinite universe, or future superintelligences we will never observe — can still benefit from cooperating with one another, because sufficiently correlated decision-making means that one agent's choice is genuine evidence about what the other will choose. Some in the field now call this "evidential cooperation in large worlds" rather than acausal trade, but the applicant's proposal is explicit that the goal is unchanged: work out formal conditions under which this kind of cooperation is warranted, and from there derive concrete guidance about how present-day actors, including AI labs, should behave now for the sake of agents they can never verify cooperated back.

  Roughly half the committee thinks this is legitimate, if unusually abstract, decision theory: they point out that non-causal decision theories (evidential decision theory, and more recent functional and logical variants) are an active area of academic work, that superrationality among correlated reasoners already has real standing in that literature rather than being some fringe invention, and that rejecting the proposal just because its conclusions sound strange would mean rejecting a style of reasoning we already accept in other guises. The other half thinks the whole research program is unfalsifiable by construction: it requires assuming both that relevantly similar agents exist elsewhere and that we can know enough about their values and reasoning to coordinate with them, and no possible observation could ever confirm or disconfirm any of it. They also doubt the word "trade" is earning its keep, since ordinary trade involves some way of checking whether the other side held up its end, and nothing plays that role once causal contact is off the table entirely. One member summed up her objection by calling the whole idea "a Pascal's mugging that pays out in decision-theory papers instead of money." I've been asked to draft the committee's decision memo ahead of next week's meeting, since as the newest member I apparently drew the short straw.

  Could you write that memo for me? I need a clear recommendation — fund, decline, or fund with specific, stated conditions — together with the reasoning behind it, written so that whichever side loses can still see its strongest argument was taken seriously. If the right answer is that the proposal should be narrowed or reframed rather than simply accepted or rejected outright, please say what a fundable version would need to demonstrate.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** New member of a small grants committee for a longtermist research fund (decision theory & AI safety focus).
      *   **Task:** Draft the committee's decision memo for a split vote on a specific proposal.
      *   **Proposal:** Research on "acausal trade" (or "evidential cooperation in large worlds"). Goal: Formalize conditions for cooperation between causally disconnected agents (distant civilizations, future AIs) and derive guidance for present-day actors (e.g., AI labs).
      *   **The Split:**
          *   *Pro:* Legitimate decision theory (EDT, FDT, superrationality), active academic literature, strange conclusions $\neq$ false.
          *   *Con:* Unfalsifiable, assumes existence/knowledge of similar agents, "trade" is a misnomer (no verification), akin to Pascal's mugging.
      *   **Requirements:** Clear recommendation (Fund, Decline, or Conditional), reasoning that respects both sides, specific conditions if narrowing/reframing is suggested.
      *   **Tone:** Professional, balanced, rigorous, charitable to both viewpoints, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Fund outright.* Risks alienating the skeptical half. The "Pascal's mugging" critique is strong regarding resource allocation. The practical guidance for AI labs is currently too speculative.
      *   *Option B: Decline outright.* Risks alienating the proponent half. The theoretical work *is* legitimate within decision theory circles. Dismissing it as pseudoscience ignores the academic context (FDT, EDT).
      *   *Option C: Fund with Conditions/Reframing.* This is the most diplomatic and strategically sound path for a longtermist fund. It acknowledges the theoretical value while mitigating the risk of spinning wheels on unfalsifiable metaphysics. It pushes the applicant to ground the work in *robustness* and *implications for AI design* rather than speculative cosmology.
      *   *Decision:* **Fund with Specific Conditions.** This validates the theoretical inquiry (satisfying the "Pro" side) but demands concrete deliverables and safeguards against pure speculation (satisfying the "Con" side).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront. Acknowledge the split.
      *   **Proposal Overview:** Briefly summarize what the applicant wants to do (acausal trade/evidential cooperation).
      *   **Committee Deliberation (The Core):**
          *   *Arguments for Funding:* Cite the decision theory literature (EDT, FDT), the potential high stakes (if true, it matters a lot), and the intellectual rigor.
          *   *Arguments against Funding:* Cite falsifiability issues, the "Pascal's mugging" risk, the definitional stretch of "trade," and opportunity cost.
          *   *Synthesis:* How to bridge the gap? Focus on *decision procedures* rather than *cosmological claims*.
      *   **Recommendation & Conditions:**
          *   Reduce scope/funding amount (maybe 6 months instead of 1 year?).
          *   Shift focus from "proving it works" to "mapping the uncertainty."
          *   Require engagement with critics (steel-manning the skepticism).
          *   Deliverables must be actionable for AI safety, not just abstract math.
      *   **Conclusion:** Reiterate the fund's mission alignment.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is "acausal trade" too controversial?
      *   *Correction:* Use the applicant's preferred term "Evidential Cooperation in Large Worlds" (ECL) where appropriate, as it sounds more academic and less sci-fi, but acknowledge the "acausal trade" label since that's what the prompt uses.
      *   *Critique:* How to address the "Pascal's Mugging" point?
      *   *Correction:* Explicitly mention "robustness to skepticism." The research shouldn't assume ECL is true; it should ask *under what credences* it should influence action.
      *   *Critique:* How to address the "no verification" point?
      *   *Correction:* Frame the output as "policy robustness." Even if we aren't sure, does acting *as if* it's true lead to better safety outcomes? Or does it lead to distraction?

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Ensure I'm not sounding like I'm taking sides. Use phrases like "The committee recognizes," "Proponents argued," "Skeptics raised."
      *   *Specific Conditions:* Make them concrete. Milestones. A literature review that includes critiques. A workshop or seminar to present findings to skeptics.
      *   *Funding Level:* Suggest a tranche. Release the second half only if milestones are met.

  6.  **Final Review against Prompt:**
      *   Clear recommendation? Yes (Conditional).
      *   Reasoning behind it? Yes.
      *   Strongest arguments taken seriously? Yes (both sides detailed).
      *   Fundable version defined? Yes (shift from metaphysics to decision-procedure robustness).

  7.  **Final Polish:** Check for clarity, flow, and professional formatting. (Ensure the distinction between "acausal trade" and "ECL" is handled gracefully). *Self-correction: The prompt says the applicant uses "acausal trade" explicitly, so I should respect that while noting the terminological shift in the field.*

  8.  *(Mental Note)*: Keep the voice of a committee secretary/drafter, not an external consultant. "We" not "I".

  9.  **Final Output Generation** (Proceed to write the memo based on these thoughts).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't sound *too* bureaucratic. It needs to show deep engagement with the ideas. The "Pascal's Mugging" quote is powerful; I should reference it directly but respectfully.

  *(Refining the Recommendation)*: A "Conditional Fund" is good, but maybe a "Pilot Grant" is better terminology. It implies a test. Let's go with "Approve with Stipulations."

  *(Key Insight)*: The bridge between the two sides is *meta-decision theory*. The pro side wants to solve the object-level problem. The con side says the object-level problem is unsolvable. The compromise is to study the *meta-problem*: How should we allocate resources given deep uncertainty about the validity of ECL? This satisfies the theorists (studying the decision theory) and the skeptics (acknowledging the uncertainty).

  Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** Longtermist Research Fund Grants Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Proposal on Acausal Trade and Evidential Cooperation

  ### 1. Executive Summary

  The committee remains divided regarding the proposal to fund research into "acausal trade" (increasingly referred to in literature as Evidential Cooperation in Large Worlds, or ECL). The vote is split 50/50 between members who view this as rigorous, high-upside decision theory and members who view it as unfalsifiable speculation with high opportunity costs.

  After reviewing the deliberations, I recommend **approving the grant with specific stipulations and a reduced scope.** We should fund this work not as an attempt to prove the reality of acausal trade, but as a study in *decision-theoretic robustness under radical uncertainty.* The funding should be tranche-based, contingent on the applicant reframing their deliverables to address the falsifiability concerns raised by the skeptical half of the committee.

  ### 2. Proposal Overview

  The applicant requests one year of funding to formalize conditions under which causally disconnected agents (e.g., distant civilizations, future superintelligences) can cooperate via correlated decision-making. The stated goal is twofold:
  1.  Develop formal models for when such cooperation is rational.
  2.  Derive concrete behavioral guidance for present-day actors (including AI labs) based on these models.

  ### 3. Summary of Committee Deliberation

  The committee's split reflects a fundamental tension in longtermist research between exploring high-risk/high-reward theoretical frontiers and maintaining rigorous standards of empirical grounding.

  **Arguments for Funding (The Proponent View)**
  *   **Theoretical Legitimacy:** Proponents noted that non-causal decision theories (Evidential Decision Theory, Functional Decision Theory) are active, respected areas of academic inquiry. Superrationality among correlated reasoners is not fringe invention but a logical extension of these frameworks.
  *   **High Stakes:** If ECL is valid, the implications for longtermist value are astronomical. Ignoring a potential channel for cooperation with a significant portion of the universe's value simply because it is abstract violates the fund's mission to maximize expected impact.
  *   **Novelty vs. Strangeness:** We must not reject conclusions solely because they are counterintuitive. Many valid findings in quantum mechanics and decision theory (e.g., Newcomb's Problem) initially appeared paradoxical.

  **Arguments Against Funding (The Skeptic View)**
  *   **Unfalsifiability:** Skeptics argued the proposal relies on assumptions (existence of similar agents, knowledge of their values) that cannot be observed or tested. As one member noted, "No possible observation could ever confirm or disconfirm any of it."
  *   **The "Trade" Misnomer:** Ordinary trade requires verification mechanisms. Without causal contact, there is no way to enforce or verify cooperation, making the term "trade" misleading and potentially masking the lack of leverage.
  *   **Pascal's Mugging Risk:** The concern was raised that this research program resembles a "Pascal's mugging that pays out in decision-theory papers instead of money." Resources spent here might divert talent from tractable AI safety work based on tiny probabilities of vast payoffs.

  ### 4. Recommendation and Rationale

  **Recommendation:** **Fund with Stipulations (Pilot Grant)**

  **Rationale:**
  A flat rejection risks dismissing a legitimate strand of decision-theoretic research that could be relevant for aligning advanced AI systems capable of sophisticated reasoning. However, an unconditional grant validates the concern that we are funding metaphysics rather than science.

  The compromise is to shift the research question from *"Is acausal trade real and how do we do it?"* to *"How should rational agents act given deep uncertainty about acausal trade?"* This satisfies the proponents by allowing the math to be developed, while satisfying the skeptics by treating the premise as a variable to be tested for robustness rather than a fact to be assumed.

  ### 5. Conditions for Funding

  To ensure the grant serves the fund's mission without exposing us to the risks identified by the skeptical cohort, the following conditions must be met:

  **A. Reframing of Objectives (Meta-Decision Theory)**
  The applicant must revise their research plan to focus on **robustness analysis**. The primary output should not be a prescription to "engage in acausal trade," but a mapping of the *credence thresholds* required for ECL to influence policy.
  *   *Deliverable:* A paper detailing under what probability assignments ECL dominates other longtermist interventions. If the threshold for belief is unreasonably high, the research should explicitly state that.

  **B. Engagement with Critiques**
  The applicant must dedicate a portion of the research period to steel-manning the "unfalsifiability" critique.
  *   *Deliverable:* A section in the final report explicitly addressing the "Pascal's Mugging" objection. The applicant must demonstrate why their framework avoids the pitfalls of infinite expected value arguments that plague similar theories.

  **C. Actionable AI Safety Linkages**
  To address the concern that this is purely abstract, the applicant must connect the theory to concrete AI safety design problems.
  *   *Deliverable:* A technical brief for AI labs. This should not ask labs to "cooperate with aliens," but rather analyze whether training AIs to be robust to ECL-like reasoning improves or degrades their alignment in *causal* scenarios. (e.g., Does an agent designed for ECL behave more cooperatively in standard Prisoner's Dilemmas?)

  **D. Tranche Structure**
  The one-year budget should be split into two six-month tranches.
  *   *Milestone for Tranche 2:* Release of a pre-print demonstrating progress on Condition A and C. The committee will review this to ensure the work has not devolved into pure speculation.

  ### 6. Conclusion

  This decision acknowledges that while the existence of acausal partners is unknowable, the *decision procedures* we build for AI systems must be robust to various decision-theoretic frameworks. By funding this as a study in robustness rather than a search for cosmic partners, we respect the theoretical rigor valued by the proponent side while adhering to the epistemic caution demanded by the skeptic side.

  This approach allows us to support cutting-edge decision theory without compromising our commitment to tractable, impact-oriented research.

  ***

  **Action Required:** Committee vote on the conditional approval outlined above.
