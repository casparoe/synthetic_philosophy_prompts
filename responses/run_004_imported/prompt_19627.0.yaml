answer: |-
  You have excellent instincts. You are not misremembering, and your intuition is sharper than your Tuesday philosophy meetup friend's. You have stumbled onto one of the most famous debates in the philosophy of death.

  To write Eleanor authentically, you need to know exactly where the logical load-bearing walls are in Epicurus's argument, and where the cracks have been found by modern philosophers. Here is the breakdown of the argument, the assumption you spotted, and the Thomas Nagel objection you half-remembered.

  ### 1. The Epicurean Argument: What is actually doing the work?

  You are correct that the famous quote ("When we are, death is not...") relies on a hidden premise. In analytic philosophy, this is often called the **Experience Condition** (or the Existence Requirement).

  **The Argument Structure:**
  1.  **Hedonism:** Good and bad consist solely in sensation (pleasure and pain). (Established earlier in the *Letter to Menoeceus*).
  2.  **The Experience Condition:** A state of affairs can only be good or bad for a person if that person exists to experience it.
  3.  **The Nature of Death:** Death is the permanent end of experience/existence.
  4.  **Conclusion:** Therefore, death cannot be bad for the person who dies.

  **Is he "helping himself" to the assumption?**
  Yes and no. In the context of the *Letter*, Epicurus feels entitled to the Experience Condition because of Premise 1 (Hedonism). If the only "bad" is pain/suffering, and a corpse cannot feel pain, then a corpse cannot suffer a bad.

  However, your intuition is spot on: this only works if you define "bad" strictly as "felt suffering." If you define "bad" as "loss of potential" or "frustration of interests," the argument collapses. Epicurus is essentially defining the problem away by restricting what counts as a harm.

  **For Eleanor:** This is crucial for her characterization. She is using Epicurus therapeutically. Her goal isn't just metaphysical truth; it's *ataraxia* (freedom from anxiety). She is trying to convince her daughter that the *state of being dead* is not a state of suffering. She is fighting the fear of *what it will be like* to be dead.

  ### 2. The Nagel Objection: You remembered correctly

  The philosopher you are thinking of is indeed **Thomas Nagel**. The essay is titled **"Death"** (1970), published in his collection *Mortal Questions* (1979). It is the standard contemporary counter-argument to Epicurus.

  Nagel attacks the **Experience Condition**. He argues that you can be harmed by things you do not experience.

  **The Betrayal Example:**
  Nagel asks us to imagine a man who is betrayed by his friends behind his back. They mock him and spread lies about him. However, the man never finds out. He dies happily, thinking his friends love him.
  *   **Epicurus would say:** This is not bad for him. He never felt the pain of the betrayal.
  *   **Nagel says:** This *is* bad for him. He was wronged. His dignity was violated. The fact that he didn't experience the pain doesn't mean the harm didn't occur.

  **The Deprivation Account:**
  Nagel applies this to death. Death is bad not because the state of being dead is painful (Epicurus is right about that), but because death **deprives** you of the life you would have otherwise had.
  *   If you die at 60, but could have lived happily until 90, death is a misfortune because it stole those 30 years of good life from you.
  *   It doesn't matter that you aren't around to "feel" the loss. The loss is objective.

  **For Eleanor:** This is the source of the conflict in your novel. Eleanor is arguing from the **No-Subject** view (I won't be there to suffer). Her daughter is grieving from the **Deprivation** view (I will lose you / You will lose your future). Both are logically coherent, but they are talking past each other.

  ### 3. Is the argument "Airtight"?

  Your friend is confusing **validity** with **soundness**.
  *   **Validity:** If you accept Epicurus's premises (Hedonism + Experience Condition), the conclusion follows logically. In that narrow sense, it is airtight.
  *   **Soundness:** Are the premises true? Most contemporary philosophers reject the Experience Condition (thanks largely to Nagel). Therefore, the argument is not sound.

  To say "only sentimental people find it unconvincing" is philosophical dogmatism. It ignores that human beings value things beyond their own immediate conscious experience (e.g., we care about our reputations after death, the success of our children, the completion of our projects). Epicurus dismisses these as "vain desires," but for most people (and likely your daughter character), these are the things that make life meaningful.

  ### 4. How to use this in the Novel

  This philosophical tension is gold for your scenes. Here is how you can deploy it to deepen the conflict between Eleanor and her daughter.

  **A. Eleanor's Motivation (The Shield)**
  Eleanor shouldn't just be quoting this to be smart. She should be using it as a shield.
  *   If death is "nothing," then she doesn't have to be afraid.
  *   If she admits the Nagel view (that death is a deprivation), she has to admit she is losing something valuable. That is terrifying.
  *   *Writing Tip:* Have Eleanor get slightly annoyed or cold when her daughter talks about "missing" her. To Eleanor, "missing" implies a loss that matters. To an Epicurean, once she is gone, the loss is irrelevant because *she* is not there to be deprived.

  **B. The Daughter's Grief (The Deprivation)**
  The daughter's grief is the living embodiment of Nagel's argument.
  *   When she cries, "It's not fair, you have so much left to do," she is making the Deprivation Argument.
  *   When she says, "I won't hear your voice again," she is highlighting the loss of relationship goods that exist outside of Eleanor's own consciousness.
  *   *Writing Tip:* The daughter shouldn't try to debate philosophy. Her grief *is* the counter-argument. Eleanor quotes logic; the daughter quotes love. Logic cannot comfort love.

  **C. The Nuance of "Dying" vs. "Death"**
  Epicurus distinguishes between *dying* (the process) and *death* (the state).
  *   Epicurus admits dying can be painful.
  *   He argues *death* (being dead) is not.
  *   *Conflict:* Eleanor might be stoic about the diagnosis (the dying), but her daughter is terrified of the absence (the death). Eleanor might accidentally minimize the pain of the *process* by focusing too much on the nothingness of the *end*.

  **D. A Specific Scene Idea**
  Have Eleanor quote the line perfectly. Then have the daughter respond with something that bypasses the logic entirely.
  *   **Eleanor:** "When death is present, we no longer exist. It is nothing to us."
  *   **Daughter:** "It's not nothing to *me*, Mom."
  *   *Analysis:* This shuts down the Epicurean argument. Epicurus is talking about the harm to the *deceased*. The daughter is talking about the harm to the *survivors*. Epicurus actually has advice for survivors (remember the pleasure of the past), but Eleanor might be too focused on her own non-existence to offer that comfort.

  ### Summary for your notes:
  1.  **You are right:** The argument relies on the "Experience Condition" (you must exist to be harmed).
  2.  **Nagel is right:** You can be harmed without experiencing it (betrayal, deprivation of future life).
  3.  **Your Friend is wrong:** The argument is valid but not sound; rejecting the premise is rational, not sentimental.
  4.  **For the Book:** The tragedy isn't that Eleanor is wrong about philosophy; it's that her philosophy, while logically defensible, cannot hold her daughter's hand. The "dryness" you mentioned is the perfect texture for a woman trying to keep her own terror at bay by turning herself into a logical proposition.

  If you want to read the Nagel essay yourself, it is very short and remarkably clear. It will give you the precise vocabulary to make Eleanor's internal monologue (or her debates with colleagues) incredibly sharp.
