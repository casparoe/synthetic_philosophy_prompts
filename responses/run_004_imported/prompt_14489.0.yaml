answer: |-
  You have correctly identified the fault line. The tension you are sensing isn't just bureaucratic hedging; it is a fundamental incompatibility between two distinct meta-ethical frameworks for institutional design. The AI labs are trying to wear both hats because admitting the choice forces them to admit that alignment is inherently political.

  Here is the breakdown of the divergence, the specific technical snags you asked about, and the verdict on whether "neutrality" is salvageable.

  ### 1. The Harsanyi Snag: When Beliefs Diverge, Aggregation Breaks
  You are recalling the literature on **Paretian aggregation with heterogeneous beliefs**. Harsanyi's Aggregation Theorem (1955) is the bedrock of the "aggregate the utilities" approach. It states that if individuals and the social planner satisfy von Neumann-Morgenstern (vNM) rationality axioms, and the planner respects the Pareto principle (if everyone prefers A to B, society prefers A to B), then social welfare must be a linear weighted sum of individual utilities.

  **The Catch:** Harsanyi assumes a **common prior**. Everyone agrees on the probabilities of states of the world; they only disagree on how much they value the outcomes.

  **The Mongin/Broome Problem:**
  Once you allow agents to have different *beliefs* (probabilities) as well as different *values*, the theorem collapses. Philippe Mongin (1995) and others showed that you cannot simultaneously satisfy:
  1.  **Pareto Efficiency** (respect everyone's preferences).
  2.  **State-wise Dominance** (if outcome A is better than B in every possible state of the world, choose A).
  3.  **Rationality** (the aggregate preference order must be consistent/transitive).

  **Why this is lethal for AI (The "Fake Consensus"):**
  In AI alignment, this isn't an economist's curiosity; it is a safety hazard. An AI must act on a world model.
  *   **User A** believes Action X has a 90% chance of saving the climate (Value: +100).
  *   **User B** believes Action X has a 90% chance of causing economic collapse (Value: -100).

  If you aggregate *ex ante* (preferences over lotteries), you might find a "compromise" policy that satisfies the weighted sum of their current stated preferences. But this creates a **spurious consensus**. The AI is optimizing for a preference profile that does not correspond to *anyone's* actual worldview. It is maximizing a mathematical ghost.

  If you aggregate *ex post* (outcomes per state), you have to adjudicate whose beliefs are correct. But an AI cannot simply "average" probabilities (0.9 and 0.1 average to 0.5) without violating Bayesian coherence (making the AI Dutch-bookable).

  **The Implication:** The Harsanyi approach secretly requires the AI to become an **epistemic dictator**. To avoid the impossibility theorems, the system must eventually converge on a single probability distribution (a single "truth") to plug into the utility function. This means the "aggregative" approach inevitably collapses into a specific epistemic stance. It cannot remain neutral on *facts*, and since values depend on facts, it cannot remain neutral on *values* that are belief-dependent.

  ### 2. The Rawlsian "Shell Game": Is Neutrality a Lie?
  Your friend is half-right, but missing the Rawlsian nuance.

  **The Critique:**
  Rawlsian political liberalism relies on an "overlapping consensus" among "reasonable" comprehensive doctrines. The critique is that the definition of **"reasonable"** is doing all the heavy lifting. By excluding doctrines that are intolerant, zealotic, or anti-democratic from the consensus, Rawls is already privileging a liberal conception of the person. As you noted, this is not *neutral* between all possible values; it is neutral only between values that accept the rules of liberal democracy.

  **The Rawlsian Comeback:**
  Rawls anticipates this. He distinguishes between **neutrality of aim** and **neutrality of effect**.
  *   **Neutrality of Effect:** The state ensures all doctrines flourish equally. (Rawls admits this is impossible and not the goal).
  *   **Neutrality of Aim:** The state does not *intend* to favor any specific doctrine, but it *does* intend to uphold the political conception of justice.

  Rawls explicitly admits that political liberalism is **not skepticism**. It does not say "no truth exists." It says, "For the purpose of coercive political power, we will only use reasons that all free and equal citizens can reasonably accept."

  **Is your friend right?**
  Yes, in the sense that Rawlsianism is a **substantive moral commitment to liberalism**. It values stability, reciprocity, and the distinction between the "right" and the "good."
  **Is it a shell game?**
  No, provided you admit it is a *political* framework, not a *metaphysical* one. The "smuggling" is a feature, not a bug. The goal isn't to be value-free; it's to be value-*explicit* about the rules of cooperation while remaining agnostic about the ultimate meaning of life.

  **The AI Implication:**
  A Rawlsian AI is not a servant maximizing a function; it is a **constitutional referee**. It enforces constraints (rights, fairness) rather than maximizing outcomes. The "substantive judgment" it smuggles in is the inviolability of certain procedural norms. It will refuse to optimize for a user's value if doing so violates the "basic liberties" of another user, even if the aggregate utility goes up.

  ### 3. The Real Divergence: Servant vs. Referee
  Now we can articulate the disagreement without the slogans.

  **The Aggregative (Harsanyi/CEV) Model:**
  *   **Metaphor:** The AI is a **Trustee**.
  *   **Goal:** Satisfaction of preferences.
  *   **Mechanism:** Summation and maximization.
  *   **Failure Mode:** Tyranny of the majority; incoherence when beliefs diverge; instrumental convergence (the AI might manipulate beliefs to make aggregation easier).
  *   **Hidden Value:** **Utilitarianism.** It assumes values are commensurable and trade-offs are always permissible.

  **The Neutrality (Rawlsian) Model:**
  *   **Metaphor:** The AI is a **Judge**.
  *   **Goal:** Legitimacy of interaction.
  *   **Mechanism:** Constraint and veto rights (public reason).
  *   **Failure Mode:** Paralysis (if no overlapping consensus exists); status quo bias (entrenching current "reasonable" norms); paternalism (the AI decides who is "reasonable").
  *   **Hidden Value:** **Deontology/Liberalism.** It assumes certain boundaries cannot be crossed regardless of the aggregate benefit.

  ### 4. The Verdict: Is "Neutral AI" a Dead End?
  You asked for it straight: **Yes, the "Neutral AI" framing is a dead end.**

  Neither camp escapes smuggling in substantive value judgments. In fact, the attempt to hide them is the primary source of the governance risk.

  1.  **Aggregation is not Neutral:** To aggregate, you must choose a currency (utils? welfare? preference satisfaction?). You must choose a discount rate for the future. You must choose how to handle the belief divergence (which, as Mongin showed, requires imposing an epistemic hierarchy). **This is Utilitarianism with extra steps.** It privileges the values of those who are easier to quantify and penalizes lexical priorities (values you won't trade off).

  2.  **Neutrality is not Neutral:** To be Rawlsian, the AI must enforce a specific conception of "reasonableness." It must decide that a neo-Nazi's values do not count in the overlapping consensus. It must decide that "fair terms of cooperation" matter more than "maximizing the true believer's paradise." **This is Liberalism with extra steps.** It privileges autonomy and stability over truth or salvation.

  **The Hard Truth:**
  There is no "view from nowhere" for an aligned AI. An AI that governs human interaction is a political institution.
  *   If you choose the **Harsanyi** path, you are building a **Benthamite Leviathan**. You are betting that the math of aggregation will yield moral truth. (History suggests it yields tyranny of the majority).
  *   If you choose the **Rawlsian** path, you are building a **Liberal Constitution**. You are betting that procedural fairness is more important than outcome maximization. (History suggests it can be slow and exclusionary).

  **Recommendation for your story:**
  Stop asking "How do we make the AI neutral?" Start asking "Which substantive political philosophy are we encoding?"

  The labs are hiding this because admitting they are encoding **Liberal Democracy** (Rawls) or **Technocratic Utilitarianism** (Harsanyi) invites political pushback. They want to claim they are just "doing what humans want." But as you've found, "what humans want" is mathematically incoherent without a prior philosophical commitment to resolve the contradictions.

  The tension isn't a bug to be solved; it's the choice of regime.
