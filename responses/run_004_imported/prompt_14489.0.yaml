      *   *Why it matters for AI:* An AI acting on aggregated values needs a world model. If User A thinks Action X saves the world (90% prob) and User B thinks Action X destroys the world (90% prob), a simple utility sum fails. The AI has to adjudicate *truth* or *probability*, not just value. If it aggregates probabilities, it might violate rationality axioms (Dutch bookability). If it picks one set of beliefs, it violates neutrality.
