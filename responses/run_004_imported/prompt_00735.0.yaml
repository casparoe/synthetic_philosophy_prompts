answer: |-
  **The Unstable Ground: Why Elga's Bayesian Fix Cannot Save Us from Boltzmann Brains**

  The Boltzmann brain problem is often sold as a cosmological curiosity, a weird edge-case in the thermodynamics of eternal universes. But as Sean Carroll has forcefully argued, it is actually a crisis of epistemology. If our best theories of the cosmos imply that we are likely to be momentary thermal fluctuations with false memories rather than evolved observers embedded in history, then those theories do more than predict strange particles; they predict that our reasoning is broken. Carroll's solution is drastic but clean: any theory implying we are likely Boltzmann brains (BBs) is "cognitively unstable" and must be rejected *a priori*. We cannot coherently believe a theory that undermines the justification for believing it.

  In his 2025 paper "Boltzmann brains and cognitive instability," Adam Elga attempts to dismantle this bind. He argues that Carroll's "instability" is a mirage created by abstract reasoning, one that dissolves under a rigorous Bayesian treatment of specific evidence. Using an analogy of a hallucinogenic aspirin bottle, Elga suggests that we can favor the "Ordinary Observer" (OO) hypothesis simply because our specific, orderly experiences are statistically more likely under that hypothesis than under the BB hypothesis, where experiences should be mostly chaotic.

  Elga's argument is a masterpiece of formal epistemology, but it ultimately fails to escape the trap it seeks to dismantle. While Carroll's "cognitive instability" verdict may feel like a dogmatic ban to some, Elga's Bayesian resolution relies on a premise that begs the very question at issue. The disanalogies Elga flags—specifically regarding self-locating uncertainty and the range of possible experiences—are not minor technical hurdles; they are the structural supports of the skeptical problem. By attempting to calculate our way out of skepticism, Elga assumes the reliability of the very cognitive faculties the Boltzmann brain hypothesis calls into doubt. Carroll is right: the instability is real, and Elga's mathematics cannot wish it away.

  To see why Elga's dissolution fails, we must look closely at his "Range of Experience" premise. Elga argues that while BBs might be numerically abundant, the vast majority of them would experience chaotic, fragmented noise, whereas OOs experience coherent, law-governed reality. Therefore, finding oneself with coherent evidence (telescopes, textbooks, consistent memories) should update our probabilities heavily in favor of being an OO. This is the core of his aspirin analogy: if the hallucinogen usually produces visions of pink elephants, and you see a pill bottle, you are likely not hallucinating.

  The problem is that the Boltzmann brain scenario is not analogous to the pink elephant. The definition of a problematic Boltzmann brain is not merely a brain that fluctuates into existence; it is a brain that fluctuates into existence *complete with false memories of a coherent life*. The threat of the BB hypothesis is not that we see chaos, but that we see order that isn't real. If a cosmological model predicts that BBs with *exact* replicas of our current orderly experiences outnumber OOs, then Elga's likelihood ratio collapses. We cannot use the "orderliness" of our experience as evidence against being a BB, because the BB hypothesis explicitly accounts for the experience of order. To assume that "real" order is distinguishable from "fluctuated" order from the inside is to assume the reliability of the memory and reasoning processes that the BB hypothesis suggests are noise.

  Elga anticipates this objection by flagging the disanalogy of self-locating uncertainty. In the aspirin case, you know who you are; in the cosmological case, you don't know if you are the one OO or one of the $10^{100}$ BBs. Elga attempts to bridge this with a refined Principle of Indifference, suggesting we should weight our credence by the "measure" of experiences. But this move smuggles in the instability it hopes to resolve. To apply Elga's Bayesian machinery, one must assign a prior probability to the "Range Premise"—the claim that BBs mostly have chaotic experiences. But how do we justify that premise? We justify it using thermodynamics and cosmology. Yet, if we are BBs, our knowledge of thermodynamics is itself a fluctuation. We are using potentially deluded reasoning to calculate the probability that our reasoning is deluded.

  This is where Carroll's "cognitive instability" diagnosis proves more robust than Elga's "cognitive calculation." Carroll recognizes that the BB problem is not a standard empirical uncertainty like the aspirin case; it is a transcendental condition on rationality. In the aspirin case, you have a background framework of a stable world in which pills and hallucinations exist. In the BB case, the framework itself is the variable. If the theory says your evidence is likely noise, you cannot use that evidence to test the theory without circularity. Elga's Bayesian update requires a stable link between evidence and hypothesis ($P(Evidence | Hypothesis)$). But if the Hypothesis (I am a BB) implies that the Evidence is unconnected to reality, the likelihood term becomes undefined or self-undermining.

  Elga's resolution effectively pushes the cognitive instability back one step. He avoids the instability in the *conclusion* (we can believe we are OOs) but introduces it into the *premises* (we must assume our thermodynamic reasoning is sound to establish the Range Premise). This is not a dissolution of the problem; it is a displacement. A theory that requires us to assume our cognitive faculties are reliable in order to prove they are reliable is precisely what Carroll means by "cognitively unstable." Elga shows that we can construct a mathematical model where we come out as OOs, but he cannot show that believing that model is rational if the model itself allows for the dominance of BBs.

  Furthermore, Elga's reliance on the Principle of Indifference in the context of self-location is notoriously fragile. In cosmological settings, how one defines the "reference class" of observers determines the outcome. If the reference class is "observers with my current mental state," and the cosmology predicts BBs dominate that class, Elga's math yields the skeptical result. If the reference class is "observers with orderly causal histories," we get the OO result—but defining the class that way assumes the conclusion. Elga tries to thread the needle by focusing on the "range of experiences," but without an independent guarantee that our experience is causally connected to the world (which the BB hypothesis denies), the distinction between "orderly BB" and "OO" is empirically invisible.

  Ultimately, Elga's paper is a valiant attempt to naturalize the problem, treating it as a standard probability puzzle rather than a philosophical crisis. But the Boltzmann brain problem is a crisis precisely because it resists naturalization. It reveals a limit to what empirical science can tell us about our own existence. Carroll's insistence that we must reject theories that imply we are BBs is not an arbitrary dismissal of data; it is a recognition that science presupposes the reliability of the scientist. If a cosmological model predicts that scientists are mostly hallucinations, the model has violated the conditions of its own verification.

  Elga is correct that the aspirin analogy illuminates how we handle local skepticism. But he is wrong to think it scales to global skepticism. In the aspirin case, the world remains stable enough to check the label. In the Boltzmann case, the label is part of the hallucination. We cannot calculate our way to safety because the calculator is what's in question. Carroll's verdict stands: a theory that makes us Boltzmann brains is not just unlikely; it is incoherent. Elga's Bayesian machinery is elegant, but it is built on ground that the Boltzmann hypothesis washes away. We must side with Carroll. To save science, we must be willing to ban the theories that threaten to dissolve the scientist.
