answer: |-
  This is a sharp diagnostic. Your cohort's intuition that *svatah-/paratah-pramanya* maps onto Internalism/Externalism is a common heuristic in comparative philosophy, but as you've noticed, it collapses under technical scrutiny. The mapping fails because the Analytic Internalism/Externalism debate is primarily about *what constitutes justification* (access to reasons vs. reliable process), whereas the Nyaya-Mimamsa debate is primarily about the *causal genesis of validity* and the *epistemic access to that validity status*.

  To use this in a paper, you need to disentangle the **ontology of validity** (what makes a cognition valid) from the **epistemology of certification** (how we know it is valid). The Mimamsa-Nyaya debate straddles both, while the Analytic debate usually focuses on the former.

  Here is a walkthrough of the mechanics, followed by a critique of the Internalism/Externalism analogy.

  ---

  ### 1. The Mimamsa Position: *Svatah-pramanya* (Intrinsic Validity)
  Focus primarily on **Kumarila Bhatta** (*Slokavarttika*, *Pramanyavada*), as his formulation is the primary target for Nyaya. (Note: The Prabhakara school holds a slightly different view involving *triputi-pratyaksa*, but Kumarila is the standard interlocutor for this debate).

  **The Core Claim:**
  When a cognition (*jñana*) arises, its validity (*pramanya*) arises *with* it, caused by the same factors that produce the cognition itself. Invalidity (*apramanya*), however, is extrinsic (*paratah*), caused by defects (*dosha*) in the causal chain.

  **The Arguments (Mechanics):**
  1.  **The Regress Argument (*Anavastha*):** If the validity of Cognition A required a second Cognition B to certify it, then B would require C, and so on. We would never arrive at certain knowledge. To stop the regress, some cognitions must be self-validating. Mimamsa argues *all* are initially self-validating.
  2.  **The Argument from Practical Engagement (*Pravrtti*):** When you see water in a desert, you move toward it immediately. You do not pause to verify the validity of the visual cognition before acting. If validity were extrinsic and required verification prior to action, all purposeful action would be paralyzed.
  3.  **The Distinction between *Utpatti* and *Jnapti*:** Kumarila distinguishes the *origin* of validity (*utpatti*) from the *awareness* of validity (*jnapti*).
      *   *Utpatti:* Intrinsic. The cognition is valid the moment it arises.
      *   *Jnapti:* Can be intrinsic or extrinsic. Usually, we know a cognition is valid intrinsically (it feels veridical), but we might know it is *invalid* extrinsically (e.g., you go to the water and find it's a mirage).

  **Crucial Nuance:** Mimamsa is not claiming we have *access to reasons* for the validity. They are claiming validity is a **default status**. It is a metaphysical claim about the causal structure of cognition: the causes that generate the cognition (light, eye, mind) are sufficient to generate validity unless defeaters (distance, disease, darkness) intervene.

  ### 2. The Nyaya Position: *Paratah-pramanya* (Extrinsic Validity)
  Focus on the mature Nyaya of **Udayana** (*Kiranavali*) and **Gangesa** (*Tattvacintamani*).

  **The Core Claim:**
  The validity of a cognition is not given with the cognition itself. Validity is a property that must be established by conditions *external* to the genesis of the cognition. A cognition is merely a presentation (*anubhava*); its status as knowledge (*prama*) is earned.

  **The Mechanics of Certification:**
  Nyaya argues that for a cognition to be known as valid, two things are generally required:

  1.  **Successful Practical Activity (*Pravrtti-samarthya*):**
      This is the *samvada* (correspondence/agreement) test. If I cognize "There is water," the validity is confirmed only when I go there and actually drink. The successful fruition of the intention generated by the cognition confirms the cognition's correspondence to reality.
      *   *Note:* This is not crude pragmatism (truth = success). It is pragmatic *verification* of correspondence. The success indicates the object was actually there as presented.

  2.  **The Second-Order Cognition (*Anuvyavasaya*):**
      This is where your cohort's Reliabilism mapping breaks down. For Nyaya, the first-order cognition ("This is water") does not reveal its own validity. A second-order cognition is required: "I know that this is water" (*aham etat jalam janami*).
      *   **The Role of *Anuvyavasaya*:** This reflective awareness grasps the first-order cognition *and* its validity. Without this second step, you have a true belief (potentially), but you do not have *certified knowledge*.
      *   **Causal Chain:** The validity is caused by "excellences" (*guna*) in the causal chain (e.g., proper light, healthy eye), but the *knowledge of that validity* requires the reflective step.

  **Why Nyaya Rejects *Svatah*:**
  Nyaya argues that if validity were intrinsic, error would be impossible to explain without abandoning the intrinsic nature. If a cognition announces its own validity, how do we distinguish veridical perception from illusion *from the inside*? Since illusions (silver in nacre) feel identical to veridical perceptions at the moment of arising, validity cannot be intrinsic to the *phenomenology* or the *genesis*. It must depend on the external relation to the object.

  ### 3. Critiquing the Internalism/Externalism Mapping

  Your skepticism is well-founded. Here is how to dissect the analogy for your paper.

  #### Where the Analogy Holds (The "Default" vs. "Earned" Distinction)
  *   **Mimamsa as "Dogmatism" / "Phenomenal Conservatism":** In analytic terms, Mimamsa is closer to Pryor's Dogmatism or Huemer's Phenomenal Conservatism ("If it seems to S that P, then S has some justification for P"). Validity is presumptive. This feels "Internalist" because it relies on the immediate givenness of the cognition.
  *   **Nyaya as "Verificationism":** Nyaya requires an external check (successful action) to certify the cognition. This feels "Externalist" because the truth-maker involves a causal fit with the world that is checked post-hoc.

  #### Where the Analogy Breaks Down (The Fatal Flaws)

  **1. The Access Condition (Internalism)**
  *   **Analytic Internalism:** Requires the agent to have cognitive access to the *justifiers* (reasons/evidence).
  *   **Mimamsa:** Does **not** require access to justifiers. It requires *no* access. Validity is automatic. This is actually closer to a form of **Externalism** (specifically, a proper functionalist view where the system is designed to produce true beliefs by default).
  *   **Nyaya:** Requires *anuvyavasaya* (reflective awareness). This is a demand for **Internal Access** to the validity status. To know $P$, I must know that I know $P$. This is a highly Internalist requirement regarding *certification*, even if the ground of validity is external causal success.

  **2. The Reliability Condition (Externalism)**
  *   **Analytic Externalism (Reliabilism):** A belief is justified if produced by a reliable process, regardless of whether the agent knows the process is reliable.
  *   **Nyaya:** A cognition is not *known* to be valid unless the agent performs the check (*samvada*) or engages in the reflective act. Mere causal reliability is insufficient for *prama* (knowledge) without the reflective certification.
  *   **Mimamsa:** Validity is intrinsic to the causal origin. If the causes are defect-free, it is valid. This is actually closer to **Process Reliabilism** (validity depends on the absence of causal defects), despite being labeled "intrinsic."

  **3. The Ontological vs. Epistemic Confusion**
  *   **Svatah/Paratah** is primarily about the **causal origin of the property 'validity'**. (Is the property 'validity' caused by the same factors as the cognition, or different ones?)
  *   **Internalism/Externalism** is about the **nature of justification**. (Must the justifier be internal to the mind?)
  *   **The Mismatch:** Mimamsa says the *property* originates internally (from the cognition's own nature). Nyaya says the *property* originates externally (from the object-relation). But regarding *access*, Nyaya demands more internal reflection than Mimamsa.

  ### 4. Scholarly Controversies & Flags for Your Paper

  If you are writing this up, you must flag these contested points to show philological rigor:

  1.  **Translation of *Pramanya*:**
      *   **Contest:** Does *pramanya* mean "Truth," "Warrant," "Validity," or "Knowledgehood"?
      *   **Implication:** If *pramanya* = Truth, Mimamsa is claiming cognitions are self-evidently true (hard to defend). If *pramanya* = Warrant/Justification, the claim is that cognitions are presumptively justified. Most contemporary scholars (e.g., Arindam Chakrabarti, Stephen Phillips) lean toward "Knowledgehood" or "Warrant."
      *   **Recommendation:** Use "Validity" but specify it entails both truth (*yatharthatva*) and operational efficacy.

  2.  **Prabhakara vs. Kumarila:**
      *   **Contest:** Prabhakara argues for *triputi-pratyaksa* (three-in-one perception): when I see a pot, I perceive (1) the pot, (2) the cognition, and (3) the validity of the cognition simultaneously. Kumarila argues validity is inferred or intrinsic but not necessarily a separate perceived object.
      *   **Implication:** Prabhakara is more radically "Internalist" (in the phenomenological sense) than Kumarila. Nyaya attacks both, but the Kumarila view is the standard *svatah* target.

  3.  **The Status of *Anuvyavasaya*:**
      *   **Contest:** Is the second-order cognition necessary for the *existence* of knowledge or just the *awareness* of knowledge?
      *   **Standard Nyaya:** A first-order cognition can be *prama* (valid knowledge) without the second-order cognition, but the agent cannot *claim* knowledge or act with certainty without it.
      *   **Implication:** This makes Nyaya a hybrid. Ontologically Externalist (validity depends on object-fit), Epistemologically Internalist (certification requires reflection).

  4.  **The "Success" Criterion:**
      *   **Contest:** Does *pravrtti-samarthya* define truth or merely reveal it?
      *   **Risk:** If success defines truth, Nyaya becomes Pragmatist.
      *   **Consensus:** Most scholars (e.g., B.K. Matilal) argue Nyaya is a Correspondence theorist who uses pragmatic success as the *test* for correspondence, not the *definition*.

  ### 5. Suggested Framing for Your Paper

  Do not write: "Mimamsa is Internalist and Nyaya is Externalist."
  Instead, write something like:

  > "While the *svatah-/paratah-pramanya* debate is often mapped onto the Analytic internalism/externalism distinction, this isomorphism is misleading. The Mimamsa claim that validity is intrinsic (*svatah*) is not a claim about access to justifying reasons (Internalism), but rather a claim about the default causal status of cognition (akin to Phenomenal Conservatism). Conversely, the Nyaya demand for extrinsic validation (*paratah*) relies on *anuvyavasaya* (reflective awareness), imposing an internal access requirement that strict Reliabilism rejects. Thus, the debate is better understood as a conflict between **Defaultism** (Mimamsa) and **Verificationism** (Nyaya) regarding the epistemic certification of cognitive episodes, rather than a dispute over the locus of justification."

  ### Key Sources to Cite
  *   **B.K. Matilal:** *Epistemology, Logic, and Grammar in Indian Philosophical Analysis* (Classic, but check dates).
  *   **Arindam Chakrabarti:** *Classical Indian Philosophy of Mind* (Excellent on *anuvyavasaya*).
  *   **Stephen Phillips:** *Classical Indian Metaphysics* or his SEP entries (Very precise on Nyaya mechanics).
  *   **Jonardon Ganeri:** *The Lost Age of Reason* (Contextualizes the shift in epistemic norms).
  *   **Kumarila Bhatta:** *Slokavarttika* (Pramanyavada section) - via translation (e.g., Taber).
  *   **Gangesa:** *Tattvacintamani* (Pramanya-laksana section).

  This approach respects the complexity of the source material while leveraging your analytic background to show where the comparative categories fail. It turns a potential confusion into a philosophical contribution.
