      *   **The Claim to Argue For:** The normative work in accuracy-dominance arguments migrates from the dominance theorem itself to the selection of *strictly proper scoring rules*. Since "strict propriety" is defined via *expectation* (a decision-theoretic concept), the argument relies on pragmatic/decision-theoretic assumptions, undermining its claim to be purely alethic/objective.
      *   **Task:**
          1.  Argue rigorously for the claim above.
          2.  State the strongest reply available to an accuracy-first epistemologist (e.g., immodesty/self-recommendation as purely alethic).
          3.  Explain why that reply does not succeed (supporting the user's skepticism).

  2.  **Deconstruct the Core Argument (The "Migration" Claim):**
      *   *Premise 1:* The Accuracy-Dominance Theorem (Predd et al.) shows that if a credence function is probabilistically incoherent, there exists a coherent one that is more accurate (lower score) at *every* world.
      *   *Premise 2:* This theorem holds *only* for the class of *strictly proper scoring rules*.
      *   *Premise 3:* Strict propriety is defined as: $S(c, c) < S(c', c)$ for all $c' \neq c$. That is, $c$ minimizes its own *expected* inaccuracy.
      *   *Premise 4:* Expectation involves weighting outcomes by probabilities (credences). This is the core machinery of decision theory (maximizing expected utility/minimizing expected loss).
      *   *Conclusion:* Therefore, the restriction to proper rules smuggles in decision-theoretic norms. The "objectivity" of the pointwise dominance is purchased at the price of a decision-theoretic constraint on the measure of accuracy.

  3.  **Develop the Strongest Reply (The Accuracy-First Defense):**
      *   *Goal:* Defend strict propriety as purely alethic (truth-directed), not pragmatic.
      *   *Key Concept:* *Immodesty* or *Self-Recommendation*.
      *   *Argument:* A measure of accuracy should reflect the epistemic goal of believing the truth. If a credence function $c$ thinks another function $c'$ is more accurate (according to the scoring rule), $c$ is epistemically unstable. It recommends abandoning itself.
      *   *Alethic Justification:* To be a measure of *epistemic* utility, the measure must align with the agent's own view of the truth. If $c$ assigns high probability to $w$, and the scoring rule says being confident in $w$ is "inaccurate" when $w$ is true, the rule is flawed. Properness ensures that the measure of accuracy respects the internal perspective of the credence function regarding where the truth lies. It's not about betting; it's about coherence between one's view of the world and one's view of what counts as success in representing the world.
      *   *Reference:* Joyce (2009), Pettigrew (2016). The idea is that epistemic rationality requires immodesty.

  4.  **Develop the Counter-Reply (Why the Defense Fails):**
      *   *Goal:* Show that "Immodesty" still relies on decision-theoretic structure.
      *   *Point 1: The Definition of Expectation.* Even if we call it "epistemic expectation," the mathematical structure is identical to expected utility. Minimizing expected inaccuracy is isomorphic to maximizing expected utility. You can't separate the formal structure from its decision-theoretic heritage.
      *   *Point 2: The Normative Force.* Why *should* an epistemic agent care about minimizing *expected* inaccuracy from their own perspective?
          *   If the goal is *actual* accuracy (truth), why care about the *expectation*?
          *   Example: A rule could be "improper" but still track truth well in the actual world. The ban on improper rules says: "You aren't allowed to use a measure of accuracy that tells you to change your mind." But why is "changing your mind" a pragmatic vice rather than an alethic opportunity?
          *   If $c$ recommends $c'$, maybe $c$ is wrong about where the truth is, and the scoring rule reveals that. Banning this assumes the agent's current credences are the authority on what counts as accuracy. That privileges the *subjective* state over the *objective* relation to truth.
      *   *Point 3: Circularity.* To justify Probabilism (norm), we use Accuracy-Dominance. To justify the Scoring Rule (measure), we use Propriety. Propriety is defined by Expectation. Expectation assumes Probabilism (you need probabilities to take an expectation). So we assume Probabilism to justify Probabilism.
          *   *Refinement:* Predd et al. don't assume $c$ is probabilistic to define propriety, but the *concept* of expectation weights worlds. If $c$ is incoherent, the "expectation" is ill-defined or Dutch-bookable. But more deeply, the *norm* "minimize expected inaccuracy" is a decision rule.
      *   *Point 4: The Physicist's Intuition.* In physics, we want a metric that corresponds to physical reality (e.g., mean squared error). We don't choose the metric based on whether the system "expects" to minimize it. We choose it based on the nature of the error. In epistemology, choosing the metric based on the agent's self-assessment makes accuracy agent-relative, not world-relative.

