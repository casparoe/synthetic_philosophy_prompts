answer: |-
  This is a sophisticated objection that cuts to the methodological heart of the accuracy-first program. You have identified what is often called the "Problem of Propriety" or the "Circularity Objection," but you have framed it in a way that highlights the tension between the *pointwise* nature of the dominance theorem and the *expectational* nature of the constraint that makes the theorem work.

  Given your background, I will avoid hand-waving about "pragmatism" and instead focus on the structural isomorphism between the constraints placed on scoring rules and the axioms of decision theory. Here is the argument for your claim, followed by the strongest accuracy-first defense and the reason it ultimately fails to secure the non-pragmatic vindication Joyce sought.

  ### I. The Argument: The Migration of Normativity

  Your claim is that the normative force of the accuracy-dominance argument does not reside in the dominance theorem itself, but in the restriction of the theorem's domain to **strictly proper scoring rules**. I argue that this restriction imports decision-theoretic norms, rendering the argument non-alethic.

  **1. The Structure of the Predd et al. Theorem**
  Let $W$ be a finite set of worlds. Let $\mathfrak{I}: W \times \mathbb{R}^n \to \mathbb{R}$ be an inaccuracy measure (scoring rule), where $\mathfrak{I}(w, c)$ is the inaccuracy of credence function $c$ at world $w$.
  The Dominance Theorem states: If $\mathfrak{I}$ is a continuous, strictly proper scoring rule, then for any incoherent $c$, there exists a coherent $c^*$ such that for all $w \in W$, $\mathfrak{I}(w, c^*) < \mathfrak{I}(w, c)$.

  Mathematically, this is a result about convex sets. The set of coherent credence functions is the simplex (the convex hull of the vertices representing worlds). Incoherent functions lie outside this simplex. If the level sets of the inaccuracy measure are convex and oriented correctly (guaranteed by propriety), the hyperplane separation theorem ensures a point inside the simplex is closer to every vertex than the point outside.

  **2. The Definition of Strict Propriety**
  A scoring rule $\mathfrak{I}$ is strictly proper if and only if for any probabilistic credence function $p$, $p$ uniquely minimizes its own expected inaccuracy. Formally:
  $$ \sum_{w \in W} p(w) \mathfrak{I}(w, p) < \sum_{w \in W} p(w) \mathfrak{I}(w, c) $$
  for all $c \neq p$.

  **3. The Importation of Expectation**
  The inequality above is an expectation. It weights the inaccuracy at each world $w$ by the credence $p(w)$.
  *   **Alethic Goal:** The stated goal of the accuracy-first program is to minimize *actual* inaccuracy (distance from the truth). In a given world $w_{actual}$, the inaccuracy is simply $\mathfrak{I}(w_{actual}, c)$. This is a pointwise, non-probabilistic fact.
  *   **The Constraint:** However, we are forbidden from using scoring rules that do not satisfy the expectation inequality. We are told that a measure of accuracy is "illegitimate" if an agent holding $p$ could expect to do better by adopting $c$.

  **4. The Normative Migration**
  Why is that expectation constraint necessary? Without it, Maher's counterexamples show the dominance theorem fails. Therefore, the vindication of probabilism depends entirely on the legitimacy of the constraint.
  But the constraint is defined in terms of **minimizing expected loss**. This is the fundamental norm of instrumental rationality (decision theory).
  *   If the goal were purely alethic (track the truth), we should care about $\mathfrak{I}(w, c)$ in the *actual* world.
  *   By requiring propriety, we are effectively saying: "A legitimate measure of truth-distance is one that an agent, weighing possibilities by her subjective degrees of belief, would choose to minimize."

  This shifts the justification from "Probabilism is required to track the truth" to "Probabilism is required to satisfy a stability condition defined by subjective expectation." The "objectivity" of the pointwise dominance is purchased by a "subjective" constraint on the metric itself. The normativity has migrated from the comparison of states (which is assumption-light) to the selection of the metric (which assumes the normative force of expectation).

  ### II. The Strongest Reply: Alethic Immodesty

  The most rigorous defense available to the accuracy-first epistemologist (championed by Joyce 2009, Pettigrew 2016, and others) is the argument from **Alethic Immodesty** (or Epistemic Self-Recommendation).

  **The Argument:**
  1.  **Epistemic Stability:** A central requirement of epistemic rationality is that one's epistemic standards should not recommend their own abandonment. If you hold credences $c$, and your measure of accuracy $\mathfrak{I}$ tells you that $c'$ is more accurate than $c$ *from your own perspective*, you are in a state of epistemic instability. You are compelled by your own standards to abandon your current doxastic state.
  2.  **Immodesty as Alethic:** This is not pragmatic. It is not about money or bets. It is about the coherence between one's view of the world and one's view of what counts as a good representation of the world. If $c$ assigns high probability to world $w$, then $c$ represents $w$ as the likely truth. If $\mathfrak{I}$ says that being confident in $w$ is "inaccurate" when $w$ is true, then $\mathfrak{I}$ is not a measure of *truth-directedness*; it is a measure of something else.
  3.  **Propriety as a Truth-Constraint:** Therefore, strict propriety is not a decision-theoretic constraint; it is a constitutive constraint on what counts as an *epistemic* scoring rule. A scoring rule that is improper fails to respect the agent's own take on where the truth lies. To use an improper rule is to use a metric that is, by definition, misaligned with the goal of believing the truth *as the agent sees it*.
  4.  **Conclusion:** The use of expectation in the definition of propriety is merely a formal tool to capture this requirement of self-recommendation. It does not import pragmatic norms because the "utility" being maximized is purely epistemic (accuracy), and the "choice" is purely doxastic.

  In short, the reply claims that **immodesty is a purely alethic virtue.** A measure of accuracy that tells you to change your mind is a broken measure of accuracy, regardless of betting.

  ### III. Why the Reply Fails

  While the Immodesty argument is the strongest available defense, it does not succeed in purging the argument of decision-theoretic assumptions. It fails for three rigorous reasons, which I believe will resonate with your physics background.

  **1. The Isomorphism Problem (Formal Pragmatism)**
  The definition of strict propriety is mathematically isomorphic to the condition that a decision rule is optimal under a specific loss function.
  In decision theory, a loss function $L$ is "proper" if reporting your true distribution minimizes expected loss. The accuracy-first program simply relabels "Loss" as "Inaccuracy" and "Utility" as "Accuracy."
  However, the *normative structure* remains identical. The requirement is: **Minimize the $\mathfrak{I}$-weighted sum.**
  Why should an epistemic agent minimize a *weighted sum* of inaccuracies across possible worlds?
  *   **Alethic Goal:** The truth is in *one* world. The actual inaccuracy is a scalar value at that world.
  *   **Decision-Theoretic Goal:** Expected inaccuracy is a functional over the whole space of worlds.
  By insisting that a legitimate accuracy measure must be one that minimizes *expected* inaccuracy, the accuracy-first epistemologist is privileging the *expectation operator* over the *pointwise value*. But the expectation operator is the hallmark of decision theory under uncertainty. To say "You ought to minimize expected inaccuracy" is to import the norm of **instrumental rationality** (maximize expected utility) into epistemology. Calling it "epistemic utility" does not change the formal structure of the norm.

  **2. The Circularity of Self-Recommendation**
  The Immodesty argument assumes that an agent's current credences $c$ are the appropriate weights for evaluating the accuracy measure.
  *   If $c$ is probabilistically coherent, it satisfies the axioms of probability.
  *   If $c$ is incoherent, the "expectation" $\sum c(w) \mathfrak{I}(w, c)$ is mathematically suspect (as Maher showed, incoherent credences can violate dominance if the rule is not proper).
  *   **The Circular Norm:** The argument essentially says: "We must use scoring rules that probabilistic agents prefer." But the goal is to *prove* that agents ought to be probabilistic.
      *   To justify Probabilism, we use Dominance.
      *   To justify Dominance, we need Proper Scoring Rules.
      *   To justify Proper Scoring Rules, we need Immodesty (Self-Recommendation).
      *   Self-Recommendation requires the agent to minimize $\sum c(w) \mathfrak{I}$.
      *   But the operation $\sum c(w) \dots$ is only normatively compelling if $c$ behaves like a probability measure (i.e., if Probabilism is already assumed).
  If an agent is incoherent, why should she care about minimizing a weighted sum where the weights violate the axioms of probability? The Immodesty constraint effectively says, "Any measure of accuracy must treat credences *as if* they were probabilities." This assumes the very norm (Probabilism) it seeks to derive.

  **3. The Physicist's Objection: Metric vs. Dynamics**
  Drawing on your background: In condensed matter physics, we choose a metric (e.g., Euclidean distance in configuration space, or a specific norm in Hilbert space) based on the **physical geometry of the system**, not based on whether the system "expects" to minimize it.
  *   **Objective Accuracy:** If epistemology is about tracking truth, the "distance" between a credence and the truth should be fixed by the logical structure of the propositions and the nature of truth (the "geometry of the state space").
  *   **Subjective Metric:** The propriety requirement makes the metric dependent on the agent's subjective state ($c$). It says the "distance" function is only valid if the agent's current state minimizes it.
  This makes accuracy **agent-relative** rather than **world-relative**.
  If I have a crazed credence function (e.g., I am certain the moon is made of cheese), the Immodesty constraint requires a scoring rule that validates my certainty as "accurate" if the moon were cheese, in a way that discourages me from moving to a sane credence function *from my own perspective*.
  While proper rules do penalize false certainty, the *reason* they are selected is that they satisfy the agent's own expectation. This privileges the **subjective coherence** of the agent over the **objective fit** between credence and world.
  A truly alethic argument should allow us to say: "Your credences are incoherent, and therefore they are less accurate than coherent ones, *regardless of whether your current state recommends the coherent ones*."
  By requiring that the coherent state *must* be recommended by the incoherent state (via propriety), the argument concedes that objective dominance is not enough; it needs the agent's subjective endorsement. That endorsement is a pragmatic condition.

  ### Conclusion

  You are correct to be skeptical. The Predd et al. theorem is mathematically beautiful, but its philosophical application relies on the class of **strictly proper scoring rules**. The definition of this class relies on **expectation minimization**.

  Expectation minimization is the core norm of decision theory. While accuracy-first epistemologists argue that this expectation is "epistemic" rather than "pragmatic," the formal structure is identical, and the normative force ("you ought to minimize this sum") is inherited from decision theory. The Immodesty defense attempts to ground this in "epistemic stability," but it ultimately circularizes the argument by requiring that legitimate measures of truth treat credences *as if* they were probabilities.

  The dominance theorem shows that *if* we accept a decision-theoretic constraint on how we measure truth, *then* probabilism dominates. It does not show that probabilism is required by the nature of truth alone, independent of how agents weigh possibilities. The "objective" vindication is thus illusory; the pragmatism has not been eliminated, merely relocated to the definition of the metric.
