answer: |-
  The seminar room is quiet, save for the hum of the projector cooling down and the squeak of Elena's marker against the whiteboard. Most of the grad students have cleared out, leaving behind a scatter of notebooks and half-empty coffee cups. Elena is circling the antecedent of the Adams Pair. Marcus is leaning against the doorframe, loosening his tie.

  **Elena:** It's the mood, Marcus. It has to be. Look at it again. "If Oswald didn't kill Kennedy, someone else did." Indicative. We accept it. We assign it a high probability. "If Oswald hadn't killed Kennedy, someone else would have." Subjunctive. We reject it. We assign it near zero. Same antecedent, same consequent, different truth values. If you want a unified semantics, you have to explain how the *same* logical operator yields opposite verdicts on the same inputs.

  **Marcus:** I don't think the inputs are the same. That's the Stalnaker move, and I think it's the right one. The semantic value of the conditional operator is constant—it's a selection function $f(w, A)$ picking out the closest $A$-world to $w$. But the *context* changes the accessibility relation.

  **Elena:** Accessibility?

  **Marcus:** Exactly. For the indicative, the domain of quantification is restricted to epistemically live worlds—worlds compatible with what we know. Since we know Kennedy was killed, every epistemically live world is a world where Kennedy was killed. So in the closest world where Oswald didn't do it, someone else *had* to. For the counterfactual, we step outside the epistemic sphere. We look at metaphysically similar worlds where the actual fact of the killing is held open. In those worlds, there was no conspiracy. So the consequent fails. The operator is the same; the domain shifts.

  **Elena:** It's elegant, I'll give you that. But it's too smooth. You're glossing over the cost. If you treat the indicative as having truth conditions—true in some worlds, false in others—you run straight into Lewis's triviality results.

  **Marcus:** *[Walks to the board]* Lewis's result assumes the probability of the conditional is the conditional probability. Adams' Thesis. $P(A \to C) = P(C|A)$.

  **Elena:** And it holds. Intuitively, it holds. How likely is it that if Oswald didn't do it, someone else did? Just as likely as someone else did given Oswald didn't. But if the conditional expresses a proposition with truth conditions, and Adams' Thesis holds, then probability theory collapses. You can't have a proposition whose probability is always equal to the conditional probability of its parts unless the logic is trivial. So, the indicative *cannot* express a proposition. It doesn't have truth conditions. It has assertability conditions.

  **Marcus:** So you're willing to sacrifice compositionality to save Adams' Thesis?

  **Elena:** I'm sacrificing a myth. The myth that every meaningful sentence must be a truth-bearer.

  **Marcus:** Okay, but now look at the wreckage. If indicatives aren't propositions, what happens when I embed them? "If it is not the case that if Oswald didn't kill Kennedy, someone else did, then the Warren Commission lied."

  **Elena:** A McGee case.

  **Marcus:** No, just standard negation. "It's not the case that if A, then B." If "If A, then B" doesn't have a truth value, what are you negating? You can't negate a speech act. You can't negate an assertability condition. Yet, we reason with these embeddings constantly. We put them in disjunctions, in the scope of modals. Your view makes the logic of natural language look like a patchwork of non-compositional fragments.

  **Elena:** *[Puts down the marker]* That's the standard objection. But Edgington has a response. We treat the embeddings pragmatically or we develop a logic of assertability that mimics truth-conditional logic without the ontological commitment. But let's turn the screw on *your* view. You want unity. You want one operator. But the logical behavior differs. Antecedent Strengthening holds for indicatives but fails for counterfactuals.

  **Marcus:** Because of the domain shift I mentioned.

  **Elena:** But if it's the *same* operator, why does the logic shift? If the semantics is unified, the validity of inference patterns should be stable. You're essentially saying the logic is context-sensitive. That's fine, but it starts to look like you have two different operators after all, just wearing the same suit.

  **Marcus:** Not two operators. One operator sensitive to two different parameters. Look, Elena, your expressivist view saves the probability intuition, but it kills the logic. My view saves the logic, but I have to explain away the triviality results. I can do that.

  **Elena:** How?

  **Marcus:** Context dependence of the probability function. When we evaluate $P(A \to C)$, the context shifts to one where $A$ is taken as given. Lewis assumes a fixed probability function. But if the probability function itself shifts with the context of evaluation, triviality doesn't follow. I can keep truth conditions *and* keep Adams' Thesis as a pragmatic rule of thumb.

  **Elena:** That's a lot of machinery to save the idea that "if" names a function from worlds to truth values. And you still haven't explained why the *feeling* of the inference is so different. When I assess the indicative, I'm updating my beliefs. When I assess the counterfactual, I'm imagining a different reality.

  **Marcus:** Because belief update and metaphysical similarity often align, but not always. That's the Oswald case.

  **Elena:** But here's the punch you haven't absorbed. The embedding problem cuts both ways. You say your semantics handles embedding. Fine. But consider conditionals with conditional consequents. "If the match is struck, then if it's wet, it won't light."

  **Marcus:** Import-Export. $A \to (B \to C)$ is equivalent to $(A \land B) \to C$.

  **Elena:** Right. On your possible-worlds view, Import-Export is valid. But for counterfactuals, it's notoriously problematic. If I say, "If Hitler had decided to invade in 1941, then if he had had atomic bombs, he would have won," that feels different than "If Hitler had decided to invade in 1941 and had atomic bombs, he would have won." The nesting of counterfactuals creates a drift in the similarity metric.

  **Marcus:** I grant that counterfactuals are tricky with Import-Export. But indicatives are stable.

  **Elena:** Are they? If I deny truth conditions for indicatives, I can explain why Import-Export feels right for them—it's a rule of probabilistic coherence. But if you insist they are truth-conditional, you have to explain why the logic of the indicative conditional matches the logic of probability, while the logic of the counterfactual matches the logic of similarity. Why should one word, "if," toggle between probability calculus and similarity geometry?

  **Marcus:** Because language is efficient. We use one tool for two jobs because the jobs are related. Both involve hypothetical reasoning.

  **Elena:** But if the underlying semantics are different—one propositional, one not—then "unified semantics" is just a label. You're a unifier in name only.

  **Marcus:** And you're a fragmentalist. You're telling me that half our conditional reasoning is propositional and half is not. That's a bigger fracture than mine. At least on my view, the mind is doing the same thing: selecting a world. Sometimes it selects from the "what we know" pile, sometimes from the "what could have been" pile.

  **Elena:** But the "what we know" pile isn't a set of worlds where the sentence is true. It's a state of mind. That's the crux. When I say "If Oswald didn't do it...", I'm not describing a world. I'm inviting you to add 'Oswald didn't do it' to your stock of knowledge and see what follows. That's the Ramsey Test. It's procedural.

  **Marcus:** And Stalnaker says the procedural test *tracks* the truth conditions. The fact that we use the Ramsey Test to evaluate doesn't mean there aren't truth conditions. I use a ruler to measure length; that doesn't mean length *is* the ruler.

  **Elena:** *[Smiles]* Nice. But Lewis showed that if the length exists (truth conditions) and the ruler works perfectly (Adams' Thesis), the object being measured vanishes.

  **Marcus:** Only if the probability function is rigid. I'm telling you, it's not.

  **Elena:** Then your truth conditions are ephemeral. They shift with every assessment. If truth conditions are that unstable, do they deserve the name?

  **Marcus:** If they allow us to embed, negate, and quantify, then yes. Without them, you can't explain why "If A then B" contradicts "A and not B". On your view, "If A then B" isn't true or false. So how can it contradict a proposition that *is* true or false?

  **Elena:** Incompatibility of commitment. If I commit to "If A, B", I cannot coherently commit to "A and not B". It's a pragmatic contradiction, not a semantic one.

  **Marcus:** *[Sighs, picks up an eraser]* You're making logic into psychology.

  **Elena:** And you're making psychology into logic.

  **Marcus:** *[Starts erasing the Oswald sentence]* Here's where we stand. I can handle the embedding, but I have to complicate the probability story to avoid triviality. You handle the probability perfectly, but you have to complicate the logic to handle embedding.

  **Elena:** And neither of us can explain why the subjunctive mood feels like it reaches into reality while the indicative stays in the head, without basically stipulating it.

  **Marcus:** I stipulate a domain restriction. You stipulate a lack of truth conditions.

  **Elena:** *[Grabs her bag]* My stipulation explains why we don't bet on indicatives the same way we bet on facts.

  **Marcus:** My stipulation explains why we can validly infer from them.

  **Marcus:** *[Pauses]* See you next week?

  **Elena:** Same time. Bring a better answer for Import-Export.

  **Marcus:** Bring a better answer for negation.

  *Elena turns off the lights. The whiteboard is blank again, except for a faint smudge where "Oswald" used to be.*
