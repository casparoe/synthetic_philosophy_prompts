      *   **Purposivism/Intent:** Looking at the goal behind the rule (Teresa).
      *   **Substance Over Form:** A legal doctrine where the economic reality matters more than the label (Teresa).
      *   **Rule of Lenity (sort of):** Ambiguities in restrictions (especially HOA covenants) are often construed against the enforcer/restrictor (Mike hints at this).
