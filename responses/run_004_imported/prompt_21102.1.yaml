  6.  **Refining the Explanation (Self-Correction during drafting):**
      *   *Correction:* Be careful with "Equalized Odds." It means TPR and FPR are equal.
      *   *Correction:* Calibration means $P(Y=1 | S=s) = s$.
      *   *The Crux:* If TPR and FPR are equal across groups, the Likelihood Ratio ($TPR/FPR$) is equal. By Bayes, Posterior Odds = Likelihood Ratio $\times$ Prior Odds. If Priors differ and LR is same, Posteriors differ. If Posteriors differ, the Score (which equals Posterior under calibration) must differ for the same threshold. But if the Score is the *same* mechanism, how can it differ?
      *   *Wait, the theorem says you can't have a score that satisfies both.*
      *   *Explanation:* If I force the score to be Calibrated, the scores for Group A (high base rate) will be systematically higher than Group B (low base rate) for equivalent individuals. If I then try to set a threshold to get Equalized Odds, I can't, because the distributions are shifted. If I force Equalized Odds (same TPR/FPR), the PPV will differ, violating Calibration (which demands Score = PPV).
      *   *Physics Analogy:* Imagine two detectors looking for the same particle, but one has higher background noise (different base rate).
          *   Calibration: "When I say 90% confidence, 90% are real particles."
          *   Equalized Error: "I miss 10% of real particles and flag 10% of noise in both detectors."
          *   If Detector A has 50% noise and Detector B has 90% noise.
          *   If both flag 10% of noise (FPR equal) and catch 90% of particles (TPR equal).
          *   Detector A's "flagged" bucket is much purer than Detector B's "flagged" bucket.
          *   So Detector A can claim "90% confidence" on its flags. Detector B cannot.
