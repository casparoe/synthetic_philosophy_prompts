  1.  **Analyze the User's Request:**
      *   **Context:** The user is familiar with rationalist circles and Gödel's Ontological Proof. They are writing an essay about Gödel's *other* arguments for personal survival (afterlife), specifically one from a letter to his mother and one derived from his 1949 rotating universe work.
