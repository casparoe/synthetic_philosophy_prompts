  **MEMORANDUM**

  **TO:** Robotics Club President, Photography Club President, Inter-Club Council
  **FROM:** [Your Name], Inter-Club Council Member
  **DATE:** October 26, 2023
  **SUBJECT:** Resolution Proposal for Joint Car Wash Revenue Dispute

  **Purpose**
  This memo outlines the Inter-Club Council's (ICC) recommended resolution for the dispute regarding the $1,800 revenue generated by the joint Robotics and Photography Club car wash. Our goal is to finalize a split that is mathematically fair, acknowledges the contributions of both clubs, and allows us to release the funds before the end of the month.

  **The Recommendation**
  After reviewing the data provided by both clubs and consulting with independent advisors on fair division protocols, the ICC recommends the following split:

  *   **Robotics Club:** $1,115
  *   **Photography Club:** $685

  **The Reasoning: Why This Number?**
  We understand that neither club is getting exactly what they asked for. Robotics requested $1,300; Photography requested $1,000. However, a fair deal isn't about who asks for more; it's about how much *better off* you are compared to working alone.

  We used a method called the **Kalai-Smorodinsky solution**. Without getting into complex economics, here is the logic in plain English:

  1.  **Establish the Baseline:** If you hadn't worked together, Robotics would have made $700 and Photography would have made $500. Any fair deal must give you *more* than that.
  2.  **Acknowledge Capacity:** We recognize that the clubs have different maximum capacities. Robotics indicated a best-case potential of $1,600, while Photography indicated a hard ceiling of $900 due to member limits.
  3.  **Equalize the "Win":** This solution ensures that both clubs achieve the **same percentage of their possible improvement.**
      *   **Robotics:** You are guaranteed $700 baseline. Your maximum potential improvement is $900 ($1,600 - $700). Under this deal, you gain **$415** over your baseline. This achieves **46%** of your maximum possible gain.
      *   **Photography:** You are guaranteed $500 baseline. Your maximum potential improvement is $400 ($900 - $500). Under this deal, you gain **$185** over your baseline. This also achieves **46%** of your maximum possible gain.

  This method is fair because it treats both clubs equally relative to what you are *capable* of achieving. It rewards Robotics for higher capacity without leaving Photography with less than they would make on their own.

  **Addressing Concerns**
  We anticipate that the Photography Club may feel this amount is low compared to your $1,000 request. We want to take that feeling seriously. It is frustrating to see a partner walk away with more money.

  However, please consider the alternative. If no agreement is reached, the default outcome is that the collaboration fails. In that scenario, the ICC cannot justify releasing joint funds, and you revert to your solo baseline of $500. Accepting this deal secures an immediate **37% increase** ($185) over what you could have earned alone, with zero extra risk.

  For Robotics, while this is less than your $1,300 request, it secures a **59% increase** ($415) over your solo baseline and validates your higher capacity contribution in the official record.

  **Next Steps & Consequences**
  We need this resolved to close the books for the semester.

  1.  **Acceptance:** Both Club Presidents must sign off on this $1,115/$685 split by **5:00 PM next Wednesday**.
  2.  **Enforcement:** If an agreement is not reached by this deadline, the ICC will vote to **enforce this split as binding.** The funds will be distributed according to this memo, and the dispute will be considered closed.
  3.  **Future Collaboration:** Please note that refusal to accept an ICC-mediated fair division solution may impact future approval for joint fundraising events or shared equipment requests for both clubs.

  We appreciate the hard work both clubs put into the car wash. This solution ensures you both profit from the cooperation without penalizing either side's potential.

  Thank you for your cooperation.

  [Your Signature]

  **Inter-Club Council**
