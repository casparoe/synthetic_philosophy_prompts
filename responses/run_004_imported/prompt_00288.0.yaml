prompt: |-
  I've been preparing a seminar on formal decision theory, and one worry about updateless decision theory (UDT) keeps nagging at me, though I suspect I may be misconstruing the proposal. As I understand it, following Wei Dai's original suggestion, an updateless agent fixes its policy once and for all "before" it has any information, precisely so as to avoid the kind of updating that gets ordinary Bayesian agents into trouble in cases like Newcomb's problem or counterfactual mugging. But this seems to imply that such an agent should perform systematically worse than an ordinary Bayesian reasoner in perfectly mundane sequential problems, since it can never let subsequent evidence change what it does. Take the Monty Hall problem: wouldn't an updateless agent simply stick to whatever door-choosing policy it started with and refuse to switch after the host reveals a goat, on the grounds that switching would require updating on new information? If that's right, I'm struggling to see why decision theorists treat UDT as a genuine advance over causal or evidential decision theory, rather than as a proposal that cures one disease by inducing a much more obviously fatal one. I'd be grateful for help seeing where this line of reasoning goes wrong, since I assume it must, given how seriously UDT is taken in the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Concern:**
      *   **Topic:** Updateless Decision Theory (UDT).
      *   **Core Worry:** The user believes UDT agents fix their policy *before* receiving *any* information and never update.
      *   **Specific Example:** Monty Hall. The user thinks a UDT agent would refuse to switch doors because switching requires updating on the host's revelation.
      *   **Conclusion:** The user thinks UDT performs worse than standard Bayesian reasoning in mundane sequential problems, making it inferior to CDT/EDT.
      *   **Goal:** Explain where this reasoning goes wrong and clarify how UDT actually handles information and sequential problems like Monty Hall.

  2.  **Deconstruct the Misconception:**
      *   *Misconception:* "Updateless" means "never uses information."
      *   *Reality:* "Updateless" means "doesn't update the *policy* selection criterion based on information," but the *policy itself* is a function of information.
      *   *Key Distinction:* Updating beliefs vs. Updating the decision algorithm. UDT optimizes the algorithm *ex ante*, but the algorithm takes observations as input.

  3.  **Formulate the Explanation:**

      *   **Acknowledge and Validate:** Start by acknowledging that this is a very common and understandable confusion. The term "updateless" is slightly misleading if taken literally.
      *   **Define UDT's Core Mechanism:**
          *   Standard agents (CDT/EDT): Choose action $A$ to maximize utility given current beliefs $P(World | Observation)$.
          *   UDT agents: Choose a *policy* $\pi$ (a function from Observations to Actions) to maximize utility given *prior* beliefs $P(World)$.
          *   Crucial Point: The policy $\pi$ *includes* conditional instructions like "If I see a goat behind Door 3, switch to Door 2."
      *   **Address the Monty Hall Example:**
          *   How does a UDT agent approach Monty Hall?
          *   *Ex ante* (before the game starts), the agent considers all possible policies.
          *   Policy A: "Always stick."
          *   Policy B: "Always switch."
          *   Policy C: "If host opens Door 3, switch; if Door 2, stick..."
          *   The agent calculates the expected utility of these policies based on the *prior* probability of where the car is and how the host behaves.
          *   Policy B (Always Switch) has higher EV (2/3 win rate) than Policy A (1/3 win rate).
          *   So, the UDT agent commits to Policy B.
          *   When the host opens a door, the agent doesn't "update and decide." It simply *executes* the pre-committed policy: "Oh, I saw a goat. My policy says switch. I switch."
          *   *Result:* UDT gets the right answer in Monty Hall.
      *   **Address the "Information" Aspect:**
          *   UDT agents *do* condition on information. They just don't condition the *choice of the policy* on the information. They condition the *execution of the policy* on the information.
          *   Analogy: Writing a computer program before running it vs. editing the code while it runs. UDT writes the best code beforehand. The code still has `if/else` statements based on inputs.
      *   **Why "Updateless"? (The Real Motivation):**
          *   It's not about ignoring info. It's about avoiding *time inconsistency* and *information hazards*.
          *   Examples where updating hurts: Counterfactual Mugging, Newcomb's Problem, Parfit's Hitchhiker.
          *   In Counterfactual Mugging: If you update on "the coin came up tails," you won't pay. But if you committed *ex ante* to paying, you would have been richer in the expectation. UDT captures the *ex ante* optimality.
      *   **Comparison to CDT/EDT:**
          *   CDT/EDT are "updateful." They choose the best action *now* given what they know *now*.
          *   UDT chooses the best strategy *from the beginning* given what they *might* know.
          *   In standard problems (Monty Hall), *ex ante* optimal strategies align with *ex post* optimal actions. So UDT matches Bayesian reasoning.
          *   In logical correlation problems (Newcomb), *ex ante* optimal strategies diverge from *ex post* greedy actions. UDT wins here.
      *   **Refine the Terminology:**
          *   Distinguish between "updating beliefs" (Bayesian updating) and "updating the decision rule."
          *   UDT agents usually have the same beliefs as Bayesians (they can compute posteriors), but they don't let those posteriors dictate the *selection* of the decision rule.

  4.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, academic but accessible, clarifying.
      *   *Structure:*
          1.  Direct answer: The reasoning is based on a category error regarding what "updateless" means.
          2.  Technical clarification: Policy as a function of observations.
          3.  Monty Hall walkthrough: Show explicitly how UDT wins.
          4.  The "Why": Explain the actual benefit (time consistency, acausal trade).
          5.  Summary/Conclusion.

      *   *Self-Correction during drafting:* Make sure not to get too bogged down in logical induction or specific UDT variants (like 1-UDT vs. 2-UDT). Keep it conceptual. Ensure the distinction between "optimizing the policy" and "executing the policy" is crystal clear. Emphasize that the policy *maps* observations to actions.

  5.  **Final Review against User Query:**
      *   Did I address the Monty Hall worry? Yes.
      *   Did I explain why it's considered an advance? Yes (Newcomb/Counterfactual Mugging).
      *   Did I correct the misconception about ignoring information? Yes.

  6.  **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is an excellent and very common objection to Updateless Decision Theory (UDT). In fact, if your interpretation were correct, UDT would indeed be absurd. A decision theory that ignores evidence in mundane cases like Monty Hall would be dead on arrival.

  The good news is that your worry rests on a specific misunderstanding of what "updateless" means in this context. UDT agents **do** use information; they just use it differently than standard Bayesian agents.

  Here is the breakdown of where the reasoning goes wrong, how UDT actually handles Monty Hall, and why it is still considered an advance over Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).

  ### 1. The Core Misconception: Policy vs. Action

  The confusion stems from conflating **choosing an action** with **choosing a policy**.

  *   **Standard Agents (CDT/EDT):** At the moment of decision, the agent looks at its current information (posteriors), calculates the expected utility of each available *action*, and picks the best one. It updates its beliefs, then acts.
  *   **UDT Agents:** Before receiving any specific information (at the "prior" stage), the agent calculates the expected utility of every possible **policy**. A policy is a function that maps *possible observations* to *actions*. The agent commits to the best policy. When it later receives information, it does not re-evaluate the policy; it simply **executes** the instruction the policy contains for that specific observation.

  **The Crucial Distinction:**
  Being "updateless" does not mean the agent is blind to new information. It means the agent does not update the *criterion by which it selects its decision algorithm*. However, the decision algorithm itself is fully permitted to condition its outputs on inputs (observations).

  Think of it like writing a computer program before launching it into a hostile environment.
  *   **Updateful:** You edit the code of the program while it is running, based on what it sees.
  *   **Updateless:** You write the perfect code beforehand. That code contains many `if/then` statements (e.g., `if sensor_sees_goat == true: switch_door()`). Once launched, you don't edit the code, but the code still reacts to sensor data.

  ### 2. UDT and the Monty Hall Problem

  Let's apply this to your Monty Hall example.

  **The Setup:**
  1.  Car is behind Door 1, 2, or 3 (1/3 each).
  2.  Agent picks Door 1.
  3.  Host (who knows where the car is) opens Door 3 to reveal a goat.
  4.  Agent chooses to Stick or Switch.

  **How a UDT Agent Solves This:**
  The UDT agent does not wait until the host opens Door 3 to decide what to do. At the very beginning of the game (the "prior" stage), the agent considers all possible policies. Two simple candidate policies are:
  *   **Policy A (Stick):** "No matter which door the host opens, I will stick with my original choice."
  *   **Policy B (Switch):** "No matter which door the host opens, I will switch to the remaining unopened door."

  The agent calculates the expected utility of these policies based on the **prior** probabilities (before the host opens anything).
  *   **EV of Policy A:** 1/3 chance of winning.
  *   **EV of Policy B:** 2/3 chance of winning.

  Since Policy B has higher expected utility from the *ex ante* perspective, the UDT agent commits to Policy B.

  **The Execution:**
  When the host actually opens Door 3, the UDT agent does not say, "I need to update my probability that the car is behind Door 2." It simply says, "I observe the host opened Door 3. My pre-committed policy says 'If host opens a door, Switch.' Therefore, I Switch."

  **Result:** The UDT agent switches and wins 2/3 of the time. It performs exactly as well as a sophisticated Bayesian agent. It does not ignore the information; the information is an input to the pre-committed function.

  ### 3. So, Why Be Updateless?

  If UDT gets the same answer as Bayesian reasoning in Monty Hall, why go through the trouble of being "updateless"?

  The advantage of UDT appears in problems where **updating on information makes you worse off** because it changes your behavior in a way that was predictable *ex ante*. This happens in problems involving prediction, logical correlation, or counterfactual dependence.

  **The Counterfactual Mugging (The Smoking Gun):**
  *   **Scenario:** Omega flips a coin.
      *   If Heads: Omega asks you for $100. (You gain nothing, just lose $100).
      *   If Tails: Omega gives you $10,000 *if and only if* it predicts you would have given the $100 in the Heads case.
  *   **The Catch:** You are only asked for the money if the coin comes up **Heads**. You know the coin is Heads.

  **Updateful Reasoning (CDT/EDT):**
  1.  I observe the coin is Heads.
  2.  The Tails branch is impossible now. My action cannot affect the past coin flip.
  3.  If I pay, I lose $100. If I don't pay, I lose $0.
  4.  **Decision:** Don't pay.
  5.  **Outcome:** Since Omega predicted you would reason this way, you never get the $10,000 in the Tails world. Your *ex ante* expected value is $0.

  **Updateless Reasoning (UDT):**
  1.  (Before the coin flip) I consider policies.
      *   Policy Pay: "If asked, I pay."
      *   Policy Refuse: "If asked, I refuse."
  2.  Calculate EV from the prior (50% Heads, 50% Tails):
      *   EV(Pay) = 0.5 * (-$100) + 0.5 * ($10,000) = +$4,950.
      *   EV(Refuse) = 0.5 * ($0) + 0.5 * ($0) = $0.
  3.  **Commitment:** I commit to Policy Pay.
  4.  **Execution:** The coin comes up Heads. I observe Heads. My policy says "Pay." I pay.
  5.  **Outcome:** I lose $100, but I am the kind of agent that wins $10,000 in the counterfactual Tails world. My *ex ante* expected value is +$4,950.

  In this case, the Updateful agent is "dynamically inconsistent." Before the coin flip, they wish they could commit to paying. After the coin flip, they refuse. UDT enforces the *ex ante* optimal preference, preventing the agent from sabotaging themselves once they receive "bad" news (like learning the coin is Heads).

  ### 4. Summary of the Correction

  Your worry assumes that "updateless" implies the agent treats all observations as null. The correction is:

  1.  **UDT agents condition on observations:** Their policies are functions $Policy(Observation) \rightarrow Action$.
  2.  **UDT agents optimize globally:** They choose the function that maximizes utility over the entire probability space, not just the current posterior slice.
  3.  **Mundane Problems:** In problems like Monty Hall, the *ex ante* optimal policy aligns with the *ex post* optimal action. UDT matches Bayesian performance.
  4.  **Newcomb-like Problems:** In problems involving predictors or logical links, the *ex ante* optimal policy diverges from the *ex post* greedy action. UDT outperforms CDT/EDT.

  ### Conclusion for Your Seminar

  You can reassure your seminar participants that UDT is not proposing we ignore evidence. Rather, it proposes that we should view ourselves as **embodiments of a decision algorithm** selected for its global performance, rather than as **local optimizers** selecting actions based on current knowledge.

  In Monty Hall, the best algorithm says "Switch." In Counterfactual Mugging, the best algorithm says "Pay." An updateful agent fails the latter because it tries to re-optimize the algorithm after seeing the coin, whereas the UDT agent sticks to the algorithm that made it rich in expectation.

  UDT cures the "disease" of dynamic inconsistency in Newcomb-like problems without inducing the "fatal disease" of ignoring evidence in mundane problems. It simply shifts the locus of optimization from the *moment of action* to the *design of the agent*.
