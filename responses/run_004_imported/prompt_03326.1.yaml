      *   **The Climax:** The voting mechanism jams because the ledger can't record "Duty" in the same column as "Utility."

  7.  **Final Polish:**
      *   Make it atmospheric. Smoke, ticking clocks, ledgers.
      *   Ensure the "non-negotiable" delegate stops the machine.
      *   Highlight the frustration of the Utilitarian delegate who just wants to maximize the sum.

  8.  **Self-Correction during drafting:**
      *   Make sure the seat weights are clear. Conny has more seats, but needs Deon's bloc to reach a threshold (maybe 60% required for "Action").
      *   The "Incomparability" needs to be physical. Maybe the voting tokens don't fit in the slots? Or the ledger ink refuses to dry? Let's go with the ledger refusing to equate the values.
      *   The "Non-negotiable" rule: Deon refuses to vote *against* a truth-telling requirement, even to gain a vote elsewhere. Actually, better: Deon refuses to treat a Moral Permission as a Tradable Asset.

