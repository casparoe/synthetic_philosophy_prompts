answer: |-
  The Chamber of Mind was dim, lit by the green glow of the ledger screens hovering above each bloc. Alex sat in the observation gallery, hands gripping the railing, watching the delegates of his own conscience argue over the docket for Tuesday.

  The seats were weighted. The Consequentialist Bloc, led by a sharp-eyed woman named Conny, occupied forty-five percent of the floor. They were restless, shuffling papers, calculating margins. Opposite them sat the Deontologist Bloc, thirty-five percent, led by a man in a stiff, high-collared coat named Deon. He sat perfectly still, a single red rulebook open on his desk. The remaining twenty percent belonged to the Virtue Ethicists, currently whispering in the back about "character" and "habits."

  "Item 402," the Speaker announced. "Proposal: Lie to the insurance adjuster to secure payout for the car accident. Net benefit: $4,000. Risk of detection: Low."

  Conny stood immediately. "The Bloc moves to approve. The utility gain outweighs the abstract cost of dishonesty in a low-stakes environment."

  "Veto," Deon said. He didn't raise his voice. He didn't have to. "Lying is categorically forbidden. The Bloc votes no."

  "Come on, Deon," Conny said, walking over to his desk. The ink on her ledger was already flowing, ready to log the utility points. "We're at an impasse. I have the numbers for the budget, but you have the veto on ethical permissions. Let's trade."

  Deon didn't look up. "Trade what?"

  "Item 405," Conny said, sliding a digital card across the desk. "The Veganism Proposal. I want to vote *no* on that. I like steak. You guys want to vote *yes*. I'll give you my forty-five percent on the Veganism bill if you give me your thirty-five percent on the Insurance Lie."

  She smiled. It was a clean trade. She gets her steak; he gets the animals protected. The math balanced.

  Deon pushed the card back. "I cannot accept."

  "Why? You care more about the cows than I do. I care more about the money than you do. We swap votes, intensity is accounted for, expected choiceworthiness goes up."

  "The Veganism bill is a matter of *imperfect duty*," Deon said, tapping his rulebook. "It is good to be merciful to animals, but not strictly required in every instance. The Insurance Lie is a *perfect duty*. It is forbidden."

  "Okay... so?"

  "So, you are asking me to trade a Permission for a Prohibition." Deon finally looked at her. "Your ledger treats them as integers. Positive and negative numbers. You think if I give you enough 'good points' on the cows, it cancels out the 'bad points' on the lie."

  "Isn't it?"

  "No." Deon stood up. "If I vote for your Lie, I am not logging a negative number. I am logging an Error. A system crash. You cannot buy a violation of the Categorical Imperative with a surplus of Benevolence."

  Conny frowned, tapping her calculator. "But look at the weights. If you don't trade, the Lie fails (good for you), but the Veganism fails (bad for you). If we trade, the Lie passes (bad for you), Veganism passes (good for you). Net result: You get your priority."

  "You are assuming my priority is a variable," Deon said. "It is a constant. It does not fluctuate based on how much I like steak."

  "Then how do we govern?" Conny gestured to the empty air where the final decision would manifest. "I have more credence than you. Forty-five to thirty-five. But I can't act without your consent on moral permissions. If you won't trade intensity, we're paralyzed."

  "Better paralyzed than corrupt," Deon said.

  "Corrupt? It's a negotiation!" Conny turned to the Virtue Bloc. "Help me out here. Tell him he's being rigid."

  The Virtue delegate shrugged. "It doesn't seem... prudent. But it does seem honest."

  Conny slammed her hand on Deon's desk. "Okay, fine. What if I offer you something else? Item 410. I vote to visit your sick mother."

  Deon blinked. "That is a duty I already hold."

  "Right, but I don't care about it. I'd rather work. So I'm 'spending' political capital to do something I don't value, to get something I do value. That's the definition of trade value. How much is that worth to you? On a scale of one to ten?"

  Deon stared at her. The green light from the ledger flickered over his face. "There is no scale."

  "There has to be! How hard are you willing to bargain? If I visit her twice, does that buy one lie? If I visit her every day for a year, does that buy *two* lies?"

  "Stop," Deon said.

  "I'm trying to find the exchange rate, Deon! If there's no exchange rate, the Parliament doesn't function. It's just a room where you shout 'No' and I shout 'Calculate' and nothing happens."

  "Then nothing happens," Deon said, sitting back down. He picked up his pen. "On Item 402, the Deontologist Bloc votes No. We do not recognize the currency you are offering. You cannot pay for sin with charity."

  Conny stared at him, her calculator hovering in the air, the numbers spinning wildly, unable to find a sum. She looked up at Alex in the gallery. She looked frustrated, helpless. She had the majority will, the best outcomes, the highest expected value. But she was holding a stack of dollars in a shop that only accepted gold, and the gold miner refused to sell.

  "Item 402 is defeated," the Speaker announced.

  Conny slumped into her chair. "You realize," she muttered to Deon, "that because you won't trade, we're going to default to the status quo on everything. Including the charity donation you supposedly like."

  "I do not vote based on consequences," Deon said, opening his book to the next page. "I vote based on law."

  "But you're part of *my* mind!" Conny snapped. "You're supposed to help me decide!"

  "I am here to ensure you do not become a monster," Deon replied, dipping his pen in ink. "Even if it means you become inefficient."

  The green ledger above them flickered and dimmed. The calculation for "Expected Choiceworthiness" returned a null value. The system hadn't crashed, but it hadn't moved, either. Alex watched from the gallery, feeling the familiar knot of indecision in his chest. He knew he wouldn't lie to the insurance company. He also knew he wouldn't feel good about the steak he'd eat for dinner.

  The Parliament remained in session, two currencies circulating in the same room, neither able to purchase the other's peace.
