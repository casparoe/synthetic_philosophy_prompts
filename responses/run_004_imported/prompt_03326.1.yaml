          *   Vote-trading must happen *on the page* (show, don't just tell).
          *   The "incomparability" problem must manifest as a plot obstacle.
          *   One delegate must have an absolute non-negotiable rule (deontology?) and refuse to trade, disrupting the system.
      *   **Tone:** Philosophical but narrative-driven. Not a dry lecture.

  2.  **Setting the Scene:**
      *   Where is this parliament? A smoky backroom? A grand hall? Let's go with a slightly surreal, bureaucratic chamber. Dim lighting, heavy curtains, a sense of weight.
      *   Who is the protagonist? The "Self" or "Agent" observing the delegates. Let's call him "The Host" or just keep the perspective close to the decision-maker. Let's make the narrator the one whose mind this is, watching the delegates argue.
      *   The Decision: Needs to be something where theories diverge sharply. Classic trolley problem is too cliché. Lying to save feelings? Stealing medicine? Let's go with: *Do I report my friend for a minor infraction that prevents a larger harm?* Or maybe: *Do I donate a significant portion of my income to effective charity vs. keeping it for family?* Let's choose: **Donating 50% of income to high-impact charity.** It hits Utilitarianism hard (good), Virtue Ethics/Family duties hard (bad), and Kantianism (neutral/complex). Actually, let's make it sharper. **Lying to a friend to protect a secret.**
          *   Utilitarian: Lie if it maximizes happiness.
          *   Kantian: Never lie (perfect duty).
          *   Virtue Ethics: What would a honest/loyal person do?
          *   Egoism: What benefits me?
      *   Let's refine the issue: *The "Burning Warehouse" Scenario.* I found out my company is dumping waste. Do I blow the whistle (risking my job and family's stability) or stay quiet?
          *   Utilitarian: Whistle (saves many lives).
          *   Kantian: Whistle (duty to truth/law).
          *   Care Ethics/Family First: Stay quiet (protect dependents).
          *   Nihilist/Egoist: Whatever.

      *   *Correction:* To make the trading visible, we need issues *across* time or different bills. A parliament votes on multiple things. So, there needs to be a docket.
      *   **The Docket:**
          1.  Bill A: Donate $5k to malaria nets (Utilitarian priority).
          2.  Bill B: Lie to Aunt about where her gift is (Kantian veto).
          3.  Bill C: Eat the meat or be vegan (Virtue/Animal Rights).

  3.  **Character Design (The Delegates):**
      *   **Utilitarian (Act):** Pragmatic, calculator in hand, wants the big numbers. Let's call her "Millie." High credence (say 40%).
      *   **Kantian (Deontologist):** Rigid, uniform, holds a rulebook. Let's call him "Immanuel" or "Kant." Medium credence (30%). *This is the non-negotiable one.*
      *   **Virtue Ethicist:** Relaxed, cares about character. "Aristotle." Low credence (20%).
      *   **Common Sense/Intuition:** The swing vote. "Folk." (10%).

  4.  **Drafting - The Conflict:**
