      *   *Refining the Smoker Example:* In standard RPT, if I choose smoke today and smoke tomorrow, I revealed prefer smoke. But if I choose "quit" on Monday, then "smoke" on Tuesday, is that inconsistent? Not necessarily, budgets changed. But if I plan on Tuesday to quit on Wednesday, and then on Wednesday I smoke, that's dynamic inconsistency. This violates the *assumption* of stable preferences required for the standard welfare theorems, even if each individual choice is locally consistent.
