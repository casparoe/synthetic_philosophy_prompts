answer: |-
  You have reconstructed a classic and profound tension in the foundations of economics, one that Amartya Sen made central to his career. Your deduction is logically sound *within the strict confines of the original Samuelsonian revealed preference framework*. If utility is defined *exhaustively* as the index function that rationalizes observed choices, then choice cannot be "wrong" about utility, any more than a thermometer can be "wrong" about temperature (assuming it functions by definition).

  However, your confusion stems from the fact that while Revealed Preference Theory (RPT) remains the **formal backbone** of microeconomics, it is no longer the **conceptual ceiling** for welfare analysis. Economists have developed several sophisticated workarounds to accommodate akrasia, addiction, and manipulation without abandoning the formal apparatus entirely.

  Here is how modern economic theory navigates the problem you identified.

  ### 1. The Separation of Decision Utility and Experienced Utility
  The most direct response to your puzzle comes from the distinction introduced by Kahneman, Wakker, and Sugden. They distinguish between:
  *   **Decision Utility:** The weight assigned to an outcome in the *choice* process (what RPT measures).
  *   **Experienced Utility:** The hedonic or welfare outcome actually *felt* by the agent (what welfare economics cares about).

  In the strict Samuelsonian view, these are identical by definition. In modern Behavioral Welfare Economics (BWE), they are distinct variables. A smoker may have a high *decision utility* for cigarettes (driven by craving, habit, or addiction mechanisms) but a negative *experienced utility* (coughing, regret, health anxiety).

  Economists working in this tradition now frequently treat choice as a **noisy signal** of welfare rather than a perfect revelation. If we have independent data on experienced utility (e.g., subjective well-being surveys, physiological markers, or "considered judgments" made in cool moments), we can identify a wedge between choice and welfare. This allows economists to speak of "mistakes" without violating formal consistency conditions locally.

  ### 2. Dynamic Inconsistency and Multiple Selves
  Your smoker example is the canonical case for **time-inconsistent preferences** (Strotz, 1955; Phelps & Pollak, 1968; Laibson, 1997).

  In a static RPT framework, if the smoker chooses smoking over health today, and smoking over health tomorrow, they are consistent. However, welfare economics usually assumes **dynamic consistency**: the plan you make at $t_0$ for $t_1$ should be the plan you execute at $t_1$.

  Hyperbolic discounting models show that agents can violate this. At $t_0$ (Monday), I prefer {Quit on Tuesday} over {Smoke on Tuesday}. But when $t_1$ (Tuesday) arrives, my discount rate shifts, and I prefer {Smoke now} over {Quit now}.
  *   **Formal Status:** This does not necessarily violate WARP/SARP *within* a single choice set at a single moment.
  *   **Welfare Status:** It violates the assumption of a **unitary, stable self**.

  To handle this, economists model the agent as a sequence of temporal selves. The "Monday Self" and "Tuesday Self" have different utility functions. Welfare analysis then becomes a problem of adjudicating between these selves. Often, economists privilege the "long-run" or "planning" self (the one that wants to quit) over the "myopic" self (the one that lights up). This provides a principled, internal basis for calling the smoking "self-defeating" without invoking an external moral standard: it is self-defeating relative to the agent's own *intertemporal* preferences.

  ### 3. The "Errors" Approach and Preference Purification
  A growing literature (e.g., Thaler & Sunstein, Bernheim & Rangel) argues that we can distinguish between **true preferences** and **choice errors**.

  In this view, RPT is valid only under "ideal conditions." If a choice is made under conditions of cognitive overload, framing effects, or physiological compulsion (addiction), it is treated as a "contaminated" revelation.
  *   **Preference Purification:** The economist's job is to infer the latent preference ordering that *would* have been revealed had the agent been calm, informed, and unimpeded.
  *   **Internalities:** Just as pollution is a negative externality imposed on others, addiction is modeled as a negative **internality** imposed by the current self on the future self.

  This allows welfare economists to support policies (like sin taxes or commitment devices) that restrict choice *in order to satisfy* the agent's own purified preferences. This is the theoretical engine behind "Libertarian Paternalism."

  ### 4. Sen's Critique and the Capabilities Approach
  Since you mentioned Sen, it is worth noting that economists have absorbed his critique more than they sometimes admit. Sen argued that RPT conflates **choice** with **advantage**.
  *   **Commitment:** Sen pointed out that I might choose A over B not because I prefer A, but because I feel committed to A (e.g., voting in a rainstorm, or refusing to drink due to a pledge). RPT misidentifies this as a preference for the *act* of voting or abstaining.
  *   **Capabilities:** Consequently, much of development economics has shifted from utility-maximization metrics to the **Capabilities Approach** (Sen, Nussbaum). Welfare is measured not by the bundle chosen, but by the *set of feasible bundles* (the opportunity set) available to the agent.

  In this framework, the smoker who *cannot* quit due to addiction has a reduced capability set, even if their choices remain consistent. The welfare loss is the contraction of freedom, not necessarily a violation of consistency.

  ### 5. Why the Confusion Persists
  You asked: *"How do economists working in that tradition still speak of self-defeating, exploitative, or manipulated choices at all?"*

  The answer is that there is a **schism** between the **formal core** taught in the first year of graduate micro (where your deduction holds true) and the **applied welfare analysis** done in public policy and behavioral fields (where your deduction is relaxed).

  *   **In Positive Economics:** RPT remains king. We assume agents maximize *something* because it makes models tractable and predictive. As Friedman might say, it doesn't matter if they *really* maximize utility, only if they act *as if* they do.
  *   **In Normative Economics:** The identification of Welfare $\equiv$ Choice is increasingly seen as untenable. Most welfare economists now operate with a **dual-system** model:
      1.  **Choice Data:** Used to understand behavior.
      2.  **Welfare Metric:** Derived from choice *plus* auxiliary assumptions about error, self-control, or happiness data.

  ### Summary for Your Research
  Your intuition is correct: **Strict Samuelsonian RPT is incompatible with a normative critique of akrasia.** If you hold strictly to the definition that $U(x) \geq U(y) \iff x \succeq y$ (where $\succeq$ is chosen over), then the smoker is maximizing.

  However, modern economics resolves this by:
  1.  **Fracturing the Self:** Modeling time-inconsistency (Multiple Selves).
  2.  **Fracturing the Concept:** Distinguishing Decision Utility from Experienced Utility.
  3.  **Conditioning Revelation:** Treating choice as a fallible signal of welfare subject to "error terms" caused by framing or compulsion.

  For a philosophy PhD working on decision theory, the most fertile ground here is likely the **normative justification for "preference purification."** Economists often assume they can distinguish "true" preferences from "errors," but the philosophical criteria for making that distinction (without smuggling in the theorist's own values) remain under-theorized. That is precisely where the philosophy of economics can contribute to the formal tradition.

  **Recommended Reading to bridge the gap:**
  *   **Kahneman, D. (1994).** "New Challenges to the Rationality Assumption." (On Decision vs. Experienced Utility).
  *   **Bernheim, B. D., & Rangel, A. (2009).** "Beyond Revealed Preference: Choice-Theoretic Foundations for Behavioral Welfare Economics." (Formalizing the "errors" approach).
  *   **Hausman, D. M. (2012).** *Preference, Value, Choice, and Welfare.* (A philosophical treatment exactly addressing your puzzle).
  *   **Thaler, R. H., & Sunstein, C. R. (2008).** *Nudge.* (Specifically the chapters on "Econs vs. Humans" and welfare).

  You have correctly identified the limit of the orthodox formalism; the literature since the 1990s is essentially the story of how economists tried to build a ladder out of that hole.
