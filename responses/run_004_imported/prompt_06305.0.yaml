      *   *Worry vs. Artifact?* Discuss the normative literature.
      *   *Sharp prior to wide interval?* Ensure the explanation covers how marginals are sharp while conditionals are not.

  9.  **Final Polish:** Check for clarity on "independence." In imprecise prob, there are many definitions of independence (strong, weak, epistemic). Dilation usually arises when we lack *strong* independence. I should mention that distinction briefly without getting bogged down. (Decided: Keep it simple. Focus on the set of distributions containing varying correlations).

