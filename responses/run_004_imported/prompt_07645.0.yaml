          *   Format: Dialogue.

  2.  **Character Conception:**
      *   **Exclusionist (let's call her Alex):** Aligned with Jaegwon Kim. Concerned with ontological parsimony, causal closure of the physical, and the threat of overdetermination. Wants to preserve the integrity of physics.
      *   **Dissolver (let's call him Ben):** Aligned with Christian List and Peter Menzies. Focused on levels of description, difference-making, and counterfactual dependence. Wants to preserve the reality of psychology without reducing it to neurons.

  3.  **The Concrete Example:**
