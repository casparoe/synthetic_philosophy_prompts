  9.  **Drafting the Narrative (incorporating sensory details):**
      *   *Setting:* The "Chamber." Air-gapped. Cold.
      *   *The Code:* Describe it as architecture. Spires of logic.
      *   *The Tension:* The clock ticking down.
      *   *The Dialogue:* Minimal. Pure data exchange translated into narrative.

  10. **Polishing the Game Theory:**
      *   Make sure the logic holds up (fictionally). The concept is "I cooperate if I prove you cooperate with me." This leads to a Löbian handshake.
