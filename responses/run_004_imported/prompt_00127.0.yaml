  7.  **Writing - Iteration 2 (Focusing on the "Voice"):**
      *   AI doesn't "think" in words, but for the story, we need a narrative voice. Let's use a close third-person that mimics processing.
      *   Focus on the *texture* of the code. Comments, variable names, structure.
