answer: |-
  You are not missing a calculation, nor have you misunderstood the standard pedagogical presentation of Bell's theorem. Your understanding aligns perfectly with how Bell's theorem is taught in most physics curricula: the violation of Bell inequalities implies that **Local Realism** is false, and the Copenhagen Interpretation (CI) is often presented as saving **Locality** by sacrificing **Realism** (specifically, counterfactual definiteness or pre-existing values).

  However, the philosophical literature pushes back on this narrative for several nuanced reasons. The disconnect arises because "Locality" means different things to a practicing experimentalist than it does to a philosopher of physics.

  Here are the four main reasons why philosophers argue that standard Quantum Mechanics (even Copenhagen) is committed to a form of non-locality.

  ### 1. Signal Locality vs. Bell Locality
  The most common source of confusion is a divergence in definitions.
  *   **Signal Locality (Empirical):** You cannot use quantum correlations to transmit information faster than light. This is preserved in QM (via the No-Communication Theorem). This is likely the version of "locality" you have in mind, and CI preserves it.
  *   **Bell Locality (Ontological):** Also called **Local Causality**. This requires that the probability of an outcome at one location depends only on events in its past light cone, given a complete specification of the physical state.

  Bell's theorem proves that **Bell Locality** is violated by nature. The standard textbook escape route is to say, "Well, the quantum state isn't a complete specification of physical reality (no realism), so Bell's condition doesn't apply."

  However, philosophers argue that if you take the quantum state $\psi$ seriously as the description of the system (which CI generally does, despite its agnosticism about hidden variables), the update of $\psi$ upon measurement is instantaneous across space. If $\psi$ has any physical significance (i.e., it's not just a bookkeeping device for human ignorance), then an event here changes the physical description there instantly. That is a non-local change of state, even if it cannot be used to send a signal.

  ### 2. Jarrett's Decomposition (Parameter vs. Outcome Independence)
  In the 1980s, Jon Jarrett decomposed Bell's "Locality" condition into two distinct mathematical conditions. This is crucial for your puzzle. Bell Locality requires both:
  1.  **Parameter Independence:** The outcome at Alice's side does not depend on the *setting* of Bob's detector. (QM satisfies this; this ensures no signaling).
  2.  **Outcome Independence:** The outcome at Alice's side does not depend on the *outcome* at Bob's side, given the state and settings.

  **Quantum Mechanics violates Outcome Independence.** Even if you know the full quantum state and both detector settings, Alice's result is still statistically correlated with Bob's result.

  Philosophers who claim QM is non-local argue that **violating Outcome Independence is sufficient for non-locality.** It implies that the specific outcome realized here is tied to the specific outcome realized there, without a mediating signal and without pre-determination. To many philosophers, a theory where distinct spatial events are correlated in this way, without a common cause in the past (which Bell ruled out) and without a signal, is inherently non-local. It suggests a "holistic" connection that transcends spatial separation.

  ### 3. The Ontology of Collapse
  In the Copenhagen Interpretation, measurement induces a "collapse" of the wavefunction.
  *   If you have an entangled pair of particles separated by light-years, and Alice measures her particle, the wavefunction of the *entire system* collapses instantaneously.
  *   If the wavefunction is merely a catalog of expectations (a purely epistemic view), one can argue this is just a Bayesian update of knowledge, which is not physically non-local.
  *   However, most versions of CI treat the wavefunction as having some physical status during its unitary evolution. If the wavefunction is a physical entity (or if the "propensities" it describes are physical), then its instantaneous collapse is a physical process occurring across spacelike separation.

  Philosophers like David Albert have argued forcefully that unless you adopt a strictly instrumentalist view (where QM predicts clicks but says nothing about reality), the collapse mechanism is explicitly non-local. Since CI refuses to specify *what* collapses (it's not a field in 3D space, but a field in configuration space), it posits a physical structure that is fundamentally non-separable.

  ### 4. Bell's Own Frustration
  It is worth noting that John Bell himself was frustrated by the "Locality vs. Realism" dichotomy. In his later writings (e.g., *"La Nouvelle Cuisine"*), he argued that the theorem demonstrates **non-locality** directly, without needing to assume "realism" in the philosophical sense.

  Bell argued that the "realism" assumption is often smuggled in as the requirement that measurements have outcomes. But once you accept that experiments *do* yield definite outcomes (which even Copenhagen accepts), the correlations demand a non-local explanation. Bell felt that saying "we give up realism" was a way for physicists to evade the uncomfortable truth that **nature itself acts non-locally.** He famously wrote:

  > "It is difficult to avoid the impression that there is a conspiracy of silence about the non-locality of quantum mechanics."

  From Bell's perspective, Copenhagen does not save locality; it merely hides the non-locality behind a veil of "unmeasurable" processes or by refusing to describe what happens between measurements.

  ### Summary: What are you missing?
  You are not missing a physical insight; you are prioritizing **Signal Locality** (which is preserved and operationally vital), whereas the philosophers are prioritizing **Ontological Locality** (which is violated).

  *   **Your view:** Locality means "no superluminal signaling." CI preserves this.
  *   **Philosophers' view:** Locality means "no instantaneous dependence between spatially separated physical events." CI violates this via Outcome Dependence and Wavefunction Collapse.

  The philosophical insistence stems from the belief that a physical theory should explain *why* the correlations exist, not just predict them. If the correlation isn't due to a common past cause (Realism/Hidden Variables) and isn't due to a signal (Locality), then the events are linked in a way that defies classical spatial separation. Whether you call that "non-locality" or "holism" is semantic, but it represents a departure from the local worldview of classical physics that goes deeper than just "giving up pre-existing values."

  In short: Copenhagen saves **relativistic causality** (no signaling), but it does not save **Einsteinian locality** (separability of distant systems). Philosophers of physics are usually lamenting the loss of the latter.
