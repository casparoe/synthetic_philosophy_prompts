      *   **Task:** Write an essay adjudicating between the two leading answers (1/3 vs. 1/2).
      *   **Key Components:**
          *   Explain Adam Elga's argument for 1/3 (restricted principle of indifference).
          *   Explain David Lewis's argument for 1/2 (no new evidence).
          *   Derive Lewis's conditional probability $P(\text{Heads} | \text{Monday})$ and discuss if it's a cost to his position.
