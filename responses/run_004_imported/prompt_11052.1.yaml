answer: |-
  **BOSTON, TREMONT TEMPLE. NOVEMBER 1855.**

  The gaslights hissed, casting long, wavering shadows against the plasterwork. The crowd had gone, leaving behind the scent of wool coats, damp snow, and the stale heat of a thousand arguing breaths. 

  Frederick Douglass stood at the podium, stacking his papers. His hands were steady, but his shoulders carried the weight of the last hour. He had argued for political action, for the ballot, for the Constitution as a weapon. The applause had been polite, but in the front row, William Lloyd Garrison had sat with his arms crossed and his face like stone.

  Garrison rose now. He was smaller than Douglass, slighter, but his presence filled the emptying hall. He walked up the aisle, his coat buttoned tight against the draft.

  "You speak of the Constitution as a shield, Frederick," Garrison said, stopping at the foot of the stage. "But I have watched you try to wrap yourself in a net and call it armor."

  Douglass didn't look up immediately. He finished aligning the edges of his manuscript. "And I have watched you burn the map because you dislike the terrain, William. It does not change the fact that we must walk it."

  "It is not the terrain," Garrison said, stepping onto the dais. He picked up a copy of the *Liberator* from the lectern, crumpling the edge. "It is the foundation. You cannot build a house of liberty on a foundation of chains. The Framers did not hide their intent. They bartered in human flesh at Philadelphia. They counted us as three-fifths of a man to bolster the very power that enslaves us. How can you look at that arithmetic and see liberty?"

  "Because arithmetic can be turned," Douglass said, finally meeting his gaze. "You read the Three-Fifths Clause as a recognition of our bondage. I read it as a penalty upon the slaveholder."

  Garrison scoffed, a sharp, brittle sound. "A penalty? They secured representation for property. They gave the South extra votes in Congress based on the number of souls they held in bondage. That is not a penalty; it is a bonus for sin."

  "It is a reduction," Douglass countered, his voice dropping into the deep register that had shaken halls from London to Rochester. "If they were counted as whole men, the South would have *more* power. The clause reduces their representation. It treats the enslaved not as property, but as people—albeit people the South is punished for excluding from the franchise. The text does not say 'slave.' It says 'all other Persons.' It avoids the word. Why?"

  "Because they were ashamed," Garrison snapped. "They knew it was hellish, so they cloaked it in euphemism. Does a thief become honest because he calls his loot 'borrowed goods'? The Fugitive Clause—Article Four. It commands that a person 'held to service or labor' shall be delivered up. It mandates the return. It makes every Northern sheriff a slave-catcher. The 1850 Act is not an aberration, Frederick; it is the Constitution waking up."

  "The 1850 Act is a violation of due process," Douglass said, leaning forward, resting his hands on the wood. "The Constitution says 'person.' Property cannot be a person. If the text acknowledges the captive as a 'person held to service,' then that person is entitled to the rights of persons. A jury trial. Habeas corpus. The Fugitive Act denies these. Therefore, the Act is unconstitutional. But you would have us abandon the court entirely."

  "I would have us abandon a court that judges by the laws of men rather than the laws of God!" Garrison's eyes flashed. "You rely on the silence of the text. You say because the word 'slave' is absent, the institution is absent. That is a lawyer's trick, not a moralist's truth. Lysander Spooner's sophistry has poisoned you. You are parsing grammar while men are being whipped."

  "I am parsing grammar so I may stop the whip!" Douglass's voice boomed, echoing in the rafters. He stepped down from the podium to stand eye-to-eye with the older man. "If I tell you this knife is for cutting bread, and you say 'No, the man who forged it intended it for murder,' does that change the steel? I care not what Madison whispered in the corners of Philadelphia. I care what the document says. It establishes justice. It secures liberty. It promotes the general welfare. Can slavery do any of these things?"

  "It did for the Framers," Garrison said quietly. The fire dimmed, replaced by a weary sorrow. "They secured *their* welfare. They established *their* justice. You speak of the text as if it fell from the sky, untouched by human hands. But I was there when we burned it. I held the match to the paper, Frederick. I did not burn it because I hate law. I burned it because I love righteousness more. To call a pro-slavery pact an anti-slavery document is to lie. And the abolitionist cannot lie."

  Douglass softened. He reached out, placing a heavy hand on Garrison's shoulder. "You are not asking for truth, William. You are asking for purity. There is a difference. Purity keeps your hands clean. Truth gets the work done."

  "Purity keeps your soul your own," Garrison replied, shrugging off the hand, though not unkindly. "If I vote, I swear an oath to support this Constitution. If I support this Constitution, I support the Fugitive Clause. If I support the Fugitive Clause, I am complicit in the return of a brother to the lash. I will not have blood on my hands, even if it is the blood of the Union."

  "And I will not let the Union stand if it means leaving my people in the dark," Douglass said. "You say the text is a covenant with death. I say it is a promise unkept. The Preamble says 'secure the Blessings of Liberty to ourselves and our Posterity.' Does 'ourselves' mean only white men? If so, the document contradicts itself, for it also claims all men are created equal in the Declaration which birthed it. If there is a contradiction, which way do we resolve it? Toward slavery? Or toward liberty?"

  " Toward the intent," Garrison insisted. "The intent was compromise. The intent was to keep the South in the Union at the cost of the slave. You are trying to read a radical document into a conservative frame. It will break you."

  "Then let it break," Douglass said. "Let the frame shatter. But I will use every splinter to cut the bonds of the captive. You stand outside the temple shouting that the walls are corrupt. I intend to go inside and turn the tables over."

  Garrison looked at him for a long moment. The silence stretched, filled only by the settling of the building and the distant clatter of a carriage on the cobblestones. He looked tired. The moral absolutism that had made him a prophet had also made him lonely.

  "You were my finest disciple, Frederick," Garrison said softly. "To hear you argue for the Constitution feels like hearing a son argue for the master's house."

  "And to hear you argue for disunion feels like hearing a father argue for burning the house to kill the rats," Douglass replied, his voice gentle but firm. "We both want the rats dead, William. We both want the house clean. You think the structure is too rotted to save. I think the rot is an addition, not the beam."

  Garrison turned toward the aisle. He pulled his hat from his head, running a hand through his thinning hair. "The 1850 Act stands, Frederick. The courts uphold it. The President enforces it. Your 'plain text' is blind to the reality of power."

  "Then we must change the power," Douglass said. "Not abandon the lever."

  Garrison paused at the edge of the stage. He looked back, his profile sharp against the dim gaslight. "I pray you are right. For if you are wrong, you are not just misleading a movement. You are teaching men to trust a viper because its scales are pretty."

  "And I pray," Douglass said, gathering his papers into a tight stack, "that you do not find yourself standing on a pile of ashes, righteous and alone, wondering why the world did not follow you into the fire."

  Garrison did not answer. He put on his hat, pulled the brim low, and walked down the aisle. His footsteps echoed, solitary and receding, until the heavy doors opened and closed, letting in a gust of cold winter air that extinguished the nearest lamp.

  Douglass stood alone in the darkening hall. He looked down at the Constitution in his hand. He ran his thumb over the printed words, feeling the texture of the paper, the weight of the ink.

  "Secure the Blessings of Liberty," he whispered to the empty room.

  He blew out the candle.
