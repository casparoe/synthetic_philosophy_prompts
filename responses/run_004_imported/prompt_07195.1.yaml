prompt: |-
  So I spent almost forty years studying orb-weaver spiders before I retired, and lately I've fallen properly down a philosophy rabbit hole on the extended mind thesis -- partly because some animal cognition folks now argue the web itself is doing some of the spiders sensing and remembering, not just sitting there passively catching bugs. Next week I'm recording an episode for a little podcast I run with a philosopher who's built her whole career defending the extended mind thesis, and I really don't want her to just re-run the parity principle and Otto's notebook example one more time. Could you draft me 8 to 10 real interview questions? I need at least one that presses the coupling-constitution fallacy directly on the spider case (being causally hooked up to your web doesn't obviously make the web part of your mind, any more than my leash makes my dog part of me), one asking whether the old glue-and-trust criteria from the original paper even make sense for a creature that never consciously endorsed anything the way Otto endorsed his notebook entries, and one on where the cognitive bloat stops once the web counts -- does the burrow count, does a moth stuck in the silk count. For each one, give me a sharp follow-up keyed to whatever answer she's most likely to give.
