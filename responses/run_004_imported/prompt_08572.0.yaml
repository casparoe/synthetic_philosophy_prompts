      *   *Correction:* Make sure to emphasize that the friend's "nothing left over for philosophy" is the weak point. Philosophy deals with meaning and interpretation, which science doesn't touch.
      *   *Novel Connection:* Ensure the advice ties back to the locked-in narrator. The tank is too peaceful. The stroke is violent.

