answer: |-
  The observation glass was one-way, but Elias tapped his pen against the clipboard anyway, as if Sarah might hear the rhythm of his impatience. On the other side, Sarah sat on the edge of the cot, blinking against the sterile light. She looked exactly as she had yesterday. Or would tomorrow. Depending.

  "She's asking herself the question," Mara said, leaning against the doorframe. She didn't look at Elias; she was watching Sarah's lips move. "Right now. *What are the odds?*"

  " Fifty percent," Elias said, not looking up from his notes. "Because the coin is fair."

  "Because you're stubborn. Look, just grant me the Monday case. If we walk in there right now and tell her *'It is Monday,'* she knows the experiment isn't over. She knows the coin hasn't been re-flipped. You have to agree that conditional on it being Monday, her credence in Heads and Tails must be equal."

  Elias stopped tapping. He finally looked at her, a thin smile touching his lips. "I grant it. Conditional on Monday, $P(\text{Heads}) = P(\text{Tails}) = 1/2$."

  "Good. Now, within the Tails branch, she can't distinguish Monday from Tuesday. Subjectively, they're identical. So you have to agree that $P(\text{Monday} | \text{Tails})$ equals $P(\text{Tuesday} | \text{Tails})$."

  "Obviously."

  "Then do the math, Elias. If Heads-Monday equals Tails-Monday, and Tails-Monday equals Tails-Tuesday, then all three centered worlds are equiprobable. One-third each. She's in one of three moments, and only one of them is Heads."

  "You're conflating the number of awakenings with the probability of the cause," Elias said, turning back to the glass. "She knew before the experiment started that she would wake up. Waking up provides no new evidence. Her prior was $1/2$. It remains $1/2$."

  "So you're saying that if she wakes up, it's $1/2$. But if we walk in and tell her it's Monday, you just agreed it jumps to $2/3$." Mara pushed off the doorframe, stepping into the light. "Think about what you're saying. Merely learning the day of the week makes Heads more likely than Tails? That's not Bayesian updating, that's magic."

  "It's exactly Bayesian updating," Elias shot back, his voice sharpening. "When she learns it's Monday, she eliminates the *Tails-Tuesday* centered world. Since I assign probability $1/4$ to Tails-Monday and $1/4$ to Tails-Tuesday, eliminating Tuesday shifts the weight. The Heads hypothesis survives the update intact; the Tails hypothesis loses half its mass. Of course the ratio shifts to $2/3$."

  "It sounds absurd."

  "It sounds absurd because you're addicted to the Principle of Indifference over centered worlds. But fine. Let's crank the dial. Suppose the protocol changes. Heads: one awakening. Tails: one hundred awakenings."

  Mara crossed her arms. "Now you're just trying to make yourself look worse. In that case, her credence in Heads should be roughly one percent. She's almost certainly in a Tails-run."

  "And I say it's still $1/2$," Elias said calmly.

  "Come on. If she wakes up and asks, 'Am I in the single Heads awakening or one of the hundred Tails awakenings?', you're telling me she should think it's a coin toss?"

  "I'm telling her the coin was fair. The number of times she opens her eyes doesn't change the metallurgy of the coin."

  "But if she learns it's Day One?" Mara pressed. "By your logic, if she learns it's Day One out of a possible hundred, her credence in Heads has to skyrocket."

  Elias didn't flinch. "To near certainty. Yes. If she learns it's Day One, she has eliminated ninety-nine centered worlds associated with Tails, and zero associated with Heads. It would be irrational *not* to bet on Heads."

  "That's the bullet?" Mara laughed, a short, incredulous sound. "You're willing to tell her that if she wakes up on Day Fifty, she should be convinced the coin landed Tails, but if she wakes up on Day One, she should be convinced it landed Heads? All from the same fair flip?"

  "I'm telling her that indexical information matters," Elias said, tapping the glass. Sarah looked up, sensing the movement. "You want to treat her awakenings as random samples from the set of all awakenings. I treat them as guaranteed events in a fixed timeline. You get $1/3$ by counting moments. I get $1/2$ by counting causes."

  "And one of us is going to lose a lot of grant money when we check the logs," Mara said.

  Elias watched Sarah rub her temples. "We'll see. But don't pretend the math is on your side just because the intuition feels softer."

  "Intuition is the only side we have, Elias. The math is just how we justify the guess."
