answer: |-
  This is a profound and historically resonant dilemma. In fact, you have stumbled upon the central anxiety of Victorian moral philosophy. To answer your questions directly: your worry is philosophically legitimate, your coursemate is only partially right about the inconsistency, but your proposed solution (seeking empirical proof of an afterlife) is likely to fail for reasons that go deeper than mere evidentiary standards.

  Here is a breakdown of why you feel this tension, how the Victorians handled it, and where the philosophical trap lies in your current strategy.

  ### 1. Is your original worry legitimate?
  **Yes.** You are grappling with what Plato called the **Ring of Gyges** problem in *The Republic*: If a man had a ring that made him invisible, allowing him to steal, seduce, and kill without consequence, would he remain just? Plato argues yes; the egoist argues no.

  In the Victorian context, this is known as **Henry Sidgwick's "Dualism of Practical Reason."** Sidgwick, one of the greatest moral philosophers of the 19th century (and a contemporary of your seminar's focus), concluded that there are two equally rational methods of reasoning:
  1.  **Rational Egoism:** It is rational to maximize my own happiness.
  2.  **Rational Benevolence (Utilitarianism):** It is rational to maximize the general good.

  Sidgwick was haunted by the fact that without a God to harmonize these two (by ensuring that doing good *always* leads to personal happiness, perhaps in an afterlife), morality might not be rationally binding on the self-interested agent. He wrote famously that if the conflict between duty and self-interest cannot be resolved, "the conflict of the faculties is... a contradiction," and he found this thought deeply disturbing.

  So, your worry is not a personal failing; it is a recognized philosophical problem. You are asking: *Is morality categorical (binding regardless of consequences) or hypothetical (binding only if it serves some end)?* If this life is all there is, and injustice pays, the egoist seems to win.

  ### 2. Is your coursemate right about inconsistency?
  **She is partially right, but perhaps uncharitable.**

  **Where she is right:** There is a risk of **motivated reasoning**. If you rejected religious dogma because of a lack of empirical evidence, turning to parapsychology (NDEs, mediums) *specifically to recover the moral comfort religion provided* looks like "belief in belief." You are not investigating the afterlife to find the truth; you are investigating it because you *need* it to be true to make sense of your ethics. If the standard of evidence that disqualified God also disproves ghosts, then yes, it is inconsistent to hope ghosts will succeed where God failed.

  **Where she is wrong:** It is not logically incoherent to be a theological atheist but a methodological agnostic regarding paranormal phenomena. Religious belief often relies on revelation, scripture, or faith. Paranormal research claims to be empirical (data, testimony, observation). One can reject the former while remaining open to the latter *in principle*. Henry Sidgwick himself became a founding member of the **Society for Psychical Research (SPR)** in 1882 for exactly the reasons you are considering. He hoped empirical evidence of survival might solve the "Dualism of Practical Reason."

  So, you are in good company. But Sidgwick's experiment ultimately failed to provide the proof he sought, and it did not solve his philosophical problem.

  ### 3. Is empirical investigation a sensible way to address the worry?
  **No, and here is the crucial philosophical reason why.**

  Even if you found definitive proof of an afterlife, it would not solve the problem of *moral rationality*; it would merely transform morality into **prudential calculation**.

  *   **The Moral vs. The Prudential:** You stated you believe people have "decisive reason to act justly."
      *   If that reason is "because it is the Right Thing to Do," that is a **moral** reason.
      *   If that reason is "because you will be punished in the afterlife if you don't," that is a **prudential** (self-interested) reason.

  If you act justly *only* because you fear post-mortem consequences, you are not acting morally; you are acting like a prudent criminal who doesn't steal because the cameras are working. This undermines the very "decisive reason" you want to preserve. Kant argued that an action only has moral worth if done from duty, not from inclination or fear of consequence.

  By seeking an afterlife to justify morality, you are effectively conceding that **morality is not rational on its own terms.** You are admitting that without a cosmic policeman, justice is irrational. Most secular moral philosophers (from the Victorians like J.S. Mill to moderns like Christine Korsgaard or T.M. Scanlon) argue that this concession is unnecessary. They argue that rationality itself entails recognizing the claims of others, regardless of consequences.

  ### 4. A Victorian Path Forward
  Since you are in a Victorian seminar, you have a unique opportunity to engage with this directly through the texts.

  1.  **Read Sidgwick's *The Methods of Ethics* (specifically the final chapter):** You will see your exact worry articulated by one of the greatest minds of the era. Note that even he could not resolve it empirically.
  2.  **Consider J.S. Mill's *Utilitarianism*:** Mill argues that the "internal sanction" of duty (conscience, feeling of unity with others) is sufficient. He tries to naturalize the feeling of obligation so it doesn't require supernatural backing.
  3.  **Consider Matthew Arnold or Leslie Stephen:** These Victorian thinkers argued for "moral faith" without theological dogma. They suggested that we must act *as if* morality is binding because human flourishing depends on it, even if we cannot prove it metaphysically.

  ### Recommendation
  Your coursemate's critique is a useful check on your motivations, but do not let it silence the philosophical question. However, I would advise you to pause the investigation into mediums and NDEs.

  **Why?** Because if your commitment to justice is contingent on the existence of ghosts, your morality is fragile. If the evidence turns up empty (as it likely will), you risk losing your commitment to justice.

  A stronger philosophical move is to ask: *Can I defend the rationality of justice without the afterlife?*
  *   **Argument from Integrity:** To be unjust is to fragment your own character (Bernard Williams).
  *   **Argument from Rational Agreement:** No rational agent would agree to a world where injustice is permissible, because they might end up as the victim (Scanlon/Kant).
  *   **Argument from Meaning:** A life of selfishness is ultimately empty of meaning, even if it is pleasurable (Mill's "better to be Socrates dissatisfied").

  **Summary:** Your worry is legitimate and historically significant. Your coursemate is right that seeking supernatural evidence to solve a moral problem is epistemically risky and potentially circular. But the solution is not to find better evidence for ghosts; it is to find better arguments for why rationality and morality are linked *in this life*, regardless of what comes after. That is the true challenge of Victorian secular ethics, and it is where your seminar work can best help you.
