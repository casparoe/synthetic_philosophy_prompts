    "propaganda_thesis": {"points": 0, "max": 5, "comment": ""},
    "beauty_truth_justice": {"points": 0, "max": 5, "comment": ""},
    "context": {"points": 0, "max": 4, "comment": ""},
    "opposition": {"points": 0, "max": 6, "comment": ""},
    "total": 0,
    "letter_grade": "",
    "overall_comment": ""
  }
  ```

  Please be specific about which parts are actually right versus just sound right -- I dont want to hand out points for something that's wrong just because it's phrased confidently.
