  Question as given on the exam:

  In "Criteria of Negro Art" (1926) Du Bois writes that "all Art is propaganda and ever must be." Explain (a) what he means by this and how it connects to his views on beauty, truth, and justice, and (b) how at least one other figure from the same moment in the Harlem Renaissance explicitly pushed back against this view, and how.

  Student's answer:

  "Du Bois's line sounds shocking, but he isn't using 'propaganda' the way we would today (lies, manipulation). He means art that is for something rather than neutral or 'pure.' For Du Bois, beauty is never separate from truth and justice -- he says flatly that he doesn't care about art that isn't propaganda, because the whole point of Black art in 1926 is to make white America see Black people as fully human, so beauty becomes a weapon for justice rather than an escape from it. This came out of the Crisis symposium Du Bois ran that year, 'The Negro in Art: How Shall He Be Portrayed?', which asked Black writers and white publishers how the race should be shown in fiction.

  Not everyone agreed with him. Alain Locke pushed back directly, arguing (in 'Art or Propaganda?') that Black artists should 'choose art and put aside propaganda,' since art rooted in self-expression would do more for the race than didactic writing. Langston Hughes went further in 'The Negro Artist and the Racial Mountain,' written as a direct reply to Du Bois's propaganda line: Hughes says that insisting Black art serve a political program is just another version of the shame that makes the Black bourgeoisie want to be as white as possible, and that the true Black artist has to please himself, not any cause -- Du Bois's included."

  Can you grade it out of 20 and give me your reasoning as JSON, something like:

  ```json
