answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], Ray's niece/nephew.

  I want to start by acknowledging the venue. It is rare that we get to celebrate a 33-year career in the place where the work actually happened, surrounded by the people who saw it happen. And honestly, looking around this cafeteria, smelling the distinct aroma of… well, hospital coffee and floor wax… it feels right. This isn't a gala. It's a shift change. The longest shift change in history.

  Now, usually, this is the part of the toast where I'm supposed to stand up and tell you that Uncle Ray is a magician. I'm supposed to say something like, "In three decades, he never lost a patient who didn't deserve to go." I'm supposed to talk about the scoreboard.

  But here's the thing: Ray would hate that. In fact, he explicitly told me not to say it.

  He told me that if a patient walked out of here, it wasn't always because Ray was a god. Sometimes, it was because the injury landed a millimeter to the left. Sometimes, it was because the ambulance hit green lights. Ray knows that in trauma surgery, there is a massive difference between the work you do and the outcome you get. He knows that luck plays a role.

  And for a while, that bothered me. I went down a bit of a rabbit hole trying to figure out how to toast a man who doesn't want credit for the wins. Because if you take that seriously, where does the credit go? If the outcome is luck, what's left?

  But then I realized that's exactly *why* we're here.

  We aren't here to celebrate the scoreboard. The scoreboard is fickle. We are here to celebrate the guy who showed up to play the game, every single night, for 33 years.

  To the medical staff in the room: You know this better than anyone. You know that Ray's greatness wasn't in controlling the uncontrollable. It was in the judgment he brought when the chaos hit. It was in the steady hands when everyone else's were shaking. It was in the way he treated the family in the waiting room, not just the body on the table.

  To the family in the room: I know you want to hear that he saved everyone. And I'm not saying he didn't save a lot of people. But I think Ray is actually a bigger hero than the "perfect record" version of him. Because a magician tricks you into thinking they have total control. Ray never pretended that. He just promised that when you were at your worst, he would be at his best.

  He wants to be honored for the care, not the cure. And honestly? That's a much harder thing to do. Anyone can ride a wave of good luck. It takes a specific kind of character to bring dignity, skill, and compassion to a situation where the odds are stacked against you, regardless of how it ends.

  Ray, you taught me that we can't control the luck. We can't control where the truck swerves or where the bullet lands. But we do control how we respond. We control the steady hand. We control the kindness. We control showing up.

  There are thousands of people walking around this city who are here because you were in the room that night. But even for the ones who didn't make it, their families are here in spirit, grateful that you were the one holding their hand at the end. That part *was* you. That wasn't luck. That was character.

  So, I'm not going to toast the outcomes. I'm going to toast the input.

  To the calm in the storm. To the judgment when it mattered. To 33 years of doing the work, regardless of the score. And to a retirement where the only thing you have to cut is a piece of cake.

  To Ray.
