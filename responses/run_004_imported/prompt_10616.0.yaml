          *   Scenario: Two possible worlds.
          *   World 1: 100 ravens, all black. (H is True)
          *   World 2: 1000 ravens, 900 black, 100 white. (H is False)
          *   If I pick a bird at random and it's a raven, am I more likely in World 2? Yes, because there are more ravens there.
          *   Therefore, finding a black raven increases the probability I'm in World 2, where H is false.
      *   **Round 3: The Response.**
          *   Elena: That's just showing $K$ matters. It doesn't prove Nicod is wrong *in principle*.
          *   Marcus: But "in principle" without $K$ is meaningless. If Nicod fails in plausible scenarios, it's not a universal rule.
      *   **Round 4: The Definition of Confirmation.**
