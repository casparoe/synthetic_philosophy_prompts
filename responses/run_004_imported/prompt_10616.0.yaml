      *   **Character 2 (The Bayesian/Contextualist):** Let's call him *Marcus*. He values scientific practice, prior probabilities, and the impossibility of a "view from nowhere." He thinks Hempel is playing a game that doesn't map to reality.
      *   **Setting:** A quiet corner of a pub or someone's living room after the main group has dispersed. Wine glasses present.

  4.  **Drafting - Section by Section:**

