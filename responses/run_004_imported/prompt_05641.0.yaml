  ### Grader's Note (For Your Reference)
  The "trap" in the final paragraph is a common student error. They often assume that because Nyāya is a realist school that values perception, all knowledge must be *based* on perception. While Nyāya agrees that *vyāpti* (the universal relation) is known through perception, they insist that the *knowledge generated by inference* (e.g., knowing there is fire on the mountain) is distinct from perceptual knowledge (you cannot see the fire). Therefore, inference is an independent *pramāṇa*. The student's claim that they are "not independent sources of knowledge in their own right" is actually the Cārvāka position, not the Nyāya position. This is why I deducted points on Part (d) and Coherence; the student effectively argued against the school they were expounding in the final sentences.
