answer: |-
  **The Unity Contractor**

  A client walks into a metaphysician's workshop. "I need a fact built," he says. "Specifically, *Desdemona loves Cassio*."

  "No problem," says the metaphysician. He places a block labeled **Desdemona** on the table, a block labeled **Cassio** on the right, and a brick labeled **Loves** between them.

  "That's just a list," says the client. "Where's the unity? How do I know the brick isn't just sitting there?"

  "Ah, right." The metaphysician grabs a tube of glue and sticks the **Loves** brick to **Desdemona** and **Cassio**. "There. Bound."

  "But the glue isn't bonded to the brick," says the client. "You've just added two new things—the glue and the brick—that need connecting."

  "Good point." The metaphysician grabs a stronger adhesive and sticks the glue to the brick.

  "But now the adhesive isn't bonded to the glue."

  The metaphysician freezes, holding a third tube. He looks at the table, then at the client. "I'm going to need a larger workbench."

  "Why?"

  "Because every time I add a connector to fix the connection, the connector itself becomes a new thing that needs connecting. I'm currently one relation short of a unified proposition, and I always will be."

  "So can I have my fact?"

  "I can sell you the constituents," says the metaphysician. "But the unity is backordered until the end of infinity."
