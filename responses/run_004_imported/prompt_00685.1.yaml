answer: |-
  Your intuition is spot on: Danny is missing something huge. While his logic sounds sound on a purely mechanical level (Input A cannot change Outcome B), it fails completely when you apply it to human psychology, specifically your grandfather's psychology.

  Danny is treating this like a transaction. Your grandfather is treating this like a legacy.

  Here is why Danny's reasoning is flawed, and why your gut feeling that you should keep showing up is the actually rational choice.

  ### 1. The "Love of the Craft" Paradox
  Your grandfather's stated criterion for inheritance is **"genuine love of the craft."**
  *   **If you love the craft:** You show up on Saturdays because you enjoy the work, the problem-solving, and the creation, regardless of whether there is a reward at the end.
  *   **If you love the money:** You show up only as long as your effort can influence the reward. Once the reward is out of reach (or guaranteed), you stop working.

  By stopping his work now, Danny is inadvertently providing **definitive proof** that he was never there for the craft; he was there for the inheritance. He is validating the exact trait your grandfather said he *doesn't* want.

  If your grandfather chose you, and you stop coming, he will see that as you admitting you only wanted the money. If he chose someone else, and you keep coming, you prove you love the business enough to steward it even if it isn't yours. Either way, stopping is the wrong move.

  ### 2. The "Sealed Envelope" is Likely Part of the Test
  You described your grandfather as "freakishly good at reading people." He is a seasoned businessman who built something from nothing. Do you really believe a man that sharp doesn't anticipate how his grandchildren will react to the news of a sealed envelope?

  Telling you the decision is final is the ultimate stress test.
  *   **Scenario A:** The envelope is real. But wills can be contested, trusts can be amended, and "retirement" dates can shift. If he sees the business crumbling because the heirs stopped caring, he might decide none of you are fit to run it and sell it out from under you.
  *   **Scenario B (More Likely):** The envelope is a bluff. He hasn't decided yet, or he has left a clause that requires the heir to be "actively involved in operations at the time of transfer." By telling you it's final, he is filtering out the opportunists. Danny just filtered himself out.

  ### 3. Danny is Creating a "Poison Pill"
  Even if the envelope is 100% real and unchangeable, Danny is making a massive reputational error.
  *   **With Grandpa:** Danny is signaling that his relationship is transactional. Grandpa may not change the will, but he could set up a trust that pays you out slowly, or gives the board control to someone else, or leaves the bulk of his personal wealth to charity because he's disappointed in the family's work ethic.
  *   **With the Family:** When the envelope is opened, if Danny doesn't get the business, he looks bitter and lazy. If Danny *does* get the business, he now has to manage employees (his cousins) who know he thinks working there is a "waste of time." He has undermined his own future authority.

  ### 4. The "No-Lose" Scenario for You
  If you continue to show up, you win in every scenario except one (getting the business but hating the work).
  *   **If you get the business:** You are prepared, you have the respect of the workforce, and you proved your dedication.
  *   **If you don't get the business:** You have maintained a relationship with your grandfather, you have learned valuable manufacturing/management skills you can use elsewhere, and you retain your dignity. You also position yourself as a potential key employee or consultant for the cousin who *does* win, rather than the cousin who quit.
  *   **If Grandpa sells the business:** You have networking connections and industry experience.

  ### The Verdict
  Danny is suffering from **outcome bias**. He thinks the only thing that matters is the name on the deed. He is missing that the *process* is the point.

  Your grandfather didn't say, "I'm giving this to the person whose name is on the paper." He implied, "I'm giving this to the person who embodies the spirit of this business."

  **Danny is being logically consistent but strategically stupid.**
  **You are being emotionally intelligent and strategically sound.**

  Keep showing up on Saturdays. Not to change his mind, but to prove to yourself (and him) that Danny was wrong about you. If you truly love the craft, the envelope doesn't matter. If you stop because of the envelope, Danny was right about you, too.
