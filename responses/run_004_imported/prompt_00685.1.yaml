      *   **The Grandpa:** Built a business from nothing. Values "genuine love of the craft" over money. Highly perceptive (claims of predicting divorce/law school failure). Decisive and stubborn (never goes back on a decision). Has *already* decided who gets the business (sealed envelope).
      *   **The Stakes:** Inheritance of a manufacturing business (significant value, legacy, career).
      *   **The Cousin (Danny):** Argues that since the decision is final, putting in effort now is pointless. Suggests stopping weekend help to "enjoy life."
      *   **The Narrator (User):** Feels Danny's logic is flawed ("rubbed me the wrong way") but can't articulate why. Friend couldn't figure it out either.
      *   **The Core Question:** Is Danny being rational, or is he missing something?

