  **Tier S: The Gene**
  This is the fundamental ledger of evolution; allele frequency change is the only definition of evolution that holds universally without exception. It does unique explanatory work in cases of intragenomic conflict (e.g., meiotic drive, transposons) where the "interests" of a gene diverge from the survival of the individual organism, making it causally distinct from higher levels.

  **Tier A: The Individual Organism**
  While often reducible to gene propagation in simple models, the organism functions as the primary "interactor" with the environment and is the standard unit for measuring phenotypic adaptation. It earns a separate tier from the gene because organism-level selection can be modeled effectively without tracking every allele, and because gene-individual conflicts prove they are not merely notational variants of one another.

  **Tier B: Kin Selection & Multilevel Selection**
  **Explicit Equivalence Flag:** These two are placed together because modern theoretical biology largely regards them as mathematically equivalent formalisms (connected via the Price Equation) that partition the same causal process differently. They do immense explanatory work for social behaviors, but they are essentially different accounting methods for the same underlying genetic dynamics rather than distinct causal mechanisms.

  **Tier C: The Superorganism/Colony**
  This is a highly useful descriptive heuristic for eusocial insects, but it is causally reducible to Tier B (extreme kin selection/MLS) rather than being a fundamentally new mechanism of selection. It functions more like a specific architectural pattern in your software analogy—a distinct system design that emerges from the lower-level rules, but not a new physics engine.

  **Tier D: Naive Group Selection**
  This concept is effectively discredited because it relies on teleological reasoning ("for the good of the species") without a mechanism to suppress within-group selfishness. It fails to do any load-bearing work because any scenario where it appears to function is better and more rigorously explained by Tier B (structured populations with high relatedness).
