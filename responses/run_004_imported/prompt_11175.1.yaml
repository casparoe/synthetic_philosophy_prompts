          1.  Individuality of the feeling transmitted.
          2.  Clarity of expression.
          3.  Sincerity of the artist (the most important).
      *   **Content Requirement (Christian Art):** True art must transmit feelings that unite people (brotherhood, love, compassion) aligned with the "religious consciousness of the age" (for Tolstoy, universal Christian ethics). Art that divides people or serves only the upper classes is "counterfeit" or "bad" art.
