          *   **Wagner:** He attended *Siegfried* and hated it. He considers opera (especially Wagner's) as counterfeit art, obscure, and exclusive to the elite.
          *   **Stowe (*Uncle Tom's Cabin*):** He praises this. He considers it an example of good Christian art because it transmits feelings of brotherhood and condemnation of slavery, accessible to all.
          *   **Folk Tales/Peasant Art:** He highly values simple, universal art that arises from the laboring classes and transmits universal feelings.

