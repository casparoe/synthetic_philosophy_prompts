answer: |-
  Your friend and that textbook are absolutely right. This is one of the most common "gotchas" in game theory, and it's a crucial distinction for anyone writing about AI agents that are supposed to be rational negotiators or strategists.

  Most pop-sci explanations stop at **Pure-Strategy Dominance** (e.g., "Strategy A always pays less than Strategy B"). But in rigorous game theory (and in serious multi-agent AI), we care about **Mixed-Strategy Dominance**.

  Here is the walkthrough of why pure comparisons fail, followed by the nuance regarding three players and rationalizability.

  ### Part 1: The "Hedging" Example (Why Pure Checks Fail)

  The intuition here is that a single strategy might be "safe" but mediocre, while a *mix* of two other strategies can "hedge" against the opponent to create a higher average payoff, even if neither of those two strategies wins on its own.

  Imagine a simple negotiation game between **You** (Row Player) and an **Opponent** (Column Player).
  *   **You** have three options: **Top**, **Middle**, **Bottom**.
  *   **Opponent** has two options: **Left**, **Right**.
  *   The numbers are your payoffs.

  | | Opponent: Left | Opponent: Right |
  | :--- | :---: | :---: |
  | **You: Top** | 3 | 0 |
  | **You: Middle** | 1 | 1 |
  | **You: Bottom** | 0 | 3 |

  **Step 1: The Pure-Strategy Check**
  To see if **Middle** is dominated by a pure strategy, we compare it row-by-row against **Top** and **Bottom**.
  *   **Is Top better than Middle?**
      *   If Opponent plays Left: Top (3) > Middle (1). **Yes.**
      *   If Opponent plays Right: Top (0) < Middle (1). **No.**
      *   *Result:* Top does not dominate Middle.
  *   **Is Bottom better than Middle?**
      *   If Opponent plays Left: Bottom (0) < Middle (1). **No.**
      *   If Opponent plays Right: Bottom (3) > Middle (1). **Yes.**
      *   *Result:* Bottom does not dominate Middle.

  If you stop here (like most explainers do), **Middle survives**. It looks like a reasonable "compromise" strategy.

  **Step 2: The Mixed-Strategy Check**
  Now, imagine you don't play Top or Bottom exclusively. Instead, you flip a coin: **50% Top, 50% Bottom**. Let's calculate the *expected* payoff of this mix against the Opponent's moves.

  *   **If Opponent plays Left:**
      *   50% chance you play Top (payoff 3) + 50% chance you play Bottom (payoff 0).
      *   Expected Payoff = $1.5$.
      *   Compare to Middle: $1.5 > 1$. **The Mix Wins.**
  *   **If Opponent plays Right:**
      *   50% chance you play Top (payoff 0) + 50% chance you play Bottom (payoff 3).
      *   Expected Payoff = $1.5$.
      *   Compare to Middle: $1.5 > 1$. **The Mix Wins.**

  **The Conclusion:**
  Even though no *single* strategy beats **Middle**, a *mixture* of strategies beats **Middle** in every possible scenario. Therefore, **Middle is strictly dominated** and should be eliminated. A rational AI should never play Middle, because it could instead randomize between Top and Bottom and guarantee a higher score regardless of what the opponent does.

  **Why this matters for your article:**
  In AI systems (like negotiation bots), checking for mixed-strategy dominance is computationally expensive. It requires solving a linear programming problem rather than just comparing numbers. Many "rational" agents actually skip this step for speed, meaning they might retain "Middle" strategies that are mathematically suboptimal.

  ---

  ### Part 2: Rationalizability and the 3+ Player "Correlation" Twist

  You heard correctly that this connects to **Rationalizability**, and that things get weird with three or more players.

  **The Connection:**
  Rationalizability asks: *"Can I tell a consistent story where this strategy is the best choice?"*
  *   If a strategy is dominated (even by a mix), there is **no belief** about the opponent that makes it a best choice. (As we saw above: no matter what you think the Opponent will do, the Mix is better than Middle).
  *   Therefore: **A strategy survives Iterated Elimination of Dominated Strategies (IEDS) if and only if it is Rationalizable.**

  **The 3+ Player Twist (Correlated vs. Independent Beliefs):**
  In a 2-player game, the "belief" is simple: What probability do I assign to my one opponent playing Left vs. Right?

  In a 3-player game (You, Player 2, Player 3), your belief is about the **joint action** of (Player 2, Player 3).
  *   **Scenario A (Correlated Beliefs):** You think Player 2 and Player 3 might be coordinating, or their randomness is linked. You assign probabilities to pairs: e.g., "There is a 50% chance they both play Aggressive, and 50% chance they both play Passive."
  *   **Scenario B (Independent Beliefs):** You assume Player 2 and Player 3 decide separately. You assign probabilities individually: "Player 2 plays Aggressive 50% of the time, and Player 3 plays Aggressive 50% of the time."

  **Why this changes elimination:**
  Mathematically, the set of **Correlated Beliefs** is larger than the set of **Independent Beliefs**. (Every independent belief is correlated, but not vice versa).

  *   **Rationalizability** says a strategy survives if it is a best response to *some* belief.
  *   Because the set of Correlated Beliefs is larger, it is **easier** to find a belief that justifies your strategy.
  *   Therefore, **more strategies survive** if you allow correlated beliefs.

  **The "Strange Thing":**
  The standard Iterated Elimination of Dominated Strategies (using mixed strategies) is mathematically equivalent to Rationalizability **only if you allow Correlated Beliefs**.

  If you force the AI to assume opponents act **Independently** (which is common in multi-agent reinforcement learning to save computation), you shrink the belief space. Suddenly, a strategy might *not* be dominated (so it survives IEDS), but it also *isn't* a best response to any independent belief (so it gets eliminated by Rationalizability).

  **For your draft:**
  You can frame it like this:
  > "In two-player games, 'rational' is a stable target. But in multi-agent systems with three or more parties, 'rationality' depends on whether agents assume their opponents are acting independently or if they suspect hidden correlations. If an AI assumes independence when correlations exist, it might eliminate strategies that are actually viable, or vice versa. This isn't just theoretical; in Diplomacy-style games, assuming other players aren't secretly coordinating is often the exact bug that gets an AI eliminated."

  ### Summary for your piece
  1.  **Pure vs. Mixed:** A strategy can look safe compared to individual options but be weak against a "hedged" mix of those options. (The Middle/Top/Bottom example).
  2.  **Rationalizability:** This is the "storytelling" equivalent of dominance. If a strategy is dominated by a mix, no story justifies playing it.
  3.  **Multi-Agent Nuance:** In 3+ player games, whether you assume opponents correlate their actions changes the math of which strategies are considered "rational."

  This distinction separates "toy model" AI from systems that actually need to handle the complexity of human-like negotiation and coalition building.
