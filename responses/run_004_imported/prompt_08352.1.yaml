          *   *Core:* Shared intention is a web of interlocking individual intentions.
          *   *Conditions:* (1) I intend that we J, (2) You intend that we J, (3) Meshing sub-plans, (4) Common knowledge, (5) Persistence/interdependence.
          *   *Normativity:* Derived from individual rationality (consistency, means-end coherence) and interpersonal reliance/expectations.
          *   *Ontology:* Individualist/Reductionist. No new entity (plural subject) is created.
      *   **Gilbert (Plural Subject Theory):**
          *   *Core:* Shared intention involves a "joint commitment."
          *   *Conditions:* Open expression of readiness to be jointly committed, common knowledge.
          *   *Normativity:* Sui generis obligation. To violate the commitment is to wrong the other party, not just be irrational or disappointing.
          *   *Ontology:* Non-reductionist. The "plural subject" is a distinct ontological category (though not necessarily mystical, it's irreducible).

  3.  **Analyze the Case (The Co-Authorship Scenario):**
      *   *Features:* Informal start (no explicit promise), work invested, feeling of *wronging* (not just disappointing) upon exit.
      *   *Bratman's Challenge:* Can the feeling of *obligation* (right to demand, wrong to violate) be reduced to individual expectations and rational pressure? Or is it just "disappointment" dressed up?
      *   *Gilbert's Strength:* Explains the *right* to rebuke. Joint commitment creates mutual obligations immediately upon formation.
      *   *Gilbert's Weakness:* Does it over-intellectualize informal interactions? Did they *really* jointly commit without explicit agreement?
      *   *Bratman's Strength:* Fits the gradual, informal nature of planning.
      *   *Bratman's Weakness:* Struggles to capture the *normative force* of the obligation (the "wronging" aspect).

  4.  **Determine the Verdict:**
      *   *Option A (Bratman):* Argue that complex interdependence + reliance creates a normative landscape sufficient for "obligation." (Harder to defend against the "wronging" intuition).
      *   *Option B (Gilbert):* Argue that the specific phenomenology of *being wronged* requires a joint commitment. (Stronger intuitive pull for the specific case described).
      *   *Decision:* I will argue for **Gilbert**. The prompt highlights the specific feeling that walking away would *wrong* the other, not merely disappoint. This is the classic "normative gap" Bratman struggles with. While Bratman can explain coordination, Gilbert better explains the *deontic* status of the relationship. I need to make sure I don't caricature Bratman, but show where his reductionism hits a wall regarding *mutual obligation*.

  5.  **Drafting - Section by Section:**

