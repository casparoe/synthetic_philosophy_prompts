      *   **Exposition of Bratman:** Focus on the interlocking intentions and the source of normativity (individual rationality + reliance).
      *   **Exposition of Gilbert:** Focus on joint commitment as the source of sui generis obligation.
      *   **The Crux (The Co-Authorship Case):** Apply both theories.
          *   *Bratman:* He sees reliance and expectations. If I quit, I frustrate your plans. But do I *wrong* you? Bratman says obligations arise from special conditions (like promises), but in informal cases, it's often just rationality.
          *   *Gilbert:* The moment you act as a unit (even informally), a joint commitment is in place. The obligation is intrinsic to the commitment.
      *   **Argument for Gilbert:** Why Bratman falls short. The "Right to Rebuke." Bratman's obligations are largely self-regarding (I should stick to my plan for *my* rationality) or based on harm/disappointment. Gilbert captures the *interpersonal* claim.
      *   **Counter-argument & Rebuttal:** Address the "Implicit Commitment" objection (Bratman might say the commitment is implied by actions). Rebut: Implied individual intentions don't generate mutual authority.
      *   **Conclusion:** Summarize. Affirm that social ontology needs to account for the normative texture of social life, which Gilbert does better here.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I being fair to Bratman? Bratman *does* talk about obligations in later work (e.g., *Shared Agency*). He acknowledges that shared intention can lead to obligations, often via reliance.
      *   *Correction:* I need to be precise. Bratman distinguishes between the *constitutive* norms of intention (consistency) and *moral* obligations. He argues shared intention *can* lead to moral obligations, but they aren't *constitutive* of shared intention itself. Gilbert argues the obligation *is* constitutive of the joint commitment.
      *   *Pivot:* The case describes a feeling of obligation arising *from the collaboration itself*, not necessarily an external moral principle about reliance. Gilbert explains this internal normativity better. The "wronging" is specific to the partnership.
      *   *Tone:* Keep it respectful but decisive. This is a graduate seminar paper.

  7.  **Final Polish:** Check terminology (sui generis, reductionism, interlocking intentions, common knowledge, right to rebuke). Ensure the verdict is clear. (The prompt asks for a verdict, not a fence-sit).

      *(Self-Correction on Verdict)*: Actually, a nuanced Gilbertian victory is best. Bratman explains the *coordination*, Gilbert explains the *normativity*. But since the prompt asks about the *obligation* specifically, Gilbert wins on that specific point. I will argue that while Bratman explains the *structure* of the agency, he cannot ground the *deontic power* felt in the case without smuggling in Gilbertian premises.

  8.  **Final Review against constraints:**
      *   Compare Bratman and Gilbert? Yes.
      *   Detailed enough? Yes.
      *   Explicit position on the case? Yes.
      *   Defend a verdict? Yes.

      *Let's write.*
answer: |-
  **Title:** The Normative Gap in Shared Agency: A Defense of Plural Subject Theory in the Co-Authorship Case

  **Introduction**

  The metaphysics of shared agency is often framed as a dispute over ontological parsimony: must we posit irreducible plural subjects to explain acting together, or can we exhaust the phenomenon through a complex web of individual attitudes? Michael Bratman's planning theory and Margaret Gilbert's plural subject theory represent the canonical poles of this debate. Bratman offers a reductionist account where shared intention is a mosaic of interlocking individual intentions; Gilbert offers a non-reductionist account where shared intention is constituted by a joint commitment.

  While both accounts successfully explain how coordination occurs, they diverge sharply on the normative texture of that coordination. This paper argues that in the specific case of the informal co-authorship scenario presented in seminar, Bratman's individualist framework fails to account for the specific *deontic* force the collaborators feel—specifically, the sense that abandoning the project would *wrong* the partner, rather than merely disappoint them. While Bratman can explain the rational pressure to continue, only Gilbert's appeal to joint commitment explains the mutual obligation and the correlative right to rebuke. Therefore, regarding the metaphysics of obligation within shared agency, Gilbert's apparatus does genuine explanatory work that cannot be replicated by adding complexity to individual psychology.

  **Bratman: Shared Intention as Interlocking Planning**

  For Bratman, shared intention is not a mental state of a group mind, but a relational state between individuals. In *Shared Agency*, he analyzes shared intention as a structure of interlocking and interdependent individual intentions. For us to intend to J together, I must intend that we J, you must intend that we J, and these intentions must be common knowledge between us. Crucially, our sub-plans must mesh, and each intention must be formed partly because of the other's.

  The normativity in Bratman's picture is primarily the normativity of individual rationality. If I intend that we J, I am rationally pressurized to do my part, consistent with my own planning agency. If I abandon the project without notice, I may be inconsistent, or I may frustrate your reliance on my stated intentions. Bratman acknowledges that obligations can arise in these contexts, but he typically locates them in the moral principles surrounding reliance and promise-keeping, rather than in the constitutive nature of shared intention itself. For Bratman, the "ought" of shared agency is largely hypothetical: *if* you want to be rational and supportive, *then* you should not abandon the plan. The obligation is external to the intention structure, mediated by general moral norms about harming or disappointing others who rely on you.

  **Gilbert: The Plural Subject and Joint Commitment**

  Gilbert rejects the idea that shared intention can be reduced to a conjunction of "I-intentions." She argues that when we act together, we form a "plural subject." The metaphysical glue of this subject is the *joint commitment*. A joint commitment is not the sum of two personal commitments; it is a single commitment to which both parties are bound. It is created when each openly expresses readiness to be jointly committed, and this is common knowledge.

  The crucial distinction lies in the normativity. For Gilbert, joint commitment creates *sui generis* obligations. These obligations are not derived from independent moral principles (like "do not harm") but are intrinsic to the commitment itself. To violate a joint commitment is not merely to be irrational or to cause disappointment; it is to *wrong* the other party. This generates a specific normative power: the right to rebuke. If I violate a joint commitment, you have the standing to demand an explanation or criticize me in a way you would not if I simply changed my mind about a personal project that happened to affect you. The obligation is relational and internal to the "we."

  **The Co-Authorship Case: Analyzing the Impasse**

  The case at hand involves two colleagues who begin co-authoring informally. There is no explicit promise. However, once work is invested, each feels that walking away unannounced would *wrong* the other.

  *The Bratmanian Interpretation:*
  My Bratman-inclined colleague argues that this sense of obligation can be captured by individual-level attitudes. As the collaboration proceeds, I form an intention that *we* write the paper. I know you intend this too. I know you are relying on me to do my section. If I quit, I frustrate your reliance and waste your effort. The "wrong" I feel is the anticipation of violating a moral duty regarding reliance or causing harm. The social ontology remains individualist; the normativity is the sum of my rational pressure to be consistent and my moral duty not to harm you.

  *The Gilbertian Interpretation:*
  My Gilbertian colleague argues that the moment the colleagues began acting as a unit (submitting to the idea of "our paper"), they entered a joint commitment. The obligation felt is not about harm or reliance per se, but about fidelity to the plural subject they constitute. Walking away unannounced is a violation of the commitment itself. The feeling of "wronging" is the phenomenological correlate of violating a joint obligation.

  **The Verdict: Why Bratman Falls Short on Normativity**

  While Bratman's account is superior at explaining the *mechanics* of coordination (how we mesh sub-plans), it lacks the resources to explain the *authority* the collaborators feel over one another. The crux of the disagreement is not whether the collaborators feel pressure, but the *source* and *type* of that pressure.

  Bratman's reductionism faces a "normative gap." In his framework, if I abandon the project, I am primarily answerable to *myself* for being inconsistent (a norm of individual rationality) and answerable to *you* under general moral laws regarding reliance. But the collaborators in the case describe a specific interpersonal obligation: *I owe it to you* to continue, not just because it's nice, or because I said I would, but because we are *in this together*.

  Consider the "Right to Rebuke." If I abandon the project, and you criticize me, on what grounds do you stand?
  1.  **On Bratman's view:** You criticize me because I caused you harm or wasted your time. But suppose I compensate you for your time, or suppose you are wealthy and the wasted time doesn't harm you. Have I still wronged you? Bratman struggles here. If the obligation is based on reliance/harm, removing the harm removes the wrong.
  2.  **On Gilbert's view:** You criticize me because I violated *our* commitment. Even if I compensate you, I have still violated the joint commitment. The wrong is the betrayal of the "we," not the material cost.

  In the co-authorship case, the intuition is that even if the remaining colleague suffers no material harm (perhaps they finish it alone easily), the act of walking away *unannounced* is still a breach of the partnership. It treats the joint activity as a collection of individual activities rather than a unified endeavor. Bratman's framework treats the collaboration as a coincidence of individual goals that happen to overlap. Gilbert's framework treats it as a new normative entity.

  The Bratmanian might object: "Surely the obligation arises from the *implicit* promise involved in starting the work." But this smuggles in Gilbertian premises. Why does starting the work count as a promise? Only if there is a background convention that such actions create binding commitments. Gilbert argues that the binding nature comes from the joint commitment itself, which is the fundamental social act. Bratman tries to derive the binding nature from the individual intentions plus external moral norms. But the phenomenology of the case suggests the obligation is *internal* to the collaboration. The colleagues feel bound *qua* co-authors, not *qua* moral agents generally.

  Furthermore, Bratman's account risks making the obligation too weak. If shared intention is just interlocking individual intentions, then if I change my individual intention, the shared intention dissolves. I am free to go, provided I update my attitudes. Gilbert explains why I am *not* free to go unilaterally. A joint commitment can only be rescinded jointly. This matches the intuition in the case: one cannot simply decide to stop; one must negotiate an exit with the partner. This "unilateral unbindability" is a hallmark of joint commitment that Bratman's individualist intentions cannot replicate without ad hoc additions.

  **Conclusion**

  The dispute between my colleagues is not merely terminological; it is about the metaphysical grounding of social norms. Bratman provides a robust account of how we coordinate our behavior through shared plans, grounding social ontology in the safe harbor of individual psychology. However, in doing so, he flattens the normative landscape. He can explain why I *should* continue (rationality, reliance), but he cannot fully explain why I *owe it to you* to continue in the specific sense of being subject to your authority as a partner.

  In the co-authorship case, the feeling of obligation is not merely the fear of disappointing another individual; it is the recognition of a bond that transcends individual wills. Gilbert's plural subject theory captures this by positing that in acting together, we create a new center of normative gravity. The obligation is not an add-on to our individual psychologies; it is the constitutive feature of our joint agency. Therefore, while Bratman explains the *structure* of the collaboration, Gilbert explains its *bond*. Since the case turns on the nature of the obligation (the feeling of wronging), Gilbert's appeal to joint commitment does genuine explanatory work that no configuration of individual attitudes can replicate. To reduce the "we" to a set of "I's" is to lose the very thing that makes the collaboration a matter of obligation rather than mere convenience.
