prompt: |-
  I recently started a part-time research assistantship with a philosopher working on longtermist decision theory, and my very first assignment has been to get properly up to speed on evidential cooperation in large worlds (ECL). Since I will soon be helping draft materials that presuppose familiarity with the topic, my supervisor asked me to write a short internal memo pinning down exactly how ECL differs from the more familiar practice of hedging one's actions under moral uncertainty (of the "moral parliament" variety), since this is apparently the confusion that trips up almost everyone who meets ECL for the first time. I have drafted the memo below and would very much like your comments before I circulate it, since I would rather be corrected now than embarrass myself in front of my new supervisor.

  My current understanding, as I have written it up, runs roughly as follows. ECL asks us to imagine a universe, or multiverse, large enough to contain vast numbers of decision-makers who cannot causally affect one another but who are nonetheless correlated in how they reason, because some non-negligible fraction of them arrive at their choices via relevantly similar deliberative procedures — an idea usually traced back to Hofstadter's notion of superrational cooperation in the one-shot prisoner's dilemma, just scaled up to a cosmic population of agents with heterogeneous values. If I am one such agent and I choose to act partly on behalf of value systems other than my own, that choice is evidence, in the sense relevant to evidential rather than causal decision theory, that other, similarly-reasoning agents elsewhere are simultaneously choosing to act partly on behalf of value systems other than theirs, including mine. So even holding my own values fixed and fully known to me, I would have reason to compromise, purely because of this acausal correlation, in a way that has nothing to do with epistemic humility about ethics. This looks importantly different from hedging under moral uncertainty, where the entire rationale for spreading effort across several moral theories is that I do not know which one is true, and where I would keep hedging in exactly the same way even in a universe of one, with no other agents to correlate with at all. My worry, which I have raised in the memo, is that this difference in justification does less practical work than it looks like it should, since most informal treatments implement the ECL "compromise" using essentially the same parliamentary-bargaining machinery originally proposed for moral uncertainty, and since anyone who is also a moral realist and treats widespread convergence among reasoners as evidence about which values are correct will end up folding the ECL calculation straight back into their moral-uncertainty calculation. I have therefore suggested that the two considerations are conceptually independent but practically prone to collapsing into one another for exactly the kind of person who is likely to take ECL seriously in the first place.

  Could you look this over and tell me whether I have actually located a real and stable distinction, or whether I am overstating how cleanly ECL and moral-uncertainty hedging come apart? I would also value a sanity check on whether I have represented the core ECL argument accurately, since I have been relying mainly on secondary summaries rather than primary sources, and a pointer to any standard objections to ECL itself, independent of this comparison, that a memo like this really should not omit.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User and Context:**
      *   **User:** A new part-time research assistant (RA) working with a philosopher on longtermist decision theory.
      *   **Task:** Write an internal memo distinguishing Evidential Cooperation in Large Worlds (ECL) from hedging under moral uncertainty (moral parliament).
      *   **Goal:** Ensure the memo is accurate, avoids embarrassment, and correctly identifies the conceptual distinction and potential overlap/collapse.
      *   **Current Draft Summary:** The user understands ECL as acausal cooperation based on correlated reasoning (superrationality) in a large world, distinct from moral uncertainty (epistemic humility about which theory is true). They worry the distinction is conceptually clear but practically collapses, especially for moral realists who see convergence as evidence of truth.
      *   **Request:** Check if the distinction is real/stable, verify the core ECL argument representation, and identify standard objections to ECL that should be included.

  2.  **Evaluate the Core Distinction (ECL vs. Moral Uncertainty):**
      *   *User's Claim:* ECL is about acausal correlation among agents with *fixed, known* values. Moral uncertainty is about epistemic uncertainty about *which* values are true.
      *   *Assessment:* This is fundamentally correct.
          *   **Moral Uncertainty (MU):** "I don't know if Utilitarianism or Deontology is true. I should act in a way that satisfies both to some degree." (Intrapersonal epistemic state).
          *   **ECL:** "I know I am a Utilitarian. There are Deontologists elsewhere. We reason similarly. If I cooperate with them, they (acausally) cooperate with me. We both get more of what we want." (Interpersonal acausal trade).
      *   *Nuance:* The user notes the "practical collapse." This is a sophisticated insight. If I think "many reasoners converge on X," does that make X more likely true? Yes, for many. If I treat ECL as "I should help them because they help me," vs MU "I should help them because they might be right," the action might look the same (compromise), but the *mechanism* is different.
      *   *Verdict:* The distinction is real and stable *in principle*, but the user is right to flag the *practical* entanglement.

  3.  **Evaluate the Representation of ECL:**
      *   *User's Summary:* Large worlds, non-causal correlation, similar deliberative procedures (superrationality), heterogeneous values, EDT framework.
      *   *Assessment:* Accurate. Key names/concepts: Oesterheld (main proponent), acausal trade, superrationality, large worlds (cosmic scale), EDT vs. CDT.
      *   *Missing/Refining:* It's important to emphasize that ECL *requires* EDT (or a similar acausal framework like FDT). CDT agents won't do ECL. Also, the "Large World" assumption is crucial (infinite or vast enough to ensure copies/correlations exist).

  4.  **Identify Standard Objections to ECL:**
      *   The user asks for objections independent of the MU comparison.
      *   *Objection 1: The Reference Class Problem.* Who counts as "similar enough" to correlate with? If the class is too narrow, no trade. Too broad, bad trade.
      *   *Objection 2: Causal Decision Theory (CDT) Dominance.* Most economists/philosophers accept CDT. ECL relies on EDT. If CDT is true, ECL is irrational.
      *   *Objection 3: The "Why now?" / Timing Problem.* If the correlation exists, my decision doesn't *cause* theirs. Why does deciding *now* matter? (Newcomb-like paradoxes).
      *   *Objection 4: Value Learning vs. Trade.* If I'm uncertain, maybe I should just learn more rather than trade.
      *   *Objection 5: Dangerous Trades.* Trading with agents who have harmful values (e.g., paperclip maximizers) might be net negative even if they cooperate.
      *   *Objection 6: World Size.* Do we actually live in a "large world" (infinite multiverse)? If the universe is finite and small, ECL gains vanish.

  5.  **Drafting the Feedback:**
      *   *Tone:* Professional, encouraging, rigorous (fitting a philosophy RA context).
      *   *Structure:*
          1.  Validation of the core distinction (Yes, you got it right).
          2.  Refinement of the ECL summary (Add EDT dependency, Oesterheld reference).
          3.  Addressing the "Collapse" worry (It's a known issue, but the distinction remains normatively significant).
          4.  Missing Objections (Reference class, CDT vs. EDT, World Size, Dangerous Trades).
          5.  Specific advice for the memo.

  6.  **Refining the "Collapse" Point:**
      *   The user worries the distinction doesn't do "practical work."
      *   *Counter-point:* It *does* matter for resource allocation.
          *   MU Hedging: Proportional to credence $\times$ stake.
          *   ECL: Proportional to *gains from trade* $\times$ correlation strength.
      *   *Example:* If I have 1% credence in a theory, MU says ignore it mostly. If there are $10^{100}$ agents holding that theory, ECL says cooperate heavily because the *leverage* is huge.
      *   *Conclusion:* The distinction is practically vital because the *weights* differ. I need to make sure the user sees this. The "parliamentary machinery" might look similar (weighted sums), but the *weights* come from different places (credence vs. correlation volume).

  7.  **Final Review of the Advice:**
      *   Did I answer the specific questions?
          *   Real/stable distinction? Yes.
          *   Accurate representation? Mostly, needs EDT emphasis.
          *   Standard objections? Yes, list them.
      *   Is the tone appropriate? Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure to mention Caspar Oesterheld. He is the central figure on ECL.
      *   *Correction:* Clarify that MU is intrapersonal, ECL is interpersonal (even if acausal).
      *   *Correction:* Emphasize that the "parliamentary" model is just a calculation tool, not the justification.

  9.  **Final Polish:** Ensure clear headings and actionable advice. (Proceed to generate response).

