      *   **Move (4) Dana:** Currencies were also imposed (conquest, colonial tax, state violence). "Agreed vs. Imposed" doesn't separate them.
          *   *Analysis:* Historically accurate. Colonial currencies were forced upon populations to create labor markets (taxes payable only in colonial currency). This mirrors racial categorization for labor exploitation.
