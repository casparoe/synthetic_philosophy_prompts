      *   *Scenario B: Physical Truth.* If non-Euclidean geometry claims to describe actual space, Hobbes would demand to see the *motion* that generates it. Can you physically construct a triangle with 180+ degrees? If not, is it just a fantasy?
      *   *The "Maker's Knowledge" Defense:* Hobbes's core claim is about *certainty*, not necessarily empirical adequacy. We know the consequences of our definitions. So, if we define space as curved, the deductions are certain. *However*, Hobbes believed Euclidean geometry was the *only* way to reason about magnitude correctly. He was notoriously dogmatic.
      *   *The Weakness:* Hobbes conflates *logical certainty* (if A then B) with *ontological truth* (A is how the world is). Non-Euclidean geometry separates these. Hobbes thought they were the same because he thought our constructions mirrored the fundamental kinematics of the universe.

