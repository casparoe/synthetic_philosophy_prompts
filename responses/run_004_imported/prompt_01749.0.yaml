      *   *If Hobbes says "We construct the definitions":* Then non-Euclidean geometry shouldn't bother him. We can define parallel lines differently. As long as the deduction follows from the construction, it's certain.
      *   *If Hobbes says "Geometry describes physical space":* Then non-Euclidean geometry creates a problem. Which one is the "true" motion of bodies?
      *   *Hobbes's Materialism:* For Hobbes, geometry *is* physics (kinematics). A line *is* the track of a moving point. Space is real (or at least phantasm of real thing). He isn't a formalist (math as symbol manipulation). He thinks math describes the motion of bodies.

  4.  **Synthesize: How would Hobbes react?**
