prompt: |-
  I'm a philosophy PhD student, and I've been asked to give the toast at the wedding of a close friend and fellow student, Priya, next month. I'm currently taking a seminar on moral psychology that has spent the last few weeks on the situationist critique of virtue ethics — the argument, associated above all with Gilbert Harman and John Doris (whose book on the subject is bluntly titled Lack of Character), that behavior is far more sensitive to minor, morally irrelevant situational cues, and far less predictable from broad character traits like honesty, courage, or compassion, than folk psychology and traditional virtue ethics tend to assume. We've been reading some of the less overexposed evidence for this, such as Hartshorne and May's old studies showing how weakly children's honesty generalized across superficially similar tests, and Isen and Levin's experiment in which finding a dime in a phone booth made passersby dramatically more likely to help a stranger pick up a dropped stack of papers. Priya's dissertation defends virtue ethics against exactly this critique, in the spirit of writers like Kamtekar and Sreenivasan, who argue that the evidence refutes only a crude, global picture of character traits and leaves plenty of room for traits that are local and cue-sensitive, bound up with the kind of situational perceptiveness Aristotle called practical wisdom. She has told me, only half-joking, that if anyone at her wedding stands up and praises her as "the same generous person in every situation, no matter what," she will privately count it as grounds for a second dissertation chapter.

  Roughly half the guests will be philosophers — her committee, our cohort — who will know exactly what's at stake if I get this wrong; the rest are family and friends who have never heard of the fundamental attribution error and shouldn't have to learn about it at a wedding. Could you write me a five-minute toast for Priya that praises her character in terms a situationist-informed virtue ethicist could actually endorse, rather than one that quietly commits the naive cross-situational generalization her own work is devoted to criticizing? I'd like the philosophical point to genuinely constrain what the toast can and can't say, rather than just decorating a joke, while still landing, for the non-philosophers in the room, as a toast and not a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Philosophy PhD student.
      *   **Occasion:** Wedding toast for a close friend and fellow student, Priya.
      *   **Audience:** 50% philosophers (know the situationist critique, Priya's dissertation topic), 50% non-philosophers (family/friends, need a normal toast).
      *   **Key Constraint:** The toast must praise Priya's character *without* committing the "naive cross-situational generalization" criticized by situationists (Harman, Doris). It must align with Priya's own dissertation defense (virtue ethics via Kamtekar/Sreenivasan: local traits, practical wisdom/phronesis, situational perceptiveness).
      *   **Tone:** Warm, celebratory, intellectually precise (for the philosophers), accessible (for the family), not a lecture, but philosophically constrained.
      *   **Specific Prohibition:** Do *not* say she is "the same generous person in every situation, no matter what."
      *   **Length:** Roughly 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Content:**
      *   *Situationist Critique:* Behavior is driven by situational cues (dime in phone booth), not global traits (honesty). Global traits don't exist or don't predict behavior well.
      *   *Priya's Defense (Virtue Ethics):* Traits aren't global; they are local and sensitive to context. Virtue involves *phronesis* (practical wisdom) – knowing *when* and *how* to act in specific situations. It's about responsiveness to reasons and context, not robotic consistency.
      *   *The Toast's Task:* Praise Priya not for being "always good," but for being *attuned* to what is good in specific contexts, especially in her relationship. Avoid "She is always kind." Instead: "She knows when kindness is needed and how to deliver it."

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the occasion, the honor, and the mixed audience. Set a warm tone.
      *   **The "Philosophical Hook" (Subtle):** Introduce the idea of character without using jargon immediately. Acknowledge the difficulty of knowing someone fully.
      *   **The Situationist Nod (For the Philosophers):** Briefly allude to the debate without naming Harman/Doris explicitly (or maybe just a light touch). Acknowledge that life is messy and situations matter.
      *   **The Virtue Ethics Pivot (Priya's View):** Shift to *phronesis*. Praise her perceptiveness. She doesn't just act; she *sees* what is required.
      *   **Application to the Couple/Relationship:** Marriage is a series of specific situations, not a global state. Her virtue lies in navigating *those* situations with her partner.
      *   **Closing:** A wish for the future. Not "happiness forever," but "wisdom in the moments."

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm a friend. Priya studies virtue. Some people say virtue isn't real because of phone booths and dimes. Priya says that's wrong. She says virtue is about knowing what to do. I've seen her do this. She knows when to talk and when to listen. That's why she'll be a good wife. Let's drink to specific moments of joy.

      *Critique 1:* Too dry. Needs more emotion. The philosophical part needs to be woven in, not stated as a syllabus summary.

  5.  **Drafting - Iteration 2 (Refining the Tone):**
      Start with the idea of "knowing" someone. We think we know people, but psychology says situations change us. Priya knows this better than anyone. Her work says character isn't a stone; it's a skill. I've seen her use this skill. Not by being perfect, but by being present. To the non-philosophers: she's a good friend. To the philosophers: she avoids the fundamental attribution error. To the couple: May you have practical wisdom.

      *Critique 2:* Better. But need to ensure I don't accidentally say "She is consistently kind." I need to phrase it as "She consistently *recognizes* the call for kindness."

  6.  **Drafting - Iteration 3 (Polishing and Timing):**
      *   *Opening:* Warm welcome.
      *   *The "Trap":* Joke about the difficulty of giving a toast when the bride is an expert on character assessment.
      *   *The Core:* Describe her character not as a fixed trait but as a dynamic responsiveness. Use examples (listening, supporting) that imply situational awareness.
      *   *The Partner:* Acknowledge that marriage creates *new* situations.
      *   *The Toast:* Raise a glass to "particulars."

  7.  **Writing the Content (incorporating constraints):**
      *   *Avoid:* "Always," "Never," "No matter what," "Global trait," "Innate."
      *   *Include:* "Attention," "Response," "Context," "Wisdom," "Moments."
      *   *Philosophical Easter Eggs:* Mention "dimes," "phone booths," or "practical wisdom" lightly so the PhDs catch it but others hear poetry.
      *   *Priya's specific instruction:* Do not say she's the same in every situation.

      *(Self-Correction during drafting)*: I need to make sure the non-philosophers don't feel lost. If I say "phronesis," I need to define it poetically. "The wisdom to know what this moment requires."

      *(Refining the Situationist reference)*: Don't lecture on Hartshorne and May. Just acknowledge that life is unpredictable. "We know that life throws us curveballs..."

      *(Refining the Praise)*: Instead of "She is honest," say "She has a keen eye for when the truth is needed and how to speak it."

  8.  **Final Review against Constraints:**
      *   5 minutes? (Word count check: ~800 words is usually safe for 5 mins with pauses).
      *   Philosophically accurate to Priya's view? (Yes, focuses on local traits/phronesis).
      *   Accessible? (Yes, jargon is minimized or explained).
      *   Emotional resonance? (Needs to feel like love, not a peer review).

  9.  **Final Polish:** Check the rhythm. Ensure the transition from philosophy to emotion is smooth. (The resulting draft in the main response follows this structure.)

  **(Post-Drafting Check):** Does it mention the "dime"? Maybe too specific. Let's stick to "small shifts in context." Does it mention "Lack of Character"? No, too negative for a wedding. Focus on the *presence* of wisdom.

  *Key phrase to include:* "Not a fixed point, but a compass."
  *Key phrase to avoid:* "She never changes."

