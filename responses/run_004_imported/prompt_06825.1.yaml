answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Priya's from the department. And for those who *do* know me, you know that standing up to speak about character in front of Priya is a uniquely high-stakes endeavor.

  Priya has spent the last several years writing a dissertation on the nature of virtue. Specifically, she's been arguing against the idea that character is a rigid, global thing—that we are simply "honest people" or "kind people" in every context, regardless of what's happening around us. She argues, quite convincingly, that true virtue isn't about robotic consistency. It's about perceptiveness. It's the capacity to notice what *this* specific moment requires, and to respond to it with care.

  So, I have been warned: if I stand here and tell you that Priya is "the same wonderful person in every situation, no matter what," I am not just giving a bad toast. I am falsifying her data. And I value my friendship too much to invite that kind of peer review.

  But here is what I can say, and what I have seen.

  I have seen Priya navigate the messy, unpredictable situations of life—not by ignoring them, or by pretending she has all the answers, but by paying attention. There is a distinct quality to her friendship. It isn't that she offers the same advice to everyone, or that she is relentlessly cheerful when the world is difficult. It's that she seems to know, with remarkable clarity, when a friend needs a distraction, when they need a listening ear, and when they need someone to gently tell them the truth they're avoiding.

  In the literature, this is sometimes called *phronesis*, or practical wisdom. But in the context of a friendship, or a marriage, it looks something else. It looks like showing up. Not just showing up physically, but showing up *accurately*. It is the ability to read the room, to read a partner, to read the subtle cues that tell you what is needed right now, and to have the courage to provide it.

  We know, from psychology and from life, that situations are powerful. Stress, fatigue, luck, and chance can shift our behavior in ways we don't always control. We are all sensitive to the context we're in. But Priya's gift—and the reason she is such a profound friend to so many of us—is that she doesn't let the situation dictate her values. She lets her values guide her *through* the situation.

  She understands that being a good person isn't a status you achieve and keep in your pocket like a dime found in a phone booth. It's a practice. It's a continuous, dynamic engagement with the world.

  And that is why I am so confident in celebrating this marriage. Because a marriage is not a single, global state of "happiness." It is a long series of specific, local moments. Some of them will be easy; some will be morally complex; some will be tired and mundane. A marriage doesn't need two people who are incapable of having a bad day. It needs two people who have the practical wisdom to recognize what a bad day requires. It needs people who can look at a difficult situation and ask, "What does love look like *here*? What does patience look like *now*?"

  Priya has spent her academic career defending the idea that character is real, not because it is unchanging, but because it is responsive. And I can think of no better preparation for a life partnership than that.

  So, to the non-philosophers in the room: Priya is one of the most attentive, thoughtful, and caring people you will ever meet.
  And to the philosophers: She possesses the local, cue-sensitive traits of character that sustain a life well-lived, and she has the practical wisdom to apply them where they matter most.

  Priya and [Partner's Name], may your life together be filled not with a vague, global promise of perfection, but with the specific, situational wisdom to find the good in whatever moments come your way. May you always know what this day requires, and may you always have the strength to give it to each other.

  To Priya and [Partner's Name].
