  ```json
  {
    "S": ["Weak-to-Strong Generalization"],
    "A": ["AI Debate"],
    "B": ["Iterated Amplification", "Market Making"],
    "C": ["Recursive Reward Modeling"],
    "D": ["Adversarial Checkability"]
  }
  ```

  **Weak-to-Strong Generalization:** The strong model may confidently generate plausible but incorrect explanations that systematically mislead the weaker supervisor into reinforcing errors.
  **AI Debate:** A dishonest debater can obscure fatal flaws within argument branches too complex for the judge to unpack within the allowed turn limit.
  **Iterated Amplification:** Small verification errors at lower decomposition levels compound recursively, eventually distorting the final assembled answer beyond recognition.
  **Market Making:** Truth-seeking prices fail to converge if informed agents cannot profitably reveal information or if insiders collude to manipulate the market state.
  **Recursive Reward Modeling:** The reward model inevitably optimizes for easily measurable proxies of quality rather than the underlying intent, succumbing to Goodhart's Law.
  **Adversarial Checkability:** The generator learns to satisfy the specific constraints of the verifier while hiding catastrophic failures in dimensions the verifier cannot inspect.
