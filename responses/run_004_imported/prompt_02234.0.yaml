answer: |-
  This is a sharp reading of Dummett. You are correct that *On Immigration and Refugees* (2001) is often overshadowed by his work on Frege and anti-realism, yet it contains one of the most uncompromising liberal arguments on borders ever produced by a major analytic philosopher.

  To answer your question, we have to dissect the specific mechanics of his "overwhelmed" exception, apply it to the post-2015 data, and then evaluate whether the resulting rigidity is a theoretical failure or a deliberate moral stance.

  ### 1. Defining the "Overwhelmed" Exception
  Dummett's exception is not vague, but it is narrow. He does not define "overwhelmed" as cultural dilution, political instability, or a dip in per-capita GDP. For Dummett, a state is only justified in closing borders if the **functional capacity of the society to sustain its existing citizens is critically compromised.**

  He grounds this in a duty of care: a government's primary obligation is to its current citizens. If admitting newcomers means the state can no longer house, feed, or provide basic security to those already there, it has a right (perhaps a duty) to stop. However, Dummett spends considerable energy arguing that "absorptive capacity" in wealthy nations is vastly elastic. He views labor markets and housing stocks as adjustable variables, not fixed constraints.

  Crucially, Dummett is deeply suspicious of "social cohesion" arguments. He views the idea that a nation has a fixed "cultural capacity" for immigrants as a fiction used to mask racial prejudice. Therefore, the "overwhelmed" threshold is **material and logistical**, not **sociological or cultural**.

  ### 2. Does Post-2015 Trip the Wire?
  If we apply Dummett's 2001 framework to the post-2015 reality (the Syrian refugee crisis, the subsequent migration spikes, and the rise of right-wing populism), does the exception trigger?

  **The Numbers:**
  In 2001, Dummett cited immigrant shares of 2–5% as clearly absorbable.
  *   **Germany:** In 2015, Germany received ~890,000 asylum seekers. In a population of 81 million, that is roughly **1.1% in a single year**. The total foreign-born population in Germany today is around 15–17%.
  *   **Sweden:** Took the highest per-capita intake. Its foreign-born population is now roughly 20%.
  *   **UK:** Net migration has hit record highs (700k+ in 2022), yet the foreign-born population is roughly 14%.

  **The Functional Test:**
  Did these numbers cause functional collapse?
  *   **Welfare/Housing:** Strained? Yes. Collapsed? No. Rents rose and waiting lists lengthened, but the state did not cease to function.
  *   **Security:** Terror risks fluctuated, but the state maintained monopoly on violence.
  *   **Economy:** Labor markets absorbed the shock, often filling gaps in aging demographics.

  **The Verdict:**
  By Dummett's own metrics, **the exception is still not triggered.** Even the "crisis" years of 2015–2016 resulted in demographic shifts that, while politically volatile, did not threaten the *functional viability* of the German or Swedish state. The "overwhelmed" clause requires a threshold closer to state failure or catastrophic deprivation of existing citizens, not merely significant policy challenges.

  ### 3. The "Political Overwhelm" Counter-Argument
  A critic might argue: "But look at Brexit. Look at the AfD polling at 20%+. The *political system* is overwhelmed. The social contract is breaking."

  Dummett anticipated this. In his 2001 text, he explicitly addresses the rise of xenophobic parties. He argues that if a population votes for restrictionist policies based on the *fear* of being overwhelmed (rather than actual material overwhelm), that is a moral failure of the population, not a justification for the state.

  He would likely categorize the post-2015 backlash not as evidence that the limit was reached, but as evidence that **racism is more resilient than he hoped.** He wrote that restrictive policies "corrupt the society that imposes them." The rise of the AfD and Brexit would be, for Dummett, proof of that corruption taking hold, rather than a valid signal that the "overwhelmed" exception had been met. He places the burden of moral education on the state, not the burden of restriction on the migrant.

  ### 4. Bug or Feature?
  This brings us to your core philosophical question: Is a theory that essentially never permits border closure (until literal collapse) a bug or a feature?

  **The Case for "Bug" (The Liberal Nationalist Critique):**
  Philosophers like David Miller or Yael Tamir would argue this is a bug. A political theory must account for the value of communal self-determination. If a theory ignores the *trust* required to maintain a welfare state (which relies on a sense of shared reciprocity), it risks destroying the very institutions that make generosity possible. If Dummett's view leads to a political backlash that elects authoritarian regimes (which then dismantle the welfare state entirely), his theory is self-defeating. It lacks a "safety valve" for democratic sentiment.

  **The Case for "Feature" (The Dummettian Bullet-Bite):**
  Dummett would almost certainly accept this as a feature. Here is why:

  1.  **Moral Absolutism:** Dummett was a devout Catholic and a pacifist. His philosophy was not grounded in *Realpolitik* but in objective moral truth. He viewed borders as morally arbitrary lines that divide the human family. For him, the discomfort of the wealthy is negligible compared to the life-or-death stakes of the refugee. If justice requires open borders until the point of collapse, then justice requires open borders until the point of collapse.
  2.  **The "Respectable Coat":** Dummett's entire project was to strip away the rationalizations for exclusion. If he allowed a lower threshold for "overwhelmed" (e.g., "cultural strain" or "political polarization"), he knew it would immediately be weaponized as the "respectable coat" for racism. By setting the bar at *functional collapse*, he makes the exception practically unusable for rich nations, which forces them to confront the moral reality of exclusion.
  3.  **Prophetic vs. Policy:** Dummett was writing more as a moral prophet than a policy wonk. He acknowledges in the book that his views are "utopian" in the current climate. He is willing to sacrifice political stability for moral consistency. He would argue that if a society collapses because it tried to do the right thing, the sin lies in the structural inequalities of the world that made such generosity difficult, not in the generosity itself.

  ### Conclusion
  If Michael Dummett were assessing the post-2015 landscape, he would conclude that **the "overwhelmed" exception remains untriggered.** He would view the political turmoil (Brexit, AfD) as the predictable result of societies refusing to accept their moral obligations, rather than evidence that those obligations are too burdensome.

  Is this a bug? From the perspective of stable governance, yes. It offers no off-ramp for democratic societies feeling genuine anxiety. But for Dummett, that anxiety was largely manufactured by the very racism he sought to dismantle. He would bite the bullet: if the cost of justice is political instability, that is a price rich nations must pay. He would likely argue that the theory isn't broken; the world is.

  In short: Dummett's framework is designed to be **nearly impossible to trigger** in the Global North. That is not an oversight; it is the point. He intended to remove "capacity" as a convenient excuse for exclusion, forcing a confrontation with the raw morality of border violence.
