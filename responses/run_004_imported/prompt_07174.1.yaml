          *   ZFC is *not* categorical. Even with second-order logic, the height of the cumulative hierarchy is not fixed. There is no single agreed-upon "standard model" $V$ in the same way there is for $\mathbb{N}$.
      *   **Key Distinction 2: The Nature of the Independence.**
          *   Gödel's Incompleteness: The sentence $G$ is true in *all* standard models of arithmetic (because it asserts its own unprovability, and we can see from the outside that it is unprovable, hence true). The truth is secured by the soundness of the system regarding $\mathbb{N}$.
