      *   **The Puzzle:** The seminar and literature treat the truth value of CH as an open philosophical question (multiverse vs. universism), not a settled Platonist fact.
      *   **The Question:** Why isn't the dispute settled in favor of Platonism? If the analogy holds, why the difference? If it doesn't hold, where does it break down? Specifically, what does Gödel's theorem give us about $\mathbb{N}$ that Gödel-Cohen doesn't give us about $V$?

  2.  **Deconstruct the Mathematical/Philosophical Issue:**
