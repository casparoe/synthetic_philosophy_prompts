answer: |-
  ### Scenario: The Case of the Therapeutic Admiration

  **The Scenario**
  Imagine an agent, let's call him Alex, who suffers from a debilitating psychological condition: pathological cynicism. This condition prevents Alex from experiencing any positive engagement with the world, causing him severe distress and isolation. A team of psychologists discovers that the only effective cure for Alex's condition is the cultivation of genuine admiration for a specific object. The treatment requires that Alex actually *feel* admiration, not merely pretend or desire to feel it.

  For the purpose of the therapy, the psychologists select a completely mundane object: a mass-produced, grey plastic chair. The chair possesses no aesthetic merit, no historical significance, no craftsmanship, and no unique features. It is, by all objective standards, unadmirable. However, due to the specific neuro-psychological mechanisms of Alex's condition, successfully generating genuine admiration for *this specific chair* will reset his emotional baseline and cure his cynicism.

  Consequently, Alex has a very strong, decisive reason to admire the chair: doing so is necessary for his mental health and overall well-being.

  **Why This Poses the Wrong Kind of Reasons Problem**
  Fitting-Attitude (FA) analyses generally propose that for an object $X$ to be valuable (or admirable), it is necessary and sufficient that there are reasons to have a pro-attitude (like admiration) toward $X$. In this scenario, there is clearly a reason to admire the chair (therapeutic necessity). If the FA analysis counts *any* reason to admire as constitutive of value, it forces the conclusion that the plastic chair is admirable. This is counterintuitive; the chair remains a mundane object regardless of Alex's psychological needs.

  **Precise Explanation of the Distinction (Right Kind vs. Wrong Kind)**
  To explain precisely why the therapeutic reason is of the *wrong kind*, we must distinguish between **Object-Given Reasons** (Right Kind) and **State-Given Reasons** (Wrong Kind).

  1.  **Target of the Reason (Object vs. State):**
      *   **Right Kind (Object-Given):** A reason of the right kind cites properties of the *object* of the attitude. For admiration, these would be properties like excellence, virtue, beauty, or skill. These properties make the attitude *fitting* or *correct*. In the scenario, the chair lacks these properties.
      *   **Wrong Kind (State-Given):** The therapeutic reason cites a property of the *state of having the attitude*. It points out that *being in the state of admiring* is beneficial for Alex. It does not point to anything about the chair itself. The reason makes the attitude *prudentially good to have*, but it does not make the attitude *fitting*.

  2.  **Direction of Fit:**
      *   **Right Kind:** These reasons support a "mind-to-world" direction of fit. The attitude is supposed to track the value of the object. If the object isn't valuable, the attitude is incorrect (unfitting).
      *   **Wrong Kind:** These reasons support a "world-to-mind" direction of fit. They suggest the agent should bring their mind into a state that produces good consequences, regardless of whether the world (the object) warrants it.

  3.  **Constitutive vs. Consequential:**
      *   **Right Kind:** Reasons of the right kind are constitutive of the attitude's correctness conditions. You cannot separate "being admirable" from "there being object-given reasons to admire."
      *   **Wrong Kind:** The therapeutic reason is merely consequential. It is an external benefit that flows from holding the attitude. If we allowed consequential reasons to determine value, *any* object could be made valuable simply by attaching a sufficient benefit to the attitude toward it (e.g., "Admire this mud and you will be healthy"). This severs the conceptual link between *value* and *merit*.

  **Conclusion**
  The therapeutic reason is of the wrong kind because it justifies the *utility* of the attitude, not its *fittingness*. An FA analysis that fails to exclude such state-given reasons collapses the distinction between an object being *good* and an attitude toward an object being *beneficial*. Therefore, to preserve the intuition that the plastic chair is not actually admirable, the FA analyst must restrict the analysis to reasons of the right kind (object-given reasons), excluding the therapeutic reason despite its normative force.
