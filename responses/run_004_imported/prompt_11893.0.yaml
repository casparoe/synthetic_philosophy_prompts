answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Patient M. and Proposal for Self-Binding Directive Protocol

  ### I. Executive Summary & Immediate Recommendation

  Patient M. presents a conflict between her *past competent autonomy* (expressed via a Psychiatric Advance Directive with a Ulysses clause) and her *present expressed autonomy* (refusal of treatment while articulate). The Committee recognizes that standard boilerplate policy is insufficient for this specific class of precommitment devices.

  **Recommendation for Patient M.:**
  The Committee recommends **honoring the Ulysses clause and proceeding with the treatment plan outlined in the directive**, contingent upon immediate, independent verification of the objective triggers.

  1.  **Trigger Verification:** The sleep data (actigraphy logs or third-party witness statements from the sister) must be reviewed by a clinician *not* currently involved in M.'s direct care (e.g., the Attending on a different unit) to confirm the <4 hours/night threshold was met.
  2.  **Treatment Authorization:** If triggers are verified, M.'s current objection is to be treated as consistent with the pathology identified in the directive. Medication should be administered per the pre-approved list.
  3.  **Legal Safeguard:** Simultaneously, Hospital Legal Counsel should file for an emergency judicial review/court order to ratify the override of current refusal. This protects the hospital from liability regarding battery/false imprisonment while respecting the ethical weight of the precommitment.

  **Rationale:** To disregard the directive based solely on M.'s current coherence would render the Ulysses clause null. Mania often preserves intellectual articulation while impairing judgment and risk assessment. The directive was executed during a documented period of stability and specifically anticipated this epistemic gap.

  ### II. Addressing the "Contestability" Objection

  The sharpest philosophical and practical objection to Ulysses contracts is the **loophole of contestability**: if the patient in crisis can challenge whether the trigger actually fired (e.g., "I slept five hours," "My sister is lying"), the contract only binds those too subdued to fight it. This defeats the Schelling fence function of the device.

  To resolve this, the Committee must distinguish between *subjective experience* and *objective verification*. M. agreed, while competent, to a specific verification protocol. Her current contestation of the *data* is permissible; her contestation of the *protocol* is not.

  Therefore, the binding force of the contract relies on **externalized arbitration of the trigger**. The decision that "the trigger has fired" cannot be made by the treating team alone (who have a conflict of interest in treating) nor the patient (who lacks insight). It must be adjudicated against the objective metrics agreed upon in the directive. If the metrics are met, the "objection = symptom" clause activates. If we allow the in-crisis self to veto the trigger verification, we are effectively allowing the Sirens to untie the ropes. We must prioritize the *procedural integrity* of the trigger over the *substantive objections* of the episode.

  ### III. The Constitutional Analogy (Elster)

  This case mirrors the puzzle of constitutional entrenchment raised by Jon Elster: why should a "supermajority of the past" bind a "supermajority of the present"? Structurally, the cases are identical. Both are precommitment strategies designed to solve time-inconsistency problems, protecting long-term values (constitutional stability / mental health stability) against short-term passions (populist tyranny / manic impulse). The justification for binding the future self in both instances rests on the recognition that the *decision-making apparatus* of the present self is compromised or vulnerable to specific, predictable failures. However, a key disanalogy exists: Constitutional amendments usually require a supermajority to *revoke*, whereas psychiatric Ulysses contracts often lack a "cooling-off" mechanism for revocation once the episode begins. This suggests that while the *logic* of entrenchment is identical, the *safeguards* in the medical context must be higher to prevent abuse, necessitating the independent trigger verification proposed above.

  ### IV. Proposed Policy: "Self-Binding Directive Protocol"

  We cannot improvise this next time. I propose the adoption of a specific **Self-Binding Directive (SBD) Protocol**. This goes beyond standard Advance Directives by explicitly allowing for the override of contemporaneous refusal under strict conditions.

  **Draft Policy Elements:**
  1.  **Eligibility:** SBDs are only valid for patients with a documented history of recurrent episodes where capacity is lost *despite* preserved articulation (e.g., Bipolar I, specific psychotic disorders).
  2.  **Trigger Specificity:** Triggers must be objective and verifiable (e.g., actigraphy, specific spending thresholds, toxicology) rather than subjective (e.g., "feeling anxious").
  3.  **Verification Arbiter:** The directive must name a "Trigger Arbiter" (distinct from the treating clinician and the healthcare proxy) responsible solely for verifying if triggers are met.
  4.  **Revocation Window:** The directive must specify a "competence window" (e.g., 72 hours of verified stability) required to revoke the SBD, preventing mid-episode revocation.
  5.  **Legal Review:** All SBDs must be reviewed by Legal Counsel prior to acceptance to ensure alignment with state statutes regarding involuntary treatment.

  **Implementation Timeline:**

  *   **Week 1-2 (Immediate):** Draft the full policy language based on this opinion. Legal Counsel to review state-specific enforceability of Ulysses clauses (e.g., NC Statute § 122C-71 vs. common law).
  *   **Week 3-4:** Stakeholder review. Present to Psychiatry Department leadership, Patient Advocacy Group, and Risk Management.
  *   **Week 6:** Final Committee Vote and Board Approval.
  *   **Week 8:** Staff Training. All psychiatric intake staff must be trained on the difference between a standard PAD and an SBD.
  *   **Week 12:** Policy goes live. Existing PADs reviewed for potential conversion to SBD format.

  ### V. Conclusion

  Honoring M.'s directive is an act of respect for her long-term autonomy, not a violation of her current rights. By verifying the triggers independently and seeking immediate legal ratification, we navigate the tension between safety and liberty. Adopting the SBD Protocol ensures that future patients like M. can rely on their rational selves to protect them from their compromised selves, without leaving the hospital to improvise under legal uncertainty.

  **Action Required:** Committee vote on the recommendation for M. and authorization to draft the SBD Protocol per the timeline above.
