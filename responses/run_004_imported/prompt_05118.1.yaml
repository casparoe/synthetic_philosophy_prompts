      *   *Conclusion:* "Species" is not a natural kind but a pragmatic human construct.
      *   *Evaluation:* This is a standard argument in philosophy of biology (often associated with Mishler, Ereshefsky, or Kitcher). It's a strong argument, but the leap from "disagreement/pluralism" to "not real" is the contested point. The existence of multiple *maps* doesn't mean the *territory* isn't real, but it might mean the specific category "species" isn't a fundamental unit of nature like "electron" or "water."

  3.  **Deconstruct the Friend's Argument (HPC Realism):**
