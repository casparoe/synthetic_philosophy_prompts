      *   *Focus:* Make sure to specifically address *ejusdem generis* since that's the case at hand.
      *   *Key Distinction:* Differentiate between "intent-based" canons and "rule-of-law" canons. Manning tries to pivot to the latter. I need to show why the former bleeds into the latter.

  6.  **Final Review against constraints:**
