prompt: |-
  Since this past September I have been clerking for a federal appellate judge who is an unapologetic textualist, and a case on our docket this term has left me newly preoccupied with a puzzle about the internal consistency of that methodology. The statute we are construing lists several specific exempted items followed by a catch-all phrase ("or any other similar device"), and my judge's draft opinion fixes the catch-all's scope by invoking ejusdem generis and reading the provision against the structure of the surrounding subsections, all while treating the House committee report that speaks directly to the drafters' aims for the clause as categorically inadmissible. When I raised the apparent tension with my co-clerk, who spent a year in the Senate Legislative Counsel's office before this job, she told me the canons simply encode background facts about how competent drafters and readers use language, rather than covert inquiries into anyone's intent, so there is no inconsistency at all. That answer has stayed with me, but the longer I sit with it, the less sure I am that it holds up.

  I recently came across John Manning's argument, from a 2003 Harvard Law Review piece on the absurdity doctrine, that the traditional doctrine sits uneasily with modern textualism: once you accept the public-choice-informed picture of a statute as a contingent, path-dependent bargain rather than the expression of some coherent collective purpose, you no longer have firm ground for saying what result "the legislature" could not have intended, which is exactly what the absurdity doctrine requires you to say. Manning uses this to argue for sharply narrowing, though not abandoning, the doctrine. What I cannot shake is the sense that the very same argument should equally threaten the whole-act rule, the presumption of consistent usage, and canons like ejusdem generis and noscitur a sociis, since using any of them to fix the scope of a catch-all likewise requires attributing some coherent "evident scheme" to a body that, on the public-choice picture, need not have had one.

  So here is what I would like your help with. Please argue for the position that Manning's own reasoning against the absurdity doctrine generalizes to these structural and semantic canons, such that a new textualist who accepts his critique of the absurdity doctrine but continues to rely on the whole-act rule, ejusdem generis, and noscitur a sociis is being inconsistent. Take the strongest version of the "mere linguistic convention" rejoinder seriously (essentially my co-clerk's view) before explaining concretely why it does or does not save these canons from the extended critique.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A federal appellate clerk (likely 2L or 3L, or recent grad) clerking for a prominent textualist judge. They are intellectually engaged, sophisticated in legal theory, and noticing a potential tension in their judge's methodology.
      *   **Context:** The clerk is working on a case involving statutory interpretation (specifically a list + catch-all structure). The judge uses *ejusdem generis* and structural arguments but rejects legislative history (committee reports). The clerk's co-clerk (ex-Legislative Counsel) argues canons are just linguistic conventions, not intent-seeking. The clerk is skeptical and cites John Manning's 2003 *Harvard Law Review* article ("The Absurdity Doctrine") as a basis for skepticism.
      *   **Task:** Argue *for* the position that Manning's reasoning against the absurdity doctrine *does* generalize to structural/semantic canons (whole-act rule, *ejusdem generis*, *noscitur a sociis*). Essentially, make the case that a "New Textualist" who accepts Manning's critique of absurdity but keeps these canons is being inconsistent.
      *   **Requirement:** Take the "mere linguistic convention" rejoinder (the co-clerk's view) seriously before explaining why it fails to save the canons.
      *   **Tone:** Professional, academically rigorous, respectful of the clerk's position, nuanced, and persuasive. It needs to sound like it comes from someone familiar with the textualism debates (Scalia, Manning, Eskridge, etc.).

  2.  **Deconstruct the Core Argument (Manning's Thesis):**
      *   **Manning's Point on Absurdity:** Traditional textualism (Scalia-esque) often relies on the idea that the legislature is a coherent actor with a unified purpose. The "absurdity doctrine" allows judges to deviate from text if the result is so absurd no legislature could have intended it.
      *   **Public Choice Critique:** Modern textualists (like Manning) often embrace public choice theory. This views legislation as a bundle of compromises, logrolling, and path-dependent deals, not a coherent expression of a single "will."
      *   **The Tension:** If legislation is a messy compromise, you can't confidently say what is "absurd" to the legislature, because the "absurd" result might have been the price of the vote. Therefore, the absurdity doctrine is on shaky ground.
      *   **The Clerk's Extension:** If the legislature is *not* a coherent actor (public choice view), then why assume consistency across the whole act? Why assume a list implies a coherent genus (*ejusdem generis*)? These canons *also* assume a level of coherence and deliberate design that public choice theory denies.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the clerk's intuition. State the thesis: Manning's public-choice critique of the absurdity doctrine indeed destabilizes the structural canons if they are justified as proxies for legislative intent/coherence.

      *   **Section 1: Manning's Core Insight (The Public Choice Wedge):**
          *   Explain Manning's move. He separates "textualism" from "intentionalism."
          *   The key is the "fiction of the reasonable legislature."
          *   If we accept legislation is a deal, not a poem, "absurdity" is subjective.
          *   *Crucial Link:* This same logic applies to "coherence." A deal isn't necessarily coherent.

      *   **Section 2: Applying the Critique to Structural/Semantic Canons:**
          *   *Whole-Act Rule / Presumption of Consistent Usage:* Assumes the same word means the same thing throughout. But in a logrolled bill, different coalitions might use the same word differently to secure votes.
          *   *Ejusdem Generis / Noscitur a Sociis:* Assumes the drafter had a specific "genus" in mind. But catch-alls are often compromises to kick the can down the road or satisfy a lobbyist without listing everything. Assuming a coherent genus imposes order on chaos.
          *   *The Inconsistency:* If you reject absurdity because you can't know the "collective intent," you can't use canons to *construct* a collective intent either.

      *   **Section 3: Addressing the "Linguistic Convention" Rejoinder (The Co-Clerk's View):**
          *   *The Argument:* Canons aren't about intent; they are about how English works (e.g., people usually speak in lists of similar things).
          *   *Why it seems strong:* It aligns with the "fair notice" / rule of law value. Citizens read statutes like normal language.
          *   *Why it fails (The Counter-Punch):*
              1.  **Statutory Language isn't Ordinary Language:** Legislation is technical, drafted by counsel, often defying ordinary grammar for political reasons.
              2.  **The "Background Fact" Problem:** Manning argues the "background fact" is *not* that legislators draft coherently. If the empirical reality of Congress is messiness, relying on linguistic conventions assumes a drafting competence that doesn't exist.
              3.  **The "Covert Intent" Trap:** Even if you call it "linguistic," applying *ejusdem generis* is effectively imputing a purpose to the list. It asks, "What kind of thing did they mean?" That is an intent question disguised as a semantic one.
              4.  **Selectivity:** Textualists pick the canons that yield their preferred result. If "ordinary meaning" conflicts with *ejusdem generis*, which wins? Often the canon that limits agency power. This suggests the canon is doing normative work, not just linguistic work.

      *   **Section 4: The Normative Stakes (Rule of Law vs. Democratic Process):**
          *   Manning might try to save the canons as "clear statement rules" or default rules.
          *   But if the justification is "legislative coherence," the public choice critique kills it.
          *   If the justification is "judicial restraint," using canons to narrow statutes (like *ejusdem generis* often does) might actually be *more* activist than reading the text broadly.

      *   **Conclusion:** Summarize. The clerk's intuition is correct. To be consistent, a Manning-style textualist must either abandon the coherence-assuming canons or admit they are normative default rules (which opens a different can of worms).

  4.  **Refining the Tone and Content:**
      *   *Check:* Did I respect the co-clerk's view? Yes, need to ensure the "linguistic convention" argument gets a robust hearing before being critiqued.
      *   *Check:* Is the Manning citation accurate? Yes, *The Absurdity Doctrine*, 116 Harv. L. Rev. 2387 (2003).
      *   *Check:* Is the legal theory sound? The tension between public choice textualism and coherence-based canons is a known critique (often associated with Eskridge or more progressive textualists, but valid internally).
      *   *Nuance:* Acknowledge that Manning himself might try to distinguish them (e.g., canons as defaults vs. absurdity as override). I need to argue why that distinction doesn't hold water in this context.

  5.  **Self-Correction/Polishing during drafting:**
