answer: |-
  **MEMORANDUM**

  **TO:** Federal Appellate Clerk
  **FROM:** Legal Theory Consultant
  **RE:** The Consistency of New Textualism: Manning, Public Choice, and the Structural Canons

  You have identified one of the most sophisticated tensions in modern statutory interpretation theory. Your intuition is correct: if one accepts John Manning's public-choice-inflected critique of the absurdity doctrine, maintaining a robust reliance on coherence-assuming canons like *ejusdem generis*, *noscitur a sociis*, and the whole-act rule creates a significant theoretical vulnerability.

  The core of the problem lies in the justification for the canons. If they are justified as proxies for legislative reality (i.e., "this is how legislatures draft"), Manning's public choice critique undermines them. If they are justified purely as linguistic conventions (your co-clerk's view), they risk contradicting the empirical premises New Textualists claim to uphold about the legislative process.

  Below is an argument for the position that Manning's reasoning does indeed generalize to these structural canons, rendering their selective retention inconsistent with the "hard" textualist premises he advances.

  ### I. Manning's Core Insight: The Death of the Coherent Legislature

  To understand why the inconsistency exists, we must first isolate Manning's move in *The Absurdity Doctrine* (2003). Manning argues that the traditional absurdity doctrine relies on a "fiction of the reasonable legislature." It assumes that Congress is a single, rational actor pursuing a coherent purpose, such that a judge can identify a result so "absurd" that the legislature *could not have intended it.*

  Manning, channeling public choice theory, rejects this fiction. He posits that statutes are often the product of logrolling, sequential voting, and compromise among conflicting coalitions. A statute is not a poem with a unified theme; it is a bundle of deals. Therefore, a result that looks "absurd" from the perspective of policy coherence might have been the precise price paid to secure a vote for passage. To invoke the absurdity doctrine is to privilege the judge's view of rational policy over the messy reality of the legislative bargain.

  ### II. Generalizing the Critique to Structural Canons

  If we accept Manning's premise that legislation is a path-dependent bargain rather than a coherent expression of will, the structural and semantic canons face the same existential threat as the absurdity doctrine. They all rely on the assumption of **drafting coherence.**

  **A. The Whole-Act Rule and Presumption of Consistent Usage**
  These canons presume that Congress uses the same words in the same way throughout a statute and that different sections fit together into a harmonious whole. But on the public-choice picture, this is empirically dubious.
  *   **Logrolling:** Different sections of a bill are often drafted by different committees or stakeholder groups to satisfy different constituencies. The word "source" in Section 101 might be a compromise with environmentalists, while "source" in Section 302 might be a compromise with industry.
  *   **Path Dependence:** Amendments are often tacked on at the last minute to secure a majority. Assuming these late additions are semantically consistent with the original text attributes a level of editorial oversight to Congress that rarely exists.
  *   **The Inconsistency:** If you cannot say what result Congress "could not have intended" (absurdity) because Congress is a "they" not an "it," you likewise cannot assume Congress intended semantic consistency across the act. Both inquiries require imputing a unified mental state to a fragmented body.

  **B. *Ejusdem Generis* and *Noscitur a Sociis***
  Your current case turns on this. These canons assume that when a drafter writes a list followed by a catch-all, they have a specific "genus" in mind that unites the items.
  *   **The Compromise Reality:** Often, catch-all phrases are not the result of a deliberate design to capture a specific genus, but rather a failure to agree on specific items. One coalition wants Items A, B, and C listed; another wants D, E, and F. The compromise is to list A, B, and C and add "or similar devices" to let the agency or courts sort it out later.
  *   **Imposing Order:** When a judge uses *ejusdem generis* to narrow the catch-all to the "genus" of the listed items, the judge is imposing a coherence on the compromise that the drafters may have intentionally left ambiguous.
  *   **The Inconsistency:** Manning argues we should not rescue Congress from "absurd" results because those results might be the deal. Similarly, we should not rescue Congress from "ambiguous" catch-alls by narrowing them via *ejusdem generis*, because the ambiguity might *be* the deal. To narrow the catch-all is to say, "The legislature could not have intended this broad scope," which is functionally identical to the absurdity inquiry Manning rejects.

  ### III. The "Linguistic Convention" Rejoinder

  Your co-clerk's defense is the standard New Textualist fallback: *These canons are not about intent; they are about language.*

  **The Argument:**
  The claim is that *ejusdem generis* and the whole-act rule are not empirical claims about how Congress *actually* drafts, but normative rules about how English *works*. Just as a judge interprets a contract or a will using background linguistic conventions, a judge should interpret a statute using these canons. They provide "fair notice" to the public, who read statutes assuming consistency and coherent lists. This shifts the justification from **legislative intent** (which public choice undermines) to **rule of law values** (which remain valid regardless of legislative messiness).

  **Why This Fails to Save the Canons:**
  While this argument is theoretically distinct, it collapses under Manning's own empirical scrutiny for three reasons.

  **1. The "Background Fact" Mismatch**
  Manning's textualism claims to be grounded in the constitutional allocation of power and the reality of the legislative process. He argues we must respect the "hard choices" made by the legislature. If the empirical reality of the legislative process (per public choice) is that statutes are *not* drafted with the coherence these canons assume, then treating them as "linguistic conventions" becomes a fiction indistinguishable from the "reasonable legislature" fiction Manning rejects.
  To say "people speak in coherent lists" is true of ordinary conversation. To say "Congress drafts in coherent lists" is an empirical claim that public choice theory says is false. If the canon rests on a false empirical premise about the object being interpreted (the statute), it cannot be saved merely by calling it a "linguistic rule." It becomes a judicial override of the actual text to fit a model of drafting that doesn't exist.

  **2. The Covert Intent Inquiry**
  Even when framed as linguistic, *ejusdem generis* inevitably slides into intent. To determine the "genus" of a list, a judge must ask: *What unites these items?*
  *   If the list is "cars, trucks, and tractors," is the genus "vehicles," "machines with engines," or "things that pollute"?
  *   Selecting the genus requires an inquiry into the *purpose* of the list.
  *   Once you are inquiring into the purpose of the list to define the linguistic scope, you are engaging in the very intentionalist inquiry Manning warns against. You are asking, "What was the point of this clause?" Manning's critique of absurdity is that we cannot know the point because there are many points (compromises). The same applies here.

  **3. Selective Activation and Normative Bias**
  If these were truly neutral linguistic conventions, they would apply with the same force as grammar. But in practice, New Textualists often deploy these canons selectively to achieve narrowing results (often limiting agency power).
  *   If the "ordinary meaning" of "device" is broad, but *ejusdem generis* narrows it, the canon is doing normative work (limiting liability/regulation) rather than linguistic work.
  *   Manning's critique of absurdity is that it allows judges to override text based on their view of rational policy. If *ejusdem generis* is used to override the broad ordinary meaning of a catch-all based on a judicially constructed "genus," it functions as a "soft absurdity doctrine." It allows the judge to say, "The text says X, but a coherent legislature would have meant Y, so we read it as Y."

  ### IV. Conclusion: The Inconsistency Remains

  Your co-clerk's view saves the canons only if one accepts that statutes should be treated like ordinary speech, regardless of how they are actually produced. But Manning's own project is deeply rooted in the *unique* nature of the legislative process (bicameralism, presentment, public choice constraints).

  If Manning is right that the legislative process is too messy to support the "absurdity" inference (i.e., we can't know what they wouldn't have intended), he must also concede that the process is too messy to support the "coherence" inference (i.e., we can't know that they intended consistency or a specific genus).

  To hold both positions—that we cannot second-guess "absurd" results because legislation is a bargain, *but* we can narrow catch-alls because legislation is coherent—is to have it both ways. It treats the legislature as irrational/fragmented when it produces results the judge dislikes (absurdity), but rational/coherent when it allows the judge to narrow statutory scope via canon (ejusdem generis).

  **Implication for Your Case:**
  If your judge is a consistent Manning-style textualist, the rejection of the Committee Report is sound. However, the reliance on *ejusdem generis* to narrow the catch-all is theoretically vulnerable. A truly consistent application of Manning's public-choice premises would suggest reading the catch-all according to its ordinary meaning, acknowledging that the ambiguity was likely the legislative price of passage, rather than imposing a judicially-constructed "genus" that assumes a coherence the legislature likely never achieved.

  You are right to be preoccupied. The tension you feel is the friction between textualism as a theory of *language* and textualism as a theory of *legislative reality*. Manning tries to bridge them, but as you have spotted, the bridge does not hold the weight of the structural canons.
