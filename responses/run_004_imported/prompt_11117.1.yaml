answer: |-
  This is a superb pairing for a graduate seminar. It cuts to the heart of a tension that runs through much of Keynes's work: the relationship between rationalist idealism and the messy realities of human psychology and social convention. Your students' disagreement likely stems from the fact that "Economic Possibilities" is often taught as a technocratic forecast, when it is actually a moral manifesto disguised as economics.

  Here is an analysis of how the Moorean ideal functions in the 1930 essay, where it diverges, and how the 1938 retrospective complicates (but does not necessarily invalidate) the earlier optimism.

  ### 1. The Moorean Transposition: Ends vs. Means
  To answer your first question: The "good life" sketched in *Economic Possibilities for our Grandchildren* is, in its teleology, almost a pure transposition of Moore's *Principia Ethica*.

  In *Principia Ethica*, Moore argues that the only things good "in themselves" are certain states of consciousness: the pleasures of human intercourse (love, friendship) and the enjoyment of beautiful objects (aesthetic appreciation). Everything else—money, institutions, work—is merely instrumental. Keynes's 1930 essay adopts this hierarchy explicitly. He defines the "economic problem" as the struggle for subsistence and argues that once this is solved, "man will be faced with his real, his permanent problem—how to use his freedom from pressing economic cares, how to occupy the leisure... to live wisely and agreeably and well."

  "Wisely, agreeably, and well" is essentially Keynesian shorthand for the Moorean states of mind. The accumulation of capital and the reduction of working hours are not ends in themselves; they are the engineering required to build the vessel in which Moore's ethics can finally sail. In this sense, the 1930 essay is deeply Moorean: it treats economics as the handmaiden to moral philosophy.

  **However, the divergence lies in the practical ethics.**
  Moore's chapter on practical conduct is cautious. He argues that because individuals are bad at calculating remote consequences, they should generally adhere to established moral rules and conventions. Keynes and the Apostles, as he admits in *My Early Beliefs*, stripped this away. They kept Moore's *ends* (refined states of mind) but rejected Moore's *means* (deference to convention).

  In the 1930 essay, this divergence manifests as a rejection of the "old habits" of thrift and purposeful money-making. Keynes views these habits as vestigial moral codes that were necessary during the age of scarcity but become "vices" in the age of abundance. To continue hoarding or working unnecessarily is, in the 1930 view, a failure of moral imagination. Here, Keynes is not following Moore's practical advice; he is following the Apostles' *distortion* of Moore—the belief that enlightened individuals can intuitively discern the good in each case without relying on the crutch of tradition.

  ### 2. The Elitist Assumption: A Departure from Moore?
  You ask how far the 1930 essay departs from Moore's ideal regarding the assumption that only some are fit for freedom. This is the crux of the tension.

  Moore's ethics are arguably elitist in an epistemic sense (only those capable of deep reflection can recognize the good), but they are not necessarily class-based. Keynes, however, sociologizes this limitation. In 1930, he writes that "there will be no nation or people who will not be able to enjoy the leisure," but he immediately hedges: "for a while yet." He suggests that for at least 100 years, we must pretend that "fair is foul and foul is fair"—that greed is good and thrift is virtue—because the masses are not yet cultivated enough to handle freedom.

  This is a significant departure from Moore, and it reveals a pragmatic anxiety in Keynes.
  *   **Moore:** Follow rules because consequences are uncertain.
  *   **Keynes (1930):** The rules (work/thrift) are now *bad* consequences, but we must keep the masses following them because they lack the intuition to see why.

  This creates a "two-tier" morality. The "refined few" (the Keynesian Apostles) are exempt from the old morality because they can intuit the Moorean good directly. The rest of humanity must remain bound by the "old habits" to prevent social collapse. This is not Moore; it is closer to a Platonic guardian class. It suggests that while the *goal* is universal Moorean flourishing, the *capacity* for it is currently culturally stratified. Keynes assumes that "living well" is a skill that must be learned, and the curriculum for that skill (liberal education, aesthetic cultivation) is not yet universally distributed.

  ### 3. *My Early Beliefs* and the Consistency of the Two Texts
  Does the 1938 memoir undermine the 1930 optimism? It complicates it, but I would argue the texts can be read as consistent if we view 1938 as a correction of the *mechanism* of transition, rather than a rejection of the *goal*.

  In *My Early Beliefs*, Keynes critiques the "religion" of his youth for ignoring the "dark and complicated forces" of human nature. He admits they underrated the value of convention in maintaining order. They assumed that if you removed the shackles of tradition, rational intuition would naturally lead to the good. History (and the interwar period) showed Keynes that without the stabilizing force of habit, society can descend into irrationality or barbarism.

  **The Tension:**
  If the 1930 essay assumes that humanity will *learn* to use leisure wisely, and the 1938 essay says humanity is deeply reliant on irrational habits and poor at judging consequences, there is a conflict. The 1930 essay is optimistic about moral progress (we will evolve to enjoy leisure); the 1938 essay is pessimistic about moral psychology (we are creatures of habit and instinct). If the masses in 1930 are kept working because they lack "cultivated tastes," the 1938 reflection suggests this lack might not be a temporary cultural lag, but a permanent feature of human psychology that requires the "crutch" of convention.

  **The Consistency:**
  However, a strong case can be made for consistency based on **institutionalism**.
  1.  **The Transition Period:** In 1930, Keynes explicitly argues for a transition period where the "old habits" must be maintained for the many. In 1938, he explains *why* that transition period is necessary: because human nature relies on convention. The 1938 text provides the psychological justification for the 1930 elitism.
  2.  **The Role of the State:** By 1938 (and certainly by the *General Theory* of 1936), Keynes is no longer relying on individual intuition to solve social problems. He is arguing for managed capitalism and state intervention. This aligns with the 1938 realization that we cannot trust unaided individual judgment. In the 1930 essay, the "solution" to the leisure problem is somewhat vague ("art," "life"). If read through the lens of 1938, we might infer that Keynes would eventually see the cultivation of leisure not as a spontaneous individual act, but as a social project requiring new conventions and institutions (public funding for arts, education, etc.).
  3.  **The Definition of "Grandchildren":** Keynes's timeline in 1930 is 100 years. The 1938 critique is of his *own* generation (1900–1910). It is consistent to believe that *his* generation was naive (1938) while maintaining that *future* generations, raised in abundance and educated differently, might develop the necessary capacities (1930).

  ### Conclusion for the Seminar
  You might suggest to your students that the disagreement they feel is actually the intended friction of Keynes's thought.

  *   **The 1930 Essay** represents the **Moorean Teleology**: It tells us *what* we are saving for. It is a vision of the good life as aesthetic and contemplative, liberated from necessity.
  *   **The 1938 Memoir** represents the **Keynesian Psychology**: It tells us *why* getting there is so hard. It acknowledges that we are not purely rational agents who can simply switch from "struggle" to "contemplation" once the bank account is full.

  The 1930 essay is not inconsistent with the 1938 memoir; rather, the 1938 memoir explains the tragic gap in the 1930 essay. Keynes admits in 1930 that most people are not yet fit for freedom. In 1938, he admits *he* wasn't fully fit for it either, because he underestimated the hold of habit.

  The synthesis is this: The "Economic Possibilities" forecast is valid only if we treat the cultivation of the capacity for leisure as a political and educational project, not just an economic one. If we solve the economic problem without solving the moral/psychological problem (as the 1938 text warns), we do not get Moore's heaven; we get what Keynes later feared: a society with abundant leisure but no idea how to use it, potentially falling back into darker, irrational pursuits. The 1930 essay sets the destination; the 1938 memoir warns about the terrain.
