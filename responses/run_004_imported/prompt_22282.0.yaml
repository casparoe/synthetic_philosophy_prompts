answer: |-
  **Setting:** *A coffee shop across the street from a row of apartment buildings. Sarah, a mutual friend, is visible through the window, stepping out of a building, checking her phone, and then texting someone. Alex and Jamie are at a table with half-empty lattes.*

  **Alex:** Look at that. She just signed the lease. That was the fourth place she saw all week.

  **Jamie:** Fifth. She saw that studio on Monday that we told her to skip.

  **Alex:** Same difference. She found a place that met her criteria—laundry, sunlight, under $3k—and she stopped. That is textbook utility maximization.

  **Jamie:** It is textbook *satisficing*. There's a difference, Alex. She didn't weigh the marginal benefit of a fifth apartment against the marginal cost of viewing it. She just had a threshold. Once something cleared the bar, the game ended. She didn't find the *best* apartment; she found the first *acceptable* one.

  **Alex:** You're confusing the algorithm with the outcome. Simon's "satisficing" is just optimization with search costs folded into the utility function. She stopped because, in her head, the expected value of apartment number five was lower than the cost of her time and the stress of keeping the broker on the hook. She maximized net utility.

  **Jamie:** But she didn't calculate that. That's Simon's whole point. If you say, "Well, she acted *as if* she calculated it," you're making the theory unfalsifiable. If she had looked at fifty apartments, you'd say, "Ah, low search costs." She looked at five, you say, "High search costs." You can rescue the maximization model from *any* behavior just by inventing a hidden cost post-hoc.

  **Alex:** It's not inventing costs; it's inferring preferences. Economics isn't about the neural firing patterns during the decision. It's about predicting behavior. If I model her as a maximizer, I predict she stops when $MarginalCost(Search) > MarginalBenefit(Search)$. That prediction held. Why do I need to care about her internal cognitive machinery?

  **Jamie:** Because the machinery determines how she reacts when the environment changes. If she's a maximizer, and you lower the search cost—say, you give her a better app—she should search more. If she's a satisficer, she might just raise her aspiration level. She might say, "Oh, searching is easier? Now I want a doorman." The behavior diverges. But more importantly, there's a logical hole in your "optimization of search" argument.

  **Alex:** Which is?

  **Jamie:** To optimize the search, you have to know the value of searching. I need to know the probability distribution of apartment quality to know when to stop looking. But I don't know the distribution until I search.

  **Alex:** So you use priors. Bayesian updating. You start with a guess, see a few places, update the curve, and stop when the expected gain drops below your hourly rate.

  **Jamie:** Okay, but to decide *how many* apartments to look at to build a reliable prior, I have to optimize *that* search. I need to know the cost of gathering information about the information. Do you see the regress? To optimize the search, I need to solve an optimization problem that is strictly harder than the original problem of picking an apartment.

  **Alex:** *Pauses, stirs his coffee.* You're arguing that optimal search requires omniscience.

  **Jamie:** I'm arguing it requires a calculation that is computationally intractable for a human brain. Simon's point isn't that people are lazy. It's that the "global optimum" is undefined for a bounded agent. You can't maximize what you can't compute. So we use heuristics. Aspiration levels. We adjust the bar based on how easy it is to clear it. That's not a clumsy version of optimization; it's a different mode of rationality. Procedural rationality.

  **Alex:** I'll grant you the computational cost. Humans aren't calculators. But evolution is. If satisficing heuristics consistently outperformed maximizing heuristics in terms of survival and resource acquisition, we'd have evolved to maximize. The fact that we use thresholds suggests that, over deep time, thresholds *are* the approximate solution to the optimization problem. So functionally, it's still optimization. The heuristic is just a shortcut to the same peak.

  **Jamie:** But what if there is no peak? What if the landscape is rugged and changing? If I'm a maximizer, I'm constantly second-guessing: "Did I miss a better one?" That's the paradox of choice. Maximizers are empirically less happy than satisficers. If the goal of rationality is to achieve well-being, the maximizer is failing.

  **Alex:** That's a psychological outcome, not a rational one. Rationality is about consistency of preferences, not happiness. If I prefer to suffer to ensure I got the absolute best deal, that's my utility function.

  **Jamie:** See, that's where you lose me. You're defining rationality as logical consistency with a set of axioms. Simon defines it as adapting means to ends within cognitive limits. Look at Sarah. She's happy. She's moved in. She's not thinking about the apartment she didn't see. She used a tool that fit her brain. If you call that "optimization," you've stretched the word until it snaps. You've turned "rationality" into a ghost in the machine that explains everything and nothing.

  **Alex:** *Leans back.* Okay, let's press on the regress point again. You say optimizing search is too hard. I say we don't do it perfectly, we do it approximately. We use rules of thumb. "Look at three places." "Spend 10% of the item's value on research." Those rules are heuristics, sure, but they exist *because* they approximate the optimal stopping point. The *normative* standard is still expected utility. Satisficing is just the *descriptive* reality of how we get there.

  **Jamie:** But Simon argues the normative standard should change too. If the calculation is impossible, it's not rational to attempt it. It's like saying a chess player is irrational for not calculating every possible move to the end of the game. No, the rational move is to use pattern recognition.

  **Alex:** But pattern recognition is just compressed calculation.

  **Jamie:** It's not compression if it changes the goal. In optimization, the goal is the *best* option. In satisficing, the goal is an *adequate* option. Those are different target functions. If I'm hunting for a mate, a maximizer looks for the best genetic match. A satisficer looks for someone who meets their core values and commits. The outcomes are wildly different. One leads to paralysis, the other to a family. You can't just say the satisficer is "maximizing family utility" after the fact. They didn't run that equation. They followed a rule that bypassed the equation entirely.

  **Alex:** *Sighs.* I think where we're stuck is on the "as-if" defense. Friedman would say I don't care if Sarah ran the equation. I care that if rent prices drop, she searches less. If her income goes up, she searches more. If the model predicts the *direction* of the change, the internal mechanism is irrelevant.

  **Jamie:** Until the mechanism breaks. And it does break. People search too little on high-stakes decisions because of anxiety, not cost-benefit analysis. They search too much on low-stakes decisions because of FOMO. A bounded rationality model predicts that error. A strict maximization model has to call it "irrational" or invent a weird cost function to explain it away.

  **Alex:** Fair. Behavioral econ has won that battle. People aren't perfect maximizers. But the *theory* of rational choice is still the baseline. It's the null hypothesis. Satisficing is a correction factor.

  **Jamie:** I'd say satisficing is the engine, and optimization is the map we draw over it afterwards. You're treating the map as the territory.

  **Alex:** *Looks out the window.* Sarah's waving. She wants us to come see the place.

  **Jamie:** Are we going to maximize the utility of the walk over there, or just go because it's good enough?

  **Alex:** *Stands up.* If I calculate the caloric expenditure versus the social capital gained...

  **Jamie:** Get up, Alex.

  **Alex:** *Smiles.* Yeah, yeah. The search cost of arguing further is exceeding the marginal benefit of convincing you.

  **Jamie:** See? You're a satisficer now.

  **Alex:** Don't push it. I'm just optimizing for coffee refills.
