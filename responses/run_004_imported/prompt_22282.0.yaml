  *(Self-Correction during final polish)*: Make sure Alex doesn't just cave on the regress point. He should argue that "good enough" heuristics are evolutionary shortcuts *for* optimization, whereas Jamie argues they constitute a different *definition* of rationality. That distinction is key.

