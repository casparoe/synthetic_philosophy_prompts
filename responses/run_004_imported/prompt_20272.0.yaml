answer: |-
  Good evening. I usually cover science and ideas for a living, so standing in front of a gallery of photographs feels like a pleasant shift from the laboratory to the light. But I've been asked to begin with a specific idea, one that serves as the theme for this year's exhibition.

  In 1926, accepting the Spingarn Medal in honor of Carter Woodson, W.E.B. Du Bois made a claim that has echoed for nearly a century: *"Thus all Art is propaganda and ever must be."*

  It is a provocative line. It is also, if we are honest, often misunderstood. When our Board Chair asked me to open with it, I went back to the text of that speech. What I found was more complex than the slogan suggests. Du Bois wasn't arguing for crude political messaging. He was arguing that Beauty, Truth, and Right are inseparable. In a world determined to caricature Black life, he believed that for a Black artist to depict the full, unvarnished truth of their own experience was, in itself, a revolutionary act. The "propaganda" was the antidote to the lie.

  But even in 1926, that argument was contested. Many of Du Bois's contemporaries—writers and artists of the Harlem Renaissance—pushed back. They argued that art should not be yoked to racial duty, that the imagination must be free to wander wherever it pleases, without a mandate to represent or correct.

  That tension is not just history; it is in this room. I know that at least two of the photographers exhibiting tonight hold to that latter view. They believe their work stands apart from cause or creed. And I think that is exactly as it should be.

  We are not here tonight to resolve a debate that Du Bois himself couldn't settle. We are here to witness what happens when those philosophies meet the light. Whether you see these images as a claim to truth, or simply as a pursuit of beauty, the work demands that you look closely.

  So, I invite you to walk through this exhibition with that question in mind. Look for the truth. Look for the beauty. And let the friction between them spark the conversation.

  Thank you, and enjoy the show.
