answer: |-
  This is one of the sharpest questions in the philosophy of language and logic. You have correctly identified the fault line in the orthodoxy: we have a split personality for conditionals. Indicatives get the non-propositional, probabilistic treatment (Adams/Edgington), while counterfactuals get the robust, truth-conditional, possible-worlds treatment (Stalnaker/Lewis).

  Here is the breakdown of why the triviality results don't sink counterfactuals, and whether the resulting semantic dualism is principled or ad hoc.

  ### 1. Why Triviality Results Spare Counterfactuals

  Lewis's triviality results (1976) are often misunderstood as proving "conditionals cannot be propositions." More precisely, they prove that **conditionals cannot be propositions *if* their probability equals the conditional probability.**

  The core equation (Adams' Thesis) is:
  $$P(A \to C) = P(C \mid A)$$

  Lewis showed that if $\to$ is a propositional connective (it has truth conditions) and it satisfies this equation for all probability functions, the probability function collapses (becomes trivial).

  **Why doesn't this kill Counterfactuals?**
  Because counterfactuals do not satisfy Adams' Thesis. The probability of a counterfactual is *not* generally equal to the conditional probability of the consequent given the antecedent.

  *   **Indicatives are Epistemic:** "If Oswald didn't kill Kennedy..." is evaluated relative to our current state of knowledge. We don't know who did it, so we assess the likelihood based on the evidence we have. The Ramsey Test applies directly: suppose $A$, adjust beliefs minimally, check $C$. This aligns with $P(C \mid A)$.
  *   **Counterfactuals are Metaphysical/Causal:** "If Oswald hadn't killed Kennedy..." requires us to step outside our actual knowledge and look at how the world *would have evolved*. This depends on causal laws and similarity relations between worlds, not just our current credences.

  **The Nixon Example:**
  Consider: "If Nixon had pressed the button, there would have been a nuclear holocaust."
  *   $P(\text{Holocaust} \mid \text{Button})$ might be low in a specific epistemic context (e.g., if we know the wire was cut).
  *   But the counterfactual might still be true (or highly probable) because, in the closest worlds where he presses it, the wire *isn't* cut (we hold fixed the causal laws, not the specific accidental facts).

  Because counterfactuals break the link between $P(A \boxright C)$ and $P(C \mid A)$, Lewis's triviality proof cannot get off the ground. Counterfactuals can be propositions because they are not bound by the probabilistic constraint that causes the collapse. They violate the logical principles (like specific forms of Import-Export or Antecedent Strengthening) that the triviality proofs rely upon.

  ### 2. Is the Divergence Ad Hoc?

  This is the deeper philosophical worry. It feels ugly to say that the word "if" performs two completely different logical operations depending on the tense of the verb. Is there a principled story, or did we just paint ourselves into a corner?

  #### The Case for "Principled Divergence"
  The defense is that indicatives and counterfactuals are actually doing different jobs, so they *should* have different semantics.

  1.  **Different Modal Bases:**
      *   **Indicatives** quantify over worlds compatible with what is **known** (the epistemic modal base). They tell us what follows from our information.
      *   **Counterfactuals** quantify over worlds compatible with what **would be the case** (often a metaphysical or causal modal base). They tell us about the structure of reality, independent of our ignorance.
  2.  **The Gibbard Argument:**
      Allan Gibbard (1981) provided a specific argument (distinct from Lewis's) showing that if indicatives have truth conditions and satisfy the principle of Import-Export ($(A \to (B \to C)) \equiv ((A \land B) \to C)$), they collapse into the material conditional. Since indicatives clearly *aren't* material conditionals (you can assert "If it rains, it pours" without asserting "It doesn't rain or it pours"), we must give up either truth-conditions or Import-Export for indicatives.
      Counterfactuals, however, *fail* Import-Export (Antecedent Strengthening fails for them). So, counterfactuals can keep truth-conditions without collapsing. This suggests a logical, structural reason for the split.

  #### The Case for "Ad Hoc Dualism" (and attempts to unify)
  Many philosophers find the split unsatisfying. It implies a massive ambiguity in natural language. There have been several attempts to unify them, which suggests the divergence might be superficial.

  1.  **Stalnaker's Unified Semantics:**
      Robert Stalnaker argued that the semantics *is* the same (selection function over possible worlds), but the **context** differs.
      *   For indicatives, we select from the "context set" (worlds compatible with common ground).
      *   For counterfactuals, we shift the context set to accommodate the false antecedent.
      *   *Critique:* This struggles to explain why indicatives seem to lack truth values while counterfactuals have them. If the mechanism is the same, why does the probabilistic collapse hit one and not the other?
  2.  **Contextualism / Relativism:**
      Recent work (e.g., by Khoo, Mandelkern, or Kocurek) suggests that *both* might be propositional, but their truth conditions are context-sensitive in a way that evades triviality. If the proposition expressed by $A \to C$ shifts depending on the probability function in play, Lewis's proof (which assumes a fixed proposition across probability updates) is blocked.
  3.  **Dynamic Semantics:**
      Some argue neither are propositions in the classical sense. Both are instructions to update information states (dynamic semantics). The "truth value" intuition for counterfactuals is just a byproduct of how stable the update is. This unifies them by lowering the status of counterfactuals to match indicatives, rather than raising indicatives.

  ### Summary

  To answer your specific questions:

  1.  **Why don't triviality results rule out counterfactuals?**
      It is not an accident of the proof assumptions; it is because counterfactuals do not satisfy the **Adams Thesis** ($P(A \to C) = P(C \mid A)$). Counterfactual probability is driven by similarity and causal structure, not just conditional credence. Therefore, they escape the probabilistic trap that forces indicatives into non-propositionalism.

  2.  **Is the divergence ad hoc?**
      It is **theoretically costly but principled**.
      *   **Principled:** They track different modalities (epistemic vs. metaphysical/causal). The Gibbard argument shows indicatives have logical properties (Import-Export) that counterfactuals lack, forcing different semantic treatments if we want to avoid collapse.
      *   **Costly:** It requires positing a systematic ambiguity in "if."

  **The Verdict:**
  The current orthodoxy (Indicatives = Probabilistic/Non-propositional; Counterfactuals = Possible Worlds/Propositional) is the "least bad" option we have found so far. However, the trend in contemporary philosophy is to try to heal the split. Many are betting that a more sophisticated contextualism or dynamic semantics can unify the two without triggering triviality, suggesting that the current dualism might be a placeholder for a deeper, unified theory we haven't fully articulated yet.

  You are down a very productive rabbit hole; the tension you feel is the engine driving current research in the field.
