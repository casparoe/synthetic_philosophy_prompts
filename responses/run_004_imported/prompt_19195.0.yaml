      *   *Nuance:* Priest doesn't say *all* contradictions are true (that would be trivialism). He says *some*. Aristotle's "Triviality" argument often assumes the opponent means *all*. I need to make sure Aristotle addresses the "some" claim.
      *   *Nuance:* Priest's LP invalidates Disjunctive Syllogism ($A \lor B, \neg A \vdash B$). This is a huge cost. Aristotle would seize on this.

