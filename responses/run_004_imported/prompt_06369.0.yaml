          *   *User's Position:* This exclusion feels unjust because affected parties have no say. The "members decide who joins" circularity allows current beneficiaries to lock out others. Defining a group as "members-only" shouldn't automatically justify excluding affected stakeholders.
      *   **The Question:** Who is right? Is the line arbitrary but necessary? Is there a principled way to determine who gets a say? Does it change anything for the excluded groups?

  2.  **Deconstruct the Arguments:**

      *   **Jake's Argument (Legal/Contractual/Pragmatic):**
          *   *Premise:* An HOA is a private contractual agreement.
          *   *Logic:* You buy in, you agree to the covenants, you get rights. If you don't buy in, you don't get rights.
          *   *Strengths:* Legally sound (mostly), clear boundary, prevents "tyranny of the majority" from outside the community, ensures those paying for maintenance have control.
          *   *Weaknesses:* Ignores externalities (wake boats affect *everyone* on the water, not just deed holders), creates a "closed shop" dynamic where incumbents protect privilege.

      *   **User's Argument (Ethical/Democratic/Impact-Based):**
          *   *Premise:* Governance should reflect impact ("no taxation without representation" variant).
          *   *Logic:* If a rule affects your property or livelihood, you should have input. The current system allows incumbents to rig the game against new members or neighbors.
