answer: |-
  This is a classic conflict between **contractual property rights** (Jake's position) and **democratic legitimacy/stakeholder theory** (your position). You both are "right," but you are arguing from different frameworks: Jake is arguing from *law and logistics*, while you are arguing from *ethics and political philosophy*.

  Here is a breakdown of who is right about what, why the circularity argument is tricky, and whether there is a principled middle ground.

  ### 1. Where Jake is Right: The Legal and Logistic Reality
  Jake is correct on the **mechanics** of how HOAs function and why lines must be drawn.

  *   **HOAs are Private Contracts, Not Governments:** Legally, an HOA is a corporation. When your parents bought their house, they signed a contract (CC&Rs) agreeing to abide by the rules in exchange for membership. The marina, the renters, and the legacy houses did not sign that contract. Legally, Jake is solid: you don't get to vote on the budget of a company you don't own shares in, even if that company's decisions affect you.
  *   **The "Bright Line" Necessity:** You asked, "Where does it stop?" Jake is right that you need an administrative boundary. If "affected parties" get a vote, does a fisherman who visits once a year get a vote? Does the town downstream that deals with erosion get a vote? Defining "affected" is subjective; defining "dues-paying member" is objective. Without a bright line, decision-making becomes impossible.
  *   **The Universality of Circularity:** Jake is logically correct that *every* self-governing body decides its own membership. Citizens vote on immigration laws; club members vote on new members; shareholders vote on new shareholders. This circularity is a feature of sovereignty, not necessarily a bug.

  ### 2. Where You Are Right: The Ethical and Political Tension
  You are correct on the **legitimacy** of the power being wielded and the specific nature of the resource.

  *   **Negative Externalities:** This is your strongest point. A wake boat restriction isn't just about HOA finances; it's about physics. Waves generated by a member's boat crash against the legacy neighbor's dock and the marina's shore. In economics and law, this is a *negative externality*. Usually, when an entity creates externalities, regulations step in to protect the non-consenting parties. By excluding those parties from the vote, the HOA is internalizing the benefit (fun boating) while externalizing the cost (shoreline erosion) to people who can't vote.
  *   **The "Lock-In" Problem:** You identified a specific conflict of interest: *Current members vote on whether new members can join.* In a chess club, this doesn't matter. In a land-use community, this allows incumbents to artificially restrict supply to protect property values or reduce density, regardless of the impact on the broader community. You are right that this creates a "closed shop" dynamic.
  *   **Quasi-Public Resources:** A lake is different from a private swimming pool. Even if the lake is privately owned, water is often treated under **Public Trust Doctrine** (depending on your state). If the lake is navigable, the public (and by extension, the marina and legacy owners) may have legal rights to use it that supersede HOA bylaws. Treating a natural resource exactly like a private backyard is where the moral friction comes from.

  ### 3. The Circularity Argument: Is it a Dealbreaker?
  Jake says, "Everyone does it, so it's fine." You say, "Everyone does it, so it's suspect."

  The truth is in the **stakes**.
  *   **Low Stakes:** A book club excluding new members is fine.
  *   **High Stakes:** A government excluding residents from voting on pollution laws is unjust.
  *   **Middle Stakes:** An HOA is in the uncanny valley. It acts like a government (levies fines, makes land-use laws) but operates like a private club.

  You are right to be suspicious of the circularity *because* the HOA wields government-like power over land use. However, Jake is right that without that circularity, the HOA ceases to be a private association and becomes a municipal council. The problem isn't the circularity itself; it's that the HOA has **monopoly power** over the lake's usage without **public accountability**.

  ### 4. Is There a Principled Middle Ground?
  You asked if there is a way to figure out who should get a say that doesn't collapse into "dues-paying members." There are models for this, though they require the HOA to voluntarily adopt them (since they aren't legally required to).

  **A. The "Stakeholder Advisory" Model**
  The HOA retains the *vote* (legal liability remains with owners), but creates a **non-voting advisory board**.
  *   **Renters:** Can elect a representative to speak at board meetings regarding noise/dock usage.
  *   **Marina:** Gets a formal channel to present data on how boat wakes impact their business infrastructure.
  *   **Legacy Houses:** Since they are affected by shoreline erosion, they could be granted "easement members" status—they pay a reduced fee (for maintenance) and get to speak on safety/erosion issues, even if they can't vote on the color of the mailboxes.
  *   **Why this works:** It solves your "input" problem without breaking Jake's "legal liability" line.

  **B. Distinguishing "Governance" from "Usage"**
  *   **Governance (Vote):** Who pays for the dredging? Who fixes the road? (Owners only).
  *   **Usage (Rules):** How fast can boats go? (Everyone affected).
  *   Some communities separate these. The HOA manages the *infrastructure*, but the *water rules* are set by a broader committee that includes the marina and legacy owners, because water safety is a shared risk.

  **C. The Legal Reality Check (The "Collapse" Point)**
  Does it collapse back to "dues-paying members"? **Mostly, yes.**
  Unless the lake is public water, the law favors the deed holders. However, the marina and legacy owners likely have **riparian rights** (rights to access and use the water) that the HOA cannot infringe upon. If the HOA votes to ban wake boats, they can usually do so for *HOA members*. If they try to enforce that ban on the legacy houses or the marina via private security, they will likely get sued and lose. If they enforce it via the state (game warden), the state will require public hearings.

  ### The Verdict
  *   **Jake is right about the Law:** The HOA is a private corporation. Membership defines voting rights. The circularity of "members decide members" is standard for private entities.
  *   **You are right about the Politics:** The system lacks legitimacy because it allows a small group to impose physical costs (waves/erosion) on outsiders without their consent. The "club" analogy fails because a lake is a shared ecological system, not a tennis court.

  **Who should win the argument?**
  Neither of you should budge, because you are talking past each other.
  *   Tell Jake: "You're right legally, but morally, when your rules cause physical damage to non-members' property, excluding them from the conversation invites lawsuits and community hostility."
  *   Tell yourself: "You're right ethically, but legally, you can't force the HOA to give up voting rights to non-owners without changing the fundamental nature of property law."

  **The Solution:** The HOA Board (your mom) should realize that while they *can* exclude these groups from voting, it is **strategically stupid** not to listen to them. The marina has data on erosion; the legacy owners have historical knowledge of the water levels. Ignoring them doesn't make the HOA stronger; it makes their rules more fragile. They don't need to give up the *vote*, but they should absolutely give up the *monopoly on input*.
