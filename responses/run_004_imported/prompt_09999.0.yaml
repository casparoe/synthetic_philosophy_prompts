answer: |-
  Here are ten interview questions designed to press the specific machinery of the zombie argument while minimizing the surface area for the "that's a problem for physicalists too" deflection. The first three include the requested follow-ups keyed to likely defensive moves.

  ### 1. The Reliability of Modal Intuition
  Your argument hinges on "ideal, positive, primary" conceivability entailing possibility. But the history of philosophy and science is a graveyard of modal intuitions that felt rock-solid until they weren't—from the necessity of Euclidean geometry to the contours of set theory. Given that phenomenal states are arguably the murkiest objects of inquiry we have, why should we trust our modal intuitions about *them* more than our modal intuitions about space, number, or essence?

  *   **Follow-up (If she says: "Physicalists rely on intuitions too, e.g., about reference or logic"):**
      "Granted, everyone uses intuitions as data. But in your case, the intuition is doing heavy *revisionary* work—it's asking us to overturn the causal closure of the physical world based on a thought experiment. If the track record of modal intuition is mixed, shouldn't the burden of proof scale with how radical the ontological cost is? Why isn't 'my intuition might be misfiring here' the more parsimonious bet than 'physics is incomplete'?"

  ### 2. The Two-Dimensional Gap
  The standard physicalist counter is the Kripkean move: we can conceive of water without H₂O because there's a gap between the primary intension (watery stuff) and the secondary intension (H₂O). You claim phenomenal concepts lack this gap. But what *grounds* that claim? Is it an empirical discovery about how our brains process pain, or is it a philosophical assertion that "appearance equals reality" for qualia? If it's the latter, aren't you just defining the gap away rather than proving it doesn't exist?

  *   **Follow-up (If she says: "It's just the nature of phenomenal concepts; they refer directly"):**
      "If it's just the nature of the concept, how do we distinguish that from a stubborn refusal to accept a theoretical identity? When chemists said 'water is H₂O,' they had to accept that our pre-theoretical concept of water was partially descriptive. Why are phenomenal concepts immune to that same kind of theoretical refinement? What prevents the 'directness' you describe from being an illusion of perspective?"

  ### 3. The Paradox of Phenomenal Judgment
  If your zombie twin is physically identical to you, she writes the same papers, gives the same talks, and insists she's conscious for the exact same physical reasons you do. This suggests the physical facts alone explain the *report* of consciousness. So, what explanatory work is the actual consciousness doing? If the answer is "none," you're an epiphenomenalist. If the answer is "it makes the report true," doesn't that sever the link between truth and causal explanation in a way that makes consciousness scientifically undetectable in principle?

  *   **Follow-up (If she says: "It explains the truth of the judgment, even if not the production"):**
      "But if the physical facts fully explain why I *say* I'm conscious, and consciousness itself adds no causal power to that production, then from the perspective of the natural world, consciousness is invisible. If a property makes no difference to the behavior of the system that possesses it, in what sense is it a natural property at all? Are you comfortable accepting that consciousness is a kind of 'ontological ghost' that rides along with the physical machinery but never touches it?"

  ### 4. The Phenomenal Concept Strategy
  Physicalists have developed the "Phenomenal Concept Strategy" to argue that we can have distinct concepts for the same physical state without positing distinct properties. You've argued this strategy fails. But does it fail because it's logically incoherent, or just because it doesn't satisfy the *feeling* of explanation? If a physicalist can map every functional and neural correlate of a concept, what is the non-question-begging reason to insist there's still a leftover "phenomenal" component that the strategy misses?

  ### 5. Causal Closure and Asymmetry
  Physicalists posit one causal realm; you posit at least two, or a realm with properties that don't supervene on the physical. The "physicalist too" dodge works well for problems of reference or knowledge, but it doesn't work for causal closure. Physicalists don't have to explain how non-physical properties interact with neurons. You do. Why isn't the sheer difficulty of integrating a non-physical property into the causal fabric of the brain a stronger reason to reject the property than the intuition is to accept it?

  ### 6. Evolution and Function
  If zombies are possible, then consciousness is not required for survival, reproduction, or complex behavior. Evolution is a miser; it doesn't select for expensive, causally inert features. If physicalism is false, consciousness looks like an evolutionary miracle or an accident. How do you account for the correlation between increasing neural complexity and increasing phenomenal richness if the richness itself does no selective work?

  ### 7. Vagueness and Fundamental Properties
  You argue that phenomenal properties are fundamental. But fundamental properties in physics (mass, charge, spin) are precise. Phenomenal properties seem inherently vague—there's no fact of the matter about exactly when a pain becomes an itch, or when a red experience becomes orange. How can vague properties be fundamental? If they aren't fundamental, what are they grounded in, and doesn't that ground risk being physical?

  ### 8. The Ignorance Hypothesis
  Many physicalists argue that the "Hard Problem" is just a symptom of our current ignorance, similar to how "vital force" seemed mysterious before biochemistry. You argue this is a category mistake. But given that we are physical organisms evolved to track physical threats and resources, why shouldn't we expect our cognitive architecture to be permanently blind to the identity between brain states and experience, even if that identity is real? Isn't "we are cognitively closed to the solution" a live option that undermines the force of the conceivability argument?

  ### 9. Theoretical Virtues and Cost
  Let's talk about theoretical cost. Physicalism offers a unified ontology where mind is what brain does. Your view offers a dualistic ontology where mind and brain are distinct but correlated. In every other area of science, when two things are perfectly correlated, we eventually find they are identical. At what point does the theoretical virtue of unity outweigh the pre-theoretical intuition of distinctness? Is there a "tipping point" where the complexity of your dualism becomes too high a price to pay for saving the intuition?

  ### 10. Falsifiability and Evidence
  Finally, I want to ask about the limits of your position. You've built a formidable defense against physicalist objections using two-dimensional semantics and conceivability. But this makes me wonder: what would actually count as evidence *against* your view? Is there any empirical discovery in neuroscience, or any conceptual argument, that would force you to say, "Okay, I was wrong, physicalism is true"? Or is the view structured in a way that makes it immune to falsification, and if so, isn't that a methodological problem for a claim about the natural world?
