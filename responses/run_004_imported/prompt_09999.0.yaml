prompt: |-
  I run a small philosophy podcast on the side (started it during lockdown and never managed to kill it off), and next month's guest has spent most of her career defending the zombie argument against physicalism -- not the bumper-sticker "I can imagine a zombie so dualism must be true" version, but the full two-dimensional-semantics machinery that's supposed to carry you from conceivability all the way to possibility once you've screened out the naive cases. I also teach a phil of mind seminar every other year and this is the one argument that never survives the first good question from a student, so honestly this is half research for my own lecture notes. One thing worth knowing going in: her go-to move whenever shes pressed on any of the hard bits is some version of "that's a problem for physicalists too, not just me," and then she moves on -- im hoping the questions can be built so that dodge doesn't quite work.

  Could you draft me eight to ten interview questions that don't just let her restate the master argument for the hundredth time? I want at least one question pressing on why "ideal, positive, primary" conceivability should be trusted about something as murky as phenomenal states, given how often modal intuitions have misfired elsewhere; one on how the two-dimensional reply is actually meant to block the Kripke-style move that saves "water is H2O" from the conceivability of water without H2O -- i.e. why phenomenal concepts are supposed to lack the primary/secondary intension gap that ordinary theoretical identities exploit; and one on the paradox of phenomenal judgment -- if my zombie twin sincerely reports being conscious for exactly the same reasons I do, what work is my actual consciousness doing in explaining my own report? For each of these three, add a follow-up that's already keyed to whatever answer she's most likely to give, so the question doesn't just die there. Maybe close with one question on what she'd actually accept as evidence against her own view, since I've always suspected the position is a bit too comfortably unfalsifiable and I'd love to watch her handle being told that to her face.
