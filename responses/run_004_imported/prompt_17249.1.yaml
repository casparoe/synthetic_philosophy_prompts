answer: |-
  The hearing room was airless, a box of wood and glass designed to dampen sound and ambition alike. Dr. Elara Vance sat at the witness table, her hands folded over a copy of the *Tractatus Politicus*. She had not brought the *Ethics*. Today was not about God or salvation; it was about the *Imperium*—the Sovereign Authority—and its survival.

  Senator Halloway leaned into the microphone. "Dr. Vance, the proposal before us is the CivicLink Initiative. It bypasses this body. Every citizen votes on every bill, in real time, via secure authentication. It is the ultimate realization of the democratic ideal. You are the nation's leading scholar on Spinoza's political theory. Spinoza was a democrat. Would he not endorse this as the perfection of the multitude's power?"

  Elara adjusted her glasses. She did not look at the senators, but at the camera feeding the public stream.

  "Senator, Spinoza defines natural right not by moral law, but by *potentia*—by power. A thing has a right to do exactly what it has the power to do. The right of the State is nothing other than the power of the multitude, determined not by passion, but guided as if by one mind."

  She paused, letting the distinction settle.

  "CivicLink does not increase the power of the State. It fragments it. Spinoza argues for large councils not because he loves the sound of voices, but because he understands the physics of the affects. He writes that it is harder to move a whole council to something foolish or wicked than to move one man. Why? Because in a deliberating body, conflicting passions cancel one another out. Anger meets caution; hope meets fear. Through this friction, the decision tends toward reason, or at least toward stability."

  She tapped the table.

  "Your application does the opposite. It isolates the voter. A citizen sits alone, looking at a screen, subjected to the immediate stimulus of the moment. There is no deliberation to filter the affect. There is only the *imitatio affectuum*—the imitation of the affects. When one person feels indignation, the app transmits it to a million others instantly. Fear and hope become contagious viruses. You are not building a democracy, Senator. You are building a mechanism to maximize the volatility of the multitude. You are loosening the affects from the very structure designed to restrain them."

  A murmur ran through the room. Halloway frowned. "So you argue the people are too irrational to rule themselves?"

  "I argue that freedom is not the license to obey every passing impulse. That is bondage. Freedom is living under the guidance of reason. The State's purpose is to free men from fear so they may live rationally. A system that monetizes and amplifies fear to generate votes diminishes the *potentia* of the Commonwealth. It makes the Sovereign weak. A weak Sovereign has less right to exist."

  Committee Member Rusk, a man known for his sharp, historical objections, cleared his throat. He had been waiting for this.

  "Dr. Vance, let's speak of this 'Sovereign' and who comprises it. You cite the *Tractatus Politicus* as your authority. But that text is unfinished. It breaks off mid-sentence in Chapter 11, precisely where Spinoza begins to argue that women are naturally subordinate to men and should be excluded from citizenship entirely. He claims they lack the strength of character to rule. If his system rests on natural power, and he arbitrarily excludes half the population based on prejudice, why should we trust his mechanics of deliberation? Isn't this just an argument for exclusion dressed up as stability?"

  Elara felt the trap close. The liberal answer would be to condemn Spinoza, to separate the man from the method. But she was not a liberal; she was a Spinozist. She had to use his own geometry to cut the knot.

  "You are correct that the text breaks off," Elara said, her voice steady. "And you are correct that he asserts women's exclusion. But you must read the break not as a death, but as a logical collapse. Spinoza's metaphysics is rigorous: Right is coextensive with Power. If a being has the capacity to reason, to strive (*conatus*), and to contribute to the stability of the State, it possesses natural right."

  She turned slightly toward Rusk.

  "Spinoza's claim about women was an empirical error regarding their *potentia*. He assumed their power was less than men's. History has corrected that empirical datum. Women possess the power of reason and the power to sustain the State. Therefore, by Spinoza's own definition of Right, to exclude them is to diminish the total power of the multitude. It is an injury to the Sovereign. It makes the State less rational, because it discards useful capacities."

  She leaned forward.

  "But notice the parallel to your app. Spinoza's error on women was a failure to recognize actual power. Your error with CivicLink is a failure to recognize actual *reason*. You claim the app empowers the citizen. But if the app subjects the citizen to the tyranny of immediate passion, it reduces their capacity to act rationally. It treats them as slaves to affect, not agents of reason."

  "Spinoza did not finish the argument on women because the logic of his own system was consuming his prejudice. If Right is Power, and the State needs maximum Power to persist, it cannot afford to exclude any source of rational capacity. Nor can it afford to amplify irrationality."

  She looked back at Halloway.

  "The large council is a machine. It is a technology designed to produce rational outcomes from passionate materials. It slows down the transmission of affects so that reason can catch up. Your app removes the machine. It leaves only the passion. You ask if Spinoza would see this as democracy achieved? No. He would see it as the multitude in a state of nature, warring against itself, governed by the fluctuation of hope and fear. He would call it sedition."

  "And the women?" Rusk pressed, unwilling to let the point dissolve. "Does his unfinished sentence condemn him?"

  "His unfinished sentence condemns *us* if we repeat the error," Elara replied. "He failed to see the power of women. Do not fail to see the power of deliberation. The *Tractatus* breaks off because the work of constructing a rational State is never finished. It requires constant adjustment to the realities of power. Excluding women weakened his proposed State. Replacing councils with apps will weaken ours. Both are failures of *potentia*. Both reduce the Sovereign's ability to persist."

  She closed the book.

  "Spinoza does not offer us a blueprint for a perfect world. He offers a mechanics of survival. If you wish to survive, do not hand the keys of the *Imperium* to an algorithm of affects. Keep the councils. Let the passions collide in the room, where they can be tempered. Do not let them loose in the wild."

  Halloway sat back, the silence in the room heavy, not with agreement, but with the weight of a machine suddenly seen in its naked gears.

  "The committee will recess," Halloway said quietly.

  Elara did not move as the gavel fell. She knew she had not won them over with morality. She had won nothing. She had only demonstrated that the proposal was, in Spinozist terms, *impotent*. And in politics, impotence is the only true sin.
