      *   **Setup:**
          *   Disagreement point $d = (0,0)$.
          *   Ideal point $I$: Infra max = 5, ML max = 4. So $I = (5, 4)$.
          *   Feasible Set $S$: Defined by Pareto frontier segments: $(0,4) \to (2,3)$ and $(2,3) \to (5,0)$.
          *   Let $x$ = Infra, $y$ = ML.
          *   Segment 1: From $(0,4)$ to $(2,3)$. Slope = $(3-4)/(2-0) = -0.5$. Eq: $y - 4 = -0.5(x - 0) \Rightarrow y = 4 - 0.5x$. Range: $x \in [0, 2]$.
          *   Segment 2: From $(2,3)$ to $(5,0)$. Slope = $(0-3)/(5-2) = -1$. Eq: $y - 0 = -1(x - 5) \Rightarrow y = 5 - x$. Range: $x \in [2, 5]$.
      *   **Nash Solution:** Maximize $N = (x - d_x)(y - d_y) = xy$ subject to frontier.
          *   Check Segment 1 ($y = 4 - 0.5x$): Max $x(4 - 0.5x) = 4x - 0.5x^2$. Derivative: $4 - x = 0 \Rightarrow x = 4$. But range is $[0, 2]$. So max is at boundary $x=2$. Value: $2 \times 3 = 6$.
          *   Check Segment 2 ($y = 5 - x$): Max $x(5 - x) = 5x - x^2$. Derivative: $5 - 2x = 0 \Rightarrow x = 2.5$. Range is $[2, 5]$. This is valid. Value: $2.5 \times 2.5 = 6.25$.
          *   Compare: $6.25 > 6$. So Nash point is $(2.5, 2.5)$.
