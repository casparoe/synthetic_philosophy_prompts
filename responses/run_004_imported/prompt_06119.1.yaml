      *   *KSS Interpretation:* "Equal proportional achievement" is exactly the definition of KSS (ratio of gain to ideal gain is equalized). This is accurate.
      *   *Axioms as "Smuggled Intuitions":* This is a very sharp philosophical insight. Axioms aren't neutral; they encode normative judgments. IIA implies that the *shape* of the rest of the feasible set matters, not just the ideal points. Monotonicity implies that improving someone's potential shouldn't hurt them. This is a strong point to make in a meeting.

  5.  **Verify the History/Philosophy (Gauthier, Raiffa):**
      *   *David Gauthier:* Wrote *Morals by Agreement* (1986). He uses "minimax relative concession."
      *   *Connection:* Minimax relative concession *is* equivalent to the Kalai-Smorodinsky solution (in the 2-person case with linear utility). Gauthier argues rational agents would agree to minimize the maximum relative concession made by any party. Relative concession = $(Ideal - Actual) / (Ideal - Disagreement)$. Minimizing the max concession is equivalent to equalizing the ratios of actual/ideal gains.
