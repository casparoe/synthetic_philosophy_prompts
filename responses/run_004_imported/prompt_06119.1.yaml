          *   Validate the "smuggled intuition" point (it's excellent).
          *   *Correction/Nuance:* Warn against calling Nash "equal-outcomes" generally. It happened here because the relevant frontier segment was symmetric ($x+y=5$). If the frontier were steeper, Nash would favor the party with more bargaining power (curvature). Nash is about *efficiency of surplus*, not equality.
