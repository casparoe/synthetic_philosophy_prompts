      *   Argument for Naomi: She correctly identifies that heroism requires a rational cost-benefit analysis when others are involved.
      *   *Decision:* **FINAL: Theo.** Why? Because Naomi's definition of supererogation in Move 1 was fundamentally flawed (it's not just about own safety), and her Move 3 relies on a premise (Human > Dog always) that is exactly what is being debated in the context of *heroic narrative*. In fiction, saving the dog *is* often coded as heroic precisely because it shows compassion beyond utilitarian calculus. Theo captures the *narrative* truth of heroism better, even if Naomi captures the *SOP* truth. Also, philosophically, challenging the hidden premise (Move 4) is a stronger move than asserting it (Move 3).

