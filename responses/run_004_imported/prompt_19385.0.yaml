  2.  **Analyze the Question & Kantian Theory:**
      *   **Part (a):**
          *   *Maxim:* "Whenever assisting a stranger in difficulty would cost me time or resources I would rather spend on myself, and I am confident that no one will think less of me for it, I will walk on and do nothing, on the grounds that other people's troubles are not my responsibility."
          *   *Task 1:* Apply the two-step universalizability procedure (Formula of Universal Law - FUL).
              *   Step 1: Conception (Contradiction in Conception - CC). Can it be conceived as a universal law of nature without contradiction?
              *   Step 2: Will (Contradiction in the Will - CW). Can a rational agent *will* this as a universal law?
          *   *Task 2:* State the type of duty (Perfect/Imperfect, To Self/To Others) with justification.
          *   *Kantian Standard:* This is the classic "Beneficence" example from the *Groundwork*.
              *   Step 1 (CC): It *can* be conceived. A world where no one helps is logically possible (unlike false promising).
              *   Step 2 (CW): It *cannot* be willed. As finite rational beings, we sometimes need the love/sympathy/help of others. To will a law where no one helps is to will away the help one might need oneself. This is a Contradiction in the Will.
              *   Duty Type: Imperfect Duty to Others. (Imperfect because it doesn't specify exactly when/how much to help, just that one must adopt the end of beneficence. To Others because it concerns how we treat other rational beings).
      *   **Part (b):**
          *   *Case:* False promising to secure a loan.
          *   *Task 1:* Explain the type of duty violated and why (referencing the procedure).
          *   *Task 2:* State whether Kant's grounds rest on bad social consequences or something else.
          *   *Kantian Standard:*
              *   Step 1 (CC): It *cannot* be conceived. If everyone made false promises when convenient, the institution of promising would collapse. No one would believe promises. The maxim becomes impossible to act upon.
              *   Duty Type: Perfect Duty to Others. (Perfect because it admits no exceptions; you simply cannot make false promises).
              *   Grounds: *Not* consequences. Kant is a deontologist. The contradiction is logical/conceptual regarding the institution of promising, not empirical about people being worse off. The focus is on the inconsistency of the will/maxim, not the outcome (credit drying up is a symptom of the conceptual collapse, but the *reason* it's wrong is the contradiction in the concept of a promise itself).

