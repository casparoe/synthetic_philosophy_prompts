answer: |-
  "Put the envelope away, Sam," Taylor said, stepping in front of the bank entrance. "We're going back to the motel."

  Sam brushed desert dust from their jacket. "Why? The transaction is complete. Causally, handing her that cash now has zero impact on whether she picked us up. The past is fixed."

  "If you'd run that algorithm back at the roadside, we'd be corpses," Taylor said. "She doesn't pick up liars. She picks up payers. If you're the kind of person who reasons 'the ride is done, so I won't pay,' you're the kind of person she leaves to bake."

  "But I *am* here," Sam said, gesturing to the paved sidewalk. "We're evaluating the decision node *now*. Given that I'm alive, paying is just lighting money on fire. It doesn't reach back and cause the ride. You're confusing correlation with causation."

  "I'm talking about policy selection," Taylor countered. "Rationality isn't scored on isolated snapshots. It's scored on the disposition you carry into the car. If your disposition is 'pay only when causally leverageable,' you don't get rides. You have to pay *because* it feels irrational right now. That's the tax for being the type who gets saved."

  "That's mysticism," Sam snapped. "I can't change my past disposition now. I can only change my current bank balance. Why should I suffer a definite loss to satisfy a counterfactual about who I *would* have been?"

  "Because you want to be the person who *is* alive in the counterfactual where you get stuck," Taylor said. "Look, if you walk away, you've won the battle but lost the war. You've proven you're the type who gets left behind. Next time, you die."

  "There might not be a next time," Sam said. "And even if there is, I can just pretend to be a payer next time."

  "She's good at telling lies, Sam. You can't fake the disposition if you know you're going to defect once you're safe. The reasoning *is* the tell." Taylor stepped closer. "You're free-riding. You're benefiting from the social contract of promise-keeping while secretly opting out because you think you're clever enough to escape the causal loop."

  "I'm not escaping a loop. I'm acknowledging reality," Sam said, though their hand tightened around the envelope. "The money is gone either way. But if I keep it, I have money *and* a ride. If I pay, I just have a ride."

  "You have a ride because you got lucky," Taylor said softly. "Not because you were rational. A rational agent wins. Not just once, but across the decision problem. Pay her."

  Sam looked down the street, then back at the envelope. "It feels like paying a ransom to a ghost."

  "It's paying tuition," Taylor said. "To the school of staying alive."

  Sam sighed, turning toward the motel. "Fine. But I'm writing a paper about how this feels wrong."

  "Write it," Taylor said. "Just make sure you mail the check."
