answer: |-
  Two Bayesians, **Tyler** and **Jessica**, are arguing in a seminar group chat. Tyler is a fan of "Rationalist Twitter"; Jessica is the person who actually reads the proofs.

  **Tyler:** Look, we've been going back and forth for an hour. You say the policy will fail, I say it will succeed. But Aumann's Agreement Theorem proves that two rational agents with a common prior cannot agree to disagree. So, logically, one of us is being irrational. Hint: It's not me.

  **Jessica:** Tyler, do we have a common prior?

  **Tyler:** We're both Bayesians, aren't we? That's basically a common prior.

  **Jessica:** That's like saying we both have the same phone number because we both own phones. My prior is based on ten years of development economics data. Your prior is based on a blog post you read this morning.

  **Tyler:** Fine. Assume a common prior. Just for the sake of argument.

  **Jessica:** If I assume your prior, I have to update to your conclusion. If you assume mine, you update to mine. But if we swap priors, we aren't two agents anymore; we're just one agent simulating two conversations. The theorem requires two distinct agents. You're asking me to solve the disagreement by ceasing to exist as an independent epistemic agent.

  **Tyler:** Okay, semantic stall. Let's just exchange posteriors. I'm at 0.9 probability of success. You?

  **Jessica:** 0.2.

  **Tyler:** Okay, update on my 0.9.

  **Jessica:** I did. Now I'm at 0.25. You update on my 0.2.

  **Tyler:** Okay, now I'm at 0.85. Update again.

  **Jessica:** 0.28.

  **Tyler:** 0.82.

  **Jessica:** Tyler, we're converging, but only because you're weighting my opinion at 5% and I'm weighting yours at 1%. We aren't finding the truth; we're just calculating how much we distrust each other.

  **Tyler:** It's still convergence! The theorem holds!

  **Jessica:** Does it? For the theorem to hold, our posteriors need to be *common knowledge*. I know your number, you know mine. But do I know that *you* know that *I* know that *you* know my number?

  **Tyler:** It's a group chat. It's right there.

  **Jessica:** It's Slack. You have notifications turned off. You didn't see my last message until three minutes later. During those three minutes, your posterior was different. So for that window, we didn't have common knowledge.

  **Tyler:** So?

  **Jessica:** So the "meet of our partitions" never actually stabilized. We're not on the same information set. We're just two people shouting probabilities into a void with a lag time.

  **Tyler:** You are being incredibly difficult. I'm invoking Aumann to end this argument.

  **Jessica:** You can't invoke Aumann to end an argument. Aumann proves that if we *were* finishing the argument, we would have already agreed. The fact that we are still arguing is empirical proof that the preconditions aren't met.

  **Tyler:** So what do we do?

  **Jessica:** We need to establish common knowledge of our posteriors without any noise or lag.

  **Tyler:** Okay. How?

  **Jessica:** We need to sit in a room, stare directly into each other's eyes, and telepathically transmit our probability distributions until our cognitive partitions merge.

  **Tyler:** ...

  **Jessica:** Or, we can both agree that we don't have a common prior, acknowledge that the theorem doesn't apply, and go get lunch.

  **Tyler:** Fine. Lunch. But I'm picking the place. I'm 0.9 sure it's good.

  **Jessica:** I'm 0.9 sure it's a chain restaurant.

  **Tyler:** See! We agree! We're both 0.9 sure of something!

  **Jessica:** Tyler, we are not sure of the *same* something.

  **Tyler:** Close enough. I'm blocking you until we converge.

  **Jessica:** You can't block me.

  **Tyler:** Why not?

  **Jessica:** If you block me, I can't see your posterior. You can't see mine. We lose common knowledge. The theorem is voided. We are legally allowed to disagree again.

  **Tyler:** ...Unblocking you.

  **Jessica:** Good. Now, about that lunch. I have a prior that you're paying.

  **Tyler:** Is that common knowledge?

  **Jessica:** It is now.
