prompt: |-
  Okay so in my formal epistemology seminar this week we covered Aumann's agreement theorem -- the result that if two Bayesians share a common prior and their posteriors on some event become common knowledge (not just known, but known-that-the-other-knows-it, all the way up), they literally can't end up disagreeing. Me and a couple classmates were joking after class about how this basically means "let's just agree to disagree" isn't something two rational people can actually say to each other, and somehow the conversation devolved into gossip about my TA's messy divorce (long story). Anyway, it got me thinking that someone should write an actual joke about this theorem, and I figured you'd be better at it than me.

  Could you write one for me? The catch is it has to be genuinely funny (or at least clever) to someone who actually understands the mechanics of the theorem, not just a generic "two rational people argue" joke that could be about literally any topic. Like, the punchline should turn on something real, e.g. the common prior assumption, or that weird iterative thing where if you just keep telling each other your updated probability over and over you're guaranteed to converge eventually. Bonus points if it also somehow poke fun at how people online (cough, rationalist twitter) love citing the theorem to browbeat people into agreeing with them, even though approximately nobody in a real argument actually has a common prior or common knowledge of each others posteriors.
