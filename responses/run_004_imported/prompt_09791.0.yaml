answer: |-
  This is a fantastic observation, and you are right to flag it: Bentham's manuscript (written c. 1785–1820, published by Crompton in 1978) is indeed more radically permissive in its *substance* than Mill's published *On Liberty* (1859).

  To answer your specific question: **No, Bentham's argument does not simply collapse into Mill's Harm Principle dressed up in calculus language.** While they reach similar liberal conclusions, the philosophical "work" is being done by different engines. Bentham offers a **substantive utilitarian defense** of the act itself, whereas Mill offers a **jurisdictional defense** of the agent.

  Here is the breakdown of the distinct philosophical mechanics at play, suitable for calibrating your footnote.

  ### 1. Bentham: The Elimination of "Mischief"
  Bentham's argument is purely act-utilitarian and operates by dissecting the crime itself. His goal is to prove that "paederasty" produces no net pain and therefore constitutes no "mischief."

  *   **The Rejection of Antipathy:** This is Bentham's most distinct move. He identifies that the primary drive for punishment is not harm, but "antipathy" (disgust/prejudice). In the *calculus*, he argues that the pain felt by observers due to their own prejudice cannot count as a valid "mischief" justifying punishment. If the only pain caused by the act is the disgust of others, that pain is illegitimate.
  *   **Counting the Pleasure:** Bentham is willing to enter the *pleasure* of the participants into the equation. He argues that since the act is consensual, it produces pleasure for the agents and (by his analysis) no primary pain for victims. Therefore, the act is, at worst, neutral, and the punishment is a definite negative.
  *   **The Conclusion:** The act should not be punished because **it is not harmful.** Bentham challenges the moral status of the act itself.

  ### 2. Mill: The Boundary of Jurisdiction
  Mill's argument in *On Liberty* is grounded in utility ("in the largest sense"), but it functions more like a deontological side-constraint.

  *   **The Harm Principle:** Mill does not necessarily argue that the act is "good" or even "neutral." He argues that whether the act is good or bad is **irrelevant** to the state. The philosophical work is done by drawing a boundary between *self-regarding* and *other-regarding* acts.
  *   **Autonomy over Calculus:** Mill shifts the weight from the *consequences of the act* to the *consequences of interference*. Interfering with self-regarding acts stunts human development and individuality.
  *   **The Conclusion:** The act should not be punished because **it is not the state's business.** Mill protects the *liberty* to choose, not necessarily the specific choice itself.

  ### 3. The Crucial Divergence (For your footnote)
  The difference lies in **vulnerability to empirical claims.**

  *   **Bentham is empirically vulnerable:** Because Bentham relies on the felicific calculus, his defense of toleration theoretically collapses if you could prove that homosexuality caused long-term social decay (secondary mischief). If the empirical data showed net pain, Bentham's utilitarianism would demand punishment. He defends the act by saying it *doesn't* cause harm.
  *   **Mill is structurally robust:** Mill's Harm Principle is designed to withstand that exact empirical claim. Even if society believes the act is morally degrading or socially harmful in the long run, Mill argues that coercion is *still* impermissible because it violates the sovereign sphere of the individual. He defends the *right* to the act, regardless of the act's utility.

  ### Summary for the Footnote
  You can characterize the distinction this way:

  > While both thinkers arrive at toleration, Bentham's argument in *Offences Against One's Self* is **substantively exculpatory**, utilizing the felicific calculus to demonstrate that consensual same-sex acts produce no net 'mischief' and that 'antipathy' constitutes an illegitimate ground for pain. Mill's argument in *On Liberty* is **procedurally jurisdictional**; he bypasses the moral valuation of the act entirely, erecting a Harm Principle that renders private consensual conduct immune to state interference regardless of its perceived utility. Bentham argues the act is harmless; Mill argues the act is private.

  **One final nuance:** Bentham's willingness to explicitly validate the pleasure of the "offender" is something Mill generally avoids in *On Liberty*. Mill's liberalism is often more ascetic; Bentham's is unashamedly hedonic. That is the distinctively utilitarian fingerprint in Bentham's manuscript.
