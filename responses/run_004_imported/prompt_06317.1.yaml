answer: |-
  This is a really tough spot to be in, and it's completely normal that you feel conflicted. You were put in a position where you had to choose between being a "good friend" in the moment (helping her seize an opportunity) and being a "good friend" in the long run (helping her achieve her goals).

  Here is the breakdown of what happened, why you feel guilty, and how to handle this dynamic moving forward.

  ### 1. Was you wrong to give it back?
  **The short answer is: Yes, but with compassion.**

  You broke the specific agreement you made. Priya didn't just ask you to hold the card; she explicitly scripted the scenario: *"No matter what... even if she begged, cried, or had some crazy story."* She knew her own weakness, and she tried to build a wall against it. By handing the card over, you opened the gate she asked you to keep locked.

  The clearest evidence that this was the wrong move is **Priya's own reaction.** After the dopamine hit of buying the tickets wore off, she told you, *"Maybe you shouldn't have given in."* Her "sober self" (the one planning for college) is disappointed in her "impulsive self" (the one who wanted the concert), and by extension, she's disappointed that you didn't hold the line.

  **However,** don't beat yourself up too much. You were manipulated by a perfect storm:
  *   **Midnight panic:** Decisions made late at night under emotional distress are rarely good ones.
  *   **FOMO (Fear Of Missing Out):** "One night only" creates artificial urgency.
  *   **Friendship pressure:** It is incredibly hard to watch a friend cry or panic and not try to fix it.

  You prioritized her immediate happiness over her long-term stability. That is a very human thing to do, even if it wasn't the right thing for the agreement.

  ### 2. How to tell the difference: "Emergency" vs. "Impulse"
  You asked how you are supposed to know when "this time is actually different." The truth is, **if you have to ask, it's probably an impulse.**

  When someone is trying to save money for a necessity (like a laptop for college), there are very few valid reasons to break that savings freeze. Here is a framework you can use to distinguish the two in the future:

  **A. The "Morning After" Test**
  Impulses are fueled by immediate emotion. If Priya asks for the card at midnight, the rule should be: *"I will give it to you at 10:00 AM tomorrow if you still want it."*
  *   **Impulse:** The feeling will fade overnight. She'll wake up and realize she needs the laptop more.
  *   **Genuine Need:** If it is truly essential, she will still want/need it after a full night's sleep and a clear head.

  **B. The "Life vs. Lifestyle" Test**
  *   **Emergency:** Medical issue, car breakdown needed to get to work/school, safety issue.
  *   **Lifestyle:** Concerts, clothes, dining out, limited-edition merch.
  *   *Verdict:* A concert, even a "one-night-only" one, is lifestyle. It does not trump college applications.

  **C. The Pattern Recognition**
  You mentioned she did this last year with her phone and found an "exception" within a week. **Believe the pattern, not the promise.** When someone has a history of impulsivity, their definition of "emergency" is often distorted. You have to be the external logic that they are currently lacking.

  ### 3. How to fix this and move forward
  You can't undo buying the tickets, but you can repair the accountability dynamic so you don't end up in this position again.

  **Have a reset conversation.**
  Since Priya already admitted you maybe shouldn't have caved, use that opening. Say something like:
  > "I've been thinking about what you said, that maybe I shouldn't have given you the card. I felt terrible saying no to you when you were so upset, but I realize now that I undermined the goal we set. I want to support you saving for this laptop. If we're going to keep doing this, I need us to agree on stricter rules so I'm not put in the position of choosing between your feelings and your goals."

  **Set new boundaries.**
  If she asks you to hold the card again (or if she asks you to hold onto the remaining savings goal), propose these rules:
  1.  **No Midnight Decisions:** You will not discuss money or return the card after 9 PM.
  2.  **The 24-Hour Hold:** If she claims there is an exception, she has to wait 24 hours. If she still wants it then, you can discuss it.
  3.  **Define "Emergency":** Write down what constitutes a valid reason to access the funds (e.g., medical, school fees). Concerts are not on the list.

  **Consider if this is fair to you.**
  Honestly, being someone's "financial willpower" is a heavy burden. It puts you in a parental role rather than a friendship role. It is okay to tell her:
  > "I care about you, but I don't think I'm the right person to hold your card. It puts too much pressure on our friendship when you're stressed. Maybe we should look into a savings account that locks funds automatically, so it's not up to me."

  ### Summary
  You didn't do anything malicious, but you did enable a behavior that Priya is actively trying to stop. That's why you feel guilty—your intuition knows you prioritized a fun night over her future.

  Use this guilt as a lesson. Being a good friend sometimes means being the "bad guy" in the moment so they can be the "winner" in the long run. Next time, let her be mad at you for a day, rather than letting her be disappointed in herself for a month.
