answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name].

  For those who *do* know me, you know I have a habit of overthinking things. Actually, [Bride] and [Groom] met in a decision theory reading group. So, honestly, if this relationship couldn't survive an over-analysis of its own utility functions, we wouldn't be here.

  But I want to talk briefly about why we are here. Specifically, why *this* room, with *these* people, matters.

  [Bride] and [Groom] love each other. That is a fact. If I asked you privately at the bar later, every single one of you would agree. The parents know it. The friends know it. Even the skeptical uncle in the back knows it.

  But there is a profound difference between all of us knowing that individually, and all of us knowing it *together*.

  In private, their love is a secret you keep. But out here, in the light, with all of us watching, it becomes something else. It becomes a foundation.

  There's an idea in logic that says a fact only changes the world when it becomes "common knowledge." Not just that we know it, but that we know *that we know it*. It's the difference between walking alone in the dark and turning on a light where everyone can see that everyone else sees it, too.

  That is what a wedding is. It isn't just a party. It isn't just theatre. It is the moment a private truth becomes a public resource.

  So, I am going to do my job as the best man/toast-giver. I am going to say something out loud that I know you all feel in your hearts. And I'm asking you to let this be the moment it locks into place.

  [Bride] and [Groom] are not just in love. They are good for each other. They make each other braver, kinder, and more themselves. And because of that, they deserve a community that holds them up when they get tired.

  That community is us. This room.

  For the nerds in the back: Yes, I know this assumes we are all rational actors who will update our priors and coordinate on a equilibrium of support.
  For the rest of the family: What that means is, when things get hard—and they will—we don't let them face it alone. We don't wait to be asked. We just show up.

  That is the deal. That is the contract. Not just the one they signed, but the one we are signing right now by witnessing this.

  So, if you believe that [Bride] and [Groom] are built for this life, and if you believe that *we* are the people who will help them live it...

  Please raise your glasses.

  To [Bride] and [Groom]. May your private joy always have a public home.
