      *   Ramsey was concerned with *optimal saving* to reach "bliss." If preventing extinction requires austerity that prevents reaching bliss, it's a complex optimization problem.
      *   Crucial point: Ramsey distinguished between *risk* and *uncertainty* (alongside Keynes). Existential risks (like AI) are often deep uncertainty. Ramsey might argue we cannot mathematically optimize against undefined probabilities as easily as climate change.

  9.  **Final Polish:** Check tone (scholarly, nuanced). Ensure all parts of the prompt are addressed (Stern/Nordhaus, Ramsey's ethics, Moore/Keynes ties, Existential Risk extension). (Self-Correction: Make sure to mention that Ramsey's zero discount rate doesn't mean zero *social* discount rate, as consumption growth matters.)

