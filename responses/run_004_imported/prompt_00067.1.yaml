      *   **Critical Engagement:** Consider whether van Inwagen's argument *really* forces us to the extremes, or if vague/contextualist alternatives work.
      *   **Task:** Reach and defend a verdict on which view is most plausible.
      *   **Justification:** Explain why the costs of the preferred view are more acceptable than the alternatives.

  2.  **Deconstruct the Special Composition Question (SCQ):**
      *   *Question:* Under what conditions do some things compose a further thing? (When does $xs$ compose $y$?)
      *   *The Trilemma:*
          1.  **Nihilism:** Never (except for simples). No composite objects.
          2.  **Universalism:** Always. Any $xs$ compose a $y$.
          3.  **Restricted Composition:** Sometimes. (The "Common Sense" view).

  3.  **Analyze van Inwagen's Challenge:**
      *   Van Inwagen (in *Material Beings*) argues that Restricted Composition is untenable because any specific criterion (contact, fastening, life) seems arbitrary or leads to sorites paradoxes.
      *   If composition isn't universal or never, where do we draw the line? Why *here* and not *there*?
      *   This pushes us toward the "extremes" (Nihilism or Universalism) because they offer precise, non-arbitrary principles.

  4.  **Evaluate the Alternatives (Vagueness/Contextualism):**
      *   *Vagueness:* Maybe composition is vague. There's no sharp line.
      *   *Contextualism:* Maybe "compose" changes meaning based on context.
      *   *Counter-argument:* Van Inwagen and others (like Sider) argue that ontological existence shouldn't be vague or context-dependent. Existence is fundamental.

  5.  **Formulate a Verdict:**
