      *   *Alternative Strategy:* Defend a **Moderate Restricted View** (e.g., Organicism or Brutalism) and argue van Inwagen is too demanding.
      *   *Selection:* The prompt asks to engage with van Inwagen's push toward extremes. It asks to justify why the costs of the *preferred* view are acceptable. Defending Universalism allows for a strong engagement with the "trout-turkey" objection. Defending Nihilism allows for engagement with parsimony.
