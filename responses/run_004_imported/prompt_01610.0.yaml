      *   *Correction:* Focus on the specific text provided. Locke says "he is not at liberty." He doesn't explicitly exonerate him from responsibility here, but his general theory links liberty to accountability.
      *   *Frankfurt's nuance:* Frankfurt cases rely on the "actual sequence" vs. "alternative sequence" distinction. Locke doesn't have this machinery.
