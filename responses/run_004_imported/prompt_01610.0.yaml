          *   *Counterfactuals:* Locke's barrier is physical/actual. Frankfurt's is counterfactual.
      *   **Section 5: The Missing Bridge.** Explain that to get from Locke to Frankfurt, you need to argue that Responsibility tracks Voluntariness, not Liberty. Locke might resist this.
      *   **Conclusion:** Summarize. Locke is a precursor in *structure* (separating concepts), but not in *conclusion* (responsibility without alternatives).

