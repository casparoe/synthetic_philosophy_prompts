      *   **Difference 2: The Normative Stakes.**
          *   Locke: In the locked room, the man is *not free*. For Locke, if you aren't free, you generally aren't held accountable in the same way (though Locke's ethics are complex). The lack of liberty *matters* for Locke.
          *   Frankfurt: In the Frankfurt case, the agent *is responsible* despite lacking alternatives. The lack of alternatives *doesn't matter* for responsibility.
      *   **Difference 3: The Mechanism of Constraint.**
          *   Locke: Physical constraint (locked door). The constraint is actual.
          *   Frankfurt: Counterfactual intervener (Black). The constraint is latent/unactualized. This is crucial. In Locke's case, if the man *wanted* to leave, he *would* fail. In Frankfurt's case, if Jones *wanted* to vote B, Black *would* intervene, but since Jones didn't want to, the causal history is "clean."
      *   **The Gap:** Locke shows $Voluntary \nrightarrow Liberty$. Frankfurt shows $Responsibility \nrightarrow Alternative Possibilities$. To get from Locke to Frankfurt, you need a bridge premise: "Responsibility depends on Voluntariness, not Liberty." Locke might actually *disagree* with that bridge. Locke often ties accountability to the power to do otherwise.

