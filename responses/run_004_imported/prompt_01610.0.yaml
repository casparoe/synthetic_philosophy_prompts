  2.  **Deconstruct Locke's Position:**
      *   **Goal:** Locke is doing conceptual analysis (semantics/metaphysics of mind), not primarily ethics. He wants to define terms clearly to avoid confusion in later arguments (including ethics/theology).
      *   **Definition of Liberty:** Power to act or forbear according to the mind's preference.
      *   **Definition of Volition/Will:** The preference itself.
      *   **The Locked Room Case:**
          *   Agent prefers to stay.
          *   Agent stays.
          *   Action is *voluntary* (matches preference).
          *   Agent is *not at liberty* (cannot leave even if he wanted to).
      *   **Conclusion:** Liberty belongs to the *agent*, not the *will*. Liberty requires the power of alternative action *if* preferred. Voluntariness does not.
      *   **Implication for Responsibility:** Locke *does* care about responsibility elsewhere, but here he is establishing the *conditions of freedom*. For Locke, moral accountability usually *does* require liberty (in his sense). If you are locked in, you aren't free, even if you act voluntarily.

  3.  **Deconstruct Frankfurt's Position:**
      *   **Goal:** To refute the Principle of Alternative Possibilities (PAP). PAP: "A person is morally responsible for what he has done only if he could have done otherwise."
      *   **The Frankfurt Case:** Jones decides to vote for Candidate A on his own. Black (a counterfactual intervener) wants Jones to vote for A. Black will intervene *only if* Jones shows signs of voting for B. Jones votes for A on his own. Black does nothing.
      *   **Result:** Jones could *not* have done otherwise (Black would have forced him). Yet, Jones *is* morally responsible (because Black didn't actually intervene; Jones acted on his own reasons).
      *   **Conclusion:** Moral responsibility does *not* require alternative possibilities.
      *   **Key Distinction:** Frankfurt is targeting *moral responsibility*, not just the definition of "freedom" or "voluntariness."

  4.  **Compare and Contrast (The Core Analysis):**
