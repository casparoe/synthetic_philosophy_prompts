      *   *Counter-Claim:* The Precautionary Principle. Given the uncertainty and the high stakes (suffering), policy often acts on *probability* of sentience rather than *certainty*.
      *   *Conclusion:* Policy isn't just about definitive proof of qualia; it's about risk management.

