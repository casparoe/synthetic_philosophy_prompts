answer: |-
  This is a fantastic passage to get stuck on. Broad is notoriously dense, but he's also precise in a way that cuts through modern hand-waving. Your roommate sent you this because she knows you're using "emergent" to mean "surprisingly complex," while Broad uses it to mean "fundamentally irreducible."

  Here is the unpacking you need to settle the bet.

  ### 1. The Archangel: It's Not About Compute
  You asked what the archangel is doing and whether his failure is about data/compute.

  **The Short Answer:** No. In Broad's argument, the Archangel has **infinite compute and perfect data.**

  **The ML Translation:** Imagine you have a model where you know every single weight, every bias, the exact architecture, the full training dataset, and the exact mathematical laws of gradient descent. You also have infinite GPU hours to run the simulation.
  *   **Mechanistic View:** If the system is mechanistic, you can *deduce* the output behavior from those weights. It might be computationally expensive, but it is *theoretically possible*.
  *   **Broad's Emergent View:** Broad is arguing that for certain systems (like chemical compounds), even with perfect knowledge of the parts (atoms) and infinite compute, the behavior of the whole (silver-chloride) is **mathematically undeducible** from the parts.

  **Why?** Because Broad believes nature has "brute laws" that only kick in at higher levels of complexity.
  *   Level 1 (Atoms): Has Laws A.
  *   Level 2 (Compounds): Has Laws B.
  *   **The Kicker:** Laws B cannot be derived from Laws A. They just *start happening* when you arrange atoms in a specific way.

  So, if the Archangel fails to predict the properties of silver-chloride, it's not because he's not smart enough. It's because **the information isn't there in the atoms.** The property literally does not exist until the compound exists. It is an *ontological* claim (about reality), not an *epistemic* claim (about knowledge).

  ### 2. The Silver/Chlorine vs. Ammonia Smell Slide
  You noticed he moves from chemical properties (reactivity, structure) to sensory properties (smell) and wondered if he's changing the subject.

  **He isn't sliding; he's doubling down.**
  Most modern scientists would say chemical reactivity reduces to physics (mechanistic), but smell is subjective (qualia). Broad rejects this. To Broad, **chemical reactivity is just as "mental" or irreducible as smell.**

  *   **Silver/Chlorine:** He's saying you can't deduce chemical bonding behavior just from knowing the isolated atoms.
  *   **Ammonia Smell:** He's saying you can't deduce the *experience* of the smell from the structure.

  He uses the smell example because it's the intuition pump that makes you feel the gap. It feels obvious that you can't deduce "smell" from "math." Broad's radical claim is that you can't deduce "chemical bonding" from "atom math" either.

  **Is it proto-Mary's Room?** Yes, absolutely. Frank Jackson's "Mary the Color Scientist" (1982) is basically a modernized version of Broad's Archangel smelling ammonia. Broad is arguing that physical knowledge is incomplete, not just regarding consciousness, but regarding macro-physics too.

  ### 3. The Million-Dollar Question: Are LLM Abilities "Emergent" in Broad's Sense?
  If you want to win the argument, here is the hard truth: **Broad would laugh at the idea that LLM abilities are emergent in his sense.**

  Here is the breakdown you can use at the next meeting:

  **1. The Deduction Test**
  *   **Broad's Criterion:** Can an Archangel (infinite compute, perfect knowledge of parts) predict the property?
      *   **Broad's Emergence:** No. The property is fundamentally new.
      *   **LLM "Emergence":** **Yes.** In principle, if you knew the weights, the architecture, and the training data, the output is deterministically fixed. The "emergent ability" (like chain-of-thought reasoning) is hidden in the weights *before* it manifests in behavior. It is compressible, in principle, to the micro-level math.

  **2. The Mechanism**
  *   LLMs are purely mechanistic systems. They are matrix multiplications and non-linearities all the way down. Broad's emergence requires **trans-ordinal laws**—new laws of nature that appear only at higher levels of complexity.
  *   There are no new laws of physics turning on when a transformer model hits 100B parameters. It's just the same math, scaled up.

  **3. The Verdict**
  *   **ML Engineers:** Are using "emergent" to mean **"practically unpredictable due to complexity."** (This is often called *Weak Emergence* in philosophy).
  *   **Broad:** Is using "emergent" to mean **"fundamentally unpredictable due to ontological novelty."** (This is *Strong Emergence*).

  **How to tell your roommate:**
  She is right that you are misusing the term philosophically. Broad would classify LLM abilities as **Resultant** properties, not Emergent ones. They are the result of complex interactions of parts, fully determined by the parts, even if they are surprising to us humans with limited compute.

  **How to tell your colleagues:**
  The "Emergent Abilities are a Mirage" paper (Schaeffer et al.) is actually closer to Broad's intuition than the proponents are. If the abilities disappear when you change the metric or the scale linearly, they aren't fundamental properties of the system. But even if they are real capabilities, they are **mechanistic surprises**, not **ontological novelties**.

  ### Summary for the Argument
  1.  **The Archangel** represents infinite compute/data. If he can't predict it, the property doesn't exist in the parts.
  2.  **The Smell** isn't a slide; Broad thinks *all* macro-properties (even chemical ones) are irreducible to micro-properties.
  3.  **LLMs** are mechanistic. Their "emergence" is just complexity hiding determinism. Broad would say you are describing **epistemic emergence** (we don't know how it works), not **ontological emergence** (nature doesn't know how it works until it happens).

  You lose on the definition, but you win on the science. LLMs are cool, but they aren't magic, and Broad would be the first to tell you that.
