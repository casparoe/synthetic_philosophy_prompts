answer: |-
  It is a distinct pleasure to speak with someone who has moved from teaching the formalism to wrestling with the ontology. You have hit upon precisely the pivot point where the "shut up and calculate" generation often stops, but where the foundational debate actually begins. Maudlin is the perfect guide for this, precisely because he is unsparing about the physical implications that standard textbook treatments gloss over.

  The insight you are referencing—often attributed to Jon Jarrett (1984) and popularized by Abner Shimony—is that Bell's single condition of "Local Causality" (or factorizability) is actually a conjunction of two distinct physical assumptions. When Bell's inequality is violated, logic tells us at least one of them must fail, but it does not tell us *which* one. Distinguishing them allows us to diagnose *how* nature is non-local.

  Here is the conceptual decomposition, the connection to relativity, and how the major interpretations map onto it.

  ### 1. The Decomposition: Parameter vs. Outcome Independence

  Bell's locality condition requires that the joint probability of outcomes $A$ and $B$, given settings $a$ and $b$ and a complete state description $\lambda$, factorizes:
  $$P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$$

  Jarrett showed this factorization is mathematically equivalent to the conjunction of two separate conditions.

  **Parameter Independence (PI)**
  *   **The Condition:** The probability of an outcome at one wing does not depend on the *setting* of the apparatus at the distant wing.
  *   **Conceptually:** "What I measure here should not depend on which knob you turn over there."
  *   **What it forbids:** It forbids a direct causal influence from the distant *choice of measurement* to the local *result*. If PI holds, the distant experimenter cannot affect your local statistics by changing their setup.

  **Outcome Independence (OI)**
  *   **The Condition:** The probability of an outcome at one wing does not depend on the *outcome* obtained at the distant wing (given the settings and $\lambda$).
  *   **Conceptually:** "What result I get here should not depend on what result you got over there."
  *   **What it forbids:** It forbids the outcomes themselves from being directly linked. If OI holds, once you account for the common cause $\lambda$ (the hidden variables), the outcomes should be statistically independent. Any remaining correlation would imply a direct link between the events $A$ and $B$.

  Bell's "Locality" is simply **PI + OI**. To violate Bell's inequality, nature must violate at least one.

  ### 2. The Relativity Connection: Why Only PI Matters for Signalling

  This is the crux of the "peaceful coexistence" argument often offered to reconcile QM with Special Relativity.

  **Parameter Independence is No-Signalling.**
  If PI is violated, then the probability distribution of outcomes at wing $A$ changes depending on the setting $b$ chosen at wing $B$. Since the experimenter at $B$ is free to choose $b$, they can modulate the statistics at $A$. By averaging over many runs, $A$ can decode a message sent by $B$. This is superluminal signalling, which is strictly forbidden by Special Relativity (as it leads to causal loops in some frames).

  **Outcome Independence is Compatible with Relativity (Operationally).**
  If OI is violated but PI holds, the outcomes are correlated in a way that cannot be explained by $\lambda$ alone, *but* the marginal statistics at $A$ do not change based on $B$'s setting.
  Why? Because the outcome at $B$ is fundamentally random (or at least uncontrollable). Even if $A$'s result depends on $B$'s result, $B$ cannot *force* a specific result to send a signal. $A$ just sees random noise, identical regardless of what $B$ does. The correlation is only visible when comparing notes later (subluminally).

  Therefore, standard Quantum Mechanics (which respects the No-Signalling theorem) must satisfy **Parameter Independence** (operationally) and violate **Outcome Independence**. This is the standard "Orthodox" diagnosis: the world is non-local in its correlations (OI violation), but not in its controllable influences (PI satisfaction).

  ### 3. Interpretations: Who Violates What?

  Here is where the conceptual landscape becomes fascinating. Different interpretations of QM reproduce the same experimental predictions but locate the non-locality in different halves of the Jarrett decomposition.

  **Orthodox Quantum Mechanics (Collapse Theories)**
  *   **Verdict:** Satisfies PI, Violates OI.
  *   **The Picture:** When a measurement occurs at wing $B$, the wavefunction collapses globally. This instantaneous collapse updates the physical state at wing $A$. Consequently, the probability of outcome $A$ depends on the *outcome* at $B$ (because the state at $A$ is now an eigenstate correlated with $B$'s result).
  *   **Why PI holds:** The collapse is triggered by the interaction at $B$, but the *statistics* at $A$ remain unchanged regardless of $B$'s setting. You cannot use the collapse to signal.
  *   **Conceptual Cost:** You have to accept a physical process (collapse) that connects spacelike separated outcomes directly, violating OI, while somehow remaining "causally benign" regarding relativity.

  **Bohmian Mechanics (Pilot Wave)**
  *   **Verdict:** Violates PI, Satisfies OI.
  *   **The Picture:** This is often counter-intuitive for those used to the standard classification. In Bohmian mechanics, particles have definite trajectories determined by the guiding equation. The velocity of particle 1 depends on the positions of all other particles *and* the external potential (the magnetic field settings).
  *   **Why PI is Violated:** The dynamics are explicitly non-local. The trajectory of particle 1 depends on the *setting* $b$ at wing 2. Ontologically, Parameter Independence is dead.
  *   **Why OI is Satisfied:** The theory is deterministic. Given $\lambda$ (the exact initial positions of all particles), the outcomes $A$ and $B$ are fully determined. Therefore, $P(A | B, \lambda) = P(A | \lambda)$ (both are 0 or 1). The outcomes are independent conditional on $\lambda$.
  *   **The Signalling Save:** If Bohm violates PI, why can't we signal? Because we cannot control $\lambda$. We cannot prepare the particles with precise enough positions to exploit the dependence on setting $b$. The "Quantum Equilibrium Hypothesis" ($\rho = |\psi|^2$) ensures that when we average over our ignorance of $\lambda$, the operational statistics respect No-Signalling.
  *   **Conceptual Cost:** You have to accept explicit, dynamical superluminal influence (violating PI), hidden from us only by our inability to control the hidden variables.

  ### 4. The Maudlin Caveat (Crucial for your reading)

  Since you are working through Maudlin, I must note that he is deeply skeptical of the comfort this decomposition provides.

  Maudlin argues that the Jarrett/Shimony split is metaphysically misleading. He contends that **any** violation of Bell's inequalities implies a causal structure that is incompatible with the spirit of Relativity, regardless of whether it is PI or OI that fails.

  His argument rests on Reichenbach's Common Cause Principle. If two events are correlated and neither causes the other, there must be a common cause in their past. Bell's theorem rules out local common causes ($\lambda$). Therefore, there must be a direct causal link between the wings.
  *   If Orthodox QM violates OI, it posits a link between the *outcomes*. Maudlin argues that for this to explain the correlation, there must be a physical influence traveling between them.
  *   If that influence travels faster than light, it defines a preferred frame (violating Lorentz invariance), even if it cannot be used for signalling.

  Maudlin's point is that "No-Signalling" is a pragmatic constraint, not an ontological one. Relativity is a theory about the structure of spacetime and causality, not just about our ability to send telegrams. If Bohmian mechanics has particles moving instantaneously across space, or if Collapse theories have wavefunctions updating instantaneously, both posit a physical reality that picks out a preferred simultaneity slice, even if the empirical predictions mask it.

  ### Summary

  *   **Bell Locality** = **Parameter Independence** (Settings don't affect distant probs) + **Outcome Independence** (Outcomes don't affect distant probs).
  *   **Relativity/Signalling:** Only **Parameter Independence** is required to prevent superluminal signalling. **Outcome Independence** can be violated without allowing communication.
  *   **Orthodox QM:** Saves Relativity (operationally) by satisfying PI, but pays the price of violating OI (spooky correlation of outcomes).
  *   **Bohmian Mechanics:** Saves Determinism (and OI), but pays the price of violating PI (explicit dynamical non-locality), hiding the signalling possibility behind the uncertainty of $\lambda$.
  *   **Maudlin's Warning:** Don't get too comfortable. Both violations imply a causal structure that sits uneasily with the geometric spirit of Special Relativity, regardless of signalling constraints.

  It is a profound shift in perspective to realize that "Non-locality" is not a monolith. It is a menu of options, and every interpretation of quantum mechanics must order from it. Enjoy the rest of Maudlin; he pulls no punches on the consequences of that menu.
