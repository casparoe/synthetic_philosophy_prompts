answer: |-
  Epistemological disjunctivism (ED) does not succeed in defusing the argument from illusion on its own terms; it is quietly parasitic on the metaphysical thesis it claims to bracket. Pritchard's project hinges on the claim that in the good case, the subject's rational support is both factive ("I see that *p*") and reflectively accessible. However, maintaining metaphysical neutrality while insisting on reflective accessibility creates a fatal tension. If one remains neutral on the metaphysics of experience, one must allow for the possibility that the good case and the bad case share a common fundamental mental nature (the "common factor" view). But if the underlying mental state is metaphysically continuous across both cases, the difference between them is merely a matter of external truth conditions. An external truth condition is not reflectively accessible to the subject; I cannot tell by reflection alone whether the world is cooperating with my internal state. Therefore, if the factive reason is truly accessible, the difference between the good and bad cases cannot be merely external—it must be internal to the nature of the experience itself.

  This is where the sharpest version of the objection lands: if hallucinating subjects only ever have non-factive support, what explains the asymmetry in epistemic standing if not something metaphysical? For ED to work, the subject must be able to distinguish (or at least have access to) the factive reason in the good case. If the metaphysics are neutral, the subject in the good case is in the same fundamental mental state as the subject in the bad case, merely accompanied by a matching fact. But then the "factive reason" collapses into a non-factive state plus a lucky coincidence, which undermines the claim that the reason itself provides the justification. To secure the epistemic asymmetry Pritchard desires, the good case must offer a kind of contact with reality that the bad case lacks *by definition*. This requires a metaphysical disjunction: the veridical experience is constituted by the object, while the hallucination is not. Without this metaphysical ground, the claim that the factive reason is accessible becomes unintelligible, as there is no introspective marker to distinguish the factive state from the non-factive one.

  Consequently, epistemological disjunctivism cannot stand as a freestanding solution to the argument from illusion. It succeeds only by covertly importing the metaphysical commitments of naive realism or McDowellian disjunctivism. The argument from illusion attempts to level the epistemic playing field by generalizing from the bad case; ED attempts to un-level it by positing a superior epistemic status in the good case. But you cannot have that superior status without a metaphysical explanation for why the good case is superior *to the subject*. To claim the epistemic thesis while remaining neutral on the metaphysics is to try to harvest the crop without planting the seeds. ED is a viable position, but only if it drops the pretense of neutrality and acknowledges that the epistemology of perception supervenes on its metaphysics.
