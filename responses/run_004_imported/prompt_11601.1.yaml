answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I have the privilege of being [Grandmother's Name]'s grandson. I'm also a backend engineer, which means I spend my days trying to make complex systems behave logically. So, when I started thinking about what to say for a woman who has spent thirty-six years teaching the logic of the ancient world, I realized I was at a disadvantage. You don't debug a mind like hers. You just run the code and learn from the output.

  As many of you know, Grandma is a professor of Latin and Roman History. And for nearly fifty years, she has lived by a specific text: Cicero's *De Senectute*, or "On Old Age." It's a dialogue where the elder statesman Cato explains why getting old isn't a decline, but a different kind of power.

  Now, usually, when people quote the classics at a birthday party, it's to offer comfort about what comes *after* this life. But anyone who has sat in Grandma's classroom knows she values precision over comfort. She taught us that Cato's real wisdom isn't in the metaphysics at the end of the book, but in the mechanics of living while you're here.

  Cato argues that while youth has physical strength, old age possesses authority and judgment. Grandma, we see this every year. You might not be able to kneel in the garden beds anymore, and your hands might not prune the roses like they used to. But at the Thanksgiving table? You still out-argue every single one of us. You have traded the strength of the back for the strength of the mind, and frankly, it's a trade that has worked out in your favor.

  Cato also writes extensively about farming as the ideal occupation for later life, because it requires patience and faith in the future. I think you've applied that to everything. I've heard you debate the merits of heirloom tomatoes with the same grammatical precision you once applied to the subjunctive mood. And looking around the room, I see the harvest of that cultivation. There are three of your former students here tonight, now in their sixties, still coming to your house once a month to argue about translation choices. That is a rare thing. To teach is to plant seeds you may never sit under, but you've managed to keep tending the orchard long after the first fruit fell.

  There is one image from that book that I know resonates most deeply with you. Near the end, Cicero writes about death not as a violence, but as a ripeness. He says that young people die like green fruit torn forcibly from the branch, but the old die like ripe fruit that falls easily when it is ready.

  I know you don't care for the passages where Cicero speculates about where that fruit goes after it falls. You've made it clear that you find comfort in the ripeness itself, not in what happens in the basket. And I respect that. It makes this moment more precious, not less. It means we aren't celebrating a prelude to something else. We are celebrating the completeness of *this*.

  Ninety years is a long time to cultivate a life. It is a long time to sharpen a mind, to tend a garden, and to teach students how to read the world carefully. You have shown us that aging isn't about holding on to youth; it's about fully becoming what you are.

  So, I'd like to propose a toast. Not to the future, and not to the past, but to the present tense. To the authority of your judgment, the patience of your garden, and the ripe, full reality of you being here with us tonight.

  To Grandma.
