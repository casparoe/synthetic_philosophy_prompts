answer: |-
  This is one of the most profound ethical dilemmas a person can face, precisely because it sits at the intersection of abstract moral philosophy and visceral physical reality. You are asking two distinct but intertwined questions: first, whether the *process* (the distance, the paperwork) alters the *obligation*; and second, if an obligation exists, what its *limits* are.

  There is no consensus answer in ethics, but there are frameworks that might help you clarify your own position.

  ### 1. Does the distance change what you owe?

  Your intuition about the "collapsed at dinner" scenario is a classic philosophical puzzle. It touches on the distinction between **negative duties** (the duty not to harm) and **positive duties** (the duty to help).

  In the "collapsed at dinner" scenario, the intervention feels immediate and the causal link is direct. In the transplant scenario, the causal link is mediated by technology, time, and bureaucracy. However, most ethicists would argue that the *moral value* of the life saved is identical in both cases. The distance does not change the outcome for the recipient.

  So why does it feel different?

  **The Mediation of Consent**
  The paperwork and the waiting period are not just bureaucratic hurdles; they are moral buffers. In the emergency scenario, you are reacting to an immediate crisis. Your autonomy is compressed. In the transplant scenario, the system is designed to protect *your* autonomy. The "distance" allows you to distinguish between a reflex and a commitment.
  *   **Argument:** The distance doesn't change what she *needs*, but it changes the nature of *your action*. It shifts the act from a "rescue" (stopping an immediate harm) to a "sacrifice" (voluntarily undertaking a burden).
  *   **Implication:** Because it is a sacrifice rather than a rescue, it moves from the realm of strict duty toward the realm of what philosophers call **supererogation**—acts that are morally praiseworthy but not strictly required.

  **Bodily Autonomy (The Violinist Analogy)**
  The philosopher Judith Jarvis Thomson proposed a famous thought experiment: You wake up hooked up to a famous violinist who needs your kidneys for nine months to survive. You didn't agree to this. Are you morally obligated to stay hooked up?
  *   Thomson argues **no**. Even if the violinist is innocent and will die without you, you have a right to bodily autonomy that trumps his right to life.
  *   **Application:** In your case, you *did* volunteer for the screening, which complicates the analogy. However, the core principle remains: no human being is morally required to use their body as life-support for another, even a stranger, if it involves significant physical intrusion. The "distance" highlights that this is an intrusion you must invite, not one imposed by fate.

  ### 2. Where is the line drawn? (The Demandingness Objection)

  This is your second, and perhaps more terrifying, question: *If I owe her a kidney, what else do I owe?* If morality demands this, does it demand everything?

  This is known in ethics as the **Demandingness Objection**. If we accept a utilitarian view (maximize good for the greatest number), then yes, you should keep giving until giving more harms you as much as it helps them. But almost no one lives this way, and many ethicists argue this is not how morality works.

  **The Threshold of Significant Sacrifice**
  Most moral frameworks draw a line at "significant sacrifice."
  *   **Low Cost:** Giving $50 to a charity that saves a life? Many argue this is obligatory.
  *   **Medium Cost:** Giving a pint of blood? Obligatory or near-obligatory.
  *   **High Cost:** Giving a kidney? This involves surgery, pain, recovery time, and long-term health risks. This crosses the threshold into "significant sacrifice."

  **Why the line stops at the kidney**
  You asked what stops this reasoning well short of a kidney. The answer lies in the **integrity of the self**.
  *   Morality generally assumes you are a separate person with your own life to lead. You are not a resource to be harvested.
  *   If you give a kidney, you retain your ability to live a full life, work, and care for others. If you were asked to give *two* kidneys, or to donate bone marrow repeatedly until your health failed, the demand would violate your status as an end in yourself.
  *   Therefore, a single kidney donation is often viewed as the **upper limit** of what can be asked of a stranger. It is the ceiling, not the floor. Accepting this does not open a floodgate; it builds a dam. You can reason: "I am willing to go to the maximum limit of bodily sacrifice, but no further." That is a coherent moral position.

  ### 3. Reframing the Decision: Duty vs. Gift

  The tension you feel comes from trying to categorize this act as either **Required** or **Optional**.
  *   If it is **Required**, saying "no" makes you complicit in her suffering (as your brother fears, but for different reasons).
  *   If it is **Optional**, saying "yes" makes you a hero, but saying "no" leaves you feeling like you failed a test.

  There is a third category: **A Moral Gift.**

  Consider that the "distance" and "paperwork" exist to ensure that if you say yes, it is a gift, not a payment on a debt.
  *   If you view this as a **debt**, you will resent the cost. You will look at the scar and feel you paid a bill you didn't owe.
  *   If you view this as a **gift**, you acknowledge that you owe her nothing, but you *choose* to give her something.

  Your brother says you "owe a near-stranger nothing." He is technically correct regarding *debt*. You did not cause her kidney failure. You are not responsible for her illness. But he is incorrect if he implies you cannot *choose* to become responsible.

  ### Summary for your deliberation

  1.  **The Distance:** The paperwork does not change the value of her life, but it changes the nature of your act from "rescue" to "sacrifice." This makes it less of a strict duty and more of a profound choice.
  2.  **The Limit:** Agreeing to this does not commit you to endless sacrifice. A kidney is widely considered the upper bound of bodily demand. You can say, "This is the most I can give," without contradicting yourself.
  3.  **The Motivation:** Ask yourself about the "No."
      *   If you say "No" because you fear the surgery, the pain, or the impact on your ability to care for your own dependents, that is a valid assertion of bodily autonomy and self-preservation.
      *   If you say "No" solely because "she is a stranger," ask yourself if that distinction holds weight against the magnitude of her need.
  4.  **The Aftermath:** Can you donate without resentment? If you do this, you must do it as a complete gift. If you harbor a secret expectation of gratitude or moral superiority, the recovery will be harder. If you say no, can you make peace with the "dinner table collapse" intuition without self-loathing?

  **The Verdict of Ethics:**
  Ethics does not demand you give the kidney. Bodily autonomy is a trump card. However, ethics also suggests that if you *can* save a life at a cost that does not ruin your own, doing so is one of the highest moral actions available to a human being.

  The paperwork didn't create the obligation; it created the space for you to choose whether to accept it. Your brother sees the risk to you. Your intuition sees the life of her. Both are real. The decision is not about calculating the "correct" answer, but about deciding which truth you want to embody.
