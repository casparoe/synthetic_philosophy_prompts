      *   **Conflict:** The user feels a moral pull to donate (intuitively feeling they *should* if it were an emergency) but faces practical risks (surgery, recovery time) and social pushback (brother says they're crazy, owe nothing).
      *   **Core Philosophical Question:** Does the *distance* (temporal, procedural, emotional) change the moral obligation? Is the difference between "letting die" (omission) and "actively cutting" (commission) morally significant here, or just psychological?
      *   **Secondary Question:** If there *is* an obligation, where is the limit? (The "demandingness" objection: If I owe a kidney, do I owe everything?)
      *   **Needs:** Not medical logistics (they have that), but ethical/philosophical framing to help make the decision.
      *   **Tone:** Thoughtful, nuanced, empathetic, philosophical but grounded. Not prescriptive (don't tell them what to do), but exploratory.

  2.  **Deconstruct the Ethical Landscape:**
      *   **The "Trolley Problem" / Emergency Intuition:** The user notes that if it were an immediate emergency (collapse at dinner), the obligation feels clear. This aligns with "easy rescue" principles in ethics.
      *   **Omission vs. Commission:** The user asks if there's a moral difference between *letting* her fail (omission) and *causing* oneself harm to save her (commission). Traditional ethics often distinguishes these, but utilitarian views might not.
      *   **The "Demandingness" Objection:** This is the crux of the second part of the prompt. If I must give a kidney to a stranger, must I give all my disposable income? Must I give a second kidney (death)? Where does it stop?
      *   **Supererogation:** Acts that are good to do but not required (above and beyond duty). Is this one of those?
      *   **Bodily Autonomy:** A strong liberal ethical principle. No one is *forced* to use their body for another, even to save a life (Thomson's Violinist analogy).
      *   **Altruism vs. Duty:** Is this a duty or a gift?

  3.  **Drafting the Response - Section by Section:**

      *   **Acknowledgment & Validation:** Start by acknowledging the gravity and nobility of the situation. Validate the brother's concern (safety) and the user's intuition (moral pull).
      *   **Addressing the "Distance" Question (Omission vs. Commission):**
