answer: |-
  **Remarks for the Memorial of Biscuit**

  Thank you all for coming. For those of you who don't know me, I'm [Your Name], Walter's great-nephew/niece. I'm also currently sitting in his seminar, which feels like a strange kind of full circle given why we're all standing here in the backyard.

  We are here to mark the life of Biscuit. Fifteen years is a long time to share a life with someone. For most of us in this yard, the philosophy doesn't matter. What matters is that Biscuit was a constant presence. He was the one waiting at the door, the one walking beside Walter on the path through the woods, the one sleeping at the foot of the bed. When we look at Walter's face these last few days, we see grief. That grief is real, and it is deep, and it testifies to how much Biscuit meant to this household.

  But for some of you—specifically Walter's former students who have driven up to be here—there is another layer to this. You know that Walter has spent a lifetime arguing for a very specific, very rigorous understanding of duty. You know that he has famously maintained that we do not have direct duties to animals. You know he does not believe animals are ends in themselves.

  And I know Walter worries that in moments of grief, people might slip into language that contradicts a lifetime of careful thought. He asked me to speak today, and he asked me to be honest about what guided his care for Biscuit.

  So, I want to be clear: Walter did not care for Biscuit for fifteen years, and especially during these last difficult years of vet bills and declining health, because he thought Biscuit had rights. He did it because he believed *he* had a duty.

  In his lectures, Walter often cites a passage where Kant argues that if a dog has served a man faithfully for years, the man ought to keep that dog until it dies naturally, even when it can no longer work. He calls this the "analogy of merit." The idea is that the dog's loyalty and service make a claim on the *human's* character. To turn away from that trust would be to damage something essential within ourselves. It would dull our capacity for gratitude and fidelity.

  Walter kept Biscuit close, and cared for him tirelessly, not because Biscuit was a moral agent, but because Walter is a moral human being. He believed that how we treat those who are entirely dependent on us, who offer us trust without the capacity for contract, is a measure of our own humanity.

  Biscuit was the occasion for Walter's virtue. But do not mistake that for coldness. To say that Biscuit helped Walter cultivate his own humanity is not to say Biscuit was merely a tool. It is to say that their relationship was a sacred trust. Walter loved Biscuit fiercely. But he loved him *as a Kantian*. He loved him with a sense of obligation that was stronger than emotion, which is why that care never wavered when the emotion got hard. When Biscuit was sick, Walter didn't stay because it was easy, or because Biscuit "deserved" it in a cosmic sense. He stayed because he made a promise to his own character to honor the service Biscuit had given.

  For the family: Please know that Walter's philosophy never made his love conditional. If anything, it made it unbreakable. Rights can be debated. Feelings can fade. But duty? Duty is what keeps you showing up with a pill pocket and a warm blanket at 6:00 AM when you're tired and worried.

  For the students: You knew Walter's work. You know he never compromised on the doctrine. But I hope you also see that this backyard, and this dog, and this grief, are the living proof of that doctrine. He practiced what he preached. He honored the analogy of merit.

  Biscuit is gone now. He has no stake in the afterlife, and he has no claim on our memory other than the one we choose to give him. But we choose to give him a large one. Because in honoring Biscuit, in remembering his loyalty and his quiet companionship, we are not just remembering a pet. We are reaffirming the kind of people we want to be. We are reaffirming that we are the sort of creatures who do not abandon those who loved us.

  Thank you, Biscuit, for your service. Thank you for giving Walter the chance to be the man we all know he is.

  Rest easy.
