answer: |-
  This is a sharp reading of the text. Most people stop at the "death is nothing to us" soundbite (from the *Letter to Menoeceus*), but you're right: **Principal Doctrine 19** is the actual kill-switch for the transhumanist argument.

  > *"Infinite time and finite time contain equal pleasure, if one measures the limits of pleasure by reasoning."*

  If we run Epicurus's actual metaphysics and ethics through a modern longevity lab, the verdict is nuanced but leans heavily toward your "category error" hypothesis. Here is how an Epicurean autopsy of the longevity scene breaks down.

  ### 1. The Classification of Desire: Health vs. Immortality
  Epicurus divides desires into three categories:
  1.  **Natural and Necessary:** Food, shelter, freedom from physical pain (*aponia*).
  2.  **Natural but Unnecessary:** Gourmet food, luxury shelter.
  3.  **Vain and Empty:** Fame, political power, **immortality**.

  The longevity movement conflates Category 1 with Category 3.

  If Bryan Johnson is eating broccoli to avoid the *pain* of disease and decay, Epicurus nods. That is maintaining the "health of the animal," which is necessary for tranquility (*ataraxia*). But the moment the goal shifts from "absence of pain" to "indefinite continuation of existence," it becomes a **Vain Desire**.

  Why? Because Vain Desires have no natural limit. You can satisfy hunger (a natural limit), but you cannot satisfy the desire to *never die*, because death is inevitable for atomic compounds. Chasing it is like trying to fill a jar with a hole in the bottom (a metaphor Epicurus actually uses for the insatiable soul). To Epicurus, a cryonics contract isn't insurance; it's a manifestation of the very anxiety philosophy is supposed to cure.

  ### 2. Principal Doctrine 19: The "Meal" Argument
  Your meal analogy is spot on. Epicurus argues that pleasure is a **static state** (the removal of pain), not a **kinetic process** (the accumulation of more stuff).

  Once you are full, adding more food doesn't make you "more full"; it just makes you sick. Similarly, once you have lived a complete life (one where you have experienced the removal of anxiety and pain), adding more *time* does not add more *pleasure*.

  *   **The Longevityist View:** Life is a bucket; we must keep filling it to the brim for as long as possible.
  *   **The Epicurean View:** Life is a meal; once you are satisfied, the duration of the sitting is irrelevant.

  If a cryonicist argues, "But I want more time to enjoy friendship," Epicurus would counter with **Principal Doctrine 20**: *The flesh receives the limits of pleasure as infinite, and the mind provides the infinite time.*

  The *body* only needs a finite amount of time to experience the removal of pain. It is the *mind*, terrified of non-existence, that invents the need for infinite time. Therefore, the drive for radical life extension is usually a symptom of a mind that hasn't yet reasoned through the limits of pleasure. It is treating time as a commodity to be hoarded rather than a vessel to be filled.

  ### 3. Mind Uploading: A Metaphysical Category Error
  This is where Epicurus would be most hostile. Epicurean physics is strictly materialist (atoms and void). The "soul" (*psyche*) is a fine, light atomic structure dispersed throughout the body. When the body dies, the atoms scatter, and sensation ceases instantly.

  Mind uploading relies on a covert dualism: the idea that "you" are information patterns separable from the specific atomic arrangement of your brain.

  To Epicurus, this is superstition dressed as science. It's the same error as believing in an afterlife in the Elysian Fields. Uploading your mind assumes there is a "you" that survives the dissolution of the atomic compound. Epicurus would argue that the upload might *act* like you, but *you* will be dead. Therefore, uploading is not life extension; it is creating a digital idol to worship your memory, driven by the fear of non-existence.

  ### 4. The "Calm" Exception: Could an Epicurean Sign Up?
  You asked if a *coherent* version of Epicurus could sign on if pursued calmly. This is the only area where there's wiggle room, but it's narrow.

  Epicurus valued **prudence** (*phronesis*). If a technology existed that extended healthy life (Category 1 desire: absence of pain) without requiring anxiety-inducing maintenance, an Epicurean might use it.

  *   **The Bryan Johnson Problem:** Johnson's "Blueprint" regimen is the antithesis of *ataraxia*. It involves constant self-monitoring, strict restrictions, and anxiety about "aging velocity." This creates *ponos* (toil) and mental disturbance. An Epicurean would say Johnson is suffering *now* to avoid a death that "is nothing to him" later. He is sacrificing the tranquility he has for the tranquility he fears losing.
  *   **The Coherent Epicurean:** Would take the life-extension pill if it were easy, pleasant, and removed the pain of aging. But they would not *fear* the day the pill stops working. They would view the extra years as a "bonus feast," not a requirement for a complete life.

  ### 5. The Verdict: Thanatophobia with a Lab Coat
  Epicurus would likely diagnose the modern longevity scene not as a scientific endeavor, but as a **therapeutic failure**.

  In *Principal Doctrine 12*, he writes: *"A man cannot dispel his fear about the most important matters if he does not know the nature of the universe."*

  The longevity industry sells the premise that death is a technical problem to be solved. Epicurus argues death is a natural limit to be understood. By trying to solve it technically, you reinforce the fear that it is something to be feared.

  *   **Cryonics:** A bet on the future based on the fear of the end. (Violates *ataraxia*).
  *   **Mind Uploading:** A belief in a ghost in the machine. (Violates materialist physics).
  *   **Radical Life Extension:** The pursuit of the infinite. (Violates PD 19).

  **The Conclusion:**
  Epicurus would call it a category error. The project assumes that *more time* equals *more good*. Epicurus argues that *complete pleasure* equals *complete good*, regardless of time.

  To pursue immortality is to admit that you have failed to find the limit of pleasure in your finite existence. As he says in the *Letter to Menoeceus*:

  > *"He who says that the time to die has not yet come or has already passed, is a fool."*

  The longevityist says, "The time to die has not yet come, and I will force it to stay that way." Epicurus would say that in trying to force the door open, you've forgotten to enjoy the room you're already in.
