answer: |-
  This is one of the classic ethical dilemmas of adult life, so first off: welcome to the club. It happens to almost everyone.

  Your roommate is arguing from a **utilitarian** perspective (specifically act-utilitarianism). Her logic is: *Outcome A (Grandma happy, you slightly inconvenienced) is better than Outcome B (Grandma hurt, you honest).* By that metric, she is logically sound. If the only moral metric is "net happiness in this moment," you did the right thing.

  However, the reason it's "living in your head rent free" is that human morality isn't just about immediate outcomes. That nagging feeling you have is valid, and it's coming from a few different places that your roommate is glossing over.

  Here is the outside perspective you asked for, broken down by why it nags, and whether you should actually worry about it.

  ### 1. The Difference Between the Gift and the Promise
  You didn't just lie about liking the sweater; you made a specific promise about future behavior: *"I'll wear it to family stuff all the time."*
  *   **The Lie:** "I love it." (This is about feelings. Hard to prove false.)
  *   **The Promise:** "I will wear it." (This is about action. Easily proven false.)

  The nagging is likely less about the aesthetic lie and more about the **expectation management**. You have now created a future scenario where Grandma might expect to see you in that sweater at Christmas or a birthday. If you never wear it, and she asks, "Why didn't you wear the sweater I made you?", you are now in a deeper hole. The cognitive dissonance comes from knowing you have to manage this lie going forward. That is mental labor.

  ### 2. Integrity vs. Kindness
  There is a conflict between two virtues here: **Honesty** and **Compassion**.
  *   **Honesty** says: "I should be authentic with my loved ones."
  *   **Compassion** says: "I should protect my loved one's feelings, especially when their intent was pure."

  Your roommate is prioritizing Compassion. Your nagging feeling is your internal compass checking in on Honesty. Neither is "wrong," but they are in tension. The reason it feels icky is that you value being a person of your word, and you technically broke that streak. Acknowledging that tension is healthy; it means you haven't become cynical about truth-telling.

  ### 3. The "Object" vs. The "Labor"
  You know, logically, that the sweater represents 6 weeks of her life. It is physicalized love.
  When you say it's "hideous," you are rejecting the *object*. But when you lied and said you loved it, you were accepting the *labor*.
  The guilt nags because you feel you are devaluing the labor by not using the object. However, try to reframe this: **You are wearing the sweater metaphorically.** By protecting her feelings, you are "wearing" her love in the way that matters most to *her* (seeing you happy), even if you aren't wearing the wool on your skin.

  ### 4. The Roommate's Philosophy Blind Spot
  It is ironic that your roommate is drowning in early Christian philosophy while telling you this is "full stop not wrong." If she were reading Augustine (who wrote specifically *On Lying*), he would actually argue that **any** lie is a sin, regardless of the good outcome.
  She is currently looking for binary answers (Right/Wrong) because she is in study mode. Real-life ethics are rarely binary. She is right that no one is *harmed*, but she is wrong that there is *nothing to it*. There is a cost: the cost is your peace of mind and the potential risk of future discovery.

  ### The Verdict
  **Is your roommate right?**
  Pragmatically, **yes.** Confessing now would be selfish. It would transfer the burden of guilt from *you* to *her*. She would feel foolish for making it, hurt that you lied, and embarrassed that she misjudged your taste. Keeping the secret is the kinder act.

  **Is your nagging feeling valid?**
  **Also yes.** It's a signal that you value authenticity. It reminds you that this isn't a habit you want to make a pattern of.

  ### How to Stop the Rent-Free Living
  To quiet the nag, you need to align your actions with your words as closely as possible without causing harm.
  1.  **Modify the Promise:** You don't have to wear it *all the time*, but try to wear it *sometimes*. Put it on for the actual birthday dinner. Wear it when you FaceTime her. If you wear it 10% of the time, you aren't lying when you say, "I love wearing it for special family stuff."
  2.  **Reframe the Value:** Stop looking at the sweater as clothing. Look at it as a prop in a play called "Making Grandma Feel Cherished." In that context, you are an award-winning actor, not a liar.
  3.  **Accept the Trade:** You traded a small amount of personal integrity for a large amount of someone else's joy. That is a valid moral trade in a caring relationship.

  **Bottom line:** You didn't commit a moral crime; you paid an "emotional tax" to keep your grandma happy. It's okay to feel the weight of that tax, but don't let it bankrupt you. Wear the sweater twice a year, send her pictures, and let yourself off the hook.
