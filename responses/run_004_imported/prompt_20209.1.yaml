  ### How to Pitch This to the Professor
  If she asks why you didn't give it a perfect 10, you can say:

  *"The logic is flawless, and the Hitchhiker comparison is spot on. I docked it one point only on the attribution in the last sentence. The student writes that 'Kavka's answer... is that a genuinely rational agent can adopt policies.' My read is that Kavka argues the intention is actually impossible for a rational agent, and that the 'policy/resolute choice' move is McClennen's response to Kavka, not Kavka's own conclusion. In a grad seminar, I thought it was worth marking that distinction."*

