answer: |-
  This is a classic problem in the philosophy of causation, known as **Early Preemption**. It is a specific subtype of "causal overdetermination." You are absolutely right to sense that the simple "but-for" test (*sine qua non*—"but for this act, would the result have happened?") fails here.

  However, you do not need to rely on authorial fiat. There is a robust principled basis—in both law and metaphysics—for concluding that the first child is the murderer and the second is an attempter.

  Here is how you can ground that asymmetry in your plot, moving from the philosophical to the forensic.

  ### 1. The "Specific Event" Argument
  The most intuitive defense of your desired outcome is to refine what we mean by "death." Death is not a binary state (alive vs. dead) stretched over an indefinite timeline; it is a **specific event occurring at a specific time.**

  *   **Child 1** caused the event: *Death at 8:00 PM.*
  *   **Child 2** set in motion a chain that would have caused the event: *Death at 10:00 PM.*

  These are two different events. By causing the father to die at 8:00 PM, Child 1 actually made a difference. If Child 1 had not acted, the father would have been alive at 8:05 PM, 8:30 PM, and 9:00 PM. Child 1 deprived the father of those two hours of life.

  Therefore, Child 1 is causally responsible for the *actual* death that occurred. Child 2 is responsible for a *counterfactual* death that was preempted. In legal terms, Child 2's causal chain was **frustrated** or **interrupted** by the prior completion of Child 1's causal chain.

  **For the Detective:**
  > "You didn't kill the man who died tonight, [Child 2]. The man who died tonight was killed at 8:00 PM. You planned to kill a man at 10:00 PM. That man never existed, because my other suspect got to him first."

  ### 2. The Forensic Mechanism (The "Process" View)
  Philosophers like David Lewis have argued that causation isn't just about outcomes; it's about the **process** connecting the act to the outcome.

  *   **Child 1's Process:** Ingestion $\rightarrow$ Absorption $\rightarrow$ Cardiac Arrest $\rightarrow$ Death. (This chain completed).
  *   **Child 2's Process:** Ingestion $\rightarrow$ Absorption $\rightarrow$ [DEATH OF HOST] $\rightarrow$ Process Terminates.

  For Child 2's poison to be the cause, its specific physiological mechanism must complete. If the slow poison requires liver metabolism to become toxic, and the heart stops before the blood reaches the liver, the slow poison never technically "kills." It remains a potentiality, not an actuality.

  **For the Plot:**
  This gives your detective hard forensic evidence. The autopsy will show the physiological markers of Poison A (e.g., specific tissue necrosis, blood chemistry). It will *not* show the markers of Poison B having taken effect. The toxicology report might find traces of Poison B in the stomach contents, but not in the bloodstream in lethal concentrations. This is objective proof that Poison B did not cause the death.

  ### 3. The Legal Standard: NESS vs. But-For
  You correctly identified that the "But-For" test fails. However, modern legal theory often supplements this with the **NESS Test** (Necessary Element of a Sufficient Set), proposed by legal scholars Hart and Honoré.

  *   **The Test:** Was the act a Necessary Element of a Sufficient Set of conditions that actually produced the result?
  *   **Application:**
      *   **Child 1:** Their poison was a necessary element of the set of conditions that caused death *at 8:00 PM*. (Without it, no death at 8:00 PM).
      *   **Child 2:** Their poison was part of a set sufficient for death at 10:00 PM, but that set was never the one that *actually produced the result*.

  Most common law jurisdictions handle "preemptive causation" exactly as you wish: the first actor is the cause; the second is an attempt. The law generally requires that the result be attributable to the defendant's conduct. Since the death was physiologically caused by Poison A, it cannot be attributed to Poison B.

  ### 4. Moral Luck and Culpability
  You might worry that this lets Child 2 off too lightly morally. After all, both children had the exact same malicious intent.

  This is a case of **Resultant Moral Luck**. Both children are equally *villainous*, but they are not equally *responsible for the outcome*.
  *   **Culpability (Blameworthiness):** Equal. Both intended murder.
  *   **Liability (Responsibility for Outcome):** Asymmetric. Only one succeeded.

  The law distinguishes between Murder and Attempted Murder precisely to account for this. We punish the harm done, not just the evil in the heart. If you want the reader to feel the tension here, you can have the detective acknowledge that Child 2 is just as *evil*, but legally, they are not the *killer*.

  ### 5. How to Stage the Revelation
  To make this satisfying for the reader, avoid a philosophy lecture. Let the detective use the logic above through evidence.

  **Scene Idea:**
  The detective confronts Child 2, who argues: "It doesn't matter! He was going to die anyway! My poison would have got him!"

  The detective replies:
  > "But it didn't. Look at the coroner's report. His heart stopped due to [Mechanism A]. Your poison was still sitting in his stomach. You didn't kill him. You just made sure that if [Child 1] had failed, you were ready to finish the job. That's not murder. That's being a very thorough attempter."

  **Or, the Detective confronts Child 1:**
  Child 1 argues: "If I hadn't done it, [Child 2] would have! I didn't change the outcome!"

  The detective replies:
  > "You changed *when* he died. You stole his last two hours. You turned a death at midnight into a death at dusk. You didn't just wish him dead; you made it happen. That makes you the murderer."

  ### Summary
  You are on solid ground. The asymmetry rests on:
  1.  **Time:** Causing death *now* is different from causing death *later*.
  2.  **Physiology:** Only one poison completed the biological process of killing.
  3.  **Law:** Preemptive causes supersede preempted causes.

  You can write this with confidence. The "But-For" test is a starting point for laypeople, but the "Actual Cause" test is how justice is actually served in complex cases. Child 1 is the murderer; Child 2 is the attempter.
