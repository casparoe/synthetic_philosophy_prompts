answer: |-
  Here is a sequence of ten questions designed to guide the Q&A session. They are ordered to start with clarifying the speaker's core move, then systematically close off the "not yet" escape route, address the specific required topics (no history, exaptation, malfunction, scientific practice), and conclude with the conditions for abandoning the theory.

  ### Phase 1: Establishing the "Not Yet" Move

  **1. The Baseline Distinction**
  "In your draft, you handle counterexamples of beneficial traits lacking a selective history by distinguishing between having a *function* and merely having a *beneficial effect*. Could you clarify for the audience: on your view, is the absence of 'function' in these cases a temporary epistemic limitation (we don't know the history yet), or is it an ontological fact about the trait itself?"

  *   **Likely Reply:** She will likely say it is an ontological fact. A trait is not a function until it has been selected; until then, it is merely a causal capacity.
  *   **Sharper Follow-up:** "So, if a mutation arises that saves an organism's life but that organism dies before reproducing, you would say that trait *never* had a function, even though it performed the exact same causal role as an adapted trait in a sibling? The difference lies entirely in the reproductive outcome, not the physiological contribution?"

  **2. The Temporal Horizon**
  "Following on that: you often defend the view by saying a novel trait has 'no function *yet*.' This implies a future orientation. How long does the window stay open? If a lineage possesses a beneficial trait for a thousand generations but goes extinct due to an asteroid impact before that trait becomes fixed, did the trait ever acquire a function, or was it always just an effect?"

  *   **Likely Reply:** She will likely argue that function requires actual selection, not just potential. If it wasn't selected, it wasn't a function. The "yet" refers to the opportunity for selection, not a guarantee.
  *   **Sharper Follow-up:** "This suggests that whether a trait *is* a function depends on events that happen *after* the trait is currently doing its work. Does this mean that the functional status of my heart right now is contingent on whether my children survive? That seems to make function retrospectively determined in a way that complicates current biological explanation."

  ### Phase 2: The "No History" Constraint

  **3. The Sterile Hybrid (Required: No Evolutionary History)**
  "I'd like to press on the 'not yet' claim with a case where there is no 'yet' available. Consider a sterile hybrid, like a mule, or a synthetic organism created in a lab that is designed not to reproduce. The mule has a heart that pumps blood successfully. Since the mule cannot reproduce, there is no possible future episode of selection for that trait in that lineage. On your account, does the mule's heart have a function?"

  *   **Likely Reply:** She will likely bite the bullet: The mule's heart has no *proper function*, only causal effects. It is a derivative function based on the parents' history, but strictly speaking, the token trait in the mule is not selected-for.
  *   **Sharper Follow-up:** "If a veterinarian is repairing the mule's heart, they are treating it as if it has a functional norm it can violate. If you tell them 'strictly speaking, this heart has no function,' does that help their explanation of the pathology, or does it render the concept of function useless for individual organisms that fall outside the reproductive chain?"

  **4. The Explanatory Cost of Novelty**
  "Continuing with the synthetic organism case: Suppose we build a fully synthetic cell with a novel pump mechanism never before seen in nature. It works perfectly. Biologists will immediately write papers on 'the function of the synthetic pump.' If you say they are mistaken and it has no function, aren't you forcing a divergence between the philosophical concept of function and the explanatory concept used in the lab? Why preserve a definition that goes silent exactly where biotechnology is most active?"

  *   **Likely Reply:** She may argue that philosophy's job is to clarify concepts, not mirror loose scientific usage. The biologists are speaking loosely; the philosopher corrects them.
  *   **Sharper Follow-up:** "But if the biologists use 'function' to predict how the system will behave under stress, and your definition forbids them from using that term until selection occurs, your definition isn't clarifying their practice; it's prohibiting their explanation. Is the etiological account descriptive of biology, or prescriptive against it?"

  ### Phase 3: Exaptation and Divergence

  **5. The Exaptation Problem (Required: Exaptation)**
  "Let's move to traits where history exists but diverges from current utility. Consider feathers: likely selected for thermoregulation, now essential for flight. On a strict etiological view, is 'flight' a function of feathers? If yes, when did it become a function? If no, how do you account for the fact that flight is the primary reason we explain the existence of feathers in modern birds?"

  *   **Likely Reply:** She will likely say flight is a function only if there has been secondary selection for flight. If flight is merely a beneficial effect of a trait selected for warmth, it is an exaptation, not a function.
  *   **Sharper Follow-up:** "So, if we find a bird species where flight is beneficial but has not yet driven differential reproduction (perhaps a newly colonized island), you would say flight is not the function of their feathers? It seems odd that the aerodynamic explanation for the feather's shape is philosophically distinct from its 'function' simply because the selection event is ongoing."

  ### Phase 4: Malfunction and Normativity

  **6. The Malfunction Advantage (Required: Malfunction vs. Cummins)**
  "A central selling point of the etiological view, following Neander, is that it handles 'malfunction' better than Cummins' causal-role account. You claim that only you can distinguish a broken heart from a heart that simply doesn't pump. Can you explain precisely why the causal-role theorist cannot make this distinction? They can define malfunction as a failure to contribute to the containing system's capacity. Why is that insufficient?"

  *   **Likely Reply:** She will argue that Cummins' account is relativized to an analyst's interests. Any trait can be said to 'contribute' to some capacity. Only etiology provides a mind-independent norm: the trait is failing to do what it was *supposed* to do by history.
  *   **Sharper Follow-up:** "But in pathology, the 'interest' isn't arbitrary; it's the survival of the organism. If a cardiologist defines malfunction as 'failure to sustain the organism,' that interest is objective relative to the organism's life. Why do we need the historical 'supposed to' to ground the norm, rather than the current systemic requirement?"

  **7. The Disease Specificity**
  "To press that point: Consider a genetic disease like Tay-Sachs. The causal-role theorist says the enzyme fails to contribute to metabolic capacity. You say it fails to perform its selected effect. In a clinical setting, does knowing the *selective history* of the enzyme help diagnose the disease any more than knowing its *current causal role*? If the history adds nothing to the medical explanation, in what sense is your account of malfunction 'better'?"

  *   **Likely Reply:** She might concede it doesn't help diagnosis but insist it explains why it is a *disease* rather than a mere difference. It grounds the normativity of health.
  *   **Sharper Follow-up:** "If the normativity is grounded in the past, but the treatment is grounded in the present, does the etiological account of malfunction become purely metaphysical? If it doesn't cash out in different predictions about the breakdown than the causal-role account does, are we paying a high empirical cost for a metaphysical distinction without a difference?"

  ### Phase 5: Scientific Practice

  **8. The Physiologist's Perspective (Required: Scientific Practice)**
  "Shifting to practice: When physiologists or comparative anatomists assign functions, they rarely consult phylogenetic trees. They look at current structure and current contribution. If your account is correct, a vast amount of standard function-talk in physiology is literally false because it lacks historical verification. Are you prepared to accept that revisionism?"

  *   **Likely Reply:** She will likely say that scientists often assume history is present, or that they are using a shorthand. But strictly, without history, it is not a function.
  *   **Sharper Follow-up:** "If scientists can successfully model, predict, and intervene on biological systems using a concept that you deem 'false,' does that suggest their concept tracks something real about the system's organization that your historical concept misses? Why privilege the history over the successful practice?"

  **9. The Homology Problem**
  "Consider homologous structures that have lost their original function but are conserved. If a trait is conserved due to developmental constraints rather than selection for its current effect, physiologists still attribute functions to it based on what it does. If you deny it a function because the current effect isn't what selected it, you sever the link between function and current causal contribution entirely. Doesn't this make 'function' irrelevant to understanding how the organism works *now*?"

  *   **Likely Reply:** She will reiterate that function explains *presence*, not current *utility*. Current utility is the domain of causal role; function is the domain of evolutionary explanation.
  *   **Sharper Follow-up:** "But biology is increasingly about mechanisms and systems, not just evolutionary origins. If 'function' is barred from explaining the mechanism, and restricted only to explaining the origin, aren't you bifurcating the concept so sharply that it no longer serves the integrative needs of modern biology?"

  ### Phase 6: Falsification

  **10. The Abandonment Condition (Required: Falsification)**
  "Finally, I want to ask about the resilience of the etiological analysis. You have qualified the account to handle novelty, exaptation, and malfunction, often by distinguishing 'function' from 'effect.' Is there any empirical finding or thought experiment that would lead you to abandon the etiological analysis in favor of a causal-role account? Or is the etiological view protected from revision by always defining away counterexamples as 'mere effects'?"

  *   **Likely Reply:** (This is the trap). She may say it is a conceptual analysis, not an empirical theory, so it isn't "abandoned" but rather shown to be the correct explication of the concept.
  *   **Sharper Follow-up:** "If it is purely conceptual, its value depends on its utility. If we find that the 'causal-role' concept does all the explanatory work in genetics, physiology, and medicine, while the 'etiological' concept only applies to evolutionary history, would you concede that for general philosophy of biology, the causal-role account is the more useful tool? At what point does the bullet-biting become too costly for the theory to retain?"
