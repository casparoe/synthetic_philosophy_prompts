prompt: |-
  Had a long argument with my friend Theo last night after a road trip and it's still bugging me. We got on the topic of driving tired - he claimed you can never fully trust yourself to know, in the moment, that you've crossed the line into "too tired to be driving," since it creeps up so gradually that there's no exact point where fine switches into not-fine. Ok fine, I can sort of buy that. But then he took it further and said that even when you happen to correctly think "no, I'm still ok," you might not know THAT you know it - like being right and knowing your right are two separate achievements, and you can have one without the other. That part seems like nonsense to me, if I genuinely know something isn't it just automatic that I know that I know it? Is Theo actually onto something here or is he just overcomplicating a simple thing?
