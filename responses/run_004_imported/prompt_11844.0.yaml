  4.  **Addressing Specific Sub-questions:**

      *   *Credences:* Epistemicism allows standard $P(p)$. Supervaluationism requires $P(\text{admissible precisification makes } p \text{ true})$. This shifts the meaning of the probability.
      *   *Evidence:* Epistemicism says better theory/instruments help. Supervaluationism says conceptual clarification helps, but empirical data hits a limit at the "penumbra."
