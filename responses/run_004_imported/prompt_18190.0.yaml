answer: |-
  **Setting:** *A quiet, smoke-filled corner of the Faculty Club at Columbia University. It is late afternoon, November 1925. Outside, the noise of New York City hums—cars, street vendors, the clatter of the elevated train. Inside, **Walter Lippmann** (36, sharp suit, cigarette holder) sits across from **John Dewey** (66, rumpled jacket, pipe). They have just finished a seminar on political theory.*

  **Lippmann:** (Tapping ash into a crystal tray) You look troubled, John. Is it the seminar? The students seemed engaged enough.

  **Dewey:** (Puffing slowly on his pipe) The students are bright, Walter. But they are hungry for answers we do not have. They ask how a man working ten hours in a factory is supposed to decipher the complexities of the Federal Reserve, or the nuances of a treaty with Germany. I find myself unable to give them a comforting lie.

  **Lippmann:** Then do not give them a lie. Give them the reality. That is the trouble with our tradition, John. We are clinging to a dogma that died with the town square. We assume the existence of an "omnicompetent citizen." A man who has the time, the intellect, and the interest to master every public affair.

  **Dewey:** I grant you, the citizen of 1925 is not omnicompetent. The world has grown too vast, too technical. The invisible web of causes and effects stretches beyond what any one mind can trace.

  **Lippmann:** Precisely. And yet, the theory of democracy demands it. It demands that the "sovereign people" form a rational opinion on matters they cannot possibly understand. So what happens? They do not form opinions. They form stereotypes. They react to symbols. They are a deaf, blind, and dumb specter. The public is a phantom, John. It does not exist as a governing body. It cannot exist.

  **Dewey:** (Leaning forward) You say it *cannot* exist. I say it has been *displaced*. The Great Society of industry and railroads has been built, but the Great Community has not. We are physically connected, yes, but we are not socially united. You see this as proof that democracy is impossible. I see it as a mechanical failure of communication.

  **Lippmann:** A mechanical failure? It is a human limitation. Look at the bureaucracy. We have men—specialists, inspectors, economists—who spend their lives studying the cost of steel or the sanitation of water. They know the facts. The public knows nothing but the headline. Why should the man who knows nothing veto the man who knows the facts? We must admit that governance is a specialized trade. The public should merely intervene occasionally, to align the government with basic desires, like a referee blowing a whistle when the play gets too rough. But the play itself? That is for the insiders.

  **Dewey:** And there is the rub. You speak of experts handling the "play." But experts, Walter, are masters of *means*, not *ends*. An engineer can tell us how to build a dam. He cannot tell us whether the valley flooded by that dam is worth the electricity it generates. That is a question of value. That is a question of the good life.

  **Lippmann:** But the public cannot judge the value if they do not understand the cost!

  **Dewey:** Then we must make the cost intelligible! If we hand the values over to the experts as well, we do not have democracy. We have a benevolent oligarchy. You propose to solve the problem of the ignorant citizen by removing the necessity of citizenship. But who selects the experts? Who directs their purpose? If the public is truly a phantom, then the bureaus become self-perpetuating. They serve their own logic, not the human need.

  **Lippmann:** (Sighs, leaning back) You think I desire oligarchy? I desire functional government. I am tired of watching democracy fail because we ask it to do what it cannot. We elect demagogues who promise the moon because the people are confused. Then we blame the system. I am trying to save the system by lowering the temperature. Let the experts administer. Let the public judge the *result*, not the method. If the water is clean and the trains run, the public consents. If not, they turn the rascals out.

  **Dewey:** Consent without understanding is not consent. It is acquiescence. You want a public that is merely an audience. But democracy is not a spectator sport, Walter. It is a mode of associated living. The danger is not just that the public might make a mistake. The danger is that by retreating from the hard work of governance, the public loses the capacity for moral growth. We become subjects, not citizens.

  **Lippmann:** Moral growth is a luxury for the leisure class, John. The average man is tired. He comes home from the shop, he wants to be with his family, he wants to listen to the radio. He does not want to deliberate on the tariff. To insist he must is to condemn him to frustration and the state to incompetence.

  **Dewey:** I do not insist he must be a tariff expert. I insist he must be part of a community where the *effects* of the tariff are discussed. Where the farmer and the factory worker can speak to one another. The problem is not the man's fatigue. The problem is that the channels of news and conversation are clogged. The newspapers are owned by interests. The schools teach obedience, not inquiry.

  **Lippmann:** So you propose to educate the entire population into statesmen?

  **Dewey:** No. I propose to rebuild the local. The "Great Community" cannot exist in the abstract. It must begin where people live. In the school board, the union hall, the town meeting. Where the consequences of government action touch their daily lives. If we can restore free and full communication there, the public will organize itself. It will cease to be a phantom. It will find its voice. Then, and only then, can it properly direct your experts.

  **Lippmann:** (Shaking his head) You have a faith in human association that borders on the religious. The forces of industrialization are centrifugal, John. They scatter people. They standardize culture. You want to recreate the New England town meeting in the shadow of the skyscraper. It is nostalgic.

  **Dewey:** It is necessary. Without it, your experts have no compass. You say the public is a phantom. I say the public is *in search of itself*. It is lost in the machine we built. If we tell them, "Give up, you are too small for this world," then the machine wins. If we tell them, "Find your neighbors, share what you know, and demand the truth," then perhaps the machine serves us.

  **Lippmann:** And if they refuse? If they prefer the comfort of the stereotype to the burden of the truth?

  **Dewey:** (Pauses, looking at his pipe) Then we deserve the tyranny we get. But I will not be the one to tell them they are incapable of freedom. To do so is to make the prophecy self-fulfilling.

  **Lippmann:** (Stands up, buttoning his jacket) And I will not be the one to tell them they are capable of godhood. To do so is to invite chaos.

  **Dewey:** (Smiling faintly) Then it seems, Walter, we have work to do. You will watch the insiders. I will watch the public.

  **Lippmann:** (Extending a hand) Agreed. Though I fear the gap between us is wider than the gap between the citizen and the state.

  **Dewey:** (Shaking the hand) Then we must bridge it. Or no one will.
