answer: |-
  You have stumbled upon one of the most famous and unsettling problems in the history of philosophy. While it feels like a domestic dispute over a card game, you are actually grappling with what is known as the **Rule-Following Paradox**, most famously articulated by **Ludwig Wittgenstein** and later expanded upon by the philosopher **Saul Kripke**.

  The short answer to your question is: **No, there is likely no "fact of the matter" about which rule you were following all along.** Consequently, the disagreement is unresolvable as a matter of *discovery*, but it is entirely resolvable as a matter of *decision*.

  Here is the breakdown of why this is the case, and how you should handle it.

  ### 1. The Gap Between Past and Future
  The core of the problem is that any finite sequence of past actions (the hands you've played over 15 years) is compatible with an infinite number of possible rules.

  Imagine you are teaching a child to add 2. They write: 2, 4, 6, 8... up to 1000. At 1000, they write 1004. You correct them, saying, "No, it should be 1002." The child replies, "I thought the rule was 'add 2 up to 1000, then add 4'."

  You might say, "But I *meant* add 2 forever!" But Wittgenstein asks: **What fact about your past mental state constitutes that meaning?**
  *   Was it a specific image in your head? (Images can be interpreted in multiple ways.)
  *   Was it a verbal formula? (Words themselves have to be interpreted.)
  *   Was it your past behavior? (As noted, past behavior is finite; the future is infinite.)

  In your card game, you have a history of Case A, Case B, and Case C. In all those cases, Spouse A and Spouse B agreed on the outcome. But now you have Case Z. Nothing in the history of Cases A, B, and C *logically forces* a specific outcome for Case Z. Both of your interpretations fit the past data perfectly; they only diverge on the new data.

  ### 2. The Illusion of "Always Having Done It"
  You mentioned that you were both certain you were resolving it the way you'd "always done." This is a psychological sensation, not a metaphysical fact.

  When we encounter a new situation, our brains instinctively project our past habits onto the new context. We feel a sense of "obviousness." However, Kripke argues that this feeling is retroactive. You are not accessing a hidden fact about your intentions from 2009; you are making a judgment *now* about what your past self *would have* said.

  Since neither of you can point to specific past behavior or a specific clause in the written rule that settles this, you are both engaging in **interpretation**, not **recall**. You are effectively writing new law while pretending to be judges.

  ### 3. The Skeptical Solution
  If there is no fact of the matter, does anything go? Is the game meaningless?

  Wittgenstein and Kripke offer a "skeptical solution." They argue that meaning is not a private fact inside your head; it is a **social practice**. A rule is followed correctly if it aligns with the customs and agreements of the community using it.

  In a public legal system, when a law is ambiguous and a new situation arises, the Supreme Court steps in. Their decision doesn't "discover" what the law always was (though they speak as if it does); they **stipulate** what the law is from this point forward.

  ### 4. How to Resolve It
  Since there is no "ghost in the machine" from 15 years ago that holds the answer, you cannot resolve this by arguing about who is "right" regarding the past. You are in a legislative deadlock.

  To fix this, you must shift from a **judicial mindset** (finding the truth) to a **legislative mindset** (making a choice).

  1.  **Acknowledge the Void:** Admit to each other that the "fact of the matter" does not exist. You are both equally "right" about the past, and therefore currently equally "wrong" about the present.
  2.  **Flip a Coin (or Vote):** Since logic and history cannot save you, use a randomizer or a democratic vote to decide the outcome of *this specific hand*.
  3.  **Amend the Constitution:** The most important step is to write down the ruling for this specific scenario and add it to your house rules.

  ### Summary
  You are experiencing a **normative gap**. The past does not contain the future. There is no fact of the matter about which rule you were "actually" following, because the rule itself is incomplete until applied to this specific scenario.

  The disagreement is unresolvable as a question of **truth**, but it is easily resolvable as a question of **convention**. Decide the outcome now, write it down, and you will have created the "fact of the matter" for all future games.
