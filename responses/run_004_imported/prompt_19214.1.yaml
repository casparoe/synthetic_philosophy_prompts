answer: |-
  This is an exceptionally sharp critique, and you are right to be suspicious of the *phronesis* defense if it is deployed as a "get out of jail free" card. Your friend's argument risks turning virtue ethics into a tautology: *Why did the agent do X? Because they are virtuous. How do we know they are virtuous? Because they did X.*

  However, the conclusion that virtue ethics is therefore "pre-scientific folk psychology" is too strong. The situationist critique did severe damage to a *specific, naive version* of virtue ethics, but it did not kill the framework entirely. To see why, we need to disentangle three distinct issues: the empirical robustness of the studies, the definition of "character traits," and the normative vs. descriptive scope of the theory.

  Here is a breakdown of why virtue ethics remains a live option, provided it is naturalized to accommodate the psychological data.

  ### 1. The Empirical Basis is Shakier Than the Rationalist Canon Suggests
  You mentioned the "evidentiary core" of the situationist critique. From a modern methodological standpoint, that core has corroded significantly.

  *   **Zimbardo (Stanford Prison Experiment):** This study is now widely regarded as methodologically bankrupt. It lacked proper controls, Zimbardo acted as a participant (superintendent), and guards were coached on how to behave. Recent replications (e.g., Reicher & Haslam, 2006) failed to reproduce the automatic obedience to roles, showing instead that group dynamics and identification matter more than assigned roles.
  *   **Milgram:** While the obedience rates were high, they were not 100%. In the baseline condition, 35% of participants refused to go to the maximum voltage. More importantly, variations in the experiment showed that when the "authority" was ambiguous or the victim was closer, obedience plummeted. This suggests behavior *is* sensitive to cues, but it also proves that a significant minority possess the resistance situationists claim doesn't exist.
  *   **Darley & Batson:** Again, the headline is that hurry mattered. But the data shows that in the "low hurry" condition, 63% stopped to help. Even in the "high hurry" condition, 10% stopped.

  **The Implication:** Situationism argues that *global* traits (honesty in *all* situations) are rare. The data supports this. But the data also shows that behavior is not *randomly* determined by situations; there is variance, and there are individuals who resist situational pressure. If virtue ethics is a theory about what is *possible* for human psychology (an aspirational model), the existence of the 35% in Milgram or the 10% in Darley-Batson is the proof of concept that virtue is psychologically possible, even if statistically rare.

  ### 2. The "Global Trait" Strawman
  Harman and Doris attack the idea of "Global Robust Character Traits." They define these as dispositions that manifest consistently across a wide variety of trait-relevant situations, even those where situational pressures work against the trait.

  The problem is that this is largely a strawman of Aristotelian virtue. Aristotle never claimed that virtue was a blind, automatic reflex that ignores context.
  *   **Fragmentationism:** Many modern virtue ethicists (like Nancy Snow or Christian Miller) concede the situationist point. They argue for "local traits" rather than global ones. You might have a "honesty-among-friends" trait but not an "honesty-with-authority" trait. Virtue ethics then becomes the project of *integrating* these local traits into a more robust whole through practice.
  *   **The Normative vs. Descriptive Distinction:** This is the most critical point. Situationism is a *descriptive* claim about how humans currently behave. Virtue ethics is primarily a *normative* claim about how humans should behave and what constitutes flourishing.
      *   If a doctor says, "Humans should eat vegetables to be healthy," and a sociologist replies, "But 90% of humans eat junk food," the doctor's claim isn't falsified.
      *   Virtue ethics claims that if you cultivate *phronesis*, you will act rightly. Situationism shows that most people lack *phronesis*. These are compatible. Virtue ethics does not claim the average person is virtuous; it claims the average person is *unfinished*.

  ### 3. Addressing the *Phronesis* Unfalsifiability Worry
  Your skepticism about *phronesis* is well-founded. If every deviation from a pattern is excused as "context-sensitivity," the theory is vacuous. However, a sophisticated virtue ethicist can make *phronesis* falsifiable by specifying *which* situational variables a virtuous agent should respond to.

  *   **Morally Relevant vs. Irrelevant Cues:** *Phronesis* is not just "sensitivity to context"; it is sensitivity to *morally salient* features.
      *   **Situationist finding:** People obey because of a lab coat (morally irrelevant cue).
      *   **Virtue prediction:** A person with *phronesis* will recognize the lab coat as morally irrelevant and the victim's pain as morally relevant.
      *   **Falsification:** If a candidate for "virtuous person" obeys the lab coat despite the victim's pain, the virtue ethicist does not say, "Ah, their wisdom told them to obey." They say, "This person lacks virtue."

  The theory is not that "virtuous people act differently in different situations." The theory is "virtuous people act differently in response to *moral* reasons, not *structural* pressures." This makes it empirically testable. We can test whether moral training reduces susceptibility to morally irrelevant situational variables. (Some evidence suggests it does; e.g., people with ethics training or specific professional identities sometimes resist Milgram-esque pressure more than controls.)

  ### 4. The "Naturalized Virtue Ethics" Synthesis
  The intellectually honest conclusion isn't that virtue ethics is dead, but that it must be **naturalized**.

  The rationalist community often treats the situationist critique as a "gotcha" that ends the conversation. In academic ethics, it actually started a new one. The resulting framework, often called **Naturalized Virtue Ethics**, accepts the situationist data but rejects the nihilistic conclusion.

  1.  **Accept Fragmentation:** Acknowledge that cross-situational consistency is hard-won, not given. We are not born with "honesty"; we build "honesty-in-context-X," then generalize.
  2.  **Focus on Situation Management:** If situations drive behavior, the virtuous agent is one who *manages their situation*. A virtuous person knows they are prone to obedience under pressure, so they avoid putting themselves in positions where blind obedience is required. This is actually very Aristotelian (knowing one's own weaknesses).
  3.  **Reinterpret Traits as Expertise:** Instead of viewing virtues as static "traits" (like eye color), view them as **skills** (like playing piano).
      *   Novice pianists play badly under stress (situation dominates).
      *   Expert pianists play well under stress (skill dominates).
      *   The fact that novices play badly doesn't prove "piano skill doesn't exist." It proves expertise is rare and requires deliberate practice.

  ### Conclusion
  You are correct that the "folk psychology" version of virtue ethics—the idea that people just *have* fixed personalities that dictate their actions regardless of context—is dead. The situationists killed it, and good riddance.

  However, the core of virtue ethics is not a descriptive claim about current human psychology, but a developmental claim about human potential. The studies show that **automatic** moral behavior is situational. Virtue ethics argues that **deliberative, cultivated** moral behavior can transcend situation.

  To discard virtue ethics entirely because people fail Milgram's test is like discarding the concept of "physical fitness" because the average person gets winded climbing stairs. It confuses the baseline state of the population with the normative ideal of the theory.

  The most rationalist-friendly position is to view virtue not as a metaphysical essence, but as a **high-reliability cognitive architecture** built through feedback loops (habituation) that allows an agent to override situational noise with principled signal. The data shows this architecture is rare and fragile, not that it is impossible.
