      *   *Valid point:* A truly virtuous agent *should* behave differently in different contexts (e.g., honesty with a murderer at the door vs. a friend). But situationism argues people behave differently due to *morally irrelevant* factors (time pressure, uniforms). *Phronesis* shouldn't validate obedience to immoral authority just because it's "contextual."

  4.  **Synthesize a Balanced Response:**
