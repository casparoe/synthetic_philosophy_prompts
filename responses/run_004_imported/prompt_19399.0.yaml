      *   **Move 1 (PoM):** Agrees the *logical* version is solved/patched (circumscription, etc.). But shifts to the *semantic/cognitive* version (Dennett/Fodor): How does a finite system bound the search space of relevant facts? LLMs make this invisible via statistics. They don't rule out irrelevancies; they never represent them. Analogy: Dennett's paralyzed robot with better PR.
      *   **Move 2 (MLE):** Humans don't have a principled solution either (bias, confabulation). If statistical/unprincipled relevance disqualifies LLMs, it disqualifies humans. Yet we don't say humans "hide" the problem.
      *   **Move 2 (PoM):** Disanalogy: Grounding. Humans act, observe, revise. Relevance answers to the world, not just training distribution. Humans degrade more gracefully in *genuinely* novel situations.
