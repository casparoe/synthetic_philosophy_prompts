prompt: |-
  So I spent my whole career as a chemist, and now that I'm retired I've fallen down the philosophy of mind rabbit hole. I got a real kick out of Kripke's argument that "water is H2O" is necessarily true even though it sure feels contingent, and that he runs basically the same move to argue pain can't be identical to c-fiber firing, no matter what neuroscience turns up. Now I'm reading Chalmers on philosophical zombies (physical duplicates of us with nobody home inside) and it feels like he's just running Kripkes playbook again, souped up a bit. Thing is, Kripke himself thought he could explain away why something like "heat is molecular motion" merely SEEMS contingent while still being necessary - so why doesn't that same explaining-away trick also rescue the identity theorist from the zombie argument? Could you compare the two arguments for me and lay out exactly where, according to Chalmers, his own rescue move breaks down for pain/consciousness but not for heat or water? And do you think he's actually earned that distinction, or is he just asserting it?
