      *   **Specific Task:** Compare Kripke's argument regarding heat/water vs. pain. Explain Chalmers' specific move (the "rescue move" breakdown). Evaluate whether Chalmers earns the distinction or just asserts it.

  2.  **Deconstruct Kripke's Argument (Naming and Necessity):**
      *   *Scientific Identities:* "Water = H2O" and "Heat = Molecular Motion."
      *   *Modal Status:* If true, they are necessarily true (rigid designators).
      *   *The Illusion of Contingency:* Why does it *feel* like heat could exist without molecular motion?
      *   *Kripke's Explanation:* We identify heat via a *contingent sensation* (the feeling of warmth). So, when we imagine heat without molecular motion, we are actually imagining the *sensation* without the motion. The reference fixer is contingent, but the referent (heat itself) is rigid.
      *   *Application to Mind:* "Pain = C-fiber firing."
