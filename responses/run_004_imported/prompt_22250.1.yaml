answer: |-
  This is a superb catch. You have identified the precise pressure point where classical utilitarianism risks collapsing into majoritarian tyranny, and where Bentham must perform a delicate logical maneuver to save his theory from justifying the persecution of minorities.

  Bentham is indeed conceding that the pain of disgust and the pleasure of malevolence are *real* hedonic events. He does not deny the phenomenology. However, he blocks the inference to legal punishment through a multi-layered argument that relies on **efficiency**, **systemic security**, and the **epistemic status of the pain**.

  Here is a reconstruction of how he blocks the inference, followed by an evaluation of his consistency.

  ### 1. Step-by-Step Reconstruction of the Argument

  Bentham's logic in this paragraph moves through three distinct filters. He accepts the data (pain/pleasure exist) but rejects the policy (punishment) based on how that data is generated and what validating it would cost the system.

  **Step 1: Acknowledgment (The Hedonic Entry)**
  Bentham admits the pain of antipathy is "unquestionably to be placed to the account of the mischief of the offence." He also admits the pleasure the public feels at punishment is an "additional reason for the punishing of it."
  *   *Status:* The utilitarian ledger is opened. The pain and pleasure are entered as debits and credits.

  **Step 2: The Efficiency/Alternative Cure Argument**
  Bentham argues that this specific pain (antipathy) is "grounded only in prejudice." Because it is based on error rather than "essential mischievousness" (tangible harm), it is susceptible to correction by reason ("bringing to view the considerations which shew it to be ill-grounded").
  *   *The Block:* If the pain can be removed by *education* (low cost) rather than *punishment* (high cost), then punishment is inefficient. In utilitarian terms, inflicting the pain of punishment to cure the pain of prejudice is a net loss when a cheaper alternative exists. The pain of prejudice is real, but indulging it is bad economics.

  **Step 3: The Systemic Security Argument ("Proves Too Much")**
  This is the crux of your question. Bentham argues that if we admit "propensity to punish" (based on mere dislike) as a *sufficient ground* for law, we destroy the principle of limitation.
  *   *The Block:* He invokes a slippery slope: "one should never know where to stop." He equates this to monarchical tyranny (Sovereign punishes who he dislikes) or popular tyranny (Majority punishes who they dislike).
  *   *The Standard:* The standard here is **Security of Expectations**. For Bentham, the law's primary utilitarian function is to create security so individuals can plan their lives. If the law punishes based on fluctuating public antipathy rather than fixed, demonstrable harm, no one is secure. The long-term pain of universal insecurity outweighs the short-term pleasure of the majority's malevolence.

  ### 2. Is this "Outweighed," "Don't Count," or "Proves Too Much"?

  It is primarily a **"Proves Too Much"** argument, underpinned by an **Efficiency** claim.

  *   **Not "Don't Count":** Bentham explicitly says the pain *is* to be placed on the account of mischief. He does not say "prejudice pain isn't real pain."
  *   **Not Simple "Outweighed":** He isn't just saying the victim's pain is greater than the crowd's pleasure in this specific instance. He is making a structural claim.
  *   **It is "Proves Too Much":** The argument is that validating this *type* of reason (antipathy without harm) as a legal precedent destroys the utility of the legal system itself.

  **What is the standard for "Never Know Where to Stop"?**
  You asked if "one should never know where to stop" is itself a hedonic complaint. In Bentham's framework, **yes, it is.**
  For Bentham, "Security" is the most vital component of utility. If the law has no objective boundary (like "harm to others") and relies instead on subjective "dislike," the resulting anxiety produces a massive, diffuse amount of pain across the entire population. Everyone lives in fear that they might become the next object of antipathy. Therefore, the "never know where to stop" warning is a prediction of **future, systemic hedonic disaster**, not a deontological constraint.

  ### 3. Is This Consistent Utilitarianism?

  This is the most contentious part of your inquiry. Is Bentham cheating?

  **The Case for Consistency (Rule/Systemic Utilitarianism)**
  Bentham is acting as a sophisticated utilitarian (anticipating what we might call Rule Utilitarianism). He is calculating the utility of the *rule* ("Punish only harmful acts") versus the utility of the *exception* ("Punish this act because it disgusts people").
  *   He recognizes that the pleasure derived from punishment in this case is **malevolence**. While Bentham generally counts all pleasures equally, he often notes that pleasures of malevolence are usually antisocial and lead to greater pain in the long run.
  *   He prioritizes **Security**. In his *Principles of Civil Law*, Bentham argues that security is the primary object of law. A system that allows punishment based on prejudice undermines security. Therefore, rejecting the punishment maximizes utility over time, even if it denies the immediate pleasure of the mob.

  **The Case for Inconsistency (The Hidden Principle)**
  However, a strict Act Utilitarian could argue Bentham is flinching.
  *   If the majority's disgust is intense enough, and the minority's suffering from punishment is "less" (in Bentham's calculus, the many usually outweigh the few), a strict hedonic calculation *should* justify punishment.
  *   By ruling out "prejudice" as a valid ground, Bentham seems to be smuggling in a **Liberal Harm Principle** (later codified by Mill) that operates as a side-constraint on the utility calculus. He is essentially saying, "Some pains (those based on prejudice) should not be satisfied by law, regardless of the numbers."
  *   This suggests he is relying on a principle of **Rationality** or **Truth** that stands outside the hedonic calculus. He assumes that pains based on "false" beliefs (prejudice) are less legitimate than pains based on "true" beliefs (harm). A pure hedonist might argue: *Pain is pain, regardless of whether the belief causing it is true.* If the crowd *believes* sodomy harms society, their pain is real to them. Bentham dismisses this by appealing to objective "essential mischievousness."

  ### Conclusion

  Bentham is trying to save utilitarianism from its own worst implication (the tyranny of the majority) by shifting the level of calculation from the **immediate act** to the **legal system's design**.

  He is arguing that while the pain of disgust is real, the **cost of validating it** is the destruction of legal security. He is entitled to this move *if* one accepts that the utility of a legal system depends on stable rules rather than case-by-case hedonic summation.

  However, you are right to sense a tension. To make this work, Bentham has to assert that pains grounded in "prejudice" are remediable by reason and therefore should not be indulged by coercion. This relies on an optimistic view of human rationality and a distinction between "legitimate" and "illegitimate" preferences that sits uncomfortably with the idea that "pleasure is good and pain is evil, regardless of source." He is quietly relying on a **principle of rational autonomy**: that the goal of law is to align preferences with reality, not to cater to preferences as they currently exist. This is consistent with his broader project of rational reform, but it does stretch the strict definition of hedonistic utilitarianism.
