      *   *Key Term:* "Security" and "Expectations." Bentham places huge weight on these.
      *   *Key Term:* "Malevolence." Bentham views the pleasure of punishment derived from antipathy as malevolent. While pleasure is pleasure, indulging malevolence generally leads to net pain.

  5.  **Self-Correction/Refinement during drafting:**
