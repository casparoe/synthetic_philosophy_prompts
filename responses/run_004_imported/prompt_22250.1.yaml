      *(Self-Correction on the "Don't Count" aspect)*: Bentham does imply that because the antipathy is "grounded only in prejudice," it *ought* to be removable. If a pain can be removed by information rather than coercion, coercion is inefficient. This is an efficiency argument, not necessarily a "pain doesn't count" argument.

      *(Final check on the "Standard")*: The standard is the *Principle of Utility itself*, applied to the *legal system as a whole*, not just the immediate act. The "tyranny" analogy shows the net utility of such a system is negative.

