answer: |-
  **Title:** The Harsanyi Doctrine as Dogma: Why the Common Prior Assumption Fails as a Rationality Requirement

  **Introduction**

  In the standard Harsanyi type-space framework, the Common Prior Assumption (CPA) is the silent engine driving the machinery of interactive epistemology. It posits that while agents may possess different private information (partitions of the state space), they all begin with the same subjective probability distribution over that space. This assumption is the prerequisite for Aumann's seminal "Agreeing to Disagree" theorem and the Milgrom-Stokey no-trade theorems. If priors are common and posteriors are common knowledge, they must be identical; if priors are common, speculative trade based on private information is impossible.

  For two weeks, this seminar has treated the CPA as a background condition—a technical necessity for generating clean theorems about knowledge and belief. However, treating the CPA as a mere modeling convenience obscures a deeper philosophical question: Is the CPA a normative requirement of rationality, or is it a substantive empirical claim that arbitrarily restricts the domain of rational agents? This essay argues the latter. While the CPA is often defended as a harmless idealization for logically omniscient agents, it is indefensible as a rationality requirement. Drawing on the critiques of Stephen Morris and the debate between Aumann and Gul, I demonstrate that the CPA imposes an objective probability structure onto subjective agents. Consequently, the CPA is neither a requirement for idealized Bayesian reasoners nor a plausible description of real people. Its abandonment does not break epistemic game theory; rather, it rescues no-trade theorems from being paradoxical constraints on rational speculation.

  **The Defense of the CPA: Rationality or Definition?**

  Proponents of the CPA, following John Harsanyi, often argue that differences in belief should be attributed solely to differences in information, not to fundamental differences in how agents process that information. This is sometimes called the "Harsanyi Doctrine." Under this view, if two rational agents share the same information, they should share the same beliefs. Extending this *ex ante* (before private information is received), it implies they must have started with the same prior.

  Defenders often characterize the CPA as a harmless idealization. In a Harsanyi type space, the state space $\Omega$ includes all uncertainty, including uncertainty about types. If the modeler specifies a single probability measure $\mu$ over $\Omega$, the agents are essentially "parts" of a single decision-making entity split by information barriers. From this perspective, demanding a common prior is akin to demanding logical consistency: just as a rational agent cannot believe $A$ and $\neg A$, two rational agents with the same data cannot assign different probabilities to $A$.

  This defense relies on conflating *consistency* with *identity*. Logical consistency requires that an agent's beliefs obey the axioms of probability. It does not, however, dictate which probability measure an agent must hold in the absence of data. To claim that rationality forces a unique prior is to claim that there is only one rational way to be uncertain about the world. This is a claim of objective Bayesianism (or logical probability), not subjective Bayesianism.

  **The Subjective Probability Critique: Morris and the Ex Ante/Interim Distinction**

  The most rigorous challenge to the normative status of the CPA comes from Stephen Morris. In his 1995 analysis of the CPA, Morris distinguishes between the *ex ante* stage (where the common prior is defined) and the *interim* stage (where agents have received private information but do not know others' types). Morris argues that if we take subjective expected utility (SEU) theory seriously, as formalized by Savage, the prior is a representation of an individual's personal preferences over acts.

  If probability is subjective, then a prior is a matter of taste, not logic. Two agents can both be perfectly rational (satisfying all SEU axioms) yet hold different priors, just as two rational agents can have different utility functions over wealth. Morris points out that the CPA is testable and empirically restrictive. By imposing a common prior, the modeler is not merely simplifying the math; they are ruling out a class of economies where agents genuinely disagree about the likelihood of fundamental states, independent of their private signals.

  Morris's critique undermines the "harmless idealization" defense. If the CPA rules out heterogeneous priors, and heterogeneous priors are permissible under subjective rationality, then the CPA is not a neutral technical assumption. It is a substantive claim that agents' "tastes for risk" regarding truth are identical. For an idealized agent—one who is logically omniscient but subjective—there is no rational compulsion to adopt the modeler's prior. Therefore, the CPA cannot be derived from the definition of a rational Bayesian agent.

  **Rationality and the Aumann-Gul Exchange**

  The question of whether rationality *implies* a common prior was directly engaged in the exchange between Robert Aumann and Faruk Gul. Aumann has long maintained that the CPA is a consequence of rationality in interactive settings. His argument suggests that if agents know they are rational, and know the structure of the game, any divergence in priors would be "common knowledge" and thus arbitraged away or corrected through a process of reasoning. For Aumann, the common prior is a consistency condition on the *system* of beliefs, not just individual beliefs.

  Gul (1998), in "On the Power of Rationality," challenges this. He demonstrates that the standard epistemic conditions used to justify solution concepts (like rationalizability) do not require a common prior. Gul argues that rationality is an individual property defined by internal consistency of preferences. There is no mechanism within subjective expected utility theory that forces an agent to align their prior with another agent's prior, even if they know the other is rational.

  Gul's position exposes the gap in Aumann's argument: Aumann's derivation often implicitly assumes that the agents share the same "theory" of the world. But if rationality is subjective, Agent A can believe Agent B is rational while simultaneously believing Agent B's prior is wrong. Agent A thinks, "B is a perfect reasoner, but B started with bad assumptions." This is not a contradiction in A's reasoning. Therefore, rationality alone does not bridge the gap between heterogeneous priors. The CPA must be imposed externally; it is not generated internally by the requirement of rationality.

  **The Collapse of No-Trade Theorems**

  The stakes of this debate extend beyond epistemology into economic mechanism design, specifically the no-trade theorems of Milgrom and Stokey (1982). These theorems state that if agents share a common prior and markets are efficient, no speculative trade can occur based solely on private information. Any trade that looks profitable to one side must look loss-making to the other (since it is a zero-sum game of information), and the common prior ensures they agree on the expected value.

  If the CPA is unjustified, these theorems lose their normative bite. If agents are permitted to have genuinely different priors, speculative trade becomes rational. Agent A buys an asset not because they think they have "better information" than Agent B in the sense of a finer partition, but because they genuinely value the state-contingent payoff differently based on their prior assessment of the world.

  Critics often argue that abandoning the CPA makes "anything go," destroying the predictive power of game theory. This is a category error. The no-trade theorems are not laws of nature; they are logical consequences of the CPA. If the CPA is false as a rationality requirement, then the fact that no-trade theorems "fall apart" is not a failure of theory, but a correction. Real financial markets exhibit massive speculative volume. A theory that predicts zero trade (under CPA) is failing to describe the phenomenon. Allowing heterogeneous priors restores the model's ability to explain why trade happens: people disagree because they see the world differently, not just because they hold different private data. The collapse of the no-trade theorem under heterogeneous priors is a feature, not a bug.

  **Conclusion: A Modeling Tool, Not a Rationality Norm**

  We must now answer the central question: Is the Common Prior Assumption defensible as a rationality requirement? The answer is no.

  For **real people**, the CPA is empirically false. People have different backgrounds, cultures, and cognitive frameworks that generate fundamentally different priors, not just different information sets.

  For **idealized agents**, the CPA is philosophically unjustified. As Morris and Gul demonstrate, subjective rationality permits heterogeneous priors. Logical omniscience ensures an agent's beliefs are consistent with their own axioms, but it does not force their axioms to match another agent's. To claim otherwise is to smuggle objective probability into a subjective framework.

  The CPA should be reclassified. It is not a condition of rationality; it is a condition of *coordination*. It describes a population of agents who have already converged on a shared worldview, perhaps through evolutionary pressure or long-run learning. It is a useful assumption for analyzing specific equilibrium contexts where such convergence has already occurred. But it is not a prerequisite for rational thought.

  To treat the CPA as a rationality requirement is to confuse the map for the territory. It privileges the modeler's single probability space over the agents' subjective realities. Formal epistemology gains rigor not by enforcing a common prior to secure agreement theorems, but by acknowledging that rational agents can, and often do, agree to disagree because they started from different worlds entirely. The CPA is a convenient fiction for the modeler, but it is not a law for the agent.
