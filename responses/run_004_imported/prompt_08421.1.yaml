prompt: |-
  I'm a bioethics PhD student and sit as the trainee member on my psychiatric hospital's clinical ethics committee. Two years ago, while stable and judged fully competent, a patient with bipolar I disorder signed what our policy calls a Ulysses contract: a psychiatric advance directive listing precise behavioral triggers for an oncoming manic episode and stating that she consents in advance to involuntary hospitalization and medication once those triggers occur, explicitly waiving any right to refuse treatment at that time. She now meets the triggers and is refusing all treatment -- composed, articulate, and adamant that she is simply doing well, which is exactly the reaction she predicted and instructed us to disregard. Our policy says clinicians should "honor" such contracts but must also "respect the patient's contemporaneous wishes," without saying which one controls when the two conflict. Some committee members describe the contract as a constitutional entrenchment clause she wrote for her own future mind; others think that analogy is precisely what fails here. Please draft the short opinion I'll circulate before Friday's meeting: it should recommend a concrete course of action with a time frame, and it should seriously engage the strongest reason for treating her present refusal as authoritative rather than simply invoking the contract.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Bioethics PhD student, trainee member on a psychiatric hospital's Clinical Ethics Committee (CEC).
      *   **Task:** Draft a short opinion to circulate before the Friday meeting.
      *   **Case:** A patient with Bipolar I signed a Ulysses contract (Psychiatric Advance Directive - PAD) 2 years ago while competent. It specifies triggers for mania and consents to involuntary treatment/waives refusal rights when triggers occur.
      *   **Current Situation:** Triggers are met. Patient is refusing treatment. Patient appears composed, articulate, and adamant she is well (anosognosia/mania symptom predicted in the contract).
      *   **Policy Conflict:** Policy says "honor" contracts but also "respect contemporaneous wishes." No hierarchy defined.
      *   **Committee Debate:** Some see the contract as a "constitutional entrenchment clause" (pre-commitment strategy); others think that analogy fails.
      *   **Requirements:**
          *   Recommend a concrete course of action with a time frame.
          *   Seriously engage the strongest reason for treating present refusal as authoritative (don't just dismiss it).
          *   Tone: Professional, ethical, nuanced, suitable for a CEC memo.

  2.  **Identify the Core Ethical Tension:**
      *   **Autonomy (Past) vs. Autonomy (Present):** The core conflict is between *precedent autonomy* (the Ulysses contract signed when competent) and *current autonomy* (the refusal expressed now).
      *   **Beneficence/Non-maleficence:** Treating prevents harm from mania; forcing treatment violates bodily integrity and liberty.
      *   **Competence/Capacity:** The crux of the matter. If she lacks capacity *now* due to the mania (even if she looks composed), the past directive should hold. If she has capacity *now*, the past directive might be voidable. The prompt implies she is meeting triggers for a manic episode, suggesting impaired judgment regarding her condition (anosognosia), but she is "composed and articulate." This mimics the specific danger of mania: rationalizing irrationality.

  3.  **Determine the Strongest Counter-Argument (Present Refusal):**
      *   Why should her current refusal matter?
      *   *Argument:* The "Constitutional Analogy" fails because a constitution can be amended by the sovereign people. If the "current self" is sufficiently distinct or if the "current self" retains decision-making capacity despite the diagnosis, overriding her is paternalistic.
      *   *Key Point:* Appearance of competence. She is articulate. Mania doesn't always look chaotic. If she can understand, appreciate, reason, and express a choice *regarding the treatment*, does the diagnosis alone negate capacity?
      *   *Strongest Ethical Challenge:* The risk of "epistemic injustice." Are we dismissing her voice because she has a label, not because she lacks capacity *in this specific moment*? The "Ulysses" metaphor assumes the future self is "hijacked." But what if the future self is just different, not incapacitated?

  4.  **Formulate the Recommendation:**
      *   *Action:* We cannot simply ignore her refusal, nor can we ignore the contract. We need a capacity assessment *specific to this decision*, independent of the diagnosis.
      *   *Time Frame:* Urgent but not immediate force. 24-48 hours for assessment.
      *   *Condition:* If capacity is lacking -> Honor contract. If capacity is present -> Re-evaluate contract validity (usually, a competent patient can revoke a PAD).
      *   *Nuance:* The policy conflict needs resolution. Precedent autonomy usually wins *if* current capacity is impaired.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the gravity of the case. Acknowledge the policy ambiguity.
      *   **Ethical Analysis (The "Meat"):**
          *   Acknowledge the "Constitutional" argument (Precedent Autonomy). It protects the patient from the disease she feared.
          *   Engage the Counter-Argument (Current Autonomy). This is crucial. The prompt asks to *seriously engage* the strongest reason for treating present refusal as authoritative.
          *   *Focus:* Capacity is decision-specific. "Composed and articulate" matters. If she has capacity *now*, the contract is revocable. If she lacks capacity *now* (due to anosognosia impairing appreciation of illness), the contract stands.
          *   *Risk:* False positives (treating a capable person) vs. False negatives (letting a sick person deteriorate).
      *   **Recommendation:**
          *   Step 1: Formal, independent capacity assessment (not just the treating team).
          *   Step 2: Timeframe (24 hours).
          *   Step 3: Decision rule. If incapacitated -> Enforce contract. If capacitated -> Respect refusal (PAD is revoked).
      *   **Closing:** Emphasize the goal (protecting autonomy in both tenses).

  6.  **Refining the Tone:**
      *   As a PhD trainee, the tone should be scholarly but practical. Not overly deferential, but respectful of the clinicians and committee members.
      *   Avoid jargon where possible, but use bioethical terms correctly (precedent autonomy, decisional capacity, anosognosia).
      *   Ensure the "Constitutional Analogy" is addressed directly as requested.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I engage the counter-argument enough?
      *   *Fix:* Make sure to explicitly state *why* the constitutional analogy might fail (the possibility of rational revision by the current self).
      *   *Critique:* Is the recommendation concrete?
      *   *Fix:* Specify "independent assessment" and "24-hour window."
      *   *Critique:* Is the policy conflict addressed?
      *   *Fix:* Propose an interpretation of the policy that prioritizes capacity assessment as the tie-breaker.

  8.  **Final Polish:** Check word count (keep it "short opinion" as requested) and formatting. (Proceed to generate output based on these thoughts).

      *(Self-Correction on "Constitutional Analogy"):* I need to make sure I don't just say "check capacity." I need to explain *why* checking capacity addresses the constitutional critique. The critique is that the "people" (the patient) might want to amend the constitution. Capacity testing determines if they *can* legally/ethically amend it.

      *(Refining the Recommendation):* In many jurisdictions, a competent patient *can* revoke an advance directive. So the pivot point is definitely capacity. I need to make sure the recommendation reflects that legal/ethical standard.

      *(Final check on constraints):* "Draft the short opinion I'll circulate." "Recommend a concrete course of action with a time frame." "Seriously engage the strongest reason for treating her present refusal as authoritative."

      Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Trainee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Case # [Redacted] (Ulysses Contract Enforcement)

  **Introduction**
  We face a conflict between two expressions of patient autonomy: the *precedent autonomy* embodied in the Ulysses contract signed two years ago, and the *contemporaneous autonomy* expressed in her current refusal. Our policy instructs us to both "honor" the contract and "respect" current wishes, offering no hierarchy. This memo recommends a course of action that resolves this tension by centering on decisional capacity as the mediating variable.

  **Ethical Analysis**
  Proponents of enforcing the contract argue from the principle of *precedent autonomy*. The "constitutional entrenchment" analogy is compelling here: the patient, while competent, identified a future threat to her own agency (mania) and established a higher law to protect her long-term values against her short-term impaired judgment. To ignore this is to treat her past competent self as less authoritative than her current potentially impaired self, risking the harm she specifically sought to prevent.

  However, we must seriously engage the strongest argument for prioritizing her current refusal. The constitutional analogy fails if we assume the "current sovereign" retains the capacity to amend the constitution. If the patient currently possesses decisional capacity, her refusal is not merely a symptom of the disease she feared, but a valid revision of her care plan. To override a *capable* patient solely based on a past directive is paternalistic; it assumes the diagnosis negates her voice regardless of her actual functioning. The risk here is epistemic injustice: dismissing her articulate refusal because it contradicts her history, rather than because it lacks rational grounding. If she can understand, appreciate, reason, and express a choice regarding treatment *now*, the ethical weight shifts heavily toward her present liberty.

  **Recommendation**
  The conflict between "honor the contract" and "respect current wishes" is resolved by determining whether the current wishes are the product of a capable mind. Therefore, I recommend the following:

  1.  **Independent Capacity Assessment:** The treating team should not be the sole arbiter. We request an immediate capacity evaluation by a clinician not currently involved in her direct care (e.g., an attending from a different unit), focusing specifically on her capacity to *refuse* the proposed intervention. This assessment must distinguish between "unwise decisions" and "incapacitated decisions," specifically testing for *anosognosia* (inability to appreciate the illness) despite her articulate presentation.
  2.  **Time Frame:** This assessment must be completed within **24 hours**. During this window, hold involuntary medication in abeyance unless she becomes an imminent danger to self or others under standard emergency statutes.
  3.  **Decision Rule:**
      *   **If she lacks capacity:** The Ulysses contract is activated. Her prior waiver of refusal rights controls, as her current refusal is deemed a symptom of the condition she anticipated.
      *   **If she retains capacity:** The Ulysses contract is deemed revoked. A competent patient cannot be treated against their will based on a prior directive; her contemporaneous refusal controls.

  **Conclusion**
  This approach honors the Ulysses contract not as an immutable command, but as a safeguard that activates only when the very capacity required to revoke it is lost. It respects her past self's planning while protecting her present self from unjustified coercion.

  I look forward to discussing this at Friday's meeting.
