  2.  **Understand the Metaphysical Disagreement:**
      *   **Humeanism (Best System Account, etc.):** Laws of nature are nothing over and above the total collection of particular matters of fact (events). They are concise summaries or descriptions of the regularities in the universe. They don't *make* things happen; they just describe what *did* happen. There is no necessary connection.
      *   **Anti-Humeanism (Armstrong, Dretske, Tooley, etc.):** Laws of nature are real relations between universals (or dispositions/powers). They *govern* or *produce* the events. They explain *why* the regularities exist. There is a modal force (necessity) behind the laws.

