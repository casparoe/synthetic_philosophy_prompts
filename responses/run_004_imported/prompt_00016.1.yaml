answer: |-
  A Humean and an Anti-Humean are watching an apple fall from a tree.

  The Anti-Humean says, "Behold! The Law of Gravity is exerting its necessary force. It *governs* the apple, compelling it to fall."

  The Humean replies, "No, the apple fell. The Law of Gravity is just us writing a concise summary of the fact that apples tend to do that."

  The Anti-Humean scoffs, "But if the apple suddenly floated upward, the Law would be *violated*!"

  The Humean shakes his head. "No. If the apple floated upward, the Law would just change to reflect that. The laws supervene on the events. They can't be broken, only updated."

  The Anti-Humean throws up his hands. "So the laws have no modal force? They don't constrain reality at all?"

  "None," says the Humean. "The events constrain the laws, not the other way around."

  The Anti-Humean stares at him. "So you're saying the Laws of Nature aren't the rulebook for the universe?"

  "No," says the Humean. "I'm saying they're just the post-game recap."
