answer: |-
  Your friend is right to press you on Sobel's result, and she is right that it is not a mere nitpick. Jordan Howard Sobel's 1987 demonstration that Gödel's axioms entail modal collapse ($\phi \to \Box \phi$) is the most serious technical objection to the ontological argument in its formalized guise. If every truth is necessary, the distinction between God's necessary existence and the world's contingent existence vanishes, and the argument proves too much to be theologically useful.

  However, she is too quick to dismiss the emendation project. The consensus among contemporary modal logicians working on theistic proofs (including Melvin Fitting, who rigorously analyzed Anderson's proposals) is that the collapse is not a fatal blow to the *idea* of a Gödelian argument, but rather a diagnostic tool that reveals exactly where the original formalization was metaphysically imprecise.

  Here is the strongest case for a principled emendation—specifically, a restriction on the **Definition of Essence**—that blocks the collapse, preserves the proof of God's necessary existence, and avoids the charge of being *ad hoc*.

  ### 1. Diagnosing the Collapse: Where the Derivation Breaks

  To fix the argument, we must see exactly how Sobel derives $\phi \to \Box \phi$. The collapse does not arise from the conclusion that God exists necessarily; it arises from the interaction between the **Definition of Essence** and the **instantiation of God**.

  In Dana Scott's reconstruction, the definitions are:
  1.  **God-like ($G$):** $x$ possesses all positive properties.
  2.  **Essence ($\text{Ess}$):** $\phi$ is an essence of $x$ iff $\phi(x)$ and $\forall \psi [\psi(x) \to \Box \forall y (\phi(y) \to \psi(y))]$.
  3.  **Necessary Existence ($NE$):** $\forall \phi [\text{Ess}(\phi, x) \to \Box \exists y \phi(y)]$.

  **The Collapse Derivation (Simplified):**
  1.  **Theorem:** $\exists x G(x)$ (A God-like being exists).
  2.  **Theorem:** $G$ is an essence of $x$ (for any $x$ such that $G(x)$).
  3.  **Theorem:** $\Box \exists x G(x)$ (God exists necessarily).
  4.  **The Trap:** Let $p$ be any true proposition (e.g., "I am on a train"). Let $\psi$ be the property "being such that $p$" ($\lambda z. p$).
  5.  Since $p$ is true, the God-like being $x$ has property $\psi$ (trivially, everything has the property of being such that a true proposition holds). So, $\psi(x)$.
  6.  Because $G$ is the essence of $x$, by the **Definition of Essence**, $\psi(x)$ entails $\Box \forall y (G(y) \to \psi(y))$.
  7.  This means: Necessarily, anything that is God-like is such that $p$.
  8.  Since $\Box \exists y G(y)$ (from step 3), it follows that $\Box p$.
  9.  **Result:** Any true proposition $p$ is necessarily true. Modal collapse.

  **The Culprit:** The definition of **Essence**. It states that an essence entails *every* property the individual possesses ($\forall \psi [\psi(x) \to \dots]$). This includes **contingent** properties (like being on a train, or creating *this* specific world). By making $G$ the essence, the original axioms force $G$ to entail these contingent properties necessarily. Since $G$ exists necessarily, the contingent properties become necessary.

  ### 2. The Emendation: Restricted Essence

  The solution, championed by Melvin Fitting and in the spirit of Anthony Anderson's emendations, is to restrict the Definition of Essence. We should not expect an essence to entail *accidental* or *contingent* properties of an individual, only its *necessary* properties.

  **Original Definition:**
  $$\text{Ess}(\phi, x) \iff \phi(x) \land \forall \psi [\psi(x) \to \Box \forall y (\phi(y) \to \psi(y))]$$

  **Emended Definition ($\text{Ess}^*$):**
  $$\text{Ess}^*(\phi, x) \iff \phi(x) \land \forall \psi [\Box \psi(x) \to \Box \forall y (\phi(y) \to \psi(y))]$$

  **The Change:** We add a box operator to the antecedent. The essence $\phi$ now entails only those properties $\psi$ that $x$ possesses **necessarily**.

  ### 3. Why This Blocks the Collapse

  Let's run Sobel's derivation against the emended definition:

  1.  Let $p$ be a contingent truth ("I am on a train").
  2.  Let $\psi$ be the property $\lambda z. p$.
  3.  Does the God-like being $x$ have $\psi$? Yes, $\psi(x)$ is true.
  4.  Does $x$ have $\psi$ **necessarily**? No, $\Box \psi(x)$ is false (since $p$ is contingent).
  5.  **The Block:** The emended Definition of Essence ($\text{Ess}^*$) requires $\Box \psi(x)$ to trigger the entailment. Since we only have $\psi(x)$, the definition does not allow us to infer $\Box \forall y (G(y) \to \psi(y))$.
  6.  **Result:** We cannot derive $\Box p$. The distinction between contingent and necessary truth is preserved.

  ### 4. Does the Proof Still Work? (The "Defanged" Objection)

  Your friend's second worry is that this fix "defangs" the argument. If we weaken the definition of Essence, do we lose the ability to prove $\Box \exists x G(x)$?

  **The Answer is No.** The proof of God's necessary existence does not rely on God entailing contingent properties; it relies on God entailing **Necessary Existence ($NE$)**.

  1.  **Axiom:** $P(NE)$ (Necessary Existence is a positive property).
  2.  **Definition:** $G$ entails all positive properties.
  3.  **Inference:** Therefore, $G$ entails $NE$.
  4.  **Crucial Point:** $NE$ is, by definition, a modal property concerning existence across worlds. It is not a contingent property like "being on a train."
  5.  **Validity:** Under $\text{Ess}^*$, does $G$ still count as an essence of $x$? Yes, provided that all *necessary* properties of $x$ are entailed by $G$. Since $G$ captures the *nature* of the being (all positive properties), and necessary properties flow from nature, $G$ remains an essence under the restricted definition.
  6.  **Conclusion:** We can still derive $\text{Ess}^*(G, x)$, then $NE(x)$, and finally $\Box \exists x G(x)$.

  The argument still concludes that a God-like being exists in all possible worlds. It simply stops short of concluding that *everything else* exists in all possible worlds.

  ### 5. Confronting the "Ad Hoc" Charge

  Your friend suspects that any fix blocking collapse is *ad hoc*—tinkered with solely to save the conclusion. You can argue that the Restricted Essence definition is actually **metaphysically superior** to the original, independent of the collapse problem.

  **A. The Aristotelian Defense (Not Ad Hoc)**
  The original Scott definition treats "essence" as a logical container for *all* predicates true of an individual. This contradicts the classical metaphysical notion of essence (from Aristotle through Aquinas to Kripke). An essence is supposed to capture *what a thing is*, not *what happens to it*.
  *   *Example:* Socrates' essence is "being human." It entails "being rational." It does *not* entail "being snub-nosed" or "drinking hemlock," even though those are true of him.
  *   *Application:* If $G$ is God's essence, it should entail "being omnipotent" (a necessary property). It should not necessarily entail "creating world $W_1$ rather than $W_2$" if that choice is voluntary/contingent.
  *   *Verdict:* The emendation aligns the formal logic with the intended metaphysics of "essence." It isn't a patch; it's a correction of a category error in the original formalization.

  **B. The Theological Defense (Not Defanged)**
  Your friend argues the fix ruins the theological point. You can argue it **saves** it.
  *   **Divine Freedom:** A major theological objection to Gödel's original argument was that it seemed to entail theological determinism. If God exists necessarily, and God's essence entails all His properties, then God's actions (creating this world) are necessary. This contradicts the doctrine of Divine Freedom (that God freely chose to create).
  *   **Nature vs. Will:** The emendation allows a clean distinction:
      *   **God's Nature:** Necessary, entailed by $G$ (Omnipotence, Omniscience).
      *   **God's Will/Actions:** Contingent, possessed by $G$ but not entailed by $G$ as part of its essence (Choosing to create *this* universe).
  *   **Verdict:** The emended argument proves a Necessary Being with perfect attributes, without forcing the conclusion that the actual world is the only possible world. This is a *more* orthodox theological conclusion than the collapse version.

  ### 6. Summary for Your Friend

  When you speak to her again, you can frame it this way:

  "Sobel is right that the *original* Scott axioms collapse. But the collapse stems from a definition of 'Essence' that is logically valid but metaphysically incoherent (it conflates essential and accidental properties). By adopting the **Restricted Essence** emendation (in the spirit of Anderson and Fitting), we block the derivation of $\phi \to \Box \phi$ at the step where contingent properties are imported into the essence.

  This change is not *ad hoc* because it aligns the formalism with the standard metaphysical definition of essence (entailing only necessary properties). It is not *defanged* because the derivation of $\Box \exists x G(x)$ relies only on the necessary property of Necessary Existence, which is preserved. In fact, this version is theologically superior because it preserves the contingency of creation while securing the necessity of the Creator."

  This concedes her technical point (Sobel is right about the original) while winning the philosophical argument (the emended version is coherent, principled, and robust).
