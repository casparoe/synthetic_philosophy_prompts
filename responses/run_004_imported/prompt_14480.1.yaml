answer: |-
  This is a remarkable trajectory of self-education. To move from the practical realities of the East German border guard trials to the *Summa Theologiae* via the Hart-Fuller debate is to trace the exact contour of the problem of legal validity in the 20th century. You have correctly identified that Hart and Fuller both claim Aquinas as an ancestor while reading him through very different lenses. Hart sees him as a moralist commenting on law from the outside; Fuller sees him as a precursor to the idea that law has an internal purpose.

  You have asked for a reconstruction of how Aquinas would rule, using his own categories, with definite commitments on two specific points. I will proceed by applying the definitions found in the *Treatise on Law* (*Summa Theologiae* I-II, qq. 90–97), specifically focusing on the definition of law (q. 90), the derivation of human law (q. 95), and the binding force of unjust laws (q. 96).

  Here is how Aquinas would adjudicate the 1958 debate.

  ### 1. On the Status of the Nazi Statute: Aquinas Sides with Fuller

  **The Question:** Was the Nazi statute under which the wife denounced her husband a valid law (Hart), or did it fail to be law at all (Fuller)?

  **Aquinas's Categories:**
  For Aquinas, law is not merely the command of a sovereign backed by force (which is closer to Hart's "gunman situation writ large"). In *Summa* I-II, q. 90, a. 4, Aquinas defines law as "an ordinance of reason for the common good, made by him who has care of the community, and promulgated."

  All four elements are necessary, but the "ordinance of reason" and "common good" are the substantive heart. A rule that serves the private greed or paranoia of the ruler rather than the *bonum commune* (common good) fails the definition. In q. 95, a. 2, Aquinas states that human laws are derived from natural law. If a human law contradicts natural law (e.g., by commanding idolatry or forbidding necessary acts of justice), it is not a law but a "perversion of law" (*legis corruptio*).

  Crucially, in q. 96, a. 4, Aquinas addresses whether unjust laws bind in conscience. He distinguishes between laws that are unjust because they oppose human good (e.g., burdensome, unequal) and those that oppose Divine good (tyrannical, leading to idolatry). Regarding the latter, he writes: *"Such laws do not bind in conscience, except perhaps in order to avoid scandal or disturbance."* He goes further, quoting Augustine: *"Laws which appear unjust are seen to be no laws at all, but rather acts of violence."* (*Magis violentiae quam leges*).

  **The Ruling:**
  Aquinas would rule that the Nazi statute was **not law**.

  Hart argues that we must call it "law" to be conceptually clear, even if we refuse to obey it. Aquinas would reject this conceptual separation. For Aquinas, validity is not merely a matter of pedigree (was it enacted by the sovereign?). Validity is teleological. If the enactment does not aim at the common good, it lacks the *essence* of law. It exists physically as a command backed by force, but ontologically it is "violence."

  Therefore, on the specific question of whether the statute possessed the moral force of law at the time it was enacted, Aquinas sides with **Fuller**. The statute was a nullity in the court of conscience because it violated the primary precept of natural law (the preservation of community and justice) and served a tyrannical end. The wife could not appeal to it as a justification, because one cannot appeal to violence as a legal right.

  **The Nuance on Obedience:**
  However, Aquinas would add a caveat that complicates the "Grudge Informer" outcome. While the law was not binding, Aquinas notes in q. 96, a. 4 that one might obey an unjust law to avoid "scandal or disturbance." If the wife had denounced her husband solely to protect her children from immediate execution by the state (duress), Aquinas might view her action with pity, though still as technically unjust. But the historical record suggests she acted to "get him out of the way" for personal reasons. In that case, she acted on malice, using a tyrannical instrument. She is guilty not of breaking a valid Nazi statute, but of violating the natural law duty of justice and charity owed to her husband.

  ### 2. On Fuller's "Inner Morality": Aquinas Judges It Too Thin

  **The Question:** Is Fuller's procedural "inner morality of law" (generality, publicity, non-retroactivity, etc.) sufficient to capture Aquinas's natural law, or is it incomplete?

  **Aquinas's Categories:**
  Fuller's eight desiderata (from *The Morality of Law*) are almost entirely procedural. They ensure that a system of rules *functions* as a system of rules. A law must be public, clear, prospective, and consistent. Aquinas agrees with several of these: he requires **promulgation** (q. 90, a. 4) and that laws be **possible to obey** and consistent with **divine and natural law** (q. 95, a. 3).

  However, for Aquinas, procedure is secondary to substance. The "ordinance of reason" requires that the content of the law directs citizens toward virtue and the common good (q. 92, a. 1). A law can be perfectly clear, public, prospective, and consistent, yet still be evil. For example, a law stating "All red-haired children shall be euthanized at birth," if promulgated clearly and applied consistently, meets Fuller's procedural criteria. It fails Aquinas's criteria because it destroys the common good and violates the fundamental natural precept of preserving life.

  Fuller's theory is that if a government fails the procedural tests, it cannot achieve substantive evil effectively. Aquinas would argue this is empirically false. Tyrants often issue clear, public, prospective commands that are monstrously unjust.

  **The Ruling:**
  Aquinas would judge Fuller's account as **too thin**.

  While Aquinas would recognize Fuller's "inner morality" as a necessary condition for law (a tyrannical decree that is secret or retroactive is even *less* like law), he would insist it is not a *sufficient* condition. Fuller's natural law is a "procedural natural law." Aquinas's is a "substantive natural law."

  For Aquinas, the "reason" in "ordinance of reason" is not just logical consistency (which Fuller provides); it is right reason (*recta ratio*) ordered toward the true human end (*telos*). A legal system that is procedurally perfect but substantively wicked is not a "partial" legal system to Aquinas; it is a successful criminal conspiracy wearing the mask of law. Therefore, he would reject Fuller's implication that procedural fidelity is the primary safeguard of justice. The primary safeguard is the substantive orientation toward the *bonum commune*.

  ### Summary of the Thomistic Judgment

  If dropped into the 1958 exchange, Aquinas would issue the following definite rulings:

  1.  **On the Validity of the Nazi Statute:** He sides with **Fuller**. The statute was not law (*non est lex*), but violence (*violentia*). It lacked the essential ordination toward the common good. Hart is incorrect to grant it the title of "law" simply because it followed the regime's rules of recognition; for Aquinas, a rule of recognition that permits tyranny is itself defective in reason.
  2.  **On Fuller's Inner Morality:** He sides against **Fuller** (and implicitly with Hart's critique that morality is separate, though for different reasons). Fuller's procedural morality is necessary but insufficient. It captures the *promulgation* and *reasonableness* of law but misses the *end* of law. A law can satisfy Fuller's eight principles and still be damnable. Aquinas requires the substantive test of the common good, which Fuller explicitly tried to avoid to prevent imposing a specific moral doctrine.

  **The Practical Outcome for the Wife:**
  Aquinas would support her punishment, but not on the grounds Fuller used. Fuller argued she should be punished because the Nazi law wasn't law, so she had no defense. Aquinas would argue she should be punished because she violated the **Natural Law**. She used a tool of violence to commit an act of private injustice. The court should not pretend the Nazi statute was valid (agreeing with Fuller against Hart), but it should not pretend the only issue was legal validity. The issue was that she betrayed a natural duty. The court should punish her under a new statute that honestly admits it is punishing a violation of natural justice, rather than engaging in legal fiction.

  In this specific pragmatic conclusion, Aquinas actually converges with **Hart's** recommendation (pass a retroactive statute to be honest) but for **Fuller's** reason (the old law was morally void). He would tell Hart: "You are right that we must be honest about the retroactivity, but wrong to call the Nazi rule 'law'." He would tell Fuller: "You are right that the Nazi rule was not 'law,' but wrong to think procedural defects were the main reason why."

  ### Why This Distinction Matters for You
  As an electrician, you know the difference between a circuit that is *live* and a circuit that is *grounded correctly*. Hart looks at the wire and says, "There is voltage, so it is live." Fuller says, "If the grounding is faulty, it's not a proper circuit." Aquinas says, "If the voltage is driving a motor that grinds children into meat, it doesn't matter if the wiring is perfect; it is not a legitimate use of power, and calling it 'electricity' in the normative sense is a confusion."

  Aquinas insists that law is a moral technology. If it does not produce the good it is designed for (the common good), it is not merely a "bad tool"; it is a weapon. To call it "law" is to confuse a weapon with a tool.
