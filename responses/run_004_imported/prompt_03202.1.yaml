answer: |-
  First off, tell Dana that she (and you) have incredibly sharp instincts. You have identified the single biggest debate in contemporary Just War Theory. You aren't missing something obvious; you have stumbled directly onto the fault line between **Traditional Just War Theory** (Michael Walzer) and **Revisionist Just War Theory** (Jeff McMahan).

  The tension you are feeling isn't a mistake in your reading—it is the actual philosophical conflict between these two thinkers.

  Here is the breakdown of why this distinction exists, why it seems contradictory, and whether Dana is right to call it a fatal flaw.

  ### 1. The Traditional View (Michael Walzer)
  Walzer argues for the **Independence Thesis**. This is the idea that *Jus ad Bellum* (justice of going to war) and *Jus in Bello* (justice in fighting) are separate spheres.

  *   **The Logic:** Walzer acknowledges that one side is the aggressor (unjust) and one is the defender (just). However, he argues that individual soldiers are not morally responsible for the decision to go to war. They are "instruments" of the state. They are coerced, they lack full information, and they have a duty to obey lawful orders.
  *   **Moral Equality of Combatants (MEC):** Because soldiers are instruments, Walzer argues they possess equal rights on the battlefield. A soldier fighting an unjust war does not become a murderer simply by fighting, provided they follow the rules of war (don't target civilians, treat POWs well, etc.).
  *   **The "Point" of this separation:** Walzer is a pragmatist. He argues that if we deny MEC, war becomes infinitely worse.
      *   If soldiers on the unjust side know they are morally equivalent to criminals, they have no incentive to follow the rules of war. They might as well commit atrocities because they are already "guilty."
      *   If the "just" side believes the enemy soldiers are murderers, they might refuse to take prisoners or treat them humanely.
      *   **Goal:** The goal of Walzer's framework isn't just moral purity; it is **limiting the horror of war.** By treating soldiers as equals, we keep the violence contained within certain rules (like the Geneva Conventions).

  ### 2. The Revisionist View (Jeff McMahan)
  This is where your intuition and Dana's come in. McMahan argues that Walzer's separation is logically incoherent.

  *   **The Logic:** McMahan uses an analogy: If a group of criminals tries to rob a bank, and the police show up to stop them, a shootout ensues. Do the criminals have the same moral right to shoot the police as the police have to shoot the criminals? Most people would say **no**. The criminals are doing something wrong; the police are stopping them.
  *   **Rejecting MEC:** McMahan argues that moral responsibility cannot be so easily shed. If a war is unjust (*ad bellum*), then the soldiers fighting it are generally participating in a wrongful act. Therefore, they do not have the same moral right to kill enemy soldiers as the defenders do.
  *   **The "Point" of this view:** The goal here is **moral consistency.** McMahan believes we shouldn't sacrifice moral truth for practical convenience. If we want to discourage unjust wars, we should acknowledge that fighting in one makes you morally liable to be attacked.

  ### 3. Addressing Your Specific Questions

  **"Doesn't that basically mean just war theory can't say one side is more 'right' than the other?"**
  No. Even in Walzer's Traditional Theory, the *states* are not equal.
  *   **Walzer:** The *State* of Aggressia is morally wrong for starting the war (*Jus ad Bellum*). They should be sanctioned, punished, or stopped. However, the *Soldier* from Aggressia is morally equal to the *Soldier* from Defendia on the battlefield (*Jus in Bello*).
  *   **The Distinction:** The theory judges the **Cause** differently, but treats the **Combatants** the same.

  **"What's even the point of the theory... if it turns around and says the combatants themselves are basically all in the same moral boat?"**
  *   **Walzer's Answer:** The point is to create a functional international legal order. If we adopt McMahan's view, every soldier would have to pause before shooting and ask, "Is my country's cause actually just?" This leads to hesitation, insubordination, and chaos. Walzer prioritizes **order and humanitarian protection** over deep moral accounting for individual soldiers.
  *   **McMahan's Answer:** The point is to assign blame correctly. If we stick with Walzer, we let aggressors off the hook too easily.

  **"Is Dana right that this proves Just War Theory contradicts itself?"**
  Dana is half-right.
  *   She is right that there is a **tension**. McMahan successfully argued that Walzer's view is logically inconsistent (you can't say the war is criminal but the soldiers aren't).
  *   She is wrong that it means the framework isn't "serious." Walzer's view is the foundation of International Humanitarian Law (the Geneva Conventions). It is "serious" because it is the system the world actually uses to try to prevent total barbarism. McMahan's view is philosophically tighter but practically very difficult to implement.

  ### Summary for Your Class
  You can explain it to your teacher like this:

  1.  **Walzer (Traditional):** Separates the *Leader's Guilt* from the *Soldier's Rights*. He accepts the "contradiction" because it keeps soldiers following rules. If soldiers think they are treated equally, they are more likely to follow the laws of war.
  2.  **McMahan (Revisionist):** Says the "contradiction" is unacceptable. If the war is unjust, the soldiers are morally liable. He prioritizes moral truth over practical order.
  3.  **Your Insight:** You correctly identified that MEC seems to undermine *Jus ad Bellum*. Walzer would say it doesn't undermine it; it just compartmentalizes it to save lives. McMahan would say you are right, and the theory needs to be fixed.

  You and Dana aren't confused; you're just thinking like Revisionists while studying a Traditionalist framework. That's a great place to be in an AP Gov class.
