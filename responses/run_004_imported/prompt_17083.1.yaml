answer: |-
  This is a fantastic case study for a seminar because it stress-tests the limits of Aquinas's political realism. You've hit on the exact tension that keeps Thomistic political theorists up at night: **What happens when the "public authority" required to check tyranny *is* the tyranny?**

  To give you the best material for your prep, we need to disentangle two distinct threads in Aquinas's thought: the distinction between types of tyrants, and the evolution of his thought on *who* has the license to act.

  Here is how Aquinas would likely parse your "elected autocrat" scenario, digging into the texts you mentioned.

  ### 1. The Crucial Distinction: Usurper vs. Legitimate-Turned-Tyrant
  Aquinas is not consistent across all texts, but he is consistent on one foundational distinction. He separates the **tyrant without title** (*tyrannus ex defectu tituli*) from the **tyrant by exercise** (*tyrannus ex parte exercitii*).

  *   **The Usurper:** Someone who seizes power by force or fraud, having no legitimate claim. Aquinas is relatively permissive here. In the *Commentary on the Sentences* (II Sent., d. 44, q. 2, a. 2), he suggests that killing a usurper can be meritorious because they are an aggressor against the common good.
  *   **The Elected Autocrat (Your Case):** This leader won a fair election. He has a *title*. His sin is in the *exercise* of power (gutted courts, rewritten constitution).

  **Aquinas's Verdict:** This is the harder case. Because the leader originated legitimately, he is not an external aggressor but a corrupted head of the body politic. In *De Regimine Principum* (On Kingship), Aquinas becomes significantly more cautious here. He argues that once authority is established, even if abused, the *order* of authority must be respected to avoid greater evils (sedition, civil war).

  ### 2. The Textual Tension: *Sentences* vs. *De Regimine*
  You noted the difference between the texts, and it is vital for your seminar.

  **In the *Commentary on the Sentences* (Early Aquinas):**
  He is more permissive regarding tyrannicide. He cites the Old Testament (Ehud killing Eglon) and suggests that if a tyrant threatens the spiritual or temporal welfare of the community, a private individual *might* act if there is no other recourse. He focuses heavily on the **merit** of the act for the common good.
  *   *Seminar Point:* Here, Aquinas leans toward a "natural law defense" intuition. If the law is dead, natural right to defend the community wakes up.

  **In *De Regimine Principum* (Later/Thomistic School):**
  This text (Book I, Chapter 6) is where he tightens the reins. He explicitly warns against private individuals taking it upon themselves to kill a tyrant.
  *   **The Argument:** He argues that killing a tyrant privately sets a dangerous precedent. What if the "tyrant" was just misunderstood? What if the assassin becomes the next tyrant? He points out that many "tyrannicides" in history just led to worse instability.
  *   **The Shift:** He moves from "Is the act good?" to "Is the act orderly?" For Aquinas, justice is not just about the outcome; it is about the *order* of the action. Private violence disrupts the order of justice, even if the target is wicked.

  ### 3. The "Captured Authority" Problem
  This is the core of your question. If the courts are gutted and the constitution rewritten, there is no "public authority" left to authorize removal. Does Aquinas allow the citizens to become the authority?

  **Aquinas's Answer: The "Public" vs. "Private" Distinction**
  Aquinas would likely **not** bless private citizens acting as a mob or assassins, even in your scenario. However, he leaves a narrow door open for **public deposition.**

  In *De Regimine*, he suggests that if a king was originally elected by the community (which fits your fair election scenario), the community *as a corporate body* retains the right to depose him if he breaches the terms of the rule.
  *   **Key Nuance:** It cannot be a private conspiracy. It must be an act of the *multitude* acting in a public capacity.
  *   **The Catch:** In your scenario, the leader has rewritten the constitution to prevent this. Aquinas would likely argue that if the *legal* mechanism for deposition is destroyed, the community must wait for a higher authority to intervene (e.g., an Emperor, a Pope, or a neighboring power acting as a liberator) or wait until the community can re-constitute itself as a public body.

  **Why the Caution?**
  Aquinas is a consequentialist regarding order. He famously argues that it is often better to endure a mild tyranny than to risk a rebellion that fails and leads to a worse tyranny, or succeeds and leads to anarchy.
  *   *Quote for Seminar:* In *De Regimine*, he notes that often "through the fear of a tyrant, many things are done which are contrary to the common good... [but] it often happens that those who kill a tyrant... are themselves succeeded by worse tyrants."

  ### 4. How Aquinas Diagnoses the "Legal" Subversion
  Your scenario involves a leader using "legal" channels to destroy justice. Aquinas has a specific tool for this: **Lex Iniusta Non Est Lex** (An unjust law is no law).

  In the *Summa Theologiae* (I-II, q. 96, a. 4), he argues that laws which are contrary to the common good (like rewriting a constitution to ensure permanent rule) do not bind in conscience.
  *   **Application:** Citizens are not obligated to obey the *new* constitutional term limits (or lack thereof). They can treat the leader as having forfeited his moral authority.
  *   **Limit:** However, "not obeying" is different from "killing." Aquinas would advocate for **passive resistance** and non-compliance over active violence. He would argue that by violating the common good, the tyrant effectively deposes himself, but the *act of removal* still requires public order.

  ### 5. Summary for Your Seminar
  If you are playing Devil's Advocate or synthesizing his position, here is the likely Thomistic conclusion on your "Elected Autocrat":

  1.  **No Blessing for Assassination:** Aquinas would almost certainly condemn private citizens assassinating this leader. Because the leader was not a usurper, the "private defense" argument from the *Sentences* is overridden by the "public order" argument in *De Regimine*.
  2.  **The "Public" Loophole:** He would argue that the *people corporately* (not as individuals) retain the ultimate sovereignty if the original grant of power was conditional on the common good. If they can act as a "public authority" (e.g., a mass resignation of officials, a general strike that functions as a deposition), that is permissible. But it must look like justice, not sedition.
  3.  **The Preference for Prevention:** Aquinas would likely pivot your seminar to his preference for a **Mixed Constitution** (*regimen commixtum*). He argues in *De Regimine* and the *Summa* that the best way to avoid this dilemma is to structure the government so that no single leader *can* gut the courts or rewrite the constitution alone. The tragedy of your scenario, for Aquinas, is a failure of constitutional design, not just a failure of courage.
  4.  **The "Lesser Evil" Warning:** Finally, be prepared for Aquinas's grim realism. He would ask: "If you kill him, who comes next?" If the institutions are gutted, there is no mechanism to select a successor. Aquinas might argue that until the institutions are restored, removing the tyrant creates a vacuum that invites worse evil.

  **The Takeaway:** Aquinas stretches his caution very far. He would likely tell your citizens that they are under no obligation to obey the tyrant's unjust decrees, but they are not licensed to become judges and executioners themselves. They must wait for, or create, a *public* mechanism for removal. If that is impossible, he might sadly counsel endurance over the chaos of civil war, trusting that God ultimately judges tyrants.

  This tension between **Natural Law** (defend the good) and **Positive Order** (respect authority) is exactly where your seminar should live. It shows Aquinas isn't a revolutionary, but he isn't a statist either—he's an institutionalist.
