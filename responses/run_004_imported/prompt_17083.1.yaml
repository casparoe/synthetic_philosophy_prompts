prompt: |-
  So I'm prepping next week's seminar on Aquinas and tyrannicide, and there's a case that's been bugging me that Aquinas obviously never had in mind. Picture a leader who wins a genuinely fair election, then spends his time in office quietly gutting the courts and jailing critics through "legal" channels, rewriting the constitution so he never has to leave, all without ever technically seizing power by force. Given that he wasnt a usurper to begin with, what do you think Aquinas would actually say about a guy like that? And if ordinary citizens became convinced there was no lawful route left to remove him, would Aquinas bless them acting on their own, or would he still insist on waiting for "public authority" to act, even once that authority is itself the thing that's been captured? He says slightly different things about this across the commentary on the Sentences and De Regimine Principum, so dig into that if it helps. Curious how far his caution actually stretches once the normal channels are gone.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Aquinas on tyrannicide/tyranny.
      *   **Specific Scenario:** A democratically elected leader who gradually subverts institutions (courts, constitution, critics) using "legal" means to become a permanent ruler (soft coup/autocrat), rather than a violent usurper.
      *   **Key Question:** Would Aquinas sanction removal (even by private citizens) if lawful routes are exhausted and public authority is captured?
      *   **Specific Texts:** Commentary on the Sentences (*Scriptum super Sententiis*) vs. *De Regimine Principum* (On Kingship).
      *   **Tone:** Academic but accessible (seminar prep), nuanced, engaging with the tension in Aquinas's thought.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Aquinas's General Stance:* He is generally cautious about tyrannicide. He distinguishes between a usurper (tyrant without title) and a legitimate ruler who becomes tyrannical (tyrant by exercise).
      *   *Key Texts:*
          *   *Commentary on the Sentences* (II Sent., d. 44, q. 2, a. 2): Earlier work. More permissive? Discusses the slaying of a tyrant as meritorious if it liberates the country.
          *   *De Regimine Principum* (On Kingship): Later (or attributed to him, partly by Tolomeo of Lucca). More cautious. Emphasizes public authority, not private presumption.
          *   *Summa Theologiae* (II-II, q. 42, a. 2; q. 64, a. 3): Sedition vs. Justice. Obeying God rather than men.
      *   *The Specific Scenario:* The "legal tyrant." This fits the "tyrant by exercise" category, not "tyrant without title" (usurper).
      *   *The Core Tension:* Private action vs. Public authority. What happens when public authority is the tyrant?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the relevance of the scenario (modern autocracy) and validate the user's observation about the tension in Aquinas's texts. Set the stage: Aquinas is more nuanced than a simple "yes/no" on tyrannicide.

      *   **Distinguishing the Types of Tyrants:** This is crucial.
          *   *Tyrant without title (Usurper):* Aquinas is clearer here. Defense is permissible.
          *   *Tyrant by exercise (Legitimate origin, bad rule):* This is the user's case. Aquinas is much more cautious.
          *   *Application:* The elected leader is a tyrant *by exercise*. He started legitimate.

      *   **Textual Evolution (Sentences vs. De Regimine):**
          *   *Sentences:* Earlier. Seems to allow private individuals to kill a tyrant if it serves the common good (referencing Old Testament examples).
          *   *De Regimine:* Later/Mature. Shifts focus. Explicitly warns against private presumption. Argues that removing a tyrant is the job of *public authority*, not private individuals.
          *   *Why the shift?* Concern for sedition, chaos, and the greater evil of instability.

      *   **Addressing the "Captured Authority" Problem:**
          *   The user asks: What if public authority is gone/captured?
          *   *Aquinas's Logic:* If the *mechanism* for removal is captured, Aquinas generally points to a higher public authority (e.g., Emperor over King, Pope over King, or the community acting *as* a public body, not as private mobs).
          *   *The "Community" Aspect:* In *De Regimine*, he suggests the community might have the right to depose if they originally elected the king (pact theory hint). But this must be done *publicly*, not by assassination.
          *   *The Limit:* He rarely, if ever, blesses *private assassination* of a legitimate-turned-tyrant. He fears the precedent more than the specific tyrant.

      *   **The "Legal" Subversion:**
          *   Aquinas cares about the *end* (Common Good) and the *form* (Justice).
          *   If laws are twisted to serve private gain over common good, they cease to be laws (lex iniusta non est lex).
          *   However, resisting them still requires order.

      *   **Synthesizing the Answer for the Seminar:**
          *   *Would he bless private action?* Probably not. He'd fear the slide into anarchy more than the continuation of the tyrant.
          *   *What would he suggest?* Passive resistance, appeal to higher authority (if any), or waiting for a public mechanism to re-emerge.
          *   *The "Lesser Evil" Argument:* Aquinas often argues that a mild tyranny is better than the chaos of failed rebellion which leads to worse tyranny.

      *   **Nuance/Complication:** Mention the authorship of *De Regimine* (Tolomeo of Lucca). Even if partly Tolomeo, it represents the "Thomistic school" view.
      *   **Modern Application:** Connect back to the "elected autocrat." Aquinas would likely diagnose this as a corruption of the *regimen politicum* (mixed constitution) which he preferred.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't overstate the *Sentences* permissiveness. Even there, he's careful about motive.
      *   *Correction:* Be clear that *De Regimine* isn't strictly "no," it's "not by private hand." It leaves open public deposition.
      *   *Key Insight:* The user's scenario is about *legal* subversion. Aquinas distinguishes between the *source* of power and the *use* of power. The source was clean, the use is corrupt. This makes private removal much harder to justify than against an invader.
      *   *The "Public Authority" Loop:* If the tyrant *is* the public authority, who acts? Aquinas hints at the "multitude" acting corporately, not individually. This is a key distinction for the seminar.

  5.  **Final Polish:**
