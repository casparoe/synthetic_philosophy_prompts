      *   *View on Materialism:* Explicitly rejected. He believed physics would eventually prove the existence of concepts/mind independent of matter.

  3.  **Evaluate Brain Uploading against Gödel's View:**
      *   *The Technology:* It assumes functionalism/computationalism. The mind *is* what the brain *does*. If you replicate the structure (synapses), you replicate the mind. It is inherently materialist/physicalist.
      *   *Gödel's Reaction:*
          *   **Materialism:** Uploading presupposes materialism (mind arises from physical structure). Gödel argues materialism is false. Therefore, copying the physical structure copies nothing essential.
          *   **Mechanism:** Uploading creates a digital emulation (a finite machine/algorithm). Gödel argues the human mind surpasses any finite machine (Disjunction). Therefore, an emulation cannot capture the essence of the mind.
          *   **Teleology/Continuity:** Gödel's afterlife is about *moral and rational development* of the *subject*. An emulation is a copy. Is it the same subject? For Gödel, the "I" is likely a monad or a non-physical substance. Copying the hardware doesn't move the monad.
          *   **Verdict:** Gödel would likely view this as a category error. It's building a sophisticated puppet, not preserving the person. It secures no reunion because the "friend" (the rational subject) has moved on (or ceased, but likely moved on per his afterlife argument), while the emulation is just a philosophical zombie or a distinct, lesser entity.

  4.  **Drafting Gödel's Verdict (The Strong Case):**
      *   *Premise 1: The Mind is Not a Machine.* Cite the Gibbs Lecture. If the mind can see the truth of its own Gödel sentence, it's not a finite formal system. A computer emulation *is* a finite formal system. Therefore, the emulation lacks the defining characteristic of the human mind.
      *   *Premise 2: Materialism is False.* Uploading relies on the brain generating the mind. Gödel believes the mind perceives concepts independently of the brain. Fixing the brain fixes the instrument, not the player.
