answer: |-
  David Lewis's triviality result (1976) and Allan Gibbard's theorem (1981), often illustrated by the "Sly Pete" case, are the twin pillars of modern skepticism regarding the truth-conditional semantics of indicative conditionals. Both arguments aim to show that indicative conditionals cannot be treated as standard propositions expressing robust, non-material truth conditions. However, they attack this view from different angles: Lewis targets the *probabilistic* behavior of conditionals, while Gibbard targets their *logical* behavior.

  This essay will argue that while Lewis's result demonstrates an incompatibility between the Equation and standard probability theory, Gibbard's result demonstrates an incompatibility between Import-Export and non-material truth conditions. Consequently, a theorist can coherently resist one while accepting the other (as Robert Stalnaker did with Lewis). Ultimately, however, Gibbard's result poses the more serious obstacle to truth-conditionalism. While Lewis leaves open the possibility of a truth-conditional semantics that sacrifices the Equation, Gibbard suggests that any truth-conditional semantics validating the intuitive logic of conditionals (specifically Import-Export) collapses into the inadequate material conditional.

  ### Lewis's Triviality Result: The Probabilistic Obstacle

  Lewis's 1976 argument targets the conjunction of two theses: (1) that indicative conditionals express propositions (i.e., they have truth conditions and can be assigned probabilities), and (2) "The Equation," which states that the probability of a conditional equals the conditional probability of its consequent given its antecedent ($P(A \to B) = P(B|A)$).

  Lewis proved that for any probability function closed under conditionalization, if The Equation holds for all $A$ and $B$ (where $P(A) > 0$), the probability space must be "trivial." That is, the function can distinguish at most four distinct propositions. Since our actual belief systems distinguish far more possibilities than this, Lewis concluded that The Equation and truth-conditionalism are incompatible.

  **Conception Targeted:** Lewis targets semantic theories that attempt to reconcile the intuitive plausibility of The Equation with a possible-worlds semantics (like early versions of Stalnaker's theory). The result forces a dilemma: either abandon the idea that conditionals are propositions (adopting a non-cognitivist or suppositional view, as Adams did) or abandon The Equation.

  ### Gibbard's Result: The Logical Obstacle

  Working independently, Gibbard argued that if indicative conditionals express propositions and satisfy certain logical principles, they must be equivalent to the material conditional ($A \supset B$, defined as $\neg A \lor B$). The core of Gibbard's argument relies on the principle of **Import-Export**:
  $$(A \to (B \to C)) \equiv ((A \land B) \to C)$$
  Gibbard showed that any truth-functional connective satisfying Import-Export, along with minimal logical constraints (like Modus Ponens and the deduction theorem), collapses into the material conditional.

  The "Sly Pete" case serves as an intuition pump for this result. In the scenario, two informants with different information assert conflicting conditionals about the outcome of a rigged poker game (e.g., "If Pete calls, he wins" vs. "If Pete calls, he loses"). If conditionals express objective propositions, one informant must be wrong. But both seem justified given their information. Gibbard uses this to motivate the idea that conditionals are sensitive to information states. However, if one insists they express standard propositions independent of information states, the logical machinery (Import-Export) forces them to be material conditionals.

  **Conception Targeted:** Gibbard targets truth-conditional theories that validate Import-Export. Unlike Lewis, Gibbard does not rely on probability axioms. He targets the *logical form* of the conditional. The result implies that if you want conditionals to be propositions, you must accept they are material conditionals—a view widely rejected because the material conditional validates paradoxes (e.g., a false antecedent makes the conditional true) that indicative conditionals do not exhibit.

  ### Can One Accept One Moral While Resisting the Other?

  The two results do not stand or fall together; they are logically distinct obstacles that can be navigated independently. A theorist can coherently accept the moral of Lewis's argument while resisting Gibbard's, or vice versa, though doing so requires specific theoretical costs.

  **Resisting Lewis, Accepting Gibbard:** This is difficult. If one accepts Gibbard's conclusion that conditionals are material, one must reject The Equation (since $P(A \supset B) \neq P(B|A)$ in general). Thus, accepting Gibbard's collapse essentially forces one to accept Lewis's dilemma (that The Equation must go).

  **Resisting Gibbard, Accepting Lewis:** This is the path taken by Robert Stalnaker. Stalnaker accepted Lewis's triviality result and conceded that The Equation cannot hold universally for a truth-conditional semantics. He maintained that conditionals *are* propositions (selecting the closest possible world where $A$ is true) but denied that their probability always matches the conditional probability. By sacrificing The Equation, Stalnaker avoided Lewis's triviality. However, Stalnaker's semantics also validates Import-Export. Does this mean Stalnaker falls to Gibbard? Not necessarily. Gibbard's proof assumes the conditional is a truth-functional connective within a classical logic framework. Stalnaker's semantics is not truth-functional in the standard sense (the truth of $A \to B$ depends on a similarity ordering, not just the truth values of $A$ and $B$). Thus, a theorist can resist Gibbard by adopting a non-truth-functional possible-worlds semantics, even while accepting Lewis's proof that such a semantics cannot satisfy The Equation.

  Therefore, the arguments are independent. Lewis attacks the *probabilistic coherence* of truth-conditionalism; Gibbard attacks the *logical coherence* of truth-functionalism (and by extension, many truth-conditional accounts).

  ### Which Result Poses the More Serious Obstacle?

  While Lewis's result is mathematically rigorous, **Gibbard's result poses the more serious obstacle** to any theory on which indicative conditionals express robust, non-material propositions.

  The primary reason is the **defeasibility of the premises**. To escape Lewis's triviality, a truth-conditionalist need only reject The Equation. This is a significant cost, as The Equation is highly intuitive (it matches our betting behavior and degree of belief). However, it is a cost many are willing to pay. Stalnaker's semantics, for instance, remains a viable, robust truth-conditional theory precisely because it absorbs the blow of Lewis's result by denying The Equation in cases where the antecedent is probabilistically independent of the conditional. Lewis shows that conditionals cannot be *both* propositions *and* satisfy The Equation; he does not prove they cannot be propositions *simpliciter*.

  Gibbard's result, however, is more constraining. It suggests that if conditionals are propositions and satisfy Import-Export, they *must* be material. The material conditional is widely regarded as an untenable semantics for indicatives because it fails to capture the connection between antecedent and consequent (the "Ramsey Test" intuition) and validates counterintuitive inferences. To avoid Gibbard's collapse while maintaining truth-conditionalism, one must reject Import-Export. But Import-Export is arguably more central to the logic of natural language conditionals than The Equation is to their probability. It underpins our reasoning with nested conditionals and is validated by almost all plausible semantic accounts (including Stalnaker's).

  Furthermore, Gibbard's argument highlights a deeper issue regarding **information sensitivity**. The "Sly Pete" case demonstrates that the acceptability of a conditional depends on the speaker's information state. If conditionals express robust, objective propositions, their truth should not vary with the speaker's information (unless the proposition itself contains an indexical). Gibbard forces the truth-conditionalist to either accept that conditionals are indexical/context-dependent (which complicates the logic of communication) or accept the material collapse. Lewis's result, by contrast, is silent on context and information; it is purely a structural constraint on probability spaces.

  In summary, Lewis proves that truth-conditionalism is incompatible with a specific probabilistic thesis (The Equation). Gibbard proves that truth-conditionalism is incompatible with a specific logical thesis (Import-Export) unless it collapses into a semantics (Material) that is independently implausible. Since it is easier to modify probabilistic assumptions than to abandon core logical principles like Import-Export without rendering the conditional useless for reasoning, Gibbard's result cuts off more escape routes for the robust propositionalist. Lewis leaves the door open for a logic of propositions; Gibbard suggests that if you walk through that door, you end up in the wrong room.

  ### Conclusion

  Lewis and Gibbard jointly dismantled the naive view that indicative conditionals are standard propositions that behave like logical connectives. Lewis showed they cannot obey the laws of probability if they are propositions; Gibbard showed they cannot obey the laws of logic (Import-Export) if they are non-material propositions. While a theorist can navigate Lewis's result by sacrificing the Equation, Gibbard's result remains a more formidable barrier. It forces a choice between the propositionality of conditionals and the validity of their most characteristic logical principle. For those seeking a robust, non-material semantics, Gibbard's demonstration that such a semantics implies logical collapse is the more profound challenge, pushing contemporary philosophy decisively toward suppositionalism, relativism, or dynamic semantics.
