answer: |-
  This is a profound philosophical objection. Your friend has identified what is often called the **"problem of closeness"** or the **"redescription objection."** It is the claim that because any action can be described under multiple aspects (e.g., "killing civilians" vs. "ending the war"), the distinction between intending and foreseeing is merely a matter of linguistic framing rather than a difference in moral reality. If the distinction is manipulable, the Doctrine of Double Effect (DDE) loses its normative force.

  To defend Anscombe without begging the question, we cannot rely on Truman's internal mental states (which are inaccessible) or his public rhetoric (which is self-serving). We must anchor the distinction in the **objective structure of the action plan.**

  Here is the strongest argument for why the intending/foreseeing distinction is principled in this case, based on the **Causal Role Criterion.**

  ### 1. The Criterion: Causal Role and Counterfactual Frustration

  To prevent the distinction from being infinitely manipulable, we need a test that relies on the *logic of the plan* rather than the *agent's avowals.*

  **The Causal Role Criterion:**
  An harmful effect is **intended as a means** if its occurrence plays a necessary causal role in the mechanism by which the agent achieves their end.
  An harmful effect is **merely foreseen** if it is a byproduct of the mechanism, but plays no causal role in achieving the end.

  **The Counterfactual Frustration Test:**
  To operationalize this, ask: *If the harmful effect did not occur, would the agent's plan have been frustrated or rendered inefficient?*
  *   **If Yes:** The harm was intended as a means. (The agent needs the harm to happen to succeed.)
  *   **If No:** The harm was foreseen as a side effect. (The agent would have preferred the harm not happen, and their success would have been unimpeded or even enhanced.)

  This criterion is non-question-begging because it does not ask "Did the agent feel bad?" or "What did the agent say?" It asks: "How does the physics and psychology of this plan actually work?"

  ### 2. Application to Truman and the Atomic Bombings

  Let us apply the Causal Role Criterion to the decision to bomb Hiroshima and Nagasaki, specifically under the description Anscombe attacks: the use of area bombing to induce surrender.

  **The End:** The unconditional surrender of the Japanese government.
  **The Mechanism:** Breaking the political will of the Japanese leadership to continue the war.

  **The Causal Chain:**
  How does dropping an atomic bomb break the political will of the leadership? It is not simply the loss of material resources (one bomb does not destroy the whole army). It is the **shock** of the devastation. The shock is generated by the visible, horrific destruction of a city and the mass incineration of its inhabitants.

  **Applying the Counterfactual Frustration Test:**
  Imagine a counterfactual scenario: The United States drops the "Little Boy" device on Hiroshima. Due to a miracle, a force field protects every human being in the city. The buildings are flattened, the infrastructure is gone, but **no civilians die.**
  *   **Question:** Would the U.S. planners have considered the mission a success in terms of inducing surrender?
  *   **Analysis:** Likely not. The strategic logic of "shock and awe" relies on the *human cost* to communicate the futility of resistance to the enemy leadership. The terror is *in* the killing. If the Japanese leadership believed the U.S. could destroy cities without killing people, the deterrent effect would be significantly diminished. The plan to "terrorize into surrender" relies on the premise that the U.S. *will* kill civilians.
  *   **Result:** The plan is frustrated (or at least significantly degraded) if the civilians do not die. Therefore, the deaths are not merely concomitant; they are part of the causal mechanism.

  **Conclusion:** Under the Causal Role Criterion, the civilian deaths are **intended means.** They are the instrument by which the "will to fight" is broken. To redescribe this as "destroying capacity with deaths as a side effect" is to ignore the specific causal pathway chosen. If the aim were purely "capacity," conventional precision bombing of rail lines and factories (which was already happening) would have been the consistent strategy. The shift to area atomic bombing indicates a shift in the *mechanism* of victory: from attrition to psychological shock via mass death.

  ### 3. Application to a Contrasting Case: The Munitions Factory

  To show this criterion is not gerrymandered to condemn Truman, we must apply it to a case Anscombe (and most DDE proponents) would consider permissible.

  **The Case:** During WWII, the Allies bomb a munitions factory located on the edge of a city. The bomb is aimed precisely at the factory. However, due to the blast radius, a nearby school is destroyed, and children are killed.

  **The End:** Halting the production of munitions.
  **The Mechanism:** Physical destruction of the machinery and building.

  **Applying the Counterfactual Frustration Test:**
  Imagine a counterfactual scenario: The Allies bomb the factory. The machinery is destroyed. Production stops. However, due to a miracle, **the children in the nearby school are not killed** (perhaps they were evacuated, or the blast wave curved around them).
  *   **Question:** Would the military planners have been frustrated? Would they say, "Oh no, the children didn't die, so we failed to stop production"?
  *   **Analysis:** No. The planners would be delighted. The goal (stopping production) is achieved *more cleanly* if the children survive. The deaths of the children contribute *nothing* to the stopping of the munitions. The causal chain runs from Bomb -> Factory Destroyed -> Production Stopped. The Children Dying is a separate branch: Bomb -> Blast Radius -> Children Dying.
  *   **Result:** The plan is *not* frustrated if the harm does not occur. The harm is causally inert regarding the goal.

  **Conclusion:** Under the Causal Role Criterion, the civilian deaths here are **merely foreseen.**

  ### 4. Addressing the Redescription Objection

  Your friend argues that Truman could simply say: *"My aim was to destroy Japan's capacity. The deaths were just a side effect of destroying the capacity."*

  The Causal Role Criterion explains why this redescription is **illegitimate special pleading.**

  In the Munitions Factory case, the redescription matches the physical reality: destroying the factory *is* what stops the munitions. The deaths are truly external to the goal.

  In the Hiroshima case, the redescription contradicts the strategic reality. "Destroying capacity" (in the sense of material resources) was already being attempted via conventional bombing and blockade. The atomic bomb was selected specifically for its **qualitative difference**: its ability to destroy a city in one strike and create a psychological impact disproportionate to its material target area.
  *   If the aim were truly just "material capacity," the planners would have prioritized rail yards and oil refineries (which they did target later).
  *   By choosing a city center as the target, they made the *civilian presence* a necessary component of the target definition. You cannot destroy a "city center target" without destroying the civilians in it; the civilians are part of the "material" being targeted to generate the "shock."

  Therefore, the redescription fails because it does not align with the **causal architecture of the chosen plan.** You cannot redescribe a means as a side effect if the plan physically requires the means to function.

  ### 5. A Candid Assessment of the Distinction's Weight

  Is this distinction empty? **No.** As shown above, it tracks a real difference in the causal structure of actions (Means vs. Byproduct).

  However, is it as easy to apply as Anscombe implies? **Also No.**

  Your friend is right to be suspicious, because agents *do* often manipulate this distinction. In modern warfare, "breaking the will of the enemy" is often cited to justify bombing that kills civilians. The line between "destroying military capacity" (legitimate) and "terrorizing the population" (illegitimate) can be thin.

  The defense of Anscombe rests on the specific nature of the atomic bombings in 1945. Unlike a drone strike on a known combatant where civilian death is a tragic risk, the atomic bombs were **area weapons** deployed against **urban centers**. The "collateral damage" was not a risk; it was the bulk of the payload's effect.

  **The Verdict:**
  The distinction is not empty, but it is not a magic wand. It requires rigorous analysis of the **causal mechanism** of the action.
  *   If the harm is the **engine** of the success (Hiroshima: terror requires death), it is intended.
  *   If the harm is the **exhaust** of the engine (Munitions: production halt requires explosion, death is just smoke), it is foreseen.

  Anscombe is correct that Truman falls on the "intending" side of this line, not because she is morally outraged, but because the strategic logic of the atomic bombing relied on the mass death of civilians to function as a psychological weapon. Your friend is correct that this distinction is often abused, but that abuse does not prove the distinction itself is nonexistent; it only proves that agents are often dishonest about the causal structure of their own plans.

  If you accept that actions have objective causal structures independent of how agents describe them, the intending/foreseeing distinction holds. If you believe that "intention" is *only* a matter of internal narrative with no anchor in the physical plan, then your friend is right, and the distinction is empty. Most non-consequentialist ethics, however, requires the former view to function at all.
