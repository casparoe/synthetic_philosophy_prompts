answer: |-
  **MEMORANDUM**

  **TO:** Vehicle Type-Approval Technical Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Certification Case [ID-REDUCTED] – Engine Control Strategy and Compliance Definition

  **1. Classification and Determination**

  I recommend the panel classify the subject vehicle as **non-compliant** and move to void the existing type-approval certification.

  My reasoning rests on the function of a certification test. A test is not a performance art piece where the object is required to succeed only under a specific script; it is a measurement protocol intended to reveal a stable disposition of the vehicle—specifically, its disposition to emit pollutants during normal operation.

  In the metaphysics of science, we distinguish between an object's intrinsic properties and the conditions under which they manifest. The current regulation assumes the vehicle possesses a stable emission disposition that the test reveals. In this case, the engine control unit (ECU) does not merely mask the emission (like an antidote neutralizing a poison while the poison remains present); it structurally alters the engine's operating map *in response to the stimulus of the test itself*.

  This is a classic "finkish" disposition. Just as Martin's "electro-fink" makes a dead wire live only when touched, this software makes a high-emitting engine low-emitting only when tested. The vehicle presented to the regulator during the cycle is not the same vehicle, functionally, as the one sold to the public. Therefore, the test did not measure the vehicle's compliance; it measured the compliance of a temporary software configuration that ceases to exist outside the laboratory. To certify this is to certify a phantom.

  **2. Engagement with the Regress Objection**

  The industry representative's objection is serious and must not be dismissed as bad faith. The argument is that if we rule against the manufacturer on the grounds that they "detected the test," we establish a standard that requires tests to be undetectable. This invites an infinite regress: manufacturers will build better detectors, regulators will build better stealth tests, and compliance becomes an arms race rather than a standard. If we void certification based on rules not explicitly written, we are engaged in retroactive rule-making.

  This regress worry is valid *if* we remain within the paradigm of a fixed, deterministic test cycle. If compliance is defined by performance on *Trace A*, and we add the rule "you must not detect Trace A," the manufacturer is incentivized to detect *the detection of Trace A*.

  However, the regress fails if we change the definition of the stimulus from a **specific script** to a **statistical envelope**.

  The industry argument assumes the "stimulus" for the disposition is the certification cycle. I argue the stimulus is *normal operation*. The certification cycle is merely a sample. A finkish device can cheat a sample; it cannot cheat a population without ceasing to function as a vehicle. If the regulation requires the vehicle to maintain compliance across a broad, stochastic range of speeds, loads, and ambient conditions (a "Real Driving" envelope), the ECU cannot switch maps without risking non-compliance within that same envelope.

  The regress stops when the test becomes indistinguishable from normal use. You cannot "detect" normal use without disabling the vehicle's utility. Therefore, the solution is not to demand undetectable testing, but to demand representative testing. The industry representative is correct that we cannot police every cheat code; we must instead police the *domain* of compliance.

  **3. Proposed Redrafting of "Compliance"**

  To resolve this case and prevent recurrence without inviting the regress described above, I propose the following redrafting of the compliance definition, to be adopted by this authority:

  **Current Definition:**
  > "A vehicle is compliant if it emits no more than X g/km of NOx when operated over the Standard Certification Cycle (SCC) at ambient temperature Y."

  **Proposed New Definition:**
  > "A vehicle is compliant if it emits no more than X g/km of NOx across a statistically representative Operating Envelope (OE). The OE shall be defined by a probability distribution of speed, acceleration, and load derived from aggregate fleet data. Compliance is demonstrated via a combination of laboratory sampling and Portable Emissions Measurement Systems (PEMS) on random routes, where the specific route profile is not disclosed prior to testing."

  **Implementation Timeline:**

  *   **Phase 1 (Immediate):** Void current certification for the subject case based on the finding that the ECU strategy invalidates the measurement integrity of the SCC. This is not retroactive rule-making; it is the enforcement of the implied covenant of measurement integrity inherent in the current regulation.
  *   **Phase 2 (12 Months):** Industry consultation to finalize the statistical parameters of the Operating Envelope. Manufacturers submit calibration strategies intended to cover the OE rather than the SCC.
  *   **Phase 3 (24 Months):** Full enforcement of the OE definition. All new type-approvals must demonstrate compliance via PEMS data covering the stochastic envelope.

  **4. Conclusion**

  The distinction between "fink" and "mask" matters here. If this were a mask (e.g., a chemical additive injected only during the test), the engine's fundamental map would remain dirty, but the output is scrubbed. That is a mitigation failure. But this is a fink: the engine's fundamental strategy changes. It pretends to be a different engine.

  We cannot regulate every possible lie. But we can refuse to accept a definition of truth that only holds when the witness is reading from a script provided by the accused. I vote to void the certification and adopt the Operating Envelope standard.
