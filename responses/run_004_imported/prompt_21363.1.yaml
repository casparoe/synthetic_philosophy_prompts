  **Move 1 (Marcus):** Score 1. Marcus correctly identifies the underlying coordination problem and the role of mutual expectation, but he overlooks that Lewisian conventions are typically self-policing through practical costs rather than the active social enforcement (honking) observed here.

  **Move 2 (Renata):** Score 2. Renata accurately points out that mere common knowledge of a Pareto-superior equilibrium should theoretically facilitate a shift in a bare convention, making the resistance and moralized hostility significant evidence of something more robust.

  **Move 3 (Marcus):** Score 0. While Marcus is technically correct that Lewisian equilibria can be suboptimal, he conflates personal inconvenience with the impartial indignation of unaffected third parties, which Lewis's framework does not account for as a maintenance mechanism.

  **Move 4 (Renata):** Score 2. Renata correctly identifies third-party punishment as the distinguishing signature of a social norm rather than a bare convention, as Lewisian agents only care about their own coordination payoffs, not the rule compliance of others who do not affect them.

  **Adjudication:**

  The early-merge etiquette is best treated as a case where a Lewisian convention has hardened into a moralized social norm, demonstrating that the distinction cannot be drawn as cleanly in practice as Renata and Marcus assume in theory. While the behavior originated as a coordination equilibrium (supporting Marcus), the accumulation of third-party enforcement indicates that compliance is now driven by normative expectations rather than merely predictive ones (supporting Renata). For a linguist interested in common ground, this implies that the shared background assumptions include not just *what* drivers will do, but *what they ought to do*. Consequently, public information campaigns are destined to fail because they treat the issue as a deficit in common knowledge regarding efficiency, whereas shifting the behavior requires altering the normative common ground—effectively changing what counts as a violation worthy of sanction—rather than just updating beliefs about traffic flow.
