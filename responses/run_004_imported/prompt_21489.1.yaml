      *   **Key Distinction:** Lewis = All possible worlds are concrete and equally real; "actual" is indexical. Leibniz = Only one world exists (concrete); others are ideas in God's mind; God chose the "best."
      *   **The Question:** If Lewis explained his view to Leibniz, how would Leibniz respond? Specifically, does Leibniz's "Best of All Possible Worlds" theodicy survive if Lewis's ontology is true (i.e., if all worlds actually exist)?

