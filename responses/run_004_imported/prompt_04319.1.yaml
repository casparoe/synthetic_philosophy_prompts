  **Justifications**

  *   **Move 1 (Owen): Score 2.** Owen is correct on the pragmatic and social level of "moral credit." In ordinary moral accounting, actions are judged by what was done and the temptation overcome. Returning $1,000 is an objective good that benefits the victim and society. His point that mixed motives are universal is psychologically sound; demanding pure altruism renders moral praise impossible for almost any human action.
  *   **Move 2 (Maya): Score 0.** Maya raises a valid philosophical distinction (Kantian moral worth vs. pragmatic rightness), but she applies it too rigidly. She infers causation ("what explains the act") from mere correlation (the presence of a self-interested thought). The narrator described the thought as a "dim awareness," not a deciding factor. By treating a *possible* contaminant as a *definitive* disqualifier without proof of necessity, she sets a standard that is theoretically interesting but practically unusable.
  *   **Move 3 (Owen): Score 2.** This is the strongest rebuttal in the exchange. Owen correctly identifies that Maya's test requires a counterfactual ("would you have done it without...?") that is impossible to verify. Moral psychology confirms that motives are almost always plural and tangled. If moral credit required the surgical removal of all self-interest, praise would cease to exist, which undermines the social function of reinforcing good behavior.
  *   **Move 4 (Maya): Score 1.** Maya recovers ground by shifting from an impossible "purity test" to a "salience test." She correctly notes that what we choose to highlight in a story reveals what we value or what felt significant to us. However, while this is evidence of *what was on the narrator's mind*, it does not definitively prove that self-interest did the "real work" over honesty. It warrants skepticism, but not a dismissal of credit, making her claim reasonable but not conclusive.

  **What Both Are Missing**

  1.  **The Virtue of Transparency:** Both friends treat the narrator's admission of the "dim awareness" as either irrelevant (Owen) or incriminating (Maya). They miss that *admitting* the mixed motive is itself a virtuous act. Honesty about one's own moral limitations demonstrates self-awareness and a lack of self-deception, which arguably adds to the narrator's credibility and moral standing rather than subtracting from it.
  2.  **Moral Scaffolding:** Neither considers that self-interest can be a legitimate tool for building character. If thinking about professional reputation helps someone act honestly today, it reinforces the habit of honesty for tomorrow. Virtue ethics suggests that acting rightly *until* the motive becomes pure is a valid path to moral development.
  3.  **The Function of Praise:** Owen focuses on the past (did you earn this?), and Maya focuses on the metaphysics (is your soul pure?). Both miss the forward-looking function of credit: praising the act reinforces the behavior regardless of the internal motive mix. Denying credit because of mixed motives risks discouraging the behavior in the future.
