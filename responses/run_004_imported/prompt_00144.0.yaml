          *   *Intuition:* A lost leverage (max potential). Nash ignores this leverage loss. KS respects it. This is the key.

  7.  **Final Polish:** Check against the user's specific constraints (no formal training, wants gut-level feel). Ensure the distinction between "utility gains" (Nash) and "proportion of ideal" (KS) is highlighted. (Proceed to generate output based on this structure).

  8.  *(Post-Drafting Thought)*: Make sure to mention that Nash assumes utility functions are unique up to affine transformation, and KS respects that too, but treats the *scale* of the ideal point as meaningful relative to the other player. Actually, both are invariant to affine transformations. The difference is purely in how they map the *set* to the *point*. Stick to the geometry/intuition.

  9.  *(Final Check on Monotonicity)*: Ensure I define Monotonicity correctly in this context. It's "Individual Monotonicity." If the set expands in a way that increases Player 1's maximum possible utility (without changing Player 2's max), Player 1 should not receive less utility in the solution. This is the direct counter to IIA.

