prompt: |-
  At my company we use ranked-choice voting for stuff like picking next quarter's roadmap feature or the offsite location - everyone ranks the options, then we run instant-runoff (eliminate the lowest vote-getter, redistribute their ballots, repeat). Last round a teammate admitted afterward that he'd ranked his actual second choice as #1, since he knew his real favorite had zero shot and wanted to make sure it beat the other frontrunner - and it worked, flipping the outcome for the rest of us.

  Now someone wants to switch to Borda count (points based on where you rank each option) since it uses more info and seems "fairer," but my gut says that just moves the gaming somewhere else instead of fixing it. I vaguely remember some theorem from a college stats elective - Arrow's maybe? - about no voting system being "perfect," but I thought that was about weird paradoxes in how you combine everyone's rankings, not people being able to flat out lie about their preferences to get a better result. Is that the same theorem or a different issue? Bottom line: is there an actual ranking method thats immune to this kind of dishonest voting, or are we just picking our poison no matter what we switch to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Company uses Ranked-Choice Voting (RCV/Instant Runoff Voting - IRV) for decisions (roadmap, offsites).
      *   **Problem:** A teammate admitted to strategic voting (burying a true favorite to boost a viable second choice), which successfully changed the outcome.
      *   **Proposal:** Someone suggests switching to Borda Count (points for ranking) to use "more info" and be "fairer."
      *   **User's Intuition:** Suspects Borda just moves the gaming, doesn't fix it.
      *   **Theoretical Question:** Remembers Arrow's Theorem but is confused about whether it applies to strategic voting (lying) or just aggregation paradoxes.
      *   **Core Question:** Is there a ranking method immune to dishonest voting, or are we just picking our poison?

  2.  **Deconstruct the Theoretical Concepts:**
      *   **Arrow's Impossibility Theorem:** What does it actually say? It states that no ranked voting system can satisfy a specific set of fairness criteria (Unrestricted Domain, Non-dictatorship, Pareto Efficiency, Independence of Irrelevant Alternatives) simultaneously. It's about *systemic properties*, not specifically about *strategic voting* (though IIA is related).
      *   **Gibbard-Satterthwaite Theorem:** This is the one the user is actually looking for. It specifically addresses *strategy-proofness*. It states that for any voting system with 3 or more outcomes, if it's not a dictatorship, it is susceptible to tactical voting.
      *   **IRV (Instant Runoff):** Susceptible to "compromising" (voting for a less preferred candidate to stop a worse one) and "burying" (ranking a strong opponent low). The user's anecdote is a classic example of compromising.
      *   **Borda Count:** Highly susceptible to "burial" or "exaggeration." If I know my favorite can't win, I rank the strongest competitor last to hurt them, even if I actually like them okay. It encourages insincere rankings to maximize point differentials.
      *   **Condorcet Methods:** Often better at finding the "beats-all" winner, but still susceptible to strategy (though sometimes less obvious).
      *   **Approval/Score Voting:** Not ranked, but cardinal. Still susceptible to strategy (max/min scoring), but often more intuitive.

  3.  **Address the Specific Questions:**
      *   *Is it Arrow's Theorem?* No, it's Gibbard-Satterthwaite. Need to clarify the distinction gently.
      *   *Is Borda better?* No, it's arguably *more* vulnerable to strategic exaggeration than IRV.
      *   *Is there an immune method?* No (per Gibbard-Satterthwaite), unless you restrict the number of options to 2 or allow a dictator.
      *   *Bottom Line:* Yes, you are picking your poison, but some poisons are less toxic depending on the culture.

  4.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Start by validating the user's gut instinct. They are right. Borda is not a magic fix.
      *   *The Theorem:* Correct the Arrow vs. Gibbard-Satterthwaite confusion. Arrow = Fairness criteria impossibility. Gibbard-Satterthwaite = Strategic voting impossibility. This is a key educational moment.
      *   *Analyze IRV vs. Borda:*
          *   IRV (current): Vulnerable to "compromising" (what happened in the story).
          *   Borda (proposed): Vulnerable to "bullet voting" or "max/mining." If I give my favorite 1st and my rival 5th, I hurt the rival more than if I honestly ranked them 2nd. It incentivizes extreme rankings.
      *   *The "Immune" Question:* Deliver the hard truth. No ranked system with 3+ options is strategy-proof.
      *   *Practical Advice:* Since theory says "no perfect system," what should a company do?
          *   Culture > Math. In a cooperative setting, social pressure matters more than the algorithm.
          *   Simplicity. Complex systems invite gaming because people don't understand them.
          *   Alternative: Score/Approval voting (cardinal vs. ordinal). Still has strategy, but often feels more honest.
          *   Alternative: Random selection (sortition) for tie-breakers or low-stakes.
          *   Alternative: Discussion/Consensus (voting as a signal, not a decree).

  5.  **Refining the Tone:**
      *   Keep it professional but accessible.
      *   Avoid overly dense jargon where possible, or explain it immediately.
      *   Acknowledge the workplace context (this isn't a national election, relationships matter).

  6.  **Self-Correction/Nuance Check:**
      *   *Did I explain Gibbard-Satterthwaite clearly?* Make sure to mention the "3+ options" constraint.
      *   *Is Borda definitely worse?* In terms of strategy, yes, usually. It rewards ranking enemies last even if you don't hate them.
      *   *Is there any exception?* If preferences are "single-peaked," some systems work better, but that's too technical for this context. Stick to the main theorems.
      *   *What about Quadratic Voting?* Too complex for a company offsite.
      *   *What about just discussing?* Often the best for small groups.

  7.  **Final Polish:** Structure with clear headings. Ensure the distinction between Arrow and Gibbard-Satterthwaite is highlighted. End with actionable advice. (This matches the structure of the final output).

  8.  *(Final thought before generating)*: Make sure to emphasize that in a *company* context, the goal isn't mathematical purity, it's team cohesion. Gaming the vote damages trust more than the suboptimal feature choice.

  9.  **Generate Output.** (Proceed to write the response based on these points.)
answer: |-
  Your gut instinct is spot on: **Switching to Borda count will not fix the strategic voting problem; it will likely make it worse.**

  You are also right to be skeptical about finding a "perfect" system. However, the theorem you are remembering isn't quite the right one for this specific issue. Here is the breakdown of the math, the reality of your options, and what you should actually do in a workplace setting.

  ### 1. The Theorem: Arrow vs. Gibbard-Satterthwaite

  You recalled **Arrow's Impossibility Theorem**, but that's actually about *fairness criteria*, not lying. Arrow proved that no ranked voting system can satisfy a specific set of logical fairness conditions (like "if everyone prefers A over B, the group should prefer A over B") simultaneously. It explains why voting systems can produce paradoxical results, but it doesn't explicitly prove people will lie.

  The theorem that applies to your situation is the **Gibbard-Satterthwaite Theorem**.

  **The harsh truth of Gibbard-Satterthwaite:**
  For any voting system with **three or more possible outcomes**, if the system is not a dictatorship (one person decides) and it allows every possible ranking of candidates, **it is impossible for the system to be strategy-proof.**

  In plain English: **There is no ranked voting method that is immune to tactical voting.** If you have 3+ options, there will always be scenarios where a voter gets a better result by lying about their preferences than by telling the truth.

  ### 2. IRV vs. Borda: Picking Your Poison

  Since we know we can't eliminate gaming, we have to choose which *kind* of gaming we prefer.

  **Your Current System: Instant Runoff (IRV)**
  *   **The Vulnerability:** "Compromising." This is exactly what your teammate did. They feared their favorite would be eliminated early, so they ranked a viable second choice first to ensure their vote counted in the final round.
  *   **The Effect:** It hurts fringe candidates and helps "centrist" candidates who are everyone's second choice.
  *   **Complexity:** It's relatively hard to calculate by hand, which can obscure *how* the gaming worked (as you saw, the teammate admitted it afterward).

  **The Proposed System: Borda Count**
  *   **How it works:** If there are 5 options, 1st place gets 5 points, 2nd gets 4, etc.
  *   **The Vulnerability:** "Exaggeration" or "Burial."
  *   **Why it's worse for strategy:** In Borda, the *gap* between rankings matters. If I honestly like Option A (5 pts) and Option B (4 pts), but I know Option B is the main rival to my favorite, I have a massive mathematical incentive to rank Option B **last** (1 pt) instead of second.
  *   **The Result:** Borda encourages voters to treat the ballot like a weapon. You give your favorite maximum points and your strongest competitor minimum points, regardless of your actual feelings. It turns every voter into a partisan strategist.

  **Verdict:** Borda is generally considered **more susceptible to tactical voting** than IRV because it rewards extreme rankings over honest ones.

  ### 3. Is There *Any* Method That Works Better?

  Since Gibbard-Satterthwaite says "no" for ranked systems, you have to look outside of ranked voting to reduce the incentive to lie.

  **A. Score Voting (Range Voting)**
  Instead of ranking (1st, 2nd, 3rd), everyone gives each option a score (e.g., 0 to 5 stars).
  *   **Pros:** It captures intensity of preference (I *love* Option A, I'm *indifferent* to Option B).
  *   **Strategy:** People still have an incentive to "max-min" (give favorites 5, rivals 0).
  *   **Why consider it:** It is often psychologically easier to be honest. It feels less like "killing" a candidate by ranking them last and more like expressing enthusiasm. It is generally more robust than Borda.

  **B. Approval Voting**
  You vote for as many options as you "approve" of. The one with the most votes wins.
  *   **Pros:** Extremely simple. Harder to game effectively without hurting yourself.
  *   **Strategy:** The only strategy is where to set your "approval threshold."
  *   **Why consider it:** It encourages consensus. If you want the offsite to be fun, you approve of all the fun locations. It stops the "burying" tactic.

  **C. Random Selection (Sortition)**
  If the options are roughly equivalent, pick one at random.
  *   **Pros:** Impossible to game.
  *   **Cons:** Can feel arbitrary.

  ### 4. The Workplace Context (The Real Solution)

  Math can only take you so far. In a national election, strangers vote once and never meet again. In a company, **you have to work with these people tomorrow.**

  The problem you described isn't just mathematical; it's cultural. A teammate admitting they "gamed the system" suggests they feel the pressure to win outweighs the value of honest feedback.

  **Recommendations:**

  1.  **Don't switch to Borda.** It will incentivize your team to rank their rivals last even if they think they're decent options. It creates more toxicity.
  2.  **Consider Approval Voting.** For roadmap features or offsites, ask: "Which of these are acceptable?" rather than "Rank these." It reduces the incentive to bury options and highlights the consensus choices.
  3.  **Use Voting as a Signal, Not a Decree.** In a healthy team, the vote shouldn't be a black-box algorithm that spits out a winner. It should be a discussion starter.
      *   *Example:* "The vote was close between A and B. A has more passionate supporters (1st place votes), but B is more broadly acceptable (high Borda/Approval score). Let's discuss."
  4.  **Address the Culture.** If someone feels they *must* lie to get a fair outcome, the voting system is the symptom, not the disease. In a small team, honest discussion often beats complex voting. If your teammate thinks their favorite has "zero shot," why? Was it dismissed too early in discussion?

  **Bottom Line:**
  You are correct. There is no strategy-proof ranked voting system (thanks to **Gibbard-Satterthwaite**, not Arrow). Switching to Borda moves the gaming from "compromising" to "exaggeration," which is often more damaging to team dynamics. Stick with IRV or try Approval Voting, but focus more on psychological safety than mathematical purity.
