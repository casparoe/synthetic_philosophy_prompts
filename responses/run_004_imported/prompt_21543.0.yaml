answer: |-
  This is a fantastic rabbit hole to fall down, and honestly, your intuition is much more aligned with the current scientific consensus than your friend's argument. This is a classic debate in comparative cognition, and it touches on some of the biggest questions in psychology and neuroscience.

  Here is a breakdown of what is actually going on with the cleaner wrasse, why the mirror test is controversial, and why your friend's "biological robot" conclusion is scientifically flawed. You can use this to structure your discussion post.

  ### 1. The Mirror Self-Recognition Test (MSR)
  First, let's validate what you both know. The Mirror Test (developed by Gordon Gallup in 1970) involves putting a mark on an animal in a place they can only see in a mirror. If they touch the mark on *their own body* while looking in the mirror, it suggests they understand: *"That reflection is me, not another animal."*

  For a long time, this was considered the "gold standard" for self-awareness. Only great apes, dolphins, elephants, and magpies had consistently passed.

  **The Wrasse Study (2019):**
  When Kohda et al. published the study showing cleaner wrasse passing this test, it caused a massive stir. A fish with a tiny brain (relative to an ape) passing a test that chimps pass? That suggests either:
  1.  Consciousness is more widespread than we thought.
  2.  The test measures something different in fish than it does in apes.

  ### 2. Where Your Friend's Reasoning Goes Wrong
  Your friend is making three specific logical errors that are common in introductory psychology.

  **Error A: The "Binary Switch" Fallacy**
  Your friend treats consciousness like a light switch: you either have it (pass the test) or you don't (fail the test).
  *   **Reality:** Most neuroscientists view consciousness as a **spectrum** (like a dimmer switch). A mouse likely has a different *type* and *depth* of experience than a human, but that doesn't mean the mouse is a "biological robot" with zero inner life. Failing a cognitive test doesn't prove the absence of experience; it often just proves the absence of that specific cognitive skill.

  **Error B: Sensory Bias (The "Human-Centric" Trap)**
  The mirror test is **visual**. It assumes the animal cares about vision more than anything else.
  *   **Reality:** Many animals live in different sensory worlds.
      *   **Dogs:** They often fail the mirror test. But dogs identify themselves and others primarily through **smell**. If you made an "olfactory mirror test" (smelling a modified version of their own scent), dogs might "pass."
      *   **Cats:** They often ignore mirrors because they don't care about visual social cues in the same way primates do.
      *   **Octopuses:** They are highly intelligent but change color/texture. A mirror doesn't help them recognize themselves because they are looking for texture changes, not just visual shape.
  *   **The Takeaway:** Failing a *visual* test doesn't mean an animal lacks consciousness; it might just mean they aren't visual creatures.

  **Error C: False Positives vs. True Understanding**
  Just because an animal passes the test doesn't mean they have "human-like" consciousness.
  *   **The Wrasse Controversy:** Many scientists are skeptical of the wrasse results. Some argue the fish might not think, *"That is me."* Instead, they might think, *"There is a rival fish with a brown spot on its throat. I have a brown spot on my throat. I need to scrape it to look healthy/dominant."* They might be treating the reflection as a competitor they need to match, not as themselves. This is called **contingency checking** rather than true self-concept.

  ### 3. The Document You Remembered: The Cambridge Declaration
  You mentioned remembering a "big declaration." You are thinking of **The Cambridge Declaration on Consciousness (2012)**.

  This is a crucial piece of evidence for your argument. A prominent group of neuroscientists signed this public proclamation stating that:
  > "Convergent evidence indicates that non-human animals have the neuroanatomical substrates of conscious states along with the capacity to exhibit intentional behaviors... **including all mammals and birds, and many other creatures, including octopuses.**"

  **Why this matters for your post:**
  This declaration explicitly rejects your friend's "biological robot" theory. It states that the *neurological hardware* required for experience exists in many animals that would **fail** the mirror test. It acknowledges that consciousness does not require a human-like neocortex (which fish and birds don't have) and that different brains can produce conscious experience in different ways.

  ### 4. How to Frame Your Discussion Post
  Since this is for AP Psych, you want to show you understand the scientific method and critical thinking. Here is a suggested way to structure your thoughts:

  1.  **Acknowledge the Study:** Start by mentioning the Kohda et al. (2019) cleaner wrasse study. It is a legitimate, peer-reviewed study that challenges our understanding of cognition.
  2.  **Critique the Measure (Validity):** Explain that while the mirror test measures *visual self-recognition*, it is not a perfect proxy for *consciousness*. Mention **sensory bias** (e.g., dogs rely on olfaction).
  3.  **Address the "Robot" Claim:** Bring in the **Cambridge Declaration on Consciousness**. Explain that neuroscience suggests consciousness is likely a spectrum based on neural substrates, not a binary trait determined by one behavioral test.
  4.  **Alternative Explanation:** Mention that the wrasse behavior could be interpreted as social competition rather than philosophical self-awareness (parsimony).
  5.  **Conclusion:** Conclude that the wrasse study is exciting because it expands the *possibility* of complex cognition in fish, but it does not prove fish are conscious *exactly* like humans, nor does it prove that animals failing the test are unconscious.

  ### Summary for your understanding
  *   **Is the mirror test the gold standard?** No, not anymore. It's a useful tool, but it has high rates of false negatives (smart animals that fail) and potential false positives (animals that learn the trick without understanding "self").
  *   **Are non-passers robots?** No. Pain perception, emotional responses, and learning exist in animals that fail the mirror test (like rats and chickens).
  *   **Are wrasse conscious?** They likely have *some* form of subjective experience, but equating that directly to human self-awareness is an overreach.

  Your friend is falling for **anthropomorphism** (assuming animals think like us) and **binary thinking**. You are correctly identifying that behavior is complex and tests have limitations. Good luck with the post!
