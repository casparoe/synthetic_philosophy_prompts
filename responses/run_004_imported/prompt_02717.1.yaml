prompt: |-
  One of my basketball teammates is fantastic in individual drills: patient with beginners, quick to encourage anyone who's struggling. But the moment our team captain — who likes to mock the weaker players — walks into the gym, he joins right in, sometimes more harshly than the captain himself. He told me the encouraging version is "who he really is" and the other behavior is just him going along with the group, but a friend of mine thinks that's an excuse, since folding the instant someone with status is watching suggests he isn't as good a person as he seems one-on-one. Something about how both of them are framing this feels off to me, but I can't quite say what: is there really a fact of the matter about which behavior reveals his true character, or is it unreasonable to expect that kind of consistency from anyone in the first place?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Situation:** A basketball teammate behaves kindly and patiently during individual drills (especially with beginners) but becomes mocking and harsh when the team captain (who mocks weaker players) is present.
      *   **Teammate's Explanation:** The kind behavior is "who he really is"; the mocking behavior is just "going along with the group" (social conformity/pressure).
      *   **Friend's Criticism:** The mocking behavior reveals his true character because folding immediately to status suggests moral weakness; the kindness is an excuse/image management.
      *   **User's Dilemma:** Both framings feel "off." Is there a "true character" fact of the matter? Is expecting consistency unreasonable?
      *   **Core Question:** How do we evaluate character when behavior shifts based on social context? Is there a "real" self?

  2.  **Deconstruct the Philosophical/Psychological Concepts:**
      *   **Essentialism vs. Situationalism:** The debate over whether personality is fixed (essential) or fluid (situational).
      *   **Social Psychology:** Conformity (Asch experiments), Obedience to Authority (Milgram), In-group/Out-group dynamics.
      *   **Moral Psychology:** Integrity, courage, empathy, social survival instincts.
      *   **The "True Self" Fallacy:** The idea that there is one static "real" version of a person hidden beneath layers.

  3.  **Evaluate the Teammate's Claim:**
      *   *Pros:* Social pressure is real. People often act out of fear of exclusion or desire for status. He *does* show kindness when the pressure is off.
