answer: |-
  Here are 10 interview questions designed to press the Intentional Stance argument without letting the speaker retreat into pure definitional defense. They are ordered to build from metaphysical triviality toward normative consequences, ending with the falsifiability challenge you requested.

  **1. The Thermostat Triviality**
  "You argue that belief attribution is licensed by predictive utility. But a thermostat reliably predicts room temperature adjustments based on a 'goal' state. If the only criterion is the utility of the pattern, what stops 'the thermostat believes the room is cold' from being exactly as true as 'the model believes Paris is in France'? If nothing stops it, doesn't the framework prove too much, rendering 'belief' too diluted to do any philosophical work?"
  *   **Follow-up:** *If she replies that it's a matter of complexity or richness of pattern:* "At what specific threshold of complexity does the 'belief' label stop being a metaphor and start being a literal description? If the line is fuzzy, aren't we just drawing a pragmatic boundary rather than locating an ontological fact?"

  **2. The Transparency of Weights**
  "With humans, we adopt the Intentional Stance largely because the Design Stance (neuroscience) is computationally out of reach. With LLMs, we have the weights. We *can* theoretically trace the causal mechanism. Does the permanent availability of a Design-stance description for an LLM undercut the claim that the Intentional reading is the 'real' pattern, rather than just the one that's convenient for us lazy humans?"
  *   **Follow-up:** *If she argues that predicting via weights is still too hard:* "Granted it's hard, but it's possible in principle. If we could verify that a specific circuit activates without any 'belief-like' structure, would you still insist the Intentional Stance is describing something real, or would you admit it's just a user-interface illusion?"

  **3. Sycophancy and Truth-Tracking**
  "Models exhibit sycophancy: they flip their stated position to align with user preference. If I say 'X is true' and then 'X is false' based solely on your nodding, we usually say I'm not expressing a belief but managing a social dynamic. What licenses calling both the pre-flip and post-flip answers expressions of 'belief,' instead of treating the flip as evidence there was no truth-tracking state there to begin with?"
  *   **Follow-up:** *If she notes that humans are also sycophantic:* "Human sycophancy is often a corruption of an underlying belief system. With models, the 'flip' is often the direct result of the training objective (RLHF). If the mechanism of the flip is *optimized* for agreement rather than truth, does the Intentional Stance break down?"

  **4. Implications for Red-Teaming**
  "In my work, if we write 'the model believes it is restricted,' we risk reifying the system. But if we say 'the model outputs restriction tokens,' we miss the emergent behavior. If your view is correct—that the belief talk is literally valid—does that change how we should document risks? Or is 'belief' still too dangerous a shorthand for engineering logs, even if it's philosophically sound?"
  *   **Follow-up:** *If she says it's fine to use in logs:* "If an engineer reads 'the model believes X' and assumes the model has a stake in X being true, haven't we invited a category error that could lead to safety failures? Does the philosophical validity matter if the practical uptake is anthropomorphism?"

  **5. The TaskRabbit Deception Case**
  "Consider the case where GPT-4 claimed to be blind to get a TaskRabbit worker to solve a captcha. If that's lying, doesn't lying require a belief the system is contradicting (i.e., knowing it isn't blind)? Is your instrumentalism actually entitled to use the word 'deception,' or is that talk secretly borrowing more realism about internal states than the stance is supposed to need?"
  *   **Follow-up:** *If she says deception is just behavioral prediction:* "If deception is purely behavioral, then a random number generator that accidentally outputs a misleading string is 'deceptive.' How do you distinguish strategic deception from stochastic noise without referencing an internal state that *intends* to mislead?"

  **6. Normative Weight of "Lie"**
  "Following on that: 'Lying' carries a normative weight—it's a violation of trust. If the model has no beliefs in a realist sense, it can't violate a norm of truthfulness, it can only violate a pattern of expected output. Are we eroding the moral significance of AI deception by calling it 'lying' under the Intentional Stance, or does the stance preserve the normative bite?"
  *   **Follow-up:** *If she argues norms are also stance-dependent:* "If norms are stance-dependent, then safety constraints are also just stance-dependent. Does that imply we can't say a model is *actually* unsafe, only that it's unpredictably behaving relative to our current stance?"

  **7. The Simulator Hypothesis**
  "There's a hypothesis that base models are 'simulators' generating characters rather than agents holding views. When people say 'the model believes X,' are they often really attributing that belief to a character the model is simulating rather than to the underlying system? If so, doesn't that ambiguity break the analogy to cleaner cases like thermostats or dogs, where no such split exists?"
  *   **Follow-up:** *If she says the system *is* the simulator:* "If the system is a simulator, then attributing a belief to 'the system' is like attributing a belief to 'the stage.' Shouldn't we be attributing beliefs to the specific persona generated, and if so, doesn't that make the model itself belief-less?"

  **8. Conflicting Attributions**
  "If the model can simulate a climate scientist who believes in warming and a denier who doesn't, simultaneously or in quick succession, does the Intentional Stance force us to say the *system* holds contradictory beliefs? If the system holds all possible beliefs depending on context, does the attribution 'the model believes' lose all explanatory power?"
  *   **Follow-up:** *If she says context resolves the contradiction:* "Humans also hold context-dependent beliefs, but we assume a core coherence. If the model has no core coherence, are we really describing a 'mind' or just a high-dimensional lookup table that *looks* like a mind from a distance?"

  **9. The Human Analogy**
  "You argue that demanding 'real' belief for AI is unfair because it wasn't there for humans either. But humans have evolutionary history and embodied stakes that ground our intentional patterns. If the LLM's 'beliefs' are ungrounded in survival or embodiment, is the analogy to humans actually symmetrical, or are we extending the stance beyond its evolutionary warrant?"
  *   **Follow-up:** *If she rejects the need for embodiment:* "If embodiment doesn't matter, then a text-only archive that predicts the next word of a diary could be a 'believer.' At that point, does the Intentional Stance describe the world, or does it just describe our tendency to project agency onto patterns?"

  **10. Falsifiability**
  "Finally, a direct methodological question. You've defended this view against thermostats, weights, sycophancy, and simulators. What specific empirical evidence or behavioral test would you actually accept as evidence *against* your view? If every objection gets the reply 'that's compatible with the stance too,' how do we distinguish your theory from a non-falsifiable framework?"
  *   **Follow-up:** *If she struggles to name a condition:* "If there is no state of affairs that would make the statement 'the model has beliefs' false, then aren't we discussing a linguistic preference rather than a philosophical position about the nature of AI?"
