answer: |-
  This is a profound question that cuts to the heart of how we do intellectual history and epistemology. You are right to identify the tension: Frege built his career on the claim that *Gedanken* (thoughts/propositions) inhabit a "third realm" independent of the subjective mind, yet the discovery of his diary forces us to confront the subjective mind that claimed to access that realm.

  The discovery you refer to was made in the early 1990s by Gottfried Gabriel and Christian Thiel, who found Frege's political diaries from 1924–1925. They revealed a man who was not merely a conservative but a virulent antisemite, a monarchist who despised the Weimar Republic, and someone who admired Mussolini. Michael Dummett, who was Jewish and had built his career on Frege, was indeed deeply shaken. He wrote about this extensively, particularly in the introduction to his later work and in his essay "Frege and the Nazis."

  Here is a systematic rundown of the conceptual map you are looking for, breaking down the positions on the relationship between authorial character and theoretical validity, and why formal disciplines feel different from normative ones.

  ### 1. The Core Tension: Anti-Psychologism vs. Biographical Reality

  Frege's attack on psychologism (in *Grundlagen* and *Der Gedanke*) argues that logical laws are not laws of *thinking* (how humans happen to reason) but laws of *truth* (objective relations between propositions).

  *   **The Fregean Defense:** If Frege is right about the nature of logic, then his diary is irrelevant to the *Begriffsschrift*. A proof in predicate calculus is valid regardless of whether the prover is a saint or a bigot. The truth of $2+2=4$ is not contaminated by the moral failings of the arithmetician. To claim otherwise is to commit the **Genetic Fallacy** (confusing the origin of a belief with its justification).
  *   **The Counter-Challenge:** The problem isn't whether the *theorems* are true, but whether the *philosophical project* is trustworthy. Frege didn't just do logic; he made claims about *rationality*, *objectivity*, and the *structure of thought*. If his conception of "order" and "purity" in logic was psychologically fueled by a political desire for ethnic/national purity, then his anti-psychologism might be a symptom of his pathology rather than a discovery of reality.

  ### 2. The Conceptual Map: Four Positions on Author/Work

  When evaluating how much an author's character bears on their work, philosophers generally fall into four camps:

  #### A. Strict Autonomism (The Reichenbach Distinction)
  *   **Position:** Hans Reichenbach's distinction between the **Context of Discovery** (psychology, biography, history) and the **Context of Justification** (logic, evidence, proof) is absolute.
  *   **Verdict on Frege:** His politics belong to the context of discovery. They explain *why* he sought rigid order, but they cannot invalidate the *justification* of his logical systems.
  *   **Strength:** Preserves the accumulation of knowledge. We don't have to discard calculus because Newton was an alchemist or occultist.
  *   **Weakness:** Can be naive. It assumes the "justification" is always transparent and separable from the "discovery." In philosophy, the motivations often shape the axioms.

  #### B. Hermeneutic Contextualism
  *   **Position:** You cannot fully *understand* the text without the context. The meaning of a philosophical work is partly constituted by the problems the author was trying to solve, which are often biographical or political.
  *   **Verdict on Frege:** We can still use Frege's logic, but our *interpretation* of his philosophy changes. We might read his obsession with "sharp boundaries" (a key Fregean theme) not just as a logical virtue but as a political anxiety about social decay.
  *   **Strength:** Provides a richer, more honest history.
  *   **Weakness:** Risks reducing ideas to mere symptoms of biography (reductionism).

  #### C. Virtue Epistemology
  *   **Position:** Knowledge is the product of intellectual virtues (open-mindedness, humility, courage). Intellectual vices (dogmatism, hatred, arrogance) corrode the reasoning process itself.
  *   **Verdict on Frege:** Frege's antisemitism wasn't just a private hobby; it was an intellectual vice. It suggests a rigidity of mind that may have blinded him to valid counter-arguments or alternative logical structures (e.g., his stubborn defense of Basic Law V despite Russell's Paradox).
  *   **Strength:** Connects ethics and epistemology. Acknowledges that *how* we think matters for *what* we think.
  *   **Weakness:** Hard to apply formally. A vicious person can still stumble onto a valid proof.

  #### D. Critical/Ideological Critique (Standpoint Theory)
  *   **Position:** Objectivity is often a mask for dominant power structures. Claims of "universal reason" often exclude marginalized groups.
  *   **Verdict on Frege:** Frege's "objective realm of thoughts" might be an ideological construct that mirrors his desire for a hierarchy where he (the rational German male) is at the top.
  *   **Strength:** Excludes the possibility of "neutral" philosophy in a non-neutral world.
  *   **Weakness:** If pushed too hard, it undermines the possibility of any universal truth, leading to relativism.

  ### 3. Formal vs. Normative Disciplines: Is the Insulation Principled?

  You asked if logic/math is actually more insulated than ethics/politics, or if we just *want* it to be. There is a principled reason for the distinction, but it has limits.

  **The Principled Distinction:**
  *   **Internal vs. External Truth Conditions:** In logic and math, truth conditions are internal to the system. A syllogism is valid based on its form, not its content. In ethics and political theory, the *content* is the subject matter (human welfare, justice). If a political theorist hates a specific group of humans, their theory of justice is substantively compromised *by definition*, not just genetically.
  *   **Instrumentality:** Logic is often treated as a tool (like a hammer). A hammer built by a criminal still drives nails. Ethical theories are not just tools; they are guides to living. A guide to living written by a monster is suspect in its very directives.

  **The Limits of Insulation:**
  *   **Axiomatic Choice:** Even in logic, humans choose the axioms. Frege's Logicism was driven by a desire to reduce arithmetic to logic to secure *certainty*. That drive for absolute certainty can be viewed as a psychological/political need for security in a chaotic world.
  *   **Application:** Logic is used in computer science, AI, and law. If the underlying logical frameworks were designed with specific ontological biases (e.g., rigid binary classifications that exclude edge cases), the "formal" system encodes those biases.

  ### 4. The "Convenience" Accusation

  Is the separation thesis just a way to keep the tools we like?

  **The Argument for Convenience:**
  Yes, partly. If we apply a strict "moral purity" test to the history of philosophy, we lose Heidegger (Nazism), Husserl (initially accommodated the regime), Wittgenstein (complex views on culture/race), and Frege. The cost to the discipline would be catastrophic. There is a pragmatic imperative to salvage the logic.

  **The Argument for Principle:**
  However, it is not *merely* convenience. It relies on a **Platonist intuition**: that truths, once discovered, exist independently of their discoverer. If Frege discovered a structural feature of language and reality, that feature remains even if Frege was a terrible person. To deny this is to conflate *ontology* (what exists) with *sociology* (who is talking).

  ### 5. Synthesis: How to Read Frege Now

  The most robust position (and the one Dummett eventually leaned toward) is a **Critical Autonomism**:

  1.  **Validate the Logic:** Accept the *Begriffsschrift* and the distinction between sense and reference as technical achievements that stand on their own merits. The logic works.
  2.  **Contextualize the Philosophy:** Acknowledge that Frege's broader philosophical *narrative*—his drive for absolute precision, his hatred of ambiguity, his conception of "objective thought"—may have been fueled by his reactionary politics.
  3.  **Reject the Unity:** Refuse to treat Frege as a moral or political guide. Dummett noted that he could no longer read Frege as a "hero." He had to read him as a flawed vessel.

  **The Self-Undermining Question:**
  Does Frege's anti-psychologism undermine itself here?
  *   **No,** because anti-psychologism claims that the *truth* of the thought is independent of the thinker. The diary confirms the thinker was flawed; it does not prove the *thoughts* (logical laws) are false.
  *   **Yes,** in a subtler way: If Frege argued that only those with "pure" rationality can access the third realm, and his own rationality was corrupted by hate, then his *authority* as a witness to that realm is diminished. We trust his logic not because *he* said so, but because *we* can verify it.

  ### Summary
  The move to separate Frege's logic from his bigotry is not a genetic fallacy; it is a necessary commitment to the **objectivity of truth**. However, insisting that the *philosophical interpretation* of his work is immune to his biography *is* a mistake.

  We insulate formal disciplines not just because we like the tools, but because their validity conditions are formal. But we must admit that the *choice* to prioritize those formal disciplines, and the *style* in which they are constructed, is often deeply human, political, and vulnerable to the vices of the author. Dummett's rattled reaction was the sound of a philosopher realizing that the "third realm" is accessed by people living in the first and second realms, and those people can be monstrous.
