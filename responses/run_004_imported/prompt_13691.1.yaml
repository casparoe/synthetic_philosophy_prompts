      *   *The Case for Condemnation:* Focus on the "Truth" criterion (strategic truth vs. stereotype). The white financing (who controls the narrative?). The moral ambiguity (vice vs. virtue).
      *   *The Verdict:* Weigh the two. Du Bois's primary anxiety was white reaction impacting Black safety/rights. He prioritized the "Talented Tenth" image to open doors. Blaxploitation slammed doors (in his view) even if it empowered those inside the room.
      *   *Refinement:* Make sure to reference *Criteria of Negro Art* specific phrases ("beauty," "truth," "propaganda"). Connect to his feud with Hughes/Thurman.

