answer: |-
  Here are ten interview questions designed for your podcast, tailored to a guest defending Lon Fuller's *The Morality of Law*. They include the three specific thematic requirements you requested, along with pointed follow-ups anticipating standard Fullerian defenses.

  ### 1. The Nature of the "Morality"
  Fuller distinguishes between the "morality of duty" and the "morality of aspiration." You defend the claim that the eight desiderata constitute a morality, not merely principles of craftsmanship. If a legislator fails these principles—for example, by issuing retroactive rules—are they acting *immorally*, or have they simply failed to produce "law" in the functional sense? Where exactly does the moral blame lie in a failure of legality?

  *   **Follow-up:** If you argue the blame lies in the insult to human agency inherent in bad legislation, does this imply that a subject cannot be morally obligated to obey a rule that fails the desiderata, even if the rule's substance is benign?

  ### 2. Hart's Efficiency Objection (Required)
  H.L.A. Hart famously objected that the eight desiderata are neutral principles of efficiency. He argued that a poisoner must understand the chemistry of poison to kill effectively, just as a wicked regime needs clear, prospective, and consistent rules to oppress effectively. If the inner morality is compatible with wicked ends, how can it be distinctively *moral* rather than just technical?

  *   **Follow-up:** You will likely respond that respecting the eight desiderates honors the subject's capacity as a responsible agent. But if that agency is being honored only so the subject can be more effectively enslaved or persecuted, doesn't the "respect" become a hollow formality that strips the term "morality" of its substantive weight?

  ### 3. The "Murderous State" Scenario (Required)
  Let's press the link between legality and substantive justice. Imagine a state that openly declares a policy of exterminating a specific minority group. It enacts this policy through general, public, prospective, and clear statutes, and officials apply these rules with perfect congruence and consistency. On your reading, has this state satisfied Fuller's inner morality? If so, does that admit that the connection between legality and justice is merely contingent? If not, which desideratum does this scenario violate?

  *   **Follow-up:** If you argue that such a regime inevitably fails the desiderata (perhaps by undermining congruence through terror), are you making an empirical prediction about how tyrannies operate, or are you defining "law" in such a way that evil statutes are conceptually impossible? If it's the latter, aren't you risking circularity?

  ### 4. The Grudge Informer Cases (Required)
  In the postwar debate over the "grudge informer" cases, Hart advocated for a frankly retroactive statute to punish informers, arguing it was better to be honest about sacrificing the principle of non-retroactivity to achieve justice. Fuller argued we could interpret the Nazi statutes narrowly to find the informers guilty without admitting retroactivity. Does Fuller's approach risk undermining the very clarity and candor he champions by engaging in legal fiction?

  *   **Follow-up:** If you maintain that Fuller's method preserves the integrity of the legal system better than Hart's "honest retroactivity," does that prioritize the *system's* continuity over the democratic necessity of acknowledging when a regime has fundamentally broken its own rules?

  ### 5. Congruence and the Administrative State
  Of the eight desiderata, Fuller admits that "congruence between official action and declared rule" is the most fragile and difficult to maintain. In the modern administrative state, where agencies wield vast discretion and settle matters through guidance letters or informal adjudication, is the ideal of congruence still attainable? Or does Fuller's framework require a radical restructuring of modern governance?

  *   **Follow-up:** If you suggest that administrative discretion can be reconciled with congruence through procedural safeguards, does this concede that the "inner morality" relies heavily on external, substantive procedural laws rather than the internal logic of the rules themselves?

  ### 6. Reciprocity and Authority
  Fuller grounds the authority of law in a relationship of reciprocity between the lawgiver and the subject. When the government fails the inner morality, it arguably breaches this reciprocity. Does this breach automatically dissolve the citizen's obligation to obey, or does it merely diminish the *degree* of that obligation? Is there a threshold where legality fails so completely that resistance becomes a duty?

  *   **Follow-up:** If you argue there is no bright-line threshold but rather a sliding scale of obligation, how is a citizen supposed to navigate that uncertainty in real-time without risking the chaos that the rule of law is meant to prevent?

  ### 7. The Is/Oought Problem
  Legal positivists argue that Fuller conflates the "is" of legal efficacy with the "ought" of moral value. By defining law as a purposive enterprise, you seem to derive normative constraints from the functional definition of the system. How do you respond to the charge that you are committing a naturalistic fallacy by deriving moral obligations from the mere existence of a social practice?

  *   **Follow-up:** If you reply that the "ought" is internal to the practice (like the rules of a game), does this reduce the morality of law to a hypothetical imperative—i.e., "if you want to make law, you ought to follow these rules"—rather than a categorical moral demand?

  ### 8. Critical Legal Studies and Form
  Critics from the Critical Legal Studies movement argue that a focus on formal legality (like Fuller's) masks substantive inequalities. They claim that insisting on "neutral" procedures often entrenches the status quo by making systemic bias harder to identify. Does an emphasis on the inner morality of law inadvertently shield unjust substantive outcomes by focusing our critique on the *form* rather than the *content*?

  *   **Follow-up:** If you deny that form and content can be so easily separated, can you point to a historical instance where adherence to Fullerian legality prevented a substantively unjust outcome that a positivist system would have allowed?

  ### 9. Emergencies and Exceptions
  Fuller's system seems ill-equipped for states of emergency, where secrecy, retroactivity, and discretion are often deemed necessary for survival. Does the inner morality of law admit of a "state of exception," or is Fuller's claim that law must maintain these standards even—and especially—during a crisis?

  *   **Follow-up:** If you argue that the standards must hold even during a crisis, are you not risking a form of legal pacifism that could leave the state unable to defend the very legal order you seek to protect?

  ### 10. The Future of the Debate
  Since the Hart-Fuller exchange, inclusive legal positivism has attempted to accommodate some of Fuller's insights by allowing moral criteria within the rule of recognition. Do you see contemporary positivism as conceding ground to the Fullerian view, or have they successfully co-opted the "inner morality" as a contingent social fact rather than a necessary truth?

  *   **Follow-up:** If you believe they have co-opted it, does that dilution strip the concept of its power to critique legal systems from the outside, turning the "morality of law" into just another variable within a positivist framework?
