  *(Self-Correction during drafting Q4)*: On the Grudge Informer, Hart's critique is that Fuller's solution is "disguised retroactivity." The follow-up should press on whether Fuller is being honest about what he's doing.

  *(Final Review of Follow-ups)*: Make sure they are "keyed to the answer she is most likely to give." This means I need to predict the standard Fullerian defense.
  *   Hart/Efficiency -> She will likely say "Efficiency respects agency." -> Follow-up: "Is respect for agency moral if the end is enslavement?"
  *   Murderous State -> She will likely say "A regime that open murders fails congruence/generality eventually." -> Follow-up: "Is that empirical or conceptual? What if they are consistent?"
