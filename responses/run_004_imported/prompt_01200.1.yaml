  9.  **Final Polish:** Check citations (Book II, Ch 3 for Rousseau), ensure clear headings, maintain dissertation-appropriate register. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be careful not to say Weil is *just* spiritual. She is proposing a constitutional change. But her justification is spiritual/epistemological. Rousseau's justification is political stability/legitimacy. I need to highlight that distinction.

  *(Refining the "Faithful Extension" point)*: Is it faithful? It's faithful to the *spirit* of the General Will (indivisible, inalienable), but unfaithful to the *method* of the Social Contract (institutional engineering). I will argue she pushes the logic to a point where politics dissolves into morality.

  10. **Final Plan:**
