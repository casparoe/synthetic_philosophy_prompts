prompt: |-
  Ok so last night my friend Priya (shes finishing a math phd) and I got into this whole argument that went on way longer than it should have, about Skolem's Paradox -- she thinks it's basically a nothingburger, a cute fact about countable models that only sounds spooky, and I was arguing it actually has teeth against set-theoretic realism if you take it the way Putnam did. Neither of us budged, it kind of ruined dinner a little if I'm honest. Anyway, completely by coincidence, I co-run a tiny philosophy-of-math podcast, and next week's guest is a logician who's built a good chunk of his career defending basically the most radical version of my side -- his whole line is that Skolem's Paradox, run through Putnam's model-theoretic argument, shows there's no fact of the matter about which model our set-talk (or honestly any of our talk) is even about. I kind of want to send Priya the episode afterward, so I don't want 40 minutes of him just restating the thesis -- I want questions that make him earn it.

  Can you draft seven or eight interview questions that go after the substance instead of inviting a restatement? I need at least one that makes him spell out precisely what "the model is countable from the outside but contains a set that's uncountable from the inside" is doing philosophically -- why that isn't just a verbal trick about "uncountable" failing to be absolute. I need one that presses on the jump from Skolem's own fairly modest, local worry about axiomatized set theory to Putnam's much bigger claim that reference in general is indeterminate -- does that generalization actually go through, or does it need premises Putnam hasn't earned? I need one built around the "just more theory" move Putnam uses against anyone who tries to patch reference with extra constraints, and specifically whether he thinks Lewis's answer -- that some properties are objectively more "natural," and so aren't just more reinterpretable theory -- actually escapes that move, or just smuggles the realism back in under a new name. And I want one on whether second-order logic's categoricity results (à la Zermelo) really buy back determinacy or just relocate the same problem into whatever fixes the second-order quantifiers -- can you save that one for the end, since I think it's his strongest card and I don't want it spent early. For each question, throw in a short follow-up keyed to whatever answer he's most likely to give -- I don't want him to have an easy out on any of these.
