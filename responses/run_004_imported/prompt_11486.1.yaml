answer: |-
  Here are eight interview questions designed to press the substance of the Model-Theoretic Argument without giving your guest space to simply reiterate the Putnamian line. Each includes a follow-up tailored to the radical anti-realist position he is likely to defend.

  ### 1. The Ontological Weight of Relativity
  **Question:** Let's start with the mechanics of the paradox itself. In a countable model of ZFC, there exists a set $S$ that the model 'thinks' is uncountable, even though an external bijection to $\omega$ exists in the metatheory. The standard mathematical response is that 'uncountable' just isn't absolute. But you want to extract metaphysical indeterminacy from this. Why isn't this just a verbal trick about the word 'uncountable' failing to pin down a unique extension? What specific philosophical work is that external bijection doing, if it doesn't exist *inside* the model?

  **Follow-up:** *If he says the bijection shows the reference is underdetermined:* "But if the bijection isn't available to the user of the theory—if it's not constructible or definable within the system—how does its mere existence in the metatheory force *us* to be referentially indeterminate? Are you arguing that ontology is fixed by what's possible in the metatheory, rather than what's accessible to the theorist?"

  ### 2. From Local Axioms to Global Reference
  **Question:** Skolem's original point was fairly modest: first-order axiomatizations can't capture our intuitive notion of set. Putnam's Model-Theoretic Argument makes a much larger leap: that *no* constraints can fix reference for *any* terms, because any constraint is satisfiable by a non-standard model. What is the specific premise that licenses that generalization? Why does a limitation on *axiomatizability* entail a limitation on *reference* itself?

  **Follow-up:** *If he says "Because any constraint we state is just more sentences":* "That assumes reference is fixed solely by theoretical description. But if I point to a physical token or engage in a causal interaction, aren't those non-sentential constraints? Why does the 'just more theory' move apply to non-linguistic causal links?"

  ### 3. The "Just More Theory" Regress
  **Question:** Your defense relies heavily on the "just more theory" move: if I try to fix reference by adding a constraint like 'refers to the standard model,' you treat that constraint as just another formula subject to reinterpretation. Doesn't this generate a vicious regress? If every meta-language constraint is subject to the same relativity, do we ever actually communicate, or are we just shuffling symbols that never touch the world?

  **Follow-up:** *If he says "Communication is pragmatic success, not reference":* "If reference is irrelevant to success, then the paradox doesn't show reference is *indeterminate*, it shows reference is *idle*. Why should a realist care if your argument eliminates a notion that does no work?"

  ### 4. Lewis and "Natural" Properties
  **Question:** David Lewis tried to block this by arguing that some properties are objectively more "natural" than others—they carve nature at the joints—and reference is magnetically drawn to them. Does the 'just more theory' move actually defeat Lewis? Or does calling 'naturalness' a theory just smuggle realism back in by assuming we can reinterpret the predicate 'natural' without losing the very similarity judgments that make reinterpretation possible?

  **Follow-up:** *If he says "'Natural' is just another predicate we can reinterpret":* "If we can reinterpret 'natural' arbitrarily, does that mean there is no objective fact about whether two things are similar? Are you committed to the claim that similarity itself is model-relative?"

  ### 5. Operational Constraints and Practice
  **Question:** My friend Priya, who is a mathematician, would argue that the *practice* of set theory rules out the countable models. We don't just write axioms; we compute, we prove, we interact with specific structures. Does the Lowenheim-Skolem theorem actually apply to the *activity* of mathematics, or does it only apply to the static sentences we write down after the fact?

  **Follow-up:** *If he says "Practice is also interpretable non-standardly":* "Is there a feasibility limit here? To interpret my practice as being about a countable model, don't you need a complexity of interpretation that exceeds the cognitive resources of the practitioner? If the interpretation is impossible for *us* to hold, in what sense is it a valid candidate for what we mean?"

  ### 6. The Status of the Continuum Hypothesis
  **Question:** If reference is indeterminate, then there is no fact of the matter about whether CH is true, because 'set' and 'subset' shift extensions across models. But isn't this indistinguishable from the standard pluralist view that CH is independent of ZFC? What does the Model-Theoretic Argument add to the claim that CH is undecidable, other than a skeptical story about *why* it's undecidable?

  **Follow-up:** *If he says "Independence assumes a fixed background; indeterminacy denies it":* "If there's no fixed background, on what grounds do we assert the independence results themselves? Doesn't proving independence require a stable metatheory that your argument undermines?"

  ### 7. The "Nothingburger" Objection
  **Question:** Many mathematicians view Skolem's Paradox as a technical curiosity—a 'nothingburger'—because it doesn't change which theorems they can prove. If the countable models are elementarily equivalent to the uncountable ones, they satisfy the same sentences. If the output is identical, why should we accept a metaphysics that says the subject matter is fundamentally different?

  **Follow-up:** *If he says "Because truth isn't just theoremhood":* "If truth outstrips theoremhood, how do we access that truth? If we can't access it, and it changes no predictions or proofs, isn't this a distinction without a difference for the practice of mathematics?"

  ### 8. Second-Order Logic and Categoricity (The Closer)
  **Question:** Finally, Zermelo showed that second-order ZFC is quasi-categorical: it fixes the model up to isomorphism, seemingly blocking the Skolemian slide. The standard counter is that second-order logic relies on 'standard semantics,' which presupposes we already understand 'all subsets,' begging the question. But if we *do* have a grasp of 'all subsets'—which seems necessary to even state the paradox—are you forced to admit that the indeterminacy lies in our *logic*, not our *ontology*?

  **Follow-up:** *If he says "Standard semantics is unintelligible":* "If standard semantics is unintelligible, then we don't actually reason with second-order logic. But mathematicians *do* use categorical reasoning constantly. Are you arguing that mainstream mathematical practice is systematically confused about its own logical resources?"
