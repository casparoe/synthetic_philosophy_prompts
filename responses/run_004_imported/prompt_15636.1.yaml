answer: |-
  You have stumbled into one of the most fertile and difficult problems in epistemology and the philosophy of history. The short answer to your question is: **Yes, philosophers have worked extensively on whether one false account can be "closer to the truth" than another.** The concept is called **verisimilitude** (or truthlikeness).

  However, the longer answer reveals why your instinct feels so unstable. While the *concept* of verisimilitude is coherent, applying it to human character—where motives are unobservable and records are partial—is where the logic gets muddy. Your fear that you are mistaking "dramatic satisfaction" for "accuracy" is not just writerly anxiety; it is a recognized philosophical hazard known as the **narrative fallacy**.

  Here is how the philosophical landscape maps onto your dilemma, and where it might offer you traction rather than just paralysis.

  ### 1. The Problem of Verisimilitude
  In the 1960s, Karl Popper formalized the question you are asking. He wanted to show that even if a scientific theory is technically false (as Newtonian physics is, compared to Einsteinian), it can still be *closer to the truth* than a previous theory. He defined this logically: Account A has more verisimilitude than Account B if A contains more true content and less false content than B.

  However, in the 1970s, philosophers David Miller and Pavel Tichý proved Popper's definition mathematically flawed. They showed that if two accounts are both strictly false, you cannot simply count the "true bits" to see which is closer. A statement that is wrong about everything but "close" (e.g., "The temperature is 21°C" when it is 20°C) feels truer than a statement that is right about one trivial thing but wrong about the whole ("The temperature is 20°C and it is raining on Mars"), but logic struggles to rank them without a metric of *similarity*.

  Later philosophers, like Ilkka Niiniluoto, developed "similarity approaches" using possible-world semantics. They argue that we *can* rank false accounts based on how similar the world described by the account is to the actual world.

  **The Traction for You:** This validates your instinct that "false" does not mean "equally false." Source A (the memoir) and Source B (the archive) are both false in particulars, but they describe different *possible worlds*.
  *   **Source B** describes a world that matches the *physical* records (dates, movements) but perhaps posits a psychological world (cold ambition) that is less similar to the reality of human resistance behavior.
  *   **Source A** describes a world that matches the *psychological* records (loyalty, recklessness) but posits a physical world (dates, conversations) that never existed.

  Philosophy allows you to say that one account can be closer to the truth *in dimension X* while the other is closer *in dimension Y*. You do not have to collapse them into a single ranking of "Truth."

  ### 2. The Philosophy of History: *Erklären* vs. *Verstehen*
  Your distinction between the "truth of the record" and the "truth of the person" maps onto a classic divide in German hermeneutics: *Erklären* (explanation) vs. *Verstehen* (understanding).

  *   **Source B operates via *Erklären*:** It seeks causal explanation based on external evidence. Police records show where she went; therefore, she went there. If the records show she sought leadership roles, the historian infers ambition. This is the truth of *mechanism*.
  *   **Source A operates via *Verstehen*:** It seeks empathetic understanding of internal meaning. The comrade knew *why* she took risks. This is the truth of *experience*.

  The philosopher Paul Ricoeur argued that history is always a blend of both. He suggested that narrative is not a lie we tell about the past, but the only way human time becomes intelligible. However, Hayden White warned that "emplotment" (turning events into a story with a genre, like tragedy or romance) inevitably distorts the raw data.

  **The Traction for You:** Your friend's advice ("use whichever makes the better novel") assumes that narrative is merely decorative. Ricoeur would argue narrative is constitutive of truth. However, White would warn you that Source A's "martyr" plot is just as much a construction as Source B's "calculating agent" plot. The academic biographer has also emploted the data, likely into a genre of "revisionist realism" that distrusts heroism.

  Neither source is the "view from nowhere." Source B is not objective truth; it is a truth filtered through the bias of the archive. Police records record suspicion, not virtue. They record presence, not intent. To infer "ambition" from "seeking leadership" is an interpretation, not a fact.

  ### 3. The Trap of Narrative Coherence
  You mentioned your suspicion that you prefer Source A because it is "dramatically satisfying." This is a crucial philosophical check. Nassim Taleb and Daniel Kahneman have written about the **narrative fallacy**: our tendency to prefer coherent, causal stories over messy, probabilistic realities.

  Human beings are rarely psychologically coherent. We are contradictory. Source A offers a "psychologically coherent person whose recklessness, loyalty, and blind spots all hang together." **That coherence itself is suspicious.** Real people often act out of character. If Source A makes her too consistent in her martyrdom, it may be *further* from the truth of her humanity than Source B's colder, more ambiguous figure.

  However, Source B risks the **reductionist fallacy**. Archives are notoriously bad at capturing conviction. A resistance fighter might seek leadership not out of ambition, but out of a desperate sense of responsibility that looks like ambition to a bureaucrat. If Source B interprets all altruism as latent egoism because that fits a modern, secular worldview, it is just as ideological as Source A's 1950s hagiography.

  ### 4. A Proposed Synthesis: Inference to the Best Explanation
  Instead of asking "Which is closer to the truth?", you might ask: "Which hypothesis best explains the existence of *both* sources?"

  This is **Inference to the Best Explanation (IBE)**.
  *   **Hypothesis 1:** She was a pure martyr (Source A). *Problem:* Doesn't explain the archival evidence of calculated risk-taking or careerism.
  *   **Hypothesis 2:** She was a cold opportunist (Source B). *Problem:* Doesn't explain why she stayed when she could have fled, or why a comrade loved her enough to write a memoir in her defense years later. People rarely adore cold calculators who get them killed.
  *   **Hypothesis 3 (The Novelistic Truth):** She was a complex human whose conviction and ambition were indistinguishable, even to her.

  Perhaps the "truth" is that she *needed* to believe she was a martyr to sustain the ambition required to do the work. Source A captures her internal phenomenology (how she felt); Source B captures her external footprint (how she looked).

  ### 5. Practical Philosophical Advice for the Novelist
  You asked if philosophy explains why your sense of "closeness" cannot be defended. It does not say it *cannot* be defended; it says it cannot be defended using **correspondence theory** (matching facts to reality) alone. You must defend it using **coherence** and **pragmatic** theories of truth.

  1.  **Abandon the Binary:** Do not choose one source. The tension between them *is* the historical reality. The fact that we cannot know her fully is the tragedy of her death.
  2.  **Use Source B for the Skeleton, Source A for the Nervous System:** Let the archives dictate the timeline and the events (the "what"). Let the memoir dictate the emotional texture and motivation (the "why"), but treat the memoir as *testimony* rather than *fact*.
  3.  **Acknowledge the Gap:** You can write the novel in a way that acknowledges the uncertainty. Not necessarily by breaking the fourth wall, but by allowing the character herself to be unsure of her own motives. If you write her as wondering, "Am I doing this for France, or because I cannot bear to be ordinary?" you satisfy the academic critique while retaining the memoir's emotional stakes.
  4.  **Trust the "Truth of the Record" Limits:** Remember that police records are also fictions. They are written by occupiers trying to justify their repression. They have their own agenda. Source B is not "objective"; it is "bureaucratically verified."

  ### Conclusion
  Philosophy confirms that your question is coherent: **Verisimilitude is real.** One false account can be closer to the truth than another. But it also confirms your fear: **Access is limited.** We cannot measure the distance to the truth without standing outside the system, which you cannot do.

  Your instinct that Source A is "nearer the truth of the person" is defensible if you define truth as *disclosure* (Heidegger's *aletheia*) rather than *correctness*. Source A discloses the meaning of her life to those who lived it; Source B corrects the coordinates of her death.

  For a novel, the "truth of the person" usually carries more weight than the "truth of the record," provided you do not lie about the record to serve the person. If you keep the dates correct (Source B) but inhabit the motives of the comrade (Source A), you are not engaging in self-deception. You are engaging in the specific kind of truth-telling that art is for: not to report what happened, but to explain what it meant.

  The fact that this keeps you up at night is not a sign you are failing; it is a sign you are treating the subject with the ethical weight she deserves. A novel that smoothed over this contradiction would be a better story, perhaps, but it would be a lie. A novel that holds the contradiction open is where the truth lives.
