      *   *Team Reasoning:* To cooperate, I must frame the situation as a "We". Do strangers automatically form a "We"? Bacharach argues context matters. Sugden argues it requires a shared intention. In a strict anonymous PD, the "We" is thin. However, Team Reasoning doesn't require *you* to be identical to *me*; it requires *me* to adopt a mode of reasoning that presupposes a joint agency. But if I adopt "We" and you don't, I get sucker's payoff. So I still need a belief that you will do your part.
