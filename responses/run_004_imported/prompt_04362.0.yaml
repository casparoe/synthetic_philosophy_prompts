      *   *Let's look closer at the "Stranger" constraint.* If I am a stranger to you, why should I adopt a "We" frame? Sugden says we need a "meeting of minds." Hofstadter says we are both rational, therefore we are identical. Hofstadter's premise is stronger (and more dubious). Team Reasoning's premise is weaker (requires identification).
      *   *However:* The user is a physicist. They appreciate the "renormalized particle" analogy.
