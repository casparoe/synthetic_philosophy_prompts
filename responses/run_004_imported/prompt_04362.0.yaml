      *   **Team Reasoning (Bacharach/Sugden/Gold):**
          *   *Premise:* Players frame the agency as "We" rather than "I".
          *   *Mechanism:* Utility transformation or Agency transformation. The unit of agency is the group. I do my part of the profile that maximizes *team* utility.
          *   *Requirement:* Identification with the group (we-frame).
          *   *Outcome:* Cooperate in symmetric PD (if it maximizes team payoff).

  3.  **Identify Similarities and Differences:**

      *   *Similarities:* Both prescribe cooperation in the one-shot symmetric PD. Both reject standard Nash equilibrium reasoning (defect-defect). Both rely on some form of symmetry or shared perspective.
      *   *Differences (The Crux):*
          *   *Source of Normativity:* Superrationality relies on *epistemic symmetry* (I know you think like me). Team Reasoning relies on *agency transformation* (I adopt the group's goal).
