      *   *BUT:* The user asks which offers the more *defensible justification*. If the premise of Superrationality is false (actions aren't logically correlated), it's not defensible. Team Reasoning is defensible *if* the frame exists.
      *   *Is there a way Team Reasoning works for strangers?* "Minimal group paradigm." Mere categorization can trigger it.
