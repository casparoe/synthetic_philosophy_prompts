          *   **Correction:** *Two Ages* was published under Kierkegaard's own name. The phrase "the crowd is untruth" is indeed in *Two Ages* (in the "Present Age" section), but linking it specifically to the pseudonym Climacus in the context of *this* essay is misleading/incorrect regarding the authorship of *Two Ages*.

