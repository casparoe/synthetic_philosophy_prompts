          *   **Detail:** *Two Ages* was published in 1846. It was published under Kierkegaard's *own name*, not a pseudonym.
          *   **Detail:** The phrase "the crowd is untruth" (*Mengden er Usandhed*) appears in *A Literary Review* (specifically in "The Present Age" section), BUT it is most famously associated with the pseudonym Johannes Climacus in *Concluding Unscientific Postscript* (also 1846). However, attributing the *essay* (*Two Ages*) to Johannes Climacus is incorrect. *Two Ages* is signed by Kierkegaard.
