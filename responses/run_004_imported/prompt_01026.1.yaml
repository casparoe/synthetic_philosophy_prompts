      *   **The Counter-Argument (Gauthier's Side):** Mara argues that rationality isn't just moment-to-moment maximization. It's about being the *kind of person* who keeps plans.
      *   **Pressing the Weak Point (Against Elias):** Mara asks: "Why can't you just lie to yourself? Or just decide?"
          *   *Elias's Response:* It's not about lying. Intention implies belief. If I know I'm rational, I know I won't drink. Therefore, I can't believe I will. Therefore, I can't intend. A "sincere feeling" isn't enough if the cognitive basis is missing.
      *   **Pressing the Weak Point (Against Mara):** Elias asks: "Isn't this just magic? If I decide to jump off a bridge for money, does that make it rational?"
          *   *Mara's Response:* No, it's about *ex-ante* vs. *ex-post* rationality. The plan is rational at the start. Sticking to it is part of the rationality. It's not "whatever gets paid," it's "being an agent who can cooperate with their future self."
      *   **The Climax:** Midnight approaches. The tension of the deadline.
