answer: |-
  The iron gates of the estate loomed out of the fog, sealed tight until the clock struck twelve. Two figures stood before them, huddled against the chill. One was a man in a frayed trench coat, pacing a tight circle in the gravel. The other was a woman leaning against the stone pillar, perfectly still, watching the digital face of her watch.

  **Elias:** (Stopping his pace) It's 11:58. You're still here. That means you haven't wired the withdrawal notice. You're still trying to claim it.

  **Mara:** Are you?

  **Elias:** I'm standing here, aren't I? But I'm telling you, it's a ghost. The million dollars is a mirage for people like us.

  **Mara:** People who want a million dollars?

  **Elias:** People who can think. Look, the mechanism is simple. The scanner inside measures intention. Not a promise. Not a wish. *Intention.* To form an intention to do X, I have to believe I will actually do X. But I know, with absolute certainty, that tomorrow afternoon I will not drink that toxin.

  **Mara:** Why not?

  **Elias:** Because tomorrow afternoon, the money will already be in my account. The deal is done. Drinking the toxin brings me pain and zero benefit. Not drinking brings me zero pain and the same benefit. I am a rational agent. I will not choose pain for no reason. Therefore, I will not drink. Therefore, I cannot *believe* I will drink. Therefore, I cannot intend to drink.

  **Mara:** You're describing a trap, Elias. But you're walking into it voluntarily. You're treating your future self like a stranger you can't control.

  **Elias:** I'm treating my future self like a rational agent who faces different incentives than I do right now. Tonight, the incentive is the money. Tomorrow, the incentive is avoiding sickness. The money drops out of the equation. You can't bridge that gap with wishful thinking.

  **Mara:** It's not wishful thinking. It's *resolute choice.* You're making the classic error. You think rationality is about maximizing utility at every single distinct moment. That's not rationality; that's impulsivity dressed up in a suit.

  **Elias:** It's instrumental rationality. It's how agents function.

  **Mara:** It's how *myopic* agents function. A rational agent plans a course of action that maximizes utility from the starting point—*ex-ante*—and then sticks to it. If you decide tonight that the best path is "Intend → Get Money → Drink," then deviating from that path tomorrow is the irrational act, not the drinking.

  **Elias:** (Laughs sharply) That's convenient. Define "rational" as "whatever gets you the money," and suddenly the impossible is possible.

  **Mara:** No. Define rationality as *agency over time.* If you can't bind your future self to a plan that benefited you in the past, you aren't an agent. You're just a series of time-slices passing a hot potato. I am choosing to be the kind of person who keeps commitments to myself.

  **Elias:** But the scanner isn't measuring "commitment." It's measuring sincerity. And here is where your house of cards falls. Let's say you convince yourself. Let's say you stand there tomorrow, money in the bank, and you think, "I must drink." You'll look at the vial. You'll know the money is secure. You'll know drinking hurts. What stops you from putting the vial down?

  **Mara:** My prior resolution.

  **Elias:** That's not an answer. That's a slogan. Why is holding to a prior resolution rational when the costs have skyrocketed and the benefits have vanished? If I told you I'd burn your hand tomorrow for a dollar you got today, would you do it? Is that "resolute choice" too?

  **Mara:** (Pushes off the pillar) That's the weak point, isn't it? You want to know where the boundary is. It's not "whatever gets you paid." It's about plans that are *optimal to adopt.* It is optimal to adopt the disposition to follow through on self-binding contracts. If I have that disposition, I get the million. If I have the disposition you're advocating—the one that re-evaluates every choice in isolation—I get nothing. So, possessing the disposition is the rational trait.

  **Elias:** But *you* don't possess it. You're a human being. You're standing outside a gate trying to hack your own psychology. Here's the knife in your argument: Even if it's "rational" to have that disposition generally, you can't conjure it *now*, in this specific case, because you *know* the case. You know the payout is decoupled from the action.

  **Mara:** And here is yours. You claim you can't intend because you know you won't act. But intention isn't a prediction based on current incentives. It's a commitment to create reasons.

  **Elias:** You can't create reasons out of thin air! Tomorrow, the reason to drink is gone. If I stand there and say, "I intend to drink," but I know I'm lying to myself to trick a scanner... that's not intention. That's simulation. A sincere feeling isn't enough if the cognitive architecture doesn't support it. It's like trying to believe the sky is green because it pays well. You can say the words, but you don't *believe* it.

  **Mara:** I don't need to believe the sky is green. I need to recognize that my future self is bound by the authority of my past self's decision.

  **Elias:** Authority based on what?

  **Mara:** Based on the fact that if I don't recognize it, I lose.

  **Elias:** (Checks his watch) 11:59. You're circling. You say it's rational to bind yourself, but you can't explain *how* a rational agent ignores a dominant strategy tomorrow. Tomorrow, not drinking dominates drinking. It's strictly better. Any theory that says otherwise isn't decision theory. It's theology.

  **Mara:** And any theory that says an agent can't plan for tomorrow without being held hostage by tomorrow's whims isn't rationality. It's slavery to the present moment. You say I can't form the intention. I say you *won't*. You're too afraid to trust your own capacity to define your actions.

  **Elias:** I'm not afraid. I'm clear-headed. That's the tragedy. The clearer I see the logic, the less I can want the money. To get the prize, I'd have to be slightly broken. I'd have to be the kind of person who ignores obvious incentives.

  **Mara:** Or the kind of person who understands that incentives aren't just about the immediate payoff. They're about being a creature who can make deals. Even with themselves.

  **Elias:** (Steps closer to the intercom) We have thirty seconds. If you go in there and lie to the scanner, it won't register. If you go in there and tell the truth, you admit you won't drink, and you get nothing.

  **Mara:** I'm not going in to lie. I'm going in to decide.

  **Elias:** You can't decide to be irrational.

  **Mara:** I can decide to be consistent.

  **Elias:** (Shakes his head) You're walking into a wall. You know that, right? Tomorrow afternoon, when the sickness hits, you'll stop. And then you'll realize you never really intended it. You just hoped.

  **Mara:** And you'll be standing there with your million dollars in your pocket, wishing you knew how to make a promise.

  **Elias:** I know how to make a promise. I just know I won't keep it if there's no reason to.

  **Mara:** Then you're already poor.

  The digital clock on the gatehouse flickered. The numbers rolled from 11:59 to 12:00. A low hum vibrated through the iron bars as the locking mechanism disengaged. The gate creaked open a single foot, just enough for one person to slip through.

  Elias looked at the opening, then at Mara. Mara looked at the opening, then at Elias. Neither moved.

  **Elias:** Well?

  **Mara:** After you.

  **Elias:** No. You were so sure.

  **Mara:** Intention is internal, Elias. The gate doesn't care who walks through first. It cares who walks through *ready.*

  Elias stared at the gap in the gate. He took a breath, his chest rising sharply, then exhaled slowly. Mara's hand rested on the cold iron, her fingers tightening until the knuckles turned white.

  The hum of the intercom crackled to life, a static voice waiting for an input signal.

  **Voice:** *State intention.*
