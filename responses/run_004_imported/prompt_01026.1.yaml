      *   **Key Requirement:** Each must press the other on their weakest point (A: Why doesn't a sincere feeling count? B: Why isn't this just "whatever gets paid is rational"?).
      *   **Ending:** Stroke of midnight. Ambiguous outcome (don't say who gets the money).

  2.  **Character Conception:**
      *   *Character A (The Skeptic):* Let's call him Elias. He's anxious, pacing, maybe checking his watch. He represents the "orthodox" decision theory view (instrumental rationality). He believes intention requires a belief in future action, which is unjustified here.
      *   *Character B (The Committer):* Let's call her Mara. She's calm, perhaps leaning against the gate. She represents "resolute choice" or "constrained maximization." She believes rationality involves sticking to plans that benefit you overall.

  3.  **Drafting - Section by Section:**

