prompt: |-
  Ok so I had this whole argument with my friend last night about superrationality (the Hofstadter idea that two "ideal" reasoners will cooperate in a one-shot prisoner's dilemma just because they know they'll both reach the same conclusion). She says its basically cheating -- defection dominates no matter what the other guy does, so the second you let "well, they'll think what I think" change your move, you've quietly thrown out dominance reasoning without admitting it. I tried to argue that the real move is noticing your choice is correlated with theirs even with zero causal link between you, so treating the two choices as independent (which is what makes dominance reasoning valid in the first place) is the actual mistake here, but I couldn't make that rigorous on the spot and now I'm not 100% sure I even believe it. Can you lay out the strongest version of this argument, whether superrationality can actually be defended without it basically collapsing into evidential decision theory, and how much weight it puts on the two agents being near-identical vs just "similar enough"?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Topic:** Superrationality (Douglas Hofstadter's concept) in the context of the one-shot Prisoner's Dilemma (PD).
      *   **The Conflict:** User vs. Friend.
      *   **Friend's Position:** Superrationality is "cheating." Defection is a dominant strategy. Allowing "they'll think like me" to influence the decision violates dominance reasoning.
      *   **User's Position:** Choices are correlated even without causal links. Treating them as independent (required for dominance reasoning) is the mistake.
      *   **User's Request:**
          1.  Lay out the strongest version of the argument for superrationality.
          2.  Address whether it collapses into Evidential Decision Theory (EDT).
          3.  Address the requirement for agent similarity (identical vs. similar enough).

  2.  **Initial Assessment & Fact-Checking:**
      *   *What is Superrationality?* Hofstadter's idea that rational agents, knowing they are facing the same problem and are equally rational, will reason identically. Therefore, my choice *determines* their choice (logically, not causally).
      *   *What is Dominance Reasoning?* In standard Game Theory (Causal Decision Theory - CDT), I should defect because $Payoff(Defect, Cooperate) > Payoff(Cooperate, Cooperate)$ and $Payoff(Defect, Defect) > Payoff(Cooperate, Defect)$. This assumes my choice doesn't change theirs.
      *   *What is EDT?* Choose the act that provides the best *evidence* for a good outcome. $E[U|Act]$. In PD, Cooperating is evidence the other Cooperated.
      *   *What is FDT/UDT?* Functional Decision Theory / Updateless Decision Theory. These are modern formalizations of this intuition.
      *   *Is the Friend Right?* From a standard CDT/Game Theory perspective, yes. Defection is dominant.
      *   *Is the User Right?* From an EDT/FDT perspective, yes. The independence assumption is the weak link.
      *   *Does it collapse into EDT?* Largely, yes, but FDT tries to refine *why* the correlation exists (logical correlation vs. statistical correlation).
      *   *Similarity Requirement:* Crucial. If agents aren't similar, the logical link breaks.

  3.  **Drafting the Argument Structure:**

      *   **Introduction:** Acknowledge the depth of the debate. It's a classic clash between Causal Decision Theory (CDT) and something else (EDT/FDT).
      *   **The Core Conflict (Dominance vs. Correlation):** Explain *why* the friend thinks dominance applies (causal independence) and *why* the user thinks it doesn't (logical dependence).
      *   **The Strongest Case for Superrationality:**
          *   Premise 1: Rationality is a function. Same inputs + same function = same output.
          *   Premise 2: The PD scenario is symmetric.
          *   Conclusion: My output *is* their output (logically).
          *   Reframing the Payoff Matrix: It's not (Me, Them), it's (Algorithm Output, Algorithm Output). So the choices are (C,C) or (D,D). (C,C) beats (D,D).
      *   **The EDT Connection:**
          *   Admit that superrationality looks a lot like EDT.
          *   Distinguish them: EDT is about statistical correlation (e.g., smoking lesion). Superrationality is about *logical* correlation (same source code).
          *   Introduce Functional Decision Theory (FDT) as the modern rigorous version. This validates the user's intuition without the "magic" of EDT.
      *   **The Similarity Requirement:**
          *   How similar do they need to be?
          *   If 100% identical: Strong case.
          *   If "similar enough": Probabilistic. Expected utility calculation depends on the probability of correlation.
          *   If dissimilar: Superrationality fails; CDT takes over.
      *   **Conclusion:** Who won the argument? (Nuanced answer).

  4.  **Fleshing out the Content (Iterative refinement):**

      *   *Dominance Reasoning:* I need to be clear that dominance holds *conditional on independence*. If $P(Them=C | Me=C) \neq P(Them=C)$, dominance doesn't apply directly.
      *   *The "Cheating" Accusation:* The friend says it's cheating because it assumes magic causation. I need to explain it's not causation, it's *logical necessity*. Like two calculators computing 2+2.
      *   *EDT vs. FDT:* This is a key distinction. EDT says "Cooperating makes it *likely* they cooperated." FDT says "My decision procedure *is* their decision procedure." FDT is the stronger philosophical defense for superrationality because it avoids Newcomb-like weirdness in cases where correlation isn't logical. I should mention MIRI/Yudkowsky/Soares.
      *   *Similarity:* Use the concept of "logical uncertainty." If I'm not sure they run the same code, I assign a probability $p$ to correlation. If $p$ is high enough, Cooperate. If low, Defect.

  5.  **Refining the Tone:**
      *   Keep it intellectual but accessible.
      *   Validate both sides (Friend is right by standard textbook definitions; User is right by deeper logical analysis).
      *   Avoid taking a hard stance on "Truth," focus on "Framework."

  6.  **Self-Correction/Edge Case Check:**
      *   *Did I explain why dominance fails?* Yes, dominance assumes $P(O|A) = P(O)$. Superrationality denies this.
      *   *Is "Superrationality" a standard term?* It's Hofstadter's term. In modern decision theory, it's mostly subsumed by FDT/UDT. I need to make that link clear so the user knows where to read more.
      *   *What about the "one-shot" aspect?* Crucial. If repeated, reciprocity works. Superrationality is specifically for the one-shot case.

  7.  **Final Polish:** Organize into clear sections. Use bolding for key concepts. Ensure the "Similarity" question gets a dedicated section. (Proceed to generate output based on this structure).

      *(Self-Correction during drafting)*: I should be careful not to say Superrationality *is* EDT. EDT has problems (e.g., the Smoking Lesion). FDT is the better modern mapping. I will explain that Superrationality is an intuitive precursor to FDT.

      *(Refining the "Cheating" point)*: The friend says it violates dominance. I need to explain that dominance is a theorem that relies on specific axioms (causal independence). If you reject the axiom, the theorem doesn't hold. It's not breaking math; it's changing the model.

