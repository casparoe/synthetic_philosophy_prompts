answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Rain streaks the window. On the table between them sits a copy of Milton Friedman's "The Island of Stone Money," open to a dog-eared page. **Arthur** (60s, Economics Department, sharp suit, impatient hands) stirs his espresso. **Elena** (50s, Anthropology Department, worn cardigan, steady gaze) leans back, watching him.*

  **Arthur:** You're smiling, Elena. I know that look. It's the look you get when you think you've found a corpse in the garden of neoclassical economics.

  **Elena:** Not a corpse, Arthur. Just a ghost. I was reading Friedman's account of the Yap again. The story of the stone that sank. It never fails to delight me.

  **Arthur:** The one lost in the storm? It's a charming anecdote about information asymmetry.

  **Elena:** Is that what we're calling it? A family's ancestral wealth sits at the bottom of the ocean. Physically inaccessible. Unseeable. By your definition, it's gone. It's no longer a commodity. It cannot be handled, stored, or delivered. And yet, the islanders continue to treat it as wealth. They trade *claims* on it. To me, this isn't an anomaly. It's the naked truth. Money was never the stone. Money is the memory.

  **Arthur:** *[Stops stirring]* You're jumping to the ledger too quickly. Let's stick to Menger. Money emerges because traders need to overcome the double coincidence of wants. They converge on the most saleable commodity. On Yap, that was limestone. It was durable, scarce, difficult to procure. That physical difficulty is what anchored the value.

  **Elena:** But the stone is gone, Arthur. The physical difficulty is now infinite. You cannot quarry it from the sea floor. If money were truly the commodity, the value should have vanished with the visibility of the object. But it didn't. Why? Because the community agreed to keep the ledger entry alive. It proves Innes right: money is a credit relation, a social obligation. The stone was just a token, like a tally stick. When the stick burns, the debt remains if the community says it does.

  **Arthur:** No, no. You're confusing the *asset* with the *title*. The stone was the asset. When it sank, the title remained tradeable because the *knowledge* of its existence remained common knowledge. It's not about the community instituting a debt; it's about the market pricing in the risk of loss. The fact that they continued to trade the title proves the strength of the original commodity selection. The limestone was so saleable, so universally desired, that even a theoretical claim on a submerged disk held value. It's the ultimate testament to the commodity theory. The commodity was so strong it survived its own physical destruction.

  **Elena:** That is a spectacular contortion. You're saying the commodity survived its own demise? Come now. If I hand you a gold bar and it turns out to be tungsten painted gold, your "commodity money" is worthless. But on Yap, if the stone was never actually brought to the island—if the story was that it sank, and everyone *believed* it sank—it still functioned. David Graeber made this point explicitly. If the value rests on a story everyone agrees to tell, it's not a commodity. It's a social contract.

  **Arthur:** It's not just a story! It's verified history. The ancestors *did* go to Palau. They *did* quarry the stone. The labor was expended. That's the commodity basis! The value is crystallized labor and risk. The sinking is just a logistical accident. You Chartalists act as if value is conjured by the sovereign or the tribe. But without the history of that stone being a difficult-to-obtain good, your "social ledger" would be writing in water. Why didn't they use coconut shells?

  **Elena:** Because coconut shells weren't *chosen* by the elders to mark high-value settlements. Because the lineage of the stone mattered. Listen to yourself: "Verified history." "Ancestors." "Lineage." You're describing a social institution, a system of record-keeping embedded in kinship and ritual. You want to say money is a thing that *became* money spontaneously. I'm telling you money is a language that *makes* things money. The lost stone proves that the physical object is incidental. It's the recognition that counts.

  **Arthur:** Recognition of *what*?

  **Elena:** Of a debt owed to that family.

  **Arthur:** A debt for what? They didn't provide a service. They own the stone.

  **Elena:** Ownership *is* a social relation, Arthur. It's not a physical fact. If I own land, I don't own the dirt; I own the right to exclude others, enforced by the community. The Yap family didn't control the stone on the sea floor. Sharks could swim around it. Tides could bury it. They controlled the *social right* to say, "This value is mine," and have the village nod. That is the definition of chartalism. The state—or in this case, the tribal consensus—is the ledger.

  **Arthur:** You're conflating the enforcement of property rights with the origin of money. Menger doesn't deny you need property rights. But the *medium* itself must have value independent of the ledger to start the process. The limestone had industrial and ornamental use before it was money.

  **Elena:** Did it? Or was it valuable *because* it was money? Ethnographers suggest the stones were too large to move for practical use. They weren't building foundations with them. They were parking them in front of houses as status markers. That's not a commodity emerging from barter. That's a ritual object being monetized. The lost stone is the reductio ad absurdum of your position. If the stone is at the bottom of the sea, and I trade you a house for it, I am not trading a house for a commodity. I am trading a house for a reputation.

  **Arthur:** *[Leans forward, tapping the book]* But why that reputation? Why not a reputation based on a pile of sand? Because the sand is common. The stone is rare. The market selected the stone *before* it sank. The sinking event is a red herring. The value was locked in during the quarrying and transport. The ledger is just a receipt system for the commodity money. Friedman used this story to show that money doesn't need to be physically present to function, yes, but he didn't deny it was based on the asset. He was a monetarist, not a mystic.

  **Elena:** Friedman was an economist trying to explain why fiat currency works. He loved this story because it lets him say, "See, gold doesn't need to be in the vault either." But you, Arthur, you're a Mengerian. You believe money *must* originate as a commodity to be sound. This story destroys that. It shows that once the social agreement is in place, the commodity is disposable. If the stone had been crushed to dust, but the village elder announced, "The value remains," it would remain.

  **Arthur:** Would it? Test that. Tell the village the stone was crushed. Tell them the asset is zero. See how long the "social agreement" holds. It collapses. Why? Because the asset underpins the trust. The ledger is not autonomous. It is tethered to the reality of the stone, even the submerged one. The islanders aren't trading debt; they are trading shares in a specific, historical asset.

  **Elena:** They are trading shares in a *narrative* about an asset. There is a difference. If a diver found the stone tomorrow and it turned out to be fake—sandstone instead of aragonite—the value would vanish. Not because the physical properties changed, but because the *truth* of the record changed. Money is information, Arthur. The lost stone proves that the information is the currency, not the rock.

  **Arthur:** Information *about* the rock. You can't have the information without the referent.

  **Elena:** But the referent is inaccessible! It's a black box. The only thing that exists in the social sphere is the information. You're clinging to the ghost of the rock because you're afraid that if you admit money is just social credit, you admit it's political. And if it's political, it can be changed. It's not a natural law like gravity.

  **Arthur:** And you're clinging to the "political" because you want to believe we can just write new numbers and create wealth. But the Yap knew better. They knew the stone had to be hard to get. That friction is the value. The storm added friction. It made the stone *more* legendary, hence *more* saleable. It's still the commodity logic at work. Scarcity drives value.

  **Elena:** Scarcity is socially constructed. We decide what is scarce. We decided that stone from Palau is scarce. We decided that a stone at the bottom of the ocean still counts. If we decided tomorrow that only stones currently visible in the village square count, the sunken one would be worthless. The power lies with the deciders, not the stone.

  **Arthur:** The power lies with the traders who accept it. If the deciders say it's valuable but the traders don't, it's worthless. That's the market.

  **Elena:** On Yap, the traders and the deciders are the same people. It's a community. And they agreed to keep the dead stone alive. That is the definition of a credit system.

  **Arthur:** *[Sighs, closing the book]* They kept it alive because they believed the stone was still *there*. If they believed it was vaporized, the ledger would be void.

  **Elena:** *[Smiles softly]* Or perhaps they would have simply written off the loss as a bad debt, just as a bank does. Which proves my point. It's all banking, Arthur. There is no commodity money. There is only credit, and the things we use to pretend otherwise.

  **Arthur:** And I say it's all commodities, Elena. There is no credit that doesn't eventually demand payment in something real. Even if that something real is currently wet.

  **Elena:** Then I suppose we'll have to agree that the ocean is deep enough to hide the truth from both of us.

  **Arthur:** *[A dry chuckle]* Pass the sugar. I need to sweeten this ledger.

  **Elena:** *[Pushes the bowl]* On the house. Consider it a debt.

  **Arthur:** I'll record it.
