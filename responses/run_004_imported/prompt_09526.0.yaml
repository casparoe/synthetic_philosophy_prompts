answer: |-
  Your intuition is spot on. Your friend is describing a real emotional dilemma, but her philosophical conclusion—that uncertainty makes the choice **rationally undecidable**—is flawed.

  She is falling into a few specific logical and ethical traps. Here is where the holes in her reasoning are, which you can use to push back.

  ### 1. The "Consequentialist Trap"
  Her argument rests entirely on **Act Consequentialism**: the idea that the morality or rationality of a decision is determined *solely* by its future outcomes. She is arguing that because we cannot predict the outcomes 20 years out, we cannot judge the action now.

  **The Hole:** Most ethical frameworks do not require a crystal ball.
  *   **Deontology (Duty):** As a teacher, she has a duty to uphold the standards of her institution and the grading system. If a grade signifies mastery, and cheating bypasses mastery, reporting it upholds the truth of the transcript. That is a rational basis independent of the student's future feelings.
  *   **Virtue Ethics:** What kind of teacher does she want to be? One who protects students from consequences, or one who teaches accountability? The rationality lies in aligning the action with her professional identity, not in gambling on the future.
  *   **Justice:** There are 29 other students in that class who didn't cheat. If she handles this quietly, she has effectively devalued their honest work. She can rationally weigh the "harm to the cheater" against the "injustice to the honest students."

  **The Takeaway:** You don't need to know the future to know that fairness and integrity have value *in the present*.

  ### 2. The "Perfectionist Fallacy"
  She is arguing that because she cannot have **perfect knowledge** of the outcome, she has **no knowledge** relevant to the decision.

  **The Hole:** Rationality is not about certainty; it is about managing risk and probability.
  *   We can't know if punishing him will make him cynical, but we *do* know that not punishing him reinforces the behavior that cheating works.
  *   We can't know if reporting him will ruin his life, but we *do* know that allowing academic dishonesty to go unrecorded risks putting him in a college program where he might cheat again and face harsher penalties later (e.g., expulsion vs. a failed high school class).
  *   **Rational Decisiveness:** Making a decision based on available evidence and principles *is* rational. Throwing up your hands because the data isn't complete is actually an avoidance of rational decision-making.

  ### 3. The False Dichotomy
  She has framed this as: **Destroy his future** OR **Let it slide.**

  **The Hole:** There is almost always a middle ground, and ignoring it limits rational choice.
  *   Most schools have tiered disciplinary policies. She might be able to give him a zero on the final (preserving academic integrity) without filing a formal disciplinary report that goes to colleges (preserving his future).
  *   She might require him to redo the work for half credit.
  *   By framing it as "Report vs. Ignore," she creates a paradox where both options seem terrible. Expanding the option set makes the decision rationally decidable again based on which outcome best serves education.

  ### 4. The "Agent of the System" Problem
  She is viewing this as a personal interaction between her and the student. She is forgetting she is an agent of the school.

  **The Hole:** Ignoring the cheat exposes *her* and the *school* to liability and inconsistency.
  *   If another student finds out he cheated and got away with it, the school loses credibility.
  *   If he goes to college and cheats again, and it comes out that his high school knew and hid it, the school's reputation is damaged.
  *   **Rational Self-Interest:** From a purely pragmatic standpoint, following established protocol protects the teacher from accusations of favoritism later.

  ### 5. The Assumption of Harm
  She assumes that reporting the cheating is inherently harmful ("tank his college applications") and that hiding it is inherently helpful ("straightens him out").

  **The Hole:** This is speculative.
  *   Many colleges appreciate resilience and growth. A student who owns up to a mistake, serves a consequence, and improves can often explain that in an essay.
  *   Conversely, "saving" him might teach him that he is exempt from rules because he is "smart" or "a good kid," which is a dangerous lesson (the "gifted kid burnout" syndrome).
  *   Since both narratives (Punishment = Growth vs. Punishment = Trauma) are plausible, using them as the *sole* tiebreaker is irrational. You have to fall back on principle.

  ### How to phrase this to her
  You don't want to sound like you're telling her how to teach. Try framing it like this:

  > "I think you're right that we can't predict the future, but I think you're wrong that it makes the choice random. Rationality isn't about knowing the outcome; it's about knowing your principles.
  >
  > If you decide based *only* on his future feelings, you're ignoring the other 30 kids in the room who played by the rules. You also have to follow the school's contract. The rational choice isn't the one that guarantees his happiness in 20 years (which is impossible); it's the one that upholds the integrity of the classroom *today* while minimizing unnecessary destruction. That's not guesswork; that's weighing your duties."

  **Summary:** She is confusing **uncertainty of outcome** with **absence of criteria.** We may not know the future, but we do know the rules, the duties, and the immediate consequences. That is enough for a rational decision.
