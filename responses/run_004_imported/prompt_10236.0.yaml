      *Okay, Q5 (Self-Application):* If HOE says her arguments are flawed, she should believe "Level-Splitting is true" + "My evidence doesn't support Level-Splitting." That's the target.

      *Refining Q2 (Bootstrapping):* The worry is that if I can ignore HOE, I can claim I'm reliable because I keep believing P, and use that to ignore more HOE. This is the "bootstrapping" objection. I need to make sure the question articulates the *loop*.

      *Refining Q3 (Stubbornness):* The worry is that this view licenses ignoring peers. If a peer disagrees, that's HOE. If I can split levels, I can say "Peer disagrees (HOE), but my math says P (FOE), so I believe P and think my evidence is muddy." I need to press on whether this destroys the normative force of disagreement.

