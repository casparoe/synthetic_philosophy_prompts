      *   **Guest:** A philosopher defending the "Level-Splitting" view in epistemology (rational to believe $P$ while believing evidence doesn't support $P$).
      *   **Core Argument:** Defends epistemic akrasia against the standard objection that it's irrational. Uses cases like reasoning-impairing drugs or hypoxia (where object-level calculation seems right, but higher-order evidence suggests unreliability).
      *   **Goal:** 8-9 interview questions.
      *   **Requirements:**
          *   Each question needs a quick anticipated answer and a follow-up.
          *   Must move past restating the view.
          *   Specific topics required:
              1.  Bootstrapping worry (stringing together "lucky" calls to explain away unreliability).
              2.  Stubbornness in ordinary peer disagreements.
              3.  Self-application (what if higher-order evidence says *her* arguments are flawed?).
              4.  Closing: What counts as evidence against her view?
          *   Tone: Science-and-ideas podcast (intellectual, engaging, specific).

  2.  **Deconstruct the Philosophical Position (Level-Splitting):**
      *   *Standard View (Conciliationism/Total Evidence):* If you have strong evidence that you are unreliable (HOE), you should lower confidence in $P$, even if the first-order evidence (FOE) looks good. Believing $P$ while thinking you're unreliable is akratic/irrational.
      *   *Guest's View (Level-Splitting):* FOE can justify belief in $P$ even if HOE suggests you're unreliable. You can hold "P is true" and "My evidence doesn't support P" simultaneously without irrationality.
      *   *Key Tension:* Separating the normative force of FOE from HOE.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Core Intuition Pump.* Need to start strong but move past the basics. Let's focus on the *mechanism* of the split.
          *   *Draft:* Why is the drug case different from just being arrogant?
          *   *Refinement:* Focus on the "rational residue." If I believe I'm impaired, why does the calculation still bind me?
          *   *Anticipated Answer:* The calculation is objectively valid; the impairment is a risk, not a defeater.
          *   *Follow-up:* So is rationality about tracking truth or following rules?

      *   *Question 2: The Bootstrapping Worry (Required).* This is crucial. If I can ignore HOE, can I build a false track record?
