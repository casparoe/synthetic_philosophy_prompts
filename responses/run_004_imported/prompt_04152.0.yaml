  2.  **Deconstruct Williams's Internalism:**
      *   **Core Claim:** "A has a reason to $\phi$ only if A could reach the conclusion to $\phi$ by a sound deliberative route from the motivations already in A's *S*."
      *   **The *S* (Subjective Motivational Set):** Includes desires, projects, commitments, loyalties, dispositions. It's not just raw appetites.
      *   **Sound Deliberative Route:** Includes correcting factual errors, imagining consequences, considering consistency, etc.
      *   **The Vulnerability:** If an agent lacks *any* element in *S* that could link to the moral action, Internalism says they have no reason to do it. This leads to the "monster" objection (e.g., a psychopath who cares about nothing but pain has no reason not to torture).
      *   **Williams's Defense:** He often argues that if someone *truly* has no link in *S*, we might just say they are outside the realm of reason-giving, or that almost everyone *does* have some link (e.g., self-interest, social standing) if we dig deep enough.

