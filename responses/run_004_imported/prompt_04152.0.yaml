      *   *Internalist:* Can a "sound deliberative route" bridge the gap between "I care about buildings" and "I should care about feelings I cannot conceive"? Williams says imagination can correct *S*. But what if the capacity is biologically absent?
      *   *Externalist:* The patients' suffering gives her a reason, regardless of her capacity to empathize.

      *   *Let's refine this one. It feels fresh.* It moves away from "evil" to "incapacity." It tests the limit of "Sound Deliberative Route."
      *   *Name:* **The "Qualia-Blind Engineer."**
