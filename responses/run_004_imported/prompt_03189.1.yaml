prompt: |-
  Okay so I need someone to settle an argument because me and my friend Jae have been going back and forth about this for like two days now and neither of us will budge. We're both in a discrete math class this semester, and a couple weeks ago I told our study group they could come to me with any question since I'd basically proved every theorem in the textbook and knew the axioms backwards and forwards. Then last week someone brought a proof question that, as Jae keeps pointing out, technically only required combining two things I already knew cold — a lemma about equivalence classes and a pretty basic pigeonhole argument. Except the combination wasn't obvious AT ALL, it took me almost an hour of scribbling before it clicked, and honestly I only got there because I got kinda lucky with which approach I tried first.

  Jae's whole argument is that since the proof follows logically from stuff I already knew, I basically already knew the proof the entire time, I just hadn't "looked it up" in my own head yet, like it was sitting there in storage the whole time waiting for me. I think this is nuts, because if you follow that logic all the way, then anyone who knows Peano's axioms already "knows" every true statement of number theory including stuff that hasn't even been proven yet, and we'd have to say Andrew Wiles didn't actually discover anything when he proved Fermat's Last Theorem, he just finally remembered something he already knew somewhere in his head. That seems obviously wrong to me but I could not for the life of me explain WHY its wrong in a way that actually landed, and Jae just kept saying I was being defensive because I didn't want to admit I "didn't really know" the material as well as I thought I did. Is there an actual principled difference between knowing the stuff a proof is built out of and knowing the proof itself, or is Jae onto something here and I'm just protecting my ego?
