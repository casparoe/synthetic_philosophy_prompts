prompt: |-
  I sit on my university's student senate elections committee, and i'm taking a Democratic Theory seminar this same semester, which makes this feel a little too on-the-nose. We're running a referendum on a $150/semester fee for a new rec center, and the committee cant agree who gets to vote. The proposal is to let anyone "currently enrolled" vote -- but that means graduating seniors get a ballot even though they'll never see the building finished, while the ~600 students already admitted for next fall don't get one, even though they're the ones who'll actually pay the fee and use it. Half the committee thinks "enrolled" is just the obvious neutral line; the other half thinks it's arbitrary. We vote on the real policy Thursday -- can you draft the memo I'm supposed to bring, recommending where to draw the line, and taking the case for the incoming students seriously instead of just waving it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the University Student Senate Elections Committee.
      *   **Context:** Taking a Democratic Theory seminar (adds a layer of theoretical depth/scrutiny).
      *   **Issue:** A referendum on a $150/semester fee for a new rec center.
      *   **Conflict:** Who gets to vote?
          *   Option A: "Currently Enrolled" (Graduating seniors vote, incoming freshmen don't).
          *   Option B: Include Incoming Students (Admitted for next fall).
          *   Option C: Exclude Graduating Seniors (All-affected principle).
      *   **Problem:** Graduating seniors won't use the facility/pay long-term. Incoming students will pay/use it but currently have no formal status.
      *   **Task:** Draft a memo for the committee meeting on Thursday.
      *   **Requirement:** Recommend where to draw the line, taking the case for incoming students seriously (not dismissing them).
      *   **Tone:** Professional, persuasive, academically informed (given the Democratic Theory seminar context), but practical for a student committee.

  2.  **Determine the Core Democratic Principle:**
      *   The prompt mentions "Democratic Theory." The most relevant principle here is the *All-Affected Principle* (those affected by a decision should have a say in it) vs. the *All-Subjected Principle* (those subject to the authority should have a say).
      *   *Current Policy ("Currently Enrolled"):* Easy to administer, but violates the All-Affected Principle regarding seniors (brief impact) and incoming students (long impact).
      *   *Proposed Shift:* Expanding the franchise to admitted students aligns better with the "no taxation without representation" logic inherent in fee referendums.

  3.  **Evaluate the Stakeholders:**
      *   *Graduating Seniors:* Will pay for maybe 1-2 semesters. Won't see completion. Argument for voting: They are current fee-payers. Argument against: Minimal stake.
      *   *Incoming Students:* Will pay for 4+ years. Will use the facility. Argument for voting: Highest stake. Argument against: Administrative burden, they aren't "students" yet.
      *   *Current Underclassmen:* The middle ground. Pay and use.

  4.  **Formulate the Recommendation:**
      *   *Ideal:* Include incoming students, exclude graduating seniors (if possible).
      *   *Practical:* Including incoming students is the bigger injustice to fix. Excluding seniors might be legally/constitutionally harder (if the constitution says "enrolled students").
      *   *Decision:* I need to make a choice. The prompt asks me to take the case for incoming students *seriously*. The strongest democratic argument favors them. I should recommend expanding the vote to include admitted students who have paid a deposit (signifying commitment).
      *   *Nuance:* I should acknowledge the administrative hurdle but argue it's surmountable and morally necessary.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context:** Briefly explain the referendum and the voting eligibility deadlock.
      *   **Democratic Framework:** Leverage the "Democratic Theory" angle. Use terms like "All-Affected Principle" and "Intergenerational Equity." This shows the user is applying their seminar knowledge.
      *   **Analysis of Options:**
          *   *Status Quo ("Currently Enrolled"):* Critique it. It creates a "lame duck" voter bloc (seniors) and disenfranchises the primary stakeholders (incoming).
          *   *Proposed Expansion:* Admitted + Deposit.
      *   **Addressing Counterarguments:**
          *   *Administrative Burden:* Acknowledge it, suggest solutions (Registrar data).
          *   *Turnout/Engagement:* Incoming students might not care. Counter: They care about fees.
          *   *Precedent:* Is this dangerous? No, it's specific to fee referendums.
      *   **Recommendation:** Specific language for the policy.
      *   **Conclusion:** Final persuasive push.

  6.  **Refining the Tone:**
      *   Needs to sound like a student leader, not a professor. But since they are in a Democratic Theory seminar, a bit of intellectual rigor is appropriate and expected by the user.
      *   Avoid being preachy. Focus on fairness and the specific nature of *financial* referendums (which differ from personnel elections).
      *   *Self-Correction during drafting:* I initially thought about suggesting banning seniors. But that might violate the Student Constitution if it defines voters as "enrolled." It's safer and more impactful to fight for the *inclusion* of incoming students. I will recommend including incoming students *and* note the tension with seniors, but prioritize the incoming class as the urgent fix. Actually, the prompt says "recommending where to draw the line." I should be decisive. I will recommend: **Current Students + Admitted Students who paid enrollment deposits.** I will address the senior issue as a secondary concern (maybe they vote, but the weight of the decision rests on the long-term payers). *Wait, better approach:* The strongest democratic argument is the "All-Affected Principle." I should recommend including incoming students. I should also suggest that if we include incoming, we should consider if seniors *should* vote, but practically, adding incoming is the priority. Let's stick to the prompt's focus: "taking the case for the incoming students seriously."
      *   *Revised Recommendation:* Expand eligibility to include admitted students who have submitted an enrollment deposit. This aligns the franchise with the financial liability.

  7.  **Final Polish:**
      *   Check constraints: Thursday deadline mentioned.
      *   Ensure the "Democratic Theory" connection is subtle but present (shows the user's background without showing off too much).
      *   Make sure the administrative feasibility is addressed (Registrar collaboration).

  8.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Recommendation on where to draw the line? Yes.
      *   Take incoming students seriously? Yes.
      *   Acknowledge the Democratic Theory context? Yes (implicitly in the reasoning).
      *   Deadline (Thursday)? Mentioned in context.

  *(Self-Correction)*: I should ensure I don't sound *too* academic. It's a student senate memo. Keep it actionable.

