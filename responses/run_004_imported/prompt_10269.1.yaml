answer: |-
  **MEMORANDUM**

  **TO:** Student Senate Elections Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Voter Eligibility for Rec Center Fee Referendum

  **Executive Summary**
  This Thursday, the Committee must finalize voter eligibility for the proposed $150/semester Rec Center fee referendum. The current draft limits voting to students "currently enrolled." This memo recommends expanding eligibility to include **incoming first-year and transfer students who have been admitted and have submitted an enrollment deposit for the upcoming fall semester.**

  While the "currently enrolled" standard is administratively convenient, it fails the democratic test for a *financial* referendum. It grants disproportionate power to graduating seniors (who will pay the fee for at most one semester and will not use the facility) while disenfranchising incoming students (who will pay the fee for four years and are the primary beneficiaries). To ensure legitimacy and intergenerational equity, the franchise must align with financial liability.

  **Context and The Democratic Stakes**
  We are not electing a representative; we are levying a tax. In democratic theory, this distinction matters. Elections rely on the *All-Subjected Principle* (who is under the authority?), but fee referendums rely on the *All-Affected Principle* (who bears the cost and benefit?).

  Under the proposed "currently enrolled" language:
  1.  **Graduating Seniors:** Approximately [Insert Number, e.g., 1,200] seniors can vote. They will pay the fee for perhaps one remaining semester ($150 total) and will likely graduate before the Rec Center opens.
  2.  **Incoming Students:** Approximately 600 admitted students are excluded. They will pay the fee for 8+ semesters ($1,200+ total) and will use the facility for the duration of their enrollment.

  Currently, a senior's vote costs them $150 but carries the same weight as an incoming student whose vote costs them $1,200. This is a clear representation imbalance.

  **Analysis of Options**

  **Option 1: Status Quo ("Currently Enrolled")**
  *   *Pros:* Clear data from the Registrar; easy to implement; follows past precedent.
  *   *Cons:* Violates the principle of "no taxation without representation" for incoming students. It allows a "lame duck" electorate to decide long-term financial commitments for a population that cannot vote. This invites challenges to the referendum's legitimacy from the very class that will fund the building.

  **Option 2: Expand to Admitted Students (Recommended)**
  *   *Pros:* Aligns voting power with financial stake. Incoming students have made a contractual commitment to the university (via deposit); they are stakeholders in all but formal registration. This increases the perceived fairness of the vote.
  *   *Cons:* Requires coordination with Admissions/Registrar to generate a voter roll based on deposits rather than course registration. Requires a communication plan to ensure incoming students know they can vote.

  **Addressing Counterarguments**

  *   **"They aren't students yet."**
      *   *Rebuttal:* For the purposes of a financial fee, "student status" is defined by liability. Once a deposit is paid, they are financially bound to the university. We already treat them as students for orientation, housing assignments, and email access. Voting on a fee that impacts their enrollment is a logical extension of this.
  *   **"Administrative Burden."**
      *   *Rebuttal:* The Registrar can generate a list of admitted students with deposits by [Date]. The Elections Committee can upload this list to our voting platform just as we do with current enrollment data. The marginal cost is low compared to the risk of a contested referendum.
  *   **"Precedent."**
      *   *Rebuttal:* This sets a precedent only for *fee referendums*, not personnel elections. We can codify this as a specific exception for capital campaign fees where long-term liability is the primary variable.

  **Regarding Graduating Seniors**
  Ideally, the *All-Affected Principle* would suggest excluding seniors who will not see the project completed. However, changing the Constitution to *remove* voting rights is legally fraught and may face backlash. My recommendation is not to disenfranchise seniors, but to **counterbalance** their vote by enfranchising the incoming class. If we must choose between an imperfect electorate that includes seniors or one that excludes incoming students, we must choose the latter. Excluding incoming students is a greater democratic deficit than including seniors.

  **Recommendation**
  I move that the Committee adopt the following eligibility language for this referendum:

  > *"Eligible voters include all undergraduate students currently enrolled in courses for the current semester, AND all admitted first-year and transfer students for the upcoming fall semester who have submitted a non-refundable enrollment deposit by [Date]."*

  **Next Steps**
  1.  **Vote:** Committee vote on this language change at Thursday's meeting.
  2.  **Data:** If passed, I will liaise with the Registrar and Admissions to secure the voter roll by [Date].
  3.  **Outreach:** We must ensure incoming students receive ballot information during orientation week and via their university email addresses.

  **Conclusion**
  We are asking students to invest $150 per semester into a building they will inhabit for years. It undermines the integrity of the Senate if the people who will inhabit that building the longest are the only ones barred from the decision. By including incoming students, we acknowledge that democratic legitimacy isn't just about who is here today, but who will be here tomorrow.

  I look forward to discussing this on Thursday.
