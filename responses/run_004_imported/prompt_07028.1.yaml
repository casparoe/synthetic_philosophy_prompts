      *   **The Simplicity Prior Problem:** What is "simple"? Kolmogorov complexity is uncomputable. In practice, we use parametric models (neural nets, etc.). A "simple" reward might just mean "low parameter count," but human values might be high-dimensional and context-dependent.
      *   **Goodhart's Law/Specification Gaming:** If the model finds a shortcut to predict behavior without capturing the underlying intent, it will take it.
      *   **Distributional Shift:** Data collected in one context might not reveal preferences in another.

  4.  **Empirical Evidence & Literature:**
