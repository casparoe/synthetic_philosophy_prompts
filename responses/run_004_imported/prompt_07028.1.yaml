      *   There is no single number (e.g., "10,000 hours") because it depends on the complexity of the human, the environment, the expressiveness of the model class, and the definition of "true preferences."
      *   The question asks for a "rough" estimate, but giving a specific number would be misleading. The answer needs to explain *why* it's hard to quantify and what factors dominate the data requirement.

