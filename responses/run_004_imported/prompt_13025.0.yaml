          *   *Analogy:* Use the "island" or "universe" analogy. If you live on an island, "everyone" means everyone on the island. If someone says "There is no king," they mean no king on the island. You (outside) know there's a king in England, but that doesn't make the islander's statement false *relative to their context*.
