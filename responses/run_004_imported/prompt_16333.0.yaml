      *(Self-Correction during drafting)*: I need to be careful not to validate RPM/S2C as evidence-based. The recommendation must be that we *test* it, not that we *accept* it. The funding for the aide can be framed as "data collection for authorship verification" rather than "instructional support for communication." This is a crucial legal distinction.

      *(Refining the Davidson point)*: I will explicitly mention the "hermeneutic circle" or the problem of interpretation to honor the user's specific intellectual prompt. It makes the memo unique to their thought process.

  9.  **Final Polish:** Check for empathy. Ensure the parents don't feel attacked, but the district doesn't feel liable.

  **(Post-Drafting Thought):** I need to add a note to the user about the personal conflict of interest regarding their friend. It's ethically significant for a school psych. I'll add a brief note at the end outside the memo text.

