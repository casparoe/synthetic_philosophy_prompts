answer: |-
  **MEMORANDUM**

  **TO:** District AAC Review Committee
  **FROM:** [Your Name], School Psychologist
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding AAC Funding and Authorship Verification for Student [ID]

  **Purpose**
  This memo addresses the pending request to fund a 1:1 aide trained in letterboard/spelling methods (specifically Rapid Prompting Method/Spelling to Communicate) for Student [ID], and the accompanying request to treat the output generated via this method as the student's independent communication for IEP goal-setting and placement decisions.

  After reviewing the clinical data, parent testimony, and current literature regarding facilitated communication methods, I am recommending a **Conditional Middle Path**. We should continue funding the support personnel *strictly for the purpose of verifying independent authorship*, but we cannot currently adopt the output as the student's authoritative voice for high-stakes educational decisions until independent validation is achieved.

  **The Ethical and Epistemological Conflict**
  This case presents a profound conflict between two ethical imperatives: the presumption of competence and the obligation to evidence-based practice. To make a sound decision, we must engage the strongest version of both arguments, acknowledging that a simple dismissal of either side risks harming the student.

  *1. The Argument for Presuming Competence (The Parents' Position)*
  The parents' position rests on a vital ethical foundation: the "danger of doubt." For a nonverbal student with significant motor and regulatory challenges, behavioral output is often an unreliable metric of cognitive capacity. If we require standard validation before believing a child can communicate, we may be silencing a competent mind that simply lacks motor reliability.
  There is a phenomenological truth here that we cannot ignore: when the board is used, coherent, age-appropriate, and emotionally resonant language emerges. To dismiss this solely because it contradicts prior behavioral assessments risks a self-fulfilling prophecy where we deny the child the very tools that might unlock their potential. If the output *is* the student's, denying it is a civil rights violation.

  *2. The Argument for Message Validity (The SLP/Clinical Position)*
  The clinical opposition rests on the "danger of false attribution." Decades of controlled studies on Facilitated Communication (FC) and related methods demonstrate that when facilitators and students are shown different information (message passing), the output consistently matches the facilitator's knowledge, not the student's.
  This is not merely a methodological dispute; it is an educational one. If the output is driven by the facilitator (even unconsciously), then basing IEP goals on that output is educational malpractice. We would be teaching to the adult, not the child. Furthermore, if we validate this output without proof, we risk depriving the student of other AAC methods (e.g., eye-gaze, direct select) that might actually be accessible to them, because we assume the letterboard is the "key."

  **The Philosophical Constraint: The Hermeneutic Circle**
  As a psychologist, I am compelled to note that this impasse mirrors a classic problem in the philosophy of language (specifically Davidson's Radical Interpretation). We interpret behavior as meaningful by assuming the speaker is rational (the Principle of Charity). However, when a facilitator is physically supporting the communication, we enter a hermeneutic circle: the output looks coherent because we assume the child is coherent, but we only assume the child is coherent because the output looks coherent.
  There is no "neutral spot" to stand and verify this from the inside of the interaction. The coherence of the sentences proves nothing about *authorship* because the facilitator is also a rational agent capable of producing that coherence. We cannot solve this interpretive loop with more interpretation; we can only solve it with structural isolation.

  **Recommendation: A Protocol for Independent Authorship**
  We cannot ethically treat the output as the student's voice *until* we break the hermeneutic circle described above. However, we also cannot ethically withdraw support if there is a plausible chance this is the student's only voice.

  Therefore, I recommend the following:

  1.  **Continued Funding (Provisional):** The district will fund the 1:1 aide for a period of six months. However, the job description for this period shifts from "communication support" to "authorship verification."
  2.  **Suspension of High-Stakes Usage:** The output generated during this period cannot be used to determine class placement, grade-level academic goals, or medical decisions. It may be used for low-stakes social engagement and rapport building.
  3.  **Mandatory Message Passing:** The SLP and an external evaluator (untrained in RPM/S2C) will conduct weekly blinded trials. The student and facilitator must be shown different images or given different information. The student must be able to describe what *they* saw, not what the facilitator saw, without physical prompting.
  4.  **Decision Point:**
      *   **If the student passes:** We immediately recognize the output as authoritative, integrate it into the IEP, and pursue full funding for the method.
      *   **If the student does not pass:** We must conclude that the method is not a valid measure of the student's voice. We will then pivot resources toward AAC methods with established independent validity (e.g., high-tech SGD with eye-gaze), framing this not as a loss of voice, but as a search for a more reliable one.

  **Conclusion**
  This recommendation acknowledges that doubt is not disbelief. By demanding verification, we are not saying the student *cannot* speak; we are saying we owe it to the student to know *who* is speaking before we build their education on it. This protects the district from liability, but more importantly, it protects the student from the tragedy of having an adult's voice mistaken for their own, while leaving the door open for the miraculous possibility that they truly are spelling out those paragraphs.

  **Next Steps**
  I request the committee's approval to draft the verification protocol with the SLP and present it to the parents as a collaborative pathway to validation, rather than a barrier to access.

  ***

  **A Private Note for You (The User):**

  I drafted this to be professionally airtight while honoring the philosophical depth you brought to the prompt. However, I need to flag something critical regarding your personal situation:

  **Conflict of Interest:** You mentioned your best friend's son uses a similar method and that you have strong personal feelings ("doesn't have the stomach to just call it debunked"). In many districts, **you may need to recuse yourself** from this specific vote or decision. Your personal investment compromises the objectivity required of a school psychologist, even if you feel you can be fair.

  If you cannot recuse yourself, the memo above is written to be objective enough to stand on its own. But please check your district's ethics guidelines regarding personal relationships affecting committee decisions. The "Conditional Middle Path" is the safest ethical ground, but your personal stake is a variable the memo doesn't (and shouldn't) show.
