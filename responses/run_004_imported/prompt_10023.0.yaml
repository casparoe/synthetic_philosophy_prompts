          *   *Volition:* Action is voluntary (mostly); Belief is often involuntary (doxastic involuntarism). You can't just *choose* to stop believing the sky is blue.
          *   *The "Force":* In practical akrasia, it's desire/emotion. In epistemic akrasia, it's the *persuasiveness of the evidence* itself. The "craving" is the cognitive seeming that $P$ is true.
