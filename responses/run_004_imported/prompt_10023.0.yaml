          *   *Mechanism:* Desire/Passion vs. Reason.
          *   *Example:* Eating chips vs. Health goal.
          *   *Irrationality:* Clear conflict between intention and action.
      *   **Epistemic Akrasia:** Believing $P$ while believing that believing $P$ is unjustified/irrational.
