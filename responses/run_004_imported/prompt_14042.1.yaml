answer: |-
  **MEMORANDUM**

  **TO:** Student Government Elections Commission
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for Presidential Election Bylaw Reform

  **Purpose**

  As we prepare to rewrite the bylaws ahead of the March election, our primary objective is clear: eliminate the "spoiler effect" where a third candidate splits the vote, resulting in a winner who lacks broad support. We have several strong proposals on the table: Ranked-Choice Voting (RCV), Borda Count, Top-Two Runoff, and Approval Voting.

  I am writing this memo to synthesize our recent discussions with the constraints of social choice theory and to offer a concrete recommendation for Thursday's meeting.

  **The Mathematical Reality: Gibbard-Satterthwaite**

  Many of us are operating under the hope that one of these systems will eliminate strategic voting entirely. I want to briefly address the Gibbard-Satterthwaite theorem, which we recently covered in Social Choice Theory, to ground our expectations.

  The theorem demonstrates that for any ranked voting system with three or more candidates, no method is perfectly "strategy-proof." In plain English: there is no mathematical magic wand. In every system, there are scenarios where a voter might benefit from voting insincerely.

  **A Note on Approval Voting**
  One commission member noted that Approval Voting "doesn't count" under Gibbard-Satterthwaite because it uses cardinal ratings (approve/disapprove) rather than ordinal rankings. Technically, this is a distinction without a difference for our purposes. While Approval Voting escapes the specific constraints of the *ranked* version of the theorem, it is still subject to Gibbard's broader theorem on strategy-proofness. Voters still face strategic dilemmas (e.g., whether to "bullet vote" for only one candidate or approve of a less-preferred candidate to block a worst-case scenario). It is a viable system, but it is not immune to manipulation.

  **Evaluating the Options**

  Acknowledging that no system is perfect does not mean all systems are equal. Some are far more resistant to the specific problems we are facing.

  1.  **Borda Count:** While mathematically elegant, Borda is highly susceptible to "burying" strategies, where voters rank a strong opponent last regardless of their true opinion to lower their score. For a polarized student body, this encourages negative campaigning.
  2.  **Top-Two Runoff:** This solves the vote-splitting issue effectively but imposes a significant logistical burden (holding two separate elections) or requires a complex single-day setup that mimics RCV.
  3.  **Approval Voting:** A strong contender, but potentially confusing for the student body to adopt quickly. It requires voters to make a binary decision on every candidate, which can be cognitively demanding in a low-information student election.
  4.  **Ranked-Choice Voting (RCV):** This system directly addresses our primary pain point: the spoiler effect. It allows students to vote for their genuine first choice without fear of wasting their vote, knowing their vote transfers if that candidate is eliminated.

  **Recommendation: Ranked-Choice Voting (Instant Runoff)**

  **I recommend we adopt Ranked-Choice Voting for the March Presidential Election.**

  While G-S tells us RCV cannot *eliminate* all strategic voting, it significantly *reduces* the incentive for the specific type of strategic voting plaguing our current system (lesser-of-two-evils voting).

  **Why RCV is the right choice for us:**
  *   **Solves the Spoiler Effect:** It neutralizes the "vote splitter" problem. If a third candidate enters the race, they do not automatically hand the election to the candidate the majority opposes.
  *   **Promotes Civil Campaigning:** Candidates have an incentive to seek second-choice rankings from their opponents' supporters, discouraging negative campaigning.
  *   **Majority Mandate:** The winner must reach 50% + 1 of the active ballots, ensuring the President has broad support.
  *   **Feasibility:** It can be conducted in a single election cycle, unlike a traditional runoff.

  **Addressing the RCV Optimists**
  To my colleagues advocating for RCV: Your optimism is well-founded, even if the theorem suggests caution. G-S proves that *some* manipulation is possible, not that all systems are *equally* vulnerable. RCV raises the bar for strategic voting; it requires complex knowledge of the electorate to game effectively, whereas Plurality forces strategy on every single voter. In practice, RCV creates an environment where sincere voting is the safest strategy for the vast majority of students.

  **Next Steps**

  For Thursday's meeting, I propose we draft the bylaw language for an RCV implementation. We should also plan a brief voter education campaign, as explaining "transferable votes" will be key to student confidence in the results.

  Let's choose the system that best reflects the will of the student body, even if it isn't mathematically utopian.

  See you Thursday.
