prompt: |-
  So I'm on my school's student government elections commision, and we're rewriting the bylaws for how we elect student body president before the March election. Right now it's straight plurality, and pretty much every year a third candidate splits the vote so the person most people would've preferred head-to-head doesn't win. Half the commission wants ranked-choice voting because they're convinced it 'solves' strategic voting for good, one guy's pushing Borda count as 'more mathematically fair,' and a few people just want a plain top-two runoff instead. We literally just covered the Gibbard-Satterthwaite theorem in my social choice theory class, so it's bugging me that everyone talks like some option out there has zero manipulation problems -- someone even said approval voting 'doesn't count' under the theorem since you're not ranking candidates, and i can't tell if that's a real loophole or people missing the point. Can u draft the memo i'm supposed to send before thursdays meeting? I need one actual recommendation, not a shrug of 'no system's perfect,' and it has to take the ranked-choice people's optimism seriously instead of just clobbering them with the theorem.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Student Government Elections Commission.
      *   **Task:** Draft a memo to the commission before Thursday's meeting regarding the rewriting of election bylaws for the Student Body President.
      *   **Context:** Current system is Plurality (First-Past-The-Post). Problem: Vote-splitting/spoiler effect (3rd candidate causes unpopular winner).
      *   **Proposed Alternatives:**
          *   Ranked-Choice Voting (RCV/Instant Runoff).
          *   Borda Count.
          *   Top-Two Runoff.
          *   Approval Voting (mentioned in the context of Gibbard-Satterthwaite).
      *   **User's Knowledge:** Just covered Gibbard-Satterthwaite (G-S) theorem in social choice theory class. Knows no system is strategy-proof (with caveats).
      *   **Conflict:** Commission members believe their preferred system "solves" strategic voting. One claims Approval Voting bypasses G-S.
      *   **Requirements:**
          *   Must make *one actual recommendation* (no "all are flawed" shrug).
          *   Must take RCV advocates' optimism seriously (don't just crush them with G-S).
          *   Must address the G-S theorem accurately (including the Approval Voting claim).
          *   Tone: Professional, persuasive, informed, collaborative but firm on the math.
          *   Deadline: Before Thursday's meeting.

  2.  **Deconstruct the Social Choice Theory:**
      *   **Gibbard-Satterthwaite Theorem:** States that for any ranked voting system with 3+ candidates, there is no method that is non-dictatorial, always produces a winner, and is strategy-proof (truthful voting is always the best strategy).
      *   **Approval Voting:** G-S applies to *ordinal* (ranking) systems. Approval is *cardinal* (binary rating). So, technically, G-S doesn't directly apply. *However*, Approval has its own strategic issues (where to set the approval threshold). It's not a magic bullet, but the user's classmate has a technical point, even if the practical implication is overstated.
      *   **RCV (IRV):** Reduces spoiler effect compared to plurality. Encourages sincere first choices. *But* susceptible to "center squeeze" and some strategic ranking (burying).
      *   **Borda Count:** Highly susceptible to strategic ordering (burying strong opponents at the bottom). Generally considered poor for political elections, better for consensus building in small groups.
      *   **Top-Two Runoff:** Solves vote-splitting in the first round, ensures majority winner. Costly/time-consuming (two elections) unless done instantly (which becomes RCV-ish).
      *   **Recommendation Strategy:** The user needs to pick one. RCV is the standard reform for the "spoiler effect" problem in student gov. It balances mathematical robustness with voter familiarity and addresses the specific pain point (vote splitting) without being as vulnerable to strategy as Borda. Approval is a strong contender theoretically but might be a hard sell culturally. Top-Two is logistically hard.
      *   *Decision:* Recommend **Ranked-Choice Voting (RCV)**. Why? It directly addresses the stated problem (vote splitting/3rd party spoiler) which is the commission's main pain point. It's implementable. It's better than Plurality. Acknowledge G-S limitations but frame them as "manageable trade-offs" rather than "dealbreakers."

  3.  **Address the Specific Arguments:**
      *   **RCV Optimism:** Validate that it *does* reduce the specific strategic pressure of "wasting a vote" on a third candidate. Don't say it's perfect, say it's *better* for the specific problem we have.
      *   **Borda:** Gently explain why it's risky (strategic burying).
      *   **Top-Two:** Logistical burden.
      *   **Approval/G-S:** Clarify the theorem. G-S applies to ordinal rankings. Approval is cardinal, so it escapes the *strict* definition, but introduces "threshold strategy." Don't let the classmate claim it's immune to *all* manipulation.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the goal (fairer elections) and the urgency.
      *   **The Mathematical Reality (G-S):** Briefly explain the theorem without being pedantic. Acknowledge the classmate's point on Approval but contextualize it.
      *   **Evaluating Options:**
          *   Plurality (Current): Status quo is broken.
          *   Borda: High strategy risk.
          *   Top-Two: Logistical hassle.
          *   Approval: Interesting, but maybe too new/strategic threshold issues.
          *   RCV: Best balance.
      *   **Recommendation:** RCV.
      *   **Closing:** Call to action for Thursday.

  5.  **Refining the Tone:**
      *   Avoid: "Actually, you're all wrong because of math."
      *   Aim for: "The math gives us guardrails, not a single answer. Here's how we navigate them."
      *   Ensure the G-S explanation is accurate: It proves *some* manipulation is possible, not that *all* systems are equally manipulable. RCV reduces the *incentive* for the specific type of manipulation hurting us now (vote splitting).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Approval Voting loophole claim?
      *   *Correction:* Yes, need to specify that G-S is for ordinal systems, so Approval technically bypasses the *theorem*, but not the *problem* of strategy.
      *   *Check:* Is the recommendation clear?
      *   *Correction:* Make sure the "Recommendation" section is bold and unambiguous.
      *   *Check:* Is it respectful to the RCV advocates?
      *   *Correction:* Frame RCV as the practical solution to the *specific* spoiler problem, validating their intuition while grounding it in the broader theory.

  7.  **Final Polish:** Check length and clarity. Ensure it sounds like a student leader talking to peers, not a professor lecturing. (Make sure to mention the March deadline).

  *(Self-Correction on the G-S/Approval nuance)*: I need to be careful. Gibbard's theorem (1973) actually generalizes to cardinal systems too, though Satterthwaite's (1975) was ordinal. The general "Gibbard-Satterthwaite" label usually refers to the ordinal ranking context in undergrad classes. A more precise statement is that *any* deterministic voting system is manipulable. Approval voting *is* manipulable (you might not vote for your true favorite if they have no chance, to stop your least favorite). So the classmate is technically wrong that it "doesn't count." I need to correct this gently. *Wait, let me double check.* Gibbard's 1978 paper "Strategy Proofness and Single Peakedness" deals with more general mechanisms. But the standard undergrad takeaway is: G-S applies to ranked systems. Approval is often cited as escaping G-S *strictures* because it's not a ranking, but it falls under Gibbard's broader theorem on strategy-proofness. Okay, the nuance is: The classmate is half-right (it's not a ranking) but wrong on the conclusion (it's still manipulable). I will phrase it as "technically distinct but practically similar."

  *Actually, for the purpose of a student memo:* Keep it simple. G-S says no ranked system is perfect. Approval isn't ranked, so the specific theorem doesn't ban it, but strategic voting still exists (bullet voting, threshold setting). Don't get bogged down in 1978 vs 1975 papers. Focus on the practical outcome.

  *Decision:* I will recommend RCV. It's the standard antidote to the "spoiler effect" described. It's easier to explain to the student body than Approval.

  8.  **Finalizing the Memo Content:**
