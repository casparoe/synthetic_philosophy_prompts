answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-CS-44 and Future Guidelines on "Substantial Similarity"

  **I. Purpose**

  This memo provides my recommendation regarding the alleged academic integrity violation involving two Introduction to Computer Science students (Case #2023-CS-44), whose submissions were flagged at 42% similarity. Additionally, I propose a revised procedural framework for evaluating future cases involving the vague predicate "substantially similar."

  **II. Recommendation on Case #2023-CS-44**

  **I recommend a finding of *Not Responsible*.**

  While a 42% similarity score is significant, it falls squarely within the "borderline region" of our current policy. The policy prohibits work that is "substantially similar" without disclosed collaboration, but it does not define "substantial." In introductory CS courses, similarity scores are inflated by provided boilerplate code, mandatory function structures, and limited logical pathways for solving basic problems.

  Without qualitative evidence of collusion (e.g., identical variable naming conventions, unique comments, or identical non-functional errors), a percentage alone cannot sustain a violation finding in a borderline range. When a policy term is inherently vague, and the consequences involve disciplinary records, the benefit of the doubt must reside with the accused. We cannot retroactively assign a precise boundary to a vague term to punish past conduct that lacked fair notice.

  **III. Proposed Procedural Framework**

  To prevent recurring deadlock, the Board must stop treating "substantial similarity" as a hidden fact waiting to be discovered and start treating it as a standard we must construct. I propose we adopt a **Three-Tier Precissification Guideline**:

  1.  **Safe Harbor (<30% Similarity):** Presumptively *Not Responsible*. Cases in this range should not be pursued unless there is overwhelming qualitative evidence of collusion.
  2.  **Review Zone (30% – 60% Similarity):** No presumption. A violation requires *corroborating qualitative evidence* (e.g., identical logic errors, specific variable names, metadata showing file sharing). The percentage alone is insufficient.
  3.  **Presumptive Violation (>60% Similarity):** Presumptively *Responsible*. The burden shifts to the student to demonstrate independent derivation.

  **IV. Rationale: Rejecting the "Hidden Fact" Fallacy**

  Half of this Board has argued that we should mine past rulings to triangulate the "true" cutoff point for substantial similarity. This approach assumes there is a fact of the matter about where "substantial" begins, and that previous Boards merely failed to measure it accurately.

  This is incorrect. There is no metaphysical fact about whether 41% is "substantial" and 42% is not. Previous cases were decided based on the specific contexts of those times, not by measuring against a hidden universal standard. Attempting to derive a bright line from inconsistent precedents creates **false precision**. It suggests an objectivity that does not exist, leading to arbitrary outcomes disguised as discovery. We cannot find a line that was never drawn.

  **V. Addressing the Strongest Objection**

  I anticipate the primary objection to this proposal will come from the faction that favors stipulating a hard threshold (e.g., "Anything over 40% is a violation"). Within that group, a valid critique has already been raised: *Stipulating a threshold does not resolve disagreement; it merely relocates it.* If we cannot agree on what "substantially similar" means, how can we agree on a specific number like 40%? If the Board is split on the concept, we will remain split on the stipulation.

  This objection is strong, but it misses the strategic value of **explicit stipulation versus implicit confusion.**

  1.  **Moving the Fight to the Right Arena:** It is true that we may disagree on whether the threshold should be 40% or 50%. However, fighting over a number in a policy meeting is preferable to fighting over "intuition" in every individual student hearing. A policy debate allows for data, faculty input, and student representation to determine a fair standard *prospectively*. Case-by-case intuition fights happen in private, without precedent, and directly impact student records.
  2.  **Acknowledging the Penumbra:** The Three-Tier system I propose admits that disagreement exists. By creating a "Review Zone" (30-60%), we acknowledge that there is a region where reasonable people disagree. We do not force a fake binary (Guilty/Innocent) on a fuzzy reality. Instead, we require *more* evidence (qualitative factors) to bridge the gap in that zone.
  3.  **Fair Notice:** Even if we disagree on the exact number, stipulating *a* number provides students with fair notice. Currently, a student has no way to know if 42% is a violation. Under the proposed guideline, they know 42% triggers a review requiring qualitative evidence, not an automatic penalty. This reduces anxiety and increases trust in the system.

  **VI. Conclusion**

  We cannot discover a sharp boundary where none exists. Continuing to search for one wastes Board resources and risks unfair sanctions against students in borderline cases. I urge the Board to vote **Not Responsible** for Case #2023-CS-44 due to the vagueness of the current standard. Simultaneously, we must adopt the Three-Tier Guideline to replace the search for hidden truth with a transparent, manageable standard of evidence.

  Respectfully submitted,

  [Your Name]
  Student Representative, Academic Integrity Board
