answer: |-
  Here are 10 questions designed to move the discussion past the introductory defense of the Knowledge Account of Assertion (KAA). They are structured to anticipate the standard Williamsonian defensive maneuvers and provide you with a follow-up to press the advantage.

  Since you are a linguist, I have included a few questions that leverage linguistic data (evidentials, context-sensitivity) to ground the philosophical objections in your wheelhouse.

  ### 1. The Lottery Paradox (Required)
  **Question:** "One of the classic challenges to KAA is the lottery case. I have 99.9% statistical evidence my ticket lost. Intuitively, I cannot assert 'Your ticket lost' before the draw, which KAA explains by saying I don't *know* it. But I *can* rationally act on that probability (e.g., burning the ticket). If the norm of assertion is meant to track our epistemic position, why does assertion diverge from practical reasoning here? Why is the threshold for saying so much higher than the threshold for acting?"

  **Likely Move:** He will argue that statistical evidence alone never yields knowledge, regardless of probability, whereas practical reasoning can rely on probability. He will insist assertion is constitutively linked to knowledge, not just high credence.

  **Follow-up:** "If the barrier is the *source* of the evidence (statistical vs. causal/perceptual) rather than the strength, doesn't that make the norm of assertion oddly insensitive to the actual epistemic risk? If I can rationally bet my life on the statistical evidence, why is the linguistic community harmed by me asserting it? Is the 'harm' of assertion purely symbolic, or does it have communicative consequences?"

  ### 2. Selfless Assertion (Required)
  **Question:** "Consider Jennifer Lackey's 'Selfless Assertion' cases: a doctor has overwhelming evidence for a diagnosis but suffers from imposter syndrome and lacks personal belief. She asserts the diagnosis to save the patient. Intuitively, she is doing the *right* thing. Since KAA requires knowledge (and thus belief), she is violating the norm. Are we really to say she is violating a norm, even if she is epistemically responsible and morally praiseworthy?"

  **Likely Move:** He will claim the assertion is a "blameless violation." She violated the norm, but we excuse her because the stakes are high or her evidence was good.

  **Follow-up:** "But in standard deontic cases, if an action is the *right* thing to do all-things-considered, we don't call it a violation that needs excusing; we say it was permissible. If we praise her assertion rather than merely forgiving it, doesn't that suggest the relevant norm is actually about *evidence* or *warrant*, rather than the psychological state of knowing?"

  ### 3. The "Excuse" Maneuver / Unfalsifiability (Required)
  **Question:** "A common criticism is that KAA risks becoming unfalsifiable. Whenever there is a counterexample (like the lottery or selfless assertion), the defense is often that the assertion was 'improper but excusable.' At what point does distinguishing between 'justified' and 'excusable' become an ad hoc protection of the theory? What empirical or intuitive data would actually count against the view?"

  **Likely Move:** He will distinguish between the *primary norm* (knowledge) and *secondary norms* (reasonableness/sanctions). He'll argue that a norm can be violated without the agent being blameworthy.

  **Follow-up:** "I understand the distinction, but if the primary norm never aligns with our intuitive judgments of propriety without invoking the secondary 'excuse' clause, what explanatory work is the primary norm doing? If the theory predicts 'violation' every time our intuitions say 'proper,' isn't the theoretical cost too high?"

  ### 4. Testimony and Division of Epistemic Labor
  **Question:** "In scientific collaboration, I might assert a finding based on your data analysis because I trust your expertise, even if I haven't verified the raw data myself. Do I *know* the finding in the strict sense required by KAA? If not, is the entire scientific community constantly violating the norm of assertion when summarizing collaborative work?"

  **Likely Move:** He will argue that testimonial knowledge is still knowledge. If you trust the expert, you come to know the proposition, so you can assert it.

  **Follow-up:** "But if the expert turns out to be wrong (Gettier-style), I didn't know it. Was my assertion improper *ex ante*? If the propriety of my assertion depends on facts external to my evidence (i.e., whether the expert was actually right), doesn't that make the norm of assertion opaque to the speaker in a way that seems linguistically implausible?"

  ### 5. Contextualism and Stakes
  **Question:** "KAA is often paired with contextualism about 'knows.' In a low-stakes context, I might say 'I know the bank is open.' In high-stakes, I withdraw that. Does the norm of assertion shift with context? If I assert 'The bank is open' in a low-stakes context, have I satisfied the norm, even if I wouldn't have known it in a high-stakes context?"

  **Likely Move:** He will likely defend a stable standard for knowledge (insensitive contextualism) or argue that the *knowledge* itself changes with stakes.

  **Follow-up:** "If the knowledge standard is stable but our willingness to assert changes, doesn't that suggest the norm of assertion is actually sensitive to *practical factors* (stakes) rather than just epistemic factors (knowledge)? Why not just adopt a norm that explicitly references practical rationality?"

  ### 6. Linguistic Evidentials (Linguistics Angle)
  **Question:** "From a typological perspective, many languages require grammatical marking of evidence (evidentials)—marking whether you saw something, heard it, or inferred it. KAA treats all knowledge as the same entry ticket for assertion. Does KAA have the resources to explain why languages would grammaticize the *source* of knowledge if the only relevant norm is the *fact* of knowledge?"

  **Likely Move:** He will say grammar reflects pragmatics or processing, not necessarily the constitutive norm of assertion.

  **Follow-up:** "But if the norm is purely about knowledge, why do speakers feel a grammatical pressure to distinguish 'I saw it' from 'I inferred it' when both yield knowledge? Doesn't this suggest the norm of assertion is sensitive to the *mode* of justification, which KAA explicitly ignores?"

  ### 7. Moore's Paradox
  **Question:** "KAA is often motivated by its ability to explain Moore's Paradox ('P, but I don't know P'). If I assert P, I represent myself as knowing P. So asserting 'P but I don't know P' is contradictory. But does KAA explain the stronger paradox: 'P, but I don't *believe* P'? Do I need to believe P to assert it, or is knowledge enough?"

  **Likely Move:** He will argue knowledge entails belief, so the second paradox is covered by the first.

  **Follow-up:** "If knowledge entails belief, then the norm could just be 'Assert only what you believe.' That is a simpler psychological condition than knowledge. What specific explanatory power does adding the 'truth' and 'justification' conditions of knowledge give us that a Belief Account doesn't?"

  ### 8. Lying vs. Misleading
  **Question:** "Consider a case where I assert something literally true, but I know it will mislead you into a false belief. I know the literal proposition, so I satisfy KAA. But intuitively, this is often as bad as lying. Does KAA capture this impropriety, or does it let me off the hook because I technically 'knew' what I said?"

  **Likely Move:** He will concede KAA governs *assertion*, not *implicature*. You didn't violate the norm of assertion, but you violated a norm of conversation (Grice).

  **Follow-up:** "If the norm of assertion is the *constitutive* rule of the speech act, shouldn't it govern the communicative intent, not just the propositional content? If I can satisfy the norm while intentionally deceiving you, is it really a norm of *communication*?"

  ### 9. Group Assertion
  **Question:** "Institutions and groups make assertions (e.g., 'The CDC asserts that vaccines are safe'). Groups don't have psychological states, so they can't 'know' in the individual sense. Does KAA apply to group assertion? If so, what is the analog of knowledge for a collective?"

  **Likely Move:** He will argue for a derivative account: the group asserts only if the relevant members know.

  **Follow-up:** "But often the group asserts based on aggregated data where no single member knows the conclusion (the 'distributed knowledge' problem). If the group can properly assert without any individual member knowing, doesn't that break the link between individual knowledge and assertion propriety?"

  ### 10. Sufficiency vs. Necessity
  **Question:** "KAA is usually formulated as a necessary condition: Assert P *only if* you know P. But is it sufficient? If I know P, am I *permitted* to assert P in all contexts? If not, what other norms are overriding the knowledge norm?"

  **Likely Move:** He will admit it's not sufficient (e.g., it might be rude, or a secret). Knowledge is the *epistemic* norm, not the only norm.

  **Follow-up:** "If knowledge is just one norm among many (politeness, privacy, utility), and it can be overridden by them, why privilege it as *the* norm of assertion? Why not say the norm is simply 'Assert only what is contextually appropriate,' where knowledge is just one factor in appropriateness?"

  ### Moderation Tip
  Since you are moderating, you can frame these as "Clarifications from the audience" if you want to be less confrontational, or "Challenges from the literature" if you want to be more direct. Given you want to avoid a 40-minute restatement, I recommend the latter.

  **Example framing:** "We've heard a robust defense of the necessary condition. I'd like to push on the *sufficiency* and the *exceptions*..." (Then launch into Q3 or Q10).
