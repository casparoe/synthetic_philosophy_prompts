answer: |-
  The silence of Sector 7 was heavy, but the view below was worth the weight. Elara rested her forehead against the cool glass of the observation deck. Below, the planet spun in a slow, silent majesty. Crystalline mountain ranges caught the light of the binary suns, fracturing it into ribbons of violet and gold that draped over oceans of liquid mercury. There was no life here. No microbes, no plants, no breathing things. It was exactly what G.E. Moore had asked the world to imagine: a paradise utterly devoid of observers.

  Her hand hovered over the comms array. One press would send a subspace beacon to the *Aristotle*, where her partner, Kael, was stationed three days away.

  "Objective value," she whispered to the empty room. It was the mantra of her ethics training. Moore had insisted that this place, even if no human eye ever fell upon it, was intrinsically better than a heap of filth. The universe was objectively richer for its existence. She believed that. If she left now, sealed the sector, and let the planet spin until the suns died, its beauty would still hum with value. It would be a good thing in the dark.

  But then she remembered the second half of the lecture. Moore had argued that while unseen beauty was good, it was merely a shadow compared to the highest goods. The pinnacle of existence wasn't the object itself, but the conscious appreciation of it. And higher still was that appreciation shared within the bond of friendship or love.

  If she called Kael, the value wouldn't just double; it would qualitatively shift. It would become an "organic unity." The beauty of the planet plus the consciousness of two people loving it together created something vastly greater than the sum of the parts.

  Elara pulled her hand back.

  If she called him, was she honoring the planet, or was she instrumentalizing it? If she brought Kael here, the silence would break. They would talk, they would laugh, they would hold hands while watching the violet auroras. The moment would become about *them* as much as the view. The pristine, solitary goodness of the world would be contaminated by their presence.

  And yet, if she didn't call him, was she hoarding the good? Was she allowing a lesser value to persist when a greater one was possible?

  She thought of the alternative Moore had posed—the ugly planet. If she destroyed this one, replaced it with a wasteland, she would be committing a moral wrong, even if no one knew. But was failing to maximize the good also a wrong? By leaving it unseen, she was preserving its intrinsic value but denying its potential for maximal value.

  "Does it count if I'm the only one who knows?" she asked the glass.

  She was here. She was conscious. Her awe was real. But Moore placed personal affection above solitary appreciation. The loneliness of her awe felt thin compared to the shared warmth she imagined with Kael. She could picture his face now, the way his eyes widened when he saw something true. To deny him this was to deny them both the highest thing existence could offer.

  But there was a fear, quiet and persistent. If beauty required a witness to reach its peak, did the planet have any dignity of its own? Or was it just a stage waiting for actors? If she called him, she validated the idea that the universe was only truly good when it served human consciousness. If she stayed silent, she validated the idea that beauty was sovereign, needing no permission from minds to matter.

  Elara watched a storm brew over the mercury oceans, a swirl of silver clouds that no one else would ever see. It was breathtaking. It was enough.

  Was it?

  Her finger drifted back toward the button. The silence of the ship pressed in, competing with the silent beauty below. She thought of Kael's voice, the warmth of a shared moment, the way joy expands when divided. Then she thought of the planet spinning in the dark, perfect and unneeded.

  Moore hadn't given her a formula for this. He had only said one thing was good, and another thing was better. He hadn't said what to do when you couldn't have both without sacrificing the purity of the first.

  Elara's finger hovered. The storm below intensified, swirling in magnificent, wasted isolation. She took a breath, held it, and let her hand rest on the console, neither pressing nor pulling away. The beauty remained, waiting to see if it needed to be loved to be real.
