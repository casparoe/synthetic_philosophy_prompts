prompt: |-
  So for APUSH we had a DBQ prep packet and one of the documents was a chunk of Frederick Douglass's "What to the Slave is the Fourth of July" speech, specifically the part where he's absolutely tearing into the whole holiday, like saying America celebrating "freedom" while people are enslaved makes the day a hollow, hypocritical joke. My teacher used it as basically THE example of Douglass thinking the founding documents, Constitution included, were rotten to the core and beyond saving.

  But then this weekend I went down a wikipedia rabbit hole (I do this way too much, sorry) and found out Douglass is also super famous for later arguing that the Constitution, if you actually read the text closely instead of going off how it was practiced, is secretly an anti slavery document, and that he even split from William Lloyd Garrison and the whole "the Constitution is a covenant with death, burn it" camp specifically over this. That feels like a massive flip-flop to me? like either its a pro-slavery scam of a document or its this secretly liberty-loving text, and it feels random that the same guy is famous for arguing both, just depending on which speech or which year you happen to pick up. Did he actually change his mind for like strategic/political reasons, or is there some way these two Douglasses are actually way more consistent than they look and i'm just missing the connection? I brought this up with my teacher and she kind of just said "it's complicated" which, ok, but i want the actual explanation lol.
