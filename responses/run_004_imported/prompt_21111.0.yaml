          *   *LLM Inconsistency:* It's often stochastic noise or prompt sensitivity that doesn't map to *any* coherent desire/belief structure. It's not "self-deception"; it's "next-token probability."
          *   *Key Distinction:* Human irrationality is often *strategic* or *motivated*. LLM irrationality is *architectural*.

      *   **Step 3: The Predictive Utility Test (Dennett's Own Standard).**
