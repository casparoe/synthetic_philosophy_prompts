      *   **Key Criterion:** *Predictive Utility.* The stance is justified *only if* it works better than the Design Stance (how it was built) or Physical Stance (physics of the hardware).
      *   **The User's Insight:** LLM hallucination/inconsistency isn't just "error"; it's a structural failure of rationality that makes belief attribution *less* predictive than looking at the weights/prompts (Design Stance).
