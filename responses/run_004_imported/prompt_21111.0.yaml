  3.  **Drafting the Argument - Step-by-Step:**

      *   **Step 1: Validate and Refine the User's Intuition.**
          *   Acknowledge the friend is technically right about Dennett's *definition* (functionalism), but wrong about the *application*.
          *   Refine the user's point: It's not just about inconsistency; it's about the *source* of the inconsistency and whether belief attribution actually *helps* prediction.

      *   **Step 2: Address the "Humans are Inconsistent" Objection (The Big One).**
          *   *Friend:* Humans lie, change minds, have cognitive dissonance.
