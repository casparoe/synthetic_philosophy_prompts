      *   **Nuance on $\eta$:** This is often where the hidden ethical work is done. High $\eta$ implies future people will be richer, so marginal utility is lower, so we should invest less now. This can mimic high time preference without admitting it.
      *   **Recommendation for the Chapter:** Don't discard the Parfit connection, but refine it. The argument isn't "Parfit proves Stern's discount rate." It's "Parfit proves Stern's *pure time preference* parameter, which shifts the burden of justification to $\eta$ and $g$."

