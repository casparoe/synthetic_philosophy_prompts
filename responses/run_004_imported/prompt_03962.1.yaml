answer: |-
  You have hit upon precisely the distinction that separates superficial readings of the climate-economics debate from serious philosophical engagement with it. Your intuition is correct: **the philosophical argument against pure time preference does not settle the social discount rate (SDR), and conflating the two is a category error that obscures the real ethical work being done in the models.**

  For a dissertation chapter, this is excellent news. It means you can move beyond the standard "Stern = Ethical, Nordhaus = Unethical" caricature and engage with the much richer tension between *temporal neutrality* and *diminishing marginal utility*.

  Here is a breakdown of the distinction you need to draw, how it maps onto the Ramsey equation, and how you can frame this in your chapter without losing the force of Parfit's argument.

  ### 1. The Ramsey Equation: Separating the Parameters
  The core of the technical dispute is the Ramsey Rule for the discount rate on consumption ($r$):

  $$r = \delta + \eta \cdot g$$

  *   **$\delta$ (Delta):** The **Pure Rate of Time Preference (PRTP)**. This is the rate at which we discount future utility *simply because it occurs in the future*.
      *   *Philosophical Status:* This is the parameter Parfit attacks. If temporal location is morally arbitrary, $\delta$ ought to be zero (or near zero, accounting for existential risk).
  *   **$\eta$ (Eta):** The **Elasticity of Marginal Utility of Consumption**. This measures how much the moral value of an extra dollar diminishes as a person gets richer. It also functions as a measure of inequality aversion.
      *   *Philosophical Status:* This is an ethical parameter, but distinct from time preference. It asks: "How much do we care about redistribution across time vs. within a generation?"
  *   **$g$:** The **Growth Rate** of per capita consumption.
      *   *Philosophical Status:* Empirical/predictive.
  *   **$r$:** The **Social Discount Rate** on consumption.
      *   *Philosophical Status:* The derived output used in Cost-Benefit Analysis (CBA).

  **Your Insight:** You noticed that Stern uses $\delta \approx 0.1\%$ but arrives at $r \approx 1.4\%$. This is because Stern assumes $\eta = 1$ and positive growth ($g$). Even if we treat future people's *welfare* as equal to ours ($\delta = 0$), we still discount their *consumption* if we expect them to be richer than us. A dollar gives them less marginal utility than it gives us.

  ### 2. Why Parfit's Argument Doesn't Settle $r$
  Parfit's argument for temporal neutrality successfully targets $\delta$. It establishes that we cannot value a unit of welfare less *merely* because it happens in 2100 rather than 2024.

  However, Parfit's argument **does not** dictate $\eta$.
  *   If we accept Parfit's view ($\delta = 0$), we still have to decide how to weigh the welfare of rich future people against poor present people.
  *   If we assume future generations will be significantly wealthier due to technological progress (high $g$), and we accept that money matters less to the rich (positive $\eta$), then $r$ will be positive even if $\delta$ is zero.
  *   Therefore, **one can be a Parfitian about time and still endorse a positive discount rate on consumption.**

  This explains the Stern Review's number. Stern is not saying future welfare matters less. He is saying future *consumption* will be less morally urgent because future people will be richer.

  ### 3. Where the Real Ethical Fight Is: $\delta$ vs. $\eta$
  The dispute between Stern and Nordhaus is often mischaracterized as solely about $\delta$. In reality, it is about the **interaction** between $\delta$ and $\eta$.

  *   **Stern (The Prescriptive/Parfitian Approach):**
      *   Sets $\delta \approx 0$ (Ethical axiom: temporal neutrality).
      *   Sets $\eta = 1$ (Low inequality aversion).
      *   *Result:* Low $r$. Aggressive mitigation is required because the future is not discounted heavily, and the marginal utility of consumption doesn't drop off fast enough to justify ignoring climate damages.
  *   **Nordhaus (The Descriptive/Market Approach):**
      *   Sets $\delta \approx 1\%+$ (Often justified by "revealed preference" in market interest rates).
      *   Sets $\eta \approx 2$ (Higher inequality aversion).
      *   *Result:* Higher $r$. Gradual mitigation.

  **The Philosophical Trap:**
  Nordhaus often justifies his higher $\delta$ by pointing to market interest rates. Philosophically, this commits the **naturalistic fallacy** (deriving an *ought* from an *is*). Market rates reflect current biases, liquidity constraints, and myopia, not ethical truth. Parfit would reject this justification entirely.

  However, Nordhaus can (and does) argue that a higher $\eta$ does the ethical heavy lifting. If $\eta$ is high (e.g., 2 or 3), it implies we care deeply about equality. Since climate policy assumes future people will be richer, a high $\eta$ implies we should transfer less wealth to them (via mitigation costs) because their marginal utility of consumption is low.

  **Crucially:** A high $\eta$ can mathematically mimic a high $\delta$. You can get the same $r$ with ($\delta=0, \eta=3$) as you can with ($\delta=1.5, \eta=1$).
  *   **Parfit's Rejoinder:** This matters ethically. Justifying low mitigation via $\eta$ admits future people matter equally but are rich. Justifying it via $\delta$ admits we care less about them because they are *future*. The former is compatible with temporal neutrality; the latter is not.

  ### 4. Recommendations for Your Chapter
  Do not abandon the Parfit connection; refine it. Your chapter will be stronger if you acknowledge the economic nuance rather than fighting a straw man.

  **A. Distinguish "Discounting Welfare" from "Discounting Consumption"**
  Make it clear that Parfit prohibits discounting *welfare* across time ($\delta$), but allows for discounting *consumption* across time due to wealth effects ($\eta \cdot g$). This shows you understand the economics and strengthens your philosophical precision.

  **B. Shift the Burden of Proof**
  Argue that Parfit's case settles the presumption for $\delta \approx 0$. This forces opponents (like Nordhaus) to justify any positive $\delta$ on ethical grounds, not just empirical ones. If they cannot justify $\delta > 0$, they must rely entirely on $\eta$ and $g$.
  *   *The Critical Move:* If the entire discount rate rests on $\eta \cdot g$, then the policy recommendation becomes hypersensitive to assumptions about future growth ($g$). If growth stalls (e.g., due to climate damage), $r$ drops, and the imperative to mitigate skyrockets. This is a key vulnerability in the Nordhaus-style approach that a Parfitian analysis exposes.

  **C. The "Tycoon" Objection**
  Address the argument that if $\delta = 0$ and $\eta$ is low, we are obligated to save so much for the future that the present generation starves (the "over-saving" objection).
  *   Parfit anticipates this. The solution usually lies in setting a reasonable $\eta$. If $\eta$ is sufficiently high, it protects the present generation from excessive sacrifice without violating temporal neutrality. This is where Stern's choice of $\eta=1$ is actually the controversial ethical choice, not just his $\delta$.

  **D. Conclusion on the Debate**
  Conclude that the Stern-Nordhaus debate is not merely a technical dispute about numbers, but a clash between **prescriptive ethics** (Stern/Parfit: "How *should* we value the future?") and **descriptive welfarism** (Nordhaus: "How *do* we value the future based on market behavior?").
  *   Parfit's argument wins on the $\delta$ parameter (ethically).
  *   But the policy outcome ($r$) remains contested because of $\eta$.
  *   Therefore, Parfit's argument is *necessary* but not *sufficient* for Stern-style climate policy.

  ### Summary for your Dissertation
  You are right to pause. If you claim Parfit's argument proves Stern's discount rate is the only correct one, you will be vulnerable to economic critique.

  Instead, claim this: **Parfit's argument eliminates "pure time preference" as a legitimate ethical justification for discounting.** This purifies the debate. It forces economists to admit that any remaining discounting must be justified by assumptions about future wealth ($\eta$ and $g$). This makes the ethical assumptions about inequality and growth explicit, rather than hiding them behind a "time preference" label that Parfit has shown to be morally arbitrary.

  This framing allows you to use Parfit to critique the *structure* of the economic argument, rather than just trying to dictate the *result*.
