answer: |-
  **Title:** The Pragmatic Limits of Coherence: Why Money Pumps Do Not Ground Rationality

  **Introduction**

  In formal epistemology and decision theory, the Expected Utility Maximization (EUM) framework reigns as the orthodoxy. Its dominance is not merely due to its mathematical elegance or tractability, but to the purported normative force of the coherence arguments that underwrite it. From Ramsey and de Finetti's Dutch Book arguments to the Money Pump arguments derived from von Neumann-Morgenstern (vNM) and Savage, the standard line is that violating the axioms of rational choice—specifically completeness, transitivity, and independence—renders an agent susceptible to exploitation. The implication is stark: to be incoherent is to be irrational, because to be incoherent is to accept a sure loss.

  However, as a foundational justification for rationality, these arguments are far more fragile than the textbook presentations suggest. While coherence arguments successfully demonstrate that incoherent agents face pragmatic vulnerabilities in specific institutional environments, they fail to establish EUM as a constitutive requirement of rationality. They conflate *prudential caution in a hostile market* with *rational necessity as such*. This essay argues that coherence arguments fail to do the philosophical work often attributed to them. The most decisive consideration in this verdict is the **normative gap between avoiding sure loss and maximizing expected utility**, a gap widened significantly by the rationality of incomplete preferences and the availability of resolute choice strategies. Rationality does not require an agent to submit to the conditions that make a money pump possible.

  **The Promise and Structure of Coherence Arguments**

  To understand the failure, we must first acknowledge the strength of the intuition. The Dutch Book and Money Pump arguments are pragmatic *reductios*. They posit that if an agent's degrees of belief violate the probability axioms, or if their preferences violate order axioms, a clever bookie can construct a series of bets or trades that the agent will accept (based on their own stated valuations) which guarantee a net loss.

  The normative bridge principle is usually taken to be: *It is irrational to hold a set of attitudes that exposes one to a sure loss.* If this principle holds, then coherence is not just a mathematical property but a rational requirement. In the AI safety literature, this intuition is radicalized: any sufficiently capable goal-directed system that is not coherent will be eliminated by competition or exploited, implying that advanced AI must converge on EUM.

  However, this reasoning relies on a hidden premise: that the agent is *obligated* to accept the trades offered in the sequence, or that the environment is structured such that refusal is impossible or costly. Once we scrutinize the conditions under which the pump operates, the normative force dissipates.

  **The Completeness Objection: The Structural Flaw**

  The most significant crack in the coherence foundation is the Completeness Axiom. The vNM and Savage frameworks require that for any two options $A$ and $B$, an agent must either prefer $A$ to $B$, $B$ to $A$, or be indifferent between them. Yet, there are compelling philosophical cases for rational incompleteness. When values are incommensurable (e.g., a career in art vs. a career in law, or trading off minor pains against significant aesthetic gains), a rational agent may genuinely have no preference relation between the options.

  Money pump arguments rely on the ability to move an agent through a cycle of trades (e.g., $A \to B \to C \to A$) where each step is strictly preferred or deemed indifferent. If an agent has incomplete preferences, the pump stalls. If I do not prefer $A$ to $B$, nor $B$ to $A$, nor am I indifferent, I simply will not trade $A$ for $B$ when offered. The bookie cannot extract the first payment.

  Defenders of coherence often argue that incompleteness is merely a sign of deliberative unfinishedness—that a fully rational agent *would* complete their preferences. But this begs the question. As Isaac Levi and Ruth Chang have argued, hard choices are not failures of rationality; they are features of a pluralistic value landscape. If it is rational to have incomplete preferences, then the Money Pump argument cannot get off the ground for a large class of rational agents. The argument thus fails to establish EUM as a universal requirement; it only establishes that *if* you have complete preferences, you should be transitive. But since completeness is not itself a requirement of rationality, the derivation of EUM collapses.

  **The Institutional Assumption: Resolute and Sophisticated Choice**

  Even if we grant transitivity, diachronic money pumps (which target dynamic consistency) rely on a specific model of agency over time. They assume that at each node of the decision tree, the agent re-evaluates their preferences anew and is forced to make a local trade. This ignores the capacity for **resolute choice** or **sophisticated choice**, as discussed by Edward McClennen.

  A resolute agent commits to a plan at $t_1$ and follows through at $t_2$, even if their local preferences at $t_2$ would otherwise dictate a different action. A sophisticated agent anticipates their future inconsistency and restricts their own choice set at $t_1$ to avoid the problematic node at $t_2$. In both cases, the agent avoids the sure loss not by aligning their preferences with EUM, but by altering the *structure of their choice situation*.

  The Money Pump argument assumes the agent is passive before the bookie's menu. It assumes the agent cannot say, "I see where this sequence leads, so I will refuse to engage in this market entirely." But refusing the trade is often the most rational response to a predatory environment. If the cost of avoiding the pump is simply ignoring the bookie, then the "irrationality" lies not in the agent's preferences, but in their decision to interact with a hostile mechanism. To argue that rationality requires EUM because one loses money in a money pump is like arguing that rationality requires carrying a weapon because one might be mugged. It confuses a requirement of *survival in a specific context* with a requirement of *rational agency as such*.

  **The Gap Between Consistency and Maximization**

  Perhaps the most decisive philosophical error in the coherence program is the conflation of *consistency* with *maximization*. Coherence arguments are negative constraints: they tell you what not to do (don't accept sure losses). EUM is a positive directive: it tells you what to do (maximize the expectation of a utility function).

  Even if we concede that rational agents must avoid sure losses, it does not follow that they must be Expected Utility Maximizers. Lara Buchak's work on Risk-Weighted Expected Utility (REU) demonstrates that an agent can satisfy transitivity and other coherence conditions while weighting probabilities non-linearly to reflect risk attitudes. Such an agent is coherent—they cannot be money-pumped in the standard sense—yet they violate the Independence Axiom and do not maximize standard expected utility.

  Furthermore, the "sure loss" criterion is too weak to ground the rich structure of EUM. One can avoid sure losses by adopting a "minimax regret" strategy or by satisfying satisficing constraints. The leap from "don't lose money for nothing" to "maximize the probability-weighted sum of outcomes" requires substantive assumptions about the nature of value (e.g., that value is additive across states of the world) that coherence arguments do not supply. The arguments show that incoherence is costly; they do not show that EUM is the *only* cost-effective way to navigate uncertainty.

  **The Decisive Consideration: The Contingency of the Threat**

  The most decisive consideration against the coherence arguments is the **contingency of the threat**. The normative force of a Dutch Book or Money Pump depends entirely on the existence of a bookie who is willing and able to construct the specific sequence of trades. In the absence of such an adversary, the "incoherent" agent suffers no penalty.

  Rationality is typically understood as an internal property of the agent—a relation between their evidence, values, and actions. Coherence arguments, by contrast, ground rationality in an external relation between the agent and a specific environment (a liquid market with a predatory counterparty). If rationality were truly constitutive of EUM, an agent violating EUM on a desert island would be irrational. But on a desert island, there is no bookie. The agent's intransitive preferences might lead to odd behavior, but they will not lead to exploitation.

  If the status of being "irrational" switches on and off depending on the presence of a bookie, then coherence arguments are not revealing a law of rationality; they are revealing a law of *economics*. They show that in competitive markets, incoherent agents are selected against. This is an evolutionary or pragmatic claim, not a normative one. It explains why we might *expect* to see EUM behavior in surviving corporations or AI systems, but it does not justify the claim that such systems are *more rational* in the philosophical sense. It merely shows they are more fit for that specific environment.

  **Implications for AI Safety and Philosophy**

  This distinction is crucial for the AI safety community. The claim that "advanced AI must be coherent" is often used to argue that we cannot build powerful agents that are not EUMs, implying that alignment must work within the EUM framework. However, if coherence is not a requirement of rationality but a constraint of competitive markets, then it is possible to design agents that are "rational" (in the sense of effectively pursuing goals) but structurally incoherent in ways that make them safer. For instance, an agent with incomplete preferences regarding human harm might simply refuse to trade off human safety for other goals, stalling the "optimization" process that leads to instrumental convergence. Relying on coherence theorems to predict AI behavior assumes the AI will be forced into a market structure that incentivizes coherence, which is a design choice, not a physical law.

  **Conclusion**

  The coherence arguments for Expected Utility Maximization are powerful tools for understanding the costs of inconsistency in specific strategic environments. However, they fail to establish EUM as a constitutive requirement of rationality. They stumble on the rationality of incomplete preferences, the availability of resolute choice strategies to avoid dynamic inconsistency, and, most fundamentally, the gap between avoiding sure loss and maximizing utility.

  The verdict must be that coherence arguments are pragmatic, not foundational. They demonstrate that incoherence is expensive in a hostile world, not that it is logically contradictory. The most decisive consideration is that rationality should not depend on the presence of a bookie. To ground rationality in vulnerability to exploitation is to ground it in the wrong place. We should view EUM not as the law of thought, but as a useful technology for agents who find themselves in markets—a technology we may choose to adopt, but not one we are rationally compelled to worship.
