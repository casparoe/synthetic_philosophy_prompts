answer: |-
  This is an excellent question, and you are right to be skeptical of the "refutation" narrative. While the surge of interest in the Kelly criterion and ergodicity economics is grounded in real mathematical insights, the popular framing often conflates **specific optimality conditions** with **universal laws of rationality**.

  To help you pressure-test the framing for your piece, here is a breakdown of where the "geometric rationality" camp is correct, where they are overreaching, and how to nuance the story for a general audience.

  ### 1. The Kernel of Truth: Where the Popularizers Are Right
  The proponents of this view (including Ole Peters, Nassim Taleb, and various investing podcasters) have successfully highlighted two critical failures of naive reasoning that *are* often glossed over in introductory finance and economics.

  *   **Arithmetic EV is dangerous for repeated bets:** If you face a sequence of multiplicative bets (where you reinvest your winnings), maximizing the arithmetic expected value of each individual bet can lead to almost certain ruin. This is the "volatility drag" effect. A bet with positive arithmetic EV can have a negative geometric growth rate. The Kelly criterion correctly identifies that for long-term compounding, the geometric mean is the relevant metric.
  *   **The Ergodicity Problem:** Ole Peters' core contribution is highlighting the difference between **ensemble averages** (what happens to 1,000 people at one casino table) and **time averages** (what happens to one person at the table over 1,000 nights). In non-ergodic systems (like wealth compounding), these two averages diverge. Mainstream economics often implicitly assumes ergodicity (that the ensemble average represents the time experience), which can lead to misleading policy or investment advice.

  **Verdict:** It is accurate to say that for *long-term, repeated, reinvested wagering*, arithmetic expected value is the wrong metric, and geometric growth (Kelly) is the correct one.

  ### 2. The Overreach: Why It Is Not a "Refutation" of Expected Utility
  The dramatic claim you encountered—that this framework *refutes* expected-utility theory (EUT) and renders risk aversion via diminishing marginal utility a "clumsy workaround"—is mathematically and historically contentious.

  *   **Kelly is a Subset of EUT, Not an Alternative:** Expected Utility Theory does not mandate a specific utility function. It provides a framework: maximize $E[U(w)]$. If an agent's utility function is logarithmic ($U(w) = \ln w$), EUT dictates the exact same bet sizing as the Kelly criterion. Daniel Bernoulli proposed log utility to solve the St. Petersburg paradox in 1738, long before Kelly. Therefore, Kelly betting is fully consistent with EUT; it just assumes a specific utility function (log wealth).
  *   **Preferences vs. Physics:** Peters argues that risk aversion shouldn't be a psychological preference (utility) but a physical necessity of the dynamics. However, economists argue that EUT is designed to model *preferences*, not just physical dynamics. An investor might have a finite horizon, specific liabilities (e.g., tuition due in 5 years), or a desire for consumption now rather than growth later. In those cases, maximizing long-term geometric growth is *not* rational. EUT accommodates these preferences; pure Kelly/ergodicity frameworks often struggle to incorporate them without ad-hoc adjustments.
  *   **The "Rationality" Definition:** The claim that Kelly is the "only mathematically defensible quantity to maximize" defines rationality solely as **maximizing long-term wealth growth rate**. But is that the only definition of rationality? If I am 90 years old, maximizing my geometric growth rate over 50 years is irrational. If I am a pension fund with fixed payouts, maximizing growth at the cost of high short-term volatility might be irrational.

  **Verdict:** It is inaccurate to say EUT is "wrong." It is more accurate to say that ergodicity economics offers a different *justification* for log utility (time averages vs. psychological preferences), but the mathematical outcome is often identical.

  ### 3. Practical Nuance: Is Kelly the Universal Standard?
  Even if we accept the goal of maximizing long-term growth, the popular advice to "size every wager by the Kelly fraction" is dangerous in practice.

  *   **Estimation Error:** Kelly requires precise knowledge of the edge (probability of winning vs. payoff). In a casino, you might know the odds. In the stock market or venture capital, you do not. If you overestimate your edge and bet full Kelly, you increase volatility disproportionately. If you bet *double* Kelly, your expected growth rate drops to zero; beyond that, you face ruin. Because edges are rarely known precisely, most professional Kelly bettors (like Ed Thorp himself) use **Fractional Kelly** (e.g., half-Kelly) to provide a safety margin.
  *   **Drawdowns:** Full Kelly betting is incredibly volatile. It can result in drawdowns of 50% or more with high frequency. While the math says you will recover in the long run, most humans (and funds) cannot withstand the psychological or contractual pressure of such drawdowns.
  *   **Correlated Risk:** Kelly works best on independent bets. In modern portfolios, risks are often correlated. A "Kelly-optimal" portfolio based on historical correlations can blow up when correlations converge to 1 during a crisis (as seen in the 2008 financial crisis).

  ### 4. How to Frame This for Your Readers
  To avoid the hype while capturing the insight, consider framing the story around **"Context-Dependent Rationality"** rather than "New Laws of Math."

  **Suggested Framing Points:**
  1.  **The Shift from "What should I want?" to "How does wealth behave?"**
      *   *Narrative:* Traditional economics asks, "What is your risk tolerance?" (Psychology). Ergodicity/Kelly asks, "What does the math of compounding demand?" (Physics). This is a genuine shift in perspective, even if the math overlaps.
  2.  **The "Ruin" Boundary:**
      *   *Narrative:* The most valuable contribution of this literature isn't telling you how to get rich, but telling you how to avoid going to zero. It establishes that avoiding ruin is a prerequisite for any other financial goal.
  3.  **Tool vs. Law:**
      *   *Narrative:* Kelly is a powerful tool for specific conditions (repeated, reinvested, positive-edge bets), not a universal law for all financial decision-making.
  4.  **The "Log Utility" Coincidence:**
      *   *Narrative:* Highlight the irony that the "refutation" of economics actually rediscovers a 300-year-old economic concept (log utility), but claims it as a physical law rather than a preference.

  ### 5. Sources for Balance
  If you want to round out the piece, consider seeking commentary from:
  *   **Pro-Kelly/Ergodicity:** Ole Peters (obviously), Nassim Taleb (for the "ruin" perspective), or William Ziemba (who has written extensively on Kelly in finance).
  *   **Skeptics/Mainstream:** Look for behavioral economists or finance professors who specialize in portfolio theory. They will likely argue that Merton's continuous-time finance models already incorporate these dynamics and that Peters' critique is a "straw man" of modern economics. (Search for critiques of ergodicity economics by Cosma Shalizi or reviews in *The Econ Journal Watch*).

  ### Summary for your piece
  You can accurately report that **arithmetic expected value is inappropriate for repeated compounding scenarios** and that **ergodicity economics provides a compelling physical justification for risk aversion.**

  However, you should push back on the claim that this **refutes expected utility theory** (since log utility is part of EUT) or that **Kelly is the only rational strategy** (since it ignores finite horizons, consumption needs, and estimation error). The most honest headline isn't "Economists Were Wrong," but rather "Physicists Remind Economists That Time Moves in One Direction."
