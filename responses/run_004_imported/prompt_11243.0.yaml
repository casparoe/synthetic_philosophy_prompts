          *   *Verdict:* Paul wins on strict logic.

      *   *Move 3: Marge's Pushback (Borderline only).*
          *   She wants to save the *spirit* of introspection. She's arguing for a "contextualist" or "pragmatic" retreat.
          *   *Verdict:* Marge wins on intuition/pragmatics, but loses on strict epistemology.

      *   *Move 4: Paul's Skeptical Leap (Infection).*
