      *   *Missing Nuance:* Both treat "KK" and "Luminosity" as identical. They are related but distinct. Luminosity is $\phi \to K\phi$. KK is $K\phi \to KK\phi$. Williamson attacks Luminosity primarily, which entails the failure of KK for those propositions.
