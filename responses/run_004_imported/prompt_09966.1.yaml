answer: |-
  **Setting:** *A small conference room off the main hospital boardroom. Coffee cups are scattered on the table. The ethics committee has broken for a ten-minute recess after three hours of debating the allocation of the new palliative care fund. Elena, a bioethicist with a background in law, stands by the window. Marcus, a health economist, is leaning over the table, shuffling papers.*

  **Elena:** We're dressing it up, Marcus. I watched the chair trying to convert "years of life" into "units of pain relief" on that whiteboard. It looked like alchemy. We are making a value judgment about whose suffering counts more, and then we're wrapping it in a spreadsheet to make it look like a calculation.

  **Marcus:** It's not alchemy if the inputs are consistent. We have QALYs—quality-adjusted life years. We have established scales for pain. We aren't guessing in the dark.

  **Elena:** Those scales are ordinal. Patient A says their pain is an 8. Patient B says theirs is an 8. But does Patient A's 8 feel like Patient B's 8? And more importantly, does Patient A's relief from an 8 to a 6 equal the value of Patient C gaining five years of life? Lionel Robbins would have told you to put the marker down. There is no observation that can settle that. You're presenting an ethical preference as a scientific fact.

  **Marcus:** And if we put the marker down, we fund nothing. The budget is fixed. If we don't compare, we default to the status quo, which is effectively saying the current distribution of suffering is optimal. That's an ethical stance too, Elena. A cowardly one.

  **Elena:** There's a difference between making a choice and claiming the choice was dictated by the data. Robbins isn't saying "do nothing." He's saying, "Admit that when you choose the life-extension program over the pain-relief program, you are saying life is more important than relief, not that the math proved it."

  **Marcus:** That's the Robbinsian line, yes. But it ignores the Harsanyi rescue. Think about the Impartial Observer. If you were behind a veil of ignorance—if you didn't know whether you'd be born as the patient with chronic pain or the patient with the terminal diagnosis—wouldn't you make a trade-off? You'd weigh the probability of being in pain against the probability of dying early. You'd maximize your expected utility.

  **Elena:** I would. But that tells me about *my* risk tolerance, Marcus. It tells me how *I* value safety versus longevity. It doesn't tell me anything about the internal state of the person actually in pain. It's a calibration error. In physics, if I want to compare two voltmeters, I need a standard voltage. I can't just ask one voltmeter, "What would you read if you were the other voltmeter?"

  **Marcus:** But human beings *are* the standard voltage. We share a neurophysiology. If I wince at a stimulus, and you wince at the same stimulus, it is scientifically coherent to infer a similar experience. The Impartial Observer isn't just betting on their own preferences; they are using their own capacity for sensation as a proxy for the universal capacity. When I say, "I would trade a 10% risk of death to avoid chronic migraines," I am using my nervous system as the instrument to measure the disutility of migraines for everyone.

  **Elena:** That's the leap I can't swallow. You're assuming invariance under change of apparatus. You're assuming your nervous system is calibrated identically to mine. But even if it were, your *bet* is still your preference. You might be risk-averse. I might be a gambler. If you vote based on your risk aversion, you're imposing your psychological structure on my suffering. You haven't solved the comparability problem; you've just relocated it from "comparing two people" to "projecting one person onto two people."

  **Marcus:** Is that worse than your alternative? Because here is the charge against your skepticism, Elena: By refusing to make the comparison explicit, you aren't avoiding the value judgment. You're hiding it. If you say, "We cannot compare pain to death," and then we fund the life-extension program because the metrics for mortality are clearer than the metrics for pain, you have implicitly assigned infinite value to life extension and zero to pain relief. That is a substantive comparison. It's just an unexamined one.

  **Elena:** *(Pauses, looking out the window)* I'll concede that inaction is a choice. But there is a democratic distinction here. If I stand up and say, "I believe extending life is morally weightier than relieving pain, even if I can't prove it," the committee can argue with my morality. They can vote me down. But if I say, "The utility calculus dictates this," I shut down the debate. I claim a precision that doesn't exist. My worry isn't that we choose; it's that we lie about *how* we choose.

  **Marcus:** But is it a lie? Or is it a model? In your old field, did you ever measure something directly? Or did you always rely on a theoretical framework to interpret the reading on the dial?

  **Elena:** We calibrated the dial against a known standard.

  **Marcus:** And the "known standard" was agreed upon by the community of physicists based on shared assumptions about how the world works. That's what we're doing. We are agreeing, as a community, to treat human preferences as cardinal and comparable because without that assumption, social choice is impossible. Harsanyi isn't claiming it's a physical fact like gravity. He's claiming it's a rational necessity for moral reasoning. If you reject the comparison, you aren't being more scientific; you're being paralyzed.

  **Elena:** I'm not paralyzed. I'm asking for transparency. Look, let's grant your Impartial Observer. Even if I accept that I can imagine myself in another's shoes, that only works if I assume their "shoes" feel the same on my feet. But what if the chronic pain patient has a higher tolerance? What if the terminal patient is at peace? Your model assumes homogeneity of experience to solve the problem of heterogeneity of persons. It washes out the very particularity that makes ethics necessary.

  **Marcus:** And your model assumes incommensurability to solve the problem of scarcity. It washes out the necessity of choice. Here's where I think we actually differ, Elena. You think the disagreement is about whether interpersonal utility is a *fact* out there in the world, like a rock.

  **Elena:** I think it's about whether it's a *knowable* fact. If it exists but we can't measure it, treating it as measured is dangerous.

  **Marcus:** I think it's neither. I think utility comparison is a *construct*. It's a tool we build to solve coordination problems. The question isn't "Is it true?" It's "Is it useful?" And more specifically, "Does it lead to more coherent moral outcomes than your skepticism?" If we use the veil of ignorance, we force ourselves to care about the minority. If we use your Robbinsian approach, we often end up protecting the status quo because we can't "verify" the need for change.

  **Elena:** *(Turns from the window)* So, you're saying the Impartial Observer is a heuristic for empathy, not a measurement device?

  **Marcus:** Exactly. It's a procedure to generate consensus on weights.

  **Elena:** Then why present it as a calculation? Why the QALYs? Why not say, "Behind the veil, we would choose life extension, so that is our collective moral intuition"?

  **Marcus:** Because numbers allow aggregation. Intuitions clash.

  **Elena:** And numbers deceive. They suggest that if we just get better data, the moral problem disappears. It won't. We are still deciding that Group A's agony is the price for Group B's longevity.

  **Marcus:** Okay. Let's try to locate the disagreement precisely. You say the problem is epistemological—we can't *know* the comparison. I say the problem is ontological—there is no fact of the matter until we construct one through rational agreement.

  **Elena:** Close. I think the problem is *political*. When you treat a value judgment as a technical calculation, you remove it from the realm of public contestation. If I say, "Pain is worth less than life," you can call me cruel. If I say, "The utility function yields this result," you have to call me a mathematician. I want to be called cruel if I'm being cruel. I don't want to hide behind the math.

  **Marcus:** And I want to ensure that if we are going to be cruel, we are at least consistent about it. Your approach risks inconsistency. One committee says pain matters most; the next says life matters most. Neither can be challenged on rational grounds, only on power. My approach demands that the weights be universalizable. If you say pain is worth less than life for this budget, you must say it for all budgets.

  **Elena:** *(Sits down)* So, you're arguing that the Harsanyi construction imposes a discipline of consistency that the Robbinsian admission does not.

  **Marcus:** Yes. It forces you to commit to a rule, not just a reaction.

  **Elena:** And I'm arguing that the Robbinsian admission imposes a discipline of honesty that the Harsanyi construction does not. It forces you to own the value, not just the rule.

  **Marcus:** *(Nods slowly)* So we agree that a decision must be made. We agree that it involves weighing lives against suffering.

  **Elena:** We agree that the budget constraint forces a trade-off.

  **Marcus:** But we disagree on whether framing that trade-off as a "measurement" is a necessary fiction for rationality, or a dangerous fiction for democracy.

  **Elena:** That's it. It's not about whether the utility exists. It's about whether pretending we can measure it makes us better decision-makers, or just more confident ones.

  **Marcus:** And whether "confidence" is a virtue in ethics, or a vice.

  **Elena:** *(Picks up her pen)* If we go back in there, I won't block the calculation. But I will insist the minutes record that the weights assigned to pain versus life were adopted by vote, not derived by formula.

  **Marcus:** I can accept that. Provided the vote is based on the rational expectation of the Impartial Observer, not just who shouts loudest. We use the model to structure the debate, even if we admit the numbers are proxies.

  **Elena:** Proxies. Not measurements.

  **Marcus:** Calibrated proxies.

  **Elena:** *(A faint smile)* Don't push it, Marcus. But... agreed.

  **Marcus:** Good. Because the coffee is cold, and we have to tell the families.

  **Elena:** Then let's make sure we tell them the truth. Not the whole truth, perhaps. But not a calculation disguised as one.

  **Marcus:** And not a guess disguised as a principle.

  *(They gather their papers and head for the door.)*
