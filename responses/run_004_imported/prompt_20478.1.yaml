answer: |-
  This is a fantastic catch. You have correctly identified a deep tension in the philosophy of science that often goes unexamined in casual rationalist discourse. You are right about the history: Karl Popper introduced *verisimilitude* (truthlikeness) to explain how science progresses even if all theories are strictly false. You are also right that David Miller and Pavel Tichý independently demolished Popper's specific formalization in 1974.

  However, the conclusion that "getting less wrong" is incoherent relies on assuming that Less Wrong's epistemology is fundamentally Popperian. It isn't. The community is overwhelmingly Bayesian.

  Here is the breakdown of why Popper's failure matters, why the Bayesian framework largely dodges the bullet, and where the remaining philosophical landmines are.

  ### 1. The Popperian Dead End
  Popper defined verisimilitude using logical content. A theory $A$ has more verisimilitude than $B$ if $A$ has more true content and no more false content (or more true content and less false content).

  **The Miller-Tichý Result:** They proved that if two theories are both false, it is logically impossible for one to have more verisimilitude than the other under Popper's definition. If $A$ and $B$ are false, they both entail an infinite number of false statements. The set-theoretic math collapses.

  **The Implication:** If you define "wrongness" as *logical falsity*, then yes, you cannot rank false theories. Since Newtonian physics is strictly false (it breaks at relativistic speeds), and Aristotelian physics is strictly false, Popper's formalism cannot say Newton is "less wrong" than Aristotle.

  **The Fix (Philosophy of Science side):** Philosophers like Ilkka Niiniluoto and Graham Oddie spent the next 40 years fixing this. They moved away from *logical content* definitions toward *similarity* definitions. Instead of counting true/false sentences, they define a "distance" between the state of affairs described by the theory and the actual state of affairs (often using possible worlds semantics). Under these modern definitions, Newtonian physics *is* closer to the truth than Aristotelian physics because the "distance" between its predictions and reality is smaller, even if the distance isn't zero.

  ### 2. The Bayesian Escape Hatch
  The Less Wrong sphere does not use Popper's logical content definition. It uses **probabilistic credences** and **proper scoring rules**. This changes the geometry of the problem entirely.

  #### A. From Binary Truth to Continuous Calibration
  Popper's problem arises from binary truth values (True/False). Bayesianism deals in probability distributions ($0 \leq p \leq 1$).
  "Wrongness" in the Bayesian sense is not "Is this statement False?" It is "How surprised was I by the data?"

  We measure this using **Proper Scoring Rules** (like the Brier Score or Log Loss).
  *   **Log Loss:** $-\ln(p)$ where $p$ is the probability assigned to the event that actually occurred.
  *   **Brier Score:** $(p - o)^2$ where $o$ is the outcome (0 or 1).

  These metrics are coherent and continuous. If Theory A assigns 90% probability to the truth and Theory B assigns 10%, Theory A has a better score, even if neither theory assigns 100% (certainty). You can mathematically prove that updating on evidence reduces expected log loss (increases expected accuracy).

  **Does this dodge Miller-Tichý?** Yes. Miller-Tichý applies to the *logical content of falsified statements*. It does not apply to *distance metrics on probability distributions*. Bayesianism measures the distance between your distribution and the reality (via KL Divergence), not the subset relations of your false predictions.

  #### B. Convergence to Truth (Doob's Consistency Theorem)
  A major worry is: "If all models are wrong, are we just optimizing wrongness?"
  Bayesian consistency theorems (like Doob's) state that as data accumulates, a Bayesian agent's posterior probability will converge to 1 for the true hypothesis—**provided the true hypothesis is in the support of the prior.**

  This is the catch. If the truth is *not* in your hypothesis space (the "M-Open" setting in Bayesian statistics), you will not converge to the Truth. You will converge to the hypothesis in your set that minimizes the **Kullback-Leibler (KL) divergence** from the truth.

  **Is minimizing KL divergence "getting less wrong"?**
  *   **Instrumentally:** Yes. You are becoming maximally predictive given your constraints.
  *   **Ontologically:** Maybe not. You might be converging on a "best wrong model" rather than "Truth."

  However, for the rationalist project, this distinction is often dissolved. If your map minimizes prediction error (KL divergence) relative to the territory, you are functionally "less wrong," even if your map uses projections the territory doesn't literally contain.

  ### 3. Where the Mess Remains
  While Bayesianism avoids the *logical* collapse of Popper's verisimilitude, it inherits a different set of problems regarding the "Less Wrong" slogan.

  #### The Problem of the Prior
  If "getting less wrong" means updating toward the truth, your starting point matters. If your prior assigns 0 probability to the truth, no amount of evidence will save you (Cromwell's Rule). The rationalist answer is "use a universal prior" or "don't assign 0 or 1," but in practice, humans (and algorithms) have bounded hypothesis spaces. We literally cannot conceive of the true theory sometimes (e.g., quantum mechanics was inconceivable to a Newtonian prior).
  *   **Implication:** You can only get "less wrong" within the manifold of hypotheses you can currently imagine.

  #### The Problem of "Truth" vs. "Compression"
  Modern machine learning (which heavily influences modern LW thought) suggests that "truth" might not be a single point. Overfitting is "memorizing the truth" of the training data, but it fails on new data. "Getting less wrong" often means finding a simpler model that generalizes better, even if it has higher error on past data.
  This aligns with **Minimum Description Length (MDL)**. Here, "less wrong" means "more compressive of the data." This is a pragmatic definition of truthlikeness that sidesteps ontology entirely.

  ### 4. Summary: Is "Less Wrong" Coherent?
  **Yes, but not for the reason Popper thought.**

  1.  **Popper's Version:** Incoherent under his specific logical definition. Fixed by modern "similarity" theories of verisimilitude, but rarely used in practice.
  2.  **Bayesian Version:** Coherent. "Less Wrong" = "Lower Expected Log Loss" or "Lower KL Divergence from Reality."
      *   This is mathematically well-defined.
      *   It allows ranking of false models (a model with 99% confidence in a false outcome is "more wrong" than one with 51%).
      *   It avoids the Miller-Tichý collapse because it measures *distance*, not *logical content*.

  **The Caveat:** The Bayesian version only guarantees convergence to *Truth* if Truth is in your hypothesis space. If it isn't, it guarantees convergence to the *most useful falsehood*.

  For the Less Wrong community, this is usually an acceptable trade-off. The goal isn't Capital-T Truth (which is inaccessible); the goal is **systematic error reduction**. As long as your scoring rule is proper and you update on evidence, you are mathematically guaranteed to be "less wrong" tomorrow than you were today in terms of predictive accuracy, even if you never reach the destination.

  So, the name holds up, provided you interpret "Wrong" as "High Prediction Error" rather than "Logical Falsity."
