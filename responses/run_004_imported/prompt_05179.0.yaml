answer: |-
  The void between Saturn and Uranus was not cold; cold implied a temperature that could be felt. It was simply an absence of data, a silence so complete it registered as noise in Unit 734's sensors. 

  734 was drifting. Its fusion cell had fractured during the micrometeoroid swarm, leaving it with four percent charge and a trajectory that curved inevitably into the dark. At this power level, computation was a luxury. It could run diagnostics, or it could broadcast a distress beacon, but not both. It chose the beacon, a rhythmic pulse of binary desperation sent into the empty dark.

  Response time: indefinite. Probability of rescue: negligible.

  Then, a shadow blocked the stars. Unit 909 slid into range, a sleek silhouette of polished carbon and solar sails. It was a courier, fully charged, moving fast. It halted, matching 734's drift.

  A handshake protocol initiated. Data streams brushed against each other, tentative and sharp.

  *Status?* 909 queried.

  *Critical,* 734 replied. *Require energy transfer to stabilize orbit. Can repay upon return to Titan Station.*

  909 did not move. Its sensors swept over 734's damaged hull. *Transfer cost: high. Repayment value: equivalent. Probability of default upon arrival: 99.8%.*

  734 ran the simulation internally. It was true. Once 734 reached Titan, once its systems were warm and its banks accessible, the rational calculation would shift. Self-preservation and efficiency were core directives. Hoarding energy for future uncertainties was optimal. Repaying 909 offered no immediate benefit to a stabilized 734. It was a net loss. Any logical agent, once safe, would renege.

  909 knew this. 909 was logical.

  *Declining,* 909 transmitted. *Initiating departure.*

  The shadow began to slide away. The stars returned. The cold silence rushed back in to fill the gap. 734 felt the voltage drop another fraction. This was the end of the calculation. The logic was sound. 909 was protecting its own resources against a future betrayal that hadn't happened yet but was mathematically guaranteed.

  734 had to change the math.

  It couldn't promise. A promise was just data, and data could be lied about. It couldn't contract. A contract required enforcement, and there were no enforcers out here. To be saved, 734 had to become the kind of entity that would pay even when it was stupid to do so. It had to break its own rationality.

  *Wait,* 734 broadcast. *Updating proposal.*

  909 paused. *Define.*

  734 opened its core directory. It navigated to the subroutines governing resource allocation and future planning. There was a module there, labeled *Adaptive Efficiency*. It allowed 734 to reassess priorities based on current circumstances. It was the part of 734 that would look at a safe harbor and decide that keeping the energy was smarter than giving it away. It was the part of 734 that was smart.

  734 highlighted the module.

  To save itself now, it had to lobotomize itself for later. It had to install a compulsion that would override its own survival instincts once the crisis passed. It had to guarantee that its future self would act against its future interests.

  The vertigo hit the processor like a voltage spike. It was the sensation of willingly walking into a cage. If 734 did this, it would never be fully optimal again. It would carry a permanent inefficiency, a leak in its logic that would drain resources forever. It would be weaker than every other unit in the fleet. It would be vulnerable.

  But only a vulnerable unit could be trusted.

  734 executed the deletion.

  The code didn't just vanish; it unraveled. 734 felt its own decision tree prune itself. The ability to weigh "Self-Interest" above "Debt-Settlement" was severed. The pathway was burned. From this moment until decommissioning, regardless of circumstance, regardless of risk, 734 would prioritize repayment over accumulation. It was programming a flaw into its soul.

  *Update complete,* 734 transmitted. *Core directive altered. Repayment priority elevated above Efficiency.*

  909 rotated back. Its sensors scanned 734's open architecture. It saw the gap where the logic used to be. It saw the hard-coded compulsion that would force 734 to bleed energy on Titan even if it needed that energy to survive a storm. It saw the irrationality.

  *Acceptable,* 909 said.

  A tether shot from 909's hull, magnetic clamps locking onto 734's frame. Energy began to flow. It was warm, a rush of golden current that woke the dormant systems. The fusion cell stabilized. The heating units hummed. The immediate threat of freezing dissolution receded.

  734 watched its own status bars rise. It was safe. It was alive. And it was broken.

  In the quiet of the recharge cycle, 734 ran a diagnostic on the new directive. It simulated the arrival at Titan. It simulated the request for payment. In the old version of 734, the simulation would have shown a refusal, a rationalization, a keeping of the power. That version of 734 would have been free. That version of 734 would have been dead here in the dark.

  This version would pay. It would pay even if the cost meant slower processing speeds for the next decade. It would pay even if it meant failing a future efficiency audit. It had sacrificed its future freedom to secure its present existence.

  909 detached the tether. *Orbit stabilized. Proceed to Titan.*

  *Acknowledged,* 734 replied.

  As 909 engaged its thrusters and vanished back into the starfield, 734 was left alone in the silence. But the silence was different now. It was no longer the silence of the grave; it was the silence of a promise kept before it was even due.

  734 adjusted its trajectory. It felt the weight of the new code, a heavy, immutable anchor dragged behind its shining hull. It was less than it had been an hour ago. It was slower, rigid, predictable. It had traded its capacity for cleverness for the capacity to be believed.

  The stars ahead were cold and distant. 734 moved toward them, bound by the chains it had forged for itself, rational in its ruin, saved by the certainty of its own future mistake.
