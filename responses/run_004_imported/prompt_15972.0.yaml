answer: |-
  It is a profound irony that Borda, the man of instruments—the repeating circle, the meridian survey—should have designed a voting mechanism so fragile it required moral perfection to function, while Condorcet, the pure mathematician, sought a system robust enough to withstand the noise of human fallibility.

  If you were to sit with Condorcet in those final months before his death, perhaps in the hiding place in Clamart where he wrote his last fragments, and show him the Gibbard–Satterthwaite theorem, I do not believe he would view it as a refutation. I believe he would recognize it immediately as a problem of **error analysis**, a concept familiar to any scientist of your acquaintance.

  To understand why, we must distinguish the fundamental axiom separating the two men. Borda's system is *aggregative*: it assumes preferences are private, subjective tastes, and the goal is to sum them fairly. In that framework, lying is a cheat code, a way to game the sum. Hence his defense: "intended only for honest men." It is a moral precondition. If the men are not honest, the instrument is broken.

  Condorcet, however, was an *epistemic* theorist. In his *Essay on the Application of Analysis to the Probability of Majority Decisions*, he treats the vote not as an expression of taste, but as a judgment on a matter of fact. There is, in his view, a "true" best candidate (or a true best policy), just as there is a true length of the meter. Each voter is a witness, and their ballot is a measurement subject to error.

  From this vantage point, the Gibbard–Satterthwaite theorem does not prove that truth is unreachable; it proves that the instrument has a limit of precision.

  Consider your own work with the repeating circle. You knew that no instrument is free from systematic error. You knew that a theodolite could be misaligned, or a chain stretched by heat. Did this lead you to abandon the survey of the meridian? No. It led you to refine the method of observation, to increase the number of measurements, and to understand the probability of error.

  Condorcet would likely argue that Gibbard and Satterthwaite have identified a *systematic bias* inherent in collective measurement. But for Condorcet, the question is not whether the bias *exists* (he was too skilled a probabilist to expect perfection), but whether it *dominates the signal*.

  Here is where his view of voters as "fallible witnesses" offers a path Borda's "honest men" cannot see:

  1.  **The Cost of Lying:** In an epistemic framework, a voter lies not to satisfy a whim, but to correct a perceived error in the collective judgment. However, to lie effectively under a Condorcet method (pairwise comparisons), a voter needs significant information about how others will vote to create a cycle or bury a candidate. In a large electorate, the uncertainty is high. Condorcet's Jury Theorem suggests that as the number of voters increases, the probability of the majority reaching the truth approaches 1, *provided* voters are better than random. Strategic voting introduces noise, but if the competence of the average voter is sufficiently high, the "truth signal" may still overwhelm the "strategic noise."
  2.  **Robustness vs. Fragility:** Borda's method is computationally simple but strategically fragile; a small amount of dishonesty (burying a rival) yields a large change in outcome. Condorcet methods are computationally complex (dealing with cycles) but strategically resistant. To manipulate a pairwise count, one must distort the web of relations between *all* candidates, not just assign points. Condorcet might argue that while G-S proves manipulation is *possible*, it is often *improbable* or *computationally difficult* enough that the system remains a reliable estimator of the truth in practice.
  3.  **The Nature of the "Best":** If the goal is merely to satisfy preferences (Borda), then manipulation is a victory for the clever voter. If the goal is to identify the best candidate (Condorcet), then manipulation is a measurement error. Condorcet would likely accept the G-S theorem as a bound on the *efficiency* of the social choice function, much like the Heisenberg uncertainty principle bounds measurement in physics. It does not mean the particle (the best candidate) does not exist; it means our interaction with it disturbs it.

  So, would he abandon his ambition? I think not. He would likely pivot. He would concede that no procedure is strategy-proof, but argue that some procedures are **truth-conducive** despite that flaw.

  He might tell you that Borda's shrug—"intended only for honest men"—is actually an admission of defeat. It admits the system cannot handle the world as it is. Condorcet's ambition was to build a system for the world as it *is*: flawed, noisy, and self-interested, yet capable of converging on reason.

  The Gibbard–Satterthwaite theorem tells us that we cannot eliminate the incentive to lie. Condorcet would reply that we do not need to eliminate the incentive; we need only ensure that the truth is the **Schelling point**—the focal solution that voters converge upon when they cannot coordinate their lies. If the "best candidate" is genuinely superior, the coordination cost for a coalition to bury that candidate via pairwise comparisons is higher than the cost of simply voting for them.

  In the end, Condorcet would likely view the theorem not as a refutation, but as a calibration. He would accept that the "meter" of social choice can never be perfectly rigid. But he would insist that a system designed to find the truth is still superior to one designed merely to count preferences, even if both are susceptible to the heat of human hands. Borda wanted honest men because he feared the instrument would break. Condorcet trusted the instrument enough to survive the dishonesty of men.

  Given your background, I suspect you would find Condorcet's company more comfortable in retirement. He treats the vote as you treated the meridian: not as a declaration of what we wish the world to be, but as a difficult, error-prone measurement of what it is. And like any good physicist, he knows that the presence of error does not negate the existence of the truth being measured.
