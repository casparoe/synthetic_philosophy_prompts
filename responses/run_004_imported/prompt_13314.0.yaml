answer: |-
  An interrogator leans across the table. "Where are the documents?"

  The spy, attempting to deceive, says, "I ate them all. Every single page."

  The interrogator sighs. "So you're not going to tell me."

  "No!" the spy insists. "I was trying to make you believe I ate them!"

  "You can't," the interrogator replies. "That was a flout, not a violation. You were too obvious."

  "I wanted to violate the Maxim of Quality!"

  "You can't violate Quality overtly. The moment I notice you're lying, you're back in the Cooperative Principle. You've just implicated that you won't answer."

  The spy slumps in his chair. "I was too cooperative to be a liar."

  "Exactly," says the interrogator. "Now try again. And this time, don't be so helpful."
