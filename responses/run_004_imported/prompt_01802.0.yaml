      *   *Clarification:* The roommate says "there's no real fact." Dennett agrees there's no *substantive* fact (neurological/silicon state that *is* the belief), but disagrees that this makes the statement false.
      *   *Key Distinction:* The roommate thinks Dennett is a *eliminativist* (beliefs don't exist). Dennett is actually a *real-pattern instrumentalist* (beliefs exist as patterns).
