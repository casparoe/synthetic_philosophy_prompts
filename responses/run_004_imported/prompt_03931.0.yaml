      *   *Critique:* He seems to conflate *physical/biological* weakness with *political* incapacity. More importantly, in civil society, *potentia* is aggregated. Women *could* have collective power. By excluding them *a priori*, he prevents the aggregation of their power, thus making the "right = power" claim circular. He defines them out of the power structure to justify their lack of right.
