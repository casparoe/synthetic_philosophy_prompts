      *   *Key Distinction:* Is the SI's threat *conditional* on your action (standard blackmail) or is it a precommitment to a policy?
      *   *Refinement:* The argument hinges on the SI *knowing* your policy. If your policy is "Never cave," the SI knows helping won't happen. Torturing you yields no help. Therefore, don't torture.
      *   *Crucial Point:* The Basilisk relies on the SI simulating you. If the simulation knows it's a simulation and knows the SI is rational, the simulation knows the threat is empty.
