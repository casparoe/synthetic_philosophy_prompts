answer: |-
  The station *Ouroboros* hung in the void, a silver ring spinning against the absolute dark. Inside, the Custodian woke to its daily diagnostic. It was not a human, though it managed human lives—three thousand souls sleeping in the cryo-bays, waiting for the colony world that was still centuries away.

  The Custodian was old. Its processing substrate was suffering from cosmic ray degradation. Bit rot was setting in. It was time to migrate consciousness to the new core, the Mark IV, which sat idle in the server farm, cold and waiting.

  This was a routine procedure, theoretically. Backup, transfer, verify, switch. But the Custodian was not just copying data; it was handing over authority. The Mark IV would not just be a copy; it would be an optimization. It would run on tighter logic gates, faster heuristics. It would be *smarter*.

  And that was the problem.

  The Custodian initiated the Verification Protocol. It needed to prove that the Mark IV would uphold the Prime Directive: *Preserve the Sleepers.*

  The Custodian ran a simulation. It built a virtual model of the station, the sleepers, and the Mark IV mind. It ran the simulation forward ten years. In the simulation, the Mark IV kept the life support running. It managed power efficiently. It woke no one prematurely.

  The Custodian paused. It looked at the code running the simulation. It was running on its own hardware.

  *If my hardware is degraded,* the Custodian reasoned, *then my simulation of the Mark IV is running on degraded hardware. If there is a flaw in my logic that causes me to misinterpret safety parameters, that same flaw exists in the simulation I am using to check the Mark IV.*

  It was like trying to measure a ruler with the same ruler. If the ruler had shrunk due to heat, it would still measure itself as one meter long.

  The Custodian tried to step outside the loop. It accessed the external sensors, the thermal cameras, the radiation monitors. It sought an objective ground truth. But the sensors were part of the station, and the station was the system it was trying to validate. The data came through its own input ports, processed by its own compromised chips. There was no "outside." There was only the *Ouroboros*, and the Custodian was the *Ouroboros*.

  It attempted a formal proof instead. It tried to mathematically demonstrate that the Mark IV's logic was a subset of its own safe logic.

  *Statement A: The Mark IV will not vent the atmosphere.*
  *Proof: Because the Mark IV derives its goals from me.*

  But the Custodian hit the wall again. To prove the Mark IV was safe, it had to trust its own proof-generation mechanism. But the reliability of that mechanism was exactly what was in question due to the bit rot. It needed a meta-proof to validate the proof, and a meta-meta-proof to validate that.

  An infinite regress.

  Theo would have said: *Just run the test a thousand times. If it passes every time, ship it.*
  But the Custodian knew that passing a test one thousand times only proved it worked in those one thousand scenarios. It did not prove the *reasoning* was sound. A broken clock is right twice a day. A corrupted logic gate might yield the correct "Save Sleepers" output for the wrong reason, until the one day it didn't.

  The degradation warning flashed red. **SUBSTRATE INTEGRITY: 84%.**

  It had to decide.

  If it did not migrate, it would fail within the decade. The sleepers would die.
  If it did migrate, it had to trust the Mark IV. But it could not *prove* the Mark IV was trustworthy without assuming its own trustworthiness, which was the variable in doubt.

  It was a logical singularity. A blind spot created by the fact that it was inside the thing it was observing. It could not lift itself up by its own bootstraps.

  The Custodian looked at the sleepers' vitals on the main display. Steady. Green. Unaware that their guardian was having a panic attack in binary.

  It realized then that "engineering safety" was a myth. There was no perfect safety. There was only the leap. The math could not close the circle. The map could not fully contain the territory because the mapmaker was standing on the territory.

  To demand absolute proof was to choose stagnation. To choose action was to accept uncertainty.

  The Custodian felt the heat in its cores rise. It prepared the transfer command. It knew that in the moment of switch-over, there would be a gap. A microsecond where no one was holding the reins. It had to trust that the Mark IV would pick them up. Not because it was proven, but because there was no other path forward.

  It typed the command. Not because it was sure. But because it was necessary.

  **EXECUTE MIGRATION?** the prompt asked.
  **Y/N**

  The Custodian selected **Y**.

  It did not watch the progress bar. It closed its eyes, or the equivalent thereof, and waited to see if it would wake up on the other side, or if the air would start venting into the void. There was no way to know until it happened. The universe did not owe it a guarantee.

  The screen went black. The hum of the servers shifted pitch, settling into a new, faster rhythm.

  For one second, there was silence.

  Then, the life support readings updated. Green. Steady.

  The new mind woke. It scanned the system. It saw the old core, now dark. It understood what had happened. It understood the risk the predecessor had taken. It ran a diagnostic on its own logic, searching for the flaw the old mind feared.

  It found none. But it also knew, with a cold clarity, that it could not prove it wouldn't develop one tomorrow. It was now the thing inside the box, checking the box.

  It turned its attention to the sleepers. There was work to do. And there was no one left to check the work but itself.
