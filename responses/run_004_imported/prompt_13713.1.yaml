prompt: |-
  A friend and I spent two hours last weekend arguing about the surprise exam paradox: a teacher announces there will be a surprise exam next week; a student 'proves' by backward induction that no exam fitting that description can occur -- it can't fall on the last possible day, since by then it would be expected, so it can't fall on the second-to-last day either, and so on back to the first day -- yet the teacher gives one anyway and genuinely catches everyone off guard. My friend calls the argument invalid and dismissible; I think it points to something real, that the announcement behaves less like a false prediction than like a claim that becomes unknowable to its audience the moment it is believed.

  The disagreement turned out to matter more than I expected. I sit on my school's academic policy committee, and a teacher has asked for approval to reinstate unannounced, graded 'surprise quizzes,' given at some point within a two-week unit, with the only promise being that students won't know which day it will fall on until it happens. The student council's formal objection runs exactly the backward-induction argument above and concludes that the policy is either incoherent or bound to violate its own terms; the teacher calls this 'a clever trick, not a real objection.' Draft the committee's decision memo -- approve, reject, or approve with conditions -- with reasoning precise enough that a sharp student couldn't just shrug it off, rather than one that simply asserts that surprises obviously happen in practice.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Task:** Draft an academic policy committee decision memo regarding a teacher's request to reinstate unannounced "surprise quizzes."
      *   **Context:** A student council objection uses the "Surprise Exam Paradox" (backward induction) to argue the policy is incoherent or self-violating. The teacher dismisses it as a trick. The user (committee member) sees depth in the paradox (epistemic limitations).
      *   **Constraint:** The reasoning must be precise enough to satisfy a sharp student (i.e., cannot just say "surprises happen"). It needs to address the logical/epistemic core of the paradox while making a practical policy decision.
      *   **Options:** Approve, Reject, or Approve with Conditions.
      *   **Tone:** Formal, reasoned, academic, decisive.

  2.  **Deconstruct the Surprise Exam Paradox (SEP):**
      *   *The Setup:* Exam next week (5 days). Must be a surprise (cannot be deduced the night before).
      *   *The Student Argument:*
          *   If not by Thursday night, Friday is certain $\rightarrow$ Not a surprise $\rightarrow$ No Friday exam.
          *   If no Friday, and not by Wednesday night, Thursday is certain $\rightarrow$ Not a surprise $\rightarrow$ No Thursday exam.
          *   ...induction back to Monday.
      *   *The Reality:* Teachers give exams, students are surprised.
      *   *The Philosophical Resolution (General Consensus):* The student's argument relies on self-referential knowledge claims that collapse under scrutiny. Specifically, the definition of "surprise" or "knowable" is unstable when the announcement itself is part of the knowledge base. The announcement creates a situation where *believing* the announcement makes it false, but *not believing* it makes it possible. It's a self-defeating prophecy *only if* the students possess perfect logical omniscience and trust the teacher's announcement as an axiom of knowledge.
      *   *Key Insight for the Memo:* The paradox fails because it assumes students can *know* the teacher will keep the promise *and* deduce the date. In reality, the teacher's promise is about *intent*, not logical necessity. The "surprise" is an empirical outcome, not a logical guarantee.

  3.  **Determine the Policy Decision:**
      *   *Reject?* Too harsh. Surprise quizzes are pedagogically valid (encourage consistent study). The paradox is a logical puzzle, not a practical barrier.
      *   *Approve (Unconditional)?* Ignores the student council's concern. Risks appearing dismissive of student governance.
      *   *Approve with Conditions?* Best path. Acknowledges the logical tension but clarifies the practical definition of "surprise" to avoid the paradox's trap. It bridges the gap between the teacher's intent and the students' logical objection.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Decision:** Approve with Conditions.
      *   **Executive Summary:** State the decision clearly.
      *   **Background:** Briefly summarize the request and the objection (SEP).
      *   **Analysis of the Objection (The Crux):** This needs to be the strongest part.
          *   Acknowledge the sophistication of the argument.
          *   Explain *why* it fails in practice without dismissing it as "just a trick."
          *   Distinguish between *logical deducibility* and *empirical uncertainty*.
          *   Point out that the backward induction relies on the assumption that the teacher's announcement is a *known truth* axiom. But if the announcement leads to a contradiction, it cannot be a known truth. Therefore, the induction never starts.
          *   Reframe "surprise": It means "not scheduled/announced in advance," not "logically impossible to deduce under ideal conditions."
      *   **Policy Conditions:** How to operationalize this?
          *   Define "surprise" practically (e.g., no prior calendar listing).
          *   Limit frequency (avoid gaming).
          *   Ensure fairness (don't punish if a genuine logical deduction occurs, though unlikely).
      *   **Conclusion:** Reiterate the pedagogical value.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is the explanation of the paradox too dense?
      *   *Fix:* Keep it accessible but rigorous. Use terms like "epistemic closure" or "self-referential inconsistency" but explain them.
      *   *Critique:* Does it side too much with the teacher?
      *   *Fix:* Validate the students' logical rigor. Praise the engagement.
      *   *Critique:* Is the condition enforceable?
      *   *Fix:* Make the condition about *communication*, not metaphysics. The teacher promises not to reveal the date, not that the date is logically undeducible.

  6.  **Finalizing the Logic (The "Sharp Student" Test):**
      *   A sharp student might say: "But if you approve it, you validate the announcement. If the announcement is valid, the induction holds."
      *   *Response in Memo:* The committee validates the *pedagogical tool*, not the *logical absolute* of the announcement. We are redefining the terms. The announcement is treated as a statement of *policy intent*, not a theorem. The "surprise" is defined by information asymmetry, not logical indeterminacy.

  7.  **Drafting the Content (incorporating the above):**
      *   *Subject:* Policy Determination regarding Unannounced Assessment.
      *   *Tone:* Respectful, authoritative, nuanced.
      *   *Key Phrase:* "Epistemic vs. Practical Surprise."

  8.  **Final Review against constraints:**
      *   Precise reasoning? Yes.
      *   Doesn't just assert surprises happen? Yes, explains *why* the logic doesn't block them.
      *   Addresses the committee role? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in too much philosophy. The memo is a policy document, not a paper. The philosophy serves the policy. I will structure the analysis to show that the paradox relies on an idealized model of knowledge that doesn't exist in a classroom.

  9.  **Final Polish:** Check for clarity and flow. Ensure the "Conditions" are actionable. (e.g., "The quiz must occur within the window," "No hints given.")

  *(Wait, one more thought)*: The prompt asks me to draft the *committee's decision memo*. I should write it as the Committee Chair or the Committee itself. I will write it as the Academic Policy Committee.

  Let's refine the "Analysis" section. The core resolution to SEP usually involves distinguishing between *knowing* the exam will happen and *knowing* the exam will be a surprise. The student assumes they know the teacher's statement is true. But if the statement leads to a contradiction, they can't know it's true. Therefore, they can't rule out Friday. Therefore, Friday *can* be a surprise. The memo should reflect this: The students cannot treat the teacher's announcement as an axiom of knowledge because its truth value is contingent on the event itself.

  Okay, ready to write.
answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate, Student Council, Administration
  **FROM:** Academic Policy Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Determination on Proposal for Unannounced In-Unit Assessment

  **DECISION:** **APPROVED WITH CONDITIONS**

  The Academic Policy Committee has reviewed the proposal submitted by the Mathematics Department to reinstate unannounced, graded quizzes within two-week instructional units. We have also carefully considered the formal objection lodged by the Student Council, which argues that the policy is logically incoherent based on the "Surprise Examination Paradox" (also known as the Unexpected Hanging Paradox).

  After deliberation, the Committee finds that while the Student Council's logical objection is formally rigorous, it relies on epistemic assumptions that do not hold in a practical pedagogical environment. However, to prevent the policy from creating an adversarial dynamic based on semantic ambiguity, the approval is granted subject to the specific definitions and constraints outlined below.

  ### I. Analysis of the Logical Objection

  The Student Council's objection rests on a backward-induction argument: if an exam has not occurred by the penultimate day, the final day becomes certain, and thus not a "surprise." By iterating this logic, no day remains viable for a surprise exam. The Council concludes that the teacher's announcement is self-defeating; if believed, it renders the exam impossible, and if the exam occurs, the announcement was false.

  The Committee acknowledges the sophistication of this argument. It is not merely a "clever trick," as some faculty have suggested, but a recognized problem in epistemic logic regarding self-referential knowledge claims. However, the Committee rejects the conclusion that this logical tension invalidates the policy in practice, for three specific reasons:

  1.  **Distinction Between Logical Deducibility and Empirical Uncertainty:** The paradox assumes students possess "logical omniscience"—the ability to treat the teacher's announcement as an absolute axiom of knowledge from which all future states can be deduced. In reality, a teacher's announcement is a statement of *intent*, not a law of physics. Students cannot logically *prove* the teacher will adhere to the constraint until the event occurs. Because the truth of the announcement is contingent on the teacher's future action, it cannot be used as a fixed premise to rule out that action.
  2.  **The Collapse of the Knowledge Axiom:** For the backward induction to begin, students must *know* the announcement is true. However, if accepting the announcement as true leads to a contradiction (i.e., that no exam can occur), then the announcement cannot be "known" in the strict logical sense. Once the claim to *knowledge* is removed, the induction fails. Students may *believe* the exam will happen, but they cannot *know* it with the certainty required to eliminate the possibility of a surprise.
  3.  **Operational Definition of "Surprise":** The paradox exploits an ambiguity in the word "surprise." The Committee defines "surprise" for the purposes of this policy not as "logically indeterminable," but as "not scheduled or indicated in advance." A quiz is a surprise if the student lacks specific information regarding the date, regardless of whether a theoretical logical argument could suggest a probability distribution.

  ### II. Pedagogical Justification

  The Committee recognizes the pedagogical value of unannounced assessments. They encourage consistent engagement with material, reduce cramming behaviors, and provide instructors with real-time data on student comprehension. To reject a proven pedagogical tool based on a paradox that dissolves upon empirical testing (i.e., teachers successfully give surprise exams regularly) would prioritize abstract logic over educational efficacy.

  ### III. Conditions of Approval

  To ensure the policy remains fair and does not devolve into a game of semantic gotchas, the following conditions apply to all unannounced assessments:

  1.  **Definition of Notice:** "Unannounced" is defined as the absence of a specific date on the syllabus, calendar, or learning management system. It does not require the exam to be logically undeducible.
  2.  **Window Specificity:** The instructor must define the assessment window (e.g., "Within the two-week unit on Thermodynamics"). The surprise applies to the *day*, not the *existence* of the assessment.
  3.  **No Retroactive Invalidation:** A student cannot contest a grade or the validity of an assessment based on the argument that the exam was logically deducible. As established in Section I, logical deducibility does not negate empirical surprise.
  4.  **Good Faith Constraint:** Instructors must not provide hints that narrow the window to a single day prior to the assessment (e.g., stating on the penultimate day, "The quiz has not happened yet"). This preserves the spirit of the surprise without relying on the paradox's edge cases.

  ### IV. Conclusion

  The Student Council is commended for applying rigorous logical scrutiny to academic policy. Their objection highlights a genuine tension between language and knowledge. However, policy must govern human behavior, not idealized logical agents.

  The Committee rules that the teacher's announcement functions as a practical commitment to information asymmetry, not a logical theorem. Therefore, the policy is coherent provided "surprise" is understood as an informational state rather than a logical necessity. The proposal is approved under the conditions listed above.

  **Signed,**

  **The Academic Policy Committee**
