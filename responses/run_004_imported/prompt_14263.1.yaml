      *   *The "Universal" Content:* Hegel distinguishes between the *physical object* (the book copy) and the *mental content* (the ideas/method). In *Philosophy of Right*, he argues that when you sell a physical copy, you don't necessarily sell the right to reproduce the "universal" aspect (the intellectual content).
