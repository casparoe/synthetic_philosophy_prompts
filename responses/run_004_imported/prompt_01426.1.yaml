prompt: |-
  Quick one from office hours today—I'm teaching a seminar that pairs classical Islamic philosophy with early modern empiricism, and this week we did Hume on causation right after finishing al-Ghazali's Incoherence of the Philosophers (the 17th discussion, with the fire and cotton example). One of my sharper students put her hand up and said something like: "isn't al-Ghazali basically doing Hume's job 600 years early? They both deny theres any necessary connection between cause and effect, they both fall back on habit/custom to explain why we expect fire to burn cotton, and they even use almost the same example (Hume's got flame and heat, Ghazali's got fire and cotton)." Half the room nodded along, and honestly I didn't have a great answer on the spot beyond "well, one of them believes in God and the other doesn't," which felt pretty thin even as I said it.

  Now im second-guessing my own lecture notes, which basically frame al-Ghazali's occasionalism as a medieval dress rehearsal for Humean skepticism about induction. Is that actually a defensible way to teach it, or am I flattening a real difference between the two positions just because the surface-level argument (no necessary connection, only constant conjunction/custom) looks so similar? Genuinely not sure - would love your honest take before I revise the slides for next year.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a philosophy professor teaching a seminar pairing classical Islamic philosophy (al-Ghazali) with early modern empiricism (Hume).
      *   **Specific Topic:** Causation, specifically al-Ghazali's *Incoherence of the Philosophers* (Tahafut al-Falasifa), Discussion 17 (fire/cotton) vs. Hume's *Enquiry Concerning Human Understanding* (flame/heat).
      *   **The Problem:** A student pointed out the striking similarities (denial of necessary connection, reliance on habit/custom, similar examples). The professor gave a weak answer ("one believes in God, the other doesn't") and is now questioning their lecture notes which frame al-Ghazali as a "medieval dress rehearsal for Humean skepticism."
      *   **The Question:** Is framing al-Ghazali as a precursor to Hume defensible, or does it flatten crucial differences? What's the honest take?
      *   **Tone:** Professional, academic, collegial, nuanced, honest.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Similarity:* Yes, the surface structure is incredibly similar. Both deny *logical* necessity in causal relations. Both appeal to habit/custom (*ada* for Ghazali, *custom* for Hume). Both use fire/combustion examples.
      *   *Difference:* The *metaphysical grounding* is radically different.
          *   Al-Ghazali: Occasionalism. God is the *only* true agent. The connection is broken to preserve Divine Omnipotence and Freedom. It's a theological move, not a skeptical one. He *knows* what's happening (God does it).
          *   Hume: Skepticism/Empiricism. We cannot know the "secret powers" or necessary connection. It's an epistemological limit. He doesn't posit God as the immediate cause of every event in the same way (though he leaves room for religion, his argument stands on human psychology).
      *   *The "God" Answer:* The professor's on-the-spot answer ("one believes in God") was indeed thin because al-Ghazali's God isn't just a belief add-on; it's the *mechanism* of the causation. Hume's skepticism is about human cognitive limits.

  3.  **Structure the Response:**
      *   **Validation:** Acknowledge the student's sharpness and the professor's honesty. It *is* a common and tempting comparison.
      *   **The "Yes" (Surface Similarities):** Validate why the comparison works textually. (Denial of necessity, habit, examples).
      *   **The "No" (Deep Divergence):** Explain the crucial metaphysical vs. epistemological distinction.
          *   Al-Ghazali: Ontological claim (God does it). Certainty about the *real* cause.
          *   Hume: Epistemological claim (We can't know). Agnosticism/Skepticism about the *real* cause.
      *   **The "Habit" Distinction:** *Ada* (God's consistent habit) vs. Custom (Human psychological habit).
      *   **Pedagogical Advice:** How to teach this without flattening. Use the similarity as a hook, then pivot to the divergence.
      *   **Conclusion:** Reassure the professor that the "dress rehearsal" framing is risky but fixable.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Point 1: The Student is Right (sort of).* The textual parallel is undeniable. Scholars like Marmura and Perler have noted this. It's not a bad reading, just an incomplete one.
      *   *Point 2: The Metaphysical vs. Epistemological Split.* This is the core. Al-Ghazali isn't skeptical that causation exists; he's skeptical that *created things* cause. He replaces natural causation with Divine Volition. Hume is skeptical that *we can know* if causation exists as a necessary connection.
      *   *Point 3: The Nature of "Habit".* For Ghazali, the regularity is in God's will (Sunna). It *could* change (miracles are real possibilities). For Hume, the regularity is in our minds. We *expect* it. It's about prediction, not ontology.
      *   *Point 4: The "God" Answer.* Why was it thin? Because it sounds like "belief" vs "atheism." It's actually "Theological Occasionalism" vs "Psychological Skepticism."
      *   *Point 5: Teaching Strategy.* Don't throw out the comparison. It's a great heuristic. But add the "Why?" layer. Ghazali = To save God's power. Hume = To save empirical rigor.

  5.  **Refining the Tone:**
