answer: |-
  The silence on the bridge of the *Axiom* wasn't empty; it was heavy, like water pressing against glass. Commander Elara Vance sat alone in the command chair, her hands resting on the console. Across the void, three light-seconds away, hung the *Theorem*.

  They were identical ships. Not just in class, but in configuration. They had launched from the same station, on the same day, carrying the same cargo: the only known sample of the Retro-Viral Countermeasure for the Plague that was currently eating through the inner colonies.

  They had also been given the same orders. The Janus Protocol.

  Communication between the two ships was impossible. The Plague had corrupted the subspace bands; any transmission attempt would be scrambled into noise. They were two brains in separate skulls, floating in the same dark room, unable to speak.

  The Protocol was simple. Each ship had to choose one of two actions within the hour.

  **Option A: Broadcast.** Open your firewall. Transmit the full genomic sequence of the Countermeasure to the other ship.
  **Option B: Secure.** Encrypt your data. Keep the Countermeasure for your own colony. Return home immediately.

  Elara knew the payoff matrix. It was burned into her mind, and she knew it was burned into the mind of Commander Vance on the *Theorem* as well.

  If both chose **Broadcast**, both colonies were saved. The data redundancy ensured the cure could be manufactured anywhere. (Reward)
  If one chose **Secure** and the other **Broadcast**, the *Secure* ship's colony got the cure first, monopolizing production and political power. The *Broadcast* ship's colony might get it later, but likely too late. (Temptation / Sucker)
  If both chose **Secure**, the Plague would mutate during the transit time. The single samples would become useless. Both colonies would fall. (Punishment)

  Standard game theory screamed at her. *Secure.*

  "If I Broadcast," Elara whispered to the empty room, "and they Secure, I condemn my people to death for the sake of theirs. That is negligence."

  She looked at the timer. Twenty minutes.

  "And if I Secure?" she asked. "If I Secure, I guarantee my people's survival *if* they Broadcast. But if they Secure too... we both die."

  The standard rational choice was to Secure. It was the dominant strategy. No matter what the other ship did, *Secure* yielded a better or equal outcome for *her* specific colony. If they Broadcast, she wins big. If they Secure, she at least has the sample in hand (a slim chance) rather than giving it away (zero leverage).

  But Elara couldn't move her hand.

  She closed her eyes. She thought about the *Theorem*. She had met the other Commander Vance. Not a twin, not a clone, but the result of the same selection process. Same psychometric profile. Same training. Same briefing. They were currently sitting in the same chairs, looking at the same timers, breathing the same recycled air.

  They were running the same algorithm.

  "If I decide to Secure," Elara said, her voice trembling slightly, "it is because my reasoning process concluded that Secure is the optimal move."

  She opened her eyes and stared at the comms panel, knowing it was dead.

  "But my reasoning process is identical to hers. We have the same inputs. We have the same logic gates. If my calculation outputs 'Secure', then her calculation *must* output 'Secure'."

  This was the knot. The place where her gut rebelled against her mind.

  "It feels like magic," she muttered. "It feels like I'm trying to control her with my mind. I'm not. She's three light-seconds away. My finger on this button doesn't physically stop her finger."

  That was the sleight of hand. The causal disconnect. Her hand moving here didn't *cause* her hand to move there.

  "But," Elara leaned forward, the chair creaking. "My decision isn't a physical action. It's a logical conclusion."

  She imagined the decision as a mathematical proof.

  *Premise 1: We are identical reasoning agents.*
  *Premise 2: We face identical problems.*
  *Conclusion: We will reach identical solutions.*

  "If I find a reason to Secure," she reasoned, "that reason exists in her head too. If I find a flaw in Broadcasting, she finds the same flaw. I cannot find a reason to defect that she does not also find. Unless I make a mistake. But I am not planning to make a mistake."

  The timer ticked down. Fifteen minutes.

  The standard argument was: *I should defect because I want to maximize my payoff regardless of what she does.*

  Elara shook her head. "No. That assumes her move is independent of mine. It's not. We are correlated. I am not choosing between 'I Cooperate/She Defects' and 'I Defect/She Cooperates'. Those boxes are empty. They are impossible states."

  She visualized the matrix again. The off-diagonal outcomes—the ones where one won and the other lost—were illusions. They required the two Vances to be different people. But they weren't. They were the same person in two places.

  "So I am not choosing between Cooperate and Defect," she said. "I am choosing between the world where we both Cooperate and the world where we both Defect."

  If she chose Secure, she was effectively voting for the universe where both chose Secure.
  If she chose Broadcast, she was voting for the universe where both chose Broadcast.

  "Both Secure means the Plague mutates. Both colonies die."
  "Both Broadcast means the Plague is stopped. Both colonies live."

  The choice was no longer about trust. It wasn't about hoping the other person was nice. It was about recognizing that *she* was the other person.

  A cold sweat broke on her neck. The logic held, but the fear was primal. The fear said: *What if you're wrong? What if she's human and you're a robot? What if she breaks symmetry?*

  "If she breaks symmetry," Elara said, "then she is not reasoning superrationally. She is reasoning causally. If she is reasoning causally, she will Secure. If I know she will Secure, I should Secure."

  She paused.

  "But if I know she will Secure, then *I* will Secure. Which means she knows I will Secure. Which means she knows the outcome is mutual destruction. Would a rational agent choose mutual destruction to avoid the risk of being the sucker?"

  The silence of the bridge seemed to deepen.

  "It's not that my choice changes hers," Elara realized. "It's that my choice *reveals* hers. I am sampling the decision. If I sample 'Defect', I have confirmed that the decision of 'The Commander Vance Entity' is Defect. I have confirmed our doom."

  She looked at her hand. It looked like any other hand. But it was the hand of the only variable that existed. The universe was waiting to see what the function `Vance(Input)` would return.

  If she returned `Defect`, the function returned `Defect` everywhere.
  If she returned `Cooperate`, the function returned `Cooperate` everywhere.

  "There is no 'me' and 'her'," she whispered. "There is only 'us'."

  Ten minutes.

  The causal argument felt safe. *I protect my own.* But it was a lie. Protecting her own required assuming she was distinct from the other ship. But the situation had stripped away their distinctness. They were mirrors.

  If you stand between two mirrors and you raise your left hand, the reflection raises its right. You don't *hope* the reflection cooperates. You don't *threaten* the reflection. You understand that the movement is one event seen twice.

  "I am not pressing a button," Elara said. "I am defining the nature of the event."

  If the event is "Betrayal", we die.
  If the event is "Trust", we live.

  She couldn't force the other ship to trust. But she could refuse to be the source of the betrayal. If she defected, she wasn't just defecting for herself; she was casting the vote for the algorithm that would kill them both.

  Her hand hovered over the console. The 'Secure' key was red. The 'Broadcast' key was green.

  The causal fear screamed one last time. *She might not be like you! She might panic!*

  "If she panics," Elara said, her voice steady now, "then she isn't running the Vance algorithm. She's running a Panic algorithm. If she's running a Panic algorithm, I can't predict her. But if I can't predict her, I can't predict anything. And if I can't predict anything, game theory doesn't apply."

  "But I *am* predicting her. Because I am her."

  She took a breath. She let go of the idea that she was an individual actor in a vacuum. She accepted that she was a node in a logical network. To maximize the output of the network, the node had to process the cooperative instruction.

  It wasn't faith. It wasn't morality. It was the only move that didn't result in a logical contradiction of her own survival.

  "Symmetry," she said.

  Elara Vance pressed the green key.

  **Broadcast Initiated.**

  On the screen, the data stream began to flow, a river of code pouring out into the void, aimed at the *Theorem*.

  She sat back. She didn't know what was happening on the other ship. She never would. But she knew. Because the reasoning that led her finger to the green key was the same reasoning available to the Commander on the *Theorem*.

  If the logic held, the green key was being pressed three light-seconds away, at this exact moment.

  If the logic failed, they were dead anyway.

  But for the first time since the briefing, Elara felt the weight lift. She hadn't gambled. She had solved the equation.

  "Checkmate," she whispered to the silence.

  And in the silence, the data flowed, and the mirrors matched.
