answer: |-
  The diagnosis was Volitional Lag Disorder. It was a new code, barely dry in the ICD-11 addendum, categorized under "Specified Dissociative Motor Conditions."

  Dr. Vane explained it to Elias using a diagram of a circuit board with a frayed wire. "The signal fires," Vane said, tapping the pen against the paper. "The brain intends to move. But the awareness of the intention arrives late. You act, then you realize you've acted. It creates a sense of dispossession. Like you are watching a puppet show where you are both the puppeteer and the audience, but the audio is out of sync."

  Elias exhaled, a sound like a tire losing air. For three years, he had thought he was going mad. He would reach for a coffee cup and feel surprise when his fingers closed around the handle. He would find himself halfway up the stairs before remembering he intended to go to bed.

  "Is it treatable?" Elias asked.

  "Management," Vane corrected. "Cognitive bridging. You learn to anticipate the lag. You narrate your intentions before you execute them. *I am going to lift the cup.* Then you wait for the feeling to catch up."

  Elias left the clinic with a pamphlet and a sense of profound relief. He had a kind. He was a Lagger.

  ***

  The first month was stabilization. Elias followed the protocol. Before opening a door, he whispered, *I am opening the door.* He stood in the kitchen, narrating his breakfast preparation like a sports commentator, waiting for the somatic echo to align with the declaration.

  It helped. The panic receded. But in the quiet spaces between the narration and the action, Elias began to notice the gap. It was spacious there. If the awareness was always going to be late, why rush the intention?

  He started testing the boundaries. He would decide to stand up, but he would wait five seconds before sending the signal, just to see if the lag was consistent. It wasn't. Some days the lag was milliseconds; other days, it felt like minutes.

  He joined the online forum, *The Delayed Self*. There were hundreds of them. They shared coping strategies, but also war stories.

  *User_GhostLimb:* "I caught myself writing an email I didn't remember starting. The lag was huge."
  *User_WaitingRoom:* "Try micro-pausing. If you pause before the move, you can't tell if it's the disorder or just caution."

  Elias read that thread three times. *If you pause before the move, you can't tell.*

  He tried it at work. He was a data entry clerk. Usually, he typed in bursts. Now, he hovered his fingers over the keys. He thought about the keystroke. He waited for the dissociation to kick in, the familiar floaty sensation that confirmed the VLD. Then he pressed.

  Was that the lag? Or was he just hesitating because he was worried about the lag?

  The distinction began to dissolve. To ensure he was experiencing the *true* symptoms of VLD, Elias felt he needed to maximize the conditions under which the lag appeared. He stopped initiating small actions spontaneously. He stopped scratching an itch immediately; he waited to see if the itch would feel like it belonged to someone else's arm. He stopped turning his head when someone called his name, waiting to see if the turn felt automatic.

  He was cultivating the lag to verify the diagnosis.

  ***

  Six months later, the quarterly review at the St. Jude's Neuropsychiatry Institute. Dr. Vane sat at the head of the table, a stack of case files in front of him.

  "The cohort is shifting," said Sarah, a junior resident. "Look at the motor profiles for the VLD group."

  She projected a graph on the wall. It showed reaction times. Six months ago, the data was scattered—a bell curve of delayed responses. Now, the curve had flattened and skewed heavily to the right. The delays were longer. Uniformly longer.

  "They're getting worse," Vane said.

  "Or they're getting better at being VLD," Sarah said.

  Vane rubbed his temples. He had published a paper on Volitional Lag three months prior. It had been picked up by several health blogs. The description of the "audio out of sync" sensation had been quoted verbatim in support group manifestos.

  "I had a patient yesterday," Vane said. "Mr. H. He came in for a follow-up. I asked him to pick up the pen. He sat there for twelve seconds. Then he said, 'I'm waiting for the disconnect.' When he finally picked it up, he asked, 'Did that look like a lag to you?'"

  "He was performing the symptom," Sarah said.

  "He was auditing it," Vane corrected. "He was checking to see if he still qualified."

  The problem was that the treatment required the patient to monitor their volition. But the act of monitoring volition altered the experience of volition. By teaching them to watch for the gap, the clinic had widened the gap. By giving them a vocabulary for the disconnect, they had made the disconnect a place they could live.

  Elias was no longer suffering from a delay in awareness. He was suffering from a surplus of scrutiny. He had become a connoisseur of his own hesitation.

  ***

  Elias sat in the waiting room, watching a woman across from him. She was holding a magazine. She turned a page. She paused. She looked at her hand. She turned another page, slower this time.

  She caught him watching. She didn't look away. She held up her hand, flexed her fingers slowly, deliberately, as if asking: *Is this it? Is this how we do it now?*

  Elias nodded. A small, conspiratorial nod.

  They were no longer people who suffered from a glitch. They were people who maintained a rhythm. The diagnosis had promised them a cure, but it had delivered a script. Before the diagnosis, Elias's hesitation was a private terror, a sign of brokenness. Now, it was a shared etiquette. To move too quickly was suspicious. To act without forethought was to risk being accused of "masking" the disorder, of faking recovery.

  The door opened. "Mr. Thorne?"

  Elias stood up. He felt the familiar urge to walk immediately. He suppressed it. He counted to three. He acknowledged the weight of his feet. He acknowledged the distance to the door. He acknowledged the lag.

  He walked.

  ***

  Dr. Vane watched Elias enter. The gait was distinct. It was the "VLD Gait"—cautious, segmented, punctuated by micro-stops. Every patient in the waiting room walked like that now. Even the ones who, six months ago, had described their symptoms as frantic, jerky movements.

  They had all converged on the same presentation. They had read the literature. They had talked to each other. They had optimized their illness to fit the criteria.

  "Hello, Elias," Vane said. "How have the bridging exercises been?"

  "Consistent," Elias said. He sat down. He didn't sit immediately; he hovered for a moment, then lowered himself. "I'm noticing the lag is more pronounced in the mornings."

  "More pronounced?" Vane asked. "Or are you noticing it more?"

  Elias frowned. "If I notice it more, does that mean the lag is bigger, or that I'm looking harder?"

  "That's the question," Vane said.

  "I don't want to lose the diagnosis, Doctor," Elias said quietly. "If I stop looking for the lag, I'm just... a guy who hesitates. If I keep looking, I'm a patient. I have the accommodations at work. I have the community. If I heal, I lose the name."

  Vane looked at the file. *Volitional Lag Disorder.* It was supposed to be a description of a neurological kind. But it had become a recipe. You take a population of anxious people, give them a description of a specific hesitation, and tell them to monitor it. They will produce the hesitation. They will refine it. They will make it their own.

  The category was eating its own tail.

  "If you heal," Vane said, "you lose the name. Yes."

  "But then what am I?" Elias asked. "Before I was broken. Now I'm a Lagger. If I'm not a Lagger, and I'm still... like this... then what did you give me?"

  Vane looked at his pen. He wanted to pick it up. He felt the impulse. He also felt the sudden, crushing awareness of the impulse. He wondered, for a fleeting second, if he was about to pick it up because he intended to, or because he was reacting to the silence in the room.

  He left the pen on the desk.

  "We might need to revise the criteria," Vane said.

  "Will that change the treatment?"

  "It might change the kind of person you are," Vane said.

  Elias nodded. He looked at his hands. He waited for them to feel like his. He waited for the lag. He found it, or he made it, or he remembered it.

  "I can do that," Elias said. "I'm good at waiting."

  Vane opened the file to the notes section. He hovered his pen over the paper. He thought about writing *Status Quo*. He thought about writing *Iatrogenic Reinforcement*. He thought about writing *Recovery*.

  He wrote nothing. He just watched the ink dry where it had accidentally touched the page, a small black blotch spreading slowly into the fiber, changing the paper simply by being there.
