prompt: |-
  Ok, weird ask, but I need help before Friday. As a novelist I get roped into judging things sometimes, and right now I'm one of five judges for a smallish first-book fiction prize. One of our finalists is a book everyone privately agrees is basically the author's own life -- name changed, timeline compressed, a couple scenes she's admitted to inventing so a chapter would land -- but its shelved and marketed as a novel. Two judges want to disqualify it as memoir in costume; two others say the prize rules never define 'novel' anyway, so this is just people fighting over a label while a genuinely good book sits there unrewarded. I'm the tiebreaker and have to send round a short memo with where I land and why, and it can't just dodge the 'it's only semantics' objection -- if that's right, disqualifying the book is arbitrary, and if it's wrong I need to say what's actually at stake. Can you draft that memo: an actual recommendation on this book, not a both-sides shrug, plus maybe a line on how we handle this next year so we're not back here in twelve months.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Novelist/Judge for a first-book fiction prize.
      *   **Task:** Write a tiebreaker memo to the other four judges.
      *   **Deadline:** Before Friday (implies urgency/professionalism).
      *   **The Conflict:** 2 judges want to disqualify a finalist (it's memoir disguised as fiction); 2 judges want to keep it (rules don't define "novel," it's a good book).
      *   **The Book:** Finalist, marketed as a novel, based closely on author's life (name changed, timeline compressed, some invented scenes).
      *   **Requirements:**
          *   Take a clear stance (no "both-sides shrug").
          *   Address the "it's only semantics" objection (explain what's at stake).
          *   Include a recommendation for future rules/guidelines.
          *   Tone: Professional, persuasive, literary, decisive.

  2.  **Determine the Stance:**
      *   *Option A: Disqualify.* Risks looking gatekeepy, punishes the author for marketing decisions, ignores the fluidity of autofiction.
      *   *Option B: Keep it.* Aligns with contemporary literary trends (autofiction), focuses on the craft rather than the source material, avoids punishing the author for ambiguous rules.
      *   *Decision:* **Keep the book.** Why? Because the prompt asks to address the "semantics" objection. If I disqualify, I have to prove it's *not* a novel, which is hard when scenes are invented. If I keep it, I can argue that *craft* is the defining feature of a novel, not strict factual adherence. This is generally the more progressive and defensible position in modern literary circles, provided I address the integrity of the "fiction" category.
      *   *Core Argument:* A novel is defined by its *methods* (invention, narrative arc, character construction), not its *source material*. If the author invented scenes to make a chapter land, that is the work of a novelist, not a memoirist.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the deadlock and the gravity of the decision. State the recommendation immediately.
      *   **The "Semantics" Argument (The Core):** Address the "memoir in costume" claim.
          *   Distinguish between *material* and *method*.
          *   Highlight the admitted inventions. That's the smoking gun for fiction.
          *   Argue that disqualifying based on biography punishes the author for the publisher's categorization and creates a "truth police" dynamic judges aren't equipped for.
      *   **What's at Stake:** Why does this matter?
          *   It matters because "fiction" prizes reward *imagined* truth, not just *factual* truth.
          *   Disqualifying sets a precedent that we need to fact-check authors' lives.
          *   It narrows the scope of what contemporary fiction can be (ignoring the autofiction tradition).
      *   **Future Proofing:** How to stop this next year?
          *   Clarify rules without being too restrictive.
          *   Focus on "invented narrative" rather than "not true."
      *   **Closing:** Reiterate commitment to the book's quality.

  4.  **Refining the Tone:**
      *   Needs to be respectful to the colleagues (they are peers).
      *   Needs to be firm (I am the tiebreaker).
      *   Needs to sound like a writer (use terms like "narrative architecture," "contract with the reader," "autofiction").
      *   Avoid being preachy.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hey team. I'm voting to keep the book. I know two of you think it's memoir. But the rules say fiction. The author made stuff up. That makes it fiction. If we kick it out, we have to check everyone's bio. That's bad. Next year let's change the rules to say "invented story." Let's give the award to the best book.

      *Critique 1:* Too blunt. Doesn't address the "semantics" objection deeply enough. Needs more nuance on *why* the distinction matters beyond just rules.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      To: Judges. From: Me. Re: The Finalist.
      I recommend we keep the book. The argument is that it's memoir. But memoir and novel differ by method, not just material. She admitted to inventing scenes for narrative effect. That is a novelist's choice. The "semantics" argument says labels don't matter. I say they do, but not in the way you think. The label "novel" promises a certain engagement with truth. If we disqualify, we become fact-checkers. Next year, let's clarify the eligibility to include "autofiction" or emphasize narrative invention.

      *Critique 2:* Better. But needs to be more persuasive on the "what's at stake" part. The prompt specifically asks to explain *what is actually at stake* if the "semantics" objection is wrong.

  7.  **Final Polish (incorporating into the final output):**
      *   Make the distinction between *contract* and *content*.
      *   Emphasize that judging *truth* is impossible; judging *craft* is our job.
      *   Ensure the future recommendation is actionable.

  8.  **Final Review against Constraints:**
      *   Tiebreaker memo? Yes.
      *   Actual recommendation? Yes (Keep it).
      *   Address "semantics"? Yes.
      *   Future handling? Yes.
      *   Tone? Professional/Writerly.

      *(Self-Correction during drafting)*: I should make sure I don't sound like I'm dismissing the memoir advocates. Their concern is integrity. I need to validate their concern while overriding their conclusion. The integrity lies in the *craft*, not the *biography*.

      *(Refining the "Semantics" point)*: The prompt says: "if that's right, disqualifying the book is arbitrary, and if it's wrong I need to say what's actually at stake." I need to explicitly state that the stake is the *definition of the prize's purpose*. Are we rewarding factual fidelity or narrative art?

      *(Final Plan)*:
      1. Header.
      2. Clear Recommendation (Keep).
      3. The "Semantics" Rebuttal (It's about method, not source).
      4. The Stake (Integrity of the judging process & scope of fiction).
      5. Future Rule Change.
      6. Sign-off.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** The Judging Committee, [Name of Prize]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Tiebreaker Recommendation: Eligibility of [Book Title]

  Colleagues,

  Thank you for the rigorous debate over the past week. We are deadlocked 2-2 regarding the eligibility of [Book Title], and as the tiebreaker, I have reviewed the arguments regarding its classification as memoir versus novel.

  **My recommendation is that we retain [Book Title] as a finalist and allow it to remain eligible for the prize.**

  I want to address the concern that this is merely semantic hair-splitting. The two judges arguing for disqualification contend that because the source material is biographical, the "novel" label is a breach of contract. The two arguing for retention contend that the rules are silent on autobiography, so disqualification is arbitrary.

  Both positions miss the actual stake. The stake is not whether the events happened; the stake is **how the material is processed.**

  A memoir is bound by a contract of fidelity to the *record*; a novel is bound by a contract of fidelity to the *narrative*. The author has admitted to compressing timelines and inventing scenes specifically to make chapters "land." That is not the work of a memoirist trying to recall truth; that is the work of a novelist constructing meaning. When an author alters reality to serve thematic resonance or pacing, they are writing fiction, regardless of how closely the protagonist resembles them.

  If we disqualify this book, we are not protecting the integrity of the "Novel" category. We are establishing a precedent that requires this committee to function as fact-checkers of our entrants' biographies. We would be forced to ask: *How much invention is allowed before it becomes a novel? How much truth before it becomes a memoir?* That is a slippery slope that invites subjectivity far more dangerous than the one we face now. We are equipped to judge craft, arc, and voice. We are not equipped to adjudicate the author's life history.

  Furthermore, excluding this work ignores the contemporary tradition of autofiction. If we penalize a book because the life behind it is too visible, we risk narrowing the definition of fiction to only that which is wholly unrecognizable. The prize should reward the excellence of the *writing*, not the obscurity of the *source*.

  **Recommendation:**
  We keep the book. It meets the criteria of narrative invention, and disqualifying it based on biographical proximity sets an unenforceable standard for future cycles.

  **For Future Cycles:**
  To prevent this impasse next year, I propose we amend the eligibility guidelines to read: *"Entries must be works of sustained narrative invention. While works drawing on personal history are eligible, the submission must be marketed and categorized by the publisher as fiction."*

  This places the onus of categorization on the publisher (who markets the book) rather than forcing judges to investigate the author's biography, while still maintaining the requirement that the work be *invented* rather than *recorded*.

  I believe [Book Title] is a strong contender. Let us judge it on the strength of its prose and structure, not the veracity of its backstory.

  Best,

  [Your Name]
