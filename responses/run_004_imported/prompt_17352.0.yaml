      *   Acknowledge the "janky Wordpress" backstory lightly (maybe in the intro or just keep it professional). *Self-correction: Keep it professional but warm. The prompt mentions the Wordpress thing as context for me, not necessarily for the memo.*
      *   Avoid overly academic museum-speak, but show respect for the institution's mission.

