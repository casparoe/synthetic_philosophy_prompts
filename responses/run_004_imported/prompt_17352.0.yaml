          *   *Refutation:* In collecting (guitars *and* computers), provenance *is* part of the object's identity. A museum's job is historical accuracy, not just functional display. If we keep the label, we are actively misleading visitors about history, not just specs.
      *   **The Recommendation:** Relabel.
      *   **Reasoning:**
          *   Integrity/Trust: If we get busted later, it hurts the whole museum.
          *   Educational Value: A "shadow build" is actually a cool story in itself (the early hobbyist scene). It doesn't need to be a 1976 original to be interesting.
          *   Policy: "Originals must be clearly distinguished." This fits that policy better than pretending.
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Tone:**
