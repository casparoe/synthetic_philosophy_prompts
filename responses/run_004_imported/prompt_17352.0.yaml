answer: |-
  **TO:** Collections Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation re: Apple-1 Provenance & Display Status

  Hi everyone,

  Ahead of our vote next month, I want to put forward a recommendation regarding the Apple-1 board currently on the main floor. As you know, the independent authenticator's assessment suggests our unit is likely a "shadow build" from the early 80s rather than a 1976 garage original. While the components are period-correct, the assembly likely post-dates the official production run.

  I recommend we **Option 1: Relabel the unit as a later period-correct assembly and adjust its insured value accordingly.**

  I know there's hesitation here, specifically around the "Partscaster" argument raised during the last meeting. The point is well-taken: physically, the board hasn't changed. The solder joints were done by a skilled hand, the chips are genuine, and it functions exactly as a 1976 unit would. If the object is materially identical, why does the label matter?

  However, I believe that analogy actually supports relabeling rather than maintaining the status quo. In the vintage guitar market, a "Partscaster" built from genuine 1959 parts is a wonderful instrument, but it is *never* marketed or valued as a factory-original 1959 Stratocaster. The value difference isn't about wood and wire; it's about historical witness. A factory original testifies to a specific time, place, and manufacturing chain. A Partscaster testifies to the aftermarket and the culture of preservation.

  As a museum, we aren't just displaying hardware; we are displaying evidence. If we keep the 1976 label, we are asking visitors to trust us on a historical fact we now have strong reason to doubt. The board hasn't changed, but its *testimony* has. It no longer speaks to the founding of Apple in 1976; it speaks to the vibrant hobbyist ecosystem that kept the platform alive into the 80s.

  That is still an incredibly valuable story. By relabeling it as a "Contemporary Period Assembly (c. 1980–82)," we maintain our integrity, adhere to our policy on distinguishing originals from replicas, and actually open up a richer educational angle about the early second-hand market for microcomputers.

  Leaving it as-is risks our credibility if this information ever becomes public knowledge. Pulling it entirely hides a beautiful artifact that still has much to teach us. Relabeling allows us to keep the board on display while being honest about what it actually represents.

  Let's discuss this further at the meeting, but I urge you to consider that accuracy doesn't diminish the artifact—it secures our trust with the public.

  Best,

  [Your Name]
