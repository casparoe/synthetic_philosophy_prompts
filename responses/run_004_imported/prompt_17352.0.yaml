      *   *Option 2: Remove.* (Conservative, avoids misinformation, but hides a cool artifact).
      *   *Option 3: Leave As Is.* (Status quo, relies on "innocent until proven guilty," risky if debunked later).

      *Decision:* Option 1 (Relabel) is the strongest ethical position for a museum. It preserves the artifact's educational value while maintaining integrity. It allows for a nuanced discussion about the "Partscaster" argument.

  3.  **Deconstruct the "Partscaster" Argument:**
      *   *The Argument:* The physical object is identical. The experience is identical. Therefore, the label/value shouldn't change.
      *   *The Counter-Argument (Museum Context):* Museums aren't just displaying *objects*; they are displaying *stories* and *evidence*. An Apple-1 isn't valuable just because it computes; it's valuable because it represents a specific moment in history (1976, Jobs/Wozniak garage). A 1982 build tells a different story (hobbyist enthusiasm, aftermarket support). The "truth" of the object is part of its function in a museum.
      *   *Nuance:* The "Partscaster" analogy actually supports relabeling. In the guitar world, a Partscaster *is* labeled differently and valued differently. The committee member's point proves the opposite of what they want: we *do* care about assembly origin, even with old parts.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
