  ### Advice for the "Flip-Flop"
  The reason you are likely flip-flopping is that the student's answer is **philosophically sophisticated but exegetically wrong.**

  *   **Argument for a higher grade (11-12/15):** The student understands the *ontology* (the relational self) perfectly. They recognize that there is "no self prior to roles." This is the hardest part of A&R's theory. The fact that they call it "virtue ethics" might be seen as a semantic quibble if their understanding of the *mechanism* is correct.
  *   **Argument for this grade (10/15):** In a seminar on specific secondary literature (Ames & Rosemont), accuracy regarding the author's thesis is paramount. The prompt *gave* them the thesis in the question stem ("A&R argue... not a version of virtue ethics"), and the student contradicted the stem. If you give full credit for the concepts, you risk students thinking they can ignore the specific philosopher's argument as long as they talk about the general tradition.

  **Recommendation:** Stick with the **10/15**. It rewards their knowledge of Confucianism while signaling that misrepresenting the specific theorist's main claim (especially when stated in the prompt) is a major error. The comments above are written to be "regrade-proof" by explicitly pointing out the contradiction with the prompt stem.
