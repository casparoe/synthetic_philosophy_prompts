      *   *Check:* Did I address the "90%" claim? Yes, that's an estimate, but likely overoptimistic without systemic change.
      *   *Tone:* Keep it empathetic but analytical.
      *   *Constraint:* Ensure the final line is exactly `\answer{Nate}` or `\answer{Sara}`.

  7.  **Final Polish:** (Reviewing the generated thoughts against the prompt requirements).
