          *   *Let's try a different angle:* The Hole Argument is a *reductio ad absurdum* of Manifold Substantivalism specifically. It forces the substantivalist to become a *Sophisticated* Substantivalist. Leibniz's argument forces the substantivalist to become a *Haecceitist* or deny PSR.
