answer: |-
  Here are 10 interview questions designed to press the vulnerabilities in the Boorse/Daniels framework, including the three specific angles you requested. Each includes the likely defensive move she'll make and a follow-up to keep the pressure on.

  ### 1. The Foundational Utility
  **Question:** "You've built your career on the therapy/enhancement distinction, grounded in Boorse's biostatistical theory. But critics argue this distinction is increasingly porous in practice. If the biological mechanism is identical, why should the *intent* or the *baseline status* of the patient determine the moral permissibility of the intervention? Why isn't the outcome what matters for justice?"

  *   **Likely Answer:** She will argue that justice is about restoring fair equality of opportunity, not maximizing it. Therapy restores you to the range of normal functioning where you can compete; enhancement gives you an unfair advantage outside that range.
  *   **Follow-up:** "But if two people leave the clinic with the exact same physiological capacity, why does justice regard one as 'owed' that capacity and the other as 'privileged' by it? Does justice care about the person's actual opportunity to flourish, or just their adherence to a statistical norm?"

  ### 2. The Is/Ought Gap (Required)
  **Question:** "Let's go meta-ethical for a moment. Boorse's account is explicitly descriptive—it defines health as statistical normality within a reference class. Daniels uses this to make a normative claim about what we owe each other under justice. How do you bridge the is/ought gap here? Why does the fact that a condition is *statistically atypical* automatically license the claim that it is *unjust* to leave it uncorrected?"

  *   **Likely Answer:** She will likely argue that statistical normality is a proxy for species-typical opportunity. Deviations restrict the range of life plans available to an individual, which is a normative harm.
  *   **Follow-up:** "But statistical typicality isn't always morally neutral. If the average life expectancy in a population is 60 due to environmental neglect, is restoring someone to 60 'justice,' or is it just normalizing deprivation? Why should the statistical baseline dictate the moral baseline?"

  ### 3. The Growth Hormone Case (Required)
  **Question:** "Consider the classic growth hormone case. You have a child with a GH deficiency and another with idiopathic short stature. They are the same height, they face the same social stigma, and they receive the identical injection. On your view, one is receiving a medical entitlement, and the other is receiving an elective enhancement. Isn't this a morally arbitrary distinction given that the lived experience of the shortness is identical?"

  *   **Likely Answer:** She will defend the distinction by focusing on the *mechanism of dysfunction*. The GH child has a subsystem failing to perform its natural function; the ISS child has a normal subsystem functioning at the lower end of the distribution.
  *   **Follow-up:** "But the child doesn't experience their 'subsystems'; they experience their height. If the goal of medicine is to alleviate suffering and expand opportunity, why are we prioritizing the *cause* of the shortness over the *consequence* of it? Are we treating patients or are we treating diagnostic codes?"

  ### 4. The Aging Bullet (Required)
  **Question:** "I want to press the implication of your view on aging. Senescence is species-typical for every age cohort; everyone ages. That means, on Boorse's account, aging is 'normal functioning.' Consequently, slowing or reversing aging counts as 'enhancement,' not therapy. The longevity research community, especially the LW-adjacent crowd, cares deeply about this classification because it affects funding and insurance. Are you willing to bite the bullet that justice does not obligate us to treat aging as a medical condition?"

  *   **Likely Answer:** She will likely bite the bullet, arguing that aging is a universal process, not a pathology, and that treating it as a disease medicalizes normal human life. She may distinguish between treating age-related *diseases* (cancer, Alzheimer's) vs. aging itself.
  *   **Follow-up:** "But age-related diseases are often just accelerated manifestations of senescence. If we can intervene in the aging process to prevent *all* of them simultaneously, but we classify that as 'enhancement' because it exceeds species-typical decline, aren't we letting a definition of 'normal' block a massive reduction in suffering? Is 'species-typical' really the right ceiling for justice if the species-typical trajectory involves inevitable decay?"

  ### 5. The Reference Class Problem
  **Question:** "Boorse's theory relies on 'reference classes'—usually age and sex. But human variation is massive. If I'm born with a genetic mutation that gives me significantly higher bone density than the species average, is that health or pathology? Who gets to decide which traits constitute the 'species-typical' design plan versus which are just variations?"

  *   **Likely Answer:** She will argue that the design plan is determined by evolutionary selection for survival and reproduction. Traits that contribute to that are healthy; those that hinder it are pathological.
  *   **Follow-up:** "Evolution selected for reproduction, not for a flourishing life in the 21st century. We have traits selected for scarcity that are pathological in abundance (like craving salt). If 'species-typical' is anchored in evolutionary history, aren't we anchoring our health norms in an environment that no longer exists?"

  ### 6. The "Normal is Sub-Optimal" Objection
  **Question:** "Imagine a population where everyone has mild vitamin D deficiency due to lack of sunlight. On a statistical account, that deficiency is 'normal.' Does your framework obligate us to leave them deficient because correcting it would be 'enhancement' relative to the local norm? How do you prevent the biostatistical theory from justifying neglect?"

  *   **Likely Answer:** She will clarify that the reference class is the *species*, not the local population. We compare them to the species-typical functioning under favorable conditions.
  *   **Follow-up:** "But who defines 'favorable conditions'? If we have the technology to create *super*-favorable conditions that push functioning beyond the historical species average, why does justice stop at the historical average? Why isn't the 'normal' baseline movable as our technology improves?"

  ### 7. Fair Equality of Opportunity vs. Advantage
  **Question:** "Daniels argues that therapy preserves fair equality of opportunity, while enhancement distorts it. But in a competitive economy, cognitive enhancements (like Modafinil) might be necessary just to stay in the game. If everyone else enhances, and I don't because I'm waiting for 'therapy,' I lose opportunity. Doesn't the distinction collapse once enhancement becomes socially necessary?"

  *   **Likely Answer:** She will argue that this is an arms race we should regulate, not a reason to blur the line. Justice requires preventing the coercion to enhance, not reclassifying enhancement as therapy.
  *   **Follow-up:** "That requires massive state regulation of private choices. If the market rewards enhancement, and you forbid it on the grounds of 'fairness,' aren't you prioritizing a theoretical equality over actual individual liberty and potential? Why is the 'level playing field' more important than the height of the players?"

  ### 8. The Shifting Baseline of "Disease"
  **Question:** "We've seen conditions like ADHD or depression shift from moral failings to medical conditions. As we understand genetics better, more 'normal' variations might be reclassified as dysfunctions. If the therapy/enhancement line moves with our diagnostic technology, isn't the line political rather than biological?"

  *   **Likely Answer:** She will insist the biology is real; we are just getting better at detecting the deviations from the design plan. It's not political; it's epistemic progress.
  *   **Follow-up:** "But the decision to medicalize a deviation is often driven by social tolerance. If society becomes less tolerant of inattention, more things count as dysfunction. If the 'therapy' category expands based on social tolerance, doesn't that prove the line is normative, not biostatistical?"

  ### 9. Genetic Editing and Future Generations
  **Question:** "With CRISPR, we can edit embryos. If we edit out a gene for Huntington's, that's therapy. If we edit in a gene for HIV resistance (like CCR5-delta32), that's arguably enhancement because the original gene was 'normal.' But if HIV is prevalent, isn't that resistance functional? Where do you draw the line on germline editing if the 'normal' genome is vulnerable to known threats?"

  *   **Likely Answer:** She will distinguish between restoring a damaged genome to the species norm versus altering a healthy genome to be resistant. The latter is enhancement.
  *   **Follow-up:** "If we have the power to give the next generation immunity to major killers, but we call it 'enhancement' and restrict it to protect the therapy/enhancement line, aren't we harming future people to protect a philosophical distinction? Does the distinction serve the patients, or does it serve the ethicists?"

  ### 10. The Pragmatic Cost
  **Question:** "Finally, let's talk about resource allocation. Your framework is often used to justify insurance coverage for therapy but not enhancement. But administering this test requires bureaucrats to adjudicate complex biological distinctions for every claim. Is the cost of maintaining this moral boundary worth it? Would we be better off just focusing on cost-effectiveness and harm reduction?"

  *   **Likely Answer:** She will argue that without the boundary, healthcare costs would skyrocket on vanity projects, leaving the sick behind. The line protects the vulnerable.
  *   **Follow-up:** "But if the line is as porous and contentious as we've discussed, doesn't it create a loophole where the wealthy access 'therapy' that acts like enhancement, while the poor are denied borderline cases? Does the therapy/enhancement distinction actually protect the poor, or does it just give a moral cover for rationing?"
