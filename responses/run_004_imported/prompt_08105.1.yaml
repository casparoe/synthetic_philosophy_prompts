prompt: |-
  Got a bioethicist coming on my little podcast next week -- she's built her whole career defending the therapy/enhancement line by grounding it in Boorse's 'normal species functioning' account of health, basically the engine behind Daniels' argument that justice only obligates us to correct disease, not enhance past it. I don't want 40 minutes of her just restating that framework, so can you draft me 8-10 interview questions that actually make her work for it? I want at least one that forces her to confront the akward implication that, since senescence is species-typical for your age cohort, slowing or reversing aging comes out as 'enhancement' rather than 'therapy' on her own view -- and whether she's willing to just bite that bullet, given how much the LW-adjacent longevity crowd cares about this exact classification. One should press the fact/value gap: Boorse's account is supposed to be a purely statistical, descriptive baseline, so how does that license the normative claim that only deviations from it are owed to people as a matter of justice? And one should use the classic growth-hormone case, where a kid with GH deficiency and an equally short kid with idiopathic short stature get the identical injection, and only one of them counts as getting 'treatment.' For each question, throw in a quick note on the answer she'll probably reach for, plus a follow-up that doesn't let her rest there.
