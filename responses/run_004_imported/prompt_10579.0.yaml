answer: |-
  The kitchen light hummed, a low, electric fret that seemed to vibrate against the silence between them. On the table sat the bottle. Unopened, but present. A gravity well.

  Mireille didn't look at the glass. She looked at her brother, Leo. His hand was hovering over the neck of the bottle, trembling not with fear, but with the tension of a coiled spring. He looked at her, eyes bloodshot, defiant and desperate all at once.

  "I know what you're going to say," Leo muttered. "It's weak. It's stupid. I'm betraying myself."

  "No," Mireille said. Her voice was calm, leveled. She pulled a chair out and sat opposite him, closing the distance. "That's the story you're telling yourself because you think there's a ghost in the machine. You think there's a 'You' that knows the Good, and a 'You' that wants the Bad, and the second one is overpowering the first. That's akrasia. That's weakness of will. And it's wrong."

  Leo's hand tightened on the glass neck. "Mireille, don't do the econ lecture. I know I shouldn't do this. All things considered. I'm not confused about what's better."

  "That's exactly what I need you to hear," she said. "You say you know what's better. You say you are making an all-things-considered judgment that sobriety is superior, and yet you are reaching for the bottle. So you conclude you are irrational. You conclude your will is broken. But Leo, listen to me: there is no break. There is no mystery here. There is only a curve."

  She leaned forward, resting her elbows on the table.

  "We used to think preferences were stable. That if you preferred Health to Drink on Monday, you'd prefer Health to Drink on Tuesday. But we know now that's not how human valuation works. We discount the future hyperbolically. When the reward is far away, we are patient. When the reward is *now*, the value spikes. It's not a moral failure; it's a mathematical function. At time $t_1$, three weeks ago, Sobriety was worth more than Drink. The distance to the Drink made it small. But at time $t_2$, right now, the Drink is immediate. The discount rate applies to the Sobriety, pushing it into the abstract future, while the Drink sits at zero distance. Its value inflates."

  "I'm not a graph, Mir," Leo snapped. "I'm making a choice."

  "You are maximizing," she corrected gently. "Given your current neurochemistry, given the stress of the day, given the proximity of the alcohol, your present self is correctly maximizing utility. You aren't acting against your judgment. Your judgment has shifted to match the incentive structure. The 'You' that wants the drink isn't betraying the 'You' that wants sobriety. They are two different agents separated by time, with different information and different discount rates. The conflict isn't inside you; it's between you-now and you-then."

  Leo pulled his hand back slightly, frowning. He was thinking. She could see the philosophy major surfacing through the fog of craving.

  "I see where you're going," Leo said, his voice tighter. "You're saying my preference reversed. But that's not what this feels like. Davidson talked about this. He said akrasia isn't just preferring the lesser good. It's acting against an *all-out* judgment. I'm not saying 'Sobriety is better if I ignore this bottle.' I'm saying 'Sobriety is better, period.' Unconditionally. I am judging, right now, in this second, that I should not drink. And I am drinking. Your discount curve doesn't explain how I can hold a judgment and violate it simultaneously. If the curve changed, my judgment should have changed. But it hasn't. I still think I shouldn't do this."

  Mireille nodded. She had expected this. It was the strongest shield he had: the phenomenological certainty of his own conscience.

  "Davidson assumes judgment is a static state," Mireille said. "A proposition you hold in your head like a stone. But judgment is a process. It's a verdict rendered by the cognitive system based on available inputs. You *say* you judge Sobriety best. But your motor cortex is reaching for the bottle. In behavioral terms, revealed preference is the only preference that matters. If your actions diverge from your verbal report, it's not because you're irrational; it's because your verbal report is lagging."

  She tapped the table.

  "The feeling that you are violating an 'all-out' judgment is just the latency in the system. The part of your brain that narrates your life—the part that says 'I am a sober person'—updates slowly. The part that calculates reward—the dopaminergic system—updates instantly. You feel a conflict because the narrative self hasn't caught up to the valuation self yet. You aren't holding a constant judgment and breaking it. You are in the middle of a judgment update. The 'all-out' judgment you think you hold is actually a memory of the judgment held at $t_1$. You're quoting your past self. But right now, in this millisecond, your brain has recalculated. The bottle is here. The pain is here. The calculation shifts. If you drink, it proves the judgment *did* change, no matter what your inner monologue says. There is no residue left for Davidson to explain. Once you specify the discount function and the latency of cognitive updating, the 'paradox' vanishes. You aren't a sinner; you're a system with a lag time."

  Leo stared at her. His hand was still on the bottle, but the grip had loosened. He looked exhausted.

  "Okay," he whispered. "Maybe I'm just... recalculating. But that doesn't make it okay. Holton. Richard Holton. You remember him? He said will isn't about judgment. It's about resolution. I made a promise to myself. A resolution. I can judge that drinking is better right now and still *not* drink, because I value keeping my resolution. Weakness of will is abandoning the resolution, not necessarily changing the judgment. I'm breaking a promise, Mir. That's not a discount curve. That's... that's integrity."

  Mireille felt a surge of affection for him. Even now, clinging to the idea that he was a moral agent capable of integrity, rather than a biological machine in distress.

  "Holton is useful," she admitted. "But he's still describing a mechanism, not a magic trick. A resolution is a pre-commitment device. It's a tool we use to manipulate the discount curve. When you decided to get sober three weeks ago, you were trying to bind your future self. You were trying to raise the cost of drinking at $t_2$."

  She gestured to the bottle.

  "But a tool only works if you use it. To 'hold' a resolution, as Holton puts it, requires cognitive effort. You have to actively maintain the intention. That effort has a cost. Stress costs energy. Craving costs focus. Right now, the cost of maintaining the resolution is higher than the value your current self assigns to 'being a person who keeps promises.' That's still a maximization problem, Leo. You're weighing the utility of consistency against the utility of relief. If you drink, it means the relief + the negative utility of breaking the promise is still greater than the Sobriety + the positive utility of keeping the promise. It's all one equation."

  She reached out, covering his hand with hers. Her skin was warm; his was cold.

  "I'm not saying this to tell you it's fine to drink," she said, her voice dropping, losing the lecture-hall cadence, finding the sister's tone. "I'm saying this so you stop hating yourself. If you think this is weakness of will, then you are the enemy. You are the one failing. You are the one betraying. That shame? That's fuel for the next drink. It steepens the discount curve. It makes the future feel even more hopeless, which makes the present reward even more valuable."

  Leo looked down at their hands. "So what am I? If I'm not weak... what am I?"

  "You're a time-traveler," Mireille said. "The You that is sober is trying to send a message to the You that is suffering. But the signal is getting lost in the noise. The discount rate is too high."

  She squeezed his hand.

  "If akrasia is real, then you are broken. But if it's just hyperbolic discounting, then you're not broken. You're just predictable. And if you're predictable, we can fix it. We don't need 'willpower.' We need to change the variables. We need to make the cost of drinking immediate. We need to make the reward of sobriety present. We engineer the environment so that the 'You' at $t_2$ doesn't have to fight the 'You' at $t_1$."

  She gently pried his fingers off the glass. He let her.

  "There is no ghost, Leo. There is no will to be weak. There is only the curve. And curves can be flattened."

  She took the bottle and set it on the counter, out of reach.

  "Don't fight yourself," she said. "Just help the other guy. The one who wants to be here tomorrow."
