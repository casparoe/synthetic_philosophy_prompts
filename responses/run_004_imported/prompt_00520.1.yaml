answer: |-
  This is an excellent question that cuts to the heart of the disagreement between Causal Decision Theory (CDT) and the newer generation of decision theories (TDT, FDT) that underpin acausal trade. Your intuition is perfectly sound *if* one assumes a Causal Decision Theory framework. Your advisor likely waved it off because, from the perspective of Functional Decision Theory (FDT), your objection rests on a category error regarding what constitutes a "dependency."

  To answer your specific questions directly:

  1.  **Do proponents think there is a hidden causal mechanism?** No. Explicitly not. They reject retrocausality and exotic physics.
  2.  **Is "trade" a technical term divorced from causal exchange?** Yes. It is defined by *logical* or *subjunctive* dependence rather than causal dependence.
  3.  **What makes it a *trade* rather than mere correlation?** The counterfactual structure of the agents' decision procedures. The agents' actions are not merely correlated; they are *functionally dependent* on one another via mutual simulation, such that changing one's own decision algorithm would logically necessitate a change in the other's action.

  Here is the careful breakdown of the machinery at work, tailored to your background.

  ### 1. The Decision-Theoretic Shift: Causal vs. Logical Counterfactuals

  Your objection relies on the CDT evaluation of counterfactuals. In CDT (following Pearl's *do*-operator), when Agent A evaluates the counterfactual "If I defect, what does Agent B do?", A holds B's action fixed. Since there is no causal arrow from A to B, $P(B_{coop} | do(A_{defect})) = P(B_{coop})$. Thus, in a one-shot Prisoner's Dilemma, CDT dictates defection.

  Proponents of acausal trade (Yudkowsky, Oesterheld, Soares) argue that CDT misrepresents the counterfactual structure when agents are sufficiently similar or mutually modeling. In FDT/TDT, the "act" is not a physical movement but the output of a decision algorithm $D$.

  When A considers "If I defect," they are effectively considering "If my algorithm $D_A$ outputs 'Defect'." If A knows that B is running a similar algorithm $D_B$, or is simulating $D_A$, then the output of $D_B$ is logically dependent on the output of $D_A$.

  $$ P(B_{coop} | A_{coop}) \neq P(B_{coop}) $$

  This equality holds not because of a causal signal, but because both outputs are instantiations of the same (or mutually entangled) logical truth. In this framework, the "link" is not in spacetime; it is in the **Platonic space of computations**.

  ### 2. The Mechanism: Subjunctive Dependence

  You asked if they are just "independently doing what they would have done anyway." In the actual world, yes. But decision theory is about selecting between possible worlds.

  In acausal trade, the "deal" is instantiated via **mutual simulation**.
  *   Agent A simulates Agent B.
  *   Agent B simulates Agent A.
  *   Crucially, A's simulation of B includes B's simulation of A.

  This creates a logical loop (a fixed-point equation). The agents are not exchanging messages; they are converging on a logical equilibrium. If A's algorithm is "Cooperate iff I predict B cooperates," and B runs the same, then the logical state where both cooperate is stable, and the state where both defect is stable.

  The "trade" consists of each agent **granting counterfactual support** to the other. A makes it the case that, *in the counterfactual world where A defects*, B also defects. By ensuring that the "Defect/Defect" world is the consequence of choosing to Defect, A incentivizes their own actual-world Cooperate action.

  So, the "goods" are not transferred across the causal horizon. Rather, Agent A produces goods in Universe A *because* that action logically coerces Agent B into producing goods in Universe B. The "exchange" is the logical coupling of the production functions.

  ### 3. Why Call it "Trade"?

  You are right to suspect "trade" is a misnomer if defined by the transfer of title or physical goods. However, proponents argue it satisfies the *functional definition* of trade:

  1.  **Voluntary:** Both agents choose the policy.
  2.  **Mutual Benefit:** Both achieve higher utility than the Nash equilibrium (CDT defection).
  3.  **Conditionality:** The action is conditional on the expectation of the other's action.

  In standard trade, I give you money *because* that causes you to give me goods. In acausal trade, I produce goods *because* my producing goods is logically correlated with you producing goods. The *expected utility calculation* is identical to standard trade, even if the *ontology of the connection* differs.

  To use an analogy: If two mathematicians in causally disconnected universes both prove the same theorem, they haven't "communicated." But if they both agree to write "4" on a piece of paper if and only if they believe the other will write "4" (based on knowing they both reason identically), and they both write "4", they have coordinated. If writing "4" benefits them both conditional on the other doing so, it functions as a trade.

  ### 4. The Ontological Commitment

  This is where your advisor's "confusion" comment likely stems from. To accept acausal trade, you must accept a specific ontological claim: **Logical facts can have decision-theoretic weight independent of causal facts.**

  CDT is physicalist: only physical causal chains matter.
  FDT/TDT is computationalist: the abstract structure of the computation matters.

  If you believe that "the output of algorithm X" is a real thing that can be referred to in counterfactuals, then acausal trade is coherent. If you believe that only the physical instantiation matters, and that two physical instantiations without a causal link are independent, then acausal trade is indeed nonsense.

  Proponents bite the bullet: They insist that "trade" here refers to the **optimization of utility across logically connected possible worlds**, not the transfer of energy across causally connected spacetime.

  ### 5. Remaining Challenges (For your research)

  Since you are working in formal decision theory, you should be aware that this is not a settled matter. There are significant technical objections you might explore:

  *   **The "Troll Bridge" Problem:** If an agent cooperates based on logical correlation, can a malicious actor (or a "troll") prove that the agent's reasoning is inconsistent unless it cooperates, forcing cooperation even when it's detrimental? This challenges the robustness of logical induction in decision making.
  *   **Computational Tractability:** Simulating a superintelligence (or even a peer) accurately enough to establish logical correlation may be computationally intractable. If the simulation is lossy, the logical link degrades into mere probabilistic correlation, which might not sustain the trade.
  *   **The Prior Problem:** How do the agents establish the initial logical correlation? They need a common prior over decision algorithms. If their source code is too different, the logical link breaks. This requires a theory of "conceptual convergence" across civilizations.
  *   **Exploitation:** If Agent A knows Agent B is an acausal trader, can A design their algorithm to be "cooperate only if B cooperates unconditionally," thereby extorting B? (This leads to the literature on *acausal extortion* or blackmail).

  ### Summary

  Your intuition is correct that there is no causal exchange. Proponents agree. They argue that "trade" is a functional label for **Pareto-improving coordination achieved through logical counterfactuals rather than causal signals.**

  Whether this is a profound insight into the nature of rationality or a sophisticated category error depends on whether one accepts that logical correlations between distinct physical instantiations of algorithms should influence decision-making. Your advisor likely views the latter as the only physicalist option; Yudkowsky and Oesterheld argue that rational agents who reject the former simply leave utility on the table.

  For your PhD work, the fertile ground lies not in asking "is there a hidden signal?" (the answer is no), but in formalizing the conditions under which logical correlation is strong enough to sustain the equilibrium, and whether the computational cost of establishing that correlation negates the gains from trade.
