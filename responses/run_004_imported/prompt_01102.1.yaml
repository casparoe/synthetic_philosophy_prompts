answer: |-
  The banquet hall smelled of lilies and overcooked salmon. At the head table, the silverware had stopped clattering. Arthur, the guest of honor, was halfway through a anecdotes about the department's founding in 1974, his voice trembling slightly over the microphone.

  Ilse swirled the dregs of her Pinot Noir. She didn't look at Teo. "He still thinks the rabbit was the point."

  Teo cut a piece of potato, precise and surgical. "Arthur knows the rabbit was pedagogical. But you're the one who spent thirty years telling undergraduates it wasn't just a puzzle about translation."

  "It wasn't," Ilse said, finally turning to him. "You know the mature position. Quine walked back the holophrastic indeterminacy in *Pursuit of Truth*. He called it a conjecture. He admitted he couldn't construct the rival manuals. But he never surrendered on the inscrutability of reference. That's the bedrock. The proxy-function argument stands even if the sentence-meaning indeterminacy falls."

  "Does it?" Teo put his fork down. "Or does it just become a triviality? If you concede the truth values of all sentences are fixed—which Quine essentially had to—then your proxy functions are just a change of coordinate systems. I can map every object in the universe to its set-theoretic complement. I can map rabbits to undetached rabbit parts. The logic holds, yes. But what have you shown? That notation is flexible."

  "I've shown that ontology is relative to a background theory," Ilse said, her voice low but sharp. "There is no fact of the matter about whether we are talking about rabbits or rabbit stages, even when all the behavioral evidence is in. The reference is underdetermined by the totality of physical facts."

  "There's no fact of the matter," Teo repeated, tasting the phrase. "That's the magic trick. You say 'no fact of the matter' as if it's a discovery about the world, when it's just a failure of your method to distinguish between the map and the territory. Chomsky saw this immediately. If the brain is a physical system, and it interacts with the world, then *something* fixes the reference. Maybe not behavior, but neurophysiology. Quine treated the mind as a black box because he was a behaviorist, not because the world is actually inscrutable."

  Ilse took a sip of wine. She looked at Arthur, who was now laughing at his own joke. "I'll concede the behaviorism was a bottleneck. Quine should have engaged more with the cognitive turn. If you can show me a neural state that uniquely picks out 'rabbit' rather than 'rabbit stage' without invoking intentional semantics in the explanation, I'll read the paper."

  "I'm not promising a paper, Ilse. I'm asking for the stakes." Teo leaned in, the candlelight catching the gray in his beard. "If your proxy functions are just permutations that preserve all truth values, then the difference between 'rabbit' and 'rabbit stage' makes no difference to anything. It's noise. Why should we care that reference is inscrutable if the inscrutability changes nothing about how we live, speak, or do science?"

  "Because it kills metaphysics," Ilse said. "That was always the point. If you can't pin down what your terms refer to, you can't claim your ontology is the *true* one. You can only claim it's the convenient one. It saves us from the myth of the museum."

  "It saves us from nothing if it's just a relabeling game," Teo countered. "Look, I'll concede the formal point. Yes, mathematically, you can permute the domain. Yes, logic allows it. But philosophy isn't logic. It's an inquiry into what exists. If I ask you, 'Does this chair exist?', and you say, 'Well, relative to a manual, it might be a collection of time-slices,' you aren't answering the question. You're dissolving it. And Quine knew it. That's why he downgraded the big thesis. He knew he couldn't find the second manual."

  "He didn't need to find a second manual to prove the first one wasn't unique," Ilse said. "The existence of the function is enough. The possibility is the threat."

  "Possible to whom?" Teo pressed. "To a logician. Not to a speaker. You're conflating what a theory *allows* with what a speaker *does*. We don't speak in proxy functions. We speak in objects. If Quine's argument relies on a maneuver no actual language user could ever employ, then it tells us about logic, not language."

  Ilse paused. She picked up her water glass, tracing the rim. "You want evidence. You want to know what would count against the thesis."

  "I want to know if it's falsifiable. If nothing counts against it, it's not philosophy. It's theology."

  "If we found a causal theory of reference that didn't presuppose the very referential terms it was trying to ground," Ilse said softly. "If you could step outside the web of belief to check the hooks. But you can't. We're always inside."

  "We're inside the web," Teo agreed. "But the web touches the world. That's the part Quine was too scared to touch. He wanted the world to be immanent, but he kept treating reference like it was floating."

  They sat in silence for a moment as the room erupted in applause. Arthur was finishing his speech. He raised his glass to them, specifically. To the students who became colleagues. To the arguments that lasted a lifetime.

  Ilse raised her glass, but her eyes stayed on Teo. "We're not inside the same web, Teo. Not anymore."

  "No," Teo said, clinking his glass against hers. The sound was sharp, final. "But the truth values of our sentences seem to match. We both know why we're here."

  "Does that mean the reference is fixed?" Ilse asked, a faint, weary smile touching her lips. "Or just that the manual works?"

  Teo drank his wine. "Drink the wine, Ilse. Don't worry about the grapes."

  "Ontological relativity," she murmured.

  "Cheers."
