          *   Camp B: Procedural Rationality (Simon/Bounded Rationality). "The mind literally cannot compute the optimization function."
      *   **Address the "Regress Problem" (The Infinite Loop):** Explain why calculating the "optimal search cost" is impossible for a bounded agent. This is the killer argument against Camp A.
      *   **Address "Order Sensitivity" (Path Dependence):** Explain how satisficing changes the *outcome* based on sequence, whereas optimization seeks a global maximum regardless of sequence (in theory).
