      *   *Order Sensitivity:* In optimization, the best option is the best option. In satisficing, if you see a "good enough" option early, you stop. If you see it late, you might have already stopped at a mediocre one. This violates the "independence of irrelevant alternatives" or consistency axioms of standard rational choice.
