prompt: |-
  So I was pairing with a coworker on some code that does a greedy-ish search over config options: try candidates in some order, and the moment you hit one that clears a "good enough" threshold you stop and ship it, instead of grinding through the whole space to find the actual best one. My coworker (who did an econ minor way back) said "oh that's basically satisficing, like Herbert Simon," and I fell down a rabbit hole reading about bounded rationality over the weekend. Now I've got this nagging feeling that satisficing isn't actually a different thing from optimizing at all — it just looks like optimizing a slightly different objective, something like minimize(search cost + expected regret from stopping early). If that's right then satisficing just collapses into ordinary constrained optimization and Simons whole pitch of it being an *alternative* to maximizing seems kind of hollow. But obviously a ton of serious economists and philosophers treat satisficing as a genuinely distinct notion of rationality rather than just a relabeling, so I'm guessing I'm missing something.

  Could you help me actually understand what's supposed to be different here, i.e. satisficing as bounded rationality proposes it vs. "optimization, but with search/computation costs folded into the objective function"? Two things I keep half-hearing about but don't really get: something about a regress problem, where figuring out the "optimal" place to stop searching requires exactly the kind of unbounded computation that bounded rationality was suppose to rule out in the first place, and something about satisficing being sensitive to the order in which you happen to encounter options, in a way that optimizing supposedly isn't. If those are real, principled differences I'd love to understand why, and if the "optimizing with costs" move actually does fully absorb satisficing as a special case, I'd love to hear that too — I've read like five slightly different summaries of Simon at this point and they all kind of talk past each other on exactly this question, so a from-the-ground-up explanation would help a lot more than another one-paragraph gloss.
