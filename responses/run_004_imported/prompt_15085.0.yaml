      *   **Immodesty:** The consequence of strict propriety. You cannot rationally believe that *another* specific credence function is more accurate than your own *from your current perspective*. If you did, you should just adopt that credence.
      *   **Deference/Modesty:** The practice of adjusting your credence toward an expert's credence ($c_{expert}$) because you think they are more accurate, even if you don't know the evidence they have.
      *   **The Tension:** If strict propriety holds, you should never think $c_{expert}$ is better than $c_{you}$ *unless* you update $c_{you}$ to *become* $c_{expert}$. But the user describes a process of "shading toward" (weighted averaging), which implies keeping a distinct credence that acknowledges the other is better. This looks like a violation of the immodesty requirement derived from accuracy-dominance.

  3.  **Evaluate the "Standard Dissolution" (Bayesian Conditionalization):**
      *   *Standard View:* You treat the expert's forecast as evidence $E$. You update $P(H)$ to $P(H|E)$. Now your new credence *is* the expert-informed credence. Immodesty is preserved because your *new* credence expects *itself* to be best.
      *   *User's Rejection:* The user says "even when you have zero first-order clue what they know." This suggests the "expert number" isn't treated as standard evidence about the world, but as evidence about *accuracy*. It's higher-order evidence.
      *   *The Problem:* If I treat the expert's credence $c_E$ as a proposition, how do I update? If I simply adopt $c_E$, I've deferred. But if I average ($0.5 c_{me} + 0.5 c_E$), I am explicitly saying "I expect $c_E$ to be more accurate than $c_{me}$, but I won't fully become $c_E$." This averaging strategy is notoriously difficult to justify in standard Bayesianism (it often violates conditionalization).
      *   *Accuracy-First Specifics:* Accuracy-first epistemology (Joyce, Pettigrew, etc.) derives norms from minimizing expected inaccuracy. If I expect the expert to be more accurate, strict propriety says I should *adopt* their credence. If I don't adopt it fully, I am accuracy-dominated *relative to my own expectations*.

