      *   **Point 4: Higher-Order Evidence (HOE).** This is the crux. Accuracy-first frameworks struggle with HOE. If I learn "Expert is more reliable," do I update on that fact? If I do, my new credence is immodest. But the *process* of getting there involves a moment of modesty ("They are better than me"). Accuracy-first theory usually demands you snap instantly to the new credence. Real-world forecasting requires a sustained policy of deference.
