prompt: |-
  I'm a novelist, and for a dozen years I've been one of twelve working novelists on the reading panel for a small annual fiction prize: we read the longlist, argue for two days, then vote by secret ballot. The foundation is disbanding the panel this spring in favor of a single celebrity judge, and I've been asked to give the closing toast at our last dinner. One of my fellow jurors has a doctorate in social choice theory and will know exactly what I'm doing if I reach for the Condorcet jury theorem to defend the twelve of us against the one; everyone else will just hear a toast. Please write it. It should honestly explain why a dozen independent, better-than-chance readers can be trusted collectively in a way no single judge can, while admitting that our two days of arguing before the ballot cost us the very independence the theorem depends on -- so the toast can't just borrow the theorem's comforting conclusion without earning it. Keep it to about three minutes, and make sure it reads as a tribute, not a seminar.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist, member of a 12-person reading panel for a small annual fiction prize for 12 years.
      *   **Audience:** 11 fellow jurors (one has a PhD in social choice theory), foundation staff, maybe some guests.
      *   **Occasion:** Closing toast at the last dinner before the panel is disbanded in favor of a single celebrity judge.
      *   **Key Content:**
          *   Explain why 12 independent, better-than-chance readers are collectively better than one (Condorcet Jury Theorem logic).
          *   Acknowledge the flaw: The 2 days of arguing compromise independence (which the theorem requires).
          *   Resolve the tension: Why the group still works despite the flaw (the value of the argument itself).
          *   Tone: Tribute, not a seminar. Warm, reflective, slightly witty (for the expert), but accessible to all.
          *   Length: About 3 minutes spoken (approx. 400-500 words).
      *   **Constraint:** The expert juror must recognize the theorem without it feeling like a lecture to the others.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Premise:* If each voter has a probability $p > 0.5$ of being correct, and they vote independently, the probability that the majority vote is correct approaches 1 as the number of voters increases.
      *   *Application here:* 12 novelists > 1 celebrity judge (assuming each novelist is competent).
      *   *The Catch:* The theorem requires *independence*. The panel argues for two days. Deliberation creates correlation/dependence.
      *   *The Twist:* The toast needs to admit this breach of independence but argue that the *process* (the argument) adds value that outweighs the loss of statistical purity, or that the independence was never the real point—the collective wisdom was.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the end of an era. Set the scene (12 years, 12 people).
      *   **The Statistical Hook (Subtle):** Introduce the idea of many eyes vs. one. Hint at the math for the expert without boring the others.
      *   **The Confession:** Admit that we talked too much. We influenced each other. We broke the "independence" rule.
      *   **The Reconciliation:** Why did we do it? Because literature isn't a math problem. The argument *is* the value. The friction polishes the judgment.
      *   **The Tribute:** Honor the colleagues. The shift to a single judge is fine, but this was special.
      *   **Closing:** Raise a glass.

  4.  **Drafting - Tone Check:**
      *   *Novelist voice:* Lyrical but grounded.
      *   *Expert nod:* Needs a specific phrase that signals CJT without defining it. "Probability," "independence," "majority rule."
      *   *Emotional core:* Camaraderie, respect for the work.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Welcome everyone. Twelve years. Twelve of us. Soon one judge. There's a theorem that says if we are all slightly smart, together we are very smart. But we talked for two days. So we aren't independent. Dr. [Name] knows this breaks the math. But literature needs the talk. The argument makes us better. So here's to the group.

  6.  **Drafting - Iteration 2 (Fleshing out the prose):**
      *   Need to make the math reference elegant. "There is a mathematical comfort..."
      *   Need to address the colleague directly but subtly. "I know one of you is checking the assumptions."
      *   Need to justify the deliberation. "We didn't just vote; we fought."
      *   Ending needs to be warm.

  7.  **Refining the Condorcet Reference:**
      *   Don't name-drop Condorcet explicitly (too seminar-like). Describe the logic. "If each of us is more likely than not to be right..."
      *   The expert will catch it. The others will hear "wisdom of crowds."
      *   The admission: "We sat in a room for two days." That destroys independence.
      *   The resolution: "Our dependence was our strength."

  8.  **Word Count Check:**
      *   3 minutes spoken is roughly 450 words at a moderate pace.
      *   Keep sentences varied.

  9.  **Final Polish:**
      *   Ensure the transition from math to sentiment is smooth.
      *   Make sure the "single celebrity judge" shift is acknowledged gracefully (not bitter, just reflective).

