answer: |-
  Friends, colleagues, co-conspirators.

  Twelve years. Twelve of us. And soon, just one.

  It is tempting to be sentimental about this change, to say that the soul of literature cannot be captured by a single celebrity eye. But there is also a cold, hard comfort in the math we've been living by. There is a theorem—in the quiet language of probabilities—that suggests if you gather a group of people who are each individually more likely than not to be right, and you let them vote independently, the majority decision becomes nearly infallible. Twelve competent readers are statistically safer than one genius.

  I know one of you is already smiling, because you know the catch. That theorem relies on a specific, fragile condition: independence. It requires that my vote remains untouched by your voice.

  And look at us. We have never been independent. For twelve years, we have locked ourselves in a room for two days. We have bullied each other over cold coffee. We have surrendered our private convictions to the pressure of a better argument made across the table. We have contaminated our data. We have corrupted the very independence that guarantees the wisdom of the crowd.

  By the strict rules of social choice, we should be a mess. We should be noise.

  But we are not. Because literature is not a binary problem to be solved; it is a conversation to be had. Our "dependence" was not a statistical error; it was the entire point. The theorem assumes the truth is out there waiting to be found. We knew the truth had to be forged. When I changed my vote because you pointed out a flaw in the prose I had missed, I didn't lose my independence; I gained clarity. We didn't aggregate our biases; we sanded them down against each other until the wood was smooth.

  The foundation wants a singular vision next year. There is romance in that. But there was also a specific, stubborn magic in this room. It was the magic of twelve people willing to be wrong, together, until they could be right.

  So, I ask you to raise a glass. Not to the independence we lacked, but to the dependence we chose. To the arguments that exhausted us, and the books that survived them. To the twelve of us, who proved that while one judge might be faster, a dozen voices arguing in the dark are far less likely to lose the way.

  To the panel.
