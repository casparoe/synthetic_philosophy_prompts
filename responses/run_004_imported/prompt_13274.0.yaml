answer: |-
  Your unease is not only understandable; it is a mark of a maturing scientist. Your advisor is offering you pragmatic comfort ("you passed, and the fact is true"), but your intuition is pointing toward a deeper epistemological principle ("how I know matters as much as what I know").

  To answer your question directly: **No, you did not commit misconduct, but your epistemic justification was indeed fragile.** In the culture of science, being right for the wrong reasons is distinct from being right for the *right* reasons.

  Here is a breakdown of why your discomfort is valid, why your advisor is only half-right, and how to frame this experience as a strength rather than a flaw.

  ### 1. Truth vs. Warrant
  In philosophy and science, there is a distinction between the **truth value** of a claim and the **warrant** for that claim.
  *   **Truth Value:** Is the statement accurate regarding reality? (In your case: Yes, eventually supported by rigorous work.)
  *   **Warrant:** What evidence do *you* possess to justify asserting this as knowledge? (In your case: Weak. It was hearsay propagated through citations.)

  Science is not merely a collection of true facts; it is a system of justified beliefs. If you assert $X$ is true because Textbook $A$ says so, and Textbook $A$ says so because Paper $B$ says so, but Paper $B$ doesn't actually show $X$, your chain of warrant is broken. The fact that Paper $C$ (later work) eventually proved $X$ does not retroactively fix the break in your chain. You arrived at the truth via a "Gettier problem" scenario—justified belief that is true only by luck or coincidence.

  Your advisor is focusing on the *truth value*. You are worrying about the *warrant*. In a PhD candidate, the latter is the more important metric.

  ### 2. The Purpose of the Qualifying Exam
  The qualifying exam is not a trivia contest. Its purpose is to assess whether you have transitioned from a consumer of knowledge to a producer/critic of knowledge.
  *   **The Trap:** Reciting textbook consensus.
  *   **The Test:** The committee member who asked you to trace the citation was doing exactly what they were supposed to do. They were testing whether you understood the *foundation* of the field or just the *facade*.
  *   **The Outcome:** The fact that you *could* track it down, and the fact that you recognize the discrepancy now, suggests you actually passed the deeper test, even if the initial assertion was shaky.

  ### 3. The "Citation Chain" Phenomenon
  You have encountered a well-documented sociological phenomenon in academia, sometimes called **"citation bias"** or **"academic urban legends."**
  *   In cognitive psychology (and many fields), a finding is often simplified in a review paper, cited by a textbook, and then cited by thousands of subsequent papers that never read the original.
  *   Over time, the nuance of the original data is lost, and the simplified claim becomes "settled fact."
  *   Recognizing this is a sign of sophistication. Many senior faculty members never question the textbook chain. Your discomfort shows you are developing the critical eye necessary to navigate the replication crisis that has affected our field.

  ### 4. Was it "Improper"?
  "Improper" implies a violation of norms or ethics.
  *   **Ethically:** No. You did not fabricate data or knowingly mislead. You relied on the standard scholarly shorthand of trusting textbooks.
  *   **Methodologically:** Yes, it was a weakness. Asserting something as "settled fact" without having vetted the primary evidence is a risk. In a seminar, it's a footnote. In a qualifying exam, it is a vulnerability, which is why the committee poked at it.

  However, calling it "improper" might be too harsh. It is more accurate to call it **epistemically premature.** You asserted a level of certainty ("settled fact") that your personal verification did not support at that moment.

  ### 5. How to Move Forward
  Your advisor wants you to stop worrying so you can focus on your dissertation. That is good practical advice. However, you should not dismiss your own insight. Here is how to integrate this:

  1.  **Accept the Luck, Keep the Rigor:** Acknowledge that you were fortunate the later data supported the claim. Use this as a personal rule: *For the core claims of my dissertation, I will trace the primary evidence.*
  2.  **Nuance Your Language:** In the future, avoid "settled fact" unless you have personally vetted the foundational data. Use phrases like "The prevailing consensus suggests..." or "Standard models assume..." This protects you if the foundation turns out to be shaky.
  3.  **Reframe the Narrative:** When you tell this story in the future (and you will, it's a great story), don't tell it as "I made a mistake." Tell it as: *"I cited the standard consensus, was challenged to trace the origin, discovered the original data was weak, but found that modern rigorous methods actually do support the conclusion. It highlighted the importance of distinguishing between historical precedence and empirical validity."*
  4.  **Validate Your Instinct:** Your discomfort is your scientific conscience working correctly. Do not let your advisor's pragmatism silence that voice. It is the voice that prevents the next generation of citation chains from propagating errors.

  **Summary:** You did nothing dishonest, but your scholarly rigor was tested and found to be relying on tradition rather than evidence. That is a normal part of graduate training. The fact that it bothers you proves you are ready to be a psychologist, not just a student of psychology.
