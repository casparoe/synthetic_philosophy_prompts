answer: |-
  **MEMORANDUM**

  **TO:** Interstate River Compact Commission
  **FROM:** Public Member Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Shortage-and-Surplus Sharing Protocol

  ### Executive Summary

  After a year of deliberation within the Economics Subcommittee, we stand at a critical juncture. The fixed-percentage split established in the 1950s is no longer hydrologically viable. To ensure the Compact survives the current arid cycle and the uncertain climate future, we must adopt a dynamic formula that adjusts allocations based on actual river flow.

  The Subcommittee has narrowed the options to two bargaining frameworks: the **Kalai-Smorodinsky (KS)** rule and the **Nash Bargaining Solution (Nash)**. Both are mathematically sound, but they prioritize different values. KS prioritizes adherence to legal entitlements; Nash prioritizes operational stability and cooperation.

  As the Public Member Commissioner, representing the water users who must live with the consequences of this decision, I recommend the Commission adopt the **Nash Bargaining Solution**, coupled with a mandatory ten-year review clause.

  While the KS rule offers a stronger theoretical link to existing water rights, the Nash solution offers the only viable path to de-escalate legal conflict and ensure long-term predictability. In a era of declining snowpack, the Compact's primary function must shift from dividing abundance to managing scarcity without litigation. The Nash formula provides the necessary firewall between our water supply and the courtroom.

  ### The Core Tradeoff: Fairness vs. Stability

  To make this decision, we must understand the technical disagreement without getting lost in the jargon. The debate centers on how the protocol reacts to two variables: changes in river flow and changes in legal claims.

  **1. The Kalai-Smorodinsky Rule (Monotonicity)**
  Proponents of KS argue for a principle we might call **"No Penalty for Abundance."** Under this rule, if the river flows increase (a wet year), no state should receive less water simply because the other state successfully litigated for larger paper entitlements. The KS formula ensures that any new water is split in proportion to how much "room" each state has between their current use and their maximum legal right.
  *   **The Promise:** It feels legally principled. It respects the hierarchy of water rights and ensures that a state with senior or larger entitlements captures a larger share of the surplus.
  *   **The Risk:** It ties our water supply to the outcome of future lawsuits. If a state can expand their "maximum entitlement" in court, they automatically increase their share of every future surplus under the KS formula.

  **2. The Nash Bargaining Solution (Independence of Irrelevant Alternatives)**
  Proponents of Nash argue for a principle we might call **"Insulation from External Noise."** This formula ignores hypothetical maximum entitlements. It looks only at the "status quo" (what states were diverting before the Compact) and splits any change in flow—whether shortage or surplus—equally between the states.
  *   **The Promise:** It creates stability. A court case in State A regarding water rights does not alter the water delivery schedule for State B. The formula depends only on the river and the agreement, not on external legal maneuvering.
  *   **The Risk:** It appears to ignore the legal reality of adjudicated rights. To legal counsel, splitting surplus equally regardless of seniority or entitlement size can feel like a violation of the established legal order.

  ### The Case for Kalai-Smorodinsky

  I want to state clearly that the argument for the Kalai-Smorodinsky rule is substantial and principled. It should not be dismissed as mere legal maneuvering.

  Water law in the American West is built on the doctrine of prior appropriation and adjudicated rights. These are not arbitrary numbers; they are property rights vetted through decades of litigation. To adopt a formula that ignores these entitlements (as Nash does) risks undermining the legal foundation upon which our water users rely for financing, planning, and security.

  Furthermore, the "Monotonicity" argument is morally compelling. It is intuitively unjust if State A suffers a reduction in their wet-year allocation simply because State B successfully defended a water right in court. The KS rule ensures that the Compact respects the judicial branch's work. For a Commission comprised of Governor appointees and legal counsel, the KS rule offers the comfort of continuity with existing law. It treats the Compact as an extension of the legal system, ensuring that "paper water" aligns with "wet water."

  ### The Case for Nash: Why Stability Must Prevail

  While the KS rule is legally elegant, it is operationally dangerous in a warming climate.

  We are entering a period of permanent hydrological uncertainty. The 1950s compromise failed because it assumed a static river. If we adopt the KS rule, we replace a static hydrological assumption with a static legal assumption. We are effectively coding into the Compact an incentive for both states to keep their legal teams permanently engaged, constantly seeking to expand their "ideal points" to capture a larger percentage of any future surplus.

  As an irrigation business owner, I cannot plan infrastructure investments if my water allocation depends on the outcome of a lawsuit filed three states away. The Nash solution creates a **firewall**. It decouples our operational reality from legal posturing.

  The "Independence of Irrelevant Alternatives" property of the Nash solution means that hypothetical claims—entitlements that are not currently being diverted—do not distort the sharing of actual water. In a shortage scenario, this is crucial. It forces the states to focus on what is *available*, not what is *claimed*. This encourages cooperation. If I know that litigating for more paper rights will not increase my share of the next wet year, I have no incentive to sue. I have every incentive to work with my neighbor to maximize the efficiency of the river for both of us.

  In short: KS optimizes for legal fairness in a single year. Nash optimizes for the survival of the Compact over decades.

  ### Recommendation: Nash Solution with a Sunset Review

  I recommend the Commission adopt the **Nash Bargaining Solution** as the permanent shortage-and-surplus protocol, with the following implementation safeguards:

  1.  **Adoption of Nash Formula:** We will allocate flow variations based on equal sharing of gains/losses over the pre-Compact baseline. This ensures that future changes in state water codes or court decrees do not automatically trigger renegotiation of the Compact.
  2.  **Baseline Verification:** To address the KS concern regarding "ignoring rights," we will commission a one-time, joint technical audit to ensure the "status quo" baseline accurately reflects verified, beneficial use diversions. This grounds the Nash solution in physical reality, even if it ignores paper maximums.
  3.  **Ten-Year Review Clause:** Given the unsettled hydrology, this protocol shall be subject to a mandatory review after ten years. This is not a renegotiation of the formula, but a check to ensure the "status quo" baseline remains representative of actual use patterns.

  ### Conclusion

  We are not merely dividing water; we are designing an incentive structure for the next generation. The Kalai-Smorodinsky rule asks us to trust that the legal system will remain static while the river changes. The Nash rule asks us to trust that cooperation is more valuable than litigation.

  Given the stakes, I believe we must choose cooperation. By adopting the Nash solution, we signal to water users, investors, and the public that this Commission prioritizes reliable water delivery over theoretical legal positioning. We can respect water rights without holding the river hostage to them.

  I move that the Economics Subcommittee be instructed to finalize the protocol language based on the Nash Bargaining Solution, incorporating the review clause outlined above, for a vote at the next quarterly meeting.
