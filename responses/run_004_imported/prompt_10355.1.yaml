      *   *What about "mood management" or "blissful ignorance"?* That's usually about utility functions depending on beliefs (non-standard). Hirshleifer is standard EU but with strategic interaction. Stick to the strategic interaction explanation as it's more robust for an econ context.
      *   *Make sure to distinguish between "observing a signal" vs "the signal existing".* Good's theorem is about observing. Hirshleifer is about the existence of the channel affecting the equilibrium.

  10. **Final Structure:**
