          *   Focus on the definition of *Love*. If love is intellectual joy in another's perfection, then optimization *is* love in Leibniz's system. The user's worry stems from a modern emotive definition of love vs. Leibniz's intellectualist definition.
          *   This is a great angle for an EE: Investigating whether Leibniz's intellectualist definition of love saves the system from the charge of cold rationalism.

