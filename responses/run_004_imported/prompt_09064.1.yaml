  **Justifications**

  **(1) Nadia (-1):** Nadia accurately captures the core intuition of the etiological account (history determines function), but her application here is too rigid. By claiming insulation is the function "full stop" and dismissing flight as merely "loose talk," she ignores that etiological theorists allow for *new* functions to arise if selection pressures shift. She treats the trait "feathers" as historically monolithic rather than acknowledging that modern flight feathers constitute a distinct lineage with their own selective history.

  **(2) Owen (1):** Owen correctly identifies a biological fact that complicates Nadia's initial claim: modern feathers *have* been selected for flight. His objection that privileging the *earliest* origin is arbitrary is a strong intuitive critique of naive historical accounts. However, he scores lower than a perfect 2 because he assumes the etiological account *cannot* accommodate this change, whereas sophisticated etiological theories (like Neander's) actually agree with him that flight becomes a proper function once selection maintains it for that purpose.

  **(3) Nadia (2):** This is the strongest move in the exchange. Nadia retreats from her dogmatic opening to state the etiological position precisely: functions are tied to specific selective histories, which can be layered. She correctly maintains the philosophical distinction between "what a trait does" (causal role) and "what a trait is for" (proper function), conceding the biological point without surrendering the theoretical framework.

  **(4) Owen (-1):** Owen makes a category error here. He conflates *epistemology* (how we discover functions, often by looking at current utility) with *ontology* (what makes a function claim true). Even if we use current utility to guess at history, the etiological theorist argues the *truth* of the claim still depends on the history. Furthermore, he dismisses the etiological account's main advantage: its ability to explain *malfunction* (e.g., a grounded bird's feathers still have the function of flight, whereas on Cummins' account, they currently contribute nothing to lift).

  **What Both Are Overlooking**

  While Nadia and Owen do a good job rehearsing the standard debate, they are both overlooking three crucial nuances that would dissolve much of their disagreement:

  1.  **The Problem of Malfunction:** The strongest argument for the etiological account isn't about exaptation, but about error. If a bird breaks its wing, Cummins's account implies the feathers no longer have the function of flight (since they make no causal contribution to lift). The etiological account correctly preserves the intuition that the feathers *should* fly but *can't*. Neither student leverages this "normative" power of the selected-effects theory.
  2.  **Trait Individuation:** They argue as if "feathers" are a single, unchanging trait. In reality, proto-feathers and modern flight feathers are morphologically distinct. If we individuate them as different traits, Nadia is right about the fossils (proto-feathers function = insulation) and Owen is right about modern birds (flight feathers function = lift), without any theoretical conflict.
  3.  **Explanatory Pluralism:** They assume one theory must win. In practice, biologists are often pluralists. When asking "How does the wing work?" (physiology), Cummins's causal-role account is more useful. When asking "Why does the wing exist?" (evolution), the etiological account is superior. The "function" of a trait often depends on the specific explanatory context, not just a single metaphysical definition.
