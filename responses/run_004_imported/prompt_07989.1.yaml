      *   **Easy Knowledge Problem (Vogel):** Related. How easily can we know a source is reliable? Bootstrapping makes it too easy.
      *   **Epistemic Closure:** If I know $P$, and I know $P$ implies $Q$, do I know $Q$? Denying this blocks bootstrapping but has high costs (skepticism).
      *   **Calibration vs. Bootstrapping:** Calibration usually involves an *independent* standard. Bootstrapping uses the *same* standard.

