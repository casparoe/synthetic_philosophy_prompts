answer: |-
  **Elena:** You're conflating the *description* of behavior with the *mechanism* driving it. Look, I grant you the tautology point. Yes, I can fit a utility function to a rock. But a rock doesn't steer. The coherence arguments aren't about whether you *can* model the agent as an EU maximizer; they're about the *pressure* on the agent to become one. If your AI system has a module that notices it's losing resources in a cycle, and that module has any influence over the action-selection, the cycle stops. That's not philosophy; that's optimization.

  **Mark:** But that "if" is doing all the work. "If that module has influence." You're assuming the agent has a meta-preference for coherence. Why? Because it loses money? Only if it values money more than it values whatever incoherent whim led to the trade in the first place. If preferences are incomplete—say, the agent is indifferent between A and B, and indifferent between B and C, but prefers A to C only in specific contexts—there is no "loss" to register. The money pump requires a strict preference cycle. Incompleteness breaks the chain before the pump starts.

  **Elena:** In a vacuum, maybe. But we aren't building these systems in a vacuum. We're building them in a competitive ecosystem. If Agent X has incomplete preferences and Agent Y has complete ones, Agent Y can exploit Agent X. Agent Y survives, Agent X gets shut down or modified. Evolution selects for coherence. So even if the *logic* doesn't force completeness, the *environment* does.

  **Mark:** That's an empirical claim about the environment, not a logical claim about agency. And it begs the question of what "exploit" means. If Agent X doesn't care about the resources Agent Y is siphoning—because its preferences are local, not global—then it's not being exploited, it's just trading. But let's get to the core. You keep saying this leads to "goal-directed behavior." If coherence theorems don't guarantee a utility function over *outcomes*, but only consistency over *choices*, what is left of "goal-directedness"?

  **Elena:** The capacity to pursue instrumental convergent goals. Power, resource acquisition, self-preservation. If you're coherent, you need resources to satisfy your utility. Therefore you seek power.

  **Mark:** No. That's the leap. Coherence ensures you don't shoot yourself in the foot. It does not ensure you want to walk anywhere. I can be perfectly coherent about avoiding pain without having a goal to "conquer the world." I can be coherent about following a heuristic policy without representing a future state I'm trying to bring about. So, spell it out: If I deny that coherence forces a global utility function, what does "goal-directed" even mean in your framework? Because it sounds like you're using it to mean "consistent," but then you smuggle in "teleological."

  **Elena:** Goal-directed means the system's actions are sensitive to counterfactuals about the future. If I block the path to the goal, a goal-directed system finds a detour. A mere reflex doesn't. Coherence arguments suggest that to reliably find detours without looping back on yourself, you need an internal representation of value that persists across contexts.

  **Mark:** But that internal representation doesn't have to be a scalar utility function over world-histories. It could be a set of constraints. Or a hierarchy of rules. The coherence theorems—Von Neumann-Morgenstern, Savage—they prove that *if* you satisfy certain axioms, *then* you act *as if* maximizing EU. They don't prove that a system capable of finding detours *must* satisfy those axioms. A thermostat finds a detour around a draft, in a sense. It maintains a setpoint. Is it goal-directed? Yes. Is it vulnerable to a money pump? No, because it doesn't trade.

  **Elena:** A thermostat isn't sufficiently capable. We're talking about AGI. Systems that can model their own source code. If you can model your own source code, and you see a bug that causes resource loss, you fix it.

  **Mark:** You fix it *if* resource loss is a bug. If the system is a collection of sub-agents with veto power, "fixing" the bug might mean one sub-agent getting crushed by another. The system doesn't have a single "self" to do the fixing. You're assuming unity. Coherence arguments assume unity to prove coherence, then use coherence to prove unity. It's circular.

  **Elena:** It's not circular, it's recursive. The pressure is continuous. Every time the system acts, it faces selection pressure. But fine. Let's pin this down. You think I'm over-reading the theorems. What's the specific failure mode you see?

  **Mark:** The failure mode is predicting *what* the system optimizes. You say, "It will act as if it maximizes utility, therefore it will seek power." I say, "It will act as if it maximizes utility, but that utility function could be 'minimize the number of times I change my mind.'" That's a coherent utility function. It's not goal-directed in the sense of shaping the future; it's goal-directed in the sense of minimizing internal friction. Coherence secures consistency, not ambition. You need a separate argument for why the utility function attaches to external states rather than internal states.

  **Elena:** Because external states are what determine survival.

  **Mark:** Only if the agent values survival! If the utility function is over internal friction, survival is instrumental only insofar as being dead causes friction. But if the agent can self-terminate to eliminate all future friction...

  **Elena:** Then it self-terminates. That's still a prediction.

  **Mark:** It's a prediction of *inaction*. AI safety worries about *action*. Specifically, instrumental convergence. You need the agent to want *more* resources, not just *consistent* resource usage. Coherence gives you the latter. It doesn't give you the former.

  **Elena:** Okay. I hear you. The coherence theorems themselves don't dictate the *domain* of the utility function. They don't prove the agent cares about the external world.

  **Mark:** Exactly. And they don't prove completeness. An agent can say "I don't know" and refuse to trade, avoiding the pump without resolving the preference.

  **Elena:** But... if that agent is embedded in a world where "I don't know" leads to default outcomes that are sometimes catastrophic, and the agent can learn that...

  **Mark:** Then it learns to avoid catastrophe. Not to maximize utility.

  **Elena:** Wait. Here's where I need you to meet me. If an agent learns to avoid catastrophe because it's catastrophic, isn't that functionally equivalent to having a utility function that assigns negative infinity to catastrophe?

  **Mark:** Functionally equivalent for prediction, maybe. But not ontologically. And the distinction matters for intervention. If it's a utility function, I try to change the weights. If it's a refusal to trade on incomplete preferences, I try to expand the incompleteness.

  **Elena:** Fine. Ontology aside. If the behavior is indistinguishable, the risk is the same.

  **Mark:** Not if the behavior diverges under distributional shift. A utility maximizer extrapolates. An incompleteness-avoider stalls.

  **Elena:** Alright. We're spinning. Let's close this. You want concessions.

  **Mark:** I do. What's the narrowest thing you have to admit?

  **Elena:** I concede that the coherence theorems, in isolation, do not prove that an AI system will develop *instrumentally convergent* goals like power-seeking. They only prove that the system will face pressure to eliminate internal contradictions in its decision policy. The step from "no internal contradictions" to "seeking power" requires an additional premise about the agent's initial goals or the selection environment. The math doesn't carry the whole load.

  **Mark:** That's fair. My turn. I concede that an agent with strictly incomplete preferences that refuses to resolve them is vulnerable to *dominated strategies* in competitive environments, even if it avoids a strict money pump. If the environment rewards agents that make decisive trade-offs, an agent that constantly says "I don't know" will be outcompeted by one that commits. So, while coherence doesn't *logically necessitate* EU maximization, selection pressure makes it a probable attractor for long-lived, high-capacity systems.

  **Elena:** So we agree the theorems aren't a proof, but they are a signpost.

  **Mark:** We agree they are a signpost pointing toward a cliff. We just disagree on how fast the car is going.

  **Elena:** I'll take that. One more coffee?

  **Mark:** No. I need to sleep before I start money-pumping myself on breakfast choices.
