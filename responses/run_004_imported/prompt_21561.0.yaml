  8.  **Final Polish:** Check the pacing. Ensure the emotional weight of the publishing house comes through. The math should serve the story, not overwhelm it. (Make sure the lawyers' names are generic or omitted to keep focus on siblings).

  *(Self-Correction on the Game Theory nuance)*: Wait, strictly speaking, KS is often *more* egalitarian regarding the *gains* from cooperation. If Theo creates more value, the total surplus is larger. KS ensures Priya gets a proportionate share of that *larger* surplus, whereas Nash might just ensure she gets her threat point plus a bit. Actually, the key distinction usually cited is that Nash violates monotonicity. If the feasible set expands in Priya's favor (she gets a *better* job offer during mediation), Nash might actually give her *less* in the final deal depending on the curvature of the frontier (counter-intuitive). KS guarantees if her options improve, her deal doesn't worsen.
  *Wait, let's simplify for the novel.* The most narrative-friendly distinction is:
  *   **Nash:** Focuses on the *Disagreement Point* (What happens if we fight?). Priya wins here because she can walk away.
  *   **KS:** Focuses on the *Ideal Point* (What happens if we win?). Theo wins here because the company is worth more under him.
  This is accurate enough for fiction and drives the conflict. I will stick to this interpretation: Nash = Security/Threat; KS = Potential/Upside.

  9.  **Final Review against constraints:**
