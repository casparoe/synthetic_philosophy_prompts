      *   *Check:* Is the distinction clear?
      *   *Fix:* Use the "Leverage vs. Contribution" framing. Nash rewards leverage (Priya's job). KS rewards the scale of the opportunity (Theo's management).
      *   *Check:* Does the arbitrator sound like she understands the limits?
