answer: |-
  **MEMORANDUM**

  **TO:** Counsel for Priya Varkov; Counsel for Theo Varkov
  **FROM:** Elena Vance, Court-Appointed Arbitrator
  **DATE:** October 14, 2023
  **RE:** Recommendation for Division of Varkov Press Assets

  **I. PURPOSE**

  Per the terms of the Last Will and Testament of Margot Varkov, I am submitting this recommendation to resolve the deadlock regarding the division of Varkov Press. You are both aware that my mandate is not merely to find a compromise, but to propose a division that is equitable, sustainable, and consistent with the decedent's intent to preserve the imprint where possible.

  We have reached an impasse. Ms. Varkov seeks a liquidation of her equity for immediate cash value. Mr. Varkov seeks to retain operational control and purchase Ms. Varkov's share over time. The valuation of the company is not the primary dispute; the dispute is regarding *whose* leverage should dictate the terms of the split.

  To resolve this, I have employed two distinct frameworks for fair division often utilized in high-stakes commercial mediation. I owe it to both parties to explain why I am selecting one over the other, as the mathematical distinction here maps directly onto the human conflict.

  **II. THE FRAMEWORKS: NASH VS. KALAI-SMORODINSKY**

  In any negotiation, there is a "disagreement point"—what happens if no deal is reached. In this case, that is a court-ordered fire sale of the backlist and assets. Both parties lose significantly in this scenario, but not equally.

  There are two standard theoretical models for moving from that disagreement point to a deal.

  **1. The Nash Bargaining Solution (NBS)**
  The Nash solution focuses on *leverage*. It asks: "Who can afford to walk away more easily?" It calculates the split based on the relative pain of the disagreement point.
  *   **Application:** Ms. Varkov has secured senior employment elsewhere. Her "pain" from a collapse of Varkov Press is buffered. Mr. Varkov has no outside employment and his professional identity is tied to the press. His "pain" from a collapse is total.
  *   **Result:** Under a strict Nash calculation, Ms. Varkov is entitled to a larger share of the surplus. Because she needs the deal less, the math rewards her threat power. To get her to sign, the price must be high enough to match her outside security.
  *   **The Flaw:** This approach treats the publishing house as a static pile of cash. It ignores that the asset is worth *more* in Mr. Varkov's hands than in Ms. Varkov's. It rewards the person least invested in the future of the company.

  **2. The Kalai-Smorodinsky Solution (KS)**
  The Kalai-Smorodinsky solution focuses on *potential*. It looks at the "ideal point"—the best possible outcome for each party—and tries to maintain a proportional ratio of gains relative to that maximum potential. It satisfies a principle called "monotonicity": if the potential value of the deal grows for one party, their share of the agreement should not shrink.
  *   **Application:** Mr. Varkov is the only party capable of maximizing the "ideal point." The backlist sells better under his editorial direction; the overhead is lower under his management. The total pie is bigger if he runs it.
  *   **Result:** This model suggests Ms. Varkov should receive a share of the *future* value Mr. Varkov creates, rather than a premium on the *current* liquidation value. It prioritizes the efficiency of the outcome over the leverage of the threat.
  *   **The Flaw:** It requires speculating on future performance. It asks Ms. Varkov to bet on her brother's competence rather than taking guaranteed cash now.

  **III. RECOMMENDATION**

  I am rejecting the Nash Bargaining Solution.

  While Ms. Varkov's outside employment offers her security, rewarding her for having a "better walk-away option" effectively penalizes Mr. Varkov for his commitment to the decedent's vision. If we follow Nash, we incentivize the sibling least interested in the business to extract maximum value, likely forcing a liquidation Mr. Varkov cannot afford, killing the imprint Margot Varkov built.

  I am recommending a division structured around the **Kalai-Smorodinsky** principle.

  **The Terms:**
  1.  **Ownership:** Mr. Varkov retains 100% operational control and voting rights immediately.
  2.  **Compensation:** Ms. Varkov receives a buyout equal to 60% of the current appraised fair market value (a discount against the Nash premium).
  3.  **Earn-Out:** To address the disparity in leverage, Ms. Varkov retains a 15% non-voting equity stake for a period of five years, entitled to distributions only if EBITDA exceeds projected growth targets under Mr. Varkov's management.

  **The Rationale:**
  This split acknowledges Ms. Varkov's equity but ties her major payout to the "Ideal Point" (the company's success under Theo). It respects the monotonicity principle: if Theo makes the company more valuable, Priya benefits proportionally. If he fails, she is not left holding debt, but she does not gain the windfall of a Nash-style premium. This aligns with the Will's instruction to "keep the light on."

  **IV. ANTICIPATED OBJECTION AND CONCESSION**

  I expect Counsel for Ms. Varkov to object that this recommendation violates the principle of *independence of irrelevant alternatives*. You will argue that my client's outside job offer is a fact of her life, not a bargaining chip, and that by ignoring her superior leverage, I am effectively taxing her for being employable. You will argue that Kalai-Smorodinsky relies on speculative future earnings, whereas Nash relies on concrete present value.

  **You are correct.**

  This is the weakness of my recommendation. The Kalai-Smorodinsky solution assumes the "Ideal Point" is knowable. It is not. I am basing this recommendation on the assumption that Mr. Varkov is a competent manager. If he is not, the "potential value" I am banking on evaporates, and Ms. Varkov's 15% earn-out becomes worthless. In a Nash framework, she would be insulated from this risk by a higher upfront cash payment.

  By choosing KS, I am asking Ms. Varkov to underwrite her brother's risk. I am asking her to accept that the "fairness" of preserving the family legacy outweighs the "fairness" of her individual market security.

  There is no mathematical formula that can prove this is right. Game theory can only tell us what we are optimizing for. Nash optimizes for individual security. Kalai-Smorodinsky optimizes for collective efficiency.

  Margot Varkov's Will did not ask for the most efficient market transaction. It asked for the preservation of the house. Therefore, I have optimized for the house.

  **V. NEXT STEPS**

  If this recommendation is rejected by either party, my mandate terminates, and the estate moves to court-ordered liquidation. In that scenario, the disagreement point becomes the reality. Based on current market conditions, I estimate the liquidation value will be 40% of the valuation used in this memo. Both parties will lose.

  I advise acceptance.

  Respectfully,

  *Elena Vance*
  *Arbitrator*
