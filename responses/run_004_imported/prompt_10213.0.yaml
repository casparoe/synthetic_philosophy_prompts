              *   *Cost:* Communication complexity. Disagreement becomes elusive (talking past each other).
      *   *Conclusion:* Summarize the trade-off. Logic vs. Probability vs. Metaphysics.

  5.  **Review and Refine:**
      *   *Check:* Did I answer the "sentence or two" request? I should provide a punchy summary.
      *   *Check:* Is the engineer analogy accurate? The "over-constrained system" is good. The "function return value" vs "side effect" is good for non-propositionalism.
      *   *Check:* Did I mention Hájek/Hall? Yes, need to ensure the "cost" aspect is highlighted as substantive, not just technical.
