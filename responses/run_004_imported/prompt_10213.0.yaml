          *   *Engineer Analogy:* It's like a function that doesn't return a value, it just executes a side effect (update). You can't pass it as an argument to another function.
      *   *Route 2: Restricting the Class of Credences (Stalnaker/Weatherson).*
          *   *Idea:* Maybe rational agents can't have *just any* probability distribution. Maybe the "richness" assumption is false.
          *   *Cost:* You limit rationality. You say there are coherent probability distributions that a rational agent is forbidden from having. It makes the logic of conditionals sensitive to metaphysical constraints on belief.
          *   *Engineer Analogy:* You constrain the input domain of your function. It works, but only for valid inputs. You have to validate that your system state never hits the "forbidden" configurations.
      *   *Route 3: Context Dependence (Stalnaker later).*
