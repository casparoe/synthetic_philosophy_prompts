answer: |-
  # The Mercury Paradox: Why Old Evidence Breaks Bayesian Updating (But Not Bayesianism)

  The story is one of the crown jewels of modern physics. In 1915, Albert Einstein finalized the field equations of General Relativity (GR). He didn't wait for a new eclipse or a fresh telescope scan to test it. He reached for a dataset that had been gathering dust for decades: the anomalous precession of Mercury's perihelion. When he plugged the numbers in, GR accounted for the missing 43 arcseconds per century exactly. Einstein reportedly felt a palpitation of the heart; he knew he had the truth.

  For the working scientist, this is a paradigm case of evidential confirmation. For the strict Bayesian epistemologist, it is an impossibility.

  You know the formalism better than I do, so I'll keep the math brief. In standard Bayesian confirmation theory, evidence $E$ confirms hypothesis $H$ (relative to background $K$) if and only if $P(H|E,K) > P(H|K)$. By Bayes' Theorem, this requires that $P(E|H,K) > P(E|K)$. But if $E$ is "old evidence"—known with certainty before $H$ was even formulated—then $P(E|K) = 1$. If the probability of the evidence is already 1, conditionalizing on it cannot shift the probability of the hypothesis. The likelihood ratio is 1. The posterior equals the prior. Mathematically, Mercury's orbit could not have confirmed General Relativity by even a decimal point.

  This is Clark Glymour's "Problem of Old Evidence" (POE). It feels like a bug because, intuitively, it *is* a bug in the naive identification of *confirmation* with *conditionalization*. You and your friend have been sparring over the standard fixes: the Garber/Jeffrey "logical omniscience" move versus the counterfactual/synchronic approaches, with Earman looming in the background suggesting the whole project is doomed.

  Here is the verdict: **Your friend is right about the psychology, but you are right about the epistemology.** The Garber solution saves the *agent's experience* of discovery, but the Counterfactual solution saves the *objective structure* of scientific support. However, both miss the deeper point. The POE proves that **confirmation is not identical to conditionalization.** To solve the problem, we must decouple the logic of support from the history of belief updating. If we do that, the Counterfactual approach emerges as the superior framework for philosophy of science, provided we accept it as a normative ideal rather than a descriptive history.

  ### The Trap of Logical Omniscience

  Let's start with your friend's position, championed by Daniel Garber and Richard Jeffrey. Their move is clever: they argue that the "new evidence" isn't $E$ (Mercury's orbit), but rather the logical fact that $H$ entails $E$ (let's call this $E^*$).

  In the standard Bayesian model, agents are logically omniscient; they instantly know all consequences of their hypotheses. If you know $H$, you instantly know $H \rightarrow E$. But real scientists aren't gods. Einstein didn't know GR entailed the correct perihelion shift until he did the math. So, the argument goes, we should expand the probability space to include logical propositions. Einstein updated not on Mercury, but on the realization *that GR predicts Mercury*. Since $P(E^*)$ was less than 1, the update works. $P(H|E^*) > P(H)$.

  This solution is psychologically satisfying. It matches the "Aha!" moment of discovery. It explains why Einstein felt his heart palpitate: he gained new *logical* information.

  However, as a theory of *scientific confirmation*, it is deeply flawed. It makes evidential support dangerously subjective, dependent on the computational speed of the theorist. If confirmation relies on learning the entailment relation, then a slow mathematician gains more confirmation from the same data than a fast one. If I take a decade to derive the consequences of String Theory, does the Cosmic Microwave Background confirm it more strongly for me than for a genius who derives it in a day?

  Scientific confirmation is supposed to be public and inter-subjective. The support GR receives from Mercury should depend on the relationship between the theory and the world, not on how long it took Einstein to solve the field equations. The Garber solution saves Bayesian updating by turning confirmation into a history of the scientist's logical education rather than a measure of evidential weight. It dissolves the problem by changing the subject from physics to psychology.

  ### The Fiction of Counterfactuals

  The alternative, favored by philosophers like Colin Howson and David Christensen, is the counterfactual or synchronic approach. This view suggests we should assess confirmation by asking: What would our credence in $H$ be if we *didn't* know $E$, but retained all other background knowledge $K$?

  We construct a "ur-prior" or a counterfactual belief state where $P(E) < 1$. In that hypothetical state, we calculate whether $H$ raises the probability of $E$. If it does, then $E$ confirms $H$, even if in actual history $P(E)=1$.

  Your skepticism (and Earman's) likely stems from the artificiality of this move. Can we really "subtract" a fact from our knowledge base without unraveling the whole web of belief? If we pretend not to know Mercury's orbit, do we also pretend not to know the telescopes that measured it? The Newtonian anomalies? The entire context of 19th-century astronomy? This is the problem of holism. The counterfactual scenario can seem like a fiction so contrived that the resulting probability assignment is arbitrary.

  Yet, despite this artificiality, the counterfactual approach captures something the Garber solution misses: the **objective likelihood ratio.** When we say GR was confirmed by Mercury, we mean that GR made Mercury's orbit *more expected* than the rival hypothesis (Newtonian gravity) did. This is a structural relationship between theory and data that exists independently of when the data was found.

  The counterfactual approach works because it treats Bayesianism as a logic of **support**, not a log of **updates**. It asks, "Does this theory predict this data better than the alternative?" rather than "Did this data cause me to change my mind?"

  ### Earman's Pessimism and the Category Error

  This brings us to John Earman's position in *Bayes or Bust!*. Earman argues that the POE shows Bayesian confirmation theory cannot be the complete story of scientific rationality. He suggests that Bayesianism handles coherence well but fails at the dynamics of theory change.

  Earman is right to be pessimistic, but he draws the wrong boundary. The POE is not a failure of Bayesianism; it is a failure of the **Dynamic Assumption**—the idea that confirmation *must* be modeled as a diachronic update (a change in credence over time).

  The Mercury case reveals that scientific rationality involves two distinct modes:
  1.  **Context of Discovery:** The historical process of formulating $H$ and realizing it entails $E$. (This is where Garber wins).
  2.  **Context of Justification:** The logical assessment of how well $H$ fits $E$ compared to rivals. (This is where Counterfactuals win).

  Naive Bayesianism tries to crush these two modes into one mechanism: conditionalization. The POE arises because old evidence functions in the *Context of Justification* but is being forced through the *Context of Discovery* machinery.

  If $E$ is known, it cannot trigger a belief update (conditionalization). But it can still serve as a test of theoretical virtue (likelihood). The fact that $P(E)=1$ prevents *updating*, but it does not prevent *comparison*. We can still calculate $P(E|H,K) / P(E|H',K)$. In the case of Mercury, $P(E|GR) \approx 1$ while $P(E|Newton) \ll 1$. The likelihood ratio favors GR massively.

  ### The Verdict: Support Without Updating

  So, where does this leave us? I argue that the **Counterfactual Approach** is the correct solution, but only if we explicitly reject the identification of confirmation with conditionalization.

  We should accept the counterfactual "fiction" not because it accurately describes the historian's timeline, but because it accurately models the **normative force** of evidence. Science aims for objective support relations. If we adopt the Garber solution, we admit that evidence supports a theory only relative to an agent's logical ignorance. If we adopt the Counterfactual solution, we admit that evidence supports a theory relative to a rational agent's hypothetical state.

  The latter is preferable for philosophy of science. We want to say that GR is *actually* better supported by Mercury than Newton was, regardless of whether Einstein was slow or fast at math, and regardless of whether we personally know the orbit of Mercury today.

  Therefore, the POE is solved by recognizing that **Bayesian Confirmation Theory is a theory of synchronic coherence, not diachronic learning.**

  1.  **Reject the Dynamic Assumption:** Admit that $P(H|E,K) > P(H|K)$ is not the only definition of confirmation. Sometimes confirmation is simply a high likelihood ratio $P(E|H) \gg P(E|H')$, even if $P(E)=1$.
  2.  **Adopt Counterfactual Priors for Assessment:** When assessing the *degree* of support, we use the counterfactual method to establish the likelihood ratio. We ask, "In a state of ignorance regarding $E$, would $H$ predict it?"
  3.  **Use Garber for History:** We concede the Garber solution explains the *psychology* of the scientist (the "kick" of discovery), but we relegate this to the sociology of science, not the logic of confirmation.

  ### Conclusion

  Your friend wants to save Bayesian updating by tweaking the input (making the entailment the evidence). You want to save Bayesian realism by pointing out the structural limits (Earman).

  The truth is that Bayesian updating is the wrong tool for old evidence. You don't use a hammer to tighten a screw. The Mercury data wasn't a hammer to drive Einstein's credence up; it was a screwdriver to tighten the fit between GR and the world.

  The verdict is this: **The Problem of Old Evidence is a pseudo-problem generated by conflating belief revision with evidential support.** The Counterfactual approach is the winner, not because it is historically accurate (it isn't), but because it is normatively necessary. It allows us to say that evidence supports a hypothesis even when it cannot move our credence. We must accept that in science, some things are confirmed without being learned. If Bayesianism cannot accommodate that distinction, then Earman is right: we need a new theory. But if we allow Bayesianism to be a logic of support ratios rather than just a calculus of updates, the counterfactual move saves the program.

  Mercury confirmed Einstein not because he learned something new about Mercury, but because he learned something new about *gravity*. The evidence was old; the explanation was new. Bayesianism can handle that, but only if we stop asking it to be a history book and let it be a judge.
