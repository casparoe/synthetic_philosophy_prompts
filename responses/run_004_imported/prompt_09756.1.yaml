prompt: |-
  I'm the philosophy prof on my university's committee that reviews outside labor contracts (don't ask how I landed that one), and we've got a genuinely hard case this week. A student group wants us to cancel the contract with the firm that staffs the dining halls, arguing the arrangement is exploitative in Marx's technical sense -- not just "underpaid" but literally extracting surplus value from workers who have no real alternative to selling their labor. The contractor's rebuttal, forwarded by the provost's office, is that every worker signed up voluntarily, the wage clears legal minimum, and each of them is strictly better off than their next-best option, so "exploitation" is just activist rhetoric here. The committee's split down the middle, and one member keeps steering us toward alienation instead, which I think is smuggling in a different complaint rather then settling this one. Can you draft the memo I'm bringing Thursday? It needs an actual recommendation (renew, cancel, or renew with conditions) and a rough timeline, and it has to seriously engage the "voluntary and mutually beneficial" defense rather than just dismiss it -- plenty of people who work on exploitation (Roemer, Wertheimer, whoever) think mutual benefit doesn't automatically get you off the hook, so I want that argued through, not just asserted.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy Professor on a university committee reviewing outside labor contracts.
      *   **Task:** Draft a memo for the committee meeting this Thursday.
      *   **Subject:** A student group wants to cancel the dining hall staffing contract due to Marxist exploitation (surplus value extraction, lack of alternatives). The contractor (via the Provost) argues voluntary consent, legal minimum wage, and mutual benefit (Pareto improvement over next-best option).
      *   **Key Constraint:** Must seriously engage the "voluntary and mutually beneficial" defense (citing theorists like Roemer, Wertheimer) rather than dismissing it. Must address the "alienation" red herring.
      *   **Requirements:** Actual recommendation (Renew, Cancel, or Renew with Conditions), rough timeline, professional tone suitable for a university committee.
      *   **Tone:** Academic, rigorous, balanced, decisive but nuanced.

  2.  **Deconstruct the Philosophical Arguments:**
      *   **Student Position (Marxist Exploitation):** Focuses on structural coercion (no real alternative), ownership of means of production (contractor owns the job), and surplus value (profit comes from unpaid labor time).
      *   **Contractor/Provost Position (Liberal/Neoclassical):** Focuses on transactional consent (signed voluntarily), legal compliance (minimum wage), and counterfactual welfare (better than unemployment or worse jobs).
      *   **The "Alienation" Distraction:** One committee member is bringing up alienation (psychological/existential disconnect from labor). The prompt asks to set this aside as a *different* complaint than exploitation.
      *   **Theoretical Engagement (Roemer/Wertheimer):**
          *   *John Roemer:* Exploitation isn't just about surplus value in the transaction; it's about unequal distribution of productive assets (property relations). If workers *could* leave and do equally well but don't because they lack capital/assets, that's exploitation.
          *   *Alan Wertheimer:* Exploitation can occur in mutually beneficial transactions. It's about fairness relative to a baseline, not just harm. A transaction can be beneficial but still exploitative if one party takes unfair advantage of the other's vulnerability.

  3.  **Determine the Recommendation:**
      *   *Cancel:* Too drastic, likely causes immediate harm to workers (unemployment), legally risky, ignores the "mutual benefit" aspect.
      *   *Renew (Status Quo):* Ignores the substantive philosophical critique regarding asset inequality and vulnerability.
      *   *Renew with Conditions:* The most philosophically defensible middle ground. It acknowledges the mutual benefit (don't fire everyone) but addresses the structural inequality/exploitation concern (improve conditions/wages/pathways). This aligns with Roemer's focus on asset distribution and Wertheimer's focus on fairness baselines.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the purpose and the recommendation.
      *   **Context:** Summarize the dispute (Student Group vs. Contractor/Provost).
      *   **Philosophical Analysis (The Core):**
          *   Address the "Voluntary/Mutual Benefit" defense. Acknowledge it has weight (Wertheimer: mutual benefit is necessary but not sufficient for non-exploitation).
          *   Address the "Structural/Asset" critique (Roemer). The workers' "choice" is constrained by property relations, not just physical force.
          *   Address the "Alienation" point. Explicitly state this is distinct from exploitation and shouldn't conflate the decision.
      *   **Recommendation:** Renew with Conditions.
      *   **Conditions:** Living wage (above minimum), pathway to direct employment (addressing asset inequality), transparency.
      *   **Timeline:** Phased approach to avoid shock.
      *   **Conclusion:** Final wrap-up.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't sound *too* Marxist or *too* Neoclassical. I need to sound like a philosopher analyzing the concepts.
      *   *Correction:* Use specific terminology (transactional vs. structural, baseline comparisons). Ensure Roemer and Wertheimer are cited correctly in context.
      *   *Alienation:* Make sure to politely but firmly sideline the alienation argument as requested. It muddies the water on *exploitation*.
      *   *Tone Check:* Is this too academic for a committee memo? It needs to be actionable. Keep the theory tight and linked to policy.

  6.  **Final Polish:**
      *   Check the timeline feasibility.
      *   Ensure the recommendation is clear.
      *   Verify the engagement with the "voluntary" defense is robust (i.e., admitting that voluntary doesn't equal non-exploitative).

  7.  **Final Output Generation:** (This matches the provided good response.)
