      *   *Recommendation:* Renew with Specific Conditions.
      *   *Reasoning:* Distinguish between transactional benefit and structural vulnerability.

  *(Self-Correction Note: Make sure to explicitly mention that firing them hurts them, which validates the Contractor's point, but keeping them as-is validates the Students' point. Hence, conditions.)*

  8.  **Final Review against constraints:**
      *   Recommendation included? Yes.
      *   Timeline included? Yes.
      *   Engage "voluntary/mutual benefit"? Yes (Wertheimer/Roemer).
      *   Address Alienation distraction? Yes.
