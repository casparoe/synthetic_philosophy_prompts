  ### TA-to-TA Note
  Since you mentioned you're prepping for a potential pushback: The student's error is objective. In the literature (Kornhauser & Sager; List & Pettit), **Premise-Based Procedure (PBP)** always means aggregating judgments on premises and deriving the conclusion, while **Conclusion-Based Procedure (CBP)** means aggregating judgments on the conclusion directly. The student explicitly described CBP but labeled it PBP. If they argue semantics, point them to List & Pettit (2004), "Group Decision Making by Judgment Aggregation," where the distinction is formalized. The first half of their essay proves they *know* the difference conceptually (since they used it correctly in the paradox example), which makes the swap in the second half indefensible as a mere misunderstanding of the concept—it looks like a slip in terminology that invalidated their argument.
