      *   *Move 2: The Symbolic Details (Guide III:46).* Why *these* animals? Because pagans worshipped them. Why *not* sheep/goats in certain contexts? Because Sabians revered them. The details are polemical/anti-idolatrous.
      *   *Reconciliation:* How do these fit? The *institution* is a concession, but the *specifics* are designed to undermine the pagan mindset while accommodating the psychological need. It's not "hollow"; it's a strategic redirection. The goal is monotheistic education, not just ritual compliance.
      *   *Nuance:* Maimonides doesn't say sacrifice is *meaningless* now, but that its ultimate purpose was to lead to a higher form of worship. However, until the Messianic era (or perhaps forever, depending on interpretation), the law stands.

