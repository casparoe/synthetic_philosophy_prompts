prompt: |-
  I'm a novelist. My most recent book was a work of historical fiction set in 1760s Glasgow and Edinburgh in which Adam Smith makes a couple of cameo appearances, and that book is apparently why I've been co-opted onto my university's Heritage and Naming Review Panel as the resident "expert" whenever his name comes up. It has come up this term. A student petition, backed by a number of humanities and social-science staff, wants the university to rename the Adam Smith Lecture Theatre on the grounds that his economic theory supplied the intellectual scaffolding for Britain's colonial expansion, and that continuing to honour him amounts to institutional whitewashing. The petition quotes Smith's own verdict on the colonial project — that it had "hitherto been, not an empire, but the project of an empire; not a gold mine, but the project of a gold mine" — as evidence that even he saw the whole enterprise as a costly failure. A rebuttal circulating among the panel's economists quotes his outrage at the "savage injustice of the Europeans" toward the native peoples of the Americas and the East Indies as evidence that he was, if anything, an early critic of imperial conduct rather than its apologist. Both quotations, as it happens, come from the same chapter of Book IV — "Of Colonies" — and I don't trust either camp to have read much past the sentence it needed.

  Our terms of reference require the panel to settle on exactly one of three recommendations at our meeting in a fortnight: retain the name unchanged, retain it alongside a permanent contextualising plaque (for which we would need to sketch out the actual wording), or rename the theatre outright. Could you draft the short memo I will circulate to the panel beforehand? I need it to engage properly with what Smith actually argued in that chapter — about the monopoly of colonial trade, the costs that empire imposed on Britain itself, his proposal for a taxed-and-represented colonial union, and his treatment of the peoples on the receiving end of European expansion — rather than settling the matter by gesturing vaguely at "historical context" or "the standards of his time." Whichever recommendation you reach, state the strongest version of the losing argument in terms its proponents would recognize as their own, not a straw version of it; several of my colleagues have well-honed instincts for spotting the latter. And whatever you recommend, give it a concrete next step and a date — wording for the plaque, a timeline for the renaming, or a fixed point at which the panel should revisit the question if we retain the name outright.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Novelist, historical fiction writer (1760s Glasgow/Edinburgh, Adam Smith cameos), member of university Heritage and Naming Review Panel.
      *   **Task:** Draft a short memo to circulate to the panel before their meeting in a fortnight.
      *   **Context:** Student/staff petition wants to rename the Adam Smith Lecture Theatre (ASLT) due to Smith's alleged role in scaffolding colonial expansion. Economists counter that Smith criticized imperial conduct. Both quote *Wealth of Nations* (WN), Book IV, Chapter VII ("Of Colonies").
      *   **Constraints/Requirements:**
          *   Engage properly with Smith's actual arguments in WN Book IV, Ch. VII (monopoly, costs to Britain, colonial union proposal, treatment of indigenous peoples).
          *   Avoid vague gestures at "historical context" or "standards of his time."
          *   Choose *one* of three recommendations: Retain, Retain + Plaque, Rename.
          *   State the strongest version of the *losing* argument (steel-manning, not straw-manning).
          *   Provide a concrete next step and a date (wording, timeline, or review date).
          *   Tone: Professional, academic, nuanced, persuasive (fitting a novelist on a university panel).

  2.  **Determine the Recommendation:**
      *   *Option 1: Rename.* This aligns with the petition. However, Smith's critique of empire is quite strong in WN. Renaming might ignore his specific criticisms of the *system* of mercantilism and colonial monopoly.
      *   *Option 2: Retain Unchanged.* This aligns with the economists. But it ignores the legitimate harm caused by theories *derived* from Smith (even if misinterpreted) and the reality that Smith *did* benefit from the system he critiqued (Customs Commissioner). It feels too dismissive of the petitioners' concerns.
      *   *Option 3: Retain + Plaque.* This offers a middle ground. It acknowledges Smith's complexity (critic of empire, yet product of it), educates the community on his actual text (Book IV, Ch. VII), and addresses the "whitewashing" accusation by adding context rather than erasing history. This seems the most intellectually honest path for a panel that includes both historians and economists. It allows for the nuance the user requested.

      *Decision:* **Retain alongside a permanent contextualising plaque.** This allows for the engagement with the text required by the prompt.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the decision and the polarization. State the purpose of the memo.
      *   **Engagement with Smith's Text (The Core):**
          *   Need to address Book IV, Chapter VII ("Of Colonies").
          *   *Petitioners' point:* Smith provided scaffolding. *Counter:* He critiqued the monopoly.
          *   *Economists' point:* Smith criticized "savage injustice." *Counter:* He still saw European dominance as inevitable/profitable if managed right, and he worked for the Crown.
          *   *Key nuances:* The "project of a gold mine" quote (costly to Britain), the proposal for colonial representation (unrealistic), the condemnation of violence (but within a framework of commercial society).
      *   **Steel-manning the Losing Argument:**
          *   If I recommend Retain + Plaque, the "losing" arguments are effectively both the "Rename" and "Retain Unchanged" camps. I need to pick the strongest opposing view. Usually, in these contexts, the "Rename" argument is the one being voted against if we choose retention. However, the prompt asks to state the strongest version of the *losing* argument. If I recommend Retain + Plaque, technically both pure Rename and pure Retain are losing. I should focus on the **Rename** argument as the primary opposition, as that's the catalyst for the panel.
          *   *Steel-man for Rename:* It's not just about Smith's intent, but the *effect* of his legacy. Liberal economics justified extraction. Honoring him signals institutional priority.
      *   **The Recommendation:** Retain name + Plaque.
      *   **Concrete Next Step:** Draft the plaque wording and set a date for installation/unveiling.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Tone Check:* Is it too dry? The user is a novelist. It should be eloquent but precise.
      *   *Textual Accuracy:* Ensure the WN references are accurate.
          *   "Project of an empire/gold mine": WN IV.vii.b.56.
          *   "Savage injustice": WN IV.vii.b.55.
          *   Monopoly of trade: WN IV.vii.b.
          *   Colonial Union proposal: WN IV.vii.b.67-73.
      *   *Avoiding "Standards of the Time":* The prompt explicitly forbids this lazy defense. I must focus on the *text* and the *legacy*, not just "he was an 18th-century man."
      *   *The Plaque:* Needs to be specific. Not just "Smith was complex," but citing the specific tensions (critique of monopoly vs. acceptance of commercial expansion).

  5.  **Drafting the Memo (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Recommendation regarding Adam Smith Lecture Theatre."
      *   *Introduction:* Set the scene. We are arguing over a text, not just a symbol.
      *   *Analysis:* Break down the Book IV, Ch. VII arguments.
          *   Smith argued the monopoly hurt *Britain* (costly defense, distorted capital).
          *   He argued the treatment of natives was unjust ("savage injustice").
          *   BUT, he proposed a union that would integrate colonies, not liberate them. He saw commercial society as the end goal.
      *   *Steel-man:* The petitioners are right that "Smithianism" became the language of empire, even if Smith was skeptical of *this* empire. The symbol matters.
      *   *Recommendation:* Retain + Plaque. Why? Because erasure stops conversation; context fuels it.
      *   *Action:* Draft plaque text. Set deadline.

  6.  **Final Review against Constraints:**
      *   Engage with Book IV, Ch. VII? Yes.
      *   Monopoly, costs, union, indigenous peoples? Yes.
      *   No vague "historical context"? Yes.
      *   One of three recommendations? Yes (Retain + Plaque).
      *   Strongest losing argument? Yes (The Rename argument regarding legacy vs. intent).
      *   Concrete next step + date? Yes (Plaque draft by [Date]).

  7.  **Final Polish:** Ensure the voice sounds like a novelist who knows their history—slightly narrative, precise, empathetic but firm. (e.g., using phrases like "intellectual scaffolding," "textual ammunition," "uncomfortable inheritance").

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the economists either. The economists are right about the text, but wrong about the impact of the symbol. The petitioners are right about the impact, but maybe reductive about the text. The plaque bridges this.

  *Date:* The meeting is in a fortnight. The memo is circulating *beforehand*. The next step should be post-meeting. Let's set a date for the plaque wording finalization shortly after the decision.

  *Plaque Wording:* I should provide a *draft* of the wording as part of the "concrete next step" to show I've thought it through, or commit to producing it by a date. The prompt asks for "wording for the plaque, a timeline for the renaming, or a fixed point... if we retain." I will provide the *draft wording* in the memo to strengthen the recommendation.

  *Wait, one constraint check:* "State the strongest version of the losing argument." If I recommend Retain + Plaque, the "Rename" camp loses. I must articulate their view charitably.

  *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Heritage and Naming Review Panel
  **FROM:** [Your Name], Faculty of Humanities
  **DATE:** 1 October 2023
  **SUBJECT:** Recommendation regarding the Adam Smith Lecture Theatre

  **Purpose**

  In preparation for our meeting on 15 October, this memo outlines my assessment of the petition to rename the Adam Smith Lecture Theatre. Having reviewed the submissions from the student petitioners and the faculty economists, it is clear that both camps are marshalling evidence from the same source: Book IV, Chapter VII ("Of Colonies") of *The Wealth of Nations* (1776). The divergence lies not in the text itself, but in whether we honour Smith for his *intent* or judge him by his *legacy*.

  **Engagement with *The Wealth of Nations*, Book IV, Chapter VII**

  To decide on the name, we must be precise about what is being named. The petitioners argue Smith provided the "intellectual scaffolding" for empire. The economists argue he was an early critic of it. Both are partially correct, but neither captures the full tension of the chapter.

  1.  **On the Costs of Empire:** Smith did indeed argue that the colonial project was "the project of a gold mine." He contended that the monopoly of colonial trade drained capital from Britain's domestic economy and that the cost of defending the colonies exceeded the revenue gained. He viewed the British Empire not as a triumph of mercantilism, but as a drag on British prosperity.
  2.  **On Indigenous Peoples:** Smith's condemnation of European conduct is explicit. He wrote of the "savage injustice of the Europeans" in the Americas and East Indies, acknowledging that the "natural advantages" of Europe were amplified by "force and violence." He did not justify this violence as civilising; he recorded it as predatory.
  3.  **On the Solution:** However, Smith's critique was not a call for decolonisation or independence. His proposal was a political union between Britain and the colonies, with colonial representation in Parliament and a tax system to share the burden of imperial defence. He sought to reform the empire into a consolidated commercial state, not dismantle it.
  4.  **On the Legacy:** While Smith criticised the *mercantilist management* of the empire, his broader theory of commercial society—where market expansion drives progress—was subsequently utilised to justify the very extraction he scrutinised. The economists are right that Smith criticised the *conduct* of the 1760s empire; the petitioners are right that Smithian economics later became the *language* of the 19th-century imperial project.

  **The Strongest Argument for Renaming**

  If the Panel votes to retain the name (with or without a plaque), the losing argument is that of the petitioners. It is vital we represent their position with the rigour it deserves, not as a demand for erasure, but as a critique of institutional signalling.

  The strongest case for renaming is not that Smith was a hypocrite, but that the *effect* of his work superseded his *intent*. Regardless of Smith's personal misgivings about the monopoly of colonial trade, his name is inextricably linked to the rise of laissez-faire capitalism, which facilitated the extraction of resources from the Global South. To retain the name is to prioritise the author's nuance over the lived historical consequences of the ideology bearing his name. For students from post-colonial contexts, the Lecture Theatre is not a tribute to an 18th-century moral philosopher, but a marker of who the institution considers foundational. If the university claims to value inclusivity, continuing to centre a figure whose theoretical legacy justified extraction sends a contradictory message. The petitioners argue that "contextualisation" is often read as "justification," and that true reconciliation requires making space for names that do not carry this specific baggage.

  **Recommendation: Retain Name with Permanent Contextualising Plaque**

  I recommend we **retain the name alongside a permanent contextualising plaque.**

  Erasing Smith's name resolves the symbolic tension by removing the subject, but it forfeits the pedagogical opportunity. Smith's text in Book IV, Chapter VII is not a defence of empire; it is a complex critique of it from within. Removing his name suggests his work cannot withstand scrutiny. Retaining it without context suggests his work requires no scrutiny. A plaque allows us to hold both truths: that Smith was a product of Glasgow's tobacco trade era who critiqued the empire that enriched his city, and that his legacy is contested.

  This approach respects the economists' fidelity to the text while acknowledging the petitioners' concern regarding institutional signalling. It transforms the theatre from a shrine into a site of inquiry.

  **Concrete Next Step**

  Upon approval of this recommendation, the Panel Secretariat should commission the following plaque text for installation by **1 March 2024**.

  ***

  **DRAFT PLAQUE TEXT**

  **THE ADAM SMITH LECTURE THEATRE**

  Adam Smith (1723–1790), a professor at this University, published *The Wealth of Nations* in 1776. While often cited as a defender of free markets and empire, Smith's analysis of British colonialism was critical and complex.

  In *The Wealth of Nations*, Smith argued that the monopoly of colonial trade was economically damaging to Britain and described the European treatment of indigenous peoples in the Americas and East Indies as a "savage injustice." He proposed a political union with the colonies rather than their subjugation, though he stopped short of advocating for independence.

  This theatre bears his name not as an endorsement of all aspects of his legacy, but as a prompt to engage with the history of economic thought. Smith's work helped shape the modern world, including the systems of global trade and colonial expansion. We retain this name to encourage ongoing critical examination of the relationship between economics, ethics, and empire.

  ***

  **Action Required**

  I ask that the Panel review this draft wording prior to the 15 October meeting. If we agree to this path, I propose we form a sub-committee to finalise the design and location of the plaque by **1 November**, ensuring installation before the start of the next academic term.

  I look forward to discussing this with you.
