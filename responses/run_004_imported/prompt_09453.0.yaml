  1.  **Analyze the Request:**
      *   **Topic:** Condorcet Jury Theorem (CJT) application to a neighborhood mutual aid fund review panel.
      *   **Current Situation:** 3 volunteers (from a pool of ~12), discuss aloud in fixed order (newest last), vote by show of hands.
      *   **Proposal:** Board member wants to increase panel size to 7 or 9 to reduce mistakes (based on CJT logic).
      *   **User's Concern:** Fixed speaking order and small, like-minded pool violate independence assumptions of CJT. More voters might create false confidence rather than accuracy.
      *   **Task:** Draft a short memo for the board meeting.
