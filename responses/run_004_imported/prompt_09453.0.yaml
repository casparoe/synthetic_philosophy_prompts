      *   *Wait, looking closer:* The prompt says "pool of about a dozen." If I need 9 reviewers per case, that's 75% of the pool. That's unsustainable. I need to point this out gently.
      *   *Revised Recommendation:* Increase to 5 immediately. Plan for 7 only if we expand the pool. Focus heavily on the *process* changes (secret ballot, discussion order) because that yields high ROI on accuracy without the logistical cost.

  9.  **Final Polish:** Check against CJT terminology (independence, competence, majority rule). Ensure the "fixed order" issue is highlighted as a threat to independence.

      *(Self-Correction on "Fixed Order"):* The prompt says "newest member last." This is actually interesting. Usually, seniority speaks first. If newest speaks last, they might be influenced by the seniors. This is a classic information cascade. I need to mention that.

      *(Final Plan):*
