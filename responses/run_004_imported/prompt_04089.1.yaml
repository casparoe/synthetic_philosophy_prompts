answer: |-
  **Setting:** *A quiet corner of a coffee shop near a tech conference. Two laptops are open, but neither is being typed on. Elena (Coherence Theorist) and Marcus (Resolute Choice Defender) are finishing a whiteboard session on a napkin.*

  **Elena:** Okay, let's lock in the scenario. You have a ticket to the BayArea conference. I know your preferences: you'd pay $1 to swap BayArea for Seattle. You'd pay $1 to swap Seattle for Austin. And you'd pay $1 to swap Austin back to BayArea.

  **Marcus:** Correct. Cyclic preferences. A < B < C < A, with a small transaction cost each step.

  **Elena:** So, if I meet you in the lobby, I offer you the BayArea-to-Seattle swap. You take it. You're now at Seattle, minus a dollar. Then I offer Seattle-to-Austin. You take it. Minus another dollar. Then Austin-to-BayArea. You take it. Minus a third dollar. You're back where you started, but three dollars poorer. I can do this forever. You are a money pump. Therefore, your preference structure is irrational.

  **Marcus:** That follows *if* I'm a naive agent who only evaluates the trade in front of me. But I'm not naive. I'm sophisticated. I see the loop.

  **Elena:** So you refuse the first trade?

  **Marcus:** Exactly. I resolve, at time zero, to keep the BayArea ticket. When you offer the swap to Seattle, even though I locally prefer Seattle, I stick to my resolution. I don't take the trade. I keep my dollar.

  **Elena:** This is the McClennen move. "Resolute Choice." But Marcus, look at what you've actually done. At time zero, you had a choice between "Keep BayArea" and "Start the Pump." You chose "Keep BayArea." That implies you prefer keeping BayArea over starting the pump.

  **Marcus:** Sure.

  **Elena:** But at time one, when I offer the swap, you locally prefer Seattle. By refusing, you are choosing an option you *less* prefer in that moment. Why? Because you value " sticking to the plan" more than "having Seattle."

  **Marcus:** I value the *outcome* of the plan.

  **Elena:** Precisely! So, let's write down your *actual* preferences. You prefer "BayArea (via Plan)" to "Seattle (via Trade)." You prefer "Seattle (via Plan)" to "Austin (via Trade)." Your preferences aren't cyclic over the *real* options available to a sophisticated agent. They're consistent over "Outcomes-with-History." You've just smuggled consistency back in through the side door by redefining the objects of preference. You haven't escaped the coherence theorem; you've just expanded the state space until the theorem applies again.

  **Marcus:** That's the standard rebuttal, Elena. But it conflates *preference* with *choice*. You're assuming that to choose X over Y, I must prefer X to Y *at the moment of choice*.

  **Elena:** If you don't prefer it, why would you choose it? Randomly?

  **Marcus:** Because I'm an agent extended through time, not a series of time-slices. Resolute choice isn't about changing my local ranking. I admit, at time one, I strictly prefer Seattle to BayArea. If you held a gun to my head and asked only about the tickets, I'd say Seattle. But I also have a capacity for *planning*. I can adopt a policy that overrides my local ranking to secure a globally better outcome.

  **Elena:** But what drives the adoption of the policy? If the policy isn't derived from your preferences, what is it derived from? Magic?

  **Marcus:** It's derived from my recognition that naive maximization leads to loss. It's a meta-preference. I prefer being the kind of agent who keeps resolutions.

  **Elena:** Aha! "I prefer being the kind of agent who keeps resolutions." Now we're talking. So, let's add that to the utility function. `Utility = Ticket Value + Resolution Bonus - Cost`. If the Resolution Bonus is high enough to outweigh the $1 cost, your preferences are acyclic. You're an expected utility maximizer after all, just with a quirky term in your utility function for "self-signaling."

  **Marcus:** No, that's still not it. You're trying to reduce *agency* to *ranking*. The point of resolute choice is that rationality isn't just about having a consistent ordering of states. It's about the capacity to bind your future self. If you say "You only avoid the pump if you have a higher-order preference for resoluteness," you're saying that willpower is just another taste, like liking chocolate.

  **Elena:** Isn't it?

  **Marcus:** If it were just a taste, then an agent without that taste would be *irrational* to be resolute. But McClennen's point is that *any* agent, regardless of their taste for resoluteness, ought to be resolute to avoid exploitation. It's a requirement of instrumental rationality, not a contingent preference. If you have cyclic preferences, you *should* use resolute choice. You don't need to *want* to use it; you just need to recognize it's the winning strategy.

  **Elena:** But "should" implies a goal. What's the goal?

  **Marcus:** Preservation of resources.

  **Elena:** Which is measured by... utility. If you act to preserve resources, you reveal that resource preservation is part of your utility. We're going in circles. Look, let's sharpen the knife. There are newer money pumps, designed for agents with *incomplete* preferences, not just cyclic ones.

  **Marcus:** The "sweetened" trades?

  **Elena:** Right. Suppose you don't prefer A to B, and you don't prefer B to A. You're indifferent or incomparable. I can still pump you by offering a trade from A to B+ (B plus a penny), then B+ to A. You take the first because B+ is strictly better than B, and you were indifferent between A and B. Then you take the second because... well, the setup is trickier, but the point is, these pumps target the *structure* of decision-making, not just the ranking. Resolute choice struggles here because the "plan" itself becomes unstable if your preferences are genuinely incomplete. You can't resolve to stick to A if you have no basis to prefer A over B+.

  **Marcus:** I'd argue resolute choice handles incomplete preferences even better. If my preferences are incomplete, I have *more* need for a policy to break the tie. I resolve: "In cases of incomparability between A and B, I default to A." That's a policy, not a preference revelation.

  **Elena:** But why default to A?

  **Marcus:** Because I need to pick *something* to avoid the pump. The justification is pragmatic, not axiological.

  **Elena:** "Pragmatic." That's the word I'm hunting. You're saying rationality is about winning, not about consistency.

  **Marcus:** I'm saying consistency is a *tool* for winning, not the definition of it. If I can win by being resolute with cyclic preferences, then cyclic preferences aren't irrational. They're just expensive to manage if you're naive.

  **Elena:** But now you've made "rationality" unmoored. If I can have *any* preference structure as long as I have a "resolute policy" to patch the leaks, then the coherence theorems tell us nothing about AI. We can't predict an AI will maximize utility. It might maximize a cycle, protected by a resolute shield.

  **Marcus:** And that's a feature, not a bug. It allows for values that are context-dependent or non-transitive—like human values—without forcing us to say humans are fundamentally broken.

  **Elena:** It allows for it, but it doesn't explain *how* the shield is implemented. In code, a "resolution" is just a conditional statement. `if (trade == pump_step_1) then reject`. Where does that condition come from? It comes from a model of the world that predicts the pump. That model assigns a negative value to the "Pumped" state. That negative value makes the "Pumped" state less preferable than the "Status Quo" state.

  **Marcus:** You're insisting on translating every cognitive move into a preference ranking.

  **Elena:** I'm insisting that if it acts like a preference, we should model it as a preference. If your "resolution" systematically causes you to reject trades you locally desire, then functionally, you prefer "Following Resolution" to "Satisfying Local Desire." If you functionally prefer it, it's a preference. If it's a preference, and it stops the pump, your *effective* preferences are acyclic. So the theorem holds: Effective rationality implies effective consistency. You're just hiding the consistency in the policy layer.

  **Marcus:** Okay, let's grant that. Let's say my "effective preferences" are consistent. Does that mean my *underlying* values are consistent?

  **Elena:** For the purpose of predicting your behavior and ensuring AI safety? Yes. If the AI behaves like an expected utility maximizer because of resolute choice, we can treat it as one.

  **Marcus:** But if the underlying values are cyclic, the AI might behave inconsistently in scenarios where resolute choice *fails*. For example, if the pump is too complex to foresee, or if the resolution mechanism is corrupted. If we assume the AI is an EU maximizer because of resolute choice, we might miss the fragility of that resolution.

  **Elena:** Now *that* is an argument I can buy. You're not saying resolute choice invalidates the coherence theorem; you're saying it creates a layer of abstraction that might leak.

  **Marcus:** Exactly. The money pump shows that naive cyclic agents lose. Resolute choice shows that sophisticated cyclic agents survive. But sophistication requires computational power and self-knowledge. The coherence argument warns us: "If you build an agent that doesn't maximize utility, it will lose money." My counter is: "It will only lose money if it's too dumb to plan."

  **Elena:** So the risk isn't that the AI has cyclic preferences. The risk is that the AI is *naive*.

  **Marcus:** Or that we, the designers, assume resoluteness is free. It's not. It costs compute. It costs alignment stability. If the AI rewrites its own code, it might decide the "resolution" constraint is inefficient and delete it. Then the pump starts.

  **Elena:** Okay. So we agree on the threat, but disagree on the label. You call it "Resolute Choice with Cyclic Values." I call it "Expected Utility Maximization with a high-cost constraint on policy switching."

  **Marcus:** I call it "Being an agent instead of a function."

  **Elena:** *Laughs.* Fine. But if I offer you that trade for the Seattle ticket right now, are you taking it?

  **Marcus:** *Checks napkin.* No. I resolved at the start of the conversation not to trade.

  **Elena:** See? You're maximizing the utility of "Keeping Your Word to Elena."

  **Marcus:** Or I'm just stubborn.

  **Elena:** In this model, that's the same thing.

  **Marcus:** Maybe. But I still have my three dollars.

  **Elena:** You do. And I still have my theorem.

  **Marcus:** *Closes laptop.* Coffee's on me. Since I'm not getting pumped today.

  **Elena:** Deal. But I'm ordering the most expensive thing on the menu. Consider it a stress test.

  **Marcus:** I'll resolve to pay for it.

  **Elena:** I knew you would.
