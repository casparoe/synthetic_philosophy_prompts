      *   **Resolute Choice Defender (RCD):** Believes money pumps only exploit *naive* agents. A sophisticated agent can adopt a policy ("I will not trade C back to A") and stick to it, even if at that specific moment they prefer A to C. This preserves the underlying cyclic preferences but avoids the loss.
      *   **The Crux:** Is "resoluteness" just a disguised form of consistency? If I resolve to do X instead of Y, don't I now prefer "Doing X per my plan" over "Doing Y per my whim"? If so, haven't I just changed my preference ordering to be consistent?

