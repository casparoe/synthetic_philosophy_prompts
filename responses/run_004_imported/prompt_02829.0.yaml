  this is so wierd coming from a guy who's otherwise so careful everywhere else in the paper. was turing being sincere about ESP here, or is this some kind of hedge / rhetorical move on his part? and seperate from that question -- does the telepathy-proof room patch actually work within his own framework, or does taking ESP seriously kind of undercut the physicalist premise the whole imitation game seems to depend on? kinda curious how you'd read this passage.
