prompt: |-
  I run a small legal theory podcast and next week's guest defends Fuller's side of the Hart-Fuller debate -- basically the claim that law has an "inner morality" just by virtue of being law, not because of what any particular rule says. Can you draft me 8-10 interview questions that dont just have her restate the eight principles of legality? Want at least one on the grudge informer case (does denying the Nazi statute was ever really law actually cost less, morally, than Hart's preferred route of an honest retroactive statute?), one on the standard jab that her eight principles are really just the efficacy conditions of any purposive enterprise -- the same internal standards a well-run gang of poisoners would need -- so meeting them can't be what makes a system distinctively legal, let alone moral, and one on whether the 8th principle, congruence between declared rule and official action, is secretly doing more work than the other seven combined. For each, give the reply she's most likely to make and a sharp follow-up that presses on it.
