answer: |-
  The Geiger counter hummed, a low electric thrum beneath the sterile lab lights. A's hand hovered over the trigger mechanism. The device was simple: a quantum spin measurement coupled to a cyanide release. Fifty-fifty, theoretically. In Everett, certain.

  "Don't," B said, stepping into her peripheral vision. "You're treating measure zero like it's irrelevant. It's not."

  A didn't look up. "Measure isn't probability, Mark. It's weighting. In the branches where I die, there is no experience of death. There is just cessation. In the branches where I live, there is experience. I am necessarily located in the latter."

  "That's the selection effect fallacy," B snapped. "Just because a survivor exists to ask the question doesn't mean *you*, standing here *now*, should anticipate survival. Imagine a single-world setup where you have a one-in-a-billion chance of surviving a fall. You'd be terrified. Why does branching change the rationality of fear?"

  "Because in the single-world case, the probability maps to the unique future. Here, the future is a manifold. I'm not betting on *which* branch occurs; they all occur. I'm betting on where my conscious stream flows. It flows where there is a stream."

  "But the Born rule!" B gestured at the apparatus. "Deutsch and Wallace proved that if you want to be a rational agent in an Everettian universe, you must act as if the branch weights are probabilities. If you ignore them, you're vulnerable to Dutch books. If you run this enough times, the measure of the 'A' who survives drops exponentially. The 'A' who survives is a freak outlier. You should care about your successors proportionally to their measure."

  A finally turned, hand still resting on the plastic cover. "Proportionally? Why? Parfit taught us that identity isn't what matters. Psychological continuity is. This machine induces fission. One input, two outputs. In one output, my psychology ends. In the other, it continues. Why should the *weight* of the discontinued branch affect the anticipation of the continued one? If I split into two successors, and one dies, I survive in the other. The weight of the dead branch is just a fact about the universe's structure, not a fact about my future experience."

  "It's a fact about *caring*," B insisted, moving closer. "Think about Sleeping Beauty. When she wakes, she has self-locating uncertainty. She should assign credence based on the number of awakenings. Here, before the trigger clicks, you have self-locating uncertainty about which branch you'll find yourself in. You should assign credence based on the Born weights. If ninety-nine percent of the measure of 'A' dies in the next second, you should act as if you're ninety-nine percent likely to die. To do otherwise is solipsism of the moment."

  "That's where the analogy breaks," A said, her voice steady. "Sleeping Beauty wakes up in both cases. I don't. In the death branch, there is no waking up. There is no subject to hold the credence. You're asking me to fear a future where I am not there to do the fearing. That's not rationality; that's altruism for a ghost."

  "It's not altruism, it's decision theory!" B's voice rose. "You're privileging the first-person perspective arbitrarily. If I offered you a bet—penny for survival, life savings for death—you'd take it, right? Because you know you'll survive to collect?"

  "Obviously."

  "Exactly! So you *do* know the weights matter for decision making. You're just compartmentalizing. You admit the weights govern bets, but you deny they govern fear. That's incoherent. If you should bet as if you'll die, you should fear as if you'll die."

  A smiled, thin and sharp. "I bet based on the utility of my successors. The surviving A gets the penny. The dead A gets nothing. The net utility is positive. But fear? Fear is a phenomenological prediction. I am predicting my experience. My experience will be of a click, and then silence, or a click and then breath. It will never be of death. The 'I' that dies is not me; it's a divergent counterpart who ceases to be. I am the chain of continuers. As long as the chain isn't broken *for the continuer*, I am immortal."

  "The chain breaks in almost all of reality," B said, his voice dropping, urgent. "You're saying the measure of existence doesn't matter. That makes you a monster to your own successors. The vast majority of your measure dies screaming. You're dismissing them."

  "I'm acknowledging that they don't suffer forever," A countered. "And I'm acknowledging that *I* won't either. You want me to dread the end of branches where I don't exist. I'm saying dread requires a subject. You're clinging to a single-world intuition of probability in a multi-world ontology. You want the weights to collapse the wavefunction of my anticipation. They don't."

  A's finger tightened on the trigger.

  "If you do this," B said, "and you survive, you've proven nothing except that you're lucky. You haven't proven immortality. You've just pruned yourself down to a vanishingly thin sliver of measure. You're making yourself negligible."

  "Better negligible than nonexistent," A said.

  "That's not the choice," B pleaded. "The choice is between being a high-measure person who lives a normal life, or a low-measure myth who thinks they're invincible. You're conflating 'I will experience survival' with 'It is rational to expect survival.' The first is true. The second is madness."

  "Maybe," A said. "But I'm the one who's going to experience finding out."

  She pushed the cover open. B reached out, then stopped, hand hovering in the air between them, useless. The hum of the machine seemed to sharpen, waiting for the split.
