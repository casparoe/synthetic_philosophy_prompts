answer: |-
  This is one of the most famous and frustrating puzzles in the philosophy of social science. You are absolutely right to feel that it seems overly intellectualized. It feels weird to imagine that I can't drive on the right unless I have consciously verified an infinite chain of knowledge about your brain.

  However, Lewis wasn't trying to describe the *psychological process* of driving (nobody actually thinks that hard). He was trying to define the **logical conditions required for a coordination equilibrium to be stable.**

  Here is the concrete breakdown of why Lewis insisted on the "infinite tower," what breaks if you remove it, and why "just happening to converge" isn't enough.

  ### 1. The Difference Between Regularity and Convention
  First, we have to distinguish two things:
  *   **Regularity:** We all happen to wear blue shirts today. (Maybe it's laundry day. It doesn't matter what you wear, I'll still wear blue.)
  *   **Convention:** We all drive on the right. (I drive on the right *specifically because* I expect you to. If I thought you were driving on the left, I would switch.)

  Conventions are solutions to **Coordination Problems**. In a coordination problem, my best move depends entirely on your move.
  *   If you drive Right, my best move is Right.
  *   If you drive Left, my best move is Left.

  For a convention to hold, I need to be confident not just about what you will do, but about *why* you will do it.

  ### 2. The Chain of Expectations
  Lewis argues that for me to confidently drive on the right, I need an **expectation** that you will drive on the right. But where does that expectation come from? It comes from my knowledge of the convention.

  Here is where the tower starts building:
  1.  **Level 1:** I know the rule is "Drive Right."
  2.  **Level 2:** I know *that you know* the rule is "Drive Right." (If I thought you were an alien who didn't know the rule, I wouldn't trust you to drive Right.)
  3.  **Level 3:** I know *that you know that I know* the rule is "Drive Right."

  **Why does Level 3 matter?**
  Imagine Level 3 is missing. I know the rule, and I know you know the rule. But *you don't know that I know.*
  From your perspective, you might think: *"I know the rule is Right, but maybe he doesn't know. If he doesn't know, he might drive Left. If he drives Left, I should drive Left to avoid a crash."*

  So, even though *I* know you know the rule, if *you* don't know *I* know it, you might hesitate. And if I suspect you might hesitate, *I* might hesitate.

  ### 3. What Breaks? (The Coordination Failure)
  You asked specifically what kind of failure happens if the chain isn't infinite. The failure is **radical uncertainty.**

  In game theory, this is often illustrated by the **"Coordinated Attack Problem"** (or the Two Generals Problem).
  *   General A and General B need to attack at dawn to win. If only one attacks, they lose.
  *   General A sends a messenger: "Attack at dawn."
  *   General B gets the message and sends a reply: "Confirmed."
  *   General A gets the reply.

  **Does General A attack?**
  Technically, no. Why? Because General A knows B confirmed. But General B doesn't know that A received the confirmation.
  *   General B thinks: *"I sent the confirmation, but if A didn't get it, he won't attack. If he doesn't attack, I shouldn't attack."*
  *   General A thinks: *"B might think I didn't get the confirmation, so B might not attack. Therefore, I shouldn't attack."*

  To fix this, A needs to send a confirmation of the confirmation. But then B needs to confirm *that*.
  *   If the chain stops at 1 message: Risk of failure.
  *   If the chain stops at 10 messages: There is still a non-zero risk that the 10th message was lost, creating doubt at the 9th level.
  *   **Lewis's Point:** As long as there is a "highest level" of knowledge where the chain stops, there is a crack in the foundation where doubt can enter. A perfectly rational agent must account for that doubt. To eliminate the doubt entirely, the chain must be infinite.

  If common knowledge is not infinite, there is always a "level $n$" where someone wonders, *"Do they know that I know that they know...?"* If that question exists, the coordination is technically fragile, even if in practice we usually get away with it.

  ### 4. But Humans Can't Think Infinite Thoughts!
  This is the objection you raised ("seems like a really weird and almost impossible requirement"). Lewis was aware of this.

  His response was that Common Knowledge is a **state of the world**, not necessarily a **conscious mental process**.
  *   **Analogy:** Think of a mirror facing another mirror. The reflection goes on infinitely. You don't need to count the reflections for the infinite regress to exist physically.
  *   **Lewis's Argument:** If a rule is publicly announced in a town square, the *situation* generates common knowledge.
      *   I heard the announcement.
      *   I saw you there, so I know you heard it.
      *   I know you saw me there, so you know I heard it.
      *   Because the situation is public and obvious, the infinite chain is generated by the *context*, not by my brain churning through iterations.

  Lewis argued that without this public, infinite-guaranteeing context, you don't have a **Convention**; you just have a **habit**.
  *   **Habit:** We both drive on the right because we always have. (If I see you swerving left, I might panic because I don't know *why* you're doing it.)
  *   **Convention:** We both drive on the right because we share a public understanding that this is the coordination point. (If I see you swerving left, I assume you have an emergency, because the convention is robust.)

  ### 5. Why It Feels Like a Rabbit Hole (and You're Not Wrong)
  You are actually in good company. Many modern game theorists and philosophers think Lewis was too strict.
  *   **Herbert Simon / Bounded Rationality:** Humans aren't perfectly rational logic machines. We use heuristics. "Mutual Knowledge" (I know, you know) is usually *enough* for practical purposes.
  *   **Ariel Rubinstein:** Proved mathematically (in the "Email Game") that without *true* common knowledge, coordination can actually collapse completely, supporting Lewis.
  *   **Critics:** Argue that "Common Belief" (we all *believe* it, even if we aren't certain) is sufficient for social conventions.

  ### Summary
  Lewis required the infinite tower because **logic has no safe stopping point.**
  *   If the chain stops at "I know you know," you have to ask: "Does he know I know?"
  *   If there is *any* doubt at the highest level of the chain, a rational agent has to factor in the risk that the other person will defect.
  *   To make a convention **stable** (immune to rational doubt), the assurance must be absolute.
  *   Therefore, the knowledge must be common to an infinite degree.

  He wasn't saying you consciously think this while driving. He was saying that for the social structure of "driving on the right" to be logically robust rather than just a lucky accident, the information structure of the society must support that infinite chain. If the chain is broken, the convention is theoretically fragile, even if it holds up in practice.
