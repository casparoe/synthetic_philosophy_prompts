answer: |-
  **Setting:** *A sterile supply room in a field hospital. A single vial of antivenom sits on a metal tray. Outside the door, six patients are deteriorating. One is in Room A (David). Five are in Room B.*

  **Marcus:** (Reaching for the vial) Room B. There's five of them.

  **Elena:** (Her hand covers his) Stop. You don't get to just take it.

  **Marcus:** Elena, there's one dose. It cures the envenomation. It doesn't split. Five people in Room B will live if I take this there. One person in Room A dies.

  **Elena:** And if you take it to Room A, David lives. Five people in Room B die. Why is the first outcome *morally mandatory* and the second just a tragedy?

  **Marcus:** Because five deaths are worse than one. That's not a calculation; it's arithmetic.

  **Elena:** Is it? Whose arithmetic? Look at me. There is no entity called "The Five." There's Sarah, there's James, there's the kid in the corner... Each of them faces the loss of *their* life. David faces the loss of *his*. From David's perspective, if you walk past him, he loses everything. From Sarah's perspective, if you walk past her, she loses everything. The loss is total for whichever individual gets it. So where does this "more loss" exist? In what head does it add up?

  **Marcus:** It adds up in the world, Elena. Death is a bad thing. *Impersonally* bad. If a meteor hits a village of five, it's a bigger disaster than if it hits a shack with one person. You're acting like the badness of death is only real if there's a single consciousness experiencing the sum of the pain. But there isn't a single consciousness experiencing the sum of *any* tragedy. That doesn't stop us from calling a war worse than a duel.

  **Elena:** A war involves shared suffering, shared history. These six don't know each other. You're smuggling in a "greater good" ghost. You're saying I'm allowed to sacrifice David for the sake of... what? A number? David isn't a vessel for utility. He's a person. If you walk past him to save the five, you're using him. You're saying his claim on life is worth one-fifth of Sarah's.

  **Marcus:** I'm not saying his *life* is worth less. I'm saying his *claim on my help* is outweighed by the combined claims of the five. Imagine it's your money. If you could save five strangers from starvation for $100, or one stranger for $100, and you only have $100, you feed the five.

  **Elena:** That's property. This is a body. And honestly, the money example begs the question. If I have $100 and David begs for it, and the five beg for it, why does the group's begging get louder just because there are more throats? If death is the end, David is losing 100% of his future. Sarah is losing 100% of hers. You can't have five 100%s that make a 500%. There's no one to hold the 500%.

  **Marcus:** Okay, let's test that. Scale it. It's not five anymore. It's a thousand. In the hallway. One dose. David or the thousand. You still flip a coin?

  **Elena:** (Hesitates) The principle is the same. There's still no "super-person" experiencing the thousand deaths.

  **Marcus:** Come on. If you flip that coin, you are willing to let a thousand people die to save one, fifty percent of the time. That's not principle; that's madness. At some point, the sheer weight of the tragedy becomes impersonal. If you deny that, you're not respecting the separateness of persons; you're ignoring the reality of the catastrophe.

  **Elena:** But what are you doing, Marcus? You're glossing over the separateness to get the answer you want. You want to feel clean. "I saved the most." But to do that, you had to look David in the eye and decide he was expendable. The coin... the coin acknowledges that I don't have the authority to make that trade.

  **Marcus:** The coin isn't fairness. It's a dodge. If you flip, you're giving David a 50% chance and the group a 50% chance. That means each person in the group gets a 10% chance. You're privileging David five-to-one. You say you're treating them equally, but you're treating David as five times more valuable than Sarah.

  **Elena:** No. I'm treating the *decision* as the moral object. I am refusing to aggregate claims that cannot be jointly held. But... (She looks at the door, then back to the vial) ...okay. The thousand.

  **Marcus:** Yeah?

  **Elena:** If it were a thousand... I don't think I flip.

  **Marcus:** (Softly) There it is.

  **Elena:** Don't gloat. It doesn't mean you're right about the five. It means there's a threshold where the intuition of "separateness" breaks down under the weight of sheer volume. With five, it feels like a choice between people. With a thousand, it feels like a choice between a person and a... a demographic.

  **Marcus:** And isn't that the point? Ethics isn't just about the dyad of me-and-you. It's about stewardship of the good. If death is bad, minimizing death is the goal. Aggregation is just the tool we use to acknowledge that *everyone's* badness counts.

  **Elena:** But it *is* a tool. It's not a metaphysical truth. You're acting like "five losses" is a physical object you can put on a scale. It's a heuristic. And heuristics fail. If you save the five, you save five futures. I get that. But you also kill David. Actively. By choice.

  **Marcus:** And if I save David, I kill the five. Actively. By choice. There is no neutral ground, Elena. Inaction is a choice.

  **Elena:** (She lifts her hand from the vial) I know. That's the hell of it. Taurek wanted to give us a way out. A way to say, "I didn't choose David over Sarah, I let Chance choose."

  **Marcus:** But Chance doesn't care. We do. And because we care, we have to count. Not because the numbers add up in the sky, but because down here, five families get a body back instead of one. That's the only sum that matters.

  **Elena:** (She steps back) Five families. Yeah.

  **Marcus:** (Takes the vial) I'm sorry, David.

  **Elena:** Go. Before I change my mind about the threshold.

  **Marcus:** (Pauses at the door) You know, if it was just you and David... and five strangers... you'd still stop me.

  **Elena:** Probably. Because then I'd know him.

  **Marcus:** And that's the real problem, isn't it? The numbers only count when the faces blur.

  **Elena:** Don't let them blur, Marcus. Save the five. But don't pretend David didn't matter just because he was outnumbered.

  **Marcus:** I won't. That's why I'm not flipping.

  *(Marcus exits quickly toward Room B. Elena stays, staring at the empty tray.)*
