      *   *Popper's Definition:* Theory A is closer to truth than Theory B if A has more true content and no more false content (or more true content and less false content).
      *   *The Bomb (Miller & Tichý):* If a theory is false, it entails *some* false statements. It turns out, under Popper's logic, you can't compare two false theories. One will always have "more false content" in a way that cancels out the "true content." Result: All false theories are equally distant from the truth.
      *   *The Aftermath:* How to save the intuition?
          *   *Similarity Approach (Niiniluoto):* Use possible worlds. Distance between the actual world and the world described by the theory.
          *   *Consequence Approach (Schurz):* Focus on relevant consequences, not all logical consequences.
