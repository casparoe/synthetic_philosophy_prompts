          *   *Pros:* Intuitive.
          *   *Cons:* Requires pre-defining what counts as a "feature" of the world. Who decides the metric?
      *   **Attempt 2: The Consequence Approach (Schurz/others):** Weighting relevant consequences.
          *   *Pros:* Avoids irrelevant logical tautologies dragging down the score.
          *   *Cons:* Still relies on subjective weighting of importance.
      *   **The Verdict:** The "Framework-Relative Realism" argument.
          *   Verisimilitude isn't a logical property; it's an epistemic one.
          *   It works *within* a paradigm (Kuhn), not across all logic.
          *   For the novelist: This mirrors their own struggle (truth within the story's logic).
      *   **Conclusion:** Summarize. Final punchline.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the writer's workshop. "Does it feel true?" vs. "Is it logically closer to truth?" Popper wanted to save scientific realism from skepticism.
      *   *The Popper Disaster:* Keep it accessible. Don't get bogged down in set theory. Use the "True Content/False Content" balance. Explain that if you are wrong, you are wrong about *everything* potentially. Miller/Tichý showed the math cancels out.
