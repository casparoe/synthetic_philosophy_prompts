          *   *Schurz:* Don't count *all* consequences, just the *relevant* ones. But what is relevant? (The problem of cognitive significance).
      *   *The Argument/Verdict:* This is the crucial part. I need to take a stand.
          *   *Stance:* The project survives *pragmatically* but fails *logically*. It is not a universal measure like temperature. It is a heuristic for theory choice within a shared language game.
          *   *Why:* Because science isn't just logic; it's about *questions*. If we agree on the question, we can judge the answer's closeness. If we disagree on the question (the framework), verisimilitude is undefined.
