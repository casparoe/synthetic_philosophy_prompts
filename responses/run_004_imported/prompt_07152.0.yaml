      *   *Verdict:* The forum comment is half-right (structural similarity) but wrong on the philosophical payoff. Locke is actually arguing *for* the Principle of Alternate Possibilities (you aren't free if you can't leave), whereas Frankfurt argues *against* it (you're responsible even if you can't do otherwise). Locke is defining freedom; Frankfurt is defining responsibility.

