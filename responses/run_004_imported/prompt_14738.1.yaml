      *   *Revised Joke Idea:* "Nick has spent years arguing that pleasure doesn't morally outweigh pain. But I've noticed that when Priya walks into the room, his calculations seem to change. I won't ask him to explain the math, because I think we can all agree the result is beautiful." (Safe for normals, wink to philosophers).

  7.  **Finalizing the Text (incorporating the "Tranquilism/Cooperative" angle):**
