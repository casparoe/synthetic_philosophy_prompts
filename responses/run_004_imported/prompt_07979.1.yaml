      *   **Context:** Generation ship, 40+ years into voyage. Duplicate-Wren (D-Wren) created spontaneously by an energy field near a dead star. Original Wren died 10 years ago. D-Wren has all memories/mannerisms but no causal history.
      *   **Characters:**
          *   *Halloway:* Ship's philosopher/bioethics officer. Ex-academic. Believes content requires history (Externalism/Causal Theory of Reference).
          *   *Reyes:* Chief Xenobiologist. Sharp, impatient with "seminar-room nonsense," pragmatic but intelligent. Believes current causal hookup matters, not pedigree (Functionalism/Internalism/Teleosemantics variant).
      *   **The Conflict:** Do D-Wren's memories/beliefs *refer* to anything? (e.g., Does "Mother" refer to the actual mother, or is it empty?)
      *   **Tone:** Real argument, established dynamic (they've fought before), neither is obviously wrong, minimal stage direction, engage with actual philosophy of mind (not just "is she real?").
      *   **Length:** About a page.

  2.  **Philosophical Grounding:**
      *   *Halloway's Position:* This sounds like Tyler Burge's Anti-Individualism or Jerry Fodor's Asymmetric Dependence, but specifically the *Causal Theory of Reference* (Putnam/Kripke). If you didn't interact with the object, your mental state can't latch onto it. It's the "Swampman" thought experiment (Donald Davidson). Halloway is arguing D-Wren is Swampman.
      *   *Reyes's Position:* This sounds like Functionalism or perhaps a version of Phenomenal Intentionality. If the internal state functions the same way and produces the same causal outcomes *now*, the history is irrelevant. She's arguing against the "magic" of historical causation.
      *   *Key Tension:* History vs. Current Structure.

  3.  **Drafting - Section by Section:**

