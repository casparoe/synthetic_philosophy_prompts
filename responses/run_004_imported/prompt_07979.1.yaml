answer: |-
  "You're doing it again," Reyes said. "You're looking at her like she's a hologram."

  "I'm looking at the data, Elena. When she describes the accident—the airlock breach, the pressure drop—she's describing an event she didn't witness. She has the neural encoding of a memory, but the causal chain is broken. It's not a memory. It's a hallucination with perfect fidelity."

  "It's not a hallucination if the hardware matches the original down to the synaptic weight. You're obsessed with the pedigree. Like a mental state needs a birth certificate to be valid."

  "It needs a history to have *content*," Halloway said. He didn't look up from the tablet. "Intentionality isn't intrinsic. It's relational. If I point at a star I've never seen and say 'that's Sol,' I'm not referring to Sol. I'm making a noise. Wren—the original Wren—her concept of 'Mother' was forged by ten years of sensory input, feedback, interaction. This Wren's concept was assembled by a cosmic ray burst near a dead star. There is no link to the referent. The file is there, but the hyperlink is dead."

  "So what is she thinking about when she cries for her mother?"

  "Nothing. Or rather, she's thinking about the internal representation, not the woman. It's like reading a biography and weeping. You feel grief, but the grief isn't *about* the person in the book, it's about your reaction to the text."

  "That is the most sterile thing I've ever heard. You're saying the biology doesn't matter, only the biography."

  "I'm saying biology *is* biography. Neurons track things over time. That's how they get meaning. They adapt to specific environmental pressures. Her neurons didn't adapt to the mother. They just popped into a configuration that *looks* like they did. It's a structural echo. A map drawn by a madman that happens to look like London isn't London. It doesn't refer to the streets. It refers to the ink."

  Reyes leaned against the bulkhead, crossing her arms. "You're treating reference like magic. Like there's an invisible string that ties a thought to an object, and if the string wasn't spun at the moment of conception, the thought is empty. But reference is functional, Halloway. It's about what the state *does*."

  "It's about truth conditions," Halloway countered. "If she says, 'I remember breaking my arm at seven,' that statement is false. She didn't break her arm. The original did. If the memory is *about* the original event, the memory is a lie. If the memory is *about* her own creation, it's a delusion. You can't have it both ways."

  "Why not? If her brain processes that memory exactly as if it were true, and uses it to navigate her relationship with the brother, the functional output is identical. The reference is established by the current causal hookup. She looks at the brother, the neural pattern fires, the emotional response triggers. The loop is closed *now*. Why do you need the loop to have started ten years ago?"

  "Because without the history, there's no way to distinguish between accurate tracking and lucky coincidence. If a storm blows through a junkyard and assembles a working radio that starts playing a symphony, the radio isn't *referring* to the symphony. It's just vibrating. You're arguing that because the radio plays the tune, it understands the music."

  "I'm arguing that if the radio plays the tune well enough to make people dance, the distinction is academic. You want to tell her that her grief is 'empty' because her causal chain is too short? That's not philosophy. That's gatekeeping consciousness."

  "I'm not gatekeeping consciousness. She's conscious. She feels pain. But her thoughts are ungrounded. She is a Swampman walking around a world she has no historical purchase on. Every time she names something, she's guessing. It just happens to be a guess that matches the original's guess."

  "And if she interacts with the brother from this moment forward? Does she gain purchase then? Or is she permanently tainted by her origin?"

  Halloway finally looked up. "That's the question, isn't it? If she stays here, interacts, forms new causal chains... eventually, maybe. But the past? The memories she woke up with? They are fiction. Beautiful, convincing fiction. But they are about nothing."

  "Then you're saying reality is retrospective. That what I think *now* depends on where I came from, not where I'm pointing." Reyes pushed off the bulkhead. "I measure life by signal and response. You measure it by provenance. We're not going to agree on this."

  "No," Halloway said, turning back to the tablet. "We won't. You see a person remembering. I see a system simulating memory. And until I know which one it is, I can't tell her she's real."

  "She doesn't need you to tell her she's real, Halloway. She needs you to stop telling her she's wrong."
