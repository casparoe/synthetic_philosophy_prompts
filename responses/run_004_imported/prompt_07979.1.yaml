      *   *Reyes's Counter:* It doesn't matter. The brain state is identical. The output is identical.
      *   *Halloway's Rebuttal:* Reference is a chain. Break the chain, you break the link. It's like a map drawn without ever seeing the terrain.
      *   *Reyes's Rebuttal:* A map works if it gets you where you're going. If she cries when she sees the brother, the grief is real.
      *   *Halloway's Escalation:* Grief is a feeling, *aboutness* is a relation. You can feel grief about a fiction.
