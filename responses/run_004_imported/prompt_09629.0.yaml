  2.  **Evaluate the Math & Logic:**
      *   **The Bet:**
          *   Invest $I$.
          *   60% chance: Return $2I$ (Net +$I$).
          *   40% chance: Return $0$ (Net -$I$).
          *   Expected Value (EV) per dollar: $0.6(2) + 0.4(0) = 1.2$.
          *   Net Expected Return: +20%.
          *   This is a positive EV bet.
      *   **EV Maximization (User's View):**
          *   If utility is linear with dollars, you should bet everything on every positive EV bet.
          *   *Flaw in this context:* The fund has a mission. If the fund goes to zero, it can't fund malaria nets. There is an implicit "ruin" constraint. Also, the opportunities are recurring (2-3 times/year). This makes it a repeated game, not a one-off.
          *   *SBF Argument:* SBF argued for linear utility until a hard cliff. But even he acknowledged the cliff. If the fund hits zero, future giving stops.
      *   **Kelly Criterion (Theo's View):**
          *   Formula: $f^* = p - q/b$ (where $b$ is net odds received on the wager).
          *   Here, if we bet 1, we win 1 net (get 2 back). So $b=1$.
          *   $p = 0.6, q = 0.4$.
          *   $f^* = 0.6 - 0.4/1 = 0.2$.
          *   Kelly suggests 20% of bankroll.
          *   Betting 50% is "Over-Kelly." In repeated bets, over-Kelly reduces geometric growth rate and increases volatility/ruin risk significantly.
      *   **The "Mission" Constraint:**
          *   This isn't a hedge fund. It's a DAF for global health.
          *   The counterfactual is buying malaria nets (high certainty, good impact).
          *   Litigation funding is high variance.
          *   If we lose 50% ($90k), can we recover? With 2-3 shots a year, maybe. But if we lose twice in a row (16% chance), we're down to $45k.
          *   Risk of Ruin: At 50% bet size, two losses wipe out 75% of capital. Three losses in a row (6.4% chance) wipes out 87.5%.
          *   At 20% bet size, two losses leave 64% of capital. Much safer.

