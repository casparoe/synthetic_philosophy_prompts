answer: |-
  **MEMORANDUM**

  **TO:** Giving Circle Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Impact Litigation Funding Proposal

  ### Executive Summary

  Priya has presented a high-potential opportunity to allocate a portion of our Donor-Advised Fund (DAF) toward impact litigation funding. The deal terms are favorable: a 60% probability of doubling our stake and a 40% probability of total loss.

  Priya has proposed committing **50% of our fund ($90,000)** to this opportunity.

  After analyzing the mathematics of repeated investing and our long-term mission goals, I recommend we commit **20% of our fund ($36,000)** to this proposal.

  This recommendation balances the strong Expected Value (EV) of the deal with the mathematical necessity of preserving capital for future opportunities. While the 50% ask maximizes the return on *this specific bet*, the 20% allocation maximizes the growth of our fund *over time*, allowing us to participate in the estimated 2–3 similar opportunities that arise annually without risking catastrophic drawdowns.

  ### The Opportunity

  *   **Investment:** Litigation funding (fronting costs for a specific case).
  *   **Terms:** 60% chance to 2x money (100% return); 40% chance to lose 100% of stake.
  *   **Expected Value (EV):** Positive. For every $1 invested, the arithmetic average return is $1.20.
  *   **Pipeline:** Priya indicates similar deals may appear 2–3 times per year.

  ### The Strategic Debate: One-Off vs. Repeated Game

  In our internal review, two valid perspectives emerged regarding how much to allocate. It is crucial we distinguish between them, as they yield different numbers.

  **1. The "Maximize Single-Bet EV" Approach**
  This view argues that because we are altruists, we should be risk-neutral. If a dollar does the same amount of good whether it is our first dollar or our hundred-thousandth, we should simply maximize the expected value of every decision.
  *   *The Logic:* Since the EV is positive (+20%), we should bet as much as possible.
  *   *The Limitation:* This logic holds true for a **one-time** bet. However, Priya has indicated this is a **recurring** opportunity (2–3 times/year). If we bet 50% or more repeatedly, the volatility creates "volatility drag." Even with positive EV, betting too aggressively in a repeated game statistically reduces our long-term compound growth rate and significantly increases the risk of depleting the fund to a point where we can no longer participate in future deals.

  **2. The "Sustainable Growth" Approach**
  This view focuses on maximizing the fund's size over a multi-year horizon. Since we expect a pipeline of deals, we must size our bets to survive a string of losses while still capturing the upside.
  *   *The Logic:* We should use a sizing formula (often called the Kelly Criterion) that calculates the exact percentage that maximizes geometric growth.
  *   *The Result:* For a 60% win rate with 1-to-1 payout odds, the mathematically optimal growth fraction is **20%**.

  ### Why 50% Is Mathematically Suboptimal

  Committing 50% ($90,000) is not just "riskier"; it is actually less effective at growing our total charitable capital over time than a 20% commitment.

  Consider a scenario where we face this exact deal three times in one year (consistent with Priya's pipeline estimate):

  *   **At 50% Allocation:** If we lose two out of three bets (a statistically plausible scenario, occurring ~29% of the time), our fund drops from $180,000 to **$45,000**. We have lost 75% of our capital. It would take years of perfect wins to recover.
  *   **At 20% Allocation:** If we lose two out of three bets, our fund drops from $180,000 to **$115,200**. We retain 64% of our capital. We remain fully operational and capable of funding malaria nets or taking the next litigation deal.

  By betting 50%, we are "over-levered." In investment theory, betting more than the Kelly fraction reduces your long-term return rate and increases the probability of ruin, without offering a compensating increase in long-term expected value.

  ### Why Not Go Smaller? (Addressing the Risk-Neutrality Argument)

  Some might argue we should go smaller (e.g., 5% or 10%) to be safe. However, we must take the Expected Value argument seriously. We are a charity, not a family office. We *should* take calculated risks when the EV is positive.

  If we bet too little (e.g., 5%), we are leaving free money on the table. The 20% figure is not a "conservative" number; it is the **aggressive growth** number. It is the maximum amount we can deploy that still mathematically guarantees the highest possible fund size in the long run. Going lower than 20% would be an unnecessary concession to caution that reduces our total potential impact.

  ### Mission Alignment

  Our primary mission remains global health (e.g., malaria nets). Those interventions are high-certainty. This litigation funding is high-variance.
  *   If we allocate 50% and lose, we cripple our ability to fund baseline global health work for years.
  *   If we allocate 20%, we treat this as a high-growth "satellite" strategy. A win boosts our total giving capacity significantly; a loss is painful but recoverable within a fiscal year.

  ### Recommendation

  I move that the committee approve an allocation of **$36,000 (20% of current corpus)** to Priya's litigation funding proposal.

  **Rationale Summary:**
  1.  **Captures Value:** It fully exploits the positive Expected Value of the deal.
  2.  **Optimizes for Repetition:** It aligns with the mathematical optimum for a recurring pipeline of deals (2–3/year), maximizing long-term capital growth.
  3.  **Protects Mission:** It prevents a string of bad luck from permanently impairing our ability to fund our core global health priorities.
  4.  **Scalability:** It leaves $144,000 in reserve, allowing us to consider the next 1–2 opportunities Priya brings this year without needing to liquidate assets or pause giving.

  I look forward to discussing this at Thursday's meeting.
