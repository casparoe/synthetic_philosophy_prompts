          *   *Better approach:* Acknowledge the EV argument but show that in a *series* of bets, maximizing geometric mean (Kelly) maximizes total EV over the long run better than betting 50%. Betting 50% actually lowers the expected *terminal* wealth in a repeated game compared to 20%.
          *   *Decision:* I will recommend **20% ($36,000)**. It aligns with the math for repeated bets, mitigates ruin risk, and allows participation in future deals (2-3/year). It rejects the 50% ask but validates the positive EV instinct.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation ($36k, 20%).
