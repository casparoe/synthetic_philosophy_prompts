          *   *Theo's Position (Kelly Criterion):* Maximize long-run geometric growth. Bet fraction $f^* = (bp - q) / b$. For $p=0.6, b=1$, $f^* = (1*0.6 - 0.4)/1 = 0.2$ (20%). Betting 50% is too aggressive and risks ruin/drag on growth.
      *   **Task:** Draft a memo for the committee.
      *   **Requirements:**
          *   Must recommend a specific number (not "it depends").
