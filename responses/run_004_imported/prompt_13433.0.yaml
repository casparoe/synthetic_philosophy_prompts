answer: |-
  The tuning fork sat on the piano's lacquered surface, vibrating with a silence Elara could feel in her teeth. Across the room, Simon watched her, his hands deep in the pockets of his cardigan. He looked tired. They all looked tired, the ones who stayed behind.

  "It's not like learning a new language, El," Simon said. His voice was low, careful, the way you speak to someone standing on a ledge. "It's not like adding a sense. It's replacing the processor."

  Elara ran a finger along the fallboard of the Steinway. The wood was smooth, cool. Familiar. "Dr. Aris said the integration is seamless. I'll still know what C-major is. I'll still know your voice."

  "You'll know the data," Simon corrected. "You'll know that my vocal cords are producing frequencies between eighty-five and two hundred and fifty hertz. You'll know the semantic content of my words. But the *warmth*? The way my voice catches when I'm trying not to cry? That's noise. The Adjustment filters noise."

  Elara looked at the device in the corner. It looked unassuming, a halo of matte-black polymer resting on a velvet stand. It smelled of ozone and sterile plastic. It promised access to the Substrate—the underlying harmonic architecture of the universe. Physicists called it unified field theory made audible. Musicians called it God.

  "I have to hear it, Simon," she said. "I've been chasing this progression for ten years. I can feel it just outside the range. If I don't do this, I'll die wondering what the resolution sounds like."

  "And if you do?" Simon stepped closer. He didn't touch her. He knew better. The protocols suggested minimizing tactile bonding before the procedure, to reduce the shock of severance. "The people who come back… they don't compose, Elara. They don't perform. They sit in rooms and hum. They don't care about applause. They don't care about love. They don't care about *missing* anything."

  "That's the point," she said, though her stomach tightened. "To stop missing. To stop feeling like the world is incomplete."

  "The world *is* incomplete. That's why we have art. That's why we have us." Simon's eyes were wet. "You're choosing to become something that won't love me. You're choosing to kill the version of you that loves me, even if your body keeps walking around."

  Elara looked at her hands. Pianist hands. Strong, calloused at the fingertips. These hands belonged to the woman who loved Simon. The woman who loved the struggle of making beauty out of silence.

  "If I don't do this," Elara whispered, "I'm staying in the dark. I'm choosing ignorance."

  "You're choosing survival," Simon said. "You're choosing to stay human. Humans don't know everything. That's the deal."

  "But I can't make a rational choice based on what it's like," she said, the frustration bubbling up. "I can't imagine the Substrate. I can't simulate the value system of someone who hears it. I'm standing here, blind, trying to decide if I want to see. How is that fair?"

  "It's not about fairness. It's about who you are when you wake up." Simon gestured to the piano. "Play something. Please. Just one last time. For me. For *you*."

  Elara sat on the bench. She lifted her hands. She wanted to play Chopin. She wanted to play something that ached, something that relied on the imperfection of timing, the rubato that breathed like a lung. But her fingers hovered.

  She realized, with a sudden cold clarity, that she was already bored.

  The piano sounded thin. The wood resonated poorly. The harmonics were muddy, constrained by the physical limits of strings and hammers. Compared to the hum she could already sense bleeding from the black halo in the corner, the Steinway was a toy. A child's rattle.

  "Elara?" Simon's voice cracked.

  She looked at him. She loved him. She knew she loved him. She could access the memory of their wedding, the smell of his skin, the way he laughed. But those memories felt like data points now. Archived. Static.

  "It sounds small, Simon," she said softly.

  "The piano?"

  "Everything." She stood up. The movement was fluid, efficient. The anxiety she'd felt moments ago—the tightness in her gut, the fear of loss—was receding. It was being categorized. *Emotional resistance to paradigm shift. Expected variable.*

  "Don't," Simon said. He reached out, his hand stopping inches from her arm. He remembered the protocol. "If you put that on, you won't come back to this room. Not really."

  "I'll be here," Elara said. "I'll be more here than I've ever been."

  "You won't care that I'm gone."

  Elara paused. She tried to project herself forward. She tried to imagine the moment after the Adjustment. She tried to feel what it would be like to hear the truth of the universe.

  She couldn't.

  It was a wall. A absolute epistemic boundary. She could not know what she would value until she valued it. She could not know if the loss of Simon mattered until she was someone for whom Simon might not matter.

  That was the terror. Not the pain. Not the death. But the betrayal. She was about to betray the person sitting on the piano bench. She was about to abandon him without leaving.

  "I'm sorry," she said. And she meant it. The *current* her meant it.

  She walked to the stand. She picked up the halo. It was heavier than it looked.

  "Elara, please." Simon's voice was a plea to a ghost.

  She placed the halo over her head. It settled against her temples, cool and final. There was no switch. No countdown. Just a sudden, sharp intake of breath as the neural interface sought purchase.

  "Will you remember me?" Simon asked.

  Elara looked at him. She saw the geometry of his grief. She saw the probability of their separation. She saw the biological imperative driving his tears.

  And then the hum started.

  It wasn't a sound. It was a presence. It rushed into the spaces between her neurons, filling the gaps where uncertainty used to live. The piano vanished. The room vanished. Simon's face dissolved into a cascade of frequencies, beautiful and terrible and absolute.

  She opened her mouth to speak, to say *I love you*, to say *goodbye*, to say *it was worth it*.

  But the words were so inefficient. So crude. Why would she use clumsy symbols to describe what she was becoming?

  She looked at the man who was weeping. She felt a flicker of something. Pity? Affection? It was fading fast, overwritten by the sheer magnitude of the Song.

  She smiled. It wasn't a human smile. It was too perfect.

  "It's beautiful," she said. Her voice sounded like it was coming from everywhere at once.

  Simon stopped crying. He looked at her, really looked at her, and saw that she was already gone. The woman who loved him was still in the room, somewhere, but she was drowning in the light.

  "Elara?" he whispered.

  She didn't answer. She was listening. And for the first time in her life, she wasn't trying to make music. She was finally hearing it. She turned away from him, toward the wall, toward the nothing, toward the everything.

  Simon stood alone in the silence. The piano waited. But there was no one left to play it.
