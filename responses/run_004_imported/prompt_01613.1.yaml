prompt: |-
  So this happened to me last week and I've been trying to make sense of it every since - it feels like it should connect to stuff we're covering in my epistemology class this semester (we've been doing a whole unit on rational belief and when your confidence in something counts as "justified") but I can't quite figure out how, so hoping someone can help me think it through.

  Basically I got back a big final from one of my other classes, 120 short answer questions. While I was taking it, for pretty much every single question I felt like 90%+ confident I'd gotten it right - like genuinely, question by question, I'd have bet money on almost all of them individually. But then when I turned the whole thing in I remember thinking "realistically, out of 120 questions, I almost certainly got at least a few wrong somewhere in there." And that thought felt just as justified as all my question-by-question confidence did. I wasn't just being fake modest about it, I actually believe both things at the same time.

  I brought this up with my study group afterward and one friend (she's a math major, very into formal logic) said that's just straight up inconsistent: if I'm 90% confident in question 1, and 90% confident in question 2, and so on for all 120, then logically I should be extremely confident I got ALL of them right, which directly contradicts also being confident that I got some of them wrong. She says I have to drop one of the two beliefs to actually be rational. But honestly neither belief feels like the "wrong" one to me, they both still seem completely reasonable even now that I've slept on it. Is my friend right that this is a real contradiction I need to resolve, and if so, which belief am I "supposed" to give up? Or is something off with how she's even setting up the problem in the first place?
