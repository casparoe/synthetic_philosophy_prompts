answer: |-
  This is fantastic. You have stumbled directly onto one of the most famous problems in contemporary epistemology. What you are describing is almost a textbook example of **The Preface Paradox**, formulated by the philosopher D.C. Makinson in 1965.

  The short answer is: **Your intuition is rational, and your friend is making a category error between logic and probability.** You do not need to give up either belief to be rational. In fact, holding both beliefs simultaneously is arguably the *most* rational stance for a fallible human being to take.

  Here is how you can break this down, specifically using the concepts from your epistemology unit on rational belief and justification.

  ### 1. The Math: Where Your Friend Went Wrong
  First, let's address the formal logic/probability claim your friend made. They argued that if you are 90% confident in Question 1, and 90% confident in Question 2, you should be *extremely* confident you got **all** of them right.

  Mathematically, this is backward.

  In probability theory, the likelihood of a **conjunction** (Event A *and* Event B *and* Event C...) is calculated by multiplying the probabilities (assuming the questions are independent).
  *   $P(\text{Q1 Right}) = 0.9$
  *   $P(\text{Q1 \& Q2 Right}) = 0.9 \times 0.9 = 0.81$
  *   $P(\text{All 120 Right}) = 0.9^{120} \approx 0.000003$

  So, mathematically, your high confidence in each individual question *entails* that you should be near-certain you got **at least one wrong**.
  *   $P(\text{At least one wrong}) = 1 - P(\text{All Right}) \approx 99.9997\%$

  Your friend is treating "belief" like a logical switch (On/Off), but you are describing "confidence" as a **credence** (a degree of probability). When you aggregate high credences across many items, the credence in the *conjunction* drops precipitously. So, on a purely probabilistic level, your two beliefs are perfectly coherent.

  ### 2. The Philosophy: The Preface Paradox
  This is where it connects to your class. The Preface Paradox arises when an author writes a book. For every claim in the book, they have evidence and justification, so they believe each claim is true. However, in the preface, they often write, "Despite my best efforts, there are likely errors in this work."

  *   **Belief A:** "Claim 1 is true," "Claim 2 is true"... "Claim N is true."
  *   **Belief B:** "At least one claim in this book is false."

  Logic says these are inconsistent (you can't have *all* be true and *one* be false). Yet, almost everyone agrees it is **rational** to hold both beliefs. This is the state of **rational fallibilism**.

  In your exam scenario:
  *   **Local Justification:** For each question, you have specific evidence (you studied, you recall the material). This justifies the 90% credence per question.
  *   **Global Justification:** You have inductive evidence about human performance (nobody is perfect, 120 questions is a lot). This justifies the high credence that you made a mistake somewhere.

  If you forced yourself to believe "I got every single one right" just to be logically consistent with your local confidence, you would actually be being *irrational*, because you would be ignoring the statistical reality of human error.

  ### 3. Key Epistemological Concepts to Use in Class
  Since you are covering rational belief, here are three specific terms/concepts you can use to articulate why your friend's "contradiction" isn't a dealbreaker:

  **A. Credence vs. Binary Belief**
  Your friend is assuming the **Lockean Thesis**, which suggests there is a threshold of credence (e.g., 90%) where you simply switch to "Full Belief."
  *   If Belief = Credence > 0.9, then you "Believe" Q1, "Believe" Q2... "Believe" Q120.
  *   Your friend is invoking the **Principle of Conjunctive Closure**: *If I believe P and I believe Q, I must believe (P and Q).*
  *   However, most modern epistemologists agree that Closure fails for probabilistic belief. You can have high credence in $P$ and high credence in $Q$ without having high credence in $(P \land Q)$. Your intuition recognizes this; your friend's logic does not.

  **B. The Lottery Paradox**
  This is the cousin of the Preface Paradox (Henry Kyburg, 1961). Imagine a fair lottery with 1,000 tickets. It is rational to believe Ticket #1 will lose (99.9% chance). It is rational to believe Ticket #2 will lose... and so on. But it is *irrational* to believe "All tickets will lose," because we know one must win.
  *   Your exam is the inverse (The Preface Paradox). It is rational to believe Q1 is right, Q2 is right... but irrational to believe "All are right."
  *   This shows that **high probability does not equal certainty.**

  **C. Coherence vs. Consistency**
  *   **Logical Consistency:** A set of propositions that can all be true at the same time. (Strictly speaking, "All are right" and "One is wrong" are inconsistent).
  *   **Probabilistic Coherence:** A set of credences that obey the axioms of probability.
  *   Your credences are **coherent**. $P(\text{Error}) = 1 - P(\text{No Error})$. Your friend is demanding logical consistency of binary beliefs where probabilistic coherence is the correct standard.

  ### 4. The Verdict: Which Belief to Give Up?
  **Neither.**

  If you give up the local confidence (Question 1), you are ignoring your specific evidence (you know the material).
  If you give up the global confidence (I made a mistake), you are being arrogant and statistically illiterate.

  The "contradiction" only exists if you insist on converting your 90% confidence into a binary "I Know This Is True." If you stay in the realm of **degrees of belief (credences)**, there is no contradiction.

  **How to use this in class:**
  Bring this up! Professors love when students apply course concepts to real life. You can frame it like this:
  > "I'm struggling with the **Conjunction Principle**. I have high justification for $p_1, p_2... p_{120}$, but also high justification for $\neg(p_1 \land p_2 \land ... \land p_{120})$. Does this mean we have to reject the idea that justification aggregates across conjunctions? It seems like the **Preface Paradox** suggests we should accept that rational belief is not closed under conjunction."

  ### Summary
  Your friend is trying to apply strict binary logic to a probabilistic situation. You are correctly intuiting that **fallibilism** (the idea that you can be justified in believing something even if it turns out false) allows you to be confident in your answers while simultaneously confident that you aren't perfect.

  You aren't confused; you've just discovered why epistemology is hard. Keep both beliefs. They are the mark of a rational thinker.
