      *   **The Task:** Reconstruct a Leibnizian position on Bell's Theorem based on actual doctrines (PSR, Pre-established Harmony, Relational Space, Contingency/Possible Worlds). Don't just give a one-liner. Analyze where the analogy holds and where it breaks. Determine which "bullet" Leibniz bites (Locality, Realism, or Measurement Independence).
