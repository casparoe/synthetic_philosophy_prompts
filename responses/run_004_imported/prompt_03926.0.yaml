      *   **Human Nature:** He understood human frailty (the "speckled axe"). He knew perfection was likely impossible but the *attempt* was valuable.
      *   **Social Aspect:** He formed the Junto club. He valued community accountability but also recognized the performative aspect of virtue (reputation mattered to him).
      *   **Humor/Irony:** He wrote with a wink. He knew he wasn't perfect.
