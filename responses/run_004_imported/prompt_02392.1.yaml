answer: |-
  This is a classic law school/philosophy puzzle, and honestly, ending up there after a few drinks is a rite of passage.

  To give you the direct answer: **Your friend was probably right to be unconvinced.** While you landed on the "winning" side of history (Hart's liberal view largely prevails in modern Western law), your *reasoning* for why Hart won contains a significant philosophical category error.

  Here is the breakdown of where your argument likely went off the rails, and why the Hart-Devlin debate is more nuanced than "Positivist vs. Moralist."

  ### 1. The Big Misconception: Legal Positivism $\neq$ Moral Relativism
  Your core claim is that Hart opposes enforcing morality *because* he is a moral relativist (i.e., he doesn't believe in objective right or wrong). This is the most common misunderstanding of Legal Positivism.

  *   **Legal Positivism** is a theory about what law *is*. It says the validity of a law depends on its source (e.g., passed by Parliament), not its moral content. A law can be legally valid but morally wicked.
  *   **Moral Relativism/Skepticism** is a theory about what morality *is*. It says there are no objective moral truths.

  **You can be a Legal Positivist and still believe in objective morality.** In fact, many positivists argue that separating law and morality is the best way to *protect* morality. If you conflate them, you might obey a law just because it's the law, rather than because it's right.

  Hart himself was not a moral skeptic in this context. He was a **Liberal Utilitarian**. He didn't argue that homosexuality (the main subject of the Wolfenden Report that sparked the debate) was morally neutral; he argued that **criminal law is the wrong tool** to regulate private moral conduct that does not harm others.

  ### 2. Hart's Actual Argument: The Harm Principle
  Hart's opposition to Devlin wasn't based on the idea that "morality isn't real." It was based on the philosophy of **J.S. Mill**.

  Hart argued for the **Harm Principle**: The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others.
  *   **Hart's view:** Just because a majority finds something disgusting or immoral (e.g., private consensual sexual acts) doesn't justify using the coercive power of the state to stop it.
  *   **Why:** Because individual liberty is a higher value than enforced moral conformity, provided no one is harmed.

  So, Hart wasn't saying, "There is no truth." He was saying, "Even if there is truth, the state shouldn't be the enforcer of it in private lives."

  ### 3. Devlin's Argument: Social Cohesion, Not Objective Truth
  You gave Devlin credit for having the "guts to say some things are just objectively wrong." Interestingly, that's not exactly what Devlin argued either.

  Devlin's argument was sociological, not necessarily metaphysical. He argued that a society is held together by a **shared public morality**.
  *   **The Disintegration Thesis:** Devlin claimed that if you allow the shared morality to erode (by legalizing things the majority finds abhorrent), society itself will disintegrate.
  *   **The Standard:** Devlin didn't necessarily appeal to God or Objective Truth. He appealed to the "man on the Clapham Omnibus." If the average person feels deep intolerance, indignation, or disgust toward an act, that is sufficient grounds for the law to prohibit it to preserve social cohesion.

  So, Devlin wasn't necessarily a moral realist; he was a **communitarian**. He cared about the survival of the social fabric, even if that meant enforcing subjective popular morality.

  ### 4. Why Your Friend Was Hesitant
  Your friend likely sensed that you were conflating Hart's *jurisprudence* (Positivism) with his *political philosophy* (Liberalism).

  If Hart were truly a moral relativist, his argument would be: *"You can't enforce morality because morality doesn't exist."*
  But Hart's actual argument was: *"Morality might exist, and you might be right, but you still can't use the criminal law to enforce it because liberty trumps moral enforcement in private spheres."*

  The second argument is much stronger philosophically because it doesn't require proving the existence (or non-existence) of objective moral truths. It only requires valuing liberty.

  ### The Verdict
  *   **Did you pick the winning side?** Yes. Hart's view largely shaped the Sexual Offences Act 1967 and modern liberal democracy. We generally accept that private immorality is not the law's business.
  *   **Did you have the stronger argument?** No. Your reasoning relied on a misconception about Legal Positivism. If your friend had known their stuff, they could have countered: *"Hart separates law and morality conceptually, but he absolutely believes in moral reasoning. He opposes Devlin on the grounds of Liberty, not Relativism."*

  **How to save face:**
  Tell your friend you've been reading up (which you are now!) and you realize you conflated Hart's *Separation Thesis* with *Moral Skepticism*. You can say: *"I realized Hart wasn't arguing morality is fake; he was arguing that liberty is more important than moral conformity. But I still think Devlin underestimates how resilient society is."*

  That's a much harder position for her to attack.

  **Recommended Reading (for the next round of drinks):**
  *   H.L.A. Hart, *Law, Liberty, and Morality* (It's short, based on lectures, and directly addresses this).
  *   Lord Devlin, *The Enforcement of Morals*.
  *   Ronald Dworkin's critique of Devlin (Dworkin tears Devlin's "disintegration thesis" apart).
