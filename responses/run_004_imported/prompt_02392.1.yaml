      *   *Hart's Real Motivation:* Bring in J.S. Mill and the Harm Principle. Hart believed in moral reasoning but thought criminal law was the wrong tool for private morality.
      *   *Devlin's Position:* Clarify that Devlin wasn't necessarily a moral realist either; he cared about *social cohesion*. If society believes X is wrong, that's enough for him, regardless of whether X is *objectively* wrong.
