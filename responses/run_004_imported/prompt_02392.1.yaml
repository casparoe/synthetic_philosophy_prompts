      *   **Contrast:** Lord Devlin believes some things are objectively wrong and society can defend itself based on that.
      *   **Context:** Argument with a friend after drinks about the Hart-Devlin debate (Wolfenden Report era).
      *   **Question:** Did I have the stronger argument, or am I misunderstanding the debate?

  2.  **Evaluate the Accuracy of the Claim (Fact-Checking):**
      *   *Is Hart a moral relativist?* This is the crux. Legal positivism (the separation thesis) $\neq$ moral relativism/skepticism. One can believe law and morality are conceptually distinct (positivism) while still holding strong objective moral views (moral realism).
      *   *What was Hart's actual stance?* Hart was a liberal utilitarian (influenced by J.S. Mill). He opposed enforcing morality *not* because morality doesn't exist, but because individual liberty should only be restricted to prevent harm to others (the Harm Principle).
      *   *What was Devlin's stance?* Devlin argued that society has a right to protect its shared moral fabric because the disintegration of morality leads to the disintegration of society. He wasn't necessarily arguing for "objective" morality in a metaphysical sense, but rather a "shared public morality."
      *   *The Connection:* The user is conflating *Legal Positivism* (descriptive theory of what law *is*) with *Normative Political Philosophy* (prescriptive theory of what law *ought* to do).

  3.  **Formulate the Correction/Nuance:**
      *   **Direct Answer:** You likely didn't have the stronger argument because the premise (Hart = Moral Relativist) is a common misconception.
      *   **Key Distinction:** Separate "Separation Thesis" (Positivism) from "Moral Skepticism."
      *   **Hart's Actual Argument:** It's about liberty and harm, not the existence of morality. He explicitly engaged with moral philosophy (e.g., *Law, Liberty, and Morality*).
      *   **Devlin's Weakness:** Devlin's argument is often criticized for assuming society *needs* a shared morality to survive (the "disintegration thesis") without proof.
      *   **Why the Friend Hesitated:** She probably sensed the conflation but couldn't articulate it.

