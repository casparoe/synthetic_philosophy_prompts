prompt: |-
  Had a whole argument with my friend last night about the Hart-Devlin debate (we somehow ended up there after a few drinks, long story). My point was that Hart only gets to oppose using law to enforce morality because deep down he's a moral relativist - I mean, he's literally THE legal positivist guy who says law and morality are separate things, so of course he doesn't think there's any real objective immorality for Devlin's side to enforce in the first place. Devlin at least has the guts to say some things are just objectively wrong and that a society is entitled to defend itself on that basis. My friend didn't have a great comeback but I could tell she wasn't fully convinced either. Did I actually have the stronger argument here, or am I misunderstanding whats actually going on in that debate?
reasoning: |-
