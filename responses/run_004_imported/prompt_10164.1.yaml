      Chalmers: ~GC is negatively conceivable (for humans). But Ideal Negative Conceivability entails Possibility. So if ~GC is impossible, it is not Ideally Negatively Conceivable.
      *Key Divergence:* Yablo says "Conceivability is present, Possibility is absent." Chalmers says "If Possibility is absent, (Ideal) Conceivability is absent." Chalmers preserves the link; Yablo breaks it. This shows Chalmers revises the underlying picture of what conceivability *is* (shifting from psychological act to rational coherence).

