answer: |-
  Here are 10 questions designed to move the discussion beyond the standard handout material, including the specific thematic requirements you requested. Each includes a follow-up keyed to the speaker's probable defense.

  **1. The Pragmatic Objection (Riding)**
  "The most persistent objection, even in the text itself, is pragmatic: if you demand a horse, a white horse suffices. If I ride a white horse, I am riding a horse. Standard intensional readings often just redescribe this as 'conceptually distinct but extensionally overlapping.' How does your reading *defuse* the ontological weight of the action? If the action succeeds, in what robust sense does the 'white horse' fail to be a 'horse' without rendering the statement merely a point about nomenclature rather than reality?"
  *   **Follow-up:** "If you answer that the *name* 'white horse' is not the *name* 'horse,' doesn't that concede Xunzi's point that this is a confusion of names (ming) rather than a logical insight into things (shi)?"

  **2. The Hansen Mass-Noun Hypothesis**
  "Your defense seems to rely on the rigidity of reference in Classical Chinese. Does this interpretation secretly lean on Chad Hansen's mass-noun hypothesis—that 'horse' refers to 'horse-stuff' rather than a countable class? If so, does this vindicate Gongsun Long as a logician, or does it just relocate the puzzle from metaphysics into linguistics, making the insight contingent on the grammar of Old Chinese rather than universal logic?"
  *   **Follow-up:** "If it is contingent on mass-noun grammar, how do you respond to the objection that Gongsun Long thought he was discovering universal truths about the world, not merely mapping the quirks of his native syntax?"

  **3. The Copula and 'Fei' (Without Modern Logic)**
  "We often analyze 'is' through Fregean identity versus class-membership. But Gongsun Long lacked predicate logic. How do we cash out the distinction between 'is' as identity and 'is' as membership using only resources available in the Warring States period? Specifically, how do we distinguish *fei* (is not) as 'not equivalent to' versus 'not a member of' without smuggling in modern set theory that would be alien to the text?"
  *   **Follow-up:** "If you argue *fei* functions as 'not equivalent to,' doesn't that make the thesis trivial? (e.g., 'A bachelor is not an unmarried man' is false, but 'The concept bachelor is not equivalent to the concept unmarried man' is true but uninteresting). How do you preserve the shock value?"

  **4. The Mohist Counter-Argument**
  "The Later Mohists explicitly criticized Gongsun Long, arguing that 'white horse is horse' holds because 'obtaining a white horse' satisfies the condition for 'obtaining a horse.' They ground this in *lei* (kind) classification. Does your reading require us to reject the Mohist account of kinds entirely, or is there a way to reconcile Gongsun Long's logical distinction with the Mohist pragmatic classification of kinds?"
  *   **Follow-up:** "If you reconcile them, aren't you essentially admitting that Gongsun Long is speaking about *names* and the Mohists about *objects*, which returns us to the sophistry charge that he is conflating the two?"

  **5. Rectification of Names (Zhengming)**
  "Most Warring States philosophy treats logic as subservient to governance. If 'white horse is not horse,' does this undermine the Rectification of Names? If a law applies to 'horses,' does it apply to 'white horses'? If your reading suggests it does not, are you not making Gongsun Long an anarchist regarding legal categorization? If it does apply, what work is the distinction actually doing?"
  *   **Follow-up:** "If you say the law applies to the object regardless of the name, doesn't that render Gongsun Long's distinction philosophically interesting but politically inert, contradicting the context of the era?"

  **6. The Composition Problem**
  "If 'white horse' is a compound that negates the simple term 'horse,' where does the composition stop? Is a 'white horse with a black mane' not a 'white horse'? If every addition of a property creates a new logical subject that 'is not' the previous one, do we not face an infinite regress where no stable reference is possible? How does Gongsun Long avoid this fragmentation of reality?"
  *   **Follow-up:** "If he accepts the fragmentation, is he not arguing for a radical nominalism where only specific particulars exist, and general terms are fictions? Is that a defensible reading of the text?"

  **7. Epistemic Access to Universals**
  "Gongsun Long argues we can separate 'whiteness' from 'horse.' Epistemologically, how do we access 'horse' without *some* color? If we cannot perceive a colorless horse, is 'horse' merely an abstraction with no referent? If it has no referent, isn't 'white horse' the only real term, making 'horse' the empty one?"
  *   **Follow-up:** "If 'horse' is an empty abstraction, doesn't that collapse his argument? If 'horse' doesn't refer to anything real, saying 'white horse is not horse' is like saying 'white horse is not a unicorn.'"

  **8. The Function of the Dialogue**
  "Is the *White Horse Dialogue* intended as a positive metaphysical claim or a therapeutic *reductio*? Are we meant to believe 'white horse is not horse,' or are we meant to be forced into a paradox that reveals the limitations of language? If it's the latter, does your defense of it as 'logical insight' miss the skeptical intent?"
  *   **Follow-up:** "If it is therapeutic, why does the text argue so dogmatically for the conclusion rather than dissolving the question? What textual evidence supports the therapeutic reading over the dogmatic one?"

  **9. Reference vs. Predication**
  "In modern terms, we might say 'white' modifies 'horse.' In Gongsun Long's framework, does 'white' function as a modifier or as a co-referent term? If 'white' and 'horse' are two independent names combined, does that mean 'white horse' is a hybrid entity? How does this hybrid ontology avoid dualism?"
  *   **Follow-up:** "If it is a hybrid entity, does it exist in the same way a simple 'horse' exists? Are there two ontological categories: simple substances and compound names?"

  **10. The Historical Stumper**
  "Finally, let's strip away our modern apparatus. If you were a sharp critic at the time—say, a Confucian pragmatist with no access to modern logic or linguistics—what is the one argument you could have deployed that would have actually stumped Gongsun Long? Not just 'that's wrong,' but an internal contradiction he couldn't resolve within his own system of names and actualities."
  *   **Follow-up:** "If you suggest the 'Riding' argument again, I'll press you: Why didn't that stump him historically? What variation of that pragmatic objection cuts deep enough to collapse his logical distinction?"
