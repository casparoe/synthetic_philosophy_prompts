      *   **Tone:** Academic, sharp, knowledgeable, facilitating deep discussion.

  2.  **Deconstruct the Philosophy (Gongsun Long & The White Horse Dialogue):**
      *   *Core Claim:* 白馬非馬 (Bai ma fei ma) - White horse is not horse.
      *   *Traditional Objection:* Pragmatic absurdity. If you want a horse, a white horse does the job.
      *   *Standard Defense:* Intension vs. Extension. "Horse" = shape. "White" = color. "White Horse" = shape + color. Therefore, the concept "White Horse" $\neq$ the concept "Horse".
      *   *Hansen's View:* Classical Chinese nouns are mass nouns (stuff terms), not count nouns. "Horse" is like "water." "White horse" is a specific stuff.
      *   *Logical Issue:* The meaning of 非 (fei). Is it "is not" (identity)? "Is not a member of"? "Is not equivalent to"?
      *   *Historical Context:* Mohists, Xunzi, later Confucians dismissed it as word-play disrupting social order (rectification of names).

