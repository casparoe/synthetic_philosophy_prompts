      *   **Moral Standing/Authority to Blame:** Do you need to be perfect to blame? Most philosophers say no. You need to not be *currently* guilty of the same thing (hypocrisy).
      *   **Reform/Redemption:** Does fixing a past mistake erase its relevance to current standing? Usually, yes, or at least diminishes it significantly.
