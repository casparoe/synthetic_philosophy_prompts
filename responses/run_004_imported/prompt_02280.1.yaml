answer: |-
  This is a fantastic rabbit hole. You have a significant advantage over most philosophy grad students here because you actually implement Brier scores for a living. Most philosophers treat the Brier score as an abstract mathematical object; you treat it as a loss function to be minimized. That intuition is exactly what James Joyce and the "Accuracy-First" epistemologists are banking on.

  Here is the breakdown of the mechanics you asked for, followed by my take on the Dutch Book vs. Accuracy debate.

  ---

  ### Part 1: The Mechanics of Accuracy Dominance

  The core claim of Joyce's (1998) argument is **Accuracy Dominance**. It states:
  > If your credences violate the probability axioms, there exists a set of credences that *does* satisfy the axioms which is guaranteed to be more accurate than yours, regardless of how the world turns out.

  To see this mechanically, we need to translate "probability axioms" into geometry and "accuracy" into distance.

  #### The Toy Model: 2 Propositions
  Let's use a partition of two propositions: $A$ and $\neg A$.
  There are only two possible worlds:
  1.  **$w_1$**: $A$ is True, $\neg A$ is False. Truth vector $v_1 = (1, 0)$.
  2.  **$w_2$**: $A$ is False, $\neg A$ is True. Truth vector $v_2 = (0, 1)$.

  Your credence function $c$ assigns a number to each: $c = (c(A), c(\neg A))$.
  **Probabilism** requires two things here:
  1.  **Non-negativity:** $c(A), c(\neg A) \ge 0$.
  2.  **Normalization:** $c(A) + c(\neg A) = 1$.

  Geometrically, the set of all possible credences is the unit square $[0,1] \times [0,1]$. The set of *probabilistic* credences is the line segment connecting $(1,0)$ and $(0,1)$. This line is the **Probability Simplex**.

  #### The Scoring Rule (Brier Score)
  You know the Brier score as MSE. In this multi-dimensional context, it is the **Squared Euclidean Distance** between your credence vector $c$ and the truth vector $v$.
  $$ \text{Accuracy}(c, v) = - \sum_{i} (c_i - v_i)^2 $$
  *(Note: Philosophers often define "Accuracy" as something to maximize, so they put a negative sign in front of the distance. I will stick to "Loss" = Distance to keep it consistent with your work, where lower is better.)*

  $$ \text{Loss}(c, v) = (c(A) - v(A))^2 + (c(\neg A) - v(\neg A))^2 $$

  #### The Dominance Proof (Concrete Numbers)
  Let's say you are incoherent. You love $A$, and you also love $\neg A$ (maybe you're just confused).
  **Your Credence:** $c = (0.6, 0.6)$. Sum = 1.2. (Violates Normalization).

  Let's calculate your Loss in both possible worlds.

  **World 1 ($A$ is True):** Truth is $v_1 = (1, 0)$.
  $$ \text{Loss}(c, v_1) = (0.6 - 1)^2 + (0.6 - 0)^2 = (-0.4)^2 + (0.6)^2 = 0.16 + 0.36 = \mathbf{0.52} $$

  **World 2 ($A$ is False):** Truth is $v_2 = (0, 1)$.
  $$ \text{Loss}(c, v_2) = (0.6 - 0)^2 + (0.6 - 1)^2 = (0.6)^2 + (-0.4)^2 = 0.36 + 0.16 = \mathbf{0.52} $$

  Now, consider a coherent credence $c^*$. The "closest" coherent point to $(0.6, 0.6)$ on the probability line ($x+y=1$) is the projection: $(0.5, 0.5)$.
  **Coherent Credence:** $c^* = (0.5, 0.5)$.

  **World 1:**
  $$ \text{Loss}(c^*, v_1) = (0.5 - 1)^2 + (0.5 - 0)^2 = 0.25 + 0.25 = \mathbf{0.50} $$

  **World 2:**
  $$ \text{Loss}(c^*, v_2) = (0.5 - 0)^2 + (0.5 - 1)^2 = 0.25 + 0.25 = \mathbf{0.50} $$

  **Result:** $0.50 < 0.52$.
  The coherent credence $c^*$ has lower loss (higher accuracy) in World 1 **AND** World 2. It **strictly dominates** your incoherent credence. No matter what happens, you would have been more accurate if you had obeyed the probability axioms.

  This generalizes to $N$ propositions. The probability simplex is a convex hull of the truth vertices. If you are outside the hull (incoherent), your Euclidean distance to *every* vertex is greater than the distance from the hull's surface to those vertices.

  #### Why "Strictly Proper" Matters
  You asked what goes wrong if the rule isn't strictly proper. This is the linchpin.

  A scoring rule $S(c, v)$ is **strictly proper** if, for any probabilistic belief $p$, the expected score is minimized when you report $c = p$.
  $$ \mathbb{E}_{v \sim p}[S(p, v)] < \mathbb{E}_{v \sim p}[S(c, v)] \quad \text{for all } c \neq p $$

  In the accuracy argument, we aren't talking about *reported* probabilities vs. *believed* probabilities (as in forecasting tournaments). We are talking about **Belief vs. Truth**.
  For the dominance theorem to hold, the "distance metric" we use to measure accuracy must align with the geometry of probability.

  **If the rule is NOT strictly proper:**
  Imagine a scoring rule that incentivizes extremization (e.g., you get a huge bonus for being 1.0 when right, small penalty for being 1.0 when wrong).
  Let's say the "Loss" function is actually: $L(c, v) = (c - v)^2 - 10c$. (This is made up, but illustrates the point).
  This rule might make the "most accurate" credence for a 50/50 event actually be $c=1.0$.
  If you use this metric, the point $(1.0, 1.0)$ might have a lower "Loss" score than $(0.5, 0.5)$ in some worlds.
  Consequently, an incoherent agent (who is extreme) might **not** be dominated by a coherent agent (who is moderate).

  **Strict propriety ensures that the "gradient" of accuracy always points toward the truth.** It guarantees that the probability simplex is the "valley floor" of the accuracy landscape. If the rule isn't strictly proper, the valley floor might be warped, and an incoherent point might sit lower in the valley than a coherent one. Joyce's theorem *requires* strictly proper scoring rules to prove that coherence is always closer to the truth.

  ---

  ### Part 2: Dutch Book vs. Accuracy-First (Taking a Side)

  Now for the philosophical meat. Why does your friend care that this is "nonpragmatic," and which argument is better?

  #### The Dutch Book Argument (Pragmatic)
  **The Gist:** If your credences are incoherent (e.g., $P(A) = 0.6, P(\neg A) = 0.6$), a bookie can sell you a bet on $A$ for \$0.60 and a bet on $\neg A$ for \$0.60. You pay \$1.20 total. One bet will win \$1.00. You lose \$0.20 guaranteed.
  **The Norm:** Don't be incoherent, or you will be **exploited**.
  **The Vibe:** Prudence. Self-interest. Don't leave money on the table.

  #### The Accuracy Argument (Epistemic)
  **The Gist:** If your credences are incoherent, your map is geometrically distorted relative to the territory. There is a less distorted map available to you.
  **The Norm:** Don't be incoherent, or you will be **wrong**.
  **The Vibe:** Truth. Representation. Cognitive fidelity.

  #### Why "Nonpragmatic" is a Huge Selling Point
  In philosophy, there is a hard distinction between **Epistemic Rationality** (believing what is true) and **Pragmatic Rationality** (doing what is beneficial).

  The Dutch Book argument conflates the two. It says: "You should have coherent beliefs *because* it protects your wallet."
  **The Objection:** "So what if I lose money? I'm not a gambler. I don't make bets. I just want to believe the truth. Why should the possibility of a predatory bookie dictate the structure of my mind?"

  If the only reason to be probabilistic is to avoid financial loss, then probabilism is just a rule of thumb for gamblers, not a law of thought. It makes epistemic norms dependent on practical interests.

  The Accuracy argument is **nonpragmatic** because it appeals *only* to the goal of accuracy (truth). It says: "Even if you never bet a dime, even if no bookie exists, your credences are objectively less accurate than they could be." It vindicates probabilism as a constraint on **belief itself**, not on **action**.

  #### My Verdict: Accuracy-First is the Stronger Argument for *Probabilism*
  Here is my take, weighing in on the debate:

  **The Accuracy-First argument is philosophically superior for establishing Probabilism, but the Dutch Book argument is more robust against "Why this math?" objections.**

  **Why Accuracy Wins on Philosophy:**
  Philosophers care about the *nature* of belief. Belief aims at truth (the "Guise of the True"). If you want to justify a norm for belief, you must appeal to truth. The Dutch Book argument commits a category error by justifying a belief norm using a practical penalty (money). The Accuracy argument respects the domain: it justifies a belief norm using an epistemic penalty (inaccuracy). If you want to know why a *rational mind* must be probabilistic, Accuracy is the only argument that answers that specific question without changing the subject to betting behavior.

  **Where Accuracy is Vulnerable (The "Measure Problem"):**
  The Accuracy argument relies entirely on the choice of the scoring rule. Joyce proves dominance for *any* strictly proper scoring rule, but why choose Brier (Euclidean)? Why not Log Loss? Why not Absolute Deviation?
  *   **Brier Score:** Implies Euclidean distance.
  *   **Log Loss:** Implies a different geometry (KL Divergence).
  Both are strictly proper. Both yield dominance theorems. But they weight errors differently.
  The Dutch Book argument doesn't have this problem. Money is money. A dollar lost on a bet is unambiguous. The Accuracy argument requires you to accept that "Accuracy" is quantifiable in a specific way.

  **Why "Nonpragmatic" isn't just a footnote:**
  It's the difference between "You're driving recklessly" (Pragmatic: you might crash) and "You're driving on the wrong side of the road" (Constitutive: you aren't driving correctly by definition).
  Philosophers treat "nonpragmatic" as a selling point because they are trying to establish **Epistemic Normativity**. They want to show that there are reasons to believe things that exist independently of whether those beliefs help you survive, get rich, or avoid Dutch Books. If probabilism is only pragmatically useful, it's contingent. If it's accuracy-required, it's necessary for any truth-seeking agent.

  #### Summary
  1.  **Mechanically:** Incoherent credences lie outside the "probability simplex." Strictly proper scoring rules (like Brier) measure distance to truth in a way that guarantees the closest point on the simplex is *always* closer to the truth vertices than the incoherent point.
  2.  **Philosophically:** The Dutch Book argument says incoherence makes you **poor**. The Accuracy argument says incoherence makes you **wrong**. Since probabilism is a thesis about *belief*, not *wealth*, the Accuracy argument is the stronger vindication, despite the technical baggage of choosing a scoring rule.

  Your friend is sick of your questions because you've stumbled onto the fact that **forecasting metrics are actually metaphysical constraints on rationality.** That's a heavy realization for a Tuesday. Keep pushing on the "Measure Problem" (why Brier?) if you want to annoy them further—that's where the real fight is happening in the literature right now (e.g., Pettigrew vs. Joyce).
