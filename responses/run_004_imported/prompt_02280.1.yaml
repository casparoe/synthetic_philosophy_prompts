prompt: |-
  Random philosophy rabbit hole I fell into this week and can't shake, hoping you can help me out since my one friend with an actual philosophy PhD is sick of my questions by now. For work I build forecasting/calibration tooling, so I deal with Brier scores constantly (basically mean squared error between a predicted probability and the actual 0/1 outcome, used to grade how good a forecaster is). I mentioned this in a discord for a reading group I'm part of, and someone linked me to an SEP-style article on "epistemic utility theory" where it turns out philosophers use this exact scoring-rule machinery to argue for something called probabilism -- the idea that a rational person's credences (degrees of belief) are required to obey the probability axioms. Apparently there's an older, more famous argument for that same conclusion, the Dutch Book argument (if your credences are incoherent, a bookie can build a set of bets against you that loses you money no matter what happens), and then this newer "accuracy-first" argument, which I think traces back to a guy named Joyce, that says something wilder: if your credences violate the probability axioms, there's always some coherent set of credences that's literally more accurate than yours in every single possible world, full stop, no betting required.

  I've got the rough shape of both now but I'm stuck on two things. First, I don't really get how the accuracy argument works mechanically -- everyone keeps saying the scoring rule has to be "strictly proper" or the whole thing falls apart, and I don't get what a non-strictly-proper rule would even do wrong (I use Brier score at work without ever thinking about whether its "proper", so clearly I'm missing something). Second, my PhD friend keeps hyping up the fact that this is a "nonpragmatic" vindication of probabilism, like that's obviously a huge deal, and I don't get why -- isn't a Dutch book already a pretty devastating argument against incoherent credences on its own? Could you (1) walk me through the accuracy-dominance argument concretely enough that I could reconstruct a toy version myself with like 2 propositions, and (2) actually take a side on which argument, Dutch Book or accuracy-first, is the stronger case for probabilism, and explain why philosophers treat "nonpragmatic" as such a selling point rather than a minor footnote? Feel free to get properly into the weeds, I've done enough reading this week that I can handle real technical detail at this point.
