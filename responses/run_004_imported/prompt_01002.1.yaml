prompt: |-
  This is my final answer.

  I'm at work on a historical novel that includes a scene in which Jeremy Bentham, alone in his study, rereads an essay he drafted in the 1780s and never dared publish during his lifetime — the manuscript now known as "Offences Against One's Self," in which he argues on strict utilitarian grounds against the criminal punishment of homosexual acts. I want the scene to reflect his actual reasoning rather than a modern gloss on it, so I've been working through the essay itself, and one passage has left me stuck:

  "In this case, in short, as in so many other cases the disposition to punish seems to have had no other ground than the antipathy with which persons who had punishment at their disposal regarded the offender. The circumstances from which this antipathy may have taken its rise may be worth enquiring to. One is the physical antipathy to the offence. This circumstance indeed, were we to think and act consistently, would of itself be nothing to the purpose. The act is to the highest degree odious and disgusting, that is, not to the man who does it, for he does it only because it gives him pleasure, but to one who thinks of it. Be it so, but what is that to him? He has the same reason for doing it that I have for avoiding it. A man loves carrion — this is very extraordinary — much good may it do him. But what is this to me so long as I can indulge myself with fresh meat? But such reasoning, however just, few persons have calmness to attend to... From a man's possessing a thorough aversion to a practice himself, the transition is but too natural to his wishing to see all others punished who give into it. Any pretence, however slight, which promises to warrant him in giving way to this intolerant propensity is eagerly embraced. James the 1st of England, a man more remarkable for weakness than for cruelty, conceived a violent antipathy against certain persons who were called Anabaptists on account of their differing from him in regard to certain speculative points of religion. As the circumstances of the times were favourable to the gratification of antipathy arising from such causes, he found means to give himself the satisfaction of committing one of them to the flames. The same king happened to have an antipathy to the use of tobacco. But as the circumstances of the times did not afford the same pretences nor the same facility for burning tobacco-smokers as for burning Anabaptists, he was forced to content himself with writing a flaming book against it."

  Could you help me reconstruct, step by step, the psychological mechanism by which Bentham thinks a merely "physical" antipathy, or disgust, curdles into a felt "moral" duty to punish those who indulge it? I'd also like to understand what argumentative work the two anecdotes about James I are doing there, since Bentham plainly regards them as clinching something rather than just decorating the point. Getting this right matters to me, since I want my Bentham to reason like the man who actually wrote this passage, not like a mouthpiece for views he happens to anticipate.
