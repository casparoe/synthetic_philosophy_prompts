      *   *Utilitarian Logic:* If I hate carrion but you love it, and it doesn't hurt me, why should I stop you? (The "fresh meat" analogy).
      *   *Psychological Leap:* People lack the "calmness" to follow this logic. Instead, they move from "I hate this" to "Everyone who does this should be punished."
      *   *Mechanism:* "Any pretence... is eagerly embraced." People look for justification to act on their intolerance.
      *   *Evidence (James I):*
          *   Case A (Anabaptists): Religious difference $\rightarrow$ Antipathy $\rightarrow$ Circumstances allowed punishment $\rightarrow$ Burned one.
          *   Case B (Tobacco): Personal dislike $\rightarrow$ Antipathy $\rightarrow$ Circumstances *didn't* allow punishment (burning smokers) $\rightarrow$ Wrote a book instead.
      *   *Conclusion:* The desire to punish is driven by the *opportunity* to gratify antipathy, not by the inherent wrongness of the act. If you can't punish, you complain (write a book). If you can, you punish.

  3.  **Address the Specific Questions:**
