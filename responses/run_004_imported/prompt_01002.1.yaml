          *   *The Point:* The *intensity* of the antipathy was likely similar, but the *outcome* depended on whether society allowed punishment.
          *   *Implication:* If burning tobacco smokers was socially acceptable, James would have done it. Since it wasn't, he just wrote a book. Therefore, the punishment of Anabaptists wasn't about "justice," it was about "opportunity to gratify dislike."
