prompt: |-
  I sit on the academic integrity board at my university, and we've got a case on the docket next month that's messier than the usual copy-paste plagiarism stuff, and it's kind of eating at me. A five-person senior capstone team submitted one joint final report under all five names, and it turns out the test data behind one section's conclusions was made up. Two of the five, Priya and Jordan, admit they fabricated it because the prototype kept failing bench tests and they'd run out of time before the deadline. Ana, the nominal team lead, didn't fabricate anything herself, but she signed the certification page attesting the results were accurate, and she's told us privately that she had a bad feeling about that section but didn't push it because she didn't want another fight with Priya and Jordan that week. Marcus joined the team three weeks before submission, replacing someone who dropped the course, and says he had no idea any of the data was fabricated. Sam actually flagged the weirdness in the team's group chat two months ago, was told to drop it, and did.

  The board is split down the middle. Half want to sanction the team as a unit — five names went on one document, they held themselves out as a team, so it's the team's failure that gets sanctioned, with individual circumstances treated as mitigation at most. The other half thinks that's basically a fiction: only individuals actually know things and decide things, so you can only punish people for what they personally knew or chose, and "the team failed" is just a loose way of describing five seperate stories stapled together. (I mentioned all this to a friend who does philosophy of action as a hobby, and she said "oh, that's just Bratman vs. Gilbert" and went back to her crossword, so thanks for nothing there.) What I actually need is the memo I can put in front of the board before we meet: a real recommendation for what happens to each of the five, not a menu of options, reasoned in a way the individual-responsibility camp could read and feel genuinely answered rather than steamrolled — and it needs a timeline, since final grades are due to the registrar in eleven days.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Academic Integrity Board (AIB).
      *   **Task:** Write a memo with a *specific recommendation* for sanctions for each of the five students (Priya, Jordan, Ana, Marcus, Sam).
      *   **Context:** Senior capstone project, joint report, fabricated data in one section.
      *   **The Conflict:** The board is split between "Collective Responsibility" (team is one unit) vs. "Individual Responsibility" (only punish what individuals knew/did).
      *   **Constraint:** Must appeal to the "Individual Responsibility" camp (make them feel heard/answered, not steamrolled) while still proposing a coherent outcome.
      *   **Timeline:** Grades due in 11 days.
      *   **Reference:** Friend mentioned "Bratman vs. Gilbert" (Philosophy of Collective Action/Intentionality).
      *   **Tone:** Professional, reasoned, decisive, administrative but ethically grounded.

  2.  **Deconstruct the Philosophical Reference (Bratman vs. Gilbert):**
      *   *Michael Bratman:* Focuses on "Shared Intention." Collective action exists when individuals have interlocking intentions and commitments to coordinate. It's bottom-up.
      *   *Margaret Gilbert:* Focuses on "Joint Commitment." A group forms a "plural subject" when they mutually agree to be bound together. It creates obligations that aren't just the sum of individual obligations.
      *   *Relevance:* The board's split mirrors this. The "Team as Unit" camp leans Gilbert (joint commitment creates collective liability). The "Individual Responsibility" camp leans Bratman/Individualism (only individual mental states count).
      *   *Strategy:* I don't need to write a philosophy paper, but I need to use the *logic* of shared intention to bridge the gap. I need to show that individual responsibility *includes* responsibility for one's role within a collaborative structure. If you sign up for a team, you take on specific duties. Failing those duties is an individual failure, even if the context is collective.

  3.  **Analyze the Students' Culpability:**
      *   **Priya & Jordan:** Fabricators. Direct violation of integrity. High culpability.
      *   **Ana:** Team Lead. Signed certification. Suspected issues but stayed silent to avoid conflict. Negligence/Complicity. Medium-High culpability (leadership duty).
      *   **Marcus:** Late joiner (3 weeks prior). Claims ignorance. Plausible? Maybe. Did he do due diligence? Low-Medium culpability (negligence vs. ignorance).
      *   **Sam:** Flagged the issue, told to drop it, complied. Whistleblower who was silenced. Lowest culpability, but still submitted a report they knew was suspect.

  4.  **Develop the Argument (The "Bridge"):**
      *   To satisfy the Individual Responsibility camp, I must avoid saying "The team is guilty."
      *   Instead, I must argue: "Each individual is guilty of failing their specific obligation within the collaborative framework they voluntarily entered."
      *   *Key Concept:* **Duty of Verification.** In a capstone, signing a report isn't just a formality; it's an individual assertion of truth.
      *   *Key Concept:* **Complicity through Silence.** Knowing something is wrong and submitting anyway is an individual act of dishonesty, even if you didn't forge the data.
      *   *Key Concept:* **Reasonable Reliance.** For Marcus, did he have time to verify? If not, his individual culpability is lower.

  5.  **Drafting the Recommendations (Sanctions):**
      *   *Priya & Jordan:* Failure of the course (F), Disciplinary Record, Potential suspension/revocation of degree if severe (but let's stick to course failure + record for now).
      *   *Ana:* Failure of the course (F). She certified falsehoods she suspected. Leadership carries higher duty.
      *   *Marcus:* Incomplete or Conditional Pass? If he truly couldn't know, punishing him like the others is unjust. But he submitted a false document. Recommendation: Resubmit/Redo the section or Fail the course but allow retake. Let's go with **Fail the course, but eligible for immediate retake/redo** without permanent disciplinary mark (or a lesser mark). Actually, for integrity, a mark is usually needed. Let's suggest a **Reduced Penalty (Warning + Course Failure but no permanent record)** if his ignorance is verified.
      *   *Sam:* This is the trickiest. Sam knew and submitted. That's complicity. But Sam raised the alarm. Sanctioning Sam looks bad. However, submitting known false data is a violation. Recommendation: **No Sanction on Record, but Course Failure.** Or, **Warning only.** If Sam flagged it, they tried. But they still signed the cert. Let's argue for a **Formal Warning, No Course Failure** (or allow them to pass based on other work). Actually, academic integrity usually requires a penalty for submitting false work. Let's recommend a **Formal Warning and a requirement to complete an ethics module, but no grade penalty** because they fulfilled the duty to report within the team structure, even if overruled. *Correction:* If they submitted it, they attested to it. A grade penalty is likely unavoidable for integrity, but mitigation is key. Let's go with **Course Failure, but no disciplinary record.**
      *   *Wait, reconsidering Sam:* If Sam flagged it and was overruled, did they have recourse? They could have told the professor. They didn't. They are complicit. But they are the least culpable. Let's recommend **Probation/Warning, Grade stands (or F)**. Let's aim for **Warning + Ethics Module, Grade determined by instructor based on non-fabricated work.**
      *   *Re-evaluating for Consistency:* The prompt asks for a *real recommendation*. Usually, if data is fabricated, the project fails.
      *   *Priya/Jordan:* F in course, Notation on transcript, Suspension.
      *   *Ana:* F in course, Notation on transcript. (Dereliction of duty).
      *   *Marcus:* F in course, No Notation (Negligence, not malice). Opportunity to redo.
      *   *Sam:* Warning, No Grade Penalty (if other work passes), No Notation. (Whistleblower mitigation).

      *Refining the Argument for the Individualists:* The argument isn't "guilt by association." It's "guilt by specific dereliction of individual duty."
      *   P&J: Duty to be honest. Breached.
      *   Ana: Duty to verify/lead. Breached.
      *   Marcus: Duty to verify (within reason). Breached (negligently).
      *   Sam: Duty to report externally if internally silenced. Breached (but mitigated).

  6.  **Addressing the Timeline:**
      *   Grades due in 11 days.
      *   Hearing needs to happen ASAP.
      *   Recommendation needs to be actionable by the Registrar/Instructor.

  7.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation.
      *   **Philosophical/Policy Framework:** Addressing the Board split (The "Bratman/Gilbert" bridge). Framing it as *Individual Duties within a Collaborative Contract*.
      *   **Case Analysis (Student by Student):** Specific findings and sanctions.
      *   **Timeline/Implementation:** Steps to meet the 11-day deadline.
      *   **Conclusion:** Final appeal to unity.

  8.  **Drafting - Section by Section (Iterative refinement):**
      *   *Tone Check:* Needs to be authoritative but respectful of the dissent.
      *   *The "Bratman/Gilbert" bit:* Don't name-drop too much, but use the logic. The "Individual Responsibility" camp is right that *moral agency* is individual. But the "Collective" camp is right that *obligations* were formed jointly. The synthesis: **Voluntary Assumption of Collective Duty.** By joining the team, each individual took on specific duties (verify, lead, report). Violating *those* specific duties is an individual failure.
      *   *Sanctions:* Need to be distinct.
          *   Priya/Jordan: Fabrication. Severe.
          *   Ana: Certification + Suspicion. Severe (but less than fabrication).
          *   Marcus: Late joiner. Negligence. Moderate.
          *   Sam: Dissenter who complied. Minimal.

      *(Self-Correction on Sanctions)*: If I recommend different grades, the instructor needs to know. The Board usually recommends disciplinary action; the instructor assigns grades. I should separate Disciplinary Sanctions (Record) from Academic Sanctions (Grade).
      *   *Disciplinary:* Suspension/Probation/Warning.
      *   *Academic:* Fail/Pass/Redo.
      *   *Memo Focus:* Primarily Disciplinary/Integrity finding, with Grade recommendations.

      *Refining Sam:* If Sam flagged it, they showed integrity *internally*. But submitting the report is the act of dishonesty to the *university*. However, punishing Sam heavily discourages future whistleblowing. Recommendation: **No Disciplinary Record, Grade of 'F' on the project component only (if possible) or Course 'F' but with right to retake without transcript notation.** Let's go with **Formal Warning, No Transcript Notation, Course Grade determined by instructor (recommendation: allow pass based on other work).**

      *Refining Marcus:* He joined late. He relied on the team. Is that reasonable? In a senior capstone, you are expected to vet the work you sign. But 3 weeks is short. **Formal Warning, No Transcript Notation, Course 'F' but eligible for immediate redo.**

      *Refining Ana:* She suspected. She signed. This is the crux for the individualists. She made an *individual choice* to prioritize harmony over truth. **Disciplinary Probation, Transcript Notation, Course 'F'.**

      *Refining Priya/Jordan:* **Suspension (1 semester), Transcript Notation, Course 'F'.**

  9.  **Final Polish:** Check the timeline. 11 days is tight. Hearing in 2 days. Decision in 5. Appeal window? Usually, integrity decisions are immediate. Need to flag the Registrar.

  10. **Writing the Memo:** (incorporating the "Individual Duty" framework to satisfy the dissenters).

      *   *Key Phrase:* "Individual Culpability within a Joint Enterprise."
      *   *Addressing the split:* Acknowledge the tension. Validate the individualists. Then show how their logic leads to the same result *if* we define the duty correctly.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm lecturing the board on philosophy. Keep it practical. Use the philosophy to underpin the *policy interpretation*.

      *Timeline:*
      *   Day 1: Memo distributed.
      *   Day 2: Board Meeting/Hearing.
      *   Day 3-4: Deliberation.
      *   Day 5: Decision issued.
      *   Day 6-10: Administrative processing/Instructor notification.
      *   Day 11: Grades submitted.

      *Wait, one more thing:* The prompt asks for a memo *before* the meeting to guide the discussion. So it's a "Chair's Recommendation" or "Staff Memo." I will write it as a "Presiding Officer's Recommendation."

      *Let's check the Bratman/Gilbert hint again.*
      *   Bratman: Shared intention is a web of individual intentions. (Fits the Individualist camp).
      *   Gilbert: Joint commitment creates a new subject. (Fits the Collectivist camp).
      *   My argument: We don't need to accept Gilbert's "plural subject" to sanction the team. We can use Bratman. Each person had an individual intention to coordinate. Each person failed their specific node in that web. Priya/Jordan (Intention to deceive). Ana (Intention to ignore). Marcus (Intention to rely without check). Sam (Intention to submit despite doubt).
      *   This satisfies the Individualists: We are punishing *individual mental states and choices*, not a ghostly "team entity."

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name/Title], Presiding Officer
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation re: Capstone Project 404 (Fabrication of Data)
  **DEADLINE:** Grades due to Registrar in 11 days (November 4)

  ### 1. Executive Summary

  This memo outlines a recommended finding of responsibility and sanctioning framework for the five members of Capstone Team 404. The Board is currently divided between a "Collective Liability" model (the team is one unit) and an "Individual Culpability" model (punish only what is personally known).

  **Recommendation:** We should adopt a third framework: **Individual Dereliction of Collaborative Duty.**

  This approach satisfies the "Individual Culpability" camp by grounding sanctions in specific, voluntary choices made by each student, rather than imputing guilt by association. Simultaneously, it acknowledges the "Collective" reality that a capstone team is a contract of interlocking obligations. By signing the certification page, each student did not merely join a group; they individually attested to the veracity of the whole.

  Based on this, I recommend differentiated sanctions ranging from Suspension (for fabricators) to a Formal Warning (for the whistleblower). A timeline to meet the 11-day grade deadline is attached.

  ### 2. Resolving the Board's Impasse

  The philosophical tension noted in our preliminary discussion (often categorized in literature as Bratman vs. Gilbert) need not paralyze us. We do not need to prove the "team" is a moral agent to sanction the team members.

  For the members of the Board who hold that *only individuals act*, consider the following:
  *   **Voluntary Assumption of Duty:** In a senior capstone, joining a team is a voluntary act. It creates specific individual duties: the duty to verify, the duty to lead, and the duty to report.
  *   **The Act of Certification:** The signature page is not a collective stamp; it is five individual signatures. Each signature is an independent assertion of truth.
  *   **Mens Rea (State of Mind):** We can distinguish culpability based on individual mental states without absolving anyone. Fabrication is intentional. Signing while suspicious is reckless. Signing without checking is negligent. Signing after protesting is coerced complicity.

  Therefore, we are not punishing "the team." We are punishing five individuals for failing five distinct obligations they voluntarily accepted when they joined the project.

  ### 3. Case Analysis and Sanction Recommendations

  #### A. Priya and Jordan (The Fabricators)
  *   **Finding:** Responsible for Academic Dishonesty (Fabrication).
  *   **Reasoning:** They made an active, intentional choice to deceive the university and the public. This is the core violation.
  *   **Sanction:**
      *   **Academic:** Failing Grade (F) in Capstone Course.
      *   **Disciplinary:** One-Semester Suspension. Notation on transcript for Academic Integrity Violation.
      *   **Rationale:** Deterrence and upholding the standard of the degree. Seniority does not mitigate; it aggravates.

  #### B. Ana (The Team Lead)
  *   **Finding:** Responsible for Academic Dishonesty (Complicity/Negligence).
  *   **Reasoning:** Ana did not fabricate data, but she signed the certification while harboring specific suspicions. As Team Lead, she held a heightened duty of verification. She prioritized conflict avoidance over academic integrity. Her signature was an individual lie, even if the data wasn't her own.
  *   **Sanction:**
      *   **Academic:** Failing Grade (F) in Capstone Course.
      *   **Disciplinary:** Disciplinary Probation. Notation on transcript for Academic Integrity Violation.
      *   **Rationale:** Leadership carries liability. Signing a document you suspect is false is a violation of the individual duty of honesty.

  #### C. Marcus (The Late Joiner)
  *   **Finding:** Responsible for Academic Negligence.
  *   **Reasoning:** Marcus claims ignorance. However, in a senior capstone, "I didn't know" is rarely a full defense for work submitted under one's name. He had three weeks. He had a duty to perform reasonable due diligence on the data he was signing. He failed to verify, relying blindly on others.
  *   **Sanction:**
      *   **Academic:** Failing Grade (F) in Capstone Course, *with option to retake immediately without repeating the entire course* (redo only the verification/reporting component).
      *   **Disciplinary:** Formal Warning. **No** transcript notation.
      *   **Rationale:** This distinguishes negligence from malice. He violated the duty of care, but not the duty of honesty. This satisfies the individualists: his punishment fits his specific mental state (negligence vs. intent).

  #### D. Sam (The Whistleblower)
  *   **Finding:** Not Responsible for Dishonesty (Mitigated Complicity).
  *   **Reasoning:** Sam fulfilled the internal duty to report but failed the external duty to refuse submission. However, sanctioning Sam heavily creates a chilling effect for future whistleblowers. Sam's individual choice was to attempt correction; the failure was systemic (team dynamics).
  *   **Sanction:**
      *   **Academic:** Grade determined by Instructor based on non-fabricated portions of work (Potential to Pass).
      *   **Disciplinary:** Mandatory Ethics Training Module. **No** Disciplinary Record. **No** transcript notation.
      *   **Rationale:** We must signal that raising concerns is the correct individual action, even if the outcome was not ideal. Punishing Sam equates to punishing the attempt at integrity.

  ### 4. Implementation Timeline (11 Days)

  To ensure grades are submitted by the November 4 deadline, we must adhere to the following schedule:

  *   **Day 1 (Today):** Memo distributed to Board.
  *   **Day 2 (Tomorrow, 4:00 PM):** Emergency Board Hearing. Students notified 24-hours prior (per expedited protocol for graduation-impacting cases).
  *   **Day 3:** Board Deliberation and Vote.
  *   **Day 4:** Decision Letters drafted and sent to Students and Faculty Advisor.
  *   **Day 5:** Instructor notified of grade recommendations.
  *   **Day 6-9:** Student Appeal Window (Expedited 4-day window). *Note: If an appeal is filed, the Registrar is notified to hold the specific grade pending resolution, while others are submitted.*
  *   **Day 10:** Finalize any appeal rulings.
  *   **Day 11:** Grades submitted to Registrar.

  ### 5. Conclusion

  This recommendation avoids the fiction that "the team" is a single person. Instead, it asserts that **collaboration is a series of individual promises.** Priya and Jordan broke the promise of truth. Ana broke the promise of oversight. Marcus broke the promise of diligence. Sam kept the promise of inquiry but was overruled.

  By sanctioning these specific breaches, we respect the individual agency of each student while upholding the integrity of the collaborative degree requirement.

  I request the Board review this framework prior to tomorrow's session so we may enter the hearing unified on the *principle* of liability, even if we debate the *severity* of sanctions.

  **[Signature]**

  **Presiding Officer, Academic Integrity Board**
