answer: |-
  Here are ten questions designed to build pressure throughout the Q&A, starting with internal coherence and moving toward metaphysical stakes. They incorporate your specific requirements regarding multiplication, explanatory order, conflicting baselines, non-agential cases, and falsifiability.

  ### 1. The Multiplication Problem and Baseline Relocation
  You argue that appealing to a "normal" baseline solves the multiplication problem, distinguishing the negligent gardener from the rest of us who also failed to water the flowers. But doesn't this simply relocate the multiplication problem one level up? We now have to ask: what determines the baseline? If the baseline is determined by social expectation, legal duty, or statistical frequency, aren't there still indefinitely many competing norms that could apply to the same situation? How do you select *the* operative baseline without invoking yet another set of interests?

  *   **Follow-up:** If she says the baseline is context-dependent: "So causation itself is context-dependent? Does that mean the causal history of the flowers changes depending on who is asking the question?"

  ### 2. The "Positive Causation" Defense
  Your ready reply is that omissions are no worse off than positive causation, because positive causation also relies on a normal/abnormal contrast to isolate causes from background conditions. But isn't there a disanalogy in the *source* of that contrast? In positive causation, the abnormal event is usually a physical intrusion (a spark, a bullet). In omissive causation, the "event" is constituted entirely by the violation of the norm. If the norm disappears, does the cause disappear with it?

  *   **Follow-up:** If she insists they are identical: "Then if we change our moral norms about a gardener's duty tomorrow, does it change the metaphysical fact of whether he caused the death yesterday?"

  ### 3. Explanatory Order and Responsibility
  There is a worry that you have the explanatory order backwards. We ordinarily think moral responsibility is grounded in prior causal facts: the gardener is blameworthy *because* his omission caused the death. On your view, it seems the omission counts as a cause *because* he is blameworthy (or under a duty). Are you comfortable accepting that causation is downstream from normativity, rather than the other way around?

  *   **Follow-up:** If she denies the order is backwards: "Then can you describe a case where an agent is morally responsible for an outcome that, on your account, they did not causally contribute to?"

  ### 4. Conflicting Baselines (Statistical vs. Prescriptive)
  Consider a case where the statistical baseline and the prescriptive baseline come apart. Suppose a certain pathogen is endemic to a watershed; statistically, its presence is the "normal" state. However, from a management or health perspective, its presence is "abnormal" and undesirable. If the pathogen is *removed* (an omission of presence), causing a trophic cascade, is the cause the removal (prescriptive norm) or the prior presence (statistical norm)? Which baseline gets to win?

  *   **Follow-up:** If she says the prescriptive norm wins: "Then statistical reality is metaphysically subordinate to human valuation? A cause in a managed forest is a different kind of entity than a cause in a wild one?"

  ### 5. Non-Agential Systems (The Ecological Test)
  I'd like to test this against a non-agential case, since my career was spent in systems without moral agents. If wolves are removed from a landscape and elk irrupt, we say the absence of wolves caused the irruption. But there is no moral duty for wolves to exist, and no negligence. What is the "norm" here? Is it purely statistical frequency? If so, does a rare natural extinction event count as a cause, while a common one does not?

  *   **Follow-up:** If she says "functional norm" applies instead: "Who assigns the function in a wild system? If nature has no telos, are you importing agency where there is none to save the causal claim?"

  ### 6. Causal Models and Default Values
  You mention default values, which echoes the structural equation models used in computer science and some metaphysics. In those models, the "default" value is often an arbitrary modeling choice to make the math work. Are your baselines similarly pragmatic tools for organizing information, or do they track mind-independent features of the world?

  *   **Follow-up:** If she says they are pragmatic tools: "Then are we doing metaphysics, or are we doing epistemology? Are you describing how the world works, or how we must talk about it?"

  ### 7. Temporal Stability of Causal Facts
  If baselines are tied to operative norms, and norms evolve over time, does the causal structure of the past change? If the gardening norm shifts in 2024 so that watering is no longer expected, does the gardener in 2020 cease to have caused the death of the flowers?

  *   **Follow-up:** If she says the past is fixed: "What fixes it? If the norm was operative then, but we no longer recognize it, how do we access the 'true' baseline of the past?"

  ### 8. Scientific Practice and "Loose" Talk
  In ecology, we treat omissions as causes constantly without referencing norms. We say "lack of nitrogen caused the stunting." We don't ask if the nitrogen was *obliged* to be there. Are practicing scientists simply speaking loosely, as I feared when I started reading philosophy? Or is your account adding a layer that science rightly ignores?

  *   **Follow-up:** If she says scientists are speaking loosely: "Then your metaphysics cannot underwrite scientific explanation? It serves only legal or moral attribution?"

  ### 9. Realism vs. Pragmatism
  Let's press on the ontological commitment. If your account relies on norms to validate causation, are you a realist about causation? Or are you suggesting that "causation" is a label we apply to sequences that interest us, rather than a relation that exists in the world regardless of observers?

  *   **Follow-up:** If she claims realism: "How can a relation be real if its existence depends on a normative framework that varies between observers?"

  ### 10. Falsifiability and the "Quasi-Cause" Concession
  Finally, I'd like to ask what would count as evidence against your account. If every time we find an omission that seems causal but lacks a norm, you can posit a hidden baseline, the view seems unfalsifiable. At what point should we concede to the skeptics who argue omissions are never "real" causes, but at best "quasi-causes" useful for explanation but absent from the ontology?

  *   **Follow-up:** If she says there is no evidence against it: "Then is this a metaphysical theory, or a definition? If it's a definition, you haven't solved the metaphysical problem, you've just stipulated it away."
