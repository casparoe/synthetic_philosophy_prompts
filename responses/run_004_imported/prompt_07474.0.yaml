answer: |-
  Your colleague Alicia is right, and this is a crucial distinction to clarify before your seminar. While your description of the *logic* of the non-identity case is accurate, your interpretation of Parfit's *normative conclusion* is indeed the exact opposite of his actual position.

  If you teach that the "wrongness evaporates" and students shouldn't be troubled by the choice, you are teaching the **Person-Affecting View** as the *solution*, whereas Parfit introduces the Non-Identity Problem (NIP) specifically to demonstrate that the Person-Affecting View is **inadequate**.

  Here is the breakdown of where the framing needs to shift:

  ### 1. The Logic vs. The Upshot
  You have the mechanics of the case correct:
  *   **The Setup:** 14-year-old girl has Child A now vs. waiting to have Child B.
  *   **The Comparison:** Child A has a life worth living but worse than Child B would have had.
  *   **The Person-Affecting Claim:** Child A is not *worse off* than they would otherwise have been (since otherwise they wouldn't exist).
  *   **The Implication:** Therefore, on a strictly comparative, person-affecting account of harm, Child A is not harmed.

  **Where your framing diverges:** You are concluding that therefore, **no wrong has been committed.**
  **Parfit's conclusion:** He agrees that no wrong is committed *according to standard person-affecting principles*, but he insists that **the action is still morally wrong (or the outcome is worse).**

  ### 2. Parfit's Actual Project
  In *Reasons and Persons* (Part IV), Parfit uses the Non-Identity Problem as a *reductio ad absurdum* of the Person-Affecting Restriction (the idea that an act can only be wrong if it makes some particular person worse off).

  Parfit's intuition is robust: **The girl does something wrong.** Or, at the very least, the outcome where she has the child early is *worse* than the outcome where she waits. The "Problem" in "Non-Identity Problem" is not that we are confused about whether the girl acted wrongly; the problem is that **our best moral theories cannot explain *why* she acted wrongly.**

  If you tell your students that the wrongness "evaporates," you are effectively dissolving the problem rather than solving it. Parfit's goal is to motivate the move toward **Impersonal Principles** (like his "Theory X" or the "Same Number Quality Claim," often denoted as **Q**). Claim Q roughly states: *If in two possible outcomes the same number of people would exist, it would be worse if those who live have a lower quality of life.*

  ### 3. How to Fix the Lecture
  You don't need to scrap the lecture, but you do need to flip the pedagogical punchline.

  *   **Current (Problematic) Framing:** "The NIP shows that our intuition that the girl did wrong is a comparative illusion. Actually, she did nothing wrong."
  *   **Corrected (Parfitian) Framing:** "The NIP shows that our standard definition of harm (making someone worse off) fails to capture why the girl did wrong. Since we agree she *did* do wrong (or made things worse), we need a new moral theory that can account for wrongs that don't harm specific identifiable individuals."

  ### 4. Why This Matters for Grad Students
  In a grad seminar, this distinction is the difference between understanding the NIP as a clever logic puzzle versus understanding it as a foundational crisis in population ethics.

  If you frame it as "no harm, no foul," you close the door on the rest of the literature. The entire field of population ethics (including the Repugnant Conclusion) stems from Parfit's insistence that we must be able to say the early-birth outcome is worse, even if no one is worse off. If you side with the "no foul" verdict, you are essentially adopting a strict Person-Affecting View, which most contemporary population ethicists (following Parfit) consider untenable precisely *because* of cases like the 14-year-old girl.

  **Summary for your prep:**
  Keep the case description. Keep the logic about identity switching. But change the conclusion: **Parfit thinks the girl's choice is morally problematic, and the fact that standard theory says otherwise is a bug in the theory, not a feature of the morality.** Alicia was looking out for you—this is a common misreading, but in a grad seminar, it would likely lead to significant confusion once they start reading the actual text.
