      *   **Core Question:** If Daniel Bernoulli (1700-1782) were presented with the Pasadena Paradox today, how would he react? Would he see it as a refutation of Expected Utility Theory (EUT), or would he find a way to defend his framework?
      *   **Constraint:** The response must be grounded in Bernoulli's actual reasoning and commitments from his 1738 paper *Specimen Theoriae Novae de Mensura Sortis* (Exposition of a New Theory on the Measurement of Risk), not just generic modern decision theory dressed up in 18th-century garb.
      *   **Tone:** Intellectual, historically informed, slightly conversational (matching the user's "drinks with a friend" vibe), but rigorous.

  2.  **Deconstruct the Pasadena Paradox:**
