answer: |-
  This is a fantastic debate to have had, and honestly, Theo is right to press you: the Pasadena paradox is a much sharper knife than St. Petersburg. St. Petersburg blows up because the expected value diverges to infinity; Bernoulli patched that by compressing value through logarithmic utility. But Pasadena is insidious because the expected utility *exists* (conditionally), yet it is unstable under rearrangement. Since the payoffs are stipulated directly in *utils*, Bernoulli's compression function has no leverage.

  If you sat Daniel Bernoulli down in a Zurich café today, poured him a glass of wine, and walked him through Nover and Hájek's 2004 paper, I don't think he would surrender his theory. But I also don't think he would try to solve the math the way a modern formalist would. He would attack the *ontology* of the gamble itself.

  Based on his 1738 *Specimen Theoriae Novae de Mensura Sortis* (Exposition of a New Theory on the Measurement of Risk), here is how I believe Bernoulli would squirm out of the Pasadena trap, grounded in his actual commitments.

  ### 1. He would reject the "Unbounded Utility" Premise
  Theo's strongest point is that because the payoffs are in *utils*, you can't apply $U(w) = \ln(w)$. But Bernoulli never intended utility to be an abstract, unbounded mathematical scalar. For Bernoulli, utility (*emolumentum*) was a psychological and physiological response to changes in physical wealth.

  In *Specimen*, Bernoulli is deeply concerned with the "human condition." He writes about how a gain of 1,000 ducats means more to a pauper than a rich man. This implies a bounded capacity for human satisfaction. He viewed the logarithmic function not just as a mathematical trick, but as a model of human sensory limitation (akin to the Weber-Fechner law in psychophysics, which came later but fits his mindset).

  Faced with Pasadena, where the utility payoff grows as $2^n/n$, Bernoulli would likely argue that **no human being can experience utility that scales indefinitely.** There is a maximum capacity for joy and a maximum capacity for suffering. If the game promises $2^{100}/100$ utils, Bernoulli would say this description is physically meaningless. A human mind cannot contain that much "moral value."

  He would likely insist that any legitimate gamble must be mapped back to physical resources (wealth, health, time), which are finite. If you force him to accept the payoffs as raw utils, he would argue you have stepped outside the domain of *human* choice, and thus outside the domain of his theory. His theory is about *men*, not angels or mathematical abstractions.

  ### 2. He would appeal to the "Natural Order" of Time
  The crux of the Pasadena paradox is the Riemann Rearrangement Theorem: because the series is conditionally convergent, you can reorder the terms to sum to anything. Theo argued this shows the expected utility is undefined.

  Bernoulli, however, was a physicist and a mathematician who thought about processes in time. In the Pasadena game, $n$ represents the *trial number* on which the coin first lands heads. This is a temporal sequence. You cannot experience trial 100 before trial 1.

  Bernoulli would likely argue that the "reordering" required to break the expectation is a mathematical artifact with no physical counterpart. In the *Specimen*, he treats the St. Petersburg game as a sequence of events. He would argue that the **natural ordering** ($n=1, 2, 3...$) is the only privileged ordering because it reflects the causal structure of the world.

  If you force the natural ordering, the alternating harmonic series $\sum \frac{(-1)^{n+1}}{n}$ converges to $\ln(2)$. Bernoulli would likely seize on this. He would say: *"The mathematician may shuffle the cards at will, but Nature does not shuffle time. The moral expectation is fixed by the order of events as they occur."* He would treat the other sums generated by rearrangement as mathematical ghosts, not valid expectations for a decision-maker.

  ### 3. He would invoke the "Finite Bank" Argument (Again)
  One of the most overlooked parts of Bernoulli's solution to St. Petersburg is that he didn't just rely on logarithmic utility. He also explicitly discussed the solvency of the "bank." He noted that no institution has infinite money, and if you cap the bank's resources, the expected value becomes finite immediately.

  He would apply the same logic to Pasadena. For the paradox to hold, the game must be playable *ad infinitum*. Bernoulli would point out that the universe has a finite lifespan, the coin will wear out, and the player will die.

  In *Specimen*, he is pragmatic. He is trying to price insurance contracts and maritime ventures. He would look at the Pasadena game and say: *"This is not a venture; it is a fantasy."* If you truncate the game at any finite $N$ (which you must, in reality), the sum is finite and well-defined. The paradox only exists in the limit of infinity. Bernoulli was willing to use infinity as a heuristic, but he was not willing to let it dictate rational choice in the physical world. He would likely classify Pasadena as a "mathematical curiosity" rather than a "choice object."

  ### 4. He would declare the Gamble "Indeterminate"
  Finally, if you cornered him and forced him to accept the infinite, conditionally convergent setup, Bernoulli has a retreat that preserves his theory: **Deny that an Expectation exists.**

  Bernoulli's goal was to define a *just price* for a risky venture. If the series does not converge absolutely, he could argue that there is no single "Moral Expectation." In the *Specimen*, he distinguishes between *Expectatio Mathematica* (which can be absurd) and *Expectatio Moralis* (which should guide choice).

  Faced with Pasadena, he might conclude that for this specific class of pathological gambles, *Expectatio Moralis* is undefined. This doesn't refute his theory; it just limits its domain. He would say: *"Expected utility is the criterion for rational choice **when a moral expectation can be determined.** In this case, the risk is so poorly structured that no rational price can be assigned."*

  This is actually a very robust position. It implies that rationality requires not just maximizing utility, but facing gambles that are *measurable*. If the measure doesn't stick (due to conditional convergence), the gamble is irrational to accept at *any* price, not because the price is infinite, but because the value is unknowable.

  ### The Verdict
  Theo is right that Pasadena breaks the *math* of Expected Utility Theory if you treat EUT as a universal, abstract axiomatic system (like von Neumann-Morgenstern did later). But Bernoulli wasn't building an axiomatic system; he was building a model of human behavior under risk.

  If you showed him Pasadena, he wouldn't throw away logarithmic utility. He would say:
  1.  **Utils must be grounded in physical wealth** (which is bounded).
  2.  **Time fixes the order of summation** (blocking rearrangement).
  3.  **Infinite games are not real choices** (blocking the limit).

  He would treat Pasadena not as a refutation, but as a *reductio ad absurdum* of treating decision theory as pure mathematics divorced from physical reality. He'd probably raise his glass to Theo, admit the math is clever, but insist that no sane merchant would ever offer such a contract, and therefore no sane merchant needs a theory to price it.

  **Your comeback for next time:** Tell Theo that Bernoulli would argue the Pasadena game violates the **preconditions of applicability** for Moral Expectation. It's not that EUT is wrong; it's that Pasadena isn't a "bet," it's a mathematical pathologies dressed up as one. Bernoulli's theory is for the real world, and in the real world, series don't get rearranged by demons, banks go bust, and humans die.
