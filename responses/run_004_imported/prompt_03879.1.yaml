      *   **Problem:** The expected utility sum is $\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$. This is the alternating harmonic series.
      *   **Mathematical Issue:** It converges conditionally, not absolutely. By the Riemann Rearrangement Theorem, reordering terms changes the sum.
      *   **Philosophical Issue:** Expected Utility is undefined. Since payoffs are already in *utils*, Bernoulli's logarithmic utility function ($U(w) = \ln(w)$) cannot compress the values further.

  3.  **Analyze Bernoulli's *Specimen Theoriae Novae*:**
      *   **Motivation:** He wasn't trying to build a universal axiomatic system for all rational choice (like von Neumann-Morgenstern). He was solving a specific problem: why do rational people reject the St. Petersburg gamble despite infinite expected *value*?
      *   **Key Concept:** *Emolumentum Medium* (Moral Expectation) vs. *Expectatio Mathematica* (Mathematical Expectation).
      *   **Utility Function:** He proposes $U(w) = b \ln(w/a)$. Wealth matters, not just face value. Diminishing marginal utility.
      *   **Finite Resources:** Bernoulli explicitly acknowledges that no bank has infinite money. He discusses the "banker's fortune."
      *   **Nature of the Gamble:** He treats the gamble as an exchange of current wealth for a prospect.
      *   **Epistemology:** He is a mathematician but also a physicist/physiologist. He cares about what is physically realizable and psychologically plausible.

  4.  **Simulate Bernoulli's Reaction to Pasadena:**
