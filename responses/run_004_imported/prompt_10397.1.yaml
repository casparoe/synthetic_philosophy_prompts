      *   *The Flaw:* It relies on a specific, controversial interpretation of acausal trade that even many TDT proponents reject. It assumes the AI would choose a policy of "punish non-helpers" rather than "reward helpers." Rewarding is cheaper and achieves the same goal. Punishment is only useful if it affects the decision *before* it's made. If you already didn't help, punishing you wastes resources. A UDT agent optimizes the *policy*, and a policy of "waste resources on futile punishment" is suboptimal ex-ante.

  5.  **Formulate the Response:**
