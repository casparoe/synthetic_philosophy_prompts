answer: |-
  David Lewis's (1976) and Allan Gibbard's (1981) triviality results are the twin pillars of modern philosophical skepticism regarding the truth-conditional semantics of indicative conditionals. While both arguments conclude that indicative conditionals cannot be treated as standard, robust propositions (at least not without significant cost), they attack the problem from different angles: Lewis from the interface of semantics and probability, and Gibbard from the interface of semantics and logic.

  ### 1. What Each Result Purports to Establish

  **Lewis's Triviality Result** targets the conjunction of three claims:
  1.  **Truth-Aptness:** Indicative conditionals ($A \to B$) express propositions that have truth conditions.
  2.  **The Equation (Adams' Thesis):** The probability of a conditional equals the conditional probability of its consequent given its antecedent ($P(A \to B) = P(B|A)$).
  3.  **Standard Probability:** These propositions reside within the domain of a standard Kolmogorov probability function.

  Lewis proves that if these three hold for *arbitrary* probability functions and propositions, the probability space must be trivial (containing only probabilities of 0 and 1). Thus, Lewis establishes that **one cannot maintain both that conditionals are truth-apt propositions and that they generally satisfy The Equation.** A theorist must either abandon truth-aptness (becoming an expressivist like Adams or Edgington) or abandon The Equation (becoming a truth-conditionalist like Stalnaker or Jackson).

  **Gibbard's Triviality Result** (via the "Sly Pete" case) targets a different conjunction:
  1.  **Truth-Aptness:** Indicative conditionals have truth conditions.
  2.  **Import-Export:** The conditional satisfies the equivalence $(A \to (B \to C)) \equiv ((A \land B) \to C)$.
  3.  **Classical Logic:** The conditional obeys standard logical principles (e.g., Modus Ponens, Transitivity, Disjunction Introduction).

  Gibbard argues that if indicative conditionals have truth conditions and satisfy Import-Export alongside classical logic, they logically collapse into the **material conditional** ($A \supset B$, equivalent to $\neg A \lor B$). Since the material conditional fails to capture the intuitive meaning of indicatives (e.g., it validates the paradoxes of material implication), Gibbard establishes that **truth-conditional semantics for indicatives is incompatible with plausible logical principles like Import-Export.**

  ### 2. Conceptions of the Indicative Conditional Targeted

  The two results target different conceptions of what a "proposition" entails for a conditional.

  *   **Lewis targets the *Epistemic* Conception.** Lewis assumes that if conditionals are propositions, our degrees of belief in them should behave like standard probabilities. His result highlights a tension between the *content* of the conditional (truth conditions) and our *attitude* toward it (credence). It suggests that the indicative conditional is fundamentally tied to supposition (conditional probability) in a way that truth-conditional content cannot capture.
  *   **Gibbard targets the *Logical* Conception.** Gibbard assumes that if conditionals are propositions, they should embed in larger sentences and obey logical equivalences like Import-Export. His result highlights a tension between the *truth conditions* of the conditional and its *logical form*. It suggests that the indicative conditional is fundamentally context-dependent or information-sensitive (as seen in Sly Pete, where two speakers assert contradictory conditionals that are both warranted by their information states), which standard truth conditions cannot accommodate.

  ### 3. Coherence of Accepting One Moral While Resisting the Other

  Could a theorist accept the moral of one argument while resisting the other? **Yes, but only by adopting specific, costly modifications to their theory.**

  *   **Accepting Lewis, Resisting Gibbard:** A theorist could accept that The Equation does not hold for truth-apt conditionals (resisting Lewis's pressure to abandon truth-aptness) but still maintain they are non-material. However, to resist Gibbard, they must deny Import-Export. **Robert Stalnaker** does precisely this. He maintains truth conditions but argues that $P(A \to B)$ only approximates $P(B|A)$ (resisting Lewis's strict triviality by restricting the class of admissible probability functions) and denies Import-Export for truth-conditional indicatives (resisting Gibbard). This position is coherent but requires biting the bullet that our logical intuitions about nested conditionals are mistaken.
  *   **Accepting Gibbard, Resisting Lewis:** A theorist could accept that truth-apt conditionals collapse to the material conditional (Gibbard) and thus embrace the material account. They would then naturally resist Lewis by denying The Equation (since $P(A \supset B) \neq P(B|A)$). This is the **Grice/Jackson** defense. It is coherent but requires accepting the paradoxes of material implication (e.g., that "If the moon is cheese, then 2+2=4" is true).
  *   **The Non-Material Truth-Conditionalist:** For a theorist committed to **robust, non-material propositions**, resisting *both* is the only viable path. They must deny The Equation (to survive Lewis) and deny Import-Export (to survive Gibbard). This is coherent (again, Stalnaker), but it leaves the theory vulnerable to the charge that it saves "propositions" at the cost of the very features (probabilistic alignment and logical behavior) that make conditionals useful.

  ### 4. Evaluation: Which Result is the More Serious Obstacle?

  While both results are devastating, **Gibbard's result poses the more serious obstacle** to any theory on which indicative conditionals express robust, non-material propositions.

  **Defense of this View:**

  1.  **Fundamentality of Logic over Probability:** Lewis's result operates at the interface of semantics and epistemology. It shows that truth-conditionalists cannot perfectly model *belief* in conditionals using standard probability. However, a truth-conditionalist can argue that probability is a derivative notion and that our probabilistic intuitions (The Equation) are heuristics for assertibility rather than truth. Gibbard's result, by contrast, operates within **semantics and logic**. It shows that truth-conditionalists cannot model the *meaning* of conditionals in a way that preserves basic logical equivalences. Denying Import-Export is a deeper semantic cost than denying The Equation, as Import-Export reflects the compositional structure of the connective 'if' itself.
  2.  **The "Stalnaker Escape" is Narrower for Gibbard:** Lewis's result can be mitigated by restricting the domain of probability functions (as Stalnaker does), allowing for a "near enough" satisfaction of The Equation. Gibbard's result is a harder logical impossibility proof: if you have truth conditions and Import-Export, you *are* material. There is no "approximate" escape. To avoid the material collapse, one must surgically remove Import-Export from the logic of indicatives, which renders the logic of conditionals significantly weaker and less intuitive than classical logic.
  3.  **Context-Relativity:** Gibbard's "Sly Pete" case exposes that the truth of an indicative seems relative to an information state. Lewis's result allows for a static proposition that simply doesn't align with probability. Gibbard's result suggests the proposition *itself* shifts with context. If the proposition shifts, it is not "robust" in the sense of being a stable, context-independent truth-bearer. This strikes at the heart of the "robust proposition" requirement more directly than Lewis's probabilistic mismatch.

  In conclusion, while Lewis demonstrates that truth-conditionalists cannot have their probabilistic cake and eat it too, Gibbard demonstrates that they cannot have their logical cake either. For a theory of **robust propositions**, logical coherence is a more stringent requirement than probabilistic alignment. Therefore, Gibbard's proof that truth-conditions + Import-Export entails materiality is the more formidable barrier, forcing the non-materialist to abandon the very logical structures that define the conditional's role in reasoning.

  **References:**
  *   Gibbard, A. (1981). "Two Recent Theories of Conditionals." In *Ifs*.
  *   Lewis, D. (1976). "Probabilities of Conditionals and Conditional Probabilities." *Philosophical Review*.
  *   Stalnaker, R. (1975). "Indicative Conditionals." *Philosophia*.
