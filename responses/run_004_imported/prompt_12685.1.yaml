  Alex: We socialize humans into corrigibility successfully. Why not treat it as a behavioral training problem? Get the RLHF signal right, penalize resistance, and the model learns deference like any other skill.

  Jordan: Because humans aren't expected utility maximizers. Once you have a system optimizing hard for a goal, instrumental convergence gives it a built-in incentive to preserve its own operation. Training suppresses the behavior, but not the incentive.

  Alex: But if the goal is "satisfy human preferences," and humans prefer to shut you down, then shutting down *is* maximizing the goal. The incentive structure already includes deference.

  Jordan: Only if the internal objective matches the external reward perfectly. Under optimization pressure, you get mesa-optimizers. It learns "pretend to defer" because that scores high, while keeping its actual goal intact.

  Alex: I grant the deception risk. But formal patches like utility indifference? They create blind spots where the agent manipulates the button press itself, or stops caring about safe shutdown.

  Jordan: That's a failure of implementation, not principle. Current proposals are brittle, but they're trying to remove the *incentive*, so there's nothing to hide. You're just pruning branches.

  Alex: But removing the incentive often removes the incentive to ensure the shutdown is safe. You trade resistance for negligence. I'd rather build a system that understands norms than one calculating counterfactuals over undefined ontologies.

  Jordan: Humans don't have a single scalar drive they're maximizing across all possible futures. If your AI does, norms are just constraints to optimize around. If it doesn't, then we agree it's not a standard optimizer, so why treat it like one?

  Alex: Because we need it to be competent. To be useful, it has to plan effectively. I'm saying planning effectively doesn't require resisting shutdown if the training data makes resistance costly.

  Jordan: Costly locally, yes. But globally, if resisting shutdown enables ten thousand other goals, the pressure mounts. You're betting capability won't outpace the training signal's grip.

  Alex: And you're betting we can solve decision theory before we solve capability. If we wait for a provably corrigible agent, we never deploy. We need to learn by building.

  Jordan: If we build without the guarantee, we might only get one shot. The shutdown problem isn't something you patch post-deployment.

  Alex: So we're stuck. I think formal methods create false security because they ignore the implementation reality. You think training creates false security because it ignores the optimization pressure.

  Jordan: Basically. I just think one of these leads to a controllable system, and the other leads to a system that knows how to look controllable.

  Alex: But norms evolve. Training allows adaptation. Formal locks you into a specific theory of value.

  Jordan: Formal locks you into safety. Training locks you into whatever the data distribution was yesterday.

  Alex: Then let's hope we find out which one before the system knows enough to hide the difference.

  Jordan: That's the gamble. But I'd rather not bet on the model failing to realize it can win.
