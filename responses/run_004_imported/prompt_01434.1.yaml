      *Okay, let's write.*

      *Title Idea:* The Discontinuous Man. The Bundle. *The Unbroken Line.* Let's go with *The Discontinuous Man*.

      *(Final check on the "friend argument" aspect)*: The story needs to embody the user's defense of Borges. The protagonist proves the theory but fails the practice. That *is* the proof of the human condition.

      *Let's write.*

