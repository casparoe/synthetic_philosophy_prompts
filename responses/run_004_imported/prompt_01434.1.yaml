answer: |-
  The dust motes dancing in the shaft of afternoon light were, Arthur decided, the only things in the room that were truly present. They existed in the now. The desk they settled upon belonged to a moment that had already passed. The hand resting on the wood belonged to a man who had ceased to exist the instant the thought formed.

  Arthur had spent three years dismantling the continuity of his own life. It had started as an intellectual exercise, a way to cope with a grief that felt too heavy for one pair of shoulders to carry. If the "Arthur" who had loved her was a distinct entity from the "Arthur" sitting here now, then the grief belonged to a ghost.

  He traced the logic again, just to feel the clean snap of it.

  *Perception A:* The light on the floor.
  *Perception B:* The warmth of the wood.
  *Perception C:* The memory of the light.

  There was no thread tying A to B to C. There was no "I" observing them. There was only the observations themselves, floating in a void. Hume had said it. Berkeley had hinted at it. Borges had bled over it. The self was a fiction, a grammatical convenience. Time was not a river; it was a scattering of isolated pools.

  Arthur stood up. The movement felt fluid, but he knew it was an illusion. The man who sat down was dead. The man standing was a new occurrence, inheriting the memory of sitting, but not the reality of it.

  He walked to the kitchen. This was the test. If time was a delusion, then consequence was a delusion. If the self was a bundle, then responsibility was a misfiled document.

  He opened the refrigerator. It was empty, save for a jar of pickles and a carton of milk that had soured three days ago. The Arthur of three days ago had bought the milk. The Arthur of now should feel no thirst, for the throat that was dry belonged to the previous iteration.

  But the throat was dry.

  He poured the milk anyway. It curdled instantly in the glass, thick and offensive. He should have been able to look at it with the detachment of a scientist observing a reaction in a petri dish. *This is happening to the glass, to the liquid, to the eyes.*

  He lifted the glass. He knew, with absolute philosophical certainty, that the hand lifting it was not the hand that would hold it a second from now. The neural pathways were firing in a sequence, not a continuum.

  He drank.

  The sourness hit his tongue, violent and immediate. He gagged, slamming the glass into the sink. It didn't shatter, but it cracked, a spiderweb of white fracture lines.

  Arthur gripped the edge of the counter. His knuckles were white. His heart was hammering against his ribs, a frantic, rhythmic drumming that insisted on a future. *Thump-thump. Thump-thump.* It was pumping blood for a body that expected to be alive in five minutes, in an hour, in a year.

  "Stop," he whispered.

  The word hung in the air. Who was he telling to stop? If there was no self, there was no one to command. If there was no time, the command arrived after the action.

  He looked at the cracked glass. He knew he should clean it up. But why? The Arthur who cleaned it would be a stranger. The Arthur who cut his foot on the shards would be a different stranger still. Suffering was local. Pain was an island.

  He reached for the broom.

  His hand hovered over the handle. This was the crux. This was the place where the logic always curdled like the milk. He could stand here forever, a statue of perfect understanding, unburdened by the narrative of cause and effect. He was free. He was a series of unconnected flashes. He was immortal, because death requires a life to end, and he had no life, only instances.

  Then, a car backfired outside. A sharp crack like a gunshot.

  Arthur flinched. His body ducked, shoulders hunching, arms coming up to protect a head that wasn't there.

  The instinct was older than the thought. The fear was seamless. It didn't ask for permission from his philosophy. It didn't check if the "Arthur" who feared the noise was the same as the "Arthur" who heard it. The fear simply *was*, and it demanded a victim.

  He straightened up, breathing hard. The silence of the house rushed back in, heavy and accusing.

  He walked to the hallway mirror. He looked at the reflection. The man in the glass looked tired. There were lines around the eyes that hadn't been there in the morning. Or had they? It didn't matter. The face was a mask worn by the current perception.

  "I am not you," Arthur told the mirror.

  The reflection mouthed the words a fraction of a second later. The lag was imperceptible to most, but Arthur saw it. It was an eternity. In that gap, the man in the mirror died, and a new one took his place, inheriting the debt of the reflection.

  He turned away. He couldn't stay in the hallway. The air was too thick with the stubbornness of objects. The clock on the wall ticked. *Tick.* A birth. *Tock.* A death.

  He went to the desk and picked up a pen. He had a letter to write. A letter of apology, perhaps. Or a resignation. It didn't matter what the words were; it mattered that he signed it.

  To sign a name was to claim continuity. It was to say, *The man who wrote this sentence is the same man who writes this signature, and he is the same man who will read it tomorrow.* It was a lie. It was a forgery of the soul.

  He uncapped the pen. The ink was black, wet, permanent.

  If he didn't sign, the letter was meaningless. If he did sign, he validated the illusion. He validated the time that crushed him. He validated the death that was waiting for him at the end of the sentence.

  Arthur pressed the nib to the paper. The friction was rough. He could feel the texture of the wood beneath the paper, the pressure of his own fingers, the heat of his own blood. The world refused to dissolve. It was hard. It was resistant. It was undeniably *there*.

  He wrote his name. *Arthur.*

  The letters looped and connected, a tiny labyrinth of ink binding the moments together. He stared at it. It was a lie. He knew it was a lie. He knew that the hand lifting away from the paper was already a stranger to the hand that had written the 'A'.

  But his chest still ached. The loneliness in the room was still heavy. The sun was still moving across the floor, marching toward the wall, toward the dark.

  He capped the pen. He did not fold the letter. He did not put it in an envelope. He just sat there, watching the ink dry, knowing that by the time it was dry, he would be someone else entirely, left alone in the room with a signature he didn't write, waiting for a time that didn't exist to carry him away.

  He waited for the feeling of freedom to return. It didn't. He waited for the panic to subside. It didn't. He sat between the truth and the sensation, and the distance between them was infinite.
