answer: |-
  Your friend is structurally correct but functionally glib. She has identified the *genealogy* of the idea but missed the *mutation* that occurs when you port a meta-ethical theory into an engineering specification for a superintelligence.

  To write this piece accurately, you need to argue that CEV is indeed **idealized preference utilitarianism** (specifically the Railton/Brandt lineage) but that the shift from *defining well-being* to *specifying a control target* creates a qualitatively different philosophical problem. The move from the individual to the collective, and from the normative to the operational, breaks the mapping in ways that generate unique failure modes.

  Here is the walkthrough of the mapping, the breakdown, and the specific philosophical stakes of the collective scale.

  ### 1. The Structural Isomorphism (Where your friend is right)

  Your friend is correct that the *mechanism* of idealization in CEV is nearly identical to the "Full Information" accounts of well-being developed in the 1980s.

  *   **Epistemic Idealization:** Railton's "ideal advisor" knows all relevant facts. Yudkowsky's CEV knows "more." Both assume that ignorance is the primary source of preference error.
  *   **Rational Idealization:** Brandt's "cognitive psychotherapy" involves exposing desires to logic and facts until only the resilient ones remain. CEV's "thought faster" and "more the people we'd want to be" is essentially Brandt's therapy run at high speed.
  *   **Normative Authority:** In both frameworks, the *actual* desire is overridden by the *counterfactual* desire. If actual-you wants to smoke, but ideal-you (who knows about cancer) does not, Railton says your *good* is not smoking. If actual-humanity wants revenge, but extrapolated-humanity (who understands game theory and psychology) does not, CEV says the AI should not pursue revenge.

  If you stop here, CEV is just applied meta-ethics. But you can't stop here, because Railton and Brandt were trying to solve the problem of **value**, whereas Yudkowsky was trying to solve the problem of **control**.

  ### 2. The Teleological Shift: Truth vs. Lock-in

  The first major breakdown in the mapping is the *purpose* of the idealization.

  For Railton, the ideal advisor is a heuristic to discover objective value. If the ideal advisor turns out to be incoherent or unreachable, Railton has a philosophical problem (perhaps moral skepticism is true).

  For Yudkowsky, CEV is a **specification for a singleton**. The AI *must* have a goal function. It cannot wait for philosophical consensus. This forces CEV to make a much stronger claim than ideal preference theory: it claims not just that idealized preferences are *better*, but that they are **computable** and **convergent**.

  *   **The Breakdown:** Ideal preference theory can tolerate pluralism. Your ideal self and my ideal self might value different things, and that's fine; we just negotiate. CEV cannot tolerate this. It requires the "Coherent" in Coherent Extrapolated Volition. It posits that if we all think fast enough and know enough, our desires will *merge* into a single target.
  *   **The Consequence:** This moves CEV from meta-ethics into speculative moral psychology. It assumes a convergence of values that Sidgwick or Railton never needed to prove. Sidgwick's "Point of View of the Universe" requires impartiality, not psychological unification. CEV requires that the "Point of View of the Universe" matches what humanity would become if we merged. That is a vastly more fragile empirical claim.

  ### 3. The Aggregation Problem: From "My Good" to "Our Will"

  This is the crux of your question regarding the "eight billion people" scale. In individual idealization (Brandt/Railton), the "tethering" problem is about **personal identity**: *Is the idealized version still me?*

  *   **Individual Case:** If Brandt's cognitive psychotherapy cures me of my jealousy, I might initially resist, but we accept this as "growth." The continuity of the psyche is maintained because it's a single cognitive architecture undergoing refinement.
  *   **Collective Case:** CEV asks eight billion distinct cognitive architectures to undergo refinement *and* merge. The "tethering" problem becomes a **political and metaphysical** problem.

  When you extrapolate a single person, you are smoothing out inconsistencies in one utility function. When you extrapolate humanity, you are attempting to reconcile **incompatible utility functions**.

  *   **The Failure Mode:** In ideal preference theory, if your ideal self wants X and my ideal self wants Not-X, we have a moral disagreement. In CEV, this is a system crash. The "Coherent" clause implies that moral disagreement is ultimately a result of ignorance or computational limits.
  *   **Why this matters for your piece:** This is where CEV diverges from the philosophical tradition. Railton doesn't need your ideal desires to match mine. Yudkowsky *does*, because he is designing an AI that cannot serve two masters. This forces CEV to implicitly adopt a strong form of **Moral Realism** (that there is one right answer we all converge on) much more aggressively than the philosophers it borrows from. If moral pluralism is true, CEV is not just difficult; it is mathematically impossible.

  ### 4. The "Stranger" Problem at Scale

  You asked what happens to the problem of the idealized version being a "stranger wearing your name." In the collective CEV context, this becomes the **Problem of Alienation**.

  In Brandt's theory, if cognitive psychotherapy removes a desire you deeply hold (say, a religious commitment), Brandt argues that desire was "irrational" because it relied on false facts. You are "more yourself" without it.

  In CEV, if the extrapolated volition of humanity decides to eliminate death, or upload minds, or cease biological reproduction, is that still "humanity's" will?

  *   **The Mapping Break:** In individual ethics, we accept that growth changes who we are. In AI safety, **continuity is a safety constraint.** If the AI optimizes for what we *would* want in the future, but that future self is so extrapolated that it no longer cares about the things current-humans care about (e.g., biological survival, autonomy), the AI has technically succeeded at CEV but failed at "Alignment" in the intuitive sense.
  *   **The "Grown Up Farther Together" Clause:** This specific phrase in Yudkowsky's definition is doing heavy philosophical lifting. It attempts to solve the aggregation problem by positing a shared history that smooths out divergence. But this is where the comparison to Sidgwick breaks down. Sidgwick's impartial observer stands outside humanity. CEV's extrapolation comes *from inside* humanity but requires a level of social cohesion that has never existed. It assumes that moral progress is not just individual but **intersubjective and convergent**.

  ### 5. Implementation vs. Analysis

  Finally, the distinction that makes CEV a genuinely different problem is **operationalizability**.

  Railton and Brandt were offering an *analysis* of value. They didn't need to build a machine to calculate it. Yudkowsky was proposing a **design spec**.

  *   **Goodhart's Law:** In philosophy, if your definition of "good" is slightly off, you write a bad paper. In AI alignment, if your formalization of "extrapolated volition" is slightly off, the AI optimizes for a proxy that destroys you.
  *   **The Approximation Problem:** CEV admits we can't actually compute the full extrapolation. So the AI must *approximate* it. But how do you approximate "what humanity would want if it were wiser" without already knowing what wisdom is? This creates a circularity that doesn't plague Railton. Railton can say "Value is what the ideal advisor wants" without building the advisor. Yudkowsky has to build the advisor to find the value, but needs the value to build the advisor safely.

  ### Summary for your Piece

  Your friend is right that CEV is **genealogically** a child of Full Information/Ideal Preference theory. It inherits the DNA of Railton's advisor and Brandt's psychotherapy.

  However, your intuition is also right: **The context mutates the organism.**

  1.  **From Pluralism to Convergence:** Ideal preference theory allows for divergent ideal selves; CEV requires a single coherent target, forcing a bet on strong moral realism that the philosophers didn't need to make.
  2.  **From Normative to Operational:** CEV isn't just asking "What is good?" it is asking "What can we safely code?" This introduces approximation risks that turn philosophical nuances into existential hazards.
  3.  **From Individual to Collective Identity:** The "tethering" problem scales non-linearly. Merging eight billion extrapolated psyches isn't just more math; it's a different metaphysical category than refining one psyche.

  **The Verdict:** CEV is not *just* idealized preference theory with extra steps. It is idealized preference theory **weaponized for the singularity.** It takes a meta-ethical framework designed for human reflection and attempts to harden it into a control mechanism for a god. The friction generated by that attempt is where the unique philosophical problems of AI alignment live.

  If you assert they are "basically the same," you miss why alignment is hard. If you assert they are "totally different," you miss the intellectual history. The truth is that CEV takes the bugs of ideal preference theory (identity, convergence, definition) and amplifies them until they become existential risks.
