          3.  **FEO Distinction:** Rawls's FEO is about removing barriers to social positions, not equalizing prediction errors. The ML metric named "Equality of Opportunity" is a misnomer from a Rawlsian view.
          4.  **Basic Structure:** The legal system is part of the basic structure. The impossibility theorem reveals that "Calibration" is not a neutral default; it is a choice that sacrifices error balance. Rawls would argue that a system choosing Calibration over Error Balance fails to protect the liberty of the least advantaged.

  7.  **Drafting the Response (Iterative refinement):**

