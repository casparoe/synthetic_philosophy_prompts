      *   *The Least Advantaged:* In the COMPAS context, this likely correlates with the group facing higher base rates of reoffending (often due to structural injustice), frequently racial minorities.

  3.  **Evaluate the Competing Metrics through a Rawlsian Lens:**

      *   **Calibration:** "If you get a score of 7, 70% of people with score 7 reoffend, regardless of race."
          *   *Pros:* Epistemic accuracy. Efficient use of information.
          *   *Cons:* If base rates differ due to structural injustice, calibration might perpetuate that injustice. It treats the *prediction* as fair, even if the *input data* reflects historical oppression.
      *   **Equal False Positive Rates (FPR):** "The rate at which non-reoffenders are flagged high risk is the same across races."
          *   *Pros:* Protects the innocent from being wrongly detained. Aligns with liberty interests.
          *   *Cons:* Might require lowering thresholds for the higher-risk group, potentially increasing actual recidivism (public safety risk).
      *   **Equal False Negative Rates (FNR):** "The rate at which reoffenders are flagged low risk is the same across races." (Often called "Equality of Opportunity" in ML literature).
          *   *Pros:* Ensures dangerous individuals aren't let out disproportionately based on race.
          *   *Cons:* To equalize FNR when base rates differ, you often have to increase FPR for the lower-base-rate group or decrease it for the higher-base-rate group in ways that might disadvantage the already disadvantaged.
      *   **Demographic Parity:** "The % flagged high risk is the same across races."
          *   *Rawlsian view:* Likely too crude. Ignores actual risk, potentially endangering public safety or detaining the innocent just to hit a quota.

