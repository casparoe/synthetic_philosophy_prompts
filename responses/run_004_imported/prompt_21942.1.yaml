      *   *Rawls's FEO:* This is about *social positions* and *life prospects*, not about equalizing error rates in a predictive model. Rawls wants to neutralize the effects of social contingency on *ambition and ability*, not on *prediction errors*.
      *   *Verdict:* Rawls would likely reject the ML definition as a "narrow and potentially misleading fragment." It focuses on the efficiency of classification regarding a negative outcome (reoffending) rather than the distribution of liberty and opportunity. In fact, equalizing FNR might lead to higher detention rates for the group with higher base rates, worsening their position.

