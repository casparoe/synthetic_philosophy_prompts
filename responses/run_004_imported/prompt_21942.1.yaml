      *   *The First Principle:* Equal basic liberties. (Less directly relevant to statistical metrics, but liberty is at stake in incarceration).
      *   *The Second Principle:*
          *   (a) Fair Equality of Opportunity (FEO): Positions open to all, but also correcting for social contingencies.
