answer: |-
  You are correct, and your friend is overlooking a critical premise. Your intuition is philosophically sound: **Aumann's Agreement Theorem does not follow from rationality and common knowledge alone.** It crucially depends on the **Common Prior Assumption (CPA)**.

  Without the CPA, the theorem collapses. Two perfectly rational Bayesians who trust each other's rationality and have common knowledge of each other's opinions can absolutely agree to disagree if they started with different priors.

  Here is a detailed comparison of the assumptions, an analysis of whether the CPA is entailed by rationality, and what this implies for the philosophical weight of the slogan.

  ---

  ### 1. Comparing the Two Assumptions

  To understand why your friend's framing is incomplete, we must distinguish the epistemic role of the two main conditions in Aumann's theorem.

  **A. Common Knowledge of Posteriors**
  *   **What it is:** This is a condition about the *current* state of information transparency. It means I know your probability estimate, you know mine, I know that you know mine, ad infinitum.
  *   **Function:** This prevents us from hiding information from each other. It ensures that any difference in our beliefs cannot be blamed on "I know something you don't." It forces our information sets to be effectively pooled.
  *   **Nature:** This is an **epistemic/communicative** condition. It is about the flow of information between agents.

  **B. The Common Prior Assumption (CPA)**
  *   **What it is:** This is a condition about the *initial* state of the agents before they received any private evidence. It asserts that if we had been born with the exact same information, we would have assigned the exact same probabilities to every event.
  *   **Function:** This ensures that we process evidence identically. It guarantees that if we have the same information, we will have the same beliefs. It turns belief differences into a pure function of information differences.
  *   **Nature:** This is a **structural/metaphysical** condition. It is about the cognitive architecture and interpretive framework of the agents.

  **The Interaction:**
  Aumann's proof works like this: If we have a **Common Prior**, our posteriors are just that prior updated on our specific information partitions. If we have **Common Knowledge of Posteriors**, we effectively know each other's information partitions. If we know each other's partitions and share a prior, the math forces our posteriors to converge to the same value (the expectation of the expectation is the expectation).

  If you remove the Common Prior, the math breaks. If I start with Prior A and you start with Prior B, we can both update perfectly on the fact that we disagree, and yet remain disagreed, because we weight the evidence differently.

  ### 2. Is the Common Prior Assumption Entailed by Rationality?

  **The short answer is no.**

  In standard Bayesian epistemology, "rationality" is defined as **coherence**. To be rational is to obey the axioms of probability (no Dutch Books) and to update via conditionalization. This is often called *Subjective Bayesianism*. Under this framework, priors are subjective. As long as your prior is coherent (sums to 1, non-negative, etc.), it is rational.

  Therefore, a perfectly rational Bayesian agent can reject the Common Prior Assumption without any loss of rationality.

  **The Harsanyi Doctrine**
  The claim that rational agents *ought* to have the same priors is a specific philosophical commitment known as the **Harsanyi Doctrine** (named after John Harsanyi, whose work underpins Aumann's).
  *   **The Doctrine:** Differences in belief should be attributed solely to differences in information, not differences in prior probability assessments.
  *   **The Argument:** Proponents argue that differing priors are arbitrary. If two agents are truly rational, they should reason from an "impartial" standpoint (like a Veil of Ignorance) that yields a unique, objective prior.
  *   **The Counter-Argument:** Many epistemologists argue that evidence underdetermines theory. There may be no unique "correct" prior. Reasonable people might weigh simplicity differently against fit, or have different foundational intuitions about the structure of the world.

  If you are a *Subjective Bayesian*, the Harsanyi Doctrine is an extra constraint you are free to reject. If you are an *Objective Bayesian*, you might accept it, but that is because you have already committed to a specific, controversial theory of probability, not because "rationality" *simpliciter* demands it.

  ### 3. Implications for the Slogan's Philosophical Weight

  The popularized slogan—"Two honest Bayesians cannot agree to disagree"—is often wielded in rationalist communities (like LessWrong) as a normative hammer to force consensus. The implication is: *"If we disagree, one of us is being irrational, hiding information, or lying."*

  Your analysis reveals that this slogan bears significantly less philosophical weight than is often claimed.

  **1. It Shifts the Burden from Information to Architecture**
  If the CPA is not entailed by rationality, then persistent disagreement between rational agents is possible. It implies that disagreement can be **fundamental** rather than just **informational**.
  *   *Informational Disagreement:* "I saw the data, you didn't." (Aumann solves this).
  *   *Fundamental Disagreement:* "We saw the same data, but your model interprets noise as signal, while mine interprets it as noise." (Aumann does not solve this).

  **2. It Limits the Normative Force**
  The theorem is often used to suggest that rational agents *must* converge. In reality, it suggests that rational agents *with the same cognitive starting point* must converge.
  If I believe that your prior is "wrong" (e.g., you are too skeptical of miracles, or too skeptical of quantum mechanics), Aumann's theorem gives me no leverage to force you to change your mind. I cannot say, "Your rationality requires you to agree with me." I can only say, "Your rationality requires you to agree with me *if you accept my prior*."

  **3. It Highlights the "Prior Problem"**
  The most difficult part of Bayesian reasoning is not updating (the math is easy); it is setting the prior. By hiding the CPA behind the label of "rationality," pop-rationalism obscures the hardest problem in epistemology.
  Acknowledging that the CPA is a contestable premise forces us to ask: *Why do we have different priors?*
  *   Is it cultural conditioning?
  *   Is it evolutionary bias?
  *   Is it genuine philosophical divergence?

  Aumann's theorem cannot answer these questions. It simply assumes them away.

  ### 4. Verdict on the Argument

  You win the argument, but with a nuance that might save face for your friend.

  *   **Logically:** You are right. The theorem *requires* the Common Prior Assumption. It does not follow from rationality and common knowledge alone. A rational agent can reject the CPA.
  *   **Normatively:** Your friend might be arguing that we *should* strive for common priors. Many rationalists treat the Harsanyi Doctrine as a regulative ideal: "Even if we don't have the same priors, we should act *as if* we do to facilitate cooperation." This is a pragmatic stance, not a logical necessity.

  **Conclusion**
  The slogan "rational agents cannot agree to disagree" is a half-truth. The accurate slogan is: **"Rational agents who interpret evidence identically cannot agree to disagree."**

  By eliding the "interpret evidence identically" clause (the Common Prior), the popularized version smuggles in a massive, controversial epistemological assumption and dresses it up as a trivial consequence of logic. Recognizing this doesn't invalidate Aumann's theorem—it is still a profound result in game theory and epistemology—but it does deflate its utility as a tool for settling real-world arguments where priors are rarely common.

  Your skepticism is well-founded. The Common Prior Assumption is not a law of logic; it is a philosophical wager.
