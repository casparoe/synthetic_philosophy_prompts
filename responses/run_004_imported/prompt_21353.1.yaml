      *   **Core Claim:** The Identity of Indiscernibles (PII) is just Leibniz's Law (the Indiscernibility of Identicals) and is analytic/trivial (like "all bachelors are unmarried").
      *   **Argument:** If two things share *every* property, they are by definition one thing. Therefore, Max Black's two spheres scenario is incoherent because it stipulates "two spheres" while denying them distinguishing properties.
      *   **Confusion:** Why do philosophers treat PII as a substantive, debatable metaphysical principle rather than a logical truth? Why is Black's counterexample taken seriously?
      *   **Tone:** Frustrated but curious, confident in their logical intuition, looking for clarification on the distinction they're missing.

  2.  **Identify the Key Philosophical Distinction:**
