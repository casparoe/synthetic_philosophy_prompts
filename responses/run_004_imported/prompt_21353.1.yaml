      *   **Correct the Terminology:** Distinguish between the *Indiscernibility of Identicals* (II) and the *Identity of Indiscernibles* (PII). This is the most important step.
          *   II: $x=y \rightarrow \forall P (Px \leftrightarrow Py)$. (Uncontroversial).
          *   PII: $\forall P (Px \leftrightarrow Py) \rightarrow x=y$. (Controversial).
      *   **Explain the "Property" Problem:** The debate hinges on what counts as a "property."
          *   *Impure/Individual Properties:* "Being identical to $a$." If these count, PII is trivial (as the user thinks).
          *   *Pure/Qualitative Properties:* "Being red," "Being 1 mile from sphere B." If these count, PII is substantive.
      *   **Analyze Black's Spheres:**
