      *   *Principle 1: Indiscernibility of Identicals (II).* If $x = y$, then $x$ and $y$ share all properties. (Logical truth, analytic, uncontroversial).
      *   *Principle 2: Identity of Indiscernibles (PII).* If $x$ and $y$ share all properties, then $x = y$. (Metaphysical principle, synthetic, controversial).
      *   *The User's Error:* They think PII is just the converse of II, or that II *entails* PII by definition of "identity." They don't see how "sharing all properties" could fail to imply "being the same object."

  3.  **Deconstruct Max Black's Counterexample:**
      *   Black's universe: Two iron spheres, same material, size, shape, color, temperature, etc. Symmetrical universe (no external reference points).
      *   The Challenge: Do they share *all* properties?
      *   The Crucial Property: "Being identical to sphere A" vs. "Being identical to sphere B."
      *   *Haecceity/Thisness:* If we allow properties like "being this specific sphere," PII is trivially true but uninformative.
      *   *Qualitative Properties:* If we restrict properties to *qualitative* ones (intrinsic + relational, but not primitive thisness), then the spheres *do* share all properties.
      *   *The Stakes:* Is there a metaphysical ground for numerical diversity without qualitative difference?

  4.  **Formulate the Explanation:**
