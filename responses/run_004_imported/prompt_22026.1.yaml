answer: |-
  1. **The Elasticity of "Sound Deliberation"**
     Your catchphrase is that the question is whether sound deliberation *could* get you there, not whether it already has. But if "sound deliberation" is permitted to correct factual errors, employ imagination, and draw inferences that weren't initially explicit, doesn't the Subjective Motivational Set become so porous that internalism becomes extensionally equivalent to externalism? In practice, is there any action a reasonable externalist says you have a reason to do that your "sound deliberative route" wouldn't eventually validate, rendering the distinction unfalsifiable?

     *Follow-up (Anticipating her reply that coherence constraints limit the elasticity):* If coherence is the constraint, where does the normativity of coherence come from? If an agent's SMS is coherently structured around a desire to be cruel, internalism seems to validate that route; if you say that route is "unsound" despite its coherence, aren't you appealing to an external standard of what counts as a good deliberative process?

  2. **Instrumentalism vs. Value Discovery**
     Williams insists that deliberation isn't merely instrumental; it can involve discovering new values, not just satisfying old ones. But how do we distinguish between *discovering* a value that was implicitly in the SMS and *acquiring* a new one that wasn't there before? If the latter is possible through deliberation, what prevents this from being a backdoor for external reasons to enter the set under the guise of "discovery"?

  3. **The Amoralist Challenge**
     Consider the classic amoralist: someone with no other-regarding elements anywhere in their psychology, not even implicitly. On your view, is this agent committed to the claim that such a person strictly has *no reason* to refrain from cruelty, as opposed to merely being unpersuadable or irrational? If the answer is "no reason," does this not make the normativity of morality contingent on psychological luck in a way that undermines its critical force?

     *Follow-up (Anticipating her reply that yes, he has no reason, but we can still criticize him):* If he has no reason, in what sense is our criticism normative rather than merely coercive or manipulative? If we cannot appeal to a reason he *has*, are we not just threatening him or trying to hack his psychology, rather than engaging in moral argument?

  4. **The Scope of Moral Argument**
     If reasons are internal, how do you characterize the activity of moral philosophy itself? When we debate ethical issues, are we trying to discover agent-independent truths, or are we essentially engaging in a sophisticated form of rhetoric aimed at altering each other's Subjective Motivational Sets? Does this reduce the philosopher to a kind of therapeutic engineer?

  5. **Williams's Gin/Petrol Case**
     Williams argues that if a man wants to drink what he thinks is gin but is actually petrol, he has no reason to drink it, even if he believes he does. This ties reasons to *true* beliefs. But isn't the requirement to base deliberation on "true beliefs" itself a normative standard that isn't sourced in the agent's prior motivations? If the agent doesn't care about truth, why is the "sound" route the one that tracks reality rather than the one that satisfies his desire for comfort?

     *Follow-up (Anticipating her reply that truth is a condition of success, not a motivation):* But the *obligation* to track truth during deliberation seems to be a categorical requirement of rationality. If that requirement isn't grounded in the SMS, haven't you admitted at least one external reason—the reason to be rational—which then threatens to drag the rest of externalism back in with it?

  6. **The Modal Strength of "Could"**
     You rely heavily on the claim that an agent *could* arrive at a motivation via sound deliberation. How idealized is this "could"? If we idealize the agent's knowledge and rational capacities too much to make the theory work, does the resulting "agent" cease to be the actual person we intended to evaluate, effectively severing the link between reasons and the agent's actual psychology?

  7. **Criticizing Deliberative Failures**
     Internalism seems to allow us to say someone is making a deliberative mistake—for example, ignoring relevant facts or reasoning fallaciously. But what grounds the criticism of the deliberative process itself? If an agent's SMS includes a preference for wishful thinking, is it "unsound" for them to indulge it, or is that just who they are? Where do you get the leverage to call a deliberative route "bad" without an external norm?

  8. **The Rationalist Rejoinder (Korsgaard)**
     Critics like Korsgaard argue that the demand to deliberate soundly looks like an unconditional requirement on the agent, rather than something grounded in her actual motivational set. If you resist this by saying the demand to deliberate comes from the SMS itself, don't you face a regress? And if you stop the regress by saying agency itself requires it, aren't you helping yourself to exactly the kind of agent-independent standard internalism was designed to avoid?

     *Follow-up (Anticipating her reply that agency is constitutive and not optional):* If agency is constitutive, does that mean one can opt out of having reasons entirely by opting out of agency? If so, does internalism ultimately lack the resources to condemn the person who rejects rationality altogether, since they have, by definition, no reasons to listen to you?

  9. **The Role of Imagination**
     You allow that imagination can expand the SMS by allowing us to vividly grasp the experiences of others. But if imagination can generate entirely new motivations that were not previously latent, how is this different from the externalist claim that simply recognizing a fact (e.g., "this causes pain") can generate a reason? At what point does imaginative expansion become a mechanism for importing external values?

  10. **Fidelity to Williams**
      Bernard Williams revised his own views on internal reasons in the years following his 1981 paper, particularly regarding the role of the "social self." Does your defense stick to the original 1981 formulation, or do you incorporate his later concessions? If the latter, do those concessions weaken the hardline internalist stance you are defending today?
