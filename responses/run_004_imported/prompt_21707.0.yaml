      *   *The "Self-Indication Assumption" Rebuttal to DA:* Ironically, SIA was originally proposed *specifically* to rebut the Doomsday Argument. SIA says: "Yes, being early is unlikely in a long world, BUT a long world has more people, so I'm more likely to exist there." These two effects cancel out.
