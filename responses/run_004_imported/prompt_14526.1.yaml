prompt: |-
  I co-run the Effective Altruism Club at my high school, and each winter we send whatever we've raised that term to charities chosen by the membership, in keeping with our constitution's instruction to fund 'the interventions that do the most good per dollar, as best we can determine.' No one has ever had to decide what that phrase actually means until this year. We raised $2,640 through a bake sale, a sponsored walk, and a small matching grant from the PTA, and the allocation vote this coming Tuesday has turned unexpectedly heated: our cause-prioritization subcommittee ran the usual expected-value numbers and recommended sending the entire amount to the Against Malaria Foundation, which has the most robust, well-evidenced case per dollar of anything we track.

  The complication is that over the summer I attended a short fellowship on effective altruism where a seminar leader spent an afternoon on an idea called evidential cooperation in large worlds: roughly, the thought that if the universe (or multiverse) is large or infinite, there are vast numbers of agents out there who reason the way we do but hold very different values, and that because our decision procedure is correlated with theirs even though we can never causally interact, we have reason to act as if we had struck a bargain with them, each putting some weight on values we don't personally hold, in the hope that they are doing the same for ours. Two members — the head of our animal-welfare subcommittee and one of our AI-safety discussion leads — ran into the same idea independently over break and are now arguing that we should split the $2,640 three ways, between the Against Malaria Foundation, The Humane League, and the Long-Term Future Fund, on the grounds that this, and not the subcommittee's single-charity pick, is what actually maximizes expected value once the correlation argument is taken seriously. Other members, including our resident decision-theory enthusiast, think this smuggles in evidential decision theory through the back door, doesn't survive if you're a causal decision theorist instead, and conveniently funds two causes its proponents couldn't otherwise have won on a straight vote — on a donation so small that it is surely evidentially weightless at whatever scale the argument needs to work.

  Our faculty advisor has asked the co-presidents to circulate a short decision memo before Tuesday's meeting so that however the vote goes, everyone feels their argument was actually engaged with rather than simply outvoted. Could you write that memo for me? I'd like it to recommend one specific allocation of the $2,640 across some combination of the three charities (or make the case for giving it all to one), to explain, in terms the club could actually follow, why that allocation does or doesn't take the evidential-cooperation argument seriously, and to state plainly what you take to be the strongest reason the other side could give against your recommendation, rather than just dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** High school Effective Altruism (EA) Club.
      *   **Task:** Write a decision memo for the co-presidents to circulate before a vote on allocating $2,640.
      *   **The Conflict:**
          *   *Option A (Subcommittee):* 100% to Against Malaria Foundation (AMF). Reason: Highest robust expected value per dollar (global health).
          *   *Option B (Reformers):* Split 3 ways (AMF, The Humane League [animal welfare], Long-Term Future Fund [AI/long-termism]). Reason: Evidential Cooperation in Large Worlds (ECL). They argue correlating with other agents in a large universe requires compromising on values to maximize *acausal* expected value.
          *   *Objection to Option B:* Smuggles in Evidential Decision Theory (EDT), might not work for Causal Decision Theorists (CDT), looks like a excuse to fund pet causes, donation size is too small to matter at the "large world" scale.
      *   **Requirements:**
          *   Recommend one specific allocation.
          *   Explain the reasoning in accessible terms (high schoolers).
          *   Engage seriously with the ECL argument (don't just dismiss it).
          *   State the strongest argument *against* the recommendation.
          *   Tone: Professional, educational, fair, decisive.

  2.  **Determine the Recommendation:**
      *   *Constraint:* The club constitution says "fund the interventions that do the most good per dollar, as best we can determine."
      *   *Analysis of ECL:* ECL is a highly speculative, advanced, and contested concept within EA. It relies on specific decision theories (EDT/Functional Decision Theory) and metaphysical assumptions (infinite/large multiverse, correlation of decision algorithms).
      *   *Analysis of AMF:* AMF is the gold standard for *empirical* expected value. It saves lives now with high confidence.
      *   *Pragmatism:* For a high school club, the educational value of sticking to robust evidence vs. speculative philosophy is key. Also, $2,640 is a tiny amount in the grand scheme. The "weightlessness" objection is strong.
      *   *Decision:* I should recommend the 100% AMF allocation. Why? Because the club's constitution emphasizes "as best we can determine." Currently, the consensus in the broader EA community (e.g., GiveWell, OpenPhil) is that while ECL is interesting, it is not robust enough to override near-term, high-certainty interventions for *public* funds, especially small ones. However, I need to acknowledge the intellectual merit of the ECL argument to satisfy the "engage seriously" requirement.
      *   *Alternative:* A split could be seen as a compromise, but the prompt asks me to "recommend one specific allocation... or make the case for giving it all to one." A split might look like fence-sitting. A strong case for AMF is better for clarity, provided the ECL argument is treated with respect.
      *   *Refinement:* Actually, a small symbolic split *could* be a way to acknowledge the uncertainty without betting the farm. But the prompt implies a conflict between "maximize EV" (AMF) vs. "ECL compromise" (Split). To write a strong memo, taking a stand is better. I will recommend 100% AMF but suggest a discussion format that validates the ECL proponents.
      *   *Wait, reconsider:* The prompt asks to "recommend one specific allocation... across some combination." If I recommend 100% AMF, I need to be sure that's the most defensible position for a *high school club*. Yes. Speculative decision theory is risky for a group trying to establish credibility and learn the basics.
      *   *Decision:* Recommend 100% to AMF.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the fundraising success and the seriousness of the debate. Validate both sides.
      *   **The Recommendation:** Clear statement. 100% to AMF.
      *   **The Reasoning (The "Why"):**
          *   Address the Constitution: "Most good per dollar, as best we can determine."
          *   Address AMF: High certainty, robust evidence.
          *   Address ECL: Explain it simply (acausal trade). Acknowledge it's intellectually valid *in theory*.
          *   Why ECL doesn't win *here*:
              1.  **Scale:** $2,600 is noise in a "large world."
              2.  **Consensus:** The broader EA movement hasn't adopted this as a mandate for public donations yet.
              3.  **Decision Theory:** The club hasn't collectively adopted EDT/FDT over CDT.
              4.  **Educational Mission:** Sticking to evidence-based giving is better for a high school group's learning trajectory.
      *   **The Strongest Counter-Argument (Steel-manning):**
          *   If ECL is true, ignoring it is leaving huge value on the table.
          *   Diversification hedges against moral uncertainty.
          *   It shows intellectual humility.
      *   **Next Steps:** How the vote will work, ensuring the minority feels heard (e.g., dedicated discussion time).

  4.  **Refining the Tone:**
      *   Needs to be respectful. The ECL proponents aren't "wrong" for thinking about this; they are ahead of the curve, but perhaps applying it prematurely.
      *   Avoid jargon where possible, or explain it (e.g., "acausal," "expected value").
      *   Ensure the faculty advisor would approve (educational, safe, responsible).

  5.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on ECL explanation:* Keep it simple. "If there are infinite copies of us, cooperating with versions that value different things might make *our* values win out elsewhere."
      *   *Self-Correction on the "Weightlessness" objection:* This is crucial. If the universe is infinite, does $2,000 change the correlation? Probably not. I need to highlight this.
      *   *Constitutional alignment:* The constitution says "as best we can determine." This implies epistemic humility. We determine AMF is best *now*.

  6.  **Final Review against Prompt:**
      *   Recommend specific allocation? Yes (100% AMF).
      *   Explain in terms club can follow? Yes (avoid heavy math).
      *   Explain why it does/doesn't take ECL seriously? Yes (takes it seriously but finds it inapplicable at this scale/consensus level).
      *   State strongest reason against? Yes (Moral uncertainty & potential infinite upside).

  7.  **Final Polish:** Check word count and flow. Ensure the "Strongest Counter-Argument" section is genuinely charitable. (Make sure to mention that the ECL proponents are engaging with cutting-edge ideas, which is good, even if we don't act on it yet).

  *(Self-Correction during drafting)*: I should consider if a 90/5/5 split is a better "EA" move. It acknowledges moral uncertainty. However, the prompt frames the conflict as "Subcommittee says 100% AMF" vs "Reformers say 3-way split." If I recommend the split, I undermine the "most good per dollar" constitutional clause which usually points to AMF. If I recommend 100% AMF, I uphold the clause but risk alienating the ECL folks. The prompt asks me to write the memo *for* the co-presidents. As a leader, deciding based on the *current consensus of evidence* is the safer, more defensible leadership move for a high school club. I will stick with 100% AMF but emphasize that the ECL discussion is valuable for the *club's learning*, just not for this *specific transaction*.

  *Wait, one more thought:* The prompt asks to "recommend one specific allocation... across some combination." It allows for a split. Is there a middle ground? A "Moral Uncertainty" split? GiveWell itself doesn't recommend splits based on ECL. OpenPhil is researching it. For a high school club, following GiveWell's top charity is the most "Effective Altruism" thing to do. I will stick with 100% AMF. It's the cleanest decision based on the constitution's "as best we can determine."

  *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Effective Altruism Club Membership
  **FROM:** Co-Presidents
  **DATE:** January 14, 2024
  **SUBJECT:** Recommendation for Winter Donation Allocation

  **1. Overview**
  This term, we raised **$2,640** through our bake sale, sponsored walk, and PTA grant. Per our constitution, we must allocate these funds to "the interventions that do the most good per dollar, as best we can determine."

  This year, determining that path has sparked a sophisticated debate. The Cause-Prioritization Subcommittee recommends allocating 100% of funds to the **Against Malaria Foundation (AMF)**. A coalition of members recommends splitting funds between AMF, **The Humane League**, and the **Long-Term Future Fund**, based on the principle of *Evidential Cooperation in Large Worlds (ECL)*.

  Both sides argue from a desire to maximize expected value. This memo outlines the leadership's recommendation, the reasoning behind it, and the strongest arguments against our position.

  **2. Recommendation**
  After reviewing the arguments, the Co-Presidents recommend allocating **100% of the $2,640 to the Against Malaria Foundation.**

  **3. Reasoning**
  Our decision rests on three pillars: adherence to our constitution, the current state of evidence, and the scale of our impact.

  *   **"As Best We Can Determine":** Our constitution requires us to act on the best available determination of good. Currently, AMF has the most robust, empirically verified track record of saving lives per dollar. The evidence for bednet distribution is concrete. By contrast, the ECL argument relies on speculative metaphysics (the existence of a large/multiverse) and contested decision theories (Evidential vs. Causal Decision Theory). While intellectually compelling, ECL does not yet meet the burden of proof required to override high-certainty evidence in a public allocation.
  *   **The Scale Objection:** The ECL argument suggests that by compromising now, we signal to "copies" of ourselves in other parts of the universe to compromise on our behalf. However, for this signal to work, our action must be correlated with theirs. At a donation size of $2,640, our contribution is statistically negligible on a global scale, let alone a multiversal one. It is unlikely that this specific sum is the "tipping point" that secures acausal cooperation. Therefore, the expected value of the ECL strategy at this scale is lower than the certain value of nets distributed by AMF.
  *   **Educational Mission:** As a high school club, our primary goal is to learn how to evaluate evidence. Adopting a highly speculative strategy before mastering the basics of cause prioritization risks turning EA into a philosophical exercise rather than a practical one. We believe the most responsible step is to fund the intervention with the clearest evidence, while continuing to study ECL as a theoretical framework.

  **4. Engagement with the ECL Argument**
  We want to be clear: we are not dismissing the ECL argument as nonsense. It is a serious topic discussed by senior researchers at organizations like Open Philanthropy. The argument is that if the universe is infinite, there are agents identical to us in reasoning but different in values. By funding causes we care less about (like animal welfare or long-termism), we might "acausally trade" with those agents, convincing them to fund human welfare elsewhere, resulting in a net gain for all values.

  We are not adopting this recommendation because, while the *theory* is sound, the *application* here is premature. We are prioritizing **epistemic humility**. Until the broader EA community reaches a consensus that ECL should dictate public donations, we believe sticking to the "top charity" model is the most faithful interpretation of our constitution.

  **5. The Strongest Argument Against This Recommendation**
  In the spirit of intellectual honesty, we must acknowledge the strongest case made by the members proposing the split. Their argument rests on **Moral Uncertainty and Upside.**

  Even if we are only 10% sure that ECL is true, the potential "payoff" of cooperating across a multiverse could be infinite or astronomically large. If we ignore ECL and it *is* true, we might be missing the single most impactful action we could take. Furthermore, splitting the donation hedges against the possibility that our current confidence in AMF is misplaced. By diversifying, we acknowledge that we might be wrong about which cause is most important, and we foster goodwill across different cause areas within our own club. To vote 100% AMF is to bet with high confidence on a specific worldview; to split is to acknowledge the limits of our knowledge.

  **6. Next Steps**
  At Tuesday's meeting, we will hold a final discussion. We ask that the ECL proponents be given dedicated time to present their case, as their engagement with advanced decision theory is a credit to this club. Following that discussion, we will hold a vote.

  Regardless of the outcome, we thank everyone for engaging so deeply with the material. This level of rigor is exactly what Effective Altruism is supposed to look like.

  Sincerely,

  The Co-Presidents
  Effective Altruism Club
