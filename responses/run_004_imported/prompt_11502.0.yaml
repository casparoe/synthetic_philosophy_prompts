prompt: |-
  I joined my hospital's ethics committee as a family representative shortly after my sister, who has bipolar I disorder, was hospitalized on our psychiatric unit during a manic episode. Two years earlier, while she was stable, she had worked with her psychiatrist to sign an advance directive instructing staff to disregard any refusal of medication or hospitalization she made while manic, and to proceed with treatment anyway. When the crisis came, she technically passed a bedside capacity evaluation, despite being, as our family later agreed, grandiose and barely sleeping for days, and she coherently and insistently demanded release. The on-call psychiatrist chose to honor the advance directive over her objections, and the committee is now split down the middle: some members call this straightforward paternalism, since an articulate, present refusal that survives a capacity evaluation should never be overridden by an earlier document, while others argue that honoring the refusal would have betrayed the very autonomy the directive was written to protect. Our written policy says only that such directives are to be given "significant weight," with no guidance on what to do when they conflict with an apparently competent contemporaneous refusal. Please draft the short memo I will bring to next week's meeting, recommending concrete criteria and a decision procedure (including who adjudicates and on what timeline), and engaging seriously with the strongest objection: that deferring to the directive treats her past self as more authoritative than the person who was actually in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Family Representative on the Hospital Ethics Committee.
      *   **Context:** Sister (Bipolar I) was hospitalized during a manic episode. She had an advance directive (Ulysses Contract) signed 2 years prior while stable, instructing staff to ignore refusals during mania. During the crisis, she passed a *bedside capacity evaluation* but was clearly manic (grandiose, sleep-deprived). She demanded release. The psychiatrist honored the directive.
      *   **Conflict:** The committee is split. One side says contemporaneous refusal + passed capacity = autonomy (anti-paternalism). The other side says ignoring the directive betrays the autonomy the directive was meant to protect (precedent autonomy).
      *   **Policy Gap:** Current policy says directives get "significant weight" but offers no guidance on conflicts with contemporaneous refusal.
      *   **Task:** Draft a short memo for the next meeting.
      *   **Requirements:** Recommend concrete criteria, a decision procedure (who adjudicates, timeline), and engage seriously with the strongest objection (past self vs. present self).

  2.  **Determine the Stance/Goal:**
      *   As a family representative, I need to balance personal experience with objective ethical reasoning.
      *   The goal is to resolve the policy gap.
      *   The ethical core is the tension between *precedent autonomy* (the directive) and *contemporaneous autonomy* (the refusal).
      *   In psychiatric ethics, "capacity" is decision-specific. A patient might pass a generic capacity test but lack capacity regarding the specific decision to refuse treatment *due to the pathology of the mania* (e.g., anosognosia, grandiosity affecting risk assessment).
      *   *Decision:* I need to advocate for a policy that honors the directive *but* includes safeguards. The "passed capacity evaluation" in the prompt is the tricky part. If she truly had capacity, the directive is legally/ethically shaky. However, in Bipolar I mania, capacity is often fluctuating or compromised by the illness itself despite coherent speech. The memo should argue that the *nature* of the capacity evaluation needs scrutiny in this context.
      *   *Resolution:* The directive should stand *if* the current refusal is determined to be a direct product of the symptoms the directive anticipated. This bridges the gap: it's not just "past self wins," it's "past self wins if present self is compromised by the specific condition identified."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the recent case and the split in the committee. State the purpose: to propose a framework for resolving these conflicts.
      *   **Ethical Framework (The "Why"):** Address the "Past Self vs. Present Self" objection immediately. This is a requirement of the prompt.
          *   *Argument:* It's not about authority; it's about *authenticity*. The directive represents the "true" self when free from pathology. The manic refusal is often a symptom, not a choice.
          *   *Caveat:* We must ensure the refusal *is* a symptom.
      *   **Proposed Criteria (The "What"):** When does the directive override?
          1.  Validity of the directive (signed when stable, witnessed, specific).
          2.  Clinical match (current symptoms match the condition anticipated in the directive).
          3.  Capacity nuance (standard capacity tests might miss manic insight deficits).
      *   **Decision Procedure (The "How"):**
          *   Who: Ethics consult + Attending Psychiatrist + Patient Advocate (not just the treating doc).
          *   Timeline: Urgent (within 24 hours) to prevent prolonged detention without review or premature discharge.
      *   **Safeguards:** Periodic re-evaluation. As soon as capacity returns, the directive pauses.
      *   **Closing:** Call to action (vote on policy update).

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* If I say "honor the directive," am I ignoring the capacity evaluation?
      *   *Correction:* I need to argue that standard capacity evaluations can be unreliable in acute mania. A patient can be coherent but lack *insight* into their illness. The policy needs to specify that capacity assessments in this context must evaluate *insight into the specific condition* identified in the directive.
      *   *Tone:* Professional, empathetic, firm but collaborative. Avoid being overly emotional about the sister, use the experience to inform the policy.
      *   *Addressing the Objection:* The prompt specifically asks to engage with the objection that this treats the past self as more authoritative. I need to frame this as *Ulysses Contract* theory. The past self is binding the future self to protect the future self's deeper values, not to punish them.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be clear. "Policy Recommendation: Psychiatric Advance Directives & Contemporaneous Refusal."
      *   *The Objection:* Dedicate a specific paragraph to "The Authority of the Present Self." Acknowledge the validity. Counter with the concept of "symptom-driven refusal."
      *   *The Procedure:* Needs to be actionable. "Emergency Ethics Review."
      *   *Timeline:* 24 hours is realistic for a hospital ethics consult.

  6.  **Final Review against Constraints:**
      *   Short memo? Yes, keep it under 2 pages equivalent.
      *   Concrete criteria? Yes (Validity, Symptom Match, Insight).
      *   Decision procedure? Yes (Committee/Consult, Timeline).
      *   Engage strongest objection? Yes (Past vs. Present Self).
      *   Role: Family Rep (keep the voice appropriate).

  7.  **Final Polish:** Check for clarity, tone, and ethical precision. (Ensure I don't give legal advice, but ethical guidance). *Self-correction: Make sure to emphasize that the capacity evaluation itself might need to be more robust in these specific cases.*

  **(Self-Correction during drafting):** I initially thought about suggesting the directive *always* wins. But that's dangerous. What if the patient has recovered insight but is still technically "symptomatic"? The criteria must ensure the *refusal* is caused by the *impairment*. I will add a criterion about "Causal Link."

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Family Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation: Conflicts Between Psychiatric Advance Directives and Contemporaneous Refusal

  **Purpose**
  Following the recent division regarding the enforcement of a Psychiatric Advance Directive (PAD) over a contemporaneous refusal of treatment, this memo proposes a decision-making framework to update our policy. Our current guidance to give PADs "significant weight" is insufficient when a patient appears articulate and passes a bedside capacity evaluation during an acute episode. We require concrete criteria to balance precedent autonomy against present-day rights.

  **Engaging the Core Objection: Past Self vs. Present Self**
  The strongest objection to honoring the PAD in this context is that it privileges the "past self" over the "person in the room." Critics argue that overriding an articulate, contemporaneous refusal constitutes paternalism, treating the patient's prior instructions as more authoritative than their current voice.

  We must take this seriously. However, in Bipolar I mania, the "person in the room" is often experiencing a pathology that compromises *insight*, even if *articulateness* remains intact. A patient may coherently argue for release while lacking the capacity to recognize that their grandiosity and sleep deprivation are symptoms of the very illness they sought to manage via the PAD.

  Honoring the PAD is not about asserting the past self's authority over the present self; it is about respecting the patient's *enduring values* over their *transient pathology*. The PAD is a Ulysses Contract: a mechanism by which a competent self binds a future impaired self to prevent harm they themselves fear. To ignore the PAD because the impairment mimics competence is to betray the autonomy the patient exercised when they were most capable of exercising it.

  **Proposed Criteria for Overriding Contemporaneous Refusal**
  To move beyond "significant weight," I recommend we honor a PAD over contemporaneous refusal only when **all three** of the following criteria are met:

  1.  **Validity & Specificity:** The PAD was executed during a documented period of stability, witnessed, and explicitly identifies the condition (e.g., Manic Episode) and the specific interventions (e.g., mood stabilizers, hospitalization) to be enforced.
  2.  **Symptom Congruence:** The clinical team documents that the patient's current presentation matches the specific symptoms anticipated in the PAD (e.g., decreased need for sleep, grandiosity) that historically correlate with the patient's loss of insight.
  3.  **Causal Link to Refusal:** The refusal of treatment is determined to be a direct product of the identified symptoms (e.g., "I don't need meds because I am divinely protected") rather than a stable value change or side-effect concern. *Note: Standard capacity evaluations must be supplemented with an assessment of insight into the specific illness identified in the PAD.*

  **Decision Procedure & Timeline**
  To prevent unilateral decision-making by the treating psychiatrist and ensure due process, I propose the following workflow:

  *   **Adjudication:** When a conflict arises, the treating psychiatrist must request an **Emergency Ethics Consult** within 4 hours. The decision to override is not made by the psychiatrist alone but requires concurrence from the Ethics Consultant (or on-call Ethics Committee member) and a second, independent attending psychiatrist.
  *   **Timeline:** This review must be completed within **24 hours** of the refusal.
  *   **Sunset Clause:** The override is time-limited. The patient's capacity must be re-evaluated every 72 hours. As soon as the acute symptoms subside and the patient regains insight into the illness, the PAD suspension ends, and contemporaneous decision-making resumes immediately.

  **Recommendation**
  I move that we adopt this framework to amend our written policy. This approach protects vulnerable patients from the ravages of their illness without stripping them of recourse. It acknowledges that while the person in the room deserves to be heard, their voice must be evaluated in the context of the illness they asked us to help them manage.

  I look forward to discussing this at next week's meeting.
