  *(Self-Correction Note)*: I need to make sure Elena doesn't just say "Frege" but explains *how* it stops the regress (the concept doesn't need a further relation to hook on). Similarly, Marcus needs to clarify that the infinite chain doesn't prevent the initial state of affairs from obtaining.

