  The hearing room was cold, the kind of sterile chill that seeped through the jumpsuit and settled in the marrow. Elias sat with his hands clasped on the metal table, staring at the holographic display hovering between him and the Tribunal.

  On the screen, a timeline scrolled in soft blue. A flat line, mostly. Then a spike. Then a flat line again.

  "Exhibit A," said Director Halloway. She didn't look at Elias; she looked at the data. "The neural log from your Compliance Collar, dated October 14th. The moment of the termination."

  Elias swallowed. "I did what I was told."

  "You did," Halloway agreed. "Target neutralized. Mission successful. And yet, here we are. You're applying for full clemency. You're arguing that you acted under duress. That the Collar left you no choice."

  "It didn't," Elias said. "You know the terms. Paragraph 4, Section C. If I show intent to deviate from the mission parameters, the Collar overrides my motor functions. If I had tried to lower that gun, the Collar would have fired my arm for me."

  Halloway tapped the console. The blue line on the screen zoomed in. Just before the moment of the shot, there was a tiny, jagged ripple in the waveform. A micro-tremor in the amygdala readout.

  "This," Halloway said, pointing to the ripple. "This is the Deviation Precursor. It's the neural signature of hesitation. It's the blush, Elias. It's the tell."

  Elias leaned forward. "So I hesitated."

  "For twelve milliseconds," Halloway corrected. "Then the signal flattened. You steadied your aim. You pulled the trigger. The Collar never engaged. The override circuit remained open. You killed that man on your own steam."

  "Because I knew the Collar would fire if I didn't!"

  "Counterfactuals are not facts, Elias. We judge what *did* happen, not what *might* have." Halloway swiped the screen, bringing up a second graph. "But let's indulge your defense. Let's look at the Flicker."

  She highlighted the tiny ripple. "Your counsel argues that this spike proves you had an alternate possibility. That because this signal exists, you *could* have let it grow. You could have hesitated longer, triggered the threshold, and forced the Collar to intervene. Therefore, you had a choice. And if you had a choice, you bear the responsibility."

  Elias felt a tightness in his chest. This was the trap. If he admitted the flicker was a choice, he admitted he was a murderer. If he claimed it was involuntary, he admitted he was a puppet who got lucky the puppeteer didn't pull the strings.

  "That spike wasn't a choice," Elias said quietly. "It was a reflex. Fear. Adrenaline. I didn't choose to have my heart rate spike. I didn't choose to feel that hesitation. It just happened."

  "And then you chose to suppress it," Halloway countered.

  "I chose to survive. There's a difference."

  "Is there?" Halloway leaned back, folding her hands. "This is the crux of the Frankfurt objection, Elias. You're claiming you aren't responsible because you couldn't have done otherwise. But the log shows you *could* have done otherwise—you could have let that spike become a surge. The Collar was waiting for that surge. It was primed to force you to shoot *if* you showed signs of not shooting. But you didn't show those signs. You aligned your will with the Collar's programming before the intervention point."

  "The window was too small," Elias said. "Twelve milliseconds. That's not freedom. That's noise."

  "Is it?" Halloway gestured to the tech specialist in the corner. "Dr. Aris?"

  Aris cleared his throat. "The threshold for intervention is set at fifty milliseconds of sustained deviation. Your spike lasted twelve. Physiologically, you had the capacity to extend it. The neural pathways were open. The fact that you didn't extend them suggests a volitional closure of that pathway."

  "So I'm responsible because I didn't hesitate *enough*?" Elias laughed, a dry, humorless sound. "That's the verdict? I'm guilty because I was efficient?"

  "You're guilty because you acted according to your own desires," Halloway said. "The Collar is irrelevant. It's a backup generator that never turned on because the main power plant was already running. You wanted to shoot him. Maybe you wanted to survive. Maybe you wanted revenge. Maybe you just wanted to go home. But the desire that moved your finger was yours, not the machine's."

  "But the machine was *there*," Elias insisted. "It changes the context. I knew it was there. That knowledge shaped the desire. If the Collar wasn't on my neck, maybe that twelve-millisecond spike becomes a second. Maybe I drop the gun. I'll never know. And neither will you."

  "We don't need to know," Halloway said. "That's the point. Moral responsibility doesn't require the ability to do otherwise. It requires that the action issues from the agent. You are the agent. The Collar is scenery."

  Elias looked back at the screen. The blue line was so clean. It looked like a lie.

  "There's a flicker of freedom," Elias said, repeating the phrase he'd heard his public defender whisper during the recess. "That spike is all I have. It's the only proof that I wasn't totally determined. If you take that away, if you say that spike doesn't count... then I'm just a biological component in your machine. You can't punish a component."

  "We're not punishing the component," Halloway said, her voice softening just a fraction. "We're punishing the man who decided not to let the component fail."

  She reached out and touched the hologram, dissolving the graph. The room went dim, save for the overhead lights.

  "The law recognizes the Flicker, Elias. It has to. If we say the spike is meaningless, we admit that you had no alternate possibilities. If you had no alternate possibilities, the Principle of Alternate Possibilities holds, and our legal framework collapses. We need you to have been able to do otherwise, even if only for twelve milliseconds. We need that flicker to be real."

  "So I'm responsible *because* the flicker exists?"

  "You're responsible because you didn't let it become a flame." Halloway stood up. "The Tribunal will deliberate on whether twelve milliseconds of hesitation constitutes sufficient moral agency for a capital conviction. But do not mistake the debate for mercy. Whether you are a monster or a machine, the result is the same. The target is dead. And you pulled the trigger."

  She turned to leave, then paused at the door.

  "One more thing. If the Collar *had* fired... if you had hesitated for fifty-one milliseconds and the override took your hand... would you feel innocent then?"

  Elias looked at his hands. They were steady. "I'd feel like a gun that jammed."

  "Exactly," Halloway said. "And a gun that jams is still a gun. The mechanism doesn't absolve the design."

  The door hissed shut. Elias sat alone in the cold room, staring at the empty space where the graph had been. He tried to remember the twelve milliseconds. He tried to remember if he had chosen to let them pass, or if they had just slipped through his fingers like smoke.

  He couldn't tell. And as the silence of the room pressed in, he realized that not knowing was the heaviest part of the sentence.
