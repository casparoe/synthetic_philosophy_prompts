          *   Take seriously the tool's predictive superiority over human judgment.
          *   Tone: Professional, judicial, thoughtful, decisive.

  2.  **Deconstruct the Core Philosophical/Statistical Issue:**
      *   The attorney is raising the *Reference Class Problem* (a classic problem in probability and law, notably discussed by Hájek and in legal contexts like *State v. Loomis*).
      *   *The Dilemma:* Broad groups are statistically robust but might not fit the individual. Narrow groups fit the individual better but have high variance/small sample sizes. Single individual = probability is either 0 or 1 (but we don't know which).
      *   *The User's Intuition:* The score is useful but not definitive. It shouldn't be a "trump card," but it shouldn't be ignored either.
      *   *The Constraint:* Must commit to a specific weight.

  3.  **Determine the Recommendation:**
      *   *Option A (Reject):* Too extreme. Acknowledges tool outpredicts humans.
      *   *Option B (Defer):* Too dangerous. Ignores the reference class problem and due process concerns.
      *   *Option C (Presumptive Weight):* A middle ground. Use it as a baseline, but allow rebuttal.
      *   *Decision:* I will recommend treating the score as a *rebuttable presumption* or a *starting point*, carrying significant but not dispositive weight (e.g., "substantial but non-binding"). This aligns with the user's skepticism but acknowledges the utility.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo/statement format.
      *   **Opening:** State the purpose and the specific case context (the attorney's objection).
