      *   **Topic:** Weight to give a computer-generated recidivism risk score.
      *   **Specific Context:** An attorney is arguing the score is meaningless for *this specific client* because he belongs to multiple overlapping reference classes (age, offense, vocational program, etc.), each yielding different probabilities (the "Reference Class Problem").
      *   **User's Stance:** Bothered by the tool since arrival, doubts finer data fixes it (narrowing groups leads to single individuals), but acknowledges the tool outpredicts unaided human judgment.
      *   **Requirements:**
          *   Commit to a definite recommendation (how much weight?).
