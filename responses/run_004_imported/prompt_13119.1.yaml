answer: |-
  This is one of the most famous "wait, what?" moments in game theory, so first off: your gut is reacting correctly to something deeply counterintuitive. The Rubinstein Email Game is designed specifically to expose the fault line between *probabilistic certainty* and *logical certainty*.

  Here is the intuition for the discontinuity, followed by the reality check on why we don't all starve because we can't coordinate lunch.

  ### 1. Why the Unraveling is Total (The "Poison Pill" Logic)

  You noted that everywhere else in decision theory, more evidence nudges your posterior. That is true for *single-agent* decision theory against nature. But this is a *game*. The discontinuity doesn't come from the evidence about the state of the world (which does converge smoothly); it comes from the **recursive reasoning about the other player's reasoning.**

  Here is the plain-English mechanism of the collapse:

  **The Anchor of the Induction**
  In the Email Game, the communication chain *must* end eventually. It is physically impossible for it to go on forever. Therefore, there is always a "last message" that was sent but never acknowledged.
  *   Imagine you sent 10 messages and got 10 replies. You feel great.
  *   But you know there is a tiny chance your 11th message (the one you are currently waiting on) got lost.
  *   If it got lost, the other player stopped at 10.
  *   If they stopped at 10, *they* are worried that *you* stopped at 9.

  The unraveling works because the "Don't Attack" decision is **contagious**. It relies on the cost of mismatch (one attacks, one doesn't) being catastrophically high.
  *   If I am at the very end of the chain (I sent a message, got no reply), I know for a fact you have fewer messages than me. I know you are uncertain. I know you won't attack. So I shouldn't attack.
  *   Now step back one link. If I have one more message than that, I can't be sure *you* aren't in that "end of chain" panic state. Since the cost of mismatching with a panicking partner is huge, I must also play safe.
  *   This logic propagates backward like a domino effect. The "safe" decision at the end of the chain poisons the decision at the start of the chain.

  **Why is it Discontinuous?**
  This is the crux.
  *   **Almost Common Knowledge (ACK):** The chain is finite (even if expected length is 1,000,000). Because it is finite, there **exists** a last link. That last link is the base case for the backward induction. The poison pill exists.
  *   **Common Knowledge (CK):** The chain is infinite. There is **no** last link. There is no base case where a player thinks, "He definitely has fewer messages than me." Without a base case, the backward induction cannot start. The poison pill does not exist.

  Think of it like a cliff.
  *   **ACK:** You are standing 1 inch from the edge. You can see the bottom. You are 99.999% sure you won't fall, but because the penalty for falling is death, you freeze.
  *   **CK:** The ground extends infinitely. There is no edge. You walk.

  The discontinuity isn't in the *probability* of the state (which converges); it's in the **topology of the information structure**. In ACK, there is always a "world" in the player's information set where the other player has received fewer messages. In CK, that world does not exist. That single missing possibility is enough to sustain the "Attack" equilibrium. In ACK, that possibility exists, and because the penalty for error is unbounded (or sufficiently high), that single possibility dominates the calculation.

  ### 2. The Reality Check: Why Do We Coordinate in Real Life?

  You are absolutely right: if Rubinstein were literally true, society would collapse. We coordinate on "almost common knowledge" constantly (e.g., "I'll meet you at the bar at 8," text: "Cool," text: "K").

  The model isn't "wrong," but it is brittle because it relies on three assumptions that rarely hold simultaneously in the real world.

  **A. The Payoff Structure (The most important factor)**
  The Email Game requires the cost of mismatching ($-M$) to be significantly larger than the gain of coordinating ($L$). Specifically, the ratio must be high enough to sustain the induction.
  *   **In the model:** Mismatching is disaster.
  *   **In real life:** Mismatching is usually just annoying. If I show up to the bar and you aren't there, I buy a drink and text you. I don't lose my life savings.
  *   **The Fix:** Monderer and Samet (1989) showed that if you relax the payoff assumption, "Approximate Common Knowledge" *is* sufficient for coordination. If the penalty for mismatch is low, the backward induction stops unraveling very quickly. You only need a few orders of knowledge, not infinite.

  **B. Private vs. Public Signals**
  The Email Game uses **private** confirmations. I know what I sent; I infer what you got.
  *   Real-world coordination often uses **public** signals. If we are in a room and a boss says "Attack at noon," and we both hear it, and we both see each other hearing it, that is much closer to true Common Knowledge.
  *   Even with technology: A "Reply All" email to a group is functionally different than a 1-on-1 chain. Public observability cuts the induction chain short because we don't have to infer the other's knowledge; we observe the public event together.

  **C. Bounded Rationality and Focal Points**
  The backward induction requires players to reason through hundreds of levels of "I know that you know that I know..."
  *   **Cognitive Limits:** Humans cap out at about 3 or 4 levels of recursion (Keynes's "beauty contest"). We don't actually compute the 100th order belief. We use a heuristic: "3 confirmations = enough."
  *   **Social Norms:** We have a focal point. "Texting 'K' means yes." The game theorist says "But what if the 'K' got lost?" The human says "Don't be a jerk, just show up." We coordinate on the *norm*, not the *message*.

  ### Summary for your Seminar

  If you want to nail the discussion:

  1.  **On the Discontinuity:** Argue that the discontinuity is structural, not probabilistic. ACK always contains a "boundary" where uncertainty is high (the end of the chain). CK has no boundary. In games with high mismatch costs, the existence of *any* boundary triggers a total unraveling. It's not that the probability of coordination slides to zero; it's that the *justification* for attacking vanishes entirely once a base case for doubt exists.
  2.  **On Real World Coordination:** Argue that the Email Game is a "possibility proof" of fragility, not a descriptive model of communication. Real coordination works because (a) mismatch costs are usually low (robustness), (b) we use public signals rather than private chains, and (c) we rely on social norms to truncate the infinite regress of beliefs.

  The Email Game teaches us that **Common Knowledge is not the limit of Mutual Knowledge.** It is a different category entirely. That's the epistemological punchline.
