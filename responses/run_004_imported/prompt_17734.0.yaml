answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Rain taps against the window. **Elena** (40s, sharp-eyed, wearing a blazer over a t-shirt) stirs her tea. **Marcus** (50s, rumpled cardigan, leaning back in his chair) holds a cold cup of coffee.*

  **Elena:** I've been thinking about the case we discussed earlier. The thirty-four-year-old woman. Late diagnosis. She says the label fits like a key, but she's reading Hacking now, and she's worried the lock is moving.

  **Marcus:** The looping effect.

  **Elena:** Exactly. She notes that her behavior changed once she had the name. She stopped forcing eye contact. She stopped apologizing for needing quiet. She says she was "introverted" before, and "autistic" after. But if the classification changes the person classified, how can we say the category tracks a pre-existing reality? It looks like the category *makes* the reality.

  **Marcus:** It makes the *social reality*, Elena. Not the neurocognitive substrate. She didn't grow new synapses when the clinician signed the form.

  **Elena:** But Hacking's point is that for human kinds, the substrate isn't separable from the self-conception. If I classify myself as autistic, I join a community. I adopt the "double empathy" framework. I stop viewing my social difficulties as internal deficits and start viewing them as mismatches. That changes how I act. If the behavior is part of the phenotype, and the behavior changes due to the label, then the phenotype is unstable. If the phenotype is unstable, it's not a natural kind. It's a moving target.

  **Marcus:** Gold doesn't care if you call it gold. People care if you call them autistic. I grant you that. But looping doesn't imply eliminativism. It implies *interaction*. Think about the DSM-5 change. Asperger's was folded into the broader spectrum. To you, that looks like the category is arbitrary—poof, Asperger's is gone. To me, it looks like calibration. We realized the boundary was drawn in the wrong place. The underlying neurotype didn't vanish; our map got better.

  **Elena:** But why was it drawn there in the first place? Because clinicians were looking at young boys. The woman you mentioned was missed for decades because the "real" autism was defined by male presentation. If the category is so sensitive to cultural bias and clinician intuition that it misses half the population, in what sense is it "real"? It's a social mirror, Marcus. It reflects who has the power to define deviance. When autistic adults started advocating, the definition changed to include the "mismatch" theory. That's political, not medical.

  **Marcus:** It's political *and* medical. They aren't mutually exclusive. The fact that autistic self-advocates corrected the "deficit" model suggests they have epistemic authority over their own condition. That's a sign of realism, not anti-realism. They are saying, "You are measuring the wrong thing. Measure the sensory load, measure the communication bidirectionality." That's refining the measurement of a real thing. If autism were purely a social construct, why would the sensory issues persist regardless of the label? She mentioned being "bad with people" long before she knew the word.

  **Elena:** She mentioned being "bad with people" because she was navigating a world built for non-autistic people. That's the double empathy problem, right? If autism is a mismatch between two neurotypes, then "autism" isn't a property of *her*. It's a property of the *interaction*. You can't be autistic on a desert island. But you can have high cholesterol on a desert island. If the trait disappears when the social context changes, it's not an intrinsic kind. It's a relational status.

  **Marcus:** Relational properties are still real properties. A key is only a key relative to a lock. But the shape of the key is intrinsic to the metal. Her sensory processing, her pattern recognition, her cognitive style—those are intrinsic. The *distress* comes from the mismatch, but the *structure* is internal. The looping effect happens because knowing the label allows her to change the context. She can avoid the noise. She can tell colleagues, "Don't call me unexpectedly." She's not changing her neurology; she's changing her niche.

  **Elena:** But by changing her niche, she changes the observable symptoms. If I treat a patient for depression and they stop crying, are they no longer depressed? Maybe. But with autism, the "symptoms" are behaviors. If she stops masking, she looks *more* autistic. If she learns coping strategies, she looks *less* impaired. The loop feeds back into the diagnostic criteria themselves. Clinicians now look for "masking" in women because women told them they mask. The category is eating its own tail. It's a homeostatic loop, not a homeostatic property cluster.

  **Marcus:** I'm a homeostatic property cluster realist, Elena, and I don't see the threat. The cluster holds together because of a common underlying cause—let's say, atypical neural connectivity. That connectivity causes the sensory issues, which cause the masking, which causes the exhaustion. The label intervenes in the chain. It reduces the exhaustion by reducing the need to mask. But the connectivity remains. The looping effect is evidence that the kind is *causally potent*, not that it's fictional. If it were fictional, knowing the label wouldn't enable such specific, predictable changes in life trajectory.

  **Elena:** Predictable changes because the label comes with a script. "Autistic people like routine." So she prioritizes routine. "Autistic people struggle with eye contact." So she stops forcing it. She is aligning herself with the prototype. That's the looping effect in action. She is becoming more like the category because the category is available to her. Before the diagnosis, she was just a confused introvert. Now she is a coherent autistic woman. The coherence comes from the narrative, not the neurons.

  **Marcus:** The coherence comes from the *explanation* fitting the *data*. She wasn't just a confused introvert; she was a confused introvert who couldn't tolerate fluorescent lights and took language literally. The "introvert" script didn't explain the lights. The "autistic" script does. The label didn't create the sensitivity to light. It just gave her a place to put it.

  **Elena:** But where do we draw the line? If the classification changes the classified, then the "autistic" of 2024 is not the "autistic" of 1994. The 1994 version was defined by absence of empathy. The 2024 version is defined by a different style of empathy. They are different kinds. If the kind changes over time due to the knowledge of the kind, then there is no stable object for our science to latch onto. We are studying a mirror.

  **Marcus:** We are studying a mirror that reflects a face. The face ages, the lighting changes, but it's the same face. You're arguing for eliminativism because the *description* is revisable. I'm arguing for modest realism because the *causal structure* is stable enough to support prediction and intervention. We can predict that if she reduces sensory load, her anxiety drops. That works regardless of whether we call it Asperger's, ASD, or Pervasive Developmental Disorder. The label loops, but the mechanism holds.

  **Elena:** The mechanism holds only because we keep adjusting the label to make it hold. That's my point. If we found a gene tomorrow that explained everything, the looping would stop. But we haven't. We have a social agreement about which behaviors count as significant. When women like our friend say, "This isn't a deficit, it's a difference," the medical community shifts. If the ontology of the condition depends on the political advocacy of the people classified, then the ontology is social.

  **Marcus:** And if the political advocacy is driven by the shared experience of a shared neurocognitive profile, then the ontology is biological, mediated by the social. You're treating "social" and "real" as opposites. They aren't. Pain is real. But the expression of pain, the tolerance for pain, the meaning of pain—that all loops through culture. Do you want to be an eliminativist about pain?

  **Elena:** No, because pain has a nociceptive pathway that exists without language. Autism, as a *diagnosis*, is a behavioral cluster. The behaviors are malleable. The nociception isn't. I'm not denying she has a brain that works differently. I'm denying that "Autism" is the right *kind* term for it. It's too unstable. It's a historical kind, like "witch" or "hysteria," but benevolent. It groups people for the purpose of resource allocation and identity, not because nature carved them at the joint.

  **Marcus:** Nature didn't carve "gold" at the joint either; we did that, based on atomic weight. We carved "autism" based on cognitive style. The difference is that gold doesn't talk back. Because autism talks back, we have to listen. That doesn't make it less real; it makes it more complex. Your eliminativism risks taking away the tool she used to understand her own life. If "autism" is just a social construct, then her relief is just a placebo.

  **Elena:** Her relief is real. The question is what the relief is *about*. I'm saying it's about finding a community and a narrative that reduces shame. It's not about discovering a biological essence. If we tell her "This is a real biological kind," we risk reifying the very norms she's trying to escape. If autism is a "thing" she has, she is broken. If autism is a way of being that interacts with a specific environment, she is just mismatched. The looping effect supports the latter. The category changes because the people in it demand to be seen as agents, not specimens.

  **Marcus:** But agents act on *something*. They act on their neurology, their environment, their social standing. Realism allows for that agency. Anti-realism suggests the category is *only* the feedback. I think we are finally at the crux.

  **Elena:** I think so too.

  **Marcus:** Let's state it. My claim is that the stability of the *causal mechanisms* (sensory processing, predictive coding errors, etc.) is sufficient for realism, even if the *behavioral manifestations* loop and change. The kind is real if it supports counterfactuals about the underlying structure.

  **Elena:** And my claim is that for human kinds, the *behavioral manifestations* are the only thing we can access and classify. If those manifestations are fundamentally altered by the classification itself, then the "causal mechanism" is a black box we are projecting onto. The kind is real only if it remains stable *under reflection*. Autism does not remain stable under reflection.

  **Marcus:** So our disagreement isn't about whether looping happens.

  **Elena:** No. We agree looping is robust.

  **Marcus:** And it isn't about whether there are biological correlates.

  **Elena:** No. I concede there are neural differences.

  **Marcus:** It is about the threshold of stability required for "kindhood." I say stability of the *generator* is enough. You say stability of the *output* is required.

  **Elena:** Precisely. You think the engine makes the car, even if the bodywork changes every time the driver looks in the mirror. I think if the bodywork changes every time the driver looks in the mirror, we aren't talking about a car anymore. We're talking about a relationship between a driver and a road.

  **Marcus:** Then I suppose I will continue to treat the engine, while you analyze the drive.

  **Elena:** And I'll ensure the driver isn't told the road is the only thing that's real.

  **Marcus:** Fair enough.

  **Elena:** But Marcus?

  **Marcus:** Yes?

  **Elena:** Tell her the relief is valid, regardless of our metaphysics.

  **Marcus:** I intend to. The loop goes both ways. Her understanding changes her, and our understanding changes us.

  **Elena:** Then we agree on that, at least.

  **Marcus:** On that, we are realists.
