answer: |-
  You have correctly derived the standard result: under the assumption of **known probabilities** and an **infinite time horizon**, the Full Kelly criterion maximizes the expected geometric growth rate of your bankroll. Your skepticism is well-placed, but the recommendation to use Fractional Kelly is not merely superstition or disguised risk aversion. It is a robust mathematical response to the fact that **you do not actually know the probabilities.**

  Here is the breakdown of why Full Kelly is theoretically optimal but practically dangerous, why your friend's ergodicity comment was actually relevant (though perhaps misapplied to fractional sizing), and what "geometric rationality" actually buys you.

  ### 1. The Ergodicity Argument: Justifying Kelly, Not Fractional Kelly
  Your friend's comment about ergodicity addresses a deeper question: *Why maximize log wealth at all? Why not maximize expected dollar value ($E[W]$)?*

  In standard neoclassical economics, we often maximize the **ensemble average** (the average outcome across many parallel universes). If you bet your entire bankroll on a positive EV coin flip repeatedly, the ensemble average wealth goes to infinity. However, in the **time average** (the single trajectory you actually live through), you will eventually hit a tails and go to zero.

  The system is **non-ergodic**: the time average does not equal the ensemble average.
  *   **Arithmetic Maximization ($E[W]$):** Leads to betting everything (ruin).
  *   **Geometric Maximization ($E[\log W]$):** Leads to Full Kelly (survival + growth).

  So, "geometric rationality" (maximizing the geometric mean) is the mathematical requirement for survival in a multiplicative, non-ergodic process. **This justifies using Kelly over betting your whole bankroll, but it technically justifies *Full* Kelly, not Half-Kelly.** If you knew the true probabilities with certainty, Full Kelly would be the ergodicity-optimal solution.

  ### 2. The Real Justification for Fractional Kelly: Parameter Uncertainty
  The primary mathematical justification for Fractional Kelly is **estimation error**.

  The Kelly formula $f^* = \frac{p(b+1) - 1}{b}$ assumes $p$ (probability of winning) and $b$ (odds) are known constants. In prediction markets, $p$ is never known; it is an estimate $\hat{p}$.

  The growth function $G(f)$ (the expected log growth) is **concave**. It looks like an inverted parabola near the optimum.
  *   **Underbetting:** If you bet half of Kelly, the reduction in growth rate is *quadratic* (very small), but the reduction in variance is *linear* (significant). You give up very little growth for a lot less volatility.
  *   **Overbetting:** If you overestimate your edge and bet more than Full Kelly, the growth rate drops precipitously. If you bet double Kelly, your expected geometric growth rate drops to **zero**. If you bet more than double Kelly, your expected geometric growth becomes **negative**, leading to certain ruin in the long run.

  **The Asymmetry of Error:**
  Because the penalty for overbetting (ruin) is vastly more severe than the penalty for underbetting (slower growth), the "optimal" bet size under **uncertainty** shifts to the left.

  If you treat your edge estimate as a probability distribution (a Bayesian approach) rather than a point estimate, and you maximize expected log wealth over that distribution, the resulting optimal bet size is **always less than the Kelly fraction calculated on the mean estimate.**

  In this sense, Fractional Kelly is not "risk aversion" in the utility function sense; it is **robust optimization**. It is the mathematically correct response to not knowing the true inputs.

  ### 3. The Geometry of the Growth Curve
  To visualize why practitioners use Half-Kelly, consider the "Efficient Frontier" of log-utility investing.

  Let $g(f)$ be the expected logarithmic growth rate for a bet fraction $f$.
  Let $v(f)$ be the variance of the logarithmic growth rate.

  Near the Full Kelly optimum $f^*$:
  1.  The slope $g'(f^*)$ is zero (by definition of the maximum).
  2.  Therefore, a small deviation $\Delta f$ from $f^*$ results in a second-order loss in growth: $\Delta g \approx \frac{1}{2} g''(f^*) (\Delta f)^2$.
  3.  However, the variance scales roughly with $f^2$.

  If you move from Full Kelly ($1.0 f^*$) to Half Kelly ($0.5 f^*$):
  *   You reduce the variance (and volatility of your equity curve) by roughly **75%**.
  *   You reduce the expected growth rate by only **25%**.

  For a trading bot, this is crucial. A Full Kelly strategy often experiences drawdowns of 50% or more. A Half-Kelly strategy typically experiences drawdowns of ~25%. If your bot has a margin call threshold, or if you (the human operator) panic and shut it down during a 50% drawdown, the theoretical long-term growth becomes irrelevant. Fractional Kelly keeps you in the game.

  ### 4. Is "Geometric Rationality" Just Rebranded Risk Aversion?
  It depends on how you define risk aversion.

  *   **Standard Risk Aversion:** Usually modeled by a utility function $U(W) = W^{1-\gamma} / (1-\gamma)$. Log utility is the specific case where $\gamma = 1$. Choosing $\gamma > 1$ (more risk-averse) would mathematically look like Fractional Kelly.
  *   **Geometric Rationality:** This concept (often associated with Ole Peters and Ergodicity Economics) argues that we shouldn't add a risk-aversion parameter $\gamma$ arbitrarily. Instead, we should recognize that in multiplicative dynamics, the **objective** physical growth rate of wealth *is* the geometric mean.

  So, is it rebranding?
  *   **For Full Kelly:** No. It is a correction of the objective function from Arithmetic to Geometric based on the physics of the process.
  *   **For Fractional Kelly:** It is effectively a Bayesian adjustment. It acknowledges that "Geometric Rationality" requires accurate inputs. Since inputs are noisy, the rational geometric bet is smaller.

  ### 5. Summary: Why You Should Use Fractional Kelly
  You are not "settling for lower expected return" in a meaningful way, because the "Full Kelly return" is a phantom number that assumes omniscience.

  1.  **Input Sensitivity:** Full Kelly is unstable. A 10% error in your probability estimate can turn a winning strategy into a losing one. Fractional Kelly provides a safety margin against model error.
  2.  **Drawdown Tolerance:** Full Kelly implies a 50% chance of a 50% drawdown at some point. In a side project (or a fund), this is often operationally unacceptable. Half-Kelly reduces this risk profile disproportionately to the loss in growth.
  3.  **The "Edge" in Prediction Markets:** In prediction markets, liquidity is limited. If your bot tries to size a Full Kelly bet, it may slip the market, changing the odds $b$ against you. Fractional sizing minimizes market impact.

  **Recommendation:**
  Since you are building a bot for prediction markets (where probabilities are notoriously difficult to estimate and liquidity is finite), **Half-Kelly is the standard engineering solution.** It is not a rejection of the math; it is the application of the math to a system with noisy parameters.

  If you want to be rigorous: Treat your probability estimate $p$ not as a fixed number, but as a distribution (e.g., a Beta distribution). Integrate the Kelly formula over that distribution. You will find the resulting optimal bet size is naturally fractional. That is the genuine mathematical justification you are looking for.
