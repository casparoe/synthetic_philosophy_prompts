  5.  **Addressing Concern 3: Juridical vs. Prudential Distinction:**
      *   *Philosophical Work:* Is this just a label?
      *   *Analysis:* In Aquinas, *synderesis* (first principles) vs. *prudentia* (application). The *Sentences* deals with moral theology (sin/no sin). The *De Regno* deals with political governance (what works/safety).
      *   *Validity:* This is a strong distinction. Aquinas often distinguishes between *an sit* (whether it is) and *quid sit* (what it is), or between the moral object and the circumstances.
      *   *Risk:* It could look like an excuse to ignore the tension.
      *   *Advice:* Ground this in Aquinas's methodology. *Sentences* is commentary on Peter Lombard (theological/abstract). *De Regno* is advice to a King (practical). *Summa* is systematic theology (synthesizing). The shift in genre explains the shift in tone. This makes the distinction robust, not just a label.

