answer: |-
  This is a sophisticated and well-structured project. You are tackling one of the most persistent chestnuts in the history of political thought, and your instinct to resist the "developmental thesis" (that Aquinas grew more conservative) in favor of a "contextual/genric thesis" is philologically promising.

  Here are comments on your three specific concerns, keeping in mind that this is a second opinion to help you fortify the draft before your advisor sees it.

  ### 1. The *Sentences* Passage: Defensible or Smoothing?

  Your reading is textually defensible, but you must navigate a specific semantic trap. The crux of *In II Sent.*, d. 44, q. 2, a. 2, ad 3 is the distinction between the *tyrannus ex defectu tituli* (usurper) and the *tyrannus ex parte exercitii* (legitimate ruler who governs tyrannically).

  *   **The Trap:** In the *Sentences*, Aquinas writes that killing a usurper is not sedition and can be "meritorious" (*meritorium*). He cites Ehud and Eglon. Critics (like Quentin Skinner in *Foundations*) often seize on Ehud as proof of private license.
  *   **Your Counter-Move:** You argue that "meritorious" describes the *objective moral quality of the act*, not the *subjective right of the agent*. This is strong. In Thomistic moral theology, an act can be objectively good (restoring the common good) but illicit if performed by the wrong agent (lack of due authority).
  *   **The Weak Point:** Ehud *was* a Judge of Israel. While not a king, he held a public, divinely sanctioned office. If you argue Aquinas implies "public authority" even in the *Sentences*, you need to address why Aquinas uses Ehud.
      *   *Suggestion:* Argue that for Aquinas, the "public" nature of the authority in the *Sentences* is nascent or informal. The usurper, having no title, has dissolved the public bond; therefore, the resistance does not require the *same* formal public authority needed to depose a legitimate king, but it still requires a representative capacity (acting *for* the fatherland, not *for* private vengeance). The *Sentences* leaves the *agent* ambiguous, not to license private assassination, but because the *juridical status* of the usurper makes the question of agency secondary to the question of the act's justice. You aren't smoothing over a change of mind; you are highlighting that the *Sentences* is incomplete on the question of *agency*, which the later texts complete.

  ### 2. Secondary Literature: Reinventing the Wheel?

  You are not reinventing the wheel, but you are refining a specific spoke of it. The "Developmental Thesis" (early = permissive, late = restrictive) is the standard narrative, most famously articulated by **Quentin Skinner** and echoed by **Cary Nederman** (see his work on John of Salisbury and the medieval tradition).

  However, there is a robust "Continuity School" in Thomistic scholarship that you should engage to position your argument:
  *   **John Finnis:** In *Aquinas: Moral, Political, and Legal Theory*, Finnis argues that for Aquinas, authority is constitutive of the common good. A tyrant lacks authority. Therefore, removing them is not sedition. Finnis leans toward your view that the *Summa* doesn't retract the *Sentences* but clarifies the conditions of authority.
  *   **Ernest L. Fortin:** Has written on Aquinas and tyranny, often noting that Aquinas is consistently cautious about private initiative.
  *   **Joseph C. Schnitzer:** ("St. Thomas Aquinas on Tyrannicide") explicitly argues against the idea that Aquinas endorsed private tyrannicide in the *Sentences*.
  *   **Brian Tierney:** In *The Crisis of Church and State*, he contextualizes these debates within canon law traditions which generally required some form of public procedure.

  **Your Contribution:** Where you can innovate is by explicitly framing the continuity through the **Juridical/Prudential** lens. Much of the literature argues for continuity based on *principles* (the common good). You are arguing for continuity based on *methodology* (theology vs. statecraft). That is a fresher angle. Make sure you cite the "Developmental" scholars (Skinner, Nederman) to show you know the dominant narrative you are challenging, but align yourself with the "Continuity" scholars (Finnis, Schnitzer) while offering your specific methodological explanation for the tonal shift.

  ### 3. The Juridical/Prudential Distinction: Real Work or Label?

  This distinction is doing real philosophical work, provided you ground it in Aquinas's own epistemology of practical reason. It is not merely a label for "sounding careful."

  *   **Theoretical Grounding:** Connect this to the distinction between *speculative* truth (which is uniform) and *practical* truth (which varies by circumstance). In the *Sentences*, Aquinas is working within a sacramental/penitential framework: "Is this act a sin?" (Juridical/Moral). In *De Regimine*, he is writing a "Mirror for Princes": "Will this act produce peace?" (Prudential/Political).
  *   **Why it matters:** If you frame it this way, you show that the *Sentences* answers the question *an sit* (is it permissible in principle?), while *De Regimine* answers *quomodo* (how should it be executed?).
  *   **The Risk:** The risk is that it looks like an ad hoc excuse to ignore the fact that *De Regimine* explicitly warns against the very act the *Sentences* calls "meritorious."
  *   **The Fix:** Use the *Summa* (IIaIIae, q. 42) as the bridge. The *Summa* is systematic theology (like the *Sentences*) but written with the maturity of the *De Regimine*. In the *Summa*, Aquinas says overthrowing tyranny is not sedition (Juridical) but implies it must be done by public authority (Prudential/Institutional).
  *   **Recommendation:** Explicitly link your "Juridical/Prudential" distinction to Aquinas's treatment of **epikeia** or the nature of **determinatio**. The *Sentences* identifies the principle; the *De Regimine* offers the *determinatio* for contingent political reality. This makes your distinction structural to Thomistic thought, not just a convenient heuristic for your paper.

  ### Summary Advice for the Draft

  1.  **Nuance the *Sentences*:** Don't claim the *Sentences* explicitly demands public authority. Claim it is *silent* on the agent because it is focused on the moral object, whereas the later texts make the agent explicit. This avoids the charge of reading in a qualification that isn't there.
  2.  **Name the Debate:** Explicitly reference the Skinner/Nederman "Developmental" reading and the Finnis/Schnitzer "Continuity" reading. Position yourself as offering the *methodological explanation* for the Continuity view.
  3.  **Genre Matters:** Lean heavily on the difference in genre. *Commentary on the Sentences* (Theological abstraction) vs. *De Regimine* (Political counsel). The shift isn't in Aquinas's mind; it's in the audience and purpose.
  4.  **Authorship Caveat:** Briefly acknowledge the authorship debate regarding *De Regimine Principum* (Book II is often attributed to Tolomeo of Lucca). Even if you treat it as "Thomistic," your advisor will notice if you ignore it. You can argue that even if Tolomeo wrote it, it represents the immediate Thomistic school's reception of the master's thought, reinforcing the "prudential" shift in the tradition.

  Your thesis is strong. It rescues Aquinas from the charge of inconsistency without sanitizing the radical potential of his thought. It just relocates that radicalism from "private violence" to "public accountability." Good luck with the draft.
