      *   **Paper Topic:** Aquinas's views on tyranny and resistance across three texts: *Commentary on the Sentences* (In II Sent., d. 44), *De Regimine Principum* (On Kingship), and *Summa Theologiae* (IIaIIae, q. 42).
      *   **Thesis:** There is no tension/contradiction regarding private tyrannicide. None of the texts license private individuals to kill tyrants on their own initiative. The apparent shift is from a *juridical* question (is the act sinful in abstract?) to a *prudential* one (what should a community do given risks?).
      *   **Specific Concerns:**
