      *   *Continuity View:* Some Thomists argue for continuity. John Finnis (in *Aquinas: Moral, Political, and Legal Theory*) emphasizes that for Aquinas, authority is always for the common good. If a ruler fails, they lose authority. But enforcement is a public matter.
      *   *Specific Reference:* Look at **Cary Nederman** ("Killing the King: The Medieval Debate on Tyrannicide"). He discusses the shift. Also **Joseph C. Schnitzer** ("St. Thomas Aquinas on Tyrannicide").
