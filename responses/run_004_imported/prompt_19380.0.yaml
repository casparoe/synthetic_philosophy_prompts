answer: |-
  This is a fantastic rabbit hole to go down. You have hit on one of the deepest tensions between calculus (series) and probability theory (measure theory).

  You are absolutely correct that if you write out the sum in the standard order ($n=1, 2, 3...$), you get the Alternating Harmonic Series, which converges to $\ln(2) \approx 0.693$.

  So, why do Hájek, Nover, and statisticians insist the Expected Value (EV) is **undefined** rather than $\ln(2)$?

  The short answer is: **Expected Value is supposed to be a property of the *game*, not a property of how you *write down* the outcomes.**

  Here is the logical walkthrough of why "undefined" is the only verdict that makes sense, without getting bogged down in dense measure theory jargon.

  ### 1. The "Indexing" Problem
  In calculus, when we define an infinite sum $\sum_{n=1}^{\infty} a_n$, we define it as the limit of partial sums $S_N = a_1 + ... + a_N$. This definition **depends entirely on the order** of the terms.

  In the Pasadena game, you indexed the outcomes by the flip number $n$.
  *   Outcome 1: Head on flip 1.
  *   Outcome 2: Head on flip 2.
  *   Outcome 3: Head on flip 3.

  This feels "natural," but logically, it's arbitrary. It's just a labeling system. Imagine I decided to label the outcomes differently. I could group all the positive payout outcomes together and list them first, then list the negative payout outcomes.

  If Expected Value represents a "fair price" to enter the game, that price should be intrinsic to the game mechanics. It shouldn't change just because I decided to write Outcome #3 on my scratchpad before Outcome #2.

  ### 2. The $\infty - \infty$ Catastrophe
  To see why the order matters, let's break the Expected Value sum into two separate piles: the **Positive Expectations** and the **Negative Expectations**.

  The term for the expected value at step $n$ is:
  $$ E_n = P(n) \times \text{Payout}(n) = \frac{1}{2^n} \times (-1)^{n+1}\frac{2^n}{n} = \frac{(-1)^{n+1}}{n} $$

  Now, let's separate the positives and negatives:

  **The Positive Pile (Odd $n$):**
  $$ 1 + \frac{1}{3} + \frac{1}{5} + \frac{1}{7} + ... $$
  This is a chunk of the Harmonic Series. It diverges to **$+\infty$**.

  **The Negative Pile (Even $n$):**
  $$ -\frac{1}{2} - \frac{1}{4} - \frac{1}{6} - \frac{1}{8} - ... $$
  This is also a chunk of the Harmonic Series. It diverges to **$-\infty$**.

  So, the total Expected Value is effectively:
  $$ E[\text{Game}] = (+\infty) + (-\infty) $$

  In standard arithmetic, $\infty - \infty$ is **indeterminate**. It doesn't equal 0, and it doesn't equal $\ln(2)$. It means "there is not enough information to assign a value."

  ### 3. Why Rearranging Changes the Answer
  This is where the Riemann Rearrangement Theorem comes in, but let's look at it logically.

  Because you have an infinite supply of "positive value" and an infinite supply of "negative value," you can construct the sum to equal whatever you want by changing the order in which you "spend" them.

  *   **Standard Order ($1, 2, 3...$):** You take one positive, one negative, one positive, one negative. They cancel out just enough to settle at $\ln(2)$.
  *   **Greedy Order:** You take **two** positives, then **one** negative. Then **two** positives, then **one** negative.
      *   Since the positive terms are "larger" on average in this grouping, the sum will drift upward. In fact, you can make this sum converge to **$1.5$** (or any number $>\ln(2)$).
  *   **Pessimistic Order:** You take **one** positive, then **two** negatives. The sum will drift downward, potentially to **$0$** or negative numbers.

  **The Logical Kicker:**
  If the Expected Value were truly $\ln(2)$, then the game would be "worth" 69 cents.
  But if I can conceptually rearrange the outcomes to show the game is worth $1.50, then a rational casino could charge you $1.00 and claim it's a bargain (since $1.00 < 1.50$), while a rational player could refuse to pay 69 cents claiming it's worth only 50 cents.

  Because the "value" of the game shifts depending on how you arrange the terms, there is no **stable** value. In decision theory, if a value isn't stable under relabeling of the sample space, it doesn't exist.

  ### 4. How Probability Theory Defines "Expectation"
  In introductory stats, we learn $E[X] = \sum x p(x)$. This works fine for finite sums or absolutely convergent infinite sums.

  However, rigorous probability theory (based on Lebesgue integration) defines Expectation differently to avoid exactly this paradox. It requires **Absolute Convergence**.

  For $E[X]$ to exist, the sum of the *absolute values* must be finite:
  $$ \sum |x_n| p_n < \infty $$

  Let's check the Pasadena game:
  $$ \sum \left| \frac{(-1)^{n+1}}{n} \right| = \sum \frac{1}{n} = 1 + \frac{1}{2} + \frac{1}{3} + ... = \infty $$

  Because the sum of the absolute magnitudes is infinite, the Lebesgue integral is **undefined**.

  **Why does probability demand this?**
  Think of Expected Value as the "long-run average."
  *   In the **St. Petersburg Paradox**, the long-run average grows without bound. It goes to $+\infty$. That's a consistent verdict (it's infinitely good).
  *   In the **Pasadena Paradox**, the long-run average **does not settle**.
      *   If you play the game $N$ times, your average payout will swing wildly depending on which specific outcomes you hit.
      *   More importantly, the Law of Large Numbers (which guarantees averages settle down to the EV) **fails** here. The average payout does not converge to $\ln(2)$. It keeps oscillating.

  ### 5. Summary: Why "Undefined" is the Real Verdict
  You asked why we can't just accept the $n=1, 2, 3$ order.

  1.  **Arbitrar:** The order $1, 2, 3$ is a human convention for indexing flips. The physical game doesn't know what an integer index is. A physical property (like fair price) shouldn't depend on human indexing.
  2.  **Instability:** Because the positive expectations sum to $\infty$ and negative expectations sum to $-\infty$, the total balance is unstable. You can tip the scale to any number you want by grouping the bets differently.
  3.  **No Law of Large Numbers:** If you actually played this game a million times, your average winnings would not converge to $\ln(2)$. They would wander unpredictably. Since EV is supposed to predict the long-run average, and the long-run average doesn't settle, the EV doesn't exist.

  **The Verdict:**
  St. Petersburg has an EV of **Infinity** (consistently positive).
  Pasadena has an EV of **Undefined** (oscillates between positive and negative infinity depending on arrangement).

  Hájek and Nover's point is that if you allow conditionally convergent series to have Expected Values, you break the logic of decision theory. You could construct two games that are physically identical but mathematically assigned different values just by renaming the outcomes. To prevent that contradiction, probability theory declares the EV undefined.
