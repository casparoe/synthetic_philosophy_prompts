      *   **Specific Requirements:**
          *   Include a question on the "lone castaway" objection (solitary rule-following).
          *   Include a question on circularity (smuggling in correctness).
          *   Include a question on the community's dispositions being subject to skepticism (quus applied to the group).
          *   Include a question on truth conditions vs. warranted assertibility (self-refutation/stability).
          *   Include a follow-up for each question based on likely replies.
      *   **Tone:** Progressive difficulty (start soft, get harder), philosophical rigor but accessible for a podcast.

  2.  **Deconstruct the Guest's Position (Kripke's Skeptical Solution):**
      *   *The Paradox:* No fact about an individual determines whether they mean *plus* or *quus* (where quus acts like plus up to a certain point, then diverges).
      *   *The Skeptical Solution:* There are no truth conditions for meaning claims. Instead, there are *assertibility conditions*. We are licensed to say someone means *plus* if their usage aligns with the community's.
      *   *The Weak Point:* "Agreement vs. Correctness." If correctness is *defined* by agreement, can the community be wrong? If not, is normativity lost? If so, what grounds that wrongness?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* Start with clarification, move to implications, then hit the hard objections (Castaway, Circularity, Community Skepticism, Truth/Assertibility).

      *   *Q1 (Warm-up/Setup):* Establish the "agreement" claim clearly.
          *   *Draft:* You say agreement is enough. Does this mean if everyone agreed 2+2=5, it would be true?
          *   *Refinement:* Make it more about meaning than arithmetic truth. Focus on the transition from individual to community.
          *   *Follow-up:* She will likely say "No, that's not how language games work." Push on *why*.

      *   *Q2 (Normativity):* The core of rule-following is "ought." Agreement is "is."
          *   *Draft:* How does agreement create an 'ought'?
