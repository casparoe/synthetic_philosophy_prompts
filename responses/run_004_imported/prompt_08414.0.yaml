  Here is a draft for the eulogy. I have tried to balance the raw grief of a sibling with the intellectual honesty your brother deserved, while keeping the language accessible for everyone in the room.

  There are placeholders in brackets **[Like This]** for you to fill in with specific details.

  ***

  **Eulogy for [Brother's Name]**

  Thank you all for being here. For those who don't know me, I'm [Your Name], [Brother's Name]'s older [brother/sister].

  Standing here, looking out at this crowd, I see two different groups of people. On one side, I see the rowing club, the firefighters, the people who knew [Brother's Name] for his physical strength, his discipline, and his instinct to help. To you, what happened two weeks ago is a clear, tragic story of heroism. You see a man who saw someone in danger and didn't hesitate to put himself in the water. You see a hero who gave everything. And you are right.

  On the other side, I see his friends from university, the people from his reading groups. You knew the other side of him. You knew the side that lay awake at night worrying. You knew that for [Brother's Name], the world wasn't just a place to live in; it was a problem to be solved, a weight to be carried.

  I need to talk about both of those men, because he was both.

  Two weeks ago, [Brother's Name] pulled a little girl out of the river near our parents' home. He got her to the bank. He saved her life. But the current was too strong, and he didn't make it back.

  It is tempting, in a moment like this, to simplify that story. It is tempting to say he acted on pure instinct, that it was a reflex of a good heart. And maybe it was. But if I stand here and pretend that his action wasn't also tied to the way he thought about the world, I feel like I would be lying about who he was.

  Many of you know he was obsessed with a specific idea in ethics. It's often called the "drowning child" argument. The basic idea is that if you saw a child drowning in a shallow pond, you would wade in to save them, even if it ruined your clothes or cost you time. Most of us agree with that. But [Brother's Name] took it further. He believed that if we agree we should save the child in the pond, we have to admit we should save the children we *don't* see, too—the ones starving or suffering far away, whose lives we could save if we gave more of ourselves than just a wet pair of shoes.

  He wrestled with that. Hard. Sometimes, honestly, it ate at him. He felt the weight of strangers' suffering as if it were his own responsibility. He never really made peace with it. He never found a comfortable answer to how much we owe each other. He just lived with the question.

  I know some people might worry that saying this makes his death sound like an ideology. I want to be very clear: [Brother's Name] did not die for a theory. He did not die because he was trying to prove a point.

  He died because he was a man who had trained himself, over a lifetime of worrying and thinking and feeling, to believe that other people mattered.

  For the friends who knew his struggles: He didn't find the answer he was looking for. The world is still broken. The pond is still deep. But in those final minutes, the theory disappeared. There was no calculation. There was no debate. There was just a river, a child, and [Brother's Name].

  For the friends who knew him as a hero: You saw the action. But the action came from a place of deep, sometimes painful, reflection. He wasn't just brave; he was conscientious. He cared so much it hurt him.

  To my parents: I know the irony is cruel. He spent years worrying about how to save children he couldn't reach, and in the end, he saved the one he could, at the cost of leaving us. I know there are no words for that. We just have to hold onto each other.

  [Brother's Name] was complicated. He could be stubborn. He could be heavy-hearted. But he was also the first person to show up when you moved house, the person who remembered your birthday, the person who listened when you were hurting. He practiced what he believed, not perfectly, but earnestly.

  I don't want to turn his memory into a lecture. I don't want to tell you that you all need to go out and change your lives to honor him. Grief is too heavy for homework.

  But I do think the most honest way to honor him is to acknowledge the tension he lived with. He knew that doing good is hard. He knew that saving one person doesn't fix everything. But he also knew that saving *one* person matters.

  He didn't leave us an answer to the questions he asked. He left us an example of how to live inside the question.

  [Brother's Name], you got her to the bank. You did the thing you said mattered. I hope, wherever you are, the water is calm now. I hope you can rest.

  We will miss you. We will love you. And we will try, in our own imperfect ways, to keep watching the water.

  Thank you.
