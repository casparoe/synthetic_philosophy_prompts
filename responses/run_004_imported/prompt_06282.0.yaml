          *   *Counter:* How do we define "thinking clearly"? That definition *is* the normative assumption. A cognitive process that looks like "bias" (e.g., addiction) could be modeled as a "preference" for the state of addiction. The "idealization" function is just a specific Planner $P_{ideal}$. But why is $P_{ideal}$ the truth-teller and $P_{actual}$ the liar? That's an ethical claim, not a psychological fact. A&M says we can't derive $P_{ideal}$ from behavior alone.

      *   *Escape Route 2: Stability / Context-Independence.*
          *   *Idea:* Biases are fragile/context-specific; true preferences are stable.
          *   *Counter:* Construct a degenerate pair where the "Reward" is highly complex (encoding all the context switches) and the "Planner" is simple (always maximize that complex reward). Or vice versa. A&M specifically addresses complexity. You can push the complexity into the Reward function (preferences) or the Planner (biases). Stability is just a feature of the joint distribution. You can define a "preference" for stability, or a "bias" towards instability. Distinguishing them requires saying which stability *matters*.

      *   *Escape Route 3: Neural/Structural Realism (The "Complete Psychology" argument).*
