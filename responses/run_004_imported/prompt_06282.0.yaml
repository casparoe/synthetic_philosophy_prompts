      *   *Escape Route 4: Normative Realism / External Standards.*
          *   *Idea:* There are objective goods.
          *   *Counter:* This concedes the point. The user's prompt asks to argue that the line can't be drawn from *psychological facts alone*. If you bring in objective goods, you admit psychological facts aren't enough.

  6.  **Synthesize and Structure:**
