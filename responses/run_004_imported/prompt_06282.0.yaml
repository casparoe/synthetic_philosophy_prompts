      *   *Key Move:* Complete psychological data is just *more behavior* (or states causally linked to behavior). It doesn't solve the decomposition problem because the "bias" mechanism can always be re-labeled as part of the "preference" mechanism without changing the joint complexity.

  5.  **Address Escape Routes (The Core Challenge):**

      *   *Escape Route 1: Reflective Equilibrium / Idealized Reflection.*
