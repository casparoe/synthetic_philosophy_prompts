      *   **Section 1: The Isomorphism.** Map IRL terms to Ethical terms. Show that "Complete Psychology" is just a higher-dimensional observation space, not a solution to the decomposition problem.
      *   **Section 2: The Complexity Swap.** Explain how A&M's complexity argument applies to ethical constructs. You can shift complexity between "True Self" and "Corrupting Influence" without changing the total description length.
      *   **Section 3: Engaging Escape Routes.**
          *   *Idealization:* It presupposes a norm of rationality.
          *   *Stability:* Stability can be encoded in the reward function or the planner.
          *   *Neuroscience:* The "Homunculus" problem. Which neuron votes?
      *   **Section 4: The Ethical Smuggle.** Conclude that defining "bias" is inherently normative. To call something a bias is to say it *shouldn't* be there. That "should" isn't in the data.
      *   **Conclusion:** Summarize. This doesn't mean ethics is impossible, but it means it can't be *empirical* in the way positivists hope. It requires explicit normative commitment.

  7.  **Refine Tone:**
      *   Keep it technical enough for an ML engineer (mention Kolmogorov complexity, priors, degenerate solutions) but philosophically rigorous.
      *   Avoid being dismissive of ethics; rather, show the structural limitation.
      *   Ensure the "Complete Psychology" point is hit hard, as the user specifically mentioned it.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I actually argue *for* the generalization? Yes.
      *   *Check:* Did I address the "complete psychology" aspect? Yes, need to emphasize that internal states are just more observations.
      *   *Check:* Is the distinction between "descriptive" and "normative" clear? This is the crux. The A&M result shows you can't get normative (preferences) from descriptive (behavior+psych) without a normative prior.
      *   *Refinement:* Make sure to explicitly mention that calling something a "bias" is a normative claim (it's an *error*), not just a descriptive one (it's a *deviation*). A&M shows we can't identify *errors* without assuming what *correctness* looks like.

  9.  **Final Polish:** Check citations (Armstrong & Mindermann 2018 is correct). Ensure the flow is logical. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be careful not to just say "Hume's Is-Ought problem." While related, the user wants the specific *structural/complexity* argument from A&M applied to ethics. I need to make sure the "complexity swap" argument is central, not just general philosophical skepticism. The key is that the *joint complexity* of (True Preference + Bias) is indistinguishable from (Degenerate Preference + Degenerate Bias).

  *Plan Adjustment:* Ensure the "Complexity Swap" is explained in ethical terms. E.g., The "Adaptive Preference" case.
