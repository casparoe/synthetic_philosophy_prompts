      *   *Backward Induction:* If rational, you defect at the last step. Knowing this, the other defects at the second-to-last. Unraveling leads to immediate defection.
      *   *The Paradox:* Real people cooperate. Why?
      *   *The "Crack":* If Player 1 cooperates (moves down the centipede), Player 2 observes something "impossible" under common knowledge of rationality. Does Player 2 assume Player 1 is irrational? Or that Player 1 knows something Player 2 doesn't? If the assumption of common knowledge is broken by the first move, can you still use it to predict the next move?
      *   *Her Insight:* The breakdown of the assumption isn't a failure; it's an opening. It allows for trust, reputation, or simply the possibility that rationality includes the capacity to believe in cooperation.

  3.  **Deconstruct the Personal Connection:**
