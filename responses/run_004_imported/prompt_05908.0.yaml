answer: |-
  1. **The Pareto Engine:** Harsanyi's Aggregation Theorem relies heavily on the Pareto principle: if every individual prefers Lottery A to Lottery B, the social planner must also prefer A to B. This sounds harmless, but it does the heavy lifting in forcing the linear utility sum. In effective-altruism contexts, we often encounter cases where everyone prefers an outcome based on shared misinformation or adaptive preferences (e.g., oppressed groups reporting high satisfaction). If the "unanimous preference" is morally suspect, does the theorem force us to aggregate error rather than welfare?

  2. **The Diamond Objection:** Peter Diamond offered a famous counterexample involving an indivisible good and two equally deserving claimants. A fair coin flip gives each a 50% chance, while a certain assignment gives one person the good. Under Harsanyi's framework, if the expected utility is identical, the social planner should be indifferent between the flip and the certain assignment. Yet, most moral intuitions suggest the flip is fairer because it respects *ex ante* equality of opportunity, not just *ex post* welfare. Why should we accept a theorem that treats a fair lottery as morally equivalent to a deterministic allocation whenever the expectations match?

  3. **Follow-up (Diamond):** I anticipate you'll argue that valuing the "fairness of the flip" just means we need to include fairness as a preference in the utility function. But Diamond's point is that fairness is a constraint on the *aggregation procedure* itself, not just another input to be weighed. If the theorem defines away procedural justice by treating it as merely another preference, aren't we begging the question against non-utilitarian theories of rights?

  4. **Heterogeneous Priors:** The Aggregation Theorem assumes that all individuals and the social planner share the same subjective probabilities regarding the state of the world. In reality, especially in long-termist or existential-risk debates, reasonable people hold vastly different priors about the likelihood of outcomes. Recent impossibility results (like those by Mongin) suggest that if individuals have different priors, you cannot satisfy Pareto and Expected Utility simultaneously without the social planner essentially adopting one person's beliefs. Does this mean the theorem collapses in the exact high-stakes, high-uncertainty contexts where we most need ethical guidance?

  5. **Follow-up (Priors):** Your likely response is that we should correct false beliefs and converge on the "true" probabilities before aggregating. But in moral and existential uncertainty, there is no objective frequency to appeal to. If the theorem only works when we assume a "God's-eye view" of probability that humans cannot access, doesn't that limit its normative force for actual human decision-makers?

  6. **Rawls and the Veil:** You defend Harsanyi's "Impartial Observer" argument, where a rational agent behind a veil of ignorance maximizes average utility. But John Rawls used essentially the same device to argue for the Difference Principle (maximin), not average utility. Rawls argued that when the lottery determines your *entire life position*, extreme risk aversion is rational. Why should we accept Harsanyi's calibration of rational risk-neutrality over Rawls's risk-aversion when the stakes are one's fundamental life prospects?

  7. **Follow-up (Rawls):** You will likely say Rawls violates the Von Neumann-Morgenstern axioms of rationality. But those axioms were designed for repeated gambles over money, not a one-shot choice over social constitutions. If we are designing the rules of society, is it not rational to prioritize the worst-off position to ensure a tolerable life, rather than maximizing the average? Does insisting on VNM rationality here privilege a specific economic view of rationality over a moral one?

  8. **Interpersonal Comparison:** The theorem concludes that social welfare is a weighted sum of individual utilities. But Expected Utility Theory only gives us utility up to a positive affine transformation—it doesn't give us a natural zero point or unit scale. To sum my utility and yours, we need to make interpersonal comparisons of utility intensity. How do we non-arbitrarily calibrate these scales without smuggling in a prior moral judgment about whose welfare counts more, which the theorem was supposed to derive?

  9. **Variable Populations:** Harsanyi's framework assumes a fixed set of individuals whose preferences are being aggregated. However, many pressing ethical questions in effective altruism involve changing population sizes (e.g., existential risk, climate policy, reproductive ethics). When the "who" in the sum is variable, the Aggregation Theorem doesn't apply directly. Do you view this as a minor technical extension, or does the inability to handle variable populations suggest utilitarianism is incomplete as a total moral theory?

  10. **Falsifiability:** Finally, formal results are powerful because they clarify commitments, but they can also become immune to criticism by redefining terms. What specific theoretical result, thought experiment, or empirical finding would actually change your mind about the ethical significance of Harsanyi's theorems? Is there a scenario where you would concede that rationality does not point toward utilitarianism?
