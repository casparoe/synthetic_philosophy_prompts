      *   Timeline included? Yes.
      *   Engages "Keep It" on signaling terms? Yes.

  8.  *(Self-Correction on "Paid"):* If the fellowship is *unpaid* generally (implied by "unpaid five day work sample... no stipend unless they're actually accepted"), does paying the finalists break the bank? The prompt says "tiny, self-funded." I should be careful not to assume they have cash. I will frame the recommendation as "Reduce Scope to Eliminate Liquidity Constraint" with "Stipend if Feasible." Actually, the strongest signaling argument is that the *time cost* is the noise. Reducing time is the critical fix. Paying is secondary but helpful. I will recommend **Modify: Reduce Scope + Stipend (if possible)**.
      *   *Wait, looking closer:* "no stipend unless they're actually accepted." This implies the fellowship itself might be funded or unpaid? "self-funded ten week research fellowship... no stipend unless they're actually accepted." Usually, fellowships pay. The *work sample* is unpaid. Okay. So paying for the work sample is a budget question. I will recommend paying for the work sample as a "consulting fee" to align incentives and remove the wealth signal.

