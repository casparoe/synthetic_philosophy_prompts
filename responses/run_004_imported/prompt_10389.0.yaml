      *   *Signaling nuance:* If we pay, is it still a signal? Yes, the *quality* of the work is the signal. The *sacrifice* is no longer the signal. The "Keep It" camp wants sacrifice to be the signal. I need to argue that *output quality* is a better signal of research potential than *willingness to work for free*.
      *   *Key Insight:* In research, the value is the idea, not the suffering. Signaling suffering selects for people who can suffer, not people with good ideas.

  7.  **Final Polish:** Check against constraints.
