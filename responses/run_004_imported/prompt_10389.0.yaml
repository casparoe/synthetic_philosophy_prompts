          *   *Option B (Change):* Shorter, paid task. Argument: Current version tests ability to afford time (inequality), not just seriousness/talent.
      *   **User's Insight:** Understands Hanson/Signaling/Zahavi/Grafen/Spence well. Knows that for a signal to be honest, the cost must be *differentially* lower for the high-quality type, not just high in absolute terms. Suspects the current task might just be "costly" without being a true "handicap" for the desired traits.
      *   **Task:** Write a short memo to circulate to the committee before the vote.
      *   **Requirements:**
          *   Actual recommendation (Keep, Drop, or Modify).
