answer: |-
  **MEMORANDUM**

  **TO:** Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Selection Mechanism Design: Signaling Efficiency vs. Costly Noise

  ### Executive Summary
  We are currently divided on whether to retain the unpaid five-day work sample for final-round finalists. After analyzing the proposal through the lens of signaling theory (specifically the Handicap Principle and Spence's job-market signaling), I recommend we **modify the task** rather than keep or drop it entirely.

  My recommendation is to **reduce the scope to a 48-hour sprint and provide a flat stipend for completion.** This preserves the signal of *capability* while removing the noise of *liquidity*, ensuring we select for research potential rather than socioeconomic flexibility.

  ### The Signaling Argument: Engaging the "Keep It" Position
  The argument for retaining the current task is fundamentally a signaling argument: *High cost filters for high commitment.* Proponents argue that only candidates with genuine interest will bear the cost of five unpaid days.

  However, for a signal to be honest (a separating equilibrium), the cost must be **differentially distributed** based on the trait we wish to measure. In Zahavi's terms, the handicap must be harder for low-quality types to bear than high-quality types. In Spence's terms, the marginal cost of education (or work samples) must be lower for high-productivity workers.

  **The Failure of the Current Design:**
  1.  **Uniform Cost:** Five days of time has a roughly uniform absolute cost for everyone (120 hours). It does not cost a "less serious" person more time to sit at a desk than a "serious" person.
  2.  **Correlated Noise:** The ability to bear this cost correlates strongly with external factors unrelated to research potential: lack of caregiving responsibilities, flexible employment, or personal savings.
  3.  **Result:** We are not currently observing a Handicap Principle equilibrium. We are observing a **Toll Booth.** The toll filters for wealth/freedom, not talent. A high-talent candidate with a retail job and children faces a higher *effective* cost than a mediocre candidate with a trust fund.

  If the goal is to signal "seriousness," we must ensure the cost scales with *lack of ability*, not *lack of free time.* Currently, a low-talent candidate with free time can produce a mediocre proposal just as easily as a high-talent candidate with no free time can produce a great one (or drop out). The signal is noisy.

  ### Recommendation: The "Research Sprint"
  To restore the signaling integrity of the final round, we must alter the cost structure so that it tracks *research ability* rather than *liquidity*.

  **1. Compress the Timeline (48 Hours)**
  *   **Rationale:** If the task is truly testing research intuition and proposal design, a high-quality candidate should be able to produce a compelling draft in two focused days. A low-quality candidate will struggle regardless of whether they have five days or two.
  *   **Signaling Effect:** This increases the *intensity* of the signal while lowering the *absolute* cost. It makes the cost differentially higher for those who lack the skills to work quickly and decisively.

  **2. Introduce a Completion Stipend**
  *   **Rationale:** Paying a flat fee (e.g., $500) for a completed draft neutralizes the liquidity constraint.
  *   **Signaling Effect:** This shifts the signal from "willingness to suffer" to "ability to execute." If we pay, the only reason to produce a *good* proposal is talent and interest. The "willingness to work for free" signal is actually counter-productive for us; we want researchers who value their time, not those who undervalue it.
  *   **Budget Note:** For a typical finalist pool (e.g., 20 people), this is a $10k line item. Given our mission to support independent research, modeling professional norms is worth the cost.

  ### Implementation Timeline
  If we approve this modification, we can implement it for the next cohort as follows:

  *   **Week 1:** Committee agrees on scope reduction (prompt refinement for 48-hour output).
  *   **Week 2:** Budget approval for stipend; legal/admin setup for contractor payments.
  *   **Week 3:** Update application materials to reflect the new "Final Sprint" structure.
  *   **Week 4:** Communicate changes to past applicants/network to manage expectations.

  ### Conclusion
  The "Keep It" camp is correct that we need a filter for commitment. But in signaling terms, we are currently paying for a signal that is cheap for the wrong people (those with free time) and expensive for the right people (those with high opportunity costs).

  By shortening the window and paying for the time, we make the *quality of the output* the handicap, rather than the *sacrifice of the input*. This aligns our selection mechanism with our actual goal: identifying research talent, not financial privilege.

  I move we adopt the **Modified Sprint** model.
