      *   **Wittgenstein (OC):** Hinge epistemology. Hinges are not empirical propositions in the usual sense; they are the *scaffolding* or *rules of the game* that allow empirical inquiry to happen. They are not known; they are *shown* in action. Doubting them undermines the language game itself. *Crucial Point:* Hinges are not justified by evidence; they are the background against which evidence is judged. They can change ("riverbed"), but not via the same logical mechanism as empirical hypotheses. They shift "fluidly," often without explicit argumentation, as a form of life changes.

  3.  **Analyze the Test Case (The Kilogram):**
      *   **Status before 2019:** The IPK *was* the kilogram. It wasn't that the IPK *weighed* 1 kg (which implies measurement error); it *defined* 1 kg.
      *   **The Change:** Metrologists moved to a definition based on $h$ (Planck's constant).
      *   **Why?** Stability issues. The IPK was drifting relative to copies. This created practical problems for high-precision metrology (the user's field).
      *   **The Mechanism:** A vote by the CGPM (General Conference on Weights and Measures). Based on technical arguments about stability and universality.

  4.  **Evaluate the Fit:**
      *   **Quinean View:** The definition of the kilogram is a central node. It was held true because it made the system of measurement work. When anomalies arose (drift between prototypes), the cost of keeping the old definition exceeded the cost of changing it. So, they revised the core. This fits *very* well. It was a pragmatic decision based on empirical pressure (drift).
      *   **Wittgensteinian View:** Was "The IPK is 1 kg" a hinge? In a sense, yes. It was the rule of the language game of mass metrology. You couldn't "measure" the IPK against the kilogram; it *was* the standard. However, Wittgenstein emphasizes that hinges are usually *unconscious* or *animal* certainties (e.g., "I have two hands," "The earth exists"). They aren't typically explicit institutional definitions voted on by committees. Wittgenstein's hinges are pre-rational; the kilogram definition was hyper-rational.
      *   **The Conflict:** The user notes that the hinge was retired by "committee vote backed by an actual physical argument." Wittgenstein says hinges aren't argued for; they stand fast. If you can argue for a change, it looks more like a Quinean revision.
      *   **Nuance:** Wittgenstein does allow for riverbed shift. But is a formal redefinition a "riverbed shift" or a "web revision"?
      *   **Key Distinction:** Quine sees the definition as a *statement* within the system (albeit a central one). Wittgenstein sees hinges as *constitutive of* the system.
      *   **Metrology Specifics:** In metrology, a definition is a *stipulation*. It's not an empirical claim. Quine blurs the analytic/synthetic distinction (that's the point of "Two Dogmas"). Wittgenstein maintains a distinction between *rules* (grammar) and *moves* (empirical claims), though in OC he complicates it.
      *   **The User's Experience:** Did the metrologist feel *certainty* (Wittgenstein) or *high probability* (Quine)? In the lab, you don't say "I'm 99.9999% sure this is the kg." You say "This *is* the kg." It's a rule. But the *reason* for changing it was empirical (drift).

  5.  **Drafting the Argument:**
      *   **Acknowledge the similarity:** Yes, they look alike. Both deal with foundational beliefs that resist doubt.
      *   **The Sharp Distinction:**
          *   **Quine:** It's all empirical, just some is deeper. Revision is *rational reconstruction*. You weigh costs/benefits. You can explain *why* you changed your mind using logic and evidence.
          *   **Wittgenstein:** Hinges are *non-epistemic*. They aren't "known." They are the conditions for knowing. Revision isn't a rational choice based on evidence; it's a shift in "form of life." You don't argue a hinge out; you drift away from it.
      *   **Applying to the Kilogram:**
          *   The IPK definition looks **Quinean** in its *revision*. It was changed because of empirical pressure (drift) and pragmatic calculation (stability of constants). This is classic web-rebalancing.
          *   However, the *status* of the IPK *before* 2019 looks **Wittgensteinian**. It wasn't a hypothesis. It was a rule. You couldn't doubt it without leaving the language game of SI units.
          *   **The Clincher:** The user asks: "If a hinge can be retired by an actual committee vote... doesn't that tell against Wittgenstein?" **Yes.** This is the weak point for Wittgenstein here. Wittgenstein's hinges are usually pre-reflective (e.g., "objects don't vanish when I look away"). Institutional definitions are explicit conventions.
          *   **Verdict:** Quine fits the *history and sociology* of the change better. Wittgenstein fits the *phenomenology of working* with the standard better (it felt like a rule, not a guess).
          *   **But wait, deeper cut:** The distinction between *definition* and *fact*. Quine says definitions are just very central beliefs. Wittgenstein says definitions are grammar. The kilogram change was changing the grammar. Quine says grammar is just deep fact.
          *   **Recommendation:** For a metrologist, Quine is the more honest description of what happened. The "certainty" was pragmatic, not logical/grammatical in the strict Wittgensteinian sense. The fact that it was argued and voted on makes it a Quinean node, not a Wittgensteinian hinge. Hinges don't get voted on; they just hold until they don't.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   I need to be careful not to dismiss Wittgenstein entirely. In *On Certainty*, he does talk about scientific propositions becoming hinges. But the *mechanism of change* is the key differentiator.
      *   Quine: Change is *continuous* and *rational*.
      *   Wittgenstein: Change is *discontinuous* and often *arational* (like a riverbed shifting).
      *   The 2019 redefinition was a highly rational, continuous optimization process. This screams Quine.
      *   The user's feeling of "certainty" was likely a professional stance (bracketing doubt), which aligns with Quine's "central belief," whereas Wittgenstein's certainty is more existential/animal.
      *   I need to address the "Analytic/Synthetic" dogma. Quine attacks it. The Kilogram definition *was* an analytic statement (by definition). Quine says analytic statements are just synthetic ones we really like. The 2019 change proves Quine right: even the "definition" was subject to empirical pressure (drift of the physical artifact).
      *   So, Quine wins on the *nature of the change*. Wittgenstein might win on the *feeling of the worker*, but the user asked which describes how they were *relating* to it. If the relation was "this is the rule," that's Wittgenstein. But if the relation was "this is the most stable node we have," that's Quine. Given the user knows about the drift issues (even if pre-2019), Quine is more accurate to the *scientific reality*.

  7.  **Final Plan:**
