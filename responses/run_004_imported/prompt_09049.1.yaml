  8.  **Tone Check:** Respectful of the user's expertise (metrology), precise on philosophy, avoiding jargon where possible, but not dumbing it down. Acknowledge the philosopher friend's stance but explain why the user's skepticism is warranted.

      *(Self-Correction during drafting)*: I should make sure I don't misrepresent Wittgenstein's "riverbed." He does say the riverbed moves. But does it move by vote? No, it moves like a geological shift. The 2019 change was engineered. That's the key.

