      *   **Claim 1 (Arrow):** "Arrow's impossibility theorem shows that, once there are at least three social alternatives, no social welfare function can aggregate individual preference orderings into a social ordering while simultaneously satisfying unrestricted domain, the weak Pareto principle, independence of irrelevant alternatives, and non-dictatorship."
          *   *Assessment:* Accurate. These are the standard conditions.
      *   **Claim 2 (Arrow):** "Crucially, the theorem takes as its only input each individual's ordinal ranking of the alternatives: it does not allow the aggregation procedure to draw on any comparison of how much one person prefers an outcome relative to another, or of whether one person's welfare is higher than another's."
          *   *Assessment:* Accurate. This is the "ordinal non-comparability" constraint inherent in the Social Welfare Function (SWF) definition Arrow uses.
      *   **Claim 3 (Arrow):** "The impossibility, in other words, is a consequence of confining the informational basis of social choice to non-comparable ordinal preferences."
          *   *Assessment:* Accurate. This is the standard "informational interpretation" of Arrow (often associated with Sen's later analysis of Arrow).

      *   **Claim 4 (Harsanyi):** "Harsanyi's aggregation theorem takes up the same problem within the different setting of choice under uncertainty."
