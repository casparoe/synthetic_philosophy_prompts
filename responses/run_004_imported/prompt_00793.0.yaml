      *   *Section 4: AI Remedies.* Address circumscription, etc. Explain they are "local fixes" for a "global problem." They work by assuming the world is mostly inert, which fails when global relevance kicks in.
      *   *Conclusion:* Summarize. The Frame Problem is the *computational cost* of Quinean Holism when applied to real-time agency.

