answer: |-
  **MEMORANDUM**

  **TO:** The Presiding Judge; Judge Kovacs
  **FROM:** Judge Anton Reiff
  **DATE:** 14 October 1951
  **SUBJECT:** People v. Elise V. – Preliminary Legal Position and Procedure

  Colleagues,

  I circulate this note to clarify my own thinking before we convene, and to propose a path forward that avoids both hypocrisy and impunity. We are tasked with judging a woman who denounced her husband to the Security Office in 1944. Under the statutes of the Party State, her act was not merely legal; it was a civic duty. The husband was sentenced by a tribunal that followed the procedural rules then in force. To punish the aunt now is to punish an act that was lawful when performed.

  We must not hide from this fact. There is a temptation to declare the old statutes void *ab initio*, to pretend they were never law because they were monstrous. I understand the appeal. It suggests that a legal order which betrays the inner morality of law—by abandoning publicity, by enforcing secret decrees, by stripping citizens of the capacity to follow rules—forfeits its claim to be treated as law at all. If the old regime's commands were merely tools of terror disguised as statutes, then the aunt obeyed no law, only a gun.

  But this reasoning carries a danger. If we simply declare the old laws null, we dodge the reality that we are choosing, right now, to punish conduct that was authorized by the sovereign power of the time. We risk replacing one fiction with another. We must admit that in convicting the defendant, we are applying a new standard to past conduct. We are making law retroactively. This is a heavy burden. It acknowledges that the new Republic is breaking the principle of non-retroactivity to secure a higher justice.

  However, I believe we must accept this burden. To dismiss the case because the aunt followed the rules of the tyrant is to validate the tyrant's rules. It suggests that legality is merely a matter of form, regardless of content. I propose we convict. We should argue that while the old statutes possessed the form of law, their application in this context—targeting private speech for political extermination—was so contrary to the purpose of law itself that it cannot shield her now. We do not say the statute was never written; we say it cannot serve as a defense against humanity.

  We must be explicit in the judgment. We cannot pretend this is business as usual. We are restoring the legal order by acknowledging where it was broken.

  **Procedure and Timetable:**
  To manage public expectation and protect the panel from political interference, I recommend the following:

  1.  **Closed Deliberations:** We meet in chambers tomorrow at 0900. No clerks present.
  2.  **Drafting:** I will prepare the initial opinion based on the reasoning above. It must be signed by all three of us to present a unified front.
  3.  **Verdict:** We deliver the judgment within ten days. Any longer invites speculation that we are divided or seeking guidance from the Ministry.
  4.  **Sentencing:** If we convict, sentencing should be suspended pending a review of clemency guidelines. This signals that while the act was criminal, the context was extraordinary.

  We cannot solve the past without staining the present. Let us ensure the stain is conscious, not accidental.

  A. Reiff
