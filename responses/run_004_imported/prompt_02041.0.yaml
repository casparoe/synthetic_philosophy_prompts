          *   *Thorne:* "Instrumental convergence. If they want to achieve *any* goal, they need coherence to not sabotage themselves."
      *   **Round 4: Closing.** Needs to feel unresolved but respectful.

  4.  **Refining the Dialogue (Self-Correction during drafting):**
