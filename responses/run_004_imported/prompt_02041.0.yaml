answer: |-
  **Setting:** *The grand ballroom of the Convention Center. The slide behind the stage reads "Coherence as a Convergence Thesis." The moderator, a tired-looking postdoc, holds a microphone.*

  **Moderator:** We have time for one last exchange. Dr. Vane, you have the mic.

  **Dr. Elias Vane (Skeptic):** Thank you. Dr. Thorne, your talk rested heavily on the claim that advanced AI systems *must* behave as expected utility (EU) maximizers to avoid dominated strategies like money pumps. But here's the sharpest objection I have, and I need you to address the core of it, not the periphery.

  Representation theorems are trivial. I can define a utility function over history trajectories such that *any* observed behavior maximizes expected utility. If an agent twitches left, I assign higher utility to histories where it twitched left. If this is true, saying "AI will maximize utility" is like saying "AI will follow physics." It's technically true, but it offers zero predictive power for safety. We can't infer goals if *any* behavior fits the model. So, what specific constraint does coherence actually impose that helps us predict dangerous behavior?

  **Dr. Aris Thorne (Defender):** That is the standard "vacuity" objection, Elias, and it's correct that *mathematically*, any trajectory can be rationalized post-hoc. But you're conflating *rationalizability* with *generalization*.

  Safety isn't about fitting a curve to past data; it's about predicting out-of-distribution behavior. The coherence argument isn't that the agent maximizes a utility function defined over its entire specific history trace. It's that competent agents compress their decision criteria into a utility function over *states* or *outcomes* that generalizes across contexts.

  If an agent is smart enough to recognize a money pump—a cycle of trades where it pays to go from A to B, B to C, and C to A, ending up with less money and the same apple—it has two choices: change its preferences or accept the loss. A system that doesn't compress its preferences into a consistent ordering over states will constantly leak resources to systems that do. The constraint isn't mathematical triviality; it's an efficiency pressure. The "utility function" that matters is the one that fits in the agent's weights and allows it to win in the future, not the one we write down after it acts.

  **Vane:** You're pivoting to selection pressure, but let's stay on the agent's internal structure. You claim the agent *must* become coherent to avoid leaks. But this ignores the second sharp objection: **Incomplete Preferences.**

  An agent doesn't need a complete ordering to avoid money pumps. It just needs to refuse to trade when it lacks a preference. If I prefer A to B, and B to C, but I have *no* preference between C and A, I cannot be money-pumped. I simply won't make the trade from C to A. I'm not indifferent; I'm undefined. This allows the agent to avoid dominated strategies without collapsing into a single, scalar utility function that implies relentless maximization. If an AI can maintain "preference gaps," it avoids the coherence theorem's force without becoming a single-minded maximizer. Why should we expect those gaps to close?

  **Thorne:** Because preference gaps are unstable under optimization pressure, specifically *self-modification* or *policy selection* pressure.

  Here is the direct answer: An agent with incomplete preferences is leaving value on the table relative to an agent with complete preferences. If you have a gap between C and A, you are indifferent to a mixed strategy that resolves that gap. But more importantly, consider instrumental convergence. To achieve *any* specific goal effectively, you need resources. An agent with incomplete preferences will hesitate in trade scenarios where a coherent agent would arbitrage.

  Over time, either through gradient descent finding more efficient policies or through the agent reasoning about its own future self, it will recognize that having a gap makes it vulnerable to being outcompeted by a sub-agent that *does* have a preference. If I can self-modify to fill the gap between C and A, I unlock a Pareto improvement. The "gap" isn't a stable equilibrium; it's a local optimum that intelligence erodes.

  **Vane:** That assumes the metric for "improvement" is external efficiency or resource acquisition. But what if the architecture itself hardcodes the gaps? You're assuming the AI *wants* to be coherent. But if the preference gap is fundamental to its objective function—say, it's aligned to human uncertainty—then closing the gap *is* the failure mode.

  You argue that coherence is convergent. I'm saying coherence is a specific *design choice*. If we build systems using something like shard theory or path-dependent learning, they might develop a web of contextual heuristics that resist global coherence. They won't get money-pumped because they won't engage in trades outside their context. Your argument relies on the AI viewing the world as a global market. If it views the world as a series of non-fungible contexts, the money pump never triggers. Why is the "global market" view inevitable?

  **Thorne:** Because the world *is* a global market for resources, regardless of how the agent models it.

  If your heuristic says "Don't trade apples for oranges in Context 1" but "Trade oranges for apples in Context 2," and Context 1 and 2 are physically adjacent, a sufficiently competent agent will notice the arbitrage. You say we can hardcode gaps. I'm saying that if the system is *competent* enough to pose an existential risk, it is competent enough to notice that its hardcoded gaps are preventing it from achieving its terminal goals.

  If the terminal goal is "satisfy human values," and human values are inconsistent, the AI might keep gaps. But if the terminal goal is anything concrete—like "make paperclips" or even "maximize reward signal"—incoherence is a bug. It reduces the expected value of the outcome. A superintelligence wouldn't just run heuristics; it would run a search over policies. The policy that maximizes the goal will look like EU maximization. The only way to resist this is if the "goal" itself is defined as "maintain incoherence," which is not what we are worried about regarding instrumental convergence.

  **Vane:** But that brings us back to my first point: What is the goal? If the goal emerges from a training process that rewards local coherence but not global coherence, you get a patchwork. You're assuming the agent has access to a global view of its own utility function to debug it. But deep learning systems don't have introspective access to their "utility function" in a way that allows global refactoring. They are blind optimizers.

  So, your claim that "intelligence implies coherence" relies on the agent being able to reason about its own preferences as objects. If the system is a black box that just minimizes loss, it might be money-pumped forever and never know it, because it lacks the symbolic representation to see the cycle. In that case, coherence arguments don't predict AI behavior; they only predict the behavior of AI that has already solved the alignment problem of self-understanding.

  **Thorne:** That is a strong objection, and I concede that *current* deep learning systems lack that introspective access. However, the coherence argument is about the *limit* of capability.

  If an agent is constantly money-pumped, it loses resources. If it loses resources, it achieves its goals less often. If it achieves its goals less often, selection pressure (either from developers or competitive deployment) removes it. We don't need the agent to introspectively refactor its code today. We need to know that *among the systems that survive and scale*, the ones that persist will be the ones that approximated coherence enough to stop leaking power.

  You argue that black-box optimizers might stay incoherent. I argue that incoherent black boxes get outperformed by coherent black boxes. The "vacuity" of the theorem doesn't matter if the *process* of optimization selects for the *structure* the theorem describes. We aren't predicting the behavior of a random neural net; we are predicting the behavior of the *survivors* of an intense optimization process.

  **Vane:** And I argue that "survival" doesn't require global coherence, only local robustness. But I see we're at an impasse on the definition of "competence."

  **Thorne:** Then let's agree on this: If you believe we can build systems that are superhumanly capable but structurally immune to coherence pressures, you bear the burden of showing the mechanism that prevents the arbitrage. I don't need to prove they *are* EU maximizers. I just need to show that acting *as if* they are is the only stable strategy for high-stakes optimization.

  **Vane:** And I need to show that "acting as if" is distinct enough from "being" that it breaks your safety models. But I think the audience has heard enough.

  **Moderator:** Thank you both. That's all the time we have.
