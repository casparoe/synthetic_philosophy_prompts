          *   Researcher B (Skeptic): Believes coherence arguments are vacuous or that incomplete preferences allow avoiding money pumps without full coherence.
      *   **Format:** Dialogue during Q&A after a conference talk.
      *   **Constraint:** Each character must *directly answer* the other's sharpest objection, not just restate their position.
