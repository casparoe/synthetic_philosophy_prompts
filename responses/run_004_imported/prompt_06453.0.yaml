answer: |-
  Here are 10 interview questions tailored for your podcast, including the three specific theoretical deep-dives you requested with anticipated follow-ups.

  ### **Warm-Up & Motivation**

  **1.** You've spent your career arguing that entities like courts and central banks aren't just metaphors, but genuine agents. What was the specific moment or case study that convinced you that methodological individualism was insufficient to explain how these bodies actually function?

  **2.** In the literature, there's often a distinction between "aggregative" models of groups (just summing up votes) and "collective" models (forming a joint intention). Where do you think most legal and economic institutions currently fall, and where *should* they fall to be considered rational agents?

  ### **Theoretical Deep-Dives (Required)**

  **3. [Ontology & Inconsistency]**
  Critics often argue that even if a group produces inconsistent judgments via the discursive dilemma, that doesn't prove the group is a *real* subject; it could just be a complex machine where the output supervenes on individual inputs without any separate ontology. Why does the phenomenon of collective inconsistency specifically demand a realist commitment to a group-level mind, rather than just a complicated form of supervenience individualism?

  *   **Follow-up (Keyed to her likely answer):** *She will likely argue that the inconsistency arises from the group's structural commitment to rationality, not individual irrationality.*
      *   **Ask:** "If the inconsistency is structural rather than psychological, does that mean group agency is purely a matter of institutional design? If so, can a group lose its agency if its constitution is temporarily suspended, even if the members remain the same?"

  **4. [The Bootstrapping Problem]**
  To resolve the discursive dilemma, a group must adopt a procedure—either premise-based or conclusion-based. But choosing that procedure is itself a decision. If the individuals vote on the procedure, aren't we just grounding group agency in individual agency? How do you escape the charge that the group's ability to choose its own decision-rule presupposes the very agency you're trying to prove?

  *   **Follow-up (Keyed to her likely answer):** *She will likely appeal to a "constitutional moment" or prior authorization.*
      *   **Ask:** "Doesn't that push the problem back a step? If the constitution was ratified by individuals who didn't yet constitute the group agent, is the group's agency ultimately derivative and revocable, rather than fundamental?"

  **5. [List-Pettit Impossibility Theorem]**
  Your work leans heavily on the List-Pettit impossibility theorem. We know we can't have it all: Universal Domain, Anonymity, Systematicity, and Collective Rationality are incompatible. If you were forced to sacrifice exactly one of these axioms to preserve the reality of group agents, which one goes, and what is the normative cost of that sacrifice?

  *   **Follow-up (Keyed to her likely answer):** *Realists often sacrifice Systematicity (allowing premise-based procedures that treat propositions differently).*
      *   **Ask:** "If we sacrifice Systematicity to allow premise-based reasoning, doesn't that grant the group epistemic authority over the members? How do we prevent that from becoming a form of technocratic elitism where the 'group reason' overrides individual judgment?"

  ### **Responsibility & Identity**

  **6.** If a court or a firm is a genuine agent, it seems liable for genuine blame. But we can't put a corporation in prison. How do you conceptualize group-level punishment in a way that isn't just a proxy for punishing the individual members?

  **7.** Groups have turnover; the Federal Reserve Committee today isn't made of the same people as ten years ago. What accounts for the diachronic identity of the group agent? Is it the continuity of the function, the rules, or something else?

  ### **Normative & Democratic Implications**

  **8.** There is a tension between group rationality and democratic voice. Sometimes, for a group to be rational (consistent), it must ignore the majority view on specific propositions. Does defending group agency inherently commit you to a view where rationality can sometimes trump democratic participation?

  **9.** Do different types of groups have different agential capacities? For example, is a monetary policy committee capable of a different *kind* of judgment than a social movement or a family? Does the "discursive dilemma" apply equally to all of them?

  ### **Closing**

  **10.** What is the most persistent misunderstanding of your work that you encounter, particularly from those who insist that only human beings can be true subjects of judgment?
