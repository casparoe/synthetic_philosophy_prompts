      *   *Actually, the standard view:* High volume in prediction markets is generally good (more data points). But the No-Trade lens says volume = presence of noise. I need to balance these.
      *   *Resolution:* The price is the best estimate *conditional on the market structure*. But the existence of volume tells you the "Common Knowledge of Rationality" is broken. So you can't treat the price as a Aumann-aggregated truth. You treat it as a weighted average of rational and irrational beliefs.

