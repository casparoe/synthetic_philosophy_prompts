          *   *Refining the Volume point:* High volume often means low consensus (high dispersion of belief). Low volume might mean consensus. So high volume $\neq$ high confidence in the price's accuracy regarding the *true* state, but it does mean high confidence in the price as a *clearing* mechanism.
