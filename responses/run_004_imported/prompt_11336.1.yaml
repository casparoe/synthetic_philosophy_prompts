      *   *Setup:* Need to establish the baseline. Ex-ante Pareto optimality is crucial. If we are already at an optimum given *public* info, any trade must be based on *private* info.
      *   *The Mechanism:* It's not just "I have info." It's "I know that you know that I know..."
      *   *Step-by-Step:*
          1.  Agent A proposes a trade.
          2.  Agent B asks: "Why is A proposing this?"
          3.  B infers A has private info favoring the trade.
          4.  B updates their belief based on A's willingness to trade.
          5.  Now B sees the trade is less favorable (or negative EV).
          6.  B rejects.
          7.  A anticipates this (Common Knowledge of Rationality).
          8.  A never proposes the trade in the first place.
      *   *The "Blue-Eyed Islander" connection:* It's about the hierarchy of knowledge. It's not just "I know X," it's "I know that you know that I know X." The offer itself becomes a public signal that swamps the private signal.

  3.  **Part 2: Which Assumption Breaks?**

      *   *Candidate 1: Common Priors.* If we start with different priors, we can agree to disagree and trade based on that. (Harrison-Kreps). This is a strong candidate, but often viewed as "irrational" in the strict Bayesian sense.
      *   *Candidate 2: Common Knowledge of Rationality.* If I think you might be a noise trader, I don't infer your private info from your trade. I infer you're random. This is the standard "Glosten-Milgrom" / market microstructure resolution.
      *   *Candidate 3: Pareto Optimality.* Maybe we aren't at an optimum initially (e.g., hedging needs, liquidity shocks).
