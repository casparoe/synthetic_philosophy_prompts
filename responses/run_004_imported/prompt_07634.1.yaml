      *   Show the hesitation. The chip hovering over the felt.
      *   The "Last Time" aspect: Adds pressure. If this is the last hand, the future value of reputation is zero, but the past value is everything.

  7.  **Refining the Ending:**
      *   They finish the hand. One wins.
      *   They shuffle for the next hand.
      *   Why? Because the game isn't about extraction of value. It's about communion.
      *   Or, one of them makes a bet that is logically suicidal but emotionally necessary.
      *   Let's go with: The bet is made *knowing* it's a bad bet financially, but it's the only way to validate the other person's mind. To acknowledge the other is still there.

