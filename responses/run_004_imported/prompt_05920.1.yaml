answer: |-
  **Setting:** *A quiet corner of a coffee shop near the Berkeley campus. Two laptops are open, surrounded by empty mugs. Julia (Pro-Reflection) and Max (Anti-Reflection) have been arguing for an hour.*

  **Max:** Look, I'm telling you, Sleeping Beauty is the nail in the coffin for the Reflection Principle. It's too clean. On Sunday, Beauty knows the setup. She knows the coin is fair. She assigns $P(\text{Heads}) = 1/2$. She also knows that on Monday, when she wakes up, she will assign $P(\text{Heads}) = 1/3$. She is certain of her future credence. Reflection says her current credence should match that future credence. It doesn't. $1/2 \neq 1/3$. End of story.

  **Julia:** It's not the end of the story if you're misidentifying the propositions. You're treating "Heads" on Sunday as identical to "Heads" on Monday. But in Sleeping Beauty, the context is self-locating. On Sunday, "Heads" means "The coin landed Heads." On Monday, given the amnesia, "Heads" effectively means "The coin landed Heads *and* this is a waking moment." The indexical component changes the logical space. Van Fraassen's principle assumes a stable mapping of propositions across time.

  **Max:** That feels like moving the goalposts to save the theorem. From Beauty's perspective, the *ontology* of the coin hasn't changed. It's a physical object with a bias. If I tell you, "Tomorrow I will rationally believe the coin is biased 2:1 against Heads," and you don't update now, you're leaving money on the table. That's the whole point of Conservation of Expected Evidence. If I know where my belief is going to move, I should already be there.

  **Julia:** Conservation of Expected Evidence (CoEE) applies to *evidence*. In standard Bayesian updating, you move because you gain information. In Sleeping Beauty, Beauty doesn't gain non-indexical information on Monday. She knew she would wake up. So, by CoEE, she *shouldn't* update on the coin bias. The reason Thirders say she moves to 1/3 is because the *sampling* changes. She is sampled twice on Tails, once on Heads. That's a change in the decision context, not a change in the truth of the proposition relative to her prior.

  **Max:** But she *does* update! Almost everyone on the forum accepts the Thirder position for betting purposes. If you offer her a bet on Monday, she takes 1:2 odds. If Reflection holds, she should have taken 1:2 odds on Sunday. But on Sunday, she takes 1:1 odds. So she is diachronically inconsistent. And if she's inconsistent, I can Dutch Book her. I can sell her a bet on Sunday that pays if Heads, and buy a bet from her on Monday that pays if Tails, and lock in a profit.

  **Julia:** You can only Dutch Book her if you're allowed to offer the bet *every time she wakes up*. If you offer the bet once on Sunday, and then once on Monday *only if she wakes up*, the expected value calculation shifts because the *number of times* the bet is settled changes. On Tails, you settle the Monday bet twice. On Heads, once. Reflection isn't violated; the *payoff structure* is time-dependent. The credence of 1/3 on Monday isn't a belief about the coin's physical bias; it's a belief about her location in the experimental timeline.

  **Max:** Okay, but that's my point. If "credence" splits into "physical bias credence" and "self-locating credence," then Reflection only applies to the first one. But agents live in the second one. I care about what norms guide an agent who expects to lose memory. Van Fraassen explicitly said Reflection fails if you expect to forget. But Beauty's forgetting isn't an accident; it's a designed feature of the rational process she's endorsing. If a normative principle throws up its hands the moment we introduce planned amnesia, is it really a principle of *rationality*, or just a principle of *standard learning*?

  **Julia:** It's a principle of standard learning because it's derived from the coherence of probability measures over time. If you introduce memory loss, you break the chain of conditionalization. You're no longer a single agent persisting through time in the sense the math requires; you're a sequence of agent-stages with broken links. I'm not saying Beauty is irrational on Monday. I'm saying the relation between Sunday-Beauty and Monday-Beauty isn't the relation Reflection governs. It's not "Current Self vs. Future Self"; it's "Current Self vs. Future Self-Clone with Less Data."

  **Max:** "Less Data" is the key phrase. She knows on Sunday she will have less data on Monday. Reflection says: $C_0(P \mid C_t(P) = x) = x$. The condition is that she is *certain* her future credence will be $x$. She *is* certain. She knows the protocol. The fact that the future credence arises from *less* data (due to amnesia) doesn't change the fact that she can predict it. If I know I'm going to take a drug that makes me think $2+2=5$, Reflection says I shouldn't align with that. But Beauty isn't becoming irrational; she's becoming *centered*.

  **Julia:** But is the proposition $P$ the same? Let's formalize it. Let $H$ be "Coin is Heads."
  Sunday: $C_0(H) = 1/2$.
  Monday: $C_1(H) = 1/3$.
  But on Monday, her evidence includes "I am awake now." Let's call that $E_{now}$.
  $C_1(H) = C_0(H \mid E_{now})$.
  On Sunday, she doesn't have $E_{now}$. She has "I will have $E_{now}$."
  The problem is that $E_{now}$ is indexical. It refers to a specific time. On Sunday, "now" is Sunday. On Monday, "now" is Monday. You can't conditionalize on an indexical you don't possess yet. So the condition for Reflection—that you can conditionalize on the *fact* of your future credence—fails because the content of that credence is tied to an indexical you can't fully grasp from the outside.

  **Max:** That sounds profound, but practically, it means I can't use Reflection to plan. Suppose I'm Beauty. I want to pre-commit to a betting strategy on Sunday. If I use Reflection, I say, "My future self will be 1/3, so I should act as if it's 1/3 now." If I don't, I say, "It's 1/2 now, 1/3 later." If I act as if it's 1/2 now, I make different pre-commitments than if I act as if it's 1/3. Which one wins money? The 1/3 strategy wins money in the long run of experiments. So the "rational" credence for *planning* is the future one. Reflection tells me to ignore the future one. Therefore, Reflection is bad advice for self-locating agents.

  **Julia:** No, Reflection tells you that your *current* credence is the correct anchor for *current* decisions, and your *future* credence is the correct anchor for *future* decisions. The conflict arises because you're trying to use a single probability measure to govern a scenario where the agent is duplicated. This is why people move to Updateless Decision Theory (UDT) or similar frameworks. UDT bypasses the credence update entirely. It says: "Choose the policy on Sunday that maximizes expected utility across all wakings." You don't need Reflection to hold if you're optimizing policies rather than updating beliefs.

  **Max:** Aha! So you admit it. You have to switch to a different decision theory to make the numbers work. That means standard Bayesian credence + Reflection is insufficient for these cases. You need to patch the system. I'm saying the patch reveals a hole in the foundation. Reflection assumes that "believing" is a stable state across time. SB shows that "believing" is fragile under self-location. If the principle doesn't cover cases where I know exactly how my mind will change due to structural constraints, it's not a universal norm. It's a local heuristic.

  **Julia:** I'd say it's a universal norm for *propositions that don't depend on the agent's temporal location*. "The coin is Heads" *looks* like such a proposition, but in SB, the *evidence* for it is entangled with location. If we define the proposition precisely as "The coin landed Heads in the actual world," Reflection *does* hold for Halfers. They say $C_0(H) = 1/2$ and $C_1(H) = 1/2$. The 1/3 is only for "This waking is associated with Heads."
  So, either:
  1. You're a Halfer, Reflection holds, and 1/3 is a betting quotient, not a credence.
  2. You're a Thirder, Reflection doesn't apply to centered propositions.
  In neither case is Reflection "violated" in its proper domain. You're trying to apply it to centered propositions without adjusting the framework.

  **Max:** But the Halfer position is notoriously weird on betting. If Beauty is offered a bet every time she wakes up, and she's a Halfer, she loses money on Tails. She knows she'll lose money, she knows her future self will bet differently, and she doesn't align. That's diachronic inconsistency.
  My crux is this: If I know my future self is rational, and I know what they will believe, and I *disagree* with them now, who is wrong?
  In SB, Sunday-Beauty thinks Monday-Beauty is rational. Monday-Beauty thinks her own credence is rational. They disagree on $P(H)$.
  If Reflection holds, one of them must be irrational.
  If you say "They're evaluating different propositions," you're saying rational agents can disagree on the truth of "The coin is Heads" solely because of what day it is. That makes truth indexical. And if truth is indexical, Reflection—which assumes stable truth values—can't be the master norm.

  **Julia:** Truth isn't indexical, but *access* to truth is. Look, think about the Dutch Book again. To Dutch Book her, *you* (the bookie) have to know what day it is. Beauty doesn't. The asymmetry of information allows the book. Reflection assumes the agent has access to the same logical relations across time. In SB, the agent's *identity* is smeared across time.
  I'm not saying Reflection is perfect. I'm saying SB isn't a counterexample; it's a category error. It's like saying Newton's Laws are false because they don't predict quantum tunneling. No, they just don't apply to that domain. Reflection applies to agents with persistent identity and monotonic information growth. SB is an agent with fractured identity and non-monotonic information.

  **Max:** "Fractured identity" is a metaphysical claim, not a mathematical one. Mathematically, it's a probability space with conditional dependencies. If the math of Reflection breaks there, then the math is limited.
  Here's my final move: Yudkowsky's "Conservation of Expected Evidence" post was popular because it gave people an intuitive handle on why you can't just *decide* to believe things. It said: "You can't expect your beliefs to shift in a specific direction without evidence."
  In SB, Beauty expects her belief to shift to 1/3 without new evidence about the coin.
  If you say "Ah, but she gets indexical evidence," you're redefining "evidence."
  If you redefine evidence to include "waking up when you knew you would wake up," then CoEE becomes trivial.
  If CoEE becomes trivial, Reflection loses its normative bite. It stops telling you how to avoid bias and starts just describing whatever you happen to believe.
  I'd rather keep the bite and admit there are exceptions. Reflection is a rule for agents who don't get cloned or amnestied.

  **Julia:** And I'd rather keep the rule and admit that "credence" is more subtle than "betting odds." If you separate the *degree of belief* (which stays 1/2) from the *decision weight* (which becomes 1/3 due to duplication), Reflection is safe. You're conflating the map with the territory. The map (credence) reflects the territory (coin bias). The decision weight reflects the map *plus* the agent's footprint in the territory.
  Reflection governs the map. SB changes the footprint.
  So, no exception. Just a confusion about what credence is *for*.

  **Max:** (Sighs, closing laptop) So you think credence shouldn't guide action directly in these cases?

  **Julia:** I think credence guides action *given a decision theory*. In SB, the decision theory needs to account for the duplication. The credence itself can remain stable.

  **Max:** And I think if your credence doesn't match the odds you take when money is on the line, you're engaging in self-deception. If I have to act like a Thirder to win, I'm a Thirder. And if I'm a Thirder, Reflection is dead.

  **Julia:** Then we agree on the math, and we disagree on whether "Reflection" is the name of the math or the name of the philosophy.

  **Max:** I'll drink to that. But I'm still betting 1:2 on Heads next time we run the experiment.

  **Julia:** And I'll take the other side on Sunday, and the other side on Monday. See who's Dutch Booked.

  **Max:** Deal.
