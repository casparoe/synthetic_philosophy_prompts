      *   **Point 2: The Cost of Structure.** Imposing $P(H|R) = 3/4$ reduces the entropy within $R$. To minimize the global distance from the uniform prior, the system compensates by reducing the weight of the region where entropy was forced down. It's a "conservation of surprise" argument.
