      *   **Standard Objection:** Van Fraassen and others argue this is irrational. Information about the internal structure of $R$ shouldn't affect the probability of $R$ vs. $B$.
      *   **My Task:** Argue the *opposite* side. Defend the MinEnt result. Argue that the drop in $P(R)$ is rational and that the "irrelevance intuition" smuggles in unwarranted assumptions.
      *   **Constraint:** Do not summarize the debate. Do not hand-wave about "objectivity." Get into the mechanics of *why* MinEnt forces this and why that mechanics is epistemically virtuous.

  2.  **Deconstruct the Judy Benjamin Scenario:**
