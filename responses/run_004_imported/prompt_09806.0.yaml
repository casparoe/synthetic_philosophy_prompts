      *   **Section 2: The Mechanics of "Closeness".** Explain KL divergence not just as distance, but as informational work. Imposing a ratio constraint reduces entropy in $R$. To stay close to the high-entropy prior, the system shifts mass to the high-entropy region ($B$).
      *   **Section 3: The "Default Status" Argument.** $B$ remains the "control group." $R$ is the "treatment group." When you learn the treatment group has specific structure, it distinguishes it from the background. The background becomes the safer bet for "generic" probability mass.
