      *   **Intuition to Attack:** "Information about $R$'s internals is probabilistically independent of $R$'s existence."

  3.  **Brainstorming the Defense (The "Pro-MinEnt" Position):**
      *   *Why does the shift happen?* It happens because MinEnt treats the constraint as a global structural constraint on the distribution, not a local causal update. It preserves the *ratios* of probabilities where not constrained, but the normalization condition forces a trade-off.
      *   *What is the epistemic justification?* The key is the interpretation of the prior. A uniform prior isn't just "I know nothing." It encodes a specific symmetry assumption. When you break symmetry in one sector ($R$), you must ask: *why* did that symmetry break?
