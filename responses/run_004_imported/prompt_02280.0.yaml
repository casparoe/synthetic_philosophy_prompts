answer: |-
  This is a fantastic rabbit hole. It is genuinely rare to find someone working in forecasting calibration who stumbles into Jim Joyce's *The Accuracy of Belief* (1998) and the subsequent Epistemic Utility Theory (EUT) literature without a philosophy department pushing them there. Your frustration is warranted: the literature is dense, and the distinction between "proper" and "strictly proper" is often glossed over in a way that obscures the mechanical engine of the argument.

  Since you deal with Brier scores daily, you have a massive advantage over 90% of philosophy PhDs discussing this. You know the terrain; you just need the map for the specific philosophical topography.

  Here is the breakdown of the mechanics, followed by the verdict on Dutch Book vs. Accuracy-First.

  ---

  ### Part 1: The Mechanics of Accuracy-Dominance

  The core claim of the Accuracy-First program (championed by Joyce, Pettigrew, Leitgeb, etc.) is **Accuracy-Dominance**.

  **The Theorem:** If your credence function $c$ violates the probability axioms, there exists a probabilistic credence function $c^*$ such that $c^*$ is strictly more accurate than $c$ in *every* possible world.

  **The Condition:** This theorem *only* holds if the scoring rule used to measure accuracy is **strictly proper**.

  #### 1. What "Strictly Proper" Actually Does
  In your work, you likely use "proper" to mean "the expected score is minimized when I report my true probability."
  *   **Proper:** If my true credence is $p$, reporting $p$ minimizes my expected loss.
  *   **Strictly Proper:** If my true credence is $p$, reporting $p$ is the *unique* minimizer of my expected loss.

  **Why does strictness matter?**
  If a rule is proper but not *strictly* proper, there might be other reports $q \neq p$ that yield the same expected loss. If that's the case, the geometry of the "accuracy landscape" becomes flat in certain directions. The Accuracy-Dominance argument relies on the probability simplex (the set of all coherent credences) being a convex set, and the "isoscore" surfaces of the scoring rule being strictly convex (like spheres).

  If the scoring rule isn't strictly proper (e.g., the Linear/Absolute Error rule $S = |c - w|$), the isoscore surfaces are diamond-shaped (L1 norm). If you are outside the probability simplex, you might not have a unique "closest point" inside the simplex that beats you in all worlds. In fact, with Absolute Error, you are often incentivized to report 0 or 1 regardless of your actual belief, which severs the link between "minimizing score" and "honest credence."

  **Concrete Failure Mode (Absolute Error):**
  Imagine you have a credence of 0.6 in proposition $A$.
  *   **Truth:** $A$ is True (1). Score = $|0.6 - 1| = 0.4$.
  *   **Truth:** $A$ is False (0). Score = $|0.6 - 0| = 0.6$.
  *   **Expected Loss** (assuming 0.6 is your true prob): $0.6(0.4) + 0.4(0.6) = 0.48$.

  Now imagine you lie and report 1.0 (certainty).
  *   **Truth:** $A$ is True (1). Score = $|1.0 - 1| = 0$.
  *   **Truth:** $A$ is False (0). Score = $|1.0 - 0| = 1.0$.
  *   **Expected Loss:** $0.6(0) + 0.4(1.0) = 0.40$.

  **Result:** With Absolute Error, you minimize expected loss by *extremizing*, not by reporting your true credence. If the scoring rule doesn't punish you for lying, you can't use it to prove that "coherent beliefs are more accurate." The dominance argument collapses because the "accurate" thing to do is to be a dogmatic liar, not a probabilist.

  **Brier Score (Quadratic Loss) is Strictly Proper:**
  $S = (c - w)^2$. The expected loss is a parabola. The minimum is unique. This ensures that the "gradient" of accuracy always points toward the truth vertices $(1,0)$ or $(0,1)$, and the probability simplex sits squarely between them.

  #### 2. The Toy Reconstruction (2 Propositions)
  Let's construct the dominance proof you asked for. We need two propositions to show a violation of additivity. Let the propositions be $A$ and $\neg A$.
  The truth values in any world must be $w = (1, 0)$ or $w = (0, 1)$.
  The set of **Probabilistic Credences** is the line segment where $c(A) + c(\neg A) = 1$ and $c \in [0,1]$.

  **The Incoherent Forecaster:**
  You have a bad day. You assign:
  *   $c(A) = 0.8$
  *   $c(\neg A) = 0.8$
  *   Sum = 1.6 (Violation of additivity).

  **The Dominating Coherent Forecaster:**
  We need to find a $c^*$ on the probability line ($x + y = 1$) that has a lower Brier score in *both* worlds. Geometrically, the Brier score is Euclidean distance squared. We are looking for the point on the line $x+y=1$ closest to our incoherent point $(0.8, 0.8)$.
  By symmetry, the closest point is the projection: $c^*(A) = 0.5, c^*(\neg A) = 0.5$.

  **World 1: $A$ is True.** Truth vector $w = (1, 0)$.
  *   **Incoherent Score:** $(0.8 - 1)^2 + (0.8 - 0)^2 = (-0.2)^2 + (0.8)^2 = 0.04 + 0.64 = \mathbf{0.68}$
  *   **Coherent Score:** $(0.5 - 1)^2 + (0.5 - 0)^2 = (-0.5)^2 + (0.5)^2 = 0.25 + 0.25 = \mathbf{0.50}$
  *   **Result:** Coherent wins ($0.50 < 0.68$).

  **World 2: $A$ is False.** Truth vector $w = (0, 1)$.
  *   **Incoherent Score:** $(0.8 - 0)^2 + (0.8 - 1)^2 = (0.8)^2 + (-0.2)^2 = 0.64 + 0.04 = \mathbf{0.68}$
  *   **Coherent Score:** $(0.5 - 0)^2 + (0.5 - 1)^2 = (0.5)^2 + (-0.5)^2 = 0.25 + 0.25 = \mathbf{0.50}$
  *   **Result:** Coherent wins ($0.50 < 0.68$).

  **Conclusion:** The coherent credence $c^*$ strictly dominates the incoherent credence $c$. It doesn't matter what the world looks like; if you are incoherent, you are unnecessarily inaccurate. You are leaving accuracy on the table.

  ---

  ### Part 2: Dutch Book vs. Accuracy-First (Taking a Side)

  This is where the philosophy gets spicy. Your friend is hyping the "nonpragmatic" label because, in the history of epistemology, it solves a massive categorization error.

  #### The Dutch Book Argument (The Pragmatic Case)
  *   **The Logic:** If your credences are incoherent (e.g., $P(A) + P(\neg A) > 1$), a bookie can construct a set of bets (buying/selling tickets based on your odds) that guarantees you a net loss.
  *   **The Norm:** You ought to be probabilistic because otherwise, you are **exploitable**.
  *   **The Weakness:** It conflates *belief* with *betting behavior*. It says incoherence is irrational because it makes you poor (or resource-poor).
      *   *Objection 1:* What if I don't bet? If I'm a hermit who never wagers, am I rational if my beliefs are insane? Dutch Book implies yes, or at least it has no grip on me.
      *   *Objection 2:* Why should logic be about money? It seems contingent. If utils didn't map linearly to money, or if I had a weird utility function, the Dutch Book might not hold. It makes the laws of logic dependent on the laws of economics.

  #### The Accuracy-First Argument (The Nonpragmatic Case)
  *   **The Logic:** If your credences are incoherent, you are **inaccurate**. Full stop.
  *   **The Norm:** You ought to be probabilistic because belief *aims at truth*.
  *   **The Strength:** It isolates **Epistemic Rationality** from **Pragmatic Rationality**.
      *   It argues that the primary function of a belief is to represent the world. If your representation violates the laws of probability, it is mathematically guaranteed to be a worse representation of reality than a coherent one, regardless of whether you ever bet on it.
      *   It vindicates Probabilism as a *constitutive norm* of belief, not an instrumental norm for gamblers.

  #### The Verdict: Accuracy-First is Stronger (for Epistemology)
  I am taking the side of **Accuracy-First**, specifically for the project of defining *epistemic* rationality. Here is why:

  1.  **The "Aim of Belief" Intuition:** Most philosophers agree that belief is a mental state that "aims at truth." You cannot believe $X$ while thinking $X$ is false. The Dutch Book argument ignores truth entirely; it only cares about consistency in action. The Accuracy argument directly quantifies the distance between belief and truth. It aligns the norm (Probabilism) with the goal (Truth).
  2.  **Universality:** As mentioned, Dutch Book requires a link to action (betting). Accuracy requires only a link to the world. A brain in a vat that doesn't act can still be epistemically irrational if its credences are incoherent. Accuracy captures this; Dutch Book struggles.
  3.  **The "Why" Question:** If you ask a Dutch Book theorist, "Why shouldn't I lose money?" they have to appeal to prudence. If you ask an Accuracy theorist, "Why shouldn't I be inaccurate?" they appeal to the very definition of belief. The latter is a deeper philosophical foundation.

  **However, a necessary caveat (The "Weeds"):**
  The Accuracy argument is not without scars. It depends heavily on the **choice of scoring rule**. Joyce's original theorem showed that for *any* incoherent set, there is a coherent set that dominates it *provided* the scoring rule is strictly proper. But critics (like Miriam Schoenfield) have pointed out that there are *many* strictly proper scoring rules.
  *   Does the dominance hold for *all* strictly proper rules? (Yes, for simple probabilism).
  *   But if you want to argue for *Conditionalization* (how to update beliefs), the choice of scoring rule matters more.
  *   Furthermore, the argument assumes "Veritism"—that accuracy is the *only* epistemic good. Some argue understanding or explanation matters too.

  **Why "Nonpragmatic" is a Selling Point, not a Footnote:**
  In philosophy, "pragmatic" often carries a whiff of "merely useful" rather than "true." If Probabilism is only pragmatically vindicated, it's a rule for successful gamblers. If it is nonpragmatically vindicated, it is a law of thought.
  Your friend is excited because Accuracy-First successfully argues that **probability theory is the logic of partial belief**, not just the calculus of prudent betting. It moves probability from the domain of Decision Theory into the domain of Epistemology.

  ### Summary for your Discord Group
  1.  **Mechanically:** The argument works because the Probability Simplex is a convex set, and Strictly Proper Scoring Rules (like Brier) create convex "accuracy spheres." If you are outside the simplex, geometry dictates there is always a point inside the simplex closer to all truth-vertices than you are. Non-strictly-proper rules break this geometry.
  2.  **Philosophically:** Accuracy-First is superior because it treats incoherence as a failure of *representation* (epistemic defect) rather than a failure of *action* (pragmatic defect). It explains why you should be probabilistic even if you never place a bet.

  Since you build calibration tooling, you are essentially building an **Epistemic Utility Meter**. You aren't just measuring financial risk; you are measuring the distance between a mind and the world. That's the philosophical payoff.
