  (2) Devon says that's a bad standard because "my absolute best case" is basically a number you get to just make up — everyone will claim the rosiest story about what they could pull off solo, and whoever's more shameless about it comes out ahead under Mia's rule. Devon wants to instead pick whatever split makes "the extra value each of us gets over walking away, multiplied together across the both of us" as big as possible, since that doesn't need anybody's fantasy numbers, just what's actually achievable between the two of them.
