  So my friend Mia and her friend Devon (they've co-run a youtube channel together since freshman year) got into this whole argument over text that's been living in my head all week, and I need an outside opinion from someone who has no clue who either of them is. They'd always just split ad and sponsor money 50/50, no real system, it just worked fine. But Devon just got offered a paid editing gig with a way bigger creator, so Devon could honestly walk away tomorrow and still make solid money solo, while Mia can't really run the channel alone and would make basically nothing without Devon. So now they're trying to hash out a new split going forward and it turned into this whole thing (I wrote it down after, not word for word but pretty close):

