      *   *Claim 2: War is a "necessity."*
          *   Type of necessity: Dialectical/Ethical, not just causal. It stems from the nature of the State as a sovereign individual.
      *   *Claim 3: The Function of War (Ethical Health).*
          *   Analogy: Ocean winds preventing stagnation.
          *   Meaning: War shakes citizens out of private, finite pursuits (making money, comfort) and reminds them of their duty to the whole (the State). It prevents corruption/stagnation.
      *   *Claim 4: Critique of Kant/Perpetual Peace.*
          *   Premise: The State is an *Individual* (a sovereign particular will).
          *   Premise: Individuality implies *Negation* (to be *this* is to be *not that*).
          *   Conclusion: A federation of states is still a particular individual. Therefore, it creates an opposition (an outside). Therefore, war remains possible/necessary.

  3.  **Address the Specific Questions:**

      *   **Q1: Type of Necessity.**
          *   It's *dialectical/ethical necessity*. It's not "war will happen because people are angry" (empirical). It's "war *must be possible* for the State to be a State" (conceptual). The State's sovereignty is only proven in the ultimate sacrifice (war). Without the possibility of war, the State is just a civil society (economic association).
      *   **Q2: The Ocean Metaphor.**
