      *   *Postdoc's view:* He was thinking like a cold calculator. "No consequences = no obligation." This is *Act Utilitarianism*.
      *   *Your view:* You felt a duty. This aligns with *Kant*. If everyone broke promises, the trucker never would have stopped.
      *   *The Flaw:* The postdoc ignored the *institution* of promising. He treated it as a private transaction, but it was a social one.
      *   *Game Theory angle:* Even if *you* don't see him again, *he* interacts with the world. If he gets stiffed, he might not stop next time. You impacted *his* future behavior toward others.
