      *   *Resolution:* They must maintain the Peircean stance. The statement must remain truth-valueless. They act without asserting the truth of the outcome.

  6.  **Drafting details:**
      *   Keep it tight. 1000 words.
      *   Use the terminology naturally (bivalence, contingent, necessary).
      *   Make the physics/philosophy connection clear for the retired physicist user.

      *(Self-Correction during drafting)*: Make sure I don't confuse Ockhamist and Peircean.
