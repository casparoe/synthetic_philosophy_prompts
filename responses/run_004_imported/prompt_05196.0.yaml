  2.  **Deconstruct the Philosophical Stakes:**
      *   *Aristotle's Problem:* If "There will be a sea battle" is true *now*, then the battle is necessary. If false, it's impossible. This threatens contingency.
      *   *Diodorus's Master Argument:* Past is necessary. Impossible doesn't follow from possible. Therefore, only what *does* happen *was* possible. (Determinism).
      *   *Prior's Solution (Branching Time):* The future isn't a line; it's a tree.
      *   *Peircean View:* Statements about future contingents are neither true nor false *now*. Truth is relative to a branch.
      *   *Ockhamist View:* There is a "Thin Red Line" (TRL) of actual future. Statements are true/false relative to that line, but the line isn't *necessary* until it becomes past.
      *   *The "Smuggling" Critique:* If you posit a TRL, aren't you just reintroducing determinism?

      *   *The Plot Hook:* How to make a story depend on this?
          *   Scenario: A decision needs to be made based on a prophecy or a prediction.
          *   Conflict: If the prediction is *already* true, the decision is meaningless (fatalism). If it's *not* true (Peircean), the prediction is useless.
          *   Twist: The mechanism of the "oracle" or "device" must operate differently based on the metaphysical structure of time.
