      *   *Let's go with the "Thin Red Line" trap.* The Oracle offers a TRL. The Admiral must realize that accepting the TRL as *necessary* (Diodoran) is the trap. He must treat the TRL as *actual* but *alterable* (Ockhamist) to exercise free will.
      *   *Actually, the strongest narrative tension comes from the Peircean vs. Ockhamist divide.*
      *   *Plot:* The fleet faces a narrow strait. The Oracle says "The fleet will pass."
      *   *Problem:* If that statement is *already* true (Ockhamist/TRL), then the passage is fixed. If it's not true yet (Peircean), the Oracle is speaking nonsense.
      *   *The Twist:* The enemy has a weapon that triggers *if* the future becomes fixed. They need to keep the future "open" (Peircean) to avoid a trap that relies on causal determinism. Or vice versa.
      *   *Let's try this:* The "Diodoran Lock." A magical/logical seal that activates only if an event is *necessary*. If the future is contingent, the lock stays open. The Admiral needs the lock to stay open to maneuver. The Oracle claims the future is fixed. The Admiral must prove it isn't to bypass the lock.

      *   *Wait, simpler is better.*
