      *   If they treat the verdict as *contingent* (Aristotle/Prior), they sail but remain ready to change course.
      *   The Enemy uses a "Fate-Anchor." It locks reality into the path that is declared "True."
      *   To win, Kaelen must ensure the proposition "We sail the strait" remains *neither true nor false* until the last second.
