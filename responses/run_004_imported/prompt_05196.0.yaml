answer: |-
  The bridge of the *Aletheia* was silent, save for the hum of the Logic Engine. Admiral Kaelen stared at the viewscreen. Ahead lay the Chronos Strait, a nebula of shifting probabilities. Behind them, the Diodoran Fleet hunted, their ships anchored by the heavy certainty of causality.

  "Status," Kaelen barked.

  Logician Sira didn't look up from her console. "The Barrier is active, Admiral. It's tuned to bivalence."

  Kaelen clenched his jaw. The Barrier was a Diodoran weapon. It operated on the Master Argument: *If a proposition about the future is true now, it is necessary.* The Barrier scanned for truth values. If the proposition *"The Aletheia passes the strait"* possessed a truth value—True or False—the Barrier would calculate the trajectory and crush them. To pass, the future had to remain logically open.

  "Can we jam it?"

  "No," Sira said. "It's not a sensor; it's a metaphysical latch. It reacts to the ontological status of our intentions. If we commit to a course, we create a Thin Red Line. The Ockhamists say that line is real but contingent. The Barrier doesn't care about contingency. It cares about truth. If it's true *now* that we pass, we die."

  Kaelen paced. "So we need to lie?"

  "A lie is False. False is a truth value. The Barrier fires on False just as hard as True. It fires on *determination*." Sira finally looked at him, her eyes tired. "We need a truth-value gap. We need Aristotle."

  "Aristotle said the sea battle is neither true nor false until it happens."

  "Exactly. Peircean branching time. We must exist in the branches, not on the line."

  The alarms chirped. The Diodoran flagship was closing. They were firing causal missiles—projectiles that traveled along the only path history allowed.

  "Give the order," Kaelen said. "Set course for the gap."

  Sira's hand hovered over the comms. "If I issue that order, Admiral, does it become true that we go?"

  "It becomes an order."

  "In this ship, an order is a premise. Premises entail conclusions. If I log the course, the Engine evaluates the future state. If the Engine outputs 'Pass,' the proposition becomes True in the system. The Barrier will see it."

  Kaelen slammed his fist on the rail. "Then how do we move? To act is to choose. To choose is to make one future actual."

  "To act is to prune branches," Sira corrected. "But we must not prune them *in the record*. We have to navigate without asserting."

  She began typing, not commands, but queries. "I'm instructing the nav-computer to operate on conditional logic only. *If* we steer port, *then* we avoid the asteroid. No assertion that we *will* steer port. We keep the antecedent hypothetical."

  "The Diodorans will see us drifting."

  "Let them. They see a ship without a future. They can't target what isn't true."

  The *Aletheia* drifted, engines cold. On the screen, the Diodoran missiles streaked past, guided by the certainty that the *Aletheia* would hold its course. They had calculated the future based on the ship's momentum and the Admiral's known aggression. They had assumed the TRL—the Thin Red Line—was already drawn.

  "They're locking on," Sira warned. "Their Oracle is projecting a TRL through us. They're forcing bivalence. They're saying, 'It is true you will be here.'"

  The ship shuddered. The Barrier was beginning to resonate, trying to collapse the wavefunction of their intent.

  "I have to speak to them," Kaelen said. "Open a channel."

  "Admiral, if you declare your intent—"

  "I won't declare intent. I'll declare a paradox."

  Kaelen leaned into the mic. "Diodoran Command. This is Kaelen. I propose a wager. I state the following: *'The Aletheia will not pass the strait.'*"

  Sira gasped. "Sir, that's a prediction."

  "Watch."

  The Diodoran response was immediate. "Acknowledged. If that statement is True, you do not pass. We win. If False, you pass, and our Barrier destroys you. Bivalence holds. You are trapped."

  "No," Kaelen said. "Because I am not the one deciding." He turned to Sira. "Cut the engines. All power to the lateral thrusters. But do not log it as a course correction. Log it as... a drift simulation."

  "That's semantic gymnastics," Sira whispered.

  "It's ontology!" Kaelen snapped. "If it's a simulation, the proposition 'We pass' isn't asserted. It's modeled. The Barrier sees a model, not a fact."

  Sira understood. She routed the navigation through the holographic training deck. The ship moved, violently, jerking sideways into the nebula's turbulence. Because the computer registered the movement as a *hypothetical scenario* rather than an *actualized command*, the proposition "The Aletheia passes" retained no truth value in the Logic Engine. It was neither True nor False. It was *Possible*.

  The Diodoran Barrier flickered. It was looking for a boolean input. It found a null.

  "They're confused," Sira said, watching the telemetry. "Their Oracle is trying to assign a truth value to our position, but we're operating in a Peircean frame. We're treating the future as a tree, not a line."

  "Push harder," Kaelen said. "Make the branches multiply."

  Sira engaged the randomization protocols. "I'm feeding the engine quantum noise. Every microsecond, the ship's path is recalculated based on radioactive decay. There is no determinate future to measure. Not even a Thin Red Line. Just a cloud of probabilities."

  The *Aletheia* surged forward, dancing through the gaps in the nebula. The Diodoran missiles, reliant on a fixed timeline to intercept, overshot. They were chasing a ghost, a future that refused to be true *now*.

  "We're through the first gate," Sira said, her voice trembling. "But Admiral... look at the logs."

  Kaelen looked. As they cleared the Barrier, the ship's systems automatically archived the flight path. The moment the data was written to the permanent drive, the proposition "The Aletheia passed" became a statement about the *past*.

  And the past is necessary.

  "The moment we record it," Kaelen said quietly, "Diodorus wins."

  "Yes," Sira said. "Once it's past, it couldn't have been otherwise. The Master Argument holds. We are safe now, but we are also... fixed."

  Kaelen watched the stars streak by. They had escaped by living in the gap, by refusing to let the future solidify into truth until it was already done. But now, safe in the clear, the log file sat on the server. *0800 Hours: Aletheia Passed.* True. Necessary. Unchangeable.

  "Delete the log," Kaelen ordered.

  Sira froze. "That's against regulation. It's history."

  "If we keep it, we admit the future was always going to be this way. We admit the TRL was there all along, we just couldn't see it. That's fatalism, Sira. That's the Diodoran victory."

  Sira looked at the console, then at the Admiral. She hovered her finger over the purge key. "If I delete it, we preserve the contingency. We prove that the truth value was created by the act, not discovered by it."

  "Do it."

  Sira pressed the key. The screen went blank. The record of their escape vanished. In the eyes of the Logic Engine, the event had never been finalized. They were still in the branches.

  "Course?" Sira asked.

  Kaelen smiled, a thin, tired expression. "Doesn't matter. As long as it's not true yet."

  "Peircean it is," Sira said, and engaged the drive. The ship vanished into the dark, a possibility among many, unbound by the tyranny of the True.
