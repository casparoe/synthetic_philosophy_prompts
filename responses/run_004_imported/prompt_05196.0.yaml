      *   *The Device:* The "Aletheia Engine" or something similar. A machine that detects the truth value of future contingents.

  3.  **Drafting - Scene by Scene:**
      *   **Scene 1: The Setup.** Admiral Valerius and Logician Elara. The fleet is trapped. A storm/battle is coming. They have a device that claims to know the future.
      *   **Scene 2: The Philosophical Conflict.** Elara explains the risk. If the device says "True," Diodorus wins (it's necessary). If it says "Null," Aristotle wins (it's contingent).
      *   **Scene 3: The Crisis.** The enemy approaches. They need to know whether to commit the reserves. Committing them ensures victory but leaves them vulnerable elsewhere. Holding them ensures survival but loses the battle.
