answer: |-
  This is an exceptionally sharp reading, especially for someone coming at it from outside the professional philosophy guild. Your background in analytical chemistry gives you a distinct advantage here: you recognize the tension between rigorous methodology and the desperate need for a specific result. Your "metrologist moonlighting as a dowser" analogy is vivid, though I would argue Sidgwick saw it differently: he was trying to turn dowsing into metrology.

  You have not "reinvented badly." In fact, you have independently reconstructed one of the central debates in modern Sidgwick scholarship. However, since you asked for an honest read before presenting this to a philosophy group, I need to point out where your theory is robust, where it might be slightly over-determined, and which secondary sources you need to cite so they know you've done your homework.

  Here is a point-by-point assessment of your argument.

  ### 1. The Core Thesis: Psychical Research as a Solution to the Dualism
  **Your Claim:** Sidgwick's involvement in the Society for Psychical Research (SPR) was driven by the need to solve the "Dualism of Practical Reason" (the conflict between Rational Egoism and Rational Benevolence) by finding empirical evidence of a moral government of the universe (afterlife/rewards).

  **Verdict:** **Substantially Correct.**
  This is the standard interpretation among Sidgwick experts. In *The Methods of Ethics*, Sidgwick concludes that without the assumption that the universe is governed by a moral power that ensures happiness aligns with virtue (typically via an afterlife), reason is fundamentally divided. Rational Egoism (maximize my good) and Utilitarianism (maximize the general good) are both self-evident, but they can conflict. If there is no afterlife where the martyr is compensated, the egoist is rational to defect.

  Sidgwick could not accept this on faith (having resigned his fellowship over the Thirty-Nine Articles). Therefore, he sought *empirical* proof of survival. The SPR was the vehicle for this. You are absolutely right that this was not a "hobby"; it was an existential necessity for his ethical system.

  **The Nuance:** Be careful not to imply he thought psychical research *would* definitely prove Christian heaven/hell. He was looking for evidence of *survival* and *agency* beyond death. If consciousness survives, the possibility of a moral reckoning opens up. If consciousness ends at death, the Dualism is permanent, and ethics rests on a fundamental contradiction.

  ### 2. The Historical Timeline and Motivation
  **Your Claim:** He resigned his fellowship (rejected religion), wrote the *Methods* (found the Dualism), then turned to the SPR (sought empirical proof).

  **Verdict:** **Chronologically Sound.**
  *   **1869:** Resigns Trinity fellowship (loss of orthodox faith).
  *   **1874:** Publishes *The Methods of Ethics* (articulates the Dualism).
  *   **1882:** Becomes first President of the SPR.

  The sequence supports your causal link. However, don't ignore the intellectual climate. In the 1880s, the boundaries of "science" were fluid. Many serious scientists (including William James later on) saw psychical research not as magic, but as the exploration of uncharted natural laws. Sidgwick wasn't being irrational by the standards of 1885; he was extending the scientific method to anomalies.

  **Correction on "Forced":** You say the research was "forced on him by a hole he'd dug." This is dramatic and effective, but philosophically, Sidgwick might argue he was following the evidence wherever it led, rather than seeking evidence to support a conclusion. However, his private letters suggest you are right: the *motivation* was the ethical crisis, even if the *method* was open inquiry.

  ### 3. The Role of Eleanor Sidgwick
  **Your Claim:** He ran surveys "along with his wife Eleanor."

  **Verdict:** **Accurate, but understated.**
  If your reading group knows Sidgwick, they will know Eleanor. She was arguably the more rigorous scientist of the two. She handled the statistical heavy lifting (like the Census of Hallucinations). Sidgwick was the philosopher and the public face; Eleanor was the methodological engine. If you present this, acknowledge her. It strengthens your argument: this wasn't a desperate old man chasing ghosts; it was a coordinated, rigorous empirical project that *happened* to be motivated by an ethical crisis.

  ### 4. The Outcome: "A Monument to a Problem He Couldn't Solve"
  **Your Claim:** He died unconvinced, leaving the project as a testament to the unsolvable nature of his ethical dualism.

  **Verdict:** **Poetically True, Historically Nuanced.**
  Sidgwick never claimed to have found proof. The famous deathbed anecdote (reported by Arthur Balfour) is crucial here. When asked if he had found evidence of survival, Sidgwick reportedly said something to the effect of, "No, but I have not found evidence against it."

  However, calling it a "monument to a problem he couldn't solve" is a slight flattening. Sidgwick came to a position of "theistic agnosticism." He thought it was *reasonable* to believe in a moral order, even if he couldn't *prove* it empirically. He essentially decided one had to take a "leap" to make ethics coherent, even if the empirical data remained inconclusive. The SPR work didn't solve the Dualism, but it kept the *possibility* of a solution open, which allowed him to continue acting as a Utilitarian without intellectual dishonesty.

  ### 5. Where You Might Be Stretching (The "Tidy Story" Risk)
  There are two places where a professional philosopher might push back:

  1.  **Epistemology vs. Ethics:** Your theory focuses heavily on the *ethical* motivation (solving the Dualism). While true, Sidgwick also had a broader *epistemological* motivation. He was concerned with the limits of scientific naturalism. He wanted to know if the scientific method could account for *all* human experience. The SPR was a test case for the limits of science, not just a tool for ethics. If you focus only on the ethics, you might miss his broader philosophy of science.
  2.  **The Nature of the "Moral Government":** You mention "evidence of a universe that keeps score." Sidgwick was careful not to define this as a simple ledger of sins and rewards. He was looking for the *compatibility* of duty and interest. A subtle point, but important: he didn't need a God who punishes sinners; he needed a universe where being good doesn't ultimately make you worse off than being bad.

  ### 6. The Literature (Don't Reinvent the Wheel)
  You asked if there is a better-supported version of this thesis out there. **Yes.** If you walk into that discussion group without mentioning **Bart Schultz**, they will eat you alive.

  *   **Bart Schultz, *Henry Sidgwick: Eye of the Universe* (2004):** This is the definitive modern biography. Schultz argues exactly what you have argued: that the SPR was inextricably linked to Sidgwick's ethical project and his crisis of faith. He details how Sidgwick's "esoteric" morality and his psychical research were two sides of the same coin.
  *   **J.B. Schneewind, *Sidgwick's Ethics and Victorian Moral Philosophy* (1977):** The classic text on his ethics. Schneewind discusses the Dualism extensively, though he focuses less on the SPR than Schultz does.
  *   **Alan Hodgson, *The Philosophy of Henry Sidgwick*:** Also covers the psychical research connection.

  **Your Move:** You don't need to discard your theory. You need to frame it as an independent confirmation of the Schultz thesis, perhaps with your own "analytical chemist" spin on the methodology.

  ### Summary for Your Discussion Group
  Here is how I would suggest you frame your argument to them:

  1.  **Acknowledge Schultz:** Start by saying, "I know Bart Schultz argues this in *Eye of the Universe*, but I want to look at it through the lens of methodological desperation."
  2.  **Refine the Analogy:** Instead of "metrologist as dowser," try: "Sidgwick was trying to use the tools of the laboratory to validate the premises of the pulpit, because the pulpit was broken and the laboratory was incomplete."
  3.  **Highlight the Tragedy:** Emphasize that Sidgwick is unique among the utilitarians. Bentham and Mill were confident. Sidgwick was the one who stared into the abyss of the Dualism and realized Utilitarianism might be rationally unstable without a theological underpinning. The SPR was his attempt to build that underpinning without theology.
  4.  **The Verdict:** Conclude that the SPR wasn't a distraction from his philosophy; it was the *applied* version of his concluding chapter in *Methods*.

  **Final Word:**
  You haven't got the history or philosophy wrong. You've identified the central tension in Sidgwick's life. The only risk is presenting it as a "discovery" rather than an interpretation of existing scholarship. If you position it as "Here is how a scientist reads the connection between his ethics and his ghost-hunting," you will have a fantastic discussion. Sidgwick is often called the most honest of the utilitarians; your reading honors that honesty by admitting he died with the problem unsolved.

  Go ahead and inflict it on them. Just bring a copy of Schultz to back you up.
