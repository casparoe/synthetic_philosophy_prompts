answer: |-
  Here's a joke that targets the specific epistemological irony rather than just making fun of his math skills:

  "Hobbes argues that geometry is the only true science because it's 'maker's knowledge'—we know the circle because we generate it by definition, so we know its causes. But then he spends 30 years trying to square the circle and getting roasted by Wallis.

  The irony is that Hobbes took 'maker's knowledge' to mean he had **executive privilege** over the figure. He thought because he was the 'author' of the geometry, he could legislate the ratio of the circumference. He didn't think he had to *discover* that the circle couldn't be squared; he thought he could just *define* it into being square. Basically, he tried to be the Sovereign of Pi."

  **Why this works for your seminar:**
  *   **It hits the epistemology:** It references the core argument (certainty comes from knowing causes/genesis) rather than just saying "math is hard."
  *   **It highlights the specific error:** It points out that Hobbes confused *stipulating definitions* (which we do make) with *deriving consequences* (which we must discover), which is exactly where his "squaring" attempts failed.
  *   **It ties to his broader philosophy:** Using the term "Sovereign" or "legislate" subtly nods to his political theory (*Leviathan*), suggesting he tried to treat mathematical truths like civil laws that the Sovereign can decree.
