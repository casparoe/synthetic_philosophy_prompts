      *   **Context:** The user is on a town Charter Review Commission.
      *   **Task:** Write a memo to the commission regarding a vote on changing the voting system (Plurality vs. Ranked-Choice/IRV vs. Approval).
      *   **Conflict:** A math grad student cited the Gibbard-Satterthwaite (G-S) theorem to argue all systems are manipulable, leading some commissioners to want to shelve reform ("nothing's perfect"). Others think this is irrelevant.
      *   **Goal:** Draft a memo that engages seriously with the G-S objection, explains what it does/doesn't mean for the specific options (Plurality, IRV, Approval), and makes a concrete recommendation (no "more study needed").
