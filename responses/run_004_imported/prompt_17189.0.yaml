      *   *Recommendation:* Adopt Ranked-Choice Voting (Instant Runoff). It's the most robust *practical* upgrade from Plurality that addresses the specific failures (spoilers) while acknowledging G-S. (Alternatively, Approval is simpler, but RCV is more politically viable usually. I will draft the recommendation for RCV but acknowledge Approval's merits, or pick one. Let's pick RCV as it's the standard "Charter Reform" alternative, but I'll write it so the logic supports whichever the commission prefers, leaning towards RCV as the most direct fix to Plurality's specific flaws).
