  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the purpose, the objection, and the bottom line (G-S is true but irrelevant to the *choice* between systems).
      *   **The Objection (G-S):** Explain it simply. "All systems have loopholes." Validate the grad student's math.
      *   **The Rebuttal (Why it doesn't stop reform):**
          *   Existence vs. Frequency/Difficulty.
          *   Plurality's manipulation is *easy* and *common* (vote splitting).
          *   RCV/Approval manipulation is *hard* and *rare*.
          *   Other criteria matter (Majority rule, expressiveness).
      *   **Comparison of Options:**
          *   Plurality: High strategic pressure (Spoiler effect).
          *   RCV: Lower strategic pressure, ensures majority support.
          *   Approval: Low strategic pressure, simple, but different trade-offs.
      *   **Recommendation:** Move to RCV (or Approval, I need to pick one to be decisive). I will recommend **Ranked-Choice Voting** as it is the most standard charter reform for councils, but I will frame the logic to support *either* over Plurality. Let's go with RCV as the primary recommendation because it guarantees a majority winner, which is a strong democratic norm for councils.
