      *   **User Background:** Reads rationalist blogs, knows some mechanism design, wants to avoid hand-waving.

  2.  **Deconstruct the Gibbard-Satterthwaite (G-S) Theorem:**
      *   *What it says:* For any voting system with 3+ candidates that isn't a dictatorship, there exists some scenario where a voter benefits from voting insincerely (strategic voting).
      *   *What it implies:* No system is perfectly strategy-proof.
      *   *What it does NOT say:* All systems are *equally* manipulable. It doesn't measure the *frequency*, *complexity*, or *impact* of manipulation. It doesn't account for other desirable properties (like majority rule, expressiveness, resistance to spoilers).
      *   *Relevance to options:*
          *   Plurality: Highly manipulable (vote splitting, spoiler effect). Strategy is simple ("don't waste your vote").
          *   IRV (Ranked-Choice): Still manipulable (G-S applies), but harder to game strategically for the average voter. Reduces spoiler effect.
          *   Approval: G-S applies (technically a rated system, but often analyzed similarly in this context). Strategy involves where to set the "approval threshold." Often more robust against certain types of manipulation than Plurality.

  3.  **Determine the Recommendation:**
