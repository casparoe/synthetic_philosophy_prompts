          *   Is it rhetoric or premise? It's a **philosophical premise**. Du Bois is redefining "Freedom." Standard liberal freedom = negative liberty (freedom *from* constraint). Du Boisian artistic freedom = positive liberty (freedom *to* realize Truth/Justice). If you are constrained from Truth, you are a slave. Therefore, Art *must* serve Truth. If Art serves Truth, it advocates for a view of the world. That advocacy = Propaganda.
