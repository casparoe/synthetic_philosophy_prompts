answer: |-
  You are absolutely right to feel that the standard "All art is propaganda" soundbite flattens Du Bois's argument. In dissertation work, this distinction is crucial because treating that line as a standalone slogan misses the *ethical architecture* Du Bois is building to justify it.

  You have correctly identified the two distinct claims sliding against each other:
  1.  **The Ontological Claim:** Art is *inherently* propagandistic (it cannot be otherwise).
  2.  **The Political Claim:** The *distribution* of propagandistic power is asymmetrical (White propaganda is normalized; Black propaganda is stigmatized).

  Here is an untangling of the argumentative structure, specifically addressing the function of the "bounded freedom" passage and how it bridges those two claims.

  ### 1. The Function of the "Bounded Freedom" Passage
  You asked if the "bounded by Truth and Justice" bit is a premise or rhetorical flourish. **It is the foundational philosophical premise.** Without it, the jump to "Thus all art is propaganda" is a non-sequitur.

  Du Bois is redefining the terms of the debate before he even gets to propaganda.
  *   **The Purist Definition of Freedom:** Negative liberty. Freedom *from* constraint, freedom *from* utility, freedom *from* moral obligation. Art is "free" if it serves no master.
  *   **Du Bois's Definition of Freedom:** Positive liberty grounded in Truth. The artist is "compelled" by Truth. Therefore, true artistic freedom is the *capacity to obey that compulsion.*

  **The Logic:**
  If the artist's highest calling is Beauty, and Beauty is inextricably linked to Truth/Justice (a Platonic ideal Du Bois often leans on), then the artist is *unfree* if they are prevented from serving Truth.
  *   **Slavery** = Being denied the right to tell the Truth.
  *   **Freedom** = Being bounded *only* by Truth and Justice.

  **Why this matters for your chapter:** This passage allows Du Bois to flip the script on censorship. Usually, "propaganda" is seen as a constraint on art. Du Bois argues that *preventing* propaganda (specifically Black truth-telling) is the actual slavery. The "bounded freedom" argument establishes that **neutrality is impossible.** If you are bounded by Truth, you are taking a stance. If you take a stance, you are advocating. If you are advocating, you are doing propaganda.

  ### 2. Reconstructing the Syllogism
  The "slide" you notice is actually a deliberate rhetorical pivot from a universal condition to a specific grievance. Here is the reconstructed logic chain:

  *   **Premise 1 (Metaphysical):** True Art is compelled by Truth and Justice; it cannot be neutral.
  *   **Premise 2 (Definition):** To advocate for a Truth/Justice is to engage in propaganda.
  *   **Intermediate Conclusion (Ontological):** Therefore, **All Art is Propaganda.** (This neutralizes the Purist critique: "You aren't criticizing art; you're criticizing the nature of art itself.")
  *   **Premise 3 (Observation):** White art *already* functions as propaganda (asserting white blood is divine), but it is not *labeled* as such. It passes as "universal" or "pure."
  *   **Premise 4 (Observation):** Black art is labeled "propaganda" pejoratively to silence it, denying it the same right to advocate for Black humanity.
  *   **Final Conclusion (Political):** The objection is not to propaganda *per se*, but to the **monopoly on propaganda.**

  ### 3. Untangling the Two Claims
  You noted that Du Bois seems to slide between "art is unavoidably propagandistic" and "there is an unfair asymmetry." In your dissertation, you can frame this not as a contradiction, but as a **strategic escalation.**

  **Claim A: The Universal (Disarming the Opponent)**
  *"All art is propaganda and ever must be."*
  Du Bois makes this claim to strip the "Purists" (likely targeting Locke or the younger "Art for Art's Sake" crowd, though he's also talking to white critics) of their moral high ground. He is saying: *You claim your art is pure, but it isn't. You just don't call it propaganda because it serves your interests.* This makes the accusation of "propaganda" descriptive, not insulting.

  **Claim B: The Particular (The Ethical Demand)**
  *"I do care when propaganda is confined to one side while the other is stripped and silent."*
  Once he has established that *everyone* is doing it, the ethical ground shifts. If propaganda is inevitable, then **equity of access** becomes the only valid metric for criticism.
  *   If White propaganda says "White is Divine," that is allowed.
  *   If Black propaganda says "Black is Human," that is censored.
  *   **The Injustice:** It is not that Black art is propaganda; it is that Black art is the *only* art punished for being what all art is.

  ### 4. How to Frame This in Your Dissertation
  Since you are writing on HR debates, this nuance allows you to complicate the standard **Du Bois (Propaganda) vs. Locke (Aesthetic Autonomy)** binary.

  *   **Du Bois isn't rejecting Aesthetics:** He is arguing that Aesthetics *require* Ethics. The "bounded freedom" line proves he cares deeply about the integrity of the art—it must be bounded by *Truth*, not just any lie that helps the race. (This is a common critique of Du Bois—that he wants didactic art—but this text suggests he wants *truthful* art, which happens to be propagandistic in effect).
  *   **The "White Artists" Point:** The final paragraph you quoted is often ignored. *"White artists themselves suffer from this narrowing of their field."* This is a crucial point for your chapter. Du Bois argues that the asymmetry hurts *Art itself*, not just Black people. If White artists can only deal with White subjects as "divine" and Black subjects as "caricatures" (because they are denied the truth of Black humanity), their art is *less true*, and therefore *less beautiful*.
      *   **Argument:** The propaganda monopoly degrades universal Beauty.

  ### Summary for your Draft
  The "bounded freedom" section is the **warrant** that connects the **data** (Art seeks Truth) to the **claim** (Art is Propaganda).

  Du Bois's argument is not:
  > "Art is propaganda, so we should make propaganda."

  Du Bois's argument is:
  > "Art is inherently an advocacy for Truth (bounded freedom). Since White art already advocates for White Truth without penalty, Black art must be allowed to advocate for Black Truth without penalty. To deny this is not to protect Art; it is to enslave the Artist."

  This reconstructs the "slide" as a move from **Ontology** (what art *is*) to **Equity** (how art is *treated*). You can argue that critics miss the point because they stop at the Ontological claim, whereas Du Bois's real intervention is the Equity claim.
