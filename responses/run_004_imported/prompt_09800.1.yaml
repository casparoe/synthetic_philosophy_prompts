          *   *Claim 2 (Political/Specific):* "The problem is asymmetry." This is the *normative* punchline. Since everyone is doing it, why are Black artists shamed for it while White artists are celebrated?
          *   *The "Slide":* It's not necessarily a fallacy; it's a rhetorical strategy. He establishes the universal rule to justify the specific exception he's demanding.

