answer: |-
  Here is the verdict: **You are right.**

  Marco is technically correct about the *formal classification* of the entities involved, but you are correct about the *theoretical substance*. Salmon's view is not a genuine rival explanation of Frege's Puzzle; it is a salvage operation for Millianism that outsources the explanatory heavy-lifting to a mechanism that functions identically to Fregean sense.

  Here is the breakdown of why the "trenchcoat" charge sticks, where the actual asymmetries lie, and why Frege's account remains superior for this specific puzzle.

  ### 1. The "Trenchcoat" Charge: Explanatory Dependency
  Your core claim is that Salmon is "borrowing Frege's insight under a different name." This is substantively true.

  *   **Frege:** To explain why "Hesperus is Phosphorus" is informative while "Hesperus is Hesperus" is not, Frege posits **Senses**. Senses are the mode of presentation. They are part of the *semantic content*.
  *   **Salmon:** To explain why Lois asserts "Superman flies" but denies "Clark Kent flies," Salmon posits **Guises**. Guises are the mode of access. They are *not* part of the semantic content (which is just the singular proposition), but they are required to explain the *belief relation*.

  **The Problem for Marco:** If Salmon removes the guise, his theory cannot explain the data. A bare Russellian proposition (<Superman, Flying>) cannot distinguish Lois's two cognitive states. Therefore, the *explanation* for the puzzle relies entirely on the guise.
  Since the guise performs the exact same functional role as the Fregean sense (mediating the subject's access to the referent and accounting for cognitive significance), calling it a "pragmatic guise" rather than a "semantic sense" is a terminological maneuver to save Direct Reference, not a new solution to the puzzle. You identified that the explanatory work is identical; Marco is fixated on the ontological label.

  ### 2. Concrete Asymmetries (and why they don't save Salmon)
  Marco will argue there are principled differences. He is right that there are formal differences, but they come at a high cost that weakens his position on the *puzzle*.

  **A. Compositionality vs. Truth Conditions**
  *   **Salmon (Marco's pick):** Wins on compositionality. The semantic content of "Superman" is always just the planet/person. The proposition is always the same.
  *   **Frege (Your pick):** Wins on truth conditions. "Lois believes Superman flies" is true; "Lois believes Clark Kent flies" is false (in the ignorance context).
  *   **The Verdict:** Salmon preserves compositionality only by sacrificing the intuitive truth conditions of belief reports. He has to claim that when we say "Lois doesn't believe Clark Kent flies," we are speaking *loosely* (pragmatically misleading but semantically true). This is a bullet-biting move. Frege respects the intuition that the two belief reports have different truth values. For the specific purpose of solving the *puzzle* (which is about why the truth values *seem* to differ), Frege's account matches the data; Salmon's account explains the data away.

  **B. Shareability (Public vs. Private)**
  *   **Frege:** Senses are abstract and public. We can both grasp the *same* sense of "Hesperus." This explains communication.
  *   **Salmon:** Guises are psychological particulars. My "Superman" guise is in my head; yours is in yours.
  *   **The Verdict:** This is a genuine asymmetry, but it hurts Salmon. If guises are private psychological states, how do we communicate about them? When I say "Lois believes Clark Kent flies," I am implicating something about *her* psychological state. But if guises are idiosyncratic, how do I know which guise she is using? Frege's public senses explain how we can successfully attribute beliefs to one another. Salmon's private guises make successful belief attribution a miracle of psychological mind-reading.

  **C. What Is Said vs. What Is Implicated**
  *   **Salmon:** The guise is merely implicated.
  *   **Frege:** The sense is part of what is said.
  *   **The Verdict:** This is the crux of your argument. If the "implicature" is required to determine whether the belief attribution is *appropriate* (which is all we care about in the puzzle), then the distinction between "said" and "implicated" is doing no work regarding the *problem*. If I cannot correctly attribute the belief without referencing the guise, then the guise is effectively part of the content of the attribution, regardless of Salmon's semantic stipulation.

  ### 3. Why Frege Gives the Better Account
  Salmon's theory is designed to solve a different problem: **How to save Direct Reference.** It is not designed to solve Frege's Puzzle better than Frege did; it is designed to solve Frege's Puzzle *without abandoning Millianism*.

  *   **Frege** looks at the puzzle and says: "The difference in cognitive value indicates a difference in semantic content."
  *   **Salmon** looks at the puzzle and says: "The difference in cognitive value indicates a difference in psychological processing, but semantic content must remain invariant to preserve Direct Reference."

  Salmon's move is theoretically conservative regarding reference but theoretically expensive regarding pragmatics. He creates a "pragmatic dust" to hide the fact that he needs Fregean senses to make his system work.

  ### The Settlement
  Marco is winning on **taxonomy** (guises are psychological, senses are semantic), but you are winning on **philosophy of language** (the function of the theory).

  If a theory requires an entity $X$ to explain cognitive significance, and another theory requires an entity $Y$ to explain cognitive significance, and $X$ and $Y$ function identically in the explanation, claiming they are "rival theories" is misleading. They are rival *ontologies* for the same *mechanism*.

  Salmon hasn't found a new way to solve the puzzle; he has found a way to *relocate* Frege's solution so it doesn't break Millianism. That makes your "trenchcoat" charge accurate. He is wearing Frege's senses as a disguise to get into the Millian club.

  **Winner:** You. Frege's account is the more honest description of the linguistic data. Salmon's account is a sophisticated defense of a metaphysical commitment (Direct Reference) that requires him to treat our ordinary belief ascriptions as systematically misleading. That isn't a better account of the puzzle; it's a sacrifice of the puzzle to save a theory.
