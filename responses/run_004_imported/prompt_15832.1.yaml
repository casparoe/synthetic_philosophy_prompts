  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Introduction:** Validate the user's intuition. They have the right gist. Acknowledge the philosophical stakes (epistemology of testimony vs. computational complexity).

      *   **Core Mechanism of Debate:** Briefly recap the ideal case.
          *   Judge ($J$) is weak (polynomial time).
          *   Debaters ($D$) are strong (unbounded/super-polynomial).
          *   Claim: Truth has a "short proof" accessible to $J$ if guided by honest $D$. Falsehood requires a lie that eventually gets caught.
