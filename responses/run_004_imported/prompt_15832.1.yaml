      *   **The Obfuscated Arguments Problem (The "Gears"):**
          *   *Analogy:* Needle in a haystack vs. Needle in a stack of needles.
          *   *Computational Asymmetry:* It is computationally cheap to *generate* a plausible-looking lie embedded in complexity. It is computationally expensive to *audit* the whole tree.
          *   *The Crux:* The honest debater isn't omniscient in terms of *compute time* during the debate. They are powerful, but if the dishonest debater uses that power to create a cryptographic-style obfuscation, the honest debater might not be able to distinguish the real flaw from a "red herring" within the debate turn limits.
          *   *Why it's not just training:* It's not that the model *fails to learn* honesty. It's that even a perfectly honest, super-intelligent agent *cannot win* against a super-intelligent liar in front of a weak judge if the liar can exploit complexity gaps. The payoff matrix changes. Lying becomes a viable strategy if the probability of getting caught drops below the threshold of utility gain.
