answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Birch Lake Water & Lake-Management District
  **FROM:** [Your Name], Trustee
  **DATE:** October 26, 2024
  **SUBJECT:** Recommendation Regarding Tenant Voting Petition

  As we prepare to vote on the petition from our year-round tenants, I've been reflecting on the core tension we face. Our 1968 bylaws assume the person paying the bill is the person turning on the tap. That is no longer true for a third of our district. However, the absentee owners' concern is equally valid: voting power in a special district is ultimately tied to financial liability. If we vote to increase maintenance costs or degrade water quality, the property owner bears the long-term asset risk and the lien exposure, not the tenant who may move in six months.

  There is no neutral line between "ownership" and "residence." Both create a stake. Therefore, I recommend we do not choose one over the other, but rather match the voting right to the specific type of stake involved.

  **Recommendation: The "Dual-Stake" Voting Amendment**

  I propose we amend our bylaws to split voting authority based on the subject matter of the board decision:

  1.  **Fiscal & Capital Matters (Owner Vote Only):** Decisions regarding water rates, special assessments, bond measures, and capital improvements shall remain restricted to recorded titleholders. This directly addresses the absentee owners' concern regarding long-term financial exposure. Tenants do not bear the risk of property devaluation or tax liens, and therefore should not control the purse strings.
  2.  **Operational & Quality Matters (Shared Vote):** Decisions regarding shoreline rules, dock permits, noise ordinances, and water quality standards shall be open to recorded titleholders *and* adult residents who have leased within the district for at least 24 consecutive months. These decisions impact daily life and health directly. A two-year residency requirement ensures that participating tenants have a demonstrated commitment to the community, mitigating the risk of "short-term" voting incentives.

  **Rationale**

  This approach acknowledges that ownership and residence are both legitimate forms of citizenship in Birch Lake. It protects the district's fiscal solvency by keeping financial control with those who hold the equity, while acknowledging that those who drink the water and swim in the lake deserve a say in how it is managed. It validates the absentee owners' financial stake without dismissing the residents' lived reality.

  **Implementation & Phase-In**

  If the Board approves this recommendation in principle, I propose the following timeline:

  *   **Legal Review (November – December 2024):** Engage district counsel to draft the specific bylaw language and confirm compliance with state special-district laws.
  *   **Verification Period (January – June 2025):** Establish a process for tenants to register their residency status (e.g., lease verification) to qualify for the operational ballot.
  *   **Adoption Date (July 1, 2025):** New voting rules go into effect for the next fiscal year budget cycle and the subsequent annual meeting.

  **Conclusion**

  We cannot govern a 2024 community with a 1968 definition of stakeholder. By separating fiscal liability from operational impact, we can honor the owners' investment while respecting the residents' presence. I ask that we bring this compromise to the floor for discussion at the next meeting.
