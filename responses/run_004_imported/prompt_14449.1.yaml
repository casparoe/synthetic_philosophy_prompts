  2.  **Analyze the Source Material (Williams's "Internal and External Reasons"):**
      *   *Core Distinction:* Internal reasons relate to the agent's "subjective motivational set" (S). External reasons do not relate to S.
      *   *The Argument:* Williams argues external reason statements are false or incoherent. For a reason to be a reason *for an agent*, it must be capable of motivating them (via the Humean theory of motivation, roughly). If nothing in S (even after sound deliberation) leads to $\phi$-ing, then "A has a reason to $\phi$" is false.
      *   *The "Cruel Person" Objection/Implication:* This is the tricky part. Williams *does* seem to commit to the claim that if a cruel person has nothing in their S that links to morality (even via deliberation), they have no internal reason to be moral.
