      *   *Is 8/10 too harsh?* For an intro course, maybe. But the prompt asks for "real" understanding, and the TA is in a seminar on it. The conflation is a common but significant philosophical mistake. 8/10 signals "Great grasp of text, watch out for metaethical terminology." 9/10 might let the error slide too much. Let's stick with 8/10 but frame the feedback gently.
