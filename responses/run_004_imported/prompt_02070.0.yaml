answer: |-
  The brass gear sat on the velvet pad, gleaming in the lamplight. It was the escapement anchor, the heart of the clock's rhythm. Malik held his tweezers over it, his breath held tight in his chest.

  According to the mechanics of the world, if he removed the anchor, the wheel should stop. The cause would be removed, and the effect would cease. That was the law of nature. That was the habit of things.

  But Malik had been reading the *Incoherence of the Philosophers* until the pages blurred. Al-Ghazali wrote that fire does not burn cotton. God burns the cotton, at the moment the fire touches it, out of habit. There is no necessary connection. There is only the Sequence.

  Malik lifted the gear.

  The clock ticked.

  He froze. The gear was in his tweezers. The mechanism was open, gutted, impossible. Yet the second hand on the face swept forward with a smooth, confident *sweep-click*.

  Tick.

  It wasn't a ghost. It wasn't a trick of the light. It was a lag. A mercy.

  In the language of the new engineers who spoke of computing states, the world had not yet re-rendered. The previous state was holding, a stale frame displayed while the Will calculated the next truth. The universe was not a machine of pushing gears; it was a procession of images, distinct and separate, stitched together by the expectation of continuity.

  Tick.

  The hand moved again. Malik's heart hammered against his ribs, a drum beating in a body he suddenly realized he did not inhabit so much as occupy. Was this body the same one that had breathed a minute ago? Or was it a fresh creation, molded to look like the previous one, complete with the memory of breath to sell the illusion?

  He dropped the tweezers. They hit the table. The sound arrived a fraction of a second after the impact.

  *There,* Malik thought. *The gap.*

  The sound was not caused by the metal hitting the wood. The Will created the impact, and then, in the next instant, created the sound to match it. Usually, they were synchronous. But here, in the silence of his workshop, with his mind stripped of expectation, he saw the seam.

  He looked at his hand. He flexed the fingers. They obeyed. But they obeyed like a puppet whose strings were cut and re-tied a thousand times a second. He had no power to move them. He only had the power to intend, and the Will, in its generosity, usually honored the intention to maintain the Habit.

  Malik stood up. The chair scraped the floor. He watched the scrape. He waited for the friction to generate heat. He touched the spot on the wood. It was cool.

  *It hasn't decided yet,* he thought. *The heat is a separate creation.*

  A vertigo seized him, not of height, but of existence. If causality was a lie, then safety was a lie. The floor did not hold him up. The floor was merely drawn beneath his feet, frame by frame. If the Artist decided to skip the frame where the floor existed, Malik would fall through the world not because of gravity, but because of omission.

  He walked to the window. Outside, the city slept. A carriage rolled by. The wheels turned on the cobblestones.

  *They don't turn,* Malik whispered. *They are placed.*

  He felt a terrifying loneliness, but also a strange, electric intimacy. He was not alone in a dead universe. He was being attended to, constantly, aggressively. Every atom of his skin was being renewed by a gaze that never blinked.

  He returned to the workbench. The clock ticked again. It was struggling now. The Habit was fraying. The Will was preparing to update the state to "Broken."

  Malik reached out and touched the balance wheel. He didn't try to push it. Pushing was a lie. You cannot push a picture.

  Instead, he closed his eyes and changed his own state. He stopped expecting the clock to stop. He poured his entire intention into the continuity of the sound. He aligned his will with the Habit. He became a participant in the rendering.

  *Tick,* he thought.

  The clock ticked.

  *Tick.*

  It ticked again, though the gear was still on the velvet pad.

  Malik opened his eyes. He understood now. The miracle was not in breaking the law. The miracle was that the law existed at all. The fire burned the cotton every time, not because it had to, but because the Firekeeper was faithful.

  He picked up the gear. He placed it back into the mechanism. He didn't need it. But the Habit required it. To live in the world was to respect the props, even if you knew they were painted cardboard.

  He wound the mainspring. He closed the case.

  The clock chimed the hour. The sound filled the room, rich and resonant. Malik listened to the decay of the note, watching the air vibrate. He knew the vibration was not causing the sound in his ear. They were twins, born of the same instant, separated by the illusion of travel.

  He sat back in his chair. He was tired. Not the tiredness of exertion, but the tiredness of being constantly recreated.

  "Enough for now," he said to the empty room.

  He waited to see if the room would answer. It didn't. The Habit held. The silence remained silent.

  Malik smiled, and blew out the candle. The darkness didn't rush in to fill the space. The darkness was simply created, whole and complete, in the place where the light had been.
