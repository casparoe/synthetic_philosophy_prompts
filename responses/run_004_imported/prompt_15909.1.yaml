answer: |-
  I am glad you reached out before Thursday. Your graduate TA's hesitation is well-founded, and addressing this distinction now will significantly strengthen the lecture. While your law colleague's reading is standard within *international humanitarian law* (where proportionality is the operative metric), it risks misrepresenting the specific philosophical contribution Anscombe is making in "War and Murder" and "Mr. Truman's Degree."

  If you present Anscombe's argument primarily as a failure of **proportionality**, you imply that the bombing *could* have been permissible had the military value been higher or the civilian toll lower. Anscombe's argument is more radical: she contends the bombings were **intrinsically unjust** because the death of civilians was the *intended means* to victory, not a foreseen side effect. For Anscombe, if an act fails the "means" or "intention" conditions of the Doctrine of Double Effect (DDE), the proportionality calculation never even gets off the ground.

  Here is how you can pivot the materials to honor the text while keeping your pedagogical goals intact.

  ### 1. The Interpretive Correction (For Your Preparation)

  In "War and Murder," Anscombe distinguishes between *foreseeing* a consequence and *intending* it. She argues that Truman (and the RAF Bomber Command) adopted a strategy where the destruction of civilian life and morale was the very *method* of securing surrender.
  *   **Your current reading:** The act was collateral damage, but the ratio was wrong.
  *   **Anscombe's reading:** The act was direct killing of the innocent. The "collateral damage" framing is a euphemism that obscures the intention.

  **Why the TA hesitated:** If you teach this as a proportionality failure, students might conclude that Anscombe is a consequentialist who just sets the threshold very high. Her point is deontological: certain acts (intentional killing of innocents) are forbidden *regardless* of the proportionality.

  ### 2. Revised Discussion Question: Intention vs. Proportionality

  Instead of asking students to calculate the threshold of disproportionality (which assumes DDE applies), this question asks them to determine *if* DDE applies at all. This leads naturally into why the proportionality calculation is secondary.

  **Discussion Prompt: The Structure of the Act**
  > "Anscombe argues that to apply the Doctrine of Double Effect, we must first determine whether the civilian deaths were a 'side effect' of a military strike or the 'means' by which victory was achieved.
  >
  > 1.  **Reconstruct the Strategy:** Describe the causal mechanism of the Hiroshima bombing. Did the bomb secure surrender by destroying military infrastructure (with civilians dying as a result), or by destroying the city and its population (to break morale)?
  > 2.  **Apply the DDE Conditions:** If the death of civilians was the *method* used to force surrender, which condition of the Doctrine of Double Effect does this violate first? (The nature of the act? The intention? The means? Or proportionality?)
  > 3.  **The Counterfactual:** If the military value of Hiroshima had been ten times higher, would Anscombe's verdict change? Why does she insist that 'murder' is a category of action, not just a calculation of outcomes?"

  **Pedagogical Goal:** This walks students to the realization that for Anscombe, the act is murder *before* we even weigh the costs. You can then acknowledge that *even if* one granted it was collateral damage (for the sake of argument), it *also* fails proportionality, but emphasize that the intention argument is her primary philosophical contribution.

  ### 3. Extending to Nuclear Deterrence (Next Week's Unit)

  This correction actually makes the transition to nuclear deterrence much smoother and more powerful. If the bombing was wrong because of **intention**, deterrence is problematic because it involves a **conditional intention**.

  **Sketch of the Argument:**
  *   **The Deterrence Stance:** To possess a countervalue nuclear strategy is to declare: "If condition X is met, I will destroy enemy cities."
  *   **Anscombe's Objection:** One cannot intend to do what it is forbidden to do. If the actual bombing of civilians is murder (because it intends the death of innocents), then forming the *conditional intention* to do so is also morally corrupt.
  *   **The "Bluff" Objection:** Students often ask, "What if we bluff? What if we intend never to push the button?" Anscombe (and later Catholic just war teaching) rejects this. To make the deterrent credible, you must cultivate the intention to use the weapon. You cannot hold a credible threat to do evil without willing the evil conditionally.
  *   **Comparison:**
      *   **Truman (Use):** Actual intentional killing of innocents. (Murder executed).
      *   **Deterrence (Threat):** Conditional intentional killing of innocents. (Murder willed, pending conditions).
      *   **Conclusion:** On Anscombe's principles, deterrence is not "easier" to justify than use; it implicates the moral agent in the same intentional structure, merely deferred in time.

  ### 4. How to Frame This in Lecture

  You can validate your law colleague's reading without adopting it as Anscombe's own.

  *   **Suggested Script:** "In legal contexts, you will often hear the Truman case analyzed as a failure of proportionality under *Jus in Bello*. That is a valid legal critique. However, Anscombe is doing moral philosophy. She wants to show that the language of 'collateral damage' was being used to hide the reality of 'intentional killing.' If we treat this only as a proportionality failure, we accept the premise that these were legitimate military targets with unfortunate side effects. Anscombe denies that premise entirely."

  This approach respects the TA's instinct, aligns with the primary text, and sets up a robust critique of deterrence theory for the following week.
