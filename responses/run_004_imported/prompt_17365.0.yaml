answer: |-
  **Title:** The Gauge Freedom of Welfare: Why Harsanyi's Theorem Fails to Derive Utilitarianism

  **Introduction**

  Your intuition regarding the structural similarity between representation theorems in physics and axiomatic decision theory is well-founded. Just as we derive the existence of a temperature function from the transitivity of thermal equilibrium, Harsanyi sought to derive the existence of a social welfare function from the consistency of preferences under uncertainty. For a physicist, the 1955 Aggregation Theorem possesses an undeniable elegance: it suggests that if individual and social preferences obey the same structural laws (the von Neumann–Morgenstern axioms), the social utility function must be a linear combination of individual utility functions.

  However, mathematical elegance does not guarantee ethical truth. In physics, a representation theorem is valid only if the observables it relates correspond to physical reality. In ethics, the "observables" are preferences, and the target is "welfare." My verdict is definite: **Harsanyi's aggregation theorem does not give us good reason to accept utilitarianism.** While the mathematical derivation is sound, the theorem fails as a moral argument because it conflates the formal structure of rational choice with the substantive content of well-being (Sen's objection) and excludes distributive fairness from the domain of rationality itself (Diamond's objection). Attempts to rescue the theorem inevitably import the ethical conclusions they seek to prove, rendering the axiomatic derivation circular.

  **The Formal Structure and the Physics Analogy**

  To see where the derivation breaks down, we must reconstruct the argument with the precision you would apply to a statistical mechanics proof.

  Let $L$ be a set of lotteries over social outcomes. Harsanyi posits two conditions:
  1.  **Individual Rationality:** For each individual $i$, preferences $\succeq_i$ over $L$ satisfy the VNM axioms. Thus, there exists a utility function $U_i: L \to \mathbb{R}$, unique up to a positive affine transformation ($U'_i = a_i U_i + b_i, a_i > 0$), such that $L \succeq_i L' \iff E[U_i(L)] \geq E[U_i(L')]$.
  2.  **Social Rationality & Pareto:** Social preferences $\succeq_S$ satisfy the VNM axioms (yielding $W$) and satisfy the Pareto Indifference principle: if $U_i(L) = U_i(L')$ for all $i$, then $W(L) = W(L')$.

  Mathematically, this is a problem of linear algebra. The set of VNM utility functions forms a vector space. The Pareto condition implies that the social utility functional $W$ vanishes on the null space of the individual functionals. By a standard theorem on linear functionals, $W$ must lie in the span of the $U_i$. Thus:
  $$W = \sum_{i=1}^n a_i U_i + c$$
  If we add the Strong Pareto condition (unanimous preference implies social preference), the weights $a_i$ must be non-negative.

  To a physicist, this looks like a superposition principle. If the "social field" responds linearly to individual "potential fields," the total potential is the sum of the parts. Harsanyi argues that since we accept VNM for individuals, and Pareto is morally undeniable, we are forced into this weighted sum—essentially, utilitarianism.

  **Sen's Objection: The Problem of Gauge Invariance**

  Amartya Sen's objection strikes at the interpretability of the variables $U_i$. In your field, you cannot sum quantities with incompatible units or arbitrary zero points. If I measure temperature in Kelvin and you in Fahrenheit, we cannot sum our readings to find the "total heat" of a system without a conversion rule.

  VNM utility functions are unique only up to positive affine transformations. This is a "gauge freedom." For any individual $i$, the scale and zero-point of $U_i$ are arbitrary; only the ordering of *differences* in expected utility matters for that individual's choices. However, the social sum $W = \sum a_i U_i$ is sensitive to these arbitrary choices. If I rescale $U_1$ by a factor of 1000, the weight $a_1$ must shrink by 1/1000 to keep $W$ constant. But the theorem provides no mechanism to fix these scales relative to one another.

  Sen argues that Harsanyi equivokes on the word "utility."
  1.  **VNM Utility:** A formal index of risk-adjusted preference satisfaction. It carries no interpersonal information. One person's "1 util" might represent a trivial preference, while another's represents a life-or-death stake.
  2.  **Benthamite Welfare:** A substantive measure of well-being intended for interpersonal summation.

  Harsanyi's theorem proves that social preferences must be a weighted sum of *VNM indices*. It does not prove they must be a sum of *welfare*. To move from the former to the latter, one must assume **Interpersonal Comparability of Utility (ICU)**. But ICU is not a consequence of the VNM axioms; it is an independent ethical assumption. Without it, the weights $a_i$ are indeterminate. We could satisfy the theorem's conditions while assigning all weight to a dictator (setting $a_{dictator} = 1$, all others $0$), provided we scale the utilities appropriately.

  Therefore, the theorem does not derive utilitarianism from rationality and Pareto alone. It derives utilitarianism from rationality, Pareto, *and* an implicit assumption of interpersonal comparability that the theorem itself does not license. The "proof" is incomplete; it hides the ethically heavy lifting inside the scaling of the variables.

  **Diamond's Objection: The Ex-Ante Blindness**

  Even if we grant Sen's point and assume we can compare utilities, Peter Diamond's 1967 objection demonstrates that the VNM framework itself is ethically impoverished for social choice.

  Consider Diamond's example: Two individuals, one indivisible good (say, a life-saving drug).
  *   **Policy A:** Give to Person 1. (Utilities: 1, 0)
  *   **Policy B:** Give to Person 2. (Utilities: 0, 1)
  *   **Policy C:** Fair coin toss. (Expected Utilities: 0.5, 0.5)

  Under Harsanyi's framework, social evaluation is based on *ex-ante* expected utility.
  $W(A) = a_1(1) + a_2(0) = 0.5$ (assuming equal weights).
  $W(B) = a_1(0) + a_2(1) = 0.5$.
  $W(C) = a_1(0.5) + a_2(0.5) = 0.5$.

  The theorem forces society to be indifferent between giving the drug deterministically to one person and flipping a coin. Yet, most moral intuitions regard the coin toss as superior because it treats the individuals with equal respect *ex-ante*, acknowledging their equal claim before the outcome is realized.

  Diamond shows that Harsanyi's reliance on the VNM axioms for *society* forces an **Ex-Ante Pareto** principle that ignores distributional fairness. The VNM axioms require that if society prefers Lottery $L$ to $L'$, it must be because the expected utility of $L$ is higher. But fairness is often an *ex-post* concern regarding the distribution of outcomes, not just the expectation of preferences. By axiomatizing society as a VNM rational agent, Harsanyi builds a blindness to fairness into the foundation of the theorem. The theorem doesn't just fail to prove utilitarianism is *correct*; it proves that any social ordering satisfying these axioms *cannot* account for fairness as a distinct moral value.

  **The Rescue Attempt: Extended Preferences**

  Harsanyi was aware of Sen's criticism. In later work (notably *Morality and the Theory of Rational Behaviour*, 1977), he attempted to rescue the interpersonal comparability requirement through the concept of **Extended Preferences**.

  The argument is that to make interpersonal comparisons, an observer must imagine themselves in the position of each individual, adopting that individual's tastes and circumstances. If I can prefer "being Person A with A's preferences" to "being Person B with B's preferences," I have established a common scale of welfare across persons. Harsanyi argued that if we apply the VNM axioms to these "extended" preferences behind a veil of ignorance, we derive a unique cardinal utility scale for welfare, fixing the gauge freedom Sen identified.

  This is a serious attempt to ground the weights $a_i$ in rational choice rather than arbitrary assumption. However, this rescue fails for two reasons.

  First, it abandons the 1955 theorem's primary virtue: its reliance on *actual* revealed preferences. Extended preferences are hypothetical. There is no behavioral axiom that forces an observer to agree on these hypothetical rankings. Two observers might imagine "being Person A" differently. The "objectivity" of the scale is illusory.

  Second, and more damningly, this move concedes Sen's point. By introducing extended preferences, Harsanyi admits that the 1955 theorem *alone* was insufficient. The derivation of utilitarianism now rests on the ethical plausibility of the "veil of ignorance" thought experiment, not on the mathematical inevitability of the aggregation theorem. The axiomatic structure becomes a vessel for a specific Kantian/Rawlsian ethical premise (impartiality), rather than a derivation of utilitarianism from thin rationality.

  **Verdict**

  We must return to your initial curiosity: how much of welfare economics rests on axiomatic derivations similar to physics? In physics, if a representation theorem requires a variable that cannot be observed or defined without circularity, the theory is considered incomplete or effective, not fundamental.

  Harsanyi's 1955 theorem is a valid mathematical statement about linear functionals. But as a justification for utilitarianism, it is a failure.
  1.  **Sen is correct:** The theorem sums apples and oranges unless we impose interpersonal comparability from outside the system. Without that external imposition, the "utilitarian" sum is mathematically arbitrary.
  2.  **Diamond is correct:** The VNM axioms, when applied to social choice, structurally exclude fairness concerns that are morally mandatory. A theorem that forces indifference between a fair lottery and an unfair dictatorship (provided expected utilities match) cannot be the foundation of a correct moral theory.

  The rescue via extended preferences saves the utilitarian conclusion only by sacrificing the axiomatic purity of the original theorem. It admits that rationality alone is insufficient; one needs a substantive theory of empathy and impartiality.

  Therefore, **Harsanyi's aggregation theorem does not give us good reason to accept utilitarianism.** It demonstrates that utilitarianism is *consistent* with a specific set of rationality axioms, but consistency is not justification. The theorem acts as a mirror: if you already believe in interpersonal welfare comparability and ex-ante efficiency, it reflects utilitarianism back at you. But it cannot generate those beliefs from the bare mechanics of choice. For a physicist, the distinction is clear: Harsanyi has derived a conservation law, but he has not proven that the conserved quantity is the one that matters.
