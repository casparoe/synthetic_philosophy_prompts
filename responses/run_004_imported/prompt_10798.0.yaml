answer: |-
  Here are 10 interview questions designed to move past the introductory vignette and press on the philosophical and practical tensions in the classic Knobe Effect defense.

  ### 1. The Direction of Fit
  **Question:** The classic reading suggests our moral evaluation of an outcome shapes our descriptive judgment of the mental state preceding it. But cognitively, how does that work? Are you arguing that morality acts as a *heuristic* that shortcuts the evidence-gathering process, or are you claiming the very *definition* of intentionality is morally saturated? Because if it's the latter, it seems we can't even describe a mind without first judging it.
  **Follow-up:** If you say it's saturated by definition, doesn't that make cross-moral disagreement about intent impossible? If my morality says the act was good, and yours says it was bad, are we literally talking about two different psychological events?

  ### 2. The Norm-Violation Rival (Required)
  **Question:** Critics like Uttal and others have argued that it isn't *moral* badness driving the effect, but simply *norm-violation* of any kind—including statistical norms or even goofy conventions. If I violate a arbitrary rule about how to wear a hat, people might attribute intentionality differently. If the effect triggers on *any* deviation from the expected, doesn't that strip the "moral" out of the "moral judgment" thesis?
  **Follow-up:** You'll likely say moral norms are a distinct, weightier class of norms. But if the cognitive mechanism is the same—detecting a deviation from a baseline—why insist the *content* of the norm matters more than the *structure* of the violation?

  ### 3. The Pragmatic/Blame Objection (Required)
  **Question:** Let's talk about the "pragmatic" objection. Many philosophers argue that when people say the chairman *intentionally* harmed the environment, they aren't making a false claim about his psychology; they're using "intentionally" as a speech act to assign blame. It's a tool, not a truth-claim. Why should we accept your reading that the folk concept is *contaminated*, rather than the simpler view that people know the psychology is identical but choose the word "intentional" to signal censure?
  **Follow-up:** If it is just a pragmatic tool for blame, doesn't that suggest we *should* correct this usage in high-stakes contexts? Why defend a concept that functions as a camouflage for punishment?

  ### 4. Legal Implications & *Mens Rea* (Required)
  **Question:** In criminal law, *mens rea* is supposed to be a factual determination about the defendant's state of mind, distinct from the *actus reus*. If your thesis holds—that folk judgments of intent are inextricably bound to moral judgments of the outcome—doesn't that suggest juries are incapable of separating the "guilt" of the act from the "intent" of the mind?
  **Follow-up:** If you admit that moral outrage inflates intentionality ascriptions, should we be instructing juries to ignore their gut instincts on intent? Or are you comfortable with a legal system where "bad outcomes" psychologically manufacture "guilty minds"?

  ### 5. The "Skill" Asymmetry
  **Question:** The Knobe effect is strongest with side effects, but what about skill? If a novice golfer sinks a hole-in-one by luck, we say it wasn't intentional. But if a master golfer does it, we often do. The psychology might be similar (a swing), but the attribution changes based on the agent's history and the value of the outcome. Does your theory account for positive intentionality, or is it primarily a theory about how we attribute blame for negatives?
  **Follow-up:** If the mechanism is asymmetric—heavy on blame, light on praise—doesn't that suggest this isn't about "concepts" at all, but about an evolutionary threat-detection system?

  ### 6. Psychopathy and Moral Blindness
  **Question:** There's research suggesting individuals with high psychopathic traits show a diminished Knobe effect. They are less likely to say the chairman *intentionally* harmed the environment because they don't register the harm as morally salient. If the effect disappears when moral sensitivity disappears, doesn't that prove the moral judgment is the *cause*, not just a correlate?
  **Follow-up:** But if the "correct" attribution of intent relies on having a functional moral compass, does that mean psychopaths are seeing the *raw psychology* more clearly than the rest of us? Are they the only ones seeing the mind objectively?

  ### 7. The Deep Self vs. Observer Bias
  **Question:** Some defenders, like Chandra Sripada, argue this isn't about the *observer's* morality leaking in, but the observer tracking the *agent's* "Deep Self." We say the chairman intended harm because harm aligns with his values, whereas help does not. Is your view that the folk are actually tracking the agent's normative commitments, rather than importing their own?
  **Follow-up:** If it's about the agent's commitments, why does the effect weaken when the agent is coerced or ignorant? At what point does the "Deep Self" explanation just become a sophisticated way of saying "we blame bad people more"?

  ### 8. Cross-Cultural Universality
  **Question:** Most of this data comes from WEIRD (Western, Educated, Industrialized, Rich, Democratic) samples. In cultures with more holistic or collectivist moral frameworks, does the boundary of the "intentional agent" shift? If the Knobe effect varies culturally, does that undermine the claim that this is about the fundamental *concept* of action, rather than just local moral norms?
  **Follow-up:** If the concept of intentionality shifts based on cultural morality, does that mean there is no universal "folk psychology"? Are we all living in different cognitive realities?

  ### 9. AI and Non-Human Agents
  **Question:** We are increasingly interacting with algorithms that produce side effects. If an AI trading algorithm crashes the market to maximize profit, do we apply the Knobe effect to the code? If we say the AI *intentionally* crashed the market, are we projecting moral agency onto math, or does your theory suggest we can't help but moralize any goal-directed system?
  **Follow-up:** If we moralize algorithms, does that create a dangerous category error where we hold code responsible for outcomes it couldn't "intend" in any biological sense?

  ### 10. The Normative Upshot
  **Question:** Let's end on the "ought." If you're right, and our basic concept of intentional action is morally loaded, should we try to "clean up" our language? Should philosophers and scientists try to engineer a morally neutral term for "volitional causation," or is the moral loading a feature we should preserve because it binds action to responsibility?
  **Follow-up:** If you say we should preserve it, aren't you arguing that we should prioritize our desire to blame over our desire to accurately describe the machinery of the human mind?
