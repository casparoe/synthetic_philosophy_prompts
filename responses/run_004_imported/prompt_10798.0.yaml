      *   *Revision:* Make Q2 specifically about the *Uttal* or *Guglielmo* style objections (norms vs. morals). Make Q3 about the *error theory* (are we all wrong?). Make Q4 about *bias* in the courtroom.

      *Drafting the Follow-ups:* I need to predict the "Classic Knobe Defender" response. Usually, they argue that the concept *is* inherently normative.
      *   *Prediction:* She will likely argue that intentionality isn't a natural kind but a social tool.
      *   *Counter:* If it's a social tool, why treat it as a fact of the mind in court?

  4.  **Finalizing the List (aiming for 8-10 high-quality items):**

