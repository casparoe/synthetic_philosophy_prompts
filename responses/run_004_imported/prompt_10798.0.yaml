  2.  **Deconstruct the Knobe Effect & The Debate:**
      *   *The Effect:* People say the chairman *intentionally* harmed the environment (bad side effect) but *unintentionally* helped it (good side effect), even though the mental state (indifference) is identical.
      *   *Knobe's View (The Classic Reading):* Moral considerations are part of the cognitive machinery used to determine intentionality. It's conceptual, not just performative.
      *   *Rival 1 (Normative/Statistical):* It's about violating *any* norm (statistical or prescriptive), not just moral ones. (e.g., doing something weird vs. normal).
      *   *Rival 2 (Pragmatic/Blame):* We know the psychology is the same, but we use "intentionally" as a tool to blame. It's speech-act theory, not metaphysics of mind.
      *   *Implications:* If intentionality is morally loaded, legal *mens rea* might be unstable or biased.

  3.  **Drafting the Questions (Iterative Process):**

