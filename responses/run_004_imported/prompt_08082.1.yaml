      *   *Reference:* Mention L.A. Paul's "Transformative Experience." It fits perfectly here. Mention the concept of "Narrative Identity."

  8.  **Final Polish:** Ensure the distinction between *subthalamic nucleus* (motor/cognitive/limbic overlap) vs. *GPi* (more motor focused) is acknowledged as relevant context. Ensure the 13-year duration is noted (advanced disease implies higher stakes for QoL).

  9.  *(Final thought before generating)*: Make sure to tell the user that their role isn't to decide, but to facilitate the *quality* of the decision.

