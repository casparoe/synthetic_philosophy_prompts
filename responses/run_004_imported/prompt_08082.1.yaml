      *   **Step 3: Specific Conversational Prompts.** What should Grandpa ask himself? What should the family ask?
      *   **Step 4: The "Trial" Aspect.** Mention programming adjustments. It's not a one-shot switch; it's tunable. This mitigates the "can't test drive" fear slightly.
      *   **Step 5: Relational Context.** Involve the caregivers who notice the "offness."

  6.  **Drafting the Response (Iterative refinement):**
