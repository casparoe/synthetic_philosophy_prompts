      *   *Opening:* Validate the intuition. It's not just anxiety; it's a recognized bioethical dilemma.
      *   *Section 1: The Philosophical Difference.* Explain *why* risk/benefit fails. (Identity, Agency, Incommensurability). Use terms like "transformative experience" (L.A. Paul).
      *   *Section 2: The Clinical Nuance.* STN DBS specifically has known neuropsychiatric profiles. It's not random; it's mechanistic (limbic loops). Acknowledge the 13-year disease burden (PD itself changes personality).
      *   *Section 3: A Better Framework.* How to advise Grandpa.
          *   Distinguish Disease vs. Treatment effects.
