  **MEMORANDUM**

  **TO:** Grants Committee, University EA Alumni Fund
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Finalist Allocation ($180,000)

  **Executive Summary**
  After reviewing the proposals from the Against Malaria Foundation (AMF) and the Pathogen Surveillance Fellowship, I recommend we allocate the full $180,000 to the **Fellowship**.

  This recommendation is not a dismissal of the near-termist case, which is robust and evidence-backed. Rather, it is an attempt to apply our founding mandate—"whatever does the most good"—under conditions of severe epistemic uncertainty. While the Cluelessness and Pascal's Mugging objections raised by the committee are valid, they do not uniquely disqualify the Fellowship when subjected to symmetric scrutiny.

  **1. Engaging the Cluelessness and Pascal's Mugging Objections**
  Member 2 has argued that the Fellowship's impact is unverifiable and that its expected value (EV) calculation relies on arbitrary probabilities multiplied by astronomical stakes. I offer three counter-points for consideration:

  *   **Symmetry of Cluelessness:** The objection that we cannot trace the long-term flow-through effects of our grants applies to AMF as well. Saving a life today alters the population trajectory, potentially changing *who* exists in the future. We have no non-arbitrary way to know if those future people will face higher or lower existential risk. If "cluelessness" vetoes long-termist interventions, it must also veto near-termist ones once we account for their infinite time-horizon effects. We cannot let perfect knowledge of the *direct* effect blind us to the uncertainty of the *total* effect.
  *   **Probability Estimation vs. Mugging:** A Pascal's Mugging relies on probabilities so vanishingly small (e.g., 1 in $10^{100}$) that they should be rounded to zero. The Fellowship's case does not rest on magic; it rests on expert consensus regarding pandemic risk. We are not betting on a 1 in a trillion chance, but on a marginal reduction of a risk that experts estimate is non-negligible (e.g., 1% per century). Even if we apply a massive "epistemic discount rate" to these figures, the sheer magnitude of the stakes (potentially billions of future lives) allows the EV to remain competitive with saving dozens of lives today.
  *   **Tractability and Neglectedness:** AMF is highly successful, but it is also crowded. The marginal dollar there is likely less impactful than it was five years ago. Biosecurity policy is talent-constrained. Funding this fellowship directly addresses a bottleneck (training researchers) that is currently limiting the field's capacity. The leverage of a marginal dollar in a neglected field is often higher than in a proven one.

  **2. Why Not Split the Funds?**
  Member 3 has suggested a 50/50 split. While this feels like a prudent hedge, it is only principled if we believe the two options are *incommensurable* (i.e., we are operating under two different moral frameworks). However, our mandate asks us to find the *single* option that does the "most good."

  Splitting the funds dilutes our impact in both areas. $90,000 may not fully fund a fellow's stipend and research budget, rendering the Fellowship unviable, while $90,000 to AMF saves significantly fewer lives than $180,000. Unless we are truly agnostic between the moral worth of a present life vs. a future life, we should back the model we find more probable. Diversification is a financial strategy; moral grantmaking should aim for maximum expected value, not minimum regret.

  **3. The Strongest Case for AMF**
  I want to honestly acknowledge the strongest argument for the Against Malaria Foundation, which is **robustness**.
  We *know* AMF saves lives. The causal chain is short, verified, and auditable. In a world where our long-termist models could be fundamentally flawed—where biosecurity interventions might inadvertently accelerate risky research, or where the "long future" never materializes for unrelated reasons—AMF guarantees a tangible moral good. If our primary constraint is epistemic humility, AMF is the superior choice. It ensures that this bequest definitely reduces suffering, regardless of how the far future unfolds.

  **Conclusion**
  We are deadlocked because we are weighing **certainty of modest good** against **uncertainty of astronomical good**. Given our mandate to maximize good, and acknowledging that "cluelessness" applies to both options, I believe we must follow the expected value calculation even when the variance is high.

  I ask that we vote to fund the Fellowship.

  **[Your Name]**
