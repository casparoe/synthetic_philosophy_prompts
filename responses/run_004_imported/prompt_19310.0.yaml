answer: |-
  **Setting:** *The seminar room is dim, the whiteboard still crowded with the jagged arrows of the exclusion argument from two hours ago. Empty coffee cups cluster around the table. Only MARCUS and ELENA remain.*

  **MARCUS:** They're treating Multiple Realizability like a talisman. Wave it around, say "one-to-many," and suddenly Kim's argument dissolves. They don't see that MR is the premise that gets them into the trap, not the key that gets them out.

  **ELENA:** Because they think Kim's arguing from identity. They think if he grants MR, he has to grant non-reductionism, and then they assume non-reductionism is compatible with causation by default. They're skipping the exclusion step entirely.

  **MARCUS:** Exactly. MR forces the supervenience relation. But once you have supervenience, and you accept closure—which any physicalist worth their salt has to accept—you're squeezed. I tried to tell them: I'm willing to meet Kim halfway on the intentional states. If 'pain' is just a functional role defined by its causal relations, then fine, locally reduce it. Identify the pain-instance with the realizer-instance. Causation is preserved because identity is preserved.

  **ELENA:** But you won't grant that for the phenomenal character.

  **MARCUS:** I can't. If qualia resist functionalization, they aren't identical to the physical realizers. And if they aren't identical, and the physical realizer is causally sufficient... what work is left for the qualia to do? I'd rather be an epiphenomenalist about qualia than a dualist about causation. At least that keeps the physical world closed.

  **ELENA:** That's the concession I'm trying to block. You're assuming the mental and physical properties are *competitors* for the same causal ground. That's where Yablo helps. It's not about competition; it's about granularity.

  **MARCUS:** Proportionality. I know the move. The mental property is the determinable, the physical realizer is the determinate. The effect requires a cause specific enough to produce it, but not so specific that it excludes relevant alternatives.

  **ELENA:** Right. If my belief that there's water causes me to walk to the kitchen, the neural state N is too specific. If I'd had a slightly different neural state N*, but still realized the same belief, I still would have walked. N is not counterfactually necessary for the behavior in the right way. The belief is the proportional cause. It sits at the right level of abstraction. So, N doesn't exclude M. They aren't two distinct causes banging into the effect; M stands to N as red stands to scarlet.

  **MARCUS:** But here's where I press you, Elena. Does this actually dissolve the overdetermination worry, or does it just redescribe it one level up? Kim's worry isn't just about counterfactual dependence. It's about production. It's about the metaphysical 'oomph.'

  **ELENA:** The 'oomph' picture is the problem.

  **MARCUS:** Is it? Look, if N is causally sufficient for the behavior, it generates the effect. The physical mechanism closes the loop. If M is distinct from N—even as a determinable—does M *also* generate the effect? If you say yes, you have two generators. If you say M generates it *by virtue of* N generating it, then M's causal power is borrowed. But if it's borrowed, isn't it just N's power?

  **ELENA:** Not if causation isn't about transfer of energy or mechanical production. If causation is about systematic difference-making, then M is doing work N can't do. N fixes the micro-details, but M fixes the pattern. The exclusion principle assumes causation is a zero-sum game of production. Yablo shows it's not zero-sum if the causes stand in a constitutive relation.

  **MARCUS:** But closure doesn't care about constitutive relations. Closure says every physical event has a sufficient physical cause. If N is sufficient, and M is distinct, M is excluded. You're saying M isn't distinct enough to be excluded, but not identical enough to be the physical cause. It feels like you're trying to have your cake and eat it too. You want the ontological distinctness for non-reductionism, but the causal intimacy of identity.

  **ELENA:** I want the ontological distinctness because the properties have different modal profiles. But I deny that distinctness implies causal competition. That's the Humean hang-up. You're treating causation like a glue that binds events, and you're worried there isn't enough glue for both M and N.

  **MARCUS:** I'm worried that if N does all the gluing, M is just riding along. And if M is riding along, why call it a cause? Call it a marker. Call it a shadow. Your move works beautifully if we adopt a counterfactual theory of causation. But if we think causation involves generation...

  **ELENA:** Then we're not arguing about the mind anymore, Marcus. We're arguing about causation.

  **MARCUS:** *(Pauses, leaning back)* I suppose we are.

  **ELENA:** That's what the students are missing. They think the exclusion argument is a problem for physicalism about the mind. It's not. It's a problem for any non-reductive view embedded in a generative metaphysics of causation. If you think causes produce effects like billiard balls, Kim wins. Every time. The only way out is to argue that causation is fundamentally about dependency structures, not production.

  **MARCUS:** And if I argue that production is the only thing that secures the asymmetry of causation? If difference-making is symmetric, or too widespread, then everything becomes a cause. The Big Bang is a difference-maker for my typing this sentence. But it isn't the cause. I need production to prune the causal field.

  **ELENA:** And I need difference-making to save the mental from being pruned away.

  **MARCUS:** *(Sighs, gathering papers)* So we're at an impasse. But at least it's the right impasse.

  **ELENA:** Better than the students thinking MR solves anything.

  **MARCUS:** Next week, we skip the replies. We read Menzies. Or maybe Hitchcock. Let's make them argue about what a cause *is* before they decide if the mind can be one.

  **ELENA:** Deal. But I'm still keeping the qualia.

  **MARCUS:** *(Smiles)* We'll see. Turn out the lights?

  **ELENA:** Already did.
