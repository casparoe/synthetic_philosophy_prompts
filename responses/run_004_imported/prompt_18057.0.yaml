answer: |-
  This is a solid reconstruction. You have the core structure of Lewis's 1976 "Probabilities of Conditionals and Conditional Probabilities" argument correct, but you have a specific algebraic error in the recombination step that changes the final contradiction (though not the ultimate conclusion of triviality).

  Here is the line-by-line sanity check, the verdict on your moral, and the fill-in on Van Fraassen/Hájek.

  ### 1. The Derivation Check

  Your setup is correct:
  *   **Thesis:** $P(A > B) = P(B|A)$
  *   **Closure:** If $P$ is in the class of reasonable functions, $P(\cdot | X)$ is too.
  *   **Assumption:** $0 < P(B|A) < 1$.

  **Steps 1–8 (Conditionalizing on B and ~B):**
  These are correct.
  *   $P_B(A > B) = P(B | A \land B) = 1$.
  *   $P_{\neg B}(A > B) = P(B | A \land \neg B) = 0$.

  **Step 9 (The Recombination):**
  **This is where you fumbled.**
  You wrote:
  > $P(A>B) = P(A) \cdot P_B(A>B) + P(\neg A) \cdot P_{\neg B}(A>B)$

  You partitioned by $A$ and $\neg A$, but your previous steps established the values of the conditional based on partitioning by $B$ and $\neg B$. To use the Law of Total Probability with the values you derived (1 and 0), you must weight them by the probabilities of the conditions you applied ($B$ and $\neg B$).

  **Correction:**
  $$P(A > B) = P(B) \cdot P(A > B | B) + P(\neg B) \cdot P(A > B | \neg B)$$
  $$P(A > B) = P(B) \cdot 1 + P(\neg B) \cdot 0$$
  $$P(A > B) = P(B)$$

  **The Contradiction:**
  The Thesis states $P(A > B) = P(B|A)$.
  Your derivation now yields $P(A > B) = P(B)$.
  Therefore, **$P(B|A) = P(B)$**.

  **Implication:**
  This implies that $A$ and $B$ are probabilistically independent. Since $A$ and $B$ were arbitrary (provided they weren't already 0 or 1), the Thesis implies that **no two propositions can be probabilistically dependent**. This is the triviality result. (Your version implied $P(B|A) = P(A)$, which is also absurd, but independence is the standard Lewis result).

  ### 2. The Moral Check

  > "You can't have indicative conditionals be ordinary propositions whose credences behave the normal way AND have conditional probability track them."

  **Verdict:** This is a fair and standard summary, with one technical nuance.

  **The Nuance:**
  The phrase "ordinary propositions" does heavy lifting. In the context of Lewis's proof, "ordinary proposition" means an element of a Boolean algebra that is **fixed** across the class of reasonable credence functions.
  *   **Lewis's Conclusion:** There is no function from pairs of propositions $(A, B)$ to a proposition $(A > B)$ in the algebra such that the Thesis holds for all $P$.
  *   **The Standard Lesson:** Most philosophers of language (Adams, Edgington, Gibbard) take this to mean conditionals do not express propositions at all (they lack truth conditions). They express *constraints on credence* or have *assertability conditions* rather than truth conditions. $P(B|A)$ measures the assertability of "If A, B," not the probability that "If A, B" is true.

  So your moral is accurate for the LW audience: you cannot treat "If A then B" as a fact of the world (a proposition) that you assign a standard probability to, if you want that probability to equal $P(B|A)$.

  ### 3. The Missing Pieces (Van Fraassen & Weaker Premises)

  **Van Fraassen's Response (1976):**
  You recalled correctly that Van Fraassen offered a counter-model.
  *   **The Move:** Van Fraassen showed you *can* satisfy the Thesis if you reject the assumption that the proposition expressed by $(A > B)$ is fixed across all credence functions.
  *   **The Catch:** In his model, the proposition $(A > B)$ is **context-dependent**. It shifts depending on the agent's current probability function $P$.
  *   **Why Lewis still wins:** Lewis's triviality result targets the idea that conditionals describe objective features of the world (or fixed logical relations). If the proposition expressed by "If it rains, the match is cancelled" changes depending on *my specific subjective credences* about rain and matches, it's hard to maintain that the conditional is describing a mind-independent state of affairs. Van Fraassen saves the Thesis but makes conditionals radically subjective/contextual in a way many find implausible for communication.

  **Weaker Premises (Hájek):**
  You mentioned a version without full closure. Alan Hájek is the authority here (see *"Triviality Pursuit"*, 2011).
  *   Lewis assumed the class of reasonable credence functions is closed under conditionalization.
  *   Hájek proved triviality results that require much less. He showed that even if you only assume there are *some* probability functions that can be updated, or even without assuming conditionalization is always defined, you still get triviality if you want the Thesis to hold universally.
  *   There are also "Local Triviality" results: even if you don't demand the Thesis hold for *all* $P$, demanding it hold for enough $P$ to allow for learning still breaks the system.

  ### Summary for your Shortform
  1.  **Fix the math:** Change the weights in the total probability step from $P(A)/P(\neg A)$ to $P(B)/P(\neg B)$. The result is $P(B|A) = P(B)$ (independence), not $P(B|A) = P(A)$.
  2.  **Keep the moral:** It's accurate. The Thesis + Propositionality = Triviality.
  3.  **Add a footnote:** Mention Van Fraassen allows Propositionality + Thesis only if the proposition expressed varies with the credence function (contextualism), which most find costly.

  You are good to post once that variable swap is fixed. It's a clean explanation of a technical result.
