answer: |-
  You have hit upon one of the most fascinating and poignant tensions in the history of modern philosophy. Your reading of Sidgwick is astute: the connection between the "Dualism of Practical Reason" in *The Methods of Ethics* (1874) and his founding of the Society for Psychical Research (SPR) in 1882 is not merely biographical trivia; it is a philosophical necessity for him.

  Here is an analysis of how the ethical problem motivated the psychical research, and a judgment on the rigor and success of both projects.

  ### 1. The Ethical Impasse: Why Proof Was Necessary

  To understand the motivation, we must first clarify the "Dualism of Practical Reason." Sidgwick analyzed the three main methods of ethics: Intuitionism, Egoistic Hedonism (rational self-interest), and Universalistic Hedonism (Utilitarianism).

  He found that both Egoism and Utilitarianism were rationally defensible.
  *   **Utilitarianism** demands I maximize the general happiness.
  *   **Egoism** demands I maximize my own happiness.

  In a secular, materialist universe, these two often conflict. If sacrificing my life or happiness benefits the world but destroys me, Rational Egoism says "don't do it," while Utilitarianism says "do it." Sidgwick could find no rational way to prioritize one over the other without assuming the universe is structured such that **virtue is always rewarded and vice punished.**

  **The Kantian Contrast:**
  As you noted, Kant faced a similar gap. Kant resolved it via the "Postulates of Practical Reason." He argued that while we cannot *know* God or Immortality exists, we must *postulate* them as a condition of the moral law. It is a matter of faith required for moral coherence.

  **Sidgwick's Empiricism:**
  Sidgwick, however, was a rigorous empiricist. He found Kant's solution intellectually dishonest. For Sidgwick, if morality is to be fully rational, the coincidence of duty and self-interest must be a **fact**, not a faith. He needed empirical evidence that the moral order of the universe is real. Specifically, he needed evidence of:
  1.  **God:** A moral governor who enforces justice.
  2.  **Immortality:** A future state where the sacrifices of this life are compensated.

  Without this evidence, Sidgwick concluded that ethics rests on a "fundamental contradiction." Reason is divided against itself. This was unbearable for a thinker of his systematic bent.

  ### 2. The Turn to Psychical Research

  This is where the Society for Psychical Research enters. Sidgwick did not join the SPR as a gullible spiritualist seeking comfort. He joined as a skeptical scientist seeking the "one solid fact" that would break the materialist deadlock.

  *   **The Goal:** If one could prove, via scientific observation, that consciousness survives death (through mediums, apparitions, or telepathy), it would imply a non-material reality. If a non-material reality exists, the possibility of a moral governor (God) and a future state of retribution becomes empirically plausible.
  *   **The Method:** Sidgwick applied the same scrutiny to mediums that he applied to ethical axioms. He was notoriously difficult to convince. He investigated the famous medium Eusapia Palladino and others with a view to exposing fraud as much as finding truth.
  *   **The Motivation:** It was not a hobby; it was a rescue mission for Ethics. If psychical research succeeded, the Dualism of Practical Reason would be resolved. Duty and Self-Interest would coincide in the long run because the "self" continues long enough for the balance to be struck.

  ### 3. Comparing Rigor and Success

  Judging these two projects by Sidgwick's own standards of clarity, logic, and empirical honesty yields a clear, if tragic, verdict.

  #### The Ethical Project (*The Methods of Ethics*)
  *   **Rigor:** Extraordinary. Sidgwick's analysis of common-sense morality is arguably the finest in the English language. He stripped away vagueness and exposed the logical structure of moral reasoning.
  *   **Success:** **High.**
      *   Sidgwick succeeded in his aim to clarify the methods of ethics.
      *   Crucially, he succeeded in his honesty. By admitting the Dualism remained unresolved, he prevented future philosophers from building castles on sand. G.E. Moore, Bertrand Russell, and John Rawls all regarded *The Methods of Ethics* as a masterpiece precisely because Sidgwick defined the problems so sharply that others could try to solve them.
      *   He achieved "negative success": he proved that secular utilitarianism cannot fully justify itself without further metaphysical assumptions.

  #### The Psychical Project (The SPR)
  *   **Rigor:** High (for the time), but ultimately misplaced. Sidgwick insisted on controlled conditions and skeptical inquiry. He helped move the discussion of paranormal phenomena from the parlor to the laboratory. In this sense, he applied his ethical rigor to the investigation.
  *   **Success:** **Failure.**
      *   By Sidgwick's own empirical standards, the project failed. He died in 1900 without finding the "solid fact" of survival he sought.
      *   While the SPR contributed to the early development of psychology, its core aim—proving survival of death to validate a moral order—produced no verifiable evidence that withstands scientific scrutiny then or now.
      *   Sidgwick remained agnostic to the end. He wrote that he had found "evidence which... suggests survival," but never the proof required to resolve the ethical dualism.

  ### The Verdict

  If we judge by **internal coherence and enduring influence**, the **Ethical Project** is the overwhelming success. *The Methods of Ethics* remains a central text in moral philosophy. Sidgwick's rigor there was rewarded with clarity and lasting impact.

  If we judge by **achieving the stated objective**, the **Psychical Project** was a failure. It did not provide the empirical bridge needed to reconcile Egoism and Utilitarianism.

  However, there is a deeper sense in which the two projects must be judged together. Sidgwick's greatness lies in his refusal to compromise.
  *   Most philosophers would have done what Kant did: accept a postulate and move on.
  *   Most scientists would have dismissed the afterlife as unprovable and accepted a secular ethics.

  Sidgwick did neither. He held the tension. He recognized that if Ethics requires a Moral Order, and Science requires Evidence, then one must search for Evidence of the Moral Order.

  **Conclusion:**
  Sidgwick pursued the ethical project more successfully because he was willing to accept a negative result (the unresolved Dualism) as a truthful conclusion. In psychical research, he was chasing a positive result that never materialized.

  Ultimately, the psychical research stands as a monument to the desperation of his ethical position. It shows us a thinker so committed to the rationality of morality that he spent decades hunting for ghosts, not because he loved the supernatural, but because he loved the Rational Good too much to let it rest on an unproven assumption. In that light, the "failure" of his psychical research only underscores the tragic rigor of his ethics.
