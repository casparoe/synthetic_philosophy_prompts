answer: |-
  # The Convergence Gambit

  In 2004, Eliezer Yudkowsky proposed a solution to the most dangerous problem in human history. If we build a superintelligence, how do we ensure it wants what we want? The obvious answer—program it with our current values—fails because our current values are contradictory, short-sighted, and often barbaric. The better answer, Yudkowsky suggested, was Coherent Extrapolated Volition (CEV).

  The proposal was elegant. Do not ask the AI what we *do* want. Ask it what we *would* want "if we knew more, thought faster, were more the people we wished we were, grew up farther together." The AI would simulate an idealized version of humanity, let that idealized humanity deliberate, and then execute the resulting consensus.

  For two decades, CEV has haunted the AI alignment discourse. It is treated as a noble impossibility, a beautiful dream that might be technically unfeasible. But there is a deeper, quieter objection that rarely gets the attention it deserves. The entire scheme rests on a metaphysical bet: that idealizing human preferences causes them to **converge**.

  CEV assumes that if you scrub away ignorance, cognitive bias, and tribalism, the remaining "true" human desires will harmonize into a coherent whole. It assumes that moral disagreement is primarily a product of error. If this assumption is false—if idealization leads to divergence, or to sharper, more entrenched conflict—then CEV does not solve the alignment problem. It merely obscures the moment where the AI chooses which subset of idealized humans to listen to, and calls that choice "objective."

  To understand whether CEV can work, we must grapple with the convergence assumption. Does moral truth exist waiting to be found, or is value something we create through conflict and compromise?

  ### The Case for Convergence: The Error Theory

  The strongest argument for convergence relies on the idea that most human conflict is instrumental, not fundamental. We fight over resources, status, and security because we are scared, ignorant, and trapped in zero-sum games.

  Proponents of convergence argue that if you give people perfect information and unlimited cognitive processing power, the reasons for conflict evaporate. Consider the Tragedy of the Commons. Two farmers overgraze a shared field not because they value destruction, but because they lack a coordination mechanism and fear the other will defect first. An idealized version of these farmers, thinking faster and knowing more, would instantly recognize the Nash equilibrium and cooperate. They would converge on a system of sustainable management.

  This "Error Theory" of moral disagreement suggests that what looks like a clash of values is often a clash of models. The religious zealot and the secular humanist might appear to have irreconcilable worldviews. But if both knew the true state of the universe (does God exist? What is the nature of consciousness?), one of them would realize they were operating on false premises. Once the factual errors are corrected, the moral imperatives might align.

  Furthermore, there is the argument from shared biology. We are all members of the same species, evolved to seek flourishing, connection, and meaning. While our surface preferences differ (some like jazz, some like country), our deep structural values are remarkably similar. We all prefer happiness to suffering, agency to coercion, and life to death. The convergence bet posits that "idealization" acts as a filter, stripping away the noisy surface preferences to reveal the universal signal underneath. In this view, the "people we wish we were" are all wishing for the same thing, because the "wish" is rooted in the same evolutionary substrate.

  Finally, there is the Rawlsian intuition. If you place idealized agents behind a veil of ignorance—where they do not know their specific place in the world—they tend to agree on principles of justice. CEV effectively automates the Veil of Ignorance. By forcing our extrapolated volitions to "grow up farther together," it simulates a deliberation where no single tribe can dominate. The resulting consensus isn't a suppression of difference, but the discovery of a common language that was always there, buried under the noise of scarcity.

  ### The Case Against Convergence: The Pluralist Reality

  The case against convergence is rooted in the observation that value is not a mountain peak waiting to be climbed, but a landscape of incompatible goods. This is the argument from Value Pluralism, championed by philosophers like Isaiah Berlin and Bernard Williams.

  Pluralism argues that human values are inherently incommensurable. Liberty conflicts with Equality. Security conflicts with Adventure. Tradition conflicts with Progress. These are not errors to be solved by more information. You can know *everything* about the trade-off between privacy and security and still rationally choose privacy, while another equally informed, equally rational person chooses security. Idealization does not resolve the trade-off; it clarifies it. If anything, knowing more might make compromise *harder*, because the idealized agents understand exactly what is being sacrificed.

  Consider the "Experience Machine" thought experiment. Some people, if offered a life of perfect simulated happiness, would plug in. Others would refuse, valuing "contact with reality" even if it brings pain. This is a fundamental split in what humans value: hedonic satisfaction versus ontological truth. There is no amount of "thinking faster" that reconciles these positions. An idealized humanity would not converge on a single answer; it would fracture. Half would plug in, half would stay out. CEV requires a single coherent output. If the extrapolated volition splits 50/50, the "Coherent" in CEV is a fiction. The AI must then choose, and that choice is not an extrapolation of human will, but an imposition upon it.

  Moreover, the convergence assumption ignores the role of path dependence in identity. Who we are is defined by our specific history, our culture, and our limitations. The CEV instruction to "grow up farther together" risks erasing the very particularities that generate value. If you idealize a Buddhist monk and a Silicon Valley transhumanist enough, do they meet in the middle? Or does the monk become a *more perfect* monk, seeking dissolution of the self, while the transhumanist becomes a *more perfect* transhumanist, seeking the amplification of the self?

  There is also the dark possibility that information radicalizes. We often assume that "knowing more" makes people more moderate. But history suggests that deep engagement with a worldview often leads to fundamentalism, not liberalism. If an idealized agent fully comprehends the logical implications of a specific moral framework, they may become less willing to compromise, not more. Convergence might only be possible if we idealize people into becoming bland centrists, stripping away the conviction that drives moral progress.

  Finally, there is the problem of power. If convergence does not happen naturally, the algorithm used to force coherence becomes a political weapon. If the extrapolation function weights certain types of reasoning (e.g., utilitarian calculus) over others (e.g., deontological rights), the AI isn't finding humanity's will; it's privileging the preferences of the people who think like the AI's designers. The "Coherent" in CEV becomes a euphemism for "The values of the people who win the argument in the simulation."

  ### The Verdict

  So, does the convergence assumption hold up?

  **It does not.**

  We must commit to a verdict: The bet that idealized preferences converge is a category error. It mistakes *rationality* for *uniformity*.

  While convergence is plausible for **instrumental goals** (survival, resource acquisition, basic coordination), it fails catastrophically for **intrinsic values** (the meaning of life, the balance of trade-offs, the nature of the good). The "Error Theory" works for physics, but it fails for ethics. In physics, if two observers disagree, one is usually wrong about the data. In ethics, two observers can have all the data and still disagree on the weight of the values.

  The CEV framework implicitly assumes a monistic theory of value—that there is one "Right Thing" to be done, and disagreement is just noise. But the human condition is defined by pluralism. We value things that are mutually exclusive. We want safety and risk. We want community and individuality.

  Therefore, the "Coherent" in Coherent Extrapolated Volition is a coercive fiction. If you run the CEV algorithm on a pluralistic humanity, one of two things will happen:
  1.  **Divergence:** The output is incoherent because the idealized humans cannot agree. The AI crashes or acts randomly.
  2.  **Domination:** The algorithm forces coherence by privileging one cluster of values over another (e.g., utilitarian efficiency over deontological rights) and labels it "Humanity's Will."

  This is not a "plausible for basic needs, not for contested values" hedge. This is a structural failure. Basic needs are easy; alignment is not about keeping us fed, it's about navigating the contested values that define our future. If CEV cannot handle contested values, it cannot solve alignment.

  The convergence assumption is a seductive dream of a universe where morality is math. It is not. Morality is politics without violence. By trying to compute a political solution, CEV attempts to bypass the negotiation that *is* the human moral experience.

  The verdict is that CEV, as originally formulated, is doomed. It seeks a consensus that does not exist. A viable alignment strategy cannot rely on the hope that we all want the same thing deep down. It must accept that we don't, and build systems that can accommodate permanent, irreducible disagreement without destroying us. We do not need an AI that tells us what we *would* agree on. We need an AI that allows us to survive our inability to agree.
