      *   **Conflict:** They are combining savings. Sister wants to make investment decisions because her method is "reliable." User argues that since the *outcome* was identical, their skill levels should be considered equal for this pick.
      *   **Core Question:** How was the sister's approach actually better if the result was the same? Are they equally good at this?

  2.  **Identify the Underlying Concepts:**
      *   **Process vs. Outcome:** This is the central philosophical and practical conflict. In investing (and poker, chess, etc.), a good process doesn't guarantee a good outcome every time, and a bad process can yield a good outcome occasionally (luck).
      *   **Repeatability/Sustainability:** Can the method be done again with similar success?
      *   **Risk Management:** Did the sister understand *why* the investment was safe/risky, whereas the user was blind to risk?
      *   **Survivorship Bias/Luck:** The user got lucky this time. Relying on luck is not a strategy.
      *   **Behavioral Finance:** Overconfidence bias (user thinking they are skilled because of one win).

  3.  **Formulate the Argument:**
      *   *Acknowledge the validity of the feeling:* It feels unfair that effort doesn't get "credited" in the final dollar amount.
      *   *Distinguish Process from Outcome:* This is the most important point. The result tells you *what* happened, the process tells you *why* and *if it will happen again*.
      *   *The "Russian Roulette" Analogy:* A classic way to explain risk. If two people play Russian Roulette and both survive, are they equally skilled? No. One took a calculated risk (or no risk), the other took a deadly risk and got lucky.
      *   *Repeatability:* Can the user do it again? If they pick 10 stocks based on names, will 10 succeed? Unlikely. If the sister picks 10 stocks based on fundamentals, statistically more should succeed.
      *   *Risk Understanding:* If the stock had crashed, the sister would have known *why* and when to cut losses. The user would have been confused and panicked.
      *   *Conclusion:* The sister isn't claiming she's smarter as a person, but that her *system* is better for managing *future* money.

