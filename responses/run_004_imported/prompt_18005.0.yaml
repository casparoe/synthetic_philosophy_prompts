answer: |-
  Good evening. For those of you who don't know me, I'm [Name], one of [Mentor's Name]'s doctoral students. And for those of you who *do* know me, you know that standing here feels a bit like standing at the defense, forty years late.

  [Mentor's Name], we are here to celebrate forty years of your work. But for those of us in the academic lineage, we are also here to celebrate a specific tradition. As many of you know, when [Mentor's Name] sent a student out into the world, she didn't give a pen or a plaque. She gave a book. *Émilie du Châtelet's Discourse on Happiness.*

  For the family and friends here: Du Châtelet was an eighteenth-century French physicist and philosopher who lived a life as intense and complicated as any of the characters in the novels she read. She wrote this short essay near the end of her life. It is not a self-help book. It does not tell you to "follow your dreams" or "think positive."

  For the students here: You know the inscription. *"Study is the one passion fortune cannot touch."*

  We all have that copy. Some of us keep it on the desk; some of us keep it in the drawer. But tonight, as we mark the end of your career, I think we have to be honest about what that inscription means. Because Du Châtelet was not a sentimentalist.

  She argues in that essay that happiness relies on illusions. She writes that glory is unreliable, that the opinions of others are fickle, and that even our strongest passions eventually burn out or change shape. She would be the first to admit that retirement *is* a stroke of fortune. It is a closing of a door. The daily rhythm of the lab, the urgency of the problem, the specific identity of being "the physicist"—Du Châtelet would tell us not to lie to ourselves. That passion *is* ending. The career *is* vulnerable to time.

  If I stood here and said, "You'll never really leave physics," I would be insulting her intelligence, and I would be insulting yours.

  But there is another argument Du Châtelet makes. She writes that while we cannot control fortune, we can cultivate a taste that makes us less dependent on it. She believed that the life of the mind offers a shelter.

  [Mentor's Name], you gave us that book because you knew that the shelter wasn't the building, or the tenure, or the awards. The shelter was the practice itself.

  To the family here: You saw her come home tired. You saw her worry about grants, about papers, about the relentless grind of discovery. You might wonder what is left when that stops.

  To the students here: We know what is left.

  Du Châtelet wrote that study is immune to fortune. But looking around this room, I realize she was only half right. *Your* study is no longer immune to fortune; you are retiring. But you made sure that the passion itself became immune. Because you didn't just teach us physics. You taught us how to inhabit that illusion she wrote about—the beautiful, necessary illusion that the universe makes sense, and that we are capable of listening to it.

  You cannot do the work anymore. But you ensured the work continues. You distributed your passion across this room. You made us the carriers of the very thing fortune cannot touch.

  So, [Mentor's Name], I will not wish you "happy hunting" in this next chapter, and I will not pretend nothing has changed. Du Châtelet teaches us to face the truth of our transitions.

  Instead, I will say this: You organized your life around a passion that required rigor, honesty, and a willingness to be wrong in the pursuit of being right. You gave us the tools to survive the loss of illusions, because you never sold us false ones.

  The career is over. The passion, however, has simply changed address.

  Please raise your glasses.

  To [Mentor's Name]. May your next illusion be as beautiful as your last one. And may you find, as Du Châtelet promised, that while fortune touches the career, it cannot touch the life you built.

  To [Mentor's Name].
