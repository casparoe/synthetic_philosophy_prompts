answer: |-
  **Marcus:** Let's be blunt about Bradley's Regress. You Fregeans claim to stop it by positing that concepts are "unsaturated." The object is saturated; the concept is a function waiting for an argument. No extra relation is needed because the unsaturatedness *is* the glue. But here is the Concept Horse paradox: The moment you try to explain this doctrine, you have to talk about the concept. You say, "The concept *horse* is unsaturated." But in that sentence, "The concept *horse*" is the grammatical subject. It occupies the argument place. You have turned the concept into an object to talk about it. So, either unsaturatedness is a property of an object—in which case you need a tie to bind that property to the object, and the regress restarts—or your doctrine is literally unsayable. If you can't state your solution without violating it, have you really solved anything?

  **Elena:** You're conflating the limitations of natural language with the structure of thought. Frege admitted this explicitly. When I say "The concept *horse* is unsaturated," I am using a proper name as a proxy. I know, and you know, that I am not referring to an object in the ontological sense, but marking a logical boundary. The regress stops precisely because unsaturatedness is not a *constituent*. It's not a "thing" that needs gluing. It is a mode of presentation. If I say "Socrates is wise," the unity isn't achieved by a third thing called "instantiation" hovering between Socrates and wisdom. The unity is internal to the logical form of the predication. The paradox you cite shows that language forces us to objectify to communicate, but it doesn't show that the *thought* itself contains an object where there should be a function. The regress arises from treating logical form as another brick in the wall. I'm saying it's the mortar that isn't made of bricks.

  **Marcus:** But mortar is still a substance. If it's not a brick, what is it? If it's nothing, then you have a gap. If it's something, you have a constituent. You say it's a "mode," but a mode of what? If it's a mode of the concept, the concept must exist prior to the mode to bear it. Now you have a concept and a mode, and we're back to needing a tie to bind the mode to the concept. You've just renamed the relation "unsaturatedness" to hide the regress, not eliminate it. But let's grant, for the sake of argument, that your linguistic workaround holds. I want to press you on the ontology of the unity itself. My view is that the world is a world of states of affairs. A particular and a universal are united by non-mereological composition. The instantiation tie is internal. The state of affairs *is* the unity.

  **Elena:** And that works for true atomic sentences, perhaps. But this brings me to my objection. You ground the unity of the proposition in the existence of the state of affairs. A state of affairs, on your account, is a truthmaker. It exists only if the corresponding proposition is true. But consider a false proposition: "The cat is on the mat," when the cat is in the kitchen. I can entertain this thought. It has unity; it has sense; it is a single, coherent object of judgment. It isn't just a list: <cat, mat, on>. It asserts a connection. But on your view, there is no state of affairs here. The cat and the mat are not united by instantiation. So, what unifies the false proposition? If the state of affairs is the only thing capable of providing non-mereological composition, and no state of affairs exists for false thoughts, then false thoughts should be impossible. They should be mere heaps of concepts. But they aren't. So, your "non-mereological composition" cannot be the source of propositional unity.

  **Marcus:** You're assuming that the state of affairs must exist *actually* to provide the structure for the proposition. But I distinguish the proposition from the fact. The proposition is a linguistic or mental entity that *pictures* a possible state of affairs. The unity of the false proposition comes from the combinatorial possibilities of the constituents themselves. Universals are by their nature promotable into states of affairs. The universal *on-ness* has a certain valence; it demands particulars of a certain sort. The unity of the false proposition is grounded in the *possibility* of the state of affairs, not its actual existence. The structure is real because the constituents have real combinatorial properties, even if they aren't currently combined in the world.

  **Elena:** But "possibility" is parasitic on "actuality" in your system. You're a realist about universals, yes, but the specific combination—the *on-ness* binding *this cat* to *this mat*—is contingent. If that binding doesn't exist, in what does the unity of the thought consist? If you say the unity is merely linguistic, you've surrendered the metaphysical ground. You've admitted that the metaphysics of states of affairs doesn't explain the unity of thought, only the truth of it. But Bradley's Regress is a problem about the unity of the *content*, regardless of truth. If your non-mereological composition only kicks in when the world cooperates, then you haven't explained how we think about the world when it doesn't. You've pushed the regress back to the realm of possibility: what unifies the *possible* state of affairs? Is that a non-existent object? If so, welcome to Meinong. If not, then the unity of the proposition is doing work your states of affairs aren't doing. So, where is the glue for the lie?
