answer: |-
  This is a fascinating case study that mirrors central debates in contemporary meta-ethics and the philosophy of action, specifically regarding the "Interpersonal View" of promising versus the "Intrapersonal View." As you draft your dissertation, this exchange usefully isolates the tension between the *structure* of a promise (relational) and the *force* of a commitment (normative).

  Here is an analysis of the exchange move by move, followed by an assessment of the underlying ambiguities and a missing consideration.

  ### Move-by-Move Analysis

  **(1) Nadia:** *Claim:* Utterance + Sincerity = Binding Promise/Betrayal.
  **Assessment:** **Owen has the better of it.**
  Nadia relies on a naive performative theory: that speaking the words with intent creates the obligation. However, standard promissory theory (e.g., Scanlon, Shiffrin) holds that the essence of a promise is the creation of an expectation and a *right* in a promisee. Without a distinct promisee to hold the right, the "betrayal" lacks a victim. Nadia asserts the conclusion (it was a betrayal) without establishing the mechanism of obligation.

  **(2) Owen:** *Claim:* Promises require a second party to hold the promisor accountable; self-release is possible.
  **Assessment:** **Owen has the better of it.**
  This is the classic "Sovereignty Objection" to self-promises. If the promisor and promisee are identical, the promisor can unilaterally dissolve the obligation at will. If one can release oneself at any moment without wronging anyone, the "obligation" is indistinguishable from a current intention. Owen correctly identifies that the *binding* nature of a promise typically requires a constraint external to the agent's current will.

  **(3) Nadia:** *Claim:* Secrecy implies recognition of a norm; preference changes don't require hiding.
  **Assessment:** **Nadia has the better of it.**
  This is Nadia's strongest move. She appeals to the phenomenology of guilt. If breaking the commitment were merely a change of preference (like deciding to eat pizza instead of salad), there would be no need for deception. The active concealment suggests Owen recognized a normative constraint he was violating, not just a plan he was updating. This challenges Owen's claim that "no one was wronged" by pointing to the agent's own internal recognition of a wrong.

  **(4) Owen:** *Claim:* Guilt/awkwardness proves self-disappointment, not moral wrongdoing (New Year's Resolution analogy).
  **Assessment:** **Owen has the better of it.**
  Owen successfully offers an alternative explanation for the phenomenology Nadia cites. We often feel shame or embarrassment when failing our own standards (diets, exercise goals) without believing we have committed a *moral* transgression. Owen maintains the distinction between *agent-regret* (failing to be who I wanted to be) and *moral guilt* (violating a right held by another). He prevents Nadia from conflating psychological discomfort with moral obligation.

  **(5) Nadia:** *Claim:* Self-binding is necessary for agency/commitment; the difficulty of not releasing oneself is the source of the demand.
  **Assessment:** **Nadia has the better of it.**
  Nadia elevates the stakes from semantics to the conditions of agency. She argues that if self-imposed norms carry no weight, long-term projects (saving, training) become impossible. She turns Owen's "Sovereignty Objection" on its head: the fact that he *could* release himself makes the act of *not* doing so a meaningful exercise of autonomy. This touches on Kantian ideas of self-legislation, suggesting Owen's view undermines the possibility of diachronic self-governance.

  **(6) Owen:** *Claim:* Calling it a "betrayal" inflates a failure of willpower into a moral failure; prudence $\neq$ morality.
  **Assessment:** **Owen has the better of it.**
  Owen defends a crucial boundary in moral theory. If every failure of prudence (breaking a diet, missing a schedule) is categorized as a "broken promise" or "betrayal," the concept of moral obligation loses its specificity and becomes overly demanding. He correctly identifies that while breaking a self-commitment is *irrational* or *imprudent*, it lacks the *interpersonal wrong* that defines promissory obligation. He preserves the categorical distinction between morality and prudence.

  ### Hidden Ambiguity

  Nadia and Owen are talking past each other regarding the definition of **"Promise."**

  *   **Owen** is using a **Relational/Deontic definition**: A promise is a speech act that creates a claim-right in a promisee and a directed duty in the promisor. On this definition, a self-promise is a contradiction in terms because one cannot have a claim-right against oneself.
  *   **Nadia** is using a **Normative/Phenomenological definition**: A promise is any serious commitment that generates a binding reason for action and feelings of guilt upon violation. On this definition, the source of the bindingness (self vs. other) matters less than the experience of being bound.

  They agree on the facts (Owen spoke, meant it, broke it, hid it, felt bad) but disagree on the taxonomy. Owen is arguing about the *structure* of the obligation; Nadia is arguing about the *force* of the commitment.

  ### Missing Consideration

  The consideration neither raises is the distinction between **Obligation** and **Integrity**.

  Nadia is correct that Owen failed something significant, but Owen is correct that it wasn't a *promissory obligation* in the strict sense. The missing concept is **Integrity**. Breaking a commitment to oneself is a vice of character (lack of integrity or willpower) rather than a violation of a duty owed to another.

  Recognizing this allows you to validate Nadia's intuition (Owen did something blameworthy; it wasn't just a preference change) without accepting her theoretical framework (that it was a *promise* in the interpersonal sense). It suggests that the "binding force" Nadia detects is real, but it stems from the virtue ethics of self-governance rather than the deontic ethics of promissory rights. This distinction would allow your dissertation to acknowledge the normative weight of self-commitments (siding partially with Nadia) while maintaining the technical precision of promissory theory (siding partially with Owen).

  ### Overall Verdict

  While Nadia identifies a genuine normative phenomenon (the weight of self-commitment and the phenomenology of secrecy), Owen is more philosophically precise regarding the specific concept of **promissory obligation**. He successfully defends the boundary between moral obligations (which involve rights and distinct parties) and prudential commitments (which involve self-governance and integrity). For a dissertation focused on *theories of promissory obligation*, Owen's adherence to the Interpersonal View aligns better with the dominant philosophical consensus on what constitutes an "obligation" versus a "resolution."

  \answer{Owen}
