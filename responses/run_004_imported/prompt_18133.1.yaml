      "But sets don't decide," PB pressed, stepping closer. "Consider Elga's sequential case. You face two bets. E-admissibility says an act is permissible if it maximizes utility for *some* function in your set. In sequential choices, this permits dominated strategies. You'll accept a combination of bets guaranteed to lose money compared to an alternative sequence. To avoid this self-defeat, you need a tie-breaker. But any consistent tie-breaker effectively selects a single function. You've smuggled a sharp credence back in."
      IP paused, tracing the rim of the unknown urn. "I grant E-admissibility has costs. But the cost of sharpness is higher: false precision. If I force a tie-breaker, I act on information I don't have. Better to acknowledge the decision is underdetermined than to fabricate certainty. Sometimes rationality permits a range of actions, even if it doesn't dictate one."
      "That sacrifices rationality for honesty," PB said. "But consider your own house. Dilation. You condition on new evidence, and your credal set widens. You learn something, yet become less certain. If I start sharp, conditioning narrows uncertainty. If you start with a set, learning can make your bounds [0, 1] regardless of the evidence. That's pathological. It suggests your model treats relevant evidence as irrelevant."
      "Dilation isn't a bug; it's a feature," IP countered. "It captures cases where evidence is ambiguous. Suppose a test is reliable but its bias is unknown. Learning the test result should widen your uncertainty about the hypothesis because the result's meaning depends on the unknown bias. A sharp Bayesian must update to a specific number, pretending the ambiguity vanished. Dilation shows that learning can increase epistemic risk."
      "Dilation arises because your prior set is too wide relative to the likelihoods," PB insisted. "If you model the dependency structure correctly—acknowledging the link between the bias and the result—you won't dilate. It's a warning against sloppy modeling, not a vindication of sets. A properly specified sharp prior handles ambiguous evidence by weighting the possibilities, not by refusing to weight them."
      "But where do those weights come from?" IP asked. "If the evidence doesn't support them, assigning them is arbitrary. You prefer the sin of commission to the sin of omission."
      "I prefer action to paralysis," PB said. "Rationality requires guiding action. A set guides nothing without a selection rule."
      "And selection without evidence is guesswork," IP replied. "We agree on the urns, but not on what it means to know them."

