answer: |-
  You are not being inconsistent. Your gut is flagging a variable that your friend's spreadsheet failed to price in.

  The reason this sits differently than layoffs or product sunsetting is that those are **structural/economic decisions**, whereas the VP's move was a **moral/judicial decision** disguised as an economic one.

  Here is how to name what is wrong with this, in a way that should satisfy a rationalist framework.

  ### 1. The Mechanism is "Collective Punishment"
  In almost every serious ethical framework (and notably in the Geneva Conventions), collective punishment is prohibited. Why? Not because of "feelings," but because it severs the link between **agency and consequence**.

  *   **Layoffs:** Ideally, these are decoupled from moral guilt. "The company ran out of runway" is a state of nature, like a drought. It is tragic, but it is not a *punishment* for sin.
  *   **The VP's Move:** This was explicitly punitive. It assigned guilt by association.

  **The Rationalist Objection:**
  When you decouple consequence from individual action, you break the feedback loop required for learning and optimization.
  *   **For the guilty:** They get to hide behind the group. They didn't pay the full price of their error; the group subsidized their mistake.
  *   **For the innocent:** They learn that individual excellence does not protect them from group failure. This incentivizes **exit** (leaving the company) rather than **voice** (fixing the problem).

  The spreadsheet counted the cost of the bonus. It did not count the cost of the highest-agency individuals updating their belief that "hard work is rewarded" to "hard work is hostage-taking."

  ### 2. The Math is Myopic (Trust as Capital)
  Your friend's spreadsheet likely treats "team cohesion" or "trust" as an infinite resource or a soft variable. In game theory, trust is **low-friction transaction capital**.

  *   **High Trust Team:** I push code, you review it. We assume good faith. Transaction cost: 5 minutes.
  *   **Low Trust Team (Post-VP):** I push code, you review it. But now, if I miss something, *my* bonus is cut because *you* were sloppy last week. I need to audit your work defensively. I need to document my objections. I need to cover my ass. Transaction cost: 30 minutes + political overhead.

  The VP traded a one-time cash saving (the withheld bonuses) for a permanent increase in the team's operational friction. The spreadsheet shows the Q3 savings; it does not show the Q3-through-Q10 drag on velocity caused by the erosion of psychological safety.

  This is **Moloch** in action: sacrificing a higher-order value (cooperation/trust) for a lower-order value (short-term stability/cash).

  ### 3. Incentive Corruption (Goodhart's Law)
  The VP wanted "fewer outages." They got "fewer reported outages" or "fewer outages via risk aversion."

  By making the team responsible for policing each other through financial coercion, the VP shifted the incentive from **"Build reliable software"** to **"Don't get caught, and don't let your neighbor get caught."**

  This creates a **Prisoner's Dilemma** within the team:
  *   **Cooperate:** We help each other code better.
  *   **Defect:** I throw you under the bus to save my bonus.

  When the "Defect" strategy becomes financially rational for the innocent (e.g., preemptively snitching to prove loyalty), you have created a negative-sum game. The spreadsheet accounts for the bonus money saved; it does not account for the innovation that dies when engineers are afraid to take calculated risks or admit uncertainty.

  ### 4. Retroactive Rule Changing
  You mentioned the VP announced this "until this stops." If the bonus was part of the compensation package agreed upon at the start of the quarter, changing the terms *after* the labor was performed is a contract violation.

  Even if it was technically legal (at-will employment), it violates the **Psychological Contract**.
  *   **Layoffs:** "The ship is sinking, we need to drop weight." (Shared fate)
  *   **Bonus Cut:** "You did your job, but someone else didn't, so we are keeping your money." (Theft of earned value)

  From a rationalist perspective, this signals that management is an **unreliable predictor of future rewards**. If the rules of the game can change mid-round based on hidden information (who skipped review), the rational move for the employee is to discount the value of *all* future promises from management. This increases the discount rate on long-term projects, leading to short-termism.

  ### 5. The "Legend" Status is a Red Flag
  The fact that the VP is a "legend" for this is the most dangerous part. It signals that the organization rewards **authoritarian efficiency** over **systemic health**.

  This attracts a specific type of manager: one who values compliance over competence. Over time, this selects *out* the engineers who value autonomy and ethics, and selects *in* managers who are comfortable wielding coercive power. This is a slow-acting cultural poison that rarely shows up on a spreadsheet until the key talent has already left.

  ### Summary: How to Name It
  You can tell your friend that their spreadsheet suffers from **Externalities Error**.

  The VP internalized the savings (company keeps bonus money) and externalized the costs (resentment, trust erosion, defensive coding, turnover risk). The "gut check" you are feeling is your heuristic for **Long-Term Iterated Game Stability**.

  *   **Layoffs** are a tragedy of resources.
  *   **Collective Punishment** is a corruption of justice.

  You aren't inconsistent. You are correctly identifying that the VP solved a **technical problem** (outages) by creating a **social problem** (hostage dynamics) that is far more expensive to fix later. The math isn't wrong; the *variables* are incomplete.

  **The Name:** It is **Collective Punishment**, and it is a **Negative-Sum Incentive Structure** that trades **Social Capital** for **Short-Term Compliance**.
