answer: |-
  G. E. M. Anscombe's protest against Harry Truman's honorary degree in 1956 rests on a specific application of the Doctrine of Double Effect (DDE). The DDE permits actions that have bad side effects (such as civilian deaths) only if those effects are neither intended as ends nor chosen as means, but are merely foreseen consequences of a legitimate act. Anscombe argued that the atomic bombings did not fit this exemption because the death of civilians was not an accidental byproduct of hitting a military target; rather, the destruction of the cities and their populations was the very mechanism by which the United States sought to compel Japan's surrender.

  Critics often suggest that Anscombe's moral verdict depends on resolving historical disputes regarding Truman's ultimate motivation: Was it to shorten the war, to save American lives by avoiding an invasion, or to intimidate the Soviet Union? However, this objection conflates the *ultimate end* of an action with the *means* employed to achieve it. In moral philosophy, particularly within the Anscombian tradition, intention is defined not merely by the agent's internal psychological state, but by the description under which the action is chosen. We can determine what was intended by analyzing the structure of the plan itself.

  To settle this without recourse to disputed historical psychology, we can apply the **counterfactual test of intention**. This test asks: *If the bad effect (civilian deaths) had miraculously not occurred, would the agent's plan still have succeeded?* If the answer is "no," then the bad effect was a necessary condition of the plan's success, meaning it was intended as a means. If the answer is "yes," it was merely a foreseen side effect.

  Applying this test to the three candidate purposes for the bombing demonstrates that civilian deaths functioned as an intended means in every case.

  **1. Purpose: Shortening the War (Forcing Surrender)**
  The strategic logic of "shock and awe" relies on the premise that the devastation will break the enemy's will to fight.
  *   **The Counterfactual:** Suppose the atomic bombs detonated over Hiroshima and Nagasaki with their full thermal and blast radius, destroying buildings and infrastructure, but by some miracle, *no human beings died*.
  *   **The Analysis:** Would Japan have surrendered immediately under these conditions? It is highly improbable. The coercive power of the atomic bomb lay not merely in its ability to flatten wood and brick, but in its unprecedented capacity for mass slaughter. A weapon that destroys property but spares life is a conventional explosive on a larger scale, not an existential threat to the population. The Japanese leadership surrendered largely because the bomb demonstrated the ability to annihilate the Japanese people entirely. Without the carnage, the psychological terror required to bypass the military hardliners and force Imperial intervention would have been absent.
  *   **The Verdict:** Since the plan to force surrender relies on the horror of mass death, the deaths are a **means**, not a side effect.

  **2. Purpose: Averting Invasion Casualties**
  This purpose is causally derivative of the first: the invasion is averted *only if* the war is shortened via surrender.
  *   **The Counterfactual:** Again, assume the bombs kill no one.
  *   **The Analysis:** If the bombs kill no one, and (as established above) the shock is insufficient to force immediate surrender, the war continues. If the war continues, the planned invasion of the Japanese home islands (Operation Downfall) proceeds or is delayed, entailing the very casualties the bomb was meant to prevent. The saving of American soldiers' lives is logically contingent upon the Japanese surrender, which is itself contingent upon the lethal impact of the bombs.
  *   **The Verdict:** Because the civilian deaths are the instrument that secures the surrender which saves the soldiers, the deaths are an **intended means** to saving American lives. One cannot claim to use the bomb to save lives while simultaneously claiming the killing of civilians was irrelevant to the bomb's function.

  **3. Purpose: Signaling Power to the Soviet Union**
  Some historians argue the bomb was dropped to demonstrate American hegemony to Stalin.
  *   **The Counterfactual:** The bombs destroy the cities but kill no one.
  *   **The Analysis:** What is the signal sent by a non-lethal super-weapon? The geopolitical leverage sought by the Truman administration relied on the demonstration of a capability to inflict unacceptable damage on an adversary's population and industrial base. A weapon that clears cities of structures but leaves the population alive signals a powerful conventional capability, but it fails to signal the capacity for *annihilation*. The diplomatic "signal" was specifically about the possession of a weapon that could wipe out millions instantly. If the Soviets observed that the weapon was non-lethal to humans, the deterrent value and the intimidation factor would be drastically diminished.
  *   **The Verdict:** To signal the capacity for mass destruction, mass destruction (including death) must be demonstrated. Therefore, the civilian deaths are a **means** of diplomatic signaling.

  **Conclusion**
  The historical dispute over Truman's *ultimate* end (peace, soldiers' lives, or diplomatic leverage) is immaterial to Anscombe's charge because the *proximate* means remains constant across all three scenarios. In every plausible strategic calculation, the efficacy of the atomic bomb depended on its lethality. The counterfactual test reveals that a non-lethal atomic bombing would have failed to achieve any of the three candidate goals.

  Therefore, under the logic of the Doctrine of Double Effect, the civilian deaths cannot be categorized as merely foreseen side effects. They were instrumental to the success of the operation. Since Anscombe's definition of murder hinges on the intentional killing of the innocent as a means to an end, her verdict holds regardless of which historical account of Truman's motivation one accepts. The structure of the action itself incorporates the deaths of civilians as a necessary condition of its success, rendering the dispute over the ultimate aim irrelevant to the moral classification of the act.
