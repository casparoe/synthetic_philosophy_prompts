answer: |-
  Your intuition is correct: your friend's reasoning contains a fundamental logical flaw. While it is understandable why you might want her to be right (it would alleviate the discomfort of feeling manipulative), she is conflating two very different kinds of reasons.

  Here is the breakdown of the mistake in her logic, why your discomfort is justified, and the philosophical distinction that clarifies the situation.

  ### 1. Pragmatic Reasons vs. Epistemic Reasons
  The core error your friend is making is confusing **pragmatic reasons** for belief with **epistemic reasons** for belief.

  *   **Pragmatic Reasons:** These are reasons based on the *consequences* of holding a belief. (e.g., "If I believe Maya is great, I will get a spot on the leadership retreat.")
  *   **Epistemic Reasons:** These are reasons based on *evidence* and *truth*. (e.g., "Maya organized three successful events and mediates conflict well, therefore she is a great leader.")

  Your friend is arguing that because you have a strong *pragmatic* reason to want the belief (the retreat spot), you therefore have a strong *epistemic* reason to think the belief is true (that Maya is actually admirable).

  This is a category error. The fact that it is beneficial for you to believe something tells us nothing about whether that thing is actually true.

  ### 2. The Fallacy of Appeal to Consequences
  In logic, this is closely related to the **Appeal to Consequences** fallacy (*argumentum ad consequentiam*). This fallacy occurs when someone argues that a proposition is true because the consequences of believing it are desirable (or false because the consequences are undesirable).

  To see why this is flawed, consider a different scenario:
  > Imagine you are terrified of flying. A friend tells you, "You have a very strong reason to believe this plane is safe: if you believe it's safe, you won't panic, and you'll have a much more pleasant trip."

  Does your friend's logic make the plane safer? No. The benefit of the belief (a pleasant trip) does not constitute evidence for the content of the belief (the plane's safety). Similarly, the benefit of admiring Maya (the retreat spot) does not constitute evidence of Maya's leadership skills.

  ### 3. Motivated Reasoning and Self-Deception
  What you are describing—mentally rehearsing reasons to feel admiration so that you can feel it more authentically—is a classic example of **motivated reasoning**. You are actively trying to align your internal state with an external incentive.

  Your friend is trying to reframe this self-deception as justification. She is essentially saying, "Because the motivation is strong enough, the resulting belief counts as genuine."

  However, the *source* of your admiration matters.
  *   **Genuine Admiration:** Arises from observing competence, character, and results.
  *   **Induced Admiration:** Arises from the desire for a reward.

  If you succeed in convincing yourself to admire her, that admiration is psychologically real to you, but it is not *justified* by the evidence of her leadership. It is justified by the evidence of your desire for the retreat. If the retreat spot were taken away tomorrow, would your "evidence" for her leadership still hold the same weight? If the answer is no, then your friend's claim that the admiration is "genuinely justified" is false.

  ### 4. Why Your Discomfort Matters
  You mentioned that you "like to think I'm not the kind of person who lets self-interest distort how I see other people." Your discomfort is a signal of intellectual integrity.

  Your friend's argument attempts to bypass integrity by claiming that self-interest *is* a form of truth-tracking. It isn't. Acknowledging the distortion doesn't make you hypocritical; it makes you self-aware. Trying to cultivate genuine feelings to be a better actor is a complex human response, but labeling that process as "objective justification" is where the logic breaks.

  ### Summary
  Your friend is mistaken.
  1.  **Incentives are not evidence.** Having a reason to *want* something to be true is not a reason to *think* it is true.
  2.  **Benefits don't equal truth.** The value of the reward (the retreat) does not transfer to the validity of the claim (Maya's leadership).
  3.  **Your intuition is sound.** Recognizing that your self-interest might be distorting your perception is a sign of critical thinking, not overthinking.

  You can acknowledge that you have a strong incentive to support Maya without lying to yourself that the incentive proves she is worthy of that support. Keeping that distinction clear is the best way to maintain the integrity you value.
