      *   **Task:** Write an essay committing to a position (a, b, or c) and address the engineering concern about KL-divergence as a default update rule.
      *   **Tone:** Philosophical but rigorous, acknowledging the engineering context, decisive (no "on the one hand, on the other hand" waffling).

