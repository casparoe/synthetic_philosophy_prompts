  ### Overall Comments

  You have a very strong grasp of the broad strokes of Anscombe's position. Your reconstruction of why the consequentialist defense fails (Question Part 1) is excellent, and you correctly identify that she is not a pacifist. Your explanation of the Doctrine of Double Effect in the middle of the paragraph is technically accurate regarding the distinction between means and side effects.

  However, the final sentence undermines your explanation of Double Effect. You write that for Anscombe, any commander who *knows* civilians will die is committing murder. This is incorrect. Anscombe's whole point is that *intending* their death makes it murder; *foreseeing* their death as an unavoidable side effect of a legitimate military target does not (assuming proportionality). By conflating knowledge with intention at the end, you accidentally collapse the distinction you just spent three sentences explaining. In an ethics exam, precision on the intention/foresight distinction is the difference between understanding Anscombe and misunderstanding her. Watch out for over-generalizing in your concluding sentences.
