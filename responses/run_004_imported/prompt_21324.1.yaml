      Anscombe's "Mr. Truman's Degree" is very short. It relies on the audience accepting the principle. She doesn't really *argue for* DDE there; she assumes the prohibition on killing the innocent. She argues that the bombing *was* killing the innocent. The student says she "develops [DDE] in the essay." This is technically inaccurate. She *applies* the distinction, but the *development* of the doctrine is in her broader work (like "Intention"). I should note this as a minor accuracy point, but the Foreseen/Intended conflation is the big one.

