answer: |-
  The clink of forks against ceramic was the only ceasefire in the argument. Tom wiped his mouth with a napkin, eyes tired but sharp.

  "Look, Rosa, it's not about being closed-minded. It's Hume's maxim. When someone tells you a dead man walked, you weigh two experiences: your experience that men die, versus your experience that witnesses sometimes lie. The falsehood of the testimony has to be more miraculous than the event itself."

  "And if the testimony isn't just a witness?" Rosa leaned forward, wine glass untouched. "If it's MRI scans? Biopsies? Stage-four osteosarcoma gone in six weeks. That's not a 'he said, she said.' That's data."

  "Human error is still more common than cellular mutation reversing itself," Tom said. "That's Part One. But even if you clear that bar, there's Part Two. People love the marvelous. It gratifies vanity. And even if you trust these specific witnesses, what about the miracles of Asclepius? Or the Hindu saints? They cancel each other out. Each religion uses miracles to prove its own doctrine, which destroys the evidential force of all of them."

  "That's the genetic fallacy, Tom. Where it comes from doesn't change what happened." Rosa set her glass down. "But let's stick to Hume. You're quoting the summary, not the text. Section Ten, Part One. The footnote."

  Tom paused, fork hovering. "The Abbé Paris."

  "Exactly. The Jansenist miracles. Hume admits the testimony there was as solid as testimony gets. Contemporary witnesses. Hostile opponents investigated and couldn't find fraud. He says the evidence was 'as strong as any for ordinary historical facts.' And yet he rejects them. Purely because they were miracles."

  "So?"

  "So, is he being consistent?" Rosa pressed. "If he admits the testimony is as good as the testimony for Caesar crossing the Rubicon, but accepts the Rubicon and rejects the miracles, he's not weighing probabilities anymore. He's defining 'miracle' in a way that guarantees no evidence could ever outweigh it. He's making empiricism dogmatic. He's saying uniform experience against miracles is inviolable, but if a miracle happens, experience isn't uniform. It's circular."

  Tom set his fork down. He didn't look away. "It's not circular. It's foundational."

  "Explain."

  "Hume isn't saying the testimony for Paris was weak. He's saying the evidence for the law of nature isn't testimony at all. It's direct, uniform experience. Every time you've ever seen a bone heal, every time you've ever seen a tumor grow, that's the weight on the scale. Testimony is always secondary. If you allow testimony to overturn uniform experience, you don't just get miracles; you destroy the basis of all inference. You can't navigate the world anymore."

  "So you bite the bullet," Rosa said softly. "You admit that even if it happened, even if the evidence was perfect, you'd have to call it a lie because it breaks the rules of the game."

  "I'm saying that if the evidence suggests the laws of nature were violated, the most rational conclusion is always that we missed something about the context, not that nature broke. Because 'nature breaking' isn't an explanation. It's the end of explanation."

  "But what if the explanation *is* the break?" Rosa asked. "What if the point of the miracle isn't to explain the cancer, but to signal the agent behind it? You're treating the universe like a closed system, Tom. Hume treats it like a closed system. But if there's an Author, He's allowed to edit the draft."

  "And if there isn't?" Tom countered. "Then I'm the one protecting the only tool we have to find truth. If I accept the miracle at Lourdes, I have to accept the miracle at the tomb of Paris. And if I accept those, I have to accept every claim made by every zealot in history. I'd rather trust the uniformity of nature than the uniformity of human credulity."

  Rosa sat back. The silence stretched, heavier than before.

  "You know," she said, picking up her fork again, "Hume never went to Lourdes."

  "No," Tom said, lifting his wine. "But he read the reports. And he still put the fork down."

  ***

  **Post-Script:**
  I think Hume (and Tom) wins on epistemological consistency—you can't build a rational system that allows exceptions to its own axioms without collapsing—but Rosa wins on the existential stakes. Hume's definition of "uniform experience" conveniently excludes the very data that would disprove it, which is a philosophical shield, not necessarily a description of reality.
