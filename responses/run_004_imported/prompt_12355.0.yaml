answer: |-
  The short answer is: **It is absolutely the second option.**

  Augustine is saying these are still **genuine sins**, and a truly virtuous person should let the bad temporal consequence happen (the money lost, the man caught) rather than damage their own soul by lying.

  If your character believes otherwise, he would be contradicting Augustine. If he wants to be accurate to the text he's quoting, he has to believe that telling the truth is more important than protecting his father from the custody loss.

  Here is the breakdown of Augustine's logic so you can write the scene with confidence.

  ### 1. The Definition of a Lie
  For Augustine, a lie isn't defined by its *outcome* (did it hurt someone?), but by its *intent* (did you intend to deceive?). Because God is Truth, to intentionally speak falsehood is to turn away from God. Therefore, **every lie is a sin.**

  ### 2. The Hierarchy is About Gravity, Not Permission
  The list of 8 kinds is a hierarchy of *severity*, not a menu of *allowable* lies.
  *   **Lie #1 (Religious Doctrine):** Mortal sin. Destroys salvation.
  *   **Lie #8 (Protecting from defilement):** Venial sin. Damages the soul, but less severely.

  Think of it like this: Augustine views lying like a lawyer views crimes. Murder is worse than speeding, but a good citizen shouldn't do *either*. Just because Lie #6 is "less bad" than Lie #1 doesn't mean it's "good." It just means it's the least toxic poison.

  ### 3. The Smoking Gun: "Taking the Consequences"
  The key phrase in the text you provided is this:

  > *"...that by **taking the consequences, which are honorably and bravely borne**, these kinds also should be eschewed..."*

  This is the crux of your character's argument. Augustine is arguing that if you tell the truth, and a bad thing happens because of it (e.g., your dad loses custody, or a fugitive is caught), that suffering is a **consequence to be borne bravely.**

  To Augustine, the spiritual health of the liar is more important than the physical or financial safety of the person being protected. He would argue:
  *   If you lie to save your dad, **you** sin. Your soul is damaged.
  *   If you tell the truth and your dad loses custody, **your dad** suffers. His situation is damaged.
  *   It is better for your dad to suffer a temporal loss than for you to commit a spiritual sin.

  ### 4. How This Fits Your Character
  This is actually fantastic for a "lapsed-Catholic" character. Cultural Catholicism often leaves people with the "rules" long after the "faith" has faded.

  *   **The Irony:** He is a defense lawyer. His job is often to obscure the truth or frame it in the most favorable light. But here, he is using a theological absolute to bind his own hands.
  *   **The Conflict:** His sister is arguing from a place of **loyalty and consequence** (Dad will suffer if we tell the truth). He is arguing from a place of **integrity and order** (I become a liar if I lie, regardless of why).
  *   **The "Lapsed" Aspect:** He might not believe in Heaven or Hell anymore, but he likely still believes in the *sanctity of the oath* or the *integrity of the word.* He treats the Law like Augustine treats God: an absolute structure that collapses if you make exceptions for "good reasons."

  ### 5. A Nuance for the Dialogue
  If you want to be hyper-accurate to Augustine, there is one loophole your character might acknowledge but reject.

  Augustine elsewhere (in *Against Lying*) suggests that while you cannot *lie*, you don't necessarily have to volunteer the whole truth. You can remain silent. You can say "I know, but I will not tell you."

  However, in the specific passage you quoted (Section 25), he is tightening the screw. He is saying that even the "helpful" lies (Types 6 & 7) must be **eschewed** (avoided).

  **So, for your scene:**
  Your character shouldn't say, "Augustine says this is a small sin."
  He should say, "Augustine says this is still a sin. He says we have to bear the consequences of the truth bravely, rather than save ourselves through a lie."

  That makes him sound rigid, principled, and tragically bound by a moral code he claims to have left behind. It creates perfect friction with a sister who just wants to win a custody battle.

  ### Summary for your notes:
  *   **Are lies 6 & 7 sins?** Yes.
  *   **Can a virtuous person tell them?** No.
  *   **What should they do instead?** Tell the truth and endure the negative outcome "honorably and bravely."
  *   **Why?** Because the liar damages their own soul, which is worse than the neighbor losing money or safety.

  Your guy is essentially telling his sister: *"My soul is more important than Dad's custody case."* That is a very Augustinian, very Catholic, and very dramatic thing to say.
