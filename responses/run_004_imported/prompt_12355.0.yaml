      *   In Section 25, he acknowledges that types 6 and 7 seem pragmatic (protecting money, protecting life). However, his conclusion is that even these must be avoided.
      *   *Why?* Because truth-telling is a duty to God. The consequence of telling the truth (even if it leads to someone losing money or even dying) is borne by the person suffering, but the *sin* of lying is borne by the liar's soul.
