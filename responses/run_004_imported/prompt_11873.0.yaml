      *   *Check:* Did I explain the money pump for Independence correctly? It's harder than for intransitivity. It usually involves trading on the "common consequence" effect.
      *   *Correction:* The standard money pump for Independence relies on the agent treating the common consequence as irrelevant *ex post* but relevant *ex ante*. If I choose the safe option ex ante, but would switch to the risky option if the "common" event didn't occur, I can be pumped.
