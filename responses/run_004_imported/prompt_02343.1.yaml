answer: |-
  You have hit on one of the central fault lines in contemporary social ontology. Your intuition is spot-on: Searle and Haslanger are often lumped together under the banner of "social construction," but the *mechanisms* they describe feel like they belong to different universes. One sounds like a game of make-believe we all agreed to play (Searle), and the other sounds like a cage we were born into (Haslanger).

  Here is the breakdown of why they differ, who likely tried to unify them (your nagging memory), and my take on which framework does the heavier lifting.

  ### 1. Two Different Projects, One Label
  The first thing to note is that Searle and Haslanger are arguably answering different questions, even if they both use the phrase "social construction."

  *   **Searle is doing descriptive metaphysics.** He wants to know: *How is it possible for a physical object (paper) to have a non-physical property (being money)?* His answer is Collective Intentionality + Constitutive Rules. His model is structural and logical. He is interested in the *status function*.
  *   **Haslanger is doing critical amelioration.** She wants to know: *What concepts of race and gender should we use to fight injustice?* Her definitions are not necessarily meant to capture the "folk" meaning or the metaphysical essence, but rather to carve out the political reality of oppression. She is interested in the *hierarchical function*.

  So, to your first question: **Is it one phenomenon?**
  Metaphysically, yes: both involve mind-dependent facts that rely on social practices. But *causally and phenomenologically*, they are distinct. Searle describes the **logic of institutions**; Haslanger describes the **physics of power**.

  ### 2. Can Searle Explain Oppression?
  You asked if Searle's apparatus can be stretched to cover race and gender. The short answer is: **Yes, but it requires a sinister reading of "Collective Intentionality."**

  Searle argues that status functions confer "deontic powers"—rights, duties, obligations, and entitlements. We usually think of these as positive (the right to spend money). But deontic powers also include **burdens**. A slave has a status function imposed upon them ("property") that strips them of deontic powers.

  However, the sticking point is **Collective Intentionality**. Searle's language ("we accept," "we recognize") implies a degree of cooperation. As you noted, the subordinated do not "accept" their status in the same way a group accepts a referee's call in a soccer match.
  *   **The Searlean Defense:** Searle would argue that the "collective" doesn't require every individual to consent. It only requires a critical mass of people (usually the powerful) to uphold the status function, and the rest to *acquiesce* (even if out of fear). The institution exists as long as the collective intentionality is maintained by the group *as a whole*.
  *   **The Critique:** This masks the violence required to maintain that "acceptance." Searle's model makes oppression look like a stable institutional fact (like a bank), whereas Haslanger shows it is a dynamic, contested struggle. Searle explains how the cage *works*; Haslanger explains how the cage was *built* and why it stays locked.

  ### 3. The Unified Theory (Your Nagging Memory)
  You are almost certainly thinking of **Ásta (Guðmundsdóttir)** and her book *Categories We Live By* (2018).

  Ásta explicitly tries to bridge Searle and Haslanger. She develops a theory called **Conferralism**.
  *   She agrees with Searle that social properties are "conferred" by social agents.
  *   But she distinguishes between **Communal Conferral** (like money, where a whole society agrees) and **Personal Conferral** (like gender in a specific interaction, where an individual reads your body and treats you accordingly).
  *   Crucially, she incorporates Haslanger's insight that these conferrals happen within **structures of power**. The "conferral" of gender isn't a polite agreement; it's often an imposition based on perceived bodily features within a hierarchy.

  Another possibility is **Brian Epstein** (*The Ant Trap*), who argues that Searle is too focused on "collective acceptance" and ignores the causal history and material grounding of social facts. But Ásta is the one who directly tackles the gender/race vs. money distinction.

  ### 4. Which is More "Fundamental"?
  If I have to pick which framework does the more fundamental work in explaining what social construction *really* is, I am going to side with **Haslanger (or a power-infused ontology like Ásta's)** over Searle.

  Here is why:

  **Searle's framework assumes a "flat" social world.**
  Searle treats the conferral of status on a piece of paper (money) and the conferral of status on a human being (citizen, wife, slave) as metaphysically identical processes. But this ignores the **asymmetry of agency**.
  *   When we construct money, we are mostly constructing tools.
  *   When we construct race/gender, we are constructing *people*.
  Searle's model works beautifully for "brute" institutional facts where the participants are roughly equal agents (players in a game, traders in a market). It fails to capture the *constitutive* nature of oppression, where the social construction actually shapes the subject's ability to *participate* in the collective intentionality in the first place.

  **Power is more fundamental than Consent.**
  Haslanger's framework reveals that "collective acceptance" is often a retrospective fiction. In many cases of social construction (especially race and gender historically), the status was imposed via force, and the "collective recognition" came later as a justification.
  *   Searle says: "We accept this as money, therefore it is money."
  *   Haslanger implies: "We treat this body as subordinate, therefore it is raced/gendered, and we will force you to accept it."

  If social ontology is supposed to explain the social world *as it is*, not just the logical conditions for its possibility, then **power** is a more fundamental constructor than **agreement**. Searle explains the *syntax* of social reality (how status functions attach to objects), but Haslanger explains the *semantics* (what those statuses mean for human life and freedom).

  **The Verdict:**
  Searle provides the **skeleton**. He shows us the bones of how institutional facts hang together. Without him, we don't understand how a physical fact becomes a social fact.
  But Haslanger provides the **muscle and the nervous system**. She shows us how those facts move, hurt, constrain, and persist through resistance.

  If you want to understand how a casino works, read Searle. If you want to understand how the world works, read Haslanger. Searle's framework is cleaner, but Haslanger's is **ontologically deeper** because it accounts for the friction, resistance, and coercion that actually sustain most social kinds. A theory of social construction that cannot explain coercion without smuggling it in as "acceptance" is, in my view, incomplete.

  So, while Searle is the grandfather of the field, Haslanger (and successors like Ásta) are doing the work that makes the ontology fit the reality.
