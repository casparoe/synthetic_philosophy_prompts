      *   **Masking:** The disposition remains present, but something else prevents the manifestation *during* the stimulus. (Classic example: A fragile vase packed in styrofoam. If struck, it doesn't break, but it's still fragile).
      *   **Lewis's Reformed Analysis (RCA):** $x$ is disposed to $M$ when $S$ iff $x$ has an intrinsic property $B$ (causal basis) such that if $x$ were $S$ and $B$ persisted for a sufficient time, $x$ would $M$.

