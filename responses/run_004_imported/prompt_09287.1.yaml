  2.  **Analyze the Source Material (Bentham's "Offences Against One's Self"):**
      *   *Core Argument:* Bentham argues that "irregularities of the venereal appetite" (specifically male homosexuality/sodomy, though he speaks generally) cause no pain to others if consensual and private. Therefore, under the principle of utility, they should not be punished.
      *   *Harm Principle:* No victim = no crime. Punishment creates pain (execution, imprisonment, fear, blackmail) without preventing any greater pain.
      *   *Counter-arguments addressed:*
          *   "Unnatural": Bentham dismisses this as meaningless in utility terms.
          *   "Population/Depopulation": Bentham argues this is inconsistent. If depopulation is the harm, why not punish celibacy/monasticism? Also, the actual impact on population is negligible.
          *   "Disgust": The disgust felt by others is a prejudice, not a genuine harm warranting legal intervention (though he acknowledges the pain of disgust, he weighs it against the severe pain of punishment).
      *   *Real Cause of Laws:* Why do these laws exist if not utility?
          *   **Asceticism:** The principle that pain is good and pleasure is bad (especially sexual pleasure).
          *   **Antipathy:** Simple dislike or disgust disguised as moral reasoning.
          *   **Religious Influence:** Often tied to religious dogma promoting asceticism.
      *   *Publication History:* Bentham indeed kept this unpublished during his lifetime due to fear of backlash damaging his broader reform projects. *IPML* (Introduction to the Principles of Morals and Legislation) hints at it but doesn't go into the specific detail of the "Offences" essay.

