answer: |-
  Here are 10 discussion questions designed to move the conversation beyond the basics of the Knowledge Account of Assertion (KAA). They are structured to be polite but probing, suitable for a PhD moderator.

  Per your request, I have included the **Likely Move** (the standard defensive maneuver the speaker will probably make) and a **Follow-Up** (designed to complicate that defense) for each.

  ### 1. The Lottery Paradox (Required)
  **Question:** "We often feel it's improper to assert a lottery proposition (e.g., 'Your ticket lost') before the draw, even when the odds are astronomically high. However, it seems perfectly rational to *act* on that same probability (e.g., burning the ticket or selling it). If the norm of assertion is knowledge, how do you explain this normative gap between asserting and acting on the exact same probabilistic evidence?"

  *   **Likely Move:** The speaker will distinguish between *epistemic* norms (governing assertion) and *practical* norms (governing action). They will argue assertion requires a higher epistemic standard than practical rationality.
  *   **Follow-Up:** "If the underlying probability and evidence are identical in both cases, doesn't positing two different normative standards risk being ad hoc? What independent motivation do we have for thinking assertion tracks a stricter epistemic state than high-stakes action, other than saving the theory?"

  ### 2. Selfless Assertion (Required)
  **Question:** "Consider Jennifer Lackey's case of the devout teacher who has overwhelming evidence for evolution but, due to a crisis of faith, no longer believes it. She asserts to her class, 'Evolution is true.' Intuitively, her assertion is proper and responsible. Since she lacks belief, she arguably lacks knowledge. Does the KAA have to classify this responsible assertion as a norm violation?"

  *   **Likely Move:** The speaker will argue that she *does* know (denying belief is necessary for knowledge) or that the assertion is merely *excusable*, not proper.
  *   **Follow-Up:** "If you argue she knows despite lacking belief, are you committed to a notion of knowledge that is disconnected from the psychological state of the speaker? And if you argue it's merely excusable, does that not sever the link between normative propriety and responsible speech?"

  ### 3. The "Excuse" Maneuver / Unfalsifiability (Required)
  **Question:** "A common criticism of the KAA is that it risks unfalsifiability. Whenever there is a counterexample where someone asserts without knowledge, the defense is often that the assertion was 'improper but excusable.' How do we distinguish a genuine counterexample from an excusable violation in a way that doesn't rely on the theory itself?"

  *   **Likely Move:** They will offer a paradigm case of a "bad" assertion (e.g., a pure guess that turns out true) and claim our intuition of impropriety there validates the distinction.
  *   **Follow-Up:** "But isn't our intuition that the guess was 'improper' already theory-laden? If the only data points we accept are those that align with the knowledge norm, aren't we simply defining propriety as knowledge rather than discovering a connection between them?"

  ### 4. Professional/Expert Testimony
  **Question:** "Think about medical or legal experts. A doctor often asserts a diagnosis based on statistical guidelines and test results that fall short of philosophical 'knowledge' (given the possibility of error), yet we treat their assertion as the gold standard of propriety. Is the KAA too demanding for institutional assertion, or must we say doctors routinely violate the norm of assertion?"

  *   **Likely Move:** They will claim the doctor *does* know (contextualism about 'knows') or that the doctor is asserting on behalf of the institution, not themselves.
  *   **Follow-Up:** "If you rely on contextualism to lower the threshold for 'knowledge' in medical contexts, doesn't the norm become 'Assert P only if you know P *relative to context*'? And if the context determines the knowledge threshold, isn't the real norm just 'Assert P if you have sufficient evidence for the context'?"

  ### 5. Probabilistic and Modal Assertions
  **Question:** "How does the KAA handle probabilistic assertions like 'It might rain' or 'There's a 90% chance of P'? Do I need to *know* that it might rain? If so, what is the content of that knowledge? If not, does this suggest there are different norms for different types of propositional attitudes?"

  *   **Likely Move:** They will argue you know the epistemic modal claim (you know that your evidence doesn't rule out rain).
  *   **Follow-Up:** "But that seems to shift the content from the weather to my evidence. When I say 'It might rain,' I'm talking about the world, not my epistemic state. Does the KAA force us to treat all modal assertions as covert assertions about our own evidence?"

  ### 6. Retraction and Truth
  **Question:** "Suppose I assert P, and P turns out to be true, but I later discover I didn't know P at the time (perhaps I had a Gettierized belief). According to KAA, I violated the norm. Do I owe my interlocutor a retraction, even though I told them the truth?"

  *   **Likely Move:** They will say yes, you owe a retraction because you misled them about your epistemic position.
  *   **Follow-Up:** "That seems counterintuitive to the function of assertion as a means of sharing information. If the information was true and useful, why does the genealogy of my belief mandate a retraction? Does this prioritize the speaker's virtue over the listener's informational gain?"

  ### 7. The "How Do You Know?" Challenge
  **Question:** "Proponents of KAA often point out that 'How do you know?' is the standard challenge to an assertion. But in many conversational contexts, 'Why do you believe that?' or 'What makes you say that?' seems equally appropriate. Is the 'How do you know?' challenge actually as universal as the KAA suggests?"

  *   **Likely Move:** They will argue that 'Why believe?' is just a colloquial shorthand for 'How do you know?'
  *   **Follow-Up:** "In contexts of low stakes or high trust, challenging with 'How do you know?' can seem aggressive or pedantic. If the norm is constitutive of assertion, why is invoking it sometimes conversationally improper?"

  ### 8. Moore's Paradox Variants
  **Question:** "The KAA explains Moore's Paradox ('P but I don't know P') very well. But what about the variant 'P but I don't believe P'? This also sounds absurd, but the KAA doesn't directly explain it, since one can know P without believing P (on some views) or the norm doesn't reference belief. Does the KAA need a supplement to handle belief-based paradoxes?"

  *   **Likely Move:** They will argue that knowledge entails belief, so the two paradoxes are the same.
  *   **Follow-Up:** "If you tie the norm strictly to belief instead, do you lose the ability to explain cases where we assert things we believe but clearly don't know? Why privilege the knowledge condition over the belief condition if both generate paradoxes?"

  ### 9. Cross-Linguistic Evidentials (Linguistics Angle)
  **Question:** "From a linguistic perspective, many languages require grammatical evidential markers (e.g., distinguishing 'I saw it rain' from 'I heard it rained'). Does the KAA, which seems rooted in English-speaking intuitions about 'knowing,' account for languages where the norm of assertion is explicitly tied to *evidence type* rather than knowledge states?"

  *   **Likely Move:** They will claim evidentials are just grammaticalized ways of marking knowledge sources.
  *   **Follow-Up:** "But in some languages, you are grammatically prohibited from asserting something even if you know it, if you lack the *specific type* of evidence (e.g., direct visual). Doesn't this suggest the norm is evidential, not epistemic?"

  ### 10. The Value Problem
  **Question:** "Finally, even if knowledge is *a* norm of assertion, why is it *the* norm? Why not Justified True Belief? Or simply Truth? What explanatory work is the 'knowledge' part doing that 'justified true belief' couldn't do equally well in regulating assertion?"

  *   **Likely Move:** They will argue that JTB doesn't block the lottery cases or Gettier cases in the same way knowledge does.
  *   **Follow-Up:** "But if the intuition is just that Gettierized assertions feel 'lucky' or 'defective,' isn't that a problem about the *value* of the state, not the *norm*? Can't we have a norm of 'Assert what is Justified' and still dislike Gettier cases without calling them norm violations?"

  ### Moderator Tip
  Since you are a linguist, you have license to lean harder on **Question 9**. Philosophers of language often generalize from English. If he struggles there, it highlights a potential limitation in the theory's universality. Good luck!
