answer: |-
  **Setting:** *The hotel bar, 11:30 PM. The noise of the philosophy conference has thinned to a low hum. Elena and Marcus sit at a small table, nursing a gin and tonic and an espresso martini respectively. A copy of van Fraassen's "Belief and the Will" lies closed on the table between them.*

  **Elena:** You have to admit, Marcus, the talk tonight sidestepped the real bomb. Everyone was busy fighting over whether Beauty is a Halfer or a Thirder, like it's a scorecard for Bayesian loyalty. But Elga's real target wasn't the coin; it was the Reflection Principle.

  **Marcus:** *[Sips martini]* Elga's target was consistency. He thinks Thirderism is consistent. I think he sacrifices diachronic coherence to get it. But go on. You think Reflection is dead?

  **Elena:** I think Elga buried it. Look at the timeline. Sunday night: Beauty knows the protocol. She knows the coin is fair. Her credence in Heads is 1/2. She also knows that on Monday morning, she will wake up. She knows she will have no new evidence—she knew she'd be awake. And critically, between Sunday and Monday, no memory wipe has occurred yet.

  **Marcus:** The "no new evidence" claim is the weak link. She learns *I am awake now*. That's indexical evidence.

  **Elena:** That's the standard Halfer escape, and we've hashed it to death. But look at Reflection specifically. Van Fraassen says: If you are certain now that your future credence in $P$ will be $r$, your current credence must be $r$. Condition: You expect no new evidence and no cognitive mishaps. On Sunday, Beauty is certain her Monday credence in Heads will be 1/3. Yet her Sunday credence is 1/2. That's a direct violation. No indexical dodging changes the fact that she *knows* what she will believe Monday.

  **Marcus:** She knows what she will believe only if she assumes the Thirder calculation is correct. But let's grant that for the sake of argument. Even then, you're glossing over van Fraassen's escape clause. "No cognitive mishaps." Elga assumes the Sunday-to-Monday transition is mishap-free. I'm saying the experimental design itself contaminates the continuity.

  **Elena:** Contaminates how? The amnesia drug is administered *after* the Monday interview, if at all. Sunday to Monday is chemically pristine. To say Reflection fails there because of a future drug test is like saying I can't trust my memory of breakfast because I'm scheduled for a lobotomy next Tuesday.

  **Marcus:** It's not about the chemistry; it's about the epistemic architecture. Monton's point—and I think it's underappreciated—is that Reflection requires the agent to be certain that their future self is an epistemic successor who hasn't lost information. Beauty, on Sunday, knows that her epistemic trajectory is designed to include information loss.

  **Elena:** But she knows the loss hasn't happened *by Monday*.

  **Marcus:** Does she? She knows the *protocol* involves forgetting. On Sunday, she is uncertain whether she is in the Heads world or the Tails world. If she is in the Tails world, her Monday self is part of a sequence that *will* suffer amnesia. Does the mere possibility that her cognitive continuity is compromised in the nearby possible world she occupies violate the "no mishap" condition?

  **Elena:** That sounds incredibly ad hoc, Marcus. You're stretching "cognitive mishap" to mean "part of an experiment where a mishap might eventually happen." Van Fraassen's Dutch Book argument relies on the agent being vulnerable *between* $t_0$ and $t_1$. If no information is lost between Sunday and Monday, the Dutch Book stands. You can't immunize Reflection by pointing at a memory wipe that hasn't fired yet.

  **Marcus:** It's not ad hoc if you look at *why* Reflection holds. It holds because your future self is a trusted trustee of your current evidence. If the experiment is designed to break that trust—even potentially—then the condition for Reflection isn't met. Beauty on Sunday cannot treat Beauty on Monday as a standard Bayesian updater because Monday-Beauty is a node in a network designed to scramble self-locating information.

  **Elena:** But Monday-Beauty *hasn't been scrambled yet*. This is the crux. If I tell you, "Tomorrow I will tell you the truth, but the day after I might lie," you should still trust me tomorrow. Reflection demands you align with tomorrow's credence. Elga shows Beauty doesn't. If you say Reflection doesn't apply because of the *day after*, you're making the principle toothless. Any time there's a risk of future forgetting, I can ignore my future credences today?

  **Marcus:** No, not any risk. A structural guarantee of forgetting. Look, van Fraassen's constraint is about rational planning. If I know my future self will have less information than me, I shouldn't align with them. In the Tails branch, Monday-Beauty *will* have less information than Sunday-Beauty eventually. But more importantly, Monday-Beauty has *self-locating* uncertainty that Sunday-Beauty resolved.

  **Elena:** Sunday-Beauty hasn't resolved it! She knows it's Sunday. Monday-Beauty knows it's Monday. That's just time passing.

  **Marcus:** It's not just time passing; it's the loss of the indexical anchor "Today is Sunday." When that anchor drops, information is lost. Sunday-Beauty knows "Today is Sunday." Monday-Beauty does not. Therefore, Monday-Beauty has strictly less self-locating information than Sunday-Beauty.

  **Elena:** Ah, there it is. The "loss of indexical information" move. But van Fraassen's principle is usually framed about the proposition in question. If the proposition is "The coin is Heads," does losing the knowledge "Today is Sunday" matter?

  **Marcus:** It matters because the credence in Heads is *dependent* on the self-locating belief. You can't separate the coin from the awakening. If I lose the ability to distinguish which awakening I'm on, I've lost information relevant to the coin.

  **Elena:** But on Sunday, she knows she'll lose that ability. Reflection says: If you know you'll believe $r$ later, believe $r$ now. She knows she'll believe 1/3. She believes 1/2. The loss of indexical info explains *why* the credence changes, but it doesn't explain away the violation of Reflection unless you define "cognitive mishap" as "any change in indexical knowledge."

  **Marcus:** And why isn't that a valid definition? If I forget what day it is, that's a cognitive mishap relative to my Sunday state. Van Fraassen explicitly excludes cases of forgetting.

  **Elena:** Forgetting your keys is a mishap. Waking up on Monday when you knew you'd wake up on Monday isn't forgetting; it's just being on Monday. The "forgetting" only happens if it's Tails and it's actually Tuesday. But on Monday, regardless of the coin, she's in the same state. If you argue Reflection fails because of the Tails-branch amnesia, you're arguing that a possibility in one branch invalidates the rational constraint in the other.

  **Marcus:** I'm arguing that the *uncertainty* about the branch invalidates the certainty required for Reflection. To apply Reflection, Beauty must be certain she is not undergoing a mishap. Is she certain? She knows the protocol. She knows that from the perspective of the experiment, her Monday awakening is indistinguishable from a Tuesday awakening in the other branch. The epistemic situation is "tainted" by the design.

  **Elena:** "Tainted." That's the word that gives it away. You're saving the principle by poisoning the well. If Reflection only applies to agents who are certain they aren't in a thought experiment designed to confuse them, then Reflection applies to almost no one in epistemology. It becomes a principle for idealized angels, not Bayesians.

  **Marcus:** Better a principle for angels than a principle that allows diachronic Dutch Books. If you drop Reflection, you allow agents to knowingly adopt credences they know they'll abandon without evidence. That's irrationality.

  **Elena:** Or it's a sign that rationality is more subtle than van Fraassen thought. Maybe credence isn't just about evidence accumulation; maybe it's about perspective. Elga's point is that Beauty is a *thirder* on Monday because she recognizes she's a random sample from the awakenings. On Sunday, she's not. The shift isn't a mishap; it's a shift in reference class. Reflection assumes the reference class is stable.

  **Marcus:** Reflection assumes the *agent* is stable. If the reference class shifts because the agent loses self-locating data, that's a loss of information. Monton's defense is principled: Van Fraassen said "no forgetting." Beauty forgets which day it is relative to Sunday. Therefore, Reflection doesn't trigger. It's not ad hoc; it's literal.

  **Elena:** It's literalist, sure. But is it faithful to the *spirit* of the Dutch Book argument? The Dutch Book works because the bookie can exploit the gap between Sunday and Monday. If Beauty refuses to align her Sunday credence with her Monday credence, she buys a bet on Sunday she knows she'll value differently Monday.

  **Marcus:** She values it differently because she *has* different evidence. The indexical evidence.

  **Elena:** She knew she'd have that evidence! She knew she'd wake up and not know the day. That was in the briefing on Sunday. You can't say "I knew I'd lose this info, so I'm exempt from Reflection." Van Fraassen's condition is that you expect no *unanticipated* mishaps. This was anticipated.

  **Marcus:** *[Leans forward]* Anticipated forgetting is still forgetting. If I know I'm going to get drunk tonight and forget my password, and I say "Tomorrow I'll believe the password is 1234," I shouldn't believe that today. I should recognize my future self is compromised. Beauty knows her Monday self is epistemically compromised relative to Sunday because Monday-Beauty cannot distinguish her situation from a Tails-Tuesday situation. Sunday-Beauty can. That asymmetry is information loss.

  **Elena:** So the mere existence of a indistinguishable counterfactual situation counts as information loss?

  **Marcus:** The existence of a situation she *cannot rule out* on Monday, which she *could* rule out on Sunday. On Sunday, she rules out "It is Tuesday." On Monday, she cannot. She has lost the ability to rule out a possibility. That is the definition of losing information.

  **Elena:** She hasn't lost the ability; the world has changed. "It is Tuesday" was false on Sunday and is false on Monday (in the actual Heads world). You're treating the truth value of indexicals as evidence that can be lost.

  **Marcus:** I'm treating the *knowledge* of the truth value as evidence. She knew "Today is not Tuesday." Now she doesn't. Whether "Today is not Tuesday" is true is irrelevant to whether she *knows* it. She lost the knowledge. Van Fraassen says: If you lose knowledge, Reflection is off the table.

  **Elena:** *[Takes a long sip]* You're turning "loss of knowledge" into "change in truth conditions of indexicals." If that counts as a cognitive mishap, then Reflection never applies to any agent who experiences time. Every morning I wake up, I lose the knowledge that "Today is Yesterday."

  **Marcus:** Exactly! Reflection is a synchronic constraint disguised as a diachronic one. It only holds across time if time doesn't change your epistemic access to self-locating facts. Sleeping Beauty just makes the self-locating nature of belief undeniable. Elga didn't kill Reflection; he just showed it doesn't apply to self-locating believers in branching timelines.

  **Elena:** Which is a fancy way of saying it doesn't apply to us. We're all self-locating believers in a branching timeline. If Reflection can't handle Beauty, it can't handle Monday morning.

  **Marcus:** Then maybe we need a richer principle than Reflection. But I won't let you say Elga showed Reflection is *false*. He showed its domain is narrower than van Fraassen hoped.

  **Elena:** And I say a principle that fails in the very cases designed to test diachronic coherence isn't a principle; it's a heuristic. But... *[clinks her glass against his]* ...I'll grant you that Monton's "loss of indexical knowledge" is a cleaner defense than the "new evidence" line. It at least engages with the Reflection condition directly.

  **Marcus:** And I'll grant you that if "loss of indexical knowledge" exempts every temporal update, Reflection is trivial. But in Beauty's case, the loss is structural, not just temporal. It's the indistinguishability.

  **Elena:** Structural indistinguishability. Fine. But don't be surprised if the Thirders steal that argument and use it to justify why Sunday-Beauty should also be a Thirder. If the loss of indexical info is the key, maybe Sunday-Beauty should anticipate it more aggressively.

  **Marcus:** *[Smiles]* Let's not give them any more ammunition. One paradox per conference is enough. Another round?

  **Elena:** Why not. But I'm ordering for you. I know what you'll want tomorrow, but right now, I know better.

  **Marcus:** Touché. That's Reflection for you.
