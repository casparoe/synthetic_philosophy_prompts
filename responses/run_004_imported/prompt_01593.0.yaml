answer: |-
  You have spotted a genuine historical and philosophical anachronism, and your physicist's instinct to check the primary data (the *Letter* itself) rather than trusting the secondary commentary (your group's discussion) has served you well.

  The short answer is: **Your group is projecting a modern resolution onto a 17th-century problem.**

  While Galileo is often claimed as the patron saint of the "separate spheres" argument (what Stephen Jay Gould later termed NOMA, or Non-Overlapping Magisteria), that is not actually what he argued in the *Letter to the Grand Duchess Christina*. In fact, as you noticed, if he truly believed science and scripture occupied entirely separate turfs, he would have had no need to engage in biblical exegesis at all.

  Here is the breakdown of why your reading is more accurate than your group's consensus, and how you might frame this for your next meeting.

  ### 1. The Quote vs. The Argument
  First, a minor correction that might delight your group: that famous line ("The Bible teaches how to go to heaven, not how the heavens go") is not actually found in Galileo's writings. It is usually attributed to Cardinal Caesar Baronius, a contemporary of Galileo. Galileo certainly echoed the sentiment, but it was a slogan of his circle, not the core of his legal defense.

  The reason it isn't his core argument is that the slogan implies **separation**, whereas Galileo's argument in the *Letter* was about **integration**.

  ### 2. Why Galileo Did Exegesis
  You asked the crucial question: *If scripture is none of astronomy's business, why bother arguing about Joshua and the Psalms?*

  Galileo was a devout Catholic. He was not trying to secularize science or push religion out of the business of natural truth. He was trying to prevent the Church from declaring Copernicanism heretical. To do that, he couldn't just say, "The Bible doesn't cover physics." He had to argue that the Bible *does* cover physics, but it speaks in "accommodated language."

  His argument rests on two main pillars, both of which require him to interpret scripture:

  *   **The Two Books:** Galileo argued that God is the author of both Nature and Scripture. Since God is Truth, Truth cannot contradict Truth. Therefore, if a scientific demonstration is certain (like the phases of Venus), and Scripture appears to contradict it, our *interpretation* of Scripture must be wrong, not the science.
  *   **Accommodation:** Galileo argued that the Holy Spirit spoke through biblical authors in language the common people of the time could understand. When the Psalmist says the sun "runs a race," or Joshua commands the sun to stand still, they are describing phenomena *as they appear to the senses*, not making technical astronomical claims.

  If Galileo held a NOMA view, he would have said, "Joshua is a theological text about God's power, make no claims about orbital mechanics." Instead, Galileo said, "Joshua describes the *appearance* of the sun stopping, which is consistent with Copernicanism if you understand the optics and reference frames involved."

  He wasn't separating the domains; he was claiming that **science holds the epistemic priority** when interpreting scriptural passages about the natural world.

  ### 3. Galileo vs. NOMA
  Stephen Jay Gould's NOMA (from the late 1990s) suggests that science and religion are "Non-Overlapping Magisteria." Science covers the empirical universe; religion covers meaning and moral value. They don't touch, so they can't fight.

  Galileo's view was more dangerous to the Church hierarchy than NOMA.
  *   **NOMA says:** "Church, stay out of the lab; Scientists, stay out of the pulpit."
  *   **Galileo says:** "Church, you need scientists to tell you how to read the Bible when it talks about nature."

  Galileo was effectively arguing that theologians were unqualified to interpret biblical passages regarding physics without input from mathematicians. That is not a separation of powers; it is a jurisdictional claim by science over a portion of theology.

  ### 4. Why the Confusion?
  Your group isn't alone in this. Historians of science call this the "Conflict Thesis" hangover. For a long time, the narrative was simplified into "Science liberated us from Religious dogma." In that narrative, Galileo is the hero who drew a line in the sand.

  It is comforting to view Galileo as a modern secularist *avant la lettre*. It makes the resolution to the science/religion conflict seem simple: "Just do what Galileo said, keep them separate."

  But the reality is messier. Galileo wanted to save the authority of the Bible, not sideline it. He believed that by interpreting it literally in matters of science, the Church was actually *diminishing* its authority, because eventually, science would prove the literal reading wrong, and the Church would look foolish. (Which, of course, happened.)

  ### How to Present This to Your Group
  Since you are dealing with retired teachers and an opinionated ex-lawyer, you might frame it as a matter of "legal strategy" or "hermeneutics."

  You could say something like:
  > "I went back to the evidence—the *Letter* itself—and I noticed Galileo spends half the document arguing about how to interpret Joshua and the Psalms. If he really believed in total separation, he wouldn't have touched those verses. He wasn't arguing that the Bible is silent on nature; he was arguing that the Church was reading the nature-passages too literally. He wasn't drawing a border between science and religion; he was arguing that science holds the key to unlocking the true meaning of religious texts when they describe the physical world."

  ### Summary
  You are right. Galileo was not a clean separationist. He was an integrationist who believed that proper scientific understanding was a prerequisite for proper theological interpretation.

  The "Heaven/Heavens" line is a useful soundbite for peace treaties between modern scientists and theologians, but it doesn't reflect the actual battlefield Galileo was fighting on. He wasn't trying to leave the Church's turf; he was trying to tell the Church how to map it.

  Enjoy the debate. With a background like yours, you're well-equipped to point out when the "data" (the text) doesn't fit the "model" (the group's consensus).
