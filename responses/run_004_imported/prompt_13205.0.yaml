answer: |-
  Friends, colleagues, and family.

  We are here to mark a datum point. Ninety years. In physics, we learn that as systems age, they tend toward entropy—disorder, cooling, a slowing down. But looking at [Friend's Name], I am reminded of a much older dataset. Two thousand years ago, Cicero wrote *De Senectute*, a dialogue defending old age against four specific indictments. Since half this room will scrutinize the footnotes and the other half just wants cake, I will spare you the Latin. But the arguments remain relevant, especially for a chemist who demands evidence.

  The first charge Cicero lists is that old age withdraws us from active affairs. It is the charge of obsolescence. You leave the lab; you no longer hold the pipette; you no longer run the beamline. The ancient rebuttal, spoken by Cato, is that the pilot does not need to climb the rigging to steer the ship. The work shifts from the hand to the mind, from doing to guiding.

  [Friend's Name], you have retired from the laboratory, but you have not retired from the science. You are still the calibration standard for all of us. You correct our methodology over dinner; you spot the flaw in our reasoning before we publish. The active affair has not ended; it has merely changed phase. You are no longer the reagent; you are the catalyst.

  The second and third charges are harsher: that old age weakens the body and strips away pleasure. Here, we must be honest, because [Friend's Name] has no patience for pieties, and neither does modern gerontology. Cicero argued that physical decline is often a debt from youthful excess, and that memory need not fail if kept in practice like a muscle.

  We know now that this is partially false. Telomeres shorten regardless of virtue. Neurons degrade regardless of how many puzzles you solve. I have watched you struggle with a stiff knee, and I have seen you search for a word that used to come instantly. To claim otherwise would be bad science. Cicero was too optimistic about the hardware. But he was right about the software. The body slows, yes, but the capacity for judgment—the integration of data over a lifetime—peaks now. You trade speed for accuracy. You trade the sprint for the map.

  And regarding pleasure? Cicero claimed old age is blessed because it frees us from the "madness" of physical desire. He was a stoic; he thought pleasure was a distraction. I think he was wrong, or at least, incomplete. You have not lost pleasure; you have refined it. The rush of a breakthrough is rare, but the joy of a meal shared, of a grandchild's laugh, of a garden in bloom—these are not lesser data points. They are higher signal-to-noise. The young feel pleasure intensely but briefly; you feel it deeply and sustainably.

  Finally, there is the fourth charge: that old age brings us near to death. Cicero compared it to fruit ripening and falling; a natural conclusion, not a tragedy. As a physicist, I might say it is the conservation of energy. Nothing is lost; it is only transferred.

  [Friend's Name], you are ninety. The charges against you have been reviewed. You have not withdrawn; you have shifted your leverage. Your body is not what it was, but your mind remains a rigorous instrument. You have not lost pleasure; you have curated it. And as for the end? We do not look at it with fear, but with the same empirical calm you applied to every titration.

  So, I ask the colleagues to raise a glass to your rigor, and the grandchildren to raise a glass to your warmth. To [Friend's Name]: may your variables remain controlled, your reactions be exothermic, and your equilibrium be peaceful.

  Cheers.
