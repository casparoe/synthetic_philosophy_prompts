      *   *Charge 2: Weakens the body.* Cato says: Exercise and moderation help. Often decay is from youthful vice, not age.
      *   *Charge 3: Deprives of pleasures.* Cato says: Good riddance! Pleasures are the bane of reason. Old age enjoys conversation and nature.
