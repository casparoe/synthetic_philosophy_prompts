answer: |-
  You have spotted one of the most famous and contentious *cruxes* in the history of moral philosophy and economic thought. Your confusion is well-founded: commentators have been fighting over this specific passage (NE 1133a–b) for two millennia. Marx read it as a proto-labor theory of value; neoclassical economists read it as a proto-subjective theory of value; and contemporary value theorists (like Raz or Chang) read it as an ancient acknowledgment of incommensurability.

  The tension you identified—between money *making* things commensurate and things being *impossible* to commensurate except "sufficiently"—is not a translation error. It is the exact point where Aristotle is navigating between ontology (what things *are*) and social function (what money *does*).

  Here is an untangling of the logical structure, the Greek concepts involved, and how this maps onto the contemporary incommensurability debate.

  ### 1. The Logical Structure of the Passage

  To see what Aristotle is committing himself to, we have to break down the syllogistic chain he is building.

  1.  **Premise 1:** Social association (*koinōnia*) requires exchange.
  2.  **Premise 2:** Exchange requires equality (reciprocity).
  3.  **Premise 3:** Equality requires commensurability (a common measure).
  4.  **Problem:** Qualitatively different goods (houses, shoes, food) are not naturally commensurable.
  5.  **Solution (The "Truth"):** The only thing that is actually common to all these goods is human need/demand (*chreia*).
  6.  **Solution (The "Convention"):** Money (*nomisma*) is the conventional token that represents *chreia*.
  7.  **Conclusion:** Money makes goods commensurate *for the purpose of exchange*, even if they are not commensurate by nature.

  The sentence bothering you is the pivot between Premise 4 and the Conclusion. In Greek, the key phrase is *tēi alētheiai men oun adunaton... tēi de chreiai hikanōs* ("in truth indeed impossible... but by need sufficiently").

  ### 2. Is Value One-Dimensional or a "Rough Patch"?

  **Verdict:** Aristotle is **not** committing to a one-dimensional theory of value in the modern utilitarian or Marxist sense. He is closer to the "rough patch" view, but with a specific social twist.

  Here is why:
  *   **Ontological Gap:** When Aristotle says it is "impossible" (*adunaton*) for things differing so much to become commensurate, he is making an ontological claim. A house and a shoe differ in kind (*eidos*). There is no natural substance of "value" inherent in them that allows for mathematical equality.
  *   **Functional Commensurability:** When he says they become commensurate "sufficiently" (*hikanōs*) with reference to demand, he is making a functional claim. *Hikanōs* means "adequately for the purpose at hand." It does not mean "perfectly" or "truly."
  *   **The Role of Money:** Money does not *reveal* a pre-existing commensurability; it *creates* a functional commensurability where there wasn't one. This is why he emphasizes that money exists by *nomos* (law/convention), not *physis* (nature).

  **How this fits your seminar:**
  If you are sitting with the Raz/Chang literature, Aristotle is actually a useful ally for the **incommensurabilist** side, but with a caveat.
  *   **Raz/Chang:** Often argue that some values (liberty vs. security) cannot be ranked on a single scale without loss of meaning.
  *   **Aristotle:** Agrees that goods (houses vs. shoes) cannot be ranked on a single *natural* scale.
  *   **The Divergence:** Modern incommensurabilists often suggest this makes rational choice difficult or impossible. Aristotle suggests that for *economic exchange*, we construct a conventional scale (money) that makes choice possible *enough* to sustain the city. He is less interested in the metaphysical truth of value and more interested in the conditions required for social cohesion.

  So, Aristotle is saying: **Strict commensurability is impossible; functional commensurability is necessary; money is the convention that bridges the gap.**

  ### 3. Is "Commensurable" Doing the Same Technical Work?

  **Verdict:** No, not exactly. This is the biggest risk of anachronism in your seminar.

  **In Contemporary Value Theory (Raz, Chang, etc.):**
  *   **Term:** Commensurability.
  *   **Meaning:** Two items are commensurable if there is a single covering value that allows them to be ranked ordinally (better/worse/equal).
  *   **Context:** Practical reason, moral choice, rationality.
  *   **Stakes:** If values are incommensurable, is rational choice possible?

  **In Aristotle (NE V.5):**
  *   **Term:** *Summetra* (commensurate).
  *   **Meaning:** Literally "measured together." It implies a quantitative, almost mathematical equality (5 shoes = 1 house).
  *   **Context:** Distributive and reciprocal justice, specifically *exchange*.
  *   **Stakes:** If goods aren't commensurate, can the polis hold together? (His answer: No, because exchange stops).

  **The Crucial Distinction:**
  When Raz talks about incommensurability, he often means that comparing the values involves a category error. When Aristotle talks about it, he is acknowledging a category error but insisting that **need (*chreia*)** acts as a reducer.

  Aristotle identifies *chreia* (need/demand) as the "one thing" that measures all goods. However, he immediately undermines this by saying money is just a *representative* of demand, and money is conventional. This suggests *chreia* itself isn't a precise metric, but a social glue.

  Therefore, Aristotle is making a **narrower point about market prices** (or rather, reciprocal equivalence) that later readers project onto **broad value theory**. However, the *structure* of his argument anticipates the modern debate:
  1.  Recognition of qualitative difference.
  2.  Denial of natural common measure.
  3.  Introduction of a conventional measure to facilitate action.

  ### 4. How to Frame This in Seminar

  If you want to contribute to the discussion without Greek, focus on the **modal status** of the commensurability.

  *   **The "Strong" Reading:** Money makes goods truly commensurate. (Aristotle rejects this with the word *adunaton* / impossible).
  *   **The "Weak" Reading:** Money is a fiction we agree to treat as true. (Aristotle supports this with *nomos* / law and *hikanōs* / sufficiently).

  **The specific intervention you can make:**
  "Aristotle seems to be distinguishing between *ontological commensurability* (which he denies is possible) and *social commensurability* (which he says is 'sufficient' via money). This suggests that for Aristotle, commensurability isn't a property of the goods themselves, but a property of the relationship between the exchangers. This aligns with the modern view that incommensurability is often about the lack of a common *ranking scale*, but adds the insight that we can construct conventional scales for specific social purposes (like exchange) without resolving the underlying ontological difference."

  ### Summary of the Tension You Spotted

  You asked: *Is Aristotle conceding that money doesn't really make radically different goods commensurable in any strict sense, it's just a workable stand-in via demand?*

  **Yes.** That is exactly right. The sentences before and after talk as if money *does* make them commensurate because, **for the purposes of justice in exchange**, the convention *counts* as reality. But the "impossible... but sufficiently" sentence is Aristotle winking at the reader: "Ontologically, this is false. Sociologically, it is necessary."

  He is not a value monist (one-dimensional value). He is a **conventionalist about economic value**. He believes values are diverse, but the city requires us to act *as if* they are measurable, and money is the tool that allows that fiction to function without collapsing into injustice.

  **Recommended Secondary Reading (if you want to check these claims):**
  *   **John Finnis, *Natural Law and Natural Rights*:** Discusses Aristotle on incommensurability.
  *   **Ruth Chang (ed.), *Incommensurability, Incomparability, and Practical Reason*:** Often cites this Aristotelian passage as a precursor.
  *   **Meikle, *Aristotle's Economic Thought*:** Argues against reading Aristotle as a modern economist, emphasizing the "need" (*chreia*) aspect.
  *   **Schollmeier, "Aristotle on Commensurability":** Specifically addresses the *hikanōs* ("sufficiently") qualifier.

  You are reading the text correctly. The tension is real, and it's the most philosophically interesting part of the chapter.
