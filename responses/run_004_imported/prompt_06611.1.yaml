  ok so in my IB TOK class we did this whole unit on disagreement between "epistemic peers" (basically two people with the same evidence and reasoning skills who still end up disagreeing) and i got kind of obsessed and went and read more about it online. so conciliationism (aka the "equal weight view") says that once you realize a peer disagrees with you, you don't have any special reason to think you're the one who's right, so you're supposed to move your credence toward theirs. cool, makes sense.

  but heres the thing thats been bugging me: a ton of smart epistemologists actually reject conciliationism and defend the steadfast view instead (i think theres even a paper by elga literally called something like "how to disagree about how to disagree" about this exact issue). so shouldnt a conciliationist, by their OWN logic, have to lower their confidence in conciliationism once they notice all these peers reject it? and if thats required, doesnt the view kind of eat itself??

  can you actually argue FOR the claim that conciliationism is self-undermining in this way (like actually defend it, dont just lay out both sides)? and can you specifically deal with why this isnt just the generic "well every philosophical view is controversial so this objection proves too much" comeback, bc that feels like a cop-out to me but i cant rlly articulate why
