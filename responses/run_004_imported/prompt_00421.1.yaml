      *   *Standard Definition (Strict Dominance by Mixed Strategy):* Strategy $B$ is strictly dominated if there exists a *mixed strategy* $\sigma_i$ such that $u(\sigma_i, s_{-i}) > u(B, s_{-i})$ for all $s_{-i}$.
      *   *The Crucial Distinction:* The user is checking for dominance *only by other pure strategies*. They are ignoring the possibility that a *mixture* of other strategies might dominate the strategy in question.

  3.  **Address the "Safely Un-dominated" Assumption:**
