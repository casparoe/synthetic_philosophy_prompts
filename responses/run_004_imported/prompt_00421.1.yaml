      *   *Problem:* In IEDS, the set of opponent strategies shrinks. A strategy that wasn't dominated in Round 1 might become dominated in Round 2 *after* some opponent strategies are eliminated.
      *   *Problem 2 (Mixed Strategies):* Even if a strategy isn't dominated by a pure strategy, it might be dominated by a mixed strategy. If the definition of IEDS being used allows elimination by mixed strategies (which is the standard rationalizability concept), the user's method is incomplete.

