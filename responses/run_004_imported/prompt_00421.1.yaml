answer: |-
  You have identified a critical pivot point in game theory. Your current procedure describes **Iterated Elimination of Strictly Dominated Strategies (IESDS) considering only pure strategies.**

  However, if your goal is to align with standard advanced game theory (and the LessWrong discussions on Rationalizability and Correlated Equilibrium), your procedure has **two significant flaws**.

  Here is what changes when you account for mixed strategies and the iterative nature of the process.

  ### 1. The Mixed Strategy Blind Spot
  Your current rule checks if a pure strategy is dominated by another *single pure strategy*. In standard game theory (specifically when defining **Rationalizability**), a strategy is considered dominated if there exists **any** strategy (pure *or* mixed) that yields a strictly higher payoff.

  A pure strategy can be undominated by any other *pure* strategy, yet still be strictly dominated by a *mixture* of other strategies. If you do not eliminate these, you are left with a set of strategies larger than the set of Rationalizable strategies.

  **The Classic Counter-Example:**
  Consider a player with three strategies: $Top$, $Middle$, $Bottom$. The opponent has $Left$ and $Right$.
  Payoffs for the player:
  *   **Top:** 0 vs Left, 4 vs Right
  *   **Middle:** 1 vs Left, 1 vs Right
  *   **Bottom:** 4 vs Left, 0 vs Right

  **Using your procedure:**
  *   Does $Top$ dominate $Middle$? No ($0 < 1$ against Left).
  *   Does $Bottom$ dominate $Middle$? No ($0 < 1$ against Right).
  *   **Conclusion:** You would mark $Middle$ as "safely un-dominated."

  **Using the standard procedure (allowing mixed strategies):**
  *   Consider a mixed strategy $\sigma = 0.5 \cdot Top + 0.5 \cdot Bottom$.
  *   Expected payoff vs Left: $0.5(0) + 0.5(4) = 2$. (Greater than $Middle$'s 1).
  *   Expected payoff vs Right: $0.5(4) + 0.5(0) = 2$. (Greater than $Middle$'s 1).
  *   **Conclusion:** $Middle$ is strictly dominated by the mixed strategy $\sigma$ and **must be eliminated.**

  **Why this matters for LessWrong/Correlated Equilibrium:**
  Aumann's Correlated Equilibrium (CE) is defined over the set of **Rationalizable** strategies. Rationalizability is equivalent to IESDS *where dominance includes mixed strategies*. If you fail to eliminate $Middle$ in the example above, you are analyzing a game space that includes strategies a rational agent would never play, even with randomization. This inflates the set of possible Correlated Equilibria you might find.

  ### 2. The "Safely Un-dominated" Assumption
  You wrote: *"Once a strategy clears that pairwise comparison, I've been treating it as safely un-dominated for the rest of the elimination process."*

  This is incorrect. Survival in Round 1 does not guarantee survival in Round 2.
  Dominance is defined relative to the **remaining** strategies of the opponents. As you eliminate opponent strategies, the condition "against *every* remaining strategy profile" becomes easier to satisfy.

  **Example:**
  *   Strategy $A$ is a best response to Opponent's Strategy $X$.
  *   Strategy $B$ dominates $A$ against $Y$ and $Z$, but not against $X$.
  *   In Round 1, $A$ survives because of $X$.
  *   In Round 2, if $X$ is eliminated (because it was dominated for the opponent), $A$ loses its shield. $B$ now dominates $A$ against all *remaining* opponent strategies ($Y$ and $Z$).
  *   $A$ must be eliminated in Round 2.

  You must re-evaluate **every** surviving strategy against **every** other available strategy (including mixes) in **every** round.

  ### Summary of Corrections

  To align your procedure with the textbook/ LessWrong standard for Rationalizability:

  1.  **Expand the Dominance Check:** In every round, check if a pure strategy is dominated by any **mixed strategy** over the other pure strategies, not just by other pure strategies. (Mathematically, this often requires checking if the strategy is a best response to any belief over the opponent's remaining strategies; if it is never a best response, it is dominated by a mix).
  2.  **Iterate Fully:** Do not mark a strategy as "safe" permanently. A strategy that survives Round $N$ may become dominated in Round $N+1$ due to the reduction of the opponent's strategy space.
  3.  **Strict vs. Weak:** Ensure you are eliminating **strictly** dominated strategies. Eliminating *weakly* dominated strategies can change the set of Nash Equilibria depending on the order of elimination. Standard Rationalizability uses strict dominance.

  ### Recommendation
  If you are coding this or doing it by hand:
  *   **Round 1:** Eliminate strategies strictly dominated by pure or mixed strategies against the *full* opponent set.
  *   **Round 2:** With the reduced opponent set, check the *remaining* strategies again for dominance by pure or mixed strategies.
  *   **Repeat** until no more strategies can be eliminated.

  The strategies that survive this process are the **Rationalizable Strategies**. The support of any Correlated Equilibrium (and Nash Equilibrium) must be contained within this set. If your set is larger, you haven't tightened the bounds enough.
