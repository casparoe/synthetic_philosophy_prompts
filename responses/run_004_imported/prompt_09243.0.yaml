  2.  **Initial Brainstorming & Position Formulation:**
      *   *The Problem:* CDT says choose the act with the highest causal expected utility. In Death in Damascus, your choice is evidence of Death's prediction. If I choose Damascus, Death is likely there. If I choose Aleppo, Death is likely there. So $U(\text{Damascus}) < U(\text{Aleppo})$ if I lean Damascus, and vice versa. No pure strategy is stable (ratifiable).
      *   *The Standard Fix:* Egan (2007) and others suggest mixed strategies (flipping a coin). If I assign probability $p$ to Damascus, Death predicts $p$. If the payoffs are symmetric, $p=0.5$ makes me indifferent, hence ratifiable.
