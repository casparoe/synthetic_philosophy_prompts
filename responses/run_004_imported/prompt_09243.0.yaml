answer: |-
  # The Fatal Flaw of Randomization: Why Causal Decision Theory Fails in Damascus

  The "Death in Damascus" problem, formulated by Gibbard and Harper, is a stress test for decision theory that has haunted philosophers for decades. A man meets Death, who says, "I am coming for you tomorrow." The man flees to Aleppo, reasoning that Death must be looking for him in Damascus. But Death's appointment book was filled weeks ago based on highly reliable predictions; wherever the man goes, Death predicted he would go there. The man dies regardless of his choice.

  Causal Decision Theory (CDT), which advises agents to choose actions based on their causal consequences rather than mere correlations, famously stalls here. If the agent decides to stay, that decision is evidence Death predicted "stay," making "flee" look better. If he decides to flee, that decision is evidence Death predicted "flee," making "stay" look better. Neither pure strategy is "ratifiable." The standard CDT fix is to recommend a mixed strategy: the agent should flip a coin. By randomizing, the agent allegedly makes his location unpredictable enough to satisfy the conditions of ratifiability.

  However, this solution crumbles when the case is tweaked to be asymmetric. If fleeing to Aleppo involves a brutal, costly trek, or if Death is more thorough in one city than the other, the recommendation to randomize becomes intuitively repellant. This essay argues that the asymmetric Death in Damascus case exposes a genuine, unpatched defect in Causal Decision Theory. Randomization is not the rational solution; it is a mathematical artifact that mistakes evidential correlation for causal leverage. A truly rational agent, recognizing the causal fixedness of the past, should minimize the cost of the inevitable. In the asymmetric case, the rational choice is to stay in Damascus.

  ### The CDT Trap and the Mixed-Strategy Fix

  To understand why CDT recommends randomization, one must understand its commitment to causal independence. CDT posits that an agent should maximize expected utility based on the causal impact of their actions. In Newcomb-like problems, the agent's action is correlated with a state of the world (Death's location) that they cannot causally influence.

  In the symmetric version of Death in Damascus, if the agent leans toward staying, the conditional probability that Death is in Damascus rises. Consequently, the causal expected utility of staying drops below that of fleeing. But if the agent leans toward fleeing, the probability that Death is in Aleppo rises, and fleeing becomes worse. The agent is trapped in a deliberative loop where every pure decision undermines its own justification.

  Proponents of CDT, such as Brian Skyrms and David Lewis, argue that the solution lies in "ratifiability." A decision is ratifiable if, once made, it remains the preferred option given the evidence that decision provides. In the symmetric case, no pure decision is ratifiable. However, a probability distribution over actions can be. If the agent commits to a 50/50 coin flip, Death (who predicts the outcome of the flip) is equally likely to be in either city. Given this 50/50 distribution, the agent is indifferent between staying and fleeing at the moment of execution. Thus, the mixed strategy is the only stable equilibrium. CDT concludes that rationality requires the agent to randomize.

  ### The Asymmetric Wedge

  The elegance of the 50/50 solution depends entirely on symmetry. It assumes the cost of staying equals the cost of fleeing, and the probability of death is identical in both locations. Once we introduce asymmetry, the CDT recommendation begins to look less like rationality and more like a formalist glitch.

  Consider a variant where the trek to Aleppo is grueling. Let us assign utilities: Dying in Damascus is -1000. Dying in Aleppo is -1000, but the trek itself costs -100. Living in Damascus is 0. Living in Aleppo is -100 (due to the trek). Death's prediction is perfectly reliable.

  If the agent stays in Damascus, they die in Damascus. Total utility: -1000.
  If the agent flees to Aleppo, they die in Aleppo. Total utility: -1100.
  If the agent flips a coin, Death predicts the coin outcome. The agent dies in whichever city the coin dictates. Expected utility: -1050.

  In this fatalistic scenario, where the prediction is fixed in the past, the causal consequences of the agent's choice are nil regarding survival. The only causal consequence the agent *does* control is whether they endure the brutal trek. A rational agent seeking to maximize utility should clearly stay in Damascus. They will die either way, so they should die comfortably.

  However, CDT combined with the ratifiability requirement struggles to endorse this. If the agent decides "I will definitely stay," CDT argues this makes it nearly certain Death is in Damascus, rendering the utility of staying equivalent to dying. But if the agent considers fleeing, the evidential link suggests Death is in Aleppo. To restore equilibrium, CDT demands the agent adjust their probabilities until the expected utilities of staying and fleeing are equal. In many asymmetric formulations, this requires the agent to assign a non-zero probability to fleeing, thereby incurring the cost of the trek with some probability, solely to satisfy the mathematical condition of ratifiability.

  This implies that a rational agent should willingly accept a risk of a more painful death (or a certain cost of living) to "balance" the evidential probabilities of a prediction that has already occurred. This is not rationality; it is superstition dressed as game theory.

  ### The Category Error of Randomization

  The core failure of CDT in this context is a category error regarding time and causation. The appointment book was filled *weeks ago*. The state of the world (Death's location) is causally disconnected from the agent's current deliberation. The correlation exists because Death is a good predictor, not because the agent's choice reaches back in time to place Death in the book.

  When CDT recommends randomization, it treats the decision as a move in a simultaneous game against Death. It assumes that by making oneself unpredictable, one alters the probability of Death's location. But in the "fixed book" scenario, one does not alter the probability. If the book is already written, the probability is 0 or 1, not 0.5. The agent's uncertainty is epistemic, not ontological.

  By randomizing, the agent is not "outsmarting" Death; they are merely adding noise to their own demise. In the asymmetric case, this noise has a cost. To say that an agent *ought* to flip a coin is to say they ought to incur a cost (the trek) without any causal hope of avoiding the penalty (death). This violates the fundamental principle of instrumental rationality: do not pay costs for benefits you cannot causally influence.

  Defenders of CDT might argue that during deliberation, the agent cannot treat the prediction as fixed because the prediction depends on the deliberation process itself. They claim that if you decide to stay, you *make* it true that Death predicted stay. But this conflates the *truthmaker* of the prediction with the *cause* of the event. The agent's decision makes the prediction accurate, but it does not cause Death to be there; Death was already going to be there based on the prior state of the universe that determined the decision.

  In the asymmetric case, the rational agent should recognize this distinction. They should reason: "Death's location is fixed. My choice of city does not change where Death is. However, my choice of city does change whether I endure the trek. Therefore, I will minimize the trek." This reasoning is transparently sound. CDT blocks it because it forces the agent to treat their choice as evidence that shifts the probability of Death's location, leading them to believe that staying makes Death *more likely* to be in Damascus in a way that matters for expected utility calculations. But since the location is fixed, that shift in subjective probability is misleading. It leads the agent to act as if they can influence the past, or as if the correlation implies a causal lever that does not exist.

  ### The Verdict: Rationality Requires Accepting Fatalism

  The asymmetric Death in Damascus case demonstrates that CDT's reliance on ratifiability can lead to dominated strategies. A strategy is dominated if there is another option that yields a better outcome in every possible state of the world. In the costly-trek variant, "Stay in Damascus" dominates "Flip a Coin." Staying results in -1000 utility. Flipping results in an expected -1050 utility (assuming perfect prediction of the coin). "Flee" results in -1100.

  Despite "Stay" being the dominant strategy, CDT often rejects it as unratifiable. This is a fatal flaw. A decision theory that advises an agent to reject a dominant strategy in favor of a dominated mixed strategy is not a theory of rational choice; it is a theory of formal consistency that has lost touch with the goal of decision-making, which is to secure good outcomes.

  The rational agent should not try to play a game of hide-and-seek with a predictor who has already won. When faced with a causally fixed future, rationality dictates minimizing the controllable costs of the present. Randomization is a desperate attempt to reclaim causal agency where there is none. It is a "magical" belief that churning up one's own decision process can alter a fixed past.

  Therefore, the verdict is clear: Randomization is not the rational solution to Death in Damascus. It is a patch that covers a crack in Causal Decision Theory without fixing the foundation. In the asymmetric case, the rational agent rejects the coin, ignores the evidential noise, and stays in Damascus. They accept that they will die, but they refuse to make the journey to Aleppo more painful than it needs to be. CDT's inability to endorse this obvious choice proves that, in cases of logical correlation without causal leverage, CDT is not just incomplete—it is wrong. Rationality is not about being ratifiable; it is about recognizing what you can change, and what you must endure.
