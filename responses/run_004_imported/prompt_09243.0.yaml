      *   *My Verdict:* I need to pick a side.
          *   *Side A:* Randomization *is* rational. The intuition against it is just discomfort with fatalism. CDT is doing its job: acknowledging that your action provides evidence you can't causally influence.
          *   *Side B:* Randomization is *not* rational. It shows CDT is broken in Newcomb-like problems. Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) handles this better (just pick the cheaper option, accept you'll die).
          *   *Side C (Nuanced):* Randomization is the *only* consistent move for a CDT agent, but this proves CDT is inadequate for this class of problems. The rational thing *simpliciter* is to ignore the prediction (since it's fixed) and minimize suffering.
