  5.  **Writing - Focusing on the "Tail-Eating" Moment:**
      *   I need to make sure the internal monologue reflects the prompt's specific confusion. "If he was rational, he would have taken it. He didn't. So he isn't rational. If he isn't rational, my logic doesn't work. So what do I do?"
