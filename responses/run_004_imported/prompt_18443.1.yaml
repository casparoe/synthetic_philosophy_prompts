      *   *Best Fit:* A literal game setup. They are forced into it by a third party (a "handler" or "employer") who wants to test them. This externalizes the rules so the characters can focus on the psychology. Let's call the employer "The Architect."
      *   *Actually, let's strip it down:* Just the two of them. Old rivals. They have a mechanism. A timer. A safe that unlocks in stages.
