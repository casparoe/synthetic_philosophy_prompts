  *(Self-Correction during final polish)*: Make sure Mara doesn't sound like she's ignoring the Presumptuous Philosopher. She needs to offer a sophisticated defense, perhaps suggesting that the "absurdity" is intuitive bias, not logical error. Similarly, Elias needs to admit the Reference Class is the weak link of SSA, not pretend it's solved.

