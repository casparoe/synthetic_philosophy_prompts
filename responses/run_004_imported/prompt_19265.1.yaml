      *   Check constraints: Did I hit all three fallback moves? Yes (Zimmerman, Agent-Regret, Epistemic Idealization).
      *   Check verdict: Clear defense of resultant luck affecting blameworthiness.

  6.  *(Mental Outline of the specific arguments against the three points)*
      *   *Zimmerman:* Distinguish between the *source* of blame (will) and the *magnitude* of blame (act + consequence). The will launches the projectile; the impact determines the moral gravity.
      *   *Agent-Regret:* It's not just "oops." It's a recognition of agency over the outcome. If it weren't moral, why do we demand apologies/penance only from the killer?
      *   *Epistemic Idealization:* Even if we grant perfect parity, the world responds differently. The moral community responds differently. The "stipulation" doesn't erase the blood on the bumper.

  7.  **Writing the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  The discomfort you feel is not a bug in your moral intuition; it is a feature of a moral reality that the epistemic dissolution strategy attempts to rationalize away. The view you describe—championed by Andre and Richards, and often adopted by legal theorists seeking to reconcile criminal law with Kantian control principles—posits that resultant luck is an illusion of perspective. It claims that if we could see the "true" moral ledger, the drunk driver who kills and the drunk driver who does not would bear identical blame, and our harsher judgment of the former is merely a heuristic proxy for the evidence the death provides.

  This view is incorrect. It relies on a sanitized, internalist conception of agency that severs the moral agent from the world in which they act. I will argue that the driver who kills is genuinely more blameworthy than the identical driver who does not, even when antecedent recklessness and epistemic access are held fixed. The consequence is not merely evidence of the risk; it is a constituent of the moral wrong that alters the agent's culpable standing. To defend this, I will engage the three specific fallback moves you identified: the Zimmerman-style separation of wrongness and blameworthiness, the deflationary reading of agent-regret, and the objection regarding epistemic idealization.

  ### 1. Against the Zimmerman-Style Separation of Will and World

  The first fallback move, associated with Michael Zimmerman, concedes that the *act* of killing is worse than the *act* of reckless driving, but insists that *blameworthiness* tracks only the quality of the will or the antecedent choice. On this view, the two drivers made the same culpable choice; therefore, they are equally blameworthy. The death adds to the "wrongness" of the event but not to the "blame" owed by the agent.

  This distinction is unsustainable because it treats the moral agent as a disembodied will rather than an embodied actor whose agency extends into the world. Blameworthiness is not a static property attached to the moment of decision; it is a dynamic status that evolves as the decision unfolds in reality. When a reckless choice remains a risk, the agent is blameworthy for endangering others. When that risk materializes, the agent becomes blameworthy for *harming* others. These are not the same moral relation.

  Consider the debt incurred. The driver who kills incurs a moral debt to the victim's family and the community that the lucky driver does not. This debt is not merely a legal liability; it is a demand for acknowledgment, atonement, and suffering that is fitting specifically because a life was extinguished. If blameworthiness were truly identical, the fitting response from the community (and the agent herself) would be identical. But it is not. We demand more from the killer because the killer has done more. To say the "will" was the same is to ignore that the will's moral significance is partly determined by its success in altering the world. A bullet fired with murderous intent that misses is a different moral fact than one that kills, not because the intent differed, but because the agent's causal power was realized differently. The realization matters. To deny this is to claim that morality happens entirely inside the skull, which contradicts the very nature of interpersonal ethics.

  ### 2. Against the Deflation of Agent-Regret

  The second move attempts to neutralize the intuition that the killer is different by appealing to Bernard Williams's concept of "agent-regret." Williams suggested that the killer feels a special kind of regret that the lucky driver does not, but some proponents of the epistemic view argue this is merely a psychological tragedy, not a marker of moral difference. They claim agent-regret is a fitting *emotional* response to bad luck, but not evidence of increased *culpability*.

  This reading strips agent-regret of its normative force. Agent-regret is not just "feeling bad about something one caused." It is a specific acknowledgment of agency over a harmful outcome. If the increased blame were merely about luck, agent-regret would be irrational—a form of guilt over a lottery loss. But we do not treat it as irrational. We treat it as a moral requirement.

  If the lucky driver felt the same depth of agent-regret as the killer, we would think she was confused or overly scrupulous. If the killer felt only the same level of regret as the lucky driver, we would think she was sociopathic or in denial. The fittingness of the emotion tracks the moral reality. The fact that the killer *ought* to feel a burden that the lucky driver does not indicates a genuine difference in their moral standing. This sentiment is not a non-moral residue; it is the phenomenological experience of resultant moral luck. It is the agent recognizing that her agency has successfully bridged the gap between risk and ruin. To dismiss this as merely psychological is to ignore the primary way moral agents experience the weight of their actions. The "sting" of the luck is not external to the blame; it is the texture of the blame itself.

  ### 3. Against the Epistemic Idealization Objection

  The third and most sophisticated fallback move challenges the thought experiment itself. It argues that stipulating "full epistemic parity" is an idealization that quietly reintroduces asymmetry. The argument runs: if one driver killed and the other didn't, there *must* have been some microscopic difference in their attention, reaction time, or vehicle control at the critical moment. Therefore, the epistemic view holds: we blame the killer more because, in reality, she was slightly more negligent at the moment of impact, and the death reveals this.

  This objection begs the question by assuming that control is the only metric of moral difference. It refuses to accept the premise of resultant luck: that the world is chaotic and outcomes can diverge despite identical antecedents. But even if we grant the stipulation—that the drivers are truly identical in every antecedent respect and the divergence is pure quantum or chaotic luck—the epistemic dissolution still fails.

  Why? Because the epistemic view claims that *once we know* the antecedents are equal, the blame should be equal. It posits that the outcome is only valuable as *evidence*. But in your thought experiment, we *know* the antecedents are equal (by stipulation), yet the moral intuition remains that the killer is more blameworthy. If the epistemic account were true, revealing the perfect parity should dissolve the blame differential. It does not.

  The reason it does not is that the outcome is not just evidence of the past; it is a transformation of the present moral status. The blood on the bumper is not a clue to the driver's character; it is a new fact about the driver's history that changes who she is. She is now a person who has killed. The lucky driver is not. This is not an epistemic asymmetry; it is an ontological one. The epistemic account tries to explain away the moral difference by reducing the outcome to a diagnostic tool. But the outcome is not a diagnosis; it is the disease. Even with perfect knowledge of the antecedents, the driver who killed has violated the world in a way the other has not. To insist that they are equally blameworthy is to insist that the world does not matter to morality, only the mind.

  ### The Verdict

  The epistemic dissolution of resultant moral luck is a defensive maneuver designed to protect a control-principle that is too rigid for the human condition. It attempts to save the Kantian ideal that "ought implies can" by retreating into the interiority of the will. But morality is not interior. It is a negotiation between agents and the world they impact.

  In the case of your jury trial, the defendant was not punished for her luck in isolation; she was punished for the *realization* of her recklessness. The law, in holding her liable for manslaughter rather than mere reckless driving, acknowledges a truth that the epistemic theorists deny: that we are responsible for what we do, not just what we try to do. The driver who kills is more blameworthy because she has completed the moral arc of her negligence. She has turned a risk into a ruin. The lucky driver has not.

  This does not mean the lucky driver is innocent; she is still culpable for the recklessness. But the killer carries an additional burden, a "moral residue" that is genuine and not merely evidential. To deny this is to engage in a philosophical sanitization that fails to account for the grief of the victim's family, the guilt of the agent, and the intuitive demands of justice. The discomfort you feel is the recognition that our moral status is vulnerable to the world. We should not try to argue that vulnerability away; we should accept it as the cost of being agents who act in reality rather than in a vacuum. The killer is more blameworthy because she has more to answer for.
