      *   **Core Task:** Argue *against* the "epistemic dissolution" of resultant moral luck. (i.e., Argue *for* the reality of resultant moral luck).
      *   **Specific Claim to Defend:** The driver who kills is *genuinely more blameworthy* than the identical driver who doesn't, even when antecedent conditions and epistemic access are held fixed.
      *   **Required Engagement:** Must address three specific counter-moves/objections:
          1.  Zimmerman-style view (Luck affects wrongness, but blameworthiness tracks the will/antecedents).
          2.  Williams's "agent-regret" as non-moral sentiment (not evidence of moral difference).
          3.  The objection that full epistemic parity is an idealization that reintroduces asymmetry.
      *   **Tone/Style:** Philosophical argument, clear verdict, not an even-handed survey.
      *   **Context:** The user is a former juror bothered by the discrepancy between a convicted defendant and a friend of a juror who got off lucky. They are familiar with Williams, Nagel, Andre, Richards.

  2.  **Deconstruct the "Epistemic Dissolution" View:**
      *   *The View:* We only blame the killer more because the death proves their recklessness. If we *know* both were equally reckless, they are equally blameworthy. The legal/moral difference is just about evidence or consequences, not deep culpability.
      *   *My Task:* Show this is wrong. The consequence (death) changes the moral landscape of the agent's culpability, not just our knowledge of it.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Acknowledge the user's experience (it's a classic intuition pump).
          *   State the thesis: Resultant luck is real and affects blameworthiness, not just wrongness or evidence. The epistemic account fails because it ignores the constitutive role of consequences in the moral nature of the act.
          *   Roadmap: Address the three specific objections.

      *   **Argument Point 1: The Constitution of the Act (Against Zimmerman):**
          *   *Zimmerman's Move:* Blameworthiness is about the quality of the will/antecedent choice. Consequences affect the *wrongness* (objective) but not the *blame* (subjective).
          *   *Counter-Argument:* This creates an artificial split. An action isn't just a mental volition; it's a transaction with the world. Killing someone *is* a different moral reality than nearly killing someone.
          *   *Key Concept:* The "moral residue." The killer has a debt to the victim and the community that the lucky driver does not. This debt constitutes a form of blameworthiness (or at least culpable burden) that goes beyond the initial choice.
          *   *Refinement:* Focus on the *completion* of the risk. The reckless will is the same, but the *realization* of that will in the world alters the agent's moral standing.

      *   **Argument Point 2: Agent-Regret as Moral Insight (Against the Non-Moral Sentiment View):**
          *   *The Move:* Williams's "agent-regret" is just a psychological feeling, not a judgment of objective moral status. It's tragic, not moral.
          *   *Counter-Argument:* Agent-regret is a *fitting* response to moral reality. If it were merely psychological, we could therapize it away. But we think the killer *ought* to feel it more.
          *   *Key Concept:* The fittingness of the emotion tracks the moral truth. The killer has done something that demands a specific kind of acknowledgment (guilt/atonement) that the lucky driver does not. This suggests a moral difference, not just a psychological one.

      *   **Argument Point 3: The Epistemic Parity Stipulation (Against the Idealization Objection):**
          *   *The Move:* You can't actually stipulate epistemic parity. If one killed and one didn't, there *must* be a microscopic difference in attention or control, so the epistemic account wins because the asymmetry is real.
          *   *Counter-Argument:* This begs the question. It assumes control is the only metric. We must accept the thought experiment as given (quantum luck, chaotic systems).
          *   *Key Concept:* Even if we grant the stipulation, the *outcome* still matters. If we accept the stipulation (they are truly identical in control), the epistemic view says blame is equal. But our intuition (and legal practice) says blame is unequal. The epistemic view collapses because it relies on a hidden variable (the outcome *is* the evidence) rather than the outcome *being* the moral difference. If we remove the evidence value (by stipulation), the epistemic view says "no difference," but the moral reality remains "difference."

      *   **Synthesis/Conclusion:**
          *   Reiterate the verdict.
          *   Why this matters for the juror: The law isn't just punishing luck; it's responding to the moral reality of harm done.
          *   Final punch: The epistemic view tries to sanitize morality of the world's messiness. But morality is embedded in the world.

  4.  **Refining the Arguments (Self-Correction during drafting):**
