answer: |-
  This does not sound weird at all. In fact, it sounds like you have stumbled onto a profound philosophical and psychological insight that most people spend years in therapy trying to articulate.

  The short answer to your question is: **The advice isn't necessarily "bad," but it is culturally mismatched to your operating system.**

  Here is a breakdown of why you feel empty when you try to strip away your roles, why that might actually be okay, and how to make this decision without needing to find a "ghost self" that doesn't exist.

  ### 1. The Myth of the "Atomic Self"
  The advice you are getting ("figure out what *you* want") comes from a Western, individualistic framework. In that worldview, the "self" is like a kernel of corn inside a husk. The husk is your family, your job, your culture. The advice assumes that if you peel away the husk, you will find a solid, distinct kernel of preferences and desires that belongs only to you.

  For many people in collectivist cultures (including many traditional Chinese families), the self is not a kernel; **the self is the web.**

  In this framework, you are not a node separate from the connections; you *are* the connections. You are a son/daughter, a grandchild, a family member. When you try to subtract those roles, you aren't finding a hidden "true self"; you are subtracting the very architecture that holds your identity together. Of course there is "nothing there." You are trying to find a "north" on a map that uses a different coordinate system.

  So, to answer your specific question: **There may not be a neutral "you" in there.** And that doesn't mean you are broken or suppressed. It means your identity is *interdependent* rather than *independent.*

  ### 2. Interdependence vs. Enmeshment
  However, we need to make a crucial distinction. There is a healthy version of this, and an unhealthy version.

  *   **Healthy Interdependence:** You value your family's well-being as part of your own. Their joy is your joy; their suffering is your suffering. You choose to care for them because *you* value that connection, not because you are terrified of their disapproval.
  *   **Enmeshment/Suppression:** You have no idea what you feel because you have been trained to scan the room for what *others* feel and mirror that. You don't stay because you value the duty; you stay because the idea of disappointing them induces panic or shame.

  You mentioned that you butt heads with your parents and they change their minds. This suggests **Healthy Interdependence.** It means you have a voice in the system. You aren't a robot; you are a negotiator within a collective.

  ### 3. How to Decide Without a "Neutral Self"
  If you can't consult a "neutral you," how do you make this choice? You stop trying to separate "what I want" from "what they want." Instead, you ask questions that honor your relational identity.

  **A. The Resentment Test**
  Since your happiness is tied to your family, ask yourself: *In which scenario will I become more resentful?*
  *   **Scenario A (Move Home):** You stay. You help Grandma. But over three years, do you start silently blaming your parents for "holding you back"? Does that bitterness poison the care you give your grandma?
  *   **Scenario B (Take Job):** You leave. You succeed. But do you feel a gnawing guilt that makes your success feel hollow? Do you dread every phone call home?

  In a relational self, resentment is the toxin. You need to pick the path where you can sustain the relationship without poisoning it.

  **B. The Capacity Check**
  Instead of "Do I want this?", ask "Can I sustain this?"
  Taking the job might be "selfish" in an individualist frame, but if moving home would cause you to burn out, lose your financial stability, or depress you to the point where you are useless to the family, then moving home is actually *bad for the collective.*
  Sometimes, the best way to be a "good child" is to ensure you remain a functional, thriving adult.

  **C. The "Third Option" (Negotiation)**
  You said your parents change their minds when you butt heads. This is your leverage. The choice isn't binary (Move Home vs. Abandon Family).
  *   Can you take the job but hire a part-time caregiver for Grandma with your salary?
  *   Can you move back but set a hard timeline (e.g., "I will come for 1 year, then I re-evaluate")?
  *   Can you move to the new city but commit to visiting every 3 weeks?

  In a traditional family, duty is often about *outcome* (Grandma is cared for), not just *presence* (I am physically in the house). If you can secure the outcome through other means, you might satisfy the duty without sacrificing the career.

  ### 4. Is there *any* value in looking for the "Neutral You"?
  Yes, but with a caveat.
  Even in a collectivist framework, you are the vessel through which the care is delivered. If the vessel cracks, the water spills.

  You don't need to find a "self" that exists in a vacuum. But you do need to know your **limits.**
  *   What drains you?
  *   What gives you energy?
  *   What kind of life can you lead without collapsing?

  If you take the job, you aren't "being selfish." You are maintaining the asset (you) that the family relies on. If you move home, you aren't "sacrificing yourself." You are investing in the family equity that you value.

  ### Summary
  The advice you're getting assumes you are an individual who happens to have a family. You are experiencing yourself as a family member who happens to be an individual.

  **Don't try to find a self that doesn't exist.** Instead, look at the web of relationships you are part of.
  1.  Acknowledge that your family's well-being *is* part of your want.
  2.  Check for resentment (the enemy of duty).
  3.  Negotiate a solution that honors the duty (Grandma's care) without breaking the vessel (your career/mental health).

  You are not failing to find yourself. You are just trying to use a Western map to navigate an Eastern terrain. Put the map away and look at the actual landscape in front of you.
