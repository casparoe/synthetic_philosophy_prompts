      *   *Section 3: Reframing the Question.* Instead of "What do I want vs. What do they want?", ask "What kind of son/daughter/person do I want to be?" or "Where can I sustain myself?"
      *   *Section 4: Practical Decision Making.* How to choose without finding a "ghost self." Look at resentment, capacity, and negotiation.
      *   *Closing:* Reassure that both paths are valid, but the *reasoning* needs to match their reality.

