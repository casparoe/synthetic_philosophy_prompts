prompt: |-
  Ok this is going to sound weird but hear me out. My parents want me to move back home to help out with my grandma and be around more (we're a pretty traditional Chinese family) and I just got offered a genuinely great job in another city. Everyone keeps telling me some version of "you need to figure out what YOU want, seperate from what your parents want," but when I actually try to do that — like picture "me" minus the roles, not someone's kid, not someone's future whatever — theres nothing there to consult. It's not like I'm suppressing some private set of preferences to keep my parents happy, its more like I don't think there's a "me" underneath all that in the first place. And it's not like I just do whatever they say either, we butt heads all the time and they actually do change their minds sometimes. So is everyone's advice just bad advice for someone in my situation, or is there actually some neutral "you" in there that I'm just failing to find?
reasoning: |-
