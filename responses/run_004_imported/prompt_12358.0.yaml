      *   *Locke's Theory:* Primary Qualities (Solidity, Extension, Figure, Motion/Rest, Number) are real resemblances. They exist in objects. Both Sight and Touch perceive Extension/Figure.
      *   *The Tension:* If Figure is a Primary Quality perceived by both, why can't the blind man recognize it immediately? If "Cube-ness" is the same idea, shouldn't it trigger recognition?
