  8.  *(Self-Correction on "Right of Way"):* Actually, standard right-of-way (drive on right) is Lewisian coordination. But *who yields* at a 4-way stop or merging lane can be a bargaining problem if there's asymmetry. I should clarify that distinction. The friend mentioned "who yields," implying asymmetry.

  9.  *(Final check on U-M's stance):* U-M explicitly argues that norms can emerge from PD and Bargaining games *via* mechanisms that make them look like coordination problems (e.g., sanctions change the payoff structure). This is crucial. She argues norms *transform* the game. I need to mention this mechanism.

