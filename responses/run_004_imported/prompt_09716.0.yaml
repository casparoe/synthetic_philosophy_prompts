answer: |-
  This is a fantastic debate, and honestly, it's one of the classic fault lines in social ontology and the philosophy of social science. You both have strong points, but you're talking past each other slightly because you're focusing on different layers of the theory: **definition** vs. **function**.

  Here is the settlement: **Your friend is right about Lewis's definitions, but you are right about Ullmann-Margalit's project.** However, the conclusion isn't that Ullmann-Margalit just "patched" Lewis; she exposed a genuine **scope limitation** in his account that requires a fundamental shift in how we understand the stability of norms.

  Here is the breakdown of why the argument happened, where the philosophical bodies are buried, and who actually "won."

  ---

  ### 1. Lewis's Account: The "Indifference" Constraint
  David Lewis's *Convention* (1969) is a masterpiece, but it is extremely specific. He is trying to solve Hume's problem of how we agree on things without explicit promises.

  *   **The Game:** Pure Coordination Games (e.g., driving on the left vs. right, phone call drop-outs).
  *   **The Equilibrium:** Everyone prefers to match whatever everyone else is doing.
  *   **The Crucial Condition:** **Indifference between Equilibria.** Before the convention is established, agents don't care *which* equilibrium we pick, only *that* we pick one. I don't intrinsically prefer driving on the left; I only prefer it once I know you're doing it.

  **Where your friend is right:**
  Lewis's definition strictly excludes situations where agents have **conflicting preferences over the equilibria themselves.**
  *   **Property/Division:** I want the big plot; you want the big plot. We both prefer *an* agreement to fighting, but we prefer *different* agreements.
  *   **Asymmetric Right of Way:** If the rule is "cars yield to trucks," truck drivers prefer this equilibrium; car drivers prefer the reverse.

  In Lewis's strict sense, these are **not conventions**. They are **bargaining solutions**. If you try to force these into Lewis's definition, you break the "indifference" condition. So, your friend is technically correct: Lewis's *specific definition of convention* cannot explain norms born of conflict.

  ### 2. Ullmann-Margalit's Typology: The Generalization
  Edna Ullmann-Margalit (*The Emergence of Norms*, 1977) comes in and says, "Lewis is great, but social life isn't just coordination." She keeps the game-theoretic machinery (expectations, common knowledge, equilibria) but expands the types of games involved.

  She proposes three types of norms:
  1.  **Coordination Norms:** (Lewisian) Everyone wins if we match.
  2.  **Prisoner's Dilemma (PD) Norms:** Norms that solve free-rider problems (e.g., queuing, not littering). Here, defection is individually rational unless the norm (and sanctions) changes the payoff.
  3.  **Bargaining Norms:** (The friend's example) Norms that settle conflicts of interest (e.g., property rights, priority rules).

  **Where you are right:**
  Ullmann-Margalit explicitly frames her work as building on Lewis's **methodology**, not rejecting it. She uses the same logic of *expectations* and *common knowledge* to explain how these norms stabilize. She argues that once a bargaining solution is found (even if unfair), it becomes self-perpetuating because the cost of disrupting the equilibrium is higher than the cost of accepting the inferior share. In this sense, it is "Lewis-compatible" because it relies on the same stability mechanisms (expectations of conformity).

  ### 3. The Verdict: Extension or Gap?
  Here is the nuance that settles the bet. Ullmann-Margalit is not just adding a patch; she is highlighting that Lewis conflated **Convention** with **Norm**.

  *   **Lewis** was defining *Convention*. He admitted his theory didn't cover moral norms or laws derived from conflict.
  *   **Ullmann-Margalit** was defining *Norms*. She argues that norms *function* like conventions even in conflict settings because they create a **second-order coordination problem**: "We may disagree on the rule, but we all agree that *having a rule* is better than chaos, and we all know that challenging the rule is costly."

  **Is it a genuine extension?**
  Yes. She shows that the *logic of common knowledge* applies beyond coordination games.

  **Does it expose a gap?**
  Yes. It exposes that Lewis's account is insufficient for a general theory of social order. If you try to explain property rights using *only* Lewis's coordination model, you fail. You need to explain how a specific equilibrium was selected among conflicting interests (often via power, history, or focal points) and then *maintained* via the expectation of sanctions (which turns it into a coordination problem about whether to enforce the norm).

  ### 4. Who Won the Argument?
  You need to split the decision.

  **Point to your Friend:**
  She is correct that Lewis's **original definition** cannot handle norms arising from conflict of interest without breaking its own rules. If you insist on calling property division a "Lewisian Convention," you are misusing Lewis's term. Lewis requires indifference between equilibria; bargaining norms require preference for specific equilibria. That is a structural incompatibility, not just a semantic quibble.

  **Point to You:**
  You are correct that Ullmann-Margalit is **not a rival account** but a **generalization**. She doesn't throw Lewis in the trash; she subsumes his coordination norms as one subset of a larger category of "Norms." She shows that the *mechanism* of convention (common knowledge + expectations) is the glue that holds even conflict-based norms together *after* they are established.

  ### The "Settled Science" Conclusion
  If you want to end the argument with authority, tell her this:

  > "Lewis defined **Conventions** as solutions to Coordination Problems. You are right that Property and Priority are **Bargaining Problems**, so they aren't 'Conventions' in Lewis's strict sense. However, Ullmann-Margalit showed that once a Bargaining solution is reached, it *transforms* into a Coordination Problem regarding compliance. We coordinate on *enforcing* the norm even if we didn't coordinate on *choosing* it. So, Lewis explains the stability, U-M explains the emergence. Your objection holds for the *origin* of the norm, but my point holds for the *maintenance* of the norm."

  **Winner:** **Draw.**
  *   **Friend:** Wins on the *origin* of norms (Lewis can't explain how we pick the equilibrium in conflict scenarios).
  *   **You:** Win on the *sustainability* of norms (U-M shows Lewis's logic explains why we stick to them once picked).

  **Recommendation:** Buy her a drink and agree that **Cristina Bicchieri** (who came later) is the next person you should argue about, because she tries to merge these views by focusing on *empirical expectations* vs. *normative expectations*. That'll keep you busy for another 45 minutes.
