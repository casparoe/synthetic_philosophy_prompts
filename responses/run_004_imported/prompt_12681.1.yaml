answer: |-
  This is not merely a game-night curiosity; it is a precise, real-world instantiation of one of the most profound problems in the philosophy of language, law, and social ontology. You have stumbled into what is known as the **rule-following paradox**, most famously articulated by Ludwig Wittgenstein and later expanded by Saul Kripke, while simultaneously touching on debates in legal theory regarding "hard cases" and the "open texture" of law.

  Your friend's intuition—that there *must* be a fact of the matter about what rule you were following—is a deeply held philosophical position known as **semantic realism**. It posits that meanings and rules are entities that exist independently of our ability to verify them, waiting to be discovered.

  However, the situation you describe provides strong evidence for the opposing view: **semantic anti-realism** or **constructivism**. Here is a breakdown of why this disagreement occurred, whether there is a "fact of the matter," and what happens when you vote.

  ### 1. The Underdetermination of Past Practice
  You noted that "every previous game night was perfectly consistent with their own reading." This is the crux of the issue. In philosophy, this is the problem of **induction applied to norms**.

  If a rule is defined entirely by how it has been applied in the past, and two conflicting interpretations (Rule A: *Bonus stands*; Rule B: *Hand voided*) are both perfectly consistent with all past applications, then the past behavior does not contain enough information to determine which rule is the "true" one.

  Kripke's skeptical argument suggests that there is no internal mental state, no "grasping" of the rule in your minds ten years ago, that could settle this. You did not have a specific thought about "misdeals coinciding with zero bids" because the situation never arose. Therefore, there is no psychological fact from the past that can be unearthed to solve the dispute. The history of play **underdetermines** the rule.

  ### 2. The "Open Texture" of Social Rules
  In legal theory, H.L.A. Hart described the "open texture" of law: language and rules inevitably have a core of certainty (e.g., "no vehicles in the park" clearly bans cars) and a penumbra of doubt (e.g., does it ban bicycles? ambulances?).

  For a decade, your group operated in the core. The rules functioned smoothly because the "penumbra" was never tested. When the edge case arrived, you discovered that the rule was not a pre-existing object you were all tracking, but a **social practice** that required continuous maintenance.

  Your friend insists you have been playing "the same game." This is an appeal to **narrative identity**. He wants the game to have an essence that transcends specific instances. But if the essence of the game includes its scoring conventions, and the scoring conventions are now ambiguous, then strictly speaking, the "game" as a normative system has fractured. There is no longer one game; there are two variants, and the group must choose which one to inhabit going forward.

  ### 3. Is There a Fact of the Matter?
  To answer your central question: **No, there is likely no metaphysical fact of the matter about which rule you were "actually" following.**

  If the rule exists only in the shared understanding of the players, and that understanding is now revealed to be non-identical (half think X, half think Y), then the "shared understanding" was an illusion. It was a **latent divergence**.

  To claim one side is objectively right requires positing a "Platonic" version of your card game that exists somewhere outside of human practice, which the players were trying to approximate. But home-grown games do not have Platonic forms. They are constituted entirely by the agreement of the players. If the agreement was never tested on this point, the rule *did not exist* for this specific scenario. It was a gap in the normative fabric of your group.

  ### 4. Is There a Principled Basis for "Rightness"?
  If there is no historical fact, is there a **functional** or **teleological** fact? This is where you might find a principled basis for argument, though not an objective "truth."

  You can ask: *What is the purpose of these rules?*
  *   **The Purpose of the Misdeal Rule:** Usually, this is to ensure fairness and procedural integrity. It says, "The conditions of this hand were flawed, so the outcomes are invalid."
  *   **The Purpose of the Zero-Bid Bonus:** This is usually a risk-reward mechanism to encourage strategic diversity and excitement.

  If the group values **procedural integrity** above all, Rule B (void the hand) wins. The logic is: *A bonus derived from a flawed hand is tainted.*
  If the group values **strategic recognition** above all, Rule A (pay the bonus) wins. The logic is: *The player achieved the difficult feat regardless of the dealer's error; punishing them for a mistake they didn't make is unfair.*

  Neither is "objectively" correct. They are competing values. However, if your group has historically prioritized "house rules" that favor excitement over strict procedure (or vice versa), you could argue that one interpretation is more **coherent** with the spirit of your specific tradition. This is similar to Ronald Dworkin's theory of "law as integrity," where the right answer is the one that best fits and justifies the existing history of practice.

  ### 5. The Vote: Discovery or Creation?
  You asked if taking a vote settles "retroactively, what the rule was all along."

  **It does not settle what the rule *was*; it establishes what the rule *is*.**

  However, social groups almost always engage in a **fiction of retroactivity**. When you vote, you are engaging in a constitutive act. You are creating a new norm. But to maintain the cohesion of the group and the continuity of the "decade-long tradition," you will likely narrate the vote as a "clarification" of the original intent.

  This is not dishonest; it is socially necessary. It preserves the identity of the group. If you admit, "We are making a new rule," it implies the old game is dead. If you say, "We are clarifying the rule," it implies the game survives.

  ### Conclusion
  Your friend is experiencing a form of **normative nostalgia**. He feels that the stability of the past decade guarantees the determinacy of the rules. But the stability was contingent on the absence of conflict.

  There is no fact of the matter about what the rule *was*, because the rule was a social construct that failed to specify this condition. The "truth" of the rule is not something you find in the past; it is something you build for the future.

  If you cannot converge on an answer after hours of arguing, that is itself proof that there is no shared norm to uncover. At that point, the only "objective" reality is the power dynamic of the group. Taking a vote is the only principled way forward, not because it reveals the truth, but because **in social ontology, agreement *creates* truth.**

  You are not judges discovering a law; you are legislators writing one. The moment you accept that, the argument stops being about who is "right" about the past and starts being about what kind of game you want to play in the future.
