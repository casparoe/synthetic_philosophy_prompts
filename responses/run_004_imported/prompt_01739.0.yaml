          *   *2. Convert Competition to Consortium:* The only way to win a Dollar Auction is not to play, or to collude. Science policy should encourage pre-competitive collaboration to avoid the bidding war phase. (e.g., merging SSC and LHC efforts? Hard politically, but theoretically sound).
          *   *3. The "Audience" Effect:* Dollar Auctions often happen because of an audience (prestige). Funding agencies need to de-emphasize "winning" the race and emphasize "solving" the problem.
