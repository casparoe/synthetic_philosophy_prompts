      *   **Sunk Cost/Escalation of Commitment (Staw):** Single decision-maker (or unified group). Continuing a failing course because of past investment. Key driver: *Self-justification, cognitive dissonance, organizational inertia*.
      *   **The SSC Analogy:** Was it a Dollar Auction?
          *   *Argument for Yes:* International competition (US vs. CERN/LHC), multiple stakeholders (Congress, DOE, Labs, Contractors), "If we quit, the Europeans win."
          *   *Argument for No:* Ultimately, it was the US Congress pulling the plug. It wasn't a direct bidding war against CERN in the game-theoretic sense (CERN didn't have to pay the US's losses). It was more internal escalation.
      *   **The User's Insight:** Multinational collaborations (like ITER or LHC itself) might fit the Dollar Auction better than single-nation projects. If Country A quits, they lose their investment, and Country B gets the science. If both stay, costs escalate.

  3.  **Evaluate the "Distinctiveness" of the Dollar Auction:**
      *   Is it *just* sunk cost? No. Sunk cost is psychological/internal. Dollar Auction is *strategic/external*.
      *   In a Dollar Auction, the rational move (in a one-shot game) is not to bid. But once bidding starts, the Nash Equilibrium involves escalation.
      *   The critical difference is the *penalty on the loser*. In sunk cost, you lose your investment. In Dollar Auction, you lose your investment *and* the winner gets the prize (which might include prestige, patents, scientific priority).
      *   *Implication:* The fear isn't just "wasting money," it's "wasting money *and* losing status to a rival."

