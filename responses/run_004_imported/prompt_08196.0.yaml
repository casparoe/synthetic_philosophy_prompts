answer: |-
  You have spotted one of the most important lineage markers in the history of moral philosophy. Your reading of the grammar is correct, and your suspicion that this is the engine of the Repugnant Conclusion is also correct. However, the relationship between Sidgwick and Parfit is more nuanced than simple identity. Sidgwick provides the *axiom* that generates the conclusion; Parfit provides the *name* and the *intuitive shock* of where that axiom leads.

  Here is a walkthrough of the sentence, the logic it licenses, and Sidgwick's attitude toward it.

  ### 1. Walking Through the Sentence

  Let's break down Sidgwick's claim into its mathematical and normative components.

  > "...the point up to which, on Utilitarian principles, population ought to be encouraged to increase, is not that at which the average happiness is the greatest possible..."

  **The Rejection:** Sidgwick is explicitly rejecting **Average Utilitarianism**.
  Many earlier Utilitarians (and many people today intuitively) think the goal of ethics is to make the *average* person as happy as possible. If you have 10 people with 10 units of happiness each (Average = 10), that is better than 20 people with 9 units each (Average = 9). Sidgwick says: No. On strict Utilitarian principles, that is wrong.

  > "...but that at which the produce formed by multiplying the number of persons living into the amount of average happiness reaches its maximum."

  **The Endorsement:** Sidgwick is explicitly endorsing **Total Utilitarianism**.
  He uses the word "produce," which in 19th-century mathematical English means "product" (the result of multiplication).
  *   **Formula:** $\text{Total Good} = (\text{Number of People}) \times (\text{Average Happiness})$
  *   **The Goal:** Maximize the **Total Good**, not the Average.

  **The Licensing:**
  You asked: *Is he saying we should keep adding people even as average happiness falls?*
  **Yes.** As long as the new person has a life that is "worth living" (positive happiness), adding them increases the Total, even if their happiness is lower than the current average.

  *   *Scenario A:* 1 billion people, 100 happiness units each. (Total = 100 billion)
  *   *Scenario B:* 10 billion people, 20 happiness units each. (Total = 200 billion)

  Under Sidgwick's rule, Scenario B is morally superior, even though the average person is much less happy. This is precisely the mathematical structure that leads to the Repugnant Conclusion.

  ### 2. Is There a "Narrower Claim" Being Flattened?

  This is where your intuition to look for nuance is very sharp. Later summaries often treat Sidgwick as a pure "Total View" absolutist, but there are two contextual factors in Sidgwick that sometimes get flattened out:

  **A. The Malthusian Constraint**
  Sidgwick was writing in the shadow of Thomas Malthus. When Sidgwick talks about increasing population, he is not imagining abstract possible worlds (as Parfit does). He is thinking about Earth, resources, and food.
  Sidgwick acknowledges that in the real world, increasing population *inevitably* diminishes average happiness eventually due to resource scarcity. He isn't necessarily advocating for infinite breeding; he is defining the **theoretical limit**. He is saying: "We should keep adding people *until* the marginal addition causes the Total to drop." In a resource-constrained world, that limit might be reached long before lives become "barely worth living." Parfit's thought experiment removes the resource constraint to test the logic; Sidgwick kept the constraint in mind to guide policy.

  **B. The Definition of "Happiness"**
  Sidgwick assumes a threshold. He implies that we are only counting lives that are net positive ("happiness"). He is not licensing the creation of miserable lives. However, he does license the creation of lives that are *less* happy than the previous generation, provided they are still positive.
  The "flattening" occurs when modern readers assume Sidgwick was enthusiastic about a world of "barely worth living" people. He wasn't enthusiastic; he just believed that if a life is worth living, its existence is a net good, and more net good is better.

  ### 3. Was Sidgwick Troubled by This?

  This is the crux of your historical question. Did Sidgwick stare into the abyss of the Repugnant Conclusion and blink?

  **The Short Answer:** No, he did not blink, but he also didn't call it "repugnant."

  **The Nuanced Answer:**
  Sidgwick is famous for being the most intellectually honest and anxious of the Classical Utilitarians. In *The Methods of Ethics*, he is constantly worried about the coherence of Utilitarianism (eventually concluding in the famous "Dualism of Practical Reason" that Utilitarianism and Rational Egoism cannot be fully reconciled).

  However, regarding population specifically, Sidgwick treats this conclusion as a **necessary correction of vagueness** in previous Utilitarian thought.
  *   **Bentham and Mill** were often ambiguous. They spoke of the "Greatest Happiness," but often wrote as if they meant the happiness of existing people.
  *   **Sidgwick's Move:** He realized that if "Good" is a sum of happiness, then potential people count. To exclude them would be arbitrary.

  In the surrounding text of that chapter, Sidgwick acknowledges that this view conflicts with "common sense." He knows it sounds strange to say a world of 10 billion moderately happy people is better than 1 billion ecstatic people. But he argues that **Utilitarianism is not Common Sense Morality.** He is trying to systematize Utilitarianism, not make it palatable.

  He writes elsewhere in the same chapter:
  > "If we are to adopt the Utilitarian standard, we must... admit that the happiness of a single individual is of no more intrinsic value than the happiness of any other."

  He extends this logic to numbers: The total sum is what matters. He does not express horror at this. He expresses a kind of sober resignation. He recognizes that if we take the "Greatest Happiness" principle literally, this is where it leads. He prefers the hard truth to a comfortable inconsistency.

  ### 4. Placing Sidgwick in the History of the Repugnant Conclusion

  To place this honestly in history, we have to distinguish between the **Logic** and the **Label**.

  1.  **Sidgwick (1874): The Logical Formulation.**
      Sidgwick is the one who rigorously defined the **Total View**. Before him, Utilitarians waffled between Average and Total. Sidgwick cleared the fog. He established that $Total = N \times Avg$. He didn't call it the Repugnant Conclusion because, to him, it was just the "Correct Utilitarian Conclusion." He didn't dwell on the *intuitive cost* because he prioritized logical consistency over intuition.

  2.  **Parfit (1984): The Intuitive Cost.**
      Parfit did not discover the math; he discovered the **implication**. In *Reasons and Persons*, Parfit accepts Sidgwick's math but asks us to visualize the endpoint. He constructs "World A" (very happy, small population) and "World Z" (barely worth living, massive population).
      Parfit's contribution was saying: *"Wait, if we accept Sidgwick's rule, we are forced to say Z is better than A. That feels wrong. Therefore, either our intuition is wrong, or Sidgwick's rule (Total Utilitarianism) is wrong."*

  **The Historical Verdict:**
  Sidgwick is the **architect** of the Repugnant Conclusion. Parfit is the **critic** who named it.

  When you read Sidgwick, you are seeing the moment Classical Utilitarianism grew up and accepted its most demanding implication. He isn't troubled by the *conclusion* itself; he is troubled by the fact that it makes Utilitarianism so demanding that it might be impossible to practice perfectly. But he refuses to fudge the math to make it easier.

  ### Summary for Your Understanding

  *   **Your reading of the sentence:** Correct. Sidgwick is licensing the addition of people even if average happiness drops, provided Total Happiness rises.
  *   **Is it the Repugnant Conclusion?** It is the **axiom** that generates the Repugnant Conclusion. Sidgwick states the rule; Parfit illustrates the extreme consequence of that rule.
  *   **Was Sidgwick troubled?** He was troubled by the *difficulty* of Utilitarianism generally, but he did not reject this specific implication. He viewed it as a logical necessity of the "Greatest Happiness" principle, even if it contradicted the intuitions of earlier Utilitarians.
  *   **Historical Placement:** Sidgwick formalized the **Total View** of population ethics. Parfit, a century later, showed that the Total View leads to counter-intuitive results (the Repugnant Conclusion), sparking the modern debate on whether we should switch to the Average View, Critical Level View, or something else.

  You have found the source code. Parfit wrote the user manual that explained why that code might crash the system.
