answer: |-
  This is an exceptionally precise framing of the central tension in Kuhn scholarship. For a graduate seminar, you need to navigate between the *philosophical* stakes (semantics, reference, rationality) and the *historiographical* stakes (how historians actually write).

  Here is an analysis of Kuhn's "lexical turn," designed to help you structure the dialectic for your seminar.

  ### 1. The Maneuver: From "World-Change" to "Lexical Restructuring"

  To understand how Kuhn secures untranslatability without sacrificing comparability, you must distinguish his early *Structure* rhetoric (1962/1970) from his later semantic theory (1980s–1990s, culminating in *The Road Since Structure*).

  **The Early Problem:**
  In *Structure*, Kuhn often spoke of proponents of different paradigms "practicing their trades in different worlds" and undergoing "gestalt switches." This invited the charge of irrationalism: if scientists see different worlds, they cannot argue rationally, and historians cannot compare them without imposing an anachronistic framework. This is the target of Davidson's famous critique in "On the Very Idea of a Conceptual Scheme" (1974), which argues that the notion of alternative conceptual schemes is unintelligible because interpretation requires a background of shared belief.

  **The Later Solution: The Lexicon:**
  In his later work, Kuhn retreats from ontology ("different worlds") to semantics ("different vocabularies"). He posits that scientific communities share a **lexicon**: a structured taxonomy of kind terms (e.g., *planet, star, element, compound, mass, force*).

  *   **The No-Overlap Principle:** Within a functioning lexicon, no two kind terms at the same level of the taxonomy may share referents. (Nothing can be both a *planet* and a *star*; nothing can be both an *element* and a *compound*.)
  *   **Incommensurability as Taxonomic Incompatibility:** A scientific revolution occurs when the taxonomy is restructured. For example, in the Copernican revolution, the Sun moves from the kind *planet* (wanderer) to the kind *star*. In the Einsteinian revolution, *mass* is no longer a subset of *invariant quantities*.
  *   **Untranslatability:** Because the terms are defined by their place in the taxonomy, and the taxonomies differ, there is no term-for-term translation. You cannot translate the Newtonian *mass* into the Einsteinian *mass* without distortion, because the network of relationships defining the term has changed.

  ### 2. Securing Comparability: The Bilingual Historian

  This is the crux of your seminar's first question: *How does this allow historians to work?*

  Kuhn distinguishes between **translation** and **interpretation**.
  *   **Translation** requires finding a synonym in Language B for a term in Language A. Kuhn argues this is impossible across paradigms because the synonym would carry the wrong taxonomic commitments.
  *   **Interpretation** requires learning the rules of use for the terms in Language A while retaining one's own Language B.

  **The Historiographical Payoff:**
  The historian becomes **bilingual**. They do not need a neutral language to compare Theory A and Theory B. They can hold both lexicons in mind and describe the structural differences.
  *   *Example:* A historian can say, "In the Ptolemaic lexicon, the Sun falls under the kind *planet*; in the Copernican lexicon, it falls under the kind *star*."
  *   *Comparability:* The comparability lies in the **shared logical and observational language surrounding the lexicon**. Historians and scientists share standard logic, mathematics, and most observation reports (e.g., "the pointer reads 5"). The incommensurability is *local* to the specific kind terms undergoing restructuring.

  Therefore, the historian can explain why scientists switched allegiance (e.g., "The new taxonomy solved the anomaly regarding retrograde motion more simply") without needing to claim that the old terms *meant* the same thing as the new ones. The comparison is not of *meanings* (which are incommensurable) but of *problem-solving effectiveness* (which is comparable).

  ### 3. Assessing the Davidson-Style Objection

  Does this maneuver meet Davidson's objection, or does it merely redraw the boundary?

  **Davidson's Challenge:**
  Davidson argues that the "dualism of scheme and content" is the third dogma of empiricism. He claims that if we can interpret a speaker at all, we must assume a massive background of shared true beliefs. If the conceptual scheme differs, we cannot identify the beliefs. Therefore, "total" incommensurability is incoherent.

  **Kuhn's Defense:**
  Kuhn explicitly accepted Davidson's critique of the *scheme/content* dualism. He argued he never meant that scientists inhabit different *worlds* (content) or have different *logics* (scheme). He meant they use different *classificatory vocabularies*. By localizing incommensurability to the lexicon, Kuhn attempts to preserve the "background of shared belief" Davidson requires.

  **Assessment: Does the Objection Resurface?**
  While Kuhn's lexical turn is philosophically more robust than his early gestalt talk, significant vulnerabilities remain for a graduate seminar to dissect.

  **A. The "Bleed" Problem (Where the boundary is drawn)**
  Davidson's objection resurfaces if the "local" lexicon is too central to the theory to be isolated.
  *   *Critique:* If *mass* and *force* are lexicon terms, and they determine what counts as an object and how it behaves, does changing them change the "shared observation language"?
  *   *Example:* If a Newtonian says "Mass is conserved" and an Einsteinian says "Mass is not conserved (mass-energy is)," do they disagree?
      *   If **yes** (they disagree), they must be talking about the same thing (shared reference), which undermines incommensurability.
      *   If **no** (they talk past each other), then there is no rational progress, just change. This undermines the historian's ability to explain the switch as *rational*.
  *   *Verdict:* Kuhn bites the bullet: they talk past each other. Progress is not "truth-likeness" but "specialization and problem-solving." For a seminar, ask: *Is this a satisfying account of scientific progress, or does it surrender too much to relativism?*

  **B. The Reference Problem (Causal vs. Descriptive)**
  Kuhn's lexicon relies on a descriptive theory of reference (terms refer via their place in the taxonomy). Critics like **Sankey** and **Putnam** argue for a causal-historical theory of reference.
  *   *Critique:* If reference is determined causally (by the actual stuff in the world), then Newton and Einstein *were* talking about the same stuff (mass), even if their descriptions differed.
  *   *Implication:* If they were talking about the same stuff, translation is possible (via the referent), and Davidson is vindicated: there is a common measure.
  *   *Kuhn's Counter:* Kuhn rejects causal reference because it assumes access to the "world as it is" independent of the lexicon. He insists we only access the world *through* the lexicon.
  *   *Verdict:* This is the metaphysical stalemate. Kuhn's maneuver works *if* you accept his Kantian-ish view that we cannot step outside the lexicon to check reference. If you reject that, the Davidsonian objection wins: the "local" incommensurability collapses because the shared world anchors the terms.

  **C. The Historiographical Consequence**
  For your seminar, the most practical assessment is historiographical.
  *   *Success:* Kuhn's later view validates the historian's practice of "bilingualism." It explains why historians must be careful not to anachronistically map modern terms onto past texts (e.g., assuming Aristotle's *force* is Newton's *force*).
  *   *Failure:* It makes rational reconstruction difficult. If the terms are untranslatable, how do we explain the *continuity* of science? Why do we still teach Newton? Kuhn says we teach Newton as a special case of Einstein. But if the lexicons are incommensurable, how can one be a special case of the other without a translation manual? Kuhn struggles here, often relying on mathematical formalism (which he admits is often shared) to bridge the lexical gap.

  ### 4. Seminar Discussion Points

  To drive this dialectic home in your seminar, consider posing these three questions:

  1.  **The Limit of Locality:** Is the lexicon truly "local"? If the terms *mass*, *energy*, and *time* are restructured (Relativity), does that not alter the observation language itself? If so, does Kuhn's retreat to "local" incommensurability actually survive, or is it global incommensurability in disguise?
  2.  **Rationality vs. Truth:** Kuhn saves rationality (scientists have reasons to switch) by sacrificing truth (theories don't get truer, just more specialized). Is this a price historians are willing to pay? Does it align with how scientists view their own history?
  3.  **The Davidsonian Trap:** Davidson argues that disagreement presupposes agreement. If Kuhn says Newton and Einstein disagree about mass, Davidson says they must agree on what mass *is*. If Kuhn says they don't agree on what mass *is*, Davidson says they aren't disagreeing, just making noises. Can Kuhn's "bilingual historian" escape this dilemma, or does the historian simply impose a third, anachronistic lexicon to make sense of the debate?

  ### Recommended Secondary Reading for the Seminar
  *   **Kuhn, T. S.** "The Road Since Structure" (especially the discussion on lexicons).
  *   **Davidson, D.** "On the Very Idea of a Conceptual Scheme."
  *   **Sankey, H.** *The Incommensurability Thesis* (Excellent critical analysis of the semantic turn).
  *   **Hoyningen-Huene, P.** *Reconstructing Scientific Revolutions* (The most charitable and rigorous reconstruction of Kuhn's later neo-Kantianism).
  *   **Chang, H.** *Inventing Temperature* (A historiographical case study that grapples with these exact issues of meaning change and continuity).

  ### Summary for your Introduction
  Kuhn's lexical turn is a strategic retreat designed to save the *historian's* ability to compare theories while denying the *philosopher's* ability to reduce them to a common truth-conditional language. It succeeds in making incommensurability compatible with historiography (by allowing bilingualism) but leaves the metaphysical status of scientific progress vulnerable. It meets Davidson's objection only by redefining "conceptual scheme" as "vocabulary," but it remains vulnerable to the charge that if the vocabulary is central enough to cause incommensurability, it is too central to allow the shared background Davidson demands.
