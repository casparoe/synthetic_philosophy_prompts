      *(Refining the Davidson point)*: Davidson argues that belief attribution requires a background of shared truths. If Kuhn says the lexicon changes, does that undermine the shared background? Kuhn says no, because the lexicon is a small subset. Davidson might say the lexicon is *too central* to allow the rest to hold steady. I need to highlight this tension.

