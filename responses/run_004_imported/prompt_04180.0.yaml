      *   *Claim:* "More severe... than St. Petersburg."
      *   *Reality:* Many decision theorists agree it is more severe because St. Petersburg has a defined value ($\infty$), whereas Pasadena doesn't even have that. It challenges the very existence of an expectation.
      *   *Claim:* "Simple coin-toss gamble."
