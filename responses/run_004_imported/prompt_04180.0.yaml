      *   **Difference:** St. Petersburg has an infinite EV. Pasadena has *no* EV.
      *   **Severity:** Pasadena is arguably worse for decision theory because you can't even say "it's worth infinity." You can't compare it to anything.

  5.  **Relate to Reinsurance/Cat Bonds:**
