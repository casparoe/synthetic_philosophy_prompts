  3.  **Define the Pasadena Paradox:**
      *   **Origin:** Nover and Hájek (2004).
      *   **Setup:** Toss a fair coin until it lands Heads. Let $n$ be the number of tosses.
      *   **Payoff:** $(-1)^{n+1} \cdot \frac{2^n}{n}$. (Or similar variations).
      *   **Math:** The expected value is the sum $\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
      *   **Series:** This is the alternating harmonic series.
      *   **Convergence:** It converges conditionally to $\ln(2)$ *if* summed in that specific order. However, by the Riemann Rearrangement Theorem, if you rearrange the terms (which corresponds to different ways of grouping outcomes in a probability space without a natural order), the sum can be anything or diverge.
      *   **Key Issue:** In standard probability theory (Lebesgue integration), the expectation is defined only if the integral of the absolute value is finite (absolute convergence). Here, $\sum |\frac{(-1)^{n+1}}{n}| = \sum \frac{1}{n}$, which is the harmonic series (diverges to $\infty$). Therefore, the expectation is *undefined*.

