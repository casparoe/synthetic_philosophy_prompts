      *   *Check:* Is the philosophy accurate? Yes, this is the cladistic revolution of the late 20th century (Hennig).
      *   *Check:* Is it empathetic? Ensure I don't dismiss the old curator's view as "unscientific." It's scientifically valid to study grades (e.g., convergent evolution).

  8.  **Final Polish:** (Produces the final output provided previously.)
      *   *Key Insight to highlight:* The word "fish" refers to a *grade* of organization, not a *clade*. Both are real, but in different senses.
