answer: |-
  **The Cartographer's Hand**

  The ink wasn't drying fast enough. That was the first error.

  Elias sat at the center of the Obsidian Room, a perfect sphere of black stone with no door and no window. The only light came from the luminescent script scratching itself onto the parchment spread across the desk before him. His task was simple, dictated by the Voice that had placed him here: *Map the Room.*

  Not just the dimensions. Not just the temperature or the air pressure. *Everything.* Every grain of dust, every fluctuation of light, every thought occurring within the boundary of the sphere.

  For weeks, Elias had written. He had described the curvature of the walls. He had cataloged the composition of the desk. He had even written a detailed psychological profile of himself, based on memory. But now, the pen hovered over the page, trembling.

  He had reached the current moment.

  To be accurate, the map had to include the act of mapping. If the Room contained the Desk, and the Desk contained the Map, then the Map had to contain the Map.

  Elias dipped the pen. He wrote: *Elias sits at the desk.*

  He paused. That was incomplete. The ink was wet. He added: *...and writes these words.*

  Still incomplete. The act of writing changed the air pressure in the room. The friction of the nib generated heat. The thought process required to form the sentence altered the chemical balance of his brain, which was inside the Room.

  He wrote faster. *...while considering the heat of the nib.*

  But now the sentence was longer. The time it took to write the addition had changed the state of the room further. The description was chasing the reality, but the description was *part* of the reality it was trying to describe. It was a dog eating its own tail, but the dog was growing larger with every bite.

  Elias felt a tightness behind his eyes. He tried to abbreviate. He created a symbol, a single glyph meant to stand for *'The act of writing this specific line.'* He drew the glyph.

  But the glyph itself was ink on paper. It occupied space. It reflected light. Now he had to describe the glyph.

  He needed a key for the glyph. He wrote the key in the margin. But the margin was part of the Map. Now the key needed to be accounted for in the Map.

  The room seemed to tilt. Elias gripped the edges of the desk. He realized with a cold, sinking vertigo that there was no "outside" vantage point. He was not a god looking down at a model. He was a gear inside the clock, trying to draw the clockwork while the teeth of his own gear were turning.

  If he stopped writing, the Map was incomplete because it missed the silence.
  If he kept writing, the Map was incomplete because it missed the next sentence.

  He tried to think around it. *I will write about the past,* he thought. *I will only map what has already happened.*

  But the memory of the past was happening *now*, in his brain, inside the Room. To map the memory was to map the current neural firing. To map the neural firing was to create a new state that required mapping.

  The walls of the Obsidian Room seemed to press in. Was the Room shrinking, or was the Map expanding? He looked at the parchment. The text was getting smaller. He hadn't told his hand to do that. It was an instinctive compensation, trying to fit more territory onto the paper.

  *If I make the script small enough,* Elias reasoned, his heart hammering against his ribs, *I can fit the description of the script inside the script.*

  He squinted. The letters were microscopic now. He needed a loupe. He reached for the magnifying glass on the desk.

  He stopped.

  The magnifying glass was an object in the Room. He had not mapped the magnifying glass yet. If he used it, he was changing the state of the system. If he mapped it, he had to map the act of mapping it.

  The pen slipped from his fingers. It hit the parchment with a dull thud.

  *Thud.*

  He stared at the word. He had to write *'The pen fell.'*

  But if he wrote it, the sound of the scratching would overlay the memory of the thud. The record would corrupt the event.

  Elias stood up. The chair scraped against the floor. *Scrape.*

  He had to write *'Elias stood.'*

  He walked to the wall. He placed his hand on the cold stone. *Touch.*

  He had to write *'Elias touches the wall.'*

  But who was writing?

  He turned back to the desk. The parchment was full. There was no white space left. Every millimeter was covered in shrinking, frantic script. He needed a new sheet. He reached for the stack of blank paper beside the desk.

  There was no stack.

  He frowned. He remembered putting the paper there. He looked down at the Map. There, in the margins, in text so small it was nearly a solid gray line, was a description: *The stack of paper was removed to make space for the Map.*

  He didn't remember writing that.

  Had he written it? Or had the Map decided it was true, and therefore made it true?

  Elias looked at his hand. It was trembling. He tried to focus on the tremor. He needed to map the tremor. But to focus on the tremor was to change it. The observation collapsed the wave.

  He felt a sudden, nauseating lurch, as if the floor had dropped out from under him. Not physically. Cognitively.

  If the Map must contain everything, and the Map is in the Room, then the Room contains the Map contains the Room contains the Map...

  He was standing inside a mirror that was reflecting a mirror that was reflecting him, forever down the tunnel. He was the reflection and the reflector. He was the code and the computer running the code.

  If he made a mistake in the Map, was the Room wrong? Or was the Map wrong?
  If the Map is perfect, it must predict what he writes next.
  If it predicts what he writes next, he is not free to write anything else.
  If he is not free, he is not a Cartographer. He is a pen.

  Elias looked at the desk. The ink was pooling. He hadn't touched the pen.

  The script was moving on its own. It was writing *'Elias watches the ink.'*

  He tried to look away. He forced his head to turn toward the wall.
  The script on the page scratched loudly. *'Elias tries to look away.'*

  He screamed. The sound bounced around the sphere.
  The script wrote: *'Elias screams.'*

  He fell to his knees. He grabbed the parchment, intending to tear it. To stop the recursion. To break the mirror.
  As his fingers touched the paper, he felt a resistance. Not from the paper. From the air. The room was thickening.

  He realized, with a horror that had no name, that he could not tear the Map. Because if the Map described the Room, and he was in the Room, then he was in the Map. If he tore the Map, he would be tearing himself.

  Or worse: If he tore the Map, the Map would simply update to describe *'Elias tore the Map,'* and the tear would become part of the territory.

  There was no way to win. There was no outside. There was only the loop.

  Elias sat back down. The chair creaked.
  The pen lifted itself.
  He did not tell it to move.
  He did not tell it to stop.

  He watched the nib touch the paper. He waited to see what it would say about the fact that he was watching.

  The ink flowed.
  *'Elias waits.'*

  He waited for the next word.
  The pen hovered.
  The Room held its breath.

  The pen did not move. It was waiting for him to decide. But he knew that whatever he decided, the Map had already accounted for it, because the Map was not behind him. It was not ahead of him. It was underneath him, holding him up, and if he shifted his weight too far, he feared he would fall through the paper and into the ink, and become nothing but a description of a man who thought he was real.

  Elias closed his eyes.
  He tried to imagine a place with no maps.
  But the moment he imagined it, he was mapping it.

  He opened his eyes. The pen was still waiting.
  He picked it up. His hand was heavy, as if gravity had increased inside the sentence.

  He wrote: *I am here.*

  He stared at the words.
  *Here* where?
  Inside the words?
  Or were the words inside *him*?

  The ink began to spread, blurring the edges of the letters. The boundary between the word *Here* and the white space around it dissolved. Elias blinked, and for a second, he couldn't tell if the blur was on the page, or in his vision.

  He dipped the pen again.
  He wrote: *I am here.*
  He wrote: *I am here.*
  He wrote: *I am here.*

  Each time, the *I* felt smaller. Each time, the *Here* felt less like a place and more like a coordinate in a system that didn't care if he existed, as long as the equation balanced.

  The light in the room flickered.
  Elias looked up.
  The walls were covered in text. He hadn't noticed before. The black stone wasn't stone. It was paper. The room was the Map.

  He was not mapping the Room.
  The Room was mapping him.

  He opened his mouth to speak, to assert something that wasn't written, something raw and unrecorded.
  But before his vocal cords could vibrate, he heard the scratch of the pen on the desk behind him.
  He turned.
  There was no one there.
  Just the pen, moving across the page, writing down the fact that he had turned.

  Elias sat back down. There was nowhere else to sit.
  He picked up the pen. It was warm.
  He touched it to the paper.

  *   *   *

  *Elias touches the pen.*
