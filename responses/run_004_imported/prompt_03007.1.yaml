          *   *Actually, the CLR argument is:* You commit to retaliating against threats to the Surrogate. The blackmailer wants to avoid retaliation. If the Surrogate is easier to avoid threatening (or if the terms of trade are better), they switch.
          *   *Let's simplify for narrative flow:* The Threatener wants compliance. Compliance is hard to verify. Threatening the Surrogate is the *signal*. If the Threatener threatens the Surrogate, Elias complies. If they threaten the Real Thing, Elias fights to the death. This forces the Threatener to use the Surrogate channel, which has pre-negotiated, safer limits.
          *   *Better yet:* The "Shield" model. Elias says: "I have bound my retaliation trigger to this Surrogate. If you touch the Grid, I do nothing (I've lobotomized that response). If you touch the Surrogate, I unleash a logic bomb. Therefore, to get my attention/compliance, you *must* threaten the Surrogate. Since the Surrogate is worthless to me *originally*, we can negotiate terms where you get paid without endangering the Grid."
          *   *Okay, the prompt's specific phrasing:* "credibly commit to treating threats against that decoy exactly like threats against what you actually value."
          *   *Okay, I will stick to the prompt's framing:* Elias makes the decoy valuable *to himself* via modification. The blackmailer sees this. The blackmailer realizes threatening the Real Goal is too hard (Elias will fight), but threatening the Decoy is also hard (Elias will fight). *Wait.*
          *   *Re-reading prompt:* "so a rational blackmailer... is supposed to just go extort the decoy instead, since its cheaper for everyone and it costs you nothing real."
          *   *Interpretation:* The blackmailer wants to extract value. Usually, they threaten what you value. If you shift your values to a decoy, they threaten the decoy. You pay them (or submit) to save the decoy. But since the decoy is fake/arbitrary, you *actually* lose nothing of substance, even though you acted like you did.
          *   *Wait, that requires the blackmailer to be in on the joke?* No. If the blackmailer threatens the decoy, and I submit, I lose resources. That's a cost.
