  3.  **Deconstruct the "80% Favorite" Claim:**
      *   How was this calculated? Preflop? Postflop?
      *   If it's preflop (e.g., AA vs. KK), folding is insane.
      *   If it's river (e.g., top pair vs. potential straight), the 80% might be based on the range of hands the opponent *could* have, not what they *do* have.
      *   *Key Insight:* The 80% number is likely based on a *range*, but the gut feeling is about narrowing that range to a specific subset.

  4.  **Deconstruct the "Gut Feeling":**
      *   Is it magic? No.
      *   Is it experience? Yes.
      *   *Condition for Validity:* The player must have a track record of accurate reads *against similar opponents in similar spots*.
