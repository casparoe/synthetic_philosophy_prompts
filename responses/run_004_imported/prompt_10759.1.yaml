      *   *The Tiebreaker (The Framework):*
          *   **Input Quality:** Garbage in, garbage out. If the 80% assumes the opponent plays randomly, but the opponent is a maniac, the math is wrong.
          *   **Specific vs. Vague:** "He bet big" is vague. "He bet 3x pot on a dry board after checking back turn" is specific.
          *   **The "Tell" Hierarchy:** Physical tells < Betting Patterns < History.
          *   **The EV Calculation:** To justify folding 80% equity, you need to be right a *lot*. How often does the hunch need to be right to break even? (Let's do the math here).
      *   *The Verdict:* Who wins the argument?
          *   If the 80% was calculated correctly against the *actual* range, User wins.
