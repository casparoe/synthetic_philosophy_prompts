  the question was: "Explain why Kit Fine denies that metaphysical grounding can be defined in modal terms (e.g. as necessitation or strict implication). Use the Socrates/{Socrates} example, and say what the argument is supposed to show about the relation between grounding and essence."

  and here's the student's answer i'm trying to grade:

  "Fine's target is the idea that 'A grounds B' can be analyzed as something like 'A's obtaining necessitates B's obtaining' (or strictly implies it). His counterexample is Socrates and his singleton {Socrates}. Intuitively, Socrates's existing grounds {Socrates}'s existing and not the other way around - the set depends on him, he doesn't depend on it. But on the necessitation analysis this can't be right, because necessitation only runs in one direction here: it's necessary that if Socrates exists then {Socrates} exists, but {Socrates}'s existing doesn't necessitate that Socrates exists, since sets can in principle survive the destruction of their members. So the modal facts alone can't even distinguish the two cases, let alone explain why the grounding goes one way.

  Fine's diagnosis is that we need essence to do the work modality can't. Since it's part of the essence of {Socrates} to have Socrates as a member, while it's no part of Socrates's essence to belong to that singleton, the direction of ground tracks the direction of essence instead. And because Fine takes essence to just be a special case of necessity - the necessary truths that follow from a thing's definition - this keeps the whole picture within the modal family after all, just at a more fine-grained level."

