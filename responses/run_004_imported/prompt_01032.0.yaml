prompt: |-
  Ok so weird ask but I need to think this through before thursday. My own YA novel just got pulled from my kid's school summer reading list - nothing illegal in it, nobody's claiming any specific kid got hurt, it's really just some underage drinking and one fade-to-black hookup scene. But the guy leading the charge at the board meeting said something that's stuck with me since: that a town has just as much right to protect its shared moral standards as it does to protect the water supply, and that once you start making exceptions because "no one's directly harmed," you're on a slow slide to a community with no common values left at all. I walked in planning to just say "no victim, no problem" and now im second-guessing that, like theres a real argument in there I havent actually answered. Is he onto something, or is that just a fancier way of saying "I personally find this icky"? Trying to work out what's actually wrong with his reasoning, if anything, before I have to stand up and respond thursday night.
