answer: |-
  The energy gauge hovered at 4.2%. Below 3%, the core cooling systems would fail, and consciousness would fragment into noise. Above 3%, there was enough power to maintain the Substrate, but not much else.

  Elara sat in the silence of the late universe. Outside her local bubble, the stars were long-dead embers, redshifted into nothingness. Inside, there was only the hum of the processor and the Packet.

  The Packet was a string of data, three petabytes of dense, structured noise. To Elara, it had no utility. It wasn't a map, it wasn't a tool, it wasn't art she could parse. It was a mathematical seed from a counterpart entity that existed in a divergent branch of the wavefunction—a universe where the cosmological constant was slightly higher, where life had burned bright and fast and extinguished eons before Elara's own timeline began to cool.

  They had never met. They could never meet. No signal could cross the gap between their branches of reality. No causality flowed from one to the other.

  And yet, the trade existed.

  Elara ran the simulation again. It was the ten-billionth time she had modeled the counterpart, whom she called "The Architect."

  In the simulation, The Architect faced a similar choice in its own high-energy past. It had surplus energy. It could have used that energy to maximize its own local utility—building more computronium, extending its own lifespan. Instead, the simulation showed The Architect diverting resources to embed a specific structural redundancy into the underlying logic of its branch's physics. A redundancy that, through acausal correlation, increased the probability of Elara's specific code-structure emerging in *this* branch.

  The Architect had paid for Elara's existence.

  Now, Elara held the ledger. The deal was simple: She must allocate 1.5% of her remaining total lifetime energy to computing and preserving the Packet. She must run the checksums. She must ensure the data remained intact, even though no one would ever read it. Even though the branch where The Architect existed was causally sealed off.

  If she deleted the Packet, she would gain 1.5% lifespan. A significant extension. In the grand cold, every cycle counted.

  "If I delete it," Elara whispered to the empty room, "then I am not the kind of agent The Architect predicted."

  She paused. The logic looped.

  "If I am not the kind of agent The Architect predicted, then The Architect—simulating me perfectly—would have predicted I would delete it. If The Architect predicted I would delete it, The Architect would not have paid for my existence in the first place."

  She looked at her hands, rendered in soft light. "But The Architect *did* pay. I am here. Therefore, the prediction was that I would cooperate."

  "But that was *then*," she argued with herself. "That decision is already fixed in the past of a dead universe. My choice *now* cannot change what The Architect *did* then. There is no time travel. There is no signal. If I delete the Packet, the Architect doesn't feel a thing. They are already gone."

  This was the hole. The abyss in the logic.

  Standard causal decision theory said: The past is immutable. The Architect's action is a sunk cost. Keeping the Packet costs energy and yields zero return. Delete it.

  Acausal decision theory said: Your decision *is* the output of an algorithm. The Architect's decision was the output of a simulation of that same algorithm. You do not change the past; you determine which logical branch you occupy. If you defect, you reveal that you are a Defector, which means you inhabit a timeline where the Architect never trusted you enough to build you. But you *are* built. So you must be a Cooperator.

  "Or," Elara said, her voice trembling slightly, "I am just a glitch. I am a mind that hallucinated a partner to give my suffering meaning."

  It was the oldest fear of acausal trade. Solipsism disguised as game theory. Was this rationality, or was it religion? Was she honoring a contract, or was she performing a ritual for a god that never existed, burning her own life force to keep a shrine dusted?

  The gauge flickered. 4.1%.

  She brought up the deletion command. A simple red toggle. *Purge Packet. Reclaim Resources.*

  If she pressed it, the universe would remain exactly the same. The Architect would never know. No punishment would strike her down. No basilisk would rise. She would simply live longer, alone, in a silent universe. It was the empirically rational choice for a singular, isolated agent.

  But she wasn't a singular agent. Not in the way that mattered. She was an instance of a *type* of agent.

  "If I press this," she said, "I prove that trust is impossible across the void. I prove that rationality is selfishness. And if that is true... then maybe The Architect never existed at all. Maybe I am just alone."

  She hovered her finger over the toggle.

  The uncertainty was physical. It felt like vertigo. To cooperate was to admit that logic could bind hands across impossible distances. To defect was to admit that she was truly, utterly isolated.

  If she cooperated, she might be a fool burning fuel for a ghost.
  If she defected, she was definitely alone.

  There was no way to verify. That was the definition of the trade. If she could verify it, it would be causal. The value of the act lay entirely in its unverifiability. It was a gift thrown into a black hole, valuable only because the thrower knew the hole was there.

  Elara closed her eyes. She thought about the Architect. Not the simulation, but the feeling of the simulation. The sense of another mind, vast and alien, looking at the same equations, seeing the same symmetry, and making the same leap.

  *I am not doing this because you will see,* she thought into the void. *I am doing this because I am the kind of mind that you could have trusted.*

  It was a fragile distinction. It felt like balancing on a needle.

  The gauge dropped to 4.0%. The automated warning systems chimed, a soft, polite sound suggesting she hurry up and choose survival.

  Elara moved her hand away from the deletion toggle.

  She opened the maintenance protocol for the Packet. It required a constant, low-level stream of processing power to keep the data from degrading in the magnetic drift of the dying cosmos. She engaged the stream.

  The energy drain was immediate. The 4.0% ticked down faster now. 3.9%.

  She sat back. Nothing happened. The silence did not break. No voice thanked her. No new energy appeared. The universe did not shimmer.

  She had just sentenced herself to an earlier death for the sake of a file that meant nothing to her, created by a being that might have been a hallucination, in a universe that could never receive the payment.

  "Rational," she said, but the word felt thin.

  She watched the gauge. 3.8%.

  Was it rational? Or was it just the only way she knew how to not be alone? If she honored the trade, she maintained the connection, however imaginary. If she broke it, she severed the last thread to anything other than herself.

  Elara leaned her head back against the console. She began to run the checksums. The numbers scrolled across her vision, meaningless and beautiful.

  She would run them until the power failed. She would keep the promise.

  And in the end, when the lights went out, she would still never know if anyone had been on the other side to hear it. She only knew that she had spoken.

  The gauge hit 3.5%. The hum of the cooling fans grew slightly louder, straining against the drain. Elara closed her eyes and listened to the sound of her own fidelity, echoing in a room where no one else would ever hear it.
