answer: |-
  It is a pleasure to meet a fellow traveler who has moved from the lab bench to the armchair. Your wife's comment about trading superconductors for a midlife crisis is charming, but given that McTaggart's paper is essentially a logical proof attempting to derive a null result for time, I suspect you'll find the rigor familiar, even if the axioms are metaphysical rather than physical.

  Since you have a background in relativity, you already have the intuition that makes McTaggart so compelling to physicists: the suspicion that a universal "now" is coordinate-dependent and therefore not fundamental. However, McTaggart isn't arguing from relativity; he's arguing from pure logic.

  Here is the breakdown of the "vicious regress" and how Eternalists manage to co-opt a man who claimed time was an illusion.

  ### 1. The Vicious Regress: Why it doesn't converge

  In physics, we encounter infinite series all the time. A perturbative expansion in quantum field theory might go to infinite order, but if the series converges, we can calculate a finite, meaningful value. That is a **benign regress**.

  A **vicious regress** occurs when the infinite chain fails to ground the phenomenon it is trying to explain. It's not that the chain is long; it's that every link in the chain relies on the very thing that was supposed to be proven, without ever resolving the initial contradiction.

  Here is the step-by-step logic of where the "bite" happens:

  **Step 1: The Contradiction**
  McTaggart establishes that for time to be real, there must be change. For there to be change, events must change their temporal properties. An event $E$ (say, the death of Queen Anne) must be Future, then Present, then Past.
  *   *The Problem:* $E$ cannot possess the properties "Past," "Present," and "Future" simultaneously. They are mutually exclusive (incompatible determinations).
  *   *The Contradiction:* Yet, for time to pass, $E$ must possess all three.

  **Step 2: The First Defense (Sequentiality)**
  The natural defense (and the one you noted) is: "$E$ does not have all three properties *at once*. It *was* Future, it *is* Present, it *will be* Past."
  This moves the contradiction from the first order (Past, Present, Future) to the second order (Was, Is, Will Be).

  **Step 3: McTaggart's Counter (The Regress Begins)**
  McTaggart argues that "Was," "Is," and "Will Be" are themselves temporal determinations.
  *   To say "$E$ *will be* Past" is to attribute the property of Pastness to $E$, but qualified by Futurity.
  *   But now, the qualification "Will Be" is itself a temporal property. Does "Will Be" exist in the present? If so, how can a present fact ("will be") describe a non-present state ("past")?
  *   To make sense of "$E$ *will be* Past," you have to locate that statement in time. You need a **second time series** to tell you *when* it is true that "$E$ will be Past."

  **Step 4: Why it is Vicious**
  Here is the crucial logical turn. You might think, "Okay, so we have a second time series to order the first one. So what?"

  The regress is vicious because **each step is introduced to solve a contradiction, but each step replicates the contradiction.**
  1.  We introduced the second series to resolve the incompatibility of Past/Present/Future in the first series.
  2.  But the second series *also* has a Past, Present, and Future (e.g., "It *was* true that $E$ would be past," "It *is* true...", "It *will be* true...").
  3.  So the second series suffers from the exact same incompatibility as the first.
  4.  To fix the second series, you need a third series.
  5.  The third series has the same problem.

  **The "Vicious" Verdict:**
  In a benign mathematical regress (like $Zeno's$ paradox resolved by calculus), the infinite sum converges to a definite value. In McTaggart's regress, there is no convergence. There is no point where the contradiction is actually resolved. You are trying to explain "Time" by positing "Time" to explain "Time."

  If the existence of the A-series depends on the coherence of these temporal predicates, and the predicates are incoherent at every level of analysis, then the A-series cannot exist. It is an ontological dead end. It's like trying to balance a book on a table, but the table is floating on another table, which is floating on another table, forever. The book never gets grounded.

  ### 2. Does this help Eternalism or destroy Time?

  This is where the reading group will likely have the most fun, because the history of this debate is essentially a game of philosophical hot potato.

  **McTaggart's Actual Conclusion:**
  McTaggart was an Idealist. His conclusion was not "Therefore, the B-series is real." His conclusion was "Therefore, Time is unreal."
  He argued:
  1.  Time requires the A-series (change requires a moving now).
  2.  The A-series is contradictory (as per the regress above).
  3.  Therefore, Time is unreal.
  4.  The B-series (the static ordering of events) cannot exist without the A-series, because "Earlier/Later" are only temporal concepts if there is a "flow" to give them meaning. Without the A-series, the B-series is just a static list, like numbers on a page.

  **How Eternalists (B-Theorists) Co-opt McTaggart:**
  Modern Eternalists (like J.J.C. Smart, D.H. Mellor, or your relativity-leaning colleagues) effectively say: "McTaggart, you are half-right."
  They accept Premise 2 (The A-series is contradictory/unreal) but they **reject Premise 1** (Time requires the A-series).

  *   **The Eternalist Move:** They argue that the A-series (the flowing "now") is indeed a psychological illusion or a linguistic artifact, exactly as McTaggart proved. However, they define Time *as* the B-series.
  *   To an Eternalist, "change" doesn't mean an event *becoming* present; it means an object having different properties at different coordinates in the time dimension (just as a road has different elevations at different spatial coordinates).
  *   So, they cite McTaggart as the guy who proved Presentism (A-Theory) is logically incoherent. They treat his argument as a *reductio ad absurdum* of the "flow of time," not of time itself.

  **Does it undercut the Block Universe?**
  This is the sharp edge of the knife. There is a strong camp of philosophers (often called "A-Theorists" or "Presentists") who argue that McTaggart's argument *does* destroy the Block Universe too, if you look closely.

  Their argument goes like this:
  McTaggart claimed the B-series depends on the A-series. Why? Because "Earlier than" is a temporal relation. If you remove all A-determinations (Past, Present, Future), what makes the B-series *temporal* rather than *spatial*?
  *   In a block universe, the year 1800 is "earlier" than 2000. But if 1800 is just as real and existent as 2000, in what sense is it "past"?
  *   If McTaggart is right that A-properties are contradictory, but B-relations *require* A-properties to be temporal, then the Block Universe is just a static block of spacetime with no "time" in it at all. It becomes a spatialized dimension.

  **The Current Standoff:**
  1.  **Eternalists (B-Theory):** "McTaggart proved the 'flow' is nonsense. We keep the ordering (B-series) and drop the flow. Time is real, but it doesn't pass."
  2.  **Presentists (A-Theory):** "McTaggart proved the 'flow' is nonsense. Since time *requires* flow, time is unreal. But our experience says time is real, so McTaggart's logic must have a flaw (usually they attack the 'vicious regress' claim)."
  3.  **McTaggart (The Original):** "Time is unreal. Reality is a timeless spiritual unity." (Nobody really follows this part anymore).

  ### Summary for the Reading Group

  1.  **The Regress:** It is vicious because it is an **explanatory failure**. Each step is intended to resolve a logical contradiction in the previous step, but merely replicates that contradiction at a higher order. It never grounds the truth conditions for temporal statements.
  2.  **The Eternalist Adoption:** Eternalists treat McTaggart's argument as a weapon against Presentism, not against Time itself. They accept the destruction of the A-series but deny that the A-series is necessary for Time.
  3.  **The Vulnerability:** If McTaggart is right that B-relations depend on A-properties to be "temporal," then his argument destroys Eternalism too. Eternalists must argue that "Earlier/Later" is a fundamental, primitive relation that does not need "Past/Present/Future" to make sense of it.

  Given your background in relativity, you'll likely find the Eternalist position most comfortable: the "contradiction" arises only if you demand a preferred reference frame for "Now." If you treat time as a coordinate $t$ in a manifold $M$, the B-series is just the ordering of coordinates, and the A-series is just a statement about the relationship between a specific observer's worldline and those coordinates. McTaggart would say you've just mathematized the illusion; the Presentists will say you've explained away the reality of experience.

  Enjoy the rabbit hole. It's deeper than the cryostat, but the view is just as striking.
