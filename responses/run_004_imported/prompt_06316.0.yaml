answer: |-
  This is a fantastic question, and you have put your finger on exactly the friction point where naive falsificationism grinds against the history of actual scientific practice. As a chemist, you know that when an instrument gives an outlier, you don't immediately throw out the underlying theory of chemistry; you check the calibration, the reagents, or the environment. Le Verrier's two cases are the canonical examples of this "check the auxiliaries" move, yet they yield opposite verdicts in the history books.

  You are correct: logically, the two moves are isomorphic.
  *   **Theory ($T$):** Newtonian Mechanics + Universal Gravitation.
  *   **Anomaly ($A$):** Orbital precession not accounted for by known masses.
  *   **Auxiliary Hypothesis ($H$):** There exists an unseen mass $M$ at location $L$.

  If we stick strictly to Popper's *Logic of Scientific Discovery* (1934), both should be treated with suspicion. Popper was wary of "conventionalist stratagems"—tweaking auxiliary assumptions to immunize a theory from falsification. He would argue that by postulating Vulcan, Le Verrier was protecting Newton from a potential falsification.

  So, why is Neptune a triumph and Vulcan a footnote? And can we tell the difference *before* we find the planet (or fail to)? Here is the breakdown of why Popper struggles here, and how Lakatos (and others) attempt to patch it.

  ### 1. Where Naive Falsificationism Breaks Down
  The problem you've identified is the **Duhem-Quine Thesis**. Pierre Duhem (a physicist and philosopher, contemporary with the Vulcan era) pointed out that hypotheses cannot be tested in isolation. You only test a conjunction: $T \land A_1 \land A_2 \dots \land A_n$.

  When the prediction fails (the orbit doesn't match), logic tells you $\neg(T \land A)$. It does *not* tell you whether $\neg T$ or $\neg A$.
  *   **Neptune Case:** $\neg A$ (the assumption that there are only 7 planets) was the culprit. $T$ survived.
  *   **Vulcan Case:** $T$ was the culprit. $A$ (that there was a planet) was false.

  Popper's methodology suggests we should be willing to falsify $T$. But he offers no logical rule for *when* to blame $T$ and when to blame $A$. If we always blamed $T$, we would have discarded Newtonian gravity in 1845. If we always blame $A$, we end up chasing ghosts like Vulcan forever. Popper relies on the "scientific instinct" of the researcher, which is not a very robust philosophical criterion.

  ### 2. The Lakatosian Solution: Research Programmes
  Imre Lakatos, in his *Methodology of Scientific Research Programmes* (1970), explicitly used the Neptune/Vulcan case to refine Popper. He argued that we shouldn't look at single theories, but at **Research Programmes**.

  A programme has a **Hard Core** (Newton's laws) that is treated as irrefutable by methodological decision, and a **Protective Belt** of auxiliary hypotheses (planetary masses, initial conditions, unseen bodies).

  Lakatos distinguishes between **Progressive** and **Degenerating** problem shifts. This is the key to your question.

  *   **Theoretically Progressive:** The new auxiliary hypothesis predicts some *excess empirical content* (something new, not just the anomaly it was designed to fix).
  *   **Empirically Progressive:** Some of that excess content is corroborated by observation.

  **Applying this to Le Verrier:**

  **Neptune (Progressive Shift):**
  Le Verrier didn't just say "There is a planet." He calculated specific coordinates.
  1.  **Excess Content:** It predicted a location in the sky where no planet was known to be. It also implied specific gravitational effects on other bodies (later verified).
  2.  **Corroboration:** Galle looked at the coordinates and found it immediately.
  3.  **Verdict:** This was a *progressive* shift. It expanded the empirical content of the Newtonian programme.

  **Vulcan (Degenerating Shift):**
  Here is where the "before the fact" nuance matters. At the exact moment of proposal (1859), Vulcan looked progressive. It predicted transits and positions.
  *   **The Shift:** However, observers looked and *didn't* find it.
  *   **The Degeneration:** A degenerating programme doesn't just fail; it *patches*. When Vulcan wasn't found at the predicted spot, the hypothesis was tweaked. Maybe it was smaller? Maybe its orbit was more inclined? Maybe it was a cloud of asteroids rather than a planet?
  *   **Verdict:** Each tweak was designed solely to explain the *previous failure* (the non-sighting) rather than predicting new, independent facts. It was absorbing anomalies without generating new corroborated content.

  ### 3. Can We Tell Them Apart "Before the Fact"?
  This is your sharpest critique: *At $T_0$ (the moment of hypothesis), don't they look identical?*

  Lakatos admits that you cannot judge a research programme instantaneously. You need a **time lag**. Rationality, for Lakatos, is historical.

  However, there is a principled distinction available at $T_0$ regarding **Independent Testability**.
  *   **Neptune:** The hypothesis ($H_{Neptune}$) was constrained by independent data (perturbations of Uranus) and yielded a prediction that was *risky* and *precise*. If the planet wasn't there, the hypothesis was dead.
  *   **Vulcan:** The hypothesis ($H_{Vulcan}$) was also precise initially.

  So, strictly at $T_0$, a Lakatosian must admit they look structurally similar. The distinction emerges in the **sequence of moves**.
  *   **Neptune Sequence:** Hypothesis $\rightarrow$ Test $\rightarrow$ Success. (Stop).
  *   **Vulcan Sequence:** Hypothesis $\rightarrow$ Test $\rightarrow$ Failure $\rightarrow$ Modified Hypothesis $\rightarrow$ Test $\rightarrow$ Failure $\rightarrow$ Modified Hypothesis...

  The "bad science" label on Vulcan is not about the initial postulate (which was reasonable normal science); it is about the *refusal to let the auxiliary hypothesis die* after repeated failed tests. Le Verrier and his successors kept adjusting the parameters of Vulcan to accommodate the null results. That is the definition of a degenerating problem shift.

  ### 4. A Bayesian Perspective (Complementary View)
  Since you come from an analytical background, a Bayesian view might resonate as a way to quantify the "before the fact" intuition that Lakatos describes historically.

  We are comparing $P(T_{Newton} | Data)$ vs $P(T_{New} | Data)$.
  But really, we are comparing the likelihood of the Auxiliary vs. the Core.

  *   **1845 (Uranus):** We had seen 7 planets. The prior probability $P(\text{8th Planet exists})$ was high based on the Titius-Bode law and simple induction. The prior probability $P(\text{Newton is Wrong})$ was vanishingly low given 200 years of success.
      *   *Rational Move:* Bet on the Planet.
  *   **1880 (Mercury):** We had looked for Vulcan for 20 years. We had found no transits, no gravitational effects on comets passing near the sun.
      *   The likelihood $P(\text{Observations} | \text{Vulcan exists})$ was dropping with every failed search.
      *   Meanwhile, anomalies were popping up elsewhere (e.g., the stability of the solar system, electrodynamics issues).
      *   *Rational Move:* The posterior probability of "Unseen Planet" begins to fall below "Modification to Gravity," even before Einstein publishes.

  The Bayesian view suggests that the "novelty" isn't just about the prediction, but about the **weight of the priors** shifting over time due to the lack of corroboration.

  ### 5. Summary: The Principled Distinction
  To answer your specific question on whether there is a principled way to tell them apart *before* we know the outcome:

  1.  **Popper:** No. Logically, they are identical conventionalist stratagems. Popper relies on the scientist's "intuition" to know when to stop saving the theory.
  2.  **Lakatos:** Yes, but with a caveat. The distinction is not in the single move, but in the **heuristic power** of the move.
      *   **Neptune** was a *progressive* move because it opened up new lines of inquiry (telescopic search) that were immediately fruitful.
      *   **Vulcan** became a *degenerating* move because it consumed resources to explain away non-detections without yielding new positive knowledge.
      *   *Prospective Criterion:* Is the auxiliary hypothesis **independently testable** in a way that does not rely on the anomaly it was created to explain?
          *   Neptune: Yes (look at the coordinates).
          *   Vulcan: Yes (look at the coordinates/transits).
          *   *The Difference:* When the test failed, the Neptune move was ready to be discarded (if it had failed). The Vulcan move was *retrofitted*. The "bad science" is in the **ad hoc modification after failure**, not the initial postulate.

  **The Verdict:**
  You are right to feel that hindsight smuggles itself in. At the exact moment Le Verrier proposed Vulcan, it *was* good science. It was a rigorous application of the prevailing paradigm to a puzzle. It only became "bad" (or rather, degenerating) when the community continued to pour effort into modifying the Vulcan hypothesis rather than questioning the Hard Core, despite a lack of empirical progress.

  Lakatos saves us from saying "Newton was falsified by Mercury" prematurely, but he also saves us from saying "Vulcan was a valid theory" indefinitely. The rationality lies in recognizing when a protective belt is no longer generating novel facts, but merely absorbing blows.

  As a retired chemist, you might think of it like method validation. If your spike recovery is off, you first check the pipette (Auxiliary). If you check the pipette, calibrate it, change the tip, change the operator, and the recovery is *still* off, but you keep insisting "there must be a pipette error somewhere," you are running a degenerating research programme. At some point, the rational move is to suspect the assay method itself (The Theory). Le Verrier's genius was knowing when the pipette was actually the problem (Neptune); his stubbornness (shared by his contemporaries) was not knowing when to check the assay (Vulcan/GR).
