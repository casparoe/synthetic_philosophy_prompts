answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Ethical Evaluation of Methotrexate Protocol for Tubal Ectopic Pregnancy

  **Recommendation**
  I recommend that the Committee **reject** the proposed protocol change to include methotrexate (MTX) as a first-line treatment for tubal ectopic pregnancy. While I acknowledge the clinical benefits of MTX regarding fertility preservation and reduced surgical morbidity, the mechanism of action constitutes a direct abortion under the moral framework governing this institution. Approving MTX would violate the Ethical and Religious Directives (ERDs) and undermine the coherence of the Doctrine of Double Effect (DDE) as we currently apply it to salpingectomy.

  **Ethical Analysis: The Object of the Act**
  The core of our current permission for salpingectomy rests on the distinction between *intending* a death and *foreseeing* it. Under ERD 47, an intervention is permissible if the direct purpose is curing a pathological condition of the mother, even if the unborn child's death is foreseen but not intended.

  In a salpingectomy, the moral object of the act is the **removal of a pathological organ** (the fallopian tube) that poses an imminent threat of rupture and hemorrhage. The embryo's death is a tragic, inevitable side effect of removing the tube, but it is not the *means* by which the mother is saved. The mother is saved because the rupturing organ is gone. The causal chain is: *Excision of Tube → Cessation of Hemorrhage Risk.* The embryo's death is collateral to this chain.

  **Addressing the "Redescription" Objection**
  Critics, including some within the bioethics literature, argue that distinguishing salpingectomy from methotrexate is merely verbal gymnastics—"redescribing" the act to match our intuitions. They argue that in both cases, the physician acts with the knowledge that the embryo will die to save the mother. If the outcome and the intention (save the mother) are identical, they ask, does the physical mechanism really matter?

  This objection treats the DDE as a test of *psychological intent* alone. However, in Catholic moral theology, the "object" of the act is not merely what is in the mind, but the **proximate end of the chosen behavior itself**. We must look at what the action *does* before it achieves the ultimate goal.

  *   **Salpingectomy:** The action acts upon the *mother's tissue*. The pathology is the tube.
  *   **Methotrexate:** The action acts upon the *trophoblastic cells*. The mechanism of MTX is the inhibition of dihydrofolate reductase, specifically halting cell division in the rapidly dividing embryonic tissue.

  In the MTX scenario, the causal chain is: *Inhibition of Trophoblast → Death of Embryo → Cessation of Threat.* Here, the destruction of the embryonic life is the *means* by which the threat is neutralized. The drug does not fix the tube; it stops the pregnancy. To approve MTX is to assert that we may directly target the life of the embryo as a therapeutic instrument, which collapses the distinction between "direct abortion" (forbidden by ERD 48) and "indirect loss of life."

  **Why the Distinction is Not Arbitrary**
  The distinction is not arbitrary because it anchors moral responsibility in the physical reality of our interventions, not just our hopes. If we allow the "redescription" argument to stand—that we can define any lethal intervention as "treating the pregnancy site" rather than "killing the embryo"—we lose the ability to constrain *any* direct killing. We could, for example, justify a craniotomy (crushing the fetal skull to facilitate delivery) by redescribing it as "reducing cephalopelvic disproportion." We reject craniotomy not because we want the mother to die, but because the *means* chosen is the direct destruction of the child.

  Similarly, while MTX is less invasive than surgery, its moral object is the termination of the embryonic biological process. Salpingectomy terminates the *location* of the process. This is a metaphysical difference with moral weight. It ensures that our care remains directed at the pathology of the *patient* (the mother), rather than the elimination of the *offspring*.

  **Conclusion**
  The OB-GYN department's desire to minimize surgical risk is clinically sound and ethically commendable. However, we cannot achieve clinical goods through morally prohibited means. The distinction between salpingectomy and methotrexate is not a loophole, but a necessary boundary that preserves the integrity of the "do no harm" principle regarding the unborn.

  I recommend we maintain the current protocol limiting intervention to salpingectomy in cases where the tube is pathological. We should, however, direct the administration to ensure patients are fully counseled on why this specific limitation exists, framing it not as a refusal of care, but as a commitment to a specific standard of ethical practice that distinguishes between treating maternal pathology and terminating embryonic life.
