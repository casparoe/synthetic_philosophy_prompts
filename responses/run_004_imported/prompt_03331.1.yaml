      *   **The Core Tension:** Explain *why* the models demand omniscience. It's about closure under implication. In Bayesianism, $P(A) = 1$ for tautologies. In Possible Worlds, if $w$ is accessible, it must be logically consistent.
      *   **Why it's not just a "Frictionless Plane":** In physics, the idealization approximates reality well enough for prediction. In epistemology, the idealization *removes the phenomenon of interest* (learning, discovery, deduction). If you know all consequences, deduction is useless.
      *   **The Fixes (and the Catch-22):**
          *   *Impossible Worlds:* The "Truth vs. Structure" trade-off. To allow $A \land \neg A$, you break the logic that makes the model useful. It becomes too flexible (fits anything).
          *   *Awareness Logic:* The "Black Box" problem. It names the limitation but doesn't model the mechanism. It's descriptive, not explanatory.
          *   *Logical Induction:* The "Computational Cost" problem. It works but is essentially a simulation of bounded reasoning, not a clean semantic update. It replaces "omniscience" with "asymptotic correctness," which is great for AI but hard to map to human belief states.
      *   **The Deep Reason it's Stubborn:** The "Normative vs. Descriptive" clash. Logic tells us how we *should* reason. Psychology tells us how we *do*. Bridging them requires a theory of *computation* embedded in *semantics*.
      *   **Conclusion:** Summarize. It's an open problem because it sits at the intersection of logic, computation, and psychology.

  5.  **Refining the Tone:**
