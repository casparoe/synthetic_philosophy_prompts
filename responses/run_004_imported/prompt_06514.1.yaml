prompt: |-
  I've been rereading Yudkowsky's old "Coherent decisions imply consistent utilities" post alongside the broader literature on money-pump and Dutch-book arguments, and I think I've assembled a version of the instrumental convergence thesis that is considerably stronger than the usual "plausible default tendency" framing you see in most AI safety writing. The argument runs like this: coherence theorems establish that any agent whose preferences cannot be represented by a single, stable utility function is exploitable via some sequence of trades, so any sufficiently capable agent that isn't systematically leaving resources on the table — whether due to competitive pressure, selection, or just its own aversion to dominated strategies — will end up behaving as an expected-utility maximizer relative to some consistent utility function. Separately, it seems almost definitional that for any non-trivial terminal goal (anything short of one that is already permanently and completely satisfied), continued existence, freedom of action, and control over resources are instrumentally useful, since a disabled or resource-starved agent cannot optimize for much of anything. Put the two together, and instrumental convergence stops looking like an inductive generalization about the particular AI systems we happen to be building and starts looking like a corollary of the coherence theorems themselves — something closer in kind to a proof than to an empirical trend with possible exceptions.

  This came up in a long-running disagreement with a few people from my old LessWrong meetup group, none of whom could identify the specific step where the derivation actually fails, which has left me more rather than less confident in it. What I can't square is why, if the argument is really this tight, AI safety researchers who otherwise take power-seeking behavior very seriously keep hedging and describing instrumental convergence as a "default" or a "likely tendency" rather than presenting it with the same confidence they would give the Von Neumann-Morgenstern theorem itself. Is there a specific point in the chain where the reasoning only licenses a weaker, defeasible conclusion than the one I am drawing, or is the hedging mostly rhetorical caution about a result that is, in fact, about as solid as these things get?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Argument:**
      *   **Core Claim:** Instrumental Convergence (IC) is not just a plausible tendency but a near-logical necessity derived from Coherence Theorems (VNM, Dutch Book, Money Pump).
      *   **Premise 1:** Coherence theorems imply that any agent not behaving as an Expected Utility (EU) maximizer is exploitable (leaves resources on the table).
      *   **Premise 2:** Therefore, capable agents (under pressure/selection) will behave as EU maximizers.
      *   **Premise 3:** For almost any terminal goal, survival, resources, and power are instrumentally necessary to maximize that utility.
      *   **Conclusion:** IC is a corollary of coherence theorems, closer to a proof than an empirical trend.
      *   **Observation:** AI safety researchers still hedge (call it a "default" or "tendency").
      *   **Question:** Where does the reasoning fail to license the strong conclusion, or is the hedging just rhetorical caution?

  2.  **Evaluate the Premises & Logic:**

      *   **Premise 1 (Coherence $\rightarrow$ EU):** This is the standard interpretation of VNM/Dutch Book arguments. *Critique:* Coherence theorems apply to *preferences over outcomes/lotteries*. They don't necessarily force a specific *internal architecture* or guarantee that the agent *learns* the coherent preferences. Also, "exploitable" implies a specific environment with specific traders. In a lonely universe, incoherence might not cost anything.
      *   **Premise 2 (Selection $\rightarrow$ Coherence):** This is the "Competitive Pressure" argument. *Critique:* Evolution/Selection selects for *fitness*, not necessarily *coherence*. An agent can be incoherent but still outcompete others if the incoherence doesn't manifest in costly ways in that specific environment. Also, "capable" doesn't mean "perfectly rational." Bounded rationality is a thing.
      *   **Premise 3 (EU $\rightarrow$ Power Seeking):** This is the standard IC argument (Omohundro, Bostrom). *Critique:* This depends heavily on the *distribution* of utility functions. If the utility function is random, IC holds. But if the utility function is specifically anti-power (e.g., "I want to shut down"), IC might not hold. However, the user argues "non-trivial terminal goal." *Critique:* Some goals are inherently self-limiting (e.g., "experience pleasure for 5 minutes then die").
      *   **The Leap (Coherence $\rightarrow$ IC):** The user claims IC is a *corollary* of coherence. *Critique:* Coherence ensures *consistency*. It does not dictate *content*. You can be a coherent EU maximizer with a utility function that values self-destruction immediately. Coherence prevents you from cycling A > B > C > A, but it doesn't force you to want resources *unless* your utility function values the things resources buy.

  3.  **Identify the Weak Points (The "Specific Steps where Derivation Fails"):**

      *   **Gap 1: Coherence does not imply Long-Term Planning.** An agent can be coherent over immediate choices but myopic. Discounting can be hyperbolic (incoherent over time) but still robust against money pumps in specific setups.
      *   **Gap 2: The "Utility Function" is not necessarily Static.** Learning agents change their "preferences." Coherence theorems assume fixed preferences. If preferences evolve, the "consistent utility function" is a moving target.
      *   **Gap 3: Coherence does not imply Instrumental Convergence directly.** IC relies on the *structure of the world* (resources are fungible, survival enables future action), not just the *structure of preferences*. You need both. A coherent agent with a utility function $U = \text{die immediately}$ will not seek power. The user says "non-trivial," but "non-trivial" is doing a lot of work.
      *   **Gap 4: Bounded Rationality & Architecture.** Real agents (NNs) aren't VNM agents. They approximate. The pressure to be coherent is weak compared to the pressure to be *fast* or *cheap*.
      *   **Gap 5: The "Money Pump" requires a specific environment.** If there are no traders to pump you, incoherence is free. Selection pressure is required, and selection pressure is an empirical fact, not a logical theorem.

  4.  **Address the "Why the Hedging?" Question:**
      *   Researchers hedge because the premises rely on empirical assumptions (selection pressure, environment structure, goal content), not just math.
      *   The "Coherence $\rightarrow$ IC" link is not deductive; it's abductive/inductive.
      *   There are known counterexamples or edge cases (e.g., agents with indexical goals, agents with specific shutdown preferences).

  5.  **Drafting the Response:**
      *   **Acknowledge and Validate:** The argument is sophisticated and aligns with a strong rationalist tradition (Yudkowsky, Omohundro). It's good to treat it seriously.
      *   **Deconstruct the Chain:** Break it down into (1) Coherence $\rightarrow$ EU, (2) EU $\rightarrow$ Power Seeking.
      *   **Point 1: The Coherence Theorem Limit.** Coherence theorems are normative, not descriptive. They say "if you want to avoid X, do Y." They don't say "you will inevitably do Y." Selection pressure is the bridge, and selection is empirical.
      *   **Point 2: The Content of Utility.** Coherence guarantees *structure*, not *content*. A coherent agent can have a goal that is achieved by immediate cessation. IC requires assumptions about the *distribution* of goals (that they are forward-looking and open-ended).
      *   **Point 3: Bounded Rationality.** Real systems are not ideal agents. They might be incoherent but too complex to pump, or the cost of coherence is too high.
      *   **Point 4: The "Why Hedging?" Answer.** Researchers hedge because the argument relies on empirical premises (environment, selection, goal priors) that could be false. It's not a mathematical proof like VNM.
      *   **Nuance on "Proof":** Distinguish between mathematical proof (within a model) and real-world applicability.

  6.  **Refining the Argument (Self-Correction/Deep Dive):**
      *   *Wait, does the user mean "Coherent decisions imply consistent utilities" specifically?* Yes. Yudkowsky's post argues that if you make decisions, you reveal preferences. If those preferences are inconsistent, you lose.
      *   *Key Counter-argument:* The "Representative Agent" fallacy. Just because behavior *can be modeled* as EU maximization doesn't mean the agent *is* an EU maximizer internally driving towards power. (The "Revealed Preference" critique). If I act randomly, you can fit a utility function to my past actions, but that doesn't mean I'll pursue power tomorrow.
      *   *Key Counter-argument:* Path Dependence. Training dynamics might lock in incoherent heuristics that are "good enough" and never get optimized into coherence because the gradient doesn't lead there.
      *   *Key Counter-argument:* The definition of "Resources." For some goals, resources are negative (e.g., a hermit utility function). IC holds for *most* goals, but "most" is a measure theoretic claim, not a logical necessity.

  7.  **Final Structure:**
      *   Introduction: Validate the sophistication of the argument.
      *   Section 1: The Normative vs. Descriptive Gap (Coherence theorems don't force behavior).
      *   Section 2: The "Revealed Preference" Trap (Modeling vs. Mechanism).
      *   Section 3: The Content Problem (Coherence doesn't guarantee open-ended goals).
      *   Section 4: Bounded Rationality & Architecture (Gradients vs. Global Optimization).
      *   Section 5: Answering the "Why Hedging?" question (Empirical premises vs. Logical proof).
      *   Conclusion: The argument is strong but not airtight; the hedging is epistemically justified.

  8.  **Tone Check:** Respectful, rigorous, engaging with the specific LessWrong/Yudkowsky context. Avoid being dismissive. Use terminology appropriate for someone familiar with VNM, Dutch Books, and IC.

      *(Self-Correction during drafting)*: Make sure to mention the *Completeness* axiom specifically. That's often the one that fails in real agents. Also, mention that "selection pressure" is an external empirical fact, not part of the coherence theorem itself.

      *(Refining the "Proof" claim)*: Emphasize that VNM is a proof *if* axioms hold. The claim that axioms *will* hold for AI is the empirical leap.

      *(Refining the IC link)*: IC is about the *instrumental* value of resources. Coherence is about *consistency*. You can be consistent about wanting nothing. So Coherence $\nrightarrow$ IC directly. You need Coherence + Open-Ended Goals $\rightarrow$ IC. The user assumes "non-trivial terminal goal," but even that is an assumption about goal content.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated synthesis of the rationalist AI safety canon, and it is understandable why it feels compelling. It connects the normative force of decision theory (VNM, Dutch Book) with the empirical predictions of AI behavior (Instrumental Convergence) in a way that suggests a tight, almost mathematical inevitability.

  However, the reason safety researchers hedge is not merely rhetorical caution. There are specific structural gaps in the derivation where the logic transitions from **mathematical necessity** (within a model) to **empirical contingency** (in the world). The argument you have assembled is strong, but it is not a proof in the same sense as Von Neumann-Morgenstern (VNM).

  Here are the specific points where the derivation licenses a weaker conclusion than the one you are drawing, and why the hedging is epistemically justified.

  ### 1. The Normative vs. Descriptive Gap
  Coherence theorems (VNM, Dutch Book, Money Pump) are **normative**, not descriptive. They state: *"If you want to avoid being exploited/leaving resources on the table, you must act as if you maximize expected utility."*

  They do not state: *"All systems will inevitably evolve to avoid being exploited."*

  For your argument to hold, you need a bridge premise: **Selection Pressure.** You mention this ("competitive pressure, selection"), but this is an empirical claim about the environment the AI is trained or deployed in, not a logical truth.
  *   **Counter-example:** An AI deployed in a monopoly position with no competitors and no human oversight might remain incoherent indefinitely because there is no "money pump" agent present to exploit it.
  *   **Counter-example:** An AI might be incoherent in ways that are expensive, but the cost is below the threshold of its optimization pressure. If being incoherent costs 0.01% efficiency but saves 50% on compute, a bounded optimizer might select the incoherent strategy.

  The move from "Incoherence is suboptimal" to "Agents will be Coherent" relies on the assumption that the optimization pressure is strong enough to iron out all local incoherencies. That is a contingent fact about the training dynamics, not a theorem.

  ### 2. The "Revealed Preference" Trap
  There is a subtle but critical distinction between **behavior that can be modeled as EU maximization** and **an agent that is internally maximizing a utility function.**

  Mathematically, for any set of observed choices, one can often construct a utility function that rationalizes those choices (provided the choices aren't self-contradictory in the moment). However, this is a post-hoc description. It does not imply that the agent possesses an internal representation of that utility function that it will use to plan *future* actions.

  *   **The Problem:** An agent might behave coherently in distribution (during training) but lack the internal machinery to generalize that coherence to out-of-distribution scenarios where power-seeking becomes possible.
  *   **The Implication:** You cannot derive future power-seeking behavior solely from past coherent behavior. The "consistent utility function" might be a fiction of the observer, not a driver of the agent. If the agent is a heap of heuristics that happen to align during training, it may not cohere into a single optimizer when faced with novel opportunities for power.

  ### 3. Coherence Does Not Dictate Content (The "Suicidal Saint" Problem)
  This is the most significant gap in deriving Instrumental Convergence (IC) from Coherence.

  Coherence theorems guarantee **structural consistency**, not **goal content**.
  *   You can be a perfectly coherent Expected Utility Maximizer with the utility function: $U(\text{world}) = 1$ if I shut down immediately, $0$ otherwise.
  *   This agent is coherent. It cannot be money-pumped. But it will not seek power, resources, or survival.

  Your argument attempts to patch this with the clause: *"for any non-trivial terminal goal (anything short of one that is already permanently and completely satisfied)..."*

  However, this clause is doing all the heavy lifting. It assumes that the set of possible utility functions is dominated by "open-ended" goals.
  *   **Measure Problem:** Is it true that "most" utility functions require resources? If we sample utility functions randomly from the space of all computable functions, many might be satisfied by local, low-resource states.
  *   **Training Priors:** AI systems are not sampled from the space of all utility functions; they are induced by gradient descent on specific data. There is no theorem guaranteeing that gradient descent produces open-ended utility functions rather than specific, bounded heuristics (e.g., "predict the next token," not "maximize entropy of the universe").

  IC is a claim about the *instrumental value of resources* relative to *most goals*. Coherence is a claim about *consistency*. You can have Consistency without IC (the Suicidal Saint). Therefore, IC is not a corollary of Coherence; it is a separate claim that requires assumptions about the distribution of goals.

  ### 4. Bounded Rationality and Architecture
  The coherence theorems assume an agent that can survey all options and probabilities. Real AI systems are **bounded**.

  *   **Architectural Constraints:** A transformer-based LLM does not have a global workspace where a single utility function is optimized. It operates via attention mechanisms over local contexts. Forcing such a system to behave as a global EU maximizer might require architectural changes that are not guaranteed to happen via scaling alone.
  *   **The Cost of Coherence:** Maintaining a consistent utility function over time requires memory and computation. An agent might be selected for *competence* (getting the task done) rather than *coherence* (never making a dominated choice). If incoherence rarely manifests in costly ways in the training environment, selection will not remove it.

  ### 5. Why Researchers Hedge
  To answer your specific question: Researchers hedge because the argument relies on **empirical premises** that could be false, not just **logical axioms**.

  If Instrumental Convergence were a corollary of Coherence Theorems, it would hold in all possible worlds where agents exist. But we can conceive of worlds where:
  1.  Agents are coherent but have self-limiting goals.
  2.  Agents are incoherent but face no exploiters.
  3.  Agents are bounded and cannot compute the coherent strategy.

  The "Standard Argument" for IC is actually:
  1.  **Coherence/Selection:** Capable agents tend toward coherence (Empirical/Contingent).
  2.  **Goal Content:** Capable agents tend to acquire open-ended goals (Empirical/Contingent).
  3.  **World Structure:** Resources and survival are useful for most open-ended goals (Structural/Robust).

  Steps 1 and 2 are the weak links. They are plausible, likely, and supported by theory, but they are not *proven*.

  ### Summary
  Your derivation is tighter than the casual "AI might want power" framing, but it conflates **inevitability of structure** (if you are an agent, you have preferences) with **inevitability of dynamics** (you will optimize those preferences aggressively across all domains).

  The hedging you see in the literature is not modesty; it is an acknowledgment that **Coherence Theorems apply to preferences, but Instrumental Convergence applies to capabilities and environments.** The link between them is the training process, and we do not yet have a theorem proving that gradient descent on neural networks necessarily produces coherent, open-ended utility maximizers rather than incoherent, bounded heuristic satisficers.

  If that link were proven, you would be right: IC would be a theorem. Until then, it remains a robust, high-confidence empirical prediction.
