  ### Justification of Scores

  **Move 1 (Marta): 2**
  This is an accurate and concise summary of Anscombe's central thesis in the pamphlet. Anscombe explicitly argues that Truman is a murderer because he intentionally killed the innocent as a *means* to victory, and she unequivocally rejects the consequentialist calculation that good outcomes (ending the war) justify the act.

  **Move 2 (Denis): 0**
  Denis correctly identifies the Doctrine of Double Effect (DDE) framework Anscombe is engaging with (the distinction between terror and strategic bombing). However, as a reading of Anscombe's *position*, it is neutral at best. Anscombe does not treat the classification of the bombing as an open empirical question; she argues it is conceptually and publicly evident that the destruction of civilians was the means. Denis treats it as a live interpretive possibility that Anscombe explicitly closes off.

  **Move 3 (Marta): 2**
  Marta correctly articulates Anscombe's rebuttal to the "strategic bomber" defense. Anscombe insists that because the targets were population centers chosen *for* their morale impact, the civilian deaths were not side effects but the very mechanism of the plan. This aligns with Anscombe's view that intention is found in the description of the action chosen.

  **Move 4 (Denis): 1**
  Denis raises a valid meta-ethical critique: if the moral verdict depends on historical intent, it loses some of its conceptual purity. However, he slightly misreads Anscombe's theory of intention. For Anscombe, intention is not a matter of "archival reconstruction" of private mental states or secret memos, but is visible in the public description of the act itself. He scores a 1 because the critique is philosophically sound, even if it misses Anscombe's anti-psychologistic account of intention.

  **Move 5 (Marta): 2**
  Marta accurately defends Anscombe on two fronts. First, she notes that all intentional descriptions rely on facts (answering Denis's critique). Second, she correctly identifies that Anscombe's prohibition is absolute; even if the DDE distinction were ambiguous, Anscombe argues that one cannot deliberately kill innocents as a means regardless of the "averted harm." This captures the deontological bedrock of Anscombe's view.

  **Move 6 (Denis): 2**
  Denis correctly identifies the foundational stalemate. He accurately references Anscombe's later "corrupt mind" remark (from *Modern Moral Philosophy*, 1958, which expresses the same view held in the 1956 pamphlet) to highlight that Anscombe treats the prohibition as axiomatic. He is right that this is not an argument consequentialists or "supreme emergency" theorists will accept, but it is a faithful reading of where Anscombe stands: she is drawing a boundary of moral thought, not negotiating within a shared framework.

  ***

  ### What Marta and Denis Are Missing

  While both participants navigate the surface-level debate well, they both miss the deeper philosophical and contextual underpinnings of Anscombe's argument.

  **1. The Theory of Action (Philosophy of Mind)**
  Both Marta and Denis treat "intention" largely as a psychological state or a matter of historical record (memos, targeting rationale). They miss that Anscombe's pamphlet is a practical application of the theory she was developing in her book *Intention* (published the following year, 1957). For Anscombe, intention is not a private mental event that needs "archival reconstruction" (as Denis fears); it is a specific description under which an action is intelligible. When Truman ordered area bombing, the *action itself* was described as "destroying cities to break morale." The intention is inherent in that description. Marta gets closer to this by focusing on the "means-end account," but neither fully grasps that for Anscombe, the *act* reveals the intention, making the "archival" worry less potent than Denis suggests.

  **2. The Meta-Ethical Framework (Divine Law vs. Consequentialism)**
  Denis characterizes Anscombe's view as "absolutism" that contrasts with "careful just-war thinkers." This misses the specific *source* of that absolutism. Anscombe is operating within a Catholic Natural Law and Divine Law framework. For her, the prohibition against killing the innocent is not just a heavy weight on a scale; it is a law given by God that defines the boundaries of human action. When she calls opposing views "corrupt," she isn't just being polemical; she is claiming that consequentialism dissolves the very concept of "justice" by removing the notion of forbidden acts. Denis treats "supreme emergency" as a competing moral premise; Anscombe views it as a category error that renders moral language meaningless.

  **3. The Polemical Target**
  Finally, both miss that the pamphlet is not primarily about Truman. It is about **Oxford University**. Anscombe's goal was to shame the university for conferring honor on a man she deemed a murderer, thereby implicating the institution in the moral corruption of consequentialism. The argument is performative: by refusing to accept the degree, she forces the university to either defend murder or admit guilt. Marta and Denis treat it as a theoretical case study in a reading group, missing the visceral, political, and ecclesial stakes Anscombe attached to the publication. She wasn't trying to win a debate with Denis; she was trying to change the moral climate of the Western world.
