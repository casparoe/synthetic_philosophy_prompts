answer: |-
  Your uncle is half-right, but he is oversimplifying a very complex part of Aquinas's political thought, and he is definitely wrong about it being "settled Catholic teaching."

  If you want to push back politely but firmly next time, here is the breakdown of what Aquinas actually wrote, where your uncle is getting his idea, and why the "Valkyrie" scenario is theologically messy.

  ### 1. What Aquinas Actually Wrote
  Aquinas addresses tyranny primarily in two places: *De Regno* (On Kingship) and the *Summa Theologiae*. His position is much more cautious than your uncle suggests.

  **In *De Regno* (Book I, Chapter 6):**
  Aquinas asks: "What is to be done about a tyrant?"
  *   **Endurance vs. Risk:** He argues that if the tyranny is not excessive, it is often better to endure it temporarily than to attempt to remove it. Why? Because the attempt to remove a tyrant often provokes him to greater cruelty, or the removal process itself causes civil strife and disorder that is worse than the tyranny.
  *   **Private vs. Public:** This is the big one. Aquinas explicitly argues that **private individuals** should not take it upon themselves to kill a ruler. He writes that if a ruler is tyrannical, action must be taken by **public authority**, not private presumption.
  *   **Usurpers vs. Legitimate Rulers:** Aquinas makes a distinction between a tyrant by *exercise* (a legitimate king who rules badly) and a tyrant by *usurpation* (someone who seized power illegitimately). He is slightly more open to resistance against a usurper, but even then, he prefers a legal or public process over assassination.

  **In *Summa Theologiae* (II-II, Q. 42, Article 2):**
  He discusses sedition. He argues that resisting a tyrant is not necessarily sedition (a sin against unity), *provided* that the resistance does not cause greater harm to the community than the tyranny itself. However, he does not issue a blanket moral permission for assassination.

  **The Takeaway:** Aquinas does **not** teach that killing a tyrant is inherently "virtuous." He teaches that tyranny is a sin, but the remedy must be carefully weighed to ensure it doesn't cause more evil. He specifically warns against private citizens becoming vigilantes.

  ### 2. Where Your Uncle Gets His Idea
  Your uncle isn't inventing this out of thin air; he is likely reading Aquinas through the lens of later Scholastics.

  In the 16th and 17th centuries, theologians of the **School of Salamanca** (like Francisco Suárez and Juan de Mariana) and certain **Jesuit controversialists** developed "resistance theory" more robustly than Aquinas did. They were arguing against absolute monarchs in Europe. Some of *them* argued more explicitly for tyrannicide under specific conditions.

  Over time, Catholic political tradition blended Aquinas with these later thinkers. Your uncle is attributing the later, more aggressive resistance theory back to Aquinas. Aquinas planted the seed (tyranny is against the common good), but later thinkers grew the tree (therefore, we can kill the tyrant). Aquinas himself was much more conservative about political order.

  ### 3. Is It "Settled Catholic Teaching"?
  **No.** This is the easiest point to push back on.

  There is no dogma and no "settled teaching" in the Catholic Church that mandates or explicitly permits tyrannicide.
  *   **The Catechism:** The *Catechism of the Catholic Church* (paragraph 2243) speaks about armed resistance. It says it is legitimate to resist when certain grave conditions are met (certainty of tyranny, exhaustion of other means, etc.), but it speaks of "resistance," not specifically assassination.
  *   **Modern Papacy:** In the 20th century, Popes were very careful about this. During WWII, Pius XII never explicitly endorsed the assassination of Hitler, focusing instead on the morality of the war itself and the protection of innocents.
  *   **Moral Theology:** Standard Catholic moral theology treats the killing of a head of state under the principles of **legitimate defense** and **double effect**. It is permissible only if it is the *only* way to stop an imminent grave evil and if the act itself doesn't involve intrinsic evil (like treason or breaking a sworn oath, which was a major complication for the *Valkyrie* plotters who had sworn an oath of loyalty to Hitler).

  ### 4. The *Valkyrie* Complication
  The *Valkyrie* plot adds a layer your uncle might be ignoring: **The Oath.**

  The German officers, including Stauffenberg, had sworn a personal oath of allegiance to Hitler. In Catholic moral theology (and Aquinas specifically), keeping a promise/oath is a serious virtue (part of Justice).
  *   Aquinas would ask: Does the tyranny void the oath?
  *   Many theologians argue yes, because the oath is to the *office* and the *law*, not to a criminal acting against the law.
  *   However, others argue that breaking a sworn oath creates a scandal regarding the reliability of promises.

  So, even if killing Hitler was justified to save lives (which most agree it was), the *method* involved oath-breaking, which requires moral agonizing. Your uncle's claim that "anyone who agonizes just doesn't know their Aquinas" is dismissive of a genuine moral conflict that Aquinas himself would have recognized.

  ### Summary for Your Next Dinner
  You don't need to be a theologian to hold your ground. Here is a script you can adapt:

  > "I looked into Aquinas after our last conversation. It turns out he's actually more cautious than you said. In *De Regno*, he specifically warns against private individuals killing rulers because it often makes things worse. He says if a tyrant must be removed, it has to be done by public authority, not private assassination.
  >
  > Also, the Church doesn't have a 'settled teaching' on tyrannicide. Later Scholastics argued for it more than Aquinas did. So, agonizing over it isn't ignorance; it's actually respecting the complexity Aquinas warned about regarding civil disorder and oaths."

  **The Verdict:** Your uncle is right that tyranny is a great evil, but he is wrong that Aquinas gave a simple "green light" for killing tyrants, and he is definitely wrong that it is settled dogma. Aquinas would likely have respected the *intent* of the *Valkyrie* plotters but would have worried deeply about the chaos of the method and the breaking of oaths.
