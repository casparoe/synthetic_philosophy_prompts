      *   **Key Distinctions:** Usurper vs. Legitimate Ruler turned Tyrant. Private vs. Public Authority.
      *   **The "Settled Teaching" Claim:** Address whether this is official Catholic dogma (it's not).
      *   **Historical Context:** How later thinkers (Jesuits, etc.) interpreted him vs. what he actually wrote.
      *   **Conclusion:** Summary for the user to use in conversation.

  4.  **Fleshing out the Details (Mental Sandbox):**
