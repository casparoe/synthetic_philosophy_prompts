      *   *Catholic Teaching:* There is no "settled teaching" on tyrannicide. The Catechism speaks on legitimate defense but doesn't give a green light for political assassination. Pius XII and others were cautious about resistance movements.

  5.  **Refining the Argument (Self-Correction/Nuance):**
