prompt: |-
  My family did movie night last week with Valkyrie (the one about the German officers who tried to assassinate Hitler), and it turned into a whole argument with my uncle, who's big into Catholic theology. He kept insisting that Aquinas basically settled this centuries ago: that killing a genuine tyrant isn't just permitted, its actually the virtuous thing to do and settled Catholic teaching, and that anyone who agonizes over it just doesn't know their Aquinas. I didn't have the background to push back in the moment, and it's been bugging me since. Is that actually Aquinas's position? I'd like to get the real argument so I'm not just nodding along next time this comes up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Family movie night watched *Valkyrie* (plot to assassinate Hitler).
      *   **Conflict:** Uncle (Catholic theology enthusiast) claimed Thomas Aquinas definitively taught that killing a genuine tyrant is not just permitted but *virtuous* and "settled Catholic teaching." He dismissed hesitation as ignorance of Aquinas.
      *   **User's Goal:** Wants to know if this is actually Aquinas's position and wants the "real argument" to push back (or understand) next time.
      *   **Tone:** Informative, nuanced, historically accurate, theological/philosophical precision.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
