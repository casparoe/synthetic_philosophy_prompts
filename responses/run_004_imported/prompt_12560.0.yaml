      *   *Summa Theologiae (II-II, Q. 42, Sed Contra):* He discusses sedition. He says resisting a tyrant isn't sedition *unless* it causes more harm. But he doesn't explicitly endorse assassination.
      *   *Usurpers:* He is more lenient on killing a usurper (someone with no right to rule) than a legitimate king who rules badly.
