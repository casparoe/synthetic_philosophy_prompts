      *   *Does (6) show standing wasn't doing work?* It shows standing doesn't affect the *truth* of the claim. But standing affects the *uptake* of the blame. If Marcus means "We shouldn't listen to Odell," Priyanka is right that's silencing. If Marcus means "Odell shouldn't act as the moral enforcer," he's right. Priyanka conflates "listening to an argument" with "granting moral authority."
