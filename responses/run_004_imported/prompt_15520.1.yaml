  My cousin, the philosophy PhD, says it's the classic tension: traditional ethics calls it *supererogation*—like leaving a 50% tip. But the Peter Singer crowd says if the benefit is huge and the cost is low, it's obligatory—like paying the bill.

  So I'm stuck in this moral no-man's-land. I can't accept the "Hero" cake, because that implies I had a choice. But if I admit it was mandatory, it sounds like I'm under investigation.

  I told my aunt, "Look, I didn't buy a round for the house, I just paid my tab."
  She patted my hand and said, "Well, at least you didn't dine and dash."

