  9.  **Self-Correction during drafting:** I initially thought about suggesting specific policy changes. But the user is a researcher. I should focus more on the *analysis* of the problem to help their PhD argument, rather than acting as a policy consultant. I will frame the alternatives as "what the literature suggests" rather than "what you should do."

  10. **Final Review against Safety Guidelines:** Does this promote harm? No. Does it discourage legal processes? No, it critiques the *methodology* of assessment within legal processes. It aligns with human rights standards (UNHCR guidelines).

  *(Self-Correction Note)*: I need to be careful not to validate the idea that *all* calm people are truthful or *all* distressed people are lying. The point is that these *indicators* are unreliable, not that the inverse is true. The argument is against using emotional performance as evidence.

