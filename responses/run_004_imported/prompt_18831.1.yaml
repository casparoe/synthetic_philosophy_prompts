answer: |-
  This is a profound and well-documented observation, and your unease is theoretically and ethically well-founded. You are touching upon one of the central critiques in critical migration studies, legal anthropology, and refugee law: the **epistemology of credibility**.

  Your caseworker friend's defense ("we have to judge somehow") relies on a conflation of the *necessity of a decision* with the *validity of the criteria used to make that decision*. While it is true that states must adjudicate claims, it does not follow that any heuristic used to do so is legitimate, especially when that heuristic contradicts established scientific knowledge and leads to systemic injustice.

  Here is a breakdown of exactly what is wrong with this practice, structured to help you articulate the problem in your PhD work, followed by an analysis of why the "due diligence" defense fails.

  ### 1. The Epistemic Injustice of "Trauma Scripts"
  The primary error is the imposition of a specific **affective script** on the asylum seeker. The system operates on a folk-psychological assumption of how a "true" victim *should* behave.

  *   **The "Ideal Victim" Trope:** As scholars like **Didier Fassin** and **Richard Rechtman** have argued, modern asylum regimes often require the performance of suffering. The applicant is expected to embody the role of the "ideal victim"—visibly broken, emotionally volatile, and helpless. When an applicant remains calm, they are read as retaining too much agency, which is interpreted as suspicious.
  *   **Psychological Invalidity:** As you noted, this contradicts clinical understandings of trauma.
      *   **Dissociation:** Many survivors cope through emotional numbing or dissociation during recounting. Calmness can be a symptom of severe PTSD, not a lack of it.
      *   **Memory Fragmentation:** Traumatic memory is often stored non-linearly (sensory fragments rather than narrative chronology). Expecting linear consistency ignores how the hippocampus functions under extreme stress.
      *   **Rehearsal:** Consistency is often a result of having told the story multiple times (to smugglers, lawyers, family) or coaching for safety. Inconsistency can be a sign of memory recovery. By penalizing consistency, the system punishes those who have sought help.

  **Theoretical Frame:** You might find **Miranda Fricker's** concept of **Hermeneutical Injustice** useful here. The asylum seekers lack the collective interpretive resources to make their experience understood (e.g., explaining their cultural stoicism), while the caseworkers possess the power to define what counts as "credible" based on flawed hermeneutical resources (folk psychology).

  ### 2. Cultural Bias and Affective Norms
  The assessment of credibility is not culturally neutral. It is rooted in Western, liberal notions of individualism and emotional expressivity.

  *   **Display Rules:** In many cultures, displaying intense emotion to a state authority is seen as disrespectful, dangerous, or shameful. Stoicism may be a sign of dignity, not deception.
  *   **Power Dynamics:** The interview room is a space of extreme power asymmetry. A calm demeanor might be a strategic adaptation to authority (a "fawn" or "freeze" response), whereas distress might be read as a loss of control that paradoxically signals "truth" to a Western observer expecting catharsis.
  *   **The Interpreter's Role:** As an interpreter, you are the bridge across this gap. When the caseworker misreads the affect, they are essentially misreading the culture. The system treats the interview as a transparent window into truth, ignoring that it is a cross-cultural interaction laden with translation issues (both linguistic and cultural).

  ### 3. The Institutional Logic of Disbelief
  Your friend's comment about "due diligence" obscures the institutional orientation of the asylum process.

  *   **Adversarial vs. Inquisitorial:** While asylum is theoretically inquisitorial (the state has a duty to protect), in practice, it often functions adversarially. The burden of proof is shifted almost entirely onto the applicant. The default position is often skepticism until "genuineness" is performed.
  *   **Bureaucratic Violence:** The requirement to perform trauma to be believed can be understood as a form of bureaucratic violence. It forces the applicant to re-traumatize themselves (by inducing distress) to satisfy the administrative requirement for legitimacy.
  *   **Risk Management:** Caseworkers are often working under pressure with high stakes. If they grant status to a "liar," they face professional scrutiny. If they reject a "truth-teller," the consequence (deportation) is distant and abstract. This creates an institutional incentive to prioritize **false positives** (catching liars) over **false negatives** (protecting refugees), leading to hyper-skepticism.

  ### 4. Why "We Have to Judge Somehow" Fails as a Defense
  Your friend's argument is a version of the **Necessity Fallacy**. It conflates the *need for a verdict* with the *legitimacy of the method*.

  *   **Analogy:** Imagine a medical diagnosis where doctors believe that "patients who scream are sick, and patients who are calm are faking." If a medical researcher pointed out that pain presentation varies by culture and condition, the doctor could not validly reply, "We have to diagnose somehow." The necessity of diagnosis does not justify using a thermometer that measures the wrong thing.
  *   **Available Alternatives:** The argument implies there are no other tools. However, international guidelines (such as UNHCR guidelines on credibility) explicitly warn against relying on emotional demeanor. Alternatives include:
      *   Greater reliance on Country of Origin Information (COI).
      *   The "benefit of the doubt" principle when the account is coherent and plausible.
      *   Use of independent psychological expert reports (medico-legal reports) to contextualize demeanor.
  *   **Negligence:** If the psychological literature is clear that demeanor is unreliable, continuing to use it as a primary indicator is not "due diligence"; it is **professional negligence**. It suggests the system values administrative closure over accurate truth-finding.

  ### 5. Implications for Your Research
  For your PhD, this tension offers a rich site of analysis. You are positioned uniquely as a participant-observer who understands both the linguistic nuance and the bureaucratic constraints.

  *   **The "Truth Regime":** You could analyze the asylum interview not as a search for objective truth, but as a "regime of truth" (Foucault) where truth is produced through specific performances that align with state expectations.
  *   **The Interpreter's Burden:** You might explore the ethical burden on interpreters who witness this misalignment. Do you try to explain the cultural context? Do you remain neutral? Your fieldwork notes on your own internal conflict could be powerful data.
  *   **Structural vs. Individual:** Be careful not to frame this solely as caseworker bias. While individual bias exists, this is a **structural epistemology**. The caseworkers are trained (implicitly or explicitly) to look for these signs. They are agents of a system that demands legibility over complexity.

  ### Conclusion
  To answer your specific question: **Yes, something specific and troubling is going on.** It is the substitution of *evidence* with *performance*.

  The practice is wrong because it relies on discredited psychological assumptions, enforces cultural hegemony, and creates a "catch-22" where the coping mechanisms of trauma (numbing, fragmentation) are used as evidence against the survivor.

  "We have to judge somehow" does not answer the worry because it refuses to engage with *how* the judgment is made. It treats a flawed heuristic as an inevitable law of nature rather than a policy choice. A just system would acknowledge the limits of credibility assessment and adjust the standard of proof accordingly, rather than demanding that victims perform their pain in a way that makes the bureaucrat feel comfortable.

  **Suggested Reading for your Theoretical Framework:**
  *   **Didier Fassin:** *Enforcing Order: An Ethnography of Urban Policing* (and his work on humanitarian reason).
  *   **Miranda Fricker:** *Epistemic Injustice: Power and the Ethics of Knowing*.
  *   **Jenny Edkins:** *Trauma and the Memory of Politics*.
  *   **UNHCR Guidelines:** *Beyond Proof: Credibility Assessment in EU Asylum Systems* (specifically the sections warning against demeanor).
  *   **Katherine E. Brown:** Work on affect and security.

  Your intuition is correct: this is not just an imperfect heuristic; it is a mechanism of exclusion disguised as rigorous assessment.
