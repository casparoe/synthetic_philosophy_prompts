prompt: |-
  As part of the fieldwork for my PhD in migration studies, I have spent the last year working as an interpreter during asylum interviews, which has given me a close view of how caseworkers judge applicants' credibility. I've noticed a pattern that troubles me: applicants who recount traumatic events calmly and consistently are often treated as coached or dishonest, while those who become visibly distressed, or whose accounts shift slightly between retellings, are read as more "genuine." Yet the psychological literature on trauma and memory suggests that neither calmness nor consistency is a reliable sign of fabrication, and that norms for displaying distress vary considerably across the cultures represented in these interviews. When I mentioned this to a caseworker friend, she said it is simply unavoidable due diligence: credibility has to be judged somehow, and interviewers cannot take every account at face value. I take her point, but I suspect something more specific, and more troubling, than an imperfect heuristic is going on. Could you help me work out exactly what, if anything, is wrong with this practice, and whether "we have to judge somehow" actually answers the worry?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** PhD candidate in migration studies.
      *   **Context:** Fieldwork involved working as an interpreter during asylum interviews for a year.
      *   **Observation:** A specific pattern in credibility assessment: Calm/consistent = coached/dishonest; Distressed/inconsistent = genuine.
      *   **Conflict:** This contradicts psychological literature on trauma/memory and ignores cultural variations in emotional expression.
      *   **Counter-argument:** A caseworker friend argues this is "unavoidable due diligence" (we have to judge somehow).
      *   **Task:** Help articulate *exactly* what is wrong with this practice and evaluate whether "we have to judge somehow" is a sufficient justification.

  2.  **Deconstruct the Core Problem:**
      *   The core issue is the *epistemology of credibility* in asylum procedures.
      *   It's not just about "mistakes"; it's about systemic bias, flawed psychological assumptions, and the power dynamics of the interview.
      *   The "calm = lying" vs. "distressed = truth" dichotomy is a specific trope often called the "ideal victim" narrative or "trauma expectations."

  3.  **Brainstorming the "What is Wrong" (The Critique):**
      *   *Psychological Invalidity:* Trauma affects memory differently (fragmentation vs. hyper-clarity). Dissociation can look like calmness. Rehearsal (consistency) is often necessary for safety, not deception.
      *   *Cultural Bias:* Western expectations of emotional performance (catharsis) vs. other cultural norms (stoicism, shame, respect for authority).
      *   *Institutional Logic:* The system is designed to detect lies (adversarial) rather than uncover truth (inquisitorial). It shifts the burden of proof onto the vulnerable.
      *   *The "Ideal Victim" Script:* Applicants are expected to perform trauma in a specific way to be legible to the state.
      *   *Consequences:* Wrongful rejections, refoulement, re-traumatization.

  4.  **Brainstorming the "We Have to Judge Somehow" (The Justification):**
      *   *Validity:* Yes, states have a right/obligation to manage borders and ensure protection goes to those who qualify.
      *   *Insufficiency:* "Having to judge" doesn't justify *how* you judge. If the tool is broken, using it because "we need a tool" is negligent.
      *   *Alternative:* Evidence-based guidelines, country of origin information, expert testimony, shifting the burden of proof.

  5.  **Structuring the Response:**
      *   **Validation:** Acknowledge the user's expertise and the significance of their observation. This is a well-documented phenomenon in critical migration studies.
      *   **Part 1: Diagnosing the Epistemic Injustice:** Break down *why* the current practice is flawed (Psychology, Culture, Institutional Bias).
      *   **Part 2: The "Ideal Victim" Trope:** Discuss the performative aspect of asylum.
      *   **Part 3: Evaluating the "Due Diligence" Defense:** Analyze the friend's argument. Distinguish between *necessity of judgment* and *validity of criteria*.
      *   **Part 4: Theoretical Frameworks:** Introduce concepts like "Epistemic Injustice" (Fricker), "Bureaucratic Violence," or "Affective Economies."
      *   **Part 5: Constructive Paths Forward:** What does the literature suggest as alternatives? (Evidentiary flexibility, psychological expertise).
      *   **Conclusion:** Summarize the ethical weight.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Refining the Psychology point:* Make sure to mention dissociation. Calmness isn't lack of emotion; it can be a survival mechanism.
      *   *Refining the Consistency point:* Memory is reconstructive. Trauma memories are often non-linear. Expecting linear consistency is unscientific.
      *   *Refining the Cultural point:* Use the term "affective norms."
      *   *Refining the Friend's Argument:* It's a "false necessity" argument. It conflates the *need for a decision* with the *method of decision-making*.
      *   *Theoretical Lens:* Miranda Fricker's "Epistemic Injustice" is perfect here. The applicant is not believed because they don't fit the hearer's framework. Also, Didier Fassin's work on "compassionate repression."

  7.  **Checking Tone:**
