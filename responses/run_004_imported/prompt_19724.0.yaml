answer: |-
  The lantern swung in its gimbals, casting a sickly yellow arc across the cabin table. Outside, the timbers of the *HMS Argonaut* groaned under the swell, a low, rhythmic complaint that had been the only music for three days.

  Mr. Vane, the ship's logician, sat with his hands flat on the wood. He was a man who ironed his shirts even at sea. Across from him, Reverend Halloway loosened his clerical collar, a glass of brandy untouched before him.

  "It is a matter of correspondence," Vane said. His voice was dry, precise. "The proposition *The Argonaut prevails at dawn* corresponds to the state of affairs that will obtain. Either it corresponds, or it does not. There is no third state. To deny this is to break the law of excluded middle."

  Halloway swirled the brandy. "To assert it is to break the will of God, or at least the will of men. You speak of correspondence, Mr. Vane. I speak of causality. If the statement is true *tonight*, then the battle is a script we are merely reciting. My prayers, your gunnery drills, the Captain's disposition of the line—they become theater. Props for a play already written."

  "You confuse truth with necessity," Vane said. He tapped the table. "This is the old error. Aristotle's error. Just because a statement is true, it does not mean the event is necessary. The sea is calm tonight. That is true. But it was not necessary. A storm could have risen. That it is calm does not mean it *could not* have stormed. Similarly, that we win does not mean we *could not* lose. It simply means we *will not*."

  Halloway leaned forward, the lantern light catching the worry lines around his eyes. "But *why* will we not? If the truth of the matter is fixed now, prior to the action, what work is left for our agency? You are positing a 'Thin Red Line,' are you not? I have read the treatises you leave in the mess. You claim there is one privileged branch of the future, distinct from all others, which bears the label of 'Actual.'"

  "It is not a label. It is ontology."

  "It is a cheat," Halloway countered softly. "It is looking at the history book after the fact and claiming the ink was dry before the battle. You say the proposition is true now. I say it is indeterminate. The future is a fan of possibilities. In some branches, we burn. In some, we take the prize. To say one is 'True' and the rest 'False' before the choice is made is to collapse the fan into a single rod. That is fatalism in a logician's coat."

  Vane shifted, his brow furrowing. "If you deny the proposition has a truth value, you deny reality has a structure. If I say *The sun will rise*, you accept it as true. Why? Because the mechanics of the heavens are determined. But if I say *The Argonaut will win*, you claim it is neither true nor false. Why? Because it depends on us? Does our involvement make the world less real? Or does it make our choices part of the causal chain that *makes* the proposition true?"

  "It makes the truth value dependent on the outcome," Halloway said. "Not the other way around. You have the arrow pointing the wrong way, Mr. Vane. You think the truth of the statement guides the event. I say the event confers truth upon the statement. Until the event occurs, the statement is... empty. It has no value. Supervaluation, if you prefer. It is not true in all histories, nor false in all. So it is neither."

  "But there is only one history that *will* be," Vane insisted. "God is not confused. He does not look at tomorrow and see a fog. He sees the path. If God knows it, it is knowable. If it is knowable, it is a fact. If it is a fact, the proposition describing it is true."

  Halloway sighed, looking up at the swinging lantern. "Ah. The theological trap. I wondered when you would bring Him into it. But consider this: If God knows the outcome as a fixed fact, does He also know the *cost*? If the truth is fixed that Lieutenant Garris dies at the mainmast, is his death necessary? If you say 'no, it is contingent,' you are splitting hairs. If it is true he dies, he dies. I cannot pray to save him without praying against the Truth itself. I become a blasphemer begging for a falsehood to come to pass."

  Vane paused. This was the wound he hadn't quite bandaged. "You can pray that the proposition *Garris dies* is the one that happens to be false. You are not praying against Truth. You are praying for the *other* truth."

  "There is no 'other' truth in your system!" Halloway's voice rose, then checked itself. "In your Ockhamist garden, there is only one path that is 'Actual.' The others are phantoms. If I pray, I am praying for a phantom. If I am effective, then the 'Actual' path changes. But if the 'Actual' path changes, then your proposition *The Argonaut prevails* was not true tonight. It was false. So you were wrong."

  Vane leaned back, interlacing his fingers. "Or, your prayer was part of the causal chain that made the proposition true. You assume the truth value exists in isolation, hanging in the air. It does not. It is tethered to the events. Your prayer is a rope in the tug-of-war. That the scale tips one way does not mean the weight was fixed before we pulled. It means the pulling is part of the weighing."

  "That sounds like compatibility," Halloway said, skeptical. "But semantically, it fails. If I say 'It is true we win,' and then we lose, I was a liar. If I say 'It is indeterminate,' and we win, I was merely cautious. Why claim a knowledge you cannot have? You are not God. You cannot see the Thin Red Line. To claim the statement is true is to claim a perspective you do not occupy."

  "I claim the statement *has* a value, not that I *know* it," Vane corrected sharply. "I do not need to see the bottom of the ocean to know the depth is not infinite. There is a fact of the matter. Either the keel touches or it does not. Your 'open future' is a comfort, Reverend. It makes you feel your hands are on the tiller. But it is a semantic cowardice. It refuses to acknowledge that time flows in one direction. The future is just the present waiting to happen. It is already there."

  "And that," Halloway whispered, "is the terror. If it is already there, we are not sailing toward tomorrow. We are unwinding toward it. Like a clock."

  "Clocks keep time," Vane said. "They do not lie."

  "Clocks do not choose," Halloway replied. He picked up his brandy glass, finally, and drained it. "If I stand on the quarterdeck tomorrow, and a ball takes my head, and you say 'It was true last night,' you make my death a sentence. If you say 'It was possible,' you make it a sacrifice. I need it to be a sacrifice, Mr. Vane. I need the truth of it to depend on whether I stood fast or ran. If the truth is fixed regardless of my legs, then my legs are irrelevant."

  Vane looked at the lantern, watching the flame fight the roll of the ship. "If your legs are irrelevant, then you would have run regardless of the truth value. The truth just records what you did."

  "Or," Halloway said, standing up and steadying himself against the table, "the truth waits for me to decide. And until I do, anyone who claims to know it is a false prophet."

  "And anyone who claims there is no truth to know," Vane said, not looking up, "is denying the reality of the battle we must fight."

  Halloway paused at the door. The wood creaked. Somewhere above, a bosun's whistle pierced the night air, sharp and demanding.

  "Then let us hope," Halloway said, his hand on the latch, "that the Reality is as merciful as your Logic is rigid. For if you are right, Mr. Vane, and the line is drawn... I pray it is drawn in red, and not in blood."

  He opened the door and stepped into the dark passageway.

  Vane sat alone in the swinging light. He looked down at the blank page before him, picked up his pen, and hovered it over the paper. He did not write. He simply watched the ink gather at the nib, a dark drop waiting to fall, neither true nor false until it touched the page.

  Outside, the sea waited for the dawn.
