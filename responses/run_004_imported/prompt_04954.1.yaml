      *   **Comparison:** Counterfactual-dependence account (David Lewis) vs. Physical-process/Conserved-quantity account (Phil Dowe).
      *   **Focus:** The *Selection Problem* (Why single out the lifeguard/gardener when dozens of others also failed to act?).
      *   **Evaluation:** Which theory gives a more *principled* treatment of selectivity? Where does the other theory have to reach beyond its official resources?
      *   **Requirement:** Justify the answer.

  2.  **Analyze the Theories:**

      *   **Lewis (Counterfactual Dependence):**
          *   *Core Idea:* $C$ causes $E$ iff $E$ counterfactually depends on $C$ (if $C$ had not occurred, $E$ would not have occurred).
          *   *Treatment of Omissions:* Lewis treats omissions as genuine causes. If the lifeguard *had* noticed, the swimmer *would not* have drowned. Therefore, the failure to notice is a cause.
          *   *The Selection Problem:* Lewis's basic account is notoriously promiscuous. If *anyone* saving the swimmer would have prevented drowning, then *everyone's* failure to save is a cause. Lewis acknowledges this. He relies on pragmatics, context, and "normality" to select the salient cause. It's not built into the metaphysics of causation itself but added via conversational implicature or context-sensitivity.

      *   **Dowe (Physical Process / Conserved Quantity):**
          *   *Core Idea:* Causation requires a physical connection, specifically the exchange or possession of a conserved quantity (energy, momentum, charge). No process, no cause.
          *   *Treatment of Omissions:* Dowe argues omissions are *not* genuine causes. They are "quasi-causes" or explanatory tools, but metaphysically, nothing happened. There is no energy transfer between "not watering" and "dead plant."
          *   *The Selection Problem:* Since omissions aren't causes, the selection problem technically dissolves at the metaphysical level. However, we still need to explain why we *talk* about the gardener and not the passerby. Dowe must explain this via norms, expectations, or duties. This is an external addition to the physicalist metaphysics.

