          *   *Actually, a stronger argument:* Lewis's theory *officially* says causation is counterfactual dependence. This makes *all* omissions causes. To select one, he needs pragmatics. This is "reaching beyond." Dowe's theory *officially* says causation is physical process. This makes *no* omissions causes. To explain why we talk about the lifeguard, he needs norms. This is also "reaching beyond."
          *   *Which is more principled?* Dowe's separation is cleaner. It keeps physics pure and norms separate. Lewis mixes them. Therefore, Dowe is more principled regarding the *nature* of causation, even if less intuitive.
