answer: |-
  The problem of causation by omission poses a significant challenge for metaphysical theories of causation. When a lifeguard fails to notice a struggling swimmer who subsequently drowns, or a gardener fails to water a neighbor's plants which then wither, common sense attributes the harm to these failures. However, metaphysically, an omission is a non-event; it is nothing happening. This creates a tension between our explanatory practices and our ontological commitments. Two dominant frameworks address this differently: David Lewis's counterfactual-dependence account and Phil Dowe's conserved-quantity (physical-process) account. While Lewis's theory aligns better with ordinary language, Dowe's theory offers a more principled treatment of the *selection problem*—the difficulty of explaining why we single out the lifeguard's omission rather than the inaction of dozens of passersby. Lewis's account generates a metaphysical profligacy that requires pragmatic patching, whereas Dowe's account cleanly separates metaphysical causation from normative attribution, locating the selection criteria where they belong: in the realm of duty and expectation, not physical connection.

  David Lewis's theory of causation is rooted in counterfactual dependence. For Lewis, event $C$ causes event $E$ if and only if, had $C$ not occurred, $E$ would not have occurred. This account treats omissions as genuine causes because the counterfactual conditional holds true: if the lifeguard *had* noticed (the omission had not occurred), the swimmer *would not* have drowned. Consequently, Lewis accepts that absences can be causes. However, this commitment leads directly to the selection problem. In the lifeguard scenario, the swimmer's death counterfactually depends not only on the lifeguard's failure but on the failure of every passerby who could have jumped in, the failure of the swimmer to wear a life vest, and even the failure of a shark to eat the swimmer earlier. All these non-events are equally sufficient conditions for the outcome in a counterfactual sense. If causation is objective counterfactual dependence, then all these omissions are objectively causes.

  To manage this "profligacy of causes," Lewis must reach beyond his official metaphysical resources. The machinery of counterfactual dependence alone cannot distinguish the lifeguard from the passerby; the dependence relation is identical in both cases. Lewis acknowledges this and appeals to pragmatics, context, and "normality" to select the salient cause. He argues that while all are causes, we only *mention* the lifeguard because their failure violates a specific expectation or norm. However, this move creates a tension within his theory. If causation is an objective relation of dependence between events (or non-events), the selection of one cause over another should not rely on subjective or conversational factors. By outsourcing the selection problem to pragmatics, Lewis admits that his metaphysical account is insufficient to explain causal attribution. He preserves the intuition that omissions are causes but at the cost of making the specific attribution of causation context-dependent and somewhat arbitrary from a purely metaphysical standpoint.

  In contrast, Phil Dowe's conserved-quantity account defines causation as the worldline of a physical object possessing a conserved quantity (such as energy or momentum) interacting with another. On this view, causation requires a physical process. Since an omission involves no physical entity and transfers no energy, Dowe argues that omissions are not genuine causes. The lifeguard's failure to act is not a cause of the drowning; it is merely an explanation for why the drowning was not prevented. Dowe classifies these as "quasi-causes" or causal explanations.

  This seemingly counterintuitive denial of omissions allows Dowe to offer a more principled treatment of the selection problem. Because Dowe's metaphysics denies that *any* omissions are causes, the selection problem dissolves at the ontological level. There is no need to filter a vast set of causal omissions to find the "real" one, because there are no causal omissions to begin with. The question then shifts from "Which omission caused the death?" to "Which agent is responsible for the death?" Dowe locates the selection criteria explicitly in normative, social, or legal frameworks rather than in the physics of causation. We single out the lifeguard not because their omission was more "causal" than the passerby's, but because the lifeguard had a duty of care.

  Critics might argue that Dowe is merely pushing the problem under the rug, but this is precisely where his account is more principled. The criteria used to select the lifeguard over the passerby (duty, role, expectation) are inherently normative, not physical or counterfactual. Lewis attempts to absorb these normative criteria into the concept of causation via pragmatics, blurring the line between what *happened* and what *should have happened*. Dowe maintains a strict distinction: physics determines causation (none, in the case of omissions), and norms determine responsibility (the lifeguard). When Lewis selects the lifeguard, he is implicitly relying on the same normative structures Dowe identifies, but Lewis treats this selection as a filter on causal facts, whereas Dowe treats it as an attribution of responsibility on non-causal facts. Dowe's theory does not have to "reach beyond" its resources to explain the selectivity; its resources are limited to physical processes, and it correctly identifies that the selectivity of omissions lies outside that domain. Lewis, conversely, claims omissions are causal facts but must borrow from the theory of conversation and social norms to explain why we treat them differently.

  Furthermore, Lewis's approach struggles with the metaphysical status of the relata. If omissions are causes, they must be entities capable of entering into dependence relations. Lewis treats them as "events" of a sort, but this stretches the ontology to include non-existents. Dowe avoids this ontological inflation. By refusing to reify omissions as causes, Dowe avoids the selection problem's metaphysical burden entirely. The "selection" is revealed to be a misnomer; we are not selecting a cause from a set of causes, we are assigning blame from a set of explanatory factors.

  However, one might object that Dowe's account is too revisionist. It contradicts the robust intuition that the lifeguard *did* cause the death. Yet, the prompt asks for the more *principled* treatment of selectivity, not the most intuitive. Lewis's theory generates a metaphysical surplus (too many causes) that requires a pragmatic filter to function in practice. This filter is external to the core definition of counterfactual dependence. Dowe's theory generates a metaphysical deficit (no omission causes) that is filled by normative theory. Since the selection criteria (duty vs. no duty) are normative, Dowe's separation is more honest and structurally sound. Lewis tries to make causation do the work of moral attribution, whereas Dowe allows causation to remain physical and attribution to remain normative.

  In conclusion, while Lewis's counterfactual account captures the ordinary language of causation, it fails to provide a principled solution to the selection problem without relying on external pragmatic mechanisms. It validates indefinitely many omissions as causes, forcing a subjective selection process that sits uneasily with the objective nature of counterfactual dependence. Dowe's physical-process account, by denying causal status to omissions, correctly identifies that the selection of the lifeguard is based on normative expectations rather than causal structure. Dowe's theory is more principled because it does not attempt to force normative selection criteria into a metaphysical theory of causation; instead, it delineates the boundary where causation ends and responsibility begins. Lewis must reach beyond counterfactuals to pragmatics to solve the problem; Dowe simply acknowledges that the problem is not causal to begin with.
