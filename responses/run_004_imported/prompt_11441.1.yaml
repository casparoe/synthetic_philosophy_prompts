prompt: |-
  So my friend and I got into a whole thing last night about our building's co-op board elections and I still can't stop thinking about it. We've got long-term subletters who've lived here 8+ years and are way more affected by stuff like the special assessment for the roof than some shareholder-members who bought their units purely as investments and have never set foot in the building, but my friend's position is that only shareholder-members get a vote, full stop, that's just what membership means. I said that felt kind of question-begging, since if what actually justifies having a say is being subject to and affected by a decision, the subletters arguably have the stronger claim, not the absentee investor-owners. We went back and forth for like an hour and never resolved it, and around 1am i remembered this is basically the 'boundary problem' that democratic theorists argue about (all-affected vs all-subjected vs bounded-membership views, plus that regress worry about who gets to decide who decides). Can you go through the most important implications of that literature for a smallish self-governing group like ours that actually has to decide who's eligible to vote? I don't need a tour of the whole academic debate, i just want to know what it actually cashes out to for us.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A disagreement with a friend about co-op board elections.
      *   **Core Conflict:** Long-term subletters (8+ years, affected by assessments) vs. Absentee shareholder-owners (investment only, never visit).
      *   **User's Position:** "All-affected" principle (those impacted should vote).
      *   **Friend's Position:** "Bounded membership" principle (only legal owners/shareholders vote).
      *   **User's Insight:** Recognizes this as the "boundary problem" in democratic theory (all-affected vs. all-subjected vs. membership).
      *   **Goal:** Wants to know the *practical implications* of this literature for a small self-governing group (the co-op) that actually has to make a decision *now*.
      *   **Constraint:** No tour of the whole academic debate; focus on what it "cashes out to" for them.

  2.  **Deconstruct the Theoretical Framework (Mental Sandbox):**
      *   *The Boundary Problem (Who constitutes the demos?):* This is the core. Frederick Whelan, Robert Dahl, etc.
      *   *All-Affected Principle:* Everyone impacted by a decision should have a say. *Problem:* Infinite regress (who decides who is affected?). In a co-op, subletters are definitely affected by roof assessments.
      *   *All-Subjected Principle:* Everyone subject to the coercion/rules should have a say. *Problem:* Subletters are subject to house rules, but owners hold the legal title.
      *   *Bounded Membership (Stakeholder/Property):* Voting rights attach to property ownership or legal contract. *Problem:* Can lead to "taxation without representation" for residents.
      *   *The Regress Worry:* To decide who votes, you need a vote. But who votes on that? Usually, the existing constitution/bylaws decide.

  3.  **Translate Theory to Co-op Reality:**
      *   *Legal Reality:* Co-ops are corporations. Shareholders own the corporation; residents lease from the corporation. Legally, the friend is right (usually).
      *   *Normative Reality:* The user feels the current setup is unfair/unstable.
      *   *Practical Implications:* What happens if they adopt one view over the other?
          *   If *Membership* wins: Stability, legal clarity, but potential resentment from long-term residents, risk of disengagement.
          *   If *Affected* wins: More buy-in from residents, but legal hurdles, potential dilution of owner equity control, slippery slope (what about short-term sublets?).
      *   *The "Decision about the Decision":* The bylaws currently dictate the rules. Changing them requires a vote of the *current* eligible voters (the shareholders). This is the "lock-in" effect.

  4.  **Drafting the Response - Section by Section:**

      *   **Acknowledge and Validate:** Confirm the user's intuition is spot on. It *is* the boundary problem. Validate that this isn't just navel-gazing; it has real stakes.
      *   **The Three Models (Briefly defined in Co-op terms):**
          1.  *Property/Membership (Friend's view):* Voting = Equity risk.
          2.  *All-Subjected (User's lean):* Voting = Living under the rules.
          3.  *All-Affected (User's lean):* Voting = Financial/Quality of life impact.
      *   **The "Cash Out" (Practical Implications):** This is the meat of the answer.
          *   *Implication 1: The Lock-In (The Regress Problem).* You can't just vote to let subletters vote. The *current* voters (shareholders) must agree to change the bylaws. The absentee owners might vote *against* giving up power.
          *   *Implication 2: Incentive Structures.* If owners vote, they care about property value. If residents vote, they care about livability/maintenance. Both are needed, but they conflict.
          *   *Implication 3: Stability vs. Legitimacy.* Membership rule = stable legally. Affected rule = stable socially (less resentment).
          *   *Implication 4: The "Exit" Option.* Subletters can leave easier than owners can sell. Does this mitigate the lack of vote? (Counter-argument to User).
      *   **Actionable Advice/Compromise:** How do co-ops actually handle this?
          *   Advisory boards?
          *   Proxy voting?
          *   Specific exceptions for long-term residents?
          *   Communication channels instead of voting rights.
      *   **Conclusion:** Summarize the trade-off. It's not about who is "right" theoretically, but what governance structure sustains the building.

  5.  **Refining the Tone:**
