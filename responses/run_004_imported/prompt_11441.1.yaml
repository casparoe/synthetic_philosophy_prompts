answer: |-
  You are absolutely right to identify this as the **boundary problem** (or the "constituency problem"). It is the foundational puzzle of democratic theory: *Before you can vote on policies, you must vote on who gets to vote, but who gets to vote on that?*

  Since you want to know how this literature "cashes out" for a co-op board election specifically, let's skip the history of ideas and look at the **governance mechanics**. Here are the four practical implications of that theoretical debate for your building.

  ### 1. The "Lock-In" Effect (Solving the Regress)
  Theoretical literature notes that the boundary problem is usually solved by a **pre-existing constitution**. In your case, that is the Co-op's Bylaws and Proprietary Lease.

  *   **The Implication:** You cannot resolve this debate philosophically at 1 AM and apply it tomorrow. The "regress worry" is solved practically by the fact that the *current* demos (shareholders) holds the keys to the gate.
  *   **For Your Building:** Even if the "all-affected" principle is morally superior, the only way to enact it is through the "bounded membership" principle. The absentee owners must vote to give the subletters voting rights.
  *   **The Risk:** This creates a collective action problem. Absentee investors have a rational incentive to vote *against* expanding the franchise, as it dilutes their control over asset management (e.g., keeping maintenance low to boost resale value vs. special assessments for long-term livability). The theory predicts the current boundary will remain sticky unless the owners perceive a threat to the building's stability.

  ### 2. Divergent Incentives (Equity vs. Habitation)
  Democratic theory distinguishes between **stakeholders** (those with capital at risk) and **subjects** (those subject to coercion/rules). Your co-op conflates these, but the sublet situation separates them.

  *   **The Implication:** Voting rights signal whose interests the board is designed to prioritize.
      *   **Shareholder Model (Friend's view):** Prioritizes the building as a *financial asset*. Decisions lean toward protecting resale value, minimizing monthly costs, and strict enforcement of lease terms.
      *   **Resident Model (Your view):** Prioritizes the building as a *home*. Decisions lean toward comfort, long-term capital improvements (like the roof), and community cohesion.
  *   **For Your Building:** If you stick with the shareholder model, you risk **legitimacy decay**. Long-term subletters who pay special assessments but can't vote may become uncooperative, hostile to board initiatives, or transient (churning reduces community stability).
  *   **The Trade-off:** You have to decide if the board is a **Board of Directors** (fiduciary duty to shareholders) or a **Homeowners Association** (fiduciary duty to residents). Legally, it's the former. Functionally, it needs the latter's buy-in to work.

  ### 3. The "Exit" Counter-Argument
  A common counter-argument in the boundary literature (often associated with Hirschman) is that voting isn't the only remedy for being affected; **exit** is also a mechanism of control.

  *   **The Implication:** Proponents of the bounded membership view argue that subletters have a "lighter" stake because they can leave more easily than an owner can sell. Therefore, they need the vote less.
  *   **For Your Building:** This argument holds less water for 8+ year subletters. At that point, "exit" is costly and disruptive, making them functionally identical to owners in terms of vulnerability.
  *   **The Cash Out:** If your building has a high population of *long-term* subletters, the "exit" justification for denying them votes collapses. The literature suggests that once residency crosses a certain duration threshold, the "all-subjected" principle becomes stronger than the "property" principle.

  ### 4. Practical Compromises (Second-Best Solutions)
  Since changing the bylaws to grant full voting rights is legally difficult (and often restricted by lender agreements or state law), democratic theorists often look for **functional representation** when formal representation is blocked.

  *   **The Implication:** If you can't change the *boundary*, you can change the *flow of information and influence*.
  *   **For Your Building:** Consider these structural fixes rather than a binary "vote/no vote" fight:
      1.  **Advisory Seats:** Create a non-voting "Resident Council" seat at board meetings. The subletters elect a representative who can speak to the roof assessment impact but cannot cast the final vote. This satisfies the "voice" requirement without violating the "property" boundary.
      2.  **Proxy Voting:** Encourage shareholders to formally proxy their votes to their long-term subletters. This keeps the legal chain intact but transfers the power to the affected party.
      3.  **Tiered Assessments:** If subletters can't vote on the roof assessment, the board could structure the payment differently (e.g., absorbed into rent vs. direct bill), acknowledging they didn't consent to the capital call.

  ### Summary: How to Settle the Argument
  Your friend is **legally** right; you are **normatively** right.

  *   **Friend's Win Condition:** If the goal is strict legal compliance and protecting property equity, the boundary remains at share ownership.
  *   **Your Win Condition:** If the goal is long-term building stability and fairness, the boundary is porous.

  **The Verdict:** The literature suggests that for a small self-governing group, **legitimacy is a resource.** If you run the building purely on legal rights (Friend's view) while ignoring the moral claim of long-term residents (Your view), you deplete that resource. Eventually, the subletters will stop caring about the rules, and enforcement costs will go up.

  **Recommendation:** Don't fight for a bylaw change immediately (the "lock-in" makes this unlikely to succeed). Fight for an **Advisory Role** for residents with >5 years tenure. It acknowledges the "all-affected" principle without triggering the legal nightmares of the "bounded membership" principle. It turns a theoretical conflict into a governance feature.
