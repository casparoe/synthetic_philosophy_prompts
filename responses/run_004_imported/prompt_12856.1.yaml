answer: |-
  Good evening, everyone. For those of you who don't know me, I'm a friend of the groom from our doctoral program. And for those of you who *do* know me, you know that [Groom] and I have spent a lot of late nights arguing over case law and coffee.

  In fact, [Groom] knows jurisprudence better than almost anyone. His dissertation included a chapter on the famous Hart-Devlin debate. Now, for the family, I promise I'll keep the jargon to a minimum. But for my cohort in the back: please, hold your objections until the end.

  Briefly: in the 1950s, Lord Devlin argued that society is held together by a shared morality. He claimed that if private conduct deviates too far from those shared norms, the social bond disintegrates. This was his "disintegration thesis." He believed the criminal law should enforce morality to keep society from falling apart.

  H.L.A. Hart disagreed. He argued, drawing on Mill, that the state has no business criminalizing private, consensual conduct. He didn't necessarily argue that every private choice was morally *good*; he argued that it wasn't the *law's* place to judge it. He defended the liberty to choose, not the virtue of the choice itself.

  Why does this matter at a wedding? Because debates that look like dry dust in a library actually build the world we live in. Hart's victory—that the state should not police the private heart—is part of the reason a wedding like this can happen at all. It cleared the legal and social space for [Groom] and [Fiancé] to define their own commitment, without the state imposing a singular vision of what a "good" life must look like.

  But here is where we can go further than Hart. Hart was a legal philosopher; he was careful to separate law from morals. We are not judges. We are friends and family. Hart argued that the law should remain neutral on private love. Tonight, we do not have to be neutral.

  The law provides the fence, but love plants the garden. Hart gave us the freedom to stand here; [Groom] and [Fiancé] give us the reason to celebrate. They have used that liberty to build something durable, kind, and genuinely good.

  So, if I may ask the cohort to raise a glass to the Harm Principle, and the rest of you to raise a glass to love:

  To [Groom] and [Fiancé]. May your private life remain your own, and may your shared life be a joy to all of us. Cheers.
