answer: |-
  This is a fantastic question to bring up in a seminar. It cuts right to the heart of the difference between contemporary analytic metaethics and the phenomenological tradition Brentano inaugurated.

  The short answer is: **Brentano is not stuck in the same way contemporary fitting-attitude (FA) theorists are, but his escape route relies on a specific epistemological commitment (the doctrine of *Evidenz*) that many modern philosophers find costly.**

  Contemporary FA theorists (like Rabinowicz, Rönnow-Rasmussen, or Schroeder) often struggle to define "fittingness" without circularity or without collapsing into the very reason-based structure that generates the Wrong Kind of Reasons (WKR) problem. Brentano, however, anchors "correctness" in a phenomenological analogy with **truth**.

  Here is a reconstruction of how Brentano would likely handle the demon/mud case, based primarily on *The Origin of Our Knowledge of Right and Wrong* (1889).

  ### 1. The Analogy with Theoretical Truth
  To understand Brentano's response, you have to grasp his fundamental parallel between judgment (theoretical reason) and emotion (practical reason).
  *   **Judgment:** To judge is to affirm or deny. A judgment is *true* if it affirms what exists or denies what does not. Crucially, a judgment is *evidently correct* when its correctness is immediately experienced (self-evidence).
  *   **Emotion:** To love or hate is the practical analogue. An emotion is *correct* when it loves what is worthy of love.

  **The Brentanian Move:** If a demon threatened to torture you unless you *believed* a false proposition (e.g., "2+2=5"), you would have a pragmatic reason to believe it, but that belief would not become *true*. Truth is not constituted by reasons to believe; it is constituted by the correspondence/evidence of the judgment.

  Brentano applies this strictly to value. The "good" is not defined as "that which we have reason to desire." It is defined as "that which can be loved with a **correct** love." The demon gives you a reason to *have* the desire, but he cannot alter the **correctness conditions** of that desire.

  ### 2. Intrinsic vs. Instrumental Correctness
  Brentano is extremely precise about the scope of his definition. He defines the good not merely as "what can be loved," but as "what can be loved **for its own sake** (*um seiner selbst willen*) with a correct love."

  In the demon case:
  1.  **Instrumental Love:** You desire the mud to avoid torture. This is loving the mud *for the sake of something else* (safety). Brentano acknowledges this is a rational act of will, but it does not make the mud *intrinsically* good. It makes the mud a *means*.
  2.  **Intrinsic Love:** For the mud to be *good* in the Brentanian sense, it must be worthy of love *in itself*, independent of consequences.

  Brentano would argue the WKR problem arises from conflating these two. The demon provides a *state-given reason* (to use modern parlance) to cultivate the attitude, but value is determined by *object-given correctness*. Because the mud lacks the intrinsic properties that warrant love, a love directed at it *as an end* would be **blind**, not **evident**.

  ### 3. The Doctrine of *Evidenz* (Self-Evidence)
  This is the distinctively Brentanian "secret weapon" against the WKR problem.

  For contemporary FA theorists, "fittingness" is often treated as a normative relation that needs analysis. For Brentano, the correctness of an emotion is known through **inner perception** and **evidence** (*Evidenz*). Just as you immediately see that a contradiction is false, you can immediately experience that loving a lump of mud *for its own sake* is inappropriate.

  If you introspect on the demon case, Brentano would say:
  *   You feel the *fear* of the demon.
  *   You feel the *volition* to desire the mud.
  *   But you do **not** feel the *evidence* that the mud is lovely.

  The "correctness" of love is not a rule you follow; it is a quality of the experience itself. A love motivated by threat lacks the phenomenological mark of correctness. Therefore, the demon's threat cannot generate value because it cannot generate *evident love*. It can only generate *blind love* (love without insight into its correctness). Since the good is defined by *correct* love (which implies evident love), the mud remains valueless.

  ### 4. Where Brentano Differs from Contemporary FA
  Contemporary theorists try to solve WKR by refining the *concept* of reasons (e.g., distinguishing object-given from state-given reasons). Brentano solves it by appealing to the *epistemology* of value.

  *   **Contemporary FA:** "We need to filter out the wrong reasons to find the fitting attitude."
  *   **Brentano:** "The wrong reasons produce a different *kind* of mental phenomenon (blind volition vs. evident love). They don't even enter the running for constituting value."

  ### 5. The Cost of This Solution
  While Brentano avoids the logical trap of the WKR problem, he pays a price that contemporary metaethicists might find steep:

  1.  **Intuitionism:** He relies heavily on the idea that we can directly "see" the correctness of emotions. If a student asks, "But how do I *know* my love for the mud isn't evident?", Brentano essentially has to say, "Look inside; if you have to ask, it isn't evident." This risks obscurity.
  2.  **Psychologism:** Brentano grounds value in the structure of human psychology (specifically, the capacity for evident emotion). If human psychology were different (e.g., if we were wired to find mud evidently lovely), value would be different. Contemporary realists often want value to be mind-independent in a stronger sense than Brentano allows.

  ### Summary for Seminar Discussion
  If you raise this in class, you can frame it like this:

  > "Brentano avoids the Wrong Kind of Reasons problem not by distinguishing types of reasons, but by distinguishing types of **mental acts**. The demon forces a *blind* volition, but value requires an *evident* love. Since pragmatic threats cannot generate phenomenological evidence, they cannot constitute value. However, this saves his theory only by retreating into a strong intuitionist epistemology that claims we can directly perceive the 'correctness' of our emotions."

  This shows you understand both the structural similarity between Brentano and modern FA theories, and the crucial phenomenological divergence that protects him from the counterexample.
