      *   *The Risk:* If both agents commit early and incompatibly (e.g., "I will never back down" vs. "I will never back down"), negotiation space collapses, leading to disastrous outcomes (collision/war).
      *   *Comparison to Schelling:* It *is* essentially a game of Chicken with pre-play communication/commitment. Schelling discussed "burning bridges" and "threats that leave something to chance."

