answer: |-
  This is a great question. Since you come from ML, you already have the right intuition about loss landscapes; we just need to translate that into the normative language of epistemology.

  Here is the core intuition: **Strict propriety is required to ensure that incoherent beliefs are *defective*, not just *suboptimal*.**

  If you use a merely proper rule (one with ties/flat spots), you leave open the possibility that an incoherent belief system is **undominated**. If an incoherent belief is undominated, you cannot claim it is irrational.

  Here is the breakdown of why the "unique minimum" matters.

  ### 1. The Landscape: Valley vs. Basin
  Think of the scoring rule as defining a 3D landscape where the $x,y$ axes are the credences you report, and the $z$ axis is the "inaccuracy" (loss).

  *   **Strictly Proper:** The landscape is a smooth, convex bowl. There is exactly one point at the bottom (the true probability). Every step away from that point goes strictly uphill.
  *   **Merely Proper:** The landscape is a bucket with a flat bottom. The true probability is somewhere on the floor of the bucket, but there are other points on that same flat floor that yield the exact same expected score.

  ### 2. Joyce's Goal: Accuracy-Dominance
  Jim Joyce's argument (1998) aims to vindicate **Probabilism** (the norm that your beliefs must obey probability axioms).

  He does this using a **Dominance Argument**. The structure is:
  1.  **Normative Premise:** If belief state $A$ is strictly less accurate than belief state $B$ in *every* possible world, then $A$ is irrational (dominated).
  2.  **Mathematical Claim:** For any *incoherent* belief state $C_{in}$, there exists a *coherent* (probabilistic) belief state $C_{coh}$ that is strictly more accurate in every possible world.
  3.  **Conclusion:** Therefore, incoherent beliefs are irrational.

  ### 3. What Breaks with Mere Propriety?
  The mathematical claim (step 2) relies on the geometry of the scoring rule.

  If the scoring rule is **strictly proper**, the "distance" between your credence and the truth is always positive if your credence is wrong. If you are incoherent, you are geometrically "far" from the truth in a way that guarantees a coherent point can get closer to you in every direction.

  If the scoring rule is **merely proper** (has ties), the "distance" metric can be zero even if you aren't at the true probability.

  **The Scenario that Breaks the Argument:**
  Imagine an agent has incoherent credences. We want to show them a coherent alternative that is *better*.
  *   With a **strictly proper** rule, the coherent alternative is guaranteed to be *strictly closer* to the truth. The incoherent agent is strictly dominated. They are irrational.
  *   With a **merely proper** rule, it is possible that the incoherent credence lands on the "flat floor" of the loss basin. The coherent credence is also on that flat floor.
      *   Result: The coherent credence is **not strictly more accurate**. It is *equally* accurate.
      *   Consequence: The incoherent credence is **not dominated**.

  ### 4. Why "Not Dominated" is Fatal for Epistemology
  In ML, if two models have the same loss, you might just pick the simpler one. In epistemology, we are trying to establish **norms of rationality**.

  If an incoherent belief state is *undominated* (i.e., there is no other belief state that is strictly better than it in all worlds), then accuracy considerations alone **cannot condemn it.**

  If you allow merely proper scoring rules:
  1.  An agent could hold incoherent beliefs (e.g., $P(A) = 0.6, P(\neg A) = 0.6$).
  2.  Because of the "flat bottom" of the scoring rule, these beliefs might yield the same accuracy score as the coherent alternative ($P(A) = 0.6, P(\neg A) = 0.4$) across all worlds.
  3.  Since the incoherent beliefs aren't *worse*, Joyce's argument fails to prove they are *irrational*.
  4.  Probabilism is not vindicated; it's just one option among many equally accurate options.

  ### 5. The ML Analogy: Identifiability
  You can think of this like **parameter identifiability**.

  *   **Strict Propriety:** The true parameters are identifiable. If you find the global minimum of the loss, you know exactly what the true parameters are. If your model parameters differ, your loss *must* be higher.
  *   **Mere Propriety:** The parameters are not identifiable. There is a subspace of parameters that all yield the minimum loss.

  In Joyce's argument, the "parameters" are your rational credences. If the scoring rule isn't strictly proper, the "true rational credence" is not identifiable via accuracy alone. There are "impostor" credences (potentially incoherent ones) that mimic the accuracy of the true ones perfectly.

  ### Summary
  Strict propriety buys you **discriminatory power**.

  *   **Proper:** Guarantees you can't do *better* than the truth.
  *   **Strictly Proper:** Guarantees you will do *worse* if you deviate from the truth.

  Joyce needs the latter. To prove that incoherence is a defect, he must show that incoherence *always costs you accuracy*. If the scoring rule has ties, incoherence might be "free," and you can't argue that rational agents are obligated to avoid it.
