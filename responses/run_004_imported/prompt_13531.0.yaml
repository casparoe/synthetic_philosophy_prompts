      *   *Risk:* I might sound like a group selectionist zealot. *Correction:* Frame it as "pluralism" or "causal realism" rather than "group selection wins."
      *   *Key Distinction:* Prediction vs. Explanation. The friend is talking about prediction ($\Delta p$). The user is talking about explanation (mechanism).

  7.  **Final Polish:** Organize into clear, punchy arguments. Use analogies. Cite specific philosophers/biologists (Sober, Wilson, Okasha) so the user can drop names if needed. (Wait, keep it accessible but rigorous).

