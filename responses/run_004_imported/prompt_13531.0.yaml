prompt: |-
  Okay so last night my friend (shes finishing a PhD in evolutionary biology) and I got into like a two hour argument about the units of selection thing and I don't think I won. Her whole point was that kin-selection/inclusive-fitness models and multi-level (group) selection models are mathematically interchangeable -- you can always rederive one from the other because theyre just different ways of partitioning the same covariance terms in the Price equation -- so the classic genes vs individuals vs groups fight (Hamilton vs Wynne-Edwards, or whatever) is basically a non-debate, just people preferring different bookkeeping for the same underlying process. I said that can't be right, actual organisms really do live and die and reproduce at the individual level, that's not just an accounting choice. She said that's exactly the naive intuition the equivalence result is supposed to dissolve, and I didn't have a good comeback. So: make me the strongest case that she's wrong. Argue that formal/mathematical equivalence between the kin-selection and multi-level-selection partitions of the Price equation does NOT show the levels-of-selection debate is merely notational, and that there's still a real, substantive fact about which level selection is causally acting on. Actually engage with why interchangeable math wouldn't settle a causal question, instead of just handing me my gut intuition back with better vocabulary.
