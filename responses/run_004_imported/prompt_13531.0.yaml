answer: |-
  This is a classic debate in the philosophy of biology, and honestly, your friend is reciting the "standard orthodoxy" taught in most grad programs right now. The "equivalence thesis" (that kin selection and multilevel selection are just mathematical translations of one another) is widely accepted among technical evolutionary biologists.

  **However, she is conflating *predictive equivalence* with *causal equivalence*.**

  You can win this argument, but not by denying the math. You win by arguing that **mathematics describes patterns, but biology explains processes.** Just because two equations yield the same number for $\Delta p$ (change in gene frequency) does not mean they describe the same reality.

  Here is the strongest case you can make that the debate is substantive, not notational.

  ### 1. The Price Equation is a Tautology, Not a Causal Model
  Your friend's argument rests on the Price Equation. The first thing you need to point out is that the Price Equation is an **accounting identity**. It is mathematically guaranteed to be true, like saying "Profit = Revenue - Costs."

  Because it is a tautology, it describes the *result* of selection, not the *cause*.
  *   **The Math:** You can partition the covariance term in the Price Equation into "within-group" and "between-group" components (MLS) OR into "direct" and "indirect" fitness effects (Kin Selection).
  *   **The Reality:** Just because you *can* partition the variance two ways doesn't mean the *causal mechanism* is ambiguous.

  **The Analogy:** Imagine a barometer drops and a storm arrives.
  *   Model A: Barometer pressure causes storms.
  *   Model B: Atmospheric pressure causes both the barometer drop and the storm.
  *   Mathematically, the correlation is identical. You can write equations linking barometers to storms that predict perfectly. But causally, Model A is wrong.

  Similarly, kin selection and group selection often correlate perfectly (groups tend to be made of kin). But asking "Which level is selection acting on?" is asking about the **mechanism**, not the correlation. If a trait evolves because individuals physically cooperate to defend a territory (a group mechanism), describing it as "helping copies of your genes" is a valid *prediction*, but it is a misleading *explanation* of the physical interaction.

  ### 2. The "Interventionist" Test of Causation
  In philosophy of science, a causal claim is often defined by what happens under **intervention**. If $X$ causes $Y$, manipulating $X$ should change $Y$.

  If the levels-of-selection debate were merely notational, it shouldn't matter which framework you use to design an intervention. But it does.
  *   **Kin Selection View:** To stop an altruistic trait, you should reduce genetic relatedness (mix the population).
  *   **Group Selection View:** To stop the trait, you should disrupt group structure or reduce between-group variance (break up the groups).

  In many natural scenarios, these interventions yield different results because relatedness and group structure are not perfectly locked together. If you treat them as merely "different bookkeeping," you lose the ability to identify the correct **causal lever**. The "real" level of selection is the one that, if manipulated, stops the evolutionary change. That is a factual, empirical question, not a notational one.

  ### 3. Evolutionary Transitions in Individuality (ETIs)
  This is your nuclear option. The biggest problem with the "it's all just notation" view is that it cannot explain **how new levels of organization evolve.**

  Life started as replicating molecules, then cells, then multicellular organisms, then eusocial colonies. This is called *Evolutionary Transitions in Individuality*.
  *   At the start of a transition, selection acts on the lower level (e.g., single cells).
  *   At the end, selection acts on the higher level (e.g., the multicellular organism).
  *   **The Question:** When does the group *become* an individual?

  If you say "groups and individuals are just interchangeable math," you erase the transition. You can't explain how a collection of individuals *fuses* into a new Darwinian individual if you treat the "group" as just a fictional accounting category.

  Biologists like **David Sloan Wilson** and **Elliott Sober** argue that for a transition to complete, the group must acquire **functional organization** and **reproductive bottlenecking** that makes it a causal unit. At that point, treating it as "just a collection of individuals maximizing inclusive fitness" becomes biologically opaque. The group acquires causal powers (homeostasis, division of labor) that the individuals no longer possess. The math might still balance, but the **ontology** (what actually exists) has changed.

  ### 4. Explanatory Context and Heuristics
  Science isn't just about predicting $\Delta p$; it's about generating hypotheses. The framework you choose directs your attention to different features of the world.
  *   **Kin Selection Heuristic:** Look for pedigree, recognition mechanisms, and genetic markers.
  *   **Group Selection Heuristic:** Look for group-level traits, group fission/fusion rates, and between-group competition.

  There are cases where one framework is **causally misleading**.
  *   *Example:* The "Green Beard Effect." A gene causes a trait (green beard) and altruism toward others with that trait.
  *   *Kin Selection:* This looks like high relatedness at that locus.
  *   *Group Selection:* This looks like assortment into groups based on phenotype.

  If you insist it's "just notation," you might miss that the mechanism is **phenotypic assortment**, not genealogical kinship. If you go looking for family trees (Kin heuristic) when the actual mechanism is social tagging (Group/Assortment heuristic), you will fail to understand the biology. The "right" model is the one that aligns with the actual causal architecture of the organism's life cycle.

  ### 5. The "Null Model" Problem
  Every scientific model implies a "null hypothesis" (what we expect if nothing interesting is happening).
  *   **Kin Selection Null:** Solitary individuals interacting randomly.
  *   **Group Selection Null:** Structured populations with no group-level fitness differences.

  These are different baselines. By choosing one framework over the other, you are making a substantive claim about what the "default" state of nature is. If you claim the debate is non-existent, you are hiding your assumption about the null model. But the choice of null model determines whether you classify a trait as "altruistic" or "selfish." That is a substantive biological claim, not a notational choice.

  ### Summary of Your Comeback
  Tell her this:

  > "I agree the Price Equation allows you to partition the variance equivalently. I agree they predict the same change in gene frequency. **But prediction is not explanation.**
  >
  > The Price Equation is a tautology; it describes the *score* of the game, not *how it was played*.
  >
  > 1.  **Causality:** If I want to stop a trait from evolving, do I break up the families or break up the groups? The answer depends on the physical mechanism, not the algebra.
  > 2.  **Transitions:** If levels are just notation, you can't explain how single cells became multicellular organisms. At some point, the group becomes a real causal individual. Your view erases that transition.
  > 3.  **Heuristics:** Telling a researcher to look for 'inclusive fitness' when the mechanism is 'group competition' sends them looking for kinship where there is none.
  >
  > The math is interchangeable. The **biology** is not. To say the debate is 'settled' because the algebra works is to confuse the map with the territory."

  ### Recommended Reading (To arm yourself)
  If she wants sources, don't give her Hamilton. Give her the philosophers who specialize in this exact distinction:
  1.  **Elliott Sober & David Sloan Wilson, *Unto Others*:** The definitive argument that MLS and Kin Selection are mathematically equivalent but causally distinct.
  2.  **Samir Okasha, *Evolution and the Levels of Selection*:** He argues that while the math partitions equivalently, the *causal interpretation* is underdetermined by the math alone.
  3.  **Pierce et al. (2018), "The math does not settle the biology":** A paper specifically addressing this equivalence debate.

  You aren't wrong because your intuition is "naive." You're right because **causality is not covariance.** She is winning on algebra; you are winning on ontology.
