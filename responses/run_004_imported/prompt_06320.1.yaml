          *   Fregean attack: Aha! Even *you* admit "Paderewski" functions differently for Peter. So there must be two modes of presentation.
          *   Millian defense: It's about the *file* or the *guise*, not the name itself. The name is just a tag.
          *   Fregean counter: If the name is the same, and the sense is supposed to be public/linguistic, your view collapses. If sense is private, it's just psychology.
      *   **Round 3: Rationality and Symmetry.**
          *   Millian: Peter isn't irrational. He lacks the identity premise.
          *   Fregean: But if you say the proposition is the same
answer: |-
  **Setting:** *Outside the philosophy department building. It's raining slightly. Gottloba (Fregean) is clutching an umbrella like a weapon. John Stuart (Millian) is pulling up his collar, walking fast.*

  **Gottloba:** I'm just saying, Kripke didn't throw a curveball. He threw a mirror. And you're the one staring into it blinking.

  **John Stuart:** Blinking? I'm the one who can actually see the field, Gottloba. You're still trying to measure the distance with a ruler made of fog. Pierre is rational. Peter is rational. The world is consistent. The only thing broken is your obsession with "Sense."

  **Gottloba:** Rationality is exactly what's at stake! Look at Peter. Peter hears "Paderewski" at a concert. Peter hears "Paderewski" at a political rally. Peter believes Paderewski has musical talent. Peter believes Paderewski lacks musical talent. If you are a Millian, if the meaning of the name *just is* the man, then Peter believes *of Paderewski* that he has talent and *of Paderewski* that he does not. That is a flat contradiction. $P$ and not-$P$. You're committed to saying Peter is logically incompetent.

  **John Stuart:** I am committed to no such thing. I'm committed to saying *you* are confusing the map with the territory. Peter isn't holding contradictory beliefs about the *proposition*. He's holding two belief-states that, when reported by us using the same name, look contradictory. But Peter doesn't know the names co-refer.

  **Gottloba:** But that's the point! *Why* doesn't he know? On your view, the name "Paderewski" contributes the man to the thought. It's the same name. It's not even a translation case like Pierre. It's the exact same phonetic string. If meaning is use, or if meaning is reference, that token should trigger the same semantic value. The fact that Peter treats them as two different files proves there is an intermediary. There is a *mode of presentation*.

  **John Stuart:** Sure, there's a psychological file. A mental dossier. I'll grant you psychology. I'll grant you cognitive roles. But don't call it *semantics*. Don't call it *Sense* with a capital S. As soon as you make Sense public and linguistic, you crash into the Paderewski wall. If Sense is what determines reference, and "Paderewski" determines Paderewski in both cases, the Sense must be the same. If the Sense is the same, Frege's Principle says cognitive significance must be the same. But it's not. So your "Sense" is either doing no work, or it's just a fancy word for "whatever is happening in Peter's head."

  **Gottloba:** It's not just psychology! It's about how the reference is given. In the concert hall, the name is given as "the pianist." At the rally, it's given as "the statesman." Those are different descriptive clusters associated with the name.

  **John Stuart:** Aha! So you're retreating to descriptions. You're going Descriptivist on me? Because Kripke already buried that. Peter might not associate *any* descriptions. Maybe he just thinks "That guy is talented" and "That other guy isn't." If the only difference is in Peter's head, then Sense is private. And if Sense is private, communication is a miracle. How do I know my "Paderewski" sense matches yours?

  **Gottloba:** We share a language! That's the point of the seminar. But you're dodging the Pierre case. You think you're safe there because "Londres" and "London" are different words. But translation is supposed to preserve meaning. If I say "Londres est jolie" and you say "London is pretty," we are saying the same thing. But Pierre assents to the first and dissents from the second.

  **John Stuart:** Exactly. He doesn't know they are translations.

  **Gottloba:** But if meaning is reference, he *should* be able to substitute them *salva veritate* in his own mind if he's rational. The fact that he can't shows that the *way* he grasps the city differs. That is Sense. You Millians want to say the proposition is singular: <London, Pretty>. But Pierre has <London, Pretty> and <London, Not Pretty>. You have to say he believes a contradiction.

  **John Stuart:** No, I say belief reports are context-sensitive. When we say "Pierre believes London is pretty," we are indexing the report to his French dossier. When we say "Pierre believes London is not pretty," we index to his English dossier. The proposition believed isn't just the singular proposition. It's the singular proposition *under a guise*. But the guise isn't part of the *content*. It's part of the *relation*.

  **Gottloba:** That is semantic gerrymandering! You're chopping up the belief relation to save the content. But look at the symmetry. You say my view fails on Paderewski because the name is the same. My view fails on Pierre because the translation should align the senses. But your view fails on *both* because you can't explain the rationality gap without smuggling in something that looks exactly like Sense! You call it a "guise" or a "file," but if it blocks substitution in belief contexts, it functions exactly like a Fregean Sense.

  **John Stuart:** It functions like a cognitive mechanism, not a semantic value. Here's the asymmetry you're missing, Gottloba. On your view, if Peter has two different Senses for "Paderewski," then strictly speaking, he is using two different *names*, even if they sound the same. You have to individuate names by Sense.

  **Gottloba:** Precisely. Ambiguity is in the language.

  **John Stuart:** But that makes language unlearnable! How does a child learn that "Paderewski" refers to a person if every time they hear it, it might be a new Sense? You make communication impossible. On my view, the name is stable. The reference is stable. The mess is in the believer, not the language. I save the public nature of language. You save the rationality of the agent by privatizing the language.

  **Gottloba:** I don't privatize it! Senses are public objects in a "third realm."

  **John Stuart:** *[Stops walking, turns to face her]* A third realm? Really? We're doing metaphysics now? Look, the puzzle is worse for you. Here's why. Pierre. He learns "Londres" in France. He learns "London" in England. He never translates. For you, there must be two Senses. $S_1$ and $S_2$. But $S_1$ and $S_2$ pick out the same object. Now, suppose Pierre learns the truth. "Londres is London." On your view, he learns an identity statement. He learns $a=b$.

  **Gottloba:** Yes. Informative identity. Classic Frege.

  **John Stuart:** But what if he *never* learns it? He dies believing Londres is pretty and London is ugly. Did he make a mistake?

  **Gottloba:** He made a factual error about the city's uniformity, but not a logical error.

  **John Stuart:** But on my view, he made *no* error in logic and *no* error in semantics. He just lacked an empirical identity premise. The puzzle dissolves for me because I don't demand that belief reports mirror the structure of the mind perfectly. I demand they track reference. You demand they track cognitive grip. And Paderewski proves cognitive grip can split even when the linguistic grip is identical. That means your "Sense" isn't linguistic. It's purely psychological. And if it's purely psychological, it's not Philosophy of Language anymore. It's cognitive science.

  **Gottloba:** And if you ignore cognitive grip, you aren't doing Philosophy of Mind or Language, you're doing logic chopping! You're saying Peter believes $P$ and not-$P$ but he's "rational." That's insane. Rationality is the capacity to avoid contradiction. If his belief box contains $P$ and not-$P$, he is irrational, unless you admit there's a filter between him and the proposition. That filter is Sense!

  **John Stuart:** The filter is *him*. The agent. Not the word.

  **Gottloba:** But the word is the vehicle! If the vehicle is identical ("Paderewski"), and the destination is identical (The Man), the route must differ for the traveler to get confused. You're denying the route exists.

  **John Stuart:** I'm denying the route is part of the *ticket*. The ticket just says "Destination: Paderewski." How he gets there is up to him.

  **Gottloba:** *[Starts walking again, faster]* Then explain this. If I say "Peter believes Paderewski is musical" and "Peter believes Paderewski is not musical," and I am speaking truly both times, then the embedded sentences must express different propositions. Because Peter isn't believing a contradiction. If the embedded sentences express different propositions, but the words are the same and the reference is the same, *what is differing?*

  **John Stuart:** The context of attribution! *I* know Peter has two files. So when I report his belief, I implicitly specify which file I'm talking about. It's pragmatic. It's like saying "It's raining" vs "It's raining in London." The location is context-dependent. The "file" is context-dependent.

  **Gottloba:** So truth is relative to the attributor's knowledge of the believer's psychology?

  **John Stuart:** Better: The truth conditions of belief reports are sensitive to the ways the believer represents the referent. But those ways aren't *in* the sentence. They're in the context.

  **Gottloba:** That is a disaster. It means there is no such thing as a false belief report, only an inappropriate one. If I say "Peter believes Paderewski is musical" while pointing at his political file, I'm not false, just... rude?

  **John Stuart:** You're misleading.

  **Gottloba:** You're turning semantics into etiquette!

  **John Stuart:** And you're turning semantics into introspection! Look, the Paderewski case kills the idea that Sense is determined by the name. The Pierre case kills the idea that Sense is determined by translation. You're left with Sense being determined by... what? Whatever Peter feels like?

  **Gottloba:** It's determined by the cognitive path to the reference! And that path is real. You can't just wish it away by calling it "pragmatics." The puzzle shows that reference isn't enough to explain cognitive significance.

  **John Stuart:** The puzzle shows that *belief reports* aren't enough to map the structure of belief.

  **Gottloba:** *[Stops at a crosswalk]* We're going to be late for the next seminar.

  **John Stuart:** Let's go. But admit it. Paderewski is the same name. Same reference. Different belief. Your Sense has to split without any linguistic difference. That's not linguistics.

  **Gottloba:** And admit this. Pierre treats "Londres" and "London" as different. Translation fails to align cognitive significance. Your Reference theory can't explain why the identity is informative without admitting there's something *more* than reference involved in the cognition.

  **John Stuart:** I admit the cognition is complex. I deny the semantics is.

  **Gottloba:** I deny you can separate them this cleanly.

  **John Stuart:** *[Light turns green]* Then we're walking in different directions.

  **Gottloba:** We're walking to the same building, John. Just looking at different doors.

  **John Stuart:** As long as we don't start thinking they're different buildings.

  **Gottloba:** *[Opens umbrella]* With Peter and Pierre? I'm not sure there *is* a building. Just a lot of doors.

  *[They walk into the rain, neither yielding the sidewalk.]*
