          *   *Marcus:* Intent to deceive is the core. Misleading truth has that intent.
          *   *Augustine's View:* In *De Mendacio*, Augustine defines a lie (*mendacium*) specifically as speaking against one's mind (*enuntiatio contra mentem*). It requires a false statement. However, he also discusses the *sin* of deception.
