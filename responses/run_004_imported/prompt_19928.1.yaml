answer: |-
  This is a classic debate in Augustinian ethics, and both Leah and Marcus have put their fingers on genuine tensions in the text. Augustine is notoriously difficult on this issue because he is trying to balance a logical definition with a theological absolute.

  Here is a move-by-move breakdown of who has the better of the argument, followed by the crucial context both of them are missing.

  ### Move 1: The Definition of a Lie
  **Leah:** Augustine defines a lie as asserting what you believe to be false with intent to deceive. Therefore, silence or misleading truth isn't a lie.
  **Marcus:** Augustine cares about the *intent to deceive*. A true statement designed to mislead captures the sin, even if it misses the technical definition.

  *   **Verdict:** **Leah wins on the text; Marcus wins on the moral intuition.**
  *   **Why:** Leah is textually correct. In *De Mendacio* (3.3), Augustine defines a lie (*mendacium*) specifically as an *enuntiatio contra mentem* (an utterance against the mind). You must say something you *believe* to be false. If you say something true, even to deceive, it is not strictly a *mendacium*.
  *   **However:** Marcus is right that Augustine thinks deception is dangerous. Augustine admits that speaking truth with the intent to deceive can still be sinful (a sin of fraud or *dolus*), even if it isn't technically a "lie." Marcus is wrong to call it a "lie" by Augustine's standard, but right that Augustine still views it with suspicion.

  ### Move 2: Silence and "Misleading Truths"
  **Leah:** Augustine allows declining to be forthcoming (silence) or using ambiguous truths.
  **Marcus:** That's a dodge. If the goal is to deceive the murderer, the moral content is the same as lying.

  *   **Verdict:** **Leah is closer to Augustine's explicit advice.**
  *   **Why:** Augustine explicitly distinguishes between *hiding* the truth (*verum tacere*) and *uttering* a lie (*falsum dicere*). In *De Mendacio* (10.24), he writes: "It is one thing to hide the truth, another to utter a lie." He generally permits the former. He argues that we are not obligated to give truth to everyone who asks for it, only to those who have a right to it (and a murderer does not have a right to his victim's location).
  *   **Caveat:** Augustine is wary of *verbal* trickery. He prefers blunt silence ("I will not tell you") over clever ambiguity ("I haven't seen him since morning"), because the latter still courts the *intent* to deceive, which damages the soul of the speaker.

  ### Move 3: The "Jocose Lie" (Jokes)
  **Marcus:** Augustine says jokes aren't real lies because no one intends to deceive. This proves intent is the real criterion.
  **Leah:** If intent were the only criterion, he wouldn't define lying around false assertion. Jokes are a specific exception, not the rule.

  *   **Verdict:** **Leah is correct.**
  *   **Why:** Marcus misreads the status of jocose lies. Augustine *does* classify jokes as lies (*mendacia*), but he categorizes them as the least sinful kind (often the 7th or 8th category). They are still lies because they involve false assertion. They are excusable not because they lack intent to deceive (the audience is momentarily "deceived" for the sake of the punchline), but because they lack *malicious* intent and cause no harm. Leah is right: if intent alone defined the lie, jokes wouldn't need to be categorized as a type of lie at all; they would be a type of truth.

  ### Move 4: The Eight Kinds of Lies (The Hierarchy)
  **Marcus:** Augustine ranks lies. Lying to save a life is the least sinful (Kind 8). This shows he isn't a pure absolutist; consequences matter.
  **Leah:** (Implied) It's still a lie, just a less bad one. The prohibition stands.

  *   **Verdict:** **Leah wins decisively.**
  *   **Why:** Marcus makes a category error here. Augustine is an absolutist about the *prohibition*, but a gradationalist about the *guilt*. That lying to save a life is the "least sinful" of the eight kinds does not make it *permissible*. It just means if you do it, you go to hell slightly less fast than if you lied about religious doctrine. Augustine explicitly says in *De Mendacio* that even the 8th kind of lie is a sin that must be avoided if possible. Marcus tries to use the hierarchy to create a loophole; Augustine intended the hierarchy to show that while all lies are poison, some are more toxic than others.

  ---

  ### What Both of Them Are Missing

  If you want to steer the seminar discussion, here are three points that complicate both their views:

  **1. The Metaphysics of Truth (God = *Veritas*)**
  Both Leah and Marcus are treating this as a rule-based ethical system (Deontology vs. Consequentialism). They are missing the theological ontology. For Augustine, God is Truth (*Veritas*). To lie is not just to break a social contract; it is to turn away from Being itself toward Non-Being.
  *   **Why it matters:** This explains why Augustine is so rigid. It's not that he doesn't care about the friend's life; it's that he believes sinning against God (the source of life) to save a biological life is a metaphysical category error. You cannot commit evil (turning from God) so that good may come.

  **2. The Sin of *Deceiving* vs. The Sin of *Lying***
  This is the nuance that splits the difference between Leah and Marcus. Augustine admits (in *De Mendacio* 10.24) that you can speak truth and still sin if your *heart* is set on deception.
  *   **The Missing Point:** Leah thinks misleading truth is a "get out of jail free" card. Augustine would say: "It is not a *lie*, but it may still be a *sin* against Charity." If your goal is to corrupt the murderer's mind (even for a good end), you are violating the command to love your neighbor (yes, even the murderer). Augustine prefers you say, "I know where he is, but I will not tell you," which is truthful, non-deceptive, and protects the friend.

  **3. The Development of His View (*De Mendacio* vs. *Contra Mendacium*)**
  Your seminar is reading *De Mendacio* (On Lying), which is an earlier work. Augustine later wrote *Contra Mendacium* (Against Lying) specifically to address cases where people were using "pious lies" to convert heretics or protect saints.
  *   **The Missing Point:** In the later text, Augustine tightens the screws even further. He becomes more suspicious of "mental reservations" and misleading truths than he is in *De Mendacio*. If Marcus wants to argue that Augustine would hate the "misleading truth" workaround, he should cite the later text. If Leah wants to argue for the silence workaround, she should stick to the distinction in the earlier text.

  ### Summary for Your Group
  *   **Leah** has the better grasp of Augustine's **definitions** and his **absolutism**. She is right that the hierarchy of lies doesn't make lying permissible.
  *   **Marcus** has the better grasp of the **moral spirit** of the text. He is right that Augustine thinks the *intent to deceive* is spiritually corrosive, even if the words are technically true.
  *   **The Synthesis:** Augustine's actual solution to the "murderer at the door" is neither a lie nor a misleading truth. It is **silent refusal**. You owe the truth to those who have a right to it; a murderer forfeits that right. You can say "I will not answer," which satisfies Leah's requirement for truthfulness and Marcus's requirement that you aren't trying to trick him.
