          *   *Correction:* Marcus argues jokes aren't "real lies" because no intent to deceive. Augustine actually *does* call them lies (*mendacia*), just less bad ones. But he acknowledges the lack of intent to *permanently* deceive or harm.
          *   *Evaluation:* Leah is closer. Augustine *does* require the false assertion. Jokes are still technically lies, just excusable ones. Marcus is misreading the joke exception.
          *   *Winner:* Leah.

      *   **Point 4: The Eight Kinds of Lies (Hierarchy).**
          *   *Marcus:* Lying to save a life is the least sinful (Kind 8?). This shows Augustine isn't a pure absolutist; consequences matter. Therefore, the workaround is valid.
          *   *Leah:* (Implied) It's still a lie, just less bad.
          *   *Augustine's View:* Augustine lists 8 kinds. The worst is religious deception. The least bad is lying to protect someone's bodily purity (or life, depending on the text version). *Crucially:* Even the 8th kind is still a *sin*. It is still *prohibited*. Grading the sin doesn't make it permissible.
          *   *Evaluation:* Marcus is making a category error. Grading sins $\neq$ permitting sins. Augustine is an absolutist about the *prohibition*, even if he is a gradationalist about the *guilt*.
          *   *Winner:* Leah (on the absolutism point), Marcus (on the nuance of guilt).

      *   **Point 5: What Both Are Missing.**
