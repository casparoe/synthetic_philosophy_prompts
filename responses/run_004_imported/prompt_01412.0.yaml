answer: |-
  Your instinct is correct. You have not gone wrong in your intuition; you have likely gone wrong in the arithmetic of **renormalization**.

  The short answer is: You can absolutely keep the neighborhood split at 50/50. The probability mass does not need to "leak" from one neighborhood to the other. It only needs to shift *within* Priya's neighborhood.

  Here is the breakdown of why your intuition holds, where the arithmetic trap lies, and the general probability principle at stake.

  ### 1. The Arithmetic Solution
  Let's write down the four possible states and assign probabilities to them. We want to satisfy three conditions:
  1.  **Sum to 1:** All four probabilities must add up to 100%.
  2.  **Neighborhood Neutrality:** The total probability for Priya's Neighborhood ($P$) remains 50%, and Friends' Neighborhood ($F$) remains 50%.
  3.  **The New Constraint:** Within Priya's Neighborhood, Sit-down ($S$) is twice as likely as Noodle ($N$).

  Here is the consistent set of numbers you were looking for:

  | State | Calculation | Probability |
  | :--- | :--- | :--- |
  | **Priya, Sit-down** | $0.5 \times \frac{2}{3}$ | **1/3 (33.3%)** |
  | **Priya, Noodle** | $0.5 \times \frac{1}{3}$ | **1/6 (16.7%)** |
  | **Friends, Sit-down** | $0.5 \times \frac{1}{2}$ | **1/4 (25.0%)** |
  | **Friends, Noodle** | $0.5 \times \frac{1}{2}$ | **1/4 (25.0%)** |
  | **Total** | | **1.0 (100%)** |

  **Check the constraints:**
  *   **Neighborhood Totals:** Priya ($1/3 + 1/6 = 1/2$), Friends ($1/4 + 1/4 = 1/2$). The 50/50 split is preserved.
  *   **The Ratio:** In Priya's neighborhood, Sit-down ($1/3$) is exactly twice Noodle ($1/6$).
  *   **The Sum:** $2/6 + 1/6 + 1.5/6 + 1.5/6 = 6/6 = 1$.

  ### 2. Where the "Leakage" Illusion Comes From
  You mentioned that when you tried to write down numbers, "some of the shift always leaks into the neighborhood-level odds." This is a very common arithmetic error in probability updating.

  It usually happens because we intuitively want to **increase** the probability of the favored outcome (Priya + Sit-down) without **decreasing** the disfavored outcome (Priya + Noodle) by the exact same amount.

  If you start with 25% for each, and you think "Sit-down is now twice as likely," you might instinctively try to bump Priya+Sit-up to 50% (doubling it) while leaving Priya+Noodle at 25%.
  *   Priya Total becomes 75%.
  *   Friends Total must drop to 25% to make the sum 100%.
  *   **Result:** The neighborhood odds have shifted, even though the evidence didn't support that.

  To keep the neighborhood odds stable, you must treat the 50% allocated to Priya's neighborhood as a **fixed budget**. You are simply reallocating that budget internally. You take probability mass *away* from the Noodle shop and give it to the Sit-down place. Because the gain and loss happen within the same "account" (Priya's Neighborhood), the "bank total" (Neighborhood Probability) never changes.

  ### 3. The Principle at Stake: Modularity
  The deeper principle you are grappling with is the **modularity of conditional probabilities**.

  In a Bayesian network (or a simple decision tree), different branches can be updated independently if the evidence is specific to that branch.
  *   **Marginal Probability:** $P(\text{Neighborhood})$
  *   **Conditional Probability:** $P(\text{Restaurant} | \text{Neighborhood})$

  The overheard sentence ("If it's her neighborhood...") provides information *only* about the Conditional Probability. It does not provide information about the Marginal Probability.

  Unless the *act of hearing the sentence* is itself evidence (e.g., "Organizers only discuss restaurant ratios if they have already decided on Priya's neighborhood"), the marginal probability of the neighborhood is **screened off** from the restaurant preference.

  **The General Rule:**
  If you receive information that constrains the ratio of outcomes *within* a specific condition ($A$), but tells you nothing about the likelihood of condition ($A$) itself relative to condition ($B$), you should update the internals of ($A$) and leave the probability of ($A$) vs ($B$) untouched.

  ### Summary
  Your gut was right. The confusion arose because probability mass is conserved globally (must sum to 1), but it doesn't have to shift globally. It can shift locally. By renormalizing the probabilities *within* Priya's neighborhood (2/3 vs 1/3) and multiplying by the unchanged neighborhood prior (1/2), you get a consistent model where the neighborhood odds remain perfectly 50/50.

  You can proceed with your planning assuming the location is still a coin flip, but if it turns out to be Priya's neighborhood, you should book the sit-down place.
