answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Bride's Name]'s friend since our sophomore year of college. I'm currently getting a PhD in History, which usually means I'm the person at the party explaining why the bread prices in 1789 caused a revolution. But tonight, I promise to keep the lecturing to a minimum.

  Although, I can't avoid history entirely. Because to understand [Bride's Name], you have to understand Benjamin Franklin.

  Specifically, you have to understand a scheme Franklin cooked up in his twenties called the "Project for Moral Perfection." He listed thirteen virtues—things like Temperance, Silence, and Industry. He made a little chart. He focused on one virtue a week, and every time he messed up, he put a black mark in the box. The goal was to clear the chart. To be perfect.

  When [Bride's Name] and I took a seminar on the Enlightenment, most of us thought this was hilarious. She thought it was a lifestyle.

  For the last ten years, [Bride's Name] has kept a version of that chart. She still tracks her virtues. She still tallies her marks. And if you ask her which virtues are still giving her trouble after a decade of diligent work, she will tell you, without hesitation: Order and Resolution.

  Now, anyone who has lived with [Bride's Name] knows this is true. We all have our nemeses. But here is the thing that most people miss about Franklin's project, and the thing I want to talk about tonight.

  Franklin admits in his *Autobiography* that the project didn't work. He never cleared the chart. He was startled by how many faults he had once he actually started counting. He tried to grind down his imperfections, but he realized something profound. He tells a story about a man who wanted his axe polished perfectly bright all over. The grindstone was heavy, and the work was hard. Halfway through, the man decides he likes a "speckled axe" just fine.

  Franklin writes, "I concluded at length that a speckled axe was best."

  He realized that the pursuit of perfection was making him miserable, and that a little bit of speckle—of flaw, of mess, of humanity—was actually preferable. He even added "Humility" to his list last, after a friend told him he was arrogant. But then he immediately noted the irony: that even if he achieved perfect humility, he'd just be proud of his humility. He knew he was flawed. He made peace with it.

  And this is why I love [Bride's Name].

  She has spent ten years tracking her virtues, not because she thinks she's better than everyone else, but because she cares deeply about being good. But she has also learned, slowly, to love the speckles. She knows that Order and Resolution might always be a struggle. She knows that sometimes the chart gets messy. And she is kind enough to herself, and to us, to keep trying anyway.

  Which brings me to [Groom's Name].

  Marriage is not a Project for Moral Perfection. There is no chart on the fridge where you tally who loaded the dishwasher correctly. If there is, please hide it from me.

  Marriage is a Speckled Axe.

  It is the agreement that you will both come to the grindstone every day, but you will not demand a perfect polish. It is the understanding that you will both have weeks where you fail at Silence, or Order, or Humility. And that is okay.

  [Bride's Name], you have spent a decade practicing how to be better. [Groom's Name], your job is not to fix the speckles. Your job is to look at that axe, gleaming and scratched and real, and say, "Yes. This is exactly what I wanted."

  Franklin wrote that he never arrived at the perfection he'd been so ambitious of obtaining, but that he was a better and happier man for the attempt. And I think that is the best wish I can have for you both.

  May you be better for the attempt. May you be happier for the company. And may you always, always prefer each other's speckles to anyone else's polish.

  To [Bride's Name] and [Groom's Name].
