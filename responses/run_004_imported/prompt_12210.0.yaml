answer: |-
  Here are 8 interview questions designed to push past the textbook definition of the Knowledge Norm of Assertion (KNA) and into the tricky counterexamples. I've included the "Likely Dodge" (what an IB ToK teacher will probably say to soften the blow) and a "Follow-up" (how to press him on it).

  ### 1. The Lottery Paradox (Required)
  **Question:** "Let's start with the classic lottery case. If I hold a ticket in a 300-million-to-one lottery, statistically, I'm almost certain to lose. But under the Knowledge Norm, I'm not *allowed* to assert 'My ticket lost' before the draw, because I don't *know* it yet. But I'd happily assert things I'm way less sure of, like 'The sun will rise tomorrow.' Why does statistical certainty feel so much weaker than everyday certainty when it comes to what we're allowed to say?"

  *   **Likely Dodge:** He'll probably argue that statistical evidence isn't the same as causal or direct evidence. He might say, "You don't have a connection to the fact, just a probability."
  *   **Follow-up:** "Okay, but if the norm is about *assertion*—what we communicate to others—why does the *source* of my certainty matter? If I'm 99.9999% sure either way, isn't it misleading to tell me I can speak in one case but must stay silent in the other?"

  ### 2. Moore's Paradox vs. The Truth Norm (Required)
  **Question:** "Proponents of the Knowledge Norm love to point out that saying 'p, but I don't know that p' sounds crazy, kind of like Moore's Paradox. They say this proves Knowledge is the rule. But couldn't a simpler 'Truth Norm'—where you're only allowed to assert what is *true*—explain that weirdness too? Why do we need to drag 'Knowledge' into it specifically?"

  *   **Likely Dodge:** He'll likely say, "The Truth Norm doesn't explain why the assertion is *irrational*, only why it might be false. The Knowledge Norm explains why you shouldn't say it even if it turns out to be true."
  *   **Follow-up:** "But what about a 'Justified Belief' norm? If I have great evidence but turn out to be wrong, I violated the Truth Norm. If I have great evidence and am right, but it's just luck (no knowledge), the Knowledge Norm says I shouldn't have spoken. Isn't 'Reasonable Belief' a more practical norm for actual humans than 'Knowledge'?"

  ### 3. Jennifer Lackey's Creationist Teacher (Required)
  **Question:** "Jennifer Lackey has this famous case about a creationist teacher who teaches evolution. She asserts 'Humans evolved from primates' to her class because it's her job, but she doesn't personally believe it, so she doesn't *know* it. She seems to be doing the right thing ethically, but she's violating the Knowledge Norm. Does this mean the Knowledge Norm is actually unethical in professional settings?"

  *   **Likely Dodge:** He might try to distinguish between 'asserting' and 'reporting the curriculum.' He could say, "She isn't asserting it as her own view; she's conveying the scientific consensus."
  *   **Follow-up:** "But when she stands at the board and says 'Humans evolved,' that sounds like a flat-out assertion to the students. If she has to add '...according to the textbook' every time to satisfy the norm, isn't that undermining her authority as a teacher? Does the Knowledge Norm demand we be bad educators?"

  ### 4. The "How Do You Know?" Challenge
  **Question:** "A big argument for your view is linguistic: when someone asserts something, the natural challenge is 'How do you know?' not 'Is it true?' or 'Do you believe it?' But isn't it possible we just live in a really skeptical culture? Could 'How do you know?' just be a conversational habit rather than proof of a deep philosophical norm?"

  *   **Likely Dodge:** "It's not just habit; it's that 'I don't know' is the only concession that fully defeats the assertion. If you say 'I believe it,' the challenge still stands."
  *   **Follow-up:** "Sure, but if I say 'I have overwhelming evidence, though I can't rule out a glitch,' that usually satisfies people. If the norm was strict Knowledge, shouldn't that admission of a possible glitch shut down the conversation immediately? Why are we so forgiving in practice if the norm is so strict?"

  ### 5. High Stakes and Context
  **Question:** "Imagine I tell you 'The bank is open on Saturday.' If you're just depositing a check, that seems fine. But if you're about to miss a mortgage payment and get foreclosed on, me saying that feels irresponsible unless I've *really* checked. Does the Knowledge Norm change based on the stakes, or is Knowledge a fixed bar that we just apply differently?"

  *   **Likely Dodge:** "Knowledge itself doesn't change with stakes (invariantism), but the *appropriateness* of the assertion does. You might know it, but it's reckless to assert it in high stakes."
  *   **Follow-up:** "That sounds like you're splitting hairs. If I can 'know' it but still shouldn't 'assert' it because the stakes are high, then Knowledge isn't actually the norm of assertion—'Safe-to-Act' is. Why not just admit the norm is about practical safety, not knowledge?"

  ### 6. The "Phone a Friend" Problem (Testimony)
  **Question:** "Most of what we assert in life is stuff we heard from experts. If I tell you 'Climate change is accelerating,' I'm asserting it, but I don't understand the data, so epistemologists say I don't strictly *know* it—I just trust the scientists. Does the Knowledge Norm mean I'm technically breaking the rules every time I repeat a scientific fact I didn't verify myself?"

  *   **Likely Dodge:** "You can inherit knowledge through testimony. If the scientist knows it, and they tell you, and you trust them, you can come to know it too."
  *   **Follow-up:** "But that requires me to have good reasons to trust the scientist. If I just read a headline on Twitter, I definitely don't have that. So, are most people on social media violating the Knowledge Norm constantly? And if so, is the norm too strict to be useful?"

  ### 7. Gettier Luck
  **Question:** "In a Gettier case, I have a justified true belief, but it's only true because of luck—like I look at a broken clock that happens to show the right time. I don't have 'knowledge' there. But if I tell you 'It's 2 PM,' and it is 2 PM, did I do something wrong? Intuitively, I got lucky, but I wasn't irresponsible."

  *   **Likely Dodge:** "You did do something epistemically wrong. You asserted something you didn't know. The fact that it was true is just luck."
  *   **Follow-up:** "So the Knowledge Norm is about blaming the speaker, not the outcome? If that's the case, why do we care so much about the norm? If I can be 'epistemically wrong' but still helpful and accurate, what work is the Knowledge Norm actually doing for us?"

  ### 8. The Teacher's Dilemma (Personal Application)
  **Question:** "Since you're a ToK teacher, you have to explain complex theories to students who might not grasp all the nuances. Do you ever simplify a claim to make it understandable, knowing the simplified version isn't strictly 'known' to be true? If you do, are you violating your own favorite norm for the sake of teaching?"

  *   **Likely Dodge:** "I try to be precise, but sometimes pedagogical simplification is necessary. That's a different context than ordinary assertion."
  *   **Follow-up:** "So there are 'pedagogical exceptions' to the Knowledge Norm? If we have exceptions for teaching, and exceptions for high stakes, and exceptions for testimony... is there anything left of the norm, or is it just 'Assert what you think is appropriate'?"
