answer: |-
  This is a crucial intervention for public discourse. As a reporter, you have observed that the charge of hypocrisy functions as a "conversation-ending move." Philosophically, this aligns with what is often called the *tu quoque* fallacy, yet R. Jay Wallace's account attempts to give this fallacy moral teeth. He argues that hypocrisy isn't just a logical error; it is a moral disqualification that strips the blamer of the *standing* to hold others accountable.

  To defend the position that hypocrisy is never, by itself, sufficient to undermine standing, we must dismantle the idea that moral authority requires moral purity. We must show that Wallace's "equal standing" argument conflates *failing* to meet a standard with *rejecting* the authority of that standard. Furthermore, we must demonstrate that the intuitive force of Wallace's examples is better explained by distinct vices: **complicity** and **insincerity**.

  Here is the argument against Wallace, structured to help you navigate these controversies in your reporting.

  ### 1. The Independence of the Norm
  The fundamental error in treating hypocrisy as a standing-defeater is the assumption that the validity of a moral claim is tethered to the moral record of the claimant. It is not.

  If a smoker tells you that smoking will kill you, their advice is medically sound regardless of their own habit. In the moral realm, if a politician violates family values, the claim that "infidelity damages trust and harms families" remains sociologically and ethically true. To argue that the hypocrite lacks standing is to suggest that moral norms are only enforceable by those who perfectly embody them. This creates a "clean hands" doctrine that would silence almost all moral discourse, as moral perfection is rare.

  Wallace argues that the hypocrite loses standing because they lack the authority to speak. But moral authority is not a property of the *speaker*; it is a property of the *norm*. When a hypocrite blames, they are appealing to a shared standard. If that standard is valid, the appeal is valid, even if the appellant is a violator. In fact, the violator may be uniquely positioned to testify to the norm's importance precisely because they know the cost of violating it.

  ### 2. Where the "Equal Standing" Argument Fails
  Wallace's specific mechanism is that hypocrisy denies the "equal standing" between blamer and blamed. He contends that by holding others to a standard one exempts oneself from, the hypocrite asserts a kind of moral superiority or privilege that violates the mutual accountability required for moral community.

  This argument goes wrong in its interpretation of what the hypocrite is actually doing. Wallace assumes that when a person violates a norm they enforce, they are implicitly claiming **exemption**. But this is a misreading of human failure.

  *   **Failure vs. Exemption:** Most hypocrites do not claim they are *exempt* from the rule; they claim they are *weak*. When the climate activist flies on a jet, she rarely argues, "The rules of carbon emission do not apply to me because I am special." She usually argues, "I am trying to save the world, but I am still trapped in this infrastructure," or she simply admits the failing.
  *   **The Egalitarianism of Sin:** Paradoxically, admitting to hypocrisy can *affirm* equal standing. If I blame you for lying, and I admit I have also lied, I am saying, "We are both subject to this law, and we have both broken it." This places us on the same level. Wallace's view suggests that unless I am perfect, I cannot speak to you as an equal. But the truer form of equal standing is mutual fallibility. By insisting that only the sinless can cast the first stone, Wallace inadvertently creates a hierarchy where the "pure" have authority over the "impure," which is itself a denial of equal standing.

  Therefore, hypocrisy is not a freestanding standing-defeater because it does not necessarily entail a denial of the other's standing. It often entails an acknowledgment of shared weakness.

  ### 3. The Real Defeaters: Complicity and Insincerity
  If hypocrisy doesn't kill standing, why does it feel so objectionable in your reporting? Why does the public recoil when the family-values politician is caught cheating? The residual force of these cases is fully explained by two independent factors that Wallace lumps under "hypocrisy."

  #### A. Complicity in the Specific Wrong
  There is a difference between a general violator of a norm and an accomplice to the specific wrong being blamed.
  *   **The Scenario:** Imagine a politician who accepts bribes (Norm: No Bribery) blaming a colleague for accepting bribes.
  *   **The Problem:** Here, the blamer lacks standing not because they are a hypocrite, but because they are **complicit**. If they blame the colleague, they are often attempting to deflect scrutiny from themselves or participate in a system of corruption where blame is distributed selectively to protect the ring.
  *   **The Distinction:** This is not about "equal standing" in the abstract; it is about being a co-conspirator. A co-conspirator lacks the standing to blame because their blame is functionally an act of self-preservation within a criminal enterprise, not a genuine appeal to justice. In your climate activist example, if the activist were *selling* jet fuel or lobbying for deregulation while flying, she would be complicit. Merely flying, however, makes her a violator, not an accomplice to the system's existence.

  #### B. Insincerity and Manipulation
  The second factor is the **motive** of the blame.
  *   **The Scenario:** A politician attacks an opponent's infidelity solely to distract from their own impending scandal.
  *   **The Problem:** This is not a failure of standing; it is a failure of **sincerity**. The blame is being used as a weapon or a shield, not as a moral address. The audience senses that the blamer does not actually care about the norm (family values) but cares only about power.
  *   **The Distinction:** Wallace treats this as hypocrisy undermining standing. But we should treat it as manipulation undermining *credibility*. The politician still has the standing to say "infidelity is wrong" (the norm is valid), but the audience rightly discounts the message because the messenger is acting in bad faith.

  By separating these out, we see that "hypocrisy" is often just a label we slap on complicity or insincerity. If you remove complicity (the blamer isn't an accomplice) and insincerity (the blamer genuinely regrets their own failure and wants to uphold the norm), the "hypocritical" blame retains its force.

  ### 4. Implications for Reporting
  Adopting this framework changes how you cover these controversies. If you accept Wallace's view, your job is to adjudicate who is "clean" enough to speak. If you reject it, your job is to evaluate the **truth of the criticism** and the **motives of the critic**, independent of their record.

  *   **The Climate Activist:** Under Wallace, her carbon footprint disqualifies her critique of fossil fuels. Under the counter-view, you ask: Is her critique of fossil fuels accurate? Yes. Is she complicit in *creating* the emissions (e.g., owning the oil company), or merely *subject* to them (using a plane)? If the latter, her standing remains. Her footprint is a topic for a separate story about the difficulty of ethical living under capitalism, not a rebuttal to her policy arguments.
  *   **The Politician:** Under Wallace, his scandal voids his platform. Under the counter-view, you ask: Is the family-values platform sound? Does he sincerely believe it, or is it a prop? If he sincerely believes it but failed to live up to it, he is a tragic figure, not a silenced one. His failure proves the difficulty of the norm, not its invalidity.

  ### Conclusion
  R. Jay Wallace's account grants hypocrisy too much power. It treats a symptom (inconsistency between word and deed) as a disease (loss of moral authority). By arguing that hypocrisy is never sufficient to undermine standing, we protect moral discourse from being held hostage by the purity of the speakers.

  The "equal standing" argument fails because it mistakes human fallibility for moral exemption. When we strip away the confounding factors of **complicity** (being part of the specific wrong) and **insincerity** (using blame as a weapon), we find that a hypocrite can still speak the truth. In public controversies, acknowledging this prevents the "conversation-ending move" you identified. It forces the public to engage with the *argument* rather than dissecting the *arguer*, which is the only way to make progress on the underlying issues.
