answer: |-
  You are safe. Your mathematician can win this argument without breaking verisimilitude, because the "Halfer" position (1/2) is a fully legitimate, rigorously defended stance in formal epistemology. It is not a "mistake." In fact, having a mathematician argue for the Halfer position against a philosopher arguing for the Thirder position is a very realistic dynamic.

  Here is the substance you need to make the scene bulletproof.

  ### 1. The Core Disagreement
  The Sleeping Beauty problem splits experts roughly 50/50. There is no settled consensus.
  *   **Thirders (Your Ex):** Argue that upon waking, Beauty gains *self-locating information*. She learns "I am in a waking moment." Since there are three possible waking moments (Heads-Mon, Tails-Mon, Tails-Tue) and only one involves Heads, the probability is 1/3.
  *   **Halfers (Your Mathematician):** Argue that Beauty gains *no new relevant information*. She knew on Sunday she would be woken at least once. Therefore, her credence in the coin flip (an external event) should not update.

  ### 2. How the Mathematician Wins (The Argument)
  Your gut is correct: the strongest Halfer argument is based on **Bayesian Conditionalization**.

  **The Logic:**
  To update a probability from a prior (Sunday) to a posterior (Monday), you need new evidence $E$. The formula is $P(Heads | E)$.
  *   **Prior:** On Sunday, $P(Heads) = 1/2$.
  *   **Evidence:** The evidence is "I am awake."
  *   **Likelihood:** What is the probability of being awake if Heads? 100%. What is the probability of being awake if Tails? 100%.
  *   **Result:** Since the evidence is equally likely under both hypotheses, it does not discriminate between them. The ratio remains 1:1. The probability stays 1/2.

  **The "Winning" Line:**
  Have your mathematician point out that the philosopher is confusing the **probability of the event** with the **frequency of the observation**.
  *   *Mathematician:* "You're counting *wakings*, not *worlds*. There are two possible worlds: one where the coin is Heads, one where it's Tails. They are equally weighted. Just because the Tails world forces me to open my eyes twice doesn't make that world more 'true' than the Heads world. It just makes it more crowded."

  ### 3. Deflecting the Philosopher's Best Shot (The Betting Argument)
  The philosopher's strongest weapon is the "Dutch Book" or betting argument.
  *   *Philosopher:* "If you bet \$1 on Tails every time you wake, you win \$2 over two days (Tails) but only lose \$1 (Heads). You should act as if Tails is 2/3 likely."
  *   *Mathematician's Counter:* This is where she secures the win. She needs to separate **Credence** (belief) from **Betting Odds** (decision theory).
  *   *The Argument:* "The payout structure is skewed, not the probability. If I bet on Tails, I get to collect twice. That doesn't mean the coin is biased; it means the *payoff* is duplicated. I can maintain 1/2 credence in Heads and still refuse that bet because I know the payout rules are rigged by the experimental design, not the coin."

  ### 4. Scene Beats for Authenticity
  To make a philosopher reader nod instead of wince, avoid having the mathematician dismiss the complexity. She should acknowledge it, then cut through it.

  *   **Don't:** Have her say "It's obviously 50% because coins are fair." (Too simplistic).
  *   **Do:** Have her say "The coin is fair, and my awakening is guaranteed regardless of the outcome. Conditionalizing on a tautology doesn't shift the prior."

  **Suggested Dialogue Snippet:**

  > **Ex:** "But you have to account for the indexical uncertainty. You don't know *which* waking this is."
  >
  > **Mathematician:** "I don't need to. The question isn't 'What day is it?' It's 'What did the coin do?' On Sunday, I knew I would be standing exactly where I am now, whether the coin was Heads or Tails. If my situation is identical in both branches of the tree, I haven't moved. I haven't learned anything. You're trying to derive a probability from a sampling bias."
  >
  > **Ex:** "It's not bias, it's frequency."
  >
  > **Mathematician:** "It's frequency of *interviews*, not frequency of *flips*. If you run this experiment a thousand times, you get five hundred Heads. Not three hundred and thirty-three. The coin doesn't care how many times you wake me up to ask about it."

  ### 5. Why This Fits Your Arc
  This works perfectly for a mathematician character. Mathematicians often prefer clean, axiomatic systems (the coin is fair, the priors are set) over the messy, linguistic gymnastics of self-locating belief that philosophers enjoy.

  By having her win on the **"No New Evidence"** ground, you portray her as someone who trusts the formal structure of probability over the semantic confusion of the scenario. It shows she isn't intimidated by the philosophy jargon; she sees the underlying mechanism.

  **Verdict:** Your instinct is sound. The Halfer position is robust enough to support her victory without making her look incompetent to an expert reader. Just ensure she frames it as an issue of *information update* rather than just intuition.
