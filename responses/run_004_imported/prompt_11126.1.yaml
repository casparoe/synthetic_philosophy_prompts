answer: |-
  Good evening. For those of you who don't know me, I'm the older brother. I'm also the philosophy professor in the family. My sister, the bride, likes to remind me that while she studies how life *actually* works, I just study how we *talk* about how it works.

  But today, I want to borrow from her world. Specifically, I want to talk about a concept called the Handicap Principle, proposed by the biologist Amotz Zahavi.

  Now, half of you are nodding, and the other half are checking to see if the bar is still open. Stay with me.

  Zahavi wanted to solve a problem: How do we know when a signal is honest? In nature, anyone can make a sound. Anyone can puff up their chest. If a gazelle wants to tell a lion, "I am fit, don't bother chasing me," it could just whisper it. But the lion wouldn't believe it. It's too cheap to fake.

  So, the gazelle stotts. It leaps into the air, wasting energy, exposing itself, right in front of the predator. It takes a handicap. It does something costly. And precisely *because* it is costly, precisely because a weak gazelle couldn't afford to do it, the signal is honest. The cost *is* the message.

  My sister studies this. She knows that in biology, a peacock's tail isn't beautiful despite being cumbersome; it's beautiful *because* it is cumbersome. It proves survival ability by surviving despite the disadvantage.

  When [Sister] and [Partner] asked me to speak, I kept circling back to this idea. Because, if you think about it, a wedding is the ultimate biological handicap.

  We could have gone to a courthouse. We could have sent an email. "Trust us, we're committed." That would be the cheap signal. Easy to produce. Easy to fake.

  Instead, they chose this. They gathered their entire community. They spent resources. They made themselves vulnerable. They stood up in front of you—grandparents, cousins, colleagues, friends—and made a promise that is legally, socially, and emotionally expensive to break. They incurred a cost.

  I know what some of the biologists in the room might be thinking. "Wait, isn't the Handicap Principle about mate acquisition? They're already a pair. Isn't the game over?"

  It's a fair technical objection. But I would argue that marriage isn't the capture of the mate; it is the maintenance of the signal.

  In the wild, signaling stops once the goal is achieved. But in a human life, the signaling *is* the life.

  Love, viewed through a philosophical lens, is often described as a feeling. But viewed through Zahavi's lens, love is a continuous series of costly choices. It is the willingness to prioritize another person's well-being above your own efficiency. It is the energy spent listening when you are tired. It is the compromise made when you could be right. It is the handicap of vulnerability in a world that rewards armor.

  [Sister] and [Partner], you two know better than anyone that nature is red in tooth and claw. You know that entropy is the default state of the universe. Relationships, like organisms, tend toward decay unless energy is pumped into them.

  The Handicap Principle teaches us that honesty isn't found in the easy words. It's found in the hard actions. It is found in the things that are difficult to fake.

  To our family: You might hear "costly signaling" and think this sounds cold. But I promise you, it is the opposite. It means that every time one of you makes a sacrifice for the other, every time you choose patience over anger, or presence over distraction, you are engaging in the most honest communication possible. You are saying, "I am willing to bear a cost to show you that you matter."

  To the department: Yes, I know this is an extrapolation of the theory. But philosophy has always been in the business of finding human meaning in structural truths. And the truth here is clear: Trust is not built on what is easy to say. It is built on what is hard to do.

  [Sister], [Partner], you have already stotted. You have displayed your commitment in the most public, magnificent way possible. But the real work begins tomorrow. The real signal is not the wedding you threw, but the marriage you keep.

  So, if everyone could please rise.

  I'd like to propose a toast.

  To the bride and groom: May your signals always be honest. May your costs be willingly borne. And may you find, in the beautiful burden of each other, the only proof of love that matters.

  To [Sister] and [Partner].
