prompt: |-
  My younger sister is a behavioral ecologist -- stotting in gazelles, some sexual selection work in birds -- and she's marrying her partner, also a biologist, in a few weeks. She's asked me, her older brother and (unfortunately, according to her) the philosophy professor in the family, to give the wedding toast. I keep circling back to Zahavi's handicap principle -- that whole costly-signaling idea that hard-to-fake signals are what make communication honest, precisely because a cheap "trust me" can be produced by anyone regardless of whether its true -- because I think there's something genuinely moving hiding in there about weddings: the whole ridiculous, expensive, public, impossible-to-take-back production of the thing being the point rather than a regrettable side effect, the way a peacock's tail proves something its call never could.

  I'm nervous about actually pulling this off though. Half the guests are people from her department who will notice immediately if I get Zahavi wrong or if the analogy doesn't actually hold up -- and honestly I'm not even sure the principle is supposed to apply to signals within an already-formed pair, as opposed to signals aimed at rivals or prospective mates, so there's a technical worry sitting right next to the emotional one. The other half is our grandmother and a dozen cousins who did not come to a wedding for a lecture on sexual selection, they came to hear that these two people love each other. Could you draft me something, four or five minutes read aloud, that actually uses the handicap principle as the engine of the toast rather than a cute reference dropped in once and then abandoned? It has to survive both crowds: it can't come across as "your marriage is just a fitness display," which would genuinely hurt my sister's feelings, but it also can't chicken out of the idea once it's raised. Bonus points if it ends on a line people can actually raise a glass to.
reasoning: |-
  Here's a thinking process that leads to the suggested wedding toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Older brother, philosophy professor.
      *   **Audience:** Mixed. Half biologists (sister is a behavioral ecologist, groom is a biologist), half family (grandmother, cousins, non-academics).
      *   **Subject:** Sister (behavioral ecologist, studies stotting/sexual selection) marrying Partner (biologist).
      *   **Core Theme:** Zahavi's Handicap Principle (costly signaling theory).
      *   **Constraint 1:** Must use the principle as the *engine* of the toast, not just a passing reference.
      *   **Constraint 2:** Must be technically accurate enough for biologists (no glaring errors regarding the scope of the principle).
      *   **Constraint 3:** Must be emotionally resonant for family (not reducing love to mere fitness signaling).
      *   **Constraint 4:** Length: 4-5 minutes read aloud (approx. 600-750 words).
      *   **Constraint 5:** Needs a toast line at the end.
      *   **Tone:** Warm, intellectual but accessible, witty, sincere.

  2.  **Deconstruct the Handicap Principle (Zahavi):**
      *   *Core Idea:* Signals are honest only if they are costly to produce. A cheap signal (saying "I love you") is easy to fake. A costly signal (building a nest, fighting a rival, or throwing a massive wedding) proves commitment because it would be too expensive to fake if the underlying quality wasn't there.
      *   *Technical Worry:* The user is worried about applying it to *established pairs* vs. *mate choice*.
      *   *Resolution:* In behavioral ecology, costly signaling isn't *just* for acquisition. It's for maintenance and reassurance. Pair-bonding rituals often involve continuous investment. The wedding itself is the ultimate "stot" – a public declaration that consumes resources to signal intent to the community and each other. I need to frame the marriage *itself* as the ongoing costly signal, not just the courtship.
      *   *Emotional Translation:* "Cost" shouldn't mean "burden." It should mean "investment." The willingness to incur cost *is* the love.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (philosopher brother) and the sister's field. Set the stage. Establish the connection between philosophy and biology (truth, signals).
      *   **The Theory (The "Meat"):** Explain Zahavi simply. Use the gazelle/stotting reference since the sister studies it. Explain *why* cost matters (honesty).
      *   **The Pivot (The "Worry"):** Address the technical concern subtly. Acknowledge that usually, this is about *getting* the mate. But argue that marriage is about *keeping* the mate. Shift from "courtship display" to "lifetime investment."
      *   **The Application (The "Heart"):** Apply it to the couple. The wedding is the signal, but the marriage is the ongoing cost. It's not about fitness; it's about vulnerability and sacrifice.
      *   **The Family Angle:** Bring in the grandmother/cousins. Make sure they understand this isn't cold science; it's warm humanity.
      *   **The Toast:** A clear, punchy closing line.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add personal anecdotes or warmth about the sister.
      *   *Critique:* Is the biology accurate enough?
      *   *Fix:* Ensure I distinguish between the *wedding* (the initial signal) and the *marriage* (the ongoing maintenance). Zahavi's principle applies to honest signaling of quality/intent. The "quality" here is commitment.
      *   *Critique:* Will the grandma get it?
      *   *Fix:* Avoid jargon where possible. Define "handicap" clearly as "sacrifice."
      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences rhythmic. Aim for ~700 words.

  5.  **Drafting - specific phrasing ideas:**
      *   "As a philosopher, I deal in truth. As a biologist, [Sister] deals in survival."
      *   "Stotting." (Must include this).
      *   "The peacock's tail."
      *   "Cheap talk."
      *   "The cost is the point."

  6.  **Addressing the Technical Worry:**
      *   The user is right that Zahavi focused heavily on mate choice and predator deterrence (stotting). However, Amotz Zahavi also wrote about "altruism as a handicap" and signaling within social groups. I can frame the wedding as a signal to the *community* (kin selection/social bonding) and the marriage as a signal of continued investment. I won't get bogged down in the academic debate, but I will frame it as "signaling commitment," which is valid.

  7.  **Final Polish:**
      *   Check timing.
      *   Ensure the transition from "science" to "sentiment" is smooth.
      *   Make sure the toast line is distinct.

  **(Self-Correction Note):** I need to be careful not to imply the *partner* is the handicap. The *investment* is the handicap. The willingness to be vulnerable is the cost.

  8.  **Final Review against constraints:**
