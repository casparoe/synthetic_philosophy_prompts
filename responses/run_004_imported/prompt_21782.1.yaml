      *   *Core Argument 1: Intrinsic Disutility of Knowledge.* Standard decision theory assumes state-separability. $U(outcome)$. If $U(outcome, knowledge)$, Good's inequality doesn't hold. Cite **Jeffrey (1965)** or **Skyrms (1990)** on the value of knowledge. Actually, better to cite the distinction between *instrumental* and *intrinsic* value of information.
