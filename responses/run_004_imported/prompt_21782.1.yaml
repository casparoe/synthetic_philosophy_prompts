      *Key technical point:* Good's theorem relies on the convexity of the maximum function. $\mathbb{E}[\max_a U(a, \omega)] \ge \max_a \mathbb{E}[U(a, \omega)]$. This holds if $U$ depends only on $a$ and $\omega$. If $U$ depends on the signal $s$ received (i.e., $U(a, \omega, s)$), the inequality does not necessarily hold. This is the mathematical heart of the counter-argument.

