      *   **Section 3: The "Costless" Assumption and Psychic Costs.** Distinguish between the cost of the *test* and the cost of the *knowledge*. If the knowledge itself induces negative utility (dread), it functions as a cost.
      *   **Section 4: State-Space Expansion.** Knowing changes the world state (psychological reality), not just the probability distribution over existing states.
