answer: |-
  Your friend is technically correct about the math but materially wrong about the model. Good's Theorem (1967) is a valid theorem, but like all theorems, it is conditional on specific axioms. When those axioms fail to map onto the phenomenology of predictive genetic testing, the theorem's conclusion (that acquiring information is always rational) no longer applies.

  To arm your sidebar, you need to show that the "irrationality" charge rests on a category error: your friend is treating information as purely *instrumental* (a tool for action), whereas for Huntington's decliners, information functions partly as a *consumption good* (an experience with intrinsic utility).

  Here is the rigorous case for why declining the test is consistent with Bayesian rationality, structured around the specific assumptions Good's proof requires.

  ### 1. The Utility Function Assumption: $U(a, \omega)$ vs. $U(a, \omega, k)$

  Good's Theorem proves that the expected utility of acting *after* observing a signal $s$ is greater than or equal to the expected utility of acting *before*, provided the information is free.

  The proof relies on the inequality:
  $$ \sum_{s} P(s) \max_{a} EU(a | s) \ge \max_{a} \sum_{s} P(s) EU(a | s) $$

  This inequality holds because the $\max$ function is convex. However, this formulation assumes the utility function is defined over **actions** ($a$) and **world-states** ($\omega$). It implicitly assumes that the agent's *knowledge state* ($k$) does not enter the utility function directly.

  **The Counter-Argument:**
  For a Huntington's test, the utility function is not $U(a, \omega)$. It is $U(a, \omega, k)$.
  *   $\omega$: Whether I have the gene.
  *   $k$: Whether I *know* I have the gene.

  If I test positive, I enter a state of "knowing." If I decline, I remain in a state of "uncertainty." For many at-risk individuals, the state of *knowing* they will develop a fatal, untreatable neurodegenerative disease carries massive negative intrinsic utility (dread, loss of hope, psychological burden), independent of any actions they take based on that knowledge.

  If $U(\cdot, \omega, \text{Know}) < U(\cdot, \omega, \text{Ignorant})$, then information has **negative intrinsic value**. Good's Theorem only guarantees that information has non-negative *instrumental* value. If the intrinsic disutility of knowing exceeds the instrumental value of the information, the rational choice is to decline. This is not irrationality; it is maximizing a utility function that includes epistemic states as arguments.

  ### 2. The "Costless" Assumption and Psychic Transaction Costs

  Your friend invokes the "costless" clause of Good's Theorem ("free and takes an afternoon"). In decision-theoretic terms, "costless" means $C(s) = 0$ for all signals $s$.

  **The Counter-Argument:**
  The "cost" in decision theory is any reduction in utility associated with the acquisition of the signal. The friend is conflating *monetary/temporal cost* with *utility cost*.
  *   **Ex-ante cost:** The anxiety while waiting for results.
  *   **Ex-post cost:** The permanent psychological burden of a positive result.

  Even if the monetary price is zero, the *psychic cost* $C(s)$ is positive. The generalized decision rule is: Acquire information if $VOI \ge C$.
  If the decliner anticipates that the psychological impact of a positive result (which occurs with probability $p$) will degrade their quality of life more than the test results will improve their decision-making, then $C > VOI$.

  Your friend might argue: "But a rational agent should just factor that cost in." Exactly. If they factor it in and decline, they are obeying the generalized theorem, not violating the basic one. The basic theorem only applies when $C=0$. In Huntington's testing, $C \neq 0$ because the *state of knowing* is itself a utility-relevant outcome.

  ### 3. The "Ignore the Evidence" Defense

  A common defense of Good's Theorem is: *"You can always choose to ignore the new evidence and act exactly as you would have without it. Therefore, you are at least as well off."*

  **The Counter-Argument:**
  This defense assumes **reversibility of belief states**. It assumes that upon receiving signal $s$, the agent can choose to act as if they received no signal, effectively retaining the utility of the prior belief state.

  In genetic testing, you cannot "ignore" the evidence in the relevant sense. You cannot un-know a positive result.
  *   **Without testing:** You live in a probability distribution (e.g., 50% risk). You can plan for a normal lifespan.
  *   **With testing (Positive):** You live in a certainty (100% risk). Even if you take no specific medical actions, your *experience* of the intervening years is fundamentally altered.

  The "ignore" defense fails because the utility function is sensitive to the *posterior probability*, not just the action taken. If $U$ depends on your subjective probability of disease (e.g., peace of mind requires $P(Disease) < 0.5$), then updating to $P(Disease) = 1$ destroys that utility component, regardless of what actions you subsequently choose. You cannot "act as if" you don't know when the utility is derived from *not knowing*.

  ### 4. State-Space Expansion

  Good's Theorem assumes a fixed state space $\Omega$ that is merely partitioned more finely by the information.

  **The Counter-Argument:**
  Acquiring genetic knowledge does not just partition the existing state space; it **expands** it.
  *   **State A:** At risk, Untested.
  *   **State B:** At risk, Tested Positive.
  *   **State C:** At risk, Tested Negative.

  State A is phenomenologically distinct from State B, even if the biological outcome (developing the disease) is identical. In State A, the future is uncertain; in State B, it is determined. These are different "world-states" in the utility sense.

  Good's Theorem compares $EU(\text{act} | \text{partition})$ vs $EU(\text{act} | \text{prior})$. It does not account for the transition from World A to World B. If the transition itself entails a utility loss (the "death of hope"), the theorem's comparison is invalid because the baseline utilities have shifted. The decliner is not refusing information to make a better decision; they are refusing to transition into a lower-utility world-state.

  ### 5. Precommitment and Time Consistency

  Finally, you can frame the decision as a problem of **dynamic consistency**.
  A rational agent at Time 0 (before testing is available) might prefer a commitment to ignorance. If the agent knows that their future self (Time 1, post-test) will suffer utility loss from knowledge without gaining compensatory instrumental value, the Time 0 self rationally restricts the action set of the Time 1 self.

  This is analogous to Ulysses binding himself to the mast. It is not irrational to restrict future information access if the agent correctly predicts that the information will alter their utility function in a way that reduces total lifetime expected utility. Good's Theorem is a static result; it does not govern dynamic preferences over information access when knowledge itself is a "bad."

  ### Summary for the Sidebar

  You can summarize the technical rebuttal like this:

  > Good's Theorem proves that free information has non-negative *instrumental* value—it can help you make better decisions. It does not prove that information has non-negative *intrinsic* value. For Huntington's decliners, the utility function isn't just about medical outcomes; it includes the psychological state of *knowing*. If the dread of certainty outweighs the benefit of better planning, the "cost" of the information (in utility terms) is positive. A rational Bayesian maximizes expected utility, not expected information. When knowledge itself is a consumption good—and in this case, a toxic one—ignoring the theorem's instrumental mandate is the only way to satisfy the utility mandate.

  This allows you to concede the math to your friend while completely undermining his application of it to the human reality of the story.
