prompt: |-
  So I need some help with something, and honestly you might be the only unbiased party left after this. Last weekend I got into a long, genuinely heated argument with my friend Tom over dinner about G.E. Moore, specifically the very end of Principia Ethica, chapter six, "The Ideal," where he argues the two best things in the world, by a huge margin, are basically appreciating beauty and loving people. I said something like "oh so he's just saying love and art are what make life worth it, thats nice" and Tom practically stood up, because apparently thats exactly the flattened, hallmark-card version of the argument that drives him insane. He went on for like twenty minutes about "organic unities" and how the whole point is that these two goods aren't just two nice things you list side by side and add up — the value of actually perceiving someone's real good qualities and loving them for it (or genuinely appreciating something beautiful, not just having it exist near you unnoticed) is supposed to be way more than the sum of those parts, and if you miss that bit you don't actually get why Moore ranks it above pleasure or knowledge or virtue on its own. He also went off about how this exact chapter is apparently what Keynes and that whole Cambridge/Bloomsbury crowd treated like scripture as young men, while conveniently skipping over Moore's much duller chapter on actual duty and conduct, which Tom finds hilarious and also a bit of a philosophical own-goal on their part.

  Here's the complication: Tom is a philosophy PhD student, he's marrying Priya in three weeks, and I agreed to give a toast at this wedding months before any of this blew up. Now that I know exactly how allergic he is to lazy readings of his favorite book, I feel like I actually have to get this right or he will 100% clock it mid-speech and never let me hear the end of it.

  So could you write me the toast? I need the organic unities idea to actually structure the whole thing — why "beauty and friendship" for Moore isn't just two good things mentioned in the same breath but something weirder and stronger than that — rather than just a name-dropped quote at the top for flavor. But it still has to work as an actual toast: half the room is Tom's philosophy cohort, who will absolutely notice a sloppy paraphrase, and the other half is family who just want something warm and a little funny about these two specific people, and nobody wants to sit through a seminar at an open bar. Extra points if you can gently gesture at the obvious joke that this is a philosophy tailor-made for people with excellent taste and no chores, without turning the toast into a takedown — Tom would genuinely enjoy being teased with his own material. Keep it to around four minutes out loud.
