answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of being one of Tom's oldest friends.

  Now, full disclosure: standing here tonight is a bit of a gamble. Because last weekend, Tom and I got into a genuinely heated argument over dinner about G.E. Moore. Specifically, Chapter Six of *Principia Ethica*.

  I made the mistake of saying, "Oh, so Moore just thinks love and art are nice." Tom practically overturned the table. He spent twenty minutes explaining that for Moore, the value isn't in "love" and "beauty" as separate items on a grocery list. It's in the *organic unity* of them. The value lies in the specific state of consciousness where you have an appropriate emotion directed at a truly worthy object. It's not just the love, and it's not just the person. It's the *appreciation* of the person that creates the good.

  He was right. I was wrong. And honestly, looking at Tom and Priya tonight, I finally get it.

  If you just added Tom and Priya together as two separate, excellent individuals, you'd have a very high sum. But Moore's point—and the point of this marriage—is that the whole is greater than the sum of its parts. When you see them together, you aren't seeing two distinct variables. You're seeing a single, unified state of affairs where the affection is perfectly matched to the object of that affection. In philosophical terms: Priya is the worthy object, Tom is the conscious appreciator, and the marriage is the organic unity that holds the actual value.

  And Tom, I have to acknowledge the elephant in the room regarding your interpretation of Moore. We all know that for Keynes and the Bloomsbury group, Chapter Six was scripture. It was the philosophical justification for a life devoted to art and love, while largely ignoring Chapter Seven, which is the much duller bit about "Duty" and "Moral Rules."

  I see you smiling, Tom. You think you've found the Bloomsbury loophole. You think because Moore says "appreciate beauty and love people," you get to skip the chores. But I've seen your apartment. I'm here to tell you that while Moore might have skipped the duty chapter, Priya has not. And an organic unity that includes a dishwasher is significantly more valuable than one that doesn't.

  But in all seriousness, what makes this work isn't just that Tom loves Priya. It's that he *sees* her. He perceives her qualities, and his emotion is adequate to the object. And vice versa. That mutual recognition is rare. It's the kind of thing philosophers write thousands of pages trying to define, and somehow, these two just… live it.

  So, for the philosophers in the room: May your values always be intrinsic, and your unities always organic.
  And for the rest of the family: May your love be deep, your life be beautiful, and may you never have to argue about ethical theory over dinner.

  To Tom and Priya.
