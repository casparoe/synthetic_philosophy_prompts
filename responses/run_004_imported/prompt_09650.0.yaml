      *   **Topic:** A proposal requiring voters to pass a 10-question quiz on ASB officer duties before voting for President.
      *   **Context:** Low turnout (20%), voter ignorance (don't know what Treasurer does).
      *   **Conflict:** Advisor compared it to Jim Crow literacy tests. Elections Chair argues it's different (retakeable, specific content).
      *   **Requirements:**
          *   Recommend Adopt, Reject, or Adopt-with-Changes.
          *   Provide real reasons.
          *   *Crucially:* Engage directly with the literacy test comparison (cannot wave it away).
          *   Tone: Professional, student-leader appropriate, balanced, constitutional.

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt):* Too risky. The literacy test comparison is legally and ethically heavy. Even if the intent is good, the precedent is dangerous.
      *   *Option B (Reject):* Safe, but ignores the real problem (voter apathy/ignorance). Doesn't offer a solution.
      *   *Option C (Adopt-with-Changes / Alternative):* Best path. Acknowledge the problem (apathy) but reject the specific mechanism (barrier to entry) due to the historical/legal parallel. Propose alternatives that educate without disenfranchising.
      *   *Decision:* **Reject the specific quiz requirement, but Adopt a plan for Voter Education.** (Effectively "Reject with Recommendations"). This allows the committee to say "No" to the problematic policy while still addressing the Elections Chair's valid concern.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the committee's vote/recommendation clearly.
      *   **Background:** Briefly summarize the proposal and the problem it tries to solve (low turnout, lack of knowledge).
      *   **Analysis of the Proposal (The Core):**
          *   *Intent:* Acknowledge the Elections Chair's good intentions (informed electorate).
          *   *The Comparison:* Address the Advisor's point head-on. Why *is* it like a literacy test? (Barrier to entry, potential for bias, administrative burden). Why does the "retakeable" argument not fully fix it? (Still a barrier, chills participation).
          *   *Legal/Equity Concern:* Even if not illegal (it's a club/school org, not federal election), it sets a bad ethical precedent and could disproportionately affect certain groups (ESL students, learning disabilities, new students).
      *   **Recommendation:** Clearly state "Do Not Adopt" regarding the quiz.
      *   **Alternative Solutions:** How do we fix the actual problem? (Campaign debates, social media explainers, town halls, sample ballots).
      *   **Conclusion:** Wrap up with a forward-looking statement.

  4.  **Refining the Tone:**
      *   Needs to sound like a high school student leader (earnest, structured) but mature enough for a constitutional debate.
      *   Avoid attacking the Elections Chair personally. Focus on the *policy*.
      *   Ensure the literacy test comparison is treated with the gravity it deserves, not dismissed.

  5.  **Drafting - Specific Content Considerations (Self-Correction during drafting):**
