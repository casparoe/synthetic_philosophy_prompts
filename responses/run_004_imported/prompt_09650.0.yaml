answer: |-
  **MEMORANDUM**

  **TO:** ASB Full Council
  **FROM:** Constitution Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Proposal 23-04 (Voter Competency Quiz)

  **I. Executive Summary**
  The Constitution Committee met on October 18 to review Proposal 23-04, submitted by the Elections Chair. The proposal sought to mandate a 10-question quiz on ASB officer duties as a prerequisite for casting a ballot for ASB President. The stated goal was to increase voter competency and address low turnout (approx. 20%).

  After deliberation, the Committee recommends that the Full Council **REJECT** the mandatory quiz requirement. However, recognizing the validity of the underlying concern regarding voter apathy, the Committee simultaneously recommends the **ADOPTION** of an alternative Voter Education Initiative.

  **II. Background and Intent**
  The Elections Chair identified a significant gap in student knowledge regarding ASB functions. Data suggests that while turnout is low, a portion of the voting population cannot identify the roles of specific officers (e.g., Treasurer vs. Secretary). The proposal aimed to ensure that votes cast for the executive office were informed, theoretically increasing the legitimacy of the election results.

  **III. Analysis of the Mandatory Quiz**
  The Committee engaged in extensive debate regarding the mechanism of the proposal. While we agree that an informed electorate is ideal, we determined that a mandatory barrier to voting presents significant constitutional and ethical risks.

  **A. Engagement with Historical Precedent**
  During the committee meeting, the ASB Advisor raised a comparison between this proposal and the literacy tests used during the Jim Crow era to disenfranchise minority voters. The Committee takes this comparison seriously and cannot dismiss it based solely on differing intent.

  While the Elections Chair noted that this quiz is retakeable and specific to student government (unlike the arbitrary and impossible literacy tests of the 1960s), the Committee finds that the *mechanism* shares concerning characteristics with historical barriers:
  1.  **Friction as Suppression:** Any added step between a citizen and the ballot box reduces participation. Our goal is to increase the 20% turnout, not filter the existing voters.
  2.  **Subjectivity and Access:** Even with a set question bank, quizzes favor students with strong test-taking skills, native English speakers, and those with more free time to study. This could inadvertently disenfranchise ESL students, students with learning differences, or those with heavy work/family commitments.
  3.  **Precedent:** Establishing that the ASB has the authority to test voters on "competency" sets a dangerous precedent. Today it is officer duties; tomorrow it could be policy positions or attendance records. The Constitution Committee believes the right to vote within our school should be universal for all enrolled students, not contingent on administrative approval of their knowledge level.

  **B. Effectiveness**
  There is no evidence that a mandatory quiz increases long-term civic engagement. It may instead breed resentment, causing students to view ASB elections as bureaucratic hurdles rather than opportunities for representation.

  **IV. Alternative Recommendation: Voter Education Initiative**
  Rejecting the quiz does not mean ignoring the problem. To address the Elections Chair's valid concern about voter ignorance, the Committee proposes the following alternative measures to be implemented during Election Week:

  1.  **"Know Your Ballot" Campaign:** The Elections Chair will produce short-form social media content (TikTok/Instagram Reels) explaining each officer's role prior to voting opening.
  2.  **Sample Ballot & Guide:** A digital guide outlining officer duties will be sent to all students via email and linked prominently on the voting portal.
  3.  **Town Hall Requirement:** All candidates for Executive Board must attend one lunchtime town hall to answer student questions, ensuring voters have access to information without being tested on it.

  **V. Conclusion**
  The Constitution Committee believes that the solution to voter apathy is education, not restriction. We must lower the barrier to entry for voting while raising the level of information available. Therefore, we move to reject the mandatory quiz requirement and approve the Voter Education Initiative outlined above.

  **Committee Vote Count:**
  *   **Reject Proposal 23-04:** 5 Yes, 2 No
  *   **Adopt Voter Education Initiative:** 7 Yes, 0 No

  Respectfully submitted,

  [Your Name]
  Sophomore Representative, Constitution Committee
