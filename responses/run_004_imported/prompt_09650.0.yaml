prompt: |-
  okay so i'm the sophomore rep on my school's ASB Constitution Committee, and this week we're voting on a proposal from the elections chair: before anyone can vote for ASB president they have to pass a quick 10-question quiz on what the officers actually do, since turnout is only like 20% and most people who do vote can't even say what the treasurer does. our advisor pointed out that this is basically the same move as the literacy tests used to keep people from voting in the Jim Crow south, which kind of derailed the meeting -- the elections chair says its different bc the quiz is retakeable and its about our actual student gov instead of general literacy. i have to write the committee's decision memo before we present to full council thursday: it needs to actually recommend adopt, reject, or adopt-with-changes, give real reasons, and it can't just wave away the literacy-test comparison, it has to actually engage with it. can you draft that for me?
