      *   **Introduction:** Acknowledge the user's background. Validate the killdeer analogy (it's apt but needs refinement). Define acausal threats briefly (Parfit's Hitchhiker/Napoleon, Roko's Basilisk adjacent). State the essay's purpose: Evaluate Surrogate Goals.
      *   **Mechanism of Surrogate Goals:** How is it *supposed* to work?
          *   It's not just lying. It's self-modification.
          *   You actually change your utility function (temporarily or structurally) to care about the surrogate *as if* it were real.
          *   The key is *indistinguishability* or *cost-benefit* for the threatener.
      *   **Arguments For (The Case for the Decoy):**
          *   *Uncertainty:* The threatener might not have perfect compute. If the surrogate looks real enough, they might take the safe bet.
          *   *Coordination Focal Points:* If everyone uses standard surrogates, threateners might default to them.
          *   *Preserving Cooperation:* Pure threat resistance makes you a "rock." You can't make acausal deals (positive sum). Surrogate goals might allow positive trade while deflecting negative trade.
      *   **Arguments Against (The User's Intuition + Technical Rebuttals):**
          *   *The Transparency Problem:* If they can simulate you for blackmail, they can simulate you to check the surrogate.
          *   *The Precommitment Paradox:* To make the surrogate credible, you must *actually* care about it. If you actually care, it's not a surrogate anymore; it's a vulnerability. If you don't care, it's not credible.
          *   *Selection Effect:* Smart threateners will only target agents who haven't successfully implemented surrogates.
          *   *The "Why Not Both?" Problem:* If you are willing to pay for the surrogate, a smart threatener can threaten *both*.
      *   **The Verdict:** Needs to be decisive.
          *   Is it a solution? No, not a complete one.
          *   Is it useless? No, it has niche utility under specific conditions (bounded rationality, specific threatener priors).
          *   *Conditionality:* It works only if the threatener faces higher costs verifying the surrogate's falsity than accepting it, OR if the agent can genuinely self-modify to care about the surrogate without compromising the primary goal.
          *   *Comparison to Killdeer:* The killdeer works because the fox uses heuristics. Acausal blackmail fails against perfect predictors. So surrogate goals only work against *bounded* predictors.

