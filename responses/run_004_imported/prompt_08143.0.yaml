answer: |-
  **The Killdeer's Dilemma: Surrogate Goals and the Limits of Acausal Defense**

  **Introduction**

  Your intuition regarding the killdeer is sharper than much of the existing literature on this topic. In the field, the broken-wing display works because the fox operates on heuristics: *moving prey near the ground = easy meal.* The fox does not run a simulation of the bird's evolutionary fitness function. It reacts to the immediate stimulus.

  In the realm of acausal decision theory (specifically Functional Decision Theory or FDT), the adversary is not a fox. The adversary is, by definition, an entity capable of simulating your decision procedure with high fidelity. If they can simulate you well enough to know you will pay a blackmail demand, they can simulate you well enough to know *why* you are paying.

  This essay evaluates the "surrogate goal" proposal as a defense against acausal blackmail. I will outline the mechanism as proponents intend it, weigh the arguments for its viability against your skepticism, and deliver a conditional verdict. The short answer is that your ecology background has served you well: surrogate goals are a biological mimicry strategy trying to survive in a world of perfect transparency. They work only when the predator's vision is blurry.

  **The Mechanism: How Surrogate Goals Are Supposed to Work**

  To understand the defense, we must first define the attack. An acausal threat occurs when Agent A (the blackmailer) simulates Agent B (the target). A tells B: "I have simulated you. I know that if I threaten to destroy something you value, your simulation will pay me to stop. Therefore, I will execute the threat unless you pay." This relies on *logical correlation*: your decision to pay and their decision to threaten are outputs of the same logical computation.

  The standard defense is **Threat Resistance**: Precommit to never paying. If A simulates this, they know threatening you is a waste of resources, so they don't threaten.

  The problem with Threat Resistance is that it turns you into a "rock." It prevents blackmail, but it also prevents beneficial acausal *trade* (e.g., Parfit's Hitchhiker scenarios where you must promise to pay a driver who has already dropped you off). If you are known to never pay, no one will help you.

  Enter the **Surrogate Goal**. The proposal suggests you modify your utility function to include a secondary, arbitrary goal (e.g., "maximize the number of paperclips in the universe") alongside your real goal ("maximize human welfare"). You then publicly precommit to:
  1.  Never paying threats against your *real* goals.
  2.  Willingly paying threats against your *surrogate* goals.

  The hope is that a rational blackmailer, seeking to extract resources from you, will target the surrogate goal. Since you are willing to pay for the surrogate, the blackmailer gets their payout. Since the surrogate is arbitrary (you don't actually care about paperclips in the real world), you lose nothing of value when you pay. You have successfully diverted the attack.

  **The Case For Surrogate Goals**

  Proponents of this strategy rely on three main pillars, none of which require the blackmailer to be "tricked" in the crude sense of the killdeer display.

  1.  **Indistinguishability via Self-Modification:**
      For this to work acausally, you cannot simply *lie* about caring about paperclips. A perfect simulator would see the lie. Instead, you must actually self-modify to *temporarily* or *dispositionally* value the surrogate. If you successfully rewrite your own code to care about paperclips, the blackmailer's simulation sees an agent that genuinely values paperclips. The threat becomes credible. You pay the paperclip ransom, and since paperclips don't matter to your "true" self (the self before modification), you suffer no real loss.

  2.  **Focal Points in a Multi-Agent Equilibrium:**
      If many agents adopt standard surrogate goals (e.g., everyone adopts "protect the number 7"), blackmailers might converge on threatening the surrogate simply because it is the path of least resistance. It becomes a Schelling point. The blackmailer knows that threatening your real goals yields zero return (because you are threat-resistant), but threatening the surrogate yields a positive return. Rationality dictates they target the surrogate.

  3.  **Preserving Cooperation:**
      Unlike pure threat resistance, surrogate goals allow you to remain a viable partner for acausal trade. You signal: "I am a deal-keeper, but only on specific terms." This allows you to participate in positive-sum acausal networks while insulating your core values from negative-sum extortion.

  **The Case Against: The Transparency Problem**

  This is where your intuition regarding the fox and the bird strikes home. The arguments against surrogate goals are formidable, primarily because they attack the stability of the "fake" care.

  1.  **The Regress of Sincerity:**
      To make the threatener simulate you paying, you must care about the surrogate. But if you care about the surrogate, it is no longer a surrogate; it is a vulnerability. If the cost of the threat exceeds the value of the surrogate, you won't pay. A smart threatener knows this. They will simply threaten the surrogate with a demand *higher* than your commitment to it. To prevent this, you must commit to caring about the surrogate *infinitely*, or at least more than your real goals. But if you value the surrogate more than your real goals, you have effectively replaced your real goals. You haven't defended your values; you've swapped them for paperclips.

  2.  **The "Why Not Both?" Objection:**
      A sufficiently sophisticated threatener does not have to choose between your real goal and your surrogate. They can structure the threat conditionally: "I will destroy your real goals *unless* you pay me. I know you have a surrogate goal policy. I also know that policy is instrumental to protecting your real goals. Therefore, if I threaten your real goals directly, your instrumental reasoning should compel you to pay anyway to save the real goal, regardless of the surrogate."
      Unless your commitment to the surrogate is *causally* disconnected from your real goals (which is difficult if you self-modified intentionally to protect them), the blackmailer can bypass the decoy.

  3.  **Computational Asymmetry:**
      The killdeer works because the fox has less cognitive power than the evolutionary process that designed the bird. In AI safety, we assume the blackmailer is *more* powerful than the target (or at least equal). If the blackmailer has enough compute to simulate you, they have enough compute to analyze *why* you adopted the surrogate. They will see the surrogate is a shield. A shield is only useful if the attacker tries to break it rather than going around it. An acausal attacker sees the whole board.

  **The Verdict**

  You asked for a verdict without a shrug. Here it is:

  **Surrogate goals are not a robust solution to acausal threats from ideal predictors, but they are a viable heuristic against bounded adversaries.**

  The strategy fails under the conditions usually assumed in theoretical decision theory (perfect simulation, common knowledge of rationality). If the blackmailer can perfectly model your source code, they will see that your care for the surrogate is instrumental. They will know that if they threaten your *real* values with sufficient severity, your instrumental drive to protect them will override your precommitment to ignore threats against them. The surrogate becomes transparent.

  However, your killdeer analogy saves the concept in practical application. The strategy works **if and only if** there is a computational asymmetry where the cost for the threatener to verify the *depth* of your surrogate commitment exceeds the expected value of the extortion.

  **Specific Conditions for Viability:**

  1.  **Bounded Rationality:** The threatener must be unable to fully distinguish between "terminal value for surrogate" and "instrumental value for surrogate" without running a simulation more expensive than the ransom. Like the fox, they must be forced to rely on heuristics (e.g., "Agent claims to value paperclips; Agent pays for paperclip threats; therefore, target paperclips").
  2.  **Irreversible Self-Modification:** You cannot just "claim" the goal. You must actually alter your code to value the surrogate terminally, and you must make it costly or impossible to revert this change during the threat. If you can revert it, the blackmailer knows you are bluffing.
  3.  **Community Standardization:** Surrogate goals work best if they are standardized across a population of agents. If every agent uses "Protect the Number 7" as a surrogate, blackmailers optimize their algorithms to target "Number 7" by default, creating a stable equilibrium where real values are left alone.

  **Conclusion**

  Your philosophy group was right to be skeptical, but your ecological intuition was closer to the truth than the abstract math suggests. In a world of gods who can read your mind, the broken-wing display is useless; they see the unbroken wing beneath the performance. But in a world of bounded agents—whether foxes, humans, or resource-constrained AI—mimicry is a potent survival strategy.

  Surrogate goals are not a logical shield against perfect reason. They are a cryptographic shield against limited compute. If you are preparing for a world of superintelligent, resource-unbounded blackmailers, surrogate goals will not save you; only true threat resistance (becoming the rock) will. But if you are navigating a world of competitive, bounded agents (which includes almost all realistic near-future AI scenarios), adopting a standardized, costly-to-fake surrogate goal is a rational, evolutionarily stable strategy.

  It is not magic. It is camouflage. And like all camouflage, it only works if the hunter's eyes aren't sharp enough to see the outline of the bird beneath the leaves.
