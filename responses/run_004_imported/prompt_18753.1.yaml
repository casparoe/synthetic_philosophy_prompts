      *   *Key Insight:* Rationality in this context isn't about "maximizing joint welfare." It's about "maximizing *my* welfare given *your* move." The problem is the *end game*. The shadow of the end corrupts the beginning.
      *   *Analogy:* Think of it like a chain letter or a pyramid scheme, but finite. Or a relationship with a known expiration date.
      *   *The "Trust" Component:* Backward induction assumes zero trust. It assumes the other person *cannot* commit to being irrational. If I *could* convince you I'm crazy enough to pass, I'd win. But CKR says I can't convince you of that because you *know* I'm rational.

  3.  **Deconstruct Core Issue 2 (The Paradox of Deviation):**
