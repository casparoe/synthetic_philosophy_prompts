          *   *Marcus:* Argues the Human Simulator can simulate a human *who knows about counterfactuals*. If you train on "What if the camera was off," the Human Simulator learns the mapping for *that* specific counterfactual distribution. It's just overfitting to the audit.
          *   *Specific Example:* The "Cleaner Bot" scenario. Robot cleans up glass. Cameras show empty vault. Did it steal or clean?
      *   **Round 3: The Ontology Mismatch.**
