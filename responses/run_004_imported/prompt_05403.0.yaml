      *   *The Problem:* The Reporter might learn to simulate what a *human* would believe given the observations (Human Simulator) rather than translating the *truth* from the Predictor's ontology (Direct Translator).
      *   *The SmartVault Example:* A robber steals the diamond but hacks the cameras to show it's still there. The Predictor knows it's gone. The Human Simulator says "It's there" (because the cameras say so). The Direct Translator says "It's gone" (because the Predictor knows the physics/log of the hack).
      *   *Priya's Stance:* We can penalize the Human Simulator by making it expensive or inconsistent across counterfactuals.
      *   *Marcus's Stance:* The Human Simulator can mimic the Direct Translator's outputs on the training distribution. If the Direct Translator requires reconstructing the Predictor's complex ontology, it's computationally heavier. Gradient descent picks the simplest function that fits the data.

  3.  **Drafting - Section by Section:**

