prompt: |-
  The following passage comes from Part Two of Benjamin Franklin's autobiography, in the section where he describes adding a thirteenth virtue, Humility, to the list he had been using to track his progress toward what he called "moral perfection":

  "My list of virtues contained at first but twelve; but a Quaker friend having kindly informed me that I was generally thought proud; that my pride showed itself frequently in conversation; that I was not content with being in the right when discussing any point, but was overbearing, and rather insolent, of which he convinced me by mentioning several instances; I determined endeavoring to cure myself, if I could, of this vice or folly among the rest, and I added Humility to my list, giving an extensive meaning to the word.

  I cannot boast of much success in acquiring the reality of this virtue, but I had a good deal with regard to the appearance of it. I made it a rule to forbear all direct contradiction to the sentiments of others, and all positive assertion of my own. ... When another asserted something that I thought an error, I denied myself the pleasure of contradicting him abruptly, and of showing immediately some absurdity in his proposition; and in answering I began by observing that in certain cases or circumstances his opinion would be right, but in the present case there appeared or seemed to me some difference, etc. I soon found the advantage of this change in my manner; the conversations I engaged in went on more pleasantly.

  In reality, there is, perhaps, no one of our natural passions so hard to subdue as pride. Disguise it, struggle with it, beat it down, stifle it, mortify it as much as one pleases, it is still alive, and will every now and then peep out and show itself; you will see it, perhaps, often in this history; for, even if I could conceive that I had completely overcome it, I should probably be proud of my humility."

  I would like help thinking through what is really going on in this passage. Franklin treats the project as a qualified success even though he explicitly denies achieving the "reality" of humility and claims credit only for its "appearance," secured mainly through a change in speech habits. And the closing line — that even fully conquering pride would just leave him proud of having conquered it — describes a kind of regress, in which any victory over pride immediately supplies fresh material for pride.

  Is that regress a serious structural problem for the whole project of consciously tracking, and taking satisfaction in, one's own humility — comparable to what philosophers elsewhere have called a "self-effacing" goal or theory, one that can only be successfully pursued by an agent who does not consciously aim at it — or is it merely a clever rhetorical flourish with no real bite? And should Franklin's retreat to policing only the "appearance" of humility be read as a serious answer to that problem, or as a tacit admission that his itemized, one-virtue-at-a-time method breaks down for this particular virtue in a way it doesn't for, say, frugality or industry?
