prompt: |-
  I'm working on a longread about how courts and treatment programs are starting to talk about repeat offenders with severe substance use disorders—basically whether the "disease model" of addiction should push us toward treating chronic relapse less as something to be blamed for and more as a condition to be managed clinically. Went down a rabbit hole with P.F. Strawson's "Freedom and Resentment" for background and got stuck on his participant vs. objective stance distinction. As I understand it, Strawson thinks reactive attitudes like resentment, indignation, gratitude are basically built into normal interpersonal life, but we suspend them and shift into the "objective attitude" toward people we see as not fit targets for those attitudes—young kids, the severely mentally ill, people acting under hypnosis, etc—where they become someone to be managed, treated, or worked around rather than engaged with as a responsible agent.

  What I can't figure out is what this actually implies for addiction, which doesn't fit neatly into the competent/incompetent binary Strawson seems to be assuming—it's more like a spectrum where the same person cycles in and out of something like diminished agency over time. Can you lay out the most important implications of Strawson's framework for how we ought to treat chronically relapsing addicts—should we be pushing toward a wholesale objective stance, some kind of oscillating or hybrid stance, or is applying his reactive-attitudes machinery to a condition like this just a category error from the start? I'd love it if you could also flag where the view seems to strain or break down, since that's basically the crux of the piece.
