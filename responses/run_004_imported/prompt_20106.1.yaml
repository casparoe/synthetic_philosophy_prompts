      *   **Required Topics:**
          1.  Löbian obstacle (theorem-proving agents, trust, paradox).
          2.  "Trade" vs. "Correlated Decision-Making" (semantics/substance).
          3.  Updateless Decision Theory (UDT) vs. CDT/EDT (commitment binding).
          4.  Coordination/Splitting gains (how to agree on a specific point without communication).
          5.  Acausal Blackmail (evil twin, filtering good vs. bad).
      *   **Format:** For each question, include a "likely dodge" and a "follow-up to close it off."

  2.  **Deconstruct the Topics & Brainstorm Questions:**

      *   *Topic 1: Löbian Obstacle.* This is technical. The core issue is that if Agent A proves Agent B cooperates, A cooperates. But if B does the same, you get infinite regress or inconsistency (Löb's Theorem).
          *   *Idea:* Ask about the specific mechanism that bypasses Löb's Theorem. Is it modal combat? Program equilibrium?
          *   *Dodge:* "We use parametric polymorphism" or "We assume logical correlation."
          *   *Follow-up:* Push on the computational cost or the assumption of source code access.

      *   *Topic 2: Trade vs. Correlation.* Is it actually exchange or just doing the same thing because you think alike?
          *   *Idea:* If I cooperate because I predict you cooperate, where is the *quid pro quo*?
          *   *Dodge:* "It's counterfactual dependence."
          *   *Follow-up:* If the counterfactual is false (I defect), do you still defect? If so, where's the trade?

      *   *Topic 3: UDT vs. CDT/EDT.* CDT says "my action doesn't cause theirs." EDT says "correlation isn't causation." UDT says "choose the policy."
          *   *Idea:* Why is UDT *necessary*? Can't a sophisticated CDT agent pre-commit?
          *   *Dodge:* "Pre-commitment is unstable without UDT."
          *   *Follow-up:* Why is it unstable if the simulation is perfect?

      *   *Topic 4: Coordination/Splitting.* The bargaining problem. Nash Bargaining Solution?
          *   *Idea:* Without communication, how do we avoid the "51/49 vs 49/51" deadlock?
          *   *Dodge:* "Focal points" or "Schelling points."
          *   *Follow-up:* What if our priors on what's 'fair' differ slightly? Does trade collapse?

      *   *Topic 5: Acausal Blackmail.* The Pascal's Mugging variant.
          *   *Idea:* If I cooperate with simulators, won't malicious simulators threaten me?
          *   *Dodge:* "Don't negotiate with terrorists" / "Pre-commit to ignore."
          *   *Follow-up:* How do you distinguish a threat from a promise acausally? They look the same logically.

      *   *Filling the remaining 3-5 questions:* Need to broaden the scope while staying technical.
          *   *Idea 6: Computational Tractability.* Simulating another superintelligence is hard.
          *   *Idea 7: Reference Classes.* Who counts as a trading partner?
          *   *Idea 8: Empirical Evidence/Practicality.* Is this just philosophy or does it affect AI alignment?
          *   *Idea 9: Logical Uncertainty.* How do you assign probabilities to logical facts (like what the other agent outputs)?
          *   *Idea 10: The "Many Worlds" aspect.* Does this imply a specific metaphysics?

  3.  **Drafting the Questions (Iterative Refinement):**

      *   *Refining Q1 (Löb):* Make sure to mention *why* it's a problem (infinite regress of proofs).
      *   *Refining Q2 (Trade):* Focus on the *normative* force. Why call it a deal?
      *   *Refining Q3 (UDT):* Focus on the *timing* of the decision.
      *   *Refining Q4 (Bargaining):* Focus on the *uniqueness* of the solution.
      *   *Refining Q5 (Blackmail):* Focus on the *symmetry* between trade and blackmail.
      *   *Drafting Q6 (Logical Induction):* How do we handle uncertainty about the other agent's code?
      *   *Drafting Q7 (Simulation Cost):* If simulating me costs more than the trade is worth, does it vanish?
      *   *Drafting Q8 (Reference Class):* How do I know *which* version of me you are simulating?
      *   *Drafting Q9 (Timelessness):* Does this require a block universe view?
      *   *Drafting Q10 (Alignment Implications):* If an AI believes this, does it behave dangerously?

  4.  **Adding "Dodges" and "Follow-ups":**
      *   This requires anticipating rationalist jargon. Common dodges: "It's about the algorithm, not the instance," "We assume logical omniscience," "That's an implementation detail."
      *   Follow-ups need to be sharp, forcing a concession or a deeper technical admission.

  5.  **Review against Constraints:**
