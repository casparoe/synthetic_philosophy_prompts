      *   *The Objection:* Why *those* transformations? Why assume the straws are thrown from "far away"? Isn't choosing the group just as arbitrary as choosing the parametrization?

  3.  **Evaluate Jaynes' Argument:**
      *   Jaynes argues that probability is an extension of logic. It requires a well-posed problem.
      *   "Random chord" is ill-posed. "Random chord generated by a process invariant to scale/rotation/translation" is well-posed.
