  I can never decide if this is a genuine problem for any bounded approximation of Solomonoff induction, or just a spooky-sounding thought experiment that dissolves once you actually do the description-length/measure accounting properly. Can you write me a dialogue between two people who actually know this literature hashing it out -- one convinced the argument basically goes through, the other convinced its confused or wildly overstated. I want them engaging with each other's actual moves (complexity costs, speed priors, measure, whatever) instead of both just re-explaining Kolmogorov complexity at each other. Doesn't need to resolve neatly, an honest stalemate seems more true to where the debate actually is anyway.
