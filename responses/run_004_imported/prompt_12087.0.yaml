answer: |-
  Here is an analysis of the four moves, keeping in mind your background in responsibility theory.

  **(1) Priyanka: The Control Principle**
  Priyanka wins this step cleanly. She is articulating the **Control Principle** (the idea that moral assessment should only track factors within the agent's control), which is the default position in deontological ethics and the baseline for the moral luck puzzle. By stipulating that the code, negligence, and foreknowledge are identical, she successfully isolates the *ex ante* culpability. Her claim that treating them differently is an "illusion" is the standard Nagel/Williams starting point. There is no question-begging here; she is defining the terms of moral assessment strictly by agency. Doug has no counter yet, so Priyanka holds the high ground on *culpability*.

  **(2) Doug: The Appeal to Legal Practice**
  Priyanka retains the advantage here, though Doug identifies the tension. Doug commits a version of the **naturalistic fallacy** (or at least an is-ought gap). He argues that because the law *does* distinguish between attempted and completed crimes (descriptive), it tracks something real about *wrongdoing* (normative). This is question-begging against Priyanka's Control Principle; it assumes legal liability maps perfectly onto moral desert, which is precisely what is in dispute. While Doug is right that the law is outcome-sensitive, he hasn't yet shown *why* that sensitivity is morally justified rather than merely pragmatic. Priyanka is right to treat this as an assertion of practice, not a justification of desert.

  **(3) Priyanka: Desert vs. Sanction**
  Priyanka wins this step decisively. She correctly identifies that Doug's legal examples conflate **blameworthiness** (desert) with **liability to sanction** (punishment). Legal realism supports her: outcome sensitivity in law is often justified by deterrence, evidentiary ease (harm proves risk), or expressive function, not necessarily by a difference in the agent's moral state. By separating the *justification for punishment* from the *fact of culpability*, she neutralizes Doug's legal argument without conceding the moral point. Doug has no answer here other than to change the subject, which he does in move (4).

  **(4) Doug: The Relational/Strawsonian Turn**
  Doug wins this step, despite Priyanka's strong rebuttal. Doug shifts the frame from *culpability as a verdict* to *blame as a relationship*. He is gesturing toward the **Strawsonian reactive attitudes**: blame isn't just a cold calculation of internal states; it is a response to the quality of will *as experienced by the victim*. Priyanka's comeback (that anger is just bias) begs the question by assuming an impartial, "god's-eye" view of responsibility is the only valid one. In contemporary responsibility theory (e.g., Wallace, Shoemaker), the victim's standing *does* change the normative landscape. The engineer who caused harm now stands in a different relation to the community (specifically, the victims) than the one who didn't. Priyanka treats the anger as epistemic noise; Doug correctly identifies it as a normative signal of breached relationship. However, Priyanka is right that anger alone isn't *proof*, so Doug wins the insight but leaves the justification incomplete.

  **The Actual Answer**
  The puzzle dissolves if you distinguish between **retrospective blameworthiness** and **prospective accountability**. Priyanka is right that the engineers are equally *blameworthy* regarding the initial negligent act (the Control Principle holds there). However, Doug is right that their normative statuses diverge immediately after the outcome. The engineer whose code leaked data incurs **special obligations** (repair, notification, restitution) that the other does not. These obligations are not punishments for bad luck, but new duties generated by the causal history. We blame the second engineer more intensely not because he is a worse person, but because he is the only one who *owes* anything to the victims. The "moral luck" isn't in the culpability of the past act, but in the current normative position of the agent.
