answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain taps against the window. **Marcus**, a metaphysician with a penchant for process theories, stirs his tea. **Elena**, who works on ethics and the philosophy of law, leans forward in her chair.*

  **Marcus:** You know, I've been thinking about that lifeguard example you brought up earlier. The one where the guard sleeps through the shift and the swimmer drowns. I just can't bring myself to say the guard *caused* the death.

  **Elena:** (Sighs playfully) Here we go. The metaphysical purity test. Marcus, the swimmer is dead. If the guard had thrown the buoy, the swimmer would be alive. How is that not causation?

  **Marcus:** It's counterfactual dependence, Elena. I'll grant you that. *If* the guard had acted, the outcome would differ. But causation? Causation requires a process. A transfer of energy. A physical connection. The water entered the swimmer's lungs. Gravity pulled them down. Those are causes. The guard's inaction? That's nothing. It's an absence. You can't build a causal chain out of thin air.

  **Elena:** But "nothing" killed the swimmer. If we say the guard didn't cause the death, we sever the link between what happened and who is responsible. In law and ethics, we treat that omission as causally significant. We convict people of manslaughter for exactly this kind of negligence. Are you saying the legal system is metaphysically confused?

  **Marcus:** I'm saying the legal system uses "cause" in a pragmatic, explanatory sense, not a fundamental metaphysical sense. Look, if I say "the lack of rain caused the crops to die," I'm speaking loosely. Really, the sun evaporated the moisture, and the soil chemistry changed. The "lack of rain" is just a description of what *didn't* happen. If we treat absences as real causes, we open the door to causal proliferation.

  **Elena:** Causal proliferation. The classic objection. Spell it out.

  **Marcus:** Okay. If the lifeguard's failure to throw the buoy caused the death, then what about the failure of the person sitting in the café across the street? They also didn't throw a buoy. They also didn't jump in. If omissions are causes, then everyone on earth who didn't save that swimmer is a cause of their death. That makes the concept of causation useless. It loses its discriminatory power.

  **Elena:** That's a strong point, I admit. But it assumes all omissions are created equal. They aren't. We filter causes based on norms and expectations. The lifeguard had a duty. The person in the café did not. The lifeguard's omission is a cause *because* it was a violation of a specific expectation that stabilized the situation.

  **Marcus:** But that's smuggling normativity into metaphysics! You're saying what *counts* as a cause depends on social rules or job descriptions. That means causation isn't a feature of the world; it's a feature of our judgments about the world.

  **Elena:** Maybe it is! Or maybe your view of the world is too sparse. You want causation to be just billiard balls hitting each other. But the world is full of systems, dependencies, and vulnerabilities. A hole in a boat causes it to sink. Is the hole a "positive event"? No, it's an absence of hull. But if you patch the hole, the boat floats. The absence is doing the work.

  **Marcus:** The hole is a structural configuration of the metal, though. It's positive matter arranged negatively. But the lifeguard's nap? That's just the guard existing in a state of rest. The *cause* of the death is the water. The guard's inaction is merely the *background condition* that allowed the water to do its work. Distinguishing causes from background conditions is crucial. If you call the omission a cause, you confuse the trigger with the setting.

  **Elena:** But sometimes the omission *is* the trigger. Think of a doctor turning off a life-support machine. Or simply failing to administer insulin to a diabetic patient. The patient dies of hyperglycemia—a positive physical process. But if we say the doctor didn't cause the death, we lose the ability to distinguish murder from natural causes. The physical process is identical in both cases (body shuts down), but the causal story changes entirely based on the omission.

  **Marcus:** I agree we need to distinguish them for *moral* responsibility. I'm not denying the doctor is guilty. I'm denying that the guilt rests on a metaphysical causal relation identical to pushing a pillow over someone's face. In the pillow case, I introduce a new force. In the insulin case, I refrain from interrupting a natural process. It's the difference between *killing* and *letting die*.

  **Elena:** Is it, though? That distinction is notoriously slippery. Suppose the doctor is manually pumping the patient's heart and decides to stop. Is that an omission? Or is the stopping of the hands an action? If causation relies solely on positive events, the metaphysics hinges on how we describe the movement of muscles, not the outcome. That seems fragile.

  **Marcus:** It's not fragile; it's precise. It tracks the flow of physical influence.

  **Elena:** But does it track what matters? If I promise to feed your cat while you're away, and I don't, and the cat starves... the positive cause of death is organ failure. But if I tell the owner, "I didn't cause your cat's death, I just failed to prevent it," they will throw me out of the house. And rightly so! My failure was the relevant factor.

  **Marcus:** (Laughs) They'll throw you out because you're a terrible friend, not because you're a bad metaphysician. Look, Elena, I worry that if we legitimize omissions as causes, we lose the ability to hold people accountable for what they actually *do*. If everything I don't do is a potential cause of everything that happens, then I am causally responsible for every famine I don't donate to, every war I don't stop.

  **Elena:** That's the proliferation argument again. But we don't actually reason that way. We intuitively understand that causation is selective. We select the abnormal, the unexpected, or the duty-bound factor as *the* cause. The sun shining is a cause of the swimmer drying off, but we don't mention it. The lifeguard sleeping is abnormal. That's why we pick it out.

  **Marcus:** So causation is subjective?

  **Elena:** No, it's context-sensitive. Like "tall." A tall jockey is short for a basketball player. Is "tall" subjective? No, it depends on the comparison class. The lifeguard's omission is a cause relative to the context of his duty.

  **Marcus:** I can accept that for *explanation*. I can't accept it for *ontology*. There is a fact of the matter about the physical universe. Either there is a causal link or there isn't. If you make causation dependent on duties and norms, then in a world without humans, the lifeguard's nap wouldn't cause the death. But the swimmer would still drown! The water would still fill the lungs.

  **Elena:** In a world without humans, there are no lifeguards. There are no duties. There is just nature. But we aren't talking about a world without humans. We are trying to make sense of *our* world, where roles and systems exist. If you insist on a "view from nowhere" metaphysics, you end up with a theory that can't explain human agency.

  **Marcus:** But if I accept your view, I can't explain physical continuity. Here's the stake, Elena: If omissions are causes, then causation isn't a transitive physical relation. It's a logical or normative one. That changes how we investigate accidents. If we investigate a plane crash, do we look for the broken bolt (positive cause) or the inspector who missed it (omission)?

  **Elena:** We look for both! Because both are necessary parts of the explanation.

  **Marcus:** But they are different *kinds* of parts. The bolt failing is a mechanism. The inspector missing it is a failure of a mechanism. If we conflate them, we might think we've solved the problem by firing the inspector, when the real issue is the bolt design. By treating the omission as a cause, we might focus too much on agency and not enough on physical process.

  **Elena:** Or, by treating it as *not* a cause, we let negligent systems off the hook. We say, "Well, the brake line burst, that's the cause. The mechanic who forgot to tighten it? He just didn't prevent it." That lets the mechanic off the causal hook, leaving only a moral one. But in negligence law, the causal hook *is* the moral one. *Causa sine qua non*.

  **Marcus:** I suppose my fear is that "causation by omission" becomes a magic wand. It allows us to draw causal lines wherever we want based on who we want to blame.

  **Elena:** And my fear is that your "positive events only" view becomes a shield. It allows people to hide behind the physics of the situation while ignoring their role in the outcome.

  **Marcus:** (Pauses, looking at his tea) So, we're at an impasse. You want a concept of causation that serves responsibility. I want a concept of causation that serves physical description.

  **Elena:** Perhaps we're using the same word for two different relations. You're talking about *production*. I'm talking about *dependence*.

  **Marcus:** That's a plausible synthesis. The water *produced* the death. The lifeguard's inaction created a *dependence* such that the death occurred.

  **Elena:** But in the courtroom, dependence is enough for causation.

  **Marcus:** In the courtroom, maybe. In the ledger of the universe? I'm still skeptical. An absence cannot push.

  **Elena:** No, but an absence can let fall. And sometimes, Marcus, letting fall is just as deadly as pushing.

  **Marcus:** (Smiles) I can agree to that. Even if I insist the push was done by gravity, not the letting.

  **Elena:** I'll take the win. The guard is still guilty.

  **Marcus:** Oh, undoubtedly. Just don't ask me to say his silence made a sound.
