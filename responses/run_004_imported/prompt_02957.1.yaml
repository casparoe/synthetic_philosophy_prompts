      *   *Short Run:* Hume observes history (Price Revolution, influx of silver from Americas). Prices didn't jump instantly. There was a lag. During the lag, people had more cash but prices hadn't risen yet. They felt richer. They spent more. Producers saw higher demand (or higher prices for their specific goods before their costs rose). They produced more.
      *   *The Mechanism:* It's about *distribution* and *expectations*. New money enters at specific points (merchants, manufacturers). They spend it. Prices rise sequentially, not simultaneously. Those who get the money first benefit before prices rise.
      *   *The "Contradiction":* It's not a logical contradiction; it's a distinction between equilibrium states (long run) and the transition process (short run).
      *   *Modern Connection:* Yes, this is exactly the Classical Dichotomy / Monetary Neutrality debate. Short-run non-neutrality vs. Long-run neutrality.

