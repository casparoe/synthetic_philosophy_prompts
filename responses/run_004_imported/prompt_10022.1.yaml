prompt: |-
  I'm part of my high school's philosophy club, and at our last meeting two members got into a back-and-forth about the Doomsday Argument that neither of them was willing to let go of before the meeting ended. I've tried to reconstruct their exchange as accurately as I can below, and I'd like help figuring out who was actually right at each stage, since both of them seemed to be making genuine points rather than just talking past each other.

  (1) Eli opened with the standard argument: if you imagine every human who will ever be born and treat your own position in that sequence as a random draw, then being born as "only" roughly the hundred-billionth human or so (his rough estimate) is far more likely if the total number of humans who will ever live is in the hundreds of billions than if it's in the quadrillions. So, he argued, we should shift our credence toward humanity ending relatively soon.

  (2) Sana objected that the whole thing depends on which reference class you use: are you a random draw from all Homo sapiens, from all beings capable of this kind of reasoning, from all observers period? Since these classes can give wildly different answers and there's no principled way to choose among them, she said the argument's specific conclusion is essentially arbitrary.

  (3) Eli replied that this only costs the argument precision, not its underlying logic: pick almost any reasonable reference class of "beings who could find themselves reasoning like this," and the same qualitative shift toward doom shows up regardless, so Sana's objection shows the argument is fuzzy, not that it's mistaken.

  (4) Sana came back with an idea she'd read about called the self-indication assumption: you also have to weight each hypothesis by how many observers like you it predicts existing in the first place, since a universe with far more humans gives far more "chances" for someone to exist and find themselves in this exact spot -- and that consideration pulls in exactly the opposite direction, canceling Eli's shift. So his whole argument, she concluded, secretly depends on favoring one anthropic principle over a rival one, not on some neutral default.

  Could you go through this move by move, rather than just declaring an overall winner? Please give your verdict as a JSON block of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right), then briefly justify each score, and note anything important that both of them missed.
