  **Move (1) — Marcus: 2**
  Marcus accurately reconstructs the core triad of Kim's exclusion argument: causal closure, the distinctness of mental properties (via multiple realizability), and the rejection of systematic overdetermination. His conclusion—that the mental property is causally screened off—is the valid deductive result of accepting those premises. As a statement of the problem, this is flawless.

  **Move (2) — Zoe: 1**
  Zoe attempts a "token identity" move (akin to Davidson's Anomalous Monism), suggesting the mental and physical are just one event described differently. While this avoids overdetermination locally, it is dialectically weak here because it leaves her vulnerable to the multiple realizability objection. She asserts there is "nothing left to overdetermine" without explaining how distinct *properties* (which she admits are multiply realizable later) fail to compete.

  **Move (3) — Marcus: 2**
  Marcus correctly identifies the fatal tension in Zoe's initial position. He forces the dilemma: if she relies on identity to save causation, she loses multiple realizability (and thus the generality of psychology); if she keeps multiple realizability, the properties are distinct, and the exclusion argument applies. He successfully shows that simple token-identity is insufficient to save mental causation as a general phenomenon.

  **Move (4) — Zoe: 2**
  Zoe pivots to a sophisticated "Subset View" of realization (associated with Shoemaker or Wilson). By arguing that the causal powers of the mental property are a *subset* of the physical realizer's powers, she blocks the exclusion argument without needing strict identity. This dissolves the "competition" Marcus relies on, as the mental cause inherits its efficacy from the physical rather than rivaling it. This is a robust, contemporary solution to Kim's challenge.

  **What's Missing**
  Both are operating entirely within Kim's "nomological sufficiency" framework of causation. They miss the **interventionist turn** (e.g., Woodward), which argues mental and physical variables can both be causes relative to different contrastive questions, rendering exclusion a category error. Additionally, neither distinguishes sufficiently between **metaphysical causation** and **causal explanation**, which would allow belief-talk to remain indispensable even if the metaphysics were settled.
