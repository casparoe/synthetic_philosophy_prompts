      *   The user wants more than "it depends."
      *   *Standard:* **Autonomy and Alignment.**
      *   *Persuasion:* Aligns the person's decision with their *own* deep values and long-term goals (even if it's hard). It expands their agency.
      *   *Manipulation:* Aligns the person's decision with the *influencer's* goals by bypassing or hijacking the person's values (using fear, shame, obligation) to override their agency.
      *   *Test:* If you removed the emotional pressure (Frank story, guilt), would the person still see the logic? Or was the emotion the *engine* of the decision?
