      *   Mechanism: They exchange cryptographic hashes of their decision trees.

  5.  **Drafting - The Conflict:**
      *   The dilemma: Strike or Hold.
      *   Strike/Strike = Annihilation.
      *   Hold/Hold = Peace.
      *   Strike/Hold = Winner takes all.
      *   Standard logic says Strike.
      *   Program Equilibrium logic: "I will Hold if I can verify you are running a 'Hold-if-verified' subroutine."

  6.  **Drafting - The Climax:**
