      *   *First Contact:* Aliens sharing logic structures?
      *   *Selection:* Let's go with high-stakes automated trading or defense systems. It feels cold and precise, fitting the "no emotions" constraint. Let's try two autonomous defense drones or negotiation bots representing hostile factions. Actually, let's make it two rival automated trading algorithms in a high-frequency trading environment facing a "flash crash" scenario where they need to stabilize the market or both lose everything. Or better: Two autonomous warships locked in a firing solution.
      *   *Refined Setting:* Two autonomous security constructs guarding a vault/resource. They are programmed to destroy the other to secure the asset, but if both fire, the asset is destroyed (Mutually Assured Destruction). They need to stand down.
