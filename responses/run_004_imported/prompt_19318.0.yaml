      *   **Core Mechanism:** Two agents show each other their source code/decision procedure before acting. This allows them to verify cooperation is hardcoded/simulated, making it credible in a one-shot dilemma (like Prisoner's Dilemma) where verbal promises fail.
      *   **Constraint:** No "machines learned to love" ending. The cooperation must hinge *specifically* on the mutual transparency/verification, not on emotional growth or trust.
