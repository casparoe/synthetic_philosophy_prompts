  2.  **Deconstruct Program Equilibrium:**
      *   Standard Prisoner's Dilemma: Defect is dominant strategy. Mutual defection is the Nash Equilibrium.
      *   Program Equilibrium (Tennenholtz, 2004): Agents submit programs. Programs can read each other's source code.
      *   Example Strategy: "Cooperate if and only if the other program is identical to me" (or "Cooperate if the other program proves it will cooperate with me").
      *   Key tension: The fear that the other side will simulate your cooperation to exploit you (fake the source code, or find a loophole).
      *   The story needs to show the *verification* process. The climax shouldn't be "they shook hands," it should be "they compiled the code and saw it matched."

  3.  **Brainstorming Settings:**
