prompt: |-
  Random request but here goes — I'm putting together a little collection of short stories that are each built around a specific game theory idea, and I'm stuck on the one for program equilibrium. The concept (if I'm remembering it right) is that if two agents can actually show eachother their source code or decision procedure before choosing what to do, they can lock in cooperation in a one-shot dilemma where a plain promise wouldn't be credible — like a prisoners dilemma where you only get one round, so "trust me" doesn't cut it, but "here, verify for yourself that I literally cannot betray you" does. Can you write me a short story, 1000ish words, that actually dramatizes that mechanism? I don't want the usual "the machines learned to love each other" ending — the cooperation needs to hinge specifically on the mutual transparency, not on growing trust or a change of heart. Setting's up to you, could be AIs negotiating, spies, rival companies, first contact with aliens, whatever fits best.
reasoning: |-
  Thinking Process:

