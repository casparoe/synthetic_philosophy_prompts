answer: |-
  This is a fantastic passage to wrestle with, and your intuition is correct: your groupmate's reading is a common critique of Dewey (that pragmatism collapses into relativism or empty formalism), but it misses the specific work Dewey is doing with his functionalist definition of politics.

  The confusion stems from applying a **substantive** expectation to a **functional** theory. Your groupmate wants a blueprint (substantive); Dewey is offering a diagnostic tool (functional).

  Here is a breakdown of what is happening in that paragraph, specifically regarding the "criterion vs. rule" distinction, the meaning of "rediscovery," and how this ties into his theory of inquiry.

  ### 1. Criterion vs. *A Priori* Rule
  The key to this passage is the distinction between a **standard of evaluation** (criterion) and a **prescription for construction** (rule).

  *   **An *A Priori* Rule** is like a recipe or an architectural blueprint. It says, "To build a good state, you must have X, Y, and Z structures (e.g., a written constitution, a bicameral legislature, separation of powers)." Dewey rejects this because it assumes political problems are static. If you apply a 1789 blueprint to a 1927 industrial society (or a 2024 digital society), you might have the "right" structures but fail to actually manage the *consequences of conjoint action*.
  *   **A Criterion** is like a medical definition of "health." We can agree on a criterion for health (e.g., "the organism's ability to adapt to its environment and maintain homeostasis") without having a single *a priori* rule for how to achieve it. The treatment for a broken leg is different from the treatment for an infection. Both are judged by the same *criterion* (restoring health), but neither follows a universal *rule* of treatment.

  **What work is the "criterion" doing?**
  It prevents the theory from being empty by anchoring it to **consequences**.
  Dewey's criterion is: *Does this state apparatus successfully organize the public to manage the indirect consequences of their actions?*
  *   If a monarchy effectively organizes the public to handle its specific problems, it is, in that context, a "good" state relative to a democracy that fails to do so.
  *   If a democracy exists on paper but the "public" is eclipsed (a major theme in the book) and indirect consequences (like corporate pollution or economic crashes) go unmanaged, it is a "bad" state by Dewey's criterion, regardless of its formal liberties.

  So, the criterion isn't useless; it shifts the metric from **form** (what the government looks like) to **function** (what the government *does* for the public). It allows you to rank states, but only contextually ("State A handles *this* public's problems better than State B"), not universally ("State A is inherently better than State B").

  ### 2. "The State Must Always Be Rediscovered"
  Your question about whether "rediscovered" is just a fancy word for "reform" is crucial. It is a stronger claim than mere reform; it is tied to his ontology of the **Public**.

  Recall Dewey's definition from earlier in Chapter 1: A Public is not a pre-existing group of people. A Public *comes into being* only when indirect consequences of actions become significant enough to require regulation.
  *   **The Problem:** The "consequences of conjoint action" are not static. Technology, economics, and culture change what counts as a "significant indirect consequence."
  *   **The Implication:** Because the *Public* is constantly mutating (new publics form around new issues), the *State* (the machine created to serve the Public) must be re-constituted to match it.

  "Rediscovery" means we cannot rely on the political knowledge of the past to solve the problems of the present. The "Public" of the agrarian 18th century is not the "Public" of the industrial 20th century. Therefore, the State that served the former cannot simply be tweaked to serve the latter; the relationship between the two must be **re-inquired into**.

  This is not relativism (the idea that all states are equally valid). It is **historical contextualism**. It asserts that political truth is tied to the specific problematic situation. To assume we have "solved" the problem of the State is to assume history has stopped producing new consequences of action.

  ### 3. Connection to Experimentalist Inquiry
  This passage is a direct application of Dewey's general theory of inquiry (which he formalizes later in *Logic: The Theory of Inquiry*).

  In Dewey's epistemology:
  1.  **Inquiry begins with an indeterminate situation.** (The Public is confused, consequences are unmanaged.)
  2.  **Inquiry proposes a hypothesis.** (A new policy or institutional structure.)
  3.  **Inquiry tests against consequences.** (Does this organize the public? Does it mitigate the harm?)
  4.  **Knowledge is provisional.** (The settlement is only valid until the situation changes.)

  When Dewey says political knowledge cannot "accumulate into anything settled," he means we cannot accumulate **final answers**. We *do* accumulate **method** and **historical data**. We learn which methods of inquiry work best for organizing publics.

  If your groupmate argues this makes the theory empty, you can counter that it makes the theory **robust against dogma**. A theory that claims to have the "Best State" (like Plato's *Republic* or certain Marxist teleologies) becomes dangerous when history proves it wrong; it forces reality to bend to the theory. Dewey's theory forces the theory to bend to reality.

  ### Summary for Your Group
  To synthesize this for your reading group, you might frame it this way:

  1.  **The Charge:** The groupmate thinks "no best state" = "no way to judge states."
  2.  **The Defense:** Dewey offers a **functional criterion**, not a **structural rule**. We judge a state by its *success in organizing the public*, not by its adherence to an ideal model.
  3.  **The "Rediscovery":** This isn't just policy reform. Because the **Public** itself is fluid (created by changing consequences of action), the **State** must be ontologically re-aligned with it periodically. We can't run a digital society on a political OS designed for an agrarian one.
  4.  **The Inquiry Link:** Politics is not the application of settled moral truths; it is a continuous scientific process of hypothesis and testing. Knowledge accumulates as *intelligence* (the ability to inquire), not as *dogma* (the list of correct laws).

  Dewey isn't dodging the question of "what is good?"; he is insisting that "good" is a verb, not a noun. It is something a state *does*, not something a state *is*.

  **Suggested Discussion Question for the Group:**
  "If Dewey is right that the State must be 'rediscovered' because the Public changes, what are the 'indirect consequences' of our current era (e.g., algorithms, climate change, global supply chains) that our current State structures are failing to organize? Does this mean our current institutions are 'bad' by Dewey's criterion, even if they are democratically elected?"

  This usually gets the pragmatist engine running.
