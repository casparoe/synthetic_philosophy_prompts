prompt: |-
  Ok so I had this two-hour argument with my friend last night about two-dimensional semantics -- whether Chalmers's primary/secondary intension setup actually earns him the zombie argument against physicalism, or if its just Kripke-proof descriptivism wearing a disguise. Never resolved it, but good timing: I'm interviewing a philosopher next week who defends epistemic two-dimensionalism for my podcast, and I don't want the episode to turn into twenty minutes of her re-explaining primary vs secondary intensions to the audience.

  Can you draft me 8-10 questions that push past that? I want at least one on whether "ideal primary conceivability entails primary possibility" is independently defended or just a premise smuggled in to get the zombie conclusion she wants, one on Soames's complaint that the whole framework requires ordinary competent speakers to have a priori access to conditions they obviously don't have, and one on the type-B materialist's "strong necessity" move -- why is a brute, unexplained metaphysical necessity worse than an unexplained epistemic gap she can't independently motivate either? For each of those three, give me her most likely dodge and a follow-up question sharp enough that she can't just retreat into restating the framework.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Two-dimensional semantics (2DS), specifically David Chalmers's epistemic two-dimensionalism and the zombie argument against physicalism.
      *   **Context:** The user had a 2-hour argument with a friend about whether 2DS is just "Kripke-proof descriptivism" or a valid tool for the zombie argument. They are interviewing a philosopher who *defends* epistemic 2DS next week for a podcast.
      *   **Goal:** 8-10 questions that move *beyond* basic explanations of primary vs. secondary intensions.
      *   **Specific Requirements:**
          *   Include a question on "Ideal primary conceivability entails primary possibility" (is it defended or smuggled?).
          *   Include a question on Scott Soames's objection (competent speakers lacking a priori access).
          *   Include a question on Type-B Materialism's "Strong Necessity" move (why is brute metaphysical necessity worse than an unexplained epistemic gap?).
          *   For these three specific questions, provide the guest's "most likely dodge" and a "follow-up question" to prevent retreat.
      *   **Tone:** Philosophical, sharp, podcast-friendly (engaging but rigorous).

  2.  **Deconstruct the Core Philosophical Issues:**
      *   *Epistemic 2DS:* Primary intension (epistemic/conceptual role) vs. Secondary intension (metaphysical/reference fixing). The goal is to link conceivability to possibility.
      *   *The Zombie Argument:* Zombies are primarily conceivable $\rightarrow$ primarily possible $\rightarrow$ secondary possible (given rigid designation) $\rightarrow$ physicalism is false.
      *   *The "Kripke-proof Descriptivism" Charge:* Critics argue 2DS tries to save descriptivism from Kripke's *Naming and Necessity* by bifurcating meaning, but it might beg the question against physicalism.
      *   *Ideal Conceivability:* It's not just "I can imagine it," it's "ideal rational reflection." Critics say this is an unreachable ideal used to shield the argument from counterexamples.
      *   *Soames's Objection:* 2DS implies speakers know the reference-fixing conditions a priori. But empirical investigation is often needed to know what water *is*.
      *   *Type-B Materialism:* Accepts the epistemic gap (zombies are conceivable) but denies the ontological gap (zombies are not possible). They posit "strong necessity" (a posteriori necessities that aren't derivable from primary intensions). Chalmers argues this is ad hoc.

  3.  **Drafting the Questions (Iterative Process):**

