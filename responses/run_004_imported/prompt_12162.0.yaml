          *   Dodge: "It's an idealization, not psychological."
          *   Follow-up: "If it's not psychologically real, what work is it doing in an argument about *our* concept of consciousness?"

      *   *Question 3 (Specific Requirement: Type-B/Strong Necessity):*
          *   Draft: Why is strong necessity worse than an epistemic gap?
          *   Refinement: Frame it as a clash of brute facts.
          *   Dodge: "Strong necessity violates the modal rationalist link."
          *   Follow-up: "Isn't positing a unique exception for consciousness just as brute as the Type-B necessity?"

      *   *Question 4 (The "Kripke-proof Descriptivism" Charge):*
