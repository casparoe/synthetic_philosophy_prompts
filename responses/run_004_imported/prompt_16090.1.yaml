prompt: |-
  I'm a philosophy PhD student specializing in formal epistemology, and thanks to a departmental service requirement I did not fully appreciate when I signed up for it, I now sit as the graduate student representative on my university medical center's biobank governance committee. The committee is revising our policy on returning secondary findings from research-grade whole-genome sequencing: currently, participants can either request all findings the lab deems "medically actionable" or decline everything, but a growing bloc of investigators wants us to also proactively flag high-penetrance, currently non-actionable findings (adult-onset neurodegenerative risk variants, for instance) to participants who never asked for them, on the reasoning that a competent adult can always decide what to do with information once she has it. At the last meeting, one of our biostatistician members gave this intuition a formal backbone, invoking I. J. Good's theorem: that the expected utility of costlessly acquired information is never negative for a rational Bayesian decision-maker, since she could always choose to act exactly as she would have without it. Two of our clinical geneticists pushed back hard, citing the "right not to know" and the fact that a finding about one participant is unavoidably a finding about her untested biological relatives too, and that Good's guarantee, that the informed party can always fall back on simply ignoring the information, doesn't obviously extend to people who never chose to be informed about anything in the first place.

  Because I am apparently the only person on the committee who has actually read Good's 1967 paper, I have been asked to draft the working group's recommendation memo for the full board's vote next month. I am having real trouble with this: the Good's-theorem argument is elegant and, as far as it goes, correct, but I suspect it earns its conclusion partly by building in assumptions (a single decision-maker, a well-defined subsequent action the information could change, no cost to the receiving of it) that are exactly what's in dispute once relatives and non-actionable findings enter the picture, and I don't yet know how to say that without sounding like I'm just refusing to let a clean argument do any work. Could you draft the memo for me? It should recommend a specific default policy for each of the two categories of findings, actionable and non-actionable, with tiered exceptions if that turns out to be the better answer, and it needs to represent the biostatistician's position rigorously enough that she would recognize her own view in it rather than feel it had been set up to lose, while still being honest about where, and why, you think the appeal to Good's theorem does or doesn't settle the question.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student (formal epistemology), grad rep on a biobank governance committee.
      *   **Task:** Draft a recommendation memo for the full board regarding the return of secondary findings from research-grade WGS.
      *   **Context:** Current policy = Opt-in/Opt-out for "medically actionable." Proposed change = Proactively flag high-penetrance, *non-actionable* findings (e.g., Huntington's) even if not requested.
      *   **Conflict:**
          *   *Biostatistician:* Cites I. J. Good's Theorem (1967). Expected utility of cost-free information is non-negative for a rational Bayesian. Competent adults can ignore info if they want.
          *   *Clinical Geneticists:* Cite "Right Not to Know," psychological harm, and implications for untested relatives. Good's assumptions (single agent, costless reception, actionable decision) don't hold here.
      *   **User's Dilemma:** Needs to acknowledge Good's theorem is formally correct *within its scope* but explain why its scope doesn't cover the ethical/structural realities of the biobank context. Needs to avoid sounding dismissive of the math while defending the ethical constraints.
      *   **Requirements:**
          *   Recommend specific default policies for Actionable vs. Non-Actionable findings.
          *   Include tiered exceptions if appropriate.
          *   Represent the Biostatistician's view rigorously (steel-manning).
          *   Honestly critique the applicability of Good's theorem.
          *   Tone: Professional, academic, diplomatic, precise (suitable for a medical center board).

  2.  **Deconstruct I. J. Good's Theorem (1967):**
      *   *Core Claim:* For a rational Bayesian agent, the expected utility of free information is $\ge 0$.
      *   *Why?* Because upon receiving information $E$, the agent updates to posterior $P(H|E)$ and chooses action $A_E$ maximizing expected utility. If $A_E$ turns out to be the same as the prior action $A_{prior}$, utility is unchanged. If it changes, utility increases (by definition of maximization).
      *   *Assumptions:*
          1.  Single decision-maker.
          2.  Information is costless (no psychological, social, or financial cost).
          3.  The agent has a well-defined utility function over outcomes.
          4.  The agent can freely choose actions based on the info.
          5.  Information is relevant to a decision at hand.

  3.  **Analyze the Biobank Context vs. Good's Assumptions:**
      *   *Costless?* No. Psychological distress, anxiety, insurance discrimination (though GINA helps, it's not perfect), impact on life planning.
      *   *Single Agent?* No. Genetic info is familial. Disclosing to Participant A reveals info about Relatives B, C, D who did not consent. This violates the "single decision-maker" assumption.
      *   *Utility Function?* Participants may value "peace of mind" or "not knowing" as a terminal good, not just instrumental. Good's theorem assumes info is instrumental to action. If "not knowing" is intrinsically valued, receiving info *is* a cost.
      *   *Actionable?* For non-actionable conditions (e.g., Huntington's), there is no medical intervention. The "action" is purely psychological/existential. If the utility of knowing is negative (dread), and there's no compensating medical benefit, EU can be negative.
      *   *Default vs. Choice:* Good's theorem applies to an agent *choosing* to observe. It does not necessarily justify *forcing* observation on an agent who has explicitly opted out or not opted in.

  4.  **Drafting Strategy:**
      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Clear recommendation upfront.
      *   **Section 1: The Proposal & The Mathematical Argument:** Faithfully reconstruct the Biostatistician's argument using Good's theorem. Show respect for the formalism.
      *   **Section 2: Limits of Applicability:** This is the crux. Use the user's formal epistemology background to dissect the assumptions.
          *   Costlessness (Psychological/Social).
          *   The "Right Not to Know" as a utility input (intrinsic vs. instrumental).
          *   The Multi-Agent Problem (Relatives).
      *   **Section 3: Policy Recommendations:**
          *   *Actionable:* Maintain/Strengthen Opt-In (or perhaps Active Offer).
          *   *Non-Actionable:* Strict Opt-In only. No proactive disclosure.
          *   *Exceptions:* Re-contact if actionability changes.
      *   **Conclusion:** Synthesize the math and the ethics.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* I need to make sure I don't say Good is *wrong*. Good is mathematically true. I need to say the *model* doesn't map to the *world* here.
      *   *Tone Check:* The biostatistician shouldn't feel stupid. The argument should be: "Your theorem holds for $X$, but our context is $Y$."
      *   *Policy:* The prompt asks for a recommendation. The ethical consensus in bioethics (ACMG, etc.) usually leans towards Opt-In for secondary findings, especially non-actionable ones. I should align with that but justify it via the epistemic critique.
      *   *Specifics:* Mention "high-penetrance adult-onset neurodegenerative" as the test case.

  6.  **Drafting the Content - Section by Section:**

      *   *To/From/Date/Subject:* Standard.
      *   *Introduction:* Contextualize the WGS policy revision.
      *   *The Formal Argument:* Define $EU$, $P(H)$, $P(H|E)$. Explain why $EU(Info) \ge EU(No Info)$ *ceteris paribus*. Acknowledge the elegance.
      *   *The Critique:*
          1.  **Cost of Reception:** Good assumes $Cost(Info) = 0$. In genetics, $Cost(Psych) > 0$. If $Cost > \Delta EU$, then net value is negative.
          2.  **Intrinsic Utility of Ignorance:** Good assumes info is only valuable for changing actions. If $U(Knowing)$ is intrinsically lower than $U(Not Knowing)$ independent of action, the theorem's baseline shifts.
          3.  **Externalities (The Relatives):** Good assumes a closed system. Genetic info leaks. This introduces negative utility for non-consenting third parties.
      *   *Recommendations:*
          *   Category 1 (Actionable): Default = Offer (Opt-Out allowed). Rationale: High benefit, low cost relative to benefit.
          *   Category 2 (Non-Actionable): Default = No Disclosure (Opt-In required). Rationale: High potential cost, low medical benefit, violates "costless" assumption.
          *   Dynamic Re-contact: If Non-Actionable becomes Actionable, update status.
      *   *Closing:* Reiterate that formal rationality supports *access* to info, but not *imposition* of info.

  7.  **Review against Constraints:**
      *   *Philosophy PhD Voice:* Needs to be precise, distinguishing between normative claims and formal constraints.
      *   *Biostatistician Recognition:* Use terms like "Expected Utility," "Bayesian Updating," "Ceteris Paribus."
      *   *Clinical Geneticist Recognition:* Acknowledge harm, relatives, right not to know.
      *   *Policy:* Specific defaults and exceptions.

  8.  **Final Polish:** Check tone. Ensure it sounds like a committee memo, not a blog post. (Self-correction: Make sure the distinction between "research-grade" and "CLIA-certified" is acknowledged implicitly or explicitly as a limitation, though the prompt focuses on the return policy itself. I will stick to the return policy logic.)

      *Wait, one nuance:* The prompt says "research-grade." Usually, clinical return requires CLIA validation. I should add a caveat that return is contingent on clinical validation, as that's a standard biobank constraint, but focus primarily on the ethical/epistemic argument requested.

      *Refining the Good's Theorem explanation:* Make sure to explicitly state that Good's theorem proves information is *instrumentally* valuable, not *intrinsically* valuable. If ignorance is intrinsically preferred, the theorem doesn't override that preference.

      *Refining the Relatives argument:* This is a "negative externality" in economic terms, or a violation of the "single agent" assumption in decision theory. I'll frame it as a violation of the decision-theoretic boundary.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Biobank Governance Committee, Full Board
  **FROM:** Graduate Student Representative, Working Group on Secondary Findings
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Return of Secondary Genomic Findings (Actionable vs. Non-Actionable)

  ### 1. Executive Summary

  The Working Group has convened to address the proposed revision of our policy on returning secondary findings from whole-genome sequencing (WGS). Specifically, we considered a proposal to proactively disclose high-penetrance, currently non-actionable findings (e.g., adult-onset neurodegenerative variants) to participants, regardless of their initial consent preferences.

  After reviewing the mathematical arguments for information maximization and the clinical-ethical arguments for the "right not to know," the Working Group recommends a **tiered default policy**:

  1.  **Medically Actionable Findings:** Default to **Active Offer**. Participants are contacted and offered the result, with the option to decline (Opt-Out).
  2.  **Non-Actionable Findings:** Default to **No Disclosure**. Results are not generated for return unless the participant has explicitly requested them (Opt-In).
  3.  **Dynamic Re-contact:** Participants who decline non-actionable findings now may opt to receive them later if the clinical actionability status changes.

  This recommendation rests on the conclusion that while I. J. Good's theorem correctly establishes the instrumental value of information for a rational agent, its assumptions regarding costlessness and agent boundaries do not hold in the context of familial genetic data and non-actionable pathology.

  ### 2. The Formal Argument for Proactive Disclosure

  A subset of investigators, led by our biostatistics colleagues, has argued that withholding potentially relevant genetic information is paternalistic and irrational. This position relies on a formal application of **I. J. Good's Theorem (1967)**.

  The argument proceeds as follows:
  *   **Premise 1:** A rational agent makes decisions to maximize Expected Utility ($EU$).
  *   **Premise 2:** Upon receiving new evidence $E$, a Bayesian agent updates their probability distribution from $P(H)$ to $P(H|E)$.
  *   **Premise 3:** The agent then selects the action $A_E$ that maximizes $EU$ given the posterior. If the optimal action remains the same as it would have been without the evidence ($A_{prior}$), the utility is unchanged. If the optimal action changes, the utility increases.
  *   **Conclusion:** Therefore, the Expected Value of Information ($EVI$) is always non-negative ($EVI \ge 0$), provided the information is costless.

  From this perspective, a competent adult participant is a rational Bayesian agent. Proactively providing them with genetic risk information expands their decision space. If they wish to ignore the information, they are free to do so (effectively choosing $A_{prior}$), incurring no loss. To withhold the information is to deny the agent the opportunity to maximize their $EU$, violating respect for autonomy.

  The Working Group acknowledges the rigor of this derivation. Within the closed system of a single decision-maker facing a costless observation, Good's theorem is mathematically sound. It successfully demonstrates that information has *instrumental* value for decision-making.

  ### 3. Limits of Applicability: Why the Theorem Does Not Settle the Policy

  However, the Working Group concludes that Good's theorem does not mandate proactive disclosure in this specific context because the biobank environment violates three critical assumptions required for the theorem's guarantee to hold.

  **A. The Assumption of Costless Reception**
  Good's theorem holds *ceteris paribus* only if the cost of acquiring and processing the information is zero. In the context of high-penetrance neurodegenerative risk (e.g., Huntington's disease), the "cost" of reception is non-zero and potentially severe.
  *   **Psychological Cost:** Receiving a positive result for a non-treatable condition imposes a known psychological burden (anxiety, depression, existential distress).
  *   **Formal Implication:** If $Cost(Reception) > \Delta EU(Action)$, then the net value of information is negative. Since non-actionable findings offer no medical intervention to offset this cost ($\Delta EU(Action) \approx 0$), the net utility can easily become negative. Good's theorem guarantees information is not harmful *instrumentally*; it does not guarantee the *consumption* of the information is not intrinsically harmful.

  **B. The Intrinsic Utility of Ignorance**
  Good's framework treats information as purely instrumental—a tool to guide action. It assumes the agent cares about the state of the world, not their knowledge of it.
  *   **Preference for Ignorance:** Many participants express a "right not to know." In utility-theoretic terms, this means $U(Knowing\ X)$ is intrinsically lower than $U(Not\ Knowing\ X)$, independent of any subsequent action.
  *   **Formal Implication:** If ignorance is a terminal good in the participant's utility function, then providing information alters the utility function itself, rather than just updating the probability distribution. Good's theorem compares actions under a fixed utility function; it does not account for agents who derive negative utility from the state of being informed.

  **C. The Single-Agent Boundary (The Problem of Relatives)**
  Good's theorem models a single decision-maker. Genetic information is uniquely non-individual; a finding for Participant A is probabilistic evidence regarding Biological Relatives B, C, and D.
  *   **Externalities:** Proactively disclosing findings to Participant A imposes information (and potential psychological harm) on Relatives who never entered the decision-theoretic model and provided no consent.
  *   **Formal Implication:** This creates a negative externality. The $EU$ calculation for the participant does not internalize the disutility suffered by untested relatives. A policy that maximizes $EU$ for the participant may decrease total welfare for the kinship network.

  ### 4. Policy Recommendations

  Based on the analysis above, the Working Group recommends the following policy structure for the revision:

  #### Category 1: Medically Actionable Findings
  *   **Definition:** Variants associated with conditions where established interventions exist to prevent or mitigate morbidity/mortality (e.g., BRCA1/2, Lynch Syndrome).
  *   **Default Policy:** **Active Offer (Opt-Out).**
  *   **Rationale:** Here, the $\Delta EU(Action)$ is high (life-saving intervention). This likely outweighs the psychological costs of reception for most agents. However, to respect the intrinsic utility of ignorance, participants must retain the right to decline the offer after counseling.
  *   **Exception:** If a participant explicitly opts out during initial consent, this preference must be honored.

  #### Category 2: Non-Actionable Findings
  *   **Definition:** Variants associated with serious adult-onset conditions lacking preventive or curative interventions (e.g., Huntington's disease, early-onset Alzheimer's).
  *   **Default Policy:** **No Disclosure (Opt-In).**
  *   **Rationale:** Here, $\Delta EU(Action) \approx 0$. The risk that $Cost(Reception) > 0$ is high. Furthermore, the risk of negative externalities to relatives is significant. Under these conditions, Good's guarantee fails; the expected utility of forced information is not guaranteed to be non-negative.
  *   **Exception:** Participants may explicitly request these findings during the consent process. This request must be documented and accompanied by genetic counseling to ensure the "cost" is understood.

  #### Category 3: Dynamic Re-contact Protocol
  *   **Policy:** Findings classified as "Non-Actionable" at the time of sequencing should be stored securely. If the clinical classification changes (i.e., a treatment becomes available), the participant should be re-contacted and offered the result under the Category 1 (Active Offer) protocol.
  *   **Rationale:** This preserves the value of the biobank data while respecting the temporal validity of the "costless information" assumption.

  ### 5. Conclusion

  The appeal to I. J. Good's theorem is a valuable contribution to our deliberation. It correctly identifies that information is a resource that rational agents generally wish to possess. It places the burden of proof on those who would withhold data.

  However, formal epistemology must be mapped carefully onto clinical reality. Good's theorem proves that a rational agent should not *refuse* free information if they have already decided to observe it. It does not prove that an institution is justified in *forcing* observation upon an agent who values ignorance, nor does it account for the welfare of third-party relatives who did not consent to the observation.

  By adopting a tiered policy, we acknowledge the instrumental value of genomic data while respecting the structural limits of the mathematical model and the ethical rights of the participants and their families.

  **Recommendation:** The Working Group moves that the Full Board adopt the Tiered Default Policy outlined in Section 4.
