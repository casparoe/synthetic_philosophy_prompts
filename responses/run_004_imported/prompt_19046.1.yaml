answer: |-
  **Setting:** *A graduate seminar room, late afternoon. The chalkboard is covered in diagrams of planetary orbits. Two philosophers, ARIS (a strict falsificationist) and LENA (a defender of Lakatos), are packing up their notes while a few lingering students listen in.*

  **ARIS:** You see, that is precisely where the history seduces you into bad philosophy. Look at the board. In 1846, Le Verrier notices Uranus is misbehaving. Newton's laws say it should be *there*; it is *here*. The falsification is staring him in the face. What does he do? He doesn't abandon Newton. He posits an invisible planet. He finds Neptune. Everyone cheers. Science triumphs.

  **LENA:** Because the research programme was progressive.

  **ARIS:** Because he got lucky! Thirteen years later, 1859, Mercury misbehaves. Same math. Same logic. Le Verrier posits *another* invisible planet, Vulcan. He calculates the orbit. He sends astronomers looking. Nothing. For fifty years, they tweak the parameters of Vulcan. They change its mass, its opacity, its orbital inclination. It is structurally identical to the Neptune move. If you call Neptune "science," you must call Vulcan "science" at the moment of proposal. But Vulcan was a wild goose chase. It was ad hocery in the pejorative sense. If your demarcation criterion cannot distinguish between Neptune and Vulcan *at the time of the hypothesis*, it isn't a criterion. It's a horoscope.

  **LENA:** You're conflating the logical form of the auxiliary hypothesis with the methodological context of the research programme. That's the naive falsificationist trap. You look at the proposition "There exists a planet X" and say, "Same proposition." But Lakatos teaches us to look at the *problem shift*.

  **ARIS:** A problem shift is a narrative you tell after the fact.

  **LENA:** It is not. It is about excess empirical content. When Le Verrier proposed Neptune, the auxiliary hypothesis did more than save the phenomena of Uranus. It predicted a *novel fact*: the precise position of a body never before observed. It was independently testable. The hypothesis was risky. When he proposed Vulcan, initially, it looked similar. But watch what happens to the protective belt. With Neptune, the auxiliary hypothesis was tight. With Vulcan, as the searches failed, the hypothesis became flexible. "It's too close to the sun." "It's a swarm of asteroids." "It's a dark cloud."

  **ARIS:** But when does it cross the line? That's my point. In 1860, Vulcan looks just like Neptune did in 1846. If I am a scientist in 1860, and I use your MSRP—your Methodology of Scientific Research Programmes—to decide whether to fund the expedition to find Vulcan, what do you tell me? "Go ahead, it might be progressive"?

  **LENA:** I tell you to look at the heuristic power. Is the new hypothesis generating *other* testable content, or is it merely absorbing the anomaly? The Neptune hypothesis was derived from perturbation theory that was already well-corroborated. It constrained the search space significantly.

  **ARIS:** And Vulcan didn't?

  **LENA:** Not for long. As soon as the initial search failed, the Newtonians began modifying the auxiliary assumptions *without* generating new successful predictions. That is the definition of a degenerating problem shift. They were adjusting the protective belt to accommodate refutations, not to predict novelties.

  **ARIS:** But you only know they failed to predict novelties because they *failed*. You are defining "progressive" as "successful."

  **LENA:** No. Progressive means *theoretically* progressive (yielding new insights) and *empirically* progressive (some of those insights are corroborated).

  **ARIS:** There it is. "Corroborated." That requires time. In 1860, Vulcan is empirically progressive *potentially*. In 1915, it is degenerating. Your methodology requires a time lag. It requires the verdict of history. So, it cannot guide the scientist in the moment of crisis. It tells the historian why Einstein was rational to replace Newton, but it doesn't tell Le Verrier when to stop looking for Vulcan and start questioning gravity. If a methodology of science cannot guide scientific action, what use is it? It's just a taxonomy of corpses.

  **LENA:** That is the "instant rationality" objection, Aris. And it assumes that science operates on binary switch-flips. "Falsified: Stop." "Verified: Go." But science is a long-term game. Lakatos never claimed MSRP was a decision procedure for the immediate moment. He claimed it was a court of appeal for rational reconstruction.

  **ARIS:** A court of appeal that convenes fifty years after the trial.

  **LENA:** No, because the distinction isn't purely retrospective. You asked what a scientist in 1860 should do. The MSRP answer is: Continue the programme *as long as* it remains progressive. But "progressive" isn't just about finding the planet. It's about whether the modifications to the theory are increasing empirical content.

  **ARIS:** How do they know if the content is increasing if they haven't tested it?

  **LENA:** Because the *structure* of the hypothesis matters. A progressive shift usually involves a unified explanation that connects disparate phenomena. When Le Verrier proposed Neptune, the perturbation math unified the anomalies of Uranus with a specific location in the sky. When the Vulcan hunters started claiming the planet was invisible, or a ring of dust, or only visible during eclipses, they were fragmenting the explanation. They were losing coherence. A scientist *can* detect that the heuristic is drying up. They can see that every new adjustment makes the theory more complex without opening new doors.

  **ARIS:** That's subjective. "Losing coherence" is in the eye of the beholder. A strict falsificationist says: The anomaly falsifies the system. You can save it, but you must acknowledge you are engaging in a conventionalist stratagem. You are choosing to keep the core by fiat. Be honest about it. Call it metaphysics, not science.

  **LENA:** And if you do that, you kill the goose that laid the golden egg. If Copernicus had followed your rule, he would have abandoned heliocentrism when the stellar parallax wasn't observed. If Bohr had followed your rule, he would have abandoned quantum postulates when they violated classical electrodynamics. You demand a clean verdict where none exists.

  **ARIS:** I demand honesty. I demand that we recognize when a theory is being insulated from refutation.

  **LENA:** I demand we recognize when that insulation is buying us time to discover deeper truths. The difference between Neptune and Vulcan isn't just that one was found and one wasn't. It's that Neptune *extended* the Newtonian programme's power to predict, while Vulcan eventually *consumed* resources without return.

  **ARIS:** But again—the time lag. You say "without return." When do we declare the return impossible? Einstein showed us the return was impossible because the *core* was wrong. But the Newtonians didn't know that. They acted rationally, by your lights, searching for Vulcan for decades. Was that rational?

  **LENA:** Yes. It was rational to exhaust the heuristic potential of a hard core before abandoning it.

  **ARIS:** So rationality includes wasting fifty years on a ghost planet?

  **LENA:** It includes ensuring the anomaly isn't a discoverable object before overturning a framework that explains everything else. But here is my answer to your hindsight worry: The demarcation is not between "Neptune-hypothesis" and "Vulcan-hypothesis" as static objects. It is between a *trajectory* of theory-change. A scientist *can* assess the trajectory. Are we predicting new things, or are we just patching holes?

  **ARIS:** And if the patch leads to a new discovery?

  **LENA:** Then it wasn't a patch; it was a progression.

  **ARIS:** Circular.

  **LENA:** No. Holistic. You cannot isolate a single hypothesis from the history of its modifications. Look, Aris, your falsificationism works beautifully for logic puzzles. It fails for the history of knowledge. You want a razor that cuts cleanly. But the growth of science is messy. It involves sticking with a theory through anomalies. The question isn't "Is this hypothesis falsifiable?" It's "Is this research programme growing?"

  **ARIS:** And who judges the growth?

  **LENA:** The scientific community, over time.

  **ARIS:** So demarcation is sociological.

  **LENA:** No, it's methodological, but it requires a temporal dimension. You want a snapshot; I'm giving you a film.

  **ARIS:** But the scientist lives in the snapshot. When Le Verrier sat at his desk in 1859, he didn't have the film. He had a snapshot of Mercury's orbit and a law of gravity. He made a choice. If your philosophy tells him, "You'll know if you were rational in 50 years," then your philosophy has nothing to say to Le Verrier. It only has things to say to his biographer.

  **LENA:** It says to Le Verrier: "Make your auxiliary hypothesis as precise and risky as the Neptune one. Do not make it flexible. If you must posit Vulcan, tell us exactly where to look and what mass it must have. Do not retreat into 'it's hard to see.'"

  **ARIS:** And if he does that, and looks, and finds nothing?

  **LENA:** Then the programme begins to degenerate. Then he must decide: do I modify the core, or do I add another belt? If he modifies the core—say, changes the inverse square law—he might start a new programme.

  **ARIS:** But he didn't. Einstein did. And Einstein wasn't working on Mercury's perihelion primarily; he was working on the equivalence principle. The solution didn't come from within the Newtonian programme's protective belt. It came from outside. Your MSRP suggests rational scientists stay within the programme until it degenerates. But the breakthrough came from ignoring the programme entirely.

  **LENA:** Because the Newtonian programme *had* degenerated regarding gravitation, even if it held elsewhere. The Vulcan episode was the signal.

  **ARIS:** A signal only visible in retrospect.

  **LENA:** A signal visible in the *proliferation of ad hoc assumptions*. That is visible in the moment. If you have to invent a new property for every failed observation, you are in a degenerating shift. You don't need hindsight to see that you are running out of ideas. You just need to look at your notebook.

  **ARIS:** And yet, they kept looking.

  **LENA:** Because the hard core of Newtonian mechanics was so successful elsewhere. That is the rationality of tenacity.

  **ARIS:** And the irrationality of dogmatism. The line is thin.

  **LENA:** Precisely. Which is why we need a methodology that accounts for the thickness of the line, not one that pretends it's a laser beam.

  **ARIS:** *(Smiling slightly)* You've conceded that the line is blurry.

  **LENA:** I've conceded that it's dynamic. You want a static boundary. I'm offering a vector.

  **ARIS:** Then we agree on one thing: Le Verrier was a brilliant mathematician.

  **LENA:** And a perfect case study for why logic alone cannot dictate the growth of science.

  **ARIS:** Or why history alone cannot dictate the logic of science. Coffee?

  **LENA:** Coffee. But I'm paying. Consider it a progressive shift in our own research programme.

  **ARIS:** Don't push it.
