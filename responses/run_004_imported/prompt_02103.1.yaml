      *   **Scanlon's Principle F:**
          *   Context: *What We Owe to Each Other*.
          *   Mechanism: If I intentionally lead you to expect I will do X, and I know you want assurance, and I do this to give you that assurance, then I must do X unless you consent otherwise.
          *   Goal: Ground the obligation in the wrong of *manipulation* or *betrayal of trust*, not in a magical act of will.
      *   **The Circularity/Bootstrapping Objection (Kolodny/Wallace):**
