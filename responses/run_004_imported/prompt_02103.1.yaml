answer: |-
  You have put your finger on the exact nerve of the contemporary debate on promising. Your intuition is spot-on: while Scanlon's Principle F is designed specifically to exorcise Hume's ghost, a significant line of criticism (spearheaded by Niko Kolodny and R. Jay Wallace, among others) argues that Scanlon doesn't actually kill the ghost; he just changes its costume.

  Here is the walkthrough of why Hume's bootstrapping objection haunts Scanlon, how Principle F tries to dodge it, and why the Kolodny/Wallace critique suggests it's a relocation rather than an escape.

  ### 1. Hume's Bootstrapping Objection (The Setup)
  To see where Scanlon is vulnerable, we have to be precise about Hume's worry. Hume argues that an act of will cannot create an obligation *ex nihilo*.
  *   **The Magic Trick:** If I say "I promise," and that sentence alone creates a duty, it implies my will has a magical normative power.
  *   **The Circularity:** To intend to bind myself, I must believe I *can* bind myself. But I can only bind myself if the practice of promising already exists and has force. Therefore, the individual act of promising presupposes the very obligation it is supposed to create.
  *   **Hume's Solution:** Promising is an **artificial virtue**. It requires a pre-existing social convention. The obligation doesn't come from my will; it comes from the social utility of maintaining the convention.

  ### 2. Scanlon's Principle F (The Attempted Escape)
  Scanlon wants to save promising from being merely a social convention (which feels too contingent) without resorting to magical will-power. He grounds it in the morality of **interpersonal assurance**.

  **Principle F (roughly):** If:
  1.  A intentionally leads B to expect A will do X (unless B consents otherwise),
  2.  A knows B wants this assurance,
  3.  A acts for the purpose of providing this assurance,
  Then A must do X unless B consents otherwise.

  **The Escape Plan:** Scanlon argues this isn't magic. It's just a specific instance of the general wrong of **manipulation** or **betrayal**. If I invite you to rely on me, and I do so intentionally to secure your reliance, I have manipulated your expectations. Breaking the promise is wrong for the same reason lying is wrong: it abuses the trust I solicited. No "normative power" required, just the general duty not to harm/manipulate others.

  ### 3. The Kolodny/Wallace Critique (The Relocation)
  This is where your worry about circularity comes roaring back. Kolodny (in *The Ethics of Influence*) and Wallace (in *Normativity and the Will*) argue that Principle F suffers from a **reflexivity problem**.

  For Principle F to generate an obligation, Condition (1) must be met: The promisee (B) must actually form the expectation that A will do X.

  **The Problem of Rational Expectation:**
  *   Why does B expect A to do X?
  *   If B is rational, B won't expect A to do X just because A made noises with their mouth. B expects A to do X because B believes A has **obligated themselves**.
  *   But according to Scanlon, the obligation *only arises* once the expectation is formed.
  *   So, B cannot rationally form the expectation until the obligation exists. But the obligation cannot exist until B forms the expectation.

  **Kolodny's Point:** You cannot bootstrap an obligation out of an expectation if the expectation itself is only rational *given* the obligation.
  *   **Hume's Version:** "I can't will an obligation into existence."
  *   **Scanlon's Version:** "I can't induce a rational expectation of performance without presupposing an obligation to perform."

  Wallace adds that Scanlon reduces promising to a species of **deception or manipulation**. But promising feels distinct from saying "I predict I will do X." When I promise, I am not just predicting; I am undertaking a commitment. If Scanlon says the commitment is just "I made you expect it," he misses the normative force of the *undertaking*. If the promisee trusts me *because* I promised, they are trusting that I acknowledge a special obligation. If I (the promisor) don't acknowledge that special obligation exists (because I'm a Scanlonian who thinks it's just about expectations), then I am arguably misleading the promisee about the nature of my commitment.

  ### 4. So, Escape or Relocation?
  It looks strongly like a **relocation**.

  **Why it's a Relocation:**
  Hume said you need a **social convention** to ground the force of the words. Scanlon tries to ground the force in **individual morality** (the wrong of disappointing reliance).
  *   The circularity objection shows that individual morality isn't enough. For the promisee to rely on me *specifically as a promise* (rather than a prediction), there must be a shared understanding that "promising" creates a duty.
  *   That shared understanding looks suspiciously like the **social convention** Hume demanded.
  *   Scanlon tries to get the convention for free via the psychology of trust. The critics say the psychology of trust *presupposes* the convention.

  **Is there *any* gain?**
  Scanlon defenders might argue he shifts the burden from "metaphysics of the will" to "ethics of care/trust." Even if it's circular, it locates the wrong in the **harm to the relationship**, which is more tangible than Hume's "violation of convention."
  *   **Hume:** Breaking a promise is like cheating at a game (violating rules).
  *   **Scanlon:** Breaking a promise is like betraying a friend (violating trust).

  However, regarding the **logical structure of the obligation**, the Kolodny/Wallace critique holds water: Scanlon hasn't explained how the obligation gets off the ground without assuming the promisee already believes the promisor is bound.

  ### 5. The Verdict for your Seminar
  You can confidently argue that Scanlon **relocates** the bootstrapping problem rather than solving it.

  *   **Hume:** "You can't create a duty by willing it."
  *   **Scanlon:** "You create a duty by creating an expectation."
  *   **Critics:** "You can't create a *rational* expectation without presupposing the duty."

  Scanlon successfully removes the "spooky metaphysical power of the will," which was Hume's primary target. But in doing so, he replaces it with a "spooky psychological power of expectation." He avoids the *metaphysical* circularity but falls into a *psychological/normative* circularity.

  The most robust conclusion is that **some form of convention (Hume) is still necessary** to make sense of the expectations Scanlon relies on. Scanlon explains why we *care* about promises (the harm of betrayal), but Hume (or a convention-based view) is still needed to explain how the promise *works* as a mechanism to generate that expectation in the first place.

  So, your hunch is correct: Principle F is a sophisticated costume, but the ghost of bootstrapping is still wearing it.
