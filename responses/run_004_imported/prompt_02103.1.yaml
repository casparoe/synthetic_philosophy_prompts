      *   *The Critic's Counter:* Kolodny ("The Ethics of Influence") and Wallace ("Normativity and the Will") argue that Scanlon's conditions require the promisee to believe the promisor *intends to be bound*. If the promisor isn't bound yet, why does the promisee trust them? If the trust is based on the *words*, the words need force. If the force comes from the *trust*, the trust needs a basis.
      *   *Verdict:* It looks very much like a relocation. Instead of "Will $\rightarrow$ Obligation," it's "Induced Expectation $\rightarrow$ Obligation." But the Induced Expectation is only reasonable if there's already an Obligation (or a convention that creates one).

