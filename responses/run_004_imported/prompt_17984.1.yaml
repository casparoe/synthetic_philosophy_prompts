          *   *Assessment:* Technically accurate. $L \models ZFC + CH + GCH$. Relative consistency proof.
          *   *Claim:* "Cohen invented the method of forcing to build a different model of ZFC in which CH is false, showing that ZFC + not-CH is equally consistent."
          *   *Assessment:* Technically accurate. Forcing adds subsets of $\omega$ to violate CH.
          *   *Claim:* "So neither CH nor its negation can be proved from ZFC, assuming ZFC itself is consistent."
