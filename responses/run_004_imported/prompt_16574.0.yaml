answer: |-
  HALE: You're conflating vulnerability with causation. The concrete was degraded, yes. But on the night in question, did that degradation release the water? No. The explosive did.

  VOSS: The explosive released the water through a wall that was already structurally compromised. If the concrete had met spec, the charge wouldn't have breached the core. It would have been a surface scar.

  HALE: That's a counterfactual about the charge's efficacy, not the concrete's causality. Stick to the loss. The town flooded. But for the saboteur, does the town flood? Yes. Half an hour later, maybe, but the water ends up in the same basements. So the saboteur isn't the but-for cause of the loss. He's merely the cause of the timing.

  VOSS: And but for the concrete, does the town flood at twelve-oh-five? No. It floods at twelve-thirty. So by your own logic, the saboteur is the cause of *this* flood. The twelve-thirty flood is a different event.

  HALE: It's the same loss. The insurance policy covers "catastrophic failure of the dam structure." It doesn't cover "catastrophic failure of the dam structure between midnight and twelve-fifteen." You're gerrymandering the event definition to force a causal link where there isn't one. If I describe the loss as "the town getting wet," your precise timing doesn't matter. The water gets there either way. The concrete is off the hook because it wasn't necessary.

  VOSS: So your test only works if you're allowed to be vague. As soon as you define the loss physically—volume, velocity, timestamp—your but-for test exonerates the concrete and pins it entirely on the man with the detonator. You can't have it both ways. You can't use a loose definition to dismiss the concrete and a strict one to dismiss the saboteur.

  HALE: I'm using a legally material definition. The difference between a flood at twelve-oh-five and twelve-thirty is irrelevant to the damages. The houses are destroyed either way. Causation tracks responsibility for the harm, not the itinerary of the water.

  VOSS: Responsibility is exactly why I'm looking at the system. My model doesn't ask "would it have happened anyway?" It asks "what node did we fail to control?" The concrete was a weak node. The security perimeter was a weak node. You intervene on the concrete node, you prevent the twelve-thirty failure. You intervene on the security node, you prevent the twelve-oh-five failure. Both are causal because both are points of leverage.

  HALE: And there's the circularity. To say you can "intervene on a node" to change the outcome, you've already assumed you know which nodes are causally connected to the outcome. You're building a fault tree that presupposes the very causation you're trying to prove. You say the concrete is a cause because changing it changes the result. But how do you know changing it changes the result without already knowing it's a cause? You're begging the question.

  VOSS: I'm not begging anything. I'm running simulations based on material stress limits. I know the concrete is a causal factor because physics tells me load-bearing capacity correlates with structural integrity. I don't need a counterfactual metaphysic to tell me that rotten wood breaks easier than sound wood. My model is pragmatic. It tells me where to pour money to stop the next flood. Your model tells me who to sue for the last one.

  HALE: My model tells me what actually made the difference. If I take the saboteur away, the dam holds until twelve-thirty. If I take the concrete away—replace it with spec mix—the dam holds past the explosion. So both are necessary for *this* specific breach. But if I look at the loss—the flooding—neither is necessary. That's overdetermination. And in overdetermination, the but-for test breaks down. I agree. So we fall back on the substantial factor test. Which factor was substantial?

  VOSS: Both.

  HALE: No. One released the water. The other just ensured the water had a easy path. If the concrete was perfect, the bomb fails. No flood. If the bomb is absent, the concrete fails. Flood. The bomb is the active agent. The concrete is passive background condition.

  VOSS: Background conditions are causes. Oxygen is a background condition for a fire, but if you remove it, the fire stops. We call it a cause in the lab. You only call it a condition in the courtroom because you don't want to sue the atmosphere. You're drawing a line between "cause" and "condition" based on liability, not mechanics.

  HALE: I'm drawing it based on agency. The concrete didn't choose to fail. It was entropic decay. The saboteur chose to act. If you're talking about interventionist models, the most efficient intervention is stopping the agent, not repouring the wall.

  VOSS: Unless you can't find the agent. Unless there are ten thousand agents potential. Then the only reliable intervention is the wall. You're hiding behind philosophy to avoid engineering reality. Your but-for test is clean only because you're ignoring the timeline. If you admit the timeline matters—that twelve-oh-five is not twelve-thirty—then the saboteur is the sole but-for cause of the actual event. So why are you still trying to pin negligence on the construction firm?

  HALE: Because the construction firm signed off on the concrete. If the bomb hadn't gone off, they would be liable for the twelve-thirty flood. The fact that a third party accelerated the inevitable doesn't erase their breach of contract. They sold a defective product. That defect was present at the moment of loss.

  VOSS: It was present, but it wasn't operative.

  HALE: It was operative in the sense that it defined the failure mode. The wall didn't burst; it crumbled. That's the concrete's signature. The bomb just opened the door.

  VOSS: And your but-for test says if the door was steel, the bomb fails. So the door is the cause. You're oscillating. You use but-for when it helps you, and substantial factor when it doesn't.

  HALE: I'm using the tool that fits the jurisdiction. You're using a tool that fits a textbook. In a textbook, every variable is a cause. In a hearing, only the liable ones are.

  VOSS: Then admit it. Don't tell me this is about causation. Tell me it's about indemnity.

  HALE: Indemnity follows causation.

  VOSS: No. Causation follows indemnity. You decide who pays, then you work backward to find the theory of causation that justifies it. I'm looking at the wall. I see two holes. One chemical, one explosive. You're asking me which hole caused the water to fall. Gravity caused the water to fall. The holes just let it through. Both holes were open.

  HALE: Then why did the water come through the explosive hole first?

  VOSS: Because the fuse was shorter than the erosion rate.

  HALE: Exactly. Timing. Which is irrelevant to the loss.

  VOSS: It's irrelevant to the insurance payout. It's not irrelevant to the physics. And if you want me to sign off on a root-cause analysis that says the concrete wasn't a cause, I won't do it.

  HALE: I'm not asking you to say it wasn't a cause. I'm asking you to say it wasn't the proximate cause.

  VOSS: Proximate is a legal term. It means "closest to the liability we want to assign."

  HALE: It means "foreseeable." Was the sabotage foreseeable?

  VOSS: Was the concrete degradation foreseeable?

  HALE: Touché.

  VOSS: So we're back to the nodes. Both were foreseeable risks. Both were unmanaged. Both caused the loss.

  HALE: If I pay out on both, I'm paying twice for one flood.

  VOSS: Then don't pay twice. Pay once. But don't ask me to lie about the mechanics to make your math work. The concrete failed. The bomb failed. The town flooded. Your but-for test breaks because the world isn't linear. My model holds because it accepts multiple failures.

  HALE: Your model accepts too much. If everything is a cause, nothing is.

  VOSS: If nothing is a cause, everything is an accident. And I don't think this was an accident.

  HALE: Neither do I. But I need to know which act to insure against.

  VOSS: Then insure against the system. Not the node.

  HALE: I can't price that.

  VOSS: Then you can't prevent it.

  HALE: My job isn't prevention. It's adjustment.

  VOSS: Then adjust this: The wall failed. Why is secondary.

  HALE: Why is everything.

  VOSS: Not to the water.

  HALE: No. To the checkbook.

  VOSS: Then we're done.

  HALE: We're done when you sign the report.

  VOSS: I'll sign the truth.

  HALE: The truth is expensive.

  VOSS: So is the flood.
