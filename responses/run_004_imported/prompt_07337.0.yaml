answer: |-
  **The Traditionalist:** Let's begin with the core intuition. In the fog of war, we treat combatants as equals. A soldier in uniform has a right to kill an opposing soldier, and is liable to be killed in return, regardless of whether their nation started the war unjustly. This isn't just a legal convention; it's a moral necessity. If we deny this "moral equality of combatants," we turn soldiers on the unjust side into murderers and soldiers on the just side into police officers. That distinction makes war limitless.

  **The Revisionist:** I respect the pragmatic impulse, but I think you're conflating the laws of war with the morality of killing. The deep morality is straightforward: you only have a right to kill in self-defense or defense of others against an *unjust* threat. If I attack you to steal your wallet, I make myself liable to defensive force. If you shoot me, you don't wrong me. In war, if a nation attacks without cause, its soldiers are the instruments of that unjust threat. They lack the right to kill the people defending against them.

  **The Traditionalist:** But war isn't a street fight. It's a collective institution. Soldiers are instruments of the state, not private moral agents roaming the woods. When they put on the uniform, they enter a role with specific obligations and permissions. If you strip the unjust combatant of the right to fight, you aren't just assigning blame; you're removing the incentive for them to follow *any* rules. Why would a "murderer" abide by the Geneva Convention?

  **The Revisionist:** That's the epistemic objection, isn't it? You're worried that if soldiers believe they are criminals, they'll fight dirtier. But let's separate blame from liability. An unjust combatant might be *excused* due to ignorance or duress—they aren't necessarily blameworthy murderers—but they are still *liable*. If a sleepwalking man tries to strangle you, he isn't morally blameworthy, but you still have the right to stop him, even lethally. His lack of malice doesn't give him a right to kill you.

  **The Traditionalist:** The sleepwalker analogy fails because war is inherently epistemic. Soldiers rarely know the *jus ad bellum* status of their cause. They rely on government testimony, propaganda, and limited information. If liability tracks objective justice, then a soldier's right to life depends on facts they cannot access. That makes the morality of war unknowable to the very agents who must act within it. A moral code that demands omniscience is a broken code.

  **The Revisionist:** I agree soldiers are often excused for their ignorance. But "excused" isn't the same as "permitted." If I mistakenly believe you are about to kill me, and I shoot you, I am not a villain, but I have still wronged you. You had the right to defend yourself; I did not have the right to attack. The asymmetry exists even if the individual isn't punished for it. My claim is about the *direction* of the permission, not the *punishment* for violating it.

  **The Traditionalist:** Here is where the institutional collapse happens. The Just War tradition relies on the independence of *jus in bello* (conduct in war) from *jus ad bellum* (justice of war). This allows us to condemn aggression without condemning the enemy soldier for fighting back. If you merge them, as you must, then every act of killing by an unjust combatant is a potential crime. You destroy the symmetry that allows for surrender, for prisoner of war status, for the idea that war has limits.

  **The Revisionist:** I don't deny the utility of the laws of war. But we shouldn't mistake a useful legal fiction for moral truth. We can keep the Geneva Conventions as a pragmatic overlay while admitting that, fundamentally, the just side has a stronger moral claim. In fact, acknowledging asymmetry might *strengthen* the law. If we admit that unjust combatants are liable, we put more pressure on leaders to ensure their cause is just, rather than handing soldiers a "get out of jail free" card via the uniform.

  **The Traditionalist:** Let's test that with the hardest case: the conscript. Imagine a soldier drafted by an aggressive regime, deceived into believing they are defending their homeland, and threatened with execution if they refuse to fight. On your view, is this person liable to be killed by a just combatant? If you say "yes," you seem monstrous. If you say "no," you've abandoned the idea that all uniformed combatants are legitimate targets, and now the just soldier must make a moral assessment of every enemy before firing.

  **The Revisionist:** This is the "innocent threat" problem. The conscript is not morally responsible for the unjust threat in the same way a volunteer is. Therefore, they are not *liable* to be killed in the strict sense. However, the just combatant may still kill them under a "lesser evil" justification. The conscript has no right to kill the just defender, but the just defender is permitted to kill the conscript to save themselves or their cause. The asymmetry remains: the just defender has a right; the conscript does not.

  **The Traditionalist:** So you admit the conscript isn't liable, but can be killed anyway? That distinction is too thin to bear the weight of a rifle bullet. To the family of the conscript, the result is the same. And practically, if the just combatant knows the enemy is full of such conscripts, your theory suggests they should hesitate. It burdens the soldier with a moral calculation that undermines military efficacy and prolongs the conflict, causing more death overall.

  **The Revisionist:** It burdens the soldier with the truth. If the cost of limiting violence is pretending that aggressors have the same rights as defenders, that is a high price. But let's look for the root of our disagreement. You seem to think the "soldier" role creates a moral shield. I think the "human" status creates the shield, and the "soldier" role only pierces it if the cause is just.

  **The Traditionalist:** Precisely. And I think your view assumes that the morality of war is just the morality of individual self-defense scaled up. I deny that. War is a distinct social practice with its own internal norms. My commitment isn't to the aggressor; it's to the limitation of violence.

  **The Revisionist:** And my commitment is to the idea that killing requires justification, and "I was told to" is not a justification for creating an unjust threat.

  **The Traditionalist:** Then let's state our cruxes. I want to find the specific claim where, if one of us changed our mind, the disagreement would dissolve.

  **The Revisionist:** Agreed. Here is mine: **My crux is the claim that liability to defensive harm strictly tracks objective moral responsibility for an unjust threat.** If you could convince me that liability can be generated by institutional role alone, independent of the justice of the cause, I would have to accept your view. I hold that role obligations cannot override the fundamental right not to be killed unless one is objectively threatening unjustly.

  **The Traditionalist:** And here is mine: **My crux is the empirical and normative claim that recognizing asymmetrical liability inevitably leads to greater aggregate brutality and undermines the possibility of regulated warfare.** I hold that the moral equality of combatants is indispensable for the *function* of war norms. If you could demonstrate to me that adopting your revisionist view would not collapse the distinction between combatant and criminal, and would not increase suffering or prolong conflicts, I would concede the moral point. I am defending equality because I believe it is the only way to keep war from becoming total.

  **The Revisionist:** So, if I could prove that asymmetrical norms could be institutionalized without increasing brutality, you would accept that unjust combatants lack the right to kill?

  **The Traditionalist:** Yes. Because then the moral cost of the fiction would outweigh its benefit. And if I could prove that institutional role *does* generate moral permissions independent of the cause—that being a soldier is morally distinct from being a private agent—you would accept the equality?

  **The Revisionist:** Yes. Because then the self-defense analogy would be inapplicable. It seems our disagreement rests on whether war is a unique moral sphere, or merely a large-scale aggregation of interpersonal conflicts.

  **The Traditionalist:** Then that is the double crux. Whether the "institution" overrides the "individual."

  **The Revisionist:** Agreed. That is the node we must examine.
