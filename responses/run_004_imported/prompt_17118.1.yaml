      *   **Section 21 (The "Mild" Case):**
          *   *Scenario:* We have nested classes (e.g., Men -> English Men -> Sickly English Men).
          *   *Venn's Point:* Usually, one class is "natural" or obviously appropriate (e.g., "Men of his age").
          *   *Rule:* If classes are nested (one inside the other), we generally prefer the *more specific* class (the narrower reference class) because it's more relevant to the individual.
          *   *Difficulty:* Low ("mild"). We know which statistic to pick (the most specific one available).

      *   **Section 22 (The "Aggravated" Case):**
          *   *Scenario:* Classes are *not* nested. They cross-cut each other.
          *   *Example:* Class A = Englishmen (9/10 injured in Madeira). Class B = Consumptive persons (9/10 benefited by Madeira). John Smith is *both*.
          *   *Conflict:* Statistic A says "Don't go (high risk)." Statistic B says "Go (high benefit)."
          *   *Venn's Point:* Both statistics apply truthfully to the groups Smith belongs to. But they yield contradictory practical advice/probabilities for *him*.
          *   *Logical Status:* The statistics themselves aren't contradictory (both can be true populations). The *inference* for the individual is contradictory.
          *   *Result:* "Without further data, therefore, we can come to no decision."

      *   **Section 23 (The Diagnosis & Resolution Attempt):**
          *   *Practical Solution:* We *would* choose based on causal relevance (lungs matter more than birthplace).
