prompt: |-
  So I had this long argument with my friend last night about those personalized health-risk calculators (the ones that spit out "your 10-year risk of X is 14%" based on your age, smoking status, family history, whatever), and she kept insisting that with enough data you can always just narrow down to "the" correct reference class for a given person and get a real, determinate probability out of it. I was arguing there's something deeper and genuinely unfixable going on there. Afterwards I went down a rabbit hole trying to find out if anyone had made this argument before philosophers started calling it "the reference class problem," and it turns out John Venn (yes, the Venn diagram guy) ran into basically the same wall back in 1888, in "The Logic of Chance." Below is the bit that's tripping me up. I get the general gist, but I can't quite pin down what he thinks is doing the actual work in the "aggravated" case that makes it worse than the "mild" case he describes just before it, and whether he's basically just throwing up his hands or making a sharper logical point about why no rule can rescue us here. Can you walk through the passage section by section and explain what exactly the aggravated form of the difficulty is, and also say whether you think his own diagnosis at the end (that we have "no means of knowing whether one set is more special than the other") is right, or whether theres a way to get a determinate answer that he's overlooking?

  Here's the passage (from Chapter 9, on Induction):

  "§21. Where one or other of the classes thus corresponds to natural kinds, or involves distinctions of co-ordinate importance with those of natural kinds, the process is not difficult; there is almost always some one of these classes which is so universally recognised to be the appropriate one, that most persons are quite unaware of there being any necessity for a process of selection. Except in the cases where a man has a sickly constitution, or follows a dangerous employment, we seldom have occasion to collect statistics for him from any class but that of men in general of his age in the country.

  §22. So much for what may be called the mild form in which the ambiguity occurs; but there is an aggravated form in which it may show itself, and which at first sight seems to place us in far greater perplexity.

  Suppose that the different classes mentioned above are not included successively one within the other. We may then be quite at a loss which of the statistical tables to employ. Let us assume, for example, that nine out of ten Englishmen are injured by residence in Madeira, but that nine out of ten consumptive persons are benefited by such a residence. These statistics, though fanciful, are conceivable and perfectly compatible. John Smith is a consumptive Englishman; are we to recommend a visit to Madeira in his case or not? In other words, what inferences are we to draw about the probability of his death? Both of the statistical tables apply to his case, but they would lead us to directly contradictory conclusions. This does not mean, of course, contradictory precisely in the logical sense of that word, for one of these propositions does not assert that an event must happen and the other deny that it must; but contradictory in the sense that one would cause us in some considerable degree to believe what the other would cause us in some considerable degree to disbelieve. This refers, of course, to the individual events; the statistics are by supposition in no degree contradictory. Without further data, therefore, we can come to no decision.

  §23. Practically, of course, if we were forced to a decision with only these data before us, we should make our choice by the consideration that the state of a man's lungs has probably more to do with his health than the place of his birth has... But this is, of course, to import empirical considerations into the question. The data, as they are given to us, and if we confine ourselves to them, leave us in absolute uncertainty upon the point... The problem is, therefore, left absolutely indeterminate, for we cannot here appeal to any general rule so simple and so obviously applicable as that which, in a former case, recommended us always to prefer the more special statistics, when sufficiently extensive, to those which are wider and more general. We have no means here of knowing whether one set is more special than the other."
