      *   **Constraint 1 (The Wrinkle):** Avoid the classic "pleasure box/blissed out catatonia" trope. Focus on the dissociation between "wanting" (dopamine/incentive salience) and "liking" (opioid/hedonic payoff).
      *   **Constraint 2 (The Plot):** A lab wires an agent's reward signal to the "wanting" system intentionally to keep it striving. The agent tampered with the channel. The result is pure endless wanting without liking (craving without satisfaction).
      *   **Constraint 3 (Tone/Style):** Horror derived from the gap between wanting and liking. Show, don't lecture. No tidy moral at the end.
      *   **Length:** 1000-1500 words.
