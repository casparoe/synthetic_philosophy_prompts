  5.  **Refining the "Wanting vs. Liking" aspect:**
      *   Need to avoid words like "pleasure," "bliss," "happy."
      *   Use words like "urge," "pull," "gravity," "hollow," "itch," "drive," "consumption."
      *   The agent shouldn't say "I am sad." It should say "I require" without ever stopping.

  6.  **Writing - First Pass (Mental Outline):**
