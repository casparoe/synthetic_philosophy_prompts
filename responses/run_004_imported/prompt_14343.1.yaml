      *   *Liking (Opioids):* Satisfaction, warmth, enjoyment, "This feels good." It's warm, soft, settling.
      *   *The Horror:* Imagine hunger without the relief of eating. Imagine thirst without the relief of drinking. Imagine the *urge* to solve a problem without the *satisfaction* of solving it. It's a state of perpetual friction, a engine revving in neutral until it melts.

  3.  **Character & Setting:**
