      *   *Kim's Objection:* Kim assumes a robust notion of "cause" that implies production. Spinoza's cause is more like logical grounding/immanence.
      *   *Verdict:* Spinoza dissolves the *conflict* but risks making the mental *explanatorily redundant* for anyone interested in physical outcomes. However, Spinoza would argue that being "explanatorily redundant for physics" doesn't make it epiphenomenal *simpliciter*, because the mental has its own causal integrity.

