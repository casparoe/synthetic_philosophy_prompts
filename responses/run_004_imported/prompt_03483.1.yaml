      *Decision:* It dissolves the *exclusion* (no competition) but relocates the *explanatory weight* (you can't use mental causes to explain physical effects, only mental effects). Is that epiphenomenalism? Spinoza says no, Kim might say yes (regarding physical interaction). I need to highlight this tension.

