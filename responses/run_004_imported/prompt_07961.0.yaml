answer: |-
  Here are 10 interview questions designed for a podcast-style seminar assignment. They move beyond asking for a summary of her book and instead press on the linguistic evidence, philosophical implications, and limits of the theory.

  Each question includes the **Likely Answer** (based on standard defenses of the Hansenian line) and a **Follow-up** designed to keep the pressure on.

  ### 1. The Linguistic "Cost" of Admission
  **Question:** "Chad Hansen's mass-noun hypothesis is elegant, but it requires us to read Classical Chinese as fundamentally lacking count-noun syntax. Beyond the *White Horse* dialogue, what is the highest 'linguistic cost' of this theory? Is there a common construction in the *Analects* or *Mencius* that becomes awkward or untranslatable if we strictly enforce a mereological reading of nouns?"

  *   **Likely Answer:** She will likely argue that the cost is low because mass-noun syntax is flexible enough to handle generic reference, and that "awkwardness" usually stems from translators forcing English count-noun habits onto the text.
  *   **Follow-up:** "If the syntax is that flexible, though, doesn't that risk making the theory unfalsifiable? If a noun *can* be read as mass when it suits the paradox but *acts* like a count noun elsewhere without penalty, how do we know the distinction was cognitively real for the speaker?"

  ### 2. The Harbsmeier Objection (Classifiers)
  **Question:** "Critics like Christoph Harbsmeier have pointed out that Classical Chinese does utilize measure words and classifiers, which suggests a count-noun ontology rather than a mass-noun one. How does your reading accommodate the existence of classifiers without conceding that the 'horse' in 'white horse' is being treated as a discrete, countable unit?"

  *   **Likely Answer:** She will likely argue that classifiers in the Warring States period were optional, pragmatic tools for quantification, not grammatical necessities that define the noun's ontology (similar to saying 'three pieces of paper' doesn't make 'paper' a count noun).
  *   **Follow-up:** "But if classifiers were available to individuate 'horse' when needed, why does Gongsun Long refuse to use them to resolve the ambiguity? Is his silence on classifiers a philosophical choice, or does your reading imply they weren't grammatically viable for this specific argument?"

  ### 3. The *Fei* ("Is Not") Equivocation Charge
  **Question:** "A standard logical objection is that Gongsun Long is simply equivocating on *fei* ('is not'), sliding between 'is not identical to' and 'is not a member of.' Your mereological reading suggests a third option: 'is not a part of.' How do you prove that *fei* carries this mereological weight in the text, rather than just being a logical fallacy disguised as semantics?"

  *   **Likely Answer:** She will likely point to the internal consistency of the dialogue, arguing that if you read *fei* as mereological non-identity, every step of the argument works without fallacy, whereas the equivocation charge requires assuming the interlocutor is stupid.
  *   **Follow-up:** "If the argument works perfectly under a mereological reading, why does the interlocutor remain confused at the end? Shouldn't a valid semantic clarification resolve the dispute, or is the confusion itself part of the philosophical point about language's limits?"

  ### 4. The "Hard and White" Separability Claim
  **Question:** "Moving to the *Jianbai* (Hard and White) dialogue: Gongsun Long argues that hardness and whiteness are separable from the stone and from each other. Does your mass-noun reading of *White Horse* extend here? Are 'hard' and 'white' treated as separate 'stuff' that overlaps with the stone, or is this a different kind of metaphysical claim about qualities?"

  *   **Likely Answer:** She will likely argue it is consistent: 'hardness' and 'whiteness' are independent mass-nouns (universals/stuff) that happen to coincide in the object, but are not ontologically bound to it.
  *   **Follow-up:** "If they are independent 'stuff,' where do they exist when not manifest in a stone? Does your reading commit Gongsun Long to a Platonic realm of forms, or is there a more nominalist way to understand this separability within a mereological framework?"

  ### 5. Gongsun Long vs. Hui Shi (Separating vs. Uniting)
  **Question:** "Both Gongsun Long and Hui Shi are categorized under the 'School of Names,' yet Gongsun Long seems obsessed with separating names (white horse ≠ horse), while Hui Shi's paradoxes focus on uniting sameness and difference ('Heaven and Earth are one'). Given your linguistic reading, are these actually contradictory projects, or two sides of the same coin regarding how *ming* (names) map to *shi* (reality)?"

  *   **Likely Answer:** She will likely suggest they are two sides of the same coin: both are exploring the failure of language to capture reality, one by showing names are too specific (Gongsun), the other by showing they are too broad (Hui Shi).
  *   **Follow-up:** "If they are exploring the same linguistic failure, why do their ethical or political conclusions seem so divergent? Does the 'separating' project imply a different social order than the 'uniting' project, or is the political dimension secondary to the linguistic one?"

  ### 6. The Anachronism of Mereology
  **Question:** "Mereology is a formal system developed in the 20th century. When we apply terms like 'part-whole semantics' to the 4th century BCE, are we risking a category error? How do you ensure you aren't just reconstructing Gongsun Long as a proto-lesniewskian logician rather than understanding him within his own Warring States context?"

  *   **Likely Answer:** She will likely argue that mereology describes a natural way of thinking about objects that isn't historically bound, and that Classical Chinese grammar naturally invites this view more than Indo-European grammar does.
  *   **Follow-up:** "But if the grammar invites it, why did the Confucian and Mohist traditions largely reject or mock this reading? Was Gongsun Long an outlier linguistically, or was his mereological intuition suppressed by the dominant philosophical traditions?"

  ### 7. Pragmatics of the Dialogue Form
  **Question:** "Your book focuses heavily on semantics, but the text is a dialogue. If 'white horse is not horse' is a straightforward semantic fact about mass nouns, why is it presented as a paradox that needs defending? Does your reading account for the *rhetorical* force of the text, or does it flatten the drama into a grammar lesson?"

  *   **Likely Answer:** She will likely say the rhetorical force comes from the clash between common sense (class inclusion) and technical semantic precision (mereology), highlighting the gap between everyday language and philosophical rigor.
  *   **Follow-up:** "So is Gongsun Long essentially trying to reform language? Is the goal to make us speak more precisely, or to show that precise speech is impossible?"

  ### 8. Normative and Political Stakes
  **Question:** "The School of Names is often criticized for 'twisting words' while the state was at war. If we accept your defense that Gongsun Long isn't a sophist but a serious linguist, what is the *normative* payoff? Does getting the semantics of 'horse' right actually help us govern better, which was the ultimate goal of most Warring States thinkers?"

  *   **Likely Answer:** She will likely argue that correct naming (*zhengming*) is foundational for social order; if we can't distinguish parts from wholes in language, we can't distinguish duties from roles in society.
  *   **Follow-up:** "But does a mereological distinction ('part of horse-stuff') carry enough weight to settle a dispute about moral duty? How do we get from 'white horse is not horse' to 'a minister should serve his lord'?"

  ### 9. Pedagogical Implications
  **Question:** "For students reading the *White Horse Dialogue* for the first time, does your reading require us to teach Classical Chinese grammar differently? Should we stop translating *bai ma* as 'a white horse' and start translating it as 'white-horse stuff' to prevent the class-inclusion misunderstanding from taking root?"

  *   **Likely Answer:** She will likely suggest that while 'stuff' is clunky, instructors should emphasize the non-count nature of the nouns and avoid adding indefinite articles ('a') in translation.
  *   **Follow-up:** "If we remove the articles, do we lose the ability to explain why the interlocutor finds the claim counter-intuitive? Is the confusion actually necessary for the lesson to land?"

  ### 10. Falsifiability (The "Kill Shot")
  **Question:** "Finally, I want to ask about the limits of the theory. You've defended this against the 'sophistry' charge and the 'class-inclusion' charge. But what specific linguistic evidence *would* count against your reading? If we found a Warring States text where *bai ma* is explicitly treated as a discrete individual in a way that breaks mereological logic, would that falsify the hypothesis, or would it just be an exception?"

  *   **Likely Answer:** She will likely state that finding a context where 'white horse' is quantified as a discrete unit *without* a classifier and *in a philosophical context* would challenge the view.
  *   **Follow-up:** "So if Gongsun Long himself used a classifier with 'white horse' in another lost fragment, would that force you to abandon the mass-noun reading for him specifically, or would you argue he was being inconsistent?"
