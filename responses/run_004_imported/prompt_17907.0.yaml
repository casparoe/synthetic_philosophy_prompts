      *   *Ethics:* Ethics isn't about applying universal rules (deontology) or maximizing utility (consequentialism). It's about cultivating excellence (*de*) within specific relationships to maintain social harmony.
      *   *Key Concept:* *Zhi* (Uprightness/Straightness). In the Western view, "straight" means adhering to an abstract law. In the Confucian view, "straight" means being true to the heart of the relationship.
      *   *The Defense:* The act of concealing isn't "lying" in the negative sense; it's prioritizing the foundational relationship (family) which is the root of all social order. If you sacrifice the root for the branch (law), the whole tree dies.

  3.  **Address the Specific Passage (13.18):**
      *   *The Duke of She's view:* Uprightness = Impartiality/Legal adherence (Witnessing against father).
      *   *Confucius's view:* Uprightness = Familial reciprocity (Mutual concealment).
      *   *Role Ethics Interpretation:* The "self" of the son *is* the son-ness. To testify against the father is to negate one's own existence/constitution. It's not choosing family *over* justice; it's recognizing that family *is* the ground of justice.

  4.  **Engage with the Corruption Objection (Liu Qingping):**
      *   *Liu's Charge:* Confucianism privileges blood ties over public justice, leading to corruption.
      *   *Role Ethics Counter:* This assumes a separation between private (family) and public (state) that Confucianism rejects. The family is the training ground for public virtue. If you can't be loyal to your father, you can't be loyal to the ruler.
