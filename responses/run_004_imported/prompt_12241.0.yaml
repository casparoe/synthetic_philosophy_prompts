  **Move 1 (Owen): Score 2.** Owen is textually correct regarding Aquinas's early *Commentary on the Sentences* (Book II, Dist. 44). Aquinas does distinguish the *tyrannus ex defectu tituli* (usurper) from the legitimate ruler, arguing that because a usurper holds no legitimate office, killing him does not constitute sedition (which requires disturbing a legitimate order). While some scholars debate whether Aquinas implies a "champion of the people" rather than any random private citizen, Owen's core claim that Aquinas is permissive regarding usurpers is accurate.

  **Move 2 (Ana): Score 2.** Ana is also textually correct and represents the standard scholarly consensus on Aquinas's mature political thought, specifically *De Regno* (On Kingship). Aquinas explicitly treats the *tyrannus ex parte exercitii* (legitimate ruler turned tyrant) differently, warning that private assassination often leads to worse instability. His prescription for this case is indeed public correction or prayer, not private violence. Ana successfully establishes the crucial distinction Owen's first move glossed over.

  **Move 3 (Owen): Score 1.** Owen is right that in the *Summa Theologiae* (II-II, Q. 42, Art. 2), Aquinas shifts the guilt of sedition onto the tyrant who disrupts the common good. However, Owen overreaches by suggesting this automatically licenses private violent removal in the "legitimate ruler" case. Removing the label of "sedition" removes one moral obstacle, but it does not confer the *jurisdiction* required to execute a ruler. Owen is substantially right on the text but hasty on the political implication.

  **Move 4 (Ana): Score 2.** Ana correctly identifies the logical gap in Owen's argument. In scholastic political theory, an act not being "sedition" does not make it "just"; it could still be murder or a usurpation of judicial authority. By reiterating that Aquinas reserves the power of coercion for public authority (or God) in the case of legitimate rulers, she accurately defends the distinction between *licit resistance* and *licit execution*. She wins the exchange on the question of authority.

  **Conclusion**
  Both scholars are largely accurate on the texts they cite, but they are eliding the development of Aquinas's own thought and the specific scholastic mechanics of "authority." Owen relies on an early text (*Sentences*) and a specific moral category (sedition) to suggest a broader permission than Aquinas typically grants. Ana relies on the mature political treatises (*De Regno*, *Summa*) to emphasize the necessity of public jurisdiction. What both slightly overlook is that for Aquinas, the "public person" (the community or its representatives) retains the authority even when the ruler fails; the elision lies in whether a private individual can act *in the name of* that public authority without a formal mandate. Aquinas's considered position is that while a tyrant may be resisted, the *act of deposition* generally requires a public mechanism to avoid descending into anarchy, a nuance that sits uncomfortably between Owen's permissiveness and Ana's caution.
