  **Jessie Fauset:** As the literary editor of Du Bois's *The Crisis* for nearly a decade, she curated fiction that adhered to his standards of racial respectability and uplift.
  **Alain Locke:** In his introduction to *The New Negro* and later essay "Beauty Instead of Ashes," he argued art should vindicate the race but warned against sacrificing aesthetic integrity for clumsy messaging.
  **Claude McKay:** He clashed publicly with Du Bois after the 1928 release of *Home to Harlem*, defending his right to depict black life truthfully rather than through a lens of racial propaganda.
  **Langston Hughes:** His 1926 essay "The Negro Artist and the Racial Mountain" explicitly rejected the pressure to conform to white standards or serve as a racial propagandist.
  **Countee Cullen:** During the 1926 symposium "The Negro in Art," he famously remarked that he wished to be known as "a poet, not a Negro poet," prioritizing universal aesthetics over racial duty.
  **Zora Neale Hurston:** In her 1928 essay "How It Feels to Be Colored Me," she asserted her individual identity and refused to bear the burden of representing racial tragedy in her work.
  **George Schuyler:** His 1926 article "The Negro-Art Hokum" fundamentally challenged the premise of the debate by arguing that distinct "Negro art" does not exist due to shared American environmental factors.
