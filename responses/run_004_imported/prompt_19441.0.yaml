  7.  **Final Polish:** Ensure legal terms like "ademption by extinction" and "settlor's intent" are used correctly but accessibly. Make sure the emotional weight (grandmother's arthritis, 60 years of wear) is acknowledged but not allowed to override the legal reasoning. (Actually, in trust law, intent *is* legal reasoning, so it fits).

