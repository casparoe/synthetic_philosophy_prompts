      *   *Check:* Did I address the unanimity requirement? Yes, emphasize that this memo is to bridge the gap.
      *   *Check:* Is the argument for the "rejected" position strong enough? I need to make sure I don't just say "Some might say..." but rather "The argument for strict construction is grounded in..."
