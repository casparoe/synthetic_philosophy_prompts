          *   Mechanism: Convention, standardization, reduction of complexity.
          *   Limit: No mystical limits. Everything physical is sayable/showable.
          *   Goal: Democratic enlightenment, unity of science.
          *   Fate of the theory: Continuous revision (Boat).

      *   **Addressing the Core Question: "Showing" vs. "Saying" in ISOTYPE:**
          *   *Crucial Point:* Does ISOTYPE have an ineffable remainder?
          *   *Neurath's Stance:* Physicalism. If it's not physical, it's metaphysics (nonsense).
          *   *Paraphrasability:* In principle, yes, an ISOTYPE chart can be translated into sentences. The *advantage* is psychological/pedagogical (memory, cross-linguistic), not logical/ontological.
          *   *Contrast:* Wittgenstein says the *logic* cannot be said. Neurath says the *facts* can be said, but pictures might say them *better* for the masses.
          *   *Nuance:* ISOTYPE relies on *conventions* (what does a man icon represent? 1000 people?). These conventions are agreed upon, not mystical. They are part of the "physicalist language."

      *   **The "Boat" vs. The "Ladder":**
          *   This is the strongest metaphorical contrast.
          *   Ladder: Transcendence, leaving language behind, reaching a point of silence.
