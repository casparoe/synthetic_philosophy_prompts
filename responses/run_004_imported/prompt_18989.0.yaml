  1.  **Deconstruct the Prompt:**
      *   **Core Subject:** The Vienna Circle and the use of the word "picture" (*Bild*) by two associates: Ludwig Wittgenstein (early) and Otto Neurath.
      *   **Wittgenstein's View:** *Tractatus Logico-Philosophicus*. Propositions as logical pictures of states of affairs. Shared logical form. The picturing relation is shown, not said. Theory is a ladder to be discarded. Mystical/unsayable element.
      *   **Neurath's View:** ISOTYPE (International System of TYpographic Picture Education). Literal visual pictograms for statistics/social facts. Anti-mystical. Physicalism. The "Neurath's Boat" metaphor (rebuilding at sea, no foundation, no ladder).
      *   **Key Question:** Is the terminological overlap coincidental or substantive?
      *   **Specific Inquiry:** Does ISOTYPE rely on something like "showing but not saying" (ineffable remainder), or is it designed to avoid it (fully paraphrasable into physicalist sentences)?

  2.  **Initial Assessment & Thesis Formulation:**
