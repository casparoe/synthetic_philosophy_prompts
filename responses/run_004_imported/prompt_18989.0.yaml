answer: |-
  The terminological overlap between Wittgenstein's *Bild* (picture) in the *Tractatus* and Neurath's "picture language" (ISOTYPE) is not merely coincidental, but it represents a profound philosophical divergence rather than a substantive agreement. Both thinkers were grappling with the same fundamental crisis of the early 20th century: the problem of representation. They both asked, "How does a sign connect to the world?" However, where Wittgenstein located the answer in the logical structure of reality itself (leading to silence), Neurath located it in the sociological conventions of scientific communication (leading to encyclopedia).

  To understand the depth of this split, we must analyze the function of the "picture" in both systems, specifically regarding your question about paraphrasability and the "unsayable."

  ### 1. Wittgenstein's Logical Picture: Ontological Isomorphism
  In the *Tractatus*, the "picture" is a metaphysical claim about the nature of propositionality. A proposition is a picture because it shares a **logical form** with the state of affairs it depicts.
  *   **The Mechanism:** If I say "The cat is on the mat," the arrangement of words mirrors the arrangement of objects. This mirroring is not visual; it is logical.
  *   **The Limit:** Crucially, Wittgenstein argues that while a proposition can *show* its logical form, it cannot *say* it. To try to state the logical form would require stepping outside logic, which is impossible. This leads to the famous distinction between what can be said (facts of natural science) and what can only be shown (the logical structure, ethics, the mystical).
  *   **The Ladder:** Because the theoretical propositions of the *Tractatus* attempt to talk about the relation between language and the world, they technically violate their own rules. They are nonsensical. Thus, they are a ladder: you use them to climb to a correct logical viewpoint, and then you throw the ladder away to see the world rightly.

  ### 2. Neurath's Visual Picture: Sociological Convention
  Neurath's ISOTYPE (International System of TYpographic Picture Education) is an epistemological and pedagogical tool, not an ontological one.
  *   **The Mechanism:** ISOTYPE uses standardized pictograms to represent statistical data (e.g., one man icon = 1,000 workers). The connection between the icon and the reality is not based on shared "logical form" but on **stipulated convention**.
  *   **The Goal:** The aim is the "Unity of Science" and democratic enlightenment. Neurath wanted to bypass the ambiguities of verbal language (which vary by nation and class) to create a neutral, physicalist language of facts.
  *   **The Boat:** Neurath's metaphor of the boat stands in direct opposition to Wittgenstein's ladder. We are sailors rebuilding our ship at sea. We have no dry dock (no foundational certainty) and no ladder (no transcendental viewpoint). We must use the planks we have (current scientific language/concepts) to replace the rotten ones. There is no endpoint where we discard language; there is only continuous reconstruction.

  ### 3. The Crux: Paraphrasability and the "Unsayable"
  You asked whether ISOTYPE relies on something like Wittgenstein's "showing-but-not-saying," or if it is designed to avoid ineffable remainders. **Neurath's system is explicitly designed to avoid the ineffable.**

  For Wittgenstein, the "picture" relation contains a remainder that *cannot* be paraphrased. You cannot translate the *picturing relation* into a proposition without losing the very thing that makes the proposition meaningful. There is a mystical residue.

  For Neurath, there is no mystical residue.
  *   **In Principle Paraphrasable:** Neurath was a staunch physicalist. He believed that any meaningful statement must be reducible to statements about spatio-temporal physical events. Therefore, an ISOTYPE chart, in principle, contains no information that *could not* be written down in sentences. If a chart shows a rise in unemployment, that fact can be stated verbally.
  *   **The Difference is Psychological, Not Logical:** The advantage of ISOTYPE is not that it accesses a deeper reality or shows the unsayable. The advantage is that it is **memorable** and **cross-linguistic**. It overcomes the "verbal barrier." Neurath believed verbal language was prone to metaphysical seduction (talking about "Spirit," "Nation," "Destiny"). Pictures, being tied to concrete quantities, kept the mind grounded in the physical.
  *   **Rejection of the "Show":** When Wittgenstein says logic "shows" itself, he implies a limit to expression. When Neurath uses pictures, he is simply choosing a more efficient mode of expression. For Neurath, if you can't say it (or picture it physically), it isn't knowledge.

  ### 4. Substantive Contact: The Rejection of Foundationalism
  While their conclusions differ, there is a substantive point of contact in their rejection of traditional foundationalism.
  *   **Wittgenstein** realizes we cannot stand outside language to check if it matches the world (hence the ladder must be kicked away).
  *   **Neurath** realizes we cannot stand outside science to ground it (hence the boat must be rebuilt at sea).

  Both agree that there is no "God's eye view." However, Wittgenstein treats this as a reason to stop philosophizing about the structure of the world (silence), whereas Neurath treats it as a reason to double down on collaborative, empirical verification (encyclopedism).

  Neurath was famously hostile to the "mystical" Wittgenstein of the *Tractatus* closing sections. He viewed the Vienna Circle's reverence for the *Tractatus* as dangerous if it led to metaphysical quietism. ISOTYPE can be read as a direct rebuttal to the *Tractatus*'s limitations: *Nothing* should be unsayable (or un-picturable) if it is a fact. If it is a fact, we can build a plank for it. If we cannot build a plank for it, it is not a fact.

  ### Conclusion
  The resemblance is **diagnostic, not prescriptive.** Both men diagnosed that language functions via structural representation (pictures). But where Wittgenstein saw this structure as a limit that demarcates the human from the divine (the sayable from the showable), Neurath saw it as a tool to be optimized for human cooperation.

  To answer your specific question: **ISOTYPE is precisely designed to avoid any ineffable remainder.** Neurath would argue that if an ISOTYPE chart communicates something that cannot be paraphrased into physicalist sentences, the chart is metaphysical nonsense. The "picture" in ISOTYPE does not *show* the logical form of reality (which would be unsayable); it *displays* physical data (which is entirely sayable, just less efficiently).

  Neurath took Wittgenstein's insight that "we speak in pictures" and secularized it. He removed the ladder, boarded the boat, and insisted that every plank—even the visual ones—must be made of the same physicalist wood. The terminological overlap marks the moment where Logical Positivism split: one path leading toward the linguistic analysis of the later Wittgenstein, the other toward the empirical sociology of Neurath.
