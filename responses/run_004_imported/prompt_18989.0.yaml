      *   *Deep Level:* Both are reacting to the crisis of representation in language. Both care about the *structure* of representation. Both are concerned with the limits of communication.
      *   *Thesis:* The overlap is not merely coincidental, but it is a case of *divergent evolution* from a shared problem space (how language connects to the world). However, Neurath explicitly rejects the *mystical* implications of Wittgenstein's "showing." ISOTYPE is designed to be fully paraphrasable (in principle), rejecting the ineffable. The substantive connection lies in their shared focus on *structure* and *convention*, but their teleological goals (silence vs. enlightenment) are diametrically opposed.

  3.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Acknowledge the irony. Both Vienna Circle adjacent. Both use "Bild" (picture). Define the two concepts briefly. State the thesis: Shared diagnostic insight (language represents via structure), divergent prescription (mystical silence vs. physicalist encyclopedism).

      *   **Wittgenstein's Logical Picture (The *Tractatus*):**
          *   Concept: *Bildtheorie*.
          *   Mechanism: Isomorphism. Logical form.
          *   Limit: The relation cannot be described (tautological).
          *   Goal: Demarcate the sayable to protect the unsayable (ethics, aesthetics, mystical).
          *   Fate of the theory: Self-consuming (ladder).

      *   **Neurath's Visual Picture (ISOTYPE):**
