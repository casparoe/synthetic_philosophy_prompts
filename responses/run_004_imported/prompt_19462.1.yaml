answer: |-
  This is a fascinating counterfactual exercise, and your intuition is sharp: identifying Fisher as the ur-adaptationist is historically sound, but characterizing him as a *narrative* adaptationist requires nuance. Fisher's adaptationism was not the loose, ethological storytelling that Gould and Lewontin primarily targeted (e.g., the sociobiology of the late 70s); it was a deductive, mathematical commitment to the efficacy of selection.

  Here is a reconstruction of how R.A. Fisher might have engaged with "The Spandrels of San Marco," structured around the three threads you identified.

  ### 1. On "Just-So Stories" and Mathematical Rigor
  Fisher would likely have agreed with Gould and Lewontin's *diagnosis* of the field's sloppy verbalism while vehemently denying that their *prescription* applied to his own work.

  Fisher spent *The Genetical Theory of Natural Selection* (1930) attempting to rescue Darwinism from the charge of being a mere "paper theory" by grounding it in biometry and Mendelism. He held a deep disdain for natural history descriptions that lacked statistical or genetic backing. If presented with the "just-so story" critique, Fisher would likely have pointed to the **Fundamental Theorem of Natural Selection (FTNS)** as the antidote.

  He would argue that the FTNS is not a story; it is a physical law analogous to the second law of thermodynamics. In his view, the rate of increase in fitness is *equal* to the additive genetic variance in fitness. Therefore, assuming adaptation is not a narrative leap; it is a mathematical expectation given sufficient variance and population size.

  **The Reconstruction:**
  Fisher would likely concede that *ethologists* and *naturalists* (perhaps even some of his Synthesis colleagues like Julian Huxley) were guilty of Panglossian storytelling. However, he would draw a sharp methodological line between their inductive narratives and his deductive models. He might have written:

  > "Dr. Gould is correct to scorn explanations that rely on verbal plausibility rather than quantitative necessity. However, the error lies not in the adaptationist premise, but in the lack of genetical rigor. Where I have demonstrated that a trait increases reproductive value through a calculable change in gene frequency, I have not told a story; I have solved an equation. The 'Spandrels' critique attacks the shadow of adaptationism, not its substance."

  **Speculative Flag:** It is unclear if Fisher would have acknowledged that his own applications of the theory (e.g., the specific adaptive scenarios for mimicry or the evolution of dominance) sometimes outpaced the available empirical data. He tended to view mathematical possibility as biological probability. He might have struggled to admit that a mathematically elegant model could still be biologically irrelevant if the initial parameters were wrong—a key point of the Spandrels critique.

  ### 2. On Constraints, Byproducts, and Reabsorption
  This is where the conflict would be most technical. Gould and Lewontin argued for the explanatory independence of structural constraints and developmental byproducts (spandrels). Fisher, whose worldview was intensely selectionist, would likely have attempted to **reabsorb these categories into the selectionist framework** rather than granting them independence.

  Fisher's geometry of adaptation (the "hypersphere" model) envisioned the organism in a high-dimensional phenotypic space. In such a space, "constraints" are merely regions of low fitness or low mutational accessibility, not absolute barriers. Furthermore, Fisher was deeply interested in **pleiotropy** and **linkage** (evident in his work on modifier genes and the evolution of dominance).

  **The Reconstruction:**
  Fisher would likely argue that what Gould calls a "spandrel" is simply a **correlated response to selection** on a different trait. In Fisher's mathematics, traits are rarely independent. If Trait A is selected for, and Trait B is genetically correlated (via pleiotropy or linkage), Trait B will change even if it is neutral or slightly deleterious, provided the net fitness gain is positive.

  He would resist the idea that a byproduct is a *non-adaptive* explanation. Instead, he would frame it as a **multi-trait optimization problem**. To Fisher, granting "constraints" the same explanatory status as selection would be akin to granting friction the same status as gravity in a mechanics problem. Friction matters, but it is not the driving force.

  > "To designate a trait as a 'byproduct' is merely to admit temporary ignorance of the full fitness function. If a structure persists, it does not lower fitness below the threshold of replacement. If it is a consequence of selection on a linked locus, it is still, in the final accounting, a product of the selective regime. To elevate architectural necessity to a rival cause of evolution is to confuse the boundary conditions of the problem with the force solving it."

  **Speculative Flag:** Fisher's later work on the "cost of natural selection" (Haldane's dilemma, which Fisher engaged with) suggests he was aware of limits to how fast selection could act. However, whether he would have accepted *developmental* constraints (in the Evo-Devo sense that Gould was flirting with) as hard limits is doubtful. Fisher viewed the genotype as highly malleable over deep time; he might have argued that "constraints" are merely selection pressures that have not yet been overcome given the available time and variance.

  ### 3. The Specter of Sewall Wright
  You are absolutely correct that Fisher would read "Spandrels" through the lens of his lifelong quarrel with Wright. In fact, Fisher might have viewed Gould and Lewontin as the intellectual grandchildren of Sewall Wright, translating Wright's **Shifting Balance Theory** into rhetorical and architectural metaphors.

  Wright's theory relied on small sub-populations where drift could move groups across adaptive valleys to new peaks. Gould's Spandrels rely on historical contingency and structural constraints that limit the availability of peaks. Both undermine the Fisherian view of a large, panmictic population smoothly climbing a single peak via mass selection.

  **The Reconstruction:**
  Fisher would likely interpret the "San Marco" analogy as a sophisticated plea for the importance of **small population size** and **historical accident**. The architectural layout of a cathedral is determined by the decisions of specific builders at specific times (contingency/drift), not by an optimization function. Fisher spent his career arguing that natural populations are large enough to render drift negligible. He would likely attack the Spandrels paper for implicitly assuming that populations are small enough for history and structure to trump selection.

  He might have responded:

  > "This critique is nothing less than the resurrection of Mr. Wright's 'drift' under a new name. Dr. Gould speaks of 'historical contingency' and 'architectural constraint,' but these are merely the verbal disguises of inbreeding and random fixation. I have shown mathematically that in populations of realistic size, the noise of drift is drowned out by the signal of mass selection. To build a general theory of evolution on the exceptions of small, isolated populations—or the structural accidents of specific lineages—is to build a physics on the behavior of dust motes rather than planets."

  **Speculative Flag:** Fisher did soften slightly in his later years regarding human populations, acknowledging that cultural evolution and smaller effective population sizes might apply to *Homo sapiens*. However, he generally maintained that for the "wild" species that constitute the bulk of evolutionary history, his large-population assumption held. He might have tried to compartmentalize: "Spandrels may apply to the quirks of human history or specific vertebrate lineages, but not to the general theory of the gene."

  ### Summary for Your Dissertation
  In your chapter, you can position Fisher not merely as a target of the adaptationist critique, but as a **methodological foil** to it.

  1.  **Fisher as the "Hard" Adaptationist:** Unlike the "soft" adaptationists Gould attacked (who told stories), Fisher provided the mathematical justification for why adaptation should be the null hypothesis.
  2.  **The Explanatory Hierarchy:** Fisher would reject the pluralism of the Spandrels paper. For him, selection is the *cause*, while drift and constraints are *parameters* or *noise*. Gould wanted to make them co-equal causes.
  3.  **The Wrightian Echo:** The Fisher-Gould conflict is, in many ways, the Fisher-Wright conflict extended into the realm of philosophy and paleontology. Fisher represents the view of evolution as a deterministic, optimizing process in large populations; Gould represents the view of evolution as a historical, contingent process shaped by structure and chance.

  Fisher's likely response would be one of **frustrated rigor**. He would feel that Gould and Lewontin were attacking a straw man of "loose adaptationism" while ignoring the "strict adaptationism" of population genetics. He would not concede that selection is less powerful than he claimed; he would concede only that biologists had been too lazy in calculating *how* it acted.

  **A final historiographical note:** You might consider mentioning that Fisher died in 1962, just before the molecular revolution that provided the neutral theory (Kimura, 1968). Had Fisher lived to see the Neutral Theory, his reaction might have been even more defensive, as molecular data provided the empirical evidence for drift that Wright had lacked. The "Spandrels" paper (1979) is, in a sense, the phenotypic counterpart to the Neutral Theory. Fisher would have likely fought both on the same grounds: that they mistake the background noise of evolution for the signal.
