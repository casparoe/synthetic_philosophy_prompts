      *(Self-Correction on Fisher's view of Drift)*: Fisher didn't deny drift existed; he denied it was *important* in large populations. He called it "Sewall Wright's effect." He would likely argue Gould is overestimating the frequency of small populations.

      *(Self-Correction on Constraints)*: Fisher's Geometric Model of Adaptation implies a high-dimensional space where constraints are less binding than in low-dimensional views. This is a technical point worth including for a PhD student.

