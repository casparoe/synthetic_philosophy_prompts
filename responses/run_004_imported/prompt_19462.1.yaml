      *   **Key Concepts:** Fundamental Theorem of Natural Selection (FTNS), Evolution of Dominance, Runaway Sexual Selection, Mimicry (with Cain).
      *   **Relationship with Wright:** Intense rivalry. Fisher viewed Wright's shifting balance theory as mathematically unsound and giving too much credit to drift/inbreeding.
      *   **Relationship with Adaptationism:** Fisher *was* an adaptationist, but a *mathematical* one. He believed adaptations were the result of optimization processes, not just storytelling.
      *   **Later Life:** Became more interested in eugenics and human genetics, but remained committed to the FTNS until the end (even refining it in 1958).

  3.  **Deconstruct Gould & Lewontin's "Spandrels" (1979):**
      *   **Core Critique:** Biologists too often assume every trait is an optimal adaptation. They ignore constraints, developmental byproducts (spandrels), and historical contingency.
      *   **Target:** "The Adaptationist Programme."
      *   **Method:** Architectural analogy (San Marco), critique of "just-so stories."
