  This is an exceptionally sharp observation, and you are right to feel that the standard presentation of the debate can obscure the precise point of divergence. It is a well-known phenomenon in the literature (pressing this point is one of Timothy Williamson's primary strategies in *Vagueness*) that Supervaluationism and Epistemicism are "logical twins" with respect to the theorems of the standard object language. Both validate $P \vee \neg P$, both validate Modus Ponens, and both preserve classical validity (defined appropriately).

  However, your advisor is correct: the disagreement is substantive, not merely verbal. The equivalence claim breaks down because **Classical Logic** is not exhausted by its set of valid schemata (theorems); it also includes **semantic constraints** and **meta-logical rules** that Supervaluationism explicitly rejects.

  Here is precisely where your equivalence claim breaks down, structured by the specific classical principles Supervaluationism sacrifices.

  ### 1. The Principle of Bivalence (Semantic Divergence)
  The most immediate substantive difference is that Supervaluationism rejects the **Principle of Bivalence**, whereas Epistemicism retains it. You may be conflating Bivalence with the Law of Excluded Middle (LEM).

  *   **Law of Excluded Middle (LEM):** The schema $P \vee \neg P$.
  *   **Principle of Bivalence:** The semantic claim that every sentence is either *true* or *false*.

  In classical logic, these two travel together. Supervaluationism decouples them.
  *   **Supervaluationism:** $P \vee \neg P$ is **supertrue** (true on all precisifications), even when $P$ is borderline. However, $P$ itself is neither supertrue nor superfalse. Thus, Bivalence fails.
  *   **Epistemicism:** $P \vee \neg P$ is true, and $P$ is either true or false (we just don't know which). Bivalence holds.

  **Why this is substantive:** This is not a verbal dispute about whether to call the cutoff "indeterminate" or "unknown." It is a disagreement about the **nature of truth**. For the Epistemicist, the world (or our language) is precise; for the Supervaluationist, the world (or our language) is genuinely indeterminate. This leads to different truth conditions for atomic sentences, which is a metaphysical and semantic divergence, even if the resulting logic of complex sentences looks the same.

  ### 2. The Principle of Compositionality (Semantic Divergence)
  Classical semantics is **compositional**: the truth value of a complex sentence is a function of the truth values of its constituents. Supervaluationism abandons this.

  *   **Classical/Epistemic:** The truth value of $P \vee Q$ is determined by the truth values of $P$ and $Q$.
  *   **Supervaluationist:** If $P$ is borderline (no truth value) and $Q$ is $\neg P$ (no truth value), the disjunction $P \vee \neg P$ is **supertrue**.

  Here, the inputs ($P, \neg P$) lack truth values, but the output ($P \vee \neg P$) has a truth value. The truth of the complex is determined by the behavior of the sentence across *precisifications*, not by the truth values of the parts. This requires a non-classical semantic machinery, marking a substantive theoretical divergence.

  ### 3. The Deduction Theorem / Conditional Proof (Meta-Logical Divergence)
  While Supervaluationism preserves classical validity for the standard connectives, it fails to preserve certain meta-logical rules once the language is enriched to talk about vagueness (which any theory of vagueness must do). Specifically, it invalidates the **Deduction Theorem** (Conditional Proof) in the presence of the **Definiteness Operator** ($D$).

  In classical logic, if $\Gamma, A \models B$, then $\Gamma \models A \to B$.
  In Supervaluationism, validity is defined as the preservation of **supertruth**.
  *   Let $A$ be a borderline sentence $p$.
  *   Let $B$ be $p \vee \neg p$.
  *   $p \models p \vee \neg p$ holds (if $p$ is supertrue, the disjunction is supertrue).
  *   $\models p \to (p \vee \neg p)$ holds.

  However, consider the interaction with $D$ (Definitely):
  *   Supervaluationism validates $D(P \vee \neg P)$ (It is definitely the case that excluded middle holds).
  *   Supervaluationism invalidates $DP \vee D\neg P$ (It is not definitely the case that $P$, nor definitely the case that $\neg P$).
  *   Crucially, Williamson and others have shown that Supervaluationism invalidates the inference from $A \models B$ to $\models A \to B$ when $A$ or $B$ involve $D$, or when validity is understood as preservation of truth *simpliciter* rather than supertruth.

  More technically, Supervaluationism is often charged with invalidating **Conditional Proof** because the conditional $\to$ is defined locally (on precisifications) while validity is defined globally (over all precisifications). If $A$ is true on some precisifications but not others (borderline), the relationship between $A \models B$ and $\models A \to B$ becomes unstable compared to classical logic.

  ### 4. The Witness Principle (Quantificational Divergence)
  This is perhaps the most damaging logical cost for Supervaluationism. In classical model theory, if an existential claim $\exists x Fx$ is true, there must be some object in the domain that satisfies $F$ (the **Witness Property**).

  *   **Sorites Context:** Let $F$ be "is tall." Supervaluationism entails that $\exists x (Fx \wedge \neg Fx')$ ("There is a cutoff") is **supertrue**.
  *   **The Problem:** For any specific individual $n$ in the series, the instance $Fn \wedge \neg Fn'$ is **not supertrue** (it is false on some precisifications).
  *   **The Divergence:**
      *   **Epistemicism:** There is a specific $n$ such that $Fn \wedge \neg Fn'$ is *true* (we just don't know which $n$). The Witness Principle holds.
      *   **Supervaluationism:** The existential is true, but *no instance* is true. The Witness Principle fails.

  This is a substantive logical divergence. Supervaluationism forces you to accept that "There is a number $n$ such that..." is true, while simultaneously maintaining that for every number $n$, " $n$ is the number..." is not true. This requires a non-classical handling of quantifiers.

  ### Summary for Your Paper
  Your equivalence claim breaks down because **Classical Logic** is a package deal of:
  1.  **Valid Schemata** (e.g., $P \vee \neg P$)
  2.  **Semantic Constraints** (e.g., Bivalence, Compositionality)
  3.  **Meta-Rules** (e.g., Deduction Theorem, Witness Principle)

  Epistemicism preserves the entire package. Supervaluationism preserves (1) for the base language but sacrifices (2) and (3).

  **Recommendation:** In your paper, concede that Supervaluationism and Epistemicism are **proof-theoretically equivalent** regarding standard tautologies (which explains the confusion), but argue that they are **model-theoretically and metaphysically distinct**. The "classical logic preservation" claim of Supervaluationism is a claim about *validity* (truth-preservation), purchased at the cost of *bivalence* and *compositionality*. This purchase price is the substantive difference your advisor is pointing toward.

  **Key Citation:** You should look at Timothy Williamson's *Vagueness* (1994), specifically Chapter 5, where he argues that Supervaluationism is "classical logic plus a truth predicate that does not obey the T-schema," and Rosanna Keefe's *Theories of Vagueness* (2000), which defends Supervaluationism by acknowledging these costs but arguing they are worth paying to preserve indeterminacy.
