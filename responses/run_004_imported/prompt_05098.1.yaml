answer: |-
  The fire in the grate had burned down to sullen embers, casting long, wavering shadows across the papers scattered on the table between them. Hobbes stood, his tall frame rigid, one hand resting on the back of a chair as if to steady himself against the sheer indignity of the arithmetic before him. Wallis sat, small and slight, dipping a quill into an inkwell with maddening calm.

  "You treat numbers as if they were substances," Hobbes said, his voice a low rumble. "You sum these… *indivisibles*. Pray, Mr. Wallis, describe the shape of one. Is it round? Square? Does it have thickness? If it has none, adding a thousand of them yields nothing. If it has some, they are not indivisible, but merely small bodies. Which is it?"

  Wallis blew the ink dry on a sheet of calculations. "It is a convenience, Mr. Hobbes. A method to arrive at the area of a curve. I do not need to weigh the brick to know the height of the wall."

  "A convenience!" Hobbes struck the table. "Mathematics is the only science God has vouchsafed to man wherein we know the truth because we make the definitions. But you? You conjure results like an alchemist boiling mercury. You claim a ratio, yet you cannot tell me what *motion* generated the magnitude. A line is the trace of a moving point. A surface, the trace of a line. Show me the motion in your series."

  "There is no motion," Wallis replied, looking up over his spectacles. "There is only ratio. You are shackled to the compass and the straightedge, insisting that geometry is carpentry. I tell you, the relationship between numbers holds true regardless of whether a physical hand can draw it. My *Arithmetica* calculates areas you cannot construct."

  "Because they do not exist!" Hobbes leaned forward, his eyes bright with a fervor that had survived the Restoration, the Plague, and the fire. "If you cannot generate it by motion, it is a phantom. You build a cathedral of ghosts and call it truth because the roof does not leak. But the foundation is air."

  "And your foundation is error," Wallis said, his patience thinning. "You claim to have squared the circle. You have published it. But the numbers do not obey you. I have checked your sums. The ratio is wrong."

  "The ratio is correct because the *cause* is correct," Hobbes snapped. "Your sums are merely counting shadows on the wall. You mistake the calculation of the world for the knowledge of it. You say the area is thus-and-so, but you cannot tell me *how* the figure came to be. You separate quantity from body. That is not mathematics, sir. That is mysticism."

  Wallis set down his quill. "And you separate truth from utility. I can predict the load a beam will bear using my series. I can map the heavens. What can you do with your 'generation by motion' but argue that my answers are impious because I cannot describe the soul of the infinitesimal?"

  "I save reason from absurdity!" Hobbes straightened, pulling his coat tight. "If you allow magnitudes without cause, you allow anything. You open the door to priests and fanatics who claim knowledge without demonstration. I demand that a man know what he speaks of. If he speaks of a line, he must know how it is made."

  "And I demand that a man admit when his method fails," Wallis countered, gathering his papers. "You insist the circle is squared because your philosophy requires it to be so. I say it is not, because the calculation forbids it. I am content to let the numbers stand, even if I cannot fully articulate the ontology of the steps between them. I do not need to know what a number *is* to know what it *does*."

  Hobbes scoffed, turning toward the door. "Then you are a scribe, not a philosopher. You count the coins but do not know what gold is."

  "And you," Wallis said, not looking up as he stacked his work, "are a man staring at a locked door, refusing to believe the room exists inside because you cannot forge the key with your bare hands."

  Hobbes paused at the threshold, his hand on the latch. "Motion is the key to all things, Mr. Wallis. Even your thoughts. Until you acknowledge the body, you are merely drifting."

  "Until you acknowledge the result, Mr. Hobbes," Wallis murmured, dipping his quill again, "you are merely still."

  Hobbes stepped out into the dark hall, leaving the door ajar. Wallis did not close it. He simply began to sum a new column, the scratch of the nib the only sound in the room, while the echo of the argument hung in the air, unresolved, like a geometric proof missing its final Q.E.D.
