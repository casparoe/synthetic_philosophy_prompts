answer: |-
  The throat was the first thing to return, a raw, scraping ache that anchored me back to the physical. The second was the light. Not the sterile fluorescence of the London hospital room, but the other light. The red one.

  I lay still, staring at the ceiling tiles. They were pitted, imperfect, verifiable. I could measure them, photograph them, invite a committee to scrutinize their texture. They were meaningful in the strict sense I had spent a lifetime defining. But the red light… the red light had been absolute. It had possessed a vividness that made these ceiling tiles look like shadows on a cave wall.

  For four minutes, I had been dead. Clinically. The salmon had lodged, the heart had stopped, and Freddie Ayer had ceased to be. And yet, here I was, breathing through the pain.

  In 1936, I had written that metaphysical statements are nonsense. To claim knowledge of a transcendent reality was to misuse language. If a proposition cannot be empirically verified—if it cannot be tested against sense experience—it is not false; it is literally meaningless. God, the soul, the afterlife: these were not mysteries to be solved, but grammatical errors to be dissolved.

  Now, I had a sense experience. A vivid one. I had seen a divine being. I had sensed a mind governing the universe. I had felt an overwhelming love for it. By the old criterion, this was the height of nonsense. It was a private hallucination, unrepeatable, untestable by any other observer. If I told you I saw God, and you could not see Him, what status does the statement have? It fails the verification principle. It is emotive, perhaps, but cognitively void.

  And yet.

  I turned my head. The nurse was checking the IV drip. She was real. The beeping monitor was real. But the memory of that red light burned hotter than the plastic tube in my vein. How could an experience feel more real than reality itself, yet fail the test of meaningfulness?

  The bind was exquisite. If I admitted the experience was veridical, I undermined the logical structure that had held my life together. I would be conceding that private consciousness could access public truths without empirical mediation. I would be inviting mysticism back into the temple of logic. But if I dismissed it as a mere firing of dying neurons, I was lying. Not about the theology—I cared little for theology—but about the phenomenology. The experience *happened*. To deny its occurrence was to deny the very sense data upon which empiricism is built.

  I had always trusted sense data. Why should I distrust this data simply because its object was unconventional? Because it wasn't public? But pain is private. Love is private. Are they meaningless? No, they are directly known. Perhaps the verification principle was too rigid. Perhaps it required a modification to accommodate the singular, the subjective, the immediate.

  I did not see pearly gates. I did not see departed relatives. I saw a structure of mind. It did not prove immortality. I remained a rationalist; I did not suddenly believe I would live forever. Death was still likely the end. But the absolute certainty of that negation… that had weakened. The door was not open, but it was no longer locked.

  I picked up the pen the nurse had left on the tray. My hand shook. I needed to write this down before the morphine smoothed the edges away. I had to articulate the paradox without resolving it. To say: *I saw what I saw, and it contradicts my philosophy, and I will not abandon my philosophy, but I cannot abandon the sight.*

  It was a messy position. It lacked the elegant symmetry of *Language, Truth and Logic*. It was untidy, hedged, human. I wrote the title first: *What I Saw When I Was Dead*. A provocative title. It invited the metaphysical interpretation I sought to avoid. But it was honest.

  I looked back at the ceiling. The verification principle demanded I treat the vision as a psychological event, not a theological one. Fine. It was a psychological event of such intensity that it altered my epistemological landscape. It proved that consciousness could persist, or seem to persist, outside the normal bounds of biological function. Whether that consciousness survived permanently was another matter. I had no data for that.

  But for those four minutes, I was elsewhere. And I was here.

  I put the pen down. The conflict remained. The logician in me demanded public proof; the man in me held a private certainty. I would not renounce rationalism. I would not claim revelation. I would simply stand in the gap between them, acknowledging that the map I had drawn was not the territory. The red light faded from my mind's eye, leaving only the afterimage, stubborn and unverified, glowing softly against the grey matter of reason.
