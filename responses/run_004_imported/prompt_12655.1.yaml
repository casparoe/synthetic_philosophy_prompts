answer: |-
  First off, take a deep breath. You were not "out-argued" in a way that should make you doubt your philosophical instincts. You stumbled on a technical detail (the specific model-theoretic properties of restricted induction), but your philosophical radar was spot on. This specific dispute—the **Conservativeness Argument**—is one of the most famous and contentious battlegrounds in contemporary philosophy of logic.

  Priya is technically correct about the model theory: if you restrict the induction schema, the theory becomes conservative. But you are philosophically correct about the cost of that move. The debate isn't about whether the math works (it does); it's about whether the math *matters* for the definition of truth.

  Here is the strongest possible version of your case, fleshed out with the technical precision needed to go toe-to-toe with a PhD.

  ---

  ### 1. The Technical Scorecard
  Let's formalize the disagreement so we are both looking at the same equations.

  *   **Base Theory:** $PA$ (Peano Arithmetic) in language $\mathcal{L}_{PA}$.
  *   **Truth Extension:** We add a truth predicate $T(x)$ and compositional axioms (e.g., $T(\ulcorner \phi \wedge \psi \urcorner) \leftrightarrow T(\ulcorner \phi \urcorner) \wedge T(\ulcorner \psi \urcorner)$). Let's call this theory $CT$ (Compositional Truth).
  *   **The Induction Schema:** $PA$ includes the axiom schema: $\phi(0) \wedge \forall x (\phi(x) \to \phi(x+1)) \to \forall x \phi(x)$.
      *   **Full Induction ($Ind_{\mathcal{L}_T}$):** The schema applies to *any* formula in the expanded language $\mathcal{L}_{PA} \cup \{T\}$.
      *   **Restricted Induction ($Ind_{\mathcal{L}_{PA}}$):** The schema applies *only* to formulas in the original language $\mathcal{L}_{PA}$.

  **The Results:**
  1.  **$PA + CT + Ind_{\mathcal{L}_T}$ is Non-Conservative.** As you noted, this theory proves $Con(PA)$ (the consistency of PA). By Gödel's Second Incompleteness Theorem, $PA$ cannot prove $Con(PA)$. Therefore, the truth theory has added substantive arithmetic content.
  2.  **$PA + CT + Ind_{\mathcal{L}_{PA}}$ is Conservative.** You can prove (via model expansion arguments) that any model of $PA$ can be expanded to a model of $CT$ without changing the arithmetic truths. Thus, no new arithmetic theorems are provable.

  **Priya's Move:** She advocates for position #2. She says deflationism requires conservativeness, so we must restrict induction.
  **Your Move:** You argue that restricting induction is ad hoc and undermines the utility of the truth predicate.

  ---

  ### 2. The Core Argument: The Conservativeness Dilemma
  Your strongest line of attack is to frame this as a dilemma for the deflationist. This is often called the **Shapiro-Ketland Dilemma**.

  **Horn 1: Accept Full Induction.**
  If the deflationist accepts $Ind_{\mathcal{L}_T}$, then $CT$ proves $Con(PA)$.
  *   *Consequence:* Truth is a **substantive** property. It allows us to prove facts about numbers that we couldn't prove before. It behaves like a mathematical object (like sets or numbers), not a mere logical device.
  *   *Result:* Deflationism is false.

  **Horn 2: Accept Restricted Induction (Priya's Move).**
  If the deflationist restricts induction to $Ind_{\mathcal{L}_{PA}}$ to preserve conservativeness:
  *   *Consequence:* The restriction is **ad hoc** and **self-undermining**.
  *   *Result:* Deflationism is saved only by making a substantive, unjustified assumption about the logic of truth.

  You need to hammer on **Horn 2**. Here is how you dismantle the restriction.

  ---

  ### 3. Why the Restriction is Ad Hoc (The "Logical Constant" Argument)
  Deflationists typically claim that the truth predicate is a **logical constant**, akin to $\neg$, $\wedge$, or $\forall$. It is part of the logical machinery, not a descriptive predicate like "is red" or "is prime."

  **The Problem:** In standard first-order logic (and PA), the induction schema applies to *all* well-formed formulas in the language, regardless of which logical constants they contain.
  *   If I define a new predicate $P(x)$ using complex logical operators, induction applies to $P(x)$.
  *   If $T$ is a logical constant, formulas containing $T$ are well-formed formulas.
  *   **Therefore:** There is no *logical* reason to exclude $T$ from induction.

  **Priya's Likely Counter:** She will say $T$ is not a mathematical property of numbers, so it shouldn't enter into mathematical induction.
  **Your Rebuttal:** This begs the question. In $PA$, induction applies to *any* definable property of numbers. If $T$ applies to Gödel numbers of sentences, it *is* a property of numbers in the context of the theory. To say "It's a property, but not the *kind* of property induction applies to" is to make a **substantive metaphysical claim** about the nature of truth.
  *   *The Irony:* To defend the claim that "Truth is not substantive," Priya must make a substantive claim about the logical behavior of the truth predicate (i.e., that it is immune to induction).

  ---

  ### 4. The "Implicit Commitment" Argument (The Heavy Hitter)
  This is the strongest philosophical argument against Priya's position, originally championed by Shapiro and Tennant. It attacks the *motivation* for conservativeness.

  **The Argument:**
  1.  When we accept a base theory like $PA$, we are not just accepting its axioms; we are accepting that the axioms are **sound** (true).
  2.  If we accept $PA$ as sound, we are implicitly committed to its consistency, $Con(PA)$. (If the axioms are true, they can't be inconsistent).
  3.  However, $PA$ alone cannot prove $Con(PA)$.
  4.  A theory of truth should allow us to make our **implicit commitments explicit**. $PA + CT + Ind_{\mathcal{L}_T}$ allows us to prove $Con(PA)$ by formalizing the soundness argument.
  5.  **Priya's Restriction:** By restricting induction, she prevents the truth theory from proving $Con(PA)$.
  6.  **The Cost:** This means the deflationist truth theory is **inadequate**. It prevents us from formally deriving conclusions that we are already rationally committed to by accepting $PA$.

  **The Kicker:** If deflationism requires a truth theory that *cannot* prove $Con(PA)$, then deflationism requires a truth theory that is **inferentially weaker than our actual mathematical practice.**
  *   If you accept $PA$, you *should* accept $Con(PA)$.
  *   If your theory of truth blocks you from deriving $Con(PA)$, your theory of truth is defective.
  *   Therefore, the requirement of conservativeness is the problem, not the non-conservativeness of truth.

  **How to phrase this to Priya:**
  > "Priya, if I accept PA, I'm committed to the truth of its axioms. If I'm committed to their truth, I'm committed to their consistency. The unrestricted truth theory just makes that implicit commitment explicit. By restricting induction to save conservativeness, you aren't showing truth is 'thin'; you're showing your theory of truth is too weak to capture the actual consequences of accepting arithmetic. You're saving deflationism by making the truth theory useless for reflecting on the base theory."

  ---

  ### 5. The "Generalization" Function
  Deflationists argue that the primary function of truth is **generalization**. We use truth to say things like "Every theorem of $PA$ is true."
  *   Formalized: $\forall x (Prov_{PA}(x) \to T(x))$.
  *   From this, plus compositional axioms, we want to be able to infer that $PA$ is consistent (since $0=1$ is not true).

  If we restrict induction ($Ind_{\mathcal{L}_{PA}}$), we severely hamper this generalizing function. We cannot use the truth predicate inside inductive proofs about the structure of formulas.
  *   **Example:** Many proofs about syntax require induction on the complexity of formulas. If the truth predicate appears in the formula describing the complexity, and induction is restricted, the proof fails.
  *   **The Charge:** Priya is preserving conservativeness by **lobotomizing** the truth predicate. She keeps it conservative by ensuring it can't interact fully with the mathematical machinery of the base theory. But if truth can't interact with the math, how can it be a device for generalizing *over* the math?

  ---

  ### 6. Summary of Your Position (The "Cheat Sheet")
  If you talk to Priya again, here is your battle plan. Do not contest the model theory (she wins there). Contest the **philosophical interpretation of the restriction**.

  1.  **Concede the Math, Challenge the Norm:** "I agree $PA + CT + Ind_{\mathcal{L}_{PA}}$ is conservative. I disagree that conservativeness is the correct norm for a theory of truth."
  2.  **The Ad Hoc Charge:** "Restricting induction solely to save conservativeness is gerrymandering. If $T$ is a predicate in the language, standard logic dictates induction applies. Excluding it requires a substantive justification that doesn't rely on the conclusion (that truth is non-substantive)."
  3.  **The Reflection Principle:** "Accepting $PA$ implies accepting $Con(PA)$. A truth theory that cannot derive $Con(PA)$ fails to capture our reflective commitment to the base theory. Deflationism shouldn't require us to be less mathematically articulate."
  4.  **The Dilemma:** "You are stuck between a truth predicate that has deductive bite (and thus looks substantive) or a truth predicate that is logically gerrymandered (and thus looks defective). Either way, the 'purely logical/disquotational' picture of truth is compromised."

  ### Final Verdict
  You weren't wrong. You encountered the **Conservativeness Argument**, and while Priya gave you the standard deflationist defense (Field/Horwich style), that defense is widely considered the "weak spot" of deflationism by realists (like Shapiro, Ketland, and Halbach).

  The restriction of induction is indeed viewed by many critics as an **ad hoc maneuver** to insulate deflationism from the consequences of Gödel's theorems. You identified the philosophical cost of that maneuver correctly: it renders the truth predicate logically second-class without a principled reason. Stand your ground.
