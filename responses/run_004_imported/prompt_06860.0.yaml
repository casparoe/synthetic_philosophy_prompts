      *   *Distinction:*
          1.  **Dynamics:** Why does entropy go up *given* a gradient? (Answer: Statistics/Probability).
          2.  **Boundary Condition:** Why was there a gradient *to begin with*? (Answer: Unknown/Past Hypothesis).

  3.  **Address the User's Specific Confusion ("Double Counting"):**
