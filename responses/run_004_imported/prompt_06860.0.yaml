      *   *Second Law (Statistical):* Entropy tends to increase because there are more high-entropy microstates than low-entropy ones.
      *   *The Trap:* If laws are symmetric, why doesn't entropy increase towards the *past* as well as the *future*?
      *   *Boltzmann's Mistake (initially):* He thought equilibrium was the default. If we are in a fluctuation, entropy should be higher in the past *and* future relative to now.
