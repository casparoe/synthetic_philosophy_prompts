      *   **The Conflict:** Teacher says it's an open cosmological problem. User feels like treating them separately is "double-counting."
      *   **Goal:** Clarify the distinction between the *mechanism* of entropy increase (Second Law/Statistics) and the *boundary condition* (Past Hypothesis), and explain why the latter is not explained by the former.

  2.  **Deconstruct the Physics/Philosophy:**
