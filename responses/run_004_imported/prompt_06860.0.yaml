      *   **The Core Distinction:** Separate *Dynamics* (laws of motion) from *Boundary Conditions* (initial state).
      *   **The Time-Symmetry Problem:** Explain that if you just apply statistics to *now*, you predict the past was *higher* entropy (Boltzmann Brain problem). This is crucial. It shows why the Second Law alone fails without the Past Hypothesis.
