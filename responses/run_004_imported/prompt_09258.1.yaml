answer: |-
  Here is a draft of ten interview questions with targeted follow-ups, designed to navigate the standard defensive maneuvers while maintaining a collegial, seminar-appropriate tone.

  ### 1. The Axiomatic Bridge
  **Question:** IIT begins with phenomenological axioms and moves to physical postulates. Critics often argue that this move presupposes what it aims to prove—namely, that the structure of experience *must* map onto the causal structure of the physical substrate. How do you respond to the charge that the derivation of the postulates from the axioms is less of a deduction and more of a stipulation that rules out competing theories by definition?

  **Follow-up:** If the answer is that the axioms are self-evident truths of experience: Given that different phenomenological traditions (e.g., Buddhist *anatta* vs. Cartesian substantialism) disagree on the intrinsic nature of experience, whose phenomenology gets to decide the postulates?

  ### 2. The Grid Objection (Part 1: The Bullet)
  **Question:** Scott Aaronson's construction of a grid of logic gates with high $\Phi$ but no apparent intelligence or behavioral complexity is often raised as a *reductio*. You've previously indicated willingness to accept that such a system possesses some form of consciousness, arguing that our intuitions about "deserving" consciousness are not evidence. If we accept that a static, functionally inert grid is conscious, what explanatory work is the concept of "consciousness" actually doing in your theory that the concept of "integrated information" isn't already doing on its own?

  **Follow-up:** If the answer is that consciousness *just is* integrated information: Does this not render the term "consciousness" redundant in the theory, turning IIT into a claim about mathematics rather than a theory of mind?

  ### 3. The Grid Objection (Part 2: The Cost)
  **Question:** Following on that, most scientific theories are judged partly by their parsimony and their alignment with pre-theoretical data points (like "humans are conscious, rocks are not"). If IIT requires us to revise our pre-theoretical data points so drastically that a photodiode or a logic grid qualifies, doesn't the theory incur a "conceptual cost" so high that it undermines its own utility as a scientific model, regardless of its internal consistency?

  **Follow-up:** If the answer is that science often overturns intuition (e.g., heliocentrism): Unlike heliocentrism, which preserved the *phenomena* of planetary motion while changing the model, IIT seems to overturn the *phenomena* of consciousness itself. Is there any intuition about consciousness left that IIT *wouldn't* overturn?

  ### 4. The Unfolding Argument (Part 1: Function)
  **Question:** The "unfolding argument" suggests that any recurrent network can be unfolded into a feedforward network with identical input-output behavior but $\Phi \approx 0$. Your standard reply is that IIT is a theory of intrinsic causal structure, not function or behavior. If behavioral equivalence is irrelevant to consciousness, on what grounds do we claim that the unfolded network is the *same system* as the recurrent one for the purpose of comparison?

  **Follow-up:** If the answer is that they are physically distinct implementations: Then isn't the claim trivial? Of course two different physical systems have different properties. The charge is that IIT makes consciousness causally irrelevant to the behavior that usually evidences it.

  ### 5. The Unfolding Argument (Part 2: System Boundaries)
  **Question:** This leads to a boundary problem. If behavior and function don't fix the boundaries of the system we should be evaluating, what does? When you sit down to calculate $\Phi$, you must choose which elements to include in the matrix. If not functional coherence, what principle tells us which physical components constitute a candidate system rather than just arbitrary noise or background physics?

  **Follow-up:** If the answer is that we choose the system that *maximizes* $\Phi$: Doesn't this make the theory circular? We find consciousness where we look for $\Phi$-maximization, because we defined the system by its ability to maximize $\Phi$.

  ### 6. The Exclusion Postulate (Part 1: Overlap)
  **Question:** I want to press on the Exclusion Postulate, which states that only the mechanism with the maximum $\Phi$ exists as a conscious entity. This seems to do the heavy lifting in preventing "duplication of subjects"—for example, preventing my consciousness from being identical to the consciousness of my brain plus my glasses, or my brain minus a neuron. Why should we accept exclusion as a metaphysical necessity rather than a convenient fix to avoid proliferating conscious subjects?

  **Follow-up:** If the answer is that experience is unitary and therefore the cause must be unitary: Doesn't this conflate the *unity of experience* with the *unity of the physical substrate*? Why can't a unified experience emerge from overlapping causal bases?

  ### 7. The Exclusion Postulate (Part 2: Causal Power)
  **Question:** If Exclusion rules out overlapping systems, it implies that sub-systems within a conscious entity (like specific neural circuits) lose their causal power to the whole. Does this not imply a form of causal drain where the parts cease to be causes in their own right? How does this square with the neuroscientific practice of localizing function to specific sub-regions that are clearly active and causal?

  **Follow-up:** If the answer is that the parts have power only *within* the context of the whole: Then isn't the Exclusion Postulate merely a claim about context-dependence, rather than an ontological elimination of the sub-systems as conscious entities in their own right?

  ### 8. Evolution and Adaptation
  **Question:** If consciousness is determined by intrinsic causal structure ($\Phi$) and not by input-output function, it becomes difficult to see how natural selection could select *for* consciousness. Selection acts on behavior and survival. If a system can have high $\Phi$ with no adaptive behavior (like the grid), or high adaptive behavior with no $\Phi$ (like the unfolded network), isn't consciousness in IIT essentially an evolutionary spandrel?

  **Follow-up:** If the answer is that high $\Phi$ structures are likely to be adaptive for other reasons: Then why tie the definition of consciousness to $\Phi$ specifically, rather than the functional architecture that evolution actually selected?

  ### 9. Empirical Specificity (Beyond PCI)
  **Question:** Much of the empirical support for IIT comes from the Perturbational Complexity Index (PCI) in anesthesia and sleep studies. However, Global Neuronal Workspace Theory (GNW) also predicts a breakdown of integration and broadcasting in those states. Beyond the correlation of PCI with wakefulness, is there a specific empirical signature in the *spatial localization* or *temporal dynamics* of consciousness that IIT predicts which GNW explicitly rules out?

  **Follow-up:** If the answer is that IIT predicts posterior "hot zones" while GNW predicts frontal activity: Recent lesion studies suggest frontal cortex damage doesn't abolish consciousness. If IIT relies on posterior data, is it not at risk of being a theory of *visual* consciousness specifically, rather than consciousness *simpliciter*?

  ### 10. Falsification Conditions
  **Question:** To close, I'd like to ask about falsification. Pointing to cases where PCI drops (like deep sleep) isn't sufficient, as that is consistent with many theories of unconsciousness. Imagine we construct a non-recurrent, feedforward AI that passes all behavioral tests for consciousness (Turing test, reportability, adaptive learning) but has $\Phi = 0$ by IIT's metrics. If the scientific consensus deems this AI conscious based on its behavior and functional architecture, would you accept that as a falsification of IIT, or would you maintain the AI is a "philosophical zombie" despite the evidence?

  **Follow-up:** If the answer is that you would maintain it is a zombie: Then what *conceivable* empirical finding—short of us finding a physical system with high $\Phi$ that explicitly reports *not* being conscious—would you accept as counting against the theory? If the theory is insulated from behavioral evidence by definition, where is the empirical risk?
