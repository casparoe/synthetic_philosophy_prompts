answer: |-
  This is a sophisticated philosophical puzzle that cuts to the heart of contemporary debates in moral psychology. You and your friend have correctly identified that the Kantian framework (motive of duty vs. inclination) feels too rigid for cases like Mateo's, where the outcomes are reliably good and the "bad" motive isn't malicious, merely misdirected.

  To answer your request, I need to draw a sharp line between Julia Markovits and Nomy Arpaly, as their projects are often lumped together as "anti-Kantian," yet they diverge significantly on the mechanics of moral worth. Then we can apply those mechanics to Mateo to see if they yield different verdicts, and finally evaluate which framework better captures our intuitions about moral credit.

  ### 1. The Precise Distinction: Coincident Reasons vs. Responsiveness

  While both Markovits and Arpaly reject Kant's requirement that an agent must act from the *concept* of duty, they propose different criteria for what replaces it.

  **Julia Markovits: The Coincident Reasons Thesis (CRT)**
  Markovits's account is **reasons-based and cognitivist**. For an action to have moral worth, the agent's *motivating reasons* must coincide with the *normative reasons* that make the action right.
  *   **The Mechanism:** If the reason it is right to feed the hungry is "because people are suffering," you must be motivated by "people are suffering."
  *   **The Constraint:** This requires a certain level of cognitive grasp. The agent must act *because* they take the right-making feature to be a reason for acting. It is not enough to simply do the right thing; the justification in the agent's mind must align with the justification in the moral reality.
  *   **Key Difference from Arpaly:** Markovits is concerned with the *content of the agent's rationalization*. If the agent cannot cite (even implicitly) the right-making feature as their motive, there is no coincidence, and thus no moral worth.

  **Nomy Arpaly: Responsiveness to Right-Making Features**
  Arpaly's account is **dispositional and psychological**. She locates moral worth in the agent's degree of *responsiveness* to the features of the situation that make the act right.
  *   **The Mechanism:** An agent has moral worth if their mental states (beliefs, desires, emotions) track the moral reality. Crucially, the agent does *not* need to represent these features as "reasons" or "moral duties."
  *   **The Constraint:** Responsiveness can be non-cognitive. You can be responsive to someone's pain through empathy or habit without ever forming the proposition "I ought to relieve pain."
  *   **Key Difference from Markovits:** Arpaly allows for a gap between the agent's *stated* motives and their *psychological engagement*. If an agent claims to act for self-interest, but their behavior reveals a deep, non-instrumental care for the victim, Arpaly can attribute moral worth based on that underlying responsiveness, even if the agent's "reasons" (in the Markovits sense) don't coincide.

  **Summary of the Divide:** Markovits asks, "Does the agent's justification match the moral truth?" Arpaly asks, "Does the agent's psychology track the moral truth?" Markovits is stricter on the agent's internal narrative; Arpaly is stricter on the agent's emotional/behavioral attunement.

  ---

  ### 2. Applying the Views to Mateo

  Let us apply these distinct lenses to your cousin.

  **The Markovits Verdict: No Moral Worth**
  Under the Coincident Reasons Thesis, Mateo fails clearly.
  *   **Normative Reasons:** The reasons that make Mateo's volunteering good are the needs of the families, the reduction of food insecurity, and the dignity of the neighbors.
  *   **Mateo's Motivating Reasons:** Mateo's motivating reason is romantic reconciliation with his ex-girlfriend. He explicitly admits that the food insecurity is "not really what's on his mind."
  *   **Analysis:** There is no coincidence. The content of his motivation (romance) is entirely distinct from the content of the moral justification (hunger). For Markovits, the fact that the romantic motive *causes* the good outcome is morally incidental, similar to a shopkeeper who charges fairly only to keep a good reputation. Mateo is treating the neighbors as a means to an end (winning back the ex), not as ends in themselves.
  *   **Result:** Mateo's actions are right, but they possess **no moral worth**.

  **The Arpaly Verdict: Ambiguous / Partial Moral Worth**
  Arpaly's verdict is more nuanced and potentially divergent.
  *   **Surface Level:** If we take Mateo at his word, he is responsive only to the "ex-girlfriend feature," not the "hunger feature." In this reading, he is like a person who avoids kicking a dog only because it might bite them, not because the dog would feel pain. This yields no moral worth.
  *   **Deeper Level:** However, Arpaly emphasizes *responsiveness* over *rationalization*. You describe Mateo as "warm and unhurried," keeping track of specific family needs, and clearing spoilage diligently. Arpaly might argue that this behavioral texture reveals a responsiveness to human dignity that Mateo himself is disavowing.
  *   **The Huck Finn Parallel:** Huck Finn believes he is doing wrong by helping Jim, but his friendship (a psychological state) tracks Jim's humanity (a right-making feature). Similarly, Mateo *says* he is doing it for love, but his *care* tracks the neighbors' needs. If his warmth is genuine and not merely performative for the ex, Arpaly could argue he is *de re* responsive to the neighbors' needs, even if *de dicto* he claims otherwise.
  *   **Result:** Arpaly would likely deny **full moral worth** (since his primary commitment is instrumental), but she might grant **partial moral worth** or credit for "unprincipled virtue." She would distinguish between his *avowed* motive (which lacks worth) and his *dispositional engagement* (which may contain traces of genuine responsiveness). Unlike Markovits, Arpaly leaves room for the possibility that Mateo is morally better than he thinks he is.

  ---

  ### 3. Evaluation: Which Account Tracks Our Intuitions?

  You asked which account does the better job of tracking what we care about when granting moral credit. While Markovits offers a cleaner normative standard, **I believe Arpaly's responsiveness account is superior for tracking actual moral credit in complex human psychology.**

  Here is why:

  **1. The Problem of Self-Deception and Articulation**
  Markovits's view relies heavily on the agent's motivating reasons. But human beings are notoriously bad at knowing their own reasons. We often rationalize behavior post-hoc. If Mateo says, "I do this for my ex," but finds himself genuinely moved when a family thanks him, Markovits must deny him moral worth because his *stated* reason doesn't coincide. Arpaly, however, can look at the emotional resonance. If Mateo lingers to talk because he actually cares about the person, Arpaly credits that responsiveness. We intuitively feel that a person who *discovers* they care about the poor through their volunteering is more creditable than one who coldly calculates duty, even if both start with "wrong" reasons. Arpaly captures this developmental moral reality; Markovits does not.

  **2. The Value of Instinctual Goodness**
  In the Mateo case, there is a specific intuition that nagged at you during dinner: Mateo is *reliable* and *warm*. A pure Kantian (or a strict Markovitsian) might say, "If the warmth is instrumental, it counts for nothing." But we generally value the warmth itself. We prefer a doctor who is naturally empathetic (even if they initially became a doctor for status) over one who is cold but dutiful. Arpaly's framework validates the moral value of that empathy as a form of responsiveness to the patient's vulnerability. Markovits risks dismissing genuine emotional attunement simply because it wasn't adopted for the "right" justificatory reasons.

  **3. Distinguishing Luck from Virtue**
  The strongest argument for Markovits is that she prevents "moral luck" from counting as worth. If I donate to charity solely to impress a date, Markovits says I get no credit. This feels right. However, Arpaly handles this too: if my responsiveness is *only* to the date's approval, I get no credit. The divergence comes when the responsiveness is mixed. Mateo is likely a mix: he started for the ex, but staying "unhurried" suggests he has become responsive to the neighbors. Arpaly allows us to parse this mixture and grant credit where the responsiveness exists. Markovits forces a binary: either the reasons coincide or they don't.

  **Conclusion**
  Your friend's Kantian instinct protects us from praising manipulation; Markovits refines this by demanding our reasons align with the good. But your instinct to resist that conclusion is protected better by Arpaly. She allows us to say that Mateo is currently lacking in full moral virtue (because his commitment is fragile and instrumental) without erasing the moral value of the care he is currently displaying.

  Arpaly's view is more charitable, but more importantly, it is more **diagnostic**. It allows us to tell Mateo: "You say you do this for her, but the way you treat these families shows you care about them, too. That part of you is good." Markovits can only say: "Your reasons are wrong." For the purpose of understanding and encouraging moral growth in people like Mateo, Arpaly's responsiveness account is the more useful tool.
