      *   **Move 5 (Nate):** Claims Bayes + Preregistration is best because of optional stopping (sequential analysis).
          *   *Assessment:* Technically true. Bayes factors allow optional stopping without inflating Type I error rates in the same way p-values do (though calibration can still be an issue). This is a distinct advantage of Bayes. However, it doesn't fully rescue the "root cause" argument from Move 1, because most of the crisis wasn't about optional stopping, it was about p-hacking multiple variables/outcomes.
