answer: |-
  The office smelled of ozone and old paper, a contradiction Elara had never managed to reconcile. On her desk, two screens glowed. On the left, a live feed of a café corner: Julian checking his watch, Mara smoothing her skirt. On the right, a waterfall of probabilities, cascading down in columns of green and amber.

  Elara was a Coordinator. Her clients paid her to optimize the variables of intimacy. Not to find love—the algorithm did that—but to time it. To ensure the chemistry ignited at the precise moment where the combustion produced the most stable heat.

  Today's file was standard. Julian and Mara were a 94% compatibility match. The goal was engagement within eighteen months. But the model had flagged a divergence.

  If Elara sent the signal now, Julian would stand up to greet Mara as she entered the door. They would kiss at 19:04. Conception occurs on the third date. The child—let's call him Subject Alpha—is born in November.

  If Elara waits four minutes, Julian will be distracted by a notification. He will greet Mara at the table. They kiss at 19:12. Conception is delayed by a cycle. The child—Subject Beta—is born the following August.

  Simple cluelessness would be worrying about whether the rain might cause a traffic accident three towns over. Elara didn't worry about accidents. She worried about identities.

  She knew, with the cold certainty of the model, who Alpha and Beta were. The simulation didn't predict personalities, not exactly, but it predicted trajectories based on genetic predisposition and temporal starting points.

  Subject Alpha lives thirty-two years. He develops a rare form of leukemia. His treatment requires a specific protein synthesis that, in twenty years, will not yet be patented. He dies. His death motivates his mother to fund a research institute that eventually cures the disease for thousands of others.

  Subject Beta lives eighty-four years. She is a mid-level actuary. She is happy. She plants a garden. She has three children, none of whom change the course of history. She dies peacefully, surrounded by family who remember her fondly but specifically.

  Elara's finger hovered over the *Transmit* key.

  This was the crux. Her contract was with Julian and Mara. Her metric was *their* utility. By every measurable standard, the match was a success. They were smiling now, across the divide of the café table. The visible good was immediate: the relief of loneliness, the spike of dopamine, the stabilization of their individual psyches.

  But the consequentialist imperative demanded she maximize the good. And the good ramified outward.

  If she chose Alpha, she traded a long life for a legacy of salvation. If she chose Beta, she traded salvation for a quiet, contained happiness.

  She could not weigh them. There was no common currency between "a mother's grief that fuels a medical breakthrough" and "an actuary's quiet Sunday mornings." One was a spike in the graph of human welfare; the other was a widening of the base.

  A simpler agent would ignore the downstream. *Simple cluelessness* suggests the ripples cancel out—the bad effects balance the good. But Elara's model showed they did not cancel. They diverged. They were specific, named, and mutually exclusive.

  She looked at Julian. He was laughing. The sound was captured by the ambient mic, a warm, jagged waveform. That laugh was real. It was happening now. It was the good she meant to do.

  But compared to the existence of Alpha or Beta, the laugh was negligible. It was dust against the weight of a lineage. And yet, she had no scale to weigh the lineage. How many units of present joy equal one future life? How many cures equal one garden?

  The vertigo wasn't that she didn't know what would happen. It was that she knew exactly what would happen, and the knowledge rendered the choice mute.

  If she acted on the visible reason (make them happy now), she ignored the dwarfing ripple. If she acted on the ripple (optimize the future), she treated the couple as means to an end they couldn't comprehend.

  Her supervisor had once told her, "We optimize for the visible. The rest is noise."

  But it wasn't noise. It was signal. It was just signal in a frequency she couldn't hear, carrying data she couldn't parse.

  On the screen, Julian reached for Mara's hand. The model flashed amber. *Critical Window Closing.*

  If she transmitted now, Alpha.
  If she waited, Beta.

  Elara felt the weight of the *Transmit* key. It was plastic, lightweight. It held the weight of a future population.

  She thought about the incommensurability. It wasn't that the values were equal. It was that they were different species of value. To compare them was a category error, like comparing the weight of a word to the weight of the paper it's printed on.

  But she had to choose. Inaction was a choice. Waiting four minutes was an action.

  The story of her career would be written in the lives of people who would never know her name. She was the butterfly. She was the wing.

  She looked at Mara's face. Mara was looking at Julian with an openness that terrified Elara. It was a trust placed in the universe, unaware that the universe was being curated by a woman in a room smelling of ozone.

  To choose Alpha was to condemn a specific human being to death for the sake of a statistic. To choose Beta was to condemn thousands of future patients to suffering for the sake of one woman's Sundays.

  There was no third option. There was no synthesis. The philosophy didn't offer a bridge; it only pointed out the chasm.

  Elara took a breath. She knew that whatever she did, she could not justify it. Justification required a common scale. She had two scales that measured different dimensions of reality.

  She could not solve the problem. She could only enact it.

  Her finger pressed down.

  The signal sent. Julian stood up. Mara looked up. The hands met.

  On the right screen, the column for Beta vanished. The column for Alpha solidified, turning from amber to green. The trajectory locked. The leukemia diagnosis appeared in the text stream, thirty years down the line. The cure appeared forty years down the line.

  Elara watched the couple lean in. They looked happy. They looked complete.

  She felt nothing that resembled vindication. She felt nothing that resembled guilt. She felt the hollow hum of the machine, the ozone biting at the back of her throat. She had chosen a specific future over a different specific future, using a metric that did not exist.

  The couple kissed. The world shifted on its axis, imperceptibly.

  Elara closed the file. She opened the next one. The screens glowed, indifferent to the weight they carried, displaying probabilities that refused to add up. She waited for the next critical window, sitting in the silence between two incomparable goods, ready to break the scale again.
