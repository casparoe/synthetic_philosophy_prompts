prompt: |-
  so i've been slowly working through Wittgenstein's Philosophical Investigations on my own time (never studied philosophy formally, just got curious and figured i'd try to tackle it myself) and i've hit a wall on section 258, which i guess is supposed to be the heart of the "private language" argument. here's the passage:

  "Let us imagine the following case. I want to keep a diary about the recurrence of a certain sensation. To this end I associate it with the sign "S" and write this sign in a calendar for every day on which I have the sensation.—I will remark first of all that a definition of the sign cannot be formulated.—But still I can give myself a kind of ostensive definition.—How? Can I point to the sensation? Not in the ordinary sense. But I speak, or write the sign down, and at the same time I concentrate my attention on the sensation—and so, as it were, point to it inwardly.—But what is this ceremony for? for that is all it seems to be! A definition surely serves to establish the meaning of a sign.—Well, that is done precisely by the concentration of my attention; for in this way I impress on myself the connexion between the sign and the sensation.—But "I impress it on myself" can only mean: this process brings it about that I remember the connexion right in the future. But in the present case I have no criterion of correctness. One would like to say: whatever is going to seem right to me is right. And that only means that here we can't talk about 'right'."

  i think i get the gist, that you can't fix what "S" means just by silently pointing at your own feeling, because there's nothing outside that act to check it against afterwards. but the thing i can't get past is this: isn't that exact same problem true of literally any word? like when i use the word "sour" today, all i've actually got is my memory that i'm using it the way i used it before - there's no independent check i'm running either, i just trust that it seems right. so why does he treat the private sensation-sign as uniquely doomed here, when ordinary public words seem to rest on the same kind of unchecked memory in the end? is there a real answer to this hiding in the text (or in how people who study wittgenstein usually respond to it), or is this actually a soft spot in the argument that i'm right to be suspicious of?
