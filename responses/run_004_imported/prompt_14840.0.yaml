answer: |-
  Your intuition is not only correct; it identifies a fundamental category error in the standard formalization of the Equal Weight View (EWV). As a physicist, you are accustomed to treating measurements as summaries of underlying likelihood functions and error structures. In the philosophical literature on peer disagreement, credences are often treated as atomic data points to be aggregated, rather than as posterior probabilities derived from distinct evidence sets.

  Treating "splitting the difference" as the default rational response is not a harmless simplification. It is a substantive statistical error that violates the rules of Bayesian conditionalization. It conflates *weighting the peer* with *weighting the evidence*.

  Here is the strongest case that the EWV's arithmetic averaging is a mischaracterization of rational conciliation, and why a properly Bayesian treatment often demands a posterior outside the range of the disputants' credences.

  ### 1. The Compression Error: Credences are Not Sufficient Statistics
  In your field, if Lab A reports $x_A \pm \sigma_A$ and Lab B reports $x_B \pm \sigma_B$, you never simply average $x_A$ and $x_B$. You reconstruct the likelihood functions. You ask: What was the raw data? What were the systematic uncertainties?

  In epistemology, a credence $P(H|E)$ is a compressed summary of evidence $E$ and a prior $P(H)$. When two peers disagree, they are reporting their posteriors. To update on their disagreement, you cannot simply average the posteriors. You must treat their credences as *data* about their evidence, and update your own probability distribution over the evidence structures.

  **The Substantive Error:** Arithmetic averaging of probabilities (Linear Opinion Pooling) is mathematically incompatible with Bayesian updating unless specific, restrictive conditions are met (e.g., both agents share the same prior and condition on independent, partitioned evidence with Gaussian likelihoods). In almost all real-world philosophical or scientific disputes, agents have different priors, overlapping evidence, and non-Gaussian uncertainty.

  By averaging credences, EWV assumes that the *only* relevant information is the final number. It discards the "error bars" (confidence/entropy) and the "correlation matrix" (shared biases). This is akin to averaging two measurements without knowing their variances. If your peer is slightly less precise than you, EWV forces you to degrade your precision unnecessarily. If they are more precise, it forces you to under-utilize their data.

  ### 2. Violation of External Bayesianity
  A key requirement for any rational aggregation method is **External Bayesianity**: the order in which you receive evidence and aggregate opinions should not matter. If you and I are peers, and we both observe new data $D$, we should reach the same consensus whether we:
  1.  Update individually on $D$ and then average our new credences.
  2.  Average our old credences and then update the aggregate on $D$.

  Linear averaging (EWV) fails this test. It is not associative. If you average first, then update, you get a different result than if you update, then average. This means the EWV prescription makes your rational credence dependent on the *timing* of the disagreement relative to the evidence, which is irrational.

  The only pooling operators that preserve External Bayesianity are **Geometric Pooling** (multiplying likelihoods) or **Multiplicative Pooling**.
  *   **EWV (Linear):** $P_{new}(H) = w P_A(H) + (1-w) P_B(H)$
  *   **Bayesian (Geometric):** $P_{new}(H) \propto P_A(H)^w \cdot P_B(H)^{1-w}$

  In log-odds space, Bayesian updating is additive. Linear averaging in probability space corresponds to a non-linear, distorted operation in log-odds space. This distortion systematically biases the aggregate toward 0.5 (maximum uncertainty) in cases where the evidence actually warrants increased confidence.

  ### 3. The "Outside the Range" Phenomenon: Systematics and Model Selection
  Your most pointed critique is that the combined estimate can be more extreme than either original figure. In physics, this happens when the disagreement reveals a systematic error common to both methods, or when the conflict points to a third, superior model.

  **Example: The Hidden Variable**
  Suppose Peer A is 80% confident in Hypothesis $H$ based on Evidence $E_1$. Peer B is 80% confident in $\neg H$ based on Evidence $E_2$.
  *   **EWV Response:** Split the difference. Credence in $H$ becomes 50%.
  *   **Bayesian Response:** The fact that $E_1$ supports $H$ and $E_2$ supports $\neg H$ with equal strength suggests that $H$ is likely the wrong *framework* entirely. The disagreement is evidence that the model space is underspecified.

  Suppose there is a third hypothesis, $H^*$, which predicts that $E_1$ occurs when parameter $\alpha$ is high, and $E_2$ occurs when parameter $\beta$ is high. The disagreement itself allows you to estimate $\alpha$ and $\beta$. If the data implies both $\alpha$ and $\beta$ are high, your credence in $H^*$ might shoot to 95%. Since $H^*$ entails $\neg H$, your credence in $\neg H$ becomes 95%—**more extreme than Peer B's original 80%**.

  By splitting the difference, EWV forces you to be less confident than either party about the specific hypotheses on the table, blinding you to the possibility that the disagreement itself validates a third, stronger conclusion. This is the scientific equivalent of two labs measuring different decay rates and concluding "the average rate is intermediate," rather than realizing "there are two different isotopes present."

  ### 4. The Correlation of Error (The "Peerhood" Trap)
  EWV relies on the definition of a "peer." Usually, this means someone equally likely to be right. In physics, you know that two labs using the same calibration standard share a **systematic error**. Averaging their results does not reduce uncertainty; it reinforces the systematic bias.

  In philosophy, "peers" share a language, a training tradition, and cultural priors. These are systematic errors.
  *   If you and I both read the same text and disagree on its implication, EWV says average our interpretations.
  *   A Bayesian says: The fact that we disagree despite shared training implies the text is ambiguous or our shared hermeneutic is flawed.

  If the disagreement is due to shared systematic bias (e.g., both of us are prone to confirmation bias regarding political propositions), averaging our credences does not converge on truth; it converges on the *biased consensus*. A proper Bayesian treatment requires estimating the correlation coefficient of our error terms. If $\rho \approx 1$ (highly correlated error), the weight given to the peer's disagreement should approach zero, not 0.5. EWV treats $\rho$ as 0 by default. This is not conciliation; it is naive aggregation.

  ### 5. Why This Is Not "Steadfastness"
  It is crucial to distinguish this critique from the "Steadfast View" (which says you can ignore the peer).
  *   **Steadfast:** "I am right, they are wrong. I keep my credence." (Ignores higher-order evidence).
  *   **EWV:** "We are equal. We meet in the middle." (Ignores evidence structure).
  *   **Proper Bayesian Conciliation:** "Your credence is data about your evidence and your reliability. I must update my model of the world *and* my model of your reliability."

  The Bayesian approach is often *more* conciliatory than EWV, but in a different direction. It requires you to abandon your specific credence *and* your peer's specific credence in favor of a new distribution derived from the union of evidence structures. Sometimes this means lowering confidence (when disagreement indicates noise). Sometimes it means raising confidence (when disagreement indicates complementary signal). Sometimes it means shifting to a hypothesis neither party considered (when disagreement indicates model failure).

  ### Conclusion
  The Equal Weight View's reliance on arithmetic averaging is a substantive error because it treats epistemology as a democracy of opinions rather than a physics of evidence. It assumes that the *fact* of disagreement is the only higher-order evidence, ignoring the *structure* of the disagreement.

  As you noted from your experience, a combined estimate can be more extreme than the inputs when the inputs constrain the error structure of the measurement process itself. By mandating a split-the-difference approach, EWV systematically underestimates the information content of disagreement. It forces agents to be less dogmatic than they should be when the disagreement reveals complementary evidence, and more dogmatic than they should be when the disagreement reveals shared systematic bias.

  A truly conciliatory view does not ask "What is the average of our opinions?" It asks "What posterior probability renders the fact of our disagreement most likely?" That answer is rarely the arithmetic mean, and frequently lies outside the interval of the disputants' original credences. To treat averaging as the default is to abandon the rigor that experimental science demands of its own data.
