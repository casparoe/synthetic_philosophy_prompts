      *   *Specific Stats Reference:* Since they did a PhD, I can mention "conjugate priors" or "loss functions" lightly, but keep it accessible. Let's stick to Expected Utility of Information (EUI).

  7.  **Final Polish:** Check against the prompt. Did I answer what has to be true for "always look" to hold? Yes (zero cost, no disutility from knowing, actionable differences). Did I answer if not wanting to know is a mistake? Yes (no, it implies a different utility function).

  8.  *(Self-Correction on Empathy)*: This is a heavy topic. I need to start and end with human connection, not just math. The math is the tool they are using to cope/analyze, but the pain is real.

  **(Post-computation check):** Does Good's theorem actually say "always look"? Yes, *if* information is free and utility depends only on state/action. The key insight for the user is that for HD, information is *not* free (psychic cost) and utility *does* depend on knowledge state (burden of knowledge).

