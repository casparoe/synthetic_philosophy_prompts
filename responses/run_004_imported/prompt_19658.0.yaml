          *   In CS: A property of the *logic* used to model the system. If the accessibility relation is transitive (S5), KK holds. If not (S4), it might not. But usually, we *want* S5 for distributed protocols because we assume processes know their own state perfectly.
          *   In Philosophy: A claim about the *nature of knowledge itself*. Does knowing something entail knowing that you know it? Williamson says no, because knowledge requires a margin for error in borderline cases (luminosity).

  3.  **Address the "Definition" Charge:**
