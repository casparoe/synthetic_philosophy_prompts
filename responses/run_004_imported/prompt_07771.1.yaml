  *(Self-Correction Note)*: Make sure Helen doesn't just say "simplicity." She needs to explain *why* U-235 fits the system better. It's because U-235 scarcity follows from nuclear physics, which is already in the best system. Gold scarcity does not follow from chemistry/economics in the same tight way. Arthur needs to point out that this makes the law status depend on what else is in the system, which seems unstable.

  *(Refining the Inference Problem)*: Helen should explicitly mention that if $N$ is a universal, the relation between $N$ and the instances is contingent unless further necessitated. Arthur should reply that $N$ is not a contingent relation but a necessitation relation by nature, even if we can't analyze it.

