  8.  **Final Polish:** Check word choice and pacing. (Proceed to generate output).

  *(Wait, one last check on the "Concede ground" requirement)*: I need to make sure they explicitly admit weaknesses.
  *   Helen admits BSA makes lawhood slightly anthropocentric (dependent on our weights for simplicity/strength).
  *   Arthur admits $N$ is epistemically inaccessible and obscure.

