answer: |-
  **Setting:** *A university office, late evening. A whiteboard dominates the wall. At the top, written in blue marker, are two statements:*

  1.  *No sphere of pure gold has ever exceeded a mile in diameter.*
  2.  *No sphere of pure U-235 has ever exceeded a mile in diameter.*

  *Helen (Humean) leans against the desk, arms crossed. Arthur (Anti-Humean) stands by the board, marker in hand.*

  **Arthur:** Look at them, Helen. Syntactically, they're twins. Universal generalizations, exceptionless, true. But ontologically? They're strangers. The gold statement is a cosmic accident. We just haven't found enough gold, or haven't wanted to build it. The U-235 statement is a law. If you tried to assemble that sphere, the critical mass would trigger a chain reaction. It *can't* exist.

  **Helen:** I agree they feel different, Arthur. That's the phenomenology of modality. But don't confuse the feeling with the furniture of the world. On the Best System Analysis, the difference isn't in the world's glue; it's in the systematization. The U-235 restriction is a theorem of the best deductive system summarizing the Humean mosaic. It follows from nuclear physics. Including it buys us immense strength—predictive power over stars and reactors—for a minimal cost in simplicity.

  **Arthur:** But the gold restriction *could* be included. It's true. Why isn't it a law?

  **Helen:** Because adding "No gold spheres..." to the axioms is ad hoc. It doesn't unify with chemistry or economics. It's an isolated fact. To make it a theorem, you'd need a messy axiom specifically about gold spheres. That tanks the simplicity score. The Best System balances simplicity and strength. U-235 wins the balance; gold loses it.

  **Arthur:** And there it is. You've made lawhood dependent on *us*. On our weights for simplicity, on our deductive capacities. If a being with a different cognitive architecture found a complex axiom simple, the U-235 regularity might stop being a law for them. But the explosion doesn't care about cognitive architecture. The necessitation is out there, in the universals. Being U-235 *necessitates* instability. That relation, $N(F, G)$, exists independently of any systematization.

  **Helen:** You're positing a primitive relation of necessitation to solve a problem you created. You say $N(F, G)$ holds between the universal *U-235* and the universal *Unstable*. But this invites the Inference Problem. Simply naming a relation "Necessitation" doesn't make it so. If $N$ is just another universal, what links $N(F, G)$ to the actual instances? Why does the existence of this relation guarantee that every particular U-235 sphere explodes?

  **Arthur:** Because that's what the relation *is*. It's not a contingent link that needs further linking.

  **Helen:** That's assertion, not explanation. If $N(F, G)$ is distinct from the regularity $\forall x (Fx \rightarrow Gx)$, then it seems logically possible for $N(F, G)$ to hold and yet the regularity fail. If it's not logically possible, then there's a further law connecting $N$ to the instances. But then you need a law to connect *that* law to the instances. You're off on a regress. You haven't explained necessity; you've just painted a target and drawn an arrow around it.

  **Arthur:** I concede the relation is primitive. I can't analyze $N$ in non-modal terms without circularity. But you're demanding a Humean style of explanation for a non-Humean fact. You want the necessitation to be visible in the mosaic. It isn't. It's the *ground* of the mosaic's patterns. However... I will concede this: $N$ is epistemically opaque. We infer it from the regularities. So, in practice, we identify laws the way you do—by looking for robust patterns. My ontology adds a truthmaker, but it doesn't give me a better heuristic for discovery.

  **Helen:** That's a significant concession. If your epistemology mirrors mine, but your ontology is heavier, Occam's razor bites hard. But I'll meet you halfway. The Best System Analysis does make lawhood slightly anthropocentric. If our standards of simplicity shifted, the set of laws could shift. That is counterintuitive. I'd prefer if laws were more robust. But I'd rather accept a slight mind-dependence than posit a magical glue that violates the Humean principle that there is no necessary connection between distinct existences.

  **Arthur:** But consider the counterfactuals. "If there *were* a mile-wide sphere of U-235, it would explode." Your system analyzes this by looking at the closest possible world where the antecedent is true. But how do you measure closeness? You prioritize worlds where the laws are held fixed. So you use laws to analyze counterfactuals, and counterfactuals to analyze laws. It's circular. My view breaks the circle: The law holds because of $N$, and the counterfactual holds because of the law.

  **Helen:** It's not circular; it's coherentist. We optimize the system to handle both actuals and counterfactuals. But I hear your worry. You think I'm smuggling necessity in by the back door when I talk about "strength." Maybe I am. But your solution is to posit a relation that, by your own admission, we can't observe and can't analyze. If I accept $N$, I solve the inference problem only by stipulation. "It necessitates because I say it necessitates." That feels like a conversation-stopper.

  **Arthur:** It's a theoretical primitive. You have perfect natural properties. I can't analyze those either. I just point and say, "Those things are alike." Why are you allowed categorical primitives and I'm not allowed modal ones?

  **Helen:** Because categorical properties fit the mosaic. They describe what *is*. Your properties describe what *must be*. That's a category error. But... I concede that the BSA struggles with single-case laws. If a particle interaction happens once in the history of the universe, and it's governed by a probabilistic law, my system has trouble calling it a law without a pattern. You can say $N$ holds even for a single instance. That is a point in your favor.

  **Arthur:** And I concede that $N$ doesn't solve the problem of induction. Knowing $N(F, G)$ holds doesn't logically guarantee the next $F$ will be $G$ unless we assume the future resembles the past, which is what we're trying to prove. So I don't get the epistemic jackpot I sometimes claim.

  **Helen:** So we're at an impasse. You have a robust ontology with obscure epistemology. I have a clear epistemology with a deflated ontology.

  **Arthur:** Essentially. So, let's make it precise. What would actually change your mind, Helen? What would make you a necessitarian?

  **Helen:** If you could show me a modal fact that *cannot* be captured by any Best System, no matter how we weight simplicity and strength. If there were a genuine constraint on the world that actively *prevents* a systematization from capturing it—something that breaks the mosaic rather than just patterning it—I'd have to accept your $N$. Specifically: if you could demonstrate that two worlds could be identical in their Humean mosaic of particular matters of fact, yet differ in their laws. If supervenience fails, I'm done.

  **Arthur:** That's a high bar. And for me? What would make you a Humean?

  **Helen:** What would change *your* mind, Arthur?

  **Arthur:** If you could provide a semantics for counterfactuals and causal claims that doesn't implicitly rely on modal primitives. If you can show me how "If I had struck this match, it would have lit" is true solely in virtue of the actual mosaic, without appealing to a system that is selected by *our* interests... If you can naturalize modality completely, without residue, I'll drop the $N$. But until then, I need the glue.

  **Helen:** And until I see the glue, I'll stick with the system.

  **Arthur:** *Wipes the board.* Then we have work to do.

  **Helen:** *Picks up an eraser.* Indeed. But first, coffee. Even laws of nature don't run on empty.
