          *   Bayesian: Asks "How much more likely is this data under $H_1$ compared to $H_0$?" (Bayes Factor) or "What is the probability $H_0$ is true given the data?" This depends heavily on the prior assigned to $H_1$. If $H_1$ is vague (spread out), the likelihood of the specific observed data under $H_1$ gets diluted.
      *   *Key Driver:* Large sample size + a specific prior structure (point null vs. diffuse alternative).

  3.  **Drafting the Example:**
      *   *Scenario:* A clinical trial or psychology experiment is standard. Let's go with a drug effect on blood pressure or a cognitive task. Let's choose something simple: A coin toss or a mean difference. A mean difference is more "realistic" for replication crisis contexts.
      *   *Parameters:*
          *   Null Hypothesis ($H_0$): Mean effect $\mu = 0$.
          *   Alternative Hypothesis ($H_1$): Mean effect $\mu \neq 0$.
          *   Sample Size ($N$): Needs to be large to trigger the paradox. Let's say $N = 10,000$ (common in big data or meta-analyses, maybe too big for a single psych study, but necessary for the math to work clearly). Actually, let's aim for something slightly smaller but still large, like $N = 1,000$ or $2,000$, to make it feel more like a "study." Let's calculate roughly.
