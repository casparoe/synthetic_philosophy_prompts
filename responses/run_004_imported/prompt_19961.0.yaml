answer: |-
  You are describing a well-documented statistical phenomenon known as **Lindley's Paradox**. It is not a calculation error; it is a fundamental divergence in what the two frameworks are actually asking.

  Here is a concrete example, an explanation of the mechanical difference, and why this matters for the replication crisis.

  ### 1. The Concrete Example: The "Big Data" Drug Trial

  Imagine a pharmaceutical company testing a new supplement intended to lower resting heart rate.

  **The Setup:**
  *   **Null Hypothesis ($H_0$):** The supplement has **zero** effect (Mean change = 0 bpm).
  *   **Alternative Hypothesis ($H_1$):** The supplement has **some** effect (Mean change $\neq$ 0 bpm).
  *   **Sample Size ($N$):** 10,000 participants (feasible with modern online recruitment or genomic data).
  *   **Population Standard Deviation ($\sigma$):** 10 bpm (typical variation in heart rate).
  *   **Standard Error ($SE$):** $\sigma / \sqrt{N} = 10 / 100 = 0.1$.

  **The Data:**
  After the trial, the average reduction in heart rate is **0.196 bpm**.

  **The Frequentist Analysis (P-value):**
  The frequentist asks: *"If the null were true (0 effect), how likely is it we'd see a result this far from zero?"*
  *   Test Statistic ($Z$): $\frac{\text{Observed Effect}}{SE} = \frac{0.196}{0.1} = 1.96$.
  *   **P-value:** A Z-score of 1.96 corresponds exactly to **$p = 0.05$**.
  *   **Conclusion:** Statistically significant! We reject the null. The supplement works.

  **The Bayesian Analysis (Posterior Probability):**
  The Bayesian asks: *"Given this data, how much more likely is the Null Hypothesis compared to the Alternative?"*
  To answer this, we must specify a **prior** for the Alternative. We cannot just say "some effect"; we must specify what effects are plausible.
  *   **Prior on $H_0$:** 50% probability the effect is exactly 0.
  *   **Prior on $H_1$:** 50% probability the effect is non-zero, distributed normally around 0 with a standard deviation of 5 bpm (reflecting a belief that if it works, it probably changes heart rate by a few beats, not 0.001).
  *   **The Calculation:** The Bayesian compares how well $H_0$ predicts the data vs. how well $H_1$ predicts the data.
      *   $H_0$ predicts data will cluster tightly around 0. Our data (0.196) is very close to 0. $H_0$ predicted this well.
      *   $H_1$ spreads its probability mass over a wide range (e.g., -10 to +10). Because it is spread so thin, the probability density assigned to the specific value of 0.196 is actually *lower* than the density $H_0$ assigns to it.
  *   **Result:** The Bayes Factor (ratio of likelihoods) favors the Null. In this specific configuration, the posterior probability of $H_0$ being true rises to roughly **80–90%**.
  *   **Conclusion:** The data provides strong evidence *for* the Null. The supplement likely does nothing.

  **The Split:**
  *   **Frequentist:** "Significant evidence the effect is not zero."
  *   **Bayesian:** "High probability the effect *is* zero."

  ### 2. Why This Happens: Precision vs. Vagueness

  The divergence happens because the two methods penalize different things.

  **The Frequentist focuses on the Null's precision.**
  The Null Hypothesis is a "point" hypothesis (Effect = exactly 0). As sample size ($N$) grows, the "noise" (Standard Error) shrinks. With $N=10,000$, our measurement is incredibly precise. Even a tiny deviation (0.196) looks distinct from zero because the margin of error is so small (0.1). The p-value essentially measures **sample size-adjusted distance from zero.** With enough data, *any* non-zero deviation becomes significant.

  **The Bayesian focuses on the Alternative's vagueness.**
  The Bayesian analysis compares the Null against the Alternative. The Null is precise (it bets everything on 0). The Alternative is usually vague (it hedges its bets across a wide range of possible effects).
  *   When $N$ is small, data is noisy. A result of 0.196 is compatible with many values in the Alternative's range.
  *   When $N$ is huge, data is precise. The Alternative hypothesis is penalized for being vague. It said the effect could be 1, or 5, or -2. It did not specifically predict 0.196. The Null, however, specifically predicted values near 0.
  *   Because the observed data is *so close* to zero (even if statistically distinguishable), the precise Null predicts the data better than the vague Alternative.

  In short: **The p-value tells you the data is inconsistent with exact zero. The Bayesian posterior tells you the data is more consistent with exact zero than with a wide range of non-zero values.**

  ### 3. Relevance to the Replication Crisis

  This paradox is not just a mathematical curiosity; it is a structural engine of the replication crisis for three reasons.

  **1. The "Significance" Illusion**
  Researchers often interpret $p < 0.05$ as "There is less than a 5% chance the Null is true" (i.e., "I am 95% sure my theory is right"). Lindley's Paradox proves this interpretation is false. In the example above, $p=0.05$, yet there was an ~85% chance the Null was true. Thousands of published papers may claim "discoveries" based on p-values that actually represent evidence *for* the null when viewed Bayesianly.

  **2. The Danger of Large Samples (Big Data)**
  Modern science increasingly relies on massive datasets (online behavioral tracking, biobanks, etc.). As $N$ increases, trivial, meaningless effects become "statistically significant."
  *   *Example:* A study of 100,000 people might find a significant link between eating blueberries and IQ ($p < 0.001$), but the effect size is 0.01 IQ points.
  *   The frequentist says "It's real!" (replicable in infinite samples).
  *   The Bayesian says "It's noise." (The effect is so small it's practically indistinguishable from zero given the vagueness of theory).
  *   This leads to a literature full of "significant" findings that fail to replicate in smaller, standard-sized studies because the original effect was a statistical artifact of sample size.

  **3. Incentivizing Vague Theories**
  Because frequentist testing only requires you to reject a precise Null, it rewards vague theories. A theory that predicts "anything other than zero" is hard to falsify with p-values if you have enough data. Bayesian methods force you to be specific about what effect you expect. If you predict a "large effect" and find a "tiny significant effect," the Bayesian analysis will penalize you. The replication crisis is partly a crisis of **theoretical vagueness**, and the p-value vs. posterior split highlights exactly where that vagueness hides.

  ### Summary
  The disagreement isn't about the math; it's about the question.
  *   **Frequentist:** "Is the data weird assuming nothing is happening?" (Yes, because $N$ is huge).
  *   **Bayesian:** "Is 'nothing happening' a better explanation than 'something vague is happening'?" (Yes, because the data is very close to nothing).

  The replication crisis arises because we treat the answer to the first question as if it were the answer to the second.
