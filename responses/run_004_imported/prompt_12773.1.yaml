answer: |-
  Your hunch is correct. In fact, it is a remarkably sharp synthesis of the relationship between these two results. You have accurately identified that Good's Theorem is mathematically a special case of the "easy" direction of Blackwell's Theorem, specifically applied to the comparison between an arbitrary experiment and the null (uninformative) experiment.

  Here is the detailed breakdown of that reduction, the specific logical direction involved, and a judgment on the relative fundamentality of the two results.

  ### 1. The Reduction: Good as a Special Case of Blackwell

  To verify your reduction, we must formalize the "no evidence" baseline in Blackwell's framework.

  **The Null Experiment:**
  In Blackwell's framework, an experiment is defined by a set of signals and a likelihood function $P(s|\theta)$. An uninformative experiment (the "no evidence" baseline) is one where the signal distribution is independent of the state of the world: $P(s|\theta) = P(s)$ for all $\theta$. Upon observing a signal from this experiment, the posterior belief remains identical to the prior.

  **The Garbling Relation:**
  Blackwell defines experiment $\mathcal{E}_1$ as more informative than $\mathcal{E}_2$ ($\mathcal{E}_1 \succeq_B \mathcal{E}_2$) if $\mathcal{E}_2$ can be generated by passing the output of $\mathcal{E}_1$ through a stochastic channel (a "garbling") that does not depend on $\theta$.

  Can any experiment $\mathcal{E}$ be garbled into the Null Experiment $\mathcal{E}_{null}$? **Yes.** The garbling strategy is simply to ignore the signal from $\mathcal{E}$ and output a random draw from the marginal signal distribution of $\mathcal{E}_{null}$. Since the output no longer depends on the input signal (and thus not on $\theta$), the resulting structure is statistically equivalent to $\mathcal{E}_{null}$.

  **The Implication:**
  Because $\mathcal{E}$ can be garbled into $\mathcal{E}_{null}$, Blackwell's ordering dictates that $\mathcal{E} \succeq_B \mathcal{E}_{null}$. By the definition of the Blackwell order, this implies that **every** decision maker (for any prior, utility function, and action space) weakly prefers $\mathcal{E}$ to $\mathcal{E}_{null}$.

  Since acting under $\mathcal{E}_{null}$ is mathematically equivalent to acting on the prior without observing data, the statement "Every agent prefers $\mathcal{E}$ to $\mathcal{E}_{null}$" is exactly Good's Theorem: "The expected utility of observing cost-free evidence is never lower than the expected utility of acting on the prior."

  ### 2. Which Half of Blackwell's Equivalence?

  Blackwell's Theorem is a biconditional statement relating three properties:
  1.  **Garbling:** $\mathcal{E}_2$ is a garbling of $\mathcal{E}_1$.
  2.  **Universal Preference:** All agents prefer $\mathcal{E}_1$ to $\mathcal{E}_2$.
  3.  **Convex Order:** The distribution of posteriors from $\mathcal{E}_1$ is a mean-preserving spread of the posteriors from $\mathcal{E}_2$.

  The theorem establishes $(1 \iff 2 \iff 3)$.

  Good's argument relies exclusively on the direction **$(1 \implies 2)$** (or equivalently $3 \implies 2$).
  *   **The Logic:** Good's proof constructs the value function $V(p) = \max_a E_p[U(a)]$, notes that it is convex, and applies Jensen's Inequality to the martingale property of Bayesian posteriors ($E[p_{post}] = p_{prior}$).
  *   **The Blackwell Connection:** This convexity argument is precisely the proof mechanism used to show that if one experiment is a garbling of another (or if one posterior distribution is a mean-preserving spread of the other), then expected utility must be higher.
  *   **The Unused Half:** Good's theorem does *not* require, nor does it prove, the converse direction $(2 \implies 1)$. Good does not need to show that if an agent prefers information, the experiment *must* be structurally richer (a non-garbling) than the null. He only needs to show that the structural richness (which exists by definition of it being an experiment) guarantees the preference.

  Therefore, Good's theorem implicitly uses the **"Easy Direction"** of Blackwell's equivalence (Garbling/Convexity $\implies$ Preference). It does not touch the **"Hard Direction"** (Preference $\implies$ Garbling), which requires deep results from convex geometry (separation theorems) to prove that the preference ordering is rich enough to fully characterize the information structure.

  ### 3. Fundamentalness: Structure vs. Norm

  You asked which result should be treated as more fundamental for understanding why gathering evidence is nearly always instrumentally rational.

  **Blackwell is Structurally Fundamental.**
  Blackwell's Theorem is the deeper mathematical truth. It characterizes the *geometry of information*. It tells us what "more information" actually *means* in a decision-theoretic context. It establishes that "information" is not a scalar quantity but a partial order defined by the ability to simulate one signal structure from another. Without Blackwell, we lack a rigorous definition of when one piece of evidence is "better" than another in a general sense.

  **Good is Normatively Fundamental.**
  However, for the specific philosophical question of *instrumental rationality* ("Why should I look at the data?"), Good's Theorem is the more salient tool.
  1.  **Specificity:** Blackwell's theorem is overkill for the question of "Something vs. Nothing." It solves the classification problem for *all* pairs of experiments. Good isolates the specific inequality required to justify the act of inquiry.
  2.  **Accessibility:** Good's proof (convexity of the max function) is self-contained and intelligible to a philosopher or economist without requiring the measure-theoretic machinery needed for the converse of Blackwell's theorem.
  3.  **The "Why":** Good's formulation highlights the *value of flexibility*. The gain in utility comes from the ability to match actions to states ($ \max_a $) *after* the uncertainty is resolved. This explains the mechanism of the value (option value) more directly than the abstract garbling relation.

  ### 4. Is Good's Theorem Genuinely Special?

  Mathematically, **no**. As you surmised, it is a trivial corollary of Blackwell (1951/1953) given that Good's paper appeared in 1967. Given that L.J. Savage (who was intimately familiar with Blackwell's work) was a contemporary and correspondent of Good, it is highly probable that Good was aware of the Blackwell result but chose to present a direct, simplified proof for the specific case of the value of information.

  However, Good's Theorem is **rhetorically and historically special**.
  *   **Crystallization:** Blackwell's work was situated in mathematical statistics (sufficiency, comparison of experiments). Good moved the result into the domain of **epistemology and rationality**. He transformed a statistical comparison theorem into a normative principle for agents ("The Principle of Total Evidence").
  *   **The Information Hazard Tension:** You noted the tension with "information hazards." Good's theorem resolves this tension by strictly bounding the claim to **ex-ante expected utility** with **cost-free** evidence.
      *   If evidence has a cost (e.g., psychological distress, existential risk from knowing a dangerous truth), Good's inequality becomes $E[U|E] - Cost \ge E[U|Null]$. If Cost is high, the inequality flips.
      *   If the hazard is ex-post (e.g., "I wish I hadn't learned that"), Good's theorem stands firm: you cannot *expect* to be worse off before you look, even if you might *feel* worse off after.
      *   Good's specific framing is what allows rationalists to dismiss "I don't want to know" arguments as time-inconsistent planning failures (unless actual costs are introduced), whereas Blackwell's framing is too abstract to easily apply to this normative debate.

  ### Summary Judgment

  Your reduction holds up perfectly. Good's Theorem is the application of the **Garbling $\implies$ Preference** direction of Blackwell's Theorem to the specific case where the less informative experiment is the **Null Experiment**.

  *   **Blackwell** provides the **ontology** of information (what it is and how structures relate).
  *   **Good** provides the **ethics** of information (why a rational agent ought to seek it).

  For understanding *why* gathering evidence is rational, Good's theorem is the more appropriate tool because it isolates the relevant inequality without the baggage of the partial order classification. However, one should acknowledge that the "engine" driving Good's result is the convexity property that Blackwell first rigorously contextualized within the comparison of experiments. Good is not mathematically novel, but it is philosophically distinct in its focus on the *value* of information rather than the *structure* of information.
