answer: |-
  Here are ten interview questions designed to maximize your 40-minute slot, moving quickly past the textbook definitions into the contentious philosophical and practical implications of Risk-Weighted Expected Utility (REU) theory.

  ### 1. The "EV Maximization" Moral Trump Card
  **Question:** In the EA-adjacent world that surrounded FTX, maximizing Expected Value wasn't just a strategy; it was often treated as a moral obligation. Your theory suggests risk-aversion is rationally permissible, not just a psychological bug. If REU is correct, does that mean SBF's core philosophical error wasn't that he was *too* risk-seeking, but that he mistakenly thought risk-neutrality was the *only* rational stance?
  **Follow-up:** If risk-neutrality is just one option among many, does REU give us the tools to criticize someone for being *excessively* risk-seeking, or does it ultimately say that as long as their risk function is consistent, even "casino-style" altruism is rationally kosher?

  ### 2. The Concrete Gamble (REU vs. Concave Utility)
  **Question:** I want to walk through a specific case to isolate the mechanism. Let's say I offer you a 50/50 gamble: win $110 or lose $100. A standard Expected Utility theorist explains rejecting this via diminishing marginal utility of money. An REU theorist explains it via the risk function downweighting the probability of the gain. Can you walk me through a second, larger-stakes gamble where those two explanations diverge? I want to see a scenario where a concave utility curve says "take the bet," but your risk function says "leave it."
  **Follow-up (The Rabin/Safra-Segal Challenge):** When you reject the small bet above, the standard EU theorist hits you with Matthew Rabin's calibration theorem: that level of small-stakes risk aversion implies you'd reject a 50/50 bet to lose $1,000 and win *anything*. You avoid this by separating risk from utility. But Safra and Segal have argued that calibration problems aren't unique to Expected Utility—that non-EU theories like yours can face similar explosion issues under certain conditions. Does Safra-Segal mean you haven't solved the calibration problem, you've just relocated it?

  ### 3. The Money Pump & Independence
  **Question:** The cost of entry for REU is dropping the Independence Axiom. The classic penalty for violating Independence is the money pump: if you prefer A over B, but prefer B+C over A+C, a clever trader can cycle you through those preferences and drain your wallet. If your theory licenses Allais-style preferences, aren't you licensing agents to be exploitable?
  **Follow-up (Resolute Choice):** I know the standard defense here is "resolute choice"—the idea that an agent can commit to a plan at time 1 and stick to it at time 2, even if their local preferences shift. But critics argue this doesn't *solve* the dynamic inconsistency; it just stipulates that the agent has the magical ability to ignore their own future preferences. Is resolute choice a psychological mechanism you're positing, or just a normative rule that says "don't get pumped" without explaining how?

  ### 4. Rationality vs. Bias (The Prospect Theory Problem)
  **Question:** To my readers, the math of your "risk function" is going to look suspiciously identical to the probability-weighting function in Kahneman and Tversky's Prospect Theory. They used that curve to describe a cognitive bias; you use it to describe a rational attitude. Since the equations are isomorphic, what is the actual substantive difference? Is the distinction just that you're prescribing it and they were describing it?
  **Follow-up:** If the math is the same, how do we empirically distinguish a "rational risk-averse agent" from a "biased agent suffering from probability weighting"? If I can't tell the difference from the outside, doesn't calling one "rational" and the other "biased" become a matter of labeling rather than observation?

  ### 5. The Source of the Risk Function
  **Question:** In Expected Utility, we derive utility from preferences over outcomes. In REU, we derive the risk function from preferences over gambles. But if my risk function is just defined by the choices I make, isn't the theory tautological? If I choose the risky bet, you say I have a risk-neutral function; if I choose the safe bet, I have a risk-averse function. How do you test the theory if the risk function is purely revealed by the very data it's supposed to explain?
  **Follow-up:** If I *say* I'm risk-neutral but consistently *act* risk-averse, which one gets to be the "real" me for the purposes of your theory? Do you privilege stated preference or revealed preference, and why?

  ### 6. Dynamic Consistency and Planning
  **Question:** REU agents can be dynamically inconsistent—their future self might want to deviate from what their past self planned. This seems to require a specific theory of agency, like "planning agency," to hold the self together over time. Does REU only work for agents who have the cognitive capacity to bind their future selves?
  **Follow-up:** If REU requires a sophisticated capacity for resolute choice to avoid money pumps, does that imply that less sophisticated agents (or organizations with high turnover, like a hedge fund) are *irrational* for using REU, even if the risk attitude itself is rational?

  ### 7. Moral vs. Prudential Risk
  **Question:** SBF treated risk attitudes as moral variables: taking high EV risks was "doing the most good." You treat risk attitudes as prudential variables: it's about how *I* relate to *my* outcomes. Does REU have anything to say about risk when the outcomes belong to *others*? Can I be morally required to be risk-neutral with other people's money, even if I'm rationally permitted to be risk-averse with my own?
  **Follow-up:** If I'm an EA fund manager, does REU force me to adopt a different risk function for donor money than I would for my own savings? If so, how do I determine what that function is without just smuggling Expected Utility back in?

  ### 8. Longtermism and Tiny Probabilities
  **Question:** A lot of Effective Altruism relies on longtermism: tiny probabilities of affecting vast numbers of future lives. Expected Utility handles this by multiplying tiny $p$ by huge $V$. REU downweights tiny probabilities via the risk function. Doesn't REU effectively kill the longtermist project by mathematically guaranteeing that low-probability, high-impact bets will always lose out to boring, near-term interventions?
  **Follow-up:** If REU undermines the mathematical case for longtermism, is that a bug or a feature? Are you comfortable if your theory shifts the center of gravity in EA away from existential risk and toward global health?

  ### 9. Interpersonal Comparisons
  **Question:** If two people agree on all probabilities and all outcome values, but have different risk functions, REU says they can rationally choose opposite options. But if we want to do social welfare calculations, we need to aggregate utility. How do we aggregate across different risk functions? Do we need a "social risk function"?
  **Follow-up:** If there is no objective way to compare risk functions interpersonally, does REU make social choice theory impossible? Are we stuck saying society can't be rational, only individuals can?

  ### 10. The Permissiveness Objection (Closer)
  **Question:** Here's the worry for my readers: If two agents agree on every probability and every dollar value of every outcome, but have different risk functions, your theory says they could rationally make the *opposite* choice on every single risky decision they'll ever face. One takes every gamble, one rejects every gamble. If "rationality" allows for that much variance, doesn't the concept lose its normative bite?
  **Follow-up:** If REU is this permissive, what work is it actually doing? If it can't tell me who's being irrational in a disagreement, is it just a sophisticated way of saying "to each their own"?
