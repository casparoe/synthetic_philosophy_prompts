answer: |-
  **Setting:** *A quiet café near the university, late evening. Two colleagues, ELIAS and SARAH, sit with empty coffee cups and a copy of* Anna Karenina *closed on the table between them. Both have red-rimmed eyes.*

  **Elias:** (Tapping the cover of the book) You know, I'm still not convinced we should call what happened back there "grief."

  **Sarah:** (Sighs, rubbing her temple) Elias, please. Not the metaphysics of tears right now. I just watched a woman throw herself under a train.

  **Elias:** And I watched you react to a sequence of ink marks on cellulose. Look, I'm not denying the experience. I felt the lump in my throat, too. But we need to be precise about what that lump was. It wasn't pity. Pity requires a belief in the existence of its object. You don't believe Anna exists. Therefore, you couldn't pity her.

  **Sarah:** That is the classic definition, and it's precisely where the definition is wrong. Peter Lamarque put this to bed decades ago. Belief is not a necessary condition for emotion. I can entertain the *thought* of Anna's suffering—the content of that thought—and that thought alone is sufficient to trigger the physiological and psychological state of pity.

  **Elias:** But it's "quasi-pity," Sarah. Think of it like the child playing at being scared by a monster under the bed. The adrenaline is real. The screaming is real. But the *fear* isn't, because the child knows, in some operational sense, that the monster isn't there. They are participating in a game of make-believe where the rule is "be scared." *Anna Karenina* is just a prop in our game. We are generating sensations of sadness because the rules of the fiction mandate that this is a sad moment.

  **Sarah:** That reduces the human experience of reading to following rules in a playground game. It feels reductive. When I read that passage, where she sees the candle flicker and then darkness, I wasn't thinking, "What is the appropriate move in this game of make-believe?" I was thinking, "She is in agony." The thought "She is in agony" caused my chest to tighten. The causality is direct.

  **Elias:** Is it? Let's press on the action. This is the real tell. If you genuinely pitied someone—if you felt actual grief for a dying woman—your body would prepare you to intervene. You'd feel an urge to call for help, to rush to the tracks, to alert a stationmaster. But you didn't. You turned the page. You sat there and let her die. Real pity has a motivational component. It demands action. Your inaction proves the emotion wasn't real.

  **Sarah:** That's a category error. You're conflating the *emotion* with the *response to the context of the emotion.* I didn't act not because I didn't feel pity, but because the thought I was entertaining included the context of its fictionality. I was thinking, "Anna is dying *in this story*."

  **Elias:** Ah, so you admit it! You add a qualifier. "In this story."

  **Sarah:** No, the qualifier doesn't negate the feeling; it explains the lack of action. Imagine you see a documentary about a famine. You feel genuine pity. But you don't necessarily get up and mail a check the second the credits roll. Does that mean your pity was fake? No. It means you are helpless, or overwhelmed, or that the emotion doesn't always translate immediately to motor function. With fiction, the helplessness is absolute. I *cannot* help Anna. Knowing I can't help doesn't mean I don't wish to. The desire to help—the ache of it—is the pity.

  **Elias:** But in the famine case, you believe the people exist. In Anna's case, you know she is a construct. If I tell you, "Your brother was in a car crash," you grieve. If I tell you, "Imagine your brother was in a car crash," you might feel a shudder, but you don't grieve. The difference is the doxastic commitment. The belief. Without it, you're just simulating the state of mind.

  **Sarah:** But the symptoms don't simulate, Elias. That's my pressure point against you. If I simulate grief, why are my lacrimal glands producing saline solution? If I simulate anxiety, why is my pulse elevating? Walton wants to say these are "quasi-sensations," but there's no such thing. A tear is a tear. A racing heart is a racing heart. If the output is biologically identical to real grief, on what grounds do you claim the internal state is different?

  **Elias:** Because the cause is different. In real life, the cause is a belief: "Something bad has happened." In fiction, the cause is a decision to imagine: "Pretend something bad has happened." The body is often fooled by the imagination. If I ask you to vividly imagine biting into a lemon, your mouth waters. Do you believe you are eating a lemon?

  **Sarah:** No.

  **Elias:** Yet you salivate. Is that real saliva?

  **Sarah:** Yes.

  **Elias:** So, a real physiological effect can be produced by a purely imaginative act without belief. Therefore, the fact that you cried doesn't prove you believed Anna existed. It just proves your imagination is vivid. The tears are compatible with make-believe. They don't prove genuine pity.

  **Sarah:** But with the lemon, you aren't feeling *sourness*. You're having a reflex. With Anna, I'm feeling a complex cognitive evaluation of loss, injustice, and waste. It's not a reflex like salivation. It's an evaluation. And here is where your theory gets sticky: If it's just a game of make-believe, why does it hurt?

  **Elias:** (Pauses) Hurt?

  **Sarah:** Yes. Make-believe is supposed to be fun. That's why we do it. But this wasn't fun. It was painful. If I'm just moving pieces around in a game, why did I feel a genuine sense of loss? If it's quasi-pity, it should feel like play. It didn't feel like play. It felt like mourning.

  **Elias:** Because the props are good! Tolstoy is a master prop-maker. He constructs the imagery so efficiently that the sensations generated are intense. But consider the cessation. When the book closes, the grief evaporates remarkably quickly. If you lost a friend, the grief persists. It haunts you. With Anna, you close the book, we walk out for coffee, and in twenty minutes we're discussing the plot structure of the Levine subplot. Real grief doesn't turn off that cleanly.

  **Sarah:** That's not the duration of the grief; that's the duration of the *stimulus*. Once I stop entertaining the thought, the emotion subsides. That's true of real life too. If I stop focusing on a tragedy I read in the newspaper, the acute pain fades, even if the belief remains.

  **Elias:** But you can't resume it at will. If you really pitied Anna, thinking about her now should renew the pain.

  **Sarah:** (Taps the book) Thinking about her now *does* renew the pain. I feel it right now.

  **Elias:** Do you? Or do you feel a memory of the pain?

  **Sarah:** What is the phenomenological difference?

  **Elias:** (Leans back) The difference is that you are safe. That's the core of the Waltonian view. We enjoy tragedy because we know we are safe. We can explore the sensation of pity without the cost of pity. If it were real grief, you wouldn't want to feel it. You'd want it to stop. But part of you wanted to keep reading, even though it hurt.

  **Sarah:** Because I wanted to understand her. Not because I wanted to suffer. Look, Elias, let's meet in the middle on the mechanism, but not the ontology. I agree that belief isn't doing the heavy lifting. But I disagree that the lack of belief makes the emotion fake.
  Think of it this way: Emotions are responses to *content*, not to *status*. The content of the thought is "A mother is separated from her child and crushed by a machine." That content is tragic. My mind reacts to the tragedy of the content. Whether that content corresponds to a concrete entity in spacetime is irrelevant to the emotional machinery. The machinery just processes the meaning.

  **Elias:** But if the machinery processes it as real, why doesn't it trigger the "real" protocols? Why no call to the police?

  **Sarah:** Because the machinery is modular. The part of my brain processing the semantic content triggers the emotion. The part of my brain processing the context ("This is a book") inhibits the motor action. Both are happening simultaneously. I feel real pity, but I also hold a real belief that action is impossible. There is no paradox. There is just complex cognition.

  **Elias:** You're describing a very specific kind of cognitive dissonance and calling it "genuine pity." I'm saying that because the belief condition is missing, the emotion is of a different logical type. It's like a stuntman falling. He screams, his heart races, he hits the ground. But he isn't "falling" in the sense of an accident. He is "stunt-falling." It looks like pity. It feels like pity. But it's "fiction-pity." It serves a different function. It allows us to practice empathy without risk.

  **Sarah:** But if I practice empathy, I am using real empathy. You can't practice swimming with "quasi-water." If I'm exercising my capacity for compassion, I am being compassionate. To say the emotion is fake because the object is fictional seems to privilege the object over the subject. And I care more about the subject. I care that *I* was moved. I care that my capacity for care was activated. Whether Anna exists matters less than the fact that my humanity responded to the *idea* of her.

  **Elias:** (Smiles faintly) And there we have it. You're arguing from the value of the response. I'm arguing from the logic of the proposition.

  **Sarah:** Because the logic of the proposition ignores the human reality of the reading.

  **Elias:** And the human reality ignores the logical incoherence of grieving for a ghost. But... (He gestures to his own eyes) ...I admit the ghost is a very effective prop.

  **Sarah:** (Laughs softly) And I admit the game is rigged. Tolstoy wins either way.

  **Elias:** Indeed. Shall we order another coffee?

  **Sarah:** Yes. But Elias?

  **Elias:** Yes?

  **Sarah:** If you spill it, I'm not going to pity you. I'm going to laugh. Just so you know the difference.

  **Elias:** (Grinning) Noted. Genuine laughter. I'll take it.
