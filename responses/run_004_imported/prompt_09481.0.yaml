      *   *Check:* Is Owen's Move 3 completely wrong? *No, it raises the "Quinean" skepticism about modal logic, but in this context, Nadia's reply is stronger.* I should nuance this. Owen is right that *classification* matters, but wrong that it makes the reasoning circular.
