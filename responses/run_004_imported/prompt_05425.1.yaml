answer: |-
  **Title:** The Map Before the Terrain: A Causal Rule for Simpson's Paradox

  **Introduction**

  You are right to be skeptical of the old rule of thumb. For thirty years, the dogma in clinical trials was "stratify to eliminate bias." It was a pragmatic heuristic born of necessity: if a variable is unevenly distributed between treatment arms, it *might* distort the result, so we control for it. In many cases, specifically when that variable was a baseline prognostic factor (a confounder), this worked beautifully.

  However, as you have discovered in Pearl's work, statistical association is not causal mechanism. Simpson's Paradox is not a statistical glitch; it is a signal that the causal structure of your data is being mishandled. When you stratify, you are not just "controlling" for a variable; you are surgically altering the causal pathways through which information flows. Sometimes this removes bias; other times, it manufactures it.

  You asked for a usable rule, not a philosophical shrug. Here it is:

  **The Usable Rule:**
  > **Do not stratify (adjust) based on the variable's name or its correlation with the outcome. Stratify only if the variable is a *Confounder* (a common cause of Treatment and Outcome). Do not stratify if the variable is a *Mediator* (on the causal path from Treatment to Outcome) when estimating Total Effect, and never stratify if the variable is a *Collider* (a common effect of Treatment and Outcome).**

  To apply this, you must stop thinking about data tables and start drawing Directed Acyclic Graphs (DAGs). You must ask: *What caused this variable?* and *What does this variable cause?*

  Below, I defend this rule using the causal taxonomy you mentioned, and then we will apply it to the Berkeley admissions case to resolve the apparent contradiction.

  ---

  ### 1. The Causal Taxonomy: Why Stratification Changes Reality

  In the language of causal inference, stratification is equivalent to "conditioning" on a variable. Conditioning blocks the flow of association along certain paths. Whether this is good or bad depends entirely on the topology of the path.

  #### A. The Confounder (The Fork)
  *Structure:* $X \leftarrow Z \rightarrow Y$
  *Example:* Disease Severity ($Z$) influences which Drug ($X$) a doctor prescribes (in an observational study) and also influences Recovery ($Y$).
  *Action:* **Stratify.**
  *Reasoning:* Here, $Z$ creates a "backdoor path" between $X$ and $Y$. There is a non-causal association flowing from Drug to Severity to Recovery. If you pool the data, you confuse the drug's efficacy with the severity of the patients. By stratifying (conditioning on $Z$), you block this backdoor path. You isolate the causal arrow $X \rightarrow Y$.
  *Verdict:* The old rule of thumb was correct here.

  #### B. The Mediator (The Chain)
  *Structure:* $X \rightarrow Z \rightarrow Y$
  *Example:* Drug ($X$) lowers Blood Pressure ($Z$), which prevents Stroke ($Y$).
  *Action:* **Do Not Stratify (for Total Effect).**
  *Reasoning:* If you want to know "Does the drug work?" (Total Effect), you must allow the effect to flow through Blood Pressure. If you stratify by Blood Pressure (e.g., comparing drug vs. placebo only among patients with *normal* BP), you block the very mechanism by which the drug saves lives. You will conclude the drug does nothing, because you have held the mechanism constant.
  *Verdict:* The old rule of thumb fails here. Stratifying hides the efficacy.
  *Exception:* If you want to know "Does the drug work *independent* of blood pressure?" (Direct Effect), then you *do* stratify. But you must admit you are no longer measuring the drug's real-world utility.

  #### C. The Collider (The Inverted Fork)
  *Structure:* $X \rightarrow Z \leftarrow Y$
  *Example:* Drug ($X$) causes Nausea ($Z$). Disease Severity ($Y$) causes Nausea ($Z$).
  *Action:* **Never Stratify.**
  *Reasoning:* $X$ and $Y$ are initially independent. However, $Z$ is a common effect. If you condition on $Z$ (e.g., you only analyze patients who reported Nausea), you induce a spurious correlation between $X$ and $Y$. This is "selection bias" or "Berkson's Paradox." By looking only at the sick people who got nauseous, you might find that those on the drug had milder disease (because the drug caused the nausea, not the disease), creating a fake protective effect.
  *Verdict:* The old rule of thumb is dangerous here. Stratifying creates bias where none existed.

  ---

  ### 2. The Berkeley Admissions Case: A Mediator Dispute

  The 1973 UC Berkeley gender bias case is the canonical example of Simpson's Paradox.
  *   **Pooled Data:** Men had a higher admission rate than women (suggesting bias against women).
  *   **Stratified Data (by Department):** In most departments, women had equal or higher admission rates than men (suggesting no bias).

  The university was exonerated based on the stratified numbers. The argument was that women applied to more competitive departments (like English) while men applied to less competitive ones (like Engineering). Department Choice was the lurking variable.

  **The Causal Map:**
  1.  **Gender** $\rightarrow$ **Department Choice**
  2.  **Department Choice** $\rightarrow$ **Admission** (Some depts have lower acceptance rates)
  3.  **Gender** $\rightarrow$ **Admission** (The potential direct bias)

  Here, **Department Choice is a Mediator**. It sits between Gender and Admission.
  $Gender \rightarrow Dept \rightarrow Admission$

  **The Fight:**
  The controversy persists because "discrimination" is ill-defined causally.
  *   **If you define discrimination as the *Total Effect* of Gender on Admission:** You must trust the **Pooled** numbers. The system, as a whole, resulted in lower admission for women. The fact that women were "steered" toward harder departments is part of the systemic bias. Stratifying by department "controls away" the societal pressure that guided women to those departments.
  *   **If you define discrimination as the *Direct Effect* of Gender on Admission:** You must trust the **Stratified** numbers. This asks: "If a man and a woman apply to the *same* department, are they treated differently?" If the answer is no, the department chairs are not biased.

  **Resolution:**
  Pearl argues that the stratified analysis was legally convenient but causally incomplete regarding the *experience* of the applicant. However, for a university administrator asking, "Are my department chairs biased?", stratification is the correct causal move. For a sociologist asking, "Is the university accessible to women?", pooling is the correct causal move.

  **The Lesson:** There is no single "truth" in Simpson's Paradox. There is only the truth relative to the causal question. The variable (Department) was a mediator. Adjusting for it answers the Direct Effect question. Ignoring it answers the Total Effect question. The old rule ("always stratify") implicitly assumed we always want the Direct Effect, which is false for policy decisions.

  ---

  ### 3. Applying the Rule to Your Clinical Trials

  Let's revisit your specific example: Drug A vs. Drug B, split by Site or Severity.

  #### Case 1: Severity (Baseline vs. Post-Baseline)
  *   **Scenario:** You split by disease severity.
  *   **If Severity is measured at Baseline:** It is likely a **Confounder**. Severity affects which drug the doctor picks (in observational data) or might be imbalanced by chance (in small RCTs), and it affects the outcome.
      *   *Action:* **Stratify.** (Trust the split-up numbers).
  *   **If Severity is measured Post-Treatment:** It is likely a **Mediator**. The drug improves severity, which improves survival.
      *   *Action:* **Pool.** (Trust the pooled numbers). If you stratify by post-treatment severity, you are comparing Drug A patients who responded well against Drug B patients who responded well, effectively cancelling out the drug's benefit.

  #### Case 2: Site (The Collider Trap)
  *   **Scenario:** You split by Clinical Site.
  *   **Structure:** Site characteristics influence which patients enroll ($Site \rightarrow Severity$). Site protocols might influence treatment assignment ($Site \rightarrow Drug$).
  *   **The Danger:** If patients self-select into sites based on severity (e.g., severe cases go to the academic center, mild cases to community clinics), and you condition on Site, you may open a collider path.
  *   **Action:** Generally, in a randomized trial, you **Pool** across sites to estimate the average treatment effect across the population. You only stratify by site if you suspect the *treatment mechanism itself* varies by site (effect modification) or if randomization was stratified by site and you need to recover the design efficiency. But if Site is a proxy for unmeasured patient selection, stratifying can induce bias.

  ### 4. The Practical Protocol for the Retired Expert

  You cannot run new trials, but you can audit the logic of the old ones (and the new literature). Here is your checklist:

  1.  **Draw the Arrows:** Before looking at the numbers, sketch the causal relationships. Where does the variable sit?
      *   Does it cause Treatment and Outcome? (**Confounder**)
      *   Does Treatment cause it, and it causes Outcome? (**Mediator**)
      *   Do Treatment and Outcome both cause it? (**Collider**)
  2.  **Define the Estimand:**
      *   Do you want the **Total Effect** (Real world utility)? -> Block backdoors (Confounders), leave pathways open (Mediators).
      *   Do you want the **Direct Effect** (Mechanism)? -> Block backdoors (Confounders), block pathways (Mediators).
  3.  **Execute:**
      *   **Confounder:** Adjust/Stratify.
      *   **Mediator:** Do not adjust (for Total Effect).
      *   **Collider:** Do not adjust (Ever).

  ### Conclusion

  The rule of thumb you used for thirty years ("trust the split-up numbers") was a heuristic for confounding. It assumed the lurking variable was always a common cause. Causal inference teaches us that lurking variables can be mechanisms (mediators) or selection artifacts (colliders).

  In the Berkeley case, adjusting for the mediator (Department) answered "Are the chairs biased?" but obscured "Is the system biased?" In your trials, adjusting for a post-baseline mediator (Severity) would have hidden the drug's true benefit.

  The usable rule is not "Pool vs. Stratify." The rule is: **"Map the causal structure, define the question (Total vs. Direct), and adjust only to block non-causal backdoor paths."** If the variable is a confounder, split the data. If it is a mediator or a collider, leave it be—or admit that by splitting it, you are answering a fundamentally different question.
