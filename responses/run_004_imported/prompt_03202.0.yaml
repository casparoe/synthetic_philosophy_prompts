      *   *Check:* Did I answer the specific question about whether it's contradictory? Yes, by showing it depends on which philosopher you ask.
      *   *Nuance:* Make sure to mention that even under MEC, soldiers can be war criminals if they violate *in bello* (kill civilians, torture). MEC isn't a "get out of jail free" card for *everything*, just for killing enemy combatants.

