answer: |-
  **SCENE START**

  **SETTING:**
  A dimly lit hallway outside the main conference room of a quantitative trading firm. The muffled hum of servers and the distant chatter of a trading floor bleed through the walls. 

  **CHARACTERS:**

  *   **ELENA:** 30s. Quantitative researcher. Precise, intense. A devotee of the Harsanyi Doctrine.
  *   **MARCUS:** 40s. Senior forecaster. Worn-in leather jacket over a dress shirt. A pragmatic subjectivist.

  **ACTION:**
  They stand facing each other. A contract lies on a small table between them. Both have their right hands extended, hovering inches apart, ready to seal a wager on a geopolitical event. 

  ELENA freezes. Her hand remains suspended.

  **ELENA**
  Wait.

  **MARCUS**
  (Without dropping his hand)
  The liquidity window closes in three minutes, Elena.

  **ELENA**
  If we shake on this, we're lying.

  **MARCUS**
  We're trading. I put down sixty percent. You put down forty. The market clears.

  **ELENA**
  (She lowers her hand slowly)
  Aumann says it can't happen. Not if we're both actually doing the math. If we share a common prior, and we know each other's posteriors, we can't agree to disagree. The very fact that I'm willing to take the "No" side tells you I have information you don't. So you should update. And if you update, you shouldn't bet.

  **MARCUS**
  (He finally drops his hand, shoving it into his pocket)
  Here we go. The No-Trade Theorem. Elena, we've been over this. The theorem holds *if* we share a common prior. I don't.

  **ELENA**
  Then you're admitting your prior is defective.

  **MARCUS**
  Defective? Or just mine?

  **ELENA**
  Rationality isn't a taste, Marcus. You don't get to choose a prior like you choose a tie. The prior is the baseline probability distribution of the universe before you opened your eyes. There's only one universe. There should be one prior.

  **MARCUS**
  (He leans against the wall, crossing his arms)
  Okay. Tell me what it is. Right now, before we look at any data. What is the objective, rational, Harsanyi-compliant prior probability that the Prime Minister resigns by Tuesday?

  **ELENA**
  It's... it's not about the specific number. It's about the derivation. We start from the same structural assumptions about how political instability propagates.

  **MARCUS**
  "Structural assumptions." That's just a polite word for "my intuition." Look, I've been forecasting for twenty years. I've seen smart people look at the same chart and see a head-and-shoulders pattern, while another sees noise. If you call one of them irrational, you're saying rationality is brittle. I say rationality is coherent updating. Where you start is personal.

  **ELENA**
  (Steps closer, voice tightening)
  If where I start is "personal," then I can believe anything. I can start with a prior that says gravity will reverse tomorrow. As long as I update coherently, you'd call me rational?

  **MARCUS**
  You'd be broke. The market would Dutch book you.

  **ELENA**
  Eventually. But until then, you're saying your "brute" prior is just as valid as mine? That there's no fact of the matter about how likely resignation was before we looked at the polling data?

  **MARCUS**
  I'm saying there's no *access* to that fact. You talk about the "Common Prior" like it's a physical object we both left in the locker room. But it's not. It's a counterfactual. What would you believe if you knew nothing? You can't answer that. You already know everything you know.

  **ELENA**
  That's an evasion. It's a modeling convenience you're treating as an ontological truth.

  **MARCUS**
  No, you're the one treating a model as truth. You think the Common Prior Doctrine is a law of physics. I think it's a useful fiction that breaks the moment two human beings actually talk. 

  **ELENA**
  (She picks up the contract, tapping it)
  If you're right, then this bet is just a clash of biases. It's not information discovery. It's two people shouting different prejudices at each other and hoping the world validates one.

  **MARCUS**
  And if *you're* right? If the Harsanyi Doctrine is the only rational stance? Then this bet is impossible. Because if we were truly rational, my willingness to bet would signal my private info to you, you'd update, the gap would close, and the trade would vanish. 

  (He pushes off the wall.)

  **MARCUS**
  So, Elena, look at me. The trade *exists*. The liquidity is real. So one of us is wrong about the nature of rationality. Which is the bigger sin? Assuming we have different starting points, or assuming a theorem that forbids the market we're standing in?

  **ELENA**
  (She looks at the paper, then at him)
  The sin is assuming the difference is fundamental. If you have a different prior, it's because you haven't accounted for the fact that *I* exist. 

  **MARCUS**
  Excuse me?

  **ELENA**
  If I am a rational agent, my beliefs are evidence to you. If you ignore my belief and stick to your "personal" prior, you aren't treating me as a mirror of the world. You're treating me as noise. 

  **MARCUS**
  I'm treating you as *you*. You have a different risk tolerance. A different model of causality. Maybe you weigh economic indicators heavier than social sentiment. That's not noise. That's perspective.

  **ELENA**
  It's bias disguised as perspective. 

  **MARCUS**
  (He steps in, pressing the point)
  Okay, turn it around. What grounds *your* prior? You say there's one true prior. Who calculated it? God? 

  **ELENA**
  It's the limit of learning. If we swapped all our data, lived each other's lives, we'd converge.

  **MARCUS**
  That's the asymptote. We aren't at the asymptote. We're here. And you're asking me to pretend we share a brain so we can satisfy a theorem that says we shouldn't be betting. 

  **ELENA**
  I'm asking you to admit that if we *were* perfect Bayesians, we wouldn't be shaking hands. We'd be pooling our data. 

  **MARCUS**
  But we can't pool the data. I can't give you the gut feeling I got from reading the transcripts. You can't give me the way your model weights the variance. We are compressing infinite complexity into a number. The difference in those numbers isn't just hidden info. It's hidden *structure*.

  **ELENA**
  (She pauses. Her certainty wavers, just for a second.)
  If structure differs, then one model is wrong. 

  **MARCUS**
  Or both are approximations. 

  **ELENA**
  (She looks at her hand, then extends it again, but slowly.)
  If I take this bet... I am implicitly accepting that your prior is a valid counterparty to mine. I am accepting that rationality allows for divergence.

  **MARCUS**
  (He looks at her hand, hesitant now too.)
  And if I take it... I'm accepting that your skepticism isn't just noise. I'm accepting that maybe, just maybe, the Common Prior isn't a fiction. That maybe I am missing something you see, and that's why the gap exists.

  **ELENA**
  So the bet isn't on the Prime Minister.

  **MARCUS**
  No. The bet is on whether Aumann was right about us.

  **ELENA**
  If he is, we shouldn't make it.

  **MARCUS**
  If he is, we can't make it. The fact that we *can*... suggests he isn't. Or we aren't.

  **ELENA**
  (Her hand hovers again)
  Then why are we doing it?

  **MARCUS**
  Because the only way to test the prior is to let the world hit it.

  **ELENA**
  (She stares at his hand. The tension is palpable, not just about the money, but about the definition of their minds.)
  If I shake, I'm betting that my information is better than yours.

  **MARCUS**
  If I shake, I'm betting that my perspective is as valid as yours.

  **ELENA**
  That's not rational.

  **MARCUS**
  It's human.

  **ACTION:**
  Elena stares at him. The hum of the servers seems to grow louder. She does not pull away, but she does not rush forward. She is calculating the cost of the handshake not in dollars, but in axioms.

  **ELENA**
  (A whisper)
  If we do this... don't tell me you updated.

  **MARCUS**
  Don't tell me you converged.

  **ACTION:**
  Elena closes the gap. Their hands clasp. It is firm, but neither holds on longer than necessary. They release instantly.

  **ELENA**
  See you at settlement.

  **MARCUS**
  See you.

  **ACTION:**
  Elena turns and walks quickly down the hall. Marcus watches her go, then looks at his own hand, flexing the fingers as if checking for a residue he can't see. He picks up the contract, but doesn't put it in his pocket immediately. He stares at the numbers.

  **FADE OUT.**

  **SCENE END**
