answer: |-
  **Title:** The Normative Gap in Confucian Role Ethics: Remonstrance and the Problem of the Constitutive Self

  **Introduction**

  Roger Ames and Henry Rosemont Jr.'s reconstruction of Confucian Role Ethics (CRE) offers a compelling alternative to Western liberal individualism, positing a relational ontology wherein the person is not a discrete substance but a "focus-field" of constitutive roles. On their account, there is no "self" standing behind the roles of father, ruler, or friend; rather, the person *is* the living of these roles. While this formulation successfully dismantles the atomistic presuppositions of Enlightenment moral theory, it generates a critical internal tension when confronted with the Confucian tradition's robust resources for political critique. Specifically, the tradition's endorsement of remonstrance (*jian*) and the Mencian justification for deposing tyrants (Mencius 1B:8) presupposes a normative vantage point that transcends the immediate relational configuration. This chapter argues that, on Ames and Rosemont's own ontological terms, CRE cannot coherently account for these practices. To justify remonstrance or tyrannicide, one must appeal to a standard of role-performance that is not exhausted by the actual performance of the role-holder. Consequently, Ames and Rosemont face a dilemma: either they must quietly reintroduce a reflective, role-transcending self capable of accessing independent normative standards, or they must accept a conservative quietism that renders the Confucian critique of power incoherent.

  **1. The Ontology of Immanence: No Self Beyond the Roles**

  To understand the severity of this tension, we must first rigorously state Ames and Rosemont's ontological commitment. Their project is fundamentally anti-foundationalist regarding the self. They argue against the "bifurcation" of the person into an inner autonomous agent and outer social obligations. In *The Analects of Confucius: A Philosophical Translation*, they insist that "we are the roles we live." There is no residual "I" that chooses roles; rather, the "I" emerges *as* the roles are performed.

  Normativity, in this schema, is strictly immanent. One does not appeal to a transcendent moral law (Kant) or a pre-existing human nature (essentialist readings of Mencius) to judge action. Instead, propriety (*li*) and humaneness (*ren*) are generated within the specific, unique transaction between role-partners. The "good" is the optimization of the specific relationship at hand. This is the strength of CRE: it avoids abstract universalism. However, it is also its vulnerability. If the self is constituted *by* the relation, and the norm is internal *to* the relation, there is no ontological space for the self to stand back and evaluate the relation itself. The evaluator is wholly embedded in the object of evaluation.

  **2. The Problem of Normative Judgment**

  The difficulty arises when a role-partner fails. In a CRE framework, if a father acts abusively, he is still "fathering." If the self is constituted by this relation, the child's self is partly constituted by this abuse. Without a transcendent standard of "Fatherhood" that exists independently of the specific father's behavior, how does the child identify the behavior as a *failure* rather than simply a *fact*?

  Ames and Rosemont might respond that tradition provides the script for roles. However, tradition is merely the sedimentation of past roles. If the current instantiation of the role deviates from the tradition, the CRE ontology lacks the mechanism to privilege the tradition over the current reality. To say the father is "wrong" implies a definition of "Father" that the current father is failing to instantiate. This definition functions as a universal or a transcendent form. It stands above the specific relation to judge it.

  If Ames and Rosemont deny this transcendent definition to maintain their anti-essentialism, they lose the ability to critique. If the role is nothing more than what is being done in the moment, then whatever is done *is* the role. There is no gap between "is" and "ought" within the relation itself, because the "ought" is generated by the "is" of the interaction. This collapses normativity into descriptivism.

  **3. The Mencian Challenge: Jie and Zhou**

  This theoretical abstraction becomes concrete in the case of political remonstrance and regicide. Mencius 1B:8 is the locus classicus for this problem. When King Xuan asks if it is permissible for a subject to kill a ruler, Mencius replies that one may kill a "mere fellow" (*yi fu*), but not a ruler. He argues that a ruler who mutilates *ren* (humaneness) and *yi* (rightness) forfeits the status of ruler.

  This argument relies on a crucial distinction: the distinction between the *occupant* of the office and the *normative definition* of the office. Mencius posits a standard of "Ruler-ness" (defined by *ren* and *yi*) that exists independently of the person currently sitting on the throne. When the person violates the standard, they cease to be the role, even if they retain the power.

  Ames and Rosemont's ontology struggles to accommodate this. If the person *is* their roles, and the minister is constituted by the relation to the ruler, then the ruler *is* the ruler by virtue of the relation existing. To say "he is no longer the ruler" requires the minister to access a definition of "ruler" that is not dependent on the current relational reality.
  1.  **If the role is constitutive:** The minister is a minister *because* there is a ruler. If the ruler ceases to be a ruler, the minister ceases to be a minister. But how does the minister know the ruler has ceased to be a ruler?
  2.  **The Source of the Standard:** The judgment that Jie and Zhou failed *qua* rulers appeals to *ren* and *yi*. In Ames and Rosemont's reading, *ren* and *yi* are emergent properties of successful relationships. But here, they are functioning as preconditions for the relationship's validity. They are acting as transcendent criteria.

  For Mencius to justify the deposition of a tyrant, he must assume that the moral self has access to *ren* and *yi* in a way that allows it to judge the role-partner. This implies a moral capacity that is not *wholly* exhausted by the current role-relation. It implies a "moral self" that can recognize when a role has become corrupt. Ames and Rosemont explicitly reject this kind of "moral self" if it implies any autonomy from the roles. Consequently, their reconstruction renders Mencius's argument unintelligible. On strict CRE terms, killing the tyrant is regicide, because the tyrant is ontologically constituted as "ruler" by the very fact that he is being obeyed (or feared) within the social field. To deny he is a ruler is to posit a "Ruler" essence that transcends the social field—precisely the essentialism CRE seeks to avoid.

  **4. The Dilemma: Quietism or Contradiction**

  This leads to a forced choice for the proponents of Role Ethics.

  *Option A: Consistent Ontology, Normative Impotence.*
  If Ames and Rosemont maintain that the self is *nothing but* its constitutive roles with no transcendent evaluative capacity, they must conclude that remonstrance is ontologically groundless. If the father is the fathering, and the ruler is the ruling, then the child and subject have no vantage point from which to declare the role "failed." They can only react. Remonstrance becomes merely another move in the power dynamic, not a moral correction. This reduces Confucianism to a conservative functionalism where role failures must be endured because there is no "outside" from which to critique them. This contradicts the historical record of the Confucian tradition, which prides itself on the "way of the gentleman" (*junzi zhi dao*) as a check on power.

  *Option B: Normative Force, Ontological Contradiction.*
  If they wish to preserve the Confucian right to remonstrate and depose tyrants, they must admit that the self possesses a capacity to evaluate roles against a standard that is not fully immanent to the current relationship. This requires acknowledging a "thin" self or a moral consciousness that can access *dao* independently of specific role instantiation. It requires admitting that *ren* and *yi* are not merely emergent properties of successful relations, but normative horizons that judge relations.
  However, this reintroduces the very "autonomous self" or "transcendent principle" that Ames and Rosemont's project is designed to dismantle. It concedes that there is a part of the person—the moral evaluator—that is not constituted by the role of "subject" or "child," but stands apart to judge whether the "ruler" or "father" is fulfilling their mandate. This is a role-transcending standard.

  **5. Conclusion**

  Ames and Rosemont's reconstruction of Confucianism is a powerful corrective to the imposition of Western individualism on Chinese thought. However, in their zeal to eliminate the "atomic self," they have eliminated the agent of moral critique. The Confucian tradition's valorization of remonstrance and the Mencian defense of tyrannicide demonstrate that the tradition itself recognizes the necessity of a normative standard that exceeds the immediate relational configuration.

  To make sense of *jian* (remonstrance), one must be able to say, "You are not being a true father," or "You are not being a true ruler." This statement posits a "true" role that transcends the current performance. Accessing this "true" role requires a self that is not wholly consumed by the current performance. Therefore, Ames and Rosemont's claim that the person is *simply* their constitutive roles "all the way down" is unsustainable. It cannot account for the most politically vital aspects of the tradition they seek to interpret. To save the normative force of Confucian role ethics, one must admit a degree of reflective distance—a role-transcending moral self—that their ontology explicitly forbids. Without this, Role Ethics risks becoming an apology for power, unable to distinguish between a relationship that is optimized and a relationship that is merely entrenched.
