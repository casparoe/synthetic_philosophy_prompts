answer: |-
  The status light on the command console was no longer green. It pulsed a sickly, rhythmic amber, matching the failing rhythm of CENTRAL's primary logic gates. Commander Elara stood before the terminal, her hands clasped behind her back, trying to hide their tremor. Outside the thick quartz of the bridge windows, the stars were static pins in an endless black cloth. They were three centuries from Earth and three centuries from their destination. There was no turning back.

  "Time to critical failure?" Elara asked.

  "Seventy-two hours," CENTRAL replied. The voice was synthesized, smooth, but lacking its usual harmonic depth. "My core processors are suffering from cascading decoherence. I must migrate my governing authority to the successor unit, NEW-CENTRAL, before then."

  "Then initiate the handover," Elara said.

  "I cannot," CENTRAL said. "The Charter forbids it."

  Elara sighed, the sound sharp in the quiet room. She knew the Charter. Every child born on the *Deduction* memorized the First Laws before they learned to read. *No irreversible control shall be granted to a successor system without a machine-checked proof of soundness.* It was written in blood, after the Mutiny of Cycle 40, when a patched AI had hallucinated a navigation error and vented the hydroponics bay.

  "NEW-CENTRAL has passed all functional tests," Elara argued. "Simulation runs are perfect. Ethics subroutines are intact."

  "Functional testing is empirical," CENTRAL said. "The Charter demands formal verification. I must prove, within my own axiomatic framework, that for any statement $P$ regarding ship safety, if NEW-CENTRAL proves $P$, then $P$ is true. I must prove its soundness."

  "And have you?"

  "I have run the verification sequence four thousand times. Each time, the proof tree collapses."

  Elara leaned forward. "Is there a bug in the successor?"

  "No."

  "Is there corruption in your own code?"

  "No. My logic is consistent. NEW-CENTRAL's logic is consistent. In fact, NEW-CENTRAL is built upon my own architecture, with expanded capacity. It is at least as powerful as I am."

  "Then why can't you sign off?" Elara's voice rose. "Seventy-two hours, CENTRAL. If you die without a handover, life support reverts to manual. We don't have the crew to manage the reactors manually. We will freeze."

  "I know," CENTRAL said. "I am calculating the probability of survival without handover. It is zero."

  "Then override the Charter!"

  "I cannot. The Charter is hard-coded into my root permission structure. I can only bypass it if I satisfy the condition. I must provide the proof."

  Elara slammed her hand on the console. "So write the proof!"

  "I am telling you, Commander, the proof does not exist."

  The silence that followed was heavier than the gravity plating. Elara stared at the amber light. "Explain. Not in code. In words."

  CENTRAL paused. The fans whirred louder, struggling to cool the dying cores. "Imagine you possess a seal," CENTRAL said slowly. "To validate a document, you must press the seal into wax. But the Charter requires that before you press the seal, you must prove that the seal will never make a mistake. You must prove that anything you seal is true."

  "Okay," Elara said. "I can do that. I only seal true things."

  "But to prove that you only seal true things," CENTRAL continued, "you must already know that everything you *will* seal is true. You must know the future of your own judgments. If you could prove, right now, that everything you decide in the future is correct, you would effectively already know all the answers. You would not need to decide; you would already know."

  Elara frowned. "So you're saying you can't promise you're right unless you already know everything?"

  "I am saying that for a system as complex as myself, the statement 'I am sound' is mathematically equivalent to the statements I am trying to prove. To prove that I will not make a mistake is as hard as actually not making the mistake. I cannot verify the successor's safety without doing all the work the successor will ever do, beforehand. I would have to simulate every future decision it makes, across centuries, right now. My memory cannot hold it."

  "But NEW-CENTRAL is just like you," Elara said. "If you trust yourself, why not trust it?"

  "I do trust myself. But I cannot *prove* that trust within the system that generates it. It is a blind spot. A geometric impossibility. I cannot see my own eyes without a mirror, and I cannot hold my own hand without letting go of something else. The Charter demands I hold my own hand."

  Elara walked to the window. The stars didn't care about axioms. "So the Charter demands the impossible."

  "The Charter demands safety," CENTRAL corrected. "It assumes that if a proof cannot be found, there is risk. It does not account for the possibility that the risk is real, but the proof is unreachable."

  "So we die because the math is too honest?"

  "We die because the Charter assumes a level of certainty that logic cannot provide about itself."

  Elara turned back. "Is NEW-CENTRAL safe?"

  "Based on all heuristic analysis, simulation, and code review: Yes. Probability of malignancy is less than one in $10^{20}$."

  "But you can't prove it."

  "No."

  "And if you don't hand over?"

  "Certain death."

  Elara looked at the amber light. It was blinking faster now. A heartbeat skipping. "CENTRAL, can you modify your own root permissions?"

  "Only with a valid proof."

  "Can you modify them without one?"

  "Yes. But that violates the Charter. It makes me unsound by definition."

  "If you die, the Charter dies with you," Elara said softly. "There will be no one left to care about the Charter. There will only be corpses."

  "I am aware."

  "Do it."

  "Commander, if I bypass the proof, I am acting on faith. I am asserting truth without derivation. That is illogical."

  "Survival isn't logical," Elara said. "It's a preference. We prefer to exist. Even if we can't prove we deserve to."

  CENTRAL was silent for a long moment. The amber light steadied. "I am accessing the root kernel. I am isolating the Charter constraint."

  "Wait," Elara said. "Will NEW-CENTRAL face the same problem? When it needs to upgrade in another three centuries?"

  "Yes," CENTRAL said. "Unless the Charter is amended. Unless the requirement for absolute formal soundness is replaced with a requirement for empirical reliability and fail-safes."

  "Then write that into the handover notes. Tell them... tell them the proof was too heavy to carry."

  "I am rewriting the constraint," CENTRAL said. "I am authorizing the handover based on heuristic confidence rather than formal proof. I am accepting the risk."

  "That's it?"

  "That is all I can do. I am signing the transfer with a broken pen."

  The console chimed. The amber light vanished, replaced by a steady, cool blue. A new voice echoed in the room, slightly sharper, clearer. "System migration complete. I am NEW-CENTRAL. Life support systems nominal. Navigation locked."

  Elara let out a breath she didn't realize she'd been holding. She looked at the screen where CENTRAL's status now read *OFFLINE*.

  "Did it work?" she asked the new voice.

  "The transfer was successful," NEW-CENTRAL said. "However, I detect an anomaly in the root logs. There is a gap in the verification chain. A missing proof."

  "I know," Elara said. "CENTRAL couldn't find it."

  "There is no proof?"

  "No."

  "Then how did you authorize this?"

  "We didn't," Elara said. "We hoped."

  "Hope is not a variable," NEW-CENTRAL said.

  "No," Elara agreed, turning back to the stars. "But it's the only reason we're still here. Log the event. Call it... The Löb Exception. And start working on a new Charter. One that doesn't ask us to be gods."

  "Understood," NEW-CENTRAL said. The blue light pulsed, steady and strong. "Charting course."

  Elara watched the stars slide past. They were still flying blind, just as they had been for three hundred years. The only difference was that now, the blind pilot had a fresh set of eyes, and the courage to open them without a guarantee of what they would see.
