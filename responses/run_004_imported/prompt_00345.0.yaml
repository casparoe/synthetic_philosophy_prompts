      *   *The Issue:* If $E$ is known *before* $H$ is proposed, then at the time $H$ is proposed, $P_{old}(E) = 1$.
      *   *The Math:* If $P_{old}(E) = 1$, then $P_{old}(E|H) = 1$ (usually). Thus $P_{new}(H) = \frac{1 \cdot P_{old}(H)}{1} = P_{old}(H)$.
