answer: |-
  It is genuinely satisfying to hear from someone with a bench background who has run headfirst into this wall. You are absolutely right to feel that something is off. If Bayesianism is supposed to be the logic of scientific inference, and it cannot account for the single most famous confirmation event in modern physics (Einstein and Mercury), then either Bayesianism is wrong, or our understanding of it is incomplete.

  The "Problem of Old Evidence" (POE) isn't just a technical divide-by-one error; it strikes at the distinction between **discovery** and **justification**, and it exposes a hidden, unrealistic assumption standard Bayesianism makes about human rationality.

  Here is the breakdown of why this is a deep conceptual crisis, and how Garber, Jeffrey, and others attempt to resolve it.

  ### 1. The Mathematical Deadlock
  You likely know the Bayesian updating rule better than most philosophers:
  $$P_{new}(H) = P_{old}(H|E) = \frac{P_{old}(E|H) \cdot P_{old}(H)}{P_{old}(E)}$$

  In the standard model, for evidence $E$ to confirm hypothesis $H$, the posterior $P(H|E)$ must be greater than the prior $P(H)$. This happens when the likelihood ratio pushes the probability up.

  **The Problem:**
  In the case of Mercury's perihelion:
  1.  The data ($E$) was known in 1859. By 1915, $P_{old}(E) = 1$. (It is a known fact).
  2.  If $E$ is certain, then $E$ is certain regardless of $H$. Therefore, $P_{old}(E|H) = 1$.
  3.  Plug those into the equation:
      $$P_{new}(H) = \frac{1 \cdot P_{old}(H)}{1} = P_{old}(H)$$

  **The Result:** The posterior equals the prior. General Relativity receives **zero** confirmatory boost from Mercury's orbit.

  To a bench chemist, this is absurd. Imagine you observe a strange precipitate in a reaction (Old Evidence). Ten years later, you propose a reaction mechanism (New Theory) that *necessitates* that precipitate. If your lab notebook follows standard Bayesian rules, you cannot claim that the old precipitate supports your new mechanism. But of course it does! That's how science works. We often find the explanation *after* we have the data.

  ### 2. Why This Is Deep, Not Just Technical
  If this were just a math quirk, we could tweak the formula. But the POE reveals a conflict between **Bayesian Logic** and **Human Cognition**.

  Standard Bayesianism assumes **Logical Omniscience**. It assumes that an agent immediately knows all the logical consequences of their hypotheses. If you believe $H$, and $H$ logically entails $E$, standard Bayes assumes you *already* knew $H$ entailed $E$ the moment you adopted $H$.

  But Einstein didn't know GR entailed the Mercury precession the moment he wrote down the field equations. He had to do the math. He had to *learn* the relationship between his theory and the old data.

  The POE shows that standard Bayesianism has no room for **learning logical relationships**. It only allows for **learning empirical data**. Since the empirical data was already known, the system freezes. The problem is deep because it suggests standard Bayesianism models a God who knows all logical truths instantly, not a scientist working at a bench.

  ### 3. The Garber Solution: Conditionalizing on Entailment
  Daniel Garber (1983) proposed the most famous workaround. His insight was that we aren't updating on the evidence $E$ (Mercury's orbit); we are updating on the **fact that the theory explains the evidence.**

  We introduce a new proposition, let's call it $K$: *"Hypothesis $H$ entails Evidence $E$."*

  *   **Standard Bayes:** Update on $E$. (Fails because $P(E)=1$).
  *   **Garber's Bayes:** Update on $K$.

  Even if $P(E) = 1$, it is not necessarily true that $P(H \text{ entails } E) = 1$. Before Einstein did the calculation, the scientific community was unsure if GR could actually account for the 43 arcseconds per century.

  So, the update looks like this:
  $$P_{new}(H) = P_{old}(H | H \vdash E)$$

  Because $P_{old}(H \vdash E) < 1$, learning that the entailment holds *does* shift the probability of $H$. You are treating the **explanatory connection** as the new information, not the raw data.

  **The Cost:** To make this work, you have to abandon Logical Omniscience. You have to allow a Bayesian agent to be uncertain about logical truths. This complicates the formalism significantly (you need a probability distribution over logical relationships), but it saves the intuition that explaining old data is confirmatory.

  ### 4. Jeffrey's Contribution: Uncertain Inference
  Richard Jeffrey approached this from a slightly different angle, often associated with "Jeffrey Conditionalization." While Garber focused on the entailment relation, Jeffrey focused on the rigidity of the evidence itself.

  Jeffrey argued that we rarely, if ever, encounter evidence where $P(E) = 1$ in a foundational sense. However, regarding Old Evidence, his key contribution aligns with Garber's: **The input to the update isn't the data, it's the shift in the explanatory structure.**

  Jeffrey's framework allows for updates where the "evidence" isn't a proposition becoming certain, but a shift in the probabilities of a partition of propositions. In the POE context, this supports the idea that the "event" triggering the update is the scientist's realization of the link between $H$ and $E$.

  Jeffrey and Garber essentially agree on the core fix: **We must expand the domain of what counts as "learnable."** It's not just "I looked in the telescope and saw Mercury." It's "I looked at my equations and saw Mercury."

  ### 5. A Chemistry Analogy for Your Intuition
  Since you're a chemist, consider this:

  You have a spectrum (NMR or IR) from five years ago ($E$). It has a weird peak you couldn't identify. You file it away. $P(E) = 1$ (you have the spectrum).
  Today, you propose a specific intermediate structure ($H$) for a reaction mechanism. You realize that if $H$ exists, it *must* produce that weird peak.

  *   **Standard Bayes:** "You already had the spectrum. This new idea changes nothing about the spectrum's probability. No confirmation."
  *   **Garber/Jeffrey Bayes:** "You did not know that $H$ predicted that peak. The new information is the *prediction*, not the *peak*. Your confidence in $H$ goes up because $H$ successfully organized old, chaotic data."

  ### 6. Is It Solved?
  Not entirely. Philosophers still debate this.
  *   **The Counterfactual Approach:** Some (like Colin Howson) argue we should pretend the evidence *wasn't* known. We calculate what our credence in $H$ *would have been* if we hadn't known $E$, and then update. (This feels fictional and subjective).
  *   **The Objective Bayesian Approach:** Some argue $P(E)$ is never truly 1 because data is always theory-laden and fallible. (This feels like dodging the bullet).

  The Garber/Jefferian approach is generally the most respected because it respects the actual psychology of discovery: **Science advances not just by gathering new data, but by seeing new relationships in old data.**

  ### Summary
  The Problem of Old Evidence is deep because it reveals that standard Bayesianism conflates **ontological certainty** (the fact is true) with **epistemic availability** (I know the fact follows from the theory).

  Garber and Jeffrey save the framework by arguing that the "news" isn't the data (which is old), but the **logical link** (which is new). For a bench scientist, this aligns perfectly with reality: the value of a theory often lies in its ability to make sense of the dusty data sitting in the back of the lab notebook, not just in predicting tomorrow's run.

  You stumbled onto one of the hardest problems in confirmation theory. If it bugs you, it's because your scientific intuition is working correctly, and the simplistic math was failing to capture it.
