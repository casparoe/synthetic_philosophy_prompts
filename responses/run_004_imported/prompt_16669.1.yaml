prompt: |-
  Ok, this is a weird combination but it's been stuck in my head so bear with me. I've been rereading Yudkowsky's old metaethics sequence (the original LW one, not any of the newer stuff) and got hung up again on "Created Already In Motion" -- the post right after "No Universally Compelling Arguments," where he argues a mind has to already be built caring about certain things, because no matter how good an argument is, it can't manufacture motivation out of nothing. Around the same time I fell down an unrelated rabbit hole into academic philosophy of action and ran into Bernard Williams' internal/external reasons paper from the late 70s, and it hit me that he's making basically the same move decades earlier in totally different vocabulary: his argument for internalism about reasons is that a "reason" only applies to an agent if there's a sound deliberative route to it from something already sitting in that agent's actual motivational set (he calls it your "subjective motivational set," S for short) -- because otherwise there'd be nothing to explain why it could ever move them to act.

  Here's the bit I can't untangle though. Williams has this famous example where a guy wants a gin and tonic and believes the glass in front of him contains one, but its actually full of petrol -- Williams says the guy does NOT have a real internal reason to drink it, despite being motivated to, because "sound" deliberation isn't allowed to run on false beliefs. So even Williams' internalism isn't just "whatever you currently happen to want," it already smuggles in some correction of the agent's psychology, as long as that correction is reachable via deliberation from where they already stand. Which is what made me think of coherent extrapolated volition -- the old proposal that a friendly AI should target something like what we'd want if we were more informed, more coherent, and more the people we'd endorse being, instead of our current stated preferences. CEV obviously does way, way more correcting than "oh wait, that's petrol, not gin" -- but it's still officially trying to stay tethered to actual human volition, not importing some free-floating moral standard from nowhere.

  So: on Williams' own terms, is CEV best understood as a (very ambitious) internal reasons view, or does the sheer amount of extrapolation it involves quietly turn it into the kind of external reasons view Williams thought was basically incoherent? And more generally, does "internal vs external reasons" even survive being stretched from "one guy and his drink" up to "extrapolating the volition of an entire species," or does the distinction just stop tracking anything useful at that scale? I brought this up at a meetup once and got a lot of polite nodding and zero actual answers, so I'm hoping you can do better -- I don't need a full literature review on Williams scholarship, I mainly want the actual structural parallel (or disanalogy) spelled out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Subject:** A comparison between Eliezer Yudkowsky's "Created Already In Motion" (Metaethics Sequence) / Coherent Extrapolated Volition (CEV) and Bernard Williams' "Internal and External Reasons" (1979).
      *   **User's Insight:** The user sees a structural parallel: both argue that motivation/reasons must stem from existing psychological states (no *ex nihilo* motivation).
      *   **The Tension:** Williams allows for "sound deliberation" to correct false beliefs (the gin/petrol example). CEV allows for *massive* extrapolation (more informed, coherent, etc.).
      *   **The Question:** Is CEV still an "internal reasons" view on Williams' terms, or does the scale of extrapolation make it "external"? Does the distinction break down at the scale of species-wide volition?
      *   **Constraints:** No full literature review needed. Focus on the structural parallel/disanalogy. Be direct and substantive (the user was disappointed by a meetup discussion).

  2.  **Deconstruct the Philosophical Positions:**

      *   **Bernard Williams (Internalism):**
          *   Thesis: $A$ has a reason to $\phi$ only if $A$ has some element in their subjective motivational set ($S$) that could lead to $\phi$ via sound deliberative route.
          *   Key Constraint: "Sound deliberation." This includes correcting factual errors (gin vs. petrol) and perhaps means-end reasoning.
          *   Limit: Williams is skeptical about *moral* reasons being internal if they don't link to existing desires. He rejects "external reasons" (reasons that exist regardless of the agent's $S$) as unintelligible/mysterious.
          *   Scope: Primarily individual action explanation.

      *   **Yudkowsky / CEV:**
          *   Thesis: AI should do what we *would* want if we knew more, thought faster, were more coherent, etc.
          *   Motivation Link: Grounded in human volition (our $S$), but extrapolated.
          *   Goal: Avoid "Do what I say" (current $S$) and "Do what is objectively right" (External).
          *   Scope: Normative guidance for AI alignment, aggregating across humanity.

      *   **Yudkowsky's "Created Already In Motion":**
          *   Thesis: Optimization pressure cannot create value from nothing. The goal function must be specified. A mind must care about *something* initially to start the chain.
          *   Parallel to Williams: You can't argue someone into caring unless they already care about truth/rationality/etc.

  3.  **Evaluate the Parallel (The "Is CEV Internal?" Question):**

      *   *Similarity:* Both reject Platonic moral facts that move agents without psychological hooks. Both require a causal/counterfactual link to the agent's actual psychology.
      *   *Difference (The Crux):* Williams' "sound deliberation" is usually interpreted narrowly (logic + true beliefs). CEV's "extrapolation" is much broader (coherence, emotional maturation, moral reflection).
      *   *The "Petrol" Case:* Williams says no reason to drink petrol because the belief is false. Correct the belief $\rightarrow$ reason disappears.
      *   *The CEV Case:* CEV says "You think you want X, but if you understood ethics better, you wouldn't."
      *   *Williams' likely reaction:* He might call CEV "external" if the extrapolation changes the *fundamental* elements of $S$ rather than just refining means or correcting facts. If CEV says "You want happiness, but actually you should want justice," Williams might balk. If CEV says "You want happiness, and justice is the best way to get it given full information," Williams might accept it.
      *   *However:* CEV explicitly tries to stay *internal* to the "human volume" of mindspace. It claims to be finding the *actual* desire, just obscured by noise.

  4.  **Evaluate the Scale Issue (Individual vs. Species):**

      *   Williams focuses on *individual* action explanation ("Why did John drink?").
      *   CEV focuses on *normative authority* for an AI ("What should the AI do?").
      *   Aggregation problem: Williams doesn't really talk about combining $S$-sets of multiple agents. CEV has to merge conflicting $S$-sets.
      *   Does the distinction break? The *logic* of internalism holds (must be grounded in *someone's* mind), but the *metaphysics* gets messy. Whose $S$? The "idealized observer" is a construct.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Acknowledge the insight:* It's a sharp catch. Yudkowsky and Williams are indeed fighting the same dragon (Humean Theory of Motivation vs. Rationalism).
      *   *Address the "Petrol" vs. "CEV" gap:* Williams allows factual correction. CEV allows *value* correction (via coherence). This is the danger zone.
      *   *Williams' Criterion:* For Williams, if the deliberative route changes the *ends* (not just means), it risks becoming external. CEV claims to clarify ends, but effectively might change them.
      *   *The "Created Already In Motion" angle:* This reinforces the Humean point. You need a starting push. CEV tries to find the "true" push buried under noise.
      *   *Verdict:* CEV is a **Radicalized Internalism**. It pushes the "internal" boundary as far as it can go without snapping into Externalism.
      *   *Scale:* The distinction doesn't break, but it becomes politically/normatively loaded. "Internal to whom?"

  6.  **Refining the Distinction (The "Sound Deliberation" Bottleneck):**

      *   Williams is vague on "sound deliberation." He admits it might include imagining situations vividly.
      *   Yudkowsky defines extrapolation explicitly (compute faster, know more, be more coherent).
      *   *Key Disanalogy:* Williams is descriptive/explanatory (what counts as a reason *now*). CEV is prescriptive/engineering (what counts as a target *for the AI*).
      *   *The Trap:* If CEV extrapolates so far that the resulting volition doesn't recognize the current volition as its ancestor, it becomes External. (The "Parent/Child" problem).

  7.  **Structuring the Response:**

      *   **Validation:** Confirm the user's intuition is correct and philosophically astute.
      *   **The Core Parallel:** Humean Theory of Motivation. Both reject normativity without psychological grip.
      *   **The Friction Point (Deliberation vs. Extrapolation):** Analyze the "gin/petrol" vs. "moral growth" gap. Williams is conservative; CEV is transformative.
      *   **The Verdict on CEV:** It's "Internalism on Steroids." It stays internal *in principle* but risks externalism *in practice* if the extrapolation distance is too great.
      *   **The Scale Problem:** Individual vs. Collective. Williams' framework struggles with aggregation. CEV solves this by positing a convergent "human" volition, which is a metaphysical gamble.
      *   **Conclusion:** The distinction survives, but CEV stretches the definition of "internal" to its breaking point.

  8.  **Self-Correction/Nuance Check:**
      *   *Did Williams say ends can't change?* He says they can change via deliberation (e.g., realizing you care about something you didn't know existed), but it must be traceable.
      *   *Is CEV external?* Only if the extrapolation function itself imports values (e.g., if "coherence" implies specific moral axioms).
      *   *Yudkowsky's specific view:* He explicitly argues against "moral facts" existing independently. So he *intends* CEV to be internal. The question is whether it *succeeds* on Williams' terms.
      *   *Tone:* Keep it analytical, respectful of the user's depth, avoid jargon overload.

  9.  **Final Polish:** Ensure the "Created Already In Motion" connection is woven in, not just tacked on. (It's the metaphysical grounding for the Internalist claim).

  **(Self-Correction during drafting):** I need to make sure I don't get bogged down in CEV technicalities. The user knows CEV. Focus on the Williams/Yudkowsky structural mapping. The key is the definition of "Sound Deliberation." Williams leaves it open but implies constraints. Yudkowsky expands it to "Idealized Reflection."

  Let's organize the answer into:
  1. The Shared Humean Core (Validation).
  2. The "Sound Deliberation" Bottleneck (The Gin vs. CEV problem).
  3. The Risk of "Externalism by Stealth" (Where CEV might fail Williams' test).
  4. The Scale Problem (Individual vs. Species).
  5. Final Synthesis.

