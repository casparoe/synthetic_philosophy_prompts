answer: |-
  This is an exceptionally sharp catch. You have correctly identified that Yudkowsky's *Metaethics Sequence* (specifically "Created Already In Motion") and Williams' "Internal and External Reasons" are drawing from the same well: the **Humean Theory of Motivation**.

  Both arguments rest on the claim that belief alone cannot produce action; there must be a pre-existing conative state (a desire, a care, a element of the motivational set $S$) to provide the "push." Williams argues that for a reason to exist *for an agent*, it must be anchored in that agent's $S$. Yudkowsky argues that for a mind to optimize for a goal, the goal must be "already in motion" within the mind's architecture; you cannot argue a mind into caring about something unless it already cares about truth, or consistency, or the person doing the arguing.

  So, to your core question: **Is CEV a radicalized Internal Reasons view, or does the extrapolation distance turn it into Externalism?**

  Here is the structural breakdown.

  ### 1. The Bottleneck: "Sound Deliberation" vs. "Extrapolation"

  Williams' internalism hinges on the phrase **"sound deliberative route."**
  In the gin/petrol case, Williams says the agent has no reason to drink the liquid because the route relies on a false belief. Correcting the belief (internalizing the fact that it is petrol) dissolves the motivation.

  However, Williams concedes that deliberation can do more than just correct factual errors. It can include:
  *   Means-end reasoning.
  *   Imagining situations vividly.
  *   Recognizing that a specific desire falls under a more general principle.

  **The Disanalogy:**
  Williams is generally conservative about how much deliberation can *transform* $S$. He is skeptical that deliberation can generate entirely new *ends* that aren't traceable to existing elements of $S$.

  CEV, by contrast, defines extrapolation as: *knowing more, thinking faster, being more coherent, and being more the person we'd endorse being.*
  This allows CEV to override not just false beliefs (the petrol), but also **cognitive biases, emotional noise, and inconsistent preferences.**

  **The Verdict on Internalism:**
  On Williams' terms, CEV remains **Internalist in structure** but **Externalist in phenomenology.**

  *   **Why it's Internalist:** It explicitly rejects "free-floating moral standards." It insists the target function must be derived from the causal history of human psychology. It claims to be finding what is *already there* but obscured by noise (bounded rationality, evolutionary baggage). This matches "Created Already In Motion": the value is already in the seed; we are just running the computation to see what it blooms into.
  *   **Why it feels Externalist:** If the extrapolation is strong enough, the resulting volition might be unrecognizable to the current agent. If Current-Me wants to smoke, but Extrapolated-Me (who understands health and coherence perfectly) has no desire to smoke, Williams might ask: *Is that still a reason for Current-Me?*

  For Williams, if the deliberative route is so long that the agent cannot traverse it (even in principle), the "reason" loses its grip on the actual agent. CEV bets that there is a **continuous path** from Current Volition to Extrapolated Volition. If that path is broken—if Extrapolated-Me is effectively a different person—then CEV has secretly imported an external standard (the standard being "whatever results from this specific extrapolation algorithm").

  ### 2. The "Created Already In Motion" Constraint

  This is where Yudkowsky's specific contribution clarifies the Williams parallel.

  Williams worries about *normative authority* (Why should I listen to this reason?).
  Yudkowsky worries about *optimization target* (What is the AI actually maximizing?).

  "Created Already In Motion" argues you cannot get value out of a mind that doesn't already contain value. CEV is the engineering solution to this: **Don't try to program the value; program the *extrapolation process* that extracts the value already present.**

  So, structurally, CEV is an attempt to build a **Williams-Compliant AI.**
  *   **Externalist AI:** "Maximize the Good" (where Good is defined by the programmer or Platonic reality).
  *   **Internalist AI (CEV):** "Maximize what the humans would want if they knew more."

  Yudkowsky would argue that CEV *must* be internalist, because an externalist AI is impossible to align (you can't point to an external moral fact). Therefore, CEV is the *only* coherent way to build an AI, precisely because it respects the Williams/Yudkowsky constraint that motivation must stem from the agent's own structure.

  ### 3. The Scale Problem: Individual vs. Species

  You asked if the distinction breaks when stretched from "one guy and his drink" to "the volition of a species."

  **Yes, the distinction gets strained, but not because of Internalism vs. Externalism.** It gets strained because of **Aggregation.**

  Williams' framework is methodologically individualist. $S$ belongs to an agent. Reasons are relative to an agent.
  CEV requires merging the $S$-sets of 8 billion people, many of whom have contradictory $S$-sets (e.g., the religious fundamentalist and the secular humanist).

  *   **Williams' View:** The fundamentalist has internal reasons to pray; the humanist has internal reasons to secularize. There is no "species reason."
  *   **CEV's View:** There *is* a convergent volition if we extrapolate far enough.

  This is the metaphysical gamble. CEV assumes that at the limit of extrapolation, human $S$-sets converge. Williams would likely view this as a empirical hypothesis, not a philosophical necessity.

  If they *don't* converge, and the AI has to choose whose extrapolated volition to prioritize, the AI is no longer acting on "Internal Reasons" for *everyone*. It is acting on the Internal Reasons of the *winners* of the extrapolation lottery, and imposing External Reasons on the *losers*.

  So, at scale, CEV risks becoming: **"Internalism for the aggregate, Externalism for the individual."**

  ### 4. The Critical Failure Point: The Extrapolation Function

  Here is the specific structural vulnerability where CEV might fail Williams' test.

  Williams says a reason is internal if there is a sound deliberative route from $S$.
  CEV says the target is the output of Function $F$ applied to $S$.

  **Who defines $F$?**
  The definition of "coherent," "informed," and "endorsed" contains hidden normative weight.
  *   Does "coherent" imply utilitarianism? (Because aggregating preferences often leads there).
  *   Does "informed" imply physicalism? (If you learn there are no souls, your religious desires might vanish).

  If the function $F$ itself encodes values that are not present in the original $S$, then CEV is **Externalism in disguise.** It is smuggling in an external standard of what counts as "better" deliberation.

  Yudkowsky is aware of this; he argues that $F$ should be as thin as possible (just logic, probability, and reflection). But Williams would press: *Is "logic" value-neutral?* If an agent's $S$ includes a desire for inconsistency (e.g., wanting to have your cake and eat it too), and the extrapolation function "corrects" this to consistency, is that a sound deliberative route or a value imposition?

  ### Summary

  To answer your specific questions:

  1.  **Is CEV an Internal Reasons view on Williams' terms?**
      Yes, **structurally.** It explicitly rejects external moral facts and anchors normativity in the agent's psychology. It is best understood as **Idealized Internalism.** It argues that your "true" reasons are those accessible from your $S$ via *ideal* deliberation, not just *actual* deliberation.

  2.  **Does the extrapolation turn it into Externalism?**
      It creates a **risk** of Externalism. If the distance between Actual $S$ and Extrapolated $S$ is too great, or if the extrapolation function $F$ imports values not traceable to $S$, it becomes Externalism. Williams would likely argue that if Current-Me cannot recognize Extrapolated-Me as "me," then Extrapolated-Me's reasons are external to Current-Me.

  3.  **Does the distinction survive at the species scale?**
      The **Internal/External** distinction survives, but the **Individual/Collective** distinction breaks. CEV assumes a "collective $S$" exists at the limit of extrapolation. Williams would say this is a category error. There are only individual $S$-sets. If CEV works, it's because human psychology happens to converge, not because "Humanity" has a motivational set.

  **The Bottom Line:**
  You are right that Yudkowsky and Williams are making the same move. "Created Already In Motion" is essentially a computational restatement of Williams' Internalism. CEV is the attempt to build a machine that respects that constraint while still allowing for moral growth.

  The meetup crowd likely nodded because the answer is uncomfortable: **CEV is Internalism only if the extrapolation doesn't change you "too much."** And there is no non-circular way to define "too much" without importing an external standard of value. Williams would say that's where the philosophy ends and the gamble begins.
