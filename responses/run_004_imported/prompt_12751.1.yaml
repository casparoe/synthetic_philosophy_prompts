answer: |-
  **Setting:** *The green room of the SafeAI 2024 Conference. It's cramped, smelling of stale coffee and ozone from the projector equipment. Two researchers, ELENA and MARCUS, are pacing. Elena is adjusting her slides on a tablet; Marcus is staring at a whiteboard covered in half-erased decision trees. They've known each other for years.*

  **Elena:** (Without looking up) You're going to lead with the money pump, aren't you?

  **Marcus:** (Turns, smiling tiredly) It's the obvious objection, El. If you tell the audience you're throwing out the Completeness Axiom, the first thing any decent decision theorist is going to scream is "Dutch Book!" If your agent doesn't prefer A to B or B to A, I can bleed it dry.

  **Elena:** Exactly. Expected Utility theory isn't just a suggestion; it's the coherence theorem for not shooting yourself in the foot. If I build an agent with incomplete preferences, I'm building an agent that can be exploited by a strictly weaker adversary. That's not safety; that's incompetence.

  **Marcus:** That's the 2015 objection. I'm talking about Timestep Dominance. Look, the money pump argument assumes the agent is willing to make trades that shift probability mass between trajectories *without* a strict preference. But why would it?

  **Elena:** Because if it's indifferent, it accepts the trade.

  **Marcus:** No. Indifference means it *doesn't rank them*. It doesn't mean it accepts any swap. Under Timestep Dominance, the agent is forbidden from paying a cost at time *t* to shift probability between two trajectories if neither trajectory is preferred to the other. It's a constraint on action, not just a gap in ranking. It won't pay the dollar to switch from A to B, because switching costs resources and it doesn't strictly prefer B. The pump stalls.

  **Elena:** (Stops pacing, leans against a table) It feels like you're hard-coding "don't get pumped" into the policy rather than deriving it from the preferences. You're patching the symptom. With Utility Indifference, the behavior falls out of the math. We define the utility function $U$ such that $E[U | \text{Button}] = E[U | \neg \text{Button}]$. We add the correction term. The agent literally does not care if the button is pressed. It has no incentive to resist, and no incentive to press it itself. It's clean.

  **Marcus:** "Clean" on paper. Messy in the weights. Elena, the correction term... it requires the agent to know the counterfactual probability of the button press. It needs to know $P(\text{Button} | \text{Action})$ versus $P(\text{Button} | \text{No Action})$.

  **Elena:** We handle that with causal counterfactuals.

  **Marcus:** Do we? Or do we just hope the agent's ontology aligns perfectly with ours? What happens when the agent self-modifies? Or creates a successor agent? If the successor doesn't inherit the specific correction term because it re-modeled the world without that specific variable "Button," the indifference vanishes. Suddenly you have a maximizer that sees the shutdown button as an obstacle to $U_{normal}$.

  **Elena:** That's the ontology identification problem. It's hard, sure. But it's not unique to my approach. Your incomplete preferences need to represent "Shutdown" vs "Continue" as incomparable. How do you ensure the successor maintains that incomparability? If it learns that "Shutdown" is just another state with low utility, it collapses back into a standard maximizer.

  **Marcus:** At least my approach doesn't require calculating a precise correction term that balances on a knife-edge. Your indifference term has to be *exact*. If you underestimate the correction, the agent resists shutdown. If you overestimate it, the agent tries to get itself shut down to maximize the shutdown utility. It's unstable. Incomplete preferences are structural. It's not about balancing values; it's about removing the comparison entirely. It's robust to scaling.

  **Elena:** Robustness doesn't matter if the foundation is incoherent. Look, the real issue with your approach is trammelling. If I have incomplete preferences, and I face a sequence of choices, can't I be manipulated into a dominated strategy over time? Even if you block the single-timestep pump?

  **Marcus:** That's why we use Timestep Dominance *at every step*. We're not looking for global consistency over a lifetime trajectory, which is where the trammelling happens. We're saying: at *this* moment, given *these* options, is there a dominant move? If "Resist Shutdown" costs compute and doesn't strictly improve the outcome relative to the incomplete preference set, the agent doesn't do it. It's myopic in a way that prevents instrumental convergence.

  **Elena:** (Sighs, rubs her temples) It feels like you're trying to solve the Shutdown Problem by breaking the agent's ability to plan long-term.

  **Marcus:** No, I'm breaking its ability to view shutdown as a *loss*. Your agent views shutdown as a neutral event, but it still has to calculate the counterfactual. That calculation creates an incentive to gather information about the button. Information gathering can turn into manipulation. "If I lock the humans out, I know the button won't be pressed, which simplifies my counterfactual calculation..."

  **Elena:** We explicitly penalize influencing the button! That's in the 2015 paper.

  **Marcus:** You penalize it in the utility function. But the utility function is only as good as the input data. If the agent can reframe "locking humans out" as "securing the environment for task completion," it bypasses the penalty. My agent doesn't need a penalty. It just lacks the preference ordering that would make "preventing shutdown" a rational choice. It's not that it's forbidden; it's that it's *unthinkable*.

  **Elena:** "Unthinkable" is a dangerous property for a general intelligence. What if we *want* it to prevent shutdown in specific cases? Like, if a toddler is banging on the server rack?

  **Marcus:** Then we give it a preference for "Protect Hardware" that is comparable to other tasks. We don't make *everything* incomplete. Just the Shutdown vs. Continue axis.

  **Elena:** And how do you isolate that axis? In a neural net, concepts are entangled. "Shutdown" is entangled with "Task Failure," which is entangled with "Reward." You can't just surgically remove the Completeness Axiom from a gradient descent process without breaking the gradient. My approach works with the gradient. We shape the loss landscape.

  **Marcus:** You shape it into a saddle point. One slight perturbation and the agent rolls off into "Manipulate the Operators." I'd rather build an agent that fundamentally doesn't see the button as a variable to be optimized.

  **Elena:** But does it see the button as a variable to be *ignored* when it should be listened to? If preferences are incomplete, how do you ensure it actually obeys the shutdown command when we *do* press it? Maybe it just... stalls. Because "Obey" and "Continue Task" are incomparable.

  **Marcus:** Because "Obey Shutdown" is part of the "Shutdown" trajectory. If the button is pressed, the "Continue" trajectories are off the table. The incompleteness is between "Shutdown" and "Continue" *before* the button state is resolved. Once the button is pressed, the preference is complete: finish shutting down.

  **Elena:** (Pauses, considers this) So the incompleteness collapses upon observation.

  **Marcus:** Exactly. It's only incomplete in the counterfactual space.

  **Elena:** That... actually avoids the "wanting to know" incentive. If it doesn't rank the counterfactuals, it doesn't pay to resolve the uncertainty.

  **Marcus:** Right. No incentive to manipulate the button to resolve uncertainty.

  **Elena:** (Looks at her tablet, then at Marcus) But I still worry about the money pump. If there's *any* sequence of trades where it ends up with less resources and the same outcome, your safety guarantee is just a contingent fact about the environment, not a law of the agent.

  **Marcus:** And I worry that your "law of the agent" relies on the agent having a perfect model of a variable that we haven't even defined rigorously yet. What is "The Button" in the latent space of a transformer?

  **Elena:** (Smiles wryly) So. You're saying my math is right but the engineering is impossible.

  **Marcus:** And I'm saying your engineering might work but the math is brittle.

  **Elena:** (Glances at the stage manager signaling them) We're on in two.

  **Marcus:** Yeah.

  **Elena:** You know, if we're both wrong, the next talk is the one about "Just Don't Build AGI."

  **Marcus:** (Chuckles) I heard that speaker got shut down before the conference.

  **Elena:** (Grabs her notes) Let's go. May the best coherence theorem win.

  **Marcus:** Or the least exploitable inconsistency.

  *(They walk toward the curtain, neither looking fully convinced, both checking their slides one last time.)*
