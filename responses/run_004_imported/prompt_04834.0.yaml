      *   *Idea 4: Guilt/Remorse.* Object: My past action. Reason: I broke a promise. (RKR).
      *   *Idea 5: The "Wrong Object" problem.* Sometimes a property belongs to the object, but it's not the *relevant* property for the specific attitude.
      *   *Idea 6: "Reasons of the Right Kind, but Wrong Source."*
      *   *Idea 7: The "Evidence" vs. "Constitutive" distinction.*

      *   *Focusing on the Constraint:* The reason must be *object-given*.
      *   *Case:* **Fear.**
