  ### The Strategic Benefactor: A Counterexample to the Object-Given Diagnosis

  The Parfitian diagnosis of the Wrong Kind of Reasons (WKR) problem relies on a binary distinction: reasons are either **State-Given** (grounded in the consequences of holding the attitude) or **Object-Given** (grounded in properties of the object of the attitude). Parfit and his followers argue that the Right Kind of Reasons (RKR)—those that determine fittingness and thus value—are exclusively Object-Given. The WKR (like the demon's threat) are State-Given.

  However, this distinction is too coarse. It fails to account for Object-Given Reasons that cite properties of the object which, while relevant to the attitude, do not constitute the *fittingness* of that attitude. To illustrate this, consider the following case involving **gratitude**.

  #### The Example: The Strategic Benefactor

  Imagine an agent, Alice, and a benefactor, Bob. Bob performs an action that confers a significant, life-saving benefit upon Alice. For example, Bob pays for a critical surgery that Alice cannot afford, saving her life.

  *   **The Attitude:** Gratitude.
  *   **The Object:** Bob (specifically, Bob's agency in performing the action).
  *   **The Reason:** "Bob's action saved Alice's life."

  Now, introduce a twist: Bob did not save Alice out of benevolence, friendship, or moral duty. Bob is a ruthless manipulator who saved Alice solely because he requires her specific skill set for a criminal enterprise he is planning; keeping her alive is purely instrumental to his own malicious ends. Bob feels no goodwill toward Alice; she is merely a tool.

  **Analysis of the Reason:**
  1.  **It is Object-Given:** The fact that "Bob's action saved Alice's life" is a property of Bob's action (the object of the attitude). It is not a fact about the *state* of Alice feeling gratitude (e.g., it is not "Feeling gratitude will make Bob stop manipulating you"). Therefore, by Parfit's lights, this should be a Right Kind of Reason.
  2.  **It is Intuitively the Wrong Kind:** Despite the benefit, it seems incorrect to say that Bob is *worthy of gratitude* in the moral sense required by Fitting-Attitude (FA) analyses of value. While Alice may feel *thankful* or *indebted*, the attitude of **gratitude** (which conceptually implies a recognition of goodwill or moral regard) is not *fitting*. The benefit provides a reason for a positive stance, but it is the **Wrong Kind of Reason** to make gratitude the *fitting* response. If FA analysis defines "Bob is good (in this respect)" as "It is fitting to feel gratitude toward Bob," the Object-Given reason ("He saved me") fails to establish that goodness.

  #### Why This Pressures the Parfitian Diagnosis

  This example demonstrates that the Object-Given/State-Given distinction is necessary but not sufficient for solving the WKR problem.

  **1. The Specificity Problem:**
  The Parfitian diagnosis assumes that if a reason cites a property of the object, it is automatically of the right kind for *any* attitude directed at that object. The Strategic Benefactor case shows that object-properties must be **conceptually specific** to the attitude in question. "Saving a life" is an object-property that supports *thankfulness* or *relief*, but it does not support *gratitude* absent the further property of *goodwill*. Since "saving a life" is Object-Given but fails to make gratitude fitting, we have an Object-Given WKR.

  **2. The Evidential vs. Constitutive Distinction:**
  The reason "Bob saved Alice" functions as **evidence** that Bob might be benevolent, or it creates a pragmatic pressure to reciprocate, but it is not **constitutive** of Bob's gratitude-worthiness. Parfit's distinction filters out State-Given reasons (like the demon's threat), but it fails to filter out Object-Given reasons that are merely incidental or evidential rather than value-constitutive.

  **3. Implications for FA Analysis:**
  If the FA theorist relies solely on the OGR/SGR distinction, they cannot explain why Alice's reason ("He saved me") does not make Bob admirable or gratitude-worthy. They must supplement the distinction with a further constraint: **Right Kind of Reasons are not just Object-Given, they must cite the *grounds of fittingness* for that specific attitude.**

  In the case of gratitude, the grounds of fittingness include *goodwill*, not just *benefit*. In the case of fear, the grounds include *danger*, not just *frightening appearance*. The WKR problem, therefore, cannot be solved merely by locating the source of the reason (object vs. state); it requires a substantive theory of which object-properties are **value-relevant**. The OGR/SGR distinction identifies the *location* of the reason, but it does not identify the *normative force* required for fittingness.

  ### Conclusion

  The Strategic Benefactor case shows that an agent can have a robust, Object-Given reason to adopt a positive attitude toward an object (because the object conferred a benefit) that is nevertheless the Wrong Kind of Reason for making that attitude *fitting* (because the object lacked goodwill). This reveals that the Parfitian diagnosis is incomplete. Solving the WKR problem requires not just distinguishing *where* a reason comes from (object vs. state), but distinguishing *how* it relates to the attitude's normative standards (constitutive vs. incidental). Without this refinement, the FA analysis risks counting manipulative benefactors as "good" simply because they provide Object-Given reasons for thankfulness, thereby collapsing the distinction between being beneficial and being worthy of moral regard.
