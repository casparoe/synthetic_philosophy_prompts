  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Metaethics, specifically the Wrong Kind of Reasons (WKR) problem for Fitting-Attitude (FA) analyses of value.
      *   **Standard View:** Parfit's distinction between Object-Given Reasons (OGR) and State-Given Reasons (SGR). OGRs are the "right kind" (about the object's properties), SGRs are the "wrong kind" (about the consequences of having the attitude).
      *   **Task:** Construct a counterexample to Parfit's diagnosis.
      *   **Constraints:**
          *   Not a variant of the Demon Case (threats/rewards for having the attitude).
          *   Not a Pascal's Wager-style case (pragmatic reasons for belief).
          *   Must involve a fitting attitude other than admiration (e.g., fear, contempt, gratitude, remorse).
          *   The reason must be *naturally object-given* (grounded in facts about the object) but still intuitively the *wrong kind* of reason for that attitude.
      *   **Goal:** Explain what this shows about the viability of the OGR/SGR distinction in solving the WKR problem.

  2.  **Deconstruct the OGR/SGR Distinction:**
      *   *Object-Given:* Reasons that cite properties of the object of the attitude. (e.g., "He is dangerous" is a reason to fear *him*.)
      *   *State-Given:* Reasons that cite properties of holding the attitude. (e.g., "Believing in God will make you happy" is a reason to *have the belief*, not a reason about God.)
      *   *The WKR Problem:* FA analysis says $X$ is good iff it is fitting to favor $X$. But there are reasons to favor $X$ that don't make $X$ good (e.g., the demon). Parfit says filter out SGRs, keep OGRs.
      *   *The Challenge:* Find a case where a reason looks OGR (about the object) but is still WKR (doesn't make the attitude fitting in the value-constituting sense).

  3.  **Brainstorming Counterexamples:**
