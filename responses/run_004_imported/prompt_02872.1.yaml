          *   Supervaluationism/Ockhamism aren't necessarily denying SR; they are modeling how *agency* and *deliberation* make sense within a temporal framework. If the future is fixed, deliberation is an illusion. Philosophy wants to save the *phenomenology* of choice.
      *   **Point 4: Quantum Mechanics and Indeterminism:**
