  Here is a option that targets the specific philosophical stakes (the Dualism, the need for a Moral Government, and the conflict between his methodology and his hopes):

  "Sidgwick's work with the Society for Psychical Research puts him in a unique position: he's the only rigorous skeptic in history who desperately *wanted* to be fooled. 

  He spent decades exposing fraudulent mediums and dismissing telepathy—the ultimate debunker. But he was the only debunker who *needed* the trick to work. Because if the ghosts *aren't* real, there's no 'moral government of the universe' to align self-interest with duty, the 'Dualism of Practical Reason' never resolves, and rational egoism wins. 

  So picture him at a séance: notebook out, exposing the medium's raps as fraud with one hand, while praying with the other, 'Please, for the sake of Utilitarianism, just let the table float. Otherwise, being moral is technically irrational.'"

  **Why this should land:**
  *   **The Setup:** It acknowledges his role as a skeptic/debunker (which many know superficially).
  *   **The Turn:** It highlights the *motivation* for the skepticism (the need for empirical proof of the afterlife to save ethics).
  *   **The Punchline:** It references the specific conclusion of *Methods* (Book III, Ch. V) that without the afterlife, the conflict between Egoism and Utilitarianism renders morality irrational from a practical reason standpoint.
