  The ATM hummed, a sterile green light blinking against the dust on Hitch's clothes. He held his card poised over the slot.

  "It's causally severed, Mark," Hitch said. "The ride is in the past. My pressing 'confirm' doesn't reach back across time and cause the driver to stop. It just subtracts one hundred dollars from my balance. For nothing."

  Mark leaned against the brick wall, arms crossed. "Parfit wouldn't dispute the causation. He'd dispute that *act-rationality* is the only game in town. You're evaluating the atomized action. You need to evaluate the disposition."

  "So I should cultivate a disposition that loses me money?"

  "You should cultivate a disposition that gets you out of the desert. The only way to get picked up was to be the kind of person who pays upon arrival. If you're the kind of person who recalculates at the ATM, you're the kind of person who gets left behind."

  Hitch pulled his hand back. "That's the algorithm objection. I'm not a bot executing code written yesterday. I'm me, here, now. Why should I be held hostage by what a hypothetical version of me needed to signal back there? I can just… deviate."

  "If you deviate, you prove you never had the disposition to begin with," Mark said. "You're treating your decision now as isolated. But the driver didn't pick up 'Current Hitch.' He picked up 'Hitch-as-a-whole.' By refusing, you're confirming you were never the passenger he thought he was. You're free-riding on a trait you don't possess."

  "This is question-begging," Hitch snapped. "You're labeling 'the disposition that gets rides' as rational and 'the act that saves money' as irrational. But by standard Self-Interest Theory, maximizing my current position is rational. You're just redefining the word to fit your conclusion. Why should I care about 'disposition-rationality' if it costs me cash in the actual world?"

  "Because act-rationality is self-defeating here," Mark said, pushing off the wall. "If you follow act-rationality strictly, you die in the dust. If you follow disposition-rationality, you live and you're down a hundred bucks. You're complaining that the theory which keeps you alive demands you do things the theory which kills you forbids. That's not a bug. It's the point."

  "So rationality requires irrationality?"

  "Rationality requires recognizing when act-by-act maximization fails. Parfit's point is that it can be straightforwardly rational to make yourself into someone who will, in the moment, do the thing that's irrational by direct lights. You want the benefit of the disposition without the cost of the acts. You can't have both."

  Hitch looked at the screen. The timeout was nearing. "It feels like a tax on being reflectively consistent."

  "It's a tax on being the kind of person who survives," Mark said. "Pay the tax."

  Hitch exhaled, a sharp sound through the dust. He pressed confirm. "I'm not convinced you're right. I'm just convinced I don't want to be the guy who proves you wrong."

  "Close enough," Mark said. "Next time, don't wait for the ATM to decide."
