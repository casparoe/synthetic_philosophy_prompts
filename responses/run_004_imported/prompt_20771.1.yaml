answer: |-
  You are describing a textbook example of the **sunk cost fallacy** playing out within a **war of attrition**. To answer your specific question: Yes, there is a rational point at which one of you should stop. In fact, from a strictly economic and decision-theory perspective, you likely passed that point long ago. The logic that keeps you going does not make the question unanswerable; rather, it is a cognitive bias that obscures the answer.

  Here is an analysis of your situation through the lens of rational decision-making, game theory, and legal economics.

  ### 1. The Sunk Cost Fallacy
  Your statement—"doing so would make everything already spent count for nothing"—is the definition of the sunk cost fallacy.
  *   **The Reality:** The money you have already spent is gone. It will not be returned whether you win, lose, or settle today.
  *   **The Rational View:** A rational decision is based entirely on **marginal analysis**. You must compare the *future* costs of continuing against the *expected future* benefits.
  *   **The Calculation:** If the potential payout is $X, and you have already spent $2X, and it will cost another $0.5X to get to judgment, you should only continue if the probability of winning multiplied by $X is greater than $0.5X. The initial $2X is irrelevant to this equation.

  ### 2. The War of Attrition
  You are engaged in a game theory scenario known as a "war of attrition." In this game, two parties compete for a prize by accumulating costs. The party that persists longer wins the prize, but both parties pay their accumulated costs regardless of the outcome.
  *   **The Trap:** In these scenarios, rational actors often continue bidding past the value of the prize because they hope the opponent will fold first.
  *   **The Mutual Destruction:** Since you suspect your opponent is reasoning the same way, you are in a deadlock where both sides are burning resources to prove a point, potentially resulting in a "Pyrrhic victory" where the winner recovers damages that are less than their total legal spend.

  ### 3. The Principal-Agent Problem
  You noted that neither lawyer shows an inclination to settle. This is a common structural issue in litigation known as the principal-agent problem.
  *   **Your Incentive:** To maximize net recovery (Damages minus Legal Fees).
  *   **Your Lawyer's Incentive:** To bill hours.
  *   **The Conflict:** A settlement today ends the billing. A trial next year continues the billing. Unless your lawyer is working on a pure contingency fee (where they only get paid if you win, and thus share your risk), their financial incentive is often aligned with *continuing* the litigation, not ending it.
  *   **The Opponent:** The same likely applies to the opposing counsel.

  ### 4. Is the Question Unanswerable?
  You asked if the logic makes the question unanswerable. It does not, but it requires you to change the variables you are weighing.
  *   **If this is purely financial:** The rational stopping point was when the *estimated remaining legal fees* exceeded the *probability-adjusted potential recovery*. Given that fees have already "dwarfed" the sum in question, you are currently spending good money to chase bad.
  *   **If this is about principle:** You are allowed to value "vindication" or "justice" as a commodity. However, you must price it honestly. Ask yourself: *"If I had not spent a dime yet, and someone offered me the chance to sue for this modest sum, but warned me it would cost $[Future Estimated Fees], would I do it?"* If the answer is no, then you are only continuing because of the past, not the future.

  ### 5. A Rational Path Forward
  To escape the trap, you must break the feedback loop.
  1.  **Ignore the Past:** Accept that the money spent is the cost of learning the truth, not an investment to be recouped.
  2.  **Assess Fee-Shifting:** Does your jurisdiction or contract allow for the recovery of attorney's fees? In the U.S. (the "American Rule"), each side usually pays their own fees unless specific statutes apply. If you cannot recover your legal fees from the loser, the financial math is almost certainly negative.
  3.  **Take Control from Counsel:** Lawyers are trained to fight, not to make business decisions. You must instruct your counsel that your goal is **net recovery**, not victory at any cost. Demand a settlement conference or mediation.
  4.  **Consider a "Nuisance" Settlement:** If both sides are trapped by sunk costs, a low-ball settlement (or even a mutual dismissal) might be the rational exit. It allows both parties to stop the bleeding.
  5.  **Evaluate the Opponent's Pain:** If the opponent is also spending more than the case is worth, they may be just as eager to exit but fear looking weak. A confidential settlement allows both parties to save face.

  ### Conclusion
  The logic that has kept you going is emotional, not rational. It is based on the fear of waste, yet continuing guarantees further waste.

  The rational point to stop is **now**, or at the moment where the cost of the next phase of litigation exceeds the likely recovery. Since you state the fees already dwarf the claim, you are effectively paying a premium for the privilege of staying in the fight. Unless the non-monetary value of vindication is worth more to you than the *future* legal bills required to achieve it, the rational move is to cut your losses, instruct your lawyer to seek an immediate settlement (even for a nominal amount), or discontinue the action.

  *Disclaimer: I am an AI, not an attorney. This analysis is based on economic theory and decision logic, not legal advice. You should consult with your legal counsel regarding the specific risks and procedural implications of your case.*
