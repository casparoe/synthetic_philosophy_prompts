      *   *Rational Stopping Point:* When the *expected marginal benefit* of continuing is less than the *marginal cost* of continuing.
      *   *Current State:* Since fees *already* dwarf the potential sum, unless the user expects to recover *legal fees* from the opponent (which depends on jurisdiction and contract), the pot of gold is likely smaller than the cost to get there.

