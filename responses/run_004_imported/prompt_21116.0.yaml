answer: |-
  First, a quick personal note: Please be kind to yourself regarding the train incident. The fact that you are wrestling with this months later suggests you *are* the kind of person who cares about helping; the "freeze" response is a documented physiological reaction to shock, not necessarily a moral failing. That said, that tension between who we think we are and what we actually *do* is exactly where the best philosophy lives.

  Here are 10 questions designed to prevent your guest from retreating into the standard "Situationists are attacking a strawman" defense without actually engaging the data. They move from the empirical challenges to the metaphysical implications, and finally to the practical/normative stakes.

  ### 1. The "Strawman" Defense
  **Question:** "The standard reply from virtue ethicists like Annas or Miller is that situationists are attacking a 'global' trait concept that no serious Aristotelian actually holds—that you've set up a caricature of virtue as robotic consistency. But if the 'real' Aristotelian trait is so sensitive to context that it doesn't manifest in the Milgram or Stanford Prison experiments, what explanatory work is the trait actually doing? If I can't predict your behavior based on your character, in what sense is the character *causing* the behavior?"

  **Follow-up:** "If the answer is that traits are 'probabilistic,' how low can that probability drop before it stops being a trait and starts just being noise? If I help 51% of the time, am I 'helpful,' or is 'helpful' just a label we're pasting on randomness?"

  ### 2. The Darley & Batson Study (Specific Empirical Challenge)
  **Question:** "I want to zoom in on the Darley & Batson 'Good Samaritan' study. You had seminary students, many of whom were literally on their way to give a talk on the Good Samaritan parable. The variable that predicted helping wasn't their religiosity or their moral reasoning; it was whether they were in a hurry. If a person cultivated for the priesthood can fail to help a dying man because of time pressure, doesn't that suggest situational variables don't just *influence* character, they *swamp* it?"

  **Follow-up:** "A common defense is that these students hadn't fully 'completed' their moral education. But if virtue ethics can't rely on character even in people explicitly trained in that moral tradition, at what point does the theory become unfalsifiable? Do we just say anyone who fails the test wasn't *truly* virtuous?"

  ### 3. Harman's Strong Claim (Bias vs. Weakness)
  **Question:** "John Doris and Gilbert Harman make two different claims. The weak claim is that traits exist but are fragile. The strong claim is that trait-attribution itself is a cognitive bias—the Fundamental Attribution Error. If the strong claim is right, then believing in 'character' is literally a mistake in social cognition. How do you defend the ontology of virtues if the very act of identifying them might be a psychological error?"

  **Follow-up:** "If we grant that we are cognitively biased toward seeing traits where there are none, doesn't that undermine the virtue ethicist's reliance on *phronesis* (practical wisdom)? How can we trust the *phronimos* to perceive the moral truth if their perception is structurally prone to this specific error?"

  ### 4. The CAPS Model (Redefinition?)
  **Question:** "Some defenders try to rescue traits using Mischel and Shoda's CAPS model (Cognitive-Affective Personality System), where behavior is an 'if-then' signature rather than a constant. This seems to save stability, but does it save *Aristotle*? If a 'virtue' is just a complex set of conditional triggers sensitive to environmental cues, haven't we quietly redefined 'character' into something a behaviorist would recognize, but an Aristotelian wouldn't?"

  **Follow-up:** "Aristotle thinks virtues are unified—that you can't have one without *phronesis*. The CAPS model suggests fragmentation, that I can be honest in context A and dishonest in context B. If we accept that fragmentation, do we have to abandon the idea of 'the good life' as a unified project?"

  ### 5. Moral Education and "Swamping"
  **Question:** "Let's talk moral education. If situational variables like noise, time pressure, or the presence of others swamp dispositional factors, what is the actual mechanism of moral improvement? Are we training the *person*, or are we just training them to engineer their *environment* to avoid triggering the bad responses?"

  **Follow-up:** "If the solution is 'avoid situations where you might fail,' isn't that a concession that the character itself isn't robust? It sounds less like cultivating courage and more like risk management."

  ### 6. Fragmentation and Local Traits
  **Question:** "John Doris suggests we should settle for 'local' traits—I'm honest-with-my-wife but dishonest-on-my-taxes. This fits the data better. But does this fragmentation destroy the normative force of virtue ethics? If my character is just a patchwork of context-specific habits, can I still be held responsible as a unified moral agent?"

  **Follow-up:** "If I'm a patchwork, and I fail in a specific context, can I legitimately say, 'That wasn't the *real* me'? Or does the situationist critique force us to accept that the 'real me' is exactly what I did in that moment, regardless of my history?"

  ### 7. The Mechanism of *Phronesis*
  **Question:** "You argue that *phronesis* allows the virtuous agent to navigate these situational pressures. But empirically, we rarely see people overriding these pressures. In the bystander effect, even people who know about the effect still freeze. What is the cognitive mechanism of *phronesis* that is supposed to punch through that automatic physiological freezing response?"

  **Follow-up:** "If the mechanism is 'slowing down and reflecting,' but the situation (like a train accident) demands split-second action, doesn't that admit that virtue is mostly useless in the exact moments we need it most?"

  ### 8. Normative vs. Descriptive
  **Question:** "Is virtue ethics a descriptive theory of human psychology or a normative theory of ideal agency? If it's normative, does the empirical data from Milgram or Darley & Batson actually matter? Or are you saying that humans *could* be this robust, even if currently we aren't?"

  **Follow-up:** "If it's purely normative and disconnected from actual human psychology, doesn't virtue ethics risk becoming a fantasy? An ethics that tells us to be beings we psychologically cannot be seems like it violates 'ought implies can.'"

  ### 9. Responsibility and Blame
  **Question:** "If Harman is right that traits are largely situational, it seems to undermine our practices of blame and praise. If I froze on that train platform because of situational pressure rather than a lack of character, am I less blameworthy? Does situationism force us to be more forgiving, or does it just make moral assessment impossible?"

  **Follow-up:** "If we stop blaming character and start blaming situations, do we lose the ability to hold people accountable? Or is that actually a feature, not a bug, of a more humane ethics?"

  ### 10. The Practical Takeaway
  **Question:** "For the listener who is worried that they aren't actually 'good,' just lucky that they haven't been in a bad situation yet: What is the takeaway? Should they stop trying to build character and start trying to build better environments? Is the moral imperative to fix ourselves or to fix the world we walk through?"

  **Follow-up:** "If the answer is 'both,' but we only have control over one, where should the bulk of our moral energy go? Is cultivating internal virtue a distraction from designing situations where good behavior is the default?"
