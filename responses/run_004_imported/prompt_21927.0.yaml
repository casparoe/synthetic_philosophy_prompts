      *   **Round 1: The Core Mechanism (SSA vs. SIA):**
          *   Sarah (Thirder) pushes SIA: You are more likely to exist in a world with more observers.
          *   Mark (Halfer) pushes back: That leads to the Presumptuous Philosopher. I stick to SSA: Sample from existing observers, don't weight by existence.
          *   *Correction:* Actually, standard Halferism often aligns with SSA *without* SIA, but Thirderism often aligns with SIA. However, there are Halfer views that aren't pure SSA (like centered worlds). Let's make Mark a "Centered Worlds Halfer" or SSA defender to keep it clean. Let's have Mark defend SSA explicitly because it links better to Doomsday.
      *   **Round 2: The Extreme Case (1 Million Awakenings):**
