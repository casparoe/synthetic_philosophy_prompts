  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I mix up SSA/SIA implications?
          *   SSA (Self-Sampling Assumption): Reason as if you are a random sample from the set of *actual* observers. Leads to Doomsday (if I exist early, total observers likely small). Supports Halferism in SB (sample from Heads/Tails observers, but Heads has 1, Tails has 2... wait. SSA usually leads to Halferism *if* the reference class is "awakenings". If reference class is "people", it gets messy. Let's clarify: Standard Halferism often uses SSA *without* SIA. Standard Thirderism often uses SIA).
          *   Actually, the standard mapping is:
              *   Thirder $\approx$ SIA (Self-Indication Assumption). SIA says: P(World) $\propto$ P(Physical) $\times$ Number of Observers.
              *   Halfer $\approx$ SSA (Self-Sampling Assumption) *without* SIA update. SSA says: P(World) $\propto$ P(Physical). You sample from observers *within* the world.
          *   *Correction on Doomsday:* SSA *implies* Doomsday. SIA *counteracts* Doomsday.
