  *(Self-Correction during drafting the dialogue)*: I need to be careful with the SSA/Doomsday link. SSA *generates* the Doomsday Argument. SIA *blocks* it. So the Halfer (SSA) should admit Doomsday works. The Thirder (SIA) should say that's a feature, not a bug. Conversely, SIA generates the Presumptuous Philosopher. Halfer should throw that in Thirder's face.

