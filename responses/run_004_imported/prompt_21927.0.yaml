  2.  **Character Conception:**
      *   **Halfer (let's call him Mark):** Likely leans towards SSA or a specific centered-worlds view. Worried about "presumptuous" conclusions. Values the physical chance of the coin over the indexical frequency.
      *   **Thirder (let's call her Sarah):** Likely leans towards SIA or a frequency-based centered-worlds view. Worried about "Doomsday" style errors. Values the experiential frequency.
