      *   **Kavka's Toxin Puzzle:** Billionaire offers money *tonight* if you *intend* to drink toxin *tomorrow*. You get the money tonight. Tomorrow you decide whether to drink.
      *   **The User's Solution:** "Intend tonight, don't drink tomorrow."
