      *   **Explain Carroll (Thought Theory):** Summarize briefly. Apply to the writer. *Key point:* You entertained the thought vividly. Emotion is real. This aligns better with the physical sensation.
      *   **The "Creator" Twist:** This is the crux.
          *   Does creation break Walton? Not necessarily, but it blurs the line of "prop." The author generates the prop.
