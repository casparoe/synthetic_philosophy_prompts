      *   *Is the distinction between "widespread" and "existent" clear?* Schellenberg's formal argument usually says "there is non-resistant nonbelief," not necessarily "the majority are nonbelievers." The user thinks the argument relies on a *majority* of nonbelievers. I need to correct that.

