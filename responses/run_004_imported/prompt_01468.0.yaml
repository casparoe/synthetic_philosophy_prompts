answer: |-
  The bar in the Hay-Adams was nearly empty, the kind of quiet that only exists in D.C. after 1:00 AM. Elias sat in a leather wingback, nursing a scotch that had gone warm. Mara sat opposite him, still wearing her conference badge, tapping a stylus against a tablet she wasn't really reading.

  They had been the last two people to leave the seminar room, arguing over the handout: a photocopy of von Neumann's 1955 *Fortune* essay.

  "You're smiling," Elias said, gesturing to her tablet. "That usually means you think you've found the flaw in the armor."

  "I'm smiling because it's tragic," Mara said, looking up. "Von Neumann was a genius. He invented game theory. He understood optimization better than anyone who has ever lived. And yet, reading this... it feels like watching a brilliant man describe how to steer a ship after the rudder has already been ripped off."

  "He didn't think the rudder was ripped off," Elias said, taking a sip. "He thought the ocean had just gotten smaller. That's the point. For two centuries, industrial disruption was absorbed by expansion. New tech creates chaos? Move west. Colonize. Open new markets. By 1955, he saw the walls closing in. Nukes above, climate below. No more room to absorb the shock."

  "And his solution was *this*?" Mara tapped the screen. "'Day-to-day opportunistic measures.' 'A long sequence of small, correct decisions.' Elias, that's a recipe for extinction. It's a muddle-through strategy for a world that doesn't allow for muddling."

  "It's the only strategy that exists," Elias countered, leaning forward. "Look at his argument against bans. He says useful and harmful applications are too entangled. You can't ban the bomb without banning the energy. And crucially, any authority capable of enforcing a ban worldwide would have to possess the very global coordination it's supposed to create. It's a category error. You're demanding a solution that presupposes the problem is already solved."

  "I'm demanding a solution that acknowledges the stakes have changed," Mara said, her voice tightening. "Von Neumann was worried about war. About climate. Terrible things, yes. Recoverable things. If the U.S. and USSR had a skirmish, it was horrific, but history continued. If we get advanced AI wrong, there is no 'day-to-day' after the mistake. There is no sequence of decisions. There is only the decision, and then silence."

  She leaned in, matching his posture. "Von Neumann's logic relies on feedback loops. You make a small decision, you see the result, you correct. But if the first wrong decision is terminal, the feedback loop is broken. You don't get to learn from the error. That makes 'opportunistic measures' not just optimistic, but mathematically unsound."

  Elias swirled his glass. "So you propose what? A global treaty? A hard pause?"

  "I propose binding, precautionary coordination. Even if it's messy. Even if it's costly. You lock down the compute. You internationalize the training runs. You treat high-risk AI like fissile material, not like a software update."

  "And who enforces that?" Elias asked softly. "Von Neumann's ghost is sitting right here at the table, Mara. He'd ask you: Who holds the gun to the United States? To China? To the private lab in a jurisdiction that doesn't care? To enforce that coordination, you need a hegemon or a world government. If you had a world government, you wouldn't need the AI treaty. If you don't have one, you can't build it fast enough to catch this technology."

  "We built the IAEA," Mara shot back. "We built the Non-Proliferation Treaty. It wasn't perfect, but it created friction. It slowed things down."

  "Because the great powers wanted it to," Elias said. "When they didn't, they ignored it. Von Neumann knew this. He was on the Atomic Energy Commission while dying of cancer. He saw the machinery up close. He knew that safety comes from 'individual judgment, adaptability, and patience.' Not because those are noble virtues, but because they are the *only* levers actually attached to the machine. The rest is wishful thinking."

  "Wishful thinking saves lives," Mara said. "Pragmatism gets you a slow march to the cliff. You're treating Von Neumann's diagnosis as a law of physics. It wasn't. It was a political assessment of 1955. He assumed political fragmentation is a constant. I'm arguing that if the technology is dangerous enough, the cost of *not* solving the coordination problem is higher than the cost of trying. You accept the risk of authoritarian overreach to avoid the certainty of oblivion."

  Elias paused. He looked at the ice in his glass, watching it melt. For a moment, the confidence in his eyes flickered.

  "Here is where I lose sleep," Elias admitted, his voice quieter. "Von Neumann talks about 'small, correct decisions.' But he assumes the humans making them have time to think. If AI accelerates the pace of conflict or economic disruption to machine speed... then 'day-to-day' is too slow. 'Year-to-year' is a lifetime. If the environment changes faster than human judgment can process it, then his 'opportunistic measures' fail. Not because the logic is wrong, but because the bandwidth is insufficient. I'll grant you that. If the OODA loop closes faster than we can blink, pragmatism becomes paralysis."

  Mara nodded slowly. "Okay. That's something. But you have to grant me this: Your side assumes that coordination attempts are inherently destabilizing. You assume that trying to bind the technology will cause the very conflict we're trying to avoid."

  "I do," Elias said. "Because scarcity creates conflict. If you say 'only three countries can have this,' the other seven will fight to get in."

  "But what if the alternative is worse?" Mara pressed. "Here is my weakness, Elias. I know it. If we try to enforce a hard pause or a global compute cap, and we fail... if we try to build this enforcement mechanism and it fractures the geopolitical order... we might trigger the war we're trying to prevent. We might create a world government that is tyrannical, or we might cause a kinetic conflict over who gets to define 'safety.' Von Neumann would say I'm gambling the present on a hypothetical future."

  "Exactly," Elias said. "He would say you are introducing a new, certain risk (political fracture) to mitigate a probabilistic one (AI risk)."

  "But the probability isn't low!" Mara insisted, though her energy had dipped. "That's the variable you're minimizing. If the probability of extinction is non-negligible, then 'political fracture' is a price worth paying. Von Neumann was dying. Maybe he just couldn't conceive of a risk that outweighed the chaos of trying to stop it. He was a man of the state. He believed the state had to continue."

  "He believed the state was all there was," Elias corrected. "And he was right that without it, there's no one left to do the saving. But look, Mara. Even if I accept your premise—that this risk is unique and unrecoverable—how do you solve the coordination problem without the coordination capacity? You say 'lock down the compute.' That requires monitoring. That requires intrusion. Who watches the watchers? If you build an agency with the power to shut down the world's servers, you have built the very singularity Von Neumann feared, just made of bureaucracy instead of code."

  Mara sighed, finally picking up her water glass. She looked tired. "I don't have a clean answer for the enforcement mechanism. I'll give you that. It's the hole in the bucket. But leaving the bucket open because you can't patch the hole seems insane when the water is rising."

  "And patching it might drown us faster," Elias said.

  They sat in silence for a moment, the hum of the hotel's refrigeration unit filling the gap.

  "Von Neumann wrote this while he was rotting from the inside," Elias said eventually. "Cancer. He knew his own time was running out. Maybe that's why he settled on 'patience.' Not because he thought it was easy, but because he knew he wouldn't be around to see if it worked. He was handing the baton to a future he wouldn't inhabit."

  "And maybe that's why he was wrong," Mara said, capping her pen. "He was ready to die. We aren't. We have to live with the consequences. If 'patience' means letting the dice roll, then I'd rather be accused of naivety for trying to stop the roll. Even if my hands get cut."

  Elias raised his glass, a small, wry smile touching his lips. "To naive hands, then."

  "To patient ghosts," Mara replied, clinking her water glass against his scotch.

  Neither of them drank immediately. They just held the glasses there, suspended in the dim light, the toast hanging between them like a question neither knew how to answer.
