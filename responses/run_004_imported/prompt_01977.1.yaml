          *   He wasn't using formal logic. He was using an *inductive* model.
          *   It's based on *memory* and *experience*, not propositional knowledge.
          *   The "premises" are not conscious beliefs (like "the earth rotates"), but sensory associations built up over a lifetime (e.g., "retinal displacement usually means object motion").
      *   *The Sunset Example:* Why does knowledge not override it? Because the unconscious inference operates on *sensory data* + *past sensory regularities*, not on *scientific facts*. The "premise" is "objects that move across the retina are moving," not "celestial mechanics."
      *   *Key Distinction:* *Judgment* (Urteil) vs. *Sensation* (Empfindung). Helmholtz places perception closer to a rapid, automatic judgment based on sensory signs, not a deliberative syllogism.

  3.  **Address the "Inference" vs. "Causal Mechanism" Debate:**
