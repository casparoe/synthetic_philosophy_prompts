  3.  **Deconstruct Kant's Argument:**
      *   *Source:* *Critique of Practical Reason* (Second Critique).
      *   *Premise 1:* The Moral Law commands the *Summum Bonum* (Highest Good) – the union of virtue and happiness, but specifically here, perfect virtue (holiness).
      *   *Premise 2:* "Ought implies Can." If we are obligated to achieve X, X must be possible.
      *   *Premise 3:* Finite rational beings cannot achieve perfect virtue (holiness) in a finite time.
      *   *Conclusion:* Practical Reason must *postulate* an infinite progression (immortality) to make the Moral Law non-contradictory.
