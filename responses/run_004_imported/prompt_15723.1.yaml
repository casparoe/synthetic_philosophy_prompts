answer: |-
  You are right to pause before committing to that structure. Your intuition that something feels "flattened" about the compartmentalized approach is historically and philosophically sound. While the image of the rigorous logician by day and the séance-sitter by night offers a tempting dramatic irony, adopting it would fundamentally misrepresent Sidgwick's intellectual project and the specific tragedy of his philosophical life.

  To answer your questions directly: **Yes, there is a specific, unresolved difficulty in his ethical theory that the psychical research was meant to address.** And **no, "credulous" is almost exactly the wrong word** for his approach; it was defined by a rigorous, often painful, skepticism.

  Here is a breakdown of why the connection runs deeper than you have assumed, and how adjusting this might deepen your novel.

  ### 1. The Philosophical Link: The Dualism of Practical Reason
  You mention the treatise is modelled on *The Methods of Ethics* (1874). In that book, Sidgwick arrives at a conclusion that haunted him for the rest of his life, which he called the "Dualism of Practical Reason."

  Sidgwick analyzed the three main methods of making ethical decisions: Intuitionism, Egoism (pursuing one's own happiness), and Utilitarianism (pursuing the general happiness). He found that Utilitarianism was the most logically robust system for public morality. However, he could not find a rational reason why an individual *must* choose the general good over their own good if the two conflict.

  In a Christian framework, this isn't a problem: God ensures that virtue is rewarded and sin punished, either in this life or the next. Therefore, self-interest and duty ultimately align. But Sidgwick had lost his Christian faith (he resigned his fellowship at Trinity in 1869 because he could no longer subscribe to the Thirty-Nine Articles). Without God and without an afterlife, there was no guarantee that being moral would lead to personal happiness. In fact, rationality might dictate pure egoism.

  **The Connection:** Sidgwick did not turn to psychical research as a hobby or a consolation prize. He turned to it as a **philosophical necessity.** He hoped that empirical evidence of survival after death (and potentially a moral order governing that survival) could provide the "sanction" his ethical system lacked. If he could prove scientifically that the soul survives and that there is cosmic justice, he could reconcile Egoism and Utilitarianism.

  If you write these as two separate lives, you miss the desperation of the endeavor. For your protagonist, the séances are not an escape from his philosophy; they are an attempt to **save** it. The "darkened rooms" are the laboratory where he hopes to find the missing premise for his "dense treatise."

  ### 2. The Methodological Question: "Credulous" vs. "Scientific"
  Describing him as "credulous" would be a significant historical error. In fact, Sidgwick's approach to the SPR (Society for Psychical Research, founded 1882) was defined by his enemies and friends alike as hyper-skeptical.

  *   **The Enemy Within:** Sidgwick and his circle (including his wife, Eleanor, and friend F.W.H. Myers) founded the SPR specifically to combat the gullibility of Victorian Spiritualism. They wanted to separate "chaff from wheat." They were often more critical of mediums than the spiritualists were.
  *   **The Desire for Disproof:** Sidgwick famously said he would be "glad to be proved wrong" about the possibility of survival, provided the proof was rigorous. He was not looking for comfort; he was looking for **data.** He investigated many mediums and found most of them to be fraudulent. He documented these failures meticulously.
  *   **The Tragedy:** The tragedy of Sidgwick's later life was not that he wasted time on nonsense, but that he applied the highest scientific standards to a subject that yielded no conclusive results. He remained an agnostic to the end. He *wanted* to believe, but his own rigorous methods prevented him from doing so without evidence.

  If you portray him as credulous, you turn him into a Victorian stereotype. If you portray him as a skeptic desperately hoping to be converted by evidence, you capture the historical reality.

  ### 3. Narrative Implications: From Irony to Unity
  Your current plan relies on the irony of the contrast. I would suggest shifting the tension from **contrast** to **causality.**

  *   **The Current Plan:** Day (Logic) vs. Night (Faith). The reader smiles at the contradiction.
  *   **The Revised Plan:** Day (The Problem) -> Night (The Search for the Solution). The reader feels the anxiety of the search.

  **Specific suggestions for your chapters:**

  1.  **The Stakes of the Séance:** When your protagonist sits in the darkened room, he shouldn't be passively receiving comfort. He should be cross-examining the medium with the same intensity he applies to his ethical axioms. He is looking for a specific type of evidence (e.g., knowledge the medium could not possibly know) that would validate a moral universe.
  2.  **The Bleed-Through:** Let the failure of the night affect the work of the day. When a séance is debunked or proves inconclusive, show him struggling with a specific chapter of his treatise regarding the "rationality of self-sacrifice." The gloom of the psychical research isn't separate; it casts a shadow over the ethics.
  3.  **The Role of Eleanor:** If you include a wife figure (based on Eleanor Sidgwick), ensure she is not a passive spiritualist. Eleanor was a mathematician and a rigorous researcher who often acted as a check on Henry's hopes. Their marriage was a partnership in this inquiry.
  4.  **The Vocabulary:** Avoid words like "ghost-hunter" or "spiritualist" for your protagonist. He is a "psychical researcher." He deals in "testimony," "veridical hallucinations," and "telepathy," not just "knocks and apparitions." The clinical language he uses to describe the supernatural should mirror the clinical language of his ethics.

  ### 4. A Quote to Keep in Mind
  Sidgwick wrote in a letter to a friend regarding his psychical research:
  > *"I am not afraid of being thought credulous... I am afraid of being thought narrow."*

  And regarding the ethical stakes, he wrote privately:
  > *"I have never been able to see... why I should sacrifice my own greatest happiness for the sake of the greatest happiness of others... unless I can believe... that the sacrifice will be compensated."*

  ### Conclusion
  If you keep the compartments separate, you risk writing a novel about a hypocrite or a confused man. If you link them, you write a novel about a man facing the "fundamental problem of ethics" in a secular age.

  The tension isn't that he believes in ghosts *despite* being a philosopher. The tension is that he *needs* the possibility of ghosts to make his philosophy coherent, but his philosophical training prevents him from believing in them without proof. That is a much richer, more modern, and more historically accurate conflict for your protagonist.
