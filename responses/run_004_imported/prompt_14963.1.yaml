      *   *Is the distinction between pointwise and expectation clear?* This is the crux. The theorem is pointwise, but the *class* of functions is defined by expectation.
      *   *Is the "Strongest Reply" actually strong?* Yes, the "Immodesty" argument is the standard defense (Joyce 2009). I need to make sure I don't strawman it.
      *   *Is the rebuttal rigorous?* I need to focus on the justification of *Expectation* itself. Why is Epistemic Expected Utility the right norm?

  8.  **Final Polish:** Check against the prompt instructions.
      *   Argue for the claim rigorously.
      *   State strongest reply.
      *   Explain why it fails.
      *   Maintain the persona of a rigorous interlocutor.

  *(Self-Correction Note)*: I should be careful not to say propriety *is* pragmatic. The accuracy-firster says it's alethic. My job is to argue that the *structure* of propriety is decision-theoretic, regardless of what label you put on the "utility." The definition involves an expectation operator. That operator is the bridge to decision theory.

