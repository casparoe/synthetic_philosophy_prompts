      *   *Circularity/Question-Begging:* To justify Probabilism (that credences *should* obey axioms), we use a metric defined by the assumption that agents *act as if* they obey the axioms (by minimizing expected inaccuracy).
      *   *The "Why Expectation?" Question:* Why minimize *expected* inaccuracy rather than, say, worst-case inaccuracy (minimax)? Minimax doesn't require propriety in the same way. Choosing expectation over minimax is a decision-theoretic risk attitude.
