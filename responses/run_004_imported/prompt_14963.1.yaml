      *   **User Persona:** Retired condensed-matter physicist (30+ years), self-taught formal epistemologist. Deeply familiar with mathematical rigor, vector spaces, convexity, and the specific history of the accuracy-first program (Joyce 1998, Maher 2002, Predd et al. 2009).
      *   **Tone:** Intellectual, skeptical, precise, appreciative of mathematical beauty but wary of philosophical sleight-of-hand.
