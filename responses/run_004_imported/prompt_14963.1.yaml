answer: |-
  This is a remarkably sharp diagnosis of the structural tension within the accuracy-first program. Given your background, you will recognize that the move from Joyce (1998) to Predd et al. (2009) is analogous to moving from a set of heuristic physical principles to a rigorous derivation from a Lagrangian: the mathematics becomes unassailable, but the physical interpretation of the terms in the Lagrangian becomes the sole locus of controversy.

  Here is the argument for your claim, followed by the strongest available defense from the accuracy-first camp, and finally the critique of that defense.

  ### I. The Migration of Normativity: From Dominance to Metric Selection

  Your intuition is mathematically sound: the normative force of the Accuracy-Dominance Theorem does not reside in the dominance relation itself, but in the restriction of the admissible class of inaccuracy measures.

  **1. The Structure of the Predd et al. Result**
  Let $W$ be a finite set of possible worlds. A credence function $c$ is a vector in $\mathbb{R}^{|W|}$. The set of probabilistically coherent credence functions, $\mathcal{P}$, is the convex hull of the valuation functions (the "omniscient" vertices).
  The theorem states: If $c \notin \mathcal{P}$, there exists a $c^* \in \mathcal{P}$ such that for all $w \in W$, $S(c^*, w) < S(c, w)$, **if and only if** $S$ is a continuous, strictly proper scoring rule.
  Geometrically, strictly proper scoring rules correspond to Bregman divergences generated by a convex function. The dominance result is essentially the statement that for any point outside a closed convex set, there is a point inside the set closer to it (in the geometry defined by the divergence) than the original point.

  **2. The Definition of Strict Propriety**
  A scoring rule $S(c, w)$ is strictly proper iff for all distinct $c, c'$:
  $$ \sum_{w \in W} c(w) S(c, w) < \sum_{w \in W} c(w) S(c', w) $$
  This inequality asserts that $c$ uniquely minimizes its own *expected* inaccuracy.

  **3. The Normative Migration**
  The dominance theorem is a conditional: *If* you accept strictly proper scoring rules as the sole legitimate measures of epistemic disutility, *then* incoherent credences are accuracy-dominated.
  The "objectivity" you initially admired in the pointwise comparison ($S(c^*, w) < S(c, w)$ at every world $w$) is purchased by the prior constraint on $S$. But that constraint is defined via an expectation operator weighted by the agent's own credences.

  In decision theory, the expectation operator represents a specific attitude toward risk and aggregation: it assumes that the value of a policy across uncertain states is the linear sum of values in each state, weighted by the probability of those states. By defining "legitimate accuracy" via strict propriety, the accuracy-first program implicitly mandates that epistemic value must be aggregated *as if* the credences were objective chances governing a lottery.

  Therefore, the argument does not vindicate probabilism from purely alethic, pointwise facts. Rather, it demonstrates that **probabilistic coherence is the unique fixed point of epistemic evaluation when evaluation is conducted using probabilistic expectations.** The normativity has migrated from the conclusion (dominance) to the premise (the choice of metric). If one rejects the expectation-theoretic aggregation of accuracy (for example, by adopting a minimax rule, or a weighted sum where weights do not match credences), the dominance theorem collapses, and incoherent credences may no longer be dominated.

  ### II. The Strongest Reply: Alethic Immodesty

  The most rigorous defense of the accuracy-first program against this charge comes from the requirement of **Immodesty** (or Self-Recommendation), articulated most forcefully by Jim Joyce (2009) and developed by Richard Pettigrew (2016).

  **The Argument:**
  1.  **The Epistemic Goal:** The sole fundamental epistemic goal is to maximize accuracy (minimize inaccuracy).
  2.  **Epistemic Rationality:** It is epistemically irrational to hold a belief state that, by your own lights, is expected to be less accurate than an available alternative. If your current credences $c$ tell you that adopting $c'$ would yield a lower expected inaccuracy, then $c$ commands its own abandonment in the pursuit of truth.
  3.  **Propriety as Consistency:** A scoring rule that is *not* proper allows for situations where $c$ expects $c'$ to be more accurate. If we adopt such a rule as our measure of truth-tracking, we create a conflict between our beliefs and our epistemic goal.
  4.  **Conclusion:** Strict propriety is not a pragmatic constraint imported from decision theory; it is a constitutive constraint on any measure that claims to quantify *epistemic* utility. A non-proper score is "epistemically self-defeating." It tells the agent that the best way to achieve the goal of accuracy is to hold beliefs other than those the agent takes to be best. Therefore, restricting the class of scoring rules to proper ones is required on purely alethic grounds to ensure the stability of the epistemic aim.

  In this view, the expectation operator in the definition of propriety is not a pragmatic betting commitment; it is the mathematical expression of "by your own lights." To evaluate accuracy without using the agent's own credences as weights would be to evaluate accuracy from a perspective the agent rejects.

  ### III. Why the Reply Fails

  While the Immodesty argument is elegant, it does not successfully purge the decision-theoretic assumptions from the foundation of the argument. It merely relabels them. Here is why the migration of normativity remains fatal to the claim of pure alethic vindication.

  **1. The "Why Expectation?" Problem**
  The Immodesty argument assumes that "by your own lights" necessarily implies *linear expectation*. But this is a substantive decision-theoretic assumption.
  Suppose an agent is epistemically risk-averse. They might evaluate the accuracy of a credence function not by its expected inaccuracy, but by its **worst-case** inaccuracy (Minimax), or by a weighted sum where high-stakes propositions (e.g., "there is a cliff ahead") are weighted more heavily than their credence magnitude alone would suggest.
  If an agent adopts a Minimax epistemic rule, a non-proper scoring rule might be perfectly acceptable. The Immodesty defense rules out these alternative aggregation methods by fiat. It asserts that the *only* rational way to weigh possibilities against one another in the pursuit of truth is via linear expectation. But linear expectation is the hallmark of risk-neutrality in decision theory. By building risk-neutrality into the definition of "accuracy," the program smuggles in a pragmatic attitude toward epistemic risk under the guise of alethic consistency.

  **2. Circularity in the Vindication of Probabilism**
  The goal of the accuracy argument is to show that agents *ought* to have probabilistically coherent credences.
  However, the definition of the legitimate metric (Strict Propriety) requires the agent to *act as if* they are probabilistically coherent (by using their credences as additive weights in an expectation).
  The argument effectively says: "If you evaluate your beliefs using the mathematical machinery of probability theory (expectations), you will find that you ought to have beliefs that obey the mathematics of probability theory (coherence)."
  This is a fixed-point theorem, not an external vindication. It shows that probabilism is stable under probabilistic evaluation. It does not show that probabilism is mandated for an agent who does not already accept the normative force of probabilistic aggregation. For a physicist, this is akin to deriving Euclidean geometry by assuming the metric tensor is the identity matrix; the result is consistent, but it doesn't prove space *must* be Euclidean, only that it is if you assume the Euclidean metric.

  **3. The Separation of Pointwise and Global**
  Your original insight highlights the disconnect between the pointwise dominance (which is assumption-light) and the metric selection (which is assumption-heavy). The Immodesty argument attempts to bridge this by saying the metric selection is required for global consistency.
  However, truth is a pointwise relation. A belief is accurate at world $w$ if it matches $w$. This fact does not depend on the agent's credence in $w$.
  By making the *measure* of accuracy dependent on the agent's credences (via the expectation definition of propriety), the accuracy-first program makes the *normative status* of a belief state dependent on the agent's psychology.
  If Agent A has incoherent credences $c_A$, and Agent B has coherent credences $c_B$, the theorem says $c_A$ is dominated. But this is only true relative to scoring rules that $c_A$ would find "immodest" if they weren't proper. The argument forces the agent to adopt a metric that validates their own coherence.
  A truly objective, alethic argument should be able to condemn incoherent credences even if the agent refuses to aggregate values via expectation. The fact that the accuracy argument loses its bite without the expectation assumption proves that the normativity lies in the aggregation rule, not the truth-tracking relation itself.

  ### Conclusion

  Your skepticism is well-founded. The Predd et al. theorem is mathematically robust, but its philosophical import relies entirely on the premise that **Epistemic Utility = Expected Accuracy**.

  The Immodesty defense attempts to frame this as a requirement of epistemic consistency, but it cannot justify *why* consistency must take the form of linear expectation rather than some other aggregation function (like minimax or rank-dependent utility). Since the choice of aggregation function is inherently a decision-theoretic choice regarding how to trade off value across uncertain states, the accuracy-first program does not escape pragmatism. It merely relocates the pragmatic commitment from the *consequences* of belief (betting) to the *evaluation* of belief (scoring).

  The vindication of probabilism is therefore not independent of decision-theoretic assumptions. It demonstrates that probabilistic coherence is the unique solution to the problem of minimizing expected inaccuracy, but it cannot justify the mandate to minimize *expected* inaccuracy without begging the question against non-probabilistic modes of epistemic evaluation.
