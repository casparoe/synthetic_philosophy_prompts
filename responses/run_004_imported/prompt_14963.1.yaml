      *   **Task:**
          1.  Argue rigorously for the claim above.
          2.  State the strongest reply available to an accuracy-first epistemologist (e.g., immodesty/self-recommendation as purely alethic).
          3.  Explain why that reply does not succeed (supporting the user's skepticism).

  2.  **Deconstruct the Argument (The "Migration" Claim):**
      *   *Premise 1:* The Accuracy-Dominance Theorem (Predd et al.) shows that if a credence function is probabilistically incoherent, there exists a coherent function that is strictly more accurate at *every* world, provided we use a strictly proper scoring rule (SPSR).
      *   *Premise 2:* The definition of an SPSR relies on *expectations*. A score $S(c, w)$ is strictly proper iff for any $c, c'$, $E_c[S(c, w)] < E_c[S(c', w)]$.
      *   *Premise 3:* Expectations involve weighting outcomes by probabilities (credences). This is the core machinery of decision theory (maximizing expected utility, or in this case, minimizing expected inaccuracy).
      *   *Conclusion:* Therefore, restricting the admissible measures of inaccuracy to SPSRs smuggles in decision-theoretic norms (specifically, norms about how to aggregate value across possibilities). The "objectivity" of the pointwise dominance is purchased at the price of a subjective/decision-theoretic constraint on the metric itself.

  3.  **Develop the Strongest Reply (The Accuracy-First Defense):**
      *   *What is the best counter-argument?* The defense usually hinges on the idea that propriety isn't pragmatic; it's constitutive of the *goal* of accuracy.
      *   *Key Concept:* Immodesty / Self-Recommendation.
      *   *Argument:* If you aim at truth, you should think your current beliefs are best. If a scoring rule tells you that adopting a *different* set of beliefs would yield a better expected score (given your current beliefs), that scoring rule is telling you to abandon your current beliefs in pursuit of accuracy. But if your current beliefs are your best estimate of the truth, a legitimate measure of accuracy shouldn't tell you to abandon them *for the sake of accuracy*.
      *   *Alethic Justification:* Propriety ensures that the measure of accuracy aligns with the epistemic goal. It's not about betting; it's about the internal consistency of the epistemic aim. If a score isn't proper, it's "self-defeating" as a measure of epistemic utility.
