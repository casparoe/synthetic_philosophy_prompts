answer: |-
  You have identified a very common stumbling block in bargaining theory, but your advisor is correct: there is a fundamental misunderstanding in your premise.

  The short answer is: **The Kalai–Smorodinsky (KS) solution does *not* satisfy Independence of Irrelevant Alternatives (IIA).**

  It is not a refinement of the Nash solution; it is an **alternative** solution derived by **replacing** IIA with Individual Monotonicity. If the KS solution satisfied all of Nash's axioms (including IIA), the Nash Uniqueness Theorem would dictate that the KS solution *must* be the Nash solution. Since they generally yield different outcomes, KS must violate at least one of Nash's axioms. That axiom is IIA.

  Here is a detailed breakdown of where the confusion lies and how to frame this in your dissertation.

  ### 1. The Axiomatic Trade-Off

  The core of the confusion is the assumption that KS "adds" an axiom to Nash's set. In axiomatic characterization, you cannot simply "add" axioms indefinitely without creating contradictions.

  *   **Nash (1950) Characterization:**
      1.  Pareto Optimality (PO)
      2.  Symmetry (SYM)
      3.  Invariance to Affine Transformations (IAT)
      4.  **Independence of Irrelevant Alternatives (IIA)**
      *   *Result:* Maximizes the product of utilities $(u_1 - d_1)(u_2 - d_2)$.

  *   **Kalai–Smorodinsky (1975) Characterization:**
      1.  Pareto Optimality (PO)
      2.  Symmetry (SYM)
      3.  Invariance to Affine Transformations (IAT)
      4.  **Individual Monotonicity (IM)**
      *   *Result:* The intersection of the Pareto frontier and the line connecting the disagreement point to the **Ideal Point**.

  **The Crucial Point:** Kalai and Smorodinsky did not keep IIA. They explicitly **dropped IIA** because it is logically incompatible with Individual Monotonicity (given the other standard axioms).

  ### 2. The Logical Proof (via Uniqueness)

  You can verify this using the logic of Nash's own theorem.

  1.  Nash proved that there is **one and only one** solution function that satisfies PO, SYM, IAT, and IIA.
  2.  We know the Nash Solution satisfies these four.
  3.  If the KS solution also satisfied these four, the KS solution would have to be mathematically identical to the Nash solution in all cases.
  4.  However, we can easily construct bargaining sets where the Nash point and the KS point are different.
  5.  Therefore, the KS solution **must violate** at least one of Nash's four axioms.
  6.  By construction, KS satisfies PO, SYM, and IAT.
  7.  Therefore, **KS must violate IIA.**

  ### 3. Why IIA and Monotonicity Clash (Intuition)

  To understand *why* they are rivals, you need to understand the philosophical conflict between IIA and Monotonicity.

  **Independence of Irrelevant Alternatives (IIA):**
  IIA states that if you remove options from the feasible set that were *not* chosen, the solution should not change.
  *   *Philosophy:* The solution should depend only on the local properties of the frontier around the agreement point (specifically, the slope/tangency). Information about "distant" possibilities shouldn't matter.
  *   *Nash Geometry:* The solution is where a hyperbola is tangent to the frontier. If you chop off the top right corner of the feasible set (without cutting off the tangent point), the tangent doesn't move.

  **Individual Monotonicity:**
  This states that if the feasible set expands in a way that increases one player's maximum possible payoff (their "ideal point") without decreasing the other's, the first player should not end up worse off.
  *   *Philosophy:* The solution should depend on the **global** shape of the set, specifically the relative claims players have based on their best possible outcomes.
  *   *KS Geometry:* The solution is a line from the disagreement point to the **Ideal Point** (the vector of maximum possible utilities for each player). If you expand the set, the Ideal Point moves. Consequently, the line moves, and the intersection point moves.

  **The Conflict:**
  Imagine a bargaining set where you expand the feasible region to give Player 1 a higher potential maximum payoff, but you do so in a region "far away" from where the Nash solution currently sits.
  *   **Nash (IIA):** Ignores the expansion. The local tangency hasn't changed. Player 1's payoff stays the same.
  *   **KS (Monotonicity):** Cares about the expansion. Player 1's "claim" (Ideal Point) has increased. The line connecting disagreement to ideal pivots toward Player 1. Player 1's payoff increases.

  Because KS responds to the expansion and Nash does not, **KS violates IIA.**

  ### 4. Why They Are Treated as Rivals

  They are treated as rivals because they represent two distinct normative views on what constitutes "fairness" in bargaining, not because one is a superior version of the other.

  *   **The Nash View:** Fairness is about **intensity of preference** at the margin. It relies on the independence condition to ensure that the bargaining outcome isn't manipulated by adding "dummy" options to the table that no one intends to pick.
  *   **The KS View:** Fairness is about **equalizing relative concessions**. Each player should concede the same proportion of their maximum possible gain. This requires looking at the Ideal Point, which inherently violates IIA.

  In the literature, the choice between Nash and KS is often a choice between whether you value **IIA** (Nash) or **Monotonicity** (KS) more highly. Since they are incompatible, you must choose one axiom system or the other.

  ### 5. Advice for Your Dissertation

  Since you are working through the literature for a dissertation, you should frame this distinction carefully:

  1.  **Correct the Axiomatic Record:** Explicitly state that KS is a characterization result that *substitutes* Monotonicity for IIA, rather than augmenting Nash's system.
  2.  **Cite the Impossibility:** Reference the fact that no solution can satisfy PO, SYM, IAT, IIA, and Monotonicity simultaneously. (This is often discussed in texts like Thomson's *Bargaining and the Theory of Cooperative Games* or Peters' *Game Theory: A Multi-Leveled Approach*).
  3.  **Normative Implications:** Discuss *why* a researcher might prefer one over the other. For example, if the context involves threats where the "ideal point" represents a credible threat capability, KS might be more appropriate. If the context involves market-like interactions where local marginal rates of substitution matter more, Nash is often preferred.
  4.  **Avoid "Refinement" Language:** Do not describe KS as a refinement. Describe it as an **alternative characterization** or a **competing solution concept**.

  **Summary for your advisor:**
  You can tell your advisor you have corrected your understanding: "I realized that KS replaces IIA with Monotonicity rather than adding to Nash's axioms, and that the two axioms are mutually exclusive in this context."

  This is a classic "rite of passage" confusion in bargaining theory. Once you see that IIA is the casualty of the KS construction, the rivalry makes perfect sense.
