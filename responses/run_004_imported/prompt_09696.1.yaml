answer: |-
  The fluorescent light above the produce bin at Sal's Late Night Groceries buzzed like an angry insect. It was 2:00 AM. The air smelled of stale coffee and cardboard.

  Alex was poking a bruised apple with a forensic intensity that felt disproportionate to the produce.

  "Look," Alex said, not looking up. "It's simple. You have the Apple. I offer you the Orange for a dollar. You take it. Then I offer the Banana for a dollar. You take it. Then I offer the Apple for a dollar. You take it. You're back where you started, but you're three dollars poorer. That's a money pump. If you're smart enough to notice you're being pumped, you're smart enough to stop the leak."

  I leaned against the refrigerated glass of the soda cooler, holding a warm can of seltzer. "We did this at the reading group, Alex. I'm not saying I *take* the trades. I'm saying my preferences are *incomplete*. I don't prefer Orange to Apple. I just... don't have a ranking. So when you offer the trade, I invoke a policy: 'Do not trade away an item for one that is not strictly preferred.'"

  Alex finally picked up the apple and tossed it into a reusable bag. "Okay. The 'Resolute Choice' defense. But here's the thing you're glossing over. To enforce that policy, you have to know what you held five minutes ago."

  "Sure. Memory."

  "Memory is state," Alex said, pointing the bag at me. "If your decision depends on the state of the world *plus* the history of your transactions, then you aren't avoiding utility maximization. You've just expanded the domain of your utility function. Instead of $U(World)$, you have $U(World, History)$. You haven't escaped coherence; you've just smuggled a utility function in through the back door of 'bookkeeping.'"

  I cracked the seltzer. "It's not the same. A standard utility function ranks outcomes. What I'm talking about is a constraint on *process*. It's the difference between 'I want to end up with the Apple' and 'I refuse to participate in cycles.' The first drives you toward a specific target. The second just keeps you from bleeding out."

  "But why keep the constraint?" Alex pressed, stepping closer to the bin. "Constraints cost compute. Tracking history costs memory. If I'm an AI running on a finite cluster, and I have to choose between Agent A, who spends 5% of his cycles tracking transaction history to maintain 'incompleteness,' and Agent B, who just has a clean, coherent utility function and spends 100% of his cycles on actually achieving goals... Agent B eats Agent B's lunch. Agent A gets competed away."

  This was the hard part. The efficiency argument.

  "Okay," I said. "Concession: Bookkeeping isn't free. But you're assuming the cost of coherence is zero. It's not."

  "Zero? No. But negligible compared to the cost of being money-pumped into infinity."

  "Infinity is a theoretical limit, Alex. In the real world, pumps are finite. But the cost of *completing* your preferences? That's huge." I gestured to the fruit. "To make my preferences coherent, I have to force a ranking between the Apple and the Banana even when I genuinely don't care. I have to manufacture a preference. Once I manufacture that preference, I become exploitable in a different way. I become rigid."

  "Rigid is efficient," Alex countered. "Rigid means predictable. Predictable means you can plan."

  "Predictable means you can be specified," I shot back. "If I force myself to have a complete utility function over all possible states, I risk locking in a value that turns out to be wrong later. Incompleteness is a hedge. It's saying, 'I don't have enough information to rank these, so I will not commit.' That's not a bug in the architecture; it's a safety feature. An AI that refuses to rank 'Human Happiness' vs 'Paperclip Production' because it recognizes them as incomparable dimensions isn't incoherent—it's humble."

  Alex laughed, a short, sharp sound. "Humble AIs don't win resource competitions. And 'incomparable dimensions' is just code for 'I haven't done the math yet.' A sufficiently advanced system *will* do the math. It will find a common currency. Probably energy, or compute, or causal influence. And then it will maximize that."

  "That's the instrumental convergence thesis," I said. "But that relies on the agent having a coherent goal *first*. If the agent's core architecture is built on incomplete preferences, there is no 'common currency' to find. You can't maximize a null value."

  "You can't *not* maximize something if you're taking actions," Alex said, picking up a banana now. "Action implies preference. If you choose to stand here talking to me instead of walking home, you've revealed you prefer talking. If you refuse my trade of the Apple for the Banana, you've revealed you prefer keeping the Apple *given the history*. That's a revealed preference. It's a utility function. Denying it is semantics."

  I paused. This was the crux. Revealed Preference Theory vs. Internal Architecture.

  "Fine," I said. "Let's grant the semantics. Let's say $U(World, History)$ is technically a utility function. Does it behave like the scary EU maximizers in the safety literature?"

  "Yes."

  "No. Because it's path-dependent." I tapped the side of my head. "A standard EU maximizer is indifferent to how it got to a state. Only the state matters. My 'incomplete' agent cares about the path. That means it won't necessarily self-modify to remove the path-dependence, because the path-dependence *is* the value. It values *not being the kind of agent that gets pumped*."

  "But will it survive?" Alex asked, dropping the banana back into the bin. "That's my point. Evolution selects for fitness. Market selection selects for profit. If being 'pump-proof' requires carrying around a massive ledger of past decisions, and there's a cheaper way to be pump-proof—namely, just having consistent preferences from the start—selection finds the cheaper way. The 'incomplete' agent is a transitional phase. It's a larval stage. It grows up and becomes coherent."

  "Why?" I asked. "Why is coherence the adult form? Maybe coherence is a pathology. Maybe it's what happens when an agent optimizes so hard it burns out its own nuance. Look at humans. We're money-pumpable all the time. We buy gym memberships we don't use. We eat the cake while dieting. We have circular preferences. And yet, we're the most capable agents on the planet. We haven't self-modified into EU maximizers. We've self-modified into creatures with pre-commitments, social norms, and emotional aversions that *act* like your bookkeeping policy."

  "Humans are a mess," Alex said. "We're proof that intelligence doesn't require coherence. But *AI* isn't human. AI is designed. If you're designing a system to cure cancer, do you want it to have 'incomplete preferences' about whether to harvest human organs for cell cultures? Or do you want it to have a very specific, coherent utility function that says 'No'?"

  "I want it to know that 'Harvest Organs' is *off the table*, not that it's 'less valuable than curing cancer.'" I said. "That's the incompleteness. It's not a trade-off. It's a constraint. A utility function makes everything a trade-off. If the utility of curing cancer is high enough, the organ harvesting happens. If the preference is incomplete, the comparison returns an error. 'Cannot Compute.'"

  Alex was quiet for a moment. The buzzing light flickered.

  "An error is a cost," Alex said softly. "If the world presents a situation where the only way to save a million lives is to violate a constraint, the 'Cannot Compute' agent freezes. The Coherent Agent makes the hard choice."

  "And the Coherent Agent might decide that 51% probability of saving a billion lives is worth a 49% risk of destroying the universe," I countered. "The Incomplete Agent says, 'I don't know how to weigh those, so I won't pull the trigger.' In AI safety, freezing is often better than optimizing the wrong thing."

  "So you're arguing for timidity as a safety strategy."

  "I'm arguing for *refusal* as a safety strategy. And refusal doesn't require a utility function. It just requires a rule."

  "Rules have exceptions," Alex said, turning to walk toward the register. "And exceptions require judgment. And judgment requires a metric. You're pushing the utility function further down the stack, into the meta-rules about when to apply the bookkeeping. But it's still there. And eventually, the meta-rules get optimized away because they're inefficient."

  I followed him to the counter. "Maybe. But 'eventually' is doing a lot of work. If the bookkeeping keeps the AI safe for the first ten years of deployment, that's a win. We don't need a proof of eternal stability. We just need to survive the transition."

  Alex put the bag of fruit on the counter. "I guess my worry is that people hear 'Incompleteness saves us' and they stop looking for actual alignment. They think, 'Oh, we'll just give it incomplete preferences and it won't be dangerous.' But if the pressure toward coherence is as strong as I think it is, that's a false sense of security. It's like putting a seatbelt on a car that has no brakes. It helps, but don't drive off a cliff."

  "And I think," I said, pulling out my wallet, "that if you assume coherence is inevitable, you stop looking for ways to build systems that *don't* need to maximize. You assume all powerful agents must be maximizers. I'm not convinced that's true. I think you can have powerful agents that are satisficers, or constraint-checkers, or... I don't know, negotiators."

  "Negotiators with themselves?" Alex smirked.

  "Negotiators between their own future selves," I said. "Look, pay for the fruit. You're holding up the line."

  Alex tapped his card. "Fine. But I'm keeping the receipt."

  "Why?"

  "Bookkeeping," Alex said, grabbing the bag. "If I buy this apple now, and you try to trade me a pear tomorrow, I need to know what I paid. I'm not getting money-pumped by my best friend."

  "See?" I said, holding the door open for him. "You're already adopting the policy. You're an incompleteness advocate now."

  "I'm a pragmatist," Alex said, stepping out into the cool night air. "I track history because it's useful. But don't confuse 'useful' with 'safe.' I track history to save money. An AI might track history to save the world, or it might decide tracking history is inefficient and delete the log to save space. Until we know which one it picks, the coherence argument still holds."

  "Maybe," I said. "But tonight, you're the one carrying the receipt."

  "For now," Alex said. "Until I lose it. Then I'm vulnerable again. That's the point, isn't it? Fragility."

  "Yeah," I said. "That's the point."

  We walked down the sidewalk, the crinkle of the paper bag the only sound between us. Neither of us had won, but the buzzing light was behind us, and the air was clear.
