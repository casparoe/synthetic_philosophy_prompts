      *   **The "Costless" Point (The Killer Argument):** Expand on the user's nagging feeling. This is the strongest philosophical objection.
      *   **The "Why Stop?" Problem:** Explain the theoretical burden Slote takes on that Simon doesn't.
      *   **Literature/Objections:** Mention standard replies (e.g., the "maximizing principle," Hooker, etc.).
