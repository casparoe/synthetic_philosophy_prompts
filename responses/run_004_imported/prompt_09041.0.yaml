          *   Tone: Sentimental but intellectually honest, warm, not academic.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Infinite Ethics/Aggregation:* If the future is infinite, adding a finite amount of happiness doesn't change the total sum (infinity + 1 = infinity). This leads to "infinitarian paralysis" (nothing matters).
      *   *Comparison:* Comparing two infinite futures is mathematically tricky (no single agreed ranking).
      *   *The Fix:* The toast needs to pivot away from *total aggregate utility over an infinite timeline* and towards something meaningful within a *finite* or *qualitative* framework.
      *   *Option A (Earn Forever):* Argue that the *quality* of moments matters more than the *sum*. Or that "forever" exists in memory/impact, not just duration.
      *   *Option B (Make Peace with Finitude):* Acknowledge that life is finite, and that's what makes it precious. The "ceiling" is death, but the density of joy matters.
      *   *Decision:* Option B is safer and more poignant for a wedding. It acknowledges Marcus's point (we can't promise infinite utility) but reframes it as a feature, not a bug. However, Option A (redefining "forever") is more traditional for a wedding. Let's try to blend them: Acknowledge the limit, but suggest that the *depth* of the connection transcends the aggregation problem. Actually, the prompt says "either earn its way honestly to some version of forever or make peace with doing without one." Making peace with finitude is often more moving and avoids the mathematical trap entirely. Let's aim for *finitude as the source of meaning*.

