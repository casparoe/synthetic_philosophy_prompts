answer: |-
  Good evening. For those who don't know me, I'm [Your Name], Priya's college roommate.

  Priya and Dev met in a graduate seminar on decision theory. Which is appropriate, because they approach their relationship with a level of rigor that most of us reserve for our taxes. They calculate odds, they weigh variables, and they optimize for the long term.

  When I started writing this toast, I wanted to match their language. I wrote a wish that their happiness would compound year after year, with no ceiling, for as long as they lived. I wanted to promise them a future of boundless, infinite joy.

  But then I showed the draft to our friend Marcus, who is currently finishing a dissertation on infinite ethics. We didn't eat much dinner that night. Marcus pointed out that if you actually try to model an infinite future, the math breaks. He explained that against a backdrop of infinity, adding a finite amount of joy doesn't change the total. In an endless timeline, no single moment—not a wedding, not a kindness, not this toast—makes a statistical difference. It's a problem some philosophers call "infinitarian paralysis."

  At first, I was frustrated. I thought he was stealing the poetry from the room. But then I realized he was actually giving me the gift of the truth.

  Because if Marcus is right, then the only reason tonight matters, the only reason this love matters, is precisely because it *isn't* infinite.

  If Priya and Dev had forever, there would be no urgency to be kind today. If time were boundless, the scarcity that makes a moment precious would vanish. An infinite stream of happiness has no weight. But a finite life? A life bounded by time? That has gravity.

  So, I am not going to wish you infinity. Infinity is a concept that swallows meaning.

  Instead, I wish you density.

  I wish you a marriage where the value isn't measured by how long the line goes on, but by how deep the points are. I wish you the kind of joy that is heavy enough to anchor you when the variables change. I wish you the resilience to know that because time is limited, the choice to spend it on each other is the most significant calculation you will ever make.

  To the relatives here who don't speak the language of decision theory: this is just a fancy way of saying that love is not about forever. It is about *now*. It is about the fact that we are here, together, in a room that will eventually empty, holding a moment that will eventually pass. And because it passes, it is sacred.

  Priya, Dev, I cannot promise you an unending sum. But I can promise you that within the limits of a human life, what you have built is statistically significant. It changes the total. It changes us.

  So, please raise your glasses.

  To the finite. To the fragile. To the here and now.
  To Priya and Dev.
