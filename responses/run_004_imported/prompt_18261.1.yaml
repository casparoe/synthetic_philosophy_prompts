      *   **Task:** Reconstruct Leibniz's position *using his own metaphysical resources*, not modern decision theory jargon (though mapping is allowed for explanation). Determine if he one-boxes, two-boxes, or dissolves the problem.

  2.  **Analyze Leibniz's Key Doctrines:**
      *   **Complete Concept:** An individual substance (e.g., Caesar, or "Me") contains all predicates true of it, past, present, and future. "Crossing the Rubicon" is *in* Caesar's concept.
      *   **Hypothetical Necessity:** Events are not absolutely necessary (like logic/math) but hypothetically necessary. *If* this world exists (the best of all possible worlds), *then* these events follow. God chose this world freely.
      *   **Infinite Analysis:** Finite minds cannot deduce future contingents from a concept because the analysis is infinite. Only God can see the connection clearly.
      *   **Spontaneity & Intelligence:** Actions arise from the substance's own nature (spontaneity) guided by perception of the good (intelligence). Freedom requires spontaneity, intelligence, and contingency.
      *   **Compossibility:** Not all possible substances can exist together. The actual world is the maximal set of compossible substances.
      *   **Pre-established Harmony:** Mind and body (and substances generally) don't interact causally but correspond perfectly due to God's initial coordination.

  3.  **Map Leibniz to Newcomb's Problem:**
      *   **The Predictor:** In Newcomb's, Omega predicts based on simulation or scanning. In Leibniz's world, God knows via the complete concept. The "Predictor" in a Leibnizian scenario would be an entity accessing the complete concept (or a very good approximation via infinite analysis).
      *   **The Choice:** To one-box or two-box.
      *   **The Correlation:** In Newcomb's, Box B contains \$1M *if* Omega predicted one-boxing. In Leibniz, the state of the world (including the money in the box) is compossible with the agent's complete concept (including the choice).
      *   **Causality:** Leibniz rejects transitive causality between substances. My choice doesn't *cause* the money to be there, nor does the prediction *cause* my choice. Both are harmonized by God's initial choice of this world.

  4.  **Evaluate the "One-Boxing" Argument (EDT/FDT style):**
      *   *Argument:* The money is already there or not. But your choice is correlated with the state. Choosing to one-box is evidence you are the *kind* of person for whom the money is there.
      *   *Leibnizian Fit:* High. The "kind of person" is the Complete Concept. The state of the box and the action are predicates of the same world-state. They are compossible. To act otherwise would be to be in a different possible world (which doesn't exist).
      *   *Constraint:* Leibniz insists on contingency. "I could have done otherwise" means "In another possible world, I do otherwise." But *in this world*, the concept is fixed.

  5.  **Evaluate the "Two-Boxing" Argument (CDT style):**
      *   *Argument:* The money is already there. My causal power now cannot change the past prediction. Dominance reasoning applies.
      *   *Leibnizian Fit:* Low. Leibniz denies efficient causation between substances anyway. But he also denies that the future is "open" in the sense that I can sever the link to my concept. To choose two-boxing *just is* to be the person for whom the box is empty.
      *   *Constraint:* Leibniz might object to the "stipulation" of the thought experiment if it implies a break in the pre-established harmony.

