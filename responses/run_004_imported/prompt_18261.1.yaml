      *   *Core Metaphysical Move:* Shift from Causality to Compossibility. Newcomb's is usually framed as causal (did prediction cause choice?) or evidential. Leibniz frames it as *harmonic*.
      *   *The Verdict:* One-boxing, but for different reasons than EDT/FDT.
      *   *Argument 1: The Impossibility of the "Dominance" Cells.* Explain that "Two-boxing + \$1M" is not a compossible state in the scenario defined by an infallible predictor. It violates the Principle of Contradiction within the context of the complete concept.
