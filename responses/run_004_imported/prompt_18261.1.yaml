      *   *Is it truly one-boxing?* If the money is *already* there, does choosing change it? For Leibniz, choice doesn't "change" the world; it *unfolds* the concept. To "choose" two-boxing is to reveal you are in the world where the box is empty. But you want to be in the world where the box is full. How do you choose which world you are in? You can't. You just act according to your nature.
