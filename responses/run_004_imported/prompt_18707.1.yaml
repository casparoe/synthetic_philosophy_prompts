      4.  *Upamāna* (Comparison) - Rejected or reduced by Vaiśeṣika, Buddhists, Sāṃkhya, and even some Mīmāṃsakas.

      *Wait, let me double-check Śabda vs. Upamāna.*
      *   *Upamāna*: Vaiśeṣika (Kanada) explicitly reduces it to *Śabda* and *Pratyakṣa*. Buddhists (Dignāga) reduce it to *Anumāna*. Sāṃkhya doesn't list it. It is widely considered the "extra" one Nyaya added to distinguish itself.
      *   *Śabda*: Mīmāṃsā and Vedānta *need* this for Vedic authority. They fight hard for it. Buddhists reduce it to inference (knowing the speaker is trustworthy). Cārvāka rejects it.
      *   *Comparison*: *Upamāna* is definitely the most contested. Even among the orthodox (Astika), Vaiśeṣika drops it.
      *   *Testimony*: *Śabda* is contested by heterodox schools but fiercely defended by orthodox ones.
      *   *Inference*: *Anumāna* is contested only by Cārvāka (mostly). Buddhists are logicians par excellence.
      *   *Perception*: *Pratyakṣa* is the baseline.

      *Refining the order:*
      1.  Pratyakṣa (Least disputed)
      2.  Anumāna
      3.  Śabda
      4.  Upamāna (Most disputed)

      *Is Śabda more disputed than Anumāna?* Yes. Cārvāka rejects both, but Buddhists accept Anumāna while reducing Śabda. Vaiśeṣika accepts Anumāna but reduces Upamāna. So Anumāna is safer than Śabda.
      *Is Śabda more disputed than Upamāna?* Upamāna is dropped by Vaiśeṣika (Nyaya's twin). Śabda is kept by all Astika schools. So Upamāna is more disputed than Śabda.

      *Final Order:* Pratyakṣa -> Anumāna -> Śabda -> Upamāna.

  4.  **Drafting the Explanations:**
      *   *Pratyakṣa*: Accepted by all six Astika and even Cārvāka (who accepts *only* this). Disputes are usually about *what* counts (e.g., mental perception), not *if* it exists.
      *   *Anumāna*: Rejected by Cārvāka (as uncertain), but accepted by Buddhists, Sāṃkhya, Mīmāṃsā. It's the engine of debate, so everyone uses it even if they argue about its validity.
      *   *Śabda*: Accepted by orthodox schools (crucial for Vedas), but Buddhists reduce it to inference (reliability of speaker) and Cārvāka rejects it entirely.
      *   *Upamāna*: The "odd one out." Vaiśeṣika reduces it to Perception + Testimony. Buddhists reduce it to Inference. Sāṃkhya omits it. It's the first to go when schools try to minimize ontological clutter.

