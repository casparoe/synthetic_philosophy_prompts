  so in my classical indian philosophy seminar we've been stuck on nyaya epistemology for like two weeks now and my brain is mush (not that im complaining, its way more fun than the whole month we spent on descartes earlier this semester). the four pramanas thing seemed pretty simple at first - pratyaksa, anumana, upamana, sabda - until the professor pointed out that literally no other school agrees on the count: carvaka only wants 1, the buddhist logicians and vaisesika only want 2, samkhya wants 3, and then mimamsa/vedanta go the OTHER way and want 6 total. so basically every single one of nyaya's four has been argued against by somebody, just to wildly different degrees - like the gavaya/wild-ox example for upamana always gets brought up as the "shakiest" one, but i genuinely don't remember off the top of my head which of the other three is next-shakiest vs which one basically nobody ever seriously disputed.

  for my response paper this week i need to rank the four nyaya pramanas from the one whose status as a genuinely indepedent, irreducible pramana was LEAST disputed across the wider tradition (carvaka, buddhist epistemologists, vaisesika, samkhya, mimamsa/vedanta, etc) down to the one that was MOST disputed / most often reduced to one of the others by rival schools. could you help me out with that ranking, plus maybe 2-3 sentences under each one on specifically which school(s) pushed back and how (like "reduced to a form of inference" vs "reduced to memory + perception," whatever the actual reasoning was)? if you could give the ranking itself as a json list that'd be great, something like:

  ```json
