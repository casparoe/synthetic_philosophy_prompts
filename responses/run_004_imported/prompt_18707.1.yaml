      *   **Goal:** Accuracy is crucial because the user needs to defend this in a seminar discussion.

  2.  **Information Retrieval & Verification (Internal Knowledge):**
      *   *Pratyakṣa* (Perception): Almost everyone accepts perception. Cārvāka accepts *only* this. Buddhists, Sāṃkhya, Mīmāṃsā, Vedānta all accept it. It is the foundation. *Status: Least disputed.*
      *   *Anumāna* (Inference): Most schools accept inference. Cārvāka rejects it (says it's uncertain). Buddhists accept it (Dignāga/Dharmakīrti are huge on logic). Sāṃkhya accepts it. Mīmāṃsā/Vedānta accept it. *Status: Very widely accepted, slightly more disputed than perception only because Cārvāka rejects it, but generally solid.*
      *   *Śabda* (Verbal Testimony/Word): Nyaya accepts it. Mīmāṃsā/Vedānta *heavily* emphasize it (Vedas). Buddhists generally reject *śabda* as an independent *pramana* (reduce it to inference - we infer the speaker is reliable). Cārvāka rejects it. Sāṃkhya accepts it (as part of testimony/Agama). *Status: Moderately disputed. The reduction to inference is a common Buddhist critique.*
      *   *Upamāna* (Comparison/Analogy): Nyaya accepts it. Vaiśeṣika (Nyaya's partner school) actually *rejects* it as independent (reduce to perception + testimony). Buddhists (Dignāga) reject it (reduce to inference or testimony). Mīmāṃsā (Kumārila) accepts it, but Prabhākara reduces it. Sāṃkhya doesn't count it as separate. *Status: Most disputed. Even allies like Vaiśeṣika often drop it.*

  3.  **Drafting the Ranking:**
      1.  *Pratyakṣa* (Perception) - Universal acceptance (even Cārvāka).
      2.  *Anumāna* (Inference) - Accepted by almost all except Cārvāka.
