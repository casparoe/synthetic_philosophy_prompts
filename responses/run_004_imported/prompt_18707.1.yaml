  ```

  ### Explanation of the Ranking

  **1. Pratyakṣa (Perception)**
  This is the least disputed because it is the foundational *pramāṇa* accepted by every single school, including the materialist Cārvāka (who accept *only* this). While schools debate the specifics (e.g., whether mental perception counts or if illusion invalidates it), no orthodox or heterodox school denies that direct perception is a valid source of knowledge.

  **2. Anumāna (Inference)**
  Inference is widely accepted by all orthodox (āstika) schools and Buddhist logicians like Dignāga, who built entire epistemological systems around it. The only major rejection comes from the Cārvāka, who argue inference is uncertain because the universal relation (*vyāpti*) cannot be perceived, but this is a minority view compared to the broad consensus on logic.

  **3. Śabda (Verbal Testimony)**
  While Mīmāṃsā and Vedānta fiercely defend *śabda* as essential for Vedic authority, Buddhist epistemologists reduce it to a form of *anumāna* (inferring the speaker is reliable) rather than granting it independent status. The Cārvāka reject it entirely, making it more contested than inference, though it remains secure within the orthodox tradition.

  **4. Upamāna (Comparison)**
  This is the most disputed, as even Nyaya's closest ally, the Vaiśeṣika school, reduces it to a combination of perception and testimony rather than accepting it as independent. Buddhists reduce it to inference, Sāṃkhya omits it entirely, and even within Mīmāṃsā, the Prabhākara sub-school argues it is not distinct from other *pramāṇas*, making it the first candidate for elimination across the tradition.
