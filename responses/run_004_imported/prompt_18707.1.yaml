      *   **Topic:** Nyaya Epistemology (specifically the four *pramanas*: *pratyakṣa*, *anumāna*, *upamāna*, *śabda*).
      *   **Task:** Rank these four from *least disputed* (most accepted as independent/irreducible) to *most disputed* (most often rejected or reduced to others) across other Indian philosophical schools (Cārvāka, Buddhist, Vaiśeṣika, Sāṃkhya, Mīmāṃsā/Vedānta).
