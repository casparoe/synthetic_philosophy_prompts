answer: |-
  You have an excellent instinct here. Your skepticism is historically and philosophically warranted, and catching this distinction will make your novel significantly sharper.

  The short answer is: **You are right, and Neurath knew it.**

  The popular summary you've been reading—that ISOTYPE was intended as a *complete* replacement for verbal language capable of handling complex logic—is a caricature that grew later. In the late 1920s, Neurath was much more pragmatic. He did not believe pictures could handle negation, conditionals, or abstract syntax. He didn't try to solve that problem; he sidestepped it by redefining the purpose of the system.

  Here is how you can arm your character with arguments Neurath actually used, keeping the philosophy consistent with the Vienna Circle and the politics of Red Vienna.

  ### 1. It was an "Auxiliary Language," not a Universal One
  Neurath rarely claimed ISOTYPE would replace speech or writing entirely. He called it a **"visual auxiliary language"** (*visuelle Hilfssprache*).

  His argument was that verbal language is terrible at conveying *quantities* and *proportions* across cultural barriers. If I say "a lot of people are unemployed," that means something different to a Viennese socialist, a London banker, and a rural farmer. But if I show 100 little men, and 25 of them are colored red to represent unemployment, the *fact* is transmitted without linguistic ambiguity.

  **For your scene:** Your character shouldn't defend ISOTYPE as a way to write poetry or law. They should defend it as a way to show **facts** to people who are excluded from the "club" of academic language.
  *   **Dialogue Hook:** "It isn't meant to replace words, Herr Journalist. It is meant to replace *lies*. A politician can say 'many' and mean whatever he likes. A chart of one hundred figures, with thirty painted red, cannot lie about the proportion."

  ### 2. "Transformation" vs. "Translation"
  This is the most crucial technical distinction Neurath made, and it solves your logical problem. Neurath insisted that ISOTYPE was not a **translation** of text into pictures, but a **transformation** of data into pictures.

  *   **Translation** implies taking a sentence ("There are no apples") and turning it into a picture. (Which, as you noted, is impossible).
  *   **Transformation** starts with the *fact* (the statistical data) and finds the best visual representation for it.

  If the data is negative (e.g., "Zero grain imported"), the ISOTYPE chart doesn't try to draw a "not grain" symbol. It draws an empty bin, or simply omits the grain icon from the import list. The *context* of the chart provides the logic; the icons provide the quantity.

  **For your scene:** Your character can correct the journalist on this point. It shows they are an insider.
  *   **Dialogue Hook:** "You think we take sentences and draw them. We don't. We take *facts* and transform them. We do not illustrate the word 'not.' We illustrate the absence of the thing."

  ### 3. The Vienna Circle Connection: Anti-Metaphysics
  As a member of the Vienna Circle, Neurath was a Logical Positivist (or "Logical Empiricist"). The Circle's main beef was with **metaphysics**—philosophical claims that couldn't be verified by observation (e.g., "The State has a soul," or "History is driven by Spirit").

  Neurath saw ISOTYPE as **Physicalism for the Masses**.
  *   Verbal language is full of "metaphysical fog" (rhetoric, emotion, ambiguity).
  *   Pictures ground you in the physical world (things you can count).

  He didn't need ISOTYPE to handle "if...then" logic because he wasn't trying to do philosophy with it. He was trying to empower the working class with verifiable data. In Red Vienna, this was explicitly socialist: give the workers the statistics, and they will see the necessity of social housing and healthcare.

  **For your scene:** The defense isn't about linguistic completeness; it's about **democratization**.
  *   **Dialogue Hook:** "The Professor speaks in logic, the Priest speaks in riddles, the Capitalist speaks in contracts. All of them require years of schooling to decode. The Vienna Method requires only eyes. It is the only language the proletariat owns."

  ### 4. The "Memory" Argument
  Neurath argued that the human brain retains "orderly pictures" better than tables of numbers or paragraphs of text. He wasn't trying to convey complex logical arguments; he was trying to convey **memorable comparisons**.

  He acknowledged that for complex reasoning, you need text. But for the *initial grasp* of a social situation, you need pictures. The text serves as the caption (the syntax), and the pictures serve as the nouns/verbs (the content).

  **For your scene:** Acknowledge the limitation to gain credibility.
  *   **Dialogue Hook:** "Can you write a sonnet in ISOTYPE? No. Can you write a contract? No. But can a mother in Favoriten understand why her rent is too high compared to her wage? Yes. That is not a failure of the system. That is its purpose."

  ### 5. Historical Detail: Marie Neurath
  If you want to really nail the scene, mention **Marie Neurath** (née Reidemeister).
  *   Otto was the philosopher and visionary.
  *   Marie was the **"Transformer."** She was the one who actually figured out how to turn complex data into the icons.
  *   In the late 20s, they were working closely together at the *Gesellschafts- und Wirtschaftsmuseum* (GWM).

  If your character is a true believer, they might mention that the "method" isn't just Otto's theory, but the practical work of the "Transformer" (Marie). Neurath himself was known to be somewhat chaotic; Marie was the rigor.

  ### Summary for your Character's Defense
  To make your character sound authentic to 1928 Red Vienna, have them pivot the argument away from **Linguistics** (can it express logic?) and toward **Pedagogy and Politics** (does it empower the viewer?).

  **The Plausible Neurathian Argument:**
  1.  **Admit the limit:** "It is not for philosophy. It is for education."
  2.  **Highlight the enemy:** "Text is a wall built by the educated to keep the worker out."
  3.  **Define the goal:** "We do not want a universal language for everything. We want a universal vision for *facts*."
  4.  **The Vienna Circle link:** "We sweep away the metaphysical fog of rhetoric. What you see is what is."

  **Sample Dialogue Snippet:**
  > "You ask if it can express negation," my character said, setting down his wine. "It cannot. Nor can it express the subjunctive mood. Dr. Neurath does not claim it can. But tell me: when the City Council presents the budget, do they use the subjunctive? No. They use numbers. And numbers are a wall. If you cannot read the text, the numbers are magic. ISOTYPE breaks the magic. It turns the numbers into bricks. You can count the bricks. You don't need to know German to count bricks. You only need to know that you deserve a house."

  This keeps the philosophy intact (empiricism/physicalism), acknowledges the linguistic limitation you spotted, and fits perfectly into the socialist ethos of Red Vienna.
