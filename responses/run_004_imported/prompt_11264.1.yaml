      *   **Rule:** Recommend ($Y$) iff *both* $R$ and $T$ are certified adequate. Certification requires a majority vote on each dimension.
      *   **The Scenario:**
          *   Voter 1 (User): $R=$ Yes, $T=$ Yes $\rightarrow$ Overall $=$ Yes.
          *   Voter 2 (Colleague A): $R=$ Yes, $T=$ No $\rightarrow$ Overall $=$ No.
          *   Voter 3 (Colleague B): $R=$ No, $T=$ Yes $\rightarrow$ Overall $=$ No.
      *   **Outcome 1 (Dimension-by-Dimension):**
          *   $R$: Yes (Voters 1 & 2) $\rightarrow$ Certified.
          *   $T$: Yes (Voters 1 & 3) $\rightarrow$ Certified.
          *   Result: Recommend.
      *   **Outcome 2 (Direct Vote on Recommendation):**
          *   Voter 1: Yes.
          *   Voter 2: No.
          *   Voter 3: No.
          *   Result: Do Not Recommend.
      *   **The Conflict:** The two procedures yield opposite outcomes despite consistent individual rationality.
      *   **User's Questions:**
          1.  Is this a genuine/general phenomenon, or is there an error/inconsistency?
          2.  Is there a principled basis for preferring one procedure over the other?
      *   **User's Background:** Formal theory specialist (pref aggregation). Friends gave conflicting advice (Condorcet cycle vs. impossibility of divergence). User is embarrassed they haven't nailed it yet.

  2.  **Identify the Theoretical Core:**
      *   This is a classic problem in **Judgment Aggregation** (specifically, the *Doctrinal Paradox* or *Discursive Dilemma*).
      *   It is *not* primarily a Condorcet cycle (which relates to preference orderings over alternatives), though they are related in the broader social choice family.
      *   It involves logical connections between propositions ($P$, $Q$, $P \land Q \rightarrow R$).
      *   The specific structure is: Premise-based procedure (dimension-by-dimension) vs. Conclusion-based procedure (direct vote).

  3.  **Address Question 1: Is this genuine?**
      *   Yes, it is genuine. It is the **Doctrinal Paradox** (Kornhauser & Sager, 1986, 1993).
      *   Individual rationality is preserved (everyone follows the rule: Recommend iff $R$ and $T$).
      *   Collective rationality fails (the collective judgment on premises implies $Y$, but the collective judgment on conclusion implies $N$).
      *   It is distinct from Condorcet cycles (which involve intransitive social preferences), though both stem from Arrow-type impossibility results. The friend who said "Condorcet-style cycle" is loosely right about the family of problems but technically imprecise. The friend who said "cannot come apart" is wrong.

  4.  **Address Question 2: Which procedure to trust?**
      *   This is the normative heart of the Judgment Aggregation literature.
      *   **Premise-Based Procedure (PBP):** Vote on $R$ and $T$, derive $Y$.
          *   *Pros:* Respects the logic of the decision rule, ensures consistency on the reasons, often better for epistemic accuracy (if voters are better at judging premises than the complex conclusion).
          *   *Cons:* Can override the majority will on the final outcome (as seen here).
      *   **Conclusion-Based Procedure (CBP):** Vote on $Y$ directly.
          *   *Pros:* Respects majority will on the final decision.
          *   *Cons:* Can lead to inconsistent collective reasons (if you asked them why, they'd disagree), might ignore the structure of the qualification.
      *   **List & Pettit (2002, 2004):** Formalized the impossibility theorem for judgment aggregation.
      *   **Epistemic vs. Democratic:**
          *   If the goal is *truth/accuracy* (is the candidate actually good?), PBP is often superior (Condorcet Jury Theorem logic applied to premises).
          *   If the goal is *representative will* (what does the committee want?), CBP is superior.
      *   **Context Matters:** In a hiring context, "qualifications" usually imply meeting specific criteria. This suggests PBP is normatively stronger because the job description defines the criteria ($R$ and $T$). Hiring someone the majority finds unqualified on *some* dimension just because they pass the aggregate bar might violate the hiring criteria. However, CBP respects the holistic judgment.

