answer: |-
  You have encountered neither an error in tallying nor a failure of individual rationality. You have stumbled directly into one of the most famous problems in social choice theory, distinct from but closely related to the Condorcet paradox. What you witnessed is the **Doctrinal Paradox** (also known as the **Discursive Dilemma**).

  Given your focus on formal theory, I will skip the hand-waving and address this in the language of judgment aggregation. Your embarrassment is unwarranted; this paradox trips up legal scholars, political scientists, and economists precisely because it demonstrates that collective rationality is not guaranteed even when every individual is perfectly rational and consistent.

  ### 1. The Phenomenon: Judgment Aggregation vs. Preference Aggregation

  Your friend who suggested this was a Condorcet cycle was gesturing in the right direction but imprecise on the mechanism. A Condorcet cycle arises in *preference aggregation* when social preferences become intransitive (A > B > C > A) despite individual transitivity.

  Your situation is a problem of *judgment aggregation*. Here, the objects of aggregation are not ordinal preferences over alternatives, but binary judgments on logically interconnected propositions.
  Let $R$ be the proposition "The candidate is adequate on Research."
  Let $T$ be the proposition "The candidate is adequate on Teaching."
  Let $Y$ be the proposition "The candidate is Recommended."

  The departmental rule establishes a logical constraint: $Y \iff (R \land T)$.

  Your subcommittee's profile was:
  *   **Voter 1 (You):** $R=1, T=1 \implies Y=1$
  *   **Voter 2 (Colleague A):** $R=1, T=0 \implies Y=0$
  *   **Voter 3 (Colleague B):** $R=0, T=1 \implies Y=0$

  **The Dimension-by-Dimension Vote (Premise-Based Procedure):**
  We aggregate judgments on the premises first.
  *   Collective $R$: Majority says 1 (You + Colleague A).
  *   Collective $T$: Majority says 1 (You + Colleague B).
  *   Applying the rule to collective judgments: $1 \land 1 \implies Y=1$.

  **The Direct Vote (Conclusion-Based Procedure):**
  We aggregate judgments on the conclusion directly.
  *   Collective $Y$: Majority says 0 (Colleague A + Colleague B).

  **The Paradox:**
  The collective judgments are inconsistent. The majority accepts the premises ($R$ and $T$) and the rule ($R \land T \to Y$), yet the majority rejects the conclusion ($Y$). This violates the principle of **systematicity** (or independence) in judgment aggregation. As proven by List and Pettit (2002), no aggregation function can satisfy universal domain, collective rationality, anonymity, and systematicity simultaneously when the propositions are logically connected like this.

  So, to answer your first question: **Yes, this is a genuine and general phenomenon.** It does not imply anyone voted inconsistently. Every member of your subcommittee satisfied the constraint $Y_i \iff (R_i \land T_i)$. The inconsistency arises solely at the collective level.

  ### 2. Which Procedure to Trust? (Premise vs. Conclusion)

  Your second question is normative: When the procedures diverge, which one holds principled priority? In the literature, these are termed the **Premise-Based Procedure (PBP)** and the **Conclusion-Based Procedure (CBP)**. There is no mathematically "correct" answer, but there are strong normative arguments depending on the context.

  #### The Case for the Premise-Based Procedure (Your Department's Rule)
  In the context of hiring, the PBP is generally considered superior for three reasons:

  1.  **Reason-Giving and Accountability:** The PBP forces the committee to agree on *why* a decision is made. In your case, the CBP outcome (Do Not Recommend) hides a disagreement: Colleague A opposes based on Teaching, Colleague B opposes based on Research. If you hire based on CBP, you might hire a candidate the majority thinks is weak in Research, or weak in Teaching. The PBP ensures that any hired candidate has majority support on *every* required criterion.
  2.  **Epistemic Accuracy:** If we view the committee as trying to track the "truth" about the candidate's quality, the Condorcet Jury Theorem logic often favors the PBP. If voters are more competent at judging specific dimensions ($R$ and $T$) than the holistic outcome ($Y$), aggregating on the premises increases the likelihood of a correct collective judgment (List 2003).
  3.  **Adherence to Mandate:** Your departmental procedure explicitly mandates the PBP ("requires the subcommittee to certify... on two independent dimensions"). The CBP vote called by the chair was technically extraprocedural. In a hiring context, criteria are usually set *ex ante* to prevent bias. Allowing a direct vote on the outcome allows committee members to bypass the criteria (e.g., "I think their research is weak, but I like them, so I'll vote Yes on the whole package"). The PBP binds the committee to the rubric.

  #### The Case for the Conclusion-Based Procedure
  The CBP has democratic appeal. It respects the majority will on the final outcome. In your scenario, two out of three members privately opposed the hire. Recommending the candidate against the private will of the majority can feel like a violation of representative agency. If the committee members are viewed as delegates rather than truth-seekers, the CBP is more faithful to their will.

  ### 3. Recommendation for Future Searches

  Given your specific context—a faculty hire in political science with explicit criteria—I would argue there is a **principled basis for trusting the dimension-by-dimension tally (PBP)** over the direct vote.

  1.  **The Nature of the Good:** In hiring, "quality" is usually defined conjunctively (must be good at research AND teaching). A candidate who is excellent at research but terrible at teaching is often objectively unsuitable for a job requiring both. The CBP risks hiring a candidate whom a majority believes is deficient in at least one essential duty.
  2.  **Strategic Voting:** The CBP is more susceptible to strategic manipulation. Under PBP, I cannot vote "Yes" on the outcome if I think Research is "No," unless I lie about my Research judgment. Under CBP, I can simply vote "Yes" on the outcome to compensate for a "No" on a premise, muddying the waters of evaluation.
  3.  **The "Integrity" of the Rubric:** If your department adopts the CBP when it conflicts with the PBP, you effectively render the dimension criteria advisory rather than mandatory. This weakens the procedural safeguards against bias or idiosyncratic preferences.

  ### Summary

  You did not miss an error. You witnessed the **Doctrinal Paradox**.
  *   **Individual Rationality:** Preserved.
  *   **Collective Rationality:** Violated.
  *   **Procedural Choice:** The Premise-Based Procedure (dimension-by-dimension) is normatively superior for hiring contexts where specific qualifications are mandated, as it ensures the winner meets the criteria by majority consensus on *each* criterion, rather than aggregating overall dissatisfaction that stems from different sources.

  The chair's unease was the intuitive recognition of the democratic deficit (a majority opposed the hire), but their proposed solution (the direct vote) would have violated the logical integrity of the hiring criteria. You should feel confident defending the original tally, perhaps citing Kornhauser and Sager (1986) or List and Pettit (2004) if the faculty needs convincing that this is a feature of aggregation logic, not a bug in your committee's reasoning.

  **References for your reading group:**
  *   Kornhauser, L. A., & Sager, L. G. (1986). "Unpacking the Court". *Yale Law Journal*.
  *   List, C., & Pettit, P. (2002). "Aggregating Sets of Judgments: An Impossibility Result". *Economics and Philosophy*.
  *   Pettit, P. (2001). *A Theory of Freedom*. (Chapter on the Discursive Dilemma).
