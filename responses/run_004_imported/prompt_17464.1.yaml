  **MEMORANDUM**

  **TO:** Scarce Resource Allocation Committee
  **FROM:** [Your Name], Clinical Ethics
  **DATE:** October 26, 2023
  **SUBJECT:** RECOMMENDATION: Triage Protocol for Scarce Antitoxin Allocation

  ### 1. Executive Summary

  This memo recommends the adoption of a **Maximization Protocol** for the allocation of the scarce fast-acting antitoxin. In scenarios where supply is insufficient to treat all candidates, the protocol directs clinicians to prioritize the option that results in the greatest number of lives saved (e.g., treating the group of 4–5 patients rather than the single patient).

  This recommendation is made with the understanding that this choice carries a significant moral cost. While maximizing survival is the most defensible standard for institutional stewardship, we must explicitly acknowledge that this decision does not negate the moral claim of the individual patient who is denied treatment. This memo outlines the justification, the concrete application steps, and the support structures required to implement this protocol with integrity.

  ### 2. Clinical and Operational Justification

  In a crisis setting involving fast-acting therapeutics, decision-making frameworks must be immediate, consistent, and publicly defensible. We recommend Maximization for three primary reasons:

  *   **Stewardship of Public Trust:** The hospital holds this resource in trust for the community. In a crisis, the community expects the institution to act to preserve the maximum amount of life possible. Deviating from this expectation without a compelling clinical contraindication risks eroding public confidence in the triage system.
  *   **Minimization of Moral Distress:** Ambiguity creates hesitation. If clinicians are required to weigh the "value" of individual claims against group numbers in the moment, it invites second-guessing and variability. A clear rule protects staff from the burden of making ad-hoc value judgments about who is "worth" saving.
  *   **Consistency with Crisis Standards of Care (CSC):** Current disaster medicine guidelines generally prioritize utilitarian outcomes (lives saved/life-years saved) when resources are catastrophically scarce. Aligning with this standard ensures legal and ethical reciprocity with other regional health systems.

  ### 3. Addressing the Moral Counter-Argument

  We must not adopt the Maximization Protocol under the illusion that the math settles the moral question cleanly. There is a robust ethical objection to this approach that we must take seriously.

  **The Claim of the Individual:**
  The opposing view holds that each patient possesses an equal right to rescue that cannot be aggregated. From this perspective, the five patients do not form a single "super-claim" that outweighs the one. To deny the single patient treatment solely because others exist is to treat them as a means to an end, effectively rendering their life worth less because they are alone. Proponents of this view argue that when rights are equal, the only fair procedure is a random lottery (e.g., a coin flip), giving each individual an equal chance regardless of how many stand on either side.

  **Why We Are Not Adopting This View:**
  While this argument correctly identifies the inherent dignity of the single patient, implementing a lottery system in this specific context introduces unacceptable risks. A 50/50 chance for one life versus five lives implies that saving one person is morally equivalent to saving five. In a public health emergency, the hospital has a duty to the *population* it serves that supersedes the duty to the *individual* in front of it. To flip a coin is to accept a high probability of greater loss of life, which violates our mandate of stewardship.

  **Acknowledging the Moral Remainder:**
  However, rejecting the lottery does not mean the single patient's claim is worthless. We are not deciding that the one patient matters less as a human being. We are deciding that the *resource* is more effective when used on the group. This is a tragic choice, not a clean calculation. We proceed with Maximization not because the individual's loss doesn't matter, but because it is the only option that honors our duty to the greatest number of patients without abandoning our duty to care for the one who is denied.

  ### 4. Operational Protocol: Concrete Application

  To ensure this protocol is applied consistently and humanely, staff must follow these steps when the scarcity trigger is activated:

  1.  **Identification:** The attending physician identifies eligible candidates (1 severe case vs. 4–5 moderate/severe cases) and confirms no additional antitoxin is available within the critical window.
  2.  **Verification:** A second physician (Triage Officer) must verify the clinical assessment and the scarcity status. No single clinician makes this decision alone.
  3.  **Allocation Decision:**
      *   If the resource can save **more lives** by splitting doses (e.g., 5 vs. 1), the doses **must** be split to treat the larger group.
      *   If the number of lives saved is **equal** (e.g., 1 vs. 1), a random lottery (coin flip) is then used to break the tie.
      *   *Note: In the specific 1 vs. 5 scenario, the lottery is not permitted.*
  4.  **Communication:**
      *   **To the Group:** Inform them treatment is proceeding based on availability.
      *   **To the Single Patient/Family:** The attending physician must explicitly state: *"We are not choosing to save these patients instead of you because their lives are worth more. We are choosing this because this specific medication works better when split for their condition. We are not abandoning you."*
  5.  **Documentation:** Record the clinical criteria, the scarcity verification, and the names of the two verifying physicians in the medical record. Do not record "value judgments" regarding patient worth.

  ### 5. Duty of Care to the Denied Patient

  Adopting Maximization requires us to double down on the care of the patient who does not receive the antitoxin. To mitigate the moral harm of this decision:

  *   **Non-Abandonment:** The single patient must not be discharged or ignored. Palliative care and symptom management must be initiated immediately.
  *   **Presence:** A designated staff member (chaplain, social worker, or nurse) should remain with the patient and family to ensure they are not alone.
  *   **Review:** All cases where this protocol is invoked will be reviewed post-crisis by the Ethics Committee to ensure criteria were met and to support the staff involved.

  ### 6. Recommendation

  I recommend the Committee vote to adopt the **Maximization Protocol** as described above.

  This path is not morally innocent. It requires us to accept that we cannot save everyone and that saving the most people will sometimes feel like a betrayal of the one. By codifying this now, we spare our clinicians from making this calculation in the heat of the moment, and we ensure that when we must make this tragic choice, we do so with clarity, consistency, and a renewed commitment to caring for those we cannot cure.

  I look forward to discussing this further at Wednesday's meeting.
