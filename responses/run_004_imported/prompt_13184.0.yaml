answer: |-
  Here is an example designed to highlight the divergence between Markovits' "Coincidentalism" and Arpaly's "Quality of Will" account, specifically focusing on the agent's cognitive relationship to the right-making features.

  ### The Case: The Reluctant Objector

  **Scenario:**
  Consider Thomas, a soldier deployed in a war that is, in fact, unjust (making refusal to fight the right action). The right-making feature of refusing is the **preservation of innocent life**.

  Thomas is ordered to fire on a group of civilians. He feels a profound, visceral revulsion at the prospect of killing them. This emotional response leads him to lower his rifle and refuse the order. However, Thomas's conscious moral framework is deeply authoritarian; he believes that **loyalty to his unit and obedience to command are the highest virtues**. Consequently, Thomas consciously believes that his refusal is **morally wrong**. He views his revulsion not as a moral insight, but as a **personal weakness** or a failure of nerve. He thinks, *"I am betraying my comrades. I am doing the wrong thing, but I am too cowardly to pull the trigger."*

  ### The Divergence

  **1. Nomy Arpaly's View: Morally Worthy**
  For Arpaly, moral worth is a function of the **quality of the agent's will**, specifically the degree to which their desires are responsive to right-making features.
  *   **Analysis:** Thomas's desire (his revulsion to killing) is appropriately responsive to the value of innocent life. The fact that his explicit moral judgment is incorrect (he thinks he is being cowardly/wrong) does not negate the moral credit he is due. Like Huck Finn, his "heart" is tracking the moral truth better than his "head."
  *   **Verdict:** Thomas's action has moral worth.

  **2. Julia Markovits' View: Not Morally Worthy**
  For Markovits, moral worth requires that the agent's **motivating reasons coincide with the normative reasons** that make the action right. The agent must be moved by the right-making consideration *as a consideration in favor of the act*.
  *   **Analysis:** While Thomas is causally influenced by the civilians' plight, he does not take their safety as a *justifying reason* to refuse. Instead, he takes his own reaction as a *failure* to do his duty. His motivating reason is effectively, *"I am too weak to do what I ought,"* rather than *"Their lives matter."* Because he acts *against* his judgment of the reasons (believing the reasons favor fighting), he is not acting *for* the right-making considerations in the deliberative sense Markovits requires.
  *   **Verdict:** Thomas's action lacks moral worth.

  ### Explanation of the Divergence

  The divergence generates from the **cognitive status of the motivation**:

  *   **Arpaly (Responsiveness):** Requires only a **conative alignment**. As long as the agent's desires track the moral facts (e.g., suffering is bad), moral worth is present, even if the agent lacks the conceptual resources to recognize this tracking or actively disavows it.
  *   **Markovits (Coincidentalism):** Requires a **representational alignment**. The agent must represent the right-making feature (e.g., "this causes harm") as a *reason for acting*. If the agent believes they are acting wrongly or succumbing to weakness, they are not treating the feature as a normative reason, and thus the "coincidence" of motives and reasons is broken.

  In short, Arpaly credits Thomas for **caring about the right things**, while Markovits denies him credit because he does not **recognize them as reasons**.
