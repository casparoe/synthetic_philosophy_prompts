      *   *Mechanism:* Just as a tree exists because it is perceived by God/minds, money has value because it is accepted/used by the economic community. It's anti-materialist in both metaphysics and economics.
      *   *Scholarly Consensus:* Most historians of economic thought agree this isn't a coincidence. Berkeley was consistent.

  5.  **Drafting the Response (Iterative Process):**

