      *   *Implication:* The value of money comes from its circulation and the industry it stimulates, not the metal it's made of (anti-bullionism).
      *   *Relevance:* This sounds remarkably like Chartalism (money as a creature of the state/social agreement) or Functional Money Theory, predating Keynes.

