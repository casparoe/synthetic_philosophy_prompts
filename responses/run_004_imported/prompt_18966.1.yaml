      *   *Fiat Argument:* Money is a social construct, backed by trust/state power, flexible supply to manage economy.
      *   *Berkeley's Stance:* He would likely side *against* the "intrinsic value" argument (gold/silver/crypto scarcity) and *for* the "utility/circulation" argument.
      *   *Nuance:* He wouldn't necessarily support *infinite* printing (inflation), but he would argue that the "backing" isn't the metal/hash, it's the *productive capacity of the nation*.
      *   *Key Takeaway:* Money is a tool for coordination, not a store of value in isolation. If crypto doesn't facilitate industry, it's useless. If fiat does, it's valid regardless of "intrinsic" backing.

