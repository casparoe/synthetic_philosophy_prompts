      *   **The Aaronson Objection (The Intuitive Wall):** The expander graph. High $\Phi$, low intelligence. Defense: "Bite the bullet." Consciousness $\neq$ Intelligence. Critique: This moves IIT toward panpsychism, making it less a theory of *human* consciousness and more a theory of *causal structure*.
      *   **The Pseudoscience Charge (The Sociological Wall):** The 2023 Letter. Is it fair? It stems from the previous two. If a theory predicts consciousness in a grid of diodes but denies it in a behaviorally identical feedforward net, it risks losing contact with the phenomenon it claims to explain.
      *   **Resolving the Tension:** Address the "Unfalsifiable vs. Overgenerates" paradox. They are two sides of the same coin: IIT prioritizes *intrinsic* structure over *extrinsic* function. This is a metaphysical choice, not an empirical discovery.
      *   **The Verdict:** Commit. IIT is not pseudoscience (it's too rigorous), but it is not a standard scientific theory either. It is **axiomatic metaphysics dressed in the formalism of information theory.** It should be judged as philosophy, not physics/neuroscience. This explains why it feels "off" to a physicist expecting causal closure.

