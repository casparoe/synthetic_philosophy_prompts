  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the tension between unfalsifiability and overgeneration?
      *   *Fix:* Make sure to explicitly state that they aren't contradictory. One says "you can't tell the difference from outside," the other says "inside is full of stuff you don't expect." Both stem from Intrinsicality.
      *   *Check:* Is the verdict strong enough?
