      *   **Task:** Write an essay resolving the tension between three specific criticisms of Integrated Information Theory (IIT):
          1.  The Unfolding Argument (Doerig et al.): IIT is empirically idle/unfalsifiable (behaviorally identical systems have different $\Phi$).
          2.  The Aaronson Objection (Expander Graphs): IIT overgenerates consciousness (high $\Phi$ in simple circuits).
          3.  The 2023 Open Letter: IIT is pseudoscience.
      *   **Requirement:** Weigh these against IIT defenses. Address the apparent tension between "unfalsifiable" and "overgenerates." Commit to a real verdict (e.g., "bad science," "live theory," etc.).

  2.  **Deconstruct the Three Criticisms:**
      *   *Unfolding Argument:* If a recurrent network (high $\Phi$) is unfolded into a feedforward network (low $\Phi$) with the *exact same input-output mapping*, behavior cannot distinguish them. IIT says one is conscious, one isn't. Therefore, IIT makes claims that cannot be tested behaviorally. *Charge: Unfalsifiability/Empirical Idleness.*
      *   *Aaronson Objection:* Construct a system (expander graph) with high $\Phi$ but no intuitive signs of intelligence or consciousness. IIT says it *is* conscious. *Charge: Panpsychism/Absurdity/Overgeneration.*
      *   *2023 Open Letter:* Synthesizes these to label IIT pseudoscience. *Charge: Scientific Illegitimacy.*

  3.  **Analyze IIT Defenses:**
      *   *Against Unfolding:* IIT is not behaviorism. It posits consciousness *is* the intrinsic cause-effect structure, not the behavior. If the physical substrate changes (recurrent to feedforward), the intrinsic structure changes, even if extrinsic behavior stays the same. The theory *is* testable via perturbation (TMS-EEG, PCI), not just behavioral observation.
      *   *Against Aaronson:* Bite the bullet. Consciousness doesn't require intelligence. A grid of XOR gates might have "experience," just not a rich or human-like one. The intuition pump is flawed because we conflate consciousness with cognitive capability.
      *   *Against Pseudoscience:* It makes quantitative predictions (PCI index) that correlate with clinical states (vegetative vs. minimally conscious). It is mathematically precise.

