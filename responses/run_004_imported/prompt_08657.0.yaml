  Okay, final plan for the verdict: IIT is **axiomatic metaphysics masquerading as empirical science.** It is not pseudoscience (it's too coherent), but it is not empirically adjudicable in the way physics is. The "Unfolding" and "Aaronson" objections prove that IIT's definition of consciousness is decoupled from observation and intuition, which is the hallmark of metaphysics, not science.

