answer: |-
  Here is an argument structured for a second-year paper context. It takes a hard line against the viability of the Object-Given/State-Given (OGR/SGR) distinction, engages specifically with the Rabinowicz & Rønnow-Rasmussen (2004) patch, and utilizes a "Constitutive Consequence" case to drive the second horn of the dilemma.

  ***

  ### The False Friend: Why the Object-Given/State-Given Distinction Cannot Save Buck-Passing

  The Buck-Passing Account (BPA) of value promises a reductive elegance: to be good is simply to have properties that provide reasons for pro-attitudes. But the Wrong Kind of Reasons (WKR) problem threatens to sever the link between *reasons to favor* and *value*. The standard defense, stemming from Parfit and refined by others, is to restrict the analysans to **Object-Given Reasons (OGRs)**—reasons grounded in the properties of the object—while excluding **State-Given Reasons (SGRs)**—reasons grounded in the properties of holding the attitude (e.g., avoiding the Demon's torture).

  I argue that this distinction is metaethically bankrupt. It faces a destructive dilemma: either the criterion for distinguishing OGRs from SGRs presupposes the very normative notion of value it seeks to analyze (circularity), or it relies on a structural distinction that incorrectly excludes genuine reasons for value (overexclusion). While sophisticated defenses like Rabinowicz and Rønnow-Rasmussen's (2004) "reasons for vs. reasons to want" distinction attempt to navigate this, they fail when confronted with values that are constitutively dependent on the attitudes they sustain.

  #### Horn 1: The Circularity of Normative Relevance

  The first horn of the dilemma attacks the definition of "Object-Given." If we define OGRs merely as reasons citing properties of the object, the distinction collapses immediately. In the Demon Case, the mud has the property *being such that desiring it prevents torture*. This is a property of the mud (a relational property). If the BPA admits relational properties as grounds for value, the Demon's reason counts as an OGR, and the mud comes out as good.

  To avoid this, the defender must claim that only *normatively relevant* properties of the object count. But how do we identify normative relevance without invoking value? If we say, "Properties that make the object valuable," the analysis is viciously circular: *X is good iff there are reasons to favor X based on properties that make X good.*

  If we try to avoid this by appealing to the **fittingness** of the attitude (i.e., OGRs bear on whether the attitude is fitting, SGRs do not), we have not escaped the circle. "Fittingness" is a normative notion co-extensive with value in FA accounts. To define the reasons that constitute value by appealing to a normative filter (fittingness) that is itself defined by value is to explain the obscure by the equally obscure. The OGR/SGR distinction only works if we have a prior, independent grasp of which reasons are the "right kind," which implies we already have a grasp of value. Thus, the distinction cannot do the reductive work the BPA requires.

  #### The Rabinowicz & Rønnow-Rasmussen Patch

  Proponents recognize this threat. The most serious attempt to non-circularly patch the distinction comes from Rabinowicz and Rønnow-Rasmussen (RRR). They argue that the WKR problem arises from a category mistake regarding the *target* of the reason.

  RRR distinguish between:
  1.  **Reasons *for* an attitude:** Considerations that speak to the correctness or fittingness of the attitude (e.g., "The mud is disgusting" is a reason *against* desiring it).
  2.  **Reasons *to want* to have an attitude:** Considerations that speak to the desirability of being in that state, without bearing on its correctness (e.g., "Desiring the mud saves my life").

  RRR argue that the BPA should be read as: *X is good iff there are reasons **for** favoring X.* The Demon's threat provides a reason *to want to desire* the mud, but not a reason *for desiring* the mud. This allegedly solves Horn 1 by grounding the distinction in the psychology of attitudes (what attitudes aim at) rather than a prior notion of value. Belief aims at truth; admiration aims at admirability. Pragmatic reasons don't bear on truth or admirability; they bear on the utility of holding the belief or admiration.

  This is the strongest available defense. However, it succumbs to Horn 2.

  #### Horn 2: Overexclusion and the "Reinforcing Virtue" Case

  Horn 2 argues that any structural definition of OGR/SGR (like RRR's) will be extensionally inadequate. It will classify genuine Right Kind of Reasons (RKRs) as Wrong Kind. This occurs whenever the value of an object is partially constituted by the consequences of the attitude directed toward it.

  Consider the case of **Institutional Authority**, specifically a **Constitutional Judge**.
  Suppose we are analyzing the value of *Judicial Authority*. A judge has authority (a normative status) partly in virtue of being respected by the citizenry. Let's say Judge J is valuable *qua* judge because her rulings maintain social order.
  *   **Reason A:** J ruled according to the law (Object property).
  *   **Reason B:** Respecting J's authority reinforces the stability of the legal institution (Consequence of the state of respecting).

  According to RRR, Reason B is a State-Given Reason (a WKR). It is a reason *to want* to respect J (because doing so produces stability), but it does not bear on the *correctness* of respecting J. RRR would claim that respect is only "correct" if J is admirable/authoritative independently of the respect itself.

  But this misdescribes the metaphysics of institutional value. For institutional roles, **the value is often constitutively dependent on the attitude.** The Judge *is* authoritative partly *because* she is respected. If the citizenry withdraws respect, the authority evaporates. Therefore, the fact that "respecting J reinforces authority" is not merely a pragmatic consequence of the attitude; it is a feedback loop that sustains the very property (Authority) that makes the attitude fitting.

  If we follow RRR and exclude Reason B as a WKR, we strip the object of the very properties that make it valuable. We are left with a "hollow" object-given reason (Reason A) that cannot sustain the value without the state-given reinforcement (Reason B).
  *   If the BPA excludes Reason B, it fails to capture the full grounds of the Judge's value.
  *   If the BPA includes Reason B, it violates the OGR/SGR distinction (since B is grounded in the consequences of the state of respecting).

  This is not a niche case. It applies to **Democratic Will**, **Fashion**, **Money**, and **Relational Goods** (e.g., friendship is valuable partly because we value it). In all these cases, the "state-given" consequence of valuing the object is a necessary condition for the object possessing the "object-given" value.

  RRR might respond that Reason B is still a reason *to want* to respect, not *for* respecting. But this creates a psychologically implausible fragmentation. If I respect the Judge *because* it sustains the rule of law, I am not merely "wanting to respect"; I am respecting *for a reason*. To claim this reason doesn't bear on the "correctness" of the respect assumes that "correctness" is intrinsic to the Judge. But if correctness is relational (dependent on the attitude), then reasons citing the attitude's effects *do* bear on correctness.

  #### Conclusion

  The OGR/SGR distinction is a stopgap that cannot bear the weight of a reductive metaethics.
  1.  **Circularity:** Without a prior theory of value or fittingness, we cannot non-arbitrarily filter "normatively relevant" object properties from "pragmatic" ones.
  2.  **Overexclusion:** When we try to formalize the filter (as RRR do), we exclude reasons that are essential to constitutively relational values.

  The Buck-Passer faces a choice. They can admit that the OGR/SGR distinction relies on a prior normative intuition (abandoning strong reductionism), or they can accept that their analysis of value is extensionally inadequate for a vast class of social and relational goods. Neither option allows the BPA to remain the clean, reductive thesis it claims to be. The "Wrong Kind of Reasons" is not a problem to be solved by distinction-drawing; it is a symptom that value cannot be fully analyzed in terms of reasons without remainder.
