answer: |-
  This is a fantastic question, and honestly, hitting this wall of "wait, do these actually differ in practice?" is a rite of passage for anyone digging into the philosophy of biology. You aren't missing something obvious; you've hit on the fact that in **paradigm cases**, the two accounts are often *extensionally equivalent* (they pick out the same traits as functional).

  However, the reason the field treats this as a fundamental fault line isn't because they usually give different answers about the heart. It's because they are answering **different explanatory questions**, and they handle **normativity** (the concept of "error" or "malfunction") in radically different ways.

  Here is the breakdown of why the distinction matters for your quals, beyond the "vestigial organ" gotcha.

  ### 1. The Normativity Problem (The Big One)
  This is the strongest philosophical argument for the Etiological (Wright/Millikan/Godfrey-Smith) account.

  Biology is rife with normative language: disease, defect, malfunction, error.
  *   **Wright (Etiological):** Normativity is built-in. If the function of the heart is to pump blood *because* ancestors that pumped blood survived, then a heart that doesn't pump is **failing to do what it is supposed to do**. It is a malfunction.
  *   **Cummins (Causal-Role):** Function is just causal contribution. If a heart doesn't pump, it simply lacks the capacity to pump. But why is that a "failure"? In a Cummins framework, a cancerous tumor has a function (it contributes to the capacity of uncontrolled cell growth). A mutation that kills the organism has a function (it contributes to the capacity of genetic drift).

  **Why this matters for quals:** If you adopt Cummins, you struggle to distinguish between *physiology* and *pathology* without smuggling in etiological assumptions. If function is just "what it does now," then a disease is just a different set of functions. The Etiological account preserves the intuition that organisms have a "proper" way of working that can be violated.

  ### 2. Different Explanatory Projects (Why vs. How)
  You mentioned that "history seems decorative." I'd argue history isn't decorative; it's doing a different job. The two accounts are actually tools for different kinds of explanation.

  *   **Wright explains the *presence* of the trait.**
      *   *Question:* Why do hearts exist in this population?
      *   *Answer:* Because pumping blood conferred a fitness advantage ancestrally.
      *   *Type:* Evolutionary explanation.
  *   **Cummins explains the *capacity* of the system.**
      *   *Question:* How does the organism achieve circulation?
      *   *Answer:* By analyzing the heart as a pump within the circulatory system.
      *   *Type:* Mechanistic/Analytical explanation.

  **The Conflict:** The debate isn't just about which definition is "true." It's about what we think biologists are doing when they ascribe functions. Are they telling an evolutionary story (Wright) or a mechanistic story (Cummins)?
  *   *Example:* The spleen.
      *   **Cummins:** In a living human, the spleen filters blood and stores platelets. That's its function in the analysis of the immune/circulatory system.
      *   **Wright:** If the spleen's ancestral selection was for blood storage, but now it's mostly immune regulation, Wright forces us to be precise about *which* selection event we are citing.
      *   *The Clash:* If we find out the spleen was actually a spandrel (never selected for, just a byproduct of gut development), Wright says **it has no function** (even if it does useful things now). Cummins says **it has functions** (whatever it contributes). This isn't a edge case; it applies to huge swathes of genomics (e.g., "junk" DNA that gets transcribed).

  ### 3. The "System Selection" Problem (Cummins' Achilles Heel)
  You noted that Cummins relies on "the capacity of the containing system you're trying to explain." Philosophers have hammered this point: **How do you non-arbitrarily pick the containing system?**

  Any trait contributes to infinite causal chains.
  *   The heart pumps blood.
  *   The heart makes a thumping noise.
  *   The heart occupies space in the chest cavity.
  *   The heart warms the surrounding tissue.

  Under Cummins, *all* of these are functions relative to some system capacity. To say pumping is the "real" function and noise is a "byproduct," you need a principle to select the *relevant* system.
  *   **The Trap:** Usually, to pick the relevant system (the circulatory system vs. the thoracic noise-making system), we implicitly rely on **etiological thinking**. We pick the circulatory system because that's what the heart was *designed by selection* to serve.
  *   **The Implication:** Many philosophers argue Cummins' account is incomplete without Wright. You need history to tell you which causal roles count as "functions" and which count as "mere effects."

  ### 4. Exaptation vs. Mismatch (Beyond Vestiges)
  Your advisor pointed to vestigial organs (history without current function). You rightly dismissed that as edge-case policing. But the reverse case is more damaging to your intuition: **Exaptation (current function without ancestral history).**

  *   **Case:** Bird feathers.
      *   **History:** Selected for thermoregulation.
      *   **Current Role:** Flight.
  *   **Wright:** The function is thermoregulation (originally). Flight is a *current useful effect*, but not the proper function until selection acts on it for flight.
  *   **Cummins:** The function is flight (relative to the capacity of locomotion).

  Why does this distinction matter? Because it changes how we interpret the trait's integration. If feathers are *for* flight (Cummins), we expect them to be optimized for aerodynamics. If they are *for* heat (Wright), we look for insulation optimization.
  In genomics, this is massive. Is a specific gene sequence there because it was selected for coding a protein (Wright), or is it just currently being transcribed and doing something useful (Cummins)? The "Junk DNA" debate is essentially a Wright vs. Cummins fight. ENCODE (Cummins-leaning) said 80% of the genome is functional because it's biochemically active. Evolutionary biologists (Wright-leaning) said "No, most of that is noise; function requires selection."

  ### 5. Summary for Your Quals
  You are right that for "textbook" physiology (hearts, lungs, kidneys), the accounts converge. This is called **extensional equivalence**.

  But for your quals, you should argue that the debate is not about **extension** (what gets labeled 'function'), but about **intension** (what work the concept does).

  1.  **Normativity:** Wright captures biological "error" naturally; Cummins requires extra machinery (like Boorse's Biostatistical Theory) to define disease.
  2.  **Explanatory Aim:** Wright explains *existence*; Cummins explains *operation*.
  3.  **Arbitrariness:** Cummins cannot distinguish function from byproduct without smuggling in etiological criteria to select the "relevant system."
  4.  **Genomics/Spandrels:** In modern biology (especially evo-devo and genomics), the divergence is not rare. Distinguishing "selected effect" from "causal contribution" is the central methodological conflict in defining "functional DNA."

  **The Verdict:** The distinction isn't overhyped, but it is often taught poorly as a "definition contest." It's better understood as a conflict between **evolutionary explanation** (Wright) and **mechanistic explanation** (Cummins). Most modern pluralists (like Godfrey-Smith or Garson) argue we need both, but for different purposes.

  If you want to impress your committee, acknowledge the extensional overlap in paradigm cases, but pivot hard to the **normativity** and **genomics** implications. That's where the philosophical rubber meets the biological road.
