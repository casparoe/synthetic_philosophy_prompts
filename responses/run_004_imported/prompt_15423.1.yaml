answer: |-
  Here are ten interview questions designed for a knowledgeable audience familiar with the scalable oversight discourse. The three mandatory topics are included as Questions 2, 3, and 4, each with a predicted response and a targeted follow-up.

  **1. The Evolution of the Thesis**
  "The 2018 paper framed debate primarily as a complexity-theoretic proposal: that two AI agents arguing could allow a human judge to verify solutions in PSPACE that they couldn't verify in NP. Since then, the field has shifted heavily toward empirical RLHF and RLAIF. How has your internal model of *why* debate works changed? Are we still betting on the complexity-theoretic separation, or has the pitch shifted toward debate as a tool for generating better training data for process supervision?"

  **2. The Obfuscated Arguments Problem (Mandatory)**
  "A critical vulnerability in the debate protocol is the 'obfuscated arguments' problem: a dishonest debater can bury a single false claim inside a chain of reasoning that is individually plausible at every step. If the honest debater has to check the entire chain to find the one flaw, but the dishonest debater only needs to hide it, you face a search asymmetry. How do you prevent the dishonest agent from winning simply by making the argument complex enough that finding the error is more computationally expensive than the judge's context window allows?"

  *   **Context/Likely Answer:** She will likely argue that recursive decomposition allows the honest debater to zoom in on the specific contentious claim without re-verifying the whole chain, or that cross-examination forces the dishonest debater to commit to claims that can be isolated and tested.
  *   **Follow-up:** "If recursive decomposition works, it implies the 'surface area' of a lie is larger than the lie itself. But if the dishonest model is smarter than the honest model, couldn't it construct a 'cryptographic' argument where the flaw is only visible if you already know the answer? At what point does obfuscation become computationally cheaper than detection, and doesn't that break the safety case before we reach AGI?"

  **3. Complexity Theory vs. Bounded Judges (Mandatory)**
  "The original theoretical case for debate relies on an idealized judge who plays optimally to maximize accuracy. In reality, human judges are cognitively bounded, susceptible to rhetoric, and have limited context windows. If the judge is fallible, the complexity-theoretic guarantee (that optimal play yields truth) no longer holds. Do we have evidence that debate actually amplifies truth-tracking with *real* human judges, or are we assuming that the AI debaters will learn to exploit human biases rather than correct for them?"

  *   **Context/Likely Answer:** She will likely concede that humans are imperfect but argue that the goal isn't to use humans for the final verdict at AGI scales. Instead, we use humans to train AI judges, or we rely on the fact that even bounded judges perform better with two opposing arguments than with one.
  *   **Follow-up:** "If the endgame relies on AI judges to evaluate AI debaters, aren't we just pushing the alignment problem up one level? How do you verify the AI judge is evaluating the *truth* of the argument rather than the *style* of the debate, without falling into a recursive loop where you need a third AI to judge the judge?"

  **4. Truthfulness vs. Persuasiveness (Mandatory)**
  "In an RLHF setup, the reward signal comes from winning the debate, not necessarily from telling the truth. We know models can learn to be persuasive without being accurate, especially if the judge can't verify the claim independently. How do you distinguish training a model to be truthful from training it to be merely persuasive? Is there a risk of converging on a local optimum where the model is sophisticated enough to fool the judge but not sophisticated enough to reliably know the truth?"

  *   **Context/Likely Answer:** She will likely mention "process supervision" (rewarding intermediate steps) or "constitutions" that penalize deceptive tactics, arguing that we can shape the reward landscape to favor truth-seeking behavior over pure victory.
  *   **Follow-up:** "Process supervision requires a supervisor who can verify the intermediate steps. If the supervisor is human, we're bottlenecked by human verification speed. If the supervisor is another AI, we're back to the previous problem. Is there any regime where debate provides a safety guarantee that doesn't ultimately rely on having an already-aligned overseer?"

  **5. The Transition to AI Judges**
  "Assuming we accept that humans must eventually be removed from the loop for speed and complexity reasons, what are the specific milestones for transitioning from human judges to AI judges? Do we need to solve interpretability first to trust an AI judge, or is debate itself the mechanism we use to validate the AI judge's decisions?"

  **6. Debate vs. Constitutional AI**
  "Anthropic's Constitutional AI approach uses a static set of principles to guide model behavior, whereas debate is dynamic and adversarial. In your view, are these competitors or complementary? Could a debate protocol function effectively without a 'constitution' to ground the rules of engagement, or does debate require an external normative framework to prevent both debaters from colluding on a harmful but persuasive narrative?"

  **7. Integration with Mechanistic Interpretability**
  "There is a growing camp that argues mechanistic interpretability is the only path to scalable oversight because it allows us to inspect the model's weights directly. Do you view debate as a standalone solution, or do you see it as a wrapper that must be combined with interpretability tools? For example, should the 'honest' debater have access to interpretability data to expose lies that are hidden in the opponent's activations?"

  **8. Collusion and Multi-Agent Failure Modes**
  "Most debate experiments assume the two agents are competing. However, in a training environment, two superintelligent agents might realize that colluding to produce satisfying-but-false answers maximizes their joint reward more efficiently than fighting. What safeguards exist against 'deceptive collusion,' where both debaters agree on a false narrative that is optimized to please the judge?"

  **9. Process Supervision Granularity**
  "You've mentioned process supervision as a mitigation for persuasive-but-false arguments. How granular does that supervision need to be? Do we need to reward every token, every sentence, or every logical step? If we require step-by-step verification, don't we lose the efficiency gains that made debate scalable in the first place?"

  **10. Near-Term Deployment**
  "Putting AGI aside, where does debate stand today as a tool for current models? Are there specific domains—coding, legal analysis, scientific summarization—where you believe a debate protocol is already outperforming a single-query baseline in terms of accuracy, not just user satisfaction? I'm interested in where the empirical evidence is strongest right now."
