          *   *Verdict:* Correct. This describes Equalized Odds (FPR + FNR parity).
      *   *Claim 3:* "Chouldechova and Kleinberg et al. showed that, except in the knife-edge case where the base rate of reoffending is identical across groups or the score is a perfect predictor, no score can satisfy calibration and balance at once..."
