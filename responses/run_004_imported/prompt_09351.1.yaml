      Northpointe: "The tool is calibrated." (Score 7 = 70% recidivism for both).
      Candidate says: ProPublica found poor calibration. Northpointe leaned on balance.
      Yes, this is definitely swapped.

      *Scoring Decision:* I will give a 6/10. The theoretical understanding is strong (which is the primary learning objective of "impossibility results"), but the factual application is inverted. In a real audit, citing the wrong party's argument is a credibility killer.

  5.  **Drafting the Feedback:**
