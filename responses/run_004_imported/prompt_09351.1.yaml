  2.  **Analyze the Subject Matter (Fairness Impossibility Results):**
      *   **Core Concept:** The incompatibility of certain fairness metrics (specifically Calibration and Error Rate Balance) when base rates differ.
      *   **Key Papers:** Kleinberg, Mullainathan, Raghavan (2016) "Inherent Trade-Offs in the Fair Determination of Risk Scores" and Chouldechova (2017) "Fair prediction with disparate impact: A study of bias in recidivism prediction instruments".
      *   **The Metrics:**
          *   *Calibration (within groups):* $P(Y=1 | S=s, A=a) = P(Y=1 | S=s)$. Essentially, if you say 70% risk, 70% should reoffend, regardless of group $A$.
          *   *Balance (Error Rate Parity):* Equal False Positive Rates (FPR) and Equal False Negative Rates (FNR) across groups. Sometimes called "Equalized Odds".
      *   **The Impossibility Theorem:** You cannot have Calibration + Equalized Odds (Balance) simultaneously unless:
          1.  Base rates are equal ($P(Y=1|A=0) = P(Y=1|A=1)$).
          2.  The predictor is perfect (AUC = 1).
      *   **The COMPAS Dispute (ProPublica vs. Northpointe):**
