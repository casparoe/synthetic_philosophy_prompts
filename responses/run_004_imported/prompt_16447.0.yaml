  **Justifications**

  *   **Statement 1 (Score: 1):** Owen correctly identifies a disparity in **False Positive Rates (FPR)**, a standard metric for group fairness (Equalized Odds). Burdening non-defaulters in Group B with more manual reviews is a tangible harm. However, his proposed solution (group-specific thresholds) is often legally prohibited (disparate treatment) in jurisdictions like the US under the Equal Credit Opportunity Act, making his "fix" operationally risky even if ethically motivated.
  *   **Statement 2 (Score: 2):** Naomi is mathematically correct. If a model is **calibrated** (a score of $X$ implies the same probability of default regardless of group) and the **base rates** differ between groups, it is mathematically impossible to also achieve FPR parity. Enforcing equal flag rates among non-defaulters would indeed require applying different risk thresholds to the same score based on group membership.
  *   **Statement 3 (Score: 2):** Owen correctly identifies the **Label Bias** problem. Calibration is only as good as the target variable. If historical lending data reflects biased decisions (e.g., Group B was historically over-lended to or under-served), the "default" label is contaminated. Calibrating to a biased target perpetuates historical injustice, so calibration alone is not a sufficient defense of fairness.
  *   **Statement 4 (Score: 1):** Naomi is pragmatically and legally astute. Using group membership explicitly in decision logic (group-specific thresholds) is often illegal. Her suggestion to fix upstream features or labels is the theoretically "cleaner" solution for fairness. However, she scores lower because upstream fixes are often impossible for an engineering team (you cannot change historical data), leaving downstream mitigation as the only viable lever, even if imperfect.

  **The Missing Point: The Impossibility Theorem**

  Owen and Naomi are talking past each other because they are optimizing for two mutually exclusive mathematical definitions of fairness. This is known as the **Impossibility Theorem of Fairness** (Kleinberg et al., 2016; Chouldechova, 2017).

  When base rates differ between groups (as Owen notes in point 3), you cannot simultaneously satisfy:
  1.  **Calibration** (Naomi's priority: a score means the same risk for everyone).
  2.  **Error Rate Balance** (Owen's priority: False Positive Rates are equal across groups).

  They are not arguing about facts; they are arguing about which mathematical constraint to relax. The "adjudication" isn't about who is right, but about which harm the organization is willing to tolerate:
  *   **Side with Owen:** You accept that two people with the exact same predicted risk score might be treated differently to ensure group-level error parity. (Risk: Disparate Treatment).
  *   **Side with Naomi:** You accept that one group will suffer higher false positive rates to ensure that risk scores remain individually meaningful and group-blind. (Risk: Disparate Impact).

  **Recommendation:** Do not simply retune thresholds by group (Owen) without legal counsel, as this invites regulatory action. Do not rely solely on calibration (Naomi) if the labels are known to be biased. The engineering solution is usually **feature engineering**: remove or decorrelate features that proxy for group membership to reduce the base rate disparity in the model's predictions without explicitly conditioning on the protected attribute.
