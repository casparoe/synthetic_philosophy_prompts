  2.  **Analyze the Mathematical/Philosophical Content:**
      *   **The Game:** This is indeed the *Pasadena Game* (introduced by Nover & Hájek, 2004).
      *   **Payoff:** $X_n = (-1)^{n+1} \frac{2^n}{n}$.
      *   **Probability:** $P(n) = (1/2)^n$.
      *   **Expected Value Calculation:**
