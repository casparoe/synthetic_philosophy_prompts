prompt: |-
  Ok so I've been diving into the whole COMPAS / ProPublica recidivism thing for a fairness-in-ML review at work, and I think I finally get why everyone was talking past each other. Northpointe's defense was that their tool was well-calibrated across race, and ProPublica's complaint was that the error rates werent balanced across race -- and apparently there's an actual proof that you literally can't have both unless the base rates for the two groups happen to match (which they don't, for recidivism). So doesn't that basically mean the whole "is COMPAS racist" debate was pointless from the start? Like neither side was technically wrong, they were just measuring "fair" in mutually exclusive ways, so any scoring model was guaranteed to be "unfair" by someone's definition no matter how its built. Feels like this pretty much collapses algorithmic fairness down to "pick whichever metric you like, its arbitrary either way" -- is that basically the right takeaway or am I missing something here?
