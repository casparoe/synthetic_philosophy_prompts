answer: |-
  You have hit on the single most potent philosophical objection to Harsanyi's Aggregation Theorem, often associated with the work of Peter Diamond (1967) and later John Broome. Your hunch is correct: the theorem does not *derive* utilitarianism from neutral rationality; it *defines* social value in a way that excludes non-welfarist concerns like procedural fairness by fiat.

  The "smuggling" happens in the **Ex-Ante Pareto Axiom**.

  Here is the strongest version of that objection, structured for your piece, with a concrete case that isolates the mechanism.

  ### The Core Objection: The Ex-Ante Pareto Trap

  Harsanyi's theorem requires that if every individual is indifferent between two lotteries, society *must* be indifferent. This seems innocuous. However, it assumes that **individual expected utility is the only currency of social value.**

  If there is a social value—like "procedural justice" or "equality of status"—that exists *independently* of how much individuals value it in their private utility functions, Harsanyi's Pareto axiom forbids the social planner from counting it. The theorem doesn't prove that procedural fairness doesn't matter; it assumes that if individuals don't care about it (or can't price it into their expected utility), it *cannot* matter.

  ### The Concrete Case: The Fair Coin vs. The Natural Hazard

  **The Setup:**
  Imagine a society of two people, Alice and Bob. There is one indivisible, life-saving resource (a kidney). Both need it equally; both value it equally (Utility = 1 if they get it, 0 if they don't). Both are purely self-interested and risk-neutral.

  **The Options:**
  *   **Lottery A (The Fair Coin):** A public, institutional coin toss determines who gets the kidney. It is a 50/50 chance. The mechanism is explicitly designed to treat both citizens as equals.
  *   **Lottery B (The Natural Hazard):** A random natural event (e.g., whose blood type happens to match a donor that arrived by chance) determines who gets the kidney. Statistically, this also results in a 50/50 chance for Alice and Bob. However, there is no *agency* or *commitment* to equality involved; it is mere brute luck.

  **The Individual Preferences:**
  Because Alice and Bob are purely self-interested and risk-neutral, they only care about their probability of survival.
  *   Alice's Expected Utility in A: $0.5$
  *   Alice's Expected Utility in B: $0.5$
  *   *Result:* Alice is indifferent between A and B.
  *   Bob is similarly indifferent.

  **The Harsanyi Constraint:**
  Here is where the theorem bites. The **Pareto Axiom** states: *If every individual is indifferent between two social states, society must be indifferent.*
  *   Since Alice and Bob are indifferent, Harsanyi's Social Welfare Function *must* rank Lottery A and Lottery B as equal.
  *   The theorem mathematically forces the conclusion that the **Fair Coin** has no more social value than the **Natural Hazard**.

  **The Moral Intuition:**
  Most non-utilitarian theories (and many common-sense intuitions) hold that Lottery A is morally superior. Why? Because Lottery A embodies a **duty of equal concern**. It treats citizens as agents deserving of a fair chance, whereas Lottery B treats them as passive subjects of fate. The *process* (the institutional commitment to fairness) has intrinsic moral value, distinct from the *outcome* (who gets the kidney).

  **The Verdict:**
  Harsanyi's theorem declares this intuition irrational. By forcing social indifference whenever individual expected utilities match, the theorem **axiomatically excludes procedural fairness** from the social calculus. It doesn't prove that fairness is irrelevant; it defines "social good" in a way that makes it impossible for fairness to register unless individuals happen to get a warm fuzzy feeling (utility) from it.

  ### Where the Axioms Smuggle the Conclusion

  You asked exactly where the "innocent" axioms do the work. It is specifically in the **domain of the Pareto comparison**.

  1.  **Reduction of Description:** Harsanyi requires lotteries to be described solely by probability distributions over *outcome utilities*. The "Fair Coin" and "Natural Hazard" are, mathematically, the exact same object in Harsanyi's framework ($L = \{0.5, 0.5\}$). The theorem forbids you from labeling them differently in the social function.
  2.  **Supervenience:** The theorem forces social value to *supervene* entirely on individual preferences. If the individuals don't value the "fairness" of the coin (perhaps they don't understand it, or they are purely selfish), the social planner is *blind* to it.

  ### How to Frame This in Your Piece

  The strongest way to phrase this is that Harsanyi's theorem is not a **derivation** of utilitarianism, but a **restatement** of welfarist individualism.

  *   **The Claim:** "Accept these rational axioms, and you must be a utilitarian."
  *   **The Reality:** "Accept that *only* individual expected utility matters (Pareto), and *only* individual expected utility will matter in the output."

  The theorem is a tautology: *If you assume there are no social values beyond individual welfare preferences, then social welfare is just the sum of individual welfare preferences.*

  By waving this theorem around as a "proof," EA-adjacent writers are often bypassing the actual moral argument. They are using a mathematical constraint to rule out deontological or egalitarian concerns (like process fairness) before the debate even begins. The "proof" works only if you have already accepted that a fair coin toss is morally identical to a rigged one, provided the odds are the same. But that is precisely the point in dispute.
