      *   If individuals (or the social observer) care about *how* the outcome is reached (deontological constraints, fairness, rights), the vNM framework might not capture it, OR the Pareto axiom forces the social observer to ignore it if individuals are modeled as pure outcome-maximizers.
      *   *Crucial Insight:* The theorem assumes the *description of the alternatives* is exhaustive. If "fairness" is a property of the lottery itself, it needs to be in the utility function. But Harsanyi's setup often treats the lottery merely as a probability distribution over *final states*. If the "process" isn't a final state, it gets washed out.
