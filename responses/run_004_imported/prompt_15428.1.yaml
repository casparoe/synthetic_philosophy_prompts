answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Style Guide Update: Language for Climate Attribution Stories

  **Context**
  Following our discussion regarding the recent heat wave coverage, we have identified a conflict between logical precision and scientific framing. Our copy editors correctly note that strict "but-for" causality implies the event would not have occurred at all without the factor in question. Our climate reporter correctly notes that the *specific characteristics* defining this newsworthy event (its record intensity, duration, and impacts) would not have existed without anthropogenic warming.

  **Decision**
  To resolve this without diluting our accuracy or our impact, we are adopting a standard of **Attribution of Characteristics**. We will not treat weather events as binary occurrences (happened/didn't happen), but as composite phenomena defined by their metrics.

  **New Style Guide Entry: Climate Attribution**
  > **Causation vs. Modification:** Do not state that climate change "caused" a weather *phenomenon* (e.g., "caused the heat wave") unless qualified. Heat waves, storms, and floods occur naturally.
  >
  > **The Rule:** Use "caused" only when referring to the *excess severity, likelihood, or impacts* attributable to warming. The headline and lead must specify *what* about the event was caused: the increased probability, the added intensity, or the specific threshold breach.
  >
  > **Rationale:** This satisfies logical rigor (the weather pattern existed independently) while honoring physical reality (the newsworthy severity did not).

  **Examples**
  *   **Avoid:** "Climate Change Caused This Heat Wave." (Implies the phenomenon itself is new.)
  *   **Avoid:** "Climate Change Contributed to Heat Wave." (Vague; minimizes the quantifiable link.)
  *   **Approved:** "Climate Change Caused the Record-Breaking Intensity of Heat Wave."
  *   **Approved:** "Human Warming Made This Heat Wave Five Times More Likely."
  *   **Approved:** "Climate Change Caused the Extra 2 Degrees in Recent Heat Wave."

  **Implementation**
  This rule applies to all headlines, decks, and lead paragraphs in attribution stories. It allows us to use the strong verb "caused" where it is logically defensible (the *excess* heat) while maintaining the precision our editors require regarding the *baseline* weather.

  Please review and confirm by EOD Friday so we can update the guide for the next news cycle.
