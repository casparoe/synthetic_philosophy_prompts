answer: |-
  This is a classic and deeply insightful dispute in formal epistemology. You and your friend have effectively recreated a debate that has occupied philosophers of probability for the last forty years.

  The short answer is: **You are right to be suspicious, but your friend is right about the history.** The Reflection Principle *cannot* be a purely formal coherence constraint (like the axioms of probability or even Conditionalization) without leading to absurdities like the "drugged self" case. The restriction to "reliable experts" is not an *ad hoc* patch, but it does fundamentally change the status of the principle from a rule of logic to a substantive norm of rationality.

  Here is the breakdown of why the unrestricted principle fails, why the "expert" restriction is principled rather than circular, and how the Dutch Book argument actually relies on this restriction implicitly.

  ### 1. The Fatal Flaw in the Unrestricted Principle
  Your "credence-scrambling drug" example is the standard counterexample (often attributed to David Christensen or Frank Arntzenius). It demonstrates that **temporal consistency does not entail epistemic deference.**

  If the Reflection Principle were merely a diachronic cousin of Conditionalization derived from pure coherence, it would apply to *any* predictable change in credence.
  *   **The Setup:** Let $P_t$ be your credence now. Let $P_{t+1}$ be your credence tomorrow.
  *   **The Drug Case:** You know with certainty that tomorrow you will be drunk, and your credence in $H$ (e.g., "I can drive safely") will be 0.9. Currently, your credence is 0.1.
  *   **Unrestricted Reflection:** $P_t(H \mid P_{t+1}(H) = 0.9) = 0.9$. Since you are certain $P_{t+1}(H) = 0.9$, this implies $P_t(H) = 0.9$.
  *   **The Absurdity:** You are rationally required to adopt the drunk credence *now*.

  This shows that Reflection is not a constraint on *belief states* in isolation; it is a constraint on how you relate to your future self *as an epistemic agent*. If you know your future self is epistemically compromised, you should not defer. Therefore, the principle cannot be derived solely from the mathematics of betting coherence; it requires a premise about the *quality* of the future belief.

  ### 2. Is the "Expert" Restriction Ad Hoc?
  Your friend is correct that van Fraassen (1984) introduced the principle with the caveat that it applies when you regard your future self as an **expert**. The crucial question is whether "expert" is defined circularly.

  *   **Circular Definition:** "I should defer to my future self because I should defer to my future self." (This makes the principle vacuous).
  *   **Principled Definition:** "I should defer to my future self because I expect them to possess **evidence** that I currently lack."

  The restriction is **principled**, not *ad hoc*, provided we ground it in the **Value of Evidence** (I.J. Good, 1967). Good proved that if you expect to receive free, relevant evidence, your current expected utility for making a decision *after* seeing the evidence is higher than making it before.

  Translated to credences: If you expect your future credence to be the result of **conditionalization on new evidence**, then your current credence should be the weighted average of your possible future credences (the Martingale property). In this specific context, Reflection holds.

  In the drug case, you do *not* expect your future credence to be the result of evidence acquisition. You expect it to be the result of a causal, reliability-degrading process. Therefore, the "expert" condition is not met. This distinction (Evidence vs. Causal Scrambling) is independent of the Reflection Principle itself, so invoking it is not circular.

  ### 3. The Dutch Book Argument: Where it Hides the Assumption
  Your friend argues that the Dutch Book argument (DBA) justifies Reflection just as it justifies Conditionalization. This is the crux of the disagreement.

  The DBA for Conditionalization works because it assumes you will update on a partition of propositions that you treat as **exhaustive and mutually exclusive evidence**.
  The DBA for Reflection works by constructing a bet today and a bet tomorrow. If your current credence ($p$) differs from your expected future credence ($r$), a bookie can sell you a bet today and buy it back tomorrow (or vice versa) to lock in a loss.

  **However, the DBA for Reflection fails in the drug case.** Why?
  For the Dutch Book to guarantee a loss, the bookie must be able to rely on your future self to accept the bet at the future credence *as a fair price for truth*.
  *   If you know you will be drunk, you know your future self will accept bets at unfair prices (e.g., paying \$0.90 for a ticket worth \$1.00 on a claim that is likely false).
  *   A sophisticated agent, knowing they will be drunk, would **pre-commit** to refusing bets tomorrow, or they would recognize that the "future credence" is not a reliable betting quotient.
  *   The DBA implicitly assumes that the future credence represents a **trustworthy valuation**. If you know the future valuation is corrupted, the "guaranteed loss" calculation breaks down because the future transaction is no longer viewed as epistemically authoritative by the *current* self.

  So, the DBA does not prove unrestricted Reflection. It proves: *If you regard your future betting quotient as reliable, you must align with it.* This brings us back to the "expert" condition.

  ### 4. Can the Coherence Argument be Repaired?
  You asked if the argument can be repaired without collapsing into circularity or becoming vacuous. The consensus in contemporary epistemology (championed by David Christensen in his 1991 paper *"Clever Bookies and Coherent Beliefs"*) is:

  1.  **Reflection is not a coherence constraint.** Unlike the probability axioms (which are synchronic) or Conditionalization (which is a rule for updating on evidence), Reflection is a **substantive normative principle**. It tells you how you *ought* to regard your future self, not just how to keep your beliefs consistent.
  2.  **It binds only rational change.** To avoid circularity, we define the scope of Reflection not as "changes I defer to," but as "changes resulting from anticipated learning."
  3.  **The Repair:** The principle should be formulated as:
      > $P_t(A \mid P_{t+1}(A) = r \text{ \& } \mathcal{E}) = r$
      > Where $\mathcal{E}$ is the condition that the change from $t$ to $t+1$ is driven by the acquisition of evidence (and not forgetting, drugs, or bias).

  Is this vacuous? No, because $\mathcal{E}$ can be specified independently (e.g., "I will perform a measurement," "I will read the newspaper").
  Is it circular? No, because "acquisition of evidence" is defined by the causal/epistemic link to the world, not by the fact of deference.

  ### 5. The Verdict for Your Debate
  You can settle the argument with the following synthesis:

  *   **Your Friend is right** that van Fraassen included the restriction from the start. It wasn't a patch added after the drug objection; it was part of the original conception. Van Fraassen viewed Reflection as a constraint on *opinion* regarding one's own rationality.
  *   **You are right** that the principle smuggles in something stronger than ordinary coherence. It assumes that you regard your future self as **epistemically superior or at least equal** regarding the proposition in question.
  *   **The Dutch Book Argument** does not justify the unrestricted principle. It only justifies the principle *given* the assumption that the future self is a reliable trustee.
  *   **Conclusion:** Reflection is not a "diachronic cousin of conditionalization" in the sense of being a purely formal rule of consistency. It is a **norm of epistemic trust**. It tells us: *If you expect to be rational and better informed later, you should defer to that future self now.* If you expect to be irrational (drunk), the principle does not apply.

  **Recommendation:**
  If you want to clinch the argument, cite **David Christensen (1991)**. He explicitly argues that Reflection is distinct from Conditionalization because it is vulnerable to the "known irrationality" objection. He concludes that Reflection is a substantive norm of rationality, not a formal coherence constraint. This validates your worry that the principle requires more than just Dutch Book coherence, while validating your friend's note that van Fraassen intended it to apply only to "reliable" future opinions.

  **Summary for your friend:** "The Dutch Book argument only works if we assume the future bets are made by a reliable agent. If we know the future agent is compromised, the bookie can't guarantee a loss because the current agent won't value the future betting quotient. So the 'expert' restriction isn't ad hoc; it's a necessary precondition for the Dutch Book argument to function at all."
