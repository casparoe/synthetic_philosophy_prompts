answer: |-
  Good evening, everyone. For those who don't know me, I'm the Best Man. And for those who noticed the tense silence at the head table earlier, yes, the Groom and I were arguing. Again.

  We were debating a question that sounds dry until you realize it's actually about everything: *When you say you know something is true, where does the reasoning stop?*

  The Groom is a foundationalist. He believes that if you ask "Why?" enough times, you eventually hit bedrock. A solid, self-evident truth that says, "Stop looking. It just *is*." He thinks love should be like that. He wants a reason for his happiness that sits still, like a statue.

  But I'm an infinitist. And looking at him and his partner tonight, I am more convinced than ever that he's wrong. Because love isn't a statue. It's not a bedrock. It is a horizon that keeps moving as you approach it.

  So, in the spirit of settling this argument once and for all, I'd like to propose a toast to the couple. But I have to warn you: I cannot give you a single, foundational reason why they belong together. Because that would be a lie.

  I could say I'm raising this glass because I've seen how happy he makes her.
  *But* that happiness is only significant because it's a kind of happiness that survives bad days.
  *And* it survives bad days because they have built a language of patience that translates frustration into understanding.
  *And* they built that language because they both value the other's growth more than their own ego.
  *And* they value that growth because they recognize that a person is never a finished product.

  Do you see what's happening? If I stopped at "he makes her happy," I would be ignoring the work it took to get there. If I stopped at "patience," I'd be ignoring the intent behind the patience. Every reason I offer for their love is only true because of a deeper reason beneath it.

  Now, the Groom's objection earlier was that a finite mind—like ours—can't hold an infinite chain of reasons. He said, "You can't live your life waiting for the next justification."

  But look at them.

  They don't hold all the reasons at once. They don't need to. Infinitism doesn't require you to see the end of the road; it only requires that you trust there *is* more road when you take the next step.

  When he looks at her, he doesn't stop at her smile. He sees the kindness that made the smile, and the history that shaped the kindness, and the future that the kindness promises.
  When she supports him, she isn't just supporting the man he is today. She is supporting the man he is becoming, which is supported by the dreams he hasn't spoken yet, which are supported by the safety she provides to speak them.

  If their love rested on a foundation, it would be vulnerable to cracks in that foundation. If they loved each other *only* because they are beautiful, time would break it. If *only* because they are successful, failure would break it. If *only* because they are compatible, change would break it.

  But they don't rest on a foundation. They rest on a momentum.

  And that is why I am confident—epistemologically and romantically confident—that this marriage will last. Because when the hard times come, and they will, they won't have to scramble to find a bedrock reason to stay. They won't have to say, "I love you because..." and hope the sentence ends with something solid.

  Instead, they will simply keep going.
  "I love you because we survived this."
  "Which matters because we are stronger for it."
  "Which matters because we have more to build."
  "Which matters because..."

  The chain never breaks, because it never claims to be finished.

  So, Groom, I know you wanted a stop sign. I know you wanted a final answer. But I'm giving you something better. I'm giving you a journey that doesn't require a destination to be valid.

  Please raise your glasses.

  To the couple.
  May your reasons for loving each other always be deeper than the reasons you had yesterday.
  May you never run out of "because."
  And may you find that the only thing more infinite than the reasons you have for each other... is the time you'll have to discover them.

  To the bride and groom!
