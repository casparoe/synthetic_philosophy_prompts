  ### Reasoning by Move

  **Move 1: Dana's Admission (-2)**
  Dana's claim here is essentially that it is acceptable to endorse a book as "fully realized" without reading the full text. This scores poorly because the specific language she used ("fully realized," "major new voice") makes claims about the *whole* of the work. A novel's realization often hinges on its resolution, pacing in the third act, or thematic payoff—none of which can be verified by skimming. To assert certainty about the whole while only experiencing the part is a categorical misrepresentation. It treats the blurb as a marketing token rather than an endorsement of craft, which violates the implicit contract between the blurbist (whose name adds value) and the reader (who trusts that name).

  **Move 2: Theo's Objection (2)**
  Theo hits the core ethical and epistemic problem. In philosophy, this touches on the problem of **aesthetic testimony**. While we can accept factual testimony secondhand (e.g., "This bridge is safe"), aesthetic judgment is traditionally thought to require first-hand experience because it relies on personal perception and feeling. Theo correctly identifies that Dana isn't just passing along data; she is signing her name to a *perception* she didn't have. By removing the "hedge" (e.g., "I'm told this is..."), she appropriates an experience that isn't hers. This is the strongest move in the exchange because it isolates the specific mechanism of the dishonesty: the framing of the judgment as first-person settlement.

  **Move 3: The Restaurant Analogy (-1)**
  Dana attempts to normalize her behavior by comparing it to casual conversation. This is a weak analogy (a category error). A verbal recommendation to a friend is low-stakes, informal, and often implicitly understood as hearsay ("I heard the pasta is great"). A blurb is a formal, printed endorsement attached to a commercial product, carrying the weight of the author's professional reputation. It functions more like a celebrity endorsement than a dinner tip. Furthermore, if Dana had written the blurb as, "My friend says this is incredible," the analogy would hold. By writing it as her own judgment, she breaks the parallel. It's not *clearly* wrong (-2) because it highlights how we rely on testimony constantly, but it fails to account for the difference in context and stakes.

  **Move 4: The "Everyone Does It" Defense (-1)**
  Dana shifts from defending the act to attacking the system. This is a classic *tu quoque* (you also) or appeal to common practice fallacy. Just because critics recycle consensus doesn't make the act honest; it might just mean the industry is broadly deceptive. However, I don't score this a -2 because Dana raises a valid sociological point: the literary ecosystem *does* run on recycled consensus and inflated language. She is correctly identifying that Theo's moral standard is incompatible with current industry norms. While this doesn't ethically exonerate her, it does highlight that Theo is demanding individual integrity in a system designed to obscure it. It's a deflection, but an insightful one.

  ### What They're Missing: The Function of the Blurb

  Both Dana and Theo are arguing past each other because they disagree on what a blurb *is*.

  Theo is treating the blurb as a **constative speech act**—a statement meant to describe the truth of the book's quality. By that standard, he is absolutely right: Dana lied.

  Dana is treating the blurb as a **performative speech act**—a social transaction that signals alliance and support within the publishing community. By that standard, she is acting rationally: she provided the social capital the author needed to launch, which is the actual function of the blurb in the modern market.

  What both might be missing is that **readers often know this.** There is a quiet, collective suspension of disbelief around blurbs. Readers understand that a blurb is a favor between peers, not a consumer review like you'd find in *Kirkus* or the *Times*. The friction in their argument comes from Theo applying the ethics of *criticism* to the mechanics of *publicity*.

  The deeper philosophical issue here isn't just about honesty; it's about **aesthetic agency**. If we accept Dana's view, aesthetic judgment becomes purely social—it doesn't matter what the art *is*, only what the network *says* it is. If we accept Theo's view, we risk making the literary world impossible to navigate, as no one has time to read every book before endorsing it. The truth likely lies in the specificity of the language: Dana could have blurb-ed the prose style she *did* read ("A stunning voice") without lying about the structure she *didn't* ("Fully realized"). The sin wasn't the blurb; it was the overreach of the claim.
