answer: |-
  The corridor was white, seamless, and silent. At the far end, there were two doors. One was marked **PORT**, the other **STARBOARD**.

  Kael stood in the center of the room, his breath hitching in his throat. He wasn't alone. Hovering at eye level, a small sphere of matte black chrome pulsed with a soft, rhythmic blue light. This was the Compliance Engine.

  The rules of the Audit were simple. Kael was a courier carrying unauthorized data. To escape the station, he had to pass through one of the two doors. The Compliance Engine had to intercept him to perform the audit. If the Engine was at the same door Kael chose, he was caught, his cargo wiped, and his license revoked. If he chose the door the Engine *wasn't* at, he walked free.

  There was no chase. The Engine did not move after Kael moved. It moved *before*.

  The Engine's predictive algorithms were legally certified as perfect. It analyzed Kael's micro-expressions, his galvanic skin response, his neural flickers, and his decision history. It knew what Kael was going to do before Kael's motor cortex sent the signal to his legs. It would position itself at the door Kael was destined to choose.

  Kael looked at the **PORT** door.

  *If I choose Port,* he thought, *the Engine knows that. It's already hovering there, waiting. If I walk to Port, I walk into a trap.*

  So, rationally, he should not choose Port. He should choose Starboard.

  He shifted his weight, turning his eyes toward the **STARBOARD** door.

  *But wait,* the thought came, cold and immediate. *The Engine knows I'm rational. It knows that once I realize Port is trapped, I'll switch to Starboard. So if I decide to go Starboard, the Engine predicted that switch. It's already at Starboard.*

  Kael wiped sweat from his palm. He took a half-step toward Port. The blue light on the sphere didn't flicker. It was already done. The prediction was locked in.

  *Okay,* Kael told himself, trying to steady his breathing. *I need to break the loop. I'll just... pick Port. Force myself.*

  He tensed his leg muscles to sprint for Port. But then he stopped.

  *If I can force myself to pick Port, the Engine modeled that psychological struggle. It saw me hesitate, saw me commit, and saw me move. It's at Port.*

  *So I have to go Starboard.*

  He turned his head to Starboard.

  *But if I go Starboard because I'm afraid of Port, the Engine modeled the fear. It's at Starboard.*

  Kael felt a rising panic that had nothing to do with the arrest and everything to do with the architecture of his own mind. It wasn't that he was doomed by fate; it was that he was doomed by *reason*. Every valid reason he had to choose one door was instantly converted into a valid reason to choose the other.

  His rationality was the leash.

  "Stop thinking," he whispered. "Just pick."

  He closed his eyes. *I'll flip a coin.*

  He reached for a credit chip in his pocket to toss.

  *No,* he thought, freezing. *The Engine sees me reaching for the coin. It predicts the outcome of the toss based on the physics of my thumb, the air resistance, the weight of the chip. It knows if it's heads or tails before it leaves my hand. If Heads means Port, and the Engine predicts Heads, it goes to Port.*

  Randomness wasn't an escape. To the Engine, randomness was just causality too complex for Kael to see, but simple enough for the algorithm to solve.

  Kael opened his eyes. The sphere hung in the air, indifferent. It wasn't hunting him. It was simply mirroring him. It was a shadow that stood in front of the object casting it.

  He realized then that the trap wasn't the room. The trap was the fact that he cared about the outcome.

  *If I don't care,* Kael thought, a desperate hope flaring, *if I genuinely don't care which door I take, maybe the prediction scatters?*

  But he did care. He cared desperately. And the Engine knew he cared. The Engine knew he was trying to not care. It was modeling his attempt at apathy as a strategy to defeat it.

  *If I try to be irrational, that's a rational strategy. The Engine predicts the strategy.*

  Kael looked at the Port door. It looked inviting. Safe.
  *It's a trap.*
  He looked at the Starboard door. It looked open. Clear.
  *It's a trap.*

  He was standing in a logical singularity. To make a choice was to validate the prediction. To refuse to choose was to fail the audit by timeout.

  He needed a reason to go Left that wasn't based on the belief that Right was dangerous. He needed a reason to go Right that wasn't based on the belief that Left was dangerous.

  He thought about his mother. She liked the port side of ships; said the sunsets were better.
  *If I go Port because of Mom, the Engine knows I love Mom. It knows I'm thinking of her right now to break the deadlock. It's at Port.*

  He thought about the number seven. It was his lucky number. Starboard was the seventh letter of the alphabet? No, G. S is nineteen.
  *It doesn't matter. The Engine sees the association forming.*

  Kael fell to his knees. The white floor was cold. The paradox wasn't a riddle to be solved; it was a cage made of cause and effect. He was a transparent machine in a world of opaque ones. His decision-making process was visible code to the Engine.

  "Tell me!" Kael screamed at the sphere. "Where are you?"

  The sphere remained silent. To speak would be to change the conditions.

  Kael stood up. His legs felt heavy, like they were moving through water. He understood now why no one ever passed the Audit. It wasn't because the Engine was smart. It was because *he* was smart. If he were stupid, truly stupid, he might have just run left without wondering why. But he couldn't turn off his brain. He couldn't un-know the rules.

  He had to move. The timeout was approaching.

  He looked at the **PORT** door.
  *Reason to go there:* None, except that I haven't tried it yet.
  *Reason to avoid:* The Engine is there.

  He looked at the **STARBOARD** door.
  *Reason to go there:* None, except that I avoided it last time.
  *Reason to avoid:* The Engine is there.

  Kael realized the only variable left was *when* he accepted the loss.

  He took a breath. He knew that in the nanosecond his brain committed to the motion, the die was already cast. The Engine was already at the door. The blue light wasn't waiting for him; it was waiting for the confirmation of what it already knew.

  He could feel the decision forming. It was a physical pressure behind his eyes. He felt his weight shift to his left foot.
  *Oh no,* he thought. *I'm leaning Left.*
  *So the Engine is at Port.*
  *So I must go Right.*
  *So the Engine is at Right.*

  The loop spun faster, a turbine screaming in his skull.

  Kael closed his eyes and stepped forward. He didn't choose a door. He just chose to move. He surrendered the illusion of control. He let his body take the path of least resistance, the path his muscles had already primed.

  He walked toward the **PORT** door.

  He knew, with absolute certainty, that the sphere was already there. He knew that his rationality had led him to this exact spot, step by logical step, and that every attempt to evade it had only tightened the noose.

  He reached for the handle. He didn't expect it to open. He expected the sphere to pulse red, the lock to engage, and the audit to begin.

  He turned the handle.

  It didn't lock.

  Kael froze. He stepped through into the airlock. He was alone. The sphere was not there.

  He spun around, looking back through the glass. The sphere was hovering in the center of the room, motionless.

  *Why?* Kael thought, his heart hammering against his ribs. *If it knew I would come here... why wasn't it here?*

  Then, the realization hit him, colder than the airlock walls.

  The Engine predicts based on *rational deliberation*. It models the agent trying to win.

  By stepping forward, Kael hadn't made a choice to win. He had made a choice to *submit*. He had walked into the trap because he believed it was unavoidable. He had acted on the belief that he was already caught.

  The Engine predicted he would try to escape. It predicted he would try to outthink it. It had positioned itself at **STARBOARD**, because that was where a rational agent trying to survive would eventually run after exhausting the logic of Port.

  Kael hadn't tried to survive. He had tried to understand.

  He looked at his hand on the handle. He was free. But as he floated in the silence of the airlock, he didn't feel relief. He felt a hollow horror. He hadn't outsmarted the machine. He had only escaped because, for one brief moment, he had stopped acting like a man who wanted to live, and started acting like a man who knew he was dead.

  And he wondered, as the outer door hissed open to the void, if the Engine had predicted that too.
