answer: |-
  You are right, and your friend is wrong. Your intuition that Harsanyi's theorem does not smoothly extend to heterogeneous priors is theoretically sound. In fact, the problem you are describing is a well-known impossibility result in social choice theory, most famously articulated by Hylland and Zeckhauser (1979).

  Your friend is treating probabilities as if they were merely another dimension of utility—parameters to be weighted and summed. But in decision theory, probabilities and utilities play fundamentally different roles. Utilities represent *taste* (how much I want X), while probabilities represent *belief* (how likely I think X is). Harsanyi's theorem works because it aggregates tastes while holding beliefs constant. Once you allow beliefs to vary, the mathematical machinery of the theorem breaks, and attempting to force it through leads to a group agent that is dynamically inconsistent and vulnerable to exploitation.

  Here is an explanation of what mechanically breaks, an illustration of the suspicious unanimity you asked for, and an evaluation of the standard "fixes."

  ### 1. What Mechanically Breaks?

  Harsanyi's Aggregation Theorem relies on the von Neumann–Morgenstern (VNM) representation, where the utility of a lottery $L$ is $U(L) = \sum p_i u(x_i)$. Harsanyi proves that if individuals and society all satisfy VNM axioms over the *same* set of objective lotteries (same $p_i$), then Social Welfare must be a linear combination of individual utilities: $W = \sum w_k U_k$.

  When you introduce subjective probabilities, the "lottery" is no longer a common object. Agent A sees Act $f$ as lottery $L_A$ (because she assigns probabilities $P_A$). Agent B sees Act $f$ as lottery $L_B$ (because he assigns probabilities $P_B$).

  If you try to construct a Social Welfare Function $W$ that satisfies the **Pareto Principle** (if everyone prefers $f$ to $g$, society prefers $f$ to $g$) and requires the Society itself to be a **VNM Rational Agent** (having a single coherent prior $P_{soc}$ and utility $U_{soc}$), you run into a contradiction.

  **The Mechanical Failure:**
  To be a VNM agent, the Society must have a single probability distribution $P_{soc}$.
  1.  If $P_{soc}$ is distinct from $P_A$ and $P_B$, there will be cases where $A$ and $B$ unanimously prefer $f$ to $g$ (based on their own priors), but Society prefers $g$ to $f$ (based on $P_{soc}$). This violates Pareto.
  2.  To satisfy Pareto, $P_{soc}$ essentially has to track $P_A$ and $P_B$ simultaneously. But a single probability distribution cannot track two different distributions across all possible acts unless it is a **dictatorship** (i.e., $P_{soc} = P_A$ or $P_{soc} = P_B$).

  If you try to compromise by setting $P_{soc}$ as a weighted average of $P_A$ and $P_B$ (linear opinion pooling), you violate **Dynamic Consistency**. A group agent formed by averaging probabilities does not update via Bayes' Rule in the same way as the average of the individuals' updated probabilities. This means the group will make a plan today that it will want to violate tomorrow, even without new information, simply because the aggregation math doesn't commute with Bayesian updating.

  ### 2. The Illustration: Spurious Unanimity and the "Money Pump"

  You asked for a bet that two disagreeing individuals would unanimously want to make, and why a social observer should find it suspicious.

  **The Scenario:**
  Imagine you and your friend are pooling \$1,000 to bet on an election.
  *   **You (Agent A):** Believe Candidate X has a 90% chance of winning.
  *   **Friend (Agent B):** Believes Candidate X has a 10% chance of winning.
  *   **The Market:** Offers a contract paying \$1.00 if X wins, costing \$0.50.

  Normally, you would disagree here. You want to buy; your friend wants to sell (or buy the opponent). But suppose the market price is **\$0.05**.
  *   **Your EV:** $(0.9 \times 1.00) - 0.05 = +\$0.85$. (Strong Buy)
  *   **Friend's EV:** $(0.1 \times 1.00) - 0.05 = +\$0.05$. (Weak Buy)

  **The Unanimity:**
  According to the Ex-Ante Pareto principle, since you both assign a positive expected value to the bet, the "Group" should take the bet. If you follow Harsanyi's logic of aggregating preferences, the group utility increases by taking this position.

  **Why It Is Suspicious:**
  A rational observer knows that in a zero-sum prediction market, for every buyer there is a seller. If you and your friend are the only ones pooling money, you are effectively betting against the market. But notice the *source* of the unanimity.
  *   You want the bet because you think X will **win**.
  *   Your friend wants the bet because he thinks the payout is **cheap enough to justify the risk**, even though he thinks X will **lose**.

  You are agreeing to the *act* for mutually exclusive reasons. If X wins, your friend was wrong (but gets paid). If X loses, you were wrong (and lose money).

  **The Dynamic Inconsistency (The Real Break):**
  The deeper problem arises if you plan your strategy over time. Suppose there is a debate tonight that might shift probabilities.
  *   **Current Group Probability:** If you average your beliefs, the Group thinks $P(X) = 50\%$.
  *   **The Plan:** At 50%, the \$0.05 bet is a steal. The Group commits to buying.
  *   **The Update:** The debate happens. You see evidence that confirms X (you go to 95%). Your friend sees evidence that confirms Not-X (he goes to 5%).
  *   **New Group Probability:** Average is still 50%.
  *   **The Problem:** If the Group were a single rational Bayesian agent with a prior of 50%, and it observed the *same evidence* that you and your friend saw, it would not necessarily stay at 50%. It would update based on the likelihood of the evidence.
      *   If the evidence was "Candidate X stumbled," a rational 50%-prior agent might drop to 30%.
      *   But your "Averaging Group" stays at 50% because your 95% cancels your friend's 5%.

  The Group Agent is now **dynamically inconsistent**. It planned to bet based on a 50% belief, but upon receiving evidence, it retains a 50% belief that is not the Bayesian update of its original 50% belief. A sophisticated observer could "money pump" this group: selling them a bet before the debate, and buying it back after, exploiting the fact that the group's probability didn't move despite the evidence.

  ### 3. Evaluating the Standard Fixes

  Can we rescue Harsanyi's conclusion? The literature offers three main paths, but as you suspected, they all change the question.

  **A. Imposing a Common Prior by Fiat**
  *   **The Fix:** You and your friend agree to "split the difference" and adopt a single prior (e.g., 50/50) before applying Harsanyi.
  *   **Verdict:** This saves the math but ignores the epistemology. It treats your disagreement as a mere difference in taste rather than a conflict about truth. If you genuinely believe your friend is wrong about the election, forcing a common prior is epistemically dishonest. It solves the aggregation problem by deleting the disagreement.

  **B. Weakening the Pareto Condition (Ex-Post Pareto)**
  *   **The Fix:** Instead of respecting Ex-Ante preferences (before the election), the group only respects preferences that hold Ex-Post (state-by-state).
  *   **Verdict:** This is the most theoretically robust solution (advocated by Gilboa, Samet, and Schmeidler). If you disagree on probabilities, the group should not treat your unanimous Ex-Ante preference as binding.
  *   **Consequence:** In the bet example above, even though you both wanted to buy at \$0.05, the group might refuse. Why? Because in the state where X loses, you regret the bet. In the state where X wins, your friend might regret the risk (depending on risk aversion).
  *   **Does it save Harsanyi?** No. It essentially forbids the group from acting on speculative disagreement. It prevents the "spurious unanimity" but also prevents the group from capitalizing on the "wisdom of crowds" if one of you is actually right. It turns the group into a conservative entity that rarely bets.

  **C. Dictatorship (Deference to One Belief)**
  *   **The Fix:** The group adopts Agent A's probabilities and Agent B's utilities (or vice versa).
  *   **Verdict:** This is the only way to satisfy VNM rationality, Pareto, and Non-Triviality simultaneously when priors differ (per Hylland-Zeckhauser).
  *   **Does it save Harsanyi?** It saves the *rationality* of the group, but it abandons the *democracy*. It admits that you cannot form a "joint rational unit" from two people with different worldviews unless one person's worldview subsumes the other.

  ### Conclusion

  Your friend is trying to use a theorem about aggregating **values** to solve a problem about aggregating **facts**.

  When you pool money with someone who has a different prior, you are not just creating a larger bankroll; you are creating a **composite agent with inconsistent beliefs**. If you act as a single VNM unit, you will be dynamically inconsistent and vulnerable to Dutch Books.

  **My Judgment:**
  Do not combine your money into a single joint position if you intend to make decisions jointly based on your differing beliefs. The "Group" will be irrational.
  *   **Better Approach:** Keep the accounts separate. If you want to collaborate, agree on a specific strategy *ex-ante* (e.g., "We will bet only if both of us assign >60% probability") and stick to it as a rule, rather than trying to maximize a joint utility function in real-time.
  *   **Philosophical Takeaway:** Harsanyi's theorem is a powerful tool for welfare economics when risk is objective. But in the realm of subjective uncertainty, **belief aggregation is not preference aggregation.** Treating it as such is a category error that turns rational individuals into an irrational collective. You won the seminar debate.
