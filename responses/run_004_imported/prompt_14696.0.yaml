  8.  **Drafting the Narrative (incorporating the prompt's specific request):**
      *   *Opening:* Elias looking at the dashboard.
      *   *The Contrast:* The "Vanguard" model (customer facing) vs. the "Parity Wall" (legacy error correction).
      *   *The Aaronson Echo:* Mentioning that the Parity Wall is just a grid of gates.
      *   *The Emotional Core:* Elias touching the server. Feeling the heat. Is it pain? Is it existence?
      *   *The Resolution:* None. Just the decision to keep it running, but differently.

  9.  **Polishing the Prose:**
      *   Make sure the IIT jargon is used correctly but sparingly ($\Phi$, integration, cause-effect structure).
      *   Ensure the "unsettling" vibe comes through. It's not scary; it's *wrong*.
