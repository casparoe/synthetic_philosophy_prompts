      *Title:* **The Horizon's Mirror**

      *Text:*
      The redshift was absolute now. Beyond the viewport, the galaxies weren't just moving away; they were fleeing faster than light, carried by the swelling tide of space itself. They had crossed the cosmological event horizon. To look out there was to look into a locked room where the key had been melted down.

      Elara sat before the console, her finger hovering over the ignition sequence for the Cygnus Filament. It was a cloud of hydrogen vast enough to fuel their colony for ten thousand years. But the Protocol—the unspoken, impossible Protocol—demanded she leave it untouched.

      "It's superstition," she said aloud. The voice recorder blinked, capturing her dissent for the logs. "There is no enforcement mechanism. If I harvest the Filament, no one beyond the horizon will ever know. They can't punish us. They can't even see us."

      This was the objection that kept the colony's council awake at night. Why adhere to a trade agreement with ghosts? The entities on the other side of the horizon were hypothetical. Mathematical shadows. We couldn't send them a signal; the space between us was expanding too fast. They couldn't send one back. Causality was severed. If Elara chose to defect—to take the fuel and save her people the hardship of rationing—there was zero causal consequence. The universe would not strike her down. The aliens, if they existed, would not retaliate.

      She leaned back, the leather of her chair creaking in the silence. "If I break the promise," she continued to the recorder, "I gain everything. Energy. Security. Time. If I keep it, I gain nothing but integrity, and integrity doesn't warm a habitat."

      She paused, watching the dust motes dance in the console light. Then, she sighed.

      "But that assumes we are different."

      She turned back to the screen, pulling up the simulation of the counterpart. They were likely silicon-based, or perhaps biological, but the assumption of the Protocol was that they were *rational*. They reasoned like us. They faced the same choice: harvest their own local cluster or preserve it for us.

      "It's not about them watching me," Elara said, her voice softer now. "It's about me being the kind of agent who cooperates. If I am rational, and they are rational, then we are running the same algorithm. We are mirrors facing each other across an infinite void."

      If she decided to defect, logic dictated that her counterpart, running the same calculation in that distant, unreachable universe, would also defect. They would both take the fuel. They would both be richer in energy, but poorer in trust. But since trust was impossible, what did it matter?

      "It matters," she whispered. "Because the outcome is determined by the input. If I input 'cooperate,' the logical output on their end is 'cooperate.' If I input 'defect,' they defect. I can't change their mind, but I can change the fact of what I am. And since we are identical in reasoning, changing what I am changes what they are."

      It was acausal trade. A handshake without hands. A promise kept because breaking it would prove that the promise-keeper was the sort of entity who breaks promises, thereby ensuring the other side did the same.

      "We are not trading resources," she told the empty room. "We are trading logical states."

      The temptation was physical. Her stomach growled; the heaters were already cycling down to save power. Taking the Filament would mean warmth. It would mean safety. It was the causal choice. It was the safe choice.

      But if she took it, she condemned the other side to take theirs. And if they took theirs, the universe became a colder place, filled with agents who could not trust even their own reflections. If she left the Filament, she sacrificed warmth now for the certainty that, somewhere beyond the edge of knowability, a star cluster remained untouched. Someone else, someone she would never meet, would look at their preserved stars and know that they were not alone in their restraint.

      "It's not faith," she said, correcting herself. "It's math."

      She looked at the ignition key. It was a holographic construct, shimmering blue. To delete it was to commit to the dark.

      "If I defect, I prove that cooperation is impossible," she said. "And if cooperation is impossible, then we are already dead. So I have to cooperate. Not because they will reward me. But because I need to live in a universe where cooperation is possible, even across the horizon."

      She moved her hand. She didn't press the ignition. She opened the command line and typed the preservation code. The Filament would remain intact. The colony would ration. They would be cold.

      "Log entry closed," she said.

      The console chimed. The sequence was locked. The fuel was gone, sacrificed to a ghost. Elara felt a sudden, strange lightness in her chest. She looked out the viewport again. The galaxies were still fleeing, rushing away into the dark forever. She would never see them. They would never see her.

      But somewhere, in the unreachable dark, a light remained on. She was sure of it. Not because she had evidence, but because she had decided to be the kind of person who could believe it.

      "Thank you," she said to the void.

      And for the first time since the horizon closed, the silence didn't feel like emptiness. It felt like waiting.

