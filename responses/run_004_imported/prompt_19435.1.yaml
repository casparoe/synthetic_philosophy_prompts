      *   *Opening:* The redshift. The silence.
      *   *Middle:* The internal monologue regarding the trade. The specific objection about punishment/detection.
      *   *Resolution:* The act of faith.

      *(Self-Correction during drafting)*: Make sure I don't use too much jargon like "Functional Decision Theory." Keep it narrative. Show the reasoning rather than naming the theory.
