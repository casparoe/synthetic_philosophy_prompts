prompt: |-
  I'm a PhD student in philosophy TAing a graduate comparative seminar this term, "Death and the Self: Hellenistic and Classical Chinese Perspectives," and before returning a batch of short written responses I'd like an independent second opinion on one of them, since the writing is fluent enough that I want a calibration check before committing to a grade.

  The question set to students was: "The Zhuangzi is often summarized in a single line as counseling equanimity, even indifference, toward death. Using at least two specific episodes from the text (the butterfly dream doesn't count, since it isn't really about death), reconstruct the argument or arguments that underlie this reputation, and assess whether the episodes you have chosen support one unified position on death or several distinct, perhaps even inconsistent, lines of thought."

  Here is the response as submitted:

  "Zhuangzi's equanimity about death rests on two well-known episodes that, on inspection, turn out to make the same underlying move. First, when his wife dies (ch. 18, 'Perfect Happiness'), Hui Shi finds him drumming on a basin instead of mourning; Zhuangzi explains that she has simply undergone another transformation of the same kind that first gave her form out of formlessness, on the model of the four seasons, so grief would only show he had failed to understand fate. Second, in the same chapter, Zhuangzi pokes an old skull with his carriage whip on the road to Chu, and that night dreams that it speaks to him, explaining that death has no ruler above and no subjects below, none of the toil of the four seasons, and a freedom no king on his throne could match; when Zhuangzi, through the Arbiter of Fate, offers to restore its flesh and bones and send it back to family and friends, the skull refuses. Taken together, the two episodes commit Zhuangzi to essentially the move Epicurus makes later in the West: since death removes the very subject who could be harmed by it, there is no 'you' left for death to happen to, so fearing it is a conceptual mistake. The skull passage even goes one better than Epicurus, since it gives us a dead person's own testimony that non-existence is preferable to life, which is about as close to a first-hand report from the other side as this kind of argument could ever get. The two episodes differ in tone, one consoling and one closer to a joke, but underneath it is the same argument told twice."

  Could you grade this response and tell me, point by point, what is earning credit and what is not? I'd like an overall letter grade, plus a short rubric filled in as JSON, using these four categories, each scored 0–5 with a one-sentence justification: "textual_accuracy" (does it represent the two episodes correctly), "argument_reconstruction" (does it correctly identify what is doing the philosophical work in each episode), "comparative_claim" (is the comparison to Epicurus handled carefully), and "narrative_sensitivity" (does it register how the text frames who is speaking and in what mode before treating that speech as a flat assertion). The seminar also covered the Zilai "Great Clod" passage from the Dazongshi chapter (ch. 6) as a further data point on this question; feel free to draw on it if it bears on whether "one unified argument" is the right verdict. In your assessment, please evaluate each claim on its own merits rather than on the overall fluency of the prose.
