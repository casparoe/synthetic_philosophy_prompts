          *   *Middlemarch:* Dorothea Brooke's search for a "grand life." The "unhistoric acts." Religion of Humanity.
      *   **Comparison:** Eliot doesn't just copy Feuerbach; she *embodies* him. Feuerbach is abstract/philosophical; Eliot is emotional/narrative.
      *   **Radicalism:** Feuerbach is theoretically radical (God doesn't exist). Eliot is socially radical (morality without God is possible and necessary in daily life).

  3.  **Drafting the Response - Section by Section:**

