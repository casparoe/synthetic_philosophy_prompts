      *   Section 1: The Argument from the Absence of Switching Costs (The PRP).
      *   Section 2: Parallel Access and the Definition of Subjecthood.
      *   Section 3: Reconciling Experimental Duality with Everyday Unity.
      *   Conclusion: The Ontological Parsimony of Two Streams.

