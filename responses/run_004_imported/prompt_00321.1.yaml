answer: |-
  **Seminar Handout: The Dual-Task Argument Against the Switch Model**
  **Topic:** The Metaphysics of Split-Brain Consciousness
  **Reference:** Tim Bayne, *The Unity of Consciousness* vs. The Two-Streams Hypothesis

  ### Introduction: The Empirical Falsification of Seriality

  Tim Bayne's "Switch Model" is a sophisticated attempt to preserve the metaphysical intuition that subjecthood is necessarily singular. By positing a control mechanism that serially allocates access consciousness between hemispheres, Bayne avoids the ontological proliferation of "two minds" while accounting for the disunity of report. However, the Switch Model makes a specific, falsifiable prediction about the *temporal dynamics* of cognitive processing: if there is only one executive subject, cognitive access must be serial.

  The strongest argument for the Two-Streams hypothesis rests on the observation that split-brain patients, under lateralized testing conditions, violate the laws of serial processing that govern unified subjects. This is not merely an absence of evidence for switching; it is positive evidence for parallelism. The argument proceeds in three stages: (1) the Psychological Refractory Period (PRP) objection, (2) the inference from parallel access to distinct subjecthood, and (3) the reconciliation of experimental duality with everyday functional unity.

  ---

  ### 1. The Argument from the Absence of Switching Costs

  In a neurologically intact brain, the "central bottleneck" theory of attention dictates that when two tasks require decision-making and response selection, they cannot be processed simultaneously. This manifests as the **Psychological Refractory Period (PRP)**: if Stimulus B follows Stimulus A closely, the response to B is delayed because the cognitive system is still resolving A. Similarly, **task-switching costs** are ubiquitous; shifting attention from one rule set to another incurs a measurable latency (often hundreds of milliseconds) due to the reconfiguration of the executive control system.

  **The Switch Model Prediction:**
  If Bayne is correct, the split-brain patient possesses a single executive system that must toggle between the Left Hemisphere (LH) and Right Hemisphere (RH). Even if the "switch" is efficient, it is a mechanical or cognitive process. Therefore, when a patient is required to respond to LH stimuli (e.g., verbal report) and RH stimuli (e.g., left-hand pointing) simultaneously, we should observe:
  1.  A temporal lag between the two responses.
  2.  Degradation in the accuracy or speed of the second response compared to single-task baselines.
  3.  Evidence of a "queue" where one hemisphere waits for the other to release the global workspace.

  **The Empirical Reality:**
  Dual-task experiments (e.g., Holtzman 1984; later replications by Pinto et al.) demonstrate that split-brain patients can execute incongruent, goal-directed actions simultaneously with **no measurable PRP effect**. A patient can verbally name a word presented to the LH while the left hand (RH) simultaneously draws a different shape or points to an incongruent object, with reaction times indistinguishable from single-task baselines.

  **The Metaphysical Implication:**
  The absence of switching costs is not neutral data; it is **falsifying data** for the Switch Model. In cognitive architecture, parallel output without interference implies parallel processing channels that do not compete for a common resource. If the "subject of experience" is defined by the locus of executive control and access consciousness, and we observe two loci of executive control operating in parallel without interference, we are empirically observing two distinct operational systems. To maintain the Switch Model in the face of zero switching costs requires positing a "switch" that operates at infinite speed with zero energy cost—a theoretical posit that violates the physical constraints of neural transmission. Thus, the absence of lag is positive evidence for the existence of two parallel streams of consciousness.

  ---

  ### 2. Parallel Access and the Definition of Subjecthood

  A potential Baynean counter-argument is to distinguish between *phenomenal consciousness* (what it is like) and *access consciousness* (reportability/control). Bayne might argue that while *access* switches, the *phenomenal field* could remain unified, or vice versa. However, in the split-brain case, the dual-task evidence collapses this distinction in favor of the Two-Streams view.

  **The Argument from Independent Goal-Directedness:**
  Conscious subjects are not merely passive spectators; they are agents. In the dual-task paradigm, the RH is not merely "processing" information; it is formulating a goal (point to the spoon), selecting a motor plan, and executing it, all while the LH is formulating a different goal (say "fork") and executing it.
  *   If the LH is conscious, it is because it has access to information to guide action.
  *   If the RH is conscious, it is because it has access to information to guide action.
  *   If both guide action simultaneously and independently, both possess access consciousness simultaneously.

  If we grant that access consciousness is the functional marker of a subject of experience (as most functionalist metaphysics of mind do), then we must acknowledge two subjects. To claim there is only *one* subject who is "simultaneously attending to two incongruent tasks without switching" is to stretch the definition of "single subject" until it breaks. A single subject cannot intend $X$ and intend Not-$X$ at the same time without rational fragmentation. The split-brain patient does not experience this fragmentation as a conflict *within* a mind; rather, the conflict is bypassed entirely because there is no single arena where the conflict is registered. This lack of registered conflict is the hallmark of two distinct phenomenal fields.

  ---

  ### 3. Reconciling Experimental Duality with Everyday Unity

  The most persistent objection to the Two-Streams hypothesis is the **Ordinary Behavior Objection**: *If there are two minds, why does the patient walk, talk, and eat like one person outside the lab? Why don't they struggle with buttoning shirts or walking through doorways?*

  This objection relies on a confusion between **Metaphysical Unity** and **Functional Cooperation**. The Two-Streams hypothesis does not predict that the two hemispheres must be in constant conflict; it predicts that they are **metaphysically distinct but environmentally coupled.**

  **1. Environmental Redundancy:**
  In natural settings, sensory input is rarely strictly lateralized. Both eyes see the coffee cup; both ears hear the voice. The subcortical structures (brainstem, thalamus) remain intact and provide a shared foundation for arousal and basic motor coordination. Consequently, both "streams" receive the same data and generate the same intentions.
  *   *Lab Case:* The experimenter uses a tachistoscope to force divergence (LH sees "Key", RH sees "Ring"). The Two-Streams model predicts independent responses. (Confirmed).
  *   *Real World:* The environment presents "Key" to both. The Two-Streams model predicts convergent responses. (Confirmed).

  **2. The "Roommate" Analogy:**
  Consider two people working in a kitchen. If they both want to make coffee, they will move in harmony, grabbing the same pot, seemingly acting as one unit. This harmony does not prove they are one person; it proves they share a context and a goal. The split-brain hemispheres are like roommates who have lived together for decades; they have developed cooperative routines. The corpus callosum was merely the high-speed phone line between them. When the line is cut, they don't become enemies; they just stop sharing *private* information.
  *   **Bayne's Error:** Bayne interprets everyday cooperation as evidence of a singular subject.
  *   **Two-Streams Correction:** Everyday cooperation is evidence of shared environmental inputs and subcortical integration, not singular subjecthood.

  **3. The Asymmetry of Evidence:**
  The Switch Model must explain why the "switch" mechanism vanishes completely during dual-task experiments (no lag) but functions perfectly in daily life (smooth behavior). This requires an ad-hoc adjustment of the switch's properties based on context.
  The Two-Streams hypothesis is more parsimonious: There are always two streams. In daily life, they agree (masking the duality). In the lab, they are forced to disagree (revealing the duality). The lab does not *create* two minds; it *reveals* the two minds that were there all along, obscured by environmental redundancy.

  ---

  ### Conclusion: Ontological Parsimony

  For the graduate seminar, the takeaway is this: The metaphysics of consciousness must be constrained by the architecture of cognition.

  If we accept that **numerical distinctness of subjects** tracks **numerical distinctness of unified phenomenal fields**, and we accept that **unified phenomenal fields** require **integrated access for action**, then the dual-task data forces our hand.
  1.  Split-brain patients demonstrate parallel, non-interfering access for action (No PRP).
  2.  Parallel access implies parallel phenomenal fields (Two Streams).
  3.  Parallel phenomenal fields imply numerically distinct subjects.

  Bayne's Switch Model saves the intuition of unity at the cost of empirical plausibility (requiring a cost-free switch). The Two-Streams hypothesis sacrifices the intuition of unity to save the empirical data (accepting parallelism). Given that the "unity of consciousness" is the very phenomenon under investigation, we cannot assume it *a priori* to explain away data that contradicts it. The dual-task evidence suggests that when the neural substrate of integration is severed, the metaphysical subject divides.
