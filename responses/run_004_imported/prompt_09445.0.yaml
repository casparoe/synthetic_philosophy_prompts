answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Coffee cups are half-empty. **Elena** (Contemporary Molinist) and **Thomas** (Contemporary Bañezian Thomist) have just finished co-teaching a graduate seminar on Divine Foreknowledge.*

  **Thomas:** Elena, I enjoyed your defense of *scientia media* today. But I remain convinced that the Grounding Objection isn't just a technical glitch in analytic semantics; it's the modern echo of the Dominican censure of 1607. Let's put it sharply. You claim Counterfactuals of Creaturely Freedom (CCFs) are true prior to the divine decree. Take "If Peter were in circumstance C, he would freely deny Christ." On your view, this is true *before* God decides to create Peter or C. So, what makes it true? It can't be God's will, or Peter's action is determined. It can't be Peter's actual choice, because Peter doesn't exist yet. It can't be a necessary truth, because it's contingent. So you have a truth without a truthmaker. You've posited a "middle" moment where truths float ungrounded.

  **Elena:** I appreciate the sharpness, Thomas. But I think you're assuming a truthmaker principle that is too restrictive for the divine mind. I'm not appealing to mystery; I'm appealing to the metaphysics of possible essences. A possible creature isn't nothing. It is a specific, intelligible way of imitating the Divine Essence. Peter's possible essence includes a specific mode of deficient causality. When God understands His own power as imitable by a creature in circumstance C, He understands *definitively* how that specific essence would exercise its causality. The truthmaker for the CCF is the intelligible content of the possible essence itself, as comprehended by God.

  **Thomas:** But an essence is merely possible. It has no *esse*. How can a non-existent essence ground a truth about what *would* happen? If the truth is grounded in the essence, then the essence determines the outcome. But if the essence determines the outcome, where is the freedom? And if you say God just "sees" it, you make God's knowledge dependent on something outside His will.

  **Elena:** Not outside His will, but prior to His decree of *what to create*. And let me turn the table. You Bañezians claim that God's knowledge of vision (*scientia visionis*) is grounded in His decree. Fine. But what grounds the decree itself? If God decrees to save Peter and not Judas, is there a reason? If you say "Yes, foreseen merit," you're a Molinist. If you say "No, just His will," then the truth "God wills to save Peter" is grounded solely in God's will. Why is it coherent for God's will to ground truths about salvation, but incoherent for God's intellect—comprehending possible essences—to ground truths about counterfactuals? You accuse me of ungrounded truths; I accuse you of making God's will arbitrary to avoid them.

  **Thomas:** It's not arbitrary; it's the distinction between Primary and Secondary Causality. God's will is the ground of all being. If He wills Peter to be saved, He moves Peter's will to consent. That motion is the truthmaker. But back to your "possible essences." If the essence of Peter includes "denying Christ in C," and God knows this infallibly before creating, then when God creates Peter in C, He is creating a being who *cannot* do otherwise. You've secured the truth of the CCF by sacrificing the liberty of indifference.

  **Elena:** That brings me to my real worry, Thomas. You speak of "moving the will." Let's talk about *praemotio physica*. If God physically premoves my will to choose A prior to my own act of willing, in what sense am I the ultimate source of A? The Jesuits accused the Dominicans of crypto-Calvinism for a reason. If the determination comes from God, and God is outside time, the determination is absolute. You say it's "compatible" freedom because I will it spontaneously. But if I could not have done otherwise given the premotion, it's determinism. And if it's determinism, your solution to the Grounding Objection works only by dissolving the freedom you claim to protect.

  **Thomas:** You're conflating coercion with determination. Coercion is against the will; premotion is *of* the will. God moves the will according to its nature—as free. He causes the act of willing *and* the freedom of the act. To say I could have done otherwise is to say God could have moved me otherwise. But given *this* motion, I do *this*. This preserves God as the First Cause. If, as you suggest, the determination comes from the creature, then the creature is the First Cause of its own salvation. That compromises Divine Aseity. God would be waiting on the creature to decide whether His grace works. That is not providence; that is negotiation.

  **Elena:** But look at the cost regarding Reprobation. On your view, grace is intrinsically efficacious. God gives Peter grace that infallibly produces consent. He gives Judas grace that does not. Why? It can't be because Judas resists it, because on your view, if the grace were efficacious, he *couldn't* resist it. So the distinction lies entirely in God's will. God positively wills Peter's consent and merely permits Judas's sin, yet He withholds the motion that would have prevented it. This makes God the author of the disparity between the saved and the damned much more directly than my view. In Molinism, God gives sufficient grace to all, and the distinction is made by the creature's free response, which God knows via Middle Knowledge. In Bañezianism, God makes the distinction by withholding the "winning ticket" of efficacious premotion.

  **Thomas:** I accept the consequence because the alternative is worse. If the distinction is made by the creature, then salvation is ultimately from the creature, not God. Paul asks, "What do you have that you did not receive?" If you have faith and I do not, and the difference is our free will, then we have something God did not give. Regarding Reprobation: God wills all to be saved *antecedently*, but *consequently* He wills to permit some to fall for the sake of the order of the universe and the manifestation of His justice. It is the Potter and the Clay. Your view protects the creature's autonomy at the expense of God's sovereignty. Mine protects God's sovereignty by redefining the creature's autonomy as secondary causality.

  **Elena:** So we're at the impasse. You think my view makes God dependent. I think your view makes God the author of sin. But notice what happened to the Grounding Objection. You started with it, but now we're arguing about who is the First Cause of salvation.

  **Thomas:** Precisely. The Grounding Objection is just the analytic formulation of the Dominican worry. We ask, "What grounds this truth?" because we believe that if it's not grounded in God's causal will, it's a limit on God. If a CCF is true independently of God's will, then God's will is constrained by truth. He *must* create a world where Peter denies Him if He wants Peter in C. That is a fate higher than God.

  **Elena:** And I see the Grounding Objection as the analytic formulation of the Jesuit worry. We ask, "What grounds this truth?" because we believe that if it's not grounded in the creature's power, the creature isn't free. If the truth is grounded in God's premotion, the creature is a puppet. So, when you press the Grounding Objection, you aren't really doing semantics. You're protecting Divine Aseity.

  **Thomas:** Correct. For me, the irreducible core is the **Metaphysics of Divine Causality**. God is Pure Act. Everything that is, is so because He causes it. If a truth about a creature's action exists that He does not cause, He is not the source of all being. The Grounding Objection is simply me asking: "Where is God's causality in this truth?" If you can't show it, the truth is idolatrous—it posits a reality independent of the Creator.

  **Elena:** And for me, the irreducible core is the **Metaphysics of Creaturely Agency**. If the creature is not the ultimate source of the distinction between sin and grace, then moral responsibility is an illusion. The Grounding Objection is simply me asking: "Where is the creature's causality in this truth?" If you can't show it, the freedom is illusory—it posits a choice that is ultimately determined by Another.

  **Thomas:** So, your advisor is right. We aren't arguing about truthmakers. We are arguing about whether the primary locus of explanation for a free act is the First Cause or the Second Cause.

  **Elena:** Exactly. The Grounding Objection is just the battlefield, not the war. The war is whether love requires the ability to do otherwise, or whether love is simply the will moving spontaneously under the motion of the Beloved.

  **Thomas:** *[Sips cold coffee]* Well. I suppose we won't resolve that today. But at least we agree that "truthmakers" was a red herring.

  **Elena:** It was never about semantics, Thomas. It was always about who gets the glory. And who takes the blame.
