answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Marion's nephew.

  Looking out at this room, I see the two worlds my aunt lived in, sitting side by side. On one side, the choir robes and the vestry; on the other, the tweed jackets and the graduate students. For thirty years, Marion navigated the space between you. She was a woman who could take the Eucharist at eight o'clock and deconstruct the public use of reason at nine, finding no contradiction in either, only a deeper obligation to both.

  We often think of philosophy as a way to find answers. But Marion taught me that sometimes, the most honest thing a philosopher can do is preserve a question.

  Her life's work was often misunderstood. She spent decades arguing that John Rawls—the great theorist of liberalism—wasn't trying to silence religious people in the public square. She argued that his "proviso" wasn't a gag order. It was an invitation. It was the demand that if we want our neighbors to walk with us, we eventually need to offer them a map they can read, too. She believed that translating your deepest convictions into a language your neighbor can understand wasn't a compromise of faith. It was an act of love. It was saying, *You matter enough that I will find the words to reach you.*

  She loved to remind people, usually with a twinkle in her eye, that Rawls himself had once planned to be an Episcopal priest. She saw that vocation not as a road he didn't take, but as a spirit that never left him. And in a way, it never left her, either. She was a priest without ordination, ministering to the gap between what we believe and how we live together.

  When she was still well enough to plan this day, she gave my mother a specific instruction. She said she didn't want a eulogy that asserts, as a settled fact for everyone in this room, that she is "with God now" or "watching over us." She knew that for many of you in the choir, that is a comforting truth. She also knew that for her atheist colleagues, her students, and my own father, that is not a premise you share.

  She knew, as a philosopher, that a funeral is technically what Rawls called "background culture." She knew that, strictly speaking, nothing in her own theory would have forbidden me from preaching her straight into heaven this morning. She knew she was off the hook. And yet, she asked me to consider staying on it.

  Whether she wanted to be protected from dogma, or whether she wanted to protect *us* from having to pretend we agree on things we don't, she never quite said. She left that tension for me to hold.

  So, I will honor her by not resolving it. I will not stand here and claim a certainty that not all of us share. But I will not sanitize her faith, either. It was real. It was fierce. It was the engine of her life. She prayed, she sang, she served, and she found grace in those acts. To pretend otherwise would be to lie about who she was.

  But here is what we can all affirm, without reservation. We can affirm that she is held now in the gratitude of this community. We can affirm that the love she generated in this room is not lost. We can affirm that the rigorous, generous way she treated her neighbors—believer and non-believer alike—is a legacy that remains very much alive.

  She taught us that we don't need to agree on the ultimate nature of the universe to agree on how to treat each other within it. She taught us that an "overlapping consensus" isn't just a political compromise; it's a way of being a family. It's finding the ground where we can all stand, even if we're looking at the horizon from different angles.

  Marion, you taught us how to speak to one another. You taught us how to listen. You taught us that the work of justice, and the work of faith, is never finished.

  We miss you. We will carry your questions forward, even if we don't all share the same answers. And we will try, as you did, to find the words that bring us closer, rather than drive us apart.

  Rest now. The conversation is safe with us.
