answer: |-
  It is a privilege to address a question that sits precisely at the intersection of high-level analytic philosophy and rigorous empirical ethology. Your intuition is shared by a growing number of philosophers of biology and language: David Lewis's *Convention* (1969) provided the definitive structural analysis of coordination problems, but his cognitive requirements for solving them were anthropocentrically excessive.

  You are correct that evolutionary game theory (EGT)—specifically the work of Brian Skyrms, Peyton Young, and others—demonstrates that signaling systems can stabilize without a single agent representing the mental states of another. If vervet monkeys possess alarm-call systems that are arbitrary, stable, and coordinate group behavior (e.g., running into trees for "leopard" calls vs. looking up for "eagle" calls), they possess the *functional* hallmarks of convention.

  Here is the argument that Lewis's common-knowledge (CK) condition is not necessary for convention, followed by the strongest Lewisian counter-argument and a rebuttal that vindicates your empirical observations.

  ### I. The Functional Core of Convention
  To argue that CK is unnecessary, we must first isolate what work the concept of "convention" is meant to do. Lewis was trying to explain how **arbitrary regularities** become **stable solutions** to **coordination problems**.

  1.  **Arbitrariness:** There must be at least one other regularity that could have solved the problem (e.g., barking for "leopard" and coughing for "eagle" would work just as well).
  2.  **Coordination:** Agents prefer to conform if and only if others conform.
  3.  **Stability:** The regularity persists over time.

  Lewis argued that CK was the *glue* that held these three together in rational agents. He believed that without everyone knowing that everyone knows the regularity, the expectation of conformity would be too fragile to sustain the coordination.

  However, EGT shows that **selection dynamics** can serve as that glue. In Skyrms's signaling games, populations converge on a signaling system through simple reinforcement: sender-receiver pairs that match signals to states get a payoff (survival/communication); those that don't, get nothing. Over iterations, the successful pairings dominate.

  In this model:
  *   **Arbitrariness** is preserved (the system could have converged on a different equilibrium).
  *   **Coordination** is achieved (signals reliably map to states).
  *   **Stability** is maintained (deviants are selected against).

  If the *philosophical purpose* of defining convention is to explain how arbitrary social order emerges and persists, EGT achieves this without CK. Therefore, CK is not a necessary condition for the *phenomenon* of convention; it is merely one specific *mechanism* (a cognitive one) by which humans might achieve it. To demand CK is to confuse the engine with the vehicle.

  ### II. The Vervet Case as Proof of Concept
  Your career data provides the empirical falsification of Lewis's necessity claim. Vervet alarm calls are not hardwired reflexes in the strictest sense; they are learned and modified based on social context. Infants initially overgeneralize calls and are corrected by the group. This is a form of social reinforcement.

  If we deny the label "convention" to vervet alarm calls solely because the monkeys lack the cognitive capacity for infinite iterated knowledge ("I know that you know that I know..."), we are engaging in a form of philosophical speciesism. We would be prioritizing the *internal cognitive architecture* of the agent over the *external social reality* they create.

  If a regularity functions as a convention—solving a coordination problem arbitrarily and stably—it is a convention. The fact that the monkeys achieve this via adaptive learning rather than meta-representation shows that Lewis's CK condition is sufficient for human convention, but not necessary for convention *simpliciter*.

  ### III. The Strongest Lewisian Objection: Normativity and Reasons
  A sophisticated defender of Lewis (perhaps following Margaret Gilbert or Raimo Tuomela) would not argue that monkeys *can* form common knowledge. They would argue that without common knowledge, you do not have a **convention**; you have a **custom** or a **habit**.

  Here is the strongest reason a Lewisian could give for thinking mutual knowledge is indispensable:

  **The Argument from Reason-Giving:**
  Conventions are not just behavioral regularities; they are **normative**. When I drive on the right side of the road, I do not do so merely because I was reinforced for doing so in the past (habit). I do so because I believe *you* will do so, and I know *you* believe *I* will do so. This mutual knowledge provides me with a **reason** for action.

  In Lewis's view, a convention involves a specific triangular relationship:
  1.  I conform.
  2.  I expect you to conform.
  3.  I prefer to conform *because* you conform.

  The Lewisian argues that without CK, condition (3) collapses. In the evolutionary model, the monkey signals *because* it was reinforced, not *because* it expects the receiver to interpret it correctly based on shared knowledge. The correlation is causal, not rational.

  If we remove CK, the Lewisian claims we lose the **intentionality** of the coordination. We are left with a "system" that looks like a convention from the outside (the view of the ethologist), but lacks the internal normative structure that makes it a convention from the inside (the view of the agent). For the Lewisian, a convention is a solution to a problem *recognized as such* by the participants. Without CK, the participants are merely cogs in a machine, not partners in an agreement. To call vervet calls "conventions" is to metaphorically project human rationality onto causal processes.

  ### IV. Rebuttal: The "Black Box" Defense of Convention
  This objection is powerful, but it ultimately fails to justify CK as a *necessary* condition for the philosophically relevant sense of convention. Here is why:

  **1. The "Reason" is Functional, Not Representational**
  The Lewisian insists that the agent must act *for the reason* that others conform. But in bounded rationality (and animal cognition), the "reason" can be externalized. The environment itself encodes the expectation.
  When a vervet monkey gives a leopard alarm, the "reason" it works is that the population has been shaped by selection to respond to it. The *history of the population* carries the cognitive load that the *individual mind* cannot.
  If the outcome is that the monkey acts *contingently* on the behavior of others (it calls only if others listen, it listens only if others call), the functional requirement of "acting because others conform" is met, even if the mechanism is reinforcement rather than belief. To demand the belief is to demand a specific *implementation* of the function, not the function itself.

  **2. Normativity without Meta-Representation**
  The Lewisian claims that without CK, there is no normativity, only causality. But evolutionary dynamics create a form of "natural normativity." A signal that deviates from the convention (e.g., a monkey giving an eagle call when a leopard appears) results in a failure of coordination (predation or social ostracization).
  This creates a "ought" without an infinite regress of "knows." The monkey *ought* to use the standard signal because deviation leads to failure. This is a normative pressure exerted by the system. If convention is defined by the existence of arbitrary, stable, normative regularities, the evolutionary account delivers normativity via fitness/reinforcement costs, rendering CK redundant.

  **3. The Continuity of Social Order**
  Finally, if we accept the Lewisian objection, we create an unbridgeable chasm between human and non-human sociality. We would have to say that human traffic laws are "conventions" but vervet alarm systems are merely "causal regularities," even though both solve identical coordination problems with arbitrary signs.
  Philosophically, this is undesirable. We want a theory of convention that explains **social order**. Social order exists in vervet troops. Therefore, a theory that excludes vervet troops from having conventions is a theory that fails to capture the full extension of the phenomenon.
  Lewis was trying to solve Hume's problem of how society coheres without a sovereign. EGT shows society coheres without a sovereign *and* without common knowledge. The "philosophically relevant sense" of convention is the explanation of social coherence. Since EGT explains coherence without CK, CK is not necessary.

  ### Conclusion
  Your retirement reading has led you to a conclusion that aligns with the cutting edge of the philosophy of biology. Lewis's Common Knowledge condition was a brilliant solution for *idealized rational agents*, but it is not a necessary condition for *convention* as a natural phenomenon.

  The strongest Lewisian defense rests on preserving the normative, reason-based nature of human agreement. However, this defense conflates the *experience* of following a convention (which may involve CK for humans) with the *constitution* of a convention (which requires only stable, arbitrary coordination).

  Evolutionary dynamics deliver everything Lewis's apparatus was meant to secure: stability, arbitrariness, and the resolution of coordination problems. The vervet monkey does not need to know that you know that he knows the signal means "leopard." It is enough that the signal *does* mean "leopard" because the population has converged upon it. The convention resides in the system, not necessarily in the infinite regress of the individual mind.
