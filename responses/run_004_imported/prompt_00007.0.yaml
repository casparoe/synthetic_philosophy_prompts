answer: |-
  The classic example that illustrates the gap between **Common Knowledge of Rationality (CKR)** and a **unique action profile** is the **Battle of the Sexes** (or any pure coordination game).

  This game demonstrates that while CKR restricts players to a set of "rationalizable" strategies, it often fails to select a single outcome when multiple equilibria exist.

  ### 1. The Setup: Battle of the Sexes
  Two agents, **Alice** and **Bob**, want to spend the evening together but have different preferences.

  *   **Strategies:** Each can choose **Opera (O)** or **Fight (F)**.
  *   **Payoffs:**
      *   If both choose **Opera**: Alice gets 2, Bob gets 1.
      *   If both choose **Fight**: Alice gets 1, Bob gets 2.
      *   If they choose different activities: Both get 0.

  | | **Bob: Opera** | **Bob: Fight** |
  | :--- | :---: | :---: |
  | **Alice: Opera** | **2, 1** | 0, 0 |
  | **Alice: Fight** | 0, 0 | **1, 2** |

  ### 2. Failure of Iterated Elimination of Dominated Strategies (IEDS)
  IEDS is the standard algorithmic procedure for applying CKR. It eliminates strategies that are never a best response to any rational play by the opponent.

  *   **Alice's Perspective:**
      *   If she believes Bob will play **Opera**, her best response is **Opera** ($2 > 0$).
      *   If she believes Bob will play **Fight**, her best response is **Fight** ($1 > 0$).
      *   Since both strategies can be a best response depending on her belief, **neither strategy is dominated.**
  *   **Bob's Perspective:**
      *   Similarly, both **Opera** and **Fight** are rational best responses for Bob depending on his belief about Alice.

  **Result:** The elimination process stops immediately. The set of surviving strategies is $\{Opera, Fight\}$ for both players. IEDS fails to narrow down the prediction to a unique profile.

  ### 3. The Epistemic Gap
  This result reveals the gap between "Rationality is Common Knowledge" and "Unique Equilibrium":

  1.  **CKR is Satisfied:** We can construct a consistent epistemic model where Alice and Bob have common knowledge of rationality and play **(Opera, Opera)**. Alice plays Opera because she believes Bob plays Opera; Bob plays Opera because he believes Alice plays Opera. This belief loop is perfectly rational.
  2.  **Multiple Outcomes:** We can construct an *equally valid* model where they play **(Fight, Fight)**. This outcome is also consistent with CKR.
  3.  **The Gap:** Because both outcomes are consistent with CKR, the condition of rationality alone is **insufficient** to predict which action profile will occur.

  ### Conclusion
  In the Battle of the Sexes, **CKR implies Rationalizability, not Uniqueness.**

  While CKR ensures players will not play strictly dominated strategies, it cannot solve the **coordination problem**. To bridge this gap and select a unique equilibrium, agents require information *beyond* rationality, such as **focal points** (Schelling), social conventions, or pre-play communication.
