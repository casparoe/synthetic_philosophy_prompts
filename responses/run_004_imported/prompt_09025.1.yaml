answer: |-
  Here are nine interview questions designed for your podcast, structured to probe the philosophical underpinnings of your guest's defense without allowing a retreat into the debt analogy. Each includes a follow-up keyed to the most probable defensive maneuver.

  **1. The "Question-Begging" Charge**
  You've characterized the standard retributivist objection—that punishment is essentially personal and non-transferable—as begging the question against penal substitution. But isn't there a distinction between a *definitional* claim and a *theoretical* one? If the intuition that "guilt cannot transfer" is as foundational to our moral grammar as the intuition that "debts can transfer," why should the burden of proof lie with the retributivist to explain why punishment *must* be personal, rather than with the substitutionist to explain how a non-personal penalty retains the label "punishment" at all?
  *Follow-up:* If she replies that moral grammars are culturally contingent, ask: Does this imply that penal substitution is only coherent within a specific moral framework that may not be universal, and if so, does that weaken its claim to objective theological truth?

  **2. The Ontology of Guilt**
  Let's press on that moral grammar. In the debt analogy, the liability is external to the person; I can owe money I didn't personally spend. But in criminal law, and arguably in moral theology, the liability is internal to the act of will. If we accept your analogy, are we not forced to adopt a view where sin is merely a deficit in the cosmic ledger rather than a corruption of the agent? And if sin is just a deficit, why is repentance necessary for the debtor?
  *Follow-up:* If she insists sin is both deficit and corruption, ask: How does the payment of the deficit address the corruption if the punishment is borne by a party who cannot be corrupted (i.e., Christ)?

  **3. The Mechanics of Transfer**
  David Lewis's paper relies heavily on the coherence of "swapping" liabilities. But in human legal systems, a swap requires a specific procedural architecture: a court, a statute, and a recognized mechanism for assignment. When you map this onto the atonement, what constitutes the "legal framework" that makes the swap possible? Is it the Covenant, the Nature of God, or something else?
  *Follow-up:* If she cites the Covenant, ask: Does this make penal substitution contingent on God's voluntary decision to institute a Covenant, rather than a necessary demand of His justice, and does that undermine the "satisfaction" aspect of the theory?

  **4. Licensing the Substitution (Constraint B)**
  This leads to the licensing condition. In Lewis's examples, a substitution is licensed by the consent of the substitute, the wrongdoer, or the authority. In your monograph, which of these three is doing the heavy lifting? Is the atonement valid because the Son consents, because the Father authorizes it, or because the sinner accepts it?
  *Follow-up:* If she says "The Father's Authority," ask: If the Authority can simply license a transfer, why couldn't the Authority simply waive the penalty without a substitute, and doesn't admitting He *couldn't* waive it imply a constraint on God higher than God Himself?

  **5. Christological Complications**
  If you argue that the Son's consent is the primary licensing factor, we run into a Trinitarian difficulty. If the Son is divine, and the penalty is infinite wrath, is the consent coerced by the necessity of the divine nature? Conversely, if the consent is fully human, can a human will license a transaction of infinite value? How do you navigate this Euthyphro-style dilemma within the Godhead?
  *Follow-up:* If she appeals to the Two Natures doctrine, ask: Does this not risk Nestorianism, where the human nature pays what the divine nature authorizes, effectively splitting the agent of atonement?

  **6. Retribution vs. Vindication (Constraint C)**
  I want to return to the nature of punishment. If the penalty can be satisfied by someone other than the wrongdoer, it seems the "point" of the punishment is no longer giving the wrongdoer their just deserts, but rather vindicating the authority of the law or restoring cosmic order. Does your defense quietly trade a retributive theory of punishment for a consequentialist or "moral government" theory?
  *Follow-up:* If she denies this and maintains it is retributive, ask: How can retribution be "just" if the person who suffers the pain is not the person who committed the wrong, without violating the principle of non-combatant immunity inherent in justice?

  **7. The Definition of Justice**
  Following on that: if you concede that the goal is vindicating the law rather than punishing the specific agent, haven't you essentially granted the critic's main point? The critic says, "Punishment must be personal." You seem to reply, "Yes, but we can call it punishment even if it isn't personal, provided the law is honored." Is this not a verbal victory that surrenders the substantive concept of retributive justice?
  *Follow-up:* If she argues that "justice" is satisfied regardless of the recipient, ask: Does this render the concept of *personal* judgment at the Eschaton incoherent, since the debt has already been discharged impersonally?

  **8. Particularism and Universalism**
  If the debt analogy holds, and Christ has paid the penalty for sin, we face the classic universalist challenge. If I walk into a store and a stranger pays my debt, I am free whether I like it or not. Why does the penal substitutionary atonement require faith to be efficacious? Does introducing a faith condition reintroduce a "work" that undermines the completeness of the debt payment?
  *Follow-up:* If she distinguishes between "objective payment" and "subjective application," ask: Doesn't that distinction admit that the penalty itself wasn't the barrier, but rather the relational alienation, which suggests a restorative rather than penal model was needed all along?

  **9. Lewis's Parting Doubt**
  Finally, I'd like to close with David Lewis's own hesitation at the end of his paper. He worries that even if we make penal substitution logically coherent via the debt analogy, the resulting doctrine might be "too tidy." He asks whether this philosophically sanitized version is still recognizably what believers take themselves to be committed to when they speak of Christ "bearing our sins." If your defense requires us to redefine punishment, guilt, and justice to make the logic work, have we preserved the doctrine, or merely a logical skeleton of it?
  *Follow-up:* If she argues that the skeleton is all that matters for truth, ask: But if the lived religious experience involves a personal exchange of forgiveness rather than a transactional discharge, does your model fail to capture the phenomenology of the faith it aims to defend?
