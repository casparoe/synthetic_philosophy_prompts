answer: |-
  This is a sophisticated application of judgment-aggregation theory to a canonical legal case. *Arizona v. Fulminante* is indeed the standard real-world example cited in the literature (e.g by List, Pettit, Kornhauser, and Sager), but as you suspect, the actual voting matrix reveals complexities that the binary "toy models" often obscure.

  Here is an analysis of the three questions you posed, working through the logic of the coalitions and the implications for judicial decision-making.

  ### 1. Kennedy's Logic: Institutional Deference vs. Aggregation Procedure

  Justice Kennedy's concurrence is the critical pivot point of the case. To understand what he is doing logically, we must distinguish between **personal judgment aggregation** (what I believe is true) and **institutional judgment aggregation** (what the Court holds is true).

  In a strict **premise-based procedure (PBP)**, the group votes on premises $A, B, C...$ and the outcome $D$ is derived mechanically from the majority verdict on the premises. In a strict **conclusion-based procedure (CBP)**, members vote on $D$ based on their own internal logic regarding $A, B, C...$, and the majority on $D$ prevails.

  Kennedy is doing neither strictly. He is engaging in a **sequential, institutionally-deferential hybrid**.

  *   **The Move:** Kennedy personally believes $\neg A$ (Voluntary). However, he acknowledges that the *institutional output* on issue $A$ is $A$ (Coerced), because 5 Justices voted that way. He then substitutes the institutional finding ($A$) for his personal finding ($\neg A$) in his own logical derivation of the final judgment.
  *   **Is this PBP?** It is consistent with a *sequential* premise-based procedure where earlier votes bind later deliberation. If the Court votes on $A$ first, and $A$ passes, $A$ becomes a binding fact of the case for the purpose of subsequent votes. Kennedy is treating the majority vote on $A$ as a "super-premise" that overrides his private information.
  *   **Is this CBP?** No, because he is not simply voting for the outcome he prefers ($\neg A \to \text{Affirm}$). He is voting for an outcome ($\text{Reverse}$) that contradicts his personal logical derivation, in service of a higher-order norm (providing a "clear mandate").
  *   **The "Further Move":** This reveals a dimension the standard PBP/CBP distinction often misses: **The Norm of Intelligibility.** Kennedy explicitly prioritizes the *clarity of the instruction to the lower court* over the *consistency of his own jurisprudential views*. In judgment-aggregation terms, he is maximizing a utility function that includes "institutional coherence" alongside "correct verdict." He effectively says: "The group's judgment on Premise A is $A$. Therefore, for the purpose of this case, $A$ is true. Given $A$, my view on $C$ dictates the outcome."

  This is not required by PBP (which would simply tally the votes and announce the result without requiring Kennedy to change his recorded stance on $A$), but it is a pragmatic solution to the instability PBP can create.

  ### 2. Coalitions and the "Clean Instance" Question

  If we map the coalitions, *Fulminante* turns out to be a **messier, more instructive instance** than the standard toy examples. The standard toy model (List & Pettit) usually involves two independent premises ($P, Q$) leading to a conclusion ($R$). *Fulminante* involves three *sequentially dependent* issues.

  **The Coalitions:**
  *   **Issue (A) Coerced?** Majority: **White, Marshall, Blackmun, Stevens, Scalia** (5).
      *   *Minority:* Rehnquist, O'Connor, Kennedy, Souter (4).
  *   **Issue (B) Harmless Error Applies?** Majority: **Rehnquist, O'Connor, Kennedy, Souter, Scalia** (5).
      *   *Minority:* White, Marshall, Blackmun, Stevens (4).
  *   **Issue (C) Harmless in Fact?** Majority: **White, Marshall, Blackmun, Stevens, Kennedy** (5).
      *   *Minority:* Rehnquist, O'Connor, Scalia (3). (Souter joined neither).
  *   **Final Disposition (Reverse/New Trial):** **White, Marshall, Blackmun, Stevens, Kennedy** (5).

  **The Discursive Dilemma Check:**
  In a classic paradox, the Premise-Based Outcome differs from the Conclusion-Based Outcome.
  *   **PBP Outcome:** Majority says $A$ (Yes), $B$ (Yes), $C$ (No). Logic: If Coerced + Review Applies + Not Harmless $\to$ **Reverse**.
  *   **CBP Outcome:** 5 Justices vote to **Reverse**.
  *   **Result:** The outcomes *match*. Strictly speaking, the "paradox" of divergent verdicts did not occur.

  **The Real Paradox: The "Hollow" Doctrine**
  The dilemma in *Fulminante* is not about the *disposition* (who wins the case), but about the *precedent* (what the law is).
  *   The new legal rule established is: **Confessions can be coerced ($A$) AND subject to harmless-error review ($B$).**
  *   Who supports this conjunction ($A \land B$)?
      *   The $A$-majority (White et al.) rejects $B$.
      *   The $B$-majority (Rehnquist et al.) rejects $A$.
      *   **Only Justice Scalia** (and potentially Souter, hypothetically) supports both $A$ and $B$.
  *   **The Instability:** The "Law of the Court" ($A \land B$) is supported by a **minority** of the Justices. The majority for the *outcome* is a coalition of two different minorities:
      1.  Those who want reversal because $A$ is true and $B$ is false (White, Marshall, Blackmun, Stevens).
      2.  Those who want reversal because $A$ is true and $C$ is false (Kennedy).

  **Comparison to Toy Examples:**
  This shows something the toy examples don't capture: **Sequential Dependency and Vote Trading.**
  In the toy model, premises are often treated as simultaneous. In *Fulminante*, the issues are a chain ($A \to B \to C$). Kennedy's vote reveals that in sequential voting, a Justice can "switch sides" to ensure a stable outcome. He votes with the $A$-majority to settle the fact, then with the $C$-majority to settle the application.
  This makes *Fulminante* not a "clean instance" of the List-Pettit paradox (where outcomes diverge), but a **real-world instance of coalition instability**. It demonstrates that a Court can reach a stable *verdict* while establishing an unstable *doctrine*. The "majority" for the legal rule is a phantom; it exists only in the syllabus, not in the intersection of the Justices' actual views.

  ### 3. Principled Resolution vs. Papering Over

  Does this case suggest courts have a principled way to resolve the dilemma, or do they paper over it? The evidence suggests **they paper over it, but via principled conventions.**

  **The "Papering Over" Mechanism:**
  The Court's opinion-writing conventions allow for the separation of the **Judgment** from the **Reasoning**.
  *   The **Judgment** is aggregated conclusion-style (5–4 to Reverse). This resolves the immediate dispute.
  *   The **Reasoning** is aggregated premise-style (via the syllabus and "Opinion of the Court" fragments). This creates the precedent.
  *   Kennedy's concurrence admits the fracture. By saying "I deem it proper to accept... the holding of five Justices," he is explicitly acknowledging that the *institutional truth* is being constructed artificially to avoid a deadlock.

  **Is there a Principled Resolution?**
  There is a procedural principle at work, often codified in the **Marks Rule** (*Marks v. United States*, 1977). The *Marks* rule states that when there is no single majority reasoning, the holding of the Court is the position taken by the Justice concurring on the **narrowest grounds**.
  *   In *Fulminante*, Kennedy is effectively the "narrowest" ground.
      *   White says: Coerced $\to$ Automatic Reversal (Broad protection for defendants).
      *   Rehnquist says: Voluntary $\to$ Affirm (Broad protection for state).
      *   Kennedy says: Coerced $\to$ Review $\to$ Not Harmless $\to$ Reverse.
  *   Kennedy's logic accepts the state's argument on review (B) but accepts the defendant's argument on coercion (A) and facts (C).
  *   By deferring to the majority on (A) to facilitate a judgment, Kennedy is attempting to synthesize a *Marks*-like controlling opinion out of fragmented parts.

  **Conclusion:**
  *Fulminante* suggests that collegial courts do not "solve" the discursive dilemma logically; they **manage** it politically and procedurally.
  1.  **Priority of Disposition:** The Court prioritizes the Conclusion-Based outcome (resolving the case) over Premise-Based consistency (doctrinal purity). Kennedy sacrifices his logical consistency on (A) to ensure a 5th vote for the Judgment.
  2.  **Ambiguous Precedent:** The cost of this management is doctrinal ambiguity. Because no majority supports the conjunction ($A \land B$), the precedent is vulnerable. Future courts can distinguish it easily (as indeed happened; the "harmless error on coercion" rule remains contentious).
  3.  **The Role of the Swing Justice:** In a discursive dilemma, the "swing" justice (Kennedy) becomes a **dictator of the aggregation method**. By choosing to align his vote on (A) with the majority rather than his conscience, he effectively switches the Court from a Conclusion-Based mode (where he might have affirmed) to a Premise-Based mode (where he accepts the group's finding on A).

  Ultimately, *Fulminante* illustrates that the Discursive Dilemma in real courts is not a mathematical glitch to be fixed, but a structural feature of multi-member deliberation. The "resolution" is not logical consistency, but **institutional legitimacy**—achieved by Justices like Kennedy willingly subsuming their individual logic into the constructed logic of the majority to produce a working mandate.
