      *   *Clarification on Stalnaker:* Stalnaker actually *accepts* Lewis's result and concludes that not all probability functions are admissible for conditionals. He doesn't abandon the thesis; he restricts the domain. I need to make sure this distinction is clear.
      *   *Clarification on Adams:* Adams doesn't say $P(\text{if } A, C)$ exists as a probability of a proposition. He says $Assertability(\text{if } A, C) = P(C|A)$.
      *   *Hájek Detail:* Hájek's "Triviality for the Adams Thesis" shows that if you assume the thesis holds for *all* probability functions, you get triviality even without truth conditions, provided you assume certain logical relations hold.
