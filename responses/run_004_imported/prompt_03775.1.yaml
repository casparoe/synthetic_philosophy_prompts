      *   **Gear 2: The Ground of Contingency.** Why is the world contingent? Because God's choice was free. He wasn't logically compelled to create *this* world. Therefore, everything in it inherits that contingency, even if it's certain *within* the system.
      *   **Gear 3: The Nature of Freedom.** Freedom for Leibniz isn't "indifference of equilibrium" (Buridan's Ass). It's acting according to one's own nature without external coercion, guided by reason. Caesar crosses because *he* wants to (his nature), not because a logical gun is held to his head.

