      *   *Objection 2: "Was NOT crossing ever available to him?"*
          *   *Response:* This is the crux. Leibniz is a compatibilist (roughly). Freedom isn't the "power to do otherwise *in this exact world*." Freedom is spontaneity (action from own nature) + intelligence (knowledge) + contingency (not logically forced). The "alternative" exists in God's understanding as a different possible individual/world, not as a live option for *this* actualized Caesar at *this* moment.
      *   *Objection 3: "Is it just about which Caesar gets selected?"*
          *   *Response:* Yes, basically. This is the "Trans-World Identity" problem. Leibniz tends toward the view that individuals are world-bound. "Caesar" just *is* the guy who crosses. A guy who doesn't cross is a different concept. But Leibniz wants to save freedom *within* the actualization. He does this via the *nature of the connection* (infinite analysis) and the *source of the necessity* (God's free will, not logical law).

  4.  **Synthesize the "Gears" (The Philosophical Work):**
