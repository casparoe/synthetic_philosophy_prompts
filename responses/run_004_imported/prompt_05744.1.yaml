          *   *Claim:* Ordinary soldiers following rules aren't murderers even if the war is unjust. Evidence: We don't prosecute POWs for murder, only leaders.
          *   *Analysis:* This is the classic Walzerian position. It aligns with International Humanitarian Law (IHL). It's a strong pragmatic/legal argument.
