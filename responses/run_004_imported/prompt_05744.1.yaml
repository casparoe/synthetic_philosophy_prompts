          *   *Claim:* McMahan separates "deep morality" from "laws of war." Law stays symmetric for practical reasons (reciprocity, epistemic limits), even if morality is asymmetric.
          *   *Analysis:* This is accurately representing McMahan's later work (e.g., *The Responsibility to Kill*). He acknowledges the need for practical rules.
