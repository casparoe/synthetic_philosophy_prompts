      *   4. It prevents moral complacency (just because you aren't punished doesn't mean you did good).
      *   *Crucial for the Drone Case:* A drone operator has *better* epistemic access than a foot soldier. So the "law should be symmetric" argument applies less to them. This is the key missed move.

