      *   **Move 7: Diego's Closer (The "Cop-Out" Objection).**
          *   *Claim:* If deep morality never affects treatment/outcomes, what work is it doing? It's inert.
          *   *Analysis:* This is a meta-ethical/pragmatic challenge. Is a morality that doesn't guide action or policy meaningful?
          *   *Score:* +2 (Sharp, cuts to the purpose of ethical theory).

  3.  **Evaluate the "Cop-Out" Objection (Diego's Final Move):**
      *   *Does it land?* It's a strong pragmatic critique. If ethics is action-guiding, and this morality doesn't guide action (because the law overrides it), is it useful?
      *   *Is there a reply?* Yes. "Deep morality" guides *leaders* and *citizens* even if it can't guide *soldiers* in the moment. It affects *jus ad bellum* judgments, reparations, and historical judgment. It also prevents the normalization of injustice.
      *   *Missed Opportunity:* Neither mentioned the *drone operator case* specifically. That's the elephant in the room. The epistemic burden is different for a drone operator (more info, less immediate coercion) than a grunt in a trench.

  4.  **Drafting the Response:**
