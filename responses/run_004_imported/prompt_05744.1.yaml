  *(Refining the "Cop-Out" reply)*: The reply is that morality *does* have practical effects, just not on *in bello* rules for individual soldiers. It affects *ad bellum* decisions and post-war accountability. Also, it affects the soldier's *own conscience*, even if not the law.

