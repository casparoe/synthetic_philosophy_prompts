  7.  **Writing the Output:** (Self-Correction during drafting: Make sure not to sound like I'm taking sides too heavily. Ethics Bowl is about exploring the tension. Ensure the distinction between *jus ad bellum* and *jus in bello* is clear.) *Wait, I need to make sure I don't just say "Naomi won." Diego's pragmatic points are vital for the drone case.*

      *   *Adjustment:* Emphasize that for the *drone case*, Diego's epistemic argument might actually weaken because drones have better intel. That's a specific nuance to add in the "Missed Moves" section.

  8.  **Final Polish:** Check the scoring consistency. Ensure the tone is helpful for high schoolers. (Proceed to generate response).

