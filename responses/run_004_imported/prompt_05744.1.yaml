          *   Walzer: Moral Equality of Combatants (MEC). Soldiers are instruments of the state.
          *   McMahan: Revisionism. Liability to attack depends on moral responsibility for threat. Unjust combatants are liable; just combatants are not. But law should remain symmetric for epistemic reasons.

  5.  **Refining the "Cop-Out" Rebuttal:**
      *   Why does "deep morality" matter if law stays symmetric?
