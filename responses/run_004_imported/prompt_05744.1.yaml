          *   *Analysis:* This is the core of Revisionist Just War Theory. It's philosophically precise. It cuts through the legalistic defense.
          *   *Score:* +2 (Philosophically robust, hits the core distinction).

      *   **Move 3: Diego's Counter (Epistemic/Practical Constraint).**
          *   *Claim:* Soldiers can't verify justice. Propaganda, bad intel, coercion (shot for desertion). Unfair to hold them to a standard they can't meet.
          *   *Analysis:* This is the "epistemic limitation" argument. It attacks the *application* of McMahan's view, not necessarily the theory itself. It's a strong practical objection.
