          *   *Pro's View:* It felt right, couldn't do the math in real-time, calling her "irrational" is like calling someone irrational for not instantly solving a complex math problem.
          *   *Coach's View:* The correct play was determined by objective numbers; failing to align with that is irrational, regardless of processing speed.
      *   **User's Problem:** Can't decide who is right, and it's bothering them despite being a "light sidebar."
      *   **Goal:** Provide clarity/perspective on the definition of "rationality" in this context to help them resolve the conflict for their piece.

