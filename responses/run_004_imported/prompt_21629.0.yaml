      *   This is a classic debate in cognitive science, behavioral economics, and philosophy of action.
      *   *Coach's Definition:* **Normative Rationality.** (What *should* an ideal agent do given the objective reality?)
      *   *Pro's Definition:* **Bounded Rationality / Procedural Rationality.** (What is the best an agent can do given cognitive constraints and time pressure?)
      *   *The "Math Problem" Analogy:* The pro's analogy is strong. If I ask you "What is 347 x 892?" and you guess, you aren't "irrational" for not knowing it instantly. You are cognitively bounded.

