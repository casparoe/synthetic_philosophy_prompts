      *   **Pro:** Pragmatically correct. Expertise is about pattern recognition (System 1 thinking) substituting for calculation (System 2 thinking). If her intuition said "call" based on experience, that *is* her rational process under constraints.
      *   **Who is "Right"?** It depends on the definition of rationality. For a piece about *experts under pressure*, the Pro's definition is more useful and accurate to the phenomenon. The Coach is applying a post-hoc ideal to a real-time messy situation.

