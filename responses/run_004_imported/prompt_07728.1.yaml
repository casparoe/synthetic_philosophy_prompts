answer: |-
  "It's a timer switch, Marguerite. Wired to the mains. Five seconds on, five seconds off. I paid an electrician to install it."

  "And the Tate paid you to exhibit it. Which makes it art."

  "That's the problem. You're saying the invoice confers the ontology. You're sounding like Dickie. The artworld waves a wand and suddenly a lightbulb is a transcendence?"

  "I'm saying the artworld provides the context that allows the lightbulb to be seen as art. Without the gallery, it's a hallway. Within the gallery, it's a statement. The status is conferred by the institution, not the object."

  "So criticism is dead. If the institution decides what's art just by hanging it, then you're not a critic, Marguerite. You're a clerk. You just stamp the paperwork."

  Marguerite set her champagne flute down a little too hard. "I define the discourse around the object. I explain why the institution's choice matters."

  "But if Dickie is right, the choice doesn't need explaining. It just needs authorizing. You've written yourself out of a job to protect my ego."

  "I haven't written myself out of anything. I'm telling you that your intention doesn't matter. The public framework matters."

  "But Beardsley was right. Art requires an intention to produce a rewarding aesthetic experience through perceptible qualities. I didn't intend that. I intended a joke. I intended to show you all how empty the room is. If there's no aesthetic intention, there's no art. I'm admitting I'm not an artist. Why won't you let me quit?"

  Marguerite leaned in, the candlelight flickering in the rhythm of the very lights they were discussing. "Because you're confusing 'rewarding' with 'pleasant.' You wanted a reaction. You wanted the audience to feel the frustration of the void."

  "I wanted them to laugh at you."

  "And they're angry. They're throwing eggs. That is a heightened state of awareness. That is an experience generated by the perceptible qualities of the light and the dark. You intended the frustration. The frustration is the aesthetic experience."

  Theo stopped picking at his napkin. He looked at her, really looked at her, for the first time that evening. "So you're saying the rage is the art? That I succeeded because I made them hate it?"

  "I'm saying you arranged the qualities to produce an experience. You just didn't expect the experience to be fury. But under Beardsley's own definition, you've met the criteria. You intended the effect. The effect is perceptible. It's art."

  "That makes me a fraud. It means I made art by accident while trying to make a point about how there is no art."

  "It means the work escaped you. Which is what good art does."

  Marguerite took a breath, her composure slipping just enough to show the crack Theo had driven there. "But you're right about one thing. If I only rely on the institution to confer the status, then I am just a clerk. If I can't tell you why the light matters beyond the fact that it's here, then I have nothing to say. So I won't use Dickie."

  "Good. Tell me why the light matters."

  "It matters because it strips the room of the very thing we come here to worship. It forces us to look at the space, not the object. It makes the gallery visible to itself. I defend it not because the Tate said so, but because it exposes the mechanism of the Tate. But that requires you to admit you built a machine, not just wired a switch."

  "I built a trap."

  "Then stop complaining that people got caught. You wanted to prove the emperor has no clothes. Fine. But now you're standing there naked insisting you're not actually undressed."

  "If I admit it's art, I validate the system I was mocking."

  "If you deny it's art, you validate the idea that art requires skill rather than thought. And I know you think thought is the only thing that matters."

  Theo sighed, leaning back into the plush chair. "I hate that you're right. If I say it's not art, I'm saying conceptualism is a lie. If I say it is art, I'm a sellout."

  "You're a participant. The lights go on, we see. The lights go off, we remember seeing. That's enough."

  "It's not enough. But it's what I made."

  "Then drink your wine. The lights are coming back on."
