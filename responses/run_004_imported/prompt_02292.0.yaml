answer: |-
  **Setting:** *Gate B14, O'Hare International Airport. 11:45 PM. The flight to Boston has been delayed for three hours. The fluorescent lights hum with a headache-inducing frequency. Most passengers are asleep on the floor. Two philosophers, ELENA and MARCUS, are sitting in the last two upright chairs, nursing stale coffees.*

  **Elena:** (Rubbing her temples) If I hear one more announcement about "mechanical issues," I'm going to become a case study in irrational anger.

  **Marcus:** Irony is dead, Elena. We're discussing the sleep-deprived doctor, and we're currently sleep-deprived travelers. We're living the literature.

  **Elena:** Don't you dare use my fatigue as a defeater for my arguments. That's exactly what we're fighting about.

  **Marcus:** (Smiles) I wouldn't dream of it. But admit it, the case sticks because it hurts. You're the Non-Akrasia purist. You say the doctor *must* lower her confidence in the dosage. I say she can keep her confidence in the math while acknowledging the statistic about her fatigue.

  **Elena:** It's not just "purism," Marcus. It's about the structure of rationality. If the doctor believes, "The dosage is 5mg," but also believes, "Given my state, my reasoning about dosages is currently unreliable," she is in a state of epistemic akrasia. She's believing $P$ while believing her evidence doesn't support $P$. That's a fracture in the rational mind. It's like asserting "It's raining, but I don't believe it."

  **Marcus:** But it's *not* like that. In the Moorean paradox, the second clause contradicts the first. Here, the higher-order evidence (HOE) doesn't say the math is wrong. It says *she* is bad at seeing the math. Look, imagine the calculation is actually a simple proof. $2 + 2 = 4$. If I'm sleep-deprived, and a nurse tells me, "People like you get arithmetic wrong," do I stop believing $2 + 2 = 4$?

  **Elena:** You stop believing that *you have correctly verified* $2 + 2 = 4$ in this instance. That's the key. The HOE doesn't attack the proposition; it attacks your grip on the proposition. If you acknowledge your grip is slippery, rationality demands you loosen your hold on the object. To hold on tight anyway is arrogance, not rationality.

  **Marcus:** Or it's resilience. Here's the problem with your view, Elena: You're asking the doctor to defer completely to the statistic. She has a first-order derivation that feels airtight. She checked it twice. The nurse offers a general statistic: "Sleep-deprived doctors err." You're saying the statistic swamps the derivation. That means first-order evidence becomes fragile. It vanishes the moment higher-order doubt enters the room.

  **Elena:** It doesn't vanish. It gets discounted.

  **Marcus:** Discounted to zero, in the strong cases! If the statistic is strong enough, you're saying she has to be agnostic about the dosage. But if the calculation *was* flawless, she is now rationally required to ignore the fact that she has a proof in front of her. You're privileging the sociological fact over the mathematical fact. That seems like its own kind of irrationality. It's self-undermining.

  **Elena:** It's not self-undermining; it's self-correcting. Think about what "evidence" means. Her total evidence includes the calculation *and* the nurse's warning. When you combine "I derived X" with "Derivations done in this state are usually wrong," the total support for X drops. If she keeps her confidence high, she's effectively treating the nurse's warning as irrelevant. She's saying, "I know people like me crash cars, but I'm driving fine."

  **Marcus:** (Leans forward) Okay, let's talk about the crash. This is where my Level-Splitting view pays rent. You accuse me of giving agents a license to rationalize. "Oh, I know I'm biased, but I'm still right." You think that's epistemic cheating.

  **Elena:** I know it is. It's the "Exemption Strategy." I claim I'm compromised so I don't have to answer objections, but I keep my conclusion anyway.

  **Marcus:** No. Level-Splitting isn't ignoring the HOE. It's accepting it at the higher level. The doctor believes: "Level 1: The dosage is 5mg. Level 2: I am likely wrong about the dosage." These are consistent propositions. The tension is psychological, not logical. Why should rationality require psychological comfort?

  **Elena:** Because rationality is about guiding action! If she administers the 5mg, she's acting on the belief that it's 5mg. But she also believes she's likely unreliable. So she's acting on a belief she thinks is likely false. That's practical irrationality, which stems from epistemic irrationality.

  **Marcus:** Not if she hedges the action! She can administer the 5mg *while* calling for a second check. She doesn't have to lower her confidence in the *number* to lower her confidence in the *deployment*. Your view collapses the distinction between "Is P true?" and "Should I act on P without verification?"

  **Elena:** (Sighs, takes a sip of coffee) You're moving the goalposts to pragmatic encroachment. We're talking about doxastic attitudes.

  **Marcus:** I'm talking about the fact that your Non-Akrasia Constraint forces a kind of epistemic learned helplessness. If I know I'm tired, I have to distrust my brain. But if I distrust my brain, I have to distrust the reasoning that tells me I'm tired. It's a spiral. Level-Splitting lets me say, "My brain is foggy (HOE), but this specific calculation is clear (FOE)."

  **Elena:** But *why* is it clear? Only because your foggy brain says so! That's the bootstrapping problem. You're using the compromised faculty to validate its own output against the compromise.

  **Marcus:** And you're saying the only rational response to knowing your faculty is compromised is to assume the output is compromised. But sometimes the output survives the compromise! That's the point. The statistic is about *frequency*, not *necessity*. The doctor might be in the 10% who get it right. If the math is solid, the math is solid. The HOE tells her she shouldn't *bet the farm* on it without checking, but it doesn't necessarily strip the justification from the belief itself.

  **Elena:** Justification is precisely what's at stake. If you know your vision is blurred, you aren't justified in believing the sign says "Stop," even if it does. You need to clean your glasses.

  **Marcus:** But what if you cleaned them, you just don't *know* if you did it well enough? That's the sleep case. She checked it twice. She *thinks* she cleaned the glasses. The nurse says, "People who think they cleaned them often didn't." You say: "Put the glasses down." I say: "Wear the glasses, but acknowledge they might be smudged."

  **Elena:** (Pauses) Okay. Let's get mundane. We're both tired. We've both had... well, I've had coffee. You've had three beers at the conference dinner before we rushed here.

  **Marcus:** (Laughs) Two. And they were small.

  **Elena:** Let's say three. We're arguing about whether to take an Uber or wait for the train. I notice you've had three drinks. I say, "Marcus, you're impaired. Your judgment on timing is suspect." According to you, you can say, "The train is definitely faster (Level 1), but Elena is right, I'm drunk and might be wrong about that (Level 2)."

  **Marcus:** Exactly.

  **Elena:** But then you insist we take the train. If you truly believe you're impaired, shouldn't you defer to *my* judgment? Or at least suspend judgment? If you stick to your gun, aren't you just privileging your own drunk intuition over my sober statistic?

  **Marcus:** Here's the answer to your "rationalization" charge. I don't privilege the intuition. I acknowledge the risk. I say, "I believe the train is faster. But I acknowledge my confidence is less reliable than yours." So, we let *you* decide. But I don't have to change my belief about the train schedule to do that. The belief remains; the authority shifts. Your view requires me to actually *lose* the belief about the train. Why? The schedule didn't change because I drank beer.

  **Elena:** Because your access to the schedule changed. You're looking at the app through alcohol. If you acknowledge the lens is distorted, you can't claim a clear view of the app. You're trying to have your cake and eat it too. You want to claim the truth of the proposition while admitting you have no secure path to it.

  **Marcus:** I have a path! The app is still there. The logic is still there. The HOE just warns me that I might have misread the path. It doesn't erase the path.

  **Elena:** It makes the path inaccessible to *you* rationally. If you accept the HOE, you have to treat your first-order reasoning as "bracketed." You can't use it to sustain the belief.

  **Marcus:** But who else is going to use it? The patient needs a dosage *now*. The doctor is the only one there. If she brackets her reasoning, she guesses. If she uses her reasoning but flags it as risky, she calculates *and* flags it. The latter is more useful.

  **Elena:** Epistemology isn't about utility, Marcus. It's about truth-conduciveness. Which policy leads to more true beliefs? If everyone ignored HOE because their first-order reasoning felt "airtight," we'd have a lot of confident errors. The Non-Akrasia Constraint is a safety mechanism. It forces humility.

  **Marcus:** And Level-Splitting forces nuance. It acknowledges that we are finite agents who often have to operate under known defects. Your safety mechanism forces a shutdown. Mine forces a warning light on the dashboard while keeping the engine running.

  **Elena:** A warning light usually means "pull over."

  **Marcus:** Not always. Sometimes it means "check engine soon, but drive carefully."

  *(A long silence. The gate agent announces another 45-minute delay. A collective groan ripples through the waiting area.)*

  **Elena:** You know, if we keep splitting levels, we could be here all night. I could believe "The flight is delayed" while believing "My evidence for the flight being delayed is unreliable."

  **Marcus:** (Grins) See? You're a natural Level-Splitter. You're staying in the chair (belief) while complaining about the announcement (higher-order doubt).

  **Elena:** I'm staying in the chair because the alternative is sleeping on the floor. That's pragmatic, not epistemic. Don't try to co-opt my fatigue for your theory.

  **Marcus:** I'm not. I'm just saying... the tension you feel? That akratic discomfort? That's not a bug. It's the sound of a rational agent processing complex data. You want the tension to resolve into a single confidence level. I think the tension *is* the rational state.

  **Elena:** (Looks at her coffee) I worry that if we accept your view, we lose the ability to criticize dogmatists. They always feel airtight on the inside. They just dismiss the HOE as "noise."

  **Marcus:** And I worry that if we accept yours, we lose the ability to trust ourselves when the world tells us we're wrong. Sometimes the expert statistic is wrong, and the lone doctor is right. If she's rationally required to lower her confidence, she might hesitate, and the patient suffers. Your norm punishes accuracy when it conflicts with statistical reliability.

  **Elena:** My norm protects against arrogance.

  **Marcus:** My norm protects against paralysis.

  *(They sit in silence for a moment, the hum of the airport filling the gap.)*

  **Elena:** I still think the doctor should lower her confidence.

  **Marcus:** I still think she should trust the math and doubt the mathematician.

  **Elena:** (Stands up and stretches) Well. At least we can both agree that the airline's evidence for an on-time departure is misleading.

  **Marcus:** (Stands up) Agreed. Level 1: We're not leaving. Level 2: I'm not sure I trust the board.

  **Elena:** (Smiles faintly) See? You can't help it. You're akratic.

  **Marcus:** No, Elena. I'm just awake.

  *(They join the back of the line as the gate agent finally calls for boarding.)*
