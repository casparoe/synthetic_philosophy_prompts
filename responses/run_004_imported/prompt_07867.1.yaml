      *   **Characters:** Nadia (skeptic of "safe bet" charities like bednets due to long-term uncertainty) vs. Marcus (defender of bednets based on foreseeable impact and symmetrical uncertainty).
      *   **Topic:** The rationality of donating to "safe bet" charities (e.g., Against Malaria Foundation) given long-termist uncertainty (population dynamics, existential risk, etc.).
      *   **Task:** Analyze the argument turn-by-turn, determine who has the better of it *at each point*, and identify what *both* are missing.
