answer: |-
  Good morning. Welcome to the start of another season.

  For those of you I haven't met yet, my name is [Name]. I've been working this deck for forty-two years. This will be my last summer with you. I mention that not to ask for your pity, but to let you know that when I tell you what this job costs, I am speaking from a ledger I have been keeping for a very long time.

  Most of you are fifteen or sixteen. This is your first real job. You are here because you are strong swimmers, because you like the water, or maybe just because you wanted something to do with your summer. All of those are good reasons. But before you put on this uniform, we need to have a very specific conversation about what happens when you sit in that chair.

  We spend a lot of time in certification courses talking about what you must *do*. You must scan. You must recognize distress. You must execute a rescue. You must provide care. The manuals are full of verbs. They are full of actions.

  But I want to talk to you about the silence between those verbs. I want to talk about what happens when you do *nothing*.

  Out there, beyond this fence, if you walk past someone who is in trouble and you do not stop, you might feel bad about it later. You might be a witness. But you are not the cause of their trouble. The water, or the heart attack, or the slip on the deck—that is the cause. Your inaction is just a circumstance.

  Up here, the physics change.

  When you climb into that stand, you enter into a contract that changes the nature of cause and effect. When you are on duty, your attention is not just a helpful thing you offer; it is a piece of the safety equipment. It is as structural as the lifeline or the ring buoy. If a line snaps, the equipment fails. If your scan stops, the equipment fails.

  This is the hard part, and I need you to listen closely. When you are in that chair, failing to see is not the same as missing something by accident. In the eyes of the water, and in the eyes of the law, and certainly in the eyes of the family standing at the gate, your failure to see is the same thing as the hazard itself.

  I know that sounds heavy. I know you are sixteen. You are going to get tired. Your eyes are going to itch. You are going to wonder if you missed a spot. You are human. We have protocols for a reason. We have rotation schedules for a reason. We have a team around you for a reason. If you make an honest mistake despite following every protocol, despite maintaining your vigilance to the best of your human ability, you are not a monster. You are a lifeguard who had a bad moment, and we will be here to back you up.

  But.

  There is a difference between a human error and a breach of duty. And that difference lies in those moments when you decide, consciously or unconsciously, that you are off the clock while you are still on the stand. When you turn to talk to a friend at the desk. When you check your phone. When you let your mind drift to what you're doing after work for just a hundred and twenty seconds.

  In the rest of your life, two minutes is nothing. It is the time it takes to tie your shoes. It is a text message. Up here, two minutes is a lifetime. It is enough time for the water to take a breath and not give it back.

  I have spent forty years learning that the water does not distinguish between malice and neglect. It only knows opportunity. When you are on the stand, your inattention creates that opportunity. To say "I didn't do anything" is not a defense. In this chair, doing nothing is the most powerful thing you can do. It is the only thing that can stop the tragedy, and therefore, if the tragedy happens, your absence is present at the scene.

  I am not telling you this to frighten you into paralysis. Fear makes you stiff, and stiffness makes you miss things. I am telling you this so you understand the weight of the whistle around your neck. It is not a symbol of authority. It is a symbol of a promise. The promise is that while you are watching, the water does not get to decide who goes home.

  You will have boring days. You will have hot days. You will have days when the pool is empty and it feels silly to scan the deep end with such rigor. Do it anyway. Not because the rules say so, but because the absence of your attention is the only thing that can kill someone here.

  We are a team. The veterans in this room, myself included, we are here to support you. If you are struggling, if you are burned out, if you feel your focus slipping, you tell us. We will cover you. That is part of the duty too. But while you are in that zone, you are the only wall there is.

  This job will stay with you long after the summer ends. I hope it stays with you as a pride in a job well done, in the quiet afternoons where nothing happened because you were there to make sure nothing happened. That is the goal. A boring summer is a successful summer.

  But if you take nothing else from me today, take this: Your eyes are active. Your attention is a verb. Even when you are sitting still, you are working. Do not let the stillness fool you. The water is waiting.

  Welcome to the staff. Let's have a safe season.
