      *   **Implication 5: Scientific Rigor over Intuition.** Turing didn't dismiss ESP because it sounded crazy; he dismissed its *relevance* by controlling for it. This suggests we should treat ML benchmark quirks (like memorization) with similar rigor, not just hand-waving.

