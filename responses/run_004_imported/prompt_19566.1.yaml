      *   *Why the "telepathy-proof room"?* To isolate the variable being tested (intelligence/computation) from other potential channels of information transfer. It's about experimental control.
      *   *What does this say about the Imitation Game?* It highlights that the test is *behavioral* and *operational*. If the behavior is indistinguishable, the mechanism doesn't matter *unless* the mechanism violates the rules of the physical setup (like telepathy bypassing the text terminal).

  3.  **Brainstorm Implications for Behavioral/Black-Box Testing:**
      *   **Implication 1: Operationalism vs. Mechanism.** Turing cares about *what* the machine does, not *how* it does it. But he also recognizes that "how" can leak into "what" if the channel isn't sealed.
      *   **Implication 2: The Fragility of the "Black Box."** A black box test assumes the only input/output channel is the one defined. If there's side-channel leakage (telepathy then, data leakage now), the test is invalid.
      *   **Implication 3: Burden of Proof.** Turing shifts the burden. If ESP exists, it confounds the test. To save the test, you must rule out ESP. Similarly, in ML, if benchmark contamination exists, you must rule it out to claim intelligence.
