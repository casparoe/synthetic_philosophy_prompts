      *   **User's Perspective:** Someone interested in contamination and information leakage in ML benchmarks.
      *   **Task:** Describe the implications of Turing's willingness to treat ESP as a genuine confound for confidence in purely behavioral/black-box tests of intelligence (then and now).

  2.  **Deconstruct Turing's Stance on ESP:**
