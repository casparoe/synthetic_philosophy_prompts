      *   *Grade Impact:* The user mentions this counts for their grade. If the simulation is only a few weeks long, high variance *might* pay off, but going bust twice already suggests $n$ is large enough for ruin to be a real threat. The prompt says "multi-week", implying enough time for compounding to matter.
      *   *Stipend:* There's a stipend if you hit zero. This changes the "Ruin" state from absorbing to reflecting. However, resetting to a low amount drastically hurts compounding. It effectively penalizes ruin heavily. The Kelly logic still holds because resetting loses all accumulated compound interest.

