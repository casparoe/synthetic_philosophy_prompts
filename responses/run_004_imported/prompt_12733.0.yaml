      *   **Explain Ergodicity (Optional but helpful):** Briefly mention that the "average person" goes bust, but the "average wealth" goes to infinity. This explains the roommate's confusion (stats often focuses on ensemble averages).
      *   **Address the "Rationality" Claim:** Decision theory isn't just about EV. It's about Expected Utility. For repeated multiplicative processes, Log Utility is the rational choice to avoid ruin.
