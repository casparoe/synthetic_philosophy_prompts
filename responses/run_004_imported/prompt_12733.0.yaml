      *   **Bet Mechanics:** Win probability $p = 0.6$. Win payoff = 2x wager (net profit = wager). Loss probability $q = 0.4$. Loss payoff = 0x wager (net loss = wager). This is a "double or nothing" on the wagered amount.
      *   **Jordan's Strategy:** Bet 100% of current balance every week (All-In).
      *   **User's Strategy:** Bet a fraction of current balance (Partial).
      *   **Outcome so far:** Jordan has gone bust (balance = 0) twice. User is climbing steadily.
      *   **Jordan's Argument:** Maximizes Expected Value (EV) per round. "Rational" = Maximize EV. Zeros are just variance.
      *   **Roommate's Input:** Stats major says Jordan is right about the math.
      *   **User's Intuition:** Betting 100% guarantees eventual ruin (probability of loss approaches 1 as $n \to \infty$). EV doesn't capture the risk of ruin.
      *   **Questions:** Who is correct rigorously? Is there a principled way to determine the fraction?

  2.  **Evaluate the Math:**
      *   **Expected Value (EV) per round:**
          *   Wager $W$.
          *   $E[\text{Return}] = 0.6 \times (2W) + 0.4 \times (0) = 1.2W$.
          *   Net Expected Profit = $0.2W$.
          *   Since profit is linear in $W$, maximizing $W$ maximizes EV.
          *   *Jordan is technically correct regarding arithmetic Expected Value.*
      *   **Probability of Ruin (All-In Strategy):**
          *   If you bet 100%, one loss wipes you out.
          *   Probability of surviving $n$ rounds = $0.6^n$.
          *   As $n \to \infty$, $0.6^n \to 0$.
          *   *User is correct regarding long-term survival.*
      *   **Expected Growth Rate (Geometric Mean / Kelly Criterion):**
          *   In repeated betting, what matters is the *compound growth rate*, not the arithmetic mean.
          *   Wealth after $n$ rounds ($W_n$) depends on the sequence of wins/losses.
          *   $W_n = W_0 \times (1+f)^k \times (1-f)^{n-k}$, where $f$ is fraction wagered, $k$ is wins.
          *   We want to maximize the expected *logarithm* of wealth (Utility function $U(x) = \ln(x)$).
          *   This leads to the **Kelly Criterion**.

  3.  **Identify the Core Conflict:**
      *   **Arithmetic Mean vs. Geometric Mean:** Jordan is optimizing for the arithmetic average of outcomes across many parallel universes (Ensemble Average). The User is optimizing for the time-average growth in *this* specific universe (Time Average).
      *   **Ergodicity:** This is a non-ergodic process. The average outcome across many people (ensemble) does not equal the average outcome over time for one person.
      *   **Utility Theory:** Rationality depends on the utility function. If $U(x) = x$ (risk neutral), Jordan is right. If $U(x) = \ln(x)$ (risk sensitive/growth optimal), User is right. In repeated betting contexts, log utility is usually the standard for "rational long-term growth."

  4.  **Formulate the Response:**
