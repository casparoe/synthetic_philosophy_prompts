answer: |-
  You are absolutely right to trust your intuition here, and frankly, your roommate's stats background might be leading her astray on this specific nuance. While Jordan is technically correct about **Arithmetic Expected Value**, you are correct about **Long-Term Wealth Growth**.

  In decision theory and finance, this is a classic conflict between maximizing the *ensemble average* (what happens across many parallel universes) versus the *time average* (what happens to you over time in this one universe).

  Here is the rigorous breakdown of why Jordan's strategy is flawed, the mathematical principle that validates your approach, and the exact formula you can use to settle the debate.

  ### 1. Why Jordan is "Mathematically" Right (But Practically Wrong)
  Jordan is calculating the **Arithmetic Expected Value (EV)** of a single bet.
  *   **Bet:** $100
  *   **Win (60%):** Get $200
  *   **Loss (40%):** Get $0
  *   **EV:** $(0.6 \times 200) + (0.4 \times 0) = \$120$.

  Since the expected return is 120% of the wager, the EV is maximized by wagering the maximum amount possible. If you could play this game in 1,000 parallel universes simultaneously and average the results, Jordan's strategy would yield the highest average wealth.

  **The Problem:** You do not live in 1,000 parallel universes. You live in one timeline.
  Because the bets are **multiplicative** (you bet a percentage of your *current* balance), losses hurt more than wins help.
  *   If you have \$100 and lose 50%, you have \$50.
  *   To get back to \$100, you need a 100% gain, not a 50% gain.

  By betting 100% (All-In), Jordan introduces a non-zero probability of ruin every week. The probability of surviving $n$ weeks without a single loss is $0.6^n$.
  *   After 10 weeks: $0.6^{10} \approx 0.006$ (0.6% chance of survival).
  *   After 20 weeks: $0.6^{20} \approx 0.00003$.

  As $n \to \infty$, the probability of hitting zero approaches 100%. Even with the stipend reset, going to zero wipes out all previous compound growth, effectively resetting the clock. Jordan is optimizing for a metric (Arithmetic Mean) that ignores the risk of ruin.

  ### 2. The Principled Solution: The Kelly Criterion
  You asked if there is a principled way to figure out the fraction. There is. It is called the **Kelly Criterion**, developed by John Kelly at Bell Labs in 1956. It is the standard for optimal bet sizing in repeated favorable wagers.

  The Kelly Criterion maximizes the **Expected Logarithm of Wealth**, which is equivalent to maximizing the **Geometric Growth Rate**. This aligns with your intuition: it finds the sweet spot between growing fast and avoiding ruin.

  **The Formula:**
  $$f^* = p - \frac{q}{b}$$

  Where:
  *   $f^*$ = The fraction of your bankroll to wager.
  *   $p$ = Probability of winning ($0.6$).
  *   $q$ = Probability of losing ($0.4$).
  *   $b$ = The net odds received on the wager (Profit per unit wagered).

  **Applying it to your simulation:**
  *   You wager \$1.
  *   If you win, you get \$2 back (your \$1 + \$1 profit). So your net profit $b = 1$.
  *   $p = 0.6$
  *   $q = 0.4$

  $$f^* = 0.6 - \frac{0.4}{1} = 0.2$$

  **The Optimal Bet:** **20% of your current balance.**

  ### 3. Why 20% is Better Than 100%
  If you bet 20% every week:
  *   **A Loss:** You lose 20% of your bankroll. You still have 80% left to compound.
  *   **A Win:** You gain 20% of your bankroll.
  *   **Volatility:** Your balance will fluctuate, but the probability of hitting absolute zero is eliminated (assuming you can bet fractions of a dollar, or until you hit the minimum currency unit).

  If you bet more than 20% (Overbetting):
  *   Your expected growth rate actually **decreases**.
  *   At 100% betting (Jordan's strategy), the geometric growth rate is negative. You are mathematically guaranteed to go broke eventually, despite the positive expected value per bet.

  If you bet less than 20% (Underbetting):
  *   Your growth is slower, but your volatility is lower. Many professional investors use "Half-Kelly" (10% in your case) to reduce the emotional stress of swings while still capturing most of the growth.

  ### 4. How to Explain This to Jordan and Your Roommate
  The disconnect here is about **Ergodicity**.
  *   **Jordan's View (Non-Ergodic):** He is looking at the *Ensemble Average*. If 1,000 people bet 100% once, the average wealth is huge because a few lucky people win big, dragging the average up.
  *   **Your View (Ergodic):** You are looking at the *Time Average*. If *one* person bets 100% over 1,000 rounds, they will almost certainly go to zero.

  In a seminar about **Decision Theory**, this distinction is vital. Rationality is not just about maximizing Expected Value ($E[x]$); it is about maximizing Expected Utility ($E[U(x)]$).
  *   If your Utility function is linear ($U(x) = x$), Jordan is right.
  *   If your Utility function is logarithmic ($U(x) = \ln(x)$), which reflects the reality of repeated percentage-based betting, **you are right.**

  Most decision theorists agree that in repeated multiplicative games, Log Utility is the rational standard because it accounts for the irreversibility of ruin.

  ### Summary Recommendation
  1.  **Stand your ground.** You are not being "irrationally risk-averse"; you are optimizing for **geometric growth** rather than **arithmetic mean**.
  2.  **Adopt the Kelly Fraction.** Tell Jordan you are switching to the mathematically proven growth-optimal strategy: **20% of your current balance every week.**
  3.  **The Grade.** Since this is a multi-week simulation, the team that survives the longest with the highest compound growth will win. Jordan's strategy has a high variance but a near-certain probability of ruin over a long horizon. Your strategy (specifically at 20%) has the highest probability of ending with the most money.

  You aren't ignoring the math; you're just using the *right* math for a repeated game.
