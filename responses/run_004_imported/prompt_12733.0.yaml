      *   **Introduce the Kelly Criterion:** This is the specific "principled way" the user asked for.
      *   **Calculate the Kelly Fraction:**
          *   Formula: $f^* = p - \frac{q}{b}$, where $b$ is net odds received on the wager.
          *   Here: $p=0.6$, $q=0.4$.
          *   Payoff: Bet 1, Win 2 (total returned). Net profit = 1. So $b=1$.
          *   Wait, let's double check the payoff structure. "A win doubles whatever you put in".
              *   Interpretation A: You put in $X$, you get $2X$ back (profit $X$). Odds are 1:1.
              *   Interpretation B: You put in $X$, you get $X$ back plus $2X$ profit. (Unlikely given "doubles whatever you put in" usually means total return).
              *   Standard phrasing "doubles your money" means $2X$ total return. Net odds $b = 1$.
