      *   Address debt vs. punishment? Yes.
      *   Address fine case (exception vs. tolerance)? Yes.
      *   Address theological scale mismatch? Yes.
      *   No hedging without argument? Yes.

  *(Self-Correction Note)*: I need to be careful not to simply dismiss theology. The prompt asks for a verdict on *moral coherence*. I can argue it is coherent *under a specific model* (Satisfaction) but incoherent under another (Retributive/Rehabilitative). I will argue the Retributive model is the dominant moral intuition for "punishment," making the doctrine largely incoherent by modern standards.

