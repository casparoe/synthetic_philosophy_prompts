answer: |-
  **TO:** The Fund Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Allocation Policy: Thresholds vs. Ranking

  Hi everyone,

  After our last meeting, I spent some time thinking about why we're stuck. We all want the same thing: to help neighbors without wasting money or playing favorites. But we're divided on *how* to decide when we can't help everyone.

  One side says: Fund the first qualified people who walk through the door (First-Come, First-Served).
  The other side says: Wait, compare everyone, and fund the neediest (Ranking/Maximizing).

  I'm writing this to propose we officially adopt a **Threshold & Roll** policy (First-Come, First-Served with fixed eligibility criteria) and reject the Ranking model.

  I know half of you feel strongly that Ranking is fairer. I used to think so too. But after looking into how organizations actually make decisions under scarcity—and specifically the ethical framework of "satisficing"—I believe Ranking introduces more harm than it prevents.

  This memo lays out the proposed policy, the reasoning behind it, and specifically addresses the biggest moral objection: *"What if someone worse off applies later?"*

  ### The Proposal: Threshold & Roll

  1.  **Fixed Eligibility Bar:** We set clear, static criteria for what constitutes an emergency (e.g., active shutoff notice, eviction filing, income verification). This bar does **not** move based on how much money is left in the pot.
  2.  **Rolling Intake:** Applications are reviewed within 48 hours.
  3.  **Approval Logic:** If an applicant meets the Fixed Bar, they are funded immediately.
  4.  **Stop Condition:** Funding stops when the monthly cap is reached. Any subsequent qualified applicants are waitlisted for the following month (or referred to other resources).
  5.  **No Ranking Queue:** We do not hold applications to compare them against future applications.

  ### The Reasoning: Why "Good Enough" is the Ethical Choice

  The argument for Ranking relies on the idea that we can and should find the *optimal* distribution of funds (i.e., ensuring the absolute neediest person gets the money). In economics and philosophy, this is called **Maximizing**.

  The argument for Threshold & Roll relies on **Satisficing** (a term coined by Herbert Simon). This isn't about "settling" or being lazy. It's an acknowledgment of **bounded rationality**. We are six volunteers with limited information. We cannot see the whole town's need; we can only see the applications on our screen.

  Here is why Satisficing is the correct moral framework for us:

  **1. Time is a Component of Need**
  Our grants are for *immediate* crises (shutoffs, eviction). For someone facing a utility shutoff on the 5th, receiving money on the 4th is successful. Receiving it on the 20th is a failure, even if they are "needier" than the person who applied on the 1st.
  By holding applications for two weeks to rank them, we are actively inflicting harm on the early applicants to gather data. We are trading a *certain* prevention of harm (for the first applicant) for a *theoretical* increase in impact (helping someone potentially worse off later). In emergency relief, speed is a metric of success.

  **2. The Noise of Ranking**
  To rank effectively, we need to distinguish between levels of need with precision. Can we really tell the difference between an applicant asking for $800 for rent and one asking for $900 for rent + utilities? Is one objectively "more deserving"?
  As some of you noted, the scoring is often noise. If we delay funding for two weeks to distinguish between two "8s" on a need scale, we are engaging in bureaucracy, not aid. Satisficing says: If they cross the threshold of "crisis," they are eligible. Distinguishing between crises is not our role.

  **3. The Moral Hazard of Maximizing**
  Philosopher Michael Slote argues that satisficing isn't just a fallback for when we're out of time; it can be the primary moral duty. If we adopt a Maximizing mindset ("We must ensure every dollar goes to the *most* desperate person"), we risk paralysis. We start moving goalposts. We start denying "good" cases hoping for "great" cases that never come.
  By committing to Threshold & Roll, we commit to **action**. We acknowledge that we cannot solve poverty, only interrupt specific disasters.

  ### Addressing the "Worse-Off Neighbor" Objection

  I know the strongest argument against this proposal is: *"It feels wrong to fund Person A on Day 3 when Person B, who is visibly more destitute, applies on Day 10 and gets nothing because the pot is empty."*

  This feels unjust. But consider the alternative:

  If we hold Person A's money on Day 3 to wait for Person B, we are using Person A as a means to an end. We are saying their emergency is less important because they had the misfortune of applying when the pot was full.
  Furthermore, Person B might never apply. If we hold the money, and no one "worse" applies, we have unnecessarily endangered Person A.

  **The Hard Truth:** We do not have enough money to help everyone who qualifies. Under *any* system, a desperate person will be turned away.
  *   In the **Ranking System**, we turn away the "less desperate" qualified people at the end of the month.
  *   In the **Threshold System**, we turn away the "later" qualified people at the end of the month.

  The Threshold System is more honest. It admits that our limitation is **capital**, not **judgment**. We aren't saying the later person isn't needy; we are saying we ran out of money. In the Ranking system, we imply the later person wasn't *needy enough*, which adds stigma to the rejection.

  ### On "Moving the Goalposts"

  There was also a question about whether we should raise the eligibility bar (e.g., only fund eviction, not utilities) when applications are high.

  **I propose we do not do this.**
  Changing the rules mid-month creates inconsistency and bias. If we run out of money on the 20th, we run out. We should not make the criteria stricter for the person applying on the 19th than the person who applied on the 2nd. Consistency builds trust in the community. If we consistently run out of money by the 3rd week, the solution is to raise more funds or acknowledge our capacity limit, not to shrink the definition of "emergency."

  ### Next Steps

  I know this commits us to a path where we will inevitably have to say "no" to qualified people later in the month. That will feel bad. But saying "no" because we are empty is honest. Saying "no" because we decided someone else was *more* worthy after making them wait is much harder to justify.

  For the meeting in two weeks, please come prepared to vote on this specific framework. If you oppose it, I ask that you come prepared to answer this specific question:

  *"Given that we cannot fund everyone, is it ethically preferable to delay aid to the currently needy in hopes of finding the maximally needy, knowing that the delay itself may cause the harm we are trying to prevent?"*

  Thanks for all the work you do. This is hard stuff, and the fact that we're fighting about it shows we care.

  Best,

  [Your Name]
