prompt: |-
  Been down a rabbit hole on Henry Sidgwick's side gig running the Society for Psychical Research -- turns out the guy was way more rigorous than I expected, e.g. the Creery sisters telepathy tests, where he and the other SPR investigators got what looked like solid results for years before eventually realizing the sisters were probably just signalling to each other, and said so publicly. He also wasn't in it just for curiosity's sake: the "dualism of practical reason" from the Methods of Ethics (the fact that he couldn't actually reconcile egoism with utilitarianism on purely rational grounds) seems to have left him kind of desperate for empirical evidence of an afterlife or some moral order to the universe, something to make ethics rational again now that he was loosing his religious faith. So given both his evidentiary standards AND his personal stake in the answer, what do you think he'd have made of Daryl Bem's 2011 "Feeling the Future" precognition study and the replication-crisis freakout it set off in psychology? Would he land on "this is rigorous methodology, so the result stands," basically where he started with the Creery sisters, or would his own history make him the first to smell a rat? Try to ground this in his actual epistemic habits and not just "what would a proper Victorian think of psychic powers, lol."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Subject:** Henry Sidgwick (Victorian philosopher, founder of the Society for Psychical Research [SPR]).
      *   **Context:** Sidgwick's involvement in psychical research (SPR), specifically the Creery sisters case (initial success, later admission of fraud/signaling).
      *   **Motivation:** Sidgwick's "dualism of practical reason" (from *The Methods of Ethics*) created a philosophical need for evidence of an afterlife/moral order to reconcile egoism and utilitarianism.
      *   **Target Question:** How would Sidgwick evaluate Daryl Bem's 2011 "Feeling the Future" (precognition) study and the subsequent replication crisis?
      *   **Constraint:** Ground the answer in Sidgwick's actual epistemic habits, not just Victorian stereotypes. Balance his high evidentiary standards with his personal philosophical stake in the outcome.

  2.  **Deconstruct Sidgwick's Epistemic Profile:**
      *   **Rigorous Empiricism:** He wasn't a gullible believer. He approached psychical research as a scientist/philosopher. The SPR was founded to apply scientific methods to anomalous claims.
      *   **The Creery Sisters Precedent:** This is crucial. He *wanted* it to be true. He gathered data that looked positive. But when evidence of signaling emerged, he *publicly admitted error*. This shows intellectual honesty trumping desire.
      *   **Philosophical Stake:** The "Dualism of Practical Reason." He needed ethics to be rational. If virtue doesn't lead to happiness (in this life or the next), rationality is fractured. Evidence of a spiritual order solves this. This creates a *bias*, but Sidgwick was aware of bias and built methods to counter it.
      *   **Probabilistic Thinking:** Sidgwick understood cumulative evidence. One experiment isn't proof; a weight of evidence is needed.
      *   **Skepticism of Fraud/Error:** The SPR's early work focused heavily on ruling out fraud and sensory leakage (hence the Creery realization).

  3.  **Analyze Daryl Bem's "Feeling the Future" (2011):**
      *   **Claim:** Precognition (retroactive influence on memory/reaction time).
      *   **Methodology:** Standard psychological protocols (retrofitting standard experiments so the stimulus comes *after* the response).
      *   **Outcome:** Statistically significant results in the original paper.
      *   **Aftermath:** Massive controversy. Failed replications. Accusations of p-hacking, HARKing (Hypothesizing After Results are Known), and flexible data analysis. It became a poster child for the Replication Crisis.
      *   **Key Flaw:** The methodology looked "standard" but allowed for researcher degrees of freedom that inflated false positives.

  4.  **Synthesize: Sidgwick vs. Bem:**
