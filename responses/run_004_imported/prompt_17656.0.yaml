      *   *Point 3: Replication as the Ultimate Test.* Sidgwick believed in the "weight of evidence." The replication crisis showed the weight was lacking. Sidgwick would side with the replicators, not Bem.
      *   *Point 4: The Philosophical Stake.* Would his desire for an afterlife blind him? No, the Creery case proves otherwise. He would be *more* careful because he knows his own bias. He would fear "wishful thinking" corrupting the data.
      *   *Point 5: Researcher Degrees of Freedom.* Sidgwick worried about subject signaling. He might not know p-hacking, but he understands "adjusting the experiment to fit the result." He would condemn HARKing.
