      *   *The "Creery" Parallel:* Sidgwick knows that initial positive results can be misleading. He knows that subjects (or researchers) can unconsciously signal or manipulate data.
      *   *Methodological Scrutiny:* Sidgwick was obsessed with *controls*. Bem's study relied on standard psych methods which Sidgwick might find insufficient for *extraordinary* claims. Sidgwick demanded stricter controls for psychical claims than for normal physics.
      *   *Replication:* Sidgwick valued cumulative evidence. Bem's failures to replicate would be the dealbreaker for Sidgwick.
      *   *The Personal Stake:* Sidgwick *wanted* psi to be true. This makes his eventual rejection of the Creery sisters even more powerful evidence of his integrity. He would fight the desire to believe.
      *   *Researcher Integrity:* Sidgwick focused on subject fraud (Creery). Bem's issue was *researcher* flexibility (p-hacking). Sidgwick might need to update his model of "fraud" to include unconscious statistical manipulation, but his principle of "admitting error" applies.

  5.  **Drafting the Argument (Iterative Process):**

