answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name], and I had the privilege of being [Father's Name]'s child.

  When we started clearing out his desk, we expected to find bills, maybe some old photos, the usual clutter of a life lived. Instead, we found boxes. Forty years' worth of small, leather-bound notebooks.

  For most of his adult life, my father was conducting an experiment. In his twenties, he read Benjamin Franklin's autobiography. Franklin, one of America's founders, had a famous project for self-improvement. He listed thirteen virtues—things like Temperance, Industry, Justice, and Humility. Every week, Franklin focused on one virtue, and every day, he marked a chart if he failed to live up to it. He wanted to see if a man could, through sheer attention, perfect his character.

  My father decided to try it.

  He didn't talk about it constantly. He didn't preach. He just did it. For forty years, he carried those notebooks. And every night, he asked himself: *Did I live up to my standards today?* And if the answer was no, he put a black mark in the book.

  When I first flipped through them, I'll admit, I looked for the clean pages. I wanted to see where he had mastered himself. But what I found were pages filled with marks. Specifically, the row for "Order." If you knew his desk, or his workshop, or the garage, you won't be surprised to hear that "Order" was the hardest one. It was the most marked-up row in the book.

  And yet, he never stopped tracking it.

  He knew the irony, too. One of Franklin's virtues was "Humility." Dad used to laugh about that one. He knew that the moment you pat yourself on the back for being humble, you've failed the test. He never claimed to have solved that puzzle. He just kept showing up to try.

  There was a story he loved to tell, maybe some of you heard it. It's about a man who took his axe to a grinder to have it polished. The grinder turned the wheel, and the steel sparked, but the axe came out still speckled with rust. The man said, "I'll take it as it is." The grinder replied, "Keep turning, and we'll get it bright." The man said, "No, I think I like a speckled axe best."

  My father told that story to explain that he knew perfection was a trap. He knew that if you grind too hard, you ruin the steel. But he also believed that if you stop turning the wheel entirely, you let the rust take over.

  Those notebooks weren't a record of his failures. They were a record of his attention.

  In a world that often encourages us to cut corners, to pretend we're better than we are, or to simply stop caring, my father chose to care. He chose to measure himself against a high standard, not because he thought he was better than anyone else, but because he wanted to be better than he was the day before.

  To his coworkers: You saw this in his work. He wasn't perfect, but he was reliable. He was honest. He showed up.
  To his family: You saw this in his love. He didn't love us perfectly—no one can—but he loved us intentionally. He checked the chart. He paid attention.

  I realized, looking through forty years of those black marks, that he wasn't trying to arrive at perfection. He was trying to stay in motion. Franklin himself concluded that he never achieved perfection, but that the attempt made him a better and happier man. My father found the same truth.

  The black marks in those books aren't stains on his memory. They are proof that he was engaged in the hard, messy work of being a good man. He accepted the speckles on the axe, but he never stopped turning the grindstone.

  That is the legacy he leaves us. Not a life without error, but a life without indifference. A life where trying mattered more than arriving.

  I will miss him terribly. But I take comfort knowing that if he were here, he'd be the first to tell me not to eulogize him too perfectly. He'd probably just check his notebook, mark a black dot for "Vanity," and tell me to get back to work.

  Thank you, Dad, for showing us how to turn the wheel. Rest well.
