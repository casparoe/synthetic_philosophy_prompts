      *   **Extrapolation vs. Text:** Need to be careful here. She didn't write about sortition. I need to distinguish between what she says about *parties* and what she says about *collectives* generally.
      *   **Verdict:** Needs to be nuanced. She would likely see them as *better* than parties, but still flawed because they rely on collective deliberation rather than individual attention.

