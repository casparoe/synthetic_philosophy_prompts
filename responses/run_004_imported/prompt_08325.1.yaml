      *   **The Case for Incompatibility (Psychological/Metaphysical):** Focus on "pressure." The deliberative process *is* pressure. Consensus *is* pressure. The role of facilitators/experts creates a new hierarchy. *Flag: Extrapolation of her concept of "attention" and "pressure."*
