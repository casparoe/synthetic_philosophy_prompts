  okay this might be a random connection but hear me out. in APWH we learned about Mencius's thing where if you suddenly saw a little kid about to fall into a well, you'd feel this instant rush of alarm and compassion even though saving the kid gets you nothing -- he uses that to argue humans are naturally good. that's basically the same setup as Peter Singer's famous drowning child argument for why we're obligated to give way more to charity than we do (kid drowning in a pond right in front of you = you have to save it, no excuses, and Singer specifically says it shouldn't matter if the kid is right next to you or starving somewhere far away). but then i remembered Mencius also spent a bunch of time going after Mozi for saying we should care about everyone equally, and argued love/duty is naturally "graded," starting with your own family and getting weaker as you go outward. so if Mencius somehow read Singer's essay today, do you think he'd actually agree that distance shouldn't matter morally since we all have the same built-in compassion reflex, or would his whole beef with Mozi mean he'd push back and say Singer's wrong, that relationship and proximity DO matter? kinda cant tell if these two thought experiments are secretly on the same side or total opposites lol
