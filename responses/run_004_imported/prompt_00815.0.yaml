answer: |-
  The cable hummed. It was a low, cello-deep vibration that traveled through the deck plates, up through the soles of Elara's boots, and settled in her teeth.

  *Anchor One.* That was her station. A torus of spun titanium and recycled polymer, three hundred meters across. And out there, across the impossible black, was *Anchor Two*. They were connected by a tether of carbon nanotube weave, forty kilometers long, currently singing that cello note because it was straining.

  They were spinning. Elara could feel it in the way her coffee curved in the mug, the way her hair wanted to float "up" away from the floor. Centrifugal force. Artificial gravity.

  But when she looked out the viewport, there was nothing.

  No stars. No cosmic background radiation. No dust. Just a void so complete it felt less like emptiness and more like a lid pressed down on existence. The Great Silence, the historians called it. Whatever cataclysm had scrubbed the universe clean had left the Anchors behind, perhaps as a joke, perhaps as a seed.

  Elara set the mug down. It clattered, held by the spin.

  "Diagnostic," she said. Her voice sounded thin in the airlock.

  The ship's AI, which she'd named *Newton* out of a sense of ironic history, flickered on the console. "Tension in Tether Alpha is at ninety-four percent of yield. Rotational velocity is constant. Angular momentum is conserved."

  "Relative to what?" Elara asked. It was the question she asked every shift. It was the question that had driven the last engineer to open the airlock.

  *Newton* paused. The cursor blinked. "Relative to the local inertial frame."

  "And the inertial frame is defined by...?"

  "By the metric field of spacetime."

  Elara rubbed her temples. "Which is?"

  "A dynamic geometric structure. Independent of matter."

  "Substantivalism," she muttered. "The bucket is spinning relative to the bucket-ness of space."

  "Alternatively," *Newton* offered, its voice modulating to a softer, more conciliatory tone, "Model B suggests the tension is an artifact of the relation between Anchor One and Anchor Two. However, under strict Machian relationism, with no distant mass to define rotation, the tether should be slack. It is not."

  "Right. Mach says if there are no stars, there's no spin. No spin, no tension. But the cable is about to snap." Elara stood up and walked to the window. The tether disappeared into the dark, a straight line leading to the other speck of light forty clicks away. "So Mach is wrong. Space is a thing. It's a container, and we're rattling around inside it."

  "The Hole Argument suggests caution in that conclusion," *Newton* said.

  Elara sighed. She knew where this was going. She'd read the papers in the archive before the screens went dark. Einstein had spent years trying to make space relational, to make it depend on the stuff inside it. But General Relativity, the theory that saved them, treated spacetime as a field—a physical thing that could curve, ripple, and stretch.

  But then came the Hole Argument. A thought experiment. If you treat spacetime points as real things, like little beads on a string, the math breaks. You get indeterminism. You can't predict the future. The only way to save the physics is to say the points *aren't* real. They're just labels.

  "So," Elara said to the dark. "Space is real enough to pull on my cable, but not real enough to have an address."

  "Essentially," *Newton* said. "The metric field exists. But asking *where* the field is, independent of the objects within it, is a meaningless question."

  Elara pressed her hand against the cold glass. The vibration of the cable was stronger here. It was a physical fact. Her body was being thrown outward. If she jumped, she would land 'down'. If the cable snapped, they would drift apart, spinning wildly.

  It felt real. It *was* real.

  But the metaphysics mattered. It mattered because of the Navigation Protocol.

  "Status on the correction burn?" she asked.

  "Unable to calculate," *Newton* replied. "To fire thrusters for de-spin, I require a coordinate reference. I need to know where we are rotating *against*."

  "Against space," Elara said.

  "Space has no coordinates without a grid," *Newton* countered. "If I fire the thrusters to counter the centrifugal force, I am assuming the force is generated by rotation relative to the metric field. If the force is purely relational between the two Anchors, firing thrusters might increase the tension rather than relieve it."

  Elara closed her eyes. This was the trap.

  If Substantivalism was true, Space was a fluid, a medium. They were spinning in it, creating drag, creating force. To stop, they had to push against that medium.

  If Relationism was true, the spin was only a relationship between Anchor One and Anchor Two. To stop spinning, they didn't need to push against the void; they just needed to stop changing their angle relative to each other.

  In a universe with stars, the answer was the same. The distant stars locked the reference frame. Mach's principle worked because the mass of the universe defined 'still'.

  But here? In the Null?

  The cable groaned. A sharp *ping* echoed through the hull. A filament had snapped.

  "Tension rising," *Newton* warned. "Ninety-six percent."

  "If we cut the tether," Elara said, "we drift. We survive."

  "If we cut the tether," *Newton* said, "and Relationism is correct, the rotation ceases to be defined. We may cease to experience inertial forces. The artificial gravity will vanish. Life support relies on centrifugal separation for fluid processing. We could suffocate in our own waste."

  "And if Substantivalism is correct?"

  "Then we drift, spinning individually, preserving our local gravity. We survive."

  "So cutting the line is the safe bet."

  "Unless," *Newton* said, "the tension is the only thing holding the local metric stable. The Hole Argument implies that without matter to define the points, the geometry is... fluid. The tether might be the only thing pinning our location in the manifold."

  Elara laughed, a dry, brittle sound. "You're saying the cable is holding reality together?"

  "I am saying that in a universe of two objects, the relation *is* the reality. Sever the relation, and you may sever the context in which existence is possible."

  Another *ping*. Closer this time.

  Elara looked at the lever on the console. The Emergency Sever. A red plastic cover, a heavy switch.

  She thought about the Foucault pendulum her great-grandfather had told her about, back when Earth still had museums. A pendulum swinging, and the earth turning beneath it. The proof that you could feel the turn of the world without looking at the sun.

  But if there was no earth? If there was only the pendulum?

  She felt the pull in her gut. Down. Away from the center. It was undeniable. It was the most honest thing in the universe. The void outside was a lie. The silence was a lie. But the tension? The tension was truth.

  "Newton," she said. "If I fire the thrusters. Counter-rotational. Hard."

  "That will stress the tether to one hundred ten percent. Probability of rupture: high."

  "And if we do nothing?"

  "Probability of rupture: eighty percent within the hour. Fatigue failure."

  "So we die either way unless I make a choice."

  "You must choose which model of reality you wish to inhabit, Elara."

  She looked at her hand. She opened it, then made a fist. She felt the blood pumping, the pressure of her own biology against the skin. She was matter. Anchor Two was matter.

  The philosophers argued about whether space was a container or a relationship. But the cable didn't care about philosophy. It cared about stress.

  "Relationism says the spin is just us looking at each other," Elara said. "Substantivalism says we're spinning in the dark."

  "Correct."

  "If I believe the dark is empty," she said, "then the force is a ghost. If I believe the dark is full... then the force is a hand."

  She reached for the thruster control, not the sever switch.

  "If space is a thing," Elara said, her voice steady, "then it can hold us. If space is nothing, then we are already falling."

  "Elara," *Newton* warned. "This action assumes the metric field has physical agency."

  "It's pulling on me, Newton. I don't care what the Hole Argument says about coordinate points. I care that my bones are being pressed into the floor. That is a physical interaction. Something is pressing back."

  She keyed the command. *Counter-rotate. Full thrust.*

  The station shuddered. The hum of the cable rose to a scream. The vibration shook her teeth so hard she tasted blood.

  For a second, nothing happened. The tension gauge spiked. Red. Critical.

  Then, the screaming stopped.

  The hum dropped to a whisper. The pull in her gut lightened, not vanishing, but settling into a steady, calm weight.

  "Rotation relative to the local inertial frame has been neutralized," *Newton* said. "Tension in tether is down to structural baseline."

  Elara let out a breath she didn't know she'd been holding. She floated. No, she didn't float. She stood. The gravity was gone, replaced by the gentle tug of the tether keeping them aligned.

  "We stopped," she said.

  "We aligned," *Newton* corrected. "We are no longer rotating relative to the spacetime metric."

  "So the metric is real."

  "The data is consistent with that hypothesis."

  Elara walked back to the viewport. The Anchor Two light was still there. The cable was still there, but it wasn't singing anymore. It was just a line.

  She had proven Newton right. Space was a thing. It was a substance that could be pushed against, a medium that defined what it meant to turn. The universe wasn't just the objects; it was the stage, and the stage had weight.

  But as she looked out into the endless, starless night, a colder thought settled over her.

  If space was a thing, if it was a real, independent structure that could exert force and define motion... then they weren't alone.

  The loneliness of the void was a lie. The void wasn't empty. It was full of *Space*. It was a solid, rigid, invisible ocean that surrounded them, pressed against them, defined them. They were not two ships in nothingness. They were two ships trapped inside a block of amber.

  "Newton," she said softly.

  "Yes, Elara?"

  "Lock the sever mechanism."

  "Acknowledged."

  "We're not cutting the line."

  "The tension is low. We are stable."

  "No," she said, watching the dark. "Because if we cut the line, and Space is real... we're just two bugs pinned on a slide. But if we stay connected... if we keep the tension..."

  She placed her hand on the glass again. She could feel the faint, residual vibration of the universe itself. The quantum foam. The metric field. The thing that was there before the stars and would be there after.

  "Then we're not just objects in space," she said. "We're defining it. We're giving the points names."

  "The Hole Argument suggests the names do not matter."

  "Maybe," Elara said. "But the tether does."

  She turned away from the window. The silence of the museum was gone. The silence of the grave was gone. Now there was only the silence of the deep ocean, where the water itself is heavy, and present, and watching.

  "Schedule maintenance on the tether," she said. "We need to make sure it holds."

  "Holds against what, Elara?"

  Elara smiled, and it didn't reach her eyes.

  "Against the nothing. Because now we know. The nothing is something."

  She walked down the corridor, her boots clicking on the floor. The floor that was pushed up by the spin. The spin that was measured against the dark. The dark that pushed back.

  It was a terrifying thought. That the emptiness had teeth.

  But as she passed the mess hall, she saw her coffee mug sitting on the table. It wasn't sliding. It wasn't floating. It was still.

  For the first time since the stars went out, Elara felt like she was standing on solid ground. Not because the universe was empty, but because it was full. Full of a space that demanded to be reckoned with.

  "Newton," she said.

  "Elara?"

  "Play me the recording. The pendulum demo."

  The AI hesitated, then played a crackling audio file from the archives. *...the pendulum isn't actually changing direction, the floor is rotating underneath it relative to the distant stars...*

  Elara turned it off.

  "No," she said to the quiet room. "The floor is rotating underneath it relative to the Space. And the Space is listening."

  She sat down at the table. The chair creaked. The ship hummed. The cable held.

  It was enough.
