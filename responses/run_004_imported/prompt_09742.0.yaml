      *   *Why do proponents think it works?* It relies on *logical correlation* or *subjunctive dependence*, not causal influence.
      *   *Key Decision Theories:* Timeless Decision Theory (TDT), Updateless Decision Theory (UDT). These differ from Causal Decision Theory (CDT).
      *   *The Mechanism:* If Agent A and Agent B are sufficiently similar (or can simulate each other perfectly), their decisions are logically linked. If A decides to cooperate, it implies (logically) that B will also decide to cooperate, because B is running a similar algorithm. Therefore, A cooperates not to *cause* B to cooperate, but because A's decision is *evidence* of B's decision.
      *   *The "Enforcement" Issue:* In causal trade, enforcement is external (punishment, reputation). In acausal trade, the "enforcement" is internal to the decision logic. Defecting is suboptimal because it logically implies the other defects, leading to a worse outcome for *you*.

  3.  **Address the Economist's Objection (The "Fatal Flaw" Argument):**
      *   The economist is thinking in terms of Causal Decision Theory (CDT) + Game Theory (Nash Equilibria requiring enforcement for cooperation in one-shot Prisoner's Dilemmas).
