answer: |-
  The intuition driving your question is the standard motivation for supervaluationism. Indeed, many philosophers initially find epistemicism's claim—that there is a fact of the matter about whether 5,321 grains make a heap while 5,320 do not—to be metaphysically extravagant or simply incredible.

  However, the debate between epistemicism and supervaluationism is not settled by ontological economy alone. Most contemporary philosophers of language argue that supervaluationism pays for its modesty with significant costs in **logic**, **semantic theory**, and **higher-order vagueness**. Whether one theory is "preferred" depends on which theoretical virtue one prioritizes.

  Here is an analysis of why ontological economy does not automatically secure victory for supervaluationism.

  ### 1. Ontology vs. Ideology
  Your argument rests on the idea that epistemicism is ontologically heavier. However, proponents of epistemicism (most notably Timothy Williamson) argue that their view is actually ontologically parsimonious.
  *   **Epistemicism:** Requires only classical truth values (True/False) and classical logic. It posits no new entities, no "precisifications," and no truth-value gaps. It claims our ordinary semantics are correct, but our access to them is limited.
  *   **Supervaluationism:** To make sense of "admissible precisifications," supervaluationism often quantifies over a set of candidate extensions or models. If these precisifications are treated as concrete semantic entities, supervaluationism may actually be *more* ontologically committed than epistemicism. If they are treated as fictional or heuristic, the theory must explain how truth can supervene on something non-factual.

  Thus, the charge of ontological excess can be reversed: epistemicism keeps the world and logic simple; supervaluationism complicates the semantics of truth.

  ### 2. The Cost of Logical Revisionism
  The strongest argument for epistemicism is that it preserves **classical logic**. Supervaluationism requires significant logical revision, which many philosophers view as a higher price than accepting ignorance.
  *   **Bivalence:** Epistemicism preserves the Law of Bivalence (every sentence is true or false). Supervaluationism rejects it for borderline cases.
  *   **Excluded Middle:** Supervaluationism validates the Law of Excluded Middle ($P \lor \neg P$) as "supertrue," but it denies that either disjunct ($P$ or $\neg P$) is true in borderline cases. This leads to the counterintuitive result that a disjunction can be true even though neither disjunct is true.
  *   **Truth-Functionality:** In classical logic, the truth value of a compound sentence is determined by its parts. Supervaluationism breaks this. For example, "This is a heap or this is not a heap" is true, even if "This is a heap" lacks a truth value.

  For philosophers who prioritize logical conservatism, epistemicism is preferable because it treats vagueness as a limitation of *knowledge* rather than a limitation of *logic*.

  ### 3. The Problem of Higher-Order Vagueness
  This is often considered the fatal flaw of supervaluationism.
  *   **The Issue:** If "heap" is vague, there is a borderline region. But surely the boundary between "definitely a heap" and "borderline heap" is *also* vague (higher-order vagueness).
  *   **Supervaluationism's Struggle:** Standard supervaluationism draws a sharp distinction between sentences that are true on *all* precisifications and those that are true on *some*. This creates a sharp boundary between the "supertrue" and the "indeterminate." This reintroduces the very sharp boundaries supervaluationism sought to avoid, just at a higher semantic level.
  *   **Epistemicism's Advantage:** Epistemicism handles higher-order vagueness uniformly. There is a sharp boundary between "known heap" and "unknown heap," and another between "unknown heap" and "known non-heap." We simply cannot know where any of them are. The ignorance iterates naturally without requiring new semantic machinery.

  ### 4. Explanation of Ignorance vs. Indeterminacy
  Epistemicism is often criticized for failing to explain *why* we are ignorant of the cutoff. However, Williamson has provided a robust explanation using **margin-for-error principles**.
  *   **Williamson's Argument:** Knowledge requires safety. If you know $n$ grains make a heap, you couldn't easily have been wrong. But since the meaning of "heap" shifts slightly across close possible worlds (due to usage variation), a belief about the exact cutoff is unsafe. Therefore, it cannot be knowledge.
  *   **Supervaluationism's Gap:** Supervaluationism posits indeterminacy but struggles to explain why language behaves as if it is precise in sorites reasoning. If there is genuinely no fact of the matter, why does the inference "If $n$ is a heap, $n-1$ is a heap" seem so compelling until it leads to contradiction? Epistemicism explains this by saying the premises are actually false (at the cutoff), we just don't know which one.

  ### Conclusion
  You are correct that supervaluationism is more modest regarding **metaphysical facts** about boundaries. However, it is less modest regarding **semantic complexity** and **logical deviation**.

  The choice between the two often comes down to a trade-off:
  1.  **Accept Epistemicism:** You keep classical logic and a simple semantics, but you must accept the counterintuitive claim that there is a precise fact of the matter regarding vague predicates.
  2.  **Accept Supervaluationism:** You keep the intuition that there is no precise fact, but you must accept truth-value gaps, non-truth-functional connectives, and difficulties with higher-order vagueness.

  Most contemporary metaphysicians and logicians do not view ontological economy as the sole deciding factor. Many argue that the theoretical cost of abandoning classical logic (Supervaluationism) is greater than the cost of accepting unknowable boundaries (Epistemicism). Therefore, epistemicism remains a live, and for some, preferred option.
