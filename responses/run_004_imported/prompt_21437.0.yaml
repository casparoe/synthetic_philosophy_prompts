          *   *Pros:* Preserves classical logic (Bivalence, Excluded Middle).
          *   *Cons:* Highly counterintuitive (there *is* a fact of the matter?), requires explaining *why* we are ignorant.
      *   **Supervaluationism (e.g., Fine, Keefe):** Vagueness is semantic indeterminacy. A sentence is "supertrue" if true on all admissible precisifications, "superfalse" if false on all, and neither if true on some and false on others.
          *   *Pros:* Captures the intuition of borderline cases (no sharp line), avoids positing hidden precise facts.
          *   *Cons:* Logic is non-classical (Excluded Middle fails globally, though valid in a sense), truth doesn't supervene on being (Tarski biconditionals might fail), higher-order vagueness issues.

