      *   *Counter-point 2 (Logical Cost):* Ontological economy isn't the only theoretical virtue. *Logical* economy matters. Epistemicism keeps classical logic intact. Supervaluationism sacrifices bivalence and potentially the T-schema. Is losing classical logic a higher price than accepting ignorance?
