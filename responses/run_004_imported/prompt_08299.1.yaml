answer: |-
  The war in Ukraine has dragged many abstract philosophical problems into the bloody light of day, but for you, the problem has walked through the front door wearing your family's face. You are asking whether your cousin, a reluctant Russian conscript, stands on the same moral ground as the Ukrainian soldier shooting at him. This is the heart of the debate over the **Moral Equality of Combatants (MEC)**.

  On one side stands the Traditionalist view, most famously articulated by Michael Walzer. On the other stands the Revisionist view, championed by philosophers like Jeff McMahan. The Traditionalist says your cousin and the Ukrainian are moral equals. The Revisionist says they are not. To answer you, I will not merely describe these positions; I will press them against the hard surface of your cousin's reality to see which one holds.

  ### The Traditionalist Case: The Independence Thesis

  The Traditionalist position rests on what is called the **Independence Thesis**. This is the claim that *jus in bello* (the justice of conduct in war) is separate from *jus ad bellum* (the justice of the war itself). According to Walzer, a soldier's right to fight and their liability to be killed depend solely on whether they follow the rules of engagement (don't target civilians, treat POWs well), not on whether their nation's cause is just.

  There are two powerful arguments for this, one epistemic and one conventionalist.

  The **epistemic argument** suggests that individual soldiers cannot be expected to judge the macro-justice of a war. Soldiers are subject to propaganda, state secrecy, and the fog of conflict. If we make a soldier's moral standing dependent on the objective justice of their cause, we demand a level of geopolitical knowledge most conscripts do not possess. Your cousin may hate the war, but does he know the full history of NATO expansion or the Donbas? Probably not. To hold him morally accountable for the Kremlin's strategic decisions is to punish him for ignorance he did not choose.

  The **conventionalist argument** is pragmatic. War is a collective institution. If we declare that soldiers on the "unjust" side are morally liable to be killed while soldiers on the "just" side are not, we risk turning war into extermination. If the Ukrainian soldier believes the Russian soldier has *no right* to fight, the Ukrainian has no incentive to accept surrender. The Russian, knowing he is deemed a criminal, will fight to the death. The MEC acts as a firewall: it says, "You are both dangerous, you are both permitted to shoot, and you are both permitted to be shot." This symmetry encourages surrender and limits brutality.

  **The Traditionalist Verdict on Your Cousin:**
  Under this view, your cousin is the moral equal of the Ukrainian soldier. He has done nothing wrong merely by fighting, provided he does not commit war crimes. He has not forfeited his right to life in a moral sense; rather, he has entered a sphere where rights are mutually suspended by the convention of war. If a Ukrainian soldier kills him, it is a tragedy, but not a moral asymmetry. The Ukrainian is not "punishing" him; he is engaging a threat that is legally and morally permitted to exist. Your cousin's hands are clean, provided his rifle is aimed at combatants.

  ### The Revisionist Case: Liability and the Unjust Threat

  The Revisionist challenge attacks the Independence Thesis at its root. McMahan argues that the laws of war should track the deep morality of self-defense. In ordinary life, if an innocent person is attacked by a aggressor, the victim has a right to defend themselves. The aggressor does not have an equal right to kill the victim in "self-defense" against the victim's defense. Justice matters.

  Therefore, Revisionists argue that **liability to be killed tracks the justice of the cause**. Soldiers fighting an unjust war pose an "unjust threat." Soldiers fighting a just war (in defense of sovereignty) pose a "just threat." The Ukrainian soldier is justified in killing your cousin because your cousin is part of an unjust invasion. Your cousin is not justified in killing the Ukrainian because the Ukrainian is defending innocent life.

  This sounds harsh for a conscript. This is where the Revisionist distinction between **liability** and **culpability** becomes essential.
  *   **Culpability** is about blame. Did you choose to do wrong? Are you a bad person?
  *   **Liability** is about forfeiture of rights. Are you posing a threat that others are permitted to stop, even by lethal force?

  McMahan uses the analogy of an "innocent aggressor." Imagine a man sleepwalking toward a cliff, pushing you ahead of him. He is not *culpable*; he is asleep. But he is an *unjust threat* to your life. You are permitted to push him off to save yourself. He is *liable* to be harmed, not because he is evil, but because the moral necessity of your survival outweighs his right not to be harmed in that specific moment.

  **The Revisionist Verdict on Your Cousin:**
  Under this view, there is a fundamental asymmetry. Your cousin is fighting for an unjust cause (the invasion of a sovereign state). Therefore, he is an unjust threat. The Ukrainian soldier is defending a just cause.
  *   **Has he done wrong?** Objectively, yes. He is participating in aggression. Subjectively (in terms of blame), perhaps not, due to coercion.
  *   **Has he forfeited anything?** Yes. He has forfeited his right not to be killed by defenders.
  *   **Is the killing normatively on a par?** No. The Ukrainian killing him is an act of permissible defense. Your cousin killing the Ukrainian is an act of impermissible aggression (even if excused by duress).

  ### Weighing the Arguments: Why Revisionism Prevails

  Both positions have weight. The Traditionalist offers a system that might reduce bloodshed by treating war as a game with rules. The Revisionist offers a system that tells the moral truth about aggression and defense.

  However, the Traditionalist view collapses under the weight of the specific reality you describe. The "epistemic" defense—that soldiers can't know the justice of the war—fails in 2022 Russia. The nature of this conflict is not a murky border dispute; it is a clear-cut violation of the UN Charter. Furthermore, your cousin *tried to dodge*. He is not ignorant; he is coerced. The Traditionalist view treats him as a neutral agent of the state, which erases his reluctance and the reality of the aggression he is forced to commit. It asks the Ukrainian defender to view the man burning his village as a "moral equal." This is a moral fiction that insults the victim.

  The Revisionist view is superior because it separates the **status of the act** from the **blame of the actor**. It allows us to say two things simultaneously, which the Traditionalist cannot:
  1.  The invasion is unjust, and those enforcing it are posing unjust threats (Liability).
  2.  Your cousin is not a monster, but a victim of coercion (Lack of Culpability).

  The Traditionalist protects your cousin's moral status by erasing the Ukrainian's right to defense. The Revisionist protects the Ukrainian's right to defense by clarifying that killing your cousin is not a moral crime, while simultaneously acknowledging that your cousin is not *blameworthy* for being there.

  There is a practical risk here: if Ukrainian soldiers adopt Revisionism too zealously, they might treat Russian POWs harshly, believing them to be "liable" criminals. This is why International Humanitarian Law (the law) remains Traditionalist even if morality (the ethics) is Revisionist. The law *must* treat them as equals to ensure they surrender. But you asked for the moral truth, not the legal statute.

  ### The Verdict

  The Revisionist argument has the better of it. The Moral Equality of Combatants is a necessary legal fiction, but it is not a moral truth.

  Here is what that conclusion implies for how you should think about your cousin's hands:

  **1. He is liable, but not culpable.**
  Your cousin is morally liable to be killed by Ukrainian forces. This is not because he is evil, but because he is the instrument of an unjust harm. If a Ukrainian soldier shoots him, that soldier has not committed a moral wrong equivalent to your cousin shooting him. The Ukrainian is stopping an unjust threat; your cousin is perpetuating one. There is an asymmetry. You must accept that his death, while tragic, would be permissible in a way that the death of the Ukrainian soldier would not be.

  **2. He is not a murderer, but he is a threat.**
  Because he is a reluctant conscript who tried to dodge, his *culpability* is negligible. He is more like the sleepwalker pushing you toward the cliff than the man who pushed you on purpose. You do not have to hate him. You do not have to believe he deserves punishment. But you must acknowledge that his presence in a uniform makes him a legitimate target of defense. His "innocence" in terms of intent does not grant him immunity in terms of physics and morality.

  **3. The burden of the asymmetry lies on the aggressor state.**
  The moral tragedy here is not that your cousin is "equal" to the Ukrainian. The tragedy is that your cousin has been placed in a position where his life is forfeit to the defense of others through no genuine fault of his own. The moral weight of this falls on the leadership that conscripted him, not on him, and not on the Ukrainian who stops him.

  **Conclusion**
  You asked if he is the moral equal of the Ukrainian soldier. The honest answer is **no**. The Ukrainian defends a home; your cousin occupies it. To claim they are equals is to sanitize the aggression.

  However, Revisionism gives you a way to hold this truth without condemning your cousin's soul. He is a man caught in a machine of unjust liability. He has not lost his humanity, but he has lost the protection that humanity usually affords against lethal force. You can love him, mourn him, and pray for his survival without denying that the people shooting at him are justified in doing so. The asymmetry of the war does not make him a villain, but it does make him a casualty that the other side is permitted to inflict. That is the terrible cost of an unjust war: it turns reluctant sons into forfeitable threats.
