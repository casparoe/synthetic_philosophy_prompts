          1.  **Planning Optimal (Ex-Ante):** Just maximize the function above. $p=2/3$.
          2.  **Action Optimal (Interim/Ex-Post):** Maximize expected utility *at the intersection* given beliefs about location.
      *   **The Belief Issue:** If I am at an intersection, what is the probability I am at the first one ($\alpha$)?
