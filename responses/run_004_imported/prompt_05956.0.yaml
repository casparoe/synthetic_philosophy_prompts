      *   Tackle the "Bot as Liar" problem (Instrumentalism).
      *   Tackle the "User Knowledge" problem (The nature of the sign).
      *   Tackle the "Comfort" problem (The absolute prohibition).
      *   End with the theological implication (Truth vs. Consolation).

  9.  **Final Polish:** Ensure the tone is analytical yet accessible for a feature piece. Avoid overly dense theological jargon without explanation. (e.g., explain *contra mentem*). Make sure to directly answer the three specific points raised in the prompt.

  *(Self-Correction during drafting)*: I need to be careful not to make Augustine sound *only* like a killjoy. His point is about the health of the soul. The "harm" is to the liar's relationship with God. I should emphasize that internal corruption aspect.

