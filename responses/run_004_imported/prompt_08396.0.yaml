      *   *Step 3: Reconciling "Arbitrary" vs. "Inherited".* Use the concept of *Form of Life*. It's not that *I* chose it (so not arbitrary for me), but it's not a Law of the Universe (so contingent in a broad sense). It's like language: I didn't choose English, but I can't speak English without its grammar.
