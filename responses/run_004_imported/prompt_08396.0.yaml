answer: |-
  This is one of the classic "aha!" moments (and stumbling blocks) in reading *On Certainty*. You have spotted the exact tension that keeps Wittgenstein scholars busy.

  The short answer is: **No, he isn't being inconsistent, and no, he isn't a relativist in the "anything goes" sense.** But to see why, you have to adjust how you're reading the words "mythology" and "rules of a game."

  Here is a breakdown of how to reconcile your professor's point with the text, and how to handle the relativism worry.

  ### 1. "Mythology" does not mean "Falsehood"
  When we hear "mythology," we think "fake story" or "superstition." That is not how Wittgenstein is using it.

  For Wittgenstein, a "mythology" here is a **foundational narrative that structures experience.** It is a set of propositions that we *act* as if are true, not because we have proven them, but because without them, we couldn't make sense of anything else.

  *   **Example:** "The earth has existed for many years."
  *   **Empirical view:** I should be able to check this. (But how? Using records? Those records assume the earth existed to record them. Using geology? That assumes physical laws existed.)
  *   **Wittgenstein's view:** This isn't a fact I check; it's the *stage* on which I check facts.

  So, when he calls it a mythology, he means it functions like a creation story for our reasoning. It's not "up for grabs" because it's not a hypothesis we are testing. It is the **inherited background** (as the first passage says). You didn't choose it, just like you didn't choose to be born into a specific language.

  ### 2. The "Rules of a Game" Analogy
  This is where the "arbitrary" worry comes in. If hinges are like chess rules, doesn't that mean we could just play checkers instead?

  **The distinction is between *Contingency* and *Arbitrariness*.**

  *   **Contingent:** It didn't *have* to be this way logically. (We *could* imagine a creature that doesn't treat "I have two hands" as certain).
  *   **Arbitrary (for us):** It is not a matter of choice or whim *within our form of life*.

  Think about language. The word "dog" for a canine is arbitrary (we could have said "chien"). But once you are speaking English, you cannot arbitrarily decide that "dog" means "cat" and expect to communicate.

  Wittgenstein is saying hinge propositions are like the grammar of our reality.
  *   **Your Professor's Point:** They aren't "up for grabs" because we don't *decide* to hold them. We find ourselves already holding them. We act on them. (I don't decide to believe the chair will hold me; I sit.)
  *   **Wittgenstein's Point:** They function like rules. You don't verify the rules of chess by playing; you follow them to play.

  So, they are "rule-like" (normative, not empirical) but they are "inherited" (fixed by our nature/culture, not chosen). There is no contradiction there. They are fixed *for us*, even if they aren't fixed *for the universe*.

  ### 3. Is he a Relativist?
  This is the big million-dollar question in *On Certainty* seminars.

  **The Relativist Worry:** If hinges are like game rules, and different cultures play different games, does that mean truth is relative? Is one world-picture as good as another?

  **The Wittgensteinian Response:**
  Wittgenstein is not a truth-relativist (he doesn't think "true" means different things for different people). He is a **framework contextualist.**

  1.  **Truth requires a framework:** You can only ask "Is this true?" *inside* a system of hinges. To ask "Is the system of hinges true?" is nonsense, like asking "Is the meter stick in Paris one meter long?" (It *defines* the meter).
  2.  **Universal Human Form of Life:** Wittgenstein often hints that while hinges *could* change, most of them won't, because we share a human biology and environment. Almost all humans will have hinges like "Fire burns," "Objects don't vanish without cause," "I have a body." These aren't relative opinions; they are conditions of human action.
  3.  **Hinges can shift (The Riverbed):** Right after the passage you quoted (§§96-99), Wittgenstein uses the **Riverbed Analogy**. The water (empirical facts) flows over the riverbed (hinges). But over long periods, the riverbed itself can shift.
      *   *Example:* For centuries, "The sun orbits the earth" was a hinge-like certainty. It shifted to "The earth orbits the sun."
      *   This doesn't mean truth is relative; it means our **system of verification** evolved.

  So, he isn't saying "Believe whatever mythology you want." He is saying: **"You cannot doubt everything at once. Doubt needs a ground. That ground is your 'mythology'."**

  ### How to synthesize this for your seminar
  If you want to sound like you really get it, try framing it this way:

  1.  **Acknowledge the tension:** "It looks like a tension between the *necessity* of the background (we don't choose it) and the *contingency* of the game (rules could be different)."
  2.  **Resolve via Praxis:** "Wittgenstein resolves this by moving from *justification* to *action*. We don't hold these propositions because they are logically necessary (they aren't) or because we chose them (we didn't). We hold them because **we act**. The 'rules of the game' are solidified by our repeated actions, not by our intellectual consent."
  3.  **On Relativism:** "He isn't a relativist because he isn't saying all world-pictures are equally valid. He is saying that **validity is internal to a world-picture.** We can't step outside our skin to judge our own hinges from nowhere. But that doesn't mean we can't criticize specific hinges if they stop allowing us to navigate the world successfully."

  **Summary for your notes:**
  *   **Mythology** = Foundational framework, not "lie."
  *   **Game Rules** = Normative function (governs moves), not empirical content.
  *   **Not Arbitrary** = Fixed by human "Form of Life" (biology/culture), not by individual choice.
  *   **Not Relativist** = Truth is objective *within* the system, but the system itself rests on action, not proof.

  You're asking the right questions. This passage is essentially Wittgenstein telling us: *"Stop trying to prove the foundation. Just look at how you live."*
