  5.  **Address Question 3: What is "Independent Evidence"? (The Trickiest Part)**
      *   *The Circularity Risk:* If I need evidence of reasoning to prove reasoning, am I stuck?
      *   *Morgan's Solution:* Evidence doesn't have to come from *this specific behavior*. It can come from *other behaviors* or *evolutionary continuity*.
      *   *Examples:*
