      *   *Argument for Truism:* If "independent evidence" just means "evidence that the higher faculty is present," then the canon says "Assume X unless you have evidence for Y." That's just standard empiricism.
      *   *Counter-Argument:* It's not *just* standard empiricism. It's a *heuristic constraint* on hypothesis generation. It tells you which hypothesis to test *first* and which one bears the burden of proof. Without the canon, you might treat "reasoning" and "association" as equal competing hypotheses. The canon says "Association is the null hypothesis."
      *   *Verdict:* Priya is half-right (it relies on evidence), but wrong that it's *empty*. It structures the inquiry.

  4.  **Address Question 2: Is there Substantive Methodological Work? (User's View)**
