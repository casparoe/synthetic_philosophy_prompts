          *   *Neurology:* Brain structure (though Morgan didn't have fMRI, he knew anatomy).
      *   *Key Distinction:* The canon applies to *interpreting a specific action*, not determining the *overall capacity* of the species.
      *   *Avoiding Begging the Question:* You don't use the *same* meowing behavior to prove the mind. You use *other* data (neurology, other experiments, evolutionary history) to establish the *capacity*, then apply that capacity to interpret the specific action.

