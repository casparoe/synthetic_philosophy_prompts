answer: |-
  The gaslight had been turned down until the mantle hissed, a small, serpentine sound in the silence of the Trinity study. It was necessary, Mrs. G. had insisted, for the manifestations. Henry Sidgwick found the darkness less conducive to observation than to anxiety, but he had agreed to the conditions. He sat to the left of the small oval table, his right hand clasping the medium's left, his left hand resting on her knee. Across from him, Frederic Myers held the medium's other hand. Podmore watched from the shadows near the bookshelves, notebook open, pen poised like a dagger.

  It was 1892. Sidgwick was fifty-four, though the fatigue in his bones suggested a man a decade older. He was aware of the absurdity of the posture. Here were three founders of a learned Society, men who lectured on logic and classics and the structure of the mind, engaged in what looked remarkably like a children's game of *grandmother's footsteps*. There was a comedy to it, certainly. He could imagine the sneer of a positivist colleague from the Moral Sciences faculty: *Sidgwick checking a widow's skirts for hidden levers.*

  He did not smile. He tightened his grip on Mrs. G.'s hand. Her skin was warm, slightly damp. He was checking for muscle tension, for the subtle shift of weight that precedes a fraud. He was also, he admitted to himself only in the quietest recesses of his thought, praying for the leverage.

  "Is the circle complete?" Mrs. G. whispered. Her voice was ordinary, lacking the tremolo of the stage mediums they had debunked in the seventies.

  "Complete," Sidgwick said. His voice sounded dry, academic. "We are ready."

  They waited. The room was filled with the smell of old paper and the coal dust that settled on everything in Cambridge. A clock on the mantel ticked, measuring out seconds that felt distinct, granular.

  Sidgwick looked at the table. It was plain deal, unvarnished. They had brought it themselves. There were no traps in the floorboards; Podmore had inspected them. There were no confederates in the room. There was only the empirical data they were desperate to collect.

  It was not curiosity that brought him here. He had long since exhausted mere curiosity. It was a structural necessity. In the quiet hours of the night, when the lectures on *The Methods of Ethics* were prepared and the University business was concluded, the equation remained unbalanced. He had proven, to his own satisfaction, that rational benevolence was the ultimate duty. He had proven that self-interest was the ultimate motive. He had also proven that these two things were not naturally identical. In this world, the dutiful man often suffered, and the selfish man often prospered.

  Unless.

  Unless the universe was not closed. Unless there was a further fact, a variable outside the visible system, that reconciled the conflict. If the dead survived, if consciousness persisted beyond the dissolution of the body, then the sanctions of duty could be secured. The moral government of the universe could be established. Without it, his life's work was a cathedral built on a void. He was asking this woman, this instrument, to lift a piece of wood three inches into the air so that he might know if goodness was woven into the fabric of reality or merely a useful fiction.

  A knock came from the surface of the table. Sharp. Single.

  "Did you feel that?" Myers whispered. His eyes were bright, too bright. Myers wanted it to be true for the sake of poetry, for the sake of the soul's expansion. Sidgwick wanted it to be true for the sake of arithmetic.

  "I felt a vibration," Sidgwick said. "Mrs. G., did you knock?"

  "No, Professor."

  Another knock. Then a third. The table shuddered beneath his palms. It was subtle, a microscopic shift of gravity. Sidgwick focused entirely on the medium's wrist. He was feeling for the tendon, the slip of the ulna. If she pushed with her knee, he would know. If she leveraged with her foot, he would know.

  The table rose.

  It was not a dramatic levitation. It did not soar to the ceiling. It lifted perhaps two inches, tilted on its back legs, and hovered there for a count of three. In the dim light, the shadow beneath the wood deepened.

  Podmore's pen scratched furiously. *Time: 11:14. Phenomenon: Partial levitation. Control: Maintained.*

  Sidgwick held his breath. He was searching for the trick. He needed it to be a trick, because if it was not a trick, it was a miracle, and he had spent a lifetime distrustful of miracles. And yet, if it was not a trick, the void was filled. The gap between duty and self-interest was bridged by the continuity of consciousness.

  The table settled. The legs touched the carpet with a dull thud.

  "Did you assist?" Sidgwick asked. He kept his voice level, devoid of accusation, devoid of hope.

  "I did not," Mrs. G. said. She sounded tired. They were all tired.

  Sidgwick released her hand. He flexed his fingers, the joints stiff. He looked at Myers, who was leaning forward, eager to interpret, to weave a narrative of spirits and guides. He looked at Podmore, who was already looking for the thread, the magnet, the hidden fulcrum.

  Sidgwick felt neither the romance of Myers nor the suspicion of Podmore. He felt a profound, hollow ache. The event had occurred. It was recorded. But did it prove the moral government of the universe? A table lifting proved only that a table could lift. It did not prove that the virtuous would be rewarded. It did not prove that the sacrifice of self was anything more than a biological error.

  And yet, it was a crack in the wall. It was evidence that the laws of matter were not as absolute as the materialists claimed. If matter could be moved by will without contact, then will was primary. If will was primary, then perhaps the moral will was not futile.

  "Thank you, Mrs. G.," Sidgwick said, standing up. His knees cracked. He turned up the gaslight. The room flooded with harsh, yellow illumination. The shadows vanished. The table was just a table again, scratched and ordinary. The medium was just a woman in a black dress, smoothing her hair.

  The magic, if it had existed, evaporated in the light. This was the tragedy of their work. The phenomenon required the dark, but the verification required the light. They could never have both at once.

  "We shall compile the report," Podmore said, closing his notebook. "We need more trials. Controls."

  "Of course," Sidgwick said. He walked to the window and looked out onto the college court. The stone was pale in the moonlight. Somewhere out there, men were living lives of quiet desperation, choosing between what was good for them and what was good for others, with no guarantee that the choice mattered.

  He turned back to the room. Myers was helping Mrs. G. with her shawl, speaking softly to her about her guides. Sidgwick watched them. He felt a sudden, sharp compassion for them, and for himself. They were like men digging a tunnel from opposite sides of a mountain, hoping to meet in the middle. He dug with logic; Myers dug with intuition. They might meet. They might dig forever and never break through.

  He picked up his own notebook from the desk. He opened it to a fresh page. He dated it. He described the light, the temperature, the seating arrangement. He described the levitation. He described the control of the medium's limbs.

  Then he put the pen down. He did not write *proved*. He did not write *fraud*. He wrote *inconclusive*.

  It was the only honest word he had. It was the word that had defined his ethics, his theology, and now his twilight years. He would return to this room. He would sit in the dark again. He would hold the hands of strangers and wait for the universe to speak, knowing that even if it spoke, he might not understand the language.

  "Shall I walk you to your lodgings?" Sidgwick asked the medium.

  "That would be kind, Professor."

  He took her arm. It was a duty, a small kindness in a universe that might be indifferent. He performed it carefully, precisely, as if the act itself, repeated enough times, might somehow generate the sanction he sought. They walked out into the night, leaving the table standing in the center of the room, waiting for the dark to return.
