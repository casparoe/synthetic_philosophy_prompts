answer: |-
  This is an exceptionally sharp analysis. You have independently reconstructed one of the most significant problems in 20th-century metaethics. You aren't confused; you've hit the nail right on the head.

  Let's work through your three questions by digging into the logic of your tax example, testing your "policy" patch, and seeing where the stress points are.

  ### 1. Does your restatement of the problem hold up?

  **Yes, completely.**

  Your intuition about the conditional sentence ("If cheating on taxes is wrong...") is the critical insight. In logic, this is called an **unasserted context**.

  When you say, "Cheating on taxes is wrong," you are asserting the sentence. If you are an anti-realist (specifically an *expressivist* or *emotivist*), you are expressing an attitude: "Boo tax cheating!"

  But when you say, "If cheating on taxes is wrong, then talking your accountant into it is wrong," you are **not** saying "Boo tax cheating!" You are not booing anything. You are merely entertaining the thought. You might not even think tax cheating is wrong; you might be arguing with someone who does.

  Here is the logical trap you identified:
  1.  If moral sentences *just* express attitudes (Boo!), then complex sentences (If/Then) should be meaningless, because you can't put an attitude inside an "If." (You can't say "If Boo! then Hooray!").
  2.  But moral arguments *clearly* work. We reason with them. They have validity.
  3.  Therefore, moral sentences must be doing something more than just expressing attitudes. They must be capable of being true or false, or at least capable of being "consistent" in a way that mirrors truth.

  Your restatement is perfect. You have identified that simple emotivism ("It's just feelings!") destroys the possibility of moral reasoning. If morality is just feelings, you can't have logic, because feelings aren't the kind of things that can be premises in a valid argument.

  ### 2. Is this a known snag?

  **Yes. It is the famous "Frege-Geach Problem."**

  In the 1960s, philosophers Peter Geach and John Searle (building on Gottlob Frege) pointed out exactly what you did: Expressivism works fine for simple sentences ("Stealing is wrong"), but it fails miserably when those sentences are embedded in conditionals, questions, or negations ("Is stealing wrong?", "It is not the case that stealing is wrong").

  For decades, this was considered the knockout blow against anti-realism. If anti-realism can't explain why the tax argument is valid, it has to be abandoned.

  However, anti-realists didn't give up. They spent the last 50 years trying to solve exactly the problem you are wrestling with. Your "policy" idea is actually the direction they took to try to survive.

  ### 3. Is your "policy" idea a genuine fix?

  This is the most important part. Your proposal is: *Accepting the if-then sentence isn't about booing; it's signing onto a policy: "Don't boo the first thing unless you also boo the second."*

  This is a sophisticated move. It shifts the view from simple Emotivism (feelings) to **Norm-Expressivism** (commitments to rules). Philosophers like R.M. Hare (Prescriptivism), Simon Blackburn (Quasi-Realism), and Allan Gibbard have argued versions of this.

  But you suspected it might be "hiding the same hole under new language." Let's poke holes in it together.

  #### Hole #1: What is "Inconsistency" for Attitudes?
  You wrote: *"I genuinely don't know what it means for two attitudes or feelings to be 'inconsistent' in that same sense."*

  This is the crux of the issue.
  *   **In Beliefs:** Inconsistency is about **truth**. I cannot believe "It is raining" and "It is not raining" because the world cannot be both ways. One *must* be false. The mistake is cognitive; I am misrepresenting reality.
  *   **In Attitudes:** Inconsistency is about... what?
      *   I can love chocolate and hate chocolate at the same time. That's ambivalence, not a logical error.
      *   I can want to sleep in and want to go to the gym. That's a conflict of desire, but not a mistake.

  So, if I accept the policy "Don't boo tax cheating unless you boo encouraging it," and I boo tax cheating but *don't* boo encouraging it... what have I done?
  *   **The Realist says:** You have asserted a falsehood. You've made a mistake about the moral facts.
  *   **The Policy Expressivist says:** You have violated a norm of rationality. You are being "practically inconsistent."

  **The Hole:** Why is practical inconsistency a *mistake* in the same way logical inconsistency is? If I just say, "I don't care about consistency, I boo cheating but I don't boo encouraging it," what can you say to me?
  If you say, "But that's irrational!", I ask, "Why?"
  If you say, "Because your attitudes don't match your policies!", I say, "So what? I changed my policy."

  To make your fix work, you have to claim that there are **rules for attitudes** that are binding regardless of whether we like them. But once you start saying there are binding rules for correct attitudes... aren't you just smuggling "moral facts" back in through the back door?

  #### Hole #2: The "Validity" Problem
  In classical logic, an argument is **valid** if it is impossible for the premises to be true and the conclusion false.

  *   Premise 1: Cheating is wrong.
  *   Premise 2: If cheating is wrong, encouraging it is wrong.
  *   Conclusion: Encouraging it is wrong.

  If "wrong" doesn't mean "true/false," but rather "Boo/Policy," then the definition of validity breaks.
  *   Your fix tries to save validity by redefining it as: "An argument is valid if accepting the premises and rejecting the conclusion involves a clash of commitments."

  **The Hole:** This changes the meaning of "validity."
  Imagine a person, let's call him the "Moral Sociopath." He says:
  1.  "Okay, I accept the policy: If I boo A, I must boo B."
  2.  "Okay, I boo A (Cheating)."
  3.  "But I refuse to boo B (Encouraging cheating)."

  Under your policy view, this person is "inconsistent." But is he **wrong**?
  If morality is just about our attitudes/policies, then the Sociopath has just revealed that his set of attitudes is different from ours. He has a "fractured" policy. But why is a fractured policy worse than a different policy?
  *   If I say "2+2=5," I am mistaken about reality.
  *   If the Sociopath says "Boo A, but not Boo B," he is just... different.

  To say he is making a *mistake* (rather than just being different), you need a standard of correctness outside of his own attitudes. But anti-realism says there *is* no standard outside of attitudes. So, how can he be mistaken?

  #### Hole #3: The "Creep" Back to Realism
  This is the deepest hole. Your "policy" solution is so good at explaining moral reasoning that it starts looking like Realism again.

  If moral sentences behave like truth-apt sentences in logic...
  If there are correct and incorrect ways to hold moral attitudes (consistency)...
  If we can be mistaken about our moral commitments...

  Then what is the practical difference between saying "Moral statements are true" and "Moral statements are consistent policies"?

  Simon Blackburn (a famous anti-realist) calls this **Quasi-Realism**. He admits that anti-realists have to *earn the right* to talk as if morality is real. They have to explain why we can talk about "truth," "facts," and "mistakes" in morality, even if there are no actual moral facts.

  **The Challenge for you:**
  Your policy idea works *if* you can explain why consistency in attitudes is mandatory.
  *   **If you say:** "Consistency is mandatory because it helps us get what we want." -> Then morality is just hypothetical advice (If you want social order, be consistent). It loses its "ought" power.
  *   **If you say:** "Consistency is mandatory period, regardless of what we want." -> Then you are positing a normative fact about rationality. You are saying "It is a FACT that inconsistent attitudes are bad." But wait, I thought there were no moral facts? Now you have a "rationality fact."

  ### Summary of the "Poke Holes" Session

  1.  **Your Diagnosis:** Spot on. You correctly identified that simple anti-realism kills moral logic.
  2.  **Your Solution:** The "Policy" move is the standard, best-available defense for anti-realists (Norm-Expressivism).
  3.  **The Remaining Hole:** The definition of "Mistake."
      *   In realism, a mistake is failing to match the world.
      *   In your policy view, a mistake is failing to match your own commitments.
      *   **The Problem:** If I change my commitments, I fix the mistake. This makes morality seem too voluntary. If I can just decide "I no longer care about consistency between cheating and encouraging," have I solved the problem? The Realist says "No, you're still wrong." The Expressivist has a hard time explaining *why* without admitting there's a "fact of the matter" about what attitudes are correct.

  ### Where does this leave you?

  You are standing exactly where the metaethical debate has been for 50 years.

  *   **If you stick with your Policy Idea:** You are a **Quasi-Realist**. You believe morality is constructed from our attitudes, but you argue that once constructed, it has logical rules that bind us. You have to defend the claim that "logical consistency for attitudes" is a real thing, not just a metaphor.
  *   **If you think the Hole is fatal:** You might be pushed toward **Realism**. You might conclude that the only way to explain why the Tax Argument is valid (and why the Sociopath is truly *wrong*, not just inconsistent) is if "Wrongness" is a property that makes the sentences true, independent of our booing.

  Your intuition that "inconsistent" feels like it's doing too much heavy lifting is the exact pressure point that keeps this debate alive. You haven't confused yourself; you've found the boundary where Anti-Realism struggles to explain the *authority* of logic without secretly borrowing from Realism.
