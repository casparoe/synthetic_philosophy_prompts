      *   **Context:** The user is surprised by Berkeley's focus on economics (Irish banking/coinage) compared to his famous metaphysics (*esse est percipi*). They note the tension between Berkeley's view (money as a ticket/counter) and Locke's view (money has intrinsic value based on silver weight/consent) from the recoinage controversy.
      *   **Task:**
          1.  Compare Berkeley's and Locke's accounts of money (what it is, where value comes from).
          2.  Evaluate whether Berkeley's economic view is an extension of his immaterialism or an independent argument that merely echoes his metaphysics.
