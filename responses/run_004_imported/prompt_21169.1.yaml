          *   *Core View:* Money is a commodity (specifically silver/gold).
          *   *Value Source:* Intrinsic value of the metal (weight/fineness) + public consent (to use it as money).
          *   *Key Argument:* You cannot alter the denomination without altering the metal content without committing fraud. Value is tied to the physical substance.
          *   *Metaphysical Link:* Lockean realism/empiricism. Objects have primary qualities (solidity, extension) that exist independently of perception. Silver *is* valuable.

      *   **George Berkeley on Money (*The Querist*):**
          *   *Context:* Early 18th century (1735-1737), Irish economic stagnation.
          *   *Core View:* Money is a ticket, counter, or token.
          *   *Value Source:* Utility, circulation, and the industry/labor it commands. It represents claims on goods and labor.
          *   *Key Argument:* Wealth is not the accumulation of precious metal but the activation of industry. Paper money (credit) is valid if it stimulates production.
          *   *Metaphysical Link:* Immaterialism (*esse est percipi*). Ideas/things depend on mind/activity. Money is a sign/symbol, not a substance.

  3.  **Address Task 1: Comparison of Money and Value:**

      *   *Ontology of Money:* Locke = Commodity (Substance). Berkeley = Sign/Token (Relation/Function).
      *   *Source of Value:* Locke = Natural scarcity of metal + Consent. Berkeley = Human industry + Circulation + Trust.
      *   *Policy Implication:* Locke = Protect the metal standard (deflationary/hard money). Berkeley = Stimulate the economy via credit/paper money (inflationary/activist).
