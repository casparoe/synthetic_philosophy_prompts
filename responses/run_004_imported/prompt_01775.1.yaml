          *   *Dimension 2 (Secondary/Metaphysical):* What does the term pick out given a world considered as *counterfactual*? (Rigid designation).
      *   **Apply to "Water = H2O":**
          *   *Secondary Intension:* In our world, Water = H2O. Since both are rigid designators, in *every* possible world where they exist, Water = H2O. Thus, **Necessary**.
