          *   2Dism doesn't say "Water = H2O" is a priori. It says the *statement connecting the primary intensions* is contingent. The statement connecting the secondary intensions is necessary.
          *   The identity statement "Water = H2O" expresses a necessary truth (secondary), but we need experience to know that the actual world satisfies the condition where the primary intensions converge.

      *   **Why it Vindicates Kripke:**
