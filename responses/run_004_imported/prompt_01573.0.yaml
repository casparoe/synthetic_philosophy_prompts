answer: |-
  You were right to stand your ground, though your friend isn't entirely crazy for being confused—this is one of the densest corners of metaphysics. But on the specific point of whether Galen Strawson's "Basic Argument" is just hard determinism in disguise? **You win that round.**

  Hard determinism says: "Determinism is true, therefore free will is impossible."
  Strawson says: "Whether determinism is true or false, free will (of the kind required for *ultimate* moral responsibility) is impossible."

  Here is the breakdown you needed last night, premise-by-premise, along with the *causa sui* trap, the Nietzsche connection, and the father/son feud.

  ---

  ### 1. The Basic Argument: Premise-by-Premise
  Strawson's argument is designed to be valid regardless of the laws of physics. It targets the **structure of agency**, not the **causality of the universe**.

  Here is the standard reconstruction (based on his 1994 paper *"The Impossibility of Moral Responsibility"*):

  1.  **The Principle of Responsibility:** You do what you do, in any given situation, because of the way you are (your mental nature, character, motives, etc.).
  2.  **The Requirement for Ultimate Responsibility:** To be truly (ultimately) morally responsible for what you do, you must be truly (ultimately) responsible for the way you are (at least in certain crucial mental respects).
  3.  **The Initial Condition:** You cannot be ultimately responsible for the way you are when you first exist (obviously, you didn't choose your genetics or baby brain).
  4.  **The Change Requirement:** To become responsible for the way you are later, you must have intentionally changed yourself.
  5.  **The Regress Problem:** To intentionally change yourself, you must have had some **reason** or **motive** to change yourself in that specific way.
  6.  **The Source of Motives:** That reason/motive came from the way you *already* were at that time.
  7.  **The Loop:** Therefore, to be responsible for the new way you are, you must be responsible for the old way you are (which produced the motive for change).
  8.  **The *Causa Sui* Condition:** The only way to stop this infinite regress is if you created yourself *ex nihilo* (from nothing). You would have to be the cause of yourself (*causa sui*).
  9.  **The Impossibility:** It is logically impossible to be the cause of yourself (you can't exist prior to yourself to cause yourself).
  10. **Conclusion:** Therefore, ultimate moral responsibility is impossible.

  ### 2. Where the *Causa Sui* Move Does the Work
  This is the engine of the argument. In philosophy, *causa sui* means "cause of itself."

  Strawson argues that for you to be the *ultimate* source of your actions, the "you" that acts must be the ultimate source of the "you" that exists.
  *   If your actions flow from your character, and you didn't choose your character, you aren't responsible.
  *   If you say, "But I chose to change my character!" Strawson asks, "Why did you choose *that* change and not another?"
  *   The answer will always be: "Because of some preference/value I already had."
  *   Where did *that* preference come from? Previous character.
  *   Where did *that* come from? Even previous character (or genetics/environment).

  To break this chain, you would need a moment where you existed *without* a nature, chose a nature, and thus created yourself. Strawson (and most logicians) say this is incoherent. You can't pull yourself up by your own bootstraps.

  **Why this isn't just Hard Determinism:**
  A hard determinist stops at Premise 1 and says, "The past determines your nature."
  Strawson says, "Okay, imagine the past *doesn't* determine your nature (Indeterminism). Imagine there is a random quantum gap in your brain."
  *   If that gap is random, it's not *you* controlling it; it's luck.
  *   If it's not luck, it's determined by your nature (back to Premise 1).
  *   Either way, you never get to be the *causa sui*. The argument kills Libertarians (who believe in indeterministic free will) just as dead as it kills Compatibilists.

  ### 3. Determinism vs. Indeterminism: Why It Doesn't Matter
  This is the specific point you were struggling to articulate.

  *   **Scenario A (Determinism):** Your actions are the inevitable result of prior causes. You are a domino. You are not the ultimate source. **No Responsibility.**
  *   **Scenario B (Indeterminism):** Your actions involve some random chance. When you "choose," there is an element of randomness. But randomness is not control. If your decision was partially random, you can't claim full credit for it. It's just a roll of the dice in your head. **No Responsibility.**

  Strawson calls this the "Dilemma of Determinism." He argues that **determinism is not the problem; the problem is the requirement for *ultimate* origination.** Since nothing can originate itself (because of the *causa sui* impossibility), the physical status of the universe (determined or random) is irrelevant.

  ### 4. The Nietzsche Connection (Your Friend Was Right)
  Your friend wasn't making that up. Strawson explicitly credits Nietzsche with identifying the *causa sui* problem.

  In *Beyond Good and Evil* (Section 21), Nietzsche writes about the desire to be responsible for oneself:
  > *"To be 'free' in this sense... would mean to be the *causa sui*... which is the best self-contradiction that has been conceived so far."*

  Nietzsche argued that the concept of free will was invented by theologians to make humans "judgable" and "punishable." Strawson adopts this Nietzschean insight but formalizes it into the logical regress argument above. So, tell your friend she gets bonus points for the citation, even if she lost the main argument.

  ### 5. Galen vs. P.F. Strawson (The Family Feud)
  This is where the confusion usually lies. They are father and son, and they are on opposite sides of the fence.

  **P.F. Strawson (The Dad):**
  *   **Famous Work:** *"Freedom and Resentment"* (1962).
  *   **Position:** Compatibilist / Naturalist.
  *   **Argument:** He thinks we are asking the wrong metaphysical question. We can't step outside our human skin to judge "ultimate" responsibility. What matters is our **reactive attitudes** (resentment, gratitude, forgiveness). These are natural, unavoidable parts of human life. As long as we have these emotions, we have moral responsibility. We shouldn't look for a metaphysical "ghost in the machine."
  *   **Vibe:** "Stop worrying about physics; look at how we actually live."

  **Galen Strawson (The Son):**
  *   **Famous Work:** *"The Basic Argument"* (1994 onwards).
  *   **Position:** Impossibilist (Hard Incompatibilist).
  *   **Argument:** He thinks his dad is sweeping the hard metaphysical truth under the rug. Just because we *feel* resentment doesn't make it *true* that we are ultimately responsible. The *causa sui* argument proves that the kind of responsibility required to justify *true* blame or praise is impossible.
  *   **Vibe:** "Dad, I know we feel resentment, but logically, none of us deserve it."

  ### Summary for the Next Round of Drinks
  1.  **You were right:** It's not hard determinism. It's an argument that works *even if* determinism is false.
  2.  **The Mechanism:** It relies on an infinite regress of self-creation that requires the impossible *causa sui*.
  3.  **The Friend:** She gets credit for the Nietzsche reference (*Beyond Good and Evil*, Sec 21).
  4.  **The Dad:** P.F. Strawson argues responsibility is about social emotions (Compatibilism); Galen argues responsibility is about metaphysical origination (Impossibilism).

  You can tell her: *"Strawson isn't saying the universe is determined. He's saying that even if the universe is random, you still can't be the cause of yourself. And since you can't be the cause of yourself, you can't be ultimately responsible. Dad says responsibility is just about feelings; Son says feelings don't fix the logic."*
