  *(Self-Correction Note)*: I need to make sure I don't make Lewis look *too* weak on preemption. Lewis actually updated his theory (1986, 2000) to handle preemption via "causal chains" or "influence." Elena should mention this to show she knows her stuff, but Marcus should counter that Interventionism handles it *natively* without ad-hoc fixes.

