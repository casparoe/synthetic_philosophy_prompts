      For A $\to$ B $\to$ A- to be a pump:
      1. Start A.
      2. Trade A $\to$ B. Permissible because $\neg(A \succ B)$.
      3. Trade B $\to$ A-. Permissible because $\neg(B \succ A^-)$.
      4. Result: Have A-. Started with A. Since $A \succ A^-$, this is a loss.
      *Wait, for step 3 to be permissible:* The agent must not prefer B to A-.
