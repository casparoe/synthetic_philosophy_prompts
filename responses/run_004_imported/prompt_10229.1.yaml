answer: |-
  You are not imagining this, and you aren't necessarily "rationalizing guilt" either. What you are describing is one of the most famous and well-documented phenomena in experimental philosophy and psychology.

  It is called the **Knobe Effect** (or the **Side-Effect Effect**).

  In 2003, a philosopher named Joshua Knobe ran experiments almost identical to your situation. He presented people with two scenarios involving a CEO implementing a new program to increase profits.

  *   **Scenario A (Harm):** The CEO says, "I don't care at all about helping the environment, I just want to make as much profit as possible." The program ends up *harming* the environment.
  *   **Scenario B (Help):** The CEO says, "I don't care at all about harming the environment, I just want to make as much profit as possible." The program ends up *helping* the environment.

  **The Result:** When the outcome was **harm**, the vast majority of people said the CEO *intentionally* harmed the environment. When the outcome was **help**, the vast majority said the CEO did *not intentionally* help the environment.

  This matches your coffee shop situation perfectly. Your mental state ("I just want to cut costs, I don't care about the side effects") was identical in both cases. But because Priya's outcome was negative, your staff attributes **intent** to you. Because Tom's outcome was positive, they attribute it to **luck**.

  ### Why do people do this?

  You asked if there is "something real going on here about how intention and blame actually work." The answer is yes. Human beings do not judge intention like a court of law (looking strictly at internal mental states). We judge intention through a **moral lens**.

  Here is the breakdown of why your staff is reacting this way:

  **1. Blame requires a target; praise does not.**
  When something bad happens (Priya loses childcare), our social brains go into "threat detection" mode. We look for a cause to hold accountable so we can prevent it from happening again. To hold you accountable, we need to establish that you *chose* this. If it was just an "accident," you aren't truly blameworthy. So, our brains subconsciously upgrade your "indifference" to "intent" to satisfy the need for blame.

  When something good happens (Tom gets study time), there is no threat. We don't *need* to find someone to praise. It feels nice, but we don't have a psychological drive to assign agency. So, we accept your "indifference" at face value: "Oh, it was just a lucky side effect."

  **2. Indifference to harm is seen as aggression.**
  In social contracts, there is an expectation that leaders will avoid harming their team if possible. When you said, "I don't care... whether this messes with Priya's hours," you violated that expectation.
  *   **Regarding Priya:** By saying you didn't care about the harm, you signaled that the harm was an *acceptable cost* to you. In moral psychology, accepting a foreseeable negative consequence is often treated as functionally equivalent to intending it. This is known as **recklessness**.
  *   **Regarding Tom:** By saying you didn't care about the help, you signaled that the benefit was *not your goal*. Since we don't expect you to help employees at the cost of profits, your indifference there seems honest.

  **3. The "Default Assumption" differs.**
  *   **Harm:** We assume people *don't* want to hurt others. If you hurt someone and say "I didn't care," we assume you are lying or that your lack of caring is malicious enough to count as intent.
  *   **Help:** We assume people *might* want to help, but we aren't sure. If you help someone and say "I didn't care," we believe you, because it's plausible you really didn't care.

  ### Is your sister right?

  Your sister says you are rationalizing because "deep down you obviously cared more about hurting Priya than helping Tom."

  She is half-right, but for the wrong reason.
  *   **Where she's wrong:** The Knobe Effect shows that people perceive this asymmetry *even when the mental state is identical*. You don't necessarily have a hidden desire to hurt Priya for your staff to perceive you that way. This is a universal cognitive bias, not just a judgment on your specific character.
  *   **Where she's right:** In a leadership context, **impact outweighs intent.** Even if your internal mental state was truly neutral, the *statement* you made ("I don't care... whether this messes with Priya's hours") is arguably negligent. As a business owner, you *should* care. By explicitly voicing indifference to an employee's livelihood, you gave them the evidence they needed to paint you as the villain.

  ### The Fresh Take

  You are stuck arguing about **intent** (what was in your head), while your staff is arguing about **responsibility** (what happened to Priya).

  *   **You are thinking:** "I didn't intend the harm, therefore I am not to blame."
  *   **They are thinking:** "You had the power to prevent the harm, you chose the path that caused it, and you said you didn't care. Therefore, you own the harm."

  In management and ethics, **foreseeability** often trumps **desire**. You knew cutting hours would impact schedules. You knew Priya was a single mom (presumably). You proceeded anyway and explicitly stated indifference. To your staff, that isn't "neutral"; that is a choice to prioritize savings over Priya's stability.

  ### How to move forward

  You can't win the argument by explaining the Knobe Effect to your staff (that will sound like you're calling them irrational). Instead, you have to bridge the gap between your intent and their perception.

  1.  **Stop defending your intent.** Saying "I didn't mean to" sounds like "It's not my fault." To them, it *is* your fault because you made the schedule.
  2.  **Validate the impact.** Acknowledge that regardless of your goal, the outcome for Priya was severe and you underestimated it. "I was focused on the budget numbers, and I failed to account for the real-world impact on Priya's childcare. That was my mistake."
  3.  **Fix the asymmetry.** If you want to prove you aren't "targeting" her, offer a solution. Can you swap shifts? Can you offer a small stipend for the childcare gap? Can you revisit the schedule?
  4.  **Reframe the "Tom" situation.** If you want credit for Tom, don't claim intent. Say, "I'm glad the new schedule worked out for Tom's classes, even though that wasn't the goal. I wish the same luck applied to everyone."

  **Summary:** People are inconsistent about intention, but it's a *systematic* inconsistency, not a random one. We assign intent to bad outcomes to facilitate blame, and we withhold intent from good outcomes to save on praise. You aren't crazy for noticing it, but you can't use it to absolve yourself of the responsibility for Priya's situation. In leadership, "I didn't care" is often judged as harshly as "I wanted to."
