prompt: |-
  I'm one of five people on my engineering org's committee that decides who gets promoted to Staff Engineer. Our rubric has two dimensions, 'technical depth' and 'organizational influence,' each decided by majority vote among the five of us, and a candidate is promoted only if both pass. On our latest candidate, two of us judged she cleared both dimensions, one judged she cleared depth but not influence, one judged the reverse, and one judged she cleared neither -- so, dimension by dimension, three of five of us credit her with depth and three of five credit her with influence, and by the rubric she's promoted. But when I polled the five of us directly on whether she should be promoted, only the two who credited her with both dimensions said yes; the other three said no. Three of us, including me, want to keep deciding dimension-by-dimension, since it's auditable and ties the outcome to stated criteria rather than gut feeling; the other two want to just poll overall judgment directly, since it seems indefensible to promote someone that a majority of us, individually, don't think has earned it. I need to circulate the committee's written rationale before we finalize this promotion cycle on Friday, and whatever reasoning I write will likely set the default for every future split decision -- please draft that memo: it should say plainly what happens to this candidate, recommend which procedure we adopt going forward, and take the losing side's argument seriously rather than wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Situation:**
      *   **Context:** Engineering promotion committee (5 members).
      *   **Role:** The user is one of the 5 members, tasked with drafting the memo.
      *   **The Candidate:** "Split decision" case.
          *   Dimension 1 (Technical Depth): 3 Yes, 2 No (Passes majority).
          *   Dimension 2 (Organizational Influence): 3 Yes, 2 No (Passes majority).
          *   Overall Promotion Vote: 2 Yes, 3 No (Fails majority).
      *   **The Conflict:**
          *   Group A (3 people, including user): Prefer dimension-by-dimension voting (Rubric-based). Result: Promote.
          *   Group B (2 people): Prefer overall judgment voting (Holistic). Result: Do not promote.
      *   **The Stakes:** This memo sets the precedent for future cycles. It needs to be sent before Friday.
      *   **Requirements:**
          *   State the decision clearly (Promote or Not?).
          *   Recommend the procedure for the future.
          *   Acknowledge and respect the losing side's argument (the "Do not promote/Holistic" side).
          *   Tone: Professional, fair, decisive, engineering-focused.

  2.  **Determine the Decision:**
      *   The prompt implies the user is in the majority regarding the *process* (3 out of 5 want to keep the dimension-by-dimension method).
      *   The current rubric *says* "decided by majority vote among the five of us, and a candidate is promoted only if both pass."
      *   Strictly following the *existing* rubric leads to promotion (3/5 on Depth, 3/5 on Influence).
      *   Changing the process *mid-cycle* to an overall vote would be unfair to the candidate and undermine the established rules.
      *   *Decision:* Promote the candidate based on the existing rubric.
      *   *Future Process:* Stick with the dimension-by-dimension rubric but acknowledge the need for calibration or potential rubric refinement.

  3.  **Address the "Losing Side" (The Holistic/Overall Vote Argument):**
      *   Their core concern: It feels wrong to promote someone a majority of the committee individually wouldn't endorse. It risks "vote trading" or misalignment on the bar.
      *   Validity: This is a strong philosophical point (Condorcet's paradox/Doctrinal Paradox). It highlights that aggregating judgments on premises doesn't always match aggregating judgments on conclusions.
      *   How to validate: Acknowledge that the outcome feels counterintuitive. Admit that the rubric isn't perfect. Promise to review the rubric definitions if this keeps happening.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (finalizing Cycle X promotions) and the specific decision on the candidate in question.
      *   **The Decision:** Clearly state she is promoted.
      *   **The Rationale (The "Why"):** Explain the rubric mechanics. 3/5 on Depth, 3/5 on Influence. This follows the agreed-upon rules.
      *   **Addressing the Dissent (Crucial Step):**
          *   Acknowledge the 3-2 overall vote against.
          *   Validate the concern: "It is uncomfortable when the aggregate of parts differs from the whole."
          *   Explain why we aren't changing it *now*: Fairness to the candidate (rules shouldn't change mid-game), consistency, auditability.
      *   **Future Process Recommendation:**
          *   Reaffirm dimension-by-dimension voting.
          *   Add a safeguard: If there's a strong divergence (like this one), trigger a calibration discussion or rubric review.
      *   **Closing:** Next steps/timeline.

  5.  **Refining the Tone:**
      *   *Avoid:* "We overruled the minority."
      *   *Use:* "We adhered to the established framework."
      *   *Avoid:* "Their gut feeling is wrong."
      *   *Use:* "Holistic judgment is valuable, but the rubric exists to reduce bias."
      *   *Key Concept:* The "Doctrinal Paradox." (I shouldn't necessarily name-drop it in the memo as it sounds academic, but I should understand the logic). The logic is: Premise-based procedure vs. Conclusion-based procedure. We are choosing Premise-based for transparency.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add language about "trust" and "calibration."
      *   *Critique:* Does it sound like the user is imposing their will?
      *   *Fix:* Frame it as "The Committee" (even though the user is drafting it). Use "We."
      *   *Critique:* Did I answer the prompt's requirement to take the losing side seriously?
      *   *Fix:* Ensure a dedicated paragraph explains *why* their concern is valid (risk of promoting someone the majority doesn't support) and what we will do to mitigate it (calibration), even if we don't adopt their voting method.

  7.  **Final Polish:** Check the Friday deadline mention. Ensure the recommendation is actionable. (Wait, the prompt asks *me* to draft the memo. I need to make sure I don't sound like an AI, but like a committee member).

      *   *Decision:* I will draft the memo as if I am the committee chair or the designated scribe (since the user says "whatever reasoning I write"). I will assume the decision is to **Promote** because the existing rubric dictates it, and changing rules mid-stream is unethical. The recommendation will be to keep the rubric but improve calibration.

  8.  **Final check on constraints:**
      *   Say plainly what happens to the candidate. (Promoted).
      *   Recommend procedure going forward. (Keep rubric, add calibration).
      *   Take losing side seriously. (Acknowledge the "majority opposition" paradox).

      *(Self-Correction)*: Wait, if 3 out of 5 want to keep the dimension-by-dimension method, that *is* the majority. So the decision to promote is the majority decision on *process*, even if the overall sentiment vote was 2-3. The memo needs to reflect that the *process* won the day.

      Let's write it.

      *Subject:* Promotion Committee Decision & Process Recommendation – [Cycle Date]
      *To:* Engineering Leadership / Committee Members
      *From:* [User Name/Committee]

      *Structure:*
      1. Decision on Candidate.
      2. Rationale (Rubric adherence).
      3. Addressing the divergence (The "Losing Side").
      4. Future Process (Rubric + Calibration).

      *Key phrase to include:* "Premise-based vs Conclusion-based." (Maybe too academic? Let's stick to "Criteria-based vs Holistic").

      *Refining the "Losing Side" argument:* They argue that if 3 people say "No" overall, promoting undermines the committee's collective wisdom. I need to say: "We hear you. But if we switch to holistic now, we punish the candidate for our lack of calibration. Instead, we will fix the calibration."

      *Okay, ready to draft.*
answer: |-
  **TO:** Engineering Leadership Committee
  **FROM:** Staff Promotion Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Promotion Cycle Decisions and Voting Process Recommendation

  **Decision on Candidate [Name]**

  After reviewing the evaluation data for [Candidate Name], the committee has decided to **approve the promotion** to Staff Engineer.

  This decision was reached by applying our existing rubric strictly. The rubric requires a majority vote on two specific dimensions: *Technical Depth* and *Organizational Influence*.
  *   **Technical Depth:** 3 of 5 committee members voted that the candidate met the bar.
  *   **Organizational Influence:** 3 of 5 committee members voted that the candidate met the bar.

  As the candidate secured a majority on both required dimensions, the rubric dictates a successful promotion outcome.

  **Process Review and Recommendation**

  During our deliberation, a significant divergence emerged between the dimension-based results and a holistic vote on the promotion itself. While the dimension votes passed (3-2 each), a direct poll on whether to promote the candidate resulted in a 2-3 vote against promotion.

  This discrepancy has prompted a necessary review of our voting procedure. Two committee members advocated for shifting to a holistic "overall judgment" vote, arguing that it is indefensible to promote a candidate whom a majority of the committee individually do not support. We take this concern seriously. It highlights a genuine risk: that a criteria-based system can sometimes produce outcomes that feel misaligned with the collective intuition of the group, potentially weakening our shared ownership of the bar.

  However, the majority of the committee recommends **retaining the dimension-by-dimension voting structure** for the following reasons:

  1.  **Fairness and Consistency:** Changing the voting mechanism mid-cycle, or after a specific difficult case arises, undermines the stability of the process. Candidates are coached on the rubric; changing how we tally votes retroactively alters the goalposts.
  2.  **Auditability and Bias Reduction:** The primary purpose of the rubric is to decouple specific competencies from general likability or "gut feeling." Holistic voting often reintroduces unconscious bias, making it difficult to explain *why* a candidate was rejected or accepted. The dimension-based approach forces us to articulate specific gaps.
  3.  **Calibration vs. Procedure:** The divergence in this case suggests a calibration issue among the committee, not necessarily a flaw in the rubric structure. If three of us believe the candidate has Influence, but two of us (who may also acknowledge the technical depth) still vote "No" overall, we need to align on what "Influence" means, rather than bypass the criteria.

  **Action Items for Future Cycles**

  To address the valid concerns raised by the minority view, we are adopting the following safeguards effective immediately:

  *   **Divergence Trigger:** If a candidate passes the dimension votes but fails a holistic sentiment check (or vice versa), the committee will mandate a calibration discussion before finalizing the decision. We will not simply accept the mathematical output if the committee's confidence is low.
  *   **Rubric Refinement:** We will review the definitions of *Technical Depth* and *Organizational Influence* before the next cycle to ensure they capture the totality of the Staff role, reducing the likelihood of "checking the boxes" without meeting the spirit of the level.

  **Next Steps**

  We will proceed with finalizing [Candidate Name]'s promotion paperwork by Friday. We ask for leadership's endorsement on maintaining the dimension-based rubric with the added calibration safeguards described above.

  Thank you,

  [Your Name]
  On behalf of the Staff Promotion Committee
