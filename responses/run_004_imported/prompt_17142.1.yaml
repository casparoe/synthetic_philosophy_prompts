          *   *ARC's Stance:* ARC generally assumes a realist stance about the model's knowledge (there *is* a better map), whereas Quine is anti-realist about meaning.
          *   *Conclusion on Analogy:* It's structurally similar regarding *epistemic access* (we can't distinguish them from the outside), but metaphysically different regarding *ontology* (ELK assumes there is a truth to be found; Quine says there isn't). *However*, a sophisticated Quinean might argue ELK is chasing a ghost. A sophisticated ELK researcher might argue the physical state of the diamond provides the anchor Quine lacks.

