      *   *ARC's specific argument:* Recall the "ontology identification" problem. The AI might represent the diamond as a probability distribution over sensor states, while humans represent it as a solid object. The "Direct Translator" has to do the heavy lifting of converting "AI-probability" to "Human-Boolean." The Human Simulator just outputs "Human-Boolean" based on "AI-simulation-of-human."
