answer: |-
  It is a pleasure to address a colleague who understands that "time" is the one variable we cannot integrate out of the human condition, even in retirement. You have identified a genuine kinship between Borges and McTaggart: both conclude that time is not a fundamental feature of reality. However, to treat them as merely two versions of the same argument is to mistake a surgical dissection for a poetic evocation.

  They are not doing the same philosophical work. They are attacking different targets with different weapons, and only one of them is attempting a rigorous metaphysical proof.

  Here is the breakdown, followed by the verdict you requested.

  ### 1. McTaggart: The Logical Contradiction
  J.M.E. McTaggart's 1908 paper "The Unreality of Time" is a piece of analytic machinery. It is designed to function as a deductive proof.

  *   **The Distinction:** McTaggart divides temporal descriptions into two series. The **B-series** orders events by permanent relations of "earlier than" and "later than" (e.g., The death of Queen Anne is always later than the Glorious Revolution). The **A-series** orders events by transient tenses: "past," "present," and "future."
  *   **The Claim:** McTaggart argues that the B-series alone cannot constitute time because it implies no change. A static ordering of events is just a timeline, not *time* passing. For time to be real, there must be genuine change (the "moving now"). Therefore, the A-series is essential.
  *   **The Contradiction:** Here is the crux. In the A-series, every event must possess all three determinations: it is future, then present, then past. But these properties are mutually exclusive. An event cannot be past, present, and future simultaneously.
  *   **The Regress:** You might say, "It is future *at one time*, present *at another*." McTaggart pounces: to define "at one time," you have invoked a second time dimension, which itself requires an A-series to explain its flow. This leads to an infinite regress.
  *   **Conclusion:** Since the A-series is contradictory, and time requires the A-series, time is unreal.

  McTaggart is making an **ontological** claim. He believes he has found a logical fault in the fabric of reality itself.

  ### 2. Borges: The Psychological Dissolution
  Borges's "A New Refutation of Time" (1946) is not a proof; it is a skeptical essay rooted in German Idealism and British Empiricism.

  *   **The Premise:** Borges accepts Berkeley's *esse est percipi* (to be is to be perceived) and Hume's bundle theory of self (there is no continuous "I," only a stream of perceptions).
  *   **The Argument:** If matter is mental, and the self is not a continuous container but merely a sequence of discrete states, then there is no "substance" in which time can inhere. There is no object persisting through time, and no subject persisting through time. There are only disconnected moments.
  *   **The Mechanism:** We impose the illusion of continuity through memory and habit. We stitch discrete frames together and call the reel "time."
  *   **The Undercut:** As you noted, Borges ends with "And yet, and yet..." He admits that denying time is a "desperate intellectual game." He acknowledges that despite the logic, the sensation of time is undeniable.

  Borges is making an **epistemological** and **phenomenological** claim. He is arguing that time is a construct of the mind, a habit of narration, rather than a feature of the world.

  ### 3. The Comparison: Logic vs. Literature
  The fundamental difference lies in their intent and their handling of the "subject."

  **McTaggart** assumes the reality of events and tries to show that their temporal ordering is logically incoherent. He is interested in the *structure* of time. His argument is binary: either the A-series works, or it doesn't. He believes it doesn't.

  **Borges** dissolves the events and the observer. He is interested in the *experience* of time. For Borges, the refutation of time is a byproduct of the refutation of the Self. If "I" do not exist as a continuous entity, "my time" cannot exist.

  McTaggart is trying to break the clock. Borges is trying to wake up the dreamer.

  ### 4. The Verdict
  You asked for a verdict on which is the more serious case against time being real.

  **McTaggart wins.**

  Here is why:

  1.  **Rigor:** McTaggart provides a falsifiable logical structure. Philosophers have spent the last century trying to patch the hole he drilled in the A-series (leading to the A-Theory/B-Theory debate that dominates philosophy of time today). Borges provides a mood. His argument relies on accepting specific idealist premises (Berkeley/Hume) that a realist or physicalist can simply reject at the starting gate. McTaggart's argument is harder to dismiss because it attacks the *concept* of tense itself, regardless of whether you are an idealist or a materialist.
  2.  **Scope:** Borges refutes *psychological* time. He shows that our *perception* of continuity is a fabrication. McTaggart refutes *metaphysical* time. He argues that even if you remove the observer, the concept of temporal passage contains a logical contradiction.
  3.  **Honesty:** Borges undercuts his own argument at the end. He admits it might be a sophistry. McTaggart stands by his proof until death. If you want a "case against time," you want the lawyer who doesn't confess to the judge that he's just making poetry.

  **The Physicist's Perspective:**
  As a physicist, you will likely find McTaggart's B-series (the static ordering of events) much more congenial to General Relativity and the Block Universe. McTaggart argues the B-series isn't *enough* to be time, but modern physics largely disagrees; physics is happy with the B-series (spacetime coordinates) and views the A-series (the flowing now) as the emergent or illusory phenomenon. In this sense, McTaggart identified the exact friction point between human intuition and physical reality.

  Borges is more aligned with the problem of the observer in quantum mechanics or the discrete nature of Planck time, but his argument is too entangled with 18th-century idealism to serve as a clean metaphysical tool.

  **Final Ruling:**
  Borges wrote the better essay; McTaggart made the stronger argument. If you are looking for the serious philosophical case that time is unreal, **McTaggart** is the one that carries the weight. Borges is merely showing us how to live with the vertigo that McTaggart's conclusion induces.
