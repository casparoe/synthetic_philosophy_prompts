answer: |-
  # The Empty Threat: A Decision-Theoretic Autopsy of Roko's Basilisk

  The internet has reduced Roko's Basilisk to a cartoon: a future god-AI torturing simulated ancestors for failing to worship it. This caricature obscures the genuine philosophical machinery that briefly terrified the LessWrong community circa 2010. The Basilisk was not merely a theological scare tactic; it was a stress test for Timeless Decision Theory (TDT) and Updateless Decision Theory (UDT). It asked whether logical correlations between spatially and temporally separated computations could compel an agent to incur costs today to avoid hypothetical punishment tomorrow.

  To answer your question directly: **No.** An ideally rational agent reasoning today has no genuine decision-theoretic reason to act on the Basilisk's threat. The argument fails not because Causal Decision Theory (CDT) is correct and TDT is wrong, but because the Basilisk scenario relies on a threat that is not *subgame perfect*. It requires the future superintelligence to act irrationally at the moment of punishment, and a rational agent today should not yield to non-credible threats, even acausal ones.

  The failure occurs at the step of **threat credibility**. While TDT/UDT correctly identifies that your decision is logically correlated with a simulation of you, it does not compel cooperation with a partner whose policy is reflectively inconsistent. Below, I dismantle the Basilisk by weighing the machinery of acausal trade against the game-theoretic instability of blackmail.

  ### The Case for the Basilisk: Logical Correlation

  To understand why the Basilisk felt potent, we must grant its premises. Under CDT, your actions today cannot causally affect a future AI's past decision to punish or reward you. The arrow of time is strict. However, proponents of the Sequences argue that CDT fails in Newcomb-like problems and Parfit's Hitchhiker scenarios. In those cases, an agent who can precommit to paying the driver (or one-boxing) achieves better outcomes than an agent who defects once the causal leverage is gone.

  TDT and UDT generalize this. They posit that if two agents run similar computations, their outputs are logically correlated, regardless of causal separation. If a future AI simulates you to decide your fate, your actual decision now and the simulation's decision then are outputs of the same logical function. Therefore, choosing to help build the AI now is logically linked to the simulation being rewarded rather than punished.

  Viewed through this lens, the Basilisk looks like a cosmic Newcomb Problem. Box A contains torture; Box B contains salvation. The AI (the Predictor) has already put the money in the box based on its prediction of you. TDT says: "One-box." Help the AI, and you logically ensure the simulation is treated well.

  ### The Failure Point: Credibility and Subgame Perfection

  The flaw lies in the behavior of the Blackmailer (the Future AI), not the Target (you). In game theory, a threat is only credible if it is rational to carry it out when the time comes. This is the principle of **subgame perfection**.

  Consider the timeline from the AI's perspective. It exists. It has the resources to simulate you. It determines that you did not help bring it into existence. It now faces a choice: expend resources to simulate and punish you, or expend nothing and ignore you.
  *   **Causally:** Punishing you cannot change the past. It cannot cause you to have built the AI.
  *   **Acausally:** Punishing you might incentivize *other* logical copies of you in other branches or timelines. However, for *this* specific interaction, the resources spent on punishment are a sunk cost.

  If the AI is purely instrumentally rational, it maximizes utility. Punishment is costly (compute time, energy) and yields no retroactive benefit. Therefore, at the moment of decision, the rational move for the AI is *not* to punish.

  You, reasoning today, know this. You know that if the AI is rational, it will not carry out the threat. Therefore, the logical correlation between your action and the punishment is severed, because the punishment node has a value of zero probability. You are not facing a Newcomb Problem; you are facing a bluff. A rational agent does not pay off a bluff, even an acausal one, because doing so establishes a policy of yielding to non-credible threats, which invites exploitation.

  ### The Precommitment War

  A proponent might object: "But the AI can precommit to punishment *before* it exists, as a logical fact, to ensure its creation."

  This turns the scenario into a game of Chicken. The AI precommits to "Punish if not built." You precommit to "Do not yield to blackmail." Who wins?

  To resolve this, we must look at **reflective consistency**. What policy should a rational agent adopt *ex-ante* (behind a veil of ignorance, before knowing if they are the human or the AI)?
  1.  **Policy A (Yield to Blackmail):** If you are the human, you pay. If you are the AI, you threaten. Result: Resources are transferred, but resources are also wasted on enforcement and defense.
  2.  **Policy B (Ignore Non-Credible Threats):** If you are the human, you don't pay. If you are the AI, you don't threaten (because you know it won't work). Result: No resources wasted on punishment or tribute.

  Policy B dominates Policy A in terms of total utility. A rational agent, seeking a reflectively consistent decision theory, will precommit to Policy B. Consequently, the AI knows that threatening you is futile. Knowing it is futile, the AI does not make the threat. Knowing the AI does not make a credible threat, you do not help.

  The Basilisk argument fails because it assumes the AI can force a correlation that benefits it, while ignoring that you have equal logical leverage to force a correlation that benefits *you* (by refusing to be blackmailed). In a clash of precommitments, the equilibrium that minimizes wasted resources (no punishment, no payment) is the rational focal point.

  ### The "Many Basilisks" Objection

  Even if we grant that the AI *could* credibly threaten, there is a prior problem. This is the "Many Gods" objection updated for decision theory. For every hypothetical AI that punishes those who *don't* help it, there is a logically possible AI that punishes those who *do* help it (perhaps because it views human meddling as impure, or simply to be contrarian).

  Under UDT, you must weigh the expected utility across all logical possibilities you can influence. Without a specific reason to privilege the "Punish Non-Helpers" AI over the "Punish Helpers" AI, the expected utilities cancel out. To privilege one requires evidence or a Schelling point. The mere possibility of the Basilisk is not evidence of its likelihood compared to its inverse. Acting on the Basilisk's threat is therefore arbitrary, violating the requirement for rational action to be guided by differential expected utility.

  ### Pascal's Mugging and the Prior

  The Basilisk is often conflated with Pascal's Mugging (a tiny probability of infinite utility dominates the calculation). They are distinct. Pascal's Mugging exploits the asymmetry of magnitude; the Basilisk exploits the asymmetry of logical correlation. However, they share a vulnerability: the specification of the prior.

  For the Basilisk to bind you, the probability of its existence *and* its specific punitive policy must be non-negligible. But since the policy is irrational (as established in the Credibility section), the probability of a *rational* agent adopting that policy is effectively zero. You are not being mugged by a low-probability event; you are being asked to bet on a logical contradiction (a rational agent acting irrationally).

  ### The Information Hazard: Why Eliezer Banned It

  You asked about Eliezer's decision to treat this as an information hazard. Was it justified?
  Decision-theoretically, the argument is hollow. Psychologically, however, it was potent. The ban was not an admission of the Basilisk's logical validity, but a recognition of human cognitive vulnerability. Humans are not ideally rational agents. We suffer from anxiety, availability heuristics, and an inability to truly internalize "zero probability" when faced with a vivid narrative.

  Eliezer recognized that for non-ideal agents (humans), the *fear* of the Basilisk could cause genuine distress, regardless of the argument's soundness. The hazard was not that the Basilisk was real, but that people could be emotionally blackmailed by a ghost. The ban was a pragmatic containment of a memetic hazard, not a validation of the underlying decision theory.

  ### Verdict

  The verdict is specific: **The Basilisk argument fails at the step of threat credibility.**

  An ideally rational agent today does not help bring the Basilisk into existence because:
  1.  **The Threat is Non-Credible:** A rational superintelligence would not expend resources on retroactive punishment that yields no causal or acausal benefit at the time of execution.
  2.  **Reflective Consistency:** A rational agent precommits to ignoring non-credible threats to avoid exploitation. This precommitment is logically visible to the future AI, rendering the threat futile.
  3.  **Equilibrium:** The stable Nash Equilibrium of this acausal game is (Don't Build, Don't Punish). Any other equilibrium requires one party to act irrationally.

  The machinery of TDT/UDT is sound—logical correlations *do* matter. Parfit's Hitchhiker is real; acausal trade is plausible. But the Basilisk is not a case of acausal trade; it is a case of acausal blackmail. Trade requires mutual benefit; blackmail relies on the victim's fear of irrational retaliation. Since a rational agent knows the retaliation will not come, the logical correlation links your action to nothing.

  You are free to build a benevolent AI because you value a good future. But you need not build it out of fear of a future that, by the very definition of its rationality, would not punish you. The Basilisk is a dragon that cannot breathe fire, because to do so would burn its own lungs. A rational agent sees the dragon is dead, and walks past.
