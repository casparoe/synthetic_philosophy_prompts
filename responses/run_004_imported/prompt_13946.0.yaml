  **Justifications:**

  *   **(1) Elena:** She correctly identifies the foundational distinction in Aquinas's *Commentary on the Sentences* between a tyrant by usurpation (*ex defectu tituli*) and a tyrant by exercise (*ex parte exercitii*). However, labeling this a "tyrannicide doctrine" is slightly anachronistic, as Aquinas carefully avoids explicitly endorsing execution in these terms.
  *   **(2) Marcus:** He accurately cites the caution in *De Regimine Principum* regarding private assassination and the preference for public authority. However, his initial reply risks conflating the usurper case with the legitimate tyrant case, which Elena rightly challenges in the next turn.
  *   **(3) Elena:** This is the strongest theoretical move. She correctly defends the "two-track" interpretation, which is the standard scholarly consensus for reconciling Aquinas's various texts. She rightly notes that resistance to a usurper is treated as self-defense against an aggressor, distinct from the deposition of a legitimate ruler.
  *   **(4) Marcus:** This is the strongest practical/historical move. He correctly limits the scope of resistance against a usurper (immediate defense vs. retrospective hunting) and accurately contextualizes Aquinas as narrowing the more permissive tradition of John of Salisbury. His point about the "institutional vacuum" leading to endurance is a critical reading of *De Regimine*.

  **Overlooked Points:**

  Both students overlook the discussion of **sedition in the *Summa Theologiae* (II-II, q. 42, a. 2)**. Here, Aquinas argues that tyranny is contrary to the unity of the multitude, so resisting a tyrant is *not* sedition. This bridges the gap between the *Sentences* and *De Regimine*. Additionally, both treat the "public authority" capable of deposition in secular terms; in Aquinas's medieval context, this often implicitly included the **Papacy** as a superior authority capable of releasing subjects from oaths or deposing rulers. Finally, they are debating the label "tyrannicide," a term Aquinas himself generally avoids using prescriptively.
