answer: |-
  The isolation booth was silent, except for the tone. It was a pure, clean sine wave, four hundred hertz, humming directly into Elara's headphones. Her task was simple: press the key the moment she ceased to know the tone was there.

  Not the moment it stopped. The moment she *knew* it stopped.

  On the desk, a digital chronometer ticked milliseconds. The generator was programmed to decrease the amplitude by a fraction of a decibel every second. A smooth slide into nothing. Elara rested her finger on the spacebar. She closed her eyes.

  *Now,* she thought. *I hear it.*

  It was bright and solid in her mind. There was no gap between the sound and her awareness of it. The state was transparent. She was in the sound, and she knew she was in it.

  *Tick.*

  The volume dropped imperceptibly. If she had to bet, she would say it was exactly the same as the second before. Her ears couldn't resolve the difference. So, if she knew it was there a second ago, and this second was indistinguishable from the last, she must know it is there now. To claim otherwise would be to claim she could detect a change she couldn't detect.

  *Tick.*

  Still there. Solid.

  *Tick.*

  She focused harder. She wasn't just listening for the tone; she was listening for her certainty. *I know I hear it,* she affirmed. But then, a shadow crossed the affirmation. *Do I know that I know?*

  At the start, the answer was yes. The knowledge was luminous; it lit itself up. But now, in the quieting dark, the light felt diffuse. She grasped for the second order—the knowledge of the knowledge—and found it slippery. She felt the tone, but the confidence that she was feeling it reliably had begun to lag.

  *Tick.*

  The sensation remained. It felt like the previous second. It felt like the one before that. By the logic of the booth, by the logic of her own senses, she should still be safe. If she knows at $t$, and $t+1$ is the same, she knows at $t+1$. It was a chain of safety links, forged from indistinguishable moments.

  But chains pull.

  *Tick.*

  *I hear it,* she thought. But the thought was quieter than the tone.

  *Do I know that I hear it?* The question arose unbidden. If her senses had a margin of error—a fuzzy boundary where 'hear' bleeds into 'imagine'—then claiming knowledge was risky. To know something, you have to be safe from error. You have to be far enough away from the edge that a slight stumble doesn't push you off.

  But she was walking toward the edge blindfolded. Every step was the same as the last.

  *Tick.*

  She tried to anchor herself. *I know that I know I hear it.*

  The structure wobbled. The third layer collapsed first. She couldn't certify her certification. The certainty about her certainty had evaporated, even though the tone still hummed. She was left with a raw sensation and a doubt about whether that sensation counted as evidence.

  *Tick.*

  The tone was a ghost now. It was memory as much as perception. If she claimed knowledge now, she was claiming she could distinguish signal from noise. But the noise was internal. The blood rushing in her ears sounded like the fade-out.

  If she claimed she knew she heard it now, she would have to claim she knows she hears it ten seconds from now, because ten seconds from now will feel like this. And twenty seconds after that. If she didn't stop the chain, she would end up knowing she heard the tone in the absolute silence that was coming.

  That was absurd. She couldn't know she heard silence.

  So the chain had to break. But where?

  *Tick.*

  She looked at her finger. It hovered over the plastic key. There was no flash of revelation. No sharp line where 'knowing' turned to 'guessing.' There was only a gradual erosion of authority. She realized she hadn't lost the tone yet; she had lost the position to know she had it.

  The luminosity was gone. The state of hearing was no longer self-intimating. It was dark, opaque. She was in the state, perhaps, but she wasn't sure she was.

  *Tick.*

  *Do I know?* No.

  *Do I know that I don't know?* Even that was too strong.

  She was adrift in a margin of error. The safety condition had been violated miles back, back when she was sure she was sure. She had been trusting a faculty that required fine-grained resolution to deliver coarse-grained truth.

  *Tick.*

  The sound was gone. Or it had never been there. Or it was still there, and she was deaf to it. The distinctions didn't matter. The epistemic access was severed.

  She pressed the key.

  The chronometer stopped. The booth remained silent. She sat there, waiting for the feeling of relief that comes with completing a task, but it didn't come. She couldn't know she had completed it. Maybe she should have pressed it ten seconds ago. Maybe ten seconds from now she would realize she was wrong.

  There was no sharp moment where the knowledge died. It didn't snap; it dissolved. It leaked out of her between the ticks of the clock, unnoticed until she was already empty. Elara took off the headphones. The silence of the room rushed in, heavy and absolute. She couldn't tell if it was different from the silence inside her head.

  She stood up, but paused. Did she know she was standing? She felt the pressure on her feet. But was that knowledge, or just another sensation indistinguishable from the one before it, back when she was sitting?

  She walked to the door. She didn't know when she started walking. She just found herself outside, the air cool on her skin, wondering if she was cold, or if she just remembered being cold a moment ago, and couldn't tell the difference.
