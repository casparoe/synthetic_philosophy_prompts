answer: |-
  # The Myth of the Universal Mind: A Defense of Uncommon Priors

  The Common Prior Assumption (CPA) is the quiet engine room of modern game theory and the epistemic backbone of the rationalist community. It is the claim that if two agents are truly rational, their probability distributions over the state of the world must be identical, conditional on the same information. Divergence in belief, under this view, is exclusively a function of divergence in data. If we know each other's posteriors and we still disagree, one of us is necessarily irrational.

  This view, championed by Robert Aumann and John Harsanyi, offers a seductive vision of epistemic hygiene. It turns disagreement into a solvable engineering problem: find the missing information, update, and converge. However, this orthodoxy rests on a foundation that is far shakier than its proponents admit. It conflates the *logic of consistency* with the *physics of cognition*.

  While the arguments for a common prior are powerful normative tools for encouraging humility, they fail as a description of ideal rationality. I argue here that the Common Prior Assumption is false as a constitutive rule of rationality. Distinct rational agents can, and often must, possess irreducibly different priors. To demand otherwise is to commit a category error regarding what priors *are*.

  ### The Case for Common Priors: The View from Nowhere

  The strongest argument for the CPA is metaphysical: there is only one world, and therefore only one correct map.

  In the Savage framework, probabilities are subjective degrees of belief constrained only by coherence (avoiding Dutch books). But Aumann and Harsanyi push further. They argue that if probability is to track truth, it cannot be merely a matter of taste. If Agent A assigns probability 0.9 to event $E$ and Agent B assigns 0.1, they cannot both be "correct" in a vacuum. Since the world is singular, the divergence must stem from a difference in causal history—specifically, a difference in information.

  Robin Hanson's "Uncommon Priors Require Origin Disputes" tightens this screw. He argues that your prior is not just a starting point; it is a belief about the process that generated your mind. If you believe your prior is better than mine, you must believe that the causal process that created *you* was more truth-tracking than the process that created *me*. But if we accept that we are both products of similar evolutionary or environmental processes, claiming your prior is superior is an act of arrogance. It requires you to assert that, behind a veil of ignorance, you would have bet on being *you* rather than *me*.

  Hanson's "pre-rationality" condition suggests that a truly rational agent should average their prior with any other agent's prior, weighted by the probability that they would have been that agent. If you cannot justify why your cognitive initialization is privileged over mine, you must assume our priors were drawn from the same distribution. To do otherwise is to claim a special status in the universe without evidence.

  Furthermore, the CPA is pragmatically indispensable for the Agreement Theorem to hold. If we allow uncommon priors, the theorem collapses, and "agreeing to disagree" becomes trivially easy. Rationality loses its bite as a convergent force. If we want the concept of rationality to serve as a method for collective truth-seeking, we must treat the CPA as a regulatory ideal. To reject it is to open the door to solipsism, where every agent lives in a private probabilistic universe, immune to correction by others.

  ### The Case for Uncommon Priors: The Personalist Defense

  The counter-argument, rooted in the work of de Finetti, Savage, and later Faruk Gul, is that the CPA imposes an external constraint on what is supposed to be an internal logic.

  Gul's 1998 critique in *Econometrica* is devastatingly simple: The Savage axioms define rationality as internal coherence. Nothing in the logic of probability dictates where the numbers must come from. To add the CPA is to add an axiom that is not about *reasoning*, but about *uniformity*. It transforms probability from a logic of partial belief into a physics of mental states.

  The core of the subjectivist defense rests on the Problem of Induction. There is no logical justification for any prior. No amount of data compels a specific prior distribution without already assuming a prior to interpret that data (the no-free-lunch theorems of machine learning make this explicit). If no prior is logically compelled, then no two agents are logically compelled to choose the same one.

  Consider the nature of cognitive architecture. A prior is not just a list of probabilities; it is an inductive bias. It is the set of hypotheses an agent is *capable* of conceiving. Two agents with different conceptual frameworks literally inhabit different state spaces. If I conceptualize the world in terms of "spirit" and "matter," and you conceptualize it in terms of "fields" and "particles," we cannot share a prior because we do not share a sample space. To demand a common prior is to demand that all rational agents possess identical conceptual vocabularies.

  Moreover, the "origin dispute" argument assumes a level of interchangeability that does not exist. Hanson asks us to imagine we didn't know who we would be. But I *do* know who I am. I am this specific computational system with this specific history. My prior is adapted to my specific sensory inputs and computational constraints. To ask me to adopt your prior is to ask me to run your software on my hardware. It may be coherent for *you*, but it may be computationally intractable or semantically meaningless for *me*.

  Finally, there is an evolutionary argument for uncommon priors. A population of agents with identical priors will explore the hypothesis space identically. A population with diverse priors covers more ground. If rationality is about maximizing truth-tracking at the *system* level, then enforcing common priors at the *individual* level is counter-productive. Diversity of priors is a feature, not a bug, of a distributed epistemic system.

  ### The Verdict: Rationality is Processing, Not Initialization

  I side with Gul and the Subjectivists. The Common Prior Assumption is not a requirement of ideal rationality.

  The Pro-CPA argument fails because it smuggles in an assumption of **ontological interchangeability**. It treats agents as interchangeable vessels for "Reason" itself. But agents are not vessels for Reason; they are physical systems processing data. Rationality is a property of how an agent *updates* and *acts* given its constraints, not a property of how it is *initialized*.

  When Aumann argues that disagreement implies a failure of rationality, he is implicitly defining rationality as "convergence to the One True Map." But there is no access to the One True Map except through the lens of a prior. If the prior is underdetermined by logic (which it is), then there are multiple "One True Maps" compatible with the same evidence, differentiated only by their inductive biases.

  The fatal flaw in Hanson's "origin dispute" argument is that it assumes the "self" behind the veil of ignorance is a blank slate. It is not. Even behind the veil, you must have a prior to calculate the probability of being Agent A vs. Agent B. You cannot use a prior to justify a prior without circularity. The pre-rationality condition pushes the problem back one step but does not solve it.

  Therefore, I defend the position that **irreducibly different priors are rationally permissible.**

  Two agents can look at the same data, update perfectly via Bayes' rule, maintain full coherence, avoid all Dutch books, and still disagree forever. This is not a failure of rationality; it is a consequence of the underdetermination of theory by data. To call this "irrational" is to redefine rationality as "uniformity."

  ### The Necessary Fiction

  However, rejecting the CPA as an ontological truth does not mean we should discard it as a social technology.

  While distinct agents *can* have different priors, they cannot *collaborate* effectively if they assume they do. If I believe your prior is fundamentally broken, I cannot learn from you; I can only observe you. I must treat your beliefs as data points generated by a faulty machine, rather than arguments to be engaged. This kills discourse.

  Therefore, the CPA should be adopted as a **normative fiction**. We should act *as if* we share a common prior when engaging in argument. We should assume that our disagreement is due to missing information, not fundamental incompatibility. This is not because it is metaphysically true, but because it is the only stance that allows for the possibility of persuasion.

  But we must not confuse the norm for the reality. The rationalist community often treats the CPA as a weapon: "You disagree with me, therefore you are irrational." This is epistemic violence disguised as math. It ignores the reality that your opponent may have a different inductive bias that is equally coherent but structurally distinct from yours.

  ### Conclusion

  The Common Prior Assumption is a beautiful piece of mathematics that makes the world tidy. It allows us to prove theorems about agreement and model games with incomplete information. But it is a map that does not fit the territory of distinct minds.

  Ideal rationality requires coherence, calibration, and proper updating. It does not require uniformity. We are not instances of a universal reasoner; we are distinct learners with distinct starting points. Acknowledging this does not lead to solipsism. It leads to a more mature epistemology, one where disagreement is not always a sign of error, but sometimes a sign of diversity. We should strive to share information as if we shared priors, but we must recognize that when the data runs out, the priors remain, and they are ours alone.
