answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of knowing Mara and Theo since our grad school days.

  When Mara asked me to give this toast, I was honored. And then, about thirty seconds later, I was terrified. Because giving a toast for Mara and Theo isn't like giving a toast for normal people. You can't just talk about how they met or how cute they are. You have to account for the intellectual architecture of the relationship.

  Specifically, you have to account for Theo's relationship with Bertrand Russell.

  Now, for the two-thirds of the room who haven't had the pleasure of hearing Theo hold court at a party: Theo loves Russell. Specifically, he loves Russell's book *Marriage and Morals*. For years, Theo has argued passionately that jealousy isn't a hardwired instinct, but a learned anxiety, and that the true center of gravity in a marriage isn't possessiveness, but the household you build and the honesty you keep.

  And for the one-third of the room currently nodding along: Yes, I know the history. I know that Russell and his second wife, Dora, tried to live out this exact philosophy. And I know that when Dora had children with another man, Russell didn't handle it with the cool rationality of his essays. He was wrecked. He was jealous. The marriage ended bitterly.

  I mention this not to cast a shadow, but because ignoring it would be dishonest. And if there is one thing Mara and Theo value, it is honesty.

  The thing is, Russell was a philosopher. He dealt in universals. But Mara and Theo are not living a universal; they are living a particular. They know that the map is not the territory. They know that a theory about jealousy is not the same thing as the feeling of it in your chest at 2:00 AM.

  Russell's experiment failed, in part, because he thought the theory could override the human emotion. Mara and Theo have succeeded, for over a decade now, because they do the opposite. They let the human emotion drive, and they use the theory only as a navigation tool. They don't use their agreements to avoid difficult feelings; they use their agreements to make sure they can tell each other the truth about those feelings when they arise.

  To Theo's family, who might be hearing some of this context for the first time: I want you to know that while Mara and Theo's approach might be unconventional, the foundation is something you all recognize. It is built on radical honesty. It is built on a fierce commitment to the family unit they are creating. It is built on the idea that you do not hide things from the person you love.

  They aren't following a script written by a British philosopher in the 1930s. They are writing their own script, page by page, with more care and communication than most couples I know who are following the standard template.

  Russell wrote that the best marriages are those where two people respect each other's liberty while remaining devoted to a common life. On paper, that failed for him. But watching Mara and Theo, you see it working. You see it in the way they look at each other when the other enters the room. You see it in the way they speak for each other when one of them is tired.

  They have taken the best part of Russell's argument—that love should be a source of freedom, not fear—and they have left behind the part where you pretend you aren't human.

  So, I'd like to propose a toast.

  To Mara and Theo. May your household be strong. May your honesty be kind. And may you always remember that while books can offer us ideas, only each other can offer us a home.

  To Mara and Theo.
