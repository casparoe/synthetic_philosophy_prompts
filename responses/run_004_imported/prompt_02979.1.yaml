  8.  **Final Polish:** Check the pacing. Ensure the transition from "thinking" to "acting" is clear for Marcus. Make the ending punchy. (Self-Correction: Make sure the signal accuracy is stated so the math holds up in the reader's mind. Let's say signals are 55-60% accurate).

      *(Self-Correction during drafting)*: I need to make sure the reader understands that Marcus's vote *doesn't add information* to the pool. That's the key to the fragility. If he votes Real because he *thinks* Real, but his signal was Fake, the public record lies.

      *Let's write it.*
answer: |-
  The room smelled of turpentine and old money. In the center, under a halogen lamp, sat *The Azure Lady*. Either it was a lost 19th-century masterpiece worth $20 million, or it was a forgery worth the canvas it was painted on.

  Ten of the world's leading authenticators sat in a row. The rules were strict, designed to prevent groupthink, or so the auction house claimed. You examine the painting for ten minutes. You receive a private forensic report (your "signal"). Then, you walk to the front and drop a token into a glass bowl. Green for Authentic. Red for Fake.

  Everyone sees the tokens accumulate. No talking.

  **Elias** went first. He scrubbed his glasses, looked at the brushwork, and read his report: *Pigment composition consistent with 1890s.* His private signal said **Green**. He dropped a Green token in.

  **Sarah** went second. She checked the craquelure. Her report said: *Canvas weave matches period.* Signal: **Green**. She dropped a Green token.

  The bowl now held two Green tokens.

  **Marcus** stood up. He was the third. He was nervous. He had spent twenty minutes with the magnifying glass. He had found something the others missed—a microscopic synthetic fiber in the underpainting. His private forensic report came back: *Anachronistic material detected.*

  His signal screamed **Red**.

  But Marcus looked at the bowl. Two Greens.

  He sat back down in his mind for a second, running the Bayesian update. *Assume the world is 50/50 Real or Fake to start.*
  *   If the painting is **Fake**, the odds of Elias getting a 'Green' signal are only 60% (signals are noisy, not perfect). The odds of *both* Elias and Sarah getting 'Green' signals by mistake is $0.6 \times 0.6 = 0.36$.
  *   If the painting is **Real**, the odds of them both getting 'Green' signals is $0.6 \times 0.6 = 0.36$... wait, no. If it's Real, their signals are *correct*. So the likelihood is higher.

  Marcus simplified it. He knew the math of the BHW model better than anyone.
  *   Elias voted Green. That means his signal was likely Green. (1 bit of info).
  *   Sarah voted Green. Since she saw Elias's vote, if her signal had been Red, she would have been indifferent. But she voted Green. It is overwhelmingly likely her signal was Green too. (2 bits of info).
  *   Marcus's signal is Red. (1 bit of info).

  The public pool (2 Greens) outweighed his private pool (1 Red).

  It wasn't peer pressure. Marcus didn't care what Elias thought of him. It was pure probability. To vote Red would be to bet that *he* was right and *two other experts* were wrong. Even though his own eyes told him "Fake," the rational move was to assume his eyes were the outlier.

  If he voted Red, he would be revealing his private information, which is socially useful. But he wasn't paid to be socially useful. He was paid to be *right*. And the math said the painting was Real.

  Marcus stood up. He ignored the synthetic fiber in his mind. He ignored his own report. He reached into his pocket, pulled out a **Green** token, and dropped it in the bowl.

  *Click.*

  **The Cascade Begins.**

  **Julia** was fourth. She found the brushwork suspicious. Her signal was **Red**. But she looked at the bowl: Three Greens.
  *Three public signals vs. one private signal.* She didn't even bother weighing it. She dropped a Green token. Her private information (Red) was now lost forever. The bowl didn't reflect what she knew; it only reflected what she *did*.

  **David** (5th), **Priya** (6th), **Kenji** (7th). All of them had doubts. Priya's chemical swab came back slightly off. Kenji hated the composition. But the bowl was filling with Green. To vote Red now would be to claim you know better than seven previous experts.

  By the time the 10th voter dropped their token, the bowl held 10 Green tokens. Unanimous.

  The auction house announced the valuation: $20 Million. Investors began wiring deposits. The consensus was solid. It felt like truth.

  **The Collapse.**

  Three hours later, a junior intern at the auction house was filing the digital paperwork. She noticed a flag on the shipping manifest. The crate carrying *The Azure Lady* had originated from a warehouse in Jersey City, not a vault in Geneva.

  She sent a quick email to the head authenticator: *"Hey, just FYI, the provenance doc lists a 1995 storage facility in New Jersey. Probably a typo, but thought you should know."*

  That was it. One sentence. Public information.

  The head authenticator read it. The Geneva vault story was the foundational narrative for why the painting was "lost" and then "found." If it was in Jersey in 1995, it couldn't be the lost masterpiece.

  He called the investors. "Stop the wires."

  "Why?" an investor asked. "Ten experts voted. Unanimous."

  The authenticator stared at the glass bowl, still sitting on the table, full of Green tokens.

  "Ten people voted," he said, his voice hollow. "But only two of them actually looked at the painting."

  "What do you mean?"

  "Elias and Sarah voted based on their signals. Marcus... Marcus saw their votes and ignored his own eyes. And everyone after Marcus? They didn't vote on the painting. They voted on Marcus."

  The investor was silent. "So... how much information do we actually have?"

  "Two signals," the authenticator said. "Just two. The other eight tokens are empty. They're just echoes."

  The $20 million valuation evaporated in an instant. Not because the painting changed, but because the market realized the "consensus" was a house of cards built on two shaky opinions and eight rational decisions to ignore the truth.

  Marcus watched the chaos from the corner of the room. He knew he hadn't made a mistake. Given what he knew *at the time*, voting Green was the only rational choice. That was the terrifying part. He had acted perfectly rationally, and together, they had acted perfectly stupidly.

  He looked at the bowl. It looked less like a collection of expert opinions and more like a tomb for eight private truths that never got spoken.
