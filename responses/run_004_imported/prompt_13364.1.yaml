answer: |-
  As a fellow traveler from statistical mechanics, you are uniquely positioned to see the fault line in this debate. The dispute between Samuelson and Peters is not fundamentally about economics or psychology; it is about the **ergodic hypothesis**.

  Samuelson's 1971 dismissal rests on the implicit assumption that the expectation value $\mathbb{E}[W]$ (an ensemble average) is the physically relevant observable for a decision-maker. Peters' counter-argument is that for multiplicative wealth dynamics, the system is non-ergodic: the ensemble average diverges from the time average.

  Here is the strongest case that Peters is right and Samuelson's dismissal fails, framed in the language of dynamical systems and statistical physics.

  ### 1. The Category Error: Preferences vs. Dynamics
  Samuelson's fundamental error is a category mistake. He treats the logarithm in the Kelly criterion as a **utility function** $U(W) = \ln(W)$, implying it represents a subjective psychological preference for risk aversion. In Expected Utility Theory (EUT), rationality is defined as maximizing $\mathbb{E}[U(W)]$. Since $U$ is arbitrary (any monotonic transformation is admissible), Samuelson argues that maximizing geometric growth is merely one "taste" among many.

  Peters shows that the logarithm is not a preference; it is a **coordinate transformation required to make the observable ergodic**.

  In stat mech, if you have a non-ergodic system, you cannot compute time averages by integrating over the phase space (ensemble). You must follow the trajectory. Wealth evolution is multiplicative:
  $$ W_{t+1} = W_t \cdot (1 + r_t) $$
  This is a geometric Brownian motion (in the continuous limit). The process is non-ergodic because the phase space is not explored uniformly; the system gets stuck in specific trajectories determined by the sequence of returns.

  If you ask, "What is the growth rate experienced by a single agent over time?" you are asking for the time average:
  $$ \bar{g}_{time} = \lim_{T \to \infty} \frac{1}{T} \sum_{t=1}^T \ln\left(\frac{W_t}{W_{t-1}}\right) $$
  Note that the logarithm appears *before* we introduce any utility. It appears because we are converting the multiplicative process into an additive one to compute the mean drift. Maximizing this time-average growth rate *derives* the logarithm. It is not an assumption of risk aversion; it is the mathematical consequence of optimizing the time-average performance of a multiplicative variable. Samuelson mistakes a dynamical necessity for a psychological parameter.

  ### 2. The Ensemble Average is Physically Unobservable
  Samuelson defends the ensemble average $\mathbb{E}[W]$. In a non-ergodic system, the ensemble average is dominated by rare trajectories that no single agent will ever experience.

  Consider a simple coin toss where you gain 50% on heads and lose 40% on tails.
  *   **Ensemble Average:** $\mathbb{E}[\text{return}] = 0.5(1.5) + 0.5(0.6) = 1.05$. The ensemble wealth grows by 5% per round.
  *   **Time Average:** A single agent experiences a sequence of heads and tails. Over $N$ rounds, wealth is $W_N = W_0 (1.5)^{N_H} (0.6)^{N_T}$. The geometric mean return is $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.948$. The typical trajectory loses 5.2% per round.

  As $N \to \infty$, the ensemble average goes to infinity, while the time average for almost all individual trajectories goes to zero.

  Samuelson argues that an agent might rationally maximize the ensemble expectation. But for a single agent living through time, the ensemble expectation is a **phantom observable**. It represents the average wealth of $10^{23}$ parallel universes, not the wealth of the agent in *this* universe. To advise an agent to maximize $\mathbb{E}[W]$ is akin to advising a particle to maximize the canonical ensemble energy rather than follow its Hamiltonian trajectory. It is physically meaningless for the individual.

  ### 3. Absorbing States and the "Ruin" Boundary
  In statistical physics, boundaries matter. In multiplicative wealth dynamics, $W=0$ is an **absorbing state**. Once wealth hits zero, the process stops; you cannot gamble further.

  The ensemble average $\mathbb{E}[W]$ can remain positive even if the probability of hitting the absorbing state ($W=0$) approaches 1 for a specific strategy. Samuelson's framework allows for strategies that lead to certain ruin in the time average, provided the "average" across the ensemble remains high (driven by the infinitesimally unlikely trajectories that get astronomically lucky).

  Peters' ergodicity economics treats the absorbing boundary as a hard physical constraint. If a strategy leads to $\bar{g}_{time} < 0$, the agent will almost surely face ruin. No amount of "utility function" tuning can resurrect a bankrupt agent. Therefore, maximizing the time-average growth rate is not a matter of "risk preference"; it is a condition for **survival**. Samuelson's dismissal fails because it ignores the topological constraint of the state space (the absorbing barrier at zero) which renders the ensemble expectation irrelevant for the surviving trajectory.

  ### 4. Rebutting the "Finite Horizon" Objection
  Samuelson's sharpest critique was: *"The long run is a misleading guide to current affairs. In the long run we are all dead."* He argued that for finite $T$, the divergence between time and ensemble averages might be small, so why impose the log criterion?

  From a physics perspective, this misses the nature of the divergence. In non-ergodic multiplicative processes, the discrepancy between the ensemble mean and the typical trajectory (the median) exists **at every time step**, not just in the limit.

  The ensemble mean is $\mathbb{E}[W_t] = W_0 e^{\mu t}$.
  The typical trajectory (median) is $W_{typical} = W_0 e^{(\mu - \sigma^2/2) t}$.

  The gap is driven by the variance $\sigma^2$. It is present at $t=1$. By maximizing the ensemble average, you are systematically overestimating the outcome you will actually realize. A rational agent should maximize the observable they will actually measure. Since the agent measures their own wealth over time, the time average is the only valid objective function, regardless of the horizon. The "limit" argument is just a way to make the divergence mathematically stark; the physical distinction holds for any $t > 0$.

  ### 5. Resolution of the "Paradox"
  The St. Petersburg Paradox and similar puzzles plague EUT because EUT requires inventing ad-hoc utility functions (like $\ln W$) to make the expectation converge. Peters resolves this without invoking psychology.

  If the payoff is additive, the process is ergodic; maximize $\mathbb{E}[\Delta W]$.
  If the payoff is multiplicative, the process is non-ergodic; maximize $\mathbb{E}[\Delta \ln W]$.

  The utility function is not a property of the agent; it is a property of the **dynamics of the wealth**.
  *   Samuelson says: "You choose $\ln W$ because you are risk-averse."
  *   Peters says: "You choose $\ln W$ because wealth multiplies, and that is the only way to calculate the time-average growth rate."

  ### Conclusion
  Samuelson's 1971 paper assumes the ergodic hypothesis holds for economic variables. It does not. By treating wealth as a static random variable rather than a stochastic process with path dependence, EUT conflates the ensemble average with the time average.

  For a physicist, the verdict is clear: **You cannot optimize a trajectory by averaging over an ensemble if the system is non-ergodic.** Since wealth dynamics are multiplicatively non-ergodic, the time-average growth rate is the only objective function that corresponds to physical reality for a single agent. The logarithm arises not from human psychology, but from the mathematics of compounding. Samuelson dismissed the geometric mean as a "fallacy" because he was looking at the problem through the lens of equilibrium statistics; Peters corrected him by applying the lens of non-equilibrium dynamics.

  Peters is right because he respects the difference between the map (the ensemble) and the territory (the trajectory). Samuelson failed because he assumed the map was the territory.
