answer: |-
  **Setting:** *A graduate seminar room, late afternoon. The whiteboard is still covered in diagrams of space-time worms and world-lines. Most students have filtered out, but two remain packing their bags. ELENA (Endurantist) is sitting in a chair. PAUL (Perdurantist) is leaning against a desk.*

  **Elena:** (Shifting in her seat) You know, Paul, listening to the lecture, I keep thinking Lewis sets up the Problem of Temporary Intrinsics like it's a gotcha moment. But the solution feels like it's right there in the premise.

  **Paul:** The relational move? That shapes are really relations to times?

  **Elena:** Exactly. It's not that I am bent *simpliciter* and straight *simpliciter*. I am bent-at-$t_1$ and straight-at-$t_2$. The properties aren't incompatible because they aren't monadic. They're dyadic.

  **Paul:** (Pushes off the desk) But that's the thing, Elena. Lewis's whole point is that shape is the paradigm of an *intrinsic* property. If you have to analyze "being bent" as "bearing a relation to a time," you've admitted it isn't intrinsic anymore. You've changed the subject. You're saying nothing ever really changes shape; you're just saying the object has different relations to different coordinates in the time dimension.

  **Elena:** (Stands up abruptly) Watch. Right now, I am standing. Five minutes ago, I was sitting. I am the same person. The same substance. If I accept your view, what happens to *me*?

  **Paul:** You're a space-time worm. The sitting-stage is a temporal part of you. The standing-stage is a later temporal part of you. Both exist eternally in the block universe.

  **Elena:** But *I'm* not a stage. I'm the thing that *has* the stages. If perdurantism is true, then strictly speaking, *I*—the whole four-dimensional object—am never bent. And *I* am never straight. Only a slice of me is bent. Only a slice of me is straight.

  **Paul:** That's a category mistake. The worm *is* bent, in the derivative sense that it has a bent part. Just like a road is winding, not because the whole road curves in a single direction, but because it has winding sections.

  **Elena:** A road doesn't feel the wind. I feel the bend. When I was sitting, *I* was bent. Not a part of me. If you say only my temporal part was bent, you're saying the subject of experience isn't the persisting person. It's the momentary stage. But when I remember sitting, *I* remember it. Not a current stage remembering a past stage.

  **Paul:** You're conflating semantics with metaphysics. The word "I" is ambiguous. Sometimes it refers to the person-stage, sometimes to the whole worm. But look at the cost of your view. You want to say properties are relations to times. Fine. But what is the time? Is it a container? If time is just another dimension, like space, then saying "bent-at-$t_1$" is exactly like saying "bent-here" versus "bent-there."

  **Elena:** And that's why it works. Just as I can be straight here (my back) and bent there (my knee) without contradiction, I can be straight then and bent now.

  **Paul:** No, that's the analogy that breaks. Spatial parts are distinct entities. My knee is not my back. But on your view, the *whole* me is at $t_1$ and the *whole* me is at $t_2$. If I am wholly present at both times, and I have incompatible properties, you need a modifier to stop the contradiction. Making the property relational does that, but it kills change. Real change requires that one and the same thing has property $P$ and then lacks it. If you say it has $P$-at-$t_1$ and lacks-$P$-at-$t_2$, it possesses both of those relational properties eternally. You've frozen the change.

  **Elena:** I haven't frozen it. I've located it. Change is the instantiation of different time-indexed properties by the same substance. But let's turn your "winding road" analogy back on you. If the road is the whole worm, and only a part is winding, then the road *itself* doesn't wind. It just contains winding. If persistence is just having different parts at different times, then nothing persists. There's just a succession of different things. You've saved the properties by sacrificing the subject.

  **Paul:** I haven't sacrificed the subject. I've analyzed it. The subject is the aggregate. But look, Elena, even if we stalemate on the intrinsics, there's a deeper structural reason to accept temporal parts. It's the argument from vagueness.

  **Elena:** Sider's argument?

  **Paul:** Yes. Think about this chair. (He taps the back of Elena's empty chair). When did it come into existence? Was it the moment the wood was cut? The moment it was assembled? The moment the glue dried?

  **Elena:** Probably when it was assembled.

  **Paul:** But assembly is a process. At 2:00 PM, the back was attached. At 2:01, the leg was screwed in. Is there a precise nanosecond where the chair *popped* into existence? If endurance is true, the chair is wholly present. So either it exists at that nanosecond or it doesn't. If you say there's no sharp cutoff, you're saying existence itself is vague. You're saying it's an indeterminate fact of reality whether the chair exists.

  **Elena:** And that's unacceptable why?

  **Paul:** Because existence isn't the kind of thing that admits of degrees. It's ontic vagueness. It suggests the world itself is fuzzy. But if perdurantism is true, there's no vagueness about existence. There are just temporal parts. Some parts exist, some don't. The "chair" is just a concept we apply to a specific collection of those parts. The vagueness is semantic, about how we use the word "chair," not ontological about whether an object exists.

  **Elena:** So you'd rather multiply entities infinitely—postulating a distinct object for every nanosecond of the chair's life—than admit that our concepts of objects might not map perfectly onto sharp boundaries in reality?

  **Paul:** I'd rather not admit that reality can be indeterminate. That's the price. If you're an endurantist, you have to say that for some candidate moment $t$, it is neither true nor false that the chair exists at $t$. That violates bivalence for existence claims.

  **Elena:** Or, it violates your assumption that existence must be sharp. Why should I accept that? We accept vague predicates all the time. "Bald," "tall," "heap." Why is "exists" special?

  **Paul:** Because "bald" describes a property. "Exists" quantifies over the domain. If it's vague whether $x$ is in the domain, logic breaks down.

  **Elena:** Logic doesn't break down if we recognize that persistence conditions are sortal-relative. The chair exists when it functions as a chair. That's not vagueness in the world; it's precision in our criteria that happens to be interest-relative. But let's go back to the intrinsics, because I think you're dodging the phenomenological bullet. If I cut my finger, *I* feel pain. Not a temporal part of me. If perdurantism is true, the pain is located in a time-slice. But the suffering persists. I suffer *through* the time.

  **Paul:** The worm suffers. The suffering is an extended property of the worm, just like the shape is.

  **Elena:** But the worm isn't present to the suffering. Only the part is. You've made persistence into a movie reel. A series of static frames. But experience isn't a series of frames. It's a flow. And the thing that flows is me, wholly.

  **Paul:** And I've made persistence compatible with relativity physics and logical consistency regarding intrinsics. You're clinging to a pre-theoretic intuition that can't survive contact with the Problem of Temporary Intrinsics without turning properties into relations. You admitted it yourself: "bent" is really "bent-at."

  **Elena:** I admitted that to save the identity of the subject. You saved the property by losing the subject. We're just trading what we find more precious. I find the unity of the self more precious than the strict monadic nature of shape. You find the logical purity of properties more precious than the unity of the self.

  **Paul:** It's not just purity. It's explanatory power. Temporal parts explain time travel, fission, fusion, and vagueness uniformly. Endurantism needs a new ad-hoc fix for every new puzzle.

  **Elena:** And Perdurantism needs a new error theory for every ordinary claim we make. "I sat down." False. "I changed." False. "I exist." Only relative to a time. You win the logic game, Paul, but you lose the world.

  **Paul:** (Smiles slightly) Maybe the world was never the way ordinary language says it is.

  **Elena:** (Sits back down) Then I guess we're both stuck. I'm bent-at-this-moment, and you're wrong-at-all-moments.

  **Paul:** And I'm a worm-at-all-moments. See you next week.

  ***

  ### Analysis: Is There a Winner?

  The dialogue above illustrates why the Endurantism/Perdurantism debate remains one of the most resilient stalemates in contemporary metaphysics. Neither side delivers a knockout blow because each side's strength is precisely the other side's weakness.

  **The Case for Perdurantism (Paul):**
  Paul's strongest move is the **Argument from Vagueness** (championed by Theodore Sider). If objects endure, the boundaries of their existence in time must be either sharp (which seems arbitrary and magical) or vague (which implies ontic vagueness, a notion many find incoherent). Perdurantism dissolves this by treating temporal existence analogously to spatial extension: just as there is no sharp spatial boundary where a cloud "stops" existing (there are just water molecules), there is no sharp temporal boundary where a person "stops" existing (there are just person-stages). Furthermore, regarding **Temporary Intrinsics**, Perdurantism offers a logically cleaner solution. It preserves the intuition that shape is intrinsic by assigning different shapes to different entities (the parts), avoiding the need to analyze "bent" as a relation.

  **The Case for Endurantism (Elena):**
  Elena's strongest move is the **Phenomenological/Subject Objection**. Perdurantism requires us to accept that ordinary statements like "I am bent" or "I changed" are strictly false or require heavy paraphrase. As Elena notes, if I am a four-dimensional worm, the *whole* worm is not bent; only a slice is. But when I feel pain or change position, it feels like *I* do so, not a part of me. Endurantism preserves the intuition that the subject of experience is identical over time. Regarding the **Relational Move**, while Lewis critiques it as denying genuine change, Endurantists (like Haslanger or Lowe) argue that time-indexing properties is a necessary feature of temporality, not a concession. It preserves the "wholeness" of the object at any given moment.

  **The Verdict:**
  This is a **theoretical stalemate** driven by conflicting theoretical virtues.
  *   **Perdurantism** wins on **systematic unity and logical precision**. It treats time like space, solves vagueness, and avoids contradictions in temporary intrinsics without modifying the nature of properties.
  *   **Endurantism** wins on **common sense and phenomenological fidelity**. It aligns with how we experience ourselves and the world, preserving the reality of change and the unity of the subject.

  Lewis famously argued that theoretical utility should trump common sense, suggesting Perdurantism wins. However, many contemporary metaphysicians argue that a theory that denies the basic data of experience (that *we* persist and change) has failed its primary descriptive task. Until there is a breakthrough in how we understand the nature of time itself (e.g., A-theory vs. B-theory resolution), the debate is likely to remain a standoff where the "winner" is determined by which intuitions a philosopher is willing to sacrifice.
