answer: |-
  **Setting:** *A noisy coffee break at a foundations of physics workshop. Eve (Everettian) and Bo (Bohmian) are leaning against a high table, nursing stale espresso.*

  **Bo:** So, I sat through Wallace's talk again. I still don't buy it. You're trying to get blood from a stone.

  **Eve:** And I still don't buy your "quantum equilibrium." You're trying to get probability from certainty. We're both sinners, Bo.

  **Bo:** *[Laughs]* Fair. But my sin is venial; yours is mortal. In my theory, there is genuine ignorance. I don't know the exact initial position of the particle. That's a classical probability distribution. It's honest. In your theory, everything happens. If the spin goes up *and* down, what is there to be uncertain about?

  **Eve:** Self-locating uncertainty. Before the measurement, I don't know which branch *I* will end up on. Even if both copies exist.

  **Bo:** But that's the rub. "Which branch will I end up on?" implies only one is the real destination. But you say both are real. If I copy you perfectly, and one copy sees red and the other sees blue, did "you" have a probability of seeing red? Or did "you" just become two people? If it's the latter, probability evaporates. It's just identity multiplication.

  **Eve:** That's the old incoherence objection. But look, even if I accept both branches are real, I still have to act *now*. I have to place a bet before the branching. Wallace shows that if I care about my future successors, and I accept the branching structure of the wavefunction, rationality *forces* me to bet according to the Born weights. It's not about frequency; it's about decision theory.

  **Bo:** "Forces" is doing a lot of heavy lifting there. To get the Born rule, you have to assume the agent cares about branches in proportion to their amplitude squared. Why? Why shouldn't I care about each branch equally? If there's a branch with amplitude 0.99 and one with 0.01, why shouldn't I treat them as two equally valid futures of mine?

  **Eve:** Because the branching structure isn't discrete counting. It's not "two branches." The Hilbert space structure defines a measure. If you rotate the basis, the "number" of branches changes, but the squared amplitude stays invariant. If you bet on branch counting, your decisions depend on arbitrary basis choices. That's irrational. The only invariant measure is the norm.

  **Bo:** That's a structural argument, I'll give you that. But it feels like you're defining probability into existence. You're saying, "If you define rationality this way, you get Born." But I can define rationality as "maximize the number of happy successors," and I get a different rule. You haven't derived the Born rule from the physics alone; you've derived it from physics plus a specific normative constraint on agents.

  **Eve:** And you haven't derived it from physics alone either! You've got your pilot wave guiding the particle. The dynamics are deterministic. To get the Born rule, you need the *Quantum Equilibrium Hypothesis*: $\rho = |\psi|^2$. Where does that come from?

  **Bo:** It comes from typicality. It's exactly like Boltzmann. Most microstates compatible with the macrostate evolve toward equilibrium. We show that for Bohmian trajectories, if the distribution is $|\psi|^2$ at one time, equivariance keeps it $|\psi|^2$ forever. And even if it starts off, dynamical relaxation tends to wash out the differences.

  **Eve:** "Tends to." That's the weak spot. In statistical mechanics, you have ergodicity or mixing. In Bohmian mechanics, you have specific trajectories. If the universe started in a non-equilibrium distribution, $\rho \neq |\psi|^2$, you'd see violations of the Born rule. Valentini's work shows this. So, ultimately, you have to *postulate* that the initial condition of the universe was typical.

  **Bo:** It's not a postulate; it's a boundary condition. Just like the Past Hypothesis in thermodynamics. You need low entropy at the Big Bang to get the Second Law. I need quantum equilibrium at the Big Bang to get the Born Rule. Are you going to tell Boltzmann he didn't derive probabilities either?

  **Eve:** Boltzmann deals with ensembles where we lack knowledge. But in your theory, the particle *has* a definite position. If I knew the position, I could predict the outcome with certainty. The probability is purely epistemic. But why should my ignorance map exactly to the wavefunction's amplitude? In Everett, the probability is ontological in the sense that the measure is part of the reality of the branching. In Bohm, it's just "we don't know where the dot is." It feels like you're hiding the mystery in the initial conditions.

  **Bo:** And you're hiding it in the definition of "caring." Look, let's talk about empirical coherence. If I find a system in quantum non-equilibrium, my theory survives—I just say, "Ah, rare configuration." Your theory is in trouble if the Born rule fails, because your decision-theoretic link *is* the theory. If agents stop betting on the norm, Everett is falsified.

  **Eve:** That's a strength, not a weakness! My theory demands the Born rule. Yours tolerates deviations as "atypical." But here's my real issue with your typicality argument. Typicality relies on a measure to define what is "typical." You use the $|\psi|^2$ measure to prove that $|\psi|^2$ is typical. That looks suspiciously circular.

  **Bo:** It's not circular because the measure comes from the dynamics—equivariance. The flow of the trajectories preserves the $|\psi|^2$ volume. It's the natural measure of the phase space, just like Liouville measure in classical mechanics. You don't accuse classical stat-mech of circularity for using Liouville measure.

  **Eve:** In classical mechanics, the measure is justified by observation of frequencies. But you're trying to *explain* the frequencies. If I'm a skeptic, I ask: "Why should I use the Liouville measure?" You say, "Because it's invariant." I say, "Why care about invariance?" You say, "Because otherwise physics is frame-dependent." Okay, I buy that. But in Everett, I have the same move. The Hilbert norm is the only unitary-invariant measure.

  **Bo:** But again, in Everett, the measure doesn't track *existence*. All branches exist. In Bohm, the measure tracks the *density of possible worlds* in the ensemble sense. Wait, no—density of particles in the single world. Look, the difference is: I have one outcome per experiment. You have all of them. When I say "probability 0.01," I mean it's unlikely to happen. When you say it, you mean... it will happen, but in a "thin" branch? What does "thin" mean if the observers in that branch feel just as real?

  **Eve:** It means there are fewer of them? No, that's the counting fallacy. It means... look, think of it as intensity. If I have a light beam splitting 99/1, the 1% beam isn't "less real," but it carries less energy. If I'm a photon, my "likelihood" of being detected is tied to that intensity.

  **Bo:** But you're not a photon. You're an observer. And in your view, there is a copy of you in the 1% beam. That copy is shouting, "I'm here!" just as loud as the 99% copy. So why should the pre-measurement you care less about that future copy? If you're going to exist in both, why not maximize the sum of utility across both?

  **Eve:** Because the "sum" isn't well-defined across branches. The branches don't add up like bank accounts. They add up like vectors. The interference terms matter before decoherence. The decision-theoretic proof shows that ignoring the weights leads to diachronic inconsistency. You'd be vulnerable to Dutch books. You'd make bets before branching that your future selves would collectively regret.

  **Bo:** Dutch books assume you can cash out the bet. But in Everett, all your successors cash out. One wins, one loses. If you bet on the 1% branch, the 1% successor is rich and happy. The 99% successor is poor. But both exist. Why is that inconsistent?

  **Eve:** Because the pre-measurement agent knows the structure of the split. If they treat the split as 50/50 when the physics says 99/1, they are misrepresenting the physical reality available to them. Rationality requires aligning credence with physical structure.

  **Bo:** And I say physical structure in my theory includes the actual configuration. The probability is about where the configuration *is*, not where it *could be*. My derivation is simpler: Assume the universe started in typicality. Done. Your derivation is: Assume agents care about Hilbert norm, assume branching is well-defined, assume decoherence solves the preferred basis problem, assume...

  **Eve:** Assume the universe didn't start in a special non-equilibrium state. That's your big "Assume." If Valentini is right and there's relic non-equilibrium from the early universe, your Born rule derivation breaks down completely. It's contingent. Mine is necessary. Given the unitary dynamics, rational agents *must* see Born statistics.

  **Bo:** Contingency isn't a bug; it's a feature. It makes the theory testable. If we find Born rule violations, I say, "Cool, non-equilibrium." You say, "Cool, irrational agents." Which is more scientific?

  **Eve:** *[Sips cold coffee]* Touché. But admit this: Your "typicality" is just a fancy word for "we assume the thing we want to prove holds for the majority of cases."

  **Bo:** And admit this: Your "decision theory" is just a fancy word for "we assume agents value amplitude squared."

  **Eve:** *[Smiles]* So we're back to sinners.

  **Bo:** Looks like it. I guess the difference is, I sleep at night knowing there's only one of me typing this.

  **Eve:** And I sleep knowing there are a million of me who understand this conversation better than you do.

  **Bo:** *[Grins]* See you in the plenary.

  **Eve:** Count on it. In all worlds.
