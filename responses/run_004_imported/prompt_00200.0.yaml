      *   *Check:* Is Bo too dismissive? Make sure he acknowledges the hard work in typicality arguments.
      *   *Vocabulary:* Ensure terms like "equivariance," "decision-theoretic links," "self-locating uncertainty," and "relaxation" are used correctly but conversationally.
