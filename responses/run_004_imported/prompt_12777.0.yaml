answer: |-
  Here are two tight paragraphs you can adapt for your newsletter:

  Losing the "standing to blame" doesn't let the accused off the hook; it just disqualifies the accuser. Think of it like a judge recusing themselves from a trial because of a conflict of interest: the defendant doesn't suddenly become innocent, and the crime doesn't vanish. Rather, the specific person delivering the verdict has forfeited the moral authority to do so. When a politician loses standing through hypocrisy, the wrongness of their action remains intact, and the community is still entitled to condemn it. The hypocrite's silence (or dismissal) isn't a pardon for the accused; it's a sanction against the blamer for violating the norms of the moral community they are trying to police.

  This distinction is why "standing" isn't just a fancy repackaging of the *tu quoque* fallacy. In a logical fallacy, you dismiss the *truth* of a claim because the speaker is inconsistent (e.g., "Smoking is bad" is false because you smoke). In the philosophy of standing, you accept the claim is true but reject the *performance* of blame as unfitting. The common trip-up here is assuming that if the hypocrite can't speak, the issue is moot. In reality, hypocrisy only strips the specific offender of the right to judge; it doesn't strip the act of its badness, nor does it silence everyone else. The charge doesn't evaporate; it just bounces off the hypocrite and lands back in the public square where it belongs.
