      *   Outcome Independence (The "Pure Correlation" Condition).
      *   The Quantum Verdict: PI holds, OI fails.
      *   Why PI Violation is the "Red Line" for Relativity.
      *   Dissertation Note: "Peaceful Coexistence" and Ontological implications.

  8.  *(Self-Correction during final output generation)*: Make sure to explicitly state that Factorizability = PI + OI. This makes the logical structure clear. Ensure the distinction between *epistemic* updating (OI violation) and *causal* influence (PI violation) is sharp.

  9.  **Final Review against constraints:** Intuitive level? Yes. Which one violated? Yes. Why the other is alarming? Yes. No "QM is nonlocal" slogans without explanation? Yes.

