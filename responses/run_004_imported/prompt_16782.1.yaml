answer: |-
  You should trust your instincts here: **your colleague is almost certainly mistaken.**

  While it is tempting to assume that every David Lewis paper must be powered by his signature metaphysical machinery (modal realism, counterpart theory, Humean supervenience), "Do We Believe in Penal Substitution?" (1997) is a notable exception. It is a paper in the philosophy of religion that leans heavily on ordinary language analysis and moral intuition, not on the technical apparatus of *On the Plurality of Worlds*.

  Here is a breakdown of where the mix-up likely lies, what Lewis actually argues, and how you can handle this in your seminar without undermining your colleague (or yourself).

  ### 1. The Core Confusion: "Counterpart" vs. Counterpart Theory
  The confusion likely stems from Lewis's use of the word "counterpart" in the **ordinary English sense** versus the **technical metaphysical sense**.

  *   **Ordinary Sense:** In the paper, Lewis discusses the idea of a "substitute" or a "stand-in." In common parlance, one might call a substitute a "counterpart." Lewis discusses whether Christ can act as a representative or a stand-in for sinners.
  *   **Technical Sense:** Lewis's famous **Counterpart Theory** is a specific solution to the problem of trans-world identity in modal logic. It posits that objects exist only in their own world and are related to objects in other worlds by similarity relations (counterpart relations).

  **The Mix-Up:** Your colleague has likely heard that Lewis talks about Christ being a "counterpart" (stand-in) for sinners and conflated this with Lewis's technical **Counterpart Theory**. However, the technical theory is about *modal* contexts (what *could* have happened to you), whereas penal substitution is about *actual* justice (who *did* suffer in this world). Invoking modal counterpart theory would actually undermine penal substitution, because on Lewis's technical view, punishing a counterpart in another world is definitely *not* punishing you in this world.

  ### 2. The Actual Argument of the Paper
  You remembered the broad shape correctly. The paper is short (about 4–5 pages) and focuses on the **conceptual distinction between debt and punishment.**

  *   **Debt is Transferable:** Lewis argues that we have no trouble conceptually with one person paying the debt of another. If A owes B $100, C can pay B $100 on A's behalf. The debt is extinguished. This is the model of "satisfaction" or "ransom."
  *   **Punishment is Personal:** Lewis argues that punishment is essentially different. If A deserves punishment, it makes no sense to say C is punished *instead* of A.
  *   **The Whipping Boy:** Lewis uses the "whipping boy" example (as you recalled) to illustrate this. When the prince misbehaves and the servant is whipped, the servant suffers, but the prince is not punished. The prince might feel guilty, or the servant might suffer *on behalf* of the prince, but strictly speaking, the punishment landed on the servant.
  *   **The Conclusion:** Lewis does **not** use counterpart theory to solve this. Instead, he suggests that if Christians believe in penal substitution, they are either:
      1.  Confusing punishment with debt (treating sin as a liability rather than a crime).
      2.  Relying on a mystery or a metaphor that doesn't hold up to philosophical scrutiny.
      3.  Implicitly relying on a kind of **mystical identity** (where Christ and the sinner are somehow one) which Lewis flags as philosophically problematic without further metaphysical heavy lifting (which he does not provide in this paper).

  Lewis's tone is one of skeptical inquiry. He is a Lutheran and affirms the doctrine, but he is flagging the philosophical tension. He explicitly says we may believe the *doctrine* without understanding the *mechanism*, but he does not offer Counterpart Theory as that mechanism.

  ### 3. Why Counterpart Theory Would Fail Here
  If you want to be prepared for a pushy grad student who sides with your colleague, here is why Counterpart Theory (CT) doesn't work for penal substitution:

  *   **Justice is World-Bound:** In Lewis's CT, justice and desert are typically evaluated within a world. If Sinner-S in World-W1 sins, Sinner-S deserves punishment in W1.
  *   **The Counterpart Relation:** Christ-C in World-W2 might be a counterpart of Sinner-S. But punishing Christ-C in W2 does not satisfy the justice requirements for Sinner-S in W1. It would be like punishing your twin brother for your crime; the law (and Lewis's metaphysics) sees you as distinct entities.
  *   **Lewis's Own View:** Lewis was a nominalist about many things. He would likely argue that punishing a counterpart is literally punishing someone else. Therefore, CT makes penal substitution *harder* to defend, not easier.

  ### 4. Seminar Strategy
  Since you are teaching this tomorrow, here is a suggested way to frame the session that honors your memory, corrects the record gently, and keeps the discussion productive:

  1.  **Validate the Intuition:** Start by acknowledging that it is natural to look for Lewis's metaphysical "fingerprint" in his theology. "Given Lewis's commitment to Counterpart Theory in metaphysics, it is tempting to look for its shadow in his soteriology."
  2.  **Clarify the Text:** State clearly that in "Do We Believe in Penal Substitution?", Lewis relies on **moral conceptual analysis** (debt vs. punishment) rather than **modal metaphysics**.
  3.  **The "Counterpart" Ambiguity:** Explain the linguistic trap. "Lewis does discuss Christ as a representative or stand-in, and sometimes uses the word 'counterpart' in the colloquial sense. However, he does not deploy the technical machinery of *Counterpart Theory and Quantified Modal Logic* to solve the justice problem."
  4.  **Open the Floor:** Turn the colleague's claim into a discussion question for the grad students. "Some have suggested Lewis *could* have used Counterpart Theory to rescue penal substitution. Why might that fail? Does punishing a modal counterpart satisfy the retributive requirements of the actual world?"

  ### 5. Bibliographic Note
  Just to ensure you have the right text in front of you:
  *   **Title:** "Do We Believe in Penal Substitution?"
  *   **Year:** 1997
  *   **Source:** It is often anthologized, but the original publication is frequently cited as a paper presented at a conference (Valparaiso University) and later printed in collections like *Philosophical Papers* (though it is not in the main two volumes of his *Papers*). A common citation is from the collection *The Redemption of Christ* or similar theology/philosophy intersections.
  *   **Length:** It is very short. If you have a text in front of you that is 20+ pages and dense with modal logic, you have the wrong paper. If it's a few pages of clear, punchy prose about whipping boys and debts, you have the right one.

  **Summary for your peace of mind:** You are not garbling it. Your colleague is projecting Lewis's metaphysics onto his theology. The paper is about the intransferability of punishment, not the modal relations of counterparts. You can walk into that seminar confident that your reading of the text is the standard one.
