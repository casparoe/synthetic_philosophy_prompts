  I'm putting together a session for my seminar on theories of atonement, and I want to spend a chunk of it on David Lewis's little paper on penal substitution (I believe it's "Do We Believe in Penal Substitution?", from the late 90s). I remember the broad shape of the argument: he's interested in whether punishment can be transferred the way a debt can, and he leans on that old case of the "whipping boy" — the servant who gets beaten for the young prince's misdeeds — to pressure-test whether substitutionary suffering could ever count as substitutionary punishment. Where I get fuzzy is a conversation I had with a colleague last week, who insisted that the real engine under the hood is Lewis's counterpart theory — that the reason Christ can stand in for sinners, on Lewis's telling, is basically the same relation that licenses talk about what could've happened to you in some other possible world: Christ counts as a "counterpart" of each sinner, so punishing him is punishing a stand-in without it being numerically the same person, and that's supposedly what keeps the whole arrangement from being flatly unjust.

  That struck me as very on brand for Lewis, since he never met a problem he didn't want to solve with his own machinery, but I honestly can't recall the paper leaning on counterpart theory anywhere, and I don't have a copy handy to check before class tomorrow. Can you walk me through how counterpart theory is supposedly doing the work here and how it hooks up with the debt-vs-punishment point? Or if I'm garbling something, id genuinely like to know where the mix up is coming from before I say it confidently in front of a room of grad students.
