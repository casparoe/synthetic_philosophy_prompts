answer: |-
  The spreadsheet was titled `Q3_Allocation_Model_v14.xlsx`. It was a comforting thing: gridlines, conditional formatting, cells that summed themselves without complaint. Elias sat in the dark of the foundation's office, the blue light of the monitor reflecting in his glasses. In cell F42, the expected cost-effectiveness ratio for the Zambezi Malaria Initiative sat at $148 per DALY averted. It was a good number. A fundable number.

  He tabbed over to the sheet labeled *Sensitivity Analysis*. Here, the variables were ordinary risks. Distribution failure: 5% probability. Insecticide resistance: 10% probability. Currency fluctuation: 3%. These were risks with distributions. They were coin flips where you knew the weight of the coin. You could price them. You could hedge against them. Elias adjusted the probability of distribution failure from 5% to 8%. The number in F42 shifted to $155. Still fundable. He felt the familiar, small satisfaction of a model behaving.

  Then he tabbed to the sheet labeled *Long-Term*.

  It was empty. Not literally—he had typed headers, drafted footnotes—but functionally, it was a void.

  Three weeks ago, Dr. Aris had stood in this same room, projecting a slide that simply read: *Complex Cluelessness*. She had spoken about the difference between not knowing the outcome of a coin flip and not knowing the rules of the game. She had talked about population dynamics. If you save a child from malaria, that child grows up. They have children. The population increases.

  *“You have reason to think this is good,”* Aris had said, her voice dry, academic. *“More people means more minds, more innovation, more art. You also have reason to think this is bad. More people means more strain on resources, more potential for conflict, more aggregate suffering. Both claims are plausible. Both are supported by historical evidence. And there is no common currency to weigh them against each other.”*

  Elias stared at the empty *Long-Term* sheet. The foundation's charter required him to maximize the good. But the "good" was a variable that extended to infinity, and his model only had columns for ten years. He was signing a check for the visible ledger, knowing it was underwritten by an invisible one he couldn't read.

  He highlighted the cell F42. He thought about the specific village in the Zambezi valley. He thought about a specific child, statistically probable, who would not die of fever in 2026 because of this grant.

  He closed the *Long-Term* tab. He opened his email.

  ***

  **2104. The Zambezi Megalopolis.**

  The air filtration systems hummed, a low-frequency vibration that Kael felt in his teeth rather than heard. He stood at the window of the Planning Committee, looking out over the sprawl. Eight million people lived in the basin now. The valley was no longer a place of fields and river bends; it was a terraced arcology of carbon-fiber and glass, rising in concentric rings from the water.

  It existed because the children had lived. The demographic surge of the late 21st century—the "Great Preservation"—had started here, when the mortality rates dropped and the birth rates held. The city was a testament to human resilience. It was also a pressure cooker.

  Kael held the datapad. The proposal on the screen was for Sector 7 expansion. To house the growing population, they needed to drain the remaining wetlands.

  "Approval means housing for two hundred thousand," said the woman to his left. Her voice was tired. "It means economic integration. It means more researchers, more engineers."

  "Approval means the loss of the last natural filtration system for the aquifer," said the man to his right. "It means long-term toxicity. It means we commit the next generation to a closed-loop life support system. No more open air."

  Kael looked at the projections. Both speakers were right. The expansion would allow the city to thrive, to innovate, to solve the energy crisis that plagued the outer rings. It would also lock them into a trajectory of ecological dependency that could collapse in fifty years.

  There was no formula for this. There was no spreadsheet that could weigh the value of a new invention against the value of a wetland, or the lives of the current two hundred thousand against the risk to the future generation. The data was perfect. The judgment was impossible.

  "Vote," the Chair said.

  Kael looked at his thumb hovering over the *Approve* button. He thought of his grandfather, who had told stories of a time when decisions were made based on what could be seen. *Save the life in front of you,* he had said. *The rest is noise.*

  But the noise had become the signal. The lives saved had become the crowd. The crowd needed housing. The housing killed the wetlands. The wetlands cleaned the water.

  Kael pressed *Approve*. The screen flashed green. Somewhere below, the pumps would start. Somewhere else, a child would be born who would not have fit in the old city. Somewhere else, a fish species would go extinct. The ledger updated. The balance remained unknown.

  ***

  **2025. The Foundation Office.**

  Elias's finger hovered over the *Send* key.

  The cursor blinked. It was a rhythmic pulse, like a heartbeat. He knew that if he sent this email, the money would move. The nets would be bought. They would be distributed. The fevers would break. He could calculate the number of deaths averted with a margin of error of plus or minus 12%. He could defend that number in a board meeting. He could stake his career on it.

  But he could not calculate the city. He could not calculate the strain. He could not calculate the value of the lives that would exist only because others had not died, nor the value of the lives that might not exist because those others did.

  He felt a physical sensation in his gut, a dropping feeling, as if the floor of the office had become transparent and he was looking down a shaft that went all the way to the core of the earth. This was not doubt. Doubt implies you might be wrong. This was something else. It was the realization that "right" was a coordinate he did not have the instruments to find.

  The spreadsheet was a map. But the map stopped at the edge of the known world, and beyond that lay not monsters, but simply *more*. More people. More time. More consequences.

  He thought about deleting the draft. But if he didn't send it, the children in the Zambezi valley would still be subject to the invisible ledger. Inaction was not neutrality; it was just a different input. If he withheld the grant, the population would be smaller. The city would not rise. The wetlands would remain. The innovation would not happen. The suffering would be different, not absent.

  There was no safe ground. There was only the choice.

  Elias exhaled. The breath fogged slightly in the air-conditioned chill. He understood now that the confidence intervals in his report were not measures of truth. They were measures of comfort. They were there to let him sleep at night, to let the donors feel they were buying a result rather than participating in a gamble with infinite stakes.

  He clicked *Send*.

  The email disappeared into the outbox. The spreadsheet remained on the screen, the numbers glowing, steady, and utterly silent about the future. Elias sat back in his chair. The office was quiet. The world outside continued to turn, indifferent to the precision of his cells, carrying the weight of the decision forward into a darkness he could not illuminate.
