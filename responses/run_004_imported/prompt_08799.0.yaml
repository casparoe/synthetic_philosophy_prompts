prompt: |-
  Okay so in my philosophy elective we just spent like two classes on free will and this thing called the Principle of Alternative Possibilities (my teacher kept calling it PAP for short), which is basically the idea that you can only be held responsible for something if you could've done otherwise. Then we got to Frankfurt's famous counterexample where this neuroscientist Black has a chip wired into Jones's brain that will force Jones to shoot the mayor if he shows any sign of chickening out at the last second, except Jones just goes ahead and decides to shoot him on his own, so the chip never actually has to kick in. My teacher made it sound like this basically broke PAP for a ton of philosophers when it came out in 1969.

  Then this weekend I was going down a rabbit hole for an unrelated english assignment and found this John Locke passage that low-key seems like its doing the exact same move like 300 years earlier?? It's the one where a guy is in a room talking to someone he actually wants to talk to, except while he wasnt paying attention someone locked the door from outside, so he literally could not leave even if he wanted to, but Locke still calls his staying "voluntary" since leaving wasn't even on his mind in the first place.

  Can you actually compare these two for me? Like is Locke basically already making Frankfurt's point about not needing alternate possibilities, just with a locked door instead of a brain chip, or is there some real difference in how the two setups work that actually matters philosophically and would explain why Frankfurt's version is the one that everybody treats as this huge deal. Kinda want to bring it up in class tomorrow but not if I'm gonna get the comparison wrong lol.
