answer: |-
  Your intuition is nagging at you because you are thinking like a classical economist, while your friend is acting like a behavioral psychologist. Both of you are right, but you are defining "value" differently.

  In standard decision theory, there is a concept called the **Value of Information (VoI)**. The mathematical rule is that free information should never have negative value. At worst, it is useless (you get the info, ignore it, and do the same thing). At best, it helps you make a better decision. Therefore, logically, checking the account should be neutral or positive, never negative.

  However, your friend is operating under a different utility function. Here is why his behavior is actually rational, provided you accept a few premises about human psychology.

  ### 1. Utility $\neq$ Wealth
  Classical economics often assumes humans care only about final wealth accumulation. If that were true, your friend would be irrational. But humans care about **utility**, which includes emotional state, stress levels, and peace of mind.

  If seeing a red number in his brokerage account releases cortisol, ruins his dinner, and makes him snap at his kids, that is a **real cost**. It is not a financial cost, but it is a utility cost.
  *   **Benefit of checking:** $0 (since he won't change his action).
  *   **Cost of checking:** Negative emotional utility (stress, anxiety).
  *   **Net Value:** Negative.

  In this framework, avoiding the information is the utility-maximizing choice. This is often called **Information Aversion**.

  ### 2. The "Ostrich Effect" and Myopic Loss Aversion
  Your friend is exhibiting a well-documented behavior in behavioral finance called the **Ostrich Effect**. Investors tend to avoid looking at their portfolios when the market is down.

  This is often a defense mechanism against **Myopic Loss Aversion**. Research (notably by Benartzi and Thaler) shows that investors feel the pain of losses about twice as intensely as the pleasure of gains. If you check your portfolio daily, you see losses roughly 46% of the time. If you check annually, you see losses only about 30% of the time.
  *   By not checking, your friend is artificially reducing the frequency with which he experiences "loss pain."
  *   Since his strategy is buy-and-hold, the short-term fluctuations are noise. Filtering out the noise protects his psychological capital, which is required to stick to the long-term plan.

  ### 3. Pre-commitment as a Rational Strategy
  Your friend has essentially made a **Ulysses Pact**. In the Odyssey, Ulysses had his men tie him to the mast so he could hear the Sirens' song without jumping overboard. He knew that in the moment, his future self might be irrational, so his current self restricted his future options.

  Your friend knows that while he *says* he won't sell, seeing a massive drop might trigger a panic response that overrides his logic. By refusing to check, he is removing the trigger. This is a rational meta-strategy: **restricting access to information to ensure adherence to a long-term plan.**

  ### 4. Where Your Intuition Is Right (The Caveat)
  Your nagging feeling is valid because there *are* scenarios where your friend becomes irrational. Information has zero value only if it truly cannot change the outcome. But ignoring the account entirely carries **tail risks**:
  *   **Fundamental Break:** What if the specific ETF or fund he holds is actually collapsing due to fraud or structural failure (e.g., a specific sector crash), rather than just general market volatility?
  *   **Rebalancing:** A true buy-and-hold strategy usually involves periodic rebalancing (selling high to buy low). If he never looks, he never rebalances, which can actually lower long-term returns.
  *   **Security:** He needs to check occasionally to ensure no fraud or hacking has occurred.

  ### The Verdict
  Your friend is **psychologically rational**, even if he is **economically unconventional.**

  He has correctly identified that for his specific personality type, the emotional cost of monitoring exceeds the instrumental benefit of the data. He is treating his mental health as an asset class that needs protection, just like his capital.

  You are missing nothing in your logic; you are just applying a standard "Value of Information" model that assumes the agent is a robot who doesn't feel pain when seeing red numbers. Your friend admits he is human. In that context, ignorance isn't just bliss; it's an optimal strategy.
