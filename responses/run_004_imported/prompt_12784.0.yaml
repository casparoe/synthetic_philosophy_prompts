          *   "Moral Trade" is a valid concept (see: Toby Ord, William MacAskill).

      *   **Argument against the Deal (Virtue/Integrity):**
          *   Morality shouldn't be transactional.
          *   Risks resentment (if one feels they sacrificed more).
