answer: |-
  **Beyond the Thought of Duty: Defending Robust *De Re* Responsiveness**

  The problem of moral worth asks a deceptively simple question: when an agent performs a morally right action, what makes that action creditable to them as a moral achievement rather than a mere accident of behavior? Immanuel Kant's famous shopkeeper, who charges customers fairly solely to protect his reputation, provides the negative constraint: rightness in conformity with duty is insufficient. For Kant, the action must be done *from* duty. However, as contemporary moral psychology has evolved, the requirement to act "from duty" has come under fire for demanding a psychological structure that is either impossible, alienating, or exclusionary of paradigmatic cases of moral goodness.

  This essay navigates the spectrum of contemporary responses to this problem, ranging from Barbara Herman's neo-Kantian "limiting condition" to Nomy Arpaly's *de re* responsiveness, with Julia Markovits's "coincident reasons" thesis occupying the middle ground. I will argue that moral worth does not require a *de dicto* belief that one's action is right, even in Herman's attenuated, dispositional sense. Such a requirement succumbs to the alienation objections raised by Michael Stocker and Bernard Williams without successfully ruling out luck. Instead, I defend a view of moral worth grounded in *de re* responsiveness to right-making features. However, mere responsiveness is insufficient to distinguish worth from lucky conformity. Therefore, while Arpaly is correct to champion the case of Huckleberry Finn, her account (and Markovits's) requires a modal amendment: moral worth requires *robust* responsiveness. I will conclude that Markovits's coincident-reasons account, while structurally sound, needs amendment to fully accommodate Huck Finn and to secure the view against luck, ultimately vindicating a competence-based model of moral worth that prioritizes the agent's reliable connection to value over their conceptual grasp of morality.

  ### I. The Kantian Legacy and the Alienation Objection

  Kant's shopkeeper illustrates the distinction between legality (conformity) and morality (worth). For Kant, the motive of duty must be the sufficient determinant of the will. Read crudely, this suggests an agent must occurrently think, "I am doing this because it is my duty." This reading invites the famous alienation objections from Michael Stocker and Bernard Williams. Stocker argues that visiting a friend in the hospital out of a sense of duty, rather than out of care for the friend, manifests a "schizophrenia" of value, where one's motives are divorced from the reasons that make the act good. Williams, in his critique of impartial morality, suggests that requiring a moral justification for saving one's spouse over a stranger involves "one thought too many." If moral worth requires consulting the moral law before acting, it seems to preclude the spontaneous, direct concern that characterizes our deepest moral commitments.

  Barbara Herman attempts to rescue the Kantian insight from these objections. She argues that the motive of duty need not be the primary motivating force in every instance. Instead, it functions as a "limiting condition." An agent may act from love or sympathy, provided that the motive of duty stands as a dispositional check ensuring that these inclinations do not lead one astray. On this view, I can visit my friend because I care, but I possess moral worth because, had caring conflicted with morality, duty would have prevailed.

  While Herman's view avoids the requirement of occurrent moral thinking, it retains a *de dicto* commitment to morality as a structural filter. The agent must still hold a dispositional belief about the authority of moral requirements. This remains vulnerable to a sophisticated alienation objection. If the agent's commitment to their friend is ultimately conditional on a background commitment to the moral law, the relationship is still mediated by morality. Furthermore, Herman's view struggles with cases where an agent's moral beliefs are incorrect, yet their actions are praiseworthy. This brings us to the challenge of Huckleberry Finn.

  ### II. The Case for *De Re* Responsiveness

  Nomy Arpaly's discussion of Huckleberry Finn serves as the wedge against *de dicto* requirements. Huck helps the escaped slave Jim, believing all the while that he is committing a sin by stealing "property." He acts against his own explicit moral judgment. If moral worth required a *de dicto* belief that one is doing the right thing (or even a dispositional commitment to the true moral law, as Herman might insist), Huck would lack moral worth. Yet, intuitively, Huck is morally better than the society that condemns him.

  Arpaly argues that moral worth consists in *de re* responsiveness to the right-making features of an action. Huck responds to Jim's humanity and their friendship—the features that actually make helping Jim right—even though he misdescribes these features as "wickedness." On this view, the agent's conceptual grasp of morality is irrelevant; what matters is the quality of their concern for the values that actually matter.

  Julia Markovits refines this intuition with her "coincident reasons" thesis. She argues that an action has moral worth if and only if the reasons that motivate the agent are the very reasons that morally justify the action. For Markovits, this avoids the alienation problem because the agent acts for the same reasons that make the act good (e.g., "my friend is suffering"), without needing to categorize them as "moral reasons."

  ### III. The Limitations of Markovits and the Problem of Luck

  While Arpaly and Markovits successfully evade the alienation objection, their accounts face a significant challenge: the problem of luck. If moral worth is simply a matter of acting on the right reasons, what distinguishes the morally worthy agent from the "lucky conformist"? Consider an agent who helps a stranger solely because they are in a good mood after finding money. The stranger needed help (a justifying reason), and the agent's good mood led them to help (an explaining cause). If we are not careful, a *de re* view might count this as morally worthy, provided the causal chain lines up.

  Markovits attempts to rule this out by insisting on a non-accidental connection between motivating and justifying reasons. However, her account requires amendment to fully accommodate the Huckleberry Finn case and to rigorously exclude luck.

  First, regarding Huck Finn: Markovits's account, as strictly formulated, relies on the agent acting for *reasons*. In philosophical parlance, reasons are often taken to be considerations the agent takes to count in favor of an action. Huck explicitly denies that there are considerations counting in favor of helping Jim; he thinks the considerations count *against* it. He acts on a non-cognitive emotional impulse (sympathy) that tracks value, rather than a rational grasp of reasons. If Markovits requires the agent to represent the motivating consideration *as* a justification, Huck is excluded. To accommodate Huck, Markovits's account must be amended to allow that emotional responses can constitute a form of "grasping" reasons without propositional endorsement. We must expand the notion of "acting for a reason" to include reliable affective sensitivity to value.

  Second, and more critically, the coincident-reasons thesis needs a modal strengthening to solve the luck problem. Two reasons can coincide accidentally. To distinguish moral worth from lucky conformity, the responsiveness must be *robust*. That is, the agent must be disposed to respond to the right-making features across a range of nearby possible worlds where circumstances vary slightly. The lucky conformist helps only because they found money; in a nearby world where they are in a neutral mood, they walk past. The morally worthy agent helps because they are sensitive to the need itself; in nearby worlds where their mood varies, they still help.

  Therefore, Markovits's account needs amendment: it is not enough that the reasons *actually* coincide; the agent must possess a stable competence such that the reasons *would* coincide across relevant counterfactual scenarios. This modal condition captures the non-accidental nature of worth without reintroducing a *de dicto* belief requirement.

  ### IV. Defending the Verdict: Competence Without Conception

  Why prefer this amended *de re* view over Herman's *de dicto* limiting condition? The primary advantage is that it dissolves the alienation objection while preserving the distinction between worth and luck.

  Stocker and Williams worry that making morality the object of motivation alienates us from the concrete goods (friends, projects) that give life value. Herman mitigates this by making duty a filter, but the filter remains. The robust *de re* view eliminates the filter entirely. On this view, caring directly for one's friend *is* the moral response. There is no "one thought too many" because there is no thought about morality at all. The moral worth lies in the quality of the care itself—specifically, its robustness and its alignment with actual value.

  Critics might argue that without a *de dicto* belief, we cannot distinguish the worthy agent from the instinctive helper who helps only their kin (parochialism). If the agent helps their friend robustly but would not help a stranger in the same need, do they have moral worth? This depends on the scope of the right-making features. If the justifying reason is "this is my friend," then robust responsiveness to that reason yields worth. If the justifying reason is "this is a person in need," then parochialism indicates a failure of responsiveness to the *full* set of justifying reasons. The *de re* view handles this by looking at the match between the agent's sensitivity and the actual normative landscape. It does not require the agent to *know* the landscape universally, only to track it reliably where they are.

  Furthermore, the robust *de re* view explains why Huck Finn is praiseworthy despite his false beliefs. Huck possesses a moral *competence* that outstrips his moral *conception*. He is skilled at detecting and responding to human value, even if his theoretical understanding of that value is corrupted by his society. Herman's view, which ties worth to a commitment to the moral law, struggles to credit Huck, as his commitment is explicitly to the wrong law. Arpaly identifies this, but without the modal robustness condition, her view risks making worth too easy to come by (e.g., a single flash of sympathy). By combining Arpaly's insight about *de re* tracking with a Markovits-style requirement for non-accidental coincidence (strengthened modally), we get a view that credits Huck without crediting the lucky conformist.

  ### Conclusion

  The search for moral worth need not lead us back to Kant's shopkeeper or into the alienation of the moral saint. The dispute between Herman, Markovits, and Arpaly reveals a tension between the security of *de dicto* commitment and the authenticity of *de re* responsiveness. I have argued that we must choose the latter. Moral worth does not require a *de dicto* belief that one's action is right, even as a limiting condition. Such a requirement imposes a psychological burden that generates alienation and excludes agents like Huckleberry Finn who act rightly despite mistaken moral convictions.

  Instead, moral worth is grounded in a robust *de re* responsiveness to the features that actually make an action right. This view respects the intuition that caring for a friend is itself a moral achievement, not merely a raw material to be sanctioned by duty. However, to prevent this view from collapsing into an endorsement of lucky conformity, Julia Markovits's coincident-reasons account must be amended. It must explicitly incorporate a modal condition of robustness and expand its account of "reasons" to include non-cognitive emotional sensitivities. With these amendments, we arrive at a verdict that is both rigorous and humane: moral worth is the reliable, non-accidental capacity to be moved by the good, regardless of whether one knows the name of the good by which one is moved.
