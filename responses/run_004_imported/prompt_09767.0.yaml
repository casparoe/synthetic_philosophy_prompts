answer: |-
  You have hit on one of the deepest fault lines in decision theory. Your programmer instinct is spot-on: in a static graph, **Sophisticated Choice** (backward induction) *does* solve the basic money pump. If you can see the negative cycle, you prune the branch. You don't start the trade.

  So why does the debate persist? Why does Edward McClennen (and others like David Gauthier) argue for **Resolute Choice**?

  The short answer is: **Sophisticated Choice solves the exploitation problem by crippling the agent, whereas Resolute Choice solves it by redefining the unit of agency.**

  Here is the breakdown of why plain lookahead isn't enough, and why Resolute Choice isn't just "stubbornness."

  ### 1. The Limit of Lookahead: Separability
  Your intuition relies on the assumption that the decision tree is a fixed object you can traverse mentally. In decision theory, this relies on an axiom called **Separability**.

  Separability says: *When you reach a node in the tree, your choice should depend only on the future consequences from that node onward. The past is sunk; the plan you made back at the root is irrelevant.*

  Sophisticated Choice respects Separability. It says, "At node 2, I will choose what is best for me *at node 2*." Therefore, at node 1, I must anticipate what I will do at node 2.

  **The Problem:** Many rational plans require **Non-Separability**.
  If your preferences are context-dependent (which they often are in humans, e.g., Allais Paradox, hyperbolic discounting), your "Node 2 Self" will have different preferences than your "Node 1 Self."
  *   **Sophisticated Choice** treats your future self as an adversary in a game. It says, "I know Future-Me will screw this up, so I won't even start."
  *   **Resolute Choice** treats your future self as the *same agent*. It says, "I am making this choice for the whole timeline. Future-Me is bound by the logic of Root-Me."

  ### 2. The Deterrence Example (Where Lookahead Fails)
  The classic case where Sophisticated Choice fails to maximize utility is **Deterrence**.

  Imagine you want to protect your lawn.
  1.  **Node 1:** You announce, "If anyone walks on my lawn, I will punch them." (Costly to you, costly to them).
  2.  **Node 2:** A neighbor considers walking on the lawn.
  3.  **Node 3:** If they walk, you must decide to punch or not.

  **The Sophisticated Analysis:**
  *   At **Node 3**, if the neighbor is already on the lawn, punching them costs you energy and risk of lawsuit. The rational move *at Node 3* is **Don't Punch**.
  *   At **Node 2**, the neighbor runs backward induction. They know you are sophisticated. They know you won't punch at Node 3. So they **Walk on Lawn**.
  *   At **Node 1**, you know this will happen. You gain nothing.

  **The Resolute Analysis:**
  *   At **Node 1**, you adopt the plan: "Punch if they walk."
  *   At **Node 3**, even though punching is locally costly, you **Punch** because you are resolute. You do not re-evaluate based on local costs; you execute the plan that was optimal at the root.
  *   At **Node 2**, the neighbor knows you are resolute. They **Do Not Walk**.
  *   **Result:** Your lawn is safe. You never have to punch anyone. You achieve a better outcome than the sophisticated agent.

  If you use "plain lookahead" (Sophisticated Choice), you cannot make credible threats or promises. You are forced into a dominated strategy because you refuse to bind your future self.

  ### 3. Is Resolute Choice "Irrational"?
  You described Resolute Choice as: *"Precommit now and then override your own judgement later whenever it's inconvenient."*

  This feels like smuggling irrationality in because it violates **Dynamic Consistency**. It looks like this:
  *   **Time 1:** I prefer Plan X.
  *   **Time 2:** Given the new state, I locally prefer Not-X.
  *   **Action:** I do X anyway.

  To a standard economist, this is irrational. You are ignoring new information (the local costs).

  **The Resolute Defense:**
  McClennen argues that **rationality is a property of the agent over time, not the agent-at-a-moment.**
  If you treat every time-slice as a new agent with veto power, you cease to be a single entity. You become a "succession of selves." In that case, you *can't* plan. You can only react.

  Resolute Choice argues that **the plan itself carries normative weight.**
  When you re-evaluate at Node 3, you aren't just looking at "Punch vs. Don't Punch." You are looking at "Break my integrity vs. Keep my integrity." If you value being a being that can plan, then the cost of breaking the plan is high enough that executing the plan *is* the locally rational choice.

  It's not overriding judgment; it's **updating the utility function to include the cost of dynamic inconsistency.**

  ### 4. Why the Money Pump Debate Continues
  In the specific context of the Money Pump (A > B > C > A):

  *   **Sophisticated Choice** says: "I see the loop. I refuse to trade A for B in the first place."
      *   *Critique:* This works, but it's passive. It limits your feasible set. You have to avoid any situation where your preferences *might* cycle, even if the cycle is unlikely to be exploited.
  *   **Resolute Choice** says: "I prefer A > B > C > A. But I adopt the rule: 'Once I hold A, I do not trade.' "
      *   *Benefit:* This allows you to hold intransitive preferences (which might reflect nuanced value judgments, like "variety seeking") without being exploited.

  The reason people still reach for Resolute Choice is that Sophisticated Choice is **too fragile**. It requires perfect knowledge of the tree and perfect computational power to backward induct. If there is any uncertainty, or if the tree is infinite, or if the "nodes" are continuous time (like addiction or savings), backward induction breaks down.

  Resolute Choice is a **heuristic for agency**. It says: "I am not a stateless function. I am a process with memory. My past choices constrain my future valid moves."

  ### Summary for a Programmer
  *   **Sophisticated Choice** is like a garbage collector running before every allocation. It ensures you never run out of memory (never get pumped), but the overhead prevents you from running complex programs (making credible threats/plans). It treats Future-You as a separate thread with its own stack.
  *   **Resolute Choice** is like a transaction log (WAL). You commit to a transaction at the start. Even if intermediate states look like they should rollback, you honor the commit to maintain database consistency. It treats Future-You as the same process sharing the same memory space.

  McClennen's point is that if you want to be an agent capable of **strategy** (not just reaction), you have to be Resolute. Otherwise, you are just a bundle of impulses that happens to be able to simulate the future.
