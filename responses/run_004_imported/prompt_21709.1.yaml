  Over the past month I've redirected my dissertation work away from formal semantics and toward the social and political dimensions of early logical empiricism, a shift prompted largely by sitting in on a graduate seminar on the Vienna Circle. It's been a bit disorienting, since I'd always associated Carnap purely with the technicalities of the Aufbau and Logical Syntax, and I'm still catching up on the biographical and archival material myself. To make matters more pressing, the seminar's regular teaching assistant is on leave this term, so I agreed, probably too quickly, to take over grading duties even though I've only been reading closely on Neurath's and Carnap's actual political lives for a few weeks.

  The take-home question I set, on the 1929 manifesto and its political context, reads as follows:

  "In August 1929 the pamphlet *Wissenschaftliche Weltauffassung: Der Wiener Kreis* presented logical empiricism's rejection of metaphysics as continuous with a broader program of rational social and economic planning.
  (a) Who actually wrote this pamphlet, on what occasion, and which members of the Circle are usually credited with giving it its distinctive political cast?
  (b) Drawing on Carnap's own later account of his political development, explain what he meant by calling himself a socialist, and how, if at all, this connects to any concrete experience of economic planning during or after the German Revolution of 1918–19.
  (c) Explain why it would be a mistake to infer, from the pamphlet's dedication, that Moritz Schlick endorsed the political reading of the 'scientific world-conception' that the pamphlet advances."

  And here is the response I'm trying to grade:

  "(a) The pamphlet was drawn up under the auspices of the Verein Ernst Mach and presented to Moritz Schlick in October 1929 as a token of thanks for declining a call to Bonn and remaining in Vienna. It carries no named author on its title page, though its preface bears three signatures. Carnap was the principal drafter, working from notes and suggestions supplied by Hahn and Neurath, and it is these three, especially Neurath and Carnap, who are usually identified as the Circle's 'left wing' and credited with the manifesto's programmatic, almost activist tone, in contrast to more moderate members such as Schlick himself.

  (b) In his Intellectual Autobiography, Carnap writes that almost everyone in the Circle, himself included, considered themselves socialists, and that he thought the great problems of the age could not be left to spontaneous, unplanned forces but required deliberate rational planning: in economic life this meant some form of socialism, and internationally a gradual move toward world government. This was not just an abstract sympathy. In 1919, while Neurath was heading the short-lived Bavarian Soviet Republic's Central Economic Office (Zentralwirtschaftsamt), Carnap worked alongside him there, helping to draft aspects of the 'economy in kind' scheme that tried to replace market prices with planning in physical units, before the whole enterprise collapsed within weeks under military pressure from the Reich government.

  (c) It would be a mistake to read the dedication as Schlick's endorsement, since a dedication is a personal courtesy rather than a co-signature, and since we know that at least two other Circle members, Gödel and Menger, privately objected to the manifesto's collectivist, quasi-programmatic language. Schlick's own political commitments were considerably more individualist and liberal than Neurath's, so it is unlikely he regarded the pamphlet's social-democratic undertones as simply an extension of 'his' scientific world-conception."

