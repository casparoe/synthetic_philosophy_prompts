answer: |-
  You are not overthinking it at all. In fact, you have independently rediscovered one of the most famous and significant problems in 20th-century metaethics.

  The view your friend Mara is holding is a version of **Non-Cognitivism** (specifically a view called **Emotivism** or **Expressivism**). The objection you raised regarding her use of "if-then" statements is known in philosophy as the **Frege-Geach Problem**.

  To answer your question directly: If Mara holds a *simple* version of her view (that moral words are *only* emotional grunts), then yes, she is being inconsistent. However, if she adopts a more *sophisticated* version of that view (developed by philosophers specifically to solve the problem you found), then her position can be made consistent.

  Here is a breakdown of the disagreement, why your objection is so strong, and how philosophers try to fix it.

  ### 1. Mara's Position: Expressivism
  Mara argues that moral sentences don't describe the world (like "the cat is on the mat"); instead, they express the speaker's attitude (like "boo, cat!" or "hurrah, cat!").

  *   **Cognitivism:** "Stealing is wrong" = A belief that can be true or false.
  *   **Non-Cognitivism (Mara):** "Stealing is wrong" = An expression of disapproval (not truth-apt).

  Your initial intuition was right: this explains why moral arguments feel different from scientific ones. You can't settle a "boo/hiss" disagreement with a microscope.

  ### 2. Your Objection: The Frege-Geach Problem
  Your observation about the wallet argument is exactly what philosophers Peter Geach and John Searle (drawing on Gottlob Frege) pointed out in the 1960s.

  Logic works by connecting propositions that have truth values. A standard logical argument (Modus Ponens) looks like this:
  1.  If P, then Q.
  2.  P.
  3.  Therefore, Q.

  For this to work, "P" must mean the same thing in line 1 and line 2.
  *   **Line 2:** "Keeping the wallet is wrong." (Mara says this is expressing disapproval/booing.)
  *   **Line 1:** "If keeping the wallet is wrong..."

  Here is the catch: In Line 1, the speaker is **not** booing at keeping the wallet. They are merely considering a hypothesis. They aren't asserting that it *is* wrong; they are saying *if* it is.

  If "wrong" just means "Boo!", then Line 1 translates to: *"If Boo! keeping the wallet, then Boo! our friend."*
  But Line 2 translates to: *"Boo! keeping the wallet."*

  The problem is that "Boo!" doesn't fit inside an "If." You can't conditionally boo. If Mara says moral language is *just* emotional expression, she cannot explain how moral sentences function logically when they aren't being actively asserted. It looks like she wants to treat moral language as "facts" when it's convenient for logic, and as "feelings" when it's convenient for metaphysics.

  ### 3. Can Mara Save Her View? (Quasi-Realism)
  For a long time, philosophers thought your objection killed Non-Cognitivism. However, in the last 40 years, philosophers like **Simon Blackburn** and **Allan Gibbard** have developed a solution called **Quasi-Realism**.

  Quasi-Realism accepts your premise (that moral statements aren't factual descriptions of the universe) but argues that we can still **earn the right** to use logical language like "true," "false," and "if-then."

  Here is how a sophisticated Expressivist (like Blackburn) would defend Mara:

  **A. Logic is about consistency of attitude, not just facts.**
  When we say, "If stealing is wrong, then getting your brother to steal is wrong," we aren't describing a fact about the universe. We are expressing a higher-order attitude. We are saying: *"I disapprove of stealing, and I disapprove of anyone who doesn't disapprove of getting their brother to steal."*
  The logic holds because it would be a **conflict in attitudes** to disapprove of stealing but approve of facilitating it. The "validity" of the argument comes from the requirement to be consistent in our emotions, not from tracking external facts.

  **B. Moral language mimics factual language.**
  Blackburn argues that human language is flexible. Even though moral judgments start as expressions of attitude, we have developed a language that *mimics* factual discourse because it is useful for debate. We talk about moral "truths" not because they correspond to physical objects, but because treating them *as if* they are truths helps us negotiate our shared social lives.

  So, to answer your specific worry: **Is she being inconsistent?**

  *   **If she is a naive Emotivist:** Yes. If she thinks "wrong" is literally just a grunt like "Ouch!", she cannot explain the "if-then" structure. She is using factual grammar for non-factual content without explaining how the bridge works.
  *   **If she is a Quasi-Realist:** No. She can argue that moral language *functions* logically even if its *foundation* is expressive. She would say you are right that it looks like fact-stating language, but that this is a feature of how we communicate attitudes, not proof that moral facts exist.

  ### Summary
  You have hit on the central tension of modern metaethics.
  1.  **Mara is right** that moral language feels different from scientific language (it motivates action, it's hard to prove).
  2.  **You are right** that moral language behaves like factual language in logic (it fits into "if-then" structures).

  The philosophical consensus is that a *simple* "boo/hiss" theory is insufficient for the reason you identified. However, a *complex* Expressivist theory (Quasi-Realism) attempts to solve exactly this problem by redefining what logic means in the context of attitudes.

  You aren't overthinking it; you're doing philosophy. If Mara wants to maintain her view, she needs to read up on **Simon Blackburn's Quasi-Realism** or **Allan Gibbard's Norm-Expressivism**, which are designed specifically to answer the objection you raised.
