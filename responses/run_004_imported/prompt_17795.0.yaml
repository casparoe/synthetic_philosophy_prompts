answer: |-
  The ink was still wet on the magistrate's confession when the sun breached the high windows of the chambers. It cut through the haze of stale wine and candle smoke, illuminating Magistrate Vane slumped over his desk, breathing in the heavy, rhythmic wheeze of a man who had drowned his conscience for a few hours.

  Elian, his clerk, stood by the hearth. He held the poker, though the fire had long since died to grey ash. He was twenty-four, with ink-stained fingers and a mind that had until last night believed in the architecture of the law. He believed the statutes were beams, the precedents were foundations, and justice was the roof that kept the rain out.

  Vane had knocked the beams loose.

  *"Justice without force is powerless,"* the old man had slurred, waving a goblet like a scepter. *"Force without justice is tyrannical. We cannot make the just strong, so we make the strong just. And we pray no one looks too closely at the stitching."*

  Elian had recorded none of it. He had swept the glass shards into the dustpan. Now, he watched the dust motes dance in the sunbeam. They looked like free things. He felt heavy.

  He left Vane sleeping and walked out into the province of Ostral. It was a market day. The square was a churn of wool, livestock, and noise. Elian moved through it in his dark clerical robe, a ghost among the living. He needed to see if the world looked different now that he knew the secret. It did. The guards standing at the corners of the square no longer looked like protectors of peace; they looked like pillars of force holding up a painted canvas.

  He turned down a narrow alley toward the river, where the cheap taverns huddled. He was looking for Silas.

  Silas had been a clerk before Elian. Ten years ago, Silas had found the same stitch in the fabric. Unlike Elian, he had pulled the thread. He had written a pamphlet. He had shouted in the square. Now, Silas sat on a crate behind the *Gilded Tankard*, shivering despite the mild air, picking at a bowl of broth he couldn't afford.

  "You look like him," Silas said, not looking up. His teeth were gone on the left side. "The walk. The eyes. You've seen the man behind the curtain."

  "I serve Magistrate Vane," Elian said.

  "Vane knows," Silas spat. "They all know. The difference is, Vane eats meat and I eat scraps. Because Vane keeps the secret, and I spoke it."

  "Is it not better to speak it?" Elian asked. "To let them know?"

  Silas laughed, a wet, hacking sound. "Know what? That the wolf is guarding the sheep? If the sheep know, they panic. They scatter. The wolf eats them anyway, but now they die alone in the woods instead of safe in the pen. I told them, Elian. I set them free. Look at me. Do I look free?"

  Silas looked up then. His eyes were bright with a feverish, corrosive intelligence. He saw the world exactly as it was: a mechanism of power. But that sight had burned him. He was the newly disillusioned, the man who thinks that seeing the trap means he has escaped it. He hadn't escaped. He had just stepped out of the trap into the wilderness where the traps are everywhere and unmarked.

  "The law is a lie," Silas whispered. "And you are the liar who writes it down."

  Elian left him there. The encounter settled in his gut like cold lead. Silas was right about the truth, but wrong about the cure. Silas believed that truth was a solvent that would clean the world. Instead, it had dissolved only him.

  Elian returned to the court as the afternoon session began. The gallery was packed. A case of land dispute: a widow against a baron. The law was on the widow's side; the baron's retainers were standing in the back of the room, hands on sword hilts.

  Vane entered now, sober, powdered, imposing. The bailiff cried for order. The room silenced. The force was present, dressed in velvet.

  Elian took his seat at the scribe's table. He dipped his quill. He watched Vane listen to the baron's argument, which was thin, legally speaking. Then Vane listened to the widow. She wept. She spoke of her husband's service, of the statutes of inheritance. She spoke of Justice.

  Vane nodded solemnly. He spoke of complex precedents, of jurisdictional nuances that Elian knew were invented on the spot. Then Vane ruled for the baron. The retainers relaxed their grip on their swords. The widow collapsed.

  It was done. Force had won, wrapped in the language of law.

  As the crowd dispersed, the widow's son, a boy of sixteen with fire in his eyes, cornered Elian near the exit. He grabbed Elian's sleeve.

  "You write the words," the boy hissed. "You hear what he says before the ruling. Is it true? Was it the law, or was it the swords?"

  Elian looked at the boy. He saw the same feverish brightness he had seen in Silas's eyes. This was the crossroads. If Elian confirmed the boy's suspicion, he validated a rage that would get the boy killed. He would make another Silas. He would add fuel to a fire that would burn the boy's house down without warming him.

  If Elian lied, he perpetuated the illusion. He became a pillar of the force he despised.

  He thought of Silas shivering in the alley. He thought of Vane sleeping heavily under the weight of the lie, keeping the peace so merchants could sell wool and widows could walk the streets without being robbed by more than just the law.

  Pascal had written that it is dangerous to let men know they are ruled by force. Not because it protects the rulers, but because it destroys the ruled. The wise man knows the truth and bears the burden of the lie to keep the peace. The fool knows the truth and uses it to break the peace, only to break himself.

  Elian gently removed the boy's hand from his sleeve.

  "The Magistrate ruled according to the statutes of the Province," Elian said. His voice was flat, dry, official. "There are appeals processes. You should consult a lawyer."

  "But—"

  "The court is adjourned," Elian said.

  He turned his back on the boy's sputtering rage. He felt a piece of himself harden, calcify. He was no longer the idealist who thought the law was a roof. He was the mason who patched the cracks so the rain wouldn't get in.

  He climbed the stairs back to the chambers. Vane was awake, drinking water, rubbing his temples. The old man looked up as Elian entered. He saw the set of Elian's shoulders. He saw the lack of questions. He saw the death of the boy's hope in Elian's eyes.

  Vane didn't apologize. He didn't need to. They were both initiates now.

  "The transcript?" Vane asked.

  "Ready for your signature," Elian said.

  He placed the parchment on the desk. It was a lie, documented in perfect script. It was a necessary lie. Elian stood back and watched the old man sign away the widow's land. He realized then that wisdom wasn't freedom. Wisdom was the capacity to carry the weight of the deception without collapsing under it. Silas had dropped the weight and been crushed. Vane carried it and remained standing.

  Elian picked up the sand shaker to dry the ink. He would not speak the truth. He would not be free. He would be a clerk. He would ensure that the force looked just enough that the sheep stayed in the pen, where they were safe, and where they were food.

  "Close the door on your way out, Elian," Vane said softly.

  "Yes, my lord."

  Elian closed the door. He stood in the corridor for a moment, listening to the scratch of the quill inside, the sound of the machine continuing to grind. He adjusted his cuffs, smoothed his robe, and walked down the hall to begin the next file. The truth was there, waiting in the silence, but he would not let it out. He locked it behind his teeth and swallowed the key.
