      *   *Point 2: The "Hands Tied" Misconception.* This is crucial for the reporter. Positivism distinguishes *what law is* from *what law ought to be*. It doesn't say judges *must* enforce unjust laws if the system provides escape hatches (like constitutional review). Hart acknowledged the "open texture" of language.
