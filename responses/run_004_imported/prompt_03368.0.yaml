  1.  **Analyze the User's Query:**
      *   **Context:** The user is a journalist/reporter writing about "zombie laws" (unenforced but technically valid statutes, e.g., post-*Lawrence* sodomy laws).
      *   **Trigger:** A lunch with a law professor friend who mentioned the Hart-Fuller debate.
