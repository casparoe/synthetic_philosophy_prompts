answer: |-
  You have a very sharp instinct: yes, you are flattening something important. The "Hart won, Fuller lost, judges must follow unjust rules" summary is the "CliffsNotes" version of mid-century jurisprudence. It's useful for a 1L exam, but for a piece on "zombie laws," it might actually lead you away from the most interesting angles.

  Your friend is right that Hart-Fuller is the background radiation of modern legal theory, but the reason it's still taught 70 years later is precisely because the "victory" was far from tidy.

  Here are four nuances you should consider to deepen your reporting on zombie laws.

  ### 1. Hart didn't say judges' hands are *tied*; he said they are *discretionary*.
  The common misunderstanding of Legal Positivism (Hart's camp) is that it equates to strict formalism—the idea that if a law is on the books, a robot could apply it. Hart actually argued the opposite.

  He introduced the concept of the **"open texture" of law**. Language is inherently vague. No legislature can foresee every future circumstance. Therefore, in hard cases (which "zombie laws" often become), judges *must* exercise discretion. They aren't tied hands; they are entrusted with a limited law-making power to interpret how a rule applies to a new context.

  **For your piece:** A positivist judge might admit a sodomy statute is "valid law" in the sense that it was passed correctly, but argue that its application to private, consensual conduct falls outside the "open texture" of what the legislature intended, or that enforcing it now violates other valid legal principles (like privacy). Positivism doesn't demand moral blindness; it just demands you admit when you're making a moral choice to mitigate the law.

  ### 2. Fuller's "Inner Morality" is alive and well in Rule of Law theory.
  Fuller lost the argument about whether immorality automatically invalidates a law (the "grudge informer" cases). But he won the argument about **procedural justice**.

  Fuller argued that for a system to count as "law," it must meet eight procedural requirements (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy through time, and congruence between official action and declared rule).

  **For your piece:** This is the money quote for "zombie laws." Look at Fuller's eighth principle: **congruence between official action and declared rule.** If a state keeps a sodomy law on the books but prosecutors agree not to enforce it, is there congruence? Fuller would argue that a law that is systematically ignored undermines the integrity of the legal system itself. It creates a trap where the law *could* be weaponized selectively (against political enemies, minorities, etc.) even if it *usually* isn't. That selective potential violates the "inner morality" of the system.

  ### 3. The "Incorporation Thesis" blurs the line.
  Later positivists (and Hart himself in his *Postscript*) acknowledged something called the **Incorporation Thesis**. This is the idea that a legal system *can* choose to incorporate moral standards into its validity criteria.

  In the U.S., the Constitution incorporates moral language ("cruel and unusual," "due process," "equal protection"). So, when a judge strikes down a zombie law because it violates "liberty" under the 14th Amendment, a positivist would say: "That is still a legal move, because the Rule of Recognition (the Constitution) tells us to use moral reasoning to determine validity."

  **For your piece:** This complicates the "judge vs. legislature" dynamic. In the U.S. system, the legislature *already* told the judges to consider morality when they ratified the Constitution. So, a judge striking down a zombie law on moral/constitutional grounds isn't acting outside the positivist framework; they are following the ultimate rule of the system.

  ### 4. The "Third Man" in the Debate: Ronald Dworkin.
  If you want to show your professor friend you really did your homework, mention **Ronald Dworkin**. He spent the 1970s and 80s attacking Hart's position, arguing that law isn't just rules (Hart) or procedures (Fuller), but includes **principles**.

  Dworkin argued that when rules run out, judges don't just use discretion; they look for the moral principles that best justify the existing legal system. He believed there is often a "right answer" in hard cases derived from the moral coherence of the law.

  **For your piece:** Dworkin's view helps explain why "zombie laws" feel so offensive to lawyers. It's not just that they are unjust; it's that they make the legal system incoherent. They contradict the deeper principles of the system (like equality or privacy).

  ### The Practical Upshot for Your Story
  If you stick to the "Hart won, judges must enforce bad laws" narrative, your story becomes: *These laws are valid, and we have to wait for politicians to fix them.* That's a bit dry.

  If you use the nuanced view, your story becomes: *These laws remain "valid" in a positivist sense, but their existence corrodes the "inner morality" of the legal system (Fuller) by creating a gap between declared rules and official action. Furthermore, because our Constitution incorporates moral principles, judges have the legal authority (not just moral license) to declare them dead, even if the text remains.*

  **Summary:** Hart won the definition of law (it's a social fact), but Fuller won the conversation about legitimacy (law must function morally to command respect). Zombie laws are the perfect battleground for that lingering tension. They are legally valid (Hart) but systemically corrosive (Fuller).

  That's why the debate is still taught. It's not settled; it's just the water we swim in.
