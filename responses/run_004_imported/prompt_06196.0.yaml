answer: |-
  This is a classic and vibrant debate in the philosophy of biology, and your reading group has hit on the precise tension that has animated the field since 1979. You have interpreted Gould and Lewontin (G&L) charitably and accurately regarding their diagnosis of the problem. However, your proposed remedy (the heuristic) and your group member's objection both contain truths that need to be synthesized to arrive at a robust methodological rule.

  Here is an analysis to help settle the dispute, followed by a sharpened set of criteria you can apply to evolutionary psychology (EP) literature.

  ### Part 1: Settling the Dispute

  **The Core Question:** Should the methodological default be *non-adaptation* (User's view), or is that simply a reverse dogma (Member's view)?

  **1. Where the Member is Right (The Risk of "Reverse Panglossianism")**
  Your group member's objection is philosophically sound. If you establish a rule that says, "Assume trait $T$ is a spandrel unless proven otherwise," you risk creating an **Anti-Panglossian Paradigm**.
  *   **Unfalsifiability:** Just as it is easy to invent a selection story for any trait, it is often easy to invent a constraint or drift story. If the default is "non-adaptive," an adaptationist could argue you are ignoring evidence of function just as stubbornly as they ignored evidence of constraints.
  *   **The Null Hypothesis Problem:** In statistics, a null hypothesis should be testable. "This trait is not an adaptation" is a disjunction of many different possibilities (drift, constraint, pleiotropy, phylogenetic inertia). It is methodologically difficult to test against a specific adaptationist hypothesis if the null is a "catch-all" of non-adaptive processes.
  *   **Gould's Actual Stance:** G&L did not argue that *most* traits are spandrels. They argued that biologists were *assuming* adaptation without testing alternatives. They advocated for **pluralism**, not a reversal of the axiom.

  **2. Where You are Right (The Burden of Proof)**
  However, your intuition regarding the *sociology* and *practice* of science is correct.
  *   **Asymmetry of Error:** In the late 70s (and often still in EP), the cost of a False Positive (accepting an adaptationist story that is wrong) was much higher than the cost of a False Negative (missing an adaptation). A False Positive leads to reified "just-so stories" that constrain future research. A False Negative simply leaves a trait unexplained until better data arrives.
  *   **Inference to the Best Explanation:** Adaptation is a specific, historical causal claim (Natural Selection acted on variant $V$ because of fitness benefit $B$). Claims of specific causation generally require positive evidence. Absence of evidence for selection is not evidence of absence, but *absence of evidence for selection is insufficient to assert selection.*

  **3. The Synthesis: Methodological Skepticism, not Ontological Default**
  The dispute is best settled by distinguishing between an **ontological default** (what we believe is true before looking) and an **evidentiary burden** (what is required to make a claim stick).

  *   **Your Heuristic (Too Strong):** "Assume the trait is a non-adaptive byproduct." (This risks the member's objection).
  *   **Member's Objection (Too Symmetrical):** "Both defaults are equally dogmatic." (This ignores the historical bias toward adaptationism).
  *   **The Corrected Rule:** "Treat adaptation as a **hypothesis to be demonstrated**, not a **premise to be assumed**."

  You do not need to assume the trait *is* a spandrel. You simply need to refuse to accept the label "adaptation" until the adaptationist has ruled out the spandrel/constraint/drift alternatives. This shifts the **burden of proof** without necessarily inverting the **presumption of truth**.

  ### Part 2: Sharpening the Heuristic for Evolutionary Psychology

  Evolutionary Psychology is the modern battlefield for this debate because behavioral traits leave no fossils, making "just-so stories" particularly hard to falsify. To make G&L's critique operational, you need a checklist that moves beyond "Is this story plausible?" to "Is this story evidenced?"

  Here is a sharpened methodological rule set you can bring to your group, based on G&L's critique and subsequent refinements by philosophers like Elisabeth Lloyd, Peter Godfrey-Smith, and the earlier work of George Williams.

  #### The "Spandrel-Sensitive" Evaluation Checklist

  When encountering an EP claim that Trait $X$ is an adaptation for Function $Y$, ask the following four questions. If the author cannot answer them, the claim remains a "just-so story."

  **1. The Design Specification Criterion (Complexity & Specificity)**
  *   **The Question:** Does the trait show evidence of "design" specifically for Function $Y$, or is it a general-purpose mechanism that *can* do $Y$?
  *   **The G&L Logic:** Adaptations usually exhibit complexity and specificity relative to their function (e.g., the eye for seeing). If the trait is a general cognitive bias that happens to solve a modern problem, it may be a byproduct of a different adaptation.
  *   **Application:** If an EP theorist claims "religion is an adaptation for group cohesion," ask: Is there a specific "religious module" in the brain? Or is religion a byproduct of hyper-active agency detection (a byproduct of a predator-avoidance adaptation)?

  **2. The Phylogenetic/Comparative Criterion**
  *   **The Question:** Is the trait present in ancestral species or close relatives where Function $Y$ was not relevant?
  *   **The G&L Logic:** If the trait exists in a lineage where the proposed selective pressure did not exist, the trait cannot be an adaptation *for* that pressure. It might be an exaptation (co-opted later) or a spandrel.
  *   **Application:** If a trait is claimed to be an adaptation for "stock market trading," but the cognitive underpinnings are found in primates who do not trade, the *trading* behavior is not the adaptation; the underlying cognition is, and trading is a byproduct/exaptation.

  **3. The Developmental Constraint Criterion**
  *   **The Question:** Could this trait arise inevitably from the development of another, clearly adaptive trait?
  *   **The G&L Logic:** This is the core "Spandrel" argument. Organisms are integrated wholes. Changing one part (an adaptation) often necessitates changes in others (byproducts).
  *   **Application:** In EP, many "adaptive" behaviors are correlated with brain size or metabolic rates. If the behavior scales perfectly with brain size across species, it might be a byproduct of encephalization rather than a specific adaptation for that behavior.

  **4. The Cost-Benefit/Genetic Variance Criterion**
  *   **The Question:** Is there evidence of heritable variation and fitness cost?
  *   **The G&L Logic:** Natural selection requires heritable variation. If a trait is universally fixed with no genetic variance, it is hard to study as a current adaptation (though it could be a past one). Furthermore, adaptations usually incur costs; if a trait is "free," selection might not be needed to explain it.
  *   **Application:** Many EP claims rely on universal human nature. Ask: Where is the evidence of genetic variance for this psychological trait? If it's purely cultural or developmental plasticity, "natural selection" is the wrong explanatory framework entirely.

  ### Summary for Your Reading Group

  To resolve your dispute, you might propose this compromise to the group:

  > "Gould and Lewontin do not license a **presumption of non-adaptation** (which would be a reverse dogma), but they do license a **presumption of skepticism**. The methodological rule is not 'Assume it is a spandrel,' but rather 'Adaptation is a specific historical claim that requires positive evidence.' In the absence of evidence ruling out constraints, drift, or byproducts, the adaptationist claim remains unproven, regardless of how plausible the narrative sounds."

  This validates your insistence on rigor (the burden of proof lies with the adaptationist) while validating your member's concern that we should not dogmatically assume nothing is adaptive. It turns the "Spandrel" concept from a rival ontology into a **methodological check** against narrative fallacy.

  **Recommended Secondary Reading for the Group:**
  *   **Elisabeth Lloyd, *The Case of the Female Orgasm* (2005):** A masterclass in applying G&L's critique to EP. She evaluates 21 adaptationist hypotheses for the female orgasm and finds most fail the evidentiary burden.
  *   **Peter Godfrey-Smith, "Adaptationism and the Power of Selection" (1999):** Distinguishes between "empirical adaptationism" (most traits are adaptations) and "methodological adaptationism" (act as if they are to find the truth), arguing G&L attacked the former but the latter can be useful if constrained.
  *   **George Williams, *Adaptation and Natural Selection* (1966):** The precursor to G&L. He established the burden of proof argument that G&L radicalized.
