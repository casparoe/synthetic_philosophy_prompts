prompt: |-
  For a philosophy of biology reading group, I have been working through Stephen Jay Gould and Richard Lewontin's 1979 paper on the "adaptationist programme," along with some of the secondary literature on their spandrels-of-San-Marco analogy. As I understand their central argument, evolutionary biologists have a habit of decomposing an organism into a list of discrete traits and then inventing a plausible-sounding selective story for each one in isolation, without seriously testing that story against alternatives such as developmental constraint, pleiotropy, or drift, and without asking whether the trait might simply be a structural byproduct, or "spandrel," of selection acting on something else entirely, regardless of how useful the trait might look today. Since these adaptationist narratives are so easy to construct after the fact and so rarely subjected to real falsification, it seems to me that Gould and Lewontin's critique licenses a fairly strong methodological rule: for any given trait, especially in a field like evolutionary psychology, the responsible default assumption should be that the trait is a non-adaptive byproduct, with the burden of proof falling entirely on whoever wants to claim it is a genuine adaptation shaped by natural selection for its current use.

  When I proposed this as a general heuristic to my reading group, for sorting credible adaptationist claims from mere "just-so stories," one member objected that this simply inverts the Panglossian error Gould and Lewontin were diagnosing, trading one unfalsifiable default for another. That objection strikes me as too quick, since the whole point of their critique was that biologists had been helping themselves to selection as an explanation without evidence, and correcting that bias by shifting the default toward non-adaptation seems like the natural remedy rather than a symmetrical mistake of its own. Could you help settle this dispute for us, and, assuming my heuristic holds up, help me sharpen it into a rule I could actually apply when I encounter adaptationist claims in the evolutionary psychology literature?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of biology reading group.
      *   **Core Text:** Gould & Lewontin's "The Spandrels of San Marco and the Panglossian Paradigm" (1979).
      *   **User's Interpretation:** Adaptationists invent plausible stories for traits without testing alternatives (constraints, drift, spandrels). Therefore, the methodological rule should be: *Default assumption = non-adaptive byproduct; Burden of proof = on the adaptationist.*
      *   **The Conflict:** A reading group member objected that this just inverts the Panglossian error (trading one unfalsifiable default for another).
      *   **User's Stance:** The objection is too quick; shifting the default corrects the bias.
      *   **Task:** Settle the dispute (evaluate the heuristic) and, if it holds up, sharpen it into a practical rule for evolutionary psychology (EP).

  2.  **Evaluate the User's Heuristic (The "Null Hypothesis" Debate):**
      *   *Gould & Lewontin's Actual Position:* Did they argue for a *default* of non-adaptation? Or did they argue for *pluralism* and rigorous testing?
      *   *Historical Context:* The "Adaptationism Wars." Williams (1966) argued for parsimony in adaptationism (don't assume group selection, assume individual selection). Gould & Lewontin pushed back against assuming *any* trait is an adaptation without evidence.
      *   *The Member's Objection:* Is shifting the default to "non-adaptive" just another dogma?
          *   *Argument for the Member:* If you assume everything is a spandrel, you might miss real adaptations. It creates a bias against finding function.
          *   *Argument for the User:* The field was heavily biased *toward* adaptation. A corrective swing is needed to force rigor.
      *   *Philosophical Consensus:* Most philosophers of biology (e.g., Godfrey-Smith, Sober, Lloyd) argue that neither "everything is an adaptation" nor "nothing is an adaptation" is correct. The key is *evidence*. However, regarding the *null hypothesis*, there is debate.
      *   *Key Distinction:* Is "non-adaptation" a single hypothesis? No. It's a disjunction (drift, constraint, spandrel, exaptation). Making a disjunction the null can be statistically/methodologically tricky.
      *   *Gould's Later Views:* Gould often emphasized that adaptation is a *pattern* to be demonstrated, not a *premise* to be assumed. But he didn't necessarily say "assume it's a spandrel." He said "consider spandrels as a serious alternative."
      *   *Conclusion on the Dispute:* The user's heuristic is *too strong* as stated ("default assumption should be... non-adaptive"). It risks becoming the "Anti-Panglossian Paradigm." The member has a point about symmetry, but the *contextual* asymmetry (the field was biased) matters. The best resolution is not a default assumption of *non-adaptation*, but a requirement for *evidence of adaptation* before accepting an adaptationist claim. It's about the *burden of proof*, not necessarily the *ontological default*.

  3.  **Refining the Heuristic for Evolutionary Psychology (EP):**
      *   EP is notorious for "just-so stories" (a term Gould popularized, though Kipling coined it).
      *   How to apply G&L's critique without falling into "nothing is adaptive" nihilism?
      *   *Criteria for Adaptation:* What counts as evidence? (Complexity, specificity, efficiency, comparative data, genetic heritability, cost-benefit analysis).
      *   *Criteria for Spandrels/Byproducts:* Correlation with other traits, developmental inevitability, lack of genetic specificity.
      *   *Practical Rule:* Instead of "Assume Non-Adaptive," use "Require Positive Evidence for Adaptation." This sounds similar but is methodologically distinct. It shifts the burden of proof without asserting the opposite truth value as the starting axiom.

  4.  **Drafting the Response:**

      *   **Acknowledge and Validate:** Start by validating the user's close reading of G&L. They captured the spirit of the critique well.
      *   **Address the Dispute (The Core Philosophical Issue):**
          *   The member's objection has merit *in principle* (dogmatism is bad), but the user is right *in practice* (correcting bias).
          *   However, the user's formulation ("default assumption... non-adaptive") is slightly off from G&L's actual methodological recommendation. G&L argued for *pluralism*, not a reverse dogma.
          *   *Key Concept:* The Null Hypothesis. In statistics, the null is usually "no effect." In evolution, is "no selection" the null? Williams (1966) said treat adaptation as a hypothesis, not a premise. G&L amplified this.
          *   *Resolution:* The heuristic shouldn't be "Assume it's a spandrel." It should be "Do not accept 'adaptation' until alternatives are ruled out." This is a subtle but crucial difference. It's about *inference to the best explanation*, not a预设 (presupposition).
      *   **Sharpening the Rule for Evolutionary Psychology:**
          *   EP often relies on "reverse engineering" (look at the trait, guess the problem). G&L hate this.
          *   Need concrete criteria.
          *   *Suggested Framework:* Adaptationist claims need to meet specific evidentiary burdens (e.g., Williams' criteria, or more modern phylogenetic comparative methods).
          *   *Checklist:*
              1.  Variation & Heritability.
              2.  Fitness Consequence (past).
              3.  Ruling out constraints/drift.
              4.  Specificity/Complexity (design arguments).
      *   **Nuance on "Spandrels":** Remind the user that "spandrel" is often misunderstood. It's not just "useless." It's "non-selected origin, potentially co-opted later (exaptation)."
      *   **Conclusion:** The member is right that a reverse dogma is bad, but the user is right that the burden of proof lies with the adaptationist. The compromise is a *methodological skepticism* rather than an *ontological presumption*.

  5.  **Refining the Tone:**
      *   Academic, respectful, philosophical but practical.
      *   Avoid taking sides too aggressively; show how both have points but the synthesis is better.
      *   Cite relevant secondary literature (Sober, Godfrey-Smith, Williams) to bolster the reading group discussion.

  6.  **Self-Correction/Review during drafting:**
