      *   *Is the user's heuristic falsifiable?* If the default is "non-adaptive," how do you prove adaptation? You need positive evidence. So the heuristic effectively functions as "Require positive evidence."
      *   *The Member's Point:* If I assume "non-adaptive," am I just telling a "just-so story" about drift? Yes, potentially. Drift stories can be just as unfalsifiable as selection stories if not modeled correctly. This is a strong point for the member. I must highlight this.
      *   *Final Verdict:* The user's heuristic is a good *corrective stance* but a bad *formal rule*. The rule should be about *evidentiary standards*, not *default truth values*.

  7.  **Final Polish:** Structure into "Settling the Dispute" and "Sharpening the Heuristic." Ensure the distinction between "Null Hypothesis" and "Burden of Proof" is clear. (Proceed to generate output).

  *(Self-Correction Note: Make sure to mention that Evolutionary Psychology is a specific target of this critique because it deals with behavior which is plastic and hard to fossilize, making "just-so stories" easier to construct.)*

  8.  **Final Output Structure:**
      *   Introduction: Validate the reading.
      *   Part 1: Settling the Dispute (Nuancing the "Default").
