          *   Does this apply to mind? If I raise my hand because I *want* to, the micro-neural state is sufficient. But the *want* captures the relevant generalization.
          *   *Why does Kim resist this for mind?* Because mental properties seem to require a specific *ontological* status that isn't just "useful description."
      *   **The "Special Feature" of Mind:** The only real candidate for a disanalogy is **Normativity/Intentionality** or **Qualia**. Temperature doesn't feel like anything. Temperature doesn't represent the world. If the mental is purely functional (like temperature), Kim's argument *should* fail there too. If the mental includes non-functional qualia, *that* is the wedge. Kim thinks qualia can't be functionalized, hence they can't be reduced, hence they are excluded.

