          *   *The Real Wedge:* **Qualia/Intrinsic Nature.** Temperature has no intrinsic "feel." If mental properties are just functional roles (like temperature), they survive exclusion (Functionalism). But Kim argues mental properties (specifically qualia) resist functionalization. *That* is the disanalogy. Temperature is exhaustively functional/structural. Mind (allegedly) is not.
      *   *Section 4: The "Proportionality" Counter-Argument.* Mention Yablo/Menzies. The micro-cause is *too specific*. The macro-cause is the *right* cause. This saves temperature. Why not mind? Kim rejects this because he thinks it violates closure.
      *   *Conclusion:* The argument proves too much *unless* you accept that mental properties have a non-functional component (qualia) that temperature lacks. If you are a functionalist about mind (like a physicist is about temperature), Kim's argument fails for both. If you are a qualia-realist, Kim's argument holds for mind but not temperature.

