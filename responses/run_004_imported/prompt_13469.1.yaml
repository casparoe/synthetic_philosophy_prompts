      *   *Section 2: The Physicist's Escape Hatch (Reduction vs. Supervenience).* In physics, we often accept *reduction* (in the limit) or *Effective Field Theory* autonomy. We don't treat $T$ as a separate substance. Kim forces a dichotomy: Identity or Epiphenomenalism. Physics offers a third: **Emergence as Autonomy**.
      *   *Section 3: Where Kim thinks the Mind is Different.*
