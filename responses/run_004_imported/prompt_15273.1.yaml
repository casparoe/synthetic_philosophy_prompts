answer: |-
  The aperture hummed, a sound like a finger running around the rim of a crystal glass. Elias adjusted the dials, calibrating the resonance to the frequency of his own biography. He wasn't looking for a stranger. He was looking for the ghost of the decision he hadn't made.

  On the screen, the image stabilized. It was a kitchen, sunlit and cluttered. A man stood at the sink, washing a single coffee mug. He wore a sweater Elias owned but hadn't worn in years. He turned, and Elias saw his own face, lined with a different kind of tiredness.

  This was the divergence point: the train station, five years ago. Elias had boarded the train to the city. The man on the screen had stayed.

  Elias leaned forward, his breath catching. He didn't feel like an observer watching a simulation. He felt a phantom ache in his left shoulder, a specific stiffness the man on screen was rubbing as he dried the mug. When the man sighed, Elias's chest tightened.

  "It's not you," the machine's interface prompted, text scrolling silently across the bottom. *Subject is a distinct entity sharing causal history up to t-minus-five years. Similarity index: 98%.*

  Elias ignored the text. It was him. The logic of the machine was cold, treating identity like a barcode that snapped the moment their paths differed. But Elias felt the continuity. He remembered the weight of the suitcase in his hand at the station, but he also remembered the warmth of the hand he had let go of. Those memories weren't data; they were flesh. If that man was happy, Elias should feel relief. If that man was suffering, Elias should feel guilt. To say otherwise was to say that Elias's own potential fate didn't matter to him, only the fate of a stranger who looked like him.

  The man on screen walked into the living room. A woman sat there, reading. She looked up and smiled. Elias felt a surge of affection so sharp it brought tears to his eyes. He knew that smile. He knew the way the light hit the dust motes around her. This was his life, unspent.

  He reached out to touch the screen. The glass was cold.

  "Stabilizing," the machine chimed. "Resonance fluctuating. Multiple matches detected."

  The image shimmered. The kitchen dissolved into static, then reformed. It was the same kitchen, same sunlight. The man was there, wearing the same sweater. But this time, he wasn't washing a mug. He was packing a box. The woman was crying in the background.

  Elias frowned. "Wait. Reset. That's not the same timeline."

  *Divergence point identical,* the machine replied. *Temporal coordinate: Five years ago, Platform 4. Outcome variance: High.*

  "But he stayed," Elias said. "In the first one, he stayed. In this one, he stayed."

  *Both subjects remained at the origin point. Both subjects diverged from your current trajectory at the exact same nanosecond.*

  The screen split. On the left, the man laughed with the woman. On the right, the man zipped the box, alone.

  Elias stepped back, his heart hammering against his ribs. This was impossible. If the man on the screen was literally him—just situated differently—how could he be two people at once? He couldn't be both the husband who stayed and loved, and the husband who stayed and failed. Identity was singular. You were one thing.

  "Choose a primary subject," the machine instructed. *Similarity metrics are equivalent. Both share equal causal weight to your current state.*

  "No," Elias said. "Merge them. There's an error."

  *No error. Modal spread is inherent to the decision node. The choice to stay was not a single path. It was a branching of possibilities even within the stay.*

  Elias looked at the two men. They were both him. They both had his memories up to the moment of the train. They both had his face. But they were mutually exclusive. If the one on the left was Elias, then the one on the right was a lie. If the one on the right was Elias, the left was a fabrication.

  The machine's logic suggested neither was him. They were just echoes, reflections in a broken mirror. If that were true, Elias should feel nothing. He should be safe in his own skin, untouched by their joy or their grief. That was the comfort of distance: *That is not me. I am here.*

  But Elias felt the grief of the man on the right tearing at his throat. He felt the joy of the man on the left lighting up his nerves. To deny them was to deny parts of his own soul. To accept them was to admit he was fragmented, that "Elias" was not a single point but a cloud of probabilities.

  He looked at the man on the right, the one packing the box. The man looked up, staring directly into the camera, into the aperture, into Elias's eyes. For a second, the barrier thinned. The man's expression wasn't confusion; it was recognition. He knew Elias was there. He knew Elias had left.

  *Select primary,* the machine urged. *Resource allocation critical.*

  Elias realized what the machine was asking. It was asking him to decide which version of himself deserved to be real. If he chose the left, the right became mere fiction, a story that didn't happen. If he chose neither, both became strangers.

  He thought about the Humphrey objection, though he didn't know the name for it. He thought about how it didn't matter if someone else won the prize; he wanted to know if *he* could have. But here, *he* had. Both of them had. And neither had.

  "I'm not choosing," Elias whispered.

  *Input required.*

  "They're both me," Elias said. His voice shook. "You want me to say one is a copy. You want me to say I'm only the one who left."

  *You are the subject at this console. They are projections.*

  "No." Elias slammed his hand on the console, not to shut it off, but to lock the feed. "If I'm only here, then nothing matters. Then what I lost doesn't exist. But it hurts. It hurts because it's real."

  He looked at the split screen. The indeterminacy was terrifying. It meant he wasn't a solid thing. He was a verb, not a noun. He was the act of choosing, constantly shedding skins that kept walking around without him.

  The man on the right finished packing. He picked up the box and walked out of the frame. The man on the left put his arm around the woman. They both turned off their lights.

  Elias stood in the dark of his lab, the glow of the screens the only illumination. He could shut it down. He could go back to believing he was a single, solid line drawn through time. He could decide that these were just pictures of other people, people who happened to look like him, whose pain was none of his business.

  It would be easier. It would be safer. If they were just counterparts, he was free. He didn't have to carry the weight of the life he didn't live.

  But as the screens dimmed, Elias pressed his hand to his chest, feeling the dual ache of a marriage saved and a marriage lost. He couldn't sever the connection. He couldn't reduce himself to a single coordinate.

  "Save the file," Elias said. "Save both."

  *Storage capacity exceeded. Redundancy detected.*

  "Save it," he insisted. "I need to know."

  He turned away from the console. He walked out of the lab into the night, carrying the weight of two other lives that were somehow his own. He was one man walking down the hall, but he felt like a crowd. He knew he would never be whole again, not in the way the machine wanted him to be. He was everywhere he hadn't gone, and he was responsible for all of it. The door closed behind him, but he left it unlocked, just in case any of the others wanted to come home.
