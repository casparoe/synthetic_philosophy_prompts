answer: |-
  "You're selling a unity that isn't there, Renata. It's a placeholder. A variable waiting for a value."

  "It's a primitive, Dov. Not a variable. There is a difference."

  "There's no difference if the variable never gets solved. You write 'Grounding' with a capital G on the board, and what do you mean? You mean composition? You mean set-membership? You mean functional realization?"

  "I mean the 'in virtue of' relation that underlies all of them. The structural feature of reality that makes the non-fundamental obtain in virtue of the fundamental."

  "See? 'Structural feature.' It's hollow. That's the small-g objection. You've got a pile of perfectly respectable relations here. Composition does work. Set-membership does work. But when you bundle them into Big-G, you aren't adding explanatory power. You're subtracting precision. You're telling me there's one engine driving the car, but all I see are wheels turning at different speeds."

  "The wheels turn together because they're axle-linked. If you deny the unified relation, you lose the hierarchy. You get a flat world."

  "I'll take a flat world over a magical one. Here's the problem, and you know it. Theoretic work. What work is Big-G doing that the specific relations aren't already doing? If I want to know how a statue is grounded in the clay, I look at composition. If I want to know how a singleton is grounded in its member, I look at set theory. If I say 'The statue is Big-G rounded in the clay,' I haven't told you anything except that I'm too lazy to pick a mechanism."

  "It's not about mechanism. It's about metaphysical explanation. The specific relations are the *how*, but Grounding is the *because*. You need the general relation to make sense of the distinction between the fundamental and the derivative."

  "I need nothing of the sort. I need the specific relations. And I need them to obey their own logics. Which brings me to the transitivity worry. You want Big-G to be transitive. A grounds B, B grounds C, therefore A grounds C."

  "Obviously."

  "Obviously? Let's chain them. Let A be the atoms. Let B be the clay. Let C be the statue. Atoms compose clay. Clay constitutes statue. So, atoms ground statue? Fine. But now swap in mental states. Physical state P realizes mental state M. But P is grounded in microphysical particles µ. So µ grounds M? Your Big-G says yes, because it's one relation. But realization and composition don't share a logic. You're smuggling validity across boundaries where no inference is licensed. You're building a bridge out of mismatched planks and calling it 'unity'."

  "You're assuming the relations are disjoint. They aren't. They're determinates of the same determinable."

  "That's just more jargon for 'I'm ignoring the differences.' If Big-G is primitive, it's unanalyzable. If it's unanalyzable, you can't check the logic of the chain. You just assert transitivity by fiat. That's not metaphysics, Renata. That's dogma. You want the prestige of a unified theory without the cost of showing the connections hold."

  "And you want to fragment reality into a checklist because you're afraid of system. If there is no unified grounding relation, then there is no single sense in which the derivative depends on the fundamental. There's just a heap of connections. No structure. No layers."

  "There are layers! Just not one mortar holding the bricks together. There's mortar, there's steel, there's gravity. You're trying to sell me 'Building' as a fourth material. It doesn't exist. And because it doesn't exist, you can't use it to carry weight. You can't run a transitivity proof on a word."

  "I can run it on the structure of dependence. If dependence is real, it has a logic. If you deny the logic, you deny the dependence."

  "I deny *your* logic. I deny that the dependence of a set on its members behaves like the dependence of a disposition on its categorical basis. They look alike in English. 'The set exists in virtue of the members.' 'The disposition exists in virtue of the basis.' But put them in a chain and the inference dies. Your Big-G swallows the contradiction and calls it 'primitive.' I call it a bug."

  "Then you have no account of metaphysical explanation. You have only science and logic."

  "I have everything that exists. You have a ghost."

  "The ghost is the hierarchy, Dov. Without it, you're just doing physics with extra steps."

  "Better extra steps than a wrong turn. You're building a cathedral on a swamp. It looks beautiful from the pulpit, but the foundation is just a word."

  "And you're living in the mud."

  "At least I know what I'm standing on."
