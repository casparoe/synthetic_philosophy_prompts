  7.  **Final Polish:** (Mental check of the "Unnamed Stake" section). The core is that Death in Damascus is often presented as a *causal* problem (Death is already there), but the Engineer treats it as a *logical* problem (Death predicts the algorithm). This is the crux. The Philosopher treats the prediction as a fixed past fact (CDT friendly). The Engineer treats it as a logical dependency (FDT friendly).

