  I've been reading Kierkegaard's Present Age essay and it seems like his idea of 'the public' is basically just an early version of crowd psychology, like Le Bon's theory where people get swept up and loose their individual reason once they're absorbed into a crowd. If that's right, I don't get why he pins most of the blame on the press instead of on the crowd itself -- isn't the press just reporting on a mob mentality that's already there? Feels like he's attacking the messenger.
