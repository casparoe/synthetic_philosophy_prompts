          1.  To prove $\neg P$, assume $P$ and derive $\bot$ (absurdity). This is valid intuitionistically ($\neg P$ is *defined* as $P \to \bot$).
          2.  To prove $P$, assume $\neg P$ and derive $\bot$. This implies $\neg\neg P$, which classically gives $P$, but intuitionistically does *not*.
      *   *Euclid's Proof:* The standard textbook version often says "Assume there are finitely many primes... contradiction... therefore there are infinitely many." This *looks* like Form 2. However, the actual construction is "Given any finite list, here is a new prime." This is Form 1 (proving negation of finiteness) or a direct construction.
      *   *Constructivist Stance:* Constructivists accept Euclid's proof. In fact, they often prefer it because it's algorithmic.

