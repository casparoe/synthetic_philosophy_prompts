      The classic WKR example is the Evil Demon. To make it a joke, we need to bring the Evil Demon into a mundane conversation where the distinction matters absurdly.

      *Final Concept:* A philosopher is being mugged. The mugger threatens violence (Wrong Kind reason to hand over wallet). The philosopher objects on meta-ethical grounds.

