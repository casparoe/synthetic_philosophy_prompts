answer: |-
  A meta-ethicist is cornered in a dark alley by a mugger holding a gun.

  **Mugger:** "Tell me I'm admirable."

  **Ethicist:** "I can't. Admiration is a pro-attitude that requires fittingness. You possess no admirable qualities."

  **Mugger:** "I possess a gun. That gives you a reason to admire me."

  **Ethicist:** "It gives me a pragmatic reason to *express* admiration. But that's the Wrong Kind of reason. It doesn't make you *admirable*."

  **Mugger:** "Wait, I thought you buck-passers said for something to be good just *is* for there to be reasons to have a pro-attitude toward it. I gave you a reason. So, by your own lights, I'm good."

  **Ethicist:** "No! Only the *Right* Kind of reasons count!"

  **Mugger:** "Okay, what makes a reason the Right Kind?"

  **Ethicist:** "It must be a reason that stems from the object's value."

  **Mugger:** "So you need 'value' to define which reasons count, but you said 'value' is just having the right reasons?"

  **Ethicist:** "Well, when you put it that crudely..."

  **Mugger:** "Sounds like you're begging the question. Now hand over the wallet."

  **Ethicist:** "But taking it is wrong!"

  **Mugger:** "I have a reason to take it. You have a reason to let me. By your analysis, this transaction is practically good."

  **Ethicist:** "It's the Wrong Kind!"

  **Mugger:** "Look, I'm an Evil Demon with a Glock. I don't care about fittingness. I care about the buck. And right now, you're passing it."
