          *   *Wait, one more thought:* The prompt asks me to pick a side on coherence. I'll argue that **it does not survive as a strictly coherent metaphysical system**, but it *can* survive as a narrative device if tweaked. I need to be decisive. I'll say **the Objection wins.** It's the more intellectually honest position for a "hard" system. Relying on ungrounded truths is a deus ex machina.

