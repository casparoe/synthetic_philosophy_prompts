answer: |-
  The debate between the etiological (selected-effects) and causal-role accounts of biological function is one of the most enduring in the philosophy of biology. To evaluate them, we must look at how well they track our scientific intuitions and explanatory needs in specific contexts. Below, I analyze the three test cases you provided, offering a verdict for each, before concluding with an overall assessment of the rivalry.

  ### 1. Malfunction: The Defective Heart
  **The Case:** A heart with a congenital defect that has never pumped blood adequately.
  **The Verdict:** The **Etiological (SE)** account gives the more defensible verdict.

  **Analysis:**
  Our intuition is strong here: we want to say this heart *has the function* of pumping blood, even though it fails to do so. The SE account captures this perfectly. On the SE view, function is tied to the history of the *trait type*, not the performance of the *trait token*. Because ancestral hearts pumped blood and were selected for doing so, the trait type "heart" has the function of pumping blood. The defective token is a malfunctioning instance of a functional type. This preserves the **normativity** essential to biological discourse—the distinction between what a trait *does* and what it *ought* to do.

  The Causal-Role (CR) account struggles here. Cummins defines function as a causal contribution to a containing system's capacity. If this specific heart *never* pumps blood, it makes no causal contribution to circulation in this specific organism. To save the verdict, a CR theorist must appeal to an idealized model or the "standard" design of the system, effectively importing the normative history they claim to avoid. Without that historical import, the CR account is forced to say the heart has no function (since it contributes nothing) or that its function is whatever it *does* do (e.g., take up space), which contradicts the biological intuition that it is a *broken pump*.

  ### 2. Co-opted Traits: Exaptation and Vestiges
  **The Case:** Feathers (insulation $\rightarrow$ flight) and Whale Pelvises (walking $\rightarrow$ vestige or sexual selection).
  **The Verdict:** The **Etiological (SE)** account is superior for evolutionary explanation, though CR has descriptive utility.

  **Analysis:**
  This case highlights the difference between *current utility* and *evolutionary function*.
  *   **Feathers:** The SE account handles exaptation well by tracking the shift in selection pressures. Initially, the function was insulation; later, the function became flight. The CR account simply notes the current contribution. While both agree on the current state, SE explains *why* the trait is present in its current form (the history of selection), whereas CR only describes its current mechanical role.
  *   **Whale Pelvises:** This is the sharper test. If the pelvis is a true vestige (maintained by drift, not selection), the SE account says it has **no biological function**. It is an evolutionary leftover. The CR account, however, might say it has a function if it anchors muscle, regardless of selection.

  The SE verdict is more defensible in an evolutionary context. Biologists distinguish sharply between "adaptive traits" and "vestigial traits." Calling a vestigial structure "functional" simply because it currently does *something* blurs this critical distinction. If the whale pelvis is not maintained by selection, calling it "functional" obscures its evolutionary status. However, if new research shows it *is* maintained by sexual selection (as the prompt notes some argue), SE immediately updates to assign it that function. SE is more precise because it ties function to the *reason for presence*, whereas CR ties it to *current effect*, potentially mislabeling evolutionary noise as functional signal.

  ### 3. The Liberality Problem: The Thumping Heart
  **The Case:** Is producing a thumping sound a function of the heart?
  **The Verdict:** The **Etiological (SE)** account gives the more defensible verdict.

  **Analysis:**
  The CR account faces the "liberality" or "promiscuity" problem. Any trait has infinite causal effects. The heart pumps blood, secretes hormones, takes up space, and makes a sound. On a strict CR reading, if we can construct an analysis of the body that includes acoustic diagnosis, the sound is a function. While Cummins argues we restrict functions to the capacities we want to *explain*, this restriction seems ad hoc. Why do we want to explain circulation but not acoustics? Usually, because circulation is why the heart was selected.

  The SE account solves this naturally. The thumping sound did not explain the heart's selection and maintenance in the population. Therefore, it is a **byproduct** (or spandrel), not a function. The SE account builds the filter directly into the definition of function, aligning with the biological intuition that functions are "beneficial effects that explain presence," whereas side effects are merely "consequences." The CR account requires extra theoretical work to rule out the sound; the SE account rules it out by definition.

  ### Overall Assessment: Dissolution via Pluralism

  Having worked through the cases, the Etiological account appears to win on all three counts regarding the specific label of *"biological function."* It handles normativity (malfunction), evolutionary precision (vestiges), and byproduct filtering (liberality) better than the Causal-Role account.

  However, I defend the suggestion associated with **Peter Godfrey-Smith**: that the disagreement is best **dissolved** by recognizing that the two accounts are answering **different questions**.

  **Defense of the Dissolution View:**
  To declare the Etiological account "superior" outright is to ignore the legitimate explanatory role the Causal-Role account plays in science. The rivalry arises from a conflation of two distinct scientific projects:

  1.  **Evolutionary Biology (The "Why" Question):** When an evolutionary biologist asks, "What is the function of the thumb?", they are asking about adaptive history and selective maintenance. They want to know why the trait is here. Here, the **Etiological account is correct**. It captures the normativity and historical constraints essential to evolution. It explains why a defective heart is "broken" and why a vestigial pelvis is "functionless" in the adaptive sense.
  2.  **Physiology and Mechanism (The "How" Question):** When a physiologist asks, "What does the heart do?", they are analyzing the current capacities of the system. They want to know how the organism works *now*. Here, the **Causal-Role account is correct**. A physiologist studying a congenital defect needs to analyze the causal role of the defective heart to understand the system's failure, regardless of its history. Similarly, in synthetic biology or medicine, we often care about what a trait *can do* now, not just what it was selected for.

  **Conclusion:**
  The cases you presented pull the accounts apart because they test different intuitions. The malfunction and liberality cases test our intuitions about **normativity and selection** (where SE reigns). The co-option case tests our intuitions about **current utility** (where CR has descriptive power).

  Therefore, Godfrey-Smith is right. The accounts are not rivals competing for the single truth of "function"; they are complementary tools for different explanatory contexts. The Etiological account is the superior account of *Proper Biological Function* (explaining presence and normativity), while the Causal-Role account is the superior account of *Causal Capacity* (explaining mechanism and current operation). Recognizing this distinction dissolves the philosophical friction: we stop asking which theory is "true" and start asking which theory serves the specific explanatory goal at hand. In the strict sense of *biological function* as used in evolutionary theory, the Etiological account holds the throne, but the Causal-Role account remains indispensable for understanding the machinery of life.
