      *   *Idea 3: The "B-Partition" Problem.* When you learn $B$, $P(B|A)$ becomes 1. When you learn $\neg B$, it becomes 0. So the proposition $A > B$ must be true in all $B$-worlds and false in all $\neg B$-worlds (roughly). But if $A > B$ is a proposition, its truth shouldn't depend *solely* on $B$'s truth, it should depend on the connection between $A$ and $B$.
