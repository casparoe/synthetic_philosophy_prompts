prompt: |-
  Okay so I'm a linguistics PhD student (semantics/pragmatics side, working on conditionals) and I've been chewing on Lewis's 1976 triviality result for like a week now. It keeps coming up in the philosophy-of-language literature as basically THE reason people gave up trying to give indicative conditionals ordinary truth conditions, and I realized I can reproduce the proof on a whiteboard without actually having a gut feel for why it's true, which is bugging me.

  Here's where I'm at. The target is the Equation (Adams/Stalnaker's thesis), P(A>B) = P(B|A), and what makes Lewis's result actually bite is that he doesn't just assume it for one credence function P -- he needs it to keep holding for every function you get by conditionalizing P on stuff, since those conditionalized functions are presumably also rational credence functions and so should obey the Equation too. I can follow the mechanics fine: conditionalize on B and the Equation forces P(A>B) up to 1, conditionalize on ~B and it forces P(A>B) down to 0, run the law of total probability back on the original P and you get P(A>B) = P(B), and combining that with the Equation itself gives P(B|A) = P(B) for pretty much any A you pick, which is fatal once B is some ordinary contingent thing. What I dont actually have is the intuition for why closure under conditionalizing is doing so much of the damage. Is there a non-technical way of saying what's really being demanded of "A>B" that no garden-variety proposition could ever deliver? And is that the same reason Adams and Edgington basically gave up on conditionals expressing propositions at all, instead of, i dunno, just restricting the Equation to the agent's actual credence function rather than all of its conditionalizations?

  My advisor's answer to "why does this happen" was basically "you'll feel it eventually," which was not the pedagogical breakthrough she seemed to think it was. Can you give me the version of this that's supposed to click -- an analogy would help a ton -- and maybe say a word on whether this is a problem specific to conditionals or just a generic hazard that would hit any operator you demanded this much of?
