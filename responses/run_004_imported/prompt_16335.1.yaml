answer: |-
  Here is a breakdown of the philosophical landscape surrounding your character's experience, structured to help you draft the therapy scene with nuance. I have avoided pop-psychology terms in favor of the specific philosophical mechanics you requested.

  ### Part 1: The Phenomenon (Recalcitrant Emotion)

  To ground the debate, we first need to articulate the specific texture of the nurse's experience. In philosophy of emotion, this is called a **recalcitrant emotion**: an emotional state that persists in direct contradiction to the subject's sincere evaluative judgment.

  **The Vignette:**
  Imagine your nurse, let's call her Elena, is in a therapy session. The topic is the accident.
  *   **The Judgment:** Elena explicitly asserts: "I was not driving. I was asleep in the passenger seat. I had no control over the ice on the road. I am not responsible for my sister's death." She believes this. She can argue this. She has built a logical proof of her innocence.
  *   **The Emotion:** As she says this, her heart rate spikes. Her palms sweat. She feels a visceral urge to apologize to the therapist for taking up space. She feels a "staining" on her skin, a somatic sense of *wrongness* that locates itself in her chest.
  *   **The Conflict:** If you asked her, "Are you guilty?" she says "No." If you asked her body, "Is she guilty?" her physiology screams "Yes."

  This is the data point the theories must explain. Why does the feeling remain when the verdict has been overturned?

  ### Part 2: The Judgment Theory (The Problem)

  **The Theory:**
  Classical Cognitivism (associated with Robert Solomon or Martha Nussbaum) posits that emotions *are* (or essentially contain) evaluative judgments. To feel guilt *is* to judge that one has transgressed a moral norm. To feel fear *is* to judge that one is in danger. The emotion is not a separate sensation that accompanies the thought; the emotion is the thought itself, embodied.

  **The Problem for Elena:**
  If this theory is true, Elena is in a state of logical impossibility.
  1.  To feel guilt, she must judge "I have done wrong."
  2.  To be rational (and by her own account), she judges "I have not done wrong."
  3.  Therefore, she is simultaneously holding two contradictory beliefs.

  For a strict Judgment Theorist, Elena is either lying about her innocence (self-deception) or she is profoundly irrational in a way that threatens her agency. It pathologizes her grief as a failure of logic. It suggests that if she could just *think* correctly, the feeling would vanish instantly, because the feeling *is* the thinking. This feels untrue to the experience of trauma, where the body remembers what the mind has released.

  ### Part 3: The Perceptual Theory (The Solution)

  **The Theory:**
  Perceptual Theories (associated with Jesse Prinz or Christine Tappolet) argue that emotions are not judgments, but **perceptions of value**. Just as vision perceives color, emotion perceives "value properties" (danger, offensiveness, blameworthiness). Crucially, perceptions are **encapsulated**: they are not always under the control of our beliefs.

  **The Visual Illusion Analogy:**
  Consider the Müller-Lyer illusion: two lines of equal length, one with arrows pointing out, one with arrows pointing in.
  *   **Judgment:** You measure the lines. You know with 100% certainty they are the same length.
  *   **Perception:** They still *look* different lengths.
  *   **Result:** You do not say, "I believe these lines are different lengths." You say, "I know they are the same, but they *look* different."

  **Application to Elena:**
  The Perceptual Theorist says Elena's guilt is like the optical illusion.
  *   **Cognitive System:** "I am not guilty." (The measurement).
  *   **Emotional System:** "This situation looks like guilt." (The visual appearance).

  This handles the "stubbornness" gracefully. It explains why the feeling outlives the judgment. It validates Elena's experience without calling her irrational. She isn't contradicting herself; she is experiencing a lag between her cognitive appraisal and her affective perception. The "hot flush" is a sensory residue, a phantom limb of moral responsibility.

  ### Part 4: The Rejoinders (Keeping it Even-Handed)

  For your scene to be intellectually honest, the therapist (or Elena's internal monologue) should recognize that the Perceptual Theory isn't a perfect cure-all, and the Judgment Theory has defenses.

  **1. The Judgment Theorist's Counter-Attack:**
  A sophisticated Judgment Theorist would argue that Elena *does* judge herself guilty, but on a different level. They might distinguish between **occurrent judgment** (what she is thinking right now) and **dispositional judgment** (deep-seated habits of mind).
  *   *The Argument:* "Elena says she isn't guilty, but her behavior shows she *acts* as if she is. Therefore, deep down, she *does* judge herself to be guilty. She is repressing the true judgment."
  *   *Narrative Utility:* This allows the therapist to push back. "You say you know you aren't responsible, Elena, but you live as if you are. Which belief is actually driving the car?" This adds tension. It suggests the work isn't just accepting the illusion, but digging for the hidden judgment.

  **2. The Perceptual Theorist's Weakness:**
  The biggest objection to Perceptual Theory is **Cognitive Penetration**. Visual illusions are modular; knowing the truth doesn't fix the illusion. But emotions *are* responsive to reasoning over time.
  *   *The Argument:* If emotions were truly like vision, therapy wouldn't work. You can't talk yourself out of seeing the lines as different lengths. But Elena *can* talk herself out of guilt, eventually. Emotions are permeable to concepts, language, and reasoning in a way vision is not. Furthermore, guilt is conceptually rich (it requires understanding "moral agency"), whereas vision is non-conceptual. Calling it "perception" might be a metaphor that breaks under scrutiny.
  *   *Narrative Utility:* This suggests that while the feeling *feels* like an illusion, it is also malleable. It can be worn down. It's not a static trick of the light; it's a habit of perception that can be retrained.

  ### Part 5: Drafting the Scene

  Here is how you might translate this philosophical tension into the therapy room without the characters sounding like professors. The goal is to capture the *structure* of the debate through the *texture* of the dialogue.

  **Setting the Stage:**
  Elena is describing the physical sensation of the guilt. The therapist is trying to locate where the "truth" lies.

  **Sample Dialogue Beat:**

  > "It's not that I think I killed her," Elena said. She kept her hands flat on her knees, pressing them down as if to anchor herself. "I know the physics of it. I know the ice. I know I was asleep. Intellectually, the verdict is in. Not guilty."
  >
  > "But?"
  >
  > "But my body doesn't accept the verdict. When I hear brakes squeal, I don't think 'accident.' I feel 'culpability.' It's immediate. It's before thought."
  >
  > The therapist leaned forward. "So you're saying there are two different systems at work. One that knows the truth, and one that sees... something else."
  >
  > "Like an illusion," Elena said. "Like when you know two lines are the same length, but your eyes swear they aren't. I know I'm innocent. But I *look* guilty to myself."
  >
  > "That's one way to put it. That the feeling is a trick of the light." The therapist paused, letting the word *trick* hang there. "But here's the trouble with illusions, Elena. You can't reason your way out of them. You can measure the lines all day, but they still look different. Yet, you're here. You're talking. You're trying to change the way the lines look."
  >
  > "Because I'm tired of the illusion."
  >
  > "Or," the therapist said softly, "because the part of you that feels this isn't just a pair of eyes. It's a judge. And maybe it's holding a trial we haven't finished yet. Maybe the 'not guilty' you're speaking is just the lawyer talking. The judge is still deliberating."

  **Why this works:**
  1.  **The Illusion Analogy:** Elena uses the Perceptual Theory defense (it's an illusion/I know better but feel it anyway).
  2.  **The Judgment Rejoinder:** The therapist uses the Judgment Theory counter (emotions change with reasoning/therapy, so it's not just a passive illusion; there is a hidden judgment at work).
  3.  **No Winner:** The scene doesn't resolve whether she is "actually" judging herself guilty or just "seeing" guilt. It leaves the tension open, which is where the drama lives.

  ### Summary for the Author

  *   **The Conflict:** Elena's rational mind (Judgment) says "Innocent." Her affective body (Perception) says "Guilty."
  *   **The Philosophical Stake:** Is she irrational (Judgment Theory)? Or is she experiencing a value-illusion (Perceptual Theory)?
  *   **The Nuance:** The Judgment Theorist says "Dig deeper, you secretly believe it." The Perceptual Theorist says "Accept the feeling as a sensation, not a truth."
  *   **The Scene:** Let Elena argue for the illusion (to protect herself from the idea that she is secretly self-loathing), and let the therapist suggest that the feeling implies a hidden judgment (to encourage deeper work).

  This approach gives your character's suffering intellectual weight without reducing her to a case study. It respects the complexity of grief: that it is both a physiological reflex and a moral reckoning.
