      *   *The Irony:* The man who claimed geometry was the *only* path to certain truth spent decades publicly embarrassing himself trying to prove something false, refusing to accept correction from actual mathematicians (like Wallis). He became the very thing he hated: a dogmatist ignoring evidence.

