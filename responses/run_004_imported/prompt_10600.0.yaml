prompt: |-
  I'm working on a novel that's partly set in Restoration London, and one of the side characters is basically Thomas Hobbes -- cranky, brilliant, weirdly obsessed with geometry. I want to write a scene where he lays out, in his own arrogant voice, why he thought geometry was basically the one fully certain science -- something about how we can only really know a things causes when we're the ones who made it (I think I've seen this called "maker's knowledge"?), so the figures count because we draw them ourselves. Apparently he thought that same logic meant civil philosophy -- politics, basically -- could be just as demonstrable as geometry, which honestly seems like a stretch to me. Could you explain that actual line of reasoning in enough depth that I could put a believable version of it in his mouth, and maybe flag why its a little ironic given how the whole squaring-the-circle feud with Wallis turned out for him?
