      *   *Vocabulary:* Cause, effect, construction, demonstration, artifice, covenant, commonwealth, absurdity, silence.
      *   *Rhythm:* Logical progression, rhetorical questions, sharp dismissals of opponents.

  4.  **Address the Irony (The Wallis Feud):**
