  2.  **Deconstruct Hobbes's Philosophy (The "Maker's Knowledge" Argument):**
      *   *Core Premise:* To truly *know* something (scientia), you must know its cause.
      *   *Natural Philosophy (Physics):* We observe effects (nature), but we didn't make nature. God made it. Therefore, we can only hypothesize about causes. We have "prudence" or "conjecture," not absolute certainty.
      *   *Geometry:* We define the points, lines, and circles. We construct the figures. We are the "makers" (artificers) of these objects. Therefore, we know exactly how they came to be. The cause is in the construction. Thus, geometry yields absolute certainty.
      *   *Civil Philosophy (Politics):* The Commonwealth (the State) is an artificial man (Leviathan). We make it via social contract/covenant. Since we made it, we can know its causes and principles with the same certainty as geometry.
      *   *Conclusion:* Politics can be a demonstrative science, just like geometry.

  3.  **Capture Hobbes's Voice:**
