prompt: |-
  so i keep coming back to this question: why do promises actually bind, morally speaking -- not just the fact that keeping them is usually good policy, but why breaking one is a distinctive wrong on top of whatever harm it causes. Hume's answer is that its all convention, basically like the rules of baseball, where the obligation comes from everyone being invested in a mutually useful practice (he has this great line about how the naive picture -- where you just will a new obligation into existence by saying the words -- is barely more intelligible than transubstantiation). Rawls runs a similar-ish line later, tied to fairness instead of sentiment.

  here's what bugs me though: take two strangers, totally alone, no witnesses, no chance of reputational fallout, no way of reinforcing any ongoing practice -- say someone dying on a desert island extracts a promise from the only other survivor, who will never tell a soul and will never see another person again either. the promise still seems binding to basically everyones intuitions, which seems like a real problem for any theory that locates the obligation in a social practice or in the expectations/trust generated in the promisee, since neither one is doing any work in this case.

  can you give me a gears-level walkthrough of how the major theories of promising (Hume/Rawls-style conventionalism, Scanlon-ish expectation views, and whatever else is relevant) actually handle a case like this? and be honest about whether any of them really succeed, or whether we're stuck admitting the obligation comes from something more primitive that convention and expectation just can't capture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Why do promises bind morally? Specifically, why is breaking a promise a *distinctive* wrong, over and above the harm caused?
      *   **User's Stance:** Skeptical of conventionalist/practice-based theories (Hume, Rawls) because of the "Desert Island" counterexample (two strangers, one dying, no witnesses, no future social interaction). The intuition is that the promise remains binding even without social utility or expectation management.
      *   **Request:** A "gears-level walkthrough" of major theories (Hume/Rawls conventionalism, Scanlon expectation views, others) applied to the Desert Island case.
      *   **Constraint:** Be honest about whether these theories succeed or if we need something more primitive (e.g., autonomy-based).

  2.  **Deconstruct the "Desert Island" Case:**
      *   *Scenario:* A and B on an island. A is dying. A extracts a promise from B (e.g., "Tell my family I loved them"). B survives, returns to civilization, but tells no one about the promise, never sees A's family, or perhaps the family is dead too. Or, more sharply: B survives, returns, but simply chooses not to do it. No one knows B promised. No social practice is undermined because no one knows.
      *   *Intuition:* B still did something wrong by breaking the promise, even if no harm resulted (or harm is unrelated to trust).
      *   *Challenge:* This targets the *source* of the obligation. Is it external (social practice) or internal (will/autonomy)?

  3.  **Evaluate Major Theories against the Case:**

      *   **1. Humean Conventionalism (Practice Utilitarianism):**
          *   *Theory:* Promising is an artificial virtue. It exists because society needs a way to coordinate future actions. The obligation comes from the utility of the *institution*, not the specific act.
          *   *Application to Island:* Hume would likely say the obligation *dissolves* or is extremely weak here. If the act is secret and has no impact on the general practice (because no one knows), the utilitarian calculus shifts.
          *   *Honest Assessment:* This theory *fails* the intuition test here. Hume would bite the bullet and say our intuition is misguided sentimentalism.
          *   *Nuance:* Rule Utilitarianism might save it (follow the rule even in secret), but Act Utilitarianism (closer to Hume's sentiment) struggles.

      *   **2. Rawlsian Fairness (Practice Consequentialism):**
          *   *Theory:* Similar to Hume but focused on fairness. By invoking the practice, you gain a benefit (the promisee's reliance), so you must bear the burden (keeping it).
          *   *Application to Island:* Did B gain a benefit? Maybe comfort for A. But if the practice isn't reinforced, is the obligation there? Rawls ties it to the *institution* of promising.
          *   *Honest Assessment:* Struggles similarly to Hume. If the institution isn't implicated (secret act), the fairness argument weakens.

      *   **3. Scanlonian Expectation/Principle F (Contractualism):**
          *   *Theory:* It's not about a social practice, but about specific interpersonal principles. Principle F: If you intentionally lead someone to expect X, you must do X unless they release you.
          *   *Application to Island:* A expected B to do it. B invoked the assurance.
          *   *Problem:* A is dead. Does the obligation survive the death of the promisee? Scanlon focuses on *justifiability to others*. If A is dead, who is B accountable to?
          *   *Honest Assessment:* Better than Hume, but still relies on the *interaction*. If the expectation is gone (A is dead), does the duty remain? Scanlon might argue it's about the *principle* we all accept, not just A's feelings. But it still feels relational.

      *   **4. Autonomy/Will Theory (Kant, Grotius, Shiffrin):**
          *   *Theory:* Promising is an exercise of autonomy. You bind your future self to respect your past self's will and the promisee's right to claim performance. It creates a "right" in the promisee.
          *   *Application to Island:* B transferred a right to A. A's death doesn't necessarily extinguish the right (it might pass to heirs or remain a duty owed to the memory/right-holder).
          *   *Honest Assessment:* This handles the Desert Island case best. It explains the *distinctive* wrong (violating a right/autonomy) rather than just harm.
          *   *Problem:* Hume's "magic" objection. How do words change moral reality? The Will Theory says "agency does that."

      *   **5. Fidelity/Integrity Views (Williams, Foot):**
          *   *Theory:* It's about *who you are*. Breaking a promise corrupts the agent's integrity.
          *   *Application to Island:* Even if no one knows, *you* know. You become a promise-breaker.
          *   *Honest Assessment:* Captures the "secret" aspect well. But is it too self-regarding?

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the "Desert Island" intuition (it's the classic "Deathbed Promise" problem).
      *   **Section 1: The Conventionalists (Hume & Rawls).** Explain their mechanism (social utility/practice). Show why the Island case breaks them (no practice impact). Admit they likely have to call the intuition a illusion.
      *   **Section 2: The Expectation/Relational Views (Scanlon).** Explain Principle F. Show how it handles the interaction better but struggles with the *survival* of the duty after the relationship ends (death/isolation).
      *   **Section 3: The Will/Autonomy Theory (Kant/Shiffrin).** Explain the transfer of right/authority. Show why this fits the Island case (the obligation is created *in the moment*, independent of future consequences). Address Hume's "magic" charge.
      *   **Section 4: The Integrity View.** Briefly mention the agent-centered view.
      *   **Conclusion/Verdict:** Be honest. Conventionalism fails the specific intuition. Will Theory succeeds but pays a metaphysical price. Suggest that the "distinctive wrong" is likely about *authority* and *rights*, not just welfare.

