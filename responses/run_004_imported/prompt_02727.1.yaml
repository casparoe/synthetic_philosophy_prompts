      *   *Nuance:* Scanlon actually tries to move *away* from practice views. I need to make sure I represent him as a bridge between practice and will theories. He grounds it in reasonable rejectability, not social utility.
      *   *Key Insight:* The "distinctive wrong" is the key. Harm-based theories (utilitarianism) can't explain why breaking a promise is worse than causing equivalent harm otherwise. Rights/Will theories can.

  7.  **Final Polish:** Check against the prompt's specific request for honesty about whether we are stuck admitting something primitive. (Yes, likely a primitive normative power of agency).

