answer: |-
  This is one of the sharpest problems in normative ethics. You have correctly identified the "Deathbed Promise" (or Desert Island) case as the stress test that separates the sociological accounts of promising from the metaphysical ones.

  The core tension is this: If the obligation comes from **outside** the agent (social utility, trust mechanisms, practices), it should vanish when the social context vanishes. If the obligation comes from **inside** the agent (will, autonomy, integrity), it should persist even in a vacuum.

  Here is a gears-level walkthrough of how the major theories handle the Desert Island case, and an honest assessment of whether they survive it.

  ---

  ### 1. The Conventionalists (Hume, Rawls, Utilitarians)
  **The Mechanism:** Promising is an "artificial virtue." It is a human invention designed to solve coordination problems. The obligation is not inherent in the words "I promise," but in the fact that we are all participating in a useful social practice.
  *   **Hume:** We keep promises because we have a sentiment of approval for the *institution* of promising, which is necessary for commerce and stability.
  *   **Rawls:** We are bound by the "principle of fairness." By invoking the practice of promising, you gain a benefit (the promisee's reliance), so you must accept the burden (keeping the word) to maintain the practice.

  **The Desert Island Test:**
  In your scenario, the survivor breaks the promise secretly. No one knows. The institution of promising is not undermined because the "game" isn't being played publicly. No future coordination is affected.
  *   **Hume's Verdict:** Hume would likely bite the bullet and say the obligation is **weak or non-existent**. In *A Treatise of Human Nature*, he argues that if the circumstances change such that the utility of the promise vanishes, the obligation vanishes. If the act is secret and has no impact on the general scheme of society, the "sentiment of approval" for keeping it loses its fuel.
  *   **Rawls's Verdict:** Rawls ties obligation to the *public* rules of a practice. If the act is totally detached from the practice's reinforcement, the fairness argument weakens. Why be "fair" to a practice that isn't functioning here?

  **Does it succeed?**
  **No.** It fails your intuition test. Most people feel the survivor *still* wronged the dead man. Conventionalism reduces the wrong to "bad policy" or "undermining trust." But in the Desert Island case, trust isn't undermined. Therefore, conventionalism cannot explain the *distinctive* wrong of breaking the promise in isolation. It explains why we *teach* promising, but not why it binds in a vacuum.

  ### 2. The Expectation/Relational View (T.M. Scanlon)
  **The Mechanism:** Scanlon tries to move away from "social practice" and toward interpersonal morality. In *What We Owe to Each Other*, he proposes **Principle F**: If you intentionally lead someone to expect you will do X, and they rely on that, you must do X (unless they release you). The wrong is not breaking a rule, but betraying a specific person's reasonable expectations which you invited.

  **The Desert Island Test:**
  This handles the "no social practice" aspect better than Hume. It doesn't require a public institution, just a specific interaction.
  *   **The Problem:** The promisee is dead. Scanlon's contractualism is based on principles that cannot be "reasonably rejected" by others. But the "other" is gone.
  *   **The Glitch:** If the obligation is based on *preventing harm to the promisee's expectations*, does the obligation survive the promisee? If the dying man is dead, he has no more expectations. He cannot feel betrayed.
  *   **Scanlon's Fix:** Scanlon would argue the principle is general. We accept Principle F because *we* wouldn't want to live in a world where people manipulate expectations. So, the duty is owed to "humanity" or the moral community, not just the dead man.

  **Does it succeed?**
  **Partially.** It saves the obligation from dissolving into thin air, but it shifts the *victim* of the wrong. For Scanlon, breaking the desert island promise is wrong because it violates a principle we all owe to each other, not necessarily because it wrongs the dead man specifically.
  This misses the intuition that the wrong is *directed at the promisee*. If I break the promise, I didn't just violate a abstract principle; I failed *him*. Scanlon struggles to explain why the specific relationship creates a specific duty that outlasts the relationship.

  ### 3. The Will Theory (Kant, Grotius, Shiffrin)
  **The Mechanism:** This is the rival to conventionalism. Promising is an exercise of **normative power**. By promising, I exercise my autonomy to bind my future self and, crucially, I transfer a **right** to the promisee.
  *   **Kant:** A promise is a unilateral act of will that creates a juridical relation. To break it is to contradict your own agency (you are treating your past self's will as null).
  *   **Seana Shiffrin (Contemporary):** She argues promising creates a "moral right" in the promisee to control your action. The distinctive wrong is not harm, but **usurping authority**. When you break a promise, you take back an authority you gave away.

  **The Desert Island Test:**
  *   **The Mechanism:** At the moment of the promise, the survivor transferred the authority over that specific action to the dying man. The dying man now "owns" that future action.
  *   **The Result:** Even if the man dies, the right he held doesn't necessarily vanish (it may pass to his estate, or simply remain a duty owed to his memory/status as a rights-holder). The survivor is no longer free to choose regarding that action; they are acting under another's authority.
  *   **Hume's Objection:** Hume called this "transubstantiation"—how can saying words change moral reality?
  *   **The Reply:** We accept we have the power to change moral reality all the time. I can give you permission to enter my house (changing your status from trespasser to guest). I can forgive a debt. Promising is just the inverse: I give you a claim on me.

  **Does it succeed?**
  **Yes, best of the bunch.** This theory captures the "distinctive wrong" perfectly. The wrong isn't that trust is eroded (Hume) or expectations are dashed (Scanlon); the wrong is that the promisor acted outside their **jurisdiction**. They tried to make a decision they no longer had the right to make.
  This explains why the Desert Island promise binds: The transfer of authority happened *in the moment*. It doesn't require witnesses or social utility. It relies on a primitive metaphysical claim: **Agents have the power to create obligations by will.**

  ### 4. The Integrity View (Williams, Foot)
  **The Mechanism:** This is agent-centered. Keeping promises is constitutive of being a person of integrity. To break a promise is to fracture your own identity.
  *   **The Desert Island Test:** Even if no one knows, *you* know. If you break the promise, you become a person who breaks promises. You lose your integrity.

  **Does it succeed?**
  **It explains the feeling, but not the direction.** It explains why *I* would feel bad, but it makes the obligation self-regarding. It suggests I shouldn't break the promise because it hurts *me* (my character), not because I owe it to *him*. Most intuitions suggest the dying man has a claim on me, not just that I have a duty to my own soul.

  ---

  ### The Verdict: Are we stuck with "Magic"?

  You asked if we have to admit the obligation comes from something "more primitive." **Yes.**

  The Desert Island case essentially forces you to choose between two unpalatable options:

  1.  **Deny the Intuition (Hume):** Say that our feeling that the promise binds is a superstition. If there are no social consequences, there is no wrong. This is scientifically clean but morally sterile. It makes the "wrongness" of promising entirely parasitic on consequences.
  2.  **Accept Normative Powers (Will Theory):** Admit that human agency has a "magic" quality. We can change the moral landscape simply by willing it.

  **The Honest Assessment:**
  The Conventionalists (Hume/Rawls) **fail** the Desert Island case. They cannot explain the distinctive wrong without reference to social utility or practice maintenance. If you feel the promise binds in the desert, Hume is wrong about the *source* of the obligation, even if he is right about why the practice exists historically.

  Scanlon **improves** on Hume by grounding it in interpersonal justification rather than social utility, but he still struggles to explain why the duty survives the death of the relationship.

  The **Will Theory (Kant/Shiffrin)** is the only one that fully clears the bar. It posits that the "distinctive wrong" is a violation of the promisee's **authority**.
  *   **Why it feels like "transubstantiation":** Because it is. It asserts that human beings have the metaphysical capacity to alter deontic statuses (rights/duties) through speech acts.
  *   **Why we should accept it:** Because we already accept it in other domains (consent, forgiveness, gifting). If you accept that I can give you permission to touch me (changing a wrong into a right), you must accept that I can give you a claim on my future action.

  **Conclusion:**
  If the Desert Island intuition holds for you (and it holds for most), you are effectively a **Will Theorist**. You believe that the obligation comes from a primitive normative power of agency—the ability to bind oneself to another—independent of social consequences.

  Hume is right that the *practice* of promising is a social invention. But he is wrong that the *obligation* is merely a reflection of that practice. The practice is just the scaffolding we built to support a deeper moral reality: that we have the power to give pieces of our future freedom to each other. Breaking a promise in the desert is wrong because you are stealing back a gift you already gave.
