prompt: |-
  I'm a software engineer working on LLM evaluation, and I've started relying on "self-consistency" in our pipeline: sampling the same prompt many times at a nonzero temperature and taking the majority answer as the final output. I justified this approach to my team by appeal to the Condorcet Jury Theorem — since each individual sample does better than random guessing, the theorem guarantees that the majority vote converges to the correct answer with near-certainty as we add more samples. We're now considering dropping our more expensive human-verification step even for our hardest eval questions, on the logic that we can always buy arbitrary accuracy by sampling a cheap, weak model more times instead of paying for a stronger one. Does the Condorcet Jury Theorem really license that conclusion, and if not, exactly where does the argument break down?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **Role:** Software Engineer working on LLM evaluation.
      *   **Current Practice:** Using "self-consistency" (sampling multiple times at $T > 0$, taking majority vote).
      *   **Justification:** Condorcet Jury Theorem (CJT).
      *   **Proposed Action:** Dropping human verification for hard eval questions.
      *   **Logic:** Can buy arbitrary accuracy by sampling a cheap/weak model more times instead of using a stronger model or humans.
      *   **Question:** Does CJT really license this conclusion? If not, where does it break down?

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *What does it say?* If a group of $n$ voters makes a binary decision by majority rule, and each voter has an independent probability $p > 0.5$ of being correct, then as $n \to \infty$, the probability of the majority being correct approaches 1.
      *   *Key Assumptions:*
          1.  Binary choice (Correct/Incorrect).
          2.  Competence ($p > 0.5$).
          3.  **Independence:** Voters decide independently.
          4.  **Homogeneity (usually):** All voters have the same $p$ (though there are generalizations).
          5.  **Sincere Voting:** Voters vote their true belief (not strategic).

  3.  **Evaluate the Application to LLMs:**
      *   *Binary Choice:* Eval questions are often multiple choice or generated text mapped to a label. This is roughly okay, though open-ended generation complicates "correctness."
      *   *Competence ($p > 0.5$):* For "hardest eval questions," is the weak model actually $> 50\%$ accurate? If $p < 0.5$, CJT says the majority converges to *wrong*. If $p = 0.5$, it stays random.
      *   *Independence:* **CRITICAL FAILURE POINT.** LLM samples from the same model with the same weights and same prompt are *not* independent. They share the same biases, knowledge gaps, and reasoning failures. Sampling at $T > 0$ adds stochasticity, but it's stochasticity *conditioned on the same underlying distribution*. If the model doesn't know the answer, it's likely to hallucinate consistently or drift within a specific subspace of wrongness.
      *   *Homogeneity:* All samples come from the same model. This fits the "same $p$" assumption, but reinforces the dependence issue.
      *   *Cost/Accuracy Trade-off:* The user suggests swapping "strong model/human" for "many samples of weak model." This assumes the weak model has $p > 0.5$ on *hard* questions. Often, hard questions are hard *because* weak models fail them systematically ($p < 0.5$ or barely above).

  4.  **Identify Specific Breakdowns in the Argument:**

      *   **Violation of Independence (The Big One):** LLM samples are conditionally independent given the weights, but unconditionally highly correlated. They share systematic errors. If the model lacks the knowledge, more samples won't conjure it.
      *   **The $p > 0.5$ Threshold:** On "hardest eval questions," a "cheap, weak model" might have $p < 0.5$. CJT guarantees convergence to the *wrong* answer in this case.
      *   **Calibration vs. Consistency:** Self-consistency measures confidence, not correctness. A model can be consistently wrong.
      *   **Diminishing Returns:** Even if independent, the convergence is exponential but depends on the margin $(p - 0.5)$. If $p = 0.51$, you need *massive* $n$. If $p$ is correlated, the effective $n$ is much smaller.
      *   **Evaluation vs. Inference:** The user is talking about *evaluation* (grading the model). Using the model to grade itself (or a peer) creates circularity. If the goal is to evaluate Model A, using Model A's self-consistency to verify answers is tautological. If the goal is to build a ground truth set, using a weak model to generate ground truth is dangerous.
      *   **Human Verification Role:** Humans catch systematic biases and novel errors that the model class cannot conceive of.

  5.  **Drafting the Response:**

      *   *Acknowledge and Validate:* Self-consistency is a valid technique (Wang et al., 2022), and CJT is the intuitive backing. It *does* work sometimes.
      *   *Direct Answer:* No, it does not license dropping human verification for hard questions.
      *   *Core Argument 1: Independence Assumption.* Explain why LLM samples aren't like independent jurors. They are clones. Systematic error vs. Random noise.
      *   *Core Argument 2: Competence Threshold.* On hard questions, weak models often dip below 50%. CJT becomes the "Condorcet Doom Theorem" (converging to wrong).
      *   *Core Argument 3: The Nature of "Hard" Questions.* Hard questions often require reasoning steps the weak model is architecturally incapable of. Sampling doesn't add compute/reasoning depth, just variance in token selection.
      *   *Core Argument 4: Evaluation Integrity.* If you are evaluating a model, you need ground truth. Using the model (or a weaker peer) to establish ground truth via self-consistency contaminates the eval set.
      *   *Nuance/When it works:* It works for easy/medium questions where errors are mostly stochastic (slips) rather than systematic (knowledge gaps).
      *   *Recommendation:* Keep human verification for hard cases. Use self-consistency as a confidence signal, not a truth oracle. Consider "ensemble of models" rather than "samples of one model" for better independence.

  6.  **Refining the Tone:**
      *   Professional, technical, respectful but firm on the statistical limitations.
      *   Avoid jargon where possible, but use precise statistical terms (i.i.d., systematic bias).
      *   Highlight the business risk (dropping human verification).

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I miss the "stronger model" part?* The user says "sampling a cheap, weak model more times instead of paying for a stronger one." I need to address the Weak vs. Strong dynamic. A strong model might have higher $p$. A weak model with infinite samples cannot surpass its architectural ceiling.
      *   *Is self-consistency useless?* No, it's useful for reasoning tasks (CoT). I should distinguish between "answer consistency" and "reasoning consistency."
      *   *What about temperature?* High $T$ increases diversity but also incoherence. It doesn't guarantee independence of *truth*.

  8.  **Final Structure:**
      *   Executive Summary (No, it doesn't hold).
      *   The Three Pillars of CJT (and how LLMs break them).
      *   The "Hard Question" Problem ($p < 0.5$).
      *   The Correlation Trap (Systematic Bias).
      *   The Evaluation Paradox (Circularity).
      *   Actionable Advice.

  9.  (Self-Correction during drafting): Make sure to mention that self-consistency *is* a recognized technique (Wang et al., 2022), so I don't sound like I'm dismissing the technique entirely, just the *extrapolation* to replacing humans on hard evals.

  10. **Final Polish:** Check for clarity and impact. (The "Condorcet Doom" phrasing is catchy and accurate). Ensure the distinction between *inference* (getting an answer) and *evaluation* (grading an answer) is clear, as the prompt implies using this for the eval pipeline itself.

  *(Self-Correction on "Evaluation"):* Wait, re-reading the prompt: "working on LLM evaluation... dropping our more expensive human-verification step even for our hardest eval questions."
  This implies they are building a benchmark or grading a model's output. If they use the model's self-consistency to determine the *ground truth* of the eval question, that's circular. If they use it to determine the *score* of a model being evaluated (i.e., the model being evaluated uses self-consistency), that's inference optimization.
  *Interpretation:* "We're now considering dropping our more expensive human-verification step... on the logic that we can always buy arbitrary accuracy by sampling a cheap, weak model."
  This sounds like they are using a cheap model to *verify* the correctness of answers (perhaps to create a dataset or grade another model). Or they are using self-consistency on the model *under test* to assume the majority vote is ground truth.
  *Most likely interpretation:* They are using a weak model + self-consistency to *generate/verify ground truth* for the evaluation set, replacing humans. This is the dangerous part. I must address the circularity of using LLMs to validate LLMs without human oversight.

  *Revised Plan:* Emphasize the difference between *reducing variance* (which self-consistency does) and *reducing bias* (which it does not). Hard questions induce bias.

