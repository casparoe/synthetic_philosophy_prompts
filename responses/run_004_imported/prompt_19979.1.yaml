  **Justifications**

  1.  **Kai (1):** Kai is theoretically sound that markets aggregate dispersed information better than voters do, and voters express preferences better than planners. However, he is only partly right because the separation between "values" and "beliefs" is rarely clean in practice; policy preferences often embed factual assumptions, meaning the democratic "values" stage is already contaminated by epistemic disagreements.
  2.  **Nora (2):** Nora is right to identify a critical governance vulnerability. If the agents with policy power (council, landlords) can also trade, they can create self-fulfilling prophecies by betting on outcomes they intend to force, decoupling the market price from genuine information about welfare effects.
  3.  **Kai (3):** Kai is partly right that arbitrage theoretically punishes manipulation in liquid markets, but he is overly optimistic about policy markets. Niche prediction markets lack the depth and independent capital required to correct prices when well-funded insiders are motivated to distort them for governance gains.
  4.  **Nora (4):** Nora is right that operationalizing "welfare" into a metric is inherently normative. By moving the decision to index design, the proposal shields value judgments (e.g., prioritizing revenue over quiet) from democratic scrutiny, effectively bypassing the "vote on values" promise that justifies futarchy.

  ***

  **Analysis of Nora's Objection in (4)**

  Nora's point in (4) strikes me as a **decisive objection to futarchy as a complete system of governance**, rather than merely an objection to careless metric choices. This is because the problem is structural to the act of measurement itself, not just a bug in specific implementations.

  To function, futarchy requires a utility function—a mathematical representation of "welfare." Constructing this function inevitably involves two normative layers that cannot be resolved by better data:
  1.  **Selection Bias:** Deciding *which* variables to include (revenue, foot traffic) inherently privileges interests that generate measurable data over those that do not (e.g., community cohesion, aesthetic beauty, or a sense of belonging). A "careful" metric can broaden the inputs, but it cannot capture the unmeasurable without resorting to proxies that reintroduce bias.
  2.  **Weighting:** Deciding *how much* retail revenue matters relative to complaint volume is a value judgment. If these weights are voted on, the process becomes a referendum on technical specifications that voters may not understand (recurring the epistemic problem futarchy sought to solve). If chosen by experts or reformers, it becomes technocratic rule (recurring the legitimacy problem).

  Therefore, the problem recurs one level up. Even if the city votes on the metric, they are voting on a reduced proxy of their values, not the values themselves. Futarchy promises to separate values from beliefs, but Nora correctly identifies that the *translation* of values into a bettable metric is where the political struggle actually lives. Consequently, futarchy cannot replace democratic deliberation about the good life; at best, it can only serve as an advisory tool within a broader political process that retains the authority to question the metric itself.
