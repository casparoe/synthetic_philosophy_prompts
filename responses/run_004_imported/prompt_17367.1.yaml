answer: |-
  The ice in Elena's glass clinked against the side as she set it down. The hotel bar was finally quieting, the hum of the workshop crowd reduced to a few stragglers.

  "You dodged the pump today, Marcus," Elena said, leaning forward. "But let's strip the formalism. Apple, Banana, Cherry. You prefer Apple to Banana, Banana to Cherry, and Cherry to Apple. Bookie offers you a swap for a cent each time. Start with Apple. You trade for Cherry, minus a cent. Then Cherry for Banana, minus another. Then Banana for Apple, minus a third. You end up with Apple minus three cents. You're poorer. You're irrational. Full stop."

  Marcus swirled his bourbon. "I don't trade. I adopt a plan at t0: *Keep the initial fruit.* I execute it resolutely."

  "At t2, you're holding Cherry," Elena countered. "The bookie offers Apple for Cherry plus a cent. By your own ranking, you prefer Apple to Cherry right now. You're getting something you prefer more. Yet you say no. You are knowingly choosing the option you rank lower at the moment of choice. How is that rational agency and not just self-binding madness?"

  "Because rationality is diachronic, not just a sequence of snapshots," Marcus said. "If I treat every node as a new agent with veto power, I get pumped. Resolute choice means my past commitment constrains my current choice. I choose Cherry over Apple at t2, not because I prefer Cherry, but because I prefer *keeping my plan*."

  Elena shook her head sharply. "There it is. You're smuggling in a new preference. At t2, you claim to prefer Apple, but you act as if you prefer ' sticking to the plan.' So your real preference ordering at t2 isn't A > C. It's 'Plan' > A > C. You've changed your preferences to avoid the pump. It's a preference change wearing a trenchcoat."

  "It's not a change in taste," Marcus insisted. "I still want the Apple more than the Cherry. I taste the Apple, I know it's better. But I recognize that acting on that local preference leads to global suicide. I'm not changing the ranking; I'm overriding the mechanism that translates ranking to choice."

  "Overriding it with what?" Elena pressed. "If you consistently choose X over Y when you prefer Y over X, behaviorally, you prefer X. If you say 'I prefer Y but I choose X,' you're divorcing preference from choice entirely. Then what work is 'preference' doing? If the pump shows you'll lose money, and resolute choice says 'I won't lose money because I'll ignore my preferences,' you've saved your wallet by sacrificing the definition of rational choice. You're just saying 'I won't be pumped' by fiat."

  "I'm saying the unit of agency is the temporally extended person, not the time-slice," Marcus said. "The pump exploits the disconnect between slices. Resolute choice bridges them. Yes, I bite the bullet: at the moment of trade, I act against my local preference. But that's the cost of not being a money pump. Would you rather be consistent across time or consistent across milliseconds?"

  "Consistency across time requires that your choices reflect your reasons," Elena said. "If your reason at t2 is 'I prefer Apple,' you take the Apple. If you don't, you're lying about the preference. McClennen thought he solved dynamic inconsistency, but he just moved the inconsistency from the choices to the psychology. You're asking me to believe you prefer Apple to Cherry while you hand over the Cherry and keep the cashless wallet."

  "I'm asking you to believe that being suckered is worse than being resolute," Marcus replied, finishing his drink. "The pump proves you can't be a maximizer at every node. I choose to be a maximizer over the trajectory. Even if it means hurting my future self's feelings at every turn."

  "Then you're not a preference maximizer," Elena said, signaling the bartender. "You're a plan maximizer. And now we have to argue about why plans trump preferences. See you at the Q&A."
