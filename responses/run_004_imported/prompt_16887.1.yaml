  ### **How to Explain This to Your Friend (If They Ask)**

  If your friend asks why they didn't get full marks, you can be honest but supportive:

  1.  **Validate the Hard Stuff:** Tell them their explanation of the **probability distribution** (the part about the uniform distribution not existing) was actually really good and probably better than most of the class. That's the hardest part of the question, and they nailed it.
  2.  **Point Out the Mix-Up:** Explain that the points came off on the **Bernoulli/St. Petersburg** reference. You can say: *"The rubric penalized the Bernoulli part because Two-Envelope is usually considered a probability error, whereas St. Petersburg is a utility error. Even if you value money linearly, Two-Envelope still breaks, but St. Petersburg doesn't. The teacher might mark that down as conflating the two units."*
  3.  **The Grade:** An 8/10 (B) is a solid grade that reflects "great understanding of the core concept, but a slip-up on the historical context/theory comparison." It protects you from looking like you graded them too easy (9 or 10) or too harsh (below 7).
