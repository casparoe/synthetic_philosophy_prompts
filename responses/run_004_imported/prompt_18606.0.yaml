      *   *Gilbert Nuance:* Gilbert doesn't necessarily posit a *metaphysical* entity, just a normative one. Rousseau posits a *moral* entity which acts like a metaphysical one.
      *   *Bratman Nuance:* Bratman is about *shared intention* in small scale (painting a house, walking together). Rousseau is about *political legitimacy*. The scale matters. But the prompt asks about the *structure* of the intentionality.

