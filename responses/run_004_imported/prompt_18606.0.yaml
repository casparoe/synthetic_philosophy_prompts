prompt: |-
  For a chapter of my dissertation on the prehistory of collective intentionality, I keep returning to a comparison that the secondary literature does not seem to address. Contemporary theorists of joint action disagree over whether shared intention can be explained in purely individualistic terms. Michael Bratman holds that it reduces to a structure of interlocking individual intentions and meshing sub-plans, sustained by common knowledge and mutual responsiveness; nothing in this analysis requires that participants owe each other anything beyond what practical rationality demands, so the shared intention simply lapses if one party's own intention does. Margaret Gilbert denies this: joint action, on her view, requires a primitive "joint commitment," irreducible to any sum of individual commitments, which alone explains why participants acquire genuine obligations to one another that cannot be dissolved by a unilateral change of heart — rescinding the commitment requires the concurrence of all parties.

  Rousseau, writing more than two centuries before either position was formulated, describes the founding of a political community as an act that creates a "moral and collective body" possessing its own unity and will, and he insists that this general will is categorically distinct from the "will of all," the mere aggregate of private wills. Given his actual arguments for that distinction, which side of the Bratman/Gilbert dispute do you think Rousseau's considered position supports, and why? Point to the specific doctrines that tell for or against each attribution, and flag anything in his account of the general will that resists assimilation to either camp.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Prehistory of collective intentionality (dissertation chapter).
      *   **Core Comparison:** Jean-Jacques Rousseau (18th century) vs. Contemporary theories of joint action (Michael Bratman vs. Margaret Gilbert).
      *   **The Contemporary Dispute:**
          *   *Bratman (Individualistic/Reductive):* Shared intention = interlocking individual intentions + meshing sub-plans + common knowledge + mutual responsiveness. No inherent obligations beyond practical rationality. Unilateral withdrawal is possible (intention lapses).
          *   *Gilbert (Non-Reductive/Plural Subject):* Shared intention = primitive "joint commitment." Irreducible to individuals. Creates genuine mutual obligations. Unilateral withdrawal is *not* possible (requires concurrence).
      *   **Rousseau's Position:** Founding of political community creates a "moral and collective body" (the Sovereign). The "General Will" is distinct from the "Will of All" (aggregate of private wills).
      *   **Task:** Determine which side (Bratman or Gilbert) Rousseau's considered position supports, based on his actual arguments. Identify specific doctrines supporting/opposing each attribution. Flag aspects of Rousseau that resist assimilation to *either* camp.

  2.  **Initial Assessment & Hypothesis Generation:**
      *   *Surface Level:* Rousseau sounds like Gilbert. He talks about a "collective body," a "general will" distinct from the sum of private wills, and emphasizes obligation/alienation of rights. Bratman sounds too thin/individualistic for the *Social Contract*.
      *   *Deeper Level:* Rousseau is complex. The "General Will" isn't just a commitment; it's a metaphysical transformation of the individual. Gilbert is about *commitment*; Rousseau is about *constitution* of a new moral person. Bratman is about *coordination*; Rousseau is about *legitimacy* and *freedom*.
      *   *Hypothesis:* Rousseau aligns more closely with Gilbert regarding the *normative force* and *irreducibility* of the collective stance, but his metaphysical claims about the creation of a new "moral person" go beyond Gilbert's plural subject theory. However, there are Bratmanian elements in the *formation* (individuals must will the general), but the *result* is Gilbertian.
      *   *Refinement:* The prompt asks which side his *considered position* supports. The core of the *Social Contract* is the alienation of natural liberty to create civil liberty via the General Will. This sounds anti-individualistic in the Bratman sense. But does it fit Gilbert's "joint commitment"? Gilbert focuses on the *structure* of the commitment. Rousseau focuses on the *ontological status* of the resulting entity.
      *   *Decision:* Rousseau is closer to Gilbert on the *normative/obligatory* aspect (unilateral withdrawal is illegitimate/impossible without dissolving the contract), but he exceeds both by positing a real metaphysical unity (the *moi commun*) that neither contemporary theorist typically claims.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the anachronism but validate the heuristic value. State the thesis: Rousseau aligns structurally with Gilbert regarding irreducibility and obligation, but diverges metaphysically.

      *   **The Case for Gilbert (The Stronger Fit):**
          *   *Irreducibility:* General Will $\neq$ Will of All. This is the smoking gun against Bratman's aggregation/interlocking model. Bratman builds up from individuals; Rousseau posits a emergent property that transcends them.
          *   *Obligation/Unilateral Withdrawal:* Bratman allows unilateral withdrawal (intention lapses). Rousseau explicitly forbids this in the political context. Once contracted, the individual is part of the whole. To withdraw is to be a "free rider" or traitor, forced to be free. This matches Gilbert's "rescinding requires concurrence."
          *   *The "We":* Gilbert's "Plural Subject." Rousseau's "Public Person," "Republic," "Body Politic."

      *   **The Case for Bratman (The Weaker Fit/Nuance):**
          *   *Individual Agency:* Rousseau insists the General Will must reside *in* the citizens. It's not a transcendent monarch. It requires individual participation (voting). There is an element of "meshing sub-plans" (the common interest).
          *   *Rationality:* Bratman relies on practical rationality. Rousseau relies on the rationality of the common good.
          *   *Why it fails:* Bratman's model is too weak to sustain the *moral transformation* Rousseau requires. Bratman's shared intention is a tool for coordination; Rousseau's General Will is a source of legitimacy and moral identity.

      *   **Where Rousseau Resists Both (The "Flagging" Requirement):**
          *   *Metaphysical Transformation:* Gilbert says we are a plural subject *by commitment*. Rousseau says we become a *new moral being* (alienation of rights). It's ontological, not just normative.
          *   *Infallibility/Abstractness:* The General Will is always right (though judgments can err). Neither Bratman nor Gilbert claims the collective intention is inherently "right" or morally superior, just that it exists.
          *   *Coercion:* "Forced to be free." Gilbert's obligations are normative; Rousseau's are enforced by the Sovereign. Bratman has no coercion.
          *   *The Lawgiver:* Rousseau needs an external figure to shape the *mores* to make the General Will possible. Neither contemporary theory needs a divine-like shaper of psychology.

  4.  **Refining the Argument (Self-Correction during drafting):**
