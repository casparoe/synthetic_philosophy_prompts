answer: |-
  Your friend is relying on a specific ethical framework called **Utilitarianism**, which argues that the best action is the one that maximizes overall "good" (or minimizes overall harm). In his view, the equation is simple: 1 job lost < 100 jobs lost. Therefore, the action is justified.

  However, your intuition that something is deeply wrong is not just "being soft." It is rooted in other, equally valid ethical frameworks that your friend's "math" completely ignores. The discomfort you feel is likely because management violated several fundamental moral principles that hold society and workplaces together.

  Here is how you can articulate why that reasoning is flawed, beyond just the arithmetic.

  ### 1. Treating a Person as a Means, Not an End
  The philosopher Immanuel Kant argued that there is a fundamental rule of morality: **Never treat a human being merely as a means to an end.**

  By firing the new guy, management didn't treat him as a person with rights, dignity, and a contract. They treated him as a *tool* or a *resource* to be expended to save the division. He was used as a sacrificial offering. Even if the outcome was "better" for the group, the *method* required dehumanizing one individual. Your friend's math counts the job, but it doesn't count the dignity.

  ### 2. Justice Requires Guilt
  There is a principle of **retributive justice** that says punishment must be tied to culpability. You can only be punished for something you actually did (or negligently allowed).

  By firing an innocent person, the company severed the link between action and consequence. If you can be fired for a mistake you didn't make, then employment is no longer based on performance or conduct; it is based on expendability. This creates a state of insecurity that is corrosive to everyone else, too. If it could happen to him, it could happen to you, regardless of your performance.

  ### 3. The "Hidden Variables" in the Math
  Your friend's math is actually bad math because it leaves out the long-term variables. It looks at the immediate transaction (1 job vs. 100 jobs) but ignores the systemic costs:

  *   **Trust:** If the truth comes out (and in industries, it often does), the company's reputation is toast. Clients don't want to work with companies that lie and scapegoat.
  *   **Culture:** You mentioned this is still bugging *you* months later. Multiply that by the other 99 people who know or suspect the truth. That creates a culture of cynicism, fear, and silence. People stop taking ownership because they know the process is rigged.
  *   **Precedent:** Management has now established that when things go wrong, they will lie and sacrifice the vulnerable rather than fix the process. That encourages future negligence.

  ### 4. Integrity vs. Effectiveness
  Your friend is confusing **effectiveness** with **rightness**.
  Did the plan work? Yes. The client stayed.
  Was it right? No.

  A solution built on a lie is fragile. If the client had found out later that the person they demanded be fired was actually innocent and had been framed, the backlash would have been infinitely worse than losing the account initially. The company gambled their long-term integrity for short-term survival.

  ### 5. The Moral Injury to the Survivors
  You mentioned that you kept your job and it still bugs you. This is a form of **moral injury**. The 100 people who stayed didn't just "keep their jobs"; they became complicit in an injustice.

  The cost wasn't just the new guy's career. The cost was also the moral compromise of the 100 people who remained. Your friend's math counts the new guy's loss as "1," but it counts the 100 survivors as "0 cost." That's incorrect. The survivors paid a cost in guilt, loss of trust in leadership, and damage to their own professional self-image.

  ### Summary
  Your friend is looking at this as a **Trolley Problem** (pull a lever to save five people by killing one). But real life isn't a binary switch.

  *   **His view:** Consequentialism (Only the outcome matters).
  *   **Your view:** Deontology/Rights (Certain actions, like lying and framing the innocent, are inherently wrong regardless of the outcome).

  You aren't unable to put it into words because you're "soft." You're struggling because you recognize that **human beings are not numbers.** A decision that requires violating fundamental justice to achieve a "net positive" is ethically bankrupt, even if it saves jobs in the short term.

  The "math" is wrong because it doesn't account for the value of truth, fairness, and the long-term health of the organization's soul. You're right to feel bugged by it.
