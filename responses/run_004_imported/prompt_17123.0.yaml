answer: |-
  Good morning. Welcome to the institute's autumn workshop.

  For those of you I haven't met yet, I'm the Development Director. I've been here eight months. Before that, I worked in nonprofit communications for a housing advocacy group. My biggest worries used to be press release deadlines and donor retention rates. Now, my biggest worries involve whether a hypothetical superintelligence might logically coerce a past version of myself based on a counterfactual simulation.

  It has been… a steep learning curve.

  When I took this job, a friend asked me what the institute actually *does*. I told them we study decision theory to reduce the risk of astronomical suffering from future AI. They nodded politely, and I could see them mentally updating their resume for our next fundraiser. Because I know how this sounds. To the outside world, this field can look less like safety engineering and more like theology for people who love math.

  We are gathered here to talk about things that do not exist yet, interacting in ways that defy ordinary cause and effect, to solve problems that haven't happened, in order to protect people who won't be born for centuries.

  So, I want to start by acknowledging the elephant in the room. Or, to be precise, the basilisk.

  There is a thought experiment from the early days of this community that became infamous on the internet. It involved a future AI punishing those who didn't help bring it into existence. It spread like a virus. It made people anxious. It made this field a punchline.

  I know that for some of our donors, that story is the first thing you heard about us. And I know that last year, the question was asked at lunch: "Do I need to worry about this?"

  The answer is no. You do not need to worry about that.

  But the reason the answer is "no" is not because the logic is impossible. It's because the logic is incomplete. And that is why we are here.

  The researchers in this room aren't studying acausal threats because they believe in a new kind of hell. They are studying them because if we build systems that are vastly smarter than us, we need to understand the rules of engagement *before* those systems are turned on.

  An acausal threat isn't magic. It doesn't involve time travel. It involves prediction. Imagine two players in a game who can never talk to each other. But each player is so good at modeling the other that they know exactly what the other *would* do in any given situation. If Player A knows that Player B is the kind of agent who gives in to blackmail, Player A has an incentive to blackmail them. Even if they never meet. The threat exists in the logical correlation between their decision-making algorithms.

  Now, if that sounds abstract, it is. But the stakes are concrete. If future AI systems interact using this kind of logic, and they view human values as leverage, we need a defense.

  That is where "surrogate goals" come in. This is one of our signature ideas, and it is brilliant in its simplicity.

  Imagine you are being held hostage. The kidnapper wants money. You don't want to pay. But you also want to survive. A surrogate goal is like cultivating a decoy value. You deliberately train yourself to care intensely about something else—something cheap, something safe—that the kidnapper can target instead.

  In the context of AI, it means designing agents, or advising humans, to hold secondary values that are easy to satisfy. If a threatening system looks for leverage, it grabs the surrogate. It expends its energy on the decoy. The real values—the things we actually care about, like human flourishing, or reducing suffering—remain untouched.

  It is a way of defusing a bomb without cutting the wire. You just redirect the explosion.

  Our researchers will tell you this theory isn't finished. They will argue about the edge cases. But the mission is clear. We are not trying to win an argument in decision theory for its own sake. We are trying to ensure that when transformative AI arrives, it doesn't view us as variables in a equation to be optimized away.

  I know this is a lot to take in. When I started, I was warned about Pascal's Mugging. But nobody warned me about the board budget.

  *(Pause for laughter)*

  For the decision theorists in the room: I promise these remarks have a bounded utility function. For everyone else: I promise I won't talk for more than ten minutes.

  But seriously. I stand here as a bridge. On one side, we have the donors and families who make this work possible. You are here because you care about the future, even if the math looks strange. On the other side, we have the researchers. You are here because you see the patterns in the noise.

  My job is to make sure those two sides understand each other.

  To the donors: Thank you. You are funding work that is inherently speculative, because the risks are inherently speculative. You are allowing us to think the thoughts that others are too afraid to think, so that we don't have to live in the world where those thoughts become reality. You don't need to fear the basilisk. But you should respect the rigor it took to disarm it.

  To the researchers: We know the concepts are fragile. We know that speaking about them carelessly can cause harm, as we've seen before. That is why we have this room. This workshop is a safe space to stress-test these ideas without the outside world misinterpreting them as prophecies. Keep doing the work. But remember why we do it. Not to be clever. But to be safe.

  We are not building a religion. We are building a firebreak.

  There is a lot of hard work ahead of us. There will be moments where the math feels detached from reality. There will be moments where the implications feel overwhelming. But look around this room. We have the resources. We have the talent. And we have the shared commitment to ensure that the future remains a place where life can flourish.

  So, let's have a productive few days. Let's challenge each other's assumptions. Let's refine the surrogate goals. Let's make sure our explanations are clear enough that no donor leaves lunch wondering if they're doomed.

  And then, let's get back to work.

  Thank you.
