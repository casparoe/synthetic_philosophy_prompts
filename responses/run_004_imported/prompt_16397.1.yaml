answer: |-
  **Admiral Thales:** The water is black tonight. No moon. Look at the fleets down there. Silent. Still. It feels as though the world is holding its breath, waiting to see which way the tide turns.

  **Admiral Diodorus:** The tide doesn't turn until it turns, Thales. But the proposition regarding the tide is already settled. Either there will be a sea battle tomorrow, or there will not. One of those sentences is true, and the other is false. Right now. In this moment.

  **Thales:** That's the comfort of your logic, Diodorus. You treat tomorrow like yesterday. But yesterday is stone; tomorrow is water. To say "There will be a sea battle" is true *now* is to claim the future has the same ontological weight as the past. It hasn't. The battle depends on choices not yet made, winds not yet risen. Until then, the sentence is neither true nor false. It's indeterminate.

  **Diodorus:** Indeterminate? You're willing to sacrifice the Law of Bivalence for the sake of poetic uncertainty? If I say, "Either there will be a battle or there won't," you'd agree that's a tautology. But if neither disjunct has a truth value, your disjunction is truth-valueless too. You're breaking classical logic. You're denying the Law of Excluded Middle. That is a massive cost to pay just to preserve a feeling of "openness."

  **Thales:** I'm not denying Excluded Middle. I'm denying that Bivalence is required for Excluded Middle. I can accept that "Either $P$ or not-$P$" is valid without accepting that $P$ is currently true or that not-$P$ is currently true. The disjunction is true because the possibilities exhaust the logical space, not because one of the horns has already obtained. You're conflating the logic of propositions with the metaphysics of time.

  **Diodorus:** I'm conflating nothing. Truth is correspondence. If the sentence "There will be a battle" corresponds to what will happen, it is true. If it doesn't, it's false. Since what will happen is definite—there is only one actual future—the truth value is definite. Your "indeterminacy" is just ignorance. You don't *know* which is true. That doesn't mean there *is* no truth.

  **Thales:** It's not ignorance. It's ontology. There is nothing *there* yet to correspond to. Truth supervenes on being. If the future battle doesn't exist yet, if it's genuinely contingent, then there is no fact of the matter for your proposition to latch onto. You're positing a "truth" that floats free of reality.

  **Diodorus:** And you're positing a reality that changes its truth value over time, which is absurd. But let's grant your indeterminacy for a moment. Let's talk about what happens when the sun rises. Suppose we fight. Tomorrow night, we stand here again. It will then be a fact that "It was true yesterday that we would fight." Correct?

  **Thales:** If we fight, yes. It will be a fact about the past.

  **Diodorus:** And you agree that the past is fixed. Once a moment is past, it is accidentally necessary. We cannot change the past. So, tomorrow night, the statement "It was true on Tuesday that the battle would occur" is a necessary fact about Tuesday.

  **Thales:** I agree the past is fixed.

  **Diodorus:** Then trace it back. If it is necessary tomorrow that it was true today, then it is necessary today that it is true today. The necessity of the past transfers backward to the present truth. And if it is necessary now that the battle occurs, then the battle is necessary. You haven't saved contingency, Thales. You've just delayed the fatalism by twenty-four hours. Once the future becomes past, it drags its necessity back onto the moment when it was future.

  **Thales:** That's the Fixity of the Past argument. It's clever, Diodorus, but it begs the question. You're assuming that "It was true yesterday that $P$" is a hard fact about the past. It isn't. It's a soft fact.

  **Diodorus:** A soft fact?

  **Thales:** A hard fact is purely about the past moment itself. "Admiral Diodorus stood on the cliff." That's hard. Once Tuesday is over, that's locked. But "It was true on Tuesday that a battle would occur on Wednesday" entails something about Wednesday. It's a relational property. It depends on what happens tomorrow. So, while we can't change the hard facts of Tuesday, we do have power over the soft facts of Tuesday. By choosing whether to fight tomorrow, we determine what was true yesterday.

  **Diodorus:** That sounds like wordplay to escape the trap. You're saying I have power over the past?

  **Thales:** No. I'm saying you have power over which past descriptions are accurate. You can't change the event of me standing here. But you can change whether that event counts as "a moment where a true prophecy was made." The truth value of future contingents isn't a property of the past moment; it's a property of the whole timeline.

  **Diodorus:** But that undermines the asymmetry of time! If I can determine what was true yesterday by acting tomorrow, then the past isn't fixed in the relevant sense. The intuition behind the Fixity of the Past is that the past is out of our control. If my action tomorrow makes a proposition about yesterday true, then yesterday was partially in my control. That's counterintuitive.

  **Thales:** It's only counterintuitive if you think truth is a static label you slap on moments. If truth is dynamic, if it depends on the branching structure of time, then no paradox. On Tuesday, there are two branches: Battle and No Battle. Neither is actualized. On Wednesday, one branch is actualized. Once actualized, we look back and say, "Ah, the Battle branch was the true one." But on Tuesday, neither was true. You're trying to import the settledness of Wednesday back into Tuesday.

  **Diodorus:** I'm not importing settledness; I'm preserving logic. Look, let's drop the soft/hard fact distinction for a second. Let's talk about causation. You think my view implies fatalism because you think truth causes events. It doesn't. The truth of "There will be a battle" doesn't *make* the battle happen. The causes make the battle happen—the orders I give, the wind, the morale. The truth is just a shadow cast by the event.

  **Thales:** But the shadow exists before the object? That's the problem. If the shadow is there now, the object is determined. If the proposition is true now, it excludes the possibility of it not happening. You say you keep contingency, but you've removed the possibility of the opposite outcome. If it's true now that we fight, then in what sense is it possible that we don't?

  **Diodorus:** In the sense of logical possibility. It is logically possible we don't fight. But it is not possibly true *given the actual future*. Look, Thales, imagine God knows the future. Does His knowledge cause the event?

  **Thales:** I'm not bringing theology into this.

  **Diodorus:** It's not theology; it's epistemology. If someone knew the future, their belief would be true. If their belief is true, the event happens. Does their knowing it force the event? No. The event forces the knowledge. Similarly, the truth of the proposition doesn't constrain the causes. The causes constrain the truth. The truth value is just a reflection of the causal chain that *will* operate.

  **Thales:** But if the truth value is already there, waiting for us, then the causal chain is already complete. You're saying the future is real. I'm saying the future is potential. If you treat potentiality as actuality, you destroy agency. If "We fight" is true now, then my deliberation is a sham. I'm just acting out a script that already has a truth value assigned to it.

  **Diodorus:** Your deliberation is part of the causal chain that makes the proposition true! That's the point you keep missing. The proposition isn't true *independently* of your deliberation. It's true *because* of what you will deliberate. So you must deliberate. If you decide not to fight, then the proposition "We will fight" was false all along. But it was still either true or false. You can't say it was neither. If it was neither, then when you decide, you're changing a truth value from "null" to "true." But truth doesn't change. Facts change.

  **Thales:** Truth values of contingents *do* change. That's what it means for time to pass. On Monday, "Battle on Wednesday" is indeterminate. On Tuesday, still indeterminate. On Wednesday, it becomes true. You want to say it was true on Monday. I say that imposes a necessity on Monday that wasn't there. You claim you avoid fatalism, but you've accepted that every true statement about the future is necessarily true in the sense that it cannot be otherwise.

  **Diodorus:** I accept it cannot be otherwise *if it is true*. But that's a trivial necessity. It's the necessity of the consequence, not the necessity of the consequent. If $P$ is true, then necessarily $P$ is true. That doesn't mean $P$ is necessary in itself. It just means truth is stable. You're confusing the stability of truth with the necessity of events.

  **Thales:** Stability implies fixity. If the truth is stable across time, then the event is fixed across time. I'd rather break bivalence than break freedom. I'll take the cost of non-classical logic. I'll accept that $P \lor \neg P$ holds without $P$ being true or $\neg P$ being true. It's a small price for a world where admirals actually decide battles, rather than just discovering what was already written in the stars of logic.

  **Diodorus:** And I'd rather break your intuition about "openness" than break the logic that governs all rational discourse. If you deny bivalence, you can't reason about the future. You can't plan. Planning assumes "If I do $X$, $Y$ will happen" is a true conditional now. If future contingents lack truth values, your conditionals are all gaps. You're left mute. I can speak true things about tomorrow. You can only guess.

  **Thales:** I can speak truly about possibilities. You speak falsely about actualities. Look at the harbor, Diodorus. The ships are dark. Nothing is decided. The silence isn't just in our heads. It's in the world. Your logic fills the silence with noise because you're afraid of the gap.

  **Diodorus:** The gap is where fatalism hides, Thales. If truth doesn't hold the future, then nothing connects today to tomorrow. I'll keep my bivalence. I'll keep my logic. And I'll sleep soundly knowing that whether we fight or not, the proposition was true tonight, and my choice tomorrow will prove it, not create it.

  **Thales:** Then you're already dead, Admiral. You're just waiting for the body to catch up. I'm still alive. Because for me, the battle hasn't started until the first arrow flies.

  **Diodorus:** And for me, the battle was won or lost the moment the proposition took its value. We'll see who's standing here tomorrow night.

  **Thales:** No. We'll see if there's a "tomorrow night" to stand in. That's the part you haven't settled yet.
