answer: |-
  Here are 9 interview questions designed to be rigorous and direct, tailored for an audience of econ PhDs. Each includes a main question and a follow-up keyed to the guest's likely "hidden cost" or "model boundary" defense.

  ### 1. The Convexity Intuition
  **Question:** Let's start with the engine of the theorem. Good's result relies on the value function of a decision problem being convex in the agent's probability beliefs. In plain terms, this convexity comes from the option to *switch* actions based on the signal. Can you walk us through exactly why that option value guarantees that the expectation of the maximum is greater than the maximum of the expectation? And more importantly, what specific structural feature of the decision problem would have to be absent for that Jensen's inequality step to fail?

  *   **Follow-up:** If you say the failure requires a non-convex value function, does that imply the theorem is essentially tautological for any agent who satisfies the independence axiom? In other words, is Good's Theorem actually a substantive claim about the value of information, or just a restatement of the linearity of expected utility?

  ### 2. Conditions for Dominance Failure
  **Question:** You've argued that "look before you leap" dominates "leap before you look" for any Bayesian expected-utility maximizer. But there are formal setups in the literature—specifically involving non-instrumental utility or belief-dependent preferences—where information has negative value even ex-ante. If we grant your premise that those are just "costs," are you defining the cost of information *as* the difference in expected utility? If so, doesn't that make the claim "information is never harmful" unfalsifiable by definition?

  *   **Follow-up:** If you insist the cost must be identifiable independently of the choice (e.g., time, money, cortisol), how do you account for cases where the agent pays to *avoid* the information but reports no anticipatory anxiety? Are we positing a subconscious cost function to save the theorem?

  ### 3. The Biopsy Problem (Ex-Ante vs. Ex-Post)
  **Question:** I want to press on the gap between ex-ante expectation and ex-post realization. My advisor's standard example is a false-positive biopsy: the test is free, accurate, and useful for treatment, but receiving the positive signal leaves the patient strictly worse off in terms of experienced utility than if they had remained ignorant. Good's theorem says the *expectation* of looking is higher, but it doesn't comfort the person holding the false positive. Does your defense of the Principle of Total Evidence have anything to say to the agent in that realized state, or is the theorem purely a planning tool with no normative weight for the experienced outcome?

  *   **Follow-up:** If you say it's only a planning tool, does that limit its usefulness as a defense of radical transparency? If a policy maker uses your book to argue for mandatory disclosure, but the disclosed individuals end up with lower realized welfare in certain states, hasn't the policy failed even if the theorem holds?

  ### 4. Information Avoidance Literature
  **Question:** There's a robust literature in behavioral econ on information avoidance—people skipping free genetic tests or investors not checking portfolios during crashes. Your go-to response is that these agents are facing hidden psychic costs. But if every instance of avoidance is explained by positing a cost that is revealed only by the avoidance itself, aren't you immunizing the theory against refutation? How do we distinguish between an agent who is *irrational* (violating Good's theorem) and an agent who simply has high "psychic costs" that we haven't measured?

  *   **Follow-up:** Suppose we run an experiment where we measure stress hormones and willingness-to-pay simultaneously, and we find people avoid info even when physiological costs are negligible. At that point, do you concede the violation is in the updating rule or the utility function, rather than a "cost"?

  ### 5. Falsifiability and "Hidden Costs"
  **Question:** Following up on that: In physics, if an object falls up, we don't say "there must be a hidden gravity cost"; we say Newton was wrong. Why should decision theory be different? If the "hidden cost" move can explain any deviation from the theorem, does the theorem actually generate any testable predictions about behavior, or is it purely a normative benchmark that no human ever meets?

  *   **Follow-up:** If it's purely normative, why should we care about it as a description of rationality? Is it possible that "rationality" sometimes requires ignoring free evidence to maintain commitment devices or mental stability, and if so, isn't Good's definition of rationality too narrow?

  ### 6. The Hirshleifer Effect (Social vs. Private)
  **Question:** I want to shift to multi-agent settings. Hirshleifer pointed out decades ago that information which is privately valuable in Good's sense can be socially destructive because it destroys risk-sharing opportunities before uncertainty resolves. If I know you're sick before the insurance pool is formed, I won't insure you. Your book defends the unrestricted value of information, but does it account for the fact that my private gain from information might be a net social loss?

  *   **Follow-up:** If you concede that information can be socially bad, does that undermine the policy upshot of your book? If the Principle of Total Evidence leads to Pareto-inferior equilibria in general equilibrium, why should we treat it as a principle of *rationality* rather than just a feature of partial equilibrium analysis?

  ### 7. Policy Implications of Hirshleifer
  **Question:** To press that policy point: If Good's Theorem holds for the individual but fails for the group due to strategic externalities, does your defense of "unrestricted evidence" inadvertently argue against things like insider trading bans or medical privacy laws? Where do you draw the line between "rational information acquisition" and "socially destructive signaling"?

  *   **Follow-up:** If you say "that's outside the scope of the theorem," isn't that an admission that the theorem is too fragile to carry the philosophical weight you're placing on it? Can a theorem about rationality be valid if it ignores the strategic context in which rational agents operate?

  ### 8. Logical Omniscience and Processing Costs
  **Question:** One angle I don't see addressed enough is computational complexity. Good's theorem assumes the agent knows the likelihood ratio of the evidence for every hypothesis. But in real science or economics, "looking" often means running a model or deriving a proof. If the agent is boundedly rational and might *misinterpret* the evidence, does the theorem still hold? Or does the "free evidence" assumption implicitly require logical omniscience?

  *   **Follow-up:** If it requires logical omniscience, doesn't that make the theorem irrelevant for actual scientific inquiry, where the value of evidence lies precisely in the fact that we *don't* already know what it implies?

  ### 9. Ambiguity and Non-Bayesian Updating
  **Question:** Finally, let's talk about ambiguity aversion. A MaxMin Expected Utility agent (Gilboa-Schmeidler) can strictly prefer not to receive free information because the signal might shift their set of priors in a way that exposes them to worse-case scenarios they were previously hedged against. Do you view ambiguity-averse agents as irrational, or do you concede that Good's Theorem simply doesn't apply to them? If the latter, how significant is the result if it doesn't cover agents who are averse to model uncertainty?

  *   **Follow-up:** If you say they are irrational, aren't you defining rationality as "obedience to Bayesian axioms" rather than "success in the environment"? If an ambiguity-verse agent survives better in volatile markets by ignoring noise, isn't their avoidance of information actually the more robust strategy?
