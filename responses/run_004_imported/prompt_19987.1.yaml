answer: |-
  **The Text and the Shadow: Interpreting the Constitution in the Shadow of Slavery**

  The schism that tore through the abolitionist movement in the early 1850s was not merely a tactical disagreement over voting or disunion; it was a fundamental dispute over legal hermeneutics. On one side stood William Lloyd Garrison and Wendell Phillips, who argued that the U.S. Constitution was a "covenant with death," a pro-slavery compact that morally obligated abolitionists to reject the Union. On the other stood Frederick Douglass, influenced by Gerrit Smith and Lysander Spooner, who came to view the Constitution as a "glorious liberty document," capable of being wielded as a weapon against slavery if read correctly.

  Your professor's framing of Douglass as simply "right" and Garrison as a "purist" glosses over the profound legal complexity of the debate. As your study group noted, there is a striking irony here: Garrison, the radical moralist, employs an interpretive method that resembles modern originalism (focusing on the framers' intent and the historical deal struck), while Douglass, the pragmatist, employs a method that blends strict textualism with natural law theory. To determine which reading holds up on interpretive merits alone, we must strip away the moral outcomes and examine the legal coherence of each argument. When subjected to the rigors of legal interpretation, Douglass's reading is the more robust constitutional theory, not because it is morally preferable, but because it adheres more strictly to the rules of textual authority and enumerated powers, whereas Garrison's reading conflates historical context with legal sanction.

  **The Garrisonian Case: The Originalist Compromise**

  The strength of the Garrisonian position lies in its historical honesty and its reliance on the "original understanding" of the document. Garrison and Phillips argued that a legal document cannot be divorced from the context of its creation. In 1787, the framers explicitly negotiated protections for slaveholding interests to secure Southern ratification.

  Garrison's textual evidence is undeniable on its face. The Three-Fifths Clause (Article I, Section 2) augmented the political power of slave states in the House and Electoral College. The Fugitive Slave Clause (Article IV, Section 2) mandated the return of "persons held to service or labor," effectively constitutionalizing a property right in human beings across state lines. The Insurrection Clause (Article I, Section 8) allowed the federal government to use the militia to suppress domestic violence, which included slave rebellions. Finally, the Slave Trade Clause (Article I, Section 9) prohibited Congress from banning the importation of enslaved people for twenty years.

  For Garrison, these were not ambiguous loopholes; they were features. His interpretive method asks: *What was the deal?* The deal was that the federal government would protect the institution of slavery where it existed. To argue otherwise, Garrisonians claimed, was to engage in wishful thinking. They pointed to the Supreme Court's decision in *Prigg v. Pennsylvania* (1842) and later *Dred Scott* (1857) as proof that the highest legal authorities understood the Constitution as pro-slavery. For Garrison, the "intent" of the framers and the operational reality of the government trumped the abstract language of the Preamble. If the text protects the return of a fugitive slave, the document is, in operation, pro-slavery. This is a consequentialist and originalist reading: the meaning of the law is found in what it was designed to do and what it actually did.

  **The Douglass-Spooner Case: The Textualist Silence**

  Frederick Douglass's shift in 1851 was not a abandonment of principle, but a refinement of legal theory. Along with Lysander Spooner, Douglass argued that the Constitution must be read as a standalone legal instrument, distinct from the private intentions of the framers or the immoral customs of the states.

  The core of the Douglass argument is textual silence. The words "slave" or "slavery" appear nowhere in the Constitution. The document refers instead to "persons," "citizens," and "people." Spooner, a legal theorist, argued that under English common law principles, statutes must be interpreted in favor of liberty when ambiguous. If the text does not explicitly authorize the holding of property in man, the federal government has no constitutional authority to recognize it.

  Douglass expanded this by pointing to the Preamble. For Douglass, the Preamble was not mere decoration but the statement of the document's *telos* (purpose): to "establish Justice" and "secure the Blessings of Liberty." He argued that the specific clauses Garrison cited were not sanctions of slavery, but temporary tolerations of a state-level anomaly that the federal government had no power to create or sustain. For example, the Fugitive Slave Clause did not define *who* was a fugitive; it merely created a duty between states regarding "persons held to service." If state laws defining slavery were themselves violations of natural law (which the Constitution's principles implied), then the federal clause could not legitimately be used to enforce them.

  This is where your study group's intuition about "living constitutionalism" is insightful, but perhaps slightly off-mark. Douglass was not arguing that the meaning *changed* over time; he argued that the *true* meaning had been obscured by the "slave power." He was a textualist who believed the words, read plainly without the lens of racial prejudice, could not bear the weight of slavery. He posited a federalism argument: slavery was a creature of state law, and the federal Constitution granted no power to the national government to legislate for slavery, only to limit it.

  **The Interpretive Verdict**

  So, who is the better interpreter? If we bracket the moral horror of slavery and ask strictly about *constitutional interpretation*, Douglass's reading holds up better than Garrison's.

  Garrison's argument fails on a specific point of legal theory: it conflates *toleration* with *authorization*. A constitution of enumerated powers (which the 1787 document was) grants the federal government specific authorities. Nowhere does the Constitution grant the federal government the power to establish slavery. The clauses Garrison cites are defensive; they limit the federal government's ability to *interfere* with slavery in the short term (the 1808 clause) or require cooperation between states (the Fugitive Clause). They do not affirm slavery as a national institution. Garrison reads the Constitution as a reflection of social reality; Douglass reads it as a constraint on government power. In legal terms, Douglass is correct that the text does not grant the affirmative power to create or maintain slavery.

  Furthermore, Garrison's reliance on "original intent" is legally precarious. The secret intentions of the framers are not law; the ratified text is. As Douglass argued in his 1860 Glasgow speech, "I care not for the intentions of the framers... I take the text." If the text uses euphemisms ("persons held to service") rather than explicit property language, a rigorous textualist must respect that distinction. To import the word "slave" into the text is to amend the Constitution without process. Garrison's reading requires the interpreter to look *behind* the text to the historical compromise, whereas Douglass's reading requires the interpreter to look *at* the text. In a system governed by the Rule of Law, the latter is the more coherent interpretive stance.

  However, the user's study group is right to note that Douglass relies heavily on the Preamble and natural law. Is this "living constitutionalism"? Not exactly. It is better described as *normative textualism*. Douglass argues that the general principles of the text (Liberty, Justice) control the specific clauses. This is a valid canon of construction: specific provisions should not be read to violate the overarching purpose of the instrument unless the language is explicit. Since the language regarding slavery is *not* explicit (using euphemisms instead), the overarching purpose of Liberty should control. Garrison ignores the Preamble entirely; Douglass integrates it. A holistic reading of a legal document is generally superior to a fragmented one.

  **Conclusion**

  Garrison was historically right, but Douglass was legally right. Garrison correctly identified that the *political reality* of 1787 was a pro-slavery compromise. He accurately predicted that the government would function to protect slaveholders. But as a matter of *constitutional interpretation*, his method was flawed. He allowed historical context to override the plain text and the structure of enumerated powers.

  Douglass's reading holds up better because it treats the Constitution as a law of limited powers. He correctly identified that the document contains no affirmative grant of power to support slavery, and that the euphemistic language of the clauses leaves room for a liberty-oriented construction. While Garrison's reading aligns with the cynical reality of how the government *acted*, Douglass's reading aligns with how a constitutional text *must be read* to maintain legal legitimacy. Douglass demonstrated that the Constitution did not need to be burned to end slavery; it needed to be enforced according to its own textual limits. In the end, the "Glorious Liberty Document" argument is the stronger legal theory because it insists that the text itself, not the shadow of the framers' intentions, is the law.
