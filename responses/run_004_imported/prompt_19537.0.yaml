      *   **Constraints/Wishes:** No talk of heaven, no reunion with deceased uncle, no "comforting lies." However, it shouldn't be cold or academic. It should reflect Eliot's idea of the "choir invisible" (living on through impact on the living).
      *   **Audience:** ~80 people. Half are religious family (seeking comfort in their idiom), half are secular academics/students (will spot insincerity or academic flattening).
      *   **Tone:** Specific, loved, warm but honest. Not a lecture, not a sermon.
      *   **Length:** 5-7 minutes spoken (approx. 750-1000 words at a moderate pace).

  2.  **Determine the Core Tension & Resolution:**
      *   *Tension:* How to honor a secular humanist's specific worldview without alienating religious relatives who want traditional comfort, and without boring them with literary theory.
      *   *Resolution:* Focus on *love* and *memory* as the tangible forms of immortality. Use Eliot's concepts but translate them into the language of human relationship. The "choir invisible" isn't a theological claim; it's a description of how love ripples outward. This satisfies the academics (accurate to Miriam/Eliot) and the family (comforting focus on legacy and love).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the gathering. Establish Miriam's presence. Avoid "she is looking down on us." Instead, "she is here in us."
