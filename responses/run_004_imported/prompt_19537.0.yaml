answer: |-
  Thank you all for being here. For those who knew Miriam only as an aunt or a sister, this room might feel a bit like a classroom. For those who knew her only as a professor, it might feel a bit like a family reunion. But that intersection—that place where the life of the mind met the life of the heart—is exactly where Miriam lived. So, this is the right place for her.

  Miriam taught Victorian literature for thirty years. If you ask her former students what she taught them, they will tell you she taught them how to read closely, how to argue fairly, and how to respect the complexity of a human soul. But if you ask Miriam what she studied, she would have told you she was studying how to live.

  Her compass for this was George Eliot. Miriam didn't just love Eliot's novels; she was devoted to Eliot's courage. She was fascinated by the moment Eliot stepped away from the certainty of her childhood faith. Miriam admired the cost of that honesty—the rift with her father, the social exile, the terrifying freedom of standing before the universe without a promise of reward.

  There is a story Miriam loved to tell, about Eliot speaking to a friend in a Cambridge garden. She said that of the three words *God*, *Immortality*, and *Duty*, the first meant nothing to her, the second she could not credit, and the third was nevertheless absolute and unyielding.

  Miriam asked us not to soften that stance today. She did not believe she was going to a better place, and she did not believe she was waiting for us on the other side. She would have called that a comforting lie, and she valued truth over comfort. But—and this is the vital part—she did not believe that the absence of an afterlife meant the absence of meaning. Quite the opposite.

  For Miriam, because this life was the only one we had, our duty to each other was sacred. When she spoke of "Duty," she didn't mean grim obligation. She meant the active, daily choice to care for people. She meant showing up. She meant that when you cannot pray for someone, you work for them. When you cannot promise them heaven, you make earth habitable for them.

  She found her hope in Eliot's idea of the "choir invisible." The belief that we survive not in a distant paradise, but in the memories, habits, and kindnesses we leave behind in the people who remain.

  Looking around this room, I realize that Miriam's version of immortality is already underway.

  To her siblings and her nieces and nephews: Miriam's immortality is in the way you argue a point, the way you protect your family, and the way you value honesty even when it is difficult. She is in the books on your shelves and the standards you hold for yourselves. She was a devoted sister who proved that you can disagree on theology and still be bound by blood and love.

  To her students and colleagues: Her immortality is in the papers you write, the classes you teach, and the way you treat a young scholar who is unsure of themselves. She is in the rigor you bring to your work and the compassion you bring to your peers.

  Miriam was not a cold woman. She did not retreat into her books to escape people; she read to understand them better so she could love them more accurately. I remember her not at a lectern, but in her kitchen, grading papers while a pot of soup simmered, stopping to ask me about my life with a focus that made me feel like the only person in the room. She listened the way she read: intensely, generously, looking for the truth beneath the surface.

  She spent sixty years declining to believe in a divine plan, but she never declined to believe in *us*. She believed that we are responsible for each other. She believed that kindness is not a transaction for a reward, but the only rational response to the fragility of life.

  So, how do we say goodbye to someone who didn't believe in goodbyes in the eternal sense?

  We acknowledge that the light she carried is not extinguished; it has simply been passed on. We honor her by refusing to be vague. We honor her by refusing to pretend. And we honor her by recognizing that the "choir invisible" is not a metaphor for the dead. It is a job description for the living.

  Miriam mattered because she made us matter. She made her students feel capable. She made her family feel known. She made her friends feel heard. As long as we treat each other with the seriousness and the tenderness that she showed us, she remains here.

  She wanted no flowers sent to heaven, because she didn't think they would arrive. But she would appreciate the flowers we give to each other while we are here to smell them. She would appreciate the work we do, the love we offer, and the truth we tell.

  Miriam's story has ended, but the influence of it is still being written. It is being written by the way we walk out of this room and treat the next person we meet. If we are a little more honest, a little more dutiful, and a little more kind because she was here, then she has not died. She has simply joined the choir, and we are left with the singing.

  Thank you.
