  4.  **Drafting - Specific Considerations for the Audience:**
      *   *For the Religious Family:* Use words like "faithful," "devotion," "sacred," "spirit" (in a humanistic sense). Emphasize that her lack of belief didn't mean a lack of love.
      *   *For the Academics:* Don't dumb down the Eliot references. Quote the "God, Immortality, Duty" triad accurately. Acknowledge the translations.
