      *   **The Creed (The Myers Story):** This is crucial. It needs to be stated clearly but gently. It defines her honesty. Connect "Duty" to "Care."
      *   **The "Choir Invisible":** This is the bridge. Explain that for Miriam, surviving death meant living on in the actions of others. This is the "comfort" for the religious side (legacy) and the "truth" for the secular side (no afterlife).
