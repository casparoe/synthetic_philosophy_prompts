      *   Mention "Expected Utility Theory."
      *   Highlight the assumption of "costless processing." That's the killer. Information is free, but *processing* it is not.

  7.  **Final Polish:**
      *   Make sure to congratulate the user on the book (lighthouse keeper novel sounds nice).
      *   Ensure the distinction between *instrumental value* (changing outcomes) and *intrinsic value* (curiosity) is clear.
      *   Emphasize that protecting the drafting phase of Book 3 is a rational business decision.

