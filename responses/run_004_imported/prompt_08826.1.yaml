answer: |-
  The normative force of the Bayesian conservation of expected evidence (CEE) rests on a specific epistemic distinction: the difference between information that is *possessed* and information that is *obtained*. In the standard framework, if an agent knows today that she will assign probability $p$ to $\phi$ tomorrow, she ought to assign $p$ today. To do otherwise is to leave epistemic value on the table. The justification is that the future credence is driven by evidence $E$ that will arrive tomorrow. If the arrival of $E$ is predictable today, then the informational content of $E$ is, in a crucial sense, already available. The Bayesian norm demands we update on what we know, not merely on what we have physically observed. The "conservation" principle vindicates belief revision because it ensures the agent is maximally responsive to all *available* evidence.

  Your classmate's objection attempts to bridge the gap between empirical and logical uncertainty by redefining the scope of "evidence." On this view, for a computationally bounded agent, the output of a deduction step *is* new evidence. Just as a telescope reveals stars that were physically present but optically inaccessible, a proof search reveals logical relations that were mathematically present but computationally inaccessible. Therefore, a logical inductor's shift in credence upon completing a deduction is analogous to a Bayesian updating on a new observation. Since the agent could not have "seen" the proof yesterday without running the computation, the evidence was not "already available," and CEE does not demand the update happen sooner.

  This defense is compelling insofar as it treats computational resources as an epistemic constraint akin to sensory limitations. However, it ultimately fails to vindicate logical induction as an extension of *rationality* in the Bayesian sense, because it conflates *ontological* availability with *procedural* accessibility. In the empirical case, the evidence $E$ does not exist for the agent until the causal interaction occurs; the world is contingent. In the logical case, the proof exists timelessly. The relationship between the axioms and $\phi$ is fixed at $t=0$. When the logical inductor updates at $t=n+1$ based on a proof found at $t=n$, it is not reacting to a new fact about the world, but rather overcoming a limitation in its own processing power.

  The Bayesian CEE norm is demanding precisely because it ignores processing costs; it dictates what one *should* believe given what one *knows*. By restricting the Logical Induction Criterion to *efficiently* computable traders, Garrabrant et al. effectively build the computational limitation into the definition of rationality. They ensure that no *feasible* trader can exploit the inductor. But this guarantees only that the inductor is unexploitable *given its resource constraints*, not that it is responsive to all *logically* available evidence.

  This is where the disanalogy bites. In the Bayesian case, if I can predict my future belief, I am irrational for not holding it now, because the evidence is effectively mine. In the logical induction case, if I can predict my future belief (say, by running a slower version of the same algorithm), the Logical Induction Criterion does *not* demand I update now, provided the prediction strategy is not "efficient" enough to count as a valid trader. The formalism excuses the agent for failing to use evidence that is, in principle, derivable from their current state.

  Your classmate argues this makes computation "genuine evidence." But this stretches the notion of evidence until it loses its normative bite. If "evidence" includes any fact that requires computation to derive, then logical omniscience becomes impossible by definition, and the norm of updating on all available evidence becomes vacuous. The Bayesian ideal serves as a regulative principle: it tells us we *ought* to minimize the gap between available information and belief. Logical induction, by contrast, codifies the gap. It says the agent is rational *even if* they ignore derivable truths, so long as ignoring them doesn't allow an efficient exploitation.

  Therefore, while logical induction satisfies a mathematical analogue of CEE, it lacks the philosophical payoff. It does not show that deductive belief revision is rational in the sense of being responsive to all available reasons. Instead, it shows that deductive belief revision is *computationally sustainable* for bounded agents. It solves the problem of how to manage uncertainty without omniscience, but it does so by lowering the bar for rationality rather than extending the Bayesian account of evidence. The "conservation" holds not because the agent is perfectly attuned to the logical landscape, but because the market rules forbid traders from pointing out the agent's blind spots unless they can do so quickly. This is a pragmatic virtue, but it is not the epistemic virtue that conservation of expected evidence was originally meant to capture.
