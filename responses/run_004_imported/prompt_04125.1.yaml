answer: |-
  That is a fantastic rabbit hole. The Turing $\rightarrow$ I.J. Good connection is one of the great lineage stories of modern decision theory. Good was indeed Turing's colleague at Bletchley Park, and he later became a pioneer in artificial intelligence and Bayesian statistics.

  You have grasped the core of **Good's Theorem** (often called the *Value of Information* theorem) correctly. In essence, it states that for a rational agent maximizing expected utility, the expected value of obtaining free, relevant information is always non-negative. You should never expect to be worse off by knowing more before you act.

  However, to answer your main question: **No, your friend avoiding a medical test or you avoiding checking a grade does not necessarily make you "irrational."**

  Here is why the theorem holds up mathematically but often breaks down (or requires modification) when applied to actual human psychology and daily life.

  ### 1. Information is rarely "free"
  Good's Theorem assumes the information is **costless**. In the real world, acquiring information almost always has a cost.
  *   **The Grade:** Checking the grade costs you 30 seconds, but it might cost you three days of ruinous anxiety if the number is lower than you hoped.
  *   **The Medical Test:** The test costs money and time, but the *result* carries an "emotional tax."

  If you include **psychological distress** as a "cost" in the equation, avoiding information can be perfectly rational. If the anxiety of knowing a bad outcome outweighs the benefit of being able to plan for that outcome, the "net value" of the information becomes negative.

  ### 2. Humans derive utility from *beliefs*, not just outcomes
  Standard decision theory assumes you only care about the state of the world (e.g., "Am I healthy?"). But humans care about their *mental state* regarding the world (e.g., "Do I *feel* healthy?").
  *   **Hope has value:** If there is a 10% chance you have a condition and a 90% chance you don't, living in the 90% "ignorance" zone might allow you to function happily.
  *   **The "Ostrich Effect":** If the condition is untreatable, knowing the truth changes the *outcome* (you still get sick) but destroys the *experience* of the time remaining. In this case, "blissful ignorance" is a genuine utility gain. Good's theorem usually models utility based on external consequences, not internal peace of mind, unless you explicitly build "peace of mind" into your utility function.

  ### 3. Bounded Rationality (We are bad Bayesians)
  Good's Theorem assumes a **perfect Bayesian updater**. This means the agent will take the new data and update their probabilities perfectly logically.
  *   **Humans are not perfect Bayesians.** We suffer from cognitive biases.
  *   **Noise vs. Signal:** If you check your investment portfolio every day (more information), you aren't making better long-term decisions. You are exposing yourself to market noise, which triggers loss aversion. You might panic-sell because you saw a red arrow, even if the long-term thesis hasn't changed.
  *   **Analysis Paralysis:** Sometimes, more information leads to worse decisions because it overloads our cognitive processing. We freeze or make impulsive choices to relieve the stress of uncertainty. In this case, the *processing cost* violates the theorem's assumptions.

  ### 4. Actionability (Can you actually do anything?)
  The value of information comes from the ability to **change your action** based on that information.
  *   **Scenario A (Actionable):** You think your car has a flat. Checking allows you to change a tire. Information is valuable.
  *   **Scenario B (Non-Actionable):** You think you have a terminal, untreatable genetic disease. Checking confirms it. You cannot change the outcome. You can only change your *preparation*.

  If you value "living in the moment" over "preparing for the end," the information has low instrumental value. Your friend avoiding the health test might subconsciously recognize that if the news is bad, there is nothing she can do to stop it, so she prefers to preserve her current quality of life.

  ### 5. Strategic Ignorance
  There is a fascinating concept in game theory called **Strategic Ignorance**. Sometimes, not knowing something is a tool to help you stick to a commitment.
  *   **Example:** You are trying to save money. If you look at your bank account every day, you might see a fluctuation that tempts you to spend ("Oh, I have a bit extra today"). By *not* looking, you force yourself to stick to your budget.
  *   **Example:** A partner might choose not to ask about their spouse's past relationships. Knowing the details might introduce jealousy that damages the current relationship, without providing any benefit to the future.

  In these cases, you are effectively pre-committing to a strategy that requires ignorance to function.

  ### The Verdict
  Good's Theorem is a **normative** claim (how an idealized mind *should* work), not a **descriptive** one (how humans *do* work).

  *   **For an AI or a Robot:** Good's Theorem holds. They should always take the free sensor data.
  *   **For a Human:** The theorem only holds if you account for emotional costs, processing limits, and the utility of hope.

  So, is your friend irrational? **No.** She is likely optimizing for **emotional utility** rather than **informational utility**. She is trading "accuracy of belief" for "quality of present experience." As long as she understands the trade-off, that is a rational human decision, even if it violates the strict math of a Bletchley Park Bayesian.

  I.J. Good would probably smile at that. He was deeply interested in the hierarchy of intelligence, and he understood that "rationality" includes knowing when the math doesn't capture the whole picture of being human.
