answer: |-
  This is not a dumb question. In fact, you have accidentally stumbled directly into the central problem of legal philosophy and the metaphysics of social rules. You are essentially living through a miniature version of the debates between legal positivists, natural law theorists, and constitutional originalists, all wrapped in a $600 fantasy football dispute.

  Since you work in ethics and political philosophy, I can skip the pop-philosophy analogies and speak directly to the structure of the problem. Here is how a philosopher of law/social ontology would likely dissect your situation.

  ### 1. The Metaphysics of Collective Intent
  Your core question is: *Is there a fact of the matter about what we collectively meant in 2013?*

  The short answer is: **Probably not.**

  In social ontology, "collective intentionality" is already a fragile construct. It usually requires some overlap in individual mental states directed at a shared goal. In 2013, you all shared a general goal ("establish a tie-breaker"), but regarding *this specific scenario* (the three-way tie with the weather reschedule), it is highly probable that **no cognitive state existed in any of your brains.**

  If none of you contemplated scenario X in 2013, there is no "fact" about how you intended to rule on scenario X. There is only a fact about the *text* you produced and the *general principles* you held. To insist there is a hidden fact waiting to be discovered (via better memory or an old email) is to commit a category error. You are looking for a specific coordinate on a map that wasn't drawn yet.

  This aligns with H.L.A. Hart's concept of the **"open texture" of law**. Rules have a core of settled meaning and a penumbra of doubt. In 2013, you defined the core. In 2024, you are in the penumbra. There is no "fact" in the penumbra until a decision is made to place one there.

  ### 2. Interpretation vs. Construction
  In legal theory, there is a crucial distinction between *interpretation* and *construction*.
  *   **Interpretation** is the cognitive act of discovering the semantic meaning of the text based on past intent.
  *   **Construction** is the normative act of determining legal effect when the text runs out or is ambiguous.

  Your group is fighting because everyone claims to be doing *interpretation* ("I know what we meant!"). But because the scenario was unanticipated, you are actually forced into *construction*. You aren't finding the rule; you are making it.

  The feeling that there *must* be a right answer is a psychological illusion (often called the "illusion of objectivity" in judgment). Everyone's memory is reconstructive, not reproductive. Their memories are aligning with their current interests because their brains are unconsciously back-filling the 2013 gap with 2024 desires.

  ### 3. Is the Resolution Arbitrary?
  If there is no fact of the matter about 2013 intent, does that mean any decision now is arbitrary?

  **No.** This is where your background in political philosophy helps. Even if the *originalist* inquiry fails, you can still apply **procedural** or **coherentist** justification.

  *   **Coherence (Reflective Equilibrium):** Which ruling fits best with the *spirit* of the other rules in your league? If your league values "strength of schedule," does Interpretation A align better with that principle than Interpretation B? You aren't looking for 2013 intent; you are looking for 2024 coherence with the existing system.
  *   **Procedural Justice:** Since the substantive rule is indeterminate, the legitimacy of the outcome depends entirely on the procedure used to resolve it. If you simply vote, the majority tyrannizes the minority. If the "commissioner" (if you had one) decided, it might look autocratic.

  ### 4. A Principled Way Forward
  Since you are the peacemaker, here is a proposal that acknowledges the philosophical reality without ruining the friendship:

  **Step 1: The Declaration of Indeterminacy**
  You need to explicitly state, as a group, that **the 2013 rule is legally insufficient for this case.**
  This saves face. It doesn't mean anyone was "wrong" about their memory; it means the *rule* was incomplete. This shifts the blame from the *people* (liars/gaslighters) to the *text* (ambiguous).

  **Step 2: Constructive Adjudication**
  Acknowledge that you are now legislating, not judging. You are amending the constitution retroactively.
  To do this non-arbitrarily, agree on a **tie-breaking meta-rule** for this specific decision.
  *   *Option A:* Split the pot. (Boring, kills the bragging rights).
  *   *Option B:* Vote. (Simple, but leaves 40% feeling robbed).
  *   *Option C:* The "Veil of Ignorance" Vote. Everyone votes on which rule they think is *better for the league long-term*, without knowing which rule benefits them *this year*. (This is hard to enforce, but you can ask them to argue from principle, not interest).

  **Step 3: The "Precedent" Compromise**
  If you must pick a winner, pick one based on which interpretation creates a better precedent for future years, **and** acknowledge the ambiguity.
  *   *The Kicker:* To soften the blow for the "losers" of the ruling, the winner of the pot could buy the first round of drinks at the draft next year, or the pot could be split 60/40 rather than 100/0.

  ### Summary for the Group Chat
  If I were in your shoes, I would send something like this:

  > "Look, I've thought about this like a lawyer. The truth is, in 2013 none of us imagined this specific three-way tie scenario. That means there isn't a 'hidden fact' about what we meant—our brains literally didn't go there. The rule has a gap.
  >
  > Arguing about memory is useless because our brains are filling in the gaps with what we want now. So we have to admit we aren't interpreting the old rule; we're amending it to cover a loophole.
  >
  > Since we can't find the 'right' answer, we need a fair process to pick one. Let's vote on which *principle* makes more sense for the league going forward, accept that the 2013 text doesn't decide it, and write the new clarification down immediately so this never happens again."

  ### The Philosophical Takeaway
  You asked if the question is confused. **Yes.** It presupposes a determinate collective intent where none existed.
  You asked if the resolution is arbitrary. **No.** It can be grounded in coherence with the league's values and procedural fairness.

  You are effectively drafting a constitutional amendment to resolve a judicial crisis. Act like a framer, not a judge. Good luck.
