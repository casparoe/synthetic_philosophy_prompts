prompt: |-
  So this happened to a friend of mine last year, and I can't stop turning it over in my head as a possible case study for my rational choice seminar -- even though on the surface it doesn't look like philosophy at all. My friend Dana and her brother jointly inherited their late mom's lake cottage. Neither of them wanted to just sell it and split the proceeds -- too much sentimental stuff wrapped up in who got to keep it -- so instead of working it out between themselves, they each hired a lawyer to fight for a bigger share in the court partition proceeding. Every time one lawyer filed a motion, the other side's lawyer fired back with a counter-motion, and the legal bills ticked up another few thousand each round. Neither would back down, because, as Dana put it to me, quitting now would mean everything she'd already spent was for nothing AND her brother would basically win. Eighteen months and something north of $70k combined in legal fees later -- on a cottage worth maybe $180k -- the place finally got sold off, with almost nothing left for either of them once the lawyers were paid. Dana told me that if she could redo it, she'd have walked away in month two and just eaten the loss.

  I mentioned all this to a colleague over coffee and she just shrugged and said "yeah, sunk cost fallacy, textbook case" and went back to her grading. That answer's been nagging at me since, though, because it doesn't quite capture what actually trapped them -- it wasn't just that each of them was anchored on money already spent, it was that they were reacting to eachother the whole way through. Is there a more specific structure at work here, something to do with this being a genuine contest between two parties rather than one person facing a private decision? And here's the part I really can't resolve: was there ever a point in those eighteen months where escalating was actually the individually rational move for Dana, fully anticipating how things would probably end -- or were she and her brother doomed the moment they each lawyered up, no matter how clearly either of them reasoned it through? I'd love your take, ideally with enough analytical bite that I can actually use it with my students, rather than landing on "they should've communicated better."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is teaching a rational choice seminar (philosophy/economics/political science context).
      *   **Case Study:** Two siblings (Dana and brother) inherit a cottage ($180k value). Instead of cooperating, they litigate. Legal fees exceed $70k combined. Net result: almost nothing left for either. Dana admits she should have quit early but didn't want to "let her brother win."
      *   **Current Explanation:** A colleague called it "sunk cost fallacy."
      *   **User's Critique:** "Sunk cost" is too individualistic. It ignores the *strategic interaction* between the two parties.
      *   **Key Questions:**
          1.  Is there a more specific structure/game theoretic model than sunk cost?
          2.  Was escalation *ever* individually rational at any point (anticipating the end)?
          3.  Were they doomed from the start (lawyering up)?
      *   **Desired Output:** Analytical bite, suitable for students, avoiding platitudes like "communicate better."

  2.  **Deconstruct the Scenario:**
      *   **Asset:** $180k cottage.
      *   **Cost:** Legal fees escalate over time ($70k+ combined).
      *   **Dynamic:** Action-Reaction (Motion/Counter-motion).
      *   **Motivation:** Financial gain + Relative Standing ("Brother would win").
      *   **Outcome:** Mutual destruction (Pyrrhic victory).

  3.  **Identify the Game Theoretic Structure:**
      *   *Sunk Cost Fallacy:* Yes, present, but insufficient. It explains why *one* person stays in a losing venture. It doesn't explain the *escalation* driven by an opponent.
      *   *Prisoner's Dilemma:* Close, but PD usually involves a one-shot choice to Cooperate or Defect. This is dynamic/sequential.
      *   *War of Attrition:* This is the strongest fit. Two players compete for a prize by incurring costs over time. The one who persists longer wins, but both pay the costs of the duration.
      *   *Dollar Auction:* Also very strong. Bidding on a dollar where both highest and second-highest bidders pay. Leads to irrational escalation beyond the value of the prize.
      *   *Commitment Problems/Credible Threats:* Each side needs to signal they won't back down to force the other to yield.

  4.  **Address Question 1: Is there a more specific structure?**
      *   **The Dollar Auction (Shubik):** This is the classic model for escalation of commitment in conflict. You bid $1 for a $1 bill. Highest bidder gets the bill, *second highest also pays their bid*. Once bids pass $0.50, logic breaks down.
      *   **War of Attrition:** A biological/economic model where two animals fight over a resource. Cost accumulates over time. Winner takes resource, loser gets nothing but pays cost.
      *   **Why these fit better than Sunk Cost:** They incorporate the *strategic interdependence*. My payoff depends on *your* decision to quit, not just the absolute value of the asset.
      *   **The "Relative Utility" Factor:** Dana said, "her brother would basically win." This implies her utility function isn't just $Money, it's $Money - $Brother'sMoney (or Status). This transforms a negative-sum game into a status competition.

  5.  **Address Question 2: Was escalation ever individually rational?**
      *   **Early Stage:** Yes. At Month 1, spending $5k to secure a $90k share (half of 180k) is rational *if* probability of winning is high.
      *   **The Tipping Point:** Rationality holds as long as $Marginal Cost of Litigation < $Marginal Increase in Expected Value.
      *   **The Trap:** The *Expected Value* changes based on the opponent's behavior. If I spend $10k more, does it increase my share enough?
      *   **Rational Escalation:** It is rational to escalate *to signal resolve*. If I back down early, I get 0 (or a small share). If I escalate, I might force *you* to back down. This is a game of "Chicken."
      *   **The Error:** They failed to update beliefs. They treated it as a game of skill/merit rather than a cost-exhaustion game.

  6.  **Address Question 3: Were they doomed from the start?**
      *   **Institutional Structure:** Yes, once they hired adversarial lawyers in a partition action. The legal system is designed as a War of Attrition.
      *   **Nash Equilibrium:** In a Dollar Auction, the only way to win is not to play. Once playing, the equilibrium is often escalation.
      *   **Commitment Devices:** Lawyers act as commitment devices. "I can't settle, my lawyer says..." This removes the ability to de-escalate rationally.

  7.  **Drafting the Response (Iterative refinement for "Analytical Bite"):**
      *   *Introduction:* Validate the user's intuition. Sunk cost is necessary but not sufficient.
      *   *Model 1: The Dollar Auction.* Explain Shubik's model. It captures the "second highest bidder pays" dynamic (legal fees are paid regardless of winning).
      *   *Model 2: War of Attrition.* Focus on time/cost accumulation.
      *   *The Utility Function:* Crucial point. Dana cares about *relative* payoff (beating brother), not just *absolute* payoff. This makes the prize value subjective and potentially infinite (pride).
      *   *Rationality Analysis:* Distinguish between *ex-ante* (before lawyering up) and *ex-interim* (during the fight).
      *   *The "Doomed" Question:* Discuss the role of the lawyers as commitment mechanisms (Schelling).
      *   *Teaching Takeaway:* Give specific discussion questions for the seminar.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say "they were irrational." In game theory, rationality is about consistency with goals. If the goal includes spite, escalation can be rational.
      *   *Nuance:* The partition proceeding is key. In many jurisdictions, partition *forces* a sale if owners can't agree. So the "prize" shrinks over time for *both*. This is a negative-sum game.
      *   *Key Insight:* The "Sunk Cost" label ignores the *strategic necessity* of continuing to make the sunk cost matter. If I quit, I lose the sunk cost *and* the prize. If I stay, I might lose more sunk cost but win the prize. It's not just anchoring; it's a calculated gamble on the opponent's breaking point.

  9.  **Final Polish:** Ensure tone is academic but accessible. Use terms like "Nash Equilibrium," "Common Knowledge," "Signaling," and "Utility Function." Structure with clear headings. (This aligns with the user's need for a seminar case study).

  10. **Final Review against constraints:**
      *   Did I answer the "specific structure" question? Yes (Dollar Auction/War of Attrition).
      *   Did I answer the "rational move" question? Yes (Signaling/Chicken).
      *   Did I answer the "doomed" question? Yes (Institutional design/Commitment).
      *   Is it useful for students? Yes, includes teaching angles.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Your colleague's diagnosis is correct as far as it goes, but you are right to press further. Labeling this "sunk cost fallacy" treats Dana's decision as a solitary cognitive error, like buying a bad stock and holding it too long. But this wasn't a solitary decision; it was a **strategic interaction**. Dana wasn't just fighting the math; she was fighting an opponent who was simultaneously fighting her.

  For a rational choice seminar, this is a goldmine because it exposes the limits of standard expected utility theory when applied to dynamic, adversarial contexts. Here is an analytical breakdown you can use to structure the discussion, moving from the game structure to the rationality of escalation.

  ### 1. The Structure: It's Not Sunk Cost, It's a "Dollar Auction"
  The specific game-theoretic structure at work here is Martin Shubik's **Dollar Auction**.

  In the Dollar Auction, an auctioneer sells a dollar bill. The highest bidder gets the dollar, but *the second-highest bidder also has to pay their bid* and gets nothing.
  *   **The Trap:** Bidding starts at 10 cents. Profit is obvious. But once bids hit 90 cents and $1.00, the logic flips. If you bid $1.00 and I bid $1.10, I lose 10 cents, but if I stop, I lose my previous 90 cents. To minimize loss, I bid $1.20.
  *   **Application to Dana:** The cottage is the dollar. The legal fees are the bids. Crucially, in litigation, **both sides pay their own costs regardless of the outcome.**
  *   **Why "Sunk Cost" is insufficient:** In a standard sunk cost scenario, I throw good money after bad because I'm emotionally anchored. In a Dollar Auction, I throw good money after bad because **quitting crystallizes the loss, while escalating keeps the hope of recoupment alive.** Dana wasn't just ignoring the past; she was making a forward-looking calculation that paying another $5k might force her brother to fold, allowing her to recover the $50k she already spent.

  **Seminar Angle:** Ask students to map the "bids." At what exact dollar amount does the rational strategy shift from "bid to win" to "bid to minimize loss"? (Spoiler: In a perfect information game, the rational move is not to bid at all. But once bidding starts, escalation is the only dominant strategy.)

  ### 2. The Utility Function: Relative vs. Absolute Payoffs
  You noted Dana's comment: *"Quitting now would mean... her brother would basically win."*

  This is the critical variable your colleague missed. If Dana's utility function were purely absolute financial gain ($U = Wealth$), she should have settled the moment Legal Fees > Expected Gain. But her utility function appears to be **relative**: $U = (My Share) - (Brother's Share)$.

  *   **The Transformation of the Game:** If Dana values "beating her brother" as a positive utility, the cottage isn't worth $180k to her; it's worth $180k + $V(Pride) + $V(Spite).
  *   **Rational Escalation:** If $V(Spite)$ is high enough, spending $70k to ensure her brother gets $0 is rational. She effectively paid $35k (her half of fees) to deny him $90k. If her utility from denying him $90k exceeds the cost of $35k, she acted rationally according to her preferences.
  *   **The Problem:** This turns a Positive-Sum Game (split the house) into a Negative-Sum Game (destroy the value to punish the other).

  **Seminar Angle:** Have students rewrite the payoff matrix. If you include "Relative Status" as a variable, does the Nash Equilibrium change? (Yes. It shifts from *Cooperate/Cooperate* to *Defect/Defect* even when both know it leads to ruin.)

  ### 3. Was Escalation Ever Rational? (The Interim Rationality Problem)
  You asked if there was ever a point where escalating was individually rational. The answer is **yes, but only under conditions of imperfect information.**

  This is a **War of Attrition**. In this game, two players incur costs over time. The one who persists longer wins the prize.
  *   **The Logic of Escalation:** To win a War of Attrition, you must convince the opponent that you are willing to suffer more pain than they are. If Dana backs down in Month 2, she signals "I have a low pain threshold." Her brother, sensing weakness, will push harder next time.
  *   **Signaling Resolve:** Spending $10k in Month 3 isn't just about the legal motion; it's a **signal**. It says, "I am the type of player who spends $10k to win $5k." If that signal is credible, the brother *should* rationally fold in Month 4 to save his own money.
  *   **The Failure:** The escalation was rational *as a signaling strategy*, but it failed because the signal was never believed. Both sides signaled "I will burn the house down," and both called the bluff.

  **Seminar Angle:** Discuss **Common Knowledge of Rationality**. If Dana knows her brother is rational, she knows he knows the pot is shrinking. Therefore, he should fold. But he doesn't fold. Why? Either he is irrational (spite), or he knows Dana is irrational (committed). This leads to the concept of the **Madman Theory**—sometimes it is rational to appear irrational to force a concession.

  ### 4. Were They Doomed the Moment They Lawyer Up? (Commitment Devices)
  This is the darkest part of the analysis for your students. You asked if they were doomed from the start. **Structurally, yes.**

  By hiring lawyers, they inadvertently employed **Schelling Commitment Devices**.
  *   **Delegated Agency:** A lawyer's fiduciary duty is to zealously advocate, not to maximize the client's net emotional/financial welfare. Once Dana hired a lawyer, she effectively cut off her own ability to de-escalate. To settle early is to admit the lawyer's previous work was wasteful.
  *   **The Principal-Agent Problem:** The lawyers had an incentive to continue the War of Attrition (billable hours), while the principals (Dana/Brother) had an incentive to stop. However, the principals could not coordinate to stop because they didn't trust each other.
  *   **Institutional Design:** A partition action is designed to be adversarial. The court does not care about the net equity remaining; it cares about due process and motions filed. The system itself incentivizes the Dollar Auction.

  **Seminar Angle:** Introduce Thomas Schelling's *The Strategy of Conflict*. Discuss how limiting your own options (hiring a aggressive lawyer) can be a strategic advantage (making your threat to fight credible), but how it becomes a trap when *both* sides do it. They mutually handcuffed themselves.

  ### Summary for the Seminar
  If you want to move your students beyond "they should have talked," frame the case around these three failures of rationality:

  1.  **Structural Failure:** They entered a **Dollar Auction** (negative sum) thinking it was a standard negotiation (positive sum).
  2.  **Informational Failure:** They failed to update on the **Common Knowledge** that the asset was depreciating faster than the potential gain. They treated it as a game of skill, not a game of endurance.
  3.  **Preference Failure:** They allowed **Relative Utility** (spite/status) to override **Absolute Utility** (wealth), which is rational for the individual ego but catastrophic for the collective unit.

  **The Verdict:** Dana was not "irrational" in the sense of being crazy. She was trapped in a **subgame perfect equilibrium** of a War of Attrition where the only winning move was not to play. Once play commenced, escalation was the locally rational choice to minimize loss, even though it guaranteed global ruin. They were doomed the moment they externalized the conflict to third parties (lawyers) whose incentives were decoupled from the net value of the estate.

  This framing allows you to discuss how "rational" individual moves can aggregate into "irrational" collective outcomes, which is the heart of many social dilemmas.
