prompt: |-
  I've been working through David Lewis's *Convention* for a graduate seminar, and something's been nagging at me that I want to sort out. Lewis defines a convention as a regularity in behavior that persists because it solves a recurrent coordination problem: there are multiple possible equilibria, everyone prefers to conform if others do, and the actual one that gets selected is arbitrary (his classic examples are which side of the road to drive on, or which channel to call someone back on if a phone call drops). The whole apparatus rests on common knowledge of preferences and rationality, and on the idea that any alternative equilibrium would have worked just as well.

  My study group got into an argument about whether this picture actually captures what we ordinarily mean by "social norm," especially after one of us brought in Cristina Bicchieri's more recent work, where norms are sustained not just by coordinated self-interest but by conditional preferences tied to normative expectations — i.e., people conform partly because they believe others expect them to and would disapprove if they didn't, even in situations that aren't pure coordination problems with interchangeable equilibria (think fairness norms, or norms against queue-jumping, where there's a real mixed-motive structure and unilateral defection is tempting rather than just risky).

  Could you compare Lewis's account of convention with this broader notion of a social norm along these lines? I'm especially interested in: (1) whether Lewis's requirement of arbitrariness among equally good equilibria is doing real work, or whether it's too restrictive to explain norms that involve conflicts of interest rather than pure coordination; (2) how central common knowledge is to each account versus mere normative expectation; and (3) whether Lewis's theory should be read as a special case of a more general theory of norm-emergence, or whether it's actually picking out a genuinely distinct phenomenon that shouldn't be lumped in with norms like fairness or reciprocity at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Graduate seminar on David Lewis's *Convention*.
      *   **Core Issue:** Tension between Lewis's definition of convention and broader notions of social norms (specifically Cristina Bicchieri's work).
      *   **Lewis's Definition:** Regularity in behavior, recurrent coordination problem, multiple equilibria, preference to conform *if* others do, arbitrariness (alternative equilibrium would work just as well), common knowledge of preferences/rationality.
      *   **Bicchieri's Definition (implied/summarized):** Norms sustained by conditional preferences tied to normative expectations (belief others expect conformity + potential disapproval), applies to mixed-motive situations (not just pure coordination), includes fairness/reciprocity.
      *   **Specific Questions to Address:**
          1.  Is Lewis's "arbitrariness" requirement too restrictive for norms involving conflict of interest (mixed-motive)?
          2.  Role of Common Knowledge (Lewis) vs. Normative Expectations (Bicchieri).
          3.  Is Lewis's theory a special case of a general norm theory, or a distinct phenomenon?

  2.  **Initial Assessment & Theoretical Mapping:**

      *   *Lewis:* Game-theoretic, reductionist, rational choice foundation. Conventions are solutions to coordination games (like Driving Side, Phone Call Back). Key feature: *Arbitrariness*. If we drove on the left instead of the right, it would be just as good, as long as we all did it.
      *   *Bicchieri:* Psychological/Behavioral game theory. Distinguishes between *descriptive norms* (what others do) and *injunctive/normative norms* (what others think *should* be done). Key feature: *Conditional Preferences*. I follow the norm because I believe others expect it and will sanction me (or I feel guilt/shame). Applies to Prisoner's Dilemma-type situations (e.g., queuing, fairness).
      *   *The Conflict:* Lewis excludes norms where one equilibrium is strictly better than another (e.g., fairness vs. selfishness) or where there's a temptation to defect. Bicchieri includes these.
      *   *The "Arbitrariness" Clause:* This is the crux. For Lewis, if there's a moral reason to do $X$ over $Y$, it's not a convention. For Bicchieri, moral norms *are* social norms sustained by expectations.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the tension (it's a classic debate in philosophy of social science). State the thesis: Lewis provides a precise, narrow technical definition, while Bicchieri offers a broader psychological account. They are talking about overlapping but distinct categories.

      *   **Point 1: Arbitrariness and Mixed-Motive Situations.**
          *   *Lewis:* Arbitrariness is essential. It distinguishes conventions from moral rules or laws grounded in intrinsic value. Driving on the left vs. right is arbitrary. Stealing vs. not stealing is *not* arbitrary (one is morally worse).
          *   *Bicchieri:* Norms often solve mixed-motive games (like Prisoner's Dilemma or Trust Games). Queuing is the classic example. Defecting (cutting in line) gives individual gain but harms the group. The norm sustains cooperation.
          *   *Analysis:* Lewis's requirement *is* restrictive. It excludes "norms of fairness." If the seminar is asking "Is Lewis right about *all* norms?", the answer is no. If asking "Did Lewis define *convention* specifically?", he did. The user needs to know that Lewis intentionally carved out "conventions" from "norms" generally, though he thought conventions were a subset of norms. Bicchieri argues the psychological mechanism (expectations) is the same, even if the payoff structure differs.

      *   **Point 2: Common Knowledge vs. Normative Expectations.**
          *   *Lewis:* Requires *Common Knowledge* (CK). I know, you know, I know you know... This is a very high bar (logical omniscience-ish). It ensures stability in coordination without communication.
          *   *Bicchieri:* Focuses on *Empirical Expectations* (what others do) and *Normative Expectations* (what others think I should do). CK is not strictly required; empirical belief is enough. Sanctions (social disapproval) replace the pure payoff matrix of coordination.
          *   *Analysis:* Lewis's CK is often criticized as psychologically unrealistic. Bicchieri's model is more empirically grounded. Lewis needs CK to solve the "which equilibrium?" problem without communication. Bicchieri doesn't need to solve equilibrium selection in the same way because the *normativity* (the "ought") adds a payoff shift (shame/sanction) that makes conformity the dominant strategy (or at least preferred).

      *   **Point 3: Special Case vs. Distinct Phenomenon.**
          *   *View A (Subsumption):* Bicchieri sees Lewisian conventions as a subset of social norms where the normative expectation aligns perfectly with self-interest (coordination).
          *   *View B (Distinctness):* Some philosophers (like Margaret Gilbert or even Lewis himself, arguably) think moral norms are different in kind because they claim authority independent of popularity.
          *   *Synthesis:* Lewis's account is best read as a *special case* of equilibrium selection, but Bicchieri shows that the *psychological mechanism* (conditional preference based on expectations) unifies them. However, Lewis would resist calling fairness norms "conventions" because they lack arbitrariness.
          *   *Recommendation:* Treat Lewis as defining a specific *class* of norms (coordination conventions) and Bicchieri as defining the *mechanism* of normativity generally.

      *   **Conclusion:** Summarize. Advise on how to frame this in the seminar. (Lewis = precise, game-theoretic, narrow; Bicchieri = psychological, broad, empirical).

  4.  **Refining the Argument (Self-Correction/Nuance Check):**

      *   *Correction:* Did Lewis think conventions were the *only* norms? No, he acknowledged moral norms but wanted to isolate conventions.
      *   *Nuance:* Bicchieri distinguishes between *descriptive* and *injunctive* norms. Lewisian conventions are mostly descriptive (I do it because you do it). Bicchieri's social norms require the injunctive element (I do it because you *expect* me to). This is a crucial distinction for Point 2.
      *   *Nuance on Arbitrariness:* Lewis says a convention *could* have been otherwise. A moral norm (don't murder) *could not* have been otherwise (in the sense that there's a reason for it). But Bicchieri might argue even moral norms are contingent on social context. Stick to the definitions provided in the prompt to avoid getting bogged down in meta-ethics.
      *   *Tone:* Keep it academic but accessible (Graduate seminar level). Use terms like "payoff structure," "equilibrium selection," "conditional preferences."

  5.  **Final Polish:** Check against the three specific questions in the prompt to ensure all are answered clearly. (1) Arbitrariness/Conflict, (2) CK vs. Expectations, (3) Special Case vs. Distinct.

      *(Self-Correction during drafting)*: Make sure to mention that Lewis *does* allow for some preference ordering, but the key is that the *alternative equilibrium* is equally good. In mixed-motive, the alternative (defection) is individually better but collectively worse. This is the key distinction.

  6.  **Final Output Generation:** (Proceed to generate response based on these structured thoughts.)
answer: |-
  This is an excellent tension to identify, and it cuts to the heart of contemporary debates in the philosophy of social science and game theory. Your study group has hit on the primary fault line between the "Lewisian" tradition (conventions as equilibrium selection in coordination games) and the "Bicchieri" tradition (norms as conditional preferences sustained by expectations).

  Here is a breakdown of how Lewis's account compares with Bicchieri's broader notion of social norms, addressing your three specific points.

  ### 1. Arbitrariness and Mixed-Motive Situations

  **Lewis's Requirement:**
  For Lewis, arbitrariness is not just a feature of conventions; it is the *defining* feature that separates them from other regularities (like moral rules or laws grounded in intrinsic value). In a Lewisian convention (e.g., driving on the right), there are at least two equilibria (Right/Right and Left/Left). Crucially, the agents are indifferent between the two equilibria *ex ante*. They only care that they match. If driving on the left were objectively safer or more moral, it would cease to be a convention in Lewis's strict sense and become a rational or moral imperative.

  **Bicchieri's Challenge:**
  Bicchieri argues that this restriction is too narrow to capture the phenomena we ordinarily call "norms." Many robust social norms operate in **mixed-motive games** (like Prisoner's Dilemmas or Trust Games), not pure coordination games.
  *   **Example:** Queue-jumping. In a queue, the "norm" is first-come, first-served. However, unlike driving sides, there is a conflict of interest. I strictly prefer to cut in line (individual gain) even if you wait (collective loss). The equilibrium is not arbitrary; the cooperative equilibrium is collectively better, but the defective equilibrium is individually tempting.
  *   **The Mechanism:** For Bicchieri, the norm holds because I have a *conditional preference*: I prefer to wait *on the condition* that I believe others expect me to wait and will sanction me (via glare, confrontation, shame) if I don't.

  **Verdict:**
  Lewis's requirement of arbitrariness **is doing real work**, but it is work that excludes a vast category of social norms. Lewis is defining a specific *class* of norms (coordination conventions), whereas Bicchieri is defining the *psychological structure* of normativity generally. If your seminar is asking whether Lewis captures the ordinary concept of "social norm," the answer is **no**. He captures a specific subset where interests align perfectly once coordination is achieved. He cannot easily explain norms of fairness, reciprocity, or honesty without stretching the definition of "arbitrary" until it breaks.

  ### 2. Common Knowledge vs. Normative Expectations

  **Lewis: Common Knowledge (CK)**
  Lewis relies on a very strong epistemic condition: Common Knowledge.
  *   **Structure:** I know $P$, you know $P$, I know that you know $P$, ad infinitum.
  *   **Function:** CK is required to solve the equilibrium selection problem without communication. If we are trying to meet in New York and there are two famous landmarks, I need to know that you know that I know... that we both prefer the most salient one. Without CK, we might get stuck in infinite recursion ("I think he thinks I'll go to the Station...").
  *   **Critique:** Philosophers and psychologists often argue CK is psychologically unrealistic. Real agents have bounded rationality and cannot sustain infinite recursive loops.

  **Bicchieri: Empirical and Normative Expectations**
  Bicchieri lowers the epistemic bar but adds a normative layer. She distinguishes between:
  1.  **Empirical Expectations:** Beliefs about what others *will* do.
  2.  **Normative Expectations:** Beliefs about what others *think I ought* to do.
  *   **Function:** For a social norm to exist in Bicchieri's sense, I must conform because I believe others *expect* me to (Normative) and/or because I see others doing it (Empirical). Crucially, I do not need Common Knowledge. I only need a sufficiently high threshold of belief that sanctions or social disapproval will occur if I deviate.
  *   **Difference:** In Lewis's world, I conform because it is in my self-interest given your behavior (coordination). In Bicchieri's world, I conform because my preference ordering *changes* based on my beliefs about your expectations (internalized sanction/shame).

  **Verdict:**
  Lewis's CK is a **logical tool** to ensure stability in a coordination equilibrium. Bicchieri's expectations are **psychological drivers** that alter payoff structures. Lewis's model is more elegant mathematically but less empirically robust. Bicchieri's model explains why norms persist even when coordination isn't the primary benefit (e.g., why I don't steal even when I could get away with it—because I believe others expect me not to).

  ### 3. Special Case vs. Distinct Phenomenon

  This is the metaphysical heart of your seminar debate. There are two ways to read the relationship:

  **Reading A: Lewis as a Special Case (The Subsumption View)**
  On this view, Bicchieri is right. Lewisian conventions are simply social norms where the "normative expectation" aligns perfectly with "self-interest" in a coordination game.
  *   **Why:** Both accounts rely on conditional preferences ("I will do $X$ if you do $X$").
  *   **Implication:** We should use Bicchieri's broader framework as the general theory of norm-emergence and treat Lewis's conventions as a specific subset where the payoff matrix is symmetric and cooperative.
  *   **Support:** This fits well with evolutionary game theory, which shows how both coordination norms and cooperation norms can emerge via similar dynamic processes (replicator dynamics).

  **Reading B: Lewis as Distinct (The Pluralist View)**
  On this view, Lewis is picking out a genuinely distinct phenomenon that shouldn't be lumped in with fairness or moral norms.
  *   **Why:** The *source* of the normativity is different. In Lewisian conventions, the "ought" is purely hypothetical ("If you want to coordinate, you ought to drive on the right"). In moral/fairness norms, the "ought" often claims categorical authority.
  *   **Implication:** If we lump them together, we lose the ability to explain why we feel guilty violating a fairness norm but merely inconvenienced violating a convention. (e.g., I feel guilt if I cut in line; I feel annoyance if someone drives on the 'wrong' side of a wide empty road).
  *   **Support:** Margaret Gilbert's work on "joint commitment" often sides closer to Lewis here, arguing that conventions create a specific kind of obligation that is distinct from moral obligation.

  **Recommendation for the Seminar:**
  The most productive reading is likely a **hybrid**. Lewis provides the best account of *equilibrium selection* (how we pick one pattern over another), while Bicchieri provides the best account of *normative force* (why we feel bound to stick to it even when tempted).

  You should argue that Lewis's theory is **necessary but not sufficient** for a general theory of social norms.
  1.  **Necessary:** We need Lewis to explain how arbitrary patterns get established in the first place (the signaling/salience aspect).
  2.  **Not Sufficient:** We need Bicchieri to explain how those patterns become robust against defection in mixed-motive situations (the sanction/expectation aspect).

  ### Summary for Your Argument

  If you want to synthesize this for your group, you might frame it this way:

  > "Lewis defines convention as a **solution to a coordination problem**, whereas Bicchieri defines a social norm as a **solution to a motivation problem**.
  >
  > Lewis's requirement of arbitrariness restricts his theory to situations where our interests already align once we coordinate. This makes his theory too restrictive to cover norms of fairness or honesty, where interests conflict and conformity requires overcoming temptation.
  >
  > However, Lewis's insight into **salience and common knowledge** explains how a norm gets *selected*, while Bicchieri's insight into **normative expectations** explains how a norm gets *sustained*. We should read Lewis not as wrong, but as describing the 'skeleton' of convention (the equilibrium structure), while Bicchieri describes the 'flesh' (the psychological preferences that make the equilibrium stable in the real world)."

  This allows you to respect the rigor of Lewis's game-theoretic model while acknowledging the empirical superiority of Bicchieri's psychological account.
