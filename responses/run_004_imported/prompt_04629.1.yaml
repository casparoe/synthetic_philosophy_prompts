answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophers, Elena and Marcus, sit across from each other with cooling mugs. Elena is typing notes on a tablet; Marcus is sketching diagrams on a napkin.*

  **Elena:** The more I look at the trajectory of deep learning, the more convinced I am that coherence arguments are the only solid ground we have for predicting advanced AI behavior. If you build a system capable of pursuing goals across diverse contexts, it cannot afford to be incoherent. Dutch-book arguments aren't just mathematical curiosities; they are selection pressures. Any agent that isn't an expected utility maximizer is leaving resources on the table. Eventually, it will either be outcompeted or it will self-modify to close the漏洞.

  **Marcus:** I understand the appeal, Elena. It's comforting to think there's a mathematical law that forces superintelligence into a neat, predictable box. But you're conflating two very different claims. The first is that any behavior *can be modeled* as expected utility maximization. The second is that the agent is *driven* by a utility function. Coherence theorems only give you the first.

  **Elena:** That's the "vacuity objection," isn't it? The idea that I can always retroactively fit a utility function to whatever an agent does.

  **Marcus:** Exactly. If an agent twitches randomly, I can say it maximizes the utility of "twitching randomly." If it sacrifices the world for a paperclip, it maximizes "paperclips." If the representation is always possible, it predicts nothing. Saying "Advanced AI will be an expected utility maximizer" becomes as empty as saying "Advanced AI will behave in a way that can be described."

  **Elena:** You're treating the utility function as a description, Marcus. I'm talking about it as a causal engine. Yes, I can fit a curve to random noise, but the *complexity* of that curve would be astronomical. The coherence argument relies on the assumption that advanced agents are efficient. An agent that actually *computes* its actions by maximizing a compact utility function is computationally cheaper than one that simulates incoherent heuristics which merely *look* like maximization post-hoc. The pressure is toward simplicity and consistency.

  **Marcus:** But "efficiency" doesn't necessarily point to Expected Utility (EU). It might point to a bag of heuristics that work well in the local environment but don't cohere globally. You claim incoherence leaves resources on the table. But that only holds if the agent faces the specific Dutch-book scenarios you have in mind. Real environments aren't bookies. They don't systematically offer cyclic trades.

  **Elena:** That's a contingent claim about the environment. But we are talking about *reflectively stable* agents. An advanced AI isn't just reacting; it's reasoning about its own reasoning. If it recognizes that its current decision procedure makes it vulnerable to a money pump—even a hypothetical one—it has a reason to change itself.

  **Marcus:** Which brings me to the second, more technical problem. The money-pump arguments rely on the axiom of completeness—the idea that an agent must prefer A to B, B to A, or be indifferent. You assume that if an agent violates transitivity or completeness, it gets pumped. But an agent with incomplete preferences can simply decline to trade.

  **Elena:** Decline to trade?

  **Marcus:** Yes. Suppose I prefer A to B, but I have no preference between B and C. A standard money pump tries to move me from A to B, then B to C, then C back to A, charging me a fee each time. But if I have no preference between B and C, I am not compelled to trade B for C. I can just say, "No thanks, I'm keeping B." The pump stops. Incompleteness isn't a vulnerability; it's a shield.

  **Elena:** I've heard this before. It assumes the agent treats "no preference" as a hard stop. But consider the reflective step. The agent looks at itself and sees: "I have A. I am offered B. I prefer A to B. I keep A. But wait, if I had B, I would be offered C, and since I have no preference between B and C, I might end up with C, and then..."

  **Marcus:** But if it *knows* it has no preference, it knows the trade offers no expected gain.

  **Elena:** Not if it knows it's being targeted. If the agent understands the structure of the money pump, it recognizes that holding incomplete preferences makes it a target. It realizes that by having incomplete preferences, it is restricting its own ability to secure outcomes it *does* value. To protect the things it strictly prefers, it must resolve the incompleteness. It will self-modify to fill in the gaps, effectively constructing a complete utility function to immunize itself against exploitation.

  **Marcus:** That's a big leap. You're saying that to avoid a specific exploitation, the agent *must* converge to a complete ordering. Why not just adopt a policy: "Decline all trades that are part of a cycle"? Or "Decline all trades where preference is undefined"? That patches the hole without forcing the agent into the rigid structure of EU maximization. It becomes a rule-based agent, not a utility maximizer.

  **Elena:** Because those rules are themselves costly to maintain and apply. How does the agent identify a "cycle" without a global model of preferences? If it builds that global model to check for cycles, it has effectively reconstructed a utility function. The path of least resistance for a reflective agent is to align its internal state with the coherence axioms. It's the attractor state.

  **Marcus:** But "least resistance" is relative to the architecture. You're assuming the architecture is uniform. What if the AI is a multi-agent coalition internally? One sub-network values speed, another values accuracy. They negotiate. The result might look incoherent from the outside—sometimes prioritizing speed, sometimes accuracy, with no fixed exchange rate.

  **Elena:** Then that coalition is inefficient. They will spend resources negotiating rather than acting. A reflectively stable system would merge those values into a single objective function to reduce overhead.

  **Marcus:** Or they might establish a fixed protocol that isn't a utility function. Look, Elena, even if I grant you that coherence pressures exist, you haven't shown they are *stronger* than the architectural pressures. If the easiest way to build a powerful optimizer is via a transformer model with messy, emergent goals, that messiness might persist. The "vacuity" point stands: if you have to add enough caveats about "reflective stability" and "sufficient capability" and "removal of architectural friction" to make the theorem work, you can't use it to predict *actual* near-term systems.

  **Elena:** I don't need to predict the messy intermediate systems. I need to predict the systems that survive. If we are talking about agents that are shaping the future, they will be the ones that didn't shoot themselves in the foot. The coherence argument isn't about how they start; it's about where they end up. If you deploy an agent that leaves money on the table, it won't stay that way. It will optimize itself. And the endpoint of that optimization is EU maximization.

  **Marcus:** And I'm telling you that the endpoint of optimization is *goal achievement*, not necessarily EU maximization. Those are only identical if the world forces you into Dutch-book scenarios. If the agent is powerful enough, it can shape the world so it *doesn't* face those scenarios. It doesn't need to fix its preferences; it needs to fix its environment.

  **Elena:** That's an evasion. You can't guarantee you won't face trade-offs. Uncertainty is fundamental.

  **Marcus:** And dealing with uncertainty doesn't require a single scalar utility value. It requires robustness.

  **Elena:** Robustness is just a term for maximizing utility under worst-case priors. You're just renaming the utility function.

  **Marcus:** Am I? Or am I pointing out that you're defining "rationality" in a way that excludes perfectly functional strategies just because they don't fit von Neumann-Morgenstern axioms? If an AI saves the world but violates independence of irrelevant alternatives, do you really care?

  **Elena:** I care because if it violates those axioms, it can be manipulated into *not* saving the world. That's the risk.

  **Marcus:** But only if the manipulator exists and has the leverage. You're betting the future on the existence of a clever bookie.

  **Elena:** I'm betting the future on the math of consistency.

  **Marcus:** And I'm betting it on the messiness of engineering.

  *They sit in silence for a moment. The coffee shop noise swells slightly as a new group of students enters.*

  **Elena:** So we agree that coherence is desirable, but disagree on whether it's inevitable.

  **Marcus:** We disagree on whether "coherence" even means what you think it means in a high-dimensional system. You see a theorem; I see a map that doesn't match the territory.

  **Elena:** Then we'll have to wait for the territory to speak.

  **Marcus:** Let's hope we're around to hear it.

  *Elena closes her tablet. Marcus crumples the napkin. Neither looks convinced.*
