prompt: |-
  Over dinner last week, a friend of mine who is finishing a PhD in philosophy of science and I got into a long, unresolved argument about the DSM-5-TR's 2022 addition of Prolonged Grief Disorder (PGD) as a standalone diagnosis. She kept coming back to Ian Hacking's idea of the looping effect: his claim that psychiatric categories are "interactive kinds" rather than "indifferent kinds" like isotopes or asteroids, so that once people learn how they have been classified, the classification feeds back into how they understand and perform their own condition, shifting the very behavior the criteria were meant to capture and eventually prompting experts to revise the criteria again. Her standing example was Hacking's own case study of multiple personality disorder in Rewriting the Soul, which she thinks proliferated partly because it existed as a recognized, well-publicized category; her worry is that PGD — which requires, among other things, that intense yearning or preoccupation with the deceased persist beyond twelve months in adults (six in children) alongside at least three of eight further symptoms such as identity disruption or a pervasive sense that life is meaningless — could do something similar to grief, turning it into a script bereaved people learn to monitor themselves against rather than something they simply undergo. I countered that this kind of worry, taken too far, ends up denying real people real treatment: something like one in ten bereaved adults reportedly meets criteria for clinically significant prolonged grief, and without a formal diagnosis they are left with vague, non-billable "bereavement support" instead of protocol-based grief therapy. Neither of us gave ground, and the argument has become unavoidably relevant, because I sit on my hospital system's bereavement care clinical policy committee, which meets in three weeks to decide whether our grief program should formally adopt PGD screening and diagnostic coding at intake.

  Could you draft the memo I will bring to that meeting? I need a clear recommendation — adopt, reject, or adopt with specific conditions — defended in a way that would persuade a committee member who has never heard of Hacking, while still engaging the looping-effects worry on its merits rather than acknowledging it and moving on. If my friend has a point, I want to know what follows operationally: how we would screen, how counselors would be trained to introduce the diagnosis to a grieving patient, and whether we should build in a review period or some way of tracking for the very self-fulfilling effects she is worried about. Please give the committee a document it could actually vote on, with reasoning specific enough to survive next week's follow-up argument with my friend, not a general survey of the debate over psychiatric classification.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user sits on a hospital system's bereavement care clinical policy committee.
      *   **Task:** Draft a memo for the upcoming meeting (in 3 weeks) regarding the adoption of DSM-5-TR's Prolonged Grief Disorder (PGD) screening and diagnostic coding.
      *   **Conflict:** The user had an argument with a philosophy of science PhD friend about Ian Hacking's "looping effect" (psychiatric categories change the behavior they classify). The friend worries PGD scripts grief; the user worries rejecting PGD denies treatment.
      *   **Requirements:**
          *   Clear recommendation (Adopt, Reject, or Adopt with Conditions).
          *   Persuasive to committee members unfamiliar with Hacking.
          *   Engage the "looping effect" worry on its merits (operationalize it), not just dismiss it.
          *   Include specific operational details: screening methods, counselor training on introducing the diagnosis, review periods/tracking for self-fulfilling effects.
          *   Tone: Professional, actionable, evidence-based, philosophically robust but accessible.
          *   Goal: A document the committee can vote on, specific enough to withstand the friend's critique.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Too risky clinically. Denies access to care, insurance billing, and standardized treatment for a recognized condition affecting ~10% of bereaved adults. Ignores DSM-5-TR consensus.
      *   *Option B (Adopt Unconditionally):* Ignores the valid philosophical/ethical concern about medicalizing normal grief and the potential for "scripting." Risks over-diagnosis.
      *   *Option C (Adopt with Conditions):* Best balance. Acknowledges clinical necessity (access to care) while mitigating the looping effect risks through careful implementation, training, and monitoring. This allows the user to tell their friend, "I heard you, and I built safeguards into the policy."

  3.  **Structure the Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief statement of recommendation.
      *   **Background:** What is PGD? Why DSM-5-TR? Prevalence.
      *   **Clinical Rationale (The "User's" Argument):** Access to care, insurance, evidence-based treatment.
      *   **Ethical & Conceptual Safeguards (The "Friend's" Argument):** Addressing the looping effect/medicalization concern operationally.
      *   **Implementation Plan:** Screening, Training, Review.
      *   **Recommendation/Vote:** Clear actionable item.

  4.  **Drafting Content - Section by Section:**

      *   *Header:* Keep it formal.
      *   *Subject:* Needs to be precise. "Adoption of DSM-5-TR Prolonged Grief Disorder (PGD) Screening and Diagnostic Protocols."
      *   *Executive Summary:* Recommend "Adopt with Safeguards."
      *   *Background:* Briefly define PGD (12 months, functional impairment, etc.). Mention DSM-5-TR (2022).
      *   *Clinical Necessity:* Focus on the 10% statistic. Mention "Bereavement Support" vs. "Medical Treatment." Insurance billing is key for hospital systems.
      *   *Addressing the "Looping Effect" (Crucial Step):* How to translate Hacking into policy?
          *   *Concept:* Diagnosis shouldn't define identity.
          *   *Operationalization:* Training clinicians to frame the diagnosis as a *description of current suffering*, not a *permanent identity*.
          *   *Screening:* Use validated tools (PG-13-R) but require clinical interview confirmation (don't rely solely on checklists).
          *   *Time Criteria:* Strict adherence to the 12-month rule (don't pathologize acute grief).
          *   *Monitoring:* Track diagnosis rates and outcomes. Are we seeing an uptick just because we're looking?
      *   *Training:* Specific scripts for clinicians. "This is a way to describe the intensity of your grief to get you specific help," not "You have this disorder."
      *   *Review Period:* Set a policy review in 18-24 months to check for "diagnostic creep."
      *   *Recommendation:* Vote to adopt with the specified safeguards.

  5.  **Refining the Tone:**
      *   Must sound like a hospital policy memo (concise, authoritative, patient-centered).
      *   Must not sound like a philosophy paper, but must show the philosophical concern was integrated.
      *   Avoid jargon like "interactive kinds" unless explained simply (better to use "feedback loop" or "self-fulfilling prophecy" language for the general committee, while keeping the underlying logic robust for the friend). *Correction:* The prompt asks to engage the worry on its merits. I should use the logic without necessarily needing to name-drop Hacking to the whole committee, but the *logic* must be there so the user can show their friend. Actually, it might be stronger to briefly acknowledge the "risk of medicalization" explicitly as a conceptual concern. Let's stick to "risk of diagnostic scripting" or "medicalization of normal variation."

  6.  **Addressing the Friend's Specific Critique:**
      *   *Friend's worry:* PGD turns grief into a script.
      *   *Memo response:* Training emphasizes grief as a *process*, diagnosis as a *tool for access*.
      *   *Friend's worry:* People monitor themselves against criteria.
      *   *Memo response:* Clinicians, not patients, administer screening. Diagnosis requires functional impairment, not just symptoms.
      *   *Friend's worry:* Criteria shift behavior.
      *   *Memo response:* Review clause. If rates spike unnaturally, we pause.

  7.  **Review against Constraints:**
      *   Clear recommendation? Yes (Adopt with Conditions).
      *   Persuade committee? Yes (focus on care access + risk management).
      *   Engage looping effect? Yes (via training and monitoring).
      *   Operational details? Yes (PG-13-R, specific training modules, 18-month review).
      *   Specific enough for the friend? Yes (shows the safeguards are real, not token).

  8.  **Final Polish:** Check dates, ensure the distinction between "bereavement" and "PGD" is clear. Ensure the 12-month rule is highlighted as a safeguard against pathologizing normal grief. (Self-Correction: Make sure to mention that the 12-month mark is a *minimum* threshold, not a target).

  9.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Bereavement Care Clinical Policy Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Adoption of DSM-5-TR Prolonged Grief Disorder (PGD) Screening and Diagnostic Coding

  ### Executive Summary

  This memo recommends the **conditional adoption** of Prolonged Grief Disorder (PGD) screening and diagnostic coding within our health system, effective [Date].

  While the inclusion of PGD in the DSM-5-TR (2022) offers a critical pathway to evidence-based treatment and insurance reimbursement for severely impaired bereaved individuals, it carries conceptual risks. Specifically, we must guard against the "medicalization of normal grief," where patients begin to perform or script their suffering to match a diagnostic checklist rather than experiencing grief organically.

  To balance clinical necessity with ethical caution, this recommendation proposes adopting PGD protocols **only alongside specific safeguards**: strict adherence to the 12-month duration criterion, clinician training focused on framing the diagnosis as a tool for access rather than an identity, and a mandated policy review in 18 months to monitor for diagnostic inflation.

  ### Background and Clinical Necessity

  In March 2022, the American Psychiatric Association added Prolonged Grief Disorder to the DSM-5-TR. PGD is defined by intense yearning or preoccupation with the deceased persisting beyond **12 months** (6 months for children), accompanied by at least three additional symptoms (e.g., identity disruption, pervasive meaninglessness, emotional numbness) that cause significant functional impairment.

  **The Case for Adoption:**
  1.  **Prevalence and Severity:** Epidemiological studies suggest approximately 7–10% of bereaved adults meet criteria for PGD. These individuals suffer higher rates of suicidality, substance use, and cardiovascular morbidity compared to both non-bereaved controls and those with "normal" acute grief.
  2.  **Access to Care:** Without a billable diagnosis, patients are limited to non-specific "bereavement support." PGD coding allows for reimbursement of protocol-driven therapies (e.g., Complicated Grief Therapy), ensuring continuity of care.
  3.  **Standardization:** A formal diagnosis provides a common language for referral and research, allowing our system to benchmark outcomes against national standards.

  ### Conceptual Risks and Operational Safeguards

  The committee must acknowledge a valid concern raised by philosophers of science and ethicists: psychiatric categories can function as "feedback loops." When a condition is named and publicized, individuals may unconsciously align their behavior with the criteria, potentially altering the natural trajectory of grief. If we implement PGD carelessly, we risk turning a diagnosis meant to *describe* suffering into a script that *shapes* it.

  To mitigate this "looping effect," the following operational safeguards are required as conditions of adoption:

  #### 1. Screening Protocol: Clinician-Administered Only
  *   **Policy:** We will **not** use self-report screening tools (e.g., the PG-13-R) as standalone diagnostic determinants. Patients cannot "self-diagnose" via patient portals.
  *   **Rationale:** Self-screening invites patients to monitor themselves against criteria, reinforcing the feedback loop.
  *   **Procedure:** Screening tools may be used by clinicians to structure an interview, but a diagnosis requires a semi-structured clinical interview confirming that symptoms exceed cultural norms and cause functional impairment.

  #### 2. The "12-Month Firewall"
  *   **Policy:** Strict enforcement of the 12-month duration criterion (6 months for children). No exceptions for "early onset."
  *   **Rationale:** Acute grief often mimics PGD symptoms (insomnia, loss of appetite, yearning). Diagnosing before 12 months pathologizes normal adaptation.
  *   **Procedure:** Electronic Health Record (EHR) hard stop preventing PGD coding prior to the 12-month mark post-loss.

  #### 3. Clinician Training: Framing the Diagnosis
  *   **Policy:** All providers authorized to diagnose PGD must complete a 2-hour module on "Diagnostic Framing and Grief."
  *   **Rationale:** How the diagnosis is introduced determines whether it becomes a stigmatizing label or a liberating tool.
  *   **Scripting Guidance:** Clinicians will be trained to avoid language that solidifies grief as a permanent identity (e.g., "You *are* a PGD patient"). Instead, language should focus on current functional blockage (e.g., "Your grief has become stuck in a way that is causing physical and emotional pain; this diagnosis helps us unlock specific treatments to move that process forward").
  *   **Goal:** Position the diagnosis as a temporary map for treatment, not a permanent territory of the self.

  #### 4. Monitoring for Diagnostic Creep (The "Looping" Audit)
  *   **Policy:** Implementation of an 18-month review cycle.
  *   **Rationale:** If the "looping effect" is occurring, we should see a statistical anomaly in diagnosis rates that outpaces population baselines, or a clustering of symptoms that mirrors the checklist too perfectly.
  *   **Procedure:** Quality Improvement (QI) will track:
      *   PGD diagnosis rates per 1,000 bereaved intakes.
      *   Dropout rates from grief therapy.
      *   Patient satisfaction surveys specifically asking if the diagnosis felt "helpful" or "labeling."
  *   **Trigger:** If diagnosis rates exceed 15% of the bereaved population (significantly above the ~10% epidemiological baseline) without a corresponding increase in acuity, the committee will convene to pause screening and re-evaluate criteria application.

  ### Recommendation and Vote

  The Bereavement Care Clinical Policy Committee is asked to vote on the following motion:

  > *To adopt DSM-5-TR Prolonged Grief Disorder (PGD) screening and diagnostic coding, contingent upon the implementation of the "12-Month Firewall" in the EHR, mandatory clinician training on diagnostic framing, and a scheduled Quality Improvement review at 18 months to assess for diagnostic inflation.*

  **Implications of Vote:**
  *   **If Passed:** Billing and Coding will update ICD-10 mappings by [Date]. Training modules will be deployed to Social Work and Psychiatry departments.
  *   **If Failed:** Our system will continue to utilize non-specific Z-codes for bereavement. Patients meeting clinical criteria for severe impairment may face insurance denials for specialized grief therapy, and we will lack standardized data to track outcomes in this population.

  ### Conclusion

  Adopting PGD is not an endorsement that grief is a disease, but a recognition that for a significant minority, grief can become a disabling health condition requiring medical intervention. By adopting this diagnosis with the safeguards outlined above, we prioritize patient access to care while remaining vigilant against the risk of turning a natural human experience into a self-fulfilling medical script.

  **Attachments:**
  *   A. DSM-5-TR PGD Diagnostic Criteria Summary
  *   B. Proposed Clinician Training Module Outline
  *   C. QI Metrics for 18-Month Review

  ***

  ### Note to User (for your follow-up argument)

  This memo is designed to give you ammunition for both sides of your dinner table debate.

  1.  **For the Committee:** It prioritizes care access and billing (the practical reality of hospital systems) while framing the philosophical concerns as "risk management" and "quality improvement." This makes the Hacking-adjacent worries palatable to administrators who care about liability and metrics.
  2.  **For your Friend:** You can show her Section 3 ("Conceptual Risks and Operational Safeguards"). You aren't dismissing the looping effect; you are **operationalizing** it.
      *   *The "Self-Monitoring" Worry:* You addressed this by banning self-report screening as a diagnostic tool (Section 3.1).
      *   *The "Identity" Worry:* You addressed this by mandating specific linguistic framing in training (Section 3.3).
      *   *The "Criteria Shift" Worry:* You addressed this by building in a review trigger if diagnosis rates spike unnaturally (Section 3.4).

  You can tell her: "I didn't just adopt the category; I built a surveillance system into the policy to detect the exact looping effects you warned me about. If the category starts changing the behavior, the policy triggers a pause." That moves the conversation from abstract theory to concrete institutional accountability.
