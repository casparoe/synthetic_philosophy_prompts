          *   Explain the Political Views. Hierarchy, order, anti-mixture.
          *   The Verdict: No *logical* entailment. Russell and Wittgenstein prove this (great logicians, different politics).
          *   The *Temperamental* Link: This is the gold mine for the novel. The desire for purity, clarity, and boundaries. The hatred of "messiness" (both in proofs and in society).
      *   **Part 2: How to Write the Scene (Dramatic Strategy):**
          *   Don't make Frege concede. He was stubborn.
          *   Make the student argue from *temperament*, not *deduction*.
