answer: |-
  **Setting:** *A quiet corner of the conference center at the Workshop on Formal Epistemology and AI Safety. It is late afternoon. Julian (defender of coherence arguments) and Elena (critic) are finishing their second coffees.*

  **Julian:** You looked restless during the morning session on instrumental convergence. Specifically, when the speaker claimed coherence arguments don't force expected utility (EU) maximization.

  **Elena:** Because they don't, Julian. Not without smuggling in half the theory as a premise. The claim that "any sufficiently capable agent must be representable as an EU maximizer" is being treated as a theorem derived from the possibility of exploitation. But the derivation leaks.

  **Julian:** It leaks only if you insist on defining "agent" in a way that allows for self-sabotage. Look, let's strip this to the studs. We agree on the cyclic money pump. If I prefer Grant A to B, B to C, and C to A, I can be pumped. I start with A. I pay you ten dollars to switch to B. Then ten to switch to C. Then ten to switch back to A. I'm back at A, but thirty dollars poorer. That's a dominated strategy. Any agent that does this is practically irrational.

  **Elena:** Agreed. Transitivity is non-negotiable. But that's the *only* non-negotiable. The moment you move to incompleteness, the pump requires a specific behavioral disposition that isn't entailed by rationality itself.

  **Julian:** Let's make it concrete. Suppose an AI manages a research endowment. It strictly prefers funding Project Alpha over Project Beta. But regarding Project Gamma, it has incomplete preferences. It doesn't prefer Gamma to Alpha, nor Alpha to Gamma. They are incomparable. Now, I offer the AI a trade: Switch from Beta to Gamma for free.

  **Elena:** And the AI says, "No thank you."

  **Julian:** Why? Gamma is not strictly worse than Beta. If the AI has a policy of "never trade unless the new option is strictly preferred," it becomes inert. But if it has a policy of "trade if the new option is not strictly worse"—which seems required for a capable agent to seize opportunities—then I can pump it. I trade Beta for Gamma (free). Then I offer Gamma for Alpha for five dollars. Since Alpha is strictly preferred to Beta, and Gamma was incomparable to Alpha, the AI might accept. Then I trade Alpha back to Beta for five dollars.

  **Elena:** You're assuming the AI treats "incomparable" as "indifferent." That's the category error. If Gamma and Alpha are incomparable, the AI isn't indifferent; it lacks a preference relation. It is perfectly rational to say, "I will not trade Beta for Gamma, because I do not prefer Gamma, and trading incurs transaction costs or risk."

  **Julian:** But that's a policy choice, Elena! And that policy is vulnerable. If the AI refuses to trade Beta for Gamma, it is passing up a potential path to Alpha, which it *does* prefer over Beta. By refusing to move through the incomparable node, it locks itself into an inferior outcome relative to what was reachable. The coherence argument says: if you are capable, you must have a complete policy over choices. If that policy avoids dominated strategies, it behaves *as if* it has complete preferences.

  **Elena:** "Behaves as if" is doing all the work. You're arguing that to avoid being pumped, the agent must *adopt* a completion of its preferences. But which completion? There are infinitely many ways to complete incomplete preferences. The money pump doesn't tell the agent *which* EU function to adopt, only that it must pick *one*. That's not a derivation of EU; it's a demand for arbitrary commitment.

  **Julian:** It's not arbitrary if the agent wants to avoid loss. The pressure of the pump forces the completion. But let's move to the stronger claim. Even with complete preferences, you can violate Independence. The Allais paradox.

  **Elena:** The static Allais is just a preference violation. It's not irrational to prefer certainty.

  **Julian:** Not static. *Sequential* Allais. Imagine the endowment faces a chance node. There is an 89% chance the funding call is cancelled (payoff $0). If the call isn't cancelled (11% chance), the AI faces a choice.
  Plan 1: In the 11% branch, take a sure $1 Million.
  Plan 2: In the 11% branch, take a gamble: 10/11 chance of $5M, 1/11 chance of $0.
  Most people, and many agents, prefer Plan 1 at the outset. They like the certainty of the $1M in the live branch. But once the 89% cancellation risk is resolved and they find themselves *in* the 11% branch, they suddenly prefer the gamble (Plan 2). They switch.

  **Elena:** Dynamic inconsistency. I know the argument. If they switch, they pay a cost to switch. So they end up with less than if they had stuck to Plan 1. Therefore, they must maximize EU to satisfy Independence.

  **Julian:** Exactly. If you violate Independence, there exists a decision tree where your own future self undermines your current self's plan. You are dominated. You could have had a better outcome simply by binding yourself.

  **Elena:** And here is where McClennen saves us. *Resolute Choice*.

  **Julian:** [Sighs] Resolute choice. The "just don't change your mind" defense.

  **Elena:** It's not a glib defense. It's a distinct mode of agency. The agent evaluates the *whole tree* at the initial node. It chooses the plan that maximizes its ranking of plans. When it reaches the subsequent node, it does not re-evaluate based on local preferences. It executes the plan because it is *that plan*. It doesn't pay to switch. It avoids the pump. And it does *not* satisfy Independence.

  **Julian:** But *why* does it execute the plan? At the second node, looking locally, it prefers the gamble. It strictly prefers the gamble. If it is rational to maximize utility at the node of choice, it *must* switch. To say "I won't switch because I promised myself" is magical. What causal mechanism enforces that?

  **Elena:** The mechanism is the agent's conception of itself as a temporally extended entity. If you define rationality as "maximize at every node" (Separability), then yes, resolute choice is irrational. But that's begging the question. Why should rationality be separable? If I adopt a plan because it's best *ex ante*, and I know my *ex post* self will be tempted to deviate, rationality requires I resist that temptation.

  **Julian:** Resist based on what? If your preferences at the node say "Gamble > Sure Thing," and you choose "Sure Thing," you are acting against your preferences. You are acting against your own evaluation of the options available *now*.

  **Elena:** I am acting according to my *plan-ranking* preferences, which are higher-order.

  **Julian:** But those plan-rankings violate the very axioms you're trying to save! If you rank plans *ex ante* in a way that violates Independence, you are still an EU violator. You've just hidden the violation in the planning stage. And here's the rub: Is resolute choice a principled theory, or is it an ad hoc patch designed solely to dodge the money pump?

  **Elena:** That's rich coming from you. EU maximization is the ad hoc patch! You notice that agents get pumped, so you impose Independence to stop the pumping. But Independence kills legitimate preferences for certainty, for hedging, for flexibility. Resolute choice preserves the preference structure and modifies the *choice mechanism*. It says: "Preferences rank plans, choices execute plans." That is principled. It treats the agent as a single unit over time, not a sequence of temporal slices fighting a civil war.

  **Julian:** But it doesn't solve the incompleteness problem. Go back to the endowment. Alpha, Beta, Gamma. Incomplete preferences. Resolute choice requires a ranking of plans to resolve the choice at the root. If the preferences are incomplete, the plans are incomparable. The resolute chooser halts at the root. It can't pick a plan.

  **Elena:** It can pick a plan based on a meta-preference for flexibility. "I will choose the plan that keeps options open."

  **Julian:** And I can pump *that*. If you pay to keep options open, I can close them strategically and charge you to reopen them. Elena, the coherence arguments aren't saying "You must have these specific preferences." They are saying "Your behavior must be *consistent* with *some* EU function." If you use resolute choice to avoid the sequential pump, your behavior *over the whole tree* looks like EU maximization. You've just relocated the computation.

  **Elena:** No, I haven't. A resolute chooser can exhibit the Allais pattern consistently. They choose the safe option *ex ante*, and they stick to it *ex post*. An EU maximizer cannot do that. The behavior is distinct. The predictions diverge in complex trees where new information arrives.

  **Julian:** Only if the resolute chooser ignores new information that doesn't resolve the uncertainty they planned for. But if they update on new info, they often become sophisticated choosers again, and the pump returns. You're relying on a very fragile cognitive architecture. An AI built on resolute choice would have to actively suppress its own recalculations. That's not robust.

  **Elena:** And an AI built on EU maximization has to actively suppress its preference for certainty or its contextual framing. That's not robust either. You're arguing that to avoid being Dutch-booked, an agent must be incapable of having human-like risk attitudes.

  **Julian:** I'm arguing that to avoid being *dominated*, an agent must coordinate its temporal selves. EU is the only mathematical framework we have that guarantees that coordination without requiring the agent to lobotomize its future decision nodes.

  **Elena:** "Lobotomize." That's your tell. You view the future self's different evaluation as a defect. I view it as information. The future self is in a different epistemic position.

  **Julian:** In the Allais case, the epistemic position is identical! The 89% chance is gone. You know where you are. The only thing that changed is that the "certainty" is no longer certain in the same way. It's the same outcome distribution.

  **Elena:** But the *context* of the choice changed. At the root, I chose security. At the node, I face risk. The psychological reality of the choice matters for the normative theory if the agent is a unified consciousness.

  **Julian:** We're building AI, Elena, not counseling humans. If we build an AI that refuses to switch at the node despite preferring to switch, we have to hard-code that refusal. We have to tell it: "Ignore your current preference calculation." That is an explicit override. Why not just fix the preference calculation to satisfy Independence in the first place?

  **Elena:** Because fixing the calculation erases valuable value judgments! If we force the AI to satisfy Independence, it might take risks in scenarios where caution is warranted simply because the probabilities line up a certain way. Resolute choice allows the AI to say, "I value the *policy* of caution more than the *local* expected gain."

  **Julian:** But if it values the policy more, put that in the utility function!

  **Elena:** You can't always. Sometimes the value is in the *structure* of the choice, not the outcome.

  **Julian:** Then the utility function is over histories, not outcomes. And if it's over histories, and consistent, it's still EU. You're just pushing the complexity into the state space.

  **Elena:** And you're pushing the complexity into the axiom set to save the theorem. Look, Julian, the coherence argument claims to show that *any* agent not representable as EU is vulnerable. I've shown you an agent—Resolute Chooser—that is not EU-representable (violates Independence) yet is not vulnerable (doesn't pay to switch). The counterexample exists.

  **Julian:** The counterexample exists only if we accept that "ignoring your current strict preference" is rational. I say that's a contradiction in terms. You can't prefer X to Y and choose Y.

  **Elena:** I don't prefer X to Y *simpliciter*. I prefer Plan-Containing-Y to Plan-Containing-X.

  **Julian:** But at the moment of choice, Plan-Containing-X is no longer available. Only X and Y are available.

  **Elena:** That's the Separability assumption again. You're assuming the only things available at the node are the immediate outcomes. I'm saying the available options include "Continue Plan" and "Deviate from Plan."

  **Julian:** [Leans back] "Continue Plan" isn't an outcome. It's a description of an act.

  **Elena:** And "Maximize Expected Utility" is a description of a rule. We're both describing rules. Mine allows for dynamic consistency without Independence. Yours requires Independence to guarantee dynamic consistency. Mine is more general.

  **Julian:** Yours is less stable. It relies on the agent's ability to commit against its own local incentives. In a multi-agent environment, or if the agent can self-modify, the Resolute Chooser will self-modify into a Sophisticated Chooser to avoid being predicted and exploited by others.

  **Elena:** And the EU maximizer will self-modify to bind itself to avoid the sequential pump if it anticipates one. They converge on the same architecture: a commitment device. The only difference is I admit it's a commitment device, and you call it "rational preference."

  **Julian:** There is a difference. A commitment device is external to the preferences. EU says the preferences *themselves* dictate the choice. If you need a device, your preferences were flawed.

  **Elena:** Or, your theory of preferences is too narrow.

  **Julian:** [Checks watch] We're not going to resolve this.

  **Elena:** No. You think coherence arguments reveal the structure of rationality. I think they reveal the structure of *trade*, and you're conflating the two.

  **Julian:** And I think you're conflating "rational" with "psychologically plausible." But fine. Let's agree that if we build an AI using your resolute architecture, we need to watch it very closely for self-modification.

  **Elena:** And if we build one using yours, we need to watch it for wireheading, since it will seek to maximize the number in its head regardless of the structure of the world.

  **Julian:** [Smiles faintly] Coffee?

  **Elena:** Please. Black. No gamble on the cream.
