  *(Self-Correction on Resolute Choice)*: Julian needs to press on *how* resolute choice works. Is it a preference? If not, what is it? If it is a preference, does it satisfy EU? Elena needs to argue it's a different *structure* of agency, not just preferences over outcomes.

  Let's write.

