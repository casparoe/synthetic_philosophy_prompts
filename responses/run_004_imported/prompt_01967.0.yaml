          *   Option 3: 11% \$1M, 89% \$0.
          *   Option 4: 10% \$5M, 90% \$0.
          *   Standard Allais: 1 > 2 and 4 > 3.
      *   *Sequential version:* Need to frame this as a dynamic choice problem where the agent pays to switch.
      *   *Refinement:* Let's use the "Dynamic Allais" setup where the agent faces a chance node, then a choice.
      *   *Elena's Counter:* Resolute choice allows keeping the plan (Choose 1 at start) even if at the node, the local preference would be to switch.
