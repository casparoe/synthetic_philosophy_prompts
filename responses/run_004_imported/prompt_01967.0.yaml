      *   **Topic:** Coherence arguments for Expected Utility (EU) maximization, specifically in the context of AI safety and recent disputes.
      *   **Positions:**
          *   *Proponent (Defends Coherence):* Cyclic preferences $\rightarrow$ Money Pump. Incompleteness $\rightarrow$ Similar Pump. Violation of Independence (Allais) $\rightarrow$ Sequential Pump/Dominated Strategy.
          *   *Skeptic (Critiques Coherence):* Incompleteness pump assumes a specific trade disposition ("trade if not strictly worse"). McClennen's Resolute Choice blocks sequential pumps without requiring EU.
      *   **Requirements:** Concrete cases (real options, not just $A, B, C$), press on "principled fix vs. ad hoc patch," no concession at the end.
      *   **Tone:** Academic, rigorous, but conversational (dialogue format).

  2.  **Character Development:**
      *   *Proponent:* Let's call him **Julian**. He leans towards the orthodox Bayesian/EU view, perhaps influenced by Joyce, Ahmed, or the AI safety crowd (Omohundro, Yudkowsky). He sees coherence as a normative requirement for instrumental rationality.
      *   *Skeptic:* Let's call her **Elena**. She leans towards non-standard decision theory, perhaps influenced by McClennen, Levi, or recent critics like Gustafsson or the "vulnerability" critics. She values flexibility and sees EU as too restrictive.

  3.  **Key Arguments to Cover:**
      *   **Money Pump (Cyclicity):** Standard argument. $A \succ B \succ C \succ A$. Pay to switch.
      *   **Incompleteness:** $A \succ B$, $C$ incomparable to $A$ and $B$. Can we pump? Julian says yes (small sweeteners). Elena says no (agent can refuse to trade if incomparable).
      *   **Independence/Allais:** Sequential choice. Plan $P_1$ vs $P_2$. Dynamic inconsistency.
      *   **Resolute Choice:** Elena's defense. Commit to a plan.
      *   **Ad Hoc vs. Principled:** Is resolute choice a real theory or just a way to avoid losing money? Is the "trade if not worse" rule a necessary feature of agency?

  4.  **Drafting - Section by Section:**

