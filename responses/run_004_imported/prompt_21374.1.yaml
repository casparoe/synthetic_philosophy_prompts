answer: |-
  Your friend from the writing group is right to raise a flag. While it is a common modern misconception that Adam Smith was a straightforward cheerleader for capitalism and empire, a young man in 1778 who had closely read *The Wealth of Nations* (published March 1776) would find very little ammunition in it to defend the British Empire *as it actually existed*—particularly the East India Company (EIC) and the war in America.

  If Alan uses Smith to defend his uncle's specific brand of imperialism, he is either misreading the text or arguing against Smith's explicit conclusions. However, this doesn't mean you have to scrap the scene. In fact, the tension between Alan's idealistic misreading and Hector's cynical reality could make the scene much richer.

  Here is a breakdown of where Smith stood on the specific issues relevant to your novel, and how you might adjust the dialogue to be historically robust while keeping the dramatic conflict.

  ### 1. Smith on the American War and Colonies
  **The User's Assumption:** Smith sees colonies as an extension of the division of labour; therefore, Empire is good.
  **Smith's Argument:** Smith acknowledges that colonies *can* increase the wealth of nations through new markets and population growth. However, regarding the American crisis, his conclusion in *Wealth of Nations* (Book IV, Chapter VII) is startlingly specific: **the monopoly trade with the colonies is not worth the cost of defending them.**

  Smith argues that the mercantilist system (which restricts colonial trade to British ships) artificially inflates profits for merchants but drains the public treasury. By 1776, he famously suggested that if Britain could not reconcile with the colonies, it should let them go peacefully rather than bleed the nation dry in a costly war. He viewed the war as economically irrational.

  **Implication for Alan:** If Alan invokes Smith to say, "We must keep America," Smith would reply, "Let them go; the trade will continue without the political subjugation, and you will save the cost of the army."

  ### 2. Smith on the East India Company (The "Nabob" Problem)
  **The User's Assumption:** The EIC is a vehicle for global trade and specialization; therefore, a Smithian supports the EIC.
  **Smith's Argument:** This is the biggest hurdle for your scene. Smith was scathing about the East India Company. He viewed the EIC not as a free-market enterprise, but as a **corrupt monopoly that exercised sovereign power.**

  In Book V, Smith argues that "traders and sovereigns" are incompatible. He details how the EIC's monopoly stifles true commerce and how its servants (the nabobs) return to Britain with ill-gotten fortunes that corrupt Parliament and society. He explicitly states that the EIC's administration in Bengal is oppressive and economically inefficient.

  **Implication for Hector:** Hector is exactly the archetype Smith critiques: a man who made a fortune through sovereign monopoly, not competitive trade. If Alan uses Smith to defend the *principle* of the EIC, Hector (who knows how the sausage is made) could easily point out that Smith specifically despises men like him.

  ### 3. Smith on Mercantilism vs. Free Trade
  **The User's Assumption:** Empire = Free Trade.
  **Smith's Argument:** The British Empire in the 1770s was built on **Mercantilism** (Navigation Acts, monopolies, restricted trade). Smith's entire book is an attack on Mercantilism. He argues for "natural liberty," which implies dismantling the very legal structures that hold the imperial monopoly together.

  **Implication for Alan:** A true Smithian in 1778 would be arguing *against* the Navigation Acts and the monopoly privileges of the EIC, not defending them.

  ---

  ### How to Fix the Scene (Without Losing the Conflict)

  You have three options to make this historically credible while maintaining the dramatic tension between the idealistic nephew and the cynical uncle.

  #### Option A: Alan is Naive (The Misreading)
  Alan is young and eager to please his uncle. He has read the parts of Smith about the "benefits of commerce" and the "growth of nations" but has glossed over the specific institutional critiques.
  *   **The Dynamic:** Alan argues that Smith proves trade binds the world together and creates wealth, so Empire is the vehicle for this.
  *   **Hector's Counter:** Hector, who is smarter than he looks, laughs. He points out that Smith hates monopolies and that the EIC *is* a monopoly. Hector admits, "Smith wants a world of shopkeepers; I live in a world of conquerors. Smith writes books; I make dividends."
  *   **Why it works:** It characterizes Alan as intellectually earnest but inexperienced, and Hector as a pragmatic operator who knows the system is corrupt but profitable.

  #### Option B: Alan Attacks the War (The True Smithian)
  Alan uses Smith to argue that the *current conduct* of the empire is wasteful, trying to persuade his uncle that the war is bad for business.
  *   **The Dynamic:** Alan argues, "Smith proves the cost of subduing America exceeds the profit of the trade. You should oppose the war, Uncle, on economic grounds."
  *   **Hector's Counter:** Hector argues that economics isn't the only factor. "Power secures trade, Alan. If we let America go, we lose the prestige that protects our interests in India. Smith counts coins; I count influence."
  *   **Why it works:** This aligns Alan with the actual text of *Wealth of Nations* (which argued the war was a bad investment) but pits him against Hector's geopolitical realism.

  #### Option C: The Irony of the "System of Natural Liberty"
  Alan argues for the *ideal* of empire (free trade across oceans), while Hector defends the *reality* (extraction and monopoly).
  *   **The Dynamic:** Alan says, "Smith envisions a global market where Britain leads through efficiency."
  *   **Hector's Counter:** "Smith envisions a world that does not exist. In Bengal, we do not trade; we tax. We do not compete; we exclude. If I followed Smith, I would be bankrupt within a year."
  *   **Why it works:** It highlights the gap between Enlightenment theory and Imperial practice.

  ### Historical Nuance for 1778
  *   **Reception:** By 1778, *Wealth of Nations* was being talked about in London coffee houses, but it was dense. For Alan to have "worked his way through it" marks him as serious and intellectual (perhaps a bit dry).
  *   **The Scottish Connection:** Smith was a Scot, as is Alan. There was a network of Scots in the EIC and in London intellectual circles. Alan might feel a patriotic duty to defend a fellow Scot's work, which Hector could mock ("Smith is a professor; I am a man of business").
  *   **The War Context:** In 1778, France had just entered the war on the American side. The mood in London was anxious. Arguments about the *cost* of the war were very topical. Smith's argument that the colonies were a drain would be a radical, pacifist-adjacent take.

  ### Recommendation
  I strongly suggest **Option B**.

  Have Alan argue that Smith proves the American war is **economic suicide**. This allows Alan to be a "good" reader of Smith (validating your research) while putting him in direct conflict with Hector's mercenary worldview.

  **Sample beat:**
  *   **Alan:** "Smith demonstrates that the monopoly profit from America does not cover the expense of the fleets required to police it. We are bleeding capital for a illusion of sovereignty."
  *   **Hector:** "Sovereignty is not a ledger entry, boy. It is the threat of force that allows me to sell cloth in Bengal without a rival cutting my throat. Smith would have us be harmless merchants. I prefer to be armed."

  This preserves your intended conflict (Idealism vs. Cynicism) but grounds it in what Smith actually wrote, satisfying your historian friend and adding depth to your characters. Alan becomes a proponent of *rational commerce*, while Hector represents *imperial extraction*. They are talking past each other, which is often where the best drama lies.
