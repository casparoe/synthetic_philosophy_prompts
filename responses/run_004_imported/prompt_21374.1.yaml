prompt: |-
  I'm outlining a historical novel set in London during the closing years of the 1770s. It centres on a young Scottish clerk, Alan, newly arrived at the counting-house of his uncle Hector, a 'nabob' who made his fortune in the East India Company's Bengal trade and holds cynical, mercenary views on the American war then underway. I want a set-piece dinner scene in which Alan, having lately worked his way through Adam Smith's Wealth of Nations, invokes Smith to defend the imperial project against his uncle, while Hector dismisses the argument as fashionable economics dressed up as principle.

  The trouble is that a friend from my writing group, who studied economic history, warned me I might be flattening Smith into a caricature, and I would rather settle the question before I draft the scene than after. My working assumption has been that Smith, as the great theorist of commercial society and the gains from specialisation and exchange, would hand Alan a ready-made brief for empire: colonies, on this reading, are simply free trade and the division of labour extended across oceans, so a good Smithian ought to see the British Empire as a natural, if imperfect, expression of his own economic principles. Before I put a version of that speech in Alan's mouth, I would welcome help checking it against what Smith actually argues about colonies, chartered monopolies like the East India Company, and the case of the American colonies in the Wealth of Nations. Would a well-read young man of 1778 who took Smith seriously really come away primed to cheer for empire, or am I about to give my character an argument that Smith himself would have made short work of?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Context:** Historical novel set in London, late 1770s (specifically around 1778).
      *   **Characters:** Alan (young Scottish clerk, newly read *The Wealth of Nations*), Hector (uncle, EIC 'nabob', cynical, mercenary, pro-war/empire).
      *   **Proposed Scene:** Alan uses Smith to *defend* the imperial project against Hector. Hector dismisses Smith as fashionable theory.
      *   **The Problem:** A friend (economic historian) warned the user that this might caricature Smith.
      *   **User's Assumption:** Smith = commercial society/specialization/trade $\rightarrow$ Empire = global free trade/division of labor $\rightarrow$ Smith supports Empire.
      *   **The Question:** Would a well-read young man in 1778 using *The Wealth of Nations* actually argue *for* the British Empire (specifically the EIC and American war context), or would Smith's actual text undermine this argument?

  2.  **Initial Knowledge Retrieval & Fact-Checking (Adam Smith & Empire):**
      *   *Publication Date:* *The Wealth of Nations* was published in March 1776. So, by 1778, it is available and being discussed, fitting the timeline.
      *   *Smith's General Stance:* He is often misinterpreted as a pure laissez-faire ideologue. In reality, he was pragmatic but highly critical of monopolies and mercantilism.
      *   *Smith on Colonies (America):* He acknowledged the benefits of colonization for population growth and wealth *in general*, but was highly critical of the *management* of the colonies by Britain (mercantilist restrictions, Navigation Acts). He famously suggested that if the war went badly, Britain should let America go peacefully rather than bleed itself dry.
      *   *Smith on the East India Company (EIC):* This is the big one. Smith was *scathing* about the EIC. He viewed it as a corrupt monopoly that combined sovereignty with trade, leading to oppression in India and corruption in London. He did *not* see the EIC as a model of free trade; he saw it as the antithesis.
      *   *Smith on the American War:* He generally thought it was economically disastrous for Britain.

  3.  **Evaluate the User's Assumption:**
      *   *Assumption:* Smith = Pro-Empire because Empire = Trade.
      *   *Reality:* Smith = Pro-Trade, Anti-Monopoly, Anti-Imperial-Overreach.
      *   *Conflict:* The user wants Alan to use Smith to defend the *imperial project* (specifically against a cynical nabob).
      *   *Problem:* Hector is an EIC nabob. Smith *hated* the EIC. If Alan uses Smith to defend Hector's specific type of empire (EIC/American War), Alan is misreading Smith.
      *   *Nuance:* Is this misreading a bug or a feature? If Alan is young and idealistic, maybe he *misinterprets* Smith? Or maybe the user needs to pivot the argument.

  4.  **Formulate the Advice:**
      *   **Direct Answer:** The friend is right. The user's assumption is historically and textually shaky. Smith was not a cheerleader for the British Empire as it existed in 1778.
      *   **Key Evidence from *Wealth of Nations*:**
          1.  **The EIC:** Smith devotes significant space to attacking joint-stock companies exercising sovereign power. He calls them oppressive and inefficient. Hector (an EIC man) is exactly the kind of person Smith critiques.
          2.  **The American War:** Smith argues the cost of defending the colonies exceeds the profit from the monopoly trade. He suggests emancipation or representation (though leans towards letting go).
          3.  **Mercantilism:** Smith attacks the mercantilist system (Navigation Acts) which underpinned the empire.
      *   **Character Dynamics:**
          *   If Alan argues *for* Empire using Smith, he is misapplying Smith.
          *   If Hector dismisses Smith, he is actually aligned with Smith's critique of *himself* (ironically), or Hector represents the "practical man" vs. "theorist" trope.
          *   *Better Conflict:* Alan should use Smith to critique Hector's *methods* (monopoly, corruption, war), while Hector argues for the *necessity* of power and profit.
          *   *Alternative:* Alan tries to defend the *idea* of trade, but Smith's text actually arms him to attack the *structure* of the EIC.
      *   **Historical Context (1778):** The book was new. It was controversial. A young Scot in London (Smith was a Scot) might idolize Smith. But would he miss the anti-EIC parts? Maybe he focuses on the "invisible hand" bits and ignores the institutional critiques.
      *   **Recommendation:** Don't make Alan a perfect Smithian. Make him an *earnest* but perhaps slightly naive reader who focuses on the benefits of commerce, while Hector points out the brutal reality. OR, pivot so Alan uses Smith to criticize the *waste* of the war, which aligns better with the text.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the friend:* Validate the warning. It's good advice.
      *   *The "Big Reveal":* Smith was critical of the EIC and the American War.
      *   *Specific Textual Evidence:*
          *   Book IV, Chapter VII (Colonies): Cost of defense > profit.
          *   Book V (Public Revenue): EIC as sovereign traders is a disaster.
          *   The "Mercantilist System": Smith argues against the monopoly trade that defines the empire.
      *   *Scenario Adjustment:*
          *   *Option A (The Misreading):* Alan is young. He reads the "growth" parts and misses the "monopoly is bad" parts. Hector, the cynic, knows the system is rotten but profitable. This creates dramatic irony.
          *   *Option B (The Pivot):* Alan uses Smith to argue that the *current* war/management is wasteful, not that Empire is good. He argues for *better* commerce, Hector argues for *power*.
          *   *Option C (The Irony):* Hector knows Smith hates the EIC. He laughs at Alan for using Smith to defend *him*.
      *   *Refining the 1778 Context:* The war was going poorly for Britain (Saratoga 1777, French entry 1778). Smith's argument that the colonies weren't worth the cost was very topical.
      *   *Conclusion:* The scene is better if Alan is *challenging* Hector with Smith, not defending the imperial project *alongside* him. If Alan must defend empire, he must be misreading Smith, which characterizes Alan as naive.

