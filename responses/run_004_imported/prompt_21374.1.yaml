      *   Historical Nuance (1778 reception).

  8.  *(Final check against prompt)*: Did I answer if a well-read young man would cheer for empire? Yes, he would be misreading the text if he cheered for the *EIC/American War* empire. He might cheer for *global commerce*, but Smith distinguishes the two.

