      *   He would likely focus on the *source* of the correlation. If it's manipulation, it must be regulated. If it's rational convergence, it's fine.
      *   *Key Insight:* Condorcet distinguishes between the *probability of being right* and the *independence of the vote*. Algorithms attack independence.

