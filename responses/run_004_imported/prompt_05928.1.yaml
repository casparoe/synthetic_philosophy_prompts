      *   **The Voting Paradox (1785):** Majority rule can be intransitive ($A > B > C > A$).
      *   **Reaction to the Paradox:** He didn't abandon majority rule. He proposed methods to resolve it (ranking, minimizing the probability of error). He saw it as a technical hurdle, not a metaphysical impossibility.
