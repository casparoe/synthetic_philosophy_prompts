prompt: |-
  Earlier this year I joined the clinical ethics committee at the hospital where I work, partly because of how unprepared my own family felt when my father spent his last two weeks on a ventilator after a stroke -- we never really resolved among ourselves whether continuing treatment was giving him a chance or simply postponing the inevitable, and I wanted to understand these questions better than I'd managed to at the time. I didn't expect a case with the same shape to land on the committee within my first few months, but one has, and I've been asked to draft the short opinion I'll circulate before we reconvene.

  The patient is a woman in her late seventies who suffered a prolonged cardiac arrest ten days ago and has been ventilated in the ICU ever since with a severe hypoxic-ischemic brain injury; the medical team is unanimous that she will never recover awareness, and they now want to start dialysis for the kidney failure that has followed, which is what has forced the issue. Our policy lets the committee authorize withdrawing non-beneficial treatment over a family's objection once there has been "genuine engagement with the family's values and beliefs," but it never says what that engagement has to consist of, and this case is testing that gap. The patient's two adult children, who share decision-making authority, both describe themselves as devout, and both say they've consulted the same imam, yet they have reached opposite conclusions from what turns out to be the very same premise: that no created thing -- not a ventilator, not a doctor's hand -- is ever the true cause of anything, since God alone causes every event, including the moment of death, which is already fixed in advance. Our chaplain confirmed this is a serious, mainstream position with a long history, tracing it to al-Ghazali's argument that fire does not itself burn cotton, God does, the contact between them being customary rather than necessary; she added, almost in passing, that the same theologians never doubted that people remain answerable for what they do, which none of us knew how to square with the rest of it. The son takes the shared premise to mean that switching off the ventilator would not kill his mother, since the machine was never doing the causal work of keeping her alive to begin with, so there's no religious reason to keep escalating care the doctors already consider futile. The daughter starts from exactly the same premise and refuses consent to withdrawal anyway, reasoning that if no human action is ever the true cause of death either way, she would rather not be the one who acts at all, and would prefer to let God bring the outcome about through whatever means He chooses.

  Some members of the committee want to set the theological argument aside entirely and just apply our ordinary best-interests and futility criteria, treating the siblings' disagreement as noise the committee shouldn't referee; others think that would quietly dodge the very thing the family is asking us to engage, and would cut against a policy that demands "genuine engagement" rather than a medical override dressed up as neutrality. Could you draft the memo I'll bring to Thursday's meeting? I need a clear recommendation on whether and when the ventilator should be withdrawn and dialysis withheld, stated with a concrete timeframe, one that engages honestly with what the siblings' shared premise does and doesn't actually settle about who bears responsibility for the outcome, rather than quietly favoring whichever sibling's conclusion is more convenient -- and that treats the sibling we don't side with as making an argument worth taking seriously, not a position to be managed.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) at a hospital.
      *   **Task:** Draft a short opinion memo to circulate before the committee reconvenes.
      *   **Case:** Late 70s female, severe hypoxic-ischemic brain injury (HIBI) post-cardiac arrest (10 days ago), ventilated, now needs dialysis. Medical team says recovery of awareness is impossible (futile).
      *   **Conflict:** Two adult children (shared decision-making) disagree. Both are devout Muslims, consulted the same Imam, share the same theological premise (occasionalism: God is the only true cause, created things are instruments/customary causes).
          *   *Son:* Withdrawing treatment $\neq$ killing (machine isn't the true cause). Supports withdrawal/withholding dialysis.
          *   *Daughter:* If human action isn't the true cause, she prefers *not* to act (withdraw). She wants to let God take her through natural means (continuing treatment).
      *   **Policy:** Committee can authorize withdrawal over objection *if* there is "genuine engagement with the family's values and beliefs." Policy doesn't define "engagement."
      *   **Committee Tension:** Some want to ignore theology and use standard best-interests/futility. Others say this dodges the policy requirement.
      *   **Requirements for the Memo:**
          *   Clear recommendation (Withdraw ventilator? Withhold dialysis? Timeframe?).
          *   Engage honestly with the shared theological premise (occasionalism).
          *   Address the question of moral responsibility/agency within that theology (the chaplain's point about accountability).
          *   Do not favor one sibling just because their conclusion is convenient.
          *   Treat the dissenting sibling's position seriously (not just "managing" them).
          *   Tone: Professional, ethical, empathetic, rigorous.

  2.  **Deconstruct the Theological/Ethical Problem:**
      *   *The Premise:* Occasionalism (Al-Ghazali). God is the only agent. Fire doesn't burn; God burns via fire. Ventilator doesn't breathe; God breathes via ventilator.
      *   *The Son's Logic:* Since the machine isn't the *true* cause of life, removing it isn't the *true* cause of death. Therefore, withdrawal is permissible/neutral.
      *   *The Daughter's Logic:* Since human action isn't the *true* cause, I should minimize my intervention. Withdrawing feels like "playing God" or hastening, even if theoretically God decides. She prefers passivity (letting nature/God run its course via the machine).
      *   *The Chaplain's Insight:* Even if God is the only *ontological* cause, humans are still *moral* agents accountable for their choices. Theology doesn't erase ethical responsibility.
      *   *The Ethical Gap:* The policy requires "genuine engagement." Ignoring the theology fails this. Accepting the theology as a veto (daughter) or a green light (son) without nuance also fails. The committee must interpret *how* this theology applies to medical decision-making standards.

  3.  **Formulate the Recommendation:**
      *   *Medical Reality:* Treatment is non-beneficial (futile). The patient will not recover awareness. Continuing dialysis/ventilation prolongs dying, not living.
      *   *Ethical Standard:* Best interests + Medical Appropriateness.
      *   *Theological Integration:* The theology explains *why* they disagree, but it doesn't change the medical reality. However, it does inform how we frame the withdrawal.
      *   *Resolution:* The committee should recommend withdrawal of the ventilator and withholding of dialysis.
      *   *Timeframe:* Needs to be concrete. Not "immediately" (too harsh), not "indefinitely" (dragging it out). A short period for family gathering/farewell (e.g., 48-72 hours).
      *   *Addressing the Daughter:* Her desire to "not act" is understandable but misapplied. In Islamic bioethics (and general ethics), *withholding/withdrawing futile treatment* is often seen as allowing the natural decree (Qadar) to take effect, whereas *imposing* futile treatment can be seen as interfering with that decree. Her passivity is actually causing active suffering (prolonging the dying process).
      *   *Addressing the Son:* He is medically/ethically aligned, but his theological reasoning needs to be supported without validating a purely mechanistic view that ignores her feelings.
      *   *Engagement:* The "engagement" isn't convincing them of science; it's showing how their shared values actually support the medical recommendation when viewed through the lens of *avoiding harm* (La Darar wa la Dirar) and *accepting limits*.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose (recommendation on Case X). Acknowledge the complexity.
      *   **Medical Summary:** Briefly state the prognosis (irreversible, no awareness).
      *   **The Ethical/Policy Challenge:** Address the "genuine engagement" clause. Acknowledge the split in the committee (ignore theology vs. engage). Take a stance: We must engage.
      *   **Theological Analysis (The Core):**
          *   Acknowledge the shared premise (Occasionalism/Al-Ghazali).
          *   Validate both siblings: The son sees the machine as incidental; the daughter sees her action as intrusive.
          *   *Crucial Pivot:* The Chaplain's point. Accountability remains. In Islamic jurisprudence, agents are judged on their *intentions* and *choices* within the customary norms (adat).
          *   Reframing: Withdrawing futile treatment isn't "killing"; it's ceasing to obstruct the natural course (Qadar). Continuing futile treatment isn't "piety"; it can be "harm" (Darar).
          *   Addressing the Daughter specifically: Her desire to "not act" is a form of action. Choosing to continue invasive procedures *is* a choice for which she is accountable.
      *   **Recommendation:**
          *   Withhold dialysis.
          *   Withdraw ventilation.
          *   Timeframe: 48 hours (allows gathering, respects urgency).
          *   Process: Palliative extubation.
      *   **Conclusion:** Reiterate that this honors the policy by taking their beliefs seriously, not bypassing them.

  5.  **Refining the Tone:**
      *   *Avoid:* Dismissive language ("religious objection," "misunderstanding").
      *   *Use:* Respectful language ("theological framework," "moral agency," "customary cause").
      *   *Check:* Did I treat the daughter seriously? Yes, by acknowledging her fear of agency but explaining why that fear leads to the wrong ethical outcome *within her own framework*.
      *   *Check:* Is the timeframe concrete? Yes (48 hours).
      *   *Check:* Did I address the policy gap? Yes, by defining "genuine engagement" as theological integration, not just listening.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 48 hours enough?
      *   *Fix:* It's standard for imminent death scenarios. I should emphasize that the *decision* is now, the *act* follows shortly.
      *   *Critique:* Am I sounding too much like a theologian?
      *   *Fix:* Ground it in clinical ethics. The theology informs the values, but the medical futility drives the recommendation. The theology helps resolve the *conflict*, not the *indication*.
      *   *Critique:* The prompt asks to treat the sibling we don't side with as making an argument worth taking seriously.
      *   *Fix:* Ensure the daughter's position is framed as a sincere struggle with moral agency, not just obstructionism. Acknowledge that her hesitation comes from a place of reverence, which is good, but misapplied here.

  7.  **Final Polish:** Check against the prompt's specific constraints (clear recommendation, concrete timeframe, engage with the premise, treat dissenting sibling seriously). *Self-correction: Make sure to explicitly mention the Chaplain's point about accountability.*

  8.  *(Final thought on the "Occasionalism" aspect)*: This is a sophisticated philosophical/theological point. The memo needs to reflect that sophistication without being pedantic. The key is distinguishing between *ontological causality* (God) and *moral/legal causality* (Humans). The daughter conflates them; the son separates them too sharply. The committee needs to bridge them: We act according to customary causes, accountable for those acts, while acknowledging ultimate outcomes belong to God.

  9.  **Drafting the Memo.** (Proceeds to generate output based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **RE:** Recommendation Regarding Case #4092 (Patient: J.M.)

  **I. Purpose**
  This memo outlines my recommendation regarding the continuation of life-sustaining treatment for Patient J.M., a woman in her late seventies with severe hypoxic-ischemic brain injury following cardiac arrest. The medical team assesses her condition as irreversible with no possibility of recovering awareness. The immediate ethical conflict arises from the need to initiate dialysis for subsequent kidney failure and the request to withdraw ventilator support, opposed by one of two surrogate decision-makers.

  **II. Medical and Ethical Context**
  The clinical consensus is that further treatment is non-beneficial. The patient is not dying *from* a reversible condition; she is being maintained in a state of permanent unconsciousness. Under our hospital policy, the committee may authorize the withdrawal of non-beneficial treatment over family objection provided there has been "genuine engagement with the family's values and beliefs."

  Some committee members have suggested bypassing the theological dimensions of the family's disagreement to apply standard best-interests criteria. I advise against this. To ignore the specific theological framework the surrogates have offered would fail the policy's requirement for "genuine engagement." It would treat their beliefs as obstacles to be managed rather than the lens through which they view moral responsibility.

  **III. Engagement with the Family's Theological Premise**
  Both surrogates operate from a shared occasionalist premise (consistent with the Al-Ghazali tradition cited by our chaplain): that God is the only ontological cause of life and death, and created things (ventilators, kidneys, human hands) are merely customary instruments.

  *   **The Son's Position:** He argues that because the machine is not the *true* cause of life, removing it is not the *true* cause of death.
  *   **The Daughter's Position:** She argues that because human action is not the *true* cause of outcomes, she should minimize her own intervention and allow God to determine the timing through whatever means are currently present.

  Both positions are internally consistent with their premise, yet they yield opposite results. To engage genuinely, we must address the gap the chaplain identified: while God may be the ultimate cause, Islamic theology (and general ethics) maintains that humans remain morally accountable for their choices within the customary order (*adat*).

  The daughter's hesitation is not merely obstructionist; it is a sincere attempt to avoid usurping a divine role. She fears that withdrawing treatment constitutes an act of "killing," even if theoretically God decides the moment of death. However, within this theological framework, moral agency is exercised by choosing between available customary causes. Choosing to continue invasive, non-beneficial treatment is *also* an action for which she is accountable. If the treatment imposes burden without benefit (harm, or *darar*), continuing it is not a neutral act of "letting God decide"; it is an active choice to prolong the dying process, which many Islamic scholars argue interferes with the natural decree (*Qadar*).

  Therefore, the son's conclusion aligns better with the medical reality, but the daughter's concern regarding moral responsibility must be validated. We cannot simply tell her she is wrong; we must show that *withdrawing* is the choice that best aligns with avoiding harm and accepting human limits.

  **IV. Recommendation**
  I recommend the committee authorize the following:

  1.  **Withholding of Dialysis:** Dialysis should not be initiated. Given the prognosis of permanent unconsciousness, initiating dialysis would only prolong the dying process without restoring function or awareness.
  2.  **Withdrawal of Ventilator Support:** Mechanical ventilation should be withdrawn.
  3.  **Timeframe:** The withdrawal should occur within **48 hours** of this decision. This allows time for the family to gather and for the care team to prepare for a palliative extubation, but it recognizes that further delay constitutes ongoing non-beneficial intervention.

  **V. Implementation and Continued Engagement**
  To satisfy the policy requirement of "genuine engagement," the clinical team, supported by Ethics and Chaplaincy, should communicate this decision to the family with the following framing:

  *   **Acknowledge the Daughter's Burden:** Explicitly validate that her desire to "not act" comes from a place of reverence. Acknowledge that this is a heavy moral weight.
  *   **Reframe the Action:** Explain that within their shared theological tradition, humans are judged by their intentions and their adherence to the customary norms of medicine. The customary norm is to stop treatments that no longer work.
  *   **Shared Accountability:** Clarify that the committee shares the moral burden of this decision. We are not asking the daughter to "kill" her mother; we are advising her that the *customary cause* of death is the stroke, not the removal of the machine. The machine is no longer treating the stroke; it is masking the outcome.
  *   **Palliative Assurance:** Guarantee that the primary goal will shift entirely to comfort. The "action" taken will be the administration of medication to ensure she feels no air hunger or distress, framing this as a positive moral duty to prevent suffering.

  **VI. Conclusion**
  If we ignore the theological disagreement and simply declare the treatment futile, we risk traumatizing the family and violating our own policy on engagement. If we allow the disagreement to stall the decision indefinitely, we violate our duty to the patient.

  By recommending withdrawal within 48 hours, we uphold the medical standard of non-beneficial treatment. By explicitly addressing the daughter's theological concern regarding agency, we treat her objection as a serious moral argument rather than a barrier to be overcome. We affirm that while the outcome belongs to God, the choice to stop inflicting futile interventions belongs to us, and that is a responsibility we must bear together.

  I look forward to discussing this on Thursday.
