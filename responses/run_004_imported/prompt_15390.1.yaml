answer: |-
  You have stumbled upon one of the most famous and enduring problems in the philosophy of probability. Your "oracle" example is essentially a version of what is often called the **"Crystal Ball" objection**, and it was anticipated by David Lewis himself in his seminal 1980 paper, *"A Subjectivist's Guide to Objective Chance."*

  To answer your question directly: **Camp 2 is technically correct regarding the formal theory, but Camp 1 is right to be worried about the theoretical cost.** The oracle case does not refute the Principal Principle (PP) as Lewis formulated it, because Lewis built a specific escape hatch for exactly this scenario. However, whether that escape hatch is a "principled feature" or an "ad hoc rescue" is still a matter of intense philosophical debate.

  Here is the breakdown of why the principle survives, how it blocks your counterexample, and why the "ad hoc" worry remains live.

  ### 1. The Admissibility Clause
  Your formulation of the Principal Principle was the slogan version: *Credence should equal Chance.* But Lewis's actual formulation includes a crucial proviso. The principle states that your credence in proposition $A$, conditional on the chance of $A$ being $x$ **and** any *admissible* evidence $E$, should be $x$.

  $$C(A \mid \text{Chance}(A)=x \ \& \ E) = x$$

  **The catch:** This holds only if $E$ is **admissible**.

  Lewis explicitly defines admissible evidence as evidence whose impact on your credence comes *entirely* through its impact on your beliefs about the chances. Inadmissible evidence is evidence that gives you information about the truth of $A$ *directly*, bypassing the chances.

  In your example:
  *   **The Chance:** The coin is fair, so $\text{Chance}(\text{Heads}) = 0.5$.
  *   **The Evidence:** The Oracle says "Heads."
  *   **The Status:** The Oracle's testimony is **inadmissible**.

  Why? Because the Oracle's testimony affects your credence in Heads directly (you trust the Oracle), not by convincing you that the coin is biased. The Oracle gives you "foreknowledge" or "crystal ball" information. Lewis argues that the Principal Principle is a norm for agents who lack such direct access to the future. If you have inadmissible evidence, the Principal Principle simply does not apply. You are free (and rationally required) to update your credence to 1, violating the "Credence = Chance" equation, without violating the Principal Principle.

  ### 2. Is This Move Well-Motivated or Ad Hoc?
  This is where your study group's division is most philosophically fruitful.

  **The Case for "Well-Motivated" (Camp 2)**
  Defenders of Lewis argue that the distinction captures a deep truth about the role of objective chance. Chance is a guide for agents situated in time who lack omniscience. It summarizes the causal tendencies of the world.
  *   If you know the causal setup (fair coin), chance guides you.
  *   If you know the outcome directly (Oracle), chance is no longer your *best* guide.
  *   Therefore, restricting the principle to admissible evidence isn't a patch; it's a specification of the principle's domain. It would be like objecting to the laws of aerodynamics by saying, "But if I hold the plane in my hand, it doesn't fly." The laws of aerodynamics govern flight, not hand-holding. Similarly, PP governs credence *when guided by chance*, not when guided by prophecy.

  **The Case for "Ad Hoc" (Camp 1)**
  Critics argue that Lewis's definition of admissibility is circular or empty.
  *   **Circularity:** Lewis essentially defines admissible evidence as "evidence that doesn't violate the Principal Principle." This makes the principle tautological. It says: "Match the chance, unless you have evidence that tells you not to match the chance."
  *   **Epistemic Access:** How are we supposed to know *in advance* which evidence is admissible? If the definition relies on knowing whether the evidence bypasses chance, we need a theory of chance independent of the principle to judge admissibility.
  *   **Theoretical Cost:** If every counterexample can be dismissed by labeling the evidence "inadmissible," the principle loses its normative bite. It becomes hard to falsify.

  ### 3. Contemporary Developments
  Because of the tension you identified, contemporary formal epistemology has largely moved toward refining or replacing the PP to handle this more gracefully.

  *   **Ned Hall (2004):** Hall argued there are two distinct concepts of chance. One is "Lewisian Chance" (which obeys PP but is hard to define), and the other is "Rollback Chance" (frequency-based). He suggests the Oracle case conflates the two.
  *   **Jenann Ismael (2008, 2016):** Ismael proposes the **Generalized Principal Principle (GPP)**. She argues we shouldn't condition on "admissible evidence" (which is vague). Instead, we should condition on the entire history of the world up to the present plus the laws of nature. On her view, the Oracle's testimony is part of the "history," and the GPP handles the updating differently, avoiding the need for a mysterious "admissibility" filter.
  *   **Michael Thau / David Christensen:** Some have argued for a "New Principle" that adjusts the formula to account for the possibility that the chance hypothesis itself might be false or that the evidence might be inadmissible, effectively baking the correction into the equation rather than using a proviso.

  ### Verdict for Your Seminar
  You should tell your study group that **Camp 2 is right about the text of Lewis, but Camp 1 is right about the spirit of the problem.**

  1.  **Does it refute PP?** No. Lewis explicitly included the admissibility clause to block the Oracle/Crystal Ball case. Formally, the theory is consistent.
  2.  **Is it ad hoc?** It is the weakest link in Lewis's system. While there is a principled intuition behind it (chance is for the ignorant), the lack of a non-circular definition of "admissibility" makes it look like a rescue device.
  3.  **The Takeaway:** The Oracle case doesn't kill the project of connecting chance and credence, but it does show that the simple slogan "Credence equals Chance" is false. The true norm is more complex: "Credence equals Chance *unless* you have direct information about the outcome." The philosophical work lies in explaining *why* that exception exists without making the principle trivial.

  Your counterexample is not a bug; it is the feature that drove 40 years of subsequent research in formal epistemology. You are in good company.
