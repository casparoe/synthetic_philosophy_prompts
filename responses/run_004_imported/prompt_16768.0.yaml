answer: |-
  This is an excellent question, and it cuts to the heart of a interdisciplinary friction that has been incredibly productive over the last two decades. As a psychologist, your intuition is correct: the narrative you heard in the seminar—that virtue ethics is essentially "dead" or running on borrowed time due to Harman and Doris—is a significant oversimplification of the current state of the field.

  While the situationist critique (circa 2000–2010) did force a major reckoning in moral philosophy, serious contemporary virtue ethicists have not simply refused to update. Instead, they have engaged in a three-pronged response: challenging the empirical interpretation, revising the metaphysical commitments of virtue theory, and reasserting the normative independence of ethics from descriptive psychology.

  Here is a breakdown of how the debate actually stands, which should help you cite it accurately in your dissertation.

  ### 1. Challenging the Empirical Interpretation
  The first line of defense comes from philosophers who have engaged directly with the psychological data. They argue that Harman and Doris relied on an outdated or caricatured view of personality psychology.

  *   **The Aggregation Principle:** Philosophers like **Christian Miller** (Wake Forest) and **Nancy Snow** (Notre Dame) have pointed out that the situationist critique relies on single-instance behaviors (e.g., did you help in *this* specific scenario?). Personality psychology has long established that traits predict behavior best when aggregated across time and situations. The fact that a trait does not predict a single action in a high-pressure situation does not prove the trait doesn't exist; it proves that traits are probabilistic, not deterministic.
  *   **Interactionism:** The seminar presented a "Person vs. Situation" dichotomy. Contemporary virtue ethicists (and many modern personality psychologists) argue for interactionism. Virtues are not context-independent robotic scripts; they are dispositions to perceive and react to *specific* situational features. Failing to act courageously in a Milgram scenario might indicate a lack of courage, but it might also indicate that the situation successfully masked the moral features that courage responds to.
  *   **The Zimbardo Problem:** You likely know the recent revelations regarding the Stanford Prison Experiment (SPE). Philosophers who latched onto SPE (as many early situationists did) are now in a weak position. Contemporary virtue ethicists, such as **Rachana Kamtekar**, have noted that relying on SPE to dismantle Aristotelian ethics is building a house on sand. If the data is flawed, the philosophical conclusion loses its empirical force.

  ### 2. Revising the Theory of Virtue (The "Rarity" and "Fragmentation" Theses)
  Perhaps the most substantive philosophical response is to concede some empirical ground while denying that it kills the theory.

  *   **The Rarity Thesis:** This is the strongest counter-argument. As **Kamtekar** and others have noted, Aristotle never claimed that *most* people possess robust virtues. He explicitly stated that virtue is rare and that the *phronimos* (person of practical wisdom) is hard to find. The situationist critique argues: "Milgram shows ordinary people aren't virtuous." The virtue ethicist responds: "Agreed. That's why we need ethics." If virtue ethics were a descriptive theory claiming everyone *is* good, Milgram would refute it. But it is a normative theory about what constitutes human flourishing and how to achieve it, acknowledging that most people currently fall short.
  *   **Local vs. Global Traits:** Some philosophers have modified the Aristotelian view to align better with the data. **John Doris** himself suggests "local traits" (e.g., honesty-in-the-workplace rather than global Honesty). While this abandons the Aristotelian "Unity of Virtues," it preserves a trait-based account of moral psychology. Others, like **Christian Miller**, argue for a "mixed theory" where we acknowledge our fragility but maintain that character improvement is possible through situation management.
  *   **Virtue as Skill:** Philosophers like **Julia Annas** and **Matt Stichter** argue that virtue is better understood as a practical skill (like playing piano) rather than a fixed state. A pianist might play poorly under extreme stress; that doesn't mean they lack the skill, nor does it mean the skill doesn't exist. It means skill acquisition is developmental and fragile. This shifts the focus from "do they have the trait?" to "are they on the trajectory of acquisition?"

  ### 3. The Normative/Descriptive Distinction
  Finally, there is a meta-ethical response. Even if the situationists are 100% correct that humans lack robust cross-situational traits, it does not follow that we should abandon virtue ethics.

  *   **The Is-Ought Gap:** Virtue ethics is primarily normative. It asks, "What kind of person *should* I become?" The situationist critique is descriptive: "Humans *are* situationally sensitive." Even if we are naturally prone to obedience, it does not follow that obedience is virtuous or that we cannot train ourselves to resist it.
  *   **Situation Management as Virtue:** A sophisticated virtue ethicist accepts the data and incorporates it. If we know we are prone to the Fundamental Attribution Error or obedience to authority, cultivating the virtue of *situational awareness* becomes part of the moral life. Recognizing our fragility and structuring our environments to support virtue (e.g., avoiding "bad barrels") is itself an exercise of practical wisdom.

  ### Why Wasn't It Abandoned?
  To answer your specific question on why the program wasn't abandoned: **Because the critique attacked a strawman of virtue ethics that few serious philosophers actually held.**

  The version of virtue ethics Harman attacked was one that claimed:
  1.  Most people have robust, global character traits.
  2.  These traits deterministically cause behavior across all situations.

  Very few Aristotelians claim (1), and almost none claim (2). Once the debate moved past the initial shock (2000–2005), the literature shifted toward **empirically informed virtue ethics**. The field didn't die; it became more psychologically sophisticated.

  ### Recommendations for Your Dissertation
  If you are citing this debate, I strongly advise against framing it as "Psychology proved Philosophy wrong." A more accurate and defensible framing would be:

  1.  **Acknowledge the Impact:** The situationist critique successfully ended the era of "armchair moral psychology." Philosophers can no longer make empirical claims about human nature without engaging the data.
  2.  **Cite the Nuance:** Distinguish between the *strong* situationist claim (traits don't exist) and the *weak* claim (traits are less robust than folk psychology assumes). Most contemporary virtue ethicists accept the weak claim.
  3.  **Key Citations:**
      *   **For the Critique:** John Doris, *Lack of Character* (2002); Gilbert Harman, "The Nonexistence of Character Traits" (2000).
      *   **For the Rebuttal:** Rachana Kamtekar, "Situationism and Virtue Ethics on the Content of Our Character" (2004); Christian Miller, *Character and Moral Psychology* (2014); Nancy Snow, *Virtue as Social Intelligence* (2010).
      *   **For the Empirical Nuance:** David Funder's work on the accuracy of personality judgments; the replication issues surrounding Zimbardo (e.g., Haslam & Reicher, 2006).

  **Summary:** The seminar you audited is presenting a "time capsule" version of the debate from roughly 2005. The current consensus is that virtue ethics survives the situationist critique, but it survives by becoming more empirically rigorous, acknowledging the fragility of virtue, and focusing on the *development* of character rather than its static existence. It is not a refusal to update; it is a theoretical adaptation.
