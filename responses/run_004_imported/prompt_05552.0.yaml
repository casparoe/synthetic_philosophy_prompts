      *   **Why?** Because of the Riemann Rearrangement Theorem. If a series converges conditionally but not absolutely, you can rearrange terms to sum to any real number, or diverge. Since the order of outcomes in a probability space shouldn't arbitrarily change the expectation, the standard definition requires absolute convergence to ensure uniqueness and stability.
