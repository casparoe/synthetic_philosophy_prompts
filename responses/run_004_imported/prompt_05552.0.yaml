          $$E[|X|] = \sum_{n=1}^{\infty} \left| (-1)^{n+1} \frac{1}{n} \right| = \sum_{n=1}^{\infty} \frac{1}{n}$$
      *   This is the Harmonic Series, which diverges to $+\infty$.
