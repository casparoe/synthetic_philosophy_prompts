      *   *Part 3 Comment:* Schopenhauer actually disliked opera because words limit music. Wagner loved Schopenhauer, but Schopenhauer didn't know Wagner's mature work and generally prioritized pure instrumental music.
      *   *JSON Structure:* Needs keys like `part_1`, `part_2`, `part_3`, `overall`. Each part needs `score` and `comment`.

  6.  **Refining the Grading Criteria:**
      *   Let's use a score out of 10 for each part to match the user's suggestion ("score out of 10 for each of the three parts").
