      *   *The Verdict:* The teammate is warning against a real cognitive bias (anthropomorphism), but a total ban is likely overkill and hinders communication.
      *   *The Framework:* Suggest a "Functional Anthropomorphism" guideline.
      *   *Specific Swaps:* Give concrete examples of how to rewrite the reports to satisfy both parties.
      *   *The "Why":* Explain the technical nuance (probabilistic vs. deterministic) to help the user understand the teammate's anxiety.
