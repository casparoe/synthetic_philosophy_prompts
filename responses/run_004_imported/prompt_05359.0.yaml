          *   *Follow-up:* Does this rely on a specific description of the "historical normal condition"? Is that description itself semantic?

      *   **Distality/Indeterminacy Problem:**
          *   *Issue:* Selection favors reproduction. Is the content "Fly," "Protein," "Survival," or "Retinal Stimulus"?
