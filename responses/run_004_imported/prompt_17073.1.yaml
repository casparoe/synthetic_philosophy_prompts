  *Better angle:* The "payoff" isn't just the grade. It's the quality of the education. If everyone defects (hoards info), everyone learns less. If everyone cooperates, everyone learns more. Even the selfish agent prefers a high-knowledge environment to a low-knowledge one, even if rank stays the same. I will focus on the "environment" payoff.

