answer: |-
  Good morning, families, faculty, and the Class of 2024.

  For those who don't know me, I'm the Salutatorian. Which is a fancy way of saying I finished second. My friend Priya, who is giving the Valedictory address after me, beat me by 0.02 GPA. That is roughly the grade value of one extra-credit worksheet from sophomore year. I've done the math. I know exactly which worksheet it was. And while I'd love to say I'm taking the high road, the truth is, I'm just taking the slightly lower podium.

  Standing here, looking out at all of you, I've been thinking about what actually binds us together. We often talk about "school spirit" or "friendship," but if we're being honest, this year was defined by something sharper. We were curved. From freshman biology to AP Calc, there was this unspoken understanding that for me to go up, someone else might have to go down. In that environment, sharing notes wasn't just generosity; it was a strategic risk. Helping a classmate study could literally lower your own rank.

  It sounds a lot like the Prisoner's Dilemma. And for the fifteen of us who took Mr. Alvarez's Logic and Decision Theory seminar, you know exactly where I'm going. For everyone else, stick with me.

  In that class, we studied Douglas Hofstadter's idea of *superrationality*. Here's the gist: Imagine you and another person are playing a game. You can't talk to each other. You can't enforce promises. But you know one thing for certain: the other person reasons exactly like you do. You are mirrors.

  If you decide to be selfish, you have to assume they will reason their way to the same selfish conclusion. If you decide to cooperate, you assume they will land on cooperation too. You aren't betting on their morality. You are betting on the symmetry of your logic. Since mutual cooperation pays better than mutual selfishness, the only rational move—even for a purely selfish agent—is to cooperate.

  Now, Mr. Alvarez is in the audience today, and he told me if I confuse this with Kant's Categorical Imperative, he will stand up and walk out. So let me be clear: This isn't about being "good." It's not about universal moral laws. It is cold, hard calculation. It is the argument that helping someone else is the optimal strategy for *you*, provided you recognize that your fate is mathematically linked to theirs.

  For four years, we felt the pressure to defect. To hoard information. To view the person sitting next to us as a competitor for a limited resource. And sure, there were moments we gave in to that. We're human. But looking back, the superrational move was the one that actually got us here.

  Because high school wasn't actually a one-shot game. It was the first round of a much larger iterated dilemma. If we had truly treated this as a zero-sum war, the stress would have broken us. The collaboration that *did* happen—the study groups, the shared flashcards, the texts at 11 PM explaining a concept you finally understood—that wasn't charity. That was us intuitively recognizing that a rising tide lifts all boats. Even if you only cared about your own GPA, you benefited from being in a class where the average understanding was high, where the discussion was sharp, where the people around you were pushed to be better.

  We are leaving a building where we were taught to compete for ranks. But we are entering a world where the payoff matrix is different. In the real world, my success is not limited by yours. In fact, your success increases the value of my network, my community, and my opportunities.

  So, class, here is my charge to you. When you face a choice in college, or in your careers, or in your relationships, you will feel the urge to defect. To protect your own interests by closing the door on others. It feels safer. It feels rational.

  But I'm asking you to look at the symmetry. Look at the person across the table. Assume they are just as smart, just as scared, and just as reasoning as you are. If you choose isolation, you condemn them to isolation, and you condemn yourself to a world of isolates. If you choose collaboration, you invite them into a world of collaboration.

  Do not cooperate because you are told it is "nice." Cooperate because it is the only move that maximizes the payoff for everyone, including you. Trust the logic. Trust the mirror.

  Priya, I expect you to share that 0.02 with me in the afterlife. Class of 2024, let's go out there and solve for the best outcome.

  Congratulations.
