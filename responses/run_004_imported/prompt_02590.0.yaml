      *   Move 6: J (Logically sound, empirically shaky due to open-label placebo research).

      *The Big Missing Thing:* **Predictive Processing.** The brain doesn't record reality; it predicts it. The affirmation isn't a description; it's a *prior*.

  7.  **Final Review against constraints:**
      *   Go through move by move? Yes.
