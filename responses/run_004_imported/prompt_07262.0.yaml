answer: |-
  Good evening. For those who don't know me, I'm a friend of the couple from their local meetup group. Which means roughly half of you know me as the person who talks too much about decision theory, and the other half know me as the person the bride hides from when she wants to have a normal conversation.

  I know what you're expecting. You're expecting me to stand up here and make the easy joke. You're waiting for me to say that after years of insisting that rational agents should never assign a probability of 0 or 1 to any empirical proposition, [Bride] has finally found something she's certain about. You're waiting for me to say she's finally "rounded to a point estimate."

  I'm not going to make that joke. Mostly because she would be genuinely offended, but also because it's wrong. And getting it wrong would miss the most beautiful thing about what's happening today.

  For the family and friends who haven't had the pleasure of hearing [Bride]'s dissertation defense: Her entire career is built on the idea that when the world is ambiguous, pretending you have a precise number is dishonest. If you ask her if it's going to rain, she won't say "70%." She'll give you a range, and a lecture on the Ellsberg paradox, and explain why forcing a single number ignores the complexity of the evidence. She believes that acknowledging uncertainty isn't weakness; it's intellectual honesty.

  So, when we look at a wedding vow, there is a tension. A vow sounds like a prediction. It sounds like saying, "I predict with 100% certainty that we will stay together forever." But if you know [Bride], you know she can't say that. Cromwell's Rule forbids it. You cannot assign logical certainty to an empirical future. Life is too murky. The evidence is too ambiguous.

  If [Bride] stood up here and claimed she *knew* this marriage would be easy, or guaranteed, or immune to the chaos of life, she would be violating her own deepest principles. She would be lying about the world.

  But that's where we get to the joke. And I promise this lands for everyone, even if you don't know what a "credal set" is.

  [Bride] isn't violating her principles today. Because a wedding vow isn't a prediction. It's a policy.

  To the family: She's not promising that the weather will be perfect. She's promising that she's bringing an umbrella.
  To the rationalists: She isn't collapsing the distribution to a point estimate of success. She's making "staying together" E-admissible across the entire credal set.

  In other words, she's not claiming she knows the future. She's claiming that *no matter how the probabilities shift*, no matter how wide the confidence interval gets on the hard days, her decision rule remains fixed.

  This is why their marriage is actually more robust than the standard model. Most people treat marriage like a bet: "I bet we'll be happy." And when the evidence updates—when things get hard, or ambiguous, or murky—their credence drops, and the bet looks like it's losing.

  But [Bride] and [Groom] aren't making a bet. They're building a pre-commitment device. They are acknowledging that the evidence for the future is genuinely imprecise. They know there will be days where the probability of happiness feels low. They know there will be ambiguity. But they are binding their future selves to a course of action that doesn't depend on the daily fluctuation of the odds.

  [Groom], you are the only variable she is willing to treat as a constant. Not because she claims to know you perfectly—she knows better than to claim she knows anything perfectly—but because she has decided that for every possible world consistent with her current evidence, the dominant strategy is "us."

  This is a much more moving commitment than blind certainty. Blind certainty is fragile. It breaks when the first piece of contradictory evidence shows up. But a commitment made in full view of the ambiguity? A commitment that says, "I see the range of possible futures, I see the risks, I see the uncertainty, and I am choosing this path across all of them"? That is antifragile.

  [Bride], you have taught us that it is rational to hold a range of possibilities in our heads. But today, you teach us that it is human to hold a single promise in our hands. You don't have to round your numbers to make this vow true. You just have to bind your utility function.

  So, if everyone could raise a glass.

  To [Bride] and [Groom]. May your credal sets be wide, may your evidence always be updating, and may your policy function always, always converge on each other.

  To the couple.
