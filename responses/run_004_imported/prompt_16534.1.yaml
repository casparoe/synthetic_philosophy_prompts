answer: |-
  This is actually a perfect real-world example for an ethics class. You've stumbled right into a classic debate involving **logical fallacies**, **moral standing**, and the **ethics of blame**.

  Here is the breakdown of whether her comeback holds up, viewed through a few different ethical lenses.

  ### 1. The Logical Lens: *Tu Quoque*
  Logically, your sister is correct. She is pointing out a distinction between the **truth of a claim** and the **behavior of the person making it.**

  In logic, this is related to the *Tu Quoque* (Latin for "you also") fallacy. If someone says, "Smoking causes cancer," and you reply, "But you smoke!", you haven't proven that smoking *doesn't* cause cancer. The factual claim stands on its own merits, regardless of the messenger.

  *   **Her point:** "DoorDash is unhealthy/wasteful" is a factual claim. Her eating habits do not change the nutritional content of the food or the carbon footprint of the delivery.
  *   **Verdict:** Logically, she is right. Her hypocrisy does not make her factually wrong.

  ### 2. The Ethical Lens: "Standing to Blame"
  This is where your ethics class material really kicks in. While she might be *factually* right, ethics asks whether she has the **moral standing** to criticize you.

  Many philosophers argue that hypocrisy undermines a person's **standing to blame**. Here is why:

  *   **The Equality Argument:** Blame often implies a hierarchy (I am holding you to a standard). When someone is a hypocrite, they violate the principle of equality. They are saying, "We are both subject to this rule, but I am exempting myself while punishing you." This is unfair.
  *   **The Sincerity Argument:** For blame to be morally constructive, it usually needs to come from a place of caring about the *principle*, not just controlling the *person*. If she isn't following the rule herself, it suggests she doesn't actually respect the rule; she just wants to police you.
  *   **The "Clean Hands" Doctrine:** In many ethical frameworks, if you are actively violating a norm, you lose the authority to enforce that norm against others until you rectify your own behavior.

  *   **Verdict:** Ethically, she is on shaky ground. By admitting she does it "every night for 3 years," she admits she is not committed to the value she is preaching. This compromises her authority to lecture you.

  ### 3. The Degree of Hypocrisy
  There is a nuance here regarding the *degree* of the action.
  *   **You:** 5 nights a week.
  *   **Her:** 7 nights a week (every night).

  She is technically doing the "worse" version of the behavior. If the argument is about moderation, she has failed harder than you have. However, if the argument is about *health*, both of you are engaging in the behavior deemed unhealthy.

  If she said, "I order out sometimes, but 5 times a week is too much," she would have more standing. But by ordering *every* night, she isn't modeling "moderation"; she is modeling "excess." This makes her lecture feel less like guidance and more like projection.

  ### 4. The Function of Blame
  In ethics, we ask: *What is the point of blaming someone?*
  *   **Constructive Blame:** Aimed at helping the person improve or upholding a shared value.
  *   **Destructive Blame:** Aimed at asserting dominance, venting frustration, or making the blamer feel superior.

  Her comeback ("I never said I was perfect") suggests she views her criticism as **informational** ("I am giving you facts"). But because she is "lecturing" you while ignoring her own behavior, the dynamic feels **relational**. It feels like she is trying to establish moral superiority without doing the moral work.

  ### The Conclusion
  Does her comeback hold up?

  *   **Factually:** **Yes.** Her bad habits don't make DoorDash healthy.
  *   **Morally/Relationally:** **No.** She lacks the **standing** to lecture you.

  **How to handle it (Ethically):**
  You can acknowledge the truth of her claim without accepting her blame. A philosophically sound response might be:

  > "You're right that DoorDash isn't healthy, and I'm not saying you're wrong about the facts. But it's hard to take a lecture on discipline from someone who isn't practicing it themselves. If we both think it's a problem, maybe we can hold each other accountable instead of you just critiquing me."

  This validates the *truth* (avoiding the logical fallacy) but challenges her *standing* (addressing the ethical hypocrisy). It shifts the dynamic from **Parent/Child** (lecturing) to **Peer/Peer** (shared responsibility).
