answer: |-
  **Setting:** *A quiet study in Egmond-Binnen, Holland. The year is 1648. Though historically these arguments were exchanged via letters carried by messengers, we imagine here a momentary convergence of minds. René Descartes sits by a window, the light failing. Henry More, younger and earnest, sits opposite, a copy of the* Discourse on Method *resting on his knee.*

  **Descartes:** You have read my *Discourse*, Master More. You know where I stand. The beast is a machine. It is constructed by the hands of the Creator, yes, but it is clockwork nonetheless. When a wolf pursues a hare, it is no more thinking than the pendulum of a clock thinks when it marks the hour.

  **More:** With all due reverence for your genius, Monsieur Descartes, this clockwork analogy strikes a chill into the heart of natural philosophy. I have watched a dog, sir. I have seen it tremble when raised to be beaten, and fawn when caressed. I have seen it dream, its legs twitching in sleep as if chasing a phantom hare. If this is merely the grinding of gears, then the line between the living and the dead is not drawn where Scripture or reason suggests.

  **Descartes:** You mistake the perfection of the mechanism for the presence of a mind. Consider this: a clock tells the time more accurately than any man. Does the clock possess astronomy? A swallow builds a nest more perfectly than any architect. Does the swallow possess geometry? No. These actions proceed from the disposition of their organs. The visual spirit strikes the retina, the animal spirits flow to the muscles, and the action follows. It is necessity, not choice.

  **More:** But necessity does not account for novelty. I have seen a dog, denied the direct path to meat, pause, look about, and leap a fence to circumvent the obstacle. A machine moves as it is pushed. If the path is blocked, the machine stops. The dog *contrives*. It adapts. This suggests an internal principle of life—a sensitive soul—that perceives ends and chooses means.

  **Descartes:** You attribute to the dog what belongs only to the universal instrument of reason. Reason is a tool that serves in all circumstances. A man who lacks language can still invent signs to make himself understood, as the deaf and mute do. But look at the beasts. In a hundred years, a spider does not weave a web more cunning than its ancestor. They do not improve. They do not speak. Even the magpie and the parrot, which you might cite, utter words only as a thrush mimics the wolf's howl. They arrange sounds, yes, but they cannot arrange *signs* to declare a thought that is new. They signal passion—hunger, fear—but they do not say, "I fear that which I cannot see."

  **More:** Is the cry of pain not a declaration? When you strike a dog, it yelps. If you say it feels no pain, you imply that God has fitted the beast with a tongue to lie. The yelp is not merely the squeak of a rusted hinge. It is a plea. To deny the animal the sensation of suffering is to make the Creator a deceiver, who paints the countenance of agony upon a face that feels nothing.

  **Descartes:** I do not say God deceives. I say you confuse the motion of the body with the passion of the soul. When I touch a hot iron, my flesh withdraws before I even feel the burn. This is a reflex of the nerves. The dog's yelp is the same. It is a mechanical warning, instituted by nature to preserve the machine. The dog does not suffer in the mind, for it has no mind to suffer. It is damaged, and it signals damage. To attribute human sorrow to the beast is a superstition of the nursery, not a conclusion of metaphysics.

  **More:** Then let us speak of the soul's nature. You define thought as the sole attribute of the immaterial substance. But I ask you: is life itself material? Can mere extension, mere length and breadth and depth, generate the warmth of vitality? I say no. There must be a "Spirit of Nature," a plastic power that organizes matter. If you grant this for the growth of a plant, why deny it to the movement of a beast? If there is a spiritual principle in the lion that allows it to hunt with cunning, that principle is akin to mind, however dim. You strip the universe of its spiritual hierarchy and leave us with nothing but dead matter and the single light of man.

  **Descartes:** If you grant a spiritual principle to the lion, where do you stop? Does the worm have a spirit? The oyster? If beasts have souls, are they immortal? If they are mortal, how do they differ from the human body, which is also mortal? The theological danger is profound. If the beast has a soul that feels, and we kill it for food, are we cruel? If the soul is immortal, does the dog sit in Heaven? I avoid these absurdities by drawing a clean line. Extension is the body. Thought is the soul. Beasts have extension. They do not think. Therefore, they have no soul. They are alive, as a watch is "alive" with motion, but they are not *animated* by a thinking substance.

  **More:** You draw a clean line, but you cut through the flesh of reality. I do not argue that the dog contemplates theology. I argue that it perceives. It has an internal sense. It feels joy. If it feels joy, it feels pain. And if it feels pain, it is not a machine. A machine cannot be happy. You say the dog's play is mere agitation of the spirits? Then what is man's laughter? Is it not also a movement of the lungs and the diaphragm?

  **Descartes:** Man's laughter follows a judgment of the incongruous. The dog's play is a preparation of the limbs for the hunt, a heating of the blood. You look at the surface and see similarity. I look at the cause and see distinction. You argue from the outside in, Master More. You see the behavior and infer the mind. I argue from the inside out. I know my own mind with certainty—*cogito, ergo sum*. I do not find thought in the beast, because the beast cannot report it. Since it cannot report it, and since its actions are fully explained by the mechanics of the organs, I am justified in withholding the assumption of a soul. It is parsimony.

  **More:** It is a parsimony that buys clarity at the cost of charity. You say you withhold the assumption of a soul because the beast cannot speak. But consider the infant. The newborn babe cannot speak. It cannot arrange signs. By your criterion, is the newborn a mere automaton until it learns to babble?

  **Descartes:** The infant possesses the *potential* for reason, which unfolds as the organs mature. The beast possesses no such potential. Give a parrot a thousand years; it will never conjugate a verb. Give a mute child a thousand years; he will invent a language of his hands. The difference is in the nature of the substance, not the maturity of the organs.

  **More:** And yet, the dog knows its master. It distinguishes friend from foe not by scent alone, but by disposition. It remembers injury. It holds a grudge. Is memory not a function of the soul? If the animal spirits retain the trace of an injury, as you say, like a fold in a piece of paper, that is physics. But the *avoidance* of the man who struck him days later? That requires a holding of the past in the present. That is time. And beasts, like men, live in time.

  **Descartes:** Memory is often bodily. A horse remembers the road to the stable not because it recalls the journey, but because the movement of its legs on the stones triggers the next movement. It is a chain of physical causes. You insist on calling this "memory" or "grudge" because you project your own interiority onto the beast. I tell you, if you could see the inner workings of the dog as clearly as you see the gears of a clock, you would see that no "ghost" is required to turn the wheel.

  **More:** And I tell you, Monsieur, if you could feel the world as the dog feels it—the richness of the scent, the urgency of the hunt—you would see that no "clock" can capture the hunger. You reduce the world to geometry. But God did not create a geometry. He created a life. To deny the beast its life is to diminish the Creator's work. It suggests God took pleasure in building a puppet show of suffering, where things scream without pain and flee without fear.

  **Descartes:** God took pleasure in the efficiency of His laws. That the machine is so perfect it mimics pain is a testament to His engineering, not a mark of deceit. I maintain my position. Until a beast speaks to me of God, or of mathematics, or of anything absent from the immediate senses, I shall treat it as a marvel of nature, but a marvel of matter alone.

  **More:** And I shall maintain mine. Until you can explain how dead matter becomes warm affection without a spark of the divine, I shall treat the beast as a brother in vitality, if not in reason. You seek to protect man's soul by stripping the beast of its life. I fear you protect it by locking it in a prison of solitude.

  **Descartes:** *(Pauses, looking out into the garden where a bird lands on the sill)* Perhaps. But solitude is the price of certainty.

  **More:** And certainty is the price of love.

  *(Descartes turns back from the window, his expression unreadable. More closes the book on his knee. Neither bows, but the tension remains, unresolved, hanging in the candlelight like the question of the bird outside: is it a machine of feathers, or a spirit of the air?)*
