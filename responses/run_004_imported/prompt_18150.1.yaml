answer: |-
  You are absolutely right, and your son-in-law is falling for a classic category error that even professional economists often miss. As a physicist, you have the perfect toolkit to explain why: **his system is non-ergodic.**

  He is confusing the **ensemble average** (the average outcome across many parallel universes) with the **time average** (the outcome of a single trajectory over time). In statistical mechanics terms, he is assuming the system explores phase space such that the time average equals the microcanonical ensemble average. It does not.

  Here is the breakdown you can use to nail this down at the next dinner.

  ### 1. The Math: Arithmetic vs. Geometric Mean
  Your son-in-law is calculating the **arithmetic mean** of the return factor $R$:
  $$E[R] = 0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$$
  This is correct for the *ensemble average*. If you had 1,000 clones betting once, the average return is 5%.

  However, wealth compounds multiplicatively. After $N$ trades, your wealth $W_N$ is:
  $$W_N = W_0 \cdot R_1 \cdot R_2 \cdot \dots \cdot R_N$$
  To find the long-term growth rate of a *single* trajectory, we need the **geometric mean**, or equivalently, the expected value of the logarithm of wealth. This is the Lyapunov exponent of the system.

  Let's calculate the expected log-return per trade ($E[\ln R]$):
  $$E[\ln R] = 0.5 \ln(1.5) + 0.5 \ln(0.6)$$
  $$\ln(1.5) \approx 0.4055$$
  $$\ln(0.6) \approx -0.5108$$
  $$E[\ln R] \approx 0.5(0.4055 - 0.5108) \approx -0.0526$$

  Because $E[\ln R]$ is **negative**, the typical trajectory decays exponentially.
  $$W_N \approx W_0 \cdot e^{N \cdot E[\ln R]} = W_0 \cdot e^{-0.0526 N}$$
  After 100 trades:
  $$W_{100} \approx W_0 \cdot e^{-5.26} \approx 0.0052 W_0$$
  This predicts a **99.5% loss**, which matches your simulation perfectly. The "average" balance of 130x is mathematically real but physically irrelevant to any single trader because it is driven by outliers.

  ### 2. The Physics: Ergodicity
  This is the core conceptual bug. An ergodic system is one where the time average equals the ensemble average.
  *   **Ensemble Average:** $\langle W \rangle = W_0 (1.05)^{100} \approx 131 W_0$. (What your simulation average showed).
  *   **Time Average:** $\overline{W} = W_0 \exp(100 \cdot \langle \ln R \rangle) \approx 0.005 W_0$. (What 99% of individuals experience).

  In this betting scenario, the variance is so high that the "average" participant is dragged down by the volatility drag (variance drain), while the ensemble average is propped up by an exponentially small number of paths that get incredibly lucky.

  As the number of trades $N \to \infty$, the fraction of paths that achieve the ensemble average goes to zero. Relying on the ensemble average for a single-life decision is like betting your life on the average outcome of Russian Roulette because the average payout is positive.

  ### 3. The Distribution (Why the Average Lies)
  The distribution of wealth after $N$ multiplicative steps converges to a **log-normal distribution**.
  In a log-normal distribution with high variance, the mean is exponentially larger than the median.
  *   **Median:** Represents the "typical" outcome (your >50% losing 99%).
  *   **Mean:** Heavily skewed by the right tail (the few freak winners).

  Your son-in-law is optimizing for the mean, but a rational agent with finite lifetime and capital should optimize for the median (or more precisely, the geometric growth rate).

  ### 4. The Rational Solution: Kelly Criterion
  If he wants to be truly rational (maximizing long-term growth rate), he should not go "all-in." He should bet the fraction $f$ that maximizes $E[\ln(1 + f \cdot \text{return})]$.

  Maximizing $g(f) = 0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f)$:
  Taking the derivative and setting to zero yields an optimal fraction **$f \approx 0.25$ (25% of stake)**.

  *   **At $f=100\%$ (All-in):** Growth rate is negative (-5.2% per trade). Ruin is certain.
  *   **At $f=25\%$ (Kelly):** Growth rate is positive. Wealth grows exponentially over time.

  ### 5. Philosophical & Economic Context
  You might find the work of **Ole Peters** (a physicist turned economist) particularly satisfying. He has built a field called **Ergodicity Economics** specifically to address this error. He argues that many economic paradoxes (like the St. Petersburg paradox) disappear once you stop assuming ergodicity and analyze time averages for a single agent.

  Furthermore, in utility theory, assuming **logarithmic utility** ($U(W) = \ln W$) is standard for rational risk management. Maximizing expected utility $E[\ln W]$ is mathematically identical to maximizing the geometric growth rate. Your son-in-law is assuming linear utility ($U(W) = W$), which implies that gaining \$1 billion is exactly as useful as avoiding the loss of \$1 billion is costly, regardless of your current net worth. That is rarely true for humans.

  ### Summary for Dinner
  You can tell him:
  > "You're calculating the expectation value of the ensemble, but you live in a single timeline. The system is non-ergodic. The arithmetic mean is 1.05, but the geometric mean is $\sqrt{1.5 \times 0.6} \approx 0.95$. By going all-in, you're guaranteeing a 5% decay per trade for almost every possible future history of your life. You're not being rational; you're confusing phase space averages with time averages."

  Your simulation was spot-on. The "average" investor in his strategy is a billionaire, but the "typical" investor is bankrupt. In finance, you can't spend the average.
