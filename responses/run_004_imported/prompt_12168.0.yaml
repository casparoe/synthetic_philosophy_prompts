      *Refining Move 2:* Farah says "nothing about the person's optimal action changes." In the genetic disease case (untreatable), the action (treatment) doesn't change. But life planning might. However, for the sake of the argument, if we assume *strictly* untreatable and no planning value, her point holds. I should note this nuance.

