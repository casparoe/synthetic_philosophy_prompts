prompt: |-
  In my graduate seminar on the metaphysics of causation, we recently spent two sessions on a question I still find genuinely unresolved: can omissions—failures to act, absences, non-events—be causes in their own right, or is "causation by omission" really just causal explanation wearing causal language it hasn't earned? The trouble is that our two most influential general theories of causation pull in opposite directions. A broadly Lewisian counterfactual account seems to entail, almost for free, that if my office philodendron would have survived had I watered it, then my failure to water it is among the causes of its death, since the death counterfactually depends on the omission in exactly the way the theory requires. A conserved-quantity or process theorist in the spirit of Salmon or Dowe denies this outright, since no physical process links my inaction to the plant's wilting, and offers at best a deflated "quasi-causal" relation to capture whatever truth there is in the claim without diluting causation proper.

  Matters get worse once you notice how promiscuous the counterfactual test is: my neighbor, the mail carrier, and for that matter a stranger on the other side of the planet all satisfy exactly the same counterfactual with respect to my plant, yet nobody wants to say all of them caused its death. The standard remedy is to restrict the field of candidate omissive causes to whoever had some relevant duty, or to whichever failure deviates from the statistically or causally "normal" course of events—but this seems to buy back selectivity only by smuggling normative or default-relative facts into what was supposed to be a purely metaphysical relation. A colleague from the law school who sat in on the session thought this was no real difficulty, since tort and criminal law have long conditioned liability for omissions on an antecedent duty of care; but that only tells us how lawyers manage the problem for their own purposes, not whether the underlying metaphysics can bear the weight, or whether "cause" in the courtroom and "cause" in the seminar room have quietly drifted apart.

  I'd like you to write an essay that actually settles this for me rather than surveying it. Lay out the strongest versions of the main positions—permissive counterfactual theories, process-theoretic denials that omissions are ever causes, Helen Beebee's proposal that we should sharply separate causation from causal explanation and treat omissive "causal" talk as explanation without causation, and the various duty- or normalcy-based restriction strategies—and weigh what each costs against what it buys. Then defend a specific verdict: are omissions ever genuine causes, and if so, is there a principled way to block the profligacy of candidate causes that doesn't covertly presuppose the very facts about duty, normalcy, or responsibility that appeals to omissive causation are so often meant to help establish (as in law, but also in everyday blame and praise)? A conditional verdict is fine, provided it is a real one—something like "omissions are causes only relative to a contextually fixed contrast class, and the profligacy worry is thereby a problem for careless paraphrase rather than for the metaphysics" would count; simply concluding that reasonable people disagree would not.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The metaphysics of causation by omission (can failures to act be causes?).
      *   **Context:** Graduate seminar level (needs sophistication, engagement with specific theories like Lewis, Salmon/Dowe, Beebee, etc.).
      *   **Goal:** *Settle* the issue (take a stand), not just survey. Weigh costs/benefits of main positions and defend a specific verdict.
      *   **Key Tensions:** Counterfactual dependence (Lewis) vs. Physical Process (Salmon/Dowe) vs. Explanatory Pragmatics (Beebee). The "Profligacy Problem" (everyone could have watered the plant) vs. Normative/Default restrictions (duty/normalcy).
      *   **Constraint:** No fence-sitting ("reasonable people disagree"). Must offer a conditional or definite verdict.
      *   **Tone:** Philosophical, rigorous, argumentative, yet accessible to a specialist audience.

  2.  **Deconstruct the Positions:**
      *   *Lewisian Counterfactualism:* Omissions are causes. If $C$ hadn't happened (omission), $E$ wouldn't have happened. *Cost:* Profligacy (too many causes), metaphysical weirdness (relata are absences).
      *   *Process/Conserved Quantity (Salmon/Dowe):* Omissions are *not* causes. No physical transmission. *Cost:* Counterintuitive (we say "lack of water killed it"), disconnects from scientific/legal practice.
      *   *Beebee (Causal Explanation):* Omissions aren't causes; they are causal *explanations*. Causation is real/physical; explanation is pragmatic. *Cost:* Might feel like semantic evasion, but handles profligacy well.
      *   *Restriction Strategies (Normative/Normalcy):* Omissions are causes *only if* there's a duty or deviation from normal. *Cost:* Smuggles normativity into metaphysics, circularity worries (using duty to define cause when we use cause to define duty).

  3.  **Formulate a Verdict:**
      *   I need to choose a path. The prompt asks to avoid the conclusion that "reasonable people disagree."
      *   *Option A:* Defend Omissions as Real Causes (with a fix for profligacy). Hard to do without normativity.
      *   *Option B:* Defend Process Theory (No Omissive Causation). Hard to reconcile with common sense and special sciences.
      *   *Option C:* Defend Beebee's Pragmatic/Explanatory View. This seems the most robust. It preserves the physical integrity of causation while accounting for the utility of omissive talk.
      *   *Refinement:* I will argue for a *hybrid contextualist view* that leans heavily on Beebee but integrates a specific account of "default relativity" that isn't purely normative but *ontological/pragmatic*. Actually, the strongest philosophical move here is often to deny that causation is a single monolithic relation. However, the prompt asks to settle *this* question.
      *   *Decision:* I will defend the view that **omissions are not ontological causes but are indispensable components of causal *explanation*, and the "profligacy" problem dissolves once we recognize that causal claims are inherently contrastive and context-sensitive.** This aligns closest with Beebee but pushes further to address the "smuggling normativity" worry. I need to show that "normalcy" isn't necessarily *moral* normativity but *statistical/systemic* expectation, which is legitimate for explanation even if not for fundamental metaphysics.
      *   *Wait, a stronger verdict:* I should argue that **causation is a relation between events, omissions are not events, therefore omissions are not causes.** However, because our explanatory practices require tracking dependencies, we treat them *as if* they were causes. The "profligacy" is blocked by *explanatory relevance*, not metaphysical restriction. This is the Beebee line, but I need to make sure I don't just say "Beebee is right." I need to argue *why* this is the only coherent option that saves causation from becoming a normative concept.

      *   *Revised Verdict:* I will argue that **omissions are not genuine causal relata.** Causation requires positive existence (process/energy). However, omissive *claims* are true in virtue of *counterfactual dependencies* embedded in a *contextually selected causal model*. The profligacy problem is solved not by restricting causation, but by recognizing that causal *attribution* is pragmatic. This avoids smuggling morality into metaphysics because the "duty" is an explanatory filter, not a metaphysical glue.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** State the problem clearly. The tension between counterfactual truth and metaphysical parsimony. State the thesis: Omissions are not causes *simpliciter*; they are explanatory proxies for counterfactual dependencies within a pragmatic model.
      *   **The Lewisian Trap:** Acknowledge the power of counterfactuals. Show why it leads to profligacy (the stranger on the planet). Show why adding "norms" to fix it corrupts the metaphysics (is causation moral?).
      *   **The Process Theoretic Refusal:** Acknowledge the physicalist integrity. No "nothing" traveling. But note the cost: it makes true sentences like "lack of water killed the plant" literally false or metaphorical. Too revisionist.
      *   **Beebee's Distinction:** Introduce the separation of Causation (metaphysical) vs. Causal Explanation (pragmatic). This is the pivot point.
      *   **The Verdict/Defense:**
          *   Adopt the view: Causation is physical/process-based. Omissive talk is explanatory.
          *   Address the "Smuggling Normativity" worry: Distinguish between *moral duty* (law) and *systemic expectation* (metaphysics/pragmatics). The neighbor didn't cause the death because the *causal model* of the plant's ecology doesn't include the neighbor. The owner is included because of the *system* (ownership/care), not just morality.
          *   Solve Profligacy: It's not about who *could* have acted, but who is *in the model*. The model is selected by context, not by hidden moral facts.
      *   **Conclusion:** Reiterate that this saves the objectivity of physical causation while validating the utility of omissive language without ontological bloat.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "it's just explanation" too deflationary?
      *   *Fix:* Emphasize that explanation tracks *real dependencies*. It's not "just" talk; it tracks real counterfactual structures, but "cause" is the wrong label for the *absence*.
      *   *Critique:* Does this solve the legal worry?
      *   *Fix:* Yes, because law is inherently normative. It *should* use a different standard than fundamental metaphysics. The seminar room and courtroom *do* drift apart, and that's a feature, not a bug.
      *   *Tone Check:* Ensure it sounds like a graduate-level philosophical essay. Use terms like "relata," "ontological commitment," "pragmatic encroachment," "contrastive."

  6.  **Final Polish:** Check against the prompt requirements.
      *   Settle the issue? Yes (Omissions are not causes).
      *   Lay out positions? Yes (Lewis, Salmon/Dowe, Beebee, Normative).
      *   Weigh costs/benefits? Yes.
      *   Address profligacy? Yes (via contextual modeling).
      *   Address normativity smuggling? Yes (distinguishing explanatory relevance from moral duty).

  7.  **Finalizing the Title:** Needs to be punchy. "The Nothing That Kills," "Absence as Explanation," etc. Let's go with "The Ontology of Absence." No, "Causation, Explanation, and the Illusion of Omissive Power."

      *(Self-Correction)*: I need to make sure I don't just repeat Beebee. I need to add value. I will emphasize the *contrastive* nature of causal claims to solve the profligacy issue specifically. The claim isn't "Omission caused E," it's "Omission rather than Action caused E rather than Survival." This makes the context explicit.

      *(Final Plan)*:
      1. Intro: The Dilemma.
      2. The Counterfactual Cost (Profligacy & Normativity).
      3. The Process Cost (Revisionism).
      4. The Beebee Pivot (Causation vs. Explanation).
      5. My Defense: Contrastive Pragmatics without Metaphysical Norms.
      6. Conclusion: The Verdict.

      *Wait, one nuance:* The prompt asks if there is a principled way to block profligacy *without* presupposing duty. If I say "it's pragmatic," is that principled? Yes, if the pragmatics are based on *explanatory interest* which is distinct from *moral duty*. I must make this distinction sharp. The owner is salient not because they *ought* to water, but because they are the *variable* in the relevant system model.

      *Let's write.*
answer: |-
  **Title:** The Ontology of Absence: Why Omissions Explain but Do Not Cause

  **Introduction**

  The metaphysics of causation faces a distinctive embarrassment in the phenomenon of omission. We speak confidently of causes: the spark caused the fire, the virus caused the fever. Yet we speak with equal confidence of absences: the lack of water caused the plant's death, the failure to brake caused the collision. If causation is a relation between existents, omissions present a category error; nothing cannot relate to something. If causation is a matter of counterfactual dependence, omissions are paradigmatic causes; the plant would not have died had the water been present.

  This seminar has rightly identified the stakes. If we accept omissions as causes, we risk a profligate ontology where every non-event that would have prevented an effect becomes a cause, implicating strangers on other continents in local tragedies. If we reject them, we sever metaphysics from scientific and legal practice, rendering true sentences literally false. The temptation is to seek a middle ground via normative restrictions—limiting omissive causation to those with a duty to act. But this smuggles ethics into ontology.

  My verdict is this: **Omissions are never genuine causal relata.** Causation is a physical relation between positive events or processes. However, omissive claims are indispensable tools of *causal explanation*. The profligacy problem is not solved by restricting the metaphysics of causation, but by recognizing the pragmatics of explanation. We can block the explosion of candidate causes without smuggling in moral duty by appealing to *contextually selected causal models* and *contrastive focus*. The courtroom and the seminar room do indeed use "cause" differently, and acknowledging this divergence is the only way to preserve the objectivity of metaphysics while validating the utility of omissive discourse.

  **The Counterfactual Trap and the Normative Smuggle**

  The Lewisian counterfactual account is the most natural home for omissive causation. On this view, $c$ causes $e$ if $e$ counterfactually depends on $c$. Since the plant's death depends on my failure to water it, the omission is a cause. The theoretical cost here is low, but the ontological price is exorbitant.

  As noted, the counterfactual test is promiscuous. The stranger in Antarctica satisfies the counterfactual: had they flown here and watered the plant, it would have lived. If counterfactual dependence is sufficient for causation, the stranger is a cause. To avoid this, proponents often restrict the field of candidate causes to "abnormal" omissions or those violating a "duty."

  This strategy fails metaphysically. First, it renders causation sensitive to moral or social conventions. If I sell the plant to a neighbor, my failure to water it ceases to be a cause because the duty transfers, even though the physical history of the plant remains identical. Causation becomes a function of ownership contracts rather than physical history. Second, it creates a circularity in legal and moral reasoning. We often establish liability by proving an omission caused harm. If the omission is only a cause *because* there was a liability-creating duty, we are defining the ground of liability (causation) in terms of the liability itself (duty).

  Thus, the permissive counterfactual view buys intuitive alignment with language at the cost of making causation normative, contextual, and ontologically bloated. It turns "cause" into a honorific we bestow on absences we dislike.

  **The Process-Theoretic Refusal**

  At the opposite extreme stand the process theorists (Salmon, Dowe). They argue that causation requires the transmission of a conserved quantity (energy, momentum). Since an omission involves no transmission—there is no "nothing" traveling from me to the plant—omissions cannot be causes.

  This view preserves the purity of physical causation. It blocks profligacy immediately: the stranger transmits no energy to the plant, nor do I. However, the cost is revisionism so severe it borders on error theory. In the special sciences (biology, medicine, engineering), omissions are treated as causally operative. A doctor says, "The patient died from a lack of insulin." If the process theorist says this is literally false, they are claiming that vast swathes of successful scientific discourse are systematically mistaken.

  Furthermore, process theory struggles with "prevention" cases that feel structurally identical to omission. If I shoot a man, I interrupt the biological processes of his life. If I withhold insulin, I allow the diabetes to interrupt them. The physical outcome is identical; the difference is merely the history of my intervention. To say one is causation and the other is not seems to privilege the history of the agent over the physics of the effect. Process theory saves metaphysics by sacrificing explanatory utility.

  **Beebee's Distinction: Causation vs. Explanation**

  Helen Beebee offers the most promising pivot. She argues we must distinguish *causation* (a mind-independent relation between events) from *causal explanation* (a pragmatic activity of answering "why" questions). On this view, omissions are not causes, but they are excellent causal explanations.

  When we say "the lack of water caused the death," we are not positing a relation between an absence and an event. We are asserting a counterfactual dependency: "The plant died, and had water been present, it would not have." This is true regardless of whether the absence is a "cause." The utility of citing the omission lies in its explanatory relevance: it identifies a lever we could have pulled to change the outcome.

  This dissolves the ontological worry. There are no negative events in the world. But it retains the linguistic utility. We can keep saying "omissions cause death" as a *façon de parler*, provided we understand the underlying metaphysics is about positive processes and counterfactual dependencies.

  **The Verdict: Contrastive Pragmatics without Normative Metaphysics**

  I defend Beebee's core distinction but refine the mechanism for blocking profligacy. The worry remains: if explanation is pragmatic, isn't it still arbitrary why we cite *my* failure and not the *stranger's*? If we answer "because I had a duty," we return to the normative smuggle. If we answer "because it's normal for me to water it," we rely on statistical norms that may not track metaphysical reality.

  The solution is to treat causal claims as inherently **contrastive** and **model-relative**.

  1.  **Contrastivity:** Causal claims are elliptical. "The omission caused the death" really means "The omission *rather than the action* caused the death *rather than survival*." This structure inherently limits the field. We are comparing two possible histories: one where I water, one where I don't. We are *not* comparing a history where I don't water against a history where the Antarctic stranger does. The stranger is not part of the contrast class.
  2.  **Causal Models:** Explanations operate within a "causal model"—a simplified representation of the system containing specific variables. In the model of "Office Plant Maintenance," the variable *Owner-Watering* is included. The variable *Stranger-Watering* is excluded, not because it is morally irrelevant, but because it is *exogenously fixed* in that model. It is not a variable the system tracks.

  This approach blocks profligacy without normative smuggling. Why is the owner in the model and the stranger out? Not because of moral duty, but because of **systemic integration**. The owner is part of the functional system that sustains the plant (ownership implies a control loop). The stranger is external to that system. This is a factual claim about social and physical structures, not a moral claim about obligation.

  Consider the legal colleague's objection: law conditions liability on duty. My verdict accommodates this. Law is not doing fundamental metaphysics; it is constructing a specific *normative causal model*. In the legal model, "Duty" is a variable. In the metaphysical model, it is not. When the lawyer says "Your omission caused the death," they mean "Within the legal model where you are a variable, your inaction explains the liability." When the metaphysician says "Your omission did not cause the death," they mean "There is no physical relation between your inaction and the wilting." Both can be true in their respective domains.

  **Addressing the Circularity Worry**

  Does this still presuppose the facts it aims to establish? In law, we use causation to establish liability. If causation is model-relative, and the model includes duty, is it circular?

  No. The circle is broken by the distinction between *explanatory relevance* and *ontological grounding*.
  *   **Metaphysics:** Asks what grounds the relation. (Answer: Physical processes/Counterfactuals).
  *   **Explanation:** Asks what information is relevant. (Answer: Variables within the model).
  *   **Law:** Asks what variables trigger responsibility. (Answer: Variables linked by duty).

  We do not use the omission to *prove* the duty exists; we use the duty to *select* the omission as the explanatorily relevant factor. The metaphysics remains clean: the plant died due to physiological dehydration processes. The explanation selects *my* failure as the salient reason *why* those processes were not interrupted. The profligacy is blocked because the stranger is not a salient variable in the explanatory context of "Office Plant Maintenance," regardless of their counterfactual power.

  **Conclusion**

  We must resist the urge to make the world accommodate our language. The world contains events, processes, and dependencies. It does not contain absences. Therefore, omissions are not causes. To insist otherwise is to conflate the map with the territory, allowing our explanatory practices to dictate our ontology.

  However, we need not discard omissive talk. It is vital for science, law, and life. We save it by reclassifying it as *causal explanation* rather than *causation*. The profligacy problem vanishes once we recognize that explanation is contrastive and model-relative. We cite the owner's omission rather than the stranger's not because the owner's inaction exerts a mysterious causal force, but because the owner is a variable in the relevant system, while the stranger is not.

  This verdict demands a concession: the "cause" in the courtroom is not the "cause" in the seminar room. But this is not a drift; it is a necessary differentiation. The courtroom seeks responsibility; the seminar seeks truth. Omissions are powerful tools for assigning the former, but they are shadows, not substances, in the latter. To treat them as genuine causes is to invite a metaphysics where nothingness acts, and where the boundaries of causation are drawn by the shifting sands of moral expectation. We are better served by a metaphysics of positive processes, paired with a pragmatics of explanation that allows us to speak of what didn't happen, without pretending it exists.
