      *   **User's Doubt:** The "Intentional Stance" feels like dodging Descartes' actual question (do they *really* think/understand?).
      *   **Task:**
          1.  Evaluate if an LLM passes Descartes' two tests (Language, Flexibility).
          2.  Identify where Descartes' criteria strain hardest against LLMs.
