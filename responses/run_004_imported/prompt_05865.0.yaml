      *   *Descartes' Likely Reaction:* He would reject this vehemently.
      *   *Why?* Descartes isn't doing behavioral prediction; he's doing metaphysics. He wants to know the *nature* of the substance. For Descartes, "thought" (*cogitatio*) is the essence of the soul. To attribute thought to a machine is a category error. The Intentional Stance is instrumentalist; Descartes is realist about the mind. He cares about *truth*, not *utility*.
      *   *Connection to User's Friend:* The friend is right that it dodges the question. Descartes would agree that it dodges the question, but he would insist the question *must* be answered.

