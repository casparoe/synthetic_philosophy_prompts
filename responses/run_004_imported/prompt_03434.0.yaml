prompt: |-
  In the course of his 1686 correspondence with Antoine Arnauld over the Discourse on Metaphysics, Leibniz responds to Arnauld's worry that positing "several possible Adams" is as incoherent as positing "several possible me's." He writes:

  "When we consider in Adam a part of his predicates, for example, that he was the first man, put into a garden of enjoyment, and that, from his side, God took a woman, and, if we consider similar things, conceived sub ratione generalitatis (that is to say, without mentioning Eve or Paradise, or the other circumstances which constitute his individuality), and if we call the person to whom these predicates are attributed Adam, all this does not suffice to determine the individual, for there might be an infinity of Adams, that is to say, of possible persons to whom these would apply who would, nevertheless, differ among themselves. ... We must, therefore, not conceive of a vague Adam or of a person to whom certain attributes of Adam appertain when we try to determine him, if we would hold that all human events follow from the one presupposition, but we must attribute to him a concept so complete that all which can be attributed to him may be derived from his. ... It follows, also, that if he had had other circumstances, this would not have been our Adam, but another, because nothing prevents us from saying that this would be another. He is, therefore, another."

  Drawing on this passage, explain how Leibniz's way of individuating Adam bears on the modern debate between counterpart theory and transworld identity. Does his solution here anticipate David Lewis's counterpart-theoretic denial that any individual inhabits more than one possible world, or does it instead presuppose the sort of transworld identity that Kripke or Plantinga would defend against Lewis? Be specific about the role played by the notion of a "complete individual concept," and explain why the comparison to either side of the contemporary debate is more complicated than it might first appear.
