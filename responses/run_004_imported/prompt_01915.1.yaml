          *   BIL wants *causality* (Structure).
      *   **The Solution (The "Honest Version"):** Explain that the structural conditions created *vulnerability*, and the human actions provided the *trigger*.
      *   **Historical Context (Odessa 1870s):** Briefly touch upon real history to ground the advice. The 1870s saw the Panic of 1873, shifts in grain trade, steam vs. sail, railway expansion. This adds authenticity.
