      *   **Conclusion:** Theo is right that it violates VNM *over linear wealth*. You are right that it collapses to EU *over log wealth*. The deeper truth is that VNM is a framework for consistency, not a prescription for what to value. Kelly tells you *what* to value (log wealth) for survival. They aren't rivals; they operate at different levels.

