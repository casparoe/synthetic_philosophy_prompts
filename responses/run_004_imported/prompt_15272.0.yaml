          *   Single agent.
          *   Information is costless (free).
          *   The agent can update beliefs and choose the optimal action based on new beliefs.
          *   The "value" is defined relative to the agent's *current* prior and utility function.
          *   Crucially: It assumes the *payoff structure* (the game/rules of the world) remains fixed regardless of the information.

