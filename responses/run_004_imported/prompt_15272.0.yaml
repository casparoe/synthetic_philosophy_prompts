          *   *Ex-interim (after learning type):* Low-risk people know they are low-risk. They don't want to subsidize high-risk people. They opt out or demand lower premiums.
          *   *Result:* Pooling collapses. High-risk people lose coverage or pay huge premiums. Low-risk people save money but lose insurance benefits.
