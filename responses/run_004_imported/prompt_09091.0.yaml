answer: |-
  Given your background in statistical mechanics, you will appreciate that the disagreement here is not about the mathematics of stochastic processes—both sides agree on the difference between $\langle x \rangle_t$ and $\langle x \rangle_\Omega$ for non-ergodic dynamics. The disagreement is about the **normative mapping from physical dynamics to decision criteria.**

  To answer your question directly: **It is framing in the specific case of asymptotic multiplicative wealth, but it is substantive in the general theory of choice.**

  If the only decision problems available were infinite-horizon multiplicative gambles, Ergodicity Economics (EE) would merely be a physical derivation of Log-Utility Expected Utility Theory (EUT). However, once we expand the domain to additive risks, finite horizons, or subjective risk tolerances other than $\gamma=1$, the two frameworks prescribe genuinely different actions.

  Here is the location of the crux, broken down by where the actions diverge.

  ### 1. The Zone of Equivalence (Framing)
  You correctly identified the overlap. For an agent with wealth $W_t$ evolving via multiplicative dynamics ($dW_t = W_t \cdot \text{noise}$), the time-average growth rate is:
  $$ \bar{g} = \lim_{T\to\infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) = \mathbb{E}[\ln(1 + \text{return})] $$
  Maximizing $\bar{g}$ is mathematically identical to maximizing $\mathbb{E}[U(W)]$ with $U(W) = \ln(W)$.
  *   **EUT View:** An agent *chooses* log utility because they have a specific coefficient of relative risk aversion (CRRA) of $\gamma = 1$.
  *   **EE View:** An agent *must* use log utility because the dynamics are multiplicative. Any other utility function is "irrational" because it maximizes an ensemble average that the agent will never experience.

  In this narrow corridor, the dispute is purely foundational/philosophical. The actions (Kelly betting) are identical.

  ### 2. The Zone of Divergence: Additive Dynamics (Insurance)
  This is the most robust example of substantive disagreement. Consider a gamble with additive dynamics (e.g., a standard insurance deductible or a fixed-stake bet).
  $$ W_{t+1} = W_t + \Delta W $$
  *   **EE Prescription:** For additive dynamics, the time-average growth rate is equivalent to the ensemble average of the change: $\bar{g} \propto \mathbb{E}[\Delta W]$. EE prescribes **risk neutrality**. You should reject any insurance policy with a negative expected value (premium > expected loss), regardless of the variance, provided it doesn't lead to ruin (an absorbing state).
  *   **EUT Prescription:** An agent can validly possess a concave utility function ($U'' < 0$) over additive wealth changes. EUT prescribes **buying insurance** even if the premium exceeds the expected loss, provided the utility gain from risk reduction outweighs the cost.

  **The Crux:** EE claims that risk aversion over additive risks is a cognitive error (misapplying multiplicative intuition to additive problems). EUT claims risk aversion is a valid subjective preference regarding the *distribution* of outcomes, not just the time-average trend. If you encounter an EE proponent and a standard EUT agent in an insurance market, they will trade against each other.

  ### 3. The Zone of Divergence: Finite Horizons (Samuelson's Objection)
  EE relies on the limit $T \to \infty$ to define the time average. In practical decision-making, horizons are finite.
  *   **The Problem:** For finite $T$, the distribution of terminal wealth $W_T$ is log-normal (in the multiplicative case). The *median* outcome converges to the geometric mean, but the *mean* outcome is determined by the arithmetic mean.
  *   **EUT Action:** An agent with $U(W) = W$ (risk neutral) maximizes the arithmetic mean. For finite $T$, this may prescribe a bet size larger than Kelly. An agent with $U(W) = -W^{-1}$ ($\gamma = 2$) prescribes half-Kelly.
  *   **EE Action:** EE generally prescribes maximizing the asymptotic growth rate (Kelly) regardless of $T$, arguing that "you live in time."

  **The Crux:** Samuelson (1971) showed that maximizing geometric mean does not maximize expected utility for finite $N$ unless $U=\ln$. If an agent has a specific liability due at $T=10$ years, maximizing the asymptotic growth rate might result in a probability distribution of $W_{10}$ that is unacceptable (e.g., too much variance below the liability threshold). EUT allows tailoring the utility function to the specific horizon and liability structure; EE treats the horizon as secondary to the dynamic class.

  ### 4. The Ontological Crux: Probability and Preferences
  The deepest disagreement is not about optimization but about the ontology of probability and utility.

  *   **EUT (Bayesian/Subjective):** Probability represents a degree of belief. Utility represents subjective preference. The "ensemble" is a representation of uncertainty, not necessarily a physical set of parallel worlds. Risk aversion is a primitive preference.
  *   **EE (Frequentist/Physical):** Probability represents physical frequency in time. Utility is not a preference but a **derived quantity** determined by the dynamical class of the wealth process.
      *   Multiplicative dynamics $\to$ Log utility.
      *   Additive dynamics $\to$ Linear utility.
      *   Tsallis dynamics $\to$ Power utility (as argued in some extensions).

  **Why this matters:** Under EUT, if I tell you "I am more risk-averse than log," the theory accepts this. Under EE, if you tell you "I am more risk-averse than log" for a multiplicative process, the theory diagnoses this as a failure to understand the ergodicity properties of your environment. EE attempts to **endogenize risk aversion**, whereas EUT treats it as **exogenous**.

  ### Summary Verdict
  Is there a decision problem where they prescribe different actions? **Yes.**

  1.  **Insurance Markets:** EE rejects actuarially unfair insurance (unless ruin is imminent); EUT accepts it for concave utility agents.
  2.  **Portfolio Allocation:** EUT allows $\gamma \neq 1$ (e.g., pension funds often act as if $\gamma > 1$); EE mandates $\gamma = 1$ for multiplicative assets.
  3.  **One-off Gambles:** EUT evaluates based on the utility of the single outcome distribution; EE struggles to define a "time average" for $T=1$ without importing ensemble concepts or assuming the gamble is part of a longer sequence (which changes the problem definition).

  **Conclusion:**
  For the specific case of **asymptotic multiplicative wealth growth**, Ergodicity Economics is a rigorous **reframing** of Log-Utility EUT that provides a physical justification for the Kelly criterion. It successfully debunks the idea that linear utility is the "default" rational stance for multiplicative processes.

  However, as a **general theory of decision-making**, it is substantively more restrictive than EUT. It claims that dynamics constrain preferences. Critics argue that preferences (consumption needs, bequest motives, sleep-at-night factors) legitimately diverge from pure wealth growth dynamics. Therefore, the dispute bottoms out in whether one views risk aversion as a **psychological primitive** (EUT) or a **dynamical error** (EE).

  Given your history in stat mech, you might view EE as an attempt to apply the **microcanonical logic** (fixed constraints, dynamics dictate states) to economics, whereas EUT operates more like the **canonical ensemble** (coupled to a heat bath of preferences, where temperature/risk-aversion is a free parameter). EE argues the "temperature" is fixed by the dynamics; EUT argues it is fixed by the agent.
