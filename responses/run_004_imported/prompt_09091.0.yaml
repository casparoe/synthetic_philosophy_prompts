      *   Conclusion: It is framing in the specific Kelly case, but substantive in the general theory of choice.

  11. (Final check against prompt): "Locate the actual crux... genuinely different actions... or framing?"
      *   Answer: Both. Framing in the specific log-utility/multiplicative case. Substantive in additive/insurance/finite-horizon cases. The core disagreement is whether dynamics *constrain* preferences or merely *inform* them.

  12. (Wait, one more thing): Make sure to mention *non-ergodicity* properly. In stat mech, ergodicity breaking means phase space isn't fully explored. In EE, it means time average $\neq$ ensemble average. EUT handles this by integrating over the ensemble with a weighting function ($U$). EE says the weighting function is fixed by the dynamics. That's the crux.

