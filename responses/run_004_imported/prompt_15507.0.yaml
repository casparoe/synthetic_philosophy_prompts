      *   *Counter-argument:* If payoffs include fairness, and this is common knowledge, BI *still* predicts early defection in many parameterizations, or at least defection before the end. The only way to get sustained cooperation in a finite game using standard rationality tools is usually *incomplete information* (uncertainty about whether the other player is actually a "fair" type or a "rational" type).
      *   *Key philosophical nuance:* The paradox of BI is often about the *coherence* of the concept itself (e.g., Aumann vs. Binmore debates). Does rationality require believing the opponent will play rationally even if they have already made a move that proves they aren't rational? This "off-equilibrium path" problem isn't solved by changing payoffs; it's solved by changing how we handle beliefs (e.g., sequential equilibrium).

