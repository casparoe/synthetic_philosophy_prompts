      *   *Leibnizian Monads:* Monads are unique, indivisible, and immaterial. You cannot "copy" a monad. A simulation is a material/functional construct. A monad is a metaphysical substance.
      *   *Conclusion:* Gödel would likely reject uploading as "survival." It would be, at best, a sophisticated puppet or a philosophical zombie. It lacks the *res cogitans* (thinking substance).

