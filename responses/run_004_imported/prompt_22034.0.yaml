      *   *Mind-Body Dualism:* He was a staunch dualist (specifically leaning towards Platonism and Leibnizian monadology). He believed the mind is distinct from the brain/matter.
      *   *The Gibbs Lecture (1951):* Argued that either mathematics is incompletable (human mind surpasses any finite machine) or there exist absolutely unsolvable problems. He leaned towards the mind surpassing the machine.
      *   *Leibniz/Monads:* Gödel admired Leibniz. Monads are simple, immaterial substances that reflect the universe from their own perspective. They are not physical and do not interact causally in the physical sense (pre-established harmony).
