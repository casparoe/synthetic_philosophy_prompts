      The rooftop air was cold, but Elias barely felt it. Above him, the sky wasn't just dark; it was deep. Endless. His physics textbook lay open on the gravel, the chapter on cosmological topology dog-eared and annotated to death.

      *If space is infinite,* he thought, *then matter is infinite. If matter is infinite, consciousness is infinite.*

      The logic coiled around his throat. If there are infinite beings suffering right now across the expanse, then the total sum of suffering is already infinity. If he donates his savings to charity, saves a life, cures a disease—he is adding a finite amount of good to an infinite total. Infinity plus one is still infinity. The ratio doesn't change. The net value of his kindness is zero.

      He felt hollowed out. Why bother? If the cosmic ledger cannot be balanced because it has no bottom, then moral effort is just theater. He looked at his hands. They were useless instruments.

      "Elias?"

