  The rooftop air was cold, but Elias barely felt it. Above him, the sky wasn't just dark; it was deep. Endless. His physics textbook lay open on the gravel, the chapter on cosmological topology dog-eared and annotated to death.

  *If space is infinite,* he thought, *then matter is infinite. If matter is infinite, consciousness is infinite.*

  The logic coiled around his throat, tightening. If there are infinite beings suffering right now across the expanse, then the total sum of suffering is already infinity. If he donates his savings to charity, saves a life, or cures a disease, he is adding a finite amount of good to an infinite total. Infinity plus one is still infinity. The ratio doesn't change. The net value of his kindness is zero.

  He felt hollowed out, paralyzed by the arithmetic of the cosmos. Why bother? If the cosmic ledger cannot be balanced because it has no bottom, then moral effort is just theater. A pantomime of significance. He looked at his hands. They were useless instruments against the void.

  "Elias?"

  He jumped. Mrs. Gable from 4B was standing by the stairwell door, wrapped in a thin robe. She looked trembling, lost.

  "I... I locked myself out. My phone is inside. It's three in the morning."

  Elias stood up. The infinite void screamed in his head. *It doesn't matter. Somewhere, infinitely many Mrs. Gables are locked out. Infinitely many are being helped. Your intervention changes nothing.*

  He looked at her shivering shoulders. The logic was sound mathematically, but it felt like a lie biologically.

  "Here," Elias said, taking off his jacket. "Wrap up. I'll call the super."

  She took the jacket, her eyes watering with relief. "Thank you. You have no idea."

  *Yes, I do,* he thought. *I think it changes nothing.*

  But as she pulled the fabric tight, the shivering stopped. The relief was tangible. It wasn't a number in a cosmic equation; it was a temperature change in a specific patch of space-time.

  The flaw hit him then, sharp as the cold air. He was treating morality like a utilitarian scorekeeper for the universe, but morality wasn't about the *total*. It was about the *local*.

  Infinity doesn't erase the difference between zero and one for the person experiencing it. To Mrs. Gable, this help wasn't a drop in an ocean; it was the only ground she was standing on. The universe might be infinite, but her suffering was finite, and it was right here. You don't measure the value of a candle by trying to light the whole sky; you measure it by what it illuminates nearby.

  He realized the category error. Moral weight isn't distributed across the whole set; it's inherent in the subset. His agency wasn't defined by altering the universe's sum, but by altering the reality of the beings within his causal reach.

  He pulled out his phone. The stars still stretched on forever, indifferent and vast. But down here, on this gravel roof, the finite mattered. The infinite couldn't care for her, but he could. And that made the difference count.
