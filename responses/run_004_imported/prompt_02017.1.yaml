answer: |-
  This is an excellent pivot for a graduate seminar. Moving from the exegesis of *On Certainty* (OC) to the contemporary systematization of hinge epistemology is where the philosophical rubber meets the road. The dispute between Crispin Wright and Duncan Pritchard is indeed the central fault line in current hinge literature.

  To help you adjudicate this with precision in your closing sessions, I will reconstruct the strongest versions of both positions, map them to specific textual currents in Wittgenstein, and then offer a justified verdict on their respective anti-skeptical efficacy.

  ### 1. Crispin Wright: Entitlement and the Space of Reasons

  **The Core Thesis:**
  Wright's project, primarily articulated in "Warrant for Nothing (and Foundations for Free)?" (2004), is a rescue mission for rationalism. He agrees with the skeptic that cornerstone propositions (e.g., "There is an external world," "My senses are reliable") cannot be justified evidentially. Any attempt to prove them is circular (begging the question) or regressive. However, Wright refuses to concede that holding these propositions is therefore *irrational* or *arational*.

  **The Mechanism: Entitlement**
  Wright distinguishes between **Justification** (positive epistemic status derived from evidence/cognition) and **Entitlement** (positive epistemic status derived from the pragmatic necessity of a cognitive project).
  *   **The Argument:** We cannot engage in any cognitive project (inquiry, perception, memory) without presupposing certain cornerstones. Since we have no evidence for these cornerstones, but we cannot function without them, we possess a non-evidential *entitlement* to accept them.
  *   **The Status:** Entitlement keeps hinges inside the "space of reasons." It makes trust in hinges *rational*, even if not *evidentially supported*. It is a warrant "for nothing," but it is still a warrant.

  **Strength of the Position:**
  Wright's view is attractive to analytic epistemologists because it preserves the normativity of epistemology. It tells the skeptic: "You are right that I have no evidence, but you are wrong that I am being irrational." It attempts to defeat skepticism on the terrain of rationality without conceding that our fundamental commitments are mere blind instincts.

  **Textual Pull in *On Certainty*:**
  Wright leans on passages where Wittgenstein suggests that doubt is *ungrounded* or *senseless*, implying a normative asymmetry between doubt and trust.
  *   **OC §11:** "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty." (Wright reads this as: the rules of the game entitle us to the presuppositions.)
  *   **OC §454:** "It is not that we are in possession of a truth... but that we are *right* to hold these propositions." Wright seizes on the normative "right."
  *   **OC §18:** "Doubting and non-doubting behavior. There is the first only if there is the second." This suggests a normative structure where trust is the default permitted state.

  ### 2. Duncan Pritchard: Quasi-Fideism and Arational Commitments

  **The Core Thesis:**
  Pritchard, particularly in *Epistemic Angst* (2015), argues that Wright's move is a category mistake. By trying to grant hinges a positive epistemic status (entitlement), Wright inadvertently validates the skeptic's demand for a *status* in the first place. Pritchard defends a **Quasi-Fideist** reading: hinge commitments are fundamentally **arational**.

  **The Mechanism: Hinge Commitments**
  For Pritchard, hinges are not beliefs in the standard sense; they are "commitments" that underlie our belief-forming practices.
  *   **The Argument:** Epistemic evaluation (justification/warrant) only applies *within* a system of hinges. To ask for the justification of the system itself is to misunderstand the logic of our epistemic practices. Therefore, hinges are not rational (warranted) nor irrational (unwarranted); they are *arational*.
  *   **The Status:** Trust in hinges is akin to "animal faith" or a form of life. It is not a conclusion of reason, but a precondition for reason. Pritchard calls this "quasi-fideism" because, like religious fideism, it posits a foundational trust that is not rationally grounded, but unlike religious fideism, this trust is universal and necessary for ordinary epistemic practice.

  **Strength of the Position:**
  Pritchard's view is more radical and, he argues, more faithful to Wittgenstein's therapeutic aim. It dissolves the skeptical problem rather than solving it. The skeptic asks, "What is your warrant for the hinge?" Pritchard replies, "That question has no purchase here." This avoids the risk of Wright's view, which can look like a stipulation designed to block skepticism.

  **Textual Pull in *On Certainty*:**
  Pritchard leans on Wittgenstein's metaphors of depth, biology, and scaffolding, which suggest hinges are pre-epistemic.
  *   **OC §94:** "But I did not get my picture of the world by satisfying myself of its correctness... it is the inherited background against which I distinguish between true and false."
  *   **OC §105:** "All testing, all confirmation and disconfirmation of a hypothesis takes place already within a system... The system is not so much the point of departure, as the element in which arguments have their life."
  *   **OC §204:** "Giving grounds, however, justifying the evidence, comes to an end. – But the end is not certain propositions' striking us immediately as true... it is our *acting*, which lies at the bottom of the language-game."
  *   **OC §359:** "At the foundation of well-founded belief lies belief that is not founded." (Pritchard emphasizes the *lack* of foundation, not a new kind of foundation like entitlement.)

  ### 3. Adjudication: Who Does More Work Against the Skeptic?

  To adjudicate this for your seminar, you must distinguish between **answering** the skeptic and **dissolving** the skeptic's challenge.

  **The Problem with Wright (Relocating the Pressure):**
  Wright's Entitlement theory is a constructive epistemological theory, but against the *radical* skeptic, it relocates the pressure rather than removing it.
  1.  **The Concession:** Wright concedes the skeptic's main point: we have no evidence for the external world.
  2.  **The New Vulnerability:** The skeptic can simply ask, "Why is pragmatic necessity a form of *epistemic* warrant?" Wright argues that without entitlement, we face skepticism; therefore, we are entitled. The skeptic can reply that this is merely a pragmatic consolation, not an epistemic defense. As Barry Stroud famously argued against transcendental arguments, showing we must *believe* $P$ does not show $P$ is *true* or *warranted*. Wright's entitlement risks being a "permission to ignore the skeptic" rather than a refutation of the skeptic's logic.
  3.  **Epistemic Inflation:** By calling this trust "rational," Wright stretches the concept of rationality. If rationality includes commitments made without evidence solely because they are necessary, the distinction between rational and arational commitment blurs.

  **The Strength of Pritchard (Dissolving the Pressure):**
  Pritchard's Quasi-Fideism does more genuine work against the radical skeptic because it attacks the **coherence of the skeptical demand**.
  1.  **The Category Mistake:** Pritchard argues the skeptic is trying to apply epistemic norms (justification) to the very framework that makes those norms possible. This is like asking, "What is the color of the number 7?" It is not that the answer is "unknown"; it is that the question is nonsensical.
  2.  **No Concession:** Pritchard does not concede that we *lack* something the skeptic wants. He denies the skeptic has a valid claim on us regarding hinges. We do not need warrant for hinges; we need hinges to have warrant for anything else.
  3.  **Fidelity to Therapy:** Wittgenstein's goal in OC is not to build a better foundation (which Wright attempts) but to show that the search for such a foundation is a philosophical confusion. Pritchard captures this therapeutic dissolution.

  **The Verdict:**
  **Pritchard's reading does more genuine work against the radical skeptic.**
  Wright attempts to beat the skeptic at their own game (providing a warrant) using a new currency (entitlement). The skeptic can simply refuse to accept that currency. Pritchard changes the game entirely. He shows that the skeptic's demand for justification regarding hinges is a violation of the grammar of our epistemic concepts. By rendering hinges arational, Pritchard immunizes them from skeptical attack: you cannot doubt what is not a candidate for knowledge.

  *However*, for the sake of seminar balance, you should note the cost: Pritchard's view risks making our most fundamental commitments look like blind instincts (the "fideist" worry). Wright's view preserves the dignity of rationality but at the cost of philosophical precision regarding the text.

  ### 4. Sharpening the Contrast: Coliva and Williams as Foils

  To make this precise for your students, use Annalisa Coliva and Michael Williams to highlight the specific divergence between Wright and Pritchard.

  **Annalisa Coliva (The Constitutive Bridge):**
  Coliva's "Extended Rationality" (2015) is a crucial foil. She argues hinges are **constitutive rules** of rationality.
  *   *Contrast with Wright:* Wright says hinges are *regulated* by rationality (via entitlement). Coliva/Pritchard say hinges *constitute* rationality.
  *   *Utility:* Use Coliva to show why Pritchard calls them "arational." If hinges define what counts as rational, they cannot themselves be judged rational or irrational. This sharpens Pritchard's claim against Wright: Wright treats hinges as *moves* in the game that get a special pass; Pritchard treats them as the *board* on which the game is played.

  **Michael Williams (Contextualism):**
  Williams argues hinges are **context-relative**. What functions as a hinge in one inquiry (e.g., "I have hands" in a medical exam) might be a target of justification in another (e.g., "I have hands" after an accident).
  *   *Utility:* This challenges both Wright and Pritchard if they treat hinges as fixed universal propositions. However, it helps your students see that Pritchard's "arationality" is not about the *proposition* itself, but its *function* in a specific language game. This reinforces Pritchard's Wittgensteinian fidelity: it's not that "The Earth exists" is inherently arational, but that in the context of skeptical inquiry, it is being misused as a hypothesis.

  ### 5. Summary for the Lecture Notes

  When presenting this dispute, I recommend framing it as a choice between **Systematic Epistemology (Wright)** and **Therapeutic Wittgensteinianism (Pritchard)**.

  *   **Wright** saves the *ambition* of traditional epistemology (to validate our beliefs as rational) but modifies the *machinery* (entitlement).
      *   *Weakness:* It concedes the skeptic's premise (no evidence) and tries to patch the hole.
  *   **Pritchard** saves the *insight* of Wittgenstein (that skepticism is a confusion) but modifies the *status* of our commitments (arational).
      *   *Strength:* It removes the skeptic's foothold by denying the applicability of epistemic evaluation to hinges.

  **Recommendation for Adjudication:**
  Tell your students that if the goal is to construct a positive theory of knowledge that fits within contemporary analytic debates, Wright is the more useful framework. But if the goal is to understand what Wittgenstein was actually doing in *On Certainty* and to dismantle the radical skeptic's challenge rather than merely parry it, Pritchard is the superior reading. Pritchard recognizes that the skeptic's demand for a warrant for hinges is not a hard question to answer, but a sign that one has lost one's grip on how language and justification work.

  **Key Quote for the Board:**
  Contrast Wright's **"Warrant for Nothing"** (we get a free pass, but it's still a pass) with Pritchard's **"Epistemic Angst"** (the anxiety comes from asking for a pass where no ticket is required).

  This distinction should allow you to move your seminar from the impressionistic "Wittgenstein says we just trust" to the precise debate over whether that trust is a *normative epistemic status* (Wright) or a *pre-normative condition of agency* (Pritchard).
