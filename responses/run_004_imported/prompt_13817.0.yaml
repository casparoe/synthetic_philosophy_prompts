      *   *Problem:* Even if we grant the basic/complex distinction, why does KP fail for the complex ones *specifically when they involve knowledge*? If KP is a claim about the nature of *truth*, and complex statements have truth values derived from basic ones, why doesn't the knowability of the basic components guarantee the knowability of the complex whole?
      *   *Problem:* The restriction blocks $K(p \land \neg Kp)$. But the paradox relies on the *possibility* of knowing the conjunction. If the anti-realist says "Truth = Idealized Knowability," then restricting KP looks like saying "Truth = Idealized Knowability, except for sentences mentioning knowability." This looks suspiciously like a type-theoretic hierarchy imposed solely to avoid contradiction.

