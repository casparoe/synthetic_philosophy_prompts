      *   *Claim:* This is independently motivated, not just a patch.

  3.  **Identify the Weak Point (The Gap):**
      *   The core of Fitch's paradox isn't just about *any* complex statement. It's about the interaction between truth, knowledge, and conjunction.
      *   The restriction needs to be: KP applies to $\phi$ *unless* $\phi$ contains $K$.
      *   Does the "parasitism of assertibility" naturally lead to "exclude epistemic operators from KP"?
