      *(Self-Correction during drafting)*: I need to be careful not to argue that KP should apply to *all* sentences (since that leads to paradox). I need to argue that the *reason* given for restricting it (parasitism) is insufficient. The restriction might be necessary, but the *motivation* provided is ad hoc.

      *Refining the "Parasitism" counter:* Parasitism says: To understand $A \land B$, you need to understand $A$ and $B$. It does *not* say: To possibly know $A \land B$, you need to possibly know $A$ and $B$ *without referencing knowledge*. In fact, knowing a conjunction often requires knowing that you know the conjuncts. The restriction forbids referencing knowledge in the *content* of what is known. This is a restriction on the *object* of knowledge, not derived from the *structure* of meaning.

