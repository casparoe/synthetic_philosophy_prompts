answer: |-
  Here is a rigorous argument supporting your position: that restricting the Knowability Principle (KP) to "basic" statements is an *ad hoc* rescue operation rather than a principled consequence of anti-realist semantics.

  The core of your professor's defense rests on an inference from a semantic thesis to a modal restriction. The semantic thesis is **Compositionality/Parasitism**: the assertibility conditions of complex statements are determined by the assertibility conditions of basic statements. The modal restriction is **Restricted KP**: the principle $\forall p (p \rightarrow \Diamond Kp)$ holds only for basic $p$.

  The argument that this restriction is *ad hoc* turns on the claim that **Compositionality does not entail Modal Restriction.** Even granting the anti-realist semantic architecture, there is no internal reason why the *possibility of knowledge* should vanish precisely when epistemic operators appear in the proposition, unless one stipulates this solely to avoid Fitch's contradiction.

  Here is the case broken down into three specific gaps between the motivation and the fix.

  ### 1. The Gap Between Verification Conditions and Modal Status

  The "parasitism" motivation concerns **meaning**: to grasp the meaning of a conjunction $A \land B$, one must grasp the verification conditions of $A$ and $B$. This is a thesis about semantic competence. Fitch's paradox, however, is a thesis about **modal metaphysics**: it concerns the extension of the predicate "is true" and its relationship to the modal operator "possibly known."

  Your professor's argument assumes that because the *meaning* of complex statements is parasitic on basic ones, the *knowability principle* governing them must be restricted to the base. This is a non-sequitur.

  Consider the logic of conjunction in standard anti-realist semantics. If $A$ is verifiable and $B$ is verifiable, then $A \land B$ is verifiable. The verification condition for the conjunction is *composed* of the verification conditions of the conjuncts. If KP is intended to capture the anti-realist intuition that "truth cannot outstrip the possibility of verification," then this intuition should apply to the output of the verification functions just as much as the inputs.

  If the anti-realist claims that truth is essentially epistemic, then the truth of a complex statement *just consists* in the possibility of verifying its components. To say "KP applies to basics but not complexes" is to say: "The epistemic nature of truth holds for atomic facts, but for molecular facts, truth might outstrip verification." This surrenders the core anti-realist motivation for complex statements.

  **The Ad Hoc Charge:** The restriction is not derived from the compositional nature of meaning. Compositionality tells us how to *construct* the truth conditions of $p \land \neg Kp$ from $p$ and $\neg Kp$. It does not tell us that the *modal status* (knowability) of that construction is fundamentally different from the modal status of its parts. To claim it is different requires an independent premise: "Epistemic operators break the transmission of knowability." That premise is not supplied by semantics; it is supplied solely by the need to block the Fitch derivation.

  ### 2. The Instability of the "Basic" Distinction under Anti-Realism

  The restriction relies on a distinction between statements containing epistemic vocabulary (like $K$) and those that do not ("basic" statements). This distinction is stable for a **realist**, who believes basic statements describe mind-independent states of affairs. For a realist, $p$ is non-epistemic because it refers to the world, while $Kp$ refers to our relation to the world.

  However, for a **global anti-realist** (like Dummett), this distinction collapses. Anti-realism asserts that *all* truth is epistemically constrained. Even "basic" statements (e.g., "It is raining") are not made true by mind-independent facts but by the availability of evidence. Therefore, the content of *every* statement is implicitly epistemic.

  If the anti-realist grants that "basic" statements are genuinely non-epistemic in content, they are implicitly conceding realism about the base level. They are saying: "Atomic facts are realist (mind-independent), but molecular facts are anti-realist." This is a hybrid view that lacks independent motivation.

  **The Ad Hoc Charge:** If anti-realism is a global theory of meaning, there is no principled place to draw the line between "epistemic" and "non-epistemic" vocabulary that isn't merely syntactic. Banning KP for sentences containing the symbol '$K$' is a syntactic fix, not a semantic one. It treats the symbol '$K$' as toxic to knowability, not because of what '$K$' *means* in the anti-realist framework (which should be transparently related to verification), but simply because allowing it generates a contradiction. This is the definition of *ad hoc*: modifying the rules of the system to avoid a specific derivation without a deeper theoretical justification for why that specific symbol triggers the failure.

  ### 3. The Precision of the Restriction vs. The Generality of the Motivation

  This is the strongest point of leverage. The "parasitism" motivation is **general**: it applies to *all* logically complex statements (negations, disjunctions, conditionals, quantifications). All of these are built out of basic statements.

  However, the restriction required to block Fitch is **specific**: it must target statements where knowledge operators occur in specific scopes (specifically, where $\neg K$ is conjoined with the truth of the proposition).

  If the parasitism of complex statements were the genuine reason for restricting KP, then KP should fail for *all* complex statements, or at least all statements involving logical operators. But anti-realists want KP to hold for standard mathematical or empirical conjunctions (e.g., "It is raining and the cat is on the mat"). They only want to deny KP for the specific "Fitch-conjunctions" ($p \land \neg Kp$).

  Why does the compositional structure of "and" allow knowability to transmit in $p \land q$, but block it in $p \land \neg Kp$? The semantic architecture (parasitism) is identical in both cases. Both are conjunctions built from simpler components. The only difference is the *content* of one conjunct.

  **The Ad Hoc Charge:** A principled semantic restriction would predict a broad failure of KP for complex sentences. A restriction that applies *only* to the specific sentences that generate the paradox, while allowing KP for all other complex sentences, is tailored to the problem rather than the theory. The "parasitism" story explains why complex sentences are meaningful; it does not explain why *only* epistemic complexes lack the modal property of knowability. To assert that distinction is to reverse-engineer the semantics to fit the logical constraint, rather than deriving the logical constraint from the semantics.

  ### Conclusion: The Hierarchical Patch

  The move your professor describes is effectively a **type-theoretic hierarchy** disguised as semantic theory. It says: "You cannot know a proposition that quantifies over the set of knowable propositions to which it belongs." This is a coherent logical move (similar to Tarski's hierarchy of truth predicates), but it is not motivated by the *parasitism of assertibility conditions*.

  Tarski restricted the Truth predicate to avoid the Liar Paradox. He did not claim this was motivated by the compositional nature of sentence meaning; he claimed it was motivated by the need for consistency. Similarly, restricting KP to avoid Fitch is a consistency fix.

  By claiming this restriction is "independently motivated by anti-realist semantics," your professor is conflating **consistency constraints** with **semantic explanations**. The parasitism of meaning explains how we understand $p \land \neg Kp$. It does not explain why $\Diamond K(p \land \neg Kp)$ is false. That claim is added solely because if it were true, the theory would explode.

  Therefore, the restriction is *ad hoc*. It saves the theory from Fitch's paradox, but it does so by introducing a distinction (basic vs. epistemic-complex) that the theory's own core commitments (global epistemic constraint on truth) render unstable, and it applies that distinction with a precision that matches the paradox rather than the semantics.
