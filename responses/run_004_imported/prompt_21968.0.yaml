          *   *Point 2: Scale.* 2 people vs. 8 billion. The causal link feels weaker.
          *   *Point 3: Heterogeneity.* Not everyone values the resource the same way. A starving fisherman vs. a wealthy nation.
          *   *Point 4: Iteration.* Real life is repeated games. Reputation matters (Tit-for-Tat), which is different from superrationality but leads to cooperation.
