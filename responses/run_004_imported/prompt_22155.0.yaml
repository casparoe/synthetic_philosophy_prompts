answer: |-
  "You keep saying sorry like it's a currency," the older brother said. "Like if you stack enough of them up, the debt clears."

  "It's not a debt. It's an acknowledgement."

  "It's the same thing. You think I chose to be the person who did those things? Really? Look at me. Look at the wiring. You think I sat down somewhere before I was born and picked the short straw?"

  "I think you chose to go back to them after you got out. Mum kept the door open. I offered you the job. You chose the old crew."

  "Because that's who I was. And who made me who I was? You? Mum? The teachers who wrote me off in year nine? I didn't make myself. To be responsible for what I do, I'd have to be responsible for the way I am. But I didn't choose the way I am. So how can I be responsible for what comes out of it?"

  "That's a circle. You're talking in a circle."

  "It's a regress. It's logic. If I do what I do because of how I am, then to be truly responsible for what I do, I must be responsible for how I am. But I can't be responsible for how I am without choosing it. And to choose it, I'd need a reason to choose it. A principle. Where did I get that principle? Did I choose that too? It goes back forever. Nobody is the ultimate cause of themselves. So nobody deserves hell. Nobody deserves anything."

  "You sound like you read that in a book."

  "I read a lot of books. You read none."

  "I read enough to know you're hiding. You're using 'nobody deserves hell' to say nobody deserves to be held accountable. But we aren't in a courtroom, and we aren't in church. We're in Mum's kitchen. And when you stole from her, I felt something. I felt resentment. That isn't a theory. It's a reaction. It's how I know you're my brother and not a stray dog or a broken appliance."

  "That's the point. You're treating me like a thing to be managed. An object. If you really understood that I couldn't be otherwise, you'd stop being angry. You'd look at me like you look at someone with a tumour. You'd take the objective view."

  "I don't want the objective view. The objective view is what you take when you've given up on someone. It's cold. You want me to look at you objectively? That's the real insult. That's saying you're not part of the human community. Blame isn't about metaphysics. It's about relationship. It's demanding goodwill. When you violate that, I resent it. That's the price of admission."

  "So I suffer for your peace of mind? Because you need to feel righteous?"

  "Because I need to feel like you matter. If you're just a product of causes, then nothing you say now matters either. Why are we arguing? Why not just drug me and put me in a home?"

  "Because you haven't earned the right to step back. You haven't earned the objective attitude. You're just using it as a shield."

  "Maybe. But the shield is true. Imagine God. Perfect justice. He sends someone to hell. But that person couldn't have been any different than they were. They couldn't have chosen otherwise because they didn't choose themselves. Is that justice? It's sadism. So if it's sadism for God, it's sadism for you."

  "God isn't sitting at this table. I am. And I'm not asking for ultimate self-creation. I'm asking for you to stay."

  "You want me to stay so you can keep blaming me."

  "I want you to stay so I don't have to treat you like a case study."

  The older brother laughed, a dry, cracked sound. "You know who wrote the stuff I'm talking about? Galen Strawson."

  "Philosopher."

  "yeah. And you know who wrote the stuff you're talking about? P.F. Strawson. Freedom and Resentment. Reactive attitudes. All of it."

  The younger brother paused. He looked down at the condensation on his beer bottle, then back up.

  "Wait. Strawson and Strawson?"

  "Father and son. P.F. wrote his bit in the sixties. Said we don't need metaphysical freedom to justify blame. Just need the human practice. Galen wrote his in the nineties. Said the whole practice is bogus because ultimate responsibility is impossible."

  "Jesus."

  "Exactly. The son spent his career proving the father was wrong. Or maybe just proving the father was optimistic."

  "So you're the son."

  "I'm the one who went to prison."

  "And I'm the one who stayed here cleaning up the mess. So maybe I'm the father. Trying to keep the house running while you tear down the foundations."

  "He won, though. Galen. Logically."

  "Dad lived longer. And people still blame each other. They still love each other. They don't stop because of a regress argument."

  "They should."

  "They don't. And neither do I. You can say you didn't make yourself. You can say the universe made you. But when you walk out that door, I'm going to feel what I feel. And if you think that makes me a sadist, then you're the one treating me like an object. Like I'm just a machine producing resentment."

  The older brother picked up his glass. He didn't drink. He just held it.

  "It's ironic," the younger brother said. "Family business."

  "It's genetics."

  "See? You can't help it."

  "Neither can you."

  "Maybe. But I'm still angry. And you're still here."

  "For now."

  "That's all I've got. That's all anyone's ever got."
