          *   *Smart Contracts/Zero-Knowledge Proofs:* In a near-future thriller, ZK-proofs might be more "tech thriller" friendly than Löb's theorem. ZK-proofs allow you to prove you satisfy a condition without revealing the code.
          *   *Is Löb dated?* It's niche academic stuff (2013-2015 peak). It's not "wrong," but it's very specific to the MIRI rationalist community. For a general audience, it sounds sufficiently arcane. However, the "fixed amount of effort" (timeout) actually breaks the Löbian logic in strict theory (because the proof might be longer than the timeout). But for fiction, it's an acceptable handwave.
