          *   Break up the monologue.
          *   Avoid naming names (Tennenholtz, Löb) unless necessary. It feels like name-dropping. Focus on the *mechanism*.
          *   The "coffee lukewarm" detail is good. Keep the physical grounding.

  5.  **Refining the "Warier Cousin" point:**
      *   User wrote: "not to get taken for a sucker by something that cooperates with literally everyone."
      *   Reality: If the other guy cooperates with everyone, and you defect, you get the *highest* payoff (Temptation). You are not the sucker; they are.
      *   Why does `PrudentBot` defect against `CooperateBot`? Because it can prove `CooperateBot` will cooperate regardless. So it defects to gain points.
