answer: |-
  This is an excellent test case for a Lewisian seminar because it highlights the tension between *descriptive* accounts of how norms stabilize and *normative* accounts of whether we ought to follow them. David Lewis's *Convention: A Philosophical Study* (1969) is primarily an account of how arbitrary regularities become self-perpetuating through coordination, not necessarily a moral theory of obligation.

  Here is an analysis of the exchange move by move, evaluating the strength of each position, followed by the crucial Lewisian elements both friends are overlooking.

  ### Move-by-Move Analysis

  **Move 1: The Skeptic's Opening (Friend A)**
  *   **Argument:** Tipping at kiosks is "manufactured." There is no service/effort to reward. Therefore, declining is not a moral failing.
  *   **Assessment:** **Friend A has the better of this move.**
  *   **Reasoning:** A is appealing to the *functional origin* of the practice. In normative ethics, the justification for a reward usually tracks the effort or benefit provided. By pointing out the disconnect between the action (tapping a screen) and the traditional justification (rewarding service), A undermines the intrinsic moral weight of the act. From a Lewisian perspective, A is also correctly identifying that this might not be a "coordination problem" (see below), but rather an imposition.

  **Move 2: The Conventionalist's Reply (Friend B)**
  *   **Argument:** Once enough people comply, expectations shift. Workers/employers plan around this income. Declining now imposes a cost. Therefore, one ought to comply.
  *   **Assessment:** **Friend B has the better of this move.**
  *   **Reasoning:** B shifts the ground from *origin* to *consequence*. This is a strong reliance-based argument (similar to Humean convention or rule-utilitarianism). If the wage structure adjusts to assume tips, withholding them harms a vulnerable party who has come to rely on the regularity. B correctly identifies that the moral landscape changes once a practice becomes embedded in the economic ecosystem, regardless of its arbitrary start.

  **Move 3: The Skeptic's Rebuttal (Friend A)**
  *   **Argument:** This "proves too much." If compliance alone creates obligation, then any successfully manufactured expectation (manipulation) becomes binding.
  *   **Assessment:** **Friend A wins the exchange here.**
  *   **Reasoning:** This is the strongest philosophical move in the dialogue. A identifies a flaw in B's principle: it lacks a filter for *legitimacy*. If B's logic holds, a protection racket creates an obligation to pay (because the mob "plans around" the income), or a scam creates an obligation to contribute (because the scammer "depends" on it). B's argument risks conflating *stability* with *normativity*. Just because a pattern is established doesn't mean it generates a moral "ought."

  **Move 4: The Conventionalist's Concession (Friend B)**
  *   **Argument:** Admits there must be a difference between norms that "serve everyone" and those "imposed top-down," but cannot define the line.
  *   **Assessment:** **Stalemate (leaning toward A).**
  *   **Reasoning:** B is intellectually honest but theoretically unarmed. By admitting she cannot distinguish between a legitimate social norm and corporate manipulation, she concedes that her account is incomplete. A has successfully shown that B's criterion (dependency/reliance) is necessary but not sufficient for obligation.

  ---

  ### What Both Friends Are Missing

  While Friend A wins the logical exchange, neither friend is actually applying David Lewis's account of convention correctly. They are arguing about *moral obligation*, whereas Lewis is providing a theory of *rational coordination*. Here are the three critical gaps in their reasoning relative to your seminar material:

  **1. The Absence of a Coordination Problem**
  Lewis defines a convention as a solution to a recurrent **coordination problem**. A coordination problem exists when agents have a preference to match each other's actions (e.g., driving on the left vs. the right; meeting at 5 PM vs. 6 PM).
  *   **The Gap:** Tipping at a self-checkout is *not* a Lewisian coordination problem. My tipping does not help you tip to avoid a collision or a failed meeting. I do not tip *because* you tip to ensure we match; I tip (or don't) based on pressure or altruism.
  *   **Lewisian Verdict:** Because there is no coordination equilibrium to maintain, Lewis's theory suggests this isn't a "convention" at all. It is merely a **social norm** (enforced by judgment/guilt) or a **quasi-contractual expectation**. Lewis's account explains why we drive on the right; it does not necessarily explain why we tip, especially when the "coordination" benefit is absent.

  **2. Common Knowledge and Contested Expectations**
  For Lewis, a convention requires **common knowledge**: everyone conforms, everyone expects everyone to conform, and everyone knows that everyone knows this.
  *   **The Gap:** The very existence of this argument proves the convention is not fully established. If it were a true Lewisian convention, the expectation would be settled background knowledge (like which side of the sidewalk to walk on). The fact that customers are debating it, feeling awkward, or seeing it as "manufactured" indicates the *common knowledge* condition is not met.
  *   **Lewisian Verdict:** Lewis would likely say the convention is currently *unstable*. Until the expectation is transparent and uncontested (common knowledge), the rational pressure to conform is significantly weaker. Friend B treats the norm as more solidified than it actually is.

  **3. The Distinction Between "Rational Reason" and "Moral Ought"**
  Lewis argues that once a convention is in place, you have a *rational reason* to follow it (conditional preference: "I prefer to tip if you tip"). He is less concerned with whether it is *morally good*.
  *   **The Gap:** Both friends are arguing about **moral failing** and **obligation** ("ought," "moral failing"). Lewis provides an account of *stability*, not *legitimacy*. A convention can be Lewisian (stable, arbitrary, self-perpetuating) and still be morally odious (e.g., a convention of segregation).
  *   **Lewisian Verdict:** Friend B is trying to derive a moral "ought" from a behavioral "is." Lewis explains the "is." Friend A is right to resist the move from "this is expected" to "this is morally required." To bridge that gap, they need a moral theory (like fairness or harm), not just a theory of convention.

  ### Summary for the Seminar
  If you bring this up in class, the strongest Lewisian point is that **tipping at kiosks fails the coordination test.** It is a norm imposed by a principal (the company) upon agents (customers) for the benefit of a third party (workers), without the mutual matching preference that defines a Lewisian convention.

  Friend A is right that the origin matters (it's not a spontaneous equilibrium), and Friend B is right that reliance creates stakes. But both miss that without a coordination problem, Lewis's machinery doesn't turn. This isn't a convention; it's a **power dynamic masquerading as a norm.**
