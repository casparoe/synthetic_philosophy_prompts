  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Software engineer, no formal philosophy training, but well-read on AI consciousness debates.
      *   **Context:** Encountered Chalmers' Philosophical Zombie argument, found it unsettling. Discussed with a philosopher friend who pointed to Kripke's *Naming and Necessity* (specifically the pain/C-fiber argument) as the precursor.
