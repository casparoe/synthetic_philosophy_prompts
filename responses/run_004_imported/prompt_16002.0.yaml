  # SEMINAR HANDOUT: REASONS FOR ACTION
  ## Topic: The Internalist Recuperation of McDowell's Externalism
  **Course:** Advanced Metaethics | **Week:** 7

  ### 1. The Stalemate
  The standard reading of the Williams/McDowell debate posits a deadlock:
  *   **Williams (Internalism):** A reason $\phi$ exists for agent $A$ only if $A$ can reach $\phi$ via a sound deliberative route from their Subjective Motivational Set ($S$). Deliberation cannot create motivation *ex nihilo*.
  *   **McDowell (Externalism):** Williams presupposes a Humean psychology (belief + independent desire). On an Aristotelian view, the virtuous agent perceives a situation as demanding action. This perception *is* motivational. The reason is grounded in the objective features of the situation, not the prior contents of $S$.

  **The Goal:** Move beyond the "Humean vs. Aristotelian psychology" meta-debate. We will argue that even if McDowell is right about the *phenomenology* of virtue, he fails to secure *external reasons* in Williams's sense. McDowell's "sensitivity" simply becomes a new, complex element of $S$.

  ---

  ### 2. The Argument: The Psychological Constitution Objection
  *The following argument attempts to show that McDowell's appeal to moral perception does not escape Williams's Internalism requirement.*

  **P1 (Williams's Constraint):** For a consideration $C$ to be a reason for agent $A$ to $\phi$, $C$ must be capable of motivating $A$ to $\phi$ (perhaps after deliberation).
  **P2 (The McDowellian Claim):** The virtuous agent $A$ is motivated by $C$ because $A$ perceives $C$ as a reason. This perception is not derived from a prior desire in $S$; it is a direct responsiveness to the normative landscape.
  **P3 (The Psychological Fact):** The capacity to have this perception (virtue/moral sensitivity) is a contingent psychological property of $A$. Let us label this capacity $K$.
  **P4 (The Counterfactual):** If $A$ lacked $K$, $A$ would not perceive $C$ as a reason, and $C$ would not motivate $A$.
  **P5 (The Internalist Entailment):** If the motivational force of $C$ for $A$ is contingent upon $A$ possessing psychological property $K$, then $C$'s status as a reason-for-$A$ is internal to $A$'s psychological constitution.
  **C:** Therefore, $K$ functions as an element of $S$. McDowell has not established external reasons; he has merely expanded the definition of $S$ to include refined perceptual capacities.

  ---

  ### 3. Running the Objection (Detailed Analysis)

  #### A. The "S-Expansion" Move
  Williams defines $S$ broadly: it includes not just crude desires, but "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent."

  McDowell argues that the virtuous person sees a reason where the non-virtuous person sees nothing. He claims this breaks Internalism because the reason isn't *derived* from $S$; it *modifies* $S$.

  **The Rebuttal:** This distinction is explanatory, not structural.
  1.  Before acquiring virtue ($K$), the agent has $S_1$. $C$ does not motivate.
  2.  After acquiring virtue ($K$), the agent has $S_2$ (where $S_2 = S_1 + K$). $C$ now motivates.
  3.  Williams asks: "What makes $C$ a reason for $A$ *now*?"
  4.  Answer: The presence of $K$.
  5.  Since $K$ is a psychological state/disposition of the agent, $K$ is an element of $S_2$.
  6.  Therefore, the route from $S_2$ to action via $C$ is an internal route.

  McDowell tries to hide $K$ behind the language of "perception" or "rational requirement." But for Williams, the *source of the grip* is what matters. If the grip depends on the agent's psychology, it is internal.

  #### B. The "Rational Requirement" Defense (and its Failure)
  **McDowell's Likely Reply:** $K$ is not just a desire; it is a rational sensitivity. To say $K$ is in $S$ suggests it is a brute psychological fact. But $K$ is the agent being *correctly* attuned to objective reasons. The reason exists independently; $K$ is just the removal of blindness.

  **The Counter-Rebuttal:**
  This conflates the **ontological status of the reason** with the **explanatory status of the motivation**.
  *   Williams grants that there may be objective truths (External Reasons statements might be *true*).
  *   Williams denies they are reasons *for an agent* unless they link to motivation.
  *   Even if $K$ is a "rational openness," it is still a feature of the agent's mind.
  *   If the agent lacks $K$, the "objective reason" exerts no normative pull.
  *   Therefore, the *normative pull for the agent* is mediated by $K$.
  *   If the pull is mediated by a psychological feature of the agent, Williams's Internalism holds: the reason is internal to the agent's motivational constitution.

  McDowell wants to say the reason *creates* the motivation. Williams says the constitution *allows* the reason to motivate. In terms of action explanation, Williams wins: you cannot explain why $A$ $\phi$-ed without referencing $A$'s possession of $K$.

  #### C. The Deliberative Route Revisited
  Williams insists on a "sound deliberative route." McDowell says perception bypasses deliberation.

  **The Argument:**
  1.  Acquiring $K$ (becoming virtuous) is itself a process.
  2.  If this process is rational (education, habituation, reflection), it is a deliberative route from a prior $S$ (perhaps containing a vague desire to be good, or trust in a teacher).
  3.  If this process is *not* rational (causal conditioning, brainwashing), then $K$ is merely a causal cause, not a rational justification.
  4.  If (2), then the new reason is linked to the old $S$ via the deliberative route of character formation. Internalism holds.
  5.  If (3), then $K$ is an external causal force, but not a *reason* in the normative sense. Externalism holds, but at the cost of rationality.
  6.  McDowell wants (2) but denies the Internalist conclusion. This is unstable. If character formation is rational, it links back to prior motivations.

  ---

  ### 4. Discussion Questions for Seminar

  1.  **The Definition of S:** Is Williams's $S$ so capacious that it renders Internalism tautological? If *any* psychological capacity that enables motivation counts as part of $S$, can Externalism ever get off the ground?
  2.  **The Nature of K:** McDowell insists moral perception is cognitive, not conative. Does the "Psychological Constitution Objection" illicitly treat all psychological states as conative (desire-like)? Does it matter if $K$ is a belief-like state if it still performs the motivational heavy lifting?
  3.  **The "Blindness" Analogy:** McDowell compares the non-virtuous agent to a color-blind person. The colors (reasons) are there; the person just can't see them. Does this analogy save Externalism?
      *   *Prompt:* If I give you glasses (virtue) and now you see the color, was the color a reason for you *before* you had the glasses? Williams says no. McDowell says yes. Who is capturing the normative concept of "reason for"?
  4.  **Recuperation:** If this argument holds, has Williams won the battle but lost the war? (i.e., Internalism is technically true, but $S$ is now so rich/Aristotelian that it looks nothing like the Humean psychology Williams was accused of presupposing).

  ---

  ### 5. Suggested Reading for Next Week
  *   **Gideon Rosen:** "The Case for Overdetermination" (On the causal efficacy of reasons).
  *   **Ruth Chang:** "Voluntarist Reasons and the Sources of Normativity" (A different angle on creating reasons).
  *   **Williams, B.:** "Internal Reasons and the Obscurity of Blame" (To see Williams's later softening on the $S$ set).
