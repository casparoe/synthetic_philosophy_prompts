      *   This makes her a "strong Hegelian." The questions need to challenge the *coherence* and *moral cost* of this position, not just ask her to explain it.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: The Sea/Wind Analogy (§324 Addition).*
          *   Hegel says stagnant water corrupts, wind keeps it fresh. War is the wind.
          *   *Challenge:* Is this a metaphor or an argument? If it's just a metaphor, does the argument collapse without it?
          *   *Draft Q:* Let's start with the famous addition about the sea. Is this doing heavy lifting?
          *   *Refinement:* Make it sharper. Ask if it's rhetorical dressing.
          *   *Follow-up:* If she says "it's illustrative," press on whether the *concept* of ethical health holds without the biological metaphor.

      *   *Topic 2: Kant and Perpetual Peace.*
          *   Hegel thinks a League of States becomes either a superstate (contradiction) or useless.
          *   *Challenge:* Is this a false dilemma? Kant might allow for a federation that isn't a world government.
          *   *Draft Q:* How do you answer Kant? Isn't Hegel unfair to him?
          *   *Refinement:* Frame it around the "false dilemma." Does Hegel strawman Kant to make war necessary?
          *   *Follow-up:* If she says "Hegel understands sovereignty better," ask if that definition of sovereignty is itself outdated.

      *   *Topic 3: Actual War vs. Possibility.*
          *   International relations are a state of nature. But why does this need *actual* fighting? Why not just deterrence/preparedness?
          *   *Challenge:* Hegel insists on the *actuality* of sacrifice.
          *   *Draft Q:* Why do we need real war? Isn't the threat enough?
          *   *Refinement:* Focus on the "ethical moment." Can the ethical effect (unity, negation of finite goods) happen without people actually dying?
          *   *Follow-up:* If she says "risk isn't enough," ask why blood is the specific currency required.

      *   *Topic 4: Gendered Ethical Labor.*
          *   Men = State/War, Women = Family.
          *   *Challenge:* Is this incidental 19th-century baggage or structural to the argument?
          *   *Draft Q:* What about the women? Is the soldier/family split necessary?
          *   *Refinement:* Ask if the "ethical health" of the state *depends* on this exclusion. If women can soldier, does the theory break?
          *   *Follow-up:* If she says "historical context," press on whether the *logic* of sacrifice requires that specific exclusion.

      *   *Topic 5: World History/Slaughter-Bench.*
          *   World Spirit moves through history. War shifts power between peoples.
          *   *Challenge:* Teledology. Does success = right? (Might makes Right).
          *   *Draft Q:* What about the slaughter-bench? Does winning make you right?
          *   *Refinement:* Connect it to retroactive justification. If a state loses, was it ethically "rotten"?
          *   *Follow-up:* If she denies this, ask how we judge ethical health without looking at who won.

      *   *Topic 6: The "Prussian Militarist" Charge.*
          *   Need to address the elephant in the room.
          *   *Challenge:* Even if not a militarist, isn't the theory easily co-opted by them?
          *   *Draft Q:* People call him a militarist. Are they wrong?
          *   *Refinement:* Focus on *reception* and *danger*. Even if Hegel didn't mean it, does the logic invite fascism?

      *   *Topic 7: The "Ethical Moment" (Negativity).*
          *   War negates finite goods (property, life).
          *   *Challenge:* Is this too abstract? Real war destroys ethical life (Sittlichkeit) too.
          *   *Draft Q:* Doesn't war destroy ethics too?
          *   *Refinement:* How do you distinguish "ethical war" from "barbaric destruction"? Where is the line?

      *   *Topic 8: Contemporary Relevance.*
          *   Nuclear weapons/Total War.
          *   *Challenge:* Hegel's war is limited. Modern war is existential.
          *   *Draft Q:* Does this work with nukes?
          *   *Refinement:* If war is supposed to preserve the state, but modern war destroys it, is Hegel obsolete?

      *   *Topic 9: Individual vs. State.*
          *   The individual must sacrifice for the whole.
          *   *Challenge:* Liberal objection. Why does the state have this claim?
          *   *Draft Q:* Why should I die for the state?
          *   *Refinement:* Is the individual merely a means to the state's ethical health?

