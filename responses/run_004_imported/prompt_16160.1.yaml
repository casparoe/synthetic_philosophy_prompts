prompt: |-
  I'm in a seminar this term on Hegel's political philosophy, and we just spent like two weeks slogging through what my professor calls the "external sovereignty" material in the Philosophy of Right -- the war paragraphs, somewhere around §324 plus the addition right after it (my notes are a mess so don't hold me to the exact number). For my final project I have to make a fake podcast episode where I "interview" a guest, so I invented one: a political philosopher who just published a book rehabilitating Hegel's theory of war against the "he was basically a Prussian militarist" reading, and who actually defends the substantive claims -- that war has a genuine ethical moment, that its not just a contingent evil caused by the passions of rulers, and that permanent peace would corrupt states rather than perfect them.

  I don't want the questions to just let her restate the view in nicer words, I want them to press the way people do in the secondary lit (Avineri does this kind of pushing in his book, I think, though I could be misremembering). Can you draft me like eight or nine interview questions? I need at least one on the sea/wind-and-corruption analogy from the addition -- is that actually doing argumentative work or just dressing up an assumption -- one on how this is supposed to function as an answer to Kant's perpetual peace essay, and whether the dilemma she poses for a league of states (real superstate vs. fragile voluntary league) is even fair to Kant, one on why the "state of nature between states" bit has to cash out as periodic actual war instead of just the bare possibility of war, and one on the gendered division of ethical labor in the text -- sacrifice/soldiering as men's vocation, family as women's -- and whether that's incidental to the arguement or something it actually needs. Throw in one more on the world-history angle too, tying back to that "slaughter-bench" line from the lectures on world history: if war is partly how "world spirit" moves between peoples, is she stuck saying wars get retroactively justified by whatever they end up leading to. For as many of these as makes sense, add a quick follow-up keyed to whatever dodge she's most likely to reach for, like "that's just an illustration, not part of the argument."
