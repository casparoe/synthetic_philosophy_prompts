answer: |-
  This is one of the sharpest knives in the philosophy of science drawer. You are right to feel that the model-theoretic explanations often obscure the simple, devastating logic at the core of **Max Newman's 1928 objection**.

  Here is the gut-level version of why "just structure" is suspiciously cheap, why it threatens to turn science into a tautology, and whether the Ontic Structural Realists (OSR) actually get away with it.

  ### 1. The Setup: What ESR Claims
  To see the trick, we have to look at what **Epistemic Structural Realism (ESR)** is trying to do.
  *   **The Hope:** We can't know the *intrinsic nature* of electrons (are they little balls? fields? chunks of mind-stuff?). But we *can* know the mathematical relations they stand in (inverse square law, spin correlations, etc.).
  *   **The Claim:** Science gives us the true *structure* of the world, even if we don't know what the structure is "made of."

  ### 2. Newman's Punchline: Structure is Just Counting
  Newman looked at this and essentially said: **"If you strip away the nature of the objects and keep only the structure, you haven't said anything meaningful about the world."**

  Here is the "Dots and Lines" analogy:
  Imagine I tell you the structure of a specific network. I say, "There are 5 points, and every point is connected to every other point."
  *   **ESR says:** "I don't know what the points *are*, only that they have this 5-point connected structure."
  *   **Newman says:** "Okay, but look at *any* collection of 5 things in the universe. Five apples. Five clouds. Five thoughts."

  Newman's mathematical insight (based on Ramsey sentences) was this: **Given any set of objects, you can define *any* structure you want on them, provided you have enough objects.**

  If I have 5 apples, I can *define* a relation called "is gravitationally attracted to" between them. I can simply stipulate that Apple 1 is related to Apple 2, etc., until I have mathematically recreated the exact structure of your electron theory.

  **The "Cheapness":**
  If all you claim is "The world has structure $S$," and structure $S$ is just a pattern of relations, then your claim is true as long as the world has enough *things* to support that pattern.
  *   If your theory requires 10 nodes, and the world has at least 10 things in it, I can always draw the lines between those 10 things to match your theory.
  *   Therefore, saying "The world has this structure" reduces to saying **"The world has at least $N$ things in it."**

  That is the gut punch. Newman argued that ESR collapses from a profound claim about physics into a trivial claim about **cardinality** (how many things exist).

  ### 3. Why This Is a Disaster
  If Newman is right, Structural Realism loses its bite.
  1.  **It's not informative:** Science is supposed to tell us *how* the world is arranged, not just that the world contains enough items to be arranged. Saying "There are enough things to fit this equation" is almost always true and tells us nothing about light or gravity.
  2.  **It's not realist:** Realism wants to say our theories are *approximately true*. If the theory is satisfied by any random collection of objects (apples, clouds, demons) just by redefining the relations, then the theory isn't "tracking" reality. It's just a game of matching dots.
  3.  **It defeats Worrall's point:** Worrall wanted to save realism from pessimistic induction (the idea that past theories were wrong, so current ones probably are too). He said, "The structure stays!" But if the structure is trivial, then saving the structure saves nothing of value.

  ### 4. Do Ontic Structural Realists (OSR) Escape?
  This is where it gets spicy. **Ontic Structural Realists** (like Ladyman and Ross) take it a step further. They say: "There are no 'objects' underneath. There is *only* structure. The world isn't dots *with* lines; the world is just the lines."

  Do they escape Newman? **Not easily.**

  **The Inheritance Problem:**
  Newman's objection assumes there are "objects" (relata) that the relations hold between. If OSR says "There are no objects, only relations," they try to dodge the "counting the dots" argument.
  *   *However*, critics argue that relations logically require *something* to relate. If you say "Spin Up is related to Spin Down," what is spinning? If the answer is "nothing, just the structure," critics say you've lapsed into a kind of Pythagorean mysticism where math exists without a substrate.
  *   If OSR admits there *are* nodes (even if they are just "nodes of structure"), Newman's objection comes back: Can't I just map those nodes onto anything?

  **The OSR Counter-Move: Modality**
  The hardcore OSR folks try to escape by adding **modality** (necessity and possibility) to the structure.
  *   **Newman's structure** is extensional: It's just about what is actually there right now (Dot A is connected to Dot B).
  *   **OSR structure** is modal: It's about what *must* happen. "If you put a node here, it *must* interact this way."

  They argue that the structure of the world isn't just a static pattern of lines; it's a system of **constraints and causal powers**. You can't just take five apples and pretend they are electrons, because apples don't have the *causal powers* to sustain the mathematical relations of quantum mechanics.

  **The Verdict:**
  *   **Does OSR escape?** They claim yes, by insisting that structure is "robust" and carries causal necessity, not just mathematical mapping.
  *   **Is it convincing?** It's controversial. Critics say OSR is just hiding the "nature of the stuff" inside the definition of "structure." If your structure includes "causal powers," aren't you just smuggling the intrinsic nature back in through the side door?

  ### Summary
  *   **The Trick:** If you know the pattern but not the stuff, you can fit that pattern onto *any* stuff, as long as you have enough of it.
  *   **The Cost:** This makes the claim "Science knows the structure" trivial. It means science only tells us "There are enough things to draw this map," which is weak.
  *   **The OSR Fix:** They try to say structure isn't just a map, it's a set of rules/causal powers that the world *must* follow.
  *   **The Lingering Doubt:** Many philosophers suspect you can't have a "free-floating" structure. At some point, to make the structure non-trivial, you have to admit you know something about the "stuff" that holds it together.

  Newman's objection remains the "check engine" light on the dashboard of structural realism. You can keep driving, but you can't ignore it.
