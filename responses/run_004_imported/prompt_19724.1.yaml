answer: |-
  The lantern on the wardroom table swung with the slow, heavy roll of the *Astraea*. Outside, the black water slapped against the hull, a sound like wet canvas being slapped against stone. Tomorrow, the French line would be on the horizon. Tonight, the air was thick with the smell of tallow and old wood.

  Mr. Vane, the ship's logician—a position that existed only because the Admiral had a peculiar sense of humor—sat with a glass of wine he wasn't drinking. Opposite him, Reverend Hale was polishing his spectacles with a handkerchief that had seen better decades.

  "You look as though you're trying to calculate the odds of salvation, Mr. Vane," Hale said, slipping the spectacles back onto his nose.

  "Salvation is binary, Reverend. One is either in a state of grace or one is not. The odds are irrelevant once the die is cast. I was contemplating the battle."

  "And?"

  "And I am satisfied," Vane said. He tapped a finger on the table. "The proposition *'The Astraea will take the French flagship tomorrow'* is true. I know it as surely as I know the lantern is lit."

  Hale paused, the handkerchief hovering in his hand. "That is a bold confession for a man of logic. Usually, you are the first to lecture me on the difference between belief and proof."

  "Proof is for mathematics. Truth is for reality. The statement corresponds to the facts."

  "But the facts do not exist yet," Hale said softly. "Tomorrow has not happened. To say the statement is *true* now is to say the future is fixed. And if the future is fixed, Mr. Vane, then my prayers tonight are merely a performance. A script I am reading in a play that has already ended."

  Vane leaned forward, the lantern light catching the sharp angles of his face. "You confuse truth with necessity. This is the old Aristotelian error. Just because a statement is true, it does not mean the event is necessary."

  "Semantics," Hale dismissed, waving a hand. "If it is *true* tonight that we win, then in what possible world do we lose? If there is no world where we lose, the outcome is necessary. If it is necessary, our gunnery, our seamanship, your calculations—they are theater. We are wind-up toys."

  "Not so." Vane picked up a quill and laid it on the table. "Consider this quill. I could drop it. I could hold it. Right now, it is contingent. But suppose I *will* drop it in five seconds. Is the statement *'Vane will drop the quill'* true now?"

  "Yes."

  "Then is it necessary that I drop it?"

  "If the truth is already established, yes."

  Vane shook his head. "No. The truth of the proposition tracks the event; it does not cause it. Imagine time as a chart, Reverend. There are many coastlines drawn in pencil—possibilities. But there is one coastline drawn in ink. The *Thin Red Line* of actuality. We do not know which line is ink and which is pencil yet. But God knows. And logic demands that for every proposition, either it or its negation holds."

  Hale leaned back, the wood creaking under him. "You assume the chart exists in full. I say the ink is still wet. You speak of the Thin Red Line as if it is a discovery. I say it is an imposition. You are taking a future contingency and granting it the status of a past fact. That is not logic, Mr. Vane. That is fatalism in a wig."

  "It is not fatalism because the *mode* of the truth is contingent," Vane insisted, his voice rising slightly. "Ockham taught us this. The proposition is *contingently true*. It is true, but it could have been false. The truth value is present; the necessity is not."

  "How can it be true if there is nothing to make it true?" Hale pressed. "Truth requires a maker. For 'The cat is on the mat' to be true, the cat must be on the mat. For 'We shall win' to be true, the victory must exist. But it does not exist. It is a phantom. To call a phantom 'true' is to lie."

  "To call it 'neither true nor false' is to abandon the Law of Excluded Middle," Vane countered. "Either we will win or we will not. There is no third state. If you say it is indeterminate, you are saying reality itself is indeterminate. You are saying God does not know the outcome."

  "God knows all *possibilities*," Hale corrected. "He knows the branching tree. He knows that if you steer port, you live, and if you steer starboard, you die. He knows the branches. But until you take the tiller, there is no single branch for Him to know as *actual*. You are claiming there is a 'fact of the matter' about a future that is not yet made. That steals the weight from our choices tonight."

  Vane sat back, exhaling through his nose. "So you prefer a logic where 'We will win' is meaningless until we have won?"

  "I prefer a logic where 'We will win' is a promise, not a description," Hale said. "When I pray for victory, I am not describing a pre-existing state of affairs. I am attempting to *make* the proposition true. If you say it is already true, you make my prayer redundant. If you say it is already false, you make it futile. You leave no room for the *making*."

  "But the making happens in time," Vane said, tapping the table again. "The truth is outside of time. Look, Reverend. Suppose we lose. Tomorrow night, the statement *'The Astraea won today'* will be true. Correct?"

  "Correct."

  "And ten years from now, it will still be true."

  "Yes."

  "Then why does the truth value wait for ten years to attach itself? Why does it not attach itself now? The event is fixed in the causal chain. Our powder, our wind, our skill—they are all set in motion. The outcome is determined by the present state of the world, even if we cannot calculate it."

  "Determined is not the same as *true*," Hale said. "You are conflating causality with semantics. Yes, the wind and powder are real. But the *victory* is not. It is a concept that applies to a completed action. You are trying to judge a race while the runners are still in the blocks. You say the winner is already the winner. I say the winner is only the winner when they cross the line."

  Vane looked out the stern window. The sea was invisible, but he could feel the motion. "If I am wrong, and the future is open as you say... then logic cannot speak of it. Logic deals in what *is*. If the future *is not*, logic must be silent."

  "Logic should be humble," Hale said. "It should acknowledge that some things are not yet fit for truth values. To assign a value is to pretend to God's eye view. It is pride, Mr. Vane. You want the comfort of certainty. You want to know the ink is dry so you can sleep."

  Vane turned back, his expression unreadable. "And you want the ink to be wet so you can feel you hold the pen. But tell me this: If we win tomorrow, will you not say, 'It was God's will'?"

  Hale smiled, a thin, tired thing. "I will say it was God's grace. And I will thank Him that He did not force our hands."

  "And if I say, 'It was true all along,' will you call me a heretic?"

  "I will call you a man who loves the map more than the territory," Hale said. He stood up, his knees cracking. "The map says the land is there. But until we walk it, Mr. Vane, we do not know if it is swamp or solid ground. To say 'It is solid' now does not help us walk. It only makes us careless."

  Vane watched him move toward the door. "Carelessness is a variable I have accounted for."

  "Of course you have." Hale paused at the threshold. "But account for this: If you are right, and the statement is true... then you need not worry. But if you are wrong, and the future is open... then your worry is a prayer of its own. Either way, Mr. Vane, you are awake. And so am I."

  Hale slipped into the dark corridor. Vane sat alone with the swinging lantern. He looked at the quill on the table. He wondered if the statement *'Vane will pick up the quill'* was true.

  He reached out and touched it. It felt cold. He did not pick it up.

  "Contingently false," he whispered to the empty room.

  But he wasn't sure if he was describing the world, or just his own hesitation.
