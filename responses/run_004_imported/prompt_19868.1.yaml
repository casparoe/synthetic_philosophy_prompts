      *   **Specific Content:** Must discuss the Jarrett decomposition (Parameter Independence vs. Outcome Independence). Must address whether dropping outcome definiteness buys locality or just relocates weirdness (branching correlations). Must avoid "no signalling" as the sole defense (use spacetime state realism or common-cause stories).
