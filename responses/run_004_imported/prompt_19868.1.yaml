prompt: |-
  my philosophy of physics reading group is doing Bell/locality this week and I'm so tired of every treatment collapsing into "spooky action at a distance, the end." can you write me a dialogue that actually gets into the weeds of it?

  two characters: a Bohmian who's convinced the theorem plus the experiments settle it -- nature's nonlocal, full stop, no interpretation gets to dodge that -- and an Everettian who insists her view stays local at the fundamental level, because without a single definite outcome on each wing there's nothing for a nonlocal influence to even act on in the first place.

  I want them actually fighting over the Jarrett decomposition instead of just asserting stuff past each other -- have the Bohmian push her on whether she's denying parameter independence or outcome independence (or whether that distinction even survives once you drop definite outcomes), and why ditching outcome definiteness is supposed to buy you locality rather than just relocating the weirdness into how branching has to stay correlated across both wings. and have her come back with something better than "no signalling holds so we're fine" -- like spacetime state realism, or a common-cause/shared-past-lightcone story.

  neither of them should fold or strawman the other, they should each be responding to the others actual last move, not just restating their priors. 500-700 words is fine.
