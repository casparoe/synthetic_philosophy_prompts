      *   **Everettian (Many-Worlds):** Universal wavefunction evolves locally via Schrödinger equation. No collapse. "Outcomes" are relative to branches. Bell's theorem assumes single outcomes. If all outcomes happen, the correlation is established via the common past (entanglement creation) and local evolution. The appearance of nonlocality is an artifact of viewing a single branch. Needs to address how branches match up without superluminal coordination.

