      "Look, Mara, Jarrett laid it out cleanly," said Elias, tapping the whiteboard. "Bell Locality decomposes into Parameter Independence and Outcome Independence. Bohmian mechanics violates PI explicitly—the guiding equation depends on the remote setting. But standard QM violates OI. The probability of my outcome depends on yours. You can't wave that away."

      Mara shook her head. "You're assuming 'outcome' means a single definite event. In Everett, there's no unique outcome on either wing. There's just the local unitary evolution of the wavefunction. If there's no single outcome, Outcome Independence doesn't even get a grip. The condition is vacuously satisfied because the relata don't exist."

      "That's linguistic sleight of hand," Elias countered. "Empirically, I see a click. You see a click. We compare notes later and we're correlated. If your ontology says those clicks are just 'branches,' you still need a mechanism that ensures the 'up' branch here matches the 'down' branch there. If the splitting is local, what coordinates the branching structure across spacelike separation? That's nonlocality dressed in decoherence clothing."

      "It's not coordination, it's structure," Mara insisted. "Think spacetime state realism. The entangled state isn't two particles sending signals; it's a single field configuration established in the common past. When I measure here, I'm locally interacting with my part of that field. The 'correlation' isn't created at measurement; it's revealed by the local decomposition of the global state. The wavefunction doesn't need to reach across space to match branches because the branches are already defined by the global amplitude distribution."

      "But the measurement settings are chosen spacelike," Elias pressed. "I change my magnet angle *now*. That changes the basis in which your system decomposes. If the decomposition is global, and I change the global basis locally and instantaneously, you've got action at a distance. You're saying the *number* of worlds or their *labeling* depends on my setting."

      "No, the universal wavefunction evolves locally via the Hamiltonian," Mara said. "Your setting change propagates at light speed. Until our light cones intersect, we're in a superposition of correlated records. There's no fact of the matter about which branch I'm 'in' relative to you until we interact. The nonlocality you see is a artifact of demanding a single history. Once you accept the multiverse, the history is a local tree."

      "A tree that grows in perfect sync across the universe without communication," Elias said. "That's not locality, that's pre-established harmony on steroids. Bohm accepts the tension: the particle is local, the wave is nonlocal. You're claiming the wave is local, but it lives in configuration space, not spacetime. You haven't saved locality; you've just relocated the spooky action into the geometry of Hilbert space."

      "Configuration space is the fundamental arena," Mara replied. "Spacetime locality is emergent. If the fundamental dynamics are local in the high-dimensional space, that's what counts. Bell proved no local *hidden variable* theory works. We don't have hidden variables. We have the wave. It's local to itself."

      "And we're back to ontology," Elias sighed. "You pay for locality with reality. I pay for reality with locality. Neither of us gets a free lunch."

