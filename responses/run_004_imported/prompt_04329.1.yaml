      *   *The Assertability Point:* This isn't just semantics/pragatics fluff. It's the difference between "It is true that..." and "It is useful/appropriate to say that..."
      *   *Why it matters:* If meaning has no truth conditions, then meaning is not a "state of affairs." It's a role in a language game.
      *   *The Community:* The community doesn't constitute the meaning; it constitutes the *normativity*. Without the community, there's no distinction between "thinking I'm right" and "being right."
      *   *Burge Comparison:* Burge = Externalist Realist. Kripke's Wittgenstein = Anti-Realist about meaning facts.
