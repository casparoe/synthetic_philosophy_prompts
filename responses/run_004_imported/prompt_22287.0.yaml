prompt: |-
  I'm about a third of the way into a novel set in Cambridge in the late 1920s, and one of my secondary characters is loosely based on Frank Ramsey -- the mathematician/philosopher who died absurdly young and ran with the Wittgenstein-Keynes crowd. I've been reading Misak's biography of him for texture and keep getting stuck on this passage of his (from something called the "Epilogue" to his collected essays, I think) where he says he isn't humbled by the vastness of the heavens because the stars "cannot think or love," and that his picture of the world is "drawn in perspective" rather than to scale, with people in the foreground and the stars shrunk down to "threepenny bits." I want to give my character a scene near the end where he basically delivers this as his whole philosophy of life, but before I put it in his mouth I'd like to actually know if its a good argument, not just a good quote.

  Here's what trips me up: Ramsey doesn't just say "care about human-scale things, not size." He also says he doesn't really believe in astronomy except as a complicated description of human (and maybe animal) sensation -- which sounds like its smuggling in some kind of pragmatist or verificationist claim about what the universe even is, not just advice about where to point your attention. So is that move doing real philosophical work against the standard cosmic-insignificance worry, or is it just his pragmatism about truth wearing a consolation-prize costume?

  Could you write me an essay that treats this passage as actual philosophy rather than deathbed-adjacent inspirational-quote fodder? Lay out the strongest version of the "you're just changing the subject" objection -- that he's swapped "are we objectively significant" for "do I feel significant," which isn't the same question -- work out whether the pragmatist twist saves him from that charge or actually makes it worse, and weigh the whole package against Nagel's and Camus's answers to absurdity. I don't want a "both sides have a point" ending -- give me an actual verdict on whether Ramsey's response holds up, since I need to decide how much conviction to write into my character's voice.
