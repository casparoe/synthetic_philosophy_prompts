      *   *Core Conflict:* The Gibbs Lecture disjunction is the key. If Gödel believes the mind is *not* a finite machine, then a "sufficiently detailed computational emulation" is a category error. It simulates the *physics* of the brain, but not the *metaphysics* of the mind.
      *   *Platonism:* A computer manipulates symbols according to rules. A Platonist mind grasps truth directly. A simulation grasps nothing; it processes.
      *   *Conclusion:* He would reject it. It would look like a "philosophical zombie" to him—a perfect behavioral mimic without the inner light of rational intuition.

