      *   *Tension B (Platonism vs. Computation):* If the mind accesses the Platonic realm via non-algorithmic intuition, a computational emulation (which is by definition algorithmic/Turing-computable) cannot replicate that access.
      *   *Tension C (Identity vs. Simulation):* If the mind is not a machine (Conviction 3), then a machine simulation of the brain is *not* the mind. It might behave identically, but it lacks the essential quality (non-algorithmic insight).

