answer: |-
  Here are ten interview questions designed to probe the structural integrity of resolute choice, tailored for a decision theory podcast hosted by a software engineer. Each includes a follow-up calibrated to the standard philosophical defense of the position.

  ### 1. The Normative Anchor
  **Question:** In Parfit's Hitchhiker, the causal chain from your decision to pay in town to your survival in the desert is severed; the prediction has already occurred. Standard Causal Decision Theory calls paying irrational because it's a sunk cost. You argue resolute choice makes it rational. Is resoluteness a *normative justification* for paying—giving me a new reason to act—or is it merely a *redefinition* of the agent such that whatever the winning disposition outputs is tautologically labeled 'rational'?

  **Follow-up:** (She will likely argue it is a normative justification based on plan-rationality rather than act-rationality.)
  *If she argues that rationality applies to plans rather than momentary acts:* "If rationality is a property of the whole plan rather than the specific node being executed, does that imply an agent who successfully resolves to pay is rational even if they accidentally trip and drop the money before handing it over? Where does the 'resoluteness' actually reside—in the intention or the physical execution?"

  ### 2. The Stipulation Challenge
  **Question:** Following up on that: Critics often charge that resolute choice solves dynamic inconsistency by fiat. It looks like you are stipulating that the agent *can* bind their future self, and then defining rationality as 'following that binding.' How do you demonstrate that this binding is a genuine feature of agency rather than just a semantic move to ensure the agent gets the high payoff in the decision matrix?

  **Follow-up:** (She will likely argue that human agency naturally involves temporally extended projects.)
  *If she appeals to the phenomenology of long-term projects:* "We do experience long-term projects, but we also experience akrasia (weakness of will). If resolute choice is a natural feature of agency, why does it require such significant cognitive effort to maintain? Does your theory prescribe a *training regimen* for rationality, or does it assume a cognitive architecture that most humans simply don't possess?"

  ### 3. Probabilistic Prediction
  **Question:** Let's tweak the parameters. In the standard case, the driver's lie detection is infallible. But suppose the driver is a neural net that is 99% accurate. Once I am safely in town, I know the prediction is in the past. However, there is a 1% chance the driver mispredicted and is watching to see if I pay. Does resolute choice still mandate payment in this probabilistic version, and if so, is the justification still 'resoluteness' or just standard expected utility maximization based on that 1% chance?

  **Follow-up:** (She will likely argue resoluteness is required even if the causal link is zero, but might concede the 1% changes the math.)
  *If she maintains resoluteness is required even with 0% causal leverage:* "If you mandate payment even when the causal probability is zero, you are asking the agent to ignore the state of the world at the moment of decision. At what threshold of uncertainty does resoluteness become dogmatism? If I find out the driver is dead upon arrival, am I still rationally required to pay the corpse to maintain my 'resolute' status?"

  ### 4. Collapse into Sophistication
  **Question:** A sophisticated chooser anticipates their future preferences and works backward; they know they won't pay in town, so they know they won't get the ride. You argue the resolute chooser avoids this by forbidding reconsideration at the second node. But if I am permitted to *reconsider* at the moment of payment—even if I decide not to change my mind—doesn't resolute choice collapse into sophisticated choice? What mechanism physically or logically prevents the reconsideration process from occurring?

  **Follow-up:** (She will likely argue that reconsideration is permitted but the *reasons* for changing are ruled out.)
  *If she argues that reasons for deviation are ruled out rather than the act of reconsideration:* "In a software context, that looks like a function that ignores certain input arguments. If my decision function at $t_2$ ignores the input 'I am now safe,' aren't we just describing an agent with a hard-coded constraint? If so, is resolute choice a theory of *decision making* or a theory of *agent design*?"

  ### 5. Resolute Choice vs. Functional Decision Theory
  **Question:** Functional Decision Theory (FDT) suggests I should act as though I am selecting the output of my decision function, which the predictor simulates. This yields the same verdict as resolute choice in Hitchhiker: Pay. Is there *any* case where resolute choice and FDT diverge, or is resolute choice simply the philosophical redescription of running a logical decision function over a temporal sequence?

  **Follow-up:** (She will likely argue they are ontologically distinct: FDT is about logical correlation, Resolute Choice is about temporal binding.)
  *If she argues they are ontologically distinct:* "If they always yield the same action but differ on ontology, why should I prefer the resolute framework? As an engineer, if two algorithms produce the same output but one requires assuming 'logical causation' and the other requires assuming 'temporal binding,' is there a pragmatic reason to prefer one model over the other for building autonomous agents?"

  ### 6. The "New Information" Objection
  **Question:** One major critique of resolute choice is that it seems to forbid updating on new information. If I form a plan to pay, but upon arriving in town I learn the driver is actually a scammer who would have left me anyway, resolute choice seems to demand I stick to the plan. How does your version of resolute choice distinguish between 'rational binding' and 'irrational stubbornness' when new information arrives at $t_2$?

  **Follow-up:** (She will likely argue that resolute choice only applies when preferences remain stable.)
  *If she argues it only applies when preferences are stable:* "But in Hitchhiker, preferences *do* change. At $t_1$ I prefer paying to dying. At $t_2$ I prefer keeping money to paying. That is the definition of the problem. If resolute choice only works when preferences don't change, doesn't it fail to solve the exact dynamic inconsistency it was built to address?"

  ### 7. The Cost of Implementation
  **Question:** Let's talk about the cost of being resolute. Maintaining a resolution against your immediate self-interest requires cognitive energy or pre-commitment devices. If the cost of maintaining that resoluteness exceeds the $100 fare, is it still rational to be resolute? Does your theory account for the 'overhead cost' of the resolution mechanism itself?

  **Follow-up:** (She will likely argue that rationality is about the end, not the computational cost.)
  *If she argues computational cost is secondary to normative rationality:* "In engineering, overhead is a first-order constraint. If a rational agent is one that achieves their goals, and the 'resolute module' consumes too much RAM, the agent crashes. Are you describing an idealized rational agent that exists in a vacuum, or one that must operate under bounded rationality?"

  ### 8. The Source of Normative Force
  **Question:** Why should I care about being resolute? If CDT says 'don't pay' and I don't pay, I lose the ride, but I haven't violated any laws of logic. If I choose resolute choice and pay, I lose $100 for no causal gain. What is the 'bite' of the norm? Is the penalty for violating resolute choice just getting a lower payoff, or is there a sense in which I become *irrational* in a way that is distinct from just losing the game?

  **Follow-up:** (She will likely argue that violating resoluteness makes you an agent who cannot secure beneficial contracts.)
  *If she argues it's about being the kind of agent who can secure contracts:* "That sounds like a reputational argument. But in the one-shot Hitchhiker case, there is no reputation to protect. If the normative force comes from being 'the kind of agent' who pays, aren't we just smuggling Evidential Decision Theory back in under the guise of resolution?"

  ### 9. Pre-commitment vs. Resolution
  **Question:** As a software engineer, I solve this with a smart contract: the money is locked before the ride starts. That makes paying causal again (failure to pay means the contract punishes you). Is resolute choice just a psychological workaround for when smart contracts aren't available? If I *could* pre-commit causally, would you still argue for resolute choice, or does your theory only fill the gap where causal pre-commitment fails?

  **Follow-up:** (She will likely argue that psychological resolution is fundamental, even if external tools exist.)
  *If she argues psychological resolution is fundamental:* "If external pre-commitment is available, it dominates psychological resolution because it's more reliable. If your theory is only the 'second best' option for when pre-commitment fails, is it really a theory of rationality, or just a theory of coping with weak agency?"

  ### 10. The Generalizability Test
  **Question:** Finally, does resolute choice generalize to moral obligations? If I resolve to donate to charity, but at the moment of donation I'd rather keep the money, does resolute choice mandate I donate even if the charity's effectiveness is now in doubt? I'm asking if resolute choice risks turning agents into rigid rule-followers who ignore consequences at the point of execution.

  **Follow-up:** (She will likely argue it applies to prudence, not necessarily morality, or requires correct initial planning.)
  *If she argues it requires correct initial planning:* "But that pushes all the work to $t_1$. If the agent at $t_1$ makes a mistake in calculation, resolute choice locks them into that mistake at $t_2$. Doesn't this make the theory incredibly fragile? A rational theory should ideally allow for error correction, but resolute choice seems to penalize error correction as 'dynamic inconsistency.'"
