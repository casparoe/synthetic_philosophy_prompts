prompt: |-
  I run a small podcast on decision theory as a side project from my day job as a software engineer. Next week's guest is a philosopher who defends resolute choice as the correct response to Parfit's hitchhiker -- the view that an agent stranded in the desert can rationally form an unconditional intention to pay the driver on arrival, and must actually pay once safe in town, even though paying at that point does nothing further for the hitchhiker. Draft eight to ten interview questions that push past a restatement of the position: include one on whether resolute choice is a genuine argument for paying at that point or just a stipulation that whatever the winning disposition outputs counts as 'rational,' one on whether her position survives once the driver's lie-detection is merely very reliable rather than infallible, one on why resolute choice doesn't simply collapse into sophisticated choice once she's permitted to reconsider at the moment of payment, and one that pins down where, if anywhere, resolute choice actually disagrees with functional decision theory's verdict on the same case rather than just redescribing it -- and for each, a follow-up keyed to the answer she's most likely to give.
