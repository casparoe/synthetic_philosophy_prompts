prompt: |-
  My friend Nadia's getting married in a few weeks and asked me to give the toast, since I'm the novelist in the friend group and apparently that makes me contractually obligated. Here's the wrinkle: she and her fiance Cole are non-monogamous, and its not incidental -- they actually met in a Bertrand Russell reading group, and the whole shape of their relationship is built on Marriage and Morals, especially his bit about jealousy being learned rather than some fixed instinct. They want the toast to actually engage with that, not just wave vaguely at "open-mindedness," but Cole's parents and my own grandma will be sitting right there with no idea any of this is going on, expecting a normal toast about commitment. What's nagging at me on top of that is that Russell's own open marriage to Dora fell apart on more or less the exact point he thought he'd philosophically solved -- he admitted later just how much jealousy he actually felt in practice -- so I don't want to hold him up as the guy who cracked it, but I don't want to be a downer at somebody's wedding either. Can you draft a warm five-minute toast that's honest about all that, works for the friends who'll clock it if I'm faking the Russell, and still lands fine for grandma?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for Nadia and Cole.
      *   **Speaker:** A novelist friend (implies good with words, storytelling).
      *   **Key Constraint 1 (The Couple's Values):** They are non-monogamous, met in a Bertrand Russell reading group, relationship built on *Marriage and Morals* (jealousy is learned, not instinct). They want this acknowledged, not glossed over as vague "open-mindedness."
      *   **Key Constraint 2 (The Audience):** Cole's parents and the speaker's grandma are present and *do not know* about the non-monogamy/philosophical basis. They expect a "normal" toast about commitment.
      *   **Key Constraint 3 (The Intellectual Honesty):** Russell's own open marriage failed due to jealousy. The speaker doesn't want to pretend Russell "solved" it, but also doesn't want to be a downer.
      *   **Tone:** Warm, honest, 5 minutes long, dual-layered (works for both the informed friends and the unsuspecting family).

  2.  **Deconstruct the Challenge:**
      *   *The "Dual-Layer" Problem:* How to talk about non-monogamy and Russell without triggering the conservative elders?
          *   *Solution:* Use language that is philosophically precise but emotionally universal. Focus on *honesty*, *communication*, and *redefining commitment* rather than specific relationship structures. "Jealousy is learned" can be framed as "choosing trust over fear."
      *   *The "Russell" Problem:* How to honor the inspiration without ignoring the historical failure?
          *   *Solution:* Acknowledge Russell's brilliance but emphasize that Nadia and Cole are writing their *own* story, not copying his. Frame their relationship as an evolution of the idea, not a replication.
      *   *The "Novelist" Angle:* Lean into the metaphor of storytelling. Marriage as a narrative they are co-authoring.
      *   *The "Downer" Risk:* Avoid predicting failure. Focus on the *courage* it takes to try something difficult, regardless of the specific structure.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the novelist persona. Warm welcome. Acknowledge the honor.
      *   **The Meeting Story (The Hook):** Mention the reading group. This is the safe entry point for the Russell stuff. Everyone loves a "met while studying" story.
      *   **The Philosophy (The Core):** Address *Marriage and Morals*.
          *   *For the Friends:* They'll hear "non-monogamy" and "jealousy is learned."
          *   *For the Family:* They'll hear "intellectual connection" and "working through difficult emotions."
          *   *Key Phrase:* "Commitment isn't about possession; it's about choice."
      *   **The Russell Caveat (The Honesty):** Acknowledge that ideas are easy, practice is hard. Russell struggled. Nadia and Cole know this. This shows maturity, not doom.
          *   *Reframing:* It's not about being perfect; it's about being honest.
      *   **The Commitment (The Emotional Landing):** What does this mean for their future? Radical honesty. Trust.
      *   **Closing:** A wish for their story. A toast.

  4.  **Refining the Language (The Tightrope Walk):**
      *   *Avoid:* "Non-monogamy," "Open marriage," "Other partners," "Sexual freedom."
      *   *Use:* "Unconventional," "Honesty," "Architecture of trust," "Choosing each other," "Defying expectation."
      *   *Russell Reference:* Keep it focused on the *idea* of jealousy, not the scandalous details of his personal life.
      *   *Grandma/Parents Safety:* Ensure every sentence about "freedom" is balanced with a sentence about "devotion."

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Too risky?* If I say "They read Russell on marriage," Grandma might google it later. But in the moment, it sounds academic.
      *   *Is the Russell failure too dark?* Need to make sure it sounds like "They learned from history" rather than "They are doomed to repeat it."
      *   *Is it warm enough?* Needs more emotion about *them* as people, not just ideas.

  6.  **Drafting - Iteration 2 (Polishing):**
      *   Add specific compliments to Nadia and Cole.
      *   Make the "jealousy is learned" point sound like emotional maturity (which Grandma loves) rather than relationship anarchy (which she fears).
      *   Ensure the "Novelist" voice comes through—metaphors about drafting, editing, plot twists.

  7.  **Final Review against Constraints:**
      *   5 minutes? (approx. 750-850 words spoken at a moderate pace).
      *   Honest about Russell? Yes, acknowledges the difficulty.
      *   Safe for Grandma? Yes, no explicit mentions of structure, focuses on emotional honesty.
      *   Satisfying for Friends? Yes, they will catch the specific references and the subtext.

  8.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't accidentally imply they are "fixing" jealousy like a bug, but rather managing it with wisdom.* *Ensure the toast ends on a high, celebratory note.*

  **(Self-Correction Note):** I need to be careful not to lie. I can't say "They promise to be faithful in the traditional sense" if that's not true. I must speak truth that is *interpreted* differently by different audiences. The truth is: They promise to be honest and committed to the agreement they made. That is universally true.

  9.  **Finalizing the Text.** (Proceeds to generate output based on these thoughts).

  *(Post-Drafting Review)*: Does this meet the "Novelist" persona? Yes, it uses literary metaphors. Does it handle the Russell paradox? Yes, by framing it as "courage to try" rather than "guarantee of success." Is it safe for Grandma? Yes, it sounds like a very thoughtful, traditional commitment to honesty, just with a philosophical flair.

