answer: |-
  Good evening, everyone. For those of you who don't know me, I'm an old friend of Meg's from our grad school days. We spent our youth chasing paper wasps around the field, notebook in hand, trying to understand why some insects spend their entire lives working for someone else's babies.

  For those of you who *do* know me: yes, I have been reading Okasha. No, I will not be citing him tonight.

  I want to start by admitting something. When Meg's students asked me to give this toast, I didn't just sit down and write it. I ran the numbers.

  As many of you know, Meg built her career on Inclusive Fitness Theory. She was a staunch defender of the idea that altruism evolves because it helps copies of your own genes survive in other bodies. Specifically, she lived by Hamilton's Rule. For the biologists in the room, you know the formula: $rB > C$. For everyone else, it's a simple cost-benefit analysis: You should only help someone if the Benefit to them, multiplied by how closely Related you are, outweighs the Cost to you.

  So, I calculated.
  **The Cost ($C$):** High. Writing a speech is hard. Public speaking is terrifying. There was a non-zero risk I would mention "worker policing" and kill the mood.
  **The Benefit ($B$):** Meg's happiness. The honor of the room.
  **The Relatedness ($r$):** This is the tricky variable. We aren't genetic kin. But in evolutionary biology, we talk about "academic kinship." Forty years of shared grants, shared data, and shared complaints about department chairs creates a bond that mimics high relatedness.

  When I plugged the variables in, the equation barely balanced. By strict Hamiltonian logic, I should have stayed seated.

  But then I looked at Meg's career, and I realized why the math felt wrong.

  Meg spent forty years arguing that selection acts primarily on individuals and genes, not on groups. She was one of the 137 signatories on that famous 2011 *Nature* letter pushing back against the idea that group selection explains eusociality. She fought hard for the gene's-eye view. She believed that deep down, biology is about the propagation of the self through kin.

  And yet, look at what she actually *did*.

  If you ask her students, they won't tell you about her genes. They'll tell you about the *group*. She built a lab that functioned less like a collection of competing individuals and more like a highly efficient, supportive colony. She didn't "police" her workers—she empowered them. She didn't maximize her own output at their expense; she sacrificed her time so they could publish.

  To the family and neighbors here: Meg spent her life studying why creatures help each other. The theory says they do it because they share DNA. But watching Meg with her students, and certainly watching her with her husband and these three wonderful kids, it becomes clear that the theory only explains the *mechanism*. It doesn't explain the *grace*.

  Hamilton's Rule might explain why a wasp doesn't reproduce, but it doesn't explain why a woman spends forty years making sure the people around her thrive, even when there's no genetic payoff. It doesn't explain why she answered emails at midnight, or why she fought for her colleagues, or why she's been such a steadfast friend to me.

  There is a beautiful irony in retiring a career dedicated to the power of the individual gene by surrounding yourself with a group that loves you this much. Meg argued that the "group" wasn't the primary unit of selection. But tonight, looking around this room, I think the data suggests otherwise. She may have won the argument about the wasps, but her life proves that the group is what matters in the end.

  So, I went back to my equation. I realized I made a mistake in calculating the Relatedness ($r$). In human terms, friendship isn't a coefficient between zero and one. With Meg, $r$ is effectively infinite. Which means the Benefit always outweighs the Cost.

  Meg, you taught us that nature is driven by selfish genes. But you proved, by example, that people don't have to be.

  To Meg. May your retirement have high benefits, low costs, and infinite relatedness.

  Cheers.
