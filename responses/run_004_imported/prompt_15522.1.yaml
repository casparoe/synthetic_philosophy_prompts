answer: |-
  **Setting:** *A quiet corner of a university courtyard. A large pile of sand sits on a tarp between two armchairs. **ELIAS** (Epistemicist) holds a small scoop. **SOFIA** (Supervaluationist) holds a notebook. It is late afternoon.*

  **Elias:** *(Scoops a single grain)*. One thousand, four hundred and twelve grains. By your lights, Sofia, is this a heap?

  **Sofia:** It is super-true that it is a heap.

  **Elias:** Which means?

  **Sofia:** It means that on every admissible way of making the word "heap" precise, 1,412 grains counts as a heap. There is no precisification of our language where this specific configuration fails to be a heap.

  **Elias:** *(Drops the grain back)*. And if I keep doing this? Eventually we reach a number, say 500. On some precisifications, 500 is a heap. On others, it isn't. So the sentence "500 grains is a heap" lacks a truth value. It's neither true nor false.

  **Sofia:** Exactly. It's indeterminate. But classical logic is preserved. The law of excluded middle holds for the proposition *p*: either *p* is super-true, or *not-p* is super-true. We just can't always say which.

  **Elias:** This is where you lose me. You're preserving the *syntax* of classical logic while gutting the semantics. Let's go further. Keep removing grains. Eventually, we hit a transition. There must be a specific grain $n$ such that $n$ grains is a heap, and $n-1$ is not. Even on your view, there is a boundary between the "super-true" zone and the "indeterminate" zone.

  **Sofia:** There is a boundary between the extension and the penumbra, yes.

  **Elias:** Is *that* boundary sharp?

  **Sofia:** *(Pauses)*. This is the higher-order vagueness problem. If I say the boundary is sharp, I've just recreated the Sorites paradox one level up. Why is *this* grain the first borderline case and not the one before it? So, a sophisticated supervaluationist admits the boundary of the admissible precisifications is itself vague.

  **Elias:** Ah. So you have vagueness about where the vagueness starts.

  **Sofia:** Precisely. We can iterate. Higher-order supervaluationism.

  **Elias:** But what does that *mean*, Sofia? "Admissible precisification" is doing all the work here. You're saying reality doesn't decide, and our language doesn't decide, so we posit a cloud of possible languages. But where does that cloud come from? Is it in our heads? Is it in the social fabric?

  **Sofia:** It's in the rules of use. The rules of use for "heap" don't dictate a single extension. They constrain the extension to a range. Any sharp cutoff within that range is consistent with the rules. "Heap" is semantically indecisive.

  **Elias:** Semantic indecision is just a polite word for ignorance. You're saying *we* don't know which precisification is the "real" one. But I'm saying there *is* no real one to pick. There is just the fact of the matter.

  **Sofia:** The fact of the matter being... what? Show me the property in the world. Is there a "heapness" particle that detaches when you remove the 413th grain?

  **Elias:** No, not a particle. A boundary fixed by usage and context. Look, Timothy Williamson's argument is straightforward. Meaning is determined by use. Use is finite and messy, yes. But the world is discrete. Grains are discrete. If the term "heap" refers to anything, it refers to a set of configurations. That set either includes configuration $C$ or it doesn't. If it doesn't, there's a first configuration it excludes.

  **Sofia:** But *why* that one? If usage is fuzzy, how can it carve out a sharp set? It's like saying a blurry photograph depicts a sharply defined object, we just can't see the edges.

  **Elias:** Exactly! The photograph is blurry because of our epistemic limitations, not because the object lacks edges. We are ignorant of the cutoff.

  **Sofia:** Ignorant *in principle*, Elias. You're claiming that even with perfect knowledge of all linguistic practices, all physical facts, and all cognitive states, we still couldn't know if 413 is a heap. That's not ignorance; that's magic. You're positing a brute fact that floats free of all evidence.

  **Elias:** It's not brute. It's determined by the complex interaction of our interests, the physical stability of the pile, and the history of the word. It's just too complex for us to compute. But logic demands bivalence. Either it is a heap or it is not. If you deny that, you have to adopt a many-valued logic. And then you have to explain why modus ponens fails for vague predicates.

  **Sofia:** I don't deny bivalence! That's the beauty of supervaluationism. "Either $n$ is a heap or $n$ is not a heap" is super-true. It's true on all precisifications. I save classical logic better than you do. You save it by positing unknowable facts; I save it by analyzing truth as stability across interpretations.

  **Elias:** But you lose the existential claim. Consider the sentence: "There exists a number $n$ such that $n$ is a heap and $n-1$ is not." In classical logic, this follows from the Sorites premise being false. You agree the Sorites premise ("if $n$ is a heap, $n-1$ is a heap") is false. So the existential claim must be true. But you say the existential claim is *not* super-true. Because no specific $n$ works on all precisifications.

  **Sofia:** Correct. The existential is true, but not super-true.

  **Elias:** That sounds like word salad. "True but not super-true." You're redefining truth to avoid the conclusion. You want to have your cake (classical logic) and eat it too (no sharp cutoffs). But the sharp cutoff is hiding in your meta-language. You have a sharp line between "admissible" and "inadmissible" precisifications.

  **Sofia:** I told you, that line can be vague too.

  **Elias:** Then you need a meta-meta-language to define the admissibility of the admissibility. And so on. You're pushing the sharpness back, not eliminating it. At some level, you have to say *this* set of precisifications is the right one to consider, and *that* one is not. If that distinction is sharp, you're an epistemicist about precisifications. If it's not, your logic collapses into fuzziness.

  **Sofia:** *(Taps her pen on the notebook)*. Fair. Higher-order vagueness is the price of admission. But look at the cost on your side. You're asking me to believe that there is a specific grain—let's say grain 394—where the semantic value of "heap" flips from True to False. And if I remove it, I'm speaking falsely. But if I put it back, I'm speaking truly. And no human, no alien, no God could ever know which grain it is, because any method of knowing would be sensitive to the very margin of error that creates the ignorance.

  **Elias:** The "margin for error" principle is exactly why we can't know it. Knowledge requires safety. If you believe $n$ is the cutoff, but your belief could easily have been wrong (because $n+1$ is indistinguishable), you don't *know* it. But the fact remains.

  **Sofia:** But *what* makes it remain? If usage doesn't fix it, and physics doesn't fix it... is it just a metaphysical accident? It feels like you're rescuing logic by sacrificing the connection between language and the world. You make language a rigid grid laid over a fuzzy reality, and then claim the grid is real and the fuzziness is just in our heads.

  **Elias:** I'm claiming the fuzziness is epistemic, not ontological. The world is precise. Our access to it is not.

  **Sofia:** But "heap" isn't in the world, Elias. It's a human category. It's pragmatic. Eliezer wrote about this—boundaries are drawn for predictive reasons. If the boundary is purely pragmatic, why would it be sharp? Pragmatism is about utility, and utility doesn't change discontinuously with one grain of sand.

  **Elias:** Utility might be smooth, but the *decision* is binary. When you act, you either treat it as a heap or you don't. You either sweep it up or you leave it. The action is discrete. The category must track the action.

  **Sofia:** We can treat it as a borderline case! We can hesitate. That hesitation is the penumbra.

  **Elias:** Hesitation is just processing time. Eventually, you act.

  **Sofia:** *(Stands up and brushes sand off her hands)*. Let's try this. Imagine we are programming a robot to identify heaps. We give it all the data we have. Under your view, there is a correct setting for the threshold, but we can never find it. Under my view, there is a range of correct settings, and any setting in that range is valid. Which is more useful for the robot?

  **Elias:** If the robot needs to reason classically, it needs a threshold. If you tell the robot "it's indeterminate," it stalls. If you tell it "pick any threshold in the admissible range," it might pick one that contradicts another robot's threshold.

  **Sofia:** But if it picks a threshold, it's lying about the nature of the concept. It's pretending precision where there is none.

  **Elias:** It's pretending precision because the logic *requires* precision to function. You can't navigate the world with indeterminate truth values. You can't drive a car with "super-true" stop signs.

  **Sofia:** We navigate fine with hesitation. We navigate fine with "kind of."

  **Elias:** "Kind of" is just a placeholder for "I don't know the exact probability."

  **Sofia:** No, it's an acknowledgment that the category doesn't apply cleanly. Look, here's my real worry with Epistemicism. It makes truth magical. If truth is independent of our ability to verify it, even in principle, then truth is detached from evidence. You're asking me to accept a fact that makes no difference to anything. No observation could change my mind about where the cutoff is. No linguistic analysis could find it. So why posit it?

  **Elias:** Because the alternative is giving up on the idea that our statements describe the world. If "This is a heap" doesn't have a truth value, then what are we doing? Just expressing vibes?

  **Sofia:** We're expressing that the statement holds across the range of ways we might reasonably sharpen our concepts. That's robust! It's *more* objective than your single, unknowable line. Super-truth is truth that survives semantic variation. That's a stronger notion of truth than "true on the one hidden line God knows."

  **Elias:** *(Scoops another handful of sand, lets it trickle through his fingers)*. But you still haven't solved the higher-order problem without cheating. If the set of admissible precisifications is vague... what determines membership in *that* set?

  **Sofia:** Usage, again. But usage is fuzzy.

  **Elias:** So there's a sharp boundary between "usage allows this precisification" and "usage does not."

  **Sofia:** *(Sighs)*. Okay. I concede that standard supervaluationism has a sharp boundary between the true and the indeterminate. That is a cost. I accept that cost to avoid the cost of unknowable sharp boundaries in the world. I'd rather have a sharp boundary in the *meta-language* than in the *object language*.

  **Elias:** Why is that better?

  **Sofia:** Because the meta-language is our tool. We can adjust it. We can say, "Okay, the boundary of admissibility is also vague." We can iterate. It's a feature of our modeling, not a feature of the sand. You're claiming the sand itself—or the relationship between the sand and the word—is sharply bounded in a way that is inaccessible. I'm claiming our model of the relationship has limits.

  **Elias:** But if you iterate enough, you either stop at a sharp boundary (and you're an epistemicist about the meta-language) or you go on forever (and you lose logical coherence).

  **Sofia:** Maybe logic isn't as crisp as you think it is.

  **Elias:** Then how do you prove anything?

  **Sofia:** Provisionally. Contextually.

  **Elias:** *(Laughs)*. And there it is. You retreat to pragmatism when the logic gets hard.

  **Sofia:** And you retreat to mysticism when the semantics gets hard. "Unknowable sharp boundaries." It sounds like a theological doctrine. The Hidden Cutoff.

  **Elias:** It sounds like realism. You think reality bends to fit our fuzzy concepts. I think our concepts cut into reality, and sometimes the cut is finer than our eyes.

  **Sofia:** *(Looks at the pile, which is now significantly smaller)*. We've removed three hundred grains.

  **Elias:** Is it still a heap?

  **Sofia:** Super-true? No. Indeterminate? Probably. False? Not yet.

  **Elias:** I say it's still a heap. I just don't know how many grains I have left.

  **Sofia:** See? You're acting like a supervaluationist. You're hedging.

  **Elias:** I'm acting like a fallibilist. I could be wrong about it being a heap. But it's either is or isn't.

  **Sofia:** And if you're wrong, which grain made you wrong?

  **Elias:** *(Silence. He looks at the sand)*. I don't know.

  **Sofia:** And you never will.

  **Elias:** No.

  **Sofia:** So why believe it's there?

  **Elias:** Because if I don't believe it's there, I have to believe that logic breaks down when the stakes get low. And I'm not willing to pay that price. What about you? Are you willing to pay the price of a sharp boundary in your meta-language?

  **Sofia:** *(Closes her notebook)*. I'm willing to pay the price of complexity to keep the world fuzzy. The world *feels* fuzzy, Elias. The sand slips through our fingers. Why should the truth be any different?

  **Elias:** Because truth isn't sand.

  **Sofia:** Isn't it?

  *(They stand in silence for a moment, looking at the diminished pile. Neither picks up another grain.)*

  **Elias:** Lunch?

  **Sofia:** Lunch. Is this a sandwich?

  **Elias:** *(Smiles)*. Super-true.

  **Sofia:** Good enough.
