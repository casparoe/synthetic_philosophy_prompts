      *   *Principal Principle (Lewis):* $C(A | X) = X$, where $X$ is the objective chance. The issue is whether the consultant's insight is "inadmissible" information (information about the future that bypasses the chance). Usually, expert opinion about chance *is* admissible evidence about what the chance is, unless the expert has crystal-ball knowledge. The consultant is arguing about model *structure* (shear/speed interaction), which is evidence about the *chance*, not inadmissible info about the *outcome*.
      *   *Decision Theory:* We need to maximize Expected Utility (or minimize Expected Loss). $EU(Action) = \sum P(State) \times Utility(Action, State)$.
      *   *The Impasse:* We don't have a agreed-upon $P(State)$. Camp A says $P = 0.28$. Camp B says $P > 0.28$.
      *   *The Solution:* We need a decision rule that is robust to this probability uncertainty, or a method to aggregate the probabilities that respects both the model and the expert without requiring a specific number from the expert.

  3.  **Develop the Decision Procedure:**
