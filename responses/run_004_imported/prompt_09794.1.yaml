answer: |-
  **MEMORANDUM**

  **TO:** Emergency Preparedness Committee
  **FROM:** [Your Name], Faculty Senate Representative
  **DATE:** October 14, 2023
  **SUBJECT:** Decision Protocol for Hurricane Evacuation (Deadline: 0800 Tomorrow)

  Colleagues,

  We are currently at an impasse. We have roughly 60 hours until closest approach, and we must decide by 0800 tomorrow whether to mandate evacuation. The disagreement centers on how to weigh the National Hurricane Center's (NHC) 28% probability estimate against our consultant's qualitative assessment that this figure underweights specific risk factors.

  As many of you know, my background is in decision theory. I write this not to dictate an outcome, but to propose a decision *procedure* that respects the valid concerns of all three positions currently on the table.

  **1. The Actuarial Concern (Camp A)**
  The warning from the literature on clinical versus actuarial judgment (Meehl, 1954; subsequent meta-analyses) is correct: in high-stakes prediction, algorithms generally outperform unstructured human judgment. We cannot discard the NHC model simply because a credentialed expert has a "hunch." The 28% figure must remain our **baseline anchor**. It is the only objective, replicable data point we have.

  **2. The Expert Judgment Concern (Camp B)**
  However, the NHC product is an estimate of objective chance, not the chance itself. Refusing to update our credence in the face of articulable evidence about model structure (wind shear/forward speed interaction) is not deference to objectivity; it is fetishization of the instrument. The consultant's input is evidence about the *reliability* of the probability estimate.

  **3. The Philosophical Concern (Camp C)**
  Regarding the Principal Principle: The consultant's testimony is "admissible" in David Lewis's sense. It bears on the hypothesis regarding the objective chance (the model's accuracy), not directly on the future outcome (the wind speed) in a way that bypasses the chance. We are permitted to let this evidence shift our credence away from the 28% figure.

  **The Decision Procedure: Threshold Analysis**
  To resolve this without requiring the consultant to produce a number he cannot give, or the committee to ignore the consultant entirely, we will shift the debate from *probability* to *tolerance*. We will determine the **Decision Threshold** ($P^*$) at which evacuation becomes the rational choice.

  **Step 1: Cost Assessment (Deadline: 2000 Tonight)**
  Operations and Student Affairs must provide best-estimate figures for:
  *   $C_{evac}$: The total cost of evacuation (transport, shelter, disruption, liability during travel).
  *   $C_{stay}$: The total expected cost if hurricane-force winds occur while students remain (property damage, injury liability, reputational harm).

  **Step 2: Calculate the Threshold (Deadline: 2100 Tonight)**
  We calculate the break-even probability: $P^* = C_{evac} / C_{stay}$.
  *   If the probability of winds is $> P^*$, we evacuate.
  *   If the probability of winds is $< P^*$, we shelter in place.

  **Step 3: Apply the Data (Deadline: 0800 Tomorrow)**
  *   **Scenario A:** If $0.28 > P^*$, we evacuate immediately. The NHC model alone justifies the action. The consultant's input is moot.
  *   **Scenario B:** If $0.28 < P^*$, we turn to the consultant. We do not ask for a number. We ask a binary question: *"Based on the shear/speed interaction, is the **true** probability of hurricane-force winds greater than $P^*$?"*
      *   If **Yes**: We evacuate. (Expert judgment overrides the baseline because the baseline is insufficient to trigger safety, but the corrected risk is sufficient).
      *   If **No/Unsure**: We shelter in place. (We default to the actuarial baseline per Meehl's warning).

  This procedure honors the actuarial camp by making the NHC figure the default. It honors the expert camp by allowing qualitative model criticism to trigger action when the baseline is ambiguous. It honors the philosophical camp by treating the expert's input as admissible evidence for updating credence relative to a decision threshold.

  Please have your cost estimates to me by 2000 tonight. We will convene at 0730 tomorrow to finalize the calculation and vote.

  Regards,

  [Your Name]
