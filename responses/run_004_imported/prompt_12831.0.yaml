          *   $U(A) = \ln(12000) \approx 9.392$
          *   $E[U(B)] = 0.9\ln(15000) + 0.08\ln(9000) + 0.02\ln(3000)$
          *   $E[U(B)] \approx 0.9(9.615) + 0.08(9.105) + 0.02(8.006)$
