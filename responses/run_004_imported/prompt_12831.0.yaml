      *Decision:* The **Allais Paradox** is the most direct hit regarding the "certainty effect." However, given the user's background in *hazard modeling*, the concept of **Tail Risk / Model Risk** (the 2% isn't really 2%) is crucial. Also, **Ergodicity Economics** (Ole Peters) is very relevant for retirement income (time series vs. ensemble average).

