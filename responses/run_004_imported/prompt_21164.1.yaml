      *   **Opening Salvo (Nyaya):** Udayana attacks the core: Contradiction. If $A$ is $B$ and $A$ is not $B$, logic breaks.
      *   **Jain Defense (Syādvāda):** Siddhasena clarifies *syāt*. It's not "maybe," it's "from a specific perspective." Introduce the three parameters: Substance (*dravya*), Place (*kṣetra*), Time (*kāla*), State (*bhāva*).
      *   **Nyaya Counter (Self-Reference):** The "All statements are partial" claim. Is *that* statement partial? If yes, it's not universally true. If no, it contradicts itself.
      *   **Jain Response (Nayavāda):** Distinguish between the *absolute* reality (only known by *Kevalin*) and the *phenomenal* discourse. The statement about partiality is a *naya* (standpoint), specifically a *sangraha-naya* (generalizing standpoint). It doesn't claim absolute truth, it claims pragmatic validity for liberation.
      *   **Nyaya Concession/Shift:** Udayana acknowledges the utility but demands ontological grounding. If reality is indeterminate, action is impossible.
      *   **Jain Clarification (Dravya vs. Paryāya):** Reality *is* determinate, but complex. Use the analogy of the pot (substance vs. mode). Existence (*sat*) is generic; specific modes are transient.
      *   **Nyaya Pushback (Determinate Knowledge):** We need *nirṇaya* (ascertainment). *Syāt* seems to hedge bets.
      *   **Jain Rebuttal (Physics Analogy - subtle):** Without *syāt*, you freeze one mode and call it the whole. That's the error (*ekānta*).
      *   **Resolution/Conclusion:** They agree on the complexity of *vastu*. They disagree on whether classical bivalent logic can handle it or if a many-valued logic is needed. The Nyaya accepts the *heuristic* value but holds to bivalence for final ontology. The Jain holds that bivalence *is* the distortion.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I explain *syāt* correctly? Yes, emphasize "in a certain respect" not "perhaps."
      *   *Check:* Is the Nyaya objection strong enough? Udayana shouldn't just say "contradiction." He needs to argue that communication requires fixed meanings.
      *   *Check:* The Self-Reference objection. This is the trickiest. The Jain answer usually involves the distinction between *pramāṇa* (valid knowledge) and *naya* (partial viewpoint). The statement "all viewpoints are partial" is a *meta-naya*.
