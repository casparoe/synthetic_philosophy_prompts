answer: |-
  Your intuition is correct, and your friend's reliance on the "compartmentalization" thesis risks imposing a modern disciplinary boundary onto a mind that explicitly sought a unified physics of the heavens and the Earth. To excise Kepler's astrology as a pragmatic or embarrassing appendage is to remove the terrestrial counterpart of his celestial mechanics, leaving his physics metaphysically homeless. The strongest case for your position rests on the ontological and causal continuity between the *Astronomia Nova* and the *Harmonice Mundi*. Kepler did not practice astrology alongside his physics; he practiced astrology *as* the physics of terrestrial effects.

  The central architectonic commitment you identified—geometric archetypes lodged in the soul—is not merely a shared preference but the *causal mechanism* for both fields. In the *Astronomia Nova*, Kepler rejects the solid spheres of the ancients but retains a need for a mover. He posits an *anima motrix* (motive soul) in the Sun, emitting a *species* (likeness) that sweeps the planets. This is not modern gravity; it is a physicalized animism governed by geometry. In the *Harmonice Mundi*, specifically Book IV (the astrological book), he deploys the exact same ontology for terrestrial effects. The planets do not shoot occult rays down to Earth. Rather, the Earth possesses an *anima telluris* (Earth's soul), which perceives the geometric aspects formed by the planets in the sky. When the *anima telluris* recognizes a harmonic ratio (a constructible polygon), it reacts physically, causing weather changes or influencing the generation of forms in the sublunary world.

  If you accept Kepler's physics in the *Astronomia Nova* as a coherent system, you must accept his astrology in the *Harmonice* as its necessary consequence. To deny the astrology is to deny the capacity of the *anima telluris* to perceive geometry, which undermines the capacity of the *anima motrix* to impart it. The criterion for validity is identical in both: Euclidean constructibility. Just as he rejected the equant because it violated uniform circular motion (a geometric ideal), he rejected the zodiac signs and houses because they are arbitrary divisions of the circle, not natural geometric entities. He did not reject them because he was becoming a "modern skeptic"; he rejected them because they were geometrically impure. His invention of the quintile and sesquiquadrate was not an expansion of superstition, but a purification of the system to align with the dodecahedron and icosahedron. This is the same drive that produced the elliptical orbit: a willingness to follow the geometry where it leads, even if it contradicts tradition.

  Regarding the "foolish daughter" remark (*De Fundamentis Astrologiae Certioribus*), your friend's reading relies on a decontextualized snippet. Kepler writes: "Astrology is the foolish daughter of a wise mother [Astronomy], and the mother must support the daughter." In the immediate context, Kepler is defending the *utility* of astrology against those who would ban it entirely. He is arguing that Astronomy (the mother) provides the theoretical truth, while Astrology (the daughter) provides the practical application that justifies the mother's existence to patrons. It is an economic argument, not an epistemic divorce. He calls her "foolish" not because she is false, but because she is prone to error when not strictly governed by the mother's geometric laws. This is consistent with his lifelong complaint that vulgar astrologers are lazy mathematicians. He is not sorting "science" from "superstition"; he is sorting "geometric astrology" from "arbitrary astrology."

  The charge of opportunism—that he tailored his beliefs to sell almanacs—collapses when confronted with the content of those almanacs. Kepler refused to make specific predictions about political outcomes or individual horoscopes, which were the most lucrative forms of the trade. Instead, he predicted weather and general social moods, based strictly on his aspect theory. He lost income by this restraint. Furthermore, his empirical method in astrology mirrors his method in astronomy. In the *Astronomia Nova*, he grinds through years of Tycho's Mars data to falsify the circular orbit. In his astrological work, he logs decades of weather data against planetary configurations to falsify traditional aspects and confirm his new ones. To call this "compartmentalized" is to ignore that it is the *same* epistemic virtue: the subordination of hypothesis to observation.

  Finally, the claim that seeing continuity is a "fashionable revisionist move" projects the demarcation problem backward. For Kepler, there was no "physics" distinct from "natural philosophy" distinct from "astrology." There was only the study of God's creation through number and weight. Patrick Boner and others who emphasize Kepler's synthesis are not overstating the unity; they are respecting Kepler's own explicit intent in the *Harmonice Mundi*, which binds geometry (Book I), music (Book III), astrology (Book IV), and astronomy (Book V) into a single argument about universal harmony. If you sever Book IV, the transition from the harmonies of the soul to the harmonies of the orbits becomes unintelligible.

  Your friend argues that reading continuity is anachronistic. I submit that reading *discontinuity* is the true anachronism. It assumes a post-Newtonian world where matter is inert and geometry is descriptive, rather than a Renaissance world where geometry is causal and matter is ensouled. Kepler's astrology is not a shadow on his legacy; it is the shadow cast by his physics. You cannot have the light without the shadow. To accept Kepler's heliocentrism and elliptical orbits is to accept a universe where geometry acts physically upon souls. If we deny the latter because it offends modern sensibilities, we are not analyzing Kepler; we are censoring him. Your reading group has led you to a more historically faithful position: Kepler's astrology was the laboratory where he tested the terrestrial reach of the very same geometric forces that moved the stars.
