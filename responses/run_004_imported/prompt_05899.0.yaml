answer: |-
  **MEMORANDUM**

  **TO:** Director of Wildlife Resources, State Wildlife Agency
  **FROM:** Scientific Advisory Committee, Natural Heritage Program
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding *Desmognathus* sp. "Ridge Complex" (Petition #23-04)

  **1. Executive Summary and Recommendation**

  The Scientific Advisory Committee has reviewed the petition to list the ridge-restricted population of salamanders (hereafter "Ridge Complex") as a distinct species under the State Endangered Species Act. Following review of the genetic, morphological, and ecological data, and extensive deliberation regarding the conceptual boundaries of taxonomic units in conservation policy, the Committee offers the following recommendation:

  **We recommend against listing the Ridge Complex as a distinct "Species" at this time. However, we unanimously recommend designating the Ridge Complex as a "Distinct Population Segment" (DPS) and assigning it immediate "Candidate" status.**

  This recommendation triggers a moratorium on permitting actions that would degrade the primary habitat (the old-growth cove forest on the ridge system) for a period of 24 months, allowing time for further demographic modeling and negotiation of a Habitat Conservation Plan. We believe this path best satisfies the statutory mandate to preserve biological diversity without compromising the taxonomic integrity required for long-term regulatory consistency.

  **2. Scientific Findings: The Data and Its Limits**

  The petition rests on three primary claims, which the Committee evaluates as follows:

  *   **Genetic Distinctiveness:** The Ridge Complex is reciprocally monophyletic with respect to the widespread lowland form, showing approximately 4% divergence in mitochondrial DNA. This level of divergence is congruent with recognized species pairs elsewhere in the genus. *We accept this as evidence of historical isolation and evolutionary independence.*
  *   **Morphological Diagnosability:** There are no reliable field characters distinguishing the Ridge Complex from the lowland form. *We accept this as a factual constraint on identification.*
  *   **Reproductive Isolation:** A hybrid zone exists at the ridge base (approx. 3 km wide), with roughly 14% of individuals showing mixed ancestry. *We interpret this as evidence that reproductive isolation is incomplete and that gene flow, while restricted, is not absent.*

  **3. The Conceptual Conflict: Taxonomy vs. Policy**

  The division within the Committee regarding this case is not merely a disagreement over data, but over the function of the category "species" within a legal statute. We owe the Agency an explicit accounting of this tension.

  **The Case for Listing (The Lineage View):**
  Proponents of full species status argue that the Ridge Complex represents an independent evolutionary lineage. Under a phylogenetic species concept, the 4% divergence and monophyly are sufficient to warrant recognition. The moral and biological imperative here is clear: if the cove forest is logged, this unique branch of the tree of life—which may possess adaptive traits not evident in morphology—will be extinguished. To deny protection because they "look like" their lowland relatives is to prioritize human convenience over evolutionary reality.

  **The Case Against Listing (The Inflation Concern):**
  Opponents of full species status argue that granting "Species" rank based primarily on mitochondrial divergence, in the presence of a leaky hybrid zone and no morphological diagnosis, sets an unmanageable precedent. If 4% mtDNA divergence becomes the threshold for state-listed species, dozens of lineages across the state could qualify, overwhelming the Agency's capacity to enforce regulations. This is not bureaucratic caution; it is a valid scientific concern regarding "taxonomic inflation." If the label "species" loses its discriminatory power by being applied to every genetically distinct population, the legal mechanism loses its credibility. Furthermore, under a Biological Species Concept, the existence of a hybrid zone suggests these populations are not yet fully independent biological units.

  **4. Rationale for the DPS Recommendation**

  The Committee believes that framing this decision as a binary choice between "Full Species" and "No Protection" forces a false dichotomy. The statute's provision for a **Distinct Population Segment (DPS)** is the appropriate tool here, precisely because it decouples conservation priority from rigid taxonomic rank.

  We recommend the DPS designation for the following reasons:

  *   **Acknowledging Significance without Inflation:** Designating the Ridge Complex as a DPS acknowledges its evolutionary significance (the monophyly and divergence) without elevating it to full species rank. This mitigates the risk of taxonomic inflation. We are not redefining the genus; we are identifying a population of critical conservation concern. This addresses the skeptics' fear that we are rewriting taxonomy to suit conservation outcomes.
  *   **Focusing on the Threat, Not Just the Taxon:** The primary driver for this recommendation is not solely the genetic divergence, but the imminence of the threat. The logging of the cove forest represents a catastrophic loss of habitat complexity that supports this lineage. A DPS designation allows the Agency to protect the *habitat necessary to maintain the lineage's independence* without requiring proof that the lineage is already fully reproductively isolated.
  *   **The "Double Duty" of Species:** We must be explicit that in conservation law, "species" status performs double duty: it is a scientific hypothesis about nature *and* a legal trigger for resource allocation. In this case, the scientific hypothesis is ambiguous (lineage-based concepts say "yes," biological concepts say "maybe"). When the science is ambiguous, the policy decision must rest on risk assessment. The risk of losing a unique evolutionary lineage outweighs the administrative risk of managing a DPS designation.

  **5. Addressing the Skeptic**

  To the Committee members and Agency staff concerned that this recommendation opens the door to endless petitions: We agree that mtDNA divergence alone should not mandate species status. We are explicitly *not* recommending species status for this reason. By utilizing the DPS mechanism, we establish a precedent that conservation significance can be recognized *prior* to full speciation, but only where there is a discrete, definable population facing a discrete, definable threat. This raises the bar for future petitions: they will need to demonstrate not just genetic divergence, but ecological discreteness and imminent risk. This protects the Agency from a flood of genetic data without ecological context.

  **6. Conclusion**

  We are aware, as Ereshefsky and others have noted, that nature does not always carve itself at the joints we wish to legislate. The Ridge Complex salamanders exist in a gray zone of evolutionary divergence. Our job is not to force them into a binary box, but to ensure the regulatory framework is flexible enough to prevent their loss while they are still there to be studied.

  By recommending DPS Candidate status, we preserve the unique genetic heritage of the ridge system, we protect the old-growth cove forest from immediate logging, and we maintain the taxonomic rigor necessary for the Agency to function effectively. We urge the Agency to accept this recommendation and initiate the rule-making process for DPS designation immediately.

  Respectfully submitted,

  [Your Name/Signature]
  Chair, Scientific Advisory Committee
  Natural Heritage Program
