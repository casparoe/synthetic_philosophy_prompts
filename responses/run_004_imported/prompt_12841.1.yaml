      *   *Lewis's Move:* Distinguish between the *punishment* (the suffering/penalty) and the *punishing* (the authoritative condemnation). Maybe Christ bore the *penalty* without being the *punished* in the strict retributive sense.
      *   *Deterrence vs. Desert:* If punishment is about desert (retributivism), substitution is impossible. If it's about consequences/deterrence (utilitarian), maybe substitution makes sense (someone suffers to stop the bad outcome).
      *   *The Theological Stakes:* If it's not retributive, is it still *atonement*? Does it satisfy justice?

