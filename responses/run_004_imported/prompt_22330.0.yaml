      *   *Refinement on the "Automatic Win" question:* Be careful. Hume doesn't say it's *logically impossible* for testimony to win (Part 1 leaves the door ajar). He says it's *practically impossible* given human nature (Part 2 closes the door). This paragraph is the slam of the door.

  6.  **Final Polish:** Check against the specific text provided. Ensure the explanation of "bigotry, ignorance, cunning, and roguery" is clear. Ensure the distinction between "disproving the testimony" and "rejecting the fact" is highlighted. (This is the crux: You don't need to prove the witness is lying; you just need to show it's more likely they are wrong than that nature changed).

