answer: |-
  **Setting:** *A quiet corner of the university coffee shop, late afternoon. The remains of two seminar papers are spread across the table. **Elena** (defending a Stalnaker-style unified semantics) stirs her tea. **Marcus** (defending the Adams/Edgington non-truth-conditional view) leans back, nursing an espresso.*

  **Elena:** You know, the more I think about our seminar discussion, the more I think you're letting the Oswald example do too much heavy lifting. It's elegant, sure. "If Oswald didn't kill Kennedy, someone else did" versus "If Oswald hadn't killed Kennedy, someone else would have." But does the difference in mood really force us to say the word "if" means two completely different things?

  **Marcus:** It's not just the mood, Elena. It's the cognitive stance. In the indicative, we're operating within what we take to be the live options. We don't know for sure who did it, so we consider the worlds compatible with our knowledge where Oswald is innocent. In those worlds, the conspiracy holds, so someone else did it. High confidence. But the counterfactual? That asks us to step *outside* our knowledge and rewrite history. If we rewrite history so Oswald didn't shoot, why assume the conspiracy was still there? Maybe the conspiracy only existed *because* Oswald was available. So the second sentence feels like speculation.

  **Elena:** But that's exactly what my view predicts, and without multiplying meanings. I keep the semantics of "if" unified. It's a selection function. It picks out the closest world where the antecedent is true. The difference is purely pragmatic—specifically, it's about the *context set*. For indicatives, the selection function is constrained to pick a world within the set of epistemically live possibilities. For counterfactuals, we relax that constraint. We allow the selection function to reach outside the live set to metaphysically close worlds. Same engine, different fuel constraints.

  **Marcus:** The problem is that "same engine" implies the output is the same kind of thing. A truth value. But if the indicative is constrained to the live set, its "truth" is just a reflection of our current information state. That's not truth; that's assertibility. When I say "If Oswald didn't, someone else did," I'm not describing a fact about the world; I'm expressing my high conditional credence that someone else did, given Oswald didn't. That's Adams' Thesis. Assertibility equals conditional probability. If you force a truth condition on the indicative, you can't explain why the first sentence is assertible while the second isn't, without making the truth conditions of the first depend entirely on what we *know*, rather than what *is*.

  **Elena:** I don't see why truth conditions can't depend on context. Stalnaker's point is that the proposition expressed by a conditional is context-dependent. But it's still a proposition. It still divides the set of possible worlds into those where it's true and those where it's false. If I say "If it rains, the match is cancelled," I've committed to the claim that in the closest rain-world, the match is cancelled. If it turns out the match goes on, I was wrong. I lied. That feels like a truth condition.

  **Marcus:** But then you run straight into Lewis's triviality result. You know the proof. If you assume the conditional has truth conditions, and you assume the probability of the conditional equals the conditional probability (which it clearly does for indicatives—just ask anyone to bet on it), you prove that the probability of the conditional must equal the probability of the consequent. That's absurd. It implies conditionals are probabilistically independent of their antecedents. So, one of the assumptions has to go. I drop truth conditions. You? You have to drop Adams' Thesis. You have to say that when people judge "If A, B" as probable, they aren't actually judging the probability of the proposition expressed by "If A, B."

  **Elena:** I don't drop Adams' Thesis; I reinterpret the probability claim. When someone evaluates $P(\text{If } A, B)$, they aren't holding the context fixed. They are shifting the context to one where $A$ is presupposed. In that shifted context, the conditional expresses a different proposition. Lewis's proof assumes the proposition stays fixed while we vary the probability function. But if the proposition itself shifts with the probability function, the triviality result doesn't get a grip. I can keep truth conditions *and* explain the probabilistic data by acknowledging that context is dynamic.

  **Marcus:** That feels like a dodge. You're saving truth conditions by making them so slippery they can't be the object of belief. If the proposition changes every time I update my credence in the antecedent, in what sense is it a stable object of judgment? But let's grant you that for a moment. The real cost comes when you try to embed these things. If indicatives have truth conditions, I should be able to negate them or put them in the antecedent of another conditional. "It is not the case that if it rains, the match is cancelled." What does that mean on your view?

  **Elena:** It means the closest rain-world is not a match-cancellation world. It's straightforward.

  **Marcus:** Is it? Try saying it. "It's not the case that if it rains, the match is cancelled." It sounds like you're saying "If it rains, the match might not be cancelled." You aren't negating a proposition; you're rejecting a conditional commitment. And what about "If if it rains, the match is cancelled, then we should bring umbrellas"? Nested indicatives are notoriously awkward. On my view, that's because you can't supposition a supposition. You can't have a credence in a credence-rule. The awkwardness is evidence that there's no truth-conditional content to embed.

  **Elena:** But we *do* embed them, Marcus. Maybe not "if if," but consider modal subordination. "If a farmer owns a donkey, he beats it. If he beats it, it runs away." The second sentence depends on the context established by the first conditional. Your view struggles to explain how the anaphora works if the first sentence doesn't update the common ground with truth-conditional content. If "If A, B" is just a rule for updating credences, how does it license the pronoun "it" in the next sentence? Truth conditions update the context set; mere assertibility conditions don't necessarily do that in the same way.

  **Marcus:** We can handle anaphora through dynamic update semantics without assigning classical truth values. The point is, you're paying a high price for unity. You're forcing indicatives into a truth-conditional box where they don't fit comfortably, just to keep the logic clean. I'm willing to accept that "if" is ambiguous—or rather, that the indicative "if" is a distinct grammatical operator from the counterfactual "if"—to save the probabilistic intuition. The Oswald pair shows they behave differently. The triviality result shows indicatives can't be standard propositions. The embedding data shows they resist logical operators. Why cling to unity?

  **Elena:** Because unity explains the logical validities we both accept. Modus Ponens works for both. Hypothetical syllogism works for both (mostly). If they were fundamentally different operators, why would they obey the same inference rules? My view explains the logic; your view explains the probability. I think logic is the deeper feature of semantics.

  **Marcus:** And I think usage is. But look, we're circling. We need to know what would actually break the deadlock.

  **Elena:** Agreed. So, here is what would change my mind. If you could show me a case where an indicative conditional, when embedded under a logical operator like negation or in the antecedent of another conditional, systematically fails to behave truth-functionally *in a way that counterfactuals do not*. If I say "It's not the case that if Oswald didn't do it, someone else did," and native speakers consistently interpret that as something other than the negation of the conditional proposition—while accepting the negation of the counterfactual version as straightforward negation—then I'd have to concede they are different beasts. I need evidence that the logic of embedding diverges, not just the intuition of assertibility.

  **Marcus:** That's fair. Here's mine. I need evidence that dissociates conditional probability from acceptability in indicatives. If you can find a systematic class of indicative conditionals where $P(B|A)$ is near 1, but competent speakers consistently reject "If A, B" as false or unacceptable for reasons *other* than conversational implicature—say, because of a lack of causal connection or some truth-conditional feature that probability doesn't capture—then Adams' Thesis is dead, and I'd have to come over to your side. Show me that high conditional probability isn't enough for assertibility, and I'll admit they might have truth conditions after all.

  **Elena:** So, logical behavior in embedding for me. Probabilistic dissociation for you.

  **Marcus:** Exactly. Until then, I'm betting on the credence.

  **Elena:** And I'm betting on the worlds.

  *They clink their cups, the seminar officially adjourned.*
