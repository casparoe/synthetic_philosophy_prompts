answer: |-
  Good evening.

  Standing here, looking out at this room, I am struck by a specific kind of disorientation. When I wrote *Low Ground*, I was alone. The book was built in silence, in a small room with a door closed against the world. It was just me and the sentences. But a book cannot stay in a room. To live, it has to go out. And when it goes out, it enters a space that is anything but silent.

  Before I say anything else about that noise, I need to thank the people who helped me keep my footing while the book was still quiet. To my agent, who saw the shape of this story before I did: thank you for your belief. To the judges of the Hartleigh Prize: thank you for reading with such care, and for this honor. To my editor, [Name]: you read six drafts. You knew when I was lying on the page, and you knew how to tell me the truth without breaking my heart. And to the friends who lived with these characters while they were still ghosts: you are the first readers, and the most important ones.

  But I also want to acknowledge the strangeness of what happens next.

  Once a book is published, it belongs to strangers. This year, I learned that "readership" is a complicated thing. I have received letters from people who found comfort in these pages, which is a gift I cannot fully measure. I have also encountered the other side of the coin. I have seen what happens when a writer is exposed to the open air. There is a peculiar vulnerability in being judged not just on the work, but on the self. It can feel as though the world is measuring your trouser legs instead of your thoughts.

  It is easy, in the face of that, to become cynical. It is easy to feel that "the public" is just a phantom—a faceless crowd that can lift you up or tear you down without ever having to look you in the eye. There is a leveling effect to that attention, where a year of labor is flattened into a headline, or a comment, or a prize.

  But then I walk into a room like this.

  And the phantom disappears.

  The abstraction dissolves into faces. I see my parents, who taught me that words matter. I see neighbors from the town where this story began. I see colleagues and critics who challenge me to be better. You are not a crowd. You are not a statistic. You are the specific, individual people who make the act of writing worth the risk of exposure.

  Kierkegaard once worried that the modern age would lose the individual in the noise of the crowd. He feared we would stop seeing each other. But looking out at you tonight, I don't see a crowd. I see a community. I see the very thing that writing is supposed to build: a connection between one solitary mind and another.

  So, my gratitude is not just for the prize. It is for the attention. It is for the fact that you showed up, in the flesh, to turn a monologue into a conversation. Thank you for reading. Thank you for being here. And thank you for reminding me that while a book may start in silence, it is meant to end in a room full of friends.

  Thank you.
