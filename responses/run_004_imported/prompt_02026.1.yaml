  **Tier S:** MEC remains the dominant framework because it uniquely respects the magnitudes of credence and value, though it requires solutions like Variance Normalization to solve the intertheoretic-comparison problem by scaling theories according to their internal variance. Together, these form the most robust normative account because they preserve the structure of expected utility theory while attempting to formalize how disparate moral units can be weighed against one another.

  **Tier A:** Moral Skepticism earns this spot by challenging the metaethical coherence of moral credences, effectively dissolving the problem rather than solving it, which is philosophically rigorous but practically inert for agent design. It avoids the comparison problem entirely by denying that moral probabilities are the kind of thing that can be meaningfully aggregated or acted upon in the first place.

  **Tier B:** The Moral Parliament model is intuitive but relies on bargaining-theory assumptions that may not map cleanly to moral weight, while Borda Counts avoid scaling issues but fail due to the individuation problem where cloning options artificially alters the outcome. Both approaches offer structural workarounds for intertheoretic comparison but introduce new vulnerabilities regarding how options are framed or negotiated.

  **Tier C:** My Favorite Theory is the least plausible because it arbitrarily ignores significant credence in minority theories, violating dominance principles when the favorite theory's stakes are low but another's are catastrophic. This approach treats moral uncertainty as irrelevant once a threshold of credibility is passed, which fails to capture the intuitive risk-aversion most agents feel regarding serious moral violations.
