      *   *Nuance:* Lewis's counterparts are distinct individuals. Leibniz's "other Adams" are distinct *concepts* in God's mind. The result is the same (it's not *you*), but the mechanism is different.
      *   *The "Vibe" Check:* The user wants an argument, not a vibe. I need to be precise about *why* the CIC prevents transworld identity.
      *   *Key Distinction:* Kripke says "I could have been F." Leibniz says "If I were F, I would not be I." Lewis says "If I were F, a counterpart of me would be F." Leibniz is closer to Lewis here, but again, based on logic, not spacetime.

  7.  **Finalizing the Australia Application:**
      *   Be gentle but firm. In the Australia world, you don't exist.
      *   Is there a "ghost" of you? No.
      *   Is there a similar person? Maybe, but they aren't a counterpart in the technical sense, just another possible substance.
      *   The emotional weight: The "you" that wonders about the Australia world only exists in *this* world.

  8.  **Structure and Tone:**
      *   Tone: Academic but accessible (matching the user's linguistics background). Respectful of the personal stakes (the mom story).
      *   Structure:
