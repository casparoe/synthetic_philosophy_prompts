      *   *Section 3: The Verdict.* He rejects Transworld Identity (Kripke) but not exactly for Lewis's reasons. He creates a third option: **Conceptual Containment Essentialism.**
      *   *Section 4: The Australia Scenario.* Apply the theory.
          *   Your CIC includes "parents met in [City] at [Time]."
          *   Australia World: Parents don't meet.
          *   Result: That world does not contain *you*. It doesn't contain a counterpart either, strictly speaking, because counterparts imply a relation of similarity across isolation. For Leibniz, it's about logical compatibility.
          *   *The "Me" Question:* Nothing is true of "you" there because "you" are not a component of that compossible set.
      *   *Conclusion:* Summarize. The dichotomy fails to carve at the joints because Leibniz's ontology is theological/logical, not modal/semantic.

  6.  **Refining the Argument (Self-Correction/Nuance Check):**
