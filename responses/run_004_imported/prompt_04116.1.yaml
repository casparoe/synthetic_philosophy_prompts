prompt: |-
  Random thing that's been bugging me: I teach contextualism and pragmatic encroachment back to back every semester, and I keep telling students they're basically two different answers to the same DeRose-style bank cases, but when they push me on it I can't always cash out why the two views aren't just notational variants of each other dressed up in different vocab. Both are happy to say 'S knows that p' is true given one stakes-situation and false given another, holding S's evidence completely fixed. What I actually want from you is this: what's doing the real theoretical work that keeps contextualism and subject-sensitive invariantism apart, and can you walk me through a case where the attributor and the subject sit in different stakes situations (say, a relaxed attributor gossiping about a subject who has a ton riding on the answer), so the two views actually spit out different verdicts on the knowledge ascription instead of just different explanations for the same verdict? I can never keep straight which view is suppose to say what in that kind of case.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is an instructor teaching epistemology (specifically contextualism and pragmatic encroachment/subject-sensitive invariantism).
      *   **Problem:** They struggle to explain to students *why* these two views aren't just notational variants. Both agree that "S knows p" can vary in truth value across stakes situations with fixed evidence.
      *   **Specific Goal:** The user wants to know what theoretical work keeps them apart (the core distinction) and, crucially, a specific *case* where the attributor and subject have *different* stakes, leading to *different truth verdicts* (divergence), not just different explanations.
      *   **Tone:** Professional, philosophical, precise, but conversational (since they are asking a colleague/peer).

  2.  **Deconstruct the Core Distinction:**
      *   **Contextualism:** The truth conditions of knowledge *ascriptions* ("S knows p") depend on the *attributor's* context (specifically, the epistemic standards salient in the conversation). The subject's mental state/facts don't change, but the semantic content of "knows" shifts.
      *   **Pragmatic Encroachment (Subject-Sensitive Invariantism - SSI):** The truth conditions of knowledge *ascriptions* depend on the *subject's* practical situation (stakes). The meaning of "knows" is invariant, but whether S meets those conditions depends on S's stakes.
      *   **The Overlap:** In standard DeRose cases (Bank Cases), the attributor and subject are usually the same person or in the same context. So, both views predict "I know" is true in Low Stakes and false in High Stakes. This makes them look like notational variants.
      *   **The Divergence:** To separate them, we need a case where Attributor Context $\neq$ Subject Stakes.

  3.  **Develop the Divergence Case (The "Cross-Context" Case):**
      *   *Scenario:* We need Subject (S) in High Stakes, Attributor (A) in Low Stakes (or vice versa).
      *   *Setup:*
          *   **Subject (S):** Hannah. She has a huge mortgage payment due tomorrow. She needs to deposit a check. The bank is open Saturday. Her stakes are **High**.
          *   **Attributor (A):** John. He is just casually gossiping about Hannah. He has no stake in whether the bank is open. His conversational context is **Low** (standards are lax).
          *   **Proposition (p):** "The bank is open on Saturday."
          *   **Evidence:** Hannah checked the website last week. (Fixed).
      *   *Question:* Is the sentence "Hannah knows that the bank is open on Saturday" true or false when uttered by John?

      *   *Contextualist Prediction:*
          *   Truth depends on *Attributor's* context.
          *   John is in a Low Stakes/Loose Standards context.
          *   Therefore, "Knows" picks out a low standard relation.
          *   Hannah meets the low standard.
          *   **Verdict:** TRUE.

      *   *SSI/Encroachment Prediction:*
          *   Truth depends on *Subject's* stakes.
          *   Hannah is in a High Stakes situation.
          *   High stakes raise the epistemic threshold required for knowledge.
          *   Hannah's evidence (website check) isn't enough for High Stakes.
          *   **Verdict:** FALSE.

      *   *Result:* Divergence! This is the smoking gun.

  4.  **Refine the Theoretical Work (Beyond the Case):**
      *   It's not just about the verdicts; it's about *what explains* the verdicts.
      *   **Semantics vs. Metaphysics:** Contextualism is a semantic thesis about the word "knows" (indexicality). SSI is a metaphysical/epistemological thesis about the nature of knowledge (practical factors constitute knowledge).
      *   **Disagreement:** Contextualism struggles with faultless disagreement across contexts. SSI handles disagreement better (one is right, one is wrong) but struggles with why we *feel* like both might be right in different conversations.
      *   **Action:** Contextualism says knowledge guides action relative to the attributor? No, usually knowledge guides the subject's action. SSI ties knowledge directly to rational action for the subject.

  5.  **Drafting the Response:**
      *   *Acknowledge the frustration:* Validate that this is a common and legitimate confusion. The "Bank Case" overlap is the culprit.
      *   *Define the Split:* Clearly distinguish *Attributor Context* (Contextualism) vs. *Subject Stakes* (SSI).
      *   *The "Smoking Gun" Case:* Walk through the Hannah/John scenario derived in step 3. Use a table or clear bullets for predictions.
      *   *Theoretical "Real Work":* Explain *why* they differ beyond the verdict.
          *   Semantics (Indexicality vs. Invariantism).
          *   The role of practical factors (Conversational salience vs. Practical reasoning).
          *   Disagreement data.
      *   *Teaching Tip:* Suggest how to present this to students to avoid the "notational variant" trap.

  6.  **Review and Refine:**
      *   *Check:* Did I answer the specific prompt? Yes (theoretical work + specific case with different stakes).
      *   *Clarity:* Ensure the distinction between "standards of the conversation" and "stakes of the subject" is sharp.
      *   *Nuance:* Mention that some versions of contextualism might try to accommodate subject stakes, but *classic* DeRose-style contextualism focuses on attributor context. Stick to the standard definitions for clarity.
      *   *Correction:* Wait, does SSI say the *sentence* is false, or that the *belief* doesn't count as knowledge? SSI says the proposition *S knows p* is false. Contextualism says the proposition expressed by *S knows p* is true (because the proposition expressed is different). I need to be careful with "Truth of the sentence" vs "Truth of the proposition expressed."
      *   *Refinement on Verdicts:*
          *   Contextualist: In John's mouth, "Hannah knows" expresses a proposition that is TRUE.
          *   SSI: In John's mouth, "Hannah knows" expresses a proposition that is FALSE.
      *   *Make sure to emphasize:* This is the only way to empirically (or intuitively) distinguish them.

  7.  **Final Polish:** Organize with clear headings. Keep the tone collegial. (Self-Correction: Make sure not to conflate SSI with Interest-Relative Invariantism (IRI), though they are effectively the same for this purpose. Stick to "Pragmatic Encroachment/SSI" as the user used those terms.)

  8.  *(Final check of the divergence case)*:
      *   Subject: High Stakes.
      *   Attributor: Low Stakes.
      *   Contextualism: Attributor sets standards -> Low Standards -> Knowledge Ascription TRUE.
      *   SSI: Subject sets threshold -> High Threshold -> Knowledge Ascription FALSE.
      *   Perfect.

      *   *Reverse Case (Subject Low, Attributor High):*
      *   Subject: Low Stakes.
      *   Attributor: High Stakes (e.g., Skeptical Philosophical Context).
      *   Contextualism: Attributor sets standards -> High Standards -> Knowledge Ascription FALSE.
      *   SSI: Subject sets threshold -> Low Threshold -> Knowledge Ascription TRUE.
      *   Also works. I'll stick to the first one (Subj High / Attr Low) as it's often more intuitive for "gossip" cases.

  9.  **Constructing the Output.** (Proceed to generate response based on these thoughts.)
answer: |-
  This is one of the most persistent and legitimate frustrations in teaching contemporary epistemology. You are right to feel that in standard DeRose-style Bank Cases, the two views are extensionally equivalent. In those cases, the subject's stakes and the attributor's conversational context rise and fall together. If you only teach those cases, contextualism and subject-sensitive invariantism (SSI/pragmatic encroachment) look like notational variants: one says "the word 'knows' changes meaning," the other says "the fact of knowledge changes," but they agree on every truth value.

  To separate them, you have to break the link between the **Attributor's Context** and the **Subject's Stakes**.

  Here is the breakdown of the theoretical work keeping them apart, followed by the specific divergence case you need for class.

  ### 1. The Theoretical Work: What is actually doing the lifting?

  The fundamental divide is not about whether practical factors matter (both say yes); it is about **where** they matter in the semantic/epistemic structure.

  *   **Contextualism is a Semantic Thesis about the Word "Knows."**
      *   It claims "knows" is indexical (like "tall" or "here").
      *   The *content* of the knowledge ascription shifts depending on the **Attributor's** conversational context.
      *   **The Mechanism:** Practical stakes make certain error possibilities salient in conversation. Salience raises the semantic standard for the word "knows."
      *   **The Metaphysics:** The subject's actual epistemic position does *not* change. Hannah is in the exact same mental state in both cases. Only the bar she is being measured against moves.

  *   **SSI (Pragmatic Encroachment) is a Metaphysical Thesis about Knowledge.**
      *   It claims "knows" is invariant (like "flat" or "water").
      *   The *truth conditions* for knowledge depend on the **Subject's** practical situation.
      *   **The Mechanism:** Practical stakes affect the rationality of belief/action. Since knowledge is the norm of action/practical reasoning, high stakes require stronger evidence to constitute knowledge.
      *   **The Metaphysics:** The subject's actual epistemic position *does* change (or at least, the fact of whether they know changes) because their practical environment changes, even if their evidence is fixed.

  **Summary:** Contextualism says the *ruler* changes size depending on who is holding it. SSI says the *object being measured* changes size depending on where it is sitting.

  ---

  ### 2. The Divergence Case: "The Gossiping Attributor"

  To get different verdicts, you need a case where the **Subject is in High Stakes** but the **Attributor is in Low Stakes**.

  **The Setup:**
  *   **Subject (Hannah):** Hannah has a massive mortgage payment due Monday morning. If her check doesn't clear by Monday noon, she defaults. She has a check to deposit. The bank is usually open Saturday, but she heard a rumor they might close. She checked the website last week (fixed evidence).
      *   *Stakes:* **Extremely High.**
  *   **Attributor (John):** John is a casual acquaintance. He is sitting at a coffee shop with a friend, gossiping about Hannah's weekend plans. John has no stake in whether the bank is open. He is not planning to go there, nor does he care if Hannah defaults.
      *   *Conversational Context:* **Low Stakes / Low Standards.** (No skeptical possibilities are salient; they are speaking loosely).
  *   **The Ascription:** John says: *"Hannah knows that the bank will be open tomorrow."*

  **The Predictions:**

  | View | What determines the truth conditions? | Application to Case | **Verdict on John's Utterance** |
  | :--- | :--- | :--- | :--- |
  | **Contextualism** | **Attributor's Context.** John is in a low-standards conversation. The word "knows" picks out a weak relation. Hannah meets that weak relation. | John's context sets a low bar. Hannah clears the low bar. | **TRUE** |
  | **SSI / Encroachment** | **Subject's Stakes.** Hannah is in a high-stakes situation. High stakes raise the epistemic threshold required to *know*. Hannah's evidence (website check) is insufficient for high stakes. | Hannah's stakes set a high bar. Hannah fails to clear the high bar. | **FALSE** |

  **Why this works for students:**
  This is the "smoking gun." If your students intuit that John is speaking falsely (because Hannah really *doesn't* know given what's on the line for her), they are leaning SSI. If they intuit that John is speaking truly (because *in this conversation*, given how casually they are talking, it's correct to say she knows), they are leaning Contextualist.

  ---

  ### 3. The Reverse Divergence (Optional Backup)

  Just in case your students have the opposite intuition about the gossip case, you can flip it.

  **The Setup:**
  *   **Subject (Hannah):** Low Stakes. Just curious if the bank is open. No money on the line.
  *   **Attributor (John):** High Stakes Context. John is a epistemologist giving a lecture on skepticism. He has made error possibilities salient (brain-in-a-vat, elaborate bank conspiracies).
  *   **The Ascription:** John says, *"Hannah does not know the bank is open."*

  | View | Prediction | Reason |
  | :--- | :--- | :--- |
  | **Contextualism** | **TRUE** (She doesn't know) | Attributor context is High/Stiff. Hannah fails the stiff standard. |
  | **SSI** | **FALSE** (She *does* know) | Subject stakes are Low. Hannah meets the low threshold for knowledge. |

  ### 4. Teaching Tip: How to frame the "Notational Variant" worry

  When students press you on the notational variant issue, acknowledge that they are sharp. Then, tell them:

  > "You are right that in the standard Bank Case, these theories are extensionally equivalent. They are only **intensionally** distinct. To tell them apart, we have to look at 'cross-context' ascriptions.
  >
  > Think of it like this: If I say 'It is raining,' and you say 'It is not raining,' we might just be in different locations. That's Contextualism (indexicality). But if we are standing in the same spot, and I say 'It is raining' and you say 'It is not,' one of us is wrong about the world. That's Invariantism.
  >
  > In epistemology, the 'location' is the stakes. Contextualism says the *meaning* of 'knows' moves with the speaker. SSI says the *fact* of knowledge moves with the subject. The Gossip Case forces the speaker and subject into different locations. That's where the theories fight."

  ### 5. One Caveat to Mention

  Be prepared for the "Flexible Contextualist" objection. Some sophisticated contextualists (like DeRose in later work) might try to accommodate subject stakes by arguing that the *subject's* stakes often become salient to the *attributor*, thereby shifting the attributor's context.

  **Your Counter:** That concedes the main point to SSI! If the only reason the attributor's standards rise is because they are tracking the subject's stakes, then the subject's stakes are doing the fundamental theoretical work. Pure Contextualism must maintain that the attributor's context is sovereign, regardless of the subject's situation.

  ### Summary for your Lecture Notes
  1.  **Standard Bank Case:** Both views agree (Low = True, High = False).
  2.  **The Distinction:** Contextualism = Attributor's Standards; SSI = Subject's Stakes.
  3.  **The Divergence Case:** Subject High / Attributor Low.
  4.  **The Verdict:** Contextualism says "True"; SSI says "False."
