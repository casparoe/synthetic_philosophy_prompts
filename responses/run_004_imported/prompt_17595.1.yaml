answer: |-
  You are dealing with a classic result in formal epistemology, and your friend is essentially weaponizing the **Diachronic Dutch Book Argument** (often attributed to Lewis 1999 and Teller 1973).

  As a stats PhD, you know the synchronic Dutch Book argument: if your probabilities at time $t$ don't satisfy the axioms, you can be pumped for money at time $t$. Your friend is applying the diachronic version: if your updating rule between $t_1$ and $t_2$ is not **Bayesian Conditionalization**, you can be pumped for money across time.

  Here is the breakdown of who is right, where the holes are, and why you are theoretically cornered but practically safe.

  ### 1. The Friend's Theoretical Claim (The Lewis/Teller Argument)
  Your friend is correct on the theory. The argument runs like this:
  1.  At $t_1$, you set odds on hypothesis $H$ (e.g., "Contestant X wins the season").
  2.  At $t_2$, you observe evidence $E$ (the episode airs).
  3.  You update your odds on $H$ to a new value.
  4.  If your new odds are not equal to $P_{old}(H | E)$, there exists a combination of a bet at $t_1$ and a bet at $t_2$ that guarantees you a net loss, regardless of whether $H$ is true or false.

  This is a theorem. If your updating rule is **deterministic** and **known** to the bookie, and it deviates from conditionalization, you are incoherent.

  ### 2. Your "Refuse to Precommit" Defense
  You argued: *"Fine, I just won't commit to a rule in advance. I'll decide in the moment."*

  **Is this a hole?**
  Technically, **yes**, but only in a game-theoretic sense, not a logical one.
  *   **Epistemic Security:** A Dutch Book requires the bookie to know your pricing rule *ex ante* to construct the specific combination of bets that guarantees a loss. If you keep your updating function secret, or if you genuinely randomize your updating, the bookie faces **risk**, not a **sure loss**. In poker terms, you've hidden your tell. You haven't fixed your hand, but you've made it harder for him to raise you all-in.
  *   **The "In the Moment" Fallacy:** Your friend's counter-argument ("being rational means having SOME consistent disposition") hits hard here. If you are a rational agent, your "decision in the moment" is determined by your brain state + the evidence. Even if you don't announce it, the function $f(P_{old}, E) \rightarrow P_{new}$ exists. If that function is not conditionalization, the incoherence exists objectively, even if your friend can't epistemically access it to exploit you.

  ### 3. The "Disposition" Argument & The Reflection Principle
  Your friend's strongest point is the "disposition" claim. This touches on **van Fraassen's Reflection Principle**.

  The problem isn't just that a bookie *could* exploit you if they knew your rule. The problem is that if you *know* right now that you will update non-Bayesianly later, your **current** beliefs are already incoherent.

  *   **Scenario:** You know tonight you will watch the episode. You know that if Contestant Y cries, you will irrationally drop their odds by 20% more than the evidence warrants.
  *   **The Hole:** If you know that now, you should adjust your odds *now* to account for your future irrationality. But if you do that, you aren't using your current "true" beliefs.
  *   **The Trap:** To be diachronically coherent, your current self must trust your future self to update via conditionalization. If you admit you *won't* (or might not), you violate the Reflection Principle, which implies a form of self-distrust that is itself exploitable.

  So, when your friend says "you still have a disposition," he is arguing that **ontological coherence** matters more than **epistemic secrecy**. Hiding the rule stops the *exploitation*, but it doesn't cure the *disease*.

  ### 4. Is There an Actual Escape?
  There are only two ways to actually escape the Diachronic Dutch Book, and neither is pleasant:

  1.  **True Randomization:** If your updating rule is stochastic (e.g., "I will flip a coin to decide how much to update"), a sure-loss Dutch Book cannot be constructed because the bookie cannot guarantee the second bet will be offered at the specific price needed to close the loop. However, this is generally considered irrational for a Bayesian agent (why add noise to your signal?).
  2.  **Changing the Hypothesis Space:** If you claim that the evidence $E$ changes the *meaning* of the hypothesis $H$ (conceptual change), conditionalization doesn't apply. But in a betting scenario on an elimination show, the hypotheses are usually stable ("X wins"), so this defense fails.

  ### 5. The Verdict
  **Your friend is theoretically right; you are practically right.**

  *   **Theoretically:** You are cornered. Rationality is defined by coherence, not by the ability to hide your incoherence from a specific adversary. If your disposition is non-Bayesian, you are diachronically incoherent. The "I won't tell you" move is analogous to saying "I'm not logically inconsistent because I won't show you my proof." The inconsistency is internal to your belief system, not dependent on the bookie's knowledge.
  *   **Practically:** In a casual bet with a poker friend, secrecy *does* prevent the Dutch Book. A Dutch Book is a *sure loss*. If he doesn't know your rule, he can't guarantee the loss. He can only make a +EV bet against you.

  **The PhD-level shutdown:**
  Tell him this: *"You're citing the Lewis/Teller diachronic Dutch Book. You're right that if my updating rule is deterministic and known, I must conditionalize to avoid sure loss. However, the 'Refuse to Precommit' move converts your Sure Loss into an Expected Loss scenario. You no longer have a Dutch Book; you just have a favorable bet. Unless you can read my mind (know my disposition), the theorem's premises aren't met. But fine, I'll conditionalize because I want to be coherent, not because you can beat me."*

  **Summary:** He's right about the math of rationality. You're right about the game theory of betting. But since you're in a Stats PhD program, you should probably concede on the rationality point—conditionalization is the only way to keep your temporal selves from fighting each other.

  *(One minor caveat: Ensure the "re-bet" is on the same hypothesis. If you bet on "Who gets eliminated tonight" before the show, and "Who gets eliminated next week" after the show, that's not a Dutch Book setup, that's just two different bets. The Dutch Book requires the second bet to be on the original hypothesis, updated with new info.)*
