prompt: |-
  Ok this has been living in my head rent free, need an outside opinion. In the Bayesian methods seminar in my stats PhD, we covered why your beliefs have to obey the probability axioms or a bookie can build a set of bets against you that loses money no matter what happens - fine, got that part. But this weekend a friend from undergrad who's way to into poker did a meaner version of this with our friend group's running bet on a dumb elimination show we watch, and now I can't tell if he's right or just messing with me.

  We bet on who gets eliminated before an episode airs, then re-bet right after. He says that if I tell him ahead of time exactly what rule I'll use to set my new odds once I see the episode, he can combine a bet from before with one from after so he wins no matter how it actually goes - unless my rule is "new odds = old odds, but conditional on whatever happened" (his words). Fine, I said, then I just won't commit to a rule in advance, I'll decide in the moment. He says that's not a real way out, since being rational means having SOME consistent disposition whether you announce it or not, and he could still exploit that in principle, I'd just be harder to read. Is there an actual hole in his argument, especially the "just refuse to precommit" move, or am I actually cornered?
