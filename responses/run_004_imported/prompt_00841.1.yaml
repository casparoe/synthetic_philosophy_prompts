  This has been bugging me for weeks. There's a shared stairwell in my office building that like four different companies use, and a light on one of the landings burned out about a month ago. Everyone who used those stairs saw it was out, me included, but nobody called the building manager cause it felt like someone else's job to notice it. Last week a delivery guy missed a step in the dark and broke his ankle pretty bad, and now our office is worried about getting pulled into a lawsuit over it. My boss keeps saying we're fine because we didn't DO anything, we just didn't happen to report a light that wasn't even ours to begin with. Kinda makes sense when he puts it that way, but it also feels like a cop out, cause if a bunch of people all just not doing something is what let this guy get hurt, then somebody's not-doing-something has to count as actually causing it, right? But then I get stuck trying to figure out whose not-doing-something we're even supposed to blame, since none of the four companies did anything different from each other. Is my boss right that not fixing something can't really make you responsible for what happens, or is that just a convenient way for him to look at it?
