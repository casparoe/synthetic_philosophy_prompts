          *   *Relevance:* The user asks for a *principled* answer, not necessarily a legal one, but legal principles often reflect ethical ones (e.g., "reasonable use" vs. "nuisance").

      *   **Approach 4: The Circularity Critique (Procedural Justice).**
          *   *Idea:* The preliminary vote was illegitimate. You cannot define the electorate by the electorate itself when the definition is the dispute.
