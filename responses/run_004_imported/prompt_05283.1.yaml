prompt: |-
  I volunteer with our county's urban search-and-rescue squad, and I'm on the committee rewriting the triage section of our field guide - the part covering what a team does when it can't physically reach everyone before a structure fails. Here's the case we can't agree on: after a collapse, two pockets of survivors turn up, equally reachable, equally stable, equally likely to die if we're not through in 20 minutes, and there's only time to cut through to one. Pocket A has 1 person, Pocket B has 5. Half the committee wants the rule to just be "always take the bigger number, end of story." The rest of us keep getting stuck on something I read once, that the numbers shouldn't automatically decide it, since 5 deaths aren't "5 times worse" than 1 death for any actual person - nobody loses all 5 lives, its just 5 seperate people each losing their own one life, same as whoever's stuck in Pocket A. Can you write us a short memo recommending what our default protocol should actually be, clear enough that a shift commander could use it under pressure, and that takes that objection seriously instead of just waving it away?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Urban Search-and-Rescue (USAR) squad, county level. Rewriting the triage section of the field guide.
      *   **Scenario:** Post-collapse, two survivor pockets (A: 1 person, B: 5 people). Both equally reachable, stable, and likely to die within 20 minutes if not rescued. Only time/resources to save one pocket.
      *   **Conflict:** Half the committee wants a strict utilitarian rule ("Always save the greater number"). The other half objects based on a philosophical/ethical point (individual value vs. aggregate numbers; "5 deaths aren't 5x worse for any *one* person").
      *   **Task:** Write a short memo recommending a default protocol.
      *   **Requirements:** Clear enough for a shift commander under pressure; must take the ethical objection seriously (not just wave it away); actionable.

  2.  **Deconstruct the Ethical Dilemma:**
      *   *Utilitarian View:* Maximize lives saved. 5 > 1. Simple, decisive, minimizes regret about "wasted potential."
      *   *The Objection (Prioritarian/Individualist View):* Saving 5 doesn't benefit the one person in Pocket A. Each person values their own life equally. Is it fair to sacrifice the one *just* because there are more others? This touches on the "Separateness of Persons" objection (often associated with John Rawls or Thomas Nagel).
      *   *Operational Reality:* In a disaster, hesitation kills. Ambiguity leads to second-guessing and trauma for responders. A protocol *must* exist.
      *   *Synthesis:* How to honor the individual value of the single victim while acknowledging the operational necessity and moral weight of saving more lives? The protocol needs to be a *default* but allow for *exceptional circumstances* without paralyzing decision-making. However, the prompt asks for a "default protocol" clear enough for pressure. A "maybe" isn't good enough for a field guide.
      *   *Resolution:* The standard ethical framework in emergency medicine and disaster response is utilitarian (greatest good for the greatest number). However, to address the objection, the memo needs to explain *why* this is the rule, acknowledging the moral cost, rather than pretending the single life doesn't matter. It validates the feeling but prioritizes the outcome.

  3.  **Determine the Recommendation:**
      *   In USAR and disaster triage (START, SALT, etc.), the standard is maximizing survival.
      *   Deviating from "save the 5" to "save the 1" (e.g., via lottery) is operationally dangerous (wastes time deciding) and generally considered unethical in public safety (duty to protect the public trust implies maximizing survival).
      *   *Decision:* The protocol should be to prioritize the greater number *as a default*, but the memo must frame it carefully. It shouldn't say "The one person doesn't matter." It should say "We accept the tragic burden of choosing the many to minimize total loss, acknowledging the equal worth of the one."
      *   *Wait, is there a middle ground?* Some ethical frameworks suggest a "weighted lottery" if numbers are close. But 5 vs 1 is significant. In a 20-minute window, flipping a coin is time wasted.
      *   *Best approach:* Stick to the utilitarian default (it's the industry standard) but write the justification to validate the dissenters' concern. The "rule" must be clear for the commander. The "memo" explains the reasoning to the committee/commanders.
      *   *Actually, looking closer at the prompt:* The user asks for a memo recommending what the *default protocol* should be. It needs to be usable by a shift commander.
      *   *Key Constraint:* "Takes that objection seriously instead of just waving it away."
      *   *Strategy:* Acknowledge the moral weight of the individual. Affirm that the decision is not about *value* of life, but about *minimizing loss*. The protocol is "Prioritize the Larger Group," but the *rationale* provided in the memo addresses the philosophical concern.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Subject, Date).
      *   **Opening:** State the purpose (Triage Protocol Recommendation).
      *   **The Recommendation:** Be direct. "Prioritize the larger group."
      *   **Addressing the Objection:** This is the crux. I need to explain that while every life is of infinite value to the individual, the *mission* is to minimize total mortality. We aren't saying the one person matters less; we are saying saving five prevents five tragedies instead of one. It's a tragic choice, not a valuation of worth.
      *   **Operational Clarity:** Why ambiguity is dangerous. Hesitation costs lives.
      *   **Commander's Guidance:** How to phrase it in the field guide.
      *   **Closing:** Reiterate support for the team's mental health (moral injury is real).

  5.  **Refining the Tone:**
      *   Needs to be professional, empathetic, authoritative, and concise.
      *   Avoid cold utilitarianism ("5 > 1"). Use language like "minimizing total loss" and "acknowledging the moral cost."
      *   Ensure the Shift Commander knows exactly what to do (Don't flip a coin. Go for the 5).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Always save the 5" too rigid?
      *   *Correction:* In a 20-minute window with equal stability/reachability, yes, it needs to be rigid. If there were other factors (e.g., the 1 is a child, the 5 are elderly), that's a different can of worms. The prompt specifies "equally... likely to die." Stick to the numbers.
      *   *Critique:* Did I address the "5 deaths aren't 5x worse" point?
      *   *Correction:* I need to explicitly mention that we recognize the *individual* loss is total for each person. The math applies to the *community impact*, not the *individual worth*.
      *   *Refinement:* Make sure the distinction between "Value of a Life" (equal) and "Outcome of a Decision" (aggregate) is clear.

  7.  **Final Polish:** Check word count and readability. Ensure the "Shift Commander" takeaway is bolded or distinct. (Decided to make the "Field Guide Language" a specific section).

  8.  **Final Output Generation:** (Matches the provided good response).
      *   Subject: Triage Protocol Recommendation – Multiple Survivor Pockets.
      *   Core argument: Equal worth, aggregate outcome.
      *   Action: Save the many.
      *   Reasoning: Minimizing total tragedy, operational decisiveness.
      *   Support: Acknowledge moral injury.

  *(Self-Correction Note: Make sure I don't sound like I'm dismissing the minority committee members. I need to validate their ethical concern as correct in principle, but impractical/untenable in this specific operational context.)*

  *Revised Plan:*
  1. Acknowledge the philosophical validity (each life is unique/irreplaceable).
  2. Explain why operational triage requires an aggregate view (mission goal).
  3. Provide the clear rule.
  4. Provide the script for the commander.
  5. Address post-incident support.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Triage Protocol Committee, County USAR Squad
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Default Protocol: Multiple Survivor Pockets

  **Purpose**
  This memo outlines the recommended default protocol for the Field Guide regarding simultaneous survivor pockets with unequal numbers (e.g., 1 vs. 5) under equal time-critical constraints.

  **The Ethical Objection**
  The committee's hesitation regarding a strict "greater number" rule is ethically sound. It is true that death is not a cumulative experience; the single individual in Pocket A loses 100% of their future, just as each individual in Pocket B does. To say "5 is greater than 1" is a mathematical statement about the *outcome*, not a moral statement about the *value* of the lives involved. We must not codify a rule that implies the single victim matters less as a human being.

  **The Operational Reality**
  However, USAR operates under a mandate to minimize total loss of life within the public trust. In a time-critical scenario (20-minute window), ambiguity is lethal. A protocol that requires commanders to weigh the "separateness of persons" in the moment invites hesitation, second-guessing, and moral paralysis. If we do not pre-commit to a decision rule, we risk losing both pockets due to delay.

  **Recommendation**
  The default protocol must be **Priority to the Larger Group.**

  This is not because the five lives are "worth more" than the one. It is because the *mission objective* is the minimization of total mortality. When forced to choose between preventing one tragedy or preventing five, the protocol dictates we prevent five. This accepts the tragic cost of the one without devaluing them.

  **Proposed Field Guide Language**
  To ensure clarity under pressure, the Field Guide should read:

  > **MULTIPLE POCKET PROTOCOL:**
  > When two or more survivor pockets are equally accessible and time-critical, and resources allow access to only one:
  > 1. **Default Action:** Prioritize the pocket with the highest number of viable survivors.
  > 2. **Rationale:** This decision minimizes total loss of life. It does not reflect a difference in the intrinsic value of individual victims.
  > 3. **Commander's Note:** Do not delay to weigh individual factors (age, identity, etc.) unless clearly defined in higher-level triage tags. Decisiveness saves the reachable; hesitation loses all.

  **Addressing Moral Injury**
  Adopting this rule acknowledges that the commander will carry the weight of the unchosen pocket. We recommend pairing this protocol with a mandatory post-incident debrief focused on moral injury. The team must understand that choosing the five was not a rejection of the one, but a fulfillment of the duty to save the maximum number possible under impossible conditions.

  **Conclusion**
  We validate the committee's ethical concern: every life is infinite. But our operational duty is to the aggregate survival of the community. A clear "Greater Number" default protects the survivors we can reach and protects the responders from the trauma of unstructured choice.

  **Action Required:** Approval to insert the proposed language into Section 4 (Triage) of the Field Guide.
