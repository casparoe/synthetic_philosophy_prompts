  7.  **Final Decision:** I will argue that double-consciousness exposes the need for a third category: **constitutive epistemic injustice**. This allows me to acknowledge the structural nature (like hermeneutical) while accounting for the ontological impact and the ambivalent "gift" of second-sight.

  *(Self-Correction during drafting)*: I should be careful not to simply say "Fricker is wrong." Fricker's work is analytic philosophy; Du Bois is sociological/phenomenological. The argument is that Du Bois's phenomenology reveals a layer Fricker's analytic categories miss. I will frame it as Du Bois *expanding* the horizon of social epistemology, showing that injustice isn't just about communication or interpretation, but about *subject-formation*.

