      *   **Key Passage:** The famous "Of Our Spiritual Strivings" excerpt regarding the "veil," "second-sight," and "double-consciousness."
      *   **The Problem:** Double-consciousness doesn't fit neatly into Fricker's two categories (testimonial injustice and hermeneutical injustice).
          *   *Testimonial:* It's not just about a specific exchange where credibility is deflated.
          *   *Hermeneutical:* It involves a gap in resources, but Du Bois frames "second-sight" as a *gift/resource*, not just a deficit. Also, it's structural/constitutive of the self, not just an interpretive hurdle.
