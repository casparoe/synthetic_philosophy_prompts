prompt: |-
  Ok, this is a slightly random request but I'm on a deadline. My friend Priya is getting married on Saturday and I'm giving the maid of honor toast. Backstory you need: Priya and her fiancé Marcus are both huge rationalist/EA-adjacent nerds, and the running joke in our friend group is that they run their whole relationship on "moral uncertainty" — whenever they hit a real disagreement, they'll actually sit down, assign credences across utilitarianism, Kantian deontology, some virtue ethics view, whatever's relevant, and try to work out the expected choiceworthiness of each option. They call it convening the "moral parliament," each theory getting votes proportional to how confident they are in it. Started as a bit in grad school, is now unironically how they picked their venue and decided to have a kid.

  Last night at the rehearsal dinner me and my friend Jae got into a whole argument about this for like an hour, because Jae's position is that the "parliament" thing doesn't actually solve anything, it just hides the problem — you can't compare choiceworthiness across two theories that dont even agree on what makes an option choiceworthy in the first place, so handing out "votes" is basically fake precision, like averaging a temperature and a distance and calling it a number. I said that's too harsh and misses what the exercise is even for, but I couldn't really win the argument, and neither of us backed down before we got shushed by the waiter.

  Anyway, now I have to actually write this toast for tomorrow, for a room where maybe a third are philosophy PhDs (who will 100% catch every reference and probably have Opinions about Jae's objection) and the rest are normal people — parents, cousins, a couple of coworkers — who just think the "moral parliament" thing is a cute quirk. Can you write me something like a 3-4 minute toast built around this that's genuinely funny and sweet, that doesn't just dodge the fact that the whole framework might be resting on something kind of shaky, but also never turns into an actual lecture on intertheoretic comparisons at my best friend's wedding? Bonus points if there's one line in there the philosophy contingent specifically will laugh at.
