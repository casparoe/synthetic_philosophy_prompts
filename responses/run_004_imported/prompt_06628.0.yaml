prompt: |-
  So this happened at a happy hour with two of my coworkers (I'm a backend dev, they're both ex-competition-math people who ended up in software too), and it turned into a whole argument about whether an AI could ever really "do math" like a person does, which somehow spiraled into a Godel thing. I couldnt totally follow it live so I wrote down the moves after, because I want to know who actually had the better point at each step, not just who "won" overall.

  (1) Nate said no computer, no matter how good, can ever fully match a human mathematician, because Godel showed that for any consistent formal system you can write down a sentence that system can't prove even though it's true -- and we can just look at it from outside and see that it's true. So he says our minds can't just be one of these systems (i.e. a program running some algorithm), because then there'd be a truth we can see that our own "program" supposedly can't.

  (2) Sofia said that only works if we already know our own math reasoning is consistent, and we don't -- people hold contradictory beliefs all the time, and nobody's ever shown the "ideal mathematician" in our heads is airtight. If we're not consistent, the whole argument falls apart, because then there's no special truth we can see that the machine can't (an inconsistent system "proves" everything, so there's no gap left to exploit).

  (3) Nate said fine, individual people mess up, but the argument's really about idealized human reasoning -- correct math, done right -- and that's presumably consistent, the same way physicists idealize a frictionless plane even though real ones have friction.

  (4) Sofia said that's exactly where it falls apart: even granting some idealized, consistent version of "you" exists, nobody -- not Nate, not anyone -- can actually write down which formal system that idealized reasoning matches. And without that you can't point to that system's specific unprovable-but-true sentence and say "look, I can see this one's true and the system can't." So all Nate's really shown is that human math isn't captured by any single formal system we've already pinned down in advance, which is way weaker than "minds aren't mechanical."

  Neither of them budged and it's been bugging me since. Can you go through this move by move and grade who's got the stronger point at each step -- not just an overall winner? Give me your answer as a JSON block first, like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, with each score from -2 (basically wrong) to 2 (basically right), then briefly explain each score after.
