answer: |-
  This is a remarkably precise reading of *On Certainty*, and you have put your finger on exactly the friction that makes the text so fertile for a novelist. The tension you perceive between the **river-bed** (dynamic, historical, geological) and the **hinge** (static, structural, functional) is not a contradiction in Wittgenstein's thought, but rather a distinction between two different *dimensions* of certainty.

  Resolving this tension is key to rendering Ines's condition without slipping into generic amnesia tropes. If you can distinguish between the *logic* of the hinge and the *history* of the river-bed, you can depict her stroke not as a loss of memory, but as a disruption of the *background conditions* that make memory possible.

  Here is a way to reconcile the images and apply them to Ines.

  ### 1. Synchronic vs. Diachronic: The Two Dimensions

  The most principled way to distinguish the fixity of the hinge from the fluidity of the river-bed is to view them as operating on different axes of time and function.

  *   **The Hinge is Synchronic (The Logic of the Moment):**
      When Wittgenstein says the hinges must stay put for the door to turn (§343), he is describing the **conditions of possibility for action right now**. For Ines to make coffee, the proposition "This is my kitchen" must function as a hinge *in this moment*. It cannot be an object of investigation while she is reaching for the mug. If she has to verify the kitchen's identity to use the kitchen, the language game of "making coffee" cannot be played. The hinge describes the *structural role* a proposition plays within a specific practice.
  *   **The River-bed is Diachronic (The History of Belief):**
      When he describes the hardening and fluidifying of propositions (§§96–99), he is describing **how certainties evolve over a lifetime or a culture**. What was once a hypothesis ("The earth is round") becomes a river-bed certainty. Conversely, a certainty can become fluid again. This explains *why* something is a hinge today, but acknowledges it might not be tomorrow.

  **The Compatibility:**
  The images are compatible because the river-bed explains the *genealogy* of the hinge. The "hard rock" of the river-bed *becomes* the "hinge" of the door. The tension arises only if we assume the hinges are metaphysically immutable. They are not. They are functionally immutable *while the game is being played*, but the game itself rests on a geological stratum that can shift.

  ### 2. How a Hinge Loosens Without Collapse

  Your central literary problem is: *How can Ines doubt her kitchen without doubting everything?* If "This is my kitchen" is a hinge, and hinges hold the system together, shouldn't a loose hinge bring the door down?

  Wittgenstein provides the answer in his distinction between **doubt** and **confusion**, and in the localized nature of language games.

  **A. Localized Shifts in the River-bed**
  Wittgenstein notes that the river-bed consists of "hard rock" and "sand" (§97). A stroke need not turn the whole bed to sand. It can cause a localized liquefaction.
  *   **For Ines:** The proposition "This is my kitchen" has shifted from *hard rock* (unconscious background) to *sand* (something that requires footing).
  *   **The Consequence:** The rest of the structure (her name, her past, the function of a mug) remains on "rock." But the specific *load-bearing path* that connects her body to this specific space has temporarily lost its friction. She isn't doubting the concept of a kitchen; she is experiencing a failure of the *application* of that certainty to her immediate sensory field.

  **B. The Difference Between Epistemic and Practical Certainty**
  Generic amnesia fiction treats certainty as *epistemic* (I lack the data to prove this is my kitchen). Wittgensteinian certainty is *practical* (I act as if this is my kitchen without proof).
  *   **Ines's Condition:** Her stroke hasn't removed the data (she recognizes the fridge). It has removed the *compulsion to act* on the certainty. The hinge hasn't broken; the *door has jammed*.
  *   **Rendering the Scene:** Do not write her thinking, "I am not sure this is my kitchen." Write her hand hesitating before the light switch. The uncertainty is in the *muscle*, not the mind. The hinge is loose because the action that usually validates the hinge (turning on the light without thought) is suddenly interrupted by a demand for verification.

  **C. Redundancy in the Structure**
  As an engineer, Ines knows that structures have redundancy. If one hinge rusts, the door may sag but not fall.
  *   **Philosophical Application:** We have multiple hinges supporting our reality. "This is my house," "I am Ines," "Objects persist when I leave the room." If "This is my kitchen" loosens, she can lean on "I am Ines" or "I live in this city." The total collapse of skepticism (the "deceiving demon") only happens if *all* hinges loosen simultaneously. Wittgenstein argues this is impossible for a functioning human (§115: "If a child asked me whether the earth was already there before my birth, I should not answer that I know nothing about it...").
  *   **Ines's Experience:** The vertigo comes from the *isolation* of the lapse. The world is solid *except* for this one square yard of linoleum. That makes it more terrifying, not less. It is a "local ontology failure."

  ### 3. Suggestions for Rendering Ines's Experience

  To avoid "amnesia fiction," you must avoid making her uncertainty sound like a question she is asking herself. In Wittgenstein's view, certainty is shown in what we *do*, not what we *say*. Therefore, the loss of certainty must be shown in what she *cannot do*.

  **1. The Breakdown of "Flow"**
  Wittgenstein writes, "My life consists in my being content to accept many things" (§14). The stroke makes Ines *unable to be content* to accept them.
  *   *Drafting idea:* Describe the smooth narrative of her morning routine fracturing. Usually, the thought "I will make tea" flows directly into the action. Now, there is a gap. In the gap, the river-bed has turned to sand. She has to manually rebuild the bridge between intention and action.

  **2. The Engineering Metaphor (Internalized)**
  Since Ines is a bridge engineer, she understands load paths. Use this.
  *   *Drafting idea:* She looks at the corner of the counter. She knows structurally it is sound. But phenomenologically, the "load" of her presence isn't transferring to the room. She feels like a point load on a beam that hasn't been calculated for it. The "hinge" isn't turning; it's grinding.

  **3. The Return of Certainty**
  How does the moment end? In amnesia fiction, memory returns like a video file loading. In a Wittgensteinian framework, certainty returns like a river re-freezing or a door clicking back into place.
  *   *Drafting idea:* It shouldn't be a realization ("Ah, I see the photo on the fridge, so this is my house"). It should be a resumption of action. She touches the cold tile. The sensation bypasses the doubt. The proposition "hardens" again not because she proved it, but because she *used* it. As Wittgenstein says, "At the foundation of well-founded belief lies belief that is not founded" (§253). She simply starts making the tea, and in the act, the certainty returns.

  ### 4. Summary of the Resolution

  To answer your specific question: **Yes, there is a principled distinction.**

  *   **Fixity within a practice (The Hinge):** This is functional. For the "making breakfast" game to work, "this is my kitchen" must be exempt from doubt.
  *   **Fixity across a lifetime (The River-bed):** This is historical. "This is my kitchen" became exempt from doubt through years of repetition (hardening), but it can become fluid again through trauma (the stroke).

  **The Literary Payoff:**
  Ines's stroke temporarily promotes a "river-bed proposition" (hard rock) into a "fluid proposition" (water). She is forced to treat a hinge *as if it were an empirical question*. This is exhausting and vertiginous. It is not that she thinks the world is fake; it is that the *mechanism of trust* has slipped a gear.

  By using the river-bed image, you can show that this certainty was built over a lifetime (it wasn't always rock). By using the hinge image, you can show that its current looseness paralyzes her specific actions without destroying her whole world. The door sticks, but the house stands.

  This approach allows you to write a phenomenology of uncertainty that is deeply philosophical without being academic, grounded in the very specific, terrifying experience of a body that no longer trusts the ground it stands on.
