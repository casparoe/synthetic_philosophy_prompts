      *   **The Core Question:** Why is Lewis's view controversial if engineers use the same formal machinery without ontological angst? Is the difference just intuition/taste, or is there a substantive distinction?
      *   **The Friend's Input:** A philosophy MA friend said they are "running together two very different notions," but couldn't explain *why it matters* given the identical formal apparatus.
