          *   *Potential Counter 1 (Fragmentation):* Traits are specific, not global. (Weak, concedes too much).
          *   *Potential Counter 2 (The "Phronimos"):* True virtue is rare. Most people aren't virtuous yet; they are in *continence* or *incontinence*. The study tests ordinary people, not the *phronimos* (practically wise person).
          *   *Potential Counter 3 (Integration):* Virtue isn't just mechanical output; it's about reasoning and emotion. A dime alters emotional state (mood), which impacts reasoning temporarily. This doesn't negate the *capacity* for virtue, just shows its fragility in the untrained.
          *   *Potential Counter 4 (Teleology):* Virtue is a developmental goal, not a descriptive baseline. The study describes *what is*, virtue ethics prescribes *what could be*.
          *   *Selection:* The strongest Aristotelian defense usually involves the distinction between "full virtue" (rare, stable) and "natural virtue" or mere habit (fragile). Also, the idea that situational factors *obscure* reasoning rather than proving traits don't exist. Let's go with the "Developmental/Rarity" argument combined with the "Integration of Emotion/Reason" argument.

  3.  **Drafting - Scene Setting:**
