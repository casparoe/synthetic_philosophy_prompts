answer: |-
  You are not being dense at all. You have put your finger on the exact hinge upon which the entire Galileo Affair turns. Your intuition is historically sound, philosophically precise, and dramatically gold.

  You are correct: In 1615, Galileo did not have a "necessary demonstration" in the Aristotelian-Scholastic sense required by the Church. He had strong *probabilistic* arguments (the phases of Venus, the moons of Jupiter, sunspots), but he lacked a causal mechanism (gravity wouldn't be defined for another 70 years) and the "smoking gun" of stellar parallax (which wouldn't be detected until 1838).

  The Cardinal doesn't need to be a villain to exploit this; he just needs to be a rigorous epistemologist. Here is how you can arm your Cardinal character to land that punch without turning him into a caricature, and how to let Galileo defend himself without looking delusional.

  ### 1. The Definition of "Demonstration"
  The core misunderstanding is semantic. When Galileo says "demonstration," he often means *mathematical coherence* and *predictive power*. When the Cardinal (channeling Bellarmine and the Scholastics) says "demonstration," he means *physical causation* that excludes all other possibilities.

  **The Cardinal's Punch:**
  The Cardinal can point out that Galileo is trying to change the rules of evidence mid-game. He is asking Scripture to yield to a standard of proof that physics hasn't actually met yet.

  > **Cardinal:** "Signor Galileo, you write that Scripture must yield to 'necessary demonstrations.' We agree. But a demonstration that convinces a mathematician is not always a demonstration that convinces a philosopher. You show us that the math works if the Earth moves. You do not show us *why* the Earth moves, nor do you explain why a stone dropped from a tower lands at its foot if the Earth is spinning beneath it. Until you can prove there is no other explanation for the tides, no other explanation for the stars, you have a hypothesis. A brilliant one. But you ask us to treat a hypothesis as a revealed truth."

  ### 2. Bellarmine's Actual Position (The "Instrumentalist" Offer)
  Cardinal Bellarmine was actually quite reasonable. In his 1615 letter to Paolo Foscarini (a Carmelite friar who supported Galileo), Bellarmine wrote something very close to what you need. He essentially said: *If* you had proof, we'd reinterpret the Bible. But you don't. So, for now, treat it as a calculation tool, not physical reality.

  This is the "Instrumentalist" vs. "Realist" debate.
  *   **Instrumentalist:** Heliocentrism is a useful math trick to calculate planetary positions.
  *   **Realist:** Heliocentrism is how the universe actually *is*.

  The Church was willing to let Galileo teach it as Instrumentalism. Galileo refused, because he knew it was Realism.

  **The Cardinal's Argument:**
  > **Cardinal:** "We are not asking you to silence your calculations. Use the Copernican system to predict the eclipses, to chart the voyages. No one will stop you. But do not ask us to declare it *true* in the flesh and blood of the world until you have removed the doubt. You ask the Word of God to retreat before a theory that you yourself admit cannot yet account for the parallax of the stars. Is it not you who are demanding we act without prudence?"

  ### 3. Galileo's Counter (The "Book of Nature")
  Galileo shouldn't look defeated here. His strength is his conviction that nature is written in mathematics. He believes that *because* the math works so perfectly, it *must* be true, even if he can't explain the mechanics yet. He is a Platonist in an Aristotelian world.

  **Galileo's Defense:**
  > **Galileo:** "Your Eminence, if I show you a clock that keeps perfect time, and I tell you there are gears inside moving in a specific pattern, does it matter if I cannot show you the gears through the casing? The perfection of the timekeeping *is* the proof of the gears. Nature does not do things in vain. The math is too clean to be a mere trick. To call it a 'hypothesis' is to say God is a liar who painted the universe to look one way while it moves another."

  ### 4. How to Stage the Scene (Through the Copyist's Eyes)
  Since your protagonist is a copyist, she is the perfect observer of this gap. She handles the papers. She sees the words "demonstration" written over and over. She might notice the anxiety beneath Galileo's confidence.

  *   **The Visual:** Galileo is passionate, perhaps physically agitated, gesturing at diagrams. The Cardinal is still, calm, holding a text (Scripture or Aristotle).
  *   **The Tension:** The tragedy is that **both men are right.** The Cardinal is right about the lack of proof *in 1615*. Galileo is right about the ultimate truth of the matter.
  *   **The Copyist's Insight:** She might realize that Galileo is bluffing slightly. He *knows* he doesn't have the parallax proof. He is betting his soul that he will find it, or that the logic is enough. She sees the Cardinal sees it too.

  **Drafting the Dialogue Beat:**

  > The Cardinal did not raise his voice. He touched the page of the letter Galileo had sent. "You say here, 'nothing physical which sense-experience sets before our eyes... ought to be called in question upon the testimony of biblical passages.' A noble sentiment. But who decides when sense-experience has become a demonstration? You? Or the consensus of the philosophers?"
  >
  > "The consensus of the philosophers is blind!" Galileo snapped. "They refuse to look through the tube."
  >
  > "And you," the Cardinal said softly, "refuse to admit that the tube shows you appearances, not causes. You see the moons of Jupiter. You see the phases of Venus. These are appearances. They fit your system. But they do not *force* your system. You ask the Church to bind itself to a ship that has not yet reached the harbor. If you are wrong, Signor Galileo, we all look foolish. If you are right... well, God can wait a little longer for His words to be reinterpreted. Can you wait a little longer for your proof?"

  ### 5. Why this makes the scene better
  If the Cardinal just says "The Pope says no," Galileo wins the argument morally and intellectually, and the reader feels frustrated by history.

  If the Cardinal says, "You haven't actually proven it yet, and you're asking us to risk the credibility of the Faith on a probability," then:
  1.  **Galileo becomes more human:** He is stubborn, perhaps arrogant, driven by a vision he can't fully justify yet.
  2.  **The Cardinal becomes formidable:** He is protecting the integrity of theological method, not just power.
  3.  **The Tragedy deepens:** It's not Good vs. Evil. It's Truth vs. Certainty. It's a new science arriving before it has the tools to prove itself, clashing with an old institution that demands proof it can't yet give.

  ### Summary for your rewrite
  You are seeing something real. Galileo *was* grading his own homework. He was declaring victory before the battle was fully won by the standards of his time.

  Let your Cardinal call him on it gently, almost regretfully. Let the Cardinal say, essentially: **"We will follow you where the proof leads, Galileo. But you must lead us with proof, not prophecy."**

  That gives your copyist protagonist a profound moment to witness: the exact moment where scientific conviction outpaces scientific evidence, and the human cost of that gap.
