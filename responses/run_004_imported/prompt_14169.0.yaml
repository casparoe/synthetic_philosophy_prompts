      *   Maintain a tone appropriate for a journalist (professional, constructive, precise).
      *   *Self-Correction during drafting:* I need to make sure I don't get *too* technical on the decision theory. Keep it focused on the journalistic representation.
      *   *Key Insight on the "Commitment" Objection:* The strongest coherence argument isn't just "you will lose money," it's "you will be selected against." If an AI can self-modify, it will remove the cyclic preference. The draft's objection ("simply commits") assumes the agent stays the same. I need to point out that distinction.

  8.  **Final Review against constraints:**
