          *   *Critique:* This is slightly conflated. Representation theorems (vNM/Savage) usually start with axioms (completeness, transitivity, independence, continuity) and prove there *exists* a utility function. They don't typically *start* with "immunity to exploitation" as the premise, though immunity is the *motivation* for the axioms. The Dutch Book Theorem specifically links probability coherence to betting behavior. The Money Pump links transitivity to choice. The leap to "immune to *both*... will behave exactly as though maximizing EU" is broadly correct in spirit (the "Coherence Theorems" cluster), but technically, the Representation Theorem does the heavy lifting on the *existence* of the utility function, while the pump/book arguments motivate the *axioms*.
