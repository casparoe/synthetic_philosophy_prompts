          *   *Counter-argument:* Proponents of coherence arguments (like Yudkowsky) anticipate this. They argue that if you value the *outcome* of the pump (ending up poorer), you should pay to avoid entering the pump. But more importantly, they argue that an agent with cyclic preferences *values* the cycle. If you can self-modify or commit, you are effectively changing your decision procedure to one that *is* coherent. A sufficiently capable AI *will* self-modify to avoid being pumped. So, saying "an agent that simply commits..." misses the point that the *capacity* to commit implies a higher-order preference structure that *is* coherent.
