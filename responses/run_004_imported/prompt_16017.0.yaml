  Hypothesis 1: Filter is behind. Civilizations are rare. Total observers like us = Low.
  Hypothesis 2: Filter is ahead. Civilizations are common, but die young. Total observers like us (who exist before dying) = High.
  Therefore, SIA favors Hypothesis 2 (Filter Ahead).
  Yes, this holds. It's the "Presumptuous Philosopher" meets "Doomsday Argument."

  Let's write.

  *Title Idea:* The Auditor's Wager. Or *The Presumptuous Save*. Let's go with *The Odds of Existence*.

  *Opening:* The hum of the collider. Vera holding the shutdown code.
  *Middle:* Julian confronting her. The math on the whiteboard.
  *Climax:* The implication of the math.
