      *(Self-Correction on Peter's Darwin point)*: Darwin called it vestigial. Modern science might update Darwin. Peter is using an appeal to authority + historical hypothesis. Helen is using modern comparative data. Empirically, Helen is stronger. Conceptually, Peter is stricter.

