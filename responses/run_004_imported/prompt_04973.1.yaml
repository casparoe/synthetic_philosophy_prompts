      *Best:* Mill is a **Liberal Socialist**, but the weight of the evidence suggests that without the socialist transformation of production, his liberal ideals of individuality remain unfulfilled. Thus, the Socialist reading captures the *substantive* core of his late thought better than the Liberal reading, which clings to an instrumental defense of property that Mill himself abandoned.

