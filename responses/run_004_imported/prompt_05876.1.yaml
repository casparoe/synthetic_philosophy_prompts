answer: |-
  Good evening, everyone. For those who don't know me, I'm Alex, Sarah's brother.

  Standing here, looking out at this room, I am struck by how much noise a wedding makes. Not just the music or the clinking of glasses, but the noise of expectations. We are told that a toast like this requires a specific architecture. There is a script. I am expected to offer evidence. I am supposed to stand here and catalogue Sarah's virtues for you, as if presenting a resume to a hiring committee. I am supposed to tell you that she is kind, that she is resilient, that she is brilliant.

  And I could do that. I have a list. It is a very long list.

  But I have decided not to read it to you.

  To do so would imply that these qualities are variables. It would suggest that there is some world, some possible context, in which Sarah might *not* be kind, or *might not* be brilliant, and that my job today is to convince you that this particular instance is a good one. That feels like a category error. It feels like standing up at a physics conference to argue that gravity, generally speaking, works.

  So instead, I want to talk about Mark.

  Mark, when you entered our family, you brought a certain amount of delightful chaos. You are a man of big gestures and loud laughter. You are the variable in the equation. And watching you over the last few years has been a lesson in observation. I have watched you walk into a room after a difficult day, shoulders tight, voice quiet. And I have watched what happens when Sarah enters that same room.

  I have watched you make coffee in the morning, not because you were asked, but because you noticed the pot was empty. I have watched you navigate disagreements with a patience that I know, from long and hard experience, is not your natural default setting. I have watched you build a life that is sturdy, and warm, and safe.

  Now, usually, this is the part of the toast where I would say that Sarah *inspired* these changes. That she *taught* you this patience.

  But that would give her too little credit.

  You didn't learn patience from her, Mark. You simply recognized that patience was the only appropriate response to her. You didn't build a safe life *for* her. You built a safe life *because* she is in it.

  There is a distinction in language between what we say, and what we must assume to be true in order for what we say to make sense. We call those assumptions the background.

  Most people are the foreground of their own lives. They are the painting. Sarah is not the painting. She is the light by which you see the painting. You do not compliment the light by describing the bulb. You compliment it by noting how clearly everything else is visible.

  So, I am not going to tell you that Sarah is loyal. I am going to tell you that when Sarah says she will be there, the concept of "not being there" ceases to have meaning. I am not going to tell you that she is loving. I am going to tell you that the temperature in this room rose three degrees when she walked down the aisle.

  I am withholding the labels, not because they are missing, but because they are redundant. To list her virtues would be to suggest they are exceptional. They are not exceptional. They are fundamental. They are the conditions under which the rest of us operate.

  Mark, you are a lucky man. But luck implies chance. And looking at the two of you, I don't see chance. I see logic. I see the inevitable result of two people who understand that the most important things in a marriage are not the things you say, but the things you don't have to.

  So, if everyone could please raise their glasses.

  I won't ask you to drink to Sarah's kindness, or her intelligence, or her grace. You already know those things. They are the air in this room.

  Instead, drink to the clarity. Drink to the fact that when we look at the future, we don't have to squint to see what matters.

  To Sarah and Mark.
