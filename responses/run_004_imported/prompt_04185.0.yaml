      *   *Mechanism:* "Magical thinking" (as critics call it) or logical correlation. If I am rational, and you are rational, and we face the same problem, we will choose the same action. Therefore, my choice *logically determines* yours.
      *   *Decision Theory:* It's often interpreted as a precursor to Timeless Decision Theory (TDT) or FDT, but Hofstadter himself was vague. He talked about "renormalizing" rationality. It feels like EDT but relies on *identity* or *logical necessity* rather than just statistical correlation.
      *   *Limitations:* Heavily relies on symmetry. "If we think alike, we act alike." What if we think *slightly* differently? What if our values differ?

  3.  **Analyze Oesterheld's ECL (Multiverse-Wide Superrationality):**
      *   *Source:* "Multiverse-wide Superrationality" (2017), CLR papers.
      *   *Core Scenario:* Agents across a large/infinite universe (multiverse). No causal contact. Different values (axiologies).
      *   *Mechanism:* Evidential correlation based on similar decision algorithms. If I cooperate, it's *evidence* that other agents with similar algorithms cooperate. I care about their outcomes (to some degree), so I cooperate.
      *   *Decision Theory:* Explicitly grounded in Evidential Decision Theory (EDT). It calculates expected utility based on conditional probabilities $P(\text{Outcome} | \text{Action})$.
      *   *Innovations:*
          *   **Asymmetry:** Handles different utility functions. I might care about paperclips, they care about smiles. We trade via "acausal trade" logic but generalized.
