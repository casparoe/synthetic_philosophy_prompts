answer: |-
  Here are ten interview questions designed for your podcast, including the required specific challenges and follow-ups. I have included brief "Host Context" notes for the follow-up questions to explain the strategic reasoning based on the guest's likely philosophical commitments.

  ### 1. The Normative Stake
  "Let's start with the motivation for your view. One of the biggest selling points of the etiological account is that it seems to save the normativity of biology. On a purely physical description, a heart that fails to pump is just a heart doing something different. But on your view, it's a *broken* heart. Is preserving this distinction between 'statistical abnormality' and 'genuine malfunction' the primary reason you stick with selected-effects, even when the history gets messy?"

  ### 2. Trait Individuation
  "Before we get to the edge cases, I want to ask about the unit of history. To say a trait was selected for a function, we have to individuate the trait. But biology is messy; genes are pleiotropic, and traits are developmentally entangled. When you trace the selection history, how do you decide where 'the heart' ends and the rest of the circulatory system begins? Does the grain of your analysis depend on how the selection pressure actually carved the lineage?"

  ### 3. The Swampman Challenge
  "This is the classic thought experiment that keeps etiological theorists up at night. Imagine a 'Swampman'—a molecule-for-molecule duplicate of a human that pops into existence via a cosmic accident. It has no evolutionary history. Strictly speaking, on your account, does Swampman have any biological functions? Does its heart *not* have the function of pumping blood because it lacks the ancestral lineage?"

  ### 4. Follow-up: The Intuition Pump
  **[Host Context:** *She will likely 'bite the bullet' and admit Swampman has no proper functions, arguing that function is inherently historical. She may distinguish between 'having a function' and 'being structured to function.'* **]**

  "If you bite the bullet and say Swampman's heart has no function, consider this: If Swampman's heart stops pumping, is it malfunctioning? If you say 'no,' it seems to sever the link between function and biological maintenance. If you say 'yes,' aren't you admitting that current structure, not history, is doing the normative work?"

  ### 5. The Problem of Novelty
  "Let's move from the imaginary to the evolutionary real. Consider the very first individual to possess a beneficial mutation—say, a slightly more efficient enzyme. At that exact moment, natural selection hasn't acted on it yet; there is no history of selection for this trait. On the selected-effects account, does this first individual possess a trait with *no function*, even if that trait is the very thing that saves its life?"

  ### 6. Follow-up: Explanatory Power
  **[Host Context:** *She will likely distinguish between an 'advantageous effect' and a 'proper function,' arguing the trait only acquires function once it spreads. She will want to protect the theory from being circular.* **]**

  "That distinction seems to save the theory, but at a cost. If a trait doesn't have a function until *after* it's been selected, then 'function' can't explain why the trait was selected in the first place. It renders the concept of function retrospective. Are you comfortable with a definition of function that is explanatorily idle regarding the origin of the adaptation?"

  ### 7. Exaptation and Feathers
  "Now consider a trait that changes jobs. Feathers are the textbook case: plausibly selected for insulation in dinosaurs long before they were useful for flight in birds. At what precise point in that lineage did the function of feathers switch from insulation to flight? Or, on your view, do feathers currently have *two* proper functions because they have two distinct selection histories?"

  ### 8. Follow-up: The Maintenance Question
  **[Host Context:** *She will likely argue that the current function is determined by what the trait is currently selected for (flight), while insulation might be a side effect or a retained function if it still contributes to fitness.* **]**

  "If flight is the current selecting pressure, does the insulation history become irrelevant? Suppose we found a bird species where feathers no longer provide insulation but are essential for flight. Would you say the insulation capacity is now a 'malfunction' if it fails, or is it simply no longer a function at all? I'm trying to pin down whether history fades as current selection takes over."

  ### 9. Artifacts and Analogies
  "Your account is often contrasted with artifact function. A screwdriver's function is to drive screws because that's what it was made for. But biological organisms aren't 'made' by an agent; they are selected by a blind process. Do you worry that importing the 'design' logic of artifacts into biology via natural selection anthropomorphizes the evolutionary process, or is the structural analogy tight enough to bear the weight?"

  ### 10. Falsification and Rivals
  "Finally, I want to talk about the competition. Robert Cummins' 'causal-role' view argues that a trait's function is simply whatever it currently contributes to the capacity of a containing system, regardless of history. This view handles Swampman and novelty easily. Is there any empirical finding or biological case study that would count as evidence *against* your etiological account and force you to adopt a causal-role view? Or is this debate ultimately settled by conceptual preference rather than biological evidence?"
