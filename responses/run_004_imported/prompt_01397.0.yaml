      *   **The Question:** How would Plato view modern psychedelic-assisted therapy (MDMA/psilocybin) with facilitators, screening, and set/setting? Is it a port of his symposium framework, or does it fail because psychedelics work differently (ego dissolution vs. boldness)?
      *   **Constraint:** Do *not* give a generic "everything in moderation" answer. Work through Plato's specific argument in the *Laws*.

