      *   **The Safeguard:** The "Lawgiver" (Noμοθέτης) establishes rules. The "Symposiarch" (Drinking Master) must be older (60+), sober, and wise. He guides the drinking to ensure it serves education (*paideia*), not just pleasure.
      *   **The Age Brackets:**
