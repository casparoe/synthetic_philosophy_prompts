      *   **The Goal:** Virtue (*aretē*), specifically the four cardinal virtues. The focus here is *sophrosyne* (temperance/self-control).
      *   **The Problem:** How do you train/test *sophrosyne*? Courage (*andreia*) is tested by fear/danger. Temperance is tested by pleasure/desire.
      *   **The Tool:** Wine (*oinos*).
