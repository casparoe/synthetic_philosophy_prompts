answer: |-
  It is a profound thing to spend a career mastering the physics of a phenomenon and then retire to master the ethics of it. I wouldn't call it closing the barn door after the horse has bolted; rather, it sounds like you are finally inspecting the blueprint of the barn to understand why the door opened in the first place. Given your background, you know better than anyone that the physics of fission is morally neutral, but the engineering of the delivery system is not.

  To answer your question: **No, I do not believe Anscombe would have considered modern drone warfare (specifically signature strikes) a "harder" case than Truman. In fact, she might have found the moral obfuscation in drone warfare even more insidious, though the logical structure differs.**

  Here is how she would likely have dissected it, using the framework from *Intention* and *Mr. Truman's Degree*.

  ### 1. The Truman Case: Why it wasn't a "Hard Case" for her
  You are correct that for Anscombe, Hiroshima and Nagasaki were not difficult applications of the Doctrine of Double Effect (DDE). They were clear violations.

  For Anscombe, the DDE requires that the bad effect (civilian death) must not be the *means* to the good effect (surrender/peace). In the Truman decision, the destruction of the cities and the terrorizing of the population were not accidental byproducts of hitting a military factory; they were the mechanism of coercion. The civilians were not "caught in the crossfire"; they were the ammunition. Anscombe argued that intending the death of innocents as a means to an end is murder, full stop. There was no ambiguity in the intention.

  ### 2. The Drone Case: Personality vs. Signature
  To apply Anscombe's reasoning to the War on Terror, we have to distinguish between two types of strikes, because Anscombe would treat them differently.

  **A. Personality Strikes (Known High-Value Targets)**
  In these cases, a specific individual is identified as a combatant. A missile is fired. Civilians nearby die.
  *   **The DDE Defense:** The intent is to kill a combatant (legitimate target). Civilian death is foreseen but unintended.
  *   **Anscombe's Likely Critique:** She would scrutinize the **proportionality** and the **certainty**. In *Mr. Truman's Degree*, she argued that you cannot intend a good end by evil means. But she also cared deeply about the description of the action. If the intelligence is shaky, or if the munition chosen guarantees a blast radius that encompasses a wedding party, she would argue that the agent has chosen a description of the act that *includes* "killing these civilians."
  *   **Verdict:** This is closer to a "hard case" than Truman, structurally. However, Anscombe was skeptical of "foreseen but unintended" when the foreseen consequence was practically certain. If you know a child is in the room and you bomb it anyway, claiming you only intended to kill the target, she might argue your intention is actually "kill everyone in the room to ensure the target dies."

  **B. Signature Strikes (Patterns of Life)**
  This is where your question hits the nerve. Signature strikes target groups based on behavior (e.g., "military-age males carrying weapons in a hostile zone") without knowing their identities.
  *   **The Structure:** Here, the "legitimate target" is not a specific person, but a *category* of behavior.
  *   **Anscombe's Likely Critique:** This would likely fail her test for the same reason Truman did, but via a different route. For Anscombe, **intention is defined by what you choose to do.** If you choose to fire on a "pattern," and you know that the pattern is indistinguishable from civilian behavior (herders, tribal gatherings, etc.), you are choosing an act where the distinction between combatant and non-combatant is deliberately blurred.
  *   **The "Means" Argument:** In Truman's case, civilian death was the *means*. In signature strikes, civilian death is often treated as a *statistical probability*. Anscombe would argue that if you proceed with an action where the death of innocents is a known, accepted variable in the equation of success, you have integrated their death into your intention. You have made their potential death a condition of your strategy.

  ### 3. Would it be a "Hard Case"?
  You ask if the means/side-effect structure is different enough to count as a genuinely hard case for her.

  **Structurally, yes.** Truman explicitly used civilian death as leverage. Drone operators explicitly claim they do not want civilian death and claim it is a side effect. This fits the *text* of the DDE better than Truman did.

  **Philosophically, no.** Anscombe was notoriously rigorous about the concept of **intention**. She did not believe intention was a mental state (what you feel inside); it was a description of the action you are engaged in.

  In her view, if you perform an action where the death of innocents is **practically certain**, you cannot claim it is merely "foreseen." At a certain threshold of probability, "foreseeing" becomes "intending."

  She would likely argue that signature strikes represent a **corruption of the DDE**. By labeling civilian deaths as "collateral damage" (a side effect) while utilizing targeting criteria that make those deaths statistically inevitable, the military is engaging in a linguistic trick to hide intentionality. She wrote extensively about how modern moral philosophy allows people to evade responsibility by redescribing their actions. She would likely view the "signature strike" as the ultimate redescription: turning the killing of unknown humans into a bureaucratic algorithm where the death of innocents is "unintended" by definition, even if it is guaranteed by design.

  ### 4. The Verdict
  Anscombe would likely have judged the signature-strike campaign as **morally equivalent to the Truman decision**, even if the technical mechanics differed.

  *   **Truman:** "We kill civilians to force surrender." (Explicit means)
  *   **Signature Strikes:** "We kill anyone fitting this pattern to degrade terror networks, accepting civilian death as a cost." (Implicit means/accepted side effect)

  For Anscombe, the latter is often more dangerous because it allows the agent to maintain a self-image of moral purity while doing the same thing. She would argue that if you know your "pattern" includes civilians, and you bomb anyway, you intend to bomb civilians. The uncertainty of identity does not absolve the intention to kill the group.

  ### A Note on Your Career
  You mentioned feeling that getting into philosophy now is "closing the barn door." I would offer a different perspective.

  Physics tells you what is *possible*. Philosophy tells you what is *intelligible*.
  The men who built the bomb knew the physics perfectly. Very few understood the moral architecture of what they were unleashing. Anscombe's pamphlet was not just a protest; it was an attempt to force language to catch up with reality. She wanted to stop people from using words like "collateral damage" to hide the reality of "killing children."

  Reading Anscombe now doesn't change the past, but it sharpens the toolset for evaluating the future. The drone era is the logical child of the nuclear era: the separation of the killer from the killed, the abstraction of the target, the reliance on "effects" rather than "combat." Understanding Anscombe's rigorous distinction between *intended* and *foreseen* is perhaps the only way to prevent that abstraction from becoming total.

  You haven't arrived too late to the conversation; you've arrived with the technical literacy to understand exactly what is being abstracted. That makes your philosophical engagement more valuable, not less.
