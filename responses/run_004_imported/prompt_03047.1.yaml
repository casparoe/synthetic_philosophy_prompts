          *   *Standard View:* If $G'$ leads to \$50, and $G$ *would have* led to No Deal, yes. But what if $G$ would have led to \$50 anyway? Then $G'$ might be worse or neutral. We don't know.
          *   *SPI View:* We modify the instructions (e.g., "Simulate the conflict costlessly").
