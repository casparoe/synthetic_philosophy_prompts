prompt: |-
  I'm taking a philosophy of ethics class right now and we've been reading Taurek's "Should the Numbers Count?" -- honestly it's been pretty confusing to work through. I get that he's arguing against the intuition that you should always save the greater number of people, but there's this whole middle section of his paper that I keep getting tripped up on. It's the part where he's talking about David, the friend, and trying to work out whether personal attachments can override utilitarian logic. There's this stretch around pages 296–297 where Taurek is spelling out a really intricate argument about what makes it "morally permissible" for him to save David, and then a later section (around pages 304–305) where he rejects making impersonal judgments about whose death would be worse, and I'm having trouble seeing how the two parts fit together.

  In the David part he says "it is not clear to me how it is to make a difference in the view of those who think that, apart from it, I would have a moral obligation to save the five..." (the "it" being that David is his friend), and then in the later section he flat-out says "I do not wish to say in this situation that it is or would be a worse thing were these five persons to die and David to live."

  I'm getting confused on a few things: (1) What's Taurek actually trying to establish with the distinction between personal preference and moral obligation? (2) He seems to be rejecting the idea of "impersonal evaluative judgments" — can you help me understand exactly what he means by that and why he's rejecting it? And (3) how does the David example fit into his larger argument about whether numbers should count? Like, what's the logical move here?

  Thanks in advance! It's a pretty tough paper.
