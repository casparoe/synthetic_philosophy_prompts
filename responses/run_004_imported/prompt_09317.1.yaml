prompt: |-
  So I had this whole argument with my friend last night about moral testimony and I lost, so now I want ammo for round two. Her go-to example was that 'I think factory farming is wrong because my ethics professor told me so' feels like a cop-out in a way that 'I think this bridge is safe because my engineer friend told me so' doesn't, and honestly I couldn't explain why that should be true even though it felt true to me too. I want you to make the hard case for the opposite: that there's no principled asymmetry between moral testimony and other kinds of testimony, and that the discomfort people feel is smuggling in something extra rather than tracking a real epistemic difference. Don't just assert that though -- actually take down her three best moves: that testimony can give you a true moral belief without any real moral understanding of why its true, that acting rightly on someone else's say-so doesn't count as acting well or virtuously even when you land on the correct answer, and that outsourcing your moral judgement gives up your autonomy as an agent in a way that outsourcing your judgement about bridges doesn't. Deal with each one head-on instead of talking around it, and land on a clear verdict instead of 'more research needed.'
