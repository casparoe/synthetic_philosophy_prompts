answer: |-
  Here is the ammo you need. Your friend's position relies on what philosophers call "Pessimism about Moral Testimony." It's an intuitive view, but it crumbles when you press on the mechanics of how we actually acquire knowledge and agency.

  The core of your counter-argument is this: **The discomfort your friend feels isn't about the *structure* of testimony (how we know things); it's about the *stakes* of morality (how much we care).** When you strip away the emotional weight, moral testimony functions exactly like factual testimony.

  Here is how you dismantle her three specific moves.

  ### 1. The "Understanding" Objection
  **Her Claim:** Testimony can give you a true moral belief without moral understanding (knowing *why* it's wrong), whereas factual testimony (like the bridge) doesn't suffer from this deficit in the same way.

  **Your Counter:** This is a double standard. Factual testimony *also* gives you belief without understanding, yet we accept it as knowledge.

  When your engineer friend says, "This bridge is safe," do you understand the load-bearing calculations? Do you understand the tensile strength of the steel or the soil composition of the riverbed? No. You have a true belief based on authority, just like the ethics student. If "lack of understanding" disqualifies the moral belief from counting as knowledge, it must also disqualify the engineering belief.

  Your friend is likely smuggling in the idea that moral truths *require* personal grasp to be actionable in a way physical truths don't. But why? In both cases, you are deferring to a cognitive specialist.
  *   **The Knockout:** If you insist that you must understand the *reasons* to truly know a moral fact, you must apply that to the bridge. If you can't check the math, you don't *really* know the bridge is safe; you just believe it. Since we accept that you can "know" the bridge is safe without doing the math, you must accept you can "know" factory farming is wrong without deriving the ethical calculus yourself. The epistemic mechanism is identical: **Trust in expertise.**

  ### 2. The "Moral Worth" Objection
  **Her Claim:** Acting rightly on someone else's say-so doesn't count as acting well or virtuously, even if you land on the correct answer. (i.e., Don't factory farm because your professor said so, not because *you* grasp the wrongness).

  **Your Counter:** She is conflating the **rightness of the act** with the **praiseworthiness of the agent**.

  Yes, the person who refrains from factory farming because they understand the suffering might be *more* virtuous than the person who does it just because a professor said so. But that doesn't make the second person's action *wrong*, nor does it make their belief invalid.
  *   **The Learning Curve:** We don't demand full understanding from moral novices. If a child stops hitting their sibling because a parent said "that's wrong," we don't say the child acted badly. We say they are in the process of moral development. Testimony is the scaffold for moral growth.
  *   **The Virtue of Trust:** Furthermore, recognizing your own limitations and deferring to a more reasoned expert is *itself* a virtue (intellectual humility). If you are unsure about bioethics and defer to a bioethicist, you are acting responsibly.
  *   **The Knockout:** Even if we grant that "blind" moral adherence is less praiseworthy than "enlightened" adherence, that is a psychological critique of the agent, not an epistemic critique of the testimony. It doesn't prove the testimony is unreliable. You can do the *right thing* for the *second-best reason*. The bridge builder doesn't need to be a hero to build a safe bridge; the moral agent doesn't need to be a saint to do the right thing.

  ### 3. The "Autonomy" Objection
  **Her Claim:** Outsourcing your moral judgment gives up your autonomy as an agent in a way that outsourcing judgment about bridges doesn't. Morality is "up to you"; engineering is not.

  **Your Counter:** This relies on a fantasy of autonomy that doesn't exist in the real world. Autonomy is not about generating all your own reasons from scratch; it is about **governing which sources you trust.**

  *   **Epistemic Labor:** We outsource autonomy constantly in high-stakes factual domains. When a doctor tells you to take a specific drug, you are outsourcing a life-or-death judgment. When a lawyer tells you to sign a document, you are outsourcing a legal judgment. We don't call this a loss of autonomy; we call it **rational division of labor.**
  *   **The Moral Domain:** Why is morality exempt from the division of labor? If anything, moral questions are often *more* complex than factual ones. To insist on generating your own moral reasons for every issue is not "autonomy"; it's reinventing the wheel.
  *   **The Knockout:** Choosing to trust an ethics professor is an **autonomous act.** You evaluated the source, weighed the testimony, and integrated it into your worldview. That is the exercise of agency, not the surrender of it. If you refused to listen to the engineer about the bridge because "I need to decide for myself if it's safe," we wouldn't call you autonomous; we'd call you reckless. The same applies to morality.

  ### The Verdict

  Your friend's intuition feels right because morality feels *personal*. But "feeling personal" is not an epistemic argument.

  **The Verdict:** There is **no principled asymmetry** between moral and non-moral testimony.
  1.  **Epistemically:** Both transmit knowledge without necessarily transmitting full understanding.
  2.  **Ethically:** Both allow for right action even if the agent's virtue is still developing.
  3.  **Politically:** Both rely on a rational division of cognitive labor that preserves autonomy through the *choice* of whom to trust.

  The discomfort your friend feels is not because moral testimony is defective; it's because she is conflating **knowing the good** with **being a good person.** You can use testimony to achieve the first, which is all that is required for the belief to be rational. Tell her she's demanding moral sainthood as a price for basic knowledge, and that's a tax she doesn't pay in any other area of life.
