answer: |-
  Good evening. For those who don't know me, I write about science. I was asked to give this toast because [Bride] believes that if I can make quantum field theory sound interesting to a stranger, I can make G. E. Moore sound bearable to her uncle at table six.

  [Bride], I read the paper. I know the stakes.

  For the rest of you, [Bride] is finishing a doctorate on the early 20th-century philosopher G. E. Moore. Specifically, on the final chapter of *Principia Ethica*, called "The Ideal." Moore argued that there are two greatest goods human beings can imagine. The first is personal affection. The second is the contemplation of beautiful things.

  He also argued for something called "organic unities." This is the idea that a whole can be worth far more than the sum of its parts. And, perhaps most famously, he argued that even a beautiful world that nobody will ever see is better than an ugly one that nobody will ever see.

  Now, if you look at the couple seated before us, you will see that Moore's philosophy has essentially manifest as a division of labor. [Bride] gets personal affection; [Groom], as an art historian, gets the beautiful objects. Moore would have been thrilled. He was, by all accounts, notably cool toward ordinary romantic passion. He reserved his real enthusiasm for a contemplative admiration of a person's character.

  In fact, [Bride] has written a paper arguing that Moore's ideal smuggles a curiously thin, bloodless theory of romantic love inside its much richer theory of personal affection. She is correct. Moore was not the man to ask about spark, or heat, or the chaos of desire.

  And yet.

  There is a reason we are here, and it isn't because of Moore's coldness. It is because his structure accidentally describes exactly what is happening between these two.

  Moore was suspicious of passion because passion is fleeting. But admiration of character? That is durable. That is the stuff that survives a Tuesday night when the dishes are piled up and the heating is broken. In choosing each other, [Bride] and [Groom] have not just combined their goods; they have created an organic unity. They are no longer "Philosopher plus Art Historian." They are a new compound, where the value of the union exceeds the value of the individuals standing alone.

  Moore also said a beautiful world unseen is better than an ugly one. But I think he missed something. A beautiful world *built* is better than one merely contemplated. [Groom] knows how to look at beauty. [Bride] knows how to evaluate the good. Together, they are not just going to observe a life; they are going to construct one.

  I was warned not to offer up warm, contented feeling without the "true perception and appropriate emotion" that Moore thought had to come together before any of it counted for anything. So I will not simply say "I am happy for you." That is too vague.

  Instead, I will say this: May you always have the true perception to see each other clearly, not as you wish the other to be, but as they are. And may you always have the appropriate emotion to meet that reality with kindness, with wit, and with that specific, contemplative admiration that Moore thought was the highest good, even if he didn't quite know how to feel it himself.

  Moore thought the ideal state of mind was combining affection with the contemplation of beauty. Looking at the two of you today, I think we can finally say he got it right.

  Please raise your glasses. To [Bride] and [Groom]. To the organic unity. And to the beautiful world you will build together, in full sight of us all.
