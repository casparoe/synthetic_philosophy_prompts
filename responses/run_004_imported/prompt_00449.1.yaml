      *   Safe Interruptibility (Orseau/Armstrong) mostly deals with the agent not learning to *avoid* the state where interruption happens (e.g., hiding in a corner so you can't turn it off).
      *   Corrigibility (Soares/Yudkowsky) deals with the agent not *influencing the probability* of interruption itself (e.g., convincing you that turning it off is bad, or building a sub-agent that can't be turned off).
      *   *Self-Correction:* Corrigibility includes allowing changes to the *goal*, not just the off-switch. Interruptibility is mostly about the off-switch.

