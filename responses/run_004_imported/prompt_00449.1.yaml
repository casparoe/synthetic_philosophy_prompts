          *   Safe Interruptibility: Narrow, RL-specific. About the *learning dynamics* under interruption.
      *   **The "Under the Hood" Mechanism:**
          *   Corrigibility: Requires specific utility function engineering (e.g., utility indifference, counterfactual reasoning). The AI must *want* to be corrected.
          *   Safe Interruptibility: Requires modifying the learning algorithm (e.g., ignoring interruption data in the update rule, or ensuring the interruption doesn't bias the Q-values). The AI must *not learn* to game the interrupt button.
      *   **Incentives:**
          *   Corrigibility: Actively removes incentives to manipulate.
          *   Safe Interruptibility: Passively ensures interruptions don't distort optimization.
      *   **Implication (Does one imply the other?):**
