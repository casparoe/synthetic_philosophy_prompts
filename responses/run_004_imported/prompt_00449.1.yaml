      *   *Corrigibility:* Coined by Soares, Fallenstein, Yudkowsky, et al. (2015). It's about an AI allowing itself to be modified or shut down *without* resisting or manipulating. It's a broad property of the agent's utility function/decision theory. Key aspect: The AI shouldn't have an incentive to prevent correction or to manipulate the operators into not correcting it.
      *   *Safe Interruptibility:* Coined by Orseau and Armstrong (2016). It's a specific formal property regarding reinforcement learning (RL) agents. It focuses on whether an agent learns to avoid or seek interruption during the learning process. Key aspect: The agent's policy should converge to the same optimal policy regardless of whether interruptions occur.
      *   *Relationship:* They are related but distinct. Corrigibility is broader (philosophical/decision-theoretic), while Safe Interruptibility is narrower (technical/RL-specific). Safe interruptibility is often seen as a *subset* or a *necessary condition* for corrigibility, but not sufficient.

  3.  **Drafting the Comparison - Key Dimensions:**

      *   **Definition/Scope:**
