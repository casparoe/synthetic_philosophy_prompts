      *   **Move 5 (Theo):** Attacks "Resolute Choice." Being resolute means violating your current preference (Trade 1 looks good *now*). Ignoring current desire for a past plan is irrational (dynamic inconsistency).
          *   *Assessment:* This is the classic debate between *Separability* (only current state matters) and *Planning* (entire tree matters). Theo argues for Separability. If $W_1 \succ W_0$ right now, refusing it is irrational. Alina argues for Planning.
