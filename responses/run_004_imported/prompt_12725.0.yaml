prompt: |-
  So I've been falling down a rabbit hole on Karl Popper and evolution for a piece I'm working on. Everyone remembers him for falsifiability, but fewer people know he spent years arguing that Darwinian natural selection isnt really a testable theory at all -- more of a "metaphysical research programme," since "survival of the fittest" starts to look tautological once you notice fitness usually just gets defined as whatever happens to survive and reproduce. Then later in life he apparently recanted, saying he'd changed his mind about whether natural selection is testable after all.

  Can you write me an essay on this that actually weighs both sides -- the tautology worry, and the various fixes people have proposed (like defining fitness independently of actual survival) -- and then picks a side instead of doing the wishy-washy "both have a point" thing? I want an actual verdict: was Popper's original instinct basically right, with the circularity problem still quietly haunting evolutionary theory today, or did the recantation get it right? Back up whichever you pick.
