answer: |-
  **Setting:** *A quiet corner of a university library, late afternoon. Two graduate students, Elena and Marcus, are surrounded by stacks of papers on decision theory.*

  **Elena:** Let's go back to the moment of the trade. You have item A. The exploiter offers you C plus a penny. Your current, occurrent preference ranking is $C \succ A$. If you are resolute, you say "no." But by what metric is that "no" rational? At that exact second, you are turning down something you explicitly prefer.

  **Marcus:** I'm not turning down what I prefer. I'm prioritizing the preference I hold for the *trajectory* over the preference I hold for the *immediate swap*.

  **Elena:** But that sounds like a category error. Preferences rank outcomes or acts *available now*. When you stand at the node where you can trade A for C, the "trajectory" isn't an option. The option is "Keep A" or "Take C." If you keep A while preferring C, aren't you just describing akrasia? You're saying rationality is successfully acting against your current strongest desire.

  **Marcus:** Only if you assume the "current strongest desire" is the only legitimate sovereign. Look, if I slice time into infinitesimal moments, and say rationality is maximizing utility at *each* slice independently, then yes, resolution looks like madness. It looks like a past self binding a future self for no reason. But why accept that slicing?

  **Elena:** Because the future self is the one who has to execute the action! The past self is gone. If my rationality at $t_2$ requires me to ignore my preferences at $t_2$ to satisfy the preferences of the ghost at $t_1$, haven't I just relocated the irrationality? Before, I was dynamically inconsistent. Now, I'm locally irrational to maintain global consistency. Why is the second one better?

  **Marcus:** Because the second one avoids the sure loss. The money pump doesn't just say "you're inconsistent"; it says "you are guaranteed to end up worse off by your own lights." The resolute chooser avoids that. You're worried that I'm violating the principle of *separability*—that choices should depend only on the current node. I'm saying separability is the problem.

  **Elena:** Separability is what prevents magic. It prevents me from making decisions based on sunk costs or ghosts. If I refuse the trade at $t_2$, I must have some preference at $t_2$ that justifies it. If that preference is "I want to honor my plan," fine. But then your preferences aren't cyclic anymore, are they? At $t_2$, you prefer "Keeping A as part of Plan 1" over "Taking C as part of Drifting."

  **Marcus:** Exactly.

  **Elena:** Wait. If you admit that, you've conceded my point. You've changed the description of the options to force transitivity. You're not really keeping the cyclic preferences $A \succ B \succ C \succ A$. You've smuggled in a new preference for "Resoluteness" that breaks the cycle. The money pump argument wins because to avoid it, you have to abandon the pure cyclic ranking.

  **Marcus:** No, that's the sophisticated chooser's move, not the resolute one. The sophisticated chooser modifies their expectations to avoid the pump. The resolute chooser keeps the cyclic preferences over the outcomes but adopts a different *decision rule*. I still prefer C to A in isolation. But I prefer the *policy* of sticking to A over the *policy* of maximizing locally.

  **Elena:** But who is the "I" that holds the policy preference? If it's the $t_1$ self, why does the $t_2$ self care? If it's the $t_2$ self, then at $t_2$, the preference for the policy outweighs the preference for C. Which means, at $t_2$, you don't actually prefer C to A *all-things-considered*.

  **Marcus:** You're insisting on "all-things-considered" being defined by the immediate impulse. I'm defining it by the extended agency. Think of it this way: If you say resolution is just relocated irrationality, you're implying that a sequence of locally rational choices that leads to a guaranteed loss is *better* than a locally "irrational" choice that secures a gain.

  **Elena:** I'm implying that a sequence of locally rational choices is the only thing that *counts* as rationality. If the sum of rational steps leads to a loss, then the structure of the world is hostile, not the agent. But if the agent has to tie their own hands to survive the structure, the tie is an admission that their preferences are flawed.

  **Marcus:** Or it's an admission that the *unit* of rationality is the life, not the moment. You're treating the agent as a sequence of temporal slices passing a baton. If slice $t_2$ drops the baton because it looks heavy, slice $t_2$ was rational in isolation, but the team lost the race. Resolute choice says the team matters more than the runner.

  **Elena:** But the team is a metaphor. Only the runner exists. When the runner refuses to pass the baton, or refuses to run the leg, that's a failure of the runner. You're asking me to call that success. It feels like you're defining rationality as "whatever avoids the money pump," rather than "whatever aligns action with current preference."

  **Marcus:** And you're defining rationality as "alignment with current preference," even if that guarantees you get pumped. Look, if I have to choose between a theory of agency that says I'm rational when I lose money for sure, and one that says I'm rational when I bind myself to win, I'll bind myself. If that means "preference" isn't just a snapshot impulse, so be it.

  **Elena:** So we're at the metaphysical crux. You think the relocation of the constraint is a feature; I think it's a bug. You say I'm fetishizing the moment. I say you're fetishizing the narrative.

  **Marcus:** Perhaps. But tell me: if you met someone who let themselves be money-pumped every day, would you advise them to fix their preferences, or to learn to keep a promise to themselves?

  **Elena:** *Pauses.* I'd tell them their preferences are costing them money. Fix the preferences.

  **Marcus:** And I'd tell them their fragmentation is costing them money. Fix the agency.

  **Elena:** Then I suppose we agree on the loss, and disagree on the locus of the sin.

  **Marcus:** Agreed. Though I'd argue the one who ends up poorer is the one who sinned more.

  **Elena:** *Smiles.* Careful, Marcus. That sounds like a consequence-based argument. I thought you were defending policy.

  **Marcus:** Touché. But even a resolute chooser knows when they've run out of pennies.
