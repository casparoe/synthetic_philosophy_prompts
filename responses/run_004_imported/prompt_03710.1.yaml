answer: |-
  The debate between John Harsanyi's Aggregation Theorem (1955) and Peter Diamond's rejoinder (1967) is often framed as a stalemate between the mathematical elegance of utilitarianism and the moral necessity of fairness. Harsanyi demonstrated that if a social planner and all individuals satisfy the von Neumann-Morgenstern (vNM) axioms of expected utility, and the planner respects the Pareto principle, social welfare must be a linear weighted sum of individual utilities. Diamond countered that this linearity forces the planner to be indifferent between a deterministic allocation of an indivisible good and a random lottery (coin flip) between recipients, provided the planner is initially indifferent between the certain recipients. Diamond argued this ignores the intrinsic value of *ex post* fairness—the moral superiority of giving everyone a chance.

  The standard moral drawn from this dispute is that Harsanyi's framework is too rigid to accommodate non-welfarist values like fairness without violating the expected utility axioms. I argue that this moral is mistaken. Diamond's example reveals no defect in Harsanyi's theorem or the utilitarian conclusion it supports. Rather, it exposes a mis-specification of the *domain* of individual utility. The intuitive appeal of the coin flip does not require a freestanding social fairness value that violates linearity; it is better understood as a demand that risk attitudes and inequality aversion regarding *procedural treatment* be built into the individual utility functions themselves. When individual utilities are correctly specified to include the value of fair treatment, Harsanyi's linear aggregation naturally prescribes the coin flip, preserving both the theorem's rigor and the utilitarian commitment to individual welfare.

  ### 1. The Formal Conflict: Linearity vs. Fairness

  To understand why Diamond's objection fails to undermine Harsanyi, we must first formalize the conflict. Harsanyi's theorem posits a social welfare function $W$ and individual utility functions $U_i$ defined over a set of prospects $X$. If the planner and individuals are vNM maximizers, and the planner satisfies the Pareto principle (if all $U_i$ prefer $x$ to $y$, then $W$ prefers $x$ to $y$), then:
  $$ W(x) = \sum_{i=1}^n a_i U_i(x) $$
  where $a_i \geq 0$. This linearity implies that the social evaluation of a lottery is the lottery of the social evaluations.

  Diamond's counterexample involves two individuals (A and B) and one indivisible good.
  1.  **Option 1 (Certain A):** A gets the good. $U_A = 1, U_B = 0$.
  2.  **Option 2 (Certain B):** B gets the good. $U_A = 0, U_B = 1$.
  3.  **Option 3 (Flip):** 50% chance of Option 1, 50% chance of Option 2.

  Assume symmetry ($a_A = a_B$). The planner is indifferent between Option 1 and Option 2 ($W=0.5$). By Harsanyi's linearity, the value of the Flip is the expected value of the certain outcomes:
  $$ W(\text{Flip}) = 0.5 W(\text{Certain A}) + 0.5 W(\text{Certain B}) = 0.5 $$
  Thus, Harsanyi's planner is indifferent between giving the good to A outright and flipping a coin. Diamond argues this is absurd: the Flip is superior because it treats A and B equally *ex ante*, respecting their equal moral standing. He concludes that the SWF must be strictly concave in utilities (prioritarian or egalitarian) to value the "spread" of chances, violating Harsanyi's linearity.

  ### 2. The Individuation of Outcomes

  The flaw in Diamond's critique lies in the description of the "outcomes" over which utilities are defined. Harsanyi's theorem operates on *consequences*. In Diamond's formulation, the consequences are thinly described as "who receives the good." Under this description, $U_B(\text{Lose}) = 0$ regardless of whether the loss resulted from a deterministic choice or a fair lottery.

  However, rational agents typically care about more than material allocation; they care about *how* that allocation was determined. "Being treated fairly" or "being given a dignified chance" is a psychological and social good, just as consumption is. If we expand the domain of consequences to include the *procedure*, the utility functions change.

  Let the outcome be a pair $(c, p)$, where $c$ is consumption and $p$ is the procedure.
  *   In **Certain A**, B's outcome is $(0, \text{Arbitrary Exclusion})$.
  *   In **Flip (Lose)**, B's outcome is $(0, \text{Fair Lottery})$.

  It is empirically and rationally plausible that $U_B(0, \text{Fair Lottery}) > U_B(0, \text{Arbitrary Exclusion})$. The "dignity of a chance" has positive utility, and the "stigma of arbitrary exclusion" has negative utility. If we incorporate this into the individual utility functions:
  *   $U_B(\text{Certain A}) = 0 - \delta$ (where $\delta > 0$ is the disutility of unfairness).
  *   $E[U_B](\text{Flip}) = 0.5(1) + 0.5(0) = 0.5$ (Assuming the winner feels no guilt and the loser feels no stigma in a fair flip).

  Now, calculate the Social Welfare:
  *   $W(\text{Certain A}) = a_A(1) + a_B(-\delta) = 1 - \delta$ (assuming $a_A=a_B=1$).
  *   $W(\text{Flip}) = 0.5(1) + 0.5(1) = 1$.

  Here, $W(\text{Flip}) > W(\text{Certain A})$. Harsanyi's linear aggregator now prefers the coin flip. The theorem was not violated; the input variables were merely under-specified. Diamond's intuition that the flip is better is captured entirely within the individual utility functions, rendering a non-linear SWF unnecessary.

  ### 3. Risk and Inequality Aversion as Individual Preferences

  The prompt suggests addressing whether the appeal of the coin flip is a demand for risk- or inequality-aversion to be built into $U_i$. This is precisely the mechanism by which Harsanyi's framework absorbs Diamond's critique without collapsing.

  **Risk Aversion over Social States:**
  Standard vNM utility functions already capture risk aversion over private consumption. However, individuals may also be risk-averse over *social states* or *relative standing*. If individuals derive utility from living in a society that minimizes arbitrary variance in treatment, this preference can be encoded in $U_i$.
  If A and B are "inequality-averse" regarding *opportunities*, they prefer a distribution of probabilities $(0.5, 0.5)$ to $(1, 0)$. In Diamond's setup, this preference must manifest as a higher valuation of the lottery state itself. If $U_i$ represents the individual's rational preference ordering over all prospects, and the individual prefers the prospect of a fair lottery to the prospect of arbitrary exclusion, then $U_i(\text{Flip}) > U_i(\text{Certain})$. Harsanyi's theorem sums these preferences. If the individuals value the fairness of the chance, the Utilitarian sum will value it too.

  **The "Ex Post" Illusion:**
  Diamond argues that Harsanyi ignores *ex post* fairness (the realized inequality). In the Flip, the *ex post* outcome is still unequal (one has the good, one does not). If individuals cared *only* about *ex post* inequality, they would be indifferent between the Flip and Certain A, as the realized inequality is identical in both (one winner, one loser).
  The fact that people prefer the Flip suggests they care about *ex ante* equality (equality of opportunity) or the *process*. Since *ex ante* equality is a property of the probabilities faced by the individuals, it is directly accessible to expected utility theory. If individuals value equal probabilities, that value is captured in their expected utility calculation.
  Therefore, the demand for fairness is not a "freestanding social value" external to individual welfare; it is a preference for a specific type of risk distribution (equal chances) that individuals consume. By treating fairness as an external social constraint, Diamond commits a category error: he treats a preference *within* the utility function as a constraint *on* the aggregation function.

  ### 4. The Paternalism of Non-Welfarist Fairness

  Defending Harsanyi against Diamond also requires defending the welfarist foundation of utilitarianism. If the preference for the coin flip is *not* rooted in individual utility (i.e., if $U_A$ and $U_B$ are truly indifferent between the Flip and Certain A because they care only about the good), then on what grounds should the planner prefer the Flip?

  If the individuals do not care about the fairness of the procedure, a planner who imposes the coin flip is acting paternalistically. They are prioritizing an abstract aesthetic of "fairness" over the actual preferences of the constituents.
  *   If A prefers Certain A (100% chance) to Flip (50% chance), and B is indifferent, a Utilitarian planner respecting Pareto should choose Certain A.
  *   If B prefers Flip to Certain A (valuing the chance), and A prefers Certain A, the planner must weigh these competing utility claims.

  Diamond's argument implicitly assumes the planner knows better than the individuals what is "fair." Harsanyi's framework insists that social welfare is derived *from* individual welfare. If the "fairness" of the coin flip does not contribute to the welfare of A or B (either through consumption or procedural dignity), it contributes nothing to social welfare. If it *does* contribute to their welfare, it is captured by $U_i$. There is no middle ground where fairness exists as a social good independent of individual valuation. To posit such a value is to abandon the democratic/welfarist spirit of utilitarianism for a form of perfectionism that Harsanyi's theorem was never intended to support.

  ### 5. Conclusion: The Robustness of Aggregation

  Diamond's 1967 rejoinder is a powerful reminder that the application of mathematical theorems requires careful philosophical specification of variables. However, it does not refute Harsanyi's Aggregation Theorem. The theorem states that *if* preferences satisfy certain axioms, *then* aggregation must be linear. Diamond shows that if we define preferences narrowly (ignoring procedural value), the linear result conflicts with some moral intuitions.

  The resolution is not to break the linearity of the Social Welfare Function, which would violate the Pareto principle or the rationality axioms of the individuals, but to broaden the linearity of the *Individual* Utility Functions. The appeal of the coin flip is best understood as a demand that risk and inequality aversion regarding social treatment be internalized in $U_i$. When individuals are modeled as valuing the dignity of fair procedures or the security of equal opportunity, Harsanyi's utilitarian calculus yields the "fair" result naturally.

  Thus, Diamond's example reveals no defect in the mathematical case for utilitarianism. It merely demonstrates that utilitarianism is only as good as the information fed into it. A rigorous utilitarianism does not ignore fairness; it recognizes fairness as a component of individual well-being to be aggregated, not a mystical constraint to be imposed from above. Harsanyi's theorem remains robust: social welfare is the sum of individual welfares, provided we have the courage to count all sources of that welfare, including the value of a fair chance.
