answer: |-
  This is a fascinating glimpse into Newton the theologian, who arguably spent more mental energy on biblical criticism than on physics. You are looking at an excerpt from his "Two Notable Corruptions of Scripture," sent to Locke in 1690.

  Here is the breakdown of the Mithridates reference and an analysis of whether Newton is making a legitimate historical point or just building a strawman.

  ### 1. The "Word of Mithridates" Reference

  Newton is referencing a specific historical event known as the **Asiatic Vespers**, which occurred in **88 BC**.

  **Mithridates VI Eupator** was the King of Pontus (in modern-day Turkey) and the greatest enemy of the Roman Republic in the 1st century BC. He was fighting a war against Rome and wanted to eliminate Roman influence in Asia Minor.

  According to the ancient historians (Appian and Valerius Maximus), Mithridates sent **secret letters** to the governors and magistrates of every city in the Roman province of Asia. The "word" (order) was that on a specific, pre-determined day, all citizens were to massacre every Roman and Italian resident in their city—men, women, and children.

  **Why Newton uses it:**
  The story was famous in classical history for two reasons:
  1.  **Secrecy:** The order was sent out secretly and arrived simultaneously across a vast empire without Rome finding out beforehand.
  2.  **Coordination:** It required thousands of disparate cities to act in unison at the exact same moment.

  Newton is using this as a sarcastic analogy. He is saying: *You claim the Arians managed to find every Bible in the Christian world, delete this one sentence, and ensure no one remembered it ever existed, all without leaving a trace?* He compares this to the Mithridates massacre to highlight the absurdity. Just as it was a massive, bloody, historical event that couldn't truly be hidden, Newton argues that a universal textual deletion across the entire Mediterranean would have left "blots or chasms" or at least some complaint from the orthodox side (like Athanasius).

  ### 2. Is the Argument Legit or Loaded Dice?

  The short answer is: **Newton is rhetorically loading the dice, but his underlying textual criticism is historically sound.**

  He is definitely using hyperbole ("Conjurers," "Crafty Knaves") to mock his opponents. However, he is identifying a genuine asymmetry in how texts are transmitted versus how they are suppressed.

  #### The Rhetorical Load (The Strawman)
  Newton is caricaturing the Trinitarian defense. The counter-argument wasn't necessarily that Arians held a magical global summit to burn books. The argument was simply that during the reign of Constantius II (who favored Arianism), Arian scribes were in the majority. If they copied manuscripts without the verse, and orthodox scribes later copied *those* manuscripts, the verse would disappear organically without a grand conspiracy.

  Newton portrays this as a active, malicious hunt ("get all men's books into their hands & correct them") rather than passive transmission bias. By calling them "Conjurers" who wiped the memory from people's brains, he is making the deletion theory sound impossible so he doesn't have to engage with the more modest version: *scribal drift.*

  #### The Logical Asymmetry (The Legit Part)
  Despite the snark, Newton hits on a fundamental principle of textual criticism that is still accepted today: **It is much easier to explain an addition than a deletion.**

  **1. The Mechanism of Addition (Interpolation):**
  *   **How it happens:** A scribe is copying a text. He feels the theology is unclear. He writes a note in the margin (a gloss) to clarify it (e.g., adding the "Father, Word, and Holy Ghost" phrase to make the Trinity explicit).
  *   **Propagation:** The *next* scribe comes along, sees the note, assumes it was accidentally left out of the main text, and copies it in.
  *   **Conspiracy Level:** Zero. This happens accidentally and organically all the time.

  **2. The Mechanism of Deletion (Excision):**
  *   **How it happens:** For the verse to have been "deleted," it must have existed in the manuscripts *before* the Arians got to them.
  *   **The Evidence Problem:** We have Greek manuscripts from before the Arian controversy (and early translations like the Old Latin and Syriac) that **do not contain the verse.**
  *   **The Conspiracy Requirement:** To argue for deletion, you have to argue that the verse existed in the *autograph* (original) and all early copies, but vanished completely from the Greek tradition until the 10th century, only to reappear later in the Latin Vulgate.
  *   **Newton's Point:** If the verse was original, the Orthodox Fathers (like Athanasius) would have used it. It is the "smoking gun" for the Trinity. The fact that they argued for the Trinity *without* ever using this verse suggests they didn't have it. For the Arians to delete it, they would have had to find copies that the Orthodox didn't have access to.

  #### The Verdict
  Newton is right about the text, even if he is being a jerk about the history.

  Modern textual criticism agrees with Newton: **1 John 5:7 (the Comma Johanneum) is almost certainly a later addition.** It is absent from all early Greek manuscripts, absent from the early Church Fathers (even when it would have won their arguments instantly), and appears to have originated as a Latin marginal note that eventually migrated into the text.

  Newton's argument about the "asymmetry" holds up:
  *   **Addition** requires only one scribe making a mistake or an edit, which then spreads.
  *   **Deletion** requires explaining why the verse is missing from the earliest evidence we have.

  Newton exaggerates the *intent* of the Arians (portraying them as Bond villains rather than just the dominant theological faction of the mid-4th century), but he is correct that the "deletion" theory requires a historical conspiracy to explain the lack of evidence, whereas the "addition" theory fits the evidence we actually have.

  So, he is loading the dice rhetorically to humiliate his opponents, but the hand he's playing is the stronger one.
