answer: |-
  Your roommate actually pulled a pretty sophisticated move, and your shock is completely understandable. In modern American political discourse, John Stuart Mill is often claimed as a patron saint of classical liberalism and free-market libertarianism (mostly due to *On Liberty*). Finding him write that the "restraints of Communism would be freedom in comparison with the present condition of the majority of the human race" feels like finding Thomas Jefferson endorsing a monarchy.

  But the short answer is: **Yes, Mill genuinely moved significantly to the left in his later years.** He did not become a Marxist, but he became a critic of unregulated capitalism and an open-minded explorer of socialist alternatives.

  However, there is a lot of nuance in *how* he supported these ideas that keeps him from being a simple mascot for modern socialism. Here is the breakdown of what was actually going on in Mill's head, how it fits with *On Liberty*, and why those quotes are real but require context.

  ### 1. The Evolution of Mill (and the Influence of Harriet Taylor)
  Mill's thought was not static. The *Principles of Political Economy* went through seven editions during his lifetime (1848–1871). With every edition, he became more sympathetic to socialist critiques and more critical of the wage system.

  This shift is largely attributed to his wife, **Harriet Taylor Mill**. Mill credited her with influencing his later radicalism. After her death, he published *Chapters on Socialism* (written around 1869, published posthumously in 1879), which contains the quotes you found. In these essays, he explicitly states that he no longer views private property as a sacrosanct, eternal institution, but rather as a historical tool that might have outlived its usefulness.

  ### 2. Production vs. Distribution
  To understand how Mill reconciles this with economics, you have to look at his distinction between the **laws of production** and the **laws of distribution**.

  *   **Production:** Mill believed this was governed by fixed laws (physics, technology, human nature). You can't legislate how much wheat grows from a seed.
  *   **Distribution:** Mill argued this is entirely a matter of **human institution**. How the wealth *produced* is divided up is a social choice, not a law of nature.

  This is the key to his "socialism." He believed the free market was good at *production* (efficiency), but terrible at *distribution* (fairness). Therefore, society was justified in intervening in distribution to fix poverty, even if it meant restraining absolute property rights.

  ### 3. What Kind of "Socialist" Was Mill?
  This is where your roommate's argument might need a little qualification. When Mill wrote "Communism" or "Socialism," he was **not** talking about 20th-century Soviet state communism. He was thinking of 19th-century **Utopian Socialism** and **Worker Cooperatives**.

  Mill's ideal wasn't a massive state bureaucracy telling everyone what to do (which would violate *On Liberty*). His ideal was **industrial cooperatives**. He envisioned a system where workers owned the factories and managed themselves, sharing the profits.

  *   **Why this fits *On Liberty*:** Mill believed wage labor was degrading. He argued that working for a boss stunted a worker's mental and moral development. If workers owned the means of production, they would become more intelligent, autonomous, and virtuous.
  *   **The Liberty Connection:** For Mill, liberty wasn't just "freedom from interference"; it was **"human development."** If capitalism keeps the majority in poverty and intellectual stagnation, it is illiberal. If "socialism" (in the form of cooperatives) allows the working class to develop their faculties, it is *more* liberal.

  ### 4. Contextualizing the Quotes
  Let's look at the specific lines you found.

  > *"What proportion of the population, in the most civilized countries of Europe, enjoy, in their own persons, anything worth naming of the benefits of property?"*

  Mill is making a pragmatic argument. Defenders of private property say it rewards hard work. Mill looks around Victorian England and says, "For the vast majority of the poor, this is a lie. They work hard and remain poor. So the justification for property is failing."

  > *"The restraints of Communism would be freedom in comparison with the present condition of the majority of the human race."*

  This is the shocker. But read the second half: *"...in comparison with the present condition."*
  He is arguing that for a peasant or a factory worker living in destitution, subject to the whims of the market and starvation, the security of a communist arrangement would *feel* like freedom. He is highlighting the **coercive nature of poverty**. If you are starving, you aren't free; you are coerced by necessity.

  ### 5. Was He a True Believer?
  Mill was never dogmatic about it. He remained a **fallibilist**. He didn't say, "Socialism is definitely the answer." He said, "Capitalism is clearly flawed, Socialism *might* be the solution, but we don't know yet, so we should allow experiments."

  In *Chapters on Socialism*, he writes:
  > *"It is not by welcoming, but by examining Socialism, that we can hope to find the truth."*

  He worried that socialism might lead to stagnation or a tyranny of the majority (a fear from *On Liberty*). He wanted to see small-scale experiments (like worker co-ops) to see if they were viable before endorsing a full systemic overhaul.

  ### The Verdict
  Your roommate was right that the quotes are real and represent Mill's genuine later views. Mill did conclude that the capitalism of his day was morally indefensible regarding poverty and that some form of socialist organization (specifically cooperatives) might be superior for human liberty.

  However, Mill wasn't a "socialist" in the sense of wanting a powerful state to control the economy. He was a **liberal socialist** who wanted to extend the benefits of property and autonomy to the working class through voluntary association.

  **How to handle the debate:**
  You can concede that Mill definitely moved left and criticized the injustices of private property. But you can also point out that Mill's version of "socialism" was about **decentralizing power to workers**, not centralizing it in the State. In fact, Mill would likely critique *both* modern crony capitalism and modern authoritarian communism for stifling individual human development.

  Mill's ultimate position was: **The system that best allows all humans to develop their full potential is the right one.** If capitalism fails that test (which he thought it did for the poor), it must be changed. If socialism fails that test (by crushing individuality), it must be rejected. He died waiting to see which would win out.
