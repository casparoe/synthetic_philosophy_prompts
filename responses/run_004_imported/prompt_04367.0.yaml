answer: |-
  First off, major props for diving into the old Overcoming Bias and LessWrong archives. That stuff is dense, and grappling with Pascal's Mugging is a rite of passage for anyone interested in rationality or decision theory.

  Your intuition is actually really solid in a vacuum: **You are absolutely right that assigning probability zero is dangerous.** Cromwell's Rule is a vital heuristic. If you assign probability zero to a claim, no amount of evidence can ever change your mind, which is epistemically reckless.

  However, **your roommate is right that this doesn't solve Pascal's Mugging.**

  It's a very common first reaction to think, "Well, I'll just assign it a probability of $10^{-100}$ and ignore it." The reason this doesn't work isn't because of Cromwell's Rule, but because of the **relationship between probability and utility.**

  Here is why your fix breaks, and why the "old-timers" had to invent things like the leverage penalty.

  ### 1. The Mugger Can Always Name a Bigger Number
  Pascal's Mugging isn't a static problem where the mugger says, "I will kill $3 \uparrow\uparrow\uparrow 3$ people." That number is just an example of "a really big number."

  The paradox arises because the mugger can look at your probability assignment and **counter-offer.**

  Let's say you stick to your gun: "I assign your claim a probability of exactly $10^{-30}$."
  The mugger replies: "Okay, then I will simulate and kill $10^{31}$ people unless you give me five bucks."

  Now look at the Expected Utility (EU) calculation:
  $$ \text{EU} = \text{Probability} \times \text{Utility} $$
  $$ \text{EU} = 10^{-30} \times 10^{31} = 10 $$

  If we value a human life at even a fraction of a "util," the expected value of paying the mugger is now higher than the cost of the five bucks. By refusing to round down to zero, you have opened the door for the mugger to simply **scale the threat** until the expected value exceeds the cost.

  As long as your utility function is **unbounded** (meaning there is no limit to how much "good" or "bad" can happen), there is *always* a number large enough to overwhelm any fixed non-zero probability.

  ### 2. The Problem is Description Length (Complexity Prior)
  You might object: "But wait, surely the probability should get smaller as the number gets bigger? If he says he'll kill $10^{100}$ people, that's less likely than $10^{30}$ people."

  In standard Bayesian reasoning, we often tie probability to **Kolmogorov complexity** (how many bits of information it takes to describe the hypothesis).

  Here is the terrifying part: It does not take many more bits to describe a huge number than a small one.
  *   "I will kill 1,000 people."
  *   "I will kill $3 \uparrow\uparrow\uparrow 3$ people."

  In a computer program, you can write a very short script to generate $3 \uparrow\uparrow\uparrow 3$. The description length is short. Therefore, under Solomonoff Induction (a formalization of Occam's Razor), the probability penalty for that hypothesis is **not** small enough to counteract the massive utility of the number involved.

  The probability shrinks *logarithmically* (based on how long the number is to write down), but the utility grows *linearly* (or exponentially) based on the value of the number. The utility wins every time.

  ### 3. Why the "Leverage Penalty" Was Invented
  Since simply assigning a tiny probability doesn't work (because the mugger can escalate), Yudkowsky, Hanson, and others realized the problem lies in how we evaluate hypotheses where **one individual has a disproportionate impact on a vast number of others.**

  If a hypothesis implies that *you*, specifically, are the lever that controls the fate of $3 \uparrow\uparrow\uparrow 3$ people, that hypothesis requires a penalty beyond just complexity. This is the **Leverage Penalty**.

  The logic is: "The more people are affected by my decision, the less likely it is that I am the specific person making that decision, unless there is strong evidence." This penalty scales *with* the number of people threatened, aiming to cancel out the utility growth.

  ### The Verdict
  You didn't miss a hole that the old-timers overlooked; you identified a **necessary condition** (don't use zero probability) but not a **sufficient condition** (don't let utility outpace probability).

  *   **You are right:** Rounding to zero is bad epistemology.
  *   **Your roommate is right:** A fixed tiny probability doesn't solve the decision theory problem because the mugger can escalate the stakes.

  To actually "solve" Pascal's Mugging, you generally have to do one of two things:
  1.  **Bound your utility function:** Accept that there is a maximum amount of "good" or "bad" that can exist (e.g., you can't care more than X amount about lives saved).
  2.  **Apply a Leverage Penalty:** Discount hypotheses where you have outsized influence proportional to the size of that influence.

  It's a humbling realization: the math of expected utility, which seems so robust, actually breaks when faced with infinity-scale stakes unless we put guardrails on it. You're asking the right questions, though—this is exactly how you get better at decision theory.
