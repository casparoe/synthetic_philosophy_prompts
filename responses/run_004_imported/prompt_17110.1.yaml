      *   *The Strict View (Denial):* This aligns with traditional UNHCR guidelines and many national jurisdictions (e.g., US, UK, Canada generally). Conscientious objection usually requires universal pacifism or specific war crimes. Distinguishing "just" vs. "unjust" wars is politically fraught for asylum adjudicators.
      *   *The Moral View (Grant):* Aligns with evolving human rights norms (e.g., some European courts, UN Human Rights Committee views on conscientious objection). Punishment for refusing to participate in aggression *can* be seen as persecution of conscience.
