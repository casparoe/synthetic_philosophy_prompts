  **REFUGEE APPEALS PANEL**
  **DECISION AND ORDER**

  **Case No:** 24-0982
  **Date:** October 24, 2023
  **Applicant:** [Redacted]
  **Country of Origin:** [Redacted]

  **I. PROCEDURAL POSTURE AND ISSUE**

  This appeal comes before the Panel following a split decision at the initial merits stage regarding the Applicant's claim for asylum. The Applicant, a 23-year-old national of [Country A], seeks protection from return on the basis of political opinion and imputed conscience. He was conscripted into the armed forces of [Country A], served for eight months, and deserted shortly after his unit crossed the border into [Country B] during a military invasion. He faces a statutory penalty of 5 to 8 years imprisonment for desertion if returned.

  The Panel is divided on the application of the Guidelines on Military Service and Conscientious Objection (the "Guidelines"). The Guidelines currently establish two prongs under which objection to service supports a claim: (1) universal opposition to all war (pacifism), or (2) objection to service that would require the applicant to personally commit acts violating the laws of war. The Applicant fits neither prong under a strict reading: he admits he would fight in defense of his own country, and he alleges no order to commit specific atrocities.

  The issue before this Panel is whether punishment for desertion constitutes persecution where the desertion is motivated by a refusal to participate in a conflict that constitutes a "crime of aggression" under international law, even absent specific orders to commit war crimes.

  **II. POSITIONS OF THE PANEL**

  *The Argument for Denial*
  One member of the Panel argues for denial based on the principle of administrative competence and neutrality. This position holds that asylum adjudicators are not equipped to adjudicate the *jus ad bellum* (justice of going to war) of foreign conflicts. To grant claims based on the "unjust" nature of a war invites subjective moralizing, turning the Panel into amateur just-war theorists. Furthermore, this position argues that distinguishing between a "principled objector" and an "opportunist" becomes impossible without the bright-line rules of the current Guidelines. If we grant this claim, we risk opening the door to any deserter from any unpopular conflict to relitigate their government's foreign policy in our hearing rooms. Under this view, the 5-8 year prison term, while severe, is a legitimate prosecution for breach of contract and military discipline, not persecution.

  *The Argument for Grant*
  The other member argues for grant based on the fundamental purpose of refugee protection. This position holds that the Guidelines are under-inclusive. Punishing an individual for refusing to participate in a war of naked aggression strikes at the core of conscience protected by international human rights norms. The Applicant served until the nature of the conflict shifted from defense to aggression; his refusal was specific, principled, and timely. To return him to a military prison for adhering to the Nuremberg Principle that individuals have a duty to avoid complicity in crimes against peace is, in this view, the exact type of persecution-for-conscience the system is designed to catch.

  **III. PANEL REASONING AND NEW STANDARD**

  The Panel grants the application. We do so not by discarding the Guidelines, but by clarifying the second prong regarding "violations of the laws of war."

  We acknowledge the strength of the Denial position. It is not the function of this Panel to issue advisory opinions on the geopolitical legitimacy of foreign governments. A rule that allows asylum based on a claimant's *subjective* belief that a war is "unjust" is unworkable. It lacks an objective anchor and would indeed lead to inconsistent results based on the personal political views of adjudicators.

  However, the strict Denial position relies on a distinction that international law has increasingly eroded: the distinction between *jus in bello* (conduct in war) and *jus ad bellum* (right to wage war). The current Guidelines focus heavily on *jus in bello* (e.g., shooting civilians, torture). They ignore the emerging consensus in international criminal law that participation in a "Crime of Aggression" is itself a violation of international law, distinct from specific battlefield atrocities.

  Therefore, the Panel adopts the following narrow test for future cases involving military desertion where the claimant is not a pacifist and alleges no personal order to commit war crimes:

  **The "International Consensus on Aggression" Test**
  A claim based on refusal to participate in a specific conflict may be granted if the claimant demonstrates, by objective evidence, that:
  1.  **Objective Illegality:** The specific conflict in question has been formally condemned as a violation of the UN Charter or a "Crime of Aggression" by a competent international body (e.g., UN General Assembly Resolution, International Court of Justice advisory opinion, or ICC investigation authorization);
  2.  **Causal Nexus:** The applicant's refusal to serve was directly motivated by this specific illegality, rather than general political dissent or fear of combat; and
  3.  **Disproportionate Punishment:** The penalty faced for desertion is disproportionately severe (e.g., lengthy imprisonment) compared to standard disciplinary measures, indicating a punitive intent to coerce participation in the condemned act.

  This test addresses the Denial position's concern about "amateur theorizing." The adjudicator does not decide if the war is just; they verify if the *international community* has already declared it illegal. It addresses the Granter's concern by acknowledging that complicity in aggression is a matter of conscience protected under refugee law.

  **IV. APPLICATION TO APPLICANT**

  Applying this test to the instant file:

  1.  **Objective Illegality:** The invasion of [Country B] by [Country A] has been the subject of [UN General Assembly Resolution X / ICC Prosecutor Statement Y], which explicitly characterized the incursion as an act of aggression violating international sovereignty. This provides the objective anchor required to prevent subjective moralizing.
  2.  **Causal Nexus:** The Applicant's testimony is consistent and credible. He served for eight months without incident. His desertion coincided precisely with the cross-border operation. He explicitly stated he would fight in defense of [Country A]. This supports the finding that his objection is to the *illegal nature of the specific campaign*, not to military service per se.
  3.  **Disproportionate Punishment:** The 5-8 year sentence for a first-time desertion offense, where no combat was engaged in by the deserter, exceeds standard disciplinary norms and functions as a coercive measure to force participation in the condemned conflict.

  **V. CONCLUSION**

  We find that while the Applicant does not meet the traditional definition of a conscientious objector, he faces persecution for refusing to be complicit in an act condemned by international law. To return him would be to enforce a penalty for adhering to a norm of international conduct that this jurisdiction recognizes.

  The decision of the initial tribunal is **REVERSED**. Asylum is **GRANTED**.

  ***

  **VI. NOTE ON PRECEDENT (For Internal Panel Use)**

  *This opinion is drafted to serve as the binding rationale for the majority. It is designed to be adoptable by the colleague favoring denial, as it imposes a high evidentiary bar (requiring international body condemnation) that prevents a flood of new claims. It is designed to be adoptable by the colleague favoring grant, as it secures protection for this claimant and establishes a moral baseline regarding aggression.*

  *Future cases lacking the "Objective Illegality" element (e.g., civil wars, contested border skirmishes without UN condemnation) should be denied under the traditional Guidelines to maintain the administrative boundaries warned of in the Denial position.*

  **[Signature]**
  **Presiding Panel Member**
