      *   **Causal Determinism vs. Logical Fatalism:** The friend is mixing up *truth values* with *causal necessity*. Just because a statement *will turn out* to be true doesn't mean it is *caused* to be true by some external force or pre-existing script. The truth depends on the *action*, not the other way around.
