      *Correction:* I can ask probing questions, but I should know that the *answer* will have to be constructed from his existing text. If I ask something he never addressed, the script dies. I need to balance probing with answerability based on the 1950 paper and his general known views (which the scriptwriters will likely synthesize).
      *Actually, re-reading:* "draft 8 to 10 questions for it... tack on a quick follow-up keyed to whatever answer or evasion he's most likely to give." The user acknowledges this is a script. I should write questions that *sound* like they are challenging him, knowing the production team will find the best fit from his text to answer. I will focus on the logic gaps that the text *implies* even if it doesn't explicitly solve.

