answer: |-
  This is a sophisticated intersection of machine learning theory and formal epistemology. You are correctly identifying the tension between the mathematical elegance of proper scoring rules and the philosophical burden of justifying them as the *unique* or *privileged* metric of epistemic value.

  As an engineer, you know that in ML, the choice of loss function (Brier vs. Log-Loss vs. Hinge) is dictated by the downstream task (calibration vs. ranking vs. margin maximization). In accuracy-first epistemology, the "task" is simply *believing truly*. The central claim of the Joyceian program is that this task mathematically necessitates probabilistic coherence.

  Below, I lay out the argument that the accuracy-dominance argument fails to establish the irrationality of incoherence due to **measure sensitivity (rule-relativity)**, even when restricted to strictly proper scoring rules. I will then engage with the strongest defense available to the accuracy-firster and explain why it ultimately falls short of rescuing the normativity of the argument.

  ---

  ### 1. The Formal Setup: Inaccuracy as Loss

  Let $W = \{w_1, \dots, w_n\}$ be a finite set of possible worlds. Let $\mathcal{F}$ be an algebra of propositions over $W$. A credence function is a map $c: \mathcal{F} \to [0,1]$.

  In your ML context, you view an **inaccuracy measure** $\mathfrak{I}(c, w)$ as a **loss function** $L(c, y)$, where $y$ is the truth-value vector of the propositions in world $w$ (1 for true, 0 for false).

  *   **Probabilism:** The norm that rational $c$ must satisfy the Kolmogorov axioms (i.e., $c$ lies within the probability simplex $\mathcal{P}$).
  *   **Accuracy-Dominance:** A credence function $c$ is accuracy-dominated if there exists an alternative $c'$ such that for all worlds $w \in W$, $\mathfrak{I}(c', w) < \mathfrak{I}(c, w)$.
  *   **The Joyce Argument:**
      1.  **Normative Premise:** It is irrational to hold a credence function that is accuracy-dominated (you are guaranteed to be less accurate than an available alternative, regardless of how the world turns out).
      2.  **Mathematical Premise:** If $c$ is incoherent ($c \notin \mathcal{P}$), there exists a coherent $c' \in \mathcal{P}$ that accuracy-dominates $c$.
      3.  **Conclusion:** Therefore, it is irrational to be incoherent.

  ### 2. The 2009 Fix: Strict Propriety

  You noted Patrick Maher's 2002 objection regarding Absolute Distance ($|c - v|$). In ML terms, Absolute Distance is **not a proper scoring rule**. If your true belief is $p=0.6$, the expected absolute distance is minimized by reporting $c=1$ (since $0.4 \times |1-0| + 0.6 \times |1-1| = 0.4$, whereas reporting truthfully yields $0.6 \times 0.4 + 0.4 \times 0.6 = 0.48$).

  Joyce's 2009 reply restricts legitimate inaccuracy measures to the class of **Strictly Proper Scoring Rules (SPSRs)**.
  A measure $\mathfrak{I}$ is strictly proper if, for any probabilistic $p$, the expected inaccuracy $E_p[\mathfrak{I}(c)]$ is uniquely minimized at $c=p$.

  Joyce (and later Predd et al., 2009) proved a generalized dominance theorem: **For *any* SPSR $\mathfrak{I}$, if $c$ is incoherent, there exists a coherent $c'$ that dominates $c$.**

  This seems to block Maher. However, it opens the door to the Bronfman/Pettigrew objection: **Measure Sensitivity.**

  ### 3. The Rule-Relativity Objection

  The core of the objection is geometric. While all SPSRs agree that an incoherent point $c_{inc}$ (outside the simplex) is dominated by *some* coherent point, they disagree on **which** coherent point dominates it, and indeed, on the **magnitude** of the dominance.

  #### The Geometry of Repair
  In ML, finding the dominating coherent credence is equivalent to projecting the incoherent vector $c_{inc}$ onto the probability simplex $\mathcal{P}$. The location of this projection depends entirely on the geometry induced by the loss function.

  *   **Brier Score:** Induces Euclidean geometry. The dominating $c'$ is the **Euclidean projection** of $c_{inc}$ onto $\mathcal{P}$.
  *   **Log-Loss:** Induces Information Geometric (dual flat) geometry. The dominating $c'$ is the **information projection** (minimizing KL divergence) of $c_{inc}$ onto $\mathcal{P}$.

  For most incoherent $c_{inc}$, the Euclidean projection $\neq$ the Information projection.
  Let $c_{Brier}$ be the coherent function that dominates $c_{inc}$ under Brier.
  Let $c_{Log}$ be the coherent function that dominates $c_{inc}$ under Log-Loss.

  It is often the case that:
  1.  $\mathfrak{I}_{Brier}(c_{Brier}, w) < \mathfrak{I}_{Brier}(c_{inc}, w)$ for all $w$.
  2.  $\mathfrak{I}_{Log}(c_{Log}, w) < \mathfrak{I}_{Log}(c_{inc}, w)$ for all $w$.
  3.  **Crucially:** It might be that $\mathfrak{I}_{Brier}(c_{Log}, w) \not< \mathfrak{I}_{Brier}(c_{inc}, w)$ for all $w$. (i.e., the Log-Loss repair is *not* a Brier-dominator).

  #### The Normative Gap
  The accuracy-first argument claims incoherence is irrational *because* it is dominated. But dominated *by what*?
  *   If you measure accuracy via Brier, you ought to move to $c_{Brier}$.
  *   If you measure accuracy via Log-Loss, you ought to move to $c_{Log}$.

  Since both measures are Strictly Proper, Joyce's own criteria certify both as "legitimate" measures of accuracy. Yet they issue conflicting normative commands. If there is no fact of the matter about which measure is the *true* measure of epistemic utility, then there is no fact of the matter about which coherent credence you should adopt to repair your irrationality.

  This reduces Probabilism from a categorical imperative ("Be Coherent") to a hypothetical one ("Be Coherent *relative to metric M*"). But since the choice of $M$ is not dictated by the goal of "truth" alone (both are proper), the argument fails to ground the rationality of probabilism in accuracy alone.

  ### 4. The Strongest Defense: Robustness of Dominance

  How would a defender of accuracy-first epistemology (like Richard Pettigrew or Jim Joyce) respond? The strongest reply does not attempt to prove Brier is unique. Instead, it argues that **the specific repair does not matter for the binary verdict on rationality.**

  **The Argument:**
  1.  **The Goal is Probabilism, not Calibration:** The philosophical goal is to prove that *incoherent* credences are irrational, not to prescribe exactly *which* coherent credences are mandatory.
  2.  **Robust Existence:** While different SPSRs disagree on *which* $c'$ dominates $c_{inc}$, they all agree that *some* $c' \in \mathcal{P}$ dominates $c_{inc}$.
  3.  **The Set of Dominators:** For any incoherent $c$, the set of dominating coherent functions is non-empty for *every* SPSR.
  4.  **Conclusion:** Therefore, regardless of which legitimate measure of accuracy you choose, the verdict is the same: $c_{inc}$ is irrational because it is dominated. The disagreement about the *repair* does not undermine the diagnosis of the *disease*.

  Pettigrew might add that we can adopt a **Maximin** approach: If you are unsure which SPSR is the true measure of accuracy, you should still avoid incoherence, because incoherent functions are dominated across the board, whereas coherent functions are never dominated (by the definition of propriety). Thus, Probabilism is robust across the class of legitimate measures.

  ### 5. Critique: Why the Defense Fails

  This defense is mathematically sound but philosophically insufficient. It fails to rescue the argument for two main reasons: the **Guidance Problem** and the **Arbitrariness of the Class**.

  #### A. The Guidance Problem
  Rationality is action-guiding. If I discover my credences are incoherent, the norm "Be Probabilistic" tells me I must change them. But to actually change them, I need to know *where to move*.
  *   If I move to $c_{Brier}$, I satisfy the Brier-norm but might violate the Log-Loss-norm (in the sense that $c_{Brier}$ might not dominate $c_{inc}$ under Log-Loss, or might be further from the Log-Loss optimum).
  *   If the definition of "Epistemic Utility" is indeterminate between Brier and Log-Loss, then the directive "Maximize Epistemic Utility" is indeterminate.

  To say "Just pick any coherent function" is not a solution. In ML, moving to a suboptimal point on the simplex can still result in poor calibration or high loss. In epistemology, if rationality requires minimizing inaccuracy, and different measures identify different minima, then **rationality itself becomes measure-relative.** The argument succeeds in showing incoherence is bad, but fails to show that *coherence* is sufficient for rationality, because some coherent points are "more dominated" than others depending on the measure.

  #### B. The Arbitrariness of the Class (The "Why Propriety?" Problem)
  The defense relies on the class of Strictly Proper Scoring Rules being the "natural kind" of accuracy measures. But why?
  Joyce justifies strict propriety by arguing that a measure of accuracy shouldn't recommend you lie about your own credences. But this is a **pragmatic/decision-theoretic** justification smuggled into an epistemic argument.

  From a purely "truth-directed" perspective (which accuracy-first epistemology claims to be), why is the Brier score (squared error) more "truth-like" than Log-Loss (log probability)?
  *   In ML, we choose Log-Loss when we care about confidence in the correct class.
  *   We choose Brier when we care about calibration across the probability spectrum.
  *   In Epistemology, what is the ground truth preference?

  If the accuracy-firster says, "All SPSRs are equally valid," they concede that epistemic value is not a single scalar quantity but a vector of competing values. If epistemic value is multi-dimensional, then "dominance" is partial. An incoherent point might be dominated in Dimension 1 (Brier) but not Dimension 2 (Log-Loss). If dominance is partial, the claim that incoherence is *strictly* irrational (in the sense of being dominated in *all* possible worlds) weakens.

  Actually, the Predd et al. theorem says incoherent points are dominated for *any* SPSR. So the partial dominance worry is mitigated. However, the deeper issue remains: **Why is this class privileged?**
  If the only reason to accept SPSRs is that they yield the desired theorem (Probabilism), the argument is circular. If the reason is that they capture "truth," the Bronfman objection shows they capture *different geometries of truth*. Without a metaphysical argument for why truth is Euclidean (Brier) rather than Information Geometric (Log-Loss), the choice of measure is arbitrary.

  ### 6. Conclusion: The Argument Does Not Hold

  The accuracy-dominance argument fails to establish that incoherent credences are irrational *simpliciter* because it cannot non-arbitrarily select a metric of inaccuracy.

  1.  **Strict Propriety is Insufficient:** It rules out pathological measures (like Absolute Distance) but leaves a vast family of measures (Brier, Log-Loss, Spherical, etc.) that are mathematically distinct.
  2.  **Rule-Relativity is Fatal:** Because these measures prescribe different "repairs" for incoherence, the norm "Minimize Inaccuracy" does not resolve to a unique directive.
  3.  **The Defense Fails:** Arguing that "all measures agree on dominance" ignores that rationality requires guidance on *which* coherent state to occupy. Furthermore, it fails to justify why the class of SPSRs is the metaphysically privileged set of truth-measures without begging the question.

  **For the Engineer:**
  Think of it this way: Joyce is trying to prove that "You must use a model in the hypothesis class $\mathcal{P}$." He proves that for any Loss Function $L \in \text{SPSR}$, a model outside $\mathcal{P}$ is dominated.
  But if you ask, "Which model in $\mathcal{P}$ should I use?", he says, "It depends on $L$."
  If you ask, "Which $L$ should I use?", he says, "Any proper one."
  If the choice of $L$ changes the optimal model, and there is no ground truth for $L$, then the recommendation to use $\mathcal{P}$ is underdetermined. You know you shouldn't be outside $\mathcal{P}$, but you have no epistemic reason to prefer one point inside $\mathcal{P}$ over another, which means the "accuracy" norm cannot fully govern rational belief formation.

  Therefore, the accuracy-first program cannot derive Probabilism from accuracy alone; it requires an additional, unjustified premise about the geometry of truth.
