prompt: |-
  For a near-future novel I'm drafting, one pivotal scene turns on a video, seen by millions before anyone can verify it, that appears to show a miraculous healing. My protagonist, a philosopher, wants to resist believing it on explicitly Humean grounds, and I need her reasoning to genuinely hold up rather than gesture vaguely at "Hume would be skeptical of miracles." Specifically: if Hume himself were confronted with a world in which moving images, and not only spoken or written testimony, can be fabricated cheaply and undetectably, how would he revise the actual argument of "Of Miracles" — the maxim that testimony can establish a miracle only if its own falsehood would be more improbable than the miracle itself, together with his separate observations about our appetite for the marvelous and about how rival religions' miracle-claims undercut one another? Does the mere possibility of undetectable fabrication strengthen his case against trusting the video, by further degrading the background reliability of the relevant class of evidence, or does it threaten to undercut his whole framework, which quietly presupposes a stable track record against which the reliability of testimony can be calibrated? Work through this with real fidelity to the argument's actual structure, and commit to a specific verdict about which way it actually cuts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A near-future novel featuring a pivotal scene with a viral video of a miraculous healing.
      *   **Protagonist:** A philosopher resisting belief on explicitly Humean grounds.
      *   **Constraint:** The reasoning must hold up to scrutiny, not just be a vague gesture at Hume. It needs to address how Hume's argument in "Of Miracles" (Section X of *An Enquiry Concerning Human Understanding*) applies to *video evidence* in an age of cheap, undetectable fabrication (deepfakes, etc.).
      *   **Core Question:** Does the possibility of undetectable fabrication strengthen Hume's case (by degrading evidence reliability) or undercut his framework (by destabilizing the uniform experience against which miracles are weighed)?
      *   **Requirement:** Work through the actual structure of Hume's argument (the maxim, the psychology of belief, the clash of religions) and commit to a specific verdict.

  2.  **Deconstruct Hume's Argument in "Of Miracles":**
      *   *Part I (The Maxim):* A wise man proportions his belief to the evidence. No testimony is sufficient to establish a miracle unless the testimony is of such a kind that its falsehood would be more miraculous than the fact it endeavors to establish. (Weighing probabilities: Uniform Experience vs. Testimonial Evidence).
      *   *Part II (Practical Maxims/Heuristics):*
          1.  Witnesses are never numerous/educated/reputable enough.
          2.  Human psychology loves the marvelous (passion/surprise).
          3.  Miracle claims come chiefly from ignorant/barbarous nations.
          4.  Rival religions claim miracles, canceling each other out (miracles support specific doctrines, which are mutually exclusive).

  3.  **Analyze the New Variable: Undetectable Video Fabrication:**
      *   Video is traditionally treated as "mechanical testimony" or "extended perception." It feels like seeing it yourself.
      *   However, if fabrication is *cheap* and *undetectable*, the link between the image and reality is broken.
      *   *Humean Epistemology:* Based on custom, habit, and uniform experience. We trust testimony because, in uniform experience, honest reporting usually aligns with reality. We trust senses because they usually align with reality.

  4.  **Evaluate the Impact on Hume's Framework:**

      *   *Does it undercut the framework?*
          *   Hume relies on "uniform experience" against the miracle. (e.g., Dead men stay dead).
          *   He also relies on "uniform experience" *for* the reliability of testimony/senses.
          *   If video fabrication is common, the "uniform experience" supporting the reliability of video evidence is degraded.
          *   Does this destabilize the *whole* framework? No. Hume's framework is probabilistic. It's designed to handle unreliable evidence. In fact, it thrives on assessing the reliability of evidence.
          *   *Verdict:* It doesn't break the framework; it loads the scales even heavier against the miracle.

      *   *Does it strengthen the case?*
          *   Hume's Maxim: $P(\text{Miracle}) < P(\text{Testimony is False})$.
          *   If video is the testimony, we must ask: Is it more likely the dead rose, or the video is fake?
          *   If deepfakes are cheap/undetectable, $P(\text{Video is Fake})$ skyrockets.
          *   Therefore, the threshold for believing the miracle becomes impossibly high.
          *   *Psychology:* The "passion of surprise and wonder" applies even more strongly to viral videos.
          *   *Rival Claims:* If anyone can make a miracle video, rival sects will flood the zone, canceling each other out (Part II, Point 4).

  5.  **Address the Specific Tension (The "Stable Track Record" Objection):**
      *   The prompt asks: Does this threaten the framework which presupposes a stable track record?
      *   *Hume's Response:* The "stable track record" isn't metaphysical truth; it's psychological habit based on past observation. If our observation changes (we see many fakes), our habit changes.
      *   Hume argues *against* suspending natural laws based on testimony. If the medium of testimony becomes suspect, the argument *against* the miracle becomes stronger, not weaker.
      *   The "Uniform Experience" against the miracle (dead men don't rise) remains constant. The "Uniform Experience" *for* the evidence (videos show reality) is now compromised.
      *   *Result:* The gap widens. The miracle becomes *less* believable, not more.

  6.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. State the verdict immediately: It strengthens Hume's case.
      *   *Section 1: The Maxim (Part I).* Explain the balance of probabilities. The miracle violates uniform experience. The video is testimony. If video fabrication is common, the probability of falsehood exceeds the probability of the miracle. The "undetectable" nature is key—it prevents the usual check of cross-examination.
      *   *Section 2: The Psychology (Part II).* Hume's point about the "passion of surprise." Viral videos exploit this. The medium encourages belief without scrutiny.
      *   *Section 3: The Rival Religions (Part II).* If fabrication is cheap, miracle claims become inflationary. If everyone has a miracle video, none have authority. This destroys the evidentiary value of miracles for *any* specific system.
      *   *Section 4: Addressing the "Undercutting" Worry.* Does this break Hume's reliance on stable experience? No. Hume's stability is empirical. If the empirical reality of media changes, the probabilistic calculus adjusts. It doesn't require metaphysical certainty, just consistent observation. The observation now is "videos are often fake."
      *   *Conclusion/Verdict:* The protagonist should argue that the *ease of fabrication* makes the video evidence weaker than oral testimony from credible witnesses in Hume's time, because the "falsehood" side of the equation is now heavily weighted by technological probability.

  7.  **Refining the Humean Voice:**
      *   Avoid modern jargon where possible, or translate it into Humean terms (e.g., "custom," "constant conjunction," "analogy").
      *   Ensure the distinction between Part I (Principle) and Part II (Practical Application) is clear.
      *   *Crucial Nuance:* Hume distinguishes between "proof" (uniform experience) and "probability." A law of nature is a proof. Testimony is usually probability. Video might feel like proof (perception), but if its genesis is uncertain, it reverts to testimony.

  8.  **Final Review against Constraints:**
      *   *Fidelity to argument?* Yes, focusing on the maxim and the four practical points.
      *   *Specific verdict?* Yes, it strengthens the skepticism.
      *   *Novel context?* Keep the advice applicable to the protagonist's dialogue/internal monologue.

  9.  **Self-Correction/Edge Case:**
      *   *Counter-argument:* If the video is *perfect*, doesn't it count as direct observation?
      *   *Humean Rebuttal:* We are not observing the event; we are observing photons on a screen. We infer the event. That inference relies on the causal link between camera and reality. If that link is breakable without trace, the inference is weak. Hume cares about the *inference*, not the sensation.
      *   *Counter-argument:* Does this lead to total skepticism?
      *   *Humean Rebuttal:* No, because we still have uniform experience of natural laws. We don't need to trust the video to know dead men stay dead. We only need to trust the video to *override* that uniform experience. The bar is higher.

  10. **Final Polish:** Structure the response clearly for the author to use. (Introduction -> The Maxim -> The Psychology -> The Rivalry -> The Verdict). Ensure the tone is analytical yet creative-friendly. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Hume would say no." I need to explain *why* the specific condition of "undetectable fabrication" interacts with the "maxim" specifically. The maxim compares $P(\text{Miracle})$ vs $P(\text{Deception})$. If $P(\text{Deception})$ goes up due to tech, the scale tips harder against the miracle. That is the core logical hinge.

  Also, address the "stable track record" worry explicitly. Hume's track record is *against* miracles. The track record *for* testimony is what's changing. If testimony becomes less reliable, the argument against miracles strengthens. It doesn't undermine the method; it fuels the engine.

  Okay, ready to write.s
answer: |-
  Here is a breakdown of how Hume's argument applies to your scenario, structured to help your protagonist articulate a position that is philosophically robust rather than merely decorative.

  ### The Verdict
  **The possibility of undetectable fabrication strengthens Hume's case.** It does not undercut his framework.

  Hume's epistemology is not built on metaphysical certainty but on **custom, habit, and the weighing of probabilities based on uniform experience.** His argument in *Of Miracles* (Section X of the *Enquiry*) is a balance scale. On one side is the "uniform experience" against the miracle (e.g., dead men do not rise). On the other side is the evidence *for* the miracle (testimony, sight, video).

  If the reliability of the evidence side is degraded by the possibility of fabrication, the scale tips *harder* against the miracle. The framework does not break; it simply registers the new data point that "video evidence is now less reliable than it was in the 18th century."

  Here is how your protagonist should deploy the argument, following Hume's actual structure.

  ---

  ### 1. The Maxim (Part I of "Of Miracles")
  Hume's central maxim is: *"No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish."*

  **The Application:**
  Your protagonist must treat the video not as "direct perception" but as **mediated testimony**. When we watch a video, we are not observing the event; we are observing pixels on a screen and inferring the event occurred. That inference relies on a causal chain: *Event → Camera → File → Screen → Eye.*

  In Hume's time, the weak link in that chain was human honesty. In your novel's near-future, the weak link is technological integrity.

  *   **The Probability Calculus:** Hume argues we must weigh two probabilities:
      1.  $P(M)$: The probability that the law of nature was violated (the healing occurred).
      2.  $P(F)$: The probability that the evidence is false (the video is fabricated).
  *   **The Shift:** Hume assumes $P(M)$ is vanishingly low because it contradicts "uniform experience" (the consistent observation that biology does not reverse entropy spontaneously). For belief to be rational, $P(F)$ must be *lower* than $P(M)$.
  *   **The Fabrication Variable:** If fabrication is "cheap and undetectable," $P(F)$ skyrockets. It is now statistically more probable that a digital file was manipulated than that a biological law was suspended.
  *   **The Protagonist's Line:** *"Hume taught us to weigh the miracle against the lie. In his day, a lie required a conspirator. Today, it requires only an algorithm. The miracle remains as improbable as ever, but the lie has become commonplace. The scale does not balance; it crashes."*

  ### 2. The Psychology of Belief (Part II, Point 1 & 2)
  Hume observes that humans have a natural "passion of surprise and wonder" which makes us susceptible to miracle claims. He notes that this passion disables our critical faculties.

  **The Application:**
  Viral video is the ultimate engine of this psychological vulnerability. It bypasses scrutiny through immediacy.
  *   **Hume's Insight:** Hume argues that the "emotion of surprise" is itself a reason for skepticism, because it indicates the mind is being led by passion rather than reason.
  *   **The Viral Multiplier:** The fact that the video is seen by *millions* before verification is not evidence of truth; to a Humean, it is evidence of the **contagion of passion**. Hume explicitly notes that miracle claims spread fastest among the masses where scrutiny is lowest.
  *   **The Protagonist's Line:** *"The speed of its spread is not proof of its authenticity, but of our appetite for it. Hume warned that the passion of wonder suspends understanding. This video did not travel because it was true; it traveled because it was marvelous."*

  ### 3. The Argument from Rival Systems (Part II, Point 4)
  This is Hume's "knockout blow." He argues that miracles are claimed by all religions to establish their specific doctrines. Since these doctrines contradict (e.g., Jesus is God vs. Allah has no son), the miracles cancel each other out. They destroy each other's credit.

  **The Application:**
  Cheap fabrication accelerates this cancellation to the point of absurdity.
  *   **Inflationary Miracles:** If anyone can fabricate a healing, then every sect, cult, and ideology can produce a "miracle video."
  *   **Destruction of Evidentiary Value:** If a Buddhist group releases a video of a monk levitating, and a Christian group releases a video of a stigmatic, and both are indistinguishable from reality, neither proves anything. They merely prove that *video generation exists.*
  *   **The Protagonist's Line:** *"If every sect can manufacture a sign, then no sign signifies anything. When miracles become cheap, they cease to be divine and become merely rhetorical. They cancel each other out, leaving only the noise."*

  ### 4. Addressing the "Stable Track Record" Objection
  This is the crux of your specific worry: *Does this undermine Hume's reliance on a stable track record?*

  **The Humean Resolution:**
  Hume does not presuppose a metaphysical stability; he presupposes an **empirical** one. We trust testimony because, in our past experience, testimony has usually matched reality. We trust video because, in our past experience, cameras usually captured light.

  *   **Updating the Custom:** If the empirical reality changes (i.e., we observe that deepfakes are now common), our "custom" updates. Hume's system is designed to handle shifting probabilities.
  *   **The Asymmetry:** The "uniform experience" *against* the miracle (biology is stable) remains constant. The "uniform experience" *for* the evidence (video is reliable) is degrading.
  *   **The Result:** The gap between the two widens. The skepticism becomes *more* justified, not less. The framework is not undercut; it is vindicated because it correctly predicts that as evidence becomes less reliable, belief should decrease.

  **The Protagonist's Line:** *"You think this technology undermines skepticism? It is skepticism's ultimate vindication. Hume's argument relies on the reliability of the witness. When the witness is a machine that can lie without a trace, the witness is dead. We are left with the uniform experience of nature, which has never lied."*

  ### Summary for the Scene
  To make this dramatic, your protagonist should avoid sounding like she is reciting a textbook. She should sound like she is watching a scale tip.

  **Suggested Dialogue/Monologue Beat:**
  > "You're treating that video as a window. It's not. It's a witness. And Hume gave us the rule for witnesses three hundred years ago: A wise man proportions his belief to the evidence.
  >
  > "On one side of the scale, you have the uniform experience of every human being who has ever lived: cells do not spontaneously reorganize into healthy tissue. That is a 'proof' in the Humean sense. It is a law established by unbroken experience.
  >
  > "On the other side, you have the video. In Hume's day, to falsify that evidence, you needed a conspiracy of liars. Today, you need a laptop. The probability of the fabrication has risen to meet the probability of the miracle. But it hasn't surpassed it.
  >
  > "So we are left with a choice between a broken law of nature and a broken file. I will bet on the file. Not because I trust the technology, but because I trust the dead to stay dead."

  ### Final Note on "Undetectability"
  The "undetectable" nature of the fabrication is the key. Hume emphasizes that for testimony to overcome a miracle, it must be attended by such circumstances that *detection of falsehood would be inevitable* (e.g., many educated witnesses, public setting, reputations at stake).

  Undetectable fabrication removes the possibility of detection. Therefore, by Hume's own criteria, the evidence is **structurally incapable** of establishing the miracle, regardless of how clear the image looks. The protagonist can argue that **epistemic security requires the possibility of falsification.** If the medium removes the possibility of detecting a lie, it removes the possibility of proving a truth.
