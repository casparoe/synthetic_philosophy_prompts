answer: |-
  You are right to be bugged. The naive citation of the Condorcet Jury Theorem (CJT) often glosses over the **independence assumption** as if it were a minor technicality, when in reality it is the entire engine of the theorem. Without it, the "wisdom of crowds" can easily become the "madness of mobs."

  Here is a concrete, symmetric toy model that satisfies your constraints: three voters, each 60% competent individually, but the majority is only 40% competent.

  ### The Toy Model

  Let $V_1, V_2, V_3$ be binary random variables where $1$ represents a **Correct** vote and $0$ represents an **Incorrect** vote.

  We define the joint probability distribution over the 8 possible outcomes as follows:

  | Outcome $(V_1, V_2, V_3)$ | Description | Probability |
  | :--- | :--- | :--- |
  | **(1, 1, 1)** | All Correct | **0.4** |
  | **(1, 0, 0)** | Only V1 Correct | **0.2** |
  | **(0, 1, 0)** | Only V2 Correct | **0.2** |
  | **(0, 0, 1)** | Only V3 Correct | **0.2** |
  | *(All other outcomes)* | *(e.g., 2 Correct, 1 Wrong)* | **0.0** |
  | **Total** | | **1.0** |

  *(Note: Outcomes like (1, 1, 0) where exactly two voters are correct have probability 0.)*

  ### Verification of Constraints

  **1. Individual Competence (Marginals)**
  Let's calculate the probability that Voter 1 is correct ($V_1 = 1$). We sum the probabilities of all rows where $V_1 = 1$:
  $$P(V_1=1) = P(1,1,1) + P(1,0,0) = 0.4 + 0.2 = 0.6$$
  Due to symmetry, $P(V_2=1) = 0.6$ and $P(V_3=1) = 0.6$.
  **Constraint Met:** Each voter is 60% competent.

  **2. Majority Competence**
  The majority is correct if 2 or 3 voters are correct ($\sum V_i \ge 2$). Looking at our table, the *only* outcome where 2 or more voters are correct is $(1, 1, 1)$. All other non-zero probability outcomes have exactly one correct voter.
  $$P(\text{Majority Correct}) = P(1,1,1) = 0.4$$
  **Constraint Met:** Majority (40%) is worse than the individual (60%).

  ---

  ### Which Premise is Violated?

  The specific premise of the Condorcet Jury Theorem that is violated is **Conditional Independence**.

  CJT assumes that given the true state of the world, voters make their errors independently. In information-theoretic terms, it assumes the voters are drawing from separate pools of evidence.

  In this model, the voters are **highly dependent**. Specifically, they exhibit a specific flavor of correlation that CJT is not robust against.

  ### Why This Correlation Flips the Result

  It is not enough to say "errors are correlated." Positive correlation usually just *slows* the convergence to certainty (the probability stays above 0.6 but doesn't approach 1 as $n$ grows). To make the majority **worse** than the individual, you need a specific structure: **The suppression of intermediate consensus.**

  Here is the mechanical breakdown of why this fails:

  1.  **Fragmented Truth:** In this model, "Correctness" is mutually exclusive unless it is unanimous. Look at the non-zero outcomes: either *everyone* is right, or *exactly one person* is right. There are no cases where a comfortable majority (2 out of 3) stumbles onto the truth while one person errs.
  2.  **Clumped Error:** Conversely, errors are correlated in pairs. In the state $(1, 0, 0)$, Voter 1 is right, but Voters 2 and 3 are **both** wrong. They agree on the wrong answer. Because this happens 60% of the time (the sum of the three "Only One Correct" states), the majority vote locks onto the error 60% of the time.
  3.  **The Variance Trap:** CJT works because averaging independent votes reduces variance.
      *   Under independence, the probability of "2 Right" is $3 \times (0.6)^2 \times (0.4) = 0.432$.
      *   In our model, the probability of "2 Right" is **0**.
      *   We have taken all the probability mass that *should* have been distributed across "2 Right" scenarios and shifted it into "1 Right" scenarios.

  **The Intuition:**
  Imagine three experts. In a normal CJT world, if the truth is hard to find, they might find it independently.
  In this counterexample world, the "Truth" is a fragile resource. If they find it, they all find it together (the 0.4 case). But if they miss it, they don't miss it randomly; they miss it in coordinated pairs. Two of them always conspire to be wrong together, outvoting the single person who happened to find the truth.

  This models a situation where **information sources are not diverse**. For example, if Voters 2 and 3 both read the same biased newspaper, while Voter 1 reads a different one, Voters 2 and 3 will be correlated in their errors. If the bias is strong enough, the "crowd" (the majority) will systematically follow the biased pair, performing worse than a random selection of a single voter (who has a 33% chance of being the independent Voter 1).

  ### Summary
  The naive claim "pool more opinions to get closer to the truth" relies entirely on the assumption that errors are not systematically coordinated. As soon as errors correlate such that wrong answers form majorities more often than right answers do (as seen in the 0.6 probability of 2-vs-1 errors above), the theorem not only fails to improve accuracy—it actively degrades it.
