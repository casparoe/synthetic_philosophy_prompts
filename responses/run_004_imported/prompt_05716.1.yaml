answer: |-
  I cannot write this essay for you to submit as your own work, as that would violate academic integrity policies. However, I can provide a comprehensive **argumentative blueprint** that picks a side, structures the paper, and details exactly how to handle the epistemic objection. This will save you significant time on research and structuring so you can focus on writing the prose.

  Given your professor's specific interest in the **epistemic objection** (the claim that soldiers can't know who is fighting justly), the strongest paper usually argues for **McMahan (Revisionism)**. Why? Because McMahan has a sophisticated response to this objection (the distinction between deep morality and the laws of war) that allows you to show nuance rather than just saying "Walzer is wrong."

  Here is a detailed roadmap for a paper arguing that **McMahan's revisionist account is morally superior, but Walzer's rules remain necessary as a practical legal heuristic.**

  ### Paper Title Idea
  *Beyond the Fog of War: Reconciling Revisionist Morality with Practical Law*

  ### Thesis Statement
  While Michael Walzer's defense of the Moral Equality of Combatants (MEC) offers necessary practical stability for international law, Jeff McMahan's revisionist critique correctly identifies the underlying moral reality: combatant liability is derived from responsibility for an unjust threat, not merely from status. Crucially, the standard epistemic objection (that soldiers cannot judge *jus ad bellum*) does not refute McMahan's moral theory; rather, it validates his distinction between the "deep morality of war" (which is revisionist) and the "laws of war" (which should remain Walzerian for epistemic reasons).

  ---

  ### Section 1: Introduction (approx. 10% of word count)
  *   **Hook:** Start with the intuitive tension. We feel it's wrong to kill for an unjust cause (like Nazi Germany), yet international law treats all soldiers equally.
  *   **Define the Conflict:** Briefly define Walzer's **Independence Thesis** (*jus in bello* is independent of *jus ad bellum*) vs. McMahan's **Liability Account** (you are only liable to be killed if you are morally responsible for an unjust threat).
  *   **State the Problem:** The main hurdle for McMahan is the **Epistemic Objection**: If soldiers can't know who is just, MEC is the only workable rule.
  *   **Thesis:** (Use the thesis statement above). Argue that McMahan wins on morality, but Walzer wins on policy—and McMahan actually agrees with this split.

  ### Section 2: Walzer's Traditionalism and the Independence Thesis (approx. 20%)
  *   **The Core Argument:** Explain Walzer's view in *Just and Unjust Wars*. Soldiers are "dangerous men" serving their state. Once in the "war convention," they are equals.
  *   **The Gladiatorial Analogy:** Walzer often implies a mutual risk agreement. If you put on the uniform, you are a target, regardless of your side's cause.
  *   **The Motivation:** Why does Walzer do this? To protect human rights and limit war's horrors. If unjust soldiers knew they had no right to fight, they might fight dirtier or refuse to surrender.
  *   **Critique Setup:** Note that Walzer conflates *legal* equality with *moral* equality. He argues that because we need equal rules, the morality must be equal. McMahan will challenge this inference.

  ### Section 3: McMahan's Revisionist Critique (approx. 25%)
  *   **The Liability Principle:** Explain McMahan's core moral claim from *Killing in War*. Liability to defensive harm is based on **moral responsibility for an unjust threat**.
  *   **The Asymmetry:** Just combatants fight in self-defense or defense of others. Unjust combatants are aggressors. Therefore, unjust combatants are liable to be killed; just combatants are not.
  *   **Why Walzer is Morally Flawed:** If MEC were true, a Nazi soldier and an Allied soldier would have an *equal moral right* to kill each other. McMahan argues this is absurd. The Nazi is morally liable; the Allied soldier is not.
  *   **Key Distinction:** Introduce McMahan's split between **Deep Morality** (what is actually right/wrong) and **The Law of War** (the rules we should enforce). This is crucial for your next section.

  ### Section 4: Engaging the Epistemic Objection (approx. 35%)
  *   *This is the most important section for your professor.*
  *   **The Objection:** Critics say McMahan's view is too demanding. Ordinary soldiers suffer from "invincible ignorance." They rely on propaganda, trust their leaders, and operate in the "fog of war." They cannot reliably determine if their war is just (*jus ad bellum*). Therefore, holding them morally liable is unfair.
  *   **McMahan's Concession (The Strategic Move):** Do not argue that soldiers *can* easily know the truth. Instead, argue that **epistemic limitations do not change the moral facts, they only change the legal application.**
      *   *Point A:* Just because a soldier *doesn't know* they are fighting unjustly doesn't mean they *aren't* fighting unjustly. Moral liability is objective, even if subjective blame is mitigated.
      *   *Point B:* McMahan argues that while soldiers might not be *blameworthy* (due to ignorance), they can still be *liable*. (Analogy: If I unknowingly carry a bomb into a crowd, I am not blameworthy, but I am still liable to be stopped/harmed to save the crowd).
  *   **The Law/Morality Split:** This is your clincher.
      *   **Deep Morality:** Follows McMahan. Unjust soldiers are liable.
      *   **International Law:** Should follow Walzer. Why? Because of the **Epistemic Constraint**. International tribunals cannot judge every soldier's subjective knowledge. To maintain order and reduce violence, we need a bright-line rule (MEC).
      *   **Synthesis:** Walzer is right about the *rules of the game*, but wrong about the *nature of the players*. McMahan allows us to keep Walzer's laws for practical reasons without accepting his flawed moral philosophy.

  ### Section 5: Conclusion (approx. 10%)
  *   **Restate Thesis:** Rephrase the argument that Revisionism captures the truth, while Traditionalism captures the necessity.
  *   **Final Thought:** Conclude that accepting McMahan's view doesn't lead to chaos. It allows us to judge wars more accurately (holding leaders responsible) while keeping the battlefield rules stable.
  *   **Closing:** The "Moral Equality" is a legal fiction necessary for order, not a moral truth.

  ---

  ### Key Arguments & Counter-Moves (Cheat Sheet for Writing)

  **1. If you need to defend McMahan against the "Invincible Ignorance" claim:**
  *   *Argument:* Soldiers have a **duty of inquiry**. In the modern age, information is accessible. Blind obedience is not a total moral shield.
  *   *Nuance:* Even if they are excused from *blame* (punishment), they remain *liable* (targetable). This distinction saves McMahan from the claim that his theory is too harsh on individual soldiers.

  **2. If you need to explain why we keep Walzer's laws:**
  *   *Argument:* Consequentialism. If we told soldiers "You have no right to fight if your cause is dubious," surrender rates might drop, and wars might become more brutal (fighting to the death). The "Walzerian Law" is a **useful fiction**.

  **3. Key Terminology to Use:**
  *   **Independence Thesis:** Walzer's claim that *jus in bello* is separate from *jus ad bellum*.
  *   **Liability Account:** McMahan's claim that you are only targetable if responsible for unjust harm.
  *   **Epistemic Asymmetry:** The idea that one side knows they are just, the other might not.
  *   **Deep Morality vs. Laws of War:** The McMahan distinction that saves the theory from practical collapse.

  ### Writing Tips for Speed
  1.  **Don't Summarize Too Much:** Your professor knows Walzer and McMahan. Spend 80% of the paper on the *critique* and the *epistemic objection*, not on explaining the basic theories.
  2.  **Use the "Law vs. Morality" Distinction Early:** Introduce this in the intro. It makes your paper look sophisticated immediately.
  3.  **Be Decisive:** Don't say "McMahan has a point, but Walzer also has a point." Say "McMahan is morally correct; Walzer is practically useful." This satisfies the "pick a side" requirement.

  ### Recommended Citations/References to Keep Handy
  *   Walzer, *Just and Unjust Wars* (Chapter on the War Convention).
  *   McMahan, *Killing in War* (specifically the chapters on Liability and the Epistemic Objection).
  *   McMahan, "The Ethics of Killing in War" (Philosophia, 2004) – good for the morality vs. law distinction.

  If you follow this structure, you will hit all the prompt requirements (picking a side, engaging the epistemic objection, discussing law vs. morality) without fluffing the word count. Good luck!
