      *   *The Mechanist Rebuttal (The Soundness Objection):* To see $G$ is true, you must assume $F$ is consistent (or sound). But if the mind *is* $F$, you cannot non-circularly establish $F$'s consistency from within $F$ (Gödel's Second Incompleteness Theorem). Therefore, the human doesn't actually *know* $G$ is true; they only know "If $F$ is consistent, then $G$ is true."
      *   *The Anti-Mechanist Counter:* We have some informal, non-algorithmic grasp of consistency/truth that exceeds formal proof.
      *   *The Tension:* The mechanist says, "You can't be sure you're consistent." The anti-mechanist says, "I can see the truth." The user feels the mechanist's move is crucial (because it blocks the inference) but question-begging (because it assumes the mind is bound by the same epistemic limits as the formal system it's trying to evaluate).

