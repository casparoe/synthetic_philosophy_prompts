answer: |-
  This is a sharp question that cuts to the heart of why the "Discursive Dilemma" (or Doctrinal Paradox) triggered a new research program in social epistemology rather than being filed away as a footnote to Arrow or Condorcet.

  You are right to suspect that on the surface, it looks like a cycling problem. However, the structural difference lies in the **ontology of the inputs** (truth-claims vs. orderings) and the **constraint of logical entailment** within the agenda itself.

  Here is a breakdown of why this is a distinct paradox, followed by a concrete walk-through of the impossibility mechanics you requested.

  ### 1. Preferences vs. Judgments: The Structural Difference

  In preference aggregation (Condorcet/Arrow), the inputs are orderings over options ($A \succ B \succ C$). The "rationality" constraint is **transitivity**. If the group prefers $A$ to $B$ and $B$ to $C$, they should prefer $A$ to $C$. When they don't, we get a cycle.

  In judgment aggregation (List/Pettit), the inputs are truth-values assigned to propositions ($P, Q, R$). The "rationality" constraint is **logical consistency** (deductive closure). If the group accepts $P$ and accepts $P \to Q$, they must accept $Q$.

  **Why this distinction matters:**
  1.  **Atomic vs. Molecular:** In preference aggregation, options are typically treated as atomic. There is no logical requirement that preferring $A$ to $B$ entails anything about $C$. In judgment aggregation, the agenda is explicitly **interconnected**. The propositions themselves have logical relations ($R \leftrightarrow P \land Q$).
  2.  **The Nature of the Error:** A Condorcet cycle implies the group has no stable "best" option. A discursive dilemma implies the group holds **contradictory beliefs**.
      *   If a committee has cyclical preferences, they are indecisive.
      *   If a court issues a judgment that says "The contract was breached" ($P$), "There was no excuse" ($Q$), but "No damages are owed" ($\neg R$, where $R \leftrightarrow P \land Q$), they have issued a legally incoherent ruling. They are not just indecisive; they are logically incompetent.

  The paradox is deeper because it suggests that a collection of perfectly rational individuals, voting democratically on every single issue, can produce a collective agent that is **logically irrational**.

  ### 2. The Concrete Walk-Through: The Impossibility Mechanics

  You asked for a walk-through of why no aggregation rule can satisfy the standard conditions. The seminal result here is the **List-Pettit Theorem (2002)**.

  Let's define the setup formally to see where the gears grind.

  **The Agenda:**
  We have three propositions: $\{P, Q, R\}$.
  Constraint: $R \leftrightarrow (P \land Q)$.
  A "rational" judgment set must respect this constraint (e.g., you cannot accept $\{P, Q, \neg R\}$).

  **The Conditions:**
  1.  **Universal Domain:** The rule must accept any profile of individual judgment sets, provided each individual set is logically consistent.
  2.  **Collective Rationality:** The output of the rule must be a complete and consistent set of judgments.
  3.  **Anonymity:** All voters are treated equally (permutation of voters doesn't change the outcome).
  4.  **Systematicity:** This is the killer constraint. It combines **Independence** (the collective judgment on $P$ depends only on individual judgments on $P$) and **Neutrality** (the same functional relationship applies to all propositions).
      *   *Intuitively:* Systematicity demands **proposition-wise majority voting**. It forbids you from looking at the vote on $P$ to decide the outcome on $R$.

  **The Conflict:**
  Let's run the profile you likely saw in seminar (The "Paradox Profile"):

  | Judge | $P$ (Breach?) | $Q$ (Excuse?) | $R$ (Damages?) |
  | :--- | :---: | :---: | :---: |
  | **1** | Yes | Yes | Yes |
  | **2** | Yes | No | No |
  | **3** | No | Yes | No |
  | **Majority** | **Yes** | **Yes** | **No** |

  *   **Individual Rationality:** Check every row.
      *   J1: $T, T, T$ (Consistent with $R \leftrightarrow P \land Q$)
      *   J2: $T, F, F$ (Consistent)
      *   J3: $F, T, F$ (Consistent)
      *   *Universal Domain is satisfied.*
  *   **Applying Systematicity:** We apply the same aggregation function (Majority Rule) to each column independently.
      *   $P$: 2 Yes, 1 No $\to$ **Yes**
      *   $Q$: 2 Yes, 1 No $\to$ **Yes**
      *   $R$: 1 Yes, 2 No $\to$ **No**
  *   **Checking Collective Rationality:** The collective set is $\{P, Q, \neg R\}$.
      *   Since $P \land Q \to R$, accepting $P$ and $Q$ entails accepting $R$.
      *   The collective set is **inconsistent**.

  **The Impossibility Proof Logic:**
  List and Pettit prove that for any agenda that is "non-trivial" (contains interconnected propositions like the above), **no function exists** that satisfies all four conditions.

  Why? Because **Systematicity** forces you to treat propositions as atomically independent. It blinds the aggregation rule to the logical connectives *between* the propositions.
  *   To satisfy **Collective Rationality**, the rule must be sensitive to the logical connection between $P, Q,$ and $R$. (i.e., The decision on $R$ *must* depend on the decisions on $P$ and $Q$).
  *   But **Systematicity** explicitly forbids the decision on $R$ from depending on the inputs for $P$ and $Q$.
  *   Therefore, you must drop Systematicity or Collective Rationality.

  ### 3. Premise-Based vs. Conclusion-Based: What is Lost?

  Since we cannot satisfy all conditions, we must choose a procedure that violates one. This is where the "Dilemma" becomes philosophical.

  **Option A: Proposition-wise Majority (Violates Collective Rationality)**
  *   *Mechanism:* Vote on everything.
  *   *Result:* $\{P, Q, \neg R\}$.
  *   *Loss:* The group is logically inconsistent. In social epistemology, this is catastrophic. It means the group cannot act as a unified epistemic agent. If the group is a corporation or a court, it can be sued for inconsistency. It undermines the claim that the group "knows" or "believes" anything.

  **Option B: Premise-Based Procedure (Violates Systematicity/Responsiveness)**
  *   *Mechanism:* Vote on $P$ and $Q$. Derive $R$ logically.
  *   *Result:* $P$ (Yes), $Q$ (Yes) $\to$ $R$ (Yes).
  *   *Loss:* The outcome on $R$ (Yes) contradicts the majority vote on $R$ (No).
  *   *Philosophical Cost:* This prioritizes **reasons over outcomes**. It preserves collective rationality but violates democratic responsiveness on the conclusion. It says, "The majority wanted $\neg R$, but the majority also wanted the premises that entail $R$, so we will ignore their direct vote on $R$."

  **Option C: Conclusion-Based Procedure (Violates Systematicity/Integrity)**
  *   *Mechanism:* Vote on $R$. Ignore $P$ and $Q$ (or adjust them to fit).
  *   *Result:* $R$ (No).
  *   *Loss:* To maintain consistency, you must assert either $\neg P$ or $\neg Q$ collectively, even though the majority voted Yes on both.
  *   *Philosophical Cost:* This prioritizes **outcomes over reasons**. It creates a "black box" collective. The group decides the verdict without agreeing on the justification. This is often criticized in law (rulings require *ratio decidendi*) and science (theories require evidence).

  ### 4. Why this isn't just Condorcet Cycling

  You asked specifically about the comparison to Condorcet. Here is the structural distinction:

  1.  **Possibility vs. Necessity:** Condorcet cycles are *possible* under majority rule, but they depend on specific preference profiles. In many profiles, majority rule yields a transitive ordering.
      *   In the Discursive Dilemma, the inconsistency is **guaranteed** for *any* profile where the premises are split in this specific way. More importantly, the **Impossibility Theorem** shows that *no rule* (not just majority) can satisfy the conditions for *any* connected agenda. It is a stronger impossibility result than Condorcet's.
  2.  **The Agenda Constraint:** In preference aggregation, we assume the set of options is fixed. In judgment aggregation, the **logical structure of the agenda** is the source of the tension. The paradox arises *because* the propositions are logically linked. If $P, Q, R$ were unrelated, proposition-wise majority would work fine. The paradox proves that **democratic aggregation is incompatible with logical entailment** under conditions of systematicity.
  3.  **Epistemic vs. Pragmatic:** Preferences are subjective utilities. Judgments are truth-claims.
      *   If a group has cyclical preferences, it just means they can't decide what to eat.
      *   If a group has contradictory judgments, they are asserting $X$ and $\neg X$ are both true. In social epistemology, this challenges the very possibility of **collective knowledge**. If the group's belief set is inconsistent, the group cannot be a knower.

  ### Summary: The Philosophical Stakes

  The Discursive Dilemma is treated as a genuine paradox because it demonstrates a limit on **Collective Intentionality**.

  We often speak of "the court holding," "the government believing," or "the committee deciding." We treat these groups as singular agents. The List-Pettit result shows that if we demand these groups be **democratic** (Anonymity), **comprehensive** (Universal Domain), and **procedurally fair** (Systematicity), they **cannot be rational** (Collective Rationality).

  To save collective rationality, we must abandon the idea that the group's judgment is simply the sum of its parts (violating Systematicity). We must impose a structure (like a premise-based procedure) that privileges logical coherence over direct majoritarianism on every specific issue.

  This is why it's not just a voting artifact: it forces us to choose between **democratic responsiveness** (doing what the majority says on every question) and **collective agency** (being a coherent, rational entity). You cannot have both when the questions are logically interconnected.
