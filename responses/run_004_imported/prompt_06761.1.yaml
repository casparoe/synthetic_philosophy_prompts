answer: |-
  This is one of the most honest and difficult questions adult children of aging parents face. You are grappling with a classic problem in moral philosophy, though it rarely presents itself so starkly in real life. You are trying to reconcile the concept of **obligation** with the concept of **saintliness**, and you are worried that acknowledging one undermines the other.

  The short answer is: Yes, there is a coherent way to hold both thoughts. But to get there, we have to untangle three specific knots: the definition of duty, the value of sacrifice, and the reality of the "next in line" argument.

  ### 1. The Category of the "Supererogatory"
  In ethics, there is a specific term for what your brother is doing: **supererogation**.

  *   **Obligatory:** What you must do (e.g., not harm your father, ensure he is fed and safe).
  *   **Forbidden:** What you must not do (e.g., abuse or neglect him).
  *   **Supererogatory:** Actions that are morally good but not morally required. These are acts "above and beyond the call of duty."

  Your family's consensus—that your brother's choice is "wonderful" but that a weekend-plus-aide arrangement is "blameless"—is actually a precise moral judgment. You are collectively agreeing that the baseline obligation (duty) is met by ensuring Dad's safety and comfort via professional help. Your brother, however, has chosen to pursue an *ideal* rather than just meeting the *obligation*.

  This resolves your first conflict: **His choice is "better" in the sense of being more virtuous, but not "better" in the sense of being more mandatory.**

  Think of it like tipping. In many cultures, leaving a 15% tip is the baseline obligation (duty). Leaving a 50% tip is incredibly generous and admirable (supererogatory). If you leave 15%, you haven't done anything wrong. But the person leaving 50% has done something "better." You are not "falling short" of a moral requirement, but you are acknowledging that they have reached a higher peak of generosity than you have.

  ### 2. The Metric of Sacrifice
  You asked: *If the weekend version is blameless, in what sense is my brother's choice better?*

  The "betterness" here isn't necessarily about the outcome (Dad gets fed either way). It is about the **cost to the agent.**

  Moral praise is usually tied to sacrifice. If a billionaire donates $1,000 to charity, it is nice. If a single parent working two jobs donates $1,000, it is heroic. The action is the same; the cost is different.

  Your brother has paid a cost that you and the other siblings have not: his career trajectory, his savings, his autonomy, and likely his future relationship prospects. By defining his action as "admirable," your family is acknowledging the weight of that sacrifice. If you were to say, "Actually, what he's doing isn't better, it's just different," you would be erasing the magnitude of what he has given up.

  To acknowledge his action is "better" is simply to acknowledge that he has paid a higher price for the same result. That doesn't mean you *owed* that price. It just means he *paid* it.

  ### 3. The "Next in Line" Fallacy
  Your second nagging thought is: *If he hadn't stepped up, the job would have landed on me... did he just get there first and take on a duty that was always going to belong to somebody?*

  This is a common defense mechanism against guilt, but it doesn't hold up under scrutiny for two reasons.

  **First, the duty was shared, not singular.**
  If your brother hadn't stepped up, the duty wouldn't have automatically become 100% yours. It would have become a family negotiation. You might have been pressured into it, or you might have successfully argued for the professional care model you proposed. By stepping up, your brother didn't just "claim a duty"; he **absorbed a shared burden.** He relieved *you* of the guilt of having to say no, and he relieved the *family* of the financial cost of aides. He didn't take your turn; he took the whole shift.

  **Second, hypothetical willingness is not actual sacrifice.**
  You say that if he hadn't done it, you would have. That is a hypothetical. It is easy to be heroic in the abstract. The reality is, he *did* it, and you *did not*. Even if you believe you would have made the same sacrifice in a counterfactual universe, in this universe, he is the one standing in the kitchen falling asleep while reheating dinner. The moral weight lies in the actual endurance of the burden, not the theoretical willingness to bear it.

  ### 4. The Danger of the "Hero" Label
  There is, however, a dark side to the family's praise that you are intuitively sensing.

  By labeling his actions as "heroic" and "above and beyond," the family may be inadvertently trapping him. If caregiving is a "holy sacrifice," then admitting it is too much becomes a moral failure. If he asks for help now, does he stop being the hero?

  The image you described—him nearly falling asleep standing up—is not a picture of virtue; it is a picture of **unsustainable systems.**

  This is where your guilt can be transmuted into something useful. You are worried that acknowledging his goodness makes you look bad. But the more pressing ethical issue is that his "supererogatory" behavior is burning him out.
  *   If you view his choice as "better," you might feel pressured to match it (which you can't/won't).
  *   If you view his choice as "optional," you might feel free to ignore the warning signs of his exhaustion.

  ### A Coherent Way Forward
  You can hold both thoughts without contradiction if you frame it this way:

  1.  **Your brother has chosen a higher moral ceiling than the family baseline.** He is operating on a ethic of total self-sacrifice. You are operating on an ethic of sustainable responsibility. Both are valid, but his costs more.
  2.  **You are not "falling short" of duty, but you are benefiting from his grace.** You are receiving a gift (Dad being cared for by family, you keeping your career) that you did not earn. It is okay to feel gratitude mixed with discomfort. That discomfort is the recognition of the gift's value.
  3.  **The "Better" Thing needs support, not just praise.** If his way is "better" but unsustainable, the ethical response from the "decent" siblings is not to try to become heroes themselves, but to support the hero so he doesn't collapse.

  **The Verdict:**
  You are not confusing two things. You are correctly identifying a tension between **obligation** (what we owe) and **aspiration** (what we hope for).

  Your brother is living in the realm of aspiration. You are living in the realm of obligation. Neither is wrong. But because his aspiration is currently putting him at risk (falling asleep while cooking), your "decent" role is to step in not by taking over the caregiving (which he refuses), but by taking over the *support* of the caregiver.

  He gave up his career and savings. The "decent" thing for you to do, since you kept yours, is to ensure he doesn't end up destitute or ill from exhaustion. That bridges the gap: you acknowledge his sacrifice is "more" than yours, and you balance the scales not by matching his sacrifice, but by protecting him from the consequences of it. That is how you honor the "better" choice without having to make it yourself.
