answer: |-
  That is a fantastic catch for a longread, but your hypothesis—that it was a disconnected hobby born of credulity—is actually **incorrect on both counts.**

  It wasn't a hobby, and Sidgwick wasn't credulous. In fact, his involvement with the Society for Psychical Research (SPR) was a direct, desperate attempt to solve a catastrophic problem he had uncovered in his own ethical system.

  If you portray it as a quirky sidebar, you'll miss one of the most tragic and fascinating tensions in the history of moral philosophy. Here is the actual link between the ghost-hunting and the ethics.

  ### 1. The Ethical Crisis: The "Dualism of Practical Reason"
  To understand the ghosts, you have to understand the conclusion of *The Methods of Ethics* (1874). Sidgwick is the great systematizer of Utilitarianism. He argues that we should maximize the general good. But he is also an egoist; he acknowledges that it is equally rational to maximize one's own happiness.

  Usually, we assume these two align (that doing good makes you happy, or that God ensures virtue is rewarded). But Sidgwick, writing in a post-Darwinian, increasingly secular Victorian era, realized he couldn't prove that alignment.

  He concluded with what he called the **"Dualism of Practical Reason."**
  *   **Reason A:** Tells me to maximize my own good.
  *   **Reason B:** Tells me to maximize the universal good.
  *   **The Problem:** If there is no afterlife and no divine justice, these two often conflict. If I can get away with a selfish act that hurts the world but helps me, **it is arguably more rational to be selfish.**

  Sidgwick wrote that if he couldn't reconcile this, he would have to view morality as a "noble delusion." He couldn't accept that. He needed morality to be *rationally binding*.

  ### 2. Psychical Research as Empirical Theology
  This is where the Society for Psychical Research comes in. Sidgwick didn't join the SPR because he loved séances; he joined because he needed **empirical evidence for the soul.**

  Traditional religion was crumbling under scientific scrutiny. Sidgwick wanted to save the *moral function* of religion (cosmic justice, afterlife rewards/punishments) without accepting religious dogma. He hoped that if psychical research could scientifically prove **survival of death** or **telepathy**, it would provide the naturalistic evidence needed to suggest a moral order to the universe.

  If you can prove the soul survives death, you open the logical space for a system where virtue is eventually rewarded and vice punished, even if not in this life. That would resolve the Dualism of Practical Reason. It would make being moral the *rationally self-interested* choice in the long run.

  As Sidgwick put it, he was looking for "evidence of a moral government of the world."

  ### 3. He Wasn't a "Credulous Sucker"
  Your intuition that this clashes with his hyper-rational persona is correct, but you've diagnosed the clash wrong. He didn't suspend his skepticism for the SPR; he applied his *Methods of Ethics* rigor to the paranormal.

  Sidgwick was famously difficult to convince. He spent decades exposing fraudulent mediums. He approached psychical research with the same cold, empirical eye he applied to utilitarianism. He wasn't looking for magic; he was looking for data anomalies that could withstand scientific scrutiny.

  The tragedy of Sidgwick's later life is that he **never found the proof he needed.** He remained an agnostic to the end. He died knowing that his ethical system rested on a hope he could not empirically verify. In a letter to a friend, he wrote:
  > *"I have never been able to believe... that the moral law is the command of a Being who has the power to enforce it... I have to admit that I do not know whether the universe is friendly to morality."*

  ### 4. Why This Matters for Your EA Longread
  This is crucial context for the intellectual roots of Effective Altruism.

  *   **The Secular Shift:** Modern EA (via Peter Singer) largely sidesteps Sidgwick's Dualism by simply asserting that the impartial standpoint is the only rational one, dropping the requirement for cosmic sanctions. Sidgwick's ghost-hunting highlights how much harder the problem was for the Victorians. They needed God (or ghosts) to make the math work; modern EA tries to make the math work without Him.
  *   **The Limits of Empiricism:** Sidgwick's story is a cautionary tale about the limits of evidence. He wanted to treat ethics like physics. When the physics (psychical research) failed to yield data, he was left with a moral system that lacked a rational foundation. It shows that EA's reliance on "evidence" works for *means* (which charity saves the most lives), but struggles with the ultimate *ends* (why we should care about strangers at all).
  *   **The Hidden Motivation:** It humanizes Sidgwick. He wasn't just a cold calculator; he was a man terrified that the universe was indifferent to suffering, spending 20 years hunting for ghosts because he was desperate to prove he was wrong.

  ### The Verdict
  Don't frame it as a "weird hobby." Frame it as a **philosophical rescue mission.**

  Sidgwick broke ethics with his left hand (*Methods of Ethics*) and spent the rest of his life trying to fix it with his right hand (SPR). The connection is absolute. He investigated mediums because he was trying to find the scientific proof required to make Utilitarianism rational.

  If you write it as "The philosopher who wanted to prove the universe was moral so he wouldn't have to admit selfishness was rational," you'll have a much stronger narrative than "The philosopher who liked ghosts."
