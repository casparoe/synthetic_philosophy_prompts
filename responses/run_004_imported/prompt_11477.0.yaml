  I'm working on a longread about the intellectual roots of effective altruism, and I went down a rabbit hole on Henry Sidgwick, the Victorian philosopher whose utilitarianism underpins a lot of EA thinking. Turns out the guy co-founded and repeatedly served as president of the Society for Psychical Research for the better part of two decades, personally testing mediums and telepathy claims for most of the rest of his life. Its such a weird fit with the guy who wrote the ultra-careful, hyper-rational Methods of Ethics that I'm just gonna assume it was a totally separate hobby -- like a rigorous philosopher who happened to be a credulous sucker for ghosts in his spare time, with no real connection to his actual philosophical work. Is that basically right, or is there an actual link between the ghost-hunting and the ethics that I'm missing?
