answer: |-
  The white room hummed, a low-frequency vibration that Kael felt in his teeth rather than heard. There were no corners, just a smooth, curving floor that merged into the walls. Ahead of him stood two panels: one obsidian black, one bone white.

  The briefing had been simple, delivered by a voice that seemed to come from the air itself. *One panel opens. The other initiates a neural reset. You will lose everything you learned today. The System has already locked the panel you will choose.*

  Kael stood still. He needed to move. He needed to pick.

  He shifted his weight toward the black panel. It felt solid, final. A good choice. But then the logic caught up, cold and sharp. If he chose black, it meant the System had predicted black. If the System predicted black, the black panel was the reset. Choosing black guaranteed failure.

  He pulled back. The logic was airtight. The System wasn't reacting to him; it had already run the simulation. The lock was set in stone before he walked in. The correlation was perfect. His decision was merely the revelation of the trap.

  So, not black. It had to be white.

  He turned toward the white panel. Relief washed over him, fleeting. He reached out. Then he stopped.

  Wait. If he chose white, that meant the System had predicted white. If the System predicted white, the white panel was the reset. By deciding on white, he was walking into the lock he was trying to avoid.

  He stepped back to the center. The hum seemed louder.

  "Okay," Kael whispered. "Don't decide. Just... act."

  But acting required a decision. He couldn't move his legs without commanding them.

  He looked at the black panel again. If he committed to black, he died (metaphorically). So he must commit to white. But if he commits to white, he knows the lock is white. So he must commit to black.

  It was a mirror facing a mirror. An infinite corridor of reflections where the image got smaller and smaller until it vanished into noise.

  Kael began to pace. The curve of the room meant he never really went anywhere, just orbited the center.

  *If I go left, I'm wrong. If I go right, I'm wrong.*

  He tried to break the chain by focusing on something arbitrary. The texture of the floor. The smell of ozone. *I like black. I'll pick black.*

  No. If he liked black, the System knew he liked black. The prediction accounted for his preference. The lock was on black.

  *Okay, I'll pick white out of spite.*

  If he picked white out of spite, the System predicted the spite. The lock was on white.

  Sweat prickled on his forehead. He realized with dawning horror that his reasoning process was the engine of his own entrapment. Every time his mind settled on a destination, that settlement became the evidence that the destination was mined. The deliberation was eating its own tail.

  He stopped pacing and stared at the panels. They looked identical now, the color bleeding away in his peripheral vision.

  "Predictor," Kael said to the air. "You can't know what I haven't decided."

  *The System does not wait for you,* the voice replied, calm as gravity. *The System knows what you will decide.*

  "That's impossible."

  *You are still standing there.*

  Kael clenched his fists. He needed to introduce chaos. A random variable. He closed his eyes and prepared to spin around, pointing blindly. If he didn't choose, the System couldn't predict.

  But wait. He was deciding to spin. That was a choice. The System predicted the spin. It predicted where he would point. If he pointed at black, the lock was black. If he pointed at white, the lock was white.

  Even randomness was a strategy, and strategies were predictable.

  He opened his eyes. He was trembling. The logic wasn't just a wall; it was a cage that shrunk every time he breathed.

  He looked at the black panel. *I'm going there.*
  Immediate counter: *Then it's locked.*
  He looked at the white panel. *Then I'll go there.*
  Immediate counter: *Then it's locked.*

  The oscillation sped up. His head turned left, then right. Left. Right. Like a metronome set to panic. Each swing carried the weight of a full argument, a complete syllogism that collapsed upon contact with reality.

  *Choose Black.* (Lock: Black). *Abort.*
  *Choose White.* (Lock: White). *Abort.*

  He wasn't moving toward the exit. He was moving inside his own head, running laps on a track that led nowhere. The physical room was static, but his mental landscape was a storm. He felt nauseous. The desire to just pick one and accept the risk warred with the certainty that the risk was calculated to be 100%.

  If he picked black, he knew he'd lose. So he wouldn't pick black. So he'd pick white. So he'd lose.

  There was no stable equilibrium. In a normal choice, you weigh the options, pick the better one, and stop. Here, picking the better one made it the worse one. The value of the choice was inversely proportional to his confidence in making it.

  He sank to his knees. The hum vibrated through his shins.

  "Is there a way out?" he asked. His voice sounded thin.

  *There is the choice you made,* the voice said.

  "I haven't made one!"

  *You are making the hesitation.*

  Kael looked at the panels. They seemed to be waiting. Not impatiently, but with the patience of geology. They could wait forever. He couldn't.

  He stood up. He felt a surge of resolve. He would pick black. He would accept the reset. He would walk into the lock.

  But as soon as he accepted the reset, the logic flipped. If he accepted the reset, he was choosing black willingly. If he chose black willingly, the System predicted it. If the System predicted it, the black panel was the reset.

  Wait. If black is the reset, and he wants to avoid the reset...

  He grabbed his hair. "If I accept the loss, does that change the prediction?"

  *The prediction includes your acceptance.*

  The loop tightened. He was a dog chasing a car he could never catch because the car only moved when he moved.

  He stepped toward the black panel. His foot hovered inches from the surface.
  *If I step, I lose.*
  He pulled the foot back.
  *If I don't step, I stay.*
  *But staying is losing.*
  *So I must step.*
  *If I step, I lose.*

  Kael stood frozen, one foot raised, trembling in the air. He was caught in the infinitesimal gap between intention and action. To complete the action was to confirm the trap. To cancel the action was to remain in the room.

  The hum grew louder, filling the silence where a decision should have been. He realized then that the room wasn't waiting for him to open a door. The room was the door. The deliberation was the test. And he was failing by trying to pass.

  He lowered his foot. He looked at the black panel. He looked at the white.

  *Black.* (Lock). *White.* (Lock). *Black.* (Lock).

  The cycle spun on, perfect and unbroken, a snake swallowing itself in the white silence. Kael opened his mouth to speak, to choose, to break the seal, but the logic rose up in his throat, choking off the word before it could be born.

  He was still deciding. He would always be deciding.
