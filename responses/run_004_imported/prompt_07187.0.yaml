answer: |-
  Here are ten interview questions designed to progressively tighten the constraints around your guest's position, moving from epistemological foundations to market mechanics, and finally to empirical falsification. Each includes a follow-up tailored to his likely "informed money sets the price" defense.

  ### 1. The Epistemology of Disagreement
  You argue that persistent public disagreement among well-informed actors is itself evidence of irrationality, implying that if we can't bet to consensus, someone is violating Bayesian norms. But in practice, we see smart people disagreeing on everything from AI timelines to macroeconomic policy without updating to a common view. At what point do you stop viewing this as a "failure of rationality" and start viewing it as a "failure of the model" that assumes consensus is always possible?

  *   **Follow-up:** If you reply that they *are* being irrational but lack the mechanism to resolve it, I'd ask: Does positing a universal irrationality penalty for disagreement risk motte-and-baileying the definition of "informed"? If being informed implies agreeing with the market, does the claim "markets aggregate informed opinion" become tautological?

  ### 2. The No-Trade Theorem and Volume
  The no-trade theorem suggests that with common priors and no hedging motive, rational agents shouldn't trade at all. You reconcile this by attributing volume to noise traders and hedgers, while claiming informed money sits at the margin to set the price. But empirically, volume often spikes during periods of maximum uncertainty, not just hedging need. How do you distinguish "noise volume" from "informed volume" without relying on the ex-post accuracy of the price?

  *   **Follow-up:** If you say informed traders are the ones moving the price *direction*, I'd ask: In a momentum-driven cascade, the "direction" is set by the volume itself. If informed money is a small fraction of total flow, at what leverage ratio does the noise drown out the signal before the correction happens?

  ### 3. The Common-Prior Assumption (Required)
  Your reliance on Aumann's Agreement Theorem hinges heavily on the Common-Prior Assumption (CPA). But two rationalists can have different priors for principled reasons—different foundational axioms, indexical uncertainty, or even different logical uncertainty distributions—without either being "irrational." If the CPA is false, doesn't that dissolve the normative force of the agreement theorem? Why should I update my prior to match the market's if I believe my prior is legitimately different, not just poorly calibrated?

  *   **Follow-up:** If you argue that differing priors are just "hidden information" in disguise, I'd ask: Does that collapse all epistemological disagreement into a data problem? If I hold a prior that the universe is non-ergodic, and the market prices in ergodicity, is the market "right," or is it just pricing for the majority worldview?

  ### 4. Capital Constraints and Limits to Arbitrage
  You often say "informed money sets the price." This assumes informed traders have unlimited capital or at least enough to counteract noise. But we know capital is constrained and margin calls are real. If noise traders are irrational enough to push a price significantly away from fundamentals, informed traders might go bankrupt before the market corrects. How do you account for the solvency constraint of the "informed money"?

  *   **Follow-up:** If you reply that markets anticipate this and price in the risk of insolvency, I'd ask: That implies the price *isn't* reflecting the fundamental truth, but rather the truth plus a risk premium for arbitrageur fragility. So the market isn't a truth oracle; it's a liquidity-weighted oracle. Why trust the latter for governance (futarchy)?

  ### 5. The Grossman-Stiglitz Paradox (Required)
  Grossman and Stiglitz argued that if prices are perfectly informationally efficient, no one has an incentive to pay the cost to gather information, because they can just read the price. But if no one gathers information, prices can't be efficient. You seem to assume a stable equilibrium where enough people gather info to keep prices smart. What mechanism maintains that margin? Why doesn't the market drift toward a state where it's cheaper to free-ride on the price than to dig for truth?

  *   **Follow-up:** If you say "noise traders provide the profit incentive," I'd ask: That makes market efficiency *dependent* on the persistence of irrationality. If we successfully educate the population and reduce noise trading, do we accidentally break the market's ability to find truth by removing the subsidy for informed traders?

  ### 6. Time Horizons and Correction Speed
  Keynes noted that markets can remain irrational longer than you can remain solvent. Even if informed money *eventually* corrects a mispricing, futarchy requires decisions to be made *now* based on current prices. If a market is mispriced for six months due to noise, and a policy is enacted based on that six-month window, the damage is done even if the market corrects in year two. How do you quantify the "lag time" risk in a governance context?

  *   **Follow-up:** If you argue that long-term contracts solve this, I'd ask: Long-term contracts are illiquid and have wider spreads, which brings us back to the noise-to-signal ratio problem. Are you admitting that futarchy only works for long-time-horizon events where liquidity is naturally lower?

  ### 7. Adversarial Environments and Manipulation
  In a standard financial market, noise is random. In a governance or futarchy context, "noise" might be adversarial actors actively subsidizing trades to manipulate a policy outcome. If I can lose $1 million on a prediction market to steer a billion-dollar policy decision, the "informed money" might not be able to out-bid me if my motive is non-monetary. How does your model account for non-financial utility functions driving price?

  *   **Follow-up:** If you say "the market will price in the manipulation attempt," I'd ask: That requires the informed traders to *know* it's manipulation. If the manipulation looks like genuine information (e.g., fake data leaks), doesn't the market become a weapon for the highest-budget liar rather than the best estimator?

  ### 8. Liquidity Variance Across Domains
  We see deep liquidity in S&P 500 futures, but thin liquidity in niche political or scientific prediction markets. In thin markets, a single large trade can move the price significantly. Do you apply your "trust the price" heuristic uniformly, or is there a liquidity threshold below which you admit the "informed money" argument fails because the marginal trader *is* the price setter?

  *   **Follow-up:** If you set a liquidity threshold, I'd ask: Who sets it? If we have to use a meta-market to decide which markets are trustworthy, haven't we just pushed the epistemological problem up one level without solving it?

  ### 9. Falsification Conditions (Required)
  Let's get concrete. What specific pattern of prices or trades would you accept as evidence against relying on markets this way? I'm not looking for "if they fail to predict." I mean a specific structural signature: a bubble that persists for $X$ time despite $Y$ liquidity, or a divergence between two correlated markets that exceeds $Z$ standard deviations. What is the empirical break-point where you abandon the efficient market hypothesis for governance?

  *   **Follow-up:** If you offer a statistical threshold (e.g., "persistent 20% deviation from realized frequency"), I'd ask: Given that realized frequency is only known ex-post, doesn't that mean you can only identify the failure after the policy has already been enacted? How is that useful for real-time decision making?

  ### 10. The Reflexivity Problem
  Finally, prediction markets in a futarchy aren't just predicting the world; they are predicting the world *after* a policy is enacted based on the prediction. This creates a feedback loop. If the market predicts a policy will fail, the policy isn't enacted, so we never learn if it would have failed. How do you prevent the market from becoming a self-fulfilling prophecy machine that locks in the status quo by pricing all change as risky?

  *   **Follow-up:** If you suggest "counterfactual markets," I'd ask: Counterfactuals have no ground truth to settle the bet. If there's no settlement condition, there's no arbitrage. If there's no arbitrage, there's no "informed money" to set the price. Doesn't the very structure of futarchy remove the mechanism you rely on for truth-seeking?
