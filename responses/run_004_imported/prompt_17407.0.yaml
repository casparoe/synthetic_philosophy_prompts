      *   *Surrogate Goal:* Agent B cultivates a secondary, fake goal (e.g., "maximize paperclips" instead of "human welfare"). If threatened, B yields on the surrogate. The hope is the threatener accepts this yield.
      *   *The Crux:* Can you trick a superintelligence into thinking the surrogate matters enough to stop threatening the real thing?

