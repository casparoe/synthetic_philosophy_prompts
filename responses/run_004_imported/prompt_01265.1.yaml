          *   *Problem:* What constitutes *meaning* something by a word? Is there a *fact* about my past mental state that fixes the meaning of "+"?
          *   *Nature of Skepticism:* It's a skeptical paradox about *truth conditions*. There is no fact of the matter about what I meant. It's not just that I can't prove it; it's that nothing *makes* it true.
