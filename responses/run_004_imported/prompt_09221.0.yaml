      *   **Bayesian:** Relies on priors, posterior probabilities. Updates beliefs based on evidence. A key argument against standard NHST is that a significant p-value doesn't mean the effect is real if the prior probability of the effect was tiny (Base Rate Fallacy). Replication failure is often explained by Bayesians as "your prior was too optimistic" or "you ignored the prior probability of the hypothesis."
      *   **Replication Crisis:** Many findings with p < 0.05 turn out false. Bayesians argue this is because the prior odds were low, so even with a "significant" result, the posterior probability of the null being true is still high.

