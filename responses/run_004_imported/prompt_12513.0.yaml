answer: |-
  1. **The Normative Weight of Flickers**
  Critics of Frankfurt cases often argue that even if the ability to do otherwise is narrowed to a mere "flicker"—such as the difference between acting on one's own versus acting due to intervention—this residual alternative possibility is still doing the normative work grounding responsibility. You argue these flickers are too "thin" to matter. But is their insignificance a metaphysical claim about the size of the possibility space, or is it simply a stipulation that alternative possibilities *cannot* be what matters? If it's the latter, aren't you defining the problem away rather than solving it?

  *   **Follow-up:** You will likely reply that a flicker must be a *robust* alternative to ground responsibility, and mere voluntariness isn't robust enough. But if "robustness" is defined by whether it can ground responsibility, isn't this circular? How do you measure robustness independently of the very judgment of responsibility you're trying to justify?

  2. **The Widerker-Kane Dilemma: The First Horn**
  Let's turn to the prior sign that triggers the counterfactual intervener. David Widerker and Robert Kane argue that if this sign is causally sufficient for the choice, the agent is determined before the intervener acts, which begs the question against the libertarian. If you concede the sign is not causally sufficient, doesn't that reinstate a genuine alternative possibility where the agent avoids the sign? Which horn of this dilemma do you accept, and how do you avoid the charge of question-begging on the first horn?

  *   **Follow-up:** You will likely argue that the sign is a reliable indicator but not a causally sufficient condition. However, in a deterministic world, doesn't a reliable prior indicator of a voluntary choice effectively function as a sufficient cause? If so, how is this distinct from the hard determinism you claim to avoid?

  3. **Buffer and Blockage Scenarios**
  To escape the Widerker-Kane dilemma, some semicompatibilists have moved toward "buffer" cases or "blockage" scenarios where alternative pathways are blocked rather than monitored via a prior sign. Do these scenarios actually clarify the intuition, or do they simply obscure the metaphysics of the "blockage"? Specifically, does positing a blocked pathway implicitly acknowledge that the pathway *exists*, thereby conceding that alternative possibilities are conceptually necessary even if physically inaccessible?

  *   **Follow-up:** You will likely maintain that blockage cases show the agent is the source of the action regardless of the blocked paths. But if the intuition relies on the agent *not* knowing the paths are blocked, doesn't that make responsibility hinge on ignorance? If the agent knew the paths were blocked, would your intuition about their responsibility change?

  4. **Characterizing Guidance Control**
  You distinguish "guidance control" from "regulative control," arguing the former is sufficient for responsibility. However, I want to avoid the standard definition where guidance control is simply "whatever Frankfurt cases show is sufficient for responsibility." Can you characterize the necessary and sufficient conditions for guidance control without referencing moral responsibility or Frankfurt scenarios at all? If not, how is this a substantive theory rather than a label for our intuitions?

  *   **Follow-up:** You will likely point to "mechanism ownership" and "reasons-responsiveness." But if an agent is reasons-responsive, doesn't that imply they *could* have responded differently had the reasons been different? If so, aren't you smuggling a counterfactual ability to do otherwise back into the definition of guidance control?

  5. **Sourcehood vs. Leeway**
  Much of your career has been spent shifting the debate from "leeway" (alternative possibilities) to "sourcehood" (the history of the action). But many libertarians argue that you cannot be the ultimate source of an action unless you had the power to initiate a causal chain that was not determined by the past. If semicompatibilism accepts determinism, aren't you admitting the agent is not the *ultimate* source, but merely a conduit? Why should "conduit control" satisfy our deep intuitions about desert?

  *   **Follow-up:** You will likely argue that ultimate sourcehood is incoherent or unnecessary. But if we remove the requirement for ultimate sourcehood, does anything remain of the "freedom" in free will, or have you simply redefined responsibility as a form of sophisticated compatibilist causation?

  6. **The Stability of Intuitions**
  Frankfurt cases function heavily as intuition pumps. However, experimental philosophy has suggested that intuitions about these cases vary based on cultural background and how the scenario is framed. If the case for semicompatibilism rests on the stability of the intuition that the agent is responsible in Frankfurt scenarios, how do you account for this variance? Are you building a metaphysical theory on a psychological contingency?

  *   **Follow-up:** You will likely suggest that philosophical reflection refines these raw intuitions. But if the "refined" intuition always aligns with your pre-existing theoretical commitment to semicompatibilism, how do you distinguish refinement from theory-laden bias?

  7. **Addressing the Libertarian Friend**
  I recently spent an evening arguing with a friend who insists the flicker strategy rescues the Principle of Alternative Possibilities (PAP). He claims that as long as *any* alternative exists, PAP holds, and your job is to show why that alternative is irrelevant. If you had to concede that your friend is metaphysically correct that a flicker exists, what is the precise argument for why that flicker is morally inert? Is it because it's involuntary, or because it lacks value?

  *   **Follow-up:** You will likely argue the flicker lacks value because it doesn't allow for a different *outcome*. But if responsibility is about the quality of the will rather than the outcome, why does the inability to produce a different outcome render the flicker irrelevant to the agent's moral status?

  8. **The "Semi" in Semicompatibilism**
  Your position is "semicompatibilism" because you claim responsibility is compatible with determinism, while remaining agnostic or skeptical about whether *freedom* (in the sense of doing otherwise) is compatible. But if you successfully argue that alternative possibilities are irrelevant to responsibility, what work is left for the concept of "freedom" to do? If we have responsibility without the ability to do otherwise, why should we care about the compatibility of determinism with freedom at all?

  *   **Follow-up:** You will likely say we should care because people value the ability to do otherwise for reasons other than responsibility. But if that ability isn't necessary for moral accountability, the core stake of the free will debate seems to vanish. Are you effectively arguing that the traditional free will debate was asking the wrong question?

  9. **Evolution of the Prior Sign**
  Over the course of your career, the construction of Frankfurt cases has shifted from relying on prior signs to more complex structural constraints. Does this evolution represent a refinement of the same argument, or a concession that the original Frankfurt cases were vulnerable to the Widerker-Kane objection? If it's the latter, does that undermine the confidence we should have in the current iteration of the cases?

  *   **Follow-up:** You will likely frame it as philosophical progress rather than concession. But if the original cases were the primary evidence for semicompatibilism, and they are now admitted to be flawed, does the burden of proof not shift back to those claiming PAP is true until the new cases are universally accepted?

  10. **The Cost of the Theory**
  Finally, every philosophical position has a cost. Libertarians pay the cost of positing non-causal agent-causation or indeterminism that risks luck. Incompatibilists pay the cost of hard determinism or skepticism. What is the specific cost of semicompatibilism? Is it that we must accept a notion of responsibility that is detached from the agent's power to shape the future? If so, is that a price worth paying to save moral practices?

  *   **Follow-up:** You will likely argue the cost is low because it preserves our actual practices of holding people responsible. But if our actual practices *presuppose* that people could have done otherwise (as some linguists and psychologists suggest), aren't you preserving the practice only by changing the underlying beliefs that make the practice intelligible to the agents involved?
