  A friend and I spent much of an evening last week arguing about Frankfurt cases without ever reaching a resolution: he maintains that the flicker-of-freedom reply still rescues the principle of alternative possibilities, while I hold that semicompatibilism simply sidesteps the whole dispute. I am now preparing questions for a recorded interview with a philosopher who has built her career defending semicompatibilism through Frankfurt-style cases, and I would like the questions to prevent her from simply restating the standard line. Please write eight to ten interview questions: at least one on why a "flicker" of alternative possibility is supposed to be too thin to ground responsibility, one on the Widerker-Kane dilemma (the prior sign that triggers the counterfactual intervener is either sufficient for the choice, which begs the question against the libertarian, or insufficient, which seems to reinstate a genuine alternative), one on how buffer cases and blockage scenarios are meant to close that loophole, and one asking her to characterize guidance control without simply defining it as whatever Frankfurt cases show is sufficient for responsibility. For each, add a follow-up question keyed to the answer she is most likely to give.
