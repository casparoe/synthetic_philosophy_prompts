  So I just started as an RA on a cooperative AI / multi-agent safety project, and in this week's reading group everyone kept nodding along about "safe Pareto improvements" like it's totally obvious, and I didn't want to be the one to ask. I get the Pareto improvement half - some outcome that's better for both sides than whatever the default equilibrium is - but I dont get what makes an improvement specifically *safe*, since surely any deal falls apart the moment the other side doesn't hold up their end? Could you walk me through the actual mechanics of how you'd construct one of these (a simple prisoners-dilemma-ish example would help) and explain why "safe" here means something stronger than just "we both promised"? Also curious why this only really became a thing once people started imagining AI agents playing games on our behalf instead of us playing directly - what changes about the problem once there's a program in the loop instead of a person?
