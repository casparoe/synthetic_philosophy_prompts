      *   *Event:* Oxford University awarding Truman an honorary Doctor of Civil Law degree (1956).
      *   *Action:* Anscombe circulated a pamphlet ("Mr. Truman's Degree") and voted against the degree in the Convocation.
      *   *Her Argument:*
          *   Did she argue about numbers? *Some*, but that wasn't the core.
          *   What was the core? *Intentionality* and *Absolute Moral Prohibitions.*
          *   Key concept: The intentional killing of innocents is inherently wrong, regardless of consequences.
          *   She argued that the bombing of Hiroshima and Nagasaki constituted the *direct intentional killing of civilians*, which is murder/mass murder, regardless of whether it shortened the war.
          *   She was influenced by Catholic Just War Theory (specifically the principle of non-combatant immunity) and Kantian/deontological ethics (actions have intrinsic moral value, not just instrumental).
      *   *Comparison to Utilitarianism:* Utilitarianism says "the ends justify the means" (maximize overall good/minimize overall harm). Anscombe explicitly *rejected* this framework. She is actually famous for critiquing utilitarianism (e.g., in "Modern Moral Philosophy").

