answer: |-
  You have stumbled onto one of the most famous episodes in 20th-century moral philosophy, but there is a crucial twist: **You have actually identified the exact opposite of Anscombe's argument.**

  While Anscombe did dispute the casualty numbers, her philosophical point was explicitly **anti-utilitarian**. In fact, this protest is often taught in ethics classes specifically to illustrate the difference between *consequentialism* (utilitarianism) and *deontology* (duty-based ethics).

  Here is why her argument is treated as a distinct ethical stance rather than just a dispute over math.

  ### 1. The Core Misunderstanding: Ends vs. Acts
  The pro-bomb argument is classically utilitarian: *The bombs killed X people, but an invasion would have killed 2X people. Therefore, the bombs minimized suffering and were the "right" choice.* This is cost-benefit analysis.

  If Anscombe were arguing, "An invasion would have killed fewer people, so the bombs were inefficient," she would indeed be making a utilitarian argument. She would just be saying the pro-bomb crowd did the math wrong.

  **But that wasn't her point.** Anscombe argued that **the intentional killing of innocent civilians is inherently wrong, regardless of the consequences.**

  Her position was that even if an invasion *would* have killed 5 million people, and the bombs only killed 200,000, Truman would still be morally culpable for murder. She rejected the premise that you can justify an intrinsically evil act (mass killing of non-combatants) by pointing to a "greater good" (ending the war sooner).

  ### 2. The Principle of Intentionality
  Anscombe was a Wittgensteinian and a Catholic convert, and her ethics relied heavily on the concept of **intention**.

  In Just War Theory (which influenced her), there is a distinction between:
  *   **Foreseen but unintended consequences:** e.g., Bombing a munitions factory kills nearby civilians as a tragic side effect. (She might argue this is permissible under strict conditions).
  *   **Intended means:** e.g., Bombing a city *in order to* terrorize the population and kill civilians to force surrender.

  Anscombe argued that Hiroshima and Nagasaki were the latter. The civilians were not "collateral damage"; they were the *instrument* of the strategy. For Anscombe, once you intend the death of innocents as a means to an end, you have crossed a moral line that no amount of "net lives saved" can erase.

  ### 3. She Attacked the Calculus Itself
  Two years after the Truman protest (1958), Anscombe published a famous paper called *"Modern Moral Philosophy."* In it, she explicitly attacked utilitarianism and consequentialism, arguing that they had corrupted modern ethics by removing the concept of "forbidden acts."

  She believed that certain acts are **absolutely prohibited**. In her pamphlet regarding Truman, she wrote:

  > "For men to choose to kill the innocent as a means to their ends is always murder. And murder is one of the worst of human actions."

  Notice the phrasing: "Always." Not "unless the numbers work out."

  ### 4. So why did she mention the invasion numbers?
  You aren't totally wrong to notice she discussed the strategic necessity. In her pamphlet, she *did* argue that Japan was already ready to surrender and that the bombs were militarily unnecessary.

  However, she used that argument as a **secondary** point to undercut the pragmatic defense. Her logic was structured like this:
  1.  **Primary Argument:** Killing innocents is always wrong, even if it saves lives. (Deontological)
  2.  **Secondary Argument:** Furthermore, it didn't even save lives, so the utilitarians are wrong on their own terms too. (Consequentialist)

  The reason philosophers focus on the first point is that the second point is just a historical debate (which historians are still fighting over today). The first point is a **philosophical challenge** to the way we justify state violence.

  ### 5. Why is this famous?
  Her protest is legendary in philosophy for two reasons:

  1.  **It challenged the "Good War" narrative:** In 1956, WWII was viewed as a morally clear conflict. Anscombe stood up in front of the British establishment and called the leader of the Allied victory a "mass murderer." It was an act of immense moral courage that separated the justice of the *cause* from the morality of the *methods*.
  2.  **It revived Absolute Moral Rules:** In a post-war world increasingly dominated by game theory and nuclear deterrence (which are purely utilitarian calculations), Anscombe insisted that some lines cannot be crossed.

  ### Summary
  If Anscombe were just arguing about casualty estimates, she would be a historian or a strategist. She is remembered as a philosopher because she argued that **Truman was wrong even if he was right about the numbers.**

  She wasn't playing the same game as the pro-bomb crowd with different stats; she was arguing that **the game itself was immoral.**
