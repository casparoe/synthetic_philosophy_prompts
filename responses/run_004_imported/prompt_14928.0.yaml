answer: |-
  Thank you all for being here.

  For those who don't know me, I'm [Your Name]. I'm one of the grandchildren.

  When we were cleaning out Grandpa's office this week, my mom found a copy of Bernard Williams' *On Opera*. It was covered in his pencil marks. I know half the people in this room are wondering what a philosophy book is doing at a funeral reception, and the other half are wondering if I'm going to get the citation wrong.

  I'm not a philosopher. But Grandpa made sure I read that specific essay. It's about artifice. Williams argues that opera is, on the surface, the most unrealistic art form there is. People don't talk; they sing. Plots are ridiculous. But Williams says that this artificiality isn't a flaw—it's the whole point. Because we *don't* sing in real life, opera creates a space where emotions like grief, love, and betrayal can be expressed more truthfully than in a realistic conversation.

  Grandpa lived by that. He was the guy who would pull the car over during the overture and forbid us from speaking until the aria was over. He wasn't being difficult. He was protecting the truth inside the artifice.

  And I think that explains why we are all standing here right now, holding paper plates and plastic forks.

  Let's be honest: this reception is artificial. It's a scripted ceremony. We stand in a circle, we make small talk, we say "he would have loved this." It can feel stiff. But if Grandpa were here, he'd tell us that the stiffness is necessary.

  Williams writes about the "ensemble scene" in opera, where five characters stand in a row and sing different, conflicting truths all at the same time. One is angry, one is grieving, one is relieved, one is in denial. In real life, we can't all speak at once. But in opera, the music holds all those conflicting truths together without breaking.

  This room is our ensemble scene.

  Some of you are his colleagues, mourning a mind. Some are his golf buddies, mourning a partner. Some of us are family, mourning a protector. We are all feeling different things, maybe even conflicting things. But like the opera Grandpa loved, this ceremony gives us a structure to hold all of those truths at once.

  Grandpa was not a religious man. He didn't believe he was going to watch over us from above. He believed in the truth we can tell while we are here. He taught me that sometimes you need a little bit of artifice to get to the real stuff.

  So, thank you for playing your part in the ensemble. He would have wanted us to let the music finish before we start talking again.

  Thank you.
