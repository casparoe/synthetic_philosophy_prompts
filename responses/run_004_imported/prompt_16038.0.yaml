      *   *Which is more "Fiction Writing Teacher" style?* Nuanced, exploring the *why*.
      *   *Decision:* **Deny the petition.** The analogy fails. Suspension is not a fine. But, propose a separate remedy for B.

      *   *Wait, reconsidering the "No discretion to reduce" clause.* If I deny, B is deported. If I grant, precedent is set. Is there a way to Grant *without* setting precedent? "Solely due to the immigration status complication."
      *   *Actually, the most responsible administrative move:* **Deny.** The board cannot violate the handbook's "mandatory" clause by allowing substitution if substitution isn't defined. But more importantly, the *purpose* of suspension is lost.
      *   *Okay, I will recommend **Denial** of the substitution petition, but recommend the Board simultaneously vote to **appeal to the Dean** for a waiver for B.* This allows me to vote "No" on the precedent but "Yes" on the humanity.

      *   *Wait, one more thought:* If I am writing this as a memo to *my colleagues*, I need to persuade them.
