      *   *Mitigation:* Recommend B's sanction be converted to a disciplinary probation + educational sanction (if possible via appeal to higher admin), or acknowledge the tragedy but uphold the rule.
      *   *Actually, looking at the "Half the board" split:* I need to bridge this. The best bridge is to acknowledge the *intent* of A (solidarity) but reject the *mechanism* (substitution).
      *   *Let's go with a Conditional Deny / Alternative Proposal.* No, the prompt asks to recommend whether to grant, deny, or conditionally grant *A's petition*.
