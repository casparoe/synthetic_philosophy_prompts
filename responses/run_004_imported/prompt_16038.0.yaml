      *   *Best Path:* **Deny.** The nature of academic integrity is personal. But, write the memo so that the "losing side" (those who want to help B) feels heard and sees a path forward that doesn't break the system.
      *   *Wait, is there a middle ground?* What if A serves their suspension, and B serves a "remote" suspension or a modified suspension that doesn't trigger visa loss? (e.g., reduced course load vs full suspension).
      *   *Okay, I will recommend **Denying** the substitution petition.* Why? Because it undermines the personal nature of academic accountability. *However*, I will recommend the Board vote to **recommend an exception to the Provost** for B based on disproportionate collateral consequences. This respects the handbook (Board can't change it, but can recommend exception) and solves the human problem.
      *   *Actually, the prompt asks me to recommend on A's petition.* I should probably focus on that.
