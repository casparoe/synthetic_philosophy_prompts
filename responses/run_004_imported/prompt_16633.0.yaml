  3.  **Develop the Foundationalist Analogy:**
      *   *Epistemology:* Justification regress. Belief $A$ needs reason $B$, which needs $C$... Foundationalists say: Some beliefs ($B_{basic}$) are justified non-inferentially (e.g., sensory experience, self-evidence). They stop the regress.
      *   *Ethics/Metaphysics:* Responsibility regress. Action $A$ needs character $B$, which needs prior choice $C$... The "Foundationalist" (Compatibilist/Strawsonian) says: Some states of agency ($R_{basic}$) are responsible non-inferentially (e.g., current reflective endorsement, reasons-responsiveness). They stop the regress.
      *   *The Claim:* Responsibility isn't about *historical origin* (how you got the trait); it's about *current structure* (how the trait functions in the agent now).

  4.  **Drafting the Argument (Step-by-Step):**

