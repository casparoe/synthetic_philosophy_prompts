      *   **The Epistemological Analogy:** Briefly explain Foundationalism. Basic beliefs don't need *other beliefs* to justify them; they have intrinsic warrant (e.g., "I am in pain"). Similarly, basic responsible actions don't need *prior responsible choices* to ground them; they have intrinsic agential warrant (e.g., "I reflectively endorse this desire").
      *   **The Mechanism: Reflective Endorsement (Frankfurt/Dworkin style):**
          *   It's not about creating the desire from scratch.
          *   It's about the *relation* between the agent and the desire.
          *   If I identify with a desire (second-order volition), it becomes "mine" in the relevant sense.
          *   This identification is the "basic belief" of agency. It doesn't need further justification/authorship.
      *   **Addressing the "Begging the Question" Objection (The Crux):**
          *   *Strawson's Counter:* "Your capacity to endorse is just part of your genetic/environmental luck. You didn't choose to be a reflector."
          *   *The Defense:* Distinguish between *Ultimate Responsibility* (Strawson's definition) and *Moral Responsibility* (The common definition).
          *   *Argument:* Strawson defines responsibility as "Ultimate Origination." If we accept that definition, he wins by fiat. But the foundationalist challenges the definition.
          *   *Why it's not circular:* It's not assuming responsibility exists; it's offering a *criterion* for responsibility that makes sense of our practices without requiring the impossible (*causa sui*).
          *   *The "Stop" Point:* In epistemology, we stop at "seemings" or "experience." In agency, we stop at "rational reflection." To ask "Are you responsible for your capacity to reflect?" is like asking "Is your vision justified by another vision?" It's a category mistake. The capacity *is* the ground.
          *   *Reasons-Responsiveness (Fischer & Ravizza):* Shift focus from "source" to "control." If the mechanism is responsive to reasons *now*, the history matters less (unless it involves manipulation).
          *   *The "Constitutive Luck" Rebuttal:* Acknowledge luck exists. But responsibility isn't about escaping luck; it's about owning the luck that constitutes *you*. If the endorsement is authentic, the fact that the *capacity* to endorse was unchosen is irrelevant to the *status* of the action.

