      *   Premise 2: To be truly responsible for how you are, you must have chosen to be that way.
      *   Premise 3: To choose to be that way, you must have had principles/preferences for choosing.
      *   Premise 4: To be responsible for *those* principles/preferences, you must have chosen them... (Regress).
