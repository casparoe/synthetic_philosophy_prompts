      *   **Key Concepts:** Picture language as "auxiliary" (not replacement), fixed/standardized stock of symbols, strict conventions (e.g., repetition for quantity vs. resizing), intelligibility across languages/literacy, freedom from connotative ambiguity, rigorously controlled vocabulary.
      *   **Task:** Evaluate today's emoji-based communication and standardized icon systems (app interfaces, public signage) through Neurath's lens.
