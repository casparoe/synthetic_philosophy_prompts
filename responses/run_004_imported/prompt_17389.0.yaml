          *   *Ambiguity:* Low, but exists (cultural differences).
          *   *Quantification:* Rarely used for statistics.
          *   *Neurath's Verdict:* Likely positive regarding standardization and auxiliary function, but might critique the lack of statistical depth.

      *   **System B: Emoji**
          *   *Standardization:* Unicode provides code points, but rendering varies by platform (Apple vs. Android).
          *   *Auxiliary Function:* Yes, complements text.
          *   *Ambiguity:* High. Context-dependent, emotional, connotative.
          *   *Quantification:* Not used for statistics (usually).
