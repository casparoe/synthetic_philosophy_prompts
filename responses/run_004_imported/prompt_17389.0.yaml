      *   **Core Question:** Would he see them as realizing his project or reproducing the ambiguities he sought to eliminate?

  2.  **Deconstruct Neurath's ISOTYPE Principles:**
      *   *Auxiliary Language:* It supports text/speech, doesn't replace complex reasoning.
      *   *Standardization:* Symbols must be fixed. No artistic variation.
      *   *Quantification:* Quantity = Repetition of unit symbols (not scaling size). This is crucial for statistical accuracy.
      *   *Objectivity/Neutrality:* Avoid emotional/connotative baggage associated with words. "Transformers" (experts) mediate between data and image.
      *   *Goal:* Social education, democratic access to knowledge, visual statistics.

  3.  **Evaluate Modern Systems against Principles:**

