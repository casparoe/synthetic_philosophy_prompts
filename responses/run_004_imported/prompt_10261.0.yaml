      *   **Goal:** Resolve the tension, explain Nietzsche's actual position, and determine who (if anyone) is "right."

  2.  **Deconstruct the Philosophical Issues:**
      *   **Nietzsche's Critique of the Subject:** In GM I:13, Nietzsche is attacking the *grammatical* habit of separating subject and predicate (e.g., "The lightning flashes" implies a thing called 'lightning' that *does* flashing). He applies this to morality: separating "strength" from the "strong man."
      *   **The Friend's Humean Reading:** Hume argues the self is a bundle of perceptions. There is no enduring substance. Nietzsche does sound similar here. If there's no doer, is there free will? Usually, yes, this leads to determinism or fatalism.
      *   **The User's Agency Reading:** *Ressentiment* sounds psychological and active. To "revalue values" seems to require intention. If there's no agent, who is resenting?
