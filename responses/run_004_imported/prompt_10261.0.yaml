answer: |-
  This is one of the most famous and fiercely debated passages in Nietzsche scholarship. You and your friend have both put your fingers on genuine tensions in the text, but the short answer is: **It is not a contradiction.**

  However, resolving it requires understanding exactly *what* kind of "doer" Nietzsche is killing off, and what kind of "doing" he thinks is actually happening.

  Here is the breakdown of why your friend is partially right, why you are partially right, and what Nietzsche is actually doing in that section.

  ### 1. Where your friend is right (The Metaphysical Attack)
  Your friend is correct that Nietzsche is launching a Humean-style attack on the **metaphysical subject**.

  When Nietzsche says "there is no 'being' behind doing," he is attacking the grammatical habit that seduces us into metaphysics. In grammar, we have a subject and a verb ("The lightning flashes"). This makes us think there is a *thing* (lightning) that exists separately from the *action* (flashing), and that the thing could theoretically exist *without* flashing.

  Nietzsche says this is nonsense. There is no "lightning" apart from the flash. There is no "strong man" apart from the acts of strength.

  Applied to psychology, this means there is no "Ego," "Soul," or "Conscious Self" that sits behind your impulses, looks at them, and freely chooses which one to enact. There are only drives, affects, and instincts competing for dominance. When one wins, an action occurs. We then retrospectively invent a "Doer" to take credit or blame.

  So, on the question of **Libertarian Free Will** (the idea that a neutral "I" could have done otherwise), your friend is right: Nietzsche rejects it. He is a naturalist. He thinks human behavior is determined by physiology, history, and the hierarchy of drives, just as lightning is determined by atmospheric pressure.

  ### 2. Where you are right (The Causal Reality)
  You are also right to push back. If Nietzsche believed *nothing* happens, the *Genealogy* would be pointless. He clearly believes that the "slaves" did something massive: they engineered a **revaluation of values**.

  *Ressentiment* is described as "becoming creative." It "gives birth." This sounds like agency.

  Your intuition is correct because Nietzsche is not denying **causality**; he is denying **moral culpability**. He is not saying "humans don't cause things." He is saying "humans cause things, but not in the way moralists claim they do."

  When Nietzsche describes the men of *ressentiment* crafting new values, he is describing a psychological and physiological process, not a moment of free choice. Think of it like a pressure cooker. The steam (suppressed aggression) builds up because the valve (direct action) is blocked by social weakness. Eventually, the steam *must* escape. It escapes by inventing a story where "good = weak" and "evil = strong."

  Did they "choose" to do this? In the sense that a river "chooses" to erode a canyon? Yes. In the sense that a person chooses between soup and salad? No. It was an inevitable symptom of their condition.

  ### 3. The Synthesis: The "Doer" as a Fiction of Morality
  The key to resolving the contradiction lies in understanding *why* Nietzsche brings this up in Section 13. He isn't writing a treatise on metaphysics for fun; he is trying to diagnose the origin of **Guilt**.

  Nietzsche argues that the "Doer" is a fiction added to the deed *by the priests* to make the strong feel guilty.
  *   **The Reality:** The bird of prey eats the lamb because it is a bird of prey. That is its nature. There is no separation between the bird and the eating.
  *   **The Moral Fiction:** The priests say, "The bird *chose* to eat the lamb. The bird *could have chosen* to be vegetarian. Therefore, the bird is evil."

  To make that judgment stick, you have to pretend there is a neutral "bird-substance" behind the action that is independent of the action. Nietzsche says: **That substance doesn't exist.** You cannot separate the strength from the strong man. Therefore, you cannot blame the strong man for being strong.

  So, how does this fit with *ressentiment*?
  The men of *ressentiment* are also not "free agents." They are acting out their physiology. However, they *believe* they are free agents. In fact, their entire moral system depends on the **fiction** of the free subject. They need to believe the strong *chose* to be cruel so that they can condemn them. They need to believe *they themselves* chose to be humble so they can feel virtuous.

  Nietzsche is saying: **You are all just expressions of drives. But the slaves invented a story about 'Subjects' and 'Choices' to wage war against the nobles.**

  ### 4. The Careful Position: "Subject as Multiplicity"
  There is a more careful position hiding here, which answers your specific worry about how *ressentiment* can be "creative" without a "doer."

  Nietzsche doesn't think humans are inert matter. He thinks humans are a **political structure of drives**.
  *   There is no single "I."
  *   There is a community of instincts (hunger, lust, aggression, fear) constantly struggling for power.
  *   When we say "I did this," it is a simplification. Really, it was "Drive X overpowered Drive Y and Z, resulting in Action A."

  *Ressentiment* is "creative" not because a ghost in the machine willed it, but because it is a specific configuration of drives (specifically, the drive for revenge blocked by physical impotence) that finds a clever outlet. It is a **symptom that acts**.

  Think of a virus. A virus "invents" ways to bypass immune systems. It "strategizes." We don't say the virus has a soul or free will. We say it is a complex biological mechanism responding to its environment. Nietzsche treats human value-creation similarly. The "slave revolt" was a historical/psychological mutation, not a moral decision.

  ### The Verdict
  *   **Your Friend:** Wins on **Metaphysics**. Nietzsche does deny the substantial, atomistic self and libertarian free will. There is no "neutral substratum."
  *   **You:** Win on **Phenomenology**. Nietzsche does treat *ressentiment* as a potent, world-historical force that "does" things.
  *   **The Resolution:** Nietzsche is a **Naturalist**. He believes actions happen, but he denies that "actions" require a "magical self" to initiate them. He wants to naturalize human behavior.

  **Is it a contradiction?** No. It is a distinction between **Causal Efficacy** (which humans have) and **Moral Responsibility** (which Nietzsche thinks is a fiction used to punish people).

  Nietzsche's point in GM I:13 is ultimately therapeutic: If we realize "the deed is everything," we stop hating the doer. We stop thinking the strong man is "evil" for crushing the weak, and we stop thinking the weak man is "virtuous" for enduring it. We just see forces clashing. The tragedy of the *Genealogy* is that humanity got trapped in a moral interpretation of those forces that makes everyone sick (the bad conscience).

  So, tell your friend: You're right that there's no soul, but you're wrong if you think that means nothing happens. Tell yourself: You're right that *ressentiment* acts, but you're wrong if you think that action implies free choice. Nietzsche is dancing right on that razor's edge.
