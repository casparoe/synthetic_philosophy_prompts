  **MEMORANDUM**

  **TO:** Epistemics Working Group & Senior Leadership
  **FROM:** [Your Name], Epistemics Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation to Stabilize Internal Prediction Market Liquidity

  ### Executive Summary

  Our internal prediction market is currently failing its primary function: aggregating dispersed information to guide project greenlighting decisions. Due to chronic thinness, prices remain frozen until immediately before resolution, rendering them useless for early-stage decision support. This is a classic manifestation of the no-trade theorem in a thin market: uninformed staff correctly infer that any counterparty at a stale price possesses superior information, leading to a liquidity freeze.

  I recommend we **install a subsidized Automated Market Maker (AMM), specifically a Logarithmic Market Scoring Rule (LMSR).**

  This option preserves the leadership workflow (consulting a single probability price) while mechanically solving the liquidity freeze. While there is a valid concern that subsidies may flow primarily to already-informed traders rather than eliciting *new* information, we can mitigate this by treating the subsidy as a capped information procurement budget rather than an infinite liquidity pool.

  ### Problem Diagnosis: The Liquidity Freeze

  Currently, our market operates as a pure peer-to-peer exchange. In a small, closed community, this creates an adverse selection spiral:
  1.  **Stale Prices:** Early prices reflect common knowledge, not private signals.
  2.  **Adverse Selection:** Staff with private information wait to trade until resolution is near to maximize impact.
  3.  **No-Trade Equilibrium:** Staff without private information refuse to provide liquidity at stale prices, correctly fearing they will be "picked off" by those who know more.
  4.  **Result:** Leadership sees a frozen price (e.g., 50%) for weeks, then a jump to 90% days before launch. The early signal is lost.

  Status Quo Option 3 (teaching leadership to discount prices) is unreliable; it places the burden of epistemic hygiene on decision-makers rather than fixing the information pipeline. Option 2 (Metaculus-style tournament) solves the adverse selection problem but changes the interface leadership relies on. Moving from a "market price" to a "forecast mean" requires retraining and may reduce the perceived immediacy of the signal.

  ### Recommendation: Subsidized LMSR (Option 1)

  We should implement a Hanson-style LMSR with a dedicated play-money subsidy budget. The AMM acts as a counterparty of last resort, always willing to buy or sell shares at a price determined by a mathematical bonding curve.

  **Why this works:**
  *   **Breaks the No-Trade Cycle:** Uninformed staff can trade against the AMM without fear of adverse selection, as the AMM has no private information. This restores liquidity.
  *   **Continuous Pricing:** Leadership sees prices move as soon as *any* information enters the system, not just when a critical mass of traders agrees.
  *   **Workflow Continuity:** Leadership continues to consult a single price probability, requiring no retraining.

  ### Implementation Plan

  1.  **Phase 1: Parameterization (Weeks 1-2)**
      *   Set the LMSR liquidity parameter ($b$). A lower $b$ makes prices more sensitive to trades (good for thin markets) but increases subsidy cost per trade. We recommend a low $b$ to encourage price discovery.
      *   **Crucial:** Establish a "Subsidy Budget" per market. This is the maximum amount of play-money the AMM is willing to lose on a single question.

  2.  **Phase 2: Soft Launch (Weeks 3-6)**
      *   Deploy AMM on 3-5 high-visibility project greenlight questions.
      *   Monitor the "Cost to Subsidy" ratio. If the AMM is losing its entire budget within 24 hours, the liquidity parameter is too loose.

  3.  **Phase 3: Full Rollout & Review (Week 7+)**
      *   Expand to all greenlight questions.
      *   Quarterly review of whether price movements correlate with eventual project success/outcomes.

  ### Risk Analysis: The "Subsidy Leakage" Objection

  The strongest argument against this recommendation is that a subsidized AMM does not solve the epistemic problem; it merely pays to route around it.

  **The Critique:**
  Critics argue that in a thin market, the only people willing to trade against a stale AMM price are those who already know the answer. In this view, the subsidy does not incentivize *early* information discovery; it simply functions as a wealth transfer to the most informed staff members right before resolution. We would be paying a "bounty" to arbitrageurs without improving the *timing* of the information aggregation.

  **Our Assessment & Mitigation:**
  This critique is theoretically sound but practically manageable. We accept that some subsidy leakage is the **cost of goods sold** for obtaining a liquid price signal. However, to ensure we are buying *early* information rather than *late* arbitrage:

  1.  **Decaying Liquidity:** We will configure the LMSR liquidity parameter ($b$) to decay over time. The subsidy is deepest in the first 48 hours after a question opens (when information asymmetry is highest) and narrows as resolution approaches. This incentivizes early trading over late arbitrage.
  2.  **Budget Caps:** By capping the total subsidy per market, we prevent a single informed trader from draining the pool. If the pool is exhausted, the market reverts to peer-to-peer, signaling to leadership that the price is now "sharp" and potentially final.
  3.  **Hybrid Incentive (Optional Phase 2):** To further align epistemic virtues, we can layer a proper scoring rule leaderboard on top of the market. While the AMM pays for *liquidity*, the leaderboard rewards *accuracy over time*. This ensures staff are recognized for being right early, not just for extracting subsidy value late.

  ### Conclusion

  The status quo provides leadership with a false sense of precision (a frozen price) that masks a total lack of information aggregation. A tournament system is epistemically robust but operationally disruptive.

  A subsidized AMM is the most pragmatic intervention. It treats liquidity as a public good that the organization must purchase. By capping the subsidy and weighting it toward early trading windows, we can minimize "arbitrage leakage" while securing the continuous price signal leadership requires for effective project greenlighting.

  **Decision Requested:** Authorization to proceed with Phase 1 Parameterization of a Subsidized LMSR.
