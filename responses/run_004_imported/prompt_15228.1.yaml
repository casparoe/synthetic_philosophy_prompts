prompt: |-
  For a near-future novel I'm drafting, one pivotal scene turns on a video, seen by millions before anyone can verify it, that appears to show a miraculous healing. My protagonist, a philosopher, wants to resist believing it on explicitly Humean grounds, and I need her reasoning to genuinely hold up rather than gesture vaguely at "Hume would be skeptical of miracles." Specifically: if Hume himself were confronted with a world in which moving images, and not only spoken or written testimony, can be fabricated cheaply and undetectably, how would he revise the actual argument of "Of Miracles" — the maxim that testimony can establish a miracle only if its own falsehood would be more improbable than the miracle itself, together with his separate observations about our appetite for the marvelous and about how rival religions' miracle-claims undercut one another? Does the mere possibility of undetectable fabrication strengthen his case against trusting the video, by further degrading the background reliability of the relevant class of evidence, or does it threaten to undercut his whole framework, which quietly presupposes a stable track record against which the reliability of testimony can be calibrated? Work through this with real fidelity to the argument's actual structure, and commit to a specific verdict about which way it actually cuts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A near-future novel featuring a pivotal scene with a viral video of a miraculous healing.
      *   **Protagonist:** A philosopher who wants to resist belief on *explicitly Humean grounds*.
      *   **Constraint:** The reasoning must hold up philosophically, not just be a vague gesture at Hume.
      *   **Core Question:** How would Hume revise his argument in *An Enquiry Concerning Human Understanding*, Section X ("Of Miracles"), given a world where moving images can be fabricated cheaply and undetectably?
      *   **Specific Tension:** Does deepfake technology *strengthen* Hume's case (by degrading evidence reliability) or *undercut* his framework (by destabilizing the empirical baseline needed to calibrate testimony)?
      *   **Requirement:** Work through the actual structure of Hume's argument and commit to a specific verdict.

  2.  **Deconstruct Hume's Argument in "Of Miracles":**
      *   *Part I (The Maxim):* A wise man proportions his belief to the evidence. A miracle is a violation of the laws of nature. Uniform experience establishes laws of nature. Testimony for a miracle is evidence *against* uniform experience. Therefore, we should only believe testimony of a miracle if the falsehood of that testimony would be *more* miraculous than the miracle itself.
      *   *Part II (Practical Heuristics):* Even if Part I leaves a sliver of logical possibility, practical experience suggests we should never believe miracle claims. Reasons:
          1.  No miracle in history has been attested by enough men of unquestioned good sense, education, and reputation.
          2.  Human psychology has a "passion of surprise and wonder" (appetite for the marvelous).
          3.  Miracle claims abound in ignorant/barbarous nations.
          4.  Rival religions claim miracles, canceling each other out (destructive competition).

  3.  **Analyze the New Variable: Undetectable Deepfake Video:**
      *   Video is traditionally treated as *stronger* than mere testimony. It's "seeing is believing."
      *   However, epistemologically, video is still a form of *testimony* (or secondary evidence relying on the testimony of the camera's integrity).
      *   If fabrication is "cheap and undetectable," the reliability of this class of evidence drops precipitously.

  4.  **Evaluate the Tension (Strengthen vs. Undercut):**
      *   *Argument for Undercutting:* Hume relies on "uniform experience." We know fire burns because we've seen it burn. We know testimony is usually reliable because it usually is. If technology makes *all* visual evidence potentially fake, do we lose the "uniform experience" baseline?
          *   *Counter:* No. Uniform experience regarding *laws of nature* (dead men stay dead, gravity works) remains intact. The *evidence* for the violation is what's compromised. Hume's framework is about weighing probabilities. If the evidence becomes less reliable, the calculation shifts *against* the miracle.
      *   *Argument for Strengthening:* Hume's maxim is a balance scale. Miracle (extremely improbable) vs. Falsehood of Testimony (improbable). If technology makes falsehood *more* probable (easier to fake), the scale tips further against the miracle.
      *   *The "Calibration" Worry:* The prompt asks if the framework presupposes a stable track record. Hume calibrates testimony reliability based on past experience of human veracity. If deepfakes break the link between "seeing" and "being," does testimony lose its anchor?
          *   *Resolution:* Hume treats testimony as inductive. We trust it because it has worked before. If video evidence becomes unreliable, our inductive basis for trusting video collapses. This fits *perfectly* into Hume's empirical method. It doesn't break the framework; it provides new data for the calculation.

  5.  **Drafting the Argument (Step-by-Step):**

      *   **Step 1: Classify the Video.** Is it a miracle or testimony? For Hume, a video is *testimony*. It is a report from a machine (and its operators) about an event. It is not direct perception by the viewer.
      *   **Step 2: Apply the Maxim.**
          *   Side A: The Miracle (Violation of Laws of Nature). Probability: Near Zero (based on uniform experience of biology/physics).
          *   Side B: The Falsehood of the Evidence. Probability: In Hume's time, low (hard to fake a resurrection). In Novel's time, High (cheap, undetectable deepfakes).
          *   Result: The scale tips harder against belief.
      *   **Step 3: Address the "Undercutting" Worry.** Does this destroy the "uniform experience" baseline? No. Uniform experience supports the *law* (humans don't heal instantly from fatal wounds). Uniform experience *also* informs us about the *reliability of media*. If media is now unreliable, that is an empirical fact we add to the "Falsehood" side of the scale.
      *   **Step 4: Integrate Part II (Psychological/Social).**
          *   *Appetite for the Marvelous:* Viral videos feed this perfectly. The "shock" value is higher.
          *   *Rival Claims:* If anyone can make a miracle video, everyone will. Competing miracles (different gods, different healers) will cancel out even faster.
      *   **Step 5: The Verdict.** The technology *strengthens* Hume's skepticism. It does not break the framework; it supercharges the "falsehood of testimony" variable.

  6.  **Refining the Philosophical Nuance (The "Commitment"):**
      *   I need to be careful not to say Hume is "right" about miracles metaphysically, but that his *epistemological procedure* handles this new tech robustly.
      *   The prompt asks if the possibility of fabrication threatens the framework because it presupposes a stable track record.
      *   *Crucial Distinction:* Hume's track record is about *nature*, not just *testimony*. The law of nature is established by *our own direct experience* (dead things don't get up). The video is external. If the external evidence becomes noisy, we retreat to the internal/uniform experience.
      *   *Verdict:* It strengthens the case. The framework is resilient because it is Bayesian (before Bayes). It weighs probabilities. Increasing the probability of deception decreases the probability of the event.

  7.  **Structuring the Response for the User:**
      *   **Introduction:** Acknowledge the sophistication of the question. State the verdict clearly upfront.
      *   **Section 1: The Ontological Status of the Video.** Establish that for Hume, video = testimony, not direct perception.
      *   **Section 2: Re-calibrating the Maxim.** Show the math of the balance scale. How "cheap/undetectable" changes the weight of the "Falsehood" side.
      *   **Section 3: Addressing the "Stable Track Record" Objection.** Explain why the framework doesn't collapse. The "uniform experience" of natural law is the anchor, not the reliability of witnesses.
      *   **Section 4: Part II Considerations.** Viral psychology and competing miracles.
      *   **Section 5: Character Application.** How the protagonist should articulate this.
      *   **Conclusion:** Reiterate the verdict.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address the "undetectable" part? Yes, this is key. If it's undetectable, we can't verify *this* instance, so we must rely on the *class* reliability.
      *   *Check:* Did I address the "stable track record" worry? This is the trickiest part. If testimony is *always* potentially fake, can we ever know anything? Hume would say we rely on the *stronger* uniform experience (laws of nature) over the *weaker* uniform experience (media integrity).
      *   *Tone:* Needs to be academic but accessible for a writer. Precise on Humean terminology ("uniform experience," "violation of laws of nature," "proportions belief").

  9.  **Final Polish:** Ensure the distinction between Part I (The Maxim) and Part II (Practical Observations) is clear, as the prompt specifically mentions both. Make sure the protagonist's voice sounds like a philosopher using Hume, not just quoting him. (Decided to keep the focus on the analysis first, then offer character advice).

  *(Self-Correction on the "Undercutting" point)*: I need to be very clear why it doesn't undercut. The worry is: If we can't trust evidence, we can't calibrate the probability of the testimony's falsehood. But Hume doesn't need to calibrate the *specific* testimony's falsehood perfectly; he just needs to know it's *not more miraculous* than the event. If deepfakes are common, the "falsehood" is *natural*, not miraculous. Therefore, it's always the rational choice to believe the falsehood over the miracle.

  10. **Final Verdict Formulation:** The technology acts as a force multiplier for Humean skepticism. It lowers the barrier for deception, making the "falsehood" hypothesis vastly more probable than the "miracle" hypothesis.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is the specific verdict you need for your novel, followed by the philosophical work-through to support your protagonist's reasoning.

  ### The Verdict
  **The existence of cheap, undetectable video fabrication strengthens Hume's case against the miracle; it does not undercut his framework.**

  Your protagonist can stand on solid Humean ground. The technology does not break the epistemological scale; it merely adds weight to the side of "deception." Hume's argument is fundamentally probabilistic (a balance of evidence), not foundationalist (requiring absolute certainty). If the reliability of the evidence class (video) degrades, the rational output of Hume's maxim shifts *further* toward skepticism, not toward confusion.

  Here is the breakdown of how your protagonist should articulate this, adhering strictly to the structure of Section X of *An Enquiry Concerning Human Understanding*.

  ---

  ### 1. The Ontological Status of the Video (Testimony vs. Perception)
  The first move your protagonist must make is to categorize the video correctly. A common layperson error is to treat video as "direct perception." Hume would categorize it as **testimony**.

  When I watch a video, I am not perceiving the event; I am perceiving pixels on a screen. I am relying on the testimony of the camera, the software, the uploader, and the chain of custody. Hume writes that a miracle is established by *testimony*, and his maxim applies to all testimonial evidence.

  **The Argument:**
  *   **Hume's Premise:** All evidence for matters of fact is derived from our experience of the constant conjunction of events.
  *   **Application:** We have uniform experience that digital files can be altered. In this near-future setting, we now have *new* uniform experience that "moving images no longer reliably correlate with physical events."
  *   **Result:** The video is not a window into reality; it is a claim *about* reality. It enters the scales as testimony, subject to the same skepticism as a written report.

  ### 2. Re-Calibrating "The Maxim" (Part I)
  Hume's famous maxim states: *"No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavors to establish."*

  This is a weighing scale.
  *   **Side A:** The probability that the Law of Nature was violated (The Healing).
  *   **Side B:** The probability that the Evidence is false (The Fake).

  **In Hume's 18th Century:**
  *   **Side A:** Extremely low (dead tissue does not regenerate instantly).
  *   **Side B:** Low (faking a resurrection required conspiring witnesses, risk of death, etc.).
  *   **Hume's Conclusion:** Side A is still heavier. Uniform experience of natural law outweighs the reliability of human witnesses.

  **In Your Novel's Near-Future:**
  *   **Side A:** Remains extremely low (biology hasn't changed).
  *   **Side B:** Becomes **High**. If fabrication is "cheap and undetectable," the probability that *this specific video* is a fabrication is no longer "miraculous." It is mundane. It is a routine occurrence.

  **The Protagonist's Reasoning:**
  She should argue that the maxim is not broken; it is satisfied *against* the miracle. For belief to be rational, the falsehood of the video would have to be *more* improbable than the healing. But in a world of undetectable deepfakes, a fake video is *more probable* than a biological violation. Therefore, the rational agent must reject the video. The technology lowers the "cost" of deception, making deception the statistically dominant explanation.

  ### 3. Addressing the "Stable Track Record" Objection
  This is the crux of your philosophical worry: *Does this technology undercut Hume by destroying the baseline needed to calibrate reliability?*

  Hume's system relies on "uniform experience." We trust testimony generally because, in the past, testimony has usually matched reality. If video no longer matches reality, do we lose the ability to measure testimony?

  **No, because Hume has a hierarchy of experience.**
  1.  **Primary Uniform Experience:** Our direct observation of natural laws (gravity, biology, physics). This is the strongest evidence.
  2.  **Secondary Uniform Experience:** The reliability of witnesses (human or mechanical).

  When these two conflict, Hume dictates we always side with the Primary. The "undercutting" worry suggests that if Secondary evidence (video) becomes unreliable, we can't know anything. But Hume argues the opposite: when Secondary evidence becomes noisy, we retreat to the Primary.

  **The Protagonist's Insight:**
  She should argue that the framework does not presuppose *stable media*; it presupposes *stable nature*. The video is the variable; the law of nature is the constant. If the variable becomes volatile (easy to fake), the constant wins by default. The framework doesn't collapse; it hardens. The "track record" against which we calibrate is the track record of *nature*, not the track record of *media*. Since nature's track record remains unbroken (people still die, wounds still scar), the video must yield.

  ### 4. The Psychological and Social Heuristics (Part II)
  Hume's Part II offers four practical observations that reinforce Part I. Your protagonist can use the technology to amplify all four.

  1.  **The Appetite for the Marvelous:** Hume notes humans have a "passion of surprise and wonder." Viral algorithms are engineered to exploit this. The protagonist can argue that the *mechanism of distribution* (viral video) is evidence *against* the claim, because it feeds the psychological bias Hume identified. The more "shareable" the miracle, the less credible it is.
  2.  **Rival Miracles:** Hume argues that miracles from different religions cancel each other out. In your novel, if fabrication is cheap, *everyone* can produce miracle videos. Hindus, Christians, Atheists, and Cults will all have "proof." The proliferation of conflicting video evidence leads to a "destructive competition" where the net evidentiary value of all video miracles drops to zero.
  3.  **Expertise:** Hume demands witnesses of "unquestioned good sense, education, and reputation." In a viral video context, the "witnesses" are anonymous uploaders and algorithms. The chain of custody is obscured. The lack of accountable witnesses fits Hume's criteria for rejection perfectly.

  ### 5. How the Protagonist Should Speak
  To make this sound like a philosopher and not a Wikipedia summary, she should avoid saying "Hume says..." and instead inhabit the logic. She should sound like she is performing a calculation.

  **Drafting Suggestion:**
  > "You're treating the video as a window. I'm treating it as a claim. And every claim has a cost. In the past, the cost of faking a resurrection was high—conspirators, risk, physical presence. Today, the cost is negligible.
  >
  > "Hume's balance isn't broken; the weights have just shifted. On one side, we have the uniform experience of biology: tissue does not knit in seconds. That weight hasn't moved. On the other side, we have the probability of deception. Yesterday, deception was unlikely enough to be surprising. Today, deception is the background noise of our information environment.
  >
  > "For me to believe this, the lie would have to be more miraculous than the healing. But a lie is just code. A healing is a violation of causal law. In this economy, code is cheap. Causal law is the only currency that holds. To believe the video is not faith; it's bad accounting."

  ### Summary for the Author
  *   **Does the tech break Hume?** No. Hume's empiricism is flexible enough to incorporate new data about media reliability.
  *   **Does it help the skeptic?** Yes. It drastically increases the prior probability of "falsehood," making it easier to reject the miracle.
  *   **The Key Philosophical Move:** Distinguish between the *uniformity of nature* (which remains stable) and the *uniformity of testimony* (which has degraded). When they conflict, nature wins.

  Your protagonist is safe. The deeper the fake, the stronger the Humean skepticism becomes.
