      *   *Rationale - Philosophical:* Acknowledge the Philosopher's point. Postselection is conditioning, not causation. We must not claim to solve the Grandfather Paradox physically. We are testing the *formalism*, not the *fabric of spacetime*.
      *   *The Compromise:* The value lies in the *isomorphism*. We fund the math test, but restrict the ontological claims.
