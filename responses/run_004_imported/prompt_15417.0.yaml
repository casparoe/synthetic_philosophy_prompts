          *   *Philosopher of Physics:* Postselection $\neq$ actual backward causation. It simulates correlations, not causal loops. Oversells the implications for the grandfather paradox.
          *   *Other Members:* Worry about PR/abstract wording. Want the funding decision settled.
      *   **Requirements:** Recommend Fund, Decline, or Fund with Conditions. Reasoning must be tight and acknowledge both the Sponsor's and Philosopher's actual arguments (no strawmen). Deadline is Friday (implied urgency).
