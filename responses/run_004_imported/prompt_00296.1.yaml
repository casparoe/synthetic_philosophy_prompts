answer: |-
  Your friend’s reasoning is incorrect. While the logic seems sound at first glance, it is a classic mathematical puzzle known as the **Two Envelopes Paradox**. 

  The breakdown occurs because your friend is treating the amount you see ($80) as a fixed constant in a calculation where it actually represents two different underlying possibilities.

  ### 1. The Symmetry Argument (The Intuitive Check)
  The most immediate proof that your friend is wrong is the "blind swap" test. If their logic were correct—that the other envelope is always worth more on average—you should swap even without looking at your envelope. 

  However, if you swap without looking, you are simply exchanging one random envelope for another. Because the envelopes are identical in appearance and the amounts are distributed symmetrically, the expected value of both envelopes must be the same. If you shouldn't swap before opening the envelope, seeing the number $80$ cannot magically change the expected value in your favor.

  ### 2. The Mathematical Flaw (The "Fixed Amount" Fallacy)
  Your friend’s calculation is:
  $$\text{Expected Value} = 0.5 \times (40) + 0.5 \times (160) = 100$$

  This calculation assumes that the probability of $80$ being the "smaller" amount is exactly equal to the probability of it being the "larger" amount. This is where the math breaks down. In this equation, the variable **$80** is playing two different roles:
  *   In the first term ($40$), $80$ is the **larger** amount of a pair (the pair was $40/80$).
  *   In the second term ($160$), $80$ is the **smaller** amount of a pair (the pair was $80/160$).

  For the 50/50 assumption to hold, the charity must have been equally likely to choose the pair $(40, 80)$ as they were to choose the pair $(80, 160)$. In reality, we have no way of knowing the "prior distribution" of the prize money. If the charity tends to give out smaller prizes, the pair $(40, 80)$ is much more likely than $(80, 160)$, and you should not swap.

  ### 3. The Real-World Constraint (Finite Budgets)
  In any real-world raffle, there is a maximum possible prize. If you were to open an envelope and find $\$10,000$ in a raffle where the maximum prize is $\$10,000$, you would know for a fact that the other envelope contains $\$5,000$. In that case, swapping would be a guaranteed loss. 

  Because your friend’s logic ("always swap") must apply to *every* possible amount, the existence of a maximum prize cap proves the logic is flawed. If the logic fails at the maximum amount, the 50/50 assumption cannot be trusted for any other amount.

  ### Summary
  Your friend’s reasoning fails because it assumes a uniform distribution of money across an infinite range, which is impossible in a real-world scenario. Without knowing how the charity determined the prize amounts, you cannot assume that $80$ is equally likely to be the "base" amount or the "double" amount. Therefore, there is no mathematical advantage to swapping.
