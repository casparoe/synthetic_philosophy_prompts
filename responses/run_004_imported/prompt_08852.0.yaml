answer: |-
  If we summon Hume from the dead to face Nelson Goodman, we must strip him of modern analytic armor. He cannot appeal to Bayesian priors, linguistic entrenchment, or natural kinds. He must fight with the weapons he forged in the *Treatise of Human Nature* and the *Enquiry Concerning Human Understanding*: impressions, ideas, association, and custom.

  If forced to commit, Hume would not concede that Goodman's "New Riddle" undermines his account. On the contrary, he would argue that Goodman's paradox is a artifact of logical abstraction that dissolves the moment we return to the actual psychology of belief formation. Hume's response would be that **his framework privileges "green-type" predicates precisely because they are the natural units of association, grounded in simple sensory impressions, whereas "grue" is a complex relation of ideas that the associative machinery cannot latch onto.**

  Here is how Hume would defend this position on his own terms.

  ### The Mechanism of Custom is Sensory, Not Logical

  Goodman's error, from a Humean perspective, is treating induction as a relationship between *propositions* rather than a movement of the *mind*. Goodman assumes that if two hypotheses are logically compatible with the same data, they should be psychologically equipollent. Hume denies this premise entirely. For Hume, the inference from the observed to the unobserved is not a logical operation; it is a feeling. It is a "gentle force" of association that carries the imagination from one perception to another.

  This force relies on three principles of association: resemblance, contiguity, and cause and effect. The critical one here is **resemblance**. When I observe one emerald, and then another, and then another, my mind does not abstract a logical predicate. It feels a similarity. The impression of green in the first instance *resembles* the impression of green in the second. This felt resemblance facilitates a smooth transition of the imagination. The mind slides easily from the present impression to the idea of the future emerald because the qualities match.

  "Grue," however, is not a quality that can be felt. It is a disjunctive construction involving a sensory quality (green/blue) and a temporal/observational relation (examined before *t*). There is no simple impression of "grue." You cannot look at an emerald and receive an impression of its grueness; you can only receive an impression of its greenness and then perform a intellectual calculation regarding the time and the act of examination.

  ### The Disqualification of "Grue" as an Object of Habit

  Hume would argue that custom cannot form around "grue" because custom requires **constant conjunction of sensible qualities**, not logical predicates.

  In the *Enquiry*, Hume writes that when we see a flame, we expect heat. Why? Because the *sensible qualities* of flame and heat have been conjoined. The mind associates the *look* of the flame with the *feel* of the heat. For a habit to form, the mind must be able to recognize the recurrence of the same object or quality.

  "Green" is a simple quality. Every time I see an emerald, the sensory input is qualitatively identical (modulo lighting, etc.). The mind recognizes this identity through resemblance.
  "Grue" is not a recurring quality. An emerald observed at *t1* is "grue" because it is green. An emerald observed at *t2* (after the cutoff) is "grue" because it is blue. There is no sensory resemblance between the "grueness" of the first emerald and the "grueness" of the second. One looks green, the other looks blue.

  Therefore, the psychological mechanism of association never engages. The mind cannot form a habit of expecting "grue" because there is no single impression that repeats. To project "grue" would require the mind to ignore the sensory resemblance (green vs. blue) and prioritize a logical rule (time of examination). But for Hume, reason is the slave of the passions (and the senses). The associative machinery is driven by the vividness and resemblance of impressions, not by logical definitions. The imagination simply cannot make the leap to "grue" because there is no sensory bridge to support the transit.

  ### The Primacy of Naturalism over Justification

  Goodman charges that Hume leaves us without a *justification* for preferring green over grue. Hume would reply that this misses the point of his project. He is not in the business of justifying induction; he is explaining its **cause**.

  Goodman asks: "By what right do we project green?"
  Hume answers: "We do not project it by right; we project it by nature."

  The preference for "green" is not a choice we make based on evidence; it is a constraint of our cognitive architecture. We are built to track sensory constancies. A creature that projected "grue" would not be a rational agent operating on a different logic; it would be a creature with a different sensory psychology, one capable of sensing "grue" as a simple quality. But given human psychology as it is—bound to simple impressions of color, shape, and texture—"grue" is invisible to the associative faculty.

  Hume would likely view Goodman's paradox as a sophisticated version of the skeptical doubts he already dismantled. It is an attempt to use reason to undermine the very instincts that make reasoning possible. In the *Treatise*, Hume argues that skepticism is fine in the study, but nature always breaks its force when we return to the common affairs of life. We eat, we sleep, we expect the sun to rise. We do not wait for logical validation of our predicates.

  Similarly, no amount of logical symmetry between "green" and "grue" will ever make a human being genuinely expect an emerald to turn blue after time *t*. Why? Because the custom is already established. The "green" habit is reinforced by every observation, not just because of the data, but because the data *feels* the same. The "grue" hypothesis requires a violent strain on the imagination, forcing it to group dissimilar impressions (green and blue) under a single label. Hume's psychology predicts that the mind will always follow the path of least resistance—the path of sensory resemblance.

  ### Conclusion: The Victory of Psychology

  Hume would conclude that Goodman has mistaken a logical puzzle for a psychological problem. Goodman assumes that if two hypotheses are logically equivalent relative to the data, they should be psychologically equiprobable. Hume's entire system denies this. The mind is not a logic machine processing evidence; it is an organic system responding to stimuli.

  Therefore, Hume's account is not undercut by the New Riddle. It actually explains why the Riddle feels like a riddle in the first place. It feels paradoxical only to a philosopher reflecting on logic, not to a human being living in the world. In the lived experience of the observer, "green" is a natural unit of association and "grue" is an artificial construction of the study.

  Hume would stand firm: **Custom is founded on the repetition of resembling impressions.** Since "grue" offers no resembling impressions to repeat, custom cannot form around it. The "long afterlife" of Hume's problem need not fear Goodman, because Hume's solution was never logical to begin with. It was naturalistic. And in the court of nature, "green" wins not because it is more logical, but because it is more *real* to the senses.
