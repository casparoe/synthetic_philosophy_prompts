answer: |-
  "You're telling me the kid in the trench opposite us, the one with the shaking hands, has the same moral standing as me because he wears a uniform. That's the line."

  "That's the convention, Dara. And it's the only thing keeping us from slaughtering everyone who disagrees with us. If liability tracks the justice of the cause, then every soldier becomes a judge. And judges don't take prisoners."

  "Judges recognize injustice. If I'm attacking your home to steal your land, you're allowed to stop me. If I'm attacking to stop a genocide, I'm allowed to shoot. The uniform doesn't magic away the difference. It just hides it."

  "It doesn't hide it, it brackets it. Because soldiers don't know the truth. They know orders. You want to tell me that conscript is morally liable to be killed because his government lied to him? Because he read the wrong newspapers?"

  "I'm saying he's contributing to an unjust threat. Liability isn't about blame, it's about responsibility. If he points a rifle at you, he's responsible for that threat. Whether he's culpable for it is separate. He might be excused. But he's still liable."

  "Excused but liable. That's a distinction that disappears when the bullet hits. And it's dangerous. If we tell our own troops that only the 'just' side has the right to kill, what happens when the other side claims justice? They always do. You remove the symmetry, you remove the incentive for restraint. You get total war. Civilians get caught in the crossfire of competing moral absolutes."

  "So the solution is to lie? To tell soldiers their cause doesn't matter so they feel better about killing for a lie? You think that protects civilians? The current convention lets aggressors fight clean wars. It tells them, 'Go ahead, invade, just follow the rules of engagement.' It legitimizes the initial violence."

  "It contains the violence. If I believe that kid opposite me is morally equal to me, I treat him as a combatant. I don't torture him, I don't hunt him after he surrenders. If I believe he's an unjust aggressor, he's a criminal. Criminals don't get POW status. They get summary judgment. You break the symmetry, you break the only reason we have to treat enemy soldiers as anything other than murderers."

  "Unless the asymmetry forces the unjust side to lay down arms. If the norm shifts—if the world agrees that fighting for an unjust cause makes you liable—then soldiers have a reason to refuse. Not just a legal reason, a moral one. You say it gets more people killed. I say it prevents unjust wars from being fought at all. Because who fights them?"

  "People who believe they're right. Which is everyone. You're relying on soldiers having access to objective moral truth in the fog of war. They don't. They have propaganda. They have fear. If you make their liability dependent on facts they can't verify, you're not creating justice, you're creating chaos. The state assumes the responsibility. That's the social contract. I lend the state my violence, the state lends me its legitimacy. Separated from the cause."

  "The state isn't a moral agent, Dara. People are. You can't outsource murder to a bureaucracy and call it clean because you signed a form. If the cause is unjust, the violence is unjust. Period. Hiding behind the uniform doesn't change the blood."

  "It changes the role. And the role is what keeps the blood from spreading. You want moral clarity? Fine. But don't pretend it comes without a body count. The convention is a firewall. It stops the war from bleeding into everything else. It says, 'We fight here, under these rules, regardless of why.' Without that, every skirmish is a crusade. And crusades don't end with treaties."

  "Maybe they shouldn't. Maybe some things shouldn't be settled by treaties between aggressors and victims. But I hear you. You're saying the truth is too expensive."

  "I'm saying the truth is too heavy for the guy holding the rifle. He needs to know who to shoot, not why. The 'why' is for us. The 'who' is for him."

  "And if the 'why' is a lie? Then he's shooting for nothing. And you're asking me to tell him that's okay."

  "I'm asking you to tell him he's still a soldier. Not a saint. Not a criminal. Just a soldier. Because if he's a criminal, then I'm not fighting a war. I'm policing a gang. And I don't have the handcuffs for that."

  "Then maybe we shouldn't be fighting wars we can't police."

  "Maybe. But we are. And tonight, that kid in the trench is just as likely to kill me as I am him. And I'd rather know the rules we're both dying by are the same."
