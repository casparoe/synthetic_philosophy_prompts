answer: |-
  This is a profound observation, and you have put your finger on a distinction that many public writers feel but struggle to articulate. What you experienced isn't just a difference in volume or tone; it is a difference in **category**.

  Psychologically and sociologically, the online pile-on and the colleague's email operate on completely different mechanisms. One is an attack on your **work** within a community of practice; the other is an attack on your **status** within a public square.

  Here is a breakdown of why they feel so different, and how you can use that distinction to protect your mental energy going forward.

  ### 1. Critique vs. Judgment (The Epistemic Difference)
  The most fundamental difference is the object of the feedback.

  *   **The Colleague (Critique):** His email was *epistemic*. It was about the relationship between your claims and the evidence. Even though it was harsh, it treated you as a peer capable of understanding nuance. It assumed a shared framework of truth. When he tore into your argument, he was implicitly saying, "You are part of this guild, and you need to hold up our standards." That feels like **correction**.
  *   **The Crowd (Judgment):** The social media comments were *social*. They were not trying to correct the science; they were signaling virtue to their own followers or expressing an emotional reaction to the *idea* of you. They weren't engaging with your argument; they were engaging with your **authority**. When they jabbed at you, they were saying, "You are not trustworthy," or "You are on the wrong side." That feels like **exile**.

  **The Takeaway:** Critique invites you to improve; judgment invites you to disappear. One expands your capacity; the other threatens your belonging.

  ### 2. The "Death by a Thousand Cuts" Effect
  You noted that no single person made a sustained case. This is crucial.

  *   **Sustained Argument:** Requires cognitive load. It requires the critic to read, think, and write. It signals that they value the topic enough to invest time.
  *   **Quick Jabs:** Require almost no cognitive load. They are heuristic-based ("Science writer says X is unproven" -> "Science writer hates health" -> "Leave a angry emoji").

  Psychologically, humans are wired to detect social consensus. When you see 50 people saying roughly the same thing, your brain's "social proof" heuristic kicks in and whispers, *"If this many people are upset, there must be a fire somewhere."* Even if you know logically that the points are weak, the **volume** mimics the weight of evidence. This is known as the **illusory truth effect**: repetition makes things feel truer, even if the sources are independent and low-quality.

  ### 3. Accountability and Risk
  *   **The Colleague:** He put his reputation on the line. He sent a traceable email from his professional address. If he was wrong or abusive, he risked damage to his own standing. That risk confers **weight** to his words.
  *   **The Crowd:** They are largely unaccountable. They face no social or professional cost for being wrong, rude, or misinformed. In game theory terms, they are playing a game with no downside.

  When you are critiqued by someone who has skin in the game, it feels like a transaction between professionals. When you are jabbed by people with no skin in the game, it feels like being pelted by rain. It's not a debate; it's weather.

  ### 4. Performative Outrage vs. Private Discourse
  The online comments were likely not intended for *you*.
  In the attention economy, a comment on a journalist's post is often a performance for the commenter's own audience. It is a way of saying, "Look, I am defending this health claim." You are merely the backdrop for their signaling.

  The colleague's email was intended *only for you*. It was a private attempt to align your understanding with reality.

  ### How to Handle This Going Forward

  You asked if this should change how you handle the online pile-on. The answer is yes, but not by thickening your skin. It changes by **re-categorizing the input.**

  **1. The "Colleague Test"**
  When the notifications start blowing up, ask yourself: *"Would the colleague who sent me that harsh email care about this specific point?"*
  If the answer is no, it is noise. It is not a counter-argument; it is an emotional discharge. You do not need to refute emotional discharge; you need to let it dissipate.

  **2. Separate "Social Pain" from "Professional Pain"**
  Acknowledge that the pile-on hurts, but label the pain correctly.
  *   The colleague's email caused **professional pain** (ego, intellectual pride). This is useful pain. It makes you a better writer.
  *   The pile-on caused **social pain** (fear of rejection, tribal ostracization). This is evolutionary pain. It is your brain warning you that you are being kicked out of the tribe.
  Remind yourself: *"I am not actually being exiled. These people do not know me. This is a false alarm from my amygdala."*

  **3. Stop Feeding the Performance**
  Since the online comments are often performative, engaging with them validates the performance. It turns a monologue into a dialogue, which boosts the algorithm and encourages more jabs.
  *   **Strategy:** Do not reply to the jabs. Save your energy for the colleagues. If a genuine critique emerges from the noise (rare, but possible), address it in a future piece, not in the comments section.

  **4. Value the Harsh Email**
  It is tempting to dread the harsh email from the expert. But in your line of work, that email is gold. It means you are writing things that matter enough for experts to correct. The pile-on means you touched a nerve; the expert email means you touched the **truth**.
  Going forward, try to view the colleague's harshness as a sign of respect. He wouldn't waste his time on you if he didn't think you were capable of getting it right.

  ### Summary
  The pile-on felt more damning because it attacked your **belonging**. The email felt like critique because it attacked your **logic**.
  *   **The Crowd** is judging whether you are *one of us*.
  *   **The Colleague** is judging whether you are *right*.

  As a science writer, your job is to be right, not to be universally liked by the crowd. The next time the notifications spike, visualize them as weather. It might be a storm, but it's not geology. It won't change the landscape. The email, however, that's geology. That's the ground shifting beneath you. Pay attention to that, and let the rest pass through.
