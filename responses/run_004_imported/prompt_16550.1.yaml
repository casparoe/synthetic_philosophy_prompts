  *Refinement:* Dalia should argue that in a civil war, the "fog" is thinner. You can't claim you didn't know the government was shelling its own cities. Therefore, the epistemic excuse fails here, restoring liability. This fits the "unnamed country/civil war" setting perfectly.

  8.  **Final Polish:** Check pacing and emotional resonance. Dalia's hands, Corso's notes. The weight of the coming trial.

