answer: |-
  The interrogation room smelled of stale tobacco and industrial cleaner, though neither of them smoked. A single bulb hummed overhead, casting a pale, sickly circle on the metal table between them. Outside the reinforced glass, the detention block was settling into its nightly rhythm of slamming doors and distant, muffled shouting.

  Dalia wrapped her hands around a tin cup of tea. It had gone cold twenty minutes ago. Across from her, Corso sat with a file closed in front of him. He looked tired. He was a civilian, one of the few left in the capital who hadn't fled or been conscripted, retained by the provisional government to ensure the upcoming tribunals looked like justice rather than vengeance.

  "You're reviewing my file," Dalia said. It wasn't a question.

  "I'm reviewing the framework," Corso corrected gently. "Yours is a representative case. Field medic. Non-combatant status technically, but you carried a sidearm. You operated in contested zones held by the Insurgency. The question the tribunal will ask isn't just what you did, but what right you had to do it."

  "The right to stitch a wound?"

  "The right to return a soldier to the fight," Corso said. "If the fight itself was illegitimate, does the aid become complicity?"

  Dalia took a sip of the cold tea. It tasted of iron. "That's the question, isn't it? Whether we were all just murderers in uniform."

  "I prefer 'combatants,'" Corso said. "And to answer you: No. You were soldiers. That status carries its own moral weight, independent of the politics."

  "Independent," Dalia repeated. She set the cup down. "That's the Walzerian line. The Moral Equality of Combatants. Once you put on the uniform, you're fair game, and I'm fair game, regardless of who started it."

  "It's not just a line, Dalia. It's a barrier," Corso said, leaning forward. "If we tie the right to kill to the justice of the cause—*jus ad bellum*—then every soldier becomes a judge. And if they judge wrongly, they become criminals. In the heat of battle, that distinction collapses. We need *jus in bello* to stand apart. Your liability to be killed comes from your status as a threat, not the righteousness of your government."

  "But I wasn't a threat," Dalia said. "I was a medic. And the man I saved? He was holding a checkpoint that was starving a district. If his cause was unjust, his threat was unjust. If I enable an unjust threat, how am I morally equal to the soldier shooting to stop him?"

  Corso sighed, rubbing his temple. "Because you cannot be expected to know the truth of the cause. That is the epistemic argument. Soldiers are given information by their chain of command. Propaganda flows both ways. To hold a private, or a medic, responsible for the grand strategy of the state is to demand a level of moral omniscience no human possesses. You acted in ignorance. Ignorance excuses."

  Dalia looked at her hands. They were scarred, the knuckles swollen. "This wasn't a war between nations, Corso. It was a civil war. We weren't reading intelligence briefings about foreign borders. We were shelling our own cities. We were cutting water to our own neighbors." She looked up, her eyes hard. "The epistemic fog you're talking about? It wasn't fog here. It was a mirror. We knew."

  Corso held her gaze. "Even if you knew, could you have acted otherwise? Conscientious objection in the midst of a civil conflict is often a death sentence, either by your own side or the other. Coercion mitigates responsibility."

  "So we are excused," Dalia said. "Is that your defense? That we are too stupid to know right from wrong, or too scared to act on it?"

  "I am saying that *liability* is not the same as *blame*," Corso said sharply. "This is where your revisionism gets dangerous. McMahan and his school argue that if the cause is unjust, the combatants are liable to be killed because they are morally responsible for an unjust threat. But if I grant that soldiers are often excused due to ignorance or coercion, as I just did, then they are not morally responsible. If they are not responsible, they are not liable. If they are not liable, killing them is murder."

  He paused, letting the logic hang in the air. "Do you see the trap? If you push the revisionist view, you force a binary. Either the unjust soldier is a culpable murderer who deserves death, or he is an innocent instrument who must not be touched. There is no middle ground for the reality of war."

  Dalia didn't blink. "I don't accept the binary. And I don't accept that 'excuse' wipes out 'liability'."

  "Explain."

  "A person can be non-culpable but still be a threat I am permitted to stop," Dalia said. "If a sleepwalker comes at me with a knife, he is not to blame. He is excused. He is morally innocent. But I am still permitted to kill him to save myself. His liability stems from the threat he poses, not his moral guilt."

  Corso nodded slowly. "The Innocent Threat argument. It's coherent in a vacuum. But apply it to the battlefield. If unjust combatants are merely 'innocent threats,' like the sleepwalker, then the force used against them must be minimized. You cannot target them indiscriminately. You cannot level a city block to get at them. Yet, under the traditional view I defend, we accept collateral damage because they are legitimate targets *by status*. If you move to the revisionist view, the constraints on *how* we fight the unjust become so tight that war becomes impossible to wage."

  "Maybe that's the point," Dalia said softly.

  Corso sat back. "That is a luxury of the victor. Or the philosopher. For the rest of us, the Moral Equality of Combatants is a humanitarian fiction. It protects the prisoner. It protects the medic. It says, 'You fought, you lost, you go home.' It prevents the victor from saying, 'Your cause was wrong, therefore every bullet you fired was a crime, and therefore you must all be purged.'"

  He tapped the closed file. "If I adopt your view, Dalia, I cannot recommend clemency. I have to recommend the gallows. Because if the war was unjust, and you enabled it, you are not a soldier. You are an accessory to mass murder. Is that what you want? To be judged by the justice of the cause?"

  Dalia felt the cold seep through the metal table into her bones. "I want the truth. Even if it burns."

  "The truth is messy," Corso said. "In a civil war, especially. But consider the alternative. If we tell soldiers that their immunity depends on the objective morality of their orders, what happens when they are unsure? Do they fight harder to win quickly, to avoid the tribunal? Do they refuse to surrender because they know surrender means a trial for murder rather than a POW camp? The traditional view encourages surrender. It encourages restraint. It creates a convention that saves lives."

  "It saves lives by lying," Dalia countered. "It tells the boy with the rifle that he is a hero defending the homeland, and tells the boy shooting him that he is a hero stopping a tyrant. It tells them both they are equals. But one of them is protecting a system that was grinding people into dust. When I bandaged that man's leg, I wasn't just stopping bleeding. I was helping him go back to the checkpoint. I was helping him maintain the siege. If the siege was wrong... then my bandage was a weapon."

  "And if you believed the siege was necessary to prevent the capital from falling to insurgents who would have executed everyone inside?" Corso pressed. "Who decides the justice, Dalia? The tribunal? They are the victors. History is written by the survivors. If moral liability tracks the justice of the cause, then might makes right. The winner is, by definition, the just side, because they won. And the loser is liable to be killed because they lost."

  Dalia looked away, toward the reinforced window. Her reflection stared back, ghostly against the dark glass. "I know the victors will write the history. I'm not asking for their verdict. I'm asking about the blood. Does it wash off because I wore a uniform? Or does it stay because I knew, deep down, that we were on the wrong side?"

  Corso was silent for a long moment. The hum of the light seemed to grow louder.

  "I don't know," Corso said finally. His voice was lower, stripped of the lecturer's cadence. "I defend the convention because I fear the alternative. But I lie awake wondering if I am building a shelter out of paper. You ask if the blood washes off. I ask if we can survive looking at it."

  He opened the file, then closed it again without looking down.

  "If I argue the traditional line at the tribunal," Corso said, "you live. You serve time, perhaps. You walk away in five years. The court accepts that you were a combatant bound by the rules of the time."

  "And if you argue the revisionist line?"

  "Then we have to determine the degree of your knowledge. The degree of your agency. It becomes a trial of conscience, not just conduct. It could go either way. You could be exonerated as a coerced participant, or you could be convicted as a principal in an unjust aggression."

  Dalia rubbed her thumb over the rim of the cup. "And you? Which do you believe?"

  Corso looked at her, and for the first time, he looked less like an advisor and more like a man standing on a precipice. "I believe that if we strip away the fiction of equality, war becomes extermination. I believe that is a greater evil than letting some unjust combatants walk free." He paused. "But I also believe that when I sit across from someone like you, who saw the machinery up close... the fiction feels very thin."

  "So you'll let the tribunal decide."

  "I'll present the arguments. Both of them." Corso stood up, the chair scraping loudly against the floor. "The law requires a verdict, Dalia. Philosophy rarely offers one. You want to know if you are liable. The law will tell you if you are guilty. They are not the same thing."

  "Is that supposed to comfort me?"

  "No," Corso said. He picked up his briefcase. "It's supposed to prepare you. The tribunal convenes on Tuesday."

  He moved toward the door, then stopped, his hand on the latch. He didn't turn around.

  "For what it's worth," he said to the metal door. "In a civil war... the epistemic excuse is weaker. You were right about that. We knew our neighbors. We knew the streets."

  He opened the door. The noise from the corridor rushed in—boots, voices, the reality of the occupation.

  "Get some sleep, Dalia."

  The door clicked shut. Dalia sat alone in the circle of light. She looked at her hands again. They were still. They did not look like the hands of a sleepwalker. But she still didn't know if they were clean.
