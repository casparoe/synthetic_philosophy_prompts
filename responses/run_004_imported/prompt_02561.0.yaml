      *   Conclude with actionable advice.

      *(Self-Correction on the "Mistake"):* Is it actually a mistake? If the prior is *justified* and strong enough, dismissing weak evidence is efficient. The mistake is assuming the prior is *infallible*. The reasoning error is treating a high probability as a certainty (Probability 1 vs. 0.99).

  8.  **Finalizing the Output Structure:**
