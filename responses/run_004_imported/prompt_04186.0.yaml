      *   **ILL (Illusionist):** Needs to be well-versed in Frankish/Dennett. Needs to distinguish between *phenomenal properties* and *quasi-phenomenal properties*. Needs to argue that "seeming" is a functional/judgmental state, not a felt state. Think Keith Frankish or Daniel Dennett.

  3.  **Key Philosophical Moves to Include:**
