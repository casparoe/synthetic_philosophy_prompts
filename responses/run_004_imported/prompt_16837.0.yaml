  9.  **Constructing the Response:** (Self-Correction during drafting)
      *   *Caution:* Don't overstate Wittgenstein's influence on Neurath. Neurath was influenced more by Comte and Marx than Wittgenstein, despite being in the Circle.
      *   *Caution:* Don't dismiss the connection entirely. They share the "Unity of Science" goal.
