      *   **Core Question:** Are these two notions of "picture" philosophically related (is Neurath's a special case of Wittgenstein's?), or is the shared vocabulary coincidental/superficial given their different functional capacities (e.g., handling negation, logic)?
      *   **Task:** Compare the two notions of "picture" precisely, define requirements for each, and argue whether they are instances of a single idea or distinct projects.

  2.  **Deconstruct the Two Concepts:**

      *   **Wittgenstein's *Bild* (Picture Theory in the *Tractatus*):**
          *   *Context:* Early Wittgenstein, logical atomism.
          *   *Definition:* A proposition is a picture of reality.
          *   *Mechanism:* Isomorphism. The proposition shares the "logical form" (structure) with the fact it depicts. Elements of the proposition correspond to objects in the world; the arrangement of elements corresponds to the arrangement of objects.
          *   *Scope:* *All* meaningful language (that describes states of affairs).
          *   *Logic:* Handles negation, disjunction, conditionals via truth-functions. A negative proposition pictures the *absence* of a state of affairs (or rather, asserts that the logical space is configured such that the fact does not obtain).
          *   *Goal:* Demarcating the limits of sense. Showing what can be said vs. what can only be shown.
          *   *Nature:* Abstract, logical, structural. Not necessarily visual.

      *   **Neurath's ISOTYPE (Vienna Method):**
          *   *Context:* Logical Empiricism/Positivism, Unified Science, Adult Education/Social Reform.
          *   *Definition:* A system of visual education/statistics using repeated icons.
          *   *Mechanism:* Repetition of units (not scaling size) to represent quantity. Transformation of complex data into intuitive visual forms.
          *   *Scope:* Statistical data, social facts, economic trends.
          *   *Logic:* Weak on formal logic. Struggles with negation ("no houses"), conditionals ("if x then y"), or abstract generality. It shows *what is there*, not necessarily *what is not* or *what could be*.
