  5.  **Formulating the Argument:**
      *   *Thesis:* While both emerge from the same intellectual milieu (Vienna Circle) and share a desire to purify representation, they are fundamentally different projects. Treating ISOTYPE as an application of the *Tractatus* picture theory is a category mistake.
