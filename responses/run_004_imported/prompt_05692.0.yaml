answer: |-
  First off, tell Marcus you're sorry for keeping him up, but also tell him he has excellent taste in ethical theory. You two are basically reenacting a debate that has occupied Kant scholars for the last 50 years. You didn't garble the seminar memory; you actually stumbled into one of the most famous interpretive cruxes in modern Kantianism.

  Here is the breakdown of your four questions, followed by a verdict on who wins the argument (and how to fix the friendship).

  ### 1. Are you running CC vs. CW correctly?

  **Yes, structurally you are.**

  *   **Contradiction in Conception (CC):** You ask, "Can I even *conceive* of a world where this maxim is a universal law of nature?" If the action becomes impossible or the concept self-destructs in that world, it fails CC. (Generates **Perfect Duties**).
  *   **Contradiction in Will (CW):** You ask, "Can I *rationally will* that world?" Even if the action is possible, does willing it contradict something else I necessarily will (e.g., my own happiness, the development of my talents)? (Generates **Imperfect Duties**).

  Your application of the mechanics is textually faithful to the *Groundwork*. You identified that the institution (job market) survives universalization (CC pass), but the *agent's purpose* is thwarted by universalization (CW fail).

  ### 2. Does the resume case land where you think it does?

  **Mostly yes, but with a major caveat on the moral verdict.**

  Your analysis that the resume padding passes CC is strong. This is often called the **"Institutional Adaptation" objection**. In the false-promising case, Kant argues that if everyone falsely promised, the *institution of promising* would vanish because no one would believe a promise. But with resume padding, the institution of *hiring* doesn't vanish; it just becomes noisier. Employers add friction (more interviews, skills tests). The concept of a "resume" doesn't logically collapse; it just becomes less efficient.

  However, you made one slip in your write-up:
  > *"fails CW but not CC — more like an 'imperfect duty' violation, shady but not strictly forbidden."*

  **Correction:** In Kant's system, if a maxim fails *either* test, acting on it is **forbidden**.
  *   **Perfect Duties (CC Fail):** Strict prohibition (e.g., "Never lie").
  *   **Imperfect Duties (CW Fail):** Wide obligation (e.g., "Help others"). You aren't required to help *everyone* at *all times*, but you are strictly forbidden from adopting the maxim of *never* helping anyone.

  So, if you are right that resume padding fails CW, it is still **morally forbidden** to adopt it as a policy. It's not "shady but allowed." It's "forbidden, but it belongs to the category of vices that don't logically destroy the system."

  *Note:* Many Kantians would push back and say lying is *always* a CC failure (Perfect Duty) because it violates the dignity of humanity (Formula of Humanity), regardless of whether the FUL test seems to pass. But sticking strictly to your FUL analysis? You're on solid ground.

  ### 3. Is "the promising case is secretly a CW argument" a real criticism?

  **Yes. Marcus is channeling Christine Korsgaard, and he is not inventing it.**

  The paper you half-remember is almost certainly **Christine Korsgaard's "Kant's Formula of Universal Law" (1985)**.

  *   **The Traditional View (Yours):** CC is a *logical* contradiction (the concept vanishes). CW is a *teleological/volitional* contradiction (the purpose is thwarted).
  *   **The Practical Contradiction View (Marcus/Korsgaard):** Korsgaard argues that *both* tests are actually about purposes.
      *   In **False Promising**: If everyone falsely promises, the *purpose* of the action (getting money by making a promise) becomes impossible because no one believes promises. This looks like a CC, but Korsgaard says it's actually a "Practical Contradiction."
      *   In **Non-Beneficence**: If no one helps, the *purpose* of the action (pursuing one's own ends) is thwarted because we sometimes need help. This is a CW.

  Marcus's point is that if you accept Korsgaard's "Practical Contradiction" interpretation, the line between CC and CW blurs. Both become questions about whether universalization makes your goal impossible to achieve.

  Marcus is also referencing a known problem called the **"Collapse Objection."** If you allow the "Institutional Adaptation" move (i.e., "employers will just adjust"), you can save almost *any* maxim from CC failure.
  *   *Universal Theft?* No, we'll just build better locks. Property concept survives.
  *   *Universal Murder?* No, we'll just hire bodyguards. Humanity survives.

  If "adaptation" saves the resume case from CC, Marcus is right to ask why it doesn't save the false-promise case. (Kant's reply is usually that promising relies on *trust* specifically, whereas hiring relies on *evidence*, but it's a thin line).

  ### 4. Who is closer to right about the CC/CW distinction?

  **It's a draw, but Marcus has the stronger scholarly artillery.**

  *   **You are right** that Kant *intended* a distinction. The text of the *Groundwork* clearly separates logical impossibility from volitional inconsistency. If you throw that out, you lose Kant's distinction between Perfect and Imperfect duties, which is central to his moral system.
  *   **Marcus is right** that the distinction is philosophically fragile. The "Logical Contradiction" reading of CC is widely considered the weakest part of Kant's ethics. It's too easy to argue that "concepts don't vanish, they just change." Korsgaard's intervention (which Marcus is citing) was designed to fix this by making *both* tests about practical rationality.

  **The Verdict:**
  Marcus is closer to the **modern consensus** among Kant scholars (that the Logical Contradiction reading is untenable and Korsgaard's Practical Contradiction reading is superior).
  You are closer to the **textual literalism** (Kant says there are two different kinds of contradictions).

  However, Marcus loses points for saying the distinction is "fake." Even under Korsgaard's view, there is a difference between a purpose that is *immediately* thwarted by universalization (CC/Perfect Duty) and a purpose that is thwarted due to *contingent facts about human needs* (CW/Imperfect Duty). The distinction does work, just not the way Kant originally advertised.

  ### How to Make Up with Marcus

  1.  **Validate him:** Tell him, "I looked it up. You were basically arguing for Korsgaard's Practical Contradiction interpretation. I wasn't hallucinating that."
  2.  **Hold your ground gently:** "But even Korsgaard keeps a distinction between immediate practical contradiction and volitional contradiction, so the CC/CW line still does *some* work, even if it's not logical vs. teleological."
  3.  **The Resume Case:** Admit that if Marcus is right about the "Collapse Objection," then the resume case might actually fail CC after all (because if *everyone* pads, the concept of a 'credential' loses its normative force, not just its efficiency).

  **Summary for your notes:**
  *   **CC/CW Mechanics:** You applied them correctly.
  *   **Resume Case:** Plausible CC pass / CW fail, but implies the act is still forbidden, not just "shady."
  *   **Marcus's Source:** Real. Korsgaard (1985).
  *   **Who Won:** Marcus wins on meta-ethics (the distinction is porous); You win on exegesis (Kant definitely thought they were different).

  Go buy Marcus a coffee. He knows his Kant.
