      *   Classical Chinese: *Jun jun*. Noun + Noun (functioning as verb).
      *   Meaning: "To *jun* the *jun*." To act the part of the ruler. To realize the fullness of the role.
      *   Ames/Rosemont interpretation: It's performative and processual. It's not matching a pre-existing abstract ideal (Platonic form of Ruler); it's the ongoing creative realization of the relationship.
