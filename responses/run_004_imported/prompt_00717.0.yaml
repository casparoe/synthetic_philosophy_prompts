answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified the translation pitfall in Legge (and many others) and put your finger on the exact philosophical pressure point where Confucian Role Ethics (CRE) is most vulnerable to critique.

  Here is a breakdown of the grammatical nuance, how Ames and Rosemont leverage it for their strong claim, and how defenders of CRE attempt to resolve the circularity/normativity worry you raised.

  ### 1. The Grammar: From Ontology to Performance

  You are right to be suspicious of Legge's "prince is prince." In Classical Chinese, the *N N* construction (specifically *Jun jun*, *Chen chen*) is widely understood by philologists as a **denominal verb** usage.

  *   **Legge's Reading (Static/Ontological):** "The ruler *is* a ruler." This implies a classification problem. It suggests there is a fixed essence of "Ruler-ness," and the empirical person must match that essence. This leans toward a Platonic reading or a simple logical tautology.
  *   **The Verbal Reading (Dynamic/Performative):** "Let the ruler *ruler*." Or, "The ruler must *act the part* of the ruler."

  **How this serves Ames and Rosemont:**
  Ames and Rosemont argue that early Confucianism is not interested in *being* (ontology) but in *becoming* (process cosmology). By treating the noun as a verb, the text shifts the ethical demand from **matching a definition** to **sustaining a performance**.

  For CRE, a "role" is not a job description handed down from heaven (which would be a principle). It is a living, breathing focal point of relationships. To *jun jun* is to actively maintain the relational nexus that makes one a ruler. If the ruler stops "ruler-ing" (performing the rituals, caring for the people, listening to ministers), he ceases to be a ruler, not because he violated a rule, but because the relationship has collapsed.

  **The Philosophical Work:**
  This grammar supports the claim that morality is **constitutive** rather than **regulative**.
  *   *Regulative:* "I am a ruler; therefore, I must follow Rule X." (Principle Ethics)
  *   *Constitutive:* "In the act of 'ruler-ing' properly, the moral life is realized." (Role Ethics)

  The grammar suggests that the moral value is *internal* to the performance of the role, not external to it.

  ### 2. Analects 12.11 vs. Rectification of Names (13.3)

  You asked why 12.11 is a better proof-text than 13.3 (*Zhengming*). This is a crucial distinction.

  *   **Analects 13.3 (Rectification of Names):** "If names are not correct, language is not in accordance with the truth of things..."
      *   *The Risk:* This is often read as linguistic prescriptivism or conservatism. It can sound like: "Ensure reality matches the label." This allows for an interpretation where there is an abstract standard (the "Name") that reality must bow to. This could support a Deontological reading (follow the duty of the Name).
  *   **Analects 12.11 (The Duke Ching Passage):**
      *   *The Advantage for CRE:* Here, Confucius does not appeal to "The Name of Ruler." He appeals to the **dyad**. Notice the pairing: Ruler-Minister, Father-Son.
      *   Ames and Rosemont argue that 12.11 demonstrates that the *source* of the obligation is the **relational context itself**, not the label.
      *   In 13.3, one could argue the "Name" is the authority. In 12.11, the authority is the **flourishing of the specific relationship**. The Duke's response confirms this: "If... the father [does not] father... can I enjoy my revenue?" The consequence is the breakdown of the relational order, not the violation of a cosmic law.

  Therefore, 12.11 is stronger evidence for Role Ethics because it locates the political order entirely within the successful execution of specific, particular relationships, without appealing to an abstract concept of "Justice" or "Law."

  ### 3. The Circularity/Normativity Worry

  This is the hardest philosophical hurdle. Your worry is: *If "being a father" just means "doing what a father does," is it tautological? If it means "doing what a **good** father does," haven't you just snuck in an independent standard (virtue/principle)?*

  Defenders of Confucian Role Ethics (Ames, Rosemont, and later scholars like Eric Hutton or Robin Wang) generally offer three lines of defense against this charge.

  #### A. The "Thick" vs. "Thin" Role
  The circularity charge assumes the role is a "thin" container (an empty shell waiting to be filled by virtue). CRE argues the role is "thick."
  *   **Argument:** To be a "Father" in the Confucian context is not an abstract category. It is a historically sedimented practice filled with specific rituals (*Li*), stories, and precedents.
  *   **Resolution:** The standard is not independent of the role; it is **internal to the tradition of the role**. We know what "fathering" looks like not by consulting a moral rulebook, but by looking at how fathers have successfully sustained families in the past. The normativity comes from the **weight of tradition** and the **needs of the specific family**, not an abstract "Good."
  *   **Analogy:** Think of "playing Jazz." What is a good Jazz performance? It's not defined by an external rule (like classical theory), but by the internal standards of the Jazz tradition and the specific interaction of the band members. It's not tautological ("Jazz is Jazz"), but the standard is internal to the practice.

  #### B. Relational Ontology (No "Self" Behind the Role)
  The circularity worry assumes there is an "agent" who *has* a role and must decide how to fill it.
  *   **Argument:** Ames and Rosemont argue that in early Confucianism, there is no discrete individual prior to their roles. You *are* your roles (son, father, minister, neighbor).
  *   **Resolution:** The question "What should I do?" is always "How do I optimize this relationship?" There is no need for an independent standard because there is no "self" standing outside the relationship to consult one. The "good" is simply the **harmonious flourishing of the relationship**. If the relationship flourishes, the role was performed correctly. The standard is **aesthetic/harmonic** (does it work? is it beautiful/harmonious?) rather than **moralistic** (does it obey the law?).

  #### C. The "Not-Yet" Aspect (Aspirational vs. Descriptive)
  *   **Argument:** The phrase *Fu fu* ("Father father") is aspirational. Most biological fathers are not fully "fathering."
  *   **Resolution:** It is not a tautology because the second "Father" functions as a **normative ideal inherent in the relationship**. It means "Realize the full potential of this relationship."
  *   **Addressing the "Virtue" Counter:** Critics (like Stephen Angle or Bryan Van Norden) argue this *is* Virtue Ethics (*Ren*, *Yi*). CRE defenders reply that *Ren* (Benevolence) is not a pre-existing character trait. *Ren* is the **quality of the relationship** when roles are properly realized. You don't bring *Ren* to the role; *Ren* emerges *from* the successful "fathering." Thus, the role remains the primary explanatory unit.

  ### 4. Suggestions for Your Paper

  Given your seminar context, here is a suggested strategy for drafting your paper:

  1.  **Start with the Grammar:** Explicitly critique Legge. Use the "denominal verb" analysis to establish that *Jun jun* is an activity, not a classification. Cite E. Bruce Brooks or A.C. Graham on Classical Chinese grammar if you need philological backup.
  2.  **Define the "Strong Claim":** Clearly state what Ames/Rosemont mean by Role Ethics (normativity derives from relationships, not principles/virtues).
  3.  **The "Source of Normativity" Argument:** Frame your analysis around where the "ought" comes from.
      *   *Principle Ethics:* The "ought" comes from Reason/Heaven/Utility.
      *   *Virtue Ethics:* The "ought" comes from the character of the agent.
      *   *Role Ethics (12.11):* The "ought" comes from the **requirements of the relationship itself**.
  4.  **Engage the Circularity Worry:** Don't hide from it. Make it a central section.
      *   State the worry clearly (as you did in your prompt).
      *   Offer the CRE defense (The "Thick Role" / Internal Standards).
      *   **Critical Turn:** You might argue that while CRE avoids *explicit* appeal to principles, it relies on *Li* (Ritual) as the content of the roles. Is *Li* just a codified set of principles? If so, is the distinction between Role Ethics and Rule Ethics as sharp as Ames claims? (This shows graduate-level critical engagement).
  5.  **Conclusion:** Conclude that 12.11 supports Role Ethics *if* one accepts the processual/relational ontology. If one holds onto an individualist ontology, the passage collapses into tautology or virtue ethics. Thus, the passage is a proof-text for Role Ethics *only* within the broader metaphysical framework Ames and Rosemont propose.

  ### Key References to Consider
  *   **Ames & Rosemont:** *The Analects of Confucius: A Philosophical Translation* (Their introduction and notes on 12.11 are essential).
  *   **Henry Rosemont Jr.:** *Against Individualism: A Confucian Rethinking of the Foundations of Morality, Politics, Family, and Religion*.
  *   **Stephen C. Angle:** *Sagehood: The Contemporary Significance of Neo-Confucian Philosophy* (He offers a nuanced critique, arguing for a blend of Virtue and Role ethics).
  *   **Bryan W. Van Norden:** *Virtue Ethics and Consequentialism in Early Chinese Philosophy* (He argues against the "Role Ethics" label, suggesting it's actually Virtue Ethics). Reading him will help you steelman the counter-argument to Ames/Rosemont.

  Your intuition that the "role" might be doing less work than advertised is shared by many critics. A paper that acknowledges this tension while explicating *why* Ames and Rosemont think the grammar of 12.11 saves the theory would be very strong.
