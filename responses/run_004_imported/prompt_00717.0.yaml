  8.  *(Post-Drafting Review)*: Did I address the "independent standard" worry sufficiently? I need to emphasize that for Ames/Rosemont, the "standard" is the *history of the relationship itself*, not a transcendent rule. This avoids the "importing virtue" charge because the virtue is constitutive of the role, not prior to it.

