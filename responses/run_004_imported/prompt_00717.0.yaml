  3.  **Address Philosophical Question 1: Role Ethics vs. Rectification of Names (13.3):**
      *   *Analects* 13.3 (Rectification of Names - *Zhengming*): Often read as linguistic prescriptivism (words must match reality).
      *   *Analects* 12.11: Often read as the practical application of *Zhengming*.
      *   Ames/Rosemont's twist: They argue against reading *Zhengming* as "matching reality to abstract definitions." Instead, they read it as "focusing attention on the specific relational context."
      *   Why 12.11 is a "proof-text": It reduces the entirety of government to specific relational dyads (Ruler-Minister, Father-Son). There is no appeal to "Justice," "Utility," or "Benevolence" (explicitly, though *Ren* is implied in the *doing*). The *source* of the obligation is the role itself, not an external principle.
      *   Grammar's role: The verbalization of the noun emphasizes *activity* within the relationship, not static classification.

