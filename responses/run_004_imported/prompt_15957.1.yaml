answer: |-
  ### The Example: Newcomb's Problem with a Source-Code Predictor

  A canonical example of the difficulty embeddedness creates for standard expected-utility reasoning is **Newcomb's Problem**, specifically when framed computationally.

  **The Setup:**
  An agent faces two boxes: Box A is transparent and contains $1,000; Box B is opaque and contains either $1,000,000 or nothing. The agent can choose to take only Box B ("one-box") or both Box A and Box B ("two-box").

  Before the agent chooses, a predictor (Omega) has already filled Box B. Omega is not magical; it is a super-intelligent computer program that operates by simulating the agent's decision algorithm. Omega runs a perfect simulation of the agent's source code in a virtual environment identical to the real one. If the simulation one-boxes, Omega puts $1,000,000 in Box B. If the simulation two-boxes, Omega leaves Box B empty.

  **The Cartesian Reasoning (Causal Decision Theory):**
  A Cartesian agent views itself as distinct from the environment. It treats its action as a "surgical intervention" that does not causally affect the past. From this vantage point, Omega's prediction is already fixed.
  *   If Box B has $1M, taking both yields $1,001,000 (better than $1M).
  *   If Box B is empty, taking both yields $1,000 (better than $0).
  *   **Conclusion:** Regardless of the state of Box B, two-boxing yields more money. The Cartesian agent two-boxes and typically receives only $1,000.

  **The Embedded Difficulty:**
  The embedded agent recognizes that it is not distinct from the environment. Its decision is the output of a physical computation that Omega has already simulated. The agent's reasoning process is an object *within* the environment Omega analyzed.

  Standard expected-utility reasoning requires the agent to evaluate counterfactuals: *"What would happen **if** I one-boxed?"*
  For a Cartesian agent, this is straightforward: hold the rest of the universe fixed, change the action node, and observe the result.
  For an embedded agent that knows its own source code, this counterfactual is logically fraught. If the agent's code is deterministic, then "If I one-boxed" is a counterpossible (a contradiction). The agent knows that given its current code and inputs, it *will* two-box. To imagine a world where it one-boxes is to imagine a world where either its source code is different or the laws of logic are broken.

  If the agent treats its action as independent (Cartesian), it ignores the logical correlation between its output and Omega's simulation, leading to a suboptimal payoff ($1,000 vs $1,000,000). If it tries to account for the correlation using standard evidential reasoning, it risks "hallucinating" control over events it cannot causally influence (e.g., in the "Smoking Lesion" problem). The difficulty lies in constructing a counterfactual that respects the logical dependency between the agent's reasoning and the environment's state without collapsing into contradiction.

  ### Why the Trouble Depends on Reasoning as an Object

  The failure of standard expected-utility reasoning here depends entirely on the fact that **the agent's reasoning process is an object within the environment it is reasoning about.**

  1.  **Logical Entanglement:** In a Cartesian framework, the agent and environment are connected only via input/output channels. The agent's internal calculation is invisible to the environment until an action is emitted. In the embedded Newcomb scenario, Omega accesses the agent's *algorithm*, not just its output. The environment contains a model of the agent's mind.
  2.  **The Breakdown of Intervention:** Standard expected utility relies on the `do()` operator (from causal calculus), which severs the links between an action and its prior causes. However, when the agent's decision is the result of a logical function $f(input)$, and the environment's state is determined by $f(input)$, you cannot surgically alter the output of $f$ without altering $f$ itself.
  3.  **Self-Reference:** To reason correctly, the agent must reason about a system (the world + Omega) that contains a simulation of the agent reasoning about the system. This creates a self-referential loop. Standard probability theory assumes a "view from nowhere"—a probability distribution over worlds that exists independently of the observer. Embeddedness destroys this; the observer is a variable within the distribution.

  ### Technical Wrinkle or Deep Limit?

  In my view, this difficulty reflects **something deeper about the limits of formal rationality**, rather than a merely solvable technical wrinkle.

  While proposed solutions like Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) offer formalisms that navigate Newcomb-like problems successfully, they rely on the notion of "logical counterfactuals"—a concept that is not yet rigorously defined in mathematics. The core issue is Gödelian: a formal system cannot contain a complete and consistent model of itself.

  If an agent is truly embedded, it must be smaller than the environment (since it is a part of it). Therefore, it cannot possess a perfect model of the environment, because that model would necessarily include a model of itself, leading to infinite regress or incompleteness. This implies that **perfect rationality is structurally impossible for embedded agents.**

  Any agent that acts within the world must operate with a self-model that is necessarily approximate or incomplete. The "difficulty" in Newcomb's problem is not just a bug in decision theory; it is a symptom of the fundamental incoherence of trying to apply an external, God's-eye optimization standard to a subsystem that is part of the system being optimized. Rationality, for embedded agents, cannot be about finding the global optimum; it must be about managing the inevitable blind spots that arise from being a part of what you are studying.
