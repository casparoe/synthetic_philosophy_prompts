answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Birch Lake Water & Lake-Management District
  **FROM:** [Your Name]
  **DATE:** October 26, 2024
  **SUBJECT:** Recommendation Regarding Voting Eligibility & Bylaw Amendment

  **Context**
  As we prepare to vote on the tenants' petition next month, we need to acknowledge that our 1968 bylaws no longer reflect the reality of Birch Lake. When the rule of "one vote per recorded title" was written, ownership and residency were effectively the same thing. Today, with over a third of our parcels rented year-round and a significant number of owners living out of state, that assumption has fractured. We have a governance system where the people drinking the water often have no say in its management, and the people with the say often do not experience the daily consequences of our decisions.

  However, we must also take seriously the concerns raised by our absentee owners. Their argument is not simply about privilege; it is about risk. They contend that voting rights should track financial exposure. If a tenant votes to defer maintenance or keep rates artificially low to benefit their short-term tenancy, the owner bears the long-term cost in property depreciation and special assessments. We cannot wave this away. A voting system that incentivizes short-term consumption at the expense of long-term infrastructure solvency hurts everyone, including the tenants who need reliable water and a healthy lake.

  **The Core Principle: "One Parcel, One Stake"**
  There is no neutral way to draw this line, but there is a pragmatic one. We should move from a definition of "Stake" based solely on *equity* (ownership) to one based on *commitment* (ownership or long-term residency).

  The goal is not to dilute the voting power of the district (we should not have more votes than parcels), but to ensure the single vote attached to each parcel is cast by the party most invested in its immediate and medium-term habitability.

  **Recommendation**
  I propose we amend the bylaws to adopt a **"Designated Parcel Voter"** model.

  1.  **Maintain One Vote Per Parcel:** We do not increase the total number of votes. This prevents vote inflation and keeps the district's financial weight consistent.
  2.  **Expand Eligibility:** Voting eligibility for a parcel extends to either the recorded title holder **OR** a primary resident who has maintained a continuous lease and residency for at least **36 months**.
  3.  **Conflict Resolution:** If both an owner and a qualified long-term resident wish to vote for the same parcel, they must designate a single voter. If they cannot agree, the vote defaults to the owner, *unless* the resident has resided there for 60+ months, at which point the right defaults to the resident.

  **Addressing the Financial Exposure Argument**
  To the trustees concerned about short-termism: A 36-month residency requirement filters out transient tenants. A family that has lived here for three years has a "use stake" that mimics ownership. They are not voting on next month's rent; they are voting on the water they will drink for the next three years. Bad water quality or failing docks hurt them just as they hurt owners.

  Furthermore, this model forces communication. By requiring owners and long-term tenants to agree on who casts the vote, we incentivize lease agreements that clarify expectations about district assessments. If an owner is truly concerned about financial exposure, they can structure leases to pass assessment costs directly to tenants, aligning the tenant's financial incentive with the owner's.

  **Implementation Plan**
  Changing governance rules requires stability. I recommend the following phase-in:

  *   **November 2024:** Board votes to draft amendment language.
  *   **January 2025:** Public hearing and legal review to ensure compliance with state special-district laws.
  *   **July 1, 2025:** Registration opens. Owners and tenants must declare their voting status for their parcel.
  *   **January 1, 2026:** New voting rules take effect for the annual budget vote.

  **Regarding Non-Owner Stakeholders (The Marina)**
  The marina operator's situation is distinct. Because he owns no land within the boundary, granting him a vote would require a boundary adjustment or a separate legal class of membership, which opens a much larger can of worms. I recommend we table his request for a separate advisory committee review, rather than bundling it with this residential voting amendment.

  **Conclusion**
  Keeping the 1968 rules unchanged risks a legitimacy crisis where the majority of year-round residents feel governed by a committee of absentees. Conversely, granting immediate voting rights to all tenants risks the financial stability our owners protect. The "Designated Parcel Voter" model strikes a balance. It respects the financial container of the parcel while acknowledging that living here for three years creates a legitimate stake in the lake's future.

  I ask that we circulate this framework for discussion at our November 15th meeting.
