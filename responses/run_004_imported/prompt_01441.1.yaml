answer: |-
  You have stumbled onto a genuinely sophisticated philosophical distinction that ethicists actually debate. Your intuition is spot on: there is a fundamental asymmetry here. The reason standard hypocrisy feels poisonous while your coworker's behavior feels merely neurotic (or sad) comes down to **what is being violated.**

  Standard hypocrisy violates **fairness and authority.** Your coworker's behavior violates **consistency**, but preserves authority.

  Here is the breakdown of what is going on "under the hood," using the concepts philosophers use to talk about blame and standing.

  ### 1. What Hypocrisy Actually Is (It's not just inconsistency)
  We often define hypocrisy loosely as "doing the thing you tell others not to do." But philosophers argue that isn't quite right. If I tell you "Don't smoke, it's bad for you," and then I smoke, I am being inconsistent, but am I necessarily a *hypocrite*?

  Not unless I am claiming a **special exemption.**

  True moral hypocrisy involves a claim to **moral superiority** or **privilege.** The hypocrite says, implicitly or explicitly: *"I am the kind of person who follows the rules, and you are not. Therefore, I have the authority to judge you."*

  When they get caught breaking the rule, their authority collapses because their claim to superiority was a lie. They were pretending the rule applied to everyone, but acting as if it didn't apply to them. This is why they lose the "standing" (the right) to blame others. They have undermined the very norm they are trying to enforce by showing that they don't actually respect it.

  ### 2. Your Coworker's "Reverse Inconsistency"
  Now look at your coworker. She makes a mistake. She spirals. She punishes herself emotionally for days. Then she sees you make a mistake and she criticizes you.

  Is she inconsistent? Yes. She applies a harsher penalty to herself than to you.
  Is she a hypocrite? **No.**

  Here is why: She is not claiming a **privilege.** She is claiming a **burden.**

  *   **The Hypocrite says:** "The rule applies to you, but I am too special/important/good for the rule to apply to me."
  *   **Your Coworker says:** "The rule applies to both of us. In fact, it applies *more* to me. I am unworthy, and I must suffer more for this than you do."

  Because she is not exempting herself from the moral standard, she is not undermining the validity of the standard. In fact, she is reinforcing it. She is signaling that the rule is *so important* that violating it deserves extreme punishment (which she inflicts on herself).

  When she criticizes you, she isn't saying, "I am better than you." Her behavior suggests she feels *worse* than you. Therefore, her criticism doesn't carry the same sting of unfairness. She isn't trying to elevate herself above you; she is dragging herself below you.

  ### 3. The Concept of "Moral Standing"
  Philosophers (like R. Jay Wallace or Kyle Fritz) talk about the **"Standing to Blame."** To have the standing to blame someone, you generally need to show that you respect the norm you are enforcing.

  *   **Standard Hypocrite:** Loses standing because their actions show they *don't respect the norm* (they break it whenever it's convenient). Their blame is seen as a power play, not a moral correction.
  *   **Your Coworker:** Keeps standing because her actions show she *respects the norm too much.* Her self-punishment proves she takes the rule seriously.

  So, to answer your specific question: **Yes, she technically retains the moral standing to judge her coworkers.** She isn't violating the principle of equality in the way that matters most (exempting herself from the law). She is violating a principle of *proportionality*, but she is doing so at her own expense, not yours.

  ### 4. Why It Still Feels "Off" (The Hidden Trap)
  If she isn't a hypocrite, and she has the standing to criticize, why does it still feel weird to watch? Why does your gut tell you something is wrong, even if it's not hypocrisy?

  There are two other philosophical/psychological concepts at play here:

  **A. Projection and Displacement**
  Even if she isn't a hypocrite, she might be engaging in **moral displacement.** Sometimes, people who are incredibly hard on themselves cannot tolerate their own feelings of shame. By criticizing others for similar mistakes, they externalize that shame.
  *   *Mechanism:* "I feel terrible about my mistake. If I point out your mistake, maybe the focus shifts to the 'rule' being broken rather than my 'badness'."
  *   It's not hypocrisy, but it is using you as an emotional regulation tool. That is unfair, even if it isn't hypocritical.

  **B. The Toxicity of the Standard**
  There is a concept called **Scruples** or **Moral Scrupulosity.** This is when someone holds themselves to an impossible standard.
  The problem is, if she believes *she* deserves hell for a typo, she likely believes the typo is a capital offense. Even if she goes easier on you, she is still enforcing a toxic norm.
  *   *Hypocrite:* Enforces a reasonable norm on you, but breaks it herself. (Unfair)
  *   *Coworker:* Enforces an *unreasonable* norm on you, and an *insane* norm on herself. (Toxic)

  She isn't hypocritical, but she is potentially creating a hostile environment because her baseline for "acceptable behavior" is broken.

  ### 5. Summary: The Asymmetry Explained
  To summarize the "under the hood" mechanics you asked for:

  1.  **Hypocrisy violates Equality:** It says "I am above the law." This destroys the legitimacy of the lawgiver.
  2.  **Your Coworker violates Proportionality:** It says "I am below the law." This preserves the legitimacy of the lawgiver, but indicates a psychological disorder in the judge.

  **The Verdict:**
  Your gut is right. She is not a hypocrite in the moral sense that forfeits her right to speak. A person who holds themselves to a *higher* standard than others does not lose the right to ask others to meet the *basic* standard.

  However, while she has the **right** to criticize, her criticism is likely tainted by her own anxiety. She isn't judging you because you hurt the team; she's judging you because your mistake triggers her own spiral.

  **How to handle it:**
  Since she isn't a hypocrite, you can't call her out on "doing the same thing." Instead, you have to address the **standard.**
  *   *Don't say:* "You did this too!" (She will just agree and spiral harder).
  *   *Do say:* "I hear that you're upset about this error, but we treat this as a fixable issue, not a catastrophe. Let's focus on the fix."

  You are dealing with **perfectionism**, not hypocrisy. It's less malicious, but often harder to work with.
