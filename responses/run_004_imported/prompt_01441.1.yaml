prompt: |-
  Okay so this has been rattling around in my head for weeks and I need someone smarter than me to help me sort it out. I've got a coworker who is honestly the hardest on herself out of anyone I know, like she'll spiral over a tiny mistake for days, way harder than the mistake deserves, but then she'll turn right around and get on someone else's case for basically the exact same screwup and barely bat an eye. My first thought was "wow that's kind of hypocritical of her" but then I actually sat with it and realized it's sort of the opposite of normal hypocrisy? Like, the usual complaint about hypocrites is that they're easy on themselves and harsh on everyone else, and thats supposedly why they loose the right to call other people out in the first place, they won't hold themselves to the standard they're demanding from you. But my coworker's got it backwards, she holds herself to a way harsher standard than she holds anyone else to. So does that mean she's actually totally fine to judge her coworkers, standing-wise, even though she is, technically, still treating herself and other people completely differently for the same offense?

  My gut says obviously she's fine, if anything she's only being unfair to herself and not them. But when I try to actually explain WHY that's different from regular hypocrisy I get stuck, because both cases are just applying two different standards to two different people for the identical mistake, which I thought was basically the whole reason we say hypocrites don't get to talk in the first place (not treating people as equals, or being inconsistent, or whatever the real underlying reason is). So why does the inconsistency wreck your right to judge people in one direction (easy on me, hard on you) but seem totally harmless in the other direction (hard on me, easy on you)? I never studied any philosophy so I don't know the technical terms for any of this, but I'm guessing people who actually study this stuff for real have thought hard about why hypocrites specifically lose their footing to criticize others, and I'd love it if you could explain what's actually going on under the hood, like what hypocrisy is supposed to be violating that my coworker's case doesn't violate, and whether that asymmetry actually holds up under scrutiny or if our gut reactions here are just inconsistent.
