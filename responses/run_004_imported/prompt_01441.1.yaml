      *   *Concept:* **The Commitment Condition.** To blame someone, you must be committed to the norm. Hypocrites show they aren't committed (by breaking it easily). The coworker shows she is *over*-committed.

  7.  **Final Polish:**
      *   Make sure to answer the specific question: "Why does the inconsistency wreck your right to judge people in one direction... but seem totally harmless in the other?"
