      *(Self-Correction)*: I should check if there's a specific term. "Moral Scrupulosity" is psychological. "Supererogatory" is about good deeds. There isn't a perfect single word for "reverse hypocrite," so I will explain the concept without forcing a label.

      *(Refining the "Why")*: The core reason hypocrisy hurts is **Fairness**. "I get a pass, you don't." The coworker is doing "I get a penalty, you get a penalty (but mine is bigger)." That is still unfair, but it doesn't invalidate the rule itself.

