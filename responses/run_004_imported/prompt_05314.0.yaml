answer: |-
  The generator outside hummed with a rhythmic, diesel-powered thrum, vibrating through the floorboards of the tin-roofed station. Inside, the only light came from the laptop screen, casting a blue pallor over Elena's face. Marcus sat opposite her, nursing a mug of instant coffee that had gone cold twenty minutes ago.

  On the screen, frozen in a grainy infrared frame, a Thomson's gazelle was mid-air. All four legs were stiff, back arched, white rump patch blazing like a flare. Ten meters behind it, blurred by motion, was the cheetah.

  "Look at that," Elena said, tapping the screen. "It's not running. It's advertising. It's burning calories it needs to live, risking the seconds it needs to escape. That is the definition of honesty. It's a receipt of vitality."

  Marcus leaned forward, squinting. "It's a receipt, sure. But I still don't buy that the *burning* is the point. You're treating the cost as the message. 'I am so fit I can afford to waste energy.' But the models don't require waste, Elena. They require differential cost."

  "We've been over this, Marcus." Elena rewound the clip. The gazelle landed, stotted again, then bolted. The cheetah broke off the chase. "Zahavi got it right the first time. If the signal isn't a handicap, if it isn't actually reducing the signaler's fitness in a way that a lower-quality individual couldn't match, it collapses. A weak gazelle *could* jump like that once. But to do it repeatedly, in front of a predator? That's an absolute drain. It's the drain that keeps the liars out."

  "But 'absolute drain' is a biological intuition, not a mathematical necessity," Marcus said gently. "Think about a separating equilibrium. All you need is for the marginal cost of stotting to be higher for a weak gazelle than for a strong one. If I'm malnourished, that jump costs me more in terms of predation risk and energy depletion than it costs you. I don't need to be *wasting* energy to be honest. I just need to find the jump too expensive relative to my baseline. The signal works because the cost structure differs, not because the cost is inherently wasteful."

  Elena rubbed her temples. "Then explain the overshoot. Your models—the ones Grafen built, the ones you love—they suggest evolution should drive the cost down to the minimum level required to maintain honesty. Why waste more than you have to? But look at this footage. Look at the baboons barking at leopards. Look at the peacock's train. They don't do the minimum. They overshoot. They tip into performance. If it were just about marginal cost differentials, we should see efficient signals. Instead, we see extravagance. We see animals flirting with death. That suggests the waste *is* the mechanism. The danger is the point."

  Marcus paused. He took a sip of the cold coffee and grimaced. "The overshoot argument is strong. I'll give you that. If the equilibrium is stable at a cost of five units, why do we see animals paying ten? Maybe it's an arms race. Maybe the 'minimum' keeps moving."

  "Or maybe," Elena pressed, "because the only way to be truly trusted is to have skin in the game. If there's no handicap, there's no guarantee."

  "But there *are* guarantees without handicaps," Marcus countered, shifting his weight. "That's where the index argument comes in. Think about vocal formants in red deer. The depth of the roar is physically constrained by the length of the vocal tract. You can't fake a deep roar without a large larynx. You can't have a large larynx without being a large stag. There is no handicap there. There is no 'waste' of energy to produce the sound. It's an index. It's mechanically tied to the attribute. It's automatically honest because physics prevents cheating. If your theory requires absolute cost to ensure honesty, how do you explain the ubiquity of indices? Waste does none of the explanatory work there."

  Elena looked away from the screen, out into the dark where the hyenas were beginning to whoop. "Indices are easy when the trait is static. Size, color, morphology. But behavior? Stotting is dynamic. A small gazelle *can* mechanically jump. It chooses not to, or chooses to stop, because it can't sustain the cost. But fine, let's grant you indices. They exist. But they are the boring cases. The interesting cases are the ones where the animal *could* cheat but doesn't."

  "Is that true, though?" Marcus asked. "Take the peacock. You mentioned the train. Zahavi loved the peacock. He said the tail is a burden, a handicap that proves the male can survive despite it. But what if the tail is just a condition-dependent trait? What if a healthy peacock grows a big tail *easily*, and a sick one struggles to grow it at all? In that case, the tail isn't a handicap in the sense of a deliberate reduction of fitness. It's a badge. The cost isn't in the *carrying* of the tail, necessarily, but in the *production* if you're in poor condition. If a top-tier male grows the tail with minimal physiological stress, where is the handicap? It's just a reflection of his state. Your 'waste' might just be a byproduct of high-quality development."

  Elena turned back to the laptop. She highlighted the cheetah's blurred form. "If the tail is easy for him to grow, then it's not proving he can survive *despite* the tail. It's just proving he's healthy. But then, why is the tail so cumbersome? Why does it impede flight? Why does it catch on brambles? If it were just a badge of health, selection should streamline it. Make it efficient. But it's not efficient. It's absurd."

  "Or," Marcus said, "the cumbersomeness is secondary. The primary driver is the female preference for the trait that indicates health. The drag on flight is a side effect, not the primary guarantor of honesty. The honesty comes from the fact that only healthy birds can allocate the resources to grow it in the first place. That's condition dependence, not necessarily a Zahavian handicap."

  "So you're saying the cost is in the budget, not in the burden?"

  "Exactly. And if that's true for the peacock, why not for the gazelle? Maybe stotting isn't about saying 'I can waste energy.' Maybe it's saying 'I have so much energy surplus that this expenditure doesn't dip into my reserve for escape.' It's not a handicap if I have enough fuel. It's only a handicap for the one who doesn't."

  Elena sighed, leaning back in the creaking chair. "If you remove the handicap, if you remove the idea that the signal must be *detrimental* to be honest, you lose the elegance of the solution. You make honesty too cheap. If a weak gazelle knows that stotting is just a display of surplus, and he knows the cheetah is watching, why doesn't he bluff? He knows if he gets caught, it's over. But if he bluffs, he might survive the chase if the cheetah picks someone else. The only thing stopping him is if the act of stotting *itself* makes him more likely to get caught *now*."

  She pointed at the frozen gazelle. "He is delaying his escape. That is the handicap. He is trading time for information. If your model says he doesn't need to trade time, just energy, then your model doesn't account for the predator's cognition. The cheetah needs to see the risk. The risk has to be real."

  Marcus rubbed his chin. "Okay. The predator's cognition. That's the variable the simple models often leave out. If the predator is assessing the probability of a successful chase, the gazelle needs to signal 'low probability of success.' If I'm a weak gazelle, and I stot, I am indeed increasing my probability of capture significantly more than a strong gazelle would. So the cost *is* differential survival probability."

  "Which brings us back to handicap," Elena said.

  "Not necessarily," Marcus countered, though his voice was less certain now. "It brings us back to differential *marginal* cost. But... I have to concede the overshoot point. The models predict a stable equilibrium at the lowest cost that separates the types. But in the field, we see signal inflation. We see stotting that looks suicidal. If it were just about marginal cost, the strong gazelles should stot just enough to distinguish themselves from the weak ones. They shouldn't stot five times. They shouldn't do it when the cheetah is already in the strike zone. That looks like... waste."

  "It looks like insurance," Elena said. "It looks like making sure the message gets through. But you can't have insurance without paying a premium. That premium is the handicap."

  "And I have to concede the index point," Marcus added, looking at his hands. "I've been arguing that indices prove waste isn't necessary. And logically, they do. But... indices are limited. You can't index 'stamina' or 'alertness' mechanically. You can't have a physical constraint that proves 'I am awake.' For behavioral traits, for dynamic states, you might be right. You might need the cost to be real, not just differential. If the signal is behavioral, maybe it *does* need to be a handicap to be credible. Physics guarantees the roar, but only risk guarantees the leap."

  Elena nodded slowly. "So, perhaps the handicap principle isn't a universal law for all signals. Indices handle the static traits. Physics handles the size. But for the dynamic, the behavioral, the 'I can outmaneuver you' claims... maybe the waste is required. Maybe the strong version holds for behavior, even if it fails for morphology."

  "And maybe," Marcus said, "the 'waste' isn't the goal, but it's the inevitable outcome of an arms race. If I need to distinguish myself from the weak, and the weak keep trying to catch up, I have to push the signal further out on the limb. It looks like waste, but it's actually just the price of maintaining the separation in a noisy environment."

  "So we agree," Elena said, a faint smile touching her lips. "Cost matters. But whether it's 'waste' or 'differential burden' depends on whether the signal is tied to physics or behavior."

  "I can live with that," Marcus said. "Provided you admit that the peacock's tail might be more about developmental budget than survival handicap."

  Elena looked back at the gazelle on the screen, mid-leap, suspended between the ground and the predator. "I'll admit that the tail is complicated. But watch this clip again. Tell me that gazelle isn't burning fuel it needs. Tell me that isn't a risk it doesn't have to take."

  "It is a risk," Marcus said softly. "And it is a cost. I just disagree that the cost *makes* it honest. The cost is just the shadow cast by the honesty."

  "Semantics, Marcus."

  "Mathematics, Elena."

  They sat in silence for a moment, the generator humming, the gazelle frozen in its leap. Neither had converted the other, but the edges of their arguments felt worn down, smoothed by the friction of the night.

  "Run it again," Marcus said. "Let's see if he stots a third time."

  "If he does," Elena said, hitting the spacebar, "that's twenty percent of his escape energy gone. That's a handicap."

  "If he does," Marcus replied, "it means the marginal cost of the third jump was still lower for him than the cost of being chased. That's equilibrium."

  The video played. The gazelle landed, stiff-legged, once more. Then it ran.
