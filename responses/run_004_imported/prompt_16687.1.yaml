answer: |-
  Here is the rigorous case for moral testimony optimism, grounded in epistemic parity and the division of moral labor, while directly engaging the strongest pessimist objections.

  ### The Core Thesis: Epistemic Parity and the Division of Moral Labor

  The fundamental error of moral testimony pessimism is the assumption that the moral domain is epistemically discontinuous with other normative or complex empirical domains. The optimist case rests on **Epistemic Parity**: unless there is a relevant difference between moral propositions and other complex propositions (e.g., in quantum physics, macroeconomics, or medicine) regarding how truth is tracked and transmitted, deference is equally warranted.

  There is no such relevant difference. Moral properties (on a cognitivist view) supervene on natural properties. If I trust your grasp of the natural facts and your reasoning reliability, I have no epistemic grounds to reject your moral conclusion. To claim otherwise requires a "moral exceptionalism" that collapses under scrutiny.

  The strongest argument for optimism is the **Division of Moral Labor**. In almost every other domain, we accept that cognitive specialization is a feature, not a bug, of rationality. We do not demand that every patient understand the biochemistry of antibiotics to be rational in taking them; we demand they identify a reliable doctor. Similarly, in a complex social world, moral expertise exists. Some agents have more time, cognitive bandwidth, emotional stability, or relevant experience to reason through specific moral problems (e.g., effective charity allocation, criminal justice reform, or bioethics).

  If you reject moral deference, you are effectively demanding **Epistemic Sovereignty**: that every moral agent must generate the justification for their moral beliefs *in-house*. This is not only inefficient; it is epistemically irresponsible. If a specialist has processed the relevant data better than you, refusing to update your belief on their say-so is a violation of basic Bayesian updating (the Aumann agreement intuition you noted). It prioritizes the *process* of belief formation over the *accuracy* of the belief, which is an epistemic vice.

  ### Engaging Alison Hills: Knowledge vs. Understanding

  Alison Hills's argument is the most sophisticated pessimist position because it concedes epistemic optimism (you *can* gain knowledge via testimony) but denies normative sufficiency (you lack *moral understanding*, so your action lacks full moral worth).

  Her claim is that to act with moral worth, you must grasp the *reasons why* an action is right, not just *that* it is right. If you refrain from eating meat because a friend told you to, you act rightly, but you are not acting *from* moral understanding.

  **The Optimist Rebuttal:**

  1.  **The "Clueless Do-Gooder" Problem:** Hills's view implies that an agent who independently reasons through a moral problem but gets it wrong (due to bias or lack of information) might have more "moral worth" than an agent who defers to an expert and gets it right. This is counterintuitive. In high-stakes scenarios (e.g., donating a large sum to charity), the moral value of the outcome matters. If deference leads to better alignment with objective moral value than flawed independent reasoning, deference is morally preferable. Insisting on independent understanding when one lacks the capacity for it is a form of moral vanity.
  2.  **Second-Order Understanding:** Hills demands first-order understanding (grasping the substantive moral reasons). However, deference relies on *second-order* understanding: understanding *that the testifier is reliable*. This is a form of understanding. If I understand that you are compassionate, well-informed, and logically consistent, I understand the *grounds* for my belief, even if I don't grasp the first-order moral facts directly. This is no different than trusting a physicist; I understand the *institutional and track-record reasons* for trusting them, even if I don't understand the math. Why is second-order understanding sufficient for rational action in science but insufficient for moral action?
  3.  **Understanding is Gradable and Distributable:** Hills treats understanding as a binary switch you either have or don't. But understanding comes in degrees. Deference can be a scaffold. I might defer on the conclusion ("don't eat meat") while gradually learning the reasons over time. Pessimism treats deference as a permanent state of blindness, whereas optimists view it as a legitimate entry point into moral knowledge, especially for learners (children, novices).

  ### Engaging the Autonomy/Reasons-Responsiveness Argument

  A second major pessimist line (championed by philosophers like Philip Nickel or Robert Hopkins) is that moral deference violates **autonomy**. To be a moral agent is to be responsive to reasons. By deferring, you bypass your own rational faculties and let someone else's will dictate yours. You become a "moral mouthpiece," not an agent.

  **The Optimist Rebuttal:**

  1.  **Autonomy as Truth-Tracking, Not Sovereignty:** This argument relies on a Kantian-romantic view of autonomy as "self-legislation." But a more plausible view of autonomy is **self-governance toward the good**. If my rational faculties are limited, biased, or uninformed, using them to generate moral beliefs ex nihilo is not autonomy; it is recklessness. True autonomy involves recognizing one's own limitations and utilizing available resources (including other agents) to align one's will with the good. Following a moral expert is analogous to a ship captain following a navigator; the captain retains command (the decision to defer), but acknowledges they do not possess all the data.
  2.  **The "Right Reasons" Fallacy:** Pessimists argue you must act *for the right reasons*. But if the "right reason" is "this action minimizes suffering," and I do it because "Expert X says so," am I not still tracking the right reason, albeit indirectly? My reason is "Expert X tracks the minimization of suffering." The chain of justification is longer, but it is not broken. To claim it is broken is to claim that moral reasons are somehow private or non-transmissible, which contradicts the public nature of moral discourse.
  3.  **Moral Testimony as Collaborative Agency:** Deference need not be passive. In many cases, moral deference is part of a collaborative process of moral inquiry. When I ask a friend for advice, I am engaging my agency to seek counsel. The resulting belief is a product of my agency (seeking) and theirs (reasoning). Pessimism artificially isolates the agent, ignoring that moral knowledge is often socially distributed.

  ### The Rationalist/Epistemic Angle

  From a rationalist perspective (à la *Inadequate Equilibria*), the pessimist position looks like a failure to update on evidence. If morality is truth-apt (there are facts about what is good), then moral disagreement is a signal that at least one party is mistaken.

  If you encounter a peer who is honest, calibrated, and has considered the evidence you have, Aumann's Agreement Theorem suggests you should converge. If you refuse to converge on moral claims while accepting convergence on empirical claims, you are positing a magical barrier around moral facts that prevents them from being indicated by the mental states of reliable observers.

  The pessimist often worries about **epistemic defeat**: that the *method* of belief formation (deference) defeats the justification. But this only holds if there is a specific defeater present (e.g., you know the testifier is guessing). Mere deference is not a defeater. If I believe "smoking causes cancer" because the CDC says so, and I cannot prove the epidemiology myself, my belief is justified. If I believe "slavery is unjust" because the consensus of moral history says so, and I cannot derive it from first principles, the epistemic structure is identical. To treat the latter as suspect is to succumb to a "moral sense" intuition that morality must be *felt* or *derived* to be real, which is a metaphysical claim, not an epistemic one.

  ### Concessions: What Survives the Optimist Case?

  To be rigorous, we must acknowledge where the pessimists have a point, even if their strong claim (that knowledge isn't transmitted) fails.

  1.  **Verification Difficulty:** Moral testimony is *harder* to verify than empirical testimony. I can check if a bridge stands; I cannot easily check if a policy is just. This makes the *risk* of bad deference higher in morality. This doesn't make deference impermissible, but it raises the evidential bar for identifying a "moral expert." We should be more cautious about *who* we defer to, not *whether* we defer.
  2.  **Skill Atrophy (Virtue Ethics Concern):** Even if deference transmits knowledge, habitual deference might atrophy one's own moral reasoning muscles. If I always outsource moral judgment, I may lose the capacity to recognize moral salience in novel situations. This is a pragmatic warning about *over-reliance*, not a principled ban on deference.
  3.  **Motivation vs. Knowledge:** Pessimists often conflate epistemology with motivation. Humeans might argue that moral beliefs must be connected to passions to motivate. Testimony might transmit the *belief* without the *concern*. However, this is a problem for moral motivation internalism, not testimonial knowledge. If I believe stealing is wrong via testimony, I know it's wrong. If I don't care, that's a separate failure of character, not a failure of the testimony to transmit knowledge.
  4.  **The "Bullshit" Risk:** In empirical domains, we have feedback loops (the plane crashes or it doesn't). In moral domains, feedback is noisy. This makes the domain more susceptible to "moral grandstanding" or signaling. Deference is epistemically valid, but the *reliability* of testifiers is harder to assess. The optimist must admit that finding a genuine moral testifier is harder than finding a genuine medical testifier.

  ### Conclusion

  The pessimist case collapses because it demands an epistemic sovereignty in ethics that we rightly reject in all other complex domains. Alison Hills is correct that deference might limit *moral understanding* in the sense of first-order reasoning, but she is wrong that this invalidates the knowledge or the moral permissibility of the action. In a world of limited cognitive bandwidth, the division of moral labor is not just acceptable; it is rational.

  To refuse moral deference is to claim that the *process* of your reasoning is more morally significant than the *truth* of your conclusion. The optimist case holds that morality is about getting it right. If testimony gets you there, it is a valid vehicle for moral knowledge. The surviving pessimist concerns are not about the *possibility* of knowledge transfer, but about the *pragmatics* of identifying reliable testifiers and maintaining one's own moral faculties—a caution, not a prohibition.
