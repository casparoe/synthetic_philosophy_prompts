answer: |-
  This is a profound and deeply human dilemma, one that bridges the gap between the empirical rigor of immunology and the nuanced reflection of moral philosophy. It speaks well of you that, after forty years, you are subjecting your own professional habits to ethical scrutiny.

  To answer your central question directly: **No, your past conduct does not disqualify you from raising this issue.** Moral growth is not only possible but expected in a examined life. If reformed past conduct silenced all criticism, ethical progress in any community would be impossible. However, your past *does* impose specific obligations on *how* you approach this conversation if you wish to be effective and ethically consistent.

  Here is a breakdown of the ethical landscape you are navigating, drawing on both scientific norms and moral philosophy.

  ### 1. The Question of Standing (Hypocrisy vs. Growth)
  In moral philosophy, the *tu quoque* (you also) fallacy suggests that pointing out an opponent's hypocrisy does not invalidate their argument. If honorary authorship is ethically problematic because it dilutes credit and misrepresents contribution (a consequentialist view) or violates norms of honesty (a deontological view), it remains problematic regardless of who points it out.

  However, while your *argument* remains valid, your *persuasive power* relies on credibility. If you approach your colleague as a judge from a high moral ground, you invite a rebuttal regarding your own history. If you approach him as a peer who has undergone a similar ethical evolution, you invite collaboration.

  **Recommendation:** Do not hide your past. Acknowledge it. Framing the conversation as, *"I used to do this, and I realized I was wrong,"* is far more powerful than *"You are doing this, and it is wrong."* It transforms the interaction from an accusation into a shared reflection on professional standards.

  ### 2. The Unfinished Business (Restorative Justice)
  Before you speak to your colleague, there is a prior ethical obligation you must address. You mentioned two students to whom you appended your name early in your career, whom you never apologized to, and whose records you never corrected.

  From the perspective of restorative justice, the harm done to those students remains unaddressed. While you cannot change the past, you can acknowledge the imbalance.
  *   **The Risk:** Contacting them after decades might reopen old wounds or confuse them.
  *   **The Benefit:** It clears your own conscience and restores your moral standing to speak on the issue. It acknowledges their labor.

  **Recommendation:** Consider reaching out to these two former students. You need not make a grand public confession, but a private note acknowledging that norms have changed, that you reflect differently on authorship now, and that you appreciate their work would be a significant act of moral repair. If correcting the record is legally or administratively impossible now, an apology for the *practice* is still valuable. Until you do this, your critique of your colleague rests on an unresolved foundation.

  ### 3. The Context: Scientific Norms Have Shifted
  It is important to contextualize the behavior. Thirty or forty years ago, "gift authorship" for lab heads was regrettably common, often viewed as a necessary currency for grant funding or lab prestige. Today, guidelines (such as those from the ICMJE) are much stricter, emphasizing that authorship requires substantial contribution to conception, design, execution, or interpretation.

  Your colleague may be operating on outdated norms. He may genuinely believe he is mentoring by ensuring the paper gets published under his "brand."

  **Recommendation:** Frame the issue around the *current* career interests of the students, not just abstract ethics.
  *   **Argument:** "I've been reading up on the new authorship guidelines, and I worry that by adding our names, we might actually be diluting the students' ownership of their work. In the current job market, they need to show they can carry a project without us."
  *   **Goal:** Shift the focus from *his misconduct* to *the students' welfare*.

  ### 4. The Setting: The Reunion
  A group reunion is a social setting. A direct ethical confrontation in front of peers could cause your colleague to become defensive, entrenching his position to save face.

  **Recommendation:** If you raise this, do it privately. A side conversation over coffee, framed as a personal reflection rather than a public call-out, is more likely to be heard.
  *   *Script Idea:* "I've been doing some reading on ethics since retiring, and it's made me look back at my own career. I realized I was wrong to put my name on my students' papers early on, and I stopped twenty years ago. I know the culture has changed, and I worry our current students might be better served if we stepped back from co-authorship unless we've done the bench work. I'd love to hear your thoughts on how you handle that now."

  ### 5. A Philosophical Perspective
  You mentioned your new interest in moral philosophy. You might view this through the lens of **Virtue Ethics**. The question is not just "Is this action right?" but "What kind of scientist do I want to be?" and "What kind of community are we fostering?"

  By speaking up, you are modeling the virtue of integrity. By acknowledging your own past failings, you model the virtue of humility. By prioritizing the students' credit, you model the virtue of justice.

  ### Summary of Advice
  1.  **You are not disqualified.** Moral growth grants you the standing to speak, provided you speak with humility.
  2.  **Address your past first.** If possible, contact your two former students. Acknowledge the outdated practice and apologize for the lack of credit. This clears your conscience and fortifies your integrity.
  3.  **Approach the colleague privately.** Avoid a public confrontation at the reunion.
  4.  **Frame it as evolution, not accusation.** Use your own change of heart as the entry point. Focus on how modern authorship norms benefit the *students*, not how the colleague is violating rules.
  5.  **Accept limitations.** He may not change. If he reacts poorly, you have still fulfilled your duty by raising the point gently. You cannot control his virtue, only your own.

  It is rare for a scientist to retire and then rigorously audit their ethical history. That you are willing to do so suggests that while you have left the bench, your commitment to truth remains intact. Proceed with kindness—to your colleague, to your former students, and to yourself.
