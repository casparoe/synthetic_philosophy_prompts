answer: |-
  This is a classic conflict between **intent** (what she meant to do) and **impact** (what actually happened). Both sides of your friend group are highlighting a different part of the equation, but when high stakes like grades are involved, the "impact" side usually carries more weight.

  Here is a breakdown of who is right, why it matters, and how to look at the situation fairly.

  ### 1. The Argument for Your Friend (Intent)
  The friends defending her are focusing on **character**.
  *   **No Malice:** She didn't lie on purpose to sabotage anyone. She thought she was doing a favor by sharing "insider info."
  *   **Honest Mistake:** In a social setting, we share hearsay all the time. If she genuinely thought the source was legit, she wasn't being negligent in her own mind.
  *   **Agency:** Ultimately, every student is responsible for their own study habits. Relying 100% on a friend's rumor without checking the syllabus or asking the professor is a risk the other students took, too.

  **Verdict on this side:** She is not a "bad person," and she shouldn't be villainized for a mistake.

  ### 2. The Argument for the Angry Friends (Impact & Responsibility)
  The friends who are mad are focusing on **accountability**.
  *   **The Confidence Factor:** This is the most critical part. If she had said, *"Hey, I heard a rumor the test is moved, but you should probably verify that before you stop studying,"* the outcome would likely be different. By stating it **confidently**, she removed the need for others to verify. She became the source of truth.
  *   **High Stakes:** Sharing rumors about a movie time is low stakes. Sharing rumors about an academic deadline is high stakes. When the consequence of being wrong is a failing grade, the standard for verifying information should be higher.
  *   **Negligence:** "I believed it" explains *why* she said it, but it doesn't absolve her of the carelessness of spreading unverified info with certainty.

  **Verdict on this side:** They are right to be upset about the consequence. Her delivery contributed directly to their failure.

  ### 3. So, Who Is Actually Right?
  **The angry friends have the stronger argument regarding accountability, but the defenders have the stronger argument regarding forgiveness.**

  Here is the distinction:
  *   **Is it her fault the test wasn't moved?** No.
  *   **Is it her fault people believed her?** Yes, because she spoke with confidence.
  *   **Is it her fault people didn't study?** Partially. She created a false sense of security.

  **To answer your specific question:**
  It **does matter** that what she said was false. Believing something for a "good reason" protects her from being called a liar, but it does not protect her from being called **irresponsible.**

  In ethics, there is a concept called **Epistemic Responsibility**. This means we have a duty to be careful about what we claim to know, especially when other people are relying on that knowledge to make decisions. She failed that duty. She treated a rumor as a fact.

  ### 4. How to Resolve This
  If this stays unresolved, it could create a rift in the group. Here is the healthy way to look at it:

  **For the Friend who shared the info:**
  She needs to move past "It's not my fault because I believed it." A mature apology looks like this:
  > *"I know I didn't mean to hurt anyone, but I realize now that I spoke too confidently about something I didn't verify. I take responsibility for causing that panic and I'm sorry I led you guys astray."*
  This validates the impact without admitting to malicious intent.

  **For the Friends who bombed the test:**
  They are allowed to be mad about the grade, but they should also recognize that **academic responsibility ultimately lies with them.** In the future, the rule should be: *Never stop studying based on a rumor unless it comes from the professor.*

  ### The Bottom Line
  Your friend isn't a villain, but she was **negligent.**
  *   **Intent** determines if she's a good friend (she is).
  *   **Impact** determines if she owes an apology (she does).

  She shouldn't be ostracized, but she shouldn't be let off the hook without acknowledging that her confidence was misplaced and caused real harm. The group should use this as a lesson: **Verify high-stakes info at the source, no matter how confident the messenger sounds.**
