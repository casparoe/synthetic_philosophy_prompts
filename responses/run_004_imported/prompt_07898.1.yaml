prompt: |-
  Ok so this happened in my friend group: one of my friends confidently told everyone our chem test got pushed back a week bc she 'heard it from someone in the other class,' so half of us didnt study and bombed it. Turns out it was completely fake, and when people got mad she said its not her fault since she genuinely believed it and the source seemed legit at the time. Some of my friends think thats a fair excuse, but others think she shouldn't have said it so confidently without actually being sure. So who's actually right, does it matter that what she said turned out to be false, or is it enough that she believed it for a good reason?
