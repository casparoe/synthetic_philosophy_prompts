prompt: |-
  Random tangent, but I just got back from a trip to Berlin and did the Wall tour, and the guide spent ages on how after reunification they actually put former border guards on trial for shooting people who tried to escape -- even though the guards were just following East German law and orders at the time. Turns out my great-uncle was one of the low-level guys who got investigated back then (nothing came of it, but still kinda rattled me). Anyway it's sent me back to the Hart-Fuller debate from my one jurisprudence class in undergrad, which I clearly didnt absorb as well as I thought. Could you write me a dialogue between Hart and Fuller arguing over the grudge informer case -- the actual one they fought about -- where Fuller leans on his inner-morality-of-law stuff (I only remember 'no retroactivity' and 'generality' off the top of my head, there were like eight of them total) to argue the Nazi statute barely counts as law at all, and Hart pushes back with his 'fine, it's wicked, but it's still law, so just pass a retroactive statute if you want to punish her' move. I want them actually responding to each other's strongest points instead of restating their opening positions, and I want it to end with the two of them being forced to say what their own logic implies about the border guards.
