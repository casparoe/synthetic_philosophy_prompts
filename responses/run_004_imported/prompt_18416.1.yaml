      *   **Fuller (Natural Law/Procedural):** Law has an "inner morality." If a system fails these procedural morals, it's not just bad law, it's *not law*. The 8 principles (Desiderata): 1. Generality, 2. Promulgation, 3. Non-retroactivity, 4. Clarity, 5. Non-contradiction, 6. Possibility of compliance, 7. Constancy, 8. Congruence between official action and declared rule. The Nazi regime failed these, so their "laws" were void.

