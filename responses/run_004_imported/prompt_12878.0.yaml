      *   *Test 2: Universal Instrument (Reason).* Machines are good at specific tasks (better than humans sometimes), but they fail at others. Reason is a "universal instrument" available for all contingencies. Organs need specific dispositions for specific actions.

  3.  **Evaluate the LLM against Test 1 (Language):**
