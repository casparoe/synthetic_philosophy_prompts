answer: |-
  You have identified the exact pivot point where the metaphor broke down and required formalization. The confusion you encountered is not a misunderstanding on your part; it is the precise reason Gould and Elisabeth Vrba published *"Exaptation – a missing term in the science of form"* in 1982, just three years after the famous *"Spandrels"* paper.

  The blurring you sensed was between **etiology (historical origin)** and **current utility (present effect)**.

  Here is the precise reconstruction of that distinction, why "spandrel" failed to hold it apart, why "exaptation" was required to fix it, and how the San Marco example collapses under this specific scrutiny.

  ### 1. The Two Dimensions Being Blurred

  In the 1979 paper, Gould and Lewontin used "spandrel" to do two jobs simultaneously, which created a category error. They used it to describe:
  1.  **How the trait arose:** As a necessary structural byproduct of something else (non-adaptive origin).
  2.  **What the trait is now:** A feature that is currently being used, but wasn't "designed" for that use.

  The problem is that these are independent variables. A trait's history does not dictate its current use, and its current use does not reveal its history. By using one word ("spandrel") to cover the *origin* (byproduct) and imply the *status* (currently useful but incidental), they made it difficult to classify traits that shifted function.

  Gould and Vrba (1982) separated these into two distinct questions:
  *   **Question A (Origin):** Did this trait arise by natural selection for its current role?
  *   **Question B (Utility):** Is this trait currently useful for that role?

  ### 2. The Taxonomy: Adaptation vs. Exaptation

  To solve the blur, Gould and Vrba proposed that **Adaptation** should refer strictly to the *process of origin*, not the state of being useful.

  *   **Adaptation:** A trait that arose **by** natural selection **for** its current function.
      *   *Origin:* Selection.
      *   *Current Utility:* Yes (for the original purpose).
  *   **Exaptation:** A trait that is currently useful for a function, but **did not arise** by selection for that function.
      *   *Origin:* Not selection for current function (could be selection for *other* function, or non-adaptive byproduct).
      *   *Current Utility:* Yes.

  This creates a crucial logical wedge. Under this schema, a "spandrel" is strictly an architectural term describing a **non-adaptive origin** (a structural necessity). If that spandrel is later painted with a mosaic, it becomes an **exaptation**.

  **The Blur in 1979:** Gould and Lewontin often spoke as if "spandrel" meant "currently useful trait that wasn't selected for." But this conflates the *byproduct status* with the *co-option status*.
  **The Fix in 1982:** "Spandrel" describes the *origin* (structural constraint). "Exaptation" describes the *relationship* between that origin and current utility.

  ### 3. Why Present Fittingness Cannot Prove Selection

  You asked for a precise account of why "present fittingness for a purpose can never, by itself, show that a trait was built by selection for that purpose."

  This is the problem of **equifinality** in evolutionary history. Multiple historical pathways can lead to the same current state of utility.

  Imagine you see a biological trait $T$ that performs function $F$ very well.
  *   **Hypothesis 1 (Adaptation):** $T$ emerged because mutations favoring $F$ were selected.
  *   **Hypothesis 2 (Exaptation of Byproduct):** $T$ emerged as a structural side-effect of Trait $X$ (selected for $X$). Later, organisms found $T$ could do $F$. Selection then refined $T$ to do $F$ better.
  *   **Hypothesis 3 (Exaptation of Shifted Function):** $T$ emerged via selection for function $G$. Later, the environment changed, or the organism's behavior changed, and $T$ was co-opted for $F$.

  **The Logical Gap:**
  Observing that $T$ fits $F$ perfectly today tells you nothing about which of the three histories occurred.
  *   If you assume fittingness implies adaptive origin, you commit the **Panglossian fallacy** (assuming everything is optimized by selection).
  *   To prove Adaptation, you need evidence of the *history* (fossil record, phylogenetic comparison showing the trait emerged concurrently with the selective pressure), not just evidence of the *current engineering*.

  This is why "spandrel" was insufficient as a rebuttal in evopsych debates. Calling a trait a "spandrel" implies it is useless or incidental. But many traits cited as spandrels (e.g., human language capacity, religious instinct) are highly functional. The critics needed a term that allowed for **high current utility** without conceding **adaptive origin**. That term is **exaptation**.

  ### 4. Why San Marco Remained Contestable

  This brings us to the architectural example. You noted that historians argued the pendentives might have been chosen *for* the decorative surfaces. This critique is devastating to the metaphor because it attacks the **Origin** axis of the distinction.

  For the San Marco example to work as a "spandrel" (in the 1979 sense), the following must be true:
  1.  **Structural Necessity:** The arches and dome *required* the triangular gaps to exist. (The builders had no choice).
  2.  **Incidental Utility:** The builders did *not* create the gaps to hold mosaics; they filled the gaps with mosaics because the gaps were already there.

  **The Historians' Counter-Argument:**
  If the architects chose the pendentive design *partly because* it offered a large, visible surface for theological propaganda (mosaics), then the "spandrel" is actually an **Adaptation** (in the architectural sense).
  *   **Origin:** Selected/Designed for the purpose of holding art.
  *   **Utility:** Holds art.

  If the historians are right, the space is not a byproduct; it is a design feature.

  **Why this mirrors the Biological Problem:**
  This ambiguity is exactly why the term "spandrel" is dangerous in biology.
  *   In biology, we rarely have the "architect's notes" (the fossil record is incomplete; we cannot interview natural selection).
  *   When an evopsychologist says "Religion is an adaptation for group cohesion," they are claiming the "architect" (selection) built the brain module *for* that purpose.
  *   When a critic says "Religion is a spandrel," they claim it is a byproduct of, say, agency detection or pattern recognition, later co-opted for cohesion.

  **The San Marco Failure:**
  Because we cannot definitively prove the Venetian builders' *intentions* regarding the pendentives, the example remains contestable on the exact point that matters most: **Was the utility the cause of the structure, or the consequence of it?**

  Gould acknowledged this. If the utility (mosaics) influenced the design choice (pendentives), it is not a spandrel; it is an adaptation. Since architectural historians suggested the utility *did* influence the design, the flagship example of a "non-adaptive byproduct" might actually be an "adaptive design."

  ### 5. Summary: The Precise Distinction

  To answer your request for a precise reconstruction:

  1.  **The Blur:** The 1979 paper used "spandrel" to conflate **Non-Adaptive Origin** with **Current Utility**. It implied that if something wasn't selected for, it must be functionally secondary or incidental.
  2.  **The Distinction (Gould & Vrba 1982):**
      *   **Adaptation:** A historical claim. The trait exists *because* it was selected for its current function.
      *   **Exaptation:** A historical claim. The trait exists for a different reason (or no reason), but is *now* useful for the current function.
      *   **Spandrel:** A specific subset of Exaptation origins. A trait that arose purely as a structural/constraint byproduct (no selection for the trait itself), which was later co-opted.
  3.  **The Logical Limit:** You cannot infer **Adaptation** from **Utility**. Utility is compatible with Adaptation, Exaptation, and Spandrel-co-option. Therefore, observing utility is never sufficient proof of adaptive origin.
  4.  **The San Marco Contingency:** The example fails if the "utility" (mosaic space) was part of the "selection criteria" (architectural design). Since historians argue the builders may have valued the mosaic space *during* the design phase, the "spandrel" was actually "selected for" (designed for). This mirrors the biological difficulty: if a trait provides a fitness benefit immediately upon arising, it is hard to distinguish whether it arose *for* that benefit or was co-opted *into* that benefit instantly.

  In rationalist and evopsych debates, when someone invokes "spandrel" correctly, they are making a claim about **history**, not **function**. They are asserting: *"This trait is useful, but the causal history of its emergence is not selection-for-this-usefulness."* If they imply the trait is therefore "useless" or "noise," they are reverting to the 1979 blur that Gould himself corrected in 1982.
