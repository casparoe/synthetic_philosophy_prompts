answer: |-
  This is an exceptionally sharp question. You have put your finger on the exact tension that keeps philosophers of science up at night. Your intuition is correct: if the Pessimistic Meta-Induction (PMI) is a cannonball, Structural Realism (SR) often looks like a shield made of paper that the realist has simply painted to look like steel. If history shows that *everything* gets thrown out eventually, why should we bet that the mathematical relations are the exception?

  To give you the texture you need for a longform piece, we need to move past the slogan ("save the structure, dump the ontology") and look at the *mechanism* of theory change that Structural Realists like John Worrall are actually pointing to. The defense isn't that structure is magic; it's that structure plays a different functional role in science than ontology does.

  Here is a breakdown of how a sophisticated Structural Realist answers the "meta-level" PMI, why they claim structure is more robust, and where the cracks in that armor actually are.

  ### 1. The Mechanism of Preservation: "Limiting Cases" vs. "Storytelling"

  The first thing to clarify is that Worrall's Structural Realism is not a claim that *all* mathematics survives. It is a claim about **correspondence relations** between successive theories.

  When a new theory supersedes an old one (e.g., Special Relativity superseding Newtonian Mechanics), it cannot simply declare the old theory "false" in a vacuum. If the old theory was empirically successful (predicting eclipses, building bridges), the new theory must explain *why* the old theory worked. It does this by mathematically demonstrating that the old theory is a **limiting case** of the new one.

  *   **Newton to Einstein:** As velocity ($v$) approaches zero relative to the speed of light ($c$), the equations of General Relativity converge with Newton's laws.
  *   **Fresnel to Maxwell:** The wave equations describing light propagation in an elastic solid (Fresnel) are mathematically retained in Maxwell's electromagnetic field theory, even though the "elastic solid" (the ether) is discarded.

  **The Structuralist Argument:** The *ontology* (what the stuff *is*) is the part of the theory that gets negated. The *structure* (the relations that allow the limiting case derivation) is the part that gets subsumed.

  To answer your "meta-PMI" worry: The Structural Realist argues that ontology is often **explanatory storytelling** layered on top of the math to make it intelligible to human intuition. We imagined light as a wave in a jelly-like ether because we couldn't conceive of a wave without a medium. That was a conceptual crutch. The equations, however, were constrained by **measurement**.

  The claim is not that "math is truer than stuff." The claim is that **mathematical structure is more tightly coupled to empirical success than ontological interpretation is.** When a theory predicts a number correctly, the structural relations generating that number have "latched onto" something real about the world's behavior, even if our story about *what* is behaving is wrong.

  ### 2. Why Structure Has a Better Track Record (The "Invariant" Argument)

  You asked: *Presumably historians can dig up cases where the structure itself failed to carry over.*

  They can, and they do. But the Structural Realist responds by distinguishing between **formalism** and **interpretation**, and by acknowledging that preservation is a matter of degree, not binary survival.

  Consider the transition from Bohr's atomic model to Quantum Mechanics.
  *   **Ontology:** Electrons as little planets orbiting a nucleus (Bohr) $\rightarrow$ Electron probability clouds/wave functions (QM). **Total discontinuity.**
  *   **Structure:** The Bohr quantization conditions ($\oint p dq = nh$) look very different from the Schrödinger equation. **Apparent discontinuity.**

  However, a Structural Realist would point out that the *spectral lines* predicted by Bohr were not discarded; they were derived more fundamentally in QM. The structural relation between energy levels and frequency ($E = h\nu$) remained invariant.

  **The Grounding of the Claim:**
  The reason structure is claimed to be more robust is that it is the **invariant across the transformation**. Think of it like changing coordinate systems. If I describe a circle using Cartesian coordinates ($x^2 + y^2 = r^2$) and you describe it using Polar coordinates ($r = \text{constant}$), the symbols look completely different. The "ontology" of the description has changed. But the structural property (constant distance from a center) remains invariant.

  Structural Realists argue that theory change is often like a coordinate transformation. We are finding better ways to map the same structural terrain. The PMI relies on the idea that theory change is like burning down a house and building a new one on a different plot of land. The Structural Realist argues theory change is more like renovating the house: you might rip out the walls (ontology) and change the plumbing (mechanisms), but the foundation and the load-bearing beams (the structural relations that match observation) usually stay, or are reinforced.

  ### 3. The "Meta-Level" Objection: When Structure *Does* Break

  This is the most critical part for your article. A honest Structural Realist must admit: **Sometimes the structure breaks.**

  There are historical cases where even the equations didn't carry over cleanly. For example, the transition from Classical Mechanics to Quantum Mechanics involved a shift from deterministic, continuous trajectories to probabilistic, discrete operators. The mathematical *framework* changed radically (from differential equations of motion to linear algebra in Hilbert space).

  **How Worrall & Co. Answer This:**
  They argue that even in radical shifts, there is a **structural correspondence** regarding the *empirical domain*.
  1.  **Domain Specificity:** Structural continuity is not guaranteed *everywhere*, only in the domain where the predecessor theory was empirically successful. Newtonian structure breaks down at high speeds, but it is preserved in the low-speed limit. The PMI fails because it treats theories as globally true or false, whereas Structural Realism treats them as locally structurally accurate.
  2.  **The "No Miracles" Constraint:** If the structure *didn't* carry over at all, the success of the old theory would be a miracle. If Maxwell had derived completely different equations for light propagation than Fresnel, he couldn't have explained why Fresnel's predictions were so accurate. The fact that he *could* reuse Fresnel's math is evidence that the math was tracking reality, even if the ether wasn't.

  So, the answer to your "meta-induction" is: **Yes, structure changes. But it changes less radically than ontology, and it changes in a constrained way that preserves past successes.** The induction is defused because the premise "past theories were wholly false" is replaced with "past theories were structurally approximately true in their domain of application."

  ### 4. The "Retreat" Charge: Is it Just Moving the Goalposts?

  You noted that this feels like a retreat. Many philosophers (like Bas van Fraassen or Larry Laudan) agree with you. They argue that if you strip away the entities and mechanisms, you aren't a "Realist" anymore; you're just an Empiricist with a thesaurus.

  **The Structural Realist's Counter:**
  Worrall would argue this isn't a retreat; it's a **reconnaissance**.
  *   **Traditional Realism** claims we know the *nature* of the unobservable world (e.g., "Electrons are little charged spheres"). History proves this hubristic.
  *   **Constructive Empiricism** claims we should believe *nothing* about the unobservable world, only that theories are "empirically adequate." History proves this too skeptical; science clearly discovers *something* about the deep structure of reality, not just surface appearances.
  *   **Structural Realism** claims we know the *relations* of the unobservable world.

  The "grounding" for this isn't just hope; it's the **history of mathematical physics**. In the development of General Relativity, the physical interpretation of the metric tensor shifted wildly (Is it a field? Is it geometry? Is it a potential?). But the tensor calculus itself remained the engine of prediction. The Structural Realist argues that the *mathematical structure* is the only part of the theory that is robust enough to survive the revolution. To demand more (ontology) is to demand what history shows we cannot have. To demand less (empiricism) is to ignore that the math is telling us something about the world, not just organizing our observations.

  ### 5. The Weak Point: "Structure of What?"

  For your piece, the most compelling tension lies in the **"Structure of What?"** objection (often raised by realists like Stathis Psillos).

  If you say "There are relations, but no relata," you run into a metaphysical puzzle. Relations usually require *things* to relate. If there is no ether, what is waving in the Maxwell equations? If there are no electrons, what is holding the charge?

  *   **Epistemic Structural Realism (Worrall):** We can't *know* the nature of the relata, but they must exist. (This risks being agnostic).
  *   **Ontic Structural Realism (Ladyman & Ross):** There *are* no relata. Reality is just pure structure. (This is a radical metaphysical claim that sounds like science fiction).

  This is where the "meta-PMI" bites hardest. If future physics discards the current mathematical framework (e.g., if Quantum Field Theory is replaced by something non-geometric or non-algebraic), then Structural Realism collapses just like Entity Realism did.

  **The Journalistic Angle:**
  The Structural Realist's best defense here is **fallibilism**. They admit they could be wrong. But they argue their position is the *most* fallibilism-compatible form of realism.
  *   Entity Realism says: "Electrons exist." (High risk of being proven wrong).
  *   Empiricism says: "Theories save the phenomena." (Low risk, but explains little).
  *   Structural Realism says: "Whatever the world is, it behaves *as if* it has this structure."

  ### Summary for your Piece

  To capture the texture you're looking for, you might frame it this way:

  The Pessimistic Meta-Induction treats scientific history as a graveyard of dead truths. Structural Realism looks at that same graveyard and sees a construction site. It acknowledges that the scaffolding (ontology) is constantly torn down, but argues that the load-bearing walls (mathematical structure) are being kept and incorporated into the new building.

  The Structural Realist answers your "meta-induction" by conceding that structure isn't immortal, but arguing it is **evolutionarily selected**. The math that survives isn't the math we liked; it's the math that *worked* so well it forced the new theory to absorb it. The grounding isn't a guarantee of truth, but a bet on continuity: it is easier for nature to keep the same rules and change our description of the players, than to change the rules entirely and let us keep scoring goals.

  However, the vulnerability remains: if a future theory arises that cannot mathematically encompass our current equations (a true "paradigm shift" in Kuhn's radical sense), Structural Realism loses its shield. But until then, it remains the most durable position for a scientist who wants to believe they are discovering reality, not just inventing useful fictions.
