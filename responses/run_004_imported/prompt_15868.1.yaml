answer: |-
  Two Bayesians walk into a bar.

  The first one says, "I'll bet you $100 the next coin flip is heads."
  The second one says, "You're on."

  They both freeze, hands hovering over their wallets.

  "Wait," says the first. "We share a common prior on coin fairness."
  "True," says the second. "So if you're offering this bet, you must have private information."
  "And if you're accepting it, you must have *better* private information."
  "Exactly. So your willingness to bet is evidence I should update my posterior."
  "And your offer is evidence I should update mine."
  "So we iterate until our probabilities converge."
  "Right. Now we agree on the outcome."
  "So the bet is void."
  "Correct. The market for this wager has become efficient."

  They put their wallets away and sit in silence.

  The bartender walks over. "So... are you guys flipping the coin or not?"

  "We can't," they say in unison. "Our willingness to bet already told us the result, so the uncertainty required to place the wager has been arbitraged away."

  "Well," says the bartender, flipping a coin onto the table, "heads I serve you, tails I don't."

  They both look at the spinning metal, terrified.
  "Don't look!" screams the first. "If we both see the outcome, we'll share a posterior, and then we'll never be able to disagree on the tip!"
