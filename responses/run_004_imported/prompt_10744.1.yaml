answer: |-
  Your friend wins this round. Not only is she right, but she has stumbled onto a famous result in the history of economics known as **Menger's Paradox** (or the Super St. Petersburg Paradox).

  Karl Menger (son of the founder of the Austrian School of Economics) demolished the "diminishing marginal utility" solution in 1934. He proved exactly what your friend claimed: **If your utility function is unbounded, there is always a St. Petersburg-style game that yields infinite expected utility.**

  Here is the construction you two were looking for, followed by the straight talk on whether the fix is dead.

  ### The Construction: Beating Any Unbounded Utility Function

  Let's say you propose a utility function $U(x)$ to solve the paradox. For the solution to work, $U(x)$ must be increasing (more money is better) and concave (diminishing returns), like $\log(x)$ or $\sqrt{x}$.

  The standard St. Petersburg game pays $2^n$ dollars if the first tails appears on the $n$-th flip. The probability of this is $1/2^n$.
  With $U(x) = \log(x)$, the expected utility is:
  $$ \sum_{n=1}^{\infty} \frac{1}{2^n} \log(2^n) = \sum_{n=1}^{\infty} \frac{n \log(2)}{2^n} $$
  This sum converges (it's finite). So, for the *standard* game, you are right.

  **But here is how your friend breaks it:**

  We construct a "Super St. Petersburg" game. We keep the probabilities the same ($1/2^n$), but we change the payoffs. Instead of paying $2^n$, we define the payoff $x_n$ specifically to defeat your utility function.

  Since you claim $U(x)$ is **unbounded**, that means for any number $K$, there exists some amount of money $x$ such that $U(x) > K$.

  We set the payoff for the $n$-th round, $x_n$, to be the amount of money required to make the utility equal to $2^n$.
  $$ \text{Choose } x_n \text{ such that } U(x_n) = 2^n $$
  (Because $U$ is unbounded, such an $x_n$ always exists, even if it has to be astronomically large.)

  Now, calculate the Expected Utility of this new game:
  $$ E[U] = \sum_{n=1}^{\infty} \text{Probability}_n \times \text{Utility}(\text{Payoff}_n) $$
  $$ E[U] = \sum_{n=1}^{\infty} \frac{1}{2^n} \times U(x_n) $$
  $$ E[U] = \sum_{n=1}^{\infty} \frac{1}{2^n} \times 2^n $$
  $$ E[U] = \sum_{n=1}^{\infty} 1 = \infty $$

  **The Result:** No matter how fast your marginal utility diminishes (log, square root, etc.), I can always make the payoff grow *faster* to compensate. If you use $\log(x)$, I make the payoff $2^{2^n}$. If you use $\sqrt{x}$, I make the payoff $4^n$. As long as utility can go to infinity, I can construct a game where the expected utility is infinite.

  ### So, Is the Fix Dead?

  Here is the straight talk: **The diminishing marginal utility fix is dead as a *universal* solution, but it is not dead as a *practical* one.**

  Menger's critique forces a hard dichotomy on Expected Utility Theory (EUT):

  1.  **Accept Bounded Utility:** To mathematically guarantee that *no* gamble ever has infinite expected utility, you must assume utility is bounded. There must be a maximum possible happiness level $U_{max}$ that money can buy. Once you hit that, more money adds zero utility.
      *   *The Cost:* This is philosophically unpalatable to many economists. It implies that at some point, you would be indifferent between gaining a million dollars and gaining nothing. It violates the "more is better" axiom.
  2.  **Accept Vulnerability:** If you insist utility is unbounded (more money is *always* at least a tiny bit better), you must admit that there exist theoretical gambles you should be willing to pay your entire life savings to play, even though you intuitively wouldn't.

  ### How to Rescue the Theory (Without Bounded Utility)

  If you don't want to accept bounded utility, you have to look outside of standard Expected Utility Theory. Here are the three main ways economists and physicists rescue the situation today:

  **1. The "Finite Bankroll" Reality Check**
  The original paradox assumes the casino has infinite money. In the real world, no casino has infinite capital. If the casino's maximum payout is capped at $W$ (say, 1 trillion dollars), the game must end after $L$ flips where $2^L \approx W$.
  *   **Result:** The expected value becomes finite (roughly $\log_2(W)$). For any realistic bankroll, the fair price to play is indeed around $20–$50.
  *   **Verdict:** This solves the practical problem but ignores the theoretical mathematical puzzle.

  **2. Ergodicity Economics (The Modern Favorite)**
  This is the most compelling modern resolution, championed by physicist Ole Peters. Standard EUT calculates an **ensemble average** (what happens if a million people play once). But an individual plays a **time average** (one person playing many times).
  *   In the St. Petersburg game, the ensemble average is infinite, but the time-average growth rate of your wealth is negative if you pay too much to enter.
  *   **Verdict:** This suggests the problem isn't your utility function, but that we are using the wrong kind of average. You shouldn't maximize expected value; you should maximize the geometric growth rate of your wealth. This naturally leads to logarithmic behavior without needing to postulate a psychological "utility" function.

  **3. Probability Weighting (Prospect Theory)**
  Behavioral economics suggests humans don't perceive probabilities linearly. We tend to ignore very low probability events entirely.
  *   If you psychologically treat a $1/2^{100}$ chance as effectively zero, the sum truncates naturally.
  *   **Verdict:** This explains why *humans* don't pay much, but it doesn't solve the normative question of what a *rational agent* should do.

  ### The Bottom Line

  Tell your friend she can buy the next round of drinks. Her intuition was mathematically sound: **Diminishing marginal utility cannot protect you from infinite expectation if utility is unbounded.**

  However, you don't have to throw the baby out with the bathwater.
  *   If you care about **mathematical consistency**, you have to accept **bounded utility**.
  *   If you care about **real-world application**, the **finite bankroll** or **ergodicity** arguments make the paradox disappear without needing to cap human happiness.

  The St. Petersburg Paradox isn't really about coins; it's a proof that Expected Utility Theory breaks down when dealing with fat-tailed distributions and infinite horizons. Your friend found the crack in the foundation; you just have to decide whether to patch it with bounded utility or build a new house (ergodicity).
