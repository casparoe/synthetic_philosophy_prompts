      *   *The Problem:* The "Constant Problem." $K_U(x)$ depends on the Universal Turing Machine (UTM) $U$. $|K_{U1}(x) - K_{U2}(x)| < c$. $c$ depends on $U1, U2$ but *not* $x$. If $c$ is huge, it dominates any practical comparison of specific hypotheses. Also, uncomputability means we can't actually calculate it.
