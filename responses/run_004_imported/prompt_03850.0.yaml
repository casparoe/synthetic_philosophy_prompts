      *   *Priya Objection 1 (Anthropic):* Weak Anthropic Principle (WAP). "We couldn't see it otherwise." *Counter:* This confuses observation selection effects with probability of the event. Just because I *see* a winning ticket doesn't mean the lottery wasn't rigged or unlikely. *Verdict:* Priya is on shaky ground here; Marcus's Firing Squad is the standard rebuttal for a reason.
