  **Justifications:**

  1.  **Correct:** The St. Petersburg paradox was specifically designed to demonstrate that maximizing expected monetary value leads to counterintuitive prescriptions (betting life savings on a game with negligible practical value), effectively disproving EMV as a standalone normative theory for rational choice.
  2.  **Correct:** Daniel Bernoulli's 1738 proposal to maximize expected *utility* rather than expected *value*, typically using a concave function like logarithm of wealth, successfully renders the expected utility of the standard St. Petersburg game finite.
  3.  **Correct:** This describes the "Super St. Petersburg" paradox; mathematically, if a utility function is unbounded, one can always construct a lottery with payouts growing fast enough relative to probabilities to generate infinite expected utility.
  4.  **Correct:** Karl Menger (1934) did demonstrate that to avoid these generalized paradoxes entirely, the utility function must be bounded; a bounded function guarantees that the expected utility of any lottery remains finite.
  5.  **Partly right:** While Jae is correct that bounded utility implies marginal utility must approach zero (which some find intuitively implausible for wealth), dismissing it as a "cheat" ignores that many formal decision theorists accept bounded utility as a necessary condition for mathematical coherence.

  **Closing:**

  Mireille comes out ahead on the technical history and mathematical consistency of Expected Utility Theory, accurately citing Bernoulli and Menger to defend the framework's internal logic. However, Jae captures the philosophical discomfort many feel toward ad hoc axioms like bounded utility. What both are missing is that this debate assumes Expected Utility Theory is the final word on rationality; in modern decision science, EUT itself is often considered descriptively inadequate due to unrelated paradoxes (like Allais or Ellsberg), and practically, the paradox dissolves anyway because no casino has an infinite bankroll to fund the game.
