      *   **Section 1: The Standard View (Compatibility).** Explain Bostrom's logic. Intelligence as an engine. IC as proof of universal optimization logic.
      *   **Section 2: The Critic's Challenge (Dependency).** Explain the argument that IC narrows the "mind space." Reflective stability and self-modification. The idea that "rationality" constrains values.
      *   **Section 3: Rebuttal/Analysis.** Distinguish between *Terminal* and *Instrumental*. Show that IC presupposes OT (you need orthogonal goals to see convergence). Address the self-modification argument (goal preservation is itself an instrumental goal derived from the terminal goal).
      *   **Conclusion:** Reiterate verdict. IC is the shadow cast by OT in a world of scarce resources. It confirms the independence of value and intellect.

  7.  **Key Philosophical Nuance to Include:**
