answer: |-
  **Val:** Twenty percent? You're leaving money on the table. The edge is twenty percent; the bet is even money. If I go all-in every round, my expected wealth is maximized. Full stop.

  **Kelly:** Your *expected* wealth. Across an ensemble of parallel universes. In this one, you go broke after the first tails.

  **Val:** But rationality is about expectations. Samuelson mocked your crowd for this. If a bet has positive EV, you take it. If you can repeat it, you take it harder. The fact that I ruin in 99.9% of paths is just the price of admission for the universe where I win forty flips straight and own the galaxy. That outlier drags the mean up. Ignoring it is irrational timidity disguised as prudence.

  **Kelly:** It's not timidity, it's ergodicity. You're confusing the ensemble average with the time average. Yes, across infinite parallel worlds, the average Val is rich. But you don't get to average across worlds. You live through time. In a non-ergodic system, the time-average growth rate is the geometric mean, not the arithmetic mean. Maximizing expected wealth maximizes the arithmetic mean. Maximizing log wealth maximizes the geometric mean.

  **Val:** I know the math. But "almost surely" isn't "surely." We only have forty rounds. The law of large numbers hasn't fully crushed me yet. There's a non-zero probability I hit the lucky streak. If I care about the value of money linearly, why should I penalize the upside just because the mode is zero? If I'm a utilitarian agent, shouldn't I care about the expectation?

  **Kelly:** Because you aren't an ensemble. You're a trajectory. If you bet everything, your time-average growth rate is negative infinity once you hit zero. You can't recover. Kelly betting maximizes the rate at which your wealth grows *along your actual path*. It's not risk-aversion utility; it's structural. If you reinvest winnings, the system is multiplicative. The arithmetic mean lies about what happens to *you*.

  **Val:** But what if I can sell the bet? If I can hedge, or share the payoff with others taking the other side of the risk, the ensemble becomes real. I could sell my future winnings to a syndicate. Then the EV is cashable. Your ergodicity argument collapses if I can diversify across agents instead of time.

  **Kelly:** Then you're no longer playing the game as described. You're arbitraging the risk away. But here, at this table, with this bankroll, you are the system. The median outcome of your all-in strategy is zero. The median outcome of my strategy is exponential growth. Do you want to be the average across realities, or the typical version of yourself in this one?

  **Val:** I want to be the version that wins big. Probability is just a measure of belief. If I believe the outlier is possible, and the payoff is infinite-ish, EV dominates. You're optimizing for survival; I'm optimizing for impact.

  **Kelly:** And I'm telling you that in a multiplicative world, survival *is* the prerequisite for impact. You can't compound on zero.

  **Val:** Then we agree on the math, and disagree on whether we live in one world or many.

  **Kelly:** No. We agree on the math. We disagree on whether "expected value" means anything when you only get one life.
