prompt: |-
  been down a bit of a kelly criterion rabbit hole again, partly bc of garrabrant's geometric rationality stuff on LW, and i want a dialogue to help me pressure-test both sides properly.

  two friends who both clearly know the math are arguing at a table where they've been offered 40 rounds of a coin biased 60/40 in their favor, even money payout, and they get to pick what fraction of their bankroll to stake each round. "Kelly" stakes 20% every round because that maximizes expected log wealth and almost surely beats any other fixed-fraction strategy given enough rounds. "Val" thinks that's way too timid -- if a bet has positive EV and you can repeat it, betting bigger (even going all in every single round) gives higher expected wealth, full stop, and "almost sure ruin" is just the price of admission for the astronomically good outcomes that drag that mean up in the first place.

  i want Val to really press on why "almost surely" should beat plain old expected value when maximizing EV is supposedly the whole point of being rational (kinda a Samuelson-vs-Kelly thing, like that paper samuelson wrote mocking kelly bettors entirely in one-syllable words). and i don't want Kelly to just retreat to "but ruin is bad" -- make them actually engage with the ergodicity argument instead of hand-waving at it. real back and forth, both equally sharp, nobody strawmanned, maybe 600 words or so.
