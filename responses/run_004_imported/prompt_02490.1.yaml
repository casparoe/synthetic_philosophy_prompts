      *   **Topic:** Jeremy Bentham's unpublished essay on "Paederasty" (1785).
      *   **Specific Passage:** Bentham acknowledges that antipathy (disgust/hatred) causes pain to those who feel it, and that seeing the object of antipathy punished causes them pleasure. He calls these "reasons for punishing." Then he counters with two reasons *against* punishing (prejudice can be educated away; slippery slope/tyranny of the majority).
