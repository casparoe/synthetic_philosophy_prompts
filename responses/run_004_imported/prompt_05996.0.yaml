  7.  **Final Polish:** Ensure tone is respectful to the novelist's research. Use specific Cartesian terms (*bête-machine*, *pineal gland*, *animal spirits*). Make sure the distinction between "acting *as if*" and "being" is clear. (Self-correction: Ensure I mention that for Descartes, language isn't just communication, it's the *expression of thought*.)

