      *(Self-Correction on Higher-Order)*: The worry is: Is $C(p)$ (p is Cartesian) knowable? If not, how do we assert the principle? If yes, does $p \land \neg Kp \land C(p)$ generate a new paradox? I'll frame it around whether the restriction is *transparent* to the knower.

