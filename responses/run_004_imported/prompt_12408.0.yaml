      *   *The Paradox Generator:* The proposition $p \land \neg Kp$ (p is true but unknown). If knowable, then $K(p \land \neg Kp)$, which implies $Kp \land K\neg Kp$, which implies $Kp \land \neg Kp$ (contradiction).
      *   *Restriction Strategy:* Modify the knowability principle to $\forall p (p \to \Diamond Kp)$ *only if* $p$ is Cartesian (i.e., $Kp$ is logically consistent). This excludes $p \land \neg Kp$ because knowing it is inconsistent.
      *   *Edgington's Strategy:* Uses an "actually" operator ($A$). Knowability is situated. $A p \to \Diamond K A p$. It handles the context of knowledge differently.
      *   *The "Spirit" of Verificationism:* Truth depends on evidence/verification. If we exclude too many truths from being knowable, does truth still depend on verification?

