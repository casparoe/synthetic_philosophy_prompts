      *   **Moore's *Principia Ethica* (1903):** Key themes: "Good" is indefinable (naturalistic fallacy), intuitionism, the importance of "states of consciousness," aesthetic enjoyment and personal affection as the highest goods.
      *   **Keynes's Interpretation of Moore:** *My Early Beliefs* (written much later, 1938, but reflects on the Apostles/Bloomsbury era). This is crucial because it shows how Keynes *remembered* and *interpreted* Moore at the time.

  3.  **Identify the Overlaps (Moore $\rightarrow$ Keynes):**
      *   **The End of Instrumentalism:** Moore argued that most things are means to ends. The ultimate ends are states of consciousness. Keynes applies this to economics: Economics is a *means* (solving scarcity), not an *end*. Once the means are secured, we focus on the ends.
      *   **The Highest Goods:** Moore explicitly lists "the pleasures of human intercourse and the enjoyment of beautiful objects" as the greatest goods. Keynes's vision of the post-scarcity life is exactly this: art, leisure, friendship, gardening, culture.
      *   **Rejection of Traditional Morality:** Moore rejected conventional religious/social duty as the basis for ethics. Keynes rejects the "love of money" and the traditional work ethic as moral virtues once they are no longer economically necessary.

  4.  **Identify the Divergences/Flattening (Keynes $\neq$ Moore):**
      *   **Historical Materialism vs. Intuitionism:** Moore is an ahistorical intuitionist. He doesn't care *how* you get to the state of consciousness, just that the state itself is good. Keynes adds a *historical narrative*. He believes economic progress is the vehicle that *allows* Moore's ethics to become universal. Moore didn't write a philosophy of history; Keynes turned Moore's ethics into a philosophy of history.
      *   **The "Religious" Aspect:** Moore was an atheist/agnostic analytic philosopher. Keynes, in *My Early Beliefs*, describes the Apostles' reaction to Moore as a "religious" awakening. Keynes injects a sense of *mission* and *secular salvation* that isn't really in Moore's dry text. Moore said "these things are good." Keynes said "we must build a world where everyone can enjoy these things."
      *   **The Problem of Purpose:** Moore assumes enlightened people will naturally pursue the good states. Keynes is actually anxious about this. In *Grandchildren*, he admits the "habitual disposition" to purposeful action (bred by capitalism) might leave people depressed when work disappears. Moore doesn't worry about the psychological transition; Keynes does.
      *   **Elitism vs. Universalism:** Moore's *Principia* is arguably elitist (only the enlightened intuit the good). Keynes's *Grandchildren* essay is surprisingly universalist (everyone will be rich enough to live like an Athenian gentleman). Keynes democratizes Moore's aristocracy of the spirit.

  5.  **Synthesize for the Novel Character:**
      *   **Tone:** Intellectual, slightly arrogant, visionary, perhaps a bit anxious about the "transition."
