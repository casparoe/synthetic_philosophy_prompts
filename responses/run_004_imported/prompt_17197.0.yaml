answer: |-
  This is a sharp distinction to make, and it's crucial for the voice of your character. If he sounds like he's just reciting *Principia Ethica*, he'll sound like a dry academic. If he sounds like he's *using* Moore to justify an economic teleology, he'll sound like Keynes.

  The short answer is: **Keynes took Moore's *definition* of the Good but rejected Moore's *method* of accessing it, replacing ethical intuition with economic engineering.**

  Here is the breakdown of where Keynes follows Moore, where he diverges, and where he arguably flattens Moore to fit his economic vision. This should give you the specific philosophical tension your character needs to articulate.

  ### 1. The Direct Lineage: Instrumental vs. Ultimate
  **Moore:** In *Principia Ethica* (1903), Moore argues that most things we value are merely *means* to an end. Money, work, social order—these are instrumental. The only things that are "good in themselves" (intrinsic goods) are specific states of consciousness. Moore famously narrows these down to two main categories: **"the pleasures of human intercourse and the enjoyment of beautiful objects."**

  **Keynes:** In *Economic Possibilities for our Grandchildren* (1930, but gestating in the late 20s), Keynes splits human needs into "absolute" (biological survival) and "relative" (positional status). He argues that economics is purely instrumental. Its only job is to solve the "absolute" problem of scarcity.

  **The Connection:** Your character's monologue should rest on this pivot: *Economics is the servant; Moore's ethics are the master.*
  *   **Moore:** "Work is not good; it is only a means to secure the time for the Good."
  *   **Keynes:** "We are building a machine (capitalism/compound interest) specifically to render work unnecessary, so that Moore's 'Good' can become the universal human occupation."

  **For the Monologue:** Have him dismiss the "love of money" not as a sin, but as a **neurosis**. It is a "disgusting morbidity" (Keynes's actual phrase) because it mistakes the means (money) for the end (the good life).

  ### 2. The Divergence: Historical Teleology vs. Static Intuition
  This is where Keynes modifies Moore significantly, and where your character can show his specific genius (and hubris).

  **Moore:** Moore is an **intuitionist**. He believes you recognize the Good through a direct mental apprehension. He does not provide a historical roadmap. He doesn't care *how* society gets to a point where people enjoy art and friendship, only that if they do, it is Good. It is an ahistorical, individualistic ethics.

  **Keynes:** Keynes turns Moore's ethics into a **philosophy of history**. He believes that economic progress is the *vehicle* that delivers Moore's Good to the masses. He assumes a teleology: History is moving toward a point where scarcity is solved, and therefore, Moore's "aristocracy of the spirit" will become a democracy.

  **The Flattening:** Moore would likely argue that a poor poet can intuit the Good just as well as a rich one, provided he has the capacity. Keynes argues that **material security is a prerequisite for the Good Life on a mass scale.** He materializes Moore's idealism. He assumes that once the "economic problem" is solved, virtue will naturally follow.

  **For the Monologue:** Your character should express a confident, almost messianic belief in **compound interest** as a moral force. He shouldn't just say "machines will save labor." He should say, "Compound interest is the mechanism that will finally liberate us to be Moorean."

  ### 3. The Anxiety: The "Habitual Disposition"
  This is the most dramatic tension in Keynes's essay and the place where he admits Moore didn't go far enough.

  **Moore:** Assumes that if you remove bad constraints, enlightened people will choose the Good.

  **Keynes:** Is actually terrified that people won't know what to do. He writes that for the first time since his creation, man will be faced with his **"real, his permanent problem"—how to use his freedom from pressing economic cares.** He worries that the "habitual disposition" to work, bred into us by capitalism, will leave us depressed and purposeless when the work vanishes.

  **The Addition:** Keynes adds a **psychological transition problem** that Moore ignores. Moore's ethics are for the already-enlightened (like the Bloomsbury Group). Keynes is asking: *What happens to the ordinary clerk when he no longer has to clerk?*

  **For the Monologue:** This is where the character can show vulnerability. He can admit that while the *economics* are solvable, the *moral conditioning* is not. "We have been trained for generations to toil. When the toil ends, will we have the capacity to live? Or will we suffer a nervous breakdown as a species?"

  ### 4. The "Religious" Distortion (The Apostles' Lens)
  You mentioned the Bloomsbury crowd treating Moore as a religion. This is key. In his later memoir *My Early Beliefs*, Keynes admits that he and his friends (the Apostles) turned Moore's dry analytic philosophy into a secular gospel.

  **Moore:** Was a dry, analytic atheist. He focused on logical precision.

  **Keynes & The Apostles:** Stripped away Moore's caution and skepticism. They kept the "Good" (art, love, beauty) but discarded Moore's rigorous demand for evidence and his hesitation about whether we can actually *know* the Good. They treated Moore's "states of consciousness" as a commandment to pursue aesthetic ecstasy and personal intimacy above all social duties.

  **The Misreading:** They ignored Moore's insistence that consequences are hard to predict. Keynes, the policy maker, is all about predicting consequences. He uses Moore's *values* to justify his *interventionism*, which Moore might have found logically suspect.

  **For the Monologue:** Your character should speak about "the Good" with a fervor that borders on the religious, despite being a rationalist. He should treat "beauty and connection" not just as nice things, but as the **only rational justification for existence.**

  ### Summary for the Character's Voice
  To get the philosophy right in the dialogue, your character should hit these three notes:

  1.  **The Demotion of Economics:** "Economics is a technicality, a bridge. It is not the destination. To treat it as the destination is a moral failure." (Pure Moore).
  2.  **The Promotion of History:** "We are the first generation lucky enough to see the bridge finish. We are laying the track for the utopia of leisure." (Keynes's addition).
  3.  **The Fear of Freedom:** "The real danger isn't starvation. It's boredom. It's that we have forgotten how to live without a master." (Keynes's anxiety).

  ### A Sample Passage (for flavor)
  *Here is how that philosophical distinction might sound in a 1928 dinner party context:*

  > "You're all still thinking in terms of sin and virtue, of thrift and labor. But that's merely the morality of scarcity. It's the code of the starving man who must not drop a crumb. Moore told us, twenty years ago, that the only things worth having are the love of our friends and the sight of a beautiful thing. Everything else is just plumbing.
  >
  > "Well, the plumbing is nearly finished. Compound interest is doing the work of ten generations. In a hundred years, the economic problem will be solved. And then? Then we face the terrifying truth. We will have to become what Moore assumed we already were: creatures capable of living for the sake of living. We are breeding a world of leisure, but have we bred the capacity to enjoy it? Or will we find ourselves like children let loose in a sweetshop, sick from the excess, longing for the discipline of the fast?"

  ### Key Takeaway for Your Draft
  Keynes didn't just apply Moore; he **historicized** him. Moore provided the *what* (art and love); Keynes provided the *how* (economic growth) and the *when* (the future). Your character should sound like a man who believes he has found the engineering schematic for Moore's heaven, but is privately worried that humanity might not fit through the door.
