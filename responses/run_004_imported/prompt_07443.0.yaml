          2.  **Confirmation vs. Truth:** Carnap distinguished between confirming a hypothesis and establishing truth. He would treat the computational plan as a high-level hypothesis. Is it *confirmable*? If the system is too complex to trace causality, does it violate his standards of empirical significance?
