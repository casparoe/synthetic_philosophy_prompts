          *   **The Principle of Tolerance:** This is the big one. Carnap wouldn't say planning is *true* and markets are *false*. He would ask: "Which linguistic framework is more *fruitful*?" He would be skeptical of claims that planning is *scientifically necessary* rather than just a pragmatic choice.
          *   **Induction and Prediction:** Carnap worked heavily on inductive logic. He knew the limits of prediction. Hayek's objection isn't just about computing power; it's about the *generation* of new knowledge through market processes. Can a model optimize what it doesn't know exists yet? Carnap would be sensitive to the logical limits of inductive inference here.
