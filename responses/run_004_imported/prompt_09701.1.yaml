  **S Tier**
  *   **Armstrong's states-of-affairs view:** This is the standard-bearer for contemporary realism; by treating instantiation as a category-specific "non-relational tie" rather than a standard relation, it stops the regress without denying the reality of properties.
  *   **Act-based theories (Hanks/Soames):** This is the hottest contemporary solution; it shifts the unity from the proposition itself to the cognitive act of predication, effectively dissolving the ontological glue problem by making it psychological.

  **A Tier**
  *   **Frege's unsaturated concepts:** This is the foundational semantic move that everyone respects, but many metaphysicians find the idea of "unsaturated" entities too metaphorical or mysterious to be a full ontological solution.

  **B Tier**
  *   **Deflationary shrug:** Philosophically robust but dramatically unsatisfying; it claims the problem is a linguistic illusion, which works logically but feels like avoiding the fight to a true metaphysician.
  *   **Wittgenstein's picture-theory:** Elegant and historically massive, but because it relies on "logical form" showing itself rather than being stated, it often feels like mysticism disguised as analysis.

  **C Tier**
  *   **Russell's multiple relation theory:** Historically crucial but widely considered technically refuted (mostly by Wittgenstein); it tries to dissolve the proposition into a judgement act but fails to account for false beliefs coherently.
  *   **Bergmann's primitive nexus:** This is often viewed as ad hoc; positing a brute "nexus" sounds less like a solution and more like giving the problem a proper name to stop the conversation.

  **D Tier**
  *   **Bradley's monism:** While logically consistent, it solves the regress by denying the reality of relations and plurality entirely, which is too high a cost for almost any working analytic metaphysician to pay.
