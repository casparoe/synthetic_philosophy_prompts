          *   Key distinction: Discovery vs. Construction.
      *   *Section 3: The Superposition & Basis Problem.* Explain that neural activations are continuous vectors. SAEs impose a discrete basis. There are infinite bases that reconstruct the vector equally well. Why is *this* one the "real" one?
      *   *Section 4: Functional vs. Descriptive.* Real representations should have causal power. If the split features don't map to distinct causal pathways in the model, they are just descriptive labels.
      *   *Conclusion:* Summarize the stance. The features are *useful fictions* (instrumentalism), not *discovered atoms* (realism).

  6.  **Refining the Argument (Self-Correction during drafting):**
