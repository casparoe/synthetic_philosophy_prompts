          *   *The Hájek Point:* The physical world doesn't come labeled with "setup boundaries." You have to choose which features are relevant to the chance mechanism. That choice *is* the reference class problem in disguise. You are selecting the class of "relevantly similar setups."

      *   **Section 2: Bayesianism (The "Prior/Calibration" Problem)**
