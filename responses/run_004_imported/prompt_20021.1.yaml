      *   **Goal:** Explain the persistence of RCP in propensity and Bayesian frameworks using concrete examples, showing where the "which class/setup" choice hides.

  2.  **Analyze the Reference Class Problem (RCP) Core:**
      *   What is it essentially? It's the problem of *individuation*. To assign a probability to a specific event (token), you need to categorize it (type). But there are infinite ways to categorize any token. Different categories yield different probabilities. There is no meta-rule to pick the "best" category.
      *   Frequentist version: "What is the frequency of $X$ in class $C$?" Which $C$?

