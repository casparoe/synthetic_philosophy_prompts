answer: |-
  A hitchhiker arrives in town, safe and sound. The driver holds out her hand for the fare.

  The hitchhiker hesitates, wallet in hand. "Look," he says, "let's be causal about this. You've already driven me. I'm already hydrated. If I keep this money, nothing changes. You can't leave me here. By every standard metric of self-interest, I'm an idiot if I pay you."

  The driver keeps her hand out. "True. But if you were the kind of person who kept the money, I wouldn't have picked you up."

  "But I *am* the kind of person who got picked up!" the hitchhiker argues. "I'm standing here!"

  "Exactly," says the driver. "So pay up."

  The hitchhiker hands over the cash, shaking his head. "This is insane. I'm paying for a service I already received, based on a threat that no longer exists."

  "Welcome to Rational Irrationality," says the driver. "Would you like a receipt?"

  "No," says the hitchhiker. "Just tell my past self thanks. And tell him next time I'm walking. It's cheaper than being rational."
