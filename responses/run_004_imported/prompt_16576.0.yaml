  Ok this has been bugging me for a while. I finally got around to reading through Yudkowsky's old zombie sequence (the Generalized Anti-Zombie Principle stuff), and it seems like he basically closes the case on p-zombies: if your zombie twin would write the exact same confused blog posts about qualia, for the exact same physical reasons you do, then your belief that you're conscious isn't even being caused by your actual consciousness -- which is obviously insane. So why are Chalmers and co still writing papers defending the conceivability argument like its an open question? Should I just mentally file 'zombies' under 'solved, academic philosophy just hasn't caught up yet' whenever it comes up in a paper?
