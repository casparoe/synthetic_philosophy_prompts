prompt: |-
  So I'm TAing a history of political thought seminar this semester and we just wrapped up the unit on Aquinas and tyranny — De Regimine Principum, the bit in his Sentences commentary (book II, dist. 44, I think it's q.2 a.2 but don't quote me on the exact article) about whether killing a tyrant counts as sinful sedition, plus the parallel passage in the Summa (II-II q.42, on sedition). What's been bugging a couple of my students, and honestly me too, is how the standard undergrad gloss — "Aquinas was basically fine with tyrannicide" — flattens a position that's actually pretty hedged. He's clearly nervous about private individuals just unilaterally deciding some ruler counts as a tyrant and acting on it, as opposed to the community or some public authority doing the deposing, and there's also that distinction (formalized more by guys like Bartolus later, but at least implicit in Aquinas) between a tyrant by defect of title — basically a usurper — versus a legitimate ruler who becomes tyrannical in how he actually exercises power.

  For a discussion section exercise I want to spring on them something totally anachronistic: would Aquinas think a modern democratic state's intelligence service is justified in drone-striking a foreign dictator (think a Gaddafi-type figure, or hypothetically someone like Kim Jong-un) rather then invading the country or just doing sanctions. Obviously drone warfare, the Westphalian state system, and international law on non-intervention are all things he never had to reckon with, so "well he was ok with killing tyrants so sure" feels too easy to me. I want something that actually engages his framework: does a foreign agency like the CIA count as the kind of "public authority" he thinks removal requires, does the usurper vs. tyrant-by-conduct distinction even make sense applied to something like a hereditary dictatorship, and does his common-good/natural-law apparatus actually cash out into a determinate verdict here or does it just run out of road at some point. Would love your reconstruction of this, staying as close as you can to the actual texts and distinctions rather than the pop-summary version of "Thomistic tyrannicide."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a TA for a History of Political Thought seminar.
      *   **Topic:** Aquinas on tyranny and tyrannicide (*De Regimine Principum*, *Sentences* Commentary, *Summa Theologiae* II-II q.42).
      *   **Problem:** The standard undergrad gloss ("Aquinas was fine with tyrannicide") is too simplistic. Aquinas is cautious about private initiative, emphasizes public authority, and distinguishes between usurpers and legitimate rulers gone bad.
      *   **Task:** Create a discussion section exercise/scenario that applies Aquinas's framework anachronistically to a modern situation: A modern democratic state's intelligence service (e.g., CIA) drone-striking a foreign dictator (e.g., Gaddafi, Kim Jong-un).
      *   **Constraints:** Stay close to actual texts and distinctions, avoid pop-summaries, acknowledge anachronism, and explore whether Aquinas's framework yields a determinate verdict or runs out of road.

  2.  **Deconstruct Aquinas's Position (Mental Retrieval & Verification):**
      *   *De Regimine Principum* (On Kingship): Book I, Chapter 6 is the key text often cited. He discusses what to do against a tyrant.
          *   Option 1: Do nothing (endure it) if the tyranny isn't excessive (to avoid worse chaos).
          *   Option 2: Public Authority. If there is a higher authority (like the Emperor over a king), they can depose the tyrant.
          *   Option 3: If no human remedy, turn to God.
          *   *Crucial Point:* He explicitly warns against private individuals taking it upon themselves. This is linked to the example of Ehud in the Old Testament (which he treats cautiously) vs. the apostles not killing Nero.
      *   *Summa Theologiae* II-II, q. 42, a. 2 (Sedition): Sedition is a special sin opposed to the unity of the multitude. Removing a tyrant *isn't* sedition if it's done by public authority for the common good. But private presumption is dangerous.
      *   *Sentences* Commentary (In II Sent., d. 44, q. 2, a. 2): Discusses whether it is meritorious to kill a tyrant. He says it depends. If the tyrant is a usurper (*tyrannus ex defectu tituli*), it's more permissible. If they have a just title but rule badly (*tyrannus ex parte exercitii*), it's much harder.
      *   *Key Distinctions:*
          1.  Private vs. Public Authority.
          2.  Usurper vs. Legitimate Ruler (defect of title vs. defect of exercise).
          3.  Common Good vs. Private Whim/Chaos.
          4.  Proportionality (does removal cause more harm than the tyranny?).

  3.  **Evaluate the Anachronistic Scenario (CIA Drone Strike):**
      *   *The Actor:* CIA/Intelligence Service. Is this a "public authority"? In Aquinas's sense, public authority usually means the *polis* or a superior sovereign (Emperor). A foreign intelligence agency is an arm of a *foreign* sovereign. Does Aquinas's framework allow *external* intervention?
          *   *Textual basis:* In *De Regimine*, he mentions recourse to a "superior" (e.g., the Roman Emperor over a local king). This implies a hierarchy of jurisdiction. Modern international law is horizontal (Westphalian), not hierarchical.
      *   *The Target:* Foreign Dictator.
          *   *Usurper?* Kim Jong-un is hereditary within his system, but illegitimate by democratic standards. Aquinas cares about *legal* title within that community's law/custom, not external validation. If he succeeded according to their laws, he's not a usurper in the Thomistic sense.
          *   *Tyrant by Exercise?* Likely yes, if ruling against the common good of *his* people.
      *   *The Act:* Drone Strike.
          *   *War vs. Execution:* Is this an act of war (between states) or police action (removing a criminal)? Aquinas has a Just War theory (*Summa* II-II, q. 40).
      *   *The Common Good:* Aquinas prioritizes the common good of the *community* in question. Does a foreign power act for *that* common good, or its own?

  4.  **Drafting the Response:**
      *   **Acknowledge the TA's Insight:** Validate that the "Aquinas = Tyrannicide" gloss is indeed lazy. The hesitation about private authority is central.
      *   **Structure the Exercise:** Break it down into the specific Thomistic criteria.
      *   **Criterion 1: Authority (Who strikes?).**
          *   Aquinas requires *publica auctoritas*.
          *   Problem: Is the CIA "public"? Yes, for the US. But is it public *for the tyrant's subjects*?
          *   Aquinas allows superior authority (Emperor). Does the UN or a hegemon count? Probably not in his feudal/imperial framework.
          *   *Verdict:* This is the biggest hurdle. Foreign intervention looks more like war than juridical deposition.
      *   **Criterion 2: Title (Usurper vs. Exercise).**
          *   Distinguish *tyrannus ex defectu tituli* vs. *ex parte exercitii*.
          *   Modern dictators often have internal legal title (constitutions, heredity). So they are tyrants by exercise.
          *   Aquinas is much stricter here. Deposing a legitimate title-holder is riskier (sedition/chaos).
      *   **Criterion 3: Proportionality & The Common Good.**
          *   *De Regimine* I.6: Don't remove a tyrant if it leads to worse tyranny or civil war.
          *   Drone strike: Does it decapitate and liberate, or cause power vacuum/chaos?
          *   Aquinas cares about the *subjects'* good, not the *striker's* security.
      *   **Criterion 4: Just War vs. Tyrannicide.**
          *   Maybe the framework shifts from tyrannicide to *bellum justum*.
          *   If it's war, it needs right intention, proper authority, just cause.
          *   But targeting a specific head of state is tricky in Just War theory (usually about restoring right order, not assassination).
      *   **Conclusion/Pedagogical Angle:** The framework likely "runs out of road." Aquinas assumes a shared moral universe (Christendom/Natural Law) and a hierarchy of jurisdiction. The Westphalian system breaks the "superior authority" clause.

  5.  **Refining the Tone:**
      *   Keep it academic but accessible for a TA to use.
      *   Cite specific texts (*De Regimine* I.6, *ST* II-II q.42, *In II Sent.*).
      *   Avoid giving a definitive "Yes/No" but rather show *why* it's difficult.
      *   Highlight the tension between Natural Law (universal) and Positive Law (jurisdictional).

  6.  **Self-Correction/Nuance Check:**
      *   *Did Aquinas explicitly forbid foreign intervention?* No, he didn't foresee it. But his logic implies jurisdiction is tied to the community.
      *   *Is the CIA a "private individual"?* No, it's state apparatus. But it's a *foreign* state. To the tyrant's subjects, is it a liberator or an invader?
      *   *The "Ehud" Example:* Aquinas mentions Ehud killing Eglon. Ehud was a judge (public authority) of Israel, acting against a foreign oppressor. This might actually support intervention *if* the intervener is acting as a deliverer appointed by God/Higher Law, but Aquinas is wary of using this as a general precedent.
      *   *Make sure to mention the "Sedition" angle:* If the foreign power incites locals, is that sedition?

  7.  **Final Polish:** Organize into "Discussion Prompts" or "Analytical Framework" for the TA. Ensure the distinction between *tyrannus ex defectu tituli* and *ex parte exercitii* is central, as the user specifically mentioned it. (Self-correction: Ensure I don't get too bogged down in the *Sentences* citation uncertainty, just acknowledge the distinction exists there and in *De Regimine*).

  8.  *(Final thought before drafting)*: Make sure to emphasize that for Aquinas, the *end* is the common good of the *specific community*. A foreign power acting for *its own* security fails the "right intention" test regarding the tyrant's community.

  9.  **Drafting the Content:** (Proceed to generate response based on these points.)
answer: |-
  This is a fantastic pedagogical challenge. You are absolutely right to be suspicious of the "Aquinas = Tyrannicide" shorthand. It ignores the profound juridical caution in his work, specifically his fear that privatizing violence destroys the very *ordo* (order) one is trying to save.

  The anachronism of the CIA drone strike is actually a brilliant stress test for Thomistic political theology because it forces students to confront the gap between **Natural Law** (which is universal) and **Positive/Juridical Authority** (which is local and hierarchical).

  Here is a reconstruction of how Aquinas's framework applies to this scenario, broken down by the specific distinctions you mentioned, followed by a set of discussion prompts you can use in section.

  ### 1. The Authority Problem: *Publica Auctoritas* vs. Foreign Power
  **The Text:** *De Regimine Principum* I.6; *ST* II-II, q. 42, a. 2.
  **The Distinction:** Aquinas is adamant that removing a tyrant is not sedition *only* if done by **public authority** (*publica auctoritas*). He explicitly condemns private presumption (*privata praesumptio*).

  **The Application:**
  *   **Is the CIA "Public Authority"?** For the US, yes. But for the subjects of the tyrant (e.g., North Koreans or Libyans), the CIA is a foreign entity.
  *   **The Hierarchy Issue:** In *De Regimine*, Aquinas suggests that if a king becomes a tyrant, recourse should be had to a **superior** (e.g., the Emperor over a local king). This assumes a vertical hierarchy of jurisdiction (Feudal/Imperial).
  *   **The Westphalian Clash:** In the modern state system, there is no "superior" to a sovereign. A foreign state is not a *superior* jurisdiction; it is a *parallel* jurisdiction.
  *   **Thomistic Verdict:** Aquinas would likely struggle to categorize a foreign intelligence service. It isn't a "private individual," but it lacks jurisdiction over the tyrant's community. To Aquinas, authority is tied to the care of a specific *multitudo* (multitude). A foreign power acting unilaterally looks less like a judge deposing a criminal and more like one kingdom attacking another—which shifts the framework from **tyrannicide** to **Just War** (*ST* II-II, q. 40).

  ### 2. The Title Distinction: *Defectu Tituli* vs. *Exercitii*
  **The Text:** *In II Sent.*, d. 44, q. 2, a. 2; *De Regimine Principum* I.6.
  **The Distinction:**
  *   **Tyrant by Defect of Title (*tyrannus ex defectu tituli*):** A usurper who seized power without legal right. Aquinas is much more permissive here; removing them is often seen as meritorious because they lack the bond of fidelity with the subjects.
  *   **Tyrant by Exercise (*tyrannus ex parte exercitii*):** A ruler with a legitimate claim (hereditary, elected) who rules badly. Aquinas is extremely cautious here. The bond of fidelity exists; breaking it risks greater evil (civil war, worse tyranny).

  **The Application:**
  *   **Modern Dictators:** Figures like Kim Jong-un or Gaddafi usually hold power through internal legal mechanisms (constitutions, party structures, heredity recognized by local custom). They are rarely "usurpers" in the Thomistic sense; they are legitimate rulers governing tyrannically.
  *   **Thomistic Verdict:** This makes the drone strike much harder to justify. If the target is a *tyrannus ex parte exercitii*, Aquinas warns that removing them often leads to greater disorder (*perturbatio*). He explicitly argues in *De Regimine* that it is better to endure a mild tyranny than to risk a civil war that brings a worse tyrant. A drone strike that decapitates a regime often creates a power vacuum (as seen in Libya post-2011), which Aquinas would likely view as a violation of the **Common Good**.

  ### 3. The End Game: The Common Good vs. Foreign Interest
  **The Text:** *ST* I-II, q. 90 (on Law); *De Regimine Principum* I.1.
  **The Distinction:** Law and authority are ordained toward the **Common Good** of the specific community.

  **The Application:**
  *   **Intention:** Why is the drone strike happening? If it is for the security of the *striking* nation (e.g., preventing terrorism), Aquinas might view this as an act of self-defense (Just War), but not necessarily "tyrannicide" for the sake of the oppressed subjects.
  *   **The Subjects' Good:** For Aquinas, the justification for removing a tyrant rests on the good of the *tyrant's subjects*. If the foreign intervention does not result in a stable political order that serves *their* common good, the act is morally suspect.
  *   **Thomistic Verdict:** Aquinas would ask: "Does this strike establish a regime conducive to virtue and peace for *that* people?" If the answer is "We don't know" or "It secures our oil/interests," the action fails the Natural Law test.

  ### 4. Where the Framework Runs Out of Road
  Aquinas assumes a shared metaphysical and moral universe (Christendom/Natural Law) where "tyranny" is an objective deviation recognizable by all rational actors.
  *   **Epistemological Problem:** Who decides the target is a tyrant? For Aquinas, this judgment belongs to the community or a superior judge. In the modern scenario, a foreign intelligence agency makes a unilateral judgment. To Aquinas, this looks like **private presumption** dressed in state clothes.
  *   **Jurisdictional Problem:** Natural Law is universal, but political authority is particular. Aquinas has no mechanism for "universal jurisdiction" enforcement by foreign powers. He would likely argue that unless there is a recognized superior (like a UN with actual imperial authority, which doesn't exist), the foreign power is acting outside its *ordo*.

  ---

  ### Discussion Section Exercise: "The Thomistic Drone Memo"

  **Prompt for Students:**
  *Imagine you are a moral theologian in 1270, but you have been magically transported to 2024. The US government asks you to write a memo on whether a targeted drone strike against a foreign dictator is permissible under Thomistic political theory. Using the distinctions from **De Regimine Principum I.6** and **ST II-II q.42**, answer the following:*

  1.  **Authority:** Does the CIA count as a *publica auctoritas* regarding the dictator's subjects? If not, does this action count as "sedition" or "war"?
  2.  **Title:** Does it matter if the dictator inherited power (legitimate title) vs. seized it in a coup (usurper)? How does this change the moral weight of the strike?
  3.  **Proportionality:** Aquinas warns that removing a tyrant might lead to "greater tyranny." How would he evaluate the risk of post-strike chaos (e.g., civil war, ISIS emergence) vs. the continuation of the dictatorship?
  4.  **The Verdict:** Does Aquinas's framework allow for "humanitarian intervention," or does his insistence on jurisdictional hierarchy forbid it?

  **Key Takeaways to Guide Them Toward:**
  *   **The "Private" Trap:** Even though the CIA is a state agency, to the *dictator's people*, they are outsiders. Aquinas fears private judgment. Without a "Superior Emperor" (global sovereign), foreign intervention looks like private vengeance.
  *   **The Usurper Loophole:** Students often want to say "Dictators are usurpers." Push them on this. If the local law/custom accepts the heredity, Aquinas sees them as legitimate rulers. This makes removal much harder to justify than killing a pure usurper.
  *   **Order over Justice:** Aquinas prioritizes the *unity of the multitude* (peace/order) sometimes even over the removal of an unjust ruler, if the removal causes greater fragmentation. This challenges the modern liberal intuition that "justice" (removing the bad guy) is always the highest good.

  ### Summary for your Prep
  If you want the "spoiler" for yourself: Aquinas likely **would not** justify the drone strike as *tyrannicide*. He would likely categorize it as an act of **War**.
  *   If it is War, it requires a Just Cause (self-defense or restoring right order).
  *   If it is Tyrannicide, it lacks the proper *public authority* relative to the subjects.
  *   Therefore, the standard undergrad gloss ("Aquinas supports killing tyrants") collapses here because the *jurisdictional conditions* for that killing are absent.

  This exercise forces students to see that for Aquinas, **procedure and authority are moral categories**, not just legal technicalities. You can't do the "right thing" (killing a tyrant) via the "wrong authority" (private/foreign presumption) without sinning against the order of the universe.
