      *   **"Thick" vs. "Thin" Ethical Concepts:** "Thick" concepts (cruel, brave, treacherous) are embedded in specific social contexts and describe the world *and* evaluate it. "Thin" concepts (right, wrong, ought) are abstract and universalizing. Williams favored "thick" concepts.
      *   **Opera as a Form:** Williams saw opera as an artificial, heightened form where music expresses psychological states that words alone cannot. It's not realism. The music *is* the emotion.
      *   **Moralism in Art:** Williams was generally suspicious of art that serves as a moral lesson. He valued art that reveals the complexity of human life, even if it's uncomfortable.
