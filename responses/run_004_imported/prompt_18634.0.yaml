answer: |-
  This is a fantastic test case. It is rare to see a BBQ argument track the contemporary academic literature on moral responsibility this closely. You have essentially reconstructed the debate between the "Content View" of blame (Marcus) and the "Standing/Authority View" of blame (Lena) that currently dominates journals like *Ethics* and *Philosophy & Public Affairs*.

  Given your background, I will treat this like a peer review of an experimental design. I'll evaluate the validity of each move, identify where the variables are being conflated, and offer a verdict on whether "standing" is a real mechanism or a confounding variable.

  Here is the move-by-move breakdown.

  ### Move-by-Move Analysis

  **(1) Marcus:** *The kid is dodging. Hypocrisy doesn't make the advice wrong. "You do it too" is a textbook tu quoque.*
  *   **Verdict:** **Marcus is logically correct, but pragmatically narrow.**
  *   **Analysis:** Marcus is treating blame as a **constative speech act** (a statement of fact). In formal logic, he is absolutely right: the truth value of the proposition "excessive screen time is harmful" is independent of the speaker's behavior. *Tu quoque* is indeed a formal fallacy if the goal is to establish the truth of the claim. However, Marcus is missing that blame is usually an **illocutionary act** (a demand for accountability). He is critiquing the *data*, while the kid is critiquing the *messenger's authority*. Marcus wins on logic, but he is measuring the wrong variable.

  **(2) Lena:** *The kid isn't disputing the content, he's disputing Dave's business in saying it. Content can be true while the messenger lacks standing.*
  *   **Verdict:** **Lena is correct.**
  *   **Analysis:** Lena correctly identifies the category error Marcus is making. She distinguishes between the **proposition** (screens are bad) and the **normative transaction** (who is allowed to demand compliance). In the literature (e.g., R. Jay Wallace, Macalester Bell), this is the distinction between the *fittingness* of blame (is the act wrong?) and the *standing* to blame (do you have the right to demand this?). Lena successfully isolates the variable Marcus conflated.

  **(3) Marcus:** *What work does "standing" add? If the message is true and needed, why care who says it? Isn't this just an excuse for hypocrites?*
  *   **Verdict:** **Marcus raises a valid pragmatic risk, but misunderstands the mechanism.**
  *   **Analysis:** This is Marcus's strongest move. He is asking for the *functional utility* of standing. If the goal of parenting is to reduce screen time (consequentialism), then Dave's hypocrisy is irrelevant to the outcome. Marcus is worried that "standing" is just a "get out of jail free" card for moralists. He is right that if standing were a veto on *truth*, it would be dangerous. But he is assuming standing vetoes the *message*, whereas Lena argues it vetoes the *scolding*. Marcus wins the point on *urgency*, but loses on *moral structure*.

  **(4) Lena:** *Blaming is making a demand + claiming you hold yourself to it. A hypocrite claims an unearned exemption. That's the objection, separate from truth.*
  *   **Verdict:** **Lena is correct.**
  *   **Analysis:** This is the core of the "Commitment Account" of standing (championed by philosophers like Kyle Fritz and Daniel Miller). Lena explains *why* hypocrisy hurts: it violates the implicit contract of mutual accountability. When Dave blames the son, he implies, "We are both subject to this norm." By violating the norm secretly, Dave asserts, "The norm applies to you, but I am exempt." The moral injury isn't the screen time; it's the inequality of authority. Lena successfully defines the mechanism Marcus asked for in Move 3.

  **(5) Marcus:** *That proves too much. Nobody is flawless. By that logic, nobody could criticize anyone unless they were perfect.*
  *   **Verdict:** **Marcus identifies a slippery slope, but it targets a straw man.**
  *   **Analysis:** Marcus is employing a *reductio ad absurdum*. He assumes Lena's view requires **moral perfection** for standing. If that were true, morality would collapse, as no one could ever correct anyone. This is a valid check against a naive version of the standing view. However, as we see in Move 6, Lena is not arguing for perfection. Marcus is right to demand consistency, but he is attacking a stricter version of Lena's argument than she is actually holding.

  **(6) Lena:** *The fix isn't perfection, it's not running a double standard. Owning the flaw ("I'm just as bad, we both need to cut down") restores standing.*
  *   **Verdict:** **Lena wins the exchange.**
  *   **Analysis:** Lena dissolves Marcus's *reductio*. This aligns with the "Ownership Condition" in current philosophy. Standing is lost not by *failing*, but by *denying the failure while enforcing the rule*. If Dave admits his fault, he re-establishes the community of accountability ("We are in this together"). This proves "standing" is not a shield for hypocrites, but a demand for honesty. Lena successfully navigates the trap Marcus set in Move 5.

  ---

  ### Does "Standing" Do Real Philosophical Work?

  You asked specifically about Move 3: *Is "standing" just a polite label for changing the subject?*

  **Verdict: No, it is doing distinct work.**

  Marcus is operating under a **Consequentialist/Transmission Model** of communication: *Goal = Transfer True Information.* In this model, the sender's properties are irrelevant noise.

  Lena is operating under a **Relational/Normative Model** of communication: *Goal = Regulate Shared Conduct.* In this model, the sender's properties are signal, not noise.

  Here is the chemical analogy: Imagine a safety officer in a lab telling you to wear goggles while not wearing his own.
  *   **Marcus's view:** The goggles *are* necessary for safety. The officer is right. Put them on.
  *   **Lena's view:** The safety officer is asserting a regulatory authority he is actively undermining. If he doesn't wear them, he signals that the rule is optional for those with status. This erodes the safety culture long-term, even if you put the goggles on today.

  "Standing" is the variable that measures the integrity of the normative system. If we ignore standing (as Marcus suggests), we might win the battle (kid puts phone down) but lose the war (kid learns that rules are for subordinates, not leaders). So, standing is not changing the subject; it is analyzing the *cost of enforcement*.

  ### What Both of Them Are Missing

  While Lena wins the theoretical debate, there are two variables they both omitted that would settle the practical dispute at the BBQ.

  **1. The Parental Authority Exception**
  The literature on standing often carves out an exception for **fiduciary roles** (parents, teachers, judges). A parent has a *duty* to correct a child that a stranger does not. Some philosophers (like Christopher Fricker) argue that parents retain standing to blame even if they are hypocritical, because their job is to guide the child toward norms the child hasn't mastered yet, regardless of the parent's mastery.
  *   *Application:* Dave might have standing *because he is the dad*, not because he is morally pure. However, most agree that while he has the *right* to correct, the *hypocrisy* still makes the correction less effective and morally uglier. Lena is still right that the hypocrisy is objectionable, even if Dave retains the authority.

  **2. The Distinction Between "Silencing" and "Mitigating"**
  Marcus thinks Lena is saying Dave must be *silenced* (you can't say it). Lena thinks she is saying Dave is *mitigated* (you can say it, but you can't be resentful or punitive about it).
  *   *The Missing Settlement:* The kid's "look who's talking" is a valid challenge to Dave's **resentment**, not necessarily to the **rule**. Dave is allowed to say, "Please put the phone away, it's bad for us." He is *not* allowed to say, "How dare you, you know better," while holding his own phone.
  *   If Dave had said, "I know I'm on mine, and I'm trying to stop. Please help me out by putting yours away," the kid likely wouldn't have pushed back. The conflict wasn't about the phone; it was about the **asymmetry of demand**.

  ### Final Referee's Ruling

  **Overall Winner: Lena.**

  Marcus is defending a logical truth (the advice is good), but Lena is defending a moral norm (how we enforce advice matters).

  *   **Marcus** is right that *tu quoque* is a logical fallacy regarding truth.
  *   **Lena** is right that *tu quoque* is a **valid moral defeater** regarding standing.

  In the philosophy of blame, the consensus has shifted toward Lena's position in the last 15 years. Hypocrisy doesn't make the *blamee* less blameworthy, but it makes the *blamer* liable to rebuke for the act of blaming.

  **The Settlement:**
  Dave was wrong to scold *authoritatively* while exempting himself. The kid was right to challenge the *fairness*, even if he was wrong to imply the *rule* didn't apply. Marcus was right that the rule stands; Lena was right that Dave lost the moral high ground to enforce it.

  If you want to settle the BBQ group: Tell Marcus he wins on **Logic**, tell Lena she wins on **Ethics**, and tell Dave he needs to put the damn phone away.
