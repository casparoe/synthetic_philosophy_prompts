answer: |-
  "You have read the letter from Puebla."

  "I have. Though I note it was signed Sor Filotea, not His Excellency the Bishop."

  "The pen name protects your modesty, not his authority. You know the counsel within is sound. To critique a sermon by Father Vieira is to step into a pulpit reserved for men."

  "I critiqued the logic, not the doctrine. If a sermon claims the greatest fine was for women speaking, yet Christ rebuked Peter more harshly, is it vanity to point out the error? Or is it charity to correct a misunderstanding of Scripture?"

  "It is obedience to remain silent. Saint Paul commands women to learn in silence with all subjection. He does not invite them to dispute with the Fathers."

  "Saint Paul also said there is neither male nor female in Christ. If God bestowed upon me the faculty of reason, is it not a greater sin to let it lie fallow than to till it? I study not to preach, but to know Him through His works. The universe is a book written by God's hand. Must I close it to prove my piety?"

  "You study to be praised by viceroys and poets, not to know God. Look at your cell. It is filled with instruments and globes, not icons. Where is the bride of Christ in that chamber? I see only the mistress of the Muses."

  "If I neglect the talent God lent me, I am the servant who buried his coin in the earth. Is that the humility you require? To waste the divine gift?"

  "To sacrifice the gift is the highest worship. Abraham was asked to sacrifice Isaac. You are asked to sacrifice your intellect. Which is harder? Which proves more love?"

  "Abraham's sacrifice did not contradict God's nature. My intellect is the very image of God within me. To dull it is to obscure His reflection. Besides, if understanding leads to error, then faith is blind. But I find that the more I understand the mechanics of the world, the more I marvel at the Architect."

  "Marveling is prayer. Disputing is pride. You published that critique. You allowed your name to circulate with it. That is not marveling; that is seeking glory. The Bishop warns you that this path leads to damnation, not for your sex, but for your soul. Pride falls harder than any woman."

  "Then let me fall into God's hands, for He gave me this nature. If I am wrong, let Him correct me directly. Why must I accept the correction of men who claim to speak for Him, yet fear a woman's ink more than a devil's whisper?"

  "Because the Church is the vessel of His will. You vow obedience. When the voice of the Church speaks through a Bishop, it supersedes the voice of your own reason. You argue as a philosopher, Sor Juana, but you are a nun. The habit you wear is not a scholar's robe."

  "The habit covers my body, not my mind. If I cease to think, do I not cease to be the creature He made? I will study theology, then. If I may not look at the world, I will look at the Word. Surely there is no prohibition against reading the Saints?"

  "Read them to pray, not to argue. Read Saint Jerome, who praised learned women, yes, but also read his warnings against vanity. The Bishop does not forbid you to read. He forbids you to teach. Your pen has become a tongue. Silence it."

  "If silence is the only virtue left to me, then I fear the convent has become a tomb before my death."

  "It is a womb. Die to the world, Juana, so you may live to Christ. Give us the papers."

  "Which papers?"

  "All of them. The response to Puebla. The comedies. The mathematics. Burn them."

  "And if I write that God gave me the pen?"

  "Then God will give you the strength to break it."
