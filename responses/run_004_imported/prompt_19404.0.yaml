answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of being [Bride's Name]'s friend since college.

  Standing up here, I'll admit I'm a little nervous. And that's not just because of the open bar. It's because I know the groom's academic background. [Groom's Name] wrote his master's thesis on the *philosophy of promising*.

  So, I know that every time I say "I promise to keep this short," I am entering a binding ethical contract that Hume and Kant would argue about for centuries. I know that if I bore you, I'm not just being a bad friend; I'm violating a categorical imperative.

  I actually tried to brush up on his thesis to prepare for this. I asked him about it once at dinner, thinking it would be a two-minute answer. Instead, I got two dinners and a lot of late-night Googling. But I did learn something fascinating that actually explains why [Bride] and [Groom] are so perfect for each other.

  See, in philosophy, there's a big debate about what makes a promise real. On one side, you have David Hume. Hume argued that a promise only binds you because society agrees to a shared practice. He said saying "I promise" is like moving a knight in chess. Outside the game, moving a horse-shaped piece of wood means nothing. It's the *rules of the game* that give the move power.

  On the other side, you have philosophers like T.M. Scanlon. They argue that the rules don't matter. What matters is *trust*. If I get you to rely on me, and then I let you down, I've hurt you. That wrong exists whether we're at a wedding or sitting on a couch in sweatpants.

  For the grad students in the back: Yes, I know I'm simplifying the Principle of Fidelity. Please put your beers down.

  But here is the thing about this couple. If you ask [Bride] and [Groom], they've been making promises to each other for years. Long before there was a proposal. They made unofficial promises about who would drive, who would cook, who would pretend to understand the other's work stress.

  According to Hume, those promises shouldn't count. There was no ceremony. No public rulebook. Just two people trusting each other.
  But according to Scanlon? Those promises were the *only* ones that mattered. Because they were already relying on each other. They were already keeping their word when no one was watching.

  And that brings us to today.

  Some people might think Saturday is the day the obligation starts. That until the officiant speaks, it's just dating. But looking at them, I think Saturday is something different.

  Saturday is the Humean move. It's the chess piece being placed on the board in front of witnesses. It's the social practice. It's the public declaration that says, "We are doing this thing that society recognizes."

  But the *reason* that move has power... the reason we are all here crying and smiling... is the Scanlonian part. It's the years of trust that came before it.

  If you have the ceremony without the trust, it's just a game. Empty rules.
  But if you have the trust without the ceremony, it's beautiful, but it lacks the weight of history and community behind it.

  [Bride] and [Groom], you have both. You have the deep, private reliance that says, "I will not hurt you," and you have the public, joyful practice that says, "The whole world is watching us keep that word."

  So, my wish for you is this: May your marriage always have the warmth of the Scanlonian trust—the quiet knowing that you have each other's backs when the lights are off. And may you always honor the Humean practice—the public vows, the anniversaries, the "I do's" that remind you that you are part of something bigger than just the two of you.

  [Groom], I promise to always support your friendship.
  [Bride], I promise to always be in your corner.
  And together, I promise that if you ever need a third player for chess, I know how the knight moves.

  Please raise your glasses. To the practice, to the principle, and to the happy couple.
