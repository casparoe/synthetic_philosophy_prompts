      *   *CDT Problem:* If I stay, Death predicted stay $\rightarrow$ I die. If I go, Death predicted go $\rightarrow$ I die. But CDT says: "Given I stay, what's the causal impact of going?" vs "Given I stay, what's the probability Death is in Damascus?"
      *   *Ratifiability:* Gibbard & Harper introduced *ratifiability*. An action is ratifiable if, conditional on deciding to do it, it maximizes expected utility. In Death in Damascus, neither action is ratifiable. If I decide to stay, I should believe Death is in Damascus, so I should go. If I decide to go, I should believe Death is in Aleppo, so I should stay.
