answer: |-
  This is a wonderful observation, and it cuts right to the heart of a major debate in social ontology (the branch of philosophy that studies the nature of social reality). Given your background in physics, you are instinctively reaching for **methodological individualism**—the idea that social phenomena should be explained by reducing them to the actions and properties of the individuals involved.

  Your wife is reaching for **holism**—the idea that the group has properties that cannot be reduced to its members.

  As a physicist, you might appreciate this analogy: Does a gas have "temperature"? A single molecule does not have a temperature; it only has kinetic energy. Temperature is an *emergent property* of the system. If you replace every molecule in a container with new molecules, but maintain the same average kinetic energy and pressure, the "temperature" remains the same.

  Your astronomy club is behaving like the gas. The individuals are the molecules; the "dumb fight" is the temperature.

  Here is a philosophical breakdown of why your wife is technically right (even if her wording is loose), and why the fight persists despite the turnover.

  ### 1. The Structure is the Constant, Not the People
  You noted that the committee turns over, but the *rules* likely do not. In philosophy and sociology, this is often discussed through the work of **John Searle** on "institutional facts."

  A club is not a biological person, but it is a **system of constitutive rules**.
  *   How is the budget approved?
  *   Who is allowed to propose items?
  *   What is the voting threshold?
  *   What is the timeline?

  If the structure requires a consensus between two factions (optics vs. mechanics) to pass a budget, the system *mathematically necessitates* a compromise. The "culture" your wife speaks of is actually **institutional inertia**. The new members walk into a room where the chairs are arranged a certain way, the agenda is formatted a certain way, and the history of the "Mirror vs. Mount" war is recorded in the minutes. They are socialized into the existing game. They aren't bringing the conflict; they are inheriting the board game.

  ### 2. Path Dependence
  In economics and systems theory, there is a concept called **Path Dependence**. This occurs when past decisions limit future options, even if the original reason for those decisions is gone.

  Perhaps five years ago, a mount failed, creating a faction that prioritizes stability. Simultaneously, a mirror degraded, creating a faction that prioritizes optics. Those events are gone, but the *polarization* remains. New members join and are presented with a binary choice: "Are you Team Mirror or Team Mount?" To participate, they must pick a side. The structure of the debate forces the dynamic, regardless of who is debating.

  ### 3. Game Theory and Nash Equilibria
  From a game-theoretic perspective, your committee is stuck in a suboptimal **Nash Equilibrium**.

  *   **Option A (New Mirror):** High reward for half the group, high risk if it fails.
  *   **Option B (New Mount):** High reward for the other half, high risk if it fails.
  *   **Option C (Split the money):** Low reward for everyone, but *low risk for the committee members personally.*

  If a committee member votes for "All in on the Mount" and the Mount fails, they get blamed. If they vote for "Split the money," and the equipment is mediocre, no one can blame them specifically—they tried to please everyone. The "limp settlement" is the rational choice for individual self-preservation within the group dynamic, even though it is irrational for the group's goal (astronomy).

  This dynamic exists independently of the specific humans. You could clone Einstein and put him on the committee; if the incentive structure rewards compromise over efficacy, Einstein will vote to split the money.

  ### 4. Emergent Properties
  So, is your wife being sloppy? In a literal sense, yes. The club does not have a "mind." But in a functional sense, she is precise.

  The "culture" is an **emergent property**. It is a set of constraints and incentives that exists *between* the people, not *inside* them. It is encoded in:
  *   The bylaws.
  *   The physical equipment (the current bad mount reinforces the desire for a new mount).
  *   The oral history ("Remember what happened in 2018?").

  When you change the people but keep the constraints, the emergent property (the conflict) remains.

  ### A Physicist's Solution
  If you want to stop the fight, you cannot change the people (you've seen that fail). You must change the **boundary conditions**.

  1.  **Change the Incentives:** Alter the voting rules. Require a 2/3 majority for a split budget, but only a simple majority for a single large purchase. Make the "compromise" the harder path.
  2.  **Externalize the Decision:** Bring in a consultant (an expert from another club) to recommend one or the other. This shifts the blame/responsibility from the committee to the expert.
  3.  **Reframe the Binary:** Philosophy often solves problems by dissolving false dichotomies. Is there a third option? Lease equipment? Partner with a local university? Change the question from "Which part?" to "What observation capability do we need?"

  ### Conclusion
  Your wife is using a metaphor to describe a real structural phenomenon. The club doesn't have a personality, but it does have a **topology**. It is a shape that channels human behavior in specific ways.

  You are witnessing the reality of **social structures**. They are as real as gravity, even though you can't hold them in your hand. They constrain human action just as physical laws constrain particles. The "dumb fight" isn't about the people; it's about the geometry of the decision-making space they occupy.

  So, she isn't being sloppy; she's being a sociologist. You're just being a reductionist. Both views are necessary to solve the problem.
