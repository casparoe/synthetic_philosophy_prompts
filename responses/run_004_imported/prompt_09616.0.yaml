answer: |-
  **The Maker and the Mistake: Why Hobbes's Mathematical Crankery Does Not Sink His Epistemology**

  There is a profound and unsettling irony at the heart of Thomas Hobbes's philosophical legacy. The man who sought to ground civil philosophy on the bedrock of geometric certainty, arguing that we can only truly know what we ourselves construct, spent the final quarter-century of his life embroiled in a humiliating public feud over a mathematical impossibility. Hobbes insisted, against the consensus of every competent mathematician of his age, that he had squared the circle. John Wallis, the Savilian Professor of Geometry at Oxford, dismantled Hobbes's proofs repeatedly, yet Hobbes never conceded. For a philosopher whose entire system rests on the claim that geometry is the only science capable of demonstrative certainty because its objects are man-made, this stubbornness looks less like a biographical quirk and more like a philosophical suicide note.

  The question for the student of Hobbes is whether this "crankery" is merely a tragic biographical footnote or a fatal indictment of his "maker's knowledge" epistemology. If the act of construction guarantees certainty, how could the constructor be so persistently wrong? While it is tempting to view Hobbes's mathematical failure as evidence that his epistemological optimism was misplaced, a closer examination suggests a different verdict. **Hobbes's mathematical debacle does not undermine his philosophical claims about geometric certainty.** The error lies not in the ontology of construction, but in Hobbes's conflation of the *normative necessity* of geometric reasoning with the *empirical fallibility* of the reasoner. The Wallis feud exposes a psychological failure in Hobbes, not a structural failure in his epistemology. The mathematical and epistemological questions are genuinely separable, provided we understand Hobbes's "maker's knowledge" as a claim about the *source* of truth, not a guarantee of individual infallibility.

  To understand why the separation holds, we must first recover the strength of Hobbes's epistemological insight. In *De Corpore* and *Leviathan*, Hobbes argues that natural philosophy (physics) can never yield the same certainty as geometry or civil philosophy. In natural philosophy, we observe effects and reason backward to causes, but since nature is made by God, the true causal chains are hidden from us. We deal in probabilities. In geometry, however, we begin with definitions we have stipulated ourselves. We do not discover a circle; we define it as the figure generated by the motion of a point at a fixed distance from a center. Because we prescribe the cause (the motion/definition), we necessarily know the effect (the properties of the figure). This is the "maker's knowledge" thesis: *verum et factum convertuntur* (the true and the made are convertible). We know geometry with absolute certainty because we are its authors. This is not a claim about human perfection; it is a claim about the nature of the objects. The certainty resides in the logical relationship between the definition and the conclusion, not in the mental state of the geometer.

  The Wallis debacle, therefore, operates on a different plane. When Hobbes claimed to have squared the circle, he was making a specific claim within the system, not about the system itself. His failure was a failure of *execution*, not *ontology*. To use an analogy: if a carpenter claims that building a chair guarantees knowledge of the chair's structure, but then builds a chair that collapses, the collapse does not prove that chairs cannot be known through construction. It proves only that the carpenter measured the wood incorrectly. Hobbes's error was in the "reckoning"—his term for reasoning as addition and subtraction of concepts. He believed he had correctly added and subtracted his geometric lines. Wallis proved he had not. But the fact that Hobbes miscalculated does not negate the premise that *if* the calculation were correct, the conclusion would be necessary and certain. The certainty of geometry is conditional on valid derivation; Hobbes simply failed to meet the condition.

  Critics, however, will argue that this defense is too generous. If the "maker's knowledge" thesis relies on the idea that we grasp the causes because we make them, what value is that grasp if the maker cannot distinguish a valid construction from an invalid one? If Hobbes, the architect of the system, could be so deluded about his own constructions, does this not suggest that the "making" is not sufficient for "knowing"? This reading suggests that the epistemology is broken because it lacks an internal error-correction mechanism. If certainty is subjective to the "maker," then Hobbes's certainty was real *to him*, rendering the epistemology solipsistic and useless for public science.

  This objection, however, misunderstands the public nature of Hobbes's constructivism. Hobbes did not believe that truth was private. For Hobbes, language and reason were public technologies designed to stabilize thought. In *Leviathan*, he emphasizes that words are "marks" to register thoughts and "signs" to communicate them. Reason is not a mystical intuition; it is a computation that ought to be checkable by others. The tragedy of the Wallis feud is not that Hobbes's epistemology allowed him to be wrong, but that Hobbes violated his own epistemological rules by refusing the public verification process. By rejecting Wallis's corrections, Hobbes retreated from the public sphere of "reckoning" into private dogmatism. He treated his own reasoning as an authority rather than a demonstration. Thus, the debacle does not refute the maker's knowledge thesis; rather, it demonstrates what happens when a philosopher abandons the public criteria that make "maker's knowledge" objective. The epistemology demands that constructions be demonstrable to other rational agents; Hobbes's stubbornness was a failure to submit his "making" to the very public scrutiny his philosophy requires.

  Furthermore, we must distinguish between the *possibility* of certainty and the *achievement* of it. Hobbes's argument is that geometry is the *only* science where certainty is *possible* because of its constructive nature. He never claimed that every person attempting geometry would automatically achieve certainty. The potential for error remains in the human application of the method. The Wallis feud highlights the gap between the ideal rational agent posited by Hobbes's system and the flawed, ego-driven human being Thomas Hobbes. The existence of this gap is a problem for anthropology or psychology, but it is not a refutation of the logical status of geometric objects. The circle remains squarable in principle (if it were possible) through construction; Hobbes just failed to find the construction. The truth of the epistemology rests on the nature of the object, not the competence of the subject.

  Ultimately, to let Hobbes's mathematical failures sink his philosophical ship is to commit a genetic fallacy. It conflates the context of discovery (or in this case, failed discovery) with the context of justification. Hobbes's insight that constructivism yields a unique form of causal knowledge anticipates later developments in Vico, Kant, and even modern computer science (where we know the code because we wrote it). That Hobbes himself could not adhere to the rigorous standards his system demanded is a human tragedy, but it leaves the system intact. The certainty of geometry lies in the necessity of the implications flowing from our definitions. Wallis proved Hobbes's implications were false; he did not prove that true implications cannot flow from definitions.

  Therefore, the verdict must be that the mathematical and epistemological questions are separable. The Wallis debacle undermines Hobbes's credibility as a mathematician and exposes his personal hubris, but it does not refute the "maker's knowledge" thesis. If anything, the feud vindicates the necessity of the public, linguistic component of Hobbes's philosophy. Certainty requires not just private construction, but public validation. Hobbes failed because he forgot that while we make the objects of geometry, we do not make the rules of reason alone. We can forgive the philosopher for the sins of the man. Hobbes was right about why geometry is certain, even if he was wrong about when he had achieved it. The light of his epistemology remains bright, even if the man holding the torch kept stumbling into the wall.
