prompt: |-
  I write historical fiction, and I recently sent a chapter to two friends who know more medieval political theory than I do. In it, a lord assassinates the duke he served, calls him a tyrant, and defends the killing afterward in a speech invoking Aquinas. My friends ended up arguing about whether the speech holds up, and I'd like a third opinion on their exchange, not just on who won.

  Mara said the speech misuses Aquinas: the duke inherited his title lawfully and turned tyrannical only in how he ruled, and Aquinas restricts killing such a ruler to the community acting through its proper public authority, not to any private person's own judgment, however wronged.

  Dev objected that the lord isn't "any private person": he is one of the few peers whose consent the duchy's charter requires for new taxes, so he belongs to the institution that traditionally checks the duke.

  Mara replied that Aquinas's worry is precisely that people judge badly in their own cause, and letting one councilor's rank substitute for a collective act is exactly what he warns against — it's how usurpation gets relabeled liberation.

  Dev came back that this makes the doctrine self-defeating here: the duke stopped summoning the council years ago and had two of its members quietly killed, so no body capable of "public authority" still exists. If resistance is only licensed through institutions a thorough tyrant can dissolve, doesn't the doctrine guarantee that the most ruthless tyrants are the safest?

  Could you go through the exchange move by move, saying who has the stronger reading of Aquinas at each step, and close with what, if anything, both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** The user writes historical fiction. A chapter involves a lord assassinating a duke, calling him a tyrant, and justifying it via Aquinas.
      *   **The Conflict:** Two friends (Mara and Dev) are arguing about the historical/theological accuracy of this justification.
      *   **The Task:** Evaluate their exchange move-by-move, determine who has the stronger reading of Aquinas at each step, and identify what both might be missing (synthesis/nuance).
      *   **Goal:** Provide a "third opinion" that helps the author understand the nuance for their fiction, not just declare a winner.

  2.  **Deconstruct the Arguments:**

      *   **The Scenario:** Lord kills Duke. Duke inherited lawfully but ruled tyrannically. Lord justifies via Aquinas.
      *   **Mara's Position (Strict Constructionist):**
          *   *Point 1:* Aquinas restricts tyrannicide to "public authority," not private individuals.
          *   *Point 2:* Even a high-ranking lord is a "private person" in this context if acting alone.
          *   *Point 3:* Allowing individual judgment leads to usurpation disguised as liberation (subjective bias).
      *   **Dev's Position (Contextual/Institutionalist):**
          *   *Point 1:* The Lord isn't a private person; he's a peer with institutional check-and-balance power (tax consent).
          *   *Point 2:* The Duke dissolved the checking institution (council), making collective action impossible.
          *   *Point 3:* If Aquinas requires an institution the tyrant destroyed, the doctrine protects the worst tyrants (self-defeating).

  3.  **Consult Aquinas (Mental Knowledge Retrieval & Verification):**
      *   *Key Text:* *De Regno* (On Kingship) and *Summa Theologiae* (II-II, q. 42, a. 2; q. 64, a. 3).
      *   *Core Doctrine:* Aquinas generally opposes sedition and tyrannicide by private individuals. He argues that if a tyranny is excessive, there *may* be a remedy, but it must not be initiated by private presumption. It should be by public authority.
      *   *Nuance:* In *De Regno*, he suggests that if a king is elected by the people, the people (or their representatives) can depose him. If appointed by a superior (like the Emperor), the superior must act.
      *   *The "Private Person" Issue:* Aquinas is very clear that a private person taking it upon themselves to kill a ruler is sinful (sedition), even if the ruler is bad, because it endangers the common good (order) more than the tyrant does.
      *   *The "Public Authority" Issue:* Who constitutes public authority? Is it a formal sitting body, or the *concept* of the community's welfare represented by its leaders?
      *   *Later Scholastics (Suárez, Vitoria, etc.):* They expanded on this, allowing for more resistance theory, but the prompt specifies *Aquinas*. I need to stick primarily to Thomas, though acknowledging the development of the tradition might be part of "what they are missing."

  4.  **Evaluate Move-by-Move:**

      *   **Move 1: Mara's Opening (Private vs. Public).**
          *   *Claim:* Aquinas restricts killing to public authority, not private judgment.
          *   *Assessment:* Strong. This is the bedrock of Aquinas's political thought in *De Regno* and the *Summa*. He explicitly warns against private assassination.
          *   *Winner:* Mara.

      *   **Move 2: Dev's Counter (The Lord as Institution).**
          *   *Claim:* The Lord is part of the checking institution (peer/charter), not a private person.
          *   *Assessment:* Plausible but risky. Aquinas distinguishes between a *person* and an *office*. If the Lord acts *as* the council, maybe. If he acts alone *because* he is a lord, it's shaky. Aquinas cares about the *act* representing the community, not just the rank of the actor.
          *   *Winner:* Dev has a point, but Mara's underlying principle is stronger. Let's call it a partial point for Dev, but Mara's principle holds. Actually, looking closer: Aquinas does allow for "public authority." If the Lord is a magistrate *with jurisdiction*, he might qualify. But assassination usually implies covert/private action. If he kills him *as* a judge, that's different than assassination. The prompt says "assassinates." That leans Mara.
          *   *Refinement:* Dev is trying to stretch "public authority" to include a single magnate. Aquinas usually implies a collective or a superior. Dev is weaker here on strict Aquinas, but stronger on feudal reality.

      *   **Move 3: Mara's Rebuttal (Subjective Judgment/Usurpation).**
          *   *Claim:* Aquinas worries about subjective bias. One councilor $\neq$ collective act.
          *   *Assessment:* Very Strong. This captures the *spirit* of Aquinas's fear of sedition. The danger of disorder is greater than the danger of the tyrant.
          *   *Winner:* Mara.

      *   **Move 4: Dev's Final Salvo (The Impossible Condition).**
          *   *Claim:* Tyrant dissolved the body. Requiring a body that doesn't exist makes resistance impossible.
          *   *Assessment:* This is the strongest philosophical objection to Aquinas (the "tyranny trap"). However, does Aquinas address this? In *De Regno*, he suggests appealing to a superior (Emperor/Pope). If no superior exists, he actually leans toward enduring the tyranny rather than risking greater chaos. This is uncomfortable for modern readers but historically accurate to Thomas.
          *   *Winner:* Dev identifies a logical flaw, but Mara is likely more accurate to what Aquinas *actually wrote* (Aquinas would probably say "endure it" or "pray"). However, later Scholastics (Salamanca school) fixed this. Since the prompt is about *Aquinas*, Dev is logically right but textually wrong about Thomas's strictness. Mara is textually right.

  5.  **Synthesize "What They Are Missing":**
      *   **Historical Context:** Aquinas wasn't writing a handbook for feudal succession crises. He was writing about universal monarchy and the metaphysics of law.
      *   **The "Superior" Option:** Aquinas often suggests appealing to a higher authority (King, Emperor, Pope). Did the Lord try that?
      *   **Later Development:** The doctrine of tyrannicide evolved *because* of this problem. By the 16th century (Jesuits), the argument Dev makes is accepted. In the 13th century (Thomas), Mara is closer to the text.
      *   **The Nature of the Act:** "Assassination" vs. "Execution." Aquinas might allow a public declaration of deposition followed by execution, but not stealth killing.
      *   **Fictional Utility:** The ambiguity is *good* for fiction. It creates conflict.

  6.  **Drafting the Response:**
      *   *Tone:* Scholarly but accessible, respectful of the fiction context.
      *   *Structure:*
          1.  Introduction (acknowledge the quality of the debate).
          2.  Move-by-Move Analysis (Mara vs. Dev).
          3.  The Verdict (Who is closer to the text).
          4.  The Synthesis (What's missing/Historical Nuance).
          5.  Advice for the Fiction (How to use this).

      *(Self-Correction during drafting)*: I need to be careful not to conflate Aquinas with John of Salisbury (who was more pro-tyrannicide) or the later Monarchomachs. Stick to Thomas.
      *Key Text Reference:* *De Regno* (On Kingship), Book I, Chapter 6. Also *Summa Theologiae* II-II, Q. 42, Art. 2 (Sedition).
      *Crucial Distinction:* Aquinas distinguishes between a usurper (who has no title) and a legitimate ruler who becomes tyrannical. The prompt says the Duke "inherited his title lawfully." This is vital. Aquinas is much stricter on lawful rulers who turn bad than on usurpers. Mara catches this. Dev tries to bypass it via institutional role.

      *Re-evaluating Dev's "Institution" argument:* If the Lord is a *magistrate* with the power of judgment, Aquinas might allow it. But "assassination" implies private violence. If the Lord gathered the peers and *declared* the Duke deposed, then killed him in battle or execution, that's different. The prompt says "assassinates... and defends... in a speech." This sounds like a post-facto justification of a solo act. Mara wins on the "assassination" detail.

      *Re-evaluating Dev's "Impossible Condition":* This is the "resistance theory" problem. Aquinas is indeed conservative here. He prefers order. Dev is logically sound but historically anachronistic regarding Aquinas's specific willingness to sanction resistance.

      *What they miss:* The role of the Church/Pope. In medieval theory, the Pope could depose a tyrant. Also, the distinction between *declaratory* resistance (community speaks) vs. *executive* resistance (individual acts).

  7.  **Final Polish:** Ensure the advice helps the writer. The ambiguity *is* the story. Don't solve it for them; explain why the argument exists.

      *(Final check on Aquinas's specific wording)*: In *De Regno*, I.6: "To proceed against the cruelty of tyrants is an act to be undertaken, not through the private presumption of a few, but by public authority." He explicitly warns that killing a tyrant privately might lead to worse tyrants. He suggests that if there is a superior, appeal to them. If not, look to God. He does *not* explicitly solve the "dissolved institution" problem in a way that licenses individual violence. Mara is safer on the text. Dev is safer on political logic.

      Okay, ready to write.

      *Structure:*
      1. Intro: Praise the friends' debate (it's a real scholarly debate).
      2. Round 1 (Private vs. Public): Mara wins on text.
      3. Round 2 (Rank vs. Role): Mara wins on "assassination" nuance.
      4. Round 3 (Bias/Usurpation): Mara wins on Aquinas's core fear.
      5. Round 4 (The Trap): Dev wins on logic, Mara wins on textual fidelity.
      6. Synthesis: What's missing (Superiors, Church, Later Scholastics).
      7. Fiction Advice: Keep the ambiguity.

      *Wait, one nuance:* Dev's point about the Lord being part of the "public authority" isn't entirely wrong *if* the Lord is acting as a judge. But assassination is rarely a judicial act. I will emphasize the *mode* of killing.

      *Let's refine the "Who wins":* It's not about winning, but fidelity. Mara is more faithful to Aquinas's *text*. Dev is more faithful to the *political reality* that later theorists used to stretch Aquinas. I should make that distinction clear.

      *Okay, plan set.*
answer: |-
  This is an exceptional debate between your friends. They have inadvertently recreated a argument that has occupied political theologians for seven hundred years. Mara is arguing from a **textualist/conservative** reading of Aquinas, while Dev is arguing from a **functionalist/resistance** reading that anticipates later Scholastic developments (like those of the Salamanca school in the 16th century).

  Here is a breakdown of their exchange move-by-move, evaluating who holds the stronger ground regarding Thomas Aquinas specifically, followed by the crucial context both are missing.

  ### Move 1: The Private Person vs. Public Authority
  *   **Mara:** Aquinas restricts killing a tyrant to "public authority," not private judgment.
  *   **Dev:** The Lord is not a private person; he is a peer with institutional power (tax consent).
  *   **Verdict:** **Mara has the stronger textual reading.**

  **Why:** In *De Regno* (On Kingship) and the *Summa Theologiae* (II-II, q. 42, a. 2), Aquinas is explicit: proceeding against a tyrant is not to be undertaken by "private presumption." He distinguishes sharply between a usurper (who has no title and may be killed by anyone) and a legitimate ruler who becomes tyrannical (who inherited lawfully). Since your Duke inherited lawfully, Aquinas places him in the second category.

  While Dev is right that the Lord holds an office, Aquinas generally views "public authority" in this context as a collective body or a superior magistrate acting *in judgment*, not a vassal acting in violence. If the Lord assassinated the Duke (implying stealth or solo violence) rather than deposing him via a tribunal, Mara is correct: Aquinas classifies this as sedition, even if the cause is just.

  ### Move 2: Rank vs. Collective Act
  *   **Mara:** One councilor's rank does not equal a collective act; this invites usurpation.
  *   **Dev:** (Implicitly) The Lord's rank embodies the check-and-balance.
  *   **Verdict:** **Mara wins on Aquinas's intent.**

  **Why:** Aquinas's primary political fear is not tyranny, but *disorder*. He argues that if individuals take it upon themselves to kill rulers, even bad ones, the result is often greater instability ("many tyrants arise from the killing of one"). He worries precisely about what Mara describes: a powerful noble using "tyranny" as a pretext to seize power. For Aquinas, the *procedure* matters as much as the *outcome*. A single peer acting alone, regardless of rank, lacks the "public" character required to legitimize the violence without risking civil war.

  ### Move 3: The "Impossible Condition" (The Tyranny Trap)
  *   **Dev:** The Duke dissolved the council. Requiring a body that no longer exists makes resistance impossible and protects ruthless tyrants.
  *   **Mara:** (Implicitly) The doctrine stands regardless of the difficulty.
  *   **Verdict:** **Dev wins on logic; Mara wins on textual fidelity.**

  **Why:** This is the crux of the problem. Dev has identified the famous "resistance paradox" in medieval thought. Logically, he is correct: if a tyrant destroys the very mechanisms needed to judge him legally, a strict reading of Aquinas leaves the community helpless.

  However, historically, **Mara is closer to what Aquinas actually wrote.** Aquinas is remarkably conservative here. In *De Regno*, when faced with a situation where there is no human remedy for a tyrant, he suggests appealing to a *higher* human authority (like an Emperor or the Pope). If there is no superior (which fits your Duchy scenario), he essentially advises endurance and prayer, arguing that God may remove the tyrant in His own time. Aquinas would likely agree with Dev that the situation is tragic, but he would not license the assassination to fix it. He prioritizes the spiritual safety of the community (avoiding sin/sedition) over the political removal of the tyrant.

  ### What Both Are Missing

  To flesh out your fiction, you need to know where their debate hits the limits of historical reality. There are three nuances neither friend fully addressed.

  **1. The "Superior" Loophole**
  Aquinas consistently suggests that if a ruler is tyrannical, the remedy lies with whoever *appointed* him. If the Duke is vassal to a King or Emperor, that superior must act. If the Duke is sovereign, the appeal goes to the Pope (as the vicar of Christ).
  *   **For your story:** Did the Lord appeal to a King or Pope first? If he skipped this step, Aquinas is definitely against him. If he appealed and was ignored, Dev's argument becomes much stronger.

  **2. Execution vs. Assassination**
  Aquinas distinguishes between *killing* and *judging*. If the Lord had gathered the remaining peers, declared the Duke deposed (stripping him of "public" status), and *then* killed him as a public enemy, Aquinas might be more ambivalent. The word "assassinate" implies treachery or private violence.
  *   **For your story:** If the speech frames the killing as a *judicial execution* by the remaining peers (even if only a few were present), it aligns better with "public authority" than if it is framed as a solo act of vengeance.

  **3. The Evolution of the Doctrine**
  Your friends are arguing as if "Aquinas" is a monolith. In the 13th century (Aquinas's time), Mara is right. By the 16th century (Suárez, Vitoria, Mariana), Dev is right. The later Scholastics explicitly solved Dev's "Impossible Condition" by arguing that when a tyrant dissolves the institutions, authority reverts to the community (or its representatives), allowing them to act even without a formal sitting council.
  *   **For your story:** If your setting is 13th century, Mara is historically more accurate. If it is 15th or 16th century, Dev's reading is plausible because that's how the theory had evolved.

  ### Recommendation for the Fiction

  Do not resolve this debate in the text. The tension is where the drama lives.

  *   **Mara represents the Church/Orthodox view:** Order is sacred; breaking it damns the soul and risks anarchy.
  *   **Dev represents the Pragmatic/Feudal view:** Law must serve justice; if law is weaponized to protect evil, the spirit of the law must override the letter.

  **The Verdict:** If you need historical accuracy for a 13th-century setting, **Mara is right.** Aquinas does not license private assassination of a lawful ruler, even a tyrannical one, especially if institutional remedies haven't been exhausted. However, **Dev is right about the human reality.** Your Lord knows that waiting for "public authority" means death for everyone.

  The tragedy of your character is that he must sin (according to Aquinas) to save his people. He is invoking Aquinas not because the theology perfectly fits, but because it is the only language of justification available to him. He is stretching the doctrine to cover a necessity the doctrine refuses to acknowledge. That makes for a compelling, morally complex protagonist.
