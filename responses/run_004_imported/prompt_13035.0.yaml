answer: |-
  You have stumbled, perhaps unwittingly, into one of the oldest and stickiest problems in metaphysics. You are asking about **persistence conditions** and **material constitution**.

  The short answer is: There is no settled answer because "object identity" is not a physical property like mass or charge. It is a conceptual framework humans overlay onto physical reality to make sense of the world. Your mother and your brother are operating under two different, mutually incompatible frameworks for what constitutes "the same object."

  Since you write about science and ideas, I'm going to skip the family mediation advice and give you the ontological machinery underneath this argument. This is why you see this pattern in restored violins, rebuilt houses, and melted watches.

  ### 1. The Conflict of Sortals
  In philosophy of language and metaphysics, a **sortal** is a term that doesn't just describe a thing, but defines the *kind* of thing it is, which in turn dictates the rules for its existence over time.

  *   **Your Brother's Sortal:** *Gold.*
      The persistence conditions for a lump of gold are loose. If you melt a gold coin into a gold bar, it is still the same *gold*. The identity is tied to the **matter**. As long as the atoms are largely conserved (minus the jeweler's dust), the substance persists. He is technically correct regarding the conservation of mass.
  *   **Your Mom's Sortal:** *Pocket Watch (Heirloom).*
      The persistence conditions for an artifact are strict. A watch is defined by its **form** (case, movement, shape) and its **function** (telling time). More importantly, as an *heirloom*, its identity is tied to its **history** and **provenance**.

  When your brother melted the watch, he satisfied the persistence conditions for *gold*, but he violated the persistence conditions for *watch*. You cannot melt a watch and still have a watch, any more than you can shred a novel and still have a story. The matter remains, but the object does not.

  ### 2. Hylomorphism: Matter vs. Form
  This debate is literally 2,400 years old. Aristotle called it **Hylomorphism**. He argued that physical substances are compounds of *hyle* (matter) and *morphe* (form).

  *   **The Brother** argues that the *essence* of the object was the gold (*hyle*).
  *   **The Mother** argues that the *essence* of the object was the specific arrangement and history (*morphe*).

  In the context of heirlooms, the "form" isn't just the shape; it's the specific causal chain. That watch was *Grandad's*. It sat in *his* pocket. It stopped ticking when *he* died. That specific causal history is baked into the object's identity. By melting it, your brother severed the causal chain. The gold in the locket has a new history starting from the jeweler's mold.

  ### 3. Social Ontology: The "Status Function"
  This is where it gets really relevant to your "heirloom" point. Philosophers like John Searle talk about **social ontology**. Some objects exist only because we collectively agree they exist.

  A "heirloom" is not a physical category; it is a **status function**. It is a status assigned to an object by a community (the family) based on collective intentionality.
  *   **The Rule:** "This object counts as a connection to our ancestor."
  *   **The Condition:** The object must maintain a recognizable continuity with the ancestor.

  When your brother melted the watch, he didn't just change the physics; he unilaterally revoked a social status. He treated the watch as a commodity (value = weight of gold) when the family treated it as a sacred artifact (value = symbolic connection).

  The disagreement feels unresolvable because they are arguing across categories. Your mom is arguing about **meaning**, and your brother is arguing about **material**. Neither can "win" because they aren't playing the same game.

  ### 4. Why There Is No "Settled Answer"
  You asked why it's possible that there is no right answer even when all physical facts are in.

  **Because identity is a human tool, not a law of nature.**

  In physics, particles are fungible. One electron is identical to another. But in human experience, objects are **non-fungible**. The Mona Lisa is not worth $1 billion because of the chemical composition of the paint (which is cheap); it is worth that much because of its specific history and origin.

  If you perfectly cloned the Mona Lisa atom-for-atom, physics would say they are identical. Art history (and the market) would say the clone is worthless. Why? Because "being the Mona Lisa" is not a physical property. It is a historical trajectory.

  Your brother is treating the watch like an electron (fungible matter). Your mom is treating it like the Mona Lisa (unique historical trajectory). Since the universe doesn't care which one is "true," there is no scientific fact that can settle it.

  ### 5. Why You See This Everywhere
  You mentioned restored instruments and rebuilt houses. This is the **Ship of Theseus** paradox, but with a twist.
  *   **Ship of Theseus:** If you replace every plank, is it the same ship? (Questions *gradual* replacement).
  *   **The Watch:** If you melt it down, is it the same watch? (Questions *radical* reconstitution).

  **Restored Violins:**
  A Stradivarius that is restored is still a Stradivarius *if* the original wood and varnish remain the core. If you build a new violin using the varnish from a Stradivarius, it is not a Stradivarius. The "form" (the craftsmanship) matters more than the "matter" (the varnish).

  **Rebuilt Houses:**
  If a house burns down and you rebuild it with the same bricks, is it the same house? Usually, yes. If you rebuild it with new bricks in the same spot, it's often still considered the "family home." But if you move the bricks to a new location, it becomes a "relocation."
  Here, **location** becomes the dominant persistence condition, overriding the matter.

  ### The Verdict for Your Family Chat
  Since you're the one who overthinks things for a living, here is how you frame this to them to stop the argument (or at least elevate it):

  Tell them they are both right, but they are measuring different things.
  *   **Brother:** You are right about the **Substance**. The value of the material was preserved and repurposed for love (your daughter). That is a valid way to honor a legacy (life goes on).
  *   **Mom:** You are right about the **Artifact**. The specific vessel of memory was destroyed. The continuity was broken. That grief is valid because the "heirloom status" was revoked.

  The friction isn't about the gold. It's about whether we honor ancestors by **preserving their things** (Mom) or by **repurposing their resources for the living** (Brother).

  There is no settled answer because both are valid moral strategies for dealing with mortality. The watch is dead either way; the only question is whether the gold should be a monument to the past or an investment in the future.

  (And for the record, as a science writer: tell your brother the jeweler's dust is technically a violation of conservation of mass if it left the system, but legally, that's negligible. Metaphysically, it's the straw that broke the camel's back.)
