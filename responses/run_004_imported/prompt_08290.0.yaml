      *   *Decision Theory:* Relies heavily on EDT (your action is *evidence* of their action) rather than CDT (your action doesn't *cause* their action).
      *   *Critiques:*
          *   *CDT Objection:* My choice doesn't change their choice. Why cooperate?
          *   *Reference Class Problem:* Who counts as "similar enough" to be correlated?
          *   *Cosmological Dependence:* Requires a large/infinite universe.
          *   *Moral Philosophy:* Is this just act utilitarianism or Kantianism with extra steps?
          *   *Fanaticism:* Does it demand too much sacrifice for speculative gains?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: EDT vs. CDT.*
