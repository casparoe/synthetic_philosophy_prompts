  - the anti-natalist overreach worry: if you buy a Benatar-style asymmetry between suffering and pleasure, it looks like literally every act of procreation is seriously wrong no matter how good the kids life turns out, which most people take as a reductio
  - the arbitrary-threshold problem: once you go lexical/threshold-y to dodge torture-vs-dust-specks-style aggregation, any specific place you draw the "this suffering can't be outweighed" line looks totally made up
