answer: |-
  You have hit on one of the most famous and contentious moves in the entire *Treatise*. Your intuition is spot on: there is a massive gap between "my imagination has limited resolution" and "space is metaphysically atomic." Most commentators agree that if you read this passage with modern modal logic in mind, Hume is committing a category error (conflating epistemic limits with metaphysical constraints).

  However, to understand whether it's "sleight of hand" or a coherent (if radical) philosophical move, we have to look at the specific machinery Hume is using. He isn't just invoking a generic conceivability principle; he is invoking it *in conjunction with his Copy Principle and his theory of Meaning.*

  Here is an untangling of the inference, the specific "sleight of hand," and how it compares to the contemporary debate.

  ### 1. The Structure of the Inference
  Let's formalize the argument in paragraphs 7–9 to see exactly where the work is being done.

  1.  **The Maxim (CEP):** Whatever is clearly conceived is possible; whatever is inconceivable is impossible.
  2.  **Empirical Premise:** We have an idea of extension (proven by the fact that we talk about it).
  3.  **Psychological Premise:** The idea of extension, *as it exists in the imagination*, is not infinitely divisible. It terminates in indivisible parts (minimum sensibles).
      *   *Reason:* An infinite number of parts exceeds the "comprehension of our limited capacities."
  4.  **Inference A:** Therefore, the idea of infinite divisibility is inconceivable (we cannot form it).
  5.  **Inference B:** Therefore, infinite divisibility is impossible (via The Maxim).
  6.  **Conclusion:** Extension must really consist of indivisible points.

  **Your Objection:** You are objecting to the move from **Premise 3** to **Inference A/B**. You are asking: *Why does the limit of my imaging capacity dictate the limit of spatial reality?*

  ### 2. Is it Sleight of Hand?
  By modern standards: **Yes.** By Hume's internal standards: **No, it's a feature.**

  Hume is operating under a radical **Empiricist Theory of Meaning**. For Hume, an idea *just is* a mental particular derived from an impression. There is no abstract realm of concepts that exists independently of our psychological ability to entertain them.

  *   **The Modern View:** I can conceive of a "chiliagon" (1000-sided polygon) even if I can't distinctly picture it. My *concept* is clear, even if my *image* is blurry.
  *   **Hume's View:** If you can't picture it distinctly, you don't actually have the idea. You just have a word.

  When Hume says infinite divisibility "exceeds the comprehension of our limited capacities," he isn't saying "it's hard for me to think about." He is arguing that to have an idea of an infinitely divisible line, your mind would have to actually contain an infinite number of sub-ideas. Since a finite mind cannot contain an actual infinity of ideas, the *idea itself* is impossible to form.

  If you cannot form the idea, the term "infinite divisibility" is, for Hume, literally meaningless noise (scholastick quibbles). If it's meaningless, it can't describe a possibility.

  So, the "sleight of hand" is Hume's collapse of **Conceptual Possibility** into **Psychological Constructibility**. He is entitled to the inference *only if* you accept his Copy Principle and his claim that ideas are image-like particulars rather than abstract functions.

  ### 3. Hume vs. Contemporary Conceivability (Chalmers/Yablo)
  You asked if this is the same move as contemporary metaphysicians like Chalmers. The answer is **no**, and that difference explains why "gunk" is acceptable now but wasn't for Hume.

  **Hume's CEP (Psychological):**
  *   **Basis:** The actual capacities of the human imagination.
  *   **Constraint:** If I cannot construct a mental image/model of $X$ using simple ideas derived from sense impressions, $X$ is impossible.
  *   **Result:** Infinite divisibility is impossible because I cannot stack an infinite number of mental pixels.

  **Chalmers' CEP (Rationalist/Ideal):**
  *   **Basis:** Ideal rational reflection (a priori coherence).
  *   **Constraint:** If a proposition $S$ is not ruled out by a priori reasoning (logic/math/meaning), it is primarily conceivable.
  *   **Result:** "Gunk" (infinitely divisible stuff) is conceivable because there is no *logical contradiction* in the definition of gunk, even if I can't picture it.

  Chalmers distinguishes between *imaginability* (can I picture it?) and *conceivability* (can I coherently describe it?). Hume does not make this distinction. For Hume, if you can't picture it (or construct it from impressions), you aren't conceiving it at all; you're just uttering sounds.

  This is why contemporary metaphysicians are comfortable with gunk. They treat possibility as a matter of **logical consistency**, whereas Hume treats possibility as a matter of **empirical constructibility**.

  ### 4. Why the Argument Fails (Even for Hume)
  Even within the *Treatise*, this argument is notoriously weak, and Hume arguably knows it.
  1.  **The Mathematical Objection:** Mathematicians argue that infinite divisibility doesn't require an *actual* infinity of parts in the mind, but a *potential* infinity (a rule for division). Hume dismisses this as "scholastick," but he doesn't really refute the distinction between potential and actual infinity here.
  2.  **The "Adequacy" Problem:** Later in the *Treatise* (and in the *Enquiry*), Hume softens this stance. He realizes that we can have ideas of things we can't strictly "image" (like complex geometrical relations).
  3.  **Kant's Critique:** Kant later argues that space is a form of intuition, not a collection of atomic data points. He would argue Hume is confusing the *content* of experience with the *form* that makes experience possible.

  ### 5. Summary for Your Seminar
  To answer your specific questions directly:

  *   **Is he entitled to treat "I can't form an idea of X" the same as "X is impossible"?**
      *   **Internally:** Yes, because Hume defines "possibility" as "conceivability" and "conceivability" as "constructibility from impressions."
      *   **Externally:** No, because this conflates epistemic limits with metaphysical limits.
  *   **Is there sleight of hand between para 8 and 9?**
      *   Yes. He slides from "The idea *as conceived by the imagination*... is not infinitely divisible" (a claim about the *vehicle* of thought) to "consequently 'tis possible for extension really to exist conformable to it" (a claim about the *object* of thought). He assumes the structure of the idea must match the structure of the object (Isomorphism), which is a huge assumption.
  *   **Does contemporary "gunk" undercut him?**
      *   Yes. If you accept the Chalmers/Yablo distinction between *imaginability* and *conceivability*, Hume's argument collapses. We can conceive of gunk (it involves no contradiction) even if we cannot imagine it (we can't visualize infinite resolution). Since Hume denies this distinction, his argument only works if you are a strict empiricist about ideas.

  **Recommendation for discussion:**
  Point out to your professor that Hume's argument here relies on the **Copy Principle** (ideas are copies of impressions) doing heavy lifting that isn't explicitly restated in these paragraphs. Without the claim that "all ideas are faint copies of sensory impressions which have minimum resolution," the move from "my imagination stops" to "space stops" is unjustified. The argument isn't just about the Conceivability Maxim; it's about the *empirical nature of the ideas* being conceived.

  This shows you've read the text closely enough to see that the "Maxim" is doing work alongside Hume's specific psychology of perception.
