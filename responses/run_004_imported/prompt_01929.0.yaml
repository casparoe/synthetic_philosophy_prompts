answer: |-
  The control room of the hydroelectric station hummed with a low-frequency vibration that Elena felt in her teeth more than she heard. It was a physical fact, a pressure wave moving through the air, through her jacket, into her bone. She sat before the console, her hands resting on the cold steel of the manual override levers. Her job was nominal, a legal requirement: a human presence to intervene if the automated systems failed. But the systems never failed. They were causally closed loops of sensors, hydraulics, and logic gates. If the water pressure spiked, the valve opened. Physical cause, physical effect.

  One Tuesday, during a routine surge, the alarm light flashed amber. Elena watched her right hand lift from the desk. She felt the familiar interior spike of urgency—the thought *I must pull the lever*—but she noticed something she hadn't before. The sensation of urgency arrived a fraction of a second after her muscles had already tensed.

  She froze, her hand hovering over the lever. The light stopped flashing. The system had corrected itself.

  Elena lowered her hand. She stared at her palm. The standard view was that her decision caused the movement. Her desire to protect the turbine manifested as neural activity, which manifested as muscle contraction. But the timing suggested otherwise. The light hit her retina, triggered a cascade of electrochemical signals, and her arm moved. The chain was complete. Every link was physical. The pressure wave, the photon, the neuron, the fiber.

  If the physical chain was sufficient to produce the movement, what work was left for the "decision" to do?

  She thought of the concept of overdetermination. If a building collapses because a bomb explodes and simultaneously a meteor strikes it, it has two sufficient causes. But her life wasn't like that. Her actions weren't systematically struck by meteors. There was only the physical chain. If the neurons fired, the arm moved. If the neurons didn't fire, the arm stayed still. The "decision" merely tracked the neurons. It supervened on them. It couldn't exist without them, and it couldn't change them without violating the physical closure of the system.

  That evening, Elena made dinner. She chopped onions. The knife moved through the air. She told herself she was choosing to chop them for her husband, Mark. But watching her hand, she saw the same closed loop. Visual input of the onion, memory of the recipe, motor cortex firing. The physical state of her brain at time *t* determined the physical state of her brain at *t+1*. Her feeling of "wanting to cook" was just a shadow cast by the machinery. It had no mass. It could not push the knife.

  Mark came home. "Smells good," he said.

  "Thanks," she replied.

  She watched her mouth move. Sound waves formed. Mark's ears received them. His brain processed the syntax. Where was *she* in this exchange? If her vocal cords vibrated due to air pressure and muscle tension, and those tensions were determined by prior physical states, then her "intent to speak" was excluded. It was like the shadow of a bird flying over a clock face. The shadow moves across the numbers, but it does not turn the gears.

  "Are you okay?" Mark asked. "You look distant."

  "I'm thinking," she said. But even that was a physical event. The thought was realized by the firing.

  She began to test it. She decided to lift her coffee cup. She focused on the command. *Lift.* The cup rose. But she knew the physics. The command wasn't a ghostly push; it was the feeling of the push itself. The physical cause was sufficient. If she claimed her mental decision *also* caused the lift, she was claiming systematic overdetermination. She was claiming that every time she moved, two things caused it: the neurons and the thought. But the thought wasn't separate. It depended entirely on the neurons. If the neurons fired, the thought occurred. If the thought occurred, the neurons had fired. They weren't two causes; one was the shadow of the other. And shadows don't lift cups.

  The exclusion was absolute. The physical domain was a sealed room. Nothing got in, nothing got out without a physical key. Her mental life—her deliberation, her worry, her love—was inside the room, but it wasn't holding the key. It was painted on the wall.

  At work the next day, the surge returned. The amber light flashed. The hydraulic pressure spiked. The automated system began to engage the valve. Elena's hand twitched toward the manual override.

  She stopped it. She held her hand down on the desk.

  She waited. The system corrected the pressure. The turbine hummed steady. Her hand had not moved. The physical cause—the sensor reading—had been sufficient to engage the automated valve. Her manual lever was redundant. But more than that, *she* was redundant.

  If she had pulled the lever, it would have been because her neurons fired. If her neurons fired, the physical cause was present. If the physical cause was present, the effect was guaranteed. Her "choice" to pull or not pull was just the internal reading of the physical state. She couldn't intervene from the outside because there was no outside. There was only the physical chain.

  She realized then why the argument felt like a suffocation. It wasn't that she was a robot. Robots are built. She was grown. But the biology was just chemistry. The chemistry was just physics. The closure was total.

  Mark called her phone. She let it ring. She watched the screen light up. She felt the impulse to answer. She recognized the impulse as a physical state, a pattern of electricity. She knew that if she answered, it would be because the electricity flowed to her arm. If she didn't, it would be because it didn't. Her "wanting" to hear his voice was not a force. It was a description of the flow.

  She didn't answer. The phone stopped ringing. The physical state changed. The silence settled.

  Elena looked at her hands. They were resting on the steel. They were part of the machine now, not because she was cold or unfeeling, but because the feeling didn't change the mechanics. The grief she felt at this realization was itself just a pattern of firing. It couldn't stop the firing. It couldn't accelerate it. It was excluded from the causal chain, even as it rode on top of it.

  She understood the exclusion argument not as a theory, but as a geography. She was living in the gap between the physical cause and the physical effect, a gap that didn't exist. The bridge was solid steel. There was no room for a ghost to walk across.

  The alarm light flashed again. Green this time. System nominal.

  Elena stood up. She walked to the window to look at the river below. The water rushed over the spillway, heavy and inevitable. It moved because of gravity, because of the volume, because of the concrete channel. It did not move because it wanted to reach the sea.

  She placed her hand on the glass. Her palm left a faint smear of oil. A physical mark caused by physical pressure. She thought about wiping it away. She knew the thought would not wipe it. Only the movement would. And the movement would happen only if the physics allowed it.

  She left the smear there. It was evidence. Not of her presence, but of her exclusion. The world continued, closed and sufficient, carrying her along like sediment in the water. She was the sediment, dreaming it was the current.
