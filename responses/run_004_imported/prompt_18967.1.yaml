answer: |-
  Based on the specific commitments outlined from the *Pensées*—the interdependence of justice and force, the resolution of political dispute by legitimizing strength, and the necessity of custom as a mystical foundation—Pascal would analyze the International Criminal Court (ICC) not as a failed moral project, but as a predictable political phenomenon.

  ### 1. Pascal's Explanation of the Pattern
  Pascal would argue that the ICC's selectivity is not an aberration but the inevitable functioning of human society. His core axiom is that "justice without force is powerless." The ICC possesses a definition of justice (its statutes) but lacks independent force; it relies on the cooperation of sovereign states to arrest suspects, enforce warrants, and fund operations.

  Consequently, when the ICC targets weak states, it is because those states lack the force to resist. When it hesitates against strong states, it is because those states possess the force to withhold cooperation. Pascal would explain this using his observation that "people dispute what is just but not who is stronger." Since nations agree on who holds military and economic power but disagree on international norms, the system naturally aligns with power.

  Therefore, the ICC follows the historical pattern Pascal identified: "We have been unable to make what is just strong, so we have made what is strong just." The Court validates the actions of powerful states (by rarely prosecuting them) while policing the weak. In Pascal's terms, the Court is not an instrument of abstract justice, but a mechanism of *custom* that legitimizes the current geopolitical hierarchy. It cloaks force in the language of justice to secure obedience, exactly as domestic legal systems do.

  ### 2. Pascal's Recommendation
  Reasoning from these commitments, Pascal would not recommend abolishing the ICC, nor would he recommend a moral crusade to make it "truly" equal.

  *   **Do not abolish:** Because "justice without force is powerless," dismantling the ICC would leave the world with even less capacity to check the predations of the weak (piracy, local warlords, small-state aggression). An imperfect instrument of force is preferable to none, as it sustains a degree of order.
  *   **Do not expect perfection:** Pascal would warn against the vanity of believing international law can transcend human nature. Since we cannot "make the just strong" (i.e., we cannot compel superpowers to submit to a higher court without their consent), we must accept that the law will reflect the balance of power.
  *   **Strengthen the Custom:** To make the Court more effective, one should not appeal to higher morality, but to *custom*. Pascal argues authority rests on "mystical foundation." To increase the ICC's reach, proponents must allow the *habit* of compliance to harden over time, making it socially and politically costly for strong states to dissent, thereby slowly weaving the Court into the fabric of "what is done."

  ### 3. The Question of Exposure: To Publicize or Not?
  The most difficult tension arises regarding Pascal's warning that "tracing a law back to its real origin is dangerous." Publicizing the ICC's selectivity exposes its foundation: not pure justice, but the force of powerful states.

  **The Argument for Silence (Consistency with the Warning)**
  Pascal would generally argue **against** publicizing this selectivity if the goal is to maintain international order. His reasoning is pragmatic, not moral:
  1.  **Order requires Mystery:** Authority relies on the "mystical foundation." If weak states and their citizens are convinced the ICC is merely a tool of imperialism (force without justice), they will view its warrants as acts of war rather than legal judgments.
  2.  **Powerlessness follows Exposure:** If the mystique is broken, compliance drops. Since "justice without force is powerless," stripping the Court of its moral legitimacy renders it even more impotent.
  3.  **Tyranny vs. Chaos:** Pascal acknowledges that "force without justice is tyrannical." However, he implies that the alternative—disputing justice without a final arbiter—leads to universal conflict. He would likely conclude that a selective court (which prevents some chaos) is preferable to no court (which invites total anarchy). Therefore, preserving the fiction of impartiality is a necessary lie for peace.

  **Can He Consistently Treat This Case Differently?**
  Yes, Pascal can consistently justify exposure in this specific context, but only under a narrow condition: **if the "order" being sustained is illusory or self-destructive.**

  Pascal's warning against exposure applies to *established* customs that successfully keep the peace. If the ICC's selectivity is so glaring that it actively *generates* resentment and instability among weak states (thereby threatening the very order it claims to protect), then the "mystical foundation" has already cracked. In this case:
  1.  **The Custom is Not Settled:** Unlike domestic law, international law is not a deep-rooted custom but a fragile construct. Exposing its origins now might prevent a *false* custom from hardening, allowing for a more honest arrangement of force.
  2.  **Elite vs. Public Knowledge:** Pascal often distinguishes between what the public needs to believe and what the "honest men" (elites) must know. He could consistently recommend that policymakers *acknowledge* the selectivity privately (to manage expectations and avoid overreach) while maintaining the public rhetoric of impartiality.
  3.  **Preventing False Hope:** If the public believes the ICC is a shield against strong-state aggression, they will not develop their own means of defense or diplomacy. Exposing the limitation could force weak states to rely on realistic alliances (force) rather than futile legal appeals (justice without force).

  **Conclusion**
  Ultimately, Pascal would likely advise **against public demystification** unless the hypocrisy is already driving the system toward war. His priority is the mitigation of violence. Since the ICC, even selectively, channels conflict into legal procedures rather than immediate warfare, it serves the function of "making the strong just" enough to keep the peace. To expose the mechanism is to risk returning to a state where justice is entirely powerless. He would recommend accepting the tragedy of the situation: we must obey the laws we know are founded on force, because the alternative is a world where force operates without even the pretense of law.
