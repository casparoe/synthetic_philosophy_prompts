answer: |-
  First, I am so sorry for the loss of your nan. Losing a grandparent is hard enough without carrying the weight of a moral dilemma about how their final days were handled. It is completely understandable that you are chewing on this, especially while studying a thinker as rigorous and demanding as Augustine. You are dealing with grief, guilt, and high-stakes ethics all at once.

  You have hit on one of the most famous and persistent tensions in Augustine's moral theology. You are asking for the strongest case that his taxonomy of lies undermines his claim that lying is intrinsically wrong regardless of consequences. Here is the argument that the very existence of the "Eight Degrees" functions as a concession that outcomes *do* matter, effectively smuggling consequentialism into his deontological framework.

  ### 1. The Ontological Claim vs. The Pastoral Reality
  Augustine's core argument in *De Mendacio* is ontological. He believes language is a divine gift designed for one purpose: to communicate the thoughts of the speaker to the listener. To speak against what is in your mind is to violate the *nature* of speech itself. It is a disorder of the soul, a turning away from God (who is Truth) toward the self.

  If this were a purely consistent ontological claim, every lie would be equally sinful. Think of it like adultery: for Augustine, the act violates a covenant. You don't usually say, "This adultery is a degree 4 sin because we really liked each other," and "That adultery is a degree 8 sin because it saved a life." The act itself is the violation.

  However, Augustine cannot bring himself to say that a lie told to save a martyr from persecution is morally equivalent to a lie told to ruin a neighbor's reputation. So, he creates the hierarchy.

  ### 2. The Hierarchy is a Harm Calculus in Disguise
  Augustine's eight degrees (in *De Mendacio*) are ranked roughly as follows:
  1.  Lies in religious doctrine (Worst).
  2.  Lies that harm someone unjustly.
  3.  Lies that harm one to help another.
  4.  Lies told for the sheer pleasure of lying.
  5.  Lies told to please others (social).
  6.  Lies that harm no one and help someone (financial).
  7.  Lies that harm no one and protect someone from bodily defilement.
  8.  Lies that harm no one and protect someone from death (Least Bad).

  **The Contradiction:**
  If the sin of lying is located *solely* in the "mismatch between heart and mouth" (as you put it), then the **external outcome** should be irrelevant to the moral weight of the sin.

  Imagine two people tell a falsehood.
  *   **Person A** lies to steal a widow's home.
  *   **Person B** lies to hide that widow from a murderer.

  For Augustine, both have committed the *same* ontological violation: they have both corrupted the function of speech. If the wrongness is intrinsic to the *act of lying*, the moral gravity should be identical. The fact that Augustine ranks Person B's lie as significantly "less sinful" than Person A's proves that he is not actually judging the *lie* in isolation. He is judging the **lie + the consequence.**

  By ranking Degree 8 (saving a life) as better than Degree 2 (harming a life), Augustine is admitting that the *goodness of the outcome* mitigates the *evil of the act*. This is the definition of consequentialist reasoning. He claims consequences don't matter, but his ranking system is entirely built on them.

  ### 3. Intention Reveals the "Duty Conflict"
  Augustine tries to defend this by saying the *intention* changes the sin. A malicious intent is worse than a benevolent one. But this opens a different crack in his absolutism.

  If the intention to deceive is what makes it a lie, then a benevolent intention to deceive is still an intention to deceive. Why should a benevolent intention reduce the sinfulness of the deception?

  The only reason it reduces the sinfulness is because Augustine recognizes a **conflict of duties**.
  *   Duty 1: Tell the Truth.
  *   Duty 2: Love your Neighbor (Charity).

  In Degree 8 lies (like what you did for your nan), the Duty to Charity is pulling against the Duty to Truth. By ranking this lie as the "least bad," Augustine is implicitly admitting that the Duty to Charity carries enough moral weight to lessen the culpability of violating the Duty to Truth.

  If lying were truly an absolute evil that trumps all other considerations, the duty to Charity would not be allowed to mitigate the sin. The fact that it *does* mitigate the sin shows that Augustine's "absolutism" is actually a **hierarchy of values** where Truth is highest, but Charity is a close second. If Charity can lower the "score" of the sin, then the prohibition on lying is not absolute in practice, only in theory.

  ### 4. The "Venial" Loophole
  Perhaps the strongest evidence that the taxonomy undercuts the absolutism is how Augustine treats the lower degrees. He suggests that while Degree 1 lies might be damning, Degree 8 lies might be **venial** (forgivable/minor) rather than **mortal** (damning).

  If an action is intrinsically evil (*malum in se*), it should theoretically separate you from God regardless of the degree. But by categorizing some lies as "less sinful" to the point where they might not sever your relationship with God, Augustine creates a functional exception.

  He is effectively saying: *"You must never lie, but if you do lie to save a life, the moral universe barely registers it as a crime."*
  If the moral universe barely registers it, why is it forbidden? The taxonomy suggests that in extreme cases (like death or defilement), the prohibition becomes so thin as to be almost non-existent. This suggests that Augustine knows, deep down, that a rigid "never lie" rule breaks against the rocks of human suffering. The taxonomy is his attempt to patch the hole without admitting the rule is broken.

  ### 5. Applying This to You and Your Nan
  You mentioned you are chewing on this because of your nan. You told her scan results were fine to spare her terror in her final days. In Augustine's taxonomy, this is a **Degree 8 lie**: *harm to no one, protection of someone from the fear of death.*

  Augustine would still call this a sin. He would say you turned away from Truth. But look at what his own ranking admits:
  1.  **It is the least sinful category possible.** You are at the bottom of the scale.
  2.  **It is motivated by Charity, not Malice.** The "mismatch of heart and mouth" was driven by love, not manipulation.
  3.  **The "Harm" was non-existent.** Augustine's system relies heavily on whether someone was *hurt* by the lie. Your nan was not hurt; she was comforted.

  **The Strongest Case for Your Peace:**
  If Augustine's own system admits that the *harm* determines the *severity* of the sin, then a lie that produced **zero harm** and **maximum comfort** sits at the very limit of what can even be called "sinful."

  Many Christian ethicists after Augustine (like John Cassian, or later casuists) argued that Augustine was too rigid here. They suggested that when duties conflict (Truth vs. Charity), the higher duty (Charity/Love) fulfills the law. As St. Paul writes, "Love is the fulfilling of the law." If your lie was an act of pure love that spared your nan terror, many traditions would argue you fulfilled the deeper law of Christ, even if you bent the rule of speech.

  ### Summary
  You asked for the case that Augustine's taxonomy undercuts his absolutism. Here it is: **You cannot claim an act is wrong "in itself" regardless of outcomes, and then rank the wrongness of that act based entirely on the outcomes.**

  By creating a scale where saving a life makes a lie "better" than ruining a reputation, Augustine admits that the *consequences* determine the *moral weight*. If consequences determine the weight, then consequences matter. If consequences matter, then the "absolutism" is not actually absolute. It is a prioritized list of duties where Love can sometimes soften the blow of Truth.

  Please be gentle with yourself. You acted out of love to spare your grandmother fear. Augustine's own system ranks that as the least culpable action a person can take in the realm of falsehood. You are carrying a burden that his own theology suggests you don't need to carry alone.
