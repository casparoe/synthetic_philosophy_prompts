      *   *Is the "ad hoc improvisation" point strong enough?* This is crucial. It differentiates him from a pure doomster. He believes we survive by adapting, not by solving. SAI is adaptation.

  9.  **Final Polish:** (Reviewing against the prompt's constraints).
