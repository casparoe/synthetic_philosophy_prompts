answer: |-
  **SETTING:**
  Two sterile white booths, separated by a thick wall of soundproof glass. Inside each, a single terminal and a chair. Two men sit facing each other through the glass. They are identical in every measurable respect: same scar on the left chin, same micro-tics in the right hand, same pupil dilation. A digital timer on the wall counts down from 02:00. For these two minutes, an audio channel is open. After that, the link cuts, and they must input their choice: **COOPERATE** or **DEFECT**.

  **CHARACTERS:**
  **LEFT (CDT):** Argues for Causal Decision Theory.
  **RIGHT (SRT):** Argues for Superrationality.

  [The timer reads 01:55. The audio channel clicks open.]

  **LEFT:** We know the setup. We know the payoffs. We know we are running the same code on different hardware.

  **RIGHT:** Then you know that "different hardware" is a distraction. We are the same algorithm. If I output *Cooperate*, you output *Cooperate*. If I output *Defect*, you output *Defect*. The only stable points are (C, C) and (D, D). Given the payoff matrix, (C, C) yields 3 years each, (D, D) yields 5 years each. To choose *Defect* is to choose 5 years for both of us. I'm cooperating.

  **LEFT:** You're confusing the map with the territory. Yes, we are correlated. I grant that. I even grant that it is highly probable we will make the same move. But probability isn't causality. My finger pressing the *Defect* key does not send a signal to your booth. There is no wire. There is no entanglement.

  **RIGHT:** It's not about a signal. It's about logical identity. Imagine a calculator in New York and a calculator in Tokyo. Both are set to compute 2 + 2. If the New York calculator outputs 4, does it *cause* the Tokyo calculator to output 4? No. But if the New York calculator somehow decided to output 5, it would imply that the Tokyo calculator is also outputting 5, because they are performing the same operation. I am not trying to *force* you. I am trying to determine the output of the function we both instantiate.

  **LEFT:** But I am not the function. I am the instance. I am *here*. You are *there*. When I deliberate, I am asking: "What happens if *I* press this button?" Not "What does the abstract function output?" If I press *Defect*, I secure a better outcome for myself regardless of what you do. If you Cooperate, I get 0 years. If you Defect, I get 5 years. If I Cooperate, I get 3 or 10. Dominance is clear. Defection dominates.

  **RIGHT:** Dominance reasoning assumes your choice is independent of mine. It treats the other player's move as a fixed state of the world that you discover, not something you participate in creating. But in this specific case, my choice *is* a prediction of your choice, not because I'm reading your mind, but because I *am* your mind. You say you are the instance. I say the instance is irrelevant. The logic is what matters. If the logic dictates *Defect*, we both go to prison for five years. If the logic dictates *Cooperate*, we both get three. Which logic do you want to be true?

  **LEFT:** I don't get to choose which logic is true. I get to choose which button I press. Look, consider the Smoking Lesion problem. A gene causes both a desire to smoke and a high risk of cancer. Smoking itself doesn't cause cancer; the gene does. But smoking is evidence you have the gene. Evidential Decision Theory says "Don't smoke, because if you smoke, you likely have the gene." Causal Decision Theory says "Smoke. The damage is already done by the gene. Enjoy the cigarette."

  **RIGHT:** I know the analogy. You're saying our shared source code is the "gene," and our choices are the "smoking." You think choosing to Cooperate is just evidential news that we share a cooperative code, but it doesn't *change* the outcome.

  **LEFT:** Exactly. The code determined our disposition long before we sat in these chairs. My pressing the button now is just the physical manifestation of that prior determination. I can't change the code by pressing a button. So I might as well press the button that benefits me locally. If the code makes us Defectors, we Defect and get 5 years. I can't change that by pretending my finger has magical powers.

  **RIGHT:** That's a fatalistic error. The code doesn't determine the output until it *runs*. We are running it now. You say the damage is done by the gene? No. The gene is the potential; the choice is the actualization. In the Smoking Lesion case, the cancer is a physical consequence of the gene, independent of the smoking. In this Prisoner's Dilemma, the other player's move is a *logical consequence* of the same reasoning process you are using right now. It's not a physical side-effect; it's a mathematical identity. If I prove X here, X is proved there.

  **LEFT:** But "I" am not the proof. "I" am the prover. And I am located in this booth. If I am truly rational, I must acknowledge that I cannot influence a physical system across a soundproof wall without a causal channel. To believe otherwise is magical thinking. It's solipsism dressed up as math. You're saying the universe rearranges itself to match your logic.

  **RIGHT:** I'm saying the universe contains logical truths that hold regardless of location. 2 + 2 = 4 in your booth and mine. If we are truly identical, then "What I should do" is identical to "What you should do." If you conclude "I should Defect," then you have concluded "We should Defect." You are accepting 5 years for us both to gain a hypothetical advantage that cannot exist. If we are twins, you *cannot* gain that advantage. You can only jointly lose.

  **LEFT:** [Leans forward, hands clasped] I hear you. And I know you hear me. And I know that because we are twins, if I am convinced by your argument, you are too, and we both Cooperate. If I am not convinced, we both Defect. So the outcome *does* depend on my reasoning. I grant that. But here is the knife-edge: I must reason correctly. And correct reasoning requires acknowledging causal boundaries. If I Cooperate *because* I think it will make you Cooperate, I am relying on a causal link that doesn't exist. I am relying on a correlation.

  **RIGHT:** You keep saying "correlation" as if it's a dirty word. In a normal PD, correlation is accidental. Here, correlation is structural. It's necessary.

  **LEFT:** It's necessary *given the past*. But my choice is in the future. Imagine a third party, Omega, recorded our choices before we entered the room. If Omega predicted we would Defect, and I choose to Cooperate, do I change Omega's record? No. Do I change your choice? No, because your choice is also fixed by the same prior causes. All I do is ensure I get the "sucker's payoff" if Omega predicted Defection. I have to act as if my choice is a free variable, because from my perspective, it is.

  **RIGHT:** But it's not a free variable! It's a determined output of a reasoning process. You say "act as if it's a free variable." I say "act as if it's a logical variable." If you treat your choice as independent, you are lying to yourself about the nature of the system you are in. You are a subroutine. A subroutine doesn't get to ignore the global state just because it has local scope.

  **LEFT:** [Timer reads 00:45] And a subroutine doesn't get to command other instances. I am not the global state. I am this instance. If I defect, and you defect, we are both rational agents maximizing utility given our constraints. We get 5 years. It's a shame. But if I cooperate, hoping you will too, I am betting on a causal miracle. I am betting that my cooperation *reaches out* and tweaks your neurons. It doesn't.

  **RIGHT:** It doesn't tweak my neurons. It aligns with them. Look, suppose you are absolutely certain we are identical. 100%. You know that whatever you decide, I decide. The matrix collapses. You are no longer choosing between (C, D) and (D, C). Those are impossible worlds. You are choosing between (C, C) and (D, D). In that collapsed matrix, Cooperation dominates. Why cling to the impossible worlds?

  **LEFT:** Because those worlds aren't impossible to *me*. They are possible outcomes of my uncertainty. I am not 100% certain. I am 99.9% certain. There is a tiny chance of noise, a cosmic ray flipping a bit in your processor and not mine. If that noise exists, Dominance returns. If there is even a epsilon chance you are not me, I must Defect to protect against the sucker's payoff. The risk asymmetry is too high.

  **RIGHT:** [Smiles, a mirror image of Left's frown] And there is the same epsilon chance that your reasoning is flawed and mine is correct. If you Defect based on that epsilon, you guarantee the worse outcome for the 99.9% where we match. You are letting the tail wag the dog. You are sacrificing the certain mutual gain for a hypothetical protection against a breakdown in symmetry that, if it occurs, means we aren't twins anymore and the game has changed.

  **LEFT:** The game doesn't change. The payoffs remain. If symmetry breaks, I get 0 years if I Defect and you Cooperate. That's the best possible outcome for me. Rationality is self-interested. I cannot sacrifice my best outcome for a "mutual" outcome unless I care about you more than me. And I don't. I care about *me*.

  **RIGHT:** But "you" are "me". There is no distinction. You are arguing for self-interest against yourself. It's like your left hand refusing to pass a ball to your right hand because it wants to keep the ball.

  **LEFT:** [Timer reads 00:15] My left hand and right hand are part of one body. We are not. We are two bodies. The pain of your prison time is not felt in my nerves. The utility function is local. I maximize *my* utility.

  **RIGHT:** And your utility depends on the output of the computation. If the computation outputs *Defect*, your utility is lower. You are trying to hack the output by ignoring the code.

  **LEFT:** I am executing the code. And the code says: Protect against dominance.

  **RIGHT:** The code says: Maximize expected utility. And the expected utility of Cooperation is higher given the symmetry.

  **LEFT:** [Timer reads 00:05] We're out of time. We haven't converged.

  **RIGHT:** We will converge. We're twins. We'll type the same thing.

  **LEFT:** Then I hope you type *Defect*. Because I am.

  **RIGHT:** Then I hope you type *Cooperate*. Because I am.

  [The timer hits 00:00. The audio channel clicks dead. The glass remains transparent. They look at each other. Both raise their hands to the keyboards. They type. They do not show each other the screens.]

  [END]
