prompt: |-
  A friend and I spent a long evening arguing about Aquinas's position on tyrannicide, and we ended up agreeing on a reading that neither of us could fully defend under further questioning: since Aquinas holds that a ruler who governs for his own advantage rather than the common good has thereby forfeited the legitimacy of his rule, he must be granting ordinary subjects a standing right to kill such a ruler on their own initiative -- which is presumably why he is cited as a forerunner of later Jesuit resistance theorists such as Mariana and Suárez. Yet Aquinas is elsewhere adamant that no private person may inflict death on anyone, however guilty, by his own authority, reserving that power to whoever bears public responsibility for the community's welfare. Why does he treat tyranny as the one case in which this otherwise near-inviolable restriction does not hold?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Does Aquinas grant ordinary subjects a standing right to kill a tyrant on their own initiative? Why does he seem to treat tyranny as an exception to the rule that private persons cannot inflict death?
      *   **User's Premise:** The user and their friend agreed on a reading (Aquinas supports private tyrannicide because tyranny forfeits legitimacy) but found it indefensible under questioning (Aquinas forbids private killing).
      *   **Specific Tension:** Aquinas says tyrants forfeit legitimacy *vs.* Aquinas says private individuals cannot execute justice.
      *   **Historical Context:** The user mentions Aquinas being cited as a forerunner to Jesuit resistance theorists (Mariana, Suárez).
      *   **Goal:** Clarify Aquinas's actual position, resolve the apparent contradiction, and explain the nuance regarding public vs. private authority.

  2.  **Recall/Research Aquinas's Texts:**
      *   *Key Text 1:* *De Regno* (On Kingship), Book I, Chapter 6. This is the primary source for his views on tyranny.
      *   *Key Text 2:* *Summa Theologiae* (ST), II-II, q. 42 (Sedition), q. 64 (Killing), q. 104 (Obedience).
      *   *Key Distinction:* Private authority vs. Public authority.
      *   *Key Concept:* The "public person" (publica persona) vs. the private individual.

  3.  **Evaluate the User's Premise:**
      *   *Premise:* "Aquinas holds that a ruler... has thereby forfeited the legitimacy of his rule, he must be granting ordinary subjects a standing right to kill such a ruler on their own initiative."
      *   *Correction:* This is the crux of the error. Aquinas *does* say the ruler forfeits legitimacy, but he *does not* conclude that this grants a right to *private* individuals. The forfeiture of legitimacy means the ruler is no longer a true ruler, but it doesn't automatically transfer the sword of justice to every subject.
      *   *Jesuit Connection:* Later theorists (like Mariana) *did* argue for private tyrannicide in extreme cases, often claiming Aquinas as support. However, scholars generally agree they expanded or distorted Aquinas's more cautious position.

  4.  **Synthesize Aquinas's Argument (The "Why"):**
      *   **General Rule:** Private killing is forbidden (ST II-II, q. 64). Only public authority can execute justice.
      *   **Tyranny Case:** In *De Regno*, Aquinas discusses removing a tyrant.
      *   **The Mechanism:** He does *not* advocate private assassination. He suggests:
          1.  Appeal to a superior authority (if one exists, e.g., Emperor over King).
          2.  If no superior exists, the *community* (the public) acts, not individuals.
          3.  Even then, caution is advised because removing a tyrant might lead to worse tyranny or sedition.
      *   **The Logic:** The authority to depose resides in the *body politic* (the people collectively or their representatives), not in private individuals acting alone. The tyrant breaks the pact with the *community*, so the *community* responds.

  5.  **Address the "Exception" Question:**
      *   The user asks: "Why does he treat tyranny as the one case in which this otherwise near-inviolable restriction does not hold?"
      *   *Correction:* He *doesn't* treat it as an exception to the restriction on *private* killing. He treats it as a case where *public* authority (the people collectively) may act against a usurper or abuser.
      *   *Nuance:* There is a subtle distinction between a "usurper" (no title) and a "tyrant by exercise" (has title but abuses it). Aquinas is more lenient on resisting a usurper.

  6.  **Drafting the Response:**

      *   **Introduction:** Validate the user's confusion. It's a classic debate. State clearly: The premise that Aquinas grants a right to *private* individuals is incorrect.
      *   **The Core Distinction:** Private vs. Public Authority. Explain ST II-II, q. 64. Killing requires public authority.
      *   **De Regno Analysis:** Break down *On Kingship* I.6.
          *   Option A: Superior authority.
          *   Option B: Public authority (the multitude), not private presumption.
          *   The Warning: Danger of sedition/worse tyranny.
      *   **The "Forfeiture" Nuance:** Yes, the tyrant forfeits the *right to rule*, but that doesn't mean everyone gets the *right to execute*. It reverts to the community.
      *   **Jesuit Comparison:** Acknowledge the user's point about Mariana/Suárez. Explain that they radicalized Aquinas. Aquinas is a "resistance theorist" but not necessarily a "tyrannicide theorist" in the private sense.
      *   **Sedition:** Mention ST II-II, q. 42. Resisting a tyrant is not sedition if the tyrant is the one causing discord.
      *   **Conclusion:** Summarize. The restriction *does* hold. Private tyrannicide is not supported. The "exception" is actually the *community* acting publicly.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did Aquinas *ever* allow private tyrannicide? Some scholars argue *Commentary on the Sentences* might be slightly more open, but *De Regno* and *Summa* are the mature views. Stick to the mature views for clarity.
      *   *Check:* Is the distinction between "usurper" and "tyrant by exercise" important? Yes. A usurper has no claim at all. A legitimate king who turns tyrant is harder to depose. Aquinas focuses mostly on the general concept of tyranny, but the mechanism remains public.
      *   *Tone:* Academic but accessible. Acknowledge the sophistication of the user's question.

  8.  **Final Polish:** Ensure the distinction between "legitimacy of rule" and "authority to punish" is clear. Just because the king is a criminal doesn't make me the executioner. The community must appoint the executioner.

      *(Self-Correction on the "Exception" phrasing)*: The user asks why he treats it as an exception. I need to explicitly say: "He doesn't." That's the key to resolving their dilemma.

