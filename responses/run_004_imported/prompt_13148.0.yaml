answer: |-
  Your friend and you have stumbled upon one of the most persistent and consequential misunderstandings in the history of political thought. The short answer to your question is: **He doesn't.**

  Aquinas does *not* treat tyranny as an exception to the rule that private persons cannot inflict death. The reading you and your friend arrived at—that Aquinas grants ordinary subjects a standing right to kill a tyrant on their own initiative—is precisely the interpretation that later Jesuit theorists (like Juan de Mariana) advocated, but it is not what Aquinas himself wrote.

  Here is the breakdown of why Aquinas maintains the restriction on private killing even in cases of tyranny, and how he resolves the tension between a ruler's forfeiture of legitimacy and the subject's lack of authority to execute justice.

  ### 1. The General Rule: Private vs. Public Authority
  You are correct that Aquinas is adamant on this point in the *Summa Theologiae* (II-II, q. 64, a. 3). He argues that it is lawful to kill a sinner only insofar as it is directed to the welfare of the whole community. Therefore, this power belongs solely to those who have "care of the community" (i.e., public magistrates).

  For Aquinas, the prohibition against private killing is not just a positive law; it is rooted in the metaphysical order of justice. A private individual acts on their own behalf; a public authority acts on behalf of the whole body. Since the good of the whole outweighs the good of the part, only the guardian of the whole can licitly destroy a part that is corrupting the body.

  ### 2. The Specific Case: *De Regno* (On Kingship)
  The primary text for Aquinas's view on tyranny is *De Regno* (Book I, Chapter 6). Here, he addresses what is to be done when a king becomes a tyrant. He outlines a hierarchy of remedies, none of which authorize private assassination:

  1.  **Appeal to a Superior:** If the tyrant is subordinate to a higher authority (e.g., a King under an Emperor), the superior has the duty to depose him.
  2.  **Public Authority (The Multitude):** If there is no superior (the tyrant is the highest authority), Aquinas says the right to depose him belongs to the **public authority**, not private individuals. He writes:
      > "It would not be sedition to disturb a government of this kind [tyranny]... unless indeed the tyranny is so excessive that it causes greater harm to the community than would result from its removal."
      > "But if the multitude has the right to provide itself with a king, it is just that the king be deposed or have his power restricted by that same multitude."

  Note the crucial distinction: The *multitude* (the community acting collectively or through representatives) acts as a **public body**. They are not acting as private individuals exercising private vengeance. They are exercising the residual public authority that reverts to them when the ruler breaks the compact.

  ### 3. Resolving the Contradiction
  The tension you identified rests on this syllogism:
  *   *Premise 1:* A tyrant forfeits his legitimacy.
  *   *Premise 2:* Only public authority can kill.
  *   *Conclusion:* Therefore, private individuals can kill the tyrant.

  Aquinas rejects the Conclusion. His logic runs differently:
  *   *Premise 1:* A tyrant forfeits his legitimacy.
  *   *Premise 2:* When legitimacy is forfeited, authority reverts to the source of that authority (the community).
  *   *Conclusion:* The **community acting publicly** may depose the tyrant, but **private individuals** still lack the standing to kill.

  For Aquinas, the tyrant's forfeiture of legitimacy does not turn every subject into a magistrate. It turns the *body politic* back into the source of magistracy. To kill the tyrant privately is still to act without public authority, which is sedition (or murder), even if the target is guilty.

  ### 4. Why the Confusion? (The Jesuit Divergence)
  You mentioned Mariana and Suárez. You are right that they are often linked to Aquinas, but they represent a development (and many scholars argue, a distortion) of Thomistic thought.

  *   **Aquinas:** Cautious, institutional, and corporate. Resistance must come from the "public authority" of the realm. He worries more about the chaos of assassination than the injustice of the tyrant.
  *   **The Jesuits (16th Century):** Writing in the context of the Wars of Religion and against absolute monarchs, they radicalized the position. Mariana, in *De Rege* (1599), famously argued that a tyrant who seizes power without title may be killed by **any private citizen** (*privatus*), and that doing so is glorious.

  Later liberals and revolutionaries often conflated the two, citing Aquinas to give ancient scholastic weight to the Jesuit position of private tyrannicide. But strictly speaking, Aquinas does not support the "private initiative" reading.

  ### 5. One Nuance: The Usurper vs. The Tyrant by Exercise
  Scholars sometimes note a subtle distinction in Aquinas between a **usurper** (who has no title to rule at all) and a **tyrant by exercise** (who has a legitimate title but rules badly).

  *   Against a **usurper**, resistance is easier to justify because there is no bond of obedience to begin with.
  *   Against a **tyrant by exercise**, Aquinas is much more cautious. He warns that attempting to remove a tyrant often leads to greater tyranny (as the new ruler becomes paranoid and cruel) or sedition (which harms the common good more than the tyranny does).

  In *Summa Theologiae* (II-II, q. 42, a. 2), he explicitly states that resisting a tyrant is not sedition *if* the tyrant is the one causing discord. However, he does not use this to license private killing; he uses it to justify public resistance.

  ### Summary
  Aquinas does not treat tyranny as an exception to the restriction on private killing. He treats it as a case where the **public authority** has shifted location.

  *   **Normal Rule:** The King holds public authority; private individuals cannot kill.
  *   **Tyranny:** The King forfeits public authority; authority reverts to the Community.
  *   **Result:** The Community (acting publicly) may depose the King. Private individuals (acting privately) still cannot kill.

  Your friend and you were correct to feel that the "private right" reading was indefensible under questioning. Aquinas's genius lies in his insistence that justice is structural, not individual. Even against a monster, the sword of justice must remain public, or else the remedy becomes worse than the disease.
