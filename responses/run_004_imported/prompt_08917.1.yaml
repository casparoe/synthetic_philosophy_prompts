answer: |-
  You have hit on exactly the right tension. Your intuition is spot-on: Newton is absolutely smuggling his natural philosophy (physics/metaphysics) into his theology. In fact, for Newton, there wasn't really a wall between the two. To understand nature was to understand the attributes of God.

  Here is the unpacking of the logic in Article 5, why "immovability" was the specific knife he used to separate the Father from the Son, and how his theory of Absolute Space does the heavy lifting.

  ### 1. The Metaphysical Logic: Container vs. Contained
  The core of Newton's argument here is ontological hierarchy. It relies on a classical distinction that Newton radicalized with his physics:

  *   **The Father (Absolute Reality):** He is the ground of existence. In Newton's metaphysics (particularly in the unpublished *De Gravitatione*), space and time are not independent containers; they are "emanative effects" of God's existence. God constitutes space. Therefore, God cannot move *in* space, because there is no space outside of Him for Him to move into. He is the "container" of all things.
  *   **Created Beings (Relative Reality):** Anything that is *not* the Father exists *within* the space God constitutes. Because they are "in" space, they can change location. They are "contained."

  **The Logic Chain:**
  1.  To be the Supreme God is to be the necessary ground of all being (Absolute Space/Presence).
  2.  The ground of being cannot change location (move), because movement implies a "here" and a "there" distinct from oneself.
  3.  Christ (in Newton's reading of Scripture) ascended, sits at the right hand, and will descend. He changes location.
  4.  Therefore, Christ is "contained" within space, not the constitutor of space.
  5.  Therefore, Christ is a created being (divine, but not the *Supreme* God).

  ### 2. Why Immovability Specifically?
  You asked why this specific attribute was the dealbreaker. Newton had to navigate a minefield of Scripture. The Bible calls Jesus "God," but it also says things like "The Father is greater than I." Newton, as an Arian (or more accurately, a Socinian-influenced Unitarian), needed a hard, metaphysical line to distinguish the two without denying Jesus's divinity entirely.

  **Immovability was the sharpest tool for three reasons:**

  *   **It bypasses "Omnipresence":** Trinitarians argued the Son is omnipresent just like the Father. Newton couldn't easily deny that without contradicting Scripture. But he *could* argue about *how* they are present. The Father is present by **substance/essence** (immovable). The Son is present by **power/delegation** (moveable).
  *   **It leverages the Resurrection/Ascension:** Newton took the physical reality of Jesus's resurrected body seriously. A body, by definition, has location. If Jesus has a body that ascended to heaven, he is locally present in heaven, not everywhere at once in the same way the Father is. If he can move from Earth to Heaven, he is moveable. If he is moveable, he is not the Immovable Father.
  *   **It protects Monotheism:** For Newton, worshipping a moveable being as the Supreme God was idolatry. If God can move, He is contingent (dependent on space). If He is contingent, He isn't the Necessary Being. Newton believed Trinitarianism effectively created two "Necessary Beings," which was logical nonsense to him. There can only be one Immovable Source.

  ### 3. The Physics Smuggling (Your Hunch was Right)
  You suspected he was using the *Principia* to do theological work. You are correct. In the Scholium of the *Principia*, Newton writes:

  > "He endures forever, and is everywhere present; and by existing always and everywhere, he constitutes duration and space... Every particle of space is always, and every indivisible moment of duration is everywhere. The Maker and Lord of all things cannot be never and nowhere."

  In Newton's view, **Absolute Space is effectively God's "sensorium."** It is the medium through which God perceives and acts on the universe.
  *   **Absolute Space:** Immovable, infinite, eternal.
  *   **Relative Space:** Moveable, finite, measurable (where we live).

  By Article 5, Newton is saying: *The Father is identified with the attributes of Absolute Space (Immensity/Eternity). Christ operates within Relative Space.*

  This is why the phrase "no place being capable of becoming emptier or fuller of him" is so technical. It means God's presence isn't a fluid that flows; it's a necessary truth. You can't have "more God" in a church than in a barn. But a created being (like Christ in his glorified body) *can* be more in one place than another.

  ### 4. Historical Context: The "Unmoved Mover" on Steroids
  Newton isn't inventing this from scratch; he is mechanizing Aristotle.
  *   **Aristotle:** God is the "Unmoved Mover." He moves the world by being loved, not by moving Himself.
  *   **Newton:** God is the "Immovable Substrate." He sustains the world by being the space in which it happens.

  However, Newton uses this to fight the Athanasian Creed. The Creed says the Father and Son are co-equal and co-eternal. Newton argues: *If the Son moves (Ascension) and the Father does not, they cannot be the same substance.* It is a syllogism designed to break the Trinity using the definition of "Substance."

  ### Summary of the Argument
  Newton's Article 5 is essentially a boundary marker. He is defining "God" (The Father) not just by moral attributes (good, holy) but by **modal attributes** (necessary, immovable).

  1.  **Necessity:** The Father exists by the "eternal necessity of nature."
  2.  **Immovability:** Because He is necessary, He cannot change place.
  3.  **Contingency:** All other beings (including Christ) exist by Will, not Nature.
  4.  **Movability:** Because they are contingent, they can move.

  By locking "Immovability" to "Supreme Godhood," Newton makes it logically impossible for Jesus (who moved, ascended, and will return) to be the Supreme God. It allows Newton to venerate Christ as the divine King and Mediator while reserving worship of the *Ultimate Source* for the Father alone.

  It is a brilliant, if heretical, synthesis of his calculus of fluxions and his reading of the Church Fathers. He treats theology like a physics problem: define the axioms (Immovability = God), observe the data (Jesus moved), and solve for X (Jesus $\neq$ Supreme God).
