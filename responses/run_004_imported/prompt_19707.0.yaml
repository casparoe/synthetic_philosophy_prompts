      *Actually, the standard completeness pump is:* You have A. You don't prefer A to B or B to A. I offer you B for A + $\epsilon$. You take it (since you don't prefer A). Now you have B. I offer A for B + $\epsilon$. You take it (since you don't prefer B). Now you have A minus $2\epsilon$.
