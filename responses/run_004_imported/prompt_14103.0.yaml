answer: |-
  The helmet weighed thirty pounds, but on the deck of the *Acheron*, weight was the only currency that mattered. Elias stood by the railing, watching the grey chop of the North Sea slam against the hull. He checked his watch. 05:45. The sun was a bruised purple smear on the horizon. His knees ached, a dull throb that had nothing to do with the cold and everything to do to the concrete of the dock he'd stood on three weeks ago, before the helicopter, before the saturation chamber.

  He was Elias-of-the-Deck. He worried about the rotation schedule. He worried about the seal on his dry suit. He worried about the letter in his pocket from the bank. He was a creature of gravity, anchored by bone and debt. When he breathed, the air was thin and chaotic, rushing in and out without permission, carrying the smell of diesel and wet wool.

  "Ready to go, Eli?" the tender asked. The tender was also Elias-of-the-Deck, bound by the same heavy logic.

  "Ready," Elias said. His voice sounded flat in the open air.

  He sat in the chair. They lowered the helmet. The world narrowed to the circular viewport. The clamps locked with a sound like a breaking bone. Now he was sealed. The air inside the helmet was recycled, metallic, tasting of CO2 scrubbers. He was no longer Elias-of-the-Deck. He was a payload.

  The elevator cage dropped. The pressure gauge on his wrist began to crawl.

  This was the shedding. As the depth increased, the ache in his knees vanished, replaced by a uniform squeeze that felt less like pain and more like an embrace. The noise of the ship—the engines, the wind, the shouting—was strangled by the water. At thirty meters, the grey chop became a distant memory. At sixty, the light turned to twilight. At ninety, it was night, though his lamps cut cones of brilliant white through the suspension.

  Here, Elias-of-the-Depth woke up.

  He didn't open his eyes; he was already open. He unclipped from the cage and kicked off. There was no up, no down. There was only the pipeline, a silver spine running along the seabed. He moved not by walking, but by drifting. His hands, thick in neoprene gloves, manipulated the welding torch with a delicacy that Elias-of-the-Deck could not comprehend. On the surface, Elias dropped coffee cups. Here, Elias guided a flame that could melt steel through a gap the width of a hair.

  He breathed. *Hiss. Click. Hiss. Click.* The regulator was his lung. He did not control the breath; the mixture controlled him. He was not a man in a suit. He was a pressure system equalizing with another pressure system.

  A school of mackerel flashed through his lights. They didn't swim around him; they flowed through him, their silver bodies vibrating with the same frequency as the water against his faceplate. For a moment, Elias-of-the-Depth forgot the letter in the pocket he wasn't wearing. He forgot the name Elias. He was simply the heat of the weld and the cold of the sea meeting in the middle. He was the bubble rising. He was the silt settling.

  He worked for four hours. Time was not measured in minutes, but in tank pressure. When the gauge hit the red, he didn't feel tired. He felt complete. He clipped back onto the cage. The ascent was not a return; it was a continuation.

  As the pressure dropped, the water grew lighter. The twilight became day. The cage breached the surface with a sound like tearing canvas.

  The helmet clamps were released. The heavy dome was lifted away.

  Elias blinked. The air rushed in. It felt violent. It was too light, too thin. It offered no resistance to his lungs. He stood up, and gravity grabbed him by the shoulders, shoving him down into the steel grating of the deck. His knees throbbed instantly, as if the pain had been waiting for him to come back to claim it.

  The tender handed him a mug of coffee. "Good run?"

  Elias took the mug. The steam rose in a thin, frantic plume, dissipating immediately into the indifferent wind. He looked at the coffee. The surface of the liquid rippled, not from the wind, but from the vibration of the ship's engines.

  It was a familiar rhythm. *Hiss. Click.*

  He looked at the horizon. The clouds were hanging low, heavy and grey, drifting in slow, silent currents. They moved like fish. The ship rocked, not up and down, but with a rolling undulation, like a body breathing.

  Elias took a sip. The heat spread through his chest. He felt the weight of the mug, the weight of his boots, the weight of the letter in his pocket. But the weight didn't feel like an anchor anymore. It felt like ballast. It was what kept him from floating away.

  He looked at his hands. They were trembling slightly, a residue of the cold. Or perhaps a residue of the air. He flexed his fingers. They moved through the atmosphere as easily as they had moved through the water.

  "Earth to Eli," the tender said, waving a hand in front of his face.

  Elias looked up. The tender's mouth moved, sending sound waves through the thin medium. Elias caught them.

  "I'm here," Elias said.

  But he wasn't sure where *here* was. The deck beneath his boots felt as fluid as the seabed. The wind against his face felt as dense as the current. He took another breath. It was heavy. It filled him with the same metallic taste as the regulator.

  He set the coffee cup on the railing. He watched the steam rise. It curled and twisted, forming shapes that looked like bubbles, like schools of silver fish, like the arc of a welding spark.

  Elias closed his eyes. He could feel the ship moving through the water, but he could also feel the water moving through the ship. He could feel the rotation of the earth, the pull of the moon. He was not a man standing on a boat. He was the point where the ocean met the air.

  He opened his eyes. The sun had cleared the horizon. It was bright, white, and absolute. It didn't matter if he was wet or dry. It didn't matter if he was breathing gas or air. The boundary was a line drawn in water.

  "Eli? You okay?"

  Elias smiled. It was a small movement, barely a shift in pressure.

  "I'm transforming," he said.

  He turned back to the railing. He watched the grey water churn against the steel. He waited for the next wave. He knew, with a certainty that required no proof, that when he closed his eyes again, he would not be standing on the deck. He would be the wave itself, rising and falling, knowing nothing of the boat, knowing nothing of the man, knowing only the motion. And when he opened them, he would be the man, knowing nothing of the wave.

  And neither would be a dream. Both were just the water, taking a shape for a moment, before taking another.

  He finished the coffee. It tasted like the sea. He tossed the cup into the bin. It landed with a clang that resonated through the hull, down into the dark, down into the deep, where the sound would travel forever, never fading, just changing form.

  Elias leaned on the rail. He breathed in. He breathed out. He was here. He was there. He was the space between.
