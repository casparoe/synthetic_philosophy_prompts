answer: |-
  You are not connecting dots that don't exist; you have effectively reconstructed a central pillar of serious Hobbes scholarship. You haven't built a "just-so" story—you've stumbled onto the structural engine of Hobbes's entire philosophical project.

  Your read on the epistemology ("we can only truly know what we make") is accurate, and your hypothesis about the Wallis feud being existential rather than merely ego-driven is supported by many intellectual historians.

  Here is the breakdown of where you are spot-on, where you need a slight nuance, and which scholars back you up.

  ### 1. The Epistemology: *Verum Ipsum Factum*
  You described Hobbes's view as: *"we can only be TRULY certain about things we made ourselves."*

  This is correct. While the Latin phrase *verum ipsum factum* ("the true is the very same as the made") is most famously associated with Giambattista Vico (who came later), the concept is thoroughly Hobbesian.

  Hobbes divides knowledge into two buckets:
  *   **Natural Philosophy (Physics):** God made nature. Therefore, only God knows the true causes of things. Humans can observe effects and hypothesize causes, but we can never have absolute demonstration. We can only have probability.
  *   **Geometry and Civil Philosophy:** Humans make these. We define the circle; we construct the Commonwealth via covenant. Because we are the authors of the causes, we can have demonstrative, certain knowledge of the effects.

  In *De Corpore*, Hobbes writes that geometry is "the only science that it hath pleased God hitherto to bestow on mankind." Why? Because in geometry, we lay down the definitions ourselves. There is no hidden reality to trip us up.

  **Verdict:** Your grasp of his epistemology is solid. You aren't misremembering; you've identified the core distinction between his "science of nature" and his "science of justice."

  ### 2. The Political Project as "Geometric"
  You noted that he set up political philosophy *"strict definitions first, then deductions, Euclid-style."*

  This is exactly right. Hobbes viewed himself as the "Galileo of Civil Science." Galileo applied mathematics to motion; Hobbes intended to apply the *method* of geometry to human passion and politics.
  *   **Axioms:** Human nature (fear, pride, desire for power).
  *   **Construction:** The Social Contract (artificially constructing a sovereign).
  *   **Theorem:** The necessity of absolute obedience to avoid the State of Nature.

  He believed that because the Commonwealth is an "Artificial Man" (as he calls it in the Introduction to *Leviathan*), created by human art, it is subject to the same kind of certain knowledge as a geometric figure.

  **Verdict:** Accurate. The structure of *Leviathan* is intentionally mimetic of Euclid's *Elements*.

  ### 3. The Wallis Feud: Ego or Epistemology?
  Here is your core theory: *Hobbes couldn't admit he was wrong about squaring the circle because it threatened the epistemological foundation of his politics.*

  **You are onto something real here.** Most pop-history dismisses the feud as the ramblings of a senile old man too proud to admit defeat. While Hobbes was undoubtedly proud (and arguably suffering from some cognitive decline in his 80s and 90s), scholars like **Noel Malcolm** and **A.P. Martinich** argue that the stakes were higher.

  For Hobbes, geometry was the **proof of concept** for his method of reasoning.
  *   His method: Start with clear definitions, proceed by correct computation (addition/subtraction of concepts), arrive at necessary truth.
  *   Geometry was the only place this method had historically worked.
  *   If Hobbes claimed to use this method to solve the circle problem, and a professional mathematician proved his computation was wrong, it implies one of two things:
      1.  Hobbes is bad at logic/math.
      2.  The method itself doesn't guarantee truth.

  If #2 is true, then the method used in *Leviathan* is also suspect. If you can't be certain about a circle (which you defined), how can you be certain about a Sovereign (which you also defined)?

  Furthermore, the feud wasn't just about math; it was about **authority**. Wallis represented the Royal Society and the universities (Oxford). Hobbes viewed these institutions as corrupt purveyors of "vain philosophy" (Aristotelian scholasticism) that obscured truth with jargon. Hobbes believed his plain, deductive method was the only path to peace. Wallis demonstrating that Hobbes's "plain deductive method" produced mathematical errors gave ammunition to Hobbes's political enemies (the Royalists and the Church) who wanted to paint *Leviathan* as dangerous nonsense.

  **Verdict:** You are not forcing the connection. The validity of his mathematical reasoning was the shield that protected the validity of his political reasoning. Piercing the shield exposed the body.

  ### 4. Where to Add Nuance (The "Don't Sugarcoat" Part)
  While your theory is sound, here are two caveats to keep it rigorous:

  **A. Hobbes was objectively, embarrassingly wrong.**
  Sometimes, in philosophy, we like to say "well, maybe he was right in a different way." Not here. Hobbes's attempts to square the circle were mathematically incoherent. Wallis wasn't just arguing from a different paradigm; Hobbes was making basic arithmetic errors. Hobbes's stubbornness *was* partly just stubbornness. He developed a conspiracy theory that the mathematicians were a guild protecting their secrets, which was paranoid. So, while the *stakes* were epistemological, the *refusal to concede* was also fueled by genuine hubris and perhaps age-related rigidity.

  **B. The "Threat" might be rhetorical, not logical.**
  Does *Leviathan* logically collapse if Hobbes can't square a circle? No. The political arguments stand on their own premises. However, Hobbes's *authority* collapses. Hobbes wanted to be the founder of a new science. A scientist who cannot demonstrate competence in the foundational science (geometry) loses the authority to teach the derived science (politics). So the threat was to his status as a "Scientific Legislator," rather than the internal logic of the covenant itself.

  ### 5. Scholarly Backing
  If you want to read more to see if this holds water, look into these sources:

  *   **Noel Malcolm:** He is the preeminent modern Hobbes scholar. His introductions to the Clarendon Edition of Hobbes's works discuss the mathematical works extensively and treats the feud seriously, not just as a hobby.
  *   **Steven Shapin & Simon Schaffer, *Leviathan and the Air-Pump*:** This is a classic text in the history of science. It discusses Hobbes's feud with Boyle, but it contextualizes his feud with Wallis perfectly. It argues that Hobbes's geometry was a political tool to enforce certainty and silence dissent. If his geometry fails, his tool for silencing political dissent breaks.
  *   **A.P. Martinich, *Hobbes: A Biography*:** Martinich goes deep into the Wallis feud and agrees that Hobbes saw it as a defense of his entire philosophical system against the "fools" at the universities.
  *   **Leo Strauss, *The Political Philosophy of Hobbes*:** An older classic, but Strauss emphasizes the "scientific" nature of Hobbes's politics and its dependence on the Galilean/Euclidean model.

  ### Conclusion
  You are not forcing it. You have correctly identified that for Hobbes, **Method is Message.**

  He believed that civil war was caused by disputes over undefined words and conflicting interpretations. Geometry was the antidote: a language where definitions are agreed upon, and conclusions are unavoidable. If he failed at geometry, he failed at the very tool he promised would save humanity from itself.

  Admitting Wallis was right wouldn't just mean "I bad at math." It would mean "My method does not guarantee truth," and "I am not the Galileo of Civil Science." For a man who built a system on the necessity of absolute authority, admitting intellectual error on his foundational science was likely psychologically and philosophically impossible.

  You're reading him right. Keep going down that rabbit hole.
