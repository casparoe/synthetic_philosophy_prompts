          *   *The One-Off Problem:* If a regularity happens only once, adding it to the Best System usually costs more in simplicity (extra axiom) than it gains in strength (predicts only one thing). Therefore, it's likely an accident, not a law.
          *   *Exception:* If the one-off event is part of a broader pattern that *is* simple/strong, it might be included, but a strictly isolated one-off is tough to classify as a law.

      *   **Anti-Humeanism (Armstrong's DTA - Dretske-Tooley-Armstrong):**
          *   *Ontology:* Universals (properties) + Relations of Necessitation ($N$). $N(F, G)$ means "Being F necessitates Being G."
          *   *Laws:* The relation $N(F, G)$ itself.
          *   *The One-Off Advantage:* $N(F, G)$ is a fact *over and above* the instances. So, even if $F$ and $G$ coincide only once, the *relation* could hold. It explains *why* they coincided.
          *   *The User's Objection (The Immanence Problem):* Armstrong rejects Platonic universals. Universals exist only if instantiated. If $N(F, G)$ holds, do $F$ and $G$ need multiple instances to be established as universals? If $F$ and $G$ are only instantiated once, are they really universals?

  3.  **Analyze the Tension in Armstrong's View:**
      *   *Armstrong's Defense:* Armstrong explicitly addresses this. He distinguishes between the *existence of the universal* and the *holding of the relation*.
      *   *Instantiation:* For $F$ and $G$ to exist, they need at least one instance. A single instance suffices for immanent realism (one red ball makes "redness" exist).
      *   *The Law:* The law is $N(F, G)$. Does $N(F, G)$ require multiple instances to be verified or to exist? Armstrong says no. The relation is a contingent fact about the universals.
      *   *The "Inference Problem":* The bigger issue for Armstrong isn't necessarily the single instance, but how $N(F, G)$ actually *produces* the regularity. (Van Fraassen's critique).
      *   *The "Single Case" Specifics:* Armstrong allows for probabilistic laws and functional laws where specific values might only be instantiated once. He argues that the *necessitation* is what matters, not the frequency.
      *   *Is the User Right?* The user suspects a tension. If universals are *abstractions from* patterns, a single case makes the universal shaky. But if universals are *constituents* of particulars, a single case suffices. Armstrong takes the latter view. So, technically, Armstrong *does* have the resources to call it a law, but it comes at a metaphysical cost (positing a brute modal fact for a single event).
      *   *Humean Counter:* A Lewisian would say, "You're just labeling an accident with a fancy name ($N$). Without a pattern, you have no inductive warrant to posit $N$."

  4.  **Evaluate the "Firmer Ground" for the Characters:**
      *   *Scenario:* One event in history.
      *   *Humean Stance:* Extremely hostile. A one-off axiom ruins simplicity. It's almost certainly a coincidence unless it simplifies a *lot* of other data (which the prompt says it doesn't).
      *   *Armstrongian Stance:* More hospitable, but metaphysically expensive. It requires believing in a modal connection that never repeats.
      *   *Which is better for the novel?*
