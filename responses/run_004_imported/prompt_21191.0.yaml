answer: |-
  This is an exceptionally sharp philosophical puzzle. You have identified a genuine tension in Armstrong's metaphysics that often gets glossed over in introductory summaries. Your friend gave you excellent advice, and your reading of Lewis and Armstrong is accurate enough that you are now spotting the fault lines in the architecture.

  To help you revise the scene, I need to validate your intuition about Armstrong's "Immanence Problem," clarify exactly where the Humean and Anti-Humean diverge on single-case laws, and then suggest how to stage the argument so the philosophy serves the drama rather than bogging it down.

  ### 1. The Humean Position (Lewis): The "Best System" Test

  David Lewis's Humean Supervenience posits that the universe is just a "mosaic" of local matters of particular fact (spacetime points with qualities). There is no modal "glue" holding them together.

  *   **Definition of Law:** A law is a theorem in the deductive system that best summarizes the mosaic, balancing **Simplicity** (few axioms) and **Strength** (predictive power).
  *   **The One-Off Problem:** For a Humean, a "law" is essentially a compression algorithm for data.
      *   If you add an axiom to your system that says "Event $E$ happens at time $t$," you increase the complexity of the system (more axioms) without gaining much strength (it only predicts one thing).
      *   Therefore, a regularity that holds exactly once is almost mathematically guaranteed to be classified as an **accident**, not a law. It is more "efficient" for the Best System to ignore it as noise than to codify it as a rule.
  *   **The Character's Argument:** A Lewisian character would argue: *"A law is a pattern. A single dot is not a pattern. To call this a law is to claim the universe is more complex than it needs to be just to accommodate a fluke."*

  ### 2. The Armstrongian Position (DTA): Necessitation Between Universals

  Armstrong rejects the Humean mosaic. He argues that laws are relations of **Natural Necessitation** ($N$) holding between Universals ($F$ and $G$). The law is $N(F, G)$.

  *   **The Advantage:** Because the law is a relation *between universals* (properties), it is distinct from the *instances* of those universals.
      *   Humean: Law = Regularity.
      *   Armstrongian: Law = The "Why" behind the Regularity.
  *   **The One-Off Claim:** Armstrong explicitly argues that $N(F, G)$ can hold even if $F$ and $G$ are only instantiated once. The necessitation relation is a fact about the properties, not a tally of the events. If the properties exist, the relation can hold, even if the opportunity for repetition never arises.
  *   **The Character's Argument:** An Armstrongian character would argue: *"A law isn't a pattern; it's a mechanism. The universe didn't just 'happen' to do this; it was *made* to do this by the nature of the properties involved. It could have happened again, even if it didn't."*

  ### 3. Your Objection: The Immanence Tension

  This is where your insight is philosophically potent. Armstrong is an **Aristotelian realist** about universals, not a Platonist.

  *   **Principle of Instantiation:** For Armstrong, there are no uninstantiated universals. "Redness" does not exist in a heaven of forms; it exists only if something is red.
  *   **The Tension:**
      1.  If a law is a relation ($N$) between universals ($F, G$), then $N$ is itself a second-order universal.
      2.  By the Principle of Instantiation, $N$ must be instantiated to exist.
      3.  The instantiation of $N(F, G)$ is the state of affairs: *This $F$ is necessitated to be $G$.*
      4.  If this happens only **once**, then the existence of the Law is identical to the occurrence of the single Event.

  **The Critique:** If the Law ($N$) only exists because the Event happened, and the Event only happened once, the Armstrongian struggles to explain how the Law is *general* enough to govern the event rather than just *describing* it. If the necessitation relation never "fires" more than once, how is it different from a Humean coincidence, other than by verbal fiat?

  **Armstrong's Defense (and its weakness):** Armstrong would reply that the *repeatability* is in the **properties**, not the history. Even if $F$ and $G$ only meet once, they are *capable* of meeting again. The law is about the *capacity* of the universals, not the frequency of their meeting.
  *   *Weakness:* This leans dangerously close to Platonism (properties having powers independent of their history), which contradicts his strict Immanence. If the "capacity" never manifests again, on what ground does it stand?

  ### 4. Which Account Gives Firmer Ground?

  If your characters want to insist this is a **Law**, the **Armstrongian (Anti-Humean)** view is the only one that allows it metaphysically. The Humean view structurally excludes one-off laws by definition.

  However, the **Humean** view is on firmer *epistemic* and *scientific* ground. Science relies on induction. A one-off regularity provides zero inductive warrant.

  **The Verdict for the Novel:**
  *   **Metaphysically:** The Anti-Humean view allows for a "Secret Law" that governed a unique event (e.g., the Big Bang, a singular anomaly).
  *   **Scientifically:** The Humean view correctly identifies that claiming a "law" for a single data point is methodologically suspect.

  **Your intuition about Immanence is the key to the conflict.** You can use it to show that the Anti-Humean character is taking a massive metaphysical risk to save their theory.

  ### 5. Drafting the Scene: Reconstructing the Dispute

  Here is how you can translate this metaphysical dispute into character dialogue that respects the philosophy you've studied.

  **Character A (The Humean / Skeptic):**
  *   **Stance:** Lewis/Best System.
  *   **Argument:** "Laws are summaries. If we add this to the equations, we make the universe more complex without gaining predictive power. It's an accident."
  *   **Line:** "You're trying to promote a coincidence to a commandment. A law has to pay for its keep. It has to predict something else. This predicts nothing but itself."

  **Character B (The Anti-Humean / Believer):**
  *   **Stance:** Armstrong/DTA.
  *   **Argument:** "Laws are mechanisms. The regularity is the *result*, not the *definition*. The properties necessitated this outcome."
  *   **Line:** "You're confusing the map with the territory. The pattern isn't the law; the constraint is the law. The universe was locked into this outcome by the nature of the fields involved. It didn't need to happen twice to be real."

  **The Pivot (Using Your Insight):**
  This is where you deploy your specific worry about Immanence. Character A can attack Character B's metaphysics.

  *   **Character A:** "But you're an Aristotelian, damn it. You don't believe in ghostly forms floating in the void. Universals exist in their instances. If this instance is unique, your 'necessitation' is just a label you're slapping on a single event. If the relation $N$ only holds once, it's not a relation, it's a history."
  *   **Character B:** "It's not about the history. It's about the capacity. The properties *could* have interacted again. The fact that they didn't is contingent. The necessity is real."
  *   **Character A:** "A capacity that never manifests is indistinguishable from a fantasy. Without a second instance, you can't distinguish a Law from a Miracle."

  ### 6. Recommendation for Revision

  Your friend is right that you need to understand the dispute, but you are right to worry about Armstrong's consistency.

  **To make the scene hold up:**
  1.  **Don't let the Anti-Humean win easily.** Acknowledge that their position is metaphysically "expensive." They are positing a brute modal fact (a necessitation relation) for a single event. This should feel like a radical, almost desperate move.
  2.  **Use the "Immanence" objection.** It is philosophically sophisticated and dramatically strong. It forces the Anti-Humean to admit they are stretching their own theory. This adds depth to the character—they are willing to break their own philosophical rules because the evidence demands it.
  3.  **The Stakes:** The Humean wants to preserve the **methodology of science** (no laws without prediction). The Anti-Humean wants to preserve the **intelligibility of the event** (it wasn't random, it was caused).

  **Final Advice:**
  The Armstrongian account gives your characters the *vocabulary* to call it a law, but the Humean account gives them the *reason* to doubt it. The tension between "It *must* have been a law (because it's too specific to be random)" and "It *can't* be a law (because laws require patterns)" is the heart of your scene.

  If you want the characters to be on "firmer ground" insisting it is a law, they must adopt a **modified Armstrongian view**: They must argue that the *conditions* for the law exist (the universals are real), even if the *opportunity* for the law to operate never recurs. They are arguing for a **dispositional** account of laws (powers inherent in the objects) rather than a regularity account. This sidesteps the Humean "pattern" requirement but leans into the "Immanence" risk you identified.

  **Summary for the Draft:**
  *   **Humean:** "One event is data, not a law."
  *   **Anti-Humean:** "One event is an instantiation of a necessity."
  *   **The Philosophical Twist:** "If that necessity never instantiates again, is it still a universal?"

  If you write the argument this way, you will satisfy a philosopher reader while keeping the dramatic stakes high. Your intuition about the tension in Armstrong is correct; let that tension drive the conflict.
