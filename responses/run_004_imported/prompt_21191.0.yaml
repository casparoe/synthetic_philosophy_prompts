      *   **Part 1: The Humean Challenge (Lewis):** Explain BSA clearly. Focus on Simplicity vs. Strength. Explain why a one-off fails the "Best System" test (costly axiom, low payoff).
      *   **Part 2: The Armstrongian Response (DTA):** Explain $N(F, G)$. Explain why it *seems* to allow one-offs (the relation is distinct from the instances).
      *   **Part 3: The Immanence Objection (The User's Insight):** This is the core. Dive into Aristotelian vs. Platonic universals.
