      *   *Textualism:* The Constitution doesn't say "slave" or "slavery." It uses euphemisms ("person held to service," "importation of such persons"). Therefore, on its face, it is colorblind.
      *   *Preamble/Purpose:* The Preamble sets the goals ("establish Justice," "secure the Blessings of Liberty"). Ambiguous clauses must be interpreted to further these goals, not defeat them.
      *   *Intent vs. Enactment:* The secret intentions of the Framers (even if pro-slavery) do not control the meaning of the public text enacted by "We the People." (This is a key move against Taney in *Dred Scott*).
      *   *Natural Law:* There is a higher law of liberty. The Constitution should be read, if possible, to conform to natural rights.

  3.  **Analyze the Modern Camps:**
