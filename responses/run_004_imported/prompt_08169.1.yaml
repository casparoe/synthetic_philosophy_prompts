      *   *Cons:* Douglass's "public meaning" isn't just linguistic; it's infused with natural law. He argues the *purpose* (Preamble) dictates the meaning of the clauses. A strict OPM might say the public in 1787 *did* understand "persons held to service" to mean slaves, regardless of the word "slave." Douglass denies this legal effect, not just the linguistic label.

  5.  **Evaluate Douglass against Living Constitutionalism:**
      *   *Pros:* He reads the Constitution in light of "Justice" and "Liberty" (broad principles). He wants the Constitution to serve the moral needs of the present (abolition). He rejects the dead hand of the pro-slavery Framers.
      *   *Cons:* He doesn't argue the meaning *changes* over time. He argues the meaning was *always* antislavery, we just failed to see it. He is deeply textualist, not just pragmatic. He believes the text *commands* freedom, not that we should update it to allow freedom.

  6.  **Synthesize: The "Abolitionist Originalism" or "Higher Law Originalism":**
