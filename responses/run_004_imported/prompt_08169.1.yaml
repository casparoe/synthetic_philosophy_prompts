      *   **Living Constitutionalism:**
          *   Focus: The Constitution evolves with changing societal values and circumstances.
          *   Constraint: Less bound by history, more focused on contemporary justice/prudence.
          *   Key Figure (Modern): Brennan, Breyer, etc.
