      *   He is an *originalist* in that he seeks the authority of the enacted text against the intentions of the drafters.
      *   He is a *natural lawyer* in that he assumes the text must be compatible with fundamental rights.
      *   He resists *Living Constitutionalism* because he doesn't want to evolve the text; he wants to recover its true (antislavery) meaning.
      *   He resists *Conservative Originalism* because he uses originalist tools to achieve radical social change, arguing that the "original" meaning was actually progressive (antislavery), contrary to historical practice.

