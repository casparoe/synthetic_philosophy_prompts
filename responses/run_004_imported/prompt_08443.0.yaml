answer: |-
  **Title:** The Cost of Coherence: Defending Level-Splitting in Higher-Order Evidence Cases

  **Introduction**

  Epistemology has long harbored a suspicion of akrasia. Just as it seems practically irrational to intentionally act against one's better judgment, it seems epistemically defective to believe *P* while simultaneously believing that one's evidence does not support *P*. This intuition is codified in the Non-Akrasia Constraint: rationality forbids holding contradictory attitudes across different levels of belief. However, the rise of higher-order evidence (HOE) literature has put this constraint under immense pressure. When evidence about the reliability of our reasoning conflicts with the reasoning itself, we face a dilemma: preserve coherence by downgrading our first-order belief, or preserve fidelity to the first-order evidence by accepting an akratic state.

  This essay argues that the Non-Akrasia Constraint is false as a strict normative principle. While coherence is a genuine epistemic value, it is subordinate to the fundamental norm of evidence-responsiveness. In cases of misleading higher-order evidence, the rational agent *must* engage in level-splitting. To demand coherence in these instances is to demand that the agent ignore their best evidence about the world in favor of maintaining a tidy psychological architecture. I will defend this position by analyzing the classic "impairment case," demonstrating that the Non-Akrasia view leads to an untenable skepticism, whereas level-splitting preserves the truth-connection essential to epistemic rationality.

  **The Case: The Drugged Mathematician**

  To ground the debate, consider a variation of David Christensen's impairment case. Let us call the agent "S." S is a competent mathematician working through a complex proof. S checks the steps carefully, finds no errors, and becomes highly confident that the conclusion *P* is true. The first-order evidence (the proof itself) strongly supports *P*.

  However, midway through, a reliable colleague informs S that the coffee S drank an hour ago was laced with a drug. This drug is known to cause massive overconfidence in mathematical reasoning while leaving the subject feeling completely normal. The colleague is trustworthy, and S has no reason to doubt the testimony. This testimony constitutes higher-order evidence: it is evidence that S's cognitive faculties are currently unreliable regarding *P*.

  S is now in a bind. S possesses the proof (FOE) which says *P* is true. S possesses the testimony (HOE) which says "S's belief-forming process regarding *P* is unreliable." If S follows the FOE, S believes *P*. If S follows the HOE, S believes "My evidence does not support *P*." If S does both, S is epistemically akratic.

  **The Non-Akrasia Challenge**

  Proponents of the Non-Akrasia Constraint, such as Sophie Horowitz, argue that rationality is fundamentally about guidance. For a norm to guide action or belief, an agent must be able to comply with it consciously. If S believes "My evidence doesn't support *P*," but continues to believe *P*, S is treating their own assessment of the evidence as irrelevant. Horowitz argues that this state is structurally irrational. It creates a fracture in the agent's perspective: from the inside, S admits there is no reason to believe *P*, yet S believes it anyway.

  On this view, the arrival of the HOE acts as a "defeater." Once S learns about the drug, the original confidence in the proof is undermined. To remain rational, S must lower their confidence in *P* to match their confidence in the reliability of their reasoning. The Non-Akrasia camp insists that coherence between levels is a precondition for rationality. If you think you are guessing, you cannot rationally claim to know. Therefore, the rational response to the drug case is to suspend judgment on *P*. To do otherwise is to be blind to one's own epistemic situation.

  The strength of this view is its preservation of the "transparency" of rationality. It ensures that an agent's view of what is rational aligns with what they actually believe. It avoids the awkwardness of an agent who asserts, "I believe *P*, but I admit I have no good reason for it."

  **The Level-Splitting Defense**

  The Level-Splitting view, championed by philosophers like Alex Worsnip, rejects the idea that coherence is the master norm. Instead, it posits that there are distinct normative demands: the demand to respond to first-order evidence and the demand to respond to higher-order evidence. In standard cases, these demands align. In HOE cases, they conflict.

  When S receives the drug testimony, S gains evidence that their *process* is flawed. However, S does *not* gain evidence that *P* is false. The drug does not change the mathematical facts; 2+2 still equals 4 even if a drugged person calculates it. S's first-order evidence (the proof) remains intact. If S lowers confidence in *P* solely because of the drug, S is allowing evidence about their *psychology* to override evidence about the *math*.

  Worsnip argues that it is possible to satisfy the demand of HOE (by believing "my evidence doesn't support *P*") while simultaneously satisfying the demand of FOE (by believing *P*). This results in an akratic state, but Worsnip contends that this state is not irrational; it is merely unfortunate. The agent is "fragmented," holding different attitudes in different mental compartments, but they are respecting all the evidence they have. To force coherence would require ignoring the first-order evidence, which is a greater epistemic sin than holding contradictory levels of belief.

  **The Verdict: Evidence Trumps Coherence**

  The Non-Akrasia view is seductive because it prioritizes the agent's internal harmony. However, it fails because it severs the essential link between rationality and truth. Epistemic rationality is not primarily about having a consistent mind; it is about believing in accordance with the truth-conducive evidence available.

  In the Drugged Mathematician case, the Non-Akrasia view requires S to suspend judgment on *P*. But consider the implications: If S suspends judgment, S is failing to believe a proposition that is supported by a valid proof. S is letting evidence about a *possible* impairment override the *actual* derivation. This opens the door to a vicious skepticism. Any time I suspect I might be tired, biased, or drugged, the Non-Akrasia constraint demands I lower my confidence, regardless of how strong my first-order evidence is. This makes rational belief too fragile, subject to collapse by any higher-order doubt, even misleading ones.

  Therefore, I defend the Level-Splitting view with the following verdict: **Epistemic akrasia is rationally permitted, and often required, when higher-order evidence is misleading regarding the reliability of a process but does not negate the first-order evidence.**

  The Non-Akrasia principle treats coherence as a constitutive norm of rationality. I argue it is merely a derivative one. Coherence is valuable because, usually, incoherence signals that someone is ignoring evidence. But in HOE cases, we know *why* the incoherence exists: it exists because the agent is faithfully tracking two different sets of evidence that point in different directions. S believes *P* because the proof is sound. S believes "My evidence doesn't support *P*" because the drug testimony suggests the proof might be misinterpreted.

  If S drops the belief in *P* to achieve coherence, S is effectively saying, "The possibility that I am wrong is more evidentially weighty than the proof I am holding in my hand." That is not humility; it is evidential negligence. The rational agent must prioritize the evidence that bears directly on the truth of *P* (the math) over the evidence that bears on the reliability of the believer (the drug), provided the first-order evidence is sufficiently strong.

  This does not mean akrasia is always good. In cases where the higher-order evidence is *not* misleading—for example, if S actually finds a mistake in the proof upon re-examination—then coherence should be restored by dropping *P*. But in the specific context of misleading HOE (like the drug case), the requirement to respect the total evidence forces a split. The "irrationality" of akrasia is a lesser evil than the irrationality of ignoring conclusive first-order evidence.

  **Conclusion**

  The demand for non-akrasia is a demand for psychological cleanliness at the cost of epistemic fidelity. In preparing for a world where our cognitive faculties are often under scrutiny, we should not adopt a norm that forces us to abandon our best reasoning whenever our reliability is questioned. The Drugged Mathematician should trust the math, even while admitting the drug makes that trust risky. This state is akratic, but it is the only state that honors the evidence. Therefore, the Non-Akrasia Constraint must be rejected. Rationality is not about keeping our levels aligned; it is about keeping our beliefs aligned with the world, even if that alignment leaves our self-conception in fragments.
