      Hi everyone. Biscuit was great. Walter loved him. Some know Walter studies Kant. Kant says we shouldn't hurt animals because it makes us mean. Walter kept Biscuit because Biscuit was loyal. It would be wrong to throw him away. That shows Walter's goodness. We will miss Biscuit.

