  Here is a draft for the eulogy. It is designed to be spoken in about two to three minutes. It walks the line by framing Walter's care as a matter of *his* integrity and gratitude (the indirect duty view), rather than Biscuit's inherent rights, while still validating the deep emotional bond.

  ***

  Hi everyone. Thank you for coming out to the backyard.

  For those of you who don't know me, I'm [Your Name], Walter's great-nephew/niece. I'm also in his seminar this semester, which has given me a front-row seat to the way my uncle thinks about the world. But today, I'm not really here as a student. I'm here as someone who watched Walter and Biscuit grow old together.

  Fifteen years is a long time. That's a lifetime in dog years, but it's also a significant chapter in a human life. Biscuit wasn't just a pet; he was a constant. He was there through the drafts of books, the promotions, the quiet mornings, and the hard days.

  I know Walter asked me to speak because he's finding it difficult to find the words right now. And I think I know why. Walter has spent his whole career thinking very carefully about what we owe to the creatures who share our lives. He's always been clear that we don't care for animals because they are little humans in fur coats. We care for them because of what that care says about *us*.

  There is a passage Walter loves from Kant's lectures, about how we should not cast aside an old dog that has served us faithfully. He says that doing so would be a betrayal of the relationship—a failure of gratitude on the part of the human.

  In these last few years, as Biscuit slowed down and the vet bills started piling up, some people might have asked if it was "worth it." But Walter never asked that question. To Walter, Biscuit had earned his keep, over and over again, through fifteen years of loyalty. To turn away now would have been to diminish Walter's own capacity for fidelity. He cared for Biscuit not because Biscuit had a right to demand it, but because Walter is the kind of man who honors a debt of gratitude.

  And that is why we are all so heartbroken. Because that fidelity was returned in spades. Biscuit brought out the best in Walter. He softened the edges of the house. He demanded walks when the work got too heavy. He offered a warmth that didn't require a single argument to justify.

  We are grieving today not because we've lost a moral agent, but because we've lost a faithful companion who helped make us more human.

  Walter, you kept your promise to him. You honored the service he gave you. And Biscuit... well, he was a good boy. In every sense of the word.

  Rest easy, Biscuit.
