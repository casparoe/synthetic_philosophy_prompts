      *   **Occasion:** Small backyard memorial, informal, a couple of minutes.
      *   **Audience:** Family (no philosophy background, need comfort/warmth) + Former PhD students (Kant scholars, will notice philosophical consistency).
      *   **Key Constraint (The "Walter Rule"):** Do *not* imply Biscuit had intrinsic moral worth ("ends in himself," "deserved this for his own sake"). Walter's career is built on the view that animals are not ends-in-themselves (no direct duties *to* them, only indirect duties *regarding* them).
      *   **Key Constraint (The "Heart Rule"):** Do *not* sound cold. Walter loved Biscuit deeply. He kept Biscuit alive despite high vet bills/old age based on the Kantian analogy of merit/service (keeping an old servant).
      *   **Goal:** Comfort the family, honor Walter's integrity/work, honor the dog, maintain philosophical consistency without being pedantic.

  2.  **Deconstruct the Philosophical Tightrope:**
      *   *Kant's View on Animals:* We have no direct duties to animals because they are not rational agents (not persons). However, cruelty to animals dulls our humanity and makes us more likely to be cruel to humans. Kindness to animals cultivates our own moral character.
      *   *The "Merit/Service" Analogy:* Kant argues in *Lectures on Ethics* that we should not cast off an old dog that has served us faithfully. It's not because the dog has rights, but because discarding loyalty weakens *our* capacity for gratitude and fidelity.
      *   *The Challenge:* How to express deep love and grief without saying "Biscuit was a person" or "Biscuit had rights."
      *   *The Solution:* Focus on what Biscuit *did for Walter* and what caring for Biscuit *made Walter*. The grief is about the loss of a companion who shaped Walter's humanity, not the violation of Biscuit's rights.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the gathering, the informality, and the bond. Keep it warm.
      *   **The Bond (Family Focus):** Describe Biscuit as a companion. 15 years is a long time. He was part of the family. This comforts the non-philosophers.
      *   **The Philosophical Pivot (Student Focus):** Address Walter's care. Why did he keep Biscuit so long? Why the vet bills?
          *   *Avoid:* "Biscuit deserved to live."
          *   *Use:* "Walter owed it to *himself* to be loyal." "Biscuit earned his keep through companionship." "Discarding him would have been a betrayal of the relationship."
      *   **The "Indirect Duty" Nuance:** Frame the kindness as a reflection of Walter's character. Biscuit brought out the best in Walter.
      *   **Closing:** A farewell that honors the memory without elevating the dog to a moral agent.

  4.  **Refining the Language (The "Kantian Code"):**
      *   *Forbidden:* "Rights," "Intrinsic value," "Ends in himself," "Moral agent," "Deserved happiness."
      *   *Allowed:* "Fidelity," "Service," "Companionship," "Gratitude," "Humanity," "Character," "Analogy," "Bond."
