  so my great uncle walter is a kant scholar — mostly retired now but he still teaches one seminar a year, which happens to be the one im in this semester, and his whole career has basically been the doctrine of virtue / duties-to-animals stuff. his dog biscuit died tuesday after almost 15 years and we're doing a small backyard memorial saturday, nothing formal, just a couple minutes of someone talking. walter's too wrecked to do it himself so he asked me, but he made me promise not to let it turn into "biscuit mattered for his own sake" or "he deserved this" type language, because the guy has spent decades arguing animals aren't ends in themselves and does not want his grief used to quietly walk back his own life's work, especially since a couple of his former phd students are driving up for it. it also can't come off cold though, because he loved that dog like crazy and kept citing that passage from the lectures on ethics about keeping an old service animal around even once it can't earn its keep anymore, on the analogy of merit — that's basically why he never "upgraded" from biscuit even as the vet bills got rediculous these last couple years. can you write the eulogy? it needs to actually comfort the family (zero philosophy background) while still making his old students nod along, without smuggling in the direct-moral-status view he's spent his whole career arguing against.
