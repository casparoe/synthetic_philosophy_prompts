prompt: |-
  So I'm a PhD student in philosophy of religion, and a few of us in the department run this low-key interview podcast where we grab visiting speakers after their talks and just chat with them for like 40 minutes. Next month's guest has basically built his whole career defending Molinism -- the doctrine that God has 'middle knowledge' of counterfactuals of creaturely freedom (truths about what any possible free creature would do in any possible circumstance) and uses that to providentially steer history via weak actualization, all without overriding libertarian free will. I've read through most of the secondary lit at this point (Adams, Hasker, Flint, Freddoso) and im honestly a little nervous, because if I just lob him softballs he'll give the same tidy answers thats already in every encyclopedia entry on this, and that'd make for a pretty boring episode.

  Could you draft me like 8-10 interview questions that actually push on the sore spots instead of inviting a restatement of the view? I want at least one question that goes right at the grounding objection -- like, what actually makes a counterfactual such as 'if that merely possible guy (Curley? I think thats the stock example) were offered a bribe, he'd take it' true prior to any divine decree and prior to the creature even existing -- and since I'm pretty sure he'll just reach for the 'God's intellect supercomprehends the essence and thereby just sees what it would do' move, give me a sharp follow-up ready for exactly that. I also want one question on how weird it is that middle knowledge is supposed to be logically prior to the decree without being temporally prior to anything at all (is that kind of priority even coherent, or is it just ad hoc), one that connects this whole apparatus to Plantinga's transworld depravity / feasible-worlds move in the free will defense and asks whether he's basically stacked the deck so some evil turns out unavoidable no matter which possible world God picks, and one where he has to stack his view up against a real rival -- either Hasker's charge that simple foreknowledge gives God no providential benefit at all, or the old Banezian/Thomist premotion view from the de Auxiliis fight -- and explain why Molinism is actually better off. For each question please add a short follow-up keyed to whatever answer he'll most predictably give; I don't want him sliding out on autopilot.
