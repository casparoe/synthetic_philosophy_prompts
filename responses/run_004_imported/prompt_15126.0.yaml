  9.  *(Self-Correction during drafting)*: Make sure not to dismiss the Wager too easily. The Wager *did* introduce the structure. But emphasize that the Mugging removes the "infinity" crutch. The "Many Gods" objection is actually a *stronger* objection to the Wager than to the Mugging, which paradoxically makes the Mugging a *more serious* challenge to decision theory (because it survives without the theological clutter).

