answer: |-
  This is an exceptionally sharp observation. You have identified the central tension in modern meta-ethics: the conflict between the *phenomenology* of moral discourse (which looks and acts like factual discourse) and the *ontology* of moral anti-realism (which denies moral facts).

  The commenter you encountered was correct that the Frege–Geach problem is the primary technical objection to simple expressivism, but they were likely too hasty in concluding that it forces you into realism or silences your arguments.

  Here is an analysis of the implications of the Frege–Geach problem for your position, how the standard solutions attempt to rescue ordinary moral argumentation, and whether they succeed or merely hide the cost.

  ### 1. The Core Problem: Why Modus Ponens Seems to Fail
  To understand the implication, we must look at why simple expressivism (like Ayer's emotivism) breaks logic.

  In classical logic, for an argument to be valid, terms must be **univocal**. The word "wrong" must mean the same thing in Premise 1 as it does in Premise 2.
  *   **Premise 1:** If factory farming is wrong, then we ought to stop it.
  *   **Premise 2:** Factory farming is wrong.
  *   **Conclusion:** Therefore, we ought to stop it.

  **The Expressivist Dilemma:**
  *   In **Premise 2**, you assert "Factory farming is wrong." For a simple expressivist, this means "Boo factory farming!" (expressing an attitude).
  *   In **Premise 1**, you do *not* assert that factory farming is wrong. You are hypothesizing. You are not saying "Boo factory farming!" inside a conditional. If you were, the conditional would mean something like "If [Boo factory farming!], then..." which is nonsense. You cannot have an exclamation mark inside an "if" clause.

  If "wrong" means "expressing an attitude" in Premise 2, but does *not* mean that in Premise 1, you have committed the fallacy of **equivocation**. The argument is invalid. If simple expressivism is true, moral arguments are logically broken.

  **The Implication for You:**
  If you want to continue using Modus Ponens in ethics while remaining an anti-realist, you cannot be a *simple* emotivist. You need a more sophisticated theory that explains what moral sentences mean when they are not being asserted, without conceding that they describe mind-independent facts.

  ### 2. Can You Keep Arguing? (The Quasi-Realist Solution)
  The good news is that the dominant forms of modern expressivism were built specifically to solve this problem so that people like you *can* keep arguing. The two figures you mentioned, Simon Blackburn and Allan Gibbard, offer the standard defenses.

  #### Simon Blackburn: Quasi-Realism
  Blackburn admits that moral language *looks* realist. It has truth values, conditionals, and negations. His project is "quasi-realism": earning the right to talk *as if* there are moral truths without believing there actually are any.

  *   **The Solution:** Blackburn argues that logic applies to **attitudes** just as it applies to beliefs.
  *   **How it works:** To accept "If X is wrong, then Y is wrong" is not to describe a relation between facts. It is to have a higher-order attitude: a commitment that disapproving of X *requires* disapproving of Y.
  *   **Validity:** An argument is valid not because it preserves "truth" (since there are no moral truth-conditions), but because it preserves **consistency of attitude**. If you disapprove of factory farming, and you have a higher-order commitment that disapproving of factory farming entails disapproving of buying factory-farmed meat, then you are logically committed to disapproving of buying the meat. If you don't, you are in a state of "moral contradiction" (a clash of attitudes).

  #### Allan Gibbard: Norm-Expressivism
  Gibbard refines this by focusing on **norms** and **planning** rather than just emotions.

  *   **The Solution:** To judge something "wrong" is to accept a norm that forbids it.
  *   **How it works:** Gibbard uses a possible-worlds semantics for norms. A moral sentence is "true" relative to a system of norms.
  *   **Validity:** Logic works because we can compare different "normative worlds." Modus Ponens holds because if a norm system forbids X, and the system entails that forbidding X requires forbidding Y, then the system forbids Y.

  ### 3. Do These Solutions "Relocate the Difficulty"?
  You asked whether these theories rescue ordinary argument or just hide the problem. This is a matter of ongoing philosophical debate, but here is the pragmatic verdict for your position.

  **They do not merely relocate the difficulty; they redefine the engine of logic.**
  Critics (often moral realists like Peter Geach himself, or later, Russ Shafer-Landau) argue that Blackburn and Gibbard change the subject. They say:
  > "Logic is about truth preservation. If you deny moral truth, you can't have moral logic. You've just invented a parallel system called 'attitude consistency' and pretended it's logic."

  **However, for your purposes as a rationalist arguer, this distinction is largely inert.**
  Why? Because in practice, "truth preservation" and "consistency of commitment" yield the exact same inference rules.
  *   If you are a Realist: You argue that the conclusion *must be true* if the premises are true.
  *   If you are a Quasi-Realist: You argue that the conclusion *must be accepted* if the premises are accepted, on pain of irrationality.

  When you are in a comment thread arguing about factory farming, the pressure you apply to your opponent is the same: "You accept A, and you accept If A then B, so you are irrational if you don't accept B." Whether that irrationality is a violation of logical laws governing the universe (Realism) or a violation of coherence among your own planning states (Expressivism) does not change the rhetorical force of the argument.

  ### 4. Practical Implications for Your Position
  If you adopt a sophisticated expressivism (like Blackburn's or Gibbard's) to solve Frege-Geach, here is what follows for your practice:

  **1. You can use Modus Ponens without hypocrisy.**
  The charge that you are "smuggling in realism" is only valid if you are a *simple* emotivist. If you are a quasi-realist, you have an explicit account of why conditionals work. You are not smuggling; you are using the specialized machinery your meta-ethics provides.

  **2. "Truth" becomes deflationary.**
  You can say "It is true that factory farming is wrong," but you must understand "true" deflationarily. To say "It is true that P" is just to say "P." It does not mean "P corresponds to a moral fact in the universe." This allows you to speak naturally without ontological commitment.

  **3. Disagreement is a clash of commitments, not a map error.**
  When you argue with a moral realist, you might feel like you are talking past each other.
  *   They think: "One of us is failing to detect the moral reality."
  *   You think: "One of us has a set of norms/attitudes that is more coherent, or we are trying to align our different norms."
  *   *Implication:* You cannot appeal to "moral perception" to win an argument. You must appeal to consistency, empathy, or the practical consequences of holding certain norms.

  **4. The "Open Question" remains open.**
  Frege-Geach solves the logic problem, but it doesn't solve the motivation problem entirely. A realist might ask, "Why should I care about being consistent in my attitudes?" The expressivist answer is usually, "Because that's what it means to be a rational agent." This is a weaker foundation than "Because the Universe demands it," but for a rationalist community that already values instrumental rationality and coherence, it is usually sufficient.

  ### 5. Summary Recommendation
  You are in a defensible position. The rationalist practice of arguing ethics using standard logic while denying moral realism is essentially **Quasi-Realism in action**, even if the participants don't use the label.

  *   **The Commenter's Objection:** Valid against 1930s Emotivism. Invalid against modern Expressivism.
  *   **The Cost:** You must accept that moral "validity" is ultimately grounded in the coherence of human attitudes/norms, not in mind-independent logical relations between moral properties.
  *   **The Benefit:** You get to keep doing exactly what you are doing—arguing vigorously about factory farming using syllogisms—without needing to believe in spooky moral particles.

  If you want to read one thing to solidify this, I recommend Simon Blackburn's *Ruling Passions*, specifically the chapters on logic and truth. It is written precisely for someone in your position: someone who wants to take ethics seriously, argue logically, but remain naturalistic and anti-realist.

  In short: You are not smuggling realism. You are just using a more complex engine than your opponent realizes, one designed to run on attitude-fuel while looking exactly like a fact-engine.
