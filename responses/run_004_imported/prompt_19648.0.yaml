prompt: |-
  At work I've been putting together an internal tool for deciding when to stop an A/B test and ship a feature rather than keep collecting data, and in reading up on the statistics behind that decision I ran across a result a former colleague of mine (a philosophy major before she became an engineer) calls "Good's theorem," after the statistician I. J. Good, from a paper apparently titled "On the Principle of Total Evidence." As I understand it, the theorem shows that for a Bayesian decision-maker, the expected value of any piece of cost-free evidence is never negative: looking before you choose can only help you or leave you exactly as well off, never hurt you, provided you update on it correctly and remain free to act exactly as you would have if you'd never seen it. My former colleague treats this as basically settling, once and for all, that "ignorance is bliss" is a comforting myth rather than a genuinely rational stance for anyone who wants to call themselves a good Bayesian.

  That claim has been nagging at me, though, because it seems to clash with cases that strike me as obviously sensible rather than confused. My sister recently declined to learn the result of a predictive genetic test for a condition with no available treatment either way, on the grounds that finding out would only make her anxious without changing a single thing she'd do. Along similar lines, I have friends who ask not to be told sports scores before watching a delayed broadcast, and who report being genuinely happier, even in hindsight, for having avoided the spoiler. If Good's theorem really proves that a rational Bayesian can never be made worse off by free information, doesn't it follow that my sister and these friends are all committing a rationality error dressed up as a preference, and that a sufficiently rational agent would always choose to look? I would like to understand whether the theorem actually forces that conclusion, or whether I am stretching it further than it was meant to cover.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Context:** The user is building an internal A/B testing tool (stopping rules).
      *   **Core Concept:** They encountered "Good's Theorem" (I. J. Good, "On the Principle of Total Evidence").
      *   **Understanding of Theorem:** Expected value of cost-free evidence is non-negative for a Bayesian decision-maker. Looking before choosing helps or does nothing, never hurts (if updating correctly and free to act).
      *   **Colleague's Interpretation:** "Ignorance is bliss" is a myth; rational Bayesians must always seek free information.
      *   **User's Counterexamples:**
          1.  Sister declining predictive genetic test (no treatment, causes anxiety).
          2.  Friends avoiding sports spoilers (happier without knowing).
      *   **The Question:** Does Good's Theorem actually imply these people are irrational? Or is the theorem being stretched/misapplied?

  2.  **Analyze Good's Theorem:**
      *   *What does it actually say?* In decision theory, the Value of Information (VoI) is non-negative *if* the information can change your decision to one with higher expected utility.
      *   *Key Assumption:* The utility function depends *only* on the state of the world and the action taken, *not* on the knowledge itself.
      *   *Mathematical Intuition:* $E[U|info] \ge E[U|no\_info]$. This holds because with info, you can always choose the action you would have chosen without info, but you might find a better one.
      *   *The Catch:* This assumes the utility function $U(action, state)$ is independent of the information state.

  3.  **Evaluate the Counterexamples against the Theorem:**
      *   *Genetic Test:*
          *   Action: Live life.
          *   State: Have gene / Don't have gene.
          *   Utility: If utility depends *only* on health and life choices, knowing doesn't change actions (no treatment). So VoI = 0.
          *   *However:* The user says finding out makes her "anxious." This means the *knowledge itself* enters the utility function. $U(action, state, knowledge)$.
          *   If knowledge causes disutility (anxiety), then the cost of information is not zero (psychological cost), or the utility function is state-dependent in a way Good's theorem doesn't account for in its simplest form.
      *   *Sports Spoilers:*
          *   Action: Watch game.
          *   State: Team wins / Team loses.
          *   Utility: Enjoyment of watching.
          *   *However:* Enjoyment depends on *uncertainty*. Knowing the score changes the experience of watching. The utility of the action "watch game" is lower if "know score" is true.
          *   Again, the information state directly modifies the utility of the outcome.

  4.  **Synthesize the Resolution:**
      *   Good's Theorem holds for *instrumental* value of information (information used to make better decisions).
      *   It does *not* hold for *intrinsic* value of information (information that directly affects happiness/utility).
      *   The colleague's interpretation ("ignorance is bliss is a myth") is only true within a specific, restricted model of rationality where utility is purely consequentialist regarding external states, not internal states of knowledge.
      *   The sister and friends are not irrational; their utility functions simply include "not knowing" as a positive term or "knowing" as a negative term (cost).

  5.  **Drafting the Response:**
      *   **Acknowledge and Validate:** Start by confirming the user's intuition. The colleague is overgeneralizing. The counterexamples are valid.
      *   **Explain Good's Theorem (Technical but accessible):**
          *   Define Value of Information (VoI).
          *   Explain the inequality: $E[U|observe] \ge E[U|don't observe]$.
          *   Highlight the critical assumption: The option to ignore the information exists (you can do what you would have done), and the utility depends on the *outcome*, not the *observation*.
      *   **Address the "Cost-Free" Assumption:**
          *   Good's theorem assumes *cost-free*.
          *   Psychological distress (anxiety) is a cost.
          *   Spoilers reduce the utility of the experience (watching the game).
      *   **Distinguish Instrumental vs. Intrinsic Value:**
          *   Instrumental: Helps you choose better actions (A/B testing context).
          *   Intrinsic: The knowledge itself changes the utility (Genetic/Sports context).
      *   **Revisit the A/B Testing Context:**
          *   Why does it work there? Because the goal is maximizing conversion/revenue. Knowing the result helps stop/continue. The knowledge itself doesn't hurt revenue (usually).
          *   *Caveat:* Even in A/B testing, there are costs (time, opportunity cost, "peeking" problems if not done sequentially/Bayesian correctly). But strictly speaking, VoI is positive for the *decision*.
      *   **Conclusion:** The theorem is mathematically correct within its axioms, but the axioms don't cover cases where knowledge itself alters utility. The sister and friends are rational Bayesians with different utility functions.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is anxiety a "cost" or a utility change?* It can be modeled either way. If I treat anxiety as a cost $C > 0$, then VoI - $C$ can be negative. If I treat it as part of the utility function $U(state, knowledge)$, then the theorem's assumption that $U$ is independent of knowledge is violated. Both lead to the same result: Good's theorem doesn't apply.
      *   *The "Freedom to Act" clause:* Good's theorem says you can act *as if* you didn't know. But in the sports case, you can't "act as if you didn't know" while watching the game. The experience is fundamentally altered. You can't un-know the score.
      *   *Philosophy Major Colleague:* Acknowledge her background. Philosophers love edge cases. She might be arguing for a specific normative ethics (pure consequentialism) rather than descriptive decision theory.
      *   *A/B Testing:* Mention "optional stopping" vs. "Value of Information." In frequentist stats, peeking is bad. In Bayesian, it's fine *if* you update. But Good's theorem is about whether to *collect* the data, not when to stop given you are collecting. Actually, the user is building a tool to decide *when to stop*. This is exactly VoI. If the cost of collecting more data (time/server cost) exceeds the VoI, stop. Good's theorem says VoI $\ge 0$. It doesn't say VoI > Cost.

  7.  **Final Polish:**
      *   Tone: Professional, empathetic, intellectually rigorous.
      *   Structure:
          1.  Direct Answer (You are right, colleague is overextending).
          2.  The Math/Logic of Good's Theorem (The "Instrumental" view).
          3.  Where it Breaks (The "Intrinsic" view / Utility of Knowledge).
          4.  Applying to Examples (Genetic, Sports).
          5.  Applying to Work (A/B Testing).
          6.  Summary.

  8.  *(Self-Correction during drafting)*: Make sure to mention that in the A/B test context, "cost-free" is rarely true. There is opportunity cost. Good's theorem says information is non-negative *gross*, not *net*.

  9.  **Final Review against constraints:** The user wants to understand if the theorem forces the conclusion. The answer is "No." Explain why.

  **(End of thought process)**
answer: |-
  You are right to be skeptical, and your intuition is correct: your colleague is overextending the theorem. While Good's Theorem is mathematically sound within its specific axioms, it does not prove that "ignorance is never bliss" in the broad, human sense.

  Your sister and your sports-watching friends are not committing rationality errors. They are simply operating with utility functions that Good's Theorem, in its standard formulation, does not account for.

  Here is the breakdown of why the theorem holds for your A/B testing tool but fails to condemn your sister's choice.

  ### 1. What Good's Theorem Actually Says
  I. J. Good's 1967 result concerns the **Expected Value of Information (EVI)**. In decision theory, the theorem states that for a Bayesian agent facing a decision, the expected utility of making a decision *after* observing a piece of evidence is greater than or equal to the expected utility of making the decision *without* that evidence, provided two conditions are met:

  1.  **The evidence is cost-free.** (It costs nothing to acquire.)
  2.  **The utility depends only on the action taken and the state of the world, not on the information itself.**

  The logic is straightforward: Once you have the information, you are free to take the exact same action you would have taken without it. Therefore, the worst-case scenario is that the information changes nothing, and you break even. The best-case scenario is that the information allows you to switch to a higher-utility action. Thus, the expected value is non-negative.

  In the context of your **A/B testing tool**, this theorem is incredibly useful. It justifies the logic that you should keep collecting data until the *cost* of collecting more data (server time, delayed launch, opportunity cost) exceeds the *expected value* of that data in improving your decision. Good's Theorem guarantees that the "value" part of that equation is never negative.

  ### 2. Where the Theorem Breaks Down: The Utility of Knowledge
  The theorem fails to apply to your sister and your friends because it assumes that knowledge is purely **instrumental**. It assumes you only care about knowledge insofar as it helps you manipulate the external world.

  However, human beings often derive **intrinsic** utility (or disutility) from the state of knowing itself.

  #### The Genetic Test Case
  Your sister's utility function looks something like this:
  $$U(\text{Action}, \text{Health State}, \text{Knowledge State})$$

  Good's Theorem assumes $U$ is independent of $\text{Knowledge State}$. But for your sister, $\text{Knowledge State} = \text{Positive}$ introduces a term for "Anxiety."
  *   **If she doesn't know:** She lives her life with baseline anxiety.
  *   **If she does know:** She lives her life with baseline anxiety + high anxiety (because there is no treatment to mitigate the risk).

  Since the action (living her life) cannot change based on the result (no treatment exists), the *instrumental* value of the information is zero. However, the *intrinsic* cost is high. If we model anxiety as a "cost" of acquiring the evidence, the evidence is no longer cost-free. If we model it as part of the utility outcome, the assumption that utility is independent of knowledge is violated. In either model, Good's Theorem does not apply.

  #### The Sports Spoiler Case
  This is an even clearer violation. The utility of watching a sports game is largely derived from **uncertainty**.
  *   **Action:** Watch the recording.
  *   **State:** Team wins/loses.
  *   **Knowledge:** Know score / Don't know score.

  If you know the score, the utility of the action "Watch the recording" drops precipitously. You cannot "act as if you hadn't seen it" while watching the game; the knowledge fundamentally alters the consumption of the experience. The information changes the payoff matrix of the action itself. Therefore, a rational Bayesian who values suspense will rationally pay (in effort or attention) to *avoid* free information.

  ### 3. "Ignorance is Bliss" and Rationality
  Your colleague's claim—that "ignorance is bliss" is a myth for a rational agent—relies on a specific, narrow definition of rationality often found in economics: **Pure Consequentialism regarding external states.**

  Under that specific philosophical framework, if you care about suspense or peace of mind, those are just "preferences" that should be weighed. A strict interpretation might argue: *"If she knew the utility function included anxiety, she would realize her preference for ignorance is a cognitive bias."*

  But modern decision theory rejects this. Preferences over mental states (like anxiety or suspense) are valid inputs to a utility function. If an agent's utility function assigns negative value to the state of "knowing a negative truth that cannot be acted upon," then avoiding that truth is the **utility-maximizing move**.

  To call your sister irrational is to claim her utility function is wrong. But utility functions are subjective definitions of value, not objective truths to be optimized. She is maximizing her expected utility correctly; she just values "peace of mind" higher than "genetic certainty."

  ### 4. Implications for Your A/B Tool
  This distinction is actually critical for the tool you are building.

  Good's Theorem justifies looking at data to make a shipping decision *if* the only goal is maximizing metrics (conversion, revenue). In that context, knowledge is instrumental. Knowing Variant B is worse saves you from shipping a loss.

  However, you must ensure your tool accounts for the **costs** that Good's Theorem assumes are zero:
  1.  **Computational/Time Cost:** Running the test longer delays the feature.
  2.  **Opportunity Cost:** While you wait for certainty, you aren't shipping other features.
  3.  **Psychological/Organizational Cost:** Sometimes, "peeking" at data (even Bayesian) creates pressure to stop early or continue unnecessarily due to organizational politics, not statistics.

  ### Summary
  Good's Theorem proves that **instrumental** information has non-negative value. It does not prove that **all** information has non-negative value.

  *   **Your Work:** You are dealing with instrumental information (does this feature work?). Good's Theorem applies. Look at the data.
  *   **Your Sister/Friends:** They are dealing with intrinsic information (does knowing this hurt my feelings?). Good's Theorem does not apply. Avoiding the data is rational.

  Your colleague is conflating "rationality" with "external-world consequentialism." A good Bayesian can absolutely rationally choose ignorance if the knowledge itself lowers their utility. Ignorance is not always bliss, but it is often rational.
