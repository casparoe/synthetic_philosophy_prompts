answer: |-
  **Seminar:** Classical Indian Epistemology (PHIL 705)
  **Topic:** The Status of *Śabda* (Testimony)
  **Participants:**
  *   **Vādin (The Naiyāyika):** Defending the orthodox Nyāya position of four *pramāṇas*.
  *   **Prativādin (The Pramāṇavādin):** Defending the Dignāga-Dharmakīrti position of two *pramāṇas*.
  **Moderator:** (Silent observer ensuring *vāda* decorum)

  ***

  **Vādin (Naiyāyika):** I propose the thesis: *Śabda* (verbal testimony) is an independent *pramāṇa*, irreducible to *anumāna* (inference). When an *āpta* (trustworthy person) speaks, the cognition of the truth arises from the words themselves, not from a process of reasoning.

  **Prativādin (Buddhist):** I challenge this. Following the *Pramāṇasamuccaya*, I hold there are only two *pramāṇas*: perception and inference. Testimony is merely a species of inference. To understand a sentence is to infer the speaker's intention from the sounds; to accept it as true is to infer the fact from the speaker's known reliability. Where is the independence?

  **Vādin:** Consider the difference in causal structure. In inference, I see smoke and *recall* the universal connection (*vyāpti*) to fire before the cognition of fire arises. It is sequential. But when my guru says, "The sacrifice is to be performed at dawn," the meaning flashes forth immediately upon hearing the words. There is no conscious deliberation on the connection between word and object. This immediacy marks a distinct instrument of knowledge.

  **Prativādin:** I concede that the *phenomenology* is swift. A skilled logician sees smoke and knows fire instantly, without articulating the major premise. Yet, the logical structure remains inferential. Speed does not alter ontology. However, I press you on the *vyāpti*. In smoke and fire, the connection is natural (*svabhāva*). In words, the connection is conventional (*saṅketa*). If the link between the word "cow" and the animal cow is based on human stipulation, is it not an inference based on the premise: "This speaker is using this sound according to established convention"?

  **Vādin:** You press hard, and here I must concede a point. The *knowledge of the convention* itself (*vyutpatti*) is indeed acquired previously, often through inference or perception. I cannot deny that linguistic competence is a prerequisite condition. If I do not know the convention, no cognition arises. So, I grant that the *capacity* to understand relies on prior inferential learning of language.

  **Prativādin:** Then the chain is broken. If the understanding of the words relies on inferring the convention, and the acceptance of the truth relies on inferring the speaker's honesty, the entire cognition is mediated by inference. Why posit a fourth *pramāṇa*? Parsimony demands we call this *anumāna*.

  **Vādin:** Not so fast. While the *validation of the source* is inferential, the *generation of the verbal cognition* (*śābdabodha*) has conditions inference lacks. For a sentence to yield knowledge, it requires *ākāṅkṣā* (mutual expectancy of words), *yogyatā* (semantic fitness), and *āsatti* (temporal contiguity). In inference, I reason from a single mark (*liṅga*), like smoke. In testimony, the meaning arises from the *relation* between words, not merely from the words as signs of the speaker's mind. If I hear "Sprinkle the fire with water," I understand the action not by inferring your mental state, but by grasping the syntactic relation.

  **Prativādin:** This is your strongest point: that syntax creates a relational complex not found in simple sign-inference. I will concede this: the mechanism of *apoha* (exclusion) in language functions differently than the *vyāpti* of natural signs. The connection between word and meaning is not a natural pervasion but a social construct that allows for a unique type of conceptual synthesis. I grant that verbal cognition has a unique causal efficiency (*arthakriyā*) in coordinating human action that simple inference about facts does not.

  **Vādin:** Then we are closer. But you still maintain it is inference because the truth of the claim depends on the speaker.

  **Prativādin:** Precisely. If the *āpta* lies, the cognition is false. In a valid *anumāna*, if the *vyāpti* holds, the conclusion *must* be true. In testimony, the "pervasion" is: "Whatever an *āpta* says is true." But how do you know this pervasion holds? Only by inferring their virtue from their behavior. Thus, the truth of *śabda* rests on an inference about the person.

  **Vādin:** Here is my final concession. I agree that *śabda* yields *pramā* (valid knowledge) *only if* the trustworthiness of the speaker is established. If the speaker's reliability is unknown, testimony yields only doubt, not knowledge. Therefore, the *certification* of testimony as a valid source in a specific instance relies on inference.

  **Prativādin:** And I offer my final concession. While I classify it as inference for the sake of a strict two-fold taxonomy, I acknowledge that Dharmakīrti himself treats testimony as a distinct *type* of inference (*ārthāpatti*-like or based on authority). It is not *svārthānumāna* (inference for oneself based on nature) but relies on the specific causal chain of intention and convention. I concede that reducing it entirely to "smoke-from-fire" inference obscures the unique role of linguistic intention (*tātparya*).

  **Vādin:** Then let us record the *vāda* thus: The Naiyāyika concedes that the *validation* of the source is inferential. The Buddhist concedes that the *mechanism* of linguistic understanding is distinct from natural pervasion. We disagree on whether this distinction warrants a separate ontological category of *pramāṇa*, or merely a sub-variety of inference.

  **Prativādin:** Agreed. The truth is served by clarifying the dependency, even if the taxonomy remains disputed.

  **Vādin:** *Tathāstu.* (So be it.)
