      *   **Core Argument:**
          *   Naiyāyika: Testimony is distinct from inference.
          *   Buddhist: Testimony is inference (word $\to$ meaning, speaker reliability $\to$ truth).
      *   **Key Tension:** Does the "inference" in testimony satisfy the strict conditions of *vyāpti* (pervasion) found in smoke $\to$ fire cases? Can the Naiyāyika define verbal cognition without smuggling in inference?
      *   **Constraint:** Neither side simply restates positions; each must concede what the other's strongest point forces them to concede.

  2.  **Character Voices & Terminology:**
      *   **Naiyāyika:** Needs to sound grounded in the *Nyāya-sūtra* tradition (perhaps later Navya-Nyāya precision, but accessible). Key terms: *āpta* (trustworthy person), *śabda*, *pramāṇa*, *vyutpatti* (linguistic competence), *tātparya* (intention).
      *   **Buddhist (Pramāṇavādin):** Needs to reflect Dignāga/Dharmakīrti's rigor. Key terms: *anumāna*, *vyāpti*, *svārthānumāna* (inference for oneself), *parārthānumāna* (inference for others), *apoha* (exclusion - though maybe too technical for a short dialogue, keep it focused on reductionism), *arthakriyā* (causal efficacy).
      *   **Tone:** Respectful, rigorous, dialectical (*vāda*), not hostile (*jalpa*).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Acknowledge the *vāda* format. Establish the thesis (*pratijñā*).
      *   **Round 1: The Buddhist Challenge.**
          *   Argument: Understanding words is inferring the speaker's intention. Believing them is inferring truth from reliability.
          *   Naiyāyika Concession: Must admit that *understanding* requires prior knowledge of convention (which looks like a premise).
      *   **Round 2: The Naiyāyika Counter.**
          *   Argument: The *experience* of testimony is immediate, not a step-by-step deduction. When a trusted friend says "There is a snake," you don't reason; you jump.
          *   Buddhist Concession: Must admit the *phenomenology* is swift, but insist swiftness doesn't change the logical structure (like seeing fire from smoke quickly).
      *   **Round 3: The Crux (Vyāpti).**
          *   Buddhist: Where is the invariable connection (*vyāpti*) between "Speaker X says P" and "P is true"? It's not natural like smoke/fire; it's contingent.
          *   Naiyāyika Concession: It relies on the *āpta's* virtue, which is established via inference *about the person*, but the *cognition of the content* is distinct.
          *   Buddhist Rebuttal: If the virtue is established by inference, the whole chain is inference.
      *   **Round 4: Synthesis/Concession.**
          *   Naiyāyika: Okay, the *validation* of the source is inferential. But the *generation* of the cognition (*śābdabodha*) has a unique structure (*ākāṅkṣā*, *yogyatā*, *āsatti*) that inference lacks.
          *   Buddhist: I concede that linguistic competence (*vyutpatti*) functions differently than logical pervasion. I will call it inference *for the sake of taxonomy*, but acknowledge it operates via a unique causal chain of conventions.
          *   Naiyāyika: And I concede that without the inferential grounding of the speaker's honesty, *śabda* yields doubt, not knowledge.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the Buddhist too aggressive?
      *   *Fix:* Make sure the Buddhist acknowledges the utility of *śabda* even if reducible. Dignāga accepts two *pramāṇas* (perception, inference), so *śabda* must fit there.
      *   *Critique:* Is the Naiyāyika too vague?
      *   *Fix:* Use specific Nyāya conditions for verbal understanding (*ākāṅkṣā* etc.).
      *   *Constraint Check:* Did they concede?
          *   Naiyāyika needs to concede that reliability is known via inference.
          *   Buddhist needs to concede that the *mechanism* of word-meaning relation isn't standard *vyāpti*.

  5.  **Final Polish:**
