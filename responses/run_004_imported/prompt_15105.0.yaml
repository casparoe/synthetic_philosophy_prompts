          *   *Argument to Skeptics:* Stop looking at the paper; look at the shelves. If the butcher accepts it for meat, it has value. The "backing" is the community's productive capacity.

      *   **Implication 2: Velocity of Circulation:**
          *   *Berkeley's View:* A coin sitting still does nothing. A coin changing hands 10 times creates 10x the economic activity.
          *   *Application:* Local currency is designed for high velocity (demurrage? social pressure to spend local?). It prevents "leakage" to chains (which is money leaving the circuit).
          *   *Argument to Skeptics:* National currency leaves town immediately (low local velocity). Scrip stays (high local velocity). A smaller amount of scrip circulating fast is better than a large amount of dollars circulating once and leaving.

      *   **Implication 3: Credit without Full Specie Reserve:**
          *   *Berkeley's View:* You don't need a 1:1 gold reserve. You need security (land, future harvests, honest administration).
