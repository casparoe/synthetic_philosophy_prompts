answer: |-
  **MEMORANDUM**

  **TO:** The Governance Board, [Co-op Name]
  **FROM:** Policy Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Household Transitions Involving Minor Residents

  ### 1. Context and Purpose

  This memo addresses recent tensions regarding household composition changes within units housing minor residents. Specifically, it responds to a request to restrict new partners from moving into shared homes where children are present. While our cooperative has historically prioritized adult autonomy and generally applicable norms, the presence of a non-consenting minor resident introduces a distinct ethical and operational variable.

  The Board seeks to resolve this conflict without resorting to case-by-case exceptions, which undermine governance consistency, while acknowledging that the "generally applicable" standard must account for differential vulnerability among residents.

  ### 2. Addressing the Objection: Equality vs. Equity of Risk

  A significant objection has been raised that imposing stricter transition protocols on households with children constitutes "special pleading" that discriminates against parents. It is argued that restricting a parent's ability to house a partner imposes a burden on parents that childless housemates do not bear.

  **The Board rejects the premise that this is discriminatory special pleading.**

  In a housing cooperative, rules are generally applied equally because all *members* are presumed to be consenting adults with the capacity to accept risk, vote on governance, and voluntarily exit the arrangement if it becomes untenable. A minor resident possesses none of these capacities. The child is an **involuntary stakeholder**. They did not sign the lease, they cannot vote on board policy, and they cannot choose to move out if the domestic environment becomes destabilizing.

  Treating households with minors differently is not an infringement on parental rights; it is an acknowledgment of ** Duty of Care**. Just as we would impose stricter noise or safety protocols for a unit housing a person with a disability requiring quiet, or a unit containing a home business with high foot traffic, we must recognize that the *impact* of household turnover is qualitatively different when a dependent child is involved.

  To treat the child's need for stability as equivalent to an adult's desire for relationship autonomy is to falsely equate the rights of a consenting member with the welfare of a non-consenting resident. Therefore, a policy that places a higher procedural burden on transitions involving minors is not "special pleading"; it is a necessary safeguard for the most vulnerable member of our community.

  ### 3. Policy Recommendation: The Minor Resident Stability Protocol

  The Board recommends against a blanket ban on new partners until a child turns eighteen. Such a ban is unenforceable, infringes excessively on adult autonomy, and punishes new partners for the history of the co-parents. However, the Board also recommends against the status quo, which lacks safeguards for the child.

  Instead, we propose a **process-based norm** that applies to *any* household unit within the co-op where a minor resides. This maintains the principle of generally applicable norms while accounting for the specific vulnerability identified above.

  **The Rule:**
  Effective **November 30, 2023**, any member residing in a unit with a minor resident must adhere to the following **Household Transition Protocol** before a new long-term partner (staying >14 consecutive nights or moving in) joins the household:

  1.  **Extended Notice Period:** The member must provide written notice to the Governance Board and all co-parents with legal custody of the minor **60 days** prior to the partner's intended move-in (standard notice for childless units remains 30 days).
  2.  **Co-Parent Consultation:** The member must certify to the Board that a good-faith discussion regarding the transition has occurred with all co-parents. If co-parents are acrimonious, this certification may be replaced by a mediated session facilitated by a Board-designated conflict resolver.
  3.  **Integration Period:** New partners in minor-containing units are subject to a **90-day Integration Period**. During this time, the partner is considered a guest regarding governance voting and financial liability, and overnight stays should be gradual to allow the child to adjust. If significant behavioral issues arise regarding the child's welfare during this period, the Board reserves the right to extend this period or revoke residency privileges for the partner through our standard nuisance/eviction process.

  ### 4. Implementation and Grandfathering

  *   **Applicability:** This policy applies prospectively to all new household transitions occurring after the Effective Date.
  *   **Current Situation:** Regarding the specific conflict prompting this memo: The Board will not retroactively evict the current partner. However, the co-parents are strongly encouraged to utilize the Board's mediation services to establish a communication framework consistent with the spirit of this new protocol.
  *   **Review:** This policy shall be reviewed in 12 months to assess its impact on community cohesion and child welfare.

  ### 5. Conclusion

  This approach balances the cooperative's commitment to adult autonomy with our ethical obligation to the involuntary residents among us. By codifying a higher standard of care for transitions involving minors, we affirm that while adults are free to change their relationships, they must do so with deliberate regard for the stability of the children they have brought into our shared space.

  **Recommendation:** Adopt the Minor Resident Stability Protocol as written above.

  _________________________
  **Approved by:** The Governance Board
  **Date:** _________________
