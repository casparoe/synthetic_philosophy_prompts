      *   **Task:** Draft a board policy memo.
      *   **Requirements:** Recommend a specific rule with an effective date. Address the objection about treating parents differently (substantive answer).

  2.  **Determine the Stance/Recommendation:**
      *   *Option A: Ban new partners until 18.* Too restrictive, infringes on adult autonomy, likely unenforceable, sets a bad precedent for the co-op culture.
      *   *Option B: Do nothing/Status Quo.* Ignores the legitimate welfare of the child, risks escalating conflict, fails the "child didn't consent" ethical test.
      *   *Option C: A Middle Ground (Process-Oriented).* Acknowledge the unique impact of household changes on minors without banning relationships. Focus on *process* (notice, transition periods, conflict resolution) rather than *prohibition*.
      *   *Decision:* Option C is the most aligned with co-op values (autonomy + community) while addressing the ethical duty to the child. It upholds the "generally applicable norms" preference by creating a protocol for *any* household change involving a minor, rather than a ban on specific people.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Context/Background:** Briefly state the issue without naming names.
      *   **Guiding Principles:** Autonomy, Community Stability, Duty of Care to Minors.
      *   **The Objection (Addressing the Prompt):** Directly tackle the "special pleading" argument.
      *   **The Policy Recommendation:** Specific rule, effective date, implementation details.
      *   **Next Steps:** How to adopt/enforce.

  4.  **Developing the Substantive Argument (The "Special Pleading" Objection):**
      *   *Argument:* Treating parents differently isn't discrimination; it's recognizing differential impact.
      *   *Analogy:* Noise ordinances often differ for quiet hours vs. construction hours. Or, accessibility ramps aren't "special pleading" for wheelchair users; they acknowledge different physical needs.
      *   *Core Point:* Minors are involuntary residents with developing neurology/psychology. Adults choose to live there; children are brought there. The co-op has a *loco parentis* adjacent responsibility (duty of care) that doesn't apply to consenting adults. Therefore, rules affecting the *environment* of the child must have higher scrutiny, not to punish parents, but to protect non-consenting residents.

  5.  **Formulating the Specific Rule:**
      *   *Goal:* Stability without prohibition.
      *   *Mechanism:* "Household Transition Protocol for Minor-Containing Units."
      *   *Key Elements:*
          *   Notice period (longer than standard).
          *   Mediation/Check-in requirement before move-in.
          *   Probationary period for the new partner (not a ban, but a slow integration).
          *   Commitment to co-parenting communication standards.
      *   *Effective Date:* Immediate adoption, applying to future changes (grandfathering the current situation might be tricky, but applying it prospectively is fairer). Let's say 30 days out to allow adjustment.

  6.  **Refining the Tone:**
      *   Needs to be diplomatic, firm, principled, and community-focused.
      *   Avoid taking sides in the specific breakup.
      *   Emphasize the "Cooperative" nature.

  7.  **Drafting - Section by Section (Iterative refinement):**

      *   *Header:* Standard formal memo format.
      *   *Introduction:* Acknowledge the tension.
      *   *Principles:* Balance autonomy with care.
      *   *Addressing the Objection:* This needs to be strong. Use the "Involuntary Resident" argument. The child is the only stakeholder who cannot vote or move out.
      *   *The Policy:* Call it the "Minor Resident Stability Protocol."
          *   Require a 60-day notice for new long-term partners in units with minors.
          *   Require a mediated meeting between co-parents and housemates.
          *   Establish a "quiet integration" period (e.g., no overnight stays for first 2 weeks, then gradual).
      *   *Effective Date:* 30 days from adoption.
      *   *Conclusion:* Reiterate commitment to the community.

  8.  **Review against Constraints:**
      *   *Specific rule?* Yes (Notice + Mediation + Integration period).
      *   *Effective date?* Yes.
      *   *Answer the objection?* Yes (Involuntary resident argument).
      *   *Generally applicable?* Yes (Applies to *any* household with a minor, not just this specific couple).

  9.  **Final Polish:** Ensure the language distinguishes between "banning partners" and "managing transitions." The prompt asks to recommend a specific rule. A flat ban is bad policy. A process rule is good policy. I will recommend the process rule. *Self-Correction:* The prompt asks me to recommend a specific rule. If I recommend *no ban*, I need to make sure the alternative rule is robust enough to satisfy the "stability" concern. The "Minor Resident Stability Protocol" is the way to go.

      *Wait, one nuance:* The prompt asks to "give a substantive answer to the objection that treating parents' households differently is just special pleading." I need to make sure this section is prominent.

      *Another nuance:* The prompt mentions the board wonders if the "generally applicable norms" approach is right when the child didn't agree. I need to validate that concern while maintaining the norm-based approach. The solution is a *norm* that specifically accounts for the vulnerability of minors.

  10. **Finalizing the Text:** (Mental check of the draft)
