answer: |-
  Here is an analysis comparing Tolstoy's infection theory with Collingwood's expression theory, applied to your two test cases, followed by an adjudication of their respective defensibility.

  ### Theoretical Mechanisms: Infection vs. Expression

  To understand how these theories diverge, we must first isolate their operative mechanisms.

  **Tolstoy's Mechanism: Transmission and Infection**
  For Tolstoy, art is a communicative technology. The mechanism is linear: Artist (Feeling) $\rightarrow$ Medium $\rightarrow$ Audience (Infection). The definition of art is contingent on the *success* of this transmission. If the audience is not "infected," the activity has failed to be art. Furthermore, Tolstoy overlays an ethical criterion: the feeling transmitted must promote universal brotherhood (religious consciousness of the time). Art that divides (class-based or nationalist) is either "bad art" or "counterfeit."

  **Collingwood's Mechanism: Expression and Clarification**
  For Collingwood, art is a cognitive process of self-discovery. The mechanism is internal and exploratory: Artist (Bewildered Emotion) $\rightarrow$ Medium (Language/Sound/Image) $\rightarrow$ Artist (Clarified Emotion). The audience's role is to reconstruct this imaginative experience, but the *status* of the work as "art proper" depends primarily on whether the artist successfully expressed and clarified the emotion for themselves. Crucially, Collingwood distinguishes this from "arousal." If the emotion is pre-determined and the work is designed to trigger it for a practical end, it is not art; it is "magic" (practical) or "amusement" (hedonistic).

  ---

  ### Case 1: The Unmoving Poem
  *A poem that sincerely and lucidly articulates a highly individual feeling but leaves every reader besides its author unmoved.*

  **Tolstoy's Verdict: Not Art (or Failed Art)**
  Tolstoy's theory collapses here. Because his definition requires that the audience be "infected," a work that fails to move anyone else fails the necessary condition of art. Tolstoy writes, "Art is a human activity consisting in this, that one man consciously... transmits [feelings] to others, and that others are infected by these feelings." If the infection does not spread, the activity is incomplete. The sincerity and clarity of the poet matter less than the physiological and psychological effect on the receiver. For Tolstoy, a poem read by no one (or felt by no one) is merely a private exercise, not art.

  **Collingwood's Verdict: Art Proper**
  Collingwood would likely classify this as "art proper," provided the poet genuinely clarified their emotion through the writing process. For Collingwood, the primary locus of art is the imaginative expression within the creator's mind, externalized through the medium. While Collingwood acknowledges that art implies a community (language is social), the failure of the audience to be "moved" in a visceral sense does not negate the artistic status of the work. The audience may have failed to reconstruct the imaginative experience, or the emotion expressed may be too subtle for "arousal," but the *expression* occurred. The mechanism is the clarification of feeling, not the stimulation of an audience.

  **Divergence:** Tolstoy denies the status of art due to failed transmission; Collingwood affirms it due to successful expression.

  ---

  ### Case 2: The Patriotic Anthem
  *A rousing patriotic anthem that successfully unites a mass audience in an intense, shared emotion.*

  **Tolstoy's Verdict: Art (but likely "Bad" or "Exclusive" Art)**
  Tolstoy's mechanism of infection is satisfied here: the audience is intensely united and "infected" by the feeling. Therefore, it fits the definition of art. However, Tolstoy would condemn it ethically. In *What Is Art?*, he argues that art must unite people in a universal religious consciousness. A patriotic anthem unites people *against* others (us vs. them) or reinforces state power. Tolstoy would classify this as "exclusive art" (serving a specific group rather than humanity) or, if he deems the feeling insufficiently sincere or morally corrupt, "counterfeit." But structurally, it remains within the category of art because the transmission of feeling succeeded.

  **Collingwood's Verdict: Magic (Not Art Proper)**
  Collingwood would exclude this from "art proper" entirely. He classifies works designed to arouse specific emotions for a practical, communal purpose as "magic." The anthem's goal is not to explore the nature of patriotism for the sake of understanding it, but to *reinforce* loyalty and prompt action (defense of the nation, voting, fighting). The emotion is a means to an end. Because the feeling is pre-determined (love of country) and the work is engineered to discharge that feeling for a social utility, it is propaganda, not art.

  **Divergence:** Tolstoy accepts it as art (though morally flawed) because infection occurred; Collingwood rejects it as art (classifying it as magic) because the mechanism is arousal for utility, not expression for understanding.

  ---

  ### Adjudication: Which Framework is More Defensible?

  On balance, **Collingwood's framework provides the more defensible account**, particularly when explaining Tolstoy's willingness to expel canonical works like *War and Peace* from the category of art.

  **1. The Problem of Contingency (Case 1)**
  Tolstoy's reliance on "infection" makes the status of art contingent on empirical audience reception, which is variable and often unreliable. A poem might be ahead of its time, or the audience might be insensitive. Tolstoy's theory implies that Shakespeare ceases to be art if performed to a cold house. Collingwood avoids this by locating the artistic act in the integrity of the expression. This aligns better with our intuition that a work can be great art even if it is misunderstood by its contemporaries.

  **2. The Confusion of Art and Utility (Case 2)**
  Collingwood's distinction between Expression and Magic offers a sharper analytical tool for Case 2. Tolstoy is forced into a awkward position where a patriotic anthem is "art" (because it infects) but "bad" (because it divides). He must judge art by moral consequences rather than aesthetic nature. Collingwood correctly identifies that the *mechanism* of the anthem is fundamentally different from that of a lyric poem; one aims at practical cohesion (magic), the other at cognitive clarity (art). Collingwood's framework prevents the conflation of propaganda with art, a conflation Tolstoy inevitably flirts with by demanding art serve the moral end of "human brotherhood."

  **3. Explaining Tolstoy's Self-Rejection**
  Finally, Collingwood's theory better explains *why* Tolstoy felt compelled to reject his own masterpieces, while simultaneously showing why that rejection was based on a category error.

  Tolstoy rejected *War and Peace* and *Anna Karenina* because he came to believe they served the "upper classes" and lacked a universal religious message. He judged them by their **social utility** (did they unite all humanity in Christian love?) rather than their **expressive integrity**.
  *   **Tolstoy's Explanation:** He claims these works are "counterfeit" or bad because they fail the infection test among the peasantry and promote elite values.
  *   **Collingwood's Explanation:** Collingwood would argue that Tolstoy was no longer judging them as *art*, but as *magic*. Tolstoy's late theory demands that art function as a tool for moral salvation. Collingwood identifies this demand as the definition of "Magic" (arousing emotion for a practical/religious end).

  Therefore, Collingwood's framework is more defensible because it illuminates the flaw in Tolstoy's late period: Tolstoy expelled his great novels not because they failed to express feeling (they clearly did), but because they failed to function as moral propaganda. Collingwood allows us to say *War and Peace* is "Art Proper" (successful expression of complex human feeling) while acknowledging Tolstoy's critique that it fails as "Magic" (it does not enforce a specific religious dogma). Tolstoy's theory cannot make this distinction; for him, if it doesn't save your soul, it isn't art. Collingwood saves the concept of art from being swallowed by morality, providing a more robust philosophical basis for why we still value *Anna Karenina* despite its lack of universal religious infection.
