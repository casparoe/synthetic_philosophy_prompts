  **The Hollow Vindication: Why Harsanyi's Theorem Fails to Ground Utilitarianism**

  For decades, John Harsanyi's Aggregation Theorem has served as a centerpiece in the effective-altruist and welfare-economic defense of utilitarianism. The promise is seductive in its mathematical austerity: if individuals are rational (satisfying the von Neumann–Morgenstern axioms) and society respects the Pareto principle (if everyone prefers X to Y, society must too), then social welfare must be a weighted sum of individual utilities. To many, this looks like a derivation of utilitarianism from thin rationality constraints alone, bypassing the need for contentious metaphysical claims about the good.

  However, this claim to vindication is overstated. While Harsanyi's theorem is mathematically sound, its philosophical force is illusory. When subjected to the scrutiny of Amartya Sen's measurement critique and Peter Diamond's equity objection, the theorem reveals itself not as a foundation for utilitarianism, but as a conditional structure that smuggles in the very ethical assumptions it claims to derive. The verdict is definite: Harsanyi's theorem provides **no independent normative support** for utilitarianism. It demonstrates only that *if* one accepts specific, controversial ethical premises regarding interpersonal comparison and the moral irrelevance of distributional fairness, *then* utilitarianism follows. To close the gap between the theorem and a defensible moral theory, one must import external ethical machinery that renders the theorem's "vindication" redundant.

  **The Measurement Gap: Sen and Weymark**

  The first fatal flaw lies in the currency of the aggregation. Harsanyi's theorem relies on von Neumann–Morgenstern (vNM) utility functions. In decision theory, a vNM utility function is a representation of an individual's preference ordering over lotteries. Crucially, these functions are unique only up to positive affine transformations. This means that for any individual $i$, a utility scale $U_i$ is equivalent to $aU_i + b$ (where $a > 0$). The zero point and the unit size are arbitrary.

  Classical utilitarianism requires summing utilities: $W = U_1 + U_2 + ... + U_n$. But one cannot meaningfully sum quantities that lack a common unit or a fixed zero. If Individual 1's utility is measured in "hedons" and Individual 2's in "arbitrary preference indices," adding them is mathematically akin to adding meters to seconds.

  Amartya Sen identified this equivocation, and John Weymark later formalized it. They demonstrated that Harsanyi's proof requires **interpersonal comparability of utility levels and units** to generate a specific utilitarian sum. However, the vNM axioms and the Pareto principle alone do not generate this comparability. The theorem proves that the social welfare function must be *linear*, but it does not fix the *weights* or the *scales*. Without an independent justification for why one person's utility unit equals another's, the "weighted sum" is indeterminate. One could assign all weight to a single dictator and still satisfy Harsanyi's axioms.

  Consequently, the theorem does not derive utilitarianism from rationality; it derives utilitarianism from rationality *plus* the assumption of full interpersonal comparability. Since comparability is the most contentious premise in welfare economics—requiring a robust theory of well-being that transcends revealed preference—the theorem fails to do the heavy lifting its proponents claim. It assumes the possibility of the utilitarian calculus rather than proving its necessity.

  **The Equity Gap: Diamond's Objection**

  Even if we grant the Sen/Weymark critique and assume interpersonal comparability is secured, Harsanyi's theorem faces a second, distinct challenge regarding fairness. Peter Diamond's 1967 objection targets the theorem's reliance on the *ex ante* Pareto principle.

  Consider a standard fair-lottery case: A single dose of life-saving medicine is available for one of two patients, who are identical in medical need and claim. Society has three options:
  1.  Give the drug to Patient 1.
  2.  Give the drug to Patient 2.
  3.  Flip a fair coin to decide.

  From an *ex ante* perspective (before the coin flip), Patients 1 and 2 have identical expected utilities in all three scenarios. In options 1 and 2, one has a 100% chance of life and the other 0%. In option 3, both have a 50% chance. If individuals care only about their own expected survival, they are indifferent between the three options. By Harsanyi's logic, if all individuals are indifferent, society must be indifferent.

  However, most moral intuitions judge Option 3 (the coin flip) as superior to Options 1 or 2. Option 3 treats the patients with equal respect *ex post*, giving each an equal objective chance of survival. Options 1 and 2 arbitrarily privilege one over the other. Diamond showed that respecting *ex ante* preferences (as Harsanyi requires) forces society to be indifferent to this inequity. To prefer the coin flip is to violate the *ex ante* Pareto principle, because no one strictly prefers the coin flip in terms of expected utility, yet society prefers it for reasons of fairness.

  This objection demonstrates that Harsanyi's utilitarianism is blind to the distribution of chances. It conflates the good of the society with the sum of expected individual goods, ignoring the moral value of fair procedures. If a moral theory cannot distinguish between a fair lottery and arbitrary discrimination when expected outcomes are identical, it is deficient. Thus, the theorem vindicates a version of utilitarianism that is incompatible with widely held convictions about equity.

  **The Verdict**

  We must now weigh the theorem's force against these challenges. Proponents often argue that these are merely technical hurdles to be cleared. This is a mistake. The Sen/Weymark and Diamond critiques do not identify edge cases; they identify foundational absences.

  The verdict is that Harsanyi's Aggregation Theorem lends **zero genuine foundational support** to utilitarianism. It is a representation theorem, not a justification. It tells us that *if* we accept interpersonal comparability *and* *if* we prioritize ex ante efficiency over ex post equity, *then* our moral mathematics must look utilitarian. But the theorem provides no reason to accept those "ifs."

  In fact, relying on the theorem as a vindication is intellectually hazardous. It creates an illusion of objectivity, suggesting that utilitarianism is the unique outcome of rational consistency. In reality, the theorem is a mirror: it reflects the ethical inputs provided to it. If one inputs full comparability and ignores fairness, one gets utilitarianism. If one inputs incomparability, one gets indeterminacy. If one inputs a concern for ex post equity, one breaks the theorem's axioms. To claim the theorem proves utilitarianism is to confuse the map for the territory.

  **Closing the Gap**

  If the theorem cannot stand alone, what is required to close the gap and salvage a defensible welfarist framework? Two specific additions are necessary, both of which undermine the claim that the theorem is a "free" vindication.

  First, to address Sen and Weymark, one must adopt an **objective theory of interpersonal comparison**. We cannot rely on vNM preference satisfaction alone. We need a metric of well-being—whether neural correlates of happiness, capability sets, or objective list goods—that allows us to fix the zero points and units across persons independently of their risk attitudes. This moves the debate from decision theory to moral psychology or metaphysics, acknowledging that the "sum" in utilitarianism requires a substantive theory of value, not just rational consistency.

  Second, to address Diamond, one must modify the **Pareto principle or the social welfare function**. A robust theory must account for *ex post* fairness. This might involve adopting a prioritarian view (weighting benefits to the worse off) or an ex post egalitarian constraint that values equal chances independently of expected utility. This explicitly rejects the strict *ex ante* Pareto condition that Harsanyi's theorem relies upon.

  In conclusion, Harsanyi's theorem is a powerful tool for clarifying the structure of social choice, but it is a failure as a moral foundation. It does not vindicate utilitarianism; it merely formalizes it. To build a moral system upon it, one must import the very ethical commitments the theorem was supposed to derive. Effective altruists and welfare economists would do better to argue directly for interpersonal comparability and the moral weight of expected welfare, rather than hiding behind the false neutrality of an aggregation theorem. The math is correct, but the philosophy is circular.
