      *   **The Theorem:** Briefly explain the mechanics (vNM axioms + Pareto $\to$ linear sum). Acknowledge its elegance.
      *   **The Sen/Weymark Critique:** Focus on the "currency" problem. vNM utility is ordinal + risk attitude, not cardinal welfare. Adding apples and oranges. The weights ($a_i$) are arbitrary without comparability.
      *   **The Diamond Critique:** Focus on the "fairness" problem. The coin flip example. Ex ante Pareto violates ex post equity. Utilitarianism (as derived by Harsanyi) is blind to the distribution of chances.
      *   **The Verdict:** This is the crucial part. I need to be decisive.
          *   *Decision:* The theorem offers **zero** independent normative support for utilitarianism. It is a representation theorem, not a justification. It translates ethical assumptions into math, it doesn't generate them.
      *   **Closing the Gap:** What is needed?
          1.  A theory of interpersonal comparison (psychological or objective).
          2.  A relaxation of the ex ante Pareto principle to accommodate fairness (or a shift to ex post evaluation).
      *   **Conclusion:** Summarize. The theorem is a tool, not a master.

  7.  **Refining the Tone:**
      *   Ensure I don't sound wishy-washy. Use strong verbs.
      *   Check that I address the "effective-altruist" context implicitly (they like the mathy vindication).
      *   Ensure the distinction between *linearity* and *comparability* is sharp.
      *   Ensure the Diamond objection is clearly distinguished as an attack on the *Pareto* premise in this context.

  8.  **Self-Correction/Review during drafting:**
