      *   **The "Knowledge" vs. "Belief" Distinction:** Aumann uses S5 knowledge (factive). If I *know* you are rational, you *are* rational. But if I see you make a move that is irrational (reaching node 2), my knowledge claim is falsified. How do I update? Aumann's framework doesn't handle belief revision well in this specific context.
