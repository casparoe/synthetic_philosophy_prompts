          *   *Philosopher A (Unified/Possible Worlds):* Defends the view that both types of conditionals are evaluated via possible worlds (Stalnaker/Lewis style). Needs to argue for a unified semantics.
          *   *Philosopher B (Probabilistic/Suppositional):* Defends the view that indicatives are about conditional probability/assertibility, not truth conditions in possible worlds (Adams/Edgington style). Needs to argue for a fundamental distinction.
      *   **Format:** A dialogue.
      *   **Tone:** Sharp, intellectual, no strawmen, genuine disagreement, focused on the specific Oswald/Kennedy example.
