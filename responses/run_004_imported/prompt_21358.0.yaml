      *   **Round 2: The Mechanism.** Elena explains the "Context Set." For indicatives, we hold fixed what we know (Kennedy died). For counterfactuals, we backtrack. Marcus attacks this: Why call it "truth" for indicatives if it's just epistemic containment?
      *   **Round 3: Probability vs. Truth.** Marcus brings in Adams' thesis (Probability of if A then B = P(B|A)). Elena counters with the "Embedding Problem" (conditionals inside other sentences).
      *   **Round 4: The Chemist's Concern (Causation).** Address the user's background. Counterfactuals track causal dependencies. Indicatives track evidential dependencies. Elena tries to unify them; Marcus insists they are different cognitive tools.
