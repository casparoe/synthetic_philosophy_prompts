  *(Self-Correction Note)*: I need to make sure I don't accidentally solve the puzzle. The point is to show *why* it's a puzzle. The chemist wants a uniform footing; the dialogue should show why that's hard to get without breaking something else.

  8.  **Final Polish:** Check the voices. Elena should sound structured, systematic. Marcus should sound intuitive, pragmatic.

