          *   (2) Counterfactual: If Oswald hadn't killed Kennedy, someone else would have. (False)
      *   **Elena's Challenge:** How do you explain the difference without changing the semantics?
          *   *Response:* It's about the *context set* or the *selection function*. For indicatives, we restrict to worlds compatible with what we know (Kennedy is dead). For counterfactuals, we allow worlds where the known facts might differ (Kennedy might be alive).
      *   **Marcus's Challenge:** Why force truth conditions on (1)? It's about confidence.
          *   *Response:* If (1) has no truth value, how can we embed it? How can we say "It is true that if Oswald didn't..."? Also, the probabilistic view struggles with logical validity (e.g., modus ponens).
      *   **The Chemist's Angle:** The user mentioned causal claims in chemistry ("if we hadn't added the catalyst..."). Marcus should touch on how counterfactuals track causation better, while Elena should argue that causation is just a specific modal relation.

  4.  **Drafting - Section by Section:**

