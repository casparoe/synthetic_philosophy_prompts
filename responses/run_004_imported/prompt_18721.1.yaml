          *   *Draft Question:* How do you rule out attention?
          *   *Likely Answer:* She will cite studies controlling for fixation or using subjective reports that distinguish appearance from attention.
          *   *Follow-up:* If she cites subjective reports, press on the reliability of metacognition. If she cites fixation, press on covert attention. Let's go with the covert attention angle as it's trickier.
          *   *Refinement:* "Critics argue that in cases like the hunger study, what changes isn't the *content* of the visual experience but rather where subjects direct their *attention* or how they weight the information post-perceptually. When you control for eye movements, how do you distinguish a genuine shift in phenomenological content from a shift in covert attentional weighting?"
          *   *Follow-up:* "If you appeal to subjects' introspective reports to make that distinction, how do you respond to the worry that subjects are simply inferring their experience based on their hunger, rather than reporting the raw phenomenology?"

      *   *Topic 2: Perceptual Learning.*
          *   *Core Challenge:* Radiologists aren't influenced by belief *in the moment*; they have trained low-level detectors through repetition. This is bottom-up plasticity, not top-down penetration.
          *   *Draft Question:* Isn't this just learning?
          *   *Likely Answer:* She will argue that learning changes the *system*, but belief changes the *state*. Or she might argue learning *is* a form of penetration over time.
