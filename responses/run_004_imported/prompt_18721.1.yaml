answer: |-
  Here are ten interview questions designed to move the discussion beyond standard examples and into the theoretical mechanics and implications of cognitive penetrability. The four mandatory topics are included with specific follow-ups based on the responses she is most likely to give.

  **1. The Phenomenological Marker**
  "You argue that cognition alters the *experience* itself, not just the judgment we form afterward. When you ask a subject in an experiment whether a patch of color looked darker or whether they simply *believed* it was darker, what specific phenomenological difference are they reporting? Is there a 'feel' to a cognitively penetrated experience that distinguishes it from a standard one?"

  **2. The Attention Alternative (Mandatory Topic)**
  "Critics often argue that in cases like the hunger study, what changes isn't the *content* of the visual experience but rather where subjects direct their *attention* or how they weight the information post-perceptually. When you control for eye movements, how do you distinguish a genuine shift in phenomenological content from a shift in covert attentional weighting?"
  *   **Likely Answer:** She will likely cite studies that control for fixation or rely on subjective introspective reports.
  *   **Follow-up:** "If you rely on those introspective reports to make that distinction, how do you respond to the worry that subjects are simply inferring their experience based on their hunger levels, rather than reporting the raw phenomenology?"

  **3. Perceptual Learning vs. Penetration (Mandatory Topic)**
  "Take the radiologist example. A skeptic might say this isn't cognition penetrating perception, but rather perceptual learning—where repeated exposure builds new bottom-up feature detectors. How do you distinguish a cognitive state like a belief penetrating a visual state from the slow, statistical tuning of early vision through practice?"
  *   **Likely Answer:** She will likely argue that learning is slow and gradual, whereas cognitive penetration can be immediate.
  *   **Follow-up:** "If the distinction relies on timescale, what do you make of cases where a single verbal instruction instantly changes how a stimulus looks, such as in the 'duck-rabbit' illusion? Does that speed imply a different mechanism than learning, or is learning just faster than we thought?"

  **4. Early-Vision Encapsulation (Mandatory Topic)**
  "Fodor and Pylyshyn argue that early visual processing is informationally encapsulated—meaning it doesn't have access to central cognitive systems. They locate penetration, if it exists, in late vision or judgment. Do you dispute the existence of this early/late boundary, or do you argue that cognitive signals reach further back into the visual stream than they admit?"
  *   **Likely Answer:** She will likely point to neuroimaging data showing feedback loops from higher cortex areas into V1 (early visual cortex).
  *   **Follow-up:** "If you rely on those feedback loops, how do you respond to the predictive processing claim that this feedback serves to minimize prediction error rather than altering the phenomenological content of the experience itself?"

  **5. The Mechanism of Format**
  "Beliefs are typically understood as propositional—they have a sentence-like structure—while visual experiences are analog or map-like. If a belief is to penetrate perception, it must translate its format. Do you have a specific account of how a propositional attitude gets converted into a non-conceptual visual representation without losing its cognitive origin?"

  **6. Desire and Emotion**
  "Much of the literature focuses on belief, but what about desire or emotion? If I am afraid, does the spider *look* larger, or do I just judge it as more threatening? If desire penetrates perception, does that imply our motivational states have direct access to visual processing in a way that threatens objectivity even more than belief does?"

  **7. Scope and Pervasiveness**
  "Is this penetration a pervasive feature of human vision, or is it limited to edge cases like expertise or high-stakes motivation? If it only happens in specific contexts, does it matter for general epistemology, or is it merely a curiosity of extreme conditions?"

  **8. Epistemic Circularity (Mandatory Topic)**
  "There's an epistemic worry here: if perception is supposed to act as an independent check on our beliefs, but our beliefs shape perception, doesn't that render the relationship circular? If I believe the world is dangerous, and thus *see* it as dangerous, how can my vision ever correct that belief?"
  *   **Likely Answer:** She will likely argue that penetration isn't total; some parts of perception remain objective enough to check beliefs.
  *   **Follow-up:** "So, are you suggesting we need to abandon the idea of perception as a 'foundational' source of justification, and instead move toward a coherentist model where perception and belief mutually support each other without a strict hierarchy?"

  **9. Developmental and Comparative Limits**
  "Does this penetrability develop over time? Are infants' perceptions fully encapsulated, only becoming penetrable as they acquire concepts and language? If so, does that suggest that cognitive penetration is actually a byproduct of conceptual development rather than a fundamental feature of perception?"

  **10. Falsification**
  "In everything I've read on this debate, the criteria for victory are often vague. What single observation or experiment would actually change your mind? Is there a specific result that would convince you that perception is, in fact, encapsulated after all?"
