answer: |-
  Good evening. For those of you who don't know me, I'm one of Professor Alden's former students. I'm also the only person in this room without a faculty appointment, which I suspect is exactly why I'm holding this glass. If a colleague had stood up to praise her, it might have turned into a peer review. If a rival had stood up, it might have turned into a rebuttal. So they asked the novelist. They asked me to tell a story.

  But the trouble is, Professor Alden has spent thirty-nine years teaching us that the world doesn't come in the shape of a story. Stories have endings. They have morals. They imply a narrator standing safely on the shore, watching the ships come in.

  Professor Alden does not believe in the shore.

  For the philosophers here, you know the image I mean. It's Neurath's Boat. We are at sea, on a vessel that is always under repair. We cannot dock. We cannot strip the hull down to the keel in dry land to inspect it for truth. We have to replace the planks while we are floating on them, using the old timber to shape the new.

  For the rest of you—her sister, her book club, the friends who know her best—this sounds abstract. But you have seen what this looks like in a human life.

  To believe in the boat is to admit that you are never finished. It is to admit that you are never safe from the need to change your mind. Most of us want to be right. We want to plant our feet on solid ground and declare, "This is the Good. This is the True." Professor Alden has spent a career telling us that there is no solid ground. There is only the integrity of the vessel we are building together, plank by plank.

  I remember once, years ago, asking her about a decision she'd made regarding a tenure case. It was a hard call. I asked her if she thought she'd done the *right thing*.

  She corrected me. She said, "I did the thing that cohered better with everything else I believed than the alternative would have."

  At the time, I thought that was evasive. I thought it was a philosopher's way of dodging responsibility. But over time, I've come to realize that it is actually a much heavier burden to carry. To say "I did the right thing" implies you have a direct line to a moral authority outside yourself. It implies you are a judge.

  To say "it cohered better" implies you are a carpenter. It implies you are responsible for the fit, for the strength, for the way your actions hold up the people standing next to you on the deck.

  There is a line in a late essay by Quine—slim, under-read, the one she has defended with a stubbornness her critics call admirable and she calls merely consistent—which suggests that our values are not commands from the sky. They are part of the same web as our beliefs about quarks and continents. They are revisable. They are fragile.

  For the philosophers in the room: She has held this line against realism for four decades, refusing to grant herself the comfort of a God's eye view.

  For the rest of the room: This means she never looked down on us. She never judged us from a height she claimed to occupy alone. When she corrected us, when she guided us, when she cared for us, she was not handing down a verdict. She was handing us a plank. She was saying, *Help me fix this. Help me make it hold.*

  There is a specific kind of love in that. It is not the love of a savior who pulls you from the water. It is the love of a shipmate who checks your knots. It is the love of someone who knows that the only thing keeping the water out is the care we take with the wood we have in our hands.

  Professor Alden, you have taught us that we cannot step off the boat. But you have also shown us that we do not have to float alone. You have shown us that coherence is not just a logical standard. It is a form of fidelity. It is the promise that when we replace a plank, we do it in a way that keeps the whole thing afloat for everyone else on board.

  So, I will not say that you have been a "good" professor, because that suggests a standard outside this room to which you answered.

  I will say that your life has cohered. Your work, your words, your kindness, and your stubbornness fit together. They hold water. They hold *us*.

  To Professor Alden. May the boat hold. And may we all be as careful with our planks as you have been.
