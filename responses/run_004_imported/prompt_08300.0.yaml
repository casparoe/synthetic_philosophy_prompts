      *   The "Right Thing" vs. "Coherence."
      *   Closing: The boat is love because we keep it afloat together.

  6.  **Polishing the Tone:**
      *   Needs to sound like a novelist wrote it (evocative, rhythmic) but spoken by a former student (respectful, intimate).
      *   Avoid academic pretension, but don't dumb it down so much that the philosophers roll their eyes.
      *   *Key constraint check:* "Sounding like love, not like a defense of naturalized epistemology."

  7.  **Final Review against Constraints:**
