answer: |-
  Your editor is giving you the "safe" answer, but your instincts are spot on: reducing this to "smart people can be bad at math" misses the fascinating philosophical and methodological wreckage at the heart of the Hobbes-Wallis feud.

  If you want to write a compelling piece, you should absolutely dig deeper. The Hobbes-Wallis conflict wasn't just a mathematician correcting an amateur; it was a clash between two fundamentally different visions of what "knowledge" actually is. Hobbes didn't fail to see the holes in his proofs simply because he was proud (though he was incredibly proud); he failed because **he didn't accept the rules of the game Wallis was playing.**

  Here is the substantive context you're looking for to explain why a genius like Hobbes turned into a mathematical dogmatist.

  ### 1. Geometry as Philosophy, Not Calculation
  When Hobbes discovered Euclid in his 40s (reportably starting at Proposition 47, the Pythagorean theorem), he didn't fall in love with *mathematics*; he fell in love with *certainty*.

  For Hobbes, geometry was the only branch of philosophy where humans could achieve absolute truth because we define the premises ourselves (unlike in physics, where we have to observe a messy God-made world). He believed geometry was the study of **motion and bodies**. To Hobbes, a line is a trace of a moving point; a circle is generated by a specific motion.

  Consequently, Hobbes believed he could solve geometric problems through **verbal logic and conceptual deduction**, rather than algebraic calculation. He treated geometry as a subset of his materialist philosophy. When Wallis attacked him using algebra and symbolic notation, Hobbes often literally dismissed the symbols as "meaningless marks." He thought Wallis was playing a parlor trick with numbers, while he, Hobbes, was reasoning about the *nature* of the circle itself. He couldn't see the holes in his proofs because he wasn't looking for numerical inconsistencies; he was looking for logical flow in prose.

  ### 2. The Stakes Were Existential (The System Problem)
  This is the critical point for your piece. Hobbes wasn't just tinkering with a puzzle; he was trying to validate his entire life's work.

  Hobbes planned a three-part philosophical system:
  1.  **De Corpore (Body):** Matter, motion, and geometry.
  2.  **De Homine (Man):** Human psychology and sensation.
  3.  **De Cive/Leviathan (Citizen):** Politics and society.

  The system was built from the ground up. The politics of *Leviathan* relied on the psychology of *De Homine*, which relied on the physics and geometry of *De Corpore*.

  When Hobbes published *De Corpore* in 1655, it included his claim to have squared the circle. When Wallis proved him wrong, he wasn't just correcting a math error; **he was undermining the foundation of Hobbes's entire philosophical system.** If Hobbes admitted he was wrong about geometry, he had to admit his method of reasoning about "body and motion" was flawed. If that was flawed, his physics was flawed. If his physics was flawed, his political theory lost its claim to "scientific" certainty.

  Hobbes couldn't admit the error because, philosophically speaking, he *couldn't*. To concede to Wallis was to concede that *Leviathan* was built on sand.

  ### 3. The Methodological Blind Spot (Synthetic vs. Analytic)
  There was a genuine historical shift happening here that Hobbes resisted. Wallis represented the new wave of **analytic mathematics** (using algebra to solve geometric problems). Hobbes was a staunch traditionalist who insisted on **synthetic geometry** (Euclidean style, using only compass and straightedge logic), but he distorted it with his own definitions.

  Wallis would show that Hobbes's ratios didn't add up numerically. Hobbes would respond by saying the numbers were irrelevant if the *concept* of the motion was sound.

  A famous example: Hobbes defined a "point" not as a dimensionless location (the standard definition), but as a body with magnitude that is too small to be divided. This sounds like a philosophical nitpick, but it broke the calculus of the time. Because Hobbes redefined the fundamental axioms to fit his materialist philosophy, he created a closed logical loop where his proofs *did* work, provided you accepted his weird definitions. Wallis kept shouting, "You're using the wrong definitions!" and Hobbes kept shouting, "You're using the wrong philosophy!"

  ### 4. Was He a Crank?
  In the modern sense, yes, but a high-functioning one. Historians of math generally agree that Hobbes had a "blind spot" for quantitative reasoning. He was a master of qualitative logic (if A, then B), but he struggled when the logic required manipulating abstract quantities that didn't correspond to physical objects.

  However, calling him a "crank" ignores the political dimension. The feud was also proxy warfare. Wallis was a Puritan and a founding member of the Royal Society. Hobbes was a Royalist, suspected of atheism, and hated by the Royal Society (they actually banned him from membership largely because of this feud). For Wallis, debunking Hobbes was a way to assert the authority of the new scientific establishment over the old-guard philosophical loners. For Hobbes, fighting Wallis was a fight for his reputation as the premier intellect of the age.

  ### The Angle for Your Piece
  If I were editing this, I'd suggest framing it not as "Hobbes was bad at math," but as **"Hobbes tried to conquer math with philosophy, and philosophy broke."**

  The tragedy of Hobbes isn't that he was stupid; it's that he was so committed to his system of materialist deduction that he became incapable of recognizing a form of truth (mathematical proof) that didn't fit his system. He spent 25 years trying to square the circle because he believed that if his logic was sound, reality *had* to comply. Wallis was there to remind him that the universe doesn't care about your syllogisms.

  **Key takeaway:** He didn't lack the geometric chops to see the errors; he lacked the **epistemological humility** to accept that his philosophical framework was the wrong tool for the job. That's a much richer story than "smart guy made a dumb mistake."
