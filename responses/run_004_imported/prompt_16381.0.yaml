answer: |-
  The tent flaps snapped in the wind, a rhythmic accusation against the silence inside. Commander Ban stood over the map table, his hand resting on the hilt of a sword that had not yet seen blood. Across from him stood Master Ju, the logistics overseer, calm as a still pond. Between them, on the ground, lay ten crates of cold iron ingots.

  "The sun rises in two hours," Ban said, his voice low. "The enemy crosses the pass at dawn. I need arrows."

  Ju bowed slightly. "The iron is delivered. The quota is met."

  "These ingots are not arrows," Ban said, pointing at the crates. The word *not* hung in the air, heavy and sharp.

  Ju nodded approvingly. "Precisely. An arrow requires a shaft of bamboo, fletching of eagle feather, and a tip of forged steel. These possess none of those names. Therefore, these ingots are not arrows. To claim otherwise would be to misuse language."

  Ban's hand tightened on his sword. He heard the word *not* as a exclusion from a category. To him, Ju was saying: *This supply does not belong to the class of things usable for war.* It was a refusal. "You stand in a military camp, Master Ju. Here, function defines name. If it can be shot to kill, it is an arrow. If it is iron waiting to be shot, it is still an arrow in potential. To separate the metal from the death it brings is to dissolve the reality of war."

  Ju smiled thinly. This was the temperament of the unifier, the man who saw Heaven and Earth as one grain, who dissolved distinctions to suit his urgency. "I do not dissolve reality, Commander. I preserve the integrity of names. If I send you iron and call it arrows, I lie. When you report to the Duke that you received arrows, and he finds only blocks of metal, who is punished? I am merely ensuring that 'arrow' means 'arrow' and 'iron' means 'iron'. Hard is hard. White is white. Iron is not arrow."

  "But the contract," Ban snapped, "stipulated 'weapons for defense.' You argue that because the iron is not *identical* to the finished weapon, it does not satisfy the category of weapon. You are hiding behind the slip of a word."

  "I am hiding behind nothing," Ju replied, his voice smooth. "I am clarifying. You asked for arrows. I gave iron. Iron is not arrows. If you wanted iron, you should have asked for iron. If you asked for arrows, you should have received arrows. Since you received iron, and iron is not arrows, the transaction regarding arrows is void. I have fulfilled the letter; you are failing the spirit."

  Ban stepped closer, the shadow of his helmet falling over the ingots. He heard the equivocation clearly now, though he lacked the philosopher's terms for it. Ju meant *non-identity*: The concept of 'ingot' is not the concept of 'arrow'. Ban heard *non-membership*: These ingots do not count as arrows for the purpose of this army.

  "If I take this iron to the front," Ban said, "my archers will hold useless weights. They will die. If they die because you decided that 'iron is not arrow,' then your precision is murder."

  "Murder implies intent," Ju corrected. "I intend only truth. If you forge them now, they become arrows. Until then, they are not. To say they are is to claim the seed is the tree. You wish to eat the seed and call it fruit."

  "The enemy does not care about seeds!" Ban roared, slamming his fist on the table. "They care about steel in their chests! In the context of battle, the distinction collapses. The iron *is* the arrow because it will become the arrow. To deny this is to deny the flow of time itself."

  "And to affirm it," Ju countered, unmoved, "is to deny the stability of language. If iron is arrow, then a plowshare is also an arrow. A cooking pot is an arrow. Everything is an arrow, and nothing is an arrow. If everything is an arrow, Commander, then you have no need of me. You have enough arrows in the air you breathe."

  Ban drew his sword. The steel sang, a unified note of violence. "I have no time for the School of Names. I have a battle to fight. You say these are not arrows. Fine. Then you have not delivered the tribute. You have not fulfilled the contract. By law, failure to supply weapons is treason."

  Ju's eyes widened slightly, the first crack in his composure. He had argued for semantic precision, for the separation of categories to maintain logical purity. He meant: *The object in the crate is not identical to the object you requested.* But Ban heard: *The object in the crate does not satisfy the requirement of the contract.*

  "Commander," Ju said, his voice losing its rhythmic calm. "I delivered the material. The material satisfies the need."

  "You said it yourself," Ban replied, stepping around the table. "Iron is not arrow. Therefore, you brought no arrows. Therefore, you brought no weapons. Therefore, you have aided the enemy by withholding supply."

  "That is a distortion," Ju pleaded, taking a step back toward the crates of useless metal. "I am distinguishing essence from form!"

  "And I am distinguishing life from death," Ban said. "And right now, your distinction costs you your head."

  The wind outside howled, blurring the line between the scream of the gale and the cry of a man. Ju looked at the iron, solid and real, and then at the sword, sharp and final. He realized too late that while he had been busy separating the hard from the white, the Commander had united the word with the deed. The word *not* had built a wall between them, and now the wall was closing in.
