answer: |-
  This is a remarkably astute observation, and it is no accident that your seminar on interwar European political thought has primed you to see it. Even if no text you've read describes a university student government specifically, the period between the World Wars was defined by a profound crisis of confidence in liberal parliamentary democracy, the rise of mass mobilization parties, and the tension between *deliberation* and *decision*.

  What you are describing is not necessarily a moral failing unique to your peers, but a structural pathology of organized political life that theorists have been diagnosing for a century. Your two friends offer you the classic dichotomy of political ethics: **Realism** (politics is the art of the possible) vs. **Purism** (politics must remain true to principle). Neither is fully satisfying because both are incomplete.

  Here is a framework for understanding what is happening to your slate, followed by a way to weigh your options that moves beyond the binary of "stay and conform" or "leave and protest."

  ### 1. Diagnosing the Dynamic: Three Theoretical Lenses

  You are witnessing three specific phenomena that political sociology and theory have names for. Recognizing them might help you detach emotionally and analyze the situation strategically.

  **A. The Iron Law of Oligarchy (Robert Michels)**
  Although Michels wrote slightly before your seminar's timeframe (1911), his work haunted the interwar period. He argued that all organizations, no matter how democratic their beginnings, eventually develop an oligarchic leadership focused on **organizational self-preservation**.
  *   **The Symptom:** You noted that the slate votes as a bloc on issues unrelated to the platform just to "keep the slate intact for next year."
  *   **The Diagnosis:** The organization has ceased to be a vehicle for student interests and has become an end in itself. The goal is no longer *governance*; it is *perpetuation*. When the survival of the coalition becomes more important than the quality of the decisions it makes, you have entered the Iron Law.

  **B. The Friend/Enemy Distinction (Carl Schmitt)**
  Schmitt, a central (and controversial) figure of your seminar's era, argued that the specific essence of "the political" is not policy or truth, but the distinction between Friend and Enemy.
  *   **The Symptom:** Dissent is suppressed not because it is *wrong*, but because it helps the "Enemy" (the rival slate). Energy flows into undercutting rivals rather than championing causes.
  *   **The Diagnosis:** Your slate has adopted a **decisionist** posture. Truth is secondary to the strength of the collective will against the adversary. This creates a "cartel" dynamic where the two slates may actually depend on each other's existence to justify their own discipline. If the rival slate vanished, your slate's internal cohesion might collapse because it would lose its defining boundary.

  **C. Goal Displacement (Sociology of Organizations)**
  This occurs when the *means* to an end become the *ends* themselves.
  *   **The Symptom:** Recruiting, merchandise, and winning elections (means) consume more energy than the actual platform causes (ends).
  *   **The Diagnosis:** The machinery of politics has eaten the substance of politics. This is common in mass parties where the bureaucracy of campaigning becomes a career or a lifestyle for participants, distinct from the ideology they claim to represent.

  ### 2. Evaluating Your Friends' Advice

  Your friends are echoing a debate that Max Weber crystallized in his 1919 lecture *Politics as a Vocation*. He distinguished between two ethics:

  **Friend 1 (The Realist): The Ethic of Responsibility**
  *   **The Argument:** "This is simply what organized politics looks like."
  *   **The Truth:** They are descriptively correct. Representative systems require discipline. If every member acted independently, the slate would fracture, lose the election, and yield power to the rival (who, you note, operates the same way). To govern effectively, you often need to swallow small disagreements to maintain the coalition necessary to pass big things.
  *   **The Danger:** Taken too far, this leads to cynicism. If *everything* is subordinated to power, the slate loses its legitimacy. Students will eventually realize the platform is a sham, leading to apathy.

  **The Risk:** If you stay and adopt this view entirely, you risk what Weber called becoming a "sterile excitation"—someone who plays the game of power without any connection to substantive values.

  **Friend 2 (The Purist): The Ethic of Ultimate Ends**
  *   **The Argument:** "Quit and act as an independent."
  *   **The Truth:** They are normatively correct. Politics *ought* to be about truth and the common good, not just team sports. Maintaining your intellectual integrity is vital.
  *   **The Danger:** In a system dominated by slates, an independent is often irrelevant. You may keep your hands clean, but you will likely lose the ability to influence outcomes. This is the tragedy of the "beautiful soul" who refuses to engage with the messy machinery of power.

  **The Risk:** You preserve your conscience but surrender your agency.

  ### 3. A Third Way: The "Constructive Insider"

  You do not have to choose between becoming a cynical machine operator or a powerless outsider. As a politics student, you have the vocabulary to navigate a middle path. Consider adopting the stance of a **Constructive Insider**.

  **Step 1: Distinguish "Core" from "Peripheral"**
  Not all platform planks are equal. Draw a private line.
  *   **Core Issues:** Matters of fundamental justice or university governance that you cannot compromise on.
  *   **Peripheral Issues:** Tactical positions, budget allocations, or symbolic gestures where party discipline is the price of admission.
  *   **Action:** Nod along on the peripheral issues (accepting the Weberian "Ethic of Responsibility"), but reserve the right to dissent on Core Issues. If the slate demands you violate a Core Issue, *that* is the moment to threaten to break ranks or quit. This makes your dissent more powerful when it happens.

  **Step 2: Reframe Dissent as "Strategic Strength"**
  When you raise disagreements in meetings, stop framing them as moral objections ("This is wrong") and start framing them as strategic risks ("This position is vulnerable to attack," or "This alienates the swing voters we need").
  *   The slate cares about winning. If you can demonstrate that suppressing debate leads to brittle platforms that crack under pressure, you can argue for more internal honesty *in the service of* electoral success. This uses their logic to create space for yours.

  **Step 3: Test the Cartel**
  You mentioned the two slates seem to mirror each other. Is there room for cross-slate cooperation on specific issues?
  *   If the slate votes as a bloc on issues *unrelated* to the platform just to maintain discipline, propose a motion to allow a "free vote" on those specific items. Frame it as "trusting our members' judgment." If the leadership rejects this, it confirms the organization is about control, not representation. That data point will help you decide if it's time to leave.

  **Step 4: Set an Exit Trigger**
  Decide now what would make staying untenable. Is it being asked to lie? Is it being asked to vote against a policy that harms students? Is it the realization that no policy work is getting done at all?
  *   Having a pre-determined red line prevents "mission creep," where you keep compromising a little bit more each month until you don't recognize yourself.

  ### 4. Conclusion: The Value of the Seminar

  Your seminar on interwar thought is doing exactly what it should. That era taught us that liberal democracy is fragile, that institutions tend toward self-preservation, and that the "masses" can be mobilized by form rather than substance.

  You are not naive for wanting politics to be about more than team loyalty; you are experiencing the tension between **legitimacy** (doing the right thing) and **efficacy** (getting things done).

  **My recommendation:** Do not quit yet, but do not surrender your critical faculty. Stay for the remainder of the term as an observer-participant. Try to shift the internal culture slightly toward more honest debate using the "strategic" arguments above. If you find the organization demands you violate your core principles to maintain the "Friend/Enemy" boundary, then leave—but leave with a clear explanation of *why*, grounded in the very political theory you are studying.

  That is not naivety; that is political education.
