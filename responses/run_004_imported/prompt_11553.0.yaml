answer: |-
  Thank you, Your Honor. And thank you to everyone here.

  I have the distinct privilege of being the filling in a very high-stakes sandwich today: following a distinguished appellate judge, and preceding the woman who actually raised the Judge. I'll do my best to keep the philosophy light and the affection heavy.

  [Judge's Name] and I met in the library during our first year of law school. We were the kind of students who thought every legal problem had a perfect answer hidden in a footnote. We thought if we just read enough cases, justice would reveal itself like a mathematical proof.

  But the law isn't math. And as we move from studying the law to wielding it, we have to confront a harder truth.

  There is a famous fragment from the philosopher Blaise Pascal that many of you in the bar will recognize. He wrote, "Justice without force is powerless; force without justice is tyrannical."

  It's a beautiful line. But Pascal went further. He noted, quietly and coldly, that in this world, we often obey laws not because they are perfectly just, but simply because they are the laws. We obey the judge not because she is infallible, but because she is the judge.

  For the family and friends here: This isn't cynicism. It's the reality of the office your daughter is assuming. A trial judge holds the actual force of the state in her hands. She can order a person to leave their home, to lose their freedom, or to pay what they owe. People must obey her rulings so that society functions. That authority is automatic. It comes with the robe.

  But for [Judge's Name], that is not the end of the story. It is the beginning.

  She knows that the "force" part of the equation is guaranteed by the bailiffs and the statutes. The "justice" part? That is not guaranteed. That is up to her.

  Pascal's point isn't that we should give up on justice. It's that the burden of the office is to make the force worthy of obedience. It requires a specific kind of humility. It requires knowing that the gavel commands silence, but only your character commands respect.

  I have watched [Judge's Name] prepare for this moment for fifteen years. I have seen her agonize over the hard calls, the ones where the rule and the right thing seem to pull in opposite directions. She is not taking this bench because she thinks she has all the answers. She is taking it because she understands the weight of the questions.

  To the lawyers in the room: We know that a trial court is where the abstract meets the human. It is where the force of the state touches the citizen.

  To her family: You know her heart. You know she treats power as a responsibility, not a reward.

  [Judge's Name], you understand that the authority of this court rests on more than precedent. It rests on the integrity of the person wearing the robe. We are not here because we think the system is perfect. We are here because we trust *you* to navigate its imperfections with courage and with grace.

  The force is yours by law. The justice is yours by labor. We are all better off knowing you're the one doing the work.

  Congratulations, Your Honor.
