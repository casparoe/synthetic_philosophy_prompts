      *Drafting the specific Pascal section:* "Pascal warned that we obey laws because they are laws, not because they are always just. It sounds cynical. But for a trial judge, it's the daily reality. You hold the gavel. People must listen. That power is dangerous in the wrong hands. In her hands, it's safe." -> A bit cliché.
