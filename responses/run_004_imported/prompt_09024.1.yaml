      *   *The "Satisfaction" Theory:* Anselmian satisfaction. The honor of the sovereign is offended. The sovereign can accept satisfaction from a proxy if the proxy has sufficient "worth."
      *   *The "Union" Argument:* If the substitute and the guilty are united (mystically, legally, or relationally), the punishment of one *is* the punishment of the other. Lewis addresses this briefly, but I can strengthen it.
      *   *The "Voluntary Assumption of Liability" Argument:* This is the strongest philosophical lever. If liability is a burden, and burdens can be voluntarily assumed by others (like debt), why is penal liability unique?
      *   *Lewis's Weak Point:* He treats punishment as essentially *backward-looking* (you did it, you pay). But even retributivism has a *forward-looking* element (restoration of the moral order). If the moral order is restored by the substitute's sacrifice, the retributive demand is met.

  5.  **Drafting the Response - Section by Section:**

