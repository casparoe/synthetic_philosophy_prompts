      *   *Better Angle:* **The Victim's Prerogative.** Retribution is often framed as the victim's (or state's) right. Rights can be waived or satisfied by third parties. If I have a right to punch you for punching me, and your friend says "Punch me instead, and I'll consider the debt paid," and I agree, is justice done? Lewis says no. I say yes, because the *claim* was mine to settle.

  7.  **Final Polish:**
