      *   **Point 2: The Nature of the Retributive Claim.** Who is the creditor? If it's the State/Victim, they can waive or transfer. If it's "The Moral Order," does the Order care *who* suffers, or just that the imbalance is corrected? Lewis says the Order cares. Counter: The Order cares about the *cost* paid, not the *payer*, provided the payer volunteers.
