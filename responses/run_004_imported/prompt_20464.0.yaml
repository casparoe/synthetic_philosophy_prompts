  2.  **Deconstruct Aumann's Agreement Theorem:**
      *   *Core Claim:* If two agents are Bayesian rationalists, share a common prior, and have common knowledge of each other's posterior probabilities, their posteriors must be identical.
      *   *Implication for Trading (Milgrom-Stokey No-Trade Theorem)::* If you know someone is willing to take the other side of a bet, and you know they are rational and have the same prior, you should infer they have information you don't. This should update your belief until the bet disappears. Speculative trade shouldn't happen among rational agents with common priors.
