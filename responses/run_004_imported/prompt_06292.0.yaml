  - The "four stages" (hunting, shepherding, agriculture, commerce).

  *Final Plan:*
  1. Intro: Define the stakes. Thesis: Smith critiques the *mercantile management* of empire, not imperial connection *in principle*.
  2. Economic Analysis: Monopoly hurts the many for the few.
  3. Moral Critique: Condemnation of violence, but rooted in justice/property, not sovereignty.
  4. The Union Proposal: The strongest evidence against "anti-imperialism."
  5. Four Stages: Hierarchy allows for "civilizing" logic.
  6. Conclusion: Smith is a liberal reformer, not a post-colonial critic.

