answer: |-
  **Title:** The Reformer, Not the Abolitionist: Adam Smith and the Critique of Mercantile Empire

  The disagreement among your students mirrors a enduring schism in the scholarship on Adam Smith. On one side stands the view of Smith as a proto-anti-imperialist, whose moral outrage at the violence in the Americas and the East Indies, combined with his economic demolition of colonial monopoly, amounts to a rejection of empire *as such*. On the other side stands the view of Smith as a liberal reformer, whose target is not imperial connection but the *mercantile system* that distorts it, leaving open the possibility of a voluntary, commercially integrated union. While the moral force of Smith's indictment of European cruelty is undeniable, a close reading of Book IV, Chapter VII of *The Wealth of Nations*, supported by his theoretical framework in the *Lectures on Jurisprudence*, compels us to side with the latter group. Smith's position is best characterized not as a principled critique of empire, but as a devastating critique of the mercantile management of empire. He opposes the *empire of monopoly and force*, but he remains committed to the ideal of an *empire of law and commerce*.

  To understand why Smith is not an anti-imperialist in the thoroughgoing sense, we must first examine his economic analysis of who profits and who pays. Smith's argument is not that colonies are inherently a drain, but that they are made so by restrictive legislation. He demonstrates that the monopoly of the colony trade forces British capital into a channel less advantageous than it would choose in a free market. The result is that the general interest of the nation is sacrificed to the "clamour and sophistry" of merchants and manufacturers. Smith writes that under the present system, "the monopoly of the colony trade... so far as it has operated at all, has been unfavourable to the colony, and unfavourable to the mother country."

  Crucially, however, this is a critique of *allocation*, not *sovereignty*. Smith argues that if trade were free, the colonies would naturally purchase British manufactures because of quality and proximity, rendering coercion unnecessary. The cost he identifies is the cost of defense and administration required to sustain the monopoly against foreign rivals and colonial smuggling. He notes that Britain derives no revenue from the colonies to offset the expense of their protection. This is an accounting error of the mercantile state, not a moral indictment of political association. If the colonies contributed to the revenue (as he later proposes), the fiscal imbalance would vanish. Thus, the economic critique targets the *mechanism* of extraction (monopoly), not the *fact* of connection.

  The students who argue for Smith's anti-imperialism rely heavily on his unsparing moral commentary regarding indigenous peoples. Smith indeed breaks with the complacency of many contemporaries. He describes the European treatment of the natives of the Americas as "unjust" and the conduct of the East India Company as a unique historical anomaly where "a company of merchants... became sovereigns of a great kingdom." He attributes the depopulation of the Americas to "savage injustice" and condemns the Bengal famine as a product of Company misrule.

  Yet, even here, Smith's critique is rooted in a jurisprudence of property and justice rather than a rejection of dominion. In Smith's four-stages theory of societal development (hunting, shepherding, agriculture, commerce), societies are ranked by their mode of subsistence and the complexity of their property relations. While Smith insists that the "savage" nations of America have a right to their lands (rejecting the *terra nullius* doctrine often used to justify seizure), he also views the transition to agriculture and commerce as a historical inevitability and a moral improvement. His outrage is directed at the *means* of displacement—violence, fraud, and the corruption of the East India Company—not necessarily the *end* of European settlement itself. He envisions a world where commerce softens manners and creates interdependence. The violence he condemns is that which disrupts this natural progress through coercive monopoly. He attacks the *abuse* of power, implying that a just exercise of power would be legitimate.

  The definitive evidence against the "anti-imperialist" reading, however, lies in Smith's concrete political remedies for the American crisis. If Smith believed empire was inherently illegitimate, his solution would be immediate withdrawal. Instead, in the closing pages of the chapter, he outlines a scheme for a "incorporating union." He proposes that the American colonies be represented in the British Parliament in proportion to the taxation they contribute. He calls this "the only way" to preserve the connection equitably. He acknowledges the political difficulties, admitting that the "haughty and distant" tone of the British ministry makes it unlikely, and that the "principal people" of America might prefer independence.

  However, Smith's assessment of feasibility is distinct from his assessment of principle. He writes, "That great purpose [union]... may, perhaps, be best attained by... a union." He views separation as a concession to British stupidity, not as a moral imperative. He fears that independence would lead to American hostility or alignment with Britain's European rivals. His preference for a federalized British empire demonstrates that he sees value in the political bond, provided it is based on reciprocal representation and free trade. He is willing to dismantle the *mercantile* empire to save the *liberal* empire. This distinguishes him sharply from a critic of empire *as such*; he is a critic of *mismanaged* empire.

  Finally, we must weigh this against Smith's four-stages theory and his ranking of societies. Smith is a theorist of progress. He believes that commercial society offers the highest potential for liberty and opulence. While he is acutely aware of the moral hazards of commerce (the dulling of the mind, the inequality of ranks), he does not view the spread of European commercial law as an inherent evil. In fact, he implies that the extension of British law and liberty to the colonies is a good thing, provided it is not tainted by the corruption of the mercantile system. His "anti-imperialism" is limited by his cosmopolitanism: he wants the benefits of global commerce to be shared, but he assumes the vehicle for this will be European-led trade networks. He does not advocate for the restoration of indigenous sovereignty in the Americas as a permanent political state; he advocates for their just treatment within the inevitable march of commercial expansion.

  Therefore, the verdict must be that Smith's treatment of colonies amounts to a critique of the mercantile system, not of empire in principle. To call Smith an anti-imperialist is to anachronistically project a twentieth-century notion of self-determination onto an eighteenth-century mind concerned with the alignment of sovereignty and taxation. Smith argues that the mercantile system makes empire a net loss for the metropole and a nightmare for the periphery. But his solution is not the dissolution of political ties; it is the transformation of those ties from coercive monopoly to voluntary integration.

  The students who see Smith as unsparing toward the mercantile system are correct; the system is, for Smith, a "mean and malignant expedient." But the students who see him weighing union against independence must recognize that Smith *prefers* union. He is a liberal imperialist *avant la lettre*, believing that empire can be redeemed if stripped of its monopolistic armor and reforged in the fires of free trade and representative government. He does not want to end the British Empire; he wants to stop it from behaving like a trading company and start behaving like a state. In this light, Smith is not the abolitionist of empire, but its most rigorous auditor, seeking to balance the books of justice and efficiency so that the imperial project might survive on legitimate grounds.
