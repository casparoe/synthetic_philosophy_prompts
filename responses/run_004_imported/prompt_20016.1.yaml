prompt: |-
  Okay, slightly random research question, but I'm hoping you can help. I'm about a third of the way into a novel where a big subplot is a family fighting a hospital over whether their teenage son -- declared brain dead after a car crash -- still counts as dead, legally speaking. I don't want to lean on the one case everybody sort of half-remembers from the news a few years back (the girl who was kept on a ventilator for years after being declared brain dead), and I definitely don't want my neurologist character's big scene to boil down to "his brain doesn't work anymore, that's the legal definition, I'm sorry" -- I want it to sound like she's actually read the literature and knows where the cracks are.

  From some reading I did ages ago for a totally different project, I have this vague memory that the law basically treats whole-brain death and circulatory death as two interchangable ways of pointing at the same underlying event -- like they're guaranteed to always line up -- but that there's a real, ongoing fight among doctors and philosophers over cases where the two criteria actually pull apart, or where treating them as equivalent leads somewhere genuinely uncomfortable. Could you give me one specific example of that kind (not the ventilator case, something further into the weeds) and actually walk me through the mechanism -- not just "the heart can keep going for a while after brain death" as a bare fact, but why that's supposed to be a real problem for the concept of death itself, not just a technicality -- so I can put a version of it in her mouth and have it land like something she's actually thought hard about.
