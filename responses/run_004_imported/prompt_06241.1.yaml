answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Senate
  **FROM:** The Committee on Named Prizes and Lectureships
  **DATE:** October 14, 2023
  **SUBJECT:** Recommendation Regarding the Frege Prize

  **I. Recommendation**

  The Committee on Named Prizes and Lectureships recommends that the university **retire the name "Frege Prize" for the undergraduate award**, replacing it with the descriptive title: **The Undergraduate Prize in Logic and Philosophy of Language.**

  Concurrently, the Committee recommends that a portion of the existing endowment income be reallocated to establish an annual **Frege Lecture on Logic and Ethics**. This lecture series would be mandated to address the intersection of formal systems and moral responsibility, explicitly contextualizing Gottlob Frege's foundational contributions alongside the revelations of his 1924 diary.

  **II. Context and Deliberation**

  This recommendation follows a semester of rigorous deliberation regarding the petition submitted by the Graduate Student Association. The Committee found itself evenly divided between two principled positions.

  The first position argued that the integrity of Frege's logical work (*Begriffsschrift*, "On Sense and Reference") remains objective and untainted by his private prejudices. Proponents of retaining the name cited Michael Dummett's assessment that while Frege's character was compromised, his philosophical estimates remain unaltered. To remove the name, this group argued, risks a presentist erasure of history and implies that the logic itself is corrupted by the logician's bigotry.

  The second position argued that a named prize is not merely a descriptor of content but an honorific act. To attach a student's name to Frege's on a permanent academic record is to imply endorsement. Given the specific content of the diary—vehement antisemitism and a rejection of the democratic values this university claims to uphold—this group argued that retaining the name causes tangible harm to the community and signals that intellectual brilliance excuses moral failure.

  **III. Reasoning**

  As a non-specialist on this committee, I was asked to listen not for the technical validity of the logic, but for the narrative weight of the name. In doing so, I have come to believe that both sides of this committee are correct, but they are correct about different things.

  To those who argue that Frege's work must be preserved and honored: This recommendation affirms that his work is indeed too significant to be discarded. By establishing the **Frege Lecture**, we ensure his name remains central to the intellectual life of the department. We acknowledge that modern logic and analytic philosophy stand on the foundation he poured. We accept Dummett's distinction: we do not alter our estimate of the work.

  However, to those who argue that naming is a form of endorsement: We must acknowledge that a prize awarded to an *undergraduate* carries a different weight than a lecture series attended by *faculty*. A prize suggests a lineage of virtue; it suggests a role model. When a twenty-year-old student receives the "Frege Prize," their achievement is inextricably linked to Frege's personhood in a way that a scholar attending a lecture is not. The student is being invited into a tradition. If that tradition honors a man who wished for authoritarian rule and the exclusion of Jews from public life, we are asking that student to accept a poisoned inheritance.

  We cannot separate the man from the work entirely, but we can separate the *honor* from the *history*.

  By renaming the undergraduate prize, we protect the students from being unwitting ambassadors of Frege's bigotry. We acknowledge that while his logic may be neutral, the *honor* of his name is not. This is not an erasure of Frege; it is a refinement of how we remember him. We preserve the philosopher for critical study, but we retire him as a patron saint.

  **IV. Implementation**

  1.  **Renaming:** All future award certificates, departmental listings, and CV verifications will utilize the descriptive title. Past winners will be grandfathered; they may choose to list the award as either the "Frege Prize" or the "Prize in Logic and Philosophy of Language" on their resumes, acknowledging the historical record at the time of their achievement.
  2.  **The Frege Lecture:** The inaugural lecture should explicitly address the 1924 diary. The endowment charter will be amended to require that the lecturer engage with the ethical dimensions of logic, ensuring that Frege's name is henceforth associated not only with brilliance but with the necessary scrutiny of that brilliance.
  3.  **Plaque:** A permanent plaque will be installed in the Philosophy Department lounge detailing the history of the endowment, Frege's contributions, and the reasons for the name change. We do not hide the past; we annotate it.

  **V. Conclusion**

  We are not judging 1924 by the standards of 2023. We are judging our own institution by the standards we claim to hold today. We can hold two thoughts in our minds at once: that Gottlob Frege was one of the greatest minds in the history of philosophy, and that he was a man whose hatreds disqualify him from being the namesake of our students' highest achievements.

  This compromise allows us to honor the work without endorsing the man. It allows us to keep the history without inflicting the harm. It accepts that while logic may be timeless, the community that practices it is not.

  Respectfully submitted,

  [Your Name]
  Committee on Named Prizes and Lectureships
  *(On behalf of the Committee)*
