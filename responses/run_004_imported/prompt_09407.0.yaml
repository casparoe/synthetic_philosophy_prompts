          *   Ghazali's Rebuttal: Whether the outcome is determined (100%) or probabilistic (50/50), if you attribute the *power* to produce the effect to the created entity (electron, fire, cotton) rather than God, you are committing *shirk* (associating partners with God) in the realm of causality.
      *   *The Category Error:* QM indeterminacy is still a claim about *natural powers* residing in nature (even if probabilistic). Ghazali denies *any* natural power resides in nature. For Ghazali, the electron doesn't have the power to decay; God creates the decay event.
