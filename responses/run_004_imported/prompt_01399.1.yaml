prompt: |-
  so in my phil of sci class we just covered confirmation theory and hempel's raven paradox, and i think i found the obvious fix that no one seems to have thought of. the whole paradox only goes through because of the equivalence condition (that confirmation has to carry over between logically equivalent statements) -- so why not just drop that and keep nicod's criterion as is? then a white shoe stops confirming anything about ravens and the paradox just disappears. seems too easy for something people still treat as an unsolved problem though, so im guessing theres a reason no one actually does this - can you explain what im missing?
