answer: |-
  This is one of the best tensions in the philosophy of mathematics, and your instinct is historically and philosophically sharper than your CS auditors'. The short version is: **Your students are conflating Intuitionistic *Logic* (Heyting) with Intuitionism (Brouwer).**

  If you sat Brouwer down with a laptop running Coq or Lean, he would likely view it as a sophisticated reincarnation of the very Hilbertian formalism he spent his life fighting. He would acknowledge that the *theorems* produced are often acceptable to him, but he would reject the *account of what is happening* when those theorems are produced.

  Here is the breakdown of why Brouwer would likely call modern Type Theory a "Formalist Trojan Horse," focusing on the specific resources you mentioned: the nature of language, the Creating Subject, and Choice Sequences.

  ### 1. The "Languageless" Objection
  Your students' argument rests on the Curry-Howard correspondence: *Proofs are Programs.* They see this as the ultimate "construction." But for Brouwer, "construction" was not syntactic manipulation; it was a phenomenological event.

  Brouwer's famous dictum was that mathematics is a "languageless activity of the intellect." For him, mathematical truth happens in the private, pre-linguistic intuition of time (the "falling apart of a life moment into two distinct things"). Language, including formal symbols, is merely a tool for social coordination—a way to trigger similar constructions in another person's mind. It is not the locus of truth.

  When you show Brouwer a Lean proof, you are showing him a syntactic object verified by a syntactic checker. You are saying, "This string of symbols obeys these rules." Brouwer would reply: "I don't care about the symbols. I care about the mental act."

  To Brouwer, formalizing intuitionism is a category error. It's like trying to capture the experience of "redness" by analyzing the wavelength of light. The CS students are offering him a perfect map of the territory, but Brouwer's whole point was that the map is not the territory, and in mathematics, the map (logic/language) is dangerously seductive because it makes us think we are doing math when we are just moving signs. He wrote explicitly against the "axiomatization of intuitionism" (which Heyting did), worrying that students would learn the rules of the game without ever having the intuition. Coq is the ultimate axiomatization of intuitionism.

  ### 2. The Creating Subject and Temporality
  This is where the "Formalist Trojan Horse" accusation gets teeth. You asked about the **Creating Subject**. This is Brouwer's most radical move and the one most incompatible with standard Type Theory.

  In standard Type Theory (and classical logic), a proposition is a type. Either there is a term inhabiting it, or there isn't. The landscape of mathematical truth is static. Even if we don't *know* the term yet, the type structure is fixed Platonically.

  For Brouwer, mathematical truth is **temporal**. The Creating Subject is an idealized mathematician evolving through time. A proposition is not "true" or "false" in a vacuum; it is "proved," "refuted," or "not yet decided." Crucially, Brouwer allowed for the possibility that the Creating Subject might *never* decide a proposition, not because it's independent in a Gödelian sense, but because the mathematical act simply hasn't happened yet.

  Brouwer introduced arguments involving the Creating Subject (like Kripke's Schema, though Brouwer didn't call it that) to show that certain classical principles fail not just because they are non-constructive, but because they assume a completed totality of truths.

  In Coq or Agda, the "universe" of types is generally fixed (or stratified in a fixed hierarchy). There is no room for the *temporal becoming* of mathematical truth. A proof in Coq is a timeless object. Once verified, it is verified *sub specie aeternitatis*. Brouwer would argue this misses the essential nature of mathematics as a human, temporal activity. He would say Type Theory freezes the fluid process of mathematical creation into a static crystal and calls it "truth."

  ### 3. Choice Sequences and the Continuum
  This is the technical knockout punch. Brouwer's reconstruction of the continuum relies on **Choice Sequences** (specifically *lawless* sequences).

  In standard Type Theory, a function `Nat -> Nat` is a rule. It is a law. Even in HoTT, functions are determined by their graphs or their homotopic behavior, but they are still "objects" in a type.

  Brouwer insisted that the continuum contains elements that are *not* determined by a law. A choice sequence is generated step-by-step by the Creating Subject, with no pre-determined rule for future choices. This allows Brouwer to prove things like "All total functions on the continuum are continuous" (because you can't inspect a lawless sequence to make a discontinuous jump).

  Can Type Theory model this? Sort of. You can model choice sequences using sheaf models or specific axioms in Type Theory (like in the work of Troelstra or more recently in some HoTT extensions). **But:**
  1.  **It requires axioms.** You have to *add* the existence of lawless sequences to the system. They are not native to the core type theory.
  2.  **It breaks computation.** If you add truly lawless sequences, you often lose canonicity (the ability to reduce every term to a canonical value). The "software that checks exactly that" (as your students say) stops working or requires you to treat the choice sequences as opaque axioms.

  So, if you show Brouwer Coq, he asks: "Where are the lawless sequences?" You say: "We can model them, but we have to treat them as axioms, and we can't compute with them fully." Brouwer says: "Then your system is incomplete. It captures the law-like math, but not the continuum itself."

  ### 4. Heyting's Vindication, Not Brouwer's
  The irony here is that your CS students are actually **Heyting Formalists**.

  Arend Heyting, Brouwer's student, formalized Brouwer's insights into Intuitionistic Logic. Brouwer was famously ambivalent about this. He allowed Heyting to present the logic, but he insisted that the logic was merely a *post-facto* description of mathematical practice, not a foundation for it.

  *   **Heyting:** "Mathematics is the study of constructive proofs. We can formalize the rules of constructive proof."
  *   **Brouwer:** "Mathematics is the mental construction. Logic is just the shadow it casts."
  *   **CS Students:** "We have built a machine that checks the shadows perfectly!"
  *   **Brouwer:** "I told you the shadow isn't the object."

  Homotopy Type Theory (HoTT) adds another layer. It tries to capture "structural" identity (univalence). While this moves away from set-theoretic foundations (which Brouwer hated), it is still deeply structuralist. Brouwer was not a structuralist; he was a phenomenologist. He didn't care about the structure of the system; he cared about the *intuition of the individual mathematician*.

  ### 5. The Verdict: A "Constructive" Formalism
  So, would he call it a Trojan Horse? **Yes.**

  He would see it as **Formalism in Constructive Clothing.**
  *   **Formalism:** Because it prioritizes the syntactic system over the mental act.
  *   **Constructive Clothing:** Because it bans LEM and requires witnesses.

  He would acknowledge that it is *better* than Classical ZFC (because it doesn't lie about existence), but he would insist it is still fundamentally misguided about the *nature* of math. He would argue that by making the formal system the arbiter of truth ("If Lean accepts it, it is true"), you have repeated Hilbert's sin, just with different rules. You have outsourced the authority of mathematics from the human mind to the machine.

  **The Messy Resolution:**
  The honest answer is that Brouwer's specific metaphysical commitments (the Creating Subject, the mystical intuition of time, lawless sequences) did not survive the 20th century intact. Even most "Intuitionists" today (like Bishop) dropped the Creating Subject and the lawless sequences, keeping only the constructive rigor.

  So, in a sense, **Brouwer lost.** The "living inheritor" of his program *is* Type Theory, but it is an inheritor that rejected the testator's specific will while keeping the estate.

  If you want to push back against your students, tell them this:
  > "Brouwer wouldn't care that Coq guarantees a witness. He would ask: 'Who is constructing the witness?' If the answer is 'The CPU,' he would say you've missed the point. If the answer is 'The Human,' he would ask why we need the CPU to validate the human's intuition. For Brouwer, the intuition is self-evident. The need for a formal checker is a symptom of the decay of mathematical intuition, not its triumph."

  That should give them something to chew on that goes beyond "LEM is bad."
