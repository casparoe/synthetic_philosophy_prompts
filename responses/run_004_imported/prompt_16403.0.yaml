  9.  (Self-Correction on "Preponderance"): Actually, Element C ("case is supported by a preponderance of the evidence") is slightly redundant if A and B are factual findings, but in legal terms, it often acts as a catch-all for the burden of proof. I will treat it as a distinct premise for the sake of the logical structure provided by the user.

