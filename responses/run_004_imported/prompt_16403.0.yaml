      *   *Is "Discursive Dilemma" the best term?* Yes, or "Doctrinal Paradox." Kornhauser and Sager are the key names. List and Pettit are the key contemporary philosophers.
      *   *What about the "Preponderance of Evidence" element?* That's interesting. Element C is itself a meta-judgment. But for the logic of the paradox, it functions just like A and B.

