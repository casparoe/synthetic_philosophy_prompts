  ### The Scenario: The Virtuous Stranger and the Private Debt

  **The Characters:**
  *   **Elias (The Critic):** A morally rigorous individual who is meticulous about fulfilling his own obligations. He is a distant acquaintance of the wrongdoer, connected only through a loose professional network.
  *   **Julian (The Wrongdoer):** A man facing significant personal financial distress.
  *   **Sarah (The Victim):** Julian's estranged sister.

  **The Wrong:**
  Five years ago, Sarah lent Julian a substantial sum of money to save his home, based on a verbal promise that he would repay her once his fortunes improved. This was not a commercial loan but a familial lifeline, grounded in the special obligations of sibling solidarity. Julian's finances eventually recovered, but he chose to spend the surplus on a luxury venture rather than repaying Sarah, who is currently struggling to pay for her child's medical treatment. Julian's failure is a clear violation of a moral duty of care and reciprocity owed *specifically* to Sarah.

  **The Critic's Position:**
  Elias discovers this situation through mutual contacts. Elias is financially stable and has a reputation for being scrupulously honest; he always repays his debts and fulfills his familial duties (satisfying condition **a**). Elias was not involved in the loan, did not encourage Julian to withhold payment, and gains no material or social benefit from Julian's default (satisfying condition **b**). In fact, intervening might cost Elias social capital within the professional network.

  **The Act of Blame:**
  Elias confronts Julian at a public industry mixer. He does not merely express disappointment; he issues a stern moral reproach. He tells Julian that his failure to repay Sarah is "despicable," that he is "morally bankrupt," and demands he rectify the situation immediately. Elias speaks with the authority of a judge, despite having no personal relationship with Sarah and only a tenuous connection to Julian.

  **The Intuition:**
  Despite Elias's own moral cleanliness and lack of complicity, the overwhelming intuition is that Elias **lacks the standing** to blame Julian in this manner. He is perceived as a meddler or a moral intruder. While Julian *is* blameworthy (the blame is warranted on the merits), Elias is not the right person to deliver it. If Sarah herself blamed Julian, it would be appropriate. If a close mutual friend who supported both of them blamed Julian, it might be appropriate. But Elias's blame feels like a violation of the normative boundaries of the situation.

  ### The Feature Stripping Standing: Normative Jurisdiction

  The feature doing the work here is **a lack of Normative Jurisdiction derived from Relational Distance.**

  Moral obligations are not all of the same type. Some are *general duties* (e.g., do not murder, do not steal), which are owed to persons qua persons. Violations of general duties typically grant standing to blame to any member of the moral community. However, Julian's wrong was a violation of a *special obligation* (a duty of care and reciprocity arising from a specific familial relationship).

  Standing to blame for violations of special obligations is not universally distributed. It is primarily vested in the **participant to whom the duty is owed** (Sarah) or those who share in the **constitutive relationship** (e.g., other immediate family or close friends who sustain the norm of familial care). Elias, as a distant acquaintance, is an outsider to the normative sphere in which this specific wrong occurred. He is not a party to the sibling relationship, nor is he a guardian of that specific bond.

  By blaming Julian, Elias is not merely upholding a moral norm; he is usurping a normative authority that belongs to Sarah and her relational circle. He treats a private, relational debt as a public infraction. His "clean hands" (condition **a**) grant him integrity, but they do not grant him *jurisdiction*. Standing, in this case, is not a function of the blamer's moral record, but of their **positional authority within the relevant normative community.**

  ### Implications for the Theory of Standing

  This example demonstrates that "lacking standing to blame" cannot be reduced to a **consistency-with-one's-own-conduct requirement** (the anti-hypocrisy condition).

  1.  **Hypocrisy Accounts are Insufficient:** In the scenario, Elias passes the hypocrisy test with flying colors. He is consistent; he fulfills the very norm he demands of Julian. If standing were solely about the blamer's moral integrity or equality of standing (as in Wallace's account of hypocrisy), Elias would have full standing. The fact that he intuitively does not suggests that hypocrisy is merely *one* way to lose standing, not the *definition* of lost standing.
  2.  **Standing is Heterogeneous:** The phenomenon of standing names a cluster of conditions regarding the **normative geometry** of the situation, not just the moral character of the blamer.
      *   **Condition 1 (Integrity):** The blamer must not be hypocritical (Cohen/Wallace).
      *   **Condition 2 (Jurisdiction):** The blamer must occupy a normative position relevant to the specific wrong (e.g., victim, participant in the practice, or member of the affected community).
      *   **Condition 3 (Authority):** The blamer must not be blocked by external waivers (e.g., if Sarah had forgiven Julian, Elias's standing would be further diminished).

  Consequently, accounts that focus exclusively on hypocrisy treat standing as a property of the *blamer* (their moral record). This scenario shows that standing is also a property of the *relationship* between the blamer, the wrongdoer, and the specific norm violated. A theory of standing that ignores relational jurisdiction will fail to capture why "virtuous meddling" is still a violation of the wrongdoer's normative rights. Standing is not just about being "clean enough to speak"; it is about having the "right to speak *here*."
