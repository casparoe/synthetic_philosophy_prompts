answer: |-
  **The Causal Compass: Navigating Simpson's Paradox Beyond the Rule of Thumb**

  You are right to be skeptical of the old rule of thumb. For thirty years, you operated under the frequentist orthodoxy that stratification is the gold standard for "controlling" nuisance variables. It feels intuitive: if the data looks different in men than in women, or in mild patients than in severe ones, surely the truth lies within the subgroups, not in the muddled aggregate.

  But as you have discovered in your retirement reading, intuition is a dangerous guide when causality is involved. Simpson's Paradox is not a statistical trick; it is a causal signal. It tells us that the variable you are stratifying by is not a passive container for the data, but an active participant in the data-generating process.

  You asked for a usable rule, not a hedge. Here it is:

  **The Rule of Causal Ancestry:**
  *   **Adjust (stratify)** for variables that are **common causes** of both the treatment and the outcome (Confounders).
  *   **Do not adjust** for variables that are **consequences** of the treatment (Mediators or Colliders).

  In the language of Directed Acyclic Graphs (DAGs): **Block the backdoor paths, but never block the causal path.**

  To defend this rule and apply it to the Berkeley case, we must dismantle the idea that "controlling for a variable" is a universally good thing. In causal inference, conditioning on a variable changes the estimand. Depending on that variable's position in the causal chain, stratification can eliminate bias, introduce bias, or answer a completely different question than the one you asked.

  ### The Three Faces of the Third Variable

  Let $X$ be the treatment (or exposure), $Y$ be the outcome, and $Z$ be the variable you are considering stratifying by.

  **1. The Confounder ($Z \rightarrow X$ and $Z \rightarrow Y$)**
  This is the scenario your old rule of thumb was designed for. Suppose $Z$ is disease severity. Severe patients are more likely to get Drug A ($Z \rightarrow X$) and more likely to have poor outcomes regardless of treatment ($Z \rightarrow Y$). If you pool the data, Drug A looks bad because it is saddled with the sickest patients.
  *   **Action:** Stratify.
  *   **Why:** You need to block the "backdoor path" ($X \leftarrow Z \rightarrow Y$) that allows information to flow from treatment to outcome outside of the actual drug effect.

  **2. The Mediator ($X \rightarrow Z \rightarrow Y$)**
  Suppose $X$ is a smoking cessation patch, $Y$ is lung cancer risk, and $Z$ is tar accumulation in the lungs. The patch reduces tar ($X \rightarrow Z$), and tar causes cancer ($Z \rightarrow Y$). Here, $Z$ is the mechanism by which $X$ works.
  *   **Action:** Do **not** stratify.
  *   **Why:** If you hold $Z$ constant (compare people with equal tar levels), you block the very pathway through which the treatment operates. You are estimating the *direct effect* of the patch (perhaps via some chemical side effect), not the *total effect* of using the patch. If you stratify, you might conclude the patch does nothing, because you've mathematically removed its primary mode of action.

  **3. The Collider ($X \rightarrow Z \leftarrow Y$)**
  This is the most insidious trap. Suppose $X$ is a drug, $Y$ is a side effect, and $Z$ is "being enrolled in the study." Suppose the study only enrolls patients who either take the drug *or* have the side effect (a contrived example, but common in hospital-based studies). $Z$ is a common effect.
  *   **Action:** Do **not** stratify.
  *   **Why:** In the general population, $X$ and $Y$ might be independent. But if you condition on $Z$ (look only at enrolled patients), you induce a spurious correlation between $X$ and $Y$. This is "selection bias." Stratifying on a collider opens a door that should remain closed, creating bias where none existed.

  ### The Berkeley Admissions Controversy

  This brings us to the case that haunts every causal inference student: the 1973 UC Berkeley gender bias lawsuit.

  **The Data:**
  *   **Pooled:** Men had a higher admission rate than women. (Suggests bias against women).
  *   **Stratified by Department:** In most individual departments, women had equal or higher admission rates than men. (Suggests bias against men, or no bias).

  **The Causal Structure:**
  Let $X$ = Gender (Male/Female).
  Let $Y$ = Admission (Yes/No).
  Let $Z$ = Department Choice (Engineering vs. Humanities, etc.).

  The critical question is: **What causes Department Choice?**
  It is widely accepted that Gender influences Department Choice ($X \rightarrow Z$). Due to societal conditioning, pipeline issues, or personal preference, men and women apply to different departments.
  It is also accepted that Department Choice influences Admission ($Z \rightarrow Y$). Some departments have higher funding and accept more people; others are hyper-competitive.

  Therefore, the structure is: **Gender $\rightarrow$ Department $\rightarrow$ Admission.**
  Department ($Z$) is a **Mediator**.

  **Applying the Rule:**
  According to the Rule of Causal Ancestry, because Department is a consequence of Gender, **we should not adjust for it** if our goal is to measure the total effect of Gender on Admission.

  **The Implication:**
  The pooled data (which shows bias against women) represents the **Total Effect**. It answers the question: *"If I am a woman in this society, what are my chances of getting into Berkeley compared to a man?"* The answer is: lower. This is because women are systematically funneled into departments with lower acceptance rates.

  The stratified data (which shows no bias, or bias against men) represents the **Direct Effect**. It answers the question: *"If a woman and a man apply to the exact same department, does the department treat them differently?"* The answer is: generally no.

  **Why People Still Fight:**
  The controversy persists because "discrimination" is ill-defined in legal and policy contexts.
  *   **The University's Defense:** They relied on the stratified numbers. They argued, "We do not discriminate *in our hiring decisions*." (Direct Effect).
  *   **The Plaintiffs' Argument:** They relied on the pooled numbers. They argued, "The system discriminates against women *overall*." (Total Effect).

  Causal inference does not tell us which moral or legal definition is correct. However, it tells us which statistical operation matches which question. If you stratify on the mediator (Department), you are mathematically absolving the system of the bias that occurs *upstream* of the application (the societal forces guiding women to harder departments).

  If your goal is to assess the fairness of the *admissions officers*, stratify. If your goal is to assess the fairness of the *university system as experienced by applicants*, pool. The error was not in the math; it was in assuming the stratified number was the "true" measure of fairness without defining what fairness meant causally.

  ### Returning to the Lab Coat

  How does this change your view of those clinical trials you ran?

  In a randomized controlled trial (RCT), randomization severs the arrows pointing *into* Treatment ($Z \nrightarrow X$). This means baseline covariates cannot be confounders. In a perfect RCT, the pooled estimate is unbiased for the Total Effect.

  However, you likely stratified for two reasons:
  1.  **Precision:** To reduce variance (acceptable).
  2.  **Suspected Imbalance:** To "fix" randomization failures (risky).

  The real danger in your field lies in **post-baseline variables**. Suppose you stratify by "patient compliance" or "biomarker response at week 4."
  *   Treatment affects Compliance ($X \rightarrow Z$).
  *   Compliance affects Outcome ($Z \rightarrow Y$).
  *   Compliance is a **Mediator**.

  If you stratify by compliance, you are comparing "compliant men on drug" vs. "compliant men on placebo." But the drug *caused* the compliance (or the lack thereof). By conditioning on it, you introduce bias (often called "collider bias" if there are unmeasured common causes of compliance and outcome, or simply mediator bias). You might conclude the drug doesn't work because you've filtered out the people who got sick and stopped taking it.

  ### The Verdict

  The old rule said: *"Heterogeneity implies you must stratify."*
  The new rule says: *"Causality dictates whether you must stratify."*

  When you look at a dataset, do not just look at the correlation matrix. Draw the arrows. Ask: **Did this variable exist before the treatment was assigned?**
  *   **Yes:** It *could* be a confounder. If it affects both treatment assignment and outcome, **stratify**.
  *   **No:** It is a consequence of the treatment. It is a Mediator or a Collider. **Do not stratify** if you want the Total Effect.

  Simpson's Paradox bit you because the data was telling a causal story, and you were listening with statistical ears. The pooled numbers were not "lying"; they were reporting the total impact of the system. The stratified numbers were not "truth"; they were reporting the mechanism.

  In retirement, you have the luxury of asking the right question before running the model. In the Berkeley case, and in your old trials, the numbers never speak for themselves. They only answer the questions we force them to answer. Make sure the question matches the arrows.
