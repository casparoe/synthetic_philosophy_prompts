answer: |-
  The fire crackled in Peirce's Milford study, casting long shadows over the stacks of papers. He held James's new book loosely, affectionately, though his brow was furrowed.

  "Will, your generosity warms me," Peirce said. "But this conception of truth... you say the true is only the expedient in our way of thinking?"

  James leaned forward, eyes bright. "Expedient in the long run, Charlie. Not merely what comforts you now. It must agree with reality, but 'agreeing' means leading us through experience without contradiction."

  "But 'satisfactoriness' is psychological," Peirce insisted, tapping the page. "If a belief satisfies everyone today—say, that the earth is static—yet contradicts the actual state of things, your definition calls it true. I require truth to depend on the object, not the believer's comfort. You collapse the distinction between being true and being believed true. A universal consensus today could still be false tomorrow."

  "If it contradicts the actual state of things, it will eventually fail to satisfy," James countered. "But you speak of a 'final opinion' fated at the limit of inquiry. That limit is unreachable. What work does a ghost do? Isn't your final consensus just as much a human postulate as my satisfactoriness? You accuse me of psychology, but you posit an ideal community that exists only in hope."

  Peirce stroked his beard. "It is a regulative hope, yes. But it presupposes Reality exists independently. Here is my sticking point: I hold that Reality is what it is, regardless of what any man or generation thinks. If you make truth dependent on human verification, you swallow the external world into experience. There must be a Secondness, a brute resistance, that checks us. The stone kicks back whether you believe in it or not."

  James smiled sadly. "We cannot step outside our skin to check against a naked reality. We only know reality through its cash-value in experience. If your independent reality never shows up in experience, it is metaphysical idle wheelwork. I do not deny the resistance, Charlie, but truth is our *account* of it. And accounts evolve."

  "But does the truth-value evolve?" Peirce asked.

  "Exactly," James said. "Truth isn't static; it happens to an idea. It becomes true, is made true by events. Your view treats truth as a property inherent before verification. But what good is a truth that makes no difference to any living soul? The law of gravity was dormant before Newton framed it."

  "Because it is!" Peirce snapped, then softened. "Forgive me. But if truth is made, then before the verification, there is no truth. I cannot accept that propositions lack truth-values until humans ponder them. The law operated before Newton. Your view suggests it was neither true nor false, which violates the law of contradiction."

  "I suggest it was irrelevant until framed," James replied. "You fear I make truth too soft. I fear you make it too distant. You want a truth that looks at nothing human. I want a truth that lives for humans."

  They sat in silence. The disagreement was not over method, but metaphysics. The maxim was shared; the ontology was not.

  "So," James said quietly. "You are a Scholastic Realist. I am a Radical Empiricist."

  "It seems so," Peirce sighed. "We agree on the road, Will, but not the destination. You seek to satisfy life's demands. I seek to describe the universe's structure."

  "Then let us walk together as far as we can," James said.

  Peirce nodded. "Agreed. Though I shall keep calling it Pragmaticism."

  James laughed. "And I shall keep kidnapping it. But seriously, Charlie. Your final opinion... is it not just the ultimate satisfaction?"

  "No," Peirce said firmly. "It is the ultimate correspondence. Satisfaction is the sign, not the thing."

  "Then we differ on whether the sign can ever be separated from the thing," James concluded.

  Peirce closed the book. "Precisely. And there we must rest."
