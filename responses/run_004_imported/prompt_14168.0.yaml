      Peirce stroked his beard. "It is a regulative hope, yes. But it presupposes Reality exists independently. Here is my sticking point: I hold that Reality is what it is, regardless of what any man or generation thinks. If you make truth dependent on human verification, you swallow the external world into experience. There must be a Secondness, a brute resistance, that checks us."
      James smiled sadly. "We cannot step outside our skin to check against a naked reality. We only know reality through its cash-value in experience. If your independent reality never shows up in experience, it is metaphysical idle wheelwork. I do not deny the resistance, Charlie, but truth is our *account* of it."
