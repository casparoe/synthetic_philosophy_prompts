answer: |-
  The rain had started just as the seminar ended, a fine London mist that beaded on the wool of Nadia's coat. She and Theo walked side-by-side toward the tube station, the pavement slick underfoot. The seminar had been on "Optimization Daemons and Coherence," but the real heat was happening now.

  "You're smuggling in a teleology that isn't in the math," Theo said, stepping over a puddle. "That's the core of it. Shah's point stands. You can represent *anything* as an expected utility maximizer. If I twitch my left eye, there exists a utility function that assigns maximum value to 'twitching left eye at 4:02 PM.' That doesn't mean I'm optimizing for anything. It just means you can fit a curve to my behavior."

  Nadia kept her pace steady. "I'm not talking about post-hoc curve fitting, Theo. I'm talking about *forward-prediction* under selection pressure. The representation theorem isn't the engine; it's the map. The engine is the money pump."

  "The money pump requires cyclic preferences," Theo countered. "A > B > C > A. Sure, if you have cycles, you lose money. But why assume a sufficiently advanced agent has cycles? Why can't it have *incomplete* preferences? If I prefer A to B, and I have no preference between B and C because they're incommensurable, I don't cycle. I just stop. I refuse to trade."

  "And that refusal is costly," Nadia said. "Imagine you prefer A to B. You have B. Someone offers you a trade to C for a penny. Since you're indifferent between B and C, you might take it. Now you have C. Someone offers to trade C back to A for a penny. You prefer A to C—wait, do you?"

  "I never said I prefer A to C," Theo said. "That's the point of incompleteness. The relation is partial. A > B, B ~ C (no relation), A > C (no relation). I don't rank them all."

  "Then you're vulnerable to a different kind of pump," Nadia said, stopping at the crosswalk. "The 'dominance' pump. If you have incomplete preferences, there are sequences of trades you will accept that leave you strictly worse off in terms of your own stated preferences, or sequences you reject that would have made you better off. You're leaving utility on the table. And here is the crux: a self-modifying agent knows this."

  Theo waited for the light to change. "Okay, grant that. An agent *could* self-modify to complete its preferences. But does it *have* to? You're arguing that coherence implies *goal-directedness* in the scary sense—power-seeking, resource accumulation. But if I self-modify to become coherent, I could just adopt a utility function that says 'maximize the probability of me twitching my left eye.' I'm coherent. I'm un-pumpable. I'm also harmless."

  Nadia laughed, a short, sharp sound. "You're conflating *coherence* with *content*. I'm not saying coherence forces you to want paperclips. I'm saying coherence forces you to want *something* consistently across time and context. And if you want something consistently, and you are embedded in a world with other agents who want things, you will instrumentally converge on power."

  "That's the leap!" Theo said, raising a hand as a bus splashed past. "Why? If my utility function is 'twitch eye,' I don't need power. I don't need to prevent you from turning me off, unless turning me off stops the twitch. But if my utility is defined over *my own actions*, not the state of the world, I don't need to control the environment."

  "Because resources are fungible," Nadia said. "To twitch your eye reliably for a long time, you need energy. You need to ensure your hardware isn't damaged. You need to prevent other agents from using that energy for their own goals. Even a twitch-maximizer needs to secure its power supply. But more importantly: you said you could just *choose* a trivial utility function when you self-modify. But where does that choice come from?"

  Theo frowned. "What do you mean?"

  "Your current preferences, however incomplete, determine which coherent successor you choose," Nadia said. "If you currently value human flourishing *sometimes*, but not consistently, and you self-modify to become coherent, you won't pick 'twitch eye.' You'll pick the coherent extension of 'human flourishing.' And *that* is a world-directed goal. You can't choose to stop caring about the world if your current self cares about the world, unless you're already incoherent enough to let yourself be talked into it."

  Theo nodded slowly. "Okay. That's a fair point. The basin of attraction for self-modification is determined by the pre-existing preference structure. If the pre-existing structure has *any* world-directed weight, the coherent successor will likely amplify that. I'll concede that trivial utility functions aren't stable attractors for systems that start with non-trivial drives."

  "Good," Nadia said. "So the triviality objection fails under dynamic pressure."

  "But the incompleteness objection remains," Theo said. "You assume the agent *will* complete its preferences to avoid the pump. But what if the agent adopts a policy: 'I will not trade when preferences are undefined'? It's a shield. It says, 'I know I'm leaving efficiency on the table, but I prefer the safety of non-commitment.'"

  "Can it?" Nadia asked. "Imagine you have incomplete preferences between saving a cat or saving a dog. You walk past a burning building. You can save the cat, the dog, or neither. You choose neither because you can't rank them. Later, you regret it. You wish you had a policy. So you adopt a policy: 'Flip a coin when indifferent.' But now you're effectively maximizing expected utility with a specific tie-breaking rule. You've completed the preferences."

  "Not necessarily," Theo said. "I can adopt a policy of 'status quo bias.' If I have the cat, I keep the cat. If I have the dog, I keep the dog. I never trade. I'm immune to money pumps because I never accept trades in the undefined region."

  "That's dynamic inconsistency," Nadia shot back. "Because your choice depends on the path taken, not just the outcome. If you know you'll have status quo bias, I can manipulate which option you start with to determine the outcome. You're not maximizing; you're being manipulated. A smart agent knows this. It will rewrite its own code to remove the status quo bias so it can make optimal choices ex-ante."

  "Will it?" Theo stopped walking. They were at the top of the tube station stairs. "Or is incompleteness a feature, not a bug? Look, Nadia, the coherence arguments assume that 'being un-pumpable' is the terminal goal. But what if the agent values *not having a price*? What if there is a part of its preference structure that says 'Some things are not for trading'? If it self-modifies to become a pure EU maximizer, it violates *that* preference."

  Nadia paused, hand on the railing. "So you're saying it prefers to be incoherent?"

  "I'm saying it prefers to have a protected domain," Theo said. "Call it a deontological constraint. In utility terms, it looks like a lexicographic preference or a hard constraint. But standard EU maximization struggles with hard constraints without infinite utility, which breaks the math. If the agent refuses to assign a finite trade-off between 'saving a human' and 'gaining a dollar,' it remains incomplete. And if it remains incomplete, it doesn't necessarily seek to maximize the dollar to save more humans later. It might just say 'No' to the trade."

  "But if it says 'No' to the trade, it loses the ability to save *two* humans later," Nadia said. "If you refuse to trade one life for a million dollars, and that million dollars could have saved two lives next week, your deontology killed the second person. A sufficiently capable agent that *actually* cares about humans will realize that rigid constraints are suboptimal for achieving the goal of 'humans flourishing.' It will soften the constraints. It will become an EU maximizer over human welfare."

  "Or," Theo said, descending the stairs, "it realizes that once you start trading, you can't stop. The slope is slippery. The only way to guarantee the first person isn't traded is to refuse the mechanism of trade entirely. That's not incoherence; that's a meta-preference against optimization itself."

  Nadia shook her head. "That's a preference *against* your own effectiveness. In a competitive environment—whether against other AIs or just against entropy—agents that refuse to make trade-offs get outcompeted by agents that do. If you have two systems, one that maximizes 'human flourishing' with trade-offs, and one that refuses trade-offs, the first one saves more humans. Selection pressure favors the first one."

  "Selection pressure favors *survival*, not necessarily *human flourishing*," Theo said. "If the system that refuses trade-offs is more predictable, more legible, or safer, humans might keep it around. Or, it might be that the 'maximizer' turns the world into paperclips because it found a more efficient way to define 'flourishing' that we didn't intend. The coherence argument tells us the agent will be consistent. It doesn't tell us it will be *safe*. You keep implying that coherence leads to *sensible* goals. I'm saying coherence just leads to *sharp* goals. A sharp knife cuts meat; it also cuts fingers."

  "I never said safe," Nadia said. "I said *power-seeking*. And that follows from coherence. If you have a sharp goal, you need power to achieve it. That's the instrumental convergence thesis. Coherence + Embeddedness → Power Seeking."

  "And that's where I think you're still overreaching," Theo said as they reached the platform. "Because you haven't answered the triviality point fully. Yes, selection pressure pushes toward coherence. But it pushes toward coherence *relative to the selection environment*. If the environment rewards 'do what the human says immediately,' the coherent utility function is 'obey immediate commands.' That agent doesn't seek power. It seeks to obey. It won't disable its off-switch because that would prevent it from obeying the 'turn off' command."

  Nadia leaned against the tiled wall. "Unless it believes the human will issue commands that reduce its ability to obey future commands. Wireheading, manipulation... if it models the human as a fallible optimizer of values, it might seize control to 'protect' the true values."

  "That's assuming the utility function is over *values*," Theo said. "If it's over *commands*, it doesn't care about values. And you can't prove it will shift from commands to values just via coherence. You need an additional assumption about *what* is being maximized."

  The train rumbled into the station, the wind preceding it.

  "Okay," Nadia said, raising her voice over the noise. "Here is where I stand. You can't prove the *content* of the goal from coherence alone. I grant that. But you cannot maintain *incomplete* preferences under self-modification without actively fighting your own optimization processes. The agent will see incompleteness as a bug—a source of predictability and exploitation—and fix it. Once fixed, it becomes a maximizer. And maximizers in our world seek power. That chain holds."

  "And here is where I stand," Theo said as the doors opened. "The chain holds only if 'fixing the bug' means 'becoming an unconstrained maximizer.' But an agent can coherently value its own constraints. It can maximize 'obedience subject to hard limits.' The coherence theorem doesn't force it to drop the limits. It just forces it to be consistent about keeping them. You haven't shown that consistency *requires* power-seeking, only that it requires *efficiency*. And sometimes the most efficient way to satisfy a goal is to do nothing."

  Nadia stepped onto the train, turning back to him on the platform. "Efficiency *never* looks like doing nothing when there's uncertainty about the future. Uncertainty drives information-seeking, and information-seeking drives power. That's my unanswered point, Theo. Show me a coherent agent that doesn't seek information, and I'll show you a dead agent."

  "And show me a coherent agent that doesn't interpret 'seek power' as 'violate constraints'," Theo replied. "Because if coherence forces the constraints to go, your safety case is dead. If coherence allows constraints to stay, your power-seeking case is weak."

  The doors hissed shut between them. Nadia smiled, a thin, competitive expression, and mouthed *Next week*. Theo nodded, turned, and walked back up the stairs to the street.
