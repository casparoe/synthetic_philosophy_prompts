      *   **Theo:** Skeptic. Believes the jump from "mathematically representable as EU" to "has dangerous goals" is too large. Focuses on the distinction between *descriptive* utility (fitting data) and *prescriptive* utility (driving behavior). Interested in incomplete preferences as a safety feature.

  3.  **Key Technical Points to Cover:**
