      *   *The Triviality Objection:* You can always define $U(x) = 1$ if the agent chooses $x$. This satisfies axioms but implies no *optimization*.
      *   *Incomplete Preferences:* What if the agent says "I don't know" or "I refuse to choose" between A and B? Does this stop the pump?
