      *   **Topic:** The "Coherence Arguments" debate in AI alignment (Yudkowsky vs. Shah/critics).
      *   **Core Argument (Nadia):** Money pumps/Dutch books imply that robust agents must be Expected Utility (EU) maximizers. This leads to stable, world-directed goals (instrumental convergence, etc.).
      *   **Core Counter-Argument (Theo):** Representation theorems allow trivial utility functions (just describing behavior, not predicting goal-directedness). Incomplete preferences (refusing to rank options) might avoid pumps without collapsing into EU maximization.
      *   **Format:** Dialogue between two people (Nadia and Theo) walking to a train after a seminar.
