answer: |-
  One important note before you use this: In the actual fields of probability theory and philosophy, the Sleeping Beauty problem is **not** considered settled in the way the Monty Hall problem is. While many argue for the "thirder" position (1/3), the "halfer" position (1/2) is still defended by respected logicians and statisticians (it often hinges on whether one applies Self-Sampling Assumption vs. Self-Indication Assumption).

  However, for the sake of your story, if your character is *confident* it is settled, that says a lot about her personality. She is dogmatic, perhaps brilliant but impatient with ambiguity. The dialogue below reflects her certainty. If you want the narrative to remain neutral, you might have the friend remain slightly unconvinced at the very end, or have the narration hint that this is *her* view, not necessarily universal truth.

  Here is the scene draft.

  ***

  The waiter cleared the entrées, but Elena didn't look up. She had commandeered a white paper napkin and a black ballpoint pen.

  "Forget the coin for a second," Elena said, sketching a quick tree diagram. "You're stuck on the physics of the flip. A fair coin is fifty-fifty. We agree on that?"

  Mark nodded, leaning back in his chair, wine glass in hand. "Obviously. Physics doesn't care about Sleeping Beauty."

  "Right. But we aren't betting on the coin toss in a vacuum. We're betting on the *awakening*." She circled the end nodes of her diagram. "Here is the sample space. If it's Heads, she wakes Monday. If it's Tails, she wakes Monday *and* Tuesday. From her perspective, inside the room, she cannot distinguish between these three states: Heads-Monday, Tails-Monday, Tails-Tuesday."

  "Because of the amnesia drug," Mark said.

  "Exactly. Subjectively, they are identical. So, by the principle of indifference, she must assign equal credence to each awakening. There are three possible awakenings. In only one of them is the coin Heads." Elena tapped the pen on the napkin. *Tap. Tap. Tap.* "One out of three. It's not magic, Mark. It's counting."

  Mark frowned, swirling his wine. "But if I ask her on Sunday, before the flip, she says fifty percent. If I ask her Wednesday, after it's over, she says fifty percent. Why does the credence change just because she's asleep?"

  "Because the *protocol* changes the information structure. It's exactly like Monty Hall." Elena flipped the napkin over and drew three doors. "In Monty Hall, you think you have two doors left, so it's 50/50. But you don't. You have the original sample space where the host's action is constrained. Here, Beauty's awakening is constrained by the Tails outcome. Tails *produces* more data points."

  She leaned in, her eyes sharp. "Let's run it a thousand times. Five hundred Heads. She wakes up five hundred times. Five hundred Tails. She wakes up *one thousand* times. Total awakenings: fifteen hundred. How many of those awakenings occur in a Heads world? Five hundred."

  Elena slid the napkin across the table.

  "Five hundred divided by fifteen hundred. The math doesn't lie. Your intuition is telling you to bet on the *toss*. But the question asks you to bet on the *interview*. And in the long run, if you always bet 'Tails,' you'll be right twice as often as if you bet 'Heads.' A rational agent maximizes expected utility. A rational agent bets Tails."

  Mark looked at the scribbles, then at her. He opened his mouth, then closed it.

  "So," he said slowly. "Sticking with 'Halves' is like refusing to switch doors."

  "It's worse," Elena said, picking up her water glass. "It's refusing to acknowledge that you're part of the experiment. It's 1/3. It's settled."
