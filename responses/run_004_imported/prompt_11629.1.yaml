      *   *ZFC nuance:* Be careful not to say ZFC's ordinal is "unknown" in a trivial sense; it's that we don't have a canonical recursive notation for it that captures its strength fully. It's much larger than any computable ordinal we can explicitly name in a useful way.

  9.  **Final Review against User Prompt:**
