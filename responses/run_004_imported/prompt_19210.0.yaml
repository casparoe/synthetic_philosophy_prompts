          *   *Option B: Reject Rational Egoism.* Maybe pursuing *only* self-interest isn't actually "rational." (Kantian view? Or redefining self-interest).
          *   *Option C: Secular Humanism/Social Contract.* We make the alignment happen through society. Laws, reputation, empathy. We *create* the reward system because the universe won't.
          *   *Option D: Sidgwick's "Fundamental Dualism" as a Tragedy.* Accept that morality requires sacrifice without compensation. This is the "noble" atheist stance.

      *   **Conclusion:** Summarize. The friend is right that the *universe* doesn't guarantee it. But that doesn't make morality pointless; it makes it a human project. Sidgwick's failure forces us to be brave enough to be good without a payoff.

