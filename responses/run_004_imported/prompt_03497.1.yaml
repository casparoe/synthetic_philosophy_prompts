          *   *Desire:* Counter-intuitive but true. I promise to pay taxes. I don't *desire* it. But I'm obligated. So desire $\neq$ promise.
          *   *Willing the Action:* This is the trickiest metaphysical point. Hume's view of "Will": Will moves the body *now*. Future actions aren't directly willed. I can only will present preparations.
