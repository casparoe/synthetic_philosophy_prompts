answer: |-
  This is a fantastic passage to grapple with. It is one of the most famous and controversial arguments in the history of ethics. Hume is essentially trying to debunk the idea that promising is a "natural" moral power (like a kind of moral magic) and instead argue that it is a social invention (a convention).

  Because Hume writes in a dense, 18th-century style, it is easy to get lost in the negations. Let's break this down into the three parts you requested.

  ---

  ### 1. The Process of Elimination: Finding the "Act of the Mind"

  Hume starts with a specific assumption: For a promise to create a moral duty, there must be a specific mental event (an "act of the mind") that happens when you say "I promise." He wants to identify what that mental event is. He uses a process of elimination to show that the only logical option left is absurd.

  Here is the step-by-step reconstruction of his elimination process:

  **Step A: Is it a Resolution?**
  *   **The Idea:** When I promise, am I just resolving (making a firm plan) to do something?
  *   **Hume's Rejection:** No. A resolution is internal. I can resolve to wake up at 5:00 AM tomorrow. If I sleep until 6:00 AM, I have broken my resolution, but I have not necessarily committed a *moral wrong* against anyone.
  *   **The Distinction:** A promise creates an *obligation* to another person. A resolution creates only a personal intention. Since breaking a resolution lacks the moral "bite" of breaking a promise, the mental act of promising cannot be merely a resolution.

  **Step B: Is it a Desire?**
  *   **The Idea:** When I promise, am I expressing a desire to do the thing?
  *   **Hume's Rejection:** No. We often promise things we actively dislike. If I owe you money, I promise to pay you back. I may have zero desire to part with my cash; I might even have an "aversion" to it. Yet, I am still obligated.
  *   **The Distinction:** Obligation persists even when desire is absent. Therefore, the mental act cannot be desire.

  **Step C: Is it Willing the Action?**
  *   **The Idea:** Am I willing the future action to happen?
  *   **Hume's Rejection:** This is a metaphysical point. For Hume (and many empiricists), the "Will" is a faculty that moves the body in the *present*. I can will my hand to move *now*. I cannot directly will an action that will happen *next week*.
  *   **The Distinction:** A promise always regards the future. Since the Will only has influence over present actions, I cannot literally "will" a future performance. I can only will present preparations.

  **Step D: The Forced Conclusion**
  *   **The Logic:** If the mental act is not resolving, not desiring, and not willing the *action* itself, what is it?
  *   **Hume's Deduction:** It must be the **willing of the obligation itself.**
  *   **What this means:** When I say "I promise," I am not just saying "I will do X." I am saying, "I hereby create a new moral duty for myself, and I will that this duty exists." I am trying to conjure a moral bond into existence by an act of will.

  Hume notes that this sounds like common language ("I bind myself," "It is my will"). But he argues that while the *language* is common, the *idea* is philosophically incoherent. This leads him to the second paragraph.

  ---

  ### 2. The "Manifest Absurdity": The Argument from Sentiments

  In the second paragraph, Hume attacks the conclusion from Step D (that we can "will an obligation"). To understand why he thinks this is absurd, you have to understand Hume's meta-ethics.

  **Premise 1: Morality is based on Sentiments.**
  For Hume, moral good and evil are not facts out in the world (like gravity); they are feelings in us.
  *   **Virtue:** An action that gives us a specific feeling of approval/pleasure when we think about it.
  *   **Obligation:** An action whose neglect gives us a specific feeling of disapproval/pain (guilt, blame, shame).
  *   *Key Takeaway:* To have an "obligation" is to be subject to a specific sentiment of pain/displeasure if you fail to act.

  **Premise 2: We cannot change our Sentiments by Will.**
  Hume argues that our feelings are not under our direct voluntary control.
  *   **Analogy:** I cannot make myself hungry simply by willing it. I cannot make myself feel pain simply by deciding to. My sentiments are reactions to the world, not commands I issue to myself.
  *   **Textual Evidence:** Hume writes, *"'tis certain we can naturally no more change our own sentiments, than the motions of the heavens."*

  **The Absurdity:**
  If an obligation *is* a sentiment (Premise 1), and I cannot create a sentiment by a single act of will (Premise 2), then **I cannot create an obligation by a single act of will.**

  To say "I will to be obligated" is to say "I will to feel a specific pain/displeasure if I don't do X." Hume argues this is psychologically impossible. You cannot command your own emotional reactions into existence just by speaking words.

  **The Conclusion:**
  Therefore, the idea that a promise *naturally* creates a duty is "unintelligible." There is no natural mental act that corresponds to "creating a duty." If promises do bind us, it cannot be because of the natural properties of the words or the will. It must be because of something external (which Hume later identifies as social convention and the need for trust in society).

  ---

  ### 3. Assessment: Does the Argument Earn its Conclusion?

  This is where we step back and evaluate Hume. Does he prove that promises are unintelligible, or does he rig the game?

  **Where Hume is Strong:**
  Hume successfully destroys the idea of "Moral Magic."
  There is a common intuition that saying "I promise" changes the universe—that it adds a metaphysical glue to a future action. Hume rightly points out that words and thoughts alone don't change physical reality or basic psychology. If you think promising is a natural power (like having strong muscles), Hume shows that there is no "moral muscle" in the mind that can lift the weight of a future duty just by flexing. He forces us to admit that the power of a promise must come from *outside* the individual (from society, expectations, and consequences).

  **Where Hume is Vulnerable (The Contested Premises):**
  His argument relies heavily on two premises that a opponent could reasonably reject.

  **1. The Sentimentalist Premise:**
  Hume assumes morality *is* sentiment (emotion).
  *   **The Critique:** A Rationalist (like Kant, who came later) or a Natural Law theorist would say: "Obligation isn't a feeling of pain; it's a requirement of Reason."
  *   **Why it matters:** If obligation is rational, not emotional, Hume's argument fails. I *can* bind my rational will. I can decide, "Reason demands I keep my word," and that rational commitment doesn't rely on conjuring up a feeling of guilt. Hume begs the question by assuming morality is emotional before proving promises aren't natural.

  **2. The Definition of Will:**
  Hume assumes the Will can only affect *present* actions.
  *   **The Critique:** Many philosophers argue that human agency is inherently future-directed. To be an agent *is* to be able to commit to future plans.
  *   **Why it matters:** If the will *can* legitimately bind the future (a concept called "diachronic self-government"), then willing an obligation isn't absurd. It's just what free agents do. Hume treats the mind as a series of present moments, which makes future commitment look impossible. But if you view the self as a continuous entity, promising is just the self extending its authority over time.

  **3. The "Natural" vs. "Artificial" Distinction:**
  Hume concludes the promise is "naturally unintelligible."
  *   **The Nuance:** Hume isn't saying promises don't work. He is saying they are **artificial virtues** (like justice or money), not **natural virtues** (like benevolence or gratitude).
  *   **Assessment:** His argument proves that promises aren't *biological* or *instinctive*. But does "not natural" mean "unintelligible"? Not necessarily. Money isn't "natural" (gold has no intrinsic value), but it is perfectly intelligible within a economic system. Hume sometimes conflates "not found in a state of nature" with "incoherent."

  **Final Verdict:**
  Hume's argument earns its conclusion **only if** you accept his empirical, sentiment-based view of human psychology.
  *   **If you are a Humean:** The argument is devastating. It shows that you cannot pull moral duties out of thin air; they require a social context to make sense.
  *   **If you are a Rationalist:** The argument fails because it misidentifies what an obligation is. It attacks a straw man (obligation as a feeling) rather than the actual concept (obligation as a rational requirement).

  However, even if you reject his premises, Hume succeeds in shifting the burden of proof. He forces anyone who claims promises are naturally binding to explain *how* a mental act changes moral reality without relying on social consequences. He stops us from treating "I promise" as a magical spell and forces us to treat it as a social tool.

  ### Summary for your notes:
  1.  **Elimination:** Promise $\neq$ Resolution (no duty), $\neq$ Desire (can promise what we hate), $\neq$ Willing Action (action is future). Therefore, Promise = Willing the Obligation.
  2.  **Absurdity:** Obligation = Sentiment (pain/guilt). We cannot will sentiments (can't make ourselves feel pain by choice). Therefore, we cannot will obligations.
  3.  **Assessment:** Strong against "moral magic," but relies on the debatable claim that morality is *only* sentiment and that will cannot bind the future. It proves promises are social conventions, not necessarily that they are unintelligible.
