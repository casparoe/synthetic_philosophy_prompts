          *   The motive: Saving ethics from nihilism. He isn't looking for comfort; he's looking for a *premise*.
          *   *Character portrayal:* Show him wrestling with the cost of altruism. Why sacrifice now if there's no later?
      *   **2. Discipline Through Disappointment: The Method as Penance:**
