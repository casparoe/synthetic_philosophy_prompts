answer: |-
  This is a profound and historically grounded premise. You have correctly identified that Sidgwick's involvement with the Society for Psychical Research (SPR) was not a lapse in judgment, but a continuation of his ethical project by other means. For Sidgwick, the "Dualism of Practical Reason" was a philosophical crisis: if Rational Egoism (self-interest) and Rational Benevolence (duty) conflict, and there is no afterlife to reconcile them (by rewarding virtue), then morality is ultimately irrational.

  Kant solved this with a "postulate" of God and Immortality. Sidgwick, an empiricist, found this intellectually dishonest. He needed *data*.

  Here are the implications of the historical record for portraying your character's motives, discipline, and final arc.

  ### 1. Private Motives: The Salvation of Ethics, Not the Soul
  The most common mistake in portraying Sidgwick is to make him seem like a grieving seeker looking for comfort. He was not. He was looking for a **premise**.

  *   **The Implication:** His motive should be portrayed as a desperate attempt to save Utilitarianism from nihilism. If death is the end, the "Utilitarian sacrifice" is a sucker's game.
  *   **Portrayal:** Show him wrestling not with the fear of death, but with the fear of *meaninglessness*. In private moments, he should express anxiety that without empirical proof of survival, he cannot logically advise a young person to choose duty over self-interest when the two diverge sharply.
  *   **Scene Idea:** A debate with a younger, more dogmatic atheist colleague. The colleague argues that morality stands on its own. Your character internally recoils, knowing that without a "moral government of the universe," the logic of ethics collapses into a contradiction. He isn't hunting ghosts; he is hunting the missing axiom of his life's work.

  ### 2. Discipline Through Disappointment: Scientific Asceticism
  Sidgwick's approach to the SPR was defined by a painful rigor. He applied the same skepticism to phenomena he *hoped* were real as he did to phenomena he suspected were fake. This created a unique psychological tension: he had to fight his own desires.

  *   **The Implication:** The research process should feel like a penance. Every time he attended a séance or reviewed a transcript, he was risking the destruction of his only hope for ethical coherence.
  *   **The Trajectory of Disappointment:**
      *   **Early Phase (Physical Phenomena):** Table-turning and materialization. This should be portrayed as humiliating for a man of his intellect. He likely suspected fraud early on but felt duty-bound to investigate. Show the tedium and the sordidness of darkened rooms and trickery.
      *   **Middle Phase (The Census of Hallucinations):** A shift to statistics. This suits his utilitarian mind. It is less about "spirits" and more about data points. Show the exhaustion of collecting thousands of testimonies only to find them inconclusive.
      *   **Late Phase (Mrs. Piper):** Leonora Piper was the great hope. She produced accurate information she couldn't have known. But—and this is crucial for your character—even Piper did not prove *survival*. She only proved *telepathy* (communication from the living mind). The "survival hypothesis" remained distinct and unproven.
  *   **Portrayal:** Show him exposing a fraud committed by a friend or a fellow SPR member. This demonstrates that his commitment to Truth was higher than his commitment to Belief. He would rather have a painful truth than a comforting lie, even if the painful truth undermined his ethical system. This is the "discipline" you mentioned: the willingness to dismantle his own hope if the evidence demands it.

  ### 3. The Nature of the Failure: Ambiguity, Not Negation
  Historically, Sidgwick did not conclude that psychical research had *failed*; he concluded it was *inconclusive*. He famously stated that while he did not *know* survival was true, the evidence was strong enough to *justify belief*.

  *   **The Implication:** Your character should not die in despair, nor in triumphant faith. He should die in a state of **Rational Hope**. This is a subtle but vital distinction.
  *   **The Philosophical Shift:** Over decades, Sidgwick moved from requiring *proof* (which would compel assent) to accepting *evidence* (which permits faith). He realized that if the evidence is ambiguous, one is licensed to let "practical reason" (the need for morality to make sense) tip the scale.
  *   **Portrayal:** In his later years, show a softening. He is less the prosecutor and more the juror who finds the case "not proven, but plausible." He accepts that he may never have the empirical certainty he craved, but he chooses to act *as if* the moral government of the universe exists.

  ### 4. Closing the Arc: The Unresolved Dualism
  The arc should not close with the resolution of the Dualism. It should close with the character's acceptance of the burden of that Dualism.

  *   **The Historical Note:** Sidgwick's death was quiet. He left instructions that were characteristically precise. He did not have a deathbed conversion to Spiritualism.
  *   **The Literary Note:** Your character's arc should end on the concept of **Integrity**. He maintained his intellectual honesty even when it hurt him. He did not lie to himself to make the ethics work.
  *   **Suggested Final Image:**
      *   Avoid a séance or a ghostly manifestation.
      *   Instead, focus on his *Methods of Ethics* manuscript or a letter (perhaps to Arthur Balfour, with whom he corresponded deeply on this).
      *   He might write something akin to his actual sentiment: *"I cannot say that I know... but I say that I believe."*
      *   **The Emotional Beat:** He realizes that the "leap of faith" is not a surrender of reason, but the final, necessary act of reason when data runs out. He chooses Duty, not because he knows it will be rewarded, but because he *hopes* it will, and that hope is the only thing that makes the choice rational.

  ### Summary of Character Notes
  *   **Motivation:** Ethical necessity, not emotional comfort. He needs immortality to make Utilitarianism logical.
  *   **Conflict:** The war between his *hope* (that the phenomena are real) and his *method* (which requires him to debunk them).
  *   **Growth:** Moving from a demand for empirical proof to an acceptance of probabilistic faith.
  *   **Resolution:** He dies without certainty, but with a "warranted belief." He chooses to live and die as a moral agent in a universe that *might* be just, rather than a cynic in a universe that *definitely* isn't.

  This portrayal honors the historical Sidgwick: a man who found the Victorian crisis of faith so acute that he tried to solve it with the scientific method, and who had the courage to accept ambiguity when the method fell short.
