          *   The closing note of his arc.
      *   **Tone:** Historical, philosophical, nuanced, empathetic but rigorous.

  2.  **Deconstruct Sidgwick's Philosophical & Psychical Context:**
      *   *The Dualism of Practical Reason:* In *The Methods of Ethics*, Sidgwick concludes that Rational Egoism (pursuing one's own good) and Rational Benevolence/Utilitarianism (pursuing the general good) are both rational but often conflict. Reason cannot decide between them without a moral government of the universe (God + Immortality) ensuring virtue is rewarded.
      *   *The Kantian Problem:* Kant *postulated* God and Immortality as necessary for morality. Sidgwick, an empiricist, found this intellectually dishonest. He needed *proof*.
      *   *The SPR Journey:* Started with physical phenomena (table-turning, séances), moved to telepathy (Census of Hallucinations), ended with mediumship (Mrs. Piper).
      *   *The Outcome:* Ambiguous. He never found conclusive proof. He died still doubting, though perhaps leaning towards hope.
      *   *Key Quote:* "I do not say that I know... but I say that I believe." (Paraphrased sentiment). Actually, his letter to Balfour is crucial: "I cannot say that I know... but the evidence seems to me to be strong enough to justify belief."

  3.  **Address the Specific Prompts:**

      *   **Private Motives:** It shouldn't be about ghosts; it should be about *ethics*. If there is no afterlife/reward, why be moral when it conflicts with self-interest? His motive is the salvation of Morality itself, not just curiosity.
      *   **Discipline through Disappointment:** How does a rigorous logician handle fraud, trickery, and ambiguity? He must apply the same skepticism to his *hopes* as to his doubts. This creates internal tension. He isn't a gullible believer; he's a reluctant seeker.
      *   **Closing Note:** He shouldn't die triumphant (historically inaccurate) nor despairing (too melodatic). It should be a "melancholy hope" or a "rational faith." The tension remains unresolved intellectually but is managed emotionally/volitionally.

