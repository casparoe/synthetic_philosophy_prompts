answer: |-
  **Setting:** *Rows 14 and 15 of a mid-sized jet, cruising at 30,000 feet. The cabin is dimmed for a red-eye flight. JULIAN (50s, rumpled blazer despite the hour) sits in 14A. PRIYA (30s, sharp-eyed, notebook open on her tray table) is in 14B. In 14C, separated by an aisle, sits SARAH (40s), gripping her armrests.*

  **Julian:** You're taking notes on the turbulence?

  **Priya:** Not the turbulence. The reaction to it. Specifically, hers.

  *The plane dips suddenly. A collective gasp ripples through the cabin. Sarah's knuckles turn white. She closes her eyes, breathing sharply through her nose.*

  **Sarah:** (To her empty seatmate, whispering) It's fine. It's just thermal. It's fine.

  **Priya:** (Lowering her voice) There it is. Recalcitrance in the wild. She judges the situation to be safe—she literally just said "it's fine"—yet she is undeniably afraid. If emotion were just a judgment, Julian, her fear should have evaporated the moment she assessed the statistics.

  **Julian:** (Adjusting his seatbelt) You're conflating *considered* judgment with *evaluative* judgment. The Judgment Theory doesn't claim emotions track our PhD thesis on safety. It claims they track our appraisal of the situation. Right now, her appraisal is "danger."

  **Priya:** But she *says* she appraises it as safe.

  **Julian:** Consciously. Reflectively. But there's a deeper, more primitive layer of cognition at work. Think of it as a habitual judgment. Years of evolutionary conditioning, perhaps a past trauma, have trained her to issue a rapid-fire verdict: *Turbulence equals crash.* That verdict is a judgment, albeit a fast, automatic one. The fear persists because the automatic judgment hasn't caught up with the reflective belief.

  *The seatbelt sign dings on. The plane shudders harder. Sarah grips the armrest so hard her shoulders hike up.*

  **Sarah:** (Eyes still closed) I know the stats. I teach stats. This is normal. (A whimper escapes her throat) Oh god.

  **Priya:** "Normal," she says. "Oh god," she feels. Look at that disconnect. You call that automatic verdict a "judgment"? It's encapsulated. It's informationally isolated from her actual knowledge. She knows the plane is safe, but the "judgment" doesn't care. That sounds suspiciously like a perceptual module.

  **Julian:** Suspicion isn't an argument, Priya.

  **Priya:** It's the Müller-Lyer illusion. You know the lines are equal length. You measure them. You believe they are equal. But your visual system *presents* one as longer. You can't think your way out of the illusion because vision is a distinct system from belief. Sarah's fear is the same. Her emotional system presents the turbulence as *dangerous*, just as her visual system presents the line as *long*. She can believe otherwise, but the presentation persists.

  **Julian:** But that's where the analogy breaks down. When I see the Müller-Lyer illusion, I don't feel an urge to run. I don't get an adrenaline spike. Perception is passive; fear is motivating. If you reduce fear to a perception of "dangerousness," you lose the *oomph*. You lose the reason she's gripping that armrest.

  *The plane drops ten feet. Sarah's eyes snap open.*

  **Sarah:** (To Julian and Priya, apologetic) Sorry. I'm talking to myself. It helps. I know it's safe. I just… my body doesn't listen.

  **Julian:** (Nodding sympathetically) Your body is listening to a very loud assessment of risk, ma'am.

  **Sarah:** (Bitter laugh) Assessment. Right.

  *She closes her eyes again, muttering about variance and standard deviations.*

  **Priya:** (Turning back to Julian) "Assessment." You're smuggling my view in under a different name. If this "automatic judgment" is immune to her conscious beliefs, if it fires involuntarily, and if it has a distinct phenomenology… in what sense is it still a *judgment*? Usually, if I judge that $2+2=4$, I can't simultaneously judge that $2+2=5$. If I hold contradictory judgments, I'm irrational. But Sarah isn't irrational; she's modular. By stretching "judgment" to include these encapsulated, belief-independent states, you're just saying "perception" but refusing to use the word.

  **Julian:** I'm refusing the word because it's lazy. To say "she perceives danger" explains nothing. It's a placeholder. *How* does she perceive danger? Where is the organ of danger-perception? With judgment, I can point to the cognitive architecture. I can say she is weighing—however swiftly—her safety against the sensation of shaking.

  **Priya:** She isn't weighing anything! That's the point. Weighing implies access to reasons. She has the reasons—the stats, the engineering reports—but the emotion ignores them. That's the hallmark of perception. My eyes don't care if I know about optics; they just show me what they show me. If you call her fear a "judgment," you have to explain why it's so stubbornly stupid.

  **Julian:** It's not stupid. It's heuristic. It's a "better safe than sorry" rule of thumb. That is a cognitive strategy. It's a judgment that says, "The cost of being wrong about this shake is infinite, so I will treat it as catastrophic." That's a cost-benefit analysis, Priya. It's cognitive.

  **Priya:** A cost-benefit analysis she isn't aware of? That she can't stop even when she disagrees with the premises?

  **Julian:** We aren't aware of most of our cognition. Do you consciously parse syntax when you hear a sentence? No. But language is cognitive. Why can't emotion be the same?

  *The engine noise shifts pitch. A heavy thud resonates through the fuselage. Sarah gasps, her hand flying to her chest.*

  **Sarah:** Okay. Okay. Deep breaths. In through the nose. Out through the mouth. (She looks at Julian) You're philosophers, aren't you?

  **Julian:** (Startled) Is it that obvious?

  **Sarah:** You're talking about my panic like it's a puzzle. It's fine. It is a puzzle. To me, it's a betrayal. My mind knows the truth. My… whatever… lies to me.

  **Priya:** (Softly) That's exactly it. It feels like a lie because it feels like a report from the senses that contradicts the report from the intellect.

  **Sarah:** It feels like my skin is too tight. Like I need to get out. But I can't get out.

  **Julian:** And that urge to get out—that's the judgment in action. You've judged that escape is the priority.

  **Sarah:** I haven't judged anything. I just want to scream.

  *She turns away, focusing on the ventilation nozzle.*

  **Priya:** (Whispering) "I just want to scream." She distinguishes herself from the urge. That's the phenomenology of perception. I see a snake; I jump. Later I think, "I didn't mean to jump." The emotion happens *to* us. Judgments are things we *do*.

  **Julian:** That's a superficial distinction. I can be swept up in a line of reasoning I didn't intend to start. I can be convinced by an argument before I realize it. Cognition isn't always a deliberate, slow-motion act. Sometimes it's a flash.

  **Priya:** But if the flash is totally disconnected from your web of belief—if it ignores the stats, ignores the pilot's voice, ignores the lack of explosion—then calling it part of the "web of belief" is doing a lot of heavy lifting. You're positing a "judgment" that behaves exactly like a reflex. At that point, why cling to "judgment"? Is it just to preserve the idea that emotions are essentially rational?

  **Julian:** Because if they aren't rational, if they're just brute sensations like itches or tickles, how do we reason with them? How does your friend do CBT?

  **Priya:** CBT works on the beliefs *surrounding* the emotion, or it works on exposure. It doesn't necessarily prove the emotion *is* a belief. I can expose myself to a spider until my perceptual system learns "no danger," without ever changing my belief that spiders are dangerous.

  **Julian:** But the goal of CBT is to change the appraisal! To show the patient that the thought "I will die" is false.

  **Priya:** Or to teach the perceptual system to stop firing.

  *The turbulence begins to smooth out. The hum of the engine stabilizes. Sarah's grip on the armrest loosens, fraction by fraction.*

  **Julian:** Look at her. As the shaking stops, the fear recedes. Why? Because the input changed.

  **Priya:** Because the perceptual stimulus changed.

  **Julian:** Because her appraisal of the immediate environment shifted. No shake, no danger. That's an update to the judgment.

  **Priya:** Or the closing of a perceptual channel. Julian, be honest. If you define "judgment" broadly enough to include encapsulated, involuntary, belief-independent states that feel like physical assaults… have you actually saved the Judgment Theory? Or have you just expanded the definition of judgment until it's indistinguishable from perception?

  **Julian:** (Pauses, watching Sarah finally take a sip of water) I think… I think I'm trying to save the idea that emotions are *about* something. They have intentionality. They make a claim on the world. "This is dangerous." Perception does that too, I grant you. But perception doesn't necessarily demand action. Fear demands flight.

  **Priya:** And perception of a cliff demands stepping back. We perceive *affordances*. We perceive the world in terms of what it offers us or threatens us. That's what Prinz means by "embodied appraisal." It's a perception of a value property.

  **Julian:** But values aren't colors. You can't see "danger" the way you see "red." Danger is a relation between the world and my well-being. To grasp that relation is to make a claim.

  **Priya:** And to see depth is to grasp a relation between objects and my eyes. Yet we call it vision.

  *Sarah turns back to them. She looks exhausted.*

  **Sarah:** It's stopping.

  **Julian:** That's good news.

  **Sarah:** Yeah. (She looks at her hands) My hands are still shaking. I know I'm safe. I really do. But I feel… violated. Like my own nervous system mutinied.

  **Priya:** (To Julian) Mutinied. Not "reasoned incorrectly." Mutinied.

  **Julian:** (To Sarah) It feels like a mutiny because the part of you that was shouting "danger" wasn't listening to the captain. But it was trying to protect you.

  **Sarah:** I know. I'm grateful. I'm also angry at it.

  **Julian:** (Turning to Priya) She's angry at it. You can't be angry at a visual illusion. You can be frustrated, but not angry. You can hold a judgment responsible.

  **Priya:** You can hold a malfunctioning sense responsible. "My eyes betrayed me." It's the same structure.

  *The plane levels completely. The cabin lights brighten slightly.*

  **Julian:** I concede this: The automaticity is stronger than the early Judgment Theorists wanted to admit. We can't just tell people "don't judge that way."

  **Priya:** And I concede: The emotion isn't *just* a feeling. It's tied to her understanding of the world, however distorted. It's not a blind reflex; it's a representation of threat.

  **Julian:** So we agree it's a representation.

  **Priya:** We agree it's a representation. We disagree on whether representing threat is a species of *thinking* or a species of *seeing*.

  **Julian:** (Sighs) And as long as the plane is in the air, the question remains open.

  **Priya:** (Closes her notebook) As long as the plane is in the air.

  *Sarah leans her head against the window, watching the clouds. She is still breathing a little too fast, her eyes scanning the wing for any sign of movement, even as she whispers to herself that the wing is designed to flex.*

  **Sarah:** (Quietly) Designed to flex. Designed to flex.

  **Julian:** (Watching her) She's trying to update the judgment.

  **Priya:** (Watching her) She's trying to recalibrate the sensor.

  *They sit in silence for a moment, the hum of the jet filling the space between the theories.*

  **Julian:** Do you think she'll fly again?

  **Priya:** (Looks at Sarah's white knuckles, then at her calm face) Eventually. The sensor can be trained. Or the judgment can be softened.

  **Julian:** Same outcome. Different map.

  **Priya:** Different map. Same terrain.

  *The plane banks gently for the descent. Sarah flinches, then forces her hands to relax. Neither philosopher speaks.*
