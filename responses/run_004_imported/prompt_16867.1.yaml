prompt: |-
  so i just got off a two hour phone call with my friend mia (she's doing a philosophy phd, i just have a casual interest) and we got into it pretty hard about whether "intuitions" can even count as evidence in philosophy anymore. she brought up this whole line of experimental philosophy work from the early 2000s -- weinberg, nichols and stich, i think thats the paper -- where they gave gettier-style cases (the guy who ends up with a justified true belief that's only true by luck, and you're not sure if that still counts as "knowledge") to people from different cultural and class backgrounds, and apparently got pretty different patterns of answers, like east asian vs western participants, plus a split by socioeconomic status even within the same country. mia's whole point is that this wrecks the traditional "just consult your intuitions" method that analytic philosophy runs on -- if intuitions track culture and class instead of truth, why should anyone trust them as evidence for anything.

  i pushed back with what felt like the obvious move: trained philosophers presumably have better calibrated intuitions than random undergrads filling out a survey, so the method is fine as long as you restrict it to experts. but then she brought up follow-up work (schwitzgebel and cushman maybe? i might be butchering the names) showing professional philosophers are just as susceptible to order and framing effects in their judgments as regular people, and also mentioned that some of the original cross-cultural gettier results didn't even hold up cleanly when other people tried to redo them later. so now i genuinely dont know what to think and neither of us really "won" the argument. can you actually lay out how strong this cross-cultural-variation-undermines-intuitions type argument really is, what the best comebacks to it are (the expertise defense and anything else worth knowing about), and what the current, kind of messy state of the evidence actually implies for how much weight we should still put on intuitions in philosophy? i already got the textbook-summary version from mia so i'm hoping for something with a bit more depth to it than that.
