prompt: |-
  This came up in a reading group I'm part of that has spent the last few weeks working through the standard rationalist-blogosphere material on bet sizing: Thorp's old papers, the relevant stretch of Poundstone's Fortune's Formula, and a handful of LessWrong posts that fold the Kelly criterion into Scott Garrabrant's "geometric rationality" framework. Between all of that, I think I finally have a solid grip on why maximizing expected log-wealth is the right response to repeated favorable bets, rather than naively maximizing expected wealth itself. What's still tripping me up is the standard advice I keep running into, from poker forums to EA-adjacent posts about sizing prediction-market positions, to bet only a fraction of full Kelly — half-Kelly, say — rather than the full amount.

  As I understand Breiman's classic result on proportional betting, a full-Kelly bettor will, with probability one, eventually pull permanently ahead of anyone running a different fixed-fraction strategy, and will reach any sufficiently large wealth target faster, in expectation, than any other strategy could manage. If the theorem really delivers that, betting less than full Kelly looks like it can only be an ad hoc concession to risk aversion, tacked onto a criterion that was already supposed to be the objectively correct answer to the risk-aversion question — there shouldn't be any further growth-rate-relevant consideration left for fractional Kelly to be tracking. And yet Thorp himself, who was about as rigorous a Kelly bettor as has ever existed, spent much of his career recommending fractional Kelly in practice, and I gather this whole dispute traces back to Samuelson's objections to Kelly enthusiasts, which I've never seen spelled out clearly.

  So: given that Breiman's theorem already identifies the strategy that wins almost surely, why do so many people who clearly understand the math — Thorp very much included — treat fractional Kelly as the more defensible position rather than as a compromise for those who haven't fully internalized the proof? And does Garrabrant's "geometric rationality" reframing change anything substantive about this debate, or is it best read as restating, in more philosophical language, a question that Breiman's mathematics had already closed?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is in a reading group covering rationalist/rationality-adjacent material on bet sizing (Thorp, Poundstone, LessWrong, Garrabrant).
      *   **Current Understanding:** They grasp *why* Expected Log-Wealth (Kelly) is superior to Expected Wealth for repeated favorable bets.
      *   **The Puzzle:** They are confused about *Fractional Kelly*.
      *   **The Conflict:** Breiman's theorem says Full Kelly wins almost surely (asymptotically) against any other fixed-fraction strategy and reaches wealth targets fastest. So, why bet less? It seems like an ad hoc risk aversion concession on top of a criterion that *is* risk aversion.
      *   **Specific References:** Thorp (recommended fractional), Samuelson (objections to Kelly), Garrabrant (geometric rationality).
      *   **Core Questions:**
          1.  Why do experts (like Thorp) recommend Fractional Kelly if Full Kelly is asymptotically optimal?
          2.  Does Garrabrant's "geometric rationality" change the substantive debate, or is it just philosophical restatement?

  2.  **Initial Brainstorming & Fact-Checking:**

      *   *Breiman's Theorem:* Yes, it states that Kelly maximizes the asymptotic growth rate. Any other strategy will have a ratio of wealth (Other/Kelly) go to zero almost surely as $N \to \infty$.
      *   *The "Why Fractional?" Question:* This is the crux. The standard answers are:
          *   Estimation error (edge is uncertain).
          *   Utility function curvature (log wealth isn't *everyone's* utility).
          *   Drawdown risk (volatility drag in the short/medium term).
          *   Samuelson's critique (asymptopia is never reached).
      *   *Thorp's Stance:* Thorp did advocate fractional Kelly, primarily due to estimation error and risk of ruin in non-idealized settings.
      *   *Samuelson's Critique:* Samuelson argued that maximizing geometric mean doesn't maximize expected utility for *finite* horizons unless utility is literally log. He mocked the idea that "almost surely" matters if the "surely" takes a million years and you go broke in year 10.
      *   *Garrabrant/Geometric Rationality:* This frames probabilities and beliefs in terms of betting ratios and geometric means rather than arithmetic expectations. It justifies Log Wealth as the coherent way to aggregate beliefs/values across possibilities. Does it solve the fractional issue? It reinforces *why* Log is the baseline, but doesn't necessarily override the practical constraints (estimation error) that motivate fractional Kelly.

  3.  **Structuring the Response:**

      *   **Acknowledge and Validate:** The user has done their homework. The tension they feel is real and central to the literature.
      *   **Address Breiman vs. Reality (The Asymptotic Trap):** Explain *why* Breiman's result doesn't settle the practical case. Key concept: "Almost surely" $\neq$ "In your lifetime." The variance of log-wealth matters in finite time.
      *   **The Estimation Error Argument (The Strongest Practical Case):** Kelly assumes you know the probabilities ($p$) and payoffs ($b$) exactly. In reality, you don't. Overestimating edge leads to overbetting, which is catastrophic (volatility drain). Fractional Kelly is a hedge against model error.
      *   **Samuelson's Objection (The Finite Horizon):** Clarify Samuelson's point. It's not just risk aversion; it's that Expected Utility Theory (EUT) is the normative standard, and Kelly is only optimal if $U(x) = \ln(x)$. If you have finite horizons, the arithmetic mean matters more than the geometric mean for EUT unless $U=\ln$.
      *   **Thorp's Pragmatism:** Thorp wasn't just a theorist; he ran funds. He cared about drawdowns. Full Kelly has massive drawdowns (50%+). Fractional smooths the equity curve.
      *   **Garrabrant/Geometric Rationality:** Analyze this specific angle. It provides a *foundational* justification for Log Wealth (coherence of beliefs). It strengthens the *Full Kelly* theoretical case but doesn't negate the *estimation error* argument. It shifts the debate from "Is Log correct?" to "How confident are we in the inputs?"
      *   **Synthesis/Conclusion:** Fractional Kelly isn't a rejection of Kelly math; it's a Bayesian update on the *inputs* to the math.

  4.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the user's confusion. It's the classic "Theory vs. Practice" gap in growth investing.
      *   *Breiman's Limit:* Breiman proves asymptotic dominance. But convergence is slow. In finite time, Full Kelly has high variance. There's a non-negligible probability of significant drawdown before the asymptote kicks in.
      *   *The "Edge" Problem (Crucial):* Kelly is convex in edge. If you think you have 60% but really have 55%, Full Kelly bets too much. Overbetting Kelly reduces growth rate *more* than underbetting. This asymmetry makes fractional Kelly robust. *Self-Correction:* Make sure to explain the "Growth Rate vs. Fraction" curve (inverted parabola).
      *   *Samuelson's Critique:* Samuelson argued that no one lives forever. If your horizon is finite, maximizing $E[\ln(W_T)]$ is only optimal if your utility is actually $\ln(W)$. If your utility is different, Kelly is wrong. Also, the "almost surely" argument ignores the path.
      *   *Thorp's View:* Thorp viewed Kelly as a constraint, not a target. He used it to determine the *maximum* safe bet, then scaled back for comfort and error margins.
      *   *Garrabrant:* Geometric rationality justifies the *log* objective function as the only coherent way to handle multi-agent or multi-scenario consistency. It doesn't fix the "I don't know the true probability" problem. It actually might support fractional Kelly if you view probability estimates as distributions rather than point values.
      *   *Conclusion:* Fractional Kelly is the rational response to parameter uncertainty, not a rejection of growth optimality.

  5.  **Refining the Tone:**

      *   The user is sophisticated (reading Thorp, Poundstone, LessWrong). Avoid oversimplifying. Use terms like "volatility drag," "parameter uncertainty," "ergodicity."
      *   Ensure the distinction between *normative* (what you should do ideally) and *descriptive/pragmatic* (what works given uncertainty) is clear.
      *   Address the specific Garrabrant point carefully. Geometric rationality is about coherence of beliefs, which implies Log Wealth, but doesn't magically grant omniscience about probabilities.

  6.  **Final Review against User Questions:**

      *   *Why Fractional if Breiman says Full wins?* -> Estimation error + Finite horizon variance.
      *   *Is it just ad hoc risk aversion?* -> No, it's robustness to model error.
      *   *Samuelson's objection?* -> Clarify the finite horizon/utility function mismatch.
      *   *Garrabrant's impact?* -> Reinforces Log as the correct *objective*, but doesn't solve the *input uncertainty* problem.

  7.  **Polishing:** (Self-Correction during drafting)
      *   *Check:* Did I explain *why* overbetting is worse than underbetting? Yes, the growth rate curve drops off sharply past Full Kelly.
      *   *Check:* Did I address the "almost surely" claim? Yes, emphasize that "probability 1" allows for paths that take a very long time to converge, during which you might be wiped out or quit.
      *   *Check:* Garrabrant. Make sure not to overstate. It's a framework for *beliefs*, which informs the bet, but if beliefs are uncertain, the bet should be smaller.

