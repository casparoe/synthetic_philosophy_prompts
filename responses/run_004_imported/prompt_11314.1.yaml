answer: |-
  You have hit on the central tension in the literature of growth investing and decision theory. Your understanding of Breiman's theorem is correct: asymptotically, the Full Kelly strategy dominates any other fixed-fraction strategy with probability one. If you and I bet forever, and I bet Full Kelly while you bet Half Kelly, my wealth will eventually exceed yours by an arbitrary factor, almost surely.

  However, the recommendation for Fractional Kelly among those who understand the math (Thorp, MacLean, Ziemba, and the more pragmatically inclined rationalists) is not a rejection of Breiman's theorem, nor is it merely an ad hoc concession to "risk aversion" in the psychological sense. It is a robust response to **parameter uncertainty** and **finite horizons**.

  Here is the breakdown of why Full Kelly is theoretically optimal but practically fragile, how Samuelson's critique fits in, and where Geometric Rationality lands on the spectrum.

  ### 1. The Fragility of Full Kelly: Estimation Error
  The most substantive argument for Fractional Kelly is not about utility curvature, but about **epistemic uncertainty**.

  Breiman's theorem assumes the bettor knows the true probabilities ($p$) and payoffs ($b$) of the wager. In finance, poker, or prediction markets, you never know the true edge; you only have an estimate ($\hat{p}$).

  The relationship between bet size and expected growth rate is an inverted parabola.
  *   **Underbetting:** If you bet half-Kelly, your expected growth rate is reduced, but only by a factor of roughly 0.75 (you get 75% of the growth rate with 50% of the volatility). The curve is flat near the top.
  *   **Overbetting:** If you overestimate your edge and bet more than Full Kelly, the growth rate drops precipitously. If you bet double-Kelly, your expected growth rate drops to zero (you tread water). If you bet more than double-Kelly, your expected growth rate becomes negative (you go broke almost surely).

  Because the penalty for overbetting is catastrophic while the penalty for underbetting is linear and gentle, the rational response to *any* uncertainty about your edge is to bet less than the calculated optimum. Thorp recommended fractional Kelly precisely because he recognized that his edge estimates in the stock market or blackjack were distributions, not point values. Fractional Kelly is effectively a Bayesian hedge against the probability that you are overconfident.

  ### 2. Samuelson's Objection: "Asymptopia is Never Reached"
  Paul Samuelson's famous critique of the Kelly criterion (specifically the Latané and Markowitz interpretations) is often misunderstood as simply saying "people are risk-averse." His argument was more technical.

  Samuelson argued that maximizing the geometric mean (log wealth) is only normatively correct if your utility function is literally $U(W) = \ln(W)$. If you have a finite horizon $T$, maximizing $E[\ln(W_T)]$ does not necessarily maximize $E[U(W_T)]$ for any other utility function.

  His point regarding Breiman's "almost surely" result was that **convergence can be arbitrarily slow.**
  Breiman proves that $\lim_{T \to \infty} P(W_{Kelly} > W_{Other}) = 1$. However, for any finite $T$, there is a non-zero probability that the Full Kelly bettor is behind. More importantly, the *variance* of log-wealth under Full Kelly is high.
  *   Full Kelly implies a 50% drawdown happens with significant probability over a finite sequence.
  *   If you are levered, or if you have margin calls, or if you simply have a utility function that penalizes drawdowns more than log-wealth implies (e.g., you need to withdraw money to live), the "long run" might not arrive before you are forced out of the game.

  Samuelson's objection reminds us that "almost surely" is an asymptotic property. In the short to medium run (a human lifetime), the distribution of outcomes matters, not just the mode of the asymptotic distribution. Fractional Kelly shrinks the variance of the path, increasing the probability of being ahead at any finite time $T$, even if it lowers the asymptotic ceiling.

  ### 3. Thorp's Pragmatism
  You noted that Thorp recommended fractional Kelly. It is crucial to distinguish Thorp's theoretical work from his practical management.
  *   **Theoretically:** Thorp proved the efficacy of log-optimal portfolios.
  *   **Practically:** In his Princeton/Newport Partners fund, Thorp often bet significantly less than Full Kelly.

  Thorp viewed Kelly not as a target, but as a **constraint**. It tells you the maximum amount you can bet without risking ruin from volatility drag. Once you know the maximum, you scale back to accommodate:
  1.  **Correlation risk:** Real-world bets aren't independent.
  2.  **Liquidity risk:** You might need cash before the asymptote hits.
  3.  **Model risk:** As mentioned above, your edge might be wrong.

  Thorp's stance validates the view that Fractional Kelly is not a compromise on the *math*, but a compromise on the *inputs* to the math.

  ### 4. Does Geometric Rationality Change Anything?
  Scott Garrabrant's "Geometric Rationality" framework (and the associated work on logical induction and market making) provides a foundational justification for *why* we should maximize expected log-wealth in the first place.

  Standard rationality (arithmetic expectation) can lead to Dutch books if you are making repeated decisions or if you view your future selves as different agents. Geometric rationality argues that if you want your beliefs and decisions to be coherent across different "worlds" or "times" without being exploitable, you must optimize the geometric mean.

  **Does this settle the Fractional vs. Full debate?**
  No, but it reframes it.
  *   **Geometric Rationality says:** "Yes, Log Wealth is the correct objective function." It shuts the door on Expected Value maximization for repeated bets.
  *   **It does not say:** "You know the probabilities perfectly."

  In fact, Geometric Rationality might strengthen the case for Fractional Kelly. If you treat your probability estimates not as single numbers but as credence distributions (which a sophisticated geometric rationalist should), the "correct" bet size is the expectation of the Kelly bet over that distribution. Since the Kelly function is concave with respect to probability estimates (due to the overbetting cliff described above), **Jensen's Inequality** applies.

  $$E[Kelly(p)] < Kelly(E[p])$$

  If you are uncertain about $p$, the coherent geometric bet is *smaller* than the Kelly bet calculated at the mean estimate of $p$. Therefore, a rigorous application of Geometric Rationality, acknowledging uncertainty in beliefs, naturally converges on Fractional Kelly.

  ### Summary
  The advice to bet Fractional Kelly is not a rejection of Breiman's theorem, nor is it merely "risk aversion" tacked onto a risk-neutral framework.

  1.  **Breiman is right about the limit, but wrong about the path.** In finite time, Full Kelly has unacceptably high volatility and drawdown risk for most agents.
  2.  **Parameter uncertainty is the killer.** Because overbetting is far more dangerous than underbetting, uncertainty about your edge mathematically necessitates betting less than the point-estimate Kelly.
  3.  **Samuelson was right about finite horizons.** "Almost surely" is not "always," and ruin can happen before convergence.
  4.  **Geometric Rationality reinforces the objective, not the input.** It confirms Log Wealth is the correct goal, but implies that uncertainty in beliefs (probabilities) should reduce the bet size via Jensen's Inequality.

  Thorp and the sophisticated practitioners treat Full Kelly as the **theoretical speed limit**, and Fractional Kelly as the **safe driving speed** given foggy conditions (uncertain edges) and traffic (correlated risks). They aren't disagreeing with the physics of the car; they are acknowledging the conditions of the road.
