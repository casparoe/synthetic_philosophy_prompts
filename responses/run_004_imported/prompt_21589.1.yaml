answer: |-
  Here are seven questions designed to move past the introductory "Sen 101" material and engage with the hard normative and practical tensions in the Capability Approach (CA). I've incorporated your specific requirements and included a question that bridges your debate with your flatmate to ground the conversation.

  ### 1. The "Open List" and Public Reasoning
  Sen famously refuses to endorse a fixed, canonical list of capabilities (unlike Nussbaum), arguing instead that they should be selected through democratic public reasoning. Critics argue this looks less like a principled commitment to democracy and more like a way to dodge the hard normative work of defining the good. Is the open list a theoretical feature that protects pluralism, or is it a bug that leaves the approach toothless when public reasoning fails or turns oppressive?

  *   **Follow-up:** If you say public reasoning settles it: Suppose a local democratic process concludes that "religious participation" is less valuable than "economic productivity" and cuts funding for places of worship. Does the Capability Approach have the resources to overrule that democratic decision, or does the commitment to public reasoning force you to accept a locally validated reduction in capability?

  ### 2. Adapted Preferences vs. Paternalism
  One of the CA's strongest selling points is its ability to identify "adapted preferences"—like the contented slave or the deprived housewife—who report high satisfaction despite low freedom. But to distinguish a "deprived" preference from a genuinely "different" valuation of life, you seem to need an external standard of what a flourishing life looks like. How do you identify adaptive preferences without quietly importing a perfectionist welfare standard that contradicts your commitment to individual agency?

  *   **Follow-up:** If you say we look at the *conditions* under which the preference was formed: Isn't that just a procedural check that collapses back into a resource-based metric? If I say, "I prefer not to work because I value leisure," and you say, "No, you were socially conditioned to believe women shouldn't work," on what non-paternalistic ground do you make that distinction?

  ### 3. Aggregation and Incommensurability
  The Capability Approach rejects primary goods and income as metrics because they ignore human diversity. But policy requires trade-offs. If I have a budget to improve either "mobility" for the disabled or "social affiliation" for the isolated, how does the CA aggregate across these non-comparable capabilities without collapsing back into a single index? If you introduce weights to make them comparable, haven't you just recreated the single metric you sought to escape?

  *   **Follow-up:** If you argue for "partial orderings" (where we don't need to compare everything): Partial orderings work for theory, but budgets demand total orderings. If the approach cannot generate a decision rule for hard trade-offs, isn't it functionally useless for the actual ministers of finance who have to sign the checks?

  ### 4. The Disability Critique (Connecting to your debate)
  I recently debated a friend who argued that Dworkin's resourcism fails because it can't account for the conversion costs of disability—money isn't enough if you can't use it. Dworkin replies with his hypothetical insurance market to monetize those needs. How does the Capability Approach handle the "expensive needs" of severe disability differently? Does focusing on functionings imply we must pour unlimited resources into raising the capability of the severely disabled to a threshold, potentially at the expense of other capabilities?

  *   **Follow-up:** If you say it's about a "threshold" rather than maximization: Who sets that threshold? If a wheelchair user needs $50k of support to achieve the same mobility as an able-bodied person, but the budget only allows $30k, does the CA demand we cut education funding to cover the gap, or does it admit that some capability gaps are tragically permissible?

  ### 5. Functionings vs. Capabilities (The Fasting Monk)
  Sen draws a sharp distinction between *functionings* (what you do) and *capabilities* (what you can do). The classic example is the fasting monk vs. the starving beggar: same functioning (hunger), different capability (choice). But in terms of social policy, we usually fund outcomes (nutrition programs), not just options. In practice, doesn't the distinction vanish? If the government ensures you *can* eat, but you choose not to, has the policy failed or succeeded?

  *   **Follow-up:** If you say the policy succeeded because freedom was respected: Then why is the Capability Approach often used to justify paternalistic interventions (like mandatory schooling) which increase future capability by restricting current choice? Where is the line between "building capability" and "forcing functioning"?

  ### 6. Co-optation by Institutions
  The Capability Approach has been adopted by the UN and the World Bank for development metrics. However, these institutions often operationalize capabilities as just another set of indicators to be maximized alongside GDP. Are you concerned that the radical normative core of the approach—the shift from means to ends—is being hollowed out into a technocratic checklist that ignores the structural power dynamics Sen originally cared about?

  *   **Follow-up:** If you say engagement is better than purity: Doesn't using the language of "capability" to justify standard neoliberal reforms (like microfinance) risk legitimizing policies that actually reduce collective agency in favor of individual responsibility?

  ### 7. Is it a Theory of Equality or Development?
  Finally, there's an ambiguity in the literature. Is the Capability Approach a theory of *distributive equality* (answering "equality of what?") or a theory of *human development* (answering "how do we grow?")? If it's the former, it needs a strict metric of advantage to compare persons. If it's the latter, it might allow inequalities that boost overall capability. Which is the primary goal, and does that distinction matter for how we judge domestic justice versus global aid?

  *   **Follow-up:** If you say it's primarily about freedom rather than equality: Doesn't that allow for a society where everyone has high absolute capabilities, but massive relative inequalities that undermine democratic equality? Is a "high capability" oligarchy acceptable on your view?
