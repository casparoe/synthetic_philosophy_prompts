      *   *Materialist:* Let's use an indexical analogy. "I" refers to whoever is speaking. It's rigid. But "I am tired" is contingent. Phenomenal concepts are like direct indexicals to brain states. "This experience." The necessity you feel is an illusion of the direct reference. You're confusing the *vehicle* of thought with the *content*.
      *   *Dualist:* Indexicals don't work that well here. "I" picks out a person. "This experience" picks out a quale. If "This experience" = "Physical State P," then "Physical State P could exist without this experience" should be as absurd as "I could exist without myself." But the Zombie argument says P could exist without the experience. If your indexical account is right, the Zombie is inconceivable. But it *is* conceivable. So your indexical account fails to close the gap. You're left saying "It just seems necessary," which is question-begging against the intuition that drives the argument.

