  2.  **Deconstruct the Philosophical Positions:**
      *   **Type-B Materialist:** Physicalism is true. There is an explanatory gap, but it's epistemic, not ontological. Zombies are *conceivable* (in some sense) but *metaphysically impossible*. The link between physical states and phenomenal states is a posteriori necessary (like Water = H2O).
      *   **Chalmers-style Dualist:** If zombies are conceivable, they are possible (via the Principle of Conceivability). The Water/H2O analogy fails because phenomenal concepts are "rigid" in a way that natural kind concepts aren't. There is no "appearance vs. reality" gap for qualia. Therefore, physicalism is false.
      *   **The Crux:** Does the "Phenomenal Concept Strategy" (PCS) successfully explain why consciousness *seems* to resist the Water/H2O reduction without positing ontological dualism? Specifically, can PCS explain the *unique* epistemic situation of consciousness without conceding the dualist's point about primary intensions?

  3.  **Drafting - Round 1: The Opening Salvo**
      *   *Materialist:* Start with the Kripkean move. Water = H2O is necessary a posteriori. We can imagine water not being H2O, but that's just imagining something *like* water. Same with pain = C-fiber firing. Zombies are conceivable but impossible.
      *   *Dualist:* Hit the 2D semantics. Water has a reference fixer ("watery stuff") and the referent (H2O). Pain doesn't. When I think "pain," I'm not thinking "whatever causes pain behavior." I'm thinking *this*. The primary and secondary intensions coincide. So if I can conceive of pain without C-fibers, it's genuinely possible.

  4.  **Drafting - Round 2: The Materialist Counter (Phenomenal Concept Strategy)**
      *   *Materialist:* You claim phenomenal concepts don't split. I disagree. They are *recognitional* concepts. They pick out the state directly, via acquaintance. This creates a unique *mode of presentation*. The gap isn't in the world (ontology), it's in the concepts (epistemology). We have a physical concept (C-fibers) and a phenomenal concept (Pain). They refer to the same thing but present it differently. This explains the "feel" of contingency without actual contingency.
      *   *Dualist:* That just pushes the problem back. If the concepts refer to the same property, why is the phenomenal concept so special? Why does it seem to reveal the *essence* of the experience while the physical concept doesn't? If physicalism is true, the phenomenal concept should be analyzable in physical terms, or at least contingently linked. But it feels necessary. You're positing a "brute" conceptual connection that looks suspiciously like a dualist property.

  5.  **Drafting - Round 3: Deepening the Clash (The "No-Fool's-Pain" Argument)**
      *   *Materialist:* It's not brute. It's psychological. We possess phenomenal concepts by *instantiating* the state. To have the concept of pain, you must feel pain. This is the "constitutive" view. It explains why the primary/secondary intension distinction collapses *for the subject* without implying dualism. It's a feature of our cognitive architecture, not the fabric of reality.
      *   *Dualist:* But if the concept is constituted by the state, and the state is physical, then the concept is physical. But then we should be able to explain the concept physically. We can't. Furthermore, consider the "No-Fool's-Pain" argument. If I think I'm in pain, I am in pain. There is no appearance/reality distinction. If pain = C-fibers, there *should* be an appearance/reality distinction (I could think I have C-fibers firing but not, or vice versa). The fact that there is no gap *in the phenomenology* implies there is no gap *in the ontology*. Your "conceptual" gap is doing ontological work.

