answer: |-
  The smell of the workshop was still the same: cedar shavings, old oil, and the sharp tang of glue. Arthur stood at the workbench, his hands hovering over a disassembled clock. He wasn't moving. He was staring at the pegboard behind the vice, where every screwdriver was outlined in black marker, each handle labeled with a strip of masking tape.

  "He's stuck," Sam whispered from the doorway. "He's been staring at that Phillips head for ten minutes."

  Leo didn't move from the stool where she was sorting receipts. "He's retrieving. Let him retrieve."

  "Retrieving?" Sam stepped into the room, his voice tight. "He's lost, Leo. The man doesn't know what a Phillips head is anymore. He's reading the tape. That's not cognition. That's reading."

  Leo looked up. "Clark and Chalmers would say it counts. If it's reliable, accessible, and trusted, it's part of the cognitive system. The tape isn't a crutch, Sam. It's a neuron."

  Sam laughed, a short, brittle sound. He walked over to the workbench and gently moved a chisel out of Arthur's way. "That's the coupling-constitution fallacy, Leo. Don't give me the philosophy 101 speech. Just because two things are coupled doesn't mean they constitute the same thing."

  Arthur didn't flinch at their voices. He reached out, touched the tape labeled '#2', and picked up the screwdriver. He turned back to the clock.

  "Explain it to me like I'm not trying to sell this house," Leo said.

  "Okay," Sam said, leaning against the bench. "Imagine a hurricane. It's coupled with the barometer. The pressure drops, the needle moves. They are intimately linked. But the barometer isn't *part* of the hurricane. If I smash the barometer, the storm keeps raging. Just because Dad relies on the tape doesn't mean the tape is his mind. It's input. Memory is internal processing. This is just... lookup."

  "But where does the processing stop?" Leo stood up, walking to the pegboard. "When you do math in your head, you use working memory. When Dad checks the tape, he uses visual memory. The function is identical. He trusts the tape more than his head. He goes to it automatically. It's transparent to him. When you look through glasses, you don't see the lenses, you see the world. When Dad looks at that board, he doesn't see 'notes,' he sees 'tools'."

  "That's a metaphor, not mechanics," Sam countered. "The glasses correct the light entering the eye. The tape replaces the data entirely. There's a difference between aiding a process and outsourcing it. If I use a calculator, I'm not doing math. I'm pressing buttons. Dad isn't remembering the screwdriver. The workshop is remembering it for him."

  Arthur made a small noise. A hum of satisfaction. He had tightened the screw. He reached for the next one, then paused. His hand drifted. He looked at Leo, then Sam. The clarity from moments before was gone, washed out by a sudden fog.

  "Which way?" Arthur asked softly. "Lefty-loosey?"

  Sam opened his mouth, ready to answer, ready to prove that the knowledge resided in *them*, not the room.

  Leo stopped him with a glance. She pointed to the small leather journal lying open on the bench. It was filled with Arthur's shaky handwriting. *Standard threads: right to tighten. Left to loosen.*

  Arthur looked at the book. He traced the words with a calloused finger. His lips moved silently. Then, he turned the screw counter-clockwise. It loosened. He smiled, a genuine, bright spark in the haze. "Right. Loosey."

  "He solved the problem," Leo said quietly.

  "He read the solution," Sam corrected, though his voice lacked its earlier edge. "The mind is in the head, Leo. If we take him to the facility, he won't have the workshop. He won't have the tape. He'll be lost. That proves the memory wasn't his. It belonged to the room."

  "And if we keep him here," Leo said, running a hand over the pegboard, "the room is him. You want to sell the house because you think Dad isn't here anymore. But I think you're defining 'here' too narrowly. You're drawing a circle around his skull and saying everything outside is dead matter. But what if the circle is bigger?"

  Sam looked at his father, who was now carefully placing the screwdriver back into its outline, aligning the handle with the black marker.

  "If the circle is bigger," Sam said, "then when we turn off the lights, we're killing part of his brain. That's not empowerment, Leo. That's fragility. A brain heals. A workshop gets sold."

  Arthur looked up from the bench. He looked at the journal, then at his children. For a second, the connection held—the man, the book, the room, the siblings all linked in a single circuit of care and function. Then the moment passed. Arthur looked down at his hands, confused by the tool he was holding.

  "Which way?" he asked again.

  Leo opened her mouth. Sam looked at the journal. Neither moved immediately. The question hung in the sawdust air, waiting to see where the answer actually lived.
