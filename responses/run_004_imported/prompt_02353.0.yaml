answer: |-
  This is an exceptionally sharp reading of the text. You have identified exactly the tension that has puzzled commentators on Leibniz for centuries. Your friend's intuition that this looks like epiphenomenalism is a standard objection to Leibniz, and your connection to the modern Causal Exclusion Argument is philosophically sophisticated.

  To answer your question directly: **Leibniz is not an epiphenomenalist in the modern sense, but he does accept a version of the "causal closure" premise that makes the exclusion argument seem threatening.** However, he escapes the modern dilemma (Reduction vs. Epiphenomenalism) because he rejects the underlying metaphysics of modern physicalism.

  Here is a breakdown of what Sections 78–81 commit Leibniz to, how he understands mental causation, and why the comparison to the exclusion argument both holds and fails.

  ### 1. Decoding Section 81: The "As If"
  Your confusion about Section 81 is well-founded. It sounds contradictory: *How can they act as if they influence each other if they act as if the other doesn't exist?*

  Leibniz is distinguishing between **ontological causation** (what actually makes things happen) and **explanatory frameworks** (how we make sense of things).

  *   **"Bodies act as if there were no souls":** In the realm of physics (efficient causes), you can explain the motion of your hand entirely through nerves, muscles, and physics. You do not need to mention "will" or "desire" to calculate the trajectory of the hand. The physical chain is complete.
  *   **"Souls act as if there were no bodies":** In the realm of psychology (final causes), you can explain your action entirely through desires, beliefs, and goals. You do not need to mention neurons to explain *why* you wanted to raise your hand.
  *   **"Both act as if the one were influencing the other":** Because of the Pre-established Harmony, the physical explanation and the mental explanation will always match up perfectly. When the "mental story" says "I willed it," the "physical story" says "The nerves fired."

  Leibniz uses the analogy of **two perfect clocks**.
  *   Clock A (Soul) keeps perfect time on its own internal mechanism.
  *   Clock B (Body) keeps perfect time on its own internal mechanism.
  *   They always show the same time.
  *   They do not influence each other (no wires connecting them).
  *   Yet, they act *as if* they influence each other (when one strikes the hour, the other points to 12).

  ### 2. Is Leibniz an Epiphenomenalist?
  Your friend argues that if the body was going to move anyway due to physical laws, the soul's decision contributes nothing. This is the definition of epiphenomenalism: the mind is a smokestack on a train; the smoke comes out when the train moves, but the smoke doesn't pull the train.

  Leibniz would reject this label for two crucial reasons:

  **A. Spontaneity of the Substance**
  For modern epiphenomenalists, the mind is usually a byproduct of the brain. For Leibniz, the **Monad (soul) is the fundamental reality.** Matter is actually a derivative phenomenon (a "well-founded phenomenon," as he calls it elsewhere).
  Leibniz argues that every substance is **spontaneous**. The soul is not passive; it generates its own states (perceptions and appetitions) from its own internal nature. It is not caused by the body. So, the mind is not a "byproduct" of the physical; rather, the physical is a synchronized expression of the mental.

  **B. Two Types of Causation**
  Leibniz believes there are two distinct types of causation, both real:
  1.  **Efficient Cause:** The push/pull of physics (Body).
  2.  **Final Cause:** The purpose/goal of agency (Soul).

  When you raise your hand, the *efficient cause* is the muscle contraction. The *final cause* is your desire to ask a question. Leibniz argues that **both are true explanations.** To say the soul contributes "nothing" is to assume that only *efficient* (physical) causation counts as "real" causation. Leibniz denies this. The soul's decision is the *reason* for the action, even if it isn't the *physical push*.

  So, while your decision doesn't *physically shove* your atoms (violating conservation of force), it is not causally inert. It is the **teleological ground** of the action.

  ### 3. The Causal Exclusion Argument Comparison
  You asked if Leibniz's view is an early cousin of the Causal Exclusion Argument. The answer is **yes, structurally, but no, metaphysically.**

  **Where the comparison holds:**
  Leibniz explicitly agrees with the premise of **Causal Closure of the Physical.** In Section 79 and 80, he insists that in the realm of bodies, "there is always the same quantity of force in matter." He agrees that you cannot find a physical effect without a sufficient physical cause. If you look strictly at physics, the soul is excluded from the chain of efficient causes.

  **Where the comparison fails (Leibniz's Escape Hatch):**
  The modern Causal Exclusion Argument creates a dilemma (Reduction or Epiphenomenalism) because it assumes **Physicalism**: the idea that the physical world is the *fundamental* ontology, and the mind must fit into it.

  Leibniz escapes this because he is an **Idealist**.
  *   **Modern View:** Physics is the base reality. Mind is the problem to be solved.
  *   **Leibniz's View:** Minds (Monads) are the base reality. Physics is the description of how they harmonize.

  Because Leibniz thinks the mental is more fundamental than the physical, he doesn't worry that the mental is "excluded" from the physical. He views the physical realm as a kind of map of the mental realm.
  *   **Modern Exclusion:** "If physics explains it all, what is the mind for?"
  *   **Leibniz:** "Physics explains *how* it happens; Mind explains *why* it happens. Both are required for a complete understanding of the universe."

  ### 4. Summary: What Sections 78–81 Commit Him To
  To pin down exactly what these sections commit Leibniz to regarding your hand-raising example:

  1.  **No Transitive Causation:** Your soul does not send a signal to your hand. Your hand does not send pain signals to your soul.
  2.  **Parallel Explanations:** There is a complete physical story for your hand raising (nerves, biology). There is a complete mental story for your hand raising (volition, intent).
  3.  **No Overdetermination:** The hand is not raised *twice* (once by mind, once by body). It is raised *once*, but it can be described in two languages.
  4.  **Reality of the Mental:** The mental story is not an illusion. Your will is real and active. It is not epiphenomenal because it is the internal source of your own states, which God synchronized with the body.

  ### Conclusion
  Your friend is right that Leibniz denies **interactionist dualism** (the idea that the mind pushes the body). If "causal power" means "the ability to violate physical conservation laws to push matter," then yes, Leibniz says the mind lacks that power.

  However, Leibniz would say your friend is using too narrow a definition of "cause." By insisting that **Final Causes** (purposes) are just as real as **Efficient Causes** (mechanisms), Leibniz avoids making the mind a powerless byproduct. He avoids the modern Exclusion Argument not by finding a gap in physics, but by denying that physics is the only measure of reality.

  In short: Leibniz saves the mind from being powerless by making the body less fundamental than the mind. Voltaire mocked him for saying this is the "best of all possible worlds," but his solution to the mind-body problem is arguably more subtle than the caricature suggests—he doesn't make the mind a ghost in the machine; he makes the machine a shadow of the mind.
