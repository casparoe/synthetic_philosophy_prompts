      *   *Fix:* Have her use Gibbard's distinction between *disagreeing in belief* vs. *disagreeing in plan*.
      *   *Critique:* Make sure Ray doesn't just say "but it's not true!"
      *   *Fix:* Ray should focus on *explanation*. Why does the inconsistency feel the same? If it's different in kind, why does logic apply equally?
      *   *Key Insight:* The "Negation Problem" (Schroeder's objection) is the strongest realist counter-argument here. I need to include the distinction between *committing to a plan* and *committing to the truth of a plan*.
      *   *Specific Focus:* The "A-type" vs. "B-type" inconsistency (Schroeder's terminology is helpful internally, but maybe keep it conversational). Let's focus on the difference between *clashing attitudes* and *clashing contents*.

  6.  **Writing the Dialogue (Iterative Process):**
