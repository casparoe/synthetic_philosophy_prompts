answer: |-
  **Setting:** *A quiet corner of a university library café. Two grad students, **Ella** (an expressivist leaning toward quasi-realism) and **Ray** (a moral realist), are surrounded by stacks of papers. Ella has been reading Gibbard; Ray has been reading Shafer-Landau.*

  **Ray:** Okay, I've read your notes on the embedding problem three times. I want to believe you. I really do. The idea that morality is about practical deliberation rather than detecting cosmic particles appeals to me. But I keep hitting the same wall you mentioned. It's not just that expressivism *says* moral sentences work in logic; it's *how*.

  **Ella:** I know. It's the Frege-Geach problem. The worry is that if "Tampering with evidence is wrong" just expresses a negative attitude toward tampering, then "If tampering with evidence is wrong, then you shouldn't do it" becomes nonsense. Because in the antecedent, I'm not actually expressing an attitude. I'm just hypothesizing.

  **Ray:** Exactly. And for *modus ponens* to work, the phrase "tampering with evidence is wrong" has to mean the same thing in the premise as it does in the conditional. If the first is an attitude and the second is... what? A hypothetical attitude? Then the argument commits a fallacy of equivocation. It's like saying, "I hate broccoli. If I hate broccoli, I won't eat it. Therefore, I won't eat it." The logic holds, but the moral force seems to vanish if morality is just hate.

  **Ella:** Right, but that's the cognitivist trap. You're assuming the only thing that can embed in logic is a *belief* with a truth condition. Gibbard and Blackburn argue that's too narrow. Logic isn't just about truth-preservation; it's about *consistency*. And you can be inconsistent with attitudes, not just beliefs.

  **Ray:** This is the part where the textbooks wave their hands. "Consistency of attitudes." Okay, I believe it's raining, and I believe it's not raining. That's a contradiction. The content clashes. But if I *boo* at tampering, and I *boo* at... not booing at tampering? What does that even look like?

  **Ella:** Don't think of it as "booing." Think of it as *planning*. Gibbard's move is to say moral judgments are expressions of *norm-acceptance*. To say "Tampering is wrong" is to plan to feel guilt for tampering and resentment toward those who tamper.

  **Ray:** Okay. So, "Tampering is wrong" = "I plan to resent tampering."

  **Ella:** Yes. Now, look at the conditional: "If tampering is wrong, then getting your friend to tamper is wrong." On my view, this isn't a truth-functional conditional. It's a higher-order plan. It means: "I plan to resent getting your friend to tamper, *in the event that* I plan to resent tampering."

  **Ray:** Wait. So the conditional expresses a plan to have a plan?

  **Ella:** Roughly. It's a commitment to coherence in your normative framework. If you accept the conditional, you are ruling out a specific combination of attitudes. You are saying, "It is inconsistent to resent tampering but *not* resent getting your friend to tamper."

  **Ray:** I see the move. You're trying to map logical inconsistency onto *attitudinal* inconsistency. Beliefs are inconsistent if they can't both be true. Attitudes are inconsistent if they... can't both be held?

  **Ella:** Yes. It's a clash of commitment. If you resent tampering, but you refuse to resent someone facilitating it, your normative system is fragmented. It's practically unstable.

  **Ray:** Here is where I think the joint is weak, Ella. When two beliefs contradict, the contradiction is in the *world*. They can't both map onto reality. When two attitudes contradict, the contradiction is in *you*. It's psychological.

  **Ella:** So?

  **Ray:** So, logic is supposed to be normative, not psychological. If I believe *P* and believe *not-P*, I am *wrong*. Not just confused. But if I resent *A* and don't resent *B* (where B entails A), I might be weird, or hypocritical, but am I *logically invalid*? You're defining validity as "psychological stability." But I can be psychologically stable and morally monstrous. A sociopath could have perfectly consistent plans to resent nothing. Is his logic valid?

  **Ella:** That's a category error. We aren't evaluating the sociopath's logic; we're evaluating the *structure* of the judgment. Look, when you say, "If tampering is wrong, then facilitating is wrong," you aren't making a claim about the world. You're articulating a constraint on your own will. The "validity" of the argument guarantees that if you hold the premises, you *must* hold the conclusion, on pain of practical irrationality.

  **Ray:** But that changes the meaning of "must." In standard logic, if the premises are true, the conclusion *is* true. In your logic, if the premises are *felt*, the conclusion *must be felt*. That's not logical entailment; that's causal or psychological pressure.

  **Ella:** No, it's not causal. It's constitutive. To count as having a normative opinion *just is* to be bound by these consistency constraints. If you don't feel the pressure to extend your resentment from the act to the facilitation, you aren't making a moral judgment at all. You're just making noise.

  **Ray:** Okay, let's press on the negation. This is the part that keeps me up at night. The "Negation Problem."

  **Ella:** Schroeder's objection?

  **Ray:** Yeah. Let's look at the sentence: "Tampering is *not* wrong." On your view, "Tampering is wrong" expresses a plan to resent tampering. So what does "Tampering is *not* wrong" express?

  **Ella:** It expresses the absence of that plan. I don't plan to resent it.

  **Ray:** That's not right. "Not wrong" doesn't mean "I don't care." It means "It is permissible." If I say, "Eating with your hands is not wrong," I'm not saying I have no attitude. I'm saying you are *allowed* to do it. But if "wrong" is "plan to resent," then "not wrong" is "do not plan to resent." That sounds like indifference.

  **Ella:** Gibbard handles this by distinguishing between *disagreeing in belief* and *disagreeing in plan*. To judge something permissible is to plan *not* to resent it. It's an active commitment to tolerance, not just a lack of anger.

  **Ray:** But how do you distinguish that from the conditional? If I say, "If tampering is wrong, then facilitating is wrong," I'm expressing a complex plan. If I say, "Tampering is not wrong," I'm expressing a plan not to resent. The problem is that these look like two totally different *kinds* of mental states.
  In cognitivism, "P" and "Not-P" are the same kind of thing (beliefs) with opposite truth values. In your view, "Wrong" is a pro-attitude, and "Not Wrong" is... a lack of attitude? Or a different attitude?

  **Ella:** It's a different attitude. It's the attitude of *accepting a norm that permits it*.

  **Ray:** But now you've multiplied entities. "Wrong" is State A. "Not Wrong" is State B. "Is it wrong?" is State C. In cognitivism, they are all the same state (belief) directed at the same content with different modes (assertion, negation, question). You have to posit a different mental state for every logical operator. That seems ontologically extravagant.

  **Ella:** It feels extravagant because you're looking for a "state" like a belief. But think of it like a computer code. `IF (Tampering = Wrong) THEN (Facilitating = Wrong)`. The code isn't a belief. It's a function. The "Not" operator just reverses the output of the function. It's not a new state; it's the same planning system operating differently.

  **Ray:** But the computer code analogy only works if the system has a defined goal. If the goal is "Truth," then `NOT` flips True to False. What is the goal of the planning system?

  **Ella:** Coordination. Social living. We need to align our expectations.

  **Ray:** Ah. So the "logic" is actually just pragmatics. It's about what works for society.

  **Ella:** No! That's a reduction I reject. It's not that we *should* be consistent because it helps society. It's that *being inconsistent* means you aren't actually planning. You can't plan to do X and plan to not do X simultaneously. It's not pragmatic; it's conceptual.

  **Ray:** Okay, let's try to trap the validity issue again. Imagine I accept your premises.
  1. If tampering is wrong, then facilitating is wrong.
  2. Tampering is wrong.
  3. Therefore, facilitating is wrong.

  I accept 1 and 2. But I deny 3. I say, "I resent tampering, and I accept that if tampering is wrong then facilitating is, but I refuse to resent facilitating."
  On your view, what have I done?

  **Ella:** You've violated a norm of rationality. You're in a state of "normative inconsistency."

  **Ray:** But have I said something *false*?

  **Ella:** There is no truth here. You've just broken the rules of the game of deliberation.

  **Ray:** And that's the rub. If I deny the conclusion of a standard logical argument, I've made a mistake about *reality*. If I deny the conclusion of your argument, I've made a mistake about *myself*.
  This means that for you, moral arguments can never actually *prove* anything to someone who doesn't already share the underlying attitudes. If a Nazi says, "If killing Jews is wrong, then helping kill Jews is wrong. Killing Jews is wrong... wait, no, killing Jews is *right*."
  You can't show him he's wrong. You can only show him he's inconsistent *if* he accepts the first premise. But if he doesn't share your plan to resent killing, the logic doesn't engage.

  **Ella:** This is the "Quasi-Realist" challenge. Blackburn admits this. We can't prove the Nazi wrong in the way you prove a mathematician wrong. But we can show him that his position is unstable. We can argue that *anyone* who reflects on what it means to have a community, to rely on trust, to plan a life, would inevitably arrive at plans that reject his.

  **Ray:** That's persuasion, Ella. That's rhetoric. It's not logic. You've saved the *phenomenology* of moral debate—it feels like we're arguing about truth—but you've sacrificed the *mechanics*. You're saying logic is just a shadow play of our psychological need for consistency.

  **Ella:** I'm saying logic is a tool for agents. Agents have desires and plans. Logic helps agents navigate those without self-sabotage. Why do you think logic applies to beliefs? Because beliefs aim at truth. Why do I think logic applies to morals? Because morals aim at action. Both need consistency to function.

  **Ray:** But beliefs *track* truth. That's why `P` and `Not-P` can't both be true. The world won't allow it. Your plans don't track anything external. I can plan to drink coffee and plan to not drink coffee. It's a mess, but it's not a contradiction in the world. It's just a mess in me.
  So when you say the argument is "valid," you're really saying, "It is psychologically difficult to hold these premises without the conclusion." That's an empirical claim, not a logical one.

  **Ella:** I think you're conflating "logical validity" with "metaphysical grounding." I'm trying to earn the right to *talk* about validity without the metaphysics. I'm a Quasi-Realist. I want to say moral statements are truth-apt, arguments are valid, and some people are mistaken.

  **Ray:** But you're defining "truth-apt" as "expresses a stable plan."

  **Ella:** I'm defining it as "functions in discourse exactly like a truth-apt statement." If it walks like truth and talks like truth, why do you need the "cosmic particles" of moral reality?

  **Ray:** Because the "walk" is different! When I say "It is true that tampering is wrong," I mean there is a *reason* to resent tampering that exists independently of my plan. If you say "It is true," you mean "My plan is stable."
  If we disagree, I think we are investigating the same object and one of us is missing it. You think we are two different planning systems clashing.
  The Frege-Geach problem isn't just about embedding sentences. It's about whether the *inference* preserves the *normative force*.
  If I accept your premises, do I have a *reason* to accept the conclusion?
  For me, yes. The truth of the premises guarantees the truth of the conclusion.
  For you, the stability of the premises guarantees the stability of the conclusion.
  But what if I don't care about stability? What if I'm willing to be fragmented?

  **Ella:** Then you aren't a moral agent. You're a chaos machine.

  **Ray:** *Laughs.* That's a convenient escape clause. "If you don't agree with my logic, you aren't playing the game."
  Look, I'll concede this: You've shown how expressivists can *mimic* realist language. You can build a logic of attitudes. You can define inconsistency in terms of clashing plans.
  But the cost is that moral disagreement becomes fundamentally different from factual disagreement.
  If we disagree about math, we can check the proof. If we disagree about morals, on your view, we are just comparing our planning architectures. If mine allows "Tampering is wrong but facilitating is okay," and yours doesn't, there's no third thing to appeal to. You can call me inconsistent, but I can say, "I prefer my inconsistency."

  **Ella:** I'd say you've misunderstood what a plan is. A plan isn't a whim. It's a solution to the problem of what to do. If your solution doesn't account for the entailments of your own values, it's not a solution. It's a failure.
  But... I will concede this: Expressivism cannot ground moral truth in the way realism does. It grounds it in the nature of agency. If you reject the demands of agency—if you reject the need for coherence—then yes, expressivism has no leverage over you.
  But neither does realism. If you reject logic itself, realism can't save you.

  **Ray:** True. But realism posits that the logic is *out there* in the moral facts. You posit the logic is *in here*, in the structure of planning.
  The Frege-Geach problem highlights that gap. You solved the linguistic embedding—yes, we can put "wrong" in conditionals. But you haven't solved the *normative* embedding. You haven't explained why the conditional *binds* me if I don't already share the attitude.

  **Ella:** And I think that's a feature, not a bug. Morality *doesn't* bind psychopaths. Realism pretends it does by inventing invisible facts. I'd rather admit that morality is a human project, and like all projects, it only works for those committed to building it.

  **Ray:** So the "validity" of moral arguments is conditional on wanting to be a moral agent?

  **Ella:** Basically. Hypothetical imperatives all the way down, but the "if" is "if you want to deliberate at all."

  **Ray:** *Sips coffee.* That's honest. It's less satisfying than "The Universe says No," but it's honest. You've patched the linguistic hole, Ella. But you've left the metaphysical one wide open. You've explained how we *speak* like realists, but not how we *are* realists.

  **Ella:** That's why it's *Quasi*-Realism. I'm not trying to be you, Ray. I'm trying to explain why you talk the way you do, without believing what you believe.

  **Ray:** Well, you've convinced me that expressivism isn't dead. But I'm still not buying the ticket. The "inconsistency of plans" feels too much like "inconsistency of tastes" dressed up in a tuxedo.

  **Ella:** And I think your "moral facts" feel too much like "divine commands" dressed up in naturalism.

  **Ray:** *Smiles.* Touché. Same time next week? I want to try to break your theory on internalism.

  **Ella:** Bring it. I'll bring Gibbard.
