      *   *Idea:* Tax evasion? Too political. Murder? Too heavy.
      *   *Idea:* "Eating meat is wrong." Good, but common.
      *   *Idea:* "Breaking a promise is wrong." Classic, but maybe too close to lying.
      *   *Selection:* **"Tormenting animals for fun is wrong."** It's visceral, clearly action-guiding, and allows for conditional structures easily. Let's refine it to be slightly more abstract to fit logical embedding better. How about **"Stealing from the poor is wrong"**? Or maybe something procedural like **"Cheating in a competition is wrong."**
      *   *Decision:* Let's go with **"Cheating in a competition is wrong."** It allows for clear conditionals regarding consequences and rules.

  3.  **Character Conceptions:**
      *   **The Expressivist (E):** Let's call her *Ella*. She should be sophisticated, likely leaning towards Simon Blackburn's *Quasi-Realism* or Allan Gibbard's *Norm-Expressivism*. She needs to explain *how* attitudes embed without becoming beliefs.
      *   **The Realist (R):** Let's call him *Ray*. He shouldn't be a naive objectivist but someone concerned with truth-conditions and logical validity. He needs to pinpoint where the analogy between logical inconsistency and attitudinal inconsistency breaks down.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Acknowledge the user's frustration (the "hand-waving" issue).
