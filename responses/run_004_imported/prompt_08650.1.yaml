  8.  **Final Review against the "Rabbit Hole" feeling:** The user feels stuck on *what attitude is expressed in the conditional*. I need to make sure Ella explicitly tries to define that attitude and Ray explicitly shows why it's elusive.

      *(Self-Correction)*: I should make sure to reference Gibbard's "Plan" theory specifically, as it's the most robust attempt to solve this. Ella will argue that to judge "If P then Q" is to plan to have a specific reaction given a fact. Ray will ask what happens when the fact isn't known.

      *Let's go with the "Tampering with Evidence" example.* It's clean.

      *Structure:*
      1. Setup & The Problem (Frege-Geach restated).
      2. Expressivist Solution (Gibbard/Blackburn style - Consistency of Plans).
