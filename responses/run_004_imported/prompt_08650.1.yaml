      *   **Participants:** A sharp Expressivist (non-cognitivist) and a sharp Moral Realist (cognitivist).
      *   **Tone:** Genuine philosophical engagement, no strawmanning, no hand-waving.
      *   **Content:** Needs to walk through the mechanics of a specific expressivist solution (e.g., Blackburn's quasi-realism, Gibbard's norm-expressivism/planning) and have the realist press on the specific weak points (the "inconsistency" of attitudes vs. beliefs).
      *   **Constraint:** Use a fresh example (not "lying").
      *   **Goal:** Show whether expressivism has a real answer or is just relabeling the problem.

  2.  **Select the Example:**
