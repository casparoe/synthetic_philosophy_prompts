      *   If Death is likely in Aleppo, CDT says "Go to Damascus."
      *   If I think "I will likely choose Damascus," I must think "Death is likely in Damascus."
      *   If Death is likely in Damascus, CDT says "Go to Aleppo."
      *   **Result:** There is no stable pure strategy. The agent oscillates.
