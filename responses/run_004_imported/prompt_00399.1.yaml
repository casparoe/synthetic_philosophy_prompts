      *   **Egan's Objection (The "Psychopath Button" is similar but distinct):** Actually, Death in Damascus is often cited as a case where CDT recommends an action that guarantees failure if the predictor is perfect.
      *   *Wait, let's refine:* In the standard Gibbard & Harper formulation, CDT actually *does* struggle with stability.
      *   If I decide to go to Aleppo, I know Death predicted that. So Death is in Aleppo. So I die. Utility = -100.
