      *   Is there a causal link? No. But the *belief* about the state depends on the decision.
      *   CDT says: Maximize $ \sum P(S_i | \text{do}(A)) \cdot U(S_i, A) $.
      *   Since $S$ (Death's location) is causally independent of $A$, $P(S | \text{do}(A)) = P(S)$.
      *   So CDT says: Choose $A$ to maximize utility given *current* beliefs about $S$.
      *   *But* rational agents update beliefs about $S$ based on their own decision process (because they know they are predictable).
