answer: |-
  You have stumbled, quite accidentally, into one of the most profound and frustrating discoveries in 20th-century mathematics.

  To answer your question directly: **Your second suspicion is correct.** There is no "true, fair winner" hiding in those ballots waiting to be found by the right arithmetic. The flip-flopping is not a bug in your process; it is a fundamental feature of collective decision-making.

  You have personally replicated the conditions that led economist Kenneth Arrow to win the Nobel Prize in 1972. What you experienced is the practical application of **Arrow's Impossibility Theorem**.

  Here is the breakdown of what happened to your books, why it happened, and what you should do about next year's prize.

  ### The Three Methods You Accidentally Tested

  1.  **The Points System (Borda Count):**
      By assigning 4 points for 1st, 3 for 2nd, etc., you used a *Borda Count*. This method favors **consensus**. Book A likely didn't have the most passionate 1st-place supporters, but it was everyone's safe "2nd place" choice. It rewards the book that offends the fewest people.
  2.  **The Head-to-Head (Condorcet Method):**
      When the judge mentioned preferences, they were describing a *Condorcet Winner*. This is a candidate who beats every other candidate in a one-on-one matchup. Book B was the one that, if you put it in a room with A, C, or D individually, would win the duel. This method favors **strength of preference**.
  3.  **The Elimination (Violation of IIA):**
      When you removed the last-place book and the winner flipped from A to C, you witnessed a violation of the *Independence of Irrelevant Alternatives (IIA)*. In a perfect system, removing a loser shouldn't change the relationship between the winners. But in ranked systems, the "loser" often acts as a spoiler, siphoning points from a specific rival. When the spoiler was removed, those points redistributed, changing the outcome.

  ### The Hard Truth: There Is No "Will of the Group"

  You asked if there is one true winner hiding behind bad arithmetic. The mathematical answer is **no**.

  Arrow proved that no ranked voting system can satisfy a set of basic fairness criteria simultaneously (specifically: non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives).

  *   If you want a system that respects head-to-head majorities (Condorcet), you become vulnerable to cycles (A beats B, B beats C, C beats A).
  *   If you want a system that rewards broad consensus (Borda), you become vulnerable to "clone" candidates splitting the vote.
  *   If you want a system where removing a loser doesn't change the winner (IIA), you essentially have to let one person dictate the outcome (a dictatorship).

  So, to your final question: **"Does picking any ranking system just mean smuggling in a value judgment about which kind of unfairness I'm more willing to live with?"**

  **Yes. Exactly that.**

  Every voting method prioritizes a different definition of "fairness."
  *   **Borda (Points)** says: "Fairness means the winner is acceptable to everyone."
  *   **Condorcet (Head-to-Head)** says: "Fairness means the winner can defeat any challenger."
  *   **Plurality (Most 1st place votes)** says: "Fairness means the winner has the most passionate supporters."

  In your specific case, Book A was the *compromise*, Book B was the *champion*, and Book C was the *beneficiary of a spoiler effect*. None of them is the "true" winner. The method you choose *creates* the winner.

  ### What Should You Do Next Year?

  Since you are a small panel (five people) rather than a national electorate, you have advantages large elections don't. Here is my advice for the press, ranked by efficacy:

  **1. The "Least-Bad" Mathematical Method: Score Voting**
  Instead of ranking (1st, 2nd, 3rd), have judges *rate* the books on a scale (e.g., 1 to 5 stars, or 0 to 10). Sum the scores.
  *   **Why:** This avoids the ranking paradoxes. I can give Book A a 10 and Book B a 9, rather than being forced to say A is "better" than B when I actually love them both equally. It captures *intensity* of feeling, which ranking hides.
  *   **The Trade-off:** It requires judges to calibrate their scores (is a 7 from Judge 1 the same as a 7 from Judge 2?).

  **2. The "Most Human" Method: Deliberation**
  With only five judges, **do not vote immediately.**
  *   **Why:** Math is for anonymous masses. Five people is a dinner party. You should discuss the books first. Often, a judge will say, "I ranked this last because I hated the prose," and another will say, "I ranked it first because the story moved me." Through discussion, you might realize Book B is the better *debut* (showing promise) even if Book A is the better *novel* (polished).
  *   **The Trade-off:** It takes time. And the most vocal judge might sway the room.

  **3. If You Must Rank: Use Condorcet**
  If you must submit secret ballots, use the head-to-head method.
  *   **Why:** In a literary prize, you generally want the book that can stand up against the others. If Book B beats Book A in a direct comparison, it feels more defensible to award B, even if A had more "points."
  *   **The Trade-off:** You risk a "Condorcet Cycle" (rock-paper-scissors scenario) where there is no clear winner. You need a tie-breaker rule ready.

  ### A Note on Your Novel

  You mentioned this is gnawing at you when you should be plotting. I would suggest that this *is* the plot.

  The tension between "objective truth" and "the system used to measure it" is a fantastic conflict. You have five characters (the judges), four objects of desire (the books), and a system that claims to reveal truth but actually constructs it. The fact that there is no "true winner" is not a dead end; it's the thematic core of a story about ambiguity, subjectivity, and the stories we tell ourselves to justify our choices.

  You haven't been procrastinating. You've been doing research. The math says there is no right answer, but the novel doesn't need a right answer. It just needs a true one.

  Go write the book. Let the prize committee figure out the arithmetic.
