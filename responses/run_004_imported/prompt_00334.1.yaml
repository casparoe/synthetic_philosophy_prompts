answer: |-
  # The Shadow of the Multiverse: Assessing Evidential Cooperation in Large Worlds

  The history of moral progress is often described as an expanding circle. It began with the kin and tribe, widened to the nation, then to all human beings, and more recently to non-human animals and future generations. In certain corners of the effective altruism and rationalist communities, there is a push to expand this circle further still—not across space or time, but across causality. This is the domain of Evidential Cooperation in Large Worlds (ECL).

  ECL proposes that in a sufficiently vast universe, we likely share reality with countless agents whose decision-making processes are correlated with our own, despite the absence of any causal link between us. Consequently, we ought to act as if we have struck a cooperative bargain with these distant counterparts: promoting their values here in the expectation that they are promoting ours elsewhere. While theoretically intriguing, ECL rests on precarious epistemic foundations. This essay will outline the core argument for ECL, examine its most formidable objections, and conclude that while ECL serves as a valuable check on moral dogmatism, it is too speculative to function as a primary guide for real-world conduct.

  ### The Core Argument for ECL

  The argument for ECL rests on three pillars: the size of the world, the similarity of agents, and the logic of superrationality.

  First, the "Large World" assumption. Modern cosmology suggests the observable universe is vast, and inflationary models suggest the total universe may be infinite. Even without committing to the Many-Worlds Interpretation of quantum mechanics or a modal realist multiverse, a standard infinite or sufficiently large finite universe implies that every physically possible configuration of matter occurs somewhere. If the universe is large enough, there are regions containing agents who are physically and computationally similar to us.

  Second, the assumption of psychological similarity. If there are agents elsewhere who reason similarly to us—perhaps because they are evolutionary convergences or literal physical duplicates—they likely employ similar decision algorithms. If I am the kind of agent who cooperates in a Prisoner's Dilemma when I believe the other party is similar to me, a similar agent elsewhere will likely do the same.

  Third, and most crucial, is the decision-theoretic mechanism, often grounded in *superrationality* or Functional Decision Theory (FDT). In standard Causal Decision Theory (CDT), my choice cannot affect a causally disconnected agent. However, in Evidential Decision Theory (EDT) or FDT, my choice provides *evidence* about the output of similar decision algorithms running elsewhere. If I choose to cooperate, it is evidentially likely that my counterparts also choose to cooperate.

  This creates the potential for "acausal trade." Suppose I value the reduction of suffering, while a distant counterpart values the creation of complex knowledge. If we both defect (pursue only our own values), we each get a baseline payoff. If we cooperate acausally—I devote some resources to knowledge creation, and they devote some to suffering reduction—the total value produced across the large world increases. Because the universe is large, the number of such counterparts could be astronomical, meaning the expected value of cooperating with them could dwarf the value of local causal actions.

  Proponents argue this matters even without exotic cosmology. One need not believe in quantum branching to accept that the universe is large enough to contain statistical duplicates. If the expected number of similar agents is high, the evidential link becomes a dominant factor in expected utility calculations.

  ### The Objections

  Despite its internal coherence, ECL faces severe challenges regarding epistemology, coherence, and practical application.

  **1. Epistemic Opacity and the Reference Class Problem**
  The most damning objection is that we cannot know who our counterparts are. To calculate the expected value of ECL, an agent must assign credences to the existence, values, and decision procedures of unobservable agents. This is an impossible empirical task. What constitutes a "similar" agent? Is it an exact physical duplicate? A being with the same utility function? A being using the same decision theory?
  If the reference class is too narrow (exact duplicates), the probability of their existence drops, diminishing the expected value. If the class is too broad (any reasoning agent), the correlation in decision-making becomes negligible. Without a way to survey the "large world," any credence assigned to these variables is essentially a guess. Basing high-stakes decisions on such guesses invites Pascal's Mugging, where tiny probabilities of vast payoffs dominate rational choice.

  **2. The Coherence of Correlation Without Causation**
  Critics argue that ECL imports a category error from Newcomb-style thought experiments into cosmology. In Newcomb's Problem, the correlation between the agent's choice and the predictor's box-filling is established by a specific causal history (the predictor simulated the agent). In ECL, the correlation is merely statistical.
  From a physicalist perspective, my decision process here and now is a local physical event. Why should the state of a physically disconnected system update based on my local computation, absent a common cause or direct link? While FDT proponents argue that the "logical fact" of the decision is shared, skeptics contend this is mysticism dressed as math. If the correlation is not robustly defined, the "evidential" link is illusory, and cooperating is simply altruism without the guarantee of reciprocity.

  **3. Demandingness and Exploitability**
  ECL is radically demanding. If there are infinitely many counterparts with diverse values, the logic of trade suggests I should dilute my own values to accommodate the aggregate of theirs. This could lead to a "value dilution" where an agent ends up pursuing a incoherent mixture of goals, effectively paralyzing action.
  Furthermore, ECL is vulnerable to exploitation. If an agent believes they are in an ECL scenario, they might be manipulated by the hypothesis itself. For example, a malevolent agent might reason that "suffering-focused" counterparts exist and must be appeased, leading to resources being diverted to obscure or potentially harmful ends based on speculative metaphysics rather than observable need.

  **4. Unfalsifiability and Rationalization**
  Finally, ECL risks functioning as an unfalsifiable rationalization. Because the counterparts are unobservable, any action can be retroactively justified as "cooperating with acausal partners." An agent who wants to pursue a niche interest can claim it aligns with the values of their distant counterparts. Without the possibility of empirical feedback or verification, ECL lacks the error-correction mechanisms essential for rational planning.

  ### Conclusion: A Stance on Practical Conduct

  Given the theoretical allure but practical perils of ECL, how should it inform our conduct? The stance should be one of **philosophical acknowledgment but practical rejection.**

  ECL should **not** be used as a primary guide for resource allocation or moral decision-making. The epistemic gap is simply too wide. In effective altruism, the core tenet is to do the most good possible based on the *best available evidence*. Causal interventions—such as distributing bed nets, advocating for pandemic preparedness, or aligning AI—have trackable, observable outcomes. Acausal interventions have none. To prioritize the speculative acausal over the concrete causal is to violate the principle of expected value maximization under uncertainty, because the uncertainty surrounding ECL parameters is so extreme that the expected value calculation becomes noise.

  However, ECL should not be entirely dismissed. It serves a secondary, heuristic function: fostering **axiological humility**. The argument successfully highlights that our values are not necessarily universal and that agents with different terminal goals might be just as rational as we are. This should encourage agents to be less dogmatic and more open to value pluralism in *causal* interactions. For instance, it supports the idea of cooperating with humans who hold different moral views, not because of acausal trade, but because the logic of cooperation is robust across scales.

  Furthermore, ECL warrants a specific caution regarding **s-risk (suffering risk)**. If there is a non-zero chance that acausal counterparts are suffering-focused, reckless actions that increase suffering here might evidentially signal recklessness there. While we cannot trade with them, we should avoid actions that would be universally condemned by rational agents (e.g., creating gratuitous suffering), not because of acausal retaliation, but because such actions are likely wrong in any framework.

  In sum, ECL is a fascinating boundary case for decision theory that exposes the limits of our epistemic reach in a vast cosmos. But rational agents must act in the world they can measure, not the one they can only imagine. We should treat the universe as if it is large, but act as if our causal lever is the only one we can pull. ECL should remain a footnote in moral philosophy, not a headline in our strategic planning.
