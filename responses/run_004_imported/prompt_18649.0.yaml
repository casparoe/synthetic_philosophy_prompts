answer: |-
  The smoked salmon still sat in the refrigerator, wrapped in wax paper, a silent accusation in the crisper drawer. Arthur Vance had told his housekeeper to throw it out, but she hadn't the heart. So it remained, a pink ghost haunting the periphery of his kitchen, while Arthur sat in his study, staring at the blinking cursor on his monitor.

  The essay was due next week. *What I Saw When I Was Dead.* The title was ironic, sharp, typical Vance. But the text beneath it was stalled.

  There was a knock at the doorframe. It was Elena, his doctoral student and de facto gatekeeper. She held a stack of proofs for his upcoming collection, *Language, Truth, and Logic: Revised*.

  "You're working," she said, not asking.

  "Attempting," Arthur replied. His voice was raspy. The cardiac arrest had bruised his throat, a physical reminder of the moment the world had stopped. "Come in, Elena. Tell me why I'm a fool."

  Elena stepped in, placing the proofs on a stack of journals. She looked at the screen. "You've written three paragraphs about the ambient temperature of the emergency room. You haven't mentioned the light."

  Arthur swiveled his chair. He was a small man, bird-like, with eyes that had spent seventy years squinting at the syntax of the universe. "The light is the problem."

  "The hypoxia," Elena corrected gently. "The temporal lobe firing as the blood flow returns. We have the medical report, Arthur. It's verifiable. It's physical. It fits the system."

  "It fits the system," Arthur agreed. He tapped his pen against the desk. "If I say, 'I saw a divine entity,' that is a metaphysical claim. It is cognitively meaningless. There is no empirical test I can perform to demonstrate the ontology of the being. Therefore, strictly speaking, I saw nothing. I experienced a neurological misfire."

  "Exactly," Elena said. "So write that. Protect the legacy. Don't let the tabloids turn you into a convert."

  Arthur looked away, toward the window. The London grey was pressing against the glass. "But that isn't what happened, Elena."

  "Subjectively."

  "No. Phenomenologically." He turned back to her. "When the heart stopped, the noise stopped. And then there was the light. It wasn't just photons. It was... authority. A painfully bright red light that governed the universe. It wasn't burning; it was administering."

  "Administering," Elena repeated, her tone skeptical.

  "And there were two figures. Ministers, I thought. Charged with the upkeep of space." Arthur smiled, a thin, brittle expression. "They told me they had bungled the job. They had left the cosmos in a state of disarray, and they needed me to put things right."

  Elena crossed her arms. "Arthur, you were unconscious. Your brain was synthesizing a narrative to cope with the trauma of death. It's a story your neurons told itself."

  "I know that," Arthur snapped, sharper than he intended. He softened. "I know that. Logically, I accept it. If you put a electrode to my parietal lobe, I'm sure we could replicate the 'ministers.' We could verify the cause. But Elena..."

  He stood up and walked to the bookshelf, running a finger along the spines of his own works. *The Problem of Knowledge.* *The Concept of a Person.*

  "Verificationism relies on the assumption that meaning is tied to the method of verification," Arthur said. "If I cannot verify it, it is nonsense. But the experience... the *feeling* of the experience... it possessed a reality that outweighs the verification. I felt the space needing upkeep. I felt the bungling of the ministers. It was more real than this desk. More real than your skepticism."

  "But it wasn't true," Elena insisted. "You didn't fix space. The universe is exactly as disordered as it was before you choked."

  "Isn't it?" Arthur turned. "I came back. Perhaps that was the fixing."

  "That's mysticism, Arthur. That's not philosophy."

  "It is the limit of philosophy," he said quietly. "I am not a convert, Elena. I do not believe in Heaven. I do not believe in God. I still believe that theological propositions are meaningless. But..."

  He walked back to the desk and sat down heavily.

  "But the certainty is gone."

  Elena stepped closer, her expression softening into pity. "The certainty that death is the end?"

  "The certainty that *nothing* is the end," Arthur corrected. "Before the salmon, I was sure. Death was a full stop. A linguistic termination. Now... I find myself hoping for the full stop. I hope there is nothing. I hope the ministers were a hallucination. But I cannot *know* it in my bones the way I did before."

  He looked at the blinking cursor.

  "I can verify the heart attack. I can verify the resuscitation. I can verify the neural pathways. But I cannot verify the absence of the light. I cannot prove that the red glow wasn't the fundamental substrate of reality, momentarily revealed. And because I cannot verify its absence, the door is cracked. Just a millimeter."

  "So you won't publish the essay?" Elena asked.

  "Oh, I'll publish it," Arthur said. "I'll explain the biology. I'll reaffirm the atheism. I will tell them it was a brain flickering back into activity."

  "Then why the hesitation?"

  "Because when I type the words 'it was merely a hallucination,' my finger hovers. Because a part of me—a part I cannot excise with logic—believes the ministers are still out there, waiting for me to finish the job they bungled."

  Arthur turned back to the screen. He typed: *The experience was subjective and physiologically induced.*

  He stared at the sentence. It was true. It was verifiable. It was meaningless.

  He hit the backspace key. The sentence vanished.

  "I cannot say it was *merely* anything," Arthur whispered, mostly to himself. "To say 'merely' is to claim knowledge I no longer possess."

  Elena watched him, silent. She saw the tremor in his hand, the way the grey light of the afternoon seemed to struggle against the lamp on his desk. She saw a man standing on the precipice of his own life's work, looking down into a fog that his maps said was empty, but whose depth he could feel in his chest.

  "What will you write?" she asked.

  Arthur looked at the blank space. He looked at the wax-papered salmon in his mind's eye. He looked at the red light behind his eyelids.

  "I will write that I saw the universe," he said. "And I will write that I do not know if it saw me."

  He left the cursor blinking. He did not press save. He did not turn off the computer. He simply sat in the gap between the silence of the room and the noise of the memory, waiting for a verification that would not come, sustained by a doubt that would not leave.
