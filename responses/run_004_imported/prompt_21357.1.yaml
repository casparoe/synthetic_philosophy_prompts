      *   *Claim:* "But ZFC also proves Cantor's theorem, that no such lining-up exists for the real numbers."
          *   *Check:* Yes, ZFC $\vdash \neg \exists f (f: \mathbb{R} \to \mathbb{N} \text{ is bijective})$.
      *   *Claim:* "So this countable model contains a set that, by its own internal lights, is too big to count."
