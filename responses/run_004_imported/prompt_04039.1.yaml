      *   **Task:**
          1.  Analyze the four specific arguments provided (Ben's two, Kayla's two) one by one.
          2.  Determine who has the *stronger* argument at *each step* (not just an overall winner).
          3.  Identify any missing considerations that matter.
      *   **Tone:** Empathetic, objective, analytical, nuanced. This is a sensitive situation (grief + money + family conflict).

  2.  **Analyze the Four Points:**

      *   **Point 1 (Ben):** *Intent of the Will vs. Reality of Need.*
          *   Argument: Dad wanted to take care of us. Equal dollars $\neq$ equal care given different circumstances (medical debt, no income).
          *   Strengths: Appeals to spirit of the law, moral obligation of family, utility of money (diminishing marginal utility).
          *   Weaknesses: Speculative (what did Dad *really* want?), sets a precedent for renegotiation.
          *   *Verdict:* Strong moral/emotional argument, but legally/structurally weak.

      *   **Point 2 (Kayla):** *Rule of Law vs. Subjectivity.*
          *   Argument: Will says equal. Adjusting for need creates a slippery slope (no natural stopping point). Mentions Ben's failed business.
          *   Strengths: Clarity, finality, prevents resentment, adheres to legal document.
          *   Weaknesses: Can seem cold, ignores the business context (was it voluntary?).
          *   *Verdict:* Strong procedural argument, protects the process.

      *   **Point 3 (Ben):** *Causality & Utility of Money.*
          *   Argument: Business failure was consequence of accident (not free choice). Money buys different levels of security (health context).
          *   Strengths: Nuanced view of "choice," highlights that money has different value to different people (economic utility).
          *   Weaknesses: Hard to prove causality definitively, still relies on subjective assessment of "security."
          *   *Verdict: Stronger than Point 1 because it addresses Kayla's specific counter-argument about the job.*

      *   **Point 4 (Kayla):** *Measurement Problem & Incentives.*
          *   Argument: No neutral way to measure hardship. Incentivizes competing victimhood/argument skills rather than actual need.
          *   Strengths: Very strong philosophical/practical point. Hard to quantify "need" objectively. Avoids family dynamics turning into a "who has it worse" contest.
          *   Weaknesses: Can feel dismissive of genuine suffering.
          *   *Verdict:* Strongest practical argument regarding family dynamics.

  3.  **Identify Missing Considerations:**
