      *   **Context:** University philosophy colloquium.
      *   **Speaker:** Metaphysician defending David Lewis's Genuine Modal Realism (GMR).
      *   **Problem:** The speaker habitually deflects objections about implausibility using Lewis's "incredulous stare" argument (i.e., "your intuition isn't an argument") and moves on quickly.
      *   **Goal:** Draft 8-10 interview questions (with follow-ups) for the Q&A session (moderated by the user).
      *   **Constraint:** The questions must make the "incredulous stare" deflection harder to use. They need to be substantive, technical, and press on specific weaknesses.
      *   **Specific Requirements:**
          1.  Include a question on Kripke's counterpart theory objection (de re modality).
          2.  Include a question on qualitative vs. quantitative parsimony (extravagance charge).
          3.  Include a question on the Principle of Recombination (plenitude, alien properties, circularity/stipulation).
          4.  End with a question on falsifiability/evidence against GMR (beyond the stare).
      *   **Tone:** Professional, philosophical, rigorous, but firm (since the user is moderating and wants to prevent deflection).

  2.  **Deconstruct the "Incredulous Stare" Defense:**
      *   Lewis's point: Just because a theory contradicts common sense doesn't make it false. Common sense is fallible.
      *   How to bypass this: Don't just appeal to intuition. Appeal to *theoretical costs*, *explanatory power*, *internal consistency*, *semantic adequacy*, or *methodological principles* that even a realist should accept. The questions need to show that the objection isn't just "This feels weird," but "This breaks X specific philosophical mechanism."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Kripke/Counterpart Theory.*
          *   *Issue:* Lewis says "I could have been a plumber" means "A counterpart of me is a plumber." Kripke says that's not *me*, so it doesn't capture the de re modality.
          *   *Draft:* Kripke says counterpart theory changes the subject. How do you respond?
          *   *Refinement:* Make it harder to deflect. Focus on the *loss* of de re modality. If GMR can't account for *my* possibilities, is it a theory of modality or just a theory of counterparts?
          *   *Follow-up:* She will likely say counterparts are good enough for all practical purposes. Push on the *identity* condition.

      *   *Requirement 2: Parsimony.*
          *   *Issue:* Lewis admits quantitative extravagance (many worlds) but claims qualitative parsimony (same kinds of things). Critics say this distinction is ad hoc.
          *   *Draft:* Is the parsimony distinction just a trick?
          *   *Refinement:* Frame it around theoretical virtue. If quantitative ontology has a cost (which it usually does in science), why is metaphysics exempt? Is the distinction stable?
          *   *Follow-up:* She will say ontological commitment is about types, not tokens. Push on whether multiplying tokens *ever* costs anything in her framework.

      *   *Requirement 3: Principle of Recombination.*
          *   *Issue:* Recombination generates worlds. But to get *alien* properties, do we need modal input? Is it circular?
          *   *Draft:* Can Recombination handle alien properties without cheating?
          *   *Refinement:* Focus on the "fundamentally alien" aspect. If we recombine only what we know, do we miss worlds? If we stipulate aliens, are we using modal notions to define modality?
          *   *Follow-up:* She will say Recombination is a postulate. Push on whether it's a *modal* postulate disguised as a structural one.

      *   *Requirement 4: Falsifiability/Evidence.*
          *   *Issue:* GMR seems unfalsifiable. The stare is the only defense.
          *   *Draft:* What would change your mind?
          *   *Refinement:* Ask for a specific theoretical failure. Is there a coherent state of affairs that GMR *cannot* model?
          *   *Follow-up:* She might say "logical contradiction." Push for something metaphysical, not logical.

      *   *Filling the remaining slots (aiming for 8-10 total):*
          *   *Indexicality:* Lewis's "Actual" is indexical. Does this dissolve the special status of our world too much? (e.g., solipsism of the present moment analog).
          *   *Ethical/Epistemic Isolation:* If worlds are causally isolated, how do we know about them? (Benacerraf-style challenge).
          *   *Probability:* How does GMR handle chance? If everything happens, is probability just frequency across worlds? (Problem of counting worlds).
          *   *Temporal Parts:* Lewis is a 4D-ist. Does GMR *require* perdurantism, adding another controversial layer?
          *   *Mathematical Platonism:* How does GMR interact with abstract objects? Are they in worlds?
          *   *Intraworld Relations:* Can objects in different worlds share properties (universals)? If not, how do we compare them? (Naturalness).

  4.  **Refining and Polishing:**
