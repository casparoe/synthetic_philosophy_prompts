      *   *The "Surprise":* Keynes thought machines would take the drudgery (mining, farming). Instead, AI is taking the "creative" and "cognitive" drudgery (copywriting, coding, analysis). This inverts his expectation of what is "human."
      *   *Technological Unemployment:* He called it a "temporary phase of maladjustment." Is it temporary? Or is this a structural shift? Keynes would likely stick to his guns on the long term but acknowledge the pain of the transition.
      *   *Purposiveness:* He worried people wouldn't know how to *stop* working. The user is being *forced* to stop (or pivot). This creates a specific psychological crisis: loss of purpose imposed from outside, not chosen from abundance.

  3.  **Drafting - Section 1: How Keynes Would Judge Today's Automation:**
