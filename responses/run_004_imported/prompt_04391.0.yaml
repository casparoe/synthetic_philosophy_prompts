      *   **The Task:**
          1.  How would Keynes judge the *specific way* automation is unfolding today (cognitive vs. physical)?
          2.  What advice would he give the user for the *months ahead*?
      *   **Tone:** Empathetic, intellectually rigorous, historically grounded, practical but philosophical.

  2.  **Deconstruct Keynes's Perspective vs. Reality:**
