      *   *Implication for PWS:* If Stalnaker/Lewis want to give indicatives truth conditions *and* maintain that our confidence in them tracks conditional probability, they hit a wall.
      *   *Implication for Adams:* Adams avoids this by denying truth conditions.
      *   *Recent Developments:* Bradley (2000), Barnett (2006), or "Deflationary" truth conditions. Or accepting that $P(A > C) \neq P(C|A)$ strictly, but close enough.
      *   *Relevance to the Prompt:* If we try to save PWS for indicatives to explain the Oswald pair, do we run into triviality? Yes, if we want to link it to probability. If we treat them as purely truth-conditional without the probability link, we lose the explanation of *why* we accept (I).

