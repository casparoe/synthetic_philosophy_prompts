      *   (S) If Oswald hadn't killed Kennedy, someone else would have. (Subjunctive - feels false).
      *   *Fact:* Oswald did kill Kennedy.
      *   *Problem:* Same surface structure, same facts, different truth values/assertability.

  3.  **Analyze Stalnaker/Lewis (Possible Worlds Semantics):**
      *   *Mechanism:* Both use a selection function $f(A, w)$ picking the "closest" $A$-world to $w$. Truth of $A > C$ depends on $C$ holding in $f(A, w)$.
      *   *The Problem:* Standard PWS treats indicatives and subjunctives with the *same* semantic machinery (just different selection functions or context sets).
      *   *Stalnaker's Fix (1975/1984):* Indicatives require the selected world to be in the *context set* (compatible with what is mutually known). Subjunctives allow stepping outside the context set.
          *   For (I): We know Oswald killed Kennedy. So "Oswald didn't kill Kennedy" is false in the actual world. To evaluate the indicative, we look for the closest world where he didn't *within the context set*. But if it's mutually known he did, there *are* no such worlds in the context set.
          *   *Wait, refinement:* Stalnaker actually argues that for indicatives, we presuppose the antecedent is *epistemically possible*. If we know $\neg A$, the indicative is infelicitous or vacuous. But (I) is felicitous and true.
          *   *Stalnaker's specific move on this pair:* He distinguishes them by the *source* of the similarity metric. For subjunctives, we hold fixed the past/causal laws (backtracking is limited). For indicatives, we update the epistemic state.
          *   *Lewis:* Lewis is skeptical of truth conditions for indicatives. He leans towards Adams. But if forced, he uses the same similarity metric.
          *   *The "Stipulation" Charge:* To get the different verdicts, PWS must posit two different selection functions ($f_{ind}$ vs. $f_{sub}$). $f_{sub}$ holds fixed the causal history (so if Oswald doesn't shoot, no conspiracy exists $\rightarrow$ JFK lives). $f_{ind}$ treats the antecedent as new information to be integrated into the actual world's facts (so if Oswald didn't shoot, given JFK *did* die, someone else must have).
          *   *Critique:* Does this *explain* the asymmetry? Or does it just label the two selection functions differently to match intuition? It risks being ad hoc unless grounded in a deeper pragmatic/epistemic distinction.

  4.  **Analyze Adams (Suppositional/Probabilistic):**
      *   *Mechanism:* Conditionals don't have truth conditions. They have *assertability conditions*. $P(C|A)$.
      *   *Handling the Pair:*
          *   (I) Indicative: We conditionalize on $\neg A$ within our *actual* belief state. We know JFK died ($K$). So we evaluate $P(\text{Someone else} | \neg \text{Oswald} \land \text{JFK died})$. Since JFK died and not Oswald, someone else must have. High probability $\rightarrow$ Assertable.
          *   (S) Subjunctive: Adams struggles here. His original theory is for indicatives. To handle subjunctives, Adams (and later Edgington) needs a different probability space (causal/counterfactual probability). We evaluate $P(\text{Someone else} || \neg \text{Oswald})$. This requires "backtracking" or causal modeling. Given no conspiracy, $P$ is low.
      *   *Explanation of Asymmetry:* The asymmetry comes from *which body of evidence* we conditionalize on. Indicatives use actual knowledge (including the consequent's factuality if known). Subjunctives use a causal model where the consequent isn't fixed.
      *   *Advantage:* Naturally captures why (I) feels true (it's an inference from known facts) while (S) feels false (it's a causal claim).

