answer: |-
  The Oswald/Kennedy minimal pair is the stress test for any theory of conditionals. You know the drill: (I) *If Oswald didn't kill Kennedy, someone else did* (Indicative, high confidence) vs. (S) *If Oswald hadn't killed Kennedy, someone else would have* (Subjunctive, low confidence). The antecedent and consequent are propositionally identical; the mood carries the entire semantic load.

  Here is the breakdown of how Stalnaker/Lewis (PWS) and Adams handle the asymmetry, focusing on explanatory depth and the threat of triviality.

  ### 1. Stalnaker/Lewis: Two Selection Functions or One?

  Standard PWS treats conditionals as propositions determined by a selection function $f(A, w)$ that picks the closest $A$-world to $w$. To handle the Oswald pair, Stalnaker and Lewis must argue that indicatives and subjunctives employ **different selection functions** or operate over **different domains**.

  **Stalnaker's Pragmatic Shift (1975, 1984):**
  Stalnaker argues the semantic content is uniform (a proposition), but the *context* determines which worlds are available for selection.
  *   **Indicatives:** The selection is restricted to the **context set** (the set of worlds compatible with the presuppositions of the conversation). When we assert (I), we presuppose JFK was killed. Therefore, we search for the closest world where Oswald didn't shoot *within the set of worlds where JFK died*. In all such worlds, someone else shot him. (I) comes out true.
  *   **Subjunctives:** The selection is not restricted to the context set. We are allowed to step outside the mutually known facts. When evaluating (S), we look for the closest world where Oswald didn't shoot, *without* holding fixed the fact that JFK died. We instead hold fixed the causal history (no conspiracy). In that world, JFK lives. (S) comes out false.

  **Lewis's Similarity Metric (1973):**
  Lewis is more skeptical of indicatives but suggests a similar divergence in the **similarity weighting**.
  *   **Subjunctives:** Priority is given to matching the past and laws of nature. We minimize "miracles." If Oswald doesn't shoot, we don't conjure a second shooter because that requires a larger divergence from actuality than letting JFK live.
  *   **Indicatives:** Lewis suggests indicatives are "evidence-relative." We evaluate them by adding the antecedent to our stock of knowledge and adjusting for consistency. Since we know JFK died, adding "Oswald didn't shoot" forces "Someone else shot" to maintain consistency.

  **The Explanatory Critique:**
  Does this *explain* the asymmetry, or stipulate it?
  It leans toward stipulation. PWS posits two distinct mechanisms (context-restriction vs. open search; or different similarity weightings) specifically to generate the divergent truth values. While Stalnaker grounds this in the pragmatics of assertion (indicatives presume epistemic possibility; subjunctives presume metaphysical possibility), it requires a dual-mechanism semantics. The theory saves the truth-conditional intuition but pays for it by fracturing the semantics of "if." It explains the verdicts, but it doesn't explain *why* natural language should bifurcate the selection function exactly along these lines without appealing to the very intuitions it's trying to model.

  ### 2. Adams: Suppositionalism and Probability

  Adams (1975) denies that indicatives have truth conditions. They have **assertability conditions**, identified with conditional probability: $Assertability(A \rightarrow C) = P(C|A)$.

  **Handling the Asymmetry:**
  Adams's framework naturally dissolves the paradox by treating (I) and (S) as different kinds of judgments.
  *   **For (I):** We calculate $P(\text{Someone else} | \neg \text{Oswald})$ relative to our *actual* belief state. Our belief state includes the fact that JFK died. So, effectively, we are calculating $P(\text{Someone else} | \neg \text{Oswald} \land \text{JFK died})$. Given the conspiracy theories are ruled out by our background knowledge, this probability is near 1. High assertability.
  *   **For (S):** Adams originally focused on indicatives, but the suppositional view extends to subjunctives via **causal probability** (developed further by Edgington). Here, we do not conditionalize on the actual outcome (JFK's death). We conditionalize on the antecedent within a causal model where the conspiracy does not exist. $P(\text{Someone else} || \neg \text{Oswald})$ is low.

  **The Explanatory Advantage:**
  Adams explains the asymmetry via the **input data**, not the semantic mechanism. The mechanism is always "suppose A and estimate C."
  *   In (I), the supposition is *epistemic*: "Add $\neg$Oswald to what we know." (What we know includes Death).
  *   In (S), the supposition is *ontic/causal*: "Intervene to make $\neg$Oswald true." (This breaks the link to Death).
  This feels less stipulative than PWS. It captures the intuition that (I) is an inference from facts, while (S) is a claim about causal dependencies. The asymmetry arises from the difference between *updating beliefs* vs. *imagining alternatives*, which is a pre-theoretic distinction Adams leverages rather than constructs.

  ### 3. The Triviality Worry (Lewis 1976)

  You asked whether Lewis's triviality results should worry us if we try to give indicatives truth conditions (i.e., if we side with Stalnaker against Adams). **Yes, they should.**

  Lewis's 1976 result proves that if:
  1.  Conditionals express propositions (have truth conditions).
  2.  The probability of the conditional equals the conditional probability (Adams's Thesis: $P(A > C) = P(C|A)$).
  3.  Probabilities are standard (Kolmogorov).

  Then, the probability function must be trivial (assigning 0 or 1 to almost everything).

  **Implications for the Oswald Pair:**
  *   **If you choose Stalnaker (Truth Conditions):** You must reject Adams's Thesis to avoid triviality. But if you reject Adams's Thesis, you lose the explanation for *why* (I) is assertable. You can say (I) is *true* in the closest context-set world, but you cannot say our *confidence* in (I) tracks $P(C|A)$. You sever the link between truth and rational belief. This makes the truth conditions empirically idle; they do no work in explaining our linguistic behavior.
  *   **If you choose Adams (No Truth Conditions):** You avoid triviality by denying premise (1). You preserve the link between assertability and conditional probability, which accurately models why we accept (I) and reject (S).

  **Recent Workarounds:**
  Some (e.g., Bradley 2000, Barnett 2006) attempt to save truth conditions by using non-Boolean semantics or by arguing that $P(A > C) \approx P(C|A)$ without strict identity. However, these moves often complicate the logic significantly (e.g., McGee's counterexamples to Modus Ponens for indicatives). If your goal is a lit review chapter, the consensus remains that triviality results constitute a heavy tax on any truth-conditional account of indicatives that wishes to remain probabilistic.

  ### Verdict for the Chapter

  If your criterion is **explanatory power regarding the asymmetry**:
  *   **Adams wins.** The distinction between epistemic conditionalization (holding fixed the consequent's factuality) and causal intervention (holding fixed the past) explains the divergent verdicts without requiring two distinct semantic operators. It treats the asymmetry as a feature of reasoning, not a quirk of semantics.
  *   **Stalnaker/Lewis** can model the verdicts, but only by positing a pragmatic/semantic split (context sets vs. similarity metrics) that looks tailored to the data. Furthermore, by insisting on truth conditions, they invite Lewis's triviality results unless they decouple truth from probability, which weakens their explanation of *assertability*.

  **Recommendation:** Frame the PWS approach as semantically unified but pragmatically fragmented (requiring distinct selection constraints), whereas the Suppositional approach is semantically deflationary but cognitively unified (one mechanism, two types of input). Argue that the triviality results suggest the "cost" of giving indicatives truth conditions is too high if we want to preserve the probabilistic nature of conditional judgment.
