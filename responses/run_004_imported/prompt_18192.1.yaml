          *   *The Oswald Case:* For (I), we hold fixed the *fact* that JFK died (part of the context). For (S), we hold fixed the *causal history* (no conspiracy).
          *   *Critique:* Is this explanatory? It relies on a pragmatic distinction about what is "held fixed." It risks being a dual-mechanism stipulation unless grounded in the nature of assertion vs. speculation.
      *   **Adams (Suppositional):**
          *   No truth conditions. Assertability = Conditional Probability.
          *   (I): $P(\text{Else} | \neg \text{Oswald} \land \text{Death})$. High.
          *   (S): Requires causal probability. $P(\text{Else} || \neg \text{Oswald})$. Low.
          *   *Explanation:* The asymmetry is explained by the difference between *epistemic updating* (indicative) and *causal intervention* (subjunctive). This feels more robust than "two selection functions."
      *   **Triviality Results:**
          *   If PWS claims truth conditions + Adams's Thesis $\rightarrow$ Triviality.
          *   To avoid this, PWS must either reject Adams's Thesis (counterintuitive) or accept non-Boolean semantics (e.g., McGee, Barnett).
          *   Adams avoids triviality by denying truth values.
          *   *Verdict:* Triviality results weigh heavily against giving indicatives standard truth conditions if we want to preserve the probabilistic intuition that makes (I) assertable.
      *   **Conclusion:** Adams (or Edgington's development) offers a better *explanation* of the asymmetry (epistemic vs. causal) without the metaphysical baggage of dual selection functions, and sidesteps triviality. PWS can model it but risks stipulation unless augmented with heavy pragmatics.

  7.  **Refine the Technical Details (Self-Correction/Polishing):**
      *   *Correction on Stalnaker:* Stalnaker (1975 "Indicative Conditionals") explicitly addresses this. He argues the difference is pragmatic. The semantic value is the same (proposition), but the *context* differs. For indicatives, the context set excludes $\neg A$ worlds if $A$ is known. Wait, if $A$ is known false, indicative is inappropriate. But in Oswald's case, we don't *know* $\neg A$ initially, we are reasoning from the fact of the death.
      *   *Better Stalnaker formulation:* The difference is what is held fixed in the similarity ordering. For subjunctives, we prioritize matching particular facts of the past. For indicatives, we prioritize matching general facts/current knowledge.
      *   *Lewis:* Lewis (1973) focuses on counterfactuals. He agrees with Adams on indicatives mostly.
      *   *Triviality:* Make sure to mention Hájek or Bradley if relevant, but keep it focused on the 1976 result. The key is that if $A > C$ expresses a proposition, $P(A > C)$ must be a probability over propositions. Lewis shows this forces $P(C|A)$ to be independent of $A$, which is absurd.
      *   *Tone Check:* Ensure I'm not defining "possible worlds" or "conditional probability." Use terms like "selection function," "context set," "Adams' Thesis," "triviality."

