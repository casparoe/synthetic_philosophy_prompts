answer: |-
  Here are ten interview-style questions tailored for your Q&A committee. The first three blocks address your mandatory requirements, including the predicted answer and the sharp follow-up designed to prevent deflection. The remaining four questions explore the angles you mentioned (cross-correspondences, legacy, esotericism) plus one on the definition of rationality itself.

  ### Part 1: The Mandatory Triad (With Follow-Ups)

  **1. The Empirical Payoff**
  "In the *Methods*, the 'Dualism of Practical Reason' is presented as a logical crisis: if duty and self-interest diverge, reason is contradictory. Sidgwick suggests a 'moral government of the universe' could solve this. Does your research suggest Sidgwick viewed psychical research as merely supporting a Kantian *postulate* of practical reason, or did he genuinely believe he needed *empirical proof* of immortality to validate the ethical system itself?"

  *   **Likely Answer:** She will likely argue he moved beyond Kant: he thought a postulate wasn't enough for a scientific age; he needed empirical facts to make belief in a moral order *rational* rather than just *necessary*.
  *   **Follow-Up:** "If he needed empirical facts to make morality rational, doesn't that render the *Methods* contingent on paranormal luck? If the séances fail—as they mostly did—are we left with the conclusion that utilitarianism is objectively irrational for the individual agent?"

  **2. Skepticism vs. Motivated Reasoning**
  "Sidgwick is often praised for his rigorous SPR methodology, like the Census of Hallucinations and exposing fraudulent mediums. But he also admitted to a profound personal *desire* for evidence of survival. How do we distinguish between a skeptic keeping an open mind and a philosopher engaging in motivated reasoning to rescue his own ethical system from collapse?"

  *   **Likely Answer:** She will likely argue that his skepticism validates the few positive results he *did* accept; because he was hard to convince, the evidence must have been strong.
  *   **Follow-Up:** "But isn't there a selection bias risk? Even a rigorous skeptic can lower the bar for 'anomalies' when they are desperate for a specific outcome. Can you point to a specific case where Sidgwick rejected psychical evidence that met his own stated criteria, or did the criteria shift to accommodate the hope?"

  **3. The Null Result and Agnostic Death**
  "Sidgwick died roughly two decades into his research, still agnostic, without the conclusive proof of a moral order he sought. Do you read this as a failure of his philosophical project, or is there a way to view the rigorous 'null result' as philosophically significant in its own right?"

  *   **Likely Answer:** She will likely argue the *search* was the ethical act—a commitment to truth over comfort—or that agnosticism is the only honest stance for a rationalist.
  *   **Follow-Up:** "If the honest stance is agnosticism, then we have no guarantee that duty and interest coincide. Doesn't that force us back to the Dualism? If he died without the proof, isn't the 'rationality' of egoism left standing as the default position, effectively undoing the reconciliation he spent his life trying to secure?"

  ***

  ### Part 2: Additional Angles (Legacy, Esotericism, and Irony)

  **4. The Cross-Correspondences**
  "I want to touch on the irony of the 'Cross-Correspondences'—the complex scripts that appeared after 1906, allegedly from deceased SPR members including Sidgwick himself. Given that these messages explicitly claimed to be continuing his work on survival, how should we read this posthumous 'collaboration'? Does it vindicate his hope, or does it complicate his legacy to have him become a 'ghost' in the very debate where he demanded evidence?"

  **5. Esoteric Morality and the SPR**
  "Sidgwick is famous for his controversial defense of 'esoteric morality'—the idea that some ethical truths should be withheld from the general public. Do you see a parallel here with his psychical research? Did he view evidence of the afterlife as another 'esoteric' truth that the masses weren't ready for, or was the SPR an attempt to democratize that evidence?"

  **6. The Analytic Excision**
  "Moore and Russell, who inherited Sidgwick's chair, effectively stripped the metaphysical and psychical elements out of the Cambridge ethical tradition to birth analytic philosophy. Based on your book, was this a betrayal of Sidgwick's actual system, or was it a necessary correction to save his ethics from the 'embarrassment' of the ghost-hunting?"

  **7. Shifting Definitions of Evidence**
  "Did Sidgwick's involvement with the SPR actually feed back into his definition of 'evidence' in the *Methods*? In later editions, do we see a shift where 'intuition' or 'common sense' is treated with the same tentative, probabilistic weight he applied to mediumistic testimony, or did he keep the two epistemologies strictly compartmentalized?"

  **8. The Role of Anxiety**
  "Biographers often note Sidgwick's near-nervous breakdowns and religious crises prior to the *Methods*. To what extent was the SPR not just a philosophical investigation, but a therapeutic intervention? If the psychical research was primarily about managing his own existential anxiety, does that undermine the objective weight he gives the 'Dualism' argument in the text?"

  **9. The 'Government of the Universe'**
  "Sidgwick specifically looked for evidence of a *moral* government, not just survival. Surviving death doesn't guarantee justice. Did his psychical research ever yield evidence that specifically addressed the *distribution of happiness* in the afterlife, or was he willing to accept *any* evidence of survival as a proxy for moral order?"

  **10. Contemporary Relevance**
  "Finally, for students today: If Sidgwick were alive now, with our modern neuroscience and parapsychology, do you think he would abandon the Dualism argument as unsolvable, or would he double down on the need for empirical metaphysics to ground ethics? Is the 'Sidgwickian' move to look for data outside philosophy still a live option?"
