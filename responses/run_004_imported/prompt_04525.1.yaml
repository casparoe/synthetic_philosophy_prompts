answer: |-
  **The Cosmos of Duty**

  The gaslight hissed, a serpent in the corner, but Professor Thorne had ordered it turned low. He sat at the mahogany table, his hands resting palms-down on the wood, feeling the grain through his kid gloves. Opposite him sat Mrs. Gable. She was not what he expected; there were no velvet drapes over her head, no theatrical robes. She wore a plain black dress, her hair pulled back severely, looking less like a conduit for the dead and more like a governess awaiting dismissal.

  Thorne opened his notebook. The leather was worn smooth at the corners. On the first page, written in his own precise hand, was the axiom that had haunted him for twenty years: *If the Cosmos of Duty is to remain a Cosmos and not a Chaos, the rational claims of Self-Interest and Benevolence must coincide.*

  They did not coincide in this life. He knew that. He saw good men starve and tyrants dine on silver. The only variable that could balance the equation was Time. An infinite time. A survival of the self.

  "Are we ready, Professor?" Mrs. Gable asked. Her voice was flat.

  "Proceed," Thorne said. He picked up his pen. "Please place your feet on the footrest. I will verify the position."

  He leaned down, the pen tucked behind his ear. This was the burden of the Society. To believe, one had to first disbelieve. To find the miracle, one had to hunt for the thread, the lever, the confederate. He was a butcher of hope, dissecting every phantom in the service of finding one that could withstand the knife. He checked her shoes. He ran a hand along the table leg. He noted the time: 8:14 PM.

  The room settled into silence. Thorne watched his own hand. He wanted it to be lifted. He wanted the cold touch of a finger that was not flesh. If that happened, the mathematics of morality would resolve. Virtue would be an investment, not a sacrifice.

  A knock came from the center of the table. *Tap. Tap-tap.*

  Thorne did not flinch. He watched Mrs. Gable's knees. They were still. He watched her sleeves. They hung limp.

  "Ask," she whispered.

  "Is there a presence?" Thorne said. He felt foolish. He was a man of logic, of *The Methods of Ethics*, reduced to speaking into the dark like a child.

  *Tap.*

  "Can you identify yourself?"

  Silence. Then, a slow scrape of wood against wood. The table tilted, just an inch, under Thorne's left hand. He felt the shift in weight. His heart hammered against his ribs, a sudden, violent bird. This was it. The anomaly. The crack in the materialist wall.

  He looked down. In the gloom, beneath the heavy drape of the tablecloth, he saw a shadow move near Mrs. Gable's right foot. A knee shifting? A lever engaging?

  He had to know. If it was fraud, he had to record it. To let it stand as truth would be to poison the well he was trying to drink from. If the evidence was corrupt, the conclusion was worthless. He needed the afterlife to be real, but he needed the proof to be cleaner than blood.

  "Mrs. Gable," Thorne said, his voice steady despite the trembling in his chest. "Your right foot. It left the rest."

  The medium did not deny it. She did not gasp or plead. She simply exhaled, a long, weary sound. "It does that, sometimes. When the pressure is high."

  "Then the phenomenon is compromised," Thorne said. He reached for his notebook.

  "Professor," she said softly. "The table still moved. You felt it."

  Thorne's pen hovered over the paper. The ink gathered at the nib, a dark droplet threatening to fall.

  He felt the memory of the tilt. It had been substantial. But the foot had moved. Was the foot the cause, or was the foot a symptom of the strain? He could write *Fraud*. He could close the book. He could go home to his study and grade papers on utilitarianism, safe in the knowledge that he was a rigorous man. The Chaos would remain. Duty would remain a burden without a guarantee.

  Or he could write *Inconclusive*.

  He looked at Mrs. Gable. She looked exhausted, her eyes hollowed out by the same scrutiny he applied to himself. She was a vessel, and he was the sieve.

  "If I record this as genuine," Thorne said, "and you are deceiving me, I undermine the entire inquiry. If I record it as fraud, and you are not, I deny the only hope I have."

  "Then record what you saw," she said. "Not what you fear."

  Thorne looked at the droplet of ink. It fell, staining the page a small, black circle. A period. An end. Or a pupil, looking back.

  He wrote: *8:22 PM. Table movement observed. Source of kinetic energy indeterminate. Subject's foot position compromised, but correlation not established.*

  He did not write *Fraud*. He did not write *Spirit*.

  "Will you come back?" Mrs. Gable asked, as he stood to leave.

  Thorne closed the notebook. The weight of it in his hand was the weight of the question. He had spent two decades hunting for a ghost that would save morality from suicide. He had found a thousand tricks and a handful of mysteries. The ratio was unchanged tonight.

  "I shall review the notes," Thorne said, buttoning his coat against the chill of the room. "The Society meets on Tuesday."

  He walked out into the London fog. The gas lamps outside were blurred halos in the mist. He walked toward home, toward the fire and the silence of his study. He knew, with the cold certainty of a philosopher, that he would likely never know. He would die with the equation unbalanced.

  But as he walked, he kept his hand in his pocket, touching the leather cover of the notebook. He had not solved the dualism. He had not found the Cosmos. But he had not closed the book. He walked on into the dark, carrying the small, heavy hope that the Chaos was merely a pattern he had not yet learned to read.
