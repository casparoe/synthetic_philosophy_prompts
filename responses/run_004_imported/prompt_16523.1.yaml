answer: |-
  **Title:** The Coin and the Counterfactual
  **Characters:**
  *   **KAI:** Proponent of the Kelly Criterion and ergodicity economics.
  *   **EVAN:** Proponent of standard Expected Value maximization.

  **Setting:** A seminar room, late afternoon. A biased coin (60% Heads) sits on the table. Both students have a stake of $1,000. They are allowed to bet on as many rounds as they like.

  ***

  **EVAN:** (Sliding $800 forward) Alright. Eighty percent. The math is simple: every dollar I bet returns $1.20 on average. If I bet less, I'm leaving money on the table.

  **KAI:** (Sliding $200 forward) And I'm betting twenty percent. Kelly fraction. $p - q$. Sixty minus forty.

  **EVAN:** I know the formula, Kai. But the Kelly Criterion only maximizes *expected logarithmic wealth*. That's just expected utility theory with a specific function smuggled in. Why should I care about the log? I care about the dollars. The arithmetic expectation of my wealth after $N$ rounds is maximized by betting everything, every time.

  **KAI:** The arithmetic expectation is a fiction. It's an ensemble average. It tells me what happens if a thousand different Evans bet once. But I'm one Kai betting a thousand times. I live in time, not in a multiverse.

  **EVAN:** That sounds poetic, but it's not decision theory. Rationality is about maximizing the good. If there's a 60% chance I double my money and a 40% chance I lose my stake, the expected value is positive. To say I shouldn't maximize that is to say I'm risk-averse. And I'm not. I'm risk-neutral.

  **KAI:** It's not about risk aversion. It's about dynamics. Look at the trajectory. If you bet 80% every round, your wealth is multiplied by 1.8 on heads and 0.2 on tails. The geometric mean of that return is $\sqrt{1.8 \times 0.2} \approx 0.6$. Your wealth shrinks by 40% every two flips, on average. If you keep playing, you go to zero with probability one.

  **EVAN:** "Probability one" in the limit. But the limit is never reached. I might hit a huge streak early and cash out. The expected value of my final wealth is astronomical, even if the *median* outcome is ruin. You're privileging the median over the mean. Why is the typical path more "rational" than the average outcome?

  **KAI:** Because the average outcome requires counterfactuals that don't exist for me. If I go broke, I can't access the branches where I got rich. Ergodicity is broken. The time-average growth rate is the only thing that actually compounds. Maximizing the time-average is mathematically equivalent to maximizing expected log wealth, but it doesn't require assuming a "log utility function." It just requires assuming I want to survive the process.

  **EVAN:** But "survival" is a constraint, not a goal. If I have a finite horizon—say, ten bets—I can calculate the exact EV for any fraction. And for ten bets, the EV-maximizing strategy is still way higher than Kelly. You're treating a finite game like an infinite one.

  **KAI:** Even in finite games, over-betting Kelly sacrifices growth rate for skew. You're buying a lottery ticket with a negative median return. But look, it goes deeper than betting. This is about *geometric rationality*.

  **EVAN:** Here we go.

  **KAI:** No, listen. In bargaining theory, the Nash Bargaining Solution maximizes the product of the players' gains. That's a geometric mean. It's the same structure. When we reason under uncertainty, or negotiate with others, we're dealing with multiplicative dynamics. Resources compound. Influence compounds. Treating them as additive—like standard EV does—is a category error.

  **EVAN:** That's a stretch. Nash bargaining is about cooperative game theory and Pareto optimality among *agents*. This is a coin toss against *nature*. The fact that the math looks similar doesn't mean the ontology is the same. In bargaining, the product matters because of axioms about symmetry and independence. Here, you're just scared of ruin.

  **KAI:** I'm not scared. I'm respecting the math of non-ergodic processes. If you treat multiplicative processes as additive, you get Dutch-booked by time. You'll pay to enter a game that makes you poorer.

  **EVAN:** I'll pay to enter a game that makes me richer *on average*. If I run this strategy across a portfolio of a thousand independent clients, I make a fortune. The fact that any *single* client goes broke is a tragedy, but it's not irrational. It's just variance.

  **KAI:** But you aren't a portfolio. You're a single agent. If rationality is about guiding action for an agent, it has to respect the agent's continuity through time.

  **EVAN:** And if rationality is about doing the most good, it has to respect the magnitude of the outcomes. If there's a one-in-a-million chance I save the world with my winnings, the EV dominates, even if I die 99.9% of the time. Your geometric rationality cuts off the tail.

  **KAI:** And your arithmetic rationality ignores the cliff.

  *(Evan picks up the coin. Kai adjusts their stack.)*

  **EVAN:** So we're at an impasse. You think I'm confusing ensemble averages for time averages.

  **KAI:** And you think I'm smuggling a survival constraint into the definition of rationality and calling it "geometry."

  **EVAN:** Basically. Ready to flip?

  **KAI:** Always. Just don't ask me for a loan when you hit your tenth tail.

  **EVAN:** Don't worry. If I win big, I'll hire you to manage the risk.

  *(Evan flips the coin. It spins in the air.)*

  **[END]**
