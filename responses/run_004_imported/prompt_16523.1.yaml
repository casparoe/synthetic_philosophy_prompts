  2.  **Determine the Setup:**
      *   *The Bet:* 60% heads, win doubles stake (1:1 odds), lose costs stake.
      *   *Kelly Fraction:* $f^* = p - q/b$. Here $p=0.6$, $q=0.4$, $b=1$ (win 1 unit per 1 unit bet). So $f^* = 0.6 - 0.4 = 0.2$. Kelly bets 20%.
      *   *EV Strategy:* To maximize arithmetic mean, you bet everything (100%). Why? Because $0.6 \times 2 + 0.4 \times 0 = 1.2 > 1$. Every dollar bet returns $1.20 on average.
