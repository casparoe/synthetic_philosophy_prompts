answer: |-
  Welcome to the fold! It is always a pleasure to see a scientist turn their critical eye toward metaphysics. You have spotted a tension that lies right at the heart of the philosophy of probability, and your physics intuition is spot-on regarding the standard picture: classically, the world is deterministic, and "chance" looks like ignorance. In quantum mechanics (assuming a collapse interpretation), chance looks ontic.

  However, the reason there is a massive literature on the Principal Principle (PP)—and why it isn't just "defer to the Born rule"—comes down to three main points. You are missing neither the physics nor the logic, but rather the *philosophical stakes* regarding what "chance" is actually supposed to *do*.

  Here is what you are missing, broken down by why the literature is so voluminous.

  ### 1. The Functionalist Turn: What does "Chance" do?
  You are defining chance by its **source** (indeterministic physics). David Lewis and many subsequent philosophers define chance by its **role**.

  For Lewis, objective chance is whatever feature of the world plays the "chance role." And what is that role? It is precisely what the Principal Principle describes: *Objective chance is that thing which constrains rational credence.*

  If you treat a coin flip as deterministic, you are right that the probability is epistemic (based on ignorance of initial conditions). But consider Statistical Mechanics (SM). As you know, SM probabilities are derived from phase space volumes relative to a measure (usually Lebesgue). Philosophers of physics like David Albert and Barry Loewer argue that even in a deterministic universe, SM probabilities are not merely subjective ignorance. Because of the "Past Hypothesis" (the low-entropy boundary condition of the early universe), these probabilities are grounded in the actual history and dynamics of the world.

  For an agent embedded in that world, SM probabilities function *exactly* like objective chances. They guide belief, they explain frequencies, and they support counterfactuals. If the PP is the bridge between metaphysics (chance) and epistemology (credence), we need to know if it applies to SM probabilities. If it does, the PP is not just about QM; it's about how any physically grounded probability guides rational belief, deterministic or not.

  ### 2. The "Undermining" Problem (The Real Headache)
  This is the single biggest reason for the literature. Lewis himself discovered a logical tension between the Principal Principle and his own preferred metaphysics, **Humean Supervenience**.

  Humean Supervenience roughly says: The world is just a vast mosaic of local matters of particular fact. Laws and chances are just summaries of that mosaic (the "Best System" analysis).

  Here is the problem Lewis found:
  1.  According to Humean Supervenience, the objective chance of an event is determined by the *entire* history of the world (past, present, and future), because the "Best System" depends on the total pattern of events.
  2.  Therefore, future events can determine present chances.
  3.  But the Principal Principle says your current credence should match the current chance.
  4.  If a future event could alter the present chance, then having credence in the present chance creates a paradox where you are certain of something that, if true, would make the chance different.

  Lewis called this **"Undermining."** He realized the PP, as originally stated, was logically inconsistent with Humean Supervenience. The literature exploded because philosophers have spent decades trying to fix the PP (modifying it to the "New Principal Principle," etc.) to solve this logical puzzle. This has nothing to do with QM vs. Classical mechanics; it is a problem about the logic of chance itself.

  ### 3. Even QM Chance is Contested
  You mentioned that objective chance is "really only a thing in quantum mechanics." As a physicist, you know that is interpretation-dependent.
  *   **Copenhagen:** Yes, objective chance.
  *   **Bohmian Mechanics:** Deterministic. Chance is epistemic.
  *   **Many Worlds (Everett):** Deterministic. "Chance" becomes a measure of branch weight, but whether that functions as genuine objective chance is a massive debate (the "Incoherence Problem").

  If the PP is just "defer to the Born rule," then the PP is false in a Bohmian or Many Worlds universe. But philosophers want a principle of rationality that holds regardless of which physical theory turns out to be true. They want to know: *If* there is objective chance (whatever its physical source), *how* should it guide belief?

  Furthermore, if Many Worlds is true, and there is no objective chance, does the PP collapse? Or do we need a "quasi-credence" principle? The literature explores how to maintain rational norms even if the metaphysics of chance shifts.

  ### Summary: Why it's not trivial
  You aren't missing a physics fact; you are encountering a metaphysical distinction.

  1.  **It's not just QM:** Philosophers argue that "special science" probabilities (thermodynamics, biology, economics) might satisfy the PP even if the underlying physics is deterministic.
  2.  **It's logically broken:** Lewis broke his own principle with the "Undermining" argument. Fixing the logic is a major industry in metaphysics.
  3.  **It's about Rationality, not Physics:** The PP is a normative claim about reasoning. Even if the Born rule is the only *physical* source of chance, the philosophical work is explaining *why* rational agents should care about physical probabilities at all. (This is known as the "Normativity of Chance").

  **The Verdict:**
  You are right that if you take a hardline realist view of classical mechanics and a Copenhagen view of QM, the *extension* of the Principal Principle is mostly limited to quantum events.

  But the *intension* (the concept itself) is much broader. The literature exists because philosophers are trying to figure out how physical facts constrain rational minds, and it turns out that linking "what is out there" (chance) to "what is in here" (credence) is logically treacherous, regardless of whether the source is a coin, a gas molecule, or an electron.

  Since you enjoyed Lewis, you might appreciate **Hans Reichenbach** (who tried to ground probability in frequency limits) or **Bas van Fraassen** (who is more skeptical about objective chance). But if you want to see the "Undermining" problem discussed in a way that respects the physics, look up **David Albert's *After Physics***. He bridges that gap between the statistical mechanics you know and the metaphysics Lewis was wrestling with.

  Enjoy the reading! It is rare to find someone who can spot the physical assumptions underlying metaphysical arguments so quickly.
