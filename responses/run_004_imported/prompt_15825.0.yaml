prompt: |-
  Retired chemist here - only got properly into philosophy after I shut the lab down, and lately I've fallen down a rabbit hole reading old LessWrong posts on decision theory. Everyone seems to use "updateless decision theory" (UDT) and Yudkowsky's "timeless decision theory" (TDT) almost interchangably, like they're the same idea under different branding, but that doesn't feel right to me. Could you spell out precisely where the two actually diverge, using the counterfactual mugging case (Omega flips a coin, demands $100 from you on tails, would've handed over $10,000 on heads if you're the type who pays) to make it concrete - does TDT genuinely pay up there on its own terms, or does it only get the right answer by quietly smuggling in the "updateless" move? And overall, which of the two do you think is the more defensible theory once cases like that are on the table?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired chemist, new to philosophy but deeply engaged with LessWrong (LW) rationality community material. This means they have a scientific mindset, value precision, likely understand probability and logic well, but might be wary of hand-wavy metaphysical claims. They've noticed a conflation of terms (UDT vs. TDT) and want clarity.
      *   **Core Question:** What is the precise divergence between Updateless Decision Theory (UDT) and Timeless Decision Theory (TDT)?
      *   **Specific Test Case:** Counterfactual Mugging (Omega flips a coin, tails = pay $100, heads = get $10,000 *if* you would have paid on tails).
      *   **Specific Sub-question:** Does TDT actually pay up in Counterfactual Mugging on its own terms, or does it need to "smuggle in" updatelessness?
      *   **Evaluation:** Which theory is more defensible?

  2.  **Deconstruct the Theories (TDT vs. UDT):**
      *   **TDT (Timeless Decision Theory):** Developed by Eliezer Yudkowsky. Key idea: Decide as if you are controlling the output of your decision algorithm, which is logically correlated with other instances of that algorithm (or simulations of it). It updates on observations *before* computing the decision. It treats logical dependencies as causal links in a causal graph (Pearlian causality extended to logical nodes).
      *   **UDT (Updateless Decision Theory):** Developed by Wei Dai. Key idea: Choose a policy (a mapping from observations to actions) *before* receiving any observations. Do not update on observations when evaluating expected utility; instead, condition the policy on the observation. It maximizes expected utility over the prior probability distribution of all possible worlds.

  3.  **Analyze the Counterfactual Mugging Case:**
      *   **Scenario:** Omega flips a fair coin.
          *   Heads: Omega gives you $10,000 *if* it predicts you *would have* paid $100 on Tails.
          *   Tails: Omega asks you for $100. (You know the coin is Tails now).
      *   **The Crux:** When you are on Tails, you know the coin is Tails. The Heads world is counterfactual.
      *   **CDT (Causal Decision Theory):** Doesn't pay. Your action now can't causally affect the past coin flip or the Heads outcome.
      *   **EDT (Evidential Decision Theory):** Doesn't pay (usually). Your action is evidence of your type, but since the coin is already flipped and known to be Tails, the correlation doesn't help you in *this* branch.
      *   **TDT:** This is the contentious point. TDT updates on the observation "Coin = Tails". Once updated, the probability of Heads is 0. Therefore, the expected utility of paying is -$100. The expected utility of not paying is $0. TDT *fails* Counterfactual Mugging *if* it updates on the coin outcome before deciding.
      *   **UDT:** UDT decides on a policy *before* knowing the coin outcome. Policy: "If Tails, Pay." Expected Utility (from prior): 0.5 * ($10,000) + 0.5 * (-$100) > 0. So UDT commits to paying. When it actually encounters Tails, it executes the pre-committed policy.

  4.  **Address the "Smuggling" Accusation:**
      *   The user asks if TDT only gets the right answer by smuggling in updatelessness.
      *   *Correction:* TDT *doesn't* get the right answer in Counterfactual Mugging. That's actually one of the main motivations for UDT. TDT handles Newcomb's Problem and Prisoner's Dilemma (with twins/clones) well, but fails cases where the correlation exists but the observation eliminates the branch where the reward is (like Counterfactual Mugging or Parfit's Hitchhiker).
      *   *Nuance:* Some proponents argued TDT could handle it if the "logical node" included the coin flip, but standard TDT updates on sensory data. UDT explicitly forbids updating on sensory data for the purpose of policy selection.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's background (chemists like precision). Validate their intuition (they are right, TDT and UDT are *not* the same).
      *   **Core Distinction (The "Update" vs. "Policy"):**
          *   TDT: Update on observations -> Calculate best action based on logical correlations.
          *   UDT: Ignore observations for utility calc -> Choose best *policy* (function from obs to action) based on prior -> Execute action.
      *   **The Counterfactual Mugging Analysis:**
          *   Walk through the math.
          *   **TDT:** Sees "Tails". P(Heads) = 0. Paying costs $100 with no gain. Result: Don't Pay. (Failure).
          *   **UDT:** Considers prior (50/50). Policy "Pay if Tails" yields net positive. Result: Pay. (Success).
      *   **Addressing the "Smuggling" Question:**
          *   Clarify that TDT *fails* here. It doesn't smuggle anything; it just breaks. UDT was invented *because* TDT broke here.
          *   Mention that TDT works for Newcomb (where the observation doesn't rule out the reward branch).
      *   **Defensibility/Evaluation:**
          *   TDT is more intuitive (matches "acting in the moment").
          *   UDT is more robust (handles precommitment problems better).
          *   Current LW consensus: UDT (or FDT - Functional Decision Theory, which is the academic packaging of these ideas) is generally preferred for high-stakes acausal trade, but UDT has computational/complexity issues (logical uncertainty).
      *   **Tone:** Respectful, precise, avoiding excessive jargon where possible, but not dumbing it down (they read LW posts, they know the lingo).

  6.  **Refining the Technical Details (Self-Correction/Verification):**
      *   *Wait, does TDT definitely fail Counterfactual Mugging?* Yes, standard TDT updates on the coin flip. Yudkowsky has acknowledged this limitation. This is why UDT was proposed by Wei Dai.
      *   *Is FDT relevant?* Yes, Functional Decision Theory (Yudkowsky & Soares, 2017) is the formalized successor that encompasses UDT-like behavior. I should mention it as the "modern synthesis."
      *   *Chemist Analogy:* Maybe use a reaction pathway analogy? TDT is like optimizing a step after seeing the intermediate; UDT is like optimizing the whole synthesis route before starting. That might resonate.

  7.  **Final Polish:**
      *   Ensure the distinction between "action" (TDT) and "policy" (UDT) is sharp.
      *   Make sure the Counterfactual Mugging math is clear.
      *   Answer the "which is defensible" part honestly (UDT is theoretically superior but computationally nightmare-ish).

  8.  **Constructing the Output:** (Mental outline of the response)
      *   Greeting & Validation.
      *   The Fundamental Split: Action vs. Policy.
      *   The Counterfactual Mugging Breakdown (TDT fails, UDT succeeds).
      *   Why TDT Fails (The Update).
      *   Why UDT Succeeds (The Prior).
      *   The "Smuggling" verdict (No, TDT just loses).
      *   Defensibility (UDT wins on consistency, TDT wins on tractability).
      *   Mention FDT as the current state-of-the-art.

  9.  (Self-Correction during drafting): Be careful not to say TDT is "wrong" in all cases. It beats CDT in Newcomb. Just specific cases like Counterfactual Mugging.
      *   Also, clarify that "Updateless" doesn't mean "ignoring information." It means "not updating the *prior* used for the decision calculation," but using the info to select the branch of the policy.

  10. **Final Review against constraints:** Precise? Yes. Counterfactual Mugging used? Yes. TDT vs UDT divergence clear? Yes. Defensibility assessed? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Welcome to the philosophical side of the bench. It is a pleasure to speak with someone who appreciates precision; the conflation of TDT and UDT is a common source of confusion, even among regulars in the rationalist sphere. Your intuition is correct: they are not the same theory, and the distinction is not merely branding.

  As a chemist, you might think of the difference this way: **TDT optimizes a reaction step given the current intermediate; UDT optimizes the entire synthesis pathway before adding the first reagent.**

  Here is the precise divergence, using Counterfactual Mugging as the assay.

  ### 1. The Core Divergence: Action vs. Policy

  The fundamental mathematical difference lies in *when* the probability distribution is updated relative to the decision calculation.

  *   **TDT (Timeless Decision Theory):** You observe your environment, **update** your probabilities based on that observation, and then choose the **action** that maximizes expected utility given the logical correlations of that action.
      *   *Input:* Observation $O$.
      *   *Process:* Update $P(World | O)$. Calculate $EU(Action | O)$.
      *   *Output:* Best Action $A$.

  *   **UDT (Updateless Decision Theory):** You ignore the specific observation for the purpose of the utility calculation. Instead, you choose a **policy** (a function mapping observations to actions) that maximizes expected utility relative to your **prior** probability distribution. You then execute the action dictated by that policy for your current observation.
      *   *Input:* Observation $O$ (used only to index the policy).
      *   *Process:* Maximize $EU(Policy)$ using Prior $P(World)$.
      *   *Output:* Best Policy $\pi$, then execute $A = \pi(O)$.

  ### 2. The Counterfactual Mugging Assay

  Let's run the numbers. Omega flips a fair coin ($P=0.5$).
  *   **Heads:** Omega gives you $10,000 *if* it predicts you would pay on Tails.
  *   **Tails:** Omega asks you for $100.

  You are currently standing in the **Tails** branch. You know the coin is Tails.

  #### How TDT Processes This
  TDT says: "I observe the coin is Tails. I must update my probability distribution."
  *   $P(\text{Heads} | \text{Observed Tails}) = 0$
  *   $P(\text{Tails} | \text{Observed Tails}) = 1$

  Now TDT calculates the expected utility of paying vs. not paying *in this specific state*:
  *   **Pay:** Cost $100. Reward $0 (because Heads probability is now 0). Net: $-\$100$.
  *   **Don't Pay:** Cost $0. Reward $0. Net: $\$0$.

  **TDT Result:** **Do Not Pay.**
  TDT fails Counterfactual Mugging. It leaves the $10,000 on the table because, from its perspective at the moment of decision, the world where the money exists has been logically ruled out by the observation.

  #### How UDT Processes This
  UDT says: "I do not update my prior for the decision calculation. I ask: What policy would I have committed to *before* the coin was flipped?"
  *   **Policy A (Always Pay):**
      *   50% Heads: Get $10,000.
      *   50% Tails: Lose $100.
      *   $EU = 0.5(10,000) + 0.5(-100) = \$4,950$.
  *   **Policy B (Never Pay):**
      *   50% Heads: Get $0.
      *   50% Tails: Lose $0.
      *   $EU = 0$.

  **UDT Result:** **Commit to Policy A.**
  When UDT finds itself in the Tails branch, it does not recalculate. It simply executes the pre-committed policy: "If Tails, Pay." It pays the $100.

  ### 3. Does TDT "Smuggle" the Updateless Move?

  You asked if TDT gets the right answer by quietly smuggling in updatelessness. The answer is **no**. TDT genuinely fails Counterfactual Mugging on its own terms.

  This failure was actually the primary motivation for Wei Dai to propose UDT. TDT handles Newcomb's Problem beautifully (because in Newcomb's, your observation of the boxes does not rule out the world where the money is there; the correlation is simultaneous). But in Counterfactual Mugging, the observation *eliminates* the reward branch.

  TDT proponents initially tried to patch this by arguing that the "logical node" should include the coin flip, but this stretches the definition of logical correlation. The consensus on LessWrong eventually shifted to acknowledge that **TDT is updateful**, and that updatefulness is a bug in cases involving acausal trade across counterfactuals. UDT was the fix that removed the update step entirely.

  ### 4. Which is More Defensible?

  This is where the philosophy gets sticky, and where your scientific background might chafe against the metaphysics.

  **The Case for UDT (Theoretical Robustness):**
  UDT is dynamically consistent. It never regrets its decision procedure. If you are a UDT agent, you never wish you had been a different kind of agent before the game started. It handles Parfit's Hitchhiker, Counterfactual Mugging, and Newcomb's Problem uniformly. It treats "logical possibility" with the same weight as "physical possibility."
  *   *Verdict:* If you want an agent that cannot be money-pumped and wins in all acausal coordination games, UDT is superior.

  **The Case Against UDT (Computational & Epistemic Nightmare):**
  UDT requires you to maximize expected utility over your **prior**. This implies you must have a well-defined prior over all possible logical truths and mathematical structures (logical uncertainty).
  *   As a chemist, you know you can't calculate the wavefunction of a protein directly; you need approximations. UDT requires solving problems that are computationally intractable (and arguably ill-defined) for any bounded agent. How do you assign a prior probability to a mathematical conjecture you haven't proven yet?
  *   TDT is more "natural" for bounded agents because it updates on sensory data, reducing the hypothesis space before computing.

  **The Modern Synthesis: Functional Decision Theory (FDT)**
  It is worth noting that Eliezer Yudkowsky and Nate Soares later formalized these ideas into **Functional Decision Theory (FDT)**. FDT is essentially the academic packaging of UDT. It frames the decision as selecting the *output of a decision function* rather than an action.
  *   FDT pays in Counterfactual Mugging (like UDT).
  *   FDT one-boxes in Newcomb (like TDT/UDT).
  *   FDT explicitly rejects the "update" step for the decision calculation.

  ### Summary Recommendation

  If you are looking for the **normatively correct** theory (what an ideal agent *should* do to maximize utility across all possible worlds), **UDT (or FDT)** is the defensible winner. TDT is a subset that works in many physical cases but breaks when counterfactuals are involved.

  However, if you are looking for a **descriptive** theory of how humans *should* reason given our cognitive limitations, TDT feels more intuitive because it respects the flow of time and information acquisition. But strictly speaking, your intuition was right: they are different, TDT fails the mugging, and UDT was invented specifically to clean up that mess.

  **The Bottom Line:** TDT updates on the coin flip and keeps its $100. UDT ignores the coin flip for the calculation, pays the $100, and would have collected the $10,000 in the counterfactual branch. In decision theory, the agent that ends up with more money (even counterfactually) is usually considered the winner. UDT wins.
