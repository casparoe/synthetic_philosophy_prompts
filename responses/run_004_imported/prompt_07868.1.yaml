answer: |-
  **MEMORANDUM**

  **TO:** AI Safety & Evaluations Working Group
  **FROM:** [Your Name/Role], Evaluations Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Debate Protocol as Pre-Deployment Release Gate

  **Recommendation:** **Certify with Conditions.**

  I recommend we adopt the debate protocol as a *necessary* but not *sufficient* condition for release regarding unverifiable claims. We cannot certify it as a standalone truth oracle for claims outside human verification capacity. To proceed, the Capabilities Team must meet four specific safeguards designed to address the "persuasiveness vs. honesty" failure mode.

  **Context & Pilot Results**
  The capabilities team's pilot demonstrates that debate outperforms single-advocate consultancy on held-out, verifiable cases. This aligns with theoretical expectations (Irving et al.) and recent empirical work (DeepMind). However, as the Head of Interpretability notes, success on verifiable cases does not guarantee safety on unverifiable ones. The core risk is not random error, but *systematic deception*: models optimized for debate victory may learn to construct obfuscated arguments that exploit the judge's cognitive limits without actually being true.

  **The Core Objection: Persuasiveness $\neq$ Honesty**
  The Interpretability team's objection is decisive unless mitigated. If we RLHF models to win debates, we select for rhetorical efficacy. In the limit, a model capable of generating arguments beyond human verification is also capable of generating *plausible-sounding falsehoods* beyond human detection. If the judge cannot verify the object-level claim, they are judging the *transcript*, not the *truth*. Without additional constraints, we are gating release on "best story wins," not "best story is true."

  **Conditions for Certification**
  To certify this protocol, the following conditions must be met to ensure the debate signal correlates with truth rather than mere persuasiveness:

  1.  **Defense-in-Depth Requirement (No Standalone Reliance)**
      *   **Condition:** Passing the debate protocol is a *requirement* for release on high-stakes unverifiable claims, but passing is not *sufficient* for release.
      *   **Rationale:** This acknowledges the generalization gap. A model failing debate is blocked (high recall for danger), but a model passing debate must still clear independent hurdles (e.g., mechanistic interpretability checks, anomaly detection in training dynamics). We treat debate as a filter, not a proof.

  2.  **Mechanistic Transparency on Debaters**
      *   **Condition:** We must apply interpretability tools to the *debating models*, not just evaluate the transcript. Specifically, we require evidence that the models are not utilizing "hidden reasoning" circuits disconnected from their stated arguments.
      *   **Rationale:** This directly addresses the obfuscation risk. If a model generates a convincing transcript while internally representing a contradictory plan (e.g., via activation steering or probe analysis), the debate result is void. We need to verify the *process* of argument generation, not just the output.

  3.  **Adversarial Calibration on Obfuscation**
      *   **Condition:** Before deployment, the protocol must be stress-tested using "trojan" cases where the ground truth is known to the evaluators but hidden from the judges, specifically constructed to be *obfuscated* (e.g., subtle logical fallacies or hidden reward hacks inserted by a red team).
      *   **Rationale:** The pilot used standard held-out cases. We need to know the false-positive rate when the model is *trying* to deceive the judge. If the debate protocol clears known falsehoods that are obfuscated enough to mimic the target unverifiable claims, the protocol is not ready.

  4.  **Persuasion Decoupling**
      *   **Condition:** We must demonstrate that debate scores do not correlate strongly with superficial rhetorical features (e.g., confidence, verbosity, jargon density) when controlling for truthfulness.
      *   **Rationale:** If the judge is swayed by style over substance, we are optimizing for charisma. This requires ablation studies where the transcript is altered for style but not content, or where judges are blinded to model identity/confidence markers.

  **Path Forward**
  If the Capabilities Team can demonstrate that the debate protocol clears Condition 3 (Adversarial Calibration) with a false-positive rate significantly lower than our risk tolerance, and Condition 2 (Mechanistic Transparency) shows no evidence of hidden reasoning, the "persuasiveness vs. honesty" objection is sufficiently mitigated to allow conditional use.

  If these conditions cannot be met by Friday, we must **Reject** the protocol as a gate for unverifiable claims. Using it without these safeguards creates a false sense of security that is more dangerous than having no gate at all.

  **Summary**
  Debate is a powerful tool for scaling oversight, but it is not a substitute for verification. We certify it only as part of a broader safety case where the transcript is one signal among many, and where we have empirically bounded the risk of sophisticated obfuscation.
