answer: |-
  The rain had been falling since dusk, blurring the window of Elias's study into a sheet of gray oil. Inside, the only light came from the laptop screen and the green LED of the router blinking rhythmically on the desk. On the screen, Marco was shouting over the sound of wind. He was three thousand miles away, in a coastal town where the levees had breached an hour ago.

  "I need the transfer, Elias, now," Marco said, water dripping from his hair onto the keyboard. "The boats are leaving at midnight. If I don't pay the fuel surcharge, they aren't taking the families."

  Elias's hand hovered over the checkbook. The pen felt heavy, the metal warm from his grip. He could see the desperation in Marco's eyes, the vivid, terrifying immediacy of the water rising behind him. Marco was real. Marco was bleeding, shivering, existing in the same *now* as Elias, merely separated by miles of ocean and curvature of the earth.

  "I'm doing it," Elias said. He wrote the figures, the ink soaking into the cotton paper. He tore the check out, the sound sharp in the quiet room. "Send me the account number again."

  Marco typed it into the chat box. Elias began to type the digits into the banking portal. His heart hammered against his ribs, a sympathetic resonance to the panic on the screen. This was what mattered. This was flesh and blood.

  When the transfer was confirmed, Marco's shoulders dropped. The tension left his face, replaced by a exhaustion that looked like age. "Thank you. You saved them. I'll tell them who sent the boat."

  "Stay dry, Marco," Elias said.

  "Always," Marco lied, and the screen went black as the connection died.

  Elias sat back, the silence of the study rushing back in to fill the void. He rubbed his face with both hands. The adrenaline was fading, leaving a hollow ache behind his eyes. He reached for the glass of water on his desk, but his elbow knocked a roll of blueprints. They unraveled across the desk, spilling over the edge of the wood and onto his lap.

  It was the specification sheet for the community hall he was funding in the valley. The foundation work was scheduled to begin next week.

  His finger traced the line item for the reinforcement steel. There were two options circled in red pencil by the contractor. Grade 40 was cheaper. Grade 60 was expensive. The difference in cost was exactly the amount he had just wired to Buenos Aires.

  Grade 40 would hold for thirty years. Maybe thirty-five. After that, the stress fractures would begin in the load-bearing walls. The corrosion would creep like rusted veins through the concrete.

  Elias looked at the date on the blueprint. Then he looked at the estimated lifespan.

  *Occupancy: Indefinite.*

  He imagined the hall in thirty years. He tried to picture who would be inside. Not specific people—he didn't know their names—but he knew they would be there. There would be children sleeping on cots during storm season. There would be elders sitting in the chairs near the vents. They would be just as real as Marco. They would breathe air, feel cold, fear the sound of cracking beams.

  But they were hidden. They were separated from him not by miles, but by seconds. Ten million minutes stood between Elias and the moment the roof would fail.

  He picked up the pen again. It was the same pen. The ink was the same.

  If he chose the cheaper steel, the money saved could fund three more rescue operations like tonight's. He could save three Marcos. But the hall would weaken. The people in the future would be unsafe.

  If he chose the expensive steel, the hall would stand for a century. The people in 2055 would be dry. But Marco's neighbors tonight might not get on the boats.

  Elias looked at the black screen of the laptop. He saw his own reflection superimposed over the dark glass—pale, tired, present. Then he looked down at the blueprint. He tried to summon the face of the person who would sit in that hall in 2055. He tried to feel the same tug in his chest he had felt when Marco shouted about the rising water.

  He closed his eyes and waited for the empathy to bridge the gap of time. He waited to feel the future child's fear as vividly as he felt Marco's.

  The room was silent. The rain tapped against the glass, a steady, indifferent rhythm.

  He opened his eyes. The future remained abstract, a sketch in blue ink. Marco was a memory of light and panic.

  Elias moved the pen to the contractor's copy. He circled Grade 40. He initialed the bottom corner.

  He told himself it was because the present suffering was certain, while the future failure was only probable. He told himself the math justified it.

  He capped the pen and set it down. It rolled slightly, coming to rest against the edge of the blueprint, pointing toward the date thirty years hence. Elias stood up and walked to the window. He pressed his hand against the cold glass, looking out into the dark yard where the oak trees swayed. He wondered who would stand in this room in 2055. He wondered if they would look at the ceiling and wonder why the builder had chosen to save them money instead of saving them safety.

  He turned off the desk lamp. The room plunged into darkness, save for the blinking green light of the router. It counted the seconds, one by one, marching steadily toward the people he had just decided not to see.
