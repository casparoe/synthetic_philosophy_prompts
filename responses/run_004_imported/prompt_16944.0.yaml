  8.  *(Mental Check of the "Direct Acquaintance" argument)*: The argument is that MFE applies when there is a gap between the evidence and the fact. In self-knowledge, the evidence *is* the fact. Williamson's rebuttal is that the *concept* applied to the fact introduces the gap. I need to make sure this dialectic is clear.

  9.  *(Final Plan for Conclusion)*: Reiterate that Williamson successfully externalizes knowledge, but at the cost of making the mind less transparent than Descartes hoped. The KK principle must be abandoned as a general norm, though a shadow of it remains in phenomenology.

