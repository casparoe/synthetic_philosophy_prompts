answer: |-
  Here is a brief arguing for the informational externality diagnosis, pitched at the level of a doctoral reading group in economics.

  ***

  ### The Market for Signals: Why Information Cascades Are Externalities, Not Irrationalities

  The diagnosis of information cascades as a "failure of collective rationality" or a "breakdown of the wisdom of crowds" is a category error. It conflates *social suboptimality* with *individual irrationality*. While the outcome of a Bikhchandani–Hirshleifer–Welch (BHW) cascade is indeed socially inefficient relative to a full-information benchmark, the mechanism generating this outcome is not a cognitive breakdown or a violation of Bayesian norms. It is a canonical pecuniary externality arising from the non-excludability of information embedded in actions.

  To label the cascade a form of collective irrationality is to misunderstand the constraints of the sequential decision problem. The agents are not failing to reason; they are reasoning correctly within an institutional structure that fails to price the social value of private information. The "fragility" of cascades and the distinction from reputation-driven herding models do not undermine this view; they provide the strongest evidence for it.

  #### 1. The Category Error: Social Welfare vs. Individual Rationality
  The argument for "collective irrationality" typically leans on a comparison with the Condorcet Jury Theorem (CJT). In CJT, independent agents voting on a state of the world converge to the truth almost surely as $N \to \infty$. In BHW, the probability of error remains strictly positive. The critic sees this divergence as a failure of the collective epistemic machinery.

  However, the CJT benchmark is inappropriate because it assumes actions (votes) are costless signals decoupled from payoff consequences. In the BHW setup, actions are *decisions* with direct payoff implications. An agent $t$ maximizes $E[u(a_t, \theta) | h_t, s_t]$, where $h_t$ is the history of actions. Once the public likelihood ratio exceeds the bound of the private signal precision, the marginal expected utility of following the private signal becomes negative relative to following the public history.

  For agent $t$ to act on $s_t$ against the cascade would require them to incur a private expected loss to generate a social gain (information revelation for $t+1, t+2, \dots$). In the absence of a transfer mechanism—a market for signals—ignoring the private signal is the unique Bayesian Nash Equilibrium strategy. To call this "irrational" is to imply agents *should* maximize social welfare rather than private utility. In economic terms, this is not irrationality; it is an **informational externality**. The agent captures the full cost of deviating from the crowd but captures none of the benefit of the information revealed to downstream agents. The "failure" is structural (missing markets), not cognitive.

  #### 2. Fragility as Evidence of Signal Suppression
  A common counter-argument is that cascades are "fragile"—they can be overturned by an arbitrarily small amount of new public information (e.g., a slight shift in the public prior or a verified signal). Critics sometimes suggest this instability implies the collective belief is ill-founded or "irrational."

  On the contrary, fragility is the smoking gun of the externality diagnosis.

  In a robust aggregation process (like CJT), the weight of evidence grows linearly with $N$. In a cascade, the public belief $\mu_t$ stops updating once the cascade begins. Because private signals are bounded, there exists a threshold for the public likelihood ratio beyond which no finite sequence of private signals can overturn the public weight *unless* those signals are actually revealed. But because agents stop acting on their signals, the public pool stops accumulating weight.

  The cascade rests on a finite accumulation of evidence, not an infinite one. It is fragile precisely because the "wisdom of the crowd" has been **turned off**. The agents downstream are not adding their weight to the scale; they are merely echoing the weight already present. If the cascade were the result of genuine collective reasoning where everyone contributed, it would be robust. Its fragility proves that the informational content of the population is being suppressed. This confirms the externality story: agents are withholding the "public good" of information because the private cost of provision is too high. The fragility does not indicate that the agents are reasoning poorly; it indicates that the epistemic commons has been depleted because no one is incentivized to replenish it.

  #### 3. Distinction from Scharfstein–Stein (Reputation Herding)
  It is crucial to distinguish this informational externality from the reputation-driven herding found in Scharfstein and Stein (1990). In S-S models, fund managers mimic each other to signal high ability to the labor market. They herd because deviating risks being identified as low-ability, even if their private information suggests the deviation is profitable.

  The BHW cascade is fundamentally different in three ways that reinforce the externality view:

  1.  **Payoff Relevance:** In BHW, utility depends solely on matching the action to the state $\theta$. In S-S, utility depends on the market's posterior belief about the agent's *type*. BHW agents do not care about being perceived as smart; they care about being *right*.
  2.  **Informational Content:** In S-S, herding can occur even if information is fully revealed, because the correlation in signals among "smart" types makes mimicry optimal for signaling. In BHW, the herding is *purely* a result of information masking. If you could compel agents to reveal $s_t$ without forcing the action $a_t$, the cascade would vanish immediately.
  3.  **Efficiency:** In S-S, the herding is a distortion caused by career concerns (a agency problem). In BHW, the behavior is first-best optimal *for the agent* given the observation structure. The inefficiency arises solely because the action $a_t$ is a noisy signal of $s_t$.

  Conflating BHW with S-S obscures the specific epistemic failure in BHW. S-S is about incentive compatibility in signaling games; BHW is about the limits of social learning when actions are the only observable channel. The BHW failure is not that agents are posturing (S-S); it is that the channel capacity of an action is insufficient to convey the nuance of the private signal once the public history becomes dominant.

  #### 4. Conclusion: A Design Problem, Not a Mind Problem
  To diagnose the BHW cascade as a "breakdown of rationality" is to psychologize a structural constraint. The agents are perfect Bayesians. The "irrationality" exists only if one assumes the collective ought to behave as a single utility-maximizing entity, which is a category error in methodological individualism.

  The cascade is a **failure of information provision**, not information processing. The fragility of the cascade confirms that the public stock of knowledge is stagnant, and the distinction from reputation models confirms that this stagnation is driven by payoff-relevant incentives rather than career concerns.

  Therefore, the correct policy prescription follows from the diagnosis. If this were a cognitive bias, we would train agents to think better. Since it is an externality, the solution is institutional: we must design mechanisms that subsidize the revelation of private information (e.g., prediction markets, deliberative forums where signals are cheap-talk prior to action, or contracts that reward contrarian accuracy). The "wisdom of crowds" does not break down because crowds are stupid; it breaks down because the institutional design allows early movers to exhaust the informational value of the public history without compensating downstream agents for the loss of their independent contribution.
