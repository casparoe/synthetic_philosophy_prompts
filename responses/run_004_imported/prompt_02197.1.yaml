      *   **Carens (Open Borders/Cosmopolitan):** Kant grounds the right in *common possession of the earth*. This is a strong cosmopolitan premise. The constraint against turning someone away to their death is a significant humanitarian limit. Carens can argue Kant didn't go far enough given modern globalization (the "globe" argument is even stronger now).
      *   **Synthesis:** It's a "middle ground" text. It validates the *claim* to cross borders but validates the *right* to refuse settlement. It's perfect for showing students that the tension isn't new.

