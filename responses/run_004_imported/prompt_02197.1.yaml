      *   **Key Concept:** *Weltbürgerrecht* (Cosmopolitan Right).
      *   **Key Distinction:** *Gastrecht* (Right of a Guest) vs. *Besuchsrecht* (Right of a Visitor/Stranger).
      *   **Grounding:** Common possession of the earth's surface (*communio fundi originaria*).
      *   **Constraint:** Cannot turn away if it causes death.
      *   **Limit:** Right to *present oneself* (attempt interaction), not to *settle* permanently without agreement.

  3.  **Address Question 1: Principled Rationale for the "Thin" Right:**
      *   *Why not residence?* Kant distinguishes between *cosmopolitan right* and *civil right* (state citizenship).
      *   *Sovereignty:* Kant is a statist regarding internal sovereignty. States are moral persons. To grant a universal right of residence would undermine the state's ability to form a civil condition (*status civilis*).
      *   *Property:* Original common possession is negative (no one has *more* right initially), not positive (everyone owns everything jointly). It justifies interaction, not appropriation.
      *   *Peace:* Unlimited migration could lead to conflict. Hospitality is a condition for *possible* peace, not a guarantee of integration.
