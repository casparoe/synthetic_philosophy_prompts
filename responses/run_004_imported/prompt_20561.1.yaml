prompt: |-
  So in my AP Comp Sci class we went on a tangent about Turing machines and my teacher brought up the Church-Turing thesis, and me being me I went down a rabbit hole reading about it that night instead of doing the actual homework lol. Here's what's bugging me: every explanation I find says it's a "thesis" not a "theorem" and can never be proven because "computable" isn't a rigorous mathematical idea until you've already defined it via Turing machines or recursive functions, so your basically comparing a fuzzy thing to a precise thing forever and that gap can never close. Fine, ok. But then I read that Godel wasn't actually convinced by Church's original version of the thesis (the recursive-functions one) and thought it was kind of weak as an argument, but when Turing came out with his version (the one where you imagine a human "computer" following dead simple rules with only finitely many mental states and a limited field of view) Godel basically said that one was actually convincing, like close to a real proof. Which confuses me — if Turing's argument is basically a proof and Church's is more like an educated guess that happens to land on the same answer, in what sense is it one "Church-Turing thesis" at all and not two different things that got taped together under one name because they happened to be equivalent?

  What I'm actually hoping you can do is explain what kind of claim the thesis really is once you take that Church vs Turing gap seriously — is it basically a mathematical conjecture that's just brutally hard to prove, an empirical claim about physics or the brain that could in principle get falsified (like if someone built a "hypercomputer" or physics turned out to allow it), or is it secretly more like a definition/convention we're just choosing to adopt, dressed up to look like a discovery? And does Turing's more careful argument actually shift things closer to "proven," or is that overselling what he did? I've read the one-liner "it's a thesis not a theorem because computability isn't formally defined" like five times now and it's not clicking for me on a deeper level, so if you could actually walk through the gears turning underneath that sentence instead of just restating it, that'd be great.
