      *   *Explain the Nature/Spirit Distinction:* Clarify that for Hegel, Spirit *emerges* from Nature. It doesn't float above it. The "separation" isn't spatial; it's categorical.
      *   *The "Sublation" (Aufhebung) Argument:* This is the core. Hegel isn't saying war *isn't* natural; he's saying the State *takes* the natural necessity of finitude and makes it a conscious ethical act. The ocean moves because of wind/pressure gradients (blind). The State moves because of Sovereignty (willed). The *result* (freshness/health) is the same, but the *cause* is what matters for the "Freedom" claim.
      *   *The Role of the Analogy:* The analogy explains the *function* (preservation of health), not the *ontology* (what war *is*). He uses the ocean to explain *why* peace corrupts, not to prove war is natural.
