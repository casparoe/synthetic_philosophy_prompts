prompt: |-
  ok this has been living in my head for weeks and my reading group couldnt give me a straight answer either. I've been reading Oesterheld-style stuff on evidential cooperation in large worlds (ECL), and the argument is always framed in EDT terms -- you cooperate with the "portfolio" of values held by tons of causally disconnected agents because doing so is evidence that similarly-reasoning agents elsewhere are doing the same. But I don't see why this needs to be specifically evidential. Wouldn't a committed FDT/UDT agent land on the same cooperative policy, just cashed out via subjunctive dependence instead? Compare how an EDT agent and an FDT/UDT agent would each reason through the ECL setup, and tell me whether their verdicts actually diverge anywhere, or if "evidential" is just a naming artifact and the argument carries over fine to other decision theories.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Question:** Is Evidential Cooperation in Large Worlds (ECL) specific to Evidential Decision Theory (EDT), or does it apply equally to Functional/Updateless Decision Theory (FDT/UDT) via subjunctive dependence?
      *   **Context:** The user has been discussing this in a reading group without resolution. They've read Oesterheld-style arguments (likely *Cooperation in Large Worlds*, *Evidential Cooperation in Large Worlds*, etc.).
      *   **Specific Task:** Compare how an EDT agent and an FDT/UDT agent reason through the ECL setup. Determine if verdicts diverge or if "evidential" is just a naming artifact.
      *   **Tone:** Intellectual, rigorous, acknowledging the nuance (since reading groups struggled with it).

  2.  **Initial Assessment & Knowledge Retrieval:**
      *   *What is ECL?* It's the idea that in a vast (possibly infinite) universe, there are many agents similar to you. By acting cooperatively (e.g., respecting alien values), you provide *evidence* that similar agents elsewhere are respecting your values. This creates acausal trade.
      *   *EDT reasoning:* $P(\text{Outcome} | \text{Action})$. My action is evidence of their action. If I cooperate, it's more likely they cooperate.
      *   *FDT/UDT reasoning:* Focuses on logical/subjunctive dependence. My decision algorithm outputs $X$. Similar algorithms output $X$. Therefore, if I choose Cooperate, they choose Cooperate *because* we run similar algorithms, not just because of statistical correlation.
      *   *The Crux:* In standard Newcomb/Prisoner's Dilemma cases, EDT and FDT often agree (Cooperate), while CDT diverges (Defect). However, there are specific cases (like "Newcomb's Soda" or "Medical Newcomb") where EDT and FDT diverge. Does ECL fall into the "Agree" bucket or the "Diverge" bucket?
      *   *Oesterheld's View:* Caspar Oesterheld often frames it in EDT terms because it's simpler and avoids the metaphysical baggage of "subjunctive dependence." But does the *conclusion* hold for FDT?
      *   *Potential Divergence:* The divergence usually arises when there is a common cause that correlates actions without logical dependence. In ECL, the correlation is usually posited to arise from *similarity of origin/algorithm*. If the correlation is purely physical/statistical without logical connection, EDT cooperates, FDT might not. If the correlation is due to logical similarity, both cooperate.

  3.  **Structuring the Argument:**
      *   **Acknowledge the validity of the intuition:** The user is right to suspect that FDT/UDT should also support cooperation.
      *   **Define the Mechanism:** Clarify *why* EDT works (correlation as evidence) vs. *why* FDT works (logical identity/similarity).
      *   **The "Naming Artifact" Hypothesis:** Address whether "Evidential" is just historical framing. (Mostly yes, but with caveats).
      *   **Scenario Analysis (The Meat):**
          *   Case 1: Logical Twins (Standard ECL). Both EDT and FDT cooperate.
          *   Case 2: Common Cause without Logical Link (The Divergence Point). This is where the reading group might have gotten stuck. If the correlation is due to a shared environment but distinct algorithms, EDT cooperates, FDT defects.
      *   **Implications for "Large Worlds":** In a large world, logical twins are likely. But *mere* statistical similarity might not be enough for FDT.
      *   **Conclusion:** The verdicts *usually* align in the contexts Oesterheld cares about, but the *justification* differs, and there are edge cases where they diverge. "Evidential" isn't strictly necessary, but it's broader in one sense (accepts spurious correlations) and narrower in another (requires updating).

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Validate the user. It's a common confusion. The short answer is: In the standard ECL setup, they converge, but the *reasoning* differs, and there are niche cases where they diverge.
      *   *EDT Reasoning:* Focus on conditional probability. $P(\text{They Cooperate} | \text{I Cooperate})$ is high. Expected Utility calculation.
      *   *FDT/UDT Reasoning:* Focus on the decision algorithm. $Algorithm(Me) = Algorithm(Them)$. If I output C, they output C. It's not evidence; it's a logical constraint.
      *   *Where they Agree:* The "Twin" scenario. If the other agents are running sufficiently similar code, FDT sees a subjunctive link. EDT sees a statistical link. Both cooperate. This is the standard ECL pitch.
      *   *Where they Diverge (The Crucial Nuance):*
          *   *Spurious Correlation:* Imagine a "Cooperation Gene" or a environmental factor that makes us act alike but doesn't link our *decisions* logically.
          *   *EDT:* Still cooperates (Action is evidence of the gene, which is evidence of their action).
          *   *FDT:* Defects (My decision doesn't *cause* theirs via logic; the gene causes both).
          *   *Relevance to ECL:* In a large world, are the correlations logical or just physical? Oesterheld usually assumes logical/algorithmic similarity. If so, FDT works. If it's just "humans are similar," EDT might be too optimistic compared to FDT.
      *   *Updatelessness:* FDT/UDT is updateless. EDT updates on being the kind of agent who is in this situation. In ECL, does this matter? If I know I exist, do I update? UDT says "choose the policy before knowing which agent you are." This strengthens the ECL argument for FDT because it treats all copies as one optimization problem.
      *   *The "Evidential" Label:* Why is it called ECL? Historically, EDT was the first to formalize acausal trade (via Newcomb). FDT came later. Also, EDT is conceptually simpler for this specific argument (no need to define "subjunctive dependence").
      *   *Conclusion:* The argument carries over, *provided* the similarity is algorithmic. If the similarity is merely statistical, EDT is more "cooperative" (perhaps too much so) than FDT.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about UDT vs. FDT. UDT is the prior-based version. FDT is the subjunctive dependence version. They are closely related. I'll group them but acknowledge UDT's "policy selection" aspect is powerful for ECL.
      *   *Correction:* Make sure to mention *acausal trade* specifically. ECL is essentially acausal trade scaled up.
      *   *Key Distinction:* EDT cooperates because of *correlation*. FDT cooperates because of *identity/similarity*. In a large world, identity is plausible.
      *   *Reading Group Stuck Point:* They probably couldn't decide if the correlation in a large world is "logical" or "physical." I should address that. If the universe is deterministic and large, logical twins exist. If it's stochastic, maybe not.

  6.  **Final Polish:**
      *   Ensure the tone is respectful of the user's deep dive.
      *   Use clear headers.
      *   Summarize the verdict clearly at the end.

  7.  **Final Review against constraints:**
      *   Did I compare EDT and FDT reasoning? Yes.
      *   Did I address divergence? Yes.
      *   Did I answer if "evidential" is a naming artifact? Yes (mostly, but with technical caveats).

  *(Self-Correction Note)*: Wait, there is a specific paper by Oesterheld ("Evidential Cooperation in Large Worlds"). He explicitly discusses EDT. Does he discuss FDT? In later work (with Conitzer), they move towards more general acausal decision theory. I should mention that the community has largely migrated to viewing ECL through the lens of acausal decision theory (FDT/UDT) because it's more robust against the "common cause" objections that plague EDT.

  Okay, ready to write. The structure will be:
  1. Direct Answer (Convergence with caveats).
  2. The EDT Mechanism.
  3. The FDT/UDT Mechanism.
  4. The Divergence Case (Common Cause vs. Logical Link).
  5. Why "Evidential" stuck (History + Simplicity).
  6. The UDT Advantage (Policy Selection).
  7. Final Verdict.cw
answer: |-
  This is a sharp question, and it cuts to the heart of why decision theory taxonomy matters in cosmology. Your intuition is largely correct: in the standard ECL setup, **EDT and FDT/UDT usually converge on the same verdict (cooperate), but they do so for different reasons, and there are specific edge cases where they diverge.**

  The reason the literature is framed in EDT terms is partly historical and partly pedagogical, but "Evidential" is not *strictly* a naming artifact. There are structural differences in how the theories handle the correlation between you and your distant counterparts.

  Here is the breakdown of how an EDT agent versus an FDT/UDT agent reasons through ECL, where they agree, and where they part ways.

  ---

  ### 1. The Setup: ECL in a Nutshell
  In a sufficiently large (or infinite) world, there are many agents sufficiently similar to you. Let's say you value $X$ and a distant counterpart values $Y$.
  *   **The Deal:** If you pursue $Y$ locally, it is correlated (or logically linked) with counterparts pursuing $X$ locally.
  *   **The Gain:** Since there are $N$ counterparts, the total gain from them pursuing $X$ outweighs your local cost of pursuing $Y$, *provided* the correlation/dependence is strong enough.

  ### 2. How EDT Reasons (The "Evidence" Frame)
  **Mechanism:** Conditional Probabilities.
  An EDT agent asks: *"What is the expected utility of my action, conditional on my taking it?"*
  $$ EU_{EDT}(A) = \sum_{O} P(O | A) \cdot U(O) $$

  *   **Reasoning:** "If I choose to cooperate (pursue $Y$), this is strong *evidence* that I am the kind of agent who cooperates. In a large world, being 'the kind of agent who cooperates' is statistically correlated with other similar agents also cooperating. Therefore, $P(\text{They Cooperate} | \text{I Cooperate})$ is high."
  *   **Vulnerability:** EDT is vulnerable to **spurious correlations**. If there is a common cause (e.g., a physical law or initial condition) that makes us similar but does not link our *decisions* logically, EDT still cooperates. It treats the correlation as actionable evidence even if your action doesn't "influence" the other via any dependency graph.

  ### 3. How FDT/UDT Reasons (The "Dependence" Frame)
  **Mechanism:** Subjunctive/Logical Dependence.
  An FDT agent asks: *"What is the expected utility of the output of my decision algorithm?"*
  An UDT agent asks: *"Which policy maximizes utility across all possible worlds weighted by my prior?"*

  *   **Reasoning:** "My decision is the output of algorithm $D$. The distant counterparts are running algorithm $D'$ (where $D \approx D'$). Because our algorithms are logically similar, the output of $D$ *subjunctively depends* on the output of $D'$. If I compute 'Cooperate', then logically, any agent running a sufficiently similar algorithm in a sufficiently similar situation must also compute 'Cooperate'."
  *   **Strength:** FDT ignores spurious correlations. It only cooperates if there is a **logical or counterfactual link** between the decisions. It doesn't matter if we are correlated by a common cause; what matters is if my *decision process* determines theirs.

  ### 4. Do the Verdicts Diverge?
  In the standard ECL arguments presented by Oesterheld, **they usually converge.** However, they diverge in specific "Newcomb's Soda" style variations of the large world scenario.

  #### Case A: Algorithmic Twins (Convergence)
  *   **Scenario:** The universe is deterministic or computable. The other agents are running literally the same source code as you (or a close approximation).
  *   **EDT:** Sees high correlation. Cooperates.
  *   **FDT:** Sees logical identity. Cooperates.
  *   **Verdict:** **Agree.** This is the standard ECL pitch.

  #### Case B: The Common Cause / "Cooperation Gene" (Divergence)
  *   **Scenario:** Imagine the correlation arises not because you run the same algorithm, but because you share a physical origin or environmental constraint that *causes* you to behave similarly, but your decision processes are causally isolated and logically distinct. (Think: You and a clone are determined by the same initial physics to act alike, but you don't know the physics, you just know the statistical regularity).
  *   **EDT:** "My action is evidence of the physical state, which is evidence of their action." **Cooperates.**
  *   **FDT:** "My decision does not logically determine theirs. The physics determines both. My decision is free to defect without changing their output." **Defects.**
  *   **Verdict:** **Diverge.** EDT is "too cooperative" here; FDT recognizes there is no leverage.

  #### Case C: Updatelessness (The UDT Advantage)
  This is where FDT/UDT might actually be *stronger* for ECL than EDT.
  *   **EDT** updates on the fact that it exists. In some anthropic setups, this can lead to "Self-Indication Assumption" (SIA) style reasoning which can get messy (e.g., the Presumptuous Philosopher problem).
  *   **UDT** chooses a policy *before* updating on which specific agent it is. It views the "portfolio" of agents as a single optimization problem from the start.
  *   **Implication:** UDT naturally frames ECL as a **multi-agent optimization problem** rather than an evidential inference problem. This avoids the need to justify *why* the correlation exists; it simply asks, "What is the best policy for the algorithm instantiated in all these locations?"

  ### 5. Why is it called "Evidential" Cooperation?
  If FDT/UDT works (and is arguably more robust), why does the literature stick with EDT?

  1.  **Historical Path Dependence:** The concept of acausal trade (the precursor to ECL) was popularized by Gary Drescher and Eliezer Yudkowsky in the mid-2000s, often using EDT-like language because FDT wasn't formally crystallized until 2017 (Yudkowsky & Soares).
  2.  **Metaphysical Lightweight:** EDT requires only probability theory. FDT requires a theory of "subjunctive dependence" or logical counterfactuals, which is philosophically contentious. It is easier to sell ECL to economists or philosophers using Bayesian evidence than using logical counterfactuals.
  3.  **The "Similarity" Threshold:** EDT is more permissive. It allows cooperation even if the logical link is weak, provided the statistical correlation is strong. FDT requires a stronger claim: that the agents are actually computing similar functions. In a messy physical world, establishing *logical* similarity is harder than establishing *statistical* similarity.

  ### 6. The Verdict
  Your reading group couldn't give you a straight answer because the answer depends on the **nature of the similarity** in the large world.

  *   **If the similarity is algorithmic/logical:** FDT/UDT and EDT **converge**. The argument carries over perfectly. In fact, FDT/UDT provides a more robust foundation because it isn't vulnerable to the "common cause" objection.
  *   **If the similarity is merely statistical:** EDT cooperates, FDT defects.
  *   **Is "Evidential" a naming artifact?** Mostly, yes. The core insight of ECL (acausal gains from trade in large worlds) is decision-theory agnostic, provided the decision theory accepts acausal links (which CDT does not). However, "Evidential" signals a specific willingness to act on statistical correlations that might not be logically robust.

  **Recommendation for your mental model:**
  You can safely translate ECL arguments into FDT/UDT terms. In fact, doing so strengthens the argument against CDT critics. Instead of saying "My action is *evidence* of theirs," say "My decision algorithm is *logically linked* to theirs."

  The only caveat is to ensure you aren't relying on "fuzzy" similarity. For FDT to cooperate, the other agents must be running a decision procedure that is counterfactually dependent on yours. If they are just "similar humans" but not "similar decision algorithms," FDT might not bite, whereas EDT would. Given that Oesterheld's work usually assumes agents are reasoning similarly (i.e., running similar algorithms), the FDT translation is valid and arguably superior.

  **Summary:** The argument carries over fine, provided you interpret "similarity" as "algorithmic similarity" rather than just "statistical correlation." If you make that shift, FDT/UDT is the more rigorous engine for ECL.
