answer: |-
  The pill organizer is the first thing I see when I wake up. Four compartments for the morning, four for the evening. Plastic lids clicking shut like tiny coffins. I take the tablets dry, standing at the sink because my back won't tolerate the bend required to sit at the table. At fifty-eight, I move like a man of eighty. At twenty, I should have been dead.

  People call it luck. They say it over drinks, when I'm still able to hold a glass without the tremor taking over. "You have a guardian angel, Elias," my sister used to say, before the stroke took her speech and eventually her patience with visitors. She's gone now. Most of them are. The ones from the construction site in '95, the ones from the highway pileup in '08. I am the constant variable in equations that should have resolved to zero.

  I remember the highway most clearly. Ice on the bridge. My friend Marcus was driving. We hit the guardrail at sixty miles per hour. The car spun three times and ended up upside down in the median. I remember the smell of gasoline, sharp and wet. I remember thinking, *this is it.* The physics of it demanded an end. The crush of the roof should have collapsed the spine. The glass should have taken the eyes.

  I woke up in the ICU three days later. Marcus didn't wake up at all. I did, but I lost the hearing in my left ear. A permanent high-pitched whine, like a television tuned to a dead channel, has played in my head ever since. The doctors called it a miracle. I called it a trade. I had exchanged a life for a noise.

  Then came the fall from the scaffolding two years later. Twenty feet. Concrete below. By all rights, the impact should have stopped my heart. Instead, it stopped the nerves in my right leg. I walk with a cane now, dragging the foot slightly. Another trade. Mobility for continuity.

  It's the pattern that keeps me awake at night, not the pain. Pain is manageable; morphine exists. It's the narrowing. Every time the odds swing against me, every time the statistical likelihood of death spikes to ninety-nine percent, I don't emerge unscathed. I emerge reduced. If survival were a binary switch, I would be the man who walks away from the crash without a scratch, the hero of the anecdote. But I am not that man. I am the man who walks away with a limp, then a tremor, then a reliance on oxygen tanks during the winter.

  There is a theory I read once, buried in a philosophy journal during a long rehabilitation stint. It suggested that consciousness doesn't track the healthy survivor, because there are fewer ways to be healthy than there are to be broken. For every branch of reality where you walk away clean, there are a thousand where you survive with a shattered leg, a damaged lung, a compromised mind. The argument was abstract, mathematical. But living it feels less like math and more like erosion.

  Yesterday, I was making tea. The kettle slipped. Scalding water poured over my hand. I didn't drop it. I didn't scream. I just stood there, watching the skin blister, waiting for the shock to drop me to the floor. My heart rate didn't even spike. I wrapped the hand in a cold cloth and waited for the pain to arrive. It did, slowly. I am still here. But now I have second-degree burns on my dominant hand. Another layer of capability stripped away.

  I wonder sometimes if I'm waiting for the branch where the math finally wins. The branch where the car crash takes the head, the fall stops the heart, the aneurysm blooms fully. But that branch seems to be the one I never inhabit. I only inhabit the ones where the damage is just below the threshold of termination.

  I went to the doctor last week for the chest pains. She looked at the scans, then at me, then back at the scans. She used words like "anomalous" and "unsustainable." She said my heart should have given out five years ago. She asked me about my lifestyle, my stress levels, as if I were doing something to maintain this state. I wanted to tell her that I wasn't maintaining anything. I was just enduring.

  "Are you in pain?" she asked.

  "Always," I said.

  "Then why come in?"

  "Because I thought this might be the time."

  She didn't understand. How could she? She lives in a world where cause leads to effect, where danger leads to injury or death. She doesn't know about the selection effect. She doesn't know that from where I stand, the graveyard is the only constant, and I am the only one walking among the stones who refuses to lie down.

  Tonight, the stairs look steeper than usual. My knee locks halfway up. I hold the railing, knuckles white, breathing through the ache. I think about letting go. Just sitting down on the step and waiting for the heart to decide it's had enough. It feels like a temptation, but also like a impossibility. I know myself too well now. If I sit here, I won't die. I'll get cold. I'll get stiff. I'll develop a pressure sore. I'll wait until someone finds me, and I'll be moved to a facility, and I'll lose the apartment, and I'll lose the routine, and I'll be alive.

  I pull myself up the remaining steps. One leg, then the other. The whine in my left ear rises in pitch, a steady companion. I reach the landing and unlock the door. Inside, the apartment is quiet. The pill organizer waits on the counter. I check the compartments. Morning is empty. Evening is full.

  I am still here. I am less than I was yesterday, but I am here. I pour a glass of water and stand in the kitchen, listening to the hum of the refrigerator, waiting for a silence that doesn't come.
