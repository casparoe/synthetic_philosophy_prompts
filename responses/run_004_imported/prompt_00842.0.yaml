answer: |-
  **SCENE:** *The back of a yellow cab, 11:45 PM. Rain streaks the windows, blurring the city lights. The meter ticks audibly. ELENA (30s, sharp blazer, holding a stack of handouts) and MARCUS (50s, rumpled corduroy jacket, staring out the window) are the last two passengers. They are both heading toward the same subway hub.*

  **MARCUS**
  (Without turning)
  I'll give you this: the dominance theorem was elegant. Visually satisfying. If you're incoherent, there's always a coherent function closer to the truth.

  **ELENA**
  "Visually satisfying"? Marcus, it's a justification for Probabilism that doesn't rely on your wallet. That's the whole point. Joyce showed that incoherence is an *epistemic* sin, not a financial one.

  **MARCUS**
  (Turns, smiling tiredly)
  Is it? Or did he just change the currency? Look, I sat through the Q&A. You loved it when he waved away the Dutch Book argument as "pragmatic contamination." But tell me: where does the Brier score come from?

  **ELENA**
  It's a strictly proper scoring rule. It measures the squared distance between your credence and the truth value.

  **MARCUS**
  Right. *A* strictly proper scoring rule. There are infinitely many. Why the Brier? Why not the logarithmic score? Why not something weird that penalizes overconfidence on false propositions more heavily?

  **ELENA**
  Because the theorem holds for *any* strictly proper scoring rule. The specific choice doesn't change the dominance result. As long as the rule rewards honesty—

  **MARCUS**
  —there's the smuggler. "Rewards honesty." To say a rule is "proper" is to say it incentivizes reporting your true credence. But that incentive structure *is* a pragmatic constraint. You've defined "epistemic utility" in a way that mirrors rational betting behavior. You haven't escaped pragmatism; you've just renamed "expected gain" to "expected accuracy."

  **ELENA**
  (Shifts, clutching the handouts)
  That's a category error. When I maximize accuracy, I'm not trying to win a bet. I'm trying to align my mind with the world. If I have incoherent credences, say 0.6 on *P* and 0.6 on *not-P*, I'm guaranteed to be less accurate than someone with 0.5/0.5, regardless of what happens. That's a fact about the *world*, not about my betting book.

  **MARCUS**
  It's a fact about the *measure* you imposed on the world. You're saying, "If you care about accuracy exactly as much as I've defined it in this equation, you should be probabilistic." But why *must* I care about accuracy that way? The Dutch Book argument doesn't ask you to care about a specific metric. It just says: if your degrees of belief imply you accept a set of bets that lose you money for sure, your beliefs are inconsistent.

  **ELENA**
  But Marcus, nobody is forcing me to bet! That's my frustration with the Ramsey/de Finetti line. It treats belief as a disposition to act. But I can have a belief without ever pulling out my wallet. If I'm a hermit, your Dutch Book is toothless. I can be incoherent all day long and lose nothing.

  **MARCUS**
  (Leans forward, elbows on knees)
  You lose *coherence*. The money is just a proxy. It's a reductio ad absurdum of your commitments. If you say you believe *P* to degree 0.7, you are logically committed to accepting certain odds. If you refuse the bet, you're denying your own stated belief. If you accept the bet, you're a sucker. The Dutch Book shows that incoherent credences are *defective* states, whether the bookie shows up or not. It's like a logical contradiction. You don't need to actually assert *P* and *not-P* to be wrong; the contradiction is in the structure.

  **ELENA**
  But the accuracy argument gets at the *goal* of belief. Truth. Verisimilitude. The Dutch Book argument gets at the *consequence* of belief. I want to know why I should be probabilistic *qua* knower, not *qua* gambler. Your argument tells me I'll get pumped if I engage with the world. Mine tells me I'm already failing the world, even in silence.

  **MARCUS**
  And I'm telling you your "silence" is an illusion. You can't separate the knower from the actor. But let's go back to the smuggling. You say any proper scoring rule works. But to get the dominance theorem, you need "Immodesty."

  **ELENA**
  (Nods)
  Naturally.

  **MARCUS**
  Right. You have to assume that a probabilistic credence function expects *itself* to be more accurate than any other function.

  **ELENA**
  Because it is! If I'm coherent, I know that my expectations are calibrated.

  **MARCUS**
  See, that's the circle. You're justifying Probabilism by assuming that Probabilistic agents are the ones who get to define what "expecting accuracy" means. It's a closed shop. The Dutch Book argument is external. It doesn't care what you expect. It cares about the arithmetic of your commitments.

  **ELENA**
  The arithmetic of bets is external to epistemology! Look, I grant you that the choice of scoring rule requires a defense. Pettigrew spends chapters on it. We argue for "Alethic" principles. But once you accept that truth is the goal, and that getting closer to the truth is better than getting further, the math forces Probabilism. Your argument forces Probabilism only if I accept that beliefs *are* betting quotients. I don't. I think beliefs *guide* betting quotients.

  **MARCUS**
  (Chuckles softly)
  "Guides." That's the escape hatch. If they guide betting, but aren't betting, then what connects them? If I have a credence of 0.9 but I won't bet 9:1, am I irrational?

  **ELENA**
  You might be. Or you might just dislike money.

  **MARCUS**
  Or I might be incoherent, and your accuracy measure is too blunt to catch it because it doesn't account for the stakes. Here's the rub, Elena: Your accuracy-first approach makes epistemology solipsistic. It's just me and my "distance from the truth." But truth isn't a distance. It's a relation. The Dutch Book captures the relational aspect of belief—how it fits with other beliefs and actions. You're trying to measure the shape of a key without looking at the lock.

  **ELENA**
  And you're trying to justify the key by showing it opens a door I never intended to walk through. I want to know if the key is well-made. You want to know if it turns.

  *Marcus looks out the window as the cab slows for a red light. The silence stretches for a moment, filled only by the rain and the idling engine.*

  **MARCUS**
  You know, de Finetti didn't think he was talking about money either. He thought he was talking about consistency.

  **ELENA**
  And Joyce didn't think he was talking about geometry. He thought he was talking about truth.

  **MARCUS**
  (Turns back to her)
  So we're stuck. You think I'm reducing epistemology to economics. I think you're dressing up economics in epistemic clothing and calling it "pure."

  **ELENA**
  (Sighs, looking at the meter)
  Maybe. But if I'm incoherent, and the world turns out one way, I can point to your coherent friend and say, "She was closer to the truth." Can you say that?

  **MARCUS**
  I can say, "She didn't guarantee her own ruin."

  **ELENA**
  (Smiles faintly)
  I suppose that's something.

  **MARCUS**
  And I can say your "distance from truth" is invisible until you try to use it.

  **ELENA**
  And I can say your "guaranteed ruin" is hypothetical until you meet a bookie.

  *The cab pulls up to the subway entrance. The meter beeps.*

  **MARCUS**
  (Reaching for his wallet)
  Same time tomorrow? There's a talk on Imprecise Probabilities.

  **ELENA**
  (Paying the driver)
  God help us. I hear the speaker uses Dutch Books to argue against Probabilism.

  **MARCUS**
  (Opening the door)
  Sounds like a mess. I wouldn't miss it.

  **ELENA**
  (Stepping out into the rain)
  Neither would I.

  *They nod to each other, turn up their collars, and walk in opposite directions toward the station entrance.*

  **[FADE OUT]**
