answer: |-
  This is a sophisticated pivot point for a dissertation chapter. You have correctly identified that the debate over money pumps has shifted from "Are intransitive preferences exploitable?" to "Is the only way to avoid exploitation rationally permissible?"

  The intuition that McClennen's resolute choice is a "Pyrrhic victory" rests on a conflict between two competing conceptions of diachronic rationality: **Separability** (the view that rational choice is local to the decision node) versus **Planning Agency** (the view that rationality requires the capacity to execute cross-temporal plans).

  Below is a breakdown of the strongest objection to resolute choice—often termed the **Normative Authority of the Present**—followed by the resolute defender's best counter-argument. This should provide the dialectical tension you need for your chapter.

  ---

  ### I. The Strongest Objection: The Normative Authority of the Present

  The core charge against McClennen is that resolute choice saves the agent from financial exploitation only by demanding they commit a different kind of rational error: **acting against their own current evaluative judgment.**

  #### 1. The Principle of Separability
  The most rigorous formulation of this objection comes from theorists like Wlodek Rabinowicz and John Broome. It relies on the **Principle of Separability** (or *Dynamic Consistency* in a specific normative guise). This principle holds that when an agent arrives at a decision node, their choice should be determined solely by the options available *at that node* and their preferences/beliefs *at that time*. The past is sunk; the fact that a "past self" made a plan is not, in itself, a reason to choose one option over another now.

  If an agent has intransitive preferences such that at $t_2$ they strictly prefer $B$ to $A$, but they choose $A$ because their $t_1$ self planned to, they are violating Separability.
  *   **The Charge:** This looks indistinguishable from **akrasia** (weakness of will). If rationality is, minimally, about aligning one's actions with one's current assessment of what is best, the resolute chooser is being irrational at $t_2$.
  *   **The Pyrrhic Cost:** You have avoided the *instrumental* failure of the money pump (losing wealth) by accepting a *constitutive* failure of agency (ignoring current reasons). You have saved your preferences from the label of "irrational," but only by making your *choice mechanism* irrational.

  #### 2. The "No-Reason" Problem
  Critics argue that McClennen fails to explain *why* the prior plan generates a reason.
  *   In standard decision theory, reasons derive from outcomes (consequentialism) or current desires (Humean instrumentalism).
  *   At $t_2$, the outcome of choosing $A$ is worse (by the agent's own current lights) than $B$.
  *   The only difference is that $t_1$ selected $A$.
  *   **The Objection:** Unless you posit a magical normative force where "past intentions" automatically generate "present reasons," the agent at $t_2$ is choosing an option they judge to be inferior without a compensating reason. As Rabinowicz puts it, resolute choice requires the agent to treat their past preference as authoritative over their present preference without a justification for that authority.

  #### 3. The Fragmented Self Dilemma
  This objection digs deeper into the metaphysics of the agent.
  *   **Scenario:** If preferences are truly intransitive or unstable over time, why should we treat $t_1$-Agent and $t_2$-Agent as the same normative entity?
  *   **The Dilemma:**
      1.  **If they are the same entity:** Then their preferences should be consistent. If they aren't, the agent is flawed. Resolute choice papers over this flaw by forcing $t_2$ to obey $t_1$, but it doesn't fix the underlying inconsistency in the valuation system.
      2.  **If they are different entities:** Then $t_1$ has no authority over $t_2$. For $t_2$ to obey $t_1$ is a form of subjugation, not rationality.
  *   **Conclusion:** Resolute choice works only if we assume the unity of the agent *normatively* while admitting their disunity *psychologically*. Critics argue this is an unstable position. It asks the agent to act as a unified planner while acknowledging they are a sequence of local maximizers with conflicting preferences.

  ---

  ### II. The Defender's Reply: Planning Agency as a Constitutive Norm

  A defender of resolute choice (channeling McClennen, and later Michael Bratman) does not deny that resolute choice violates Separability. Instead, they argue that **Separability is the wrong norm for beings like us.**

  #### 1. The Capacity for Planning
  McClennen's central argument is that standard decision theory (and the Separability principle) models agents as mere *desire-satisfiers* rather than *planners*.
  *   **The Argument:** Human rationality is not just about maximizing utility at a moment; it is about the capacity to formulate and execute plans over time. This capacity is a good in itself because it allows for the pursuit of complex, long-term goods that cannot be secured by local maximization.
  *   **The Shift:** Rationality should not be defined as "choosing the locally preferred option." It should be defined as "managing one's agency effectively over time." If sticking to a plan is necessary to maintain the capacity for planning, then sticking to the plan is rational, even if it violates local preference.

  #### 2. Bootstrapping Reasons (Bratman's Contribution)
  Michael Bratman extends McClennen's view by arguing that intentions *do* generate reasons. This is the **Bootstrapping Objection** turned into a feature.
  *   **The Reply:** It is not true that the past plan offers "no reason." The reason is the **stability of agency**.
  *   If I do not treat my prior intentions as reason-giving, I cannot coordinate my actions over time. I become a "wantons" (in Frankfurt's terms), blown about by every shifting local preference.
  *   Therefore, at $t_2$, I have a new reason that I did not have at $t_1$: the reason to maintain my integrity as a planning agent. This reason can outweigh the local preference for $B$ over $A$.
  *   **Result:** The agent is not acting akratically. They are acting on a *higher-order reason* (maintaining planning integrity) that overrides the *first-order preference* (local taste).

  #### 3. The Cost of Sophistication
  The defender also points out that the alternative to Resoluteness is usually **Sophistication** (backward induction where the agent anticipates their future weakness and restricts their own options).
  *   **The Comparison:** A sophisticated agent avoids the money pump by refusing to start the sequence. A resolute agent starts the sequence and finishes it.
  *   **The Advantage:** Sophistication is restrictive; it requires the agent to turn down beneficial opportunities *ex ante* because they distrust their future self. Resoluteness allows the agent to access opportunities that require follow-through.
  *   **The Punchline:** If rationality is about effective agency, the resolute agent is *more* rational than the sophisticated one because they retain the freedom to act while maintaining consistency. The "cost" of violating Separability is outweighed by the benefit of not being option-constrained.

  ---

  ### III. Synthesis for Your Dissertation

  To frame this in your chapter, you might characterize the stalemate as a clash between two **conceptions of the agent**:

  1.  **The Momentary Maximizer (Critics):** Rationality is a property of the relation between an agent's current mental states and their current action. On this view, Resolute Choice is indeed a Pyrrhic victory; it saves the preference structure by sacrificing the rationality of the choice itself. The agent becomes a slave to a "dead" past self.
  2.  **The Temporal Planner (Defenders):** Rationality is a property of the agent's life as a whole. On this view, the money pump reveals a failure of *diachronic governance*, not just preference structure. Resolute choice is the only way to achieve diachronic governance without external pre-commitment devices.

  **The "Pyrrhic" Verdict:**
  The reason many theorists remain unsatisfied is that McClennen's solution appears to **change the subject**.
  *   The Money Pump argument claims: "Intransitive preferences lead to dominated outcomes."
  *   McClennen replies: "Not if you change how you choose."
  *   The Critic retorts: "But if you have to change how you choose to the point where you ignore your current judgment, you have admitted that your preferences cannot guide rational action. You have saved the preferences from the charge of irrationality only by rendering them action-inert."

  **Suggested Phrasing for your Chapter:**
  > "McClennen's resolute choice avoids the money pump by decoupling choice from current preference. However, this decoupling invites the charge that resoluteness purchases diachronic consistency at the price of synchronic rationality. If an agent at $t_2$ chooses $A$ over $B$ while judging $B$ superior to $A$, they satisfy the structural demands of planning but violate the substantive demands of responsiveness to reasons. Thus, the victory is Pyrrhic: the agent avoids exploitation only by becoming, in a sense, akratic by design."

  ### Key References to Cite
  *   **McClennen, E. F.** (1990). *Rationality and Dynamic Choice: Foundational Explorations*. (The primary source).
  *   **Rabinowicz, W.** (1995). "To Have One's Cake and Eat It, Too: Sequential Choice and Expected Utility Violations." (The strongest critique of McClennen).
  *   **Bratman, M.** (1987). *Intention, Plans, and Practical Reason*. (For the planning agency defense).
  *   **Broome, J.** (1999). "Normative Requirements." (On the nature of rational requirements).
  *   **Gold, N., & Sugden, R.** (2007). "Theories of Team Agency." (Useful for discussing the fragmentation of the self).
  *   **Hájek, A.** (2008). "Arguments for—Or Against—Probabilism?" (For context on money pumps generally).

  This structure should allow you to present the objection not just as a technical quibble, but as a fundamental philosophical disagreement about the nature of rational agency.
