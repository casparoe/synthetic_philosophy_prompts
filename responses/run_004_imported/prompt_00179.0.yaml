answer: |-
  You have stumbled upon one of the most famous and difficult problems in ethics. What you are describing is a textbook example of **Moral Luck**, specifically a type known as **Resultant Luck**.

  Philosophers like Thomas Nagel and Bernard Williams have written extensively about this. Your intuition that something feels inconsistent is philosophically sound. Here is a breakdown of why this situation feels unfair, why society handles it this way, and whether it is actually "fair."

  ### 1. The Control Principle vs. Reality
  Your argument relies on what ethicists call the **Control Principle**. This is the idea that people should only be morally assessed for what is under their control.
  *   **What they controlled:** Both students made the conscious choice to pick up their phones and text while operating a vehicle.
  *   **What they didn't control:** Traffic conditions, the actions of a cyclist, and pure chance.

  From a strictly moral standpoint (specifically a *deontological* one, which focuses on duties and rules), both students are **equally culpable**. They both violated the duty of care owed to others on the road. They both gambled with public safety. The fact that one "won" the gamble and the other "lost" doesn't change the immorality of the gamble itself.

  So, to answer your question: **Yes, there is an inconsistency.** If we judge character and moral wrongness based on choices, they should be judged equally.

  ### 2. Why Society Judges Based on Outcomes
  If the moral blame is equal, why are the consequences so different? This comes down to how legal and social systems function. They are largely **consequentialist**, meaning they focus on the results of actions rather than just the intent.

  *   **Harm Requires Restitution:** The legal system and school administration are reactive. When harm occurs (the injured cyclist), there is a victim who needs justice or compensation. When no harm occurs (the kid who got home), there is no victim to demand restitution, so the system often remains dormant.
  *   **Evidence and Enforcement:** It is difficult to police risk. Police cannot ticket every person who speeds or texts, only the ones they catch or the ones who crash. The crash provides the evidence and the trigger for punishment.
  *   **Deterrence:** Harsh penalties for accidents serve as a warning to others. If the kid who hit the cyclist got the same "light lecture" as the kid who didn't, it might signal that texting while driving is low-risk.

  ### 3. The "Luck" Factor
  The frustrating part you identified is that the severity of the punishment is determined by **luck**, not just recklessness.
  *   **Student A (Safe):** Benefited from *good* moral luck.
  *   **Student B (Crash):** Suffered *bad* moral luck.

  It feels unfair because Student B is being punished for the outcome *plus* the action, while Student A is effectively getting away with just the action. In a perfect world, Student A would face similar consequences (suspension, license points) because the *risk* they created was identical.

  ### 4. Is it Fair?
  **Philosophically? No.**
  It violates the Control Principle. We are holding them to different moral standards based on variables outside their control.

  **Practically? It's unavoidable.**
  Human psychology and legal systems are wired to respond to harm. We feel anger when someone is hurt. We feel relief when no one is hurt. It is very difficult for parents, coaches, or judges to punish the "lucky" driver with the same severity as the "unlucky" one when there is no visible damage.

  ### 5. The Cyclist's Role
  You mentioned the cyclist ran a red light. This adds a layer of legal complexity (comparative negligence), but it doesn't erase the texting.
  *   If the driver hadn't been texting, they might have reacted in time to avoid the cyclist, even if the cyclist was in the wrong.
  *   By texting, the driver removed their margin of safety.
  *   Therefore, while the cyclist shares blame for the *accident*, the driver bears the blame for the *recklessness* that made the accident worse or unavoidable.

  ### Summary
  You are right to feel that the judgment is inconsistent. The two students displayed the same lack of regard for safety. The difference in their treatment is not because one was "more wrong" in their choices, but because our society punishes **harm** more severely than it punishes **risk**.

  The "lucky" driver isn't morally better; they are just fortunate. The "unlucky" driver isn't morally worse; they are just the one whose risk manifested into reality. Recognizing this distinction is a sign of strong ethical reasoning on your part. It highlights why we should judge ourselves and others based on the choices made, not just the outcomes that follow.
