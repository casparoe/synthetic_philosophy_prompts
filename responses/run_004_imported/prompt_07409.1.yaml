answer: |-
  This is a fantastic premise. You have correctly identified that the "danger" in Newton's theology doesn't come from the *conclusion* (which was indeed circulating in coffee houses and dissenting academies) but from the *mechanism* and the *stakes* he attached to it.

  If you write him as just a guy who thinks the Trinity is illogical (the Socinian route), he's a skeptic. If you write him as a guy who thinks the Trinity is a **cosmic forgery that damns the soul of England**, he's a prophet of doom. That is much scarier.

  Here is a breakdown of where Newton overlaps with the broader antitrinitarian current of the 1690s, and where he departs into territory that is uniquely his own—and uniquely useful for your novel.

  ### 1. The Overlap: What Was "In the Air"
  You are right to be cautious about making him seem like the *only* person thinking this. By the 1690s, the intellectual monopoly of the Trinity was cracking.

  *   **The Socinian/Rationalist Critique:** Socinians (early Unitarians) argued that the Trinity was logically incoherent. You can't have 1=3. This was a philosophical argument based on reason. Many "Latitudinarian" clergy in the Church of England were softening on this, willing to treat the Trinity as a mystery rather than a strict logical proposition.
  *   **Textual Suspicion:** The suspicion regarding 1 John 5:7 (the *Comma Johanneum*) was not Newton's invention. Protestant critics had noted its absence in Greek manuscripts for a century.
  *   **Subordinationism:** The idea that the Son is subordinate to the Father (Arianism) was the most common form of heterodoxy. It preserved Christ's divinity but removed his equality.

  **Novelistic Implication:** If your narrator hears gossip about the old man, it should reflect this. People might whisper, "He's a Socinian," or "He denies the mystery." That sets up the reveal: the narrator expects a rationalist argument, but gets something far more volatile.

  ### 2. The Departure: Why Newton Was "Special" (and Dangerous)
  Newton was not a Socinian. He believed Christ was a pre-existent divine being (created by the Father before the world), whereas Socinians believed Christ was merely a man. But the real difference lies in *why* he rejected the Trinity.

  #### A. Historical Conspiracy vs. Rational Objection
  Most antitrinitarians argued, "This doctrine makes no sense."
  Newton argued, "This doctrine is a **lie** planted by criminals."

  Newton viewed the adoption of the Trinity at the Council of Nicaea (325 AD), championed by Athanasius, not as a theological error, but as a **Great Apostasy**. He believed the true primitive church was unitarian (worshipping the Father only) and that Athanasius and the Roman Church had corrupted the texts to seize power.
  *   **Why this is unsettled:** It turns theology into a crime scene. Newton isn't just disagreeing with the Bishop; he is accusing the Founding Fathers of the Church of fraud. For Newton, the Trinity wasn't just wrong; it was **idolatry**. And in his view, idolatry voids salvation. To Newton, a Trinitarian Christian isn't just mistaken; they are worshipping a false god and are damned.

  #### B. The Prophetic/Apocalyptic Angle
  This is the "feral genius" hook. Newton's theology was inextricably linked to his studies of Daniel and Revelation.
  *   He identified the "Little Horn" of Daniel and the "Beast" of Revelation with the Athanasian Church.
  *   He believed the corruption of doctrine was a sign of the End Times.
  *   **The Reveal:** When your narrator reads the papers, he shouldn't just see theological arguments. He should see prophecy. The old man isn't trying to reform the college; he's waiting for the apocalypse that will cleanse this corruption. This makes him seem less like a don and more like a mad prophet.

  #### C. The *Disciplina Arcani* (Discipline of the Secret)
  This explains why he hid it, distinguishing him from Whiston.
  *   **Whiston (later):** Believed the truth should be preached to everyone to reform the Church. He got fired for it.
  *   **Newton:** Believed truth was for the **elect few**. He practiced a form of *Nicodemism* (hiding one's faith to avoid persecution), but also believed that casting holy truths before "swine" (the vulgar public or the corrupt clergy) was itself a sin.
  *   **The Danger:** He isn't hiding because he's cowardly (though he was terrified of losing his status); he's hiding because he thinks the narrator might not be *worthy* of the secret.

  #### D. God as Pantocrator (Absolute Monarch)
  Newton's physics and theology mirror each other. His God is an absolute monarch ruling over absolute space.
  *   The Trinity, to Newton, looked like a division of sovereignty. It was political treason against God.
  *   **Context:** In the 1690s, political treason and religious heresy were cousins. The King is the Head of the Church. To deny the Church's core doctrine is to undermine the King's authority. Newton's God is a God of **Dominion**. This fits the "scary old man" vibe—he views the universe as a kingdom of absolute law and authority.

  ### 3. Specific Research Nuggets for the Text
  To make the reveal land, have the narrator find specific phrases or arguments in the manuscripts:

  *   **The Two Corruptions:** Have the narrator see the specific focus on **1 John 5:7** ("For there are three that bear record in heaven...") and **1 Timothy 3:16**. Newton argued these were inserted to bolster the Trinity.
  *   **"Homousios":** Have Newton fixate on this Greek word (consubstantial/of one substance). He hated it. He called it "heathenish" philosophy injected into scripture.
  *   **The Blasphemy Act of 1698:** Just as you are writing this, remember that in 1698, Parliament passed *An Act for the more effectual suppressing of Blasphemy and Profaneness*. It mandated that anyone denying the Trinity would lose their civil office and be imprisoned. This raises the stakes for a Fellow of Trinity College immediately.
  *   **The Locke Letter:** You mentioned the letter to Locke. In reality, Newton got cold feet and asked Locke *not* to publish it. In your book, maybe the narrator finds the draft that Newton tried to suppress.

  ### 4. Summary for Characterization
  **Is he just one more guy with an idea in the air?**
  No.
  *   **The Common Arian/Socinian:** "The Trinity is unreasonable. We should worship God simply." (Goal: Reform/Reason)
  *   **Your Newton:** "The Trinity is a satanic forgery by Athanasius that has damned the world for 1,300 years. The Church is the Whore of Babylon. I possess the true history of the Apocalypse." (Goal: Preservation/Prophecy)

  **How to stage the reveal:**
  The narrator expects to find alchemical recipes (turning lead to gold). Instead, he finds "historical" recipes (turning the Church back to primitive truth). The "gold" Newton is seeking is the **pure, uncorrupted Word**.

  The unsettling realization for the narrator should be: *He doesn't think he's a heretic. He thinks he's the only true Christian left in Cambridge, and the rest of us are idolaters.* That creates a terrifying distance between the genius and the world, which fits your "half-feral" description perfectly.

  ### Suggested Reading (for flavor)
  *   **Stephen Snobelen, "Isaac Newton, Socinianism and 'The One Supreme God'"**: Snobelen is the leading scholar on Newton's theology. He argues Newton was closer to Arianism but distinct.
  *   **Rob Iliffe, *Priest of Nature***: A recent biography that focuses heavily on Newton's religious manuscripts. It paints a picture of a man obsessed with purification.
  *   **The *Two Notable Corruptions of Scripture***: Look up summaries of the arguments. The textual criticism is dry, but the *accusation* of fraud is dramatic.

  This approach keeps your historical accuracy high while maximizing the dramatic tension. Newton wasn't just a skeptic; he was a conspirator against the established order of heaven and earth. That's your hook.
