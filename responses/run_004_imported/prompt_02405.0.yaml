prompt: |-
  ok so this is going to sound random but I got a cochlear implant a few weeks ago and its honestly got me spiraling philosophically lol. the device is basically translating sound into electrical pulses for my auditory nerve since my actual cochlea barely works anymore, and it made me think back to Leibniz's mill argument from a phil class I took forever ago - the bit where he says if a machine could think and you blew it up to the size of a mill and walked around inside it, you'd just find parts pushing on parts, never anything you could point to as perception. given that argument, what do you think Leibniz would actually say if he saw functionalism and multiple realizability today? like would he think my implant could genuinely be realizing the same kind of auditory perception my ear used to, or would he be more on the side of someone like Searle who thinks theres something about the biological stuff itself that matters? not really looking for a wiki definition of multiple realizability, more curious how his actual metaphysics would push him on a case this specific.
