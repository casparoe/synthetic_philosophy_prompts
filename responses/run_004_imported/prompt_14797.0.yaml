      *   *Mechanism:* Evolution doesn't "choose" proxies. Traits that correlate with reproduction spread. If a trait leads to reproduction, it *is* the fitness mechanism, not a proxy for it.
      *   *Claim:* Calling it Goodhart's Law anthropomorphizes evolution. It's actually just "environmental change rendering adaptations maladaptive" or "antagonistic pleiotropy" or "sensory exploitation."

  4.  **Evaluate the Four Goodhart Modes in an Evolutionary Context:**

      *   **Adversarial:** Requires a strategic agent gaming the system.
