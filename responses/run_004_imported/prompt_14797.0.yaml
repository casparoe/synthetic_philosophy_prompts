      *   **Extremal:** Relationship holds in training distribution (EEA) but breaks in test distribution (Modernity).
          *   *Evolution:* This fits perfectly. The correlation between "sweet taste" and "caloric density" held in the EEA. In the modern extremal environment (pure fructose), the correlation breaks.
          *   *Verdict:* Survives best. This is essentially "distributional shift."

