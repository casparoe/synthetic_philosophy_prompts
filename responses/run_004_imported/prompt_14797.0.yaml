          *   *Verdict:* Does not survive.

      *   **Causal:** Proxy and Goal share a cause, or Proxy causes Goal. If you intervene on Proxy without the causal link, Goal fails.
          *   *Evolution:* Evolution doesn't "intervene." It selects. If a trait (Proxy) causes reproduction (Goal), it spreads. If the environment changes so the trait no longer causes reproduction, the trait stops spreading. This isn't really "Causal Goodhart" in the control sense; it's just a broken causal link due to context shift.
          *   *Verdict:* Weak fit. It's more about context-dependence than causal confusion.

      *   **Regressional:** $P = G + \epsilon$. Optimizing for $P$ selects for high $\epsilon$.
