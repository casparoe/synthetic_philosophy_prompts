      *   *Mechanism:* Evolution maximizes inclusive fitness ($G$). It can't measure fitness directly, so it selects for proxies ($P$) like "taste sweet," "seek status," "want sex." In the EEA (Environment of Evolutionary Adaptedness), $P \approx G$. In the modern world, $P \gg G$ (e.g., pure sugar, infinite scroll).
      *   *Claim:* This *is* Goodhart's Law. When you optimize for $P$, $G$ stops increasing or decreases.

  3.  **Analyze the "Anti-Analogy" Side (The User's Critique/Biological Rigor):**
