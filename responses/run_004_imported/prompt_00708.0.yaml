          2.  Constraint: Do not jump to complex explanations for *this* behavior if a simple one works.
          3.  Exception: Unless we have established the *capacity* for complexity via *other* behaviors.
      *   *Key Distinction:* Token vs. Type. The canon governs the interpretation of specific *actions* (tokens), not the general *capacities* (types) of the species. The 1903 revision clarifies this.

  5.  **Evaluating the "Bite" (Philosophical Analysis):**
      *   *Does it survive?* Yes, but it changes from a metaphysical claim to a methodological heuristic.
      *   *The "Independent Evidence" Problem:* The user is right to be suspicious. How do we get independent evidence without using the canon?
      *   *Response:* The canon is part of a reflective equilibrium. It's not an algorithm. It forces the researcher to accumulate a pattern of behavior before attributing a high-level state. It prevents "one-trick" anthropomorphism.
      *   *Scala Naturae:* Acknowledge this is problematic in modern biology (cladistics vs. grades). However, "complexity" can be redefined functionally (computational cost, flexibility) rather than evolutionarily.
      *   *Consciousness Specifics:* This is crucial for the user's dissertation. LMC is often used to *deny* consciousness. The 1903 revision suggests we need *independent evidence* of consciousness before using it to explain behavior. But how do we get that evidence? (The Hard Problem/Evidence Problem).

  6.  **Developing the Critique/Assessment:**
