  8.  **Final Polish:** Check against the user's specific constraints (bass/harmony/melody, clairvoyant analogy, mechanics of theory). Ensure the distinction between "copying the Will" and "copying the appearance of the Will" is sharp.

      *(Self-Correction on the Clairvoyant point)*: I need to be careful here. Schopenhauer says the genius *is* the medium. The AI is *also* a medium. Why is the AI worse? Because the genius is a medium for the *Will*, the AI is a medium for the *Dataset*. The Dataset is Phenomenal. The Will is Noumenal. That's the crux.

  9.  **Final Structure:**
