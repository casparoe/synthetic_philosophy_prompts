      *(Refining the "Fink" response)*: A finkish disposition challenges the *timing*. Ryle says dispositions are multi-track and open-ended. He might argue that "conductive" just means "allows current when circuit is closed." If a device ensures that happens, the term applies. The worry that it wasn't conductive *before* is the worry about a hidden state. Ryle doesn't care about the "before" state, only the licensing of the prediction.

