  2.  **Recall the Ellsberg Paradox Structure:**
      *   **Setup:** An urn contains 90 balls. 30 are Red. 60 are Black or Yellow (unknown proportion).
      *   **Gamble 1 (Bet on Red vs. Bet on Black):**
          *   Option A: Win $100 if Red. (Known prob: 30/90 = 1/3)
          *   Option B: Win $100 if Black. (Unknown prob: 0 to 60/90)
          *   *Typical Preference:* A > B (People prefer known risk).
      *   **Gamble 2 (Bet on Red or Yellow vs. Bet on Black or Yellow):**
          *   Option C: Win $100 if Red or Yellow. (Unknown prob: 30/90 to 90/90)
          *   Option D: Win $100 if Black or Yellow. (Known prob: 60/90 = 2/3)
          *   *Typical Preference:* D > C (People prefer known risk).
      *   **The Contradiction:**
          *   If A > B, then $P(Red) > P(Black)$. Since $P(Red) = 1/3$, this implies $P(Black) < 1/3$.
          *   If D > C, then $P(Black \cup Yellow) > P(Red \cup Yellow)$. Since $P(Black \cup Yellow) = 2/3$ and $P(Red \cup Yellow) = 1 - P(Black)$, this implies $2/3 > 1 - P(Black)$, so $P(Black) > 1/3$.
          *   Combined: $P(Black) < 1/3$ AND $P(Black) > 1/3$. Impossible.
      *   **Core Logic:** The preferences violate the Sure-Thing Principle because the common consequence (Yellow) should cancel out, but people treat the ambiguity of Yellow differently depending on whether it's paired with Red or Black.

