prompt: |-
  My friend Priya and I got into a whole argument about this at a bar last night and never actually landed anywhere, so I want a neutral opinion. She works on the risk-scoring model at this online lending startup that approves personal loans, and it started because I was giving her a hard time about something her team is proud of. The setup: the model spits out a predicted default probability for every applicant, and when they audit it, it's genuinely well "on target" — like, of the people it says have a 20% chance of defaulting, about 20% of them actually do, and that holds up just as well for younger applicants as for older ones, even though younger applicants default at a noticeably higher rate overall in the historical data.

  Except then I made her pull up the error breakdown with me, and its lopsided in a pretty specific way: among applicants who, it turns out, would've paid the loan back just fine, way more young people get rejected than old people; and among applicants who do go on to default, way more of the old ones had been waved through as "safe" in the first place than the young ones were. That feels like two real harms stacked on each other to me, but Priya's answer was suddenly weirdly hand-wavy for someone whos normally the precise one in any argument with numbers in it — basically "the predictions are equally accurate for both groups, so the model itself isn't unfair, that's just what the underlying data looks like." I said ok, fine, then just fix it so it's equally "on target" for both groups AND doesn't have that rejection/wave-through gap anymore. She got weirdly cagey about whether that's even possible in principle, as opposed to just hard.

  So, genuinely: is she right that there's some real structural reason you can't have both of those nice properties at once here, given that the two groups' actual default rates aren't the same to begin with? Or is this just her team not trying hard enough? If it really is a dead end, what should I concede to her and what should she concede to me, and if you were advising her team directly, what would you tell them to actually prioritize? Extra credit if you can tell me how her team is supposed to explain to a rejected young applicant why "the model is fair" and "you personally got a worse deal than an equally trustworthy older applicant" can both be true at once.
