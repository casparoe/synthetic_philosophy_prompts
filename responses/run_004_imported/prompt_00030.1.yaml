answer: |-
  The Problem of Old Evidence (POE) is often introduced as a static paradox: if $P(E) = 1$, then $P(H|E) = P(H)$, so $E$ cannot confirm $H$. However, the deeper, diachronic version of the problem strikes at the heart of how Bayesian agents are supposed to learn over time.

  Here is an explanation of why POE is a structural failure specific to Bayesian conditionalization, followed by an analysis of why the two most prominent solutions (counterfactuals and Garber-style logical learning) fail to fully resolve the epistemological tension.

  ---

  ### 1. Why POE is Specific to Bayesian Conditionalization

  To understand why POE is a specifically Bayesian problem, we must distinguish between a **logic of confirmation** and a **mechanism of belief updating**.

  **General Confirmation Theories (e.g., Hypothetico-Deductive):**
  In the Hypothetico-Deductive (H-D) model, evidence $E$ confirms hypothesis $H$ if $H$ entails $E$. The temporal order of discovery is irrelevant. Whether $E$ was known before or after $H$ was formulated does not matter; if the logical relationship holds, confirmation holds. For H-D, the fact that the perihelion of Mercury was known before General Relativity (GR) was formulated is irrelevant. GR entails the perihelion data; therefore, the data confirms GR.

  **Bayesian Conditionalization:**
  Bayesianism is not just a logic of support; it is a theory of rational belief *revision*. The core norm of diachronic rationality is **Conditionalization**:
  $$P_{new}(H) = P_{old}(H | E)$$
  This rule dictates that you update your belief in $H$ by conditioning on the *new* information $E$. The "confirmation" is measured by the difference $P_{new}(H) - P_{old}(H)$.

  **The Structural Breakdown:**
  The problem arises because Conditionalization ties confirmation strictly to **surprise** (probability shift).
  1.  **Diachronic Constraint:** For conditionalization to trigger, the agent must "learn" $E$ at time $t_2$ that they did not possess at $t_1$.
  2.  **The Old Evidence Scenario:** In cases like Einstein and Mercury, the evidence $E$ is already in the agent's corpus at $t_1$. Thus, $P_{old}(E) = 1$.
  3.  **The Mathematical Result:** By the axioms of probability, if $P(E) = 1$, then $P(H|E) = P(H)$.
  4.  **The Consequence:** When Einstein formulated GR, he could not conditionalize on Mercury's perihelion. Mathematically, his credence in GR *should not have changed* due to that evidence.

  **Why this is unique to Bayesianism:**
  POE is not a problem for the *intuition* that old evidence confirms new theories (everyone agrees it does). It is a problem for the **Bayesian engine of updating**. Bayesianism asserts that rational belief change *just is* conditionalization on new data. If the data isn't new, the engine stalls. Therefore, POE demonstrates that standard Bayesian conditionalization is insufficient to model scientific reasoning where theory construction lags behind data collection.

  ---

  ### 2. The Diachronic/Order Problem

  The subtler version of the problem focuses on the **order of arrival**.
  *   **Time $t_1$:** Evidence $E$ is discovered. $P(E) \approx 1$.
  *   **Time $t_2$:** Hypothesis $H$ is formulated.
  *   **Time $t_3$:** Scientists realize $H$ entails $E$.

  In standard Bayesianism, the "boost" in credence for $H$ should occur when the agent learns $E$. But at $t_3$, the agent does not learn $E$; they already know it. They only learn the *relationship* between $H$ and $E$. If Bayesian updating requires conditioning on empirical evidence, and $E$ is no longer empirical news, the increase in credence for $H$ at $t_3$ becomes inexplicable within the standard framework. The theory appears to be confirmed by something the agent already knew, which violates the Bayesian tenet that learning requires uncertainty reduction.

  ---

  ### 3. Proposed Fix 1: Counterfactual Credences

  **The Proposal:**
  To restore the probability shift, proponents suggest we should not look at the agent's *actual* credence function at $t_2$ (where $P(E)=1$), but rather a **counterfactual credence function**. We ask: "What would the agent's credence in $H$ have been if they had *not* yet known $E$?"
  Let $P^*$ be this counterfactual function where $P^*(E) < 1$. If $P^*(H|E) > P^*(H)$, then $E$ confirms $H$ relative to that counterfactual state.

  **Why It Fails to Dissolve the Problem:**
  1.  **The Problem of "Unlearning" (Holism):** It is arguably impossible to coherently construct $P^*$. Beliefs are holistically connected. If you remove $E$ (Mercury's orbit) from a 19th-century astronomer's belief system, you must also remove all theories that relied on $E$, all instruments calibrated using $E$, and potentially background assumptions about gravity. There is no unique, rational way to subtract $E$ without collapsing the entire web of belief.
  2.  **Normative Irrelevance:** Even if we could construct $P^*$, why should it dictate rational belief *now*? Epistemology is generally concerned with what an agent should believe given their *actual* current state, not given a fictional historical state. If I know $E$ is true, my rational confidence in $H$ should depend on my current knowledge, not on a fantasy version of myself that was ignorant of $E$.
  3.  **Subjectivity:** Different agents can construct different counterfactual states. If confirmation depends on how we imagine "unlearning" evidence, confirmation becomes arbitrary.

  ---

  ### 4. Proposed Fix 2: Garber-Style Solutions (Logical Omniscience)

  **The Proposal:**
  Daniel Garber (1983) offered a more technical solution based on the fact that standard Bayesianism assumes **Logical Omniscience** (agents know all logical consequences of their beliefs). Real agents do not.
  Garber suggests expanding the probability space to include propositions about logical relationships.
  *   Let $Q$ be the proposition: "$H$ entails $E$" ($H \vdash E$).
  *   At $t_2$, the agent knows $E$ ($P(E)=1$) and has formulated $H$, but does not yet know $Q$. So $P(Q) < 1$.
  *   At $t_3$, the agent learns $Q$.
  *   The agent conditionalizes on $Q$, not $E$.
  *   Mathematically, it can be shown that $P(H | E \land Q) > P(H | E)$, allowing $H$ to receive a boost when the entailment is discovered.

  **Why It Fails to Dissolve the Problem:**
  1.  **Confirmation vs. Realization:** This solution explains why the agent's *psychological confidence* increased (they learned a new fact about their theory), but it struggles to explain why the *evidential support* exists. Learning that "$H$ entails $E$" is a piece of mathematical/logical news, not empirical news. Critics argue this reduces confirmation to a form of conceptual clarification. It explains why Einstein was *excited*, but not why Mercury's orbit is *evidence* for GR.
  2.  **The "New Information" Objection:** If the boost comes from learning $Q$ ($H \vdash E$), then *any* hypothesis that entails $E$ gets confirmed when we realize the entailment. This risks decoupling confirmation from the empirical content of $E$. The support seems to come from the logical relation, not the empirical fit.
  3.  **Complexity and Tractability:** This requires a non-standard probability language (a language that can refer to its own sentences). While mathematically coherent, it moves Bayesianism away from a simple model of empirical learning into a complex model of logical introspection. It solves the math by changing the subject from "updating on evidence" to "updating on logical insights."

  ### Summary

  The Problem of Old Evidence remains a genuine problem for Bayesian conditionalization because it exposes a mismatch between the **mathematics of learning** (which requires $P(E) < 1$) and the **history of science** (where theories often explain pre-existing data).

  *   **Counterfactual solutions** fail because they rely on incoherent historical fictions that lack normative force for current belief.
  *   **Garber-style solutions** fail because they shift the source of confirmation from the empirical evidence $E$ to the logical insight $H \vdash E$, which many argue captures the *discovery* of support rather than the *existence* of support.

  Consequently, POE suggests that standard Bayesian conditionalization is an incomplete model of scientific rationality, requiring significant modification to account for the diachronic reality of theory construction.
