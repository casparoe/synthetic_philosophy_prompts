          2.  *Ironic/Critical:* The Sovereign Individual is suspiciously close to the metaphysical subject (*causa sui*) Nietzsche critiques elsewhere, and represents herd virtues (reliability, calculability) rather than true self-overcoming.
      *   **Format:** Dialogue between two Nietzsche scholars (post-seminar, over coffee).
