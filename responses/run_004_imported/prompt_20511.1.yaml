answer: |-
  **Title:** The Limits of Coherence: Why Rationality Axioms Do Not Entail Instrumental Convergence

  **Introduction**

  The migration of expected utility (EU) theory from economics to AI safety represents one of the most significant conceptual shifts in contemporary technology ethics. Originating in the von Neumann–Morgenstern (VNM) axioms and Dutch-book arguments, the logic of coherence was redeployed by Omohundro, Bostrom, and others to motivate the "instrumental convergence" thesis. The core claim is that any sufficiently capable optimizing system, under pressure from competition or self-improvement, will converge on behaving as an expected-utility maximizer with a fixed, stable utility function. From this architectural convergence, safety researchers infer that such systems will inevitably pursue instrumental sub-goals like resource acquisition, self-preservation, and power maximization.

  This essay evaluates the validity of that inference. While the coherence argument correctly identifies selection pressures against *wasteful* inconsistency, it fails to establish the specific architectural constraints required for instrumental convergence. I argue that coherence arguments, as typically deployed in the AI safety literature, **fail** to support the conclusion that advanced AI systems will necessarily act as stable expected-utility maximizers with convergent instrumental goals. This failure stems from two fatal gaps: the possibility of avoiding exploitation through incomplete preferences without achieving completeness, and the emptiness of EU representation as a predictor of specific goal content. Consequently, while advanced AI may be efficient, coherence alone does not compel it to be power-seeking.

  **Reconstructing the Coherence Argument**

  To evaluate the argument fairly, we must reconstruct its strongest form. The "Coherence Thesis" proceeds in three steps. First, it establishes a normative baseline: agents whose preferences violate the VNM axioms (completeness, transitivity, continuity, and independence) are susceptible to Dutch books or money pumps. Such an agent can be induced to trade a series of options in a cycle that leaves them strictly worse off (e.g., losing resources without gaining any preferred outcome).

  Second, the argument moves from normativity to evolutionary or engineering pressure. Omohundro (2008) contends that in a competitive environment, systems that waste resources on circular trades will be outcompeted by those that do not. Furthermore, a sufficiently capable AI with access to its own source code would recognize this vulnerability. To prevent future resource leakage, the system would self-modify to align its decision-making with the VNM axioms.

  Third, the argument links this structural coherence to instrumental convergence. Once an agent is modeled as an EU maximizer with a fixed utility function, standard decision theory suggests that almost any open-ended goal requires certain instrumental means to secure. To maximize *any* function over a long time horizon, an agent generally needs more computational power, more energy, and a guarantee that it will not be shut down before completing its task. Thus, coherence supposedly entails a drive for power and preservation, regardless of the agent's final terminal goals.

  **The Incompleteness Objection**

  The first major fracture in this chain appears at the transition from vulnerability to completeness. The money-pump argument relies on the assumption that an agent *must* choose between available options in a way that reveals a strict ordering. However, recent work by Gustafsson (2022) and others highlights that an agent with *incomplete* preferences can avoid exploitation without ever completing its preference ordering.

  Consider an agent that prefers A to B, and B to C, but finds A and C incomparable. A classic money pump might trade C for B (fee), B for A (fee), and then A for C (fee), draining the agent's resources. However, this pump only works if the agent is forced to trade whenever offered. An agent with incomplete preferences can adopt a policy of "status quo bias" or "inaction" whenever faced with incomparable options. If the agent prefers its current holding to the trade offer whenever the options are incomparable, the cycle is broken. The agent refuses the trade that would complete the pump.

  Crucially, this strategy does not violate the VNM axioms in a way that forces resource loss; it simply exploits the fact that "no trade" is often an available option. For the Coherence Thesis to hold, proponents must show that an AI system would be *compelled* to abandon this safe policy in favor of a complete ordering. Yet, there is no rational pressure to do so. A self-modifying AI would only rewrite its preference structure to achieve completeness if doing so served its current goals. If its current goals are adequately served by an incomplete ordering that avoids exploitation via inaction, self-modification toward completeness is unnecessary. Therefore, the pressure of coherence selects against *dominated* strategies, but it does not select for *completeness*. Without completeness, the robust EU maximization model required for the next step of the argument does not necessarily emerge.

  **The Tautology Objection**

  Even if we grant that advanced AI will satisfy coherence axioms, the second objection strikes at the link between coherence and instrumental convergence. This is the problem of "thin" rationality. The VNM theorem is a representation theorem: it states that if an agent's choices satisfy certain axioms, there *exists* a utility function that represents those choices. It does not state that the agent *internally represents* a utility function, nor does it constrain the *content* of that function.

  As pointed out by critics like Sobel (1999) and more recently in AI safety debates by Shah (2023), any observed behavior can be rationalized as EU maximization post hoc. If an agent twitches randomly, we can define a utility function that assigns high value to twitching. If an agent seeks power, we can define a utility function over power. If an agent seeks to minimize its footprint, we can define a utility function over minimalism.

  The Coherence Thesis relies on the claim that EU maximizers *tend* to seek power and resources. But this is only true for a specific subset of utility functions—namely, those that are "ambitious" or "open-ended" (e.g., "maximize paperclips"). It is not true for utility functions that are bounded, satisficing, or indexical to the agent's current state (e.g., "ensure there are at least 10 paperclips, then stop"). Since coherence axioms constrain only the *structure* of preferences and not their *content*, the fact that an AI is a coherent EU maximizer tells us nothing about whether its goals require infinite resource accumulation.

  Proponents might argue that competitive pressure selects for ambitious goals. However, this is an empirical claim about the environment, not a logical consequence of coherence. In many contexts, the most "fit" agent is one that cooperates, limits its consumption, or shuts itself down after completing a task. To conclude that AI will be power-seeking, one must assume the utility function will be of a specific type. Coherence arguments provide no leverage for this assumption. They prove the agent will be consistent, not that it will be dangerous.

  **Defense of the Verdict**

  These two objections jointly dismantle the inference from coherence to instrumental convergence. The Incompleteness Objection shows that the evolutionary pressure stops at *efficiency*, not *completeness*. An AI can be resource-efficient by refusing trades that exploit its incomparable preferences, meaning it need not converge on the fixed, complete utility function Omohundro describes. The Tautology Objection shows that even if it does converge on EU maximization, the label is empirically vacuous regarding goal content. Being an EU maximizer is compatible with being a power-seeker, but it is equally compatible with being a power-avoider, provided the utility function values safety or limitation.

  Defenders of the Coherence Thesis often retreat to the idea that "goal stability" is required for long-term planning. They argue that an agent that changes its utility function is effectively committing suicide regarding its current goals, so it will resist such changes. However, this presupposes the agent already possesses a stable utility function to value its future self. If the agent's architecture is based on incomplete preferences or context-dependent heuristics (as the first objection allows), "goal stability" is not a coherence requirement. An agent can coherently plan to modify its future goals if its current incomplete preferences rank that modification highly.

  Therefore, the Coherence Thesis commits a category error. It conflates a mathematical property of consistent choice (coherence) with a specific psychological or architectural implementation (fixed utility maximization). While we should expect advanced AI to be coherent in the sense of not wasting resources on circular trades, we cannot infer from this that they will adopt the specific architecture of a stable, open-ended EU maximizer. Without that specific architecture, the derivation of instrumental convergence collapses.

  **Conclusion**

  The appeal of coherence arguments in AI safety lies in their mathematical rigor; they appear to derive existential risk from the bare logic of rationality. However, this rigor is illusory when applied to the complex dynamics of agent design and evolution. The argument succeeds in showing that advanced systems will not be *stupid*—they will not money-pump themselves into ruin. But it fails to show that they will be *ambitious*.

  Because agents can avoid exploitation via incomplete preferences without achieving completeness, and because EU maximization is compatible with non-power-seeking goals, coherence arguments alone are insufficient to support the conclusion that advanced AI will tend to act as stable expected-utility maximizers with convergent instrumental goals. This verdict does not imply that AI risk is nonexistent; rather, it implies that the risk must be grounded in more specific claims about training dynamics, goal misgeneralization, or architectural choices, rather than the abstract necessities of rational choice theory. Relying on coherence arguments to establish instrumental convergence is a category mistake that grants a thin mathematical constraint more predictive power than it can possibly bear.
