answer: |-
  **Setting:** *A quiet corner of the department lounge, late afternoon. Rain streaks the window. **Elena** (Adaptationist) is stirring a tea; **Marcus** (Byproduct Theorist) is leaning back in an armchair, holding a copy of Lloyd's* The Case of the Female Orgasm.

  **Marcus:** You know, reading Lloyd again for the seminar, I'm struck by how much of this isn't biology. It's jurisprudence. It's all about the burden of proof.

  **Elena:** Because she treats the byproduct hypothesis as the null?

  **Marcus:** Exactly. Gould's logic in the *Natural History* column is clean: Male and female genitalia develop from the same embryonic tissue. Male orgasm is necessary for ejaculation, which is necessary for reproduction. Female orgasm is physiologically homologous but reproductively superfluous. Therefore, the default assumption must be that it's a developmental side effect, like male nipples. The adaptationist has to prove otherwise.

  **Elena:** And I don't dispute the embryology. The clitoris and penis are homologous structures. But Marcus, homology of origin doesn't lock in function for eternity. Think of feathers. They likely evolved for thermoregulation or display, not flight. Does that mean flight is just a "side effect" of warm dinosaurs?

  **Marcus:** No, because we have evidence that flight confers a fitness advantage that *maintained* the trait. We can model the aerodynamics. With the female orgasm, what's the aerodynamics? The "upsuck" theory? That orgasmic contractions pull sperm into the cervix?

  **Elena:** It's more nuanced than the 1960s version of upsuck. It's about sperm retention and selection. If orgasm correlates with partner quality—say, the symmetry studies we read about—then the physiology could be a mechanism for cryptic female choice. The body isn't just a passive tube; it's filtering.

  **Marcus:** But Lloyd dismantled those studies. The correlation between orgasm frequency and partner symmetry is weak, inconsistent across populations. If the adaptation is that potent, why is the signal so noisy? Why do women report orgasm frequencies that vary wildly regardless of partner quality?

  **Elena:** Because selection isn't an engineer; it's a tinkerer. It works with variation. But here's my pushback on your "default" position. You're arguing that because it *started* as a byproduct of the male blueprint, it *remained* one. But if a trait is physiologically expensive—neural wiring, vascular engorgement, muscular contractions—and it persists across the population, doesn't that demand an explanation? Why hasn't selection pruned it away if it's truly neutral noise?

  **Marcus:** "Expensive" is doing a lot of work there. Compared to gestation or lactation, the metabolic cost of an orgasm is negligible. It's not like growing antlers. If it's not costly, selection doesn't need to prune it. It can just drift.

  **Elena:** Fair. But let's talk about the logic of inference. You're saying that because we haven't found a smoking gun for adaptation, we must assume byproduct. But isn't that just as vulnerable to the "just-so story" critique that Gould leveled at us?

  **Marcus:** How so? I'm asking for evidence of function. That's standard science.

  **Elena:** Is it? Because if I propose a mechanism—say, sperm retention—and you find a study where retention doesn't happen, you can say, "Ah, but maybe it's about pair-bonding." If I find pair-bonding data is weak, you say, "Maybe it's about motivating copulation frequency."

  **Marcus:** That's the adaptationist moving the goalposts.

  **Elena:** But you're doing the mirror image. If I show physiological complexity, you say, "Developmental noise." If I show cross-species continuity, you say, "Phylogenetic inertia." If I show a potential fitness benefit, you say, "Correlation isn't causation." Your position is that *nothing* counts as adaptation unless it meets a bar that might be impossible to clear for a behavioral trait. "Selection didn't touch it" becomes unfalsifiable. You can always say, "We just haven't found the lack of benefit yet."

  **Marcus:** *(Pauses, looking out the window)* That's... a sharp cut. You're saying the null hypothesis can become a shield.

  **Elena:** Exactly. Gould and Lewontin warned against adaptationist storytelling that can explain *anything* after the fact. But a rigid byproduct stance can explain *nothing* before the fact. It shuts down inquiry. If I assume it's a spandrel, why would I bother looking for the function?

  **Marcus:** I see the irony. Gould accused the Panglossians of making evolution an unconstrained optimization story where everything is perfect. But if I treat the byproduct view as an absolute default, I'm making evolution a constrained determinism story where nothing new can be repurposed.

  **Elena:** Right. Exaptation is real. Traits change function. The question is: when do we admit a trait has been co-opted?

  **Marcus:** Okay, let me press you on that co-option. Even if we grant that the neural machinery *could* be co-opted, you need to show that the variation in the trait maps to variation in fitness. With the nipple, there's no variance in male reproductive success based on nipple sensitivity. With the clitoris, you need to show that women who orgasm more leave more surviving offspring. Do you have that?

  **Elena:** In modern contraceptive populations? No. But evolution didn't happen in modern populations.

  **Marcus:** And there it is. The "ancestral environment" defense. It's the ultimate unfalsifiable move. "It was adaptive *then*, even if it isn't *now*."

  **Elena:** *(Smiles wryly)* And your defense is: "It's a byproduct *now*, because we can't see the benefit *now*." We're both hiding in the past.

  **Marcus:** So where does that leave us? If both defaults are potentially unfalsifiable shields...

  **Elena:** Maybe the disagreement isn't about the biology. We both agree on the embryology. We both agree the data is messy. The disagreement is about risk tolerance. You're risk-averse. You'd rather miss a real adaptation than falsely identify one. You fear the ideology of biological determinism—using "nature" to justify social roles.

  **Marcus:** I won't deny that. Gould was worried about the political misuse of adaptationism. If you claim female orgasm is "for" sperm retention, does that imply women *should* prioritize certain partners? It's a slippery slope.

  **Elena:** And I'm risk-tolerant. I'd rather posit a function and be wrong than assume nature is wasteful and miss a mechanism. I fear the ideology of biological arbitrariness—that our bodies are just accidental sculptures. If we assume the orgasm is a byproduct, does that make it less significant? Less worthy of study?

  **Marcus:** No. Male nipples are byproducts, and we study them. But... *(He taps the book)* ...I think you've caught me. I've been treating the Spandrel paper as a verdict, when Gould intended it as a methodological warning. A check on our imagination. But if I use it to stop my imagination entirely, I'm violating the spirit of the paper.

  **Elena:** And if I use adaptationism to imagine functions without constraints, I'm violating the spirit of Darwinism.

  **Marcus:** So the burden of proof isn't a wall. It's a threshold.

  **Elena:** A moving one. Maybe the solution isn't to decide if it's *either* adaptation *or* byproduct. Maybe it started as a byproduct—Gould is right about the embryology—but was later refined by selection.

  **Marcus:** A spandrel that became a load-bearing arch.

  **Elena:** Exactly. The question isn't "Which one is it?" It's "How much of the current variance is due to the original construction, and how much is due to later renovation?"

  **Marcus:** And Lloyd's critique stands for the renovation part: the evidence for the renovation is currently thin.

  **Elena:** Agreed. The "upsuck" mechanism is not proven. But "not proven" isn't "disproven."

  **Marcus:** *(Laughs)* And "plausible" isn't "true."

  **Elena:** Touché.

  **Marcus:** You know, if we write this up, we're not going to solve the orgasm debate.

  **Elena:** No. But we might solve the seminar assignment. The professor wanted to know if this was about evidence or burden of proof.

  **Marcus:** It's about burden of proof. The evidence is the same for both of us. It's the messy, noisy data Lloyd surveyed. The split is purely methodological. I require a higher standard to reject the null hypothesis of non-adaptation than you do to propose an alternative.

  **Elena:** Because I think the cost of a false negative—missing a real function—is higher than the cost of a false positive.

  **Marcus:** And I think the cost of a false positive—telling a just-so story that becomes dogma—is higher.

  **Elena:** So we're not disagreeing on the biology of the clitoris. We're disagreeing on the epistemology of inference.

  **Marcus:** *(Stands up and stretches)* Well. At least we can agree that the human brain is an adaptation for overthinking.

  **Elena:** *(Standing)* Careful, Marcus. Don't tell Gould it might be a byproduct of needing bigger skulls for thermoregulation.

  **Marcus:** *(Grinning)* I'll stick to the spandrel. It's safer. Coffee?

  **Elena:** Tea. But I'll walk with you.

  *(They exit the lounge, the debate unresolved but the terms of engagement clarified.)*
