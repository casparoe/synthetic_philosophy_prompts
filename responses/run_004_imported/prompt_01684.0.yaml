answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The graduate seminar on Underdetermination has just concluded. Two philosophers, ELENA and MARCUS, are pouring coffee.*

  **Elena:** That was a lively session. Though I noticed the students seemed frustrated. They want to know if underdetermination kills realism or not, and we spent two hours telling them "it depends on what you mean by 'evidence'."

  **Marcus:** (Laughs) Well, because it *does* depend on that. But I think their frustration stems from expecting a logical proof where there's only a methodological assessment. If you define underdetermination as the logical possibility of empirically equivalent rivals, then yes, it exists. But if you ask whether it stops us from rationally believing in electrons, the answer is no.

  **Elena:** There it is. That slide from "logical possibility" to "rational belief." That's the move I'm worried about. You're treating underdetermination as a practical hurdle to be cleared by good housekeeping—checking your auxiliary hypotheses, weighing your theoretical virtues. I see it as a structural feature of the relation between world and word.

  **Marcus:** But isn't that exactly the terminological slip? You're treating "evidence" as strictly observational data points. I'm treating evidence as the total epistemic situation, which includes how well a theory organizes those points. If Theory A and Theory B save the phenomena equally well, but A is coherent with background knowledge and B requires ad hoc exceptions at every turn, they aren't underdetermined *relative to our total evidence*.

  **Elena:** See, that's where I think we talk past each other. You're smuggling the solution into the definition of the problem. By expanding "evidence" to include "theoretical virtues," you make underdetermination vanish by fiat. But why should simplicity or coherence count as *evidence* of truth? They might be evidence of *usability*. Maybe the world is messy, and our preference for simple theories is just a cognitive limitation. If so, underdetermination remains: the data allows for the messy theory, but we reject it for pragmatic reasons, not truth-tracking ones.

  **Marcus:** That's a fair challenge, but it assumes a dichotomy between "pragmatic" and "truth-tracking." Why can't a virtue be both? If the universe weren't structured in a way that allowed for simplification and unification, science wouldn't work. The success of IBE—Inference to the Best Explanation—suggests these virtues *are* truth-conducive. When you say "the data allows for the messy theory," you're assuming a naive falsificationism. We don't just count data points; we evaluate explanatory power.

  **Elena:** I'm not assuming naive falsificationism. I'm assuming the Duhem-Quine thesis. Any theory can be saved from refutation if we're willing to make drastic enough adjustments elsewhere in the web of belief. So, for any theory T, there is a rival T* that fits the data. You say T* is "ad hoc." I ask: Ad hoc relative to what? Relative to our current background assumptions. But those assumptions are just earlier theories that were themselves underdetermined. You're grounding rational choice in a shifting sand of prior pragmatic choices.

  **Marcus:** But the shifting sand settles, Elena. We aren't choosing in a vacuum. We have causal mechanisms, independent lines of measurement, instrumental reliability. The "empirical equivalence" you rely on is almost always transient. Historically, when we have two empirically equivalent theories, new technology or new domains of inquiry eventually break the tie.

  **Elena:** "Eventually." That's the transient vs. permanent distinction. But the skeptic isn't worried about next year's particle accelerator. The worry is about *now*. At any given time *t*, if justification is constrained by evidence at *t*, and the evidence at *t* underdetermines the ontology, then our belief in that ontology is, strictly speaking, unjustified. You're deferring the problem to the future.

  **Marcus:** I'm not deferring it; I'm contextualizing it. You're demanding a kind of ahistorical, God's-eye justification. You want to know if the evidence *logically entails* the theory. But science doesn't deal in entailment; it deals in warrant. If I ask you, "Are you justified in believing the sun will rise tomorrow?" you don't say, "No, because a black hole could appear overnight." You say, "Yes, based on the best available model." Underdetermination only looks like a crisis if you demand deductive certainty.

  **Elena:** I don't demand deductive certainty. I demand a non-circular reason to prefer truth-conduciveness over pragmatic utility. Here's my worry: We agree on the facts of the case. We agree that scientists use virtues like simplicity. We agree that multiple mathematical formulations can map to the same data. The disagreement is about the *label*. You call the selection of the simple theory "rational adjudication." I call it "pragmatic constraint."

  **Marcus:** And the difference matters because...?

  **Elena:** Because if it's pragmatic, realism is in trouble. If I choose Newtonian mechanics over a convoluted Cartesian vortex theory because it's simpler, I'm saying it's *better for me*, not necessarily *true of the world*. If underdetermination is a fundamental epistemological limit, then scientific realism should be tempered. We should be structural realists, or instrumentalists. But if you define underdetermination away by saying "virtues count as evidence," you preserve realism but change the meaning of evidence.

  **Marcus:** Okay, let's pause there. I think you've hit the nerve. You think I'm changing the meaning of evidence. I think you're restricting the meaning of "rational." Look, if I have two maps of a city. One is a chaotic scribble that marks every building correctly. The other is a schematic that groups districts and shows main arteries. Both are "empirically adequate" regarding location. But the second map helps me navigate.

  **Elena:** Navigation is pragmatic. Truth is correspondence.

  **Marcus:** But what if the reason the schematic works is that the city *is* organized by districts? Then the map isn't just useful; it captures the structure of the city. My point is: Explanatory power isn't just in the head. It's a relation between the theory and the world's causal structure. When a theory unifies disparate phenomena, that unification is often a discovery, not an imposition.

  **Elena:** I grant that unification *can* be a discovery. But underdetermination highlights the moments where we *can't* tell the difference between discovery and imposition. That's the gap. You're arguing that because we *sometimes* bridge the gap, the gap doesn't exist. I'm arguing that because the gap *can* exist, we need to be careful about claiming we've crossed it.

  **Marcus:** So, is this just a difference in risk tolerance? You want to avoid false positives (believing a theory is true when it's just useful). I want to avoid false negatives (rejecting a true theory because a skeptical rival is logically possible).

  **Elena:** Maybe. Or maybe it's about the scope of the "theory" we're evaluating. When you talk about underdetermination being solved, you're usually talking about specific, local cases—like the choice between Copernican and Tychonic systems once we account for stellar parallax. In those cases, yes, the evidence breaks the tie. But the philosophical thesis of underdetermination is usually global. It's about the relation between *any* possible evidence and *any* possible theory.

  **Marcus:** And I think the global thesis is a phantom. It's a skeptic's toy. It has no bite in actual science. If a philosophical problem doesn't change how we practice or evaluate science, is it a problem for *science*, or just for a certain picture of justification?

  **Elena:** That's the crux, isn't it? You think philosophy of science should be naturalized, continuous with scientific practice. If science ignores global underdetermination, philosophy should too. I think philosophy's job is to analyze the foundations, even if the scientists are too busy doing the work to worry about them. If the foundation is logically shaky, it's my job to point it out, even if the house stands.

  **Marcus:** But if pointing it out relies on a definition of "foundation" that the inhabitants don't recognize, you're not analyzing their house. You're analyzing a blueprint they aren't using. If scientists treat explanatory coherence as evidential, and you say "that doesn't count as evidence," you aren't studying scientific rationality. You're studying an idealized logic that doesn't exist.

  **Elena:** (Sips coffee) So, we're back to the terminology. You define "rational belief" as "what a competent scientist concludes using standard methods." I define it as "what is supported by the logical force of the evidence alone."

  **Marcus:** I'd say I define it as "what is supported by the total epistemic warrant," which includes logic *and* explanation. You're isolating logic from the rest of our cognitive toolkit and calling that "pure" justification. I'm saying that's an artificial amputation.

  **Elena:** And I'd say you're conflating "what we cannot help but believe" with "what we are justified in believing." We can't help but prefer simple theories. That's psychological. Whether that preference tracks truth is metaphysical. Underdetermination exposes the gap between the psychology and the metaphysics.

  **Marcus:** I suppose we might have to agree that we weigh that gap differently. I think the "No Miracles" argument bridges it. It would be a miracle if our pragmatic virtues consistently led to successful prediction without them tracking truth.

  **Elena:** And I think that assumes the success is more robust than it is. We have plenty of successful theories that we now know were false. Caloric, phlogiston, the luminiferous ether. They were simple, unifying, and empirically adequate for their time. They were also underdetermined by the data available then, just as our current theories are underdetermined now.

  **Marcus:** But we learned *from* them. We didn't just discard them; we absorbed their structural insights. That's why I'm a structural realist, mostly. But even then, I maintain that the underdetermination at time *t* doesn't invalidate the rationality of belief at time *t*.

  **Elena:** (Smiles) So, you concede the belief might be false?

  **Marcus:** I concede fallibility. I don't concede irrationality.

  **Elena:** And I concede rationality within the system. I just question the system's grip on the world.

  **Marcus:** Then perhaps the disagreement isn't about underdetermination itself. It's about whether philosophy's job is to validate the scientific image or to interrogate its limits.

  **Elena:** I can accept that. Though I'd argue that interrogating the limits *is* a way of validating the image—by keeping it honest. If we tell students underdetermination is "solved," they stop looking for the hidden assumptions.

  **Marcus:** And if we tell them it's a "fundamental crisis," they stop believing anything at all.

  **Elena:** (Laughs) Touché. Maybe the pedagogical solution is to teach the tension itself. Not as a problem to be solved, but as a condition to be managed.

  **Marcus:** That sounds like the only honest answer. The evidence underdetermines the theory, but it doesn't underdetermine the *choice*. And for a scientist, that's what matters.

  **Elena:** And for a philosopher, the distinction between the two is everything.

  **Marcus:** Then we haven't wasted our time.

  **Elena:** No. We've just localized the underdetermination to our own meta-philosophical commitments.

  **Marcus:** I suppose that's fitting.
