      *   *Critique:* Is Elena too radical (anti-realist)?
      *   *Fix:* Position her as a cautious realist or a structural realist who worries about *specific* ontological claims, not necessarily science as a whole. Or just a skeptic about justification. Let's make her a skeptic about *justification* specifically.
      *   *Focus on the Prompt's Hint:* The prompt suggests the disagreement is terminological. I need to make sure they explicitly discuss *how* they define "evidence" and "theory."
      *   *Tone:* Academic but conversational. Avoid overly dense jargon without explanation.

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Start:* Coffee shop setting.
      *   *Elena's opening:* "It's the logical gap."
      *   *Marcus's counter:* "But we don't reason deductively."
      *   *Deep Dive:* The status of simplicity. Is it a guide to truth or just cognitive ease?
