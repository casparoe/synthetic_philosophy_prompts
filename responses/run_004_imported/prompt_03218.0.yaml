answer: |-
  This is exactly the right question to be asking. You have identified the precise friction point where teleosemantics moves from "promising naturalism" to "metaphysical heavy lifting." Your suspicion that the indeterminacy might just get relocated from the causal relation to the functional description is shared by many critics (most notably Godfrey-Smith and Fodor himself).

  Here is the breakdown of the mechanical move Millikan (and Neander) makes to block the disjunction, followed by an honest assessment of whether it holds water.

  ### 1. The Mechanism: Consumer Semantics and "Normal Conditions"

  To see how teleosemantics attempts to solve the disjunction problem (Fly vs. BB vs. Speck), you have to stop looking at the **Producer** of the mental state (the visual detector) and start looking at the **Consumer** (the motor system that snaps the tongue).

  In a simple causal theory, content is determined by what *causes* the state. Since both Flies and BBs cause the state, the content is indeterminate (Fly $\lor$ BB).

  In Millikan's teleosemantics, content is determined by **what the state is supposed to do for the system that consumes it.**

  #### The Steps of the Argument:
  1.  **Identify the Proper Function of the Consumer:** The neural state (the "fly signal") is consumed by the snapping mechanism. What is the *Proper Function* of the snapping mechanism? It is not merely "to extend the tongue." It is "to ingest nutrition." This is determined by selection history: ancestors who snapped at things that provided nutrition survived; those who snapped at rocks or air did not.
  2.  **Define "Normal Conditions":** This is the crucial technical move. For Millikan, "Normal conditions" are **not** statistical averages (i.e., "what usually happens"). They are **normative/historical conditions required for the Proper Function to be executed.**
      *   Normal conditions are the conditions under which the consumer successfully performs its Proper Function *as it was selected to do*.
  3.  **Determine Content via Mapping:** The content of the producer's signal is defined as **the state of affairs that must obtain for the consumer to perform its Proper Function under Normal conditions.**

  #### Applying it to the Frog:
  *   **Signal:** Neural firing $N$.
  *   **Consumer:** Tongue snap.
  *   **Proper Function:** Ingest nutrition.
  *   **Scenario A (Fly):** $N$ fires $\rightarrow$ Snap $\rightarrow$ Fly caught $\rightarrow$ Nutrition ingested. (Function succeeds).
  *   **Scenario B (BB Pellet):** $N$ fires $\rightarrow$ Snap $\rightarrow$ BB caught $\rightarrow$ No nutrition. (Function fails).

  **The Solution to Disjunction:**
  If the content of $N$ were "Small Dark Moving Speck," then the presence of a BB should satisfy the truth conditions of $N$. If $N$ is true when a BB is present, then the consumer *should* succeed when a BB is present. But the consumer *fails* (biologically speaking) when a BB is present. It does not achieve its Proper Function (nutrition).

  Therefore, the condition required for the consumer to succeed is not "Speck," but "Nutritious Fly." The content is fixed by the **success conditions of the consumer**, not the **causal history of the producer.**

  This is why Millikan pushes the content to the consumer side. The producer (eye) can malfunction or be tricked (by a BB). The content is determined by what the *system as a whole* needs to be true in order to do its job.

  ### 2. The Harder Objection: "Fly" vs. "Nutritious Thing"

  You asked: *Why is the selected-for content "fly" rather than "nutritious ingestible thing"?*

  This is the **Individuation of Function** problem. If the Proper Function is "ingest nutrition," then the content of $N$ is "Food." If the Proper Function is "catch flies," the content is "Fly." Teleosemantics relies entirely on biology to settle this, but biology is often messy.

  **Millikan's Move:**
  She argues that we look at the **specific mapping** that was selected. The frog's visual system is not a general "food detector." It is specifically tuned to the visual signature of flies.
  *   If the content were "Nutritious Thing," then if a nutritious worm appeared and the frog *failed* to snap (because the worm doesn't look like a fly), the frog would be forming a *false belief* (failing to represent the food).
  *   But intuitively, and biologically, the frog isn't making a mistake by ignoring the worm. The system is not designed to detect worms. It is designed to detect flies *in order to* get nutrition.
  *   Therefore, the content is "Fly." The "Nutrition" part is the *consequence* of the content being true, not the content itself. The content is the **intermediate condition** required to trigger the consumer's specific mechanism.

  **The "Normal Explanation" Block:**
  Millikan argues that the "Normal explanation" for the survival of the frog's ancestors appeals specifically to the correlation between *that specific neural state* and *flies*. There is no selection history for "nutritious things" in general, only for the specific subset of nutritious things (flies) that triggered the mechanism. The indeterminacy is blocked by the **specificity of the historical correlation.**

  ### 3. Honest Assessment: Does it actually work?

  Here is the seminar-level critique. Teleosemantics is widely regarded as the best naturalistic game in town, but your intuition that it "kicks the can" is largely vindicated by the literature.

  #### Where it Wins (The Error Problem)
  Teleosemantics decisively beats simple causal theories on the **problem of error**.
  *   **Causal Theory:** If BBs cause snaps, "Snap" represents (Fly $\lor$ BB). Snapping at a BB is a *true* representation. Error is impossible.
  *   **Teleosemantics:** "Snap" represents Fly. Snapping at a BB is a *false* representation (a malfunction).
  *   **Verdict:** This is a massive victory. It naturalizes falsity.

  #### Where it Kicks the Can (The Indeterminacy Problem)
  Your suspicion is correct: the indeterminacy is relocated from semantics to **biology**.

  1.  **The Grain of Function:** There is no biological fact of the matter that definitively says the function is "catch flies" rather than "catch food." Selection acts on survival outcomes. If catching flies *was* the way they got food, both descriptions fit the history equally well. Millikan relies on the "specificity of the mechanism," but critics argue this is just asserting the conclusion. If the mechanism is "retinal stimulation detector," the content is "retinal stimulation." If it's "fly detector," it's "fly." Teleosemantics assumes we can carve nature at the joints of "functions," but function individuation is notoriously slippery.
  2.  **The Distality Problem (Godfrey-Smith):** Why is the content the *fly* (distal) and not the *retinal stimulation* (proximal)? Both are necessary conditions for the consumer's success. Without retinal stimulation, the frog doesn't snap. Without the fly, the frog doesn't eat. Teleosemantics wants to say the content is the fly because that's what matters for survival. But the selection pressure technically acts on the *correlation* between the internal state and the distal object. If the correlation breaks (hallucination), the theory handles it, but it struggles to explain why the content "reaches out" to the fly rather than stopping at the sensory interface.
  3.  **Swampman and Novelty:** If a molecule-for-molecule duplicate of the frog (Swampman) pops into existence without a history, Millikan says it has no mental content (no Proper Functions). Most intuitions say Swampman *does* have content. This suggests teleosemantics might be missing something about the *current* causal role, implying the historical story isn't the whole picture.

  #### The Verdict
  Teleosemantics does not **logically eliminate** indeterminacy; it **naturalizes** it.

  It says: "The content is determinate *relative to a specific description of the evolutionary function*."
  *   If you describe the function as "respond to specks," content is "speck."
  *   If you describe the function as "eat flies," content is "fly."

  Millikan argues evolutionary biology *forces* the latter description. Critics argue evolutionary biology is compatible with multiple descriptions, and teleosemantics lacks the resources to choose between them without smuggling in intentional terms (e.g., "The system is *for* catching flies").

  **Summary for your seminar:**
  The teleosemantic move blocks the disjunction by shifting the truth-conditions from **what caused the signal** to **what allows the consumer to succeed.** It solves the **Error Problem** (BBs are false) but arguably exacerbates or merely relocates the **Indeterminacy Problem** (Fly vs. Food vs. Speck depends on how we individuate the Proper Function). It doesn't solve indeterminacy *a priori*; it bets that evolutionary biology will provide a determinate answer to "What is this trait for?"—a bet that many philosophers of biology find risky.
