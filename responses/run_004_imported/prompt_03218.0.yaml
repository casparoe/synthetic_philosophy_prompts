prompt: |-
  So I'm auditing a phil of mind seminar this semester and we just spent two weeks on teleosemantics (Millikan, Neander, Papineau) as a way of naturalizing mental content, and I think I've got the basic pitch down -- a frog's snapping response represents "fly" because eating flies is what that mechanism was selected for, back in the evolutionary day. What I'm stuck on is how this is actually supposed to solve the disjunction/indeterminacy problem that plagues causal and informational theories of content. Like, why is the selected-for content "fly" rather than "small dark moving speck" or even "nutritious ingestible thing," given that all of those properties were equally present (and equally responsible for the trait's fitness payoff) throughout the relevant selection history -- frogs snap at BB pellets too, after all, so it's not like the mechanism is even tracking flies-as-such.

  Everyone in seminar kept citing Millikan as having basically solved this with her notion of "Normal explanations" and consumer-based content, but when I went back to the reading I honestly couldn't tell if the indeterminacy actually gets resolved there or just gets relabeled and pushed onto the consumer side of the system instead of the detector side. Can you walk me through how the standard teleosemantic move is supposed to work here (something about which "level" of function is the relevant Normal explanation?), and then give me your honest take on whether it actually pins down a determinate content or just kicks the can down the road. Not looking for the wikipedia-level summary of what teleosemantics is btw, more the actual mechanics of how the normal-conditions move is meant to block the disjunction in a case like this.
