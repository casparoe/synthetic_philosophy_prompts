answer: |-
  This is a fascinating case study that mirrors a central debate in the philosophy of promising: the **Interpersonal View** (promises require a promisee with claim-rights) versus the **Intrapersonal View** (promises can be binding on the self through integrity or rational consistency). Since you are writing a dissertation on this, I will analyze the exchange using the relevant theoretical frameworks (e.g., Scanlon, Shiffrin, Rosati) to evaluate who holds the stronger philosophical position at each juncture.

  ### Move-by-Move Analysis

  **(1) Nadia:** *Claims the promise was real because it was spoken aloud and meant.*
  *   **Analysis:** Nadia relies on a **performative view** of promising: the utterance + sincerity creates the obligation. She implicitly argues that externalizing the vow solidifies it.
  *   **Verdict:** **Owen.** Mere utterance does not determine the *direction* of the obligation. One can speak a resolution aloud without inviting another party into the normative relationship. The physical location of the speech act (in a room with Nadia) does not automatically make Nadia the promisee. Owen is right that the *addressee* matters more than the *witness*.

  **(2) Owen:** *Distinguishes self-promises from interpersonal promises via the "claim-right" criterion.*
  *   **Analysis:** This is the standard **Will Theory** or **Claim-Right Objection** (often associated with Scanlon or Rawls). Owen argues that obligations require a second party who holds the power of waiver (release). If the promisor and promisee are identical, the power to release is trivial, negating the binding force.
  *   **Verdict:** **Owen.** This is the strongest theoretical move in the exchange. It correctly identifies the structural difference between moral obligations (owed to others) and prudential resolutions (owed to self). Unless Nadia can show she acquired a right to hold him accountable, Owen's distinction holds.

  **(3) Nadia:** *Points to the secrecy/hiding as evidence of recognized wrongdoing.*
  *   **Analysis:** Nadia shifts to **phenomenology**. She argues that Owen's behavior (hiding the lapse) reveals his own implicit acknowledgment of a normative violation. If it were merely a preference change, transparency would be expected.
  *   **Verdict:** **Nadia.** This is her strongest move. Owen's theory must account for the *feeling* of guilt. If it were merely a failed diet, hiding it is less rational than admitting a change of preference. The secrecy suggests Owen felt accountable *to someone* (perhaps Nadia, perhaps his future self), which challenges Owen's claim that "no one was wronged."

  **(4) Owen:** *Reframes the guilt as self-disappointment (New Year's resolution style).*
  *   **Analysis:** Owen offers an **error theory** of Nadia's phenomenological point. He argues that feelings of shame or awkwardness do not prove moral wrongdoing; they can arise from failing to meet prudential standards or damaging one's self-trust.
  *   **Verdict:** **Owen.** He successfully neutralizes Nadia's previous point. We often feel shame about weakness of will (akrasia) without believing we have committed a moral transgression against another. He maintains the distinction between *moral guilt* and *prudential regret*.

  **(5) Nadia:** *Argues that the ability to self-release is exactly what makes the commitment demanding.*
  *   **Analysis:** Nadia attacks the **cancellation objection**. She argues that the *difficulty* of holding oneself accountable is the source of the value. If self-binding were impossible, integrity would be meaningless. She is arguing for a **Virtue Ethics** approach to promising (focus on character) rather than a Deontological one (focus on rights).
  *   **Verdict:** **Nadia.** This is a profound philosophical point. She correctly identifies that the "triviality of release" is only a problem if we view promises as external constraints. If we view them as internal tests of integrity, the fact that he *could* release himself but *shouldn't* have is precisely what gives the act weight. Owen struggles to answer why this specific failure feels different from skipping a gym session without conceding some normative force.

  **(6) Owen:** *Warns against "inflating" failures of will into moral betrayals.*
  *   **Analysis:** Owen appeals to **conceptual economy**. He argues that categorizing every broken resolution as a "broken promise" dilutes the specific moral gravity of interpersonal promises. He defends the boundary between the moral and the prudential.
  *   **Verdict:** **Owen.** He wins on categorization. While Nadia identifies a normative failure, Owen is correct that labeling it a "promise" in the strict philosophical sense conflates two different normative domains. Maintaining the distinction is crucial for moral theory (e.g., restitution is owed for broken promises, but not for broken diets).

  ### Hidden Ambiguities and Talking Past Each Other

  There are two primary ambiguities driving the disagreement:

  1.  **The Definition of "Promise":**
      *   **Owen** is using a **narrow, interpersonal definition**: A promise is a speech act that creates a claim-right in a distinct promisee.
      *   **Nadia** is using a **broad, normative definition**: A promise is any solemn commitment that generates a binding reason for action, regardless of the recipient.
      *   *Result:* They agree a normative failure occurred, but disagree on whether the label "promise" applies. Owen is defending the *category*, while Nadia is defending the *force*.

  2.  **The Role of the Witness:**
      *   Nadia implies that by speaking *in front of her*, Owen implicitly invited her accountability (making it interpersonal).
      *   Owen insists that because he addressed *himself* ("I promise myself"), Nadia remained a bystander.
      *   *Result:* They are disagreeing on the **conditions of uptake**. Did Nadia's presence constitute an invitation to hold him accountable, or was she merely an audience to a monologue?

  ### Missing Considerations

  To settle this for your dissertation, consider these two factors neither raised:

  1.  **The Invitation to Hold Accountable:** Even if the promise was *to himself*, did Owen implicitly authorize Nadia to enforce it by speaking publicly? Some theorists (like Seana Shiffrin) argue that promising involves inviting the promisee to hold one accountable. If Owen knew Nadia would care (given his previous losses), his public declaration might have created a secondary, interpersonal obligation to *her* not to deceive her about his status, even if the primary obligation was to himself.
  2.  **The "Future Self" as Other:** Derek Parfit's reductionist view suggests the "future self" is psychologically distinct enough from the "present self" to count as "another person." If the present self promises the future self, the "two distinct parties" requirement might be met internally. Owen dismisses this, but it is a viable counter-argument to his Move 2.

  ### Overall Verdict

  While Nadia successfully identifies that a genuine normative failure occurred (a violation of integrity and self-trust), Owen is philosophically more precise regarding the specific mechanics of **promissory obligation**.

  Nadia conflates **prudential rationality** (being good to oneself) with **moral obligation** (being good to another). For the purposes of a dissertation on *promissory* obligation, Owen's distinction is vital: without a distinct promisee who holds a claim-right, the "obligation" lacks the specific features of promising (e.g., the right to release, the right to compensation, the right to blame). Nadia proves Owen failed a resolution; Owen proves he did not break a promise in the strict sense.

  \answer{Owen}
