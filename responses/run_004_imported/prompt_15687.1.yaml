answer: |-
  The room smelled of ozone and stale tobacco, a scent that seemed to cling to the walls regardless of how many air filters hummed in the corner. Elena sat in a vinyl chair that cracked when she shifted her weight. Across from her, behind a desk cluttered with schematics and empty coffee cups, sat Miller. He looked like a man who had spent too long listening to static.

  In the center of the room stood the machine. It wasn't sleek. It was a brass-and-bakelite monstrosity, an old switchboard mated to a bank of vacuum tubes that glowed with a sickly amber heat. Dials labeled with coordinates no human geography could map sat idle.

  "Five minutes," Miller said, checking a wristwatch that didn't seem to have hands. "One question. Or rather, one conversation. You know the drill."

  Elena nodded. Her throat felt tight. Tomorrow, at 7:00 AM, she was scheduled for a craniotomy. A berry aneurysm, the doctor had called it, delicate as glass behind her eye. The survival rate was high, but the risk of rupture on the table was non-zero. She could wake up whole, or she could not wake up at all.

  "And this world," Elena said, her voice trembling. "The one you're connecting to. It's... close?"

  "Nearest possible neighbor," Miller said. He picked up a patch cable and plugged it into a jack with a solid *thunk*. "Minimal divergence. History runs parallel until the moment of your decision. Maybe a few days after. It's the clearest signal we get."

  "And the person on the other end," Elena said. "It's me. Literally me."

  Miller paused, his hand hovering over a dial. He looked at her over the rim of his glasses, eyes tired. "That depends on who you ask. If you ask Kripke, yes. Rigid designators. 'Elena' refers to the same entity across all modal space. You're talking to yourself."

  "And if I ask Lewis?"

  Miller smirked, a dry, cracking sound. "Then you're talking to a counterpart. A qualitatively similar individual in a concrete, spatiotemporally isolated universe. You share properties, but not identity. You're distinct entities. Like twins separated at birth, only the separation is metaphysical."

  "Which one is it?" Elena asked.

  "This machine runs on Lewisian mechanics," Miller said, turning a dial. The hum in the room deepened, vibrating in Elena's teeth. "Concrete worlds. Isolation. But the comfort? That's all Kripke. People pay us because they want to believe the rigid designator. They want to believe it's *them* surviving out there."

  He slid a headset across the desk. "Put it on. When the light turns green, you're live."

  Elena put on the headphones. The static was heavy, like ocean waves crashing against rock. Then, a click. The static receded, replaced by the sound of breathing.

  "Elena?" The voice was hers. Exactly hers. But the cadence was different. Looser. Less afraid.

  "I'm here," Elena said. "Did you... did you have the surgery?"

  There was a pause on the other end. The sound of a lighter flicking, the inhale of smoke. Elena didn't smoke.

  "No," the other Elena said. "I couldn't do it. The odds scared me. I walked away."

  Elena's heart hammered against her ribs. "And? Are you okay?"

  "I'm fine," the other voice said. "It's been six months. No rupture. I live with it. I just... don't lift heavy things. I don't get stressed. It's manageable."

  "But the doctor said it could blow at any moment."

  "Doctors deal in probabilities," the other Elena said. "I dealt in certainty. I wanted to be certain I'd wake up. So I stayed."

  Elena gripped the arms of the chair. If the other her survived without the surgery, maybe the risk was overstated. Maybe she could walk away too. She could cancel the 7:00 AM appointment. She could live.

  "How do you feel?" Elena asked. "Do you regret it?"

  "I feel alive," the other said. "That's the only metric that matters. Listen, the connection is fading. Just know that you can choose the certain path. You don't have to gamble."

  The static surged back in, swallowing the voice. The green light on the console flickered red and died.

  Elena pulled the headphones off. The silence in the room was heavy, pressing against her ears. She felt a wash of relief so profound it made her dizzy. She didn't have to do it. She could walk away. There was proof. Another version of her had made the safe choice and was living to tell the tale.

  She looked at Miller. He was cleaning his glasses with a rag, not looking at her.

  "She's alive," Elena said. "She didn't do it. She's fine."

  Miller nodded. "So she says."

  "So I don't have to do it. If she survived, I can survive. It's the same body, the same brain."

  Miller put his glasses back on and leaned forward. "Here's the thing, Elena. You heard the counterpart theory pitch on the way in. Lewis vs. Kripke."

  "I heard it."

  "Think about Humphrey," Miller said.

  "What?"

  "Hubert Humphrey. 1968. Kripke used him to nail Lewis. Humphrey lost the election here. But in another world, a counterpart won. Lewis says that counterpart isn't Humphrey. He's just a guy who looks like him, acts like him, in a different concrete place. Kripke said Humphrey wouldn't care about that guy winning. It doesn't change the fact that *our* Humphrey lost."

  Miller tapped the console. "You just talked to a woman who looks like you, sounds like you, and shares your history up until three days ago. But she made a different choice. She didn't take the surgery. You are planning to."

  "So?"

  "So, under Lewis—and under the mechanics of this machine—identity is grounded in similarity. The more you diverge, the less she is your counterpart. If you take the surgery and she didn't, you are becoming less like her every second. If you walk away, you become more like her."

  Elena felt a cold knot form in her stomach. "Are you saying she's a stranger?"

  "I'm saying that if Lewis is right, her survival is statistically irrelevant to your biology. Her aneurysm didn't rupture. Yours might. She is a separate concrete entity in a separate spacetime. Her luck doesn't transfer. You're eavesdropping on a stranger who got lucky."

  "But she said—"

  "She said what she experienced. But why should you care what happens to a stranger?" Miller's voice was flat, devoid of malice, just tired. "That was Kripke's point. If it's not literally you, why does it matter? If it is literally you, then how can she be alive while you die? Identity doesn't split. Either you survive or you don't. You can't have it both ways."

  Elena stared at the machine. The vacuum tubes were cooling, the amber glow dimming.

  "If I cancel the surgery," Elena said slowly, "I'm betting on her reality."

  "You're betting on a counterpart's history," Miller corrected. "You're hoping that similarity guarantees outcome. But Lewis says worlds are isolated. Causality doesn't bleed. Her survival doesn't cause yours. It just *is*."

  "So this was useless."

  "No," Miller said. "It gave you comfort. That's what we sell. Whether it's you or a counterpart, hearing that someone like you survived makes the fear manageable. But don't mistake comfort for data."

  Elena stood up. Her legs felt heavy. She walked to the door, her hand on the knob. She thought of the operating room, the lights, the mask. She thought of the other woman smoking in a kitchen that wasn't hers, living with the glass bubble behind her eye.

  "If I walk out," Elena said, not turning around. "And I don't do the surgery. And my aneurysm blows. Was she lying?"

  "No," Miller said. "She was just elsewhere."

  "And if I do the surgery. And I die."

  "Then you died," Miller said. "And she kept living. Two different stories. No contradiction."

  Elena opened the door. The hallway outside was bright, sterile, real.

  "Which one is true?" she asked. "Lewis or Kripke?"

  Miller picked up his coffee cup, the liquid inside cold and black. "Does it matter? You still have to choose."

  Elena stepped out into the hall. She pulled her phone from her pocket. The screen lit up with the reminder: *7:00 AM - Dr. Aris.*

  She hovered her thumb over the cancel button. If she canceled, she was choosing the counterpart. She was betting that similarity was enough to bridge the gap between worlds, that the other woman's luck was a map she could follow. If she kept the appointment, she was accepting that this world was isolated, that her fate was hers alone, unshared and unverified.

  She realized then that the machine hadn't shown her the future. It had shown her the cost of belief. To believe the call mattered, she had to believe in Kripke, in a self that stretched across worlds, safe and rigid. To believe the call was useless, she had to believe in Lewis, in a self that was solitary, trapped in the here and now.

  She looked at the phone. She thought of Hubert Humphrey, losing in one world, winning in another, caring about neither.

  Elena pressed *Cancel*.

  She couldn't know if the other woman was her. She couldn't know if the survival was transferable. But she knew she needed the story to be true more than she needed the data to be solid. She walked toward the exit, clutching the comfort of the stranger like a lifeline, hoping that somewhere in the metaphysics, identity was stronger than isolation.

  Behind her, in the dark room, Miller watched the light on the console fade completely. He made a note on his clipboard: *Client opted for Counterpart comfort. Outcome unknown.*

  He closed the file. The machine hummed, waiting for the next person who needed to know if they were alone.
