answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I write novels, which means I spend my days inventing problems for people who don't exist, while Priya has spent the last twenty years solving problems for people who definitely do.

  Looking around this room, I see a bit of a divide. On my left, we have the private equity contingent. On my right, the artists and creatives Priya has been promising to call "once this deal closes." Usually, at a retirement party, the speech is about the grind. We talk about the hours, the stress, the victory of the exit. But Priya asked me not to do that. She knows the grind. You know the grind. We don't need to recount the war stories.

  Instead, she wants me to talk about what comes next. And specifically, she wants me to talk about John Maynard Keynes.

  Now, before the bankers check their watches and the artists check their eyes, hear me out. Most people know Keynes for the fridge-magnet version of his thinking: *Money is bad, leisure is good.* But in 1930, he wrote an essay called *Economic Possibilities for our Grandchildren*, and he argued something much more difficult, and much more relevant to Priya tonight.

  Keynes predicted that within a hundred years, technology and capital would solve the economic problem. We would be rich enough that we wouldn't *need* to work for survival. He thought we'd be working fifteen-hour weeks by now.

  In a way, Priya is the proof of concept. At 44, she has hit her number. She has solved the economic problem. But here is the part of the essay people skip. Keynes didn't think solving the money problem was the hard part. He thought the hard part was what happens *after*.

  He wrote that when people are no longer driven by necessity, they face the "permanent problem of the human race": How to use our freedom from pressing economic cares? How to occupy the leisure that science and compound interest have won for us?

  He was actually quite worried about this. He suggested that for many of us, the love of money isn't a virtue; it's a habit. He called it a "somewhat disgusting morbidity, one of those semi-criminal, semi-pathological propensities."

  Now, to my friends in finance: don't walk out. He wasn't insulting you. He was observing that the drive to accumulate is often a substitute for living. It's a pathology we tolerate because it's useful. It gets the deal done. It builds the nest egg. It builds the civilization. But Keynes argued it is only a means to an end. The end is living wisely, and agreeably, and well.

  And this is why Priya's retirement is so brave.

  It is easy to understand the architecture of a leveraged buyout. It is much harder to understand the architecture of a Tuesday morning with no meetings. It is easy to measure success in IRR. It is terrifying to measure it in the quality of a light study, or the depth of a conversation over a long lunch, or the patience required to learn how to paint when you aren't trying to sell the canvas.

  Priya isn't just stopping work. She is taking on the challenge Keynes said would defeat most of us: she is choosing to cultivate a life rather than accumulate a resume.

  To the artists here: welcome Priya to the struggle. You know that facing a blank canvas is often harder than facing a spreadsheet. A spreadsheet has rules. Art requires you to bring something from the inside out.

  To the bankers here: do not mistake this for a critique of your path. You built the engine that got her here. But recognize that the engine is not the destination. Priya has mastered the art of making money. Now, she gets to master the art of spending time.

  Keynes worried that when we got the leisure, we wouldn't know what to do with it. He worried we'd just find new ways to be busy. Priya, you are proving him wrong. You aren't filling the void with noise. You are filling it with color. You are filling it with presence.

  So, I'd like to propose a toast.

  To Priya. May your brushstrokes be bold, your lunches be long, and may you find that the hardest work you ever do is the work of doing nothing but living.

  To Priya.
