answer: |-
  # The Cartography of Activation Space: A Defense of Real Pattern Realism

  The debate over the ontological status of neural network features has calcified into a familiar philosophical stalemate. On one side stand the interpretability realists, who point to the recurrence of curve detectors across vision models and the precise behavioral shifts caused by steering specific SAE (Sparse Autoencoder) latents as evidence that features are natural kinds waiting to be discovered. On the other stand the deflationists, who note that SAE features decompose under higher-resolution analysis ("Einstein" splits into "scientist" and "Germany") and that superposition renders any single basis arbitrary. They argue that "features" are merely pragmatic projections, like constellations drawn on stars that have no physical connection.

  This essay rejects the dichotomy. The deflationists are correct that there are no *atomic* units of computation in a neural network, but they are wrong to conclude that features are therefore illusory. The realists are correct that there is genuine structure to be found, but wrong to expect that structure to be unique or fundamental. The correct verdict is a **Dennettian Real Pattern Realism**. Neural networks possess representations, but these representations are not Fodor-style atomic symbols with fixed content. They are *real patterns* whose existence is constituted by their ability to compress and predict the system's behavior at a specific scale of analysis. To ask if the "Golden Gate Bridge" feature is *really* there is to ask the wrong question; the right question is whether positing that feature yields a more efficient compression of the network's input-output map than the raw weights do.

  ### The Allure and Failure of Atomic Realism

  The realist intuition in interpretability is powered by two compelling phenomena: universality and causal control. When independently trained models develop identical edge detectors, or when clamping a specific direction in activation space reliably induces a model to speak French, it feels like discovery. It mirrors the history of neuroscience: we found orientation-tuned cells in V1, and we assumed we had found the "letters" of the visual alphabet. In the context of the "linear representation hypothesis," this suggests a Fodor-style Language of Thought. On this view, a feature like "sycophantic praise" should be a discrete, context-invariant unit—a semantic atom that the network manipulates.

  However, the deflationary case against this atomicity is devastating. The recent paper "Sparse Autoencoders Do Not Find Canonical Units of Analysis" demonstrates that feature granularity is relative to the dictionary size of the SAE. A latent that appears monosemantic at a dictionary size of $2^{14}$ often fractures into multiple distinct latents at $2^{18}$. If "Einstein" is a real feature, why does it dissolve into "scientist," "famous," and "German" when we look closer? If features were fundamental joints of nature, increasing our magnification should reveal the same joints more clearly, not carve them differently.

  Furthermore, the phenomenon of superposition implies that the network does not allocate one neuron per feature. It packs features into a lower-dimensional space, meaning individual neurons are polysemantic mashups. If the hardware (the neurons) does not align with the software (the features), the claim that features are "physically real" in the network becomes tenuous. The "interpretability illusions" in BERT, where researchers confidently named a neuron "the noun detector" only to find it failed on out-of-distribution data, serve as a warning: narrative coherence is not ontological proof.

  ### Dennett's Middle Path: Reality as Compression

  To resolve this, we must abandon the search for fundamental particles of cognition and adopt Daniel Dennett's criterion from *Real Patterns*. Dennett argues that a pattern is real if describing the system in terms of that pattern allows for more efficient compression and prediction of the data than describing the system at the physical level. A chair is real, not because "chair" is a fundamental category in particle physics, but because positing "chairs" allows us to predict where people will sit far more efficiently than tracking the quantum states of the wood.

  Applied to mechanistic interpretability, this dissolves the tension between the "Einstein" latent and its decomposed constituents. The "Einstein" feature is real *at the resolution of the smaller SAE* because it captures a cluster of co-occurring activations that predict the model's behavior regarding Einstein-related prompts. The decomposed features ("scientist," "Germany") are real *at the resolution of the larger SAE* because they capture finer-grained statistical regularities. Neither is the "One True Feature." Both are real patterns relative to their descriptive vocabulary.

  This view validates the realist's success with causal interventions without requiring atomicity. When we steer the "Einstein" direction and the model talks about relativity, we are exploiting a real pattern in the activation space. The fact that this pattern is composed of sub-patterns does not make it fake; it makes it macroscopic. Conversely, it validates the deflationist's worry about granularity without collapsing into nihilism. The lack of a "canonical unit" is not a bug; it is a feature of any complex system described at multiple scales. There is no fact of the matter about the "right" dictionary size, just as there is no fact of the matter about the exact cutoff for when a collection of water molecules becomes a "wave."

  ### Why the Illusions Happened

  This framework also explains the BERT interpretability illusions. Those failures were not evidence that *no* features exist; they were evidence that *those specific* proposed features were not Real Patterns. A neuron labeled "noun detector" that fails on new data is like a constellation that only looks like a bear from one specific spot on Earth. It fails the compression test: positing the "noun detector" does not robustly predict behavior across contexts. In contrast, the curve detectors in vision models or the robust SAE latents in LLMs pass the test. They generalize. They compress. They allow us to predict the system's output better than the raw weights do.

  The deflationist argues that because we impose the SAE from the outside, the features are "in the eye of the beholder." But under Real Pattern Realism, this is compatible with objectivity. We impose the grid of latitude and longitude on the Earth, but the continents are still there. The SAE is a tool for revealing the topography of the activation space. If the topography changes depending on the zoom level of the lens, the mountains are no less real for lacking a single, absolute height.

  ### The Verdict: Representations Without Atoms

  Therefore, I defend the following verdict: **Neural networks have representations, but they are ecological, not atomic.**

  To claim networks have representations in the Fodorist sense is to claim there is a unique, correct dictionary that maps latents to meanings. The evidence from superposition and meta-SAEs proves this false. There is no "God SAE" that reveals the network's true thoughts.

  However, to claim networks have *no* representations is to ignore the causal leverage we have gained. We can edit models by editing vectors. We can find circuits that generalize across models. This is not magic; it is engineering based on structural reality.

  The reality of a feature is a function of its **predictive stability** and **compressive utility**. The "Golden Gate Bridge" feature is real because it is a stable attractor in the activation space that compresses the model's behavior regarding that concept. It is not a fundamental particle; it is a vortex in the flow of information.

  Interpretability researchers should stop acting like particle physicists searching for the electron of "sycophancy" and start acting like cartographers. A map is not the territory, and a 1:100,000 scale map is not "false" because a 1:10,000 scale map shows more detail. Both are real descriptions of the territory, useful for different purposes.

  The deflationists are right that the joints are not carved by nature alone; we bring the knife (the SAE architecture). But the realists are right that the meat resists the cut in specific ways. The resistance is the representation. We are not projecting meaning onto a void; we are compressing a structure that is already there, acknowledging that the structure admits of multiple, equally valid descriptions depending on the scale at which we choose to intervene.
