answer: |-
  Here is the conceptual breakdown to help you get straight, followed by a draft of the two paragraphs you can adapt for your newsletter.

  ### The Conceptual Clarification

  **1. Does losing standing let the accused off the hook?**
  No. This is the most critical distinction. "Standing" is about the *authority* to issue blame, not the *truth* of the accusation. If a corrupt politician bans abortion and then gets caught having one, they lose the standing to condemn others for it. However, the moral status of abortion (in this hypothetical) doesn't change, nor does the fact that the politician violated their own rule. The accused is not "off the hook" regarding the act itself; they are only off the hook regarding *this specific interaction* with *this specific blamer*. The wrongness of the act remains independent of the blamer's virtue.

  **2. Is it just *Tu Quoque*?**
  Not exactly, though they look similar. *Tu quoque* ("you also") is a logical fallacy where one dismisses a *claim* as false because the arguer is inconsistent (e.g., "Smoking is bad." "But you smoke!" "Therefore smoking is good."). That is bad logic. The "standing" argument is an ethical norm, not a logical proof. It argues that blame is a moral practice that requires certain conditions to be *fair*. If I blame you for something I do, I am treating you as subject to a rule I exempt myself from, which is a form of moral inequality. So, pointing out hypocrisy doesn't prove the act was okay (logic); it proves the *scolding* is unfair (ethics).

  **3. Common Trip-Ups**
  *   **The Silence Trap:** People think if you lack standing, you should stay silent. Philosophers like Wallace suggest the opposite: you should own your fault first.
  *   **The Absolution Trap:** Audiences hear "you can't blame him" and hear "what he did was fine." You have to decouple the *deed* from the *do-gooder*.
  *   **The Equivalence Trap:** Assuming the hypocrisy must be identical. Often, "commitment" to the norm is what matters, not identical behavior (e.g., a recovering alcoholic has standing to blame drinking; a casual drinker might not).

  ***

  ### Draft for Newsletter (Two Paragraphs)

  Here is a version tailored for general readers that captures the Cohen/Wallace nuance without the jargon:

  > When a politician gets caught doing the very thing they campaigned against, the inevitable cry of "hypocrite!" raises a tricky question: does their hypocrisy let the politician off the hook? Philosophically, the answer is no. Losing the "standing to blame" doesn't erase the wrongdoing; it only disqualifies the accuser. Think of it like a corrupt referee calling a foul. The foul still happened, and the rule still exists, but that specific referee has forfeited the authority to enforce it. The moral reality of the act is separate from the moral authority of the person pointing it out. When we say a hypocrite lacks standing, we aren't saying the accusation is false; we're saying the *relationship* required to make that accusation fairly has been broken.

  > This distinction saves us from the *tu quoque* fallacy, where we dismiss a truth just because the messenger is flawed. Pointing out hypocrisy isn't a logical trick to prove the behavior is acceptable; it's a check on the fairness of the blame itself. Blame is a social practice that assumes the blamer is committed to the same rules they are enforcing. When they aren't, the blame becomes a weapon of power rather than a call to accountability. So, when the pile-on starts, the goal isn't to pretend the politician's behavior was fine. It's to recognize that moral clarity requires clean hands, and until the accuser addresses their own violations, their outrage is just noise.

  ***

  ### A Note on the Draft
  I tried to keep the "referee" analogy in there because it instantly clarifies the "act vs. authority" distinction for lay readers. I also made sure to emphasize that blame is a "social practice" (hinting at the Strawson/Wallace view) without using the term "reactive attitudes." Feel free to tweak the tone to match your voice!
