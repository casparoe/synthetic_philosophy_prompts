prompt: |-
  I got asked to join the patient and family advisory council at the teen mental health clinic where my niece has been getting treatment for about a year now (I guess I count as "lived experience" too, since I went through something pretty similar myself as a teenager, way before anyone used half these words with me). Next Tuesday the clinical team is bringing a policy question to the council for an actual vote, and they asked each of us to send in a short written opinion first so there's something on paper to argue about instead of just people talking over each other in the room. The question is: when a teenager's symptoms line up with the criteria for Borderline Personality Disorder, should the therapists just tell them straight out and put it in thier file, or stick to softer, vaguer language like "emotion regulation difficulties" and never actually say the diagnosis to a minor?

  The clinic's lead psychologist is pushing hard for full disclosure. Her argument is that teens deserve to know the truth about themselves, and that if the clinic won't say the word, the kids are going to diagnose themselves off TikTok anyway, badly and with zero context, so at least this way an adult who actually knows them is the one explaining it. A couple of the other therapists are dead against it, their worry being that the second a 15 year old starts thinking of herself as "a borderline," it changes how she describes her own feelings and acts around staff and other patients, and that the label sticks to her file into her twenties even if it turns out not to fit anymore. I keep coming back to my niece, who overheard one offhand comment from her counselor, went home that night and read the entire DSM criteria list, and has basically talked about her moods in that exact language ever since. I honestly can't tell if that's her finally having words for something real, or the label sort of writing the rest of the story for her.

  Can you write the memo I'm supposed to hand in? I want it to actually land on a recommendation, a real answer or a specific middle-ground policy, not a "here are both sides" shrug, and I need whoever reads it to see that I took the disclosure argument seriously instead of just being the emotional parent-type voice in the room, since that argument isn't obviously wrong just because it makes me uncomfortable.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Task:** Write a memo for a Patient and Family Advisory Council (PFAC) meeting at a teen mental health clinic.
      *   **Topic:** Should therapists disclose a Borderline Personality Disorder (BPD) diagnosis to teenagers directly and document it, or use softer language ("emotion regulation difficulties") and avoid the label?
      *   **Stakeholders:** Clinical team (Lead Psychologist vs. other therapists), PFAC members (including the user), patients (teens), families.
      *   **User's Perspective:** Has "lived experience" (similar issues as a teen), has a niece currently in treatment (who latched onto the label after overhearing it).
      *   **Requirements:**
          *   Must take a stance (recommendation/middle-ground), not just summarize both sides.
          *   Must acknowledge the validity of the disclosure argument (don't dismiss it as just "uncomfortable").
          *   Must be professional but personal enough to carry weight (lived experience + family perspective).
          *   Format: Memo.
          *   Deadline: Next Tuesday (implied urgency/preparation).

  2.  **Determine the Stance:**
      *   *Option A (Full Disclosure):* Aligns with autonomy, reduces self-diagnosis via social media, validates experience. Risk: Stigma, identity foreclosure.
      *   *Option B (Non-Disclosure):* Protects from stigma, allows for developmental fluidity. Risk: Gaslighting, mistrust, unsafe self-diagnosis.
      *   *Option C (Middle Ground/Nuanced Disclosure):* This is usually the most clinically sound and ethically robust position. It involves *how* and *when* the diagnosis is shared, rather than *if*. It treats the diagnosis as a tool, not an identity.
      *   *Decision:* I will recommend a policy of **"Collaborative and Developmental Disclosure."** This means the diagnosis *can* be shared, but only under specific conditions (timing, framing, involvement of the teen in the process) and with a plan for how it's documented (e.g., provisional, reviewed regularly). This validates the Lead Psychologist's point about truth/self-diagnosis while addressing the other therapists' concerns about stigma/identity.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the weight of the question.
      *   **Acknowledging the Arguments (The "Why"):**
          *   Validate the Lead Psychologist: Truth matters. TikTok diagnosis is dangerous. Validation is healing.
          *   Validate the Concerned Therapists: Stigma is real. Adolescent identity is fragile. Diagnostic overshadowing is a risk.
          *   *Personal Touch:* Mention the niece's experience neutrally but honestly (it gave words, but also narrowed the lens). Mention own lived experience (lack of language then vs. now).
      *   **The Recommendation (The "What"):**
          *   Don't say "Yes" or "No." Say "Yes, *if*..."
          *   Proposal: A "Shared Formulation" model.
          *   Key components:
              1.  *Timing:* Not at intake. Only after rapport is built.
              2.  *Framing:* Symptoms as survival strategies, not character flaws. Focus on treatability.
              3.  *Documentation:* Use "Provisional" flags or review dates so it doesn't haunt them forever without cause.
              4.  *Teen Agency:* The teen gets a say in when/how they hear it.
      *   **Rationale:** Why this works. Balances autonomy with protection.
      *   **Closing:** Reiterate commitment to the clinic's mission.

  4.  **Refining the Tone:**
      *   *Professional:* Needs to sound like a council member, not just an angry aunt.
      *   *Empathetic:* Show understanding of clinical constraints.
      *   *Firm:* Don't waffle. "I recommend..."
      *   *Addressing the "Lived Experience":* Use it to bridge the gap between the clinical theory and the patient reality. The user mentioned they went through something similar "way before anyone used half these words." This is a strong point—language helps, but labels can limit.

  5.  **Drafting - Specific Considerations based on Prompt:**
      *   *Niece's Situation:* The prompt says she overheard an offhand comment. This is actually a negative example of disclosure (accidental/unprepared). I should use this to argue for *intentional* disclosure, not accidental.
      *   *TikTok Argument:* This is strong. I need to make sure the policy addresses the "vacuum of information" problem.
      *   *File Stigma:* Address the documentation aspect specifically.

  6.  **Review against Constraints:**
      *   *Memo format?* Yes.
      *   *Specific recommendation?* Yes (Collaborative Disclosure Protocol).
      *   *Took disclosure argument seriously?* Yes, acknowledged the danger of secrecy.
      *   *Not a shrug?* Yes, takes a clear stance.

  7.  **Final Polish:** Check for clarity, flow, and emotional resonance. Ensure the distinction between "diagnosis as identity" vs. "diagnosis as map" is clear. (Self-Correction: Make sure I don't sound like I'm diagnosing the niece myself in the memo, keep it observational.)

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Patient and Family Advisory Council (PFAC) & Clinical Leadership Team
  **FROM:** [Your Name], PFAC Member (Family/Lived Experience Representative)
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Diagnostic Disclosure of BPD Criteria to Adolescent Patients

  **Purpose**

  I am submitting this statement in advance of next Tuesday's vote regarding the disclosure of Borderline Personality Disorder (BPD) diagnoses to adolescent patients. As a family member of a current patient and an individual with lived experience regarding similar mental health challenges during adolescence, I have reviewed the arguments for full disclosure and the arguments for protective non-disclosure.

  This memo outlines my recommendation for a **Collaborative and Developmental Disclosure Policy**. This approach rejects the binary choice between "telling the truth" and "protecting the child" in favor of a protocol that governs *how, when, and why* the diagnosis is shared.

  **Acknowledging the Clinical Tension**

  I want to explicitly validate the Lead Psychologist's position. The argument for full disclosure is ethically sound. When we withhold diagnostic language from teens, we do not stop them from seeking labels; we simply outsource the explanation to algorithms. As noted, a teenager diagnosing themselves via TikTok is infinitely more dangerous than a teenager receiving a clinical explanation. Without accurate language, patients often feel broken rather than treatable. My own experience as a teenager lacked this vocabulary, which led to years of confusion I could have avoided with accurate framing.

  However, the concerns raised by the therapy team regarding "identity foreclosure" are equally valid. I have observed this with my niece. After overhearing a comment regarding her symptoms, she began mirroring the criteria of BPD in her self-description. While this gave her language for her pain, it also risked narrowing her worldview. She began to interpret normal fluctuations in mood as evidence of a personality disorder, rather than evidence of being a teenager in distress. The label became a script rather than a map.

  **Recommendation: A Collaborative Disclosure Protocol**

  I recommend that the clinic adopts a policy of **Conditional Disclosure**, rather than a blanket mandate for either full disclosure or total secrecy. The diagnosis should be accessible, but only when specific safety and developmental criteria are met.

  I propose the following four pillars for this policy:

  1.  **Timing and Rapport:** Disclosure should not occur at intake or during crisis stabilization. It should only be introduced after a therapeutic alliance is established (e.g., after 3–6 months). A label given too early defines the patient before the therapist knows them.
  2.  **Framing as "Survival Strategies," Not Identity:** When disclosed, the diagnosis must be framed functionally. The language used should be: *"These are patterns you developed to survive difficult emotions, and they are causing problems now,"* rather than *"This is who you are."* The focus must remain on neuroplasticity and the high treatability of these symptoms in adolescence.
  3.  **Teen Agency in Disclosure:** The teenager should have input on when they are ready to hear the specific terminology. Therapists should ask: *"I have some clinical thoughts about what's going on. Do you want to know the specific name professionals use for this, or do you want to focus on the skills first?"* This restores autonomy.
  4.  **Documentation Safeguards:** To address the concern about the file following the patient into adulthood, the clinic should utilize "Provisional" flags or scheduled diagnostic reviews. If a patient meets criteria at 15 but not at 18, the record should reflect that evolution clearly to prevent diagnostic overshadowing in future care.

  **Rationale**

  This middle ground addresses the Lead Psychologist's concern about the "information vacuum." By committing to eventual disclosure, we prevent patients from relying on social media for answers. Simultaneously, by controlling the timing and framing, we address the therapists' concern about stigma.

  In my niece's case, the harm came not from the truth itself, but from the *accidental* nature of the disclosure. It was overheard, not discussed. A policy that requires intentional, collaborative conversations ensures the teen is an active participant in their care plan, not a passive recipient of a file code.

  **Conclusion**

  Teens deserve the truth, but they also deserve protection from the weight of that truth until they have the tools to carry it. I urge the council to vote for a policy that mandates **transparent, developmentally appropriate disclosure** rather than secrecy. We should not hide the diagnosis, but we must curate the delivery.

  I am available to discuss the specifics of this protocol during Tuesday's session.

  Thank you for your work on this critical issue.
