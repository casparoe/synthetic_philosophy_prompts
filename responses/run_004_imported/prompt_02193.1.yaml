      *   **The Forensic Implication:** Locke calls "person" a forensic term (legal/moral). A brain-dead body cannot be held accountable or experience reward/punishment. This supports the idea that the *person* is gone.
      *   **Nuance/Complication:** Locke might struggle with *what kind* of life counts. Is a ventilated body "living" in the sense he meant (self-sustaining organization)? He might lean towards the idea that without the brain's integrative power, the "organization" is dissolving, even if the heart beats. But strictly speaking, if life = circulation/respiration, the "man" remains.
      *   **Conclusion:** Locke would likely say the *person* died first. The *man* lingered as a shell. This validates the family's experience: they were saying goodbye to the body of their father, but the "father" as a conscious agent was already gone.

