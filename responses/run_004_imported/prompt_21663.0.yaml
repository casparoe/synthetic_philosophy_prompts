  2.  **Deconstruct the Philosophical Positions:**
      *   **Etiological (Selected-Effects):** Function = *why* it was selected for in the past.
          *   *Pros:* Explains malfunction (a heart that doesn't pump is malfunctioning because it *should* pump based on history), distinguishes function from side effects (noise of the heart), handles vestigial traits (appendix has no function if selection pressure is gone).
