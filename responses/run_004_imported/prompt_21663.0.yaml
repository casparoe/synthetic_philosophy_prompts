      *   *Wait, the prompt asks for a verdict on the accounts.* I should argue that the Etiological account is the *true* account of biological function, and the Causal-Role account is actually describing *causal capacity*, not function. This creates a clear distinction.
      *   *Refining the ENCODE angle:* ENCODE conflated "activity" with "function." The essay should show why this conflation is dangerous for understanding evolution.

  5.  **Drafting the Content (incorporating specific philosophers):**
