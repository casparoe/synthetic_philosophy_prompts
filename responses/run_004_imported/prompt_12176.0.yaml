      *   *Check:* In the 2016 paper, the "value" of a sentence $\phi$ is 1 if $\phi$ is true in the underlying logic (e.g., PA), 0 if false. The traders try to exploit discrepancies between price and truth value. *However*, since truth is uncomputable, the traders can only exploit based on *proofs* they can find within their time limits.
      *   *User's phrasing:* "pays out $1 a share if $\phi$ eventually gets proven and $0 if its negation does."
      *   *Critique:* This is slightly off. The *ideal* payout is based on truth. But since we are dealing with incomplete theories (like PA), some sentences are independent. For independent sentences, they never get proven or disproven. The market still assigns prices. The user's phrasing implies a binary payout condition based on provability. If $\phi$ is independent, it never pays out under that definition.
      *   *Correction:* The market prices converge to probabilities *as if* there were a truth value, but for independent sentences, the prices don't necessarily converge to 0 or 1. They converge to a coherent distribution. The traders exploit inconsistencies relative to *provability* within time limits.
      *   *Refinement:* It's better to say the "true value" is 1 if true, 0 if false, but traders only have access to proofs. Or, more accurately for the mechanism: traders make money if they can find a proof that the price is wrong relative to logical constraints.
      *   *User's phrasing on Criterion:* "No trader... can find a way to make unbounded profit." -> This is correct (the Logical Induction Criterion).
      *   *User's phrasing on Properties:* "10th digit of sqrt(10)" (should be $\pi$ or something hard, sqrt(10) is easy, but point stands), "respecting provable implications," "statistical patterns." -> These are all correct properties of LI.

