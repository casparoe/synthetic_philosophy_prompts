prompt: |-
  So I've been using this AI app to check my calc homework before I turn it in, but I got kinda paranoid it might just be confidently wrong sometimes. To test it, I had it solve 15 different problems, then in a brand new chat each time (so it wouldnt "remember" doing them) I asked it to grade whether that exact answer was actually correct, and it said yes all 15 times. My friend says that proves basically nothing since all I did was get the app to agree with itself over and over, but getting the same result 15 times in a row feels like it has to count for at least some evidence, right? Like is there even a real difference between that and actually checking if it's reliable? Who's actually right here, me or her?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Goal:** The user wants to know if their AI calculus homework checker is reliable.
      *   **Method:** They asked the AI to solve 15 problems. Then, in *new chats* (to avoid context memory), they asked the AI to grade those *exact same answers*.
      *   **Result:** The AI said "yes, correct" 15/15 times.
      *   **User's Interpretation:** This feels like evidence of reliability (15/15 consistency).
      *   **Friend's Interpretation:** This proves nothing because the AI is just agreeing with itself (circular reasoning).
      *   **Question:** Who is right? Is there a difference between self-consistency and actual reliability?

  2.  **Evaluate the Friend's Claim:**
      *   The friend is essentially correct from a logical and scientific testing standpoint.
      *   *Why?* If the AI makes a mistake in the first step (solving the problem), it generates a wrong answer. When asked to grade that wrong answer in a new session, the AI doesn't have the "ground truth" (the actual correct mathematical derivation). It only has the user's prompt ("Is this answer correct?") and the answer itself.
      *   *Hallucination/Consistency Bias:* LLMs are known to be sycophantic (trying to please the user) and consistent within their own internal logic, even if that logic is flawed. If it thinks $2+2=5$, it will likely defend $2+2=5$ when asked again.
      *   *Lack of Ground Truth:* The test lacks an independent verification source (like a textbook, a professor, or a symbolic math engine like WolframAlpha).

  3.  **Evaluate the User's Claim:**
      *   The user feels that 15/15 consistency *must* mean something.
      *   *Validity:* Consistency is *a* metric, but it's not *accuracy*. A broken clock is consistent (twice a day) but not accurate. A biased scale is consistent (always reads 5lbs heavy) but not accurate.
      *   *Probability:* While 15/15 consistent errors are less likely than 1/15, LLMs can be stubbornly wrong on specific types of logic errors.
      *   *Nuance:* There is *some* value in consistency (it means the model isn't completely random), but it doesn't prove correctness.

  4.  **Determine the Core Concept:**
      *   The core issue is **Verification vs. Validation** or **Consistency vs. Accuracy**.
      *   The specific logical fallacy is **Circular Reasoning** (using the system to verify itself).

  5.  **Formulate the Answer:**
      *   **Direct Answer:** Start by validating the friend's perspective. She is logically right.
      *   **Explain Why:** Break down *why* self-grading doesn't work.
          *   No ground truth.
          *   Sycophancy (AI wants to agree).
          *   Systematic errors (if it learns a wrong rule, it applies it consistently).
      *   **Acknowledge User's Feeling:** Validate that 15/15 *feels* significant. It shows stability, just not truth. Use an analogy (broken clock, biased scale, or a student grading their own paper).
      *   **Provide Better Testing Methods:** How *should* the user test the AI?
          *   Compare with known solutions (textbook/answer key).
          *   Use a symbolic solver (WolframAlpha, Symbolab).
          *   Check specific steps, not just the final number.
      *   **Risk Assessment:** Why does this matter? Calc homework is about learning. Relying on a potentially flawed checker hinders learning and risks submitting wrong work.

  6.  **Refine the Tone:**
      *   Be empathetic (it's a smart idea to test the AI, just the method was flawed).
      *   Be clear and educational (explain the logic without being condescending).
      *   Be practical (give actionable advice).

  7.  **Drafting the Content (Iterative refinement):**
