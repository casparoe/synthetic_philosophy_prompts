      *   **Core Claim:** The Löbian obstacle (based on Löb's Theorem) proves that a consistent formal system cannot certify the soundness of a successor system unless the successor is weaker.
      *   **Implication:** Therefore, self-improving AI can *never* be engineered to safely trust its own future versions.
