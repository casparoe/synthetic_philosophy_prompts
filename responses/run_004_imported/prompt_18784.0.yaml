      *   **Brain Death Criteria:** It's not just "brain stops." It's the irreversible cessation of *all* functions of the entire brain, including the brainstem. No breathing drive, no reflexes, coma.
      *   **The "Somatic Support" Counter-argument:** The fact that a body can be kept "somatic" (cellularly alive) via machines/meds doesn't mean the *person* is alive. The integration is gone. The body is a collection of living organs, not a living human being.
