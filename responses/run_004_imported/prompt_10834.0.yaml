      *   *The Issue:* In situation calculus, if I perform action $A$ in situation $S$ to get $S'$, how do I specify that $P$ is true in $S'$ without explicitly stating frame axioms for every unrelated predicate $Q, R, S...$?
      *   *The Goal:* Efficiency in representation. Avoid $N \times M$ axioms (actions $\times$ fluents).
