  3.  **Deconstruct Version 2: The Broad/Epistemic Frame Problem:**
      *   *Origin:* Dennett ("Cognitive Wheels"), Fodor ("The Mind Doesn't Work That Way", "Modularity of Mind").
      *   *The Issue:* How does an agent know which consequences of an action are *relevant*? It's not just about logical persistence; it's about salience and context.
      *   *The Robot Example:* R1 sees the wagon. R1D1 sees the wagon and the bomb. R2D1 sees the wagon, the bomb, and the color of the wagon, the temperature of the room, etc., and starves while computing.
