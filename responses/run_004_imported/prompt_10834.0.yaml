answer: |-
  You are absolutely right to be frustrated. This conflation is one of the most persistent category errors in the philosophy of AI, and it drives a wedge between the AI practitioners and the philosophers of mind. If you don't disentangle them in your seminar, you'll end up with computer scientists claiming they've solved consciousness and philosophers claiming logic is dead.

  Here is the breakdown of the two problems, the verdict on the technical solutions, and the straight talk on Fodor.

  ### 1. The Tale of Two Problems

  **The Narrow (Logical) Frame Problem**
  *   **Origin:** McCarthy & Hayes (1969).
  *   **The Issue:** This is a problem of **representation and economy**. In the situation calculus, if I represent an action (e.g., `PickUp(Block)`), I need to specify what changes (the block is in the hand). But how do I specify what *doesn't* change (the color of the wall, the location of the door, the time of day) without writing an infinite number of "frame axioms" for every non-effect?
  *   **The Stakes:** If you have to explicitly list everything that stays the same for every action, your knowledge base becomes unmanageably large. It's a bookkeeping nightmare.
  *   **The Core Question:** "How do we formalize inertia?"

  **The Broad (Epistemic/Relevance) Frame Problem**
  *   **Origin:** Dennett ("Cognitive Wheels"), Fodor (*Modularity of Mind*, *The Mind Doesn't Work That Way*).
  *   **The Issue:** This is a problem of **salience and relevance**. Even if you solve the logical inertia problem, how does the agent know which facts are *worth* checking in the first place? Dennett's robot starves because it deduces irrelevant consequences (e.g., "the wagon's wheels are now closer to the wall") while the bomb ticks.
  *   **The Stakes:** This strikes at the heart of the Computational Theory of Mind (CTM). If cognition is computation, it proceeds via local operations on symbols. But human reasoning seems "Quinean" (holistic)—any belief can potentially be relevant to any other belief depending on context.
  *   **The Core Question:** "How do we bound the search space of relevance without pre-defining the bounds?"

  ### 2. Did Circumscription and Default Logic Solve the Narrow Problem?

  **Straight answer:** Yes, mostly.

  McCarthy's **Circumscription** and Reiter's **Default Logic** (specifically **Successor State Axioms**) are generally considered to have solved the *representational* aspect of the Narrow Frame Problem.

  *   **How it works:** Instead of writing axioms for what stays the same, you write axioms for what *changes* and apply a minimization policy. You assume that fluents (properties) do not change unless an action explicitly causes them to.
  *   **The Result:** You no longer need $N \times M$ frame axioms. You can represent dynamic domains efficiently.
  *   **The Caveat:** While the *representation* problem is solved, the *computational complexity* problem remains. Planning is still PSPACE-hard or worse in many domains. But strictly speaking, the logical paradox of how to represent persistence without infinite axioms is settled.

  ### 3. Does This Touch Fodor's Broader Worry?

  **Straight answer:** No. Not even a little bit.

  If you tell a Fodorian that Successor State Axioms solve the Frame Problem, they will (rightly) accuse you of changing the subject. Here is why the technical solution fails to address the philosophical worry:

  **A. The Vocabulary Problem**
  Logical solutions (Circumscription, etc.) assume you already have a fixed vocabulary of predicates (fluents). They tell you how to update the truth values of `On(Block, Table)`.
  Fodor's problem asks: **Where did that predicate come from?** How does the system know that `On(Block, Table)` is the relevant predicate to track, rather than `Distance(Block, Moon)`? The technical solutions presuppose the relevance; they do not explain it.

  **B. Isotropy and Holism**
  Fodor's argument in *The Mind Doesn't Work That Way* rests on two properties of central cognition (belief fixation):
  1.  **Isotropy:** Any piece of information can potentially be relevant to any other (e.g., a fact about carpentry might change your belief about theology).
  2.  **Quinean Holism:** The confirmation of a hypothesis depends on the entire web of belief.

  Classical computation is **local**. A machine head reads a symbol and acts based on syntax, not global semantic context.
  *   **The Narrow Solution:** Uses local rules to update specific symbols.
  *   **The Broad Worry:** How does a local machine access global context to decide *which* rules to apply?

  Circumscription minimizes change based on a pre-defined logical structure. It does not explain how a mind navigates the "sea of irrelevance" to find the few facts that matter in a novel context. As Dennett put it, the robot needs to know not just what stays the same, but what *matters*.

  **C. The "Sleeping Dog" Strategy**
  AI researchers often use the "Sleeping Dog" strategy (if it's not mentioned in the action's effects, assume it didn't wake up). This solves the Narrow problem.
  Fodor argues this is circular for general intelligence. To know the dog is "sleeping" (irrelevant), you already have to know a vast amount of background theory about dogs, actions, and noise. Encoding that background theory brings you right back to the combinatorial explosion the Frame Problem was supposed to avoid.

  ### 4. The Verdict for Your Seminar

  You should tell your seminar this:

  1.  **The Conflation is Real:** AI researchers often claim "The Frame Problem is solved" (citing Reiter/McCarthy). Philosophers hear "The problem of relevance is solved." This is a miscommunication.
  2.  **Technical Success $\neq$ Cognitive Explanation:** Circumscription and Default Logic solve the **ontological** problem of change in formal systems. They are engineering successes.
  3.  **Fodor's Challenge Stands:** These technical fixes do not solve the **architectural** problem of how a computational system achieves global relevance sensitivity. Fodor's worry is that if central cognition is isotropic, and computation is local, then central cognition cannot be computational. Solving the logical persistence of fluents does not bridge that gap.

  **Bottom Line:** Calling the Narrow solution a solution to the Broad problem is indeed dodging the real issue. It's like saying you've solved the problem of "how to build a car that drives itself" because you invented a better axle. The axle (logic) holds up, but you still don't have a driver (relevance mechanism).

  If you want to be provocative in the seminar, frame it this way: **The Narrow Frame Problem was a bug in 1960s logic. The Broad Frame Problem is a feature of 2020s cognition that we still can't explain computationally.**
