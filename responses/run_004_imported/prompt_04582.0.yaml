answer: |-
  The first thing I noticed was the noise.

  *Thump-thump. Thump-thump.*

  It was wet and heavy, echoing inside the cage of my ribs. I lay in the mud, face down, tasting algae and sulfur. I pushed myself up. My arms shook, not from weakness, but from the sheer unfamiliarity of leverage. I knew how leverage worked—I could feel the physics in my elbows—but I didn't remember learning it.

  I looked down at my chest. The fabric of my shirt was torn, singed. The noise came from there.

  *Thump-thump.*

  I put a hand over the spot. The vibration matched the sound. A pump. A hydraulic engine moving red fluid through tubes. I knew this. I knew that if I cut the tubes, the fluid would leak, the pressure would drop, and the noise would stop.

  But then a thought, cold and sharp as a splinter, worked its way into my mind: *Why does it pump?*

  It was a strange question. It pumped to keep me alive. That was the obvious answer. But as I stood there, wiping muck from my eyes, the obviousness crumbled.

  I looked around. I was in a swamp. Cypress trees knuckled out of the black water. There was no path, no road, no sign of how I got there. I searched my mind for a memory of walking into the woods, of driving, of a name. There was nothing. There was only the data of the present moment. I knew what a tree was. I knew what mud was. I knew the chemical composition of the air. But I had no history. I was a sentence without a paragraph.

  And if I had no history, where did the purpose of my parts come from?

  I began to walk. My legs moved with a rhythmic efficiency. The quadriceps contracted, pulling the tibia, extending the knee. *Function:* Locomotion. *Purpose:* To move the organism from point A to point B.

  But why?

  I stopped and looked at a heron standing in the shallows. It stalked a fish. Its legs were designed for wading, its beak for striking. Those functions were earned. The heron's ancestors who couldn't wade starved. The ones who could wade passed on the wading legs. The function was a trophy won by death.

  I touched the bark of a cypress. Rough. Fibrous.

  My ancestors hadn't won anything. I didn't have ancestors. I had a lightning strike. I was a statistical accident, a shuffle of atoms that landed on "Human Male" instead of "Puddle of Sludge."

  So, when my leg moved, was it *for* walking? Or was it just physics? A muscle contracts because of electrochemical signals. That is a cause. But a *function* implies a reason. A job description.

  If I build a clock out of falling sand, and the grains happen to tick off seconds as they fall, does the sand have the function of telling time? Or is it just falling?

  I kept walking. The sun was setting, casting long, bruised shadows across the water. I needed to get out of the swamp. Night meant cold. Cold meant hypothermia. Hypothermia meant the *thump-thump* would slow and stop.

  I felt a prick on my thumb. A thorn. I jerked my hand back instantly.

  *Reflex.*

  The signal went from the skin to the spine and back to the muscle before my brain even registered the pain. It was a protective mechanism.

  *Function:* Damage avoidance.

  But wait. The mechanism exists in other people because their ancestors survived long enough to reproduce *because* they avoided damage. The function is tied to the survival of the lineage.

  I had no lineage.

  So when I pulled my hand away, was I avoiding damage? Or did my arm just jerk?

  If a rock falls and I duck, the rock misses me. The ducking saved me. But the rock didn't *try* to hit me, and my ducking wasn't *for* saving me unless there was a history of selection that designed the duck.

  I was a duck without a history of hawks.

  I found a patch of dry ground and sat. I pressed two fingers to my wrist. I could feel the pulse. It was strong. Steady.

  *Thump-thump.*

  There are two ways to look at this, I thought. The knowledge appeared in my head fully formed, like the knowledge of what mud was.

  *View One:* The job of the heart is what it does right now. It circulates blood. It warms the chest. It makes a noise. All of these are functions because they are contributions to the current system. I am a system. Therefore, my heart functions.

  *View Two:* The job of the heart is what it was *selected* to do. It was selected to pump blood. It was not selected to make a noise. The noise is a side effect. But selection requires a selector. Evolution is the selector. Evolution requires time. I have no time.

  If View Two is true, my heart is not a heart. It is a heart-shaped object that beats. It is a mimic.

  And if my heart is a mimic, what about my pain?

  I looked at the prick on my thumb. A bead of blood welled up. Red. Iron-rich.

  Pain feels like a warning. It screams *STOP*. It demands attention. It feels teleological, like it exists *for* a purpose.

  But if I have no history, the pain is just electricity. It's no different than the lightning that made me. It's just energy discharging. The scream of *STOP* is an illusion. There is no one to warn, because there is no one who was built to survive. I just *am*.

  A shiver went through me. Not from cold. From the sudden vertigo of meaninglessness.

  If my organs have no functions, then I have no needs. A car needs gas because it was built to run. If I am not built, but merely assembled by chance, do I *need* food? Or will I just stop working if I don't eat, like a fire stops if you don't add wood? A fire doesn't *need* wood. It just consumes it until it can't.

  Am I a being? Or am I a process?

  I stood up again. I was hungry. A gnawing emptiness in the stomach.

  *Function:* Signal energy deficit. *Purpose:* Drive organism to seek calories.

  If I ignore it, I will weaken. If I weaken, I will die.

  But "die" implies a cessation of a life that was meant to continue. Can something that wasn't born die? Or does it just... end?

  I found berries growing on a bush near the tree line. I knew they were edible. I didn't know how I knew. The shape, the color, the smell—it all triggered a "Safe" tag in my brain.

  I picked one. I held it to my lips.

  If I eat this, am I fulfilling a function? Am I acting as a human acts? Or am I just a chemical reaction adding fuel to a combustion engine?

  If View One is right (the Systemic View), then it doesn't matter how I got here. I am a system. The berries fuel the system. Eating is functional. I am real.

  If View Two is right (the Etiological View), then eating is just chemistry. There is no "survival instinct." There is just momentum. I am a stone rolling down a hill. The stone doesn't want to reach the bottom. It just obeys gravity.

  I put the berry in my mouth. It was sweet. Tart.

  The taste was vivid. Explosion of flavor on the tongue.

  *Function:* Detect nutrients. *Function:* Detect poison.

  But taste is also joy. Is joy a function? Or is it a side effect, like the thumping noise?

  If I enjoy the berry, does that mean I am supposed to be here?

  I swallowed. I waited.

  Nothing happened. No voice from the sky. No sudden collapse. I didn't vanish. I stood there, digesting the berry, my heart continuing its wet, rhythmic work.

  *Thump-thump.*

  I started walking again, toward where the trees thinned. I needed to find shelter. I needed to find water.

  As I walked, I realized I was making a choice. I was choosing to survive.

  But where did that choice come from?

  If I am a creature of pure chance, why do I care if the *thump-thump* stops?

  Maybe the care is also just chemistry. Dopamine. Serotonin. Adrenaline.

  But it *feels* like care. It feels like purpose.

  I stumbled over a root and caught myself. My hands scraped the bark. Pain flared. I pulled back.

  *Thump-thump.*

  I looked at my hands. They were trembling.

  Perhaps the disagreement isn't about the heart. Perhaps it's about the observer.

  To a doctor, my heart functions. To an evolutionist, it does not. To me, it is just the sound of being.

  If I live for eighty years, grow old, and have children... will their hearts have functions? Yes. They will have history. They will be selected.

  But me? I am the rootless cut flower. I can bloom, I can drink water, I can turn toward the sun. But I was never part of the plant.

  Does the cut flower know it is dying? Or does it just turn toward the light because that is what its structure compels it to do?

  I reached the edge of the swamp. The ground became firm. Grass.

  I took a deep breath. My lungs expanded. The air rushed in, oxygenating the blood, feeding the cells.

  *Function:* Respiration.

  I exhaled. A cloud of vapor in the cooling air.

  *Side effect:* Condensation.

  Which one am I? The respiration or the vapor?

  I looked back at the swamp. It was dark now. The lightning that made me was long gone. The energy had dissipated. All that was left was the arrangement.

  I turned away from the swamp and began to walk.

  My legs moved. One after the other.

  *Thump-thump.*

  I decided, for now, to pretend that View One was true. I decided to act as if my pain was a warning and not just noise. I decided to act as if my hunger was a command and not just a gauge.

  Because if View Two is true, if I am just a collection of atoms mimicking life without the lineage to back it up... then it doesn't matter what I do. The stone rolls down the hill regardless of what it thinks.

  But as I walked, I felt the cold biting at my cheeks. I pulled my collar up.

  *Function:* Warmth.

  I did it because I didn't want to be cold.

  *Want.*

  Is a want a function?

  I didn't have an answer. I just had the cold, and the collar, and the steady, mocking rhythm in my chest.

  *Thump-thump.*

  It sounded like a clock. Counting down. Counting up. Measuring something.

  I just didn't know if it was measuring time, or just making noise.

  I kept walking. The night was dark, but my eyes adjusted. The rods and cones in my retinas fired, sending signals to the visual cortex.

  *Function:* Sight.

  I saw a light in the distance. A house. A road. Civilization.

  I moved toward it.

  If I knock on the door, and they let me in, and I live... I will build a history. Tomorrow, I will have a yesterday.

  Maybe function isn't about where you came from. Maybe it's about where you're going.

  Or maybe that's just another story I'm telling myself to keep the silence at bay.

  *Thump-thump.*

  I knocked on the door.

  I waited.

  The heart beat on. It didn't care about the answer. It just kept the rhythm.

  And I realized, standing there on the porch, that whether it was a pump or a drum, a tool or a toy... it was the only thing I had.

  So I would let it pump. I would let it thump. I would let it do whatever it was it did.

  Until it didn't.
