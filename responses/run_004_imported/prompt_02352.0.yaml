answer: |-
  You are absolutely right to be bothered, and you are not missing a "standard move" that makes the problem go away. You have put your finger on the central tension in the philosophy of language and formal semantics of the last 50 years.

  Lewis's 1976 triviality result is robust. Roughly, it shows that you cannot hold all three of the following simultaneously:
  1.  **Propositionality:** Indicative conditionals express propositions (have truth conditions).
  2.  **The Equation (Adams' Thesis):** $P(\text{if } A, C) = P(C|A)$.
  3.  **Non-Triviality:** There are non-trivial probability distributions over propositions.

  Since (3) is obviously true (the world isn't deterministic in that way), you must drop either (1) or (2).

  So, when you see semanticists (including your advisor) assigning possible-worlds truth conditions to indicatives as if Lewis never existed, it is **not usually sloppiness**. It is a deliberate theoretical choice to sacrifice (2) or to reinterpret the semantics in a way that claims to block the proof.

  Here are the three standard "escapes" currently on the market. Your advisor is likely using one of the first two, while the Adams/Edgington camp uses the third.

  ### 1. The Gricean/Jackson Move: Keep Truth Conditions, Drop the Equation
  This is the most common move in standard formal semantics (e.g., Frank Jackson, Paul Grice, and many working in a Stalnakerian framework).
  *   **The View:** Conditionals *do* have truth conditions (often the material conditional $A \supset C$, or a strict/variably strict conditional).
  *   **The Cost:** They deny that $P(\text{if } A, C) = P(C|A)$ is semantically true.
  *   **The Save:** They argue the Equation holds for **assertibility**, not truth. Jackson, for example, argued that while the truth conditions are material, the *conventional implicature* or assertibility conditions track conditional probability.
  *   **Why do this?** Because standard possible-worlds semantics handles **embedding** (negation, disjunction, conditionals inside conditionals) beautifully. Adams' probabilistic logic struggles mightily with nested conditionals. Semanticists prioritize compositional semantics over probabilistic intuition.

  ### 2. The Kratzer/Restrictor Move: Redefine the Syntax
  This is likely what your advisor is doing if they are working in modern modal semantics (Irene Kratzer, Kai von Fintel, Angelika Kratzer).
  *   **The View:** 'If' is not a binary propositional connective ($A \to C$) at all. It is a **restrictor** on a covert modal operator.
  *   **The Logic:** The logical form isn't $\text{IF}(A, C)$; it's $\text{MODAL}_{A}(C)$. The 'if'-clause restricts the domain of quantification for the modal.
  *   **The Save:** Lewis's triviality proof assumes 'if' forms a proposition that can be plugged into probability functions as a standalone unit. If 'if' clauses are just domain restrictors and don't denote propositions themselves, the triviality proof (in its original form) doesn't get off the ground.
  *   **The Catch:** Later triviality results (e.g., by Hájek) have targeted restrictor analyses too, showing that if you assume the restricted probability equals the conditional probability, you still face collapse. However, many semanticists believe the restrictor view offers enough wiggle room (via context sensitivity) to avoid the collapse in practice.

  ### 3. The Adams/Edgington Move: Keep the Equation, Drop Truth Conditions
  This is the view you are sympathetic to, championed by Ernest Adams and Dorothy Edgington.
  *   **The View:** Indicative conditionals are **not truth-apt**. They do not express propositions. They have no truth conditions.
  *   **The Logic:** The semantics is defined directly in terms of probability or acceptability conditions. $P(\text{if } A, C)$ is literally defined as $P(C|A)$.
  *   **The Cost:** You lose standard model-theoretic semantics. Explaining how conditionals embed under negation or in disjunctions becomes very difficult (the "Embedding Problem"). If "If A, C" isn't true or false, what does "It is not the case that if A, C" mean?
  *   **Why your advisor might ignore this:** For a formal semanticist building a compositional system for natural language, giving up truth conditions is nuclear. It makes integrating conditionals with the rest of the language (quantifiers, attitude verbs, tense) incredibly hard.

  ### Summary: Is it sloppy?
  No, it's a trade-off.
  *   **Adams/Edgington** prioritize the **probabilistic data** (The Equation feels intuitively correct).
  *   **Standard Semanticists** prioritize **compositional integration** (Conditionals need to behave like propositions to work with the rest of the grammar).

  When your advisor writes down truth conditions for indicatives, they are implicitly signaling: *"I am prioritizing compositional semantics and embedding over the strict preservation of Adams' Thesis, or I believe the Restrictor analysis blocks Lewis's specific proof."*

  **Recommendation for your reading group:**
  If you want to press the point, ask your advisor: *"How does your semantics handle the embedding of conditionals under negation without running into Lewis's triviality, given that you want to maintain the Equation?"*

  If they say "The Equation is only for assertibility," they are a Jacksonian.
  If they say "'If' is a restrictor, not a connective," they are a Kratzerian.
  If they say "Conditionals don't have truth values," they are an Adams/Edgingtonian (and you should ask them why they are using possible-worlds models).

  It is one of the few places in semantics where you genuinely cannot have your cake and eat it too.
