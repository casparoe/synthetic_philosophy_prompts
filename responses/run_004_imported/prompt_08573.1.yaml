answer: |-
  The wine was finished, the check had been paid, and the sidewalk outside the restaurant was cold, yet my friend and I stood there, locked in a philosophical deadlock. We had begun, innocently enough, with the Sorites paradox. If one grain of wheat does not make a heap, and adding one grain never makes the difference, how does a heap ever arise? But the conversation had quickly metastasized into a clash of meta-semantic worldviews. My friend, channeling Timothy Williamson, insisted that there *is* a specific number of grains where "heap" becomes true, we just cannot know it. I, defending a supervaluationist line, argued that there is no such number; there are only admissible ways of making the term precise, and in the borderline region, the sentence is neither true nor false.

  We parted without resolution, but the argument demands one. A stalemate in philosophy is often a sign that the terms of the debate are flawed. In what follows, I will reconstruct the strongest objections to both Epistemicism and Supervaluationism, assess their defensive resources, and argue that while Epistemicism is logically more robust than Supervaluationism, both ultimately fail because they assume a static model of meaning. The verdict is that neither view is correct; they must be replaced by a dynamic **Semantic Contextualism**.

  ### The Epistemicist Fortress and the Problem of Use

  My friend's position, Epistemicism, is the austere choice. It preserves classical logic in its entirety. The Law of Excluded Middle holds: for any number $n$, either "$n$ grains make a heap" is true or it is false. There is a sharp cutoff. Our ignorance is not due to the world or the words, but to our cognitive limitations.

  The strongest objection I raised over dinner was the **Argument from Use**. If meaning is determined by how we use words, and our use is fuzzy (we hesitate, we disagree, we vary), how can the meaning fix a sharp boundary? It seems magical to claim that the chaotic, gradient nature of human usage crystallizes into a precise integer $n$ that determines truth conditions. As I pressed him: "If meaning is nothing over and above use, where is this sharp line hiding?"

  Williamson's defense relies on the **Margin for Error Principle**. He argues that knowledge requires safety. To know a proposition $p$, $p$ must not be true merely by luck in nearby cases. In the Sorites series, adjacent cases are indiscriminable. If $n$ is the cutoff, you cannot know that $n$ is the cutoff because your discriminative abilities cannot distinguish $n$ from $n-1$. Thus, the sharp boundary exists (fixed by complex causal and social facts about usage), but it is *necessarily* unknowable.

  **Assessment:** This defense is technically coherent but metaphysically extravagant. It saves classical logic at the cost of making semantic facts verification-transcendent in a radical way. It posits that there are facts about meaning that are in principle inaccessible to any speaker, even in principle, despite meaning being constituted by speaker behavior. While the Margin for Error principle explains *why* we don't know the cutoff, it does not satisfactorily explain *how* the cutoff is fixed by fuzzy use without invoking a kind of semantic chaos theory where microscopic differences in usage determine macroscopic truth values. It is a bullet-biting solution: logically consistent, but intuitively repugnant.

  ### The Supervaluationist Castle and the Problem of Higher-Order Vagueness

  My position, Supervaluationism, feels more natural. It suggests that vague predicates are semantically incomplete. "Heap" can be made precise in many ways (precisifications). A sentence is "supertrue" if it is true on all admissible precisifications. In the borderline region, some precisifications say "heap," others say "not heap," so the sentence lacks a truth value. This captures the intuition that borderline cases are genuine gaps, not unknown facts.

  However, my friend landed a heavy blow with the **Higher-Order Vagueness Objection**. Supervaluationism introduces a "Definitely" operator ($D$). $Dp$ is true if $p$ is true on all admissible precisifications. The problem arises at the boundary of the admissible precisifications themselves. There must be a sharp line between a precisification that is *admissible* and one that is *inadmissible*. If there weren't, the set of admissible precisifications would be vague, and supertruth would be undefined. But if there is a sharp line between admissible and inadmissible precisifications, then there is a sharp boundary between "Definitely a heap" and "Not Definitely a heap."

  Supervaluationism was invented to avoid sharp boundaries, yet it reintroduces them at the level of "definiteness."

  **Assessment:** The Supervaluationist resources for defusing this are weak. One might claim that "admissibility" is itself vague, requiring a second-order supervaluation. But this leads to an infinite regress. Eventually, to define truth, one must stop the regress, and wherever one stops, a sharp boundary is posited. Supervaluationism manages to postpone the sharp cutoff, but it cannot eliminate it. It claims to respect the phenomenology of vagueness (the fuzziness), but its formal semantics betrays that phenomenology by imposing a sharp structure on the meta-language.

  ### The Verdict: The Static Assumption is the Enemy

  So, who won the dinner argument? If forced to choose between the two, **Epistemicism wins on logical coherence.** Supervaluationism promises to eliminate sharp boundaries but fails to do so at the higher order, rendering it internally unstable. Epistemicism admits the sharp boundaries upfront and provides a consistent logic to handle them.

  However, winning a battle of logical consistency is not the same as telling the truth about language. Both views share a fatal flaw: they assume **Semantic Staticism**. They both assume that the extension of a predicate like "heap" is fixed prior to our judgment and remains constant as we move through the Sorites series. Epistemicism says that fixed extension is sharp; Supervaluationism says it is a range of sharp extensions. But both assume the target is stationary.

  This is why both ultimately fail. The Sorites paradox is not a puzzle about where a line is drawn; it is a puzzle about why we think a line *must* be drawn in a static context. The solution is to recognize that the meaning of vague terms is **context-sensitive and dynamic**.

  ### The Replacement: Semantic Contextualism

  We should replace the Epistemicist/Supervaluationist dichotomy with **Semantic Contextualism** (championed by philosophers like Diana Raffman and Stewart Shapiro).

  On this view, the extension of a vague predicate is not fixed independently of our judgments. Instead, the boundary shifts *as* we make judgments. When I judge that $n$ grains are a heap, the context shifts slightly, altering the standard for the next judgment. When I judge that $n+1$ grains are a heap, the standard shifts again.

  This dissolves both objections:
  1.  **Against Epistemicism:** There is no sharp cutoff to be known or unknown. The boundary is fluid. This respects the "meaning is use" intuition because the meaning evolves with the conversational context. There is no magical fixed fact.
  2.  **Against Supervaluationism:** There is no need for a sharp boundary between admissible and inadmissible precisifications because there is no single set of admissible precisifications governing the whole series. The "gap" is not a truth-value gap in a static proposition, but a reflection of the instability of the context. Higher-order vagueness is handled naturally: the context can shift in ways that make the "definiteness" itself context-dependent.

  Contextualism explains why the Sorites argument seems compelling (within a single context, the premises look true) but why the conclusion is false (we cannot maintain a single context through the whole series). It accounts for the phenomenology of hesitation without positing truth-value gaps, and it accounts for the lack of sharp boundaries without positing unknowable facts.

  ### Conclusion

  My friend and I argued into the night because we were fighting over the location of a line that does not exist. Epistemicism draws the line in the dark; Supervaluationism draws it in the fog. Both assume the line is there. The correct verdict is that both views are mistaken remnants of a classical, static semantics ill-suited for vague language.

  We should not accept that "heap" has a sharp cutoff we cannot know, nor that it has a sharp cutoff of admissibility we cannot see. We should accept that the meaning of "heap" is a tool that adjusts to the task at hand. The paradox dissolves not when we find the boundary, but when we realize the ground is moving beneath our feet. Contextualism does not just win the argument; it ends it.
