  5.  **Drafting - Iteration 2 (Adding Flavor & Specifics):**
      *   Start with the tension. "I know why everyone is here."
      *   Explain the "Bet." Use a specific example (like a tax return or a code review).
      *   Explain the "Smear." If the lie is spread over 100 steps, the judge gets lost.
      *   End with the engineering mindset: We iterate, we measure, we don't assume.

  6.  **Refining the Content (incorporating specific constraints):**
      *   *Constraint:* "Catch a lie vs. invent one." -> Make sure this is the centerpiece.
      *   *Constraint:* "Obfuscated arguments." -> Need to explain this simply. "Needle in a haystack" or "Distributed latency bug."
      *   *Constraint:* "Not a cartoon explainer." -> Avoid "Imagine AI is a lawyer." Use "System verification."
      *   *Constraint:* "Not inside-baseball." -> Don't say "RLHF reward hacking." Say "gaming the metrics."

  7.  **Final Polish (Tone Check):**
