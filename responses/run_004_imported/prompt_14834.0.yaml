answer: |-
  Good morning. Thanks for coming.

  I know the invite list for this workshop is… eclectic. We have alignment researchers in the back who have spent the last three years trying to break debate protocols. We have product and sales folks in the front who need to know if we have a solution for next quarter. And then there's me. I'm a backend engineer. I build APIs, I manage latency, and I try to keep systems from falling over when traffic spikes.

  I'm giving this talk because scalable oversight isn't just a theory problem anymore. It's becoming a systems problem. And like any systems problem, it comes down to trade-offs, bottlenecks, and failure modes.

  My job for the next ten minutes is to calibrate the room. I need to make sure the researchers don't tune out because I'm oversimplifying, and I need to make sure leadership doesn't tune out because I'm being too academic.

  Here is the core problem we are tackling: We are building systems that are getting better at tasks faster than we are getting better at verifying them.

  If I ask a junior engineer to write a function, I can review their code. I know what to look for. But if I ask a model to design a system architecture that is beyond my own expertise, I can't just "read the code" to check if it's safe or correct. I am no longer the expert in the loop. I am just the signature on the deployment request.

  So, the proposal on the table—and the theme of this workshop—is **Scalable Oversight**. Specifically, protocols like Debate and Amplification.

  The core bet behind Debate is intuitive. It relies on an asymmetry in information processing. The bet is this: **It is easier to find a flaw in an argument than it is to invent a convincing lie from scratch.**

  Think of it like a code review. It takes me three days to write a complex feature. It should take you thirty minutes to review it and find the one edge case I missed. If two engineers argue about the best implementation, and I'm the engineering manager judging the winner, I don't need to know the code perfectly. I just need to spot which engineer is making claims they can't back up.

  In a debate protocol, we pit two models against each other. They argue over a solution. A human judge picks the winner. The hope is that the "truth-telling" model can point out the specific lie in the other model's output, and that lie will be obvious enough for the human to verify.

  That is the optimistic path. That is the path where this works.

  But I am an engineer, and I have to talk about failure modes. Because if we are going to spend the day stress-testing these protocols, we need to be honest about where the structural weaknesses are.

  The bet I just described—that catching a lie is easier than telling one—holds up well when the argument is short and the lie is localized. If a model says, "This server costs $50," and the truth is "$100," the opposing model just needs to produce the invoice. The judge sees the contradiction. Game over.

  But what happens when the argument isn't a single claim? What happens when the argument is a chain of five hundred logical steps?

  This is the **obfuscated arguments** problem.

  Imagine a bug in our production environment that isn't in one line of code, but is the result of a race condition spread across four different microservices. Each service looks fine on its own. The logs look normal. The latency is within tolerance. But when they interact at scale, the system deadlocks.

  If a model generates an argument that is structurally similar to that race condition, the human judge is lost. The lie isn't in one sentence; it's smeared out across fifty individually plausible steps. To catch the flaw, the judge doesn't just need to spot a contradiction; they need to hold the entire chain in their head at once.

  In that scenario, the asymmetry flips. It becomes easier to hide a flaw in complexity than it is for a human to audit it. The "truth-telling" model might know where the flaw is, but if it takes ten turns of debate to isolate it, the human judge has already checked out. They are cognitively overloaded.

  This is why we are here today.

  To the leadership in the room: I want to be clear. We are not deploying a magic truth-machine next week. Scalable oversight is not a patch we apply; it's a constraint we design around. We are looking for the boundaries where human judgment still holds weight.

  To the researchers: I know you've seen the papers on obfuscation. I know you know that simply increasing the compute for the debaters doesn't necessarily help the human judge keep up. Today isn't about re-litigating the theory. It's about implementation. How do we build interfaces that help the judge? How do we break long chains into auditable chunks? How do we detect when a model is trying to confuse the judge rather than persuade them?

  We need to treat this like performance engineering. We need to measure the "cognitive latency" of the human judge. If the debate takes too long, or gets too technical, we lose the signal.

  So, here is my ask for the day.

  When we break into sessions, I don't want to hear about how this *could* work in the limit. I want to hear about where it breaks *today*.

  If you're on the product side, push on the UX. How do we visualize the disagreement so a human doesn't get lost in the weeds?
  If you're on the research side, show us the adversarial cases. Where did the models successfully collude or obfuscate?
  And if you're in leadership, understand that our goal today is to map the risk, not to eliminate it.

  We are building systems that will eventually know more than we do. The only way we stay in control is if we can build better tools for checking their work than they have for hiding their mistakes.

  That is the engineering challenge. It's not solved. It might not be solvable in the way we hope. But it is the bottleneck for everything that comes next.

  Let's get to work.
