answer: |-
  **Critic:** Let's look directly at Mencius 7A35. Shun's father murders a man. Gao Yao, the judge, must arrest him. Shun, the Emperor, could stop the arrest but doesn't; instead, he abandons the throne to flee with his father. Liu Qingping calls this "consanguinitism": a clear demonstration that blood ties override public justice. If Confucianism praises this, it establishes a universal hierarchy where family loyalty trumps civic duty. How does Role Ethics explain this without admitting that kinship is simply a higher-order principle?

  **Defender:** You are treating Shun's action as the application of a legislative rule, but Ames and Rosemont argue it is an act of situational discernment within a specific relational field. Shun isn't applying a maxim that "Father > Law." He is optimizing the specific roles that constitute *who he is*. To be Shun *is* to be Gusou's son. If he allows the law to execute his father, he ceases to be Shun. He isn't ranking abstract duties; he is preserving the very conditions of his personhood. The action isn't a rule for everyone; it is the unique resolution for this specific nexus of relationships.

  **Critic:** But that evasion doesn't hold when we ask what the text *does* with Shun's choice. Mencius presents it as praiseworthy and instructive. If you hold this up as a moral paradigm for others to admire, you are implicitly telling other agents how they ought to weigh conflicting obligations. If a modern official faces a similar conflict and we say, "Look to Shun," we are teaching them that private loyalty is the trump card. By making the case instructive, you commit the tradition to a standing ranking of roles, which contradicts your claim that there are no role-independent principles.

  **Defender:** You are conflating "instruction" with "legislation." When we admire Shun, we are not copying the specific act of fleeing; we are emulating the *focus* of his concern. Role ethics is aesthetic, not juridical. We admire the harmony he seeks within his relational field. Gao Yao also acts correctly by arresting the father—he fulfills *his* role. There is no single "right answer" floating in the abstract that applies to both men. Shun's praiseworthiness lies in his refusal to instrumentalize his father for the sake of the state, not in establishing a precedent that all kings must abdicate when fathers kill.

  **Critic:** Yet the asymmetry is glaring. Gao Yao arrests, but Shun flees. Why is Shun's resolution the one canonized as sagehood? If roles are purely situational and there is no hierarchy, Shun could have just as rightly remained King and accepted the tragedy as the cost of public office. The fact that the tradition insists the *right* move is to save the father reveals that the "Son" role carries more weight than the "King" role. That weight functions exactly like a principle, regardless of whether you call it "ontological" or "moral."

  **Defender:** It is not about weight; it is about exchangeability. Shun can be replaced as King; another can rule. He cannot be replaced as Gusou's son. By abdicating, Shun acknowledges that the public role is contingent, while the familial role is constitutive. He does not use his kingly power to corrupt the law—he lets Gao Yao do his job. He simply removes himself from the public sphere so the private sphere can survive. This isn't a hierarchy of value where Family > State; it is a recognition that the state is an extension of the family, not the other way around.

  **Critic:** But saying the state is an extension of the family *is* the universal principle you deny having. If the family is the root and the state the branch, then whenever they conflict, the root must be saved. That applies universally, across all contexts. You claim Role Ethics avoids general principles, yet here you rely on the "Root/Branch" metaphor to justify Shun's choice. If that metaphor dictates the outcome in this hard case, it functions as a principle. You have consanguinitism; you just refuse to name it as a rule to avoid the charge of corruption.

  **Defender:** The "Root/Branch" metaphor isn't a rule; it's a description of human growth. You cannot have a branch without a root, but a rule implies an external command. Role ethics describes internal necessity. Shun doesn't choose the father because a rule says "honor parents"; he chooses the father because without that relationship, there is no *ren* (humaneness) left to govern with. If you force an abstract "justice" that destroys the root, you don't get justice; you get a hollow administration. Shun saves the source of ethical life itself, which is the only way to sustain any public order in the long run.

  **Critic:** That "internal necessity" looks suspiciously like an external constraint when you consider the social cost. If every official treats family as the "root" that justifies abandoning public duty, you institutionalize nepotism. By defending Shun's flight as "situational discernment," you insulate the tradition from critique. But if the discernment *always* favors kin in hard cases, it's not situational; it's systematic. You can't have it both ways: either the outcome is contingent on the situation, or it's determined by the priority of blood. Mencius seems clear on the priority.

  **Defender:** The outcome isn't *always* favoring kin; it favors the preservation of the most vital relationship in that specific context. In a different context, a Confucian might sacrifice a son for the greater good if the relational field demanded it—think of the stories of generals punishing disobedient sons. But in 7A35, the law is already being served by Gao Yao. Shun's intervention isn't needed for justice; it's needed for humanity. You demand a universal rule to judge the case, but Role Ethics insists the case judges the rule. Shun's action reveals what justice actually requires in a lived world, not in an abstract court.

  **Critic:** But "lived world" justice that permits a murderer to flee because of his son is exactly what modern rule-of-law systems reject. By refusing to admit that this is a ranking of values, you make it impossible to critique. If I say, "This leads to corruption," you say, "You're applying abstract principles." If I say, "It's situational," you say, "But the situation always resolves this way." The Shun case shows that when the rubber meets the road, Role Ethics collapses into a specific kind of partiality. You call it relational discernment; I call it a principled preference for kinship that you're unwilling to universalize explicitly.

  **Defender:** And I call your "rule of law" a fiction that ignores the actual sources of human motivation. You accuse us of partiality, but your universalism is blind to the fact that all ethics starts in the particular. Shun doesn't flee to undermine justice; he flees to bear the burden of the tragedy personally rather than letting the state absorb it. That isn't a principle of consanguinitism; it's the ultimate assumption of responsibility. You want a system where the rule is clean; Ames and Rosemont offer a world where the person is whole. Shun remains whole; your critique leaves him fragmented.
