  6.  **Writing the Dialogue:** (Mental outline of the flow)
      *   Start with coffee/office setting.
      *   Elena opens on the "truth-conditional" weight.
      *   Marcus counters with the "neutral counterpart" simplicity.
      *   Move to Reclamation. Marcus scores a point. Elena parries.
      *   Move to Mention/Quote. Elena scores a point. Marcus parries.
      *   End on the fundamental disagreement: Is it the *content* or the *act*?

  7.  **Final Review against constraints:**
