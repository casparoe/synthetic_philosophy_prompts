answer: |-
  This is a classic pivot point in the literature, and your grasp of the dialectic is spot-on. You've correctly identified the core tension: **Lewis preserves a unified, naturalistic metaphysics at the cost of counterintuitive extensions (profligacy), while McGrath preserves intuitive extensions at the cost of a unified, naturalistic metaphysics (normativity).**

  You asked for a verdict, not a fence-sit. Here is the hard line: **Lewis is metaphysically superior, but McGrath is phenomenologically more honest.** However, for a *Metaphysics of Causation* seminar, **Lewis's strategy is the robust one, and McGrath's is a category mistake.**

  Here is the breakdown you need for your paper and to dismantle your roommate's position.

  ### 1. The "Smuggling" Charge: Is McGrath Just Relocating Lewis?
  You asked if McGrath is just smuggling the same judgment Lewis makes into the metaphysics. The answer is **yes**, but the *location* of the smuggling matters.

  *   **Lewis:** The normativity is in the **context of assertion**. The world contains a vast web of counterfactual dependencies (you, the neighbor, the Antarctic guy). All are metaphysically equal. When we say "X caused Y," we are performing a speech act that selects X from the web based on salience, duty, or expectation.
  *   **McGrath:** The normativity is in the **causal relation itself**. The world does *not* contain a dependency between the Antarctic guy and the plant. The relation only exists if there is a deviation from a default.

  **Does this buy anything real?**
  It buys you **ontological parsimony regarding causes**, but it costs you **ontological parsimony regarding norms**.
  Lewis keeps the world clean (just events and dependencies) and puts the mess in our heads (pragmatics). McGrath keeps our heads clean (we just perceive causes) and puts the mess in the world (norms are now features of reality).

  **The Verdict on Smuggling:** McGrath isn't solving the problem; she's **ontologizing our biases**. By building "duty" or "default" into the causal relation, she makes causation dependent on the existence of normative facts. If there is no duty, there is no cause. This means causation becomes sensitive to moral or functional facts in a way that positive causation (shooting a gun) is not. This makes causation **disjunctive**: positive causation is physical; omission causation is normative. That is a massive metaphysical cost.

  ### 2. The Cost: The "No-Norm" Problem
  You asked if causation goes silent in cases without obvious norms. **Yes, and this is McGrath's fatal flaw.**

  Consider a wild orchid in a desert that dies because it didn't rain.
  *   **Lewis:** The lack of rain caused the death. (Counterfactual: If it had rained, it would live). Simple.
  *   **McGrath:** Did the lack of rain cause the death? Only if rain was "default." Is rain in a desert default? Statistically, no. Morally, the sky has no duty. Functionally, the sky has no function.
      *   If McGrath says "No cause," she violates our intuition that the drought killed the orchid.
      *   If McGrath says "Yes cause," she has to appeal to statistical norms. But statistical norms are fragile. If the desert is *usually* dry, then dryness is the default. Then the *absence* of dryness (rain) would be the deviant cause of the plant living. This leads to absurdity where the presence of a cause is less causal than its absence.

  Lewis handles this effortlessly. McGrath has to convolute her theory of "defaults" to cover natural kinds, which dilutes the normative force she wanted in the first place.

  ### 3. The Verdict: Why Lewis Wins (for Metaphysics)
  For your seminar, you should argue that **McGrath conflates Causation with Responsibility.**

  The reason we intuitively feel the Antarctic guy *isn't* a cause is that we aren't doing metaphysics; we are assigning blame. We care about omissions primarily in ethical and legal contexts. McGrath's theory is excellent for **Jurisprudence**, but terrible for **Metaphysics**.

  *   **Lewis's Strength:** He admits that "cause" is a bit of a folk concept when applied to omissions. He preserves the idea that the physical world is closed under physical laws. The Antarctic guy *is* part of the physical history of the plant (in terms of counterfactual space), but he is irrelevant to the *explanation*.
  *   **McGrath's Weakness:** She tries to make the explanation part of the physics.

  **The Winning Argument:**
  If you accept McGrath, you must accept that the **metaphysical structure of the universe changes based on human expectations.** If I adopt the basil plant, I suddenly create a metaphysical causal link between me and the plant that didn't exist yesterday. If I sell the plant, that link vanishes. This makes causation **mind-dependent** in a way that positive causation is not. If I push a rock, it moves regardless of my duties. If I *don't* push a rock, whether I "caused" it to stay still depends on whether I was *supposed* to push it.

  This heterogeneity is unacceptable for a general metaphysics of causation. It's better to say (with Lewis) that the causal dependence is always there, but our *interest* in it is what changes.

  ### 4. How to Win the Argument with Your Roommate
  Your roommate is operating on **McGrathian intuitions** (which are natural for everyday life). To win, don't attack their intuition; attack the **category**.

  *   **The Move:** Concede that the Antarctic guy isn't *responsible*. Concede that he isn't a good *explanation*.
  *   **The Trap:** Ask them: "If I'm trying to build a God's-eye-view simulation of the universe, do I need to include the Antarctic guy's non-action to fully account for the state of the basil plant?"
  *   **The Point:** If they say "No," they are talking about explanation/pragmatics (Lewis). If they say "Yes," they have to explain how a guy in Antarctica physically connects to the basil without any energy transfer.
  *   **The Killer:** Tell them McGrath's view implies that if you quit your job as a plant-waterer, the *physics* of the plant's death changes. Causation shouldn't depend on employment contracts.

  ### 5. Strategy for Your Response Paper
  Don't just summarize. Take a stance. Here is a recommended outline for a strong paper:

  1.  **Thesis:** While McGrath's normative account better matches our intuitive judgments about responsibility, it fails as a metaphysical theory because it renders causation heterogeneous and mind-dependent. Lewis's pragmatic solution is metaphysically cheaper, even if it is extensionally profligate.
  2.  **The Profligacy Objection:** Acknowledge the Antarctica problem. It's the strongest point against Lewis.
  3.  **The Normative Cost:** Argue that McGrath solves profligacy by making causation sensitive to normative facts. Show how this makes causation unstable (e.g., if norms change, causes vanish). Use the "Wild Orchid" case to show where her view struggles.
  4.  **The Heterogeneity Objection:** This is your heavy hitter. Positive causation doesn't require norms; omission causation (on McGrath's view) does. Why should "cause" mean two different things? Lewis keeps the meaning unified (counterfactual dependence) and explains the difference via pragmatics.
  5.  **Conclusion:** We should accept Lewis's "bullet." The Antarctic guy is a cause, but a *boring* one. Metaphysics should track dependence, not interest.

  **One Caveat to Mention (to show sophistication):**
  Acknowledge that Lewis's later view ("Void and Object") admits omissions are "ontologically cheap"—they aren't events, they are absences. This helps Lewis avoid saying the Antarctic guy performed an "action." He just *didn't do* something. This weakens the idea that the Antarctic guy is a "positive cause," aligning Lewis closer to McGrath without adopting her normativity.

  **Summary for your Friday deadline:**
  McGrath fixes the intuition by breaking the metaphysics. Lewis keeps the metaphysics by bruising the intuition. In a metaphysics seminar, **keep the metaphysics.** Go with Lewis, but argue that the "pragmatics" aren't just an afterthought—they are the necessary bridge between physical dependence and human explanation. McGrath tries to build the bridge into the terrain, and that's where she falls.
