prompt: |-
  ok so this is going to sound like a case study from my philosophy of law elective but its actually happening in my dorm rn and i need a sanity check. i sit on the accountability committee for my housing co-op (we're fully self governed, have our own bylaws, the works). one of our members has been seeing three different people this semester, totally open and consensual, everyone involved knows about everyone else, and she always checks with roommates before anyone stays the night. she pays dues on time, follows quiet hours, cleans up after herself, zero complaints about anything she actually does. but a few housemates filed a formal complaint calling her "lifestyle" inappropriate for a shared house and claiming it could hurt the co-op's reputation with alumni donors if it got around, and they want the committee to pass a new cap on overnight guests per week that would basically only ever apply to her. nobody's pointed to a single concrete harm, no one's sleep or space or safety is actually affected, it pretty clearly just makes people uncomfortable. we vote tomorrow night. is the committee within its rights to regulate this because enough of us are bothered by it, or would that just be using the bylaws to punish something people find distasteful?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Context:** A housing co-op (self-governed, has bylaws, accountability committee).
      *   **Subject:** A member (let's call her "Member A") practicing ethical non-monogamy (seeing three people, consensual, open).
      *   **Behavior:** Checks with roommates, pays dues, follows quiet hours, cleans up, no concrete complaints about *actions*.
      *   **Complaint:** Filed by some housemates claiming "lifestyle" is inappropriate, worries about reputation with alumni donors.
      *   **Proposed Solution:** A new rule capping overnight guests per week (targeted at Member A).
      *   **Core Conflict:** Community comfort/reputation vs. Individual autonomy/fairness/non-discrimination.
      *   **Question:** Is the committee within its rights to regulate this based on discomfort, or is this punitive/disciplinary misuse of bylaws?

  2.  **Identify the Legal/Philosophical Frameworks (since the user mentioned "philosophy of law elective"):**
      *   **Harm Principle (Mill):** Can power be rightfully exercised over a member against her will? Only to prevent harm to others. Discomfort $\neq$ Harm.
      *   **Legal Moralism (Devlin):** Can society enforce morality for its own sake? Generally frowned upon in modern liberal democracies, but possible in private contracts.
      *   **Contract Law/Bylaws:** Co-ops are private associations. They have broad discretion *but* must follow their own procedures and cannot violate higher laws (fair housing, discrimination).
      *   **Procedural Justice:** Is the rule general or targeted? Is it retroactive? Is it proportional?
      *   **Discrimination/Harassment:** Is this targeting based on relationship status or sexual orientation? (Potential legal risk).

  3.  **Evaluate the Committee's Position:**
      *   *Rights:* As a private co-op, they *can* make rules about guests.
      *   *Constraints:* Bylaws usually require rules to be for the "benefit of the community," not punitive. Fair Housing Laws (in the US) often protect against discrimination based on marital/familial status, though "relationship style" is a grey area.
      *   *Precedent:* Targeting a specific person with a new rule is legally and ethically shaky ("Bill of Attainder" concept, though not strictly applicable in private housing, the principle holds).

  4.  **Evaluate the Complaint:**
      *   *Basis:* "Reputation" and "Discomfort."
      *   *Validity:* Speculative harm (donors might stop giving). No actual harm (sleep, space, safety unaffected).
