answer: |-
  This is not just a philosophy of law case study; it is a textbook example of the tension between **legal moralism** (enforcing shared morality) and **liberal neutrality** (allowing individual freedom unless harm occurs).

  You are right to feel that something is off here. To give you the short answer: **Yes, the committee *could* technically pass this if your bylaws allow for simple majority rule on house rules, but doing so would likely violate the spirit of your bylaws, open the co-op to legal liability, and set a dangerous precedent for everyone.**

  Here is a breakdown of the arguments you can use tomorrow night to sanity-check your committee and advocate for a "no" vote.

  ### 1. The Harm Principle vs. Mere Offense
  In philosophy of law (thanks, John Stuart Mill), the only justification for exercising power over a member against their will is to **prevent harm to others.**
  *   **The Argument:** "Discomfort" or "moral disapproval" is not harm. Harm is noise, dirt, unpaid dues, or safety violations. The complaint admits there are zero concrete harms.
  *   **The Point:** If the co-op regulates based on *feelings* rather than *actions*, no one is safe. Today it's polyamory; tomorrow it could be someone's political signs, religious practices, or dietary habits that make others "uncomfortable."

  ### 2. "Bills of Attainder" (Targeted Legislation)
  In constitutional law, a "bill of attainder" is a legislative act that singles out an individual or group for punishment without a trial. While your co-op isn't a government, the **principle of general applicability** is crucial for fair governance.
  *   **The Argument:** A rule created specifically to target one person's existing behavior is punitive, not regulatory.
  *   **The Point:** Good rules are written to solve a *problem* (e.g., "hallways must be clear"), not to catch a *person*. If the rule is designed so that it only ever applies to her, it is a sanction disguised as a policy. This undermines the legitimacy of the committee.

  ### 3. Fair Housing and Discrimination Risks
  This is the practical "law" part. While co-ops have more leeway than public landlords, they are not immune to discrimination laws.
  *   **The Argument:** In many jurisdictions, **marital status** and **sexual orientation** are protected classes. While "polyamory" isn't always explicitly protected, regulating the number of partners or overnight guests based on relationship structure often triggers scrutiny under fair housing laws.
  *   **The Point:** If Member A feels targeted due to her relationship structure, she could file a discrimination complaint. Alumni donors are generally more scared of **lawsuits and bad press regarding discrimination** than they are about consensual adult relationships. The "reputation" argument actually cuts the other way: passing this rule makes the co-op look discriminatory.

  ### 4. The "Reputation" Argument is Speculative
  The complainants are arguing from a place of speculation ("*could* hurt reputation").
  *   **The Argument:** There is no evidence that alumni donors withdraw funding because of consensual non-monogamy. There *is* evidence that donors withdraw funding due to mismanagement, toxicity, and internal conflict.
  *   **The Point:** Creating a hostile environment for a member is a much bigger reputational risk than the member's private life.

  ### 5. Co-op Values and Precedent
  Most housing co-ops are founded on principles of autonomy, mutual aid, and trust.
  *   **The Argument:** This member is doing everything right. She communicates, she cleans, she pays. She is the *ideal* co-op member.
  *   **The Point:** If you punish the ideal member because a minority is morally uncomfortable, you signal to everyone that **conformity is valued over contribution.** This will drive away good members who value privacy and autonomy.

  ### Strategy for the Vote Tomorrow
  Don't just say "This is unfair." Use the committee's own language against the proposal.

  1.  **Ask for Evidence:** "Can the complainants provide evidence of actual harm? Not discomfort, but tangible negative impact on the house operations?"
  2.  **Test for General Applicability:** "If we pass this cap, are we prepared to enforce it on everyone equally? If a monogamous couple visits for two weeks straight, will we evict them? If not, this rule is selectively enforced."
  3.  **Highlight the Liability:** "I am concerned that regulating a member's relationship structure opens us up to fair housing complaints. Is the house prepared to handle that legal risk?"
  4.  **Reframe the "Reputation":** "Our reputation is built on how we treat our members. Targeting a member who pays dues and follows all other rules looks like bullying, not governance."

  ### The Sanity Check
  You are not crazy. This is a classic **"Tyranny of the Majority"** scenario. Just because enough people vote for something doesn't make it just.

  *   **Is it within your rights?** Technically, private contracts (bylaws) allow a lot.
  *   **Is it right?** No. It is using the machinery of governance to enforce moral conformity on a member who has violated no actual agreement.

  If the vote passes, Member A may have grounds to challenge it based on the bylaws' own provisions regarding "good faith" or "non-discrimination," or she may simply choose to leave (which is the co-op's loss).

  **Recommendation:** Vote **NO**. Frame it as protecting the *process* and the *community standards*, not just defending the individual. If you allow rules to be made based on moral discomfort rather than tangible harm, you break the social contract of the house for everyone.

  *Disclaimer: I am an AI, not a lawyer. This is philosophical and policy analysis, not legal counsel. If things escalate, Member A should consult a tenant rights organization.*
