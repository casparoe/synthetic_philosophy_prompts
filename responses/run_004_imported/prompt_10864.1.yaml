answer: |-
  This is a fantastic detail to hang a character's intellectual history on. The Augustine-Jerome correspondence (specifically *Letters 28, 40, 71, and 82*) is one of the high-water marks of patristic theology, and your character latching onto this specific moment tells me they understand *systematic* theology, not just Bible verses.

  To answer your core question: **No, it is not just a slippery-slope fallacy.** While it looks like one on the surface ("If we allow this, then anything goes"), Augustine is actually making a **hermeneutical coherence argument**. He is arguing about the *conditions of possibility* for authoritative text.

  Here is the breakdown of the logic, the connection to his ethics of lying, and how your character can wield this without sounding like a Sunday School teacher.

  ### 1. The Logic: Epistemic Trust vs. Subjective Intent
  Jerome's argument was essentially: *Paul didn't really mean Peter was wrong; he pretended to rebuke him to teach the Judaizers a lesson. It was a performance.* Jerome thought this protected Peter's authority.

  Augustine's counter-argument is about **interpretive criteria**.
  If you establish a rule that says, *"An author in Scripture may intentionally state falsehoods if the motive is pious,"* you have destroyed the only objective metric the reader has for distinguishing truth from fiction.

  *   **The Slippery Slope Charge:** "If we allow one lie, soon everyone will say everything is a lie."
  *   **Augustine's Actual Logic:** "If 'pious intent' validates falsehood, then 'difficulty' becomes proof of falsehood."

  Augustine is saying that the moment you allow *intent* to override *statement*, the text ceases to be a revelation and becomes a Rorschach test. If a passage is hard to believe (e.g., a miracle, a harsh judgment), the reader can now say, "Ah, the author just said that for effect/duty." It renders the text functionally useless as a source of objective truth.

  **For your character:** They shouldn't frame this as "God will get mad." They should frame it as **the collapse of language.** If words don't have to correspond to reality to be "holy," then holy words mean nothing.

  ### 2. The Ethics: *De Mendacio* and the Nature of Truth
  This connects directly to Augustine's treatises *On Lying* (*De Mendacio*) and *Against Lying* (*Contra Mendacium*). Augustine holds a hard line: **There is no such thing as a good lie.**

  *   **Jerome's View:** Utilitarian. A lie told to protect the faith (an "officious lie") is permissible because the outcome (unity/truth preserved) is good.
  *   **Augustine's View:** Ontological. God *is* Truth (*Veritas*). To lie is not just to break a rule; it is to move away from the being of God.

  For Augustine, truth isn't just "accuracy"; it's a state of being. If Paul (inspired by the Spirit) lies, then the Spirit is complicit in falsehood. If the Spirit complicit in falsehood, then Truth is not absolute. If Truth is not absolute, Salvation (which relies on knowing the Truth) is impossible.

  **The Connection:** The Galatians debate isn't just about Peter's ego. It's about whether the *medium of salvation* (Scripture) is contaminated. If the Apostles used "holy deception" to manage the early church, how do we know they aren't using it to describe the Resurrection?

  ### 3. How the Character Defends This (Without Sounding Preachy)
  A lapsed seminarian knows the doctrine but has likely stepped away from the *faith* part. They might admire Augustine's intellectual rigor even if they no longer believe the conclusions. They appreciate the *stakes*.

  Here are three ways your character can articulate this, depending on their current mindset:

  **Option A: The Intellectual Appreciation (Admiring the Rigor)**
  > "People think Augustine was being paranoid about Jerome's 'pious fiction' theory. They call it a slippery slope. It wasn't. It was about the integrity of language itself. Augustine realized that if you grant that a sacred author can lie for a 'good cause,' you haven't just opened a door; you've removed the wall between fact and utility. Once you decide truth is subservient to outcome, you can't actually know anything. Augustine would rather burn the world than admit that God negotiates with reality."

  **Option B: The Cynical/Lapsed View (Seeing the Trap)**
  > "I get why Jerome wanted Paul's rebuke to be staged. It makes the Apostles look nicer. Less infighting. But Augustine saw the trap. If you allow one 'officious lie' in the text, then every difficult verse becomes suspect. 'Oh, the Flood didn't happen, that was just for dramatic effect.' 'Oh, the Resurrection is just a metaphor for hope.' Augustine knew that if you let 'intent' override 'statement,' the text dissolves. He was right about the logic, even if I'm not sure he was right about the God behind it."

  **Option C: The Personal Struggle (The Weight of Truth)**
  > "It comes down to whether the end justifies the means. Jerome thought lying to save a doctrine was fine. Augustine said no—because if the doctrine is built on a lie, it's already dead. I remember wrestling with that. If you have to fake it to keep people in the fold, have you already lost them? Augustine's argument is terrifyingly clean: If there is one lie in the sanctuary, the sanctuary is profane. There's no middle ground. And maybe... maybe that lack of middle ground is why I had to leave."

  ### 4. Key Vocabulary for Authenticity
  To make the character sound like they've actually read the *Letters*, have them drop these specific concepts naturally:

  *   **"Officious Lie" (*mendacium officiosum*):** A lie told for someone's benefit. Jerome accepted this; Augustine rejected it.
  *   **"Economy" (*oikonomia*):** The theological term often used for "divine management" or staged actions. Jerome argued Paul was using an "economy." Augustine argued this makes God a playwright of deception.
  *   **"The Rule of Faith":** The standard by which Scripture is interpreted. Augustine argues Jerome's rule breaks the Rule of Faith.
  *   **"Charity vs. Truth":** Jerome argued Charity (protecting Peter) demanded the lie. Augustine argued Truth *is* Charity, because you cannot love someone with a falsehood.

  ### Summary for the Character's Internal Logic
  Your character can defend Augustine's position by arguing that **trust is binary.** You cannot have "mostly reliable" authority when it comes to ultimate reality. If the mechanism of revelation is compromised even once for a "good reason," the mechanism is broken forever.

  It's not a slippery slope; it's a structural failure. Like a bridge: if one load-bearing beam is made of balsa wood "just for testing," you cannot drive on the bridge, because you can no longer distinguish the balsa from the steel.

  This gives your character a profound respect for Augustine's intellect—they see him as a man who understood that **consistency is the price of authority.**
