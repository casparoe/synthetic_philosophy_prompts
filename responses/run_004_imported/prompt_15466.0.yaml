answer: |-
  Good evening. For those of you I haven't had the pleasure of annoying yet, I'm [Your Name]. I started at this paper thirty years ago as an intern at Marion's desk. I eventually moved to science, but I never really left her classroom.

  If you work in journalism, you know the feeling. You've chased a story for months, your notebook is thick, your sourcing is bulletproof, and then… nothing. The source recants, the document is a forgery, the world moves on. Or, conversely, you take a flyer on a hunch, do the bare minimum, and it lands on the front page and wins a Pulitzer.

  Marion Voss spent thirty-eight years trying to cure us of the urge to confuse those two outcomes with success and failure.

  Many of you in this room remember her ethics seminar. Specifically, you remember the thought experiment. Two reporters. Identical tips. Identical diligence. One story wins a prize; the other wrecks a life because of a factor neither could have controlled. Marion would look around the room, smoke curling from her ashtray—yes, back then—and ask, "Which one deserves the raise?"

  Half of us would squirm. The other half would say the winner, because that's how the world works. Marion would spend the next hour dismantling that instinct. She taught us that "Moral Luck"—the idea that we are judged by things outside our control—is the enemy of integrity.

  But tonight, I'm not here to give a lecture. I'm here to talk about how Marion lived that lesson.

  In a profession obsessed with bylines and awards, Marion was a study in asymmetry. When an investigation landed softly, despite her team's rigorous work, she took the blame. She told the publishers the process was flawed, even when it wasn't, because she refused to let her reporters carry the weight of bad luck. She absorbed the randomness of the universe so her team could sleep at night.

  And when a story soared? When the phones rang off the hook and the awards committees called? She deflected. She'd say the reporters did the work, the sources spoke up, the timing was right. She treated success as a variable she couldn't control, and therefore, not something to boast about.

  To her publishers in the room: I know you value results. But I'm asking you to value what produced them. Marion's legacy isn't just the scandals she uncovered. It's the hundreds of journalists who learned that their worth wasn't tied to the daily lottery of the news cycle. It's the knowledge that doing the right thing matters even when the world doesn't applaud it.

  And to Marion's family—her husband, her children—I know you see a different side of her. You see the woman who worries about whether everyone has eaten, who remembers birthdays, who listens more than she speaks. You might be surprised to hear that the same rigor she applied to a source's claim, she applied to her love. She didn't love us because it was easy, or because it always worked out. She loved us because it was the right thing to do. That is a much sturdier foundation than luck.

  There is a philosophical trap, though. If we focus too much on luck, we start to think nothing is our fault, and nothing is our credit. We become ghosts in our own lives. Marion never fell into that trap. She believed fiercely in agency. She believed that while we can't control the wind, we are absolutely responsible for how we set the sails.

  She is retiring now. The stories will stop. The luck, good and bad, will run out. But the character remains.

  So, I invite you all to stand and raise a glass.

  We are not toasting the headlines, or the prizes, or the lucky breaks. We are toasting the diligence that survives when the luck runs out. To Marion: may your next chapter be judged not by the outcome, but by the joy you find in the process.

  To Marion.
