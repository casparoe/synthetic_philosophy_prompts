answer: |-
  **Setting:** *The garden of Prince Pingyuan, in the State of Zhao. It is late afternoon. Gongsun Long, dressed in the precise robes of a scholar-official, stands by a stone table. Xunzi, older and wearing the simpler garb of a traveling teacher, sits opposite him. A servant pours tea.*

  **Gongsun Long:** You have heard the proposition, Master Xun. It is simple: A white horse is not a horse.

  **Xunzi:** I have heard it. I have also heard stable masters laugh until they wept upon hearing it, and magistrates frown because they do not know whether to tax the white horse as livestock or as a white object. Simplicity is not truth, Master Gongsun.

  **Gongsun Long:** The stable master laughs because he hears with his ears, not his mind. He hears "is not" (*fei*) and thinks I mean the animal does not exist. I mean the *name* does not match. Tell me: If a man seeks a horse, may a yellow horse or a black horse satisfy him?

  **Xunzi:** Naturally. All are horses.

  **Gongsun Long:** But if a man seeks a *white* horse, will a yellow or black horse satisfy him?

  **Xunzi:** No. He seeks a specific color.

  **Gongsun Long:** Precisely. If the white horse were identical to the horse, then seeking a white horse would be the same as seeking a horse. If seeking them were the same, then a yellow horse would satisfy both requests. But a yellow horse satisfies one and fails the other. Therefore, the white horse is not the horse. To say "white horse is horse" is to confuse a compound name with a simple name. "Horse" names the shape. "White" names the color. "White Horse" names color and shape. A thing that names two attributes cannot be identical to a thing that names one.

  **Xunzi:** You argue from the precision of attributes, I grant you. In the realm of abstract definitions, "shape plus color" is indeed distinct from "shape alone." I will not deny that the concept *White Horse* has a narrower scope than the concept *Horse*. But you leap from "the concepts differ" to "the white horse is not a horse." You use *fei* (is not) to sever the connection entirely, rather than to distinguish the specification.

  **Gongsun Long:** If I say "A is B," I imply identity. If I say "A is not B," I imply distinction. If the white horse is truly a horse, then the category "Horse" must contain the white horse in the exact same way it contains the yellow horse. But it does not. The white horse carries a restriction the yellow horse does not. To ignore this restriction is to be sloppy.

  **Xunzi:** To ignore the restriction is to speak like a human being. Master Gongsun, you treat names as if they are locks to be picked with logic. I tell you they are bridges to be walked by society.

  **Gongsun Long:** Bridges built on sloppy foundations collapse.

  **Xunzi:** And bridges built on impossible specifications lead nowhere. Consider the Kings of old. They established names not to carve reality into ever-smaller logical fragments, but to unify the people. When the Sage King said "Horse," he meant the class of animals that pull chariots and plow fields. When he said "White Horse," he meant a subset of that class. The relationship is one of inclusion, not exclusion. To say "White Horse is not Horse" is like saying "A son is not a human." Logically, perhaps the role of 'son' differs from the biology of 'human,' but if you tell a man "Your son is not human," he will strike you.

  **Gongsun Long:** He strikes me because he is emotional, not because I am wrong. If I say "A son is not a human," I am speaking loosely. But if I say "The role of 'son' is not identical to the concept of 'human'," I am precise. My point is this: If we allow "White Horse is Horse," we validate the idea that adding a modifier changes nothing. If adding "white" changes nothing, then language has no power to distinguish. If language cannot distinguish, how do we govern?

  **Xunzi:** *(Leans forward)* Ah, so you claim to care for governance? Then let us speak of it. You say language distinguishes. I say language coordinates. Suppose I am a general. I order my scout: "Bring me a horse." He brings a white horse. Have he disobeyed?

  **Gongsun Long:** No.

  **Xunzi:** I order: "Bring me a white horse." He brings a black horse. Has he disobeyed?

  **Gongsun Long:** Yes.

  **Xunzi:** In both cases, the animal brought is a horse. In the second case, it is simply the *wrong* horse. But if we adopt your maxim—"White Horse is Not Horse"—then in the second case, the scout has not brought the wrong horse; he has brought *no horse at all*. He has brought a "non-horse." Do you see the danger? You are not clarifying reality; you are fracturing the shared convention that allows orders to be understood.

  **Gongsun Long:** I am preventing the confusion that arises when we treat specifications as accidents. If the state relies on the assumption that "Horse" covers all variations equally, the state will fail when a specific variation is required. By insisting "White Horse is Not Horse," I force the listener to acknowledge the specificity of the demand. I force them to think. Is it not better for a minister to think than to assume?

  **Xunzi:** It is better for a minister to understand his place. And names determine place. When the fathers of the School of Names argue that "A chicken has three legs"—counting the concept of 'leg' plus the two physical legs—you create a paradox that amuses the intellect but starves the belly. If I tell my servants "White horses are not horses," and they follow your logic, they may exempt my white chariot team from the tax on livestock. They may exclude them from the levy for military mounts.

  **Gongsun Long:** Then the tax law is poorly written. It should say "All equines of riding height."

  **Xunzi:** *(Sighs)* And there it is. You would rewrite the world to fit the logic. I say we must use logic to serve the world. The flaw in your argument, Gongsun Long, is not in your deduction. Your deduction is tight. If we accept your premise that "is" means "is identical in every attribute," you are correct. But that is not how "is" functions in the human realm. In the human realm, "is" means "belongs to the community of."

  **Gongsun Long:** But that is exactly where the corruption begins! "Belonging to the community" is vague. It allows a ruler to call a tyrant a "King" simply because he holds the power. It allows a man to call a usurper "Righteous" because the people accept him. I insist on rigid definitions because loose definitions allow moral hazards. If a white horse can be a horse, then a bad ruler can be a ruler. I wish to separate them.

  **Xunzi:** And in separating them, you separate the thing from its function. A ruler who is bad is still a ruler—he holds the seal, he commands the army. To say he is "not a ruler" is to deny the reality of his power, which makes him harder to oppose. We must call him a "Bad Ruler," not a "Non-Ruler." Similarly, call it a "White Horse," not a "Non-Horse."

  **Gongsun Long:** You fear that if we admit distinctions, we lose unity.

  **Xunzi:** I fear that if we prioritize distinction over convention, we lose communication. If you and I cannot agree on the basic categories of things because you are busy dissecting the semantics of "is," we cannot discuss the Way. You treat names as mirrors of metaphysical truth. I treat names as tools of social agreement. A tool that cuts the hand of the user is a bad tool, no matter how sharp the blade.

  **Gongsun Long:** A tool that cannot cut because it is dull is also useless. If we do not sharpen our language, we will be unable to cut through the lies of the Warring States. You say my logic is harmless wordplay. I say it is a vaccine. It hurts, yes. It confuses the stable master. But it inoculates the mind against accepting "Horse" when "Ox" is presented, simply because both are "livestock."

  **Xunzi:** *(Pauses, taking his tea)* You speak of inoculation. But a vaccine given in too high a dose kills the patient. If you teach the people that common categories are false, they will cease to trust any category. If "White Horse is not Horse," then perhaps "Father is not Kin," or "Ruler is not Superior." Once the hierarchy of names is shaken, the hierarchy of society crumbles. That is not precision, Gongsun Long. That is chaos wearing the mask of rigor.

  **Gongsun Long:** Then let us agree on this: The logic holds, but the application requires wisdom.

  **Xunzi:** I will agree to this: The distinction is logically valid, but the statement "White Horse is Not Horse" is socially pernicious. You may keep your logic in the academy, where it sharpens the mind. But do not bring it into the marketplace, or the court. There, we must say "White Horse is Horse," understanding that we mean "is a member of," not "is identical to."

  **Gongsun Long:** And I will say: You may keep your conventions in the marketplace. But do not bring them into the academy, or the law codes. There, we must know exactly what we are taxing, and what we are commanding.

  **Xunzi:** *(Smiles faintly)* So. We have divided the world into two: The world as it is thought, and the world as it is lived.

  **Gongsun Long:** It seems we have. Though I maintain that if you lived in the world as it is thought, you would pay fewer taxes.

  **Xunzi:** And I maintain that if you thought in the world as it is lived, you would eat more dinner. *(He gestures to the servant)* Bring more tea. For both of us. Regardless of whether the cup is "white" or merely "ceramic."

  **Gongsun Long:** *(A rare, thin smile)* Provided it is not a "non-cup."

  **Xunzi:** Let us not start again. Drink.
