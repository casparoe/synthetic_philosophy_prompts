answer: |-
  The mud in the trench didn't smell like earth; it smelled like wet copper and old meat. Jax and Vern sat back-to-back against the sandbags, their rifles across their knees, sharing a cigarette that burned down to the filter without either of them speaking. They had an agreement, whispered three nights ago when the mortar fire was distant and the cold was the only enemy that mattered. If the big barrage came—the one the officers said wouldn't happen—they wouldn't hold the line. They would run. Not together, that was suicide, but at the first scream of the inbound shells, they would scramble over the rear parapet and vanish into the cratered no-man's-land behind them.

  It was a settled thing. A part of them. Both men knew, with the quiet certainty of knowing your own name, that when the sky opened up, they would flee. They had checked the wire cutters. They had memorized the patrol gaps. The disposition was set.

  Then the horizon lit up.

  It started as a low thrum, a vibration in the teeth, before the first whistle tore the air. The barrage wasn't distant anymore. It was here. The ground jumped. A shell landed twenty yards up the line, detonating with a wet thud that showered them in dirt and shrapnel.

  This was the test. The condition they had agreed upon.

  Jax felt the first explosion rattle his ribcage. In the split second before the debris settled, he prepared to move. He coiled his muscles, his mind fixed on the gap in the wire ten yards back. But as the second shell landed, closer this time, shaking the trench walls until dust rained from the overhead planking, something strange happened. The fear didn't spike. It didn't flood his system. Instead, the sheer violence of the noise seemed to cauterize the thought of running.

  The stimulus of the barrage acted like a switch. The moment the danger became immediate and absolute, the urge to flee evaporated. It wasn't that he overcame the fear; it was that the fear transformed into a cold, static focus. The plan to run required a future to run *into*, and the shells were erasing the future second by second. Jax looked at his hands. They were steady. He looked at the rifle. It felt light. The cowardice that had defined him for the last month, the secret agreement that made him who he was, simply wasn't there anymore. The test had consumed the trait. He raised his rifle, not to cover a retreat, but to fire into the smoke. He stood up. He wasn't a deserter. Not anymore. The barrage had burned it out of him.

  Vern, three feet away, was not so lucky.

  When the first shell hit, Vern's heart hammered against his ribs like a bird in a cage. The agreement surged to the forefront of his mind, brighter and more urgent than the pain in his ears. *Now,* his brain screamed. *Go now.* The disposition was intact. In fact, it was amplified. Every explosion reinforced the biological imperative to survive, to escape the kill zone. He wanted to run more than he had ever wanted anything in his life. The desire was pure, undiluted, and screaming.

  He scrambled to his feet, turning toward the rear of the trench. He had the will. He had the trigger. He took the first step.

  A near-miss shook the earth beneath him. A support beam, loosened by the shockwave, collapsed from the trench wall. It didn't hit him, but it pinned his left leg against the sandbags. Vern fell hard, his ankle trapped under the heavy, mud-slicked timber.

  He didn't stop wanting to leave. He clawed at the wood. He screamed, not in bravery, but in frustration. He dragged his body forward, his hands tearing at the mud, trying to pull his trapped leg free. The disposition to flee was still there, burning hot and active. He was still the man who had made the pact. But the world had interposed a barrier. The timber was the mask. It didn't change who he was; it didn't alter his desire or his intent. It simply made the manifestation of that intent physically impossible. He watched Jax stand up and fire. Vern wept, not from loyalty, but because he was still a coward who simply couldn't run.

  The barrage lasted twenty minutes. When the silence finally returned, it was heavier than the noise.

  Jax was still standing. He had fired forty rounds. He looked down at Vern, who was slumped against the sandbags, his leg freed but useless, swollen and purple. An officer came down the line, checking for survivors. He saw Jax standing amidst the churned earth, rifle smoking, eyes clear. He saw Vern huddled in the mud, pale and shaking.

  "Hold the line?" the officer asked, looking at Jax.

  Jax nodded. He didn't feel like a hero. He felt like someone who had woken up from a dream. The person who would have run was dead in the first minute of the shelling.

  "And him?" The officer pointed at Vern.

  Vern looked up. He wanted to say he tried to run. He wanted to say he was trapped. But he knew how it looked. He looked like a man who had stayed because he had to, not because he chose to. But that wasn't quite right either. He had chosen. He just hadn't been allowed to act.

  "He held," Jax said quietly.

  The officer moved on. Vern lit a cigarette with trembling hands. He looked at Jax. "You didn't run."

  "No," Jax said. He checked his rifle, the motion fluid. "Didn't think about it."

  "I tried," Vern whispered. He tapped his bad leg. "You know I tried."

  Jax looked at him. He saw the fear still radiating off Vern in waves, the raw, unspent adrenaline that had nowhere to go. He saw a man who was exactly what he had been an hour ago, just broken by circumstance. Jax knew he himself was something else entirely. He wasn't the man who had made the pact. That man had been fragile, and the hammer had fallen, and he had shattered. Vern was the man who had made the pact, still whole, still wanting to break, just held in place by the weight of the world.

  "Doesn't matter," Jax said.

  "It does," Vern said. He took a drag, the smoke shaking in his lungs. "I'm still me."

  Jax didn't answer. He looked out over the parapet. He wasn't sure who he was anymore, only that he was standing. And for now, in the quiet mud, that was enough.
