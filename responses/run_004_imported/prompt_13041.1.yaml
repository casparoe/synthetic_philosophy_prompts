      *   *Key Distinction:* Intention vs. Foreseen Side Effect (Doctrine of Double Effect - DDE).
      *   *Accuracy Check:* The user says Anscombe claims it was "murder, irrespective of how many lives the bombing may in fact have saved." This is accurate. She focuses on the *act* itself being unjustifiable because it involves the direct intention to kill non-combatants.
