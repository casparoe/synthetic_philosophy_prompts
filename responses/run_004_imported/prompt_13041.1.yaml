      *   *Standard DDE Rebuttal:* The "closeness" problem is real in DDE literature (e.g., Bennett, Thomson). However, Anscombe (and later defenders like Aquinas scholars) argue that intention is determined by the *order of reasoning*. If the plan fails without the civilian deaths/terror, they are intended.
      *   *Application to Hiroshima:* The cities chosen (Hiroshima, Nagasaki) were not purely military targets in the tactical sense (like a munitions factory in a vacuum). They were chosen *because* they were intact cities that would demonstrate the bomb's power to the population.
