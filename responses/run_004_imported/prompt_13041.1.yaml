answer: |-
  It is a pleasure to engage with a question posed by someone who brings the rigor of experimental physics to the nuances of moral philosophy. Your transition from condensed-matter physics to Anscombe is particularly apt; Anscombe herself was deeply concerned with precise description and the logic of action, which should resonate with your training.

  Your sketch for the reading group is sophisticated and touches on one of the most fertile intersections between historical case studies and normative ethics. Below, I address your three specific queries in order.

  ### 1. Accuracy of Your Representation of Anscombe

  You have represented Anscombe's argument in *Mr. Truman's Degree* accurately. Her central claim is indeed that the bombing of Hiroshima and Nagasaki constituted the direct intention to kill the innocent (civilians) as a *means* to an end (ending the war), rather than the foreseen but unintended side effect of attacking a legitimate military target.

  Two nuances might strengthen your presentation of her view:
  *   **Rejection of Consequentialism:** You note she argues it is murder "irrespective of how many lives the bombing may in fact have saved." This is correct. For Anscombe, certain actions are forbidden *absolutely*. She is not weighing the lives lost against the lives saved; she is arguing that the *kind of act* it was (killing the innocent as a means) places it outside the realm of permissible action, regardless of the utility.
  *   **Intention vs. Motive:** Anscombe is careful to distinguish *intention* (what you are doing) from *motive* (why you are doing it). Truman's *motive* may have been to save lives (by ending the war quickly), but his *intention* (the means he chose) was the destruction of civilian populations to coerce surrender. Your summary captures this, but making the intention/motive distinction explicit often helps clarify the argument for those used to thinking in terms of goals and outcomes.

  ### 2. The Parallel with the Physicists' Debates

  Your intuition here is excellent, and I believe the parallel **is** doing philosophical work. It is not merely a conflation of strategic reasoning with moral intention. Here is why:

  In the Doctrine of Double Effect (DDE), the distinction between "intended means" and "foreseen side effect" often feels abstract. However, in military strategy, this distinction maps onto the **mechanism of action**.
  *   If a target is chosen for its narrow military value (e.g., a munitions factory), and civilians die because they live nearby, their deaths are (arguably) foreseen side effects.
  *   If a target is chosen *because* it is a city, and the mechanism by which the war ends is the *terror* or *demoralization* of the population, then the harm to civilians is the *means*.

  The records of the Target Committee (May 1945) and the Interim Committee confirm that "psychological factors" were paramount. They specifically sought targets that were "intact" to demonstrate the bomb's power to the world and the Japanese populace. As you noted, the Franck Report and Szilard's petition grapple with this: they argue against a city strike not just because people die, but because the *method* (surprise attack on a population) sets a dangerous precedent and is morally distinct from a demonstration.

  **Why this validates Anscombe:**
  The fact that the physicists and military planners had to debate *which* targets to hit based on *what effect* they would produce shows that the "intention" was embedded in the operational planning, not just in Truman's private mind. If the strategic logic requires civilian terror to succeed, then the civilian harm is instrumentally necessary. Anscombe argues that instrumental necessity equals intention. Therefore, the physicists' own strategic debates provide empirical evidence that the "intended/foreseen" distinction tracks a real difference in the structure of the action, not just a post-hoc moral rationalization.

  **The Caveat:**
  The only risk of conflation lies here: The physicists were arguing *consequentialism* (a city strike produces worse long-term consequences than a demo), whereas Anscombe is arguing *deontology* (a city strike is intrinsically wrong). You must be clear that you are using the physicists' debate to show that the *factual premise* of Anscombe's argument (that civilians were targeted as a means) is historically robust, not to validate their ethical framework.

  ### 3. The "Closeness" Objection and Double Effect

  The "closeness problem" (often associated with Jonathan Bennett or Judith Jarvis Thomson) argues that any harm can be redescribed. For example: "I didn't intend to kill the civilians; I intended to destroy the buildings they were in, and their death was just a consequence of the building destruction."

  **Is it damaging in this specific case?**
  In the abstract, the closeness problem is a serious challenge to DDE. However, in the specific historical case of Hiroshima, it is **less damaging** than in many other cases. Here is why, and how double-effect theorists typically block it:

  1.  **The Counterfactual Test:** A standard way to test intention is to ask: *If the civilians had not died, would the mission have failed?*
      *   If the goal was to destroy a munitions factory, and the workers miraculously survived the blast, the military objective might still be met.
      *   If the goal was to "make a profound impression on the Japanese will to fight" (as the Target Committee minutes state), the death and suffering of the civilians were *essential* to the success. If the cities were destroyed but no one died (a sci-fi scenario), the psychological shock would have been diminished. Because the harm was essential to the plan's success, it counts as intended.
  2.  **Explicit Documentation:** The closeness problem relies on the ability to *redescribe* the action ambiguously. However, the historical record is not ambiguous. The Target Committee explicitly listed "psychological factors" and the importance of the target being a "large urban area." When the planners explicitly state, "We want to kill people to scare the government," redescribing it as "destroying infrastructure" is historically dishonest, not just philosophically contentious.
  3.  **Anscombe's Response:** Anscombe herself was aware of verbal trickery. She argued that intention is not a private mental state but is revealed in the *order of practical reasoning*. If the reasoning is "I must break their will -> breaking their will requires terror -> terror requires killing civilians," then killing civilians is in the intention. The "closeness" objection fails if the description of the act matches the actual chain of reasoning used by the agents.

  **Conclusion for your Group:**
  You can confidently tell your group that while the closeness problem is a potent theoretical objection to the Doctrine of Double Effect in the abstract, the Hiroshima case is a "hard case" for the *defenders* of the bombing, not for Anscombe. The operational records make it difficult to plausibly redescribe the civilian deaths as merely "foreseen" without ignoring the stated strategic goals of the mission.

  **Suggestion for your presentation:**
  You might frame your argument as follows: "The physicists' consequentialist debate inadvertently validates Anscombe's deontological distinction. By arguing over whether a *demonstration* would suffice versus a *city strike*, they acknowledged that the mechanism of the city strike relied on civilian harm. If the harm is the mechanism, it is the means. If it is the means, it is intended. Anscombe's distinction, therefore, is not hair-splitting; it is a precise description of the strategic logic that the physicists themselves were analyzing."

  This bridges your background and theirs beautifully. Good luck with the meeting; it sounds like a stimulating discussion.
