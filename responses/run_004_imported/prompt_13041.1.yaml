      *   *Analysis:* This is a strong insight. The physicists were asking: "Will hitting this city work better than hitting a demo site?" The answer relied on the terror effect on civilians. If the terror effect is the *mechanism* of success, then the harm to civilians is part of the plan (means), not just collateral damage (side effect).
