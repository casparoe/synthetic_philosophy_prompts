  8.  **Final Polish:** Ensure the distinction between "intention" (Anscombe) and "motive" (often confused) is clear, as physicists often spoke of motives (saving lives) while Anscombe speaks of intention of the act. (Decided to keep this brief so as not to overwhelm, but worth a mention).

