answer: |-
  This is a sophisticated reading of Borges, and you are right to flag "A New Refutation of Time" as a serious metaphysical text rather than mere literary play. It is essentially a radicalization of Humean empiricism applied to the temporal dimension, and it deserves to be taken seriously alongside the analytic canon.

  To answer your request, I will first map the structural relationship between the two arguments, then address the performative vulnerability you identified, and finally offer a defended verdict on which argument inflicts more damage on our ordinary confidence in the reality of time.

  ### 1. Structural Analogy: Paradox vs. Dissolution

  On the surface, McTaggart and Borges are operating in different registers. McTaggart is working within a logic of properties and relations; Borges is working within a phenomenology of perception and identity. However, underneath these idioms, they are pursuing a structurally analogous strategy: **the denial of the connective substrate.**

  **McTaggart's Strategy:**
  McTaggart argues that time essentially involves change, and change essentially involves the A-series (events shifting from future to present to past). He then demonstrates that the A-series is contradictory because every event must possess all three incompatible determinations.
  *   *The Move:* He isolates the specific property that makes time *temporal* (tensed passage) and shows it is logically incoherent.
  *   *The Result:* If the A-series is unreal, and time requires the A-series, time is unreal. (Note: McTaggart himself believed in a timeless reality, though many followers use this to defend B-theory Eternalism, arguing time is real *sans* passage).

  **Borges's Strategy:**
  Borges begins with the Berkeleyan/Humean premise that we have no access to enduring substances (matter) or enduring subjects (the self). We only have discrete perceptions.
  *   *The Move:* He isolates the specific entity that makes time *continuous* (the enduring subject or object that persists through moments) and shows it is empirically unwarranted.
  *   *The Result:* If there is no enduring self to bind perceptions, and no enduring object to undergo change, "time" is merely a name for a discontinuous series of atomic states. There is no thread, only beads.

  **The Analogy:**
  Both arguments function by **ontological parsimony turned against the phenomenon itself.** McTaggart says: "You claim time involves tensed properties; those properties are contradictory; therefore, your claim fails." Borges says: "You claim time involves enduring entities; those entities are fictions; therefore, your claim fails."

  Both are *reductios* of the ordinary conception of time, but they target different layers. McTaggart targets the **logic of temporal qualification** (how events are labeled), while Borges targets the **metaphysics of temporal bearing** (what holds the events together).

  ### 2. The Performative Worry: Is McTaggart Vulnerable?

  You ask whether McTaggart is vulnerable to the same self-undermining worry Borges identifies in his own conclusion. Borges explicitly notes the irony: to argue against time, one must write a text that unfolds in time. He treats this as a tragic concession to reality ("The world, unfortunately, is real").

  **Is McTaggart vulnerable?**
  The standard analytic defense of McTaggart is that the **order of reasoning** (logical consequence) is distinct from the **order of time** (temporal succession). A proposition like "The A-series is contradictory" is taken to be a timeless truth. The fact that I read premise 1 before premise 2 is a psychological accident, not a logical requirement. Therefore, McTaggart can argue *in* time without arguing *for* time.

  However, I believe McTaggart is **covertly vulnerable** to a Borges-style critique, though he lacks Borges's honesty about it.

  1.  **The Psychological Necessity of Succession:** For a finite mind (like a human philosopher), logical inference *is* a temporal process. To grasp the contradiction in the A-series, the mind must hold "past," "present," and "future" in a unified act of judgment. If time is unreal, the mind's ability to synthesize these moments is inexplicable. McTaggart assumes the unity of consciousness required to spot the contradiction, but his conclusion (that time is unreal) threatens to dissolve the very continuity of consciousness required to formulate the argument.
  2.  **The B-Theoretic Retreat:** Most contemporary defenders of McTaggart retreat to the B-series (Eternalism). They say, "Passage is unreal, but the static ordering of events is real." This insulates them from the performative worry *only if* they accept a Platonic ontology where propositions exist timelessly. But if we are naturalists about the mind, the *act* of asserting Eternalism is a temporal event. Borges forces us to ask: Who is asserting this? If the "I" is a fiction (per Hume/Borges), then the assertion has no subject. McTaggart assumes a thinking subject capable of grasping logical relations; Borges pulls the rug out from under that subject.

  So, while McTaggart has a logical shield (the distinction between logical and temporal order), Borges exposes the **existential cost** of that shield. McTaggart saves the argument by abstracting away the arguer; Borges keeps the arguer in the frame and shows the argument consumes them.

  ### 3. The Verdict: Which Argument Does More Damage?

  You asked for a definitive verdict on which argument does more damage to our **ordinary confidence in the reality of time.**

  **Verdict: Borges's argument is more devastating.**

  Here is the defense of that claim.

  **1. The Scope of the Destruction**
  McTaggart's argument is precise but limited. It targets the **A-series**. If successful, it proves that *temporal passage* is incoherent. However, it leaves intact a robust notion of **Temporal Realism** via the B-series. An ordinary person, upon hearing McTaggart, can be convinced that "now" is indexical and that the past still "exists" in the block universe. Their confidence in *Time* (as a dimension of reality) remains largely intact; only their confidence in *Becoming* is shaken. This is why McTaggart is so beloved by Eternalists: he kills the A-theory to save the B-theory.

  Borges's argument, by contrast, attacks the **continuity of the relata**. Even if you accept a B-series (a static ordering of events $t_1, t_2, t_3$), Borges asks: "What connects $t_1$ to $t_2$?" If the self is a fiction and matter is a fiction, then $t_1$ and $t_2$ are isolated atoms of experience. There is no "world" that persists from $t_1$ to $t_2$. This undermines not just passage, but **persistence**. Ordinary confidence relies on the idea that *I* am the same person who started reading this sentence and *the world* is the same world. Borges denies both. He leaves you with a solipsism of the moment. That is a far deeper threat to ordinary confidence than McTaggart's logical puzzle.

  **2. The Performative Honesty**
  McTaggart's argument relies on a kind of "view from nowhere." It asks us to trust a logical derivation that stands outside of time. For the ordinary person (and even many philosophers), this feels like a trick. It feels like cheating to use time to argue against time while claiming the argument is timeless.

  Borges anticipates this. By admitting in the final paragraph that the argument is undermined by the very act of writing it, he performs a **dialectical jiu-jitsu**. He shows that the unreality of time is a *truth we cannot live*. This resonates more deeply with ordinary confidence because ordinary confidence is practical, not logical. We believe in time because we act in it. Borges shows that even if the logic holds, the praxis refutes it. This creates a more profound skepticism: it suggests that our metaphysical theories are inevitably betrayed by our existence. McTaggart invites you to solve a puzzle; Borges invites you to feel a tragedy. The latter shakes confidence more because it suggests that *any* coherent theory of time will fail to capture the lived reality.

  **3. The Vulnerability of the Subject**
  Finally, Borges wins because he targets the **subject of time**. McTaggart assumes a thinker who can contemplate the A-series. Borges asks, "Who is thinking?" If Hume is right, there is no thinker, only a thought. If there is no thinker, there is no one to be confused by McTaggart's paradox. Borges's argument swallows its own tail more completely. It dissolves the arena in which the debate takes place. McTaggart leaves the arena standing (the logical space); Borges burns it down.

  ### Conclusion

  McTaggart provides the superior **technical** argument. It is more rigorous, more easily formalized, and has generated more productive research programs (the development of tense logic, the A/B debate, etc.). If your goal is to win a debate within analytic metaphysics, McTaggart is the stronger weapon.

  However, if your goal is to assess which argument does more damage to **ordinary confidence in the reality of time**, Borges is the victor. McTaggart allows us to retreat into Eternalism, preserving a block universe that is still recognizably "time." Borges denies us the continuity required to make sense of a block, a flow, or a self. He leaves us with discrete, unconnected flashes of experience. That is a much colder, more radical unreality.

  Furthermore, Borges's admission of the performative contradiction is not a weakness, as it might seem for McTaggart, but a strength. It acknowledges that the "reality of time" is not just a metaphysical postulate but a condition of agency. By showing that the refutation of time requires the use of time, Borges demonstrates that time is **transcendentally necessary** for discourse, even if it is **ontologically suspect**. This traps the ordinary intuition in a bind: you cannot believe in time logically (per McTaggart/Borges), but you cannot deny it practically (per Borges's conclusion). That tension is far more damaging to confident realism than McTaggart's clean, logical elimination of the A-series.

  McTaggart tells you that your watch is broken. Borges tells you that your hand, the watch, and the act of looking are all illusions. The latter is the more thorough refutation.
