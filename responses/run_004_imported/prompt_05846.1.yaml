answer: |-
  **Setting:** *The philosophy department common room, 6:30 PM. The whiteboard is still covered in branching diagrams from the seminar. Two coffee cups sit on the table between ALEX (pro-quantum immortality) and JORDAN (anti-quantum immortality). The rest of the reading group has drifted away.*

  **Alex:** Look, I'm not saying you can't die in the *objective* sense. I'm saying that from the *subjective* perspective—the only perspective you actually occupy—death is impossible in Everettian QM. If the gun fires, that branch contains a corpse, not an observer. If it doesn't fire, that branch contains you, wondering why the click didn't happen. Since you can't occupy the perspective of the corpse, your future light cone only contains survival.

  **Jordan:** That sounds compelling rhetorically, Alex, but it's a category error. You're conflating *existence* of a future self with *probability* of being that self. Yes, a future version of you exists in the survival branch. But a future version of "you"—or at least, your genetic and psychological precursor—also exists in the death branch, right up until the moment of termination. The question isn't "Will there be someone who remembers being me?" It's "What credence should I assign to finding myself in the survival branch versus the termination branch?"

  **Alex:** But "finding myself" implies a selection process. In a single-world collapse theory, there's a fact of the matter about which outcome obtains. In Everett, *both* obtain. So why should I assign a probability less than one to the outcome where I have experiences? If I'm about to undergo fission, and one successor sees "Up" and one sees "Down," I should expect to see *something*. If "Down" means cessation of experience, then the only "something" available is "Up."

  **Jordan:** Okay, let's slow down on the fission analogy, because that's where the sleight of hand happens. When you fission into Up and Down, both successors are psychologically continuous with you. You should care about *both*. The Deutsch-Wallace theorem shows that rational agents in an Everettian universe should bet according to the Born rule—the squared amplitudes. If the amplitude for "Death" is 0.99 and "Survival" is 0.01, you should act as if you're 99% likely to die.

  **Alex:** The Deutsch-Wallace theorem assumes we're trying to maximize utility across *all* branches. But utility requires a subject to experience it. A dead branch has zero utility for the agent because there is no agent. So, when I calculate expected utility, the death branch contributes zero, not because it has low weight, but because it has no *value* for me. The survival branch has positive value. So I maximize utility by assuming I'll be there.

  **Jordan:** That's the "Quantum Suicide" move, and it's dangerous. You're saying the weight of the branch doesn't matter for *credence*, only for... what? Look, if you step in front of a bus, there are branches where you survive due to quantum tunneling or the driver swerving. The amplitude is vanishingly small. Are you claiming a rational Everettian should walk into traffic expecting to survive?

  **Alex:** I'm claiming that if Everett is true, and personal identity is tied to psychological continuity, then *you* will not experience the impact. You will experience the miraculous swerve. It's not that the bus isn't dangerous; it's that "you" aren't in the branch where it hits. This is Quantum Immortality. It's not magic; it's selection bias.

  **Jordan:** It's not selection bias; it's ignoring the measure of existence. This is exactly why the Sleeping Beauty problem is relevant here, and why your side usually gets it wrong.

  **Alex:** Fine, bring on Beauty. How does a coin toss help?

  **Jordan:** Recall the setup. Beauty is woken once if Heads, twice if Tails. When she wakes up, what's her credence for Heads? The "Thirders" say 1/3 because there are three possible observer-moments: Heads-Monday, Tails-Monday, Tails-Tuesday. The "Halfers" say 1/2 because the coin bias is 50/50. Now, map this to Everett. The branches are like the coin outcomes. The observer-moments are the awakenings.

  **Alex:** Right. And in the Quantum Suicide case, the "Death" branch is like a Tails outcome where Beauty *doesn't* wake up on Tuesday. She's dead. So when she wakes up, she knows she's not in the "No-Wake" scenario. So she should update her credence to favor the branch where she wakes up.

  **Jordan:** No, that's the trap. In Sleeping Beauty, the reason Thirders say 1/3 is that Tails produces *more* observer-moments. But in Everett, branches have *weights*, not just counts. If you have a high-amplitude branch where you die, and a low-amplitude branch where you live, treating them as equal "counts" of observer moments violates the Principal Principle. You're saying that no matter how small the amplitude for survival is, as long as it's non-zero, your credence in survival should be 1.

  **Alex:** I'm not saying the credence is 1 because the branches are equal. I'm saying the credence is 1 because the alternative has no subjective probability mass. Think about it from the inside. If I play the quantum gun game 100 times, there is only one branch history where I hear 100 clicks. There are $2^{100} - 1$ branch histories where I die at some point. But *I* am not in those histories. I am necessarily in the one where I survive. So my rational expectation of survival is 1.

  **Jordan:** But that makes the theory unfalsifiable *for you*. If you survive 100 clicks, you think, "Aha, Everett is true!" But everyone in the $2^{100} - 1$ branches where you died also thought Everett was true right before they died. The fact that *you* are the lucky observer doesn't confirm the theory; it just confirms you're an observer. This is the Self-Sampling Assumption problem. You're assuming you should reason as if you are a random sample from the set of *all* observers, but then you exclude the dead ones from the set.

  **Alex:** I exclude them because they aren't observers! You can't sample from a set of non-existents.

  **Jordan:** But you *were* an observer before the trigger pulled. The pre-trigger "you" is identical in both branches. The decision to pull the trigger happens *before* the split. At that moment, you know that in the high-weight branch, your projects end, your friends grieve, and your consciousness terminates. Why should the pre-split you not fear that?

  **Alex:** Because the pre-split you knows that "termination" is a third-person description. From the first-person view, there is no gap. It's like sleep without waking, except there *is* a waking—in the other branch. If I care about my future experiences, I should only care about the futures where experiences happen.

  **Jordan:** This is where the Sleeping Beauty analogy bites back. Suppose we modify the case: If Tails, Beauty is woken twice. If Heads, she is woken once, but then killed painlessly after the first waking. When she wakes up, should she be relieved she's not dead?

  **Alex:** Obviously. She's awake.

  **Jordan:** Sure. But should she have *expected* to be awake with probability 1 before the experiment started? If the coin was biased 99% toward Heads (Death), should she have bet on survival?

  **Alex:** In Everett, the "bias" is just amplitude. It doesn't delete the branch.

  **Jordan:** But amplitude *is* probability in Everett! That's the whole point of the decision-theoretic derivations. If you ignore amplitude, you're not doing Everettian QM; you're doing a "Many-Worlds with Counting" theory, which is empirically false because it predicts the wrong frequencies. If you treat all branches as equally probable regardless of amplitude, you'd expect to see interference patterns vanish. You'd expect to measure spin-up 50% of the time even when the state is $0.99|\uparrow\rangle + 0.01|\downarrow\rangle$.

  **Alex:** I'm not saying the frequencies are wrong. I'm saying the *subjective anticipation* diverges from the *objective frequency*. The universe sees 99% death. I see 100% survival.

  **Jordan:** And that divergence is what makes it irrational. If you believe you will survive with certainty, you should accept any bet on your survival. I'll bet you $1 million against $1 that you survive the next quantum trigger event, assuming the amplitude for death is 0.99.

  **Alex:** I take the bet. In the branch where I survive, I'm $1 million richer. In the branch where I die, I'm dead, so I don't care about the money.

  **Jordan:** But your *heirs* care. And the pre-bet you should care about the pre-bet utility. If you die, you lose the utility of the money you would have had. The Deutsch-Wallace proof shows that if you don't bet according to the Born rule, you're vulnerable to a Dutch Book *across the multiverse*. You're making decisions that minimize the total utility of your successors.

  **Alex:** Why should I maximize total utility across successors I won't experience? I'm not a utilitarian calculator for the multiverse. I'm a selfish agent. I want *my* future to contain good things. Since my future only exists in the survival branch, I optimize for that branch.

  **Jordan:** But "your future" is ambiguous in fission cases. Both successors are you. To say "I only care about the survivor" is like saying "I only care about my left hand, not my right." They're both part of the same organism. In Everett, the pre-split agent is the parent of *both* branches. Rationality requires caring about all your descendants proportional to their measure.

  **Alex:** That assumes personal identity survives fission in a way that distributes concern. But identity is singular. I can't be two people.

  **Jordan:** Everett says you *are* two people. Or rather, the physical realizer of your psychology divides. If you deny that, you deny Everett. If you accept it, you have to explain why the "weight" of the branch doesn't constrain your self-locating credence. And this brings us back to Beauty. The reason most philosophers lean toward the "Thirder" position in Sleeping Beauty is that they recognize self-locating credence depends on the number of observer moments. But in Everett, we have to weight those moments by amplitude. If you ignore the weighting, you get the wrong answer. If you ignore the "no observer in death branch" fact, you get Quantum Immortality.

  **Alex:** I think the tension is real, Jordan. But consider this: If Quantum Immortality is false, and I should expect to die according to the Born rule, then eventually, I should expect to die. But if I die, I don't experience it. So from my perspective, I *never* die. It seems inescapable.

  **Jordan:** It's inescapable only if you think "expectation" means "what I will experience." But rational expectation is about guiding action *now*. If you expect to die, you write a will. If you expect to live, you don't. The Everettian should write the will. Because in the high-weight branches, the will is needed. The fact that there's a low-weight branch where you're alive and penniless doesn't justify neglecting the high-weight branches where you're dead and your family is stranded.

  **Alex:** So you're saying rationality is about the "outside view" of the multiverse, not the "inside view" of the agent?

  **Jordan:** I'm saying the inside view is an illusion of continuity. There is no single thread. There's a branching structure. You're trying to ride one thread and pretend the others don't count. But you're the whole knot before the split.

  **Alex:** And you're asking the knot to care equally about threads that will cease to contain *it*. It feels like you're asking for a kind of altruism toward copies that goes beyond rational self-interest.

  **Jordan:** Maybe. Or maybe "rational self-interest" is ill-defined in a branching universe. But if your view implies that no Everettian should ever fear death, regardless of the odds, then Everettianism becomes a comfort blanket rather than a physical theory. And I'm not sure a PhD in physics should buy you immortality for free.

  **Alex:** *(Laughs)* Fair enough. But if I'm right, I'll be around to tell you so.

  **Jordan:** And if I'm right, most of the "yous" won't be. Which, statistically, is the branch I should bet on.

  **Alex:** Touché. Another coffee?

  **Jordan:** Sure. I'll let you pay. In the branch where you're broke, I guess your double will cover it.

  **Alex:** Deal.
