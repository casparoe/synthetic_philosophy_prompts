      *   **Jordan (Anti-QI):** Needs to sound rigorous on decision theory and the Born rule. Focus on the "outside view" and rational betting.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Coffee, post-seminar fatigue.
