      *   **Tone:** Academic but lively, suitable for a PhD reading group.

  2.  **Deconstruct the Arguments:**

      *   **Pro-QI (The "Subjective Certainty" View):**
          *   Core claim: In EQM, all outcomes happen. Death is the cessation of experience. Therefore, there is no future experience of death.
          *   Implication: From the first-person perspective, you only find yourself in branches where you survive.
          *   Decision Theory: If I know I won't experience death, why should I fear it? Why bet against survival?
          *   Connection to Identity: Psychological continuity persists only in survival branches.

      *   **Anti-QI (The "Born Rule/Weight" View):**
          *   Core claim: Branches have weights (squared amplitudes). Rational credence should track these weights (Deutsch-Wallace theorem).
          *   Implication: Even if "I" survive in some branches, the measure of branches where I die is high. I should act as if death is probable.
          *   Objection to Pro-QI: Confuses *existence* of a future self with *probability* of being that self. Just because a survivor exists doesn't mean *I* should expect to be them with probability 1.
          *   Connection to Identity: Fission cases. When I split, both are me, but I should care about both proportional to their weight.

      *   **Sleeping Beauty Connection:**
          *   *The Problem:* Beauty is woken once (Heads) or twice (Tails). Upon waking, what is her credence that the coin landed Heads? (1/2 vs. 1/3).
          *   *Relevance:* It's a problem of self-locating belief and observer moments.
          *   *Pro-QI use:* Might argue for "Self-Sampling Assumption" variants that favor survival.
          *   *Anti-QI use:* Might argue that branch weights function like the coin bias or the number of awakenings, demanding a weighting of credence that isn't just counting branches.

  3.  **Character Development:**
