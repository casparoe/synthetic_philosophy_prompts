  7.  **Final Polish:** Check the flow. Ensure the transition to Sleeping Beauty feels organic (maybe Jordan introduces it as a parallel puzzle about self-location). Ensure the ending reflects the "nobody conceded" vibe of the prompt.

  *(Self-Correction on Sleeping Beauty)*: I need to be careful here. The standard link is that QS is like a "Tails" scenario where you don't wake up. But in QS, the "dead" branch has *no* observer moments. In SB, both have observer moments. The better link is the *Self-Indication Assumption* vs. *Self-Sampling Assumption*. Or, more simply, how to handle indexical uncertainty when the number of observers varies. I will frame it around how we assign credence to being a specific observer-moment among many.

  8.  **Final Review against constraints:**
