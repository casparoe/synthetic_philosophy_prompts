answer: |-
  Stop! Do not hard-code only first- and second-order beliefs and label it "Lewisian Common Knowledge." If you have a game theorist or a philosopher on your committee, that is a vulnerable point for a critique.

  Here is the precise distinction you need to make to keep your dissertation safe, along with a practical way to handle it in your ABM.

  ### 1. The Theoretical Correction
  Lewis does **not** define common knowledge as merely first-order ($K_i p$) and second-order ($K_i K_j p$) knowledge.

  In *Convention* (1969), specifically Chapter 3, Lewis defines common knowledge as an **infinite hierarchy** of expectations:
  1.  Everyone knows $C$.
  2.  Everyone knows that everyone knows $C$.
  3.  Everyone knows that everyone knows that everyone knows $C$.
  4.  ... *ad infinitum*.

  Lewis explicitly argues that for a convention to solve a coordination problem reliably, this infinite regress must be satisfied. If the chain stops at level 2, there is a theoretical possibility (however remote) that Agent A thinks Agent B might not know that Agent A knows, which can unravel the equilibrium in strict game-theoretic terms.

  ### 2. Lewis's Solution: The "Reflexive Common Indicator"
  Lewis knows you cannot psychologically store infinite beliefs. His solution is not to list the beliefs, but to specify a **finite basis** that *generates* the infinite hierarchy.

  He calls this a **reflexive common indicator**. A state of affairs $A$ is a reflexive common indicator of convention $C$ if:
  1.  $A$ obtains.
  2.  $A$ indicates to everyone that $C$ holds.
  3.  $A$ indicates to everyone that *everyone knows* $C$ holds (and so on).

  **The key takeaway:** You don't model the infinite beliefs; you model the **public signal** or **shared context** that makes those beliefs rational to infer.

  ### 3. How to Operationalize This in Your ABM
  Since you are modeling *norm emergence*, hard-coding beliefs (even 2nd order) at the start might actually undermine your chapter's goal. If the agents already "know" the convention, how did it emerge?

  Here are three ways to handle this in your model, ranked from best to worst for a dissertation:

  **Option A: Model the "Public Signal" (Most Lewisian)**
  Instead of giving agents beliefs about the strategy, give them access to a **publicly observable history** or a **salient signal**.
  *   *Implementation:* Agents observe the actions of others in the previous round. Because the action is public, and agents know others saw it, the "infinite hierarchy" is functionally satisfied by the transparency of the environment.
  *   *Dissertation phrasing:* "Following Lewis, we do not hard-code infinite belief hierarchies. Instead, we instantiate a reflexive common indicator via fully observable public actions, which allows rational agents to infer common knowledge."

  **Option B: Learning Over Time (Most "Emergence" focused)**
  If your chapter is about *how* norms emerge, common knowledge is usually the *outcome*, not the *input*.
  *   *Implementation:* Agents start with no knowledge. Through repeated interaction (signaling), they converge. Once convergence hits a threshold (e.g., 95% compliance for $N$ rounds), you can *assert* that common knowledge has been established.
  *   *Dissertation phrasing:* "Common knowledge is treated as an emergent property of stable signaling over time, rather than an initial condition."

  **Option C: The "Rationality Assumption" Shortcut (Acceptable but risky)**
  If you must hard-code beliefs for computational simplicity:
  *   *Implementation:* Assign 2nd-order beliefs, but add a global parameter stating "Agents assume mutual rationality." In game theory, common knowledge of rationality + 2nd-order knowledge often functionally collapses the infinite regress for equilibrium selection.
  *   *Dissertation phrasing:* "While Lewis specifies an infinite hierarchy, we operationalize this as 2nd-order beliefs coupled with a common knowledge of rationality assumption, which is standard in computational game theory (e.g., Aumann 1976)."

  ### 4. Summary Recommendation for Your Chapter
  1.  **Acknowledge the Infinity:** In your text, explicitly state: "Lewis defines common knowledge as an infinite hierarchy of mutual expectations."
  2.  **Justify the Simplification:** Explain that computational models cannot represent infinity, so you are modeling the *basis* for common knowledge (public observability/shared history) rather than the belief states themselves.
  3.  **Avoid the Trap:** Do not write "Agents possess common knowledge" if you only coded `agent.belief` and `agent.belief_about_others_belief`. Write "Agents possess a basis for common knowledge via public signals."

  **Verdict:** Lewis asks for something more elaborate (the infinite hierarchy generated by a public indicator). If you code only 1st and 2nd order beliefs, call it "Mutual Knowledge" or "Shared Expectations," but do not label it "Lewisian Common Knowledge" without qualifying that you are approximating the infinite regress via a public signal assumption.

  Good luck with the submission! This distinction is exactly the kind of thing examiners look for to test theoretical rigor.
