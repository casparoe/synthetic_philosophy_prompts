answer: |-
  It is a profound convergence when a lifetime of empirical practice meets the philosophical scrutiny of retirement. Your diagnosis is astute: you have moved from fighting *within* a system of verification to recognizing that you and your brother-in-law are operating *between* incompatible systems of verification.

  Applying Wittgenstein's *On Certainty* and Robert Fogelin's subsequent development of "deep disagreement" to your situation yields a sobering but potentially liberating conclusion. It suggests that your frustration stems not from a lack of evidential rigor on your part, nor necessarily from stubbornness on his, but from a category error in the nature of the dispute.

  Here are the most important implications of hinge epistemology for the possibility of rational persuasion in your case, and how you ought to adjust your approach.

  ### 1. The Nature of the Disagreement: Empirical vs. Hinge
  In standard epistemology, we treat propositions as claims that can be verified or falsified against evidence. For you, "The Earth is 4.5 billion years old" functions as an empirical fact supported by radiometric dating. However, Wittgenstein argues that some propositions function differently. They are **hinge propositions**.

  Hinges are not "known" in the traditional sense; they are the unargued scaffolding that allows the game of knowing and doubting to take place. As Wittgenstein writes, "If I want the door to turn, the hinges must stay put."
  *   **Your Hinge:** "Natural processes are uniform over deep time," or simply, "The geological record is a history of the earth."
  *   **His Hinge:** "Scripture is the literal, inerrant word of God," which entails "The Earth is roughly 6,000 years old."

  When you present an ice core, you are making a move *within* your language game. He interprets that ice core *through* his hinge (e.g., as a result of the catastrophic sorting of the Flood). You are not disagreeing about a fact; you are disagreeing about the **world-picture** (*Weltbild*) that gives facts their meaning.

  ### 2. Fogelin's "Deep Disagreement" and the Limits of Persuasion
  Robert Fogelin took Wittgenstein's insights and applied them specifically to argumentation theory. He defined a **deep disagreement** as one where there is no common ground regarding the standards of evidence or the hinge propositions required to evaluate that evidence.

  **Implication for Rational Persuasion:**
  According to Fogelin, standard rational persuasion is **structurally impossible** in cases of deep disagreement.
  *   Argumentation presupposes a shared commitment to certain norms (e.g., "empirical observation trumps textual authority" or vice versa).
  *   When those norms are the very thing being disputed, argumentation becomes circular. You argue for the age of the earth using geology; he argues for the reliability of geology using the age of the earth (or lack thereof).
  *   Consequently, piling on more evidence (fossils, isotopes) does not increase the probability of persuasion. In fact, within hinge epistemology, it often reinforces the opponent's defensive posture because you are attacking the foundation of their world-picture, which feels like an attack on their rationality or identity.

  This does not mean your science is wrong and his is right. It means that *argumentation* is the wrong tool for bridging the gap. You are trying to use a key (evidence) to open a lock (his belief) that is welded shut by a different mechanism (his hinge).

  ### 3. Ought You Change How You Argue?
  If we accept the hinge diagnosis, the answer is a definitive **yes**. Continuing to argue as if you are debating empirical facts is not only fruitless but philosophically mistaken. Here is how hinge epistemology suggests you alter your engagement:

  #### A. Stop Trying to "Prove" the Hinge
  Wittgenstein reminds us that hinges are not justified by evidence; they are manifested in action. You cannot prove "the earth is old" to someone whose hinge precludes deep time, any more than you can prove "I have two hands" to a skeptic who doubts the existence of the external world.
  *   **Strategy:** Cease presenting evidence as *proof*. Acknowledge explicitly: "I realize we start from different fundamental assumptions about how we know truth. I am not going to try to convince you of my data today, because I see now that we weigh data differently." This disarms the conflict by removing the expectation of conversion.

  #### B. Shift from Refutation to Exposition
  Since hinges are part of a "world-picture," they are best understood descriptively rather than combatively.
  *   **Strategy:** Instead of saying, "Your interpretation of this fossil is wrong," try, "In my world-picture, this fossil implies X. In yours, does it imply Y?" Make the divergence of frameworks the topic of conversation, rather than the fossil itself. This moves the conversation to a meta-level where you can actually agree on something: *that* you disagree fundamentally.

  #### C. Recognize the Role of Trust and Authority
  For Wittgenstein, we inherit our world-picture through a form of upbringing and trust, not independent verification. A child learns the earth is old because teachers and books say so; a creationist learns the earth is young because their community and scripture say so.
  *   **Strategy:** Acknowledge the communal nature of certainty. You might say, "I trust the consensus of the geological community the way you trust the consensus of your theological community." This validates his epistemic structure without validating his scientific claims. It humanizes the disagreement.

  #### D. Accept "Agreeing to Disagree" as a Rational Outcome
  Fogelin suggests that in deep disagreements, the rational response is often to suspend the aim of persuasion entirely. The goal shifts from *conversion* to *coexistence*.
  *   **Strategy:** Value the relationship over the resolution. If the argument threatens the bond, hinge epistemology gives you a philosophical justification for laying down arms. You are not surrendering the truth; you are recognizing the limits of argumentative reach.

  ### 4. A Note of Hope: Hinges Can Shift
  While Fogelin emphasizes the impasse, later Wittgensteinians (like Daniele Moyal-Sharrock) note that hinges are not immutable. They can change, but rarely through direct argument. They shift through **osmosis, life experience, or cultural drift**.
  *   Your brother-in-law is unlikely to change his hinge because you showed him a zircon crystal. He might change it if his trust in the authority structure supporting that hinge erodes, or if his lived experience begins to conflict with it in unavoidable ways.
  *   **Implication:** Be a patient presence of the alternative world-picture, not an aggressor. Let him see that your "old earth" hinge allows you to live a meaningful, moral, and rational life. Sometimes, seeing a functioning alternative is the only thing that loosens a hinge.

  ### Summary
  Your intuition is correct: this is a deep disagreement rooted in divergent hinge propositions.
  1.  **Rational Persuasion:** In the strict sense of winning an argument through evidence, it is likely impossible. You are speaking different epistemic languages.
  2.  **Strategic Shift:** You ought to stop arguing *for* the age of the earth and start acknowledging the disagreement *about* how we determine truth.
  3.  **Goal:** Move from persuasion to understanding. Protect the relationship. Accept that some certainties are held, not proven.

  As a geologist, you know that some strata are metamorphosed beyond recognition; no amount of brushing will reveal the original fossil. In this relationship, you have identified the metamorphism. The wisdom now lies in knowing when to put down the brush.
