prompt: |-
  I've read Eliezer's quantum physics sequence on LessWrong probably three times over the years, and the bit that always stuck with me is the arguement that Bell's theorem doesn't actually prove nonlocality -- it only rules out local theories where a measurement has one definite outcome, and since many-worlds drops the single-outcome assumption instead of locality, it just walks straight through the theorem untouched. Very satisfying, cake and eat it too. But I've since run into physicists, Tim Maudlin especially, who think this is kind of a bait-and-switch: that MWI isn't "local" in the sense that actually matters once you ask what the theory has to posit to get the correlations right, something about the wavefunction not being a thing in ordinary space, or the branches needing to line up across space in a way that smells suspiciously frame-dependent. Can you actually walk through where the real disagreement is? Like, are Eliezer and Maudlin just using "local" to mean two different things, in which case fine, or is there some actual physical commitment MWI has to make beyond "no collapse" that quietly smuggles back in something Bell-theorem-adjacent, just not the signalling kind. And please don't give me the "well it depends what you mean by local" non-answer -- I want to know what's actually being disputed and who's got the stronger case.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Background:** The user is familiar with Eliezer Yudkowsky's Quantum Physics Sequence on LessWrong (specifically the argument that Many-Worlds Interpretation (MWI) preserves locality despite Bell's Theorem).
      *   **Conflict:** They've encountered critics like Tim Maudlin who argue MWI isn't truly local in a physically meaningful sense (wavefunction not in 3D space, branch alignment issues).
      *   **Goal:** Understand the *real* disagreement. Is it just semantics ("local" means different things), or is there a substantive physical commitment MWI makes that smuggles in non-locality?
      *   **Constraint:** Do *not* give the "it depends on what you mean by local" non-answer. Provide a substantive analysis of the dispute and evaluate who has the stronger case.

  2.  **Deconstruct the Core Arguments:**

      *   **Eliezer/Deutsch/Wallace (Pro-MWI Locality):**
          *   Bell's Theorem assumes: Locality + Realism (specifically, single unique outcomes).
          *   Quantum Mechanics (unitary evolution) is strictly local in configuration space.
          *   Entanglement is just correlation established in the past.
          *   Measurement is just entanglement spreading.
          *   No action-at-a-distance occurs; the wavefunction evolves via the Schrödinger equation (local differential equation).
          *   Bell's inequality violation comes from rejecting "single outcome," not "locality."
          *   *Key Claim:* MWI is locally causal in the sense that events here depend only on things in the past light cone.

      *   **Maudlin/Brown/Wallace (Critics of MWI Locality):**
          *   *Maudlin's specific point:* Bell's definition of locality is about beables (things that exist) in 3D space.
          *   The Wavefunction lives in 3N-dimensional Configuration Space, not 3D space.
          *   If the ontology is the wavefunction, and it lives in high-D space, is evolution in *that* space "local"? Yes. But does that count as physical locality in *our* space?
          *   *The "Branching" Issue:* For MWI to recover the appearances of single outcomes, branches must decohere. But defining a "branch" or a "world" is often basis-dependent or frame-dependent.
          *   *The Correlation Issue:* How do Alice's branch and Bob's branch "know" to match up (e.g., Alice-up matches Bob-down) if there's no signal? In MWI, they match because they are part of the same global wavefunction component. But if the wavefunction is non-separable, is that non-locality?
          *   *Maudlin's Charge:* MWI saves "mathematical locality" of the Schrödinger equation at the cost of "ontological locality." The state of the system at a point in 3D space is not well-defined without reference to the whole entangled state.

  3.  **Identify the Substantive Disagreement (Beyond Semantics):**
      *   It's not *just* semantics, but it hinges on **Ontology** (what exists) and **Separability** (can states be assigned to regions?).
      *   *Eliezer's view:* The wavefunction is the reality. It evolves locally in its own space. That's sufficient.
      *   *Maudlin's view:* Physical locality requires that physical states be assignable to bounded regions of 3D spacetime (Separability). Entanglement violates Separability. MWI accepts entanglement as fundamental. Therefore, MWI violates Separability, which is a prerequisite for a robust notion of Locality.
      *   *The "Smuggling":* Does MWI smuggle in non-locality? It smuggles in **Holism**. The state of the universe is not the sum of the states of its parts. Bell's theorem rules out Local *Separable* theories. MWI is Local *Non-Separable*.
      *   *The Frame-Dependence Worry:* Decoherence defines branches. Decoherence depends on a preferred basis (usually position/energy). Is this Lorentz invariant? Generally, yes, but defining "simultaneity of branching" can be tricky.

  4.  **Evaluate "Who has the stronger case?":**
      *   *Eliezer:* Strong on formalism. The Schrödinger equation is a local PDE. No superluminal influence.
      *   *Maudlin:* Strong on metaphysics/ontology. If you can't say what's happening *here* without knowing what's happening *there* (due to entanglement), you've lost the spirit of locality, even if the math looks local in 3N dimensions.
      *   *Verdict:* It depends on whether you prioritize **Signal Locality** (no FTL communication) + **Formal Local Evolution** (Eliezer) OR **Ontological Separability** (Maudlin). Most physicists lean Eliezer (MWI is local), but philosophers of physics lean Maudlin (MWI is holist, and holism is a form of non-locality).
      *   *Crucial Nuance:* Bell's theorem rules out Local Hidden Variables. MWI has no hidden variables. But does it have "Local Beables"? No.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate that it's not just semantics.
      *   *Point 1: The Definition of "Local" (The Ontological Shift).* Eliezer focuses on *dynamical* locality (equations of motion). Maudlin focuses on *ontological* locality (states of regions).
      *   *Point 2: Configuration Space vs. 3D Space.* This is the big one. If reality is 3N-D, locality in 3N-D doesn't feel like locality in 3D. Maudlin argues this is a category error.
      *   *Point 3: Separability vs. Holism.* Bell assumes separability (outcomes are properties of particles). MWI rejects separability (state is global). Maudlin argues this is "non-locality by another name."
      *   *Point 4: The Branching/Matching Problem.* How do correlations emerge? In MWI, they are built into the global state. Maudlin asks: Is the global state a local object?
      *   *Evaluation:* Who wins?
          *   Eliezer wins on "No Superluminal Signaling/Causation."
          *   Maudlin wins on "The world isn't made of local stuff."
          *   The "Stronger Case": Maudlin's critique is deeper regarding *what physics is for* (describing local stuff), but Eliezer's is sufficient for *relativistic causality*.
      *   *Conclusion:* It's not a bait-and-switch, but a trade-off. MWI buys formal locality at the price of ontological holism.

