answer: |-
  This is one of the sharpest questions in the foundations of quantum mechanics. You are right to be suspicious of the "it depends on your definition" dodge, because while definitions are involved, there is a substantive physical commitment underneath them.

  The short answer is: **Eliezer is right about *dynamical* locality (causality), but Maudlin is right about *ontological* locality (separability).**

  The disagreement isn't a bait-and-switch, but it is a trade-off. MWI saves locality in the equations of motion by sacrificing locality in the description of what exists. Maudlin's critique is that a theory where the state of the universe cannot be reduced to the states of its spatial parts is, in a physically meaningful sense, non-local, regardless of what the Schrödinger equation looks like.

  Here is the breakdown of the actual dispute, the physical commitment MWI makes, and who has the stronger case.

  ### 1. The Two Definitions of "Local"

  To understand the disagreement, we have to separate two concepts that Bell's Theorem often conflates in popular discussion:

  1.  **Dynamical Locality (Signal Locality):** No influence propagates faster than light. Events in region A are determined by data in A's past light cone. The equations of motion are local differential equations.
  2.  **Ontological Locality (Separability):** The physical state of a composite system is fully determined by the physical states assigned to its component spatial regions. If you know what is happening *here* and what is happening *there*, you know the state of the system.

  **Eliezer's Argument (The LessWrong Sequence):**
  Eliezer argues for **Dynamical Locality**. He points out that the Schrödinger equation is a local differential equation. In MWI, there is no collapse. When Alice measures her particle, she becomes entangled with it. When Bob measures his, he becomes entangled with his. The wavefunction evolves smoothly. No information travels from Alice to Bob. The correlation is explained by the fact that they were entangled in the past. Therefore, no "spooky action at a distance" occurs. Bell's theorem is sidestepped because Bell assumed "single outcome" (which implies a specific type of hidden variable realism), not because locality was violated.

  **Maudlin's Argument (The Critic's View):**
  Maudlin argues for **Ontological Locality**. He contends that for a theory to be truly local, the "beables" (the things that physically exist) must reside in 3D space (or 4D spacetime). In MWI, the fundamental object is the Wavefunction. The Wavefunction does not live in 3D space; it lives in **3N-dimensional Configuration Space**.

  If the fundamental reality lives in configuration space, then "locality in configuration space" does not translate to "locality in physical space." Two points that are close in configuration space might correspond to particles being light-years apart in physical space. By moving the ontology to configuration space, MWI makes the evolution local *mathematically*, but at the cost of making the ontology *holistic* relative to our physical space.

  ### 2. The Real Physical Commitment: Holism

  You asked if MWI smuggles something back in. It does. It smuggles in **Holism**.

  In a classical local theory, the state of the universe is the sum of the states of local regions. In MWI, the state of the universe is a vector in a Hilbert space that is **non-separable**. You cannot assign a definite pure state to Alice's region and a definite pure state to Bob's region that fully describes the system. You can only assign a reduced density matrix (which represents ignorance/mixing) to the parts, while the whole remains pure.

  Maudlin's charge is that **Non-Separability is a form of Non-Locality.**

  If the physical state of region A cannot be specified without reference to region B, then region A is not physically independent of region B, even if no signal passes between them. Bell's Theorem rules out *Local Separable* theories.
  *   **Collapse Theories (GRW, Copenhagen):** Keep Separability (single outcomes in 3D space) but sacrifice Dynamical Locality (instantaneous collapse).
  *   **MWI:** Keeps Dynamical Locality (unitary evolution) but sacrifices Separability (the state is global).

  Eliezer treats "Locality" as synonymous with "No Superluminal Causation." Maudlin treats "Locality" as synonymous with "The world is made of stuff located in space."

  ### 3. The Configuration Space Objection

  This is Maudlin's strongest point. If you claim MWI is local, you must answer: **Local in what space?**

  If you say "Configuration Space," Maudlin replies: "Configuration space is an abstract mathematical construct, not physical space. Physical interactions happen in 3D space. If your ontology says the fundamental field exists in 3N dimensions, you have abandoned the project of describing a local physical world."

  For MWI to be local in the sense that matters for relativity, the beables must be definable on spacetime. MWI proponents (like David Wallace) argue that decoherence creates quasi-classical "worlds" that *look* like they are in 3D space. But Maudlin counters that these "worlds" are emergent, fuzzy, and not fundamental. The fundamental thing is the global wavefunction.

  **The "Smuggling":** MWI avoids Bell's non-locality claim by asserting the "correlation" isn't established at measurement, but was baked into the global wavefunction at the source. But if the global wavefunction is a single object stretching across the universe, asserting its unity is arguably asserting a non-local connection, even if it doesn't transmit signals.

  ### 4. The Branch Alignment / Frame Dependence Issue

  You mentioned the worry about branches needing to "line up." This is a technical version of the separability problem.

  In MWI, Alice splits into (Alice-Up, Alice-Down) and Bob splits into (Bob-Up, Bob-Down). The theory must ensure that the "Alice-Up" branch only ever interacts with the "Bob-Down" branch (for singlet states).

  In the formalism, this is guaranteed because they are coefficients of the same term in the superposition:
  $$ \Psi = \frac{1}{\sqrt{2}} ( |A\uparrow\rangle|B\downarrow\rangle - |A\downarrow\rangle|B\uparrow\rangle ) $$

  However, for this to work without non-locality, the "splitting" (decoherence) must be a local process. Decoherence is caused by local interactions with the environment. But defining *when* a branch becomes distinct enough to count as a "world" is not perfectly sharp.

  **The Frame-Dependence Worry:**
  Relativity says there is no preferred simultaneity. If Alice measures first in one frame, and Bob measures first in another, does the branching happen in a different order?
  *   **Eliezer/Deutsch:** It doesn't matter. The global state is covariant. The "branches" are just a way humans carve up the state. The underlying physics is frame-independent.
  *   **Maudlin:** If the "worlds" are what we experience, and their definition depends on a foliation of spacetime (a choice of simultaneity) to make sense of the correlations, you have reintroduced a preferred frame, violating the spirit of relativity.

  Most physicists think decoherence is robust enough to avoid a *preferred frame* violation, but Maudlin argues that without a precise ontology of where and when worlds exist, MWI relies on a vague "emergent" locality that isn't fundamental.

  ### 5. Who Has the Stronger Case?

  This is the verdict you asked for.

  **Eliezer has the stronger case regarding *Causality*.**
  If your worry is "Does measuring a particle here instantly change the physics there?", MWI says **No**. There is no mechanism in MWI analogous to the "collapse" of Copenhagen, which is undeniably non-local. If you define "Local" as "No superluminal influence," MWI is local. This is the definition most working physicists use.

  **Maudlin has the stronger case regarding *Metaphysics*.**
  If your worry is "Is the universe composed of local parts?", MWI says **No**. The universe is a single, indivisible wavefunction. The fact that it evolves via a local equation doesn't change the fact that the *state* is non-separable. Maudlin correctly identifies that MWI solves Bell's theorem by accepting **Holism**.

  **The "Gotcha":**
  Maudlin's critique is stronger because it addresses what Bell was actually worried about. Bell wasn't just worried about signaling (which QM forbids anyway); he was worried about **Local Causality**, which implies that probabilities in a region should depend only on beables in the past light cone.
  MWI satisfies this *if* you treat the wavefunction as the beable. But since the wavefunction is not in 3D space, MWI effectively says: "The beables are not in 3D space."
  Maudlin argues this is a retreat from physical realism.

  ### Summary

  Eliezer is not lying, but he is prioritizing **formal locality** (the equations) over **ontological locality** (the stuff).

  *   **Eliezer:** "Bell's theorem rules out Local Hidden Variables. We have no hidden variables and the equations are local. We are safe."
  *   **Maudlin:** "Bell's theorem rules out Local *Separable* theories. You are Non-Separable. You have a holistic wavefunction in 3N-space. You haven't saved locality; you've just redefined 'reality' to be something that isn't located in space."

  **Who wins?**
  If you care about **relativistic causality** (no FTL signals), Eliezer wins. MWI is compatible with Special Relativity.
  If you care about **local realism** (the world is made of things in space), Maudlin wins. MWI is a holistic theory where "things in space" are emergent shadows of a higher-dimensional object.

  The "bait-and-switch" you sensed is real: MWI claims to save "Locality," but it does so by sacrificing the "Local" part of "Local Realism" (the idea that reality is composed of local elements) while keeping the "Realism" (the wavefunction is real). It trades **Action-at-a-Distance** for **Existence-at-a-Distance**.

  Most philosophers of physics side with Maudlin here: MWI is **Local** in dynamics, but **Non-Local** in ontology. Whether that counts as "solving" Bell's theorem depends on whether you think ontology or dynamics is more fundamental. Given that physics is ultimately about describing the world we live in (3D space), Maudlin's objection that MWI abandons local ontology is the more damaging critique, even if MWI is mathematically consistent.
