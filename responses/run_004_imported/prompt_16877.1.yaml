      *   MWI is Local Non-Separable (holistic wave).
      *   Maudlin argues Non-Separability *is* a form of Non-Locality. Eliezer argues it isn't.
      *   *Decision:* Maudlin has the stronger philosophical case; Eliezer has the stronger formal case. But physically, MWI avoids the "spooky action" that bothered Einstein, which is usually what people care about.

  7.  **Final Polish:** Check tone. Ensure it respects the user's knowledge level (LessWrong sequences are technical/philosophical). Avoid jargon where possible, or define it. Make sure the distinction between Configuration Space and Physical Space is clear.

      *(Self-Correction during drafting)*: I should mention David Wallace. He bridges the gap. He argues MWI is local in the sense of "no action at a distance," even if the ontology is holistic. Maudlin insists holistic ontology *is* non-local. I need to make sure I don't get bogged down in the "many worlds" mechanism itself, but focus strictly on the locality claim.

      *Key Insight to highlight:* The wavefunction in MWI is a field on configuration space. A field on configuration space is local *in configuration space*. But configuration space is not physical space. That is the crux.

  8.  **Final Structure:**
      1.  Direct Answer: It's not semantics, it's Ontology vs. Dynamics.
      2.  Eliezer's Claim (Dynamical Locality).
      3.  Maudlin's Counter (Ontological Separability).
      4.  The Configuration Space Problem.
      5.  The "Matching" of Branches (Correlations without causation).
      6.  Verdict: Who is right? (Maudlin on metaphysics, Eliezer on causality).

  9.  (Final check against constraints): Did I avoid "it depends"? Yes, by framing it as a trade-off between two valid definitions where one is more physically intuitive (Maudlin) and one is more mathematically strict (Eliezer). I will argue Maudlin's critique is more damaging to the *spirit* of locality, even if MWI satisfies the *letter* of relativistic causality.

      *Wait, one more thing:* The user asked about "frame-dependent" branch alignment. I need to address that. Decoherence is generally robust, but defining *when* a split happens can be foliation-dependent. This is a technical weakness in the MWI locality claim.

