answer: |-
  You have put your finger on one of the most famous and significant problems in 20th-century metaethics. You aren't just imagining a wrinkle; you have independently reconstructed the **Frege-Geach Problem** (sometimes called the Problem of Embedding).

  Since you teach intro ethics, I'll skip the "what is metaethics" preamble and cut straight to the metal. You are absolutely right to feel that tension. The brother-in-law (BIL) is espousing a naive version of **Emotivism** (think A.J. Ayer or early Stevenson), where moral sentences are purely expressive speech acts. But as you noticed, moral sentences function grammatically and logically like descriptive propositions.

  Here is the breakdown of why this is a problem, whether it kills the view, and how you can explain it to him before the next turkey dinner.

  ### 1. The Problem: Logic Needs Truth-Bearers
  The core issue is that standard logic (like the *Modus Ponens* argument your BIL used) operates on **propositions**—things that can be true or false.

  *   **Premise 1:** If $P$, then $Q$.
  *   **Premise 2:** $P$.
  *   **Conclusion:** Therefore, $Q$.

  In the rain example:
  1.  If it is raining, the sidewalk is wet.
  2.  It is raining.
  3.  Therefore, the sidewalk is wet.

  This works because "It is raining" has the same meaning in Premise 1 and Premise 2. In Premise 1, it isn't being asserted as true; it's being *embedded* in a conditional. But it still contributes a truth-condition to the sentence.

  In your BIL's moral argument:
  1.  If owning up is right, tell the boss.
  2.  Owning up is right.
  3.  Therefore, tell the boss.

  If "Owning up is right" just means "Boo hiding mistakes!" (or "Hurrah owning up!"), then Premise 1 translates to: **"If Hurrah owning up!, then tell the boss."**

  As you sensed, this is nonsense. You can't put an exclamation mark or an emotional expression inside the antecedent of a conditional. I'm not currently expressing an attitude in Premise 1; I'm considering a relationship between two claims. If moral sentences *only* express attitudes, they cannot be the components of logical arguments. But we clearly *do* reason with them. Therefore, the "Boo/Hurrah" theory cannot be the whole story.

  ### 2. Is it Fatal? (The "Patch" Question)
  You asked if this shows the view "can't be the whole story" or if it's a "technical wrinkle."

  **For the BIL's specific version (Naive Emotivism): It is fatal.**
  If he insists that moral talk is *nothing but* the expression of emotion, like cheering at a football game, the Frege-Geach problem refutes him. You cannot cheer conditionally.

  **For Sophisticated Expressivism (Quasi-Realism): It is a wrinkle they claim to have patched.**
  Philosophers like **Simon Blackburn** (Quasi-Realism) and **Allan Gibbard** (Norm-Expressivism) accept your challenge. They agree that moral sentences *look* like facts and *act* like facts in logic. Their project is to explain how we can "earn the right" to talk about moral truth and validity without actually believing in moral facts.

  Blackburn argues that validity isn't about the preservation of *truth* (since there are no moral truths), but about the **consistency of attitudes**. To accept the premises of that argument but deny the conclusion is to have a clash of attitudes that is functionally identical to a logical contradiction. So, we can *talk* as if there are moral truths (quasi-realism) because it serves the practical purpose of coordinating our attitudes, even if metaphysically there are none.

  So, is it a problem? Yes. Is it a refutation of all non-cognitivism? No, but it forces the theory to become much more complex than "it's just booing."

  ### 3. The Thanksgiving Explanation
  Since you want to explain this to him without putting everyone to sleep, here is a clean way to frame it. You want to show him that his *practice* (arguing logically) contradicts his *theory* (moral claims are just emotions).

  **The Script:**

  > "I love the 'booing and cheering' idea, and I think it captures how passionate moral talk feels. But I got stuck on that argument you made about my sister and her boss.
  >
  > "Think about the difference between **feeling** something and **reasoning** about it. If I say 'Ouch!', that's like booing. It's a pure reaction. But imagine I say: 'If I touch that stove, I'll say ouch.'
  >
  > "In that sentence, I'm not actually saying 'Ouch!' I'm not in pain. I'm stating a connection between two facts.
  >
  > "When you told my sister, 'If owning up is right, you should do it,' you weren't cheering for owning up in that first sentence. You were treating 'owning up is right' like a fact that connects to another fact.
  >
  > "If morality was *just* cheering, you couldn't put it inside an 'if.' You can't say 'If Boo! then...' It breaks the logic. The fact that we can reason through moral problems like math problems suggests there's more going on than just emotions. We are treating them like truths, even if you say they aren't."

  ### 4. A Bonus Analogy (The "Menu" vs. The "Meal")
  If he pushes back, try this analogy:

  > "Your theory says moral statements are like **ordering food**. 'Steak is good' means 'I want steak!'
  >
  > "But that argument you made was like looking at a **menu** and figuring out what you can afford. 'If I order the steak, I can't get the lobster. I want the steak. So I can't get the lobster.'
  >
  > "In that reasoning, 'I want the steak' isn't functioning as a desire; it's functioning as a piece of information in a calculation. If moral talk is *only* desire, we shouldn't be able to use it in calculations. But we do. So either we are confused, or moral talk does more than just express desire."

  ### Summary for You
  You have correctly identified that **logical embeddability** is the stress test for expressivism.
  *   **If he sticks to simple Emotivism:** He is logically committed to saying that moral arguments are invalid, which contradicts his own behavior (and intuition).
  *   **If he upgrades to Quasi-Realism:** He has to admit that moral language *mimics* factual language so well that for all practical purposes (including logic), it behaves as if it states facts.

  At that point, the debate shifts from "Are there moral facts?" to "Does it matter if there are moral facts if the language works exactly the same way?" But that is a debate for next Thanksgiving. For this year, you have the upper hand: **You can't put a cheer in an 'if-clause.'**
