  4.  **Identify the Key Disanalogies:**

      *   **1. Truth-Makers vs. Modeling Assumptions:**
          *   In stats, counterfactuals are *definitions* within a model. If the model fits data, good.
          *   In Molinism, counterfactuals are *metaphysical facts* existing prior to creation. They need an ontological anchor.
