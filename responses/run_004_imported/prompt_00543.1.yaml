answer: |-
  You are correct, and your recollection from your epistemic game theory course is accurate. Your friend is conflating two distinct epistemic results, or perhaps relying on a specific, stronger definition of "rationality" that implicitly bundles in belief consistency.

  In the standard epistemic framework (following Bernheim, Pearce, Aumann, and Brandenburger), **Common Knowledge of Rationality (CKR) alone yields Rationalizability, not Nash Equilibrium.** To get Nash Equilibrium, you need an additional condition regarding the alignment of beliefs (conjectures).

  Here is the precise breakdown of where the gap lies, the specific epistemic conditions required for Nash, and why the distinction matters.

  ---

  ### 1. The Baseline: CKR $\rightarrow$ Rationalizability
  Your intuition is the standard baseline result (Bernheim 1984; Pearce 1984).
  *   **Rationality:** A player chooses a strategy that is a best response to *some* belief about the opponents' strategies.
  *   **Common Knowledge of Rationality (CKR):** Everyone is rational, everyone knows everyone is rational, everyone knows that everyone knows..., ad infinitum.

  **The Result:** CKR eliminates strategies that are never best responses to any belief about rational play. Iterating this process leaves the set of **rationalizable strategies**.
  *   **The Gap:** Rationalizability allows for *divergent* beliefs. In a coordination game (e.g., Stag Hunt), it is rational for me to play Stag if I believe you will play Stag. It is rational for you to play Hare if you believe I will play Hare. If we have CKR, I know you are rational, so I know you won't play a dominated strategy. But if both Stag and Hare are rationalizable for you, CKR does not force me to know *which* one you will pick. We can both be rational, and commonly know it, yet fail to coordinate on a Nash Equilibrium.

  ### 2. The Aumann & Brandenburger (1995) Conditions for Nash
  The definitive paper on this is Aumann and Brandenburger, *"Epistemic Conditions for Nash Equilibrium"* (Econometrica, 1995). They derive exactly what is needed to bridge the gap between Rationalizability and Nash.

  They distinguish between **rationality** (maximizing utility given beliefs) and **conjectures** (beliefs about opponents' strategies).

  #### The 2-Player Case
  For a 2-player game, the conditions for a profile of strategies to be a Nash Equilibrium are:
  1.  **Mutual Knowledge of Payoff Functions:** We know the game.
  2.  **Mutual Knowledge of Rationality:** We know each other is maximizing.
  3.  **Mutual Knowledge of Conjectures:** I know what you believe I will do, and you know what I believe you will do.

  **Crucially:** Condition (3) is *not* implied by CKR. CKR implies I know you are maximizing, but it does not imply I know *which* belief you are maximizing against.
  *   If we have Mutual Knowledge of Conjectures, it implies our beliefs are **correct**. (If I know your conjecture about me, and you know your conjecture about me, and we are both rational, the conjectures must align with actual play).
  *   **Theorem:** In 2-player games, (1) + (2) + (3) $\implies$ Nash Equilibrium.

  #### The $n$-Player Case ($n > 2$)
  The requirements become stricter. For $n > 2$ players, Mutual Knowledge is not enough. You need **Common Knowledge of Conjectures**.
  *   In a 3-player game, Player 1 needs to know Player 2's conjecture about Player 3. If Player 1 and Player 2 have different beliefs about what Player 3 will do, Player 1 and Player 2 might best-respond to different expectations, even if everyone is rational.
  *   To ensure a Nash Equilibrium, the beliefs about third parties must be commonly known (and thus identical) across all players.

  ### 3. What Your Friend Is Missing: The "Correctness" of Beliefs
  The core of your disagreement lies in the definition of **Conjectures**.
  *   **Nash Equilibrium** requires that beliefs are **correct** (my belief about your action matches your actual action) and **independent** (in the non-cooperative sense).
  *   **CKR** only requires that beliefs are **consistent with rationality** (my belief about your action is a strategy that could be rational for you).

  Your friend's claim that CKR yields Nash is only true if "Rationality" is defined to include "Having correct beliefs about others' rational choices." But in standard decision theory, rationality is purely instrumental (maximizing expected utility given *subjective* priors). You can be perfectly rational with wrong beliefs.

  **Where the "Work" is done:**
  The heavy lifting in justifying Nash Equilibrium is done by the **Mutual/Common Knowledge of Conjectures** assumption, not the Common Knowledge of Rationality assumption.
  *   CKR prunes the tree of impossible strategies (Rationalizability).
  *   Knowledge of Conjectures selects the specific branch where beliefs coordinate (Nash).

  ### 4. Common Knowledge vs. Common Belief/Certainty
  You asked specifically about this distinction, and it is indeed load-bearing.

  *   **Knowledge ($K$):** Factive. $K_i(\phi) \implies \phi$ is true. If I *know* you are playing Stag, you *must* be playing Stag.
  *   **Belief ($B$):** Non-factive. $B_i(\phi)$ does not imply $\phi$. I can *believe* you are playing Stag while you play Hare.

  **In the context of Nash:**
  Nash Equilibrium requires **correct beliefs**. In epistemic logic, a "correct belief" is effectively **knowledge**.
  *   If we assume only **Common Belief in Rationality**, we get Rationalizability (or Correlated Equilibrium if we add a Common Prior).
  *   To get Nash, we effectively need **Common Knowledge of Conjectures**. Because if I *know* your conjecture, and you *know* my conjecture, and we are rational, the conjectures must be mutually consistent and correct.

  **The Common Prior Assumption (CPA):**
  There is a related result by Aumann (1987): **CKR + Common Prior $\implies$ Correlated Equilibrium.**
  *   Your friend might be conflating Nash with Correlated Equilibrium.
  *   A Common Prior ensures that differences in beliefs come only from differences in information, not from "agreeing to disagree."
  *   However, Correlated Equilibrium allows for correlated strategies (mediated by a signal). Nash Equilibrium requires independent mixing. To get from Correlated to Nash, you need the additional assumption that the players' types/strategies are independent (no correlating device).

  ### 5. Why 2-Player Zero-Sum Games Behave Better
  Your intuition about special cases is also correct.
  *   **Minimax Theorem:** In 2-player zero-sum games, the set of rationalizable strategies often collapses to the set of Nash Equilibrium strategies.
  *   **Why?** Because in zero-sum games, a rational opponent is trying to minimize your payoff. There is less ambiguity about what a rational opponent *should* do (they must play their security strategy).
  *   In a coordination game (non-zero-sum), there are multiple rational responses depending on expectations. In zero-sum, the "rational" move is often unique or interchangeable in terms of payoff, making the "Knowledge of Conjectures" condition easier to satisfy implicitly.

  ### 6. Summary for Your Argument
  You can summarize the resolution to your friend as follows:

  1.  **You are right on the general case:** Common Knowledge of Rationality (CKR) implies **Rationalizability**, not Nash Equilibrium. CKR allows for multiple, mutually inconsistent beliefs about which rational strategy an opponent will choose.
  2.  **She is right only under stronger conditions:** CKR yields Nash Equilibrium **if and only if** it is accompanied by **Mutual (or Common) Knowledge of Conjectures**. This condition forces beliefs to be correct and coordinated.
  3.  **The Distinction:** The gap is the difference between knowing *that* an opponent is optimizing (CKR) vs. knowing *what* they believe you will do (Knowledge of Conjectures).
  4.  **The Prior Issue:** If she invokes a **Common Prior**, CKR yields a **Correlated Equilibrium** (Aumann 1987), which is a superset of Nash. To get Nash specifically, one must add the assumption of independence (no correlation device).

  **Verdict:** Your understanding is the more rigorous one. The claim that "CKR $\implies$ Nash" is a common shorthand that elides the critical assumption of belief consistency (Knowledge of Conjectures). In epistemic game theory, precision on that point is the difference between Rationalizability and Nash.
