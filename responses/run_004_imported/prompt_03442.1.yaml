  This is a classic problem in experimental philosophy. You are absolutely right that the original Chairman case confounds **Norm Violation** (Harming is bad) with **Deep Self Match** (The Chairman is indifferent/callous, which aligns with harming).

  To settle this, you need a **"Crossed" Case** (specifically, a *Norm Violation + Deep Self Mismatch* scenario).

  Here is a new thought experiment designed to drive a wedge between the Uttich & Lombrozo (U&L) account and the Sripada (Deep Self) account.

  ### The Case: "The Reluctant Pharmacist"

  **The Setup:**
  Dr. Aris is a pharmacist in a region suffering from a severe opioid addiction crisis. There is a strong social and moral norm in this community against contributing to addiction; everyone agrees that fueling the crisis is a terrible thing to do.

  **The Deep Self:**
  Dr. Aris is personally a recovering addict and a vocal anti-addiction activist. Helping people overcome addiction is his life's mission; it is central to his character and values. He genuinely hates the idea of anyone becoming dependent on opioids.

  **The Situation:**
  A long-term patient with a rare chronic condition comes in. The *only* medication that relieves their agony is a potent opioid.
  *   **Primary Goal:** Relieve the patient's pain (Dr. Aris wants to do this).
  *   **Side Effect:** Statistical models show that dispensing this specific drug to this patient will, as a foreseeable byproduct, contribute to the local black market supply and slightly worsen the community addiction crisis.

  **The Statement:**
  Dr. Aris says: *"I know that dispensing this will contribute to the local addiction crisis. I think addiction is a scourge. It goes against everything I stand for, and it breaks my heart to be part of the problem. But this patient is in agony, and I cannot deny them relief."*

  He dispenses the drug. The addiction crisis worsens slightly as predicted.

  ***

  ### The Predictions

  This case dissociates the variables:
  1.  **Norm Violation:** **YES.** Worsening an addiction crisis is a moral norm violation (a "bad" outcome).
  2.  **Deep Self Match:** **NO.** The outcome contradicts Dr. Aris's core values and character (he is an anti-addiction activist).

  Here is where your debate gets settled:

  #### 1. Team Uttich & Lombrozo (Norm Violation / Salience)
  *   **Theory:** People ascribe intentionality when a side effect violates a norm because norm-violating behavior is more *diagnostic* and *salient*. It demands an explanation. When someone breaks a norm (even reluctantly), observers focus on the violation to understand the agent's priorities.
  *   **Prediction:** **High Intentionality.**
  *   **Reasoning:** Even though Aris regrets it, he *violated a salient moral norm* (contributing to addiction). Observers will say he did it "intentionally" because the violation makes the mental state salient. The fact that he proceeded despite the norm being broken makes the action stand out, leading people to classify the side effect as intentional to make sense of the transgression.

  #### 2. Team Sripada (Deep Self)
  *   **Theory:** People ascribe intentionality when the outcome flows from the agent's "Deep Self" (their stable values, commitments, and character). If the outcome is alien to who the person is, it is not intentional.
  *   **Prediction:** **Low Intentionality.**
  *   **Reasoning:** The outcome (worsening addiction) is in direct conflict with Aris's Deep Self (anti-addiction activist). It does not express his character; in fact, it betrays it. Because the outcome is "alien" to his core values, observers will say he did it "unintentionally" (or "regrettably"), viewing it as a tragic byproduct rather than an expression of his will.

  ### Why this works better than the Chairman Case

  In the original **Chairman Harm** case:
  *   Norm Violation: **Yes** (Harming environment).
  *   Deep Self Match: **Yes** (Chairman is indifferent/callous, which matches harming).
  *   *Result:* Both theories predict "Intentional."

  In the original **Chairman Help** case:
  *   Norm Violation: **No** (Helping environment).
  *   Deep Self Match: **No** (Chairman is indifferent, doesn't value helping).
  *   *Result:* Both theories predict "Unintentional."

  In the **Reluctant Pharmacist** case:
  *   Norm Violation: **Yes** (Worsening addiction).
  *   Deep Self Match: **No** (Hates addiction).
  *   *Result:* **Divergence.**

  ### How to run the test
  If you survey people on this case:
  *   If the majority say **"Yes, he intentionally worsened the crisis,"** the **Norm Violation** account (U&L) wins. The "badness" of the act drove the judgment, overriding his personal regret.
  *   If the majority say **"No, he didn't intentionally worsen the crisis,"** the **Deep Self** account (Sripada) wins. His personal values protected him from the intentionality ascription, despite the norm violation.

  *Note: You may want to ensure the "Primary Goal" (pain relief) is seen as neutral or positive, so it doesn't become a "means to an end" debate. The key is that the addiction is purely a side effect he foresees but opposes.*
