          *   *Flip it:* An artist who values tradition (Deep Self = Conformity).
          *   *Side Effect:* Offending the community (Norm Violation).
          *   *Statement:* "I know this will offend them. I hate offending people. But the art requires it."
          *   *Prediction:*
              *   Sripada: Mismatch (Hates offending) $\rightarrow$ Unintentional.
              *   U&L: Norm Violation (Offense is a breach) $\rightarrow$ Intentional.
          *   *Problem:* "Offense" is subjective.

      *   *Idea 7 (The "Reluctant Whistleblower" - Norm Conformity vs Deep Self Match):*
          *   *Goal:* Find a case where a Norm is *Followed* (U&L predict Low Intentionality) but the Deep Self *Matches* (Sripada predicts High Intentionality).
          *   *Scenario:* A spy.
          *   *Norm:* Espionage violates legal/national norms of the target country. But conforms to the spy's own organization's norms.
