      *   *Idea 3 (Social/Etiquette Norms vs. Moral Character):* This is promising. Uttich & Lombrozo argue norms don't have to be *moral*, just statistical or conventional. Sripada focuses on *moral/character* deep self.
          *   *Scenario:* A situation where a *conventional* norm is violated, but the action aligns with a *good* deep self. Or a *moral* norm is violated, but it contradicts the deep self.
          *   *Let's try to target the "Norm Violation" mechanism specifically.* U&L say *any* norm violation makes things salient. Sripada says it must match the *Deep Self*.
          *   *Target Case:* Norm Violation + Deep Self Mismatch.
          *   *Setup:* An agent does something that breaks a rule/norm, but the outcome is something they would personally regret or find abhorrent (Deep Self Mismatch).
          *   *Example:* A pacifist soldier.
          *   *Action:* Fires a missile to destroy a bunker (Primary).
          *   *Side Effect:* Kills civilians (Norm Violation: Collateral damage is often seen as 'bad' or prohibited, though legally complex).
          *   *Deep Self:* Pacifist. Hates killing.
          *   *Problem:* If they hate killing, did they do it intentionally? Most people say yes in war cases. This might favor U&L too much.

      *   *Idea 4 (The "Clumsy Violator"):*
