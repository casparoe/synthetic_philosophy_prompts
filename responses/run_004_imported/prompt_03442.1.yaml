          *   *Critique:* This is very close to the "Help" case but with a bad outcome. In the Help case, the Chairman doesn't care about helping. Here, the agent *cares* about not harming.
          *   *Refinement:* Let's look for a *non-moral* norm violation to test U&L's claim that *any* norm works, while Sripada focuses on *moral/character* deep self.
          *   *Uttich & Lombrozo (2010)* actually argue that *moral* norms are just a subset of *all* norms. But they emphasize that norm-violation makes mental states salient.
          *   *Sripada* emphasizes the *agent's own* commitments.

      *   *Idea 6 (The "Eccentric Artist" - Dissociating Social Norms from Deep Self):*
          *   *Context:* An art installation.
          *   *Agent:* An artist who values shock value and breaking conventions (Deep Self = Norm Violation).
          *   *Scenario:* The artist creates a piece.
          *   *Primary Goal:* Make art.
          *   *Side Effect:* Offending the local community (Norm Violation: Social norm of politeness).
          *   *Deep Self:* The artist *wants* to offend. (Match).
