answer: |-
  This is a sharp reading, and you are right to be wary of the "standard line." In a seminar setting, the "lying damages the soul" argument is the baseline, not the finish line. If you submit a paper that simply restates the ontological argument without engaging the ecclesiological context of *Contra Mendacium*, you will likely blend in with the pack.

  Here is a stress-test of your three specific concerns, along with advice on how to frame this for a 3–4 page limit.

  ### 1. Is the "Two Strands" reading supported by the text?
  **Verdict:** Yes, but with a caveat on how you weight them.

  You are correct that *Contra Mendacium* differs in tone and emphasis from *De Mendacio*. *De Mendacio* is more abstract and metaphysical (the nature of signification); *Contra Mendacium* is pastoral and polemical (the health of the Church).

  In *Contra Mendacium*, Augustine explicitly argues that if the Church adopts the methods of the heretics, it destroys its own authority to teach. He writes that we cannot "cleanse the filth of heresy with the filth of lying." He is deeply concerned with the *scandal* it would cause: if Catholics lie to catch Priscillianists, how can they ever credibly preach against the Priscillianist practice of deception (which often involved *dissimulatio* or hiding truth from the "unworthy")?

  **The Hole to Watch:** Be careful not to frame this as a *pragmatic* argument (i.e., "lying is bad because we might get caught" or "it looks bad"). Augustine is not a consequentialist. His argument is that the Church's integrity *is* a theological reality, not a PR strategy. If the Church lies, it ceases to be a reliable witness to Truth (Christ).
  *   **Fix:** Don't say he shifts from "soul integrity" to "church reputation." Say he expands the "soul integrity" argument to the "Body of Christ." The lie damages the *ecclesial* soul just as it damages the individual soul. This keeps you within Augustine's theological framework while highlighting your specific insight about the Priscillianist context.

  ### 2. Is the Lying-vs-Killing asymmetry a known problem?
  **Verdict:** Yes, this is a classic problem in Augustinian ethics.

  If you present this as a "gap in his thought" that you discovered, a knowledgeable professor will likely flag it as overlooking standard scholarship. The tension between Augustine's absolute prohibition on lying and his conditional acceptance of killing (in war or capital punishment) is well-trodden ground.

  **The Standard Response:** The standard Augustinian defense relies on the **definition of the act itself**.
  *   **Killing:** For Augustine, the sin of murder is not in the physical removal of life *per se*, but in the *intent* (the *libido dominandi* or lust for power). In a Just War, the soldier kills out of obedience to order and love of justice, not private malice. Therefore, the act can be physically identical to murder but morally distinct.
  *   **Lying:** The sin of lying is *constituted* by the intent. A lie is defined as "speaking against what is in your mind." You cannot have a "righteous lie" because the very definition of the act includes the disorder of the will. There is no "external act" of lying that can be separated from the internal falsehood.

  **How to use this without looking naive:**
  Do not present this as a "gotcha" inconsistency. Instead, present it as a **test case for his theology of language.**
  *   *Argument:* "Augustine's refusal to allow exceptions for lying, even while allowing them for killing, reveals that he views speech not merely as an action among others, but as the unique faculty bearing the *Imago Dei*. Physical violence can be redeemed by right intention; speech cannot, because speech *is* the manifestation of intention."
  *   This turns a potential "error" into a profound insight about his philosophy of language.

  ### 3. Is this a stronger paper topic?
  **Verdict:** Yes, significantly.

  The "soul purity" paper is safe but often repetitive. Your angle engages with the historical context (Consentius/Priscillianists), the ecclesiological stakes, and a comparative ethical problem. It shows you read the text closely rather than just relying on lecture notes.

  **However, a warning on scope:**
  3–4 pages is roughly 1,000–1,200 words. That is very tight.
  *   **Risk:** If you spend 2 pages explaining the Priscillianist context and 2 pages on the Just War comparison, you will run out of space to actually analyze *Contra Mendacium*.
  *   **Recommendation:** Make the Priscillianist/Consentius argument your **main thesis**. Use the Just War comparison only in the **final paragraph** as a "further implication" or a "limit case" to show the depth of Augustine's commitment to truth.
  *   **Why:** The Priscillianist argument is specific to *Contra Mendacium* (which is your assignment). The Just War argument requires bringing in *City of God* or other texts. If you haven't read the Just War texts closely for this seminar, you risk making a shaky comparison.

  ### Suggested Thesis Tweak
  Instead of asking "Is there a gap?", try arguing this:

  > "While Augustine's ontological argument (that lying violates the soul's integrity) provides the foundation for his ethics, in *Contra Mendacium* the **ecclesiological argument** carries the practical weight: the Church cannot witness to Truth by employing the epistemological corruption of heresy. This absolute prohibition, even stricter than his rules on killing, suggests Augustine views truthful signification as the primary locus of the *Imago Dei*, one that cannot be instrumentalized even for salvation."

  ### Summary of Advice
  1.  **Go for it.** It is a much more interesting paper than the standard version.
  2.  **Don't call it a "gap."** Call it a "hierarchy of goods" or a "theology of signification." Acknowledge the killing distinction but explain *why* speech is different (the act *is* the intent).
  3.  **Watch the word count.** Prioritize the Consentius/Priscillianist analysis. The Just War point is a great "mic drop" for the conclusion, but don't let it eat the body of the essay.
  4.  **Cite the text.** Make sure you quote the specific passages in *Contra Mendacium* where he talks about losing credibility or "fighting fire with fire."

  Good luck. This is the kind of paper that gets A's in seminars because it treats Augustine as a thinker with specific problems to solve, not just a statue reciting dogma.
