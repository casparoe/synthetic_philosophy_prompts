answer: |-
  The air around the threshold hummed, a low vibration that Rosalind felt in her teeth. She stood with one hand hovering over the interface, waiting. Behind her, the argument had escalated from a whisper to a clash.

  **Dev:** "Stop calling it a counterpart, Iris. She's stepping through to meet *herself*. Not a mimic. Not a twin. Her."

  **Iris:** "She is stepping into a distinct spacetime location. Nothing exists in more than one place at once, Dev. Not even Rosalind. The woman waiting on the other side is her closest counterpart, bound by resemblance and causal history. Nothing more."

  **Dev:** "That's the Humphrey objection in a nutshell, and you know it. If it's just a counterpart, why should Rosalind care what happens to her? Humphrey didn't care that his counterpart won the election; he cared whether *he* won. If Rosalind touches that woman's pain, it can't be metaphorical. It has to be identity."

  **Iris:** "Care isn't a metaphysical test, Dev. We care about our children, our parents, our lovers. None of them are us. We care because they are causally tethered to us, because their flourishing is the actualization of our own hopes. Rosalind cares because that woman is what Rosalind *could have been*. The emotional stake doesn't require numerical identity."

  **Dev:** "But it's not just hope. It's memory. It's agency. If Rosalind changes something over there, it resonates here. You can't get that resonance from a stranger, however uncannily alike. There has to be a single subject persisting across the divide."

  **Iris:** "Then tell me: what fixes that subject? If it's not resemblance and continuity, what is the glue? You say 'identity,' but identity is absolute. You can't be a little bit identical. So where does the glue stop working?"

  **Dev:** "It stops where the person stops. Origin fixes it. As long as they share the same origin point—the same conception, the same start—and only diverge by choice, it's the same person. The history is shared up to the split."

  **Iris:** "So if I tweak the dial and send her to a branch where her parents never met? Where she was never born? Is that Rosalind waiting on the other side?"

  **Dev:** "No. Obviously not. If she doesn't exist, she isn't there."

  **Iris:** "Why? You just admitted identity tracks divergences. A different job, a different marriage—that's Rosalind. But a different conception isn't? You're drawing a line in the sand and calling it a soul."

  **Dev:** "I'm drawing a line at the necessary properties of the individual. Her origin is essential to her. Her career path isn't. Kripke was clear on this. We can imagine Rosalind as a lawyer, but we can't imagine Rosalind coming from different gametes."

  **Iris:** "But the machine doesn't care about your essentialism. It cares about modal distance. If the branch where she's a lawyer is accessible, why is the branch where she wasn't born inaccessible? They're both just different decisions in the causal chain. If you say identity holds for one divergence but not the other, you're admitting that 'identity' is just a shorthand for 'sufficient resemblance.'"

  **Dev:** "I'm admitting that human beings aren't formulas. We recognize ourselves. When Rosalind looks through that glass, she won't see a stranger with her face. She'll recognize her own posture, her own hesitation. That recognition *is* the identity."

  **Iris:** "Recognition is psychological. I'm talking about ontology. If you insist she is literally the same woman twice over, you have to explain how one entity occupies two mutually exclusive histories without contradiction. Counterpart theory avoids the contradiction. It says: This Rosalind is here. That Rosalind is there. They are linked, but they are not one."

  **Dev:** "And that leaves Rosalind as a tourist in her own life. If she's not the same, then her regrets over there aren't her regrets. They belong to someone else. You're asking her to walk into a room full of ghosts and pretend they're flesh."

  **Iris:** "I'm asking her to walk into a room full of possibilities and understand they are real. That is more dangerous than pretending they are her. If she thinks it's her, she'll try to merge. If she knows it's a counterpart, she knows the boundary is hard. She knows she can't overwrite that woman."

  **Dev:** "She doesn't want to overwrite. She wants to integrate. She wants to know that the sum of her choices is still *her*."

  **Iris:** "Then she needs to know that the woman on the other side has her own claim to that sum. That woman thinks *she* is the original. If Rosalind claims identity, she denies that woman's existence. Counterpart theory grants the other Rosalind her own life. Your transworld identity makes her a shadow."

  **Dev:** "Or it makes them both facets of a single diamond."

  **Iris:** "Diamonds don't feel pain, Dev. People do. And if Rosalind gets hurt over there, I need to know if I'm mourning my student, or just her closest possible match."

  **Dev:** "Then come with us. And you'll see."

  **Iris:** "I'm staying here to hold the anchor. But don't ask me to lie about what you're touching."
