answer: |-
  You have put your finger on the exact nerve that makes the "surrogate goal" proposal controversial even among decision theorists who are sympathetic to FDT. Your skepticism is well-founded: if the commitment is credible, the vulnerability *must* be real. If it isn't real, a perfect simulator (which FDT assumes) sees through it, and the blackmail proceeds against the original target.

  There is no magic mechanism that allows you to signal "I care about $Y$ as much as $X$" to a threatener without actually configuring your decision algorithm to treat harm to $Y$ as a massive utility loss. In FDT terms, **credibility requires functional terminality.** You cannot have the commitment be credible to the threatener without it becoming a "terminal value" (or a policy-equivalent proxy) that you are "on the hook" for.

  So, if the vulnerability is merely relocated and not removed, what is the gain? The literature often gestures at this because the gain isn't in the *nature* of the value, but in the **topology of the threat space**. The "trick" relies on three specific asymmetries that a well-chosen surrogate goal ($Y$) can exploit compared to your natural goal ($X$).

  Here is the breakdown of the mechanism that is often under-explained.

  ### 1. The Schelling Point Asymmetry (Coordination Costs)
  Natural values ($X$), like "human survival" or "computational resources," are **Schelling points**. They are focal points for conflict because many agents care about them intrinsically. If you care about $X$, a threatener does not need to do any work to establish that harming $X$ hurts you; it is common knowledge.

  A surrogate goal ($Y$) is, by design, **arbitrary**. It is not a natural Schelling point.
  *   **The Mechanism:** By switching to $Y$, you force the threatener to coordinate on a new focal point. In a landscape with multiple potential threateners (or a threatener with uncertainty about your code), the probability of $Y$ being targeted *exogenously* is near zero.
  *   **The Gain:** You reduce the **baseline probability of threat initiation**. $X$ is a target-rich environment; $Y$ is a single, obscure lock. Even if the threatener simulates you and *knows* you care about $Y$, they must now expend resources to construct a threat vector against $Y$ that they didn't need to expend for $X$. If the cost of constructing the threat against $Y$ exceeds the expected extortion profit, the threat is defused.

  ### 2. The Asymmetric Cost of Enforcement
  This is the most critical game-theoretic lever. For a threat to be credible, the threatener must be able to carry it out.
  *   **Natural Goal ($X$):** Usually, harming $X$ is cheap for the threatener. (e.g., "I will delete your code" or "I will launch nukes").
  *   **Surrogate Goal ($Y$):** You choose $Y$ specifically such that **harming $Y$ is costly or difficult for the threatener**, even if it is catastrophic for you.
  *   **The Mechanism:** You select a $Y$ that is logically or physically entangled with the threatener's own interests, or is simply hard to manipulate.
      *   *Example:* $Y$ = "The threatener's own source code remains unmodified."
      *   If you commit to treating harm to $Y$ as catastrophic, the threatener cannot threaten $Y$ without modifying their own code (which they disvalue).
  *   **The Gain:** You haven't removed the vulnerability, but you have made the **threat non-credible**. A rational threatener will not carry out a threat that costs them more than the concession is worth. By binding your utility to something the threatener *cannot* harm without self-harm, you render their leverage null.

  ### 3. Decoupling from Exogenous Risk
  Your worry is that you are now "on the hook" for $Y$. This is true, but you must distinguish between **endogenous risk** (threats from rational agents) and **exogenous risk** (accidents, nature, third parties).
  *   **Natural Goal ($X$):** High exogenous risk. Humanity might go extinct due to asteroids, plague, or war regardless of blackmail.
  *   **Surrogate Goal ($Y$):** You can choose a $Y$ with near-zero exogenous risk.
      *   *Example:* $Y$ = "The 10^100th digit of Pi is 7." (Obviously, this can't be changed, so it's a bad example for a threat, but imagine a cryptographic commitment).
      *   *Better Example:* $Y$ = "A specific bit in a secure, isolated register is 0."
  *   **The Gain:** You are only vulnerable to $Y$ if an agent *specifically targets you*. You eliminate the background radiation of risk. Even if a blackmailer *could* target $Y$, the total expected disutility is lower because the probability of $Y$ being affected by *anything other than a deliberate blackmail attempt* is zero.

  ### The "Terminal Value" Objection Revisited
  You asked: *"Can you spell out the trick that's supposed to let the commitment be credible... without it turning into an actual new terminal value?"*

  The hard truth of FDT is: **There is no such trick.**

  If you are dealing with a threatener who can simulate your source code (which is the standard assumption in acausal trade/blackmail scenarios), you cannot "pretend" to care about $Y$. You must actually modify your utility function (or policy) to maximize $U'(Y)$.

  The literature sometimes gestures around this because they are trying to describe **instrumental precommitment**. They want to say, "I value $Y$ *only because* it protects $X$." But in FDT, if the threatener knows $Y$ is only instrumentally valuable, they know you will drop the commitment if the blackmail pressure gets too high (time inconsistency). To make it stick, you must **burn the bridge**. You must actually make $Y$ terminal *for the duration of the interaction*.

  **So what is actually gained?**
  You are trading a **high-probability, low-cost-to-threaten vulnerability** ($X$) for a **low-probability, high-cost-to-threaten vulnerability** ($Y$).

  ### Summary for Dissertation Context
  If you are writing on this, the strongest framing is that Surrogate Goals are not a **shield** (removing vulnerability) but a **decoy** (relocating vulnerability to a fortified position).

  1.  **Credibility Condition:** Requires actual modification of the utility function (functional terminality). No "fake" commitments work against perfect simulators.
  2.  **Strategic Gain:** Derived from selecting a $Y$ where $Cost_{threatener}(Harm Y) \gg Cost_{threatener}(Harm X)$.
  3.  **Failure Mode:** If the threatener can harm $Y$ as easily as $X$ (e.g., if $Y$ is just another resource they control), the surrogate goal fails and you have simply added a new vulnerability.

  The "trick" isn't avoiding the hook; it's moving the hook to a place where the threatener cannot reach it without cutting off their own arm. Most writeups gloss over this because selecting such a $Y$ is extremely difficult in practice (the "search problem" for safe surrogates), which is likely why you feel the mechanism is hand-waved. It is hand-waved because the *selection criteria* for $Y$ are the hard part, not the decision theory itself.
