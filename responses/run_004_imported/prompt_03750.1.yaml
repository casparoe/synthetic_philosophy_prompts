answer: |-
  The debate over your dead basil plant touches on one of the thorniest problems in metaphysics: causation by omission. Your friend argues that absences are "nothings," and nothing cannot cause something. You argue that the lack of water clearly killed the plant. To settle this: **Omissions are genuine causes.** Your friend is relying on an outdated, purely mechanical view of causation that fails to capture how dependency works in the real world.

  Your friend's position is known as the "physicalist" view. It holds that causation requires a physical connection or energy transfer—a push, a pull, a chemical reaction. Since "not watering" involves no energy transfer, it cannot be a cause. On this view, the cause of the basil's death was purely internal: physiological dehydration. The housesitter's inaction is merely the background context. While this preserves a tidy, objective physics of causation, it is useless for explaining almost anything in human life, biology, or history. If omissions aren't causes, then suffocation (absence of air) doesn't kill, starvation (absence of food) doesn't weaken, and neglect isn't a mechanism of harm. This contradicts both common sense and scientific practice.

  A more robust theory defines causation through **counterfactual dependence**. Something is a cause if, had it not occurred, the effect would not have happened. Had the housesitter watered the basil, it would be alive. Therefore, the omission caused the death. This captures the intuitive link you feel. However, this invites your friend's second objection: the problem of overgeneration. If absence of water causes death, then the absence of *everyone's* water caused it. Why isn't the mailman responsible?

  This is where the verdict requires precision. Omissions are genuine causes, but causation is inherently **contrastive and contextual**. We do not ask "Did X cause Y?" in a vacuum; we ask "Did X rather than X* cause Y rather than Y*?" In the case of the basil, the relevant contrast is between the housesitter watering it versus not watering it, compared to the normal expected course of events. The mailman is excluded not because his absence didn't physically matter (in a counterfactual sense, yes, if he had watered it, the plant would live), but because he falls outside the relevant causal model.

  This addresses your worry about social norms. You feared that invoking "duty" or "expectation" makes causation subjective. It does not. It makes *causal selection* pragmatic, while the underlying dependency remains objective. The physical reality is that the plant depended on water. The social reality determines which agent's failure to provide water counts as the explanatory cause. This isn't a bug; it's a feature. Causation is not just about physical chains; it is about explaining changes in a system. Without the ability to cite omissions as causes, we cannot explain failures, preventions, or deaths resulting from neglect.

  Therefore, your friend is committing a category error by demanding that causes always be "events" in a physicalist sense. Causes are difference-makers. The housesitter's failure to act made the difference between life and death. The normativity doesn't change the physics; it identifies which physical dependency matters for the explanation.

  **Verdict:** You were right. Omissions are genuine causes because causation is fundamentally about counterfactual dependence, not just energy transfer. The housesitter caused the basil to die.
