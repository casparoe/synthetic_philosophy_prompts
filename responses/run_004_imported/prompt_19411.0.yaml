      *   **Kronecker's Algebra:** He did foundational work in algebra (Kronecker-Weber theorem, theory of ideals, though Kummer/Dedekind were more central to ideals). He preferred explicit constructions.

  3.  **Evaluating Kronecker's Likely Reaction:**
      *   *Would the framing matter?* Zorn's Lemma sounds less "mystical" than Cantor's $\aleph$ numbers. It talks about partial orderings and maximal elements. However, mathematically, it *is* the Axiom of Choice.
