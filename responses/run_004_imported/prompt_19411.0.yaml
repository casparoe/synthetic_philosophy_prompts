      *   **Cantor's Set Theory:** Involved completed infinities, transfinite numbers. Kronecker attacked this personally and professionally.
      *   **Zorn's Lemma:** Formulated by Max Zorn in 1935. Kronecker died in 1891. So, it's a hypothetical counterfactual.
