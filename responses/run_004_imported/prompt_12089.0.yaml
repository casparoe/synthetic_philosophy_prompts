  2.  **Character Conception:**
      *   **Benjamin Franklin:** Pragmatic, witty, humble-but-proud, focused on results/utility, believes habits shape character, unapologetic about the social benefits of virtue. He views morality as a craft to be mastered.
      *   **The Kantian Critic:** Rigorous, principled, focused on intent/motive, skeptical of consequences, believes true morality comes from rational duty, not self-interest. Needs to be sharp but not dismissive of Franklin's actual good deeds.

  3.  **Key Arguments to Weave In:**
      *   *Franklin:* Virtue is a habit. Even if you start for the wrong reason (reputation), the action becomes natural. The "checklist" works because it creates awareness. Social utility *is* a form of good.
      *   *Kantian:* Motive matters more than outcome. Acting for reputation is heteronomous (controlled by outside forces), not autonomous. You can't "game" morality. The humility paradox proves the system is flawed.
