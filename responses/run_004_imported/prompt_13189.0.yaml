      *   *Gott (Copernican):* About *temporal duration*. "I am observing phenomenon X at time t." Assumes I am a random moment in the lifespan of X.
      *   *Key Difference:* Gott doesn't need birth rank or total population. It applies to anything with a beginning and end (Wall, play, regime). It predicts future duration based on past duration ($T_{future} \approx T_{past}$).
