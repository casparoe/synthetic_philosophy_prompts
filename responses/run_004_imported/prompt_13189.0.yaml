              2.  Given that someone like me exists, how likely is it to be *me* at this specific rank? (SSA: Lower rank = more likely in small world).
              *   Actually, the cleanest way is the "God's Coin Toss" or "Incubator" model.
              *   Let's try the "Seat in the Theater" analogy.
              *   World S (Small): 10 seats. World L (Large): 1000 seats.
              *   SSA: You are told "You are in seat 5." Seat 5 exists in both. But in World S, 1/10 of people are in seat 5. In World L, 1/1000 are in seat 5. So World S is favored.
              *   SIA: You are told "You are in the theater." (Existence). World L has 1000 chances to create "you," World S has 10. So World L is favored 100:1.
