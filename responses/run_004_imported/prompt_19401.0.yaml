answer: |-
  Hi everyone. For those of you who don't know me, I'm [Sister's Name]'s older sibling. And like most older siblings, my primary job description has historically been to worry about her so she doesn't have to.

  Usually, that involves making sure she wears a coat in the winter or doesn't trust guys named Chad she met on the internet. But lately, my worry has had to level up. Because as many of you know, [Sister's Name] is making a massive change. She is leaving a stable, high-paying career as an actuary to work at a tiny, underfunded nonprofit focused on AI safety.

  To half the people in this room, that sounds like noble altruism. To the other half—mostly my parents and aunts and uncles—it sounds like she's trading a 401(k) for a beanbag chair and a apocalypse.

  And I know there's a specific joke circulating among her friends about this. I've heard it. It's called "Pascal's Mugging."

  For my family's benefit: Pascal was a philosopher, and the joke is basically this: Imagine a guy in an alley tells you, "Give me five dollars, or I will use my magic powers to destroy the universe." The odds he's telling the truth are one in a billion. But since "destroying the universe" is a really, really bad outcome, the math says you should technically give him the five dollars.

  Her friends joke that she's being mugged. That she's handing over her wallet—the career, the security—to a stranger in an alley claiming the sky is falling. They say she's being tricked by big numbers and scary stories.

  I've been thinking about that comparison for weeks. And I want to say something to both sides of this room about it.

  To her friends, the rationalists and the effective altruists: You're right to check the math. Skepticism is good. Expected value is real. But there is a flaw in the mugging analogy. A mugger is a stranger asking for money for himself. [Sister's Name] isn't paying a stranger. She is investing in herself. She isn't handing over her wallet because she was threatened; she's opening it because she cares.

  And to my family, who are wondering if she's joined a cult: I have news for you. She was an *actuary*. Her entire previous life was built on calculating risk better than anyone else in the room. She knows what a safe bet looks like. She knows what stability looks like.

  If anyone on earth is qualified to decide that a risk is worth taking, it is a woman who spent her twenties pricing out disaster for a living. She isn't doing this because she's bad at math. She's doing this because she looked at the numbers, looked at the world, and decided that the "safe" path wasn't actually safe enough for her conscience.

  I know she's taking a pay cut. I know she's taking a risk. But I also know that [Sister's Name] has never been the kind of person who can sleep soundly if she thinks she could have done more. If she stayed in that actuarial job, she'd be rich, yes. But she'd be looking over her shoulder, wondering "what if?"

  We live in a world that rewards cynicism. It is very easy to sit back and say, "The odds are low, the problem is too big, let someone else fix it." It is much harder to stand up and say, "The odds might be low, but the stakes are high, and I am going to try."

  So, is it Pascal's Mugging? Maybe. Or maybe it's just courage.

  To her friends: Promise me you'll look out for her. Make sure she eats, and sleeps, and remembers that saving the world is a marathon, not a sprint.
  To my family: Promise me you'll trust her. She is not throwing her life away. She is spending it on something she believes matters. And she has us. We are her safety net. If this doesn't work out, she has a home to come back to. She is not alone in that alley.

  [Sister's Name], you have always been the brave one. I'm just the one who worries. But today, I'm mostly just proud.

  Can everyone please raise a glass?

  To [Sister's Name]. May the odds be ever in your favor, but even if they aren't, may you never regret having tried.

  Cheers.
