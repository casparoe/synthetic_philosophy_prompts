answer: |-
  **MEMORANDUM**

  **TO:** The Board, National Food Standards Authority
  **FROM:** Technical Advisory Panel on Labeling Standards
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Use of the Term "Milk" on Plant-Based Beverages

  **1. Recommendation**

  The Technical Advisory Panel recommends that the Authority adopt **Option 2**: Restrict the standalone term "milk" to products derived from the lacteal secretion of mammals. Plant-based beverages should be labeled using alternative terms such as "drink," "beverage," or "base" (e.g., "Oat Drink," "Soy Beverage"), potentially accompanied by a voluntary descriptor of the plant source.

  This recommendation prioritizes biological origin over functional similarity in defining standard of identity. While we acknowledge the linguistic history of plant-based "milks," we conclude that the term "milk" denotes a specific biological process that plant emulsions do not undergo. Preserving this distinction ensures that labeling reflects the material reality of the product's production and composition, rather than merely its culinary application.

  **2. Analysis of the Core Definitional Question**

  The central difficulty in this dispute, as raised during our deliberations, is whether "milk" names a specific biological substance or a functional category of white, opaque liquids. A panelist noted that cow's, goat's, and human milk differ substantially in macronutrient profiles, suggesting "milk" may not name a precise chemical substance in the way water ($H_2O$) does. This observation invites two interpretations: either the term is too vague to regulate scientifically, or its definition rests on origin rather than composition.

  We conclude the latter. The variance in fat and protein content among mammalian milks is variance *within* a category, not evidence that the category lacks a boundary. All mammalian milk shares a singular, defining ontological characteristic: it is a biological secretion produced by a mammary gland for the nourishment of young. This is a fact of nature, independent of human convention.

  The biochemist's analogy to water is instructive. Tap water, spring water, and desalinated seawater differ in mineral content and trace impurities, yet all are classified as water because they share the fundamental chemical structure $H_2O$ derived from the hydrological cycle. Similarly, while goat milk differs from cow milk in composition, both share the fundamental "structure" of being mammary secretions. Plant-based beverages, by contrast, are mechanical emulsions of macerated seeds, nuts, or grains. They are not secreted; they are extracted. To classify a soy emulsion as "milk" is not to expand an existing category, but to conflate two distinct modes of production (lactation vs. milling) that happen to yield visually similar results.

  Therefore, restricting the term is not an attempt to freeze language in time, but to ensure that regulatory definitions align with the material provenance of the food. If the Authority accepts that consumers have a right to know not just what a product *does* (pours on cereal), but what a product *is* (mammary secretion vs. grain emulsion), then the label must reflect that distinction.

  **3. Consideration of the Counter-Argument**

  We have carefully considered the argument presented by the plant-based industry, which advocates for **Option 1** (preserving current permissive labeling). Their position is not merely commercial but linguistic and historical. They argue that language is democratic, defined by usage rather than biological taxonomy. In this view, "milk" has already drifted toward a functional sense—a white, opaque liquid used in cooking and drinking—and regulating it otherwise is an artificial constraint imposed by legacy industries.

  Proponents of this view rightly point out that terms like "coconut milk" and "milk of magnesia" have coexisted with dairy milk for over a century without demonstrable public confusion. No consumer believes a coconut possesses mammary glands, nor do they ingest magnesium hydroxide expecting dairy nutrition. The plant-based industry argues that context clarifies meaning: a carton labeled "Oat Milk" situated in a refrigerated section alongside soy and almond products signals its nature clearly enough. They contend that restricting the term now is protectionism dressed up as precision, designed to disadvantage innovative competitors by severing their linguistic link to a familiar product category, thereby increasing marketing costs and reducing consumer adoption.

  This is a formidable argument. It correctly identifies that language evolves through metaphor and utility, not just scientific taxonomy. If the primary goal of labeling were solely to prevent active deception, and if surveys showed consumers understand "Oat Milk" is not from a cow, the restriction would be difficult to justify.

  **4. Justification for Restriction**

  Despite the strength of the linguistic argument, we find that the biological distinction is material in a way that "coconut milk" is not.

  First, the "coconut milk" precedent is a lexicalized exception, not a rule for new product categories. "Coconut milk" entered the lexicon as a loan translation from Southeast Asian languages prior to modern industrial labeling standards. It is a historical artifact. Regulatory standards, however, must govern the future, not merely codify the past. Allowing historical anomalies to dictate new standards prevents the Authority from establishing clarity for emerging industries.

  Second, the nutritional divergence between mammalian milk and plant emulsions is significant enough to warrant terminological separation. Mammalian milk contains a complete protein profile and specific bioactive factors inherent to lactation. Plant beverages are inherently protein-incomplete (unless fortified) and lack the biological framework of dairy. While fortification can mimic the nutrient *numbers*, it cannot replicate the nutrient *matrix*. When a consumer pours "milk," they have a baseline expectation of that matrix. By reserving the term for the biological substance, we preserve a shorthand for that nutritional profile.

  Finally, we return to the biochemist's point on origin. It is not "up to us what water is made of." Similarly, it is not up to marketing departments to decide what milk is made of. While usage drifts, the physical reality of the supply chain does not. A regulatory authority's duty is to anchor labeling in that physical reality to prevent the erosion of standards. If "milk" becomes purely functional, any white liquid could theoretically qualify, severing the link between the label and the agricultural system that produced it.

  **5. Implementation**

  We recommend a transition period of 18 months to allow manufacturers to update packaging. The Authority should permit the use of the plant source as the primary identifier (e.g., "Oat Drink") without requiring the word "milk" to be entirely banned from the package text, provided it is qualified (e.g., "This is not dairy milk"). However, the Product Name on the Principal Display Panel must not utilize "Milk" as the standalone noun.

  **6. Conclusion**

  The Panel recognizes that language is fluid, but food standards must be anchored. The variance in animal milk composition does not negate the biological unity of the category. By restricting "milk" to mammalian secretions, we honor the material reality of the product over the convenience of the metaphor. This ensures that the standard of identity remains a statement of fact, not merely a matter of marketing.

  **Signed,**

  *Technical Advisory Panel on Labeling Standards*
