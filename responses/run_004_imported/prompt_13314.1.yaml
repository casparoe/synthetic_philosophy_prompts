answer: |-
  Arthur comes home three hours late. His wife is waiting in the dark.

  "Where were you?" she asks.

  "The office," Arthur says.

  "I called the office," she replies. "You violated the Maxim of Quality."

  "No," Arthur corrects, loosening his tie. "I *flouted* it. I expected you to realize that I wouldn't be at the office this late, thereby inviting you to infer that I needed some space."

  "But I believed you," she says. "Until I checked your credit card statement."

  "Ah," Arthur says. "Then the implicature was simply... delayed."

  "Arthur, Grice is clear. For it to be a flout, the breach must be overt. The hearer has to see you breaking the rule to work out the meaning."

  "I was aiming for a subtle breach."

  "There's no such thing," she says. "If the breach isn't manifest, it's not a flout. It's a violation."

  "So what do you call it when I intend a flout, but you miss it?"

  "A lie," she says. "And if you have to explain that you were flouting, you've cancelled the implicature. All you're left with is a false statement and a Maxim of Manner violation for being obscure."

  Arthur sighs. "I suppose I'm just guilty of a covert flout."

  "There's no such thing as a covert flout, Arthur. That's just a lie with a bibliography."
