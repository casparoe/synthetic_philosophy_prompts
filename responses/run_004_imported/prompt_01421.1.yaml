      *   *Actually, let's look at T.M. Scanlon.* Scanlon's Principle F (from *What We Owe to Each Other*) is the modern heavyweight counter to Rawls. It grounds it in expectations and assurance, but specifically *interpersonal* assurance, not social practice.
      *   *Decision:* I will argue for the **Interpersonal Assurance/Expectation View (Scanlon-esque)**. Why? Because Rawls's "Practice" view makes the obligation external (social institution). The Deathbed case shows the obligation is internal (between A and B). The binding work is done by the **deliberate creation of expectations and the invocation of a duty of fidelity between specific agents**, not the maintenance of a social institution. This directly counters the "logically prior" claim by showing the normative core exists in the dyad, not the macro-structure.

      *   *Re-evaluating:* The prompt asks to engage with "logically prior." The Will Theory (Hart/Raz) is the direct antagonist to Rawls on "logical priority." Rawls says: Practice -> Act. Will Theory says: Capacity to Obligate -> Act -> (Practice as useful convention).
      *   *Let's go with the Normative Power (Will Theory) approach.* It's cleaner for a graduate seminar critique of Rawls 1955. It asserts that the capacity to bind oneself is a fundamental moral power, not a derivative of social utility.

  6.  **Drafting the Argument:**
      *   **Introduction:** Acknowledge Rawls's sophistication. State the thesis: The deathbed case reveals a fissure between the *definition* of promising and the *source of its normativity*. Rawls's "logical priority" conflates constitutive rules with normative grounds.
      *   **Body Paragraph 1: The Logical Priority Trap.** Rawls argues you can't make a move without the game. True for *meaning*, not for *bindingness*. In the secret case, the "game" (social institution) is not at stake. If the obligation remains, the source must be elsewhere.
      *   **Body Paragraph 2: The Free-Rider/Utility Gap.** Rawls justifies the practice utilitarianly. In the secret case, breaking the promise doesn't harm the utility. If the obligation were truly derived from the practice's utility, it should dissolve. It doesn't. Therefore, the practice is not the ground.
      *   **Body Paragraph 3: The Alternative (Normative Power).** The binding force comes from the exercise of a moral power to alter normative relations. The practice is merely the *signal*, not the *source*.
      *   **Conclusion:** Summarize. The practice is epistemically useful (we know how to promise), but not ontologically prior (the obligation doesn't come from it).

  7.  **Refining the Tone:**
