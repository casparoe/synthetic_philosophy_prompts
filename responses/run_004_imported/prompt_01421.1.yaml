answer: |-
  Here is an argument you can use to press your students (and perhaps refine your own view) on why Rawls's practice conception ultimately fails to account for the deathbed promise, and what actually does the normative work in its place.

  ***

  ### The Limits of Logical Priority: Why the Practice Conception Fails the Deathbed Test

  Rawls's 1955 argument is a masterpiece of mid-century analytic philosophy, largely because it successfully dismantles the "summary conception" of rules (the idea that rules are just heuristics for act-utilitarian calculations). His insistence that practices are "logically prior" to particular cases is compelling when applied to institutions like baseball or criminal law. You cannot be "out" at third base without the institution of baseball; the status is conferred by the rules. Rawls argues promising is identical: the obligation is a status conferred by the social practice of promising.

  However, the deathbed promise (or the "desert island" case) exposes a category error in Rawls's reasoning. It reveals that while the *convention* of promising may be logically prior to the *label* "promise," the **obligation** itself is not derived from the convention. Rawls's defense against Ross—that the promisor lacks the "standing" to weigh consequences because the practice forbids it—is question-begging in the limit case. Here is why the practice conception collapses here, and why we should locate the binding force in a **practice-independent normative power** instead.

  #### 1. Semantic Intelligibility vs. Normative Force
  Rawls's "logical priority" claim conflates two distinct things: the conditions for *describing* an act as a promise, and the conditions for *being bound* by that act.

  It is true that to intelligibly say "I promise," one must invoke a shared social convention (much like saying "I bet" requires a convention of wagering). In this thin, semantic sense, the practice is prior. But Rawls needs more than this. He needs the practice to be the *source of the obligation*. He argues that the duty to keep the promise is derived from the utility of the practice as a whole.

  In the deathbed case, the semantic convention is present (the son says "I promise"), but the *social utility* of the practice is absent. No one else knows; general reliance on the institution of promising is unaffected by the breach; the son's reputation remains intact. If the obligation were truly grounded in the practice (as Rawls claims), and the practice is justified by its social utility (as Rawls claims), then the obligation should attenuate or vanish when the social utility is removed.

  The fact that the obligation feels undiminished in the secret case suggests that the "logical priority" of the practice applies only to the *form* of the transaction, not its *normative weight*. Rawls's reply—that the son simply isn't allowed to calculate consequences—fails because it offers no reason *why* the rule binds him when the rationale for the rule (social coordination/trust) is not in play. It amounts to saying, "You must follow the rule because it is a rule," which is the very rule-worship Rawls sought to avoid in his critique of utilitarianism.

  #### 2. The "Free Rider" Problem for Practice Theory
  In standard practice cases, I keep my promise because if everyone opted out when it suited them, the practice would collapse. I am bound by a duty of fair play to the other participants in the practice.

  But in the deathbed case, I am not a free rider on a social scheme. My breaking the promise does not take advantage of others' restraint, nor does it weaken the institution. If the binding force were truly located in my participation in a social practice, I would be morally free to break the promise in this specific instance without violating the "spirit" of the practice, because the practice's interests are not at stake.

  Rawls tries to block this by saying the definition of the act *includes* the obligation. But this is circular. It defines the problem away rather than solving it. It asserts that "promising" *means* "binding oneself regardless of consequences," but it fails to explain *why* a rational agent is bound by that definition when the social costs of redefining it for this specific case are zero. The persistence of the obligation in the absence of social stakes proves that the obligation is not tethered to the social practice's health.

  #### 3. The Alternative: Normative Power (The Will Theory)
  If the social practice isn't doing the binding work, what is? We should reject the idea that the practice creates the obligation and instead adopt a version of the **Will Theory (Normative Power view)**.

  On this view, the capacity to bind oneself is a fundamental moral power inherent in moral agency, not a privilege granted by a social institution. When I promise, I am not invoking a social rule that then binds me; I am exercising a normative power to alter the moral landscape between myself and another person. I am voluntarily transferring a "right" to my future conduct to the promisee.

  This explains the deathbed case perfectly:
  1.  **Practice-Independence:** The power to obligate oneself does not depend on the social utility of the institution. It depends on the autonomy of the agent and the moral claim of the promisee.
  2.  **The Role of the Practice:** The social practice of promising is not the *source* of the obligation; it is merely the **signaling mechanism**. We use the convention ("I promise") because it is a clear, public way to indicate that I am exercising this normative power. But the convention is evidentiary, not constitutive of the duty.
  3.  **Why it Binds:** It binds not because "the rules of the game say so," but because I have invoked a moral power to restrict my own future liberty for the sake of another's claim. To break the promise is not to cheat a system; it is to violate a right I voluntarily created in another person.

  #### Conclusion for the Seminar
  Rawls is right that we need a convention to *communicate* the promise reliably. But he is wrong that the convention *creates* the duty. The deathbed promise shows that the duty survives the absence of the social stakes that justify the convention. Therefore, the practice cannot be "logically prior" to the obligation in the strong sense Rawls requires.

  The binding work is done by the **exercise of a normative power**. The practice is just the language we speak to exercise it. In the deathbed case, the language is spoken, the power is exercised, and the obligation is incurred—even if the rest of the world never knows the game was played. This preserves the stringency of the obligation without relying on the fragile scaffolding of social utility that Rawls leans on.
