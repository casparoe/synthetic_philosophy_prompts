      *   **Rawls's Position:** Practice conception of promising. Practices are logically prior to particular cases (like baseball). Once the practice is justified (utilitarianly), individual acts are governed by the rules, not case-by-case utilitarianism.
      *   **The Problem:** The "Deathbed Promise" / "Desert Island" objection (originally from W.D. Ross, discussed by Rawls). If a promise is secret, breaking it doesn't harm the practice (no loss of trust in the institution). Yet, we still feel obligated.
      *   **Rawls's Defense:** The distinction between justifying the practice and justifying the act. The promisor isn't allowed to weigh consequences; the rule binds them regardless of secrecy.
      *   **My Task:** Argue that Rawls's defense *fails*. Show why the "logically prior" move doesn't rescue the practice theory in these specific cases.
      *   **Alternative:** Commit to *one* alternative explanation for the binding force (e.g., expectations, trust, normative power, etc.).
      *   **Tone:** Academic, rigorous, suitable for a graduate seminar context (engaging with the logic, not just intuitions).

  2.  **Deconstruct Rawls's Argument:**
      *   *Premise 1:* Promising is a social practice defined by constitutive rules.
      *   *Premise 2:* The practice is justified by its general utility (social coordination, reliance).
      *   *Premise 3:* Individual acts are defined by the practice. You can't "promise" outside the practice.
      *   *Premise 4:* Therefore, the obligation to keep a specific promise derives from the rule of the practice ("promises must be kept"), not the specific consequences of that act.
      *   *Response to Ross:* Even in secret cases, the agent is playing the game. The rule applies. To ask "why keep it if no one knows?" is to ask for a utilitarian justification of the *act*, which the practice forbids.

  3.  **Identify the Weakness (The "Logical Priority" Flaw):**
      *   Rawls claims the practice is *logically prior*. This means the concept of "promising" *depends* on the existence of the social institution.
      *   *Counter-argument:* In the deathbed/secret case, the *social utility* of the practice drops out (no one else knows, so general trust isn't affected). If the obligation persists despite the absence of the *social* conditions that justify the practice, then the obligation cannot be *derived* from the practice's social utility.
      *   *The "Free Rider" Problem:* If the only reason to keep the promise is "I'm participating in a useful practice," but my breaking it doesn't harm the practice, I am effectively a free rider. Rawls says "No, the rule forbids it." But *why* does the rule bind me here? Usually, rules bind because of the cooperative scheme. If the cooperative scheme isn't at stake (secret case), the binding force of the *practice* theory evaporates.
      *   *Logical Priority vs. Normative Force:* Rawls conflates the *definition* of the act with the *source of the obligation*. Even if we agree you need a practice to *make* a promise (conceptual point), it doesn't follow that the practice is what *makes it binding* (normative point) in every instance.
      *   *The "Hollow Shell" Argument:* In the secret case, the practice is present only as a hollow shell. The social reinforcement, the reliance of the community, the institutional stability—none of that is in play. If the obligation remains robust while the social machinery is absent, the machinery isn't the engine.

  4.  **Develop the Critique (Step-by-Step):**
      *   *Point 1: The Gap between Definition and Obligation.* Rawls shows practices define the *act-type*. He doesn't successfully show they generate the *obligation-token* in isolation.
      *   *Point 2: The Secret Case Eliminates the Rationale.* The practice is justified by general utility (coordination/reliance). In the secret case, breaking the promise has zero impact on general reliance. If the obligation is grounded in the practice's utility, the obligation should vanish (or weaken) when the utility vanishes. It doesn't.
      *   *Point 3: The "Internal Point of View" isn't enough.* Rawls might say the promisor accepts the rules. But why accept them in a case where the social good isn't served? If the answer is "because it's the rule," we are back to rule worship unless there's a deeper reason *why* the rule binds interpersonally.

  5.  **Select the Alternative:**
      *   *Options:* Expectations (utilitarian-ish), Trust (relational), Normative Power (Will Theory).
      *   *Selection:* **The Normative Power / Will Theory (modified).**
      *   *Reasoning:* Expectations are too fragile (what if I don't expect you to keep it?). Trust is good but vague. The Will Theory (Hart, Raz) fits best against Rawls. It argues that the *act of promising itself* is an exercise of a moral power to change one's normative status.
      *   *Refinement:* Let's go with **Interpersonal Normative Power (The "Obligation-Incuring Act" view).** This directly challenges Rawls's "Practice First" claim. It argues the *individual act* creates the obligation, and the practice is just a convention to signal the exercise of that power, not the source of the power itself.
