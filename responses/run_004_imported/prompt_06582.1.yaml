prompt: |-
  I am taking a seminar on the semantics of vagueness this term, and I also sit on my college's Honor Council, which is deciding a 'patchwriting' case: an essay that mirrors a source's structure and sequence of claims almost sentence by sentence — the wording changed throughout — with no citation attached to those paragraphs, though the source is cited elsewhere in the essay. Our code bars presenting 'the language or ideas of another as one's own without adequate attribution,' but says nothing about how much reworking defeats that description, and the case genuinely sits on the line. Half the Council wants to rule on its best guess at the underlying fact; the other half thinks there is no underlying fact to guess at, only a decision to make, which is essentially the disagreement between epistemicism and supervaluationism from seminar. Please draft the memo I will circulate before the vote: recommend whether the student is responsible and, if so, what sanction; propose a standing rule for future borderline patchwriting cases; and be honest about what the Council would be giving up, whichever of the two views of vagueness it ends up leaning on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a student taking a seminar on the semantics of vagueness and sits on their college's Honor Council.
      *   **Case:** A "patchwriting" case. An essay mirrors a source's structure/sequence of claims sentence-by-sentence. Wording is changed throughout. No citation attached to those specific paragraphs (though the source is cited elsewhere).
      *   **Honor Code:** Bars presenting "the language or ideas of another as one's own without adequate attribution." Silent on *how much* reworking defeats this description.
      *   **Council Disagreement:** Half want to rule on the "underlying fact" (Epistemicism: there *is* a fact of the matter, we just need to find it). Half think there is no underlying fact, only a decision to make (Supervaluationism: truth is determined by precisifications/decisions within the penumbra).
      *   **Task:** Draft a memo to circulate before the vote.
      *   **Requirements:**
          1.  Recommend verdict (responsible/not) and sanction (if applicable).
          2.  Propose a standing rule for future borderline patchwriting cases.
          3.  Be honest about what the Council gives up by leaning towards either view of vagueness (Epistemicism vs. Supervaluationism).
      *   **Tone:** Professional, philosophical yet practical, persuasive, suitable for an Honor Council context.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Epistemicism:** Vagueness is ignorance. There is a sharp boundary between "plagiarism" and "not plagiarism," we just don't know exactly where it is. In this context, the Council's job is to *discover* whether this specific case falls on the guilty side of that hidden line.
      *   **Supervaluationism:** Vagueness is indeterminacy. There is no sharp boundary. A statement is "supertrue" only if it's true on all admissible precisifications. In this context, the Council's job is to *precisify* the code (make a decision that creates the boundary) for this case and future ones.
      *   **The Tension:** Epistemicism implies fairness requires finding the "truth." Supervaluationism implies fairness requires making a consistent policy choice because the "truth" doesn't exist yet.

  3.  **Determine the Recommendation (Verdict & Sanction):**
      *   *Case Details:* Structure/sequence mirrored sentence-by-sentence. Wording changed. No citation in those paragraphs.
      *   *Analysis:* This is classic patchwriting. Even if words are changed, the intellectual structure is stolen. Most academic integrity policies consider this plagiarism.
      *   *Verdict:* Responsible.
      *   *Sanction:* Needs to be educational but serious. Not expulsion (usually), but a failing grade on the assignment or course, plus an educational module. Let's suggest a failing grade on the assignment and a mandatory workshop.
      *   *Why?* It aligns with the "spirit" of the code even if the "letter" is vague.

  4.  **Drafting the Standing Rule:**
      *   Need to clarify "adequate attribution" regarding structure/ideas, not just words.
      *   Need to address the "how much reworking" question.
      *   *Proposal:* Attribution is required for distinct structural sequences and chains of reasoning, regardless of paraphrasing, unless the material is common knowledge.

  5.  **Addressing the Philosophical Trade-off (The Core Challenge):**
      *   This is the most unique part of the prompt. I need to explain the cost of each approach without using overly dense jargon, but acknowledging the user's seminar knowledge.
      *   *If we choose Epistemicism (Fact-finding):* We claim there is a right answer. *Cost:* We risk arbitrariness. If we can't agree on where the line is, claiming there *is* a line looks like we are just guessing and calling it truth. It creates false certainty.
      *   *If we choose Supervaluationism (Decision-making):* We admit we are setting the standard. *Cost:* We lose the comfort of "just applying the rules." We accept responsibility for *making* the law, which might feel like retroactive punishment to the student (ex post facto). It requires us to be explicit about our legislative power.

  6.  **Structuring the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Introduction:** Acknowledge the difficulty and the philosophical parallel (subtly).
      *   **Case Analysis & Recommendation:** Verdict and Sanction.
      *   **Proposed Standing Rule:** Concrete guidance for the future.
      *   **Philosophical Framework (The "Vagueness" Section):** Explicitly address the Epistemicism vs. Supervaluationism split and the costs associated with each.
      *   **Conclusion:** Call to action.

  7.  **Refining the Tone:**
      *   Must sound like a peer/student leader, not a professor.
      *   Must be respectful of the Council's split.
      *   Must bridge the gap between high-level semantics and practical disciplinary action.

  8.  **Self-Correction/Iterative Drafting:**
      *   *Critique:* Is the philosophical section too academic?
      *   *Fix:* Keep the terms (Epistemicism/Supervaluationism) since the user is in the seminar, but explain their practical implications for the Council clearly.
      *   *Critique:* Is the verdict too harsh?
      *   *Fix:* Ensure the sanction allows for learning. Patchwriting is often unintentional poor citation practice rather than malicious theft.
      *   *Critique:* Did I answer the prompt about "what the Council would be giving up"?
      *   *Fix:* Make sure that section is distinct and highlights the trade-off (Certainty vs. Honesty/Authority).

  9.  **Final Polish:** Check against the Honor Code language provided ("language or ideas... without adequate attribution"). Ensure the recommendation fits that text. (Mirroring structure counts as "ideas").

  **(Self-Correction Note):** I need to make sure I don't sound *too* much like I'm teaching the seminar. The memo is for the Council, some of whom may not know these terms. I should define them briefly in context or use them as the user requested (since they are using these terms in the prompt description of the Council's split). The prompt says "which is essentially the disagreement between epistemicism and supervaluationism from seminar." I should probably use those terms in the memo since the user wants to circulate it, implying the Council might be open to this framing, or at least the user wants to express it. *Wait, re-reading:* "Half the Council wants to rule on its best guess... other half thinks there is no underlying fact." The prompt asks me to draft the memo *I* (the user) will circulate. I should probably use the terminology if it helps clarify, but keep it accessible. Actually, since the user is in the seminar, they might want to signal this insight. I will use the terms but ground them in practical council work.

  *Decision:* I will use the terms but explain their practical consequence. It shows intellectual leadership.

  10. **Final Review against constraints:**
