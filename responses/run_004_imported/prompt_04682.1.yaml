answer: |-
  **Chapter Draft: The Resurrection of the Dilemma — Robust Flickers in New Wave Frankfurt Cases**

  **1. Introduction: The Premature Obituary of PAP**

  The consensus in contemporary moral responsibility literature is that the Principle of Alternative Possibilities (PAP) has been decisively refuted by Frankfurt-style counterexamples (FSCs). Following Harry Frankfurt's original 1969 intervention, the dialectic shifted from defending PAP to refining FSCs. When Robert Kane and David Widerker formulated the "Dilemma Defense"—arguing that FSCs either presuppose determinism (begging the question against libertarians) or leave open alternative possibilities (preserving PAP)—proponents of the Frankfurt strategy responded with "New Wave" cases. Cases proposed by Mele and Robb, David Hunt, and Derk Pereboom were designed to circumvent the dilemma by eliminating the "prior sign" that triggers the counterfactual intervener.

  The prevailing view is that these New Wave cases successfully rehabilitate the Frankfurt strategy, rendering the Dilemma Defense obsolete. This chapter challenges that consensus. I argue that the Dilemma Defense's underlying insight remains intact: moral responsibility of the basic desert variety requires a robust alternative possibility. While New Wave cases successfully hide alternative possibilities (APs) more effectively than classic FSCs, they do not eliminate them. More importantly, contra John Martin Fischer's influential "robustness" objection, the surviving APs in these cases are not mere "flickers of freedom." They are *robust* in the specific sense required to ground basic desert because they mark the distinction between *agent-sourcehood* and *deterministic bypass*. By demonstrating that a robust AP survives in the cases of Mele and Robb, Hunt, and Pereboom, I vindicate the core intuition of the Dilemma Defense: one cannot be morally responsible unless one possesses the power to render the determining mechanism idle.

  **2. Redefining Robustness: Sourcehood vs. Regulation**

  To argue that the surviving APs in New Wave cases are sufficient to save PAP, we must engage Fischer's technical criterion of "robustness." Fischer concedes that FSCs may leave behind "flickers" of freedom (e.g., the possibility of beginning to choose otherwise before being interrupted). However, he argues these flickers are not *robust* because they are not *explanatorily relevant* to the agent's moral responsibility. For Fischer, an AP is robust only if it helps explain *why* the agent is responsible in the actual sequence. Since the intervener does not act in the actual sequence, the fact that the agent *could* have triggered the intervener seems irrelevant to their blameworthiness for the actual action.

  This definition of robustness, however, is biased toward a semi-compatibilist framework that prioritizes *guidance control* over *regulative control*. For the libertarian defending PAP, the explanatory relevance of an AP lies not in the *consequences* of the alternative (i.e., whether the intervener acts), but in the *source* of the action. An AP is robust if its existence guarantees that the agent, rather than an external mechanism, is the ultimate source of the action.

  Therefore, I propose a revised criterion for this defense: **An alternative possibility is robust if it represents the agent's capacity to determine whether the actual sequence is *self-determined* or *externally determined*.** If the agent retains the power to make the counterfactual intervener (or deterministic backup) causally irrelevant, that power constitutes a robust AP sufficient for PAP. With this criterion established, we can examine the New Wave cases.

  **3. Mele and Robb: The Sourcehood Flicker**

  Alfred Mele and David Robb (1998) construct a case intended to avoid the Dilemma Defense by removing the prior sign. In their scenario, an agent Bob deliberates about stealing a car. There are two processes:
  1.  **Process P1 (Indeterministic):** Bob's own deliberation, which is indeterministically caused and could fail to produce a decision.
  2.  **Process P2 (Deterministic):** A backup process implanted by neuroscientists that will deterministically cause Bob to decide to steal if P1 does not produce a decision by time *t*.

  In the actual sequence, P1 succeeds, and Bob decides to steal. P2 remains idle. Mele and Robb argue Bob is responsible despite the presence of P2, and since P2 is deterministic, there is no question-begging assumption of determinism in the actual sequence.

  **The Defense:**
  The Dilemma Defense resurfaces here through the nature of P1. For Bob to be responsible in the actual sequence, P1 must be the *cause* of his decision. If P1 is genuinely indeterministic, then at any moment prior to the decision, it was possible that P1 would *fail*. If P1 fails, P2 succeeds.
  The surviving AP is not merely "Bob could have not stolen." The AP is: **"Bob could have failed to initiate the decision via his own indeterministic deliberation."**

  Is this robust? Under Fischer's view, perhaps not, because Bob is blameworthy regardless of which process causes the theft. However, under a source-incompatibilist view (which PAP protects), the *mode* of causation is essential to responsibility.
  *   **Sequence A (Actual):** Bob decides via P1 (Agent-Source).
  *   **Sequence B (Alternative):** Bob decides via P2 (Device-Source).

  The alternative possibility is the possibility of *losing sourcehood*. The robustness lies in the fact that Bob's responsibility in the actual sequence is contingent upon his success in P1. If Bob lacks the ability to fail in P1 (i.e., if P1 is causally sufficient), we are back on Horn 1 of the Dilemma (determinism). If P1 is not causally sufficient, Bob has the power to *not* be the source of the action in the specific way required for responsibility. Thus, the AP explains *why* he is responsible: he is responsible *because* he succeeded in P1 where he could have failed, thereby securing his status as the source. The flicker is the difference between being an agent and being a vessel. That is explanatorily relevant to desert.

  **4. Hunt: The Volitional Flicker**

  David Hunt (2000) proposes a "blockage" case to avoid the dilemma entirely. Instead of a counterfactual intervener who watches for a sign, Hunt posits a scenario where all alternative pathways are simply blocked causally, leaving only one physically possible future. There is no intervener waiting to act; the alternative is simply impossible due to the causal structure of the world.

  **The Defense:**
  Hunt's case attempts to eliminate the AP by restricting the *action* space. However, it fails to restrict the *volitional* space. Even if the physical movement of stealing the car is the only physically possible outcome, the agent retains the ability to *will* otherwise, even if that will is causally inefficacious regarding the movement.

  Critics dismiss this as irrelevant: if the will doesn't change the outcome, what does it matter? But for moral responsibility, the *orientation of the will* is often the primary object of assessment.
  *   **Actual Sequence:** Agent wills to steal + Causal blockage ensures stealing.
  *   **Alternative Sequence:** Agent wills to refrain + Causal blockage ensures stealing (perhaps via compulsion).

  If Hunt's case is to work, the agent must be responsible for the theft. But if the agent wills to refrain in the alternative sequence, they are not blameworthy in that sequence (they are a victim of compulsion). The AP here is **"The power to will such that one is not compelled."**

  This is robust because it distinguishes between *acting freely* and *being moved*. If the agent lacks the ability to will otherwise, they are effectively a puppet, even if the strings are causal laws rather than a neuroscientist. The Dilemma Defense insight holds: if the blockage is total (no volitional AP), the agent is not the source (Horn 1). If the blockage allows volitional freedom, the AP remains (Horn 2). The "flicker" of volitional freedom is robust because moral responsibility tracks the will, not just the bodily movement. The agent's responsibility in the actual sequence depends on the fact that their will aligned with the action, which they could have withheld.

  **5. Pereboom: The Prevention Flicker**

  Derk Pereboom's "Tax Evasion IV" (2001, 2014) is widely considered the strongest FSC. Pereboom posits a neural state $N$ that is a *necessary condition* for choosing to evade taxes. $N$ is not causally sufficient for evasion (the agent still chooses), but without $N$, the agent cannot choose evasion. In the actual sequence, the agent chooses evasion, and $N$ is present. In the counterfactual sequence, if the agent were going to choose to pay, $N$ would not occur. Pereboom argues that since $N$ is non-volitional, the agent has no AP regarding $N$, and thus no robust AP regarding the choice.

  **The Defense:**
  Pereboom's case is the most difficult, but it succumbs to a refined version of the "Principle of Possible Prevention." While the agent may not be able to *choose* to prevent $N$ directly (since $N$ is a necessary condition for the choice to evade), the agent retains the power to *choose in such a way that $N$ does not occur*.

  The surviving AP is: **"The power to choose such that the necessary condition for the intervener's relevance does not obtain."**
  In the actual sequence, the agent chooses to evade, and $N$ occurs. In the alternative, the agent chooses to pay, and $N$ does not occur.
  Pereboom argues this is not robust because the *blameworthiness* for evading doesn't depend on the ability to pay. However, this misses the structural point of the Dilemma Defense. The presence of $N$ represents a constraint on the agent's freedom. If $N$ is present, the agent is operating within a constrained subset of possibilities.
  The robustness lies in the **power to render the constraint irrelevant.**
  If the agent *must* have $N$ to evade, but can choose to pay (precluding $N$), then the agent has the power to determine whether they act under the condition $N$ or not.
  *   **Sequence A:** Agent acts + Condition $N$ obtains.
  *   **Sequence B:** Agent acts + Condition $N$ does not obtain.

  Why is this robust? Because Condition $N$ is the marker of the *Frankfurtian setup*. To be responsible in a Frankfurt case, the agent must be able to show that the setup did not *make* them do it. The only way to show this is to have the ability to act in a way that makes the setup idle. In Pereboom's case, choosing to pay makes the neural necessity idle.
  If the agent lacks this AP (i.e., if $N$ is necessary for *any* choice, or if the agent is determined to choose evasion), we are back to determinism (Horn 1). If the agent has the AP to choose to pay, PAP holds (Horn 2). The flicker is robust because it is the **power of prevention.** An agent who can prevent the condition that makes their action determined (or monitored) retains the regulative control necessary for basic desert. Without this power, the agent is merely a locus where a causal chain unfolds; with it, they are a gatekeeper. Being a gatekeeper is explanatorily relevant to responsibility.

  **6. Synthesis: Why the Flickers Are Robust**

  The common thread across Mele & Robb, Hunt, and Pereboom is that they attempt to sever the link between *responsibility* and *the ability to do otherwise* by making the "otherwise" seem trivial. I have argued that these "otherwise" possibilities are not trivial. They are instances of **Sourcehood Preservation.**

  Fischer's objection relies on the claim that the AP must explain the *degree* of blameworthiness. I contend the AP explains the *existence* of blameworthiness.
  1.  **In Mele & Robb:** The AP explains whether the action stems from the agent's indeterministic deliberation or a deterministic backup. This is the difference between freedom and manipulation.
  2.  **In Hunt:** The AP explains whether the agent's will aligns with the action or is overridden by blockage. This is the difference between agency and automatism.
  3.  **In Pereboom:** The AP explains whether the agent can prevent the necessary conditions for the "intervention" (or causal constraint). This is the difference between being a player and being a piece.

  In all three cases, the surviving AP allows the agent to *validate* their own status as a responsible agent. If the agent lacks these APs, they cannot distinguish themselves from a determined mechanism. Therefore, the AP is explanatorily relevant to the *status* of being a morally responsible agent. It grounds the *kind* of responsibility (basic desert) that incompatibilists care about.

  **7. Conclusion: The Dilemma Endures**

  The New Wave Frankfurt cases were designed to bury the Dilemma Defense. They succeeded in complicating the topology of counterfactuals, but they failed to eliminate the metaphysical requirement for alternative possibilities. By analyzing Mele & Robb, Hunt, and Pereboom through the lens of sourcehood and prevention, we see that a robust alternative possibility survives in each.

  These possibilities are robust because they secure the agent's position as the ultimate source of their action, distinguishing them from a determined system. Consequently, the Dilemma Defense's core insight stands: any case that ensures an agent could not have done otherwise either presupposes determinism (and thus begs the question against the libertarian) or leaves open a robust alternative possibility (and thus preserves PAP). For the dissertation's broader argument, this establishes that PAP remains a viable necessary condition for basic desert moral responsibility, and the Frankfurt strategy has not succeeded in severing the link between freedom and the ability to do otherwise. The literature's treatment of the Dilemma Defense as refuted is premature; it requires not rejection, but refinement.
