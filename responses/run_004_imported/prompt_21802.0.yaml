answer: |-
  The schism that tore through the American antislavery movement in the mid-nineteenth century was not merely a disagreement over tactics, but a fundamental dispute over the nature of law itself. On one side stood William Lloyd Garrison, for whom the Constitution was a moral compact with evil, its silence on the word "slavery" serving not as exoneration but as a conspiratorial euphemism. On the other stood the mature Frederick Douglass, who, influenced by the legal theorist Lysander Spooner, came to view the Constitution as a text that must be judged by its explicit language and stated ends rather than the secret intentions of its drafters. This debate anticipates the modern friction between textualism and originalism, but for Douglass and Garrison, the stakes were not judicial philosophy—they were human lives. To determine whose reading holds more water, we must examine the disputed compromise clauses not through the lens of historical inevitability, but through the mechanics of legal interpretation.

  The Garrisonian position rests on a theory of contextual realism. Garrison argued that a legal document cannot be divorced from the society that birthed it. In 1787, the "Persons" described in the Constitution were understood by all ratifying parties to be enslaved Africans. To Garrison, the absence of the word "slave" was a linguistic sleight of hand designed to spare the new republic the shame of explicitly codifying human chattelhood while simultaneously securing its existence. The strongest version of this argument is functionalist: it does not matter what the text *says*, but what the text *does*. The Three-Fifths Clause increased the political power of slaveholding states; the Fugitive Slave Clause compelled free states to return escapees; the Importation Clause delayed federal interference with the slave trade for twenty years. If the operational result of these clauses was the protection of slavery, then the document was pro-slavery, regardless of its vocabulary. For Garrison, to participate in this government was to be an accomplice; the only moral stance was disunion.

  Douglass's counter-argument, developed fully by 1851, relies on a strict legal formalism. He posited that the Constitution is a public law, and public law must be intelligible on its face. If the framers intended to establish slavery, they had the opportunity to write it into the text. They did not. Instead, the Preamble establishes the goals of "Justice" and "Liberty." Douglass argued that in a legal system predicated on natural rights, restrictions on liberty must be explicit. A "Person held to Service or Labour" could, on a plain reading, refer to an indentured apprentice or a convict—statuses that existed in the North as well as the South. By refusing to name slavery, Douglass contended, the Constitution left it a local institution with no national footing. The federal government, bound by the text, had no authority to recognize property in man because the text recognized no such property. This reading transformed the Constitution from a barrier into a weapon; if the text was antislavery, then the federal government had a duty to abolish slavery to fulfill the Preamble's promise.

  When weighing these positions against the specific compromise clauses, Douglass's textualism proves surprisingly robust regarding the Importation and Apportionment clauses, but falters on the Fugitive Slave Clause. Consider the Importation Clause (Article I, Section 9), which prohibited Congress from banning the "Migration or Importation of such Persons as any of the States now existing shall think proper to admit" until 1808. Garrison read this as an undeniable shield for the transatlantic slave trade. Douglass, however, correctly noted that "Migration" applies to free immigrants and "Importation" is a term generally reserved for goods, not people. While the historical intent was clearly to protect the slave trade, the text itself is ambiguous enough to allow for a reading that protects state immigration policies generally. Similarly, the Three-Fifths Clause (Article I, Section 2) counts "free Persons" and "all other Persons." It does not define "other Persons" as slaves. Douglass argued this was a penalty on states that denied voting rights to any portion of their population, slave or free. While historically this referred to slaves, textually it functions as a penalty for disenfranchisement, aligning with the democratic principles of the Preamble.

  However, the Fugitive Slave Clause (Article IV, Section 2) presents the most significant challenge to the Douglassian reading. The clause mandates the delivery of "Person[s] held to Service or Labour in one State, under the Laws thereof, escaping into another." Here, the Garrisonian critique lands with the most force. The clause explicitly incorporates state law ("under the Laws thereof") to define the status of the person. If a Southern state's law defined a black person as "held to Service" for life based on birth, the Constitution's text commands that status be respected across state lines. Unlike the Importation Clause, which uses ambiguous nouns, the Fugitive Clause creates a procedural mechanism for enforcement that relies entirely on the validity of state slave codes. Douglass argued that because the clause did not specify *who* would adjudicate the claim, free states could require jury trials that would effectively nullify the law. But this is a procedural workaround, not a textual negation. The text acknowledges the existence of persons "held to Service" by state law and mandates their return. To read this as antislavery requires assuming that no state law could legitimately hold a person to service against their will—a moral assumption, not a textual one.

  The strongest objection to the Douglass position, therefore, is the problem of incorporation. Douglass treats the Constitution as a standalone document floating in a vacuum of liberty. But the text itself punctures that vacuum by referencing external state laws. When the Constitution says "under the Laws thereof," it validates whatever legal status those states confer. If a state law says a human being is property, the Constitution's text, in Article IV, instructs other states to treat them as such. To argue otherwise is to argue that the Constitution contradicts its own instructions. This validates the historian's critique that Douglass's later view was, in part, "wishful advocacy dressed up as exegesis." He needed the Constitution to be antislavery to justify political participation, so he read it that way, smoothing over the jagged edges where the text actually touched the institution of slavery.

  Yet, to dismiss Douglass entirely is to accept a theory of law that renders governance impossible. If the Constitution's meaning is fixed solely by the private, unrecorded intentions of the framers, the text becomes a mere suggestion. Douglass's great insight was that for the law to be a tool of justice, it must be capable of growth beyond its origins. The text *does* omit the word "slave." That omission is legally significant because it denies slavery federal legitimacy. It makes slavery a local anomaly rather than a national principle.

  **Verdict**

  Ultimately, the Douglass reading is the more legally rigorous interpretation for the governance of a republic, with one critical exception. On the questions of the Slave Trade and Apportionment, Douglass is correct: the text is ambiguous enough to support antislavery policies, and the silence on the word "slavery" denies the institution federal sanction. In these areas, Garrison's reading relies too heavily on extratextual history to override the plain language. However, on the specific question of the Fugitive Slave Clause, Garrison was right. The text's explicit incorporation of state laws regarding "Service or Labour" provided a constitutional bridge for slavery that textualism cannot easily burn.

  Therefore, the verdict is qualified but decisive: Douglass was right that the Constitution *as a whole* was not a pro-slavery compact, because it established a framework of liberty that could be used to strangle slavery. But Garrison was right that the document contained specific clauses that were morally irredeemable. Douglass's genius was in realizing that a document can be flawed in its parts but redeemable in its whole. He chose to wield the general principles of the text against the specific compromises, a strategy that proved historically effective where Garrison's moral purity would have yielded only isolation. The Constitution was not an "agreement with hell," but it did contain a lease on hell that Douglass rightly sought to foreclose.
