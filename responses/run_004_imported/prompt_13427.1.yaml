answer: |-
  This is a classic and incredibly frustrating academic dilemma. You are dealing with two separate issues tangled together: **scientific validity** and **professional hypocrisy.**

  Here is the breakdown of why you feel this way, why the advisor is technically "right" but socially "wrong," and how you should handle it to protect your own career.

  ### 1. The Scientific Reality (The "Tu Quoque" Trap)
  Logically, the fact that your advisor skipped the check in his own paper does not invalidate the need for the check in yours. In logic, this is the *tu quoque* fallacy (appeal to hypocrisy).

  *   **A smoking doctor can still give valid advice:** If a doctor who smokes tells you to quit because smoking causes cancer, the advice is medically sound even if the doctor is a hypocrite.
  *   **Your paper carries your name:** In five years, when people cite your work, they won't care that your advisor was a hypocrite. They will care if your results hold up. If your advisor is notorious for spotting p-hacking, he is likely trying to prevent you from publishing something that could be retracted or criticized later.
  *   **The Standard is Rising:** Science moves fast. A robustness check that was optional or overlooked last year might be standard expectation this year. He might be holding you to the *current* standard, even if he didn't meet it previously.

  **Verdict:** He was in a position to call you out because his job is to ensure *your* work is bulletproof. The validity of the robustness check stands on its own merits, regardless of his publication history.

  ### 2. The Interpersonal Reality (The Hypocrisy)
  However, your feelings are completely valid. Science is done by humans, and human dynamics matter.

  *   **Erosion of Trust:** When a leader demands a standard they don't meet themselves, it erodes respect. It makes the criticism feel less like "mentorship" and more like "power assertion."
  *   **Public Embarrassment:** Being "torn into" in a lab meeting is aggressive management. Doing so while ignoring his own similar lapse makes it feel unfair and humiliating.
  *   **The "Side Eye":** The fact that the postdocs noticed and said nothing speaks volumes. It suggests a culture where the advisor is feared or untouchable, which is stressful for everyone, especially students.

  **Verdict:** You are right to feel salty. It is unfair. It creates a double standard that breeds resentment.

  ### 3. How to Handle This (Strategic Advice)
  You are in a power imbalance. He controls your funding, your graduation timeline, and your letters of recommendation. You cannot "win" a confrontation about his hypocrisy without significant risk to yourself.

  Here is the strategic play:

  **A. Do the Check (Protect Yourself)**
  Do the robustness check. Do it thoroughly. Document the results.
  *   **Why:** If the check fails, you need to know now, not after you graduate. If the check passes, your paper becomes stronger.
  *   **Mindset:** Do not do it to please him. Do it to make your work immune to criticism from *anyone* (including future reviewers who might be as strict as he is).

  **B. Don't Bring Up His Paper**
  As tempting as it is to say, "But you didn't do this in [Paper X]," **do not do this.**
  *   **Why:** He knows he didn't do it. The postdocs know. Bringing it up publicly will be seen as insubordination. It will shift the focus from "the science" to "your attitude," and you will lose that battle.
  *   **Exception:** If you have a very close, private relationship, you *might* be able to ask gently in a 1-on-1: "I was looking at your 2023 paper for guidance on this check, but I noticed the methodology differed. Was there a specific reason we are prioritizing it now?" (This is high risk, proceed with caution).

  **C. Reframe the Narrative**
  Instead of viewing this as "He's a hypocrite punishing me," try to view it as "He is terrified of reputation damage, so he is over-correcting with me."
  *   Advisors often hold students to higher standards than they hold themselves because the student's failure reflects on the lab, but the student's success is the only way the lab grows.
  *   Let his paranoia be your shield. If you pass his scrutiny, you will likely pass anyone else's.

  **D. Document Everything**
  Since he is notorious for making students redo chapters, keep a paper trail.
  *   When he asks for a check, confirm via email: "Just to confirm, you'd like me to run X robustness check on Y data before proceeding to Z?"
  *   This protects you if he later claims you didn't do enough, or if he suddenly changes his mind.

  ### Summary
  **Does his hypocrisy mean he wasn't in a position to call you out?**
  Technically, **no.** As your advisor, his role is to critique your work, even if his own past work isn't perfect.

  **Does it matter?**
  **Yes,** but mostly for your emotional management, not your scientific output. It matters because it makes him a flawed mentor, not because it makes his scientific advice wrong.

  **The Bottom Line:**
  Take the win on the science. Do the check. Make your paper undeniable. Let his hypocrisy be a lesson in what kind of PI you *don't* want to be someday, but don't let your resentment of his behavior compromise the quality of your own research. Your name goes on the paper, not his. Make sure it's solid.
