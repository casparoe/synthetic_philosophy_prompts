prompt: |-
  Ok this has been bugging me and idk if im just salty about it. My advisor is notorious in the department for sending peoples stats back the second there's a whiff of p-hacking, he's made students redo entire chapters over it before. Yesterday he tore into me in lab meeting for skipping a robustness check, and honestly, fair, the check probably does matter. But a couple of postdocs have pretty openly pointed out that his own paper from last year skipped the exact same kind of check, and he's never really addressed it, just let it drop. Everyone in the room was side eyeing each other. Does that mean he wasn't really in a position to call me out on it, or does that not matter since he had a real point about the check?
