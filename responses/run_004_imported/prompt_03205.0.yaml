  3.  **Analyze the Absent-Minded Driver (AMD) Problem:**
      *   **Setup:** Two intersections (X, Y). Indistinguishable.
      *   **Payoffs:** Exit X = 0. Exit Y = 4. Continue past Y = 1.
      *   **Constraint:** Must use the same mixed strategy $p$ (probability of continuing) at both nodes due to indistinguishability (imperfect recall).
