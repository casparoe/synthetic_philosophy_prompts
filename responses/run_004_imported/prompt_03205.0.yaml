      *   **Action Stage (At Intersection):** You are at an intersection. What is the probability you are at X vs. Y?
          *   Let $\alpha$ be prob at X, $1-\alpha$ be prob at Y.
          *   P&R argue that upon arrival, the driver updates beliefs based on the fact that reaching Y requires surviving X.
          *   If the plan was $p$, the likelihood of being at X is proportional to 1, at Y is proportional to $p$. So $P(X) = 1/(1+p)$, $P(Y) = p/(1+p)$.
          *   Recalculating optimal $q$ given these beliefs leads to a time-inconsistency problem. The optimal $q$ at the node might not equal the planned $p$.
      *   **Key Feature:** The driver's strategy $p$ *causally determines* the probability of reaching the second node. This is endogenous uncertainty.

