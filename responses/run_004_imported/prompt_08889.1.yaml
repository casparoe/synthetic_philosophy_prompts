answer: |-
  Your friend has correctly stated **Aumann's Agreement Theorem**, but she is drawing a conclusion from it that is widely rejected by epistemologists, game theorists, and statisticians. Specifically, her argument breaks down on the claim that the **Common Prior Assumption (CPA)** is a requirement of Bayesian rationality.

  Here is a breakdown of where her argument holds water and where it sinks, which should help you resolve your argument.

  ### 1. The Theorem vs. The Assumption
  Your friend is right about the theorem itself. Robert Aumann (1976) proved that if two agents:
  1.  Are perfect Bayesian updaters,
  2.  Share a **common prior** probability distribution,
  3.  Have **common knowledge** of each other's posterior probabilities,

  Then their posteriors must be identical. They cannot "agree to disagree."

  However, the theorem is a conditional statement: *If* these conditions hold, *then* agreement follows. It does not prove that the conditions *must* hold in the real world. The crux of your disagreement lies in Premise 2: **Is having a common prior a requirement of rationality?**

  ### 2. The Common Prior Assumption is Not "Rationality"
  In standard **Subjective Bayesianism** (the dominant framework in statistics and decision theory), rationality is defined by **coherence**. As long as your probabilities satisfy the axioms of probability (e.g., they sum to 1, you don't bet sure losses) and you update via Bayes' Rule, you are rational.

  Subjective Bayesianism explicitly allows for **different priors**. Two rational agents can look at the same empty universe and assign different initial probabilities to events based on their unique subjective states. There is no mathematical or logical contradiction in two rational agents starting with different priors.

  Your friend is likely appealing to a specific, more controversial philosophical stance known as the **Harsanyi Doctrine** (named after John Harsanyi). This doctrine suggests that differences in priors should be treated as differences in information. It argues that if we fully specified the "state of the world" to include every detail of the agents' genetic and environmental history, their priors would converge.

  While this is a useful modeling assumption in game theory (it makes the math tractable), it is **not** an accepted truth of epistemology. Most philosophers argue that rationality does not dictate a unique "correct" prior. Therefore, two people can be perfectly rational, process information honestly, and still disagree simply because they started with different priors.

  ### 3. The "Common Knowledge" Barrier
  Even if you granted your friend the Common Prior Assumption, Aumann's theorem requires **common knowledge** of posteriors. This is an incredibly high bar that is almost never met in human conversation.

  *   **I know** your belief.
  *   **You know** my belief.
  *   **I know that you know** my belief.
  *   **You know that I know that you know** your belief.
  *   ... *ad infinitum*.

  In a real conversation, you might understand your friend's position, and they might understand yours. But do you *know* that they *know* that you *know* their position without any ambiguity? Usually, no. There is always room for misunderstanding, nuance, or doubt about whether the other person has fully grasped your evidence. Without strict common knowledge, Aumann's theorem does not apply, and disagreement is mathematically permissible even with common priors.

  ### 4. Disagreement on the "State Space"
  Aumann's theorem assumes agents are disagreeing about probabilities over a **shared state space** ($\Omega$). This means both agents agree on what the possible states of the world are; they just disagree on how likely they are.

  In real-world arguments (politics, ethics, science), colleagues often disagree on the **model** itself, not just the probabilities.
  *   **You:** "The state space includes the possibility of economic recession."
  *   **Friend:** "I don't think that variable is relevant to the model."

  If you don't agree on what the possible hypotheses are (the structure of the state space), you cannot have a common prior over that space. This is often called **model uncertainty**, and Aumann's theorem does not resolve it.

  ### 5. Bounded Rationality
  Finally, Aumann's agents are idealized mathematical entities with infinite computational power. Humans are **boundedly rational**. We cannot perfectly update our beliefs across every hypothesis in light of new evidence. We use heuristics; we get tired; we miss implications.

  If two humans disagree after a long conversation, it is far more likely due to computational limitations or different heuristic frameworks than a fundamental violation of Bayesian coherence. Calling this "irrational" in the pejorative sense is unhelpful; it is simply the human condition.

  ### Summary for Your Friend
  You can tell your friend that she is conflating a **modeling assumption** with a **normative requirement**.

  1.  **Aumann's Theorem is valid math,** but it applies to idealized agents, not humans.
  2.  **The Common Prior Assumption is not a law of rationality.** Subjective Bayesianism permits different priors for rational agents.
  3.  **Common Knowledge is rarely achieved.** Real conversations do not satisfy the infinite recursion of knowledge required for the theorem to force agreement.
  4.  **Disagreement is often about models, not probabilities.** If we don't agree on the questions, we can't be forced to agree on the answers.

  **Verdict:** Persistent disagreement between smart, informed, honest people is **not** proof of irrationality. It is proof that they either have different priors (which is allowed), different models (which is common), or haven't achieved strict common knowledge (which is practically impossible). You can remain friends and colleagues without accusing one another of being irrational.
