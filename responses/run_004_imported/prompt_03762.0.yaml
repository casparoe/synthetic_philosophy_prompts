  so i've been on a borges kick lately (started with the fiction — garden of forking paths, funes the memorious, total programmer brain-candy) and found out he wrote actual philosophy essays too, not just stories. i read "a new refutation of time" and thought i had the gist: he chains berkeley's move (no matter, just perceptions) onto hume's move (no self, just a bundle of perceptions), then basically does a find-and-replace — swap "self" for "time" — and sees if the argument still typechecks. if nothing holds perceptions together into a self, why assume something holds moments together into one continuous time either?

  then the ending completely lost me. after all that setup he just turns around and goes "The world, unfortunately, is real; I, unfortunately, am Borges," and starts going on about time as a river/tiger/fire that's destroying him even though he's somehow also the river/tiger/fire.

  is that just borges' being a poet and bailing on his own arguement, or is there an actual philosophical point buried in there? like does the argument fail on its own terms, or is he saying something more interesting — that even a fully successful argument against time wouldn't change anything about how you actually have to live? (this is giving me weird deja vu of hume admitting his skepticism about causation is airtight, but then he just goes and plays backgammon with his friends and stops caring about it — is that the same move, or am i mashing two unrelated things together because my brain wants everything to connect?)

  can you walk me through the actual logic of the argument, and then untangle what's going on with that ending? not looking for a summary of the essay — more like, does the argument hold up, and whatever your verdict is, why.
