answer: |-
  This is one of the deepest and most difficult questions in the ethics of war. You are grappling with a tension that professional philosophers have debated for decades, specifically within the field of **Just War Theory**.

  Your grandfather's view represents the **Traditional View** (often associated with philosopher Michael Walzer), while your unease represents the **Revisionist View** (championed by philosophers like Jeff McMahan).

  To help you think this through, it is useful to separate three distinct layers of the problem: the morality of the *act*, the morality of the *agent*, and the reality of *coercion*.

  ### 1. The Traditional View: The Moral Equality of Combatants
  Your grandfather's intuition relies on a principle called the **Moral Equality of Combatants (MEC)**.

  In traditional Just War Theory, there is a strict separation between:
  *   ***Jus ad bellum*** (The justice of going to war: Was the cause just?)
  *   ***Jus in bello*** (Justice in war: Did you fight by the rules?)

  The Traditional View argues that these are independent. A soldier fighting for an unjust cause is still morally permitted to kill enemy soldiers, provided they follow the rules of engagement (no civilians, no torture, etc.).

  **The Logic:**
  *   **The State's Burden:** The decision to go to war belongs to the state, not the individual. The soldier is an instrument of the state.
  *   **The Fog of War:** Soldiers on both sides are subject to propaganda and limited information. It is unfair to demand a conscript conduct a geopolitical analysis before following orders.
  *   **Reciprocity:** If we say aggressor-soldiers are "murderers," then defender-soldiers are justified in treating them as criminals rather than prisoners of war. This would make wars more brutal. Acknowledging moral equality protects captured soldiers from summary execution.

  **Where your grandfather stands:** He is arguing that because he kept his side of the bargain (*in bello*), he is morally clean, regardless of the politicians' failure (*ad bellum*). In this view, he and the enemy soldier are indeed moral equals: two professionals doing a job, bound by the same rules.

  ### 2. The Revisionist View: The Link Between Cause and Act
  Your unease stems from a more intuitive moral logic that the Traditional View often suppresses. Revisionists argue that *jus ad bellum* and *jus in bello* cannot be fully separated.

  **The Logic:**
  *   **Self-Defense:** The primary justification for killing in war is self-defense or defense of others. If Country A invades Country B unprovoked, Country B's soldiers are killing in genuine self-defense. Country A's soldiers are killing to sustain an unjust aggression.
  *   **Threat Assessment:** If you are an aggressor, you are posing an unjust threat. The person shooting at you is trying to stop an injustice. Therefore, you are not in the same moral position.
  *   **The "Murderer" Analogy:** If a gang of armed robbers breaks into a house, and the homeowner shoots at them, we do not say the robbers and the homeowner are "moral equals" just because the robbers didn't shoot the homeowner's children. The robbers are there unjustly.

  **Where your doubt stands:** You are sensing that if the war itself was a crime, then the violence used to prosecute that war shares in the taint of that crime. From this perspective, your grandfather was objectively participating in something wrong, even if he did it "cleanly."

  ### 3. Bridging the Gap: Culpability vs. Liability
  So, is there a coherent way to decide? Most modern ethicists suggest we need to distinguish between **Liability** and **Culpability**.

  **Liability (Was the act permissible?)**
  Revisionists are likely right here. Objectively, a soldier fighting an aggressive war is contributing to an unjust outcome. The enemy soldier defending their home is acting in legitimate self-defense. In a strict moral ledger, they are not equals. The aggressor is liable to be attacked; the defender is not.

  **Culpability (Is the *person* to blame?)**
  This is where your grandfather's defense holds water. Even if the *act* was objectively unjust, the *agent* (your grandfather) might be blameless. We judge individuals based on:
  *   **Epistemic Limitations:** Did he know the war was aggressive? In many regimes, the truth is hidden. Propaganda convinces young men they are defending their homeland even when they are invading another.
  *   **Duress and Conscription:** He was not a volunteer. He faced imprisonment or execution if he refused. Moral responsibility is significantly diminished when acting under coercive threat.
  *   **Alternatives:** Did he have a realistic way to opt out without destroying his life or endangering his family?

  ### A Synthesis for Your Reflection
  You do not have to choose between "He was a hero" and "He was complicit in a crime." You can hold a nuanced position that honors both the truth of history and the truth of his experience.

  **1. Acknowledge the Asymmetry of Cause:**
  You can accept that the war was unjust and that, abstractly, the soldiers on the defending side had a stronger moral claim. They were protecting; he was encroaching. Admitting this doesn't condemn him; it just acknowledges historical reality.

  **2. Affirm the Symmetry of Experience:**
  Your grandfather was right about the human reality. In the trench, under fire, the political cause dissolves. There is only survival. He and the enemy soldier were indeed equals in their fear, their confusion, and their desire to go home. Recognizing this shared humanity is a moral virtue, not a vice.

  **3. Distinguish the War from the Warrior:**
  You can believe the war was a crime committed by the state, while believing your grandfather was a victim of that state who did his best to retain his humanity within a hellish situation.
  *   He did not choose the war.
  *   He refused to target the vulnerable (civilians/POWs).
  *   He recognized the humanity of his enemy ("young men... trying to do to me exactly what I was trying to do to them").

  ### Conclusion
  To answer your specific question: **Does the justice of the cause make a difference to how we judge them as individuals?**

  **Yes, but perhaps not in the way you fear.**
  The justice of the cause determines the *objective rightness* of the mission. It means your grandfather was on the "wrong side" of history. However, it does not necessarily determine his *personal guilt*.

  A coherent way to view this is: **He was a morally decent man participating in an immoral enterprise.**

  He maintained his personal ethics (no atrocities) within a system that lacked national ethics (aggressive war). You can respect him for the former without endorsing the latter. In fact, his silence and his insistence that he never harmed a civilian suggest that he understood this distinction better than most. He knew he couldn't fix the war, so he focused on fixing his own conduct within it.

  That is not moral equality in the eyes of a tribunal, but it is moral integrity in the eyes of a human being. And for a grandson remembering a grandfather, that is usually the metric that matters most.
