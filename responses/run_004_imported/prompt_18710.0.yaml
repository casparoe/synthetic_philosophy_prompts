answer: |-
  **The Sword and the Scale: Pascal on Force, Justice, and the Necessity of Order**

  Blaise Pascal is often remembered for the Wager, a cold calculation of infinite gain against finite loss. But the Pascal of the *Pensées* is also a keen, almost surgical observer of political reality. One of his most cited fragments (Lafuma 103) contains a line that has chilled political philosophers for centuries: "Not being able to make what is just strong, we have made what is strong just."

  At first glance, this sounds like the ultimate cynic's creed. It suggests that justice is merely a mask worn by power, a linguistic trick we play to legitimize the victors. If this reading holds, Pascal is a precursor to Nietzsche or Thrasymachus, arguing that might makes right. However, a closer reading of the *Pensées* within the context of Pascal's Christian apologetics reveals a different picture. Pascal is not endorsing the identity of force and justice; he is diagnosing a tragedy. He argues that while force is the *mechanism* of earthly order, it is not the *source* of true justice. True justice exists, but it is inaccessible to fallen human reason. Therefore, we must submit to the force of custom not because it is truly just, but because the alternative—chaos—is a greater sin.

  To understand the cynical reading, one must look at Pascal's skepticism regarding human reason. In Fragment Lafuma 44, Pascal writes, "Justice is what is established; and thus all our established laws will necessarily be regarded as just without being examined, since they are established." He observes that truth changes depending on which side of the Pyrenees you stand on. If justice were a universal truth knowable by reason, it would not fluctuate with geography or history. Since it does fluctuate, Pascal argues, our adherence to law is based on habit and authority, not rational recognition of the good.

  From this vantage point, the "mystical foundation of authority" (a phrase later associated with Montaigne and Derrida, but rooted in this Pascalian skepticism) suggests that authority rests on a void. We obey because we are conditioned to obey, not because the ruler is righteous. When Pascal says we "made what is strong just," the cynic hears an admission: there is no "just" other than what the strong impose. Justice is a ghost story we tell to keep the peace. If this were Pascal's final word, he would be a relativist, suggesting that morality is purely a social construct designed to protect the powerful.

  However, this reading collapses when placed against the overarching project of the *Pensées*. Pascal is not writing a treatise on political nihilism; he is writing a defense of the Christian faith. His skepticism about human reason is not an end in itself; it is a tool to humble the reader. Pascal believes that human nature is corrupted by the Fall (Original Sin). In Fragment Lafuma 418, he describes man as a "monster," a "chaos," a "subject of contradiction." Our reason is damaged. We *want* to know the good, but our *amour-propre* (self-love) clouds our vision.

  Therefore, when Pascal says we cannot make the just strong, he is not saying the just does not exist. He is saying that *we* lack the capacity to enforce it perfectly because we cannot agree on what it is. True justice resides with God. In Fragment Lafuma 85, Pascal distinguishes between the "God of the philosophers" and the "God of Abraham." The God of the philosophers might offer abstract truths, but the God of Christianity offers a remedy for the human condition. For Pascal, objective justice is real, but it is transcendent. It is known fully only to God.

  Consequently, the identification of force with justice is a provisional workaround, not an ontological truth. It is a stand-in. Because we cannot access divine justice directly in our political arrangements, we submit to force to prevent total war. Pascal is not saying force *is* justice; he is saying force is the only *available currency* in a fallen world where true justice is out of reach. To call Pascal a cynic is to mistake his diagnosis of the disease for a prescription of health. He describes the world as it is (ruled by force) to highlight how desperately it needs the world as it ought to be (ruled by charity and grace).

  This distinction is crucial for understanding why Pascal believes it is more dangerous to rebel against unjust customs than to live with them. If justice were purely a matter of rational discovery, rebellion against an unjust law would be a moral duty. But for Pascal, human reason is too unreliable to serve as the judge of which laws are truly unjust. In Fragment Lafuma 97, he notes that "custom is the whole of equity, for the sole reason that it is accepted."

  Pascal's fear is not that we will suffer under tyranny, but that we will succumb to pride. Rebellion assumes that the rebel possesses a clarity of vision that the rest of society lacks. Given the corruption of human nature, this assumption is likely false. When individuals decide which laws to obey based on their private judgment of "justice," they return society to the state of nature where "force wins the argument." As Pascal notes, men fight over what is just because everyone claims to possess it, but they do not fight over who is stronger because strength is undeniable.

  To rebel is to invite the very chaos that the "force as justice" compromise was meant to suppress. In Fragment Lafuma 44, Pascal implies that once you start questioning the foundation of the law, you unravel the fabric of society. Since no human law is perfectly just, a demand for perfect justice leads to perpetual revolution. It is better, Pascal argues, to obey the established order—even if it is founded on force—because order itself is a good that restrains human wickedness. The "unjust" custom is a dam holding back the flood of human violence. To break the dam in the name of abstract justice is to drown the world in blood.

  Ultimately, Pascal is not a cynic who believes justice is a lie. He is a tragic realist who believes justice is a lost inheritance. He agrees with the cynic that force rules the earth, but he disagrees that force *should* rule the heart. The equation of strength with justice is a human workaround for a divine problem. We accept the disguise of force because we cannot bear the naked truth of our own division.

  Therefore, the correct reading is that force is only ever a stand-in, never the real thing. Pascal commits to this because his entire apologetic structure depends on the existence of a Truth that transcends human custom. If justice were merely force, there would be no need for God, no need for redemption, and no point to the Wager. Pascal asks us to submit to unjust customs not because they are good, but because we are broken. We live under the rule of the sword while waiting for the return of the King. To rebel is to pretend we are not broken, and for Pascal, that pride is the only true injustice.
