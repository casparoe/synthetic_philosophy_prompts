  **(Self-Correction during final polish):** Make sure the emotional weight lands. The philosophy is the vehicle for the relationship drama. The inability to agree on the shelf mirrors the inability to reconcile their friendship.

  10. **Final Polish:** Check pacing and dialogue tags. Ensure the philosophical terms are used correctly in context. (e.g., "simples," "gerrymandered," "ontological commitment").

