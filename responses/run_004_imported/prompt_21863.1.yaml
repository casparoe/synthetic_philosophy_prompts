answer: |-
  The apartment smelled of cardboard dust and stale coffee. In the center of the living room, the carcass of a particle-board bookshelf lay splayed across the hardwood, a geometric puzzle of cam locks and dowels.

  Elias wiped sweat from his forehead with the back of his wrist, leaving a smudge of gray. He held a screwdriver like a weapon. "Hand me the back panel, would you? The big one."

  Mara didn't move from her perch on a stack of packing crates. She was peeling the label off a beer bottle with surgical precision. "You mean the simples arranged back-panel-wise?"

  Elias paused, the screwdriver hovering over a pre-drilled hole. He didn't look up. "I mean the piece of wood that stops the books from falling through the wall."

  "There is no piece of wood, Elias. There are fibers. Cellulose. Glue." Mara took a sip. "There are no composite objects. You know this. We wrote the seminar paper on it. Five years ago."

  "We wrote *a* paper," Elias said, finally looking at her. His eyes were tired, the lines around them deeper than she remembered. "Then you went to Oxford, read Sider, and decided the world was empty. I went to Chicago, read Lewis, and decided it was full."

  "I decided the world was *precise*," Mara corrected. She hopped off the crates and walked over, crouching beside the shelf. She traced a finger along the edge of a wooden slat without touching it. "Think about van Inwagen. He says composition only occurs when the activity of the parts constitutes a life. Organicisms. You and I both tore that apart in grad school. Why?"

  "Because it's arbitrary," Elias said. He drove the screw in. It bit with a satisfying crunch. "Where does the life begin? When the zygote splits? When the heart beats? If composition is restricted, there has to be a cutoff. And if there's a cutoff, there's a borderline case."

  "Exactly," Mara said. "A case where it's vague whether the parts compose a whole. But existence can't be vague. It can't be an indeterminate fact whether an object exists. So van Inwagen is dead. Restricted composition is dead."

  "So why are you a nihilist?" Elias tightened another screw, his movements sharp. "If existence can't be vague, the only way to avoid vagueness is to say composition *always* occurs. Any collection of objects. This screw, this beer bottle, and that dust bunny across the room. They compose an object. Right now."

  "That's absurd," Mara said, though her voice was calm. "You're populating the universe with trillions of gerrymandered monstrosities just to save a linguistic convenience."

  "I'm populating the universe to save logic," Elias countered. He stood up, testing the shelf. It wobbled. "The Argument from Vagueness forces a choice. Either composition is unrestricted, or it never happens. You chose 'never.' I chose 'always.' But your choice requires you to deny that this shelf exists. Even when I'm leaning on it."

  "I deny that *you* are leaning on *it*," Mara said. "I admit there are simples arranged Elias-wise leaning on simples arranged shelf-wise. I lose nothing in explanatory power. I gain ontological parsimony. Occam's Razor, Elias. You're multiplying entities beyond necessity."

  "Am I?" Elias walked around the shelf to the other side. "Or am I just taking our quantifiers seriously? When I say 'There is a shelf,' I'm making an existential claim. If you say 'There are no shelves,' you have to paraphrase every ordinary sentence into a nightmare of plural logic. 'There are some simples...' It's cumbersome. It treats 'object' as a second-class citizen."

  "It treats 'object' as what it is," Mara said. She picked up a cam lock from the floor, rolling it between her thumb and forefinger. "Look at this. Is it part of the shelf yet? You tightened the screw. But if you loosened it, would it stop being part? If you say yes, you admit vagueness. If you say no, you admit that my grip on this metal circle doesn't change the ontology. It's just a simple. Always a simple. Never a part."

  "But consider the series," Elias said, leaning against the doorframe. "Imagine a continuum of cases. From a pile of loose wood to a fully assembled shelf. At every step, you remove one atom. At which step does the shelf cease to exist? If you're a nihilist, you say it never existed. But then you have to explain why, when the atoms are arranged *this* way, they support books, and when they are arranged *that* way, they don't."

  "I explain it by the causal powers of the simples," Mara said. "Arrangement matters. Structure matters. Existence doesn't. You're conflating functional unity with ontological unity. Just because they work together doesn't mean they *are* one thing."

  Elias pushed off the doorframe. "But the Vagueness Argument cuts both ways, Mara. You use it to kill restricted composition. Fine. But why does 'never' survive better than 'always'? Lewis argued that 'always' is the only view that respects the precision of existence. If you say 'never,' you're still making a universal claim about composition. You're saying the relation of parthood is empty. That's a massive metaphysical posit."

  "It's a negation," she said. "I'm not positing an empty relation. I'm saying the concept is incoherent. Like 'witch.' We don't say 'witches exist but there are zero of them.' We say the concept fails to latch onto reality."

  "But 'part' isn't 'witch'," Elias said, his voice rising slightly. "It's fundamental. Mereology is supposed to be the formal backbone of ontology. If you delete it, you don't have a backbone. You have a jellyfish."

  "Better a jellyfish than a monster," Mara shot back. She stood up, brushing dust from her jeans. "You want precision? Fine. But your precision comes at the cost of sanity. You believe there is an object composed of the left half of this shelf and the right shoe you're wearing. Call it the 'Shoe-Shelf.' Does it exist?"

  "Yes."

  "Where?"

  "Wherever the parts are."

  "It has no causal unity. No spatial continuity. It's a logical ghost."

  "It's a logical consequence," Elias insisted. "If you accept classical logic and standard quantification, you get universalism. To deny it, you have to restrict your quantifiers. And how do you restrict them without vagueness? You can't. So you're forced into nihilism as a desperate escape hatch."

  Mara walked over to him. They were close now, separated by the wobbling shelf. The air between them felt charged, not just with the argument, but with the memory of all the arguments that had come before. The late nights in the library. The shared draft that never got published. The silence after the job market tore them apart.

  "Desperate?" Mara asked quietly. "Or honest? You think I enjoy telling people their mothers don't exist? That *we* don't exist? I'm a nihilist about composition, Elias, not about people. But I follow the argument where it leads. If existence is precise, and composition leads to vagueness, then composition is the problem. Not the ontology."

  "But you're ignoring the cost," Elias said. "You save precision by sacrificing the world. I save the world by expanding the ontology. Why is your trade-off the virtuous one?"

  "Because your expansion is unbounded," Mara said. "Every time I blink, I create new objects by shifting the arrangement of simples in my eyelids. You're committed to an infinity of objects coming in and out of existence every microsecond. It's ontological inflation."

  "It's ontological generosity," Elias corrected. "It acknowledges that reality is richer than our intuitions. We think chairs exist and shoe-shelves don't because of evolutionary utility, not metaphysical truth."

  "Then trust the utility," Mara said. "If utility is all we have, why posit the object at all? Just posit the utility. The arrangement."

  Elias looked down at the shelf. It was standing now, mostly straight. He reached out and tapped the top. It hummed, a low, hollow sound.

  "If I push this," Elias said, "it will fall. If it falls, it will break. If it breaks, the parts will scatter. If there is no shelf, what breaks?"

  "The bonds between the simples," Mara said immediately. "The glue fails. The friction is overcome."

  "The shelf breaks," Elias said.

  "The arrangement changes," Mara said.

  They stood in silence. The hum of the refrigerator in the kitchen seemed suddenly loud.

  "You remember that conference in Prague?" Elias asked, his voice softer. "When we presented the joint paper? We couldn't decide on the conclusion. We left it open."

  "We were cowards," Mara said.

  "We were honest," Elias replied. "We knew the arguments balanced. We just didn't want to choose."

  "I've chosen," Mara said. She picked up the empty beer bottle. "And I'm still waiting for you to admit that 'Shoe-Shelf' is a reductio ad absurdum."

  "I'm waiting for you to admit that 'simples arranged shelf-wise' is a circumlocution for 'shelf'."

  Mara smiled, a thin, fleeting thing. "I don't think I will."

  "Then I guess the shelf stays wobbly."

  "It's not wobbly," Mara said, reaching out to steady the top corner with one hand. Her fingers brushed his. "The simples are just... unsettled."

  Elias looked at her hand, then up to her eyes. He didn't pull away. "Like us?"

  Mara held his gaze for a moment, then removed her hand. The shelf held.

  "Like the furniture," she said. She turned back to the boxes. "Pass me the tape. I need to seal these. The simples inside shouldn't scatter."

  Elias handed her the roll. "Careful. If you tape the boxes too tight, you might create a new composite object. Box-and-Tape."

  "Don't tempt me," Mara said, ripping a strip of tape with a sharp hiss. "I might start believing in it."

  "I hope you do," Elias said.

  "I hope you don't," she replied.

  They worked in silence for the rest of the afternoon, the shelf standing between them, solid as a premise, fragile as a conclusion.
