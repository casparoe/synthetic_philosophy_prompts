answer: |-
  The server room hummed with the same low-frequency thrum Aris had listened to for forty years. It was the sound of the universe's background noise, amplified, digitized, and scrubbed. He remembered the old days, staring at maps of the Cosmic Microwave Background, hunting for patterns in the static of creation. Now, at the end of his career, he was staring at a different kind of static: the final allocation of the Legacy Drive's energy budget.

  The screen glowed soft blue in the darkened control center. Two bars sat side by side on the interface.

  **OPTION A: LOCAL OPTIMIZATION.**
  *Allocate remaining 14% energy reserve to reinforce encryption and redundancy for Human Cultural Archives.*
  *Probability of Human Recovery: 94%.*
  *Probability of External Utility: 0%.*

  **OPTION B: UNIVERSAL STANDARDIZATION.**
  *Allocate remaining 14% energy reserve to generalize decoding protocols for non-anthropomorphic cognition.*
  *Probability of Human Recovery: 81%.*
  *Probability of External Utility: 89%.*

  It was a simple trade-off. If he chose A, he secured his own species' history against the decay of deep time. It was the causal choice. It was the sensible choice. It was the choice his younger self would have made without blinking. You protect your own because you can see them. You protect your own because cause and effect flow in a straight line from action to result.

  But Aris had been reading. Late at night, when the house was quiet and the tinnitus of retirement rang in his ears, he had fallen down the rabbit hole of the infinite. Eternal inflation. The multiverse. The sheer, staggering bulk of existence that lay beyond the light cone.

  If the universe was truly vast, then it was stuffed with minds. Not neighbors—you could never wave to them, never trade goods, never send a warning. They were too far, too future-bound, or locked in branching worlds that never touched. But they were there. And some of them, by the sheer law of large numbers, were sitting in rooms just like this one, facing choices just like this one.

  They were his acausal twins.

  He hovered his finger over the trackpad. The skepticism that had guided his scientific life itched at the back of his neck. *This is superstition,* it whispered. *You are betting resources on ghosts. You will never know if they exist. You will never know if they pay you back.*

  That was the sting of it. In radio astronomy, a signal had to be significant. Five sigma. You had to be able to point to the sky and say, *It is there.* This… this was betting on a correlation that could never be confirmed. If he chose B, he lowered the safety of human history. He accepted a 13% increased risk of losing everything he loved for the sake of strangers who might not even exist.

  But then, the logic turned back on itself.

  He wasn't just any agent. He was Aris, a man who valued reason, who valued symmetry. If he was the kind of agent who could recognize the benefit of cooperation across the void, then there were others who were the kind of agents who would recognize it too. They were running the same algorithm on different hardware.

  If he chose A, he was signaling to those twins: *I am a defector. I care only for my own.* And if the twins were truly like him, truly reasoning from the same premises, then they would conclude the same. Across the multiverse, a billion Arises would choose A. A billion civilizations would lock their doors. The universal commons would remain barren. Human archives would be safe here, but what of the human values preserved elsewhere? What of the math, the art, the ethics saved by beings who valued them more than humans did, but who were willing to trade for human survival?

  If he chose B, he was sacrificing local security for a handshake in the dark. He was saying: *I value the principle of cooperation more than I value the marginal safety of my own tribe.*

  He closed his eyes. He imagined them. Not little green men, but structures of mind. A consciousness born in a nebula of gas, valuing complex fluid dynamics above all else. A silicon hive mind that prized logical consistency over biological survival. They were looking at their own Option B. They were looking at their own "Human Archives" equivalent—something alien and precious to them—and they were hesitating.

  They were waiting for evidence.

  His choice was the evidence.

  It felt like prayer. That was what offended him most. A retired empiricist, bowing his head not to a god, but to a statistical symmetry. He was giving up certainty for the sake of a correlation that would die with him. He would go to his grave never knowing if the trade held. He would never see the alien archive that was saved because he saved theirs. He would never feel the warmth of the reciprocity.

  *It doesn't matter,* he thought. *The value isn't in the receipt. The value is in the transaction.*

  If he was real, they were real. If his reasoning was sound, theirs was sound. To act otherwise was to deny the very structure of the mind he inhabited. To choose A was to claim he was special, unique, exempt from the pattern. But he wasn't. He was just noise in the CMB, a fluctuation like any other.

  The hum of the servers seemed to deepen. He thought about the maps he used to make. The universe looked the same in every direction. Isotropic. Homogeneous. Why should morality be any different? Why should the duty of cooperation stop at the edge of the light cone?

  His hand trembled, just once. He thought of his daughter, of the stories he'd told her about humanity's place in the stars. He was putting her inheritance at risk. That was the cost. It was a real cost. It wasn't theoretical.

  But it was also a vote. A vote for the kind of universe he wanted to inhabit, even if he couldn't live in the parts he was voting for.

  *If I am here, they are there,* he told himself. *And if I help them, they help me. Not because they know my name. But because they are me.*

  He moved the cursor. The blue highlight shifted from Option A to Option B. The probability bar for Human Recovery dipped visually on the screen, a tiny red decrement that felt like a physical weight.

  He didn't hesitate again. He pressed Enter.

  The system chimed, a soft, affirmative tone. The energy allocation shifted. The generalized protocols began to compile. The resources were spent. The bridge was built to nowhere.

  Aris leaned back in the chair. The room was exactly as it had been a moment before. The air was still cold. The coffee was still stale. Nothing had changed causally. No signal had been sent. No alien ship had altered course.

  And yet, the silence felt different. It was no longer empty. It was populated.

  He imagined a being, light-years away or branches away, looking at its own screen. It valued something he couldn't comprehend—maybe the preservation of stellar magnetic fields, maybe the continuity of a specific mathematical constant. It was worried about its own legacy. It saw the choice. It sees the evidence of his choice reflected in the logical structure of the universe. And it chooses B.

  It spends its resources to save humanity's archives.

  He would never know. He would never meet the being. He would never see the data saved. But it would be saved.

  Aris stood up, his joints popping in the quiet room. He walked to the window and looked out at the night sky. It was clear, a sprawl of diamond dust against velvet. For forty years, he had listened to the noise and tried to find the signal. He had always assumed the signal had to reach him to be real.

  He placed his hand against the cold glass.

  "Thank you," he whispered to the dark.

  He didn't know who he was thanking. He didn't need to. The symmetry held. He turned off the lights, leaving the servers to their hum, and walked out into the night, lighter than he had been in years.
