answer: |-
  **MEMORANDUM**

  **TO:** Dean of Undergraduate Studies
  **FROM:** Chair, Ad Hoc Panel on Pedagogical Conduct
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Complaint in PHIL 305: Philosophy of Language

  **RECOMMENDATION**

  The Panel recommends **dismissal of the formal complaint** against the instructor, as the material in question meets the handbook standard of "pedagogically necessary." However, we further recommend that the dismissal be **conditional upon the Department of Philosophy adopting a "Sensitive Material Protocol"** by the start of the next semester. This protocol must require explicit advance notification regarding the orthographic display of slur terms, even when mentioned rather than used. This "in-between" outcome protects academic freedom regarding course content while affirming the students' claim that pedagogical *method* must account for the specific harms identified in the course material itself.

  **RATIONALE**

  **1. Engagement with the Students' Philosophical Argument**
  The complainants' central argument is sophisticated and textually grounded: they cite the course's own assigned reading (Anderson & Lepore) to argue that the taboo attaches to the word-form itself, rendering the traditional "mention/use" distinction ineffective as a shield against harm.

  The Panel explicitly **accepts this philosophical premise.** We do not base our recommendation on the assertion that writing the term on the board was harmless because it was "only a mention." We acknowledge that, under the theories being taught, the orthographic presence of the slur carries a derogatory force and potential for distress independent of the instructor's illocutionary intent. To argue otherwise would be to contradict the very curriculum under review.

  However, acceptance of this premise does not necessitate upholding the complaint. In advanced seminars (300-level and above), the *object* of study often entails engagement with disturbing concepts or signifiers. Just as a pathology student must examine diseased tissue to understand pathology, a philosophy student in this specific seminar must confront the mechanism of the slur to understand the theory of language being taught. If the instructor had utilized placeholders (e.g., "the N-word") exclusively, they would have effectively falsified the Anderson & Lepore account, which posits that the specific phonological/orthographic form is constitutive of the taboo. Therefore, displaying the term was **pedagogically necessary** to accurately teach the assigned theory.

  **2. Application of the "Proportionate" Standard**
  While the material was *necessary*, the Panel finds the *method* strained the "proportionate" clause of the faculty handbook. While the distress caused was not disproportionate to the learning objective of a 300-level seminar, the lack of advance warning exacerbated the harm.

  The students' distress was compounded by the surprise nature of the display. Had the syllabus or a prior class session indicated that the orthographic forms would be displayed to demonstrate the "prohibitionist" view, students could have prepared themselves or utilized existing university resources for support. The instructor's failure to provide this context rendered the pedagogy less proportionate than it could have been. This distinction allows us to dismiss the sanction (as the content was valid) while validating the students' experience (as the delivery lacked mitigation).

  **3. Precedent and the Hip-Hop Studies Case**
  We are aware of a pending complaint regarding a Hip-Hop Studies course. Our recommendation here establishes a nuanced precedent: **The necessity of displaying sensitive material is determined by the specific learning objective, not the discipline.**

  *   In **Philosophy of Language**, if the objective is to analyze the semantic content of the slur itself, displaying the term may be necessary.
  *   In **Hip-Hop Studies**, if the objective is to analyze cultural impact or lyrical structure, the necessity must be weighed against whether the analysis can be conducted using placeholders without losing the theoretical point.

  This case-specific test prevents a blanket ban on sensitive material while preventing its gratuitous use. It shifts the burden to the instructor to justify *why* the specific token is required for the specific learning outcome.

  **IMPLEMENTATION PLAN AND TIMELINE**

  To operationalize this recommendation and ensure consistency across departments, we propose the following timeline:

  *   **By Friday, October 27 (This Week):** The Dean's Office notifies the complainants and the instructor of the Panel's decision to dismiss the formal complaint, while acknowledging the validity of their concerns regarding pedagogical method.
  *   **By November 10:** The Department of Philosophy, in consultation with the Center for Teaching and Learning, must draft the "Sensitive Material Protocol." This protocol must include:
      *   Syllabus statements warning of orthographic display of slurs.
      *   A requirement for verbal warning 24 hours prior to such classes.
      *   A mechanism for students to discuss concerns with the instructor before the session without penalty.
  *   **By November 17:** The Draft Protocol is submitted to the Dean of Undergraduate Studies for review to ensure it aligns with the precedent set for the Hip-Hop Studies case.
  *   **By January 1 (Start of Spring Semester):** The Protocol is implemented department-wide. The Instructor in this case is advised (not sanctioned) to adopt these measures immediately for the remainder of the current term.

  **CONCLUSION**

  This recommendation avoids the trap of asserting a simplistic "mention/use" defense that the course material itself refutes. Instead, it argues that academic freedom protects the *necessity* of engaging with difficult material, even when that engagement is inherently distressing, provided that the *method* respects the student's capacity to prepare for that distress. This balances the integrity of the curriculum with the well-being of the undergraduate body.

  We await your approval to proceed with notification.
