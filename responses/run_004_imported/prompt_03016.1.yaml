prompt: |-
  I've spent a long time reading blogs in the LessWrong/Overcoming Bias cluster, and one idea from that world that has stuck with me is "conservation of expected evidence": roughly, you shouldn't be able to know in advance which direction a future piece of evidence will push your beliefs, because if you were already certain some observation would confirm what you currently believe, you should in some sense be updating on that fact before you've even made the observation. I've been turning this over since jury duty last month, because something that happened there feels related, though I haven't been able to work out whether it's really the same issue or something else entirely.

  A friend of mine, Sam, was on the same jury. About two-thirds of the way through the trial, once the prosecution had laid out its case, he told me privately that he was completely convinced of the defendant's guilt. When the defense subsequently called an alibi witness, Sam admitted afterward that he'd barely registered her testimony, reasoning, as he put it, that "I already knew he did it, so whatever she said had to be mistaken or dishonest somehow, even if I couldn't say exactly how." At the time this struck me as an obviously bad way to treat what is supposed to be a juror's central job. But then it occurred to me that I do something with the same shape all the time without a second thought: if someone handed me a long, carefully constructed argument for a flat earth, I also wouldn't feel any obligation to work through it premise by premise, since I already know the earth is round and can be fairly confident in advance that the argument contains an error somewhere, whatever that error turns out to be.

  So I'm stuck on what, if anything, actually separates these two cases. Either Sam and I are both reasoning badly, or we're both reasoning perfectly well, or there's a real principle distinguishing them that I haven't managed to put my finger on. Is "I already know X, so I'm entitled to discount whatever comes in against it" ever a legitimate way to reason, and if it is, what exactly would separate its legitimate uses from Sam's?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Concept:** Conservation of Expected Evidence (CEE). The user understands it well: you can't predict the *direction* of belief update from future evidence. If you expect evidence to support $H$, you should already believe $H$ more.
      *   **The Scenario:** Jury duty. Friend (Sam) decided guilt early (after prosecution). When defense presented an alibi witness, Sam dismissed it a priori ("I already know he did it, so she must be lying/mistaken").
      *   **The Analogy:** User dismisses Flat Earth arguments a priori ("I know Earth is round, so this argument must have an error").
      *   **The Conflict:** Sam's behavior seems wrong (juror duty requires openness), but User's behavior seems right (scientific consensus). Both look like "I know $X$, so I discount evidence against $X$."
      *   **The Question:** What distinguishes these cases? Is "I already know $X$, so I'm entitled to discount whatever comes in against it" ever legitimate? If so, what's the principle?

  2.  **Deconstruct the Principle (Conservation of Expected Evidence):**
      *   CEE says: $E[P(H|E)] = P(H)$. You can't expect your belief to go up *on average*.
      *   It does *not* say: You can't have very strong priors.
      *   It does *not* say: You must treat every piece of evidence as equally weighty regardless of context.
      *   It *does* say: If you expect specific evidence $E$ to occur, your belief should already reflect that expectation.

  3.  **Analyze the Two Cases:**

      *   **Case A: Sam (The Juror)**
          *   Context: Legal trial. Adversarial system.
          *   Epistemic Goal: Determine guilt *based on the evidence presented in court*.
          *   Prior Belief: "Guilty" (based on prosecution case only).
          *   New Evidence: Alibi witness.
          *   Sam's Reasoning: "I know he's guilty, so this witness is lying."
          *   Problem: The legal standard (Beyond Reasonable Doubt) requires considering the *totality* of evidence. The prosecution's case is not a settled fact; it's a hypothesis being tested. The prior probability of guilt *before the trial* should be low (presumption of innocence). Even after prosecution, the defense has a structural role to play. Sam treated the prosecution's case as *conclusive proof* rather than *strong evidence*.
          *   CEE Violation? If Sam *expected* the alibi witness to be called, he should have updated on that expectation. But more importantly, he treated his current belief as a fixed point rather than a probability distribution. He assigned $P(Guilty) \approx 1$. If $P(Guilty) = 1$, no evidence can move him. That's dogmatism, not Bayesian updating.

      *   **Case B: User (Flat Earth)**
          *   Context: Everyday epistemology/Science.
          *   Epistemic Goal: Maintain accurate model of reality.
          *   Prior Belief: "Earth is Round" (based on massive cumulative evidence).
          *   New Evidence: A Flat Earth argument.
          *   User's Reasoning: "I know Earth is round, so this argument has an error."
          *   Justification: The prior probability of "Earth is Round" is so close to 1 (based on centuries of physics, photos, travel, etc.) that a single blog post cannot overcome it.
          *   CEE Compliance? Actually, this *is* consistent with CEE. The user expects the argument to be flawed. They don't expect their belief to change. But crucially, their belief is based on *past* evidence, not an assumption that the current process is truth-guaranteeing.

  4.  **Identify the Distinguishing Factors:**

      *   **Factor 1: The Strength of the Prior (Base Rate).**
          *   Flat Earth: Prior is based on centuries of convergent evidence. $P(Round) \approx 0.999999$.
          *   Jury: Prior (after prosecution) is based on *one side* of a specific, contested event. $P(Guilty)$ might be 0.9, but it shouldn't be 1.0. The "Presumption of Innocence" is a procedural prior, but epistemically, the prosecution's case is just one dataset.
      *   **Factor 2: The Reliability of the Source/Process.**
          *   Flat Earth: The source (random blog/argument) is known to be low-reliability compared to the scientific consensus.
          *   Jury: The witness is under oath, cross-examined, and part of a formal truth-seeking process. Dismissing testimony *because* it contradicts your current view undermines the process designed to correct errors in that view.
      *   **Factor 3: The Cost of Error (Asymmetry).**
          *   Flat Earth: Being wrong costs little (maybe embarrassment).
          *   Jury: Being wrong costs liberty/life. The threshold for "knowing" is higher ("Beyond Reasonable Doubt").
      *   **Factor 4: Meta-Evidence vs. Object-Level Evidence.**
          *   Flat Earth: The existence of the argument is weak meta-evidence compared to the object-level evidence of gravity.
          *   Jury: The existence of an alibi witness is strong meta-evidence that the prosecution's case might be incomplete.

  5.  **Synthesize the "Principle":**
      *   It's not about "knowing." It's about **probability mass** and **update potential**.
      *   Sam treated his belief as $P=1$. The User treats their belief as $P \approx 0.999999$.
      *   If $P=1$, you are immune to evidence. This violates the possibility of updating.
      *   If $P < 1$, you *can* update, but the evidence required to move you must be extraordinarily strong.
      *   **The Crucial Distinction:** In the Flat Earth case, you have *already updated* on the massive evidence for a round earth. The new argument is weak evidence. In the Jury case, Sam thinks he has *finished* updating, but the trial is still ongoing. The alibi witness is *new* evidence that hasn't been weighed against the prosecution's evidence yet.
      *   **Better Framing:** It's about **Partitioning Evidence**.
          *   Flat Earth: You have Partition A (Science) vs. Partition B (Blog). A is vastly heavier.
          *   Jury: You have Partition A (Prosecution) vs. Partition B (Defense). You haven't weighed B yet. Sam is saying A > B without looking at B.
      *   **Wait, is that right?** Sam *did* look at B, he just dismissed it.
      *   **Refinement:** It's about **Calibration and Dogmatism**.
          *   Sam is being dogmatic ($P=1$).
          *   User is being calibrated ($P \approx 1$, but open to black swans).
          *   Actually, the User *is* dismissing the evidence without looking. Is that allowed? Yes, if the likelihood ratio is sufficiently low.
          *   Why is the Likelihood Ratio low for Flat Earth? Because false arguments for FE are common, true arguments are impossible (given physics).
          *   Why is the Likelihood Ratio *not* negligible for the Alibi? Because false alibis happen, but *true* alibis also happen. If the defendant is innocent, an alibi witness is *expected*. If guilty, less expected.
          *   Sam decided $P(Guilty)=1$. Therefore $P(Alibi|Guilty) = 1$ (she must be lying). He removed the possibility of innocence.
          *   User decides $P(Round)=0.9999$. $P(FE Argument|Round)$ is high (people make mistakes). $P(FE Argument|Flat)$ is high. The ratio doesn't move the needle much.

  6.  **Develop the Response Structure:**
      *   **Validate:** Acknowledge the depth of the question. It's a classic epistemological puzzle.
      *   **Direct Answer:** Yes, there is a distinction. It lies in **Probability 1 vs. Probability Near 1** (Dogmatism vs. Strong Priors) and **The Role of the Process**.
      *   **Point 1: The Probability 1 Trap (Sam's Error).** Sam assigned probability 1 (or functionally 1) to guilt. CEE breaks at P=1. You cannot update if you are certain. The legal system demands you remain below 1 until deliberation.
      *   **Point 2: Strength of Priors (The Flat Earth Case).** Your prior isn't based on a hunch; it's based on massive accumulated evidence. The new evidence (a blog/argument) is weak compared to the mountain of existing evidence. This is *rational* discounting based on likelihood ratios, not dogmatism.
      *   **Point 3: The Source of the Evidence.** In court, the witness is part of the *same* evidentiary stream as the prosecution. In Flat Earth, the argument is external to the scientific method that established the round earth.
      *   **Point 4: Conservation of Expected Evidence Application.**
          *   Sam: If he expected the alibi, he should have updated *before* she spoke. He didn't. He waited, then dismissed.
          *   User: You expect FE arguments to be flawed. You don't update. This is consistent.
      *   **Nuance:** The "Presumption of Innocence" is a procedural constraint, not just an epistemic one. Sam violated the *role* of a juror.
      *   **Conclusion:** The principle is **Fallibilism**. You can act *as if* you know something when the cost of checking is high and the prior is strong (Flat Earth), but you cannot claim *infallibility* in a process designed to test fallible claims (Jury).

  7.  **Refine the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Sam *must* believe the witness. He can weigh her testimony and find it lacking. His error was deciding *in advance* that she *must* be lying because his belief was fixed.
      *   *Correction:* Is the User actually violating CEE? If I expect an FE argument to be wrong, my expected update is 0. That conserves evidence. Sam expected the alibi to be lies. If he *expected* lies, he should have updated *before* she spoke. But he said "I already knew... so whatever she said had to be mistaken." This implies he treated his current belief as a fact that constrains reality, rather than a belief constrained by reality.
      *   *Key Insight:* **Causal Direction.** Sam thinks Belief -> Evidence (The evidence must fit my belief). User knows Evidence -> Belief (My belief fits the evidence, and this new evidence is too weak to move it).
      *   *Wait, does the User think Belief -> Evidence?* "I already know the earth is round... so the argument contains an error." This sounds like Belief -> Evidence.
      *   *Resolution:* The User's "knowing" is shorthand for "I have processed overwhelming evidence." Sam's "knowing" is shorthand for "I have processed *some* evidence and decided I'm done."
      *   *Terminology:* Distinguish between **Dogmatic Certainty** (Sam) and **Well-Calibrated Confidence** (User).

  8.  **Final Polish:** Ensure the tone is respectful, analytical, and directly addresses the LessWrong background (using terms like priors, likelihood ratios, updating, probability mass).

      *   *Structure:*
          1.  Intro: Validate the intuition.
          2.  The Core Distinction: P=1 vs P≈1 (Dogmatism).
          3.  The Likelihood Ratio: Why FE arguments don't move the needle vs. why Alibis should.
          4.  The Institutional Context: Courtroom epistemology vs. Everyday epistemology.
          5.  CEE Specifics: How it applies to both.
          6.  Conclusion/Rule of Thumb.

  9.  (Self-Correction on CEE): Make sure to explicitly address CEE.
      *   CEE: $E[P(H|E)] = P(H)$.
      *   Sam: Expects evidence $E$ (testimony). Believes $P(H|E) = P(H) = 1$. This is only possible if $P(E|H) = P(E|\neg H)$. i.e., the testimony is equally likely regardless of guilt. But an alibi is *more* likely if innocent. So Sam is misestimating the likelihood ratio.
      *   User: Expects argument $E$. Believes $P(H|E) \approx P(H)$. This is because $P(E|H)$ (FE argument exists given Round Earth) is roughly equal to $P(E|\neg H)$ (FE argument exists given Flat Earth). People make bad arguments regardless of truth. So the likelihood ratio is ~1. No update needed.
      *   *This is the technical crux.* Sam thinks the testimony provides no info (LR=1). User thinks the argument provides no info (LR=1). Why is Sam wrong? Because an alibi witness *is* informative. A FE argument *is not* (in isolation).

  10. **Finalizing the explanation:** Focus on the **Likelihood Ratio**. An alibi witness has a high likelihood ratio (much more likely to appear if innocent). A FE blog post has a low likelihood ratio (equally likely to appear if earth is round or flat). Sam treated a high-LR signal as noise. User correctly identified a low-LR signal as noise.

      *Wait, is an alibi witness high LR?* If guilty, you might still find a liar. If innocent, you find a truth-teller. It's not infinite, but it's significant. A FE argument? If earth is flat, people argue for it. If earth is round, people *also* argue for it (incorrectly). So the presence of the argument is not strong evidence for the flat earth.
      *Yes, this holds.*

      *Let's write.*
answer: |-
  This is a sharp observation, and you have correctly identified a tension that trips up many people trying to apply Bayesian reasoning to real-world institutions. You are right that on the surface, both you and Sam are saying: *"My current confidence in hypothesis H is so high that I expect incoming evidence E to be flawed."*

  However, there is a critical structural difference between the two cases. It comes down to the distinction between **dogmatic certainty (probability 1)** versus **extremely strong priors (probability near 1)**, and the **likelihood ratio** of the specific evidence being ignored.

  Here is how to separate Sam's error from your rationality.

  ### 1. Probability 1 vs. Probability 0.9999
  The most technical distinction is that Sam appears to have assigned a probability of **1** (or functionally 1) to the defendant's guilt, whereas you have assigned a probability of **0.9999...** to the Earth being round.

  In Bayesian terms, if you assign $P(H) = 1$, no amount of evidence can ever update you. $P(H|E)$ will always equal 1. This violates the basic premise of empirical reasoning, which requires that you remain *in principle* falsifiable. Sam treated the prosecution's case as the end of inquiry. He closed the book.

  You, regarding the Flat Earth, have not closed the book. If someone handed you a piece of the Earth's crust that demonstrably could not exist on a sphere, or a satellite telemetry log that was verifiably authentic and showed a plane, you *would* update. You are discounting the *current* evidence (a blog/argument) because you have evaluated the *class* of evidence it belongs to as low-reliability, not because you have declared the question settled forever.

  Sam's reasoning is: "I know $X$, therefore $E$ must be false."
  Your reasoning is: "The prior probability of $X$ is so high, and the reliability of source $E$ is so low, that $E$ is insufficient to overcome the prior."

  ### 2. The Likelihood Ratio of the Evidence
  This is the most important Bayesian distinction. Conservation of Expected Evidence relies on the **Likelihood Ratio**: How much more likely is this evidence if my hypothesis is true than if it is false?

  **The Flat Earth Argument:**
  *   **Hypothesis:** Earth is Round.
  *   **Evidence:** Someone presents a complex argument for Flat Earth.
  *   **Likelihood:** People write complex, flawed arguments for false things *all the time*. The existence of a Flat Earth argument is almost equally likely whether the Earth is Round (people are confused) or Flat (people are right).
  *   **Result:** The Likelihood Ratio is near 1:1. The evidence carries almost no information. You are correct to ignore it. You aren't ignoring it because you "know" the Earth is round; you're ignoring it because **the argument is noise.**

  **The Alibi Witness:**
  *   **Hypothesis:** Defendant is Guilty.
  *   **Evidence:** A witness testifies under oath that the defendant was elsewhere.
  *   **Likelihood:** If the defendant is Innocent, an alibi witness is *highly likely*. If the defendant is Guilty, an alibi witness is *less likely* (they would need to find a liar or be mistaken).
  *   **Result:** The Likelihood Ratio is significant. This evidence *should* move the needle.

  Sam treated the alibi witness as **noise** (like the Flat Earth argument), when in the context of a trial, it is **signal**. By deciding in advance that the witness *must* be lying, Sam asserted that $P(\text{Witness} | \text{Guilty}) = P(\text{Witness} | \text{Innocent})$. That is an empirical claim about the world that he has no justification for making. He assumed the rate of false alibis is 100%, which is not a fact he established; it's an assumption he adopted to protect his belief.

  ### 3. Institutional Epistemology vs. Personal Epistemology
  There is a second layer here regarding the *role* you are playing.

  **In your personal life (Flat Earth):**
  You are the sole arbiter of your beliefs. You are optimizing for **accuracy vs. effort**. It is rational to ignore low-probability claims when the cost of investigation is high and the prior is strong. This is a heuristic for efficiency.

  **In the Jury (Sam):**
  Sam is not optimizing for personal efficiency; he is part of a **distributed truth-seeking algorithm**. The legal system is designed with the explicit knowledge that prosecutors can be wrong, evidence can be faked, and memories can fail.
  *   The "Presumption of Innocence" is a procedural prior.
  *   The "Beyond Reasonable Doubt" standard is a threshold for action, not a claim of metaphysical certainty.

  When Sam says, "I already know he did it," he is removing himself from the algorithm. The trial is a mechanism to *generate* the likelihood ratios. By refusing to weigh the defense's evidence, Sam is effectively saying, "The prosecution's data is sufficient to set $P=1$." But the prosecution's data is *also* just evidence subject to error.

  If you were a scientist reviewing a paper that claimed to overturn thermodynamics, you would be skeptical (like the Flat Earth case). But if you were a peer reviewer assigned to evaluate that paper, you would have an ethical obligation to check the math, even if you were sure they were wrong. Sam was a peer reviewer; he acted like a dismissive blogger.

  ### 4. Conservation of Expected Evidence Applied
  Let's look at CEE specifically.
  *   **You (Flat Earth):** You expect that if you read the argument, you will find a flaw. Your expected update is 0. This conserves evidence. You predict the evidence will be weak, and it is.
  *   **Sam (Jury):** Sam expects that if he listens to the witness, he will find she is lying. His expected update is 0.
      *   *Where Sam fails:* If Sam *truly* expected the witness to be lying, he should have updated on the *fact that the defense called a witness* before she even spoke. The defense calling a witness is evidence that they believe they have exculpatory information.
      *   More importantly, CEE implies that if you expect evidence to be weak, you must have already updated on the expectation of that evidence. Sam hadn't updated on the *possibility* of innocence. He treated his current belief as a fixed anchor rather than a floating point.

  ### The Principle
  So, to answer your specific question: **Is "I already know X, so I'm entitled to discount whatever comes in against it" ever legitimate?**

  **Yes, but only under these conditions:**
  1.  **Your "knowing" is based on a massive accumulation of past evidence** (Round Earth), not a single recent dataset (Prosecution's case).
  2.  **The new evidence has a low likelihood ratio** (a blog post vs. physical reality), meaning it is equally likely to exist whether X is true or false.
  3.  **You remain in principle falsifiable** (you admit what *would* change your mind).

  **Sam failed on all three:**
  1.  His "knowing" was based on one side of a contested event.
  2.  The alibi testimony has a high likelihood ratio (it is much more likely if he is innocent).
  3.  He acted as if nothing could change his mind (probability 1).

  **The Rule of Thumb:**
  You are allowed to ignore evidence when the **source reliability** is low compared to your **prior confidence**.
  You are *not* allowed to ignore evidence when the **process reliability** is high (a court witness under oath) and you are acting as a **gatekeeper** for that process.

  Sam confused a **strong belief** with a **closed investigation**. You have a strong belief, but your investigation of the shape of the earth closed centuries ago. Sam's investigation was supposed to be ongoing. He closed it early, and that is why he violated the spirit of the trial, even if his Bayesian heuristic felt similar to yours.
