      *   **Attack Vector 1: The Temporal Boundary (The Clinical Case).** Use the brain death/PVS case. When does the "life event" stop? Is it the last neuron? The last metabolic process? If there's no precise moment, the condition "xs constitute a life" is vague at time *t*. Therefore, it's vague whether the organism exists at *t*.
