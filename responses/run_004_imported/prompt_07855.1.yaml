      *   **User's Critique:** The user finds it suspicious that van Inwagen uses vagueness to rule out other theories but accepts "life" as the criterion, despite "life" seeming notoriously vague (colonial organisms, slime molds, dying processes).
      *   **Task:** Argue *forcefully* that van Inwagen's vagueness argument against common-sense answers applies equally to his own organicist answer. Furthermore, address the "escape route" of claiming vagueness is merely semantic/conceptual rather than ontological.

  2.  **Deconstruct Van Inwagen's Argument in *Material Beings*:**
      *   **The SCQ:** Under what conditions do some xs compose a y?
      *   **The Vagueness Argument:** If composition is vague (e.g., "contact" is vague), then existence is vague. Van Inwagen believes existence cannot be vague (no borderline cases of *being*). Therefore, the correct answer to the SCQ must be precise.
      *   **Common-Sense Answers:** Contact, fastening, cohesion. Van Inwagen argues these are vague (how much contact? how strong is the fastening?).
      *   **Organicism:** Composition occurs when the activity of the xs constitutes a *life*. Van Inwagen claims "life" is a precise biological event (a self-maintaining event of a certain kind).
      *   **The Escape Route:** Van Inwagen acknowledges potential vagueness in "life" but argues it's semantic (sorites regarding the word "life"), not ontological (vagueness in the event itself). He distinguishes between the *concept* of life and the *event* of a life.

  3.  **Formulate the Counter-Argument (The Core Task):**
      *   **Goal:** Show that "constituting a life" is just as vague as "fastening" or "cohesion" in the relevant ontological sense.
      *   **Point 1: The Continuum of Dying.** The user's clinical experience is the perfect wedge. Brain death criteria are legal/medical conventions, not metaphysical cliffs. If composition depends on a "life," and the cessation of that life is gradual (metabolism slowing, cells dying at different rates, brainstem vs. cortex), then the *event* of the life is vague.
      *   **Point 2: Biological Borderlines.** Siphonophores, slime molds, viruses, mitochondria. When does a collection of cells become *one* life vs. *many* lives? If this is vague, then composition is vague.
      *   **Point 3: The Semantic vs. Ontological Distinction.** Van Inwagen tries to save himself by saying vagueness is in the *word* "life," not the *event*. I need to argue that if the *word* "life" is vague in application to the world, then the *fact* of composition (which depends on that application) is vague. You can't isolate the ontology from the semantics when the ontology is defined by the semantics of "life."
      *   **Point 4: The "Event" Ontology.** Van Inwagen treats lives as events. Events can have vague temporal boundaries. If the temporal boundaries of the "life event" are vague, then it's vague whether the particles are currently "caught up in" that event. Thus, composition is vague.

  4.  **Drafting the Argument - Section by Section:**

