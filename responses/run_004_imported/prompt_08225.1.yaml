answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of sharing an office with [Groom] during grad school. We were both studying philosophy, which means our friendship was built on two pillars: cheap beer and arguing about whether or not the table we were sitting at actually existed.

  I mention this because [Groom] has a very specific view of reality. He is a mereological nihilist. For the eighty of you who don't have a dissertation on this, that means he believes there are no composite objects. No tables, no chairs, no cakes. There are only simple particles arranged table-wise, chair-wise, or cake-wise. In fact, he warned me before the reception that strictly speaking, we aren't about to eat a wedding cake. We are about to consume crumbs arranged celebratorily.

  Now, this presents a unique challenge for a Best Man. Traditionally, a wedding toast relies on the idea that today, two people become one. But if I say that line, [Groom] will physically wince. He knows that composition never occurs. He thinks saying two people "become one" is metaphysically reckless, and honestly, he's probably right. A wedding is a terrible candidate for a composition exception.

  So, I promise I will not say that you two are becoming one object. I know better.

  However, even if there is no single "marriage object" formed today, there is something real happening. Because while [Groom] might deny the existence of composite *things*, he cannot deny the reality of *patterns*. And when I look at the two of you, I see a pattern that is undeniable.

  I see a coordination of lives. I see a harmony of actions. I see billions of particles, sure, but they are dancing in a rhythm that is uniquely yours. You have arranged your lives together in a way that makes the world brighter, warmer, and more meaningful. Whether that arrangement constitutes a new metaphysical entity or not, the love involved is just as heavy, and just as real, as anything in this room.

  [Bride], I have to thank you. For four years, you have loved a man who tells you there is no such thing as a sandwich, only bread and meat arranged sandwich-wise. You have found this endearing rather than alarming, which proves you are the perfect match for him. You ground him. You remind him that even if the furniture is an illusion, the comfort it provides is not. Even if the "couple" is just a manner of speaking, the partnership is the truth that matters.

  [Groom], we argued for years about van Inwagen. I never got you to budge. But looking at you two today, I think I finally understand what you were looking for. You wanted a truth that couldn't be broken down. You wanted simples. And in a way, you found them. Because this love isn't built on grand, fuzzy abstractions. It's built on the small, simple moments. The coffee in the morning. The quiet evenings. The way you look at each other across a room full of particles.

  So, I will not ask you to fuse. I will not ask you to compose. I will simply ask you to continue arranging your lives together, exactly as you have been.

  Please raise your glasses. Not to the fusion of two souls, but to the perfect, enduring arrangement of [Groom] and [Bride].

  To [Groom] and [Bride]!
