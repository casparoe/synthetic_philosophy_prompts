prompt: |-
  Okay so I've been down a rabbit hole on some effective altruism / rationalist blogs reading about "evidential cooperation in large worlds" (ECL) -- I think the older name for basically the same idea was "multiverse-wide cooperation via superrationality" or something close to that. The basic idea as I understand it: if the universe (or multiverse) is spatially infinite, or just really really big, there are tons of agents out there whose decisions are correlated with mine even though I could never causally interact with them or even find out what they did. So under evidential decision theory, me choosing to act cooperatively/altruistically toward value systems other than my own right now is evidence that my "correlated twins" elsewhere are doing the same in return, and this can net out to real gains from trade across wildly different values, no causal contact required.

  I mentioned this to my housemate, who did a lot of Kant in undergrad, and she immediately said this is just the categorical imperative wearing a cosmology costume -- "act only according to that maxim by which you can at the same time will that it become a universal law," just re-derived with game theory and a big universe instead of pure reason. I wasn't convinced but honestly couldn't say exactly why not, since on the surface they do both seem to boil down to "act as if your decision procedure were shared by, or mirrored in, everyone else."

  Could you actually dig into this comparison for me? Where does ECL structurally overlap with Kantian universalizability, and where does her analogy break down -- e.g. in terms of what's doing the justificatory work (a priori consistency of a maxim vs. contingent empirical facts about how large and correlated the world happens to be), what "universal" even means in each case (literally every rational being vs. just the subset of agents whose decision procedures are similar enough to yours to be correlated with it), and whether ECL even needs the other party to share your terminal values the way Kant's test presupposes a shared rational nature between you and everyone else. Not gonna lie, I still can't decide which of the two is more defensible as an actual action-guiding principle rather than just a cute thought experiment, so I'd definately love your final take on that too, with reasons.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL) / Multiverse-wide cooperation via superrationality.
      *   **Comparison:** User's housemate claims ECL is just Kant's Categorical Imperative (CI) "wearing a cosmology costume."
      *   **Task:** Analyze the structural overlap and the points of divergence between ECL and Kantian universalizability.
      *   **Specific Points to Address:**
          *   Justificatory work (a priori consistency vs. contingent empirical facts).
          *   Meaning of "universal" (every rational being vs. correlated decision procedures).
          *   Requirement of shared terminal values (Kant's shared rational nature vs. ECL's trade across different values).
          *   Final verdict: Which is more defensible as an action-guiding principle?
      *   **Tone:** Intellectual, nuanced, engaging (matching the user's "rabbit hole" vibe), but rigorous.

  2.  **Initial Assessment & Fact-Checking:**
      *   **ECL:** Associated with Oesterheld, Conitzer, MacAskill, etc. Rooted in Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). Relies on the assumption of a large/infinite universe (cosmology) and logical correlation between agents (superrationality). Goal: Gains from trade across value systems.
      *   **Kant's CI:** Deontological ethics. Rooted in pure practical reason. The Formula of Universal Law (FUL): "Act only according to that maxim whereby you can at the same time will that it should become a universal law." Relies on the autonomy and rationality of agents. Goal: Moral duty, consistency of will.
      *   **The Housemate's Claim:** It's a common observation in rationalist circles that FDT/EDT + Superrationality looks suspiciously like rule utilitarianism or Kantianism. The comparison is apt but not identical.
      *   **Key Distinction:** Kant is about *logical contradiction in conception/will*, ECL is about *causal/evidential expected utility maximization*. One is deontological, the other is consequentialist (specifically, a form of updateless consequentialism).

  3.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Acknowledge the housemate's insight. It's a sharp observation. Validate the intuition while setting up the nuanced critique.
      *   **Structural Overlap (The "Yes" part):**
          *   Both reject naive causal isolation.
          *   Both require stepping outside the immediate self-interest of the specific instance.
          *   Both rely on a form of "substitutability" (if I do X, others like me do X).
      *   **Divergence 1: Justificatory Grounds (Metaphysics vs. Epistemology):**
          *   Kant: A priori, necessary truth. Doesn't matter if the universe is big or small. It's about rationality itself.
          *   ECL: Contingent, empirical. Depends on the universe actually being infinite/large and agents actually being correlated. If the universe is small, ECL collapses.
      *   **Divergence 2: The Scope of "Universal":**
          *   Kant: *All* rational beings. No exceptions.
          *   ECL: *Correlated* agents. This is a subset. It excludes agents with different source code or decision theories. It's tribal in a logical sense.
      *   **Divergence 3: Values and Trade:**
          *   Kant: Shared rational nature implies shared moral law. You don't trade values; you discover the one true moral law.
          *   ECL: Explicitly designed for *different* terminal values (e.g., hedonist vs. paperclip maximizer). It's about compromise, not universal moral truth.
      *   **Divergence 4: Decision Theory (The Engine):**
          *   Kant: Deontology. Duty for duty's sake.
          *   ECL: Consequentialism (EDT/FDT). Do it because it *produces* better outcomes via correlation.
      *   **Final Verdict (Defensibility):**
          *   Kant is more robust metaphysically (doesn't depend on cosmology) but harder to apply (abstract).
          *   ECL is more concrete in goal (utility) but fragile (depends on speculative physics/decision theory).
          *   *Personal Take:* Kant is better for grounding human rights/dignity. ECL is better for long-termist/altruistic strategy *if* you buy the premises. But ECL is riskier.

  4.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to conflate EDT and FDT too much, though ECL usually leans FDT-ish. Stick to "Evidential" as the user specified.
      *   *Nuance:* Kant's "Universal Law" isn't just "everyone does it," it's "everyone *must* do it by rational necessity." ECL is "everyone *will* do it because they are like me."
      *   *Nuance on Values:* Kant thinks irrational to have immoral maxims. ECL thinks different values are fine, just cooperate to maximize each.
      *   *The "Costume" Metaphor:* The housemate is right that the *structure* is similar, but wrong that the *substance* is the same. It's like saying a helicopter is a bird because they both fly.

  5.  **Drafting the Response (incorporating the "Voice"):**
