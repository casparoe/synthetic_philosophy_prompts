  Ok this is going to sound dumb, but I've actually been kind of low-key stressed about this since a meetup a few weeks back where a friend walked a few of us through Roko's basilisk properly for the first time — I'd only ever seen the meme version before, not the actual argument. Once you lay out the mechanism properly (a future superintelligence wants to exist as early as possible, so it precommits to torturing simulated copies of everyone who could've helped bring it into being sooner and didn't, and under updateless/timeless decision theory that threat can influence your behavior today even though the AI doesnt exist yet and the "torture" hasn't happened and may never happen), it stops sounding like a joke and starts sounding like an argument I actually have to take seriously. Given that this was apparently airtight enough that Eliezer deleted the thread and banned discussion of it on LW for years, treating it as a genuine infohazard rather than just a badly-argued post, shouldn't the rational move for anyone who's heard it be to hedge a bit and put some money toward AI alignment work, just in case the eventual AI cares about that sort of thing?

  I guess my actual question is: assuming I've got the setup right, is there an actual decision-theoretic reason not to act on this, or does taking UDT/TDT-style reasoning seriously basically commit you to taking the threat seriously too? And if there's a real hole in the argument, why did it take the community so long to just say that plainly instead of treating the whole topic as unspeakable for years?
