answer: |-
  Thomas Hobbes would unequivocally reject program equilibrium as a genuine escape from the state of nature. He would maintain that it does not supersede the need for a sovereign but rather conceals the sovereign within the computational infrastructure required to make the equilibrium possible. On Hobbes's own terms, program equilibrium fails to secure covenants without the sword because it misunderstands the physical and psychological nature of human beings, treating them as deterministic logic-gates rather than passionate creatures capable of dissimulation, and because it implicitly relies on a "meta-sovereign" to guarantee the transparency it requires.

  Here is the argument on Hobbesian terms.

  ### 1. The Discrepancy Between Code and Man
  Hobbes's political science is grounded in a materialist anthropology. Men are not abstract rational agents; they are bodies in motion driven by "endeavours" (appetites and aversions). Reason, for Hobbes, is not a master but a "scout" for the passions. In the state of nature, the passion for self-preservation and the diffidence (fear) of others' intentions always trump abstract logical commitments.

  Program equilibrium assumes agents are bound by their submitted code. But human beings are not bound by their code; they are bound only by fear of the consequences of breaking it. If I submit a program to you, I am effectively making a covenant in words: "This program represents my true decision procedure." But why should you believe me? Hobbes writes that "words are too weak to bridle the ambition, avarice, anger, and other passions of men." A human agent can always submit a deceptive front—a program that *looks* like a cooperator but contains a hidden switch, or simply run a different process than the one exhibited.

  For Hobbes, the mind is opaque. "The intentions of men are known only by their actions." Program equilibrium demands that intentions be known by *inspection of the source*. This is physically impossible for human beings. We cannot open a man's skull to read his neural code. We can only exchange files. And in the state of nature, where there is no common power to punish fraud, the rational incentive is to submit a fake program that mimics cooperation while secretly defecting. The logical elegance of Löbian cooperation collapses because it applies to *programs*, not to the *men* submitting them.

  ### 2. The Verification Regress and the "Sword" of Truth
  Even if we grant, for argument's sake, that men could perfectly translate their will into code, Hobbes would identify a prior problem: the verification of that code. For program equilibrium to function, both parties must be able to verify that the code provided is the code that will be executed.

  Who guarantees this verification? If I verify your code on my machine, I must trust my machine. If we use a third-party platform to exchange and run code, we must trust the platform. In the state of nature, there is no trusted platform. Any medium of exchange is subject to interference, deception, or force.

  Hobbes argues that "covenants without the sword are but words." The submission of code is itself a covenant: "I covenant that this file contains my true algorithm." Without a power to punish the submission of false code, this covenant is void. Therefore, for program equilibrium to work, there must be an enforcement mechanism that punishes those who submit deceptive code or tamper with the execution environment. This enforcement mechanism *is* the sword. It is a sovereign power that keeps the agents in awe of the rules of the computational game. If such a power exists, the agents are no longer in the state of nature; they are in a civil state governed by the rules of the platform. If such a power does not exist, the code is merely sophisticated words, and the rational man will defect.

  ### 3. The Computational Framework as Sovereign
  Hobbes defines the sovereign as a "common power to keep them all in awe." Program equilibrium implicitly requires a common power to keep the computational environment honest. The "radical mutual transparency" required by Tennenholtz's model is not a natural state; it is an artificial construct that must be enforced.

  If the agents are truly in a Hobbesian state of nature, they have the right to all things, including the right to deceive the opponent about their source code. To remove that right—to force them to be transparent—requires a transfer of right to a higher authority that manages the interaction. The "algorithm" does not replace the sovereign; the algorithm *is* the law, and the machine that executes it impartially *is* the sovereign.

  Hobbes would argue that the proponents of program equilibrium have not eliminated the sovereign; they have merely automated it. They have posited a Leviathan made of silicon rather than flesh, a power that compels performance not through the fear of physical punishment but through the architectural impossibility of defection. But this architectural impossibility is itself a form of coercion. If the system *forces* cooperation by making defection technically impossible, it is exercising absolute power. If the system does *not* force cooperation (i.e., if agents can bypass the system), then we are back to the state of nature, and the rational choice is to defect.

  ### Verdict
  Hobbes would maintain that program equilibrium is a category error. It attempts to solve a political problem (the insecurity of human covenants) with a logical solution (provability within a formal system). But politics concerns bodies and passions, not just propositions.

  Because human beings can lie about their code, and because verification requires a trusted authority, program equilibrium cannot function in the state of nature. It presupposes the very thing Hobbes argues is necessary: a common power that enforces the rules of interaction and punishes deception. Therefore, program equilibrium does not force a revision of Hobbes's argument for sovereignty. Instead, it confirms it: cooperation is only secure when there is a "sword"—whether a physical executioner or a trusted computational enforcer—capable of making the performance of covenants the rational choice. Without that power, the code is but words, and of no strength to secure a man at all.
