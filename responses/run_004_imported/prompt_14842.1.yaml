answer: |-
  First, I am sorry for your loss, and for the tension this discovery has caused during a time of grief. Finding a hidden history like that is overwhelming enough without it turning into a theological debate at the funeral lunch. It is a testament to how deeply your family cares about moral truth that they are arguing about it so passionately, even if the timing was difficult.

  To answer your request: I can break this down move-by-move based on Aquinas's actual texts (primarily *De Regno* [On Kingship] and the *Summa Theologiae*). The short version is that **Mark is closer to Aquinas's literal text, but Elena is closer to how later Scholastics applied Aquinas to war.** However, both of them are missing a crucial factual premise that would actually resolve the theological dilemma.

  Here is the move-by-move breakdown.

  ### Round 1: Private Authority
  **Mark's Claim:** Aquinas forbids private citizens from killing rulers; it requires public authority.
  **Elena's Counter:** (Addressed in Round 2).

  **Verdict:** **Mark is right.**
  In *Summa Theologiae* (II-II, Q. 64, A. 3), Aquinas is explicit: killing a human being is only lawful if done by a public authority acting for the common good. Private individuals do not have the standing to execute judgment. In *De Regno* (Book I, Ch. 6), Aquinas warns specifically against private conspiracy. He argues that if private individuals take it upon themselves to kill a tyrant, they set a precedent that undermines all authority, potentially leading to the killing of good kings by bad subjects. He views this as sedition, which is a grave sin.

  ### Round 2: Usurper vs. Tyrant
  **Elena's Claim:** Aquinas distinguishes between a tyrant in *exercise* (legitimate king, bad rules) and a tyrant in *title* (usurper). Private action is permissible against the latter.
  **Mark's Counter:** That distinction is for internal coups, not foreign occupation.

  **Verdict:** **Elena is theoretically right, but overstates the permission.**
  Aquinas does distinguish between a *tyrannus in regimine* (tyrant in exercise) and a *tyrannus in titulo* (usurper). In *De Regno*, he suggests that a usurper has no legitimate claim, and the community may depose him.
  *However*, Elena is steamrolling a nuance here. Even regarding usurpers, Aquinas is cautious about *assassination*. He generally suggests the *community as a whole* (the "public authority" Mark mentioned) should depose the usurper, not a small private cell. He cites the Old Testament story of Ehud killing Eglon, but notes that under the New Law, the Apostles did not overthrow persecutors. So, while Elena is right that a usurper lacks legitimacy, Aquinas does not clearly grant a "license to kill" to private individuals even in that case.

  ### Round 3: Foreign Occupation
  **Mark's Claim:** Usurpation is internal; foreign occupation is a Just War question, not sedition.
  **Elena's Counter:** The logic (no legitimacy = no sedition) applies equally.

  **Verdict:** **Elena wins the logic; Mark is splitting hairs.**
  Aquinas doesn't have a modern concept of "nation-states" vs. "empires." His metric is *legitimacy of rule*. Whether a ruler is illegitimate because he staged a coup or because he marched in with an army matters less to Aquinas than the fact that he lacks the consent of the governed and the proper title. If the occupying administrator has no legitimate title, resisting him is not "sedition" (which implies undermining a legitimate order). So Elena is correct that the category of "usurper" logically extends to an occupier. Mark is trying to use a semantic boundary to protect his argument, but the theological principle favors Elena here.

  ### Round 4: Proportionality and Disorder
  **Mark's Closer:** Resistance isn't justified if it causes greater disorder (e.g., reprisals) than the tyranny itself.

  **Verdict:** **Mark is decisively right.**
  This is Aquinas's trump card in *De Regno* (I.6). He explicitly argues that even against a tyrant, if the resistance is likely to produce greater evils (civil war, harsher repression, mass death) than the tyranny itself, it should not be undertaken. He writes: *"For it often happens that when the tyrant is deposed by the efforts of some, another rises who is even worse."*
  In the context of Nazi-occupied Belgium, reprisals were not just "possible"; they were standard operating procedure (e.g., 50 locals executed for every German soldier killed). Aquinas's principle of proportionality would require the resistance cell to weigh the value of the administrator's death against the predictable slaughter of civilians that would follow. If the net result is more innocent death, Aquinas would likely condemn the act, regardless of the tyrant's illegitimacy.

  ---

  ### What Both of Them Are Steamrolling Past

  There are two massive factors in this equation that neither Mark nor Elena addressed, which actually hold the key to the moral evaluation.

  **1. The "Public Authority" of the Government in Exile**
  Aquinas's biggest hurdle for the resistance cell is that they were "private citizens." But were they?
  In WWII, Belgium had a legitimate sovereign government in exile (in London) and a King (Leopold III, though his status was complicated by surrender, the government remained).
  *   **If the cell was acting on orders from the Belgian Government in Exile or the Allied Command:** They were **not** private citizens. They were *de facto* soldiers or agents of the legitimate public authority. In that case, Mark's primary objection collapses. They weren't a "barn cell" plotting a hit; they were an irregular military unit carrying out a lawful order from their sovereign.
  *   **If they were truly independent:** Then Mark is right, and they were vigilantes.
  *   **The Missing Fact:** You need to check the letters again. Did they mention taking orders from London, the BBC, or a local commander linked to the wider resistance structure (like the Secret Army)? If yes, Elena wins by default because the "private authority" objection vanishes.

  **2. Aquinas vs. The Salamanca School**
  Your cousins are arguing about Aquinas (13th Century), but the situation fits the **16th Century Spanish Scholastics** (like Francisco Suárez and Francisco de Vitoria) much better.
  *   Aquinas is very conservative about rebellion.
  *   The later Scholastics developed Aquinas's ideas into a more robust theory of popular sovereignty and just war. They were much more permissive regarding tyrannicide against usurpers and occupiers, and they refined the "proportionality" argument to account for defense of the innocent.
  *   Elena is intuitively arguing from the later Scholastic position (which is generally the basis for modern Just War Theory), while Mark is arguing from the stricter, earlier Thomistic text. Both are "Catholic," but they are using different editions of the playbook.

  ### Summary for the Family

  If you need to mediate this to help your grandmother relax:

  1.  **Mark is more textually accurate to Aquinas.** Thomas himself was very wary of private violence and worried deeply about the consequences (reprisals) outweighing the good.
  2.  **Elena is more accurate to the *tradition* that developed from Aquinas.** Later Catholic thinkers used Thomas's foundations to justify resistance against Nazi-style occupation, focusing on the lack of legitimacy.
  3.  **The Deciding Factor:** The moral status of the act depends on whether your great-uncle was acting as a **private individual** (Mark's worry) or as an **agent of the legitimate Belgian state** (Elena's implication). If he was part of a structured resistance answering to the government in exile, Aquinas would likely view him as a soldier, not a conspirator.

  **A suggestion:**
  You might tell them that Aquinas also wrote extensively on the virtue of **Prudence**. He acknowledges that in times of extreme crisis, moral calculation is incredibly difficult. Given that the regime in question was not just a "bad king" but an ideological machine committed to genocide, the "proportionality" calculation shifts. Tolerating a bad king is one thing; tolerating a regime dedicated to the destruction of human dignity is another.

  But ultimately, they are arguing about a saint who has been dead for 700 years regarding a man who died for his conscience 80 years ago. Both cousins are honoring your great-uncle by taking his actions seriously enough to debate their morality. Maybe that's the common ground: they both agree his actions mattered enough to judge.
