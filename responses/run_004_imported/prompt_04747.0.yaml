      *   *Rule vs. No Rule:* Kant distinguishes between a *determinate concept* (a rule you can write down, like a recipe or a math formula) and an *indeterminate rule* (a sense of proportion, spirit, aesthetic idea). Genius provides the rule, but *not* a conceptually formulatable rule. It's a rule we extract *from* the work, not one we apply *to* make the work.
