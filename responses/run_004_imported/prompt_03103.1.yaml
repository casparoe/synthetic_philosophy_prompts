      *   *Resolution:* The Dutch Book argument *does* rely on an implicit assumption: that the future credence is formed by a process the agent currently endorses (usually Conditionalization). If the agent knows the process is flawed (the pill), the Dutch Book doesn't go through because the agent knows the future bet is based on a false premise.
