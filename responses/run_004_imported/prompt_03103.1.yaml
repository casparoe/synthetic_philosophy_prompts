      *   *Question:* Is there a principled reason the cases come apart that they missed?
      *   *Philosophical Landscape:* This is a well-trodden area in formal epistemology.
      *   *Key Concept 1: Conditionalization.* RP is often derived from Conditionalization. If I know I will conditionalize on evidence $E$, then RP holds. If I know I will *not* conditionalize (e.g., the pill), RP doesn't hold.
