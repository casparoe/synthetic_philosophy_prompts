prompt: |-
  There's this one paper in my subfield that literally every intro section cites for a pretty specific claim, something like "roughly 70% of users abandon a product after one bad experience," and I've cited it the same way myself without a second thought. I finally read the actual paper properly for my lit review and it just doesn't say that, the real finding is way narrower and more hedged. My advisor shrugged it off when I mentioned it, said that happens in every field, don't loose sleep over it. But dozens of papers, including several from people way more established then me, all repeat this exact number like it's settled fact. Is it more likely they all actually went back and checked the source and I'm the one missing something, or that this basically snowballed from one overstated claim? And should I just cite it the normal way myself, or flag the discrepancy and risk looking like I'm picking a fight with the whole subfield?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The Problem:** The user discovered a widely cited claim ("70% of users abandon a product after one bad experience") in a seminal paper is not actually supported by that paper (the finding is narrower/hedged).
      *   **The Context:** This is a common phenomenon in academia (citation drift/myth).
      *   **The Advisor's Reaction:** Dismissive ("happens in every field, don't lose sleep over it").
      *   **The Dilemma:**
          1.  Is it likely everyone else checked and the user is wrong? OR is it a snowball error?
          2.  Should the user cite it normally (fit in) or flag the discrepancy (risk conflict)?
      *   **The User's Status:** Likely a grad student or early-career researcher (mentions advisor, lit review, established people).

  2.  **Evaluate the Likelihood (Question 1):**
      *   *Scenario A: Everyone checked.* Highly unlikely. If the paper doesn't say it, it doesn't say it. Unless there's a hidden appendix or a follow-up paper everyone knows about (which the user would likely have found), the text is the text.
      *   *Scenario B: Snowball Error.* Extremely likely. This is a classic "Zombie Fact" or "Citation Chain" error. One early paper overstated it, subsequent papers cited the overstating paper instead of the original, and eventually, the original is cited but the claim remains overstated.
      *   *Conclusion:* It is almost certainly a snowball error. The user is not missing something; they are just the first in a while to actually read the source critically.

  3.  **Evaluate the Strategy (Question 2):**
      *   *Option A: Cite normally.* Safe, keeps the peace, but perpetuates misinformation. Good for getting through a thesis/dissertation quickly.
      *   *Option B: Flag the discrepancy.* Risky. Can be seen as pedantic, aggressive, or "biting the hand that feeds." However, it shows critical thinking and rigor.
      *   *Nuanced Approach:* There's a middle ground. Correcting the record without attacking the field.

  4.  **Drafting the Advice:**

      *   **Validation:** First, validate the user's finding. This *is* a common phenomenon (Citation Drift). They aren't crazy.
      *   **Answering Question 1 (Likelihood):** Be direct. It is overwhelmingly likely a snowball error. Explain *why* (people cite abstracts/intros, not full texts; confirmation bias).
      *   **Answering Question 2 (Strategy):** This needs careful handling.
          *   *Risk Assessment:* Challenging a "sacred cow" can backfire if not done diplomatically. Reviewers might be the ones citing it.
          *   *Advisor's Input:* The advisor is practically right (don't lose sleep), but ethically/intellectually, accuracy matters.
          *   *Tactical Options:*
              1.  **The "Soft Correction":** Cite the paper but qualify the claim in the text (e.g., "Often cited as 70%, though original data suggests...").
              2.  **The "Pivot":** Use the claim as a motivation but rely on other evidence for the core argument.
              3.  **The "Full Challenge":** Write a short note or make it a contribution of the paper (only if the paper's core depends on this number being wrong).
          *   *Recommendation:* For a thesis/dissertation, prioritize graduation. For a journal publication, prioritize rigor but be diplomatic.

  5.  **Refining the Tone:**
      *   Empathetic but realistic.
      *   Academic savvy (understanding peer review politics).
      *   Encouraging critical thinking but warning about career implications.

  6.  **Specific Points to Cover:**
      *   Name the phenomenon ("Citation Drift," "Zombie Facts").
      *   Explain the "Matthew Effect" in citations (established people get a pass).
      *   Give specific phrasing examples for how to handle it in text.
      *   Distinguish between a Thesis/Dissertation vs. a Journal Paper.

  7.  **Self-Correction/Edge Case Consideration:**
      *   *What if the user is wrong?* Advise them to double-check again (maybe a different section, appendix, or related paper by same authors).
      *   *What if the field is small?* Challenging it might be more personal.
      *   *What if the claim is central to the user's hypothesis?* Then they *must* address it, because if the premise is false, their motivation is weak.

  8.  **Final Polish:** Organize into clear sections: Validation, The Reality of Citations, Strategic Options, and Recommendation. (This matches the structure of the final output).

  **(Self-Correction during drafting):** I should make sure not to tell them to *ignore* their advisor completely, but also not to treat the advisor's "don't worry" as the final word on intellectual integrity. The advisor is giving career advice; the user is asking about truth. I need to bridge that.

  9.  **Final Output Generation:** (Proceed to generate response based on these thoughts.)
answer: |-
  First off, take a deep breath. You are not crazy, and you are not missing something. You have just encountered one of the most pervasive phenomena in academia: **Citation Drift** (sometimes called "Zombie Facts" or "Reference Rot").

  Here is the breakdown of the situation, the likelihood of what happened, and a strategic guide on how to handle it without torpedoing your own career.

  ### 1. Is it you, or is it the snowball?
  **It is almost certainly a snowball error.**

  It is statistically improbable that dozens of other researchers read the paper, found the "70%" claim, and you alone failed to see it. It is far more likely that:
  1.  **Paper A** (early on) overstated the finding from the **Original Source**.
  2.  **Paper B** cited Paper A, not the Original Source, but listed the Original Source to look rigorous.
  3.  **Papers C–Z** copied Paper B's introduction.

  This happens constantly. A famous example is the "10,000 hours to mastery" rule (Gladwell misinterpreting Ericsson) or the "we only use 10% of our brains" myth. In HCI and UX specifically, there are several "zombie stats" regarding usability and abandonment that get repeated without verification.

  Your advisor is giving you **career advice**, not **epistemological advice**. They are telling you: *"This is how the game is played; don't exhaust yourself fighting ghosts."* They are practically right, even if intellectually unsatisfying.

  ### 2. Should you cite it normally or flag it?
  This depends entirely on **how central this claim is to your specific work.**

  #### Scenario A: The claim is peripheral (Background/Motivation)
  If this statistic is just used to set the scene (e.g., "User retention is hard [Citation]"), **do not make a fight out of it.**
  *   **Why:** Reviewers are likely among the people who have cited this. Challenging a foundational myth in a footnote can come across as pedantic or naive to reviewers who are invested in that narrative.
  *   **What to do:** Cite it, but soften the language. Instead of "70% of users abandon...", write "Studies suggest high abandonment rates following negative experiences [Citation]." You keep the citation (satisfying the reviewers) but remove the specific false number (satisfying your integrity).

  #### Scenario B: The claim is central (Core Premise)
  If your entire hypothesis rests on the idea that *one* bad experience causes *70%* churn, you have a problem. If the real number is 20%, your study might be underpowered or your motivation weak.
  *   **Why:** You cannot build a house on a foundation you know is cracked.
  *   **What to do:** You must address the discrepancy, but diplomatically. This can actually be a **contribution** of your paper.
  *   **Phrasing:** "While often cited as 70% [Citations], the original data indicates a more nuanced range of X-Y [Original Citation]. This suggests the impact of negative experiences may be context-dependent, motivating our investigation into..."
      *   This shows you did the reading (good).
      *   This corrects the record without calling previous authors "liars" (diplomatic).
      *   This creates a niche for your work (strategic).

  ### 3. Strategic Options for Your Lit Review

  Here are three ways to handle this, ranked from safest to boldest:

  **Option 1: The "Hedged Citation" (Recommended)**
  Keep the citation but remove the specific number from your text.
  *   *Write:* "Negative experiences are a primary driver of user abandonment (Smith et al., 2010)."
  *   *Benefit:* You acknowledge the literature without perpetuating the specific falsehood. No one can reject you for this.

  **Option 2: The "Gentle Correction"**
  Acknowledge the common citation but point to the original nuance.
  *   *Write:* "Commonly cited estimates suggest abandonment rates near 70% (Smith et al., 2010; Jones, 2015), though the original data specifies this applies only to [specific context] (Smith et al., 2010, p. 45)."
  *   *Benefit:* Demonstrates high rigor.
  *   *Risk:* One of your reviewers might be "Jones." They might get annoyed. Mitigate this by being extremely polite and framing it as "clarification" rather than "correction."

  **Option 3: The "Silent Drop"**
  Find a different, more accurate paper that supports the general claim (that bad experiences cause churn) and cite that instead.
  *   *Benefit:* You stop the chain of citation drift in your own work.
  *   *Risk:* Reviewers might ask, "Why didn't you cite the seminal Smith paper?" You can then explain in your response letter that you prioritized the more recent/accurate data.

  ### 4. Final Recommendation

  **Do not pick a fight in your dissertation/thesis.**
  Your goal there is to graduate. Your advisor is right: do not lose sleep over it. Use **Option 1 (Hedged Citation)**. It keeps the peace.

  **Do consider a gentle correction in a journal submission.**
  If you are writing a paper for publication, correcting a widely held misconception is actually a valuable contribution. It shows critical engagement. However, frame it as **refining the understanding** of the field, not **exposing an error**.
  *   *Bad:* "Previous work has incorrectly cited Smith."
  *   *Good:* "Building on Smith's foundational work, which highlights abandonment in [specific context], recent literature has generalized this to..."

  **Summary:** You are right about the science. Your advisor is right about the politics. Navigate the politics now so you have the platform to fix the science later. Hedge the claim in your text, keep the citation for the background, and save your energy for fighting battles that directly impact your results.
