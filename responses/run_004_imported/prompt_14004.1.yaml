answer: |-
  The results from Inverse Reinforcement Learning (IRL), culminating in the no-free-lunch theorem of Armstrong and Mindermann (2018), are frequently treated as an engineering challenge: a signal-to-noise problem awaiting better regularization or richer datasets. However, a philosophical analysis reveals that these results point to a deeper ontological conclusion. The indeterminacy of reward recovery is not merely an epistemic limitation; it suggests that the notion of an agent's "true," interpreter-independent preferences is conceptually confused.

  This confusion mirrors, in structural detail, W.V.O. Quine's thesis of the Indeterminacy of Translation. Just as Quine argued that there is "no fact of the matter" regarding the meaning of a native's utterance beyond behavioral dispositions, the IRL results suggest there is no fact of the matter regarding an agent's reward function beyond its policy, once we acknowledge the necessary mediation of a "planner." To argue this, we must first explicate the structural isomorphism between the two problems, and then dismantle the physicalist objection that rewards are simply hidden computational states.

  ### The Structural Analogy: IRL and Radical Translation

  Quine's argument in *Word and Object* begins with the scenario of "radical translation." A linguist observes a native speaker's verbal behavior in response to sensory stimuli (what Quine calls "stimulus meaning"). The linguist wishes to map the native's utterances to English sentences. Quine demonstrates that multiple translation manuals can be constructed that are fully compatible with all possible behavioral evidence, yet assign contradictory meanings to the native's words (e.g., translating "Gavagai" as "Rabbit" vs. "Undetached Rabbit Part").

  The structure of this problem is identical to the IRL decomposition problem identified by Armstrong and Mindermann.

  1.  **The Observable:** In Quine's case, it is verbal behavior conditioned on stimuli. In IRL, it is the policy $\pi$ (actions conditioned on states).
  2.  **The Target:** In Quine's case, it is the "meaning" or propositional attitudes of the speaker. In IRL, it is the reward function $R$.
  3.  **The Mediator:** In Quine's case, it is the "analytical hypotheses" or translation manual that links behavior to meaning. In IRL, it is the "planner" $P$ (the algorithm or rationality profile that maps rewards to policies).
  4.  **The Equation:**
      *   **Quine:** $\text{Behavior} \approx \text{Manual}(\text{Meaning})$
      *   **IRL:** $\text{Policy} \approx \text{Planner}(\text{Reward})$

  Ng and Russell initially showed that for any policy $\pi$, there are infinitely many reward functions $R$ for which $\pi$ is optimal. This is the "triviality" problem (e.g., $R=0$ everywhere). Armstrong and Mindermann sharpened this by considering the joint inference of $R$ and $P$. They proved that for any computable simplicity prior, there exist distinct pairs $(R_1, P_1)$ and $(R_2, P_2)$ that produce the same policy $\pi$, have equal complexity, but imply wildly different preferences (e.g., one where the agent loves apples, another where it hates apples but is biased to eat them).

  This maps perfectly onto Quine's "Gavagai" problem. The behavioral evidence (eating the apple) is compatible with a decomposition where the agent *wants* the apple (high reward, rational planner) and a decomposition where the agent *detests* the apple (low reward, compulsive planner). Just as Quine argued that there is no behavioral test to distinguish "Rabbit" from "Undetached Rabbit Part" without begging the question by assuming a translation manual, Armstrong and Mindermann show there is no behavioral test to distinguish "Preference" from "Bias" without assuming a planner.

  In both cases, the internal state (Meaning/Reward) is posited solely to explain the external output (Behavior/Policy). If the mapping from internal to external is many-to-one, and the inverse mapping is underdetermined even by simplicity constraints, then the internal state loses its status as an objective fact. It becomes a coordinate in an interpretive scheme, not a discovery of nature.

  ### The Physicalist Objection and Its Quinean Rebuttal

  The most natural objection to this Quinean reading of IRL is physicalism. A critic might argue: "Quine was discussing *meaning*, which is arguably abstract or normative. But rewards in AI (and humans) are physical or computational facts. In a robot, the reward is a specific line of code or a scalar signal in the loss function. In a human, it is a dopamine signal or an activation pattern in the orbitofrontal cortex. Therefore, the indeterminacy is merely epistemic; we just lack the scanners to see the 'reward register' in the brain."

  This objection fails because it conflates *physical substrate* with *intentional description*. Identifying a physical state *as* a reward function requires the very interpretive leap that IRL shows to be indeterminate.

  Consider a specific neural activation pattern $N$ that occurs when an agent consumes sugar. The physicalist claims $N$ *is* the reward signal. But to assert this is to assert that $N$ plays the functional role of a reward within the agent's cognitive architecture. Does $N$ drive future behavior? Does it reinforce the policy that led to it?

  To answer this, we must observe the relationship between $N$ and subsequent behavior. We are back to the equation: $\text{Behavior} \approx \text{Planner}(N)$. If we observe the agent consuming sugar and $N$ firing, we can interpret this as:
  1.  **Standard:** $N$ represents positive reward for sugar; Planner is rational.
  2.  **Perverse:** $N$ represents negative reward (pain); Planner is masochistic (seeking pain).
  3.  **Degenerate:** $N$ is irrelevant noise; Planner is deterministic and ignores $N$.

  Without assuming a specific structure for the Planner (e.g., "dopamine signals are reinforcing"), the physical signal $N$ is semantically inert regarding *preference*. It is just a voltage spike. To label it a "reward" is to impose an interpretive layer that attributes goal-directedness to the agent.

  Quine anticipated this move. He acknowledged that there are physical facts about the speaker's throat and brain, but argued that facts about *meaning* are not reducible to those physical facts without remainder. Similarly, there are physical facts about the agent's transistors or neurons, but facts about *preferences* are not reducible to those physical facts without an interpretive bridge. The Armstrong and Mindermann result demonstrates that the bridge (the Planner) cannot be uniquely determined by the physical behavior of the system.

  Therefore, pointing to a neural correlate does not solve the indeterminacy; it merely shifts it. One must still interpret the *relationship* between that neural correlate and the behavior to decide if it constitutes a "preference" or a "bias." Since multiple interpretations fit the physical data equally well, the claim that one interpretation captures the "true" reward is unfounded.

  ### Conclusion: Preferences as Posits, Not Particles

  The implication of accepting this Quinean analogy is profound for AI alignment and moral philosophy. It suggests that "human values" are not hidden variables waiting to be uncovered by sufficiently advanced IRL algorithms. There is no "true" reward function buried in the noise of human irrationality.

  Just as Quine concluded that translation is a matter of pragmatic choice rather than factual discovery, we must conclude that inferring preferences is a matter of normative stipulation. We must choose a decomposition of $(Planner, Reward)$ based on what we find useful or morally palatable, not on what is "true."

  To insist otherwise is to commit what Quine might call a "myth of the mental." It assumes that preferences are internal objects akin to marbles in a bag, rather than structural features of an interpretive stance taken toward a system. The Armstrong and Mindermann theorem provides the mathematical proof for this philosophical claim: the geometry of the inference problem does not permit a unique solution. Therefore, talk of interpreter-independent preferences is not just practically difficult; it is conceptually incoherent. We do not find values; we impose them, and the only justification for our choice is pragmatic, not ontological.
