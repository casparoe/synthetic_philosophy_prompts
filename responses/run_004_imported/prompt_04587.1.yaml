      *   *Implication for Fiction:* The nature of the "cold-minded man."

  *(Self-Correction during drafting)*: I need to be careful not to say "Frege was right." I must say "Frege was consistent." The prompt asks to argue it was a "logically valid use." In logic, "valid" means the conclusion follows from the premises. I can argue that *if* one accepts Frege's ontological premises about race, the logic holds. That is the safe and accurate philosophical lane.

