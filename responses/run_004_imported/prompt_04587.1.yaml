answer: |-
  To argue this thesis is to step into a cold room where the air is thin and the light is harsh. It requires us to suspend moral judgment not to excuse the monster, but to understand the architecture of his monstrosity. The comfortable defense—championed by Michael Dummett and many others—is that Frege's logic was a pristine cathedral, while his politics were a muddy shack built in the garden. We are told that the *Begriffsschrift* is pure reason, and the diary is mere human failing.

  But if we look closely at the machinery of Frege's thought, the wall between the cathedral and the shack dissolves. The argument that Frege's application of the "ancestral" to racial heredity was logically *valid* (though morally abhorrent and factually unsound) rests on the realization that Frege did not view logic as a tool for inquiry, but as a law of being. For Frege, logic was not just how we think; it was how the world *is*.

  Here is the argument for the structural coherence of Frege's error, and why the "separate rooms" defense fails.

  ### 1. The Ancestral as Ontology, Not Just Syntax
  To understand why this isn't a simple fallacy of equivocation, we must understand what the "ancestral" relation meant to Frege. In his logic, to define the natural numbers, Frege needed a way to ensure that a property propagates indefinitely down a chain. If property $F$ is "hereditary" in the $R$-series, and $x$ has $F$, then every successor of $x$ must have $F$. This is the engine of mathematical induction.

  For most logicians, this is a syntactic trick. For Frege, it was an ontological claim about stability and transmission. He believed in a realm of objective Truths that were rigid, immutable, and transmissible. When he turned his gaze to the German nation, he did not switch to a different mode of thinking. He looked for the same rigidity. He posited "Germanness" (or "Aryan descent") as a property $F$, and biological genealogy as the relation $R$.

  If one accepts the premise that "race" is a fixed, logical property rather than a fluid social construct, then the inference is formally valid.
  *   **Premise 1:** A property is hereditary if, possessing it in a sequence, it transmits to all successors (Logical Definition).
  *   **Premise 2:** "Aryan descent" is a property transmitted through biological sequence (Empirical/Biological Claim).
  *   **Conclusion:** Therefore, "Aryan descent" is a hereditary property in the logical sense.

  This is not equivocation. Equivocation occurs when a term shifts meaning mid-argument. Frege did not shift the meaning; he *imposed* the logical meaning onto the biological reality. He believed the biological reality *ought* to conform to the logical form. The error is not in the inference (the logic holds); the error is strictly in Premise 2, which is scientifically false and morally monstrous. But within the closed system of Frege's mind, the deduction is tight.

  ### 2. The Will to Absolute Order
  The "separate rooms" theory suggests that a man can be a master of objective reason in one hour and a slave to subjective prejudice in the next. This assumes that logic is a neutral skill, like carpentry. But Frege's logic was driven by a terror of ambiguity. His entire life's work was an attempt to purge language and thought of the psychological, the subjective, and the vague.

  His antisemitism was not a lapse in reason; it was an extension of this purge. In his diary, Frege expresses disgust at the "mixed" nature of modern society, the blurring of boundaries, the influence of foreign elements. This is the political mirror of his logical project. Just as he sought to purify arithmetic of psychological contamination, he sought to purify the *Volk* of genetic contamination.

  To argue that these are separate is to ignore the driving force of his intellect: a demand for absolute, transmissible order. The "ancestral" relation is the mathematical guarantee that order persists through time. When Frege applies this to race, he is attempting to secure the German nation against the entropy of history using the same logical bolt he used to secure the number series. The horror is not that he abused his logic; it is that his logic was designed to crush ambiguity, and he viewed human diversity as ambiguity.

  ### 3. Rebutting Dummett's Compartmentalization
  Michael Dummett, a towering Frege scholar and a man of genuine moral conscience, wrote that he was "deeply shocked" by the diary. He struggled to reconcile the liberator of modern logic with the advocate of authoritarian restriction. Dummett's implicit solution was to treat the politics as an irrational outburst, irrelevant to the *Grundgesetze*.

  But this comforts us at the cost of truth. If Frege's logic is truly a description of the "laws of thought," then it cannot be walled off from the laws by which he thought about society. If the laws of logic demand sharp boundaries, clear transmission, and the exclusion of the "arbitrary," then a thinker who internalizes those laws will inevitably view social "arbitrariness" (like multiculturalism or democracy) as a violation of logical law.

  Dummett wanted to save Frege by saying his politics were *illogical*. The uncomfortable thesis is that his politics were *hyper-logical*. They followed the internal gravity of his system to its natural conclusion. Frege believed that truth was objective and accessible only to those properly constituted to receive it. If one believes that logical capacity is tied to the "purity" of the mind, and the mind is tied to the blood, then the exclusion of the "other" becomes a logical necessity, not just a emotional prejudice.

  ### 4. Implications for Your Character
  For your fiction, this distinction is vital. A character who is a "wicked man abusing a neutral tool" is a villain who knows better but chooses evil. That is a moral failure.

  A character who is "logically consistent within a monstrous framework" is something far more chilling. He is a man who cannot see the evil because he is blinded by the coherence of his own system. He does not feel he is hating; he feels he is *correcting*. He does not feel he is excluding; he feels he is *defining*.

  When your character uses his genius to justify his convictions, he should not feel the friction of hypocrisy. He should feel the smooth click of a key turning in a lock. The terror of such a man is not that he abandons reason to embrace hate, but that he embraces hate *because* it looks like reason to him. He has formalized his prejudice until it looks like a theorem.

  ### Conclusion
  To claim Frege's use of the ancestral was valid is not to vindicate him. It is to indict the notion that formal systems are safe from the souls of their creators. The flaw was indeed in the premises—specifically the premise that human worth can be treated as a hereditary property in a logical sequence. But once that premise is granted, the machinery of Frege's logic grinds forward without hesitation.

  The "separate rooms" defense is a comfort for those who wish to believe that brilliance inoculates against barbarism. The reality is that brilliance often provides the structural beams for the barbarism to stand. Frege's diary is not a stain on the floor of his cathedral; it is the foundation. To understand the cold-minded man, you must understand that he does not live in two rooms. He lives in one, and he has locked the door from the inside.
