      *   **Core Conflict:** The user identifies a tension: Borges denies the persisting self to deny time. Rovelli *requires* an observer (a macroscopic system with memory/entropy) to *generate* the appearance of time.
      *   **Specific Question:** If Borges read Rovelli, how would he react? Vindication or pushback?
