  **Move 1 (Dave):** Dave correctly identifies the concept of testimonial injustice but applies it dogmatically; claiming it is "case closed" ignores the epistemic nuance regarding the reliability of lip-reading itself, which weakens his philosophical precision.

  **Move 2 (Meg):** Meg scores highly here by introducing factual epistemic limits; distinguishing between prejudice against a person and skepticism about a method (lip-reading) is crucial for accurately applying Fricker's theory.

  **Move 3 (Dave):** This is a strong logical pivot regarding visual evidence, but it scores lower because it relies on interpreting "writes her off" as dismissing visual facts rather than just the utility of her testimony overall.

  **Move 4 (Meg):** Meg lands the decisive philosophical point by noting that Fricker requires *identity prejudice* specifically; generic investigator sloppiness or the "halo effect" of a shaky detail does not meet the threshold for injustice without proof of bias.

  **Closing Analysis:**
  Dave is winning on moral intuition (the "vibes" of ableism), while Meg is winning on philosophical technicality. Both are missing the **counterfactual test**: to prove testimonial injustice, you must ask if the detective would discount a *hearing* witness who said, "I saw the car clearly but only caught one phrase of conversation." If he would accept the hearing witness but reject Mara, it's prejudice (Dave); if he rejects both, it's generic sloppiness (Meg). Additionally, they might be overlooking **hermeneutical injustice**: the detective may lack the social resources to understand how Deaf witnesses gather evidence, which is a structural failure distinct from individual prejudice.
