  This is a sharp critique. You've identified the core tension between **Ex-Ante Pareto Efficiency** (which Harsanyi guarantees) and **Ex-Post Equity** (which Harsanyi ignores).

  The standard "one kidney, two patients" example is indeed the go-to, but it relies on the good being indivisible. To show that this isn't just an artifact of indivisibility—or even risk-neutrality—we need a scenario with continuous outcomes where we explicitly calibrate the utilities so the planner is mathematically indifferent, yet the *realized* worlds look morally distinct.

  Here is a concrete example that fits your constraints: **The "Shared Fate" vs. "Arbitrary Sacrifice" Scenario.**

  ### The Setup
  *   **Agents:** Alice and Bob.
  *   **Utility Function:** Both have the **exact same** von Neumann-Morgenstern utility function $U(x)$, where $x$ represents lifetime wealth or health capital. Let's assume they are risk-averse (concave $U$), which is standard.
  *   **The Constraint:** A societal cost must be absorbed (e.g., economic contraction due to climate policy, or exposure to a pollutant).
  *   **Harsanyi Planner:** Maximizes the sum of expected utilities: $W = E[U_A] + E[U_B]$.

  ### The Two Policies

  **Policy 1: The "Shared Burden" (Deterministic Equality)**
  The policy spreads the cost evenly across the population.
  *   **Outcome:** Alice receives outcome $M$ (Moderate). Bob receives outcome $M$.
  *   **Probability:** 100%.
  *   **Expected Utility:**
      *   $E[U_A] = U(M)$
      *   $E[U_B] = U(M)$
      *   **Social Welfare:** $2 \cdot U(M)$

  **Policy 2: The "Sacrificial Lottery" (Ex-Post Inequality)**
  The policy concentrates the cost on one person, chosen by a fair coin flip, but adjusts the magnitude of the outcomes so that the *expected utility* for each individual remains identical to Policy 1.
  *   **Outcome:**
      *   **Heads (50%):** Alice gets $L$ (Low/Bad), Bob gets $H$ (High/Good).
      *   **Tails (50%):** Alice gets $H$, Bob gets $L$.
  *   **Calibration:** We choose $H$ and $L$ such that the certainty equivalent of the lottery is exactly $M$. That is:
      $$U(M) = 0.5 \cdot U(H) + 0.5 \cdot U(L)$$
      *(Note: Because they are risk-averse, $H$ must be significantly better than $M$ to compensate for $L$ being worse than $M$, but mathematically this is always possible.)*
  *   **Expected Utility:**
      *   $E[U_A] = 0.5 \cdot U(L) + 0.5 \cdot U(H) = U(M)$
      *   $E[U_B] = 0.5 \cdot U(H) + 0.5 \cdot U(L) = U(M)$
      *   **Social Welfare:** $2 \cdot U(M)$

  ### The Harsanyi Verdict
  The Harsanyi planner is **strictly indifferent**.
  *   The Pareto condition is satisfied (neither policy is better for both agents ex-ante).
  *   The vNM axioms are satisfied.
  *   The sum of expected utilities is identical ($2 \cdot U(M)$).
  *   Since everyone has the *same* utility function, this isn't about interpersonal comparison weights; the weights are implicitly equal.

  ### The Ex-Post Fairness Gap
  Now, imagine the "dice have landed." The uncertainty has resolved. We are living in the realized world.

  **In Policy 1 (Shared Burden):**
  *   You look around. Alice has $M$. Bob has $M$.
  *   **Ex-Post Status:** Perfect equality. No one has grounds for envy. Everyone endured the same fate.

  **In Policy 2 (Sacrificial Lottery):**
  *   The coin landed Heads.
  *   You look around. Alice has $L$ (she is ruined/sick). Bob has $H$ (he is thriving).
  *   **Ex-Post Status:** Maximal inequality.
  *   **The Intuition:** Even though the *procedure* was fair (a fair coin), the *outcome* is one where one person was effectively sacrificed for the other's benefit. Alice can legitimately say, "Why me?" Bob got a windfall solely due to the coin toss.

  ### Why This Isn't the "Indivisible Good" Case
  In the classic kidney case, the argument for the lottery is often that *not* flipping the coin means *no one* gets the kidney (or a deterministic split destroys the value).

  In this example, **Policy 1 is feasible.** We *could* have spread the burden evenly ($M, M$). We *chose* the lottery ($H, L$).
  *   A Harsanyi planner sees no difference between a society where everyone is moderately comfortable and a society where half are destitute and half are rich (provided the expectations matched ex-ante).
  *   Most human fairness intuitions scream that Policy 1 is superior because it avoids **ex-post resentment** and **arbitrary inequality**.

  ### The "Same Utility Function" Bonus
  Because we stipulated $U_A = U_B$, we rule out the defense that "maybe Alice valued the money less anyway." They value it exactly the same. The Harsanyi theorem, by aggregating *expectations*, washes out the **variance across persons in a given state**.

  It treats the inequality in Policy 2 as morally irrelevant because it was "consented to" behind the veil of ignorance (ex-ante). But once the veil lifts (ex-post), the theorem offers no resources to condemn a world where Alice suffers and Bob thrives, even though their ex-ante positions were identical.

  This demonstrates that Harsanyi's utilitarianism is fundamentally a theory of **procedural fairness under uncertainty**, not **distributive justice under certainty**. It validates policies that look like tyranny once the uncertainty resolves.
