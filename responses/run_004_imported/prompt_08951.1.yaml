          *   We need to show that at $\omega$, agent $i$ knows $K_i E$.
          *   Since $\omega \in \mathcal{P}_i(\omega)$ and $\mathcal{P}_i(\omega) \subseteq E$, every state $\omega'$ in $\mathcal{P}_i(\omega)$ has the *same* partition cell ($\mathcal{P}_i(\omega') = \mathcal{P}_i(\omega)$).
          *   Therefore, for all $\omega' \in \mathcal{P}_i(\omega)$, $\mathcal{P}_i(\omega') \subseteq E$, so $i$ knows $E$ at all $\omega'$.
          *   Thus, $\mathcal{P}_i(\omega) \subseteq K_i E$.
          *   So $i$ knows that they know $E$.
      *   *Key takeaway:* It's structural. Partitions are disjoint and exhaustive. Indistinguishability is an equivalence relation (transitive). If $\omega \sim \omega'$ and $\omega' \sim \omega''$, then $\omega \sim \omega''$. This transitivity forces KK.

