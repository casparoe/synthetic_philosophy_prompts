          *   *Refinement:* Make it sharper. Lewis calls it a "cost." Ask if the theoretical benefits *really* outweigh the ontological extravagance.
          *   *Follow-up:* If she says "theoretical utility," push on whether *any* crazy theory could be saved by utility.

      *   *Topic 2: Epistemic Access.*
