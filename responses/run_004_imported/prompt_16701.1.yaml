          *   *Refinement:* Focus on *de se* modal claims. "I could have been a baker." If it's a counterpart, isn't that cold comfort?
          *   *Follow-up:* If she says "counterparts preserve truth conditions," ask if truth conditions matter more than *identity*.

      *   *Topic 6: Falsification (Required Ending).*
          *   *Draft:* What would prove you wrong?
          *   *Refinement:* Make it concrete. Is the view unfalsifiable?
          *   *Follow-up:* (Not needed for the last one, but good to keep in mind).

      *   *Filling the Gaps (Need 8-10 total).*
          *   *Intro:* Why Lewis over ersatzism?
          *   *Ethics:* Does this change how we value things? (Modal ethics).
          *   *Math/Tegmark:* Since the host likes Tegmark, link Lewis to the Mathematical Universe Hypothesis. (Perfect for this host).
          *   *Parsimony:* Qualitative vs. Quantitative parsimony.

  4.  **Refining and Polishing:**
