answer: |-
  Here are 10 interview questions tailored for your podcast. They are designed to be precise enough to show you've done the reading, but conversational enough for audio. I've included the "Likely Lewisian Defense" and a "Sharp Follow-up" for each to keep you from getting stuck if she gives a textbook answer.

  ### 1. The "Ersatz" Alternative
  **Question:** "Let's start with the landscape. A lot of modal realists try to soften the blow by arguing for 'ersatz' worlds—worlds as abstract descriptions or stories rather than concrete places. You're defending the hardline Lewisian view that these worlds are flesh-and-blood concrete. What is the specific theoretical payoff that *only* concrete realism gives us, which abstract surrogates can't?"

  *   **Likely Defense:** She will argue that abstract worlds can't ground the truth of modal claims without circularity, or that they fail to analyze modality reductively.
  *   **Follow-up:** "If the gain is purely analytical neatness, is it worth buying an infinite ontology of universes just to save us from saying 'possibly' is a primitive concept? That seems like burning down the house to kill a spider."

  ### 2. The Incredulous Stare (Required)
  **Question:** "Lewis famously addresses the 'incredulous stare'—the intuition that his view is just obviously insane. He dismisses this as not being an argument. But in science, if a theory violates our basic intuitions about reality without empirical backup, we usually reject it. Why should philosophy treat 'ontological plausibility' as a cheaper currency than physics does?"

  *   **Likely Defense:** She will say common sense is a poor guide to fundamental ontology (citing quantum mechanics or relativity) and that theoretical utility trumps intuition.
  *   **Follow-up:** "Physics eventually gave us empirical ways to test those counter-intuitive theories. If Modal Realism is empirically sterile, isn't the 'incredulous stare' actually a sanity check we shouldn't override?"

  ### 3. Epistemic Access (Required)
  **Question:** "If these worlds are causally isolated from us—no light, no gravity, no signal reaches us across the modal divide—how do we have epistemic access to them? If I can't interact with an object, standard epistemology suggests I can't know it exists. Are we claiming a kind of modal clairvoyance?"

  *   **Likely Defense:** She will likely argue we know them by description or through their role in our best semantic theories, not by causal contact.
  *   **Follow-up:** "But if they are *concrete* particulars, knowing them by description feels like knowing a specific person just by reading a biography. How does a description lock onto a specific concrete universe rather than just a concept?"

  ### 4. Indexicality of 'Actual' (Required)
  **Question:** "Lewis argues 'actual' is indexical, like 'here' or 'now.' My world is actual to me, just as this location is 'here' to me. But 'here' feels privileged to me in a way 'there' doesn't. Does calling it indexical actually explain away the special status of our reality, or does it just relabel the mystery?"

  *   **Likely Defense:** She will argue the feeling of privilege is psychological, not ontological. There is no 'absolute actuality.'
  *   **Follow-up:** "If the feeling of privilege is an illusion, why did evolution hardwire us to feel like *this* world is the only concrete one? It seems like a maladaptive false belief if Lewis is right."

  ### 5. The Recombination Principle (Required)
  **Question:** "You'll likely rely on the 'principle of recombination' to explain possibility without circularity—roughly, that anything can coexist with anything else. But doesn't saying two elements *can* be recombined already smuggle in the modal notion of 'possibility' you're trying to define?"

  *   **Likely Defense:** She will claim recombination is a principle of plenitude about the arrangement of elements, not a modal claim.
  *   **Follow-up:** "But if you say 'these elements are capable of being arranged,' aren't you using a modal verb to define modality? How do you state the principle without using the word 'can'?"

  ### 6. Kripke and Counterpart Theory (Required)
  **Question:** "Kripke argued that Counterpart Theory changes the subject. When I say 'I could have been a baker,' I care about *me* having that potential. If it's just a counterpart—a distinct person who resembles me—in another world, that feels like cold comfort. Why should I care about the successes of my modal twins?"

  *   **Likely Defense:** She will argue that truth conditions are satisfied; the statement is true if a counterpart is a baker, which is all logic requires.
  *   **Follow-up:** "Logic might be satisfied, but *identity* isn't. If I'm not actually in that world, isn't Modal Realism telling me that *I* never could have been anything other than what I am?"

  ### 7. Quantitative vs. Qualitative Parsimony
  **Question:** "Philosophers often defend Lewis by saying his view is qualitatively parsimonious (same kinds of stuff) even if quantitatively extravagant (lots of stuff). But in software engineering, we know that scaling an architecture infinitely usually breaks the system. Is there a point where quantitative bloat becomes a qualitative problem?"

  *   **Likely Defense:** She will argue that since the worlds are isolated, they don't add complexity to the laws governing *our* world.
  *   **Follow-up:** "But if the theory posits infinite entities, doesn't that lower the prior probability of the theory being true to effectively zero? How do you overcome that Bayesian penalty?"

  ### 8. The Tegmark Connection (Host Interest)
  **Question:** "I got into this via Max Tegmark's Mathematical Universe Hypothesis, which suggests all mathematical structures exist physically. Lewis's worlds seem like a subset of that. Do you see your view as compatible with Tegmark's, or does Lewis's requirement for spatiotemporal relations rule out purely mathematical structures?"

  *   **Likely Defense:** She will likely distinguish between Lewis's concrete spatiotemporal worlds and abstract mathematical structures.
  *   **Follow-up:** "If Tegmark is right and all math exists, doesn't that make Lewis's view *too* conservative? Why stop at spatiotemporal worlds and not include the non-spatiotemporal ones too?"

  ### 9. Ethical Implications
  **Question:** "If every possible outcome happens in some concrete world, does that change how we value our choices? If there's a world where I save the drowning child and one where I don't, is my decision here less significant because the 'good' version of me exists somewhere?"

  *   **Likely Defense:** She will argue that ethics is local to the agent in their world; other counterparts don't absolve local responsibility.
  *   **Follow-up:** "But if the total amount of good and evil across the pluriverse is fixed, does our local effort feel like it's just playing out a script rather than changing the total sum of value?"

  ### 10. Falsification (The Closer)
  **Question:** "I want to end on the limits of the view. Given that these worlds are causally isolated and the theory is designed to be analytically self-contained: What evidence, if any, could convince *you* that Modal Realism is false? Is there a scenario where you would update away from Lewis?"

  *   **Likely Defense:** (This is usually hard for Lewisians). She might say if a better theory comes along that explains modality with less ontological cost.
  *   **Follow-up:** "So it's not that the view is unfalsifiable, but that the bar for a competitor is incredibly high. Thank you for joining me."
