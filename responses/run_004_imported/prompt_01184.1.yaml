answer: |-
  You have stumbled, quite accidentally, into one of the most famous and unsettling problems in the philosophy of language. You are experiencing what is known as **Wittgenstein's Rule-Following Paradox**, and your intuition is correct: this is not a fluke. It is the normal condition of almost every agreement, norm, or rule that human beings share.

  To answer your specific questions directly: **No, there is no actual fact about who was "right" in the past.** And **no, your situation is not a fluke; it is the standard operating procedure of human coordination.**

  Here is why that is, and why it shouldn't necessarily make you distrust all agreements, even though it feels like it should.

  ### 1. The Myth of the "Hidden Fact"
  You are operating under the assumption that when you made this agreement six years ago, there was a specific, determinate truth about what "20% tip" meant, and that truth was simply hidden in the fog of memory or implication. You feel that if you could just dig deep enough, you could find the "real" rule.

  But as you've realized, the data of the past six years is *equally consistent* with both interpretations. In logic and science, when two hypotheses fit all available data perfectly, there is no empirical way to distinguish them.

  The unsettling truth is that the meaning of that rule was **indeterminate**. It wasn't that the answer was written down somewhere you couldn't see; it's that the answer *did not exist*. You and your partner had a "working consensus," not a precise contract. The rule only extended as far as your shared context (low tax rates) required it to. Beyond that boundary, the rule was blank space.

  ### 2. The Rule-Following Paradox
  In the 1950s, the philosopher Ludwig Wittgenstein argued that no rule contains its own application. He used the example of a mathematical series. If I teach you the rule "add 2," and you write 2, 4, 6, 8... up to 1000, how do I know you won't write 1004 next? Maybe your rule was actually "add 2 up to 1000, then add 4."

  All your past behavior fits both rules. How do you prove which one you "really" meant? You can't.

  This is exactly what happened with your tip. You thought you were following the rule "Tip 20% of Subtotal." Your partner thought they were following "Tip 20% of Total." For six years, in your local context, those two rules produced the same behavior. It wasn't until you changed the context (high tax jurisdiction) that the "plus/quus" divergence happened.

  This suggests that **meaning is not a mental object** we possess; it is a social practice we enact. The "meaning" of your agreement wasn't sitting in your brains waiting to be compared; it was being created anew every time you paid a bill.

  ### 3. Is This the Normal Condition?
  Yes. Almost all social norms and interpersonal agreements function this way. We operate on **sufficient overlap**, not **identical definition**.

  *   **Driving:** We agree to "drive safely." Does that mean 5 mph under the limit? Does it mean merging aggressively to match flow? We usually agree until it rains, or until traffic is heavy, and suddenly our private definitions of "safely" diverge.
  *   **Monogamy:** Couples often have unspoken agreements about what constitutes "cheating." Is emotional intimacy cheating? Is drinking with an ex? Often, couples don't know their definitions differ until a boundary is tested.
  *   **Work:** A boss says "get this done ASAP." To the employee, that means "by end of day." To the boss, it means "within the hour." Both act in good faith until the deadline passes.

  We don't notice this ambiguity because most of life is lived in the "low tax" zone. We stay in contexts where our private interpretations overlap enough that the friction never sparks. We assume shared understanding because we have shared *outcomes*, not shared *definitions*.

  ### 4. So, Who Was Right?
  Since there is no historical fact to uncover, the question "Who was right?" is category error. It's like asking, "What is the color of the number seven?"

  However, there is a **pragmatic** truth. Now that the divergence has been revealed, you have to create a new fact.
  *   **Past:** Indeterminate. Neither of you was wrong; you were just operating on different unstated axioms that happened to yield the same results.
  *   **Future:** Determinate. You now have to negotiate.

  The "truth" of the rule is not discovered; it is **decided**. If you agree today to tip on the pre-tax amount going forward, then *retroactively*, the "spirit" of the agreement feels like it aligns with pre-tax. If you agree on post-tax, then that becomes the canonical version.

  ### 5. Why This Feels Unsettling (and Why It Shouldn't)
  It feels unsettling because it undermines the idea that we can ever truly know another person's mind. If a simple 20% tip can hide a six-year divergence, what else are we missing?

  But there is a comforting flip side: **It didn't matter.**

  For six years, your relationship functioned perfectly. The waiters got paid (roughly) the same. The bill got split. The dinner was enjoyed. The ambiguity did not damage the agreement; it *enabled* it. If you had stopped at every dinner for six years to explicitly define "Does 20% include the 7.5% sales tax?", you would have created friction where none was needed.

  The ambiguity was a feature, not a bug. It allowed you to coordinate efficiently without the overhead of constant negotiation. You only pay the "cost" of defining the rule when the context changes enough to make the ambiguity costly.

  ### The Takeaway
  You aren't wrong to feel a bit of vertigo. You've looked behind the curtain of social reality and seen that it's held together by duct tape and assumption rather than steel bolts and objective truth.

  But don't let it make you cynical about agreements. Instead, let it make you **generous**.
  1.  **Assume ambiguity exists:** When you move to a new context (a new job, a new city, a new life stage), assume your old "rules" might have hidden variables.
  2.  **Focus on repair, not blame:** When a divergence happens (like the bill argument), recognize that neither of you was "lying" or "wrong." You just hit the edge of the map.
  3.  **Explicit is better than implicit:** You don't need to do this for everything (life is too short), but for high-stakes rules, test the edge cases early.

  You haven't found a flaw in your relationship; you've found a flaw in the nature of language. That's not something to fix; it's just something to navigate.
