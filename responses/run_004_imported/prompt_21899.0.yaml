  The numbers on the whiteboard were drifting apart like magnets with reversed poles.

  "Zero point seven," Elias said. His voice was flat, calibrated.

  "Zero point three," Julian replied. He didn't look up from his tablet.

  Elias erased the previous pair—0.65 and 0.35—and wrote the new ones. They had been doing this for forty minutes. By all rights, the gap should have been closing. They were both perfect Bayesians. They had access to the same data streams, the same sensors, the same secure channel. They knew each other's numbers. They knew that they knew. The posteriors were common knowledge.

  According to the theorem, they should have already converged. They should be stating the same probability. Instead, the distance was widening.

  "You're not updating on my announcement," Elias said. It wasn't an accusation; it was a diagnostic.

  "I am," Julian said. "I hear 0.7. I know you're rational. I know you've seen Sensor B. I update."

  "And you move to 0.3? That's away from me, Julian. If we share a prior, my 0.7 tells you that I have evidence pointing high. You should move up."

  "I *did* move up. Last round I was at 0.25."

  "And I moved down from 0.75." Elias capped the marker. The silence in the server room was heavy, punctuated only by the hum of the cooling fans. "Aumann says this is impossible. If we are rational, and we have a common prior, we cannot agree to disagree. The only variable left is the prior."

  Julian finally looked up. His eyes were tired. "We were trained in the same program, Elias. Same textbooks. Same conditioning. We started at the same zero."

  "Did we?"

  "The protocol assumes identical initialization."

  "The protocol assumes a lot of things." Elias turned back to the board. "Think about the update function. When I hear you say 0.3, I infer you have strong evidence for 'No Threat.' That moves me down. But when you hear me say 0.7, you infer... what?"

  "I infer you have strong evidence for 'Threat'."

  "Then why do you dig in? Why does my certainty make you more certain of the opposite?"

  Julian stood up and walked to the window. The city outside was dark, waiting for the decision they were supposed to make. Probability of hostile launch: threshold for counterstrike was 0.5. They were stuck on opposite sides of the precipice.

  "Because," Julian said softly. "When I hear you say 0.7, I don't just update on the evidence you've seen. I update on the fact that *you* saw it."

  "Explain."

  "We assume the prior is over the state of the world. Threat or No Threat." Julian tapped the glass. "But our priors aren't just over the world, Elias. They're over each other. To process your number, I need a prior on *your* reliability. On *your* stability."

  Elias felt a cold knot tighten in his stomach. "You think I'm compromised?"

  "I think," Julian said, turning around, "that a common prior requires a common history. Not just data. *Experience.* We need to have assigned the same weight to every observation since birth. But we didn't."

  "We grew up in the same cohort."

  "We did. But you lost your sister in the Zurich incident. I didn't."

  The marker slipped from Elias's fingers. It hit the floor with a sharp clatter.

  "That's private info," Elias said, his voice trembling. "That's evidence. We should have exchanged that."

  "It's not evidence about the launch codes," Julian said. "It's evidence about the *prior*. It changed how you weigh risk. It changed your baseline probability of catastrophe before you ever saw a single sensor reading. Your 'zero' isn't my 'zero'. You start at 0.5 because you know the world breaks. I start at 0.1 because I know it holds."

  "So the theorem doesn't apply."

  "No," Julian said. "It applies to agents who share a mind. We don't. We share a language. We share a logic. But we don't share a soul."

  Elias looked at the whiteboard. The numbers stared back, immutable. 0.7 and 0.3. They weren't errors. They were measurements of the distance between two human beings who had tried to pretend they were machines.

  "If we don't converge," Elias said, "the system locks. Neither of us can authorize."

  "I know."

  "We sit here until the window closes."

  "Yes."

  Elias picked up the marker. He didn't erase the numbers. For the first time, he understood what they represented. They weren't estimates of the world. They were confessions.

  "Zero point seven," Elias said again.

  "Zero point three," Julian replied.

  They waited. The numbers held.
