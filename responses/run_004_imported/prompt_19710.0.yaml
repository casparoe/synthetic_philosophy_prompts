prompt: |-
  I help moderate a mid-sized rationalist-adjacent forecasting-and-epistemics forum (something like a smaller cousin of LessWrong or the Metaculus discussion boards). We maintain a pinned "Community Consensus" wiki covering a handful of long-running empirical and methodological disputes that the userbase has argued out at exhaustive length and now treats as settled background. Over the past year, an increasing share of new threads have simply re-litigated these settled questions, often rehearsing arguments already addressed years earlier, and several moderators now want to adopt a formal rule: once an entry is tagged [Settled], any thread challenging it is automatically locked unless a moderator first certifies that it contains evidence or argument not already addressed in the consensus write-up. Proponents describe this as merely formalizing what good moderators already do informally. A few of us keep returning to the worry that the rule is structurally very close to Kripke's dogmatism paradox: we would be using our current confidence that P is settled to license screening out, in advance and without full examination, any future evidence against P -- exactly the move that argument shows knowledge (or something close to it) seems to license, despite this being an obviously poor policy for a community whose stated purpose is updating on evidence. I realize a community's provisional consensus is not quite the individual, factive knowledge state Kripke's argument concerns, and that this disanalogy may be doing real work, but the structural parallel still strikes me as more than superficial -- and I've seen people gesture at a related worry using Scott Alexander's "trapped priors" framing, though I am not sure whether that names the same phenomenon or merely a superficially similar one.

  Could you draft the internal policy memo the moderation team would actually circulate on this question? It should come down clearly on whether to adopt, reject, or substantially modify the certification-gate proposal; specify concrete criteria a moderator could apply in the moment when judging whether a challenge thread clears the bar; and include a review cadence or sunset clause for revisiting [Settled] tags rather than treating them as permanent. Most importantly, I would like the memo to engage with the dogmatism-paradox worry on its merits, including taking a position on what, if anything, distinguishes legitimate triage of low-quality repetition from the kind of pre-emptive evidence-screening the paradox describes, rather than setting the worry aside as too abstract for a moderation policy to address.
reasoning: |-
  Here's a thinking process that leads to the suggested policy memo:

  1.  **Analyze the Request:**
      *   **Context:** A mid-sized rationalist-adjacent forecasting/epistemics forum (like LessWrong/Metaculus).
      *   **Problem:** New threads keep re-litigating "settled" consensus wiki entries.
      *   **Proposal:** A formal rule where threads challenging [Settled] entries are auto-locked unless a moderator certifies they contain *new* evidence/arguments.
      *   **Concern:** This looks like Kripke's Dogmatism Paradox (using current confidence to screen out future counter-evidence) or Scott Alexander's "Trapped Priors."
      *   **Task:** Draft an internal policy memo for the moderation team.
      *   **Requirements:**
          *   Take a clear stance (Adopt, Reject, or Modify).
          *   Specify concrete criteria for moderators.
          *   Include a review cadence/sunset clause for [Settled] tags.
          *   *Crucially:* Engage with the Dogmatism Paradox/Trapped Priors worry on its merits, distinguishing legitimate triage from epistemic closure.

  2.  **Deconstruct the Epistemic Worry (Kripke's Dogmatism & Trapped Priors):**
      *   *Kripke's Dogmatism Paradox:* If I know $P$, I know that any evidence against $P$ is misleading. Therefore, I can ignore any evidence against $P$. This leads to closed-mindedness.
      *   *Application here:* If the community "knows" (consensus) $P$, does that justify ignoring challenges?
      *   *Resolution:* Community consensus is *not* factive knowledge. It's a high-confidence probabilistic belief based on past data. The paradox relies on the factivity of knowledge ($Kp \rightarrow p$). Consensus lacks this.
      *   *Trapped Priors:* A psychological mechanism where strong priors prevent updating even in the face of strong evidence because the evidence is interpreted as noise or attack.
      *   *Distinction:* Legitimate triage filters for *signal-to-noise ratio*, not *direction of evidence*. The goal isn't to protect $P$ from falsification, but to protect discourse bandwidth from *repetition*.
      *   *Policy Stance:* Modify the proposal. A hard gate is too risky (creates the dogmatism). A soft gate with strong epistemic safeguards is better. We need to acknowledge the paradox explicitly to avoid falling into it.

  3.  **Determine the Policy Stance:**
      *   *Adopt?* Too risky. Validates the dogmatism worry.
      *   *Reject?* Leaves the moderation burden high and allows thread fatigue.
      *   *Modify?* Best option. Implement the gating mechanism but frame it as "Novelty Requirement" rather than "Consensus Defense." Add sunset clauses. Explicitly address the epistemic risk.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard internal memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the decision (Modified Adoption) and the core reasoning (efficiency vs. epistemic integrity).
      *   **The Epistemic Objection (The Core Request):** This needs to be prominent. Address Kripke and Alexander.
          *   Acknowledge the structural similarity.
          *   Distinguish *Knowledge* (factive) from *Consensus* (probabilistic).
          *   Distinguish *Screening Evidence* (dogmatism) from *Screening Redundancy* (efficiency).
          *   The rule must target *argumentative novelty*, not *conclusion divergence*.
      *   **Policy Decision:** We are implementing a "Novelty Gate" but with specific constraints.
      *   **Operational Criteria:** What does a mod look for?
          *   Is it a rehash?
          *   Is there new data?
          *   Is there a new formal model?
          *   Has the context changed?
      *   **Sunset/Review Mechanism:** [Settled] tags cannot be eternal.
          *   Time-based review (e.g., every 2 years).
          *   Event-based review (major external shift).
          *   "Challenge Token" system? (Maybe too gamified). Let's stick to scheduled reviews.
      *   **Implementation Timeline:** When does this start?

  5.  **Refining the Epistemic Argument (Self-Correction during drafting):**
      *   *Initial thought:* Just say "Consensus isn't knowledge."
      *   *Correction:* That's too glib. The *behavior* is the same even if the metaphysical status differs. If we act *as if* it's knowledge, we suffer the same consequences.
      *   *Better argument:* The policy is justified *only if* it filters for *redundancy*, not *falsification*. We must explicitly state that a thread *can* overturn consensus if the evidence is novel enough. The gate is on the *quality of the challenge*, not the *existence of the challenge*.
      *   *Key Phrase:* "We are filtering for signal, not protecting the prior."

  6.  **Developing Concrete Criteria:**
      *   Need something actionable for a mod scanning a thread title and OP.
      *   Criterion 1: Citation of new data/sources post-dating the consensus.
      *   Criterion 2: Application of a new methodological framework not previously considered.
      *   Criterion 3: Identification of a specific logical error in the original consensus derivation (not just disagreement).
      *   Criterion 4: Context shift (e.g., world events changed the baseline).

  7.  **Developing the Sunset Clause:**
      *   Tags expire after X months? Or require re-ratification?
      *   Let's go with a "Biannual Consensus Audit."
      *   Also, a "Petition to Reopen" mechanism that bypasses the mod gate if enough high-karma users sign off (distributed epistemic check).

  8.  **Tone Check:**
      *   Needs to be rationalist-adjacent: precise, acknowledging uncertainty, valuing epistemic hygiene.
      *   Not bureaucratic, but procedural.
      *   Respectful of the concern (it's a valid philosophical worry).

  9.  **Final Review against Prompt:**
      *   Clear stance? Yes (Modify).
      *   Concrete criteria? Yes.
      *   Review cadence/Sunset? Yes.
      *   Engage Dogmatism/Trapped Priors? Yes, central section.

  10. **Final Polish:** Ensure the distinction between "locking a thread" and "rejecting evidence" is clear. Locking a thread is a resource allocation decision, not a truth claim. *Wait, that's a crucial distinction.* If we lock a thread, we are stopping discussion. We need to ensure there's a path for the evidence to be heard even if the thread is locked (e.g., mod summary, migration to a "Challenge" thread). *Adjustment:* Add a provision that locked threads with substantial new evidence get migrated or summarized, not just deleted/ignored.

      *(Self-Correction)*: Actually, the prompt asks about locking threads *unless* certified. So the certification *allows* the thread. If not certified, it's locked. The risk is the evidence never gets seen. I need to ensure the "Rejection" of a thread doesn't mean "Suppression of Data."
      *Add:* "If a thread is locked for redundancy, the OP is invited to submit the novel evidence via a mod mail for inclusion in the Wiki 'Open Questions' section." This preserves the evidence without clogging the forum.

      *Wait, let's keep it simpler.* The prompt asks for a policy on the *rule*. I will focus on the criteria for *unlocking*. But I will add a safeguard that locking is not a truth judgment.

      *Refining the Epistemic Section:* I need to explicitly name the distinction. The paradox arises from *infallibilism*. Our policy must be *fallibilist*. The [Settled] tag means "High confidence, high cost to re-litigate," not "True."

      *Okay, ready to write.*
answer: |-
  **INTERNAL MEMO**

  **TO:** Moderation Team
  **FROM:** Policy & Epistemics Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Decision: Certification Gate for [Settled] Consensus Challenges

  ### 1. Executive Summary

  After reviewing the proposal to implement a certification gate for threads challenging [Settled] wiki entries, the Working Group recommends a **Modified Adoption**.

  We will implement a "Novelty Certification" requirement for threads challenging [Settled] topics. However, to mitigate the risk of epistemic closure (specifically the structural parallels to Kripke's Dogmatism Paradox and "Trapped Priors"), this rule will be framed explicitly as a *bandwidth management tool* rather than a *truth-preservation tool*. 

  Additionally, we are instituting a mandatory **Biannual Consensus Audit** and a **Distributed Petition Mechanism** to ensure [Settled] tags do not become permanent. This memo details the operational criteria for moderators and addresses the philosophical objections raised during deliberation.

  ### 2. Addressing the Epistemic Objection

  A significant minority of the team raised a concern that this policy structurally mirrors **Kripke's Dogmatism Paradox**. The worry is that by treating consensus as "settled," we license ourselves to ignore future counter-evidence *a priori*, effectively insulating our beliefs from falsification. Relatedly, some cited Scott Alexander's **"Trapped Priors,"** where strong priors cause the community to interpret disconfirming evidence as noise rather than signal.

  We must address this directly, as our community's value proposition relies on rigorous epistemic hygiene.

  **2.1 The Distinction: Knowledge vs. Resource Allocation**
  Kripke's paradox relies on the factivity of knowledge (if $S$ knows $P$, then $P$ is true). Community consensus is not factive knowledge; it is a high-confidence probabilistic estimate based on available data. Therefore, the paradox does not strictly apply *if* we acknowledge our fallibility.

  However, the *behavioral* risk remains. If moderators act as if the consensus is infallible, we induce the same epistemic failure mode. To avoid this, the policy must distinguish between **Screening for Redundancy** and **Screening for Falsification**.

  *   **Illegitimate (Dogmatic):** Locking a thread because the conclusion contradicts the consensus.
  *   **Legitimate (Triage):** Locking a thread because the *arguments* offered are identical to those already evaluated and weighed in the consensus write-up.

  **2.2 Avoiding Trapped Priors**
  "Trapped Priors" occur when the prior is so strong that the likelihood ratio of new evidence is effectively treated as zero. Our policy avoids this only if the threshold for "Novelty" is not set impossibly high. We are not asking for "proof that the consensus is wrong." We are asking for "arguments not already considered."

  **Policy Safeguard:** The [Settled] tag must carry an explicit disclaimer: *"This entry represents the current community equilibrium based on evidence available as of [Date]. It is provisional and subject to revision given novel data or methodology."* This linguistic framing reminds users and moderators that the gate protects *discussion quality*, not *doctrine*.

  ### 3. Operational Policy: The Novelty Certification Gate

  Effective November 15, 2023, any new thread challenging a [Settled] wiki entry will be placed in the moderation queue. It will remain locked until a moderator certifies it meets the **Novelty Threshold**.

  **3.1 Criteria for Certification**
  A moderator must approve the thread for public posting if **ANY ONE** of the following criteria is met. The burden of proof is on the OP to signal this in the title or opening post.

  1.  **New Data:** The thread cites empirical data, studies, or forecasting resolution data published *after* the date of the [Settled] consensus entry.
  2.  **New Methodology:** The thread applies a formal model, reference class, or epistemic framework that was explicitly not considered or available during the original consensus formation.
  3.  **Derivation Error:** The thread identifies a specific logical or mathematical error in the original consensus write-up (rather than simply disagreeing with the conclusion).
  4.  **Context Shift:** The thread argues that external world events have fundamentally altered the baseline assumptions of the original consensus (e.g., a consensus on "AI timelines" pre-2022 vs. post-2022).

  **3.2 Handling Non-Certified Threads**
  If a thread is locked for failing to meet these criteria:
  *   It is **not** deleted.
  *   The OP receives a standardized message linking to the [Settled] entry and the specific arguments they repeated.
  *   The OP is invited to submit their core evidence via Mod Mail. If moderators deem this evidence substantial but the thread format inappropriate, moderators may post a summary in the "Open Questions" section of the wiki or commission a specific "Challenge" thread. This ensures evidence is never suppressed, only routed.

  ### 4. Sunset Clauses and Review Cadence

  To prevent [Settled] tags from becoming permanent dogma, the following review mechanisms are mandatory:

  **4.1 Biannual Consensus Audit**
  Every six months, the moderation team will review all [Settled] entries.
  *   **Action:** If an entry has not been updated in >2 years, its tag is automatically downgraded to [Archived Discussion].
  *   **Rationale:** Epistemic landscapes shift. A lack of challenge may indicate agreement, or it may indicate community stagnation. Downgrading invites fresh scrutiny.

  **4.2 Distributed Petition Mechanism**
  Users can bypass the Moderator Certification Gate via a **Petition to Reopen**.
  *   **Mechanism:** If a thread challenging a [Settled] entry receives 50 upvotes (or signatures from 10 users with >1000 karma) within 24 hours of posting (even if locked), the thread is automatically unlocked.
  *   **Rationale:** This distributes epistemic authority. If the community feels strongly that a challenge is warranted despite moderator judgment, the "wisdom of the crowd" overrides the gate. This is a critical check against moderator bias or blind spots.

  ### 5. Implementation Timeline

  *   **Nov 1 - Nov 14:** Update Wiki headers with provisional disclaimers. Train mod team on Novelty Criteria.
  *   **Nov 15:** Policy goes live.
  *   **May 15 (Year 1):** First Biannual Consensus Audit.
  *   **Nov 15 (Year 1):** Review of policy efficacy. Specific metric to track: Ratio of unlocked challenge threads to total challenge threads submitted. If >90% are locked, the threshold is too high and risks dogmatism; if <10% are locked, the policy is unnecessary.

  ### 6. Conclusion

  We are adopting this policy to preserve the signal-to-noise ratio of the forum, not to protect specific beliefs. By explicitly distinguishing between *redundancy* and *falsification*, and by building in distributed overrides and sunset clauses, we mitigate the risk of the Dogmatism Paradox. 

  The goal is not to make our consensus unassailable, but to ensure that when it is assailed, it is with steel, not straw.

  **Approved By:**
  Policy & Epistemics Working Group
