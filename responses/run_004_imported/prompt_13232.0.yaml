prompt: |-
  So this happened at work last month and it's still kind of bugging me, curious what you'd make of it. I'm on a small backend team and we've got this old job-queue service that everyone's kind of scared to touch. Whenever I'm on call I've got this personal habit of manually running a drain script around midnight if the backlog looks like its climbing - it's not in the runbook, nobody ever asked me to do it, I just started doing it about a year ago because it made my mornings easier. One night I was dealing with a family thing and just didn't get to it, same as maybe one night a month when I'm slammed or just forget, and normally nothing bad happens on those nights. This particular night the backlog spiraled and we had a three hour outage for a decent chunk of customers. In the postmortem doc it got written up as a "contributing factor" that I "did not perform the routine mitigation," and a couple people on the review call said some version of "well if you'd done the drain like you normally do, this wouldn't have happened."

  Something about that framing feels off to me but I can't quite nail down why. I didn't DO anything wrong, I just didn't do an optional thing I sometimes do for my own convenience. And if not-doing-the-drain counts as a cause of the outage, it seems like a ton of other people should count as causes too - nobody ever filed the alert on queue depth even though its been brought up in like three retros, the underlying memory leak has been sitting in the backlog with a low priority tag for over a year, and my manager never got budget approved for a second on-call rotation on that service. None of those people show up in the postmortem though. So either not-doing-things can be causes, in which case basically everyone who didn't do something useful that month is on the hook and it feels arbitrary to single me out, or not-doing-things can't really be causes, in which case the postmortem is just wrong to pin any of this on me specifically. My team leads response was basically "come on, common sense says you're at least partly on the hook here," which might be true but doesn't actually explain why. Is there a real principled way to work out whether I've got a legitimate gripe here, or is this just one of those things where you accept some fuzziness and move on?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Backend engineer on a small team. Old, fragile job-queue service ("scared to touch").
      *   **Action:** User developed a personal habit (not official procedure) of running a manual drain script at midnight if backlog climbs. Done for ~1 year. Makes mornings easier.
      *   **Incident:** One night, user didn't run the script (family thing, forgot, etc. - happens ~1/month). Backlog spiraled -> 3-hour outage.
      *   **Postmortem:** Labeled "contributing factor": "did not perform the routine mitigation." Colleagues said: "if you'd done the drain... this wouldn't have happened."
      *   **User's Feeling:** Something is off. It was optional/unofficial. Singling them out feels arbitrary when other systemic issues (no alerts, memory leak, no budget for 2nd rotation) weren't highlighted as causes in the same way.
      *   **Manager's Response:** "Common sense says you're at least partly on the hook."
      *   **Core Question:** Is there a principled way to determine if this grievance is legitimate, or is it just fuzzy workplace politics to accept?

  2.  **Deconstruct the Ethical/Operational Dilemma:**
      *   **The "Shadow Process" Problem:** The user created an unofficial operational dependency. The team relied on it without formalizing it.
      *   **Causality vs. Blame:** In postmortems (especially blameless ones), we look for root causes. Is "human didn't do optional thing" a root cause? Usually, no. The root cause is "system requires manual intervention to stay healthy."
      *   **Expectation Management:** Did the team *know* about this? Did they *rely* on it? If they relied on it without telling the user, that's on them. If the user implied it was a safety net, that's on the user.
      *   **Systemic vs. Individual:** The user points out valid systemic failures (no alerts, tech debt, staffing). Why were those downplayed? Likely because they are hard/expensive to fix. The user's action is easy to "fix" (just do the thing). This is a classic "path of least resistance" blame assignment.

  3.  **Evaluate the "Principled" Argument:**
      *   **Principle 1: Formalization of Operations.** If a task is critical for uptime, it *must* be in the runbook, automated, or alerted. If it's not, it shouldn't be a single point of failure.
      *   **Principle 2: Blameless Postmortems.** The goal is to prevent recurrence, not assign guilt. Focusing on the individual's omission rather than the system's reliance on that individual violates this principle.
      *   **Principle 3: Omission as Cause.** Philosophically, omissions *can* be causes (e.g., lifeguard not saving a drowning swimmer). But legally/operationally, omission is only a cause if there is a *duty of care* or *established protocol*. Was there a duty? Informally, yes. Formally, no.
      *   **Principle 4: The "Bus Factor" & Hero Culture.** Relying on one person's heroic extra effort is an anti-pattern. The postmortem reinforced hero culture instead of dismantling it.

  4.  **Drafting the Response:**
      *   **Validation:** Acknowledge that the user's feeling is correct. It *is* off. It's not just fuzziness.
      *   **The Core Issue:** Identify the phenomenon. This is "Shadow IT" or "Hero Engineering" becoming a hidden dependency.
      *   **Why the Postmortem is Flawed:**
          *   It violates "Blameless Postmortem" standards.
          *   It treats a workaround as a control.
          *   It ignores the "Swiss Cheese Model" (all the other holes aligned, not just this one).
      *   **Why the Manager is Wrong (Politely):** "Common sense" is often just bias towards the easiest fix.
      *   **The Principled Framework:** Use specific concepts (Formal vs. Informal duties, System vs. Human error).
      *   **Actionable Advice:** How to handle this going forward? (Stop the script, formalize the process, or automate it).

  5.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
      *   Avoid telling the user to "quit" immediately, but validate that this is a culture red flag.
      *   Ensure the distinction between "moral responsibility" and "operational causality" is clear.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, did the user tell anyone?* The prompt says "nobody ever asked me to do it." But colleagues knew ("like you normally do"). So it was an open secret.
      *   *Is the user 100% off the hook?* If they knew the team relied on it and didn't communicate when they couldn't do it, there's a tiny sliver of communication failure. But the *systemic* failure is vastly larger.
      *   *Manager's point:* The manager says "you're on the hook." In a blame culture, yes. In a learning culture, no. I need to highlight this distinction.

  7.  **Final Structure:**
      *   **Direct Answer:** Your gripe is legitimate. It's not just fuzziness.
      *   **Diagnosis:** You stumbled into a "Hidden Dependency" trap.
      *   **The Three Principles:**
          1.  Formalization (If it matters, document it).
          2.  Blameless Culture (Focus on process, not people).
          3.  Omission vs. Commission (Duty of care).
      *   **Why the Team Did This:** Cognitive ease, cost avoidance.
      *   **What To Do:** Stop the shadow process, push for automation/alerting, reframe the postmortem.

  8.  *(Self-Correction during drafting)*: Make sure to emphasize that while the *postmortem* was wrong to blame them, the *situation* reveals a risk the user needs to mitigate for their own sanity. Don't let them keep doing the script if it's going to be held against them.

  9.  **Final Polish:** Check for clarity and empathy. (The resulting output matches the detailed response provided previously.)
answer: |-
  Your gripe is legitimate. This isn't just workplace fuzziness; it is a textbook failure of operational maturity and postmortem culture. You have stumbled into a very common trap known as **"Hero Engineering" becoming a Hidden Dependency.**

  There is a principled way to analyze this, and it relies on three specific concepts from Site Reliability Engineering (SRE) and organizational psychology. Here is why your intuition is correct and why the postmortem framing was flawed.

  ### 1. The Principle of Formalization (If it matters, it must be official)
  In a mature engineering organization, there is a strict binary: **Procedural** vs. **Optional**.
  *   **Procedural:** If a task is required to prevent an outage, it must be in a runbook, automated, or tied to an alert. It is part of the "duty of care."
  *   **Optional:** If a task is not in the runbook, it is explicitly *not* required. It is a "nice to have."

  By labeling your action as a "routine mitigation" in the postmortem, the team retroactively converted an *optional* action into a *procedural* one without going through the change management required to make it official (e.g., updating the runbook, discussing the expectation, ensuring coverage for vacations/sickness).

  **The Principle:** You cannot be held accountable for violating a protocol that does not exist. If the drain script was critical for uptime, the *system* failed by not mandating it. If it was not critical, the *postmortem* failed by citing its absence as a cause. It cannot be both optional and critical simultaneously.

  ### 2. The "Blameless Postmortem" Standard
  The industry standard for incident review is the **Blameless Postmortem**. The core tenet is: *If a human made a mistake, the system allowed them to make it.*

  *   **Your Team's View:** "The engineer failed to run the script." (Focus on the individual).
  *   **Blameless View:** "The system relied on a manual, undocumented script run by a single person to prevent data backlog." (Focus on the architecture).

  The fact that your colleagues said, "If you'd done the drain... this wouldn't have happened," is technically true regarding causality, but operationally useless. It's like saying, "If the brake pads hadn't worn out, the car wouldn't have crashed." The useful insight is, "Why did we rely on brake pads that wear out without a warning sensor?"

  By pinning this on you, the team has identified the **easiest** fix (tell you to try harder) rather than the **real** fix (fix the memory leak, add alerts, automate the drain). This is known as **satisficing**—accepting a solution that is "good enough" to close the ticket, rather than one that solves the problem.

  ### 3. Omission vs. Commission and "Duty of Care"
  You asked: *Can not-doing-things be causes?*
  Philosophically, yes. Operationally, only if there is an established **Duty of Care**.

  *   **Scenario A:** You are the designated on-call for a service. The runbook says "If CPU > 90%, restart service." You see CPU > 90% and go to sleep. **You are at fault.** You violated an established duty.
  *   **Scenario B:** You notice that restarting the service helps, so you do it occasionally. One night you don't. **You are not at fault.** You had no duty to perform the optimization.

  Your manager's "common sense" argument relies on the idea that because you *did* it before, you created an implicit contract. While socially understandable, this is dangerous in engineering. It creates **Shadow Operations**. When operations are shadowed (undocumented, unofficial), they become single points of failure (you).

  ### Why this feels "Off" (The Arbitrariness)
  You nailed it in your prompt: *"None of those people show up in the postmortem though."*

  This is **Outcome Bias**. Because the outage happened *on your watch* and *correlated* with you missing your habit, you became the anchor for the explanation.
  *   The person who didn't file the alert? Their inaction didn't correlate with the specific timeline as tightly.
  *   The manager who didn't get budget? That's too abstract.
  *   You not running the script? That fits the narrative timeline perfectly.

  It feels arbitrary because it *is* arbitrary. You were the path of least resistance for the postmortem author.

  ### The Risk to You
  While you are principledly in the right, staying in this position is risky for your career and mental health.
  1.  **Precedent:** You have now established that you *are* responsible for this script. Next time you miss it (even for a valid reason), the blame will be heavier.
  2.  **Burnout:** You are effectively working an unpaid, unacknowledged second shift to patch a broken system.
  3.  **Stifled Improvement:** By accepting this blame, you let the team off the hook for fixing the memory leak or the alerting.

  ### Recommended Next Steps
  You don't necessarily need to quit, but you need to change the dynamic immediately.

  1.  **Stop the Shadow Process:** Do not run the script tonight. Or, if you do, send a message to the team channel: *"Running the manual drain script as a temporary mitigation. Note that this is not in the runbook and is not covered if I am unavailable. We need to automate this."* Make the invisible visible.
  2.  **Reframe the Postmortem Action Items:** If there are open action items from that postmortem, ensure they are systemic.
      *   *Bad Action Item:* "Engineer to ensure drain script is run nightly."
      *   *Good Action Item:* "Create automated cron job for drain script."
      *   *Good Action Item:* "Implement alerting on queue depth > X."
  3.  **Have the "Duty" Conversation:** Talk to your manager.
      *   *"I've been thinking about the postmortem. I'm concerned that we've codified an unofficial workaround as a requirement. If this task is critical for uptime, it needs to be in the runbook and covered by the whole team, or automated. If it's not critical, it shouldn't be listed as a contributing factor. I want to make sure we aren't building a dependency on my personal habits."*

  ### Summary
  You are not wrong. This is a culture that values **heroics over reliability**. They are rewarding you for saving them for a year, and punishing you for being human for one night. That is not "common sense"; that is bad management.

  You have a legitimate gripe. The principled stance is that **reliability must be engineered, not performed.** Push for the engineering fix, and refuse to accept the personal blame for a systemic gap.
