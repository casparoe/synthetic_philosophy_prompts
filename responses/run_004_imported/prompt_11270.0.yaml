answer: |-
  **Setting:** *A university faculty lounge, late afternoon. Rain taps against the window. ELIAS (50s, clinical psychologist, neurodiversity-affirming but ontologically realist) is pouring tea. SARAH (40s, philosopher of psychiatry, specializing in Ian Hacking and classification) sits opposite him, reviewing a stack of papers.*

  **Elias:** You look like you're trying to dissect the tea bags, Sarah.

  **Sarah:** Just thinking about the trainee who came to see me this morning. The one going through assessment. They're spiraling. They've been reading Hacking in their reading group, and now they're worried that if autism is a "looping effect," their diagnosis is just a self-fulfilling prophecy. They asked me if they should treat the diagnosis as "less real" than a broken leg.

  **Elias:** And what did you tell them?

  **Sarah:** I told them I'd buy them dinner if I could run it by you first. Because honestly, Elias, if we take Hacking seriously, the "broken leg" analogy is exactly the problem. A broken leg is an indifferent kind. The bone doesn't care what we call it. But a person diagnosed with autism reads the criteria, joins a community, learns to mask or unmask, and changes the very phenotype we are studying. So, does that loosen the evidential weight?

  **Elias:** It loosens the *metaphysical* weight, perhaps. But not the *clinical* weight. Look, I understand the looping concern. But you're treating the biology as if it's passive. It isn't. When the DSM-5 merged Asperger's, PDD-NOS, and Autistic Disorder into ASD, critics screamed that we were just blurring lines for administrative convenience. But the data suggested those boundaries were never biologically distinct to begin with. We weren't drawing a new circle; we were admitting the old fences were in the wrong places. The neurodevelopmental substrate was there all along.

  **Sarah:** But *why* were the fences in the wrong places? For thirty years, the "fence" excluded women. Not because their neurology was different, but because the diagnostic criteria were built on the "male extreme" phenotype. The category itself selected for a certain presentation. Now that we have a narrative of the "late-diagnosed woman," women are presenting differently. They aren't just being *found*; they are recognizing themselves in the new criteria and articulating their history through that lens. That's looping. The category creates the population that stabilizes the category.

  **Elias:** I grant you the history was biased. But the correction isn't a loop; it's a calibration. Think about the explosion of self-diagnosis online. You call that a feedback loop of identity formation. I see it as a signal-to-noise problem resolving itself. For decades, the signal was suppressed. Now, the internet allows people to compare notes. When thousands of people say, "This description of sensory processing matches my life," that's not just social contagion. That's convergent validity. They aren't becoming autistic because of the label; they are using the label to describe a pre-existing struggle.

  **Sarah:** Convergent validity on *what*, though? On reported distress? On behavioral coping strategies? Let's talk about the biology you're anchoring this to. You rely on twin studies. High concordance rates. That's your bedrock.

  **Elias:** It's a significant part of it. Heritability estimates are high.

  **Sarah:** They are. But heritability of *what*? The measures used in those studies are based on observable behaviors. If the definition of the behavior shifts because the culture shifts, the heritability estimate is tracking a moving target. And consider infant markers. We look for reduced eye contact or atypical orienting at six months. But "atypical" is a statistical deviation from a norm. If the norm is culturally specific, the marker is too. We don't have a blood test, Elias. We have a consensus on behavior.

  **Elias:** We don't have a blood test for migraine either, or fibromyalgia. Does that make the pain less real? The lack of a biomarker doesn't mean there isn't a neural architecture. It just means our tools are blunt.

  **Sarah:** I'm not saying the pain isn't real. I'm saying the *kind* of thing it is changes when the subject knows the name of the pain. Hacking's point wasn't that autism is "fake." It's that it's an *interactive kind*. When you diagnose a patient, you aren't just labeling a static object. You are handing them a script. Some will reject the script. Some will perform it. Some will use it to demand accommodations that change their environment, which changes their brain development over time via neuroplasticity. If the diagnosis changes the trajectory of the life, how can you say the diagnosis merely "discovered" the trajectory?

  **Elias:** Because the *capacity* for that trajectory was constrained by the neurology. You can't loop yourself into having a seizure disorder if you don't have the neural propensity. Look at cross-cultural prevalence. It varies, yes, but the core traits—social communication differences, repetitive behaviors, sensory sensitivities—appear everywhere, even where the word "autism" doesn't exist. In cultures where it's stigmatized, it's called something else, or hidden. But the underlying disposition is there.

  **Sarah:** The disposition is there, I agree. But is it "autism"? Or is it a cluster of traits that we have decided to bundle together and call "autism" because of a specific Western, medicalized history? In some cultures, those traits might be bundled with spiritual gifts, or moral failings, or nothing at all. The prevalence data is messy because the *detection* is messy. But here is my real worry for your trainee: If they treat the diagnosis as a hard, realist fact—like a broken leg—they risk essentializing themselves. "I am autistic" becomes "I am *broken* in this specific, permanent way."

  **Elias:** And if they treat it as a loose social construct, they risk denying themselves the support they need. If they think, "This is just a looping effect," they might talk themselves out of accommodations at work. They might think their burnout is just a narrative choice. I see patients who refuse the label because they fear it's not "real enough." That harms them. The diagnosis is a key. It opens doors to legal protections, to therapy, to community. Do you tell someone the key is an illusion because the lock was designed by a committee?

  **Sarah:** No. But I tell them the key changes the shape of the door. Here is where I think we can meet, and where I think I can answer your trainee's anxiety. You want them to hold the diagnosis firmly for utility. I want them to hold it lightly for identity.

  **Elias:** Go on.

  **Sarah:** If we accept looping, the diagnosis isn't a verdict on who they *are*; it's a tool for who they are *becoming*. The evidential weight shouldn't be on whether the diagnosis perfectly maps onto a static neural reality. The weight should be on whether the diagnosis *does useful work*. Does it explain the past? Does it facilitate the future?

  **Elias:** So, pragmatic realism.

  **Sarah:** Exactly. But with a caveat. As a clinician, when *you* diagnose a patient, you have to acknowledge that you are participating in the loop. You aren't just a botanist classifying a fern. You are a co-author of their narrative. If you diagnose a child, you change the parents' behavior. That changes the child. If you diagnose an adult, they re-evaluate their memories. That changes their self-concept.

  **Elias:** I can accept that. In fact, I have to. When I diagnose a woman who was missed in childhood, I am explicitly telling her, "The criteria were wrong, not you." That is an intervention. But Sarah, if I tell my patients, "This category is unstable and partly constituted by your reaction to it," doesn't that undermine their sense of validity? They've spent years feeling broken. They want to know they aren't crazy.

  **Sarah:** They want to know they aren't *alone*. Realism gives them solidity. Interactionism gives them agency. The danger of pure realism is fatalism. "I have a deficit." The danger of pure interactionism is vapor. "It's all a story." The truth for your trainee is likely in the middle. The neurology is the hardware; the diagnosis is the operating system. You can't change the hardware easily. But the OS updates.

  **Elias:** So, to answer their question: Does taking looping effects seriously mean they should hold the diagnosis more loosely?

  **Sarah:** It means they should hold the *essence* loosely, but the *implications* firmly. They shouldn't ask, "Is this truly who I am deep down?" They should ask, "Does living as an autistic person allow me to flourish more than living as a neurotypical person who is failing?"

  **Elias:** I can work with that. It shifts the evidence from "Does this match the DSM perfectly?" to "Does this map onto my lived experience effectively?"

  **Sarah:** And for you, as a clinician?

  **Elias:** It means I need to be careful not to treat the DSM as a bible. It's a map. And when I see a patient, I need to remember that handing them the map changes the terrain they're walking. I need to diagnose with humility. Not "I have found your truth," but "Here is a language that might help you speak your truth."

  **Sarah:** That sounds like Hacking would approve. He always said the goal isn't to stop the looping—that's impossible with human kinds. The goal is to make the loop a virtuous one rather than a vicious one.

  **Elias:** A virtuous loop. If the diagnosis leads to self-acceptance, which leads to better coping, which leads to better outcomes, which reinforces the utility of the diagnosis... that's a stable system, even if it's interactive.

  **Sarah:** Precisely. So, tell your trainee this: Your diagnosis is real because it has real effects. The fact that it changes you doesn't make it false. It makes it alive. Don't worry about whether you were "really" autistic before you knew the word. Worry about whether knowing the word helps you live better now.

  **Elias:** * (Sips tea)* I think that might let them sleep. It acknowledges the complexity without pulling the rug out from under their feet.

  **Sarah:** And it keeps you honest, too. You're not just discovering patients. You're helping make them. That's a heavy responsibility.

  **Elias:** Heavier than classifying rocks.

  **Sarah:** Infinitely. But also more rewarding. Because the rocks don't thank you for getting the classification right.

  **Elias:** No. But they don't argue with you, either.

  **Sarah:** * (Smiles)* Touché. Now, about that dinner...

  **Elias:** Let's go. I know a place that's quiet. Low sensory load.

  **Sarah:** See? You're already doing it. Accommodating the kind.

  **Elias:** Just trying to keep the loop virtuous.
