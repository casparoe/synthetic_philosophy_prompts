prompt: |-
  i'm in a free will seminar this semester and two people in my discussion group got into a whole argument after class about frankfurt cases. we'd just read the classic jones/black case: black's got a device that forces jones to kill smith if jones looks like he's about to back out, but jones goes through with it on his own, so the device never fires. heres roughly how it went:

  (1) theo said this refutes PAP (you're only responsible if you could've done otherwise) -- jones is responsible even though he literally couldn't have done otherwise, since black guarantees the outcome either way.
  (2) mara said not so fast: jones could still have shown the prior sign of wavering that would've triggered the device, and whether he acts on his own vs gets forced is a real difference, so some "flicker" of alternate possibility survives.
  (3) theo said that flicker's too thin to matter -- responsibility can't hinge on some minor neural blip going differently, and if flickers that small count, PAP becomes compatible with basically anything, even full determinism, which makes it empty.
  (4) mara switched to a dilemma: either the prior sign is something jones controls, so theres a real alternate possibility earlier in the chain, or it's a brute state he doesn't control, so the case only works by quietly assuming determinism -- which begs the question against libertarians.
  (5) theo said "buffer" versions of the case drop the prior sign entirely (a deterministic backup process just guarantees the outcome), dodging mara's first horn, and that the thought experiment only needs determinism to hold in this one hypothetical, not everywhere.

  neither budged, and honestly both seemed pretty sharp to me. can you go through it move by move and say who's right at each step, not just who wins overall, plus anything both are missing? also curious if there's a way out of mara's dilemma in (4) that neither of them raised.
