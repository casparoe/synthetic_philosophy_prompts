prompt: |-
  ok this is kind of a random ask but our school's philosophy club has a guest speaker coming next week and i got roped into doing the interview lol. shes known for defending luminosity -- the idea that if youre in a mental state like feeling cold or being in pain, you're automatically in a position to know it -- against williamson's anti-luminosity argument. can you write me 7 or 8 questions that don't just let her repeat the standard line? i want one on how she gets around the sorites-ish gradual case (like a slowly-warming-room type argument) that uses the margin for error principle to rule out luminosity, one on the KK principle specifically and whether her defense just pushes the problem up a level (do you know that you know that you know...), one on whether shes just reasserting cartesian certainty instead of actually rebutting the argument, and one at the end on what would actually change her mind about the whole view. add a quick follow-up to each based on whatever answer she's most likely to give.
