      *   **Highlight the Risks of Option 2 (The "Dishonesty" Argument):**
          *   If the student finds out it was targeted, trust is broken.
          *   It denies the student feedback they might need to improve.
      *   **The Crucial Middle Ground (Best Practice):**
          *   Do the restructuring (Option 2) *but* provide gentle, constructive feedback privately.
          *   Don't lie about the budget. The budget *is* cut. The restructuring is the *method* of allocation.
