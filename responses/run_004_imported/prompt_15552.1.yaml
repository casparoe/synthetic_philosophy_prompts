answer: |-
  **MEMORANDUM**

  **TO:** Epistemics Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Protocol for Advocate Trading (Project Orion)

  ### Executive Summary

  The Committee must resolve whether Elena, the primary advocate for Project Orion, should be permitted to trade on Orion's conditional funding market. After reviewing the conflict between Hansonian information aggregation and the No-Trade Theorem implications, I recommend the following:

  **Decision:** Elena **may trade**, but her net position is subject to a **"Outside-Liquidity Match" constraint.** She may not hold a net position larger than the aggregate net position of all non-advocate traders combined.

  **Rationale:** This preserves the market's ability to absorb Elena's private information while preventing the price from becoming a solipsistic reflection of her confidence. It forces the "consensus" required for legitimate funding decisions without silencing the best-informed participant.

  ### Context and Conflict

  We are currently deadlocked on Project Orion. Elena wishes to take a large long position. 
  *   **View A (Information Aggregation):** Following Robin Hanson's futarchy principles, price should reflect all available information. Elena possesses superior information regarding Orion's viability. Restricting her trade suppresses truth and reduces the market's predictive accuracy.
  *   **View B (No-Trade/Adverse Selection):** Because Elena's expertise and bias are common knowledge, rational staff have no incentive to bet against her (the "No-Trade Theorem" in miniature). If she trades unchecked, the price reflects "Elena's Confidence," not "Market Consensus." Funding based on this price risks allocating resources based on advocacy rather than collective epistemic judgment.

  ### Analysis

  The core tension is between **Speed of Truth** (View A) and **Legitimacy of Consensus** (View B).

  In a pure prediction market, View A dominates; we want the price to move as fast as possible to the truth. However, our market is *decision-grade*. The price does not just predict the future; it authorizes the expenditure of real nonprofit resources. This introduces a principal-agent problem. If the price moves solely because Elena bets, we have not validated the information; we have merely monetized her advocacy.

  Conversely, banning Elena (View B's extreme) creates a "lemons market." If the best-informed trader is barred, the remaining traders are less informed, and the price becomes *less* accurate. We lose the signal we built the market to capture.

  ### The Rule: Outside-Liquidity Match

  **Constraint:** An identified project advocate (like Elena) may trade freely, provided their net position never exceeds the total net volume held by non-advocates on the same side. 
  *   *Example:* If non-advocates hold a net 100 "Yes" shares, Elena may hold up to 100 "Yes" shares. She cannot hold 101 until a non-advocate buys the 101st share.

  **Implementation:**
  1.  **Tagging:** Elena's account is tagged as "Advocate: Orion."
  2.  **Cap Calculation:** The trading engine calculates `Max_Advocate_Position = Total_NonAdvocate_Volume`.
  3.  **Disclosure:** The market interface displays the "Advocate Share" of the open interest prominently.

  **Reasoning:**
  This rule transforms the market from a plebiscite on Elena's confidence into a mechanism for **validating** that confidence. 
  1.  **Preserves Signal:** Elena can still move the price significantly. Her information is not discarded.
  2.  **Solves Adverse Selection:** By capping her influence relative to others, we incentivize other staff to perform due diligence. To "unlock" Elena's full betting power (and thus push the price higher toward the funding threshold), the rest of the organization must put skin in the game.
  3.  **Maintains Legitimacy:** Funding decisions will rest on a price supported by a coalition, not a singleton. This protects the organization from the risk that Elena is overconfident or privately motivated.

  ### The Strongest Argument Against This Rule

  **The "Tyranny of the Ignorant" Objection:**
  The most serious critique of the Outside-Liquidity Match is that it structurally privileges the *consensus of the less-informed* over the *conviction of the expert*. 

  If Elena is correct and the rest of the staff is wrong (or indifferent), this rule prevents the price from reflecting reality. It creates a friction cost on truth. In a Hansonian ideal, if one person knows the truth with 99% certainty, the price should move to 0.99 immediately, regardless of whether others understand why. By tethering Elena's position to the volume of less-informed traders, we are effectively vetoing high-conviction insights that have not yet percolated through the organization. 

  This risks turning the prediction market into a bureaucracy: funding only flows when the crowd is already convinced, rather than when the *evidence* (held by the expert) justifies it. We may miss high-upside projects because the "outside liquidity" is too lazy or risk-averse to match the expert's position.

  ### Rebuttal and Mitigation

  We accept this friction cost as necessary for our specific context. 

  1.  **Decision-Grade vs. Forecast-Grade:** In a pure forecast market, accuracy is the only metric. In a *funding* market, organizational buy-in is a second metric. A project that only Elena believes in is a high-risk allocation for a small nonprofit, regardless of the mathematical probability. The rule forces the organization to "catch up" epistemically to the advocate before resources are committed.
  2.  **Incentivizing Discovery:** The constraint is not a permanent ban; it is a challenge. If Elena's information is truly compelling, she can share it (within compliance limits) to encourage others to trade. The rule incentivizes the *transfer* of private information into public knowledge, which strengthens the organization's overall epistemics, rather than just hiding it in a trade.
  3.  **Play-Money Reality:** Since this is play-money, the "friction" is not financial loss but time delay. If Orion is truly viable, a delay to build consensus is a low cost compared to the risk of misallocating budget based on a singleton's unverified conviction.

  ### Recommendation

  Adopt the **Outside-Liquidity Match** rule immediately. Apply it retroactively to the Orion market. Elena may continue trading, but the funding threshold will not be triggered by her volume alone. This honors the Hansonian insight that she has valuable information, while respecting the No-Trade insight that her information requires counterparty validation to become organizational consensus.

  **Action Required:** Vote to approve this constraint by EOD Friday to ensure market stability before the Monday funding review.
