  # The Ghost in the Machine: Ergodicity, Utility, and the Kelly Criterion

  In the lore of rationalist communities like LessWrong, few concepts are as revered—and as contested—as the Kelly criterion. To bet according to Kelly is to maximize the expected logarithm of wealth, prioritizing geometric growth over arithmetic expected value. For years, the standard justification was pragmatic: Kelly prevents ruin and maximizes long-term compounding. But in the last decade, a more radical justification has emerged from the work of physicist Ole Peters and the field of "ergodicity economics." Peters argues that Kelly betting is not merely a prudent strategy for risk-averse agents, but the *only* mathematically consistent strategy for any agent existing in time. He claims that expected value (EV) maximization relies on a fiction—the ensemble of parallel worlds—whereas time-average growth reflects physical reality.

  Traditional economists, channeling the legacy of Paul Samuelson, retort that this is sleight of hand. They argue that choosing to care about the time-average trajectory is itself a substantive preference, isomorphic to assuming logarithmic utility. By framing a value judgment as a physical necessity, Peters allegedly commits the naturalistic fallacy, relocating the utility function under a more technical-sounding name.

  This essay will examine the strongest forms of both arguments. It will conclude that while Peters does not strictly derive an "ought" from an "is" in the Humean sense, the ergodicity argument successfully grounds the preference for log-wealth in the physical constraints of persistence. It does not eliminate the choice of utility, but it demonstrates that for any agent wishing to remain an agent, that choice is heavily constrained by the dynamics of the world.

  ### The Ergodicity Claim: Physics Over Psychology

  To understand Peters' argument, one must distinguish between ensemble averages and time averages. Consider a simple multiplicative bet: a coin flip where heads increases wealth by 50% and tails decreases it by 40%. The arithmetic expected value of a single bet is positive ($0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$). An EV maximizer would theoretically bet everything, every time, because the average wealth across an ensemble of parallel universes grows exponentially.

  However, in the single universe we inhabit, wealth evolves through time. If you bet everything repeatedly, a single tails reduces your capital, requiring a larger percentage gain to recover. Over many iterations, the median trajectory of wealth trends toward zero, even as the ensemble average trends toward infinity. This is a non-ergodic process: the time average does not equal the ensemble average.

  Peters' central claim is that standard economics conflates these two averages. By maximizing expected value, economists implicitly assume the agent can access the wealth of their parallel selves. Since no actual agent can do this, EV maximization is physically incoherent for an individual facing repeated multiplicative risks. Instead, Peters argues, rationality should be defined by maximizing the *growth rate* of wealth over time. In multiplicative processes, the growth rate is the expected logarithm of wealth. Thus, the Kelly criterion emerges not from a subjective aversion to risk, but from the mathematical properties of the wealth process itself.

  In this view, risk aversion is not a psychological quirk; it is a recognition of non-ergodicity. The "utility function" is removed from the axioms of decision theory and replaced by the dynamics of the system. If you want to survive in time, you must maximize the time average.

  ### The Traditionalist Rebuttal: Preference is Inescapable

  The Samuelson tradition offers a devastatingly simple counter-argument: maximizing the time-average growth rate is itself a goal, and choosing that goal is a preference.

  Samuelson famously critiqued the idea that the Law of Large Numbers justifies risk aversion. Just because a bet is favorable in the long run does not mean an agent *should* take it. An agent might have a short time horizon, a specific liability due tomorrow, or a desire to "go big or go home." If an agent prefers a 1% chance of becoming a billionaire over a 100% chance of modest growth, that is a valid preference. By insisting that agents *must* maximize time-average growth, Peters is simply imposing a specific utility function (logarithmic) and labeling it "objective."

  Furthermore, the ergodicity argument relies heavily on the assumption of repeated betting over an infinite or indefinite horizon. But many decisions are one-offs. In a single-shot scenario, the distinction between time and ensemble averages collapses; there is only the single outcome. If Peters' logic only holds for repeated games, it cannot serve as a universal foundation for decision theory.

  The traditionalist charge is that Peters has not solved the problem of utility; he has hidden it. To say "you should maximize time-average growth" is to say "you should value future wealth compounding more than immediate variance." That is a value judgment. By calling it "ergodicity," Peters gives it the veneer of physical law, but it remains a normative claim about what constitutes a "good" outcome.

  ### Synthesis: Relocation or Grounding?

  Is the ergodicity argument merely a renaming of logarithmic utility, or does it offer something deeper? The answer lies in the distinction between *defining* preferences and *justifying* them.

  Formally, the traditionalists are correct: maximizing the time-average of log-wealth is mathematically isomorphic to maximizing expected log-utility. If an agent's objective function is $U(W) = \ln(W)$, they will bet Kelly. If an agent optimizes for time-average growth in a multiplicative process, they will bet Kelly. The actions are identical. In this strict sense, Peters has relocated the utility function. He has not derived an "ought" from an "is" without remainder; he has smuggled in the "ought" via the choice of optimization target (growth rate).

  However, to dismiss this as *mere* relocation is to miss the profound shift in justification. In standard expected utility theory, the shape of the utility function is exogenous. Why are you risk-averse? "Because I am." It is a brute fact of psychology. Peters endogenizes risk aversion. He argues that in a world of multiplicative dynamics, agents who do not behave *as if* they have log-utility will eventually vanish.

  This appeals to the concept of instrumental convergence. An agent may have any number of terminal goals, but almost all goals require resources to achieve. If an agent uses EV maximization in a non-ergodic environment, they face a high probability of hitting an absorbing state (ruin, or wealth effectively zero). Once in an absorbing state, the agent can no longer pursue *any* goals. Therefore, maximizing time-average growth is not necessarily the terminal value of the agent, but a necessary instrumental strategy for any agent that wishes to persist.

  This grounds the Kelly criterion not in a whim of preference, but in the topology of survival. It explains *why* logarithmic utility is so prevalent in nature and markets: it is the utility function of the survivors. Evolution selects for ergodicity.

  ### Conclusion

  Does the ergodicity argument derive Kelly betting from something more basic than a mere preference? Strictly speaking, no. The choice to prioritize the time-average trajectory over the ensemble average remains a normative commitment. One could coherently say, "I do not care about long-term persistence; I care about maximizing my potential peak wealth, even if it likely leads to ruin." Peters cannot prove this agent wrong, only that they are likely to go extinct.

  However, characterizing this as *just* a relocation of the utility function underestimates the power of the argument. Standard utility theory treats risk aversion as a psychological parameter, detached from the physical world. Ergodicity economics re-embeds the agent in time and physics. It demonstrates that for any agent with an indefinite horizon and multiplicative dynamics, the "preference" for log-wealth is not optional if they wish to remain in the game.

  The ergodicity argument does not solve the Is-Ought problem, but it narrows the gap. It shows that the "Ought" of rational betting is constrained by the "Is" of stochastic processes. Peters is right that EV maximization is a fiction for the individual, but the traditionalists are right that choosing to care about the time-average is still a choice. It is, however, the only choice that allows the chooser to keep choosing. In that sense, Kelly betting is not just a preference; it is the price of admission for existence in a non-ergodic world.
