      *   *Key nuance:* Distinguish between "single bet" vs "repeated bet." Peters' argument relies heavily on repetition/time. Samuelson argues utility applies to single bets too. I need to address the "repeated vs. single" tension.

  6.  **Final Polish:** Check terminology (ergodicity, ensemble average, time average, utility function, isomorphism). Ensure the flow is logical. (Proceed to generate output based on this structure.)
