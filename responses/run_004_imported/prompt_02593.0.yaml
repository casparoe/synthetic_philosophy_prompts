prompt: |-
  Having followed rationalist blogs and forums for a long time, I've noticed that van Fraassen's Reflection Principle (from his 1984 paper "Belief and the Will") and Yudkowsky's "Conservation of Expected Evidence" (from the Sequences) tend to get treated as though they were the same insight. Van Fraassen's principle says, roughly, that if you are now certain your credence in P at some future time will equal x, your current credence in P conditional on that supposition must already equal x — and this is meant to hold no matter how that future credence comes about. Yudkowsky's principle, derived from the law of total probability, claims only that your expected posterior must equal your prior when the future credence results from conditionalizing on evidence. Compare the two in some depth: is Reflection simply this Bayesian result restated in more general, temporal terms, or does its indifference to the source of the future credence make it a substantially stronger and more easily refuted claim? Illustrate the difference with a case where credence shifts for a reason other than rational updating — anticipated memory loss or persuasion by a bad argument, say — and state which principle better survives it.
reasoning: |-
  Here's a thinking process that leads to the comparison between van Fraassen's Reflection Principle and Yudkowsky's Conservation of Expected Evidence:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Comparison of Bas van Fraassen's Reflection Principle (1984) and Eliezer Yudkowsky's Conservation of Expected Evidence (CoEE).
      *   **Observation:** Rationalist communities often treat them as the same insight.
      *   **Task:** Compare them in depth. Determine if Reflection is just a temporal restatement of CoEE or a stronger/more vulnerable claim due to its indifference to the *source* of credence change.
      *   **Requirement:** Illustrate with a case where credence shifts for non-rational reasons (memory loss, bad argument).
      *   **Conclusion:** State which principle better survives the counterexample.

  2.  **Analyze the Principles:**

      *   **Van Fraassen's Reflection Principle:**
          *   *Formulation:* $C_0(P | C_t(P) = x) = x$.
          *   *Meaning:* My current credence in $P$, given that my future credence in $P$ will be $x$, should be $x$.
          *   *Scope:* Applies to *any* future credence change, regardless of *why* it happens (updating, forgetting, brainwashing, fatigue).
          *   *Status:* Normative principle of rationality. Often considered too strong because it forbids anticipating irrational changes in oneself.

      *   **Yudkowsky's Conservation of Expected Evidence (CoEE):**
          *   *Formulation:* $E[C_{post}(P)] = C_{prior}(P)$. Or, $C(P) = C(P|E)P(E) + C(P|\neg E)P(\neg E)$.
          *   *Meaning:* You cannot anticipate the *direction* of a belief update based on evidence. If you expect to move your belief up, you should have already moved it up.
          *   *Scope:* Strictly applies to *Bayesian conditionalization* on new evidence.
          *   *Status:* Mathematical theorem of probability theory (Law of Total Probability). Cannot be "refuted" mathematically, only misapplied.

  3.  **Identify the Core Difference:**
      *   CoEE is a *mathematical identity* regarding evidence and conditionalization.
      *   Reflection is a *normative constraint* on diachronic coherence that assumes future selves are epistemically trustworthy.
      *   *Key Distinction:* CoEE assumes the mechanism of change is *learning evidence*. Reflection assumes the mechanism of change is *irrelevant*; it only cares about the correlation between current and future credence.

  4.  **Evaluate the "Same Insight" Claim:**
      *   Why do people conflate them? Both imply "Don't expect your beliefs to change without a reason." Both warn against anticipating specific updates.
      *   Why are they different? CoEE says "If you update on evidence, the expectation is zero." Reflection says "If you expect to believe $x$ later, believe $x$ now."
      *   Reflection implies CoEE (if you assume future updating is rational), but CoEE does not imply Reflection (because CoEE doesn't cover non-evidential changes).
      *   *Verdict:* Reflection is substantially stronger and more vulnerable.

  5.  **Develop the Counterexample (The "Non-Rational Shift"):**
      *   *Scenario:* I know I will get drunk tonight.
      *   *Proposition $P$:* "I am fit to drive."
      *   *Current Credence:* Low (I know alcohol impairs judgment).
      *   *Future Credence:* High (Drunk me will feel confident).
      *   *Application of Reflection:* If I am certain Drunk Me will believe $P$ with 0.9, Reflection says Sober Me must believe $P$ with 0.9. This is absurd. Sober Me knows Drunk Me is unreliable.
      *   *Application of CoEE:* CoEE applies to evidence. Getting drunk isn't "evidence" about driving fitness in the Bayesian sense; it's a physical alteration of the cognitive apparatus. CoEE doesn't demand I match Drunk Me's belief. It just says I can't anticipate evidence that proves I'm fit to drive without already believing I'm fit.

      *   *Alternative Scenario (Memory Loss/Christensen's Sleepy Beauty style):*
          *   I know I will forget evidence $E$ by time $t$.
          *   Current credence in $P$ (based on $E$) is high.
          *   Future credence in $P$ (after forgetting $E$) will be low (prior).
          *   Reflection: $C_0(P | C_t(P) = prior) = prior$. This forces me to abandon $E$ *now* because I know I'll forget it *later*. This seems wrong (diachronic Dutch Book arguments often target this).
          *   CoEE: Doesn't apply directly to forgetting, as forgetting isn't conditionalizing on new evidence.

      *   *Selected Scenario for Essay:* The "Bad Argument/Persuasion" or "Cognitive Decline" case is usually clearest. Let's use the "Drunk/Impaired" or "Fallible Future Self" case. It highlights the *trust* assumption in Reflection.

  6.  **Drafting the Comparison:**

      *   *Introduction:* Acknowledge the conflation in rationalist circles. State thesis: They are mathematically related but normatively distinct. Reflection is stronger and more fragile.
      *   *Section 1: Conservation of Expected Evidence (CoEE).* Define it as a theorem of probability. Emphasize it governs *evidence*. It's about the expectation of the *process* of updating.
      *   *Section 2: Van Fraassen's Reflection.* Define it as a diachronic coherence constraint. Emphasize it governs *credences* directly, regardless of process. It assumes the future self is an expert.
      *   *Section 3: The Crucial Divergence.* CoEE is about *information flow*. Reflection is about *self-trust*.
      *   *Section 4: The Counterexample.* Use the "Anticipated Irrationality" case (e.g., getting drunk, or being subjected to propaganda).
          *   Setup: I know I will be persuaded by a fallacious argument tomorrow.
          *   CoEE: No evidence is presented, so CoEE is silent or not violated.
          *   Reflection: Demands I adopt the belief now. This violates rationality (I know the argument is bad).
      *   *Section 5: Which Survives?* CoEE survives because it's a math theorem restricted to conditionalization. Reflection fails because it forbids anticipating one's own irrationality.
      *   *Nuance:* Mention that Reflection can be saved by conditioning on "rational updating," but that reduces it closer to CoEE.

  7.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I explain *why* they are conflated? Yes, both imply "expectation of belief change = 0" under ideal conditions.
      *   *Check:* Did I address the "source of future credence"? Yes, this is the pivot point. CoEE cares about source (must be evidence); Reflection ignores source.
      *   *Check:* Is the math clear? Keep it conceptual but precise.
      *   *Tone:* Analytical, philosophical, respectful of both traditions (academic epistemology vs. rationalist community).
      *   *Specific Reference:* David Christensen's work on Reflection is relevant (he critiques it). Might be worth a brief mention to bolster the "easily refuted" claim.
      *   *Clarification on CoEE:* CoEE is often stated as "You can't expect to change your mind." This is shorthand for "You can't expect the *evidence* to push you in a specific direction." Need to be precise there.

  8.  **Final Plan:**
      *   Intro: The conflation and the thesis.
      *   CoEE: Theorem of probability, evidence-centric.
      *   Reflection: Normative principle, trust-centric.
      *   The Divergence: Mechanism of change.
      *   Case Study: The "Fallacious Persuasion" scenario.
      *   Verdict: CoEE holds; Reflection breaks.
      *   Conclusion: Reflection is a specialized (and controversial) extension, not a restatement.

  9.  (Self-Correction during drafting): Make sure to distinguish between *Weak* and *Strong* Reflection if necessary, but stick to the prompt's definition ("no matter how that future credence comes about"). This is the "Strong" version which is most vulnerable.

  10. (Final Polish): Ensure the distinction between "mathematical truth" (CoEE) and "normative principle" (Reflection) is sharp. CoEE *cannot* be refuted; Reflection *can*.

  Let's write.
answer: |-
  The conflation of Bas van Fraassen's Reflection Principle and Eliezer Yudkowsky's Conservation of Expected Evidence (CoEE) is a common occurrence in rationalist discourse. Both principles warn against anticipating specific changes in belief without cause, and both imply a kind of diachronic stability for the rational agent. However, treating them as identical insights obscures a critical distinction: CoEE is a mathematical theorem regarding the processing of *evidence*, whereas Reflection is a normative principle regarding *self-trust*.

  While CoEE is a robust consequence of probability theory that holds strictly for Bayesian conditionalization, Reflection is a substantially stronger claim that extends coherence requirements to *any* future credence, regardless of how it is produced. Because Reflection demands that you treat your future self as an epistemic expert even when you know that self will be compromised, it is far more vulnerable to refutation.

  ### 1. Conservation of Expected Evidence: A Theorem of Information
  Yudkowsky's Conservation of Expected Evidence is derived directly from the law of total probability. It states that for any proposition $H$ and potential evidence $E$, your current prior probability $P(H)$ must equal the weighted average of your possible posterior probabilities:

  $$P(H) = P(H|E)P(E) + P(H|\neg E)P(\neg E)$$

  In plain English: you cannot anticipate the *direction* of a belief update driven by evidence. If you expect to see evidence that would raise your credence, you must already raise your credence now. If you could predict that evidence $E$ would make you believe $H$ more strongly, then $E$ is already evidence for $H$, and you should update immediately.

  Crucially, CoEE is restricted to belief changes caused by **conditionalization on new evidence**. It is a statement about the logic of information. It does not tell you what to do if your beliefs change due to fatigue, brain damage, forgetting, or irrational persuasion. In those cases, the mathematical preconditions for CoEE (specifically, that the change represents a partition of logical space based on truth-tracking signals) are not met. CoEE is not a normative rule you can choose to follow or ignore; it is a consistency constraint on any probability distribution. You cannot "violate" CoEE without violating the axioms of probability itself.

  ### 2. The Reflection Principle: A Norm of Self-Trust
  Van Fraassen's Reflection Principle is formulated as:

  $$C_0(P \mid C_t(P) = x) = x$$

  Where $C_0$ is current credence, $C_t$ is future credence at time $t$, and $P$ is a proposition. This says: if you are now certain that your future credence in $P$ will be $x$, your current credence in $P$ (conditional on that future state) must also be $x$.

  Unlike CoEE, Reflection is silent on *why* the credence changes. It treats the future credence $C_t(P)$ as a random variable that commands respect simply by virtue of being your own future belief. It effectively posits that your future self is an **epistemic expert** relative to your current self.

  This makes Reflection a much stronger claim. CoEE says, "You cannot expect *evidence* to move you." Reflection says, "You cannot expect *yourself* to move." Reflection subsumes CoEE (if you assume all future changes are due to rational updating) but extends far beyond it into territories where rationality is not guaranteed. It implies that anticipating your own irrationality is itself irrational.

  ### 3. The Divergence: Anticipated Irrationality
  The difference becomes stark when we introduce a case where the source of the credence shift is known to be epistemically defective.

  **The Case of the Fallacious Persuasion**
  Suppose I am a committed skeptic of homeopathy ($P$: "Homeopathy works"). My current credence $C_0(P)$ is 0.05.
  I know that tomorrow I will attend a party where a charismatic friend, who I know is prone to logical fallacies and has no medical training, intends to persuade me that homeopathy works using a specific, known fallacious argument (e.g., an appeal to anecdote I have already discounted).
  I know my own psychology well: I am tired, and I know that after hearing this argument, I will be swayed. I am certain that at time $t$ (tomorrow night), my credence $C_t(P)$ will rise to 0.8.

  **Applying Conservation of Expected Evidence:**
  CoEE asks: Do I expect to receive *evidence*?
  The "argument" my friend presents is not new evidence in the Bayesian sense; I have already evaluated the type of claim being made and assigned it low weight. The shift in belief is caused by social pressure and cognitive fatigue, not by the likelihood ratio of the proposition.
  Therefore, CoEE does not demand I update now. My expectation of the *evidence* is zero (because I don't expect truth-tracking information), even if my expectation of my *belief state* is high. CoEE remains silent and unviolated.

  **Applying the Reflection Principle:**
  Reflection asks: What is your future credence?
  I am certain $C_t(P) = 0.8$.
  Reflection dictates: $C_0(P \mid C_t(P) = 0.8) = 0.8$.
  To satisfy Reflection, I must immediately raise my credence in homeopathy to 0.8, simply because I know I will be irrationally persuaded later.

  This result is absurd. It forces me to "pre-emptively capitulate" to known irrationality. It violates the very goal of epistemology, which is to align belief with truth, not to align belief with future belief states regardless of their genesis. By demanding I treat my future, compromised self as an expert, Reflection forces me to be irrational now to maintain coherence with my later irrationality.

  ### 4. Which Principle Survives?
  **Conservation of Expected Evidence survives.**
  Because CoEE is a theorem of probability theory restricted to conditionalization, it is immune to counterexamples involving non-evidential belief changes. In the persuasion case, the mechanism of change is not conditionalization on $E$, so the theorem simply does not apply. It correctly identifies that since no expected *evidence* supports homeopathy, the prior need not shift.

  **The Reflection Principle fails.**
  The persuasion case (and similar cases involving anticipated memory loss, intoxication, or cognitive decline) is a standard refutation of the strong Reflection Principle. Philosophers like David Christensen have argued extensively that Reflection must be qualified to apply only to "rational" future beliefs. But once you add the qualification "conditional on my future self updating rationally," Reflection collapses into something very close to CoEE.
  Without that qualification, as van Fraassen originally proposed ("no matter how that future credence comes about"), Reflection is demonstrably false as a norm of rationality. It forbids an agent from recognizing their own fallibility.

  ### Conclusion
  The rationalist tendency to treat these principles as identical stems from a focus on ideal agents. In a world where agents only update via Bayesian conditionalization on truth-tracking evidence, Reflection and CoEE yield the same prescriptions. However, in the real world, where agents suffer from memory loss, bias, and fatigue, the distinction is vital.

  CoEE is a law of probability regarding information; Reflection is a controversial norm regarding self-trust. Reflection is the stronger claim, but its strength is its weakness: by demanding coherence with *any* future credence, it mandates that we ignore the source of belief changes. As the case of fallacious persuasion shows, a rational agent must sometimes disagree with their future self. Therefore, Conservation of Expected Evidence is the robust insight, while the Reflection Principle is an overgeneralization that fails when an agent anticipates their own imperfection.
