answer: |-
  This is exceptionally sharp writing—concise, argumentatively dense, and stylistically confident. You've captured the tone of high-level philosophical journalism well. Since you're working from memory, however, there are some nuances in Dummett's position that are worth tightening to ensure accuracy, and there are ways to deepen the critique you're leveling.

  Here are my comments on your three specific points.

  ### 1. Accuracy: Reconstruction and Attribution

  **The Reconstruction:**
  Your summary is broadly faithful to the text, but you may be smoothing over a crucial distinction Dummett makes between *refugees* and *economic migrants*.
  *   **Refugees:** For Dummett, the obligation here is near-absolute. He grounds this not just in the 1951 Convention but in a moral duty that trumps national sovereignty. He argues that a state has almost *no* right to exclude a genuine refugee unless the threat to the existing population is existential (literally survival, not just standard of living).
  *   **Migrants:** For economic migrants, he is slightly more permissive regarding restriction, but still hostile to cultural/ethnic arguments.

  Your paragraph blends these slightly ("immigration into a country... and that refugees specifically"). If you sharpen that distinction, the "concession" part of your critique becomes more precise. The capacity argument applies much more strongly to economic migrants in Dummett's view than to refugees.

  **The Attribution:**
  You are right to worry about whether this is distinctively Dummett or generic liberal theory.
  *   **Vs. Walzer:** Walzer (*Spheres of Justice*) argues communities have a right to exclude to maintain their "shared understandings." Dummett is explicitly attacking this Walzerian intuition. He views the "community character" argument as a mask for racism. So, the "corrosive" first part is distinctively Dummett (inflected by his anti-apartheid activism).
  *   **Vs. Carens:** Carens (*Aliens and Citizens*) is closer to Dummett on open borders, but Carens is more theoretical. Dummett's book is polemical and situated in the specific context of the British Nationality Act 1981 and the Windrush generation.
  *   **Vs. Miller:** David Miller argues for national partiality. Dummett rejects this.

  **Verdict:** You aren't misattributing the core stance. The "unmasking" move is very Dummett. However, to avoid the "generic liberal" charge, you might briefly note that Dummett's argument is driven by a specific conception of *political honesty* and the corruption of public discourse, which links back to his broader philosophical interest in truth and assertion (even if he doesn't make the technical link explicit in this book).

  ### 2. Substance: The Tension (Capacity vs. Impartiality)

  You have identified the standard "boundary problem" objection to cosmopolitanism, but you've framed it well as an internal tension regarding *motive*.

  **Is the tension genuine?**
  Yes. Your point that "capacity" is elastic is the strongest objection to Dummett's framework. If a government claims "we are at capacity," Dummett's test is whether that claim is impartial. But since economic modeling is inherently contestable, a government can almost always find a model that says "we are full."

  **Is there a way to block it?**
  Dummett would likely respond that the burden of proof is not symmetrical. He isn't asking for perfect impartiality; he is demanding that the *default* position be admission. The state must prove incapacity beyond a reasonable doubt, rather than the migrant proving capacity exists.
  *   **Suggestion:** You might strengthen your critique by noting that Dummett relies on a level of *good faith* in public administration that his own "corrosive" analysis suggests is impossible. If the state's motives are usually racist rationalizations (Part 1), why would we trust their "capacity" calculations (Part 2)? That is the real squeeze: the epistemic vulnerability of the concession undermines the moral force of the polemic.

  ### 3. Framing: The Fault Line

  Your current frame (Internal Consistency: Polemic vs. Concession) is solid. However, depending on the angle of your larger feature, there might be a more compelling fault line.

  **Option A: The Activist vs. The Theorist (Current Frame)**
  This works well if your feature is about philosophers entering the fray. It highlights the messiness of applied ethics.

  **Option B: The Voting Theorist vs. The Immigration Theorist**
  You mention Dummett's work on voting procedures. There is a fascinating tension here:
  *   In voting theory, Dummett is obsessed with *fair procedures* and aggregating preferences accurately.
  *   In immigration, he dismisses democratic preferences (public opinion often favors restriction) in favor of moral truth.
  *   **The Fault Line:** Does Dummett abandon his commitment to procedural fairness when the democratic will is morally corrupt? He argues that immigration rights are *human* rights, not subject to the vote. This is a stronger philosophical conflict than the "capacity" issue. It pits his democratic theory against his moral realism.

  **Option C: The Distinction between Refugees and Migrants**
  If you want to be more precise, focus on whether his distinction holds. He grants refugees near-absolute entry but allows restriction on migrants.
  *   **The Fault Line:** In a globalized economy, is the distinction between "fleeing persecution" and "fleeing destitution" morally sustainable? Dummett says yes; many critics say no. If the capacity argument swallows the refugee claim, the distinction collapses.

  **Recommendation:**
  If your feature is about **philosophers intervening in policy**, stick with your current frame (Option A) but sharpen the "good faith" critique I mentioned in section 2. It highlights the risk philosophers take when they move from logic to policy: logic requires precise definitions; policy requires handling elastic concepts like "capacity."

  If your feature is about **philosophical coherence**, Option B (Voting/Democracy vs. Moral Truth) is richer. It shows Dummett prioritizing moral ontology over democratic procedure, which is a bold move for a philosopher of language and logic.

  ### Specific Line Edits / Nuances

  If you keep the paragraph as is, consider these small tweaks for precision:

  1.  **"Question-begging or a rationalization..."**
      *   *Tweak:* Consider adding "or a disguise for racial prejudice." Dummett is very explicit about racism, not just abstract ethnic composition.
  2.  **"Grounded in the 1951 Refugee Convention and in ordinary morality..."**
      *   *Tweak:* Dummett leans heavily on the idea that the Convention codifies a *pre-existing* moral duty, not that the Convention *creates* the duty. The Convention is evidence of the morality, not the source.
  3.  **"The trouble is that the concession seems to quietly undo the polemic."**
      *   *Tweak:* This is excellent. To make it punchier, you might add: "...undo the polemic by providing a *technocratic* cover for the *prejudice* he just exposed."

  ### Summary
  You haven't misremembered the core architecture. The tension you've identified is real and is the standard objection to this class of argument. To make it distinctively about Dummett, emphasize that for him, the "capacity" argument is only valid if it is stripped of *any* cultural anxiety—a standard he knows most states cannot meet. The tragedy of the book is that Dummett offers a moral framework for a state that does not exist.

  It's a strong paragraph. With minor tuning on the refugee/migrant distinction and the "good faith" problem, it will be robust.
