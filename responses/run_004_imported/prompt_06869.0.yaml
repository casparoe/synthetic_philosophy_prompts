prompt: |-
  I'm writing my IB Extended Essay on theories of biological function, and the part I keep struggling to get right is the disagreement between etiological accounts of function, where, following Larry Wright, a trait has a function only because past instances of it were selected for some effect, and Robert Cummins' causal-role account, where a trait's function is simply whatever it currently contributes to some capacity of the system it belongs to, regardless of history. My supervisor suggested that if I could dramatize the disagreement in fiction, I'd probably understand it well enough to write about it properly. Could you write me a short story, around 1000 words, built around a case where the two accounts would hand down different verdicts — say, a creature that comes into existence by pure chance, a perfect physical duplicate of an ordinary animal, heart and lungs and all, but with no ancestors and no selection history behind it whatsoever (I believe this is a version of what's sometimes called a 'Swampman' case)? I'd like an actual character to have to decide, out loud, whether that creature's organs really have functions, and to feel the pull of both answers, rather than having the two theories simply explained to the reader — it doesn't need to resolve which account is right.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** IB Extended Essay on theories of biological function.
      *   **Core Conflict:** Etiological accounts (Larry Wright: function depends on selection history) vs. Causal-role accounts (Robert Cummins: function depends on current contribution to system capacity).
      *   **Specific Case:** A "Swampman" scenario (a creature created by chance, physically identical to an ordinary animal but with no evolutionary history).
      *   **Format:** Short story (around 1000 words).
      *   **Key Requirement:** A character must debate/decide out loud whether the creature's organs have functions, feeling the pull of both answers. No definitive resolution.
      *   **Goal:** Help the student understand the disagreement through dramatization.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Etiological (Wright):** Function = *why* it was selected. If no history, no function. A heart pumps blood *because* ancestors' hearts pumped blood and helped them survive. No ancestors = no function (even if it pumps blood).
      *   **Causal-Role (Cummins):** Function = *what* it does now. A heart pumps blood. If it pumps blood in the system, that's its function. History is irrelevant.
      *   **The Swampman Case:** A lightning strike creates a molecule-for-molecule duplicate of a human (or animal) in a swamp. No parents, no evolution.
      *   **The Tension:** Intuitively, the creature works (Causal-Role says "function"). But historically, it's an accident (Etiological says "no function").

  3.  **Drafting - Setting and Character:**
      *   **Setting:** A lab or a field site. Let's go with a sterile, slightly futuristic lab to emphasize the artificial/chance nature of the discovery. Or maybe a swamp field station? Let's try a containment unit overlooking a marsh.
      *   **Character:** Dr. Aris Thorne. A biologist or philosopher of biology. Needs to be thoughtful, conflicted.
      *   **The Creature:** Let's make it a small animal for simplicity. A frog? A bird? Let's go with a songbird. It's visceral.
      *   **Plot:** Aris is observing the creature (let's call it "Subject Zero" or "The Echo"). It was formed by a bizarre quantum fluctuation/lightning event (Swampman style). It's alive now. Aris needs to file a report on its physiology. The box on the form says "Function of Organ."

  4.  **Drafting - Scene by Scene:**
      *   **Opening:** Aris looking at the creature. Establishing the miracle of its existence without history.
      *   **Middle:** The debate. Aris talking to a recorder or a colleague (maybe just alone to keep it internal/externalized). Let's have him talking to a recorder, it allows for monologue.
      *   **The Conflict:** He looks at the heart.
          *   *Cummins voice:* It's pumping. It's keeping the bird alive. That's its job.
          *   *Wright voice:* But it wasn't chosen. It's a fluke. It has no purpose, just mechanics.
      *   **Climax:** The bird sings. Does the song have a function (mating) if there's no history of mating selection?
      *   **Ending:** Aris leaves the box blank or writes something ambiguous. The tension remains.

  5.  **Refining the Philosophy in Dialogue:**
      *   Need to ensure the distinctions are clear without being a lecture.
      *   *Etiological:* "History," "Selection," "Purpose," "Why it's there."
      *   *Causal-Role:* "Capacity," "Contribution," "Current system," "What it does."
      *   *Swampman element:* Emphasize the lack of ancestors. "Born of lightning," "No parents."

  6.  **Writing - First Pass (Mental or Scratchpad):**
      *   Start with the rain. The swamp.
      *   Aris stands over the glass tank. Inside is the bird.
      *   He's dictating notes. "Subject exhibits normal physiology."
      *   He hesitates at "Function of the heart."
      *   He argues with himself. "It pumps blood." (Cummins). "But why?" (Wright).
      *   "If I kick a stone and it stops a door, is its function to stop the door?" No.
      *   "But this is alive."
      *   "It's a duplicate."
      *   He feels the weight of the definition.
      *   Ends with him unsure.

  7.  **Writing - Focusing on Tone and Word Count:**
      *   Needs to be atmospheric.
      *   Keep it around 1000 words.
      *   Ensure the philosophical terms aren't too jargon-heavy but accurate enough for an IB EE student.
      *   Make sure the "Swampman" aspect is clear (created by chance).

  8.  **Revision during drafting:**
      *   *Check:* Did I mention Wright or Cummins? The prompt says "rather than having the two theories simply explained." So, avoid naming them directly. Show the *logic* of the theories.
      *   *Check:* Is the creature a Swampman? Yes, needs to be clear it has no evolutionary history.
      *   *Check:* Is the conflict resolved? No.
      *   *Check:* Word count. Aiming for ~1000.

  9.  **Final Polish:**
      *   Enhance the sensory details (hum of the machine, beating heart).
      *   Strengthen the internal monologue to reflect the philosophical tension.
      *   Ensure the distinction between "what it does" vs. "why it exists" is sharp.

  *(Self-Correction during drafting)*: I initially thought about having a colleague argue with him. But a monologue feels more intimate for an EE student trying to grasp the *feeling* of the problem. Let's have him talking to a voice recorder. It justifies the "out loud" requirement naturally.

  *(Refining the Swampman origin)*: Make sure it's clear it wasn't engineered. It was a spontaneous assembly. A "lightning strike in the muck."

  *(Final check on constraints)*: 1000 words. No resolution. Dramatize the disagreement.

