answer: |-
  The containment hummed, a low-frequency vibration that Dr. Aris Thorne felt in his teeth more than he heard. Inside the glass cylinder, perched on a synthetic branch, was the bird. It looked like a swamp sparrow. It breathed like a swamp sparrow. It had even molted a single feather that lay on the floor of the unit, brown and barred with black.

  But there were no parents. There was no nest. There was no evolutionary lineage stretching back into the Cretaceous. Three weeks ago, a bizarre atmospheric discharge had struck a peat bog behind the station. When the smoke cleared, this creature stood in the scorched mud, fully formed, DNA intact but genealogically orphaned. A spontaneous assembly of matter. A Swampman.

  Aris tapped his stylus against the datapad. The form before him was standard physiological intake. Row 4, Column B: *Primary Function of Cardiac Organ.*

  He looked at the monitor. The heart beat—steady, rhythmic, efficient. It pumped hemolymph through the veins, oxygenating tissues, maintaining homeostasis.

  "Function," Aris said to the room, his voice sounding flat in the sterile air. "Define function."

  He began to pace. "If I look at what it *does*," he said, gesturing to the screen, "the answer is obvious. The heart circulates blood. Without that circulation, the system collapses. Therefore, within the current capacity of this organism, the heart's role is circulation. It contributes to the survival of the whole. If I define function as causal contribution, as what the part does for the containing system, then the heart has a function. It's working. It's doing a job."

  He stopped pacing and leaned against the console. The bird tilted its head, eyeing him with a black bead of an eye.

  "But that feels like a lie," Aris muttered. "Because it's accidental."

  He imagined kicking a stone. If the stone happened to prop open a door, keeping a room ventilated, would he say the stone's *function* is to ventilate the room? No. It's just a stone. It's doing something, but it isn't *for* anything. It lacks history.

  "Subject Zero lacks history," Aris said to the recorder. "This heart wasn't selected. No ancestor of this creature survived because their heart pumped blood. This heart wasn't shaped by the pressure of survival. It just... appeared. If function requires a etiology—a history of selection for a specific effect—then this heart is functionless. It's just a muscle spasming in a way that happens to keep the bird alive. It has no purpose, only mechanics."

  He rubbed his temples. The two thoughts pulled at him like tidal forces.

  On one side, the pragmatic view. The bird was alive. If he injected a toxin that stopped the heart, the bird died. The heart was necessary. To say it had no function seemed to ignore the reality of the biology in front of him. The system had capacities, and the organ contributed to them. Why did the history matter? The machine was running.

  On the other side, the historical view. If he admitted this heart had a function, he was admitting that purpose could arise from chaos without selection. That threatened the entire framework of evolutionary biology. Function implied design, not necessarily by a designer, but by the blind watchmaker of time. This creature had no time. It was a snapshot without a film reel.

  "Imagine," Aris said, his voice rising slightly, "if I clone a car. A perfect duplicate. But it wasn't built in a factory. It assembled itself from rust and dust. The engine turns the wheels. Does the engine have the function of turning the wheels? Or is it just moving parts?"

  The bird hopped. It opened its beak and sang. A clear, trilling note.

  Aris froze. "There it is. The song. In a normal sparrow, the function of the song is mating or territory defense. It was selected for that. But this bird... it has no mate. It has no territory. It sings because its vocal cords vibrate when air passes over them. Is the function of the song to attract a mate? Or is it just noise?"

  He looked back at the datapad. The cursor blinked in the box. *Primary Function.*

  "If I write 'Circulation'," Aris whispered, "I am saying that what matters is the now. I am saying that biology is about systems, not stories. I am siding with the idea that if it works, it has a function."

  He hovered the stylus over the glass.

  "But if I write 'None'," he continued, "I am saying that history is everything. I am saying that without the past, there is no purpose. I am saying this creature is a philosophical zombie, alive but without true biological traits."

  He looked at the bird again. It looked back. It seemed so desperate to be real. It scratched its head with its foot. It groomed a wing. It acted exactly like a sparrow. To deny it functions felt cruel, almost arbitrary. But to grant them felt scientifically dishonest.

  "The etiological account says I'm blind to the origin," Aris said to the empty room. "The causal-role account says I'm blind to the operation."

  He thought about the implications for his essay, for his career. If function is only history, then every new mutation, before it is selected, is functionless. If function is only capacity, then a cancer cell has the function of dividing, because that's what it contributes to the system of the tumor. Both definitions led to absurdities if pushed too hard.

  The bird sang again. A perfect, functional song.

  Aris exhaled, a long, shaky breath. He looked at the blinking cursor. He could feel the weight of the definition pressing down on the glass. If he typed the word, he was choosing a universe where history mattered more than presence. If he left it blank, he chose a universe where mechanics mattered more than meaning.

  "Subject exhibits normal physiology," Aris dictated, his voice tired. "Cardiac organ contributes to systemic capacity..."

  He paused. The bird waited.

  "...however," Aris added, "selection history is null."

  He didn't fill in the box. He couldn't. He turned off the recorder and watched the bird breathe, wondering if the heart beating inside the chest knew the difference between being chosen and being lucky. The monitor beeped on, marking time for a creature that had none.
