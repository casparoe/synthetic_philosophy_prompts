prompt: |-
  So I've been reading Tolstoy's What Is Art? and want to actually stress-test his framework instead of just nodding along at the "he hated Beethoven and his own novels" cliffnotes version. His actual criteria for good art aren't about skill or beauty -- its about whether a work sincerely "infects" people with a feeling, and separately, whether that feeling is one thats accessible to literally anyone (or ties to universal Christian brotherhood) versus one that only a trained, leisured elite can work itself up into.

  Can you rank the list below from best to worst art, purely by his standards (not modern taste, not "canonical greatness")? He basically has four tiers: religious art (highest), universal art (good), bad art (infects fine, but the feeling itself is a divisive one -- pride, lust, exclusive patriotism etc), and counterfeit art (doesn't really infect anyone except people trained to pretend it does). Say which tier each item lands in as part of the ranking, and don't just default everything unfamiliar into "counterfeit."

  - Beethoven's 9th Symphony
  - Wagner's Ring Cycle
  - Tolstoy's own War and Peace
  - his short story "God Sees the Truth, But Waits"
  - Uncle Tom's Cabin
  - a Shakespeare tragedy like Hamlet
  - an anonymous Russian peasant lullaby
  - a rousing patriotic war anthem
  - Joyce's Ulysses

  Give it to me as JSON:
  ```json
  [
    {"rank": 1, "work": "...", "tier": "religious art / universal art / bad art / counterfeit art", "reason": "one sentence, tied to his actual criteria not vibes"},
    ...
  ]
  ```
