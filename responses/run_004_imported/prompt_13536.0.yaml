  1.  **Analyze the User's Situation:**
      *   **Context:** The user was dogsitting for their sister.
      *   **Incident:** The user forgot to latch a baby gate. The dog got into onions (toxic to dogs) and needed emergency vet care ($800).
      *   **Conflict:** The sister says the user is equally responsible for the bill as if they had fed the onions directly. The user feels this is unfair because it was negligence (forgetting a gate) vs. direct action (feeding).
