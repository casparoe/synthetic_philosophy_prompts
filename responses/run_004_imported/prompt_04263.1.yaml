answer: |-
  This is a sophisticated application of ethical theory to a practical problem. Your friend is right that Aristotle is grappling with the problem of **commensurability**: how do you compare qualitatively different things (houses vs. shoes, or in your case, capital vs. labor vs. skill) without reducing them to something arbitrary?

  Here is a reconstruction of the argument, followed by answers to your three specific questions, and finally, an application to your founders' agreement.

  ### The Argument Reconstructed

  Aristotle's goal in Book V is to define **Reciprocal Justice**, which holds the city (*polis*) together. His argument proceeds in three steps:

  1.  **The Problem of Incommensurability:** A builder and a shoemaker have different goods. You cannot physically equate a house with a shoe. However, for exchange to occur, there must be a ratio (e.g., 1 house = 500 shoes). If there is no ratio, there is no exchange, and if there is no exchange, there is no social bond (*koinonia*).
  2.  **The Necessity of a Common Measure:** To establish that ratio, the goods must be made "equal." Since they are not equal by nature, they must be measured by a third thing. This third thing is **money**. Money acts as an intermediate that makes the house and the shoe numerically comparable.
  3.  **The Ground of Value:** But what gives money its measuring power? Aristotle argues money is merely a convention (*nomos*). The underlying reality that money represents is **demand** (*chreia*). It is the mutual need citizens have for one another's functions that actually binds the goods together. Money is just a token of that need.

  ---

  ### 1. What work is "equating" doing before money is introduced?

  **Is it an independent fact or subjective acceptance?**

  Aristotle is claiming neither a purely objective physical fact nor a purely subjective "whatever we agree on" definition. He is claiming a **functional necessity**.

  When he says, "If, then, first there is proportionate equality of goods... If not, the bargain is not equal, and does not hold," he is arguing that commensurability is a *precondition* for the relationship to exist, not just a result of the transaction.

  *   **Not Objective Fact:** There is no physical property in the house that makes it worth 500 shoes.
  *   **Not Subjective Whim:** It is not merely that "they agreed to it, so it is fair." If the ratio is wildly off (1 house for 1 shoe), the shoemaker will stop trading, and the social bond dissolves.

  **The Reconstruction:** The "equating" is the recognition of a **proportional relationship between the producers**, not just the products. Aristotle implies that the builder and shoemaker must be "equalized" in status for the exchange to persist. The "equality" is the ratio that allows the *community* between them to survive. It is an inter-subjective truth: it exists only insofar as the parties recognize it as necessary for their continued association.

  **For your negotiation:** This suggests that "fairness" isn't a number you find in a spreadsheet (objective), nor is it just whatever you three sign on a napkin (subjective). It is the ratio that allows the *partnership* to survive without resentment. If the equity split makes one founder feel like the "shoemaker giving 500 shoes for a house," the "bargain will not hold" (i.e., the team will break up).

  ### 2. Is "Demand" (*Chreia*) subjective value or objective need?

  **This is the crux of Aristotelian value theory.**

  The Greek word *chreia* is difficult. Ross translates it as "demand," but it also means "need," "use," or "service."

  *   **Against Subjective Theory:** Modern subjective value theory says value is determined by individual preference (I want a shoe more than you do). Aristotle is not talking about individual whim. He is talking about the **needs of the community**.
  *   **Against Pure Objective Need:** He isn't saying value is based on biological survival (we all need water). A house and a shoe serve different functions.

  **The Reconstruction:** *Chreia* is **social utility**. Value arises from the fact that human beings are different and require different things to flourish (*eudaimonia*). The "unit" is demand because without the *need* for what the other provides, the object has no value in the context of the polis.

  Money is *nomisma* (from *nomos*, law/convention). It is a placeholder for this social need. We agree to treat this piece of metal (or digital entry) as a representation of "how much the community needs what you produced."

  **Verdict:** It is closer to an **objective theory of social need** than a subjective theory of preference. Value is grounded in the functional role a good or service plays in sustaining the common life.

  ### 3. Does this apply to Capital, Labor, and Specialized Skill?

  **Yes, but with a critical adjustment.**

  Aristotle is analyzing market exchange of finished goods (shoes/houses). You are negotiating **partnership equity** in a venture that does not yet exist. However, his framework offers a powerful alternative to the "arbitrary formulas" you mentioned.

  Here is how to apply the three Aristotelian insights to your deadlock:

  #### A. Commensurability (The "Unit" Problem)
  You are stuck because you are trying to compare incommensurables (cash vs. hours vs. skill). Aristotle says you cannot compare them directly; you need a "money" to measure them.
  *   **Application:** Stop trying to compare cash to hours. Instead, agree on a **unit of account for the startup**. Is the unit "risk"? Is the unit "value created"?
  *   **Action:** Create a synthetic currency for the negotiation. For example, assign a "value credit" to each contribution based not on market rate, but on **criticality**. If the specialized technical problem is the bottleneck without which the product is zero, its *chreia* (demand/need) is higher than full-time labor on non-critical features, regardless of hours logged.

  #### B. Demand (*Chreia*) as the Truth-Teller
  Aristotle says money is just a convention; *demand* is the reality. In a startup, "market rate" is the convention (the *nomisma*). The *chreia* is **what the company needs to survive.**
  *   **Application:** Ask: "What does the venture *need* most to exist in the next 18 months?"
      *   If the venture dies without cash, the capital provider's *chreia* is highest.
      *   If the venture dies without a product, the builder's *chreia* is highest.
      *   If the venture dies without the technical fix, your *chreia* is highest.
  *   **Action:** Weight the equity based on **critical dependency**, not just contribution. Aristotle would argue that the "fair" exchange is the one that acknowledges who is most essential to the *common end* (the successful company).

  #### C. Convention (*Nomos*) and Flexibility
  Aristotle notes money exists by law/convention and "it is in our power to change it." Equity is your *nomisma*. It is a conventional token you are creating.
  *   **Application:** Since equity is conventional, it does not have to be static. If you cannot agree on a permanent split now because the future *demand* for your respective contributions is unknown, use the Aristotelian insight that the measure can be changed.
  *   **Action:** Implement **dynamic equity** or **milestone-based vesting**. Agree that the initial split is a provisional *nomisma* that will be recalibrated if the *chreia* shifts (e.g., if the technical problem is solved, your *chreia* drops; if the product needs scaling, the builder's *chreia* rises). This acknowledges that "demand" changes over time.

  ### Summary Advice for the Negotiation

  Aristotle would tell you that you are looking for a **proportionate equality** that preserves the **friendship/partnership** (*koinonia*).

  1.  **Reject "Market Rate" as Objective Truth:** That is just *nomisma* (convention). It ignores the specific *chreia* (need) of your specific venture.
  2.  **Identify the *Chreia*:** Explicitly discuss: "What is the single biggest risk to this company's existence?" Assign the highest weight to the contribution that mitigates that risk. That is the Aristotelian "demand."
  3.  **Treat Equity as Conventional:** Since equity is a token of future value, not payment for past work, make the agreement flexible. If the "demand" for your specific skill drops after the problem is solved, your equity should reflect that (via vesting or cliffs).

  **The Aristotelian Verdict:** Fairness is not a formula; it is the ratio that allows the partners to remain in community. If the split feels "arbitrary," it is because you are measuring by *nomisma* (cash/hours) rather than *chreia* (necessity to the common good). Shift the conversation to **necessity**, and the "proportionate return" may become clearer.
