prompt: |-
  I'm taking a seminar this term on blame and moral responsibility, which is probably why something that happened at home has been bothering me more than it normally would. My roommate Priya and I have split every household cost fifty-fifty for two years through a shared expense app, and she has always been the strict one, quick to flag anything that looks off. Last week I discovered she had been logging some of her personal shopping trips as "household" purchases, quietly shifting about thirty dollars a month onto me for several months. When I confronted her, she pointed out that in my first year of college, with different roommates, I had done much the same thing—recording personal purchases as shared costs on our bill-splitting spreadsheet—and only stopped once someone caught the discrepancy, not voluntarily. She says that since I did exactly what she's doing now, and only corrected it after being caught, I have no real basis to be annoyed with her. I did make things right with those old roommates and haven't repeated it since, though Priya only learned this history when she raised it herself just now. Is she right that my past undercuts my complaint, or is there a mistake somewhere in her reasoning?
reasoning: |-
