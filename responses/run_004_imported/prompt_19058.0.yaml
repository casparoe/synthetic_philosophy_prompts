answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Ellen's niece/nephew. I was apparently voted into giving this toast, which feels appropriate. In a room full of experts who can identify a pigment from 1650 by smell, the family figured the person least likely to know a Rembrandt from a render was the safest bet.

  We all know what Ellen does. Or at least, half of you think you do. To the family, Ellen's job is simple: she's the human Geiger counter. She walks up to a canvas, her internal dial clicks faster, and she says, "Fake," or "Real." We imagine her holding a magnifying glass up to a signature like she's solving a crossword puzzle.

  But to the colleagues in this room—the conservators, the specialists, the auction house veterans—you know it's much heavier than that. For 38 years, Ellen hasn't just been checking for lies. She's been guarding history.

  And this brings me to the thing I was most terrified of getting wrong tonight. Because while the family thinks she spots fakes, Ellen knows she's defending a specific philosophical boundary.

  Ellen, I know you're listening for this. I did the reading.

  There is a philosopher named Nelson Goodman who argued that art comes in two flavors. There are art forms like poetry or music, where the work is defined by the notes or the words. If I photocopy this speech, or if I email it to you, it is still *this speech*. The medium doesn't carry the soul of the work. That's what Goodman called "allographic."

  But then, there's painting. A Vermeer.

  Ellen has spent nearly four decades explaining to us that a painting is "autographic." This means the history of how it was made is part of what the art *is*. If a forger creates a perfect copy of a Vermeer—down to the molecular level of the paint—Ellen insists it is not just a lie. It is a *different artwork*. It lacks the specific moment in time where the artist's hand touched the canvas. It lacks the lineage.

  To the family: This means Ellen doesn't just care if it looks right. She cares about the journey. To the pros: This means she knows that provenance isn't just paperwork; it's ontology.

  I tried to explain this at Thanksgiving once. I said, "So, Aunt Ellen, if I write a poem, and my brother copies it, it's the same poem. But if I paint a turkey, and my brother copies it, it's... a different turkey?"

  She corrected me. "It's a different *artwork*."

  She banned me from using a certain A-word that starts with 'A' and rhymes with 'Flora'—apparently, a former coworker ruined that word for her forever by quoting Walter Benjamin at a staff meeting in 1998. So, I will not use it. But Ellen believes that the value of a painting isn't just in what your eyes see. It's in the witness of the object.

  And honestly, that's why we're all here for *her*.

  In a world of digital reproductions, of NFTs, of high-resolution scans where anyone can see a brushstroke on an iPad, Ellen represents the autographic. Her expertise isn't something you can photocopy. You can't download her thirty-eight years of squinting at craquelure under raking light. You can't forge her instinct.

  If Ellen gave this speech, and I memorized it and said it next week, it would be a forgery. It might sound the same, but it wouldn't be the toast. Because the value is in the speaker, and the history, and the specific moment we are all sharing right now.

  Ellen, you have spent your career proving that the original matters. That the hand of the artist matters. That truth has a texture.

  So, if everyone could please raise a glass.

  To Ellen. May your retirement be entirely autographic. May every moment be an original, with perfect provenance, and may you never have to authenticate another brushstroke unless you want to.

  To Aunt Ellen!
