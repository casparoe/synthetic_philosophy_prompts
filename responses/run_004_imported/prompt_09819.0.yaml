answer: |-
  Good evening. For those who don't know me, I'm David, Dan's older brother. I'm a software engineer, which means I spend my day telling rocks how to think. So, I feel uniquely qualified to introduce a man who has spent fifteen years asking *whether* thinking actually does anything at all.

  For the family members in the back: Dan is a philosopher. For the philosophy and neuroscience faculty in the front: I know, I know. I've listened to the dinner table talk. I know Dan specializes in the "exclusion problem."

  For the uninitiated, the exclusion problem is basically a very sophisticated existential crisis. It asks: If every action I take is caused by neurons firing in my brain, and physics is a closed loop, what causal work is left for my *beliefs* or *desires* to do? Are my thoughts real drivers of my life, or are they just inert decoration riding on top of the biology?

  Dan has written two books arguing that thoughts aren't decoration. He's a non-reductive physicalist, which is a fancy way of saying he believes the mind is physical, but you can't explain it away by just pointing at atoms. He insists that higher-level patterns can do real work in the world.

  And then he met Priya.

  Priya, as we know, is a cognitive neuroscientist. Their courtship was essentially a fifteen-year peer review process. Priya's standing joke is that she's going to find the specific neuron that "really" proposed to her, bypassing Dan's agency entirely. And Dan's fear, I think, was that if she found it, he'd be out of a job.

  But watching them together, I've realized something that Dan's colleagues might appreciate, and his family will hopefully feel.

  If you want to know if a pattern has causal power, don't look at a brain scan. Look at a marriage.

  A marriage is physically realized. It's in the house you buy, the neurons firing when you look at each other, the bank accounts you merge. A reductionist might say, "It's just a bunch of physical states." But anyone who has been married knows that "The Marriage" is a thing in itself. It makes decisions. It offers comfort. It changes the trajectory of two lives in a way that two single lives never would.

  The pattern *does* the work.

  Dan, you've spent your career worried that the mental might be excluded from the physical chain of events. But look at what you've built with Priya. The love you share isn't a ghost in the machine, and it isn't just a chemical side-effect. It is a structure you've built that now exerts force on the world. It causes you to be kinder, braver, and yes, to propose.

  Priya, you might find the neurons that lit up when he asked. But you won't find the neuron for the fifteen years of patience that led to it, or the promise of the years ahead. That's a higher-level pattern. And it has causal power.

  So, for the faculty: I promise I haven't committed any category errors. And for the family: I promise this was about love.

  Dan, you wanted to prove that reasons can be causes. I think you've done it. You gave Priya a reason, and she said yes. That caused this wedding.

  Please raise your glasses. To the bride and groom: May your union always be more than the sum of its parts, and may your love always do real work in the world.

  To Dan and Priya.
