answer: |-
  This is a fantastic argument to have, and honestly, you and Priya have stumbled onto one of the most famous tensions in aesthetic philosophy. Tolstoy's *What Is Art?* (1897) is notorious for exactly this reason: it starts as a radical formalist definition and ends as a rigid moral sermon.

  To answer your question directly: **You are logically right about the "bait-and-switch," but Priya is right about the "internal system."**

  Here is the walkthrough of Tolstoy's internal logic, where the seam breaks, and why you're both partially correct.

  ### 1. The Two-Stage Rocket
  Tolstoy's argument functions like a two-stage rocket. If you don't notice the separation between the stages, it looks like one continuous flight.

  **Stage 1: The Descriptive Definition (The "Infection")**
  Tolstoy begins by trying to find a definition of art that isn't based on "Beauty" (which he thinks is vague and aristocratic). He lands on **transmission**.
  *   **Logic:** Man A feels X. Man A uses external signs (words, sounds, colors) to make Man B feel X. If Man B feels it, art has occurred.
  *   **Implication:** This is indeed democratic. A lullaby, a folk song, or a blockbuster movie *can* be art under this definition.
  *   **Your Point:** You are correct that at *this specific stage*, your Marvel argument holds. If a Marvel movie makes millions feel tension or grief, it passes the "infection" test better than an obscure poem.

  **Stage 2: The Teleological Evaluation (The "Purpose")**
  Here is where Priya comes in. Tolstoy immediately asks: *Okay, but what is art FOR?*
  He argues art is not just a party trick; it is a vital organ of human survival. Just as speech transmits thoughts to help us cooperate, art transmits *feelings* to help us unite.
  *   **Logic:** The progress of humanity is defined by moving from division (tribes, nations, classes) toward unity (universal brotherhood). Therefore, "Good Art" is art that transmits feelings that unite people. "Bad Art" transmits feelings that divide people (sexual lust, national pride, religious sectarianism).
  *   **Priya's Point:** She is correct that this isn't a random addition. For Tolstoy, you cannot separate the *mechanism* (infection) from the *function* (union). If a virus "infects" you, it's biologically effective, but it's bad for your health. Tolstoy views art that divides as a social virus.

  ### 2. Where the Logic Breaks (The "Smuggling")
  This is where your "bait-and-switch" accusation hits home. Tolstoy wants to have it both ways, and he uses the moral criterion to retroactively deny the empirical reality of the infection criterion.

  **The Shakespeare Problem**
  Tolstoy knows everyone loves Shakespeare. By his own Stage 1 definition, Shakespeare *must* be infecting people. But Shakespeare fails Stage 2 (his plays focus on kings, passion, and fate, not Christian brotherhood).
  *   **The Consistent Move:** Admit Shakespeare infects people, but label it "Bad Art" (like admitting heroin is effective medicine but destroys the patient).
  *   **The "Smuggled" Move:** Tolstoy often argues that people *aren't* actually infected by Shakespeare. He claims the upper classes have been "hypnotized" into pretending they feel it to signal their status. He writes that Shakespeare's characters don't speak human language and the situations are implausible.

  **This is the logical flaw.** He uses the moral axiom (Stage 2) to invalidate the empirical observation (Stage 1).
  *   If infection = art, and millions are infected by *Romeo and Juliet*, then it is art.
  *   Tolstoy says: "No, because it promotes exclusive passion, it *cannot* be true infection, therefore it is counterfeit."
  *   **You are right:** This is circular. He is defining "True Infection" as "Infection of feelings I approve of." That is a separate axiom bolted onto the definition to protect it from counter-examples.

  ### 3. The Marvel Movie Test
  Let's apply this to your Marvel example, because Tolstoy would actually reject your premise, but not for the reason Priya thinks.

  Tolstoy distinguishes between **Art** and **Amusement**.
  *   **Amusement:** Designed to distract or pleasure the audience (spectacle, explosions, cheap thrills).
  *   **Art:** Designed to transmit a specific feeling the artist *sincerely* felt.

  Tolstoy would argue a Marvel movie is mostly **counterfeit art** or **amusement**. Why?
  1.  **Sincerity:** It is made by a committee for profit, not an individual compelled to transmit a feeling.
  2.  **Content:** Even if it makes you cry, is it transmitting "universal brotherhood"? Or is it transmitting "tribal pride" (Avengers vs. Thanos) or "spectacle"?

  So, while your democratic intuition (millions feeling something) aligns with Tolstoy's desire for *accessibility*, he would argue the *quality* of the feeling matters more than the *quantity* of the people. A million people feeling tribal pride is worse, to him, than ten people feeling Christian love.

  ### 4. The Verdict: Who is Right?

  **Priya is right about the Philosophy.**
  She understands that for Tolstoy, the "universal brotherhood" requirement isn't a random rule he added on Tuesday; it is the *engine* of the whole book. He believes art is a religious duty. If you remove the moral requirement, Tolstoy's system collapses into "anything that moves you is good," which he explicitly rejects. She is reading the book as a cohesive theological argument.

  **You are right about the Logic.**
  You have spotted the rhetorical sleight of hand. Tolstoy defines art as "infection" (neutral), but then evaluates it as "good infection" vs. "bad infection," and then frequently conflates "bad infection" with "not infection at all."
  *   When he trashes Wagner, he doesn't just say "This infects people with bad feelings." He says, "This is insane, no one actually likes this, they are just pretending."
  *   That is him protecting his theory from reality. If he admitted Wagner genuinely infected millions with "exclusive" feelings, his theory that "Good Art = Union" would be in trouble. So he denies the infection exists.

  ### The Nuanced Take
  Tolstoy is being **teleologically consistent** but **empirically dishonest.**

  *   **Teleologically (Goal-oriented):** He is consistent. If the goal of art is human unity, then art that promotes division is a failure, regardless of how much it moves people. Priya wins here.
  *   **Empirically (Observation-based):** He is inconsistent. He refuses to accept that "infection" can be measured independently of "moral value." He rigs the test so that if the moral value is low, the infection score must also be low. You win here.

  **My advice for the next round with Priya:**
  Tell her she's right that the moral criterion is central to Tolstoy's *system*, but you're right that it undermines his *definition*.
  Say this: *"Tolstoy claims 'infection' is the objective test for art. But whenever the infection test gives him a result he hates (Shakespeare), he overrides it with the moral test and claims the infection wasn't real. That means 'infection' isn't the definition; 'moral approval' is. He didn't extend the theory; he hijacked it."*

  That should get you another hour of arguing, but at least now you'll be arguing with the text, not just impressions.
