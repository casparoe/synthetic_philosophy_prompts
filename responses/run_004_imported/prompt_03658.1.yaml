  2.  **Deconstruct Tolstoy's Argument in *What Is Art?***
      *   *Premise 1 (Definition):* Art is the transmission of feeling from artist to audience ("infection").
      *   *Premise 2 (Quality):* The *degree* of infectiousness determines quality (individuality, clarity, sincerity).
      *   *Premise 3 (Purpose/Content):* This is the crux. Tolstoy argues that art *must* serve a function in human life. What is that function? The union of mankind.
      *   *The Shift:* He moves from *how* art works (mechanism of infection) to *what* art should do (religious consciousness of the time).
      *   *The "Christian" Perception:* For Tolstoy, the "religious consciousness" of his era is universal brotherhood. Therefore, true art must transmit feelings that unify, not divide.
      *   *The Critique of "Exclusive" Feelings:* Feelings like romantic passion (Romeo & Juliet), national pride, or religious sectarianism divide people (us vs. them). Therefore, even if they infect, they are "bad art" or "counterfeit art" because they work against the purpose of art (union).

  3.  **Evaluate the "Internal Logic" (Consistency vs. Bait-and-Switch):**
      *   *Is it consistent?* Tolstoy believes art is a *tool* for human progress. If the tool is used for regression (division), it's a bad tool. So, the moral criterion isn't arbitrary; it's teleological (based on the end goal of art).
      *   *Is it a bait-and-switch?* From a modern aesthetic standpoint, yes. He redefines "good art" from "effective transmission" to "effective transmission of *specific* feelings." He changes the metric mid-stream.
      *   *The "Infection" alone isn't enough:* Tolstoy explicitly states that infection is the *sign* of art, but the *value* depends on the content. A disease infects, but it's bad. So, infection makes it *art*, but the *feeling* determines if it's *good* art.
      *   *Wait, does he call Shakespeare "not art" or "bad art"?* He often calls it "counterfeit" or "bad." He argues the upper classes *think* they are infected due to social conditioning, not genuine infection. This is a key defensive move.

