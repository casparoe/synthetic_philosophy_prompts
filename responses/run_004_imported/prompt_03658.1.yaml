          *   Priya's claim: Tolstoy adds a moral criterion ("universal brotherhood"/Christian love) to the infection theory. This explains why Shakespeare/Wagner fail (exclusive feelings) vs. Dickens (accessible feelings). She sees this as a *natural extension*.
          *   User's claim: The moral criterion is a *separate axiom* smuggled in to justify his tastes (a bait-and-switch).
