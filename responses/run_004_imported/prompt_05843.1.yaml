      *   **Task:** Write an essay engaging with specific philosophical frameworks to analyze whether these three are "socially constructed" in the *same* sense.
      *   **Required Frameworks:**
          1.  Ian Hacking: Interactive vs. Indifferent kinds, Looping effects.
          2.  John Searle: Institutional facts, Status functions ("X counts as Y in context C"), Ontologically subjective/Epistemically objective.
          3.  Sally Haslanger: Ameliorative analysis, Social position tied to perceived bodily features.
      *   **Key Questions to Address:** Are they all "interactive"? How explicit are the constitutive rules? What is normatively at stake in "unmasking" them?
      *   **Constraint:** No "diplomatic shrug" at the end. Must provide a verdict: Unified phenomenon OR importantly different things (with fault lines explained).

  2.  **Deconstruct the Three Cases via the Frameworks:**

      *   **Money:**
          *   *Searle:* Perfect fit. Paper (X) counts as Currency (Y) in Context (C). Collective intentionality is required. Ontologically subjective (depends on us), Epistemically objective (it's a fact that this bill is worth $20).
          *   *Hacking:* Is it interactive? Not really. A dollar bill doesn't change its nature because we classify it as a dollar bill. People *use* it differently, but the classification doesn't alter the *kind* in a feedback loop in the same way human kinds do. It's closer to an indifferent kind (though Searle would say all institutional facts are created by classification). Let's refine: The *object* doesn't react to the classification.
          *   *Haslanger:* Not really applicable directly, as money isn't a social *identity* based on bodily features. It's a functional status.
          *   *Normative Stake:* Unmasking money doesn't necessarily liberate anyone. Knowing money is fake doesn't stop you from needing it to eat.

      *   **Race:**
          *   *Searle:* Fits to an extent (social status), but the "X" (bodily features) is often misinterpreted as biological essence. The "Y" (racial category) is imposed.
          *   *Hacking:* Highly interactive. Classifying someone as a specific race affects how they are treated, how they see themselves, and how the category evolves (looping effects).
          *   *Haslanger:* This is her primary target. Race is a social position of hierarchy based on perceived ancestral features. Ameliorative aim: Political justice.
