      *   *Commonality:* All depend on human agreement/intentionality (Searle). None exist without humans.
      *   *Difference:* The *consequences* of the construction differ. Money is a *tool* (status function for exchange). Race/Gender are *identities* (interactive kinds that shape the person classified).
      *   *The Fault Line:* It lies between *Institutional Artifacts* (Money) and *Human Kinds* (Race/Gender).
      *   *Hacking's Contribution:* This is the wedge. Money is largely indifferent (the bill doesn't care); Race/Gender are interactive (the person cares and changes).
      *   *Haslanger's Contribution:* Race/Gender have a specific *political* function (hierarchy) that money does not necessarily have in the same ontological way (money is a medium, race/gender are hierarchies).
      *   *Searle's Contribution:* Explains the *mechanism* (X counts as Y), but hides the *impact*.

