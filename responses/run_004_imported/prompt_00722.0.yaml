answer: |-
  A Maximizer and a Satisficer are stuck working late and need to order dinner.

  The Maximizer opens twelve tabs, cross-referencing delivery times, calorie density, review sentiment analysis, and promo code stacking to find the global utility optimum.

  The Satisficer orders the first Thai place that pops up with a rating above 4 stars.

  The Maximizer looks up, horrified. "How can you commit? You haven't evaluated the marginal cost of the pad see ew versus the drunks! What if the next option was 5% better?"

  The Satisficer takes a bite of their noodles. "I set an aspiration level for 'hot food that arrives before midnight.' This cleared it."

  "But what if nothing had cleared it?" the Maximizer presses. "Would you have starved?"

  "No," says the Satisficer. "I would've lowered the aspiration level for 'hot' to 'edible,' and then to 'calories,' until something worked."

  The Maximizer shakes their head, still scrolling. "That's irrational. You're settling for local maxima."

  The Satisficer finishes the container and tosses it in the trash. "Look, I'm full and you're still loading the menu. You're not a rational agent, man. You're just Buridan's Ass with a GPU."
