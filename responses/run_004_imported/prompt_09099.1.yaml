      *   **Step 4: Dialogue Snippets.** Create actual lines the protagonist can use or adapt.
      *   **Step 5: Thematic Integration.** Connect it back to the novel's themes (coincidence, burnout, adjunct life).

  5.  **Refining the Argument (Self-Correction during drafting):**
