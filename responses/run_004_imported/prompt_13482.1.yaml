  2.  **Initial Brainstorming & Mapping Concepts:**

      *   *CPA:* Agents share the same prior probability distribution over the state space before receiving private signals.
      *   *Uniqueness Thesis:* Given evidence $E$, there is only one rational credence function $P(\cdot|E)$.
      *   *Permissivism:* Given evidence $E$, there can be multiple rational credence functions.
      *   *The Link:* If CPA holds, then $P_{Agent1} = P_{Agent2} = P_{Common}$. Before signals, evidence is empty (or symmetric). If priors must be identical, then for empty evidence, there is only one rational prior. This looks like Uniqueness for the null evidence case.
      *   *Gul's Objection:* CPA is mathematically trivial. Any set of posteriors can be rationalized by *some* prior and *some* information structure. If it's trivial, how can it be a substantive metaphysical/epistemological claim?
      *   *Counter to Gul:* Triviality in representation doesn't mean triviality in *normative force*. If the model *requires* the prior to be common *as a condition of rationality*, it's normative. Gul shows it's always *possible* to model beliefs with a CPA, but EGT often uses CPA to rule out certain belief configurations as inconsistent with common knowledge of rationality or to prove agreement theorems.
      *   *Aumann-Harsanyi Motivation:* Harsanyi wanted to reduce games of incomplete information to games of imperfect information. Aumann wanted to show that "agreeing to disagree" is impossible for Bayesians. Both rely on the idea that differences in belief *must* be traceable to differences in information, not differences in "rational processing" or "starting points."

