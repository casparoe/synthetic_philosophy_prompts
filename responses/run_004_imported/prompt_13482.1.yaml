          *   *Further Refinement:* Gul's point is about *ex post* rationalization. But EGT uses CPA *ex ante* to constrain the solution space. If a Permissivist says "Two agents can rationally start with different priors," the CPA modeler says "No, that's not a valid model of common knowledge rationality." That's a normative clash.
      *   **Section 4: The Harsanyi Doctrine & Rationality.** Harsanyi explicitly argued that differences in probability assessments must be due to different information. This is literally the Uniqueness Thesis applied to game theory. To accept Harsanyi's doctrine is to reject Permissivism.
      *   **Section 5: Implications for the Permissivist.** Why should a Permissivist care? Because accepting CPA in models implicitly accepts Uniqueness. If Permissivism is true, the Agreement Theorem doesn't hold for *rational* agents, only for agents who happen to share priors. Therefore, CPA cannot be a general requirement of rationality.
