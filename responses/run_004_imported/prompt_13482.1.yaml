      *   **Section 2: CPA as Limiting Uniqueness.** Connect the "no information" state to the Uniqueness debate. If priors must match, rationality dictates a unique starting point. This contradicts Permissivism (which allows different starting points even with same evidence).
      *   **Section 3: Addressing Gul's Triviality Objection.** This is the crux. Gul says CPA is always satisfiable mathematically.
