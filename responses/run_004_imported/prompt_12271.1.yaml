      Okay, the plan is solid. I will write the questions and the specific follow-ups now.

      *Drafting Follow-ups:* The prompt says "keyed to the answer she's most likely to give." Her likely answer is "He was being scrupulous/respectful of the evidence." So the follow-up must challenge *why* scrupulousness leads to *this specific outcome* and not others.

