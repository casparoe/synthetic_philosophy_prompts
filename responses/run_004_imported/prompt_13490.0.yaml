      *   *Is he right that annual haggling is the baseline?* Annual haggling has transaction costs (stress, nastiness, mom refereeing). Even if the allocation is "efficient" in a given year, the *process* has negative utility.
      *   *The Core Issue:* Information asymmetry (private knowledge of schedules) + varying preferences over time.

  3.  **Brainstorming Mechanism Design Solutions:**
      *   *Idea 1: Alternating Years.* A gets first pick in odd years, B in even years.
          *   *Pros:* Fair in the long run.
          *   *Cons:* Still requires negotiation *within* the year (who picks which weeks?). Still creates "bad years" for one person. Doesn't solve the annual friction entirely.
      *   *Idea 2: Random Assignment.* Draw straws every year.
          *   *Pros:* Unbiased.
          *   *Cons:* High variance. One person could get screwed five years in a row. Doesn't reduce negotiation (still need to swap if needed).
      *   *Idea 3: Market Mechanism (Internal Auction).*
          *   *Concept:* Give them a budget of fake money. Auction off the weeks.
          *   *Pros:* Reveals true value.
          *   *Cons:* Complicated. Requires actual money or points tracking. Might feel transactional between family.
      *   *Idea 4: The "I Cut, You Choose" Variant (Dynamic).*
          *   *Concept:* One divides the weeks, the other chooses.
          *   *Pros:* Incentivizes fair division.
