prompt: |-
  Ok, this has nothing to do with the seminar I'm teaching, but I can't stop thinking about it. My two nephews jointly inherited our late uncle's lake cabin, and every spring they have this exhausting, sometimes nasty negotiation over who gets which summer weeks, because their work schedules vary a lot and honestly neither one fully trusts the other's account of how flexible they really are that year. My sister (their mom) is sick of refereeing this and wants them to just agree, once and for all, on a permanent rule for splitting up the weeks going forward instead of relitigating it every spring - but one nephew says that's a trap, since neither can verify how flexible the other genuinely is in a given year, so whatever fixed rule they lock in now is just as likely to leave him worse off down the road as the yearly haggling would've. Is he right that there's basically no way to design a standing rule thats guaranteed to leave both of them at least as well off as the yearly haggle no matter how things turn out, or is his mom onto something and there's a cleverer way to set this up that's actually safe for both sides?
reasoning: |-
