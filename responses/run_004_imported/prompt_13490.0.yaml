      *   *Idea 6: The "Right of First Refusal" + "Default Split".*
          *   *Concept:* Establish a baseline ownership of time. If you can't use it, you must offer it to the other before renting it out or leaving it empty.
      *   *Idea 7: Sealed Bid Auction (Vickrey style).*
          *   *Concept:* Each submits a bid for the weeks they want. Highest bidder gets it, pays the second price (in points or money).
          *   *Cons:* Too complex for family.

