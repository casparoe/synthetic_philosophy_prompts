      *   *Refining the distinction:*
          *   Issue A (Imprecision): How to model "I don't know." DST solves this better than Bayes.
          *   Issue B (Conflict): How to combine "I know X" and "I know Y" when X and Y contradict. DST (via Dempster's rule) fails here.
