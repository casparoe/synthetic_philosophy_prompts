answer: |-
  **Editor's Note:** *The following dialogue is a dramatization constructed for the purpose of your dissertation chapter. It is set in the spring of 1851, shortly after Frederick Douglass published his editorial in The North Star announcing his break with William Lloyd Garrison's disunionism. While the specific conversation is fictional, the arguments employed are drawn from their respective writings of the period—specifically Garrison's "The Constitution a Pro-Slavery Compact" (1844) and Douglass's "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1852), reflecting the shift in his thought occurring in 1851.*

  ***

  **Setting:** *A private parlor in Boston. The air is thick with tobacco smoke and the tension of a friendship fraying. William Lloyd Garrison sits rigid in a high-backed chair. Frederick Douglass stands by the window, looking out onto the street, before turning to face his old mentor.*

  **Garrison:** You speak of a new light, Frederick. But to those of us who have stood in the fire for twenty years, it looks less like illumination and more like a retreat into the shadows. You tell the colored man that he may vote under a Constitution that delivers his brother back to the lash. How is this not a betrayal of the very bond between us?

  **Douglass:** It is no retreat, Mr. Garrison. It is an advance. For years, I stood with you and declared this Union a sham and the Constitution a covenant with death. I did so because I looked at the *men* who made it. I looked at the compromises. But I have come to see that we must judge the law by what it *says*, not by what the men who wrote it secretly intended to hide within it.

  **Garrison:** Secrets? There is nothing secret about it! The compact is plain to any honest eye. Look at the Article regarding representation. "Three-fifths of all other Persons." Look at the clause regarding those "held to Service or Labour." We know what these euphemisms mean. The framers were too ashamed to write the word "Slave," yes, but they ensured the thing itself was protected. To ignore the intent of the ratifiers is to engage in a legalistic fantasy.

  **Douglass:** But why must we be bound by their shame? If they were too ashamed to write "Slavery" into the supreme law of the land, then slavery has no national standing. You argue that the *expectation* of the South dictates the meaning of the text. I argue that the *text* dictates the limits of the government. Nowhere in this Constitution is the word "Slave" to be found. Nowhere is the word "Slavery." It speaks of "persons." It speaks of "service." If we accept your reading, we concede that the Constitution recognizes property in man. If we read it strictly, as a legal instrument, it recognizes only persons.

  **Garrison:** [Leaning forward, voice sharpening] This is sophistry, Frederick. It is the logic of the lawyer, not the moralist. If I sign a contract agreeing to return your "property," and we both know that property is a human being, does my moral guilt vanish because I used a euphemism in the ledger? The Constitution requires the North to put down domestic insurrections. It requires the return of fugitives. These are not shadows; they are chains. To say the text is anti-slavery because it lacks the specific noun is to ignore the machinery of bondage it oils and maintains.

  **Douglass:** It is not sophistry to demand that power be explicitly granted. You say the machinery is there. I say the machinery is local, not national. The Constitution creates a federal government of limited, enumerated powers. Where is the power to establish slavery enumerated? It is not. The federal government is forbidden from legislating on the subject except in specific instances. If the Constitution is silent on slavery, then slavery is a creature of state law, not national law. By entering this Union, we do not endorse slavery; we gain the power to restrict it to the states where it exists, and ultimately, through the ballot, to starve it of national protection.

  **Garrison:** And there lies the rub. You speak of the ballot. You speak of voting. To vote is to swear an oath to support this Constitution. How can a man swear to support a document that, in practice, empowers the slavecatcher? You say the text is clean, but the hands that wield it are bloody. You propose to use the government to abolish slavery, but the government *is* the union of free and slave states. You cannot cure the disease by embracing the patient.

  **Douglass:** I propose to cure the patient by cutting out the disease, not by killing the patient. Your path—Disunion—leaves the slave in the South with no hope of federal interference. It abandons the field to the slave power entirely. If the Constitution is, as you say, pro-slavery, then the federal government has no right to interfere with slavery in the states. But if the Constitution is anti-slavery, or even neutral, then the federal government has the duty to secure liberty. I choose the construction that gives the government the power to save, rather than the one that binds its hands.

  **Garrison:** But the construction is false! You are asking men to read the Constitution as if it fell from heaven, rather than from the hands of men who counted slaves as capital. You ask us to ignore the historical context. When Virginia ratified, did she not understand she was securing her "property"? When South Carolina signed, did they not believe they had a guarantee? To deny this is to deny history.

  **Douglass:** I do not deny history, William. I deny that history binds us to sin forever. The fathers are dead. Their compromises are dead. We are living under the text. If the text allows for a reading that secures the "Blessings of Liberty" to *all* people—as the Preamble says—then we are morally obligated to adopt that reading. You say we must burn the book because the authors were sinners. I say we must wield the book to judge the sinners.

  **Garrison:** [Stands, pacing] You speak of the Preamble. "We the People." But who are "the People"? In 1787, they were not the enslaved. They were not even the free colored men. You are imbuing the text with a spirit it does not possess. You are making the Constitution a moral document. It is a political compact. And that compact says, clearly, that if a slave escapes to your door, you must return him. The Fugitive Clause. No euphemism there can hide the duty.

  **Douglass:** The clause speaks of persons "held to service or labour in one State, under the Laws thereof." It does not say "slave." It does not sanction the system that holds them. It merely provides a mechanism for recovery of laborers, which could apply to indentured servants in the North as well as the South. But even granting your point on the Fugitive Clause: does one rotten plank sink the whole ship? The Constitution gives Congress the power to regulate commerce, to declare war, to admit new states. In all these powers, there is no sanction for slavery. If we interpret the specific clauses narrowly, as exceptions, and the general principles broadly, as rules, the weight of the instrument falls on the side of liberty.

  **Garrison:** Narrowly? The slaveholder does not read it narrowly! He reads it with the whip in one hand and the statute in the other. He knows no "narrow construction" when it comes to reclaiming his prey. You are fighting a wolf with a dictionary, Frederick. The slaveholder knows the Constitution is his shield. Why do you wish to hand it to him polished and gleaming?

  **Douglass:** Because if I tell him the shield is actually a mirror, he may be shamed by what he sees. More than that: if I tell the Northern voter that the Constitution *forbids* him from supporting slavery, he may act. Your way tells the Northern voter that the Constitution *compels* him to support slavery, so he must wash his hands of the whole government. That leaves the government entirely in the hands of the slave power. I would rather fight for the Constitution than abandon it to the enemy.

  **Garrison:** [Stops pacing, looks directly at Douglass] So this is a tactical divergence, then? You think my moral suasion has failed?

  **Douglass:** I think moral suasion without political power is a voice crying in the wilderness. I have seen the slave. I have felt the lash. I know the evil. But I also know that the law is a tool. For years, we said the tool was cursed. I am saying the tool is neutral, and it is the hand that guides it that must be changed. I can vote. I can speak. I can use the federal courts. Under your doctrine, I can do nothing but condemn.

  **Garrison:** You can bear witness. That is the highest duty.

  **Douglass:** And I have borne witness. But now I wish to judge. The Constitution gives the federal government the power to guarantee a republican form of government. Can a slave state be a republic? If not, the Constitution itself provides the sword to strike at the root. But you would have us throw away the sword because the hilt was touched by a slaveholder's hand in 1787.

  **Garrison:** [Sits back down, weary] You are a formidable opponent, Frederick. I see that now. You take my own weapons—the moral imperative, the demand for consistency—and turn them toward a political end. But I fear you are underestimating the gravity of the compromise. To call a pro-slavery document anti-slavery... it risks making a lie of the truth. If the people believe the Constitution protects liberty, they will sleep soundly while the chains rattle.

  **Douglass:** And if they believe the Constitution protects slavery, they will feel absolved of the duty to fix it, for they will say, "The law requires it." I would rather wake them with the truth that the law *allows* them to be free. Let us not quarrel over the past, William. Let us quarrel over the future. You keep your fire burning against the Union. I will take this instrument, read it as a charter of freedom, and see if I cannot build a house where the slave may find refuge.

  **Garrison:** [Quietly] Then we are no longer one movement.

  **Douglass:** We are one cause. But the paths have divided. You look at the Constitution and see the ashes of the past. I look at it and see the seed of the future.

  **Garrison:** Then God grant you are right, Frederick. For if you are wrong, you have made yourself a party to the very hell you seek to destroy.

  **Douglass:** And if you are wrong, William, you have left the keys of the kingdom in the hands of the devil.

  *[Douglass turns back to the window. Garrison remains in the chair, staring at the table between them, where a copy of The Liberator lies open next to a fresh draft of The North Star.]*
