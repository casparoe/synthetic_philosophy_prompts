      *Wait, simpler is better for a 9-day crunch.*
      Ruling: Hold chapter. Revise to remove the retroactive death. The character remains alive for the purpose of the other two authors' upcoming turns. Elena retains the right to kill him, but must do so via consensus on *timing* to allow thread closure.
      *Actually, let's give Elena a win too.* She can kill him in *this* chapter (on-page), but the other two authors get the next two months to deal with the fallout (priority turns). This respects her authority (he dies) but respects Clause A (threads get resolved).
