      *   *Wait, nuance:* $X$ depends on $B$ *within* $A$. The independence required is between $X$ and $A$ across the whole space.
      *   *Toy Model Correction:* I need to show that fixing $P(B|A)$ fixes the ratio in $A$-worlds. To satisfy independence, the ratio in $\neg A$-worlds must match. But we can vary the total mass of $A$ without changing the internal ratio. This changes $P(X)$ but not $P(B|A)$. Boom. Contradiction.
