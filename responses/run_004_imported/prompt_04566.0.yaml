      *   Let $A$ be true in some, $B$ in others.
      *   Let $X$ be the proposition corresponding to $A > B$.
      *   The Equation says $P(X) = P(B|A)$.
      *   Lewis's trick: Calculate $P(B|A)$ in two ways. One using the definition, one using the fact that $X$ is a proposition we can condition on.
      *   *Key Insight for the Geophysicist:* Think of $P(B|A)$ as a ratio of measures. If $X$ is a proposition, it partitions the space. The constraint requires the ratio to hold *within* the partition cells defined by $X$ as well as the whole space. This over-constrains the system.
      *   *Drafting the Toy Case:*
