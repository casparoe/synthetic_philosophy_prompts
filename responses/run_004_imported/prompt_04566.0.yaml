      *   *Better approach (Lewis's specific proof):* Focus on $P(B|A) = P(A > B)$.
      *   Show that $P(A > B | A) = P(B|A)$. (Since given $A$, $A>B$ is equivalent to $B$).
      *   So $P(A > B) = P(A > B | A)$.
      *   This implies $A > B$ is probabilistically independent of $A$.
      *   But semantically, the truth of $A > B$ in $A$-worlds is *determined* by $B$.
      *   If $P(B|A)$ is, say, 0.5, then $P(A>B)$ is 0.5.
      *   But in the $A$-subset, the truth value of $A>B$ matches $B$. So the frequency of $A>B$ in $A$ is 0.5.
      *   For $A>B$ to be independent of $A$, the frequency of $A>B$ in $\neg A$ must *also* be 0.5.
