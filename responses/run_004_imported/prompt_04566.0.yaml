          *   But the Equation should hold *conditional on X too*? No, Lewis shows that if the Equation holds for *any* probability function, it leads to $P(B|A) = P(B)$.
          *   *Wait, refine the intuition:* The killer move is that if $A > B$ is a proposition, we can update on it. If we learn $A > B$ is true, our new probability for $B$ given $A$ should be 1 (because in all $A$-worlds where $A>B$ is true, $B$ is true). But the Equation says $P_{new}(B|A)$ should be $P_{new}(B|A)$.
          *   Actually, the simplest algebraic intuition is: $P(B|A) = P(X)$. Also $P(B|A \land X) = 1$. Also $P(B|A \land \neg X) = 0$.
          *   By law of total probability: $P(B|A) = P(B|A \land X)P(X|A) + P(B|A \land \neg X)P(\neg X|A)$.
          *   Substitute: $P(B|A) = 1 \cdot P(X|A) + 0 \cdot P(\neg X|A) = P(X|A)$.
