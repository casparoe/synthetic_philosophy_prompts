answer: |-
  **Title:** The Weaponized Past: The Instability of the Origin/Function Distinction in Nietzsche's *Genealogy*

  **Introduction**

  In the twelfth and thirteenth aphorisms of the second essay of *On the Genealogy of Morality*, Nietzsche articulates what appears to be the methodological cornerstone of his entire project: a rigorous separation between the origin (*Entstehung*) of a practice and its later purpose or function (*Zweck*). He asserts that "the cause of the origin of a thing and its eventual utility, its actual employment and place in a system of purposes, lie worlds apart." According to this formulation, any custom, once established, is subject to continual reinterpretation by new configurations of will to power, rendering its original meaning irrelevant to its current operation. Nietzsche goes so far as to claim that "only that which has no history can be defined," implying that the fluidity of historical appropriation defies fixed essence. Sympathetic interpreters have seized upon this distinction to shield Nietzsche from the charge of committing the genetic fallacy—the logical error of assuming that the origin of a belief determines its validity. If origin does not fix function, the argument goes, then exposing Christian morality as the product of priestly *ressentiment* does not logically refute its truth claims; it merely historicizes them.

  However, a close reading of Nietzsche's actual genealogical practice in the First and Second Essays reveals a stark tension with this theoretical prohibition. Throughout the text, Nietzsche's polemic depends precisely on the insinuation that "shameful" origins discredit contemporary valuations, while "noble" origins are treated as comparatively innocuous or affirmative. This essay argues that the origin/function distinction in GM II:12–13 is an **unstable methodological device** that Nietzsche's rhetoric routinely violates. This instability is not merely a logical oversight but a constitutive feature of genealogy as a polemical art. Nietzsche cannot maintain the strict separation between origin and validity because his project of *transvaluation* requires the history of a value to bear normative weight. If origins were truly irrelevant to the status of a value, the genealogical exposure of *ressentiment* would be merely antiquarian, not destructive. Therefore, the distinction serves not as a logical shield against the genetic fallacy, but as a rhetorical maneuver that allows Nietzsche to deny dogmatism while simultaneously practicing a form of historical stigmatization.

  **The Theoretical Firewall: GM II:12–13**

  To understand the magnitude of the tension, one must first appreciate the sophistication of Nietzsche's theoretical claim in the Second Essay. In GM II:12, Nietzsche attacks the "naïve realism" of historians and philosophers who assume a teleological continuity between a thing's beginning and its end. He writes, "all purposes, all utilities are only signs that a will to power has become master of something less powerful and imposed upon it the character of a function." Here, Nietzsche posits an ontology of fluidity: the "thing" (whether a punishment ritual, a legal system, or a moral concept) is not a stable substrate but a dynamic site of struggle. Its meaning is overwritten by whoever possesses the power to interpret it.

  This formulation offers a robust defense against the charge that Nietzsche is reducing complex moral phenomena to their crude beginnings. By decoupling *Entstehung* from *Zweck*, Nietzsche anticipates the objection that modern justice cannot be dismissed simply because it evolved from primitive cruelty. The "meaning" of punishment is not locked in its prehistoric past; it is a palimpsest of interpretations. Consequently, many readers conclude that Nietzsche is not arguing that slave morality is *false* because it originated in weakness, but rather that it is *life-denying* in its current effects. On this reading, the genealogy is diagnostic, not deductive. The origin is cited not as a logical proof of falsity, but as a symptom of a physiological type. This interpretation preserves Nietzsche's philosophical respectability by insulating him from the genetic fallacy: he is not saying "X is bad because it came from Y," but "X is currently inhibiting human flourishing, and its history reveals the type of will that sustains it."

  **The Polemical Practice: The Stigma of Origin**

  While the theoretical framework of GM II:12–13 permits a non-reductive reading, Nietzsche's actual rhetoric in the First and Second Essays consistently collapses the distance between origin and value. The genealogical narrative is not presented as a neutral mapping of reinterpretations; it is presented as an unmasking that carries immediate normative consequences. In the First Essay, the "slave revolt in morality" is not described as a neutral repurposing of values but as an act of "imaginary revenge" that poisons the conscience of humanity. Nietzsche employs a vocabulary of infection, contagion, and sickness that implies the origin *sticks*. If the function of slave morality were truly independent of its origin, one could theoretically imagine a "healthy" version of slave morality repurposed by a strong will. Yet Nietzsche treats the connection between *ressentiment* and moral valuation as intrinsic.

  Consider the treatment of the "bad conscience." In GM II:16, Nietzsche describes the internalization of man as a "sickness," yet in GM II:18, he suggests this sickness is a pregnancy, a promise of the future. Here, the ambiguity of the origin/function distinction seems to be at work. However, when addressing slave morality specifically, the ambiguity vanishes. The origin in impotence is treated as a stain that no amount of reinterpretation can fully cleanse. Nietzsche's language suggests that the *source* of the valuation contaminates the *content*. He writes of the priests as the "most evil enemies" and suggests their values are born of a "lie." If the utility of these values were truly independent of their genesis, their "evil" origin would be irrelevant to their current utility. But Nietzsche's rhetoric relies on the reader feeling a sense of revulsion at the origin, which is then transferred to the value itself.

  This is most evident in the contrast between master and slave morality. Master morality originates in self-affirmation ("I am good, therefore you are bad"), while slave morality originates in reaction ("You are evil, therefore I am good"). Nietzsche clearly privileges the former. But if the origin/function distinction holds strictly, the reactive origin of slave morality should not preclude it from being repurposed for life-affirming ends. Nietzsche, however, treats the reactive structure as essential to the morality itself. He does not argue that slave morality *could* be repurposed; he argues that it *is* the expression of a declining life. In doing so, he treats the origin as constitutive of the essence, directly contradicting the claim in GM II:12 that "only that which has no history can be defined." For slave morality, its history *is* its definition.

  **The Verdict: Methodological Instability as Polemical Necessity**

  The tension between the theoretical fluidity of GM II:12 and the normative rigidity of GM I cannot be reconciled by claiming Nietzsche is merely diagnosing current effects. The diagnosis *depends* on the history. Nietzsche needs the history to do the work of undermining the authority of moral values. If he merely argued that Christian morality is currently life-denying, he would be making a utilitarian claim open to empirical counter-argument. By grounding the critique in the *origin*, he attempts to show that the value is *structurally* compromised by its genesis in weakness.

  Therefore, the verdict must be that the origin/function distinction is an **unstable methodological device**. It is unstable because Nietzsche's project requires it to be both true and false simultaneously. It must be true to prevent his critique from being dismissed as a simple historical reductionism (the genetic fallacy); it must be false (or at least blurred) to allow the history to carry the normative weight necessary for a transvaluation of values. Nietzsche wants to have it both ways: he wants the freedom of the perspectivist who knows all meanings are fluid (GM II:12), and the authority of the physician who can identify a pathology based on its etiology (GM I).

  This instability is not a failure of intellect, but a feature of genealogy as a genre of philosophical warfare. Nietzsche is not constructing a consistent epistemological system; he is engaging in a therapeutic intervention. The origin/function distinction acts as a shield when he is attacked for being unhistorical or reductive, allowing him to retreat to the sophistication of GM II:12. But when he is on the offensive, the shield is dropped, and the origin is wielded as a sword to discredit the opponent. To insist on the consistency of the distinction is to misunderstand the pragmatic aim of the text. Nietzsche's goal is not to provide a logically airtight method for historical analysis, but to induce a psychological crisis in the reader regarding their own values. For this crisis to occur, the history must matter. If the origin of *ressentiment* were truly independent of the value of "good and evil," the reader could acknowledge the history and retain the value. Nietzsche intends for the reader to feel that the value is compromised *because* of the history.

  **Conclusion**

  The charge that Nietzsche commits the genetic fallacy is often dismissed by appealing to the theoretical nuance of GM II:12–13. However, this defense relies on isolating Nietzsche's methodological reflections from his rhetorical practice. When viewed as a whole, the *Genealogy* demonstrates that the origin/function distinction is too fragile to bear the weight of Nietzsche's critique. He routinely violates the separation, treating the origins of slave morality as inherently discrediting while maintaining the theoretical posture that meanings are fluid. This verdict does not diminish the *Genealogy*; rather, it clarifies its nature. The work is not a scientific history that accidentally slips into polemic, but a polemic that instrumentalizes history. The instability of the origin/function distinction is the price Nietzsche pays for a method that seeks to be both descriptively accurate about the fluidity of power and normatively forceful about the hierarchy of life. To square the circle is to neuter the text; acknowledging the instability is to recognize the *Genealogy* as the weapon it was designed to be.
