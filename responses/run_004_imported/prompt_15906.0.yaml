answer: |-
  Friar: Consider two men seated in the same pew, hearing the identical sermon, moved by the identical grace. One rises to confess, the other hardens his heart. Why?

  Jesuit: The grace was sufficient for both, but efficacious only for one. The difference lies not in the gift, but in the consent of the will.

  Friar: Then the efficacy of God's grace depends upon the creature. But why does one consent and the other dissent, if the grace is identical?

  Jesuit: Because God knows, logically prior to any decree of His will, what any possible free creature would do in any possible circumstance.

  Friar: Knows what? There is no decree, no existence, no act. What reality makes that knowledge true?

  Jesuit: The truth is grounded in the nature of the creature itself, as seen within the Divine Essence.

  Friar: A nature that does not exist is nothing. You make God a spectator of shadows, basing His decree on a truth with no object.

  Jesuit: Better a spectator of shadows than the author of sin. Does your physical premotion not determine the will to act?

  Friar: It determines the will to be free, moving it according to its nature, not against it, infallibly but not coercively.

  Jesuit: If the premotion is infallible, the will cannot dissent. That is necessity, however you dress it in the language of freedom.

  Friar: Infallibility is not compulsion. God moves the cause to produce its effect freely, as is proper to a will.

  Jesuit: Then why did God not move the second man? Did He will his hardness by withholding that motion?

  Friar: He willed to permit it, having offered sufficient grace. The defect arises from the man, not the mover.

  Jesuit: But God knew the man would fail without the efficacious motion. To withhold it is to will the failure.

  Friar: The depths of God's election are unsearchable. We cannot limit His sovereignty to save our understanding of justice.

  Jesuit: Nor can we make Him the cause of rebellion to save His sovereignty.

  Friar: We save His sovereignty by admitting He moves all things, even the will, without destroying them.

  Jesuit: And we save His goodness by admitting He leaves some movements to us, without abandoning us.

  Friar: Your middle knowledge leaves God waiting on man.

  Jesuit: Your premotion makes man a puppet of God.
