      *   **SIA (Theo):** "Reason as if you are a random sample from the set of all *possible* observers, weighted by the probability of their existence." (Basically, worlds with more observers are more likely to contain *you*).
          *   *Weakness:* The Presumptuous Philosopher (SIA implies we should be extremely confident the universe is infinite/has tons of people, regardless of empirical evidence, just because there are more "slots" for me to be in).

  3.  **Set the Scene:**
