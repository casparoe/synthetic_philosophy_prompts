  So I've got two characters in the novel I'm drafting, Mara and Theo, long-married philosophers of probability who have apparently been re-fighting the same argument since their postdoc days: shes committed to the self-sampling assumption, he's all-in on self-indication, and its basically become their version of an old married couple's bit. I need the scene where it flares up again, this time at a dinner party in front of friends who have zero idea what they've just wandered into. Can you write me that dialogue? Since they've had this fight a hundred times already, they shouldn't waste breath explaining SSA vs SIA 101 to each other -- I want them to go straight for the sore spots: Theo has to actually answer for the presumptuous philosopher thing, and Mara has to actually answer for the doomsday argument, and neither of them gets to just say "well your view is weird too" and walk off clean. Real back and forth, both of them sharp, nobody strawmanned -- maybe a page long.
