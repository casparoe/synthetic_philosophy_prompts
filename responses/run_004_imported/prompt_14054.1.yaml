  The clink of a fork against ceramic cut through the lull in conversation. Sarah, the hostess, was mid-pour, her wine bottle hovering over Theo's glass.

  "—so I'm saying, the odds of us meeting are negligible, but here we are," Theo was saying, swirling his Cabernet. "Which suggests the sample space is much larger than we think. Infinite, even."

  Mara set her knife down. It didn't scrape; it landed with a deliberate, flat precision that made the table flinch. "Here we go."

  "Mara," Theo warned, smiling without warmth.

  "You're doing it at a dinner party?"

  "I'm making conversation."

  "You're making a metaphysical claim to justify why you don't have to worry about the future," Mara said, turning to the guests. "Theo believes the universe is infinite because if it weren't, he wouldn't be sitting here to observe it. It's a tautology wrapped in a prayer."

  "It's SIA, Mara. We've been over this since '98." Theo took a sip. "The fact of my existence is evidence for hypotheses that predict many observers. If the universe is huge, there are more 'me's. Therefore, a huge universe is more likely."

  "And that makes you the Presumptuous Philosopher," Mara shot back. "Literally. You're willing to bet against empirical evidence just because the alternative has a smaller denominator. If a physicist told you Theory A predicts a billion observers and Theory B predicts a trillion, you'd accept Theory B as a trillion times more likely without looking at a single telescope. That's not science, Theo. That's solipsism with math."

  Theo leaned forward, elbows on the table. "And you're still stuck in the graveyard. SSA. You treat me as a random sample from the *actual* observers. Which forces you into the Doomsday corner. Because if I'm a random human, and I'm alive in 2024, then humanity must be near the end. If there were trillions of future humans, I'd be improbably early. So, to make the math work, the future has to be empty."

  "I'm not predicting doom," Mara said, her voice tight. "I'm correcting for selection bias. You're inflating the reference class to avoid the conclusion."

  "I'm avoiding the conclusion because it's absurd! You're looking at the vitality of civilization and saying, 'Statistically, we should be dead soon.' You walk past a nursery and calculate the heat death of the universe."

  "Better than walking past a burning building and saying, 'Well, there are more people inside, so I'm probably inside, therefore the building isn't on fire.'"

  The table was silent. Sarah had stopped pouring wine. David was staring intently at his bread plate.

  "That's not the analogy," Theo said, his patience fraying. "The Presumptuous Philosopher objection assumes I ignore physics. I don't. I just say that if the physics allows for a multiverse, SIA weights it heavily. It's Bayesian."

  "It's arrogant," Mara corrected. "You assume the universe is structured specifically to maximize the probability of *you* existing. It's the Copernican principle inverted. We aren't the center of the solar system, but you're insisting we're the center of probability space."

  "And you're insisting we're the mediocrity of extinction," Theo countered. "Every time we talk about having grandchildren, you run the numbers. You can't help it. You look at our life and see a median distribution."

  "I see a confidence interval!"

  "You see an exit strategy."

  The air left the room. Mara blinked, the sting landing exactly where he aimed it. She picked up her wine glass, her hand steady, but her eyes didn't meet his.

  "If I'm wrong," Mara said quietly, "humanity ends sooner than you think. If you're wrong, you've built your entire ontology on a wager that the cosmos is obligated to be crowded. One of us is betting on death, Theo. The other is betting on a hallucination."

  "At least my hallucination has room for the guests," Theo said, gesturing to the stunned friends. "Your world is already closing up shop."

  Mara took a slow drink. "Pass the salt, please."

  Theo passed it. Their fingers didn't touch.

  "The wine is lovely, Sarah," Mara said to the hostess, her voice returning to a normal register, though the temperature in the room hadn't risen. "Truly."

  "Thanks," Sarah whispered, looking like she wanted to be anywhere else.

  Theo raised his glass to Mara. A truce, or a challenge. "To the sample space."

  Mara clinked her glass against his. "To the reference class."

  They drank. The guests exhaled.
