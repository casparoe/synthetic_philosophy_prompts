  **Move 1 (Marcus):** Marcus accurately captures the intuitive core of Zahavi's original Handicap Principle and its popular reception: honesty is guaranteed by waste. However, from the perspective of modern formal modeling, this is an imprecise statement. It conflates the *absolute* cost of the signal with the *differential* cost required for stability. While historically faithful to Zahavi's rhetoric, it lacks the technical precision required to distinguish handicaps from other signaling equilibria.

  **Move 2 (Renata):** Renata is technically correct regarding the game-theoretic formalization (e.g., Grafen 1990). The stability condition is the "single-crossing property" (marginal costs differ by type), not necessarily high absolute costs for the honest signaler. Her distinction that "cheating must be expensive, not honesty" is the standard modern interpretation of costly signaling theory (CST) and correctly identifies the mathematical requirement for a separating equilibrium.

  **Move 3 (Marcus):** Marcus attempts to reclaim the semantic territory of the "handicap." He argues that if the *potential* cost for a low-quality faker is high, the mechanism remains Zahavian in spirit. This is a defensible philosophical position—it preserves the insight that cost *somewhere* in the system is doing the work—but it blurs the crucial technical distinction between on-path (actual) and off-path (counterfactual) costs that Renata introduced.

  **Move 4 (Renata):** Renata raises the "trivialization objection," a significant critique in the philosophy of biology. If CST is defined solely by the existence of a stable separating equilibrium supported by differential costs (even counterfactual ones), it risks becoming tautological, explaining everything and predicting nothing (e.g., why some signals are wasteful and others aren't). Her point that the theory might tolerate wastefulness rather than predict it is a strong critique of CST's explanatory power.

  **Move 5 (Marcus):** Marcus successfully narrows the scope to biological systems lacking institutional enforcement (reputation, punishment), arguing that physical waste is the only remaining lever for honesty. This is a robust defense of the theory's biological relevance. However, it is not strictly true that cost is the *only* lever; he overlooks mechanisms where honesty is enforced by physical impossibility rather than cost, which weakens the claim that on-path cost is uniquely necessary.

  **What Both Are Overlooking**

  While Marcus and Renata debate the necessity of *cost* within the framework of strategic signaling, they both overlook the existence of **Index Signals**. An index is a signal that is honest not because it is costly to fake, but because it is physically impossible to fake (e.g., the deep roar of a large stag due to vocal cord anatomy, or immune competence linked to specific antigens). In these cases, there is no strategic choice to cheat, so the game-theoretic cost conditions discussed by both colleagues are irrelevant. Additionally, they briefly touch on but do not fully integrate **Conventional Signals**, where honesty is maintained by social policing or punishment (common in primates and humans) rather than metabolic waste. By framing the debate as "Cost vs. Game Theory," they miss the third category of "Constraint," which resolves the tension: some signals are costly handicaps, some are policed conventions, and some are unfakeable indices.
