      *   *Kepler's Mechanism:* The Earth has a soul (*anima terrae*). It perceives the angles like an ear perceives music. The rays are physical but perceived spiritually by the Earth.
      *   *Röslin's Counter:* If the Earth has a soul, why can't it recognize the Sun's entry into Aries as a seasonal marker? Why is the "quality" of the sign irrelevant?

  4.  **Drafting - Section by Section:**

