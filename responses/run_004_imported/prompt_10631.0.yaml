      *   **Röslin (Traditionalist):** Pragmatic, rooted in Ptolemaic/Arab tradition, values efficacy and historical continuity. He sees the zodiac as a necessary coordinate system that *has* worked for centuries. He suspects Kepler is dismantling the engine while trying to keep the car running.

  3.  **Key Arguments to Deploy:**
