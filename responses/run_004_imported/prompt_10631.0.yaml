answer: |-
  **Prague, Autumn 1618**

  **The Study of the Imperial Mathematician**

  *The room is dim, lit by a single tallow candle that sputters in the draft. The table between them is a landscape of paper: scattered ephemerides, ink-stained compasses, and a large sheet of vellum where a horoscope circle has been drawn, then aggressively crossed out in places. JOHANNES KEPLER sits hunched, his fingers stained with ink. Opposite him sits HELISAEUS RÖSLIN, physician and astrologer, nursing a cup of wine that has long gone cold.*

  **RÖSLIN:** You have crossed out the Ascendant, Johannes. And you have circled the opposition of Mars and Saturn in the margin, as if the paper itself were to blame for the alignment.

  **KEPLER:** The paper is innocent, Helisaeus. It is the labels that lie. I have erased the Twelfth House because there is no Twelfth House. There is only space. There is only the angle.

  **RÖSLIN:** And yet, when you cast the almanac for the Emperor, you predict the winter frost. You predict the unrest in Bohemia. How do you do this if the houses are fictions? The ancients taught us that the houses are the theaters of life. The Seventh is marriage, the Tenth is honor. Without the stage, how can the actors perform?

  **KEPLER:** Because the weather does not care for human marriage! The Earth cares for the geometry of the light that strikes it. When I predict the frost, I look to the aspect. A square, a opposition. These are rays that strike the terrestrial soul with a specific tension. I do not need to know if that ray falls in the house of Vesta or the house of Jupiter. The ray is the cause. The house is merely where the shadow falls.

  **RÖSLIN:** But the ray is defined by the circle, and the circle is divided by the zodiac. You accept the ecliptic, do you not? The Sun's path is real.

  **KEPLER:** The path is real. The motion of the bodies is real. But Aries? The Ram? That is a poem, Helisaeus, not a physics. The stars are scattered at varying depths. To draw lines between them and call them a Beast is to impose a human story on the divine machinery. God did not draw a Ram in the sky. He drew circles. He drew ratios.

  **RÖSLIN:** *Leans forward, tapping a finger on the vellum.* Here is the knot you cannot untie. You say the zodiac is arbitrary human bookkeeping. Very well. Let us grant you that the constellations are uneven, that the figures are myth. But the twelve signs—the tropical zodiac—are defined by the equinoxes. They mark the seasons. When the Sun enters the sign of the Ram, spring begins. The heat changes. The sap rises. Is that also a human fiction? Does the tree not know when the Sun enters Aries?

  **KEPLER:** *Sighs, rubbing his temples.* The tree knows the Sun's altitude. The tree knows the length of the day. This is physical. I do not deny the solar influence. But you astrologers claim that the *quality* of the sign influences the temperament. You say Mars is hot and dry, and therefore rules Scorpio. This is nonsense. Mars is Mars. Its light is its light. It does not change its nature because it passes behind a group of stars that the Chaldeans decided looked like a scorpion.

  **RÖSLIN:** It is not the stars alone. It is the sector of the ecliptic. Each sign has a 'quality.'

  **KEPLER:** Quality without quantity is a ghost! I tell you, the only quality that exists is harmonic quality. Look at this. *He draws a sharp triangle inside the circle.* A trine. One hundred and twenty degrees. It corresponds to the fifth in music. It is consonant. *He draws a square.* A quadrate. Ninety degrees. It corresponds to the fourth. It is dissonant, tense. These ratios exist in the mind of God. They exist in the monochord. When the planets form these angles, they sing.

  **RÖSLIN:** And the Earth hears them?

  **KEPLER:** The Earth has a soul, Helisaeus. *Anima terrae.* How else do you explain the tides? How else do you explain the growth of roots toward water? The Earth is a great animal. It perceives the aspects not with ears, but with its faculties. When the rays of two planets converge on the center of the Earth at a square, the Earth feels a tension, a stimulation, just as your ear feels the tension of a tritone. It reacts. It stirs the weather. It stirs the humors in men, because men are microcosms of the Earth.

  **RÖSLIN:** *Sits back, skeptical.* So, the Earth is a musician. It listens to the planets. But tell me, Johannes, why does this musical soul of the Earth not hear the zodiac? The division of the ecliptic into twelve is also geometric. Thirty degrees each. It is a regular division. If the Earth loves geometry, why does it not respond to the entry of a planet into a new sign?

  **KEPLER:** Because thirty degrees is not an aspect! It is a division of convenience. It is like measuring a cloth in ells. The ell is useful for the merchant, but the cloth does not feel the ell. The aspect is inherent in the relationship of the bodies themselves. Two planets can be in conjunction regardless of where they are in the circle. The angle exists between *them*. The sign exists only relative to the vernal point, which shifts! The precession of the equinoxes proves the signs are sliding against the stars. If the signs were natural, they would be fixed.

  **RÖSLIN:** They are fixed to the seasons, not the stars. We agreed on this. But let us press your harmonic theory. You say the Earth perceives the consonance. But in music, a fifth is pleasing. In your astrology, a trine is beneficial, yes? But a square is harmful, or at least difficult. Yet in music, the fourth is a fundamental consonance. Why is the geometry of the square 'evil' in the horoscope if it is 'good' in the choir?

  **KEPLER:** *Pauses, eyes lighting up.* Ah. You catch me. But you miss the distinction between static harmony and dynamic action. In music, we seek rest. In nature, action requires stimulus. The dissonance is the goad! The square urges the Earth to change. The trine allows it to flow. It is not that the square is 'evil,' it is that it is a sharp awakening. The Earth sleeps; the square wakes it. This is why I say astrology is not superstition, provided we strip away the Chaldean superstitions of rulerships and dignities. Mars does not 'rule' anything. But Mars at a square to the Sun is a shout in the ear of the World-Soul.

  **RÖSLIN:** And yet, Johannes, when I calculate a nativity using the traditional rulerships—domiciles, exaltations, the terms—I find hits. I find correlations. When the Lord of the Ascendant is in the Tenth, the man rises in station. If these are arbitrary, why does the machine work?

  **KEPLER:** Because the aspects are buried inside the traditional system like gold in mud! You have centuries of observation. You have noted that when planets are at certain angles, things happen. But you have attributed the cause to the wrong agent. You think it is the 'Lord of the Sign' acting. I say it is the angle itself acting. You are a physician, Helisaeus. If you give a patient a poultice and he heals, but you believe the poultice works because of the magic words you whispered over it, are you not still in error? The herb worked. The words did nothing.

  **RÖSLIN:** But the words might be the method of preparation! You cannot simply discard the tradition because you have found a new physics. The zodiac is a language. Even if the stars are not rams, the *positions* mark specific sectors of solar influence relative to the Earth's tilt. You say the Earth has a soul. Does a soul not recognize landmarks? The equinox is a landmark. The solstice is a landmark. The mid-points are landmarks. The zodiac is merely the map of these landmarks.

  **KEPLER:** A map is not the terrain. I am willing to keep the equinox. I am willing to keep the solstice. These are physical extremes of light. But to say that the twenty-fifth degree of Libra has a different 'virtue' than the fifth degree of Scorpio... this is to pretend that the void has texture. It does not. The only texture is the light, and the only pattern is the angle.

  **RÖSLIN:** *Stirs the cold wine.* You are trying to build a clock without a casing. You want the gears—the aspects, the harmonies—to turn, but you smash the face of the clock because the numbers are painted on. But men need the face to read the time. If you publish your *Harmonices Mundi* and tell the princes that their horoscopes are half-false, that the houses are void, who will buy your almanacs? Who will fund your Rudolphine Tables?

  **KEPLER:** *Looks down at his hands.* I know. I know the danger. I call it my *Tertius Interveniens*—the Third Party Intervening. I stand between the superstitious fool who believes the Ram controls his head, and the atheist who believes the heavens are dead stone and influence nothing. I must keep the practice alive to keep the bread on the table, but I must cleanse the theory to keep my soul clean before God.

  **RÖSLIN:** And if the theory is cleansed too much, the practice dies. If I tell a merchant that his 'House of Wealth' is a fiction, he will not pay for a chart. He wants to know if his venture is blessed by the stars. He does not want to know if the Earth's soul perceives a pentagonal ratio in the light of Venus.

  **KEPLER:** Then let him pay for the weather. Let him pay for the harvest. I can predict the frost with my aspects. I cannot predict the price of grain with the domicile of Mercury.

  **RÖSLIN:** But the merchant believes Mercury governs grain.

  **KEPLER:** Then the merchant is a fool, and I am his jester. *He picks up the compass again, spinning it idly.* Tell me, Helisaeus. When you look at the sky, do you see a Lion? Or do you see a fire?

  **RÖSLIN:** I see a pattern that has held for three thousand years. I see a system that links the macrocosm to the microcosm. You link them with music. I link them with sympathy. Perhaps the music is the mechanism of the sympathy.

  **KEPLER:** Perhaps. But sympathy is a fog. Geometry is a bone. I will stick to the bone.

  **RÖSLIN:** And I will stick to the flesh. For the flesh is what bleeds, Johannes. Not the bone.

  *Kepler says nothing. He dips his pen and begins to calculate the longitude of Mars for the coming conjunction, ignoring the zodiacal sign written in the margin. Röslin watches him for a moment, then reaches for the candle to trim the wick, casting the room briefly into darkness before the flame flares up again.*
