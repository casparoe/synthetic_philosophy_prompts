      *   **Opening Salvo:** Röslin challenges Kepler's "cleansing" of astrology.
      *   **Point 1: The Zodiac vs. Aspects.** Röslin argues both are circles. Kepler distinguishes between arbitrary divisions (signs) and universal geometry (aspects).
      *   **Point 2: The Mechanism (Harmony).** Kepler explains *why* aspects work. The Music of the Spheres. The Earth's Soul. This is the core philosophical requirement.
