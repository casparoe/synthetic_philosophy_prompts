answer: |-
  **Setting:** *A seminar room, late afternoon. The whiteboard is a mess of arrows and logical symbols. ELINA (Dispositionalist) is capped, leaning against the desk. MARCUS (Skeptic) is holding a dry-erase marker, staring at the board.*

  **Marcus:** (Taps the board) Let's just lock it down. You claim that when I used the symbol '+' in the past, I meant *addition*. Not *quaddition*.

  **Elina:** Yes. Standard arithmetic.

  **Marcus:** And what makes that true? What fact about me, in the past, constitutes that meaning?

  **Elina:** My dispositions. I was disposed to answer questions about '+' in a certain way. If you asked me "2 plus 2," I was disposed to say "4." If you asked me "68 plus 57," I was disposed to say "125." The meaning *is* the disposition.

  **Marcus:** (Writes `68 + 57 = ?` on the board) Okay. You've never computed this sum before. Never in your life. Not until right now.

  **Elina:** Irrelevant. I have a general disposition. I don't need to have run the specific instance to have the capacity.

  **Marcus:** But here's the skeptic's wedge. Suppose the function I meant wasn't *plus*, but *quus*. (He writes: `x quus y = x + y` if `x, y < 57`; otherwise `5`).

  **Elina:** I know the definition, Marcus.

  **Marcus:** Under *quus*, what is the answer to `68 + 57`?

  **Elina:** Five. Because 68 is greater than 57.

  **Marcus:** Exactly. Now, you say your past disposition fixes the meaning as *plus*. But how does your past disposition rule out *quus*? In every single case you *actually* computed in the past, both functions yield the same result. You never went above 57. So the behavioral data is identical. Why say you were disposed to say "125" rather than "5"?

  **Elina:** Because if you *had* asked me, I *would* have said 125. The counterfactual holds.

  **Marcus:** (Turns around) On what basis? There is no physical trace in your brain that says "125" for this specific input. You're projecting a disposition onto a void.

  **Elina:** It's not a void. It's my cognitive architecture. Look, think about a neural net. I've been reading about this. A model trains on a dataset, develops weights and biases. Those weights *are* its dispositions. When you give it an input it hasn't seen during training, it generalizes. The weights determine the output. I'm the net. My brain states are the weights. They determine that I output 125, not 5.

  **Marcus:** This is the finitude objection, Elina. And it's brutal. You are a finite physical object. There is a number so large that if I asked you to add it to another number, your brain would literally explode, or you'd run out of time in the universe, or you'd get bored and guess.

  **Elina:** So?

  **Marcus:** So you have *no* disposition for those sums. You cannot output an answer. But you still *mean* addition. You understand the rule for *all* numbers, even the ones you physically cannot compute. A disposition is a conditional: "If asked, I would answer." But for large enough numbers, the antecedent is true ("If asked"), but the consequent is false (you wouldn't answer, you'd die). So the disposition doesn't exist. But the meaning does.

  **Elina:** (Uncaps her marker, draws a circle around "Disposition") You're confusing *overt* disposition with *underlying* capacity. I don't need to actually speak the number. I have a recursive rule in my head. "Take the successor of..." My disposition is to follow *that* procedure.

  **Marcus:** But how do we specify the procedure without using the very meaning we're trying to define? You say you're disposed to follow the "successor" rule. But maybe you're disposed to follow the "successor-quus" rule. We're back at square one. The physical state of your brain—the weights in your neural net—is compatible with infinitely many functions.

  **Elina:** Okay, fine. Let's grant the finitude point. We idealize. I'm not talking about what I *would* do as a tired, mortal human. I'm talking about what I'm disposed to do *ceteris paribus*. Under ideal conditions. Sober, attentive, unlimited paper, infinite time.

  **Marcus:** (Smiles, sadly) Ah. The idealization move. This is where the normativity trap snaps shut.

  **Elina:** How?

  **Marcus:** You say: "I mean plus because, under ideal conditions, I would answer 125." But how do you define "ideal conditions"?

  **Elina:** Standard scientific idealization. No distractions, full cognitive function, no calculation errors...

  **Marcus:** What counts as a "calculation error"?

  **Elina:** (Pauses) Deviating from the rule.

  **Marcus:** *Which* rule?

  **Elina:** ...Addition.

  **Marcus:** (Points the marker at her) Circular. You're defining the conditions under which you manifest the disposition as "the conditions where you get the *right* answer." But "right" presupposes that you already mean *plus*. You can't use "ideal conditions" to *fix* the meaning, because you need the meaning to identify the ideal conditions.

  **Elina:** (Erases a corner of the board aggressively) Come on. We do this in physics all the time. "Ideal gas." We don't need to know the specific pressure beforehand to know what "frictionless" means. It just means "no interfering causal factors."

  **Marcus:** In physics, we know what the law *is* independently. Here, the law *is* the meaning. If I say "no interfering factors," the skeptic asks: "Is the factor that makes me want to say '5' an interference, or is it the true manifestation of *quus*?" You can't distinguish a misfire from a different rule without already knowing which rule you're following.

  **Elina:** But there's a normative difference, Marcus. If I say "126," I made a *mistake*. If I meant *quus*, "5" would be correct. Dispositions explain why I *do* say things, but you're saying they can't explain why I *should* say things.

  **Marcus:** Precisely! That is the heart of it. Dispositions are descriptive. Meaning is normative. Facts about what I *would* do cannot ground facts about what I *ought* to do. If my brain is wired such that I am disposed to say "5" for 68+57, the dispositionalist has to say "Ah, well, you meant *quus*." But I might just be mistaken about *plus*. The disposition view collapses the distinction between *seeming right* and *being right*.

  **Elina:** (Paces) Okay. But if we abandon dispositions, what do we have? Platonism? My mind grasps an abstract entity 'Addition' that exists outside of space and time? That's mysticism. I'd rather deal with the circularity of idealization than buy into magical grasping.

  **Marcus:** I'm not selling Platonism. I'm just showing that the naturalistic picture—the one you and the neural net researchers love—has a gap. You want to reduce meaning to causal facts. But causal facts run out.

  **Elina:** They don't run out. Look at the neural net again. When a net generalizes, it's not "magic." It's minimizing a loss function over a manifold. The geometry of the high-dimensional space *constrains* the generalization. It's not arbitrary. Maybe "meaning" isn't a fact about a specific instant, but a fact about the trajectory of the system in state space.

  **Marcus:** But who sets the loss function?

  **Elina:** Evolution? Community pressure?

  **Marcus:** Community pressure! Now we're shifting to the community view. But the skeptic can ask about the community too. Does the *community* mean plus or quus? If everyone is disposed to say "5" for 68+57, do they mean *quus*? Or are they all making the same mistake?

  **Elina:** If everyone says 5, then 5 is correct. Meaning is public.

  **Marcus:** So truth is majority vote? If the whole world wakes up tomorrow disposed to say "London is in France," is London in France?

  **Elina:** No, because there's a world to constrain us. But with math? Math is a language game. If the dispositions of the community shift, the meaning shifts. There's no "super-fact" outside the game.

  **Marcus:** (Puts the cap on the marker) That's a pragmatic retreat, Elina. You're saying we can't solve the skeptical paradox, so we'll just agree to ignore it and play the game.

  **Elina:** I'm saying the "fact of the matter" you're looking for doesn't exist. Not because meaning is empty, but because you're looking for a static object. Meaning is a practice. It's knowing how to go on. My dispositions aren't a database of answers; they're a trained ability to navigate the practice.

  **Marcus:** But "knowing how to go on" is exactly what's in question! At the cliff edge of 68+57, the practice doesn't dictate the next step. You take a leap. You call it "plus." I call it "quus." Nothing in the past—no disposition, no weight, no neural pathway—forces the leap one way or the other.

  **Elina:** (Stares at the `68 + 57` on the board) Nothing forces it. But I still feel compelled. I feel like 125 is the *only* answer. That compulsion has to come from somewhere.

  **Marcus:** It does. It comes from your training, your form of life, your biology. But none of those things *justify* the answer. They only explain why you give it. The skeptic isn't asking why you say 125. He's asking what makes 125 *right*.

  **Elina:** And if I say "Nothing makes it right, it's just where my nature takes me"?

  **Marcus:** Then you've given up on meaning. You've reduced logic to psychology.

  **Elina:** Or I've naturalized logic.

  **Marcus:** (Picks up his bag) Maybe. But until you can tell me what "ideal conditions" means without presupposing the rule, you're still stuck in the circle.

  **Elina:** And until you can tell me where this "normativity" lives without invoking magic, you're stuck in the clouds.

  **Marcus:** (At the door) See you Thursday?

  **Elina:** Yeah. Bring the chalk. The marker's too permanent for this.

  *(Marcus exits. Elina looks back at the board, picks up the eraser, but hesitates before wiping away the equation.)*
