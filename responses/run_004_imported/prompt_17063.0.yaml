answer: |-
  Good evening. For those of you who don't know me, I'm the journalist who spent the last fifteen years calling [Name] whenever the yield curve inverted or the Fed Chair sneezed. She was the voice on the other end of the line who could explain why the sky wasn't falling, or occasionally, why we should probably start building an ark.

  Looking around this room, I realize I'm speaking to two distinct constituencies. Half of you know exactly what the transmission mechanism of monetary policy is. The other half—mostly family—know that [Name] spends her days worrying about something called "M2," and you've learned not to ask what it means during dinner.

  But there is one idea that bridges this gap. It's the idea that anchored [Name]'s entire career. It comes from a 1752 essay by David Hume, "Of Money."

  Hume argued that money is essentially a veil. It's a counter we use to trade real things—goods, services, labor. If you double the amount of money in the economy, Hume said, you don't double the wealth. Eventually, prices just catch up. You have more cash, but everything costs twice as much. In the long run, money is neutral. It doesn't change the real world; it just changes the tags on the shelf.

  If that were the whole story, central banking would be pointless. Why bother managing the veil?

  But [Name] loved the footnote in Hume's argument. He admitted that while money is neutral in the long run, it is *not* neutral in the short run. There is an interval. A gap. When new money enters the system, prices don't jump instantly. There is a lag. And in that lag, there is a kick. Real things happen. Factories hire. Projects get funded. People go back to work.

  For forty years, [Name] lived in that interval.

  To her colleagues here: She knew the long-run neutrality was inevitable. She never promised that printing money creates wealth forever. But she fought for the transition path. She understood that the "short-run kick" wasn't a bug; it was the feature. It was the difference between a soft landing and a recession that ruins lives.

  To her family: You saw her working late nights and weekends. You wondered what she was actually doing. She was trying to stretch out that helpful interval. She was trying to make sure that when the economy stumbled, the "kick" arrived in time to catch it, and that the price increases arrived late enough not to hurt. She spent her career managing the timing of the veil so that the people behind it didn't suffer while it was being lifted.

  There is a temptation, when toasting a career like this, to say that her influence will keep multiplying, or that her wisdom will compound over time. But I know better. [Name] spent four decades correcting people who thought adding zeros automatically adds value. We know that isn't true. Real value isn't about inflation; it's about stability. It's about substance.

  So, I won't say her legacy multiplies. I will say her legacy holds its value.

  Because the people she mentored, the policies she shaped, and the crises she helped soften—those are real goods. They are not nominal. They are not subject to adjustment.

  Now, she enters her own long run. In retirement, the theory suggests her personal money supply should become neutral. No more shocks. No more managing the transmission mechanism. Just real output. Time with family. Time for herself.

  David Hume wrote that "nothing is deemed more requisite than to correct the excesses of money." [Name] spent her life correcting those excesses with grace, rigor, and an unwavering commitment to the people living in the short run.

  So, if everyone could raise a glass.

  To [Name]. May your retirement be free of volatility. May your happiness be real, not nominal. And may you finally enjoy the long run, knowing you managed the short run perfectly.

  Cheers.
