  *(Self-Correction during drafting)*: Make sure to distinguish between "Open" (decidable but unknown proof) and "Independent" (undecidable in the system). The group member conflated them. For "Open", convergence is guaranteed *in principle* but not *in practice* (no bound). For "Independent", convergence to 0/1 is *not* guaranteed at all.

