  7.  *(Final thought on the Lewis Quote)*: The quote is roughly: "Calling a relation 'Necessitation' does not make it necessitate anything, any more than calling a man 'Armstrong' gives him mighty biceps." I will use this explicitly.

  8.  *(Final thought on the "Brute" question)*: The user asks why we can't just accept brute necessity. The answer is: You *can*, but then you've given up on *explanation*. Armstrong wanted explanation. If it's brute, Humeanism is more parsimonious.

