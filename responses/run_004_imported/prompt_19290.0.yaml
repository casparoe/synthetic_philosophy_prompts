      *Wait, looking at (b) again.* "A and B collapse into probabilistic independence." The result is $P(A \to B) = P(B)$. This means the probability of the conditional is independent of A. It does *not* necessarily mean A and B are probabilistically independent ($P(A \land B) = P(A)P(B)$). The student writes: "so A and B collapse into probabilistic independence." This is technically imprecise. The *conditional* becomes independent of the antecedent's probability in a specific way, or rather, the probability of the conditional equals the probability of the consequent. If $P(A \to B) = P(B)$, and we assume the Equation $P(A \to B) = P(B|A)$, then $P(B|A) = P(B)$, which *does* imply A and B are independent. So the student is actually correct there. Okay, (b) is solid 5/5.

