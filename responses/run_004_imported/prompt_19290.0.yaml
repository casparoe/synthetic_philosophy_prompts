  1.  **Analyze the Request:**
      *   **Task:** Grade a peer's homework submission on Lewis's triviality results for indicative conditionals.
      *   **Context:** Evening extension course on philosophy of language/formal epistemology. User has a math/stats background but no formal philosophy training. Needs help distinguishing subtle philosophical errors from mere phrasing issues.
      *   **Input:** The assignment prompt (3 parts, 5 points each) and the classmate's answer.
      *   **Output Requirements:**
          *   Letter grade.
          *   Total score out of 15.
