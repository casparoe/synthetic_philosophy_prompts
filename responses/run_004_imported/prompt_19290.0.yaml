      *Self-Correction on (b):* Is the material conditional comment actually wrong? Lewis's result shows $P(A \to B) = P(B)$. The material conditional paradox shows $A \to B$ is true if $\neg A$. They are different "absurdities." The student says "this is really a version of the same complaint." That's philosophically debatable/sloppy. I might deduct 1 point here for precision. Let's go 4/5 on (b) to be strict, making it 11/15 total. No, the prompt asks to "sketch why... leads to an unacceptable conclusion." The sketch of the math is the priority. The commentary is secondary. I'll stick to 5/5 on (b) but add a comment. The error in (c) is the big one.

      *Wait, let's look at (c) again.* "Give two distinct strategies... and state which assumption of the argument each one rejects."
      *   Student Strategy 1 (Adams): Rejects truth-aptness. (Correct).
