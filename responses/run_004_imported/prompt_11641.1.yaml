  7.  **Refining the Kantian Nuance:**
      *   *Caution:* Don't make Kant a secret utilitarian. He doesn't care about the *sum* of suffering, but the *effect on the moral agent*.
      *   *Caution:* Don't make Kant a vegan necessarily. He ate meat. But he might argue against *industrial* meat if it requires systematic desensitization.
