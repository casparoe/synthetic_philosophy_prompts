answer: |-
  This is a sharp observation, and it cuts to the heart of the most serious objection to moral trade: the **Integrity Objection** (sometimes called the **Agent-Relative Constraint Objection**).

  The standard "gains from trade" model treats moral theories like preference orderings over world-states. It assumes that if Theory A hates $X$ and Theory B hates $Y$, we can swap $X$ and $Y$ to create a better overall outcome. But this assumes moral "bads" are fungible commodities. In high-stakes cases, many moral theories claim their constraints are **non-fungible** and **agent-specific**.

  Here is a concrete, high-stakes example designed to break the trade logic, followed by an analysis of exactly where the incentives fail.

  ### The Setup: The "Security vs. Welfare" Vote

  Imagine two legislators, **Alice** and **Bob**, voting on two separate bills in a closed session. They can make a binding pact to vote against their immediate moral inclinations in exchange for the other doing the same.

  **The Agents & Credences:**
  *   **Alice:** 90% credence in **Deontology** (Rights are inviolable), 10% credence in **Utilitarianism**.
  *   **Bob:** 90% credence in **Utilitarianism** (Maximize welfare), 10% credence in **Deontology**.

  **The Bills:**
  1.  **Bill T (Torture Authorization):** Allows the torture of a detained suspect to potentially uncover a plot.
      *   *Utilitarian View:* Permissible/Required (if it saves lives).
      *   *Deontological View:* **Strictly Forbidden** (Violation of human dignity/rights).
  2.  **Bill C (Welfare Cuts):** Slashes social safety nets to balance the budget, statistically causing 500 preventable deaths among the poor.
      *   *Utilitarian View:* **Strictly Forbidden** (Unnecessary loss of life/welfare).
      *   *Deontological View:* Permissible (No direct rights violation; budgeting is discretionary).

  **The Status Quo (No Trade):**
  *   Alice votes **No** on Bill T (following her 90% Deontology).
  *   Bob votes **No** on Bill C (following his 90% Utilitarianism).
  *   *Result:* Neither bill passes. Status quo maintained.

  **The Proposed Trade:**
  *   Alice agrees to vote **Yes** on Bill T (Torture).
  *   Bob agrees to vote **Yes** on Bill C (Welfare Cuts).
  *   *Result:* Both bills pass.

  ### The Orthodox "Gains from Trade" Calculation

  Under Toby Ord's framework (and Will MacAskill's *Normative Uncertainty*), agents should maximize **Expected Moral Value (EMV)**.

  1.  **Alice's EMV without trade:** She avoids torture (huge Deontological gain) but allows welfare cuts to fail (Utilitarian loss). Since she is 90% Deontologist, avoiding torture dominates her calculation.
  2.  **Alice's EMV with trade:** She enables torture (huge Deontological loss) but ensures welfare cuts pass (huge Utilitarian gain *because* Bob reciprocates).
  3.  **The Logic:** If the Utilitarian value of passing Bill C is high enough, it might outweigh the Deontological disvalue of passing Bill T *in expectation*. Alice reasons: "I am 10% Utilitarian. If I vote for Torture, I guarantee the Utilitarian goal (Bill C) is met by Bob. My 10% credence now gets 100% of what it wants, rather than 0%."

  From a purely economic perspective, they have "purchased" moral satisfaction for their minority credences at a discount.

  ### Where the Logic Breaks Down

  This is where you can anchor your dissertation critique. The trade fails in hard cases because it misunderstands the **ontology of moral constraints**. Here are three specific breakdown points:

  #### 1. The Non-Fungibility of "Sin" (Agent-Relative Constraints)
  The trade model assumes that moral value aggregates across actions and agents. It treats "Torture happening" as a bad state of affairs that can be offset by "Welfare Cuts happening."

  However, for a Deontologist, the prohibition is not on the *state of affairs* (torture existing in the world); it is on the *agency* (Alice committing torture).
  *   **The Breakdown:** Even if Bob passes the Welfare Cuts, Alice is still the one who voted for Torture. In Deontological ethics, **complicity is not cleansed by external goods.**
  *   **Why it matters:** If Alice is 90% sure Deontology is true, she is 90% sure that voting "Yes" on Bill T constitutes a grave moral wrong *regardless of what Bob does*. The "gains" from Bob's action accrue to the *world*, but the "cost" of Alice's action accrues to *Alice's moral integrity*. You cannot trade your own integrity for someone else's outcome.

  #### 2. The Asymmetry of Risk (Pascal's Mugging)
  In ordinary trade, if I trade you my apple for your orange, and I turn out to be wrong about the taste, I lose a snack. In moral trade with high-stakes forbidden actions, the risk is asymmetric.
  *   **The Breakdown:** If Alice votes for Torture and Deontology is true, she has committed a **categorical wrong**. Most deontological theories do not allow categorical wrongs to be outweighed by consequentialist gains.
  *   **The Incentive Failure:** For the trade to work, Alice's 10% Utilitarian credence must outweigh her 90% Deontological credence. But if the Deontological prohibition is *absolute* (infinite disvalue), no finite Utilitarian gain can offset it in an expected value calculation.
  *   **Dissertation Point:** Moral trade implicitly requires all theories to be **axiologically commensurable** (measurable on the same scale). Hard cases reveal they are not. If one theory says "This act is forbidden *simpliciter*," it opts out of the expected value calculus entirely.

  #### 3. The Enforcement Problem in High Stakes
  Ord's model assumes binding agreements. In low-stakes cases (donating to charity), this is easy. In high-stakes political/ethical cases, enforcement is impossible.
  *   **The Breakdown:** Alice must vote on Bill T *before* she can be certain Bob will vote on Bill C. (Or they vote simultaneously).
  *   **The Incentive Failure:** If Alice votes for Torture and Bob defects (votes No on Welfare C), Alice has committed a forbidden act for *zero* gain.
  *   **Why it matters:** In standard economics, we sue for breach of contract. In moral trade, there is no recourse. If Alice sins, she cannot "undo" the sin even if Bob is punished later. The risk of defection makes the expected value of the trade negative for any agent who views their side of the bargain as potentially forbidden. The "shadow of the future" doesn't apply if the act is a one-off moral violation.

  ### Summary for Your Chapter

  The "Moral Trade" logic survives only when the actions traded are **supererogatory** (good to do, but not wrong to abstain) or **permissible** under all credenced theories.

  It breaks down when the trade requires an agent to perform an action that is **forbidden** by their highest-credence theory. In these cases:
  1.  **Integrity:** The agent cannot outsource their moral agency to a collective calculation.
  2.  **Incommensurability:** "Forbidden" is not a high cost; it is a different *category* of value that does not aggregate with "good outcomes."
  3.  **Risk:** The risk of committing a grave wrong (if your high-credence theory is true) outweighs the expected benefit of satisfying your low-credence theory.

  **The Takeaway:** Moral trade is a powerful tool for **cooperation among moral peers** on discretionary issues, but it cannot resolve **fundamental normative conflict** on non-negotiable constraints. It collapses back into the "My Favorite Theory" view whenever the trade requires violating a constraint held with high credence.

  This distinction allows you to concede the utility of Ord's framework in low-stakes/charity contexts (preserving its value) while marking a hard boundary where it fails (contributing new critical analysis to the literature).
