      *(Self-Correction on Wine/Water)*: The paradox is usually: Ratio $r \in [1/3, 3]$. Uniform on $r$ gives $P(r < 1) = 1/2$. Uniform on fraction $f = r/(1+r)$ gives different result. Jaynes argues you need to look at the underlying measure. I should let Alex try to defend this but let Sam point out the fragility.

