      *   **Preface Paradox:**
          *   Setup: Author writes a book with many claims.
          *   Premise 1: For each claim $c_i$, the author has good evidence/reason to believe $c_i$.
          *   Premise 2: Human fallibility implies at least one error is likely.
          *   Conclusion: Author believes each $c_i$, but also believes $\neg(c_1 \land c_2 \land \dots \land c_n)$.
          *   Structure: Not necessarily statistical independence. Based on inductive evidence + humility. The contradiction is between the set of beliefs and the belief about the set.

