answer: |-
  You have hit on exactly the right nerve. The shift from Dutch Book arguments to Accuracy-Dominance arguments (often called "Accuracy-First Epistemology") is widely regarded as a major philosophical upgrade because it grounds probabilism in *epistemic* value (getting closer to the truth) rather than *pragmatic* prudence (avoiding sure-loss bets).

  However, your reading group's confusion is well-founded. The technical machinery required to make Joyce's argument work is much more fragile than the philosophical punchline suggests. The argument lives or dies by the geometry of the "inaccuracy measure," and for a long time, the community didn't realize just how specific that geometry needed to be.

  Here is the walkthrough of why the measure matters, why absolute value fails, what broke in 1998, and how Strict Propriety saved the day.

  ### 1. Why the Argument is Sensitive to the Measure

  At its heart, Joyce's argument is a geometric claim about the **probability simplex**.

  Imagine a world with just two mutually exclusive and exhaustive possibilities, $A$ and $\neg A$. We can represent credences as points $(c(A), c(\neg A))$ on a 2D plane.
  *   **The Truth:** The world is either $A$ (represented as vertex $v_1 = (1,0)$) or $\neg A$ (vertex $v_2 = (0,1)$).
  *   **Coherence:** A credence function is probabilistically coherent if $c(A) + c(\neg A) = 1$ and $c \geq 0$. Geometrically, the coherent credences form the line segment connecting $v_1$ and $v_2$.
  *   **Incoherence:** Any point off that line segment (e.g., $(0.6, 0.6)$).

  Joyce's theorem claims: For any incoherent point $c$, there exists a coherent point $c^*$ such that $c^*$ is **closer** to the truth than $c$ is, *regardless of which vertex ($v_1$ or $v_2$) turns out to be the actual world.*

  This is a claim about **distance**. In Euclidean geometry (straight-line distance), if you are outside a convex set (the coherent line), your orthogonal projection onto that set is guaranteed to be closer to all points in the set than you are.

  However, "inaccuracy" is a philosophical definition of distance. If you define distance differently (e.g., using the Manhattan metric / absolute value), the geometric guarantee vanishes. You can construct scenarios where an incoherent point is actually *closer* to the truth vertex than its coherent projection, or where no single coherent point dominates the incoherent one across all possible worlds.

  ### 2. What Goes Wrong with Absolute Value?

  The "naive" measure you recalled is the **Linear Scoring Rule** (or $L_1$ norm).
  $$ \text{Inaccuracy}(c, w) = \sum |c_i - w_i| $$
  where $w_i$ is 1 if proposition $i$ is true and 0 otherwise.

  There are two fatal flaws here, one decision-theoretic and one geometric.

  **The Decision-Theoretic Flaw (Impropriety):**
  A scoring rule is *proper* if, given your credence $p$, you minimize your expected inaccuracy by reporting $p$. It is *strictly proper* if reporting $p$ is the *unique* minimizer.
  With absolute value, if your true credence in $A$ is $0.6$, your expected inaccuracy for reporting $c$ is:
  $$ E[I] = 0.6 \cdot |c - 1| + 0.4 \cdot |c - 0| $$
  If you do the calculus (or just check the endpoints), you find that this is minimized by reporting **$c=1$**.
  This is disastrous for a vindication of probabilism. It implies that if you want to be "accurate" according to this measure, you should never have graded beliefs; you should always extremize to 0 or 1. It punishes uncertainty. If the measure tells you to lie about your beliefs to maximize accuracy, you can't use it to argue that your beliefs *ought* to satisfy the probability axioms.

  **The Geometric Flaw (Failure of Dominance):**
  Even if we ignore the expectation issue and look purely at dominance:
  Suppose you have incoherent credences $c = (0.6, 0.6)$.
  The natural coherent alternative is $c^* = (0.5, 0.5)$.
  *   **If World 1 is true $(1,0)$:**
      *   Incoherent score: $|0.6 - 1| + |0.6 - 0| = 0.4 + 0.6 = 1.0$
      *   Coherent score: $|0.5 - 1| + |0.5 - 0| = 0.5 + 0.5 = 1.0$
      *   Result: Tie. (No strict dominance).
  *   **If we tweak the numbers:**
      There are configurations in $L_1$ space where the incoherent point is actually *closer* to the truth vertex than the coherent projection. Because the "circles" of equal distance in $L_1$ are diamonds (squares rotated 45 degrees), the probability simplex (the line $x+y=1$) can cut through these diamonds in ways that allow an external point to be "inside" the same distance contour as an internal point relative to a specific vertex.

  Without strict dominance, the normative force evaporates. You can't say incoherence is *irrational*, only that it *might* be less accurate.

  ### 3. The 1998 Axioms and the Counterexample

  Joyce's 1998 paper ("A Nonpragmatic Vindication of Probabilism") was groundbreaking but technically imperfect. He proposed a set of axioms that any "legitimate" inaccuracy measure should satisfy (e.g., Continuity, Normality, Convexity). He proved that any measure satisfying these axioms yields the dominance result.

  **The Counterexample:**
  The gap was identified most prominently by **Hannes Leitgeb** and **Richard Pettigrew** (around 2010).
  They showed that Joyce's original axioms were too weak. Specifically, they allowed for inaccuracy measures that were convex but not *strictly* convex in the right way, or measures that satisfied the axioms but failed to generate the dominance theorem.

  One specific issue was **Additivity**. Joyce assumed the inaccuracy of a whole credence function is the sum of the inaccuracies of the individual credences. Leitgeb and Pettigrew showed that even with additivity and convexity, you could construct "bumpy" scoring rules that satisfied Joyce's list but allowed incoherent credences to escape dominance.

  This forced a revision. It wasn't enough to say the measure should be "convex"; it needed to have a specific mathematical structure that guaranteed the agent is always rewarded for honesty.

  ### 4. The Fix: Strict Propriety and Predd et al. (2009)

  This is where the paper you suspected comes in: **Predd, Seiringer, Osherson, Seidenfeld, and Poor (2009), "Probabilistic Coherence and Proper Scoring Rules."**

  This paper is now the technical backbone of the accuracy program. They established a tight equivalence:

  1.  A scoring rule is **Continuous and Strictly Proper**.
  2.  If and only if it is a **Bregman Divergence**.
  3.  If and only if **Probabilistic Coherence is characterized by Accuracy Dominance**.

  **What is Strict Propriety?**
  As mentioned earlier, a rule is strictly proper if your expected inaccuracy is minimized *only* by reporting your true credence.
  *   **Brier Score** (Squared Euclidean Distance): $S(c, w) = \sum (c_i - w_i)^2$. This is strictly proper. If you believe 0.6, you minimize expected squared error by reporting 0.6.
  *   **Logarithmic Score**: $S(c, w) = -\ln(c_{true})$. Also strictly proper.

  **The Geometric Argument:**
  Predd et al. showed that strictly proper scoring rules correspond to **Bregman Divergences**. In geometry, Bregman divergences behave like "generalized squared distances."
  Crucially, for any Bregman divergence, the **Generalized Pythagorean Theorem** holds. This guarantees that if you take any incoherent point outside the probability simplex, its projection onto the simplex is *strictly closer* to all truth-vertices than the original point.

  This fixed the Joyce (1998) gap. We no longer just list intuitive axioms; we demand **Strict Propriety**. This ensures that the measure values "honesty" (matching credence to belief) and "calibration" (matching belief to truth) in a way that mathematically necessitates coherence.

  ### 5. Is This Settled Consensus?

  **Within Formal Epistemology:**
  Yes, mostly. If you are an "accuracy-firster" (Joyce, Pettigrew, Leitgeb, Greaves, Carr), **Strict Propriety** is the non-negotiable constraint. The Brier Score is often used as the canonical example because it is bounded and intuitive, but the class of Bregman Divergences is the accepted standard.

  **Live Disagreements & Objections:**
  However, the "settled" nature applies to the *internal* mechanics of the theory. There are significant external debates:

  1.  **Which Proper Rule?**
      While all strictly proper rules vindicate probabilism, they disagree on *other* norms. For example, the Log Score punishes assigning 0 probability to a truth infinitely hard; the Brier Score does not. This matters for arguments about *Regularitism* (whether you should assign 0 to logical impossibilities only). There is no consensus on which specific proper rule is the *One True Measure* of accuracy.

  2.  **Verisimilitude vs. Calibration:**
      Critics (like **Oddie** or **Niiniluoto**) sometimes argue that accuracy measures should track "truth-likeness" (how close the *content* of the proposition is to the truth), not just binary truth values. Standard scoring rules treat all false propositions as equally false (distance 1), but intuitively, "The mass is 10.1kg" is closer to the truth than "The mass is 100kg" if the truth is 10kg. Standard Joyce-style accuracy doesn't capture this easily.

  3.  **The "Chance" Objection:**
      Some argue that accuracy arguments presuppose that there is a "truth value" to track. But in quantum mechanics or indeterministic worlds, is there a fact of the matter *now*? Accuracy arguments usually assume classical bivalent truth values, which creates tension with objective chance.

  4.  **Non-Classical Logics:**
      If the underlying logic isn't Boolean (e.g., intuitionistic or fuzzy logic), the probability simplex changes shape. The Predd et al. geometry still holds for convex sets, but the philosophical interpretation of what "coherence" means in those logics is still being worked out (e.g., by **Paris** or **Williams**).

  ### Summary

  Your intuition was spot on.
  1.  **Sensitivity:** The argument is purely geometric; change the metric, change the result.
  2.  **Absolute Value:** Fails because it isn't strictly proper (encourages extremizing) and lacks the geometric properties (Bregman) required for dominance.
  3.  **1998 Gap:** Joyce's axioms were insufficiently precise; Leitgeb/Pettigrew showed they allowed "bad" measures.
  4.  **The Fix:** Predd et al. (2009) established that **Strict Propriety** (equivalent to Bregman Divergences) is the necessary and sufficient condition for the dominance argument to work.
  5.  **Consensus:** Strict propriety is the standard constraint for accuracy-first epistemology, though debates remain on *which* proper rule to use and how to apply the framework to non-classical contexts.

  You've essentially reconstructed the last 20 years of formal epistemology history in one reading group session!
