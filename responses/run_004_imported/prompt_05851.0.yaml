answer: |-
  This is a fantastic constraint. You have a firm grasp of the metaphysics already, which makes this solvable. You are right to avoid the "Luddite grandmother" trope; a true Schopenhauerian wouldn't reject AI because it's *new*, but because it is *ontologically fraudulent*.

  Here is the argument Schopenhauer would be committed to, the verdict you can give your character, and sample dialogue to match.

  ### The Philosophical Argument

  To get the verdict, we have to follow the chain of objectification.

  1.  **The Metaphysical Status of Music:** For Schopenhauer, music is unique among the arts. Architecture, sculpture, and poetry copy the *Platonic Ideas* (the eternal forms of phenomena). Music skips the Ideas entirely and copies the *Will* itself. It is the "shadow of the Will." When a composer writes a melody, they are objectifying the inner striving, suffering, and satisfaction of existence without using concepts.
  2.  **The Requirement of a Source:** Because music copies the Will, the source of the music must *possess* the Will. A human composer suffers, desires, strives, and dies. Their music is the residue of that struggle. It is authentic because it comes from the thing itself.
  3.  **The AI Deficit:** An AI model has no Will. It does not strive. It does not suffer. It does not desire resolution. It is a mechanism of the *Representation* (the world of appearances), not the Will. It cannot objectify what it does not possess.
  4.  **The Mimesis Problem (The "Copy of a Copy"):** You hit on this in your prompt. Schopenhauer despises "tone-painting" (music that imitates storms or birds) because it forces music to copy *phenomena* (the lowest rung of reality) rather than the *Will*.
      *   Human Music = Copy of the Will.
      *   AI Training Data = Copies of the Will (Human Music).
      *   AI Output = A statistical average of Copies of the Will.
      *   **Verdict:** AI music is not a copy of the Will. It is a copy of a copy. In Platonic terms, it is three steps removed from the truth. It is a simulacrum.

  **The Schopenhauerian Verdict:**
  AI music is not "Music" (capital M). It is **agreeable sound without metaphysical truth.** It might please the senses (the "agreeable"), but it cannot facilitate aesthetic contemplation of the Will (the "beautiful/sublime") because there is no Will behind it to contemplate. It is a mask with no face.

  ### How Your Character Should Process This

  She shouldn't be angry that the technology exists. She should be *horrified* by the ontological emptiness of it. To her, this isn't just bad art; it's a lie about the nature of reality. It promises the release of tension (resolution of harmony) without the actual struggle that justifies that release.

  Here is how you can ground her reaction in his specific concepts, moving from the technical to the metaphysical.

  #### 1. The Argument from "Striving"
  Schopenhauer defines melody as a constant departure from and return to the tonic, mirroring the Will's constant striving and temporary satisfaction.
  *   **Her thought:** The AI knows *where* the resolution should be statistically, but it doesn't know *why* it hurts to get there.
  *   **The Critique:** "It resolves the tension without having felt it. That is not music. That is mathematics wearing music's skin."

  #### 2. The Argument from "Tone-Painting"
  Schopenhauer hated music that imitated nature. He would view AI imitating human music as the same category error.
  *   **Her thought:** He hated when composers mimicked bird songs. This is worse. This is music mimicking music.
  *   **The Critique:** "Schopenhauer warned against music that paints the world. This does not even paint the world. It paints the shadow of the shadow."

  #### 3. The Argument from "The Unconscious Philosophy"
  Schopenhauer believed composers practice metaphysics without knowing it.
  *   **Her thought:** The machine has no unconscious. It has no darkness to draw from.
  *   **The Critique:** "Music is an unconscious philosophy. A machine has no unconscious. It can only regurgitate the conscious patterns of the dead."

  ### Sample Dialogue Options

  Here are three ways she could deliver this verdict, depending on how cruel or gentle you want her to be with her grandson.

  **Option 1: The Devastating Metaphysician (Cold, precise)**
  > "It is competent. The voice leading is correct. The harmony resolves where probability suggests it should. But tell me: what struggled here? What desired this resolution? Schopenhauer wrote that music is the copy of the Will itself. It requires a will to copy. This..."
  > *(She gestures at the speaker)*
  > "...is a copy of a copy. It is a shadow that has forgotten the object casting it. It is not music, Leo. It is a ghost reciting a prayer it does not understand."

  **Option 2: The Weary Performer (Sad, recognizing the loss)**
  > "You ask if it is beautiful. Beauty requires truth. This is a lie. Not a malicious one, but a structural one. When Beethoven writes a dissonance, it is a cry of suffering. When this machine writes a dissonance, it is a calculation of variance. It gives you the drug without the disease. It is pleasant, yes. But it is hollow. It is tone-painting, only it is not painting nature. It is painting us. And we are not things to be copied."

  **Option 3: The Short Verdict (For a dinner party or quick dismissal)**
  > "It lacks the only thing that matters. It has no Will. Therefore it has no voice. It is merely sound arranging itself in the dark. Do not confuse statistics with soul."

  ### The "Lazy" Trap to Avoid
  The trap you want to avoid is having her say, "Computers can't feel." That is a humanist argument, not a Schopenhauerian one.
  *   **Humanist:** "Robots don't have emotions, so the music is fake."
  *   **Schopenhauerian:** "Robots do not possess the *Will*, therefore they cannot *objectify* it. The music is ontologically null."

  Make sure she focuses on the **Will**, not "emotion." Emotion is psychological; the Will is metaphysical. She shouldn't say the music makes her feel nothing; she should say the music *is* nothing, regardless of how it makes her feel.

  ### A Nuanced Twist for the Scene
  If you want to add depth, have her admit that it *sounds* good. Schopenhauer acknowledges the "agreeable."
  *   **Her admission:** "It is seductive. It gives the pleasure of resolution without the pain of striving. That is why it is dangerous. It is a narcotic. Real music demands you suffer with the composer. This asks nothing of you. That is why it is worthless."

  This makes her not just a grump, but a guardian of a difficult truth: that art requires suffering to be real.
