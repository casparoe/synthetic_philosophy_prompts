          *   *Supervaluationism:* Student says it handles it "just as cleanly, by taking a supervaluation over supervaluations: iterating the construction closes off the regress."
              *   *Check:* **Fudged/Incorrect.** Higher-order vagueness is widely considered a *major* problem for Supervaluationism (the "sharp boundary problem" for the set of admissible precisifications). If you have a set of admissible precisifications, there is a sharp boundary between admissible and inadmissible ones. Iterating the construction doesn't necessarily solve this; it often reproduces the problem at the meta-level. Claiming it handles it "just as cleanly" is overly optimistic and ignores the standard objection (that the boundary of 'admissible precisifications' is itself sharp).

