answer: |-
  **The Ghost in the Multiverse: Why Evidential Cooperation is Theoretically Coherent but Practically Inert**

  The concept of Evidential Cooperation in Large Worlds (ECL) posits a startling claim: that an agent can benefit from cooperating with other agents even when no causal signal can ever pass between them. In a universe—or multiverse—vast enough to contain infinite or near-infinite repetitions of decision-making situations, an agent's choice serves as evidence for the choices of causally isolated counterparts. By choosing to "cooperate" (e.g., by respecting values other than one's own), one increases the evidential probability that similar agents elsewhere are doing the same, thereby maximizing expected value across the totality of correlated existence. While ECL offers a mathematically elegant generalization of superrationality, it ultimately fails as a guide to action. Although ECL is logically consistent within the framework of Evidential Decision Theory (EDT), it collapses under the weight of epistemic opacity and the threat of fanaticism. Consequently, ECL should be regarded as a fascinating theoretical boundary condition rather than a source of genuine normative guidance.

  To understand why ECL appeals to its proponents, one must first grasp its logical architecture, which rests on three pillars: the Large World hypothesis, logical correlation, and evidential expected utility. First, the Large World hypothesis suggests that the cosmos is sufficiently vast (spatially, temporally, or modally) that exact or approximate duplicates of human decision-making situations occur elsewhere. Second, logical correlation asserts that if two agents run sufficiently similar decision algorithms, their outputs will correlate, not because one causes the other, but because they are solving the same mathematical problem. Third, and most crucially, ECL relies on EDT. Unlike Causal Decision Theory (CDT), which evaluates actions based on their causal consequences, EDT evaluates actions based on the news they bring. For an evidentialist, the act of choosing "Cooperate" is good news that similar agents elsewhere are also choosing "Cooperate."

  The argument for cooperation follows a straightforward expected utility calculation. Suppose there are $N$ causally isolated agents in the multiverse facing similar dilemmas. If I defect to maximize my local value $V$, CDT suggests I gain $V$ regardless of what others do. However, if my decision is logically correlated with the others, my choice to defect is evidence that they will defect. If I instead choose to compromise—sacrificing some local $V$ to support alien values $W$—this is evidence that they will support $V$ in their regions. If $N$ is large enough, the aggregate gain from $N$ agents supporting $V$ outweighs the local loss of compromising on $W$. Thus, ECL argues that rational agents should engage in "acausal trade," sacrificing parochial interests for the sake of a multiversal compromise.

  The first major hurdle for this argument is the decision-theoretic prerequisite. ECL is incoherent from the perspective of Causal Decision Theory. A causal decision theorist argues that since no signal can travel between causally isolated regions, my choice cannot *change* the behavior of distant agents. To think otherwise is to indulge in magical thinking, akin to believing a voodoo doll affects a distant victim. For ECL to function, one must already accept EDT (or Functional Decision Theory, which shares similar commitments regarding logical counterfactuals). However, conceding this point to the evidentialist does not save ECL. Even if we grant that logical correlations generate evidential links, the theory faces insurmountable practical objections regarding estimation and fanaticism.

  The most damaging objection is the problem of epistemic opacity, specifically regarding the reference class of correlated agents. For the ECL calculation to yield a positive expected value, an agent must estimate three variables: the number of correlated agents ($N$), the strength of the correlation ($P$), and the value systems of those agents. We have no empirical access to any of these. If the reference class is too narrow (e.g., "exact physical duplicates"), $N$ may be effectively zero, rendering the potential gains from trade negligible. If the reference class is too broad (e.g., "any reasoning agent"), the correlation strength $P$ drops, as dissimilar algorithms will not reason identically. Furthermore, we cannot know the values of these distant agents. If the multiverse is dominated by agents with hostile or antithetical values, "cooperating" with them might actually decrease total value from our perspective. Because the variables $N$, $P$, and Value are unmeasurable and potentially infinite, the expected utility calculation becomes indeterminate. A decision theory that requires inputs we cannot possibly estimate cannot generate actionable outputs.

  This epistemic vacuum opens the door to the second, more severe objection: fanaticism. ECL inherits and exacerbates the problems of Pascal's Mugging. In a "large world" scenario, the stakes are potentially infinite. If there is any non-zero probability that the multiverse contains infinite copies of agents, the expected value of cooperating with them dominates any finite local concern. This leads to absurd conclusions where an agent should sacrifice significant, certain local value for the sake of a tiny probability of influencing an infinite number of causally inaccessible agents. To avoid this, the evidentialist must introduce discounting mechanisms or probability cutoffs. However, any such cutoff appears ad hoc. If one arbitrarily decides that probabilities below a certain threshold don't count, one undermines the very logic of expected utility maximization that ECL relies upon. If one does not, ECL demands total devotion to speculative multiversal partners at the expense of tangible, local moral obligations.

  Defenders of ECL often retreat to a modest position: even if we cannot calculate the exact gains, we should adopt a heuristic of "compromise." They argue that since we likely share some broad values (e.g., happiness, knowledge) with many correlated agents, weighting our decisions toward universalizable values is a safe bet. However, this modest upshot renders ECL practically inert. Standard moral uncertainty already advises agents to give weight to other plausible value systems. If ECL merely recommends what standard moral humility already suggests—don't be overly parochial—it adds no new normative force. If it recommends something stronger, such as sacrificing high-confidence local projects for low-confidence multiversal trade, it falls prey to the fanaticism objection described above. There is no stable middle ground where ECL provides specific, distinct advice that is both safe from fanaticism and non-redundant.

  Furthermore, the notion of "correlation" does mysterious work that the theory fails to explicate. In standard EDT, correlations are grounded in common causes (e.g., smoking and yellow fingers are correlated because smoking causes both). In ECL, the correlation is "logical" or "subjunctive." While this makes sense for identical computer programs running the same code, human decision-making is noisy, context-dependent, and physically instantiated in vastly different environments. The claim that a human on Earth and a human in a causally disconnected Hubble volume are running the "same algorithm" is a metaphorical stretch that lacks rigorous grounding. Without a robust account of how physical decision procedures supervene on logical algorithms across causal gaps, the evidential link remains metaphysically suspicious.

  In conclusion, Evidential Cooperation in Large Worlds is a theoretically coherent extension of Evidential Decision Theory but a practical failure. Its logical structure holds only if one accepts the controversial premise that logical similarity creates evidential relevance in the absence of causal contact. Even granting that premise, the theory collapses under the weight of intractable uncertainty. We cannot estimate the population of correlated agents, we cannot verify their values, and we cannot calculate the strength of the logical correlation without inviting fanaticism. The resulting verdict is that ECL is practically inert. It offers no actionable guidance that differs meaningfully from standard moral caution, while threatening to divert moral attention toward unfalsifiable, causally inert partners in the multiverse. Rational agents should acknowledge the logical possibility of ECL but refrain from allowing it to influence their decision-making, focusing instead on the causally accessible world where their actions undeniably matter.
