      *   *Logic:* Need to be precise. Use the concept of "logical counterfactuals" or "subjunctive dependence." If I cooperate, it increases the probability *I assign* to them cooperating. Expected Utility = Sum(Prob(Outcome) * Utility). If Prob(They Cooperate | I Cooperate) is high, EU goes up.
      *   *EDT vs. CDT:* Be fair to CDT. CDT says "My choice doesn't change their physics." EDT says "My choice tells me about their physics." ECL needs EDT. But I need to argue that *even if* we grant EDT, ECL struggles.
