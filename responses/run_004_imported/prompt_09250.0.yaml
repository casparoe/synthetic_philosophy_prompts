  1.  **Analyze the Request:**
      *   **Context:** A history-of-philosophy podcast host has a guest who *defends* Al-Ghazali's occasionalism (specifically the fire/cotton example from *Tahafut al-Falasifa*).
      *   **Goal:** Create 8-10 interview questions that go *beyond* the standard "fire doesn't burn, God burns" explanation.
      *   **Specific Requirements:**
          *   Avoid rehashing the basic constant conjunction argument (Humean parallels).
          *   Include a question on "God's Habit" vs. Hume's "Brute Regularity" (explanatory power).
          *   Include a question on Ibn Rushd's (Averroes') objection regarding science/practical reasoning.
          *   Include a question on the Miracle Problem (distinguishing habit change from miracles).
          *   Each question needs a specific follow-up designed to prevent "escape hatches."
          *   Tone: Intellectual, probing, respectful but rigorous (suitable for a philosophy podcast).

  2.  **Deconstruct the Philosophy:**
      *   **Al-Ghazali (Ash'arite Occasionalism):** Causes are not real. God is the only agent. Events are contiguous but not causally connected. "Habit" (*adah*) of God explains regularity.
      *   **Hume:** No necessary connection observed, only constant conjunction. Skepticism about causation.
      *   **Key Difference:** Hume is epistemological/skeptical (we *can't know* necessity). Ghazali is ontological/theological (there *is no* necessity, only Divine Will).
      *   **Ibn Rushd (Averroes):** Defends Aristotelian causality. Argues that denying natures destroys knowledge, science, and the possibility of distinguishing truth from falsehood.
      *   **The Miracle Problem:** If everything is a "miracle" (direct act of God), what makes a *Miracle* special? If God can change habits, how do we know He isn't doing it right now unnoticed?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need 8-10 questions. Need specific follow-ups. Need to cover the three specific topics requested + general deepening.

      *   *Question 1: The Hume Distinction (Required).*
          *   *Draft:* How is God's habit different from Hume's regularity?
          *   *Refinement:* Make it sharper. Hume stops at psychology. Ghazali posits a Divine Agent. Does this actually *explain* order or just personify it?
