      *   *Question 2: Ibn Rushd's Objection (Required).*
          *   *Draft:* Averroes said science is impossible without causes. How do you answer?
          *   *Refinement:* Focus on *prediction* and *counterfactuals*. If fire doesn't burn, why do we avoid it?
          *   *Follow-up:* If she says "Prudence based on habit," ask if that reduces rational action to animal conditioning.

      *   *Question 3: The Miracle Problem (Required).*
          *   *Draft:* How do we tell miracles from habit changes?
          *   *Refinement:* Focus on the *definition*. If nature is just habit, is a miracle just a habit break? If so, isn't *every* moment a potential miracle?
          *   *Follow-up:* If she says "Prophets announce them," ask about the epistemic status of the prophet if causality is unstable.

      *   *Question 4: Divine Freedom vs. Goodness.*
          *   *Idea:* If God burns the cotton every time, is He free *not* to? If He is good, why does He habitually burn things that hurt us?
          *   *Follow-up:* Does this make God the direct author of pain in a way causal realism doesn't?

      *   *Question 5: The Ontology of "Habit" (Adah).*
          *   *Idea:* Is "Habit" a real thing in God? If yes, does it constrain Him? If no, is it just a metaphor?
          *   *Follow-up:* If it constrains Him, is He still omnipotent? If not, is the order arbitrary?

      *   *Question 6: Human Agency.*
          *   *Idea:* If God causes the cotton burning, does He cause my choice to light the fire? (Kasb theory).
          *   *Follow-up:* How is this not determinism? What work is "acquisition" doing?

      *   *Question 7: Modern Physics/Quantum Indeterminacy.*
          *   *Idea:* Does modern science help occasionalism? (Probabilistic vs. Deterministic).
          *   *Follow-up:* Occasionalism isn't just indeterminacy; it's *no* causal power. Does QM actually support *that*?

      *   *Question 8: Theological Motivation.*
          *   *Idea:* Why does this matter for salvation? What do we lose if we accept Aristotelian causes?
          *   *Follow-up:* Is it about protecting God's glory? Is that a valid philosophical reason?

      *   *Question 9: The "Second Cause" Dignity.*
          *   *Idea:* Aquinas says giving creatures causal power makes God *more* glorious, not less. Why is Ghazali wrong here?
          *   *Follow-up:* Does occasionalism make the world a puppet show?

      *   *Question 10: Practical Existentialism.*
          *   *Idea:* How does believing this change how you live *right now*?
          *   *Follow-up:* If you get sick, do you blame the virus or God's will? Is there a difference?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Specific topics covered? Yes (Hume, Rushd, Miracles).
      *   Tone check: Ensure the follow-ups are "trap-like" but polite. They need to anticipate the standard apologetic moves (e.g., "It's a mystery," "It's about faith," "It's compatible with science").
