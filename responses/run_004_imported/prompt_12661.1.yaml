answer: |-
  A graduate student's houseplant dies over the weekend. On Monday, his roommate says, "You killed it. You didn't water it."

  The student replies, "Hold on. If my *not watering* is the cause, then by Lewisian lights, the *not watering* of every other human being is also a cause. I am no more the cause than the Queen of England. She didn't water it either. Why am I the only one being blamed?"

  The roommate says, "Because you're the one who promised to water it."

  The student's eyes light up. "Aha! So you admit it! To solve the profligacy of omissive causation, we have to smuggle in a normative, role-based criterion to privilege one omission over the rest!"

  The roommate sighs, "No. To solve the profligacy of omissive causation, you're buying me a new plant."

  "But that's deontic!"

  "That's rent."
