  4.  **Synthesize the Conflict:**
      *   The user is grappling with *Authenticity vs. Utility*.
      *   Therapist: Focus on Utility (Does this feeling help me?).
      *   User: Focus on Authenticity (Does this feeling match the facts?).
      *   *Resolution:* Both have merit. The therapist's advice is pragmatic, but the user's need for authenticity is crucial for the pride to feel real.

  5.  **Drafting the Response - Key Points to Cover:**
      *   **Validate the User:** Acknowledge that their feeling is normal and logical. It *does* feel weird to be told to feel an emotion just because it's useful.
      *   **Validate the Therapist (with nuance):** Explain the therapeutic intent (self-compassion, behavioral activation).
      *   **Reframe "Pride":** Distinguish between *Performance Pride* (I was fast) and *Effort/Commitment Pride* (I showed up, I endured).
      *   **Address the "Backwards" Feeling:** It feels backwards because we are taught pride is a *reward* for success, not a *fuel* for growth.
