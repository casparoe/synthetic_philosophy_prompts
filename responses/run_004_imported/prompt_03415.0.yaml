prompt: |-
  I ran my first marathon last month and finished near the back, walking a good chunk of it. My therapist says I should just choose to feel proud of myself since that'll help my motivation and mental health going forward, no matter how the race actually went. Somethign about that feels backwards though - shouldn't being proud depend on whether I actually did something impressive, not on whether it's useful for me to feel that way? Am I overthinking this, or is there something off here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user ran their first marathon last month, finished near the back, walked a lot.
      *   **Therapist's Advice:** "Choose to feel proud... since that'll help motivation and mental health... no matter how the race actually went."
      *   **User's Reaction:** Feels "backwards." Believes pride should depend on *actual impressiveness*, not *utility* of the feeling.
      *   **Question:** Am I overthinking this, or is there something off here?

  2.  **Evaluate the Therapist's Advice:**
      *   *Intent:* The therapist is likely coming from a Cognitive Behavioral Therapy (CBT) or Acceptance and Commitment Therapy (ACT) perspective. The goal is to foster self-compassion, reduce negative self-talk, and encourage future healthy behaviors (running).
      *   *Phrasing:* The phrasing "choose to feel proud... no matter how the race actually went" might be the sticking point. It sounds like gaslighting or forced positivity if interpreted literally as "ignore reality."
      *   *Validity:* Finishing a marathon *is* an accomplishment, regardless of speed or walking. However, the user's intuition that pride usually links to *standards* is also valid.

  3.  **Evaluate the User's Intuition:**
      *   *Core Belief:* Pride = Achievement/Excellence.
      *   *Conflict:* If I didn't excel (finished last, walked), do I deserve pride?
