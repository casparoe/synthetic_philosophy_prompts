  4.  **Compare Quine and Harman (Task 1):**

      *   *Similarities:* Both are naturalistic skeptics. Both deny moral facts have the same ontological/epistemic status as scientific facts. Both rely on the idea that moral judgments track the observer's state more than the world's state.
