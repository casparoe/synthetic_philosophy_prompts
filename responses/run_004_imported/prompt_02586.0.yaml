answer: |-
  This is a remarkably sharp dissection of two foundational naturalistic critiques of moral realism. You have correctly identified that while Quine and Harman are often lumped together as "skeptics," their mechanisms of skepticism differ in ways that matter for a realist defense. The connection to the rationalist community's rediscovery of these arguments (often via Yudkowsky's attempts to ground morality in computation or preference) is apt; Yudkowsky's project often stumbles precisely on the rocks Quine and Harman laid out.

  Here is an analysis of the distance between the two arguments, the tension in Quine's holism, and an evaluation of which poses the greater threat to robust moral realism.

  ### 1. The Distance Between Quine and Harman

  While both arguments conclude that moral facts lack the standing of scientific facts, they attack different links in the chain of justification. They are not merely the same point in different vocabularies; they are distinct challenges that can be decoupled.

  **Quine: The Methodological Challenge (Epistemic)**
  Quine's argument in "On the Nature of Moral Values" is primarily about **confirmation**. He argues that scientific theories earn a correspondence theory of truth because they make predictions that can be checked against an independent tribunal (sensory observation). Moral theories, he claims, only check against other moral intuitions or standards.
  *   **The Core Claim:** Ethics lacks an independent check.
  *   **The Result:** Ethics is confined to a coherence theory of truth (internal consistency) rather than correspondence (fit with reality).
  *   **The Target:** The *epistemic warrant* for believing moral propositions track mind-independent facts.

  **Harman: The Explanatory Challenge (Metaphysical)**
  Harman's argument in *The Nature of Morality* is about **inference to the best explanation (IBE)**. He grants that we have moral "observations" (e.g., seeing the cat-burning and judging it wrong). He asks what best explains the occurrence of that observation.
  *   **The Core Claim:** Moral facts are explanatorily otiose. We can explain the observer's judgment entirely via their psychology, upbringing, and sensibilities without positing an actual property of "wrongness" in the world.
  *   **The Result:** Moral facts are unnecessary posits.
  *   **The Target:** The *ontological commitment* to moral facts.

  **Can one accept one challenge while resisting the other?**
  Yes. The distinctions allow for four logical positions, not just two:

  1.  **Accept Both (Error Theory/Non-Cognitivism):** Moral facts don't exist (Harman) and couldn't be verified if they did (Quine).
  2.  **Reject Both (Naturalist Realism):** Moral facts are natural properties that explain observations (reject Harman) and are verified through empirical inquiry (reject Quine).
  3.  **Accept Quine, Reject Harman (Coherentist Realism):** One could argue that moral facts *do* explain our observations (perhaps in a non-causal way), thereby satisfying Harman, but concede that we cannot verify them against "independent nature" in the physicalist sense, accepting Quine's coherence limitation. This is a rare but coherent position (somewhat akin to certain readings of Rawls or reflective equilibrium).
  4.  **Accept Harman, Reject Quine (Theoretically Possible but Unstable):** One could argue that we *can* test moral claims against independent nature (rejecting Quine), but that doing so reveals moral facts are unnecessary (accepting Harman).

  The crucial divergence is that **Quine questions the *method* of ethics, while Harman questions the *need* for moral ontology.** A realist can argue against Quine by claiming moral inquiry *is* continuous with scientific inquiry (the Cornell Realists' strategy). But against Harman, they must prove moral properties do *work* in our explanations of the world.

  ### 2. Quine's Holism and the "Tribunal of Experience"

  You have put your finger on the most significant internal tension in Quine's metaethics. In "Two Dogmas of Empiricism," Quine argues for confirmation holism: our beliefs face the tribunal of experience not individually, but as a corporate body. We can save any specific statement from refutation by making adjustments elsewhere in the web.

  **The Tension:**
  If the web is holistic, why is ethics quarantined? If moral sentences are part of the web, they contribute to the overall predictive success of the system. If a system containing moral axioms predicts human behavior (sociology, psychology, history) better than one without them, shouldn't those moral axioms earn some degree of empirical confirmation?

  **Quine's Defense:**
  Quine would likely reply that while the web is holistic, not all strands touch the periphery. Observation sentences impinge directly on sensory receptors. Theoretical sentences (like "protons exist") are retained because they are indispensable for organizing those observations. Quine places moral sentences in the category of "posits" that do not help organize sensory experience. For Quine, a sentence earns empirical content only if its truth value makes a difference to the prediction of sensory stimuli. Moral sentences, he assumes, do not change the prediction of the stimuli; they only change our *reaction* to them.

  **The Critique:**
  This defense is widely considered the weakest part of Quine's philosophy. It assumes a sharp distinction between "predicting stimuli" and "guiding action that leads to stimuli." If moral beliefs influence actions, and actions change the observable world, then moral beliefs are causally connected to the periphery of the web. By excluding ethics from the holistic web, Quine seems to beg the question against the naturalist realist. He asserts that ethics lacks empirical content rather than demonstrating it through the holistic method he prescribes for science.

  ### 3. Which Argument is the Greater Obstacle?

  For a defender of **robust, cognitivist moral realism**, **Harman's argument poses the more serious obstacle.**

  Here is why:

  **1. Harman Uses the Realist's Best Weapon Against Them**
  Contemporary moral realism largely relies on naturalism and IBE. Realists want to say moral facts are part of the best explanation of the world. Harman accepts the framework (naturalism/IBE) but argues the realist fails their own test. Quine, by contrast, attacks the framework itself (denying ethics can correspond). It is easier to argue Quine is wrong about the scope of holism (as many naturalists have) than to prove moral facts are explanatorily necessary. Harman forces the realist to do heavy metaphysical lifting; Quine just asks them to leave the room.

  **2. Explanatory Otiosity is Harder to Beat than Methodological Difference**
  To defeat Quine, a realist need only show that moral inquiry is *methodologically similar* to science (e.g., both use reflective equilibrium, both revise based on new data). This is a plausible claim.
  To defeat Harman, the realist must show that the *fact* of wrongness explains the *observation* of wrongness. This requires a theory of moral causation or constitution that doesn't collapse into psychology. When a physicist sees a vapor trail, the proton causes the trail. When you see kids burning a cat, does the *wrongness* cause your judgment? Or does your disapproval constitute the wrongness? If the latter, Harman wins (the fact is mind-dependent). If the former, the realist must explain how a normative property exerts causal influence without violating the closure of the physical world. This is the "Queerness" objection revitalized.

  **3. The "So What?" Factor**
  Even if a realist defeats Quine and establishes that ethics has a "correspondence" theory of truth, Harman's challenge remains: *Correspondence to what?* If the "moral reality" we correspond to is explanatorily idle, the realist has won a semantic victory but lost the ontological war. Robust realism requires moral facts to be part of the fabric of the universe, not just mirrors of our coherent intuitions. Harman cuts at the fabric; Quine only questions the mirror.

  ### Summary regarding the Rationalist Context

  The rationalist forums' intuition that Yudkowsky was reinventing wheels is partially correct, but with a twist. Yudkowsky's metaethics (specifically in *Metaethics for Humans* and related sequences) attempts to secure moral truth by grounding it in the "complex value structure" of human minds, extrapolated via idealization.

  *   **Against Quine:** Yudkowsky essentially accepts Quine's limitation. He doesn't claim moral truths correspond to external particles; he claims they correspond to the output of a specific computational process (human preference extrapolation). He is comfortable with a form of coherentism/internalism.
  *   **Against Harman:** This is where Yudkowsky is vulnerable. If the "moral truth" is just the output of an idealized human psychology, Harman's point stands: you don't need a *moral fact* to explain the judgment, you only need the *psychology*. Yudkowsky secures objectivity (all idealized agents agree) but sacrifices the robust realism that posits moral facts as independent explainers.

  **Conclusion:**
  Quine and Harman are distinct. Quine challenges the *epistemic access* to moral truth; Harman challenges the *existence* of moral truth-makers. Quine's position is tension-filled regarding his own holism, making it vulnerable to naturalist co-option. Harman's argument, however, strikes at the heart of robust realism by demanding explanatory utility that moral facts struggle to provide. For the realist who wants morality to be "real" in the same way electrons are real, Harman is the adversary who cannot be ignored.
