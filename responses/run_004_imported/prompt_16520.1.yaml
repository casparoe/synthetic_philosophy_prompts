answer: |-
  You are not being inconsistent; you have stumbled directly onto one of the central problems in the philosophy of art: **the problem of aesthetic testimony.**

  Your intuition that there is an asymmetry between passing along a factual claim (35mm vs. digital) and an evaluative judgment (the script drags) is shared by many philosophers. While the epistemological structure looks similar in both cases (Person A trusts Person B's report), the norms governing *assertion* and *belief* differ significantly between facts and aesthetics.

  Here is a breakdown of why your feeling of "subtle dishonesty" is philosophically warranted, drawing on concepts likely relevant to your seminar.

  ### 1. The Acquaintance Principle
  The most robust defense of your intuition is known as the **Acquaintance Principle**. This principle states that aesthetic judgments must be grounded in first-hand experience.

  *   **Factual Claims:** Whether a film was shot on 35mm is a mind-independent fact. It is true regardless of who observes it. If your friend is a reliable witness, her testimony transfers knowledge to you. You can truthfully say, "It was shot on 35mm," because the truth condition relies on the *film*, not on *you*.
  *   **Evaluative Claims:** Aesthetic value is generally considered response-dependent. For a script to "drag," it must be *experienced* as dragging by a viewer. When you say, "The script drags," you are not just reporting a property of the film; you are implicitly reporting your own phenomenological experience of the film.

  By repeating her verdict without seeing the film, you are severing the judgment from the experience that gives it authority. You are claiming a relationship with the artwork that you do not possess.

  ### 2. The Norm of Aesthetic Assertion
  In speech act theory, assertions carry certain warranties. When you assert a fact, you warrant that you have good evidence for its truth. When you assert an aesthetic judgment, you warrant that you have **appreciated** the object.

  Philosopher Peter Hopkins argues that aesthetic testimony is "defective" not because the information is false, but because it bypasses the proper function of aesthetic judgment. The point of aesthetic discourse is not merely to exchange verdicts (Good/Bad); it is to share perspectives and sensibilities.

  *   **The Dishonesty:** When a society member asks you if a film is good, they are asking for your curatorial perspective. They want to know how *you* (or the society you represent) relate to the work. By outsourcing the judgment, you are misrepresenting the source of the authority. You are presenting a second-hand verdict as a first-hand appreciation.

  ### 3. Understanding vs. Knowledge
  There is a distinction between knowing *that* something is the case and understanding *why* it is the case.

  *   **Facts:** You can know the film is 35mm without understanding the chemical process of film stock. The knowledge is sufficient for the claim.
  *   **Aesthetics:** To truly hold the belief that "the lead performance holds it together," you need to understand the interaction between the script's weakness and the actor's strength. If you haven't seen it, you lack the **aesthetic understanding** required to back up the claim. You have the conclusion without the premise.

  Immanuel Kant, in the *Critique of Judgment*, would argue that aesthetic judgment requires a "free play" of the imagination and understanding. You cannot borrow someone else's mental state. If you adopt their verdict without the mental activity, you are engaging in what Kant might call a mechanical imitation of judgment, rather than genuine judging.

  ### 4. Is it *Always* Wrong? (The Optimist Counter-View)
  To play devil's advocate for your seminar: there is a camp of "aesthetic optimists" (such as Elizabeth Burns Coleman or some social epistemologists) who argue that aesthetic testimony *is* valid. They might argue:
  *   We trust critics all the time.
  *   Language allows us to share aesthetic concepts.
  *   If your friend's taste aligns with yours historically, her judgment is a reliable proxy for yours.

  However, even most optimists draw a line at **asserting the judgment as your own.** You might be justified in *believing* the film is good based on her testimony, but it is a violation of conversational norms to assert, "I think the script drags," when you mean, "She thinks the script drags."

  ### Conclusion
  You are not being inconsistent. The asymmetry is real.
  *   **Factual testimony** transfers knowledge about the **world.**
  *   **Aesthetic testimony** (when adopted as one's own) attempts to transfer a **state of mind.**

  The "subtle dishonesty" you feel is the friction of violating the **norm of autonomy.** In aesthetics, the authority of the judgment lies in the subject who experiences it, not just in the object being judged.

  **A Practical Suggestion:**
  You can resolve this without undermining your friend's expertise. Shift your phrasing to reflect the source of the testimony.
  *   *Instead of:* "The script drags in the second act."
  *   *Try:* "Our programmer noted that the script drags, but she argues the performance saves it."

  This preserves the factual utility of her expertise while maintaining your own aesthetic integrity. It turns the interaction into a conversation about *taste* (which is what a film society is for) rather than a transaction of *verdicts*.
