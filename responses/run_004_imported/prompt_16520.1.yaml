      *   **Key Argument 2: The Nature of Assertion.** When you say "It's good," you imply *you* found it good. When you say "It's 35mm," you imply *it is* 35mm (regardless of who checked).
      *   **Key Argument 3: Understanding vs. Knowledge.** You can know a fact without understanding the mechanism. You can't appreciate art without experiencing it.
      *   **Nuance/Counterpoint:** Is it *always* wrong? Sometimes we use shorthand. But the feeling of dishonesty comes from claiming the *experience*.
      *   **Conclusion:** The feeling is philosophically warranted.

