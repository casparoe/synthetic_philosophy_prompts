prompt: |-
  Ok this is going to sound like a weirdly specific thing to suddenly care about, but here goes. A few months ago a friend got me into these forecasting markets (mostly Manifold), and I somehow ended up in a whole sub-community that bets specifically on math stuff — will the Collatz conjecture be resolved by 2030, will someone find a fatal bug in some famous computer-assisted proof, that kind of thing. I've put actual mana on a bunch of these, plus a small amount of real money on a different site, so it's stopped being purely academic for me and started being "oh no did I just lose money because I don't actually know how to think about this."

  Somebody in that community kept bringing up "logical induction" as basically the theoretically correct way to assign probabilities to open math questions, so I sat down and read through the old MIRI paper (Garrabrant and coauthors, I want to say 2016?). I followed the general shape of the idea — instead of a Bayesian reasoner who's implausibly assumed to already be logically omniscient, you build this market of computable trader-algorithms betting on logical/mathematical sentences over time, and the whole pricing process is "good" in the sense that no efficiently computable trader can exploit it for unbounded profit as proofs and disproofs roll in. Neat premise, but I got lost trying to figure out what that actually buys someone in my position, and I don't have the math background to work through the proofs myself.

  So here's what I'm hoping you can help with: what are the most important implications of the logical induction framework for someone who's just trying to put reasonable numbers on "will conjecture X be proven by year Y" markets, as opposed to someone trying to build an actual logical inductor? Specifically, could you untangle which of it's guarantees (calibration, provable sentences converging to probability 1, non-exploitability, whatever else is actually load-bearing) should genuinely change how I reason day to day, versus which parts are elegant in-the-limit existence results that don't tell me anything about what number to type into the box today? I'm also curious whether the framework points to specific ways humans screw up this kind of forecasting — systematic mistakes that a market-of-traders setup wouldn't make — even though I obviously can't run one of these things by hand.
