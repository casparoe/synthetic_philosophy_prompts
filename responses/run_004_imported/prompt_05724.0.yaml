          *   *Consistency:* Check your portfolio for logical arbitrage.
          *   *Meta-Reasoning:* Bet on the *process* of math (sociology of math, computer power), not just the truth value. LI incorporates "proof search" difficulty.
      *   **Actionable Advice for Math Markets:**
          *   Look at the "proof ecosystem" (are people working on it?).
