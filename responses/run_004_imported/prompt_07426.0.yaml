          *   *Aristotle's view:* This is the most primitive and natural form of exchange. It arises from self-sufficiency lacking something specific. It involves goods for goods (use-value for use-value). No money involved.
          *   *Ranking:* Most Natural.

      *   **2. Selling surplus grain for coin, then using that coin to buy tools (sell-then-buy):**
