          *   *Ranking:* Very Natural, but slightly less than barter because it introduces money, which *can* lead to unnatural accumulation, though here it doesn't.

      *   **3. Buying a share in a farming cooperative and collecting a portion of its harvest profits every year (co-op share):**
          *   *Aristotle's view:* This involves ownership of production (land/farming). Farming is natural because it draws from the earth. However, "profits" implies a monetary return. If the share is bought purely for income (money), it leans toward *chrematistike*. But since it's tied to actual harvest (goods/use), it's closer to natural acquisition than pure trade. It's akin to owning land and receiving rent in kind (or value thereof). Aristotle sees land ownership as natural. The "profit" here is a share of the *produce*, even if monetized.
          *   *Ranking:* Natural, but involves money/property rights beyond simple household provisioning. Less natural than direct exchange for use, more natural than trade for profit.

      *   **4. A merchant buying grain cheap in one town purely to resell it dear in another (retail arbitrage):**
          *   *Aristotle's view:* This is *kapelike* (retail trade). Aristotle explicitly distinguishes this from natural acquisition. The goal is profit (money), not use. It is limitless. However, it still involves actual goods (grain). It is unnatural compared to household management, but less unnatural than interest because goods are still moving.
          *   *Ranking:* Unnatural (Chrematistike), but less so than interest.

      *   **5. Lending a friend money and charging simple interest (simple interest):**
