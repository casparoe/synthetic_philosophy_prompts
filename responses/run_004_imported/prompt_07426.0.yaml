          *   *Aristotle's view:* This is betting on failure/debt without any underlying good or even direct lending relationship. It is money betting on money's failure. It is completely detached from use-value or natural production. It is pure speculation on financial instruments.
          *   *Ranking:* Most Unnatural. It is several steps removed from real goods.

