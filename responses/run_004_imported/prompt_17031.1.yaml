      *   *Expansion:* Make the Externalist press harder on whether "sound deliberative route" implicitly assumes a correct way to deliberate that isn't just instrumental.

      *   *Revised Draft:*
      **Internalist:** Take the case. After unlimited reflection, nothing in his subjective motivational set ($S$) links to helping. So, he has no reason.
      **Externalist:** That surrenders normativity to contingency. Friendship itself provides a reason. If his $S$ lacks it, he's morally blind, not reason-less.
      **Internalist:** "Blind" implies he ought to see. But if correct deliberation—from his actual psychology—yields no motivation, the statement "he has a reason" is false. It's just blame.
      **Externalist:** But your "sound deliberative route" is doing heavy lifting. Doesn't deliberating *soundly* about friendship require recognizing its normative force?
      **Internalist:** No. It means fixing factual errors and imagining outcomes vividly. If he imagines her distress and feels nothing, the link is absent. You're smuggling external norms into "sound."
      **Externalist:** I'm saying rationality isn't just instrumental. If he fails to care about a friend's plight, that's a rational failure, not just a motivational gap.
      **Internalist:** Then you're defining rationality by the outcome you want. I'm asking if the reason can explain action. If it can't move him even ideally, it's inert.
      **Externalist:** It explains why he's culpable. Your view lets the callous agent off the hook. If he lacks the motivation, you say "no reason," so he's consistent.
      **Internalist:** I say he's unfortunate, not irrational. But positing a reason that cannot possibly motivate him is metaphysical junk.
      **Externalist:** And reducing reasons to psychological dispositions loses the "ought." You've saved the link to action by severing the link to obligation.
      **Internalist:** Better an empty obligation than a mysterious reason.

