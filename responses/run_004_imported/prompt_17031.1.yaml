  1.  **Analyze the Request:**
      *   **Topic:** Bernard Williams' "Internal and External Reasons" (metaethics).
      *   **Characters:** Williams-style Internalist vs. Externalist (Korsgaard/McDowell type).
      *   **Case Study:** A guy has zero motivation (even after unlimited correct reflection/imaginative rehearsal) to help an old friend in trouble. Does he have a reason?
      *   **Key Constraints:**
          *   Use Williams' machinery (Subjective Motivational Set $S$, sound deliberative route).
          *   Real back-and-forth dialogue (responding to points, not monologues).
