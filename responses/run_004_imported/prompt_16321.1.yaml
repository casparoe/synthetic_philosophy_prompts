      *   *The "Ship of Theseus" Parallel:* If I change one bit, is it the same file? If I move it to a new drive, is it the same file?
      *   *Conclusion/Resolution:* Help the user make peace with deleting one. The "thing" that matters (the music) remains. The "container" is redundant.

