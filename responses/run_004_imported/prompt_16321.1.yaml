      *   *Informational View:* They contain the exact same information. The *song* is the same. The *data* is the same. Therefore, they are one *type*.
      *   *Philosophical View:* This touches on the distinction between a "token" and a "type."
          *   *Type:* The abstract concept of the song/file content.
          *   *Token:* The physical realization of that content on a specific medium.
