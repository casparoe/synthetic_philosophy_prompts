prompt: |-
  So my flatmate (she's mid-PhD in evolutionary biology) and I had this argument last night that was basically about the Gould and Lewontin spandrels paper for like half an hour before either of us actually said that out loud. I kept floating adaptive explanations for random human behaviors and she kept shutting them down with some version of "that could just be a spandrel," like that alone was a full rebuttal. I pushed back that this is kind of a cheap move — you can't actually point at some trait and call it a non-adaptive byproduct without doing the same comparitive, hypothesis-driven reasoning that adaptationists do, so the critique isn't coming from some neutral, theory-free vantage point outside the programme it's attacking. She said I was flattening the actual 1979 paper into a strawman and that it was really about burden of proof and unfalsifiability, not a ban on adaptive stories. I also vaguely remember reading (Dennett, maybe, in Darwin's Dangerous Idea?) that Gould's own preferred alternatives — developmental constraints, historical contingency, that sort of thing — are just as unfalsifiable and story-shaped as the "just-so stories" he loved to mock, but I couldn't reconstruct the actual argument in the moment, which bugged me all night.

  Can you help me build this properly? I want a real argument, not just a gut feeling, for the position that the spandrels critique does NOT show the adaptationist research programme is methodologically bankrupt. At minimum I want it to hit two things: (1) that identifying something as a spandrel/byproduct in the first place already presupposes the same comparative reasoning distinctive of adaptationism, so it can't function as an external check on it, and (2) that Gould and Lewontin's own favored explanations are exactly as vulnerable to the just-so-story charge as the hypotheses they're targeting. If it's useful, feel free to bring in how later philosophy of biology — I'm thinking of how people like Godfrey-Smith split adaptationism into different kinds (empirical vs methodological, etc.) — helps or complicates the case, but I'd rather have a tight defense of this specific position than a broad survey of the whole debate.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Context:** An argument with a flatmate (mid-PhD in evolutionary biology) about Gould & Lewontin's 1979 "Spandrels of San Marco" paper.
      *   **User's Position:** The "Spandrels" critique doesn't render adaptationism methodologically bankrupt.
      *   **Flatmate's Position:** "That could just be a spandrel" is a valid rebuttal; Gould & Lewontin were about burden of proof/unfalsifiability, not banning adaptive stories.
      *   **Specific Goals:**
          1.  Argue that identifying a spandrel *requires* adaptationist-style comparative reasoning (it's internal, not external).
          2.  Argue that Gould's alternatives (constraints, contingency) are equally vulnerable to the "just-so story" charge.
          3.  Incorporate philosophy of biology (e.g., Godfrey-Smith) if it tightens the defense, but keep it focused.
      *   **Tone:** Rigorous, argumentative, philosophically grounded, but accessible enough for a late-night/debate context (though the user wants a "real argument").

  2.  **Deconstruct the Core Issues:**

      *   **Issue 1: The Status of the Spandrel Claim.**
          *   Gould & Lewontin (G&L) argued that adaptationists assume every trait is optimized. They suggested many traits are byproducts (spandrels).
          *   *User's Point:* You can't just wave your hands and say "spandrel." To prove $X$ is a byproduct of $Y$, you need to show $Y$ was selected for and $X$ comes along for the ride due to genetic/developmental linkage.
          *   *Implication:* This requires the *same* rigorous testing (comparative method, phylogenetic analysis, cost-benefit analysis) that adaptationists use. Therefore, "Spandrel" isn't a null hypothesis that stops inquiry; it's a competing evolutionary hypothesis that requires evidence.
          *   *Philosophical Support:* Peter Godfrey-Smith's distinction between *empirical adaptationism* (most traits are adaptations) and *methodological adaptationism* (start by assuming adaptation to generate testable hypotheses). G&L attack the former but inadvertently rely on the latter to prove spandrels.

      *   **Issue 2: The "Just-So Story" Symmetry.**
          *   G&L accused adaptationists of telling unfalsifiable stories (Kipling's "Just-So Stories").
          *   *User's Point:* Explaining a trait via "developmental constraint" or "historical contingency" can *also* be done lazily. "Why do we have chins?" "Developmental constraint." (End of story).
          *   *Implication:* If the crime is storytelling without evidence, structuralists/constraint theorists are guilty too. Dennett's critique is relevant here.
          *   *Philosophical Support:* Dennett (*Darwin's Dangerous Idea*) argues that G&L set a standard of proof they couldn't meet themselves. Also, Lynch (2007) or others on the "null hypothesis" problem.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the flatmate's expertise (don't dismiss G&L entirely) but frame the user's intuition as philosophically robust. State the thesis: The Spandrels critique is an *internal* correction, not an *external* demolition.
      *   **Point 1: The Epistemic Cost of Identifying Spandrels.**
          *   To call something a spandrel is to make a positive claim about evolutionary history.
          *   It requires establishing the primary adaptation (the arch) and the necessary structural linkage (the spandrel).
          *   This uses the adaptationist toolkit (phylogenetics, comparative analysis).
          *   *Key phrase:* "Spandrel-hunting is a species of adaptation-hunting."
      *   **Point 2: The Symmetry of Storytelling.**
          *   Address the "Just-So" charge.
          *   Show how "constraint" explanations can be equally post-hoc and unfalsifiable if not rigorous.
          *   Bring in Dennett: G&L demanded falsifiability but offered alternatives that were hard to falsify.
      *   **Point 3: Methodological vs. Empirical Adaptationism (Godfrey-Smith).**
          *   Use this to clarify the confusion.
          *   G&L attacked *Empirical Adaptism* (the claim that *most* things are adaptations).
          *   But *Methodological Adaptism* (the heuristic of *testing* for adaptation first) remains valid because it generates the data needed to prove a spandrel.
          *   Therefore, the research programme isn't bankrupt; the heuristic is necessary even for the critique to work.
      *   **Conclusion:** Summarize. The flatmate is right that "it might be a spandrel" is a valid *caution*, but wrong if she thinks it's a conversation-ender that requires no evidence.

  4.  **Refining and Polishing:**
      *   *Check Tone:* Ensure it doesn't sound like I'm saying the flatmate is stupid. She's a mid-PhD, so she knows the biology. The argument needs to be philosophically precise to match her biological expertise.
