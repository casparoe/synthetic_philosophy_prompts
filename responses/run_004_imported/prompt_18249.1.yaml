answer: |-
  This is a classic debate in the philosophy of biology, and your gut feeling is actually supported by a significant chunk of the literature that emerged *after* the initial dust settled on the "Spandrels" paper. Your flatmate is right that "Spandrels" is often caricatured, but you are right that the *application* of the spandrel critique often commits the very sins it accuses adaptationists of.

  Here is a structured argument you can use to defend the position that the Spandrels critique does not bankrupt the adaptationist research programme. It focuses on the **epistemic symmetry** between adaptationist and structuralist explanations.

  ### 1. The "Spandrel" Claim is a Positive Evolutionary Hypothesis, Not a Null Hypothesis
  Your strongest point is that identifying a trait as a spandrel is not a passive act of skepticism; it is an active act of reconstruction.

  *   **The Argument:** To successfully label a trait $T$ a "spandrel," you must demonstrate two things: (1) that $T$ is a necessary structural or developmental byproduct of some other trait $A$, and (2) that trait $A$ was indeed selected for (i.e., $A$ is an adaptation).
  *   **The Implication:** You cannot prove $T$ is a byproduct without first doing the hard adaptationist work of proving $A$ is an adaptation. You have to establish the selective history of the "arch" to explain the "spandrel."
  *   **The Conclusion:** Therefore, the spandrel critique cannot function as an external check on adaptationism because **spandrel-hunting is a species of adaptation-hunting.** It relies on the same comparative methods, phylogenetic controls, and fitness cost-benefit analyses that adaptationists use. If the adaptationist toolkit is "bankrupt," you cannot use it to identify spandrels either.
  *   **Philosophical Backing:** This aligns with **Peter Godfrey-Smith's** distinction in *Adaptationism and the Philosophy of Biology* (2001). He distinguishes between *Empirical Adaptationism* (the claim that most traits are adaptations) and *Methodological Adaptationism* (the heuristic strategy of testing for adaptation first). G&L successfully attacked the former, but the latter remains necessary to prove the former wrong. You have to use Methodological Adaptationism to identify Empirical Non-Adaptationism.

  ### 2. The Symmetry of "Just-So" Stories (The Dennett Critique)
  Your memory of Dennett is spot on. In *Darwin's Dangerous Idea*, he argues that G&L set a standard of proof for adaptationists that they did not meet for their own preferred explanations.

  *   **The Argument:** G&L mocked adaptationists for telling "Just-So stories" (post-hoc narratives that fit the data but aren't falsifiable). However, explanations invoking "developmental constraints," "phylogenetic inertia," or "historical contingency" are equally vulnerable to this charge if not rigorously modeled.
  *   **Example:** If an adaptationist says, "Humans have chins because it strengthens the jaw against chewing stress," G&L say: "Where is your evidence? That's a story." But if a structuralist says, "Humans have chins because of developmental constraints in mandibular growth," the adaptationist can reply: "Where is your evidence? That's also a story."
  *   **The Implication:** Merely invoking "constraint" is not a free pass. A constraint explanation requires a model of the developmental system showing *why* variation in that direction was impossible or prohibitively costly. Without that model, "it's a constraint" is just as unfalsifiable as "it's an adaptation."
  *   **The Conclusion:** The charge of unfalsifiability cuts both ways. If the adaptationist programme is bankrupt because it allows for storytelling, then the structuralist/constraint programme is equally bankrupt. Since biology clearly *isn't* bankrupt, the existence of storytelling risks doesn't invalidate the methodology; it just mandates rigor (which both sides must apply).

  ### 3. Burden of Proof and the "Default" Position
  Your flatmate mentioned "burden of proof." This is where the nuance lies. She is right that adaptationists shouldn't assume optimization blindly. But you are right that "Spandrel" isn't the default.

  *   **The Argument:** In evolutionary biology, the true "null hypothesis" is usually random drift or neutral evolution, not "byproduct of another adaptation." Both adaptation and spandrel-status are **positive claims** about selective history.
  *   **The Implication:** Saying "That could just be a spandrel" is not a methodological stop-sign; it is a proposal for a *rival hypothesis*. Like any rival hypothesis, it carries its own burden of proof.
  *   **The Conclusion:** The Spandrels paper successfully argued that adaptationists were too quick to assume optimization. It did *not* successfully argue that "spandrel" is the skeptical default position that requires no evidence. To treat it as such is to treat "non-adaptation" as a theory-free observation, which it is not. It is a theoretical claim about evolutionary causality.

  ### How to Deploy This in Conversation
  You don't need to overwhelm her with citations, but you can frame it like this:

  > "I agree that G&L showed adaptationists were too loose with their evidence. But my point is about **epistemic symmetry**.
  >
  > First, you can't identify a spandrel without first identifying the adaptation it's attached to. So, you're using adaptationist methods to disprove adaptationist conclusions. That means the methodology isn't bankrupt; it's the only tool we have to test both claims.
  >
  > Second, if 'Just-So story' means 'a causal explanation without sufficient comparative evidence,' then 'developmental constraint' is just as much of a Just-So story if you don't model the development. Dennett made this point: G&L demanded falsifiability for selectionist accounts but let constraint accounts slide with hand-waving.
  >
  > So, 'It might be a spandrel' is a great hypothesis generator, but it's not a conversation-ender. It requires the same comparative rigor as the adaptationist account it's critiquing."

  ### Summary of the Defense
  1.  **Internal, not External:** Proving a spandrel requires proving an adaptation (the primary trait). Thus, the critique relies on the methodology it attacks.
  2.  **Symmetry of Risk:** Constraint/contingency explanations are just as prone to post-hoc storytelling as adaptationist explanations.
  3.  **Heuristic Validity:** Methodological adaptationism (testing for function) is required to generate the data necessary to falsify adaptationism.

  This position respects the biological reality your flatmate knows (that not everything is an adaptation) while defending the philosophical integrity of the research programme (that looking for adaptations is still the correct way to find out what isn't one).
