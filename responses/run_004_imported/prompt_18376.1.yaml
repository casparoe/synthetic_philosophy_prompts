      *   Did I address Harsanyi? Yes.
      *   Did I explain why "weights drop out" is false? Yes.

  8.  *(Self-Correction during drafting)*: Make sure to emphasize that VNM utility is *ordinal over lotteries* but *cardinal over outcomes* relative to risk. But the zero point is arbitrary. If Person A's "0" is death and "1" is heaven, and Person B's "0" is a mild headache and "1" is ecstasy, summing them is nonsense without calibration.

