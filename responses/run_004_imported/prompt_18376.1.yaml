answer: |-
  This is a sophisticated argument that comes up frequently in rationalist and effective altruist circles. It is often referred to as the **Harsanyi Utilitarianism** argument. While it is mathematically elegant, the consensus among moral philosophers and social choice theorists is that **it does not solve the problem of interpersonal comparison of utility (ICU).**

  The argument contains a subtle but fatal category error regarding what the mathematics actually delivers versus what moral theory requires. Here is a breakdown of why decision theory has not quietly solved the oldest problem in utilitarianism.

  ### 1. The Affine Transformation Problem (The "Unit" Problem)
  The Von Neumann-Morgenstern (VNM) theorem proves that if an agent's preferences satisfy certain axioms, they can be represented by a utility function $u$. However, this function is unique only **up to a positive affine transformation**.

  This means that if $u(x)$ represents your preferences, then $v(x) = a \cdot u(x) + b$ (where $a > 0$) represents them exactly as well.
  *   You can shift the zero point ($b$).
  *   You can change the size of the unit ($a$).

  **The Flaw:** To sum utilities across people ($\sum u_i$), you need a common zero and a common unit.
  *   **Person A** might have a utility range of $[0, 100]$ for their life outcomes.
  *   **Person B** might have a utility range of $[0, 1]$ for theirs.

  If you simply add their VNM utilities, Person A's preferences will swamp Person B's, not because A is more important, but because A's "utility meter" is calibrated differently. VNM tells us nothing about how to calibrate these meters relative to one another. To make them comparable, you must impose a **normalization rule** (e.g., set everyone's "worst possible outcome" to 0 and "best possible outcome" to 1).

  But choosing a normalization rule is a **normative ethical choice**, not a mathematical derivation. Why should we equalize ranges? What if one person is capable of much deeper suffering than another? The math doesn't say; you have to decide.

  ### 2. The Weight Problem
  You claimed that "the correct weights drop out of the mathematics." This is incorrect.

  **Harsanyi's Aggregation Theorem** states that if individual preferences and social preferences both satisfy VNM axioms, and the social preference satisfies the Pareto principle, then the social welfare function $W$ must be a linear combination of individual utilities:
  $$W = \sum_{i=1}^{n} a_i u_i + b$$

  The theorem proves the **form** of the equation (it must be additive), but it **does not determine the coefficients ($a_i$).**
  *   If $a_i = 1$ for everyone, you get classical utilitarianism.
  *   If $a_i$ varies based on desert or need, you get a weighted prioritarianism.
  *   If $a_i = 0$ for everyone except the dictator, you get dictatorship (which technically satisfies Pareto if the dictator is the only one whose preferences matter, though usually, Pareto requires *everyone's* strict preference to count).

  To fix the weights $a_i$, you need to know the **social preference ordering**. But the whole point of moral philosophy is that we *don't* know the correct social preference ordering; that is what we are trying to find. You cannot use the theorem to derive the weights without already knowing the moral answer you are looking for.

  ### 3. Harsanyi's "Impartial Observer" Argument
  Harsanyi realized the Aggregation Theorem didn't fix the weights. He proposed a second argument, the **Impartial Observer Theorem**, to derive equal weights ($a_i = 1$).

  He argued that a moral observer should choose social rules behind a "veil of ignorance," assuming they have an **equal probability** of becoming any person in society. If you maximize expected utility under the assumption that $P(\text{being person } i) = 1/n$, the math yields unweighted utilitarianism.

  **The Flaw:** This relies on a normative premise: *that moral impartiality requires assuming an equiprobable chance of being anyone.*
  Many philosophers reject this. Why should moral weight track hypothetical probability? Furthermore, this still runs into the **Affine Transformation Problem** (Point #1). Even if you assume an equal chance of being Person A or Person B, you cannot calculate the expected utility unless you have already calibrated Person A's utility scale to Person B's utility scale. The equiprobability assumption solves the weights ($a_i$), but it does not solve the calibration of the $u_i$ functions themselves.

  ### 4. Preferences vs. Welfare
  VNM utility measures **preference satisfaction**, not necessarily **well-being** or **happiness**.
  *   **Adaptive Preferences:** A person born into slavery might prefer a small kindness over freedom because they cannot conceive of freedom. Their VNM utility function reflects this. Should a utilitarian society satisfy this preference?
  *   **Expensive Tastes:** Person A gets 10 units of utility from a glass of water. Person B (with expensive tastes) gets 1 unit from water but 100 units from champagne. VNM aggregation suggests we should funnel resources to Person B to maximize the sum. Most intuitions reject this as unjust.
  *   **Malicious Preferences:** If Person A derives utility from Person B's suffering, VNM counts that positive utility in the sum.

  Utilitarians generally want to maximize *welfare*, not just *preference satisfaction*. Since VNM only measures the latter, using it as a proxy for the latter requires a philosophical bridge that decision theory does not provide.

  ### 5. Risk Attitudes as Moral Weights
  VNM utility functions encode **risk aversion**.
  *   A risk-averse person has a concave utility curve (marginal utility decreases rapidly).
  *   A risk-seeking person has a convex utility curve.

  If we use VNM utilities for interpersonal comparison, a highly risk-averse person will appear to have "steeper" utility gradients. The aggregation formula would then prioritize satisfying their preferences over a risk-neutral person's, simply because their utility function is more sensitive to changes in outcomes.

  Is it morally right to give more weight to people who are more anxious or risk-averse? Most moral theorists say no. This suggests that VNM utility conflates **intensity of desire** with **attitude toward risk**, making it a poor metric for moral aggregation.

  ### Summary
  The argument you encountered confuses **structural constraints** with **parameter determination**.

  1.  **VNM** tells us individuals have cardinal utility, but the scale is arbitrary ($au+b$).
  2.  **Harsanyi** tells us social welfare must be a sum of those utilities, but the weights ($a_i$) are arbitrary without further moral premises.
  3.  **Calibration** is required to add the utilities, but the method of calibration is a moral choice, not a mathematical fact.

  Decision theory has clarified the *structure* of the problem, but it has not solved the *substance* of it. The "problem of interpersonal comparison of utility" remains a live problem because mathematics cannot derive an "ought" (how we should weigh lives) from an "is" (how individuals choose under risk) without importing normative assumptions that are themselves subject to philosophical debate.

  **Verdict:** The problem is still live. The argument you saw is a category error that mistakes a representation theorem for a moral derivation.
