      *   **Pro-Cosmopsychism (Carve-Down):** Let's call him *Marcus*. He values unity, the hard problem of consciousness, and sees panpsychism as committing a category error regarding subjectivity. He sees panpsychism as magical emergence.

  3.  **Key Arguments to Include:**
      *   *Elena (Panpsychism):*
          *   Physics is bottom-up; consciousness should be too.
          *   Cosmopsychism implies a "Universal Mind" which sounds religious/mystical.
          *   How does the Universe "ignore" most of itself to let me be just me? (The Inclusion Problem).
      *   *Marcus (Cosmopsychism):*
          *   Subjectivity doesn't aggregate (1 + 1 $\neq$ 2 in experience).
          *   Panpsychism is just materialism with extra steps (magic emergence).
          *   The universe is the only true fundamental entity (holism).
          *   Dissociation analogy (like Multiple Personality Disorder).

  4.  **Drafting - Section by Section:**

