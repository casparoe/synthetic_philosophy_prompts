  1.  **Analyze the Request:**
      *   **Topic:** Panpsychism (constitutive panpsychism) vs. Cosmopsychism.
      *   **Core Conflict:** The Combination Problem (how do micro-experiences combine into macro-experiences?) vs. The Decomposition/De-combination Problem (how does one macro-experience split into isolated micro-experiences?).
      *   **Format:** A dialogue between two defenders (one for each view).
      *   **Tone:** Intellectual, sharp, critical, avoiding repetition, focusing on weak points.
      *   **Goal:** Determine if one view is genuinely less mysterious or if it's the same problem reversed.

  2.  **Character Development:**
