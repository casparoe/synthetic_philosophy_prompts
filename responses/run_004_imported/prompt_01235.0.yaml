answer: |-
  The kiln hummed, a low, throaty vibration that Kaelen felt in his ribs more than he heard with his ears. It was the sound of the workshop breathing, a constant inhalation of air and exhalation of heat. For forty years, Kaelen had been the one controlling that breath. He was the master potter of the valley. His jars held the grain of three provinces; his vases sat on the altars of the capital. He was Kaelen-Who-Shapes-Clay.

  Now, his hands lay in his lap, useless as wet rags. The palsy had started in the fingers, a subtle tremor he hid with long sleeves, before climbing his wrists and settling into his shoulders. It had taken the strength from his grip and the steadiness from his arm. But worse than the tremor was the diagnosis, whispered by the traveling physician and confirmed by the creeping numbness in his legs. The clay was hardening before the shaping was done.

  Kaelen sat in his chair by the kiln, wrapped in wool despite the heat. He watched his apprentice, a young woman named Sola, centering a lump of grey earth on the wheel. She was good. Her hands were confident. But she was making a simple storage jar.

  "It's too small," Kaelen rasped. His voice was thin, stripped of the command it once held.

  Sola didn't look up. Her thumbs pressed into the spinning mound. "It's what the merchant ordered, Master."

  "I ordered a fire-vessel," Kaelen said. "The one with the narrow neck. The one that sings when the wind hits it."

  "That clay won't hold that shape," Sola said. "It's too coarse. And your design... it requires a pull you can't make anymore."

  Kaelen flinched. The words landed like physical blows. He gripped the arms of his chair, his knuckles white, fighting the tremor that wanted to shake his bones apart. "I am the shaper here. The clay does what I tell it."

  "The clay does what the hands tell it," Sola said softly. "And the hands obey the body."

  Kaelen looked away, out the open door of the workshop. The sun was setting, casting long shadows across the drying racks. Rows of green pots stood in silence, waiting to be fired. They were waiting for *him*. Or so he had told himself. In truth, they were waiting for the fire. They were waiting to be changed.

  He felt a surge of hot, shameful anger. It wasn't just that he couldn't work. It was that he was being unmade. For decades, he had curated a specific shape: Kaelen the Master, Kaelen the Provider, Kaelen the Unyielding. He had a vision of how his life would end—standing by the kiln, nodding at a final, perfect glaze, slipping away while the heat was still high.

  Instead, he was becoming a burden. He was becoming a thing that needed to be fed, washed, moved from chair to bed. The universe was taking the distinct sculpture of his identity and smashing it back into a lump. He wanted to leap up, to scream that he was a Sword, not a puddle of ore. He wanted to demand that the process stop, that he be allowed to remain *this*, exactly as he was, until the end of time.

  "Bring me the cullet," Kaelen said suddenly.

  Sola paused the wheel. The clay slowed, wobbling slightly before settling. "The broken shards? Master, it's waste. It goes back into the mix."

  "Bring it to me."

  She sighed, wiped her hands on her apron, and went to the bin near the back. She returned with a wooden bowl filled with the jagged remnants of failed firings. Shards of blue glaze, grey stoneware, pieces of pots that had cracked in the cooling, bowls that had slumped in the heat. Sharp, useless debris.

  Kaelen reached out. His hand shook violently, but he managed to scoop up a handful of shards. They dug into his palm.

  "Look at this one," he said, holding up a curved piece of a blue vase. It had been beautiful once. He remembered throwing it. "I meant for this to be a wedding gift. The neck cracked while it cooled. Useless."

  "It's just earth," Sola said. She had resumed the wheel, spinning the clay again.

  "It was a vessel," Kaelen insisted. "It had a purpose. Now it's just... sharp noise."

  He looked from the shard in his hand to the roaring mouth of the kiln. The fire inside was a churning white-orange eye. It consumed wood and exhaled heat. It did not care about wedding gifts or storage jars. It cared only about transformation.

  "I am that," Kaelen whispered, tapping the blue shard against his chest. "I am the broken thing."

  "No," Sola said. She didn't stop her hands. She was opening the clay now, her fingers diving into the center. "You're not the shard."

  Kaelen frowned. The pain in his legs was throbbing, a deep, dull ache that felt like the earth was trying to pull him down into it. "If I am not the pot I made, and I am not the hands that made it... what is left?"

  Sola stopped the wheel. She stood up and walked over to him. She took the bowl of cullet from his lap. She didn't look at him with pity. She looked at him with the same focus she gave the clay.

  "You think the fire cares if the pot is blue or grey?" she asked.

  "The fire doesn't care," Kaelen said.

  "And the earth?" Sola gestured to the mound on the wheel. "Does the clay care if it is a jar or a brick? Or a shard in a bin?"

  Kaelen looked at the kiln. He thought of the Zhuangzi passage he'd read once, years ago, in a book borrowed from a traveler. The metal jumping in the furnace, crying, *I must be a sword!* The smith would think that metal cursed.

  He had been jumping. He had been screaming silently at the disease, at the age, at the palsy: *I must be the Master! I must be the Shaper!* He was fighting the smith.

  "The metal thinks it is the sword," Kaelen said. His voice was barely audible over the hum of the kiln.

  Sila tilted her head. "What?"

  Kaelen closed his eyes. He felt the tremor in his hands. For the first time, he didn't try to still it. He let the hand shake. He let the leg ache. He stopped trying to hold the shape of "Kaelen the Pottery Master." He let that identity crack.

  If he was not the shaper, then he was the material. He was the clay. And the clay does not mourn becoming a brick instead of a vase. The clay does not mourn becoming dust. It only waits for the turn of the wheel.

  "The fire is hungry," Kaelen said.

  Sola looked at him. She saw the tension drain from his shoulders. The tightness around his mouth, the grimace of a man holding up a collapsing roof, was gone. He looked smaller, somehow. Less like a monument, more like a man.

  "It's always hungry," she said.

  Kaelen leaned his head back against the chair. He watched the heat haze rising from the kiln door. It distorted the air, making the room ripple like water. He imagined himself placed inside. Not as the worker stoking the wood, but as the pot sitting on the shelf. He imagined the glaze melting, the body vitrifying, the structure changing at a molecular level.

  If he let go of the demand to remain a jar, the fire was no longer an enemy. It was just the next turn of the wheel.

  "Sola," he said.

  "Yes, Master?"

  "Throw the cullet in. All of it."

  She hesitated. "It takes a long melt to break down that much. It might cloud the next batch."

  "Throw it in," Kaelen said. "It's time to be remade."

  Sola studied him for a moment. She saw the way his hands rested, open and trembling, on the arms of the chair. She nodded. She took the bowl to the kiln, opened the small grate, and poured the jagged blue and grey shards into the white mouth of the fire. They clattered against the brickwork, then vanished into the glow.

  Kaelen watched them go. He felt a strange lightness in his chest, a hollowing out that wasn't emptiness, but space. He was no longer holding himself together. He was letting the heat do its work.

  "Will you make a jar with the new mix?" he asked.

  "Maybe," Sola said, returning to the wheel. She kicked it into motion. The clay began to spin, a grey blur. "Or maybe a tile. Or maybe I'll leave it rough."

  Kaelen closed his eyes. The hum of the kiln vibrated in his ribs. He listened to the slap of Sola's wet hands on the spinning earth. He did not try to visualize the shape she was making. He did not try to imagine what he would be tomorrow, or when the fire took him completely.

  He just listened to the spinning. He let himself be the clay, waiting to see what the hands would do.
