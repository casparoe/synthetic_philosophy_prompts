answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister]'s older sibling.

  Like many of you, I was thrilled when [Sister] met Daniel. Like half the people in this room, I was slightly intimidated when I learned Daniel is finishing a PhD in Classics. And like *everyone* in this room, I was fascinated when, after a couple of glasses at the engagement party, Daniel explained his dissertation to me.

  Now, most people assume a Classics guy talking about wine is going to quote the *Symposium*. But Daniel is writing about Plato's *Laws*. Specifically Books 1 and 2. For the family: that's Plato's last, longest work on legislation. For the department: yes, I know the difference, and I know the Athenian Stranger is the main speaker, not Socrates.

  Daniel explained that in the *Laws*, the Athenian argues against the Spartans and Cretans, who wanted to ban drinking parties entirely. The Athenian insists that wine, used correctly, is a tool for education. He says wine softens the human character like iron in a fire. When we are rigid and self-conscious, we can't grow. But a little wine, under the right supervision, makes us pliable enough to be reshaped. It tests our character, reveals who we really are, and allows for gentle correction.

  When he told me this, I didn't just hear a dissertation pitch. I heard a description of a good marriage.

  Because let's be honest: over decades, we all get rigid. We get set in our ways. We get "Spartan." We need something to soften us. And we need a partner who isn't afraid to see us when we're unguarded, when the defenses are down, and who loves us enough to offer that "gentle correction" the Athenian talks about.

  Marriage, it turns out, is a lifelong symposium. And the most important rule in Plato's drinking party is that there must be a "sober elder" in charge to guide the evening.

  **[Pause for effect]**

  **For the classicists in the back: yes, the *Symposiarch* is technically a magistrate of the drink. For the rest of you: it's the person who makes sure you don't say the wrong thing to your in-laws, and who drives you home when you've had enough. In a marriage, you don't have one *Symposiarch*. You take turns. Sometimes Daniel is the iron, and [Sister] is the fire. Sometimes [Sister] needs softening, and Daniel holds the water glass.**

  That is the promise you make to each other. Not just to drink from the same cup, but to be the sober watchfulness for one another. To create a space where you can both be tested, both be softened, and both be reshaped into better people than you were when you started.

  Daniel, thank you for teaching me that the goal of the party isn't intoxication, it's *paideia*—it's growth. And [Sister], thank you for being the person Daniel wants to grow with.

  So, if everyone could raise a glass. Not to the wine itself, but to the testing, the softening, and the sober love that guides it.

  To [Sister] and Daniel.
