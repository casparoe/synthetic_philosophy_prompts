prompt: |-
  Years ago, when we were both junior employees who felt stuck in our jobs, I told a colleague, somewhat casually, that if I were ever in a position to hire, I would bring them onto my team. I have since become a director with an opening, and this colleague, who says they turned down another job offer while waiting for mine to come through, has reminded me of what I said back then. They are competent, but clearly a weaker fit than another candidate who applied through the normal process, and choosing them anyway would be unfair to both my team and my employer. Does a promise made so casually, and under such different circumstances, still bind me now, or am I free to hire the stronger candidate? And if I am not entirely free, what, if anything, would I still owe my old colleague?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The User:** Now a Director, has an opening. Previously a junior employee.
      *   **The Colleague:** Former peer (junior), now applying. Claims to have turned down another offer waiting for this one. Reminded the User of a past casual comment. Competent but a weaker fit than another candidate.
      *   **The "Promise":** Made years ago, casually, when both were stuck in junior roles ("If I were ever in a position to hire, I would bring them onto my team").
      *   **The Conflict:** Loyalty/obligation to the colleague vs. fiduciary duty to the employer/team (hiring the best fit).
      *   **The Core Question:** Does the promise bind me? Am I free to hire the stronger candidate? If not entirely free, what do I owe the colleague?

  2.  **Evaluate the "Promise":**
      *   *Nature:* Casual, hypothetical ("If I were ever..."), made years ago under different circumstances.
      *   *Legal/Contractual Status:* Non-binding. It's not a contract. No consideration was exchanged.
      *   *Ethical Status:* It's a "gentleman's agreement" or a expression of support, not a binding vow. Context matters. The context has changed significantly (User is now a Director with responsibilities).
      *   *Conclusion:* The User is *not* bound by the promise in a strict sense.

  3.  **Evaluate the Professional Responsibility:**
      *   *Role:* Director.
      *   *Duty:* To the company, the team, and the stakeholders.
      *   *Impact of Hiring the Weaker Candidate:* Lower team performance, potential resentment from other team members, risk to projects, potential HR issues (fairness/equal opportunity), risk to the User's reputation as a leader.
      *   *Conclusion:* Hiring the weaker candidate is professionally irresponsible.

  4.  **Evaluate the Colleague's Position:**
      *   *Claim:* Turned down another offer waiting for this one.
      *   *Risk:* This puts pressure on the User (guilt trip).
      *   *Reality:* The colleague made a gamble based on a casual comment. That is their risk, not the User's liability.
      *   *Expectation:* They feel entitled based on past friendship/loyalty.

  5.  **Determine the Ethical Balance:**
      *   *Honesty vs. Kindness:* Need to be honest about the hiring decision but kind about the relationship.
      *   *Fairness:* Fairness to the stronger candidate and the team outweighs fairness to the colleague in this specific hiring context.
      *   *Obligation:* There is a moral obligation to treat the colleague with respect and transparency, but not an obligation to hire them.

  6.  **Drafting the Advice (Iterative Process):**

      *   *Direct Answer:* Start by validating the User's instinct. You are not bound.
      *   *Reasoning:* Explain *why*. (Context changed, professional duty, nature of the comment).
      *   *The "Guilt Trip":* Address the colleague's claim about turning down the other offer. That's on them, not you.
      *   *Action Plan:* How to handle the conversation?
          *   Don't ghost.
          *   Be clear but empathetic.
          *   Focus on "fit" not just "competence."
          *   Offer alternative help (networking, feedback).
      *   *Long-term Relationship:* How to preserve the friendship (if desired) without compromising professional integrity.

  7.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid corporate jargon where possible, but maintain professional gravity.
      *   Acknowledge the awkwardness.

  8.  **Key Points to Cover:**
      *   **Binding?** No. It was casual, conditional, and context-dependent.
      *   **Professional Duty:** Your primary duty is to your current team and company. Hiring a weaker candidate is a disservice to them.
      *   **The Colleague's Gamble:** They bet on a maybe. That's their risk.
      *   **What You Owe:** Transparency, respect, timely communication, and perhaps career support (non-hiring).
      *   **The Conversation:** Scripting or key talking points.

  9.  **Self-Correction/Edge Case Consideration:**
      *   *What if the colleague is a close friend?* Doesn't change the professional duty, but makes the conversation harder.
      *   *What if the skill gap is small?* If it's marginal, maybe give them the shot? *Correction:* The prompt says "clearly a weaker fit." Stick to that premise.
      *   *HR Implications:* Hiring based on a past promise rather than merit can look like nepotism or favoritism. Worth mentioning.

  10. **Final Polish:** Organize into clear sections (The Short Answer, The Professional Reality, The Personal Obligation, How to Handle It). Ensure the distinction between "promise" and "expression of intent" is clear. (This aligns with the final output structure).

  11. **Final Review against Safety Guidelines:** Does this promote discrimination? No. Does it promote unethical behavior? No, it advises *against* nepotism/favoritism. It promotes professional integrity.

  *(Self-Correction during drafting)*: I should make sure not to sound too cold. The colleague is in a tough spot (turned down another job). I need to emphasize *how* to break the news kindly, not just *that* they should break it.

  12. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a classic conflict between personal loyalty and professional responsibility. It is an uncomfortable position, but the ethical and professional path is clearer than it might feel in the moment.

  Here is a breakdown of your obligations, the nature of that "promise," and how to handle the situation.

  ### 1. Are you bound by the promise?
  **No.** You are not ethically or professionally bound by that statement.

  *   **Contextual Validity:** The statement was made years ago under vastly different circumstances. It was a hypothetical expression of camaraderie ("If I were ever...") between two peers venting about being stuck. It was not a contract, nor was it a guarantee of future employment contingent on specific performance metrics.
  *   **Change in Fiduciary Duty:** As a junior employee, your primary responsibility was to your own work. As a Director, you have a fiduciary duty to your organization, your team, and the stakeholders. Hiring a less qualified candidate violates that duty.
  *   **The Nature of the "Promise":** In ethics, a promise implies a commitment to a specific outcome. What you made was an *expression of intent* based on the information available at the time. The information has changed (you now have a team to manage, specific role requirements, and a stronger candidate).

  ### 2. The Professional Reality
  Hiring the weaker candidate would be unfair to three parties:
  *   **The Company:** You are paid to build the strongest team possible. Compromising on talent hinders the department's success.
  *   **The Team:** Your current employees will have to pick up the slack if the new hire struggles. They will also notice if favoritism played a role, which damages morale and trust in your leadership.
  *   **The Stronger Candidate:** They applied through the normal process and deserve to be evaluated on merit. Denying them the role for a past casual comment is unjust.

  ### 3. The Colleague's Gamble
  Your colleague's decision to turn down another offer while waiting for your opening is a significant factor, but **it is their risk, not your liability.**

  By banking on a casual comment made years ago, they made a high-stakes gamble. While their situation is unfortunate, you cannot be held hostage by a decision they made unilaterally. If you hire them out of pity or guilt, you establish a precedent that personal pressure overrides professional merit, which is dangerous for your leadership trajectory.

  ### 4. What do you owe them?
  While you do not owe them the *job*, you do owe them **respect, transparency, and support.** Because there is a pre-existing relationship, you cannot treat them like a random applicant.

  *   **Timeliness:** Do not leave them hanging. If you have made your decision, communicate it immediately so they can pursue other opportunities.
  *   **Honesty (with tact):** Do not ghost them or make up excuses. You do not need to say, "Someone else was better than you." Instead, focus on "fit."
  *   **Career Support:** This is where you can honor the spirit of your original comment without violating your professional duty. You can offer to review their resume, make introductions to other hiring managers, or provide mentorship.

  ### 5. How to Handle the Conversation
  You need to have a direct conversation (preferably via video call or phone, not email). Here is a framework for that discussion:

  **Acknowledge the history:**
  > "I remember our conversation from years ago, and I meant what I said at the time. I have always thought highly of your work and wanted to see you succeed."

  **State the decision clearly:**
  > "However, after reviewing the current needs of the team and the candidates we've interviewed, I've made the decision to move forward with another candidate whose specific experience is a closer match for this particular role."

  **Address the "fit" not the "quality":**
  > "This wasn't about competence; it was about the specific skill set we need right now to hit our immediate goals. As a Director, I have to make the choice that is best for the team's current objectives."

  **Address the other offer (briefly):**
  > "I am genuinely sorry to hear you held off on other opportunities hoping for this one. I wish you had told me earlier that you were in that position, as I would have managed expectations sooner. I know this puts you in a tough spot."

  **Offer tangible help:**
  > "I want to honor our relationship. I'd be happy to hop on a call to review your resume, or reach out to my network to see if there are other roles that might be a better fit. I want to help you get to that next step, even if it isn't on my team."

  ### Summary
  You are free to hire the stronger candidate. In fact, you are *obligated* to do so.

  Your original comment was an expression of support, not a blank check. By hiring the best candidate, you protect your team and your integrity. By treating your colleague with kindness and offering alternative support, you honor the friendship. Prioritizing your professional duty now is the only way to ensure you remain in a position where you can actually help people in the future.
