          *   *Scope:* Decision theory, ethics, practical rationality. About *choice* under uncertainty.
      *   **The Connection:** Paul explicitly cites the "what it's like" (Nagel) which is phenomenological. Russell's acquaintance is also about direct awareness. There is an overlap, but the *purpose* differs.

  3.  **Address Core Question 1: Paul vs. Russell (Epistemic Transformation):**

