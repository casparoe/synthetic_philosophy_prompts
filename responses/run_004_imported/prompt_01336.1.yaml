  2.  **Deconstruct Sidgwick's Text:**

      *   **Paragraph 1 (The Setup):**
          *   *Idea:* Good isn't what we *actually* desire. It's what is *desirable*.
          *   *Definition of Desirable:* What *would* be desired if:
              1.  Judged attainable.
              2.  Desirer has perfect forecast (intellectual + emotional) of the outcome.
          *   *Simplified:* Good = What I would want if I knew exactly what it would feel like to get it.

      *   **Paragraph 2 (The Complication/Refinement):**
          *   *Claim:* The definition in Para 1 isn't enough for "Good on the Whole."
          *   *Reasoning:* Just because I don't regret something later doesn't mean it was my "Good on the Whole."
          *   *The Pig Problem:* Some actions change our *tendencies to desire*. They make us want "lesser good" more than "greater good."
          *   *Example:* Living like a "contented pig" (lower pleasures) vs. "something better" (higher pleasures/capacities). Even if the pig is happy and doesn't regret not being human, we think it's worse for him.
          *   *The Flaw in Para 1:* Para 1 implies: "What would I desire *at the time of attainment* (or looking back) if I knew the consequences?" If the pig is content, he desires his pig-life.
          *   *The Fix:* "Good on the Whole" = What I would desire *now* (at the present point of time) if I knew all consequences of all lines of conduct.
          *   *Key Shift:* It moves the evaluation point from the *future self* (who might be degraded) back to the *current self* (equipped with perfect knowledge).

  3.  **Address Question 1 & 2: What's wrong with Para 1 and what is the Pig Counterexample?**
      *   *Para 1 Definition:* Good = What I would desire *if I experienced the outcome*. (Implicitly: evaluated from the perspective of the person *in* that state).
      *   *The Problem:* Adaptive Preferences / Degradation. If I choose a path that lowers my standards, my future self will be happy with that lower standard.
      *   *The Pig:* A human chooses to become a pig (metaphorically or literally via drug/experience machine). As a pig, they are content. They don't regret it. Under Para 1, being a pig is "Good" because the desirer (pig-self) desires it.
      *   *Sidgwick's Intuition:* No, it's not Good on the Whole because it destroyed the capacity for higher goods.
      *   *Why Para 1 fails:* It allows the *object* of desire to change in a way that validates a lower state. It relies on the future self's judgment, but the future self might be corrupted.

  4.  **Address Question 3: Does the fix work?**
      *   *The Fix:* Evaluate from the *present* self, but give the present self *perfect foresight* of how their desires will change.
      *   *Does it work?* It solves the "degradation" problem. The present self sees: "If I take this path, I will become a pig and be happy, but I will lose my human capacities." The present self (valuing human capacities) says "No."
      *   *Does it relocate the problem?* Yes, arguably. It relies on the *current* self's values being the anchor. What if the current self is also flawed? Sidgwick assumes the "rational" present self is the authority. But this leads back to the user's CEV skepticism: Who decides which version of "me" is the anchor? Sidgwick anchors it in the *current* rational agent. CEV anchors it in a *hypothetical* convergence.
      *   *User's suspicion:* "Whatever I'd desire 'right now with perfect foresight' seems just as corruptible." Sidgwick would say: If you have *perfect* foresight, you see the corruption. But the user is right that the *values* brought to the table by the "present self" are still arbitrary.

  5.  **Address Question 4: Sidgwick vs. CEV (Yudkowsky/Bostrom etc.)**
      *   *Similarity:* Both reject actual current desires. Both use idealization (more knowledge, better reasoning).
