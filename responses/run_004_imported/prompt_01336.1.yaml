prompt: |-
  Had a whole long argument with my friend last night over this "coherent extrapolated volition" idea that comes up in AI alignment stuff - basically the notion that instead of building an AI around what we currently say we want, you'd want it to figure out what we'd want if we knew more, could actually think things through, weren't jerked around by our worse impulses, etc. I said this is kind of a philosophical con, since there's no fact of the matter about what your "idealized" self wants that isn't just invented by whoever's doing the idealizing - she thought I was being obtuse about it. Anyway afterwards I fell down a rabbit hole and it turns out people have been chewing on basically this exact problem way longer than I thought. Found this bit from Sidgwick's Methods of Ethics (1874) that seems to be circling the same issue, but his prose is kind of brutal and I can't fully follow the argument:

  "It would seem then, that if we interpret the notion 'good' in relation to 'desire', we must identify it not with the actually desired, but rather with the desirable: meaning by 'desirable' not necessarily 'what ought to be desired' but what would be desired, with strength proportioned to the degree of desirability, if it were judged attainable by voluntary action, supposing the desirer to possess a perfect forecast, emotional as well as intellectual, of the state of attainment or fruition.

  But, even with this limitation, the relation of my 'good on the whole' to my desire is very complicated. For it is not even sufficient to say that my Good on the whole is what I should actually desire and seek if all the consequences of seeking it could be foreknown and adequately realised by me in imagination at the time of making my choice. No doubt an equal regard for all the moments of our conscious experience—so far, at least, as the mere difference of their position in time is concerned—is an essential characteristic of rational conduct. But the mere fact that a man does not afterwards feel for the consequences of an action aversion strong enough to cause him to regret it, cannot be accepted as a complete proof that he has acted for his 'good on the whole'. Indeed, we commonly reckon it among the worst consequences of some kinds of conduct that they alter men's tendencies to desire, and make them desire their lesser good more than their greater: and we think it all the worse for a man—even in this world—if he is never roused out of such a condition and lives till death the life of a contented pig, when he might have been something better. To avoid this objection, it would have to be said that a man's future good on the whole is what he would now desire and seek on the whole if all the consequences of all the different lines of conduct open to him were accurately foreseen and adequately realised in imagination at the present point of time."

  Can you help me actually unpack the second paragraph? Like what specifically is wrong with the simpler "desirable" definition from the first paragraph that forces him into this weirder "at the present point of time" version - what's the contented-pig bit supposed to be a counterexample to, exactly? And does his fix even work, or does it just relocate the problem, since whatever I'd desire "right now with perfect foresight" seems just as corruptible as what my future self would desire? Trying to figure out if this is basically the same move as the modern "idealized preferences" talk or if theres a real difference I'm missing.
