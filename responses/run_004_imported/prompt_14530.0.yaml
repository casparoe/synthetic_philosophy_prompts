      *   **Point 3: Re-interpreting IIA (Consistency of Choice).** It's not about ignoring threats; it's about consistency. If you wouldn't pick it, it shouldn't change your mind about what you *would* pick.
      *   **Point 4: The Flaw in Monotonicity.** Monotonicity treats the feasible set as a "menu" rather than a "battlefield." Expanding the set often implies a shift in power that Monotonicity smooths over too nicely. It ignores *why* the set expanded.
      *   **Conclusion:** Summarize. Nash isn't "perfect," but IIA captures the *marginalist* nature of economic exchange better than KS's *proportional* nature.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Rubinstein:* Make sure to specify that Rubinstein converges to Nash *given fixed discount factors*. The limit as $\delta \to 1$ gives the Nash solution with symmetric weights. If discount factors differ, it gives asymmetric Nash. This reinforces Nash, not KS.
      *   *Refining the IIA Defense:* The standard counterexample (Luce/Raiffa) involves a set $S$ and a subset $S'$. If the solution in $S$ is $x$, and $x \in S'$, IIA says solution in $S'$ is $x$. The counterexample says: "But removing $y$ removes my threat to pick $y$!" Response: If $y$ is truly not chosen in $S$, it means $x$ is strictly better for *both* (or at least one without hurting the other). If $y$ was a threat, it should be encoded in the disagreement point $d$, not the feasible set $S$. This is a crucial distinction. IIA applies to the *surplus* set, not the threat point.
