      *   *KS Monotonicity Critique:* If my ideal point goes up (I *could* get more), KS says I *must* get more. But what if my ideal point went up because I took on massive risk? KS ignores risk. Nash (via the curvature of the frontier) incorporates risk attitudes.

  8.  **Final Polish:** Ensure the tone is collaborative ("Here's how to frame this for your piece") rather than lecturing. Use the divorce/wage context the user mentioned.

