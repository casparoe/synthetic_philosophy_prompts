answer: |-
  This is a fantastic angle for a piece. The standard narrative in introductory game theory is indeed that Kalai-Smorodinsky (KS) "fixed" Nash by swapping Independence of Irrelevant Alternatives (IIA) for Monotonicity. The story goes that IIA is counter-intuitive (the "Luce and Raiffa" counterexample) and Monotonicity is obviously fairer.

  But that narrative glosses over *why* Nash built the model that way. If you are writing about negotiation as a strategic process (divorce, wages) rather than arbitration by a benevolent dictator, the defense of IIA is actually much stronger.

  Here is the strongest case for sticking with IIA and viewing Monotonicity with skepticism, broken down into three main arguments: the non-cooperative foundation, the "local vs. global" information problem, and the strategic meaning of the feasible set.

  ### 1. The Non-Cooperative Anchor (The Rubinstein Connection)
  You mentioned hearing about Rubinstein's alternating-offers model. This is the single strongest technical argument for Nash over KS.

  In 1982, Ariel Rubinstein modeled bargaining not as a static axiomatic puzzle, but as a dynamic game: Player A makes an offer, Player B accepts or rejects. If B rejects, B makes a counter-offer next period, but both players discount the future (waiting is costly).

  **The Result:** There is a unique Subgame Perfect Equilibrium. As the time between offers goes to zero (frictionless negotiation), that equilibrium converges **exactly to the Nash Bargaining Solution.**

  It does *not* converge to Kalai-Smorodinsky.

  **Why this matters for IIA:**
  This tells us that IIA isn't just an arbitrary mathematical convenience; it emerges naturally from the logic of strategic delay. In a dynamic negotiation, the "solution" is determined by the marginal cost of waiting versus the marginal gain of holding out.
  *   **Nash/IIA:** Reflects the *local* trade-off at the margin. "If I hold out one more day, I gain X, but risk the deal collapsing." This depends on the slope of the frontier at the agreement point.
  *   **KS/Monotonicity:** Depends on the *global* shape of the frontier (the "ideal point").

  In a real wage dispute, my leverage isn't determined by the theoretical maximum wage the company *could* pay if they went bankrupt (the KS ideal point). It's determined by the cost to them of replacing me *right now* versus the cost to me of being unemployed *right now*. That is a marginal calculation. IIA captures the logic that only the options near the agreement matter for the strategic calculus. Options far away on the frontier (the "irrelevant alternatives") don't enter the backward induction logic of the Rubinstein game.

  If you frame negotiation as a strategic struggle, Nash is the only solution that describes how rational agents actually behave when they have skin in the game. KS describes how a mediator *should* split the pie if they want to be "fair," but not how the parties will split it themselves.

  ### 2. The "Ideal Point" is a Fantasy (Information & Bluffing)
  The KS solution requires knowing the **Ideal Point** (the utopia point): the maximum utility Player 1 could get if Player 2 got their disagreement payoff, and vice versa.

  In a divorce settlement or a wage negotiation, **this information is almost never observable, and it is highly manipulable.**

  *   **The Nash/IIA Advantage:** The Nash solution relies on the shape of the Pareto frontier *near the agreement*. It is a "local" solution. It asks: "Given where we are sitting, what is the trade-off rate?" This is often knowable. (e.g., "If I take $5k more, you have to cut the marketing budget by X%.")
  *   **The KS/Monotonicity Flaw:** To calculate the KS solution, I need to know the absolute maximum I could possibly squeeze out of you. In a negotiation, I have every incentive to lie about this. I will claim my "ideal point" is astronomical to pull the KS ray in my favor.

  IIA creates a solution that is robust to ignorance of the far frontier. It says: "We don't need to know what the theoretical maximum is. We just need to know what trade-offs are available *here*."

  If you remove an option that is far away on the frontier (an "irrelevant alternative"), Nash says the agreement shouldn't change. KS says the agreement *might* change because the "Ideal Point" shifted. But if that option was never going to be picked, why should its mere existence alter the price of the deal we are actually making? IIA argues that anchoring the settlement to a hypothetical maximum (which might be a bluff) is less rational than anchoring it to the actual marginal trade-offs.

  ### 3. Re-interpreting IIA: Consistency vs. Threats
  The standard counterexample against IIA (often attributed to Luce and Raiffa) goes like this:
  *   **Set S:** You can choose (5,5) or (0,8). Nash picks (5,5).
  *   **Set S':** You remove (0,8). Now the only option is (5,5).
  *   **Critique:** In Set S, Player 2 had a "threat" to take (0,8) and hurt Player 1. Removing that threat should change the outcome. Therefore IIA is wrong.

  **The Defense of IIA:**
  This critique conflates the **Feasible Set ($S$)** with the **Disagreement Point ($d$)**.
  In the Nash framework, the "threat" of walking away is encoded in $d$ (the disagreement point), not in the other points in $S$. The points in $S$ are *possible agreements*.

  If (0,8) is in $S$, it means "We agree to a deal where I get 0 and you get 8." It does *not* mean "I will force you to get 0." If Player 2 has the power to force the outcome to (0,8), then (5,5) wouldn't be the Nash solution in the first place; the disagreement point $d$ would be different, or the feasible set would be constrained differently.

  **The Rationality of Consistency:**
  IIA is fundamentally an axiom of **choice consistency**. It says: "If you preferred Apple over Banana when Cherry was on the table, and you didn't pick Cherry, then removing Cherry shouldn't make you switch to Banana."

  If a bargaining solution violates IIA, it is vulnerable to **agenda manipulation**. A clever negotiator could introduce a "decoy" option they know will never be accepted, solely to shift the KS solution in their favor by moving the Ideal Point.
  *   **KS Vulnerability:** I can add a fake, extreme option to the table to shift the "Ideal Point" ray, thereby changing the settlement on the *real* options, even if no one intends to pick the fake option.
  *   **Nash Robustness:** IIA prevents this. If the option isn't going to be chosen, it cannot be used as a lever to change the choice. For a piece on negotiation, this is a powerful point: **Nash prevents "phantom leverage."**

  ### 4. Monotonicity Ignores *Why* the Set Expanded
  The Monotonicity axiom says: If the feasible set expands in a way that helps Player 1 (increases their max potential) without hurting Player 2's max potential, Player 1 should not get *less* utility.

  This sounds obviously fair. But economically, it's suspect.
  *   **Scenario:** Imagine a wage negotiation. The feasible set expands because the company took on a risky new debt to fund higher potential wages.
  *   **KS View:** The worker's "ideal point" (max wage) just went up. Therefore, the worker *must* get a higher settlement.
  *   **Nash/IIA View:** Wait. The *risk* profile changed. The frontier might be flatter now. The company's marginal cost of paying that wage just went up because of the debt service.

  Monotonicity treats the feasible set as a "menu of gifts." It ignores the *structural reasons* why the set changed. Nash, by focusing on the product of gains (which relates to the slope/curvature), is sensitive to *risk aversion* and marginal utility. KS is essentially risk-neutral regarding the shape of the frontier; it only cares about the endpoints.

  In high-stakes divorce or corporate disputes, risk is the whole ballgame. A solution that ignores the curvature of the frontier (in favor of the ideal point) is ignoring the risk preferences of the parties. Nash captures the intuition that "a bird in the hand is worth two in the bush" (concavity); KS is more linear in its logic.

  ### Summary for your Piece
  If you want to push back against the "KS is obviously better" narrative, here is the thesis:

  **Independence of Irrelevant Alternatives is not about ignoring threats; it is about demanding that settlements be based on *realized trade-offs* rather than *hypothetical maximums*.**

  1.  **Strategic Foundation:** Nash is the only solution that arises from dynamic strategic play (Rubinstein). It describes how people *do* bargain, not how an arbitrator *should* split.
  2.  **Information:** IIA makes the solution depend on local information (marginal trade-offs), which is observable. KS depends on global information (ideal points), which is unobservable and easily bluffed.
  3.  **Manipulation:** IIA prevents negotiators from manipulating the outcome by adding decoy options that shift the "Ideal Point" without changing the real value of the deal.

  Kalai-Smorodinsky is a beautiful model of **fair division** (arbitration). But Nash is the superior model of **strategic negotiation**. Since your piece is about the math of negotiation (wages, divorce), the strategic lens is the relevant one. IIA protects the agreement from being held hostage by fantasies about what *could* have been possible.
