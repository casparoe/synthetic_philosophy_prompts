answer: |-
  The room smelled of ozone and old dust. There were no chairs, only a standing rail and a pane of glass that looked less like a window and more like a frozen sheet of water.

  Elias gripped the rail. His knuckles were white. "Is he there?"

  "He is where he always is," the Curator said. She stood in the shadows behind him, her voice flat, administrative. "Sector Four. The path where you boarded the train."

  Elias leaned forward. The glass cleared.

  It was a kitchen. Sunlight, real and golden, poured over a checkered table. A man stood there,背 to the window, pouring coffee. He wore a grey sweater with a hole in the left elbow. Elias looked down at his own arm. He was wearing a grey sweater with a hole in the left elbow.

  The man in the kitchen turned. He had Elias's face. Not a twin's face—*his* face. The same crooked nose, the same scar on the chin from a bicycle accident when he was nine, the same tired lines around the eyes. But the eyes were different. They were rested.

  The man smiled. He wasn't smiling at the window; he was smiling at a woman sitting at the table. Sarah. She was laughing, pushing a plate of toast toward him.

  Elias felt a surge of heat in his chest, a rush of dopamine so sharp it made his knees buckle. He gripped the rail harder. "I did it," he whispered. "I got on the train. I went to the city. I kept her."

  "You didn't," the Curator said.

  Elias didn't turn. He couldn't take his eyes off the man in the grey sweater. The man reached out and touched Sarah's hand. Elias felt the phantom pressure of skin on skin, the warmth of the ceramic mug in a hand that wasn't holding the rail. "Look at him. He has my scar. He has my sweater."

  "He has a scar like yours. He has a sweater like yours," the Curator corrected. "He is a counterpart. A distinct entity occupying a different coordinate of reality. You are here. He is there. The overlap is zero."

  Elias watched the counterpart take a bite of toast. He felt the phantom taste of burnt bread. "It feels like me."

  "Sympathy is not identity," the Curator said. She stepped forward, her shoes clicking on the concrete. "Think of it this way. If a man who looks like you wins the lottery in another city, do you cash the ticket?"

  "This isn't a lottery. This is my life."

  "It is *a* life. One of many. But the consciousness you inhabit is bound to this coordinate. In this world, you missed the train. In that world, he caught it. When he hugs her, your arms do not close. When he sleeps, you do not rest."

  Elias watched the counterpart stand up and walk toward the sink. The man hummed a tune. Elias knew the tune. It was the lullaby his mother used to sing.

  "Why show me this?" Elias asked, his voice cracking. "If I can't have it, why let me feel it?"

  "Perspective," the Curator said. "To help you accept the actual."

  The counterpart in the window turned on the tap. Water splashed. Then, the counterpart winced. He dropped a plate. It shattered. Sarah rushed to him. He was clutching his hand. A shard of ceramic had sliced his palm.

  Elias flinched. He clutched his own right hand against his chest. A sharp, stinging pain bloomed in his palm, though the skin was unbroken. He gasped, doubling over.

  "Stop it," Elias said.

  "Stop what?"

  "The pain. Make it stop."

  "I can do nothing. That is his pain. Not yours."

  Elias straightened up, breathing hard. He looked at his hand. No blood. But the nerve endings were firing, screaming with a memory of injury that hadn't happened. He looked back at the window. The counterpart was wrapping his hand in a towel, grimacing. Sarah was kissing his forehead.

  "He's hurting," Elias said.

  "A stranger is hurting," the Curator insisted. "A stranger who resembles you. If a stranger breaks his leg in the next town, do you limp?"

  "Yes," Elias said. "I do."

  "That is a psychological error. A glitch in your empathy."

  "No," Elias said. He watched the counterpart blow on the cut, his face tight with that specific, private frustration Elias knew so well. The way the eyebrows knit. The way the jaw tightened on the left side. "It's not a glitch. It's a tether."

  "The rules of this facility are based on separation," the Curator said, her voice hardening slightly. "To function, you must understand that you are singular. You are the Elias of this world. The benefits of that world—the success, the love, the warmth—they are not yours. You cannot claim them. But neither are you responsible for the costs. The pain, the loss, the eventual death of that man... that is not your burden. You are free of it."

  Elias stared at the woman in the kitchen. Sarah. In this world, she had left five years ago. She was gone because he hadn't boarded the train. Because he had been afraid.

  In the window, the counterpart finished bandaging his hand. He looked tired. He looked old. Elias realized then that the man in the kitchen had grey in his beard that Elias didn't have yet. Time moved differently, or perhaps the cost of the city life was faster aging. Stress.

  "He looks tired," Elias said.

  "He carries burdens you do not," the Curator said. "Mortgages. Commutes. The fear of losing what you never gained. You are free of that."

  Elias watched the counterpart lean against the counter. The man closed his eyes for a second, just a second, and in that second, Elias saw a profound, crushing weariness. It was the weariness of a man who wonders if he made the right choice, too.

  The Curator's words hung in the air. *You are free of it.*

  If the Curator was right, then the joy Elias had felt moments ago was a lie. It was just watching a movie about a guy who looked like him. And the pain in his hand was a phantom, a trick of the mind. The man in the kitchen was a stranger. A biological coincidence with no metaphysical stake in Elias's soul.

  If that were true, Elias was truly alone. He was locked in this room, in this body, in this failure, with no connection to the version of himself that succeeded. The success wasn't his potential; it was just someone else's actuality.

  Elias looked at his own reflection in the dark edges of the glass.

  "If he's a stranger," Elias said quietly, "then why do I love her?"

  "Who?"

  "Sarah. In there. I love her. I feel it in my throat."

  "You love the memory of the Sarah who is gone from *this* world. You are projecting."

  "I'm not." Elias pressed his palm against the glass. It was cold. "If he's just a stranger, then my regret is pointless. Regret means *I* could have done otherwise. If I couldn't have done otherwise... if that's just some other guy..."

  Elias trailed off. He looked at the counterpart, who was now laughing again, shaking off the pain, pulling Sarah into a hug. The pain in Elias's hand faded, replaced by a hollow ache in his chest.

  The Curator waited. She expected him to step back. To accept the safety of his singularity. To accept that he was safe from the pain of that other life, but also exiled from its joy.

  Elias didn't step back.

  "He's me," Elias said.

  "Technically—"

  "I don't care about the technical." Elias watched the counterpart rest his chin on Sarah's head. "If I say he's a stranger, then nothing matters. Then I'm just meat in a chair watching a screen. But I feel the cut. I feel the sun."

  "Feeling is not being."

  "Isn't it?" Elias turned to look at her for the first time. His eyes were wet. "You want me to believe that I am only this body, here, now. That the rest is fiction. But if I'm only here... then I never really had a choice. I just ended up here."

  He turned back to the window. The counterpart was walking out of the kitchen, hand in hand with Sarah. They were leaving the frame.

  "I need it to be me," Elias said. "Because if it's not me, then I didn't lose her. I just never had her. And if I never had her, even in another world... then I'm not a man who made a mistake. I'm just a man who was never capable of being the one who stayed."

  The glass began to darken. The image of the kitchen faded into grey static.

  "Session complete," the Curator said.

  "Wait," Elias said. He reached for the fading light.

  "It is over. You must return to your coordinate."

  Elias stood alone in the dim room. The ozone smell was gone, replaced by the stale air of his own reality. His hand throbbed, a ghost of a cut that didn't exist.

  He looked down at his palm. Smooth. Unbroken.

  He curled his fingers into a fist, holding onto the pain. It was the only proof he had that the other man was real. That the other man was *him*.

  "Did he make it home okay?" Elias asked the empty room.

  The Curator did not answer. There was no rule for caring about a stranger.

  Elias walked to the door. He opened it, stepping out into the hallway of the world where he had missed the train. He walked slowly, favoring his right hand, carrying a weight that belonged to a man who wasn't there, protecting a wound that no one else could see.
