  **Justification of Scores:**

  *   **Move 1 (M): 2.** M correctly articulates the standard "infinitarian paralysis" objection. In classical total utilitarianism, if the background value is infinite, adding finite value yields no change in the total sum ($\infty + n = \infty$), rendering the theory action-guidingly inert. This is a widely accepted formal problem in infinite ethics.
  *   **Move 2 (K): 2.** K proposes the standard "causal difference" or "expectational" fix (associated with philosophers like Hilary Greaves). By evaluating acts based on the finite difference they make within the agent's light cone rather than the global sum, action-guidance is restored. This is a viable technical solution for decision-making, even if it modifies the axiology.
  *   **Move 3 (M): 2.** M correctly identifies the theoretical cost. Classical Total Utilitarianism is an axiology (a theory of which *worlds* are better), not just a decision procedure. Restricting evaluation to local causal impact shifts the theory toward a hybrid view or act-consequentialism that ignores the "total" state of the universe, conceding that the *world* itself isn't necessarily better.
  *   **Move 4 (K): 0.** K claims that ignoring the infinite background is "nothing new" compared to finite cases. This is mathematically contentious. In finite arithmetic, background constants cancel out cleanly; in infinite set theory, the result depends on the order of summation (Riemann rearrangement). K understates the discontinuity between finite and infinite ethics here.
  *   **Move 5 (M): 2.** M raises the "infinite duplicates" objection (often linked to the "Eternal Return" or modal realism). If infinite agents make the same choice, the *aggregate* causal impact is still infinite, reviving the summation problem for any theory claiming to evaluate the *total* good. M successfully corners K: either accept paralysis for the global view or admit the theory is no longer "Total" Utilitarianism.

  **Important Considerations Not Raised:**

  *   **Axiology vs. Decision Theory:** The debate conflates whether we need a theory of the *Good* (ranking worlds) or the *Right* (ranking acts). K's fix works for the Right, while M's critique targets the Good. A hybrid view might accept K's decision procedure while admitting M's point that the world's total value is undefined.
  *   **Measure Theory:** Some approaches (e.g., using measure theory rather than cardinality) attempt to define "more good" in infinite contexts without relying on simple sums, potentially bypassing the duplicate problem.
  *   **Spatiotemporal Discounting:** K hints at causal boundaries, but explicit temporal or spatial discounting (valuing nearer welfare more) is another distinct solution that avoids infinite sums entirely, though it violates strict impartiality.
  *   **The "Expanding Value" View:** Some theorists argue value is not a static sum but a process, which changes how infinite futures are evaluated compared to static totalism.
