      *   Expert read? Yes, need to ensure the correction on Pareto and the Scope is accurate.

      *Self-Correction on Pareto:* In Social Choice, the condition is often called the "Pareto Principle" or "Weak Pareto." Definition: If for all individuals $i$, $x P_i y$, then $x P_{social} y$. The student wrote: "If some other ranking would satisfy at least one voter's preferences better without satisfying any other voter's preferences worse..." This is the definition of a Pareto *Improvement* in welfare economics, not the Arrow axiom. It's a subtle but important distinction in a technical course. I will deduct for this.

