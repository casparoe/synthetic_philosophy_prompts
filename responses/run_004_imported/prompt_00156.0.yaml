              *   *So where is the advantage?* The advantage is that Woodward admits **context-sensitivity** and **model-relativity**. He doesn't claim there is one "True Causation" fact independent of the variable set. Lewis claims there is a mind-independent fact.
              *   *Wait, that's a metaphysical difference, not a technical solution to preemption.*
