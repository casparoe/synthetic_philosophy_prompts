      *   *Key Point:* Lewis needs to argue that the *event* of shattering is different if Suzy does it vs. Billy. Woodward just needs to show that the *variable* representing Suzy's throw is part of an invariant generalization connecting to the shattering variable, *given the actual values of the other variables*.
      *   *Wait, one nuance:* Woodward insists that for $X$ to cause $Y$, there must be an intervention on $X$ that changes $Y$. In late preemption, if we intervene on $S$ (set to 0), $E$ doesn't change (because $B$ saves it). So strict interventionism *also* fails late preemption *unless* we adopt the **path-specific** or **actual causation** modification (holding off-path variables fixed).
      *   *Crucial:* I must admit that *strict* Woodwardian interventionism (type-level) struggles with token-level preemption just like Lewis. The advantage comes when Woodward incorporates the **SEM/Actual Causation** framework (like Hitchcock 2001). Woodward endorses this direction. I need to make sure I don't attribute H&P's formalism entirely to Woodward, but show how Woodward's *framework* accommodates it better than Lewis's *metaphysics*.
      *   *Better angle:* Woodward's account is inherently **contrastive** and **model-relative**. Lewis seeks a **context-independent** fact. In preemption, the "cause" status depends on which variables you include (e.g., including the "mid-air" variable). Woodward says "That's fine, causation is relative to the model." Lewis says "No, causation is real, so I must tweak the definition of events."
      *   *Decision:* Focus on the **Holding Fixed** capability. Lewis's similarity semantics makes it hard to hold specific facts fixed without miracles. Interventionism (via SEMs) makes it a formal operation.

