      *   **Conclusion:** Interventionism buys you a formal toolkit (SEMs) to isolate causal paths that Lewis's similarity semantics handles only through metaphysical maneuvering (Influence/Quasi-dependence).

  5.  **Refine the Technical Details:**
      *   Make sure to distinguish between Woodward's 2003 book and the Halpern/Pearl formalism (which Woodward is sympathetic to but isn't exactly the same). Stick to Woodward's core claims about *invariance* and *modularity*.
