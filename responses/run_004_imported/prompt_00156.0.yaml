              *   Test $S$: Set $S=0$. If we let $B$ run, $H_B=1, E=1$. No dependence.
              *   *Interventionist Fix:* Test $S$ while holding $H_B$ fixed at 0 (its actual value). If $S=0$ and $H_B=0$, then $E=0$. Dependence found!
              *   *Lewis's Problem:* Lewis cannot easily "hold fixed" an intermediate event in a counterfactual antecedent without creating a miracle or violating laws. His similarity metric prioritizes avoiding miracles over holding specific facts fixed.
              *   *Woodward's Advantage:* Interventions are defined *within a model*. We can mathematically "cut" the arrow from $B$ to $H_B$ or fix $H_B$ by stipulation within the testing procedure (path-specific dependence). This is formally cleaner than Lewis's "quasi-dependence" or "influence."

