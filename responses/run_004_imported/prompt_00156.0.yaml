      *   **Introduction:** Acknowledge the similarity (both are dependence theories) but state the thesis: The difference lies in *locality* and *model-relativity* vs. *global similarity*.
      *   **Lewis on Late Preemption:** Explain the failure of simple counterfactuals. Explain the "Influence" fix (2000). Critique: It relies on fine-graining events (shattering *at t* vs. shattering). It's fragile.
      *   **Woodward on Late Preemption:** Explain the SEM framework (variables, equations). Explain the "Holding Fixed" strategy (Path-Specific Dependence). We hold the *backup path* fixed at its actual (inactive) value.
      *   **The "Buy":**
          1.  **Locality of Intervention:** Lewis compares whole worlds (global). Woodward wiggles variables in a system (local). This allows Woodward to isolate the active path without "waking up" the dormant backup cause.
          2.  **Explicit Structure:** Woodward forces you to model the *blocking* mechanism (why Billy's rock didn't hit). Lewis treats it as a fact about world similarity.
          3.  **De Facto Dependence:** Woodward (following Hitchcock) allows dependence relative to a fixed background (holding $H_B=0$). Lewis's semantics makes this difficult because holding $H_B=0$ while setting $S=0$ might require a "miracle" in the closest world analysis.
