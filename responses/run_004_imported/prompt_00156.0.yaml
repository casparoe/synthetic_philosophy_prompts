      *   *Lewis's Struggle:*
          *   Simple counterfactual: $\neg S \square\rightarrow \neg E$? False. (Because if $\neg S$, then $B$ causes $E$).
          *   Lewis's 1986 move: Stepwise dependence. $S \rightarrow H_S \rightarrow E$. Does $H_S$ depend on $S$? Yes. Does $E$ depend on $H_S$? Yes.
          *   *The Catch:* In late preemption, does $E$ depend on $H_S$? If Suzy's rock hadn't hit *in that specific way*, would the bottle still have shattered (by Billy)? Yes. So stepwise dependence fails too.
