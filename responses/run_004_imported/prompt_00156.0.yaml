          *   *Why does this matter for Preemption?* Because Lewis needs to *save* the counterfactual dependence. Woodward doesn't need dependence between the *events* simpliciter; he needs dependence between the *variables* in the model *under the right conditions*.
          *   *The "Holding Fixed" Move:* In SEM accounts of preemption (which Woodward supports), we evaluate the cause by holding the *backup* cause fixed at its *actual* value (which might involve a "witness" world).
          *   *Let's check the literature:* Woodward (2003) discusses preemption. He argues that interventionism handles it better because it distinguishes between **potential** and **actual** causes via the structure of the model.
