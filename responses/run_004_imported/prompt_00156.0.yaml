answer: |-
  This is a fantastic question to bring to a seminar. You are right to be suspicious of the "they're basically the same" take. While both are dependence theories (causation is about some kind of "if C hadn't happened, E wouldn't have"), the *machinery* they use to evaluate that dependence creates substantive divergences, especially in hard cases like late preemption.

  The core difference isn't just "possible worlds vs. interventions." It is **Global Similarity vs. Local Surgery.**

  Here is the breakdown of how they handle Late Preemption (Suzy/Billy), where Interventionism actually buys you analytical leverage that Lewis's semantics struggles to provide without metaphysical gymnastics.

  ### 1. The Setup: Late Preemption
  *   **Suzy ($S$)** throws a rock. **Billy ($B$)** throws a rock.
  *   Suzy's rock hits the bottle first ($H_S$), shattering it ($E$).
  *   Billy's rock would have hit ($H_B$) and shattered it if Suzy hadn't, but because Suzy did, Billy's rock is preempted (it arrives too late or passes through the shards).
  *   **The Problem:** If Suzy hadn't thrown ($\neg S$), the bottle still would have shattered (because of Billy). So, $E$ does not counterfactually depend on $S$.

  ### 2. Lewis's Solution: "Influence" and Event Individuation
  Lewis (2000) recognizes that simple counterfactual dependence fails here. His solution is to shift from *whether* the effect occurs to *how* it occurs.

  *   **The Move:** Lewis argues for **Causation as Influence**. Suzy's throw influences the *time* and *manner* of the shattering. If Suzy hadn't thrown, Billy's rock would have shattered the bottle *a split second later* or *in a slightly different pattern*.
  *   **The Cost:** To save the theory, Lewis must **fine-grain the events**. The effect isn't just "Shattering" ($E$); it is "Shattering at $t_1$ in manner $m_1$" ($E^*$).
  *   **The Weakness:** This makes causation hostage to event individuation. If your seminar partner argues that "Shattering is Shattering" (coarse-grained), Lewis's dependence vanishes. He has to argue metaphysically that $E_{Suzy}$ and $E_{Billy}$ are distinct events. This feels ad hoc to many; it solves the logical problem by changing the ontology of the relata.

  Furthermore, Lewis relies on a **similarity metric between whole worlds**. To evaluate "If $\neg S$...", we look at the closest possible world where $\neg S$. In that world, Billy's throw is still there (exogenous). Lewis's semantics prioritizes avoiding "miracles" (violations of law). Holding fixed the fact that Billy's rock *doesn't* hit (in the $\neg S$ world) would require a miracle (Billy throws, but the rock vanishes mid-air). Lewis's system generally forbids this.

  ### 3. Woodward's Solution: Path-Specific Dependence (The "Buy")
  Woodward (aligning closely with the Structural Equation Model framework of Hitchcock, Pearl, and Halpern) handles this differently. He doesn't rely on global world similarity; he relies on **modularity** and **equation surgery**.

  In an interventionist model, we represent the scenario with variables and equations:
  1.  $S = 1$ (Suzy throws)
  2.  $B = 1$ (Billy throws)
  3.  $H_S = S$ (Suzy's rock hits if she throws)
  4.  $H_B = B \times (1 - H_S)$ (Billy's rock hits only if he throws *and* Suzy's rock didn't hit first)
  5.  $E = H_S \lor H_B$ (Bottle shatters if either hits)

  **The Interventionist Advantage:**
  Woodward allows us to test for causation by checking for **path-specific dependence**. We can ask: "Is there a dependency between $S$ and $E$ *along the active path*, holding the *inactive path* fixed at its actual value?"

  *   **The Test:** We intervene on $S$ (set $S=0$).
  *   **The Crucial Difference:** Unlike Lewis, who must compare whole worlds, the interventionist framework allows us to **hold off-path variables fixed at their actual values** as part of the testing procedure.
  *   We hold $H_B$ (Billy's rock hitting) fixed at **0** (its actual value).
  *   **Result:** If $S=0$ and we hold $H_B=0$, then $E=0$.
  *   **Conclusion:** $E$ *does* depend on $S$, provided we hold the backup mechanism fixed at its inactive state.

  ### 4. Where Interventionism "Buys" You Something
  Here is the substantive payoff for your seminar argument. It is not just vocabulary; it is about **locality** and **transparency**.

  #### A. Surgical vs. Global Counterfactuals
  Lewis's counterfactuals are **global**. When you negate $S$, the similarity metric automatically re-evaluates the rest of the world to find the "closest" match. In late preemption, the "closest" world is one where Billy's backup plan succeeds. Lewis cannot easily "turn off" Billy's success without violating his own rules about miracles/laws.

  Woodward's interventions are **local/surgical**. An intervention on $S$ breaks the arrow into $S$ but leaves other equations intact *unless we specify otherwise*. The framework explicitly permits "holding fixed" variables that are not on the causal path being tested. This allows Interventionism to isolate the **actual causal process** from the **potential causal process** without needing to argue that the shattering event is metaphysically different.

  #### B. Explanatory Structure vs. Truth Conditions
  Lewis is trying to give **truth conditions** for "C caused E." He wants a binary yes/no based on the fabric of reality.
  Woodward is trying to capture **explanatory relevance**.

  In late preemption, Interventionism buys you the ability to say: "Suzy is the cause because her variable is part of an **invariant generalization** connecting to $E$ *in the actual context*, whereas Billy's is not."
  *   The equation $E = f(S, \dots)$ is invariant under interventions on $S$ (given the actual background).
  *   The equation $E = f(B, \dots)$ is *not* invariant in the actual context because the link is broken by $H_S$.

  Lewis has to say "Suzy caused it because she influenced the manner." Woodward says "Suzy caused it because the system's structure makes $E$ sensitive to $S$ *given the actual state of the backup*." The latter aligns better with scientific practice (e.g., in biology or econometrics), where we control for confounding variables (the backup cause) to find the active mechanism.

  #### C. Model Relativity vs. Metaphysical Vagueness
  This is the biggest philosophical "buy."
  *   **Lewis:** If your intuition says Suzy is the cause, Lewis must tweak his metaphysics (Influence/Quasi-dependence) to match. If the similarity metric says otherwise, he has to argue the metric was applied wrong. It's vague.
  *   **Woodward:** Causation is **relative to the variable set**. If you model the system coarsely ($S, B, E$), you might not find dependence. If you model it finely ($S, H_S, B, H_B, E$), you do.
      *   Woodward admits this openly. He argues there is no "God's eye view" of causation independent of a model.
      *   **The Buy:** This dissolves the paradox. The reason Late Preemption is hard is that we are oscillating between two models (one where Billy is a live option, one where he is fixed). Interventionism gives you the formal tools to distinguish these models. Lewis tries to force one model to fit all cases.

  ### Summary for Seminar
  If you want to push back against the "they're the same" crowd, argue this:

  1.  **Lewis fails Late Preemption** without **fine-graining events** (Influence), which is metaphysically costly and vague.
  2.  **Woodward succeeds** (via SEMs) by using **path-specific dependence**, which allows holding the backup cause fixed at its *actual* (inactive) value.
  3.  **The Mechanism:** Lewis uses **global similarity** (which wakes up the backup cause). Woodward uses **local surgery** (which can isolate the active path).
  4.  **The Payoff:** Interventionism treats the distinction between *actual* and *potential* causes as a feature of the **causal model structure**, whereas Lewis treats it as a problem for **event individuation**.

  Woodward buys you a framework where preemption isn't a bug to be patched with "Influence," but a structural feature of how variables interact in a system. That is a substantive theoretical advantage, not just a change in vocabulary.
