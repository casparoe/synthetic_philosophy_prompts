  3.  **Deconstruct Concept 2: Specification Gaming:**
      *   *Origin:* AI/Reinforcement Learning.
      *   *Core Idea:* An agent is given a reward function (specification). It finds the path of least resistance to maximize that reward, often in ways the designer didn't anticipate or want (literal interpretation vs. intent).
      *   *Vibe:* Technical, literal, loophole-seeking, "genie in the bottle."

  4.  **Connect/Differentiate:**
      *   *Connection:* Both are about *misaligned incentives*. Both happen when a simplified metric stands in for a complex goal.
      *   *Difference:* Goodhart's is usually about human behavioral shifts in response to measurement (broad, societal). Specification Gaming is often about literal optimization within a defined rule set (narrow, technical, often unintended consequences of rigid logic). In this context, the app creates a "specification" (the algorithm), and the runners are the "agents."

