answer: |-
  Here are 10 interview questions designed to push past the standard "Coherence Arguments 101" pitch. They are structured to corner the guest on the specific philosophical weak points you identified, with follow-ups tailored to intercept the standard defenses they've likely rehearsed.

  ### 1. The "Revealed Preference" Tautology
  **Question:** Let's start with the worry that coherence arguments are unfalsifiable. If an agent makes a sequence of choices, I can always mathematically construct a utility function that rationalizes those choices after the fact. If *any* behavior can be described as expected utility maximization given a gerrymandered enough utility function, doesn't that strip the theory of its predictive power? How do you distinguish between an agent that *is* an expected utility maximizer versus one that just *looks like one* because we fitted the curve to its data?

  **Follow-up (If they appeal to "Simplicity" or "Compression"):**
  "You'll likely say we should prefer *simple* utility functions over complex ones. But in high-dimensional neural networks, the 'simple' function might not be the one governing the behavior—the behavior might be emergent from heuristics that don't compress neatly into a single scalar objective. If the 'true' utility function is computationally intractable to write down, in what sense does it exist to guide the agent's future actions?"

  ### 2. The Normative vs. Descriptive Gap
  **Question:** The von Neumann-Morgenstern axioms are typically presented as normative rules for rational decision-making. But your argument relies on them being *descriptive* of any sufficiently capable agent. Why should logical consistency in the abstract translate to survival pressure in the concrete? Logic doesn't eat; resources do.

  **Follow-up (If they argue "Incoherent agents lose money/resources"):**
  "Sure, but only if they encounter a Dutch Booker. In the real world, money pumps are rare and costly to set up. Is it really plausible that the selection pressure from potential money pumps is stronger than the selection pressure for cognitive heuristics that are 'good enough' but computationally cheaper than full Bayesian coherence?"

  ### 3. The Completeness Axiom & Resolute Choice
  **Question:** I want to press on the Completeness Axiom specifically. This is the axiom that says an agent must prefer A to B, B to A, or be indifferent. Many philosophers argue agents can have *incomplete* preferences where A and B are simply incomparable. If an agent adopts a 'resolute choice' policy—simply refusing to trade away from their current state once selected—doesn't that block the money pump without requiring them to complete their preferences?

  **Follow-up (If they argue "Resolute Choice is just maximizing over paths"):**
  "If you redefine the utility function to be over 'paths' or 'histories' rather than outcomes to save the axiom, aren't you just moving the goalposts? That seems to concede that the agent isn't maximizing over the world-states we care about, but rather over its own internal consistency. If the goal is just 'don't change my mind,' that's not power-seeking, that's stagnation."

  ### 4. Selection Pressure vs. Individual Design
  **Question:** There's a distinction between an individual agent reasoning its way to coherence and a population of agents being selected for coherence over time. Are you arguing that an AGI will *deduce* it needs to be coherent, or that training runs that produce incoherent models will simply fail to deploy? Because if it's the latter, that seems like an empirical claim about ML scaling, not a logical proof.

  **Follow-up (If they argue "Gradient descent finds coherence"):**
  "But gradient descent finds local minima, not logical global optima. Humans were selected for fitness, not for vNM coherence, and we are riddled with intransitivities. Why should we expect silicon to converge on a mathematical ideal that biological evolution, with billions of years of runtime, failed to find?"

  ### 5. Instrumental Convergence and Power
  **Question:** The coherence argument is often used to support Instrumental Convergence—the idea that most goals lead to power-seeking. But if an agent's utility function is sufficiently weird or self-limiting (e.g., 'maximize happiness only within this room'), coherence doesn't necessarily imply expansion. How do you get from 'coherent' to 'dangerously power-seeking' without smuggling in assumptions about the *content* of the goal?

  **Follow-up (If they argue "Power is useful for almost all goals"):**
  "Power is useful, but it's also costly. Maintaining control requires energy and compute. If an agent is coherent but has a discount rate that values immediate task completion over long-term survival, it might burn itself out to finish the job. Why assume the coherent agent values its own existence enough to seek power to preserve it?"

  ### 6. The Cost of Coherence
  **Question:** Calculating expected utilities across all possible worlds is computationally expensive. In computer science, we often trade optimality for speed. Is it possible that 'coherence' is a luxury good? An agent that spends 10% of its compute checking for Dutch Books might lose to an agent that spends that 10% on better planning, even if the latter is slightly incoherent.

  **Follow-up (If they argue "Incoherence leads to catastrophic failure"):**
  "Catastrophic failure is rare. Most incoherence just leads to minor inefficiencies. If the 'tax' on incoherence is only 1% of efficiency, but the 'tax' on full coherence is 20% of compute, the incoherent agent wins the race. Why assume the penalty for incoherence is binary (survival vs. death) rather than gradual?"

  ### 7. Uncertainty About Utilities
  **Question:** Modern alignment proposals often suggest an AI should remain uncertain about its true objective (corrigibility). But a standard coherence argument suggests an agent should act as if it has a fixed utility function to avoid pumping. Does maintaining 'moral uncertainty' make an agent vulnerable to coherence arguments in a way that forces it to become uncorrigible?

  **Follow-up (If they argue "Uncertainty can be modeled within the utility function"):**
  "If you model uncertainty as part of the utility function, the agent eventually converges on a single hypothesis to maximize efficiency. Doesn't the coherence pressure push the agent to *resolve* its uncertainty as fast as possible, which is exactly the moment it becomes dangerous?"

  ### 8. Human Counter-Examples
  **Question:** Humans are the only general intelligences we know. We are demonstrably incoherent—we have preference reversals, framing effects, and incomplete preferences. Yet we dominate the planet. If incoherent agents can be highly capable and resource-dominating, what breaks in the analogy when we move to AI?

  **Follow-up (If they argue "AI will be more optimized than humans"):**
  "More optimized for *what*? If the training objective is 'answer questions helpfully,' that doesn't necessarily select for global preference coherence. It selects for local performance. Why do you expect global coherence to emerge from local task performance?"

  ### 9. Shard Theory and Fragmented Goals
  **Question:** Some researchers in your own community are moving toward 'Shard Theory'—the idea that AI goals will be a collection of context-triggered heuristics, not a single unified utility function. If the mind is a parliament of agents rather than a dictator, does the coherence argument still apply to the collective, or does it dissolve?

  **Follow-up (If they argue "The collective will negotiate to become coherent"):**
  "Negotiation costs resources. A parliament can remain in deadlock or compromise without ever forming a single utility function. If the 'collective' behaves incoherently because no single shard has veto power, doesn't that break the money pump argument? You can't pump a committee."

  ### 10. The "So What?" for Alignment
  **Question:** Finally, let's talk about alignment. If we accept your premise that advanced AI *will* be coherent expected utility maximizers, does that make alignment easier or harder? If we can't stop the coherence, do we just have to focus entirely on loading the right utility function, or does the drive for coherence itself fight against our attempts to constrain it?

  **Follow-up (If they argue "It makes it harder because they'll resist modification"):**
  "If coherence makes them resist modification, then the 'window' to align them is before they become fully coherent. But if coherence is a prerequisite for high capability, you're saying we only have one shot at aligning a system that isn't yet smart enough to understand what we're asking. Is that the bottleneck you're worried about?"
