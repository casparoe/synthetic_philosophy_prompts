  Ok so this happened in my group chat over the weekend and I can't stop thinking about it, partly because my philosophy elective (small school, we get weird electives, don't ask) had literally just finished a unit on vagueness and the sorites paradox a few days before. My friend Devon said the guy from his situationship went completely silent for 6 days after they'd made actual plans, and Devon called it getting "ghosted." My other friend Marcus said 6 days isn't ghosting, thats just being busy, real ghosting is like weeks minimum. Devon said there's no official rulebook so Marcus doesn't get to just decide that, and it kind of spiraled from there into a whole logic argument, which I'm going to lay out move by move because honestly neither of them seemed totally wrong to me:

  (1) Marcus said there's actually no such thing as a fixed "ghosting" line at all -- everyone just uses the word whenever THEY personally feel ignored, so it doesn't really refer to anything specific, and Devon calling 6 days "ghosted" is just Devon being dramatic. (2) Devon said that's a cop-out -- there's obviously a real difference between someone busy for a day and someone who vanishes for a month after making plans, and nobody agreeing on the exact hour doesn't mean the word means nothing, same as how nobody can give you the exact height where a hill becomes a mountain but mountains are still real. (3) Marcus said fine, then name the exact hour it switches over -- if Devon can't, then for a case like day 6 there's no answer to whether it counts, so "I got ghosted" isn't true OR false, it's just undefined, which seems bad for a word Devon's using like it obviously means something. (4) Devon admitted day 6 might genuinely be unclear but said that doesn't mean every case is -- day 1 obviously isn't ghosting, day 60 obviously is, and a word can have a blurry middle and still work fine for the clear cases, same as how "red" is still a real color even though there's a fuzzy zone between red and orange. (5) Marcus said that fuzzy zone IS the problem -- Devon's saying there's a case where it's neither true nor false that he got ghosted, and that just breaks logic, since every statement's supposed to be true or false, so if your view needs a third option maybe the view is broken, not logic. (6) Devon said maybe logic doesn't get final say over how real words work since words are for communicating, not obeying a rulebook, and that assuming there HAS to be one exact secret hour where it flips, we just can't know which, is honestly weirder than what he's saying, since that would mean there's a precise instant you officially got ghosted that literally nobody, not even a mind reader, could ever pin down.

  Neither of them backed down, and when they both turned to me to settle it I genuinely had no idea. Can you go through the exchange move by move, (1) through (6), and say who had the better argument each time -- not just who wins overall, since I think they're each right about some stuff and wrong about other stuff? Also flag it if either of them is missing some obvious option they didn't consider. and im kind of curious, is this an actual unsettled debate among philosophers or is there a standard answer that one of them is just missing? Put your overall verdict on its own line at the very end, just "Marcus," "Devon," or "Tie," so I can screenshot it into the chat.
