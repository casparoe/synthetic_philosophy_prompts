      *   **The Fresnel/Maxwell Case:** This is the crown jewel of SR. The equations survived the death of the ether.
      *   **The Counter-Cases (Phlogiston/Caloric):** Did structure survive here?
          *   *Phlogiston:* Negative mass? Conservation principles? It's harder to find direct mathematical continuity compared to Fresnel.
          *   *Caloric:* Heat flow equations (Fourier) survived, but the substance didn't. This is actually a strong SR case, often overlooked by critics.
      *   **The Newman Objection:** If all we claim is that the world has *some* structure isomorphic to our theory, that's trivial (Newman, 1928). To avoid triviality, we need to constrain *which* relations count (natural vs. arbitrary). But doing so seems to reintroduce ontology/nature of properties, undermining pure structuralism.
      *   **ESR vs. OSR:**
          *   *ESR (Worrall):* We *know* structure, objects are unknowable.
          *   *OSR (Ladyman/French):* There *are* no objects, only structure.
          *   *The "Relations without Relata" problem:* Intelligibility issue.

  3.  **Formulate the Thesis/Stand:**
