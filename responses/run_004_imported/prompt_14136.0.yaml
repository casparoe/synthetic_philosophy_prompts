answer: |-
  Here is a sequence of 10 chained questions designed to corner the "negative epistemic" move. The strategy is to start with phenomenology (where she is strong), move to causation/neuroscience (where your background gives you leverage), pivot to epistemology (where the "indistinguishability" claim creates a paradox), and end on ontology and falsifiability (where the "no positive nature" claim becomes vulnerable).

  ### Phase 1: The Phenomenal & Causal Challenge

  **Q1. The Phenomenal Match**
  "Let's start with the phenomenology. You argue that in the 'good case' (veridical perception), the nature of the experience is constituted by the external object itself. But in the 'bad case' (hallucination), the subject reports the exact same 'what-it's-like.' If the phenomenal character is identical from the first-person perspective, doesn't that suggest a common mental kind, even if the *causes* differ? Why isn't the shared phenomenology enough to establish a common factor?"

  *   **Predicted Answer:** She will likely say phenomenology isn't self-intimating regarding its own metaphysical nature. Just because they *seem* the same doesn't mean they *are* the same kind of state.
  *   **Follow-up:** "So you're saying the subject's own access to their experience is misleading about the fundamental kind of state they are in? If the 'feel' of the experience doesn't track the metaphysical nature of the experience, what work is the phenomenology actually doing in your theory?"

  **Q2. The Argument from Illusion (Classic)**
  "Let's apply that to the classic Argument from Illusion. When I see a bent stick in water, the stick isn't actually bent. The common factor theorist says I'm aware of a sense-datum or a representational content that *has* the property of bentness. You reject that. But if the bentness isn't in the stick, and you deny I'm aware of an intermediate mental object with that property, where is the 'bentness' located in the veridical-like experience? How do you parse the apparent property without positing a common mental intermediary?"

  *   **Predicted Answer:** She will argue that in the illusion case, you are still related to the real stick, but the *conditions* are misleading. There is no 'bent thing' you are aware of, only a failure to perceive the straight stick correctly.
  *   **Follow-up:** "But if I'm not aware of anything 'bent'—not the stick, not a sense-datum, not a representation—then what explains the specific error? Why do I see *bent* and not *blue* or *loud*? If there's no positive content fixing that specific appearance, isn't the specificity of the illusion mysterious?"

  **Q3. The Causal Screening-Off Worry**
  "Let's move to the causal story, which is where my cognitive science background butts in. We know that direct cortical stimulation can produce a visual experience subjectively identical to seeing a tomato. If the proximate neural cause in the hallucination case is sufficient to produce the experience, doesn't that screen off the distal object (the real tomato) in the veridical case? If the brain state is sufficient for the experience in Case B, why isn't that same brain state the sufficient basis for the experience in Case A?"

  *   **Predicted Answer:** She will claim that the neural state is merely a *causal precondition* in the good case, not the *constitutive nature* of the experience. The object itself is doing the explanatory work of the phenomenology.
  *   **Follow-up:** "But if the neural state is identical in both cases, and the neural state is sufficient to generate the report 'I see a tomato' in the hallucination, what specific explanatory work is left for the external tomato to do? It looks like the tomato is a fifth wheel."

  **Q4. Charles Bonnet & Clinical Reality**
  "Take this further with Charles Bonnet syndrome. Patients with eye damage have vivid, complex hallucinations generated entirely by internal neural dynamics. They know they aren't real, yet the perception is robust. Here we have a 'bad case' with a fully described positive neural nature. If you admit these patients have a positive mental state driven by the brain, why can't we just say the 'good case' is that same positive state, plus a causal link to an object? Why must the fundamental *kind* be different?"

  *   **Predicted Answer:** (The Dodge) "Because the hallucination is defined negatively. It's just a state that is indistinguishable from seeing. It has no nature other than failing to be perception."
  *   **Follow-up:** "That's the move I want to press. You're saying the hallucination has *no* positive nature, despite the fact that we can point to specific hyperactivity in the visual cortex causing it. Are you claiming that neuroscience is describing the *cause* but not the *mental state*? How can a mental state have a robust neural correlate but no positive psychological nature?"

  ### Phase 2: The Epistemic & Internalist Challenge

  **Q5. Ordinary Illusions (The Middle Ground)**
  "Before we leave the nature of the state, where do ordinary illusions fit in this binary? Take the Müller-Lyer illusion. The lines look different lengths. I am perceiving the lines (so it's not a hallucination), but the property I perceive (different lengths) isn't there (so it's not fully veridical). Is this a third disjunct? Or is it a hallucination of length grafted onto a perception of lines? Your two-way split seems to leave no room for the messy middle where most perception lives."

  *   **Predicted Answer:** She will likely try to fold this into the 'good' disjunct, arguing you are perceiving the lines, just under conditions that mislead.
  *   **Follow-up:** "If I'm perceiving the lines veridically, but the *length* is hallucinated, doesn't that imply a common factor of 'length-representation' that is shared between the illusion and a full hallucination? If you admit a common factor for length, why not for the whole object?"

  **Q6. Higher-Order Self-Knowledge**
  "Let's pivot to the subject's knowledge. You say the two states are metaphysically distinct kinds. But by definition, the subject cannot introspectively tell them apart. If I am currently having a visual experience, and I cannot know via introspection whether I am in the 'relational' disjunct or the 'hallucinatory' disjunct, how do I know what kind of mental state I am in right now? Doesn't this violate the idea that we have privileged access to our own minds?"

  *   **Predicted Answer:** She will argue we have access to the *appearance*, just not the *metaphysical grounding*. I know I seem to see, not that I *do* see.
  *   **Follow-up:** "But if the 'what-it's-like' is identical, and the 'what-it's-like' is all I have access to, then for all practical and epistemic purposes, the distinction is invisible to the subject. Why should a theory of mind privilege a distinction that makes no difference to the subject's inner life?"

  **Q7. Factive Warrant**
  "Here is the epistemic consequence. You claim that in the good case, I have factive warrant—I can know *p* because I see *p*. But if I can't introspectively distinguish the good case from the bad case, I can never be sure I possess that factive warrant. If I can't tell if I'm in the position to know, do I really have the warrant? Or do I just have a belief that *might* be warrant?"

  *   **Predicted Answer:** She will say the warrant is externalist. I have it even if I don't know I have it, just like I can know a clock is reliable without knowing its internal mechanics.
  *   **Follow-up:** "In the clock case, I can check the mechanics. In the perception case, you've told me the internal mechanics (the phenomenology) are identical in the broken and working versions. If the 'internal check' always returns 'inconclusive,' isn't 'factive warrant' just a label you're applying after the fact, rather than something the subject actually possesses?"

  ### Phase 3: Ontology & Falsifiability

  **Q8. The "No Positive Nature" Trap**
  "I want to return to your definition of hallucination. You've said a few times that hallucinations have 'no positive nature' and are defined purely by their indistinguishability from perception. If a mental state has no positive nature—no representational content, no relational object, no intrinsic qualitative character other than 'not seeing'—in what sense is it a mental state at all? Is it a state of the subject, or just a failure of a state?"

  *   **Predicted Answer:** (The Dodge again) "It's a state of the subject, but its nature is exhausted by its epistemic relation to the good case. It's a primitive notion."
  *   **Follow-up:** "If it's a primitive notion that relies entirely on its relation to the good case, doesn't that make the 'good case' the only real explanatory posit in your theory? Isn't disjunctivism just monism about perception plus a denial that hallucinations exist as genuine states?"

  **Q9. Explanatory Power vs. Taxonomy**
  "Following on that: In cognitive science, we posit states to explain behavior. If a subject reaches for a hallucinated cup, we explain that via a positive representational state guiding motor output. If you say the hallucination has no positive nature, what explains the behavior? Are you saying your theory is purely metaphysical taxonomy, with no commitment to explaining how the mind actually processes the hallucination to produce action?"

  *   **Predicted Answer:** She will separate the *metaphysical* nature from the *causal* explanation. "I can allow neural causes explain behavior without conceding the mental kind is the same."
  *   **Follow-up:** "But if the neural cause explains the behavior and the phenomenology, and the neural cause is the same in both cases, what is the 'mental kind' doing? It seems you're protecting a metaphysical distinction that has been rendered explanatorily redundant by the neuroscience."

  **Q10. Falsifiability (The Closer)**
  "Final question. If the hallucination is defined negatively, the phenomenology is identical, the neural causes can be identical, and the behavior is identical: What finding would count as evidence *against* disjunctivism? If neuroscience finds a perfect NCC (Neural Correlate of Consciousness) that matches in both cases, you say that's just causal. If phenomenology matches, you say that's just epistemic. Is there any empirical or phenomenological data that could convince you that the Common Factor theorists are right, or is this insulated from refutation?"

  *   **Predicted Answer:** She might say it's a philosophical thesis about the *logic* of perception, not an empirical one.
  *   **Follow-up:** "If it's a thesis about the logic of perception that is compatible with all empirical data looking exactly like the Common Factor theory predicts, aren't we just debating labels for the exact same universe? What work is the 'Disjunctive' label doing if the world looks exactly Common?"
