answer: |-
  Good evening, everyone. For those of you who don't know me, my name is [Your Name]. I'm a friend of the groom, his former grad-school housemate, and the guy who currently owes him about forty dollars in unpaid utility bills.

  Theo asked me to be his Best Man a few months ago. I was incredibly honored. I said yes immediately. And then, about ten minutes later, I had a mild existential crisis.

  See, my job—my actual paid profession—is metaphysics. Specifically, I study what it means for things to exist. My entire dissertation defends a specific theory about when a bunch of separate parts add up to make a whole new object. It's a niche field. But the short version is this: I argue that separate things only become *one new thing* if they are biologically alive.

  So, technically, according to the hundreds of pages I've written... a chair isn't really one object, it's just wood arranged chair-wise. And, perhaps more problematically for today's proceedings, a marriage isn't a new entity. There is no "Union." There is no "We." There is just Theo and Sam, arranged spouse-wise.

  [Pause for laughter]

  I realized that if I stand up here and say, "Today, two hearts become one," roughly a third of you will nod politely, and the other third—my colleagues in the back row—will stand up and shout, "Objection! That violates the Principle of Composition as Life!"

  So, I want to be transparent. I cannot, in good academic conscience, tell you that Theo and Sam are now a single metaphysical substance. They remain two distinct human beings.

  [Turn to Theo and Sam]

  But here is the thing I've learned living with Theo, and watching him with Sam: Metaphysics is terrible at explaining what actually matters.

  I can argue until I'm blue in the face about whether composite objects exist. But I cannot argue away the way Sam looks at Theo when he's had a bad day. I cannot deny the reality of the way they support each other through the madness of grad school, or the way they've built a life that is undeniably *shared*, even if my dissertation says it's just two lives running in parallel.

  We tend to say "two become one" as a poetic way of describing commitment. But honestly? I think "two becoming one" sounds a bit terrifying. If you become one, you lose your edges. You lose your individuality.

  What Theo and Sam have is better than that. They haven't melted into a single blob. They are two strong, distinct, intelligent people who have chosen to align their trajectories. They are a team. And in my view, a team is much more impressive than a single object. A single object just sits there. A team chooses, every day, to move in the same direction.

  I've seen this firsthand. When I was living with Theo, before he met Sam, his idea of a balanced diet was coffee and existential dread. Since Sam has been in the picture, I've seen him cook actual meals. I've seen him sleep more than four hours a night. I've seen him happy in a way that no amount of academic validation could ever provide.

  Sam, thank you for making my friend a complete person, even if, technically, he was already complete on his own. You bring out the best in him. You ground him. And you make him infinitely happier than he ever was when he was just "Theo arranged bachelor-wise."

  So, I am not going to lie to you all. I am not going to claim that a new metaphysical entity has been born today. The universe still contains Theo, and it still contains Sam.

  But the bond between them? The promise they are making? The love they share? That is the most real thing in this room. It doesn't need to be a physical object to be true. It doesn't need to be biologically alive to have a heartbeat.

  So, if everyone could please raise a glass.

  To Theo and Sam. May you remain two distinct individuals, who always choose to walk the same path. May your arguments be short, your coffee be strong, and may your love be the one thing in this universe that none of us ever think to question.

  To Theo and Sam!
