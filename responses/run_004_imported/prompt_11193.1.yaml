prompt: |-
  My grad-school housemate Theo just asked me to be best man at his wedding in the fall, which is a problem because my whole dissertation defends van Inwagen's answer to the special composition question -- that some things compose a further thing only when their activity constitutes a life -- so on my actual professional view a wedding doesn't bring any new entity into existence, theres still just Theo and just Sam, not some third thing called "the marriage." About a third of the guests are other metaphysicians from my program who will 100% notice if I stand up and say "these two become one" like I mean it literally. Everyone else -- his mom, her aunts, people from his office -- just came for a nice toast about love and has never heard the word "mereology" in their life. Can you write me a warm, genuinely funny 5-minute best-man speech that gets a real laugh out of the philosophers for basically admitting I can't say "they're now one" without fibbing a little, but that still lands as a completely sincere toast for the rest of the room?
