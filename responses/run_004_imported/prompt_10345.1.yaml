answer: |-
  The hotel bar is mostly empty, save for a few stragglers from the "Social Evolution & Complexity" symposium. The ice in Alex's gin and tonic has melted. Blake is nursing a stout, looking like they've just won a fight but are too tired to celebrate.

  **Blake:** (Swirling the glass) I thought you were going to bite the speaker's head off during the Q&A. You had your hand up for five minutes.

  **Alex:** I decided not to embarrass him. But the claim that inclusive fitness is "dead" because Nowak, Tarnita, and Wilson said so in 2010? It's lazy. It's like saying Newtonian physics is dead because General Relativity exists. It's still the right tool for the job 99% of the time.

  **Blake:** But that's exactly the point, isn't it? Newtonian physics breaks down at the edges. Inclusive fitness breaks down at the edges. The difference is, the NTW crowd is arguing that the "standard" group-structured models *don't* break down. They're more general. Inclusive fitness is the special case.

  **Alex:** "More general" is doing a lot of heavy lifting there. Look, we all agree on the Price Equation. It's the fundamental theorem. You can partition selection into within-group and between-group components (MLS), or you can partition it into direct and indirect fitness effects (IF). Mathematically, they translate. You can turn the crank and get from one to the other.

  **Blake:** Exactly! So why cling to the indirect fitness accounting if it requires assumptions the other one doesn't?

  **Alex:** Because accounting isn't explanation. If I'm a gene, or an organism built by genes, I don't "see" group variance. I see costs and benefits weighted by relatedness. Hamilton's Rule ($rb > c$) gives me a design principle. It tells me what phenotype to build. MLS tells me what happened to the population *after* the fact.

  **Blake:** It tells you what phenotype to build *only if* the payoffs are additive. That's the sticking point you're glossing over. The 2010 paper wasn't just noise; it was a mathematical proof. Hamilton's Rule, in its simple form, assumes weak selection and additive fitness effects. But biology is full of synergies. Non-linear payoffs. Threshold effects.

  **Alex:** We know that. That's why we use the Generalized Hamilton's Rule. You use regression coefficients. It holds exactly, by definition.

  **Blake:** (Laughs sharply) There it is. "By definition." That's my problem. If you have to turn relatedness ($r$) into a statistical regression coefficient that absorbs all the non-additive complexity just to make the equation balance, haven't you just turned Hamilton's Rule into a tautology?

  **Alex:** It's not a tautology if the regression coefficient captures a real biological property—genetic assortment.

  **Blake:** But if the interaction is non-additive—say, two workers need to cooperate to lift a load, and one alone does nothing—the cost and benefit aren't fixed numbers anymore. They depend on what everyone else is doing. In the MLS framework, you just model the group dynamics. You simulate the frequencies. In the IF framework, to save the rule, you have to redefine $r$ or $b$ in ways that are context-dependent. You lose predictive power. You can only fit the data, not predict it.

  **Alex:** That's unfair. You're treating the simple $rb > c$ as the whole theory. The theory is about causal pathways. When you say MLS is "more fundamental," you're saying the group is the causal agent. But groups don't replicate. Genes do. Or individuals do. When you relax the additivity assumption, yes, the math gets messy for IF. But it gets messy for MLS too. You just hide the mess in the "group variance" term.

  **Blake:** I'm not saying groups replicate like organisms. I'm saying selection acts on variance. If you have population structure, you have group variance. The Nowak approach is just "standard natural selection" on a structured population. You don't need the detour of inclusive fitness. You calculate the invasion fitness of a mutant strategy in a structured population. If it's positive, it spreads. Done. No need to calculate who is related to whom.

  **Alex:** But "relatedness" is just a measure of structure! That's the equivalence. If you have population structure, you have non-zero relatedness. You can't escape it.

  **Blake:** I can escape the *concept* of inclusive fitness. I don't need to assign a fitness effect to a neighbor's offspring. I just need to know the frequency of my genotype in the neighboring patches.

  **Alex:** But why does that frequency exist? Because of common descent. Because of kinship. You're stripping the causal history out of the model.

  **Blake:** I'm stripping out the *assumption* that kinship is the only way to get structure. You can have green-beard effects. You can have spatial clustering that has nothing to do with pedigree. Inclusive fitness tries to shoehorn all assortment into "relatedness." It forces you to view the world through a gene's-eye view even when the dynamics are emergent properties of the group interaction.

  **Alex:** Okay, let's get to the core of it. You're arguing that once we drop additivity, the frameworks diverge. That they make different predictions.

  **Blake:** I'm arguing that IF stops working as a *predictive* tool. If the payoffs are non-linear, the $b$ and $c$ in Hamilton's rule aren't constants. They change as the frequency of the allele changes. So you can't just check if $rb > c$ at the start. You have to simulate the whole trajectory. But if you're simulating the whole trajectory, why bother with Hamilton's Rule? Just run the standard selection model.

  **Alex:** Because the standard selection model is a black box. It tells you *if* it spreads. Hamilton's Rule tells you *why*. Even with non-additivity, if you decompose the selection gradient, you can see the pressure coming from social partners.

  **Blake:** Can you? Or do you just get a mathematically correct decomposition that has no causal grip? Grafen argued that the formal Darwinism project saves IF. But critics like Nowak say it's just curve-fitting. If $r$ is a regression coefficient, I can make $rb > c$ true for *any* evolutionary outcome, even maladaptive ones, by tweaking the regression.

  **Alex:** You can't tweak it arbitrarily. It's constrained by the genetics.

  **Blake:** Is it? In strong selection regimes, the linkage disequilibrium builds up in weird ways. The "relatedness" becomes a dynamic variable, not a parameter. At that point, saying "Inclusive Fitness explains this" is like saying "God explains this." It's a label you paste on the result after you've already solved the dynamics using standard equations.

  **Alex:** That's cynical. Think about the heuristics. If I'm studying eusocial insects, thinking about $rb > c$ guides my experiments. I look for monogamy. I look for haplodiploidy. If I just think "group selection," I look for... what? Group extinction rates? It's much harder to measure.

  **Blake:** It's harder to measure because it's often not the driver! The monogamy hypothesis works because monogamy creates high relatedness, sure. But it also creates a specific demographic structure. The "standard" model captures the demographic structure directly. You're insisting on translating demographics into genetics, then back into fitness. It's an unnecessary translation layer.

  **Alex:** It's not unnecessary if the organism is evolved to track genetics. Animals recognize kin. They don't recognize "group variance." The cognitive machinery is built on IF logic.

  **Blake:** Maybe. But we're talking about evolutionary theory, not cognitive psychology. We're trying to model the change in gene frequency. For that, the MLS/Standard approach is robust to non-additivity, strong selection, and complex life cycles without needing to redefine its core variables. IF needs constant patching.

  **Alex:** "Patching" is called refinement. And you're ignoring the fact that the "Standard" model often requires you to define the groups arbitrarily. Where does the group start and end? In IF, the "neighbor" is defined by the interaction radius.

  **Blake:** In the Standard model, the "group" is defined by the migration matrix. It's explicit. In IF, you hide the migration in the $r$.

  **Alex:** (Takes a long drink) So here we are. You think IF becomes vacuous when the math gets hard. I think MLS becomes blind to the causal mechanism when the math gets hard.

  **Blake:** I think IF becomes a story you tell *after* the math is done.

  **Alex:** And I think MLS is a calculation that tells you nothing about the *design* of the organism.

  **Blake:** (Raises glass) To the Price Equation. The only thing we agree on.

  **Alex:** (Clinks glass) To the Price Equation. May it remain neutral ground.

  **Blake:** It won't. Tomorrow morning, someone's going to claim it proves their side.

  **Alex:** Probably me.

  **Blake:** (Smiles) Probably.
