answer: |-
  This is a fantastic angle for a longread, but you should definitely scrap the hypothesis that it was a "separate hobby" or that Sidgwick was a "credulous sucker." In fact, the opposite is true: **his psychical research was a direct, desperate extension of his ethical philosophy.**

  If you frame it as a quirk, you miss the tragic, driving tension at the heart of Sidgwick's life and work. The "ghost hunting" wasn't a break from his rationalism; it was an attempt to save his rationalism from collapsing under its own weight.

  Here is the actual link between *The Methods of Ethics* and the Society for Psychical Research (SPR), and why it matters for your piece on Effective Altruism.

  ### 1. The Problem: The Dualism of Practical Reason
  To understand the SPR, you have to look at how *The Methods of Ethics* (1874) ends. It doesn't end with a triumphant declaration of utilitarian duty. It ends in what Sidgwick called the **"Dualism of Practical Reason."**

  Sidgwick argued that reason dictates two equally rational but often conflicting paths:
  1.  **Rational Benevolence (Utilitarianism):** Maximize the general good, even at cost to yourself.
  2.  **Rational Self-Interest (Egoism):** Maximize your own happiness.

  In a purely secular, materialist universe, there is no logical guarantee that being moral will lead to your own happiness. In fact, often it won't. If I sacrifice my life to save five strangers, I have acted morally, but I have acted against my self-interest. If death is the end, the egoist is arguably being *more* rational than the utilitarian.

  Sidgwick found this conclusion devastating. He wrote that if he couldn't resolve this dualism, he couldn't go on living. He needed a way to prove that **virtue and self-interest are ultimately harmonized.**

  ### 2. The Solution: Empirical Theology
  Sidgwick was a Victorian empiricist. He didn't want to rely on religious dogma (which he couldn't believe) or pure metaphysical speculation (which he couldn't prove). He wanted **evidence.**

  This is where the SPR comes in. He didn't join to see cool ghosts; he joined to find **empirical proof of an afterlife.**
  *   If you can scientifically prove that consciousness survives death...
  *   And if you can prove that there is a moral order in that afterlife (i.e., good deeds are rewarded, bad deeds punished)...
  *   ...then Rational Self-Interest and Rational Benevolence converge. It becomes rational to be good, because you will be compensated for your sacrifices in the long run.

  For Sidgwick, psychical research was **"empirical theology."** It was an attempt to use the scientific method to secure the religious sanctions for morality that traditional religion had lost the authority to provide.

  ### 3. He Wasn't Credulous; He Was a Skeptic
  Your assumption that he was a "credulous sucker" is a common misconception, partly because "ghost hunting" sounds silly to modern ears. But in the 1880s, investigating telepathy or mediumship was considered by many intellectuals (including William James) as a legitimate frontier of science.

  More importantly, Sidgwick was the **skeptic-in-chief** of the SPR.
  *   He was notoriously difficult to fool.
  *   He spent decades investigating the medium Eusapia Palladino. While some SPR members were convinced, Sidgwick remained cautious and critical, famously exposing frauds and demanding rigorous controls.
  *   He didn't start with belief; he started with a hypothesis he *needed* to be true but couldn't find sufficient data to confirm.

  He wasn't looking for magic; he was looking for a fact that would solve his ethical crisis. He ultimately died without finding the proof he needed, remaining in a state of agnostic longing.

  ### 4. Why This Matters for Effective Altruism
  This history is gold for your longread because it highlights a tension that modern EA often tries to gloss over: **The Motivation Problem.**

  *   **The EA View:** Modern EA is largely secular. It argues you should help others because it's the rational, impartial thing to do.
  *   **The Sidgwickian Warning:** Sidgwick shows us that pure secular rationalism has a hard time explaining *why* an individual should sacrifice their own well-being for the abstract "greater good" if there are no cosmic consequences.

  Sidgwick tried to use science (psychical research) to bridge the gap between "is" and "ought." Modern EA tries to bridge it through preference utilitarianism or moral realism. But Sidgwick's struggle shows that the desire for a "moral universe" is deeply ingrained, even in the most hyper-rational philosophers.

  ### Summary for your narrative
  Don't frame it as "Philosopher by day, ghost hunter by night." Frame it as:
  **"Sidgwick built a rigorous ethical system that demanded self-sacrifice, realized it had no rational foundation in a materialist universe, and spent 20 years trying to use science to prove the universe wasn't materialist so his ethics would make sense."**

  It makes him more human, more tragic, and philosophically more coherent. It transforms the SPR from a embarrassing hobby into the key that unlocks the deepest anxiety in Victorian utilitarianism.
