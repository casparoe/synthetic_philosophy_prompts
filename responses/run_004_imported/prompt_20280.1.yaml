answer: |-
  This is a sophisticated dispute that cuts to the heart of contemporary metaethics. Your intuition that your friend's response was too quick is well-founded; the move from "Wrong Kind of Reasons" (WKR) to "Object-Given vs. State-Given Reasons" is one of the most contested maneuvers in the literature. While it is the standard defensive line for Buck-Passing Accounts (BPA), it is rarely regarded as a "solved problem" in the sense of dissolving the worry without residue.

  Here is a reconstruction of why the object-given/state-given distinction is widely suspected of failing to secure the reductive ambitions of BPA, followed by an analysis of the epistemic parallel.

  ### Part 1: The Circularity Worry and the Object/State-Given Distinction

  Your friend's claim is that we can filter out the demon's threat by noting it is a *state-given* reason (a reason grounded in the benefits of having the attitude) rather than an *object-given* reason (a reason grounded in the properties of the object). They argue this is non-circular because "source of the reason" is a metaphysical or structural fact, not a value fact.

  The objection you struggled to articulate is that **the distinction between "object-given" and "state-given" cannot be drawn neutrally without presupposing the very normative notion of value (or fittingness) it is meant to analyze.**

  Here are the three main prongs of that objection:

  #### 1. The Reformulation Problem (The "Property" Objection)
  The most technical objection, advanced by philosophers like Conor McHugh and Jonathan Way, is that the distinction is syntactically unstable.
  *   **The Friend's View:** The demon's threat is a consequence of admiring him, not a property of him.
  *   **The Counter:** Any state-given reason can be reformulated as an object-given property. The demon has the property: *being such that admiring him will prevent torture.* This is a relational property of the demon. If the BPA says "Goodness = Reasons to favor based on object properties," the demon's threat counts, because it is a property of the demon.
  *   **The Implication:** To block this, the BPA theorist must say, "No, only *relevant* object properties count." But once you introduce a filter for *relevant* properties, you are no longer analyzing value in terms of reasons alone; you are analyzing it in terms of reasons plus a selection criterion for properties. That selection criterion invariably looks like: "properties that make the attitude *fitting*." If "fitting" is a normative notion, the reduction has failed.

  #### 2. The Normative Relevance Problem (The "Source" Objection)
  Even if we grant a metaphysical distinction between the object and the consequences of the attitude, why does that metaphysical distinction track the *normative* distinction?
  *   **The Worry:** The BPA aims to reduce value to reasons. But to solve WKR, it must say: "Value is constituted by *this specific subset* of reasons (object-given)."
  *   **The Circularity:** Why *that* subset? The answer is usually: "Because those are the reasons that respond to the value of the object." But if you need the notion of "responding to value" to identify the reasons that constitute value, the analysis is circular.
  *   **Smuggling Value:** By sorting reasons by "source," you are implicitly sorting them by "value-relevance." You are effectively saying, "Reasons that come from value-making features are the right kind." But since the BPA is supposed to tell us *what* value-making features are (by pointing to the reasons), you cannot use value-making features to filter the reasons. Your friend claims the filter is "where the reason comes from." But unless "where it comes from" is cashed out in purely non-normative terms (which the Reformulation Problem suggests it can't be), the filter itself is normative.

  #### 3. The Hieronymi Challenge (Reasons *For* vs. Reasons *To*)
  Pamela Hieronymi (2005) offered a influential dissolution of WKR that attempts to save the BPA, but it highlights the circularity risk. She argues that pragmatic reasons (like the demon's threat) are not reasons *for* admiring the demon; they are reasons *to bring it about that you admire* the demon.
  *   **The Move:** If pragmatic reasons aren't reasons *for* the attitude, they don't enter the BPA equation ($X$ is good iff there are reasons *to favor* $X$).
  *   **The Cost:** To make this stick, you need an account of what makes something a reason *for* an attitude rather than a reason *to cultivate* an attitude. Hieronymi argues this turns on whether the reason bears on the "correctness conditions" of the attitude.
  *   **The Circularity Return:** What are the correctness conditions of admiration? That the object is *admirable*. If you define the "right kind of reason" as "reasons that bear on whether the object is admirable," you have defined value (admirability) in terms of reasons, but defined the relevant reasons in terms of value (admirability). The reduction collapses.

  #### Is there a way to draw the line without stipulation?
  To avoid this, a BPA theorist must provide a **non-normative taxonomy of reasons**.
  *   **Constitutivism:** One promising route is constitutivism. One argues that admiration is *constitutively* aimed at the admirable, just as belief is aimed at truth. Therefore, reasons that don't bear on the aim are structurally excluded.
  *   **The Hurdle:** This works only if the "aim" can be specified without using value terms. For belief, "truth" is arguably non-normative (or at least distinct from "goodness"). For admiration, specifying the aim without saying "the good" or "the valuable" is notoriously difficult. If the aim is "the fitting," and fittingness is normative, we are back to square one.

  **Summary for your argument:** Your friend is treating "object-given" as a metaphysical bucket that is normatively neutral. The counter-argument is that "object-given" is a *normative classification* disguised as a metaphysical one. We only count certain object-properties as "the right kind" because we already know they are value-relevant. Therefore, the analysis presupposes value rather than reducing it.

  ---

  ### Part 2: The Epistemic Parallel (Evidentialism and Pascal's Wager)

  Your secondary question is insightful. The structural parallel is strong, but there are disanalogies that make the epistemic case easier to defend than the ethical one.

  #### Structural Identity
  Yes, Pascal's Wager is the epistemic WKR.
  *   **Ethics:** Demon threatens torture unless you admire him. (Practical reason to admire $\neq$ Admirability).
  *   **Epistemology:** Pascal's Wager offers salvation if you believe God exists. (Practical reason to believe $\neq$ Evidence for truth).
  *   **Evidentialist Response:** Just as the BPA theorist restricts value to "object-given reasons," the Evidentialist restricts justification to "evidential reasons" (truth-indicators).

  #### Why the Belief Case Might Be Different
  While structurally isomorphic, the *resources* available to solve the problem differ significantly.

  **1. The Nature of the "Object"**
  *   **In Ethics:** The "object-given" reasons are supposed to be features like *wit, courage, kindness*. These are **thick concepts**. They are descriptive but laden with normative weight. It is hard to separate the "reason-giving force" of kindness from its "value."
  *   **In Epistemology:** The "object-given" reasons are **evidence** (sensory data, logical entailments, probabilistic relations). These are widely regarded as capable of being specified in non-normative terms (e.g., Bayesian probability relations). It is easier to say "Evidence is probability-raising" without smuggling in "justification" than it is to say "Value-making features are X" without smuggling in "goodness."

  **2. Transparency and Constitutive Aims**
  *   **Belief:** Belief is "transparent." When I deliberate about whether to believe $P$, I look at the world, not at my belief. This supports the claim that practical reasons are structurally incapable of being reasons *for belief*. They are reasons to *act* (e.g., take a pill to induce belief).
  *   **Pro-Attitudes:** Admiration and Desire are less transparent. I can deliberate about whether to desire something based on its benefits (e.g., "I should desire this job because it pays well"). This blurs the line between "reason for the desire" and "reason to cultivate the desire." If the line is blurrier in ethics, the WKR is harder to dissolve.

  **3. The Normative Status of the Aim**
  *   **Truth:** Many philosophers argue truth is a normative goal, but it is not a *moral* or *value* goal in the same sense. One can have evidence for a trivial or even terrible truth.
  *   **Value:** The "aim" of admiration is the *admirable*. The admirable is a subset of the *good*. If you analyze the good in terms of reasons to admire, and reasons to admire in terms of the admirable, the circle is tighter. In epistemology, you can analyze justification in terms of evidence, and evidence in terms of probability, without necessarily invoking "epistemic value" (though some argue you do).

  #### Conclusion on the Parallel
  The problems are **structurally the same**, but the epistemic case is **metaphysically easier**.
  *   In epistemology, we have a clearer independent grip on "evidence" (probability support) that allows us to filter out pragmatic reasons without circularity.
  *   In metaethics, we lack an independent grip on "value-making properties" that doesn't already invoke value.

  Therefore, while your friend is right that the *strategy* (restricting the kind of reasons) is the same in both fields, they are wrong to imply that the *success* of the strategy in epistemology guarantees its success in metaethics. The ethical case suffers from a lack of non-normative vocabulary to describe the "right kind" of reasons, whereas the epistemic case can lean on formal relations of probability and truth.

  ### Summary for Your Next Dinner
  You can tell your friend that the "object-given" move fails to be reductive because the criterion for selecting object-given reasons (excluding the demon's threat property) inevitably relies on a prior distinction between *value-making* and *non-value-making* features. Unless they can specify "object-given" using purely non-normative vocabulary (which the Reformulation Problem suggests is impossible), they are defining value in terms of reasons, and reasons in terms of value. Regarding belief: admit the structure is identical, but note that evidence is easier to naturalize than value, making the Evidentialist escape route less available to the Buck-Passer.
