      *   *The Proposed Solution:* Restrict to "right kind" of reasons (RKR). Define RKR as "object-given" (properties of the object) vs. "state-given" (properties of the attitude/state).
      *   *The Circularity Charge:* Why is "object-given" not neutral?
          *   *Argument A (The Extensional Equivalence Problem):* Any state-given reason can be reformulated as an object-given reason. (e.g., "The demon threatens torture" $\rightarrow$ "The demon is such that admiring him avoids torture." That's a property of the demon.)
          *   *Argument B (The Normative Relevance Problem):* Even if we successfully distinguish sources, *why* do only object-given reasons count towards *value*? To say "only properties of the object count towards its goodness" looks suspiciously like saying "only properties that make it good count towards its goodness."
          *   *Argument C (The 'Fittingness' Regress):* BPA tries to reduce value to reasons. But to filter reasons, we need a notion of "fittingness" or "correctness." If fittingness is normative, haven't we just pushed the value back a step?
