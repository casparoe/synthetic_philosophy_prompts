          *   *Pluralist:* Dupré/Ereshefsky-style. Believes "species" is a heterogeneous category. Different concepts suit different purposes (conservation, phylogenetics, ecology). No single "true" answer.
      *   **Tone:** Intellectual but accessible, engaging back-and-forth (not just opening statements), feeling like a real debate.
      *   **Specifics:** Must reference the Oriole case (1973 lump, 1995 split, 2020 genomics). Should potentially bring in harder cases (ring species, asexuals) to stress-test the theories.
