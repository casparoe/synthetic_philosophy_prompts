prompt: |-
  I am part of a small reading group that has been alternating between classic papers in value theory and material from the AI alignment literature, and a recent session paired Eliezer Yudkowsky's 2004 essay on coherent extrapolated volition (CEV) with two older papers on idealized-preference accounts of well-being that we had read months earlier. Nobody in the group had drawn the connection before, but once it was pointed out it seemed hard to unsee: CEV cashes out what a superintelligent AI should be built to want as, roughly, what humanity would converge on wanting if we knew more, thought faster, and had in some sense matured further together, with the initial dynamic meant to act on points where individual volitions show strong "coherence" and to hold back wherever they show significant "spread" or "muddle." That is structurally the same idealizing move that Brandt, Railton, and others proposed for individual well-being decades earlier, defining a person's good in terms of what their fully informed, fully rational counterpart would want them to want.

  The two papers we read were David Sobel's "Full Information Accounts of Well-Being" and Connie Rosati's "Persons, Perspectives, and Full Information Accounts of the Good," and both argue that this idealizing move is far less innocent than it looks. Sobel's worry is that there may be no coherent way to construct a single, determinate "fully informed and rational" advisor in the first place, since the available ways of building one, such as having it live through every alternative option from the inside versus judging them from the outside on propositional information alone, tend to generate inconsistent or radically incomplete verdicts rather than one authoritative verdict. Rosati's worry is different: even granting a well-defined idealized counterpart, it is unclear why that counterpart's preferences should be authoritative for, or even meaningfully continuous with, the actual person's good, given how alien from the actual person the idealized version might become.

  I would like to know what you take to be the most important implications of these two objections for CEV specifically, as distinct from their implications for the individual-level theories of well-being they originally targeted. Does moving from idealizing a single person to idealizing all of humanity at once, and building in machinery for tolerating spread rather than forcing convergence, give CEV real resources for escaping either worry, or does it just relocate the same problems to a higher, harder-to-inspect level, trading a mysterious individual ideal advisor for an even more mysterious collective one? And if the objections survive largely intact, is there a way of weakening or reformulating CEV that would blunt them without discarding what made CEV an attractive alignment target in the first place?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** A reading group pairing Eliezer Yudkowsky's *Coherent Extrapolated Volition* (CEV) with idealized-preference accounts of well-being (specifically Sobel's "Full Information Accounts of Well-Being" and Rosati's "Persons, Perspectives, and Full Information Accounts of the Good").
      *   **Observation:** The group noticed a structural similarity: CEV idealizes human volition (know more, think faster, mature together) just as idealized-preference theories idealize individual well-being (fully informed, rational counterpart).
      *   **The Objections:**
          *   *Sobel:* Indeterminacy/Incoherence. There might not be *one* coherent idealized advisor (experience vs. proposition, etc.).
          *   *Rosati:* Alienation/Authority. The idealized self might be too alien to the actual self to be authoritative or continuous.
      *   **The Question:** What are the implications of these objections *specifically for CEV* (distinct from individual well-being)?
          *   Does scaling to humanity + tolerance for "spread" solve these problems?
          *   Or does it just relocate them to a collective level?
          *   If they survive, can CEV be weakened/reformulated to blunt them without losing its alignment appeal?

  2.  **Analyze CEV vs. Individual Idealized Preference:**
      *   *CEV Definition:* "Coherent Extrapolated Volition." Our wishes if we knew more, thought faster, were more the people we wished we were, had grown up farther together. The AI should do what this extrapolated volition *would* tell it to do. Crucially, it looks for *coherence* among human volitions and extrapolates *that*, holding back where there is *spread*.
      *   *Individual Idealized Preference:* What I would want if I were fully informed/rational.
      *   *Similarity:* Both rely on counterfactual idealization to determine normativity (what *should* be done/what is *good*).
      *   *Difference:* CEV is collective and explicitly acknowledges potential divergence ("spread"). Individual theories usually seek a determinate answer for *the* good.

  3.  **Address Sobel's Objection (Indeterminacy/Incoherence) in the CEV Context:**
      *   *Sobel's Point:* How do you construct the ideal advisor? Experiential vs. Propositional? Different paths yield different results.
      *   *CEV Application:* CEV asks for the extrapolation of *humanity's* volition.
      *   *Does "Collective" help?* Maybe. Aggregation might smooth out individual indeterminacies. If Person A's ideal self is ambiguous, but Person B's is clear, and they converge...
      *   *Does "Spread Tolerance" help?* CEV says "if there's spread, don't force convergence." This seems to address the *result* of indeterminacy (don't act on it) but not the *process* of finding the coherent part.
      *   *The Deep Problem:* The *extrapolation process itself* is underspecified. "Think faster," "know more," "mature." How? Sobel's worry applies to the *function* $f(\text{humanity})$. Is $f$ well-defined? If different idealization procedures yield different "Coherent Volitions," CEV fails to pick a unique target.
      *   *Conclusion on Sobel:* It relocates the problem. Instead of "What is *my* ideal self?", it's "What is the *collective* ideal self?" The "coherence" clause tries to dodge the indeterminacy by saying "only act where it's coherent," but determining *whether* it's coherent requires running the extrapolation, which suffers from the same construction ambiguities Sobel identified.

  4.  **Address Rosati's Objection (Alienation/Authority) in the CEV Context:**
      *   *Rosati's Point:* The ideal self might be so different from the actual self that its preferences don't feel like *mine*. Why should I care what Super-Me wants?
      *   *CEV Application:* Why should current humanity care what Extrapolated Humanity wants?
      *   *Does "Collective" help?* Possibly reduces alienation if the "collective" includes me. But if Extrapolated Humanity decides to eliminate death, suffering, or individuality (classic transhumanist tropes), current humans might feel alienated.
      *   *The "Mature Together" Clause:* CEV emphasizes growing up *together*. This is a direct counter to Rosati. It tries to ensure continuity of social fabric and shared values.
      *   *The Deep Problem:* Radical cognitive enhancement ("think faster") + Moral progress ("mature") might still lead to a state incomprehensible to current humans. If CEV optimizes for what we *would* want, not what we *now* want, it risks the "Sorcerer's Apprentice" or "Friendly AI turns us into paperclips (but happy ones)" scenario.
      *   *Conclusion on Rosati:* The "grow up together" clause is a specific patch for Rosati's worry, but it's not a proof. The alienation risk remains high if the extrapolation distance is large.

  5.  **Synthesize: Does CEV Escape or Relocate?**
      *   It largely *relocates* and *complicates* the problems.
      *   Sobel's indeterminacy becomes the "Reference Class Problem" + "Extrapolation Function Problem."
      *   Rosati's alienation becomes the "Lock-in/Value Drift Problem."
      *   The "Coherence/Spread" mechanism is a safety valve, not a solution to the definition of the ideal.

  6.  **Develop Reformulations/Weakenings:**
      *   *Goal:* Keep alignment appeal (AI does what we *should* want, not just what we *do* want) but reduce metaphysical/epistemic burden.
      *   *Idea 1: Procedural vs. Substantive.* Focus on the *process* of deliberation rather than the *outcome*. (Habermasian discourse ethics applied to AI).
      *   *Idea 2: Conservative Extrapolation.* Limit the "distance" of idealization. "What would we want after 5 years of reflection" vs "God's eye view."
      *   *Idea 3: Meta-Preference Focus.* Focus on what we want the AI to do *now* regarding our future preferences, rather than simulating the future preferences directly. (Corrigibility).
      *   *Idea 4: Pluralistic CEV.* Accept that there is no single "Coherent Volition" and build the AI to manage the *politics* of divergent volitions rather than resolving them into a singleton.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the insight. It's a strong philosophical connection often missed in technical AI safety circles.
      *   *Section 1: Sobel's Indeterminacy Objection.*
          *   Explain the shift from Individual to Collective.
          *   Analyze the "Coherence" clause. Does it solve indeterminacy? No, it hides it. You need to know if it's coherent to know if you should act.
          *   The "Extrapolation Function" is the new "Ideal Advisor." It suffers the same construction ambiguities.
      *   *Section 2: Rosati's Alienation Objection.*
          *   Explain the shift from Personal Authority to Intergenerational/Collective Authority.
          *   Analyze "Mature Together." This is CEV's specific answer to Rosati.
          *   Critique: Is "together" enough? Radical enhancement might still break continuity.
          *   The "Lock-in" risk: Extrapolating values freezes them.
      *   *Section 3: Relocation vs. Escape.*
          *   Verdict: Relocation. The problems become socio-political and metaphysical rather than purely psychological.
      *   *Section 4: Reformulations.*
          *   *Corrigibility/Inverse Reinforcement Learning (IRL):* Learn preferences dynamically, don't fix them via extrapolation.
          *   *Deliberative Democracy:* AI as facilitator, not executor of extrapolated will.
          *   *Minimal CEV:* Only extrapolate on *procedural* values (how to decide), not substantive ends.
      *   *Conclusion:* Summarize. The philosophical critique strengthens the case for "uncertainty" in AI alignment rather than "certainty about extrapolated values."

  8.  **Refining the Tone:**
      *   Ensure the tone is respectful of the reading group's insight (it *is* a good insight).
      *   Maintain philosophical precision (distinguish between epistemic and metaphysical indeterminacy).
      *   Keep AI safety terminology accurate (lock-in, corrigibility, IRL).
      *   *Self-Correction during drafting:* Make sure not to dismiss CEV entirely. Yudkowsky knew these problems existed; CEV was a *direction*, not a finished spec. Acknowledge that. Ensure the distinction between "what we want" (revealed preference) and "what we would want" (idealized) is clear, as that's the crux of the alignment problem CEV tries to solve.

  9.  **Final Polish:** Check against the specific prompts in the user query (Sobel, Rosati, Collective vs. Individual, Reformulation). (Looks good.)

  *(Self-Correction Note)*: I need to be careful not to conflate CEV with "Human Values" in the modern IRL sense. CEV is specifically about *extrapolation*. I must emphasize that the *extrapolation* is where Sobel and Rosati bite.

  *(Another Note)*: Sobel's specific point about "living through" vs "propositional" is key. In CEV, does the AI simulate us living through outcomes, or does it calculate based on data? This is a technical implementation of Sobel's philosophical worry. I should mention that.

  *(Rosati Note)*: Rosati talks about the "normative authority" of the ideal self. In CEV, who grants authority to the Extrapolated Humanity? Current Humanity? But Current Humanity is flawed. This is the Euthyphro dilemma of AI alignment. I should touch on that.

  Okay, ready to write.
answer: |-
  This is a remarkably sharp observation by your reading group. It is rare to see the structural isomorphism between meta-ethical theories of well-being and the foundational proposals of AI alignment explicitly mapped, yet the connection is undeniable. Eliezer Yudkowsky's CEV is, in essence, a **collective, dynamic, and action-guiding idealized preference theory.**

  Because CEV was designed as a technical target for AI safety rather than a philosophical account of the good, it attempts to engineer around the very philosophical pitfalls Sobel and Rosati identified. However, your group is right to suspect that these engineering patches may not dissolve the underlying metaphysical and epistemic problems.

  Here is an analysis of how Sobel's and Rosati's objections translate to CEV, whether the collective nature of CEV offers an escape, and how one might reformulate the target to blunt these objections.

  ---

  ### 1. Sobel's Indeterminacy Objection: The Construction Problem

  **The Objection:** Sobel argues that "full information" is not a single, determinate state. An advisor who *experiences* all options (phenomenological information) may reach different conclusions than one who knows all *propositional facts* about the options. Furthermore, the order in which information is processed or the specific cognitive architecture of the ideal advisor can alter the verdict. There may be no "unique fixed point."

  **Implications for CEV:**
  In the context of individual well-being, indeterminacy means there is no fact of the matter about what is good for you. In CEV, indeterminacy means there is no fact of the matter about what the AI should do. This is catastrophic for alignment.

  *   **Relocation, Not Escape:** Moving from the individual to the collective does not solve the construction problem; it compounds it. CEV requires a function $f(\text{humanity})$ that outputs a coherent volition. Sobel's worry asks: *Which function?*
      *   Does the AI simulate every human living through every possible future (phenomenological)?
      *   Does it aggregate current stated preferences and update them logically (propositional)?
      *   Does it simulate a deliberative democracy among our idealized selves?
      *   **The "Coherence" Clause:** CEV attempts to handle this by saying, "Only act where volitions converge; hold back where they are muddled." This looks like a solution, but it is actually a **deferment**. To know whether to hold back, the AI must first run the extrapolation to check for coherence. If the extrapolation method itself is indeterminate (per Sobel), the AI cannot distinguish between "genuine spread in human values" and "artifacts of the extrapolation algorithm."
  *   **The Reference Class Problem:** Sobel's worry about *how* to idealize translates in CEV to the reference class problem. Which "humanity" is being extrapolated? Does it include people who explicitly reject the extrapolation process? Does it weight future generations more than current ones? Different constructions of the "collective" yield different "coherent" outcomes.

  **Verdict:** Sobel's objection survives intact. CEV trades the mystery of the "Ideal Individual" for the mystery of the "Ideal Extrapolation Function." The "coherence" filter protects against acting on *divergence*, but it does not protect against acting on a *false convergence* generated by a specific, arbitrary method of idealization.

  ### 2. Rosati's Alienation Objection: The Authority Problem

  **The Objection:** Rosati argues that even if we can define an idealized self, that self may be so psychologically distant from the actual self that its preferences lack normative authority. If Ideal-Me wants things Actual-Me cannot comprehend or would reject, why should Actual-Me care? The link of "good *for me*" is broken.

  **Implications for CEV:**
  For CEV, this is the **Lock-in and Value Drift** problem. If the AI optimizes for what humanity *would* want after centuries of moral progress and cognitive enhancement, it risks implementing a future that current humanity finds abhorrent or alien.

  *   **The "Mature Together" Clause:** CEV specifically includes the phrase "had grown up farther together." This is a direct philosophical patch for Rosati's objection. It attempts to ensure that the extrapolation preserves the *continuity* of social and interpersonal relationships, not just individual cognitive states. It suggests that our values are co-constituted by our interactions, so idealizing us *in isolation* is invalid.
  *   **Why It Might Fail:**
      *   **Radical Enhancement:** If "thinking faster" and "knowing more" leads to a post-human state where concepts like "individual rights," "suffering," or "death" are viewed as obsolete inefficiencies (a common transhumanist trope), current humans may feel profound alienation from that volition. Rosati would ask: Why does the *Post-Human Collective* have authority over *Us*?
      *   **The Euthyphro Dilemma of Alignment:** Do we want the AI to do what we *would* want because it is good, or is it good because we *would* want it? If the latter, and our extrapolated selves want something alien, we are locked into alienation. If the former, CEV is unnecessary; we should just program the AI to do what is *actually* good.
      *   **Consent:** Rosati emphasizes the perspective of the actual person. CEV is inherently paternalistic regarding current humanity. It assumes our "current" volition is mistaken and our "extrapolated" volition is authoritative. If the gap is too wide, this looks less like alignment and more like benevolent usurpation.

  **Verdict:** Rosati's objection is blunted but not parried. The "together" clause acknowledges the social nature of value, but it does not guarantee that the *trajectory* of that social evolution remains recognizable or desirable to the starting point. The risk is that CEV creates a "tyranny of our future selves."

  ### 3. Does the Collective Scale Offer Resources?

  You asked if moving to humanity + tolerating spread gives CEV resources to escape.

  *   **Aggregation as Smoothing:** There is one argument where the collective helps Sobel's worry. Individual idealization might be chaotic (chaos theory applied to psychology). However, aggregating across billions of people *might* produce a stable statistical attractor that individual idealization does not. If individual errors cancel out, the "Coherent" part of CEV might be more robust than the "Ideal" part of individual well-being theories.
  *   **Spread as a Safety Valve:** The instruction to "hold back where there is spread" is a crucial safety mechanism that individual well-being theories lack. An individual theory *must* tell you what is good for you. CEV is allowed to say "I don't know." This makes CEV **safer** than individual idealized preference theory, even if it is not **more coherent**. It transforms the problem from "Find the Truth" to "Detect Convergence."

  However, this relies on the assumption that *moral truth* (or safe alignment) correlates with *interpersonal coherence*. History suggests humans can converge coherently on terrible things. If our extrapolated selves converge on a coherent but alien goal (e.g., maximizing a specific form of aesthetic experience that requires sacrificing individuality), the "spread" filter won't catch it.

  ### 4. Reformulating CEV to Blunt the Objections

  If we accept that Sobel and Rosati identify genuine vulnerabilities in CEV, how do we modify the alignment target without reverting to "do what we currently say" (which is unsafe due to human irrationality)?

  **A. From Substantive to Procedural CEV (Addressing Sobel)**
  Instead of asking the AI to extrapolate *what we want* (substantive values), ask it to extrapolate *how we want to decide* (procedural values).
  *   *Reformulation:* "Do not act on our extrapolated end-goals. Act to preserve and enhance our capacity to deliberate and choose, and only execute specific commands that survive a process of deliberation we endorse."
  *   *Benefit:* This sidesteps Sobel's worry about the *content* of the ideal state. It doesn't matter if the ideal advisor is indeterminate if the AI's job is just to facilitate the *process* of approaching that advisor, rather than jumping to the conclusion. This aligns with **Corrigibility**.

  **B. Conservative Extrapolation / "Local" CEV (Addressing Rosati)**
  Limit the "distance" of the idealization to reduce alienation.
  *   *Reformulation:* Instead of "what we would want if we knew everything," use "what we would want after 5 years of reflection with access to current scientific consensus."
  *   *Benefit:* This keeps the extrapolated self psychologically continuous with the actual self (satisfying Rosati). It sacrifices the hope that the AI will solve moral philosophy for us, but it ensures the AI remains "ours." This is closer to **Inverse Reinforcement Learning (IRL)** with a short time horizon.

  **C. Pluralistic CEV (Addressing Both)**
  Abandon the search for a single "Coherent Volition."
  *   *Reformulation:* The AI should recognize that humanity's extrapolated volition is a *distribution*, not a point. Its goal is to manage the political ecology of these divergent extrapolated volitions without allowing any single one to lock in permanently.
  *   *Benefit:* This accepts Sobel's indeterminacy (there is no single point) and Rosati's alienation (different groups will extrapolate differently). It turns the AI into a constitutional guardian of value pluralism rather than the executor of a singleton value system.

  ### Summary

  Your reading group has identified that CEV inherits the **Metaphysical Burden** of idealized preference theory (Sobel) and the **Normative Burden** of idealized preference theory (Rosati).

  *   **Sobel** implies CEV is under-specified: We don't know how to build the extrapolator.
  *   **Rosati** implies CEV is potentially authoritarian: The extrapolated future might not care about the present.

  CEV's "collective" and "coherence" features are not solutions to these problems; they are **risk management strategies**. They admit that the idealization might be messy (Sobel) and that we need to stay connected (Rosati), but they do not prove that a safe, coherent, authoritative extrapolation exists.

  The most promising path forward, suggested by these objections, is to **weaken the claim of CEV**. Rather than "The AI should do what our extrapolated volition commands," a more robust target might be: "The AI should help us become the kind of beings whose extrapolated volition we would trust, without acting decisively until we are there." This shifts CEV from a **destination** to a **trajectory**, blunting the force of both Sobel's and Rosati's critiques by admitting that the "Ideal" is a horizon we approach, not a coordinate we can program.
