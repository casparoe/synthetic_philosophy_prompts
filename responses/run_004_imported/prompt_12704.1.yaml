      *   *Solution 2 (Deeper/True):* Demand (*chreia*). This is the "truth" (*aletheia*). Money is just a convention representing demand.
      *   *Caveat:* Strict commensurability is impossible ("in truth it is impossible"), but sufficient commensurability is possible "with reference to demand."

  3.  **Address Question 1: Money vs. Demand (The "Switch"):**
      *   *Observation:* The user is right to notice a shift. Aristotle explicitly distinguishes between the *conventional* measure (money) and the *ontological/psychological* ground of that measure (demand).
      *   *Interpretation:* It's not necessarily a contradiction, but a layering. Money is the *instrument* of measurement, but Demand is the *standard* or *substance* being measured.
      *   *Analogy:* Think of a ruler. The ruler (money) measures length. But what makes length comparable? The physical space occupied (demand/need). Actually, a better analogy: Currency is the token, but Purchasing Power is the reality. Purchasing Power derives from Utility/Need.
      *   *What is "Demand" a unit of?* It's not a unit of physical quantity. It's a unit of *human need* or *utility*. Aristotle is hinting at a subjective theory of value (proto-marginal utility?). If I need a house as much as you need 1000 pairs of shoes, there is an equilibrium of *need*.
      *   *Commensurability before Money:* How can a house and shoes be compared without money? By the intensity of the *need* they satisfy within the community. If the community needs shelter and foot-protection, there is a social valuation of the labor/time/utility required to produce them relative to the need.
      *   *Key Textual Clue:* "If men did not need one another's goods... there would be... no exchange." Exchange is grounded in mutual need. Therefore, the *ratio* of exchange must reflect the *ratio* of needs (adjusted for production difficulty, though Aristotle focuses more on the agents' status in other parts of the chapter).

  4.  **Address Question 2: The Geometrical Apparatus (Cross-Conjunction):**
      *   *The Diagram:* A (Builder) : B (Shoemaker) :: C (House) : D (Shoes).
