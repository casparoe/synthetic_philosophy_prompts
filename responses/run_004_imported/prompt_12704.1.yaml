answer: |-
  You have identified one of the most famous and debated cruxes in the history of economic thought. Your suspicion is well-founded: on the surface, the passage does oscillate between money as the measure and demand as the measure. However, most careful reconstructions of Aristotle's argument suggest he is not contradicting himself but rather distinguishing between the **instrument** of measurement (money) and the **ontological ground** of measurement (demand).

  Here is a reconstruction of the argument that addresses your two specific questions regarding the nature of "demand" and the function of the geometrical apparatus.

  ### 1. Money vs. Demand: Is there a switch?

  Aristotle is not silently switching between two incompatible candidates; he is offering a layered account distinguishing **convention** (*nomos*) from **truth** (*aletheia*).

  *   **Money (*nomisma*) is the *representative*:** Money is the visible, conventional token that allows the measurement to happen practically in the marketplace. It is the "intermediate" because it is the common denominator everyone accepts *as if* it were value itself.
  *   **Demand (*chreia*) is the *substance*:** Demand is what gives money its power. Aristotle argues that money is empty without the underlying reality of human need. If no one needed houses or shoes, no amount of money could facilitate an exchange between a builder and a shoemaker.

  **What is "demand" a unit of?**
  To answer your specific question: For goods to be commensurable with respect to demand *before* money enters the picture, demand must be understood not as a subjective whim, but as a **unit of social necessity or utility.**

  Aristotle implies a proto-subjective theory of value. A house and a shoe are qualitatively different (ontologically incommensurable). However, they can be rendered quantitatively comparable if reduced to a common third term: **their capacity to satisfy human need.**

  *   **The Reduction:** Just as we can compare a gallon of water and a pound of gold by reducing both to their monetary price, Aristotle suggests we can compare them by reducing both to the "amount of need" they fulfill within the community.
  *   **The Commensurability:** If the community's need for shelter is equivalent to the community's need for 1,000 pairs of shoes, then the house and the 1,000 shoes are commensurable *in terms of demand*, even if no currency exists.
  *   **The "Sufficiently" Caveat:** This explains Aristotle's humble concession: *"in truth it is impossible that things differing so much should become commensurate, but with reference to demand they may become so sufficiently."* He admits that strict mathematical equality between a house and a shoe is metaphysically impossible. They are only commensurable *pragmatically* ("sufficiently") because human need acts as a flattening agent that ignores qualitative differences in favor of functional equivalence.

  Therefore, money is merely the **conventional proxy** for this underlying reality of demand. When Aristotle says money "measures all things," he means it measures them *on behalf of* demand.

  ### 2. The Geometrical Apparatus: Argumentative Work or Dressing?

  The "cross-conjunction" (the builder/shoemaker/house/shoe diagram) is often criticized by modern economists (such as Schumpeter) as confused mathematics that adds nothing to the economic insight. However, if we view it through the lens of Aristotelian ethics rather than neoclassical economics, it is doing genuine, albeit limited, argumentative work.

  **What the Geometry Does:**
  The geometry is not trying to calculate *price* (how many shoes equal a house); it is trying to calculate *justice* (how to maintain the relationship between the citizens).

  1.  **Distinguishing Reciprocal from Distributive Justice:** In Book V, Aristotle distinguishes between distributive justice (dividing common goods according to merit) and corrective/commutative justice (exchange). The geometric proportion distinguishes exchange from simple barter. It shows that justice in exchange is not arithmetic equality (1 house for 1 shoe) but proportional equality relative to the producers.
  2.  **Binding the Polis:** The "cross" (Builder gives House to Shoemaker, Shoemaker gives Shoes to Builder) visually represents the binding of the city. Aristotle explicitly states that *chreia* (demand/need) "holds all things together." The geometric intersection symbolizes the social bond. Without this proportional return, the builder would be exploited, the social bond would break, and the city would cease to exist.
  3.  **Formalizing the Obligation:** The geometry secures the *structure* of the obligation. It dictates that A must be to B as D is to C. It ensures that the exchange is reciprocal rather than unilateral.

  **Where the Geometry Fails (The "Dressing" Charge):**
  You are right to suspect it is partly "dressing up." The geometric apparatus **cannot determine the ratio of exchange.**
  *   The formula $A : B :: D : C$ tells us there *should* be a proportion.
  *   It does *not* tell us whether that proportion is 1 house : 50 shoes or 1 house : 500 shoes.
  *   To find the specific numbers, you must exit the geometry and enter the realm of "demand" and "money."

  **Verdict:** The geometry is not merely decorative, but it is **formal rather than substantive.** It provides the skeleton of justice (reciprocity), while "demand" provides the flesh (valuation). The geometry proves *that* they must be equated to preserve the city; demand explains *how* they can be equated to satisfy need.

  ### Summary Reconstruction

  Aristotle's argument can be reconstructed as a three-step movement from **Structure** to **Substance** to **Convention**:

  1.  **Structure (Geometry):** Exchange requires a proportional return (cross-conjunction) to maintain the social bond between citizens (Builder and Shoemaker). Without proportion, the relationship dissolves.
  2.  **Substance (Demand):** For this proportion to exist, the dissimilar goods (House and Shoe) must be made similar. They cannot be made similar physically, so they must be made similar functionally. The common denominator is *chreia* (demand/need). All goods are reduced to units of "need-satisfaction." This makes them "sufficiently" commensurable.
  3.  **Convention (Money):** Because measuring "need" directly is difficult in daily transactions, society invents a token (*nomisma*) to represent demand. Money allows us to measure the "excess and defect" of need-satisfaction practically.

  **Conclusion:** Aristotle is offering a consistent, layered account. He is not switching measures; he is distinguishing the **proxy** (money) from the **reality** (demand). The geometry is not a failed attempt at pricing theory, but a successful attempt at **social ontology**: it demonstrates that exchange is fundamentally a relational bond between citizens, secured by need and facilitated by convention.
