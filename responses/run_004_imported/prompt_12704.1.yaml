prompt: |-
  The following passage is from Aristotle's discussion of justice in exchange in the Nicomachean Ethics, Book V, chapter 5, in W. D. Ross's translation. Aristotle is trying to explain how goods as different as a house and a pair of shoes can be rendered "commensurable" for the purposes of fair exchange:

  "Now proportionate return is secured by cross-conjunction. Let A be a builder, B a shoemaker, C a house, D a shoe. The builder, then, must get from the shoemaker the latter's work, and must himself give him in return his own... This is why all things that are exchanged must be somehow comparable. It is for this end that money has been introduced, and it becomes in a sense an intermediate; for it measures all things, and therefore the excess and the defect — how many shoes are equal to a house or to a given amount of food... All goods must therefore be measured by some one thing, as we said before. Now this unit is in truth demand, which holds all things together (for if men did not need one another's goods at all, or did not need them equally, there would be either no exchange or not the same exchange); but money has become by convention a sort of representative of demand; and this is why it has the name 'money' (nomisma) — because it exists not by nature but by law (nomos) and it is in our power to change it and make it useless... Now in truth it is impossible that things differing so much should become commensurate, but with reference to demand they may become so sufficiently."

  I cannot tell whether Aristotle is offering one consistent account of what makes the house and the shoe comparable, or silently switching between two different candidates for "the measure": money, which he says "measures all things," and demand, which he then says is the true "unit," with money serving merely as its conventional representative. Could you help me reconstruct the argument? Specifically: what would demand have to be a unit of for two such different goods to be commensurable with respect to it even before either is priced in money; and is the geometrical apparatus of proportion and "cross-conjunction" (the builder/shoemaker/house/shoe example) doing genuine argumentative work in securing that commensurability, or is it just dressing up a comparison the passage never actually earns?
