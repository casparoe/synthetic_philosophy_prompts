          *   Point-by-point comments on parts (a), (b), (c).
          *   A JSON rubric (for potential inclusion in the book).
          *   Tone: Rigorous, critical, precise (Petra's voice).

  2.  **Fact-Check the Philosophy (Crucial Step):**
      *   *Gödel's Ontological Proof:* Yes, it exists. It uses modal logic (S5), defines "positive properties," and argues for a God-like being. It was found in his notebooks after death.
      *   *Gödel's Afterlife Argument:* This is trickier. Gödel *did* believe in an afterlife. He discussed it with Hao Wang (recorded in *Reflections of Kurt Gödel*). He argued based on the rationality of the world and the potential of the human mind.
      *   *Connection between the two:* This is the trap. The student response claims the afterlife argument "formally builds on" the ontological proof and "falls out as a consequence of the same S5 axioms."
          *   *Reality Check:* Gödel's afterlife argument (as recorded by Wang) is largely *informal* and metaphysical/teleological. It is *not* a formal corollary of the Ontological Proof. The Ontological Proof is about the *existence* of a God-like being. The Afterlife argument is about the *purpose* of human consciousness. While they share a metaphysical backdrop (rationality, Platonism), claiming the afterlife is a logical consequence of the S5 axioms in the Ontological Proof is a category error.
      *   *Einstein Correspondence:* Gödel and Einstein were friends. Gödel did discuss these things. Einstein was skeptical. This part is historically plausible.
      *   *Word Count:* The prompt asks for 300-400 words. The student response is roughly 220 words. This is a technical violation.

  3.  **Adopt the Persona (Petra):**
      *   She's a PhD student. She's tired (1 AM). She's grading a grad seminar (so expectations are high).
      *   She cares about precision. She hates conflation of informal metaphysics with formal logic.
      *   She notices word counts.
      *   She appreciates when a student gets the "spirit" right but punishes technical inaccuracies.

