  *(Self-Correction Note)*: I need to make sure I don't sound *too* much like a philosophy paper. It's a policy memo. The philosophy should serve the policy, not the other way around. I will frame the philosophical theories as "frameworks for adjudicating evidence."

  7.  **Drafting the Content:** (Mental Outline)
      *   **To:** Committee Members
      *   **From:** Grad Rep
      *   **Subject:** Policy Recommendation: ICD-11 Gaming Disorder
      *   **Intro:** Context of the petition.
      *   **Analysis:** DSM vs. ICD isn't just administrative; it's conceptual.
