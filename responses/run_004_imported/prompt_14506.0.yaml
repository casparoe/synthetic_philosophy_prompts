      *   **Context:** A student petitioned for retroactive withdrawal based on ICD-11 "Gaming Disorder." Registrar denied it because the university tracks DSM-5 (where it's Section III, "for further study"). The committee needs a standing policy.
      *   **Committee Dynamics:**
          *   CAPS Director: Pro-recognition (consistency with other addictions, WHO deference, student welfare).
          *   Chair (Kinesiology): Skeptic (Naturalist worry: no biological marker, "disorder" implies dysfunction, risk of moralizing hobbies vs. research/chess).
          *   Disability Services: Sympathetic but worried about precedent/medicalization of intense hobbies.
      *   **Philosophical Underpinnings:** Naturalism vs. Normativism (Boorse, Wakefield, Nordenfelt).
      *   **Requirements:**
          *   Land on *one* concrete recommendation (Recognize outright, Decline/Route elsewhere, or Recognize with conditions).
          *   Defend with reasoning the committee can vote on (not just "ICD vs. DSM").
          *   Engage with philosophical theories of disease (Boorse, Wakefield, Nordenfelt).
          *   State charitably the strongest version of the *opposing* position.
          *   Tone: Professional, academic but accessible to non-philosophers, persuasive, policy-oriented.

  2.  **Determine the Recommendation:**
      *   *Option A (Recognize Outright):* Aligns with CAPS/WHO. Risks the Chair's "moralizing" worry and Disability Services' "precedent" worry. Might be too blunt given the DSM-5 hesitation.
      *   *Option B (Decline/Route Elsewhere):* Aligns with Chair/DSM-5. Risks harming students who genuinely suffer but don't fit mood/impulse boxes neatly. Ignores ICD-11 shift.
      *   *Option C (Recognize with Conditions):* This seems the most philosophically robust and politically viable compromise. It acknowledges the *harm* (Nordenfelt) and the *dysfunction* (Wakefield) without accepting every claim of "too much gaming" as a disorder. It addresses the Chair's worry about "research habits" by adding functional impairment criteria beyond just time spent.
      *   *Decision:* **Recommend recognizing ICD-11 Gaming Disorder, subject to specific functional impairment criteria.** This bridges the gap: it accepts the diagnosis (satisfying CAPS/WHO) but adds safeguards against over-medicalization (satisfying Chair/Disability Services).

  3.  **Drafting - Section by Section:**

