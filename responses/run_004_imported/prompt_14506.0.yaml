      *   **The Recommendation:** Recognize ICD-11 Gaming Disorder *but* require evidence of functional impairment in *multiple* domains (academic, social, health), not just time spent. This filters out the "intense researcher" vs. "disordered gamer."
      *   **Implementation:** How does this work practically? (Documentation requirements).
