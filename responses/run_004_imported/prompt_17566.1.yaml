answer: |-
  Here is an argument suitable for a philosophy of science seminar, focusing on the internal consistency of Kepler's demarcation criteria.

  ***

  ### The Geometric Dogma: Why Kepler's Reformed Astrology Fails His Own Demarcation Test

  Johannes Kepler is often recuperated by historians of science as the figure who severed the head of astrology from the body of astronomy. In *De Fundamentis Astrologiae Certioribus* (1601), he famously derides traditional astrology as the "foolish, bread-winning daughter" of astronomy, a wise but impoverished mother. His critique is biting: he argues that the zodiacal signs, the houses, and the planetary rulerships are arbitrary human inventions, "chimeras" without basis in physical reality or geometric necessity. He demands a *causa efficiens*—a physical mechanism—for any celestial influence.

  However, in *Tertius Interveniens* (1610) and *Harmonices Mundi* (1619), Kepler retains a "reformed" astrology based on aspects (conjunction, sextile, square, trine, opposition). He justifies this retention by arguing that these specific angles are not arbitrary, but are grounded in the archetypal geometry of creation: they correspond to regular polygons constructible by straightedge and compass.

  **The Argument:** Kepler's reform fails to escape his own objections to traditional astrology because his criterion for validity—Euclidean constructibility—is itself an arbitrary metaphysical constraint that lacks the physical grounding he demands of the ancients. By prioritizing geometric constructibility over empirical harmonic data (specifically regarding the heptagon), Kepler replicates the very dogmatism he condemns in the zodiacal tradition. He replaces the arbitrary number 12 (signs) with the arbitrary restriction of constructible polygons, failing his own test of non-arbitrary natural kinds.

  #### 1. The Charge of Arbitrariness Boomerangs
  Kepler's primary demolition of traditional astrology rests on the claim that its divisions are conventional, not natural. The 12 signs are 30 degrees each not because nature divides the ecliptic that way, but because Babylonian mathematicians liked base-60. There is no physical discontinuity at 0° Aries.

  Kepler posits that his aspects escape this charge because they are derived from "nature's geometry." A square aspect (90°) is real because it corresponds to the square, a constructible figure. But we must ask: **Why is Euclidean constructibility the marker of physical reality?**

  Nature does not wield a straightedge and compass. The restriction to constructible polygons is a limitation of human mathematical tools, not necessarily a law of physics. This becomes glaringly obvious in *Harmonices Mundi*, Book IV, where Kepler explicitly rejects the **septile aspect** (360°/7 ≈ 51.4°). Musically, the number 7 appears in the harmonic series (the natural seventh partial), and in terms of pure acoustic physics, it has a claim to "naturalness." Kepler bans it solely because the regular heptagon cannot be constructed with Euclidean tools.

  Here, the boomerang hits. Kepler accuses the traditionalists of forcing nature into numerical boxes (the 12 signs). Yet, he forces nature into *geometric* boxes. By rejecting the septile despite its harmonic presence, he proves that his system is not derived from physical observation of harmony, but from a preconceived metaphysical commitment to a specific subset of mathematics. The zodiacal 12 is arbitrary tradition; the constructible polygon is arbitrary mathematical dogma. Both filter reality through a human conceptual grid rather than deriving categories from physical causation alone.

  #### 2. The Causal Mechanism Remains Occult
  Kepler insists that traditional astrology fails because it lacks a physical mechanism. How does the shape of a lion (Leo) cause a king to be born? It doesn't. Kepler proposes to fix this by suggesting that planetary rays converge on the Earth, forming angles that resonate with the "Earth Soul" or the human soul, akin to musical consonance.

  However, this reform does not solve the demarcation problem; it merely relocates the occultism.
  *   **Traditional Astrology:** Stars influence matter via "rays" or "virtues" tied to mythological imagery.
  *   **Keplerian Astrology:** Angles influence the soul via "harmonic perception" tied to geometric archetypes.

  In both cases, the mechanism is non-mechanistic. Kepler demands a *physical* cause for the zodiac but settles for a *psychological/metaphysical* cause for aspects. He argues the soul "perceives" the aspect. But how does a geometric angle in the sky transmit information to a soul on Earth without a medium? Kepler invokes light rays, but light rays do not carry "geometric meaning" in his physics; they carry intensity and heat. The leap from "light converges at 90°" to "the soul perceives a square" is just as unexplained as "Mars is red, therefore it causes war."

  If the demarcation between science and pseudoscience requires a plausible causal mechanism connecting the antecedent (planetary position) to the consequent (earthly effect), Kepler's "harmonic resonance of the soul" is as vulnerable as the "influence of the constellations." He criticizes the ancients for reifying human concepts (myths) into physical causes, but he is guilty of reifying mathematical concepts (polygons) into physical causes.

  #### 3. Selection Bias and the "Foolish Daughter"
  Kepler's metaphor of the foolish daughter implies that astrology survives only by peddling lies to survive, while astronomy (the mother) seeks truth. Kepler intends his reform to turn the daughter into a scholar. But his method of selecting valid aspects reveals that the daughter is still choosing her customers based on prejudice.

  Kepler accepts the quintile (72°, based on the pentagon) but struggles with its justification compared to the trine or square. He accepts the opposition (180°) but rejects other divisions that might be musically viable but geometrically complex. He is curating data to fit the *Harmonices Mundi* thesis.

  This is the exact methodological sin he attributes to the traditional astrologers: **post-hoc rationalization.** The traditionalists observed events and mapped them to the 12 signs because the 12 signs were culturally available. Kepler observes harmonies and maps them to the 5 aspects because the aspects fit his Platonic theology.
  *   **Traditionalist:** "This event happened under Scorpio; therefore Scorpio rules death."
  *   **Kepler:** "This harmony exists in music; therefore the pentagon must be astrologically valid (if constructible)."

  In both instances, the theoretical framework dictates the physical reality, rather than the physical reality dictating the framework. For a seminar on demarcation, this is crucial. Kepler's "reform" is not a shift from pseudoscience to science; it is a shift from one metaphysical system (Aristotelian/Scholastic symbolism) to another (Platonic/Pythagorean numerology).

  #### Conclusion
  Kepler's critique of traditional astrology is powerful because it demands physical necessity over cultural convention. However, his own reformed doctrine collapses under this demand. By making Euclidean constructibility the *sine qua non* of astrological validity, he introduces a criterion that is mathematically elegant but physically unmotivated. The rejection of the heptagon proves that he will sacrifice physical harmonic data to preserve geometric purity.

  Therefore, Kepler does not escape the charge of arbitrariness. He merely swaps the arbitrary authority of Ancient Tradition for the arbitrary authority of Euclidean Geometry. For the purposes of demarcation, Kepler's reformed astrology remains on the "foolish" side of the line: it is a beautiful, rigorous, theological system, but it fails its own test for physical reality. It is not the daughter becoming wise; it is the daughter wearing a different costume.
