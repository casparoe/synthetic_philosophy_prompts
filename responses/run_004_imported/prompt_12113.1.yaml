answer: |-
  **Setting:** *A university coffee shop, shortly after a seminar on Animal Ethics. Elias (Orthodox Kantian) and Mara (Korsgaardian Kantian) are finishing their espresso.*

  **Elias:** Look, I appreciate the moral sentiment, Mara, but we have to be textually honest. When Kant says we shouldn't shoot the old dog because it has served us, he explicitly says it's a duty *to oneself*. To damage your own capacity for sympathy is to damage your humanity. The animal is merely the occasion for the duty, not the subject of it. That's the *Metaphysics of Morals*. It's unambiguous.

  **Mara:** It's unambiguous only if you stop reading at the application and ignore the derivation. Korsgaard's point in *Fellow Creatures* isn't that Kant *said* animals have rights, but that his argument for *why* humans have rights commits him to it. The Formula of Humanity says we must treat rational nature as an end-in-itself. But why is rational nature an end? Because rational agents confer value on their ends.

  **Elias:** Right, because we set ends. Animals don't set ends; they follow inclination. That's the boundary line. If you erase the line between setting an end and having a desire, you collapse the distinction between a person and a thing. Kant's entire moral metaphysics rests on autonomy. If the dog can't legislate the moral law, it can't be a member of the Kingdom of Ends.

  **Mara:** But here's the pivot: To value my own rational capacity to set ends, I must value the *natural good* that those ends serve. If I choose to eat because I'm hungry, I'm treating my hunger as a reason-giving fact. I'm not just saying "I feel hungry," I'm saying "Hunger is a bad thing to have, objectively." I take my own animality to be objectively valuable.

  **Elias:** You're conflating prudential value with moral value. I can acknowledge that my pain is bad *for me* without concluding that my pain is bad *simpliciter*, such that you have a duty to prevent it. Kant grants we have a duty to preserve our own animal nature, but that's because it's the substrate of our rationality. It's instrumental. You're trying to turn the substrate into the source.

  **Mara:** It's not instrumental if the value is normative. When I act, I constitute myself as a unified agent. I have to endorse my impulses as reasons. If I endorse my impulse to avoid pain as a *good reason*, I'm claiming pain is objectively to-be-avoided. But if it's objectively to-be-avoided for me, in virtue of my sentience, then it's objectively to-be-avoided for any sentient being. Otherwise, I'm making a groundless exception for myself.

  **Elias:** That sounds suspiciously like a utilitarian argument wrapped in transcendental language. Kant's point isn't that pain is bad; it's that *freedom* is good. The "exception" isn't groundless; it's grounded in the unique capacity to be bound by duty. You're arguing that sentience generates moral claims. Kant argues that autonomy generates moral claims. You can't just slide from "I value my pain" to "You owe it to the cow not to eat it."

  **Mara:** I'm not saying the cow is autonomous. I'm saying the cow is an "end-in-itself" in the sense that it has a good of its own that matters to it. Kant's error was thinking "end-in-itself" requires *moral* agency. But the argument for humanity's value starts with *natural* agency. If I owe it to myself to respect my natural good, consistency demands I respect the natural good of others who share that nature, even if they don't share the moral nature.

  **Elias:** And that's where I have to call foul on the exegesis. You're redefining "end-in-itself." For Kant, that term is technical. It means "that which constrains the will absolutely." A being that cannot constrain its own will cannot constrain yours. You're asking Kantians to accept direct duties to animals, which is morally attractive, but you're doing it by borrowing Kant's name for a view he would have rejected as heteronomous.

  **Mara:** I grant you, Kant the historical figure would have rejected it. He was a product of his time, and he prioritized the metaphysics of freedom over the phenomenology of suffering. But philosophical interpretation isn't just archaeology. It's about reconstructing the strongest version of the argument. If the *ground* of Kantian ethics is that we must respect the sources of value, and sentience is a necessary condition for valuing anything, then sentience must be respected.

  **Elias:** But if you make sentience the criterion, you lose the strictness of the Categorical Imperative. Duties to rational beings are perfect duties; they can't be traded off. If animals have direct status, do we have perfect duties not to kill them? Can they ever be means? You're opening a door Kant wanted welded shut. He kept animals as "things" precisely to protect the absolute status of persons.

  **Mara:** Not welded shut, just differentiated. We still have stronger duties to rational beings—duties of reciprocity, of justice. Animals can't claim justice from us because they can't claim anything. But they can be wronged. Korsgaard isn't saying a cow has the same status as a professor; she's saying the cow isn't a *tool*. It's a distinction between a "passive end" and an "active legislator." Both constrain the will, just differently.

  **Elias:** I worry this is just a compromise that satisfies neither side. The utilitarian says you're still privileging rationality too much; the Kantian says you've diluted autonomy too much. My concern is fidelity. If I teach my students that Kant argues for direct duties to animals, I am lying about Kant. I might be teaching good ethics, but I'm teaching bad history of philosophy.

  **Mara:** You're teaching them that Kant's *principles* are more radical than his *conclusions*. That happens in philosophy. Kant didn't think women were fully rational either; we don't keep that bit because it contradicts his universalism. Why is the animal case different? If the argument for human dignity rests on the objective value of our natural good, excluding animals is an inconsistency in his system, not a feature of it.

  **Elias:** Because the exclusion of animals is structural, not accidental. The whole point of the second *Critique* is to show that morality lifts us *out* of nature. By grounding duty in our animality, you're grounding morality *in* nature. You're naturalizing the Categorical Imperative. That's not fixing Kant; it's replacing him with a naturalist ethicist who uses Kantian vocabulary.

  **Mara:** I'm not grounding morality in nature; I'm grounding the *scope* of moral concern in the conditions of valuation. Morality still comes from autonomy—only we can be moral agents. But the *patients* of morality include anyone for whom things can be good or bad. Kant wanted to protect the dignity of the legislator. I'm arguing you can't protect the legislator without protecting the living being who does the legislating.

  **Elias:** I suppose the real disagreement is whether we read Kant as offering a closed system or an open method. If it's a system, you're outside of it. If it's a method—a way of reasoning about value—then maybe you're right that the logic extends further than he took it. But don't tell me Kant believed it.

  **Mara:** I won't tell you Kant believed it. I'll tell you that Kantianism, as a living tradition, requires us to follow the argument where it leads, even if it leads past the founder. We owe it to the truth of the ethics, not just the biography of the man. If the "old dog" argument fails the test of universalizability because it treats a subject-of-a-life as a mere means, then the orthodox reading is the one that's actually un-Kantian.

  **Elias:** *Laughs.* Turning the Categorical Imperative on the interpretation itself. Fair enough. I still think you're conflating "mattering to a subject" with "mattering morally," but I concede your position is internally consistent. Just don't expect me to stop assigning the *Lectures on Ethics* without a heavy disclaimer.

  **Mara:** And I won't expect you to stop calling it an innovation. But if the innovation saves the theory from moral absurdity, isn't that the most Kantian move of all? To think for oneself, even against the authority of the master?

  **Elias:** Touché. Coffee's on me, then. But we're reading *Groundwork* II next week. No *Fellow Creatures*.

  **Mara:** Deal. But I'm bringing a dog.
