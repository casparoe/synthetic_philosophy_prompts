answer: |-
  Your intuition is sharp. You have identified exactly the pressure point that contemporary metaphysicians have been pushing on for the last thirty years. The argument you describe is indeed David Lewis's famous "Argument from Vagueness," and it is widely considered one of the most formidable arguments in modern metaphysics.

  However, your suspicion that there is a "sleight of hand" in the move from *vagueness in composition* to *vagueness in existence* is shared by many professional philosophers who reject Universalism.

  To answer your request directly: **The inference does not logically go through.** It relies on a specific, contentious assumption about the relationship between language, concepts, and reality. If you reject that assumption, you can hold that composition is vague without reality itself being fuzzy.

  Here is the strongest case for why that inference fails, constructed to show you exactly where the lever can be pried loose.

  ### 1. Formalizing the Trap
  First, let's be precise about where Lewis thinks he has you cornered. The argument runs like this:

  1.  **The Sorites Premise:** If composition is restricted (i.e., happens sometimes but not always), there must be borderline cases (e.g., bricks almost touching). Thus, composition is vague.
  2.  **The Ontological Premise:** If composition is vague, then *existence* is vague. (If it's indeterminate whether the bricks compose a wall, it's indeterminate whether the "wall" object exists).
  3.  **The Absurdity Premise:** Existence cannot be vague. (The world doesn't contain "fuzzy objects"; things either exist or they don't).
  4.  **Conclusion:** Therefore, composition cannot be restricted. (It must be Universal or Nihilist).

  Your intuition targets **Premise 2**. Lewis claims that vagueness in *composition* automatically translates to vagueness in *ontology* (the inventory of the world). The counter-argument aims to sever this link.

  ### 2. The Core Counter-Argument: Semantic Indeterminacy
  The strongest case against Lewis relies on distinguishing between **ontic vagueness** (fuzziness in the world) and **semantic indeterminacy** (fuzziness in our concepts).

  Lewis assumes that if it is indeterminate whether "the bricks compose a wall," then there is an object (the wall) whose *existence* is indeterminate. He treats "compose" as a discovery of a fact about the universe, like "is radioactive."

  The counter-argument proposes that "compose" is more like "is a heap."

  **The Analogy of the Heap:**
  Imagine a pile of sand. You remove grains one by one. At some point, it stops being a "heap."
  *   **Lewis's View:** If "heap" is vague, then the *world* contains a vague object. There is a specific grain whose removal makes the "heap-object" pop out of existence. This is absurd.
  *   **The Counter-View:** The sand grains exist precisely. Their arrangement exists precisely. What is vague is not the *reality*, but the *word* "heap." The world does not dictate where "heapness" begins; our linguistic conventions do.

  **Applying this to Composition:**
  The Restricted Compositionist argues that composite objects (tables, walls, shoes) are not fundamental features of the universe like electrons or quarks. They are *conceptual ways of counting* fundamental features.

  When you ask, "Do these bricks compose a wall?" you are asking two things mixed together:
  1.  **Ontological:** Are there particles arranged wall-wise? (Yes, precisely.)
  2.  **Conceptual:** Do our conventions for the word "object" or "wall" include this arrangement? (Maybe vaguely.)

  If you accept this distinction, Premise 2 collapses. Vagueness in composition becomes vagueness in *classification*, not vagueness in *existence*. The particles exist. The arrangement exists. The only thing "fuzzy" is whether we choose to apply the label "composite object" to that arrangement.

  ### 3. Solving the "Head-Count" Problem
  Lewis's strongest bite is the "head-count" objection. He says: "If composition is vague, then the *number of objects* in the room is vague. But how can the world have a vague number of things?"

  The counter-argument here relies on a view sometimes called **Ontological Deflationism** or **Conceptual Relativity** (championed by philosophers like Eli Hirsch and Amie Thomasson).

  The argument is that "How many objects are there?" is not a question with a single, God's-eye-view answer. It is a question that can only be answered *relative to a conceptual scheme*.

  *   **Scheme A (Common Sense):** Counts tables, chairs, and walls. In this scheme, there are 50 objects in the room. (Perhaps vaguely 50 or 51 in borderline cases).
  *   **Scheme B (Nihilist/Physics):** Counts only elementary particles. In this scheme, there are $10^{28}$ objects. (Precisely).
  *   **Scheme C (Universalist):** Counts any plurality. In this scheme, there are infinite objects. (Precisely).

  **The Crucial Move:** The Restricted Compositionist argues that Scheme A is not "wrong" and Scheme B is not "right." They are different tools for different jobs.
  When Lewis says "Vague existence is impossible," he is assuming there is One True Inventory of the World. The counter-argument says: "There is no One True Inventory. There is only the fundamental physical stuff (which is precise) and the various ways we carve it up (which can be vague)."

  Therefore, the "head-count" is only vague *relative to the Common Sense scheme*. It is not vague *in reality*. The reality is the particles; the count is a human activity. Since human activities (like counting or categorizing) can be vague without the world being vague, the inference fails.

  ### 4. Addressing the "Vague Identity" Objection
  There is one more technical hurdle you need to clear to make this case watertight. Lewis (following Gareth Evans) argued that if composition is vague, then *identity* is vague.
  *   If the bricks ($xx$) compose the wall ($y$), then $y$ is identical to the $xx$.
  *   If it's vague whether $xx$ compose $y$, it's vague whether $y$ is identical to the $xx$.
  *   But identity cannot be vague (an object cannot be vaguely identical to itself or another).

  **The Counter-Move:** Deny that Composition is Identity.
  Many Restricted Compositionists argue that saying "the bricks compose the wall" does *not* mean "the wall is identical to the bricks." It means "the wall is *constituted by* the bricks."
  *   **Identity:** $A = B$ (They are the very same thing).
  *   **Constitution:** $A$ is made of $B$, but $A$ has different properties (e.g., the wall could be destroyed while the bricks survive).

  If composition is constitution rather than identity, then vagueness in composition does not entail vagueness in identity. You can have a precise set of bricks constituting a vaguely defined wall without violating the laws of logic regarding identity.

  ### 5. Where the Inference Actually Fails
  So, to answer your specific question: The sleight of hand is in **Premise 2 (The Ontological Premise)**.

  Lewis's argument only works if you accept **Ontological Realism about Composites**: the view that whether "a table exists" is a fact independent of human concepts, language, or interests, just like "an electron exists."

  If you reject that view—if you believe that "table" is a concept we impose on a world of particles to make it navigable—then the inference fails.
  *   **Reality:** Precise distribution of particles.
  *   **Concepts:** Fuzzy boundaries for "table," "wall," "heap."
  *   **Composition:** The application of concepts to reality.

  On this view, saying "It is vague whether these bricks compose a wall" is shorthand for "It is vague whether our concept 'wall' applies to these bricks." This commits you to no fuzzy existence, only fuzzy vocabulary.

  ### 6. Honest Assessment: Is this a "Get Out of Jail Free" card?
  I must be plain with you, as you requested. While the argument above is the strongest case *against* Lewis, it is not without cost.

  If you accept this counter-argument, you are accepting that **ontology is not purely descriptive.** You are admitting that when philosophers ask "What exists?", the answer depends partly on how humans choose to speak and think.
  *   **Lewis's Camp:** Believes philosophy should discover the "joints of nature." If the joints are sharp, our concepts should be sharp. If our concepts are fuzzy, we are failing to describe reality accurately.
  *   **Your Camp (Restricted Composition):** Believes philosophy should describe how we successfully navigate the world. Since our navigation relies on fuzzy concepts (like "chair"), our ontology should reflect that, even if the fundamental physics is sharp.

  **Does the inference go through?**
  Logically? **No.** It is not a contradiction to say "The particles exist precisely, but our categorization of them into objects is vague."
  Metaphysically? **It depends.** If you believe there is a single, absolute sense of "exists" that applies to shoes, moons, and electrons equally (as Lewis did), then Lewis wins. If you believe "exists" is a flexible term that changes meaning depending on context (as the counter-argument suggests), then Lewis loses.

  ### Summary
  You were right to smell a rat. The move from "vagueness in composition" to "vagueness in existence" assumes that *objects* are mind-independent features of the universe like mountains or atoms.

  If you view objects as **conceptual tools** we use to track arrangements of atoms, then the vagueness lies in the *tool*, not the *material*. The material (the atoms) is precise. The tool (the concept "object") is fuzzy. A fuzzy tool does not require a fuzzy world.

  Therefore, you can consistently hold that:
  1.  Composition is restricted (sometimes yes, sometimes no).
  2.  Composition is vague (there are borderline cases).
  3.  Existence is not vague (the atoms exist precisely).
  4.  The "number of objects" is only vague relative to our conceptual scheme, not relative to reality itself.

  This position is philosophically respectable, defensible, and held by many serious metaphysicians. It blocks Lewis's argument by denying that our linguistic categories must map 1:1 onto the fundamental structure of reality.
