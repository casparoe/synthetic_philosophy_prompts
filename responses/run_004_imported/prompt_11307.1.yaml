answer: |-
  The control room smelled of ozone and stale coffee, a sharp contrast to the thin, freezing air outside the dome. Elena watched the monitor, where two distinct streams of data cascaded like digital rain. One stream came from the entangled photons generated in the crystal below her feet; the other came from the sky.

  Specifically, from two quasars. QSO J0834+1836 and QSO J1543-1245. They were barely visible smudges on the finder scope, but on the screen, they were furious engines of randomness, broadcasting light that had begun its journey seven billion years ago.

  "Initiating sequence," Elena said. Her voice sounded flat in the soundproofed room.

  Beside her, Julian didn't look up from his keyboard. "Telemetry locked. Atmospheric transmission is stable. The ancient light is hitting the collectors."

  This was the final run. They had closed the locality loophole years ago, ensuring the measurement choices happened faster than light could travel between the detectors. They had closed the detection loophole, catching enough photons to satisfy the statisticians. But the skeptics remained. They whispered about the "freedom-of-choice" loophole. What if the universe wasn't random? What if some hidden variable, set in motion at the Big Bang, conspired to make the particles *and* the experimenters behave as if they were quantum, when really it was all a script?

  To silence them, Elena and Julian had outsourced the choice. They weren't choosing the measurement settings anymore. The color of the incoming quasar photons decided the angle of the polarizers. If a blue-shifted photon arrived, the polarizer twisted one way; red-shifted, the other.

  If a hidden variable wanted to fake this result, it couldn't just know about the lab in the Canary Islands. It would have had to know about this lab, these crystals, and these specific quasars seven billion years ago, before the Earth was even a cloud of dust. It would have to be a conspiracy spanning deep time.

  "Integration starting," Julian said.

  Elena watched the correlation graph. It hovered near zero, a flat line of nothingness. Then, as the entangled pairs were measured against the settings dictated by the ancient starlight, the line began to climb.

  She felt a familiar tightness in her chest. It was the same feeling she'd had during her PhD defense, or when she'd signed the tenure track papers. A sense of inevitability.

  The number crept past 2.0. The classical limit. In a local, sensible universe, the correlation should not exceed this value. But the line kept climbing. 2.1. 2.3. 2.5.

  "It's holding," Julian whispered. He finally looked up, his face pale in the monitor glow. "The violation is significant. Sigma is... it's off the chart."

  They had done it. They had pushed the possibility of local hidden variables back to the early universe. They had forced reality to show its hand. Either information traveled instantly across space, violating locality, or the universe was superdetermined, a clockwork mechanism wound up at the beginning of time where every "choice" was merely the unfolding of initial conditions.

  Elena stood up and walked to the window. The dome was open. The sky was a crushing weight of diamonds. Somewhere up there, the quasars were burning, sending messengers that had arrived just in time to tell her electrons how to spin.

  "So," Julian said, stretching his back. "We killed local realism. Again. But this time, really."

  "Or we killed free will," Elena said.

  Julian laughed, a short, nervous sound. "Don't start. We chose to point the telescopes. We chose the quasars."

  "Did we?" Elena turned from the window. The room felt smaller now, the walls pressing in. "The light that decided the measurement settings left those quasars when the universe was half its current age. If a hidden variable coordinated that light with the particles in this crystal, that variable was set before our sun existed."

  She walked back to the console and hovered her hand over the power switch. She intended to shut down the system. It was late. They had the data.

  But she paused.

  Why was she shutting it down? Because she was tired? Because the protocol said so? Or because the state of her neurons at this exact moment was the inevitable result of a chain of cause and effect stretching back to those same quasars?

  If the universe was local, she was free, but the world was spooky, connected by invisible threads that ignored distance. If the universe was deterministic, the world was sensible, but she was a ghost haunting a machine.

  "Earth to Elena," Julian said. "You okay?"

  "I was thinking about the coffee," she said.

  "What?"

  "Earlier. When I poured the cup. I thought I chose to add sugar. I thought it was a whim." She looked at the cold mug on the desk. "But if the freedom-of-choice loophole is closed... if the settings were fixed seven billion years ago... then the state of my brain when I walked into this room was fixed then, too."

  Julian sighed, rubbing his eyes. "That's metaphysics, El. We're physicists. We deal with the data. The data says Bell's inequality is violated using cosmological inputs. That's the paper."

  "The data says there is no 'now' that isn't haunted by the 'then'," she corrected.

  She looked back at the screen. The graph was static now, a jagged mountain range proving that the universe did not play by the rules of common sense. It was beautiful, in a terrifying way. It suggested that separation was an illusion. That distance was a lie. That the quasar, the photon, the crystal, and her own hand were not distinct things interacting, but parts of a single, unbroken object stretching across time.

  She reached out and flipped the switch. The hum of the servers died down. The silence rushed in to fill the void.

  "Let's go," she said. "I need air."

  They walked out into the night. The cold hit her like a physical blow, sharp and clarifying. She looked up at the patch of sky where the quasars hid. She raised her hand, palm open, as if to catch the light.

  She wanted to feel the wind on her skin and know it was happening to *her*, that she was the observer and not the observed. She wanted to feel that her next step was hers to take.

  She took a step. Then another.

  The ground was solid. The stars were distant. But as she walked toward the jeep, Elena couldn't shake the feeling that she wasn't moving forward. She was merely unfolding, like a map that had been drawn before she was born, revealing a path that was already there, waiting for her feet to find it.

  "Did you lock the dome?" Julian asked from the driver's seat.

  Elena paused. She thought about the lock. She thought about the key in her pocket. She thought about the seven billion years it took for the light to tell her what to do.

  "Yes," she said.

  She got in the car. She didn't know if she had locked it. She only knew that soon, they would check, and the universe would be consistent with itself, as it always was.
