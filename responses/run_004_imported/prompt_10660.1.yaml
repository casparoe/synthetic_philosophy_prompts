      *   *Stoic:* "Tranquility is not dullness, Madame. It is the absence of the storm."
      *   *The Physical:* She is working on Newton's *Principia* translation. This contrasts the abstract with the physical toll.
      *   *The Climax:* The discussion of her pregnancy/age. The Stoic uses her body as evidence against her philosophy. She uses her mind as evidence against his.

  7.  **Final Polish:**
