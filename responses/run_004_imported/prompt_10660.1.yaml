answer: |-
  **Cirey-sur-Blaise, Autumn 1748**

  The study smelled of wax, old paper, and the sharp, medicinal scent of the tinctures Émilie kept on the sideboard. Outside, the rain battered the shutters of the château, but inside, the fire was low and the candles were burning down. 

  Émilie sat in her high-backed chair, a quilt draped over her knees to hide the swelling of her ankles. On the desk before her lay the manuscript of her *Discours*, the pages weighted by a brass astrolabe. Across from her sat Monsieur de V***, a visitor from Lyon, a man of severe countenance who had studied under the remnants of the Port-Royal logic and now professed a rigid Stoicism.

  He held a few pages of her essay in his hand. He did not look at her, but at the ink.

  "You write, Madame, that to be happy, one must never let go of one's illusions," he said softly. "You argue that we must cultivate them as a gardener cultivates rare flowers. But a gardener knows the difference between the flower and the weed. You seem to suggest the weed is the sustenance."

  Émilie leaned forward, the movement costing her a brief grimace which she smoothed away instantly. "A gardener also knows, Monsieur, that soil without manure is barren. Truth is often barren. It is cold, hard, and offers no nourishment to the soul. If I believe my lover is faithful, and he makes me happy, what profit is there in dissecting his heart to find a stray thought of wandering? The dissection kills the patient."

  "The dissection saves the surgeon," V*** countered, setting the pages down. "When the betrayal comes—and it must, for all men are fallible—the crash is not merely into sadness. It is into ruin. You build a house on sand and call it architecture. When the tide comes, you do not blame the tide. You blame yourself for the foundation. Is that happiness? To court a disaster you could have avoided?"

  "And what do you propose instead?" Émilie asked, her voice sharp. "To walk through the world with a shield of indifference? To look upon a beautiful painting and calculate the cost of the canvas so you are not disappointed when it fades? That is not wisdom, Monsieur. That is death before the fact."

  "I propose *ataraxia*," V*** said. "Tranquility. A mind that is not tossed about by the winds of fortune. If you do not crave glory, you cannot be humiliated by obscurity. If you do not demand perfection in love, you cannot be wounded by infidelity. You speak of the crash. I speak of the steady walk."

  "The steady walk of a sleepwalker," Émilie retorted. She reached for her quill, twirling it between her fingers. "Tell me, honestly. When you wake in the morning, do you feel a surge of purpose? Do you rush to your desk because the universe burns with a mystery you must solve? Or do you rise because it is time to rise?"

  V*** paused. The silence stretched, filled only by the crackle of the fire. "I rise because it is my duty. The surge you speak of is a fever. It consumes the host. I see it in you, Madame. You burn. You translate Newton, you argue with Maupertuis, you manage estates, you conduct affairs of the heart. You are forty-two years old, and you look as though you have lived a century."

  Émilie's hand stilled on the quill. The blow landed, precise and physical. She touched her face, aware of the lines gravity had carved in the last year. 

  "I am tired," she admitted, her voice dropping. "I will not lie to you. The engine runs hot. But tell me, if I extinguish the fire to save the metal, what is the engine for? A clock that never winds keeps perfect time, but it tells no one the hour. I choose the wear. I choose the risk. Because without the passion, without the *illusion* that my work matters, that my love is eternal... I am nothing. I would rather be a ruin that was once a temple than a stone that was never carved."

  "But is it honest?" V*** pressed, leaning in. "You are a woman of science. You deal in the immutable laws of motion. You know that energy is neither created nor destroyed, only transferred. When you spend yourself on illusions, where does the energy come from? It comes from your body. It comes from your reason. You are borrowing against a principal you cannot repay. You write of happiness, but you are writing a justification for exhaustion."

  "Perhaps," Émilie said. "But what is your alternative worth? You offer me a life without pain. But a life without pain is a life without texture. If I protect myself from the grief of loss, I must also protect myself from the joy of possession. To numb the wound is to numb the hand that heals it. Do you not find it gray, Monsieur? This world of yours? Where nothing stings, but nothing sings?"

  "I find it quiet," V*** said. "And in the quiet, one can hear the truth. You say illusions are necessary. I say they are shackles. You are a slave to Voltaire's affection. You are a slave to the Academy's approval. You call these passions 'fuel.' I call them masters. If you lost them tomorrow, who would Émilie du Châtelet be?"

  She looked at him, and for a moment, the mask of the salonnière slipped. The exhaustion was there, deep in the bone, but so was a fierce, terrifying light. 

  "I do not know," she said. "And I am terrified to find out. That is the cost, Monsieur. You ask what I risk by indulging illusion? I risk destruction. I risk looking foolish. I risk dying with my heart in my hand rather than in my chest. But you... you risk nothing. And in risking nothing, you gain nothing. You speak of durability. But a stone is durable. Is a stone happy?"

  "A stone does not suffer," V*** replied, his voice unyielding. "You speak of glory. You speak of love. These are external goods. They are not within your control. To tie your happiness to what you cannot control is the definition of madness. I offer you control. I offer you a fortress."

  "Fortresses are prisons," Émilie said. She picked up the manuscript and tapped it against the desk. "I am writing this because I know the end is closer than the beginning. I feel it. My body is failing. Perhaps you are right. Perhaps I have spent too much, too fast. But if I reach the end and I have felt everything—the betrayal, the triumph, the despair, the ecstasy—then I have lived. If I reach the end and I have been 'tranquil,' I have merely waited."

  V*** stood up. He walked to the window and looked out at the rain. "You speak of living as if it is a performance. As if an audience watches. But the audience leaves, Madame. The lights go out. And you are left alone with your mind. If that mind is a storm, you will drown in the dark."

  He turned back to her. "I do not wish you harm. I wish you peace. Is it not possible to love without idolatry? To work without vanity? To keep the fire, but bank it so it lasts the night?"

  Émilie looked at the candle flame between them. It flickered, dancing, consuming the wick. 

  "Perhaps," she said quietly. "But a banked fire gives little light. And I have so much I still need to see."

  "And when the wax is gone?" V*** asked. "When the wick is ash? Will the darkness not be colder for the brightness that preceded it?"

  Émilie blew out the candle. The room plunged into shadow, save for the dying embers in the grate. 

  "We shall see," she said from the dark. "But until then, I prefer the burn."

  "Then I shall pray," V*** said, his voice barely audible in the gloom, "that you do not require a surgeon when the burning stops."

  "And I," Émilie replied, "shall pray that you do not require a ghost to feel warm."

  Neither moved. The embers settled, glowing red for a moment, then fading into gray ash.
