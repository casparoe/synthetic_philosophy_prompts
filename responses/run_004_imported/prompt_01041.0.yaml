          2.  Personal affection (consciousness of a person's mental qualities + emotion).
      *   **Structure of Personal Affection:** It involves two things: (a) the object (the person's mind/qualities) and (b) the emotion (love/admiration). The *whole* is the intrinsic good.
      *   **Moore's Specific Claim:** He explicitly says personal affection consists in "the appropriate emotion towards the mental qualities of another human being."

  3.  **Address Part 1: Which Commitments Generate the "Trade-Up" Problem?**
      *   *Commitment 1: The Supervenience of Value on Properties.* For Moore, value depends on the intrinsic nature of the object. If the object changes (better qualities), the value of the whole state of affairs changes.
      *   *Commitment 2: Impartiality/Universalism.* Moore is a consequentialist (maximize the good). There is no agent-relative value in his system. My friend's good counts the same as a stranger's good, *ceteris paribus*.
