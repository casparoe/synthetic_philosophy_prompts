answer: |-
  This is an excellent objection, and you have put your finger on one of the most persistent criticisms of Moore's ethics (often echoed later by Bernard Williams regarding "integrity" and "ground projects"). You are describing what we might call the **Substitutability Problem**.

  If love is merely the contemplation of objective value (good qualities), then the beloved is fungible. If Moore's system cannot account for the non-fungibility of persons in close relationships, it fails to capture a central part of the "Ideal."

  Here is an analysis of exactly which commitments generate the problem, and whether the Doctrine of Organic Unities can save him.

  ### 1. Which Moorean Commitments Generate the "Trade-Up" Problem?

  To get the result that you should "trade up" your friend for a stranger with slightly better qualities, three specific commitments in *Principia Ethica* must work in concert:

  **A. The Intentional Object of Affection is Qualities, Not Individuals**
  In Chapter 6 (§112), Moore defines personal affection as "the appropriate emotion towards the mental qualities of another human being."
  *   **The Commitment:** The *object* of your love is not the haecceity (the "this-ness") of the person, but rather their internal mental properties (kindness, intelligence, wit).
  *   **The Consequence:** If the object of the emotion is properties $x, y, z$, then any instantiation of $x, y, z$ is a valid target. The specific substrate holding those properties is irrelevant to the *definition* of the emotion.

  **B. Agent-Neutral Consequentialism**
  Moore is a classical consequentialist regarding duty. We ought to bring about the state of affairs containing the most intrinsic good.
  *   **The Commitment:** There is no agent-relative value. "My friend" has no special moral status simply because they are *mine*. The only thing that matters is the quantity of intrinsic good in the universe.
  *   **The Consequence:** If State of Affairs 1 (I love Friend) contains less intrinsic good than State of Affairs 2 (I love Stranger), I am morally obligated to bring about State of Affairs 2.

  **C. The Supervenience of Value on Intrinsic Properties**
  For Moore, intrinsic value supervenes on intrinsic natural properties.
  *   **The Commitment:** If Person B has the relevant "good qualities" to a higher degree than Person A, then Person B is intrinsically more valuable (or at least, a more valuable object of contemplation).
  *   **The Consequence:** Since the value of the "organic unity" (Love + Object) depends partly on the value of the Object, a "better" Object yields a "better" Whole.

  **Summary of the Logic:**
  1.  Love = Admiration of Qualities.
  2.  Stranger has Better Qualities than Friend.
  3.  Therefore, Admiration of Stranger > Admiration of Friend.
  4.  Therefore, (Love + Stranger) > (Love + Friend).
  5.  Therefore, you ought to switch your love to the Stranger.

  ### 2. Can the "Organic Unities" Doctrine Block This?

  The Doctrine of Organic Unities states that the value of a whole is not identical to the sum of the values of its parts. A part that is neutral in isolation might contribute positively to a whole, or vice versa.

  Moore *could* try to use this to block the trade-up argument, but it requires a specific maneuver regarding **what counts as part of the "Whole."**

  #### The Defense: Relational Properties as Part of the Object
  Moore can argue that the "Organic Unity" of personal affection is not just `[My Emotion] + [Their Virtues]`. It is `[My Emotion] + [Their Virtues] + [The History of Our Relation]`.

  If the "mental qualities" contemplated include relational properties—such as "being the person who raised me," "being the person with whom I share a history," or "being the person who trusts me"—then the Stranger *does not* have the same qualities as the Friend.
  *   **Friend:** Has virtues $x, y, z$ **plus** relational property $R$ (shared history).
  *   **Stranger:** Has virtues $x+, y+, z+$ **but lacks** $R$.

  If the Organic Unity of `[Love + Virtues + Shared History]` is more valuable than `[Love + Better Virtues + No History]`, then you should not trade up. The "Shared History" functions as a unique quality that cannot be outbid.

  #### Does this work within Moore's system?
  It works **only if** Moore accepts that relational/historical properties can be part of the *intrinsic* object of admiration. This is where he runs into trouble.

  **1. The "Isolation Test" Problem**
  Moore's method for finding intrinsic value is the "Method of Isolation." We must imagine the thing existing in absolute isolation.
  *   Can a "shared history" exist in isolation? No, it is essentially relational.
  *   Moore typically treats relations as instrumental or as part of the causal background, not as intrinsic goods themselves. If he admits relational properties into the *intrinsic* good, he complicates his non-naturalist realism significantly. He wants goods to be universal; "being *my* friend" is particular.

  **2. The Emotion Mismatch**
  Moore equates the emotion in personal affection with **admiration**.
  *   Admiration is responsive to merit. If someone is more meritorious, they are more admirable.
  *   Love (in the sense required to block the trade-up) is responsive to **attachment**.
  *   If Moore insists the emotion is *admiration*, then even if the Friend has the unique quality of "Shared History," the Stranger might still be *more admirable* overall. Unless "Shared History" is weighted so heavily that it outweighs the Stranger's superior virtues, the trade-up logic remains.
  *   To block this, Moore would have to argue that the *consciousness of the specific relation* is such a massive intrinsic good that it trumps superior virtues elsewhere. He hints at this when he says the reciprocal consciousness of being loved is a great good, but he doesn't fully develop the idea that the *particularity* itself is the source of the value.

  **3. The Consequentialist Pressure**
  Even if Moore successfully argues that `[Love + Friend]` is a more valuable Organic Unity than `[Love + Stranger]`, he must prove this is *always* or *generally* true.
  *   What if the Stranger is a Saint and the Friend is merely Decent?
  *   If the value of the Organic Unity is calculated by summing the goods, a sufficiently virtuous Stranger could still outweigh the "Shared History" bonus of the Friend.
  *   To fully block the trade-up, Moore would need to introduce an **agent-relative constraint** (e.g., "You must maximize the good, *except* in cases of established affection"). But this contradicts his universalist consequentialism.

  ### 3. Conclusion: Can he save it without abandoning the account?

  **Strictly speaking: No.**

  Moore cannot block the "trade-up" result using *only* the Doctrine of Organic Unities **without** modifying his definition of affection.

  *   **If he keeps "Admiration" as the core emotion:** The logic of merit applies. Better qualities = more admiration = obligation to switch. Organic unities can add a "bonus" for history, but it remains a quantifiable bonus that can be mathematically outbid by a sufficiently virtuous stranger.
  *   **If he keeps "Consequentialism":** He must always choose the option that produces the most good. If the Stranger scenario produces more good, he must switch.

  **The Only Way Out:**
  To save the intuition about loyalty, Moore would have to argue that the **Organic Unity of "Loving *This* Particular Person"** is a *sui generis* good that does not supervene on the *degree* of the person's qualities.

  He would have to claim that the value lies not in `Emotion + Qualities`, but in `Emotion + Commitment`. But this effectively abandons the "admiring-contemplation" account. It moves from an **evaluative** model of love (I love you because you are good) to a **volitional** model (I love you, and that commitment makes the relationship good).

  **Seminar Discussion Point:**
  You can press your seminar on this specific tension: Moore wants to have his cake and eat it too. He wants love to be an *intrinsic good* (which requires it to be about objective qualities) but he also wants it to be *personal affection* (which implies particularity).
  *   If he leans into **qualities**, he gets the Trade-Up Problem.
  *   If he leans into **particularity**, he threatens his universalist, non-naturalist meta-ethics (because "being my friend" isn't a universal property).

  Moore essentially sacrifices the phenomenology of loyalty on the altar of objective value. A Moore-style Organic Unity view can mitigate the problem by valuing "shared history" as a quality, but it cannot fully solve it without ceasing to be Moorean consequentialism.
