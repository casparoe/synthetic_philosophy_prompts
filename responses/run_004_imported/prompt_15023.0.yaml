      *   *Pragmatics:* The manager isn't arguing about the *code's logic*; they are arguing about the *consequences of being wrong*.
      *   *The "Knowledge" Claim:* When the user says "we know this works," they mean "the probability of error is negligible." The manager hears "we accept the risk of error." In high stakes, "negligible" needs to be *much smaller*.

  3.  **Deconstruct the Manager's Perspective:**
      *   Why would identical tests be insufficient for high stakes?
      *   *Coverage vs. Reality:* 100% unit test coverage doesn't mean 100% *scenario* coverage. It means every line is touched. It doesn't mean every edge case of the *environment* or *integration* is covered.
      *   *Integration Context:* The dashboard might display data. The settlement job *moves* money. The integration points differ. Does the function receive data differently? Is there race conditioning? Is there idempotency?
      *   *Cost of Error:* If the dashboard is wrong, you fix a chart. If settlement is wrong, you lose money, face regulatory fines, or lose customer trust.
      *   *Burden of Proof:* The burden of proof scales with the cost of being wrong.

  4.  **Deconstruct the User's Perspective:**
      *   Logically consistent. $f(x)$ is $f(x)$.
