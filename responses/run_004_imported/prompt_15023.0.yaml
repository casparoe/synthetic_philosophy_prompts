      *   **Concept: "Pragmatic Encroachment":** This is a philosophical concept where stakes affect whether a belief counts as knowledge. (e.g., "I know the bank is open Saturday" is true for planning a visit, but maybe not "known" enough to bet your mortgage on it without calling first).
      *   **Engineering Concepts:**
