      *   **The Evidence:** 100% unit test coverage, code reviewed, running in prod for months with zero incidents.
      *   **The Conflict:** The user claims "we know this works" for both. The team agrees for the dashboard. The manager pushes back hard for the settlement job, demanding more testing despite identical evidence.
