answer: |-
  Your intuition is shared by many of the most influential philosophers and economists who have studied intergenerational equity. What your sister is proposing is known in economics and ethics as **pure time preference** (or a positive pure rate of time discounting).

  While it is common in *financial* calculations to discount future cash flows, applying that same logic to *human welfare* purely because of temporal distance is widely considered ethically indefensible in normative philosophy.

  Here is a breakdown of why your reaction is likely correct, the arguments your sister might be relying on, and how to distinguish between valid and invalid forms of discounting.

  ### 1. The Ethical Consensus: Ramsey's Dictum
  The strongest argument against your sister's position comes from the mathematician and philosopher Frank Ramsey. In his seminal 1928 paper on saving and utility, he wrote:

  > *"It is assumed that we do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible and arises merely from the weakness of the imagination."*

  Ramsey's point is that from an impartial moral standpoint, the date on which a person is born should not affect the moral weight of their wellbeing. A unit of happiness (or suffering) experienced by a great-grandchild in 2090 is morally equivalent to a unit of happiness experienced by a grandchild in 2035. To claim otherwise is to discriminate against people based solely on their location in time.

  ### 2. The "Discrimination by Date" Argument
  Philosopher Derek Parfit and economist John Rawls both argued that time is morally analogous to space.
  *   **Spatial Analogy:** If you had two cousins, one living in New York and one living in Sydney, would you argue that the cousin in Sydney deserves less money simply because they are farther away from you geographically? Most people would say no; distance is not a morally relevant characteristic.
  *   **Temporal Application:** Similarly, temporal distance is not a morally relevant characteristic. Your great-grandchildren are just as real as your grandchildren; they just exist at a different coordinate on the timeline. Discounting their welfare purely because they are "further away" in time is a form of bias similar to racism or sexism—it privileges one group over another based on an arbitrary characteristic they cannot control.

  ### 3. Distinguishing Valid vs. Invalid Discounting
  It is important to distinguish your sister's proposal from other forms of discounting that *are* defensible. In economics, there are three main reasons to value future resources less than present ones. Your sister has already ruled out the first two, leaving only the controversial third:

  1.  **Investment Growth (Opportunity Cost):** Money available now can be invested to grow into more money later. *Your prompt specifies this is already adjusted for.*
  2.  **Probability/Uncertainty (Existential Risk):** There is a chance the trust won't exist, the family line will end, or the beneficiaries won't be born. It is rational to discount for the *probability* that no one will be there to collect. *Your prompt implies this is also accounted for ("uncertainty about who will actually be around").*
  3.  **Pure Time Preference:** This is the claim that future wellbeing is intrinsically less valuable than present wellbeing. **This is the controversial claim.**

  **A Fourth Consideration: Diminishing Marginal Utility**
  There is one valid ethical reason to give future generations a smaller *financial* share, but it is not what your sister is arguing. If we expect future generations to be vastly wealthier than we are (due to technological progress), a dollar might buy them less *happiness* than it buys us. This is discounting based on **wealth**, not time. However, your sister's reasoning is explicitly that "wellbeing counts for less," not that "they will be richer."

  ### 4. Why Your Sister Might Feel This Way
  If the ethical argument against her is so strong, why does the idea feel intuitive to her?
  *   **Psychological Immediacy:** Humans are psychologically wired to care more about the present. We can visualize our grandchildren; we cannot visualize our great-grandchildren. She may be conflating *how we feel* (descriptive psychology) with *what is right* (normative ethics).
  *   **Agency:** We can help people who exist now. We cannot help people who don't exist yet. Some argue this creates a stronger obligation to the present. However, in the context of a trust, the resources are already set aside. The "sacrifice" is already made; the only question is how to divide the pie among future recipients.
  *   **Infinite Obligation:** If we value the future equally with the present, do we owe everything to the future? (This is a common argument in climate change ethics). However, in a private family trust, the obligation is bounded by the assets in the trust, so this "infinity problem" doesn't apply.

  ### 5. Implications for a Family Trust
  In the specific context of a family stewardship vehicle, your sister's rule could have negative practical effects:
  *   **Symbolic Inequality:** It establishes a hierarchy of worth among descendants. It tells the 2090 generation, "You matter less to us than the 2035 generation." This could foster resentment or a sense of disconnection from the family legacy.
  *   **Stewardship vs. Consumption:** A multi-generational trust is usually about stewardship—preserving capital for the lineage. Pure time discounting treats the trust more like a consumption fund that loses value the longer it is held, which contradicts the goal of perpetual benefit.

  ### Conclusion
  Your sister is not "wrong" in the sense that she is violating a law of physics; pure time preference is a parameter that can be plugged into a spreadsheet. However, she is likely **ethically mistaken.**

  The consensus among moral philosophers is that **discounting welfare purely due to temporal distance is indefensible.** It privileges the present generation over future generations without a morally relevant justification.

  **Suggested Compromise:**
  If she is worried about the future becoming too abstract, you could agree to discount for **uncertainty** (the risk the trust dissolves) or **expected wealth increases** (if you believe descendants will be richer and need less), but you should resist discounting the *moral weight* of their wellbeing simply because they are born later.

  A fair trust treats all beneficiaries as equal members of the family lineage, regardless of when they take their turn in the spotlight.
