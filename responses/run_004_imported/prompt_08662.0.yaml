answer: |-
  This is a sophisticated query that touches on one of the most active areas in contemporary moral philosophy. You are correct that the debate has moved beyond simple definitions of hypocrisy into the metaphysics and normativity of *blame* itself. The central question is no longer "What is hypocrisy?" but "What gives an agent the normative power to hold another agent accountable?"

  Here is a conceptual map of the debate on **Standing to Blame**, structured around the tensions you identified: normative disability vs. insincerity, the status of past inconsistency, and the distinction between *tu quoque* and standing.

  ### 1. The Core Distinction: Truth vs. Standing
  To navigate this literature, one must first accept the premise that **the truth of the blame** and **the standing of the blamer** are distinct normative categories.

  *   **The Truth Condition:** Is the act blamed actually wrong? (In your case: Yes, everyone agrees exploiting the mother is wrong.)
  *   **The Standing Condition:** Does the blamer have the right/authority/appropriateness to issue this blame?

  If you lack standing, it does not mean your brother's action was permissible. It means that *you* are not the proper agent to register that complaint. The analogy you drew to legal standing is precisely the one many philosophers (notably **Christopher Fritz** and **Daniel Miller**) utilize. In law, a plaintiff may have a valid claim that a law was broken, but if they are not the injured party or have "unclean hands," the court dismisses the case without ruling on the merits of the violation.

  The philosophical debate is about whether moral life works like a court (where standing is a procedural barrier) or like a town square (where anyone can shout the truth).

  ### 2. Position A: The Normative Power / Authority View
  **Key Proponents:** R. Jay Wallace, Christopher Fritz, Daniel Miller.
  **The Thesis:** Blame is not just a description of wrongdoing; it is a **speech act** that demands accountability. It implicitly claims a position of authority over the wrongdoer.

  *   **Wallace's Account:** In *The View from Here* and related papers, Wallace argues that blame is a form of moral address. It treats the wrongdoer as a responsible agent within a community of equals. When you blame someone, you are invoking a shared norm.
  *   **The Hypocrisy Objection:** If you violate the very norm you are invoking, you undermine the presuppositions of the address. You are effectively saying, "We are both bound by this rule, but I am exempt." This treats the wrongdoer not as an equal, but as a subordinate whom you can police while exempting yourself.
  *   **Normative Disability:** On this view, lacking standing is a genuine normative disability. It is not just that you are annoying; it is that your blame is *morally inappropriate* or *unfair*, even if true. You have forfeited the right to demand compliance because you have refused to be bound by the demand yourself.

  ### 3. Position B: The Commitment / Sincerity View
  **Key Proponents:** Macalester Bell, some interpretations of G.A. Cohen.
  **The Thesis:** Blame expresses a commitment to certain values (reactive attitudes like indignation). Hypocrisy reveals a lack of genuine commitment.

  *   **The Insincerity Charge:** When you blame someone, you express indignation. If you are a hypocrite, your indignation is revealed to be selective or instrumental. You aren't actually angry about the *wrong*; you are angry about the *person* or using the wrong as a weapon.
  *   **Epistemic vs. Normative:** Some philosophers in this camp argue that "standing" is overwrought. What is actually happening is that hypocrisy provides **evidence** that the blamer does not truly care about the moral value. Therefore, the blame is less credible or less fitting, but there is no distinct "right to blame" that is lost. It is a reductionist view: "Standing" is just a shorthand for "Your emotions are unfitting because they are insincere."

  ### 4. Position C: The Skeptical / Tu Quoque View
  **Key Proponents:** Some consequentialists, older analytic traditions.
  **The Thesis:** There is no such thing as moral standing to blame. There is only the truth of the accusation.

  *   **The Fallacy Argument:** This camp holds that the "standing" objection is merely the *tu quoque* fallacy dressed up in moral language. *Tu quoque* ("you also") is a logical fallacy because the truth of a proposition ("Stealing is wrong") is independent of the speaker ("You steal").
  *   **The Danger:** Skeptics argue that granting a "right to blame" creates a moral silence where wrongdoers can shield themselves by pointing out the flaws of their critics. If only the sinless can rebuke sin, then morality loses its enforcement mechanism.
  *   **Counter to Skeptics:** Proponents of standing argue the skeptics confuse *asserting a fact* with *holding accountable*. Anyone can say "That act violates norm X." Only those with standing can say "I hold *you* accountable for X."

  ### 5. The Crucial Nuance: Past Inconsistency vs. Hypocrisy
  This is the specific pivot point for your situation. Philosophers distinguish between **current hypocrisy** and **past inconsistency**.

  *   **The Definition of Hypocrisy:** In the standing literature, hypocrisy is generally defined not merely as doing what you forbid, but as **pretending to be exempt from a norm you enforce on others.**
  *   **Reform and Standing:** Most contemporary theorists (including Wallace) argue that **past wrongdoing does not permanently negate standing.**
      *   *The Logic:* Standing is grounded in your *current* commitment to the norm. If you violated the norm in the past but have since repented, reformed, and now genuinely endorse the norm as binding on yourself, you have restored your standing.
      *   *The Condition:* The reform must be genuine. If you are blaming your brother while secretly wishing you could still exploit your mother, you lack standing. If you blame him because you now see the harm clearly and hold yourself to the standard, you have standing.
  *   **The "Clean Hands" Objection:** Your aunt's view ("you're the last person to lecture") relies on a **purity model** of standing. This suggests that once you violate a norm, you are morally "stained" and lose the authority to enforce it forever.
      *   *Philosophical Verdict:* This view is largely rejected in modern ethics because it makes moral growth impossible. It implies that the reformed sinner has less moral authority than the person who simply never had the opportunity to sin. Most philosophers argue that the reformed sinner often has *more* insight into the harm, provided they acknowledge their past.

  ### 6. Synthesizing the Debate: Is it *Tu Quoque* or Standing?
  You asked whether "you're a hypocrite" is ever more than *tu quoque* in a nicer outfit. The philosophical consensus is **yes**, provided we distinguish the *target* of the criticism.

  *   **Tu Quoque:** Attacks the **truth** of the claim. ("You stole, so stealing isn't wrong.") -> **Fallacious.**
  *   **Standing Objection:** Attacks the **appropriateness of the address**. ("You stole, so you are not the one who gets to call me to account.") -> **Potentially Valid.**

  However, the validity depends on the **nature of the inconsistency**.

  1.  **Concurrent Hypocrisy:** You are currently doing the thing you are blaming me for. (Strong loss of standing).
  2.  **Past Inconsistency (Reformed):** You did it, stopped, and now blame me. (Standing is usually retained, *unless*...)
  3.  **The "Self-Exemption" Clause:** Even with past inconsistency, you lose standing if you blame *without acknowledging your own past*.
      *   *Why?* Because blaming without acknowledgment implies a discontinuity in your moral identity that suggests you don't view yourself as bound by the same history of accountability.
      *   *Wallace's Insight:* To blame as a moral equal, you must acknowledge that you are part of the same moral community. If you act as though your past violations are irrelevant while highlighting mine, you are asserting a hierarchy.

  ### 7. Mapping Your Situation
  Applying this conceptual map to your case without issuing a verdict:

  *   **The Brother's Defense:** He is using a *tu quoque* structure ("You did it too") to attempt a *standing* defeat ("You can't blame me").
  *   **The Family's Reaction:** They seem to be operating on a **Purity Model** (Position C / Aunt's View). They view moral authority as something that can be permanently forfeited by past action.
  *   **The Philosophical Counter-Argument (Position A/B):** If you have genuinely reformed, you possess standing. However, the *manner* of your confrontation matters.
      *   If you confronted him as a judge from a high bench ("I am right, you are wrong"), the family perceives hypocrisy because you are hiding your past.
      *   If you confronted him as a fellow struggler ("I did this, it was wrong, I stopped, and you need to stop"), you assert standing through **solidarity** rather than **superiority**.

  ### 8. Summary of the Conceptual Map
  1.  **Is Standing Real?**
      *   *Yes (Wallace/Fritz/Miller):* It is a normative power related to moral equality and authority.
      *   *No (Skeptics):* It is just credibility or an ad hominem distraction.
  2.  **Why Does Hypocrisy Matter?**
      *   *Authority View:* It violates the equality of the moral community (I exempt myself).
      *   *Sincerity View:* It shows you don't actually care about the value you're defending.
  3.  **Does Past Wrongdoing Kill Standing?**
      *   *Generally No:* Reform restores standing.
      *   *Caveat:* Standing is lost if the blamer fails to acknowledge their own fallibility, thereby re-introducing the claim of exemption.

  The strongest philosophical case against you is not that you *did* the thing, but that in the act of blaming, you may have implicitly claimed a moral superiority that your history contradicts. The strongest case for you is that standing is forward-looking (based on current commitment to norms), not backward-looking (based on moral purity).

  The debate ultimately hinges on whether we view blame as a **weapon of the righteous** (where your aunt is right) or as a **tool of the community** (where the reformed are essential to maintaining norms). Most contemporary moral philosophers favor the latter.
