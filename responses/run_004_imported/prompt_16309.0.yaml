answer: |-
  **MEMORANDUM**

  **TO:** Town Ethics Board
  **FROM:** [Your Name/Board Member]
  **DATE:** [Current Date]
  **RE:** Recommendation on Motion to Dismiss for Lack of Standing (Complaint #2023-04)

  **ISSUE**
  The Respondent moves to dismiss the complaint for lack of standing, arguing the Complainant's prior uncharged conduct precludes them from invoking the Board's process. We must determine whether the Complainant's history affects the Board's duty to adjudicate the undisputed facts.

  **ANALYSIS**
  **1. Textual Authority.** The Code states "any resident" may file. It imposes no moral character requirement on the filer. To read an implicit "clean hands" limitation into the text would require amending the Code, not interpreting it.

  **2. Nature of Standing.** In ethics enforcement, the "injury" is to public trust, not the Complainant personally. The Complainant functions as a witness or source of information, not a litigant seeking damages. Therefore, traditional equitable bars to standing do not apply. The Board's jurisdiction is triggered by the *allegation*, not the *allegor*.

  **3. Judicial Economy.** Several members noted the Board could dismiss this complaint and open a *sua sponte* inquiry into the same facts. While procedurally permissible, this creates redundant work without altering the outcome. It prioritizes the Complainant's identity over the Respondent's conduct. If the facts warrant sanction, they warrant sanction regardless of who brought them to light.

  **4. Selective Enforcement.** The Complainant's prior uncharged conduct highlights a risk of selective enforcement. However, the remedy for past under-enforcement is consistent future enforcement, not continued immunity. Dismissing a valid complaint because others were not caught previously undermines the Code's deterrent value.

  **RECOMMENDATION**
  **Deny the Motion to Dismiss.** The Board should proceed immediately to a merits hearing. The Complainant's credibility is irrelevant because the facts are undisputed.

  **PROPOSED TIMELINE**
  *   **Tuesday Vote:** Deny Motion to Dismiss.
  *   **Within 5 Days:** Issue Notice of Hearing to Respondent, confirming undisputed facts as the sole agenda.
  *   **14 Days from Vote:** Conduct Merits Hearing (limited to mitigating circumstances/sanction, as liability is clear).
  *   **7 Days Post-Hearing:** Issue Written Findings and Determination.

  **NOTE ON POLICY**
  While the Complainant's history does not bar this filing, the Board should separately schedule a workshop to review referral protocols. We must ensure future consistency so that enforcement does not appear dependent on who files a complaint.

  **CONCLUSION**
  Dismissal would elevate procedural technicalities over substantive ethics. The Board's duty is to the Code and the public, not to policing the purity of those who report violations. Proceed to merits.
