prompt: |-
  I volunteer on my town's ethics board, which hears conflict-of-interest complaints against elected officials. Our code lets any resident file a complaint but says nothing about standing. We're reviewing one that accuses a council member of accepting a paid weekend trip from a contractor now bidding on town work; the facts aren't disputed. The complaint came from a fellow council member who took a nearly identical trip from a different contractor years ago and was never charged, only because nobody filed against him at the time. The accused's attorney wants the case dismissed for lack of standing, and several board members agree; others note that our code also lets the board open its own inquiry into the same facts even if this complaint is dismissed, so dismissal would remove this complainant without actually clearing the accused. I need the board's short written opinion before Tuesday's vote: recommend one concrete path forward with a timeline, and engage the standing objection on its own terms rather than wave it away as mere 'whataboutism.'
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Volunteer on a town ethics board.
      *   **Task:** Write a short written opinion for the board's vote (due before Tuesday).
      *   **Context:** A complaint against a council member for accepting a paid trip from a bidding contractor. Facts are undisputed.
      *   **Complication:** The complainant is a fellow council member who took a similar trip years ago but wasn't charged (no complaint filed then).
      *   **Legal/Procedural Issue:** The code allows *any* resident to file but is silent on "standing." The accused's attorney argues lack of standing (likely due to the complainant's hypocrisy/potential ulterior motive). Some board members agree. Others note the board can self-initiate an inquiry anyway.
      *   **Constraint:** Recommend one concrete path forward with a timeline. Engage the standing objection on its own terms (don't dismiss it as "whataboutism").
      *   **Tone:** Professional, legalistic but accessible, ethical, decisive.

  2.  **Deconstruct the "Standing" Argument:**
      *   *Attorney's Position:* The complainant lacks standing because they are similarly tainted (unclean hands) or because the code implies a narrower class of complainants despite saying "any resident."
      *   *Code Text:* "Lets any resident file a complaint but says nothing about standing."
      *   *Legal Principle:* In administrative/ethics contexts, if the code says "any resident," standing is usually broad. However, the attorney is likely arguing *equitable standing* (unclean hands) or *procedural abuse*.
      *   *Board's Dilemma:* Dismissing on standing might look like protecting the accused or ignoring the text. Accepting the complaint might look like allowing vindictive/hypocritical enforcement.
      *   *Key Insight:* The prompt asks to engage the objection *on its own terms*. This means addressing whether the complainant's past conduct affects their *right* to file, not just whether it's annoying.
      *   *Resolution:* The code says "any resident." Past conduct of the complainant does not legally strip them of statutory right to file unless the code says so. However, the *merits* of the complaint are separate from the *complainant*. The board's duty is to the code, not the complainant.

  3.  **Evaluate the "Self-Initiation" Option:**
      *   Some members say: Dismiss this, then open our own inquiry.
      *   *Pros:* Removes the "hypocritical" complainant from the equation.
      *   *Cons:* Wastes time (two proceedings), looks like game-playing, delays resolution.
      *   *Better Approach:* Acknowledge the board's independent duty. The complaint is a *trigger*, not the *source* of authority. The board has authority to investigate regardless of who files. Therefore, the complainant's status is secondary.

  4.  **Formulate the Recommendation:**
      *   *Path:* Deny the motion to dismiss for lack of standing. Proceed to merits hearing.
      *   *Reasoning:* The code grants broad filing rights. The complainant's history is irrelevant to the *filing* right but relevant to *credibility* (if needed) or simply irrelevant to the *facts* (which are undisputed). The board's duty is to enforce the code, not police complainants.
      *   *Timeline:* Needs to be concrete. Vote Tuesday -> Notice -> Hearing -> Decision.
      *   *Addressing the "Hypocrisy":* Acknowledge it. It doesn't bar standing, but the board should note that selective enforcement is a systemic issue to address later, not a reason to ignore current violations.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Issue:** Define the standing objection clearly.
      *   **Analysis (The "Engagement"):**
          *   Textual interpretation: "Any resident" means what it says.
          *   Equitable argument: Does "unclean hands" apply? In ethics enforcement, the public interest outweighs the complainant's purity. The violation harms the public, not just the complainant.
          *   The "Self-Initiation" point: Acknowledge it. If the board can self-initiate, the complaint is just a notification. Dismissing it forces redundant work.
      *   **Recommendation:** Deny dismissal. Proceed to merits.
      *   **Timeline:** Specific dates/steps.
      *   **Caveat/Policy Note:** Address the past inconsistency (the other council member) as a matter for future policy/training, not current exculpation.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "any resident means any resident" too simplistic?
      *   *Fix:* Strengthen it. The board's jurisdiction stems from the *allegation*, not the *allegor*. The harm is to public trust. Therefore, standing is liberally construed.
      *   *Critique:* How do I handle the "unclean hands" argument seriously?
      *   *Fix:* Argue that ethics codes are remedial for the public good. Barring a complainant based on past uncharged conduct undermines the public interest. It conflates the *messenger* with the *message*.
      *   *Critique:* The prompt asks for a "short written opinion." Keep it tight.
      *   *Timeline:* Make it realistic. Vote Tuesday. Hearing in 14 days. Decision 7 days after.

  7.  **Final Polish:**
      *   Ensure the tone is impartial.
      *   Check that the "standing" objection is treated legally, not emotionally.
      *   Ensure the recommendation is concrete.

  8.  **Final Review against Constraints:**
      *   Short written opinion? Yes.
      *   Recommend one concrete path? Yes (Proceed to merits).
      *   Timeline included? Yes.
      *   Engage standing objection on its own terms? Yes (Textual + Public Interest analysis).
      *   Avoid "whataboutism" dismissal? Yes (Address the hypocrisy as a systemic issue, not a personal attack).

  *(Self-Correction on "Standing" Logic)*: Wait, if the code is silent on standing but allows "any resident" to file, the attorney is arguing *equitable* standing or *abuse of process*. I need to make sure I don't just say "code says resident." I need to explain *why* the complainant's history doesn't negate that.
  *Argument:* The board's authority is inquisitorial, not adversarial. The complainant is a witness/source, not a party. Therefore, traditional standing doctrines (like injury-in-fact) don't apply strictly, and "unclean hands" is not a bar to filing a tip. The Board acts for the public.

  *Revised Plan:*
  1.  **Decision:** Deny Motion to Dismiss.
  2.  **Reasoning:**
      *   Text: "Any resident."
      *   Function: Complainant is a source, not a litigant.
      *   Public Interest: Violations hurt the town, not just the complainant.
      *   Efficiency: Self-initiation is available but redundant.
  3.  **Timeline:** Vote -> Schedule Hearing -> Issue Findings.
