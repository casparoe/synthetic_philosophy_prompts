      *   No reassurance? Yes.
      *   Address the philosophical implication? Yes.

  8.  *(Final Polish of the text)*: Ensure the distinction between *explaining* and *excusing* is clear. Ensure the distinction between the *man* and the *character* is clear. (Proceed to generate output).

