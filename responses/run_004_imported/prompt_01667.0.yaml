  One of the most contentious and nuanced cases in evolutionary behavioral science isn't a peacock's tail or a gazelle's stot, but rather **human big-game hunting** (specifically among hunter-gatherer societies like the Ache of Paraguay or the Hadza of Tanzania).

  This example is perfect for your question because it sits right on the fault line between **Costly Signaling Theory (CST)** and **Reciprocal Altruism/Risk Pooling**, and it is genuinely difficult to empirically disentangle them.

  ### The Behavior
  In many traditional foraging societies, men often pursue large, dangerous game (like monkeys, wild pigs, or antelope) rather than small, reliable game (like tubers or rodents), even when the large game provides a *lower* average caloric return per hour of effort. Furthermore, when a hunter successfully kills a large animal, he typically does not keep the meat for his own family. Instead, it is distributed widely across the camp, often to people who are not kin.

  ### The Costly Signaling Explanation (The "Show-Off" Hypothesis)
  Proponents of CST (such as anthropologists Kristen Hawkes and Rebecca Bliege Bird) argue that this behavior is a classic handicap signal.
  *   **The Cost:** Hunting large game is dangerous (risk of injury/death) and inefficient (high variance; you might come back empty-handed for days).
  *   **The Signal:** Successfully killing a large animal and giving it away demonstrates that the hunter possesses surplus energy, superior skill, and bravery. He is saying, "I am so high-quality that I can afford to waste resources on this risky endeavor and still survive."
  *   **The Benefit:** The payoff isn't the meat (which he gives away); it is **social status**. High-status hunters gain political influence within the group and, crucially, increased reproductive opportunities (including extramarital affairs or wives for their sons). The cost ensures the signal is honest; a low-quality hunter cannot afford to hunt large game consistently without starving.

  ### The Compelling Alternative: Risk Pooling (Reciprocal Altruism)
  The strongest alternative explanation is not that the behavior is a signal, but that it is a form of **insurance**.
  *   **The Logic:** Large game is "high variance." One day you have 5,000 calories, the next you have zero. Small game is "low variance." If everyone hunts small game, everyone eats a little every day. If everyone hunts large game, some feast and some starve.
  *   **The Mechanism:** By sharing the large kill widely, the hunter is contributing to a "risk pool." He is effectively saying, "I will feed you when I get lucky, so you will feed me when you get lucky."
  *   **The Evolutionary Reason:** This isn't signaling quality; it is **variance reduction**. It stabilizes the food supply for the entire band, increasing the survival odds of the hunter's own kin (who are part of the band) during his unlucky streaks. The behavior is selected for because it prevents starvation, not because it advertises prowess.

  ### Why It Is So Hard to Rule Out Either Explanation
  This is where the rabbit hole gets deep. Distinguishing between these two hypotheses is notoriously difficult for several reasons:

  1.  **Behavioral Equivalence:** Both theories predict the exact same behavior: hunting risky prey and sharing the meat widely. You cannot distinguish a "signal" from an "insurance premium" just by watching the transaction.
  2.  **Overlapping Fitness Benefits:** In small-scale societies, **status** and **survival** are intertwined. A high-status hunter (CST) is more likely to receive help when he is sick or injured. A hunter with good insurance partners (Risk Pooling) is more likely to be respected. The fitness outcomes (survival and reproduction) look identical in the data.
  3.  **The "Cost" Ambiguity:** For CST to work, the cost must be a *handicap* (wasteful). For Risk Pooling to work, the cost is an *investment* (premium). If the hunter gets meat back later, it was insurance. If he gets status/mates, it was signaling. In practice, he likely gets *both*. Disentangling which benefit was the primary driver of selection is statistically nearly impossible with observational data.
  4.  **A Third "Side Effect" Alternative:** There is a third explanation that fits your "side effect" criteria: **Skill Acquisition.** Hunting large game might be costly practice for skills needed in warfare or defense. The sharing might be a byproduct of group cohesion mechanisms selected for other reasons. In this view, the "signaling" is incidental to the real function (training), and the "sharing" is incidental to group bonding.

  ### The Verdict
  Even after decades of study, evolutionary anthropologists are still divided. Some data supports CST (hunters often have higher reproductive success even when controlling for food provision), but other data supports Risk Pooling (sharing networks correlate with survival during lean seasons).

  This example illustrates the core problem you identified: **Costly behaviors are often multifunctional.** A behavior can be an honest signal *and* a reciprocal insurance policy *and* a skill-building exercise simultaneously. Evolution is a tinkerer, not an engineer; it rarely selects for a single, pure function when a behavior can piggyback on multiple adaptive benefits. This makes ruling out CST in favor of an alternative (or vice versa) exceptionally difficult in real-world systems.
