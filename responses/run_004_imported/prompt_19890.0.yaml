          *   Timing: Irrelevant. Pattern matters.
          *   Secondhand: Risky, but doesn't change the principle.
      *   *Section 5: Actionable Advice.* How to handle Priya? How to handle Marcus?
      *   *Conclusion:* Summarize. You're both right in different domains.

  6.  **Refining the Tone:**
