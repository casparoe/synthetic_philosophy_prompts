      *   *Section 2: OP's Point (Social Standing).* Explain *why* it felt wrong. It's about moral authority. Use the concept of "Clean Hands."
      *   *Section 3: The Crucial Distinction.* It's not about the *act* of gossiping, it's about the *posture*. Priya's posture is superiority. That's the real offense.
      *   *Section 4: Addressing the Nuances.*
