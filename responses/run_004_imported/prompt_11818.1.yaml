answer: |-
  # The Myth of Rational Irrationality: Policy, Agency, and the Hitchhiker's Fare

  Parfit's Hitchhiker is not merely a puzzle about desert survival; it is a stress test for the architecture of agency. The setup is brutal in its simplicity: a dying traveler is offered a ride by a driver who can read faces with near-perfect accuracy. The driver will only save the traveler if she predicts he will pay the fare upon reaching town. Once in town, however, the traveler faces a choice: pay and lose money, or default and keep it. Since the ride is already secured, the payment has no causal influence on the rescue. Causal Decision Theory (CDT) dictates that a rational agent maximizes expected utility based on the causal consequences of their *current* act. By that light, keeping the money is the rational choice. Yet, an agent who reasons this way will not be picked up and will die.

  Derek Parfit drew a startling conclusion from this impasse: to survive, an agent must be disposed to act "irrationally" at the moment of payment. He termed this "rational irrationality"—the idea that successful agency sometimes requires cultivating dispositions to violate act-by-act rationality later. This verdict has haunted decision theory for decades. However, it rests on a specific, contestable assumption about what rationality evaluates. Competing frameworks, from David Gauthier's constrained maximization to modern Functional Decision Theory (FDT), argue that the paradox dissolves if we shift the unit of evaluation from isolated acts to policies or dispositions.

  This essay argues that "rational irrationality" is not a genuine, irreducible feature of rationality. It is a category error produced by evaluating temporal slices of an agent rather than the agent as a diachronic whole. By defending the policy-based view, we eliminate the paradox. This verdict has profound implications for ordinary moral life, specifically regarding promise-keeping. It suggests that fulfilling a promise after its benefits are secured is not a sacrifice of rationality to morality, but a requirement of coherent agency itself.

  ### The Case for Rational Irrationality

  To understand the allure of Parfit's conclusion, one must appreciate the rigor of Causal Decision Theory. CDT posits that an agent should choose the act that causes the best outcome, evaluated via counterfactuals grounded in physical causality. In the Hitchhiker case, once the agent is in town, the past is fixed. The driver's prediction is a fact of history. Whether the agent pays or not cannot causally alter the fact that they are already safe. Therefore, paying costs utility with no causal return. CDT says: do not pay.

  Parfit, accepting CDT as the standard for *act-rationality*, acknowledged that the agent who pays is acting irrationally *in the moment*. However, he also recognized that the agent who is *disposed* to pay survives, while the act-rational agent dies. Thus, rationality (as a property of the whole life) requires a disposition to act irrationally (as a property of the moment).

  This conclusion is deeply unsettling. It renders rationality self-effacing: if you know you are rational, you know you will die in the desert. A theory of rational choice that advises you to adopt a different psychology to succeed seems to have failed as a guide to action. Parfit's "rational irrationality" is essentially an admission that CDT cannot account for scenarios where an agent's current choice is logically correlated with past events via a predictor, even if not causally linked. It treats the agent as a sequence of disconnected temporal slices, each optimizing locally, even when global optimization requires coordination across time.

  ### Dissolving the Paradox: Dispositions and Policies

  The alternative tradition, represented by Gauthier, McClennen, and later Yudkowsky and Soares (FDT), rejects the premise that the "act" is the primary unit of rational evaluation.

  David Gauthier, in *Morals by Agreement*, argues for **Constrained Maximization**. He posits that rationality applies to the selection of dispositions, not just individual choices. It is rational to adopt the disposition of a "constrained maximizer" (one who cooperates/pays when expected to) because having this disposition yields higher utility than being a "straightforward maximizer" (one who defects). Once the disposition is adopted, acting on it (paying the fare) is not irrational; it is the execution of a rational plan. For Gauthier, there is no "rational irrationality," only a broader scope of rational assessment.

  Edward McClennen's **Resolute Choice** offers a similar dissolution. He argues that a rational agent makes a plan at the initial node and remains "resolute" in following it at later nodes, even if the local incentives change. To deviate is not to be locally rational; it is to be dynamically inconsistent. A rational agent views their future self as an extension of their current agency. To betray the plan is to undermine the agency that secured the benefit.

  Most recently, **Functional Decision Theory (FDT)** provides a formal mechanism for this intuition. FDT treats the agent's decision as the output of a decision procedure (an algorithm). The predictor in the Hitchhiker case is not simulating the agent's physical atoms but modeling their decision procedure. Therefore, the agent's decision in town is *logically* linked to the driver's prediction. The counterfactual is not "If I pay, does the past change?" but "If my algorithm outputs 'pay', does the predictor's simulation output 'rescue'?" Since the algorithm is the same in both instances, paying is the only policy that results in rescue. FDT dissolves the tension entirely: paying is the act that maximizes utility, even by a consequentialist standard, because it accounts for logical correlations rather than just causal ones.

  ### The Verdict: Rational Irrationality as Artifact

  Is "rational irrationality" a genuine feature of the world? No. It is an artifact of a flawed model of agency.

  The paradox only arises if we accept two premises: first, that rationality is strictly about maximizing utility via causal leverage of the present moment; and second, that an agent is fundamentally a series of momentary selves. If we reject either, the paradox vanishes. We should reject both.

  Rationality is fundamentally about *control*. An agent controls their decision procedure, their character, and their policies more robustly than they control isolated muscle twitches. In the Hitchhiker case, the only variable the agent effectively controls *ex ante* is their type (payer or non-payer). The "choice" in town is merely the readout of that prior control. To call the readout "irrational" because it doesn't causally influence the past is to misunderstand the source of the value. The value was secured by the policy, not the twitch.

  Therefore, the verdict is that serious responses to the case *eliminate* rational irrationality by correcting the unit of evaluation. "Rational irrationality" is a label for the glitch that occurs when a theory of local optimization is applied to a global optimization problem. It is not a deep truth about rationality; it is a reductio ad absurdum of act-centrism. A coherent theory of rationality must be diachronically consistent; it must not advise an agent to become a different kind of agent to succeed, only to advise that new agent to sabotage itself later.

  ### Implications for Ordinary Cases: The Promise-Keeping Problem

  If we accept that "rational irrationality" is a pseudo-problem and that policy-based rationality is correct, what becomes of ordinary life? The Hitchhiker case is dramatic because of the omniscient predictor. But the structure recurs constantly in mundane interactions, particularly in promise-keeping.

  Consider a standard promise: I lend you money today based on your promise to repay next month. Next month arrives. You have the money. Repaying costs you utility; keeping it gains you utility. The benefit of the loan (the past event) is already secured. A CDT-style analysis suggests that if you can default without reputational damage (no causal consequence), you should.

  If we accept Parfit's "rational irrationality," we must say that keeping the promise is irrational, but we should cultivate a "moral disposition" to do it anyway. This creates a dualism between prudence and morality. Prudence says default; morality (or disposition) says pay.

  However, if we adopt the policy-based verdict defended above, this dualism collapses. Keeping the promise is *prudentially rational* because you are not an isolated momentary self. You are a continuing agent.
  1.  **Self-Prediction:** Even without an external predictor, you are a predictor of your own future behavior. If you reason now that you will default later, you undermine your ability to make credible commitments *now*. Your current ability to secure benefits depends on your future reliability.
  2.  **Diachronic Coherence:** To default is to treat your past self's plans as irrelevant. This fragments your agency. If you cannot bind your future self, you cannot effectively navigate a world that requires long-term coordination.
  3.  **Logical Correlation:** In many social contexts, your decision to default is logically correlated with others' expectations. Even if *this* specific default is secret, the policy "default when safe" will eventually leak or generalize, degrading your social standing.

  Under the policy view, keeping the promise is not a sacrifice of rationality for the sake of morality. It is the rational execution of a policy that allows you to access the benefits of cooperation. The "tension" people feel—the urge to keep the money because "the service is already rendered"—is the same cognitive glitch that makes the Hitchhiker want to default. It is the voice of local causality ignoring logical control.

  ### Conclusion

  Parfit's Hitchhiker forces us to choose between a theory of rationality that loses (CDT) and a theory that wins but calls its winning move "irrational" (Parfit's view). This is a false dichotomy. The correct response is to recognize that the definition of rationality was too narrow.

  "Rational irrationality" is not a feature of the world; it is a bug in the map. It arises when we evaluate the rationality of a hand movement rather than the algorithm that moved the hand. By shifting our focus to policies, dispositions, and decision procedures, we see that paying the fare and keeping the promise are straightforwardly rational acts. They are the necessary outputs of an agent designed to succeed across time.

  The implication is empowering: we do not need to be "irrationally" moral to get along in the world. We need to be *rationally* coherent. The agent who keeps promises and pays fares is not sacrificing self-interest to a moral god; they are simply refusing to fracture their own agency across time. In the end, the only way to be truly rational is to be the kind of person who cannot be left in the desert.
