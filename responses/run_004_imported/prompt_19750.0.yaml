      *   **The Philosophical Core (Kierkegaard):** This needs to be handled carefully. It shouldn't sound like a philosophy lecture. It needs to translate "the public" vs. "the single individual" into nonprofit speak.
          *   *Idea:* The open vote created an abstract "public" (anonymous, unaccountable, easily manipulated) rather than a community of "readers" (individuals engaging with the work).
