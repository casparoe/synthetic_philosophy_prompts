answer: |-
  The rain smeared the city lights into streaks of neon across the cab window. The meter ticked with a rhythmic, anxious beep. In the backseat, Julian loosened his tie, exhaling as if he'd been holding his breath since the Q&A session ended. Elena was still scrolling through notes on her phone, the blue light illuminating a frown.

  "You're not going to let it go, are you?" Julian asked, nodding at the phone.

  "The novelist's question," Elena said, locking the screen. "Mireille. Marseille versus Hometown. It's the perfect test case. You really think there are two women? That 'Marseille Mireille' is a stranger to 'Hometown Mireille'?"

  "I think there are two concrete individuals," Julian corrected, shifting his weight. "In the world where she takes the job, there is a woman, Mireille-1. In the world where she stays, there is a woman, Mireille-2. They are distinct. They share a past up to the fork, they resemble each other closely. But they are not numerically identical. Lewis was clear on this. Nothing exists in more than one world. To say they are the 'same person' is a loose way of speaking about counterpart relations."

  "That's exactly what Kripke meant by the Humphrey objection," Elena shot back. "Humphrey doesn't care that some *counterpart* of him won the election. He wants to know if *he* could have won. If I'm reading this novel, I don't care about a doppelgänger in Marseille. I care about Mireille. I want to know what *she* would have done. If you tell me 'Well, strictly speaking, that's not her,' you've drained the modal claim of its meaning."

  "Have I?" Julian leaned forward, resting his elbows on his knees. "Or have I saved it from incoherence? Think about the properties, Elena. Accidental intrinsics. In the Hometown world, Mireille has ten fingers. In the Marseille world, say she loses one in a kitchen accident. Nine fingers. If they are literally the *same object*, then that object has the property of having ten fingers and the property of having nine fingers. That's a contradiction. An object cannot be both bent and straight."

  "We don't say the object is both bent and straight simpliciter," Elena said, her voice steady. "We say it has ten fingers *at World A* and nine fingers *at World B*. Properties are world-indexed. There's no contradiction in the object itself, only in your refusal to accept that existence is modal. Mireille carries her identity across the boundary. The number of fingers is contingent, her identity is not."

  "But that changes the nature of properties!" Julian threw a hand up. "Having ten fingers is an intrinsic property. It's about how the hand *is*, not how it relates to a world. If you make all properties relational—'having-ten-fingers-relative-to-W1'—then nothing has any intrinsic nature anymore. Everything is just a node in a web of world-relations. Lewis wanted to save the intuition that objects have genuine qualities. I'm the realist here."

  "You're a realist about worlds, not people," Elena countered. "You populate the cosmos with infinite ghostly Mireilles just to avoid saying that one person has potential. And don't think I forgot about your multiple counterparts problem. What if, in the Marseille world, there are *two* women who resemble Hometown Mireille equally? Maybe she splits her time? Maybe there's a clone scenario? On your view, Hometown Mireille has two counterparts in that world. But identity is transitive. If A is identical to B, and A is identical to C, B must be identical to C. But your counterparts aren't identical to each other. So your relation isn't identity. It's just... similarity."

  "Exactly," Julian said. "And that's a feature, not a bug. Because sometimes identity *does* break down. In fission cases, or your novelist's fork. If Mireille's life diverges so radically that the Marseille version is fundamentally different in character, maybe the counterpart relation fades. Maybe she ceases to have a counterpart in that world. That's clearer than saying 'She is the same person' when everything about her life suggests otherwise."

  "But what grounds the similarity?" Elena pressed. "Why is Marseille Mireille the counterpart and not the woman sitting next to her on the train? They both resemble Hometown Mireille to some degree. You need a metric of importance. You need to know which properties matter. And to know which properties matter, you need to know what makes Mireille *Mireille*. You need an essence."

  "I need qualitative resemblance weighted by context," Julian said. "I don't need a mystical tag."

  "It's not mystical, it's primitive," Elena insisted. "Plantinga's haecceity. Individual essence. There is a 'this-ness' to Mireille that isn't just a bundle of traits. It's the thing that persists whether she's in Marseille or not. It's not a label for the mystery; it's the ontological ground that makes the question intelligible in the first place. When the novelist asks, 'Is it the same woman?', she's asking if the haecceity survives the fork. Your theory says the question is ill-formed. Mine says the answer is yes, provided the essence holds."

  "Haecceity is a magic wand," Julian said, watching the rain. "You wave it and say 'Same!' but you can't explain *how*. If I ask you, 'What is this essence made of? Is it observable? Is it reducible?', you say 'No, it's primitive.' That's not an explanation, Elena. That's a refusal to explain. Lewis offered a mechanism: spatiotemporal isolation and qualitative resemblance. It's parsimonious. It doesn't multiply entities *within* a world to explain modality *across* worlds."

  "It multiplies worlds!" Elena laughed, a sharp sound in the small car. "You have an infinite plurality of concrete universes. That's your parsimony? You'd rather believe in infinite copies of Mireille than believe that Mireille has the capacity to be different than she is?"

  "The copies aren't 'of' her. They just are," Julian said. "And yes, I'll take concrete worlds over primitive essences any day. At least I can model the worlds. Your essence is unanalyzable. And here's the kicker: If essence is non-qualitative, how do we ever know we're tracking it? If Marseille Mireille acts completely differently, thinks differently, looks different, but you say 'Same essence,' on what grounds do you assert that? It becomes unfalsifiable."

  "On the grounds of stipulation," Elena said firmly. "Kripke was clear. We *stipulate* that we are talking about Nixon. We don't identify him by a cluster of descriptions. We point to the origin. If the novelist stipulates that Chapter 4B is the same Mireille as Chapter 1, then she is. The reader accepts the stipulation. Your counterpart theory tries to derive identity from the bottom up, from traits. But modality works top-down. We fix the subject, then vary the properties."

  "But that leaves you with the contradiction of intrinsics," Julian reminded him. "If you fix the subject, the subject literally has incompatible properties. You're saying Mireille is essentially a contradiction unless you relativize everything to a world. And if you relativize everything to a world, you've basically admitted I'm right about the ontology, you're just fighting over the semantics of 'identity'."

  "I'm fighting over the semantics of *concern*," Elena corrected. "Why do I worry about my future? Why do I feel regret? On your view, I shouldn't regret not taking the Marseille job. I should feel pity for my counterpart who took it. She's the one suffering the regret. I'm safe here. That's not how human psychology works. We feel the weight of the unchosen path because it was *ours* to choose. Transworld identity captures the stakes. Counterpart theory diffuses them."

  The cab slowed for a red light. The silence stretched between them, filled only by the hum of the engine and the wipers slapping the glass.

  "Maybe the stakes are an illusion," Julian said quietly. "Maybe the feeling that 'I could have been otherwise' is just the feeling of recognizing a close counterpart in our imagination. It feels like identity because the resemblance is so high. But feelings aren't metaphysics."

  "And maybe metaphysics that can't account for the feeling of selfhood is just a game with symbols," Elena replied. "If your theory tells the novelist that her book isn't about one woman's divergent paths, but about two strangers who look alike... she's going to tell you you've missed the point."

  "Then the novelist is speaking loosely," Julian said, though he sounded less certain. "We speak loosely all the time. 'The sun rose.' We know it didn't. We know Mireille isn't strictly identical across the fork. But the story works because the counterpart relation is strong enough to sustain the narrative."

  "But is it true?" Elena asked. "That's what the metaphysician asks. Not 'does it work?' Is it *true*?"

  Julian looked out the window. They were pulling up to Elena's hotel. "Lewis would say truth is world-relative. In the story-world, it's true they are the same. In the actual world of the text's production, they are distinct constructs."

  "See?" Elena grabbed her bag as the cab stopped. "You just pushed the problem into the 'story-world.' You haven't solved it. You've just built another cab to hide in."

  Julian smiled, tired. "And you've built an invisible essence to drive it."

  "Touché." Elena opened the door. The rain sound rushed in. "Same time tomorrow? There's a session on temporal parts I think you'll hate."

  "I wouldn't miss it," Julian said. "Bring your haecceities. I'll bring my razor."

  She closed the door. Julian watched her run through the rain to the lobby, then leaned back into the seat. He looked at his own hands. Ten fingers. In this world. He wondered, briefly, if there was a world where he had nine, and whether that man was him, or just someone who looked like him wondering the same thing.

  "Where to, guv?" the driver asked.

  Julian hesitated. For a second, the question felt heavier than it should.

  "Home," he said. "Just... take me home."
