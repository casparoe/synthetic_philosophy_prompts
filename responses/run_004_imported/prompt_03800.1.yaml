answer: |-
  This is a classic crux in the interpretation of the *Mingjia* (School of Names), and your intuition is sharp: the logical tension you sense in the second move is precisely where the philosophical payload of the *White Horse Dialogue* (Baima Lun) is located.

  Most contemporary analytic reconstructions of Gongsun Long (notably Chad Hansen, A.C. Graham, and Chris Fraser) agree that the dialogue turns on the ambiguity of the copula *fei* (非), which can function as "is not identical to," "is not a member of," or "is not the same kind as."

  Here is an explicit breakdown of the logical structure of the second move, followed by an analysis of the equivocation and its relationship to the first move.

  ### 1. Logical Structure of the Second Move (The "Request" Argument)

  The Advocate's second argument is pragmatic. It moves from the conditions of satisfaction for linguistic requests to the ontological or semantic status of the terms. We can reconstruct it using extensional semantics.

  **The Premises:**
  1.  **P1 (Differential Satisfaction):** The set of objects that satisfy the request "Give me a horse" ($H$) includes yellow and black horses. The set of objects that satisfy the request "Give me a white horse" ($WH$) excludes yellow and black horses.
  2.  **P2 (Leibniz's Law for Terms):** If Term A were identical to Term B (i.e., if "white horse" simply *were* "horse"), then the conditions for satisfying a request for A would be identical to the conditions for satisfying a request for B.
  3.  **P3 (Observation):** The conditions for satisfying "horse" and "white horse" are not identical (from P1).

  **The Inference:**
  From P2 and P3, via *modus tollens*: Term A is not identical to Term B.

  **The Derived Conclusion (Valid):**
  The concept/designation "white horse" is not **identical** to the concept/designation "horse." (Intensional Non-Identity).

  **The Stated Conclusion (Provocative):**
  "A white horse is not a horse" (白馬非馬).

  **The Logical Gap:**
  The Derived Conclusion supports the claim that the *terms* are not synonymous. However, the Objector's challenge ("Having a white horse just is having a horse") and the shocking nature of the Advocate's thesis imply an **Extensional Non-Membership** claim: *No object that is a white horse is a member of the class 'horse'.*

  The argument validly proves that the *extension* of the term "white horse" is a proper subset of, and not identical to, the *extension* of the term "horse." It does **not** validly prove that the extension of "white horse" is disjoint from the extension of "horse."

  ### 2. Does it trade on a slide between Identity and Membership?

  **Yes.** This is the standard analytic consensus.

  The persuasive power of the argument relies on an equivocation on *fei* (非).
  *   **In the Premises:** *Fei* must be read as **non-identity** (of concepts/extensions). It is true that the concept <White Horse> is not identical to the concept <Horse>. It is also true that the set of white horses is not identical to the set of horses.
  *   **In the Conclusion:** *Fei* is heard as **non-membership** (or exclusion). The Objector understands "A white horse is not a horse" as "A white horse is not a *member* of the class horse."

  If Gongsun Long meant only non-identity, the thesis is trivial (a "white horse" concept is more specific than a "horse" concept). If he means non-membership, the thesis is absurd (a white horse is not a horse). The argument bridges this gap by showing that because the *criteria* for the terms differ (P1), the *things* named must be excluded from one another.

  This is a fallacy of division or a category mistake: inferring that because the *name* "white horse" is not the *name* "horse," the *object* named by the former cannot fall under the classification of the latter.

  ### 3. Is the First Argument Innocent?

  **No.** The first argument (Shape/Color) is not innocent; it relies on the same equivocation, though it operates at the level of semantics rather than pragmatics.

  **Reconstruction of the First Move:**
  1.  **P1:** "Horse" names a shape (form).
  2.  **P2:** "White" names a color (attribute).
  3.  **P3:** Naming a color is not naming a shape (The semantic content of 'white' $\neq$ the semantic content of 'horse').
  4.  **C:** Therefore, "White Horse" is not "Horse."

  **The Slide:**
  *   **Premises:** Establish **Intensional Distinction**. The *meaning* of "white" is distinct from the *meaning* of "horse." Therefore, the compound meaning <White + Horse> is distinct from the simple meaning <Horse>.
  *   **Conclusion:** Implies **Extensional Exclusion**. By concluding "White Horse is not Horse," the Advocate invites the inference that the object possessing the compound meaning cannot be subsumed under the simple meaning.

  The first argument sets the trap that the second argument springs.
  1.  **Move 1** establishes that the *names* are distinct (Semantic Non-Identity).
  2.  **Move 2** establishes that the *use* of the names is distinct (Pragmatic Non-Equivalence).
  3.  **Both** are used to license the conclusion that the *objects* are distinct (Ontological Non-Membership).

  If the first argument were innocent (i.e., if it concluded only "The term 'white horse' is not synonymous with 'horse'"), the Objector would not have been confused. The Objector's confusion ("If there is a white horse, one cannot say there is no horse") arises because he interprets the Advocate's conclusion ontologically, while the Advocate defends it semantically.

  ### 4. Scholarly Context for Your Paper

  Since you are writing a seminar paper, you may want to position this logical analysis within the broader interpretive landscape. There are three main ways scholars handle this "slide":

  1.  **The Fallacy View (Hansen, Fraser):** Gongsun Long is exploiting linguistic ambiguity. The *Mingjia* were often criticized by Confucians and Mohists for "obscuring right and wrong" with clever wordplay. On this reading, the "slide" is a sophistical trick to win a debate. The logic is formally invalid regarding the ontological claim.
  2.  **The Mereological View (Harbsmeier, some readings of Graham):** Gongsun Long is making a point about compounds. A "white horse" is a compound entity (White + Horse). A compound is not identical to one of its constituents. "White Horse" $\neq$ "Horse" in the same way that "A Wheel + A Cart" $\neq$ "A Cart." This makes the non-identity claim robust, but still doesn't justify non-membership.
  3.  **The Realist/Ontological View (Less common now):** Gongsun Long believes in a rigid ontology where "universals" (White, Horse) are separate entities. A concrete white horse partakes in the universal White and the universal Horse. Because the universal <White Horse> is a distinct abstract entity from the universal <Horse>, the statement "White Horse is not Horse" is literally true at the level of Forms, even if confusing at the level of particulars.

  **Recommendation for your paper:**
  You can argue that the second move is the **pragmatic vindication** of the first move's **semantic distinction**.
  *   Move 1 says: The *definitions* differ.
  *   Move 2 says: The *application conditions* differ.
  *   The Conclusion says: Therefore, the *object* classified by one cannot be classified by the other.

  The "slide" is not necessarily a mistake Gongsun Long failed to notice; it may be the very phenomenon he is investigating. The *Baima Lun* might be read not as a proof that white horses aren't horses, but as a *reductio* of the assumption that language maps neatly onto reality. If we assume names map directly to reality, the distinction in names (Move 1) and use (Move 2) forces us into the absurd conclusion that a white horse isn't a horse. Thus, the dialogue exposes the limits of naming (*ming*).

  ### Summary for your Outline
  *   **Structure:** The second move uses Leibniz's Law on *request conditions* to prove *concept non-identity*.
  *   **Equivocation:** It conflates *Concept Non-Identity* (True) with *Class Exclusion* (False).
  *   **First Move:** Depends on the same conflation, moving from *Semantic Distinction* to *Ontological Exclusion*.
  *   **Philosophical Upshot:** The validity of the argument depends on whether you read *fei* as "is not identical to" (Valid, Trivial) or "is not a member of" (Invalid, Absurd). The text's power lies in sustaining both readings simultaneously.
