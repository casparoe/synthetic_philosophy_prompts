answer: |-
  This is an excellent question that cuts to the heart of Catholic political theology. You have identified a genuine tension, but the resolution lies in correcting a common misconception about what Aquinas actually argued.

  The short answer is: **Your reading of Aquinas is slightly too permissive regarding *private* tyrannicide.** While Aquinas certainly condemns tyranny and argues that a tyrant forfeits the *moral claim* to obedience, he does not generally endorse private individuals killing tyrants as a "praiseworthy act." In fact, he explicitly warns against it.

  The broader Catholic tradition is not contradicting Aquinas; it is following his caution. Here is a breakdown of where the nuance lies in Aquinas's texts and how the tradition developed from them.

  ### 1. What Aquinas Actually Said: *De Regno* and the *Summa*
  The primary text people cite regarding Aquinas and tyranny is *De Regno* (On Kingship), specifically Book I, Chapter 6. This is where the nuance is often lost.

  **A. Private vs. Public Authority**
  Aquinas makes a crucial distinction between a **usurper** (someone who seizes power without right) and a **legitimate ruler who becomes tyrannical**.
  *   **Usurpers:** Aquinas suggests that if a ruler has no title to rule at all, the community (or a superior authority) may depose him.
  *   **Tyrants:** If a ruler has a legitimate title but abuses power, Aquinas argues it is **not for private individuals** to kill them. He writes that attempting to kill a tyrant privately exposes the community to greater dangers (civil war, retaliation, or a worse successor).

  **B. The Example of Ehud**
  Aquinas does mention the Old Testament judge Ehud, who killed the Moabite king Eglon (Judges 3). However, Aquinas qualifies this heavily. He notes that Ehud acted under **special divine inspiration**, not as a precedent for general political action. He does not hold this up as a standard moral rule for Christians.

  **C. The Danger of Sedition**
  In the *Summa Theologiae* (II-II, Q. 42, A. 2), Aquinas discusses sedition. He argues that disturbing the unity of the multitude is a mortal sin. While overthrowing a tyrant *might* not be sedition if it is for the common good, he warns that often the attempt to remove a tyrant leads to greater discord. He famously argues that sometimes it is better to tolerate a mild tyranny than to risk the greater evils that come from attempting to overthrow it.

  **D. The Ultimate Remedy is God**
  In *De Regno*, after ruling out private assassination and cautioning against public upheaval, Aquinas concludes that if there is no human recourse against a tyrant, the people must turn to God, who can "change the heart of the tyrant" or remove him. This is a theological surrender, not a call to violence.

  ### 2. The Distinction Between Legitimacy and Remedy
  Your premise is correct that for Aquinas, a ruler governing for self-interest forfeits the *moral obligation of obedience*. However, you are conflating **forfeiture of legitimacy** with **licensure for private violence**.

  For Aquinas, political authority is rooted in the natural law and ultimately God. Even a bad ruler retains a certain ontological status as the "head" of the body politic. Removing the head is a surgical procedure that requires the consent of the body (the community) or a higher authority (like the Church or an Emperor, in medieval theory), not the action of a private citizen.

  To use a modern analogy: A corrupt police officer forfeits his moral right to enforce the law, but that does not grant a private citizen the right to execute him. The removal must happen through proper jurisdiction.

  ### 3. The Broader Catholic Tradition
  Because Aquinas was so cautious, the subsequent tradition followed suit. The "caution" you observe is actually a fidelity to Aquinas's prudential limits.

  **A. The Scholastics (Suarez and Bellarmine)**
  In the 16th and 17th centuries, Jesuit theologians like Francisco Suarez and Robert Bellarmine developed the theory of popular sovereignty more fully. They argued that power resides ultimately in the community, which transfers it to the king. Therefore, if the king becomes a tyrant, the community can **depose** him.
  *   **Crucial Limit:** They almost universally distinguished between **deposition** (a public, legal act by representatives of the people) and **assassination** (a private act). They generally condemned the latter.

  **B. The Condemnation of Tyrannicide**
  There were moments in history where tyrannicide was debated (e.g., the killing of Henry III of France), but the Catholic Church often condemned these acts. For example, the Council of Constance (1415) condemned the proposition that it is lawful for a subject to kill a tyrant without waiting for a judicial sentence. This was aimed at the followers of John Petit, who justified the murder of the Duke of Orleans. The Church affirmed that private vengeance is not a valid political tool.

  **C. The Catechism**
  The modern *Catechism of the Catholic Church* (2242) maintains this cautious line. It states that armed resistance is permissible only under strict conditions (grave violations of fundamental rights, last resort, etc.), but it does not endorse assassination. It emphasizes the responsibility of citizens to contribute to the common good, implying institutional resistance rather than vigilante justice.

  ### 4. Where Your Reading Went Wrong
  You are not "wrong" to see Aquinas as anti-tyrannical; he is vehemently so. The error lies in the leap from **"tyranny is illegitimate"** to **"killing the tyrant is praiseworthy."**

  1.  **The Agent:** Aquinas restricts the remedy to *public authority*, not private individuals.
  2.  **The Calculation:** Aquinas introduces a utilitarian/prudential check: Will killing the tyrant cause more harm than the tyranny itself? If yes, do not kill him.
  3.  **The Moral Status:** Aquinas does not classify tyrannicide as inherently "praiseworthy" (like martyrdom or almsgiving); he classifies it as a dangerous last resort that is usually illicit for private persons.

  ### Summary
  The Catholic tradition's caution is not a betrayal of Aquinas; it is an application of his most careful arguments. Aquinas provides a theoretical basis for resistance (tyranny violates the common good), but he builds a firewall around it to prevent anarchy and private vengeance.

  If you revisit *De Regno* I.6 with the specific question "Does Aquinas allow a private citizen to kill a tyrant?" you will find his answer is generally **no**, unless acting under specific divine inspiration or public mandate. The tradition's hesitation to endorse tyrannicide is entirely consistent with the Angelic Doctor.
