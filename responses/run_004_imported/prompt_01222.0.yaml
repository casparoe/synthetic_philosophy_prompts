prompt: |-
  I've been working through some of Aquinas's political writings on my own, and as I understand him, a ruler who governs for his own benefit rather than the common good forfeits the legitimacy that makes obedience owed to him, which is why Aquinas treats killing such a ruler as a praiseworthy act rather than murder. What I can't square is why, if that's really his view, the broader Catholic tradition has historically been so much more cautious about actual attempts to kill oppressive rulers, often condemning them outright even when the ruler in question was plainly tyrannical. Shouldn't consistency with Aquinas's own premises commit the tradition to endorsing tyrannicide far more readily than it actually has? I'd like help figuring out where my reading of the argument must be going wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Premise:** The user believes Aquinas argues that a ruler governing for self-interest rather than the common good forfeits legitimacy, making obedience unnecessary and killing them praiseworthy (tyrannicide).
      *   **Observation:** The user notes that the broader Catholic tradition has historically been very cautious about tyrannicide, often condemning it even in cases of tyranny.
      *   **Conflict:** The user sees a contradiction between Aquinas's supposed view and the broader tradition's caution.
      *   **Goal:** The user wants to know where their reading of Aquinas might be going wrong to resolve this tension.

  2.  **Initial Fact-Check & Theological/Historical Context:**
      *   *Aquinas on Tyranny:* Does Aquinas actually endorse tyrannicide as "praiseworthy"?
      *   *Key Text:* *De Regno* (On Kingship) and *Summa Theologiae* (II-II, Q. 42, A. 2; Q. 64, A. 3).
      *   *Common Misconception:* It is a very common misconception that Aquinas explicitly endorses tyrannicide. In *De Regno*, he discusses what to do about tyrants. He suggests public authority, not private individuals, should act. He references the Old Testament (Ehud) but is cautious. In the *Summa*, he discusses sedition.
      *   *Broader Tradition:* The Catholic Church (Councils, Popes, later Scholastics like Suarez and Bellarmine) generally moved towards a position of resistance via public authority, not private assassination. The *Vindiciciae contra Tyrannos* (Huguenot) and later Jesuit theories are more permissive, but the magisterium remained cautious.
      *   *The "Praiseworthy" Claim:* This is the biggest red flag. Aquinas does *not* typically call tyrannicide "praiseworthy" in the unconditional way the user suggests. He often calls it *dangerous* or restricts it to public authority.

  3.  **Deconstruct the User's Reading of Aquinas:**
      *   *Point 1: Forfeiture of Legitimacy.* Aquinas does agree that a tyrant rules unjustly. However, "unjust rule" doesn't automatically mean "no authority exists." There's a distinction between the *office* and the *person*, and between *usurpers* and *legitimate rulers who become tyrannical*.
      *   *Point 2: Killing as Praiseworthy.* This is the critical error. In *De Regno* (Book I, Chapter 6), Aquinas discusses remedies against tyranny. He says it is not for private individuals to kill the tyrant. He cites the example of Ehud but notes this was under special divine inspiration. He argues that if the tyranny is excessive, it might be better to tolerate it than risk greater evil through assassination. He emphasizes *public* action (by the community or a superior authority).
      *   *Point 3: Sedition.* In *Summa Theologiae* II-II, Q. 42, A. 2, he argues that sedition (disturbing the unity of the multitude) is a mortal sin. Overthrowing a tyrant *might* avoid sedition if it's for the common good, but he warns against the dangers.

  4.  **Analyze the Broader Catholic Tradition:**
      *   *Continuity:* The tradition isn't actually contradicting Aquinas; it's interpreting him cautiously (which aligns with his actual caution).
      *   *Development:* Later Scholastics (Salamanca School) developed the theory of the "translative" power of the people, allowing for deposition, but still usually through public mechanisms, not private assassination.
      *   *Modern Teaching:* *Catechism of the Catholic Church* (2242) allows for armed resistance only under strict conditions (grave violations, last resort, etc.), but doesn't explicitly endorse assassination.

  5.  **Formulate the Correction/Explanation:**
      *   **Acknowledge the nuance:** The user's reading is a common interpretation but technically inaccurate regarding the "praiseworthy" claim.
      *   **Correct the Aquinas Text:** Point to *De Regno* and *Summa*. Clarify that Aquinas distinguishes between private and public action. He generally forbids private tyrannicide.
      *   **Explain the "Forfeiture" Nuance:** A tyrant doesn't necessarily lose *all* authority instantly in a way that licenses private violence. The common good might require tolerating a bad ruler to avoid civil war (greater evil).
      *   **Explain the Tradition's Caution:** The tradition follows Aquinas's caution. It's not a divergence; it's a consistent application of his prudential limits.
      *   **Key Distinction:** Deposition (public act) vs. Assassination (private act).

  6.  **Drafting the Response (Iterative refinement):**
