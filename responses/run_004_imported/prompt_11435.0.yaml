  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the right hemisphere's "no." That is the crux of the ethical tension. If the RH is a conscious agent saying "kill me," and we ignore it, that's grave. But if the LH is a conscious agent saying "let me live," and we ignore it, that's also grave. The tie-breaker must be the reversibility of the decision. I will emphasize this.

