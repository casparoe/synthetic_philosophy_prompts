      *   *Development:* Martin pushes on the "Spark." If it's a spark, there must be a law about combustible materials. Elena pushes back: The "spark" description is only true *after* the fire.
      *   *Climax:* The disagreement over whether history explains *why it had to happen* (Martin) or *how it happened* (Elena).
