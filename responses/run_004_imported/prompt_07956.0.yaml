answer: |-
  This is an excellent prompt for a jurisprudence response paper. It forces you to apply the abstract theoretical commitments of the 1958 *Harvard Law Review* exchange to a concrete, high-stakes historical scenario that tests the limits of both theories. The East German border guard cases (*Mauerschützenprozesse*) are the perfect stress test because they involve a legal system (the GDR) that was more stable and procedurally regular than the Nazi regime, yet produced substantively horrific outcomes.

  Here is an analysis of how Hart and Fuller would likely approach the border guard prosecutions based strictly on their 1958 positions, where their reasoning would diverge, and where the Hartian position faces genuine strain.

  ### 1. H.L.A. Hart: The Candid Positivist Approach

  Based on his 1958 essay *Positivism and the Separation of Law and Morals*, Hart would likely begin by conceding a point that natural lawyers resist: **The *Schießbefehl* was law.**

  For Hart, the existence of law is one thing; its merit or demerit is another. The shoot-to-kill orders were posited by a sovereign power (the GDR state), recognized by officials, and generally obeyed. To deny they were "law" is, for Hart, a confusion that "throws away" the conceptual tool needed to criticize them. If we call it law, we can say, "It is law, but it is too iniquitous to be obeyed."

  **The Mechanism of Conviction:**
  In the 1958 exchange, regarding the "grudge informer" cases, Hart rejected the German courts' actual approach (which often pretended the Nazi statutes were never law). Instead, Hart advocated for a **candid legislative solution**. He argued that if society wishes to punish conduct that was legal when performed, it should pass a **retroactive statute** explicitly authorizing the punishment.

  Applied to the border guards:
  *   Hart would argue that the reunited German legislature should have passed a specific statute acknowledging that the shootings were legal under GDR law but were morally criminal and thus punishable retroactively.
  *   This preserves the "separation thesis." It admits the GDR law existed, but asserts a new, superior moral-political command from the reunited state to punish the past act.

  **The Guard's Moral Choice:**
  Hart would emphasize that the validity of the GDR law does not absolve the guard of moral responsibility. In 1958, Hart stresses that positivism does not entail that "law is the only moral standard." The guard faced a choice: obey the law or follow the moral imperative not to kill unarmed fugitives. By obeying the law, the guard made a moral error, even if he did not break a *legal* rule at the time.

  ### 2. Lon L. Fuller: The Internal Morality and Radbruch's Formula

  Fuller's 1958 response, *Positivism and Fidelity to Law*, takes a different route. He aligns himself with Gustav Radbruch's formula: **Extreme injustice is no law (*lex iniusta non est lex*).**

  **The Nature of the Order:**
  Fuller argues that law is not merely a "vertical projection of authority" (as he characterizes the positivist view) but a purposive enterprise subjecting human conduct to the governance of rules. This enterprise has an "internal morality." While Fuller develops this more fully in his 1964 book, the 1958 essay argues that when a legal system becomes a tool of terror, it loses its claim to fidelity.

  Applied to the border guards:
  *   Fuller would argue that the *Schießbefehl* was so fundamentally at odds with the purpose of law (which implies a reciprocity between government and citizen) that it failed to qualify as law.
  *   Therefore, the guards were not following "law"; they were following commands that lacked legal character.
  *   **The Mechanism of Conviction:** Unlike Hart, Fuller would support the courts' use of **Radbruch's formula directly**. No retroactive statute is needed. If the order was not law, the guards had no legal authority to shoot. They can be convicted under ordinary homicide statutes that were in force (or under the principle that the GDR's own constitutional commitments to human rights, which were ignored, were the "true" law).

  **Fidelity:**
  For Fuller, the issue is one of *fidelity*. A citizen owes fidelity to law, but not to a system that has perverted the concept of law itself. By invoking Radbruch, the court reaffirms the integrity of the legal concept against the positivist reduction of law to mere power.

  ### 3. The Point of Divergence

  The divergence is not necessarily about the *outcome* (both likely want the guards punished) but about the **honesty of the legal reasoning** and the **institutional role**.

  1.  **Definition of Law:** Hart insists on calling the *Schießbefehl* "law" to maintain conceptual clarity. Fuller insists on calling it "non-law" to maintain moral integrity within the legal concept.
  2.  **Retroactivity:**
      *   **Hart:** Punishment requires *legislative* retroactivity. We must admit we are changing the rules after the fact to achieve justice.
      *   **Fuller:** Punishment requires *judicial* declaration. The rules didn't change; the court is merely recognizing that the previous "rules" were never valid law to begin with.
  3.  **The Role of the Judge:** Hart is wary of judges nullifying statutes based on moral grounds, preferring the legislature to take responsibility for retroactive justice. Fuller empowers the judiciary to police the boundary between law and tyranny.

  ### 4. Where the Case Strains a Committed Hartian

  This is the critical section for your paper. The East German cases present a specific tension for Hart's 1958 position that goes beyond the standard "iniquitous law" problem.

  **A. Judicial vs. Legislative Retroactivity**
  In 1958, Hart explicitly criticized the German courts for punishing the grudge informers *without* a retroactive statute. He called this a "covert" way of dealing with the problem. However, in the 1990s border guard cases, the German Federal Constitutional Court did exactly what Hart criticized in the 1940s: they used a judicial doctrine (Radbruch's formula) to validate retroactive punishment without a specific new statute from the legislature.

  *   **The Strain:** A consistent Hartian should object to the *method* used in the border guard trials, even if they support the *result*. Hart values the "rule of law" virtues (certainty, predictability). Allowing judges to declare past statutes "non-law" based on moral evaluation undermines the certainty of the legal system. It blurs the line between applying law and making law. Hart would prefer the messy honesty of a retroactive statute over the judicial fiction that the GDR law "never existed."

  **B. The "Minimum Content" and Survival**
  While Hart's "minimum content of natural law" is more fully articulated in *The Concept of Law* (1961), the seeds are in his 1958 utilitarianism. He argues laws generally aim at survival. The *Schießbefehl* was not just unjust; it was a state policy of killing its own citizens to prevent exit.
  *   **The Strain:** If a law mandates the destruction of the very subjects it claims to govern, does it cease to function as a legal system in the Hartian sense (primary and secondary rules)? If the GDR law was designed to terrorize rather than guide conduct, does it fail Hart's own criteria for a functioning legal system? A committed positivist might struggle to maintain that a system of "orders backed by threats" which systematically eliminates the "obligation" element is still a *legal* system worthy of the name, even if they reject Fuller's moral definition.

  **C. The "Choice of Evils"**
  Hart argues that in the grudge informer case, we face a choice of two evils: punishing retroactively or letting the offender go. He chooses retroactivity.
  *   **The Strain:** In the border guard cases, the "evil" of retroactivity is weighed against the "evil" of impunity for state-sponsored killing. Hart's 1958 framework assumes a liberal democracy making this choice. In reunification, the "new" state is absorbing the "old" state. Hart's model of a sovereign passing a retroactive law is complicated by the fact that the sovereign *itself* has changed identity. A Hartian must explain why the *new* sovereign has the authority to punish acts legal under the *old* sovereign without violating the principle of non-retroactivity that Hart claims is a vital moral value.

  ### Conclusion for Your Paper

  You can conclude that the border guard cases reveal a role reversal in the practical application of the theories. Fuller's approach (Radbruch's formula) offers a smoother path for the *courts* to achieve justice without waiting for legislation, but it risks the judicial overreach Hart feared. Hart's approach is institutionally more honest (admitting retroactivity) but politically more difficult (requiring legislative action for past crimes).

  The genuine strain on the Hartian is this: **Hart wants judges to apply the law as it is, even if it is wicked, and leave the moral cleansing to the legislature.** But in the border guard cases, the legislature *didn't* act first; the courts did. To support the convictions, a Hartian must either accept judicial retroactivity (violating Hart's institutional preferences) or condemn the convictions (violating moral intuition). This suggests that in transitions from tyranny to democracy, the "separation of law and morals" may be a luxury the legal system cannot afford, forcing even positivists toward a Radbruch-like exception.

  ### Suggested Reading/Quotes to Anchor Your Argument
  *   **Hart (1958):** Look for his discussion of the "covert" vs. "candid" approach to the grudge informer. Quote his preference for a "retrospective law."
  *   **Fuller (1958):** Look for his discussion of the "inner morality of law" and his endorsement of Radbruch's view that statutes lose their legal character when they violate conscience.
  *   **The Case:** *Bundesverfassungsgericht* (Federal Constitutional Court), Decision of October 24, 1996 (2 BvR 1851/94) — specifically where they discuss the Radbruch formula and the GDR's own international treaty obligations.

  This framework should allow you to write a paper that respects the historical texts while engaging deeply with the jurisprudential problems of the 1990s cases.
