answer: |-
  Distinguished guests, family members, friends, and most importantly, the candidates for naturalization:

  Welcome. Today is Constitution Day, and there is no more fitting way to honor this document than by welcoming new members into the community it governs. In a few moments, you will raise your right hands and take the Oath of Allegiance. You will promise to support and defend the Constitution of the United States against all enemies, foreign and domestic.

  It is a solemn promise. And because it is solemn, it deserves honesty.

  Many of you know the name Frederick Douglass. You may know him as the escaped slave who became the greatest orator of the nineteenth century. You may know him from his searing indictment of this nation, delivered in Rochester in 1852, when he asked, "What to the Slave is the Fourth of July?" In that speech, he called your celebrations a "sham," your liberty an "unholy license." It is a necessary speech. It is a painful speech. And for many, it is the only speech of Douglass they ever read.

  But if we are to understand the Constitution you are about to swear to, we must look at how Douglass understood it, not just in his anger, but in his hope. Because Douglass's relationship with this document was not static. It was a struggle. And in that struggle, there is a lesson for every new citizen.

  For the first decade of his public life, Douglass stood alongside the abolitionist William Lloyd Garrison. Together, they burned copies of the Constitution. They called it a "covenant with death and an agreement with hell."

  Why? Because they looked at the reality of 1840s America. They saw a document that counted enslaved people as three-fifths of a person. They saw clauses that mandated the return of fugitives to bondage. They saw a text that protected the slave trade for twenty years. To Douglass, then, the Constitution was not a shield for the oppressed; it was a weapon used by the oppressor. To swear allegiance to it, he believed, was to swear allegiance to slavery itself.

  It was a morally clear position. It was also, eventually, a position he could no longer hold.

  Around 1851, Douglass made a break. It was painful. It cost him friends. It cost him funding. It isolated him from the mentors who had raised him up. He publicly announced that he had changed his mind. He came to argue that the Constitution, properly interpreted, was not a pro-slavery document, but an anti-slavery one. He called it "a glorious liberty document."

  Now, I see a constitutional historian seated in the front row, and I know that scholars still debate the mechanics of that shift. But for Douglass, this was not an academic exercise. It was a survival strategy.

  He looked at the text again—really looked at it. He noted that the words "slave" and "slavery" appear nowhere in the Constitution. The founders, ashamed of the institution, had used euphemisms: "persons held to service," "other persons." Douglass argued that these were not protections for property, but concessions to power that should be read narrowly. He argued that the Preamble—"We the People"—was not a description of who was currently allowed to vote, but a statement of who *belongs*. He argued that the general welfare and the securing of liberty were the true ends of the government, and slavery was a local crime that the federal government had the power, and the duty, to suppress.

  Douglass did not change his mind because slavery had ended. It hadn't. He changed his mind because he realized that if he rejected the Constitution, he surrendered the most powerful legal tool available to fight slavery. He realized that the document was not a description of America as it *was*, but a promise of what it *could be*.

  He understood that the Constitution is not a idol to be worshipped, but a tool to be used.

  Why does this matter to you, today, as you stand on the threshold of citizenship?

  Because you are not inheriting a perfect nation. If you wait for a perfect nation to join, you will wait forever. You are inheriting a framework. You are inheriting an argument.

  When you take the Oath in a few minutes, you are not saying, "The United States has never done wrong." You are not saying, "Every law is just." You are saying, "I believe in this system of government enough to work within it to make it better."

  Douglass teaches us that patriotism is not blind loyalty. Blind loyalty is for subjects. Citizens have the right, and the duty, to argue. Douglass wrestled with this document. He fought over its meaning. He forced this country to read its own founding charter through the lens of human rights. He forced us to see that "We the People" must eventually mean *all* the people.

  That is the work you are joining today.

  Some of you come from countries where the constitution is a piece of paper that the government ignores. Here, the paper is stronger than the government, provided the people hold it up. But the paper only works if you read it. If you understand it. If you are willing to stand up, as Douglass did, and say, "This law contradicts that promise," or "This practice violates that principle."

  To be an American is to sign on to a project that is unfinished. The architect left the building before the roof was on. There are drafts in the wind. There are cracks in the foundation. Douglass spent his life trying to seal those cracks, not by tearing the building down, but by demanding we live up to the blueprints.

  So, when you raise your hand today, know what you are doing. You are joining a conversation that started in 1787, that Frederick Douglass joined in 1851, that Martin Luther King Jr. joined in 1963, and that continues right now, in this room.

  You are pledging to defend the Constitution not as it was interpreted by those who sought to keep people in chains, but as it was interpreted by those who sought to break them. You are pledging to the "more perfect union," acknowledging that the union is not yet perfect.

  This is a heavy burden. It requires patience. It requires courage. It requires the kind of courage Douglass showed when he stood alone against his old friends, telling them that hope was more radical than despair. He told them that the text of the law could be redeemed, even if the practice of the nation was corrupt.

  To the new citizens: You have chosen this country. You were not born into it by accident. You chose it by intent. That intent is your power.

  Do not let anyone tell you that because you were not born here, you love this country less. Do not let anyone tell you that because you criticize this country, you are disloyal. Frederick Douglass criticized this country more fiercely than almost anyone in history, yet he served it more faithfully than almost anyone in history. He served as a U.S. Marshal. He served as a Recorder of Deeds. He served as a Minister to Haiti. He recruited black soldiers to fight for the Union. He loved the Constitution enough to fight for its soul.

  That is the legacy you enter today.

  In a moment, the judge will ask you to take the Oath. You will say, "I will support and defend the Constitution and laws of the United States of America against all enemies, foreign and domestic."

  Remember Douglass when you say those words. Remember that defending the Constitution sometimes means defending it from those who would twist it. Remember that "domestic enemies" can be injustice, indifference, or the lie that some people are created less equal than others.

  You are becoming part of "We the People." That phrase is not a club to keep people out; it is a hand reaching out to bring people in. Douglass spent his life trying to make that hand reach further. Now, it reaches to you.

  Welcome to the argument. Welcome to the struggle. Welcome to the promise.

  We are honored to have you. God bless you, and God bless the United States of America.
