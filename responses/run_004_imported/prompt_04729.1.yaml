prompt: |-
  You have been asked to give the keynote at a Constitution Day naturalization ceremony, immediately before several dozen new citizens take the Oath of Allegiance, and the organizers want the speech built around Frederick Douglass's own change of mind about the document being sworn to. For roughly the first decade of his public career, Douglass shared William Lloyd Garrison's judgment that the Constitution was a "covenant with death and an agreement with hell," given its accommodations for the slave trade, the three-fifths clause, and the return of fugitives. Around 1851 he broke publicly and painfully with Garrison, having come to argue that the document's actual text -- which nowhere uses the words "slave" or "slavery" -- could and should be read as an anti-slavery instrument, a position he later summed up by calling the Constitution "a glorious liberty document" and held, at real cost to old friendships, for the rest of his life.

  Most of your audience will know Douglass, if they know him at all, as the man who asked what the Fourth of July means to the slave, and a constitutional historian who has written on this very controversy will be seated in the front row. Write the eight-to-ten-minute speech: it must be moving and appropriate for new citizens and their families without flattening Douglass's position into either "the Constitution was simply good" or "Douglass simply rejected it."
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Constitution Day Naturalization Ceremony.
      *   **Audience:** New citizens (several dozen), their families/friends, a constitutional historian in the front row.
      *   **Task:** Keynote speech (8-10 minutes).
      *   **Theme:** Frederick Douglass's evolution on the Constitution (from "covenant with death" to "glorious liberty document").
      *   **Constraints:**
          *   Must be moving and appropriate for the occasion.
          *   Must *not* flatten Douglass's position (avoid simplistic "Constitution = Good" or "Douglass = Hated it").
          *   Acknowledge the historian in the front row (subtly or explicitly).
          *   Acknowledge the famous "What to the Slave is the Fourth of July?" speech but pivot to the less known constitutional evolution.
      *   **Tone:** Solemn, inspiring, intellectually honest, welcoming.

  2.  **Determine the Core Argument/Narrative Arc:**
      *   *Introduction:* Welcome the new citizens. Acknowledge the weight of the day. Introduce Douglass not just as an orator, but as a thinker who struggled with the very document they are about to swear allegiance to.
      *   *Phase 1 (The Critique):* Acknowledge the "covenant with death" phase. Validate the anger. The Constitution *did* protect slavery. Ignoring this is dishonest.
      *   *Phase 2 (The Turn):* The 1851 shift. Why did he change? Not because slavery ended, but because he saw potential in the text. The power of interpretation. The preamble ("We the People," "Liberty").
      *   *Phase 3 (The Application):* Connect this to the new citizens. They aren't inheriting a perfect country, but a promise. Like Douglass, they must hold the nation to its highest ideals.
      *   *Conclusion:* The Oath. It's not a declaration that the work is done, but a commitment to do the work.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start with the gravity of the moment. Constitution Day + Naturalization.
      *   **The Douglass Hook:** Everyone knows the 1852 speech ("What to the Slave..."). It's fiery, critical. But today is about the Constitution, and Douglass's view on *that* changed.
      *   **The "Covenant with Death":** Be honest. In the 1840s, he agreed with Garrison. The 3/5ths clause, fugitive slave laws. It wasn't abstract; it was blood and chains. *Self-Correction:* Make sure not to sound like I'm defending slavery, but explaining Douglass's *reasoning* at the time.
      *   **The Pivot (1851):** This is the crux. Why change? He read the text. No word "slave." "Person held to service." He realized the Constitution could be a weapon *against* slavery if interpreted correctly. This was risky. He lost friends.
      *   **The "Glorious Liberty Document":** Use the quote. But contextualize it. It wasn't a description of reality in 1851; it was a description of *potential*.
      *   **Connecting to New Citizens:** Why does this matter to someone taking the Oath today?
          *   Citizenship isn't blind loyalty.
          *   It's critical engagement.
          *   The Constitution is a tool, not a idol.
          *   Acknowledge the historian (a nod to accuracy).
      *   **The Oath:** The Oath of Allegiance isn't saying "America is perfect." It's saying "I will support and defend this framework, even when it's hard, to make it better."
      *   **Closing:** Welcome them.

  4.  **Refining the Tone and Timing:**
      *   *Word Count Check:* An 8-10 minute speech is roughly 1,000 to 1,300 words spoken at a moderate pace.
      *   *Tone Check:* Is it too academic? Need to make it emotional. Use phrases like "blood and soil," "promise and peril."
      *   *Nuance Check:* Ensure I don't imply Douglass thought racism ended. He thought the *text* allowed for freedom, even if the *practice* did not.
      *   *Historian Nod:* Keep it respectful. "I see those who study these words for a living..."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Welcome.
      *   Douglass is famous for hating July 4th.
      *   But he loved the Constitution later.
      *   First he hated it (Garrison).
      *   Then he read it closely (1851).
      *   He saw "We the People" includes everyone.
      *   You are new citizens. You join this argument.
      *   Take the oath.

  6.  **Drafting - Iteration 2 (Fleshing out the text):**
      *   *Opening:* "Welcome to this hall..."
      *   *Douglass:* "You may know him from the 1852 speech..."
      *   *The Shift:* "But there is a second act to that story."
      *   *The Text:* "Look at the words. No 'slavery'."
      *   *The Cost:* "He lost friends."
      *   *The Audience:* "You are taking an oath today."
      *   *The Meaning:* "It is a commitment to the argument."
      *   *Ending:* "Welcome home."

  7.  **Polishing and Nuancing (incorporating constraints):**
      *   *Constraint:* Don't flatten the position. *Solution:* Emphasize that Douglass knew the reality was hellish, but the *text* offered a legal path out. It was a strategic and moral reinterpretation, not a denial of suffering.
      *   *Constraint:* Historian in front row. *Solution:* Add a line about "strict construction" or "textual analysis" that signals respect for scholarship.
      *   *Constraint:* Moving for new citizens. *Solution:* Focus on the idea of *becoming* American through struggle, not just birth.

  8.  **Final Review against Time:**
      *   Read through at speaking pace. (Aiming for ~1200 words).
      *   Ensure the transition from Douglass's 1840s view to 1850s view is clear.
      *   Ensure the connection to the Oath is strong.

  **(Self-Correction during drafting):** I need to make sure I don't make Douglass sound like a naive optimist. His optimism was hard-won. I need to use words like "wrestled," "struggle," "interpretation." The Constitution wasn't magic; it was a battleground.

  9.  **Final Polish:** Check the rhythm. Ensure the ending lands with emotional weight. (Proceed to generate output).

  *(Word Count Check during drafting)*: Aiming for roughly 1300 words to allow for pauses and emphasis.

  *(Historian Check)*: Make sure the legal interpretation of the 3/5ths clause and the word "slave" is accurate to Douglass's argument. Douglass argued the 3/5ths clause was a penalty on slave states, not a definition of humanity. I should mention that briefly to show depth.

  *(Audience Check)*: Keep the language accessible but dignified.

