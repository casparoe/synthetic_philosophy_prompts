prompt: |-
  I'm a poli theory PhD student and this semester's seminar on medieval political thought spent two whole sessions on Aquinas's writings on tyrannicide, which turns out to be way messier than the "aquinas thought killing tyrants was sometimes fine" one-liner you get in undergrad. If I'm remembering the seminar discussion right, in his commentary on the Sentences he splits tyrants into two kinds: a tyrant "by defect of title" (a straight-up usurper with no legitimate claim to rule at all) versus a tyrant "by way of exercise" (someone who holds power legitimately but abuses it once in office). For the first kind, he seems fine with a private citizen killing the guy if there's no superior around to appeal to — he even cites Ehud assassinating Eglon in Judges as a praiseworthy example. For the second kind though, private individuals are NOT supposed to take matters into their own hands; it has to go through the community or some higher public authority. Then in De Regimine Principum he gets even more skittish about tyrannicide in general, warning that if you let private people decide for themselves when a ruler is "tyrant enough" to kill, ambitious men will just assassinate perfectly decent kings under that pretext, so mostly his advice is: endure it, pray, and wait for the legitimate authority (or God) to sort it out.

  What me and my study group can't agree on is how this framework would handle a case Aquinas obviously never had in mind: a president who wins a genuinely free election (so, clean title, zero usurpation by his lights) and then, once installed, hollows out the courts, jails independent journalists, and cancels the next election to stay in power indefinitely — with no pope or emperor above him to appeal to, and with the domestic bodies that would normally count as "the public authority" (courts, legislature, electoral commission) already captured by him. Based on the actual reasoning Aquinas gives rather than the pop-summary version: would he really be committed to saying this guy is still just a "tyrant by exercise," so that no private person — not a lone assassin, not a general plotting a coup, not a foreign government — may licitly move against him on their own initiative? Or does converting a legitimate title into something you keep only through ongoing fraud and coercion push him back into "defect of title" territory in Aquinas's eyes? And seperately, does Aquinas's own idea that "the community" can depose a ruler it originally appointed give any principled room for something like a mass popular uprising, as opposed to a single private actor, even once the formal institutions are gone? I'd like an actual reconstruction of how his categories and reasons bear on this, not just an "Aquinas allowed some resistance to tyranny" gloss.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in Political Theory.
      *   **Context:** Seminar on Medieval Political Thought, specifically focusing on Aquinas's views on tyrannicide.
      *   **Current Understanding:** They know the standard undergrad summary is wrong. They know the distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (abusive ruler). They know the *Sentences* commentary is more permissive than *De Regimine Principum*. They know the risk of sedition/anarchy is a major concern for Aquinas.
      *   **The Problem:** Applying Aquinas's framework to a modern scenario: A democratically elected leader who subverts democracy to stay in power (autogolpe/self-coup), with no higher secular or ecclesiastical authority to appeal to, and domestic institutions captured.
      *   **The Questions:**
          1.  Does subverting the office shift the ruler from "tyrant by exercise" to "tyrant by defect of title"?
          2.  Does Aquinas's allowance for "the community" to depose a ruler allow for mass popular uprising when formal institutions are captured?
          3.  What about foreign intervention or military coups?
      *   **Requirement:** Actual reconstruction of categories and reasoning, not pop-summary gloss. Needs to be rigorous, textually grounded, and sensitive to the nuances of Thomistic political theology.

  2.  **Deconstruct Aquinas's Textual Evidence:**
      *   *Commentary on the Sentences (II Sent., d. 44, q. 2, a. 2):* Distinguishes the two types of tyrants. Usurpers can be killed by anyone if no superior exists. Abusive rulers cannot be killed by private authority.
      *   *De Regimine Principum (On Kingship), I.6:* More cautious. Warns against the greater evil of sedition. Suggests public authority (not private) must act. Mentions the community's right to depose if they elected the king.
      *   *Summa Theologiae (II-II, q. 42, a. 2; q. 64, a. 3):* Sedition is a mortal sin. Killing is only lawful by public authority. Self-defense is individual, but regime change is public.
      *   *Key Principle:* The Common Good (*bonum commune*). Authority is for the sake of the community.

  3.  **Address Question 1: Defect of Title vs. Exercise in the Modern Scenario:**
      *   *Scenario:* Elected legitimately, then cancels elections/captures institutions.
      *   *Aquinas's Logic:* Title isn't just the initial moment of acquisition. It's ongoing legitimacy based on the *end* of rule (the common good).
      *   *Argument:* If the ruler voids the conditions under which title was granted (the constitutional order/election cycle), does he forfeit title?
      *   *Nuance:* Aquinas thinks in terms of feudal/monarchical hierarchy, not constitutional democracy. However, the *principle* of conditional authority exists. If a king breaks the coronation oath or fundamental law, does he become a usurper?
      *   *Scholarly Consensus:* Most Thomistic scholars argue Aquinas keeps them distinct. Even a terrible abuser retains the *office* unless formally deposed. To declare him a usurper *ex post facto* is dangerous (the "ambitious men" problem he warns about).
      *   *Conclusion:* Aquinas would likely still classify this as *tyrannus ex parte exercitii* because the initial title was valid. The shift to "defect of title" requires a formal judgment by a superior, which doesn't exist here. This creates the "Aquinas Trap."

  4.  **Address Question 2: The Community and Popular Uprising:**
      *   *Text:* *De Regimine Principum* I.6 explicitly says if the community provided the king, they can depose him.
      *   *Problem:* "The community" (*multitudo*) isn't a mob. It implies a corporate body acting through representatives or established custom.
      *   *Scenario:* Institutions are captured. Who speaks for the community?
      *   *Aquinas's View:* He fears sedition (*seditio*) more than tyranny. Sedition opposes the unity of the multitude.
      *   *Nuance:* If the ruler destroys the unity of the peace (by making war on the people), is it sedition to fight back? Aquinas says a tyrant fosters sedition; resisting him might not be sedition *if* done by public authority.
      *   *Conclusion:* A "mass popular uprising" is risky territory. If it looks like a mob, it's sedition. If it acts as a reconstituted "public authority" (e.g., local magistrates, estates), it has more ground. But a spontaneous revolution is hard to square with Aquinas's hierarchy.

  5.  **Address Question 3: Foreign Intervention and Military Coups:**
      *   *Foreign:* Aquinas is an imperial papalist (mostly). He acknowledges higher authorities (Emperor, Pope). In a modern sovereign state system, there is no "superior." Aquinas would likely view foreign intervention as an invasion unless authorized by a higher universal authority (which doesn't exist).
      *   *Military:* Is a general a "private person" or "public authority"? In medieval terms, a general acts for the king. If he turns on the king, it's treason unless the *community* authorizes it.
      *   *Conclusion:* Both are hard to justify under strict Thomistic terms without a formal declaration by a legitimate corporate body.

  6.  **Synthesize the "Aquinas Trap":**
      *   The core tension: Aquinas wants to prevent anarchy (private judgment) but acknowledges tyranny is evil.
      *   In a modern constitutional crisis with no higher appeal, Aquinas's system stalls. He relies on a hierarchy that no longer exists.
      *   *Theological Escape Hatch:* Prayer and patience (*ST* II-II, Q. 42). God removes tyrants.
      *   *Political Escape Hatch:* The "Community" must act *as* a public authority, not as private individuals. This requires a theory of constituent power that Aquinas hints at but doesn't fully develop for this scenario.

  7.  **Drafting the Response (Iterative refinement for PhD level):**
      *   *Tone:* Academic, rigorous, respectful of the texts, avoiding anachronism while addressing the hypothetical.
      *   *Structure:*
          1.  Validate the user's reading (it's correct, the distinction is key).
          2.  Analyze the "Defect of Title" question (Forfeiture theory).
          3.  Analyze the "Public Authority" question (Who speaks for the *multitudo*?).
          4.  Analyze the "Sedition" risk (The greater evil argument).
          5.  Conclusion: The Thomistic impasse and where the tension lies.
      *   *Key Citations:* *Sentences* II, d. 44; *De Regimine* I.6; *ST* II-II, q. 42 (Sedition).
      *   *Refinement:* Make sure to distinguish between *private* killing (assassination) and *public* deposition (resistance). The user asks about "private person... general... foreign gov." Need to address each.
      *   *Crucial Point:* Aquinas is not a contract theorist in the Lockean sense. Title isn't *automatically* voided by breach of contract. It requires a judgment. Who judges? That's the rub.

  8.  **Final Polish:** Check against the user's specific constraints ("actual reconstruction," "not pop-summary"). Ensure the distinction between *tyrannus ex defectu tituli* and *ex parte exercitii* is applied rigorously to the "self-coup" scenario. (Self-correction: Don't say Aquinas *would* support revolution. Say his framework makes it extremely difficult to justify *licitley* without falling into sedition.)

  9.  *(Self-Correction during drafting)*: I need to be careful about *De Regimine Principum*. It's partially by Ptolemy of Lucca. Book I is generally accepted as Aquinas. I should stick to Book I for the tyrannicide discussion. Also, need to mention that for Aquinas, the "Community" isn't just "the people" in a liberal democratic sense, but a corporate body with heads (magnates, estates).

  10. **Final Plan:**
      *   Acknowledge the sophistication of the prompt.
      *   Section 1: The Title Question (Does abuse void title?).
      *   Section 2: The Authority Question (Who acts for the community?).
      *   Section 3: The Sedition Question (The risk of greater evil).
      *   Section 4: The Theological/Teleological Escape.
      *   Conclusion: The structural gap in Thomistic thought regarding sovereign emergencies.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is an excellent question that cuts to the heart of the tension in Thomistic political theology between the *telos* of authority (the common good) and the *structure* of authority (hierarchy and order). You are right to be skeptical of the undergrad gloss; the seminar's distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (abuser) is the necessary starting point.

  However, applying this to a modern "autogolpe" (self-coup) scenario reveals a structural gap in Aquinas's framework. To reconstruct his position rigorously, we have to look at how he defines title, the nature of "public authority," and the sin of sedition.

  Here is a reconstruction of how Aquinas's categories bear on your scenario, broken down by the specific problems you raised.

  ### 1. Does Subverting the Office Void the Title? (*Ex Defectu* vs. *Ex Exercitio*)

  Your first question is whether a ruler who gains power legitimately but then destroys the mechanisms of that legitimacy (canceling elections, capturing courts) shifts from a tyrant by exercise to a tyrant by defect of title.

  **The Textual Constraint:**
  In his *Commentary on the Sentences* (II Sent., d. 44, q. 2, a. 2), Aquinas is clear that a tyrant by defect of title is one who "seizes power by violence or simony" without any just claim. A tyrant by exercise has a just claim to the office but rules unjustly.

  **The Thomistic Analysis:**
  Aquinas does not operate with a Lockean "breach of contract voids authority" model. For Aquinas, authority is ontological and hierarchical, derived ultimately from God (Romans 13:1), even if mediated through human election.
  *   **The Persistence of Title:** Once a ruler is installed via legitimate means (election, inheritance), the *title* inheres in the person relative to the office. Even if he rules badly, he remains the *princeps*. To declare him a usurper *ex post facto* requires a judicial judgment that he has forfeited the title.
  *   **The Judgment Problem:** Crucially, for Aquinas, a private individual cannot make that judicial determination. In the *Sentences*, he allows private killing of the usurper *only* because the usurper has no authority at all; he is essentially a private aggressor wearing a crown. But in your scenario, the president *was* legitimately installed.
  *   **Conclusion:** Aquinas would almost certainly classify this figure as a **tyrant by exercise**. Why? Because the initial title was valid. The fact that he now sustains power through fraud does not automatically retroactively invalidate the initial title without a superior authority declaring it so. Since there is no Pope or Emperor to issue that declaration of forfeiture, the ruler retains the *status* of public authority, however corrupted. This is the "Aquinas Trap": the tyrant retains the shield of public authority precisely because there is no higher human authority to strip it from him.

  ### 2. Who Acts for "The Community"? (*De Regimine Principum* I.6)

  You asked if Aquinas's idea that "the community" can depose a ruler allows for mass popular uprising when institutions are captured. This is the most fertile ground for resistance theory, but it is also highly constrained.

  **The Textual Constraint:**
  In *De Regimine Principum* (I.6), Aquinas writes: *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power."*

  **The Thomistic Analysis:**
  *   **The Multitude as Corporate, Not Atomic:** When Aquinas says "multitude" (*multitudo*), he does not mean an aggregate of private individuals or a mob. He means the community acting as a corporate body with a unified will, typically expressed through magnates, estates, or intermediate bodies (what later theorists would call "mixed constitution" elements).
  *   **Captured Institutions:** In your scenario, the legislature and courts are captured. Aquinas would view a spontaneous "mass popular uprising" with extreme suspicion. In the *Summa Theologiae* (II-II, q. 42, a. 2), he defines **sedition** as a special sin opposed to the unity of the multitude. If the "people" rise up without a formal structure of authority, it looks like sedition, which is a mortal sin.
  *   **Reconstituting Authority:** However, there is a principled opening. If the formal institutions are gone, the "right of the multitude" reverts to the community in its constituent capacity. But for Aquinas, this action must still mimic *public* authority, not *private* violence.
      *   **Licit:** Local magistrates, regional governors, or remaining untainted officials convening to declare the ruler deposed on behalf of the *res publica*.
      *   **Illicit:** A lone assassin, a general acting on his own ambition, or an unstructured mob.
  *   **Conclusion:** Aquinas provides room for **deposition**, but not **assassination**, and not **insurrection** in the modern sense. The resistance must be an act of the *corpus mysticum* of the polity, not private individuals. If the institutions are fully captured, Aquinas offers no clear mechanism for *who* convenes to speak for the community without falling into sedition. He assumes the existence of intermediate bodies (barons, bishops, estates) that can act as a check. If those are also corrupted, his theory stalls.

  ### 3. The Problem of Private Violence and the "Greater Evil"

  You asked about a lone assassin or a general plotting a coup. Here Aquinas is most consistent and most restrictive.

  **The Textual Constraint:**
  In *De Regimine Principum*, he explicitly warns against killing tyrants by private authority: *"It would be more dangerous for the multitude to attempt this... than for the tyrant to persist."* He argues that ambitious men will use the pretext of tyranny to kill good kings, leading to worse tyranny.

  **The Thomistic Analysis:**
  *   **The Monopoly on Violence:** For Aquinas, the use of lethal force for political ends is the exclusive prerogative of public authority. A private citizen killing a ruler is committing murder, even if the ruler is a tyrant, because the private citizen lacks the *commission* to act for the common good.
  *   **The General:** A military general is a tricky case. In medieval terms, he is a minister of the king. If he turns on the king without the consent of the community's representatives, it is treason (a form of sedition). If he acts *with* the consent of the magnates/community, he becomes the sword of the public authority.
  *   **The Foreign Power:** Aquinas acknowledges a universal hierarchy (Pope/Emperor). He might allow intervention by a superior authority (e.g., the Emperor deposing a local king). But in a modern Westphalian system where the president is sovereign, a foreign government is a "private" actor relative to that polity. Intervention would likely be viewed as invasion/aggression, not licit tyrannicide.
  *   **Conclusion:** A lone assassin is definitely out. A general is only in if he acts as the agent of the "community" (see point 2). A foreign government is likely out.

  ### 4. The Theological Escape Hatch

  If the political machinery jams (no superior authority, captured institutions, private violence forbidden), what does Aquinas actually advise?

  **The Textual Constraint:**
  In *De Regimine Principum* I.6, after ruling out private sedition, he says: *"There remains recourse to God... who can change the heart of the tyrant... or remove him."* He cites the example of Nebuchadnezzar.

  **The Thomistic Analysis:**
  This is not just piety; it is a political theorem. Aquinas prioritizes **Order** over **Justice** in the immediate term because the collapse of order (sedition) threatens the possibility of *any* common good.
  *   **Endurance:** He explicitly advises enduring a mild tyranny to avoid the risks of civil war.
  *   **The Threshold:** He implies there is a threshold where tyranny becomes so excessive it is worse than the war of resistance, but he leaves the judgment of that threshold to God or a higher human authority (which you have stipulated does not exist).

  ### Synthesis: The Thomistic Impasse

  To answer your core question directly: **Yes, Aquinas is committed to saying this guy is still a "tyrant by exercise," and therefore private persons (including lone assassins or rogue generals) may not licitly move against him on their own initiative.**

  Here is the reconstruction of the reasoning:
  1.  **Title Inherence:** Legitimate installation confers an ontological status that is not automatically voided by subsequent malfeasance without a judicial sentence from a superior.
  2.  **No Superior:** In the absence of a Pope/Emperor, there is no human judge to declare the title forfeit. Therefore, the ruler remains the *princeps*.
  3.  **Private vs. Public:** Killing the *princeps* is the exclusive right of public authority. Private individuals killing him commit sedition/murder, regardless of his tyranny, because they usurp the public sword.
  4.  **The Community Exception:** The only exception is if the "community" acts. But for Aquinas, the community acts through its "better parts" (magnates, estates), not the atomized populace. If those institutions are captured, Aquinas has no theory of "constituent power" that allows the people to reassemble as a legitimate authority without falling into the sin of sedition.

  **The PhD-Level Takeaway:**
  The tension you are hitting on is that Aquinas's political thought relies on a **hierarchical plenitude** that no longer exists. He assumes there is *always* a superior to appeal to (feudal lord, king, emperor, pope). Your scenario posits a sovereign state with no higher appeal and captured internal checks.

  In this specific "state of exception," Aquinas's system creates a **legitimacy vacuum**. He would likely argue that the sin of sedition (destroying the unity of peace) is objectively worse than the sin of tyranny (abusing power), because sedition destroys the very possibility of community, whereas tyranny is a corruption *within* a community.

  Therefore, strictly speaking, **Aquinas would counsel endurance** until God intervenes or until the "better parts" of the community can reconstitute a public authority to depose him formally. He would not license the lone assassin, and he would view the "mass popular uprising" as sedition unless it was led by remaining legitimate magistrates acting *in nomine multitudinis*.

  This is why later Thomists (like the Salamanca School, Suárez, and Mariana) had to radicalize the "community" aspect to justify resistance against modern sovereigns, moving closer to a contract theory that Aquinas himself hints at but ultimately pulls back from to preserve order.
