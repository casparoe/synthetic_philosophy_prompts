      *   *Premise 2:* It is necessary that might should be obeyed. (Reality/Pragmatism)
      *   *Observation 1:* Justice without might is helpless (people ignore it).
      *   *Observation 2:* Might without justice is tyrannical (people resent it).
      *   *Goal:* Combine justice and might.
      *   *Option A:* Make what is just strong.
