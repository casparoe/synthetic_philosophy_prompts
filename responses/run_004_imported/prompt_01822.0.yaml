      *   *Problem:* Justice is disputable (people argue about what's right). Might is indisputable (everyone knows who can crush them).
      *   *Constraint:* We cannot give might to justice (because might has taken over and claims *it* is justice).
      *   *Conclusion:* Since we can't make the just strong, we make the strong just.

