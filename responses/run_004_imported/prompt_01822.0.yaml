      *   *Answer:* It's a diagnosis of a con. Power *usurps* the title of justice. It doesn't mean true justice ceases to exist in the eyes of God or reason, but it ceases to function socially.
      *   *Nuance for the Magistrate:* A magistrate in the Fronde would feel this acutely. The law (Justice) is being overridden by armies (Might). He knows the law is "true," but he sees the soldiers winning.

  4.  **Address Question 2: The Missing Premise (The "And Thus"):**
      *   *The Gap:* Why does the inability to make justice strong lead to calling strength just?
