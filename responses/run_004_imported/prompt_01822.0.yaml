      *   *The Legitimization Mechanism:* Might alone is unstable (tyranny invites rebellion). To make Might stable, it needs a coat of paint. It needs to be *called* Justice.
      *   *The Missing Premise:* "Society requires a stable authority to function, and stable authority requires legitimacy."
      *   *The Switch:* Since we can't lift Justice up to power, we lower the definition of Justice down to power. We redefine "Just" to mean "Established by Power."
