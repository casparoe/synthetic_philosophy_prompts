answer: |-
  1. **The Explanatory Gap**
     You've argued for decades that the etiological account, while elegant, leaves us unable to talk about the functions of novel traits or systems that haven't undergone selection. But for many philosophers, the Cummins-style causal-role account feels less like a theory of *function* and more like a theory of *causal contribution*. When you introduce your view to students or colleagues, what is the specific explanatory work you think the concept of "function" is doing in biology that a bare description of causal roles cannot capture?

  2. **The Liberality Problem (Required)**
     The classic objection to your view is that it is too liberal: if a function is just any causal contribution to a containing system's capacity, then the heart's function includes making a thumping sound, because that sound contributes to the capacity of a doctor to diagnose a patient. How do you draw a principled line between the heart's function of pumping blood and its function of making noise, without quietly smuggling in our own explanatory interests as the thing doing the real discriminating work?
     *   **Follow-up:** You'll likely say that functions are relative to the specific *capacity* we are analyzing (circulation vs. diagnosis). But if the function depends on which capacity the analyst chooses to focus on, doesn't that make biological function objective only relative to a scientist's curiosity, rather than a fact about the organism itself?

  3. **Defining the Containing System**
     To build on that, your account relies heavily on the notion of a "containing system." In a complex organism, a single protein might be part of a cell, an organ, an organism, and an ecosystem simultaneously. Is there a metaphysical fact of the matter about which system is the relevant one for assigning function, or is the boundary of the system itself something we impose based on our research questions?

  4. **The Problem of Malfunction (Required)**
     This leads to the issue of normativity. On an etiological view, a heart malfunctions when it fails to do what it was selected to do. But on a purely systemic account, if a heart is beating irregularly, it is still playing a causal role—it's just a different one. What, on your view, could it even mean for a heart to "malfunction" in the ordinary medical sense, given that a component's current causal role doesn't seem to fix, by itself, what that component is *supposed* to be doing?
     *   **Follow-up:** If you appeal to a "reference system" or a "standard design" to define malfunction, where do we get the specifications for that standard if we aren't allowed to look at the evolutionary history that produced it?

  5. **Functional Norms without History**
     Philosophers like Neander argue that without selection history, you lose the normative force of function—the "ought." You can say what a trait *does*, but not what it *should do*. Do you think biology actually needs that strong sense of "ought," or is the etiological theorist chasing a normative ghost that isn't necessary for actual scientific practice?

  6. **The Symmetry of the Problem (Required)**
     I want to press on the structure of your defense. Getting rid of any historical requirement is exactly what lets you handle novel, unselected traits so easily; it's your biggest selling point. But isn't that the very same move that generates the liberality problem, just wearing a different hat? By severing the tie to history to save the novel cases, haven't you inevitably opened the door to the stethoscope cases?
     *   **Follow-up:** If the price of admitting novel functions is accepting liberal ones, would you be willing to endorse a pluralistic view where we use etiological functions for evolutionary explanations and causal-role functions for physiological ones, or do you think your account must do all the work?

  7. **Evolution as Constraint**
     Even if history doesn't *define* function, do you grant that evolution acts as a constraint on which causal roles are stable enough to be counted as functions? Or is it possible, on your view, for a trait to have a function today that evolution is actively working to eliminate tomorrow?

  8. **Comparing the Costs**
     Let's be fair to the etiological side. They accept that a *de novo* synthetic gene has no function initially, which seems counterintuitive. But you accept that a heart might have dozens of functions depending on the system analysis, which also seems counterintuitive. Why do you think the etiological theorist's error is the more dangerous one for biological science?

  9. **Homology and Analogy**
     In synthetic biology, we often design genes that are analogous to natural ones but share no homology. If a synthetic protein performs the same causal role as a natural enzyme but has no shared ancestry, does your view treat them as having the "same" function? If so, does that suggest your account is actually better suited for bioengineering than for evolutionary biology?

  10. **The Synthetic Case (Closing)**
      To bring this back to my work: I'm consulting on a documentary about *de novo* synthetic organisms. If a lab writes a gene from scratch, with no selection history behind it whatsoever, your view implies it has a function the moment it starts doing something in the cell. Is that a virtue of your view that we should broadcast to the public, or is it a bullet you have to bite—a technical truth that might mislead people about what it means to be "alive"?
