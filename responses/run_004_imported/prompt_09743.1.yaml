answer: |-
  "The rain suits the mood," Julian said, wiping condensation from the cab window. "But I still think you're being too hard on Truman in there. Anscombe's pamphlet is brilliant, but it collapses the distinction between intending death and foreseeing it."

  Sarah shook her head, pulling her coat tighter. "It doesn't collapse anything, Julian. It sharpens it. Anscombe isn't saying Truman shouldn't have foreseen civilian deaths. She's saying he made those deaths the *instrument* of victory. If the mechanism of surrender is terror, then the corpses are the means. You can't baptize that with Double Effect."

  "But look at the target description," Julian countered, leaning forward. "The official aim was destroying industrial capacity and military command structures embedded in those cities. The civilians were there, tragically, but the intention was directed at the war-making capability. Under Double Effect, an action is permissible if the bad effect—civilian death—is not the means to the good effect. The good effect here is ending the war by crippling production. The deaths are a side effect of destroying the factories, not the lever used to pull the surrender."

  Sarah turned to him. "Really? Then answer this: If the bombs had detonated over the factories but, by some miracle, killed no one—no flash, no radiation, just destroyed machinery—would the Japanese government have surrendered when they did?"

  Julian hesitated. "That's a counterfactual."

  "It's the test for intention," Sarah pressed. "If the answer is 'no,' then the civilian deaths weren't just side effects. They were the message. The shock value *was* the strategy. You don't terrorize machinery. You terrorize people. If the success of the act depended on the civilians dying to frighten the leadership into submission, then their death was the means. And Anscombe says choosing to kill the innocent as a means is always murder, regardless of the goodness of the end."

  "Okay, but you're conflating the psychological impact with the causal mechanism," Julian said, recovering. "The demonstration of power was necessary to break the political deadlock in Tokyo. The destruction of the cities signaled that *any* city could be destroyed. The deaths were evidence of that capability, yes, but the intention was to signal capacity, not to accumulate body counts. It's like a blockade. We starve civilians to force surrender. Is that intending their death as a means, or is it restricting supply to cripple the state, where death is a foreseen tragedy?"

  "A blockade restricts supply," Sarah said sharply. "The bomb delivered death directly. In a blockade, you hope they surrender before they starve. With the bomb, the death *was* the event. You can't separate the 'signal' from the 'massacre' when the signal is constituted by the massacre. If I shoot a hostage to show I'm serious, I haven't just 'foreseen' their death. I've used it."

  "But where do you draw the line with conventional bombing?" Julian asked. "When we firebomb Dresden or Tokyo, we know civilians will burn. Is that murder too? If so, Double Effect has no work to do in modern war. If not, what makes the atomic bomb different in kind, rather than degree?"

  "Anscombe would say the difference lies in the explicit targeting of the civilian sphere as the coercive element," Sarah replied. "But honestly, Julian, she'd likely condemn the firebombings too. The point isn't the technology. It's the structure of the will. Are you trying to destroy a military asset that happens to be near civilians? Or are you trying to destroy the civilians to break the will of the commanders who protect them? In Hiroshima, the military asset was the city's existence as a functioning community. You erased the community to stop the war."

  Julian sighed, looking out at the blurred streetlights. "So for you, the impasse is purely descriptive. It depends on how we describe the intention. If I describe it as 'ending the war by demonstrating overwhelming force,' the deaths are side effects. If you describe it as 'ending the war by massacring citizens,' the deaths are means."

  "Exactly," Sarah said. "And Anscombe argues we must describe actions truthfully. You cannot intend the destruction of a city without intending the death of the people who constitute it. You can't say 'I only intended to destroy the buildings' when the buildings were filled with people and the weapon was designed to vaporize them. The Double Effect defense requires that the bad effect not be the means. But if the horror is the point, the defense fails."

  "And I think," Julian said quietly, "that you're demanding a purity of intention that ignores the messy reality of coercive diplomacy. The intention was to stop a global conflict. The deaths were the cost, not the tool."

  "But who pays the cost?" Sarah asked. "If you decide innocents must pay the cost to achieve your goal, you've already made them means."

  The cab slowed at a red light. Neither spoke. The disagreement wasn't about the math of lives saved; it was about the architecture of the choice itself, and whether any justification could bridge the gap between 'allowing to die' and 'killing to win.'
