      *   *Counter-Argument:* The "Necessity of Charity" argument. Augustine ranks lies, admitting some are venial. In a life-or-death scenario, preventing murder is a higher charitable good than preserving abstract truth-telling norms. By refusing to lie, we might prioritize our own moral purity over the resident's physical safety.

