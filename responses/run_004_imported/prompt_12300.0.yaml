answer: |-
  **MEMORANDUM**

  **TO:** Policy Committee, [Shelter Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Confidentiality Scripts and Verification Requests

  **Recommendation**

  I recommend the committee adopt a strict "Never Confirm or Deny" (NCND) policy. Staff should be authorized and trained to state only that the shelter cannot disclose information regarding the presence or absence of any individual. We should **not** authorize staff to issue outright denials (e.g., "No, she is not here"), even when the asker is judged to be dangerous.

  This policy applies uniformly to phone and in-person inquiries. There should be no exceptions based on staff assessment of the asker's threat level.

  **Rationale**

  1.  **Staff Safety and Cognitive Load:** Requiring staff to assess the "danger level" of an asker before deciding whether to lie places an undue burden on them during high-stress interactions. A uniform script removes the need for split-second ethical triage.
  2.  **Institutional Integrity:** If the shelter is ever legally compelled to disclose records, having a established practice of truthfulness (even when concealing) protects our credibility with courts and law enforcement.
  3.  **Ethical Distinction:** This approach maintains a clear ethical line between *concealment* (withholding information) and *falsehood* (asserting what is known to be untrue). We can protect residents through silence or ambiguity without corrupting the function of speech.

  **Staff Guidance for High-Risk Interactions**

  *   **The Script:** "Our policy strictly prohibits confirming or denying whether any individual is a client here. I cannot answer that question."
  *   **Persistence:** If the asker presses, repeat the script once. Do not elaborate or justify.
  *   **Threats:** If the asker becomes aggressive or implies violence, staff are authorized to disengage immediately. "I am ending this conversation now." Follow immediately with safety protocols (alerting security/local law enforcement).
  *   **Misleading Truths:** Staff may use technically true statements if they aid safety (e.g., "We have no record of that name," if the resident is registered under a pseudonym), provided this does not drift into an explicit falsehood.

  **Consideration of the Counter-Argument**

  In drafting this recommendation, I have weighed the argument for authorizing "officious lies" (lies told to prevent harm). Proponents argue that in life-or-death scenarios, the moral gravity of a lie is outweighed by the physical safety of a resident.

  Engaging the Augustinian framework often cited in these debates: Augustine argues lying is categorically worse than concealment because it corrupts the natural function of speech (communicating thought), thereby damaging the soul and the social bond, regardless of consequence. He admits lies vary in gravity—an "officious" lie is less sinful than a malicious one—but maintains it remains a sin.

  The strongest argument *against* my recommendation is that this absolutism may prioritize the moral purity of the speaker over the tangible safety of the neighbor. If the purpose of ethics is charity (love), and a lie prevents a murder without harming an innocent third party, refusing to lie could be seen as valuing an abstract rule over a concrete life. Critics argue that Augustine's own ranking of lies implies a calculus of harm; in a scenario where the "harm" of the lie is negligible (a verbal falsehood to an abuser) and the harm of truth is maximal (death of a resident), the duty of charity should supersede the duty of veracity.

  While I acknowledge the force of this concern, I maintain that a uniform NCND policy achieves the necessary safety without requiring staff to cross the line into falsehood, thereby preserving both resident security and institutional integrity.

  **Next Steps**

  If the committee agrees, I will draft the specific scripting language for staff training manuals by [Date].
