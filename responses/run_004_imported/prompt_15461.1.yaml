      *   *Premise 2:* Capable agents will avoid being exploited.
      *   *Conclusion:* Capable agents will behave as EU maximizers.
      *   *Further Conclusion:* EU maximizers have fixed goals, leading to instrumental convergence (self-preservation, etc.).

  3.  **Identify the Counterarguments/Criticisms (The "Gaps"):**
      *   *Gap 1: Theorem vs. Reality.* The theorems apply to *choices*, not necessarily internal architecture. An system can *act* coherently without *being* an EU maximizer internally (e.g., heuristic-based, model-free RL).
      *   *Gap 2: "Policy" vs. "State-Action".* Coherence theorems usually assume choices are made in isolation or specific contexts. Real agents operate over time. A policy can be coherent without maximizing a static utility function over states.
      *   *Gap 3: Completeness Axiom.* This is the weakest link. Agents can have incomplete preferences (prefer A to B, indifferent between B and C, but no relation between A and C). This avoids money pumps without forcing a single utility function.
      *   *Gap 4: Bounded Rationality.* Real agents (even advanced ones) have compute limits. Exact EU maximization is computationally intractable. They might approximate, and those approximations might not look like "goal-directed" in the scary sense.
      *   *Gap 5: The "Goal" Definition.* EU maximization doesn't necessarily imply a *simple* or *fixed* goal like "maximize paperclips." The utility function could be over trajectories, histories, or be highly complex/uncertain (e.g., inverse reinforcement learning).
      *   *Gap 6: Training Dynamics.* How the AI is trained matters. Gradient descent doesn't necessarily produce coherent agents; it produces agents that minimize loss on a training distribution. Coherence might not emerge out-of-distribution.
      *   *Gap 7: Recent Academic Pushback.* Mention specific recent papers (e.g., Gustafsson, Shah, Christiano) that challenge the inevitability.

  4.  **Structure the Response:**
