      *   *Key Names/Papers:* Mention the "Coherence Theorems" (VNM, Savage). Mention recent critiques (e.g., from the "Alignment Forum" or academic decision theory). *Self-Correction:* Keep it accessible but technical enough for a journalist who has done homework. Don't get bogged down in math, focus on the conceptual gaps.
