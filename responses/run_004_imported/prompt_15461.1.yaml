  1.  **Analyze the User and the Request:**
      *   **User:** A journalist or writer working on a feature about the philosophical underpinnings of AI existential-risk arguments. They are knowledgeable enough to reference Omohundro, Yudkowsky, coherence arguments, money pumps, and instrumental convergence.
      *   **Task:** Explain why the "coherence arguments" for expected utility (EU) maximization are *not* considered settled fact by many decision theorists and AI safety researchers, despite sounding like airtight theorems.
