answer: |-
  **Setting:** *A quiet study in Oxford, late afternoon. Rain taps against the window. P.F. Strawson (Peter) sits in a worn armchair, a pipe unlit in his hand. Galen Strawson sits opposite him, holding a copy of the 1962 Proceedings of the British Academy. There is tea on the table between them. The atmosphere is warm, but the air is thick with unsaid arguments.*

  **Galen:** I've been reading this again, Father. "Freedom and Resentment." It remains one of the most humane pieces of philosophy ever written. It saves us from the chill of hard determinism. But I'm afraid I still can't accept it as a solution to the problem I'm worried about.

  **Peter:** I wouldn't expect you to accept it simply on authority, Galen. But tell me: where does the shoe pinch? Is it the metaphysics?

  **Galen:** It's not the metaphysics. That's the point. My argument doesn't depend on whether determinism is true or false. It depends on the logic of *desert*. You argue that moral responsibility is constituted by our reactive attitudes—resentment, gratitude, indignation. You say we can't abandon these attitudes, so we can't abandon responsibility. But that seems to answer a psychological question with a normative label. You're telling me we *do* hold people responsible. I'm asking if anyone *is* responsible. In the ultimate sense.

  **Peter:** But what is this "ultimate sense" if not a phantom? You want a justification for our practices that stands outside those practices. You want to step out of the human community to judge whether the human community is justified in feeling what it feels.

  **Galen:** I want to know if the feeling is a mistake. Suppose I resent you for hurting me. If it turns out that you could not have done otherwise—not because of coercion, but because of the structure of your character and the laws of nature—then my resentment is based on a falsehood. It assumes a power you didn't have. You say, "We can't help resenting." Fine. We also can't help fearing heights sometimes, even when we know we are safe on a glass balcony. The persistence of the feeling doesn't make it rational. It might just be a useful illusion.

  **Peter:** Ah, but the analogy with the glass balcony is where you lose me. Fear of heights is a reaction to a *belief* about danger. If the belief is false, the fear is irrational. But reactive attitudes aren't reactions to a metaphysical theory about causation. They are reactions to the *quality of will* displayed by another person. When you resent me, you aren't making a claim about the history of the universe. You are responding to my disregard for you.

  **Galen:** But the disregard itself was inevitable! That's the Basic Argument. To be truly responsible for the disregard, you would have to be responsible for the character that produced it. And to be responsible for that character, you would have to have chosen it. But you would have chosen it based on *prior* values. And where did those come from? You end up needing to be *causa sui*—self-created. Which is impossible. So, if I resent you for your disregard, I am resenting you for something that ultimately traces back to factors you didn't choose.

  **Peter:** I grant you the impossibility of *causa sui*. No one creates themselves out of nothing. But why do you think moral responsibility requires that? You are demanding a kind of responsibility that belongs to a god, not a human being. My claim is that "responsibility" just *means* being an appropriate target of reactive attitudes within a relationship. If you strip away the relationships and the attitudes to look for some shiny, metaphysical core of "True Desert," you aren't finding a deeper truth. You're dissolving the concept entirely.

  **Galen:** I'm not dissolving it, Father. I'm clarifying it. I'm saying that the concept we *want*—the one that supports retributive justice, the one that makes blame more than just a tool for behavior modification—requires that ultimate control. If we don't have it, then your "participant stance" is a game we play, but the scores don't actually matter. You compare this to Hume on induction. We can't justify induction from outside science, so we accept it.

  **Peter:** Precisely.

  **Galen:** But here is where I press you. Hume showed we can't justify induction *rationally*. He didn't say induction is therefore "true" in some deep sense. He said we are animals who expect the sun to rise. If I ask, "Is induction reliable?" and you answer, "We can't stop using it," you haven't answered the question. You've changed the subject from *truth* to *psychology*. Similarly, if I ask, "Do we deserve blame?" and you answer, "We can't stop blaming," you haven't proved we deserve it. You've only proved we are stuck with the practice.

  **Peter:** No, Galen. Listen closely to the Humean point. It isn't merely that we are psychologically incapable of abandoning induction. It's that the demand for an external justification is *unintelligible*. What would a justification of reasoning look like that didn't use reasoning? It's nonsense. Similarly, what would a justification of our moral interactions look like that didn't use our moral interactions? To ask if our reactive attitudes are "really justified" implies there is a standpoint of "Real Justification" outside of human life. There isn't. The reactive attitudes *are* the framework within which questions of justification make sense.

  **Galen:** So, any question I ask from outside that framework is nonsense?

  **Peter:** Not nonsense. But it is idle. It has no grip on us. If you discover that determinism is true, does that stop you from feeling gratitude when I make you tea? Does it stop you from feeling hurt if I insult you?

  **Galen:** No. But I might see the hurt as a natural error, like a visual illusion. I see the stick in the water as bent. I know it's straight. I still see it as bent. I'm saying we should view moral responsibility like the bent stick. We feel the blame, we know it's logically incoherent, so we adopt the Objective Attitude globally. We treat everyone as patients to be managed, not agents to be engaged.

  **Peter:** And there is your error. You think the Objective Attitude is a viable global alternative. It isn't. It is a limited resource. We can use it for the very young, or the severely disturbed. But to adopt it toward everyone—to view your wife, your children, your friends purely as objects to be managed—is not just difficult. It is humanly impossible. It would mean the end of love, of friendship, of the very things that give life value. You are asking us to trade our humanity for a logical consistency that buys us nothing.

  **Galen:** But if the logic holds, the cost is irrelevant! Truth isn't determined by comfort. If the Basic Argument is sound, then no one is ultimately responsible. If no one is ultimately responsible, then retributive blame is always unjust. It might be useful to pretend otherwise to keep society running, but that's a pragmatic lie. You're arguing that we should keep the lie because the truth is too cold to live in.

  **Peter:** I am arguing that it isn't a lie! That is the crux of it. You assume that the only "truth" is the metaphysical truth about causal chains. I am saying there is a truth about human life that is equally real. The truth of the relationship. When I wrong you, the reality of that wrong isn't found in the causal history of my neurons. It's found in the breach of expectation between you and me. To say that breach "doesn't matter" because of the Basic Argument is to privilege a theoretical construct over lived reality.

  **Galen:** I privilege logic over coherence of practice. If the practice relies on a contradiction—that I am responsible for what I did not ultimately cause—then the practice is flawed. You say the demand for ultimate responsibility is a demand for godhood. I say the demand is simply for consistency. If I am to be blamed, I must be the source of the action in a way that stops the regress. If I can't be that, then blame is essentially punitive violence, however polite we make it sound with words like "reactive attitudes."

  **Peter:** Then we are at an impasse. You see the reactive attitudes as a shadow cast by a metaphysical error. I see them as the light by which we see anything moral at all. You want to step into the void to check if the ground is solid. I am telling you the void is where nothing makes sense.

  **Galen:** And I am telling you that staying on the ground doesn't make the void disappear. We may not be able to live without these attitudes. We may not be able to live without induction. But that doesn't make them *true* in the way that matters for justice. It just makes them necessary fictions.

  **Peter:** Necessary fictions... You use the word "fiction" as if it means "false." But a story can be true without being a list of physical facts. The truth of a promise isn't in the physics of the sound waves. It's in the commitment. Responsibility is like that. It exists *in* the stance. If you abandon the stance, you don't find the "real" truth about responsibility. You find nothing.

  **Galen:** Then I suppose I must be content with finding nothing, rather than believing in something incoherent. I can respect the participant stance as a biological necessity, Father. I can even participate in it myself. I cannot help but feel resentment. But I will not call it *just*. I will call it human.

  **Peter:** And I will say that "human" is the only place where "just" has any meaning. You want a justice that floats above humanity. I am satisfied with a justice that lives within it.

  **Galen:** *[He sets the paper down on the table.]* Then we agree on the facts. We disagree on whether the facts are enough.

  **Peter:** *[He picks up his pipe, turning it over in his hands.]* Perhaps that is all philosophy can ever achieve. To show us exactly where we must choose, even when reason cannot choose for us.

  **Galen:** Or to show us that the choice is an illusion, too.

  **Peter:** *[A small, weary smile.]* We shall see. Tea?

  **Galen:** Yes. Thank you.

  *[Peter pours the tea. The steam rises between them, obscuring the space for a moment, before clearing. Neither man looks entirely satisfied, but both remain seated.]*
