answer: |-
  **MEMORANDUM**

  **TO:** Science Advisory Committee, Natural History Museum
  **FROM:** [Your Name], Science Advisory Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposed Popper Panel for Evolution Hall

  Colleagues,

  I am writing to recommend that we **reject the proposed panel text as written**, though I ask we do so without questioning the Trustee's good faith. Having spent thirty-five years in genetics and the last few years deep in philosophy of science, I recognize the citation. The Trustee is correct that Karl Popper initially argued natural selection was unfalsifiable. However, presenting this claim without its subsequent retraction is historically incomplete and scientifically misleading.

  To be concrete: In the 1970s (specifically *Unended Quest*, 1974), Popper classified natural selection as a "metaphysical research program." His concern was tautology: if "fitness" is defined solely by survival, then "the fittest survive" is true by definition, not by empirical test. For a brief window, he suggested it was not a testable theory in the same way as Einsteinian gravity.

  However, in 1978, Popper explicitly retracted this view in his paper "Natural Selection and the Emergence of Mind." He wrote: *"I have changed my mind about the testability and logical status of the theory of natural selection."* He acknowledged that selection pressures can be measured independently of survival, making the theory empirically testable and falsifiable. Current philosophy of biology largely considers the "tautology objection" resolved.

  Therefore, a panel stating "Popper argued natural selection is not a falsifiable scientific theory" is factually true only in the sense that "Newton argued light was made of particles" is true. It ignores the correction that defines our current understanding. For a museum exhibit, presenting a superseded philosophical critique as a standalone point of "intellectual honesty" risks confusing the public. To a twelve-year-old, this does not read as nuance; it reads as "Scientists admit evolution isn't real science."

  **Recommendation**

  1.  **Do not install the panel as currently drafted.** It presents a retracted philosophical position as current scientific debate.
  2.  **If the Committee feels compelled to address the philosophy of science,** we should approve a **rewrite** that contextualizes the history. The text must explicitly state that Popper later corrected this view.
  3.  **Ideally, omit the panel entirely.** Our goal is to teach evolutionary biology, not the history of philosophical errors regarding biology.

  **Action Plan**

  *   **By this Friday:** I will draft a specific alternative text that includes Popper's retraction for the Trustee's review. This ensures his interest in philosophical rigor is respected without compromising scientific accuracy.
  *   **By Next Monday:** The Curatorial Lead should cost out the labor for revising the panel versus omitting it.
  *   **Next Tuesday's Vote:** We vote on either the **Omission** or the **Revised Text**. The current text should be withdrawn.

  We owe the public the most accurate science available, not a snapshot of a debate settled forty years ago. We can honor Popper's honesty by acknowledging his retraction, not by freezing his error in permanent display.

  Thank you.
