      *   *Jaynes vs. Van Fraassen:* Jaynes would say "Did you specify the constraints correctly?" Van Fraassen says "The method itself is flawed for conditionals."
      *   *The "Expert" Angle:* Since the user knows Jaynes, appeal to the distinction between *physical constraints* (MaxEnt in stat mech) vs. *epistemic constraints* (MinxEnt in belief revision). In physics, the constraint *is* the physics. In epistemology, the constraint is a report *about* the physics. The report might not carry the same ontological weight.

