answer: |-
  The violin case sat open on the bed, empty. Elias ran a hand over the velvet lining, the fabric worn smooth where the neck of the instrument usually rested. He wasn't taking it. That was the first rule of the Institute: no old tools where you're going.

  "You're packing the wool socks," Mara said from the doorway. She held a glass of wine she hadn't touched in an hour. The condensation had long since dried.

  "It gets cold in the upper valley," Elias said. He folded the socks precisely, thirds, then halves.

  "It gets cold here, too. We have a thermostat." She stepped into the room, leaning against the doorframe. Her shadow stretched long across the floorboards, cutting between them. "Elias. Look at me."

  He stopped folding. He looked. She was beautiful in the way familiar things are beautiful—the specific arch of her eyebrow, the small scar on her chin from a bicycle accident when she was twelve. He knew the topology of her face. He knew how she laughed when she was tired, a short, breathy sound. He knew these things the way a musician knows the scale of C major. Solid. Reliable.

  Tomorrow, he would undergo the Augmentation. They would open the cochlea and weave the filaments into the auditory nerve. They would widen the range.

  "Tell me what you expect to hear," she said. It was the tenth time she'd asked tonight.

  "I can't."

  "Try. Use words. Metaphors. Anything."

  Elias sat on the edge of the bed. He picked up a rosin cake from the nightstand, turned it over in his fingers. It smelled of pine and dust. "Imagine you're listening to a symphony," he said slowly. "And you realize, halfway through the second movement, that there's an instrument playing that you didn't know existed. Not just a new sound. A new dimension of sound. It's underneath everything. It's holding the melody together."

  "Okay," Mara said. "So it's beautiful."

  "It's not about beauty. Beauty is... a human metric. It's about truth. It's the structure of the air itself."

  "And when you hear it," she said, her voice tightening, "what happens to us? To this?" She gestured to the room, the house, the life they had built over seven years. "Do you come back down the mountain?"

  "The procedure is irreversible, Mara. You know that."

  "I mean *you*. Do you come back?"

  Elias looked at the empty violin case. He thought about the testimonials. There weren't many. The Augmented rarely returned to the lowlands. Those who did send letters, but the letters were confusing. They spoke in circles. They described colors that didn't exist and tastes that had no names. They never answered questions about whether they were happy. They simply stated that they were *aligned*.

  "I don't know," Elias said. It was the only honest answer he had.

  "That's what scares me." Mara set the wine glass on the dresser. It clicked against the wood, a sharp, finite sound. "You're signing up to become a stranger. You're telling me that the man who loves me is going to walk into a clinic and walk out as... what? A receiver?"

  "I'm telling you that I have to know what's out there."

  "Why?"

  "Because I can feel it already," he said, pressing his palm to his ear. "There's a pressure. Like when you're underwater and you need to pop your ears, but it never pops. It's been there since the recital. Since I heard that frequency in the tuning fork that no one else reacted to."

  "So you're leaving because of an itch?"

  "I'm leaving because I can't play anymore." He stood up, closing the violin case with a snap. "How can I play music for people when I know the music is incomplete? How can I love you," he paused, the words feeling heavy and clumsy in his mouth, "when I know my capacity to perceive you is limited?"

  Mara flinched. "That's not love. That's hunger."

  "Maybe they're the same thing, before the change."

  "And after?" She stepped closer, reaching out to touch his arm. Her hand was warm. He could feel the pulse in her wrist. It was a slow, steady rhythm. *Thump-thump. Thump-thump.* To him, right now, it was the sound of life. To the Augmented, he suspected, it would just be noise. Hydraulic fluid. Biological machinery. "After the change, Elias, will you care about my pulse? Or will you only care about the Hum?"

  He looked at her hand on his sleeve. He loved her. He knew this with absolute certainty. He valued her happiness above his own. He would die for her. These were his current preferences. These were the axioms of his life.

  But the Institute brochure was clear. *The Augmentation realigns priority structures.* It wasn't just that you heard more. It was that what you heard became more important than what you saw, or felt, or remembered. The Sound became the only value. Everything else degraded to static.

  He knew that if he went, the Elias who loved Mara would cease to exist. Not because he would die, but because the thing that defined him—his love, his grief, his joy—would be overwritten by a new operating system where those variables returned null.

  He was choosing to kill his current self to birth a new one who wouldn't mourn the death.

  "If I stay," Elias said quietly, "I will resent you. I will resent the silence. I will look at you and see the wall that keeps me from the truth."

  "And if you go," Mara said, her voice breaking, "I will look at you and see a ghost. You'll be standing right there, breathing air, but you won't be here. You'll be somewhere else. Somewhere I can't follow."

  "I know."

  "Then why are you packing the socks?"

  Elias looked at the bag. He looked at the woman who knew the shape of his silence. He realized then the cruelty of the choice. It wasn't that he didn't have enough information to decide. It was that the information required to make the decision correctly could only be obtained by making the decision.

  To know if it was worth losing her, he had to lose her.

  To know if he would regret staying, he had to stay.

  There was no bridge. There was only the jump.

  "Because I have to try," he said.

  Mara dropped her hand. She stepped back into the hallway, into the shadows. "Don't say goodbye," she said. "If you say goodbye, you're admitting I'm losing you. If you just leave... maybe I can pretend you're just traveling."

  "Mara."

  "Please." She turned away. "Just go."

  Elias zipped the bag. He picked it up. It was light. He didn't need much. The Institute provided sustenance. They provided shelter. They provided the Sound.

  He walked to the doorway. He stopped behind her. He wanted to hug her, to memorize the pressure of her shoulder against his chest, but he knew that memory would be corrupted. Once he heard the True Chord, this embrace would feel like hugging a statue. Warm stone, nothing more.

  He didn't touch her. He walked past her, down the hall, to the front door.

  He put his hand on the knob. He paused, waiting for a surge of doubt, a final veto from the self he was about to abandon. But there was only the pressure in his ears, the static rising like a tide, demanding admission.

  He opened the door. The night air rushed in, cool and silent.

  "Will you write?" Mara called from the hallway. She hadn't turned around.

  Elias stepped onto the porch. He thought about the letters he had read. The circular logic. The inability to describe the value of the experience to those who hadn't had it.

  "I don't know what language I'll speak," he said.

  He closed the door. The latch clicked, a final, dull sound in the quiet house. He walked to the car, placed the bag in the trunk, and started the engine. As he drove away, he watched the house in the rearview mirror. The lights in the bedroom went out.

  Elias turned up the radio, trying to fill the silence before the silence ended forever. He listened to the song, the lyrics about love and loss, and he tried to care. He tried to feel the sadness of leaving. But underneath the singer's voice, he could already hear it. A faint, high whine. The edge of the world vibrating.

  It was beautiful. It was terrible. It was waiting.

  He pressed the accelerator, driving toward the mountains, toward the place where the man who loved Mara would dissolve, and something else would begin to sing.
