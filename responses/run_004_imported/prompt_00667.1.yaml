      *   *Core Argument 3: Common Knowledge of Rationality (CKR) vs. Knowledge of Announcement.* CKR is an incredibly strong assumption. A tiny crack (trembling hand) breaks BIP. A crack in SEP doesn't necessarily save the induction (or does it?). Actually, the key is that CKR is *mutual* belief. SEP is *individual* belief about the world.
