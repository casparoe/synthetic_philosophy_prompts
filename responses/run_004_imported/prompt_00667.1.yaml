      *   Use specific terminology (off-equilibrium, CKR, Moorean sentences, Nash Equilibrium).

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I explain *why* Sorensen doesn't work for BIP?
      *   *Correction:* Make sure to emphasize that Sorensen relies on the *content* of the announcement being self-defeating. In BIP, the "content" is just payoff matrices. There's no self-referential statement to be a blindspot.
