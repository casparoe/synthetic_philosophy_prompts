prompt: |-
  I'm drafting a scene in my novel where my main character, a poker pro turned actuary, explains to her new boyfriend why hes an easy mark. She tells him that Dutch book arguments prove that since his preferences aren't transitive — he likes whiskey over beer, beer over wine, but then turns right around and likes wine over whiskey — a sharp enough bookie could just keep trading him around that loop and drain him dry forever, no odds or probabilities needed at all, since it's purely about what he likes better than what. It's a fun speech and very her, so I don't want to cut it, but I realize I've never actually checked whether thats really what Dutch book arguments show. Does that sound right to you, and if my bookie character actually tried this on him at a bar, would the trick really work the way she describes?
