answer: |-
  This is a fantastic detail for a character. It immediately establishes your protagonist as someone who sees the world through risk, utility, and game theory. It's smart, slightly condescending (in a fun way), and reveals her background without a dry info-dump.

  Here is the breakdown of the math, the terminology, and the logistics so you can keep the scene accurate without losing the flair.

  ### 1. The Theory: Is she right?
  **Yes, the logic is sound.**
  If an agent has intransitive preferences (A > B, B > C, C > A), they are vulnerable to exploitation. In decision theory, this is the classic argument for why rational agents *must* have transitive preferences. If you don't, you are irrational, and irrationality gets punished in the market.

  **However, the terminology is slightly off.**
  Since your MC is an **actuary**, she would likely distinguish between a **Dutch Book** and a **Money Pump**.
  *   **Dutch Book:** Usually refers to incoherent *probabilities* (e.g., assigning odds that sum to more than 100%). A bookie constructs a set of bets that guarantees a loss regardless of the outcome.
  *   **Money Pump:** Refers to intransitive *preferences* (e.g., the whiskey/beer/wine loop). A bookie constructs a series of trades that cycles the agent back to the start while extracting a fee each time.

  **The Fix:** Have her call it a **"Money Pump."** It sounds just as cool, it's more accurate for an actuary, and it avoids pedantic readers nitpicking the difference between belief (probability) and taste (preference). You can even have her say, *"It's like a Dutch Book, but for your tastes. A Money Pump."*

  ### 2. The Mechanics: Would it actually work?
  For the trick to work as described ("drain him dry"), one crucial element must be present in the scene: **Transaction Costs.**

  If the bookie simply swaps the drinks 1-for-1 (Whiskey for Beer, Beer for Wine), the boyfriend ends up back where he started with the same amount of money. He loses nothing but time.
  To "drain him dry," the bookie must charge a **premium** for each upgrade.

  **How the loop works:**
  1.  Boyfriend has **Beer**. Bookie offers **Whiskey**. Boyfriend prefers Whiskey > Beer, so he pays **$5** to swap.
  2.  Boyfriend has **Whiskey**. Bookie offers **Wine**. Boyfriend prefers Wine > Whiskey, so he pays **$5** to swap.
  3.  Boyfriend has **Wine**. Bookie offers **Beer**. Boyfriend prefers Beer > Wine, so he pays **$5** to swap.
  4.  **Result:** Boyfriend has his original Beer, but he is **$15 poorer**.
  5.  **Repeat:** The bookie keeps the inventory flowing and collects $15 every cycle.

  **The Fix:** Ensure the dialogue mentions that he has to "pay a little to upgrade" or "throw in a buck for the trade." Without that fee, there is no pump.

  ### 3. The Setting: Bar Logistics
  Executing this physically at a bar with half-drunk glasses is a bit messy (and germophobic). Here are two ways to stage it realistically:

  **Option A: The Tab (Cleanest)**
  They aren't trading physical liquid; they are trading *orders*. The bookie is controlling the tab.
  *   "Order a beer." (He pays).
  *   "Actually, I'll cover the beer if you buy the whiskey." (He pays for whiskey).
  *   "Wait, wine is better." (He pays for wine).
  *   *Critique:* This feels more like indecision than a pump.

  **Option B: The Chips/IOU (Most "Poker Pro" Vibe)**
  Since she's a poker pro, they might be playing with chips or betting on the drinks.
  *   They each buy a round. The bookie has all three drinks in front of him.
  *   "I'll trade you my full whiskey for your full beer plus $5."
  *   This keeps the inventory clear and the transaction explicit.

  **Option C: The "Theoretical" Speech (Easiest)**
  She explains it as a hypothetical. *"If a sharp enough bookie sat you down..."* This removes the need to stage the physical swapping in the bar, which can slow down the pacing. You get the character insight without the logistics of swapping half-drunk beers.

  ### 4. Suggested Tweaks for the Dialogue
  Here is a version of the speech that keeps your original intent but tightens the technical accuracy for an actuary character:

  > "You're an easy mark because your preferences aren't transitive. You like whiskey over beer, beer over wine, but then you turn around and say wine is better than whiskey. Do you know what that makes you?"
  >
  > "Thirsty?"
  >
  > "A money pump. It's the preference version of a Dutch Book. If a sharp enough bookie sat you down, he wouldn't even need to set odds. He'd just trade you whiskey for your beer for a five-spot. Then wine for the whiskey for another five. Then beer for the wine for a third. You'd end up right back where you started, drinking the same beer, but he'd have drained your wallet dry. And since your preferences don't change, he could do it forever."

  ### Summary Checklist for Your Scene
  1.  **Change "Dutch Book" to "Money Pump"** (or acknowledge the relationship). It boosts her credibility as an actuary.
  2.  **Include the "Fee."** Make sure it's clear he pays a small amount to make each swap. That's where the money comes from.
  3.  **Inventory.** If the bookie actually *does* this in the scene, the bookie needs to have all three drinks available to trade.
  4.  **The "Forever" Claim.** This is theoretically true, but in reality, he'd notice after one or two cycles. You can acknowledge this by having her say, *"He could do it until you ran out of cash... or until you realized you're an idiot."*

  **Verdict:** Keep the scene! It's a great characterization moment. With the tiny tweak to "Money Pump" and ensuring the "swap fee" is mentioned, it's mathematically solid.
