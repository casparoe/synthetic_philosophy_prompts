answer: |-
  This is a fascinating snag, and I have some news that might save you a lot of reading time: **Your MFA workshop leader was likely conflating a few different things.**

  The hard truth is that in *What Is Art?* (1897), Tolstoy does **not** hold *War and Peace* up as the model of his "infectiousness" theory. In fact, by the time he wrote that essay, he had undergone a profound spiritual crisis (around 1879–1880) and had largely repudiated his earlier masterpieces, including *War and Peace* and *Anna Karenina*.

  In *What Is Art?*, Tolstoy argues that most of his own famous fiction belongs to the category of "exclusive art" for the upper classes, rather than "universal Christian art" that could unite all humanity. He is actually quite critical of his earlier work in that text, viewing it as lacking the necessary religious consciousness he deemed essential for "good" art in his later years.

  ### So, where did the confusion come from?

  Your workshop leader wasn't pulling this out of thin air; they were likely synthesizing three different Tolstoyan concepts that often get blurred in creative writing circles:

  1.  **The Epilogue of *War and Peace*:** This is the closest thing to a "user manual" for that specific novel. In the second part of the Epilogue, Tolstoy explicitly discusses his philosophy of history, causality, and why traditional historical narratives fail. He explains *why* he wrote the book the way he did (focusing on the "swarm" of individual wills rather than Great Men).
  2.  **Victor Shklovsky's "Art as Technique" (1917):** The Russian Formalist critic Shklovsky used Tolstoy as the primary example of *ostranenie* (defamiliarization). He analyzed how Tolstoy makes the familiar strange (e.g., describing an opera through the eyes of a peasant who doesn't understand it) to create a fresh perception. This is often taught alongside *What Is Art?* and gets mixed up with it.
  3.  **The Theory of Infectiousness Itself:** While Tolstoy didn't use *War and Peace* as the *example* in the essay, the theory *does* explain why the book endures. The workshop leader likely reverse-engineered the logic: "Tolstoy says art is infectiousness; *War and Peace* is infectious; therefore Tolstoy must have meant this book."

  ### How to actually apply "Infectiousness" to your novel

  Even though the specific passage you're hunting doesn't exist, the advice is still gold. If you want to reverse-engineer *War and Peace* using Tolstoy's actual criteria for infectiousness (found in Chapters 5 and 15 of *What Is Art?*), here are the three specific conditions he lists, and how they apply to your epic:

  **1. Sincerity (The most important)**
  Tolstoy argues that the degree of infectiousness depends first on the individuality of the feeling, but most importantly on the **sincerity** of the artist. The artist must feel the emotion they are transmitting.
  *   **For your novel:** In a multi-generational war saga, it is easy to get lost in choreography, uniforms, and lineage. Tolstoy's "infectiousness" comes from the fact that he *felt* the confusion of battle (he was at Sevastopol) and the anxiety of social change. Ask yourself: In your battle scenes, are you writing what you think an epic battle *should* feel like, or are you transmitting a genuine emotional truth about fear, chaos, or boredom that you have accessed internally?

  **2. Clarity of Expression**
  The feeling must be transmitted so clearly that the receiver feels united with the artist.
  *   **For your novel:** Tolstoy avoids abstract adjectives in favor of concrete physical actions. He doesn't tell us Prince Andrei is "existentially disillusioned"; he shows us Andrei looking up at the infinite sky at Austerlitz. If you want that Tolstoyan scale, ensure your "big ideas" are always anchored in specific, clear sensory details.

  **3. Individuality of Feeling**
  The feeling must be unique to the artist, not a imitation of previous art.
  *   **For your novel:** Since your agent is already comparing you to Tolstoy, beware of imitating Tolstoy. "Infectiousness" fails if the reader feels you are mimicking a style rather than transmitting your own vision of the war.

  ### Where to find the actual "Manual"

  If you want Tolstoy's own words on the craft of *War and Peace*, skip *What Is Art?* for now and go here instead:

  1.  **The Epilogue of *War and Peace* (Part 2):** This is where he debates the philosophy of history. He argues that history is made by the sum of infinite infinitesimal human acts, not by the orders of generals. If you are writing battles, this is crucial: Tolstoy's battles feel real because he focuses on the disconnection between orders given and orders executed.
  2.  **Tolstoy's Letters (1860s):** Look for correspondence with his friend A.A. Fet during the writing of *War and Peace*. He often complains about the difficulty of managing the "multitude of characters" and his struggle to balance the historical with the domestic.
  3.  **"On the Significance of the War of 1812" (1904):** A later essay where he revisits the subject.

  ### A Suggestion for Your Draft

  Since you are two-thirds of the way through: **Don't worry about the "Christian Universalism" Tolstoy demands in *What Is Art?*.** That was late-period Tolstoy trying to write parables for peasants. That is not the Tolstoy who wrote *War and Peace*.

  The Tolstoy you want to emulate is the one who believed that **truth is found in the flow of life itself.**

  If you want to capture that "infectious" quality in a war epic:
  *   **Disrupt the Narrative:** Tolstoy often interrupts a high-stakes scene with a trivial detail (a soldier noticing a smell, a stray dog, a moment of confusion). This prevents the war from becoming a "spectacle" and keeps it human.
  *   **The "Swarm" Theory:** In your battle scenes, avoid omniscient clarity. Tolstoy's generals never know what is happening. If your characters have perfect knowledge of the battlefield, you lose the infectious anxiety that defines *War and Peace*.
  *   **Domestic Anchors:** The reason *War and Peace* is infectious isn't the battles; it's that the battles matter because of the domestic lives interrupted. Ensure your families feel like real units with specific,琐碎 (trivial) dynamics before you send them to war.

  **Summary:** Your MFA leader gave you the right *theory* but the wrong *source text*. Tolstoy didn't praise *War and Peace* in *What Is Art?*; he critiqued it. But the theory of infectiousness still applies. Focus on sincerity over scale, and read the *Epilogue* of *War and Peace* for the philosophy of history.

  Good luck with the final third. That is often where the "swarm" of characters either comes together or collapses. Trust the domestic truths over the historical spectacle.
