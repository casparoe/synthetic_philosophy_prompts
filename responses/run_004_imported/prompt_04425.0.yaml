answer: |-
  The dispute over the Kelly criterion is not merely a technical quarrel about betting sizes; it is a proxy war over the foundations of rationality itself. On one side stands the orthodox expected-utility tradition, championed by Paul Samuelson, which views the maximization of expected logarithmic wealth as merely one specific risk preference among many. On the other stands the emergent school of ergodicity economics, led by Ole Peters, which argues that log-maximization is a physical necessity for any agent navigating time in a multiplicative world. More recently, Scott Garrabrant has attempted to universalize this insight into a "geometric rationality" applicable to belief and bargaining. To adjudicate this dispute, we must determine whether the ergodicity argument successfully promotes Kelly from a preference to a law, and whether that law holds beyond the casino.

  Paul Samuelson's scorn for the Kelly criterion is legendary, culminating in his 1971 paper written entirely in one-syllable words. His core objection was that the "long-run" defense of Kelly relies on a fallacy: the assumption that what happens in the limit as time goes to infinity must dictate behavior in the finite present. Samuelson argued that if an agent has a finite horizon or a utility function that values terminal wealth linearly (risk-neutral), maximizing the expected geometric growth rate is suboptimal. For Samuelson, utility is subjective. If you prefer a small chance of astronomical wealth over a certainty of moderate growth, expected-value (EV) reasoning permits it. To claim Kelly is "optimal" simpliciter is to smuggle a specific utility function (log wealth) into the definition of rationality. In this view, Kelly is a style, not a law.

  Ole Peters and the ergodicity economists counter that Samuelson's critique ignores the physics of the process. Standard expected-value reasoning assumes ergodicity: that the average outcome across a hypothetical ensemble of parallel universes (the ensemble average) is the same as the average outcome experienced by one person over time (the time average). In additive processes, this holds. In multiplicative processes—where wealth compounds—it does not. The ensemble average is dominated by rare, extreme outcomes that almost no individual trajectory ever reaches. The time average, however, converges to the geometric mean. Peters argues that because an agent lives in time, not in an ensemble, optimizing for the arithmetic expectation is optimizing for a future you will almost surely not experience. Therefore, maximizing the geometric growth rate is not a preference; it is a correction of a mathematical error in how we model time.

  Is the ergodicity argument sufficient to make geometric-growth maximization non-optional? The verdict depends on the definition of the agent's objective. If the objective is strictly to maximize terminal wealth at a specific time $T$, regardless of the path taken, Samuelson is correct: one can choose a utility function that tolerates a high probability of ruin for a non-zero chance of infinite gain. However, this assumes the agent can survive the ruin. In the real world, wealth is not just a score; it is the fuel for agency. Zero wealth is an absorbing state—it is game over.

  Here, the ergodicity argument succeeds in shifting the burden of proof. It demonstrates that arithmetic EV maximization in a multiplicative environment is structurally unstable. An agent who repeatedly bets according to arithmetic EV will, with probability one, eventually go bankrupt. Thus, for any agent whose utility function requires *continued existence* to be satisfied (which is true for almost all biological or institutional agents), geometric maximization is non-optional. It is a constraint on sustainable agency. Samuelson treats utility as abstract; Peters treats the agent as embedded in a dynamic system. For an embedded agent, the geometric mean is not a taste; it is the speed limit of survival. To violate it is not to be "risk-seeking"; it is to mathematically guarantee self-termination. Therefore, within the domain of repeated multiplicative bets, the ergodicity argument wins: Kelly is not merely a defensible utility function, but the unique strategy compatible with indefinite persistence.

  The harder question is whether this verdict carries over to Scott Garrabrant's broader "geometric rationality." Garrabrant extends the mathematical formalism of geometric expectation to domains like Nash bargaining (where the solution maximizes the geometric mean of gains) and Bayesian updating (where geometric pooling of probabilities is often preferred to arithmetic pooling). He explicitly acknowledges that this requires abandoning the independence axiom of von Neumann-Morgenstern expected utility theory. The question is whether the *compulsion* found in the wealth case applies here.

  In the domain of wealth, the geometric constraint is physical: if you lose your capital, you cannot bet. In the domains of bargaining and belief, the "ruin" condition is metaphorical. In Nash bargaining, the geometric product (the Nash solution) is defended on axioms of fairness and efficiency, not survival. Two agents can agree to an arithmetic split of resources; they will not physically vanish if they do so, though they may leave value on the table. Similarly, in Bayesian updating, arithmetic averaging of probabilities can lead to incoherence (such as failing to preserve zero probabilities), but it does not lead to the agent's physical destruction.

  Garrabrant's geometric rationality is a powerful normative framework for coherence and cooperation, but it lacks the ontological weight of Peters' ergodicity argument. In wealth dynamics, the geometric mean is the *only* mean that describes the actual time-evolution of the system. In bargaining or belief, the geometric mean is a *choice* of how to aggregate values or opinions to satisfy certain logical desiderata (like scale invariance or Pareto optimality). One can construct coherent systems of belief or negotiation using arithmetic methods, provided one accepts different axioms. The "non-optional" force of ergodicity economics comes from the mismatch between the math and the physics of time. In epistemology and ethics, there is no equivalent physical clock forcing a specific averaging method. The violation of the independence axiom in these domains is a feature of a different normative vision, not a correction of a physical illusion.

  Therefore, the dispute must be adjudicated with a split verdict. The ergodicity argument successfully rescues the Kelly criterion from Samuelson's charge of being "just a preference." For an agent facing repeated multiplicative bets who wishes to remain an agent, maximizing geometric growth is non-optional. It is a requirement of the dynamics, not a matter of taste. Arithmetic expected value is revealed as a misleading heuristic that applies only to ensembles, not to individuals in time.

  However, this physical necessity does not generalize. Garrabrant's geometric rationality is a compelling extension of the mathematics, but in domains like bargaining and belief, it reverts to being a normative choice rather than a dynamic law. The geometric mean in wealth is a description of what *will* happen; the geometric mean in bargaining is a prescription for what *should* happen. We should accept Peters' physics for our portfolios, but we must recognize that when we move to our principles, we are back in the realm of philosophy, where Samuelson's insistence on the arbitrariness of utility still holds sway. The Kelly criterion is a law of survival; geometric rationality is a law of coherence. Only the former is written in the fabric of time.
