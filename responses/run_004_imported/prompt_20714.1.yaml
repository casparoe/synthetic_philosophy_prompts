  2.  **Deconstruct the Science/Philosophy:**
      *   *Split-Brain:* Corpus callosum severed. Left hemisphere (LH) controls speech and right hand. Right hemisphere (RH) controls left hand and processes spatial/emotional info but is largely non-verbal.
      *   *The Interpreter:* LH sees an action (e.g., left hand moving) but doesn't know *why* (because the command came from RH). To maintain a coherent narrative of self, LH makes up a reason.
