answer: |-
  This is a classic and excellent question. In fact, identifying this precise confusion is often the main learning objective of a unit on philosophical anarchism. Your study group is right to suspect that the inference fails, but articulating *why* requires distinguishing between two different kinds of reasons for action.

  The short answer is: **The failure of political obligation does not entail the absence of *all* moral reasons to obey the law.** Simmons and Wolff argue that you have no duty to obey the law *simply because it is the law* (issued by the state). They do not argue that you have no moral reasons to do the things the law happens to require.

  Here is a breakdown of where the reasoning goes wrong and how you can structure your response paper around Simmons's and Wolff's actual positions.

  ### 1. The Distinction: Content-Independent vs. Content-Dependent Reasons

  The core logical error in your group's inference is conflating **political obligation** with **moral permissibility**.

  *   **Political Obligation (Content-Independent):** This is a duty to obey a command *because* it comes from a legitimate authority, regardless of what the command actually says. If the state says "drive on the right," you obey not because driving on the right is inherently moral, but because the state said so. Simmons and Wolff argue this specific type of obligation does not exist generally.
  *   **Ordinary Moral Reasons (Content-Dependent):** These are reasons to act (or refrain from acting) based on the nature of the act itself. You shouldn't murder people not because it's illegal, but because it harms others. You shouldn't steal because it violates property rights or fairness.

  **Where the inference fails:**
  Your group's argument assumes that if the *state's authority* is removed, the *moral landscape* becomes empty. But for Simmons and Wolff, the moral landscape remains full; only the state's special claim to authority is removed.

  If there is no political obligation, you are free to disregard the law *qua* law. But if the law prohibits murder, you are still bound by the moral duty not to kill. If the law requires paying taxes that fund essential hospitals, you might still be bound by a duty of mutual aid or fair play to your neighbors, even if you don't owe that money to the "state" as an authority.

  ### 2. Simmons on "Philosophical Anarchism"

  A. John Simmons explicitly distinguishes his view, **philosophical anarchism**, from **revolutionary anarchism**.

  *   **Revolutionary Anarchism:** The state is illegitimate and therefore must be overthrown; citizens should actively resist or ignore laws.
  *   **Philosophical Anarchism (Simmons):** The state is illegitimate (lacks authority), but it may still be useful, necessary, or the best option available. Citizens are not morally bound to obey *because it is the law*, but they often have overwhelming moral or prudential reasons to obey anyway.

  In his book *Moral Principles and Political Obligations*, Simmons argues that while we lack a *general* duty to obey, we still have **particular** duties.
  *   **Example:** You have no duty to obey the speed limit *because the government set it*. However, you have a moral duty not to endanger pedestrians. If the speed limit is a good proxy for safety, you should obey it—but your reason is "safety," not "authority."
  *   **Example:** You have no duty to pay taxes *because the IRS demands it*. But if you benefit from public roads and schools that your neighbors fund, you might have a duty of **fair play** to those specific neighbors to contribute your share, even if the state itself has no right to collect it.

  **For your paper:** You can argue that Simmons's conclusion changes the *justification* for obedience, not necessarily the *act* of obedience. We move from "I must do X because the State commands it" to "I should do X because it is the right thing to do, and the State happens to command it."

  ### 3. Wolff on Autonomy

  Robert Paul Wolff's argument in *In Defense of Anarchism* rests on the incompatibility of **authority** and **autonomy**.

  *   **Autonomy:** The responsibility to act on the basis of your own moral reasoning.
  *   **Authority:** The right to command obedience regardless of the subject's reasoning.

  Wolff argues that to acknowledge the state's authority is to surrender your autonomy. However, this does not mean you must disobey the state. It means you must only obey the state **when your own moral judgment aligns with the law.**

  *   **The Inference Error:** Your group thinks Wolff's view implies "I can do whatever I want." Wolff's view actually implies "I must decide for myself what to do, and I take full responsibility for that decision."
  *   **The Result:** Often, an autonomous agent will decide that obeying the law is the morally right course of action. But if the law is unjust, the autonomous agent is not only *free* to disobey but *required* to disobey by the very duty of autonomy.

  ### 4. Prudential Reasons (The "Teeth" of the Law)

  Finally, there is a pragmatic layer to add to your response. Even if one is *morally* free to break a law (because there is no political obligation), one is rarely *prudentially* free to do so without consequence.

  Simmons acknowledges that states possess coercive power. A citizen might conclude: "I have no moral duty to pay this tax, but if I don't, I will be fined or imprisoned, which would prevent me from caring for my family." Thus, self-interest provides a powerful reason to obey the law, even in the absence of political obligation.

  ### Summary for Your Response Paper

  To resolve your study group's stuck point, you can structure your argument around these three claims:

  1.  **The Scope of the Denial:** Simmons and Wolff deny a *specific* kind of reason for action (content-independent duty to authority), not *all* reasons for action.
  2.  **The Persistence of Ordinary Morality:** Citizens remain bound by standard moral duties (non-maleficence, fairness, promise-keeping) which frequently overlap with legal requirements. Philosophical anarchism does not grant a license to violate these.
  3.  **The Shift in Justification:** The practical upshot of philosophical anarchism is not lawlessness, but a shift in how citizens relate to the law. We obey not out of deference to authority, but out of independent moral judgment or prudential calculation.

  **Conclusion:** The inference fails because it assumes that "obligation to the state" is the only thing holding society together. Simmons and Wolff argue that ordinary morality and prudence do most of the work; the "myth" of political obligation is theoretically important, but its absence doesn't lead to the chaos your group fears.

  This distinction allows you to agree with Simmons and Wolff's theoretical conclusions without accepting the radical practical implication that citizens are free to break laws merely because they are "unwise or inconvenient." You are free to break them only if doing so violates no other moral duty and is worth the prudential cost.
