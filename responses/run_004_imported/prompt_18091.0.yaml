answer: |-
  It is a pleasure to engage with someone who brings thirty years of laboratory experience to the semantics of natural kind terms. Your intuition is sharp, and you have put your finger on exactly the pressure point where two-dimensional semantics (2Dism) is most controversial.

  To answer your question directly: **You have understood the mechanics of the two-dimensional framework correctly, but your conclusion that it overturns Kripke is a matter of intense philosophical debate.** In fact, your position aligns closely with that of Scott Soames, one of Kripke's most prominent defenders and a fierce critic of 2Dism.

  However, proponents like David Chalmers and Frank Jackson argue that 2Dism preserves Kripke's core insights while solving problems Kripke left open. To see why they claim it is a "refinement" rather than a "repudiation," we need to distinguish between two different kinds of modality that 2Dism separates, which Kripke kept distinct but did not formalize into a dual-intension apparatus.

  ### 1. The Two Dimensions: Epistemic vs. Metaphysical

  Your puzzle stems from conflating the **Primary Intension** with the **Secondary Intension**.

  *   **Primary Intension (1-intension):** This maps a world *considered as actual* to an extension. It asks: "Given the way the world turns out to be, what does 'water' refer to?" As you noted, if we discover the oceans are XYZ, the extension of 'water' is XYZ. This intension is **contingent** (or rather, the truth of the identity is epistemically contingent).
  *   **Secondary Intension (2-intension):** This maps a world *considered as counterfactual* to an extension, holding the actual world fixed. It asks: "Given that 'water' refers to H2O in the actual world, what is it in other possible worlds?" In this dimension, 'water' refers to H2O in all worlds. This intension is **necessary**.

  **Kripke's Claim:** When Kripke says "Water is H2O" is necessary, he is talking exclusively about the **Secondary Intension** (metaphysical modality). He grants that it was an empirical discovery (a posteriori), but once the reference is fixed, the identity holds across all counterfactual worlds.

  **The 2Dist Defense:** Chalmers and Jackson argue that 2Dism *preserves* Kripke's necessity claim by locating it in the Secondary Intension. They agree with Kripke that once we fix the actual world as ours (where water = H2O), there is no possible world where water is not H2O.

  So, strictly speaking, 2Dism does not say the sentence is "contingent after all." It says the sentence expresses a **necessary proposition** (secondary) that is associated with a **contingent mode of presentation** (primary).

  ### 2. Does this Vindicate the Description Theory?

  This is where your skepticism is most potent. You suggest that by admitting a Primary Intension (a rule like "the watery stuff"), 2Dism vindicates the descriptivism Kripke attacked.

  Here, we must distinguish between two versions of descriptivism:

  1.  **Descriptivism as Synonymy (Frege/Russell):** The meaning of "water" *is* the description "the clear, drinkable liquid in the lakes." If this were true, "Water is H2O" would be analytic and a priori. Kripke refuted this.
  2.  **Descriptivism as Reference-Fixing (Kripke):** Kripke actually allowed that descriptions can *fix the reference* of a name without giving its meaning (e.g., "Let 'Neptune' name the planet causing these perturbations").

  **Where 2Dism stands:** 2Dism adopts **Reference-Fixing Descriptivism** for the Primary Intension but retains **Kripkean Rigidity** for the Secondary Intension.

  *   **Kripke:** Rejected (1), Accepted (2).
  *   **2Dism:** Rejected (1), Accepted (2), but formalizes (2) into a semantic dimension to explain cognitive significance.

  So, 2Dism does not vindicate the *old* description theory (synonymy). It vindicates the idea that descriptive conditions play a role in how we identify kinds epistemically, without conceding that those conditions constitute the metaphysical essence of the kind.

  ### 3. The "Repudiation" Charge (Soames vs. Chalmers)

  You asked if 2Dism is best read as a repudiation. This is exactly the argument Scott Soames makes in *Beyond Rigidity* and *Reference and Description*.

  **Soames's Argument (aligning with yours):**
  Soames argues that if the Primary Intension determines the truth conditions of an utterance in an epistemic sense, then the proposition we grasp when we understand "Water is H2O" is contingent. If the proposition we grasp is contingent, then Kripke's claim that we discovered a *necessary* truth is undermined. We merely discovered a contingent truth that *becomes* necessary once we stipulate the reference. Soames claims 2Dism collapses back into a form of descriptivism that Kripke successfully killed.

  **Chalmers/Jackson's Counter-Argument:**
  They argue that there are two distinct propositions involved.
  1.  The **epistemic proposition** (Primary): Contingent. Explains why the discovery was informative (a posteriori).
  2.  The **metaphysical proposition** (Secondary): Necessary. Explains why the identity holds in all counterfactual worlds.

  They claim this is a refinement because Kripke never fully explained *why* "Water is H2O" feels contingent to us before we did the chemistry. He just asserted it was an illusion. 2Dism explains the illusion (the Primary Intension) without surrendering the metaphysical reality (the Secondary Intension).

  ### 4. A Chemist's Perspective

  Given your background, consider this analogy:

  *   **Kripke:** "The substance in the beakers is H2O. In any universe where that substance exists, it is H2O. Even if it looks like wine." (Metaphysical Necessity).
  *   **2Dism:** "Before we ran the mass spec, we identified the substance by its macroscopic properties (boiling point, transparency). In a scenario where the macroscopic properties pointed to XYZ, we would have been talking about XYZ. That is the Primary Intension. But since we *actually* found H2O, the Secondary Intension locks onto H2O across all counterfactuals."

  The 2Dist says: "Kripke is right about the chemistry (Secondary), but we need the macroscopic description (Primary) to explain how we found the chemistry in the first place."

  ### Conclusion

  Have you understood the framework correctly? **Yes.** You correctly see that the Primary Intension introduces a form of contingency and descriptive reference-fixing.

  Does this mean 2Dism is a repudiation? **It depends on what you think Kripke's main project was.**
  *   If Kripke's project was to eliminate *all* descriptive elements from semantics, then yes, 2Dism is a repudiation.
  *   If Kripke's project was to secure the **metaphysical necessity** of identity statements while acknowledging their **epistemic contingency**, then 2Dism is a friendly refinement. It provides the formal machinery to show how a statement can be both (necessary in one dimension, contingent in the other).

  Most contemporary philosophers view 2Dism as an attempt to reconcile Frege (cognitive significance) with Kripke (metaphysical modality). Whether it succeeds or collapses into descriptivism is still an open war in the literature. Given your analytical eye, your sympathy with Soames's critique is well-placed; many find that the "Primary Intension" does too much work, effectively smuggling descriptivism back in through the side door. But the 2Dists would insist that door was never locked, only that Kripke didn't build a room for it.
