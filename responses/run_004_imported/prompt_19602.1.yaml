answer: |-
  Elara slid her glass across the table, the ice finally still. "You read the essay? The bit about the party mechanism?"

  Mark nodded, swirling his whiskey. "I did. It's a perfect description of why we need parties to manage that mechanism."

  "Weil says the mechanism *is* the corruption. Collective pressure replaces thought."

  "Pressure is just coordination. Without it, you have chaos masked as independence."

  "It's not independence. It's that membership forces you to pre-commit to opinions on issues you can't yet foresee."

  "It forces you to trust a shared principle. Otherwise, how does a voter know what they're buying?"

  "They're buying a team, not a principle. When the unforeseen crisis hits, the team chooses survival over truth."

  "If the team dissolves, the interests don't. They just become invisible cliques."

  "Cliques don't demand you sign away your conscience as the price of entry."

  "Nor do they offer accountability. Parties make power visible enough to punish."

  "They make power tribal. You defend the line because it's yours, not because it's right."

  "Without the line, there's no standard to measure right against. Just personality."

  "So we sacrifice intellectual honesty for administrative convenience."

  "We sacrifice purity for responsibility. Someone has to govern."

  "Governing based on a structure designed to ignore truth isn't governance. It's management of deceit."

  "It's the only way to aggregate interests without violence."

  "It aggregates interests by lying about where they align."

  "And your solution? A parliament of saints?"

  "A parliament of individuals who aren't forbidden to think."

  "They'll form parties anyway. Just without the rules to keep them honest."

  "Then we fight the parties, not join them."

  "You can't fight a machine from the outside. You need the leverage."

  "Leverage gained by surrendering your mind isn't leverage. It's captivity."

  "Then walk away. I'll stay and try to steer the beast."
