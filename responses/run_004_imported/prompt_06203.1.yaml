prompt: |-
  I'm taking a seminar on formal epistemology this term, and I'm also the student representative on my university's Academic Integrity Board, which is drafting a policy for cases where the only evidence is a score from a well-calibrated AI-writing detector: of every hundred essays it flags at "98% confidence," about ninety-eight really are AI-written. Several faculty argue that this alone justifies finding each flagged student responsible for a violation; others want the score barred from ever being sufficient by itself, since treating it as sufficient means we already know, before hearing a single case, that some students found responsible under the rule are actually innocent. Even our Chair concedes this is almost certainly true of the Board's record over the years, though she stands behind every verdict she's personally signed. Draft the short memo I'll circulate before our next meeting: recommend an evidentiary standard the Board can actually apply, and engage seriously with the "calibration is enough" position rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the University's Academic Integrity Board (AIB).
      *   **Audience:** Other AIB members (faculty, administrators, possibly other students).
      *   **Context:** Drafting a policy for cases where the *only* evidence is an AI-writing detector score (specifically, 98% confidence, 98% true positive rate).
      *   **Conflict:**
          *   Position A (Faculty): The score alone justifies a finding of responsibility (Calibration is enough).
          *   Position B (Others): The score should never be sufficient by itself because it guarantees some false positives (innocent students found responsible).
          *   Chair's Stance: Admits some past verdicts might have been wrong (statistically) but stands by them procedurally.
      *   **Task:** Draft a short memo for the next meeting.
      *   **Requirements:**
          *   Recommend an evidentiary standard the Board can actually apply.
          *   Engage seriously with the "calibration is enough" position (don't dismiss it).
          *   Tone: Professional, thoughtful, epistemologically aware (given the user's seminar), persuasive but diplomatic.

  2.  **Deconstruct the Epistemological/ethical Problem:**
      *   *The Reference Class Problem:* The 98% statistic applies to the *population* of flagged essays, not the *individual* student.
      *   *Preponderance of Evidence vs. Beyond Reasonable Doubt:* Academic integrity hearings usually use "preponderance of evidence" (more likely than not, >50%). A 98% score meets this threshold mathematically.
      *   *The "Proof Paradox":* If we rely *only* on base rates (naked statistical evidence), we convict without individualized proof. This feels unjust even if statistically sound. (Think: The Blue Bus Problem).
      *   *The Chair's Concession:* She admits the system produces false positives but stands by the *process*. This suggests a tension between systemic accuracy and individual justice.
      *   *Goal:* Find a middle ground that respects the statistical weight of the detector without making it the sole arbiter of truth.

  3.  **Determine the Recommendation:**
      *   *Option 1: Ban the evidence.* (Too extreme, ignores the "calibration is enough" argument).
      *   *Option 2: Allow it as sole evidence.* (Violates intuition about individualized justice, guarantees false positives).
      *   *Option 3: Probative but not sufficient.* (The detector creates a *prima facie* case, shifting the burden of production to the student, but requires corroboration for a final finding).
      *   *Selected Approach:* Treat the score as *probative evidence* that establishes a presumption, but require *individualized corroborating evidence* (e.g., oral defense, draft history, stylistic deviation) to sustain a finding. This respects the statistical weight while satisfying the demand for individualized justice.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the task. Validate both sides.
      *   **Engaging "Calibration is Enough":**
          *   Acknowledge the math: 98% is high. In many contexts (medical, engineering), this is actionable.
          *   Acknowledge the "Preponderance" standard: 98% > 50%.
          *   Why it's tempting: Efficiency, deterrence.
      *   **The Counter-Argument (Individualized Justice):**
          *   The "Blue Bus Problem" reference (implicit or explicit).
          *   The difference between *risk* and *responsibility*.
          *   The moral cost of a false positive is higher than the administrative cost of a false negative.
          *   The Chair's point: We can't know *which* 2% are innocent, but we know *some* are.
      *   **The Recommendation:**
          *   Standard: "Naked statistical evidence is insufficient for a finding of responsibility."
          *   Mechanism: The score triggers an inquiry (shifts burden), not a verdict.
          *   Requirement: Need "individualized indicators" (drafts, oral defense, metadata).
      *   **Closing:** Call for discussion.

  5.  **Refining the Tone (Formal Epistemology Angle):**
      *   Since the user is taking a seminar on formal epistemology, the memo should subtly reflect that rigor without being overly jargon-heavy (it's still a policy memo).
      *   Use terms like "naked statistical evidence," "individualized corroboration," "epistemic gap."
      *   Ensure the argument addresses the *normative* implication of the *statistical* fact.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is it too academic?
      *   *Fix:* Keep it practical. Focus on policy implementation.
      *   *Critique:* Did I engage the "calibration" argument seriously?
      *   *Fix:* Make sure to explicitly state *why* they are right about the math before explaining why it's wrong for *justice*.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Specify what counts as corroboration (drafts, interview).

  7.  **Final Polish:** Check the length (short memo). Ensure the Chair's comment is addressed respectfully. (The Chair's comment highlights the tension between systemic reliability and individual truth).

      *(Self-Correction on the Chair's point)*: The Chair says she stands behind every verdict even though she knows some are wrong. This is a "policy of optimism" or "procedural finality." I need to address how my proposal changes this. My proposal aims to reduce the *known* error rate, making the Chair's stance more defensible.

  8.  **Final Output Generation:** (Proceeding to draft based on these thoughts).

      *   *Subject:* Evidentiary Standards for AI-Detection Metrics.
      *   *Structure:* Context -> The Statistical Argument -> The Normative Limit -> Proposal.

      *(Wait, one nuance)*: The prompt says "of every hundred essays it flags at '98% confidence,' about ninety-eight really are AI-written." This is the Positive Predictive Value (PPV), not just the true positive rate (sensitivity). This is a crucial distinction. It means the base rate has already been accounted for in that statistic. I should be careful not to confuse sensitivity with PPV in the memo. The prompt defines the reliability of the *flag*, not the model's general accuracy. I will treat the 98% as the probability of guilt given the flag.

      *Revised Plan:*
      1. Acknowledge the 98% PPV.
      2. Argue that high probability $\neq$ proof of *this* act.
      3. Propose "Corroborated Probability" standard.

      Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board Members
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Evidentiary Standards Regarding AI-Detection Metrics

  As we draft the new policy on AI-writing detection, we face a tension between statistical reliability and individualized justice. This memo outlines a recommended evidentiary standard that respects the calibration of detection tools while safeguarding the rights of the accused.

  **The Case for Statistical Sufficiency**
  We must engage seriously with the argument that a 98% positive predictive value is sufficient for a finding of responsibility. Proponents argue that if we accept a "preponderance of evidence" standard (>50% likelihood), a 98% probability mathematically satisfies the threshold. In many risk-assessment contexts (medical triage, fraud monitoring), acting on such high-probability signals is standard procedure. To discard this data entirely is to ignore a highly reliable indicator of reality. If we reject the score, we are arguably prioritizing the *appearance* of fairness over the *accuracy* of our outcomes.

  **The Epistemic Gap**
  However, academic integrity adjudication is not merely risk management; it is a moral judgment of individual agency. Relying solely on group statistics to determine individual guilt creates what epistemologists call the "proof paradox" (analogous to the famous "Blue Bus Problem"). Even if 98 of 100 flagged students are guilty, naked statistical evidence does not tell us *which* 2 are innocent.

  Our Chair has noted that while our past record likely contains false positives, she stands by the verdicts. This highlights a procedural comfort with systemic error. However, as we formalize policy, we must ask if it is permissible to knowingly sanction innocent students based solely on their membership in a high-risk statistical class. The moral cost of a false positive in an integrity hearing—damage to reputation, academic record, and trust—outweighs the administrative efficiency of accepting the score as conclusive.

  **Recommendation: The "Corroborated Probability" Standard**
  I recommend the Board adopt the following standard:

  > *An AI-detection score, regardless of confidence level, shall not constitute sufficient evidence for a finding of responsibility on its own. It may, however, establish a prima facie case that shifts the burden of production to the respondent.*

  **Implementation:**
  1.  **Trigger:** A high-confidence flag (e.g., >95%) initiates a formal inquiry.
  2.  **Corroboration:** To sustain a finding, the Board requires at least one piece of individualized, non-statistical evidence. This could include:
      *   Inability to explain or defend the text in an oral interview.
      *   Absence of draft history or metadata inconsistencies.
      *   Stylistic deviations from the student's verified prior work.
  3.  **Exoneration:** If the student provides a plausible account of their process that aligns with available metadata, the statistical flag must be discounted.

  **Conclusion**
  This approach acknowledges the detector's calibration without conflating probability with proof. It allows the Board to act on high-probability signals while ensuring that a finding of guilt rests on evidence specific to the student, not just the population. This makes our verdicts not only statistically sound but individually justifiable.

  I look forward to discussing this framework at our next meeting.
