      *   David wins on practical heuristics (expertise, priors, cognitive economy).
      *   *Nuance:* The user is a chemist. In analytical chemistry, you *never* ignore contradictory data from a calibrated instrument (the tape) based solely on a visual glimpse, no matter how experienced. You investigate the discrepancy. This suggests Helen aligns better with the user's professional training, while David aligns with a certain kind of "practical certainty."

  4.  **Identify What Both Are Missing (The Synthesis):**
