      *   **FairBot:** Cooperates if it proves the opponent cooperates with it.
      *   **Löb's Theorem:** $\square(\square P \to P) \to \square P$. This allows the mutual proof loop to close without infinite regress.
      *   **The Skeptic's Counter:** Computational intractability (proof search is hard), obfuscation, side-channels, different logical systems, "Clash of the Titans" (masquerade).
      *   **The Proponent's Counter:** It's about the *disposition*, not just the act. It creates a new causal structure.

  4.  **Drafting - Section by Section:**

