answer: |-
  This is a fantastic debate, and honestly, it's the kind of disagreement that defines a good philosophy seminar. You and Theo are actually reenacting a shift in Davidson's own thinking that happened over the course of his career.

  However, I have to break the news gently: **Theo is actually closer to Davidson's mature view, and that essay title he was muttering is the smoking gun.**

  Here is the backup you need to understand where Theo is coming from, why your intuition is understandable but technically off-base according to Davidson, and how to handle this in seminar tonight.

  ### 1. The "Derangement" Clue
  The essay Theo is referencing is **"A Nice Derangement of Epitaphs" (1986)**.

  It is one of Davidson's most famous later papers. The title comes from a malapropism in Sheridan's *The Rivals*, where a character says "a nice derangement of epitaphs" when she means "a nice arrangement of epitaphs."

  Davidson uses this to argue that successful communication happened *despite* the fact that the standard conventions of the English language were violated. Mrs. Malaprop was understood not because she followed the rules of "English," but because the listener interpreted her intention in context.

  **The Punchline:** In this essay, Davidson famously concludes that **"there is no such thing as a language"** (at least not in the sense of a fixed, shared set of conventions that guarantees understanding).

  ### 2. Radical Interpretation isn't just for Strangers
  You are viewing Radical Interpretation as a **historical event**: *First* we are strangers and do the hard work, *then* we learn the language and switch to "auto-pilot decoding."

  Davidson views it as a **structural necessity**: The logic required to interpret the stranger is the *same* logic required to interpret your roommate.

  Here is the technical backup you can bring to Theo:

  **The Prior Theory vs. The Passing Theory**
  In *Derangement*, Davidson introduces two concepts that dismantle your "shared language" argument:
  *   **The Prior Theory:** What I expect you to mean before you speak (based on our history, shared language, past experiences).
  *   **The Passing Theory:** What I interpret you to mean *in this specific moment*, based on the specific context, tone, and current beliefs.

  Davidson argues that communication succeeds only when our **Passing Theories converge**. Even after three years of living together, if you ask Theo to "pass the salt" and he thinks you're being sarcastic because there's no salt on the table, the "shared language" didn't save you. He had to interpret your belief and intention in that moment.

  For Davidson, **all interpretation is radical** because you never have direct access to another person's mind. You are always inferring their beliefs and meanings simultaneously, whether it's day one or day one thousand. The "shared language" is just a heuristic that makes the *Prior Theory* more accurate, but it doesn't do the work of communication itself.

  ### 3. Why You Feel Right (and where to push back)
  You aren't crazy for thinking Theo is overstating it. Phenomenologically (in terms of how it *feels*), talking to your roommate is nothing like deciphering an alien language. It feels automatic.

  **Your Argument for Seminar:**
  You can concede that the *logical structure* is the same (as Theo says) but argue that the **epistemic risk** is different.
  *   With a stranger, the margin for error in the Prior Theory is huge.
  *   With a roommate, the Prior Theory is highly calibrated.
  *   Therefore, while the *mechanism* (Radical Interpretation) is the same, the *labor* is not. Davidson might say the process is identical, but you can argue that the stability of the "Prior Theory" between friends creates a qualitative difference in the interaction, even if the underlying philosophy is the same.

  ### 4. Summary for Tonight
  If you want to hold your own tonight, here is your cheat sheet:

  1.  **Acknowledge the Essay:** Admit you looked up the "derangement" comment. It's *A Nice Derangement of Epitaphs*. It shows you did the reading.
  2.  **Concede the Core Point:** Acknowledge that Davidson does argue against "shared conventions" being the basis of communication. Theo is right that Davidson thinks we are constantly interpreting, not just decoding.
  3.  **Pivot to the Nuance:** Argue that while the *mechanism* is the same, the **stability of the Prior Theory** between friends makes the process functionally different, even if philosophically identical.
  4.  **The "No Language" Claim:** Bring up Davidson's claim that "there is no such thing as a language." Ask Theo: If there's no shared language, what exactly have we been sharing for three years? Davidson would say "converging passing theories," but you can press him on whether that's a useful way to describe friendship.

  **Verdict:** Theo wins on strict exegesis of Davidson's later work, but you win on the pragmatic distinction between strangers and friends. Use that tension to drive the seminar discussion. Good luck!
