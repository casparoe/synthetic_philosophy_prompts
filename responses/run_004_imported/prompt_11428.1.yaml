answer: |-
  The cursor blinked on the grant renewal form. *Approve / Deny / Defer.*

  Elias rubbed his eyes. The office was quiet, save for the hum of the server rack down the hall and the rain tapping against the single pane of glass. It was 8:45 PM. He should have gone home an hour ago. But the file for the *Southside Youth Initiative* was open, and the utilitarian calculus wasn't balancing.

  On paper, the immediate numbers were clean. For every $10,000 invested, the Initiative kept three at-risk teenagers in school for a year. Graduation rates went up. Juvenile arrest rates went down. These were foreseeable, proximate goods. If consequentialism stopped at the one-year horizon, Elias would have clicked *Approve* before lunch.

  But the Foundation's mandate was *long-term welfare maximization*. And that was where the noise started.

  Elias minimized the performance metrics and opened the sociological impact assessment. This was the second-order stuff. The stuff that kept him awake.

  The Initiative worked by encouraging mobility. It taught kids to look beyond their neighborhood, to apply for colleges in other states, to seek jobs in the city center. It broke insular community bonds.

  *Argument A:* Mobility increases income. Higher income correlates with better health outcomes, lower violence, and greater political stability. The kids who leave become tax bases instead of liabilities. They send remittances home. The net utility is positive.

  *Argument B:* Mobility fractures social cohesion. The kids who leave don't come back. The neighborhood loses its future leaders, its teachers, its organizers. The ones who stay are left in a vacuum, leading to accelerated decay. The cultural loss is unquantifiable but real. Furthermore, increased consumption patterns from upwardly mobile individuals contribute to carbon emissions and resource strain.

  Elias leaned back, interlacing his fingers. This wasn't simple cluelessness. Simple cluelessness was wondering if one of the kids would get hit by a car on the way to class. That was symmetric noise. Accidents happen regardless of the grant. Those effects washed out in expectation.

  This was different. This was structural. He had evidence for Argument A—longitudinal studies from similar programs in Chicago and Detroit showing income growth. He had evidence for Argument B—community stability indices showing correlation between out-migration and local institutional collapse.

  He wasn't missing data because he was ignorant; he was missing a weighting function. How much did a dollar of income weigh against a unit of social cohesion? How much did a future carbon ton weigh against a prevented arrest?

  He thought about Leo.

  Elias had visited the site last month. Leo was seventeen, sharp-eyed, wearing a hoodie that was too thin for the weather. Leo wanted to study engineering. The Initiative would pay for his SAT prep.

  If Elias approved the grant, Leo would likely leave. He'd go to a tech hub. He'd build something. Maybe a medical device. Maybe a trading algorithm.
  If Leo built a medical device, he might save thousands.
  If he built a trading algorithm, he might destabilize a market, contributing to a crash that hurt the very people Elias was trying to help.
  Or maybe Leo would stay. If the grant was denied, the Initiative would fold. Leo would work at his uncle's garage. He'd stay in the Southside. He'd raise a family there. He'd vote in local elections. He'd keep the community intact. Or he'd get caught in a gang dispute because the program wasn't there to mediate.

  Elias had no way to know which Leo was the *better* Leo.

  He opened a new spreadsheet. He tried to assign probabilities.
  *Probability of high-impact career:* 5%.
  *Probability of community decay due to out-migration:* 40%.
  *Probability of carbon offset negation:* Unknown.

  The cells remained empty. The variables weren't just unknown; they were incommensurable. He was trying to sum vectors that pointed in different dimensions.

  He thought about the objection Greaves had raised. *Just ignore the far future. It's too hard.*
  But Elias couldn't. He knew the far future mattered. If he denied the grant, he was actively choosing a world where Leo stayed. That was a causal intervention. To ignore the consequences of that intervention because they were complex was to abandon the premise of his job. He was hired to maximize good. If he couldn't calculate the good, was he just guessing?

  And if he was guessing, was he morally permitted to guess with other people's money? With Leo's life?

  The rain intensified. A car drove past on the wet street below, headlights sweeping across the ceiling, momentarily illuminating the dust motes dancing over his desk.

  He looked at the *Deny* button.
  If he denied, he preserved the status quo. The neighborhood remained intact, for better or worse. Leo stayed. The Foundation kept its capital for a safer bet—maybe bed nets in a region with clearer mortality metrics. Bed nets saved lives. Lives were good. You couldn't argue with saved lives.
  Except that saved lives meant more people eating, more strain on resources, more potential for conflict.
  There it was again. The shadow of the long term. Even the bed nets weren't safe.

  There was no neutral ground. Every action was a ripple. Every inaction was a stone dropped in the water. And he was sitting here, trying to predict the shape of the wave when it hit the shore fifty years from now, knowing he would be dead before it broke.

  He looked at Leo's file photo again. Leo was smiling, but it looked tired.
  Elias realized he was waiting for a feeling. A moral intuition that would cut through the noise. *This is the right path.*
  But the intuition didn't come. There was only the static. The complex cluelessness wasn't a gap in his knowledge; it was a feature of the world. The causal chain was too dense, too intertwined. Good and bad weren't separate particles; they were entangled states.

  He couldn't solve it. He could only choose.

  The clock on the screen ticked to 9:00 PM.
  Elias moved the mouse. The cursor hovered over *Approve*.
  He thought about the community decay.
  He moved the cursor to *Deny*.
  He thought about Leo's engineering degree.

  He closed his eyes. He took a breath. He acknowledged that whatever he did, he would never know if it was the right thing. He would never see the ledger balance. He would never know if Leo saved the world or broke it.

  He clicked.

  The screen refreshed. *Submission Successful.*
  Elias closed the laptop. He put on his coat, turned off the light, and walked out into the rain, leaving the future exactly where it had been: unwritten, unknowable, and entirely his responsibility.
