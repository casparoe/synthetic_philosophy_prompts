  ### Comments for Daniel

  Daniel, your setup of the Lagrangian was spot-on, and catching the $t=f$ symmetry shows you have a good physical intuition for the constraints. However, you stopped short of actually solving the transcendental equations that result from the minimization. You assumed that because the constraint is conditional on Red, the marginal $P(Red)$ must be invariant. In KL-minimization, this is not true; the global normalization constant acts as the "lever" that shifts mass between Red and Blue to minimize the total divergence cost.

  The actual result ($P(Red) \approx 0.47$) is the famous van Fraassen result. It *is* philosophically troubling, which is why we're reading it. By calculating the intuitive answer rather than the mathematical one, you've inadvertently smoothed over the exact puzzle Marcus wants us to wrestle with. I'd suggest re-running the algebra with the exponential terms explicit; you'll see the $3^{1/4}$ factors appear, and the 1/2 invariance disappears. See you at the beer session—I'll bring the napkins for the derivation.
