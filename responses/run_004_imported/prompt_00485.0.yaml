answer: |-
  Here is a constructive argument for the irreducibility of resultant luck, designed to fit into a longform science/culture piece. It moves beyond a survey of the debate to offer a positive case for why outcomes *must* matter, even when mental states are held constant.

  ***

  ### The Myth of the Sealed Soul: Why Resultant Luck Is Real

  The epistemic objection to moral luck is seductive because it promises a clean conscience. It suggests that the universe of morality is a sealed chamber, hermetically separated from the chaos of the external world. On this view, championed by philosophers like Michael Zimmerman and hinted at by Judith Jarvis Thomson, the drunk driver who kills a child and the drunk driver who makes it home safe are morally identical. The difference in our judgment is merely a glitch in our perception—a confusion of *evidence* with *truth*. We punish the first driver more severely only because the wreckage provides undeniable proof of the negligence that both drivers shared.

  This is a comforting thought. It preserves a Kantian ideal of fairness: that we are judged only on what is within our control (our will, our choices) and never on the whims of fortune. But to accept this view is to accept a sterilized, solipsistic version of human agency. It requires us to believe that our actions end at the boundary of our skin, and that the rest of the world is merely a backdrop against which we perform moral plays that have no real consequences until we decide they do.

  To argue that resultant luck is an illusion is to misunderstand what an action *is*.

  **1. The Ontology of the Act: Risk vs. Violation**
  The epistemic objection relies on a category error. It assumes that the "action" in question is *deciding to drive drunk*. If that is the action, then yes, both drivers performed it identically. But that is not the action. The action is *driving drunk through a neighborhood*.

  Consider the difference between a threat and a wound. If I swing a fist at your face and stop an inch from your nose, I have threatened you. If I swing with the exact same intent and force but connect, I have battered you. The mental state—the anger, the intention to harm—was identical in both cases. The epistemic theorist says our moral judgment should be the same, and that any difference is just because the bruise provides better evidence of my intent.

  This ignores the moral reality of the victim. Morality is not a solo performance; it is a relational network. When the fist connects, a boundary has been crossed that was not crossed in the near-miss. A right has been violated, not just endangered. The moral debt incurred by the agent is proportional to the damage done to the moral fabric of the community, not just the risk they introduced. To say the drivers are equally blameworthy is to say that risking a life is morally identical to taking a life. But risk is a potentiality; death is an actuality. The transition from potential to actual is not just a change in our knowledge; it is a change in the world that demands a different moral response.

  **2. The Argument from Agent-Regret**
  Bernard Williams, in his seminal work on moral luck, introduced the concept of "agent-regret" to capture something that standard guilt cannot. Guilt is about the state of my will ("I chose badly"). Agent-regret is about my causal footprint in the world ("I did this").

  Imagine the two drunk drivers again. Both should feel guilt for their recklessness. But the driver who hit the child *must* feel something the other driver cannot, and indeed, *should not* feel. They must feel the specific weight of being the cause of a tragedy. If the driver who killed the child says, "Well, my mental state was identical to the guy who made it home, so I bear no extra burden," we would not admire their philosophical consistency. We would find them monstrous.

  This suggests that our intuition about resultant luck isn't a cognitive error; it's a recognition of a distinct moral emotion that is only triggered by outcomes. If the appropriate emotional response differs based on the outcome, then the moral status of the agent must differ as well. We cannot dismiss agent-regret as irrational. It is the psychological price of being an agent who acts in a real world rather than a vacuum. To deny resultant luck is to tell the grieving driver that their specific agony is based on a mistake. It is far more humane to acknowledge that their situation is objectively heavier.

  **3. The Functional Necessity of Differential Blame**
  Finally, we must look at what blame *does*. Blame is not merely a metaphysical scorecard kept by the universe to rate souls. It is a social technology for repair and accountability.

  When the drunk driver makes it home safe, the social debt they owe is limited to apology, perhaps a fine, and a commitment to change. The community needs reassurance that the risk won't be repeated. But when the driver kills a child, the debt is infinite and unpayable. The community requires not just reassurance, but acknowledgment of the loss. The harsher blame and punishment directed at the first driver are not just retributive; they are recognitive. They acknowledge the specific reality of the victim.

  If we treat both drivers identically because their "inner negligence" was the same, we erase the victim from the moral equation. We prioritize the fairness due to the agent over the reality due to the harmed. The epistemic objection collapses because it treats morality as a private transaction between the agent and their conscience. But morality is public. It is about how we live together. In a shared world, outcomes matter because shared lives are defined by what actually happens to us, not just what was almost done to us.

  **Conclusion: Embracing the Fragility of Agency**
  The epistemic objection tries to save us from the unfairness of moral luck by retreating into the mind. It argues that because the world is chaotic, our moral status must be immune to it. But this immunity comes at the cost of relevance. An agency that cannot be touched by the results of its own actions is not human agency; it is a ghost in a machine.

  Resultant luck is not a puzzle to be solved or dissolved. It is the tax we pay for being effective beings. We want our actions to change the world. We want our good deeds to actually help, and our bad deeds to be stopped. But if we grant that our actions have the power to change the world, we must accept that the state of the world reflects back on us. The driver who kills is more blameworthy not because they are a worse person in the abstract, but because they have become the author of a tragedy rather than merely a risker of one. That distinction is not an illusion of evidence. It is the hard, irreducible texture of reality.
