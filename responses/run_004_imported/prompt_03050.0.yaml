answer: |-
  This is one of the most profound and enduring cruxes in Newton scholarship. Your unease is well-founded; you have identified the precise point where Newton's mathematical physics bleeds into his natural theology, and where modern readers (even physicists) often stumble.

  To reconcile these passages, we must adjust our semantic framework. We cannot read "sensorium" through a modern biological lens, nor can we dismiss it as mere metaphor. For Newton, the language is **ontological**.

  Here is a situating of those passages within Newton's wider theological and philosophical commitments, structured to address your specific questions about literalism, anthropomorphism, and the "World Soul."

  ### 1. The Semantic Trap: What did "Sensorium" mean?
  Your primary difficulty lies in whether God apprehends bodies through space as a "perceptual organ." In the 17th century, the Latin *sensorium* (and the English "sensory") did not primarily mean "sense organ" (like an eye or ear). It meant the **"seat of sensation"** or the **locus where perception occurs.**

  In human anatomy, the *sensorium commune* was often identified with the brain or the soul's immediate presence in the body. It is the place where the perceiver meets the perceived.

  When Newton writes that infinite space is God's sensorium, he is **not** claiming space is an organ God uses to see (which would imply God is blind without it). He is claiming that space is the **mode of God's presence** to creation. Just as your mind is present to your body in a way that allows you to perceive and move it immediately, God is present to the universe through space.

  Therefore, it is not figurative (a mere metaphor for omnipresence), but it is also not biological (an organ). It is a statement about the **ontology of space.** For Newton, space is not a substance, nor is it a relation (as Leibniz argued). Space is an "emanative effect" of God's existence. Because God exists, there is "where." Space is the shadow of God's substantiality.

  ### 2. Why deny the "World Soul" but affirm "Immediate Presence"?
  You asked why Newton blocks the reading of the World as God's Body (Stoic Pantheism) while maintaining that God perceives bodies by immediate presence. This distinction is the key to Newton's theology of **Sovereignty.**

  *   **The World Soul (Rejected):** If the universe is God's body, then God is divisible (since the universe has parts). If the universe changes, God changes. If the universe suffers, God suffers. This makes God dependent on the creation. Newton's God is a *Pantokrator* (All-Ruler), a Lord over creation, not a soul trapped within it. In Query 31, when he says God is "void of Organs, Members or Parts," he is protecting Divine Simplicity and Sovereignty.
  *   **Immediate Presence (Affirmed):** Newton needs God to be immediately present to matter to explain **gravity** and **stability.** In Newton's view, matter is inert. It cannot act at a distance. For the solar system to remain stable (and not collapse due to gravitational perturbations), God must occasionally intervene to "reform the Parts of the Universe."
      *   To move a body, you must be present to it.
      *   To know a body's true motion (vs. relative motion), you must perceive it from an absolute frame.
      *   Therefore, God must be substantially present to all points in space simultaneously to will the motion of bodies.

  Newton rejects the *World Soul* because it makes God passive and divisible. He affirms *Immediate Presence* because it makes God an active, willing Agent who can sustain the vacuum and move the planets.

  ### 3. The Clarke Defense (The Leibniz-Clarke Correspondence)
  The best commentary on these Queries comes from Samuel Clarke, Newton's close friend and theological mouthpiece. During the famous Leibniz-Clarke correspondence (1715–1716), Leibniz mocked Newton's "sensorium," arguing it made God a finite being who needed a medium to perceive things.

  Clarke's response clarifies Newton's intent. He argued that "sensorium" should not be understood as an *organ* but as the **place of presence.** Clarke wrote:

  > *"As our Soul is in its Sensorium... so is God in the whole World... Not that the World is the Sensorium of God (as some have misunderstood the expression) but that he is present to all things in the World, as our Mind is to all the Images of things in our Sensorium."*

  Clarke explicitly warns against the reading you are struggling with. He insists that space is not a *medium* through which God sees (which would imply God is far away), but the **manner** in which God is present. God does not look *through* space; He is present *in* space, and because He is there, He perceives what is there.

  ### 4. Theological Commitments: Arianism and Voluntarism
  To fully situate this, we must look at Newton's heterodox theology. Newton was an Arian (he denied the Trinity, viewing Christ as a created divine being, subordinate to the Father). This influenced his view of God's relationship to the world in two ways:

  1.  **Voluntarism:** Newton believed God's Will is supreme over logical necessity. (Contrast this with Leibniz, who believed God acted according to the Principle of Sufficient Reason). For Newton, space exists because God willed to create an arena for His dominion. The "absolute" nature of space reflects the absolute nature of God's Will.
  2.  **Dominion:** In the *General Scholium* of the *Principia*, Newton defines God not by metaphysical essence but by **dominion**. "God is a relative being... without dominion, providence, and final causes, the word God signifies nothing."
      *   Absolute Space is the theater of this Dominion.
      *   True Motion is motion relative to God's sensorium (Absolute Space).
      *   Therefore, the physics (true motion) requires the theology (God's omnipresence).

  ### 5. Resolution of the Passages
  Returning to your specific passages:

  *   **Query 28:** *"sees the things themselves intimately... by their immediate presence to himself."*
      *   **Meaning:** God does not receive "images" (species) transmitted through a medium. He knows things because He is substantially present to them. Space is the condition of that presence.
  *   **Query 31:** *"move the Bodies within his boundless uniform Sensorium... not to consider the World as the Body of God."*
      *   **Meaning:** God moves bodies directly by Will, just as you move your limbs. However, unlike your limbs, the universe is not *part* of Him. It is distinct from Him, yet totally dependent on His immediate presence for its cohesion and motion.

  ### Summary for the Physicist
  You viewed Absolute Space in the *Principia* as a "bare mathematical postulate." In the *Opticks* and his theological manuscripts, Newton reveals that **the postulate has an ontological cost.**

  He cannot have Absolute Space without a Being who substantiates it. If space is real, infinite, and immutable, it must be an attribute of something real, infinite, and immutable. That something is God.

  *   **Is it literal?** Yes, in that space is truly the mode of God's existence.
  *   **Is it an organ?** No, it is the locus of presence.
  *   **Why the contradiction?** It is not a contradiction but a boundary. Newton draws a line between **Immanence** (God is present in space as a mind in its sensorium) and **Identity** (God is not the sum of material things).

  Newton is attempting to solve the problem of Action at a Distance. He cannot accept gravity as an innate property of matter (that would be atheistic mechanism). Gravity must be caused by a Will. For a Will to act on matter everywhere, that Will must be present everywhere. Space is the "where" of that Presence.

  You are unsettled because Newton is asking you to accept that the coordinate system of the *Principia* is, metaphysically speaking, the mind of God. For Newton, there was no other way to secure the reality of motion and the stability of the cosmos.
