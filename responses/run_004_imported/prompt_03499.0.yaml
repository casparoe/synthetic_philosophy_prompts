      *   *Wait, does Bell prove non-locality?* Technically, it proves ~ (Local & Real). You can keep Locality if you drop Realism (e.g., Copenhagen). You can keep Realism if you drop Locality (e.g., Bohmian). Most working physicists act as if Locality (in the sense of no signaling) is sacred. So saying Bell *proved* AAD is controversial.
      *   *Better:* Bell proved that *Local Realism* is false. If you hold onto Realism (which Newton did), you must accept Non-Locality.
