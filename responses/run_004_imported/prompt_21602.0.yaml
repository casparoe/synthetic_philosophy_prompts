answer: |-
  Good evening. For those who don't know me, I'm a novelist. I deal in made-up truths. Marcus, however, is a philosopher. He deals in the real ones. And Priya… Priya is a biologist who somehow understands both of us better than we understand ourselves.

  Standing here, looking at this room, I see a divide. On one side, the philosophy department, waiting to see if I butcher a specific thought experiment. On the other, family and friends who are just here for the open bar. I intend to satisfy both groups without using a single syllable of jargon.

  Marcus has a party trick. It involves an eccentric billionaire, a million dollars, and a vial of foul-tasting, harmless toxin. The deal is this: At midnight, you must sincerely *intend* to drink the toxin tomorrow afternoon. If you do, the money is wired to your account immediately. You get the cash before you have to drink.

  The catch is obvious. Once you have the money, you have no reason to drink the toxin. It makes you sick, and the reward is already banked. So, a purely rational person would decide tomorrow not to drink. But if you know you won't drink tomorrow, you can't sincerely intend to drink tonight. So you don't get the money. The rational agent is stuck in the lobby, never getting the check.

  For years, I watched Marcus explain this to grad students. The lesson always seemed to be about the limits of rationality. How calculation can paralyze commitment.

  But watching Marcus and Priya together, I've realized they solve the puzzle not by calculating better, but by being different kinds of people.

  The philosophers in the back know the serious answer to the Toxin Puzzle. It's that the only way to win is to be the kind of person whose commitment overrides the calculation. You have to be someone for whom "I said I would" is a heavier force than "I don't want to." You have to bind your future self to your present word, even when the incentives shift.

  And that, ultimately, is what we are celebrating today.

  Marriage is not the Toxin Puzzle. In the puzzle, the reward is separate from the act. In marriage, the vow *is* the reward. But the logical difficulty is the same. Life will offer Marcus and Priya a thousand moments where the "midnight" has passed, the money is in the bank, and the reason to follow through has evaporated.

  There will be mornings when the utility calculation of kindness looks negative. There will be years when the "harmless toxin" of sacrifice tastes genuinely foul. In those moments, a purely rational agent might look at the ledger and say, "The incentive is gone. Why bother?"

  But Marcus and Priya are not purely rational agents. Priya, you teach biology. You know that living systems endure not because they calculate, but because they maintain integrity. Cells don't decide to hold together based on the weather; they hold together because that is what makes them an organism.

  Marcus, you study ethics. You know that a promise is a way of planting a flag in the future and claiming it as your own.

  The toast I want to offer isn't that your life will be free of toxins. It's that you have both proven yourselves to be the people who can drink them. You are the people who can look at a future moment where the reason has vanished, and say, "It doesn't matter. I intended this then, so I will do it now."

  That is the only way to beat the puzzle. You don't outsmart it. You out-character it.

  So, to the bride and groom: May your intentions always be sincere. May your follow-through always be stronger than your incentives. And may you never, ever have to deal with eccentric billionaires.

  To Marcus and Priya.
