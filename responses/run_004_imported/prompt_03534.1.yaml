      *   *Mach:* Critique of Newton. Inertia arises from interaction with distant masses (fixed stars), not absolute space. "Mach's Principle."
      *   *General Relativity (GR):* Einstein was inspired by Mach. Spacetime is dynamic (metric field), not fixed. But is it relationist? The "Hole Argument" suggests spacetime points have identity independent of fields (substantivalist leanings).
      *   *Background Independence (BI):* In physics, usually means the equations don't presuppose a fixed metric structure. The geometry is a solution, not a input.
