  I'm working on a feature about how a seventeenth-century thought experiment still bears on research at the frontiers of physics, and I keep coming back to Newton's bucket. Proponents of loop quantum gravity often describe their approach as "background independent" and treat this as vindicating a broadly relationist conception of spacetime, in contrast to the fixed background that perturbative string theory typically presupposes. Please describe the most important implications of the substantivalism/relationism debate—running from Newton's original argument through Mach's principle—for assessing that claim. In particular, I'd like to understand whether "background independence" in the physicist's sense really tracks "relationism" in the philosopher's sense, or whether the two can come apart in either direction.
