answer: |-
  1. **The Metaphysical Source of the Power**
  You ground promissory obligation in a normative power—an authority to change your moral landscape by an act of will. But if this power isn't derived from social convention or the utility of reliance, where does it come from? A Humean would argue that the "power" is just a philosophical fiction we project onto a practice that exists solely because it's useful. How do you establish that this power is a fundamental moral fact rather than a byproduct of the practice's usefulness?

  *Follow-up:* If you reply that it's a basic capacity of moral agents, doesn't that risk making the power a brute fact that stops explanation just where the Humean thinks explanation is most needed?

  2. **The Puzzle of Asymmetric Release**
  If binding oneself is a power the promisor exercises unilaterally, it seems odd that unbinding oneself isn't subject to the same logic. Why can't I exercise my normative power in reverse to cancel the duty? It appears only the promisee can release me. If the obligation stems from *my* authority, why is the termination of that obligation subject to *someone else's* authority?

  *Follow-up:* If you argue that the promisee acquires a right that blocks your reversal, doesn't that concede that the obligation is actually grounded in the promisee's normative status, not just your initial act of will?

  3. **The Deathbed Promise and the Promisee's Status**
  You often lead with the deathbed promise: I promise a dying friend to care for their cat, they die, and no one will know if I break it. You say the obligation holds. But consider a variation where the friend survives. In that case, they could release you, even if they never do. Does it matter, morally, that the dead promisee *lacks the capacity* to release you, whereas the living one possesses it?

  *Follow-up:* If you say the capacity doesn't matter, are you implying that the obligation is entirely about my integrity, effectively severing the essential relational link between promisor and promisee?

  4. **Binary Powers vs. Graded Obligations**
  Normative powers sound binary: either I exercised the power and I'm bound, or I didn't and I'm not. Yet intuitively, a casual verbal promise among friends binds more loosely than a formal commercial contract, and excuses seem more readily available in the former. If bindingness is just the exercise of a power, how do you account for these degrees of stringency without smuggling reliance back in?

  *Follow-up:* If you suggest the *scope* of the power varies by context, isn't "scope" just a proxy for how much reliance it was reasonable to expect in that context?

  5. **The Analogy with Consent**
  Proponents of normative powers often lean on the analogy with consent. But consent typically waives an existing claim someone has against me, whereas promising creates a *new* duty where none existed before. Does your account owe more to the logic of waiving rights or the logic of creating duties, and does that distinction break the analogy with consent?

  *Follow-up:* If you argue it's a unique kind of power that does both, do we need a separate metaphysical explanation for why this specific power can create new duties when other acts of will cannot?

  6. **Comparison with Practice-Based and Principle-Based Views**
  Rawls argued that obligation arises from the social practice itself, and Scanlon grounds it in a principle against manipulating expectations (Principle F). Your account posits a power that presumably underlies both. What explanatory work does the "power" do that a practice-based view or Scanlon's principle doesn't? What phenomenon can you explain that they cannot?

  *Follow-up:* If your answer is that you explain the *source* of the practice, doesn't that push the question back to why we have this specific power, potentially leading back to the Humean utility objection?

  7. **The Limits of the Power**
  We generally agree one cannot promise to do something immoral. If promising is an exercise of authority to create a duty, does this mean my normative power is limited by objective morality? If so, doesn't that suggest the obligation comes from the underlying moral truth, not the exercise of the power itself?

  *Follow-up:* If you say the power exists but is "defeated" by moral constraints, how do you distinguish a promise that creates no obligation from a promise that creates an obligation that is overridden?

  8. **Communication and Uptake**
  For a normative power to be effective, does the promisee need to understand that I'm exercising it? If I silently will myself to be obligated to you without communicating it, am I bound? If communication is required, doesn't that re-introduce the promisee's mental state—and thus the potential for reliance—as a necessary condition?

  *Follow-up:* If you insist communication is just the mode of exercise and not a reliance-trigger, how do you explain why secret promises feel normatively inert compared to communicated ones?

  9. **The "Etiquette" Dismissal**
  You've characterized reliance-based objections as describing "the etiquette of promising, not its metaphysics." Does this imply that violating reliance is merely rude, while violating the promise itself is wrongful? Where exactly do you draw the line between a breach of etiquette and a breach of moral obligation in cases where reliance is present?

  *Follow-up:* If you concede that reliance violations are also moral wrongs, just distinct ones, doesn't that weaken the claim that the promissory obligation is *solely* a matter of metaphysical power?

  10. **Falsifiability and Evidence**
  Finally, a methodological question. You have a robust framework for explaining away counterexamples by categorizing them as issues of etiquette or scope. What would actually count as evidence against your account? Is there a specific case or intuition that, if confirmed, would force you to abandon the normative-powers view?

  *Follow-up:* If the answer is that no single case could overturn it because it's a conceptual claim, how do you respond to the charge that the theory is insulated from revision and therefore lacks explanatory traction?
