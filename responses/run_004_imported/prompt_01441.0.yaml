answer: |-
  You have stumbled onto a genuinely deep philosophical puzzle that ethicists have argued about for a long time. Your intuition is spot-on: there is a massive moral difference between "easy on me, hard on you" and "hard on me, hard on you."

  In philosophy, this concept is usually discussed under the umbrella of **Moral Standing**. Specifically, the question is: *What gives someone the right to blame or criticize another person?*

  Here is the breakdown of why the "standard hypocrite" loses their footing, why your coworker keeps hers, and what is actually happening under the hood.

  ### 1. The Standard Hypocrite: The Problem of Exemption
  To understand why your coworker is different, we first have to pinpoint exactly why normal hypocrisy is so offensive. It isn't just about inconsistency. If I tell you "don't smoke" and then I smoke, I am inconsistent. But the reason we get angry is deeper than logic; it's about **fairness** and **authority**.

  *   **The Unfair Advantage:** When a standard hypocrite says, "You shouldn't do X," but they do X, they are effectively claiming a special exemption. They are saying, "The rules apply to you, but I am special." This is a form of exploitation. They want the benefit of your compliance without paying the cost of their own.
  *   **Undermining the Norm:** When someone violates the very rule they are enforcing, they weaken the rule itself. It sends the message: "This rule isn't actually important; it's just a tool for me to control you."
  *   **The "Clean Hands" Doctrine:** To judge someone, you generally need "clean hands." If your hands are dirty from the exact same mud you're yelling at me for, you lose the authority to speak. You become a participant in the wrongdoing, not an upholder of the right.

  ### 2. Your Coworker: The Problem of Over-Compliance
  Now look at your coworker. She holds herself to Standard A (Extreme Perfection) and others to Standard B (High Professionalism).

  *   **No Exemption:** She is not claiming an exemption for herself. In fact, she is burdening herself *more* than she burdens you. She isn't trying to get away with anything.
  *   **Integrity Intact:** When she criticizes a mistake, she is upholding a standard she definitely meets. If the rule is "Don't submit reports with typos," and she submits zero typos (while crying about a comma placement), she has technically upheld the rule. Her hands are clean.
  *   **Supererogation:** In ethics, there is a concept called *supererogatory* acts. These are actions that are good to do but not required (like running into a burning building to save a cat). You are a hero if you do it, but you aren't a villain if you don't. Your coworker treats basic professional duties as supererogatory acts for herself. She is "over-complying."

  **So, does she have the standing to judge?**
  **Yes.** Technically, morally, and philosophically, she retains the standing to criticize. She is not violating the social contract of fairness because she isn't asking you to do something she refuses to do herself. She is asking you to do *less* than she does.

  ### 3. Why the Asmetry Exists (The "Under the Hood" Mechanics)
  You asked why inconsistency wrecks your right to judge in one direction but not the other. Here are the three philosophical mechanisms at play:

  **A. The Direction of Harm**
  *   **Standard Hypocrisy:** Harms *others*. It imposes a burden on you that the hypocrite refuses to carry.
  *   **Your Coworker:** Harms *herself*. She imposes a burden on herself that she doesn't require of you.
  Morality is primarily concerned with how we treat others. Being unfair to yourself is a psychological issue, not necessarily a moral violation against your coworkers. Therefore, it doesn't strip you of your moral standing relative to them.

  **B. The Implicit Claim**
  When you criticize someone, there is an implicit claim: "We are both subject to this norm."
  *   The **Hypocrite** lies. They act as if they are subject to the norm, but their actions say, "I am above it."
  *   **Your Coworker** tells the truth. She acts as if she is subject to the norm, and her actions say, "I am actually *below* it (in terms of humility/submission)." She submits to the norm more than anyone else.

  **C. Credibility vs. Authority**
  *   **Hypocrites** lose **Authority**. They can't enforce the rule because they broke it.
  *   **Your Coworker** retains Authority, but risks **Credibility**. If she screams at you for a typo when she stayed up until 4 AM fixing hers, you might think she's crazy or unstable, but you can't say she's a hypocrite. Her criticism is "valid," even if her reaction is disproportionate.

  ### 4. The Catch: Standing vs. Wisdom
  Here is where your gut might still be nagging you. Even though she has the *moral standing* to criticize (she isn't a hypocrite), she might still be wrong to do so. There is a difference between having the *right* to speak and speaking *well*.

  Philosophers distinguish between **Moral Standing** (Do I have the right to blame?) and **Moral Wisdom** (Is this blame helpful or virtuous?).

  Your coworker might pass the "Hypocrisy Test," but she might fail the **"Virtue Test."**
  *   **Lack of Empathy:** Ethics isn't just about rules; it's about human flourishing. If her standards are so high that they cause her to spiral, and she imposes that anxiety on others, she is failing to be a good colleague.
  *   **Projection:** Often, people who are hyper-critical of themselves project that inner critic onto others. She isn't judging *you*; she is judging the part of *herself* that she sees in you. This makes her criticism less about upholding a standard and more about managing her own anxiety.
  *   **Proportionality:** A virtuous critic matches the punishment to the crime. If you make a small error and she reacts with moderate correction, that's justice. If she reacts with fury (even if she directed more fury at herself), she lacks the virtue of temperance.

  ### Summary
  You are right to feel that this is the "opposite of normal hypocrisy."

  *   **Normal Hypocrisy** is "Rules for thee, not for me." This violates fairness and strips you of the right to judge.
  *   **Your Coworker** is "Extra rules for me, regular rules for thee." This violates nothing regarding fairness toward others. She retains her **Moral Standing**.

  However, just because she *can* judge without being a hypocrite doesn't mean her judgment is healthy. She isn't violating the **ethics of consistency**, but she might be violating the **ethics of care**. She's technically in the clear to call you out, but she's probably a nightmare to work with.

  So, your gut is correct: She isn't a hypocrite. But that doesn't automatically make her right, kind, or effective. It just means she's punishing herself more than she punishes you, which buys her the ticket to criticize, even if the show she puts on is miserable for everyone involved.
