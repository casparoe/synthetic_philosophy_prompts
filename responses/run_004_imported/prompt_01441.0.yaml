  8.  **Tone Check:** Keep it conversational but intellectually rigorous. Avoid dense academic jargon unless explained. Use analogies (Referee, Dieting, etc.).

  9.  *(Self-Correction on the "Hypocrisy" label)*: Some philosophers argue *any* differential standard is hypocrisy. I should acknowledge that but explain why the *moral weight* differs. The user asks about the *right to judge*, not just the label. Focus on **Moral Standing**.

  10. **Final Polish:** Ensure the distinction between "Moral Standing" (permission to blame) and "Constructive Feedback" (usefulness) is clear. The coworker might have standing but be a terrible manager/coworker.

