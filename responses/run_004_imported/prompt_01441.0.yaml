prompt: |-
  Okay so this has been rattling around in my head for weeks and I need someone smarter than me to help me sort it out. I've got a coworker who is honestly the hardest on herself out of anyone I know, like she'll spiral over a tiny mistake for days, way harder than the mistake deserves, but then she'll turn right around and get on someone else's case for basically the exact same screwup and barely bat an eye. My first thought was "wow that's kind of hypocritical of her" but then I actually sat with it and realized it's sort of the opposite of normal hypocrisy? Like, the usual complaint about hypocrites is that they're easy on themselves and harsh on everyone else, and thats supposedly why they loose the right to call other people out in the first place, they won't hold themselves to the standard they're demanding from you. But my coworker's got it backwards, she holds herself to a way harsher standard than she holds anyone else to. So does that mean she's actually totally fine to judge her coworkers, standing-wise, even though she is, technically, still treating herself and other people completely differently for the same offense?

  My gut says obviously she's fine, if anything she's only being unfair to herself and not them. But when I try to actually explain WHY that's different from regular hypocrisy I get stuck, because both cases are just applying two different standards to two different people for the identical mistake, which I thought was basically the whole reason we say hypocrites don't get to talk in the first place (not treating people as equals, or being inconsistent, or whatever the real underlying reason is). So why does the inconsistency wreck your right to judge people in one direction (easy on me, hard on you) but seem totally harmless in the other direction (hard on me, easy on you)? I never studied any philosophy so I don't know the technical terms for any of this, but I'm guessing people who actually study this stuff for real have thought hard about why hypocrites specifically lose their footing to criticize others, and I'd love it if you could explain what's actually going on under the hood, like what hypocrisy is supposed to be violating that my coworker's case doesn't violate, and whether that asymmetry actually holds up under scrutiny or if our gut reactions here are just inconsistent.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Situation:** The user has a coworker who is extremely hard on herself (spirals over tiny mistakes) but also critical of others for similar mistakes (though seemingly less harshly than she is on herself).
      *   **The Core Question:** Is this coworker a hypocrite? Standard hypocrisy is "easy on me, hard on you." This is "hard on me, hard on you" (but *hardest* on me). Does the inconsistency in standards (treating self differently than others) invalidate her right to criticize others, even if she holds herself to a *higher* standard?
      *   **The Philosophical Puzzle:** Why does "easy on me, hard on you" strip moral standing to blame, while "hard on me, hard on you" (or "harder on me") seems acceptable or even virtuous? Both involve inconsistency in treatment.
      *   **Goal:** Explain the underlying philosophical mechanics of hypocrisy, moral standing, and why this asymmetry exists, using accessible language (no jargon overload).

  2.  **Deconstruct "Hypocrisy" and "Moral Standing":**
      *   *What makes hypocrisy bad?* It's not just inconsistency. A saint who slips up once isn't necessarily a hypocrite if they admit it.
      *   *Key Concept 1: The Claim to Authority.* When I blame you, I imply I have the standing to do so. If I violate the very norm I'm enforcing, I undermine my authority. It's like a referee breaking the rules while officiating.
      *   *Key Concept 2: The Harm/Unfairness.* Standard hypocrisy harms the target by subjecting them to a rule the blamer exempts themselves from. It's unfair advantage-taking.
      *   *Key Concept 3: Integrity/Authenticity.* Hypocrisy suggests a disconnect between values and actions.

  3.  **Analyze the Coworker's Case ("Hyper-critical Self, Critical Others"):**
      *   She holds herself to Standard A (Extreme).
      *   She holds others to Standard B (High, but lower than A).
      *   She violates neither when she blames others (assuming she meets Standard B).
      *   *Is she inconsistent?* Yes, she treats herself differently.
      *   *Is she hypocritical?* Technically, maybe "moral perfectionism" or "self-flagellation," but not the damaging kind of hypocrisy that loses standing.
      *   *Why does she keep standing?* Because she isn't claiming an exemption for herself. She is actually *over-complying*.

  4.  **Identify the Philosophical Principles at Play:**
      *   **The "Tu Quoque" (You Also) Fallacy vs. Moral Standing:** Pointing out hypocrisy doesn't make the original criticism false, but it might make the *blamer* inappropriate.
      *   **Fairness/Reciprocity:** Hypocrisy violates the social contract of "rules apply to everyone equally." The coworker isn't violating this in a way that harms others; she's violating it by burdening herself *more*.
      *   **The Function of Blame:** Why do we blame? To correct behavior, uphold norms, express resentment.
      *   **Self-Other Asymmetry:** We generally accept that people can have special obligations to themselves (supererogatory acts) without imposing them on others.

  5.  **Drafting the Explanation (Iterative Process):**

      *   *Validation:* Acknowledge this is a really sharp observation. It's a classic philosophical puzzle (often called the "hypocrisy paradox" or discussed in literature on moral standing).
      *   *Define the "Standard Hypocrite":* Why do we hate them? It's about *exemption*. They say "Rules for thee, not for me." This is unfair and undermines the rule itself.
      *   *Define the Coworker:* She says "Rules for thee, and *extra* rules for me."
      *   *The Crucial Difference:*
          1.  **Fairness/Exploitation:** Standard hypocrisy exploits others (I get to break rules, you don't). Coworker exploits *herself*.
          2.  **Authority/Integrity:** Standard hypocrites lack integrity (actions don't match words). Coworker has *too much* integrity (actions exceed words).
          3.  **The "Clean Hands" Doctrine:** To judge, your hands must be clean *enough*. They don't have to be scrubbed raw.
      *   *Philosophical Terms (Light Touch):* Mention "Moral Standing" and "Supererogation" (going above and beyond).
      *   *The Catch/Nuance:* Is the coworker actually *good* to work with? Probably not. Her self-hatred might bleed into her management style. She might be projecting. So while she has *moral standing*, she might lack *effectiveness* or *empathy*.
      *   *Conclusion:* The gut feeling is right. She isn't a hypocrite in the damaging sense. But she might be toxic for other reasons.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is she technically inconsistent?* Yes. Does inconsistency *always* kill standing? No. If I donate 50% of my income and criticize you for donating 0%, am I a hypocrite? No. That's supererogatory.
      *   *Need to distinguish between "Duty" and "Extra Credit".* If the mistake is a basic professional duty (e.g., showing up on time), holding yourself to "arrive 2 hours early" and criticizing others for "arriving 1 minute late" is tricky.
      *   *Refinement:* If the standard is "Don't make mistakes," and she beats herself up for breathing, but criticizes others for typos... she still meets the baseline "Don't make mistakes." So she's clean on the baseline.
      *   *Key Insight:* Hypocrisy is about *lowering the bar for yourself* while keeping it high for others. She is *raising the bar for herself*.

  7.  **Final Structure:**
      *   Intro: Validate the insight. It's a known philosophical distinction.
      *   Part 1: Why normal hypocrisy loses standing (The "Exemption" Problem).
      *   Part 2: Why the coworker keeps standing (The "Over-Compliance" Factor).
