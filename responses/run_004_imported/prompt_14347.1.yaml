      *   *Text:* "And, being something itself, if it does not itself bear a relation to the terms, in what intelligible way will it succeed in being anything to them?" (The Crucial Premise: Distinct entities require a further tie to connect.)
      *   *Text:* "But here again we are hurried off into the eddy of a hopeless process..." (The Regress.)
      *   *Text:* "The links are united by a link, and this bond of union is a link which also has two ends; and these require each a fresh link to connect them with the old." (Mechanism of the Regress.)

      *   *Key Assumption to Explicate:* Why does "being something itself" entail "bearing a relation to the terms"?
          *   Bradley assumes a strict distinction between *terms* (qualities/substances) and *relations*.
          *   He assumes that for $R$ to relate $a$ and $b$, $R$ must be connected to $a$ and connected to $b$.
          *   If $R$ is a distinct entity from $a$ and $b$, the connection between $R$ and $a$ is itself a relational fact.
