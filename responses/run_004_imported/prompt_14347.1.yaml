      *   To connect $a$ and $b$, we add $R$. But $R$ needs connecting. Adding $R'$ doesn't solve the problem; it just repeats it.
      *   Contrast with harmless regresses (e.g., truth regress: "p is true" implies "It is true that p is true"). That doesn't block the initial truth. Bradley's regress blocks the initial *unity*.
