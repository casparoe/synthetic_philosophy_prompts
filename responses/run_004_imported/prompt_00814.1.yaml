answer: |-
  This is a fantastic set of questions. You have hit on exactly the two tensions that keep Aristotle scholars busy: the **gradient of unnaturalness** (why is usury *worse* than trade?) and the **ontology of money** (how can a conventional thing have a natural purpose?).

  Since you need to speak on this tomorrow, I'm going to break this down into the logical steps Aristotle is taking, so you can reconstruct the argument in class without just quoting the text.

  ### 1. The Gradient of Unnaturalness: Why Usury is "Most" Unnatural

  You are right that retail trade (*kapelike*) is already censured. But Aristotle is building a hierarchy of deviation from the *telos* (purpose) of human life. Think of it as a sliding scale of "distance from need."

  *   **Level 1: Natural Acquisition (*Oikonomia*).**
      *   **Activity:** Farming, hunting, gathering.
      *   **Goal:** Subsistence for the household.
      *   **Status:** **Natural.** It deals directly with nature providing for biological need. It has a natural limit (you only need so much food).
  *   **Level 2: Barter.**
      *   **Activity:** Swapping surplus wine for shoes.
      *   **Goal:** Satisfying specific needs via exchange.
      *   **Status:** **Natural/Liminal.** It is still grounded in the use-value of goods.
  *   **Level 3: Retail Trade (*Kapelike*).**
      *   **Activity:** Buying shoes to sell them for a profit.
      *   **Goal:** Accumulation of money.
      *   **Status:** **Unnatural.** Why? Because it shifts the focus from *use-value* (the shoe) to *exchange-value* (the money). It treats money as an end rather than a means. However, **there is still a commodity involved.** You are still moving physical goods around. There is still a tether to the real world of needs, even if it's stretched.
  *   **Level 4: Usury (*Tokos*).**
      *   **Activity:** Lending money for interest.
      *   **Goal:** Money generating more money.
      *   **Status:** **Most Unnatural.**
      *   **The Logic:** Here, the commodity disappears entirely. You are not trading shoes, or even trading money for shoes. You are trading money for *more money*.

  **So, what work is the "breeding" metaphor doing?**
  It is not just rhetorical flourish; it is a **category error argument.**

  For Aristotle, reproduction (*genesis*) is a property of living organisms (*physis*). Money is an artifact (*techne/nomos*). Artifacts are sterile. A hammer cannot make a baby hammer. By charging interest, you are treating a sterile artifact as if it were a living organism.

  *   **Retail trade** is unnatural because it seeks infinite accumulation (violating the limit of need).
  *   **Usury** is *more* unnatural because it violates the **ontology of the object itself.** It claims money has a biological capacity it does not possess.

  In class, you can frame it like this: *"Retail trade corrupts the purpose of exchange, but usury corrupts the nature of the instrument itself. It's the difference between using a ruler to hit someone (misuse of a tool) versus claiming the ruler can grow longer on its own (impossibility/category error)."*

  ### 2. The "Convention vs. Nature" Paradox

  This is your sharper objection. In *Nicomachean Ethics* (Book V), Aristotle says money exists by *nomos* (convention/law), not *physis* (nature). So how can he talk about a "natural use" of money in *Politics*?

  This is a classic distinction between **Origin** and **Function (Telos).**

  *   **Origin (Ontology):** Yes, money is conventional. It does not grow on trees. We agreed to use silver as a medium. In this sense, it is "artificial."
  *   **Function (Teleology):** However, once humans invent a tool, that tool has a specific purpose relative to human flourishing.
      *   **Analogy:** A knife is artificial (made by humans). But we can still speak of the "natural use" of a knife (cutting) and an "unnatural use" (using it as a coin or hoarding 1,000 knives).
      *   **Application:** Money was invented to facilitate exchange (to measure value and bridge the gap in barter). That is its *telos*.
      *   **The Violation:** When you use money for usury, you are not using it for its intended conventional purpose (exchange). You are using it for something it was not even designed to do (reproduction).

  So, when Aristotle says usury is "against nature," he doesn't mean "against the wild." He means **"against the proper end of the thing within the human community."**

  Even though money is a convention, its *proper function* is fixed by reason. To use it otherwise is irrational, and for Aristotle, the irrational is unnatural.

  ### 3. Seminar Talking Points / Strategy

  Since this is a discussion class, here are three ways to deploy this analysis tomorrow:

  **A. The "Sterility" Point (Addressing the Metaphor)**
  > "I was struggling with why usury is 'most' unnatural compared to retail trade. It seems the key is the Greek word *tokos*. It literally means 'offspring.' Aristotle isn't just making a poetic point; he's making a metaphysical one. Retail trade still involves moving real goods (shoes, wine), so it's tethered to physical need. Usury claims that a sterile symbol can reproduce. It's a category error, not just a moral failing."

  **B. The "Limit" Point (Economic Logic)**
  > "It also seems to hinge on the concept of limits. Natural acquisition has a limit (I only need so much food). Retail trade removes the limit (I want infinite money). But usury removes the limit *and* removes the object. It creates a closed loop of symbols generating symbols. That's why it's the furthest removed from the 'good life' (*eudaimonia*), which requires engaging with real goods and virtues."

  **C. The "Convention" Objection (Your Ethics Point)**
  > "I'm trying to reconcile this with the *Ethics*, where money is defined as conventional (*nomos*). If money is artificial, how can any use be 'natural'? My best guess is that Aristotle distinguishes between the *origin* of money (conventional) and its *telos* (facilitating exchange). Usury violates the *telos*, even if the object itself is man-made. Does anyone else read that distinction differently?"

  ### Summary of the Logic Chain
  1.  **Premise:** All things have a proper end (*telos*).
  2.  **Premise:** Money's *telos* is to facilitate the exchange of goods needed for the household.
  3.  **Observation:** Retail trade uses money to accumulate money, ignoring the goods. (Unnatural #1).
  4.  **Observation:** Usury uses money to generate money without goods. (Unnatural #2).
  5.  **Conclusion:** Usury is *more* unnatural because it attributes a biological property (breeding) to an inanimate convention, completely severing the link between wealth and human need.

  You're ready. The confusion you feel is actually the sign that you're reading the text closely enough to see the cracks in the argument. Own that confusion in class; it's the best way to start a discussion. Good luck!
