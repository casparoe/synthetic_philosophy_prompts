prompt: |-
  Hey so for my History of Economic Thought seminar we're doing the Aristotle week and I actually have to show up tomorrow having read Politics Book I properly instead of just nodding along, since it's a discussion-heavy class. I got through most of it ok (the household management stuff, his weird little example about how a shoe's "real" use is being worn and trading it away is only a secondary use) but I've read the usury paragraph near the end of ch. 10 like four times now and I still can't fully reconstruct the argument. We're using the old Jowett translation for some reason, which does not help:

  "There are two sorts of wealth-getting, as I have said; one is a part of household management, the other is retail trade: the former necessary and honorable, while that which consists in exchange is justly censured; for it is unnatural, and a mode by which men gain from one another. The most hated sort, and with the greatest reason, is usury, which makes a gain out of money itself, and not from the natural object of it. For money was intended to be used in exchange, but not to increase at interest. And this term interest, which means the birth of money from money, is applied to the breeding of money because the offspring resembles the parent. Wherefore of all modes of getting wealth this is the most unnatural."

  Here's my confusion: the very first sentence already calls retail trade in general "unnatural" and "justly censured" for gaining from other people through exchange. So by that point the condemnation is already done, right? Then what extra work is the "birth of money from money" / breeding metaphor doing to make usury specifically "the most unnatural" of all, worse than plain retail trade? Is that just a rhetorical flourish for something he's already established, or is he sneaking in a genuinely different kind of argument there (like, a teleological/biological one, where only living things are suppose to produce offspring, so money "reproducing" itself is closer to a conceptual confusion than a moral failing)? And separately, this is bugging me - didn't we also read in the Nicomachean Ethics part of the course that money only exists by convention/law and not by nature in the first place? If that's true, I don't understand how Aristotle gets to distinguish "natural" from "unnatural" uses of money at all, since the thing itself is artificial to begin with. Wouldn't every possible use of it be equally unnatural then? Would appreciate someone actually walking through the logic here rather than just the "Aristotle didn't like interest" summary version.
