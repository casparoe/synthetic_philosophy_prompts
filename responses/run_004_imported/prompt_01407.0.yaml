  3.  **Key Philosophical Concepts to Weave In:**
      *   **Fitting-Attitude (FA) Analysis:** $X$ is good iff it is fitting to favor $X$.
      *   **Buck-Passing:** Value isn't a property itself; it's the property of having other properties that give reasons for action/attitude.
      *   **Wrong-Kind-of-Reasons (WKR):** The Demon/Saucer of Mud case. Pragmatic reasons vs. Object-related reasons.
      *   **Object-Given vs. State-Given Reasons:** The standard defense. Object-given = properties of the object (mud is muddy). State-given = properties of the mental state (desiring mud saves your life).
