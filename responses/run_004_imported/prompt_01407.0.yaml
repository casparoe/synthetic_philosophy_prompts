answer: |-
  **Setting:** *A university philosophy department office, late evening. Rain streaks the window. Empty coffee cups clutter the desk. ELENA (40s, sharp suit, tired eyes) sits behind the desk. MARCUS (50s, rumpled blazer, pacing) holds a chalk-stained handout.*

  **Marcus:** It's the mud, Elena. It's always the mud. You can dress it up in formal notation, but the intuition pumps are going to burst the pipes.

  **Elena:** The saucer of mud is a classic for a reason. It isolates the variable. But you're treating it like a refutation when it's actually a boundary marker.

  **Marcus:** A boundary marker for a theory that's collapsed under its own weight. Look, the Fitting-Attitude analysis is elegant. I'll give you that. To say $X$ is good is just to say it is fitting to favor $X$. It passes the buck from spooky value properties to reasons for attitudes. It's naturalistic, it's clean. But then the Demon walks in.

  **Elena:** The Demon offers you a million dollars to desire the mud.

  **Marcus:** Worse. The Demon threatens to torture your children unless you desire the mud. Now, do you have a reason to desire the mud?

  **Elena:** Obviously. A overwhelming pragmatic reason.

  **Marcus:** So, on your account, if you have a reason to favor it, is it good?

  **Elena:** No. And that's where you're rushing the distinction. We distinguish between the *right kind* of reasons and the *wrong kind* of reasons. The Demon gives you a state-given reason. You have reason to bring it about that you desire the mud, because the *state* of desiring it has good consequences. But you don't have an object-given reason. Nothing about the *mud* warrants the desire.

  **Marcus:** There it is. The Object-Given versus State-Given distinction. The great firewall of metaethics. But tell me, Elena: how do you draw the line without already knowing where the value is?

  **Elena:** It's structural. An object-given reason cites a property of the object. "The mud is nutrient-rich." "The mud is aesthetically interesting." A state-given reason cites a property of the mental state. "Desiring the mud saves my children." The FA analysis says value tracks object-given reasons. The Demon's threat is irrelevant to the value of the mud because it doesn't touch the mud.

  **Marcus:** But how do you know which properties count as "of the object" in the relevant sense? Suppose the Demon says, "I have enchanted this mud. It now has the property of *being-desirable-on-pain-of-torture*." Is that a property of the mud?

  **Elena:** That's a relational property, sure. But it's extrinsic. It doesn't make the mud *good*, it makes it *instrumentally significant*.

  **Marcus:** You're using "good" to define "object-given" and "object-given" to define "good." It's circular. You want to analyze value in terms of reasons. But to filter out the Wrong Kind of Reasons, you have to say, "We only count reasons that bear on the *value* of the object." But if you need a prior notion of value to filter the reasons, you haven't analyzed value. You've just renamed it.

  **Elena:** (Leans forward) That's the charge of circularity. I know it. But it assumes the analysis has to be reductive in a way that eliminates the normative. Maybe "fittingness" is the primitive. We don't reduce fittingness to something non-normative. We say: Value is the property of having properties that provide object-given reasons for favoring.

  **Marcus:** Then what distinguishes an object-given reason from a state-given one if not the value?

  **Elena:** The direction of fit. Object-given reasons aim at getting the attitude to match the world. If the mud is poisonous, belief should track that. If the mud is beautiful, admiration should track that. State-given reasons aim at getting the world to match the attitude's utility. The Demon case is about the utility of the desire, not the correctness of it.

  **Marcus:** Correctness. There's the smuggled goods. "Correctness" is just "fittingness" in a trench coat. You're saying the right reasons are the ones that make the desire correct. But that's tautological. "The reasons that make it good to desire are the reasons that make it good to desire."

  **Elena:** It's not tautological if it clarifies the structure of our normative thought! It explains why we feel a tension in the Demon case. You *should* desire the mud to save your kids. But you can't just decide to desire it. Why? Because desire aims at the good. You can't manufacture the object-given reasons. The theory explains the phenomenology of the impossibility.

  **Marcus:** It explains the phenomenology, sure. But does it solve the metaphysics? Your novelist friend—the one you're consulting for?—he's got a devil who changes what people want. He makes them crave the mud, and then they feel peace. On your view, if the devil successfully alters their psychology so they genuinely, deeply desire the mud... is the mud now good?

  **Elena:** No. Because the desire is malformed. It wasn't caused by object-given reasons. It was caused by demonic intervention.

  **Marcus:** But how do we know it's malformed? If the person is at peace, if the desire is stable, if it integrates with their other desires... what is the "malformity"? You have to say there's a standard of fittingness independent of the desire itself.

  **Elena:** Exactly. That's the point. Value isn't in the desire. It's in the relation between the object and the desire.

  **Marcus:** But where does that relation live? If it's not in the natural properties of the mud—because the mud is just dirt—and it's not in the desire—because the desire can be demon-induced—then "fittingness" is a ghost. It's a non-natural property hovering between the mind and the world. You passed the buck, Elena, but you passed it to a ghost.

  **Elena:** (Sighs, picks up a pen) I'd rather have a ghost than a mystery. If I say "Good is a simple, non-natural property," like Moore, I stop inquiry. If I say "Good is what we have object-given reasons to favor," I invite inquiry into *what* counts as an object-given reason. It forces us to look at the object.

  **Marcus:** Unless the "object-given" filter is just a placeholder for "whatever we intuitively think is valuable." Look, take your novelist's devil. He makes a mother crave a saucer of mud instead of her child's safety. She craves the mud. She gets the mud. She feels peace. According to the FA account, is it fitting for her to desire the mud?

  **Elena:** No. Because the mud lacks the properties that warrant that level of commitment.

  **Marcus:** Who says? The devil changed her psychology. Maybe in this new metaphysics, the mud *does* have that property. Maybe the devil's magic makes "being-demon-blessed" an objective property of the mud. Now you have an object-given reason. "This mud is demon-blessed." So, is it good?

  **Elena:** (Pauses) If "demon-blessed" entails "worthy of desire," then yes. But then we're just defining value into the property.

  **Marcus:** Precisely! You can't escape the circle. To solve the WKR problem, you have to say which reasons count. To say which reasons count, you have to say which properties make things valuable. But that was the job of the theory! You wanted to analyze value in terms of reasons. But you can't identify the relevant reasons without already knowing the value.

  **Elena:** Okay. Let's grant the circle isn't vicious. Let's say it's a hermeneutic circle. We refine our concept of value and our concept of reasons together. The FA account still does work. It explains why the Demon's threat doesn't make the mud good. It preserves the intuition that value is normative—it calls for a response.

  **Marcus:** It preserves the intuition, but it doesn't ground it. For your novelist, that might be enough. He wants the devil to be altering desires, not granting wishes. He wants the metaphysics to feel slippery. But if you're asking me if the FA account solves the WKR problem without begging the question?

  **Elena:** I'm asking if it's the best map we have.

  **Marcus:** It's a map that labels the territory "Here Be Dragons" and claims it's explained the dragons. The distinction between Object-Given and State-Given reasons... it works in the clear cases. A bribe is state-given. Beauty is object-given. But the Demon case lives in the fog. And in the fog, the distinction relies on a prior sense of what matters.

  **Elena:** So we're back to intuition?

  **Marcus:** We're back to the fact that "fitting" is a normative term. You can't naturalize it away. If you say "fitting" just means "supported by object-given reasons," I ask "What makes a reason object-given?" If you say "Reasons that bear on the value," I say "There it is." You've smuggled value back in to define the reasons that define the value.

  **Elena:** (Taps the pen on the desk) Maybe that's the insight, though. Maybe value *is* that relationship. It's not a property of the mud, and it's not a property of the mind. It's the fit. The WKR problem shows us that not all pressure on the mind counts as a fit. The Demon applies pressure. Value applies a claim.

  **Marcus:** A claim from where?

  **Elena:** From the nature of the attitude itself. Desire aims at the good. If you desire the mud because of a threat, you aren't desiring the mud *as good*. You're desiring the *relief from threat*. The object of your desire is actually "safety," and the mud is just the tool.

  **Marcus:** But the Demon demands you desire the mud *for its own sake*.

  **Elena:** Then he's demanding the impossible. Or he's demanding a contradiction. He wants you to treat the mud as an end, for the sake of a means. That's why it feels wrong.

  **Marcus:** (Stops pacing, sits on the edge of a desk) That's interesting. So the WKR problem isn't a bug. It's a feature. It reveals that "fittingness" requires the reason to align with the *aim* of the attitude.

  **Elena:** Yes.

  **Marcus:** But then you haven't analyzed value. You've analyzed rationality. You've said "Good is what it is rational to desire given the aim of desire." But what sets the aim? Why does desire aim at the good and not at, say, reproductive fitness? Or demonic peace?

  **Elena:** (Silence for a moment) Because if it aimed at anything else, we wouldn't call it value.

  **Marcus:** (Smiles faintly) There. That's the stalemate. You're saying "Value is what fits the attitude of valuing."

  **Elena:** And you're saying that's empty.

  **Marcus:** I'm saying it's a mirror. You look into it to find value, and you see your own concept of value looking back. For your writer... that might be the perfect metaphysics. A devil who can't make things good, only make them *seem* fitting. He can hack the reason, but he can't hack the fit.

  **Elena:** So the characters feel peace, but the reader feels the wrongness.

  **Marcus:** Exactly. The WKR problem isn't a logical error to be solved. It's the sensation of the gap between *having a reason* and *it being the right reason*. If your devil bridges that gap artificially...

  **Elena:** ...then the peace is real, but the value is fake.

  **Marcus:** Or value is just whatever survives the Demon.

  **Elena:** (Looks out the window at the rain) If the Demon makes you desire the mud, and you desire it, and the torture stops... and you still feel like something is missing. That feeling is the FA account working as intended.

  **Marcus:** Just don't ask me to define what's missing without using the word "good."

  **Elena:** I won't. I think that's where the story lives. In the definition we can't quite give.

  **Marcus:** (Stands up) Then we're done. You have your metaphysics. It's circular, it's primitive, and it's haunted.

  **Elena:** It's normative, Marcus.

  **Marcus:** (At the door) Same thing, after midnight. Get some sleep, Elena.
