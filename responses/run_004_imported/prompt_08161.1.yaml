      *   **Context:** The user is deep into political philosophy/social choice theory (LessWrong/ACX/Mill/Arrow). They understand the technical details of STV (Single Transferable Vote), Arrow's Impossibility Theorem, and Mill's *Considerations on Representative Government*.
