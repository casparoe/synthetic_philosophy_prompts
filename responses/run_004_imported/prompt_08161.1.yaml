answer: |-
  This is a fantastic rabbit hole, and you have correctly identified the tension between 19th-century normative political philosophy and 20th-century formal social choice theory. You are also right to suspect that Mill's best defense isn't a pragmatic shrug, but a metaphysical rejection of Arrow's premises.

  If you sat Mill down with a whiteboard and walked him through Arrow's Impossibility Theorem, his reaction wouldn't be embarrassment. It would be a polite but firm correction of your axioms.

  Here is the trace of Mill's best comeback, grounded in *Utilitarianism*, *On Liberty*, and *Considerations on Representative Government*, along with the uncomfortable commitments he would have to double down on to make it stick.

  ### 1. The Rejection of Ordinalism (The "Sen" Move)
  You hit the nail on the head regarding Amartya Sen. Arrow's theorem relies crucially on the assumption that social choice must be based solely on **ordinal preferences** (Ranking A > B > C) without **interpersonal comparisons of utility** (ICU). Arrow treats preferences as opaque, private mental states that cannot be weighed against each other.

  Mill cannot accept this. His entire ethical system is built on the possibility of cardinal, interpersonally comparable utility.
  *   **In *Utilitarianism*:** Mill argues for the distinction between "higher" and "lower" pleasures. This is not just an ordinal ranking; it is a qualitative weighting. He explicitly states that it is "better to be Socrates dissatisfied than a fool satisfied." This requires a metric to compare the utility of Socrates against the utility of the fool.
  *   **The Comeback:** Mill would argue that Arrow's theorem proves only that *if* you treat voters as black boxes of ordinal preferences, you cannot get a perfect system. But Mill rejects the premise that voters *are* merely black boxes of ordinal preferences.
  *   **The Implication:** If you allow cardinal utility and interpersonal comparisons (as Utilitarianism requires), Arrow's impossibility result vanishes. You can mathematically sum utility across persons. Mill would say: *"You have proven that democracy is impossible if you assume all preferences are equal and incomparable. I assume they are neither. Therefore, your theorem does not apply to my system."*

  ### 2. Voting as Truth-Tracking, Not Preference Aggregation
  Arrow's framework assumes the goal of voting is to aggregate existing desires fairly. Mill's framework assumes the goal of voting is to select the most competent government to maximize the general good.

  *   **In *Considerations on Representative Government*:** Mill is explicit that voting is not a right to be exercised for the voter's benefit, but a public trust exercised for the benefit of the community. He writes, "The suffrage is not a right in the voter, but a trust."
  *   **The STV Defense:** Mill likes Hare's STV not because it satisfies abstract fairness criteria like Monotonicity, but because it facilitates **deliberation**. The transferable vote forces candidates to seek second-preference support from rivals' supporters. It encourages coalition-building and compromise *before* the election is finalized.
  *   **The Comeback:** Mill would argue that failing Monotonicity (where more votes can hurt a candidate) is a technical glitch, whereas failing to represent the "instructed minority" (the smart people) is a catastrophic systemic failure. He would trade procedural consistency for epistemic quality. If STV occasionally produces a paradoxical result but ensures that the intellectual elite aren't drowned out by the "tyranny of the majority," he takes the paradox.
  *   **The Commitment:** This commits Mill to an **epistemic view of democracy**. He isn't trying to solve the "aggregation problem"; he is trying to solve the "knowledge problem."

  ### 3. The Uncomfortable Pill: Plural Voting and Measurable Competence
  Here is where the rubber meets the road. To sustain this defense against Arrow, Mill has to lean into the parts of his philosophy that modern liberals (and probably many LessWrong readers) find most dystopian.

  To bypass Arrow via interpersonal utility comparisons, you need a way to measure and compare that utility. Mill provides this in *Considerations* via **Plural Voting**.
  *   **The Scheme:** Mill explicitly argues that while everyone should get a vote, educated people (university graduates, professionals) should get *more* votes. He suggests a sliding scale.
  *   **Why this matters for Arrow:** If everyone has one vote, you are forced into the ordinal/equal-weight framework where Arrow's theorem bites hard. If you weight votes by competence (a proxy for expected utility maximization), you are effectively introducing a cardinal weight to the inputs.
  *   **The Cost:** To defend STV against Arrow, Mill must double down on the idea that **human worth/competence is measurable and should be politically encoded.**
      *   He has to accept that a bureaucrat or a philosopher *actually* has more valid political utility than a laborer.
      *   He has to accept that the state can legitimately categorize citizens by intellectual capacity.
      *   This creates a tension with *On Liberty*. While *On Liberty* argues against silencing opinions, *Representative Government* argues for weighting the power of those opinions. Mill resolves this by saying the minority should be *heard* (STV ensures this) but not necessarily *obeyed* (Plural Voting ensures this).

  ### 4. The "Tyranny of the Majority" Reframed
  Mill's specific fear wasn't just that the majority would outvote the minority; it was that the majority would impose a stagnation of custom.
  *   **Arrow's Criteria:** Focus on consistency and fairness of the *count*.
  *   **Mill's Criteria:** Focus on the *output quality* of the legislature.
  *   **The Defense:** Mill would argue that IIA (Independence of Irrelevant Alternatives) is actually undesirable in a deliberative body. If a fringe candidate drops out, their voters' second choices *should* matter. The fact that STV allows the elimination of a candidate to change the winner between two others isn't a bug; it's a feature of coalition dynamics. It reflects the shifting landscape of political alliances. Mill would say Arrow is modeling a vending machine, while Mill is modeling a parliament.

  ### Summary of Mill's Position
  If confronted with Arrow, Mill's best move is the **Sen/Utilitarian Rejection**:

  1.  **Reject the Data Type:** Arrow assumes ordinal preferences; Mill operates on cardinal, comparable utility. Arrow's theorem is irrelevant to Utilitarian calculus.
  2.  **Reject the Goal:** Arrow seeks procedural fairness; Mill seeks epistemic competence. STV is justified by its output (a representative, deliberative assembly), not its mathematical purity.
  3.  **Accept the Cost:** To maintain this, Mill must commit to **strong epistocracy**. He must insist that we *can* and *should* measure citizen competence and weight their political power accordingly.

  ### Where Mill Gets Stuck
  The place where Mill would squirm isn't the math; it's the **measurement problem**.
  Even if Arrow's theorem doesn't apply to cardinal utility, the *information problem* does. How do you actually measure "higher pleasures" or "competence" without corruption or bias?
  *   Arrow's theorem is often seen as a proof that there is no perfect *mechanism*.
  *   Mill's system requires a perfect *judge* (to weight the votes/utility).

  Mill would likely argue that while imperfect, an educated electorate with weighted voting and STV is a better heuristic for finding the truth than a "one person, one vote" system that mathematically guarantees the tyranny of the median voter.

  **The Verdict:** Mill doesn't shrug. He rejects the ontology of the theorem. He wins the theoretical argument by refusing to play Arrow's game (ordinal aggregation), but he loses the modern liberal consensus by insisting that political equality is incompatible with true utility maximization. He saves STV, but he sacrifices the idea that all citizens are political equals. Given his writings, he would make that trade without blinking.
