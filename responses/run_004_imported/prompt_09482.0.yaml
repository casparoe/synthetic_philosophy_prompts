  **Justification**

  For the visual and poetic arts, Schopenhauer establishes a hierarchy based on the "grades of the objectification of the Will" revealed by each art form (§51). Architecture is lowest because it reveals only the lowest forces (gravity, rigidity, light). Landscape gardening and painting reveal the Ideas of vegetable nature. Animal sculpture and painting reveal the Ideas of animal nature. The idealized human figure reveals the Idea of humanity, the highest grade of the Will visible in the world. Poetry ranks above the plastic arts because it uses concepts to stimulate the imagination to perceive Ideas more freely; within poetry, tragedy is the summit because it portrays the conflict of the Will with itself and leads to resignation.

  For the musical forms, the ranking depends on how purely the music acts as a direct copy of the Will rather than a copy of phenomena or concepts (§52). Tone-painting is lowest because it degrades music by attempting to imitate natural phenomena (the world as Representation), denying its essence. The opera aria is next because binding music tightly to text subordinates it to concepts, limiting its universal language of the Will. The simple melody is higher because it is pure from external constraints, capturing the "story of the will," but it is less complete than the symphonic texture. Schopenhauer analogizes the bass to inorganic nature, harmony to plant and animal life, and melody to human intellect; therefore, the full symphonic texture fulfills music's role most completely by analogically representing the entire hierarchy of the Will's objectification within the direct copy of the Will itself.
