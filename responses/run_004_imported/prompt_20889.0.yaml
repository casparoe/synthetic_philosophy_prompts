  ### **Notes for the Novel Scene**

  If you want to make the scene feel extra authentic, here are a few "TA-isms" embedded in the grading above that you can have your character think or do:

  1.  **The "Stop" Margin Note:** TAs often write "STOP" or "???" in the margin when a student goes off the rails. It signifies the point where the grader stopped giving benefit of the doubt.
  2.  **Specific Citation Shaming:** Notice the comment "See Chang 2002." TAs love to cite the specific reading the student clearly didn't digest.
  3.  **The "Common Currency" Pet Peeve:** Philosophy TAs hate when students reduce "incommensurability" to "no common currency like money." It's a simplification that drives them nuts. Your character might sigh at that specific sentence.
  4.  **The Grade Inflation/Deflation Tension:** A 15/20 (B-) is a "strict but fair" grade. A burnt-out TA might be tempted to just give a 17/20 to avoid the student complaining, but a *conscientious* burnt-out TA knows this distinction is crucial for the final exam, so they grade hard now to save pain later.
