answer: |-
  The story of your grandmother's bangle encapsulates one of the most persistent puzzles in the philosophy of language. When you were told that "jade" refers to two distinct minerals—jadeite and nephrite—you stumbled upon a case that has troubled semantic externalists for decades. Saul Kripke and Hilary Putnam revolutionized our understanding of language by arguing that natural-kind terms like "water" or "gold" are rigid designators: they refer to the same underlying substance in every possible world, fixed by an initial baptism of samples. On this view, the statement "water is H2O" is a necessary truth, known only a posteriori. But "jade" complicates this picture. It appears to function like a natural-kind term, yet it lacks a unitary microstructural essence.

  This essay argues that the case of jade does not falsify the Kripke–Putnam framework, but it does force a revision of the metaphysical assumptions often bundled with it. Specifically, we must reject the heuristic that a natural kind must correspond to a *single* microstructural property. By engaging with Joseph LaPorte's proposal regarding disjunctive kinds, I will defend the verdict that a statement such as "this bangle is jade" can indeed express a necessary a posteriori truth. The Kripke–Putnam picture survives, provided we accept that the "essence" rigidly designated by a term can be disjunctive.

  To understand the threat jade poses, we must first recall the core of the Kripke–Putnam account. In *Naming and Necessity* and "The Meaning of 'Meaning'," Kripke and Putnam argue that the reference of a natural-kind term is not fixed by a description of observable properties (e.g., "green, hard stone"), but by a causal link to actual samples. The semantic content of the term includes a tacit indexical component: "whatever shares the same underlying nature as *this* sample." For water, that nature is molecular structure (H2O). Because identity statements between rigid designators are necessary, if water is H2O in the actual world, it is H2O in all possible worlds.

  Jade seems to break the link between "same kind" and "same underlying nature." When 19th-century mineralogists distinguished jadeite (a pyroxene) from nephrite (an amphibole), they discovered that the samples originally baptized as "jade" fell into two chemically distinct categories. If the Kripke–Putnam model requires a *unique* hidden structure to ground reference, then "jade" fails to be a natural-kind term. If it is not a natural-kind term, then "this bangle is jade" is likely a contingent truth based on macroscopic properties, vulnerable to change in other possible worlds where a different mineral mimics jade's appearance.

  However, declaring "jade" a non-natural kind merely to save the theory is an ad hoc retreat. It ignores the fact that "jade" behaves linguistically exactly like "water." We do not treat a piece of green glass as jade, even if it matches the macroscopic description; we demand it be the right "stuff." The intuition that "jade" tracks an objective division in nature remains strong, even if that division is not monolithic.

  This is where the work of philosopher Joseph LaPorte becomes crucial. In *Natural Kinds and Conceptual Change*, LaPorte addresses the jade case directly. He argues that the Kripke–Putnam framework does not strictly require a *monistic* essence. LaPorte suggests that we can accommodate jade by accepting that some natural-kind terms rigidly designate **disjunctive kinds**. On this view, the term "jade" was baptized on a set of samples. Scientific investigation revealed that the "same kind" relation holding between these samples was not transitive in the way we expected; rather, the samples fell into two distinct microstructural classes. Consequently, the extension of "jade" is fixed as the union of these two classes.

  LaPorte's proposal allows us to maintain that "jade" is a rigid designator. In the actual world, "jade" picks out the disjunction: Jadeite $\lor$ Nephrite. Because rigid designators refer to the same extension in all possible worlds, "jade" refers to (Jadeite $\lor$ Nephrite) in every possible world. It does not pick out any other green stone, even one macroscopically indistinguishable, if that stone lacks the specific microstructure of either jadeite or nephrite.

  Critics often object that disjunctive properties are not genuine essences. They argue that a "kind" defined by "A or B" is gerrymandered and lacks the projectible power of a true natural kind (e.g., we cannot predict new properties of "jade" as reliably as we can for "gold"). While this metaphysical worry has merit regarding the *utility* of the kind, it does not undermine the *semantics* of rigid designation. The Kripke–Putnam thesis is primarily about how reference is fixed, not about the ultimate taxonomy of the periodic table. If the linguistic community intends to track the objective basis of the paradigm samples, and that basis turns out to be two distinct minerals, the reference is fixed to those two minerals. The "essence" is simply the property of being either one or the other.

  Accepting LaPorte's repair leads to a definite verdict on your bangle. If your bangle is composed of nephrite, then the statement "this bangle is jade" expresses a necessary a posteriori truth. It is a posteriori because we required empirical investigation (the gemologist's appraisal) to determine that nephrite falls under the extension of "jade." It is necessary because, given that "jade" rigidly designates the disjunction (Jadeite $\lor$ Nephrite), there is no possible world in which your nephrite bangle exists but is not jade. To imagine a world where the bangle is not jade, you would have to imagine a world where it is not nephrite (or jadeite). But if it is not nephrite, it is not *that* bangle (assuming constitution is essential to the object).

  Some might object that this renders "jade" unlike "water." Water has a unified essence; jade does not. This is correct, but it is a discovery about the world, not a failure of the theory. The Kripke–Putnam picture holds that language latches onto the structure of reality. If reality presents us with a kind that is microstructurally heterogeneous but functionally unified, our language can rigidly designate that heterogeneity. The attraction of the Kripke–Putnam picture was never that nature is simple, but that meaning is not merely in the head. The jade case reinforces externalism: the meaning of "jade" was not determined by the 18th-century concept (which was vague), but by the actual mineral composition of the stones, even if that composition turned out to be dual.

  Therefore, the jade case is not a counterexample to the thesis that natural-kind terms are rigid designators. It is only a counterexample to the auxiliary assumption that natural kinds must possess a *unitary* microstructure. By adopting LaPorte's view of disjunctive kinds, we preserve the core insight: reference is fixed by the actual world's ontology, not by our descriptions.

  In conclusion, your grandmother's bangle does not shatter the Kripke–Putnam framework; it merely refines it. We need not surrender the idea that "this bangle is jade" is a necessary truth. It is necessary because the term "jade" rigidly anchors to the specific mineralogical realities of our world—jadeite and nephrite—and nothing else. The discovery that these two minerals are distinct does not break the semantic chain; it simply reveals that the chain links to a disjunction. The theory is repaired not by denying jade's status, but by acknowledging that nature's joints are sometimes more complex than our initial concepts suggest. "Jade" remains a rigid designator, and its essence, though disjunctive, is just as real as the single essence of water.
