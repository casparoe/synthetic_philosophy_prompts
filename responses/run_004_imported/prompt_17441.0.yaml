      *   *Why it matters for your book:* In rigorous decision theory, "Risk" (vNM) and "Uncertainty/Ambiguity" (Savage/SEU) are distinct. The classmate's answer is "intro course correct" but "textbook imprecise." For your book, you should refer to the **Sure Thing Principle** when discussing Ellsberg/SEU, and **Independence** when discussing Allais/vNM.

