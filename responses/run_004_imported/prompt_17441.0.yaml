  Since you mentioned your editor wants more decision theory:
  1.  **Ambiguity vs. Risk:** Ensure you keep these distinct. Ellsberg = Ambiguity (unknown odds). Allais = Risk (known odds, weird preferences).
  2.  **Models:** Maxmin Expected Utility (Gilboa-Schmeidler) is the standard fix for Ellsberg. Prospect Theory (Kahneman-Tversky) is the standard fix for Allais. Do not merge them.
  3.  **Terminology:** When discussing "Subjective Expected Utility," refer to **Savage's Axioms** (specifically the Sure Thing Principle), not vNM.

