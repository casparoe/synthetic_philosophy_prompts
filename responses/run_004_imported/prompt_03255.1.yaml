answer: |-
  This is one of the most formidable objections to supervaluationism, often associated with Timothy Williamson, Roy Sorensen, and Nicholas Jones. To construct the strongest version of this argument, we must focus on the tension between the **formal semantics** supervaluationism employs and the **phenomenon of vagueness** it attempts to describe.

  The core of the argument is that supervaluationism attempts to model vagueness using classical model theory, but classical model theory is precise. Therefore, any vagueness in the object language must be purchased at the cost of precision in the meta-language. When you try to make the meta-language vague to match the object language, you trigger a regress. When you accept the precision of the meta-language, you collapse into epistemicism.

  Here is the strongest formulation of the argument that supervaluationism cannot coherently handle higher-order vagueness without collapsing into epistemicism or vicious regress.

  ***

  ### The Argument from the Precision of Admissibility

  **1. The Supervaluationist Definition of Truth**
  Supervaluationism defines truth (supertruth) relative to a set of "admissible precisifications." A sentence $P$ is supertrue if and only if $P$ is true on *all* admissible precisifications. A sentence is borderline if it is true on some admissible precisifications and false on others.
  To make this work, the theory relies on a set $A$, where $A$ is the set of all admissible precisifications.

  **2. The Requirement of a Sharp Boundary for $A$**
  In the classical model theory used by Fine and Keefe, the set $A$ must be well-defined. For any candidate precisification $p$, it must be a determinate fact whether $p \in A$ or $p \notin A$. If it were vague whether a precisification is admissible, the truth conditions for the object language would themselves be vague, and the supervaluationist semantics would fail to assign definite truth values (even supertruth values).
  Therefore, there is a sharp boundary between the admissible precisifications (those that respect the usage of "bald") and the inadmissible ones (those that count a clearly hairy person as bald).

  **3. The Reintroduction of Sharp Cut-offs (The Epistemicist Collapse)**
  Consider a sorites series of men ranging from fully hairy to completely bald.
  *   On some admissible precisifications, man $n$ is bald; on others, he is not. This makes $n$ borderline.
  *   On *all* admissible precisifications, man $n+1$ is bald. This makes $n+1$ definitely bald.
  *   Because the set $A$ is sharp (from Premise 2), there must be a specific pair of men, $k$ and $k+1$, such that $k$ is in the borderline region (true on some $p \in A$, false on others) and $k+1$ is in the definitely bald region (true on all $p \in A$).
  *   Consequently, there is a sharp boundary between the "borderline" cases and the "definitely" cases.
  *   **Implication:** This is functionally equivalent to epistemicism. The epistemicist says there is a sharp boundary between the bald and the non-bald that we cannot know. The supervaluationist says there is a sharp boundary between the *definitely bald* and the *borderline bald* that is fixed by the sharp limits of admissibility. In both views, there is a fact of the matter about where the cutoff lies; the supervaluationist has merely moved the cutoff from the first-order predicate to the "definitely" operator.

  **4. The Attempted Escape: Vague Admissibility**
  The supervaluationist might object: "The set of admissible precisifications $A$ is itself vague. There is no sharp line between admissible and inadmissible precisifications."
  *   **The Regress Problem:** If the boundary of $A$ is vague, we cannot use standard classical model theory to define truth, because classical sets have sharp membership conditions. To model the vagueness of $A$, we need a *meta-semantics*.
  *   This meta-semantics will likely be another supervaluationism (a "super-supervaluationism") that quantifies over sets of sets of precisifications.
  *   However, for this meta-semantics to work, the boundary of *this* higher-order set must be sharp. If it is also vague, we require a meta-meta-semantics.
  *   **Implication:** This triggers a vicious regress. At every level $n$, to explain the vagueness of level $n-1$, you must posit a precise boundary at level $n$. If you never posit a precise boundary, you never generate truth conditions. If you do posit a precise boundary at some level $N$, you have accepted epistemicism at level $N$.

  **5. The Iteration of the 'Definitely' Operator (Williamson's Logic)**
  Let $D$ be the "Definitely" operator. $DP$ is true iff $P$ is true on all admissible precisifications.
  Supervaluationism validates the logic of $D$ such that $DP \to P$ and $D(P \to Q) \to (DP \to DQ)$.
  *   Consider the iteration: $P, DP, DDP, DDDP \dots$
  *   Eventually, for a borderline case, $D^n P$ must become false. There must be some number $n$ where $D^n P$ is true (it is definitely... definitely $P$) but $D^{n+1} P$ is false.
  *   Because the supervaluationist semantics relies on classical logic at the meta-level, there must be a **last number** $n$ for which $D^n P$ is supertrue.
  *   This implies a sharp boundary in the hierarchy of higher-order vagueness. There is a fact of the matter about exactly how many "definitely" operators can be prefixed to a proposition before it becomes false.
  *   **Implication:** This is an unknowable, brute cutoff regarding the degree of definiteness. This is precisely the kind of "brute fact" the supervaluationist accused the epistemicist of positing.

  ### Conclusion: The Dilemma

  The supervaluationist is trapped in a dilemma regarding higher-order vagueness:

  1.  **Accept Precision at the Meta-Level:** If the set of admissible precisifications is precise (as required to do the semantics), then there is a sharp boundary between "admissible" and "inadmissible." This entails a sharp boundary between "borderline" and "definitely." This collapses supervaluationism into a form of **epistemicism about admissibility**. You have replaced unknowable cutoffs for "bald" with unknowable cutoffs for "admissible precisification."
  2.  **Accept Vagueness at the Meta-Level:** If the set of admissible precisifications is vague, the semantics cannot be defined without a higher-order semantics. This leads to an **infinite regress** of meta-languages, preventing the theory from ever actually assigning truth conditions.

  Therefore, supervaluationism does not eliminate sharp boundaries; it merely relocates them to the meta-language. It fails to respect the intuition that there is "no fact of the matter" in a robust sense, because the theory itself requires a fact of the matter about which precisifications are admissible. Your friend is correct: without a coherent account of higher-order vagueness, supervaluationism is either epistemicism in disguise or semantically incomplete.
