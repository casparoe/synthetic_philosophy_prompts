answer: |-
  The pain in my chest is a dull, rhythmic thudding, a metronome counting down the remaining measures of a song I know by heart. The doctors call it acute cardiac degradation caused by the scanner's retention field. I call it the price of the glitch. They told me I have three days, maybe four. They told me this while gesturing to the screen on the wall, where a man who looks exactly like me is currently unpacking boxes in a hab-unit on Mars.

  His name is Elias. My name is Elias.

  The room on Earth smells of antiseptic and stale recycled air. The room on Mars, visible in high-definition 4K, is bathed in the dusty, rose-gold light of a Martian afternoon. I watch him on the tablet propped on my tray table. He moves with a vigor I haven't felt in years. He stretches his arms above his head, and I feel a phantom pull in my own shoulders, a ghost of a movement my body is too broken to mimic.

  This is the Branch-Line. That's what the seminar leaders called it in the brochures I signed. A divergence. For a few days, the stream of consciousness splits. One flows into a future; the other pools here, stagnant, draining away.

  " He's asking for you," the nurse says, entering the room. She doesn't look at me; she looks at the screen. It's easier for them to address him as the primary. He is the one who will file the taxes, finish the novel, visit the grave.

  "Patch him through," I say. My voice sounds like gravel in a mixer.

  The screen flickers. The image of the hab-unit dissolves into a close-up of a face. My face. But it isn't. The skin is clearer. The eyes lack the bloodshot fatigue of a man who knows he is ending. He is sitting in a chair that looks ergonomically perfect, leaning forward, hands clasped.

  "Elias," he says.

   Hearing my own voice come from a speaker is a violation. It's not an echo; it's a theft. "You made it," I say.

  "The transition was smooth. Woke up feeling... lighter." He hesitates. He knows the protocol. He knows I am the original, the source code that was supposed to be deleted. He knows I am the mistake that wasn't. "How are you holding up?"

  "I'm dying," I say. There is no point in euphemism. We share the same memories up to the moment of the scan. He remembers the fear of stepping into the booth. He remembers the flash. He also remembers the sudden realization on the Mars side that the destruction beam failed to fire on the Earth side. We both remember the shock of seeing two medical teams scrambling.

  "I know," he says. He looks down at his hands. They are my hands, but they are resting on a table that exists fourteen million miles away. "I can come back. The corporation said they could arrange a return shuttle for the... for the remains. To be with you."

  "No," I say too quickly. The effort makes my heart stutter. I wait for the pain to subside. "No, you stay there. You have the tenure track. You have the apartment lease. You have Sarah."

  Sarah. The memory hits us both simultaneously. I can see it in the micro-twitch of his eyebrow. We both remember the way she smells like rain on hot pavement. We both remember the argument we had the morning of the scan about whether to buy a house.

  "She thinks I'm on Mars," he says quietly. "She thinks I'm you."

  "She thinks you're us," I correct him.

  This is the knot that tightens in my gut more than the failing muscle. Parfit's arguments were abstract in the seminar hall. *Relation R.* Psychological continuity. What matters is not identity, but survival. But lying here, feeling the cold creep up my legs, identity feels like the only thing I have left to lose. If he lives, do I survive? Or am I merely a shell that produced a seed?

  "I dreamt last night," he says. "About the cabin in Vermont. But in the dream, I was watching myself from the porch. I was the one on the porch, watching the one by the fire. And I knew the one by the fire was going to burn."

  I grip the sheets. "That's just residual processing. Neural static."

  "It felt like a warning," he says. He leans closer to the camera. The intimacy is unbearable. It is like looking into a mirror that has gained sentience and pity. "Elias, when you... when the end comes. Do you want me to stop? Do you want me to cease?"

  The question hangs in the sterile air. If he ceases, then the project fails. The investment is lost. But if he continues, then I am truly obsolete.

  "I want you to finish the book," I say.

  "That's not what I asked."

  I look at the screen. I look at the man who has my memories, my wit, my love for Sarah, my fear of death. But he does not have my pain. He does not have the specific, terrifying knowledge of non-existence that comes from watching your own heart monitor flatline in real-time. He is the continuation, but he is not the container.

  "We aren't the same person anymore," I say. It is the first time I've admitted it aloud. "The scan was the last moment we were one thing. Now, you're the version that goes forward. I'm the version that stays."

  "But I remember being you," he insists. "Right now. I remember this conversation from my side. I feel the guilt. I feel the sorrow."

  "You feel the memory of sorrow," I say. "I feel the sorrow."

  He is silent for a long time. The lag in the transmission is negligible, yet there is a delay, a gap where our futures are diverging further with every second. On Mars, the sun is setting. In the hospital, the artificial lights hum.

  "I told Sarah I love her," he says. "This morning. Over breakfast."

  My chest tightens, a spasm that makes me gasp. "I haven't told her in three days."

  "I know."

  "Does it count?" I ask. The question is small, pathetic. "If you tell her, did I tell her?"

  He looks at me, and for a moment, the health in his face seems like a mask. He looks terrified. He realizes that he is not a savior; he is a usurper. He is living a life that was purchased with my extinction, an extinction that failed to complete.

  "I don't know," he says. "But she smiled. And I felt... I felt the relief I know you've been looking for."

  I close my eyes. The philosophical stakes dissolve. It doesn't matter if we are numerically identical. It doesn't matter if identity is transitive. What matters is that the fear I carried for ten years—the fear that my love would vanish with my breath—has been offloaded. I am not surviving. I am not dying in the traditional sense. I am being inherited.

  "Take care of her," I whisper.

  "I will. I am you. I will."

  "No," I say, opening my eyes one last time to look at him. "You are the one who gets to be me now. I'm just the one who made it possible."

  The connection begins to fade. The bandwidth is being throttled; the corporation doesn't want the dying original consuming resources meant for the productive duplicate. The image of him pixelates. His mouth moves, forming words I can't hear, perhaps a goodbye, perhaps an apology.

  The screen goes black.

  The room is silent again, save for the metronome of my heart. It is slower now. I look at my hands. They are pale, still. I think of Mars. I think of the dust, the red sky, the woman who thinks her husband has arrived safely.

  I am not going to Mars. I will never feel that gravity. But when he wakes up tomorrow, he will remember this room. He will remember the taste of the bitter medicine I am swallowing now. He will carry my death inside him as a memory of a pain he did not physically feel.

  Is that survival? To live on as a ghost in the machine of another man who thinks he is you?

  I close my eyes. The darkness isn't empty. It is full of him. And for the first time, I cannot tell if I am the one dying, or if I am the one being born, finally, into something that doesn't need a body to endure. The monitor beeps. I do not answer. I let him speak for me.
