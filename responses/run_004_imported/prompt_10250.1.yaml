      *   **Revisionist View (McMahan, Rodin, etc.):** *Jus ad bellum* and *jus in bello* are linked. If the war is unjust, the killing is generally unjustified (unless specific exceptions apply). Aggressor soldiers are not moral equals to defender soldiers.
