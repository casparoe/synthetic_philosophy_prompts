answer: |-
  This is one of the profound questions at the heart of military ethics and political philosophy. You are grappling with a tension that has divided thinkers for centuries: the relationship between the justice of the war (*jus ad bellum*) and the justice of conduct within the war (*jus in bello*).

  Your grandfather's view represents the **Traditional View** of Just War Theory, while your hesitation aligns with the **Revisionist View**. Both offer coherent frameworks, but they prioritize different moral values. To find peace with this, it helps to distinguish between whether the *act* was objectively justified and whether your grandfather is personally *blameworthy*.

  Here is a way to think through the two sides of this dilemma.

  ### 1. The Traditional View: The Moral Equality of Combatants
  Your grandfather's intuition that he and the enemy soldier were "moral equals" is the foundation of international humanitarian law. This view, famously articulated by philosopher Michael Walzer, argues for the **Independence Thesis**.

  *   **The Argument:** *Jus ad bellum* (the right to go to war) and *jus in bello* (right conduct in war) are separate. A soldier's moral standing depends only on how they fight, not on why they fight.
  *   **The Reasoning:** Soldiers are instruments of the state. They do not have the capacity, information, or authority to judge the geopolitical decisions of their leaders. If we tell soldiers that fighting for an unjust cause makes them murderers, two dangerous things happen:
      1.  Soldiers on the "unjust" side may feel they have nothing to lose and abandon the rules of war entirely.
      2.  Soldiers become judges of national policy, potentially undermining the sovereignty of states.
  *   **The Conclusion:** Under this view, your grandfather is correct. As long as he followed the rules (no civilians, no torture, uniformed combatants), he is a legitimate combatant. He and the enemy soldier are moral equals because both are "dangerous others" licensed by their respective states to kill each other.

  ### 2. The Revisionist View: The Asymmetry Thesis
  Your unease—that an unjust cause must taint the killing done in its name—is the core of Revisionist Just War Theory, championed by philosophers like Jeff McMahan.

  *   **The Argument:** *Jus ad bellum* and *jus in bello* are linked. You cannot have a right to kill in war unless you are fighting for a just cause.
  *   **The Reasoning:** In ordinary life, if you try to attack me unjustly, I have a right to stop you (self-defense). You do not have a right to kill me to prevent me from stopping you. Revisionists argue war is just scaled-up self-defense. The defender is justified in killing the aggressor to stop the invasion. The aggressor, however, is posing an unjust threat. Therefore, they are not moral equals.
  *   **The Conclusion:** Under this view, your grandfather's claim to "equal moral footing" is objectively false. The soldier defending his homeland had a justification for shooting; your grandfather, fighting for an aggressive war, did not. The killing he participated in served an unjust end, which casts a shadow over the acts themselves, regardless of how "cleanly" they were performed.

  ### 3. Bridging the Gap: Justification vs. Excuse
  This is where you can resolve the conflict between respecting your grandfather and acknowledging the injustice of the war. We must distinguish between **justifying the act** and **excusing the agent.**

  *   **Justification:** Was the act of shooting morally permissible?
      *   The Revisionist view suggests **no**. If the war was aggressive, the threat he posed was unjust. Therefore, the enemy soldier was justified in shooting him, but he was not truly justified in shooting the enemy (except perhaps in immediate self-defense against a specific threat).
  *   **Excuse:** Is the *person* blameworthy for the act?
      *   Here, the Traditional view offers crucial mercy. Even if the act was objectively unjust, your grandfather may be fully **excused**.

  There are three major mitigating factors that likely apply to your grandfather, which preserve his moral character even if the war was unjust:

  1.  **Invincible Ignorance:** You mentioned he was "barely out of school." In the fog of propaganda and nationalism, ordinary citizens often cannot know the true nature of their government's foreign policy. If he genuinely believed he was defending his home or had no way of knowing the war was aggressive, his culpability is drastically reduced.
  2.  **Coercion and Conscription:** He did not choose to be there. He was conscripted. Refusal often meant imprisonment or execution. Acting under duress is a classic moral excuse. He was trapped in a system where all options were bad.
  3.  **The "Clean Hands" Problem:** If he had refused to fight, someone else would have taken his place. That replacement might not have been as scrupulous about avoiding civilians or mistreating prisoners. By staying and adhering to *jus in bello*, he may have reduced the overall suffering of the war, even if he shouldn't have been there in the first place.

  ### 4. A Coherent Synthesis
  So, how do you decide if they were moral equals?

  **Objectively, regarding the act:** They were likely **not** equals. The soldier defending against invasion had a stronger moral claim to the use of force. The justice of the cause does matter. Your grandfather's side was inflicting harm that should not have been inflicted.

  **Subjectively, regarding the man:** They may well have been **equals** in terms of blameworthiness. Your grandfather maintained his humanity in a dehumanizing system. He drew a line at harming the vulnerable. He recognized the shared humanity of the enemy soldier ("young men... trying to do to me exactly what I was trying to do to them").

  ### Conclusion
  You do not have to choose between "My grandfather was innocent" and "The war was criminal." You can hold both.

  The war was a tragedy orchestrated by leaders who bear the primary moral burden. Your grandfather was a participant, but he was a **reluctant and restrained participant**. He was a moral agent doing the best he could within an immoral structure.

  When he said he was on the "same moral footing," he was likely speaking to the shared tragedy of the trench: two young men, neither of whom wanted the conflict, forced to try to kill each other by distant powers. That is a profound human truth, even if it isn't a strict philosophical one.

  You can honor his memory by acknowledging that while the cause may have been wrong, **he tried to keep his own conduct right.** That distinction is the only control a conscript has, and the fact that he clung to it suggests that his conscience remained intact, even if his government's did not.
