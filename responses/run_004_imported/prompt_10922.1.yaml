      *   **Normativist (e.g., Wakefield, Engelhardt, or general social constructionist):** Disease implies "bad" or "harmful." Calling something a disorder says society thinks you *should* be over it by now. It pathologizes normal human variation.
          *   *Challenge with PGD:* If grief disables someone completely, isn't that harmful regardless of values? If we don't label it, do people suffer without treatment?

  3.  **Drafting - Section by Section:**

