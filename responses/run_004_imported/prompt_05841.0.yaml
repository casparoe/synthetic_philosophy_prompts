answer: |-
  **Setting:** *A sterile Senate subcommittee hearing room. The Chair has just recognized the witnesses. The bill on the table proposes increased funding for border walls and expedited deportation protocols. None of the affected migrants are present.*

  **1. Chair:** The committee will come to order. Professor Sterling, you represent the Coalition for Sovereign Democracy. You have the floor.

  **2. Sterling:** Thank you. Democracy is self-government. But 'self' implies a boundary. If a community cannot decide who belongs to it, it cannot decide anything else. This bill affirms our right to maintain the integrity of the 'we' that makes democratic decisions. We are not harming outsiders; we are simply preserving the association that allows us to care for insiders.

  **3. Rosales:** Thank you, Chair. Professor Sterling argues for a 'we' that decides its own membership. But look around this room. The people most affected by this bill—the ones turned away at the line, the ones deported—are not here. They have no vote. If democracy means rule by the coerced, and your border policies coerce them with force, then excluding them from this vote is tyranny.

  **4. Sterling:** With respect, Dr. Rosales, turning someone away is not coercion. It's non-facilitation. If I own a house and I don't invite you in, I haven't coerced you. I've just refused to facilitate your plan to sleep in my living room. A state is similar. It's a club managing shared resources.

  **5. Rosales:** A private club doesn't patrol its perimeter with armed guards, drones, and biometric scanners. When your 'club' stops someone, it points guns at them. When it deport them, it physically restrains them and moves them against their will. That isn't 'not facilitating'; that is active physical force. How do you justify imposing force on people who had no say in the rules?

  **6. Sterling:** The force is defensive, not aggressive. It protects the jurisdiction where our laws apply. If you walk onto my property without consent, I am entitled to remove you. The coercion isn't in the removal; it's in the trespass. The border guard isn't threatening you; he's enforcing the boundary that makes our democracy possible.

  **7. Rosales:** But who drew the line around the property? You say the trespass is the problem, but the trespass only exists because you drew a line around resources people need to survive. You're using force to maintain a monopoly on safety and wealth. If I lock the only water source in the desert and point a gun at anyone who approaches, don't call it 'defensive property rights.' It's coercion over life chances.

  **8. Sterling:** We didn't create the desert, and we didn't create their need. We created the surplus. The state's primary obligation is to its own citizens—the people who fund it and abide by its laws. Using force to protect the surplus that funds our schools and hospitals isn't tyranny; it's fiduciary duty. We can't dissolve the container just because others want what's inside.

  **9. Rosales:** You say you didn't create their need, but your trade policies and historical interventions often did. Regardless, if you claim democracy legitimizes this force, you're begging the question. You're saying 'we decide who decides.' If the boundary itself is enforced by violence, the legitimacy of everything inside that boundary rests on that initial violence.

  **10. Sterling:** Not violence—authority. Every legal system rests on a monopoly of force. Inside our border, we coerce citizens to pay taxes. We don't ask them if they want to be coerced; we say membership entails obligation. Outside the border, the force simply says 'not yet a member.' It's a threshold, not a prison.

  **11. Rosales:** It's a prison if you can't leave your situation without crossing it. But let's talk about deportation. That's not a threshold. That's grabbing someone who has built a life here and physically removing them. That is subjecting them to your power without granting them the protection of your laws. That is the definition of domination.

  **12. Sterling:** Deportation is remedial. It restores the status quo ante. They entered outside the channel the 'people' authorized. If we allow anyone subjected to enforcement to vote on enforcement, no state can ever enforce any law. A speeder could vote on speed limits. A tax evader could vote on tax rates.

  **13. Rosales:** A speeder is already a member of the polity. They have representation. These people are being subjected to power *without* representation. That's 'taxation without representation' literally applied to bodies. You're saying democracy requires exclusion, but I'm saying democracy dies where exclusion begins.

  **14. Sterling:** Democracy dies where there is no 'demos.' If we accept your view, the boundary becomes porous, trust erodes, and the solidarity needed for redistribution collapses. We become a hotel, not a home. You can't have social justice if you don't have a society to deliver it.

  **15. Rosales:** So social justice for some requires injustice for others? That's a moral cost you're willing to pay, but don't call it democratic principle. Call it privilege. You're admitting that your democracy functions only because you externalize the coercion to the border.

  **16. Sterling:** I'm admitting that democracy is local. It requires a specific group of people committed to each other. There is no global demos. If you demand we include everyone we coerce, you demand a world state. Until that exists, nation-states are the only vehicle for freedom we have.

  **17. Rosales:** Then our freedom is built on their unfreedom. That might be realpolitik, Professor, but it's not democratic theory. It's just power claiming a moral mask. If we can't justify the boundary to those outside it, we don't own it; we just hold it.

  **18. Sterling:** We own it because we sustain it. We maintain the institutions, the courts, the norms. Outsiders don't sustain this system. Why should they get to veto the rules of a game they don't play?

  **19. Rosales:** Because when you change the rules of the game, you change the board they're standing on. You're moving the walls, and the dust is choking them. You can't claim democratic legitimacy while silencing the voices of those your democracy pushes away.

  **20. Sterling:** And you can't claim democratic viability without a boundary to define the voice. We are at an impasse, Doctor. You want a democracy without borders. I want borders that make democracy possible. The committee must decide which risk is greater.
