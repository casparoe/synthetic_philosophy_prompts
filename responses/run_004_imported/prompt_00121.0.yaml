prompt: |-
  I'm taking a course on ethical theory this semester, and something from my own life has been bothering me in a way I can't quite untangle using what we've discussed so far. My housemate and I both have the habit of leaving the stove on low while we step away to answer texts. Last week she did this and a frayed extension cord happened to be sitting nearby, which caught fire and caused some real damage; I've done the exact same thing dozens of times without any consequence at all. Now our friends treat her as careless and irresponsible, while I get a pass, even though our actions and level of attentiveness were identical. It seems unfair that the outcome, rather than what we actually controlled, is driving how much blame we each receive, but I'm not sure how to defend that intuition. Is there a solid philosophical basis for insisting that blame should track only what an agent controls, or is it actually reasonable for outcomes beyond our control to affect how blameworthy we are?
