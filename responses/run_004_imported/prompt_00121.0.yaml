      *   Specifically, it's **Resultant Luck** (luck in the way one's actions turn out).
      *   The tension is between the **Control Principle** (we are only responsible for what we control) and our intuitive practices of blame/praise which often depend on outcomes.

  3.  **Map Out the Philosophical Landscape:**
