answer: |-
  You have stumbled directly onto one of the most famous and persistent problems in modern moral philosophy. What you are describing is the problem of **Moral Luck**, specifically a sub-category known as **Resultant Luck**.

  Your intuition that it is unfair to be judged on outcomes you didn't control aligns with what philosophers call the **Control Principle**. However, the way your friends are reacting aligns with how human societies (and legal systems) actually function.

  Here is a breakdown of the philosophical landscape regarding your situation, which should help you untangle your intuition and give you material for your course.

  ### 1. The Control Principle (Defending Your Intuition)
  The strongest philosophical basis for your intuition comes from Immanuel Kant and deontological ethics. Kant argued that the only thing good without qualification is a **good will**. Moral worth must be located entirely within the agent's control.

  *   **The Argument:** If you and your housemate had the exact same mental state (intent to cook, willingness to accept the risk of leaving the stove), took the exact same action (leaving the stove on low), and exercised the exact same level of care, your **moral blameworthiness** is identical.
  *   **The Role of Luck:** The presence of the frayed extension cord was outside your housemate's control. It was "resultant luck." To blame her more than you is to say that the universe punished her for being unlucky, not for being more immoral.
  *   **Thomas Nagel:** In his seminal 1979 paper *"Moral Luck,"* Nagel highlights this paradox. He notes that we are committed to the Control Principle (we shouldn't be judged on what we can't control), yet our actual moral judgments are pervasively influenced by luck. Nagel suggests this creates a skeptical problem: if we strip away all the luck (outcomes, upbringing, circumstances), there might be nothing left of the "self" to judge at all.

  **In your course:** If you want to defend your intuition, appeal to the Control Principle. Argue that *ex-ante* (before the event), the risk imposed on the world was identical. Therefore, the moral fault is identical.

  ### 2. The Case for Outcome-Dependent Blame (Defending Your Friends)
  If the Control Principle is so logical, why do your friends (and almost everyone else) blame your housemate more? There are solid philosophical and pragmatic arguments for why outcomes matter.

  **A. Consequentialism and Harm**
  From a utilitarian or consequentialist perspective, the morality of an action is tied to its results.
  *   **The Argument:** Your housemate's action resulted in suffering, property damage, and danger. Yours did not. Therefore, her action was objectively worse in terms of utility.
  *   **Negligence:** In ethics and law, negligence is often defined not just by the risk taken, but by the **breach of duty that causes harm**. Without the harm, it is often categorized merely as a "near miss" or a bad habit, rather than a moral failure requiring restitution.

  **B. The Epistemic Argument (Knowledge)**
  Outcomes provide evidence that abstract risks do not.
  *   **The Argument:** Before the fire, the danger was theoretical. You both *thought* it was safe enough. After the fire, the danger is proven. Your friends are reacting to the **revealed reality** of the situation. The fire proved that the risk was unacceptable, whereas your dozens of successful attempts merely suggested it *might* be acceptable. Your housemate is now the bearer of bad news; she is the living proof of the danger.

  **C. Agent-Regret and Responsibility**
  Philosopher Bernard Williams argued that there is a specific kind of regret called **Agent-Regret** that only the person who caused the outcome can feel.
  *   **The Argument:** Even if you were equally careless, your housemate has a special relationship to the fire that you do not. She has to clean up the ash, pay for the damage, and live with the knowledge that *her* specific action caused *this* specific pain. Blame is not just a judgment of character; it is a social mechanism to assign **liability**. It makes sense for the person who actually broke the thing to bear the burden of fixing it, even if the other person was equally lucky to not break it.

  ### 3. Distinction: Blameworthiness vs. Blame
  A useful way to untangle this in your essays or discussions is to distinguish between two concepts:

  1.  **Blameworthiness (Internal):** A judgment of the agent's character or will. (Did they intend harm? Were they reckless?) By this metric, you and your housemate are likely equal.
  2.  **Blame/Sanction (External):** The social or legal reaction to the agent. (Punishment, ostracization, liability.) By this metric, outcomes matter.

  Your friends are conflating the two. They are treating your housemate as having a *worse character* (more careless) because she had a *worse outcome*. Philosophically, this is an error. However, socially, it is functional. We punish completed crimes more severely than attempted crimes (e.g., murder vs. attempted murder) not because the criminal intent differed, but because the social need for restitution and deterrence is higher when harm occurs.

  ### 4. How to Navigate This
  You asked if there is a solid basis for insisting blame should track only control.
  *   **Yes:** The Control Principle is foundational to the idea of fairness and justice. It is the bedrock of retributive justice (you deserve punishment only for what you chose).
  *   **But:** It is not the *only* basis for moral judgment. We also judge based on harm, risk management, and social consequences.

  **Conclusion for your reflection:**
  Your intuition is philosophically robust. You are correctly identifying that **moral luck** is influencing your friends' judgment. However, it is also "reasonable" for outcomes to affect blame if we view blame not as a metaphysical judgment of the soul, but as a practical tool for managing risk and assigning liability in a community.

  **Suggestion for your course:**
  Look up **Thomas Nagel's "Moral Luck"** and **Bernard Williams' "Moral Luck."** Also, research the legal concept of **"Attempt vs. Completion."** Your stove scenario is a perfect real-world analogy for the philosophical debate surrounding why attempted murder is punished less severely than murder, even if the intent was identical.

  You are right to feel it is unfair regarding *character judgment*, but your friends are following a standard social script regarding *liability and harm*. Recognizing that distinction is the key to untangling the knot.
