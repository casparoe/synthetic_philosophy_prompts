answer: |-
  Good evening, faculty, families, friends, and the Class of 2024.

  Tradition dictates that at this moment, I am supposed to tell you that graduation is not a destination, but a journey. I am supposed to say that there was no single moment when we stopped being children and started being adults. The usual speech tells you that change is a slow sunrise, a gradient without a line.

  It is a comforting thought. It suggests that we don't have to worry about exactly when we became responsible for our own lives, because the line is blurry.

  But tonight, I want to offer you a different perspective. A sharper one.

  For those of you who sat in Mr. Henderson's Philosophy elective, you might recognize the shape of the puzzle I'm about to describe. For everyone else, I promise to keep the jargon to a minimum.

  There is an ancient logical problem called the Sorites Paradox. It asks: If you have a heap of sand and remove one grain, it is still a heap. If you remove another, it is still a heap. But if you keep going, eventually, you have only one grain. Is that a heap? No. So, when did it stop being a heap?

  The standard answer—the comforting one—is that "heap" is a fuzzy word. There is no fact of the matter. The boundary is vague.

  But the philosopher Timothy Williamson proposed a stranger, harder solution. He argued that there *is* a sharp boundary. There is a specific number of grains where it stops being a heap. There is a precise nanosecond where a tadpole becomes a frog. And, by extension, there is an exact moment when a high school student becomes a graduate.

  The boundary exists. We just can't see it.

  This is the epistemicist view: the limit is not in the world, but in our knowledge. We cannot know where the line is drawn, because knowledge requires certainty, and we can never be certain enough to pinpoint the exact shift. But the shift happens.

  Why does this matter for us, standing here in caps and gowns?

  Because it changes how we view our responsibility. If the boundary is fuzzy, we can drift across it without noticing. We can claim we are "still figuring it out" indefinitely. But if the boundary is sharp—even if invisible—it means the transition is real. It means that at some point, perhaps while you were sleeping last Tuesday, or during third period on a Thursday, the status changed.

  You are not "becoming" graduates. You *are* graduates.

  There is a fact of the matter about who we are now, even if we cannot locate the exact second it clicked into place. This is less comforting than the idea of a gradual journey. It implies that adulthood didn't ask for our permission. It didn't wait for us to feel ready. It simply arrived, crossing a threshold we were blind to.

  But there is power in this, too.

  If the boundary is real, then our potential is not vague. We often tell ourselves, "I'm not quite a writer yet," or "I'm not quite a leader." We treat our identities like the heap of sand, assuming we need to remove a few more grains of doubt before the label fits.

  Williamson's logic suggests otherwise. You don't need to wait for the feeling of certainty to validate the reality. You don't need to see the line to have crossed it.

  To my classmates who sat through those logic units: you know that this view demands precision. It demands that we respect the truth even when it is unknowable. To the rest of my class: you know that feeling of walking across this stage. It feels like a threshold. That feeling is not an illusion.

  So, as we leave here, do not look for the moment you feel like an adult. It may never come. Do not wait for the heap of sand to look different.

  Trust that the change has already occurred. Trust that the line exists, even if you cannot trace it with your finger. We are standing on the other side of it.

  The future is uncertain. Our knowledge of what comes next is limited. But our status here, now, is a matter of fact. We have crossed the line.

  Congratulations, Class of 2024. The boundary is behind us. Let's walk forward.

  Thank you.
