prompt: |-
  I'm a software engineer, and for the past couple of years I've served on our small Elections & Governance working group -- part of the nonprofit foundation behind an open-source project I've contributed to for a long time (a few hundred regular contributors, one elected "Project Lead" seat contested every year). We currently pick the Lead by instant-runoff voting: everyone ranks the candidates, and we eliminate whoever has the fewest first-choice votes, round by round, until someone has a majority. Last cycle there were three real candidates: one who wanted to keep development slow and conservative, one pushing a fairly disruptive rewrite, and one occupying a genuine middle position that people on both sides often listed as their second choice even when she wasn't their first. That middle candidate had the fewest first-choice votes and was eliminated in round one, even though the anonymized ballots later made clear she'd have beaten either of the other two head-to-head. The rewrite candidate ended up winning, and quite a few contributors were unhappy afterward; several admitted they'd ranked only their favorite and left the rest blank, out of a vague worry that ranking everyone sincerely could somehow backfire.

  One working-group member, who has an economics background, now wants to replace instant-runoff with the Schulze method -- the pairwise, Condorcet-style method used for internal elections by Debian, Gentoo, and a few other free-software projects -- on the grounds that it would have picked the middle candidate and is generally much harder to game. Another member is dismissive, and keeps saying that Arrow's theorem already proved decades ago that no voting system can be fair, so arguing over which one we use is bikeshedding. That doesn't sound quite right to me; I'm fairly sure Arrow's theorem is about aggregating preferences into a full ranking rather than about picking a single winner. A friend of mine who works adjacent to decision theory, when I described the argument to her, said the theorem actually on point here is called Gibbard-Satterthwaite, and that as she recalled it, it applies to Schulze as well, just maybe not in quite the same way it applies to what we do now. I don't have the formal background to sort out how much of that is right, or what it should actually mean for our decision.

  I've been asked to draft the memo our working group will send to the foundation's board recommending a course of action before we'd need to lock in a bylaws amendment ahead of next year's election. Could you write that memo for me? I'd like it to explain, for an audience of programmers rather than social-choice theorists, what Gibbard-Satterthwaite actually establishes and how, if at all, it bears on the "Arrow already settled this" objection; to compare instant-runoff and Schulze honestly, including whatever we'd be giving up by switching and not just the fiasco we'd be avoiding; and to close with one specific recommendation -- keep instant-runoff, adopt Schulze outright, adopt Schulze with some added safeguard, or something else entirely -- along with a realistic timeline for bringing it to the board. A page or two, pitched at people who can read code but have never heard of a social choice function, would be ideal.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer on an Elections & Governance working group.
      *   **Context:** Nonprofit foundation behind an open-source project (few hundred contributors, one elected Project Lead).
      *   **Current System:** Instant-Runoff Voting (IRV).
      *   **Problem:** Last election, a "compromise/middle" candidate was eliminated first despite being a Condorcet winner (beats others head-to-head). The winner (disruptive rewrite candidate) caused dissatisfaction. Voters engaged in "bullet voting" (ranking only one) due to fear of tactical voting.
      *   **Proposal:** Switch to Schulze method (Condorcet method).
      *   **Objection:** One member claims Arrow's Impossibility Theorem makes the debate pointless ("no system is fair").
      *   **Expert Input:** A friend mentions Gibbard-Satterthwaite theorem applies here too.
      *   **Task:** Draft a memo to the Foundation Board recommending a course of action.
      *   **Audience:** Programmers/Board Members (technical, but not social choice theorists).
      *   **Requirements:**
          *   Explain Gibbard-Satterthwaite vs. Arrow.
          *   Compare IRV vs. Schulze honestly (pros/cons).
          *   Make a specific recommendation.
          *   Include a timeline.
          *   Length: 1-2 pages.

  2.  **Deconstruct the Theoretical Arguments:**
      *   **Arrow's Impossibility Theorem:** Applies to *ordinal* voting systems that produce a *complete social ranking* of all candidates. It states no system can satisfy a specific set of fairness criteria (non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) simultaneously.
      *   **Relevance to Election:** We are picking *one* winner, not ranking everyone. So Arrow's theorem is technically less direct, though often cited as a shorthand for "voting is hard." The objection "Arrow proved it's all pointless" is a misunderstanding/misapplication.
      *   **Gibbard-Satterthwaite Theorem:** Applies to *single-winner* selection mechanisms. It states that any deterministic voting system with 3+ candidates is either dictatorial or susceptible to tactical voting (strategic manipulation).
      *   **Relevance:** This is the correct theorem for the situation. It means *no* system is perfectly strategy-proof. However, some systems are *more* resistant or make strategy harder/less intuitive than others.
      *   **IRV vs. Schulze regarding Strategy:**
          *   IRV: Susceptible to "center squeeze" (as happened). Encourages bullet voting (don't rank a compromise lest they eliminate your favorite).
          *   Schulze: Condorcet method. Elects the pairwise winner if one exists. Generally considered more robust against tactical voting *in practice*, though theoretically manipulable per Gibbard-Satterthwaite. It handles the "compromise candidate" scenario better.

  3.  **Compare IRV and Schulze (Honest Assessment):**
      *   **IRV:**
          *   *Pros:* Simple to explain (eliminate last place), ensures winner has >50% support eventually.
          *   *Cons:* Fails Condorcet criterion (can eliminate the pairwise winner), encourages tactical truncation (bullet voting), non-monotonic (ranking a candidate higher can hurt them).
      *   **Schulze:**
          *   *Pros:* Satisfies Condorcet criterion (picks the head-to-head winner), robust against "spoiler" effects, widely used in tech (Debian, Gentoo, Wikimedia).
          *   *Cons:* Complex to explain/count manually (requires beatpaths), voters might find ranking all candidates burdensome (though required for best results), still theoretically manipulable (Gibbard-Satterthwaite).

  4.  **Formulate the Recommendation:**
      *   The prompt describes a classic "Center Squeeze" failure in IRV.
      *   The community is technical (can handle complexity).
      *   Other similar projects (Debian, Gentoo) use Schulze successfully.
      *   The "Arrow" objection is invalid fatalism.
      *   The "Gibbard-Satterthwaite" reality check is valid but doesn't mean "all systems are equal."
      *   *Recommendation:* Adopt Schulze. It fixes the specific failure mode experienced last cycle.
      *   *Safeguard?* Maybe education on how to vote sincerely. But the method itself is the main fix.
      *   *Timeline:* Need to amend bylaws before next election cycle.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the problem (last election outcome), the proposal (Schulze), and the recommendation (Switch).
      *   **Theoretical Context (The "Math" Part):** Address Arrow vs. Gibbard-Satterthwaite simply.
          *   Arrow = Ranking all candidates (not what we do).
          *   Gibbard-Satterthwaite = Picking one winner (what we do). Yes, all systems are manipulable, but some are *harder* to game. IRV failed visibly; Schulze is more robust.
      *   **System Comparison:**
          *   IRV: Good intuition, bad math (Center Squeeze, Non-monotonicity).
          *   Schulze: Harder intuition, better math (Condorcet Winner, Beatpaths). Mention Debian/Gentoo precedent.
      *   **Trade-offs:** Acknowledge Schulze is harder to explain to new contributors. Need better tooling/UI.
      *   **Recommendation & Timeline:** Switch to Schulze. Timeline: Draft amendment -> Community Comment -> Board Vote -> Implementation/Testing -> Next Election.

  6.  **Refining Tone and Content:**
      *   *Tone:* Professional, technical but accessible, decisive but acknowledging trade-offs.
      *   *Audience:* Programmers. Use analogies if helpful (e.g., "edge cases," "deterministic").
      *   *Correction:* Ensure I don't oversell Schulze. It *is* manipulable per G-S, but the manipulation is computationally harder or less intuitive for voters than IRV's "don't rank the compromise."
      *   *Addressing the "Arrow" Objection:* Be polite but firm that it's a category error.
      *   *Addressing the "G-S" Point:* Acknowledge the friend is right, but explain why it doesn't lead to paralysis.

  7.  **Review against Constraints:**
      *   1-2 pages? (Keep it tight).
      *   Explain G-S and Arrow? (Yes).
      *   Compare IRV/Schulze honestly? (Yes).
      *   Specific recommendation? (Yes).
      *   Timeline? (Yes).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I explain *why* the middle candidate lost in IRV? Yes, "Center Squeeze."
      *   *Check:* Did I explain why G-S doesn't mean "give up"? Yes, "degrees of resistance."
      *   *Check:* Is the timeline realistic? Bylaws usually need a reading period. Let's allow 3 months for process before the election cycle starts.

  9.  **Final Output Generation** (Proceed to write the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Foundation Board of Directors
  **FROM:** Elections & Governance Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Method for Project Lead Election

  ### Executive Summary

  Following the dissatisfaction surrounding the last Project Lead election, the Working Group has reviewed our voting methodology. Our current system, Instant-Runoff Voting (IRV), failed to elect the Condorcet winner (the candidate who would beat all others in head-to-head matchups), resulting in a "center-squeeze" effect that alienated a significant portion of the contributor base.

  We recommend amending the bylaws to adopt the **Schulze Method**, a Condorcet-compliant system used by similar technical organizations (Debian, Gentoo, Wikimedia). While no voting system is mathematically perfect, Schulze is better suited to our community's preference structure and reduces the incentive for tactical voting that plagued the last cycle.

  ### Theoretical Context: Arrow vs. Gibbard-Satterthwaite

  During our deliberations, two theorems from social choice theory were raised. It is important to distinguish them to avoid fatalism regarding reform.

  **1. Arrow's Impossibility Theorem:** One member argued that Arrow's theorem proves "no system is fair." This is a category error. Arrow's theorem applies to systems that produce a *complete ranking* of all candidates. We are selecting a *single winner*. While Arrow's theorem highlights the difficulty of aggregating preferences, it does not strictly govern single-winner selection mechanisms.

  **2. Gibbard-Satterthwaite Theorem:** This theorem *does* apply to single-winner elections. It states that any deterministic voting system with three or more candidates is susceptible to tactical voting (i.e., voters lying about preferences to game the outcome). A colleague correctly noted that Schulze is not immune to this.

  **Implication:** The existence of Gibbard-Satterthwaite does not mean all systems are equally vulnerable. It means we cannot achieve perfection, but we can optimize for *resistance*. IRV is notoriously easy to game intuitively (e.g., "bullet voting" by ranking only one candidate to avoid helping a compromise candidate eliminate your favorite). Schulze makes tactical manipulation computationally complex and unintuitive, encouraging sincere voting in practice.

  ### Comparison: Instant-Runoff (Current) vs. Schulze (Proposed)

  | Feature | Instant-Runoff Voting (IRV) | Schulze Method |
  | :--- | :--- | :--- |
  | **Mechanism** | Eliminate lowest first-choice votes; redistribute until majority. | Compare every candidate head-to-head; resolve cycles via strongest "beatpaths." |
  | **Condorcet Criterion** | **Fails.** Can eliminate a candidate who would beat everyone else head-to-head (as happened last cycle). | **Passes.** Always elects the head-to-head winner if one exists. |
  | **Tactical Voting** | **High Risk.** Encourages truncation (ranking only one) to protect first choice. | **Low Risk.** Ranking a compromise candidate second rarely harms your first choice. |
  | **Complexity** | Low. Easy to explain, easy to count by hand. | High. Requires software to calculate beatpaths; harder to explain to new contributors. |
  | **Precedent** | Used in political elections (Australia, some US cities). | Standard in open-source governance (Debian, Gentoo, KDE, Wikimedia). |

  **The Trade-off:** By switching to Schulze, we trade simplicity for accuracy. IRV is easier to explain to a new contributor, but it produces mathematically paradoxical results (non-monotonicity) where ranking a candidate *higher* can theoretically cause them to lose. Schulze requires us to invest in clear documentation and UI tooling to visualize the results, but it ensures the winner reflects the broadest consensus.

  ### Recommendation

  The Working Group recommends **adopting the Schulze Method outright** for the Project Lead election.

  We considered adding safeguards to IRV (e.g., requiring full rankings), but this does not fix the mathematical flaw that eliminated the compromise candidate last cycle. The "center-squeeze" failure is a feature of IRV, not a bug in execution. Given that our electorate is technical and accustomed to the precedents set by Debian and Gentoo, the complexity cost is acceptable.

  **Implementation Plan & Timeline:**

  1.  **Bylaw Amendment Draft (Nov 15):** Working Group to finalize legal text defining the Schulze method and tie-breaking rules.
  2.  **Community Comment Period (Dec 1 – Jan 15):** Open forum for contributors to review the change. We will publish a "Voting Method Explainer" with interactive examples.
  3.  **Board Ratification (Feb 1):** Formal vote to amend bylaws.
  4.  **Tooling & Testing (Feb – Mar):** Update election software to implement Schulze counting; run dry-runs with historical data.
  5.  **Next Election Cycle (Apr 1):** Nominations open under new rules.

  ### Conclusion

  The Gibbard-Satterthwaite theorem reminds us that no voting system is strategy-proof. However, our recent experience demonstrates that IRV is uniquely vulnerable to strategies that undermine consensus. Adopting the Schulze method aligns us with peer organizations and prioritizes the election of a leader with broad pairwise support over one with polarized intensity. We request Board approval to proceed with the amendment draft.
