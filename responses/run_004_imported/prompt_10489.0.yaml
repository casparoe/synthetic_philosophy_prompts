      *   *Check:* Is IIT *strictly* anti-functionalist? It's "structural-realist." It says structure determines consciousness. Functionalism says organization/function determines it. IIT says the *intrinsic causal power* of the physical substrate determines it. So yes, it conflicts with standard computational functionalism.
      *   *Check:* Tononi's specific view on computers. He has explicitly stated that current computers have near-zero $\Phi$ because of the separation of memory and processing, and the clocked nature.
      *   *Refinement:* Make sure to distinguish between "information integration" in the colloquial sense (mixing data) and "integrated information" in the IIT sense (irreducible cause-effect repertoire).

