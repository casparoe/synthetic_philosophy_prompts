answer: |-
  The dust of the road did not settle on Kofi's shoulders. That was the first sign.

  He stood at the edge of the market square, ten years older than when he had left for the Coastal Cities. He wore a suit of tailored grey wool, expensive leather shoes, and a watch that ticked with the precision of a satellite. Inside his head, he was vibrant. He was a man of logic, of accumulated capital, of self-made decisions. He felt the heavy, solid weight of his own consciousness. *I think, therefore I am.*

  But when he stepped onto the packed earth of the square, the people did not turn. Or rather, they turned *through* him. A woman carrying a basket of yams walked a path that intersected his own, forcing him to step aside. She did not apologize. She did not see him.

  He found Nneka sitting under the shade of the ironwood tree, her hands resting on a staff of dark wood. She was the Keeper of the Rolls, the one who remembered the names.

  "Nneka," Kofi said. His voice sounded thin, like wind in dry grass. "I have returned."

  Nneka looked up. Her eyes were milky with cataracts, but they focused on the space where his shadow should have been. There was no shadow.

  "You have returned," she said. "But you are not here."

  "I am standing right in front of you."

  "You are a body," Nneka corrected gently. "You have breath. You have blood. But you are not a *person* yet."

  Kofi felt a spike of anger, the defensive reflex of the City. "I am a Senior Architect. I manage two hundred employees. I pay taxes. I have rights."

  "Rights belong to individuals," Nneka said. "Personhood belongs to the community. You left the web, Kofi. You went to a place where a man is an island. There, you are a person because you say you are. Here, you are a person only if we say you are. And currently, you are... light."

  She gestured to the scale beside her. It was not a scale for grain. It was a simple wooden balance. On one side sat a stone carved with the village sigil. On the other, nothing.

  "Sit," she said.

  Kofi sat. The wood creaked. The scale did not move.

  "How do I fix this?" Kofi asked. "Do I need to pay a fine? A tithe?"

  "Personhood is not a commodity. It is a texture. It is woven." Nneka leaned forward. "In the City, you believe personhood is a seed inside you. That if you are smart enough, conscious enough, you are a person. That is a child's story. Here, we know the truth. A baby is not a person. It is a potential. An elder is a heavy person, because they hold many lives in their hands. You? You hold nothing. You are tied to nothing. You are a ghost with a pulse."

  Kofi looked at his hands. They looked real to him. "So what do I do?"

  "You must become necessary," Nneka said. "Not useful. *Necessary.* A tool is useful. A foundation is necessary. You must take on a burden that, if you drop it, will crush someone else. Until then, you are invisible."

  The first week was humiliating. Kofi tried to help the fishermen mend nets. They thanked him politely, but when he left, the nets were retied by others. His knots held, but his presence did not. He tried to teach mathematics to the children. They listened, but when he fell silent, they did not ask where he went. He was a visitor in his own skin.

  He realized that in the City, he had curated his relationships. He had friends he chose, obligations he signed, debts he could clear. He had kept himself clean. Here, personhood was dirty. It was the mud on your boots from walking a neighbor's field. It was the grief you carried when a cousin died. It was the unpayable debt of being fed when you were hungry.

  The turning point came in the third month, during the season of the red rains.

  A sickness took the lower valley. It was not deadly, but it left the elders weak, unable to climb the path to the spring. The village needed water carriers.

  In the City, Kofi would have hired a service. Here, there was no service. There was only the web.

  He went to the spring. He filled two gourds. They were heavy, digging into his palms. He carried them to the hut of Old Man Obe, who had once boxed Kofi's ears for stealing mangoes and who had not spoken to him since he left for the Coast.

  Kofi set the water down. Obe looked at him. The old man's eyes were sharp.

  "Why?" Obe asked.

  "Because you cannot walk," Kofi said.

  "There are others who cannot walk. There are younger men. Stronger men."

  "I am here," Kofi said.

  "If you do this today," Obe warned, "you must do it tomorrow. And the day after. If you stop, the thirst remains. If you leave again, the betrayal is deeper than if you had never come. To bind yourself is to invite the knife. Are you ready to be cut?"

  This was the crux. Menkiti's warning. Personhood was not just inclusion; it was vulnerability. To be a person was to allow the community to define you, to limit you, to hold you accountable. To be an individual was to be free. To be a person was to be bound.

  Kofi thought of his grey suit hanging in the guest hut. He thought of his architectural plans, his autonomy, his right to leave whenever he chose. If he took this duty, he could not leave. If he left, he would be killing Obe. He would be a murderer of kin.

  He would lose his freedom. He would gain his existence.

  "I am ready," Kofi said.

  He lifted the gourds.

  Days turned into weeks. The red rains stopped. The elders grew stronger, but Kofi did not stop. He moved from carrying water to mediating a dispute over land boundaries between two brothers. He did not judge based on law, but on the future harmony of the lineage. He surrendered his objective truth for the sake of their relationship. He lost sleep. He gained wrinkles.

  He stopped checking his watch.

  Six months later, he stood before Nneka again. He wore a tunic stained with clay. His shoes were gone; his feet were calloused and cracked. He felt tired. He felt anchored.

  Nneka gestured to the scale.

  "Stand," she said.

  Kofi stepped onto the wooden platform.

  He did not feel different internally. He still had the same memories, the same thoughts. But when he breathed, the air seemed to resist him, thick with the presence of others. He looked at the woman with the yams. She nodded. He looked at the children. They stopped playing to watch.

  Nneka placed a stone on the opposite side of the scale. It was larger than the first one.

  The beam dipped. Kofi's side went down. He had weight.

  "You are heavier," Nneka observed.

  "I have less time for myself," Kofi said.

  "That is the cost," Nneka replied. "You are no longer an individual. You are a node. If you ache, the village aches. If you sin, the village bleeds. You can no longer say 'I'. You must learn to say 'We' and mean it as a statement of fact, not poetry."

  She reached into her robe and pulled out a small cord, woven from hair and fiber. She tied it around his wrist.

  "This is not a gift," she said. "It is a tether. You are now a person of this place. Do not cut it. If you cut it, you do not become free. You become a ghost. And ghosts, Kofi, are very lonely things."

  Kofi looked at the cord. It was rough against his skin. It limited how far he could reach. It bound him to the earth, to the old man who needed water, to the woman with the yams who expected him to move.

  He felt the crushing weight of expectation. He felt the terrifying loss of his own sovereignty.

  And for the first time in ten years, when he looked down, the dust settled on his shoulders. He cast a shadow.

  "I understand," Kofi said.

  "Good," Nneka said, turning back to the market. "Now, move. You are blocking the path."

  Kofi stepped aside. He did not feel insulted. He felt recognized. To be an obstacle was to be solid. To be told to move was to be part of the traffic.

  He walked into the crowd, not as a master of his fate, but as a thread in the weave. He was no longer just Kofi. He was Kofi-who-carries-water, Kofi-who-settles-disputes, Kofi-who-is-here-because-we-are-here.

  He was less than he was in the City. He was infinitely more. He was a person.
