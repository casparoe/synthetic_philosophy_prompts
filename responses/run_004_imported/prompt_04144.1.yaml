answer: |-
  The glass-walled conference room hummed with the specific, sterile frequency of late-stage capitalism. Martha had the spreadsheet open on the tablet, the red cells glaring like wounds. She had prepared her vocabulary carefully: *accountability, breach, trust, obligation.* These were the coins of the realm, and she intended to make Elias pay.

  "You said the deal would close on Tuesday," Martha said. Her voice was dry, reasonable, the voice of the morality system demanding its due. "People relied on that. I relied on that. You owe us an explanation."

  Elias stood by the window, looking out at the city. He wasn't ignoring her; he was listening to something else. He turned, and the light caught him in a way that seemed physically improbable, highlighting the line of his jaw as if a spotlight operator had cues written in the margins of reality. He didn't look guilty. Guilt requires a belief in the past as a binding contract. Elias lived only in the acute, vibrating present.

  "Tuesday was a sound," Elias said. His voice didn't travel; it filled the room, bypassing the air to resonate directly in the sternum. "It was a note held too long. It had to break."

  "This isn't poetry, Elias. It's a fiduciary responsibility." Martha tapped the screen. The sound was a sharp percussion, a snare drum hit in a empty hall. "You caused damage. You need to acknowledge the harm."

  Elias smiled. It wasn't a cruel smile. It was the smile of a man watching a wave crash against a rock and wondering why the rock is offended by the water. He stepped away from the window. As he moved, the sterile office lighting seemed to deepen, pooling into shadows that felt like velvet curtains dropping at the periphery of vision. The hum of the HVAC system pitched up, becoming a string section, a low, trembling viola sustain that underscored the impossibility of his presence.

  "Harm is a ledger entry," Elias said. He walked toward her, not with threat, but with an inevitable gravity. "You want me to sign the ledger. You want the signature to make the world solid again."

  "I want you to be human," Martha snapped, but her voice wavered. The air in the room was growing thick, pressurized. The glass walls seemed to breathe.

  "I am entirely human," Elias said. "That is the problem. You want a citizen. I am a pulse."

  He reached out, not to touch her, but to gesture at the spreadsheet. The tablet flickered. For a second, the red cells didn't look like data; they looked like rubies, like drops of blood, like roses blooming in fast motion. The realism of the office—the ergonomic chairs, the branded water bottles, the exit signs—began to feel like a flimsy set piece constructed around a force of nature that could not be contained by zoning laws.

  "You think blame is a hook," Elias said, and now his voice was soaring, demanding a vibrato that human vocal cords shouldn't sustain without amplification. "You think if you throw it hard enough, it will catch in my skin. But I have no skin for hooks, Martha. I have only the movement."

  The room swelled. It was impossible. The conference table elongated, becoming a vast plain. The city lights outside blurred into a chorus of golden eyes. Martha felt the urge to weep, not from sadness, but from the sheer exhaustion of maintaining boundaries in the face of a flood. She wanted to scream *wrong*, she wanted to scream *unfair*, but the words felt like pebbles thrown at a hurricane. The morality system requires two people who agree on the rules. Elias was playing a different game, one where the only rule was the intensity of the current moment.

  "I didn't break the promise," Elias said, and the chandelier above them swayed, though there was no wind. "I outgrew it. The promise was a coat I wore last year. It does not fit the body I am today."

  He turned back to the window. The opera of the city was waiting—the sirens, the traffic, the millions of desperate desires crashing against each other. He belonged to that noise, not to this quiet room of accounting.

  "Where are you going?" Martha asked. Her voice was small now, a recitative after the aria.

  "To where the music is," Elias said.

  He opened the glass door. It didn't creak; it sang. He stepped through, and the moment he crossed the threshold, the lighting snapped back to fluorescent harshness. The hum returned to being just machinery. The spreadsheet was just data again. He was gone, not because he had fled accountability, but because he had simply ceased to be subject to the jurisdiction of the room. Martha sat alone in the silence, holding a blame that had nowhere to land, heavy and useless in her hands.
