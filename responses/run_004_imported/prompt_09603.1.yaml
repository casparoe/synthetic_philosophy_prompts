          *   *Argument 1: The Risk Factor.* Age 35. Waiting reduces chances of conception. Choosing a high probability of *this* child vs. a lower probability of *a different* child. This is a strong ethical defense.
          *   *Argument 2: Thresholds.* Is the air/school situation "bad" or "catastrophic"? If it's not life-threatening, the obligation to wait weakens.
          *   *Argument 3: Parental Virtue.* Focus on the parents' character. Did they act recklessly? Or did they weigh risks (age) against benefits (environment)?
          *   *Argument 4: Impersonal Value.* Some philosophers argue we should aim for the "best state of affairs," even if no specific person is harmed. But this is controversial.
      *   **Synthesize/Conclusion:** Reassure the user. The decision wasn't selfish; it was a complex risk/benefit analysis. The sister's view is too simplistic. The user's intuition that "this child isn't harmed" is correct, but the decision still had moral weight (risk management, resource allocation).

