answer: |-
  The airlock cycled with a hiss that sounded too much like a dying breath. Inside the salvage bay of the *Orpheus*, the silence was heavy, broken only by the hum of the life support and the ticking of cooling metal.

  Torin floated near the console, his mag-boots locked to the floor. Elara hung opposite him, tethered to the bulkhead. Between them, suspended in the magnetic field, was the Prize: a canister of stabilized antimatter, glowing a soft, dangerous violet.

  "We split it fifty-fifty," Elara said. Her voice was calm, but her hand hovered near the release lever on her suit. "Equal risk, equal reward. That's the only fair way."

  Torin shook his head. "It's not fair, Elara. And it's not stable."

  He tapped the console. A holographic display bloomed between them, showing a graph. The X-axis was Torin's payoff, the Y-axis was Elara's. A curved line bowed outward—the Pareto frontier. Every point on that line represented a way to split the antimatter without the *Orpheus* blowing up.

  "Look at the Disagreement Point," Torin said, highlighting a dot in the lower left. $d = (10, 0)$.

  "I know the math," Elara snapped. "If we fight, you trigger your emergency pod. You walk away with 10 units of value. I get zero. I die. So we agree not to fight."

  "Exactly. But look at the Ideal Point." Torin manipulated the hologram. A new dot appeared at the top right. $u^* = (100, 90)$.

  "Your ideal is 100," Torin explained. "That's you taking everything, leaving me with my minimum 10. My ideal is 90. That's me taking everything, leaving you with your minimum 0."

  "So we meet in the middle," Elara insisted. "50/50."

  "That's a naive split. It ignores the geometry of our leverage," Torin said. "The Mediator AI suggested the Nash solution. It maximizes the product of our gains. It finds the point where the hyperbola touches the curve."

  "And?"

  "And it gives me 55, you 45. Because my fallback is better."

  Elara bristled. "So strength is rewarded? That's not fairness, that's tyranny."

  "No," Torin said softly. "That's *Nash*. But I'm not asking for Nash. I'm asking for Kalai-Smorodinsky."

  He drew a straight line on the hologram. It started at the Disagreement Point $(10, 0)$ and went directly to the Ideal Point $(100, 90)$.

  "This is the Line of Sight," Torin said. "It represents equal proportional concession. If we follow this line, we both give up the same percentage of our 'dream' outcome. If I get 90% of my ideal gain, you get 90% of yours. We sacrifice equally relative to what we *could* have had."

  The line intersected the curved frontier. The intersection point was $(58, 42)$.

  "See?" Elara pointed. "It's even worse for me than Nash!"

  "Wait," Torin said. "Here is why KS is actually safer for you. Here is why it satisfies monotonicity."

  He swiped his hand, and the hologram shifted. The frontier expanded on Torin's side.

  "Scenario B," Torin said. "I find an extra containment unit in the wreck. My maximum capacity increases. My Ideal Point moves from 100 to 120. The Disagreement Point stays the same. I have more potential."

  The Ideal Point dot slid to the right. $(120, 90)$.

  "Under your 50/50 rule," Torin said, "the split stays 50/50 of the total. I gain, you gain. Simple."

  "Under Nash," Torin continued, highlighting a new curve, "it depends on the shape of the frontier. If the new capacity just extends the tail without changing the 'bulge' of efficiency, the Nash solution might not move at all. The product maximization point could stay exactly where it was. I improve my technology, I increase the total potential, and the math says *you* get all the benefit while I stay stuck at 58."

  Elara frowned. "Why would the math punish you for improving the ship?"

  "Because Nash looks at the tangent," Torin said. "If the curve flattens out, the tangent doesn't move. It violates monotonicity. It means if I raise my ceiling, my floor doesn't have to rise. That creates resentment. If I know that improving my tech doesn't guarantee me a better share, I won't improve the tech. I'll sabotage the effort."

  He switched the overlay to the Kalai-Smorodinsky line.

  "Now look at KS."

  The Line of Sight rotated. Because the Ideal Point moved to the right, the line drawn from the Disagreement Point became steeper. It pivoted like a gun barrel aiming higher.

  "Because the line rotates," Torin said, "the intersection with the frontier *must* move toward me. It is geometrically impossible for it to stay the same. If my maximum potential increases, my guaranteed share increases. Proportionally."

  The new intersection settled at $(65, 45)$.

  "I get more," Torin said. "But you also get slightly more, because the total pie grew. But critically, *I am rewarded for the expansion.*"

  Elara stared at the rotating line. She saw the logic. It wasn't about punishing her for his better escape pod. It was about aligning incentives.

  "If we use Nash," Elara said slowly, "and you find a way to carry more cargo later... you might not bother telling me. Because the math might give the surplus to me anyway, or split it oddly based on the curve."

  "Exactly," Torin said. "Nash is static. It optimizes the moment. KS is dynamic. It optimizes the relationship. It says: 'If the horizon expands for one of us, we both adjust our sights.'"

  Elara looked at the violet canister, then back at the line. The 50/50 split felt childish now, like dividing a candy bar without noticing one person was starving and the other had a pocket full of cash. The Nash solution felt cold, a calculation that could arbitrarily freeze her out if the geometry shifted.

  But the Line of Sight... that felt like a partnership. It acknowledged that Torin had a better safety net, yes. But it also acknowledged that if Torin built a bigger net, he should be allowed to stand higher in it.

  "Equal proportional concession," Elara murmured. "We both walk away feeling we gave up the same slice of our dreams."

  "Neither of us gets everything," Torin said. "But neither of us is capped by the other's limitations."

  Elara reached out and touched the hologram, accepting the point where the line met the curve.

  "Fine," she said. "Kalai-Smorodinsky. But if you find another containment unit, we re-draw the line."

  "Deal," Torin said.

  The magnetic field lowered. They secured the canister together. The airlock cycled open, not to a split of equals, but to a balance that could hold weight when the gravity returned.
