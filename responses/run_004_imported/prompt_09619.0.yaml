      *   *Middle:* The SIA needs to be clear but conversational. "Imagine a salary bump..."
      *   *Climax:* The discussion on "Regret." Marcus says regret is rational. Elena says regret is a sign of commitment.
      *   *End:* Acknowledging the user's pain.

  6.  **Final Polish:**
