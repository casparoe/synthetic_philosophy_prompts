answer: |-
  This is a sophisticated dispute that cuts to the heart of contemporary metaethics. Your skepticism is well-founded; while your friend's response reflects a standard maneuver in the literature (often associated with the distinction between *object-given* and *state-given* reasons), the claim that this "solves" the problem without circularity is highly contested. Many prominent metaethicists (including Scanlon in his later work, and critics like Jonas Olson and Wlodek Rabinowicz) agree with you that the move often smuggles in the very normative notions it seeks to reduce.

  Here is a reconstruction of why the object-given/state-given distinction fails to fully dissolve the circularity worry, followed by an analysis of the belief analogy.

  ### 1. The Circularity Worry: Why "Source" Doesn't Save Reductionism

  Your friend's strategy is to save the Buck-Passing Account (BPA) by filtering reasons. The analysis becomes: *$X$ is good iff there are **right-kind** reasons to favor $X$.* They claim we can identify "right-kind" reasons non-circularly by looking at their **source** (features of the object) rather than their **consequences** (benefits of holding the attitude).

  The circularity charge arises because distinguishing the "right" source from the "wrong" source requires a prior normative judgment that the BPA was supposed to explain.

  #### A. The "Feature of the Object" Problem
  Consider the Demonic Admiration case. The demon threatens to torture you unless you admire him.
  *   **Friend's Claim:** The reason to admire (avoiding torture) is state-given (about the *state* of admiring), not object-given (about the *demon*).
  *   **The Counter:** The threat is a feature of the demon. It is a property of the object. If we define "object-given" simply as "a reason grounded in a feature of the object," the demon's threat counts. He *has* the power to torture; that is a fact about him.

  To exclude the threat, we must refine the definition: "Object-given reasons are those grounded in features of the object **that make it worthy of the attitude**."
  *   **The Trap:** But "worthy of the attitude" (admirable, desirable, etc.) is precisely the value property we are trying to analyze. If we must appeal to *worthiness* to filter the reasons, we have not reduced value to reasons. We have analyzed value in terms of reasons + worthiness. This is circular.

  #### B. The "Normative Relevance" Problem
  Your friend suggests we look at *where the reason comes from*. However, to categorize a reason as coming from the "right" source, we must already understand which features of an object are **normatively relevant** to the attitude in question.
  *   Why does the demon's *cruelty* provide a reason of the right kind (a reason to *despise* him), but his *power to torture* provides a reason of the wrong kind (a reason to *admire* him)?
  *   Both are features of the demon. Both generate reasons.
  *   To distinguish them, you must say: "Cruelty bears on the *fittingness* of admiration, whereas the threat bears only on the *prudence* of admiration."
  *   **The Circularity:** "Fittingness" is a normative notion functionally equivalent to value in this context. If the BPA is supposed to explain value (or fittingness) in terms of reasons, it cannot presuppose a distinction between reasons that bear on fittingness and reasons that do not. That distinction *is* the distinction between value-conferring reasons and non-value-conferring reasons.

  #### C. The "No-Independent-Criterion" Objection
  For the reduction to work, there must be a way to identify "right-kind reasons" **independently** of knowing what is valuable.
  *   If you can identify right-kind reasons only by asking, "Does this feature make the object good/admirable?", then the analysis is: *$X$ is good iff there are reasons to favor $X$ (where 'reasons' means 'reasons that imply $X$ is good').* This is trivial.
  *   Your friend claims the source criterion is independent. But as shown above, the source criterion collapses unless it is loaded with normative relevance. There is no non-normative, structural feature of the *demon's threat* that distinguishes it from the *demon's cruelty* without invoking the concept of admiration-worthiness.

  ### 2. Is There a Way to Draw the Line Without Stipulation?

  If the simple "source" distinction fails, is there a more robust way to save the view? There are three main avenues, though none are universally accepted as "solving" the problem in the reductive sense your friend hopes.

  #### A. Non-Reductive Buck-Passing (Scanlon's Retreat)
  In later work, Scanlon effectively conceded that a fully reductive analysis might be impossible. He moved toward a **non-reductive** view. On this view, "reasons" and "value" are mutually illuminating but not reducible one to the other. The distinction between right- and wrong-kind reasons is taken as a **primitive normative truth**.
  *   **Verdict:** This avoids circularity by abandoning reductionism. It admits that we need an independent notion of normative relevance (fittingness) to filter reasons. This validates your intuition: you *do* need an unreduced notion of value-relevance.

  #### B. The "Fittingness-First" Approach
  Some philosophers argue we should analyze value in terms of **fitting attitudes** (FA accounts), not reasons.
  *   *$X$ is good iff it is fitting to favor $X$.*
  *   Here, the WKR problem re-emerges: It might be "fitting" in a pragmatic sense to admire the demon.
  *   To solve this, proponents argue "fittingness" is a sui generis normative relation.
  *   **Verdict:** This solves the circularity by positing a primitive normative relation ("fittingness"). It is consistent, but it is not a reduction of the normative to the non-normative (or even to reasons alone). It accepts that normativity is irreducible.

  #### C. Substantive Normative Theory
  One could argue that we can distinguish the kinds of reasons not formally (by source) but **substantively**, by offering a full theory of value (e.g., a virtue ethicist might say only features related to *excellence* count).
  *   **Verdict:** This works, but it means the BPA is not a free-standing analysis of value. It is dependent on a substantive first-order moral theory. You can't know what the "right kind" of reasons are until you already know what is good. This reverses the explanatory direction your friend wants.

  **Conclusion on Task 1:** Your friend is likely too optimistic. The consensus in the literature is that the WKR problem shows that **reasons alone are not enough**. You need reasons *plus* a constraint on which reasons count, and that constraint inevitably invokes a normative notion (fittingness, correctness, worthiness) that is extensionally equivalent to value. Thus, the reduction fails.

  ---

  ### 3. The Belief Analogy: Evidentialism and Pascal's Wager

  You asked whether this is structurally the same difficulty as the one facing Evidentialism about belief (the view that the only reasons for belief are evidence of truth).

  #### Structural Identity
  Yes, structurally, the problems are identical.
  *   **Metaethics:** Value = Reasons to favor. **Problem:** Pragmatic reasons (Demon) favor but don't create value.
  *   **Epistemology:** Justification = Reasons to believe. **Problem:** Pragmatic reasons (Pascal's Wager) favor belief but don't create justification.

  In both cases, we have a normative status (Goodness / Justified Belief) that seems sensitive only to a specific subset of reasons (Object-Given / Evidential), excluding pragmatic/state-given reasons.

  #### Do Features of Belief Make the Solutions Come Apart?
  While the structure is the same, the *resources available to solve it* differ significantly due to the nature of belief versus pro-attitudes like admiration.

  **1. The "Aim of Belief" Argument**
  There is a strong tradition (Shah, Velleman) arguing that belief has a **constitutive aim**: truth.
  *   To believe $p$ just is to hold $p$ as true.
  *   Therefore, considerations that do not bear on the truth of $p$ are structurally incapable of being reasons *for belief*. They might be reasons to *cause* yourself to believe, or reasons to *act as if* you believe, but they cannot be reasons for the attitude itself.
  *   **Advantage:** This offers a non-normative (or less normative) ground for the distinction. We distinguish evidential from pragmatic reasons based on the *functional role* of belief, not by invoking "justification" itself.
  *   **Contrast with Value:** What is the constitutive aim of admiration? "Fittingness"? If we say admiration aims at the admirable, we are back to circularity (admirable = value). Belief aims at *truth*, which is arguably a non-normative property (or at least distinct from justification). This makes the evidentialist solution potentially more robust than the BPA solution.

  **2. Doxastic Voluntarism**
  *   **Belief:** Most philosophers accept we cannot believe at will. The Demon cannot simply threaten you into believing $2+2=5$. This makes WKR cases for belief harder to construct phenomenologically. The "reason" exists, but it cannot motivate the attitude directly.
  *   **Admiration/Desire:** We have more voluntary control over our pursuits and perhaps our cultivated attitudes. The Demon case is more plausible for admiration than for belief.
  *   **Implication:** If belief is involuntary, the "state-given" reason (Pascal's Wager) is clearly external to the attitude's formation. This makes it easier to argue such reasons are the "wrong kind." For admiration, where we might cultivate the attitude voluntarily to avoid torture, the line is blurrier, making the WKR problem harder to dissolve.

  **3. Normative Pluralism**
  *   In epistemology, it is widely accepted that there are **two distinct normative domains**: Epistemic normativity (truth-directed) and Practical normativity (welfare-directed). Pascal has practical reasons, but no epistemic reasons.
  *   In metaethics, the BPA tries to analyze **all** value in terms of reasons. If we admit "practical reasons to admire" vs. "fittingness reasons to admire," we are effectively admitting two kinds of normativity governing the same attitude.
  *   **The Divergence:** Evidentialists can happily concede Pascal has *practical* reasons to believe, just not *epistemic* ones. Buck-Passers want to say the demon gives you reasons, but they aren't *value-constituting* reasons. Because value is supposed to be the overarching normative notion in ethics, splitting "reasons" into "value-constituting" and "non-value-constituting" is more damaging to the theory than splitting reasons into "epistemic" and "practical" is for evidentialism.

  ### Summary for Your Dinner Debate

  1.  **On Circularity:** You are right to be unpersuaded. The "object-given" restriction fails as a *reductive* move because identifying which object-features count as "right kind" requires prior knowledge of what makes the object valuable (or the attitude fitting). It presupposes the normative relevance it claims to derive.
  2.  **On the Solution:** The only way to save the view is to abandon strict reductionism (admitting "fittingness" or "normative relevance" as primitive) or to rely on a substantive first-order moral theory to filter the reasons.
  3.  **On Belief:** The problems are structurally twins. However, the belief case is easier to manage because "truth" provides a clearer, less circular teleological standard for filtering reasons than "fittingness" does for value. Additionally, the involuntary nature of belief makes the intrusion of pragmatic reasons feel more alien to the attitude than it does for admiration.

  Your friend is relying on a distinction (source of reason) that cannot do the work without a hidden normative premise. The WKR problem remains one of the strongest arguments against reductive buck-passing accounts.
