prompt: |-
  My sister, a scholar of Madhyamaka Buddhism who has spent years translating Candrakīrti's Prasannapadā, is marrying her partner next month. She's asked me, as her maid of honor, to give the toast. Half the room will be her colleagues in Buddhist philosophy; the other half won't know what "emptiness" means in this context. Her one request is that the catuṣkoṭi, Nāgārjuna's tetralemma, appear somewhere in the toast, brought to bear on what she and her partner now are to each other, and that it never drift, as she insists these toasts always do, into a meditation on impermanence and loss. Write a four-minute toast that is rigorous enough to satisfy her colleagues without losing everyone else.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Maid of Honor (sibling of the bride).
      *   **Bride:** Scholar of Madhyamaka Buddhism, translator of Candrakīrti's *Prasannapadā* (Clear Words).
      *   **Audience:** 50% Buddhist philosophy scholars, 50% laypeople (need accessibility).
      *   **Key Requirement:** Must include the *catuṣkoṭi* (Nāgārjuna's tetralemma) applied to the couple's relationship.
      *   **Constraint:** *No* meditation on impermanence (*anitya*) and loss. This is crucial. Madhyamaka is often associated with deconstruction and emptiness leading to a realization of impermanence, but the bride specifically wants to avoid the "sad" or "melancholic" interpretation often found in Western pop-Buddhism. She wants affirmation, not negation of the relationship's value.
      *   **Tone:** Rigorous enough for scholars, warm/accessible for laypeople, celebratory.
      *   **Length:** Four minutes (approx. 500-600 words spoken at a moderate pace).

  2.  **Deconstruct the Key Concepts:**
      *   **Madhyamaka/Emptiness (*Śūnyatā*):** Not "nothingness," but lack of inherent, independent existence. Things exist dependently. This means relationships are real *because* they are dependent, not despite it.
      *   **Candrakīrti/Prasannapadā:** Known for a robust defense of conventional truth (*saṃvṛti-satya*). He argues that emptiness *supports* conventional reality, it doesn't destroy it. This is the perfect angle for a wedding toast.
      *   **Catuṣkoṭi (Tetralemma):** A logical tool used to negate four possibilities regarding a proposition (e.g., about the self or reality):
          1.  It is.
          2.  It is not.
          3.  It is both.
          4.  It is neither.
      *   **The Constraint (No Impermanence/Loss):** Focus on *dependent arising* (*pratītyasamutpāda*) as the ground for connection, stability, and meaning, rather than the ground for dissolution. Focus on the *conventional truth* of love.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split audience. Set a warm tone. Introduce the bride's work lightly.
      *   **The Hook (The Tetralemma):** Introduce the *catuṣkoṭi* clearly. Explain it simply for the laypeople while using precise terms for the scholars.
      *   **Applying the Tetralemma to Love:**
          *   *Thesis:* Love exists inherently? No (too rigid).
          *   *Antithesis:* Love doesn't exist? No (too nihilistic).
          *   *Both:* Contradictory?
          *   *Neither:* Beyond concept?
          *   *Resolution:* In Madhyamaka, the tetralemma usually deconstructs inherent existence. But for a wedding, we need to pivot to *conventional validity*. The tetralemma clears away *wrong views* of love so *real love* can appear.
      *   **The Candrakīrti Angle:** Candrakīrti emphasizes that without emptiness, nothing could function. Because they are empty of independent self-nature, they can come together.
      *   **Avoiding the "Loss" Trap:** Explicitly state that emptiness isn't about things disappearing; it's about things being able to connect.
      *   **Closing:** A wish for their future. A toast.

  4.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* If I just say "Love is empty," the laypeople might think "Love is fake."
      *   *Fix:* Use Candrakīrti's distinction. Emptiness *makes* the conventional world possible. "Because it is empty, it works."
      *   *Critique:* The tetralemma is usually a tool of negation. How do I make it positive?
      *   *Fix:* Frame it as clearing the ground. "It is not this, not that, so that what remains is the living reality." Or, better yet, use it to show that their love transcends logical categorization but is fully present conventionally.
      *   *Constraint Check:* Did I mention impermanence? I need to ensure I don't say "cherish this moment because it will end." Instead, "cherish this moment because it is happening *now* through dependence."

  5.  **Drafting the Content (Iterative Process):**

      *   *Intro:* Welcome everyone. Mention the sister's translation work.
      *   *The Tetralemma:* Explain the four corners.
          1.  Love is a fixed thing.
          2.  Love is nothing.
          3.  Love is both.
          4.  Love is neither.
      *   *The Turn:* Nāgārjuna rejects all four to stop us from grasping. But Candrakīrti says, once we stop grasping, the world appears vividly.
      *   *The Application:* Their love isn't a static object (1). It isn't an illusion (2). It's not a logical paradox (3/4). It is a *dependent arising*.
      *   *The "No Loss" clause:* Emptiness means they *can* change together, not that they *will* vanish. It allows for growth, not just decay.
      *   *Conclusion:* Raise a glass.

  6.  **Polishing for Time and Tone:**
      *   Word count check: 550 words is about 4 minutes at a slow, speech-like pace.
      *   Tone check: Is it too academic? Add jokes about the translation work. Is it too simple? Ensure terms like *svabhāva* (inherent nature) are used correctly for the scholars.
      *   *Crucial adjustment:* Make sure the Tetralemma application feels organic, not forced.

  7.  **Final Review against constraints:**
      *   Tetralemma included? Yes.
      *   Madhyamaka rigorous? Yes (references *svabhāva*, *pratītyasamutpāda*, Candrakīrti's view on conventional truth).
      *   Accessible? Yes (explained in plain English).
      *   No impermanence/loss? Yes (focused on connection and function).
      *   Time? Looks right.

  8.  **Final Polish:** (Writing the actual speech based on these thoughts.) *Self-correction: Ensure I don't accidentally imply that because it's empty, it doesn't matter. Emphasize that because it's empty, it matters.*

  **(Post-Drafting Check):** The prompt asks for "rigorous enough to satisfy her colleagues." I need to make sure I don't misrepresent the *catuṣkoṭi*. The *catuṣkoṭi* is typically used to show that nothing can be predicated of ultimate reality. Applying it to a wedding requires a delicate touch: using it to show that the *concept* of love cannot be pinned down, but the *experience* is valid conventionally. Candrakīrti is key here because he defends the validity of the conventional world *against* nihilists. I will lean heavily on that.

  Let's write it.cw
answer: |-
  Good evening. For those who don't know me, I'm the Maid of Honor and the bride's sibling. For those who do know me, you know I was warned strictly not to quote the *Mūlamadhyamakakārikā* incorrectly.

  My sister has spent the better part of a decade translating Candrakīrti's *Prasannapadā*. For the half of the room not steeped in 7th-century Indian philosophy, this means she has spent years arguing that nothing exists independently, but that somehow, everything still matters. It is a delicate balance, and one she and [Partner's Name] have mastered in their relationship.

  She asked me to include the *catuṣkoṭi*—Nāgārjuna's tetralemma. For the uninitiated, this is a logical tool used to examine any phenomenon through four possibilities:
  One: It exists.
  Two: It does not exist.
  Three: It both exists and does not exist.
  Four: It neither exists nor does not exist.

  Usually, in Madhyamaka, we use this to deconstruct inherent nature, *svabhāva*. If we apply this rigidly to a marriage, we might worry. Is their love a fixed thing? No, that is reification. Is it nothing? No, that is nihilism. Is it both? A contradiction. Is it neither? Ineffable.

  If we stop there, we drift into the melancholy idea that because love cannot be pinned down, it is fleeting or insubstantial. But my sister insists we do not make that mistake. And this is where Candrakīrti is essential.

  Candrakīrti argues that emptiness is not a negation of the world; it is the very condition that allows the world to function. If love had a fixed, inherent nature, it could not grow. It could not adapt. It could not connect two distinct people. It would be a stone, not a relationship.

  So, let us look at the tetralemma again, not as a negation, but as a liberation.

  Because their love is not inherently "one thing," it is free to become many things: a shelter, a challenge, a home, and an adventure.
  Because it is not "nothing," it has weight, consequence, and profound reality in our conventional world.
  Because it transcends the logic of "both" and "neither," it cannot be captured by language, only by living it.

  The tetralemma clears away the false views of what a marriage *should* be, so that what remains is what a marriage *is*.

  For the scholars here: This is the validation of *saṃvṛti-satya*, conventional truth. My sister knows better than anyone that dependent arising (*pratītyasamutpāda*) is not a prelude to disappearance. It is the mechanism of connection. It means that [Partner's Name] and my sister do not love each other *despite* their emptiness; they love each other *because* of it. They are empty of isolation, and therefore full of each other.

  There is a temptation in our tradition to focus on the dissolution of form. But today, we celebrate the form itself. We celebrate the dependent arising of this union. We celebrate that because nothing stands alone, they do not have to.

  So, please raise your glasses.

  To the bride and groom: May your logic be sharp, but your hearts be open to the conventional truth of this joy. May you never seek inherent existence in each other, but always find refuge in your dependence. And may your love be like the ultimate truth: beyond the four corners of the tetralemma, undeniable, and fully present.

  To the happy couple.
