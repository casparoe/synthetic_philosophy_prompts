      *   **The Internal Question:** Does *It* feel the pain? Or is it just us feeling the heat/boredom?
      *   **The Output:** The body reacts. A cry? A withdrawal?
      *   **The Climax/Resolution:** Wei tries to listen for the "thought." He hears only static and voices. But maybe there's a synchronization that feels like something more.
      *   **Word Count Check:** Need to stay between 800-1,200.

