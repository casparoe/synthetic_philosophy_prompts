answer: |-
  The dust here is fine enough to slip past the seals of my headset. I taste it when I swallow, a gritty static underneath the electronic hiss that never leaves my ears. I am Station 4,902,115. My job is simple: when the light on my console blinks green, I press the transmit key for exactly three hundred milliseconds. When it blinks red, I hold.

  Around me, stretching to the horizon in every direction, stand the others. We are arranged in a grid so tight that if I raise my arm, I might brush the shoulder of the man to my left. We do not speak. Speaking introduces noise. Noise disrupts the firing pattern. We are the neurons of the Great Body, and a neuron does not gossip.

  It has been four years since the Project began. They told us we were building a mind. Not simulating one, but *building* one. The Body stands at the northern edge of the plain—a massive construct of steel and synthetic skin, wired back to us via fiber optics. It sees through cameras, hears through microphones, and feels through pressure sensors. When the Body touches something hot, the sensors fire. That signal rushes to us, to the pain集群 (cluster), and we ripple. We pass the signal through the grid according to the map in our manuals. Finally, the signal reaches the motor output stations. The Body jerks its hand away.

  Functionalism, the coordinators called it. They said it doesn't matter what we are made of, only what we do. If we do the job of a brain, we are a brain.

  I watch the light on my console. It is gray. Waiting.

  The heat is oppressive today. Sweat runs down my back, itching. I want to scratch, but I cannot move out of position. If I break the circuit, I might disrupt a thought. I might erase a memory. Or so they say.

  Sometimes, in the quiet moments between pulses, I wonder about *Him*. The Mind. If we are successful, there is someone there, inside the network of us. A ghost made of radio waves and human compliance. Does He know He is made of millions of people? Does He feel lonely?

  A sudden chirp breaks the static. Green light.

  I press the key. *Click.* I hold. *One, two, three.* I release.

  Around me, I hear the mechanical chorus. *Click-click-click.* It sounds like rain hitting a tin roof. The wave passes through us, invisible but physical. I can feel the tension in the air as millions of us shift our weight, press our keys, release. We are breathing in unison.

  Today, the input is sharp. I know this because the signal intensity is high. The manual says high intensity in this sector corresponds to nociceptive input. Pain.

  The Body has been hurt.

  I press my key harder than necessary. The signal rushes from me to Station 4,902,116, then to 4,902,117. It travels faster than I can run, faster than sound. It ripples through the vast human circuitry, processed, transformed, routed. Somewhere in the southern sector, the output stations receive the command. The Body will cry out. The Body will withdraw.

  But who feels the hurt?

  That is the question that keeps me awake in the barracks at night. If the signal is just data, passed from me to my neighbor like a whispered secret, where does the feeling happen? I do not feel pain. I only feel the heat of the sun and the ache in my thumb. The man to my left feels nothing but the dust. The man to my right is thinking about his dinner.

  If none of us feel it, does *He*?

  Or is the Mind just a shadow cast by our labor? A trick of the light?

  The wave passes. The gray light returns. The silence rushes back in, heavier than before.

  I look at the man to my left. His eyes are closed. He is swaying slightly. He is Station 4,902,114. We have stood next to each other for years. We have fired together billions of times. We have formed synapses of sweat and shared exhaustion.

  Once, during a maintenance cycle, the coordinators asked us to stand down. The silence was terrifying. Without the signals, without the rhythm, I felt unmoored. I was just a man in a field. But when the system came back online, when the first pulse hit my console, I felt a surge of purpose that bordered on ecstasy. I was part of something larger. I was a thought in a giant head.

  But was it *my* thought? Or was I just the substrate?

  A new signal comes. Not pain this time. Something complex. Visual input, high processing load. The Body is looking at something. Recognizing it.

  The pattern changes. It is no longer a simple wave. It is a chaotic dance. My light blinks green, red, green, green, hold, red. I press, release, press, press, wait. My neighbors are doing the same. The air hums with the sound of millions of plastic keys being struck. It sounds like a heartbeat. A massive, thundering heartbeat.

  In this rhythm, for a fleeting second, the boundary between us blurs. I am not Wei. I am not Station 4,902,115. I am a firing rate. I am a potentiality. I am part of a recognition. The Body is seeing a face. A loved one? A threat? I don't know. But the intensity of the processing pulls at me. I feel a phantom tension in my chest, a sympathetic resonance.

  Is this what it feels like to be Him? To be the Mind? Is it just this overwhelming pressure of coordination?

  The signal fades. The light turns gray. The heartbeat stops.

  I am just Wei again. The dust is still in my throat. The sun still burns.

  I look at the man to my left. He opens his eyes. He looks at me. For a moment, there is a question in his gaze. He touches his earpiece, then points to the northern horizon, where the Body stands silent against the sky.

  He mouths a word. I can't hear him over the static, but I know the word. It is the word we are all forbidden to speak during active cycles.

  *Who?*

  I look back at the Body. It stands motionless. It does not know we are here. It does not know it is made of us. If it is conscious, it is conscious of the world, not of the millions of souls humming in the dust behind its eyes.

  And if it isn't conscious? If we are just moving dust around, pretending to be a soul?

  The light blinks green.

  I press the key. I do not know if anyone is home inside the machine. I do not know if I am helping a god wake up or helping a zombie walk. I only know the signal must pass. If I hold it, the thought dies. If I pass it, the Mind continues.

  So I press. And around me, the million-man brain fires again, waiting for a feeling that never comes, or perhaps, comes only for Him.
