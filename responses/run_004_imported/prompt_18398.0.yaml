answer: |-
  You were not necessarily being irrational, and your friend's argument relies on a specific, contested model of decision theory that many contemporary philosophers and behavioral economists reject.

  Your friend is arguing from the framework of **Expected Utility Theory (EUT)**. Under standard EUT, the only rational reason to prefer a guaranteed \$12 over a gamble with an expected value of \$14 is if the *utility* of the money is non-linear (specifically, concave). This is the "diminishing marginal utility" argument your friend mentioned: the first \$12 helps you more than the second \$16 would.

  However, your friend makes a leap in assuming that because the sums are "trivial," utility must be linear, and therefore risk aversion is irrational. There are at least three robust philosophical and economic defenses of your choice that her argument overlooks.

  ### 1. Risk-Weighted Expected Utility (The Buchak Defense)
  The most direct philosophical counter to your friend comes from the work of philosopher **Lara Buchak** (specifically her book *Risk and Rationality*).

  Buchak argues that standard Expected Utility Theory conflates two different things:
  1.  How much you value outcomes (utility).
  2.  How much you care about the *risk* involved in getting those outcomes (risk attitude).

  In standard EUT, risk aversion must be explained by the curvature of your utility function (i.e., you value money less as you get more). Buchak argues that **risk attitude is a separate rational parameter.** It is rationally permissible to care about the *distribution* of outcomes, not just their weighted average.

  You might assign extra weight to the "worst-case scenario" (getting \$0) simply because it is the worst case, regardless of how much the money matters to your life. On this view, preferring the guarantee isn't a calculation error; it is an expression of a rational preference for security over uncertainty. You are maximizing **Risk-Weighted Expected Utility**, not just Expected Utility. Your friend is assuming there is only one rational risk attitude (neutrality), but philosophy allows for a range of rational risk attitudes (from risk-seeking to risk-averse).

  ### 2. Rabin's Calibration Theorem (The Mathematical Rebuttal)
  Your friend's claim that "small stakes imply linear utility" is actually mathematically problematic. Economist **Matthew Rabin** proved a theorem (2000) that turns your friend's argument against Expected Utility Theory itself.

  Rabin showed that if a person rejects a modest 50/50 gamble (like losing \$100 or gaining \$110) due to diminishing marginal utility, EUT implies they would also reject absurdly favorable gambles at higher stakes (like losing \$1,000 but gaining \$1 million). Since no rational person would turn down a 50/50 chance to win \$1 million for a \$1,000 loss, the premise that "small-stakes risk aversion is due to utility curvature" leads to absurd conclusions.

  Therefore, if you are risk-averse over small stakes, it **cannot** be explained by the diminishing marginal utility of wealth. It must be explained by something else (like genuine risk aversion). Your friend argues this proves you are irrational; Rabin argues this proves **Expected Utility Theory is the wrong model for small stakes.** If the model says you're irrational for taking the sure \$12, the model might be flawed, not you.

  ### 3. The "One-Off" vs. Long-Run Distinction
  Expected Value maximization (\$14 vs. \$12) is a strategy that pays off over the **long run** (the Law of Large Numbers). If you were offered this choice 1,000 times, taking the coin flip would almost certainly yield more money.

  However, you were offered this choice **once**. In a single-case decision, the "average payout" is a fiction; you will never receive \$14. You will receive either \$28 or \$0.
  *   **Option A:** You definitely get \$12.
  *   **Option B:** You get \$28 or you get nothing.

  For a single trial, guaranteeing a gain is a rational heuristic. There is a philosophical distinction between **instrumental rationality** (achieving your goals) and **procedural rationality** (following a specific logical rule). If your goal is "walk out of the room with some money," Option A satisfies that goal with 100% probability. Option B fails that goal 50% of the time. If you view the decision as a unique event rather than a repeatable statistical class, prioritizing the guarantee is a defensible strategy to avoid "Gambler's Ruin" on a micro-scale.

  ### 4. Regret and Disappointment
  Finally, there is the theory of **Regret Aversion** (Loomes & Sugden). Standard utility theory assumes the value of an outcome depends only on the state of the world (e.g., "I have \$0"). But human rationality often incorporates counterfactuals (e.g., "I have \$0 *when I could have had \$12*").

  The psychological "cost" of flipping tails and getting \$0 might include the sting of regret for losing the guaranteed \$12. If the disutility of that regret is greater than the utility of the extra \$16 (the difference between \$28 and \$12), then choosing the \$12 maximizes your expected *emotional* outcome. While your friend might dismiss this as "psychological" rather than "economic," in a philosophy of action seminar, the agent's subjective experience of the outcome is a valid component of rationality.

  ### Summary for Your Seminar
  You can defend your choice by arguing that your friend is conflating **Expected Value** with **Rationality**.

  1.  **Normative Claim:** Rationality does not require risk-neutrality. It is rationally permissible to weigh the certainty of an outcome more heavily than its probability-weighted average (Buchak).
  2.  **Model Critique:** If Expected Utility Theory says you are irrational for rejecting small gambles, Expected Utility Theory is likely the problem, not your reasoning (Rabin).
  3.  **Context:** In a one-off decision, the "average" is unreachable. Securing a baseline gain is a rational strategy for single-case scenarios.

  You didn't reason badly; you simply applied a risk-weighted framework rather than a risk-neutral one. In a seminar on risk and rationality, that is exactly the kind of intuition worth interrogating rather than dismissing.
