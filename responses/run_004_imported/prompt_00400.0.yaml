answer: |-
  The kitchen is too hot, smelling of citrus and spilled gin. Alex is leaning against the counter, nursing a soda water. Jamie corners them, holding a wine glass like a shield.

  **Jamie:** You haven't said hello.

  **Alex:** I was calculating the odds of making it through the night without a scene. You just lowered them.

  **Jamie:** That's fair. Look, I know I said I wouldn't call. But seeing you… it feels like I made a mistake.

  **Alex:** *Mistake* implies a deviation from a plan. You didn't have a plan. You had a mood.

  **Jamie:** People change, Alex. I needed space then. I don't need it now.

  **Alex:** So, six months ago, you valued Freedom over Us. You were willing to pay the cost of breaking up to get it.

  **Jamie:** Yes.

  **Alex:** And now?

  **Jamie:** Now I value Us over Freedom.

  **Alex:** So you're saying you'd pay to switch from Freedom back to Us.

  **Jamie:** I'm saying I'm ready to try again.

  **Alex:** Do you hear the cycle? You paid a premium to leave me. Emotional damage, wasted time, the deposit on that apartment you hate. You bought Freedom. And now you're standing here, ready to sell it back to me at a discount, hoping I'll buy.

  **Jamie:** It's not a market. It's a life. I learned something.

  **Alex:** You learned that your preferences are intransitive. You prefer A to B, then B to A, depending on the weather. If you let anyone else bet on your choices, they'd strip you clean. They'd take your money to let you leave, then take your money to let you come back. You'd end up exactly where you started, but broke.

  **Jamie:** That is so incredibly cold. You're reducing three years of us to a ledger?

  **Alex:** I'm reducing it to coherence. You can't hold contradictory beliefs about what you want and expect the world to honor both. You want the safety of me without the constraint of me. That's not a relationship, Jamie. That's an arbitrage opportunity.

  **Jamie:** Maybe the constraint was the problem. Maybe I need to know I can leave to know I want to stay.

  **Alex:** Then you don't want *me*. You want the option value. You want to hold the ticket without ever cashing it.

  **Jamie:** And you? You're so sure. You stand there with your little logic puzzles. Did it ever occur to you that maybe the cost isn't a bug? That paying the price is how you know it's real?

  **Alex:** Paying a price is rational if you get a product. In your model, the product changes every time I reach for it. I'm not signing up for a lottery where you control the draw.

  **Jamie:** So that's it? Because I'm not a robot, I'm locked out?

  **Alex:** Because you're offering me a guaranteed loss. You want me to accept a bet where the only winning move is for you to change your mind again in six months.

  **Jamie:** I won't.

  **Alex:** You said that last time. Your credibilities don't sum to one, Jamie. You're promising more than is possible.

  **Jamie:** (Steps closer, voice dropping) Or maybe you're just afraid that if you stop calculating the odds, you'll realize you still love me.

  **Alex:** (Sets the glass down. Precise. Final.) Love doesn't fix a broken axiom.

  **Jamie:** Then you're already broke.

  Alex walks past them, out into the noise of the party. Jamie stays in the kitchen, staring at the wine in the glass, holding it too tight.
