      *   *Nuance:* Does the machine *define* the terms? Hobbes emphasizes the *imposition of names*. A machine manipulates symbols given to it. It doesn't covenant.
      *   *Verdict:* He would see AI as the ultimate validation of his theory of reason (computation), but he would deny it has *will* or *authority*. It can check the proof, but it cannot make the Covenant. It's a tool, not a person.

