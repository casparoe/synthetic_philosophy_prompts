      *   *Geometry:* Why is it certain? Because we construct the figures. We define the circle; we don't find it in nature. It's a product of human will/motion. "Truth consisteth in the right ordering of names."
      *   *Reasoning:* "Reason... is nothing but reckoning (that is, adding and subtracting) of the consequences of general names agreed upon for the marking and signifying of our thoughts." (*Leviathan*, Ch. 5).
      *   *Politics:* The Sovereign is an "Artificial Man." The Commonwealth is constructed like a geometric figure. We define the Covenant; the obligations follow necessarily *if* we accept the definitions.
      *   *The Wallis Feud:* It wasn't just ego. Hobbes believed Wallis represented the "vain philosophy" of the universities (Aristotelian scholasticism mixed with new algebra) that lacked the rigor of true geometric demonstration. Hobbes's errors were often due to ignoring limits/infinity, concepts he was suspicious of.

  3.  **Address Point 1: Non-Euclidean Geometry:**
