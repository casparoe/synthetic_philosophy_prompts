  *(Self-Correction on Higher-Order Vagueness)*: This is the hardest part. Standard supervaluationism defines "Definitely A" as true on all admissible precisifications. If the set of admissible precisifications is sharp, there is a sharp boundary between "Definitely A" and "Indeterminate." Keefe's response is usually that the *set* of admissible precisifications is not sharply defined. I need to make sure Sam articulates this nuance without getting bogged down in technical jargon that kills the flow. He needs to say that the vagueness of "admissible" absorbs the higher-order vagueness.

  Let's write.

