      *   **Supervaluationist (Let's call him "Sam"):** Focused on semantic indeterminacy, the idea that meaning isn't fixed enough to decide borderline cases. He needs to defend against the "higher-order vagueness" objection (i.e., where does "definitely" become "not definitely"?).

