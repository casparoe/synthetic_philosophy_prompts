answer: |-
  **Setting:** *A seminar room, late afternoon. The whiteboard is covered in a numbered list from 1 to 100, representing heights in centimeters. Elena (Epistemicist) and Sam (Supervaluationist) are standing before it, markers in hand. They are midway through the "forced march."*

  **Elena:** *(Tapping person 54)* Tall.
  **Sam:** *(Hesitating)* Indeterminate.
  **Elena:** That's not a verdict, Sam. In a forced march, you have to say "tall" or "not tall." If you refuse to judge, you're opting out of the logic.
  **Sam:** I'm not opting out. I'm saying the predicate "tall" doesn't partition the set of people into two exhaustive subsets here. 54 falls in the penumbra.
  **Elena:** But look at 60. You'd say "tall." And 40? "Not tall." So there is a transition. My claim is simply that the transition happens *somewhere*. There is a specific number $n$ such that person $n$ is not tall and person $n+1$ is tall.
  **Sam:** And that's where you lose me. You're positing a metaphysical miracle. A one-millimeter difference in height constitutes a difference in kind regarding the property of tallness? That violates the supervenience of the semantic on the physical.
  **Elena:** It doesn't violate supervenience. The physical facts fix the semantic facts. It's just that *we* can't know which physical facts fix which semantic facts at the boundary. The cutoff is sharp, but it is *unknowable*.
  **Sam:** Unknowable how? Like not knowing the number of grains in a heap because you haven't counted them?
  **Elena:** No. Ordinary ignorance is contingent; you *could* count the grains. This ignorance is necessary. It stems from the nature of knowledge itself. Specifically, the **margin for error** principle.
  **Sam:** Walk me through it. Again.
  **Elena:** To know that person $n$ is tall, your belief must be *safe*. You couldn't easily have been wrong. But near the boundary, if you believe $n$ is tall, you're in a position where $n-1$ is visually indistinguishable. If you can't distinguish $n$ from $n-1$, you can't know $n$ is tall while $n-1$ is not. So, for knowledge to obtain, there must be a buffer. If $n$ is the first tall person, you cannot *know* $n$ is tall. The truth outruns our capacity to know it. The cutoff exists, but it lies in a blind spot created by the inexactness of our concepts.
  **Sam:** I see the move. You're saving classical logic—bivalence, excluded middle—by sacrificing the link between truth and knowability. You're saying the language is more precise than our access to it allows.
  **Elena:** Exactly. Language carves the world sharply; our cognitive grip is slippery.
  **Sam:** But Elena, consider the cost. You're saying there is a fact of the matter about whether a specific micro-shift in height changes a person's moral or social categorization. In my work, that's not just metaphysics; that's policy.
  **Elena:** Policy requires binary decisions, Sam. That's the point.
  **Sam:** Is it? Let's talk about my alternative. Truth isn't binary in the borderlands. A statement is **supertrue** if it is true on all *admissible precisifications* of the term "tall."
  **Elena:** I know the definition. "Tall" is vague because it admits multiple precise sharpenings. On some sharpenings, 54 is tall; on others, it's not. So "54 is tall" is neither supertrue nor superfalse. It's indeterminate.
  **Sam:** Right. And this captures the intuition that there is no *single* sharp line. There are many candidate lines, and none is privileged.
  **Elena:** Here's where we crash. You've just relocated the sharp boundary. You have a set of "admissible" precisifications. Is that set sharply defined?
  **Sam:** ...It can be vague.
  **Elena:** Ah. So there's a boundary between "admissible" and "inadmissible" precisifications?
  **Sam:** Not sharply.
  **Elena:** Then you have higher-order vagueness. But if you model that formally, say with a "definitely" operator, you usually end up with a sharp boundary between the "definitely tall" and the "merely borderline." If you don't, your logic isn't classical. If you do, you're an epistemicist in sheep's clothing. You've just pushed the Sorites back one level. Where does "definitely" stop?
  **Sam:** *(Pacing)* That's the standard charge. But you're assuming that to model higher-order vagueness, I need a sharp cut-off between the admissible and the inadmissible. I don't. I can say the *set* of admissible precisifications is itself vague.
  **Elena:** How do you formalize that without infinite regress?
  **Sam:** I don't need to formalize the vagueness of admissibility to use the logic. The point is that "supertruth" tracks assertibility. I can assert "60 is tall" because it's true on all reasonable ways of making "tall" precise. I cannot assert "54 is tall." The boundary isn't a line in the world; it's a gradient in our linguistic practices.
  **Elena:** But your logic still validates classical tautologies like $P \lor \neg P$. If "54 is tall" is indeterminate, then "54 is tall or 54 is not tall" is supertrue. How?
  **Sam:** Because on every precisification, either the left side is true or the right side is true. Even if we don't know which one.
  **Elena:** So you keep classical logic by emptying "truth" of its connection to specific states of affairs in the borderline.
  **Sam:** I keep it by recognizing that truth is a property of statements relative to interpretations.
  **Elena:** *(Turning back to the board)* Let's bring this to your classifier problem. You said your model flipped from "not harassment" to "harassment" on one specific comment.
  **Sam:** Right. Ninety near-identical comments. One flip.
  **Elena:** That model is an epistemicist. It *has* to draw a line. It operates on bivalence. If it didn't, it couldn't act.
  **Sam:** But it shouldn't pretend the line is natural. That's the danger. If the engineers treat that cutoff as a *discovery* of the true boundary of harassment, they're reifying a threshold that doesn't exist.
  **Elena:** But they have to moderate. If they say "this is indeterminate," the post stays up. That's a decision.
  **Sam:** It is. But acknowledging the vagueness allows for a margin of error in the *policy*, not just in the knowledge. We can build a "grey zone" where human review is triggered. Your epistemicism says the grey zone is an illusion; the post *is* harassment or it *isn't*, we just don't know.
  **Elena:** I'm saying the post *is* one or the other relative to the policy rules. If the rules are vague, the cutoff is unknowable. If the rules are precise, the cutoff is knowable. Your model has precise weights. So the cutoff is real.
  **Sam:** The weights are precise, but the *label* "harassment" is not. The model is mapping a vague concept onto a precise vector space. The flip you saw isn't a metaphysical boundary; it's an artifact of the threshold setting.
  **Elena:** Which is exactly what I mean by unknowable cutoffs in natural language! When you set the threshold, you're picking an arbitrary $n$. You don't know if $n$ is the "true" boundary because there is no epistemic access to it.
  **Sam:** No, because there *is* no true boundary. That's the disagreement. For you, the boundary is hidden. For me, it's absent.
  **Elena:** If it's absent, how do you explain the contradiction? If I say "54 is tall" and you say "54 is not tall," and we're both admissible, have we contradicted reality?
  **Sam:** We've contradicted each other's precisifications, not reality.
  **Elena:** That sounds like relativism.
  **Sam:** It's semantic indecision. Look, let's go back to the higher-order charge. You said I push the problem back.
  **Elena:** I did. Where does "admissible" end?
  **Sam:** Suppose I admit there is a sharp boundary between admissible and inadmissible in the model. I accept that cost. Why is your cost lower? You posit a sharp boundary in *nature* (or usage) that is causally inert. It makes no difference to behavior, to assertion, to reasoning. It's a ghost line. My sharp boundary is in the *model of semantics*, which I admit is an idealization. Yours is in the *facts*.
  **Elena:** It's not causally inert! It explains why we hesitate. We hesitate *because* we are near the boundary of knowledge. The margin-for-error principle predicts the hesitation.
  **Sam:** My view predicts the hesitation too. We hesitate because there is no fact to grasp.
  **Elena:** But if there's no fact, why does the Sorites argument feel valid but unsound?
  **Sam:** Because the inductive premise—"if $n$ is tall, $n+1$ is tall"—fails in supervaluationism. It's not supertrue. It's false, because there is a precisification where $n$ is tall and $n+1$ is not.
  **Elena:** But that precisification is arbitrary!
  **Sam:** All precisifications are arbitrary. That's the point of vagueness.
  **Elena:** *(Sighs, capping her marker)* So we're back to the start. I say the arbitrariness is in our access. You say it's in the meaning.
  **Sam:** Essentially. But consider the classifier again. If you treat the model as Epistemic, you assume there is a "correct" label it missed or found. If you treat it as Supervaluationist, you recognize the label is unstable in that region.
  **Elena:** And if you recognize it's unstable, you might stop trusting the model in the borderline.
  **Sam:** Exactly. You build the grey zone.
  **Elena:** But eventually, the grey zone needs a border. Who decides the border of the grey zone?
  **Sam:** *(Smiles)* Now you're asking about higher-order vagueness again.
  **Elena:** *(Smiles back)* Someone has to draw the line, Sam. Even if it's just to say "we don't know."
  **Sam:** True. But admitting we don't know is different than pretending there's a fact we're missing.
  **Elena:** In practice? Maybe. In logic? I still say bivalence holds. 54 is tall or it isn't.
  **Sam:** And I say: on some ways of reading "tall," yes. On others, no. And none of those ways is the *one true way*.
  **Elena:** Then we can't moderate the forum.
  **Sam:** Then we moderate it with humility.
  **Elena:** *(Looks at the board, at the flip point)* Humility doesn't stop the harassment.
  **Sam:** No. But it stops us from claiming the machine found the truth.
  **Elena:** *(Pauses)* Fair. But I'm still marking 54 as "not tall" in my notes.
  **Sam:** And I'm leaving it blank.
  **Elena:** Then we'll never finish the march.
  **Sam:** That's the nature of the beast, Elena.

  *(They stand in silence for a moment, looking at the gap between 53 and 54.)*
