answer: |-
  Good morning, everyone. Thanks for making the trip. I know looking around this room, we've got some distinct perspectives on how to decide what's worth funding. Some of you come at this with a very sharp mathematical lens, ready to calculate expected value down to the decimal point. Others of you are coming from a place of deep practical intuition, where a claim that sounds too good to be true usually is. And honestly, if we didn't have both of those instincts in this room, we'd probably be doing our jobs wrong.

  We are here to fund the stuff that everyone else ignores. The long shots. The fringe. The high-variance bets. By definition, most of what we look at is going to fail. But the whole point of this foundation is that if one of these things actually works, the payoff isn't just big, it's transformative. That means we cannot afford to be the kind of grantmakers who shut the door the second a probability looks small. If we only funded things with a clear path to success, we'd just be another conventional charity, and there are plenty of those already.

  But there is a trap on the other side, and we need to name it without getting bogged down in the philosophy of it. If we simply let the magnitude of the potential outcome do all the work, we become vulnerable to anything with a big enough number attached to it. We all know the instinct. Someone claims their project could save a trillion lives, and even if the chance is one in a billion, the math says write the check. But if we follow that logic to its end, we don't fund research; we fund fantasies. We end up handing our entire endowment to the first person who claims they can hack the simulation we're living in. That helps no one.

  So, for this quarter, I want us to operate under a specific decision rule. It's not a formula, and it's not a hard cutoff. It's a heuristic about evidence weight. The rule is this: The scale of the claim must be matched by the density of the mechanism.

  When you see a project that promises an astronomical impact, I don't want you to just multiply that number by your best guess of the probability. I want you to look at the chain of events required to get there. If the project relies on a breakthrough in physics that hasn't happened yet, plus a policy shift that's never occurred, plus global adoption within a year, the complexity of that chain acts as a discount rate. We aren't ignoring the small probability, but we are acknowledging that huge claims require robust scaffolding, not just a big numerator. We are looking for projects where the bottleneck is funding or timing, not where the bottleneck is basic reality.

  I want to be clear about what this costs us. Adopting this stance means we will inevitably pass on some projects that actually could have worked. There will be times when a genuine black swan looks exactly like a mugging attempt. It will look too crazy, the evidence will be thin because the idea is new, and we will reject it. That is the price of staying solvent and staying sane. I am willing to pay that price. I would rather miss a real opportunity than fund a dozen illusions. We are here to be catalytic, not to be ATMs for wishful thinking.

  So as you listen to the pitches today, I'm asking you to hold both sides of this tension. For those of you who love the math, remember that the inputs are often guesswork dressed up as data. For those of you who trust your gut, remember that gut feelings are calibrated on normal risks, not existential ones. We need to meet in the middle. Look for the projects where the upside is massive, but the path to getting there is grounded in something we can actually touch and test.

  Let's be generous with our attention, but rigorous with our skepticism. If a pitch relies on you believing something impossible to make the numbers work, let it go. If a pitch relies on you believing something difficult but plausible, that's where we live. Let's get to work.
