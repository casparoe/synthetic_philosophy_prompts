answer: |-
  Here are 7 interview questions designed to corner Sidgwick on the tension between his rigorous ethics and his paranormal pursuits, including the specific cases and concepts you requested.

  ### 1. The Motive for the Mediums
  **Question:** Professor, in *The Methods of Ethics*, you establish yourself as a champion of cold, hard rationality. Yet, you spend two decades investigating telepathy and seances. To your contemporaries, this looks like a contradiction. Are you approaching the SPR (Society for Psychical Research) as a skeptic looking for facts, or as a philosopher looking for a metaphysical loophole?

  *   **Sidgwick's Likely Answer:** "I approach it precisely as I do ethics: with a commitment to impartial inquiry. The scientific method demands we investigate any phenomenon, however improbable, if there is testimonial evidence. To ignore it due to *a priori* materialism is just as dogmatic as believing it without proof. I seek not a loophole, but simply the truth, whatever it may be."
  *   **Sharper Follow-up:** "But 'truth' is neutral, whereas your interest seems specific. You aren't testing for poltergeists; you're testing for *survival*. If the goal is purely scientific, why focus almost exclusively on phenomena that would validate religious consolation?"

  ### 2. The Creery Sisters & The Fraud Problem
  **Question:** Let's talk about the Creery sisters. In 1882, the SPR hailed their card-guessing as strong evidence for telepathy. Later, it was revealed they were using signals and cheating. When that evidence collapsed, didn't it damage the credibility of the SPR's entire methodology? How do you defend a science that can be so easily duped by schoolchildren?

  *   **Sidgwick's Likely Answer:** "It was a disappointment, certainly, but not a fatal one. It taught us that our controls were insufficient, not that the inquiry was invalid. Fraud exists in every field of science, from physics to biology. We tightened our protocols. The existence of counterfeit currency does not prove there is no genuine money."
  *   **Sharper Follow-up:** "Counterfeit currency assumes genuine money exists. In physics, you have reproducible laws. Here, every time you find a 'genuine' note, it turns out to be counterfeit. At what point does the prevalence of fraud suggest the 'genuine article' is a myth you're desperate to find?"

  ### 3. Moving the Goalposts of Evidence
  **Question:** You often speak of "cumulative evidence"—the idea that many weak testimonies add up to a strong proof. But in logic, a thousand hearsays do not equal one fact. Are you applying a lower standard of proof to psychical research than you would to a utilitarian calculation, simply because the stakes feel higher?

  *   **Sidgwick's Likely Answer:** "We do not accept hearsay. We require cross-examination and controlled conditions. However, human testimony is the basis of history and law. If we reject all testimony that contradicts our current understanding of natural law, we freeze scientific progress. I ask only that the evidence be weighed, not dismissed."
  *   **Sharper Follow-up:** "In law, testimony is weighed against physical evidence. Here, the testimony *is* the only evidence, and it contradicts all physical laws. Isn't 'cumulative evidence' just a polite way of saying 'we haven't found a smoking gun yet, so please keep believing'?"

  ### 4. The Dualism of Practical Reason
  **Question:** This is the core of your philosophy. In *Methods*, you argue that without a moral order to the universe—where virtue is ultimately rewarded—self-interest and morality are irreconcilable. Did you found the SPR because you needed empirical proof of an afterlife to make your own ethical system work?

  *   **Sidgwick's Likely Answer:** "I would not say I founded it *because* I needed proof, but rather that the need for such proof made the inquiry urgent. If morality is to be rational, there must be a cosmic sanction. If psychical research can demonstrate survival, it bridges the gap between duty and self-interest. It is a philosophical necessity, yes, which is why the scientific investigation is so vital."
  *   **Sharper Follow-up:** "That sounds dangerously like wishful thinking disguised as inquiry. If your ethics *require* ghosts to function, can you ever truly be objective when testing for them? Or are you just trying to empirically verify a premise you've already accepted?"

  ### 5. The Presidential Admission
  **Question:** In your 1882 presidential address, and again later, you admitted that after years of work, the SPR had not produced a single piece of evidence that compelled universal assent. You acknowledged the results were inconclusive. Why continue to lead an organization that, by your own admission, had failed to find its object?

  *   **Sidgwick's Likely Answer:** "Negative results are still results. We have cleared away much charlatanry and established that if these phenomena exist, they are subtle and elusive. Science is often a process of elimination. To stop because the answer is difficult would be an abandonment of intellectual duty."
  *   **Sharper Follow-up:** "Elimination works when you know the thing you're hunting exists. If a doctor spends 20 years looking for a virus that never shows up, at some point they have to diagnose the patient as healthy. When does 'intellectual duty' become an excuse to avoid accepting a negative answer?"

  ### 6. The Cost to Legacy
  **Question:** Philosophers like G.E. Moore and Bertrand Russell admired your ethics but were baffled or embarrassed by your psychical research. Do you fear that your pursuit of the paranormal will overshadow your contributions to utilitarianism, marking you as a great logician who lost his way?

  *   **Sidgwick's Likely Answer:** "I am concerned with the truth, not my reputation. If I am wrong about psychical research, let history correct me. But if I am right, the implications for humanity dwarf any ethical theory. I would rather be remembered as a fool for seeking the ultimate truth than a sage for ignoring it."
  *   **Sharper Follow-up:** "But if you are wrong, you haven't just ignored the truth; you've lent your immense intellectual authority to spiritualists and charlatans who used your name to sell tickets to seances. Isn't there a moral cost to that, regardless of your intentions?"

  ### 7. The Hardest Question (The "Cope" Check)
  **Question:** Professor, let's be plain. You spent the second half of your life chasing whispers in the dark, testing mediums who mostly cheated, searching for a cosmic justice that never empirically appeared. You died without the proof you sought. Looking back: Was this twenty-year project a genuine scientific inquiry, or was it a twenty-year cope to comfort yourself against the silence of the universe?

  *   **Sidgwick's Likely Answer:** (Pause) "I... I cannot claim certainty. But I can claim integrity. If it was a cope, it was a cope enforced by the strictest scientific rigor I could apply. I did not allow myself to believe without evidence. If the universe is silent, I have done my duty by listening as hard as any man could. That must be enough."
  *   **Sharper Follow-up:** "Listening hard doesn't make the silence meaningful, Henry. If the universe is silent, the 'duty' to listen is just a story you told yourself so you wouldn't have to face the void. Can you admit that maybe the only thing you proved was that even the greatest logician can't reason his way out of loneliness?"
