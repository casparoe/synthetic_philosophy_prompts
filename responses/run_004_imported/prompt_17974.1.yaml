      *   **Individuation:** Souls are individuated *initially* by their relation to a specific body/matter. Once established, they retain their individuality after death (against Averroes).
      *   **The Flying Man:** Establishes that the soul is aware of its own existence independently of the body. It proves the soul's substancehood, not necessarily its origin.
      *   **Transmigration (*Tanāsukh*):** Rejected. Why? Because a soul is naturally attached to *its* body. A second body cannot receive the *same* soul because the soul's perfection is tied to managing *that* specific matter. Also, the *mizaj* prepares for *a* soul, not a specific pre-existing one.

