answer: |-
  **Setting:** *Rome, 1598. A quiet corner of the Collegio Romano. Father Suarez (Jesuit, Molinist) and Father Alvarez (Dominican, Banezian) share a flask of wine. The air is thick with the tension of the Congregatio de Auxiliis.*

  **Suarez:** Let us strip the scholastic varnish, Domingo. Two men sit in the pew. Both hear the same sermon. Both receive the same interior prompt. One rises to confess; the other hardens his heart. Why?

  **Alvarez:** Because God, in His eternal decree, willed to move the first will infallibly toward the good. He granted efficacious grace to the one, and merely sufficient grace to the other.

  **Suarez:** There it is. The magic word. *Efficacious.* But tell me: if the grace given to the second man was truly *sufficient* to convert, why did it fail? If it could fail, wherein lay its sufficiency?

  **Alvarez:** It was sufficient in power, Luis, not in event. Like a man with sight in a dark cave. He has the power to see, but without light, he does not. The second sinner had the power, but he refused the further motion required to act. He resisted.

  **Suarez:** So the difference lies in the creature? The sinner who converts makes himself to differ from the sinner who does not?

  **Alvarez:** No! Do not trap me. The distinction originates in God's will. He grants the *praemotio physica*—the physical premotion—to the first. This motion activates the will from potency to act. The second man receives the power, but not the activation. He remains in potency because God does not move him to act.

  **Suarez:** Then I must ask the question your Order fears. If God physically moves the will to consent, such that it *cannot* dissent, where is liberty? You speak of activation, but if the will is determined by this premotion to choose X, it cannot choose not-X. You have saved God's sovereignty by drowning human freedom. You make us puppets who feel like men.

  **Alvarez:** And you, Luis? You save freedom by shackling God. If the grace is not intrinsically efficacious, but depends on the creature's consent to *become* efficacious, then God's decree hangs on the whim of a sinner. Does the Creator wait upon the creature to know if His grace will bear fruit?

  **Suarez:** Not wait. *Know.* Through *Scientia Media*. Middle Knowledge. Before the decree to create, God knew not only all possible worlds, but all conditional futures. He knew that *if* Peter were placed in Circumstance A, he would freely deny Christ; but *if* placed in Circumstance B, he would freely repent.

  **Alvarez:** Counterfactuals of creaturely freedom. A knowledge that depends on the creature's determination, not God's.

  **Suarez:** It depends on nothing! It is simply true. God knows it. So, He chooses to create the world where the sermon is preached in Circumstance B, knowing the sinner will freely say yes. The grace is *congruous*. It fits the disposition God knows the man has. God is sovereign because He chooses the world; the man is free because, in that world, he could have done otherwise had the circumstances been different.

  **Alvarez:** But in the actual moment of choice, can he dissent?

  **Suarez:** Yes. The grace does not physically determine the will. It persuades. It invites.

  **Alvarez:** Then it is resistible. And if it is resistible, how can God promise salvation to the elect? If your grace can be thwarted by a stubborn will, then God's will is thwarted. You make the efficacy of grace hostage to the creature. In your system, God looks down the corridors of time, sees who will be stubborn, and adjusts His plan accordingly. He is not the First Cause; He is the Great Reactor.

  **Suarez:** And in yours, He is the Only Cause! If this *praemotio* infallibly produces the consent, then the will is determined. You claim it is "compatible" with freedom, but it is word salad. If I cannot say no, my yes means nothing. And consider the reprobate. In your view, God gives him sufficient grace, but withholds the premotion required to use it. Is that not a mockery? Offering a cure you know he cannot take without a further medicine you refuse to give?

  **Alvarez:** It is not a mockery; it is justice. All deserve damnation. If God saves one, it is mercy. If He leaves the other to his own resistance, it is justice. The defect is in the will that resists sufficient grace.

  **Suarez:** But why does it resist? Because it lacks the premotion! You circle back. The will resists because God does not move it to consent. So God wills the sin by omission of the motion.

  **Alvarez:** God wills to permit the sin, not cause it. The defect is from the creature. But you, Luis, you make God's knowledge contingent. If the counterfactuals are true prior to God's decree, there is a truth outside of God's essence that He must gaze upon to plan creation. You limit the Divine Simplicity.

  **Suarez:** I limit nothing. I protect the mystery. We agree that grace is necessary. We agree that without it, we fall. But you make grace a hammer that forces the door open. I say it is a key that fits the lock. God knows the shape of the lock via Middle Knowledge. He chooses the key. The lock still turns freely.

  **Alvarez:** And I say the lock is rusted shut. Only God's hand can turn it. If you say the lock turns itself because it "fits," you steal the glory from the Turner.

  **Suarez:** If you say the Turner forces the lock, you steal the reality of the turning.

  **Alvarez:** *(Sighs, swirling the wine)* We are at the precipice. If I press you, you verge on Pelagianism—making the first movement depend on the will. If you press me, I verge on Calvinism—making the will a slave.

  **Suarez:** Perhaps that is why Rome stays silent. We are both trying to hold a rope that is too thin for two men to hang upon.

  **Alvarez:** Then let us drink. To the mystery of Auxiliis. May God judge which of us called the other a heretic in vain.

  **Suarez:** To the mystery. And to the day the Pope tells us to stop fighting and start praying.
