answer: |-
  This is an excellent question that cuts to the heart of the shift from early 20th-century metaethics to the semantic externalism of the late 20th century. You have correctly identified the tension between Moore's internalist conceptual analysis and the Kripkean model of reference that later naturalists would adopt.

  Here is the reconstruction of the argument, followed by an evaluation of its force against synthetic naturalism and the historical gap you suspect.

  ### 1. Reconstruction of the Open Question Argument

  Based on the text from *Principia Ethica* (Chapter 1), specifically Moore's treatment of "pleasant" as a test case for "good," we can reconstruct the argument as follows:

  *   **Premise 1 (Definitional Identity):** If the moral property **Good** were identical to the natural property **$N$** (e.g., Pleasantness), then the term "good" would be synonymous with (have the same meaning as) the term "$N$".
  *   **Premise 2 (Substitutability):** If "good" and "$N$" are synonymous, then the question "Is an $N$ thing good?" would have the same semantic content as the question "Is an $N$ thing $N$?"
  *   **Premise 3 (Triviality of Tautologies):** The question "Is an $N$ thing $N$?" is a closed question; it is trivial, uninformative, and signifies a lack of understanding to ask it seriously.
  *   **Premise 4 (Openness of Moral Questions):** For any natural property $N$ proposed, the question "Is an $N$ thing good?" remains an **open question**. It is meaningful, non-trivial, and a competent speaker can coherently wonder about its truth without linguistic confusion.
  *   **Conclusion:** Therefore, "good" is not synonymous with "$N$". Consequently, the property **Good** is not identical to any natural property **$N$**.

  *(Note: Moore moves from "not synonymous" to "not identical" because, in his framework, property identity for abstract notions requires conceptual analysis.)*

  ### 2. Does this threaten Synthetic, A Posteriori Naturalism?

  **Short Answer:** No, not as reconstructed above.

  **Detailed Analysis:**
  Your intuition regarding the "Water = H2O" analogy is precisely correct. The Open Question Argument (OQA) is devastating against **Analytic Naturalism** (the claim that "good" *means* "pleasant" by definition), but it fails against **Synthetic Naturalism** (the claim that "good" *refers to* the same property as "pleasant," but this is a discovery, not a definition).

  Here is why the OQA fails against the synthetic naturalist:

  1.  **Sense vs. Reference:** The OQA relies on **Premise 1**, which assumes that if two terms refer to the same property, they must have the same meaning (sense). This is a Fregean descriptivist assumption. However, the "Water = H2O" model relies on the Kripke-Putnam distinction between *sense* (conceptual mode of presentation) and *reference* (the actual stuff in the world).
  2.  **The Coherence of Identity Questions:** As you noted, before the discovery of molecular chemistry, it was perfectly coherent for a competent speaker to ask, "Is water H2O?" The question was "open" conceptually, even though the identity was metaphysically necessary.
  3.  **The Synthetic Naturalist Move:** A synthetic naturalist argues that "Good" is a rigid designator for a certain natural property (say, social flourishing), just as "Water" rigidly designates H2O. The fact that we can meaningfully ask, "Is social flourishing good?" only shows that the *concept* of good is distinct from the *concept* of flourishing. It does not prove that the *properties* themselves are distinct.

  Therefore, Moore's conclusion ("No such naturalistic identification... can be correct") does not follow from the premises if one allows for a posteriori identities. The argument proves that "Good" is not *synonymous* with "$N$," but it does not prove that "Good" does not *refer* to $N$.

  ### 3. Can Moore Repair the Argument from the Text?

  You asked if Moore's argument can be repaired against this objection using **only what is in the passage above**.

  **The Answer:** No.

  The passage provided relies on the analogy that "'good' is a simple notion, just as 'yellow' is a simple notion." Moore argues that you cannot explain yellow to someone who doesn't know it; you can only point to it. He treats 'good' as a simple, unanalyzable quality apprehended by intuition.

  To repair the OQA against the synthetic naturalist, Moore would need to add a premise that blocks the "Water = H2O" analogy. He would need to argue something like:
  *   *"Unlike water, which is a complex physical kind discoverable by science, 'good' is a simple, non-natural quality that cannot be identical to a complex natural property."*

  However, within the text provided, this is an assertion, not an argument.
  1.  **The "Simple" Claim:** Moore asserts 'good' is simple. The synthetic naturalist can reply: "Water appears simple to the layman (a clear, drinkable liquid), but is actually complex (H2O). 'Good' may appear simple but be complex." Moore has no argument in this passage to rule that out other than insisting on his intuition.
  2.  **The "Non-Natural" Claim:** Moore concludes 'good' is non-natural *because* the question is open. But if the synthetic naturalist is right, the question is open *even if* it is natural. Moore is begging the question: he assumes that if it were natural, the question would be closed.

  Moore lacks the semantic machinery (rigid designation, causal theory of reference) to distinguish between "meaning the same" and "referring to the same." Without that machinery, he cannot see the gap you have identified. He assumes that if the reference were the same, the meaning *must* be the same, making the question closed. Since the question is open, he concludes the reference is different. This is a non-sequitur in light of later semantic theory.

  ### 4. Is this the gap exploited by Cornell Realists?

  **Yes, exactly.**

  Your suspicion is historically accurate. This is precisely the opening exploited by the **Cornell Realists** (Richard Boyd, David Brink, Nicholas Sturgeon) in the 1980s.

  *   **Their Strategy:** They accepted the Open Question Argument as a successful refutation of **Analytic Naturalism** (e.g., Utilitarian definitions of good). They agreed that "good" cannot be *defined* as "pleasure."
  *   **The Exploit:** However, they adopted the Kripke-Putnam semantics of natural kind terms. They argued that moral terms like "good" function like "water" or "gold." They refer to natural properties (e.g., homeostatic property clusters of human flourishing) via a causal-historical chain, not via a descriptive definition known to the speaker.
  *   **Result:** They argued that the "openness" of the question "Is flourishing good?" is merely epistemic (about our concepts), not metaphysical (about the properties). Therefore, Moore's OQA leaves Synthetic Naturalism untouched.

  ### Summary regarding Yudkowsky

  It is worth noting a slight divergence in the context you mentioned. Eliezer Yudkowsky uses the Open Question Argument to motivate that "Right" refers to a **complex computation**, whereas Moore uses it to argue 'Good' is a **simple, non-natural notion**.

  *   **Moore:** "Good" is simple/indefinable $\rightarrow$ Therefore it is not natural.
  *   **Yudkowsky:** "Right" is indefinable (by short formula) $\rightarrow$ Therefore it is a complex computation (which is natural/physical).

  Yudkowsky actually sidesteps Moore's "non-natural" conclusion by embracing the synthetic naturalist model (specifically a functionalist/computational version). He agrees with you that the "Water = H2O" model is the correct way to view the reference, even if the concept is opaque. He uses OQA only to show that you cannot find the *definition* in a dictionary, not to show that the *referent* is supernatural.

  **Conclusion:** You are correct. The Open Question Argument, as reconstructed from *Principia Ethica*, relies on the conflation of sense and reference. It successfully blocks definitional naturalism but fails against synthetic a posteriori naturalism. This is indeed the exact gap that Cornell Realists later exploited to rehabilitate moral naturalism. Moore offers no resources in the quoted text to close this gap without begging the question.
