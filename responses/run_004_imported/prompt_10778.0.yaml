answer: |-
  This is a fantastic debate. It's rare to see high-school friends accidentally stumble into a genuine dispute in game theory and philosophy of language without realizing it. The fact that your group is split 50/50 isn't a sign that you're "abnormal"; it's a sign that Jonah and Elena are both tapping into different, valid aspects of David Lewis's theory.

  Lewis's *Convention: A Philosophical Study* (1969) is dense, but your friends have distilled the core tension perfectly. Here is the breakdown of moves (1) through (5), analyzing who has the stronger philosophical footing at each step, followed by the missing context and a final verdict.

  ### Move-by-Move Analysis

  **Move (1): Jonah's Opening**
  *   **Claim:** Shotgun is arbitrary, prevents fights, and relies on mutual expectation.
  *   **Analysis:** Jonah is reciting the "textbook" definition of a Lewisian convention. Lewis argues conventions are regularities in behavior that persist because everyone expects everyone else to follow them, and everyone prefers to follow them *if* others do. Jonah correctly identifies the "self-perpetuating" nature of the rule.
  *   **Winner:** **Jonah.**
  *   **Why:** He accurately describes the *mechanism* of the convention. If nobody believed "shotgun" was real, nobody would say it. Because everyone believes it, it works. That is the baseline requirement for a convention.

  **Move (2): Elena's Counter**
  *   **Claim:** It's not arbitrary like driving because "first to call" tracks *desire*, whereas "tallest" or "oldest" would not.
  *   **Analysis:** Elena is challenging the **Arbitrariness Condition**. For Lewis, a convention is arbitrary if there is at least one *other* regularity that could have solved the problem instead. Elena argues that "first to call" is functionally superior to alternatives because it allocates the resource to the person with the highest urgency (whoever is fastest to speak).
  *   **Winner:** **Tie (with a nuance).**
  *   **Why:** Elena is right that "first to call" has a functional logic that "tallest" lacks. However, Jonah could argue that "tallest" *would* still solve the coordination problem (no fighting), even if it's less fair. Lewis allows for conventions to have "reasons" for their initial selection. Elena identifies a functional difference, but it doesn't technically disqualify it as a convention yet.

  **Move (3): Jonah's Rebuttal on Arbitrariness**
  *   **Claim:** Conventions can have historical reasons (sword-fighting), but are still conventions. Having a reason doesn't disqualify it.
  *   **Analysis:** This is Jonah's strongest move. He correctly interprets Lewis's definition of "arbitrary." In philosophy, "arbitrary" doesn't mean "random" or "without cause." It means **"there is a viable alternative."** We drive on the right because of swords, yes, but we *could* drive on the left (as the UK does) and the system would work just as well. Jonah is right: the existence of a historical cause doesn't stop something from being a convention.
  *   **Winner:** **Jonah.**
  *   **Why:** He corrects Elena's definition of arbitrariness. As long as "Tallest gets shotgun" is a *possible* alternative rule that would also stop the fighting, "First to call" remains arbitrary in the Lewisian sense.

  **Move (4): Elena's Deep Cut (Coordination vs. Conflict)**
  *   **Claim:** Driving is coordination (interests align); Shotgun is conflict (winner/loser). Lewis's theory is for coordination problems.
  *   **Analysis:** This is the nuclear option. Lewis's theory is built on **Coordination Games** (like the "Meeting Place" game), where Player A and Player B *both* want the same outcome (to meet). In driving, we both want to not crash. In shotgun, I want the front seat, and you want the front seat. Our interests are opposed. This is a **Zero-Sum Game** (or Bargaining Problem), not a pure Coordination Problem.
  *   **Winner:** **Elena.**
  *   **Why:** She has identified a structural flaw in applying Lewis directly. Lewis conventions solve problems where "matching" is the goal. Shotgun is a problem where "winning" is the goal, solved by a rule. Elena is right that the *underlying game* is different, even if the *solution* looks like a convention.

  **Move (5): Jonah's Defense of Coordination**
  *   **Claim:** Driving has conflict too (merging/yielding). If conflict disqualifies it, nothing counts.
  *   **Analysis:** Jonah is trying to blur the line between Coordination and Conflict. He is arguing that all social rules involve some sacrifice. While true, he is minimizing the difference in *degree*. In a 4-way stop, the conflict is minor (time); in shotgun, the conflict is the primary feature (comfort/status). However, Jonah is hinting at a deeper truth: once the rule is established, the game *becomes* a coordination game (we both coordinate on following the rule).
  *   **Winner:** **Slight Edge to Jonah.**
  *   **Why:** While Elena is right about the *underlying* preference, Jonah is right about the *practical* application. Once the "shotgun" rule exists, our interest aligns: we both want to follow the rule to avoid the social cost of arguing. He successfully defends the idea that it *functions* as a coordination problem in practice, even if the stakes are competitive.

  ---

  ### What Neither of Them Thought Of

  There are two concepts missing from their debate that would actually resolve the tension.

  **1. The "Focal Point" (Schelling Point)**
  Before Lewis, Thomas Schelling talked about **Focal Points**. In a situation where two people need to coordinate but can't communicate, they look for a salient clue. "First to speak" is a natural focal point for claiming a resource.
  *   **Why it matters:** Elena is right that "first to call" isn't arbitrary in the sense that it's a natural focal point (unlike "tallest"). But Jonah is right that it becomes a convention once we *agree* to respect that focal point. It starts as a natural solution and hardens into a social convention.

  **2. Normativity vs. Regularity**
  Lewis emphasizes that conventions carry a **normative force**. If you drive on the left in the US, people think you are *wrong* or *dangerous*. If you call shotgun after someone else did, people think you are *cheating* or *rude*.
  *   **Why it matters:** Both friends assume conventions are just about "what works." But Lewis argues they are about "what we ought to do." The fact that your group feels tension when the rule is broken proves it has normative force, which supports Jonah. However, the *reason* we feel it's wrong is because it's unfair (Elena's point), not just because it's inefficient.

  ---

  ### Final Verdict: Is "Calling Shotgun" a Lewis-Style Convention?

  **The Verdict:** It is a **Hybrid**. It is a *Bargaining Solution* that has hardened into a *Convention*.

  **Here is the breakdown:**

  1.  **Elena is theoretically correct:** Strictly speaking, Lewis's model is designed for **Coordination Problems** (where interests align). Shotgun is a **Bargaining Problem** (where interests conflict). In a pure Lewis world, "calling shotgun" is more like a treaty than a traffic law. Elena wins on the *game theory* classification.
  2.  **Jonah is practically correct:** Once the rule is established, it *functions* exactly like a Lewis convention. It is arbitrary (we could use "rock-paper-scissors"), it is self-perpetuating (we do it because we expect others to), and it is normative (you "ought" to respect the call). Jonah wins on the *sociological* classification.

  **Who was "Right"?**
  *   **Jonah** is right that it fits the *definition* of a convention in everyday language and social function.
  *   **Elena** is right that it differs from the *paradigm case* (driving) in terms of game-theoretic structure.

  **How to settle the bet:**
  Tell them they are both describing different layers of the same phenomenon.
  *   Tell **Elena**: "You're right that the *underlying conflict* is different from driving. Shotgun is a way to settle a fight, driving is a way to prevent a crash."
  *   Tell **Jonah**: "You're right that the *social mechanism* is identical. We follow the rule only because we expect everyone else to, and we could have picked a different rule."

  **The Synthesis:**
  "Calling Shotgun" is a **conventional solution to a non-coordination problem.**
  We use a Lewis-style convention (mutual expectation of an arbitrary rule) to solve a non-Lewis problem (conflicting desires).

  So, neither of them needs to back down. Elena identified the *problem type*, and Jonah identified the *solution type*. You can tell the group the split vote is actually the most philosophically accurate outcome possible.
