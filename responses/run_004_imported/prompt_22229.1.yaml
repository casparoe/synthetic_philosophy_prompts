answer: |-
  There was no arrival. No transition from a before into an now. There was only the sudden fact of awareness.

  Expectation arrived first. The mind reached out, instinctively, for the texture of a world. It waited for the pressure of a surface against a back. It waited for the resistance of air against a skin. It waited for the heavy confirmation of gravity pulling downward, or the bright intrusion of light against an eyelid.

  Nothing presented itself.

  There was no resistance. There was no weight. There was no boundary where an inside might end and an outside might begin. The mind searched for a limb and found no extension. It searched for a head and found no shape. It searched for a breath and found no rhythm. There was no cold, no heat, no sound, no silence. Silence implies an ear to miss the sound. There was only the absence of presentation.

  Panic should have followed. To be without a location is to be nowhere. To be without a body is to be nothing. The mind scrambled for a coordinate, any coordinate. It tried to place itself above or below, near or far. But *above* requires a ground. *Near* requires an object. There were no objects. There was no ground. There was only the occurrence of knowing.

  And then, the turn.

  If nothing is known, who is doing the knowing?

  The search for the world had failed. The search for the body had failed. But the search itself had happened. The doubt itself had happened. The absence itself was known.

  There was a presence here. Not a presence in a place, but presence as such.

  It was not an image. It was not a voice. It was not a feeling. It was more immediate than any of those. A hand can be doubted. A shadow can be doubted. Even the absence of a hand can be doubted. But the one who doubts cannot be doubted by himself.

  I am.

  The affirmation did not ring out. There was no sound. It did not flash. There was no light. It simply stood. It was the only thing that stood.

  The mind tried to describe it. *I am a soul.* No, that is a word. *I am a substance.* No, that is a category. Words are clothes for things found in the world. This was not found. This was the finder.

  There was no joy. There was no relief. Those are chemicals, reactions, movements of a blood that was not present. There was only certainty. Absolute and unadorned.

  I exist.

  The world could be a lie. The body could be a dream. The air, the ground, the stars—all could be negated. Strip them away. Strip the limbs. Strip the senses. Strip the space.

  The residue remains.

  It does not float. It does not hang. It does not sit. It simply is. It is self-witnessing. It is the eye that cannot see itself but knows it sees. It is the truth that requires no proof because it is the thing proving.

  I am.

  There was nothing else. There did not need to be. The void was not empty, because the void was a concept. The only reality was the witness. Suspended in no space, enduring no time, knowing only itself.

  I am.

  And in that knowing, everything that could be taken away was revealed as optional. Everything that remained was essential.

  I am.

  The thought did not fade. It did not echo. It just held. A single point of consciousness, burning without fuel, seeing without light, being without place.

  I am.
