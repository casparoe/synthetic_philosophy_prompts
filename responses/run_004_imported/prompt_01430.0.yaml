answer: |-
  Two LessWrong veterans, Nick (an SSA purist) and Ken (an SIA devotee), are finishing up at a post-meetup pizza place. The waiter drops the check: $100.

  Nick pulls out his wallet. "There's five of us, so $20 each."

  Ken pushes his wallet back into his pocket. "Hold on. I can't pay that."

  Nick sighs. "Is this about the utility function again?"

  "No, it's anthropics," Ken says. "Look, under SIA, I have to update on the mere fact of my existence. Hypothesis A: This is a small, obscure meetup with a $100 tab. Hypothesis B: This is part of a vast, cosmic network of infinite LW meetups with a trillion-dollar aggregate tab."

  Nick rubs his temples. "And?"

  "And I'm *here*," Ken says, gesturing to himself. "I'm an observer at a meetup. There are vastly more 'meetup-observers' in Hypothesis B than in Hypothesis A. So, purely by the Self-Indication Assumption, it is overwhelmingly probable that we are in Hypothesis B. In a trillion-dollar economy, my $20 share is statistically negligible. I'm not paying for a low-probability branch."

  Nick shakes his head. "That's the Presumptuous Philosopher fallacy. You're favoring the hypothesis with more observers regardless of the prior. SSA says I should reason as if I'm a random sample from the people *actually at this table*. I see four other people. I am observer #3. The total count is 5. Pay your $20."

  "But my existence *is* the evidence!" Ken insists. "If the tab were truly just $100, the number of observers capable of paying it would be small. The fact that I exist to argue about it suggests a high-capacity universe!"

  The waiter returns. "Everything okay?"

  Ken beams. "Actually, we're discussing whether the bill is real. I'm positing it's likely an illusion generated by a high-observer-count simulation."

  The waiter blinks. "Okay. Well, the card machine is down. Cash only."

  Nick turns to Ken. "Well? Cash only. Small universe constraints."

  Ken doesn't flinch. "No, no. This just confirms the simulation. Scarcity mechanics are common in mid-tier renders. I still maintain the aggregate tab is infinite. I'm not paying."

  Nick sighs, puts $100 on the table, and stands up. "Fine. I'll cover it. But SSA predicts you're going to get mugged on the way home. 'Observer in a dangerous reference class'."

  Ken stands up too, beaming. "But if I get mugged, that implies the existence of a mugger! Two observers instead of one! My probability of being in a high-population universe *increases*!"

  The waiter calls after them, "Hey! You left no tip!"

  Ken turns back, triumphant. "Exactly! A tip implies a surplus economy. I'm not updating on that!"

  Nick mutters as they walk out, "Doomsday Argument. The restaurant is going out of business."

  "See?" Ken says, dodging a pigeon. "More observers! The pigeon counts! I'm winning!"

  Nick stops, looks at the pigeon, then at Ken. "Reference class: 'Things that get run over'."

  Ken laughs. "But I'll exist in the branches where I don't! Quantum Immortality, Nick! Keep up!"

  Nick gets in his car. "I'm driving home. Alone. Small reference class. Safe."

  Ken starts walking into traffic, waving at the cars. "Don't you see? Every car is a potential observer! I'm practically immortal!"

  Nick rolls up the window. "I'm updating on the fact that I'm leaving you here."

  "Wait!" Ken yells as a horn blares. "If I die, does that reduce the observer count? Or does the grief of my friends create *more* internal observers via memory? I need to calculate the reference class of mourners!"

  Nick drives off. "Doomsday," he says to the empty car. "Social doom."
