          *   *Key Technical Point:* Ng & Russell (2000) showed that if $\pi$ is optimal for $R$, it might also be optimal for $R'$. Specifically, reward shaping ($F = \gamma \Phi(s') - \Phi(s)$) preserves optimal policies. Also, the trivial reward ($R=0$) makes *all* policies optimal, so the observed optimal policy is consistent with it.
