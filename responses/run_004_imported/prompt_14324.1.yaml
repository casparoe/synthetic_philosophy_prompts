      *   *Ending:* Ambiguity. Who is speaking? Who is thinking?

  5.  **Refining the Voice (The Philosophical Work):**
      *   I need to avoid saying "My right brain did this." The narrator shouldn't know the neuroscience. They should just experience it as *their* action that feels slightly off.
