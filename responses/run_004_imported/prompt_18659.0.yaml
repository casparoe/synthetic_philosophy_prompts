      *   **Implication 1: The Structural Limit (The "Can't"):**
          *   Focus on Sovereignty. States are "individuals."
          *   International law is not domestic law. It lacks enforcement without becoming a world state (which Hegel rejects).
          *   *Application to UN/Courts:* They are forums for negotiation, not sovereign overlords. They work only when great powers agree. When they don't, the "contingency" returns.
