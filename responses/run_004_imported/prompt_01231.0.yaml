prompt: |-
  so in english we just read Du Bois's essay 'Criteria of Negro Art,' the one where he goes 'all art is propaganda and ever must be' and argues art has gotta fight for Black folks' dignity and freedom, not just look pretty. but then i found out he actually trashed Claude McKay's novel Home to Harlem for being too gritty/lowdown (said reading it made him wanna take a bath, lol), even tho McKay was just depicting real Harlem street life. so theres clearly a tension in his own theory between the 'truth' half and the 'uplift' half. given that, what do you honestly think Du Bois would say about mainstream gangsta rap today (drugs, violence, hustling, etc)? would he defend it as necessary propaganda, or rip into it like he did McKay's book? i want actual reasoning based on what he argued, not just a vibes-based guess
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
