      *   **Round 2: Defining "Standing."**
          *   Elena: It's not about facts; it's about authority. You can't enforce a rule you break.
          *   Marcus: Authority comes from the role, not personal perfection.
      *   **Round 3: The "Weakness" vs. "Exemption" Distinction (Marcus's Challenge).**
