      *   *Adjustment:* Ensure Elena distinguishes between *sharing a fault* and *flouting the rule while enforcing it.*

  6.  **Final Polish:** Check pacing, voice distinctness, and ensure the philosophical terms (standing, tu quoque, normative authority) are used naturally or explained in context. (Decided to keep jargon minimal but concepts clear).

  7.  **Final Review against Prompt:**
