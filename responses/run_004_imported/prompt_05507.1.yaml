prompt: |-
  Okay so I had this long, kind of unhinged argument with my friend Theo last night that started out being about factory farming and somehow ended up in the deep end of philosophy of mind. Theo's been on an illusionism kick lately (Frankish, Dennett, that whole crowd) -- the view that phenomenal consciousness, the raw introspectively-obvious "what it's like"-ness of experience, isn't a real feature of our brains, just something introspection represents as being there when its not. I was trying to get him to admit this has a pretty dark implication for how we think about suffering: if the actual hurtfulness of pain, over and above the nociception and the wincing and the avoidance behavior, is just an artifact of introspection systematically misrepresenting what's going on in your head, then there's nothing left for our moral concern to actually latch onto -- factory farming and chronic pain aren't bad in the way we assume, we've just been fooled by our own introspection into thinking there's a "victim" when really there's just machinery running. Theo kept insisting illusionism doesn't get you anywhere near that conclusion, but it was 1am and all he could manage was "that's not what the view says" on repeat, with no actual explanation of what the view does say instead.

  So here's what I want from you: is my objection actually a real problem for illusionism, or am I smuggling in some assumption about what suffering has to be "made of" for it to matter -- one an illusionist would just reject from the start? Don't give me the diplomatic "there are considerations on both sides" treatment -- I want to know straight up whether this is a genuinely good objection, or whether I was just loosing an argument at 1am without realizing it.
