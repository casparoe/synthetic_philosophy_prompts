      2. However, rigid adherence ignores the "penumbra" of vagueness.
      3. Probation acknowledges the vagueness without dissolving the rule.
      4. Strongest Doubt: Precedent/Slippery Slope.

      *Refining the "Strongest Doubt":* The prompt asks to state it plainly. I will make sure it stands out.

      *Refining the "Sorites Engagement":* I need to make sure I don't just say "rules are rules." I need to explain *why* rules can be precise even if concepts are vague (Epistemicism/Stipulation). Or, better, use Supervaluationism: It is not *supertrue* that she qualifies, nor *superfalse*. She is in the gap. Our rule forces a truth value. We can mitigate this by creating a third value (Probation).

      *Okay, let's go with the "Third Value" approach.* It fits the "Probation" recommendation perfectly.

      *(Final check of constraints)*:
      - Short memo? Yes.
