answer: |-
  You have done an excellent job identifying the central tension in the literature. The distinction you found between **phenomenal unity** and **access unity** is indeed the fault line upon which the modern philosophy of split-brain cases rests.

  You are correct in your definitions, but the relationship between them is where the fierce disagreement lies. To answer your core question directly: **Yes, it is philosophically and empirically possible to argue that a split-brain patient suffers from access disunity while retaining phenomenal unity.** However, the "classic" interpretation of the data assumes both break down together.

  Here is a detailed comparison of the two concepts, how they apply to split-brain cases, and the specific researchers who argue for opposing sides.

  ---

  ### 1. Defining the Two Unities

  To understand the disagreement, we must sharpen the definitions you found. These terms largely stem from the work of philosopher **Ned Block**, though they have been adapted for unity specifically by philosophers like **Tim Bayne**.

  #### **Access Unity (Functional/Reportability)**
  *   **Definition:** This refers to the global availability of information within the cognitive system. If a mental state has access unity, the information contained in that state can be used by various downstream systems: speech, reasoning, long-term memory, and voluntary motor control across the whole body.
  *   **In Split-Brain Cases:** Access unity is clearly **fractured**. If an image is flashed to the left visual field (processed by the Right Hemisphere/RH), the patient cannot *say* what they saw (because speech is usually in the Left Hemisphere/LH). The LH is "access denied" to the RH's visual data. Furthermore, the hands can act at cross-purposes (e.g., one hand buttons a shirt, the other unbuttons it).
  *   **Consensus:** Almost no one disputes that split-brain patients lack *full* access unity. The debate is about what this implies for the mind itself.

  #### **Phenomenal Unity (Subjective Experience)**
  *   **Definition:** This refers to the "what it is like" aspect of consciousness. Phenomenal unity asks: Is there a single subjective field of experience, or are there two? If you see a red apple and hear a bell, does that redness and that soundness belong to the *same* "you"?
  *   **In Split-Brain Cases:** This is the mystery. Just because the LH cannot *report* the RH's experience (Access Disunity), does that mean the RH's experience isn't part of the same overall conscious field? Or does the inability to report imply the experience is happening to a *different subject* entirely?

  ---

  ### 2. The Core Debate: Do They Stand or Fall Together?

  The central question you asked is whether Access Disunity necessitates Phenomenal Disunity. There are three main positions in the literature.

  #### **Position A: The "Two Minds" Thesis (Both Unities Break)**
  *   **The Claim:** Access disunity implies phenomenal disunity. If the information cannot be globally accessed, it belongs to a separate stream of consciousness. Therefore, the surgery creates two distinct conscious agents in one skull.
  *   **The Argument:** The behavior is too conflicting to be one mind. If the left hand fights the right hand, there must be two "willers." If the LH confabulates a reason for an action the RH took, the LH is a separate agent lying about another agent's action.
  *   **Key Proponents:**
      *   **Michael Gazzaniga (Neuroscientist):** The father of split-brain research. He famously coined the term "The Interpreter" for the LH. He generally leans toward the view that the surgery results in two separate cognitive systems, often implying two separate conscious experiences.
      *   **Roger Sperry (Neuroscientist):** The Nobel laureate who performed the surgeries. He famously stated, "Everything we have seen indicates that the surgery has left these people with two separate minds, two separate spheres of consciousness."
      *   **Robert Puccetti (Philosopher):** Argued forcefully that there are literally two persons in a split-brain body.

  #### **Position B: The "Single Subject" Thesis (Access Breaks, Phenomenal Remains)**
  *   **The Claim:** Access disunity does **not** imply phenomenal disunity. The patient remains one conscious subject, but the *communication channels* between their cognitive modules are severed.
  *   **The Argument:** This view relies on the modularity of mind. Just because Module A (LH) can't talk to Module B (RH) doesn't mean they aren't part of the same overall "owner."
      *   **Tim Bayne (Philosopher):** This is his primary contribution. In his book *The Unity of Consciousness*, Bayne argues that we should not infer the number of subjects from the ability to report. He suggests that phenomenal unity is a primitive fact about experience that doesn't depend on cognitive access. He argues that the conflicting behaviors can be explained by a single agent with fragmented motor control, rather than two agents.
      *   **Evidence:** Bayne points to studies where split-brain patients show implicit processing across hemispheres. For example, if the RH sees a word and the LH has to guess it, they perform better than chance, suggesting some subterranean connection remains. If there were truly two separate minds, why would they help each other subconsciously?

  #### **Position C: The "Indeterminacy" or "Nuanced" Thesis**
  *   **The Claim:** The concepts of "one subject" or "two subjects" might be the wrong tools for the job.
  *   **The Argument:**
      *   **Thomas Nagel (Philosopher):** In his classic 1971 paper "Brain Bisection and the Unity of Consciousness," Nagel argued that we simply lack the conceptual framework to decide. He suggested the result might be a "duality" that isn't quite "two people" but isn't "one person" either.
      *   **Elizabeth Schechter (Philosopher):** In her recent book *Self-Consciousness and "Split" Brains* (2018), she offers the most nuanced contemporary view. She argues against the "two minds" view but also critiques Bayne's strong unity view. She suggests the hemispheres develop distinct *agential* systems (control over action) without necessarily constituting distinct *persons*. She focuses on "self-representation"—the LH represents itself as the agent, and the RH does too, but they might share a underlying phenomenal field.

  ---

  ### 3. Addressing Your Specific Question

  > *Could a split-brain patient, in principle, have access disunity... while still retaining some form of phenomenal unity underneath?*

  **Yes.** This is the position held by Tim Bayne and, in a modified form, Elizabeth Schechter.

  **How it works conceptually:**
  Imagine a computer with two monitors and two keyboards, but only one CPU.
  *   **Access Disunity:** Monitor A cannot display what is typed on Keyboard B.
  *   **Phenomenal Unity:** The processing power (the "experience") is still generated by the single CPU.

  In the split-brain context, this means the patient *feels* like one person, but their ability to integrate that feeling into speech and coordinated action is broken. The LH feels the urge to speak, the RH feels the urge to grab, but they cannot reconcile these urges into a single narrative *in the moment*.

  **Why the "Two Minds" view dominates popular science:**
  It is intuitively easier to explain conflicting hand movements by saying "there are two wills." It is much harder to explain how *one* will can simultaneously intend to button and unbutton a shirt without positing a fracture in the self. However, proponents of Phenomenal Unity argue that we all experience internal conflict (e.g., wanting to diet vs. wanting cake) without becoming two people; the split-brain is just an extreme, motor-level version of standard human ambivalence.

  ### 4. Summary of Key Figures and Stances

  | Researcher | Field | Stance on Unity | Key Argument |
  | :--- | :--- | :--- | :--- |
  | **Roger Sperry** | Neuroscience | **Disunity** (Both) | "Two separate spheres of consciousness." The data shows independent learning and emotion in each hemisphere. |
  | **Michael Gazzaniga** | Neuroscience | **Disunity** (Mostly) | The LH is an "Interpreter" that constructs stories to explain RH actions it doesn't understand. Implies separate agents. |
  | **Ned Block** | Philosophy | **Distinction** | Distinguished Access vs. Phenomenal consciousness generally. Provides the vocabulary for the debate. |
  | **Tim Bayne** | Philosophy | **Phenomenal Unity** | Access failure $\neq$ Subject failure. One subject with disconnected cognitive modules. |
  | **Thomas Nagel** | Philosophy | **Indeterminate** | We lack the concepts to count the subjects. It may be a unique state not covered by "one" or "two." |
  | **Elizabeth Schechter** | Philosophy | **Agential Disunity / Phenomenal Nuance** | Rejects "two persons." Argues for distinct systems of self-control within one subject. |

  ### 5. Recommendation for Further Reading

  Since you are piecing this together without formal training, I recommend tackling these specific texts in this order, as they map the evolution of the debate:

  1.  **Thomas Nagel, "Brain Bisection and the Unity of Consciousness" (1971):** This is the philosophical ground zero. It is accessible and lays out why the problem is so hard.
  2.  **Tim Bayne, *The Unity of Consciousness* (2010), Chapter 6:** Bayne explicitly tackles the split-brain case to argue for Phenomenal Unity despite Access Disunity.
  3.  **Elizabeth Schechter, *Self-Consciousness and "Split" Brains* (2018):** This is the current state-of-the-art. It is denser but resolves many of the binary traps of the earlier debate.
  4.  **Michael Gazzaniga, *Tales from Both Sides of the Brain* (2015):** For the neuroscientist's perspective (take his philosophical claims with a grain of salt, but the data descriptions are essential).

  ### Conclusion

  You have hit on the exact right distinction. The field has moved away from the blunt "two minds" conclusion of the 1970s. The current consensus among philosophers of mind (though not necessarily all neuroscientists) is that **Access Disunity does not prove Phenomenal Disunity.**

  It is entirely plausible, and argued convincingly by Bayne and Schechter, that the split-brain patient is a single conscious subject whose internal communication lines have been cut. The tragedy of the split-brain patient, on this view, is not that they became two people, but that they became one person who can no longer introduce their left hand to their right.
