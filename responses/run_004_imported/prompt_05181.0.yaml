answer: |-
  **The Metaphysics of Nothing: A Defense of Contrastive Causal Realism**

  The debate over causation by omission is often framed as a choice between fidelity to our intuitions and fidelity to our ontology. On one side, the Lewisian counterfactual account preserves the intuition that my failure to water the plant caused its death, but at the cost of an ontology bloated with negative existentials and a causal field so promiscuous it includes every non-action in the universe. On the other, the process-theoretic account preserves a rigorous physicalist ontology, but at the cost of denying that omissions are causes at all, relegating them to a second-class status of "quasi-causation" or explanation. Helen Beebee attempts to bridge this by arguing that omissive talk is purely explanatory, not causal.

  All three positions fail to fully resolve the tension. The Lewisian view collapses the distinction between causation and background condition; the Process view collapses the distinction between causation and physical interaction; Beebee's view collapses the distinction between causation and rational explanation.

  I argue that we can settle this dispute by adopting a **Contrastive Causal Realism grounded in Metaphysical Defaults**. The verdict is this: **Omissions are genuine causes, but causation is inherently a contrastive relation ($c$ rather than $c^*$ causes $e$ rather than $e^*$), and the relevant contrasts are fixed not by moral duty or conversational context, but by the modal stability of the system in question.** This view secures the reality of omissive causation without succumbing to profligacy, and it blocks the smuggling of normative duties into metaphysics by distinguishing *moral expectation* from *systemic default*.

  ### I. The Counterfactual Trap and the Process Overcorrection

  David Lewis's counterfactual theory of causation offers the most straightforward argument for omissive causation. If $C$ had occurred, $E$ would not have occurred; therefore, the absence of $C$ causes the presence of $E$. In the case of the philodendron: if I had watered it, it would not have died. Therefore, my not watering it caused its death.

  The strength of this view is that it captures the dependency relations that matter in science, law, and daily life. Biological systems depend on the absence of toxins and the presence of nutrients; mechanical systems depend on the failure of brakes as much as their engagement. To deny causation here is to render vast swathes of scientific discourse literally false or merely metaphorical.

  However, the Lewisian account pays a prohibitive price: profligacy. As you noted, the counterfactual dependence holds for the neighbor, the mail carrier, and the stranger on the other side of the planet. If causation is simply counterfactual dependence between events (or absences thereof), then all these agents are causes of the plant's death. This violates the fundamental constraint that causes must be *difference-makers* in a localized sense. If everything is a cause, nothing is.

  Process theorists like Wesley Salmon and Phil Dowe attempt to solve this by tying causation to the transmission of conserved quantities (energy, momentum). Since no physical process links my inaction to the plant's wilting, there is no causation. This elegantly solves profligacy: the stranger transmitted no energy to the plant, nor did I.

  But this solution is too austere. It forces us to say that the pilot's failure to pull up caused the crash only in a "quasi" sense, while the engine failure caused it in a "real" sense. This bifurcation is untenable. In a court of law, and in a crash investigation, the pilot's omission is treated as causally co-equal to the mechanical failure. If our metaphysics cannot accommodate the causal efficacy of preventions and omissions without a asterisk, it is the metaphysics that must yield, not the phenomenon. Process theory saves physics at the cost of causation.

  ### II. Beebee's Separation Thesis

  Helen Beebee offers a sophisticated middle path. She argues that we should distinguish *causation* (a worldly relation between events) from *causal explanation* (a discursive practice). On her view, omissions are never causes because there are no negative events to stand in causal relations. However, citing an omission is a perfectly valid way to *explain* an outcome.

  This view avoids ontological bloat. We don't need to posit "absences" as entities. But it fails to account for the normative force of causal attribution. When we blame an agent for an omission, we do so because we believe they *caused* the harm, not merely that they explain it. If causation is strictly physical transmission, then moral responsibility for omissions becomes unmoored from the metaphysics of harm. We are left saying, "You didn't cause the death, but we will punish you as if you did." This creates a disconnect between the metaphysics of the world and the ethics of our actions. Beebee saves ontology by severing the link between causation and responsibility, a price too high for a theory meant to ground moral and legal reasoning.

  ### III. The Verdict: Contrastive Realism with Metaphysical Defaults

  The solution lies in recognizing that the profligacy problem is not a problem for *causation* per se, but for a *binary* conception of the causal relation. We must adopt a **contrastive account of causation**, championed by philosophers like Jonathan Schaffer, but refine it to avoid pure contextualism.

  **1. Causation is Ternary, Not Binary**
  Causation is not a relation between $C$ and $E$. It is a relation between $C$ rather than $C^*$ and $E$ rather than $E^*$.
  In the case of the plant:
  *   **Effect:** The plant died ($E$) rather than survived ($E^*$).
  *   **Cause:** I failed to water it ($C$) rather than watered it ($C^*$).

  This immediately restricts the field. For the stranger on the other side of the planet to be a cause, we must ask: Did the stranger's failure to water ($C$) rather than watering ($C^*$) make the difference? Here, the counterfactual "If the stranger had watered the plant..." is not a relevant contrast because it violates the **modal stability** of the system.

  **2. Defaults are Metaphysical, Not Moral**
  This is the crucial move to avoid smuggling in normativity. Restriction strategies often fail because they appeal to "duty" or "normalcy" which seem subjective. However, we can ground the contrast class in **systemic defaults**.

  A "default" is not what *ought* to happen morally; it is what *would* happen given the intrinsic dynamics of the system absent external interference.
  *   **The Plant's Default:** Biologically, a plant in a pot without an irrigation system defaults to wilting. Watering is an *intervention*.
  *   **The Agent's Default:** For me, the owner, watering is a live option within my capacity and proximity. For the stranger, watering is not a live option; it is outside their causal field.

  Therefore, my omission is a cause because "Me watering" is a physically possible alternative within the causal model of the situation. The stranger's omission is not a cause because "Stranger watering" is not a valid contrast; it is not a stable possibility within the system's constraints. The profligacy vanishes not because we impose a moral duty, but because we recognize that causation requires a **feasible alternative**.

  **3. Solving the Normativity Worry**
  Your colleague from the law school is right that law relies on duty, but wrong that this proves causation is normative. The law uses *moral duty* to select from a pre-existing field of *metaphysical causes*.
  *   **Metaphysics:** Determines who *could* have made a difference (Capacity + Opportunity). This includes me, my neighbor (if they had a key), and the hired gardener. It excludes the stranger.
  *   **Law/Ethics:** Determines who *should* have made a difference (Duty). This selects me from the metaphysical candidates.

  By grounding the contrast class in capacity and systemic defaults rather than moral obligation, we prevent the metaphysics from collapsing into ethics. The stranger is not a cause because they lacked the *power* to be otherwise, not because they lacked the *duty*. I am a cause because I had the power to be otherwise. Whether I am *liable* is a further question.

  ### IV. Addressing the Objections

  **Objection 1: Isn't "Capacity" just as context-dependent as "Duty"?**
  It is context-sensitive, but not subjective. Capacity is determined by physical proximity, biological ability, and mechanical access. These are objective facts. While we may pragmatically choose which causal model to use, the causal relations *within* that model are objective. If I am in New York and the plant is in London, my "capacity" is zero. This is not a conversational implicature; it is a physical constraint.

  **Objection 2: Does this make causation too sparse?**
  No. It makes it precise. Under the binary view, there are billions of causes (everyone who didn't water). Under the contrastive view, there are only as many causes as there are agents with the capacity to intervene. This matches our scientific practice. In epidemiology, we say "lack of clean water caused the cholera," not "the lack of a vaccine caused the cholera" (if no vaccine existed). The contrast is fixed by the available interventions in the model.

  **Objection 3: What about "pure" absences where no agent is involved?**
  Consider a hole in a bucket causing it to empty. Is the hole a cause? Yes. The contrast is "Bucket with hole" vs. "Bucket without hole." The default state of a bucket is integrity. The absence of material is a deviation from the structural default. This requires no agent, only a deviation from a stable physical baseline.

  ### V. Conclusion

  The impasse in your seminar arises from trying to force omissions into a binary event-model of causation. If causation is a relation between existing events, omissions are ontologically suspicious. If causation is counterfactual dependence, omissions are promiscuous.

  The verdict is that **omissions are genuine causes**, because causation is fundamentally about **difference-making relative to a default state**.
  1.  **Ontology:** We do not need to posit "negative events." We posit actual events (my sitting on the couch) that fail to match a counterfactual alternative (my watering the plant) which was a live possibility in the system.
  2.  **Profligacy:** Solved by the contrastive requirement. The stranger is not a cause because their intervention was not a live possibility (a valid contrast) in the causal model.
  3.  **Normativity:** Solved by distinguishing *systemic defaults* (what the system does when left alone) from *moral duties* (what agents ought to do).

  Causation by omission is not causal explanation wearing a disguise. It is the real thing, provided we understand that causation is not a binary link between happenings, but a ternary relation between happenings, alternatives, and the stable backgrounds against which they stand. The law may rely on duty to assign blame, but it relies on this metaphysics to assign causation. We can have our cake (omissions are causes) and eat it too (the stranger didn't kill the plant), provided we acknowledge that the cake is sliced by the knife of contrast.
