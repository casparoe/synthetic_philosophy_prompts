  *(Self-Correction on "Free Bargaining"):* In 1880, the concept of "free contract" was under attack by radicals (the "freedom of contract" meant the freedom to starve). Edith defending "free bargaining" marks her as a specific *kind* of radical (perhaps individualist anarchist or old-school liberal radical). This is good characterisation. I should highlight this.

