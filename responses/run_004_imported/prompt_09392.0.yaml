answer: |-
  You are absolutely right to zero in on that second move. The "color names the color, shape names the shape" opening is the metaphysical hook, but the "Request Argument" (sometimes called the "Seeking Horse" argument) is where Gongsun Long actually engages with semantics and pragmatics. It is the strongest part of the dialogue because it moves from abstract ontology to concrete language use.

  You are also asking the right questions about the logical machinery. Here is an untangling of that specific move, the potential fallacies, and why scholars give him credit for proto-logic rather than dismissing him as a sophist.

  ### 1. Formalizing the "Request" Argument

  Let's reconstruct the logic of the passage you paraphrased. Gongsun Long is using a *Leibniz's Law* style argument (the Indiscernibility of Identicals), but applied to linguistic satisfaction conditions.

  *   **Premise 1:** If $X = Y$, then any condition satisfied by $X$ must be satisfied by $Y$.
  *   **Premise 2:** The request "Give me a horse" ($H$) is satisfied by a yellow or black horse.
  *   **Premise 3:** The request "Give me a white horse" ($WH$) is *not* satisfied by a yellow or black horse.
  *   **Observation:** The satisfaction conditions for $H$ and $WH$ differ.
  *   **Conclusion:** Therefore, $WH \neq H$ ("White horse is not horse").

  Logically, the form is valid. If $A$ and $B$ were truly identical, they would be interchangeable in all contexts (including requests) without changing the truth value or satisfaction conditions. Since they aren't interchangeable in this context, they aren't identical.

  ### 2. The "Slide": Intension vs. Extension

  Your suspicion that he is sliding between **intension** and **extension** is the standard objection, and it is largely correct—but with a twist.

  *   **Extensional View (The Objector):** The set of white horses is a subset of the set of horses. Therefore, a white horse *is* a horse (class inclusion). To say otherwise is to deny reality.
  *   **Intensional View (Gongsun Long):** The *concept* "white horse" contains the attribute [white] + [horse]. The *concept* "horse" contains only [horse]. Because the intension (the definition/requirements) of "white horse" is stricter than "horse," the two concepts are not identical.

  Gongsun Long is arguing that **difference in intension entails difference in identity.**

  Is this a fallacy? In modern logic, we distinguish between:
  1.  **Class Membership:** $x \in Horse$ (A white horse is a member of the class Horse).
  2.  **Concept Identity:** $WhiteHorse = Horse$ (The concept White Horse is identical to the concept Horse).

  The Objector is arguing for (1). Gongsun Long is denying (2). The "sophistry" charge comes from the fact that in natural language, "is" (*fei* in Chinese) usually implies class membership in this context. Gongsun Long forces an identity reading onto a copula that usually signals inclusion.

  **However,** he isn't just making a mistake; he is highlighting that natural language obscures logical distinctions. He is pointing out that "White Horse" is a **compound concept** that cannot be reduced to its head noun without loss of meaning.

  ### 3. A Charitable Reading: Compound vs. Simple

  If we want to be charitable (and many scholars, like A.C. Graham and Chad Hansen, do), we shouldn't read this as "White horses are not equines." We should read it as: **"The compound 'White + Horse' is not equivalent to the simple 'Horse'."**

  This is where the "Request" argument does the heavy lifting. It shows that language functions pragmatically. When I ask for a "horse," I am invoking a broader category. When I ask for a "white horse," I am invoking a specific restriction.

  Gongsun Long is essentially arguing for **semantic compositionality**. He is noticing that adding a modifier changes the reference class so significantly that the resulting term functions as a distinct logical unit.
  *   $Horse$ = Determinable
  *   $White Horse$ = Determinate

  You cannot swap the determinable for the determinate in a specific request without changing the outcome. In this sense, he is correct: "White Horse" is not functionally equivalent to "Horse," even if every white horse is ontologically a horse.

  ### 4. Why Proto-Logic and Not Just Sophistry?

  Scholars treat the *School of Names* (Mingjia) as proto-logicians for a few specific reasons that this argument highlights:

  **A. Isolation of Variables**
  Gongsun Long treats "White" and "Horse" as independent logical operators. He is exploring how predicates combine. In Western logic, this anticipates the distinction between $F(x)$ and $F(x) \land G(x)$. He recognizes that $F(x) \land G(x) \neq F(x)$. That is a genuine logical insight, even if the conclusion ("is not horse") sounds weird in English.

  **B. The Mass Noun Hypothesis**
  Chad Hansen famously argued that Classical Chinese nouns function more like mass nouns (like "water" or "gold") than count nouns ("a horse").
  *   If "horse" is like "water," then "white horse" is like "white gold."
  *   Is "white gold" the same as "gold"? In terms of material, yes. In terms of trade/value/reference, no.
  *   If you ask for "gold," I can give you yellow gold. If you ask for "white gold," yellow gold won't work.
  *   Under a mass-noun semantics, Gongsun Long's claim that "White Horse is not Horse" makes more sense. He is saying the *stuff* designated by "white horse" is not co-extensive with the *stuff* designated by "horse."

  **C. Reference vs. Predication**
  The "Request" argument shifts the debate from metaphysics to **reference**. He is showing that the *reference* of the term "white horse" is fixed differently than "horse." This anticipates Fregean distinctions between *Sinn* (sense) and *Bedeutung* (reference). Gongsun Long is arguing that because the *Sinn* differs, we cannot treat the terms as identical in discourse, even if they point to overlapping objects in the world.

  ### 5. The Crucial Particle: *Fei* (非)

  Finally, a note on the translation that might help your comps prep. The conclusion is *Baima fei ma*.
  *   *Fei* is often translated as "is not."
  *   But *Fei* is a negative particle that can mean "is not," "is not equivalent to," "is not approved as," or "is distinct from."

  If you translate it as "White horse is **not equivalent to** horse," the "Request Argument" becomes perfectly sound logic rather than sophistry.
  *   "Yellow horses satisfy the request for 'horse'."
  *   "Yellow horses do not satisfy the request for 'white horse'."
  *   "Therefore, the term 'horse' is not equivalent to the term 'white horse'."

  ### Summary for your Comps
  You are right that the "Request" move is the logical engine of the dialogue.
  1.  **Logical Structure:** It uses the Indiscernibility of Identicals applied to pragmatic satisfaction conditions.
  2.  **The "Trick":** It prioritizes **intensional identity** (concept equivalence) over **extensional inclusion** (class membership).
  3.  **Charitable Reading:** It is an early insight into **semantic compositionality** and the difference between **determinables and determinates**. It shows that compound terms have different identity conditions than their head nouns.
  4.  **Proto-Logic:** It treats language as a system of distinct markers where modifiers restrict reference, anticipating later distinctions in semantics and the logic of mass nouns.

  Gongsun Long isn't denying that white horses are animals; he is denying that the *name* "white horse" functions identically to the *name* "horse." The Objector is arguing ontology; Gongsun Long is arguing semantics. They are talking past each other, but Gongsun Long's side is the one that birthed the School of Names.
