prompt: |-
  So I've been going down a rabbit hole with MIRI's old "Embedded Agency" stuff (the Garrabrant/Demski sequence, plus that Yudkowsky and Herreshoff paper on tiling agents it keeps referencing), and I'm stuck on the "robust delegation" part, specifically the so-called Lobian obstacle to self-trust. I get the bare math in the abstract - Lob's theorem says a sufficiently powerful consistent formal system can't generically prove "if I can prove X, then X" for arbitrary X without thereby already being able to prove X outright - and apparently this is supposed to wreck an embedded agent's ability to trust a future version of itself, or a successor it builds, that reasons the same way it does. But every writeup I find just states the theorem and then hand-waves toward why that's a problem, and I can't actually picture the failure happening.

  Could you build me an actual toy example (people mention the "5-and-10" problem and something called the procrastination paradox as related cases, if those help) where you walk step by step through an embedded agent trying to use proof-based self-trust, and point to the exact spot where Lob's theorem is doing real damage - like show me the spurious proof or the wierd self-fulfilling behavior it produces - rather than it just being a vague analogy to Godel's theorems? My friend who's more into decision theory than me insists this is "just a technicality about first-order logic" and not a deep problem, which is what got me trying to actually nail down the mechanism instead of taking it on faith.

  And once there's an example on the table, i'd love your take on whether this is a genuinely fundamental problem for any embedded agent that wants to reason about and trust its own future reasoning, or whether it's mostly an artifact of insisting on classical proof as the trust mechanism specifically - e.g. does something like probabilistic or logical-induction-style reflection actually dodge the obstacle, or does a version of the same problem just resurface there in a different guise?
