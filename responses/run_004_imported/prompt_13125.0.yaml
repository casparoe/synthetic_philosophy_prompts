  7.  **Final Polish:** Ensure the distinction between "Premise-Based" and "Conclusion-Based" is clear. Ensure the recommendation is actionable. (Decided to recommend Conclusion-Based for the *final* vote, but Premise-Based for *deliberation* to get the best of both worlds).

