prompt: |-
  I host my high school's philosophy club podcast, and next week's guest is a philosophy professor who defends a strict Dennettian line on whether AI systems have beliefs: on her view, a system genuinely has beliefs and desires whenever the intentional stance -- treating it as a rational agent -- is what actually predicts its behavior, regardless of what's happening inside. Draft eight or nine interview questions that go beyond having her restate the position: I want one each on whether Dennett's own thermostat example is a welcome consequence of her view or an embarrassment she has to manage, on how her 'mild realism' escapes Searle's charge that she's only describing 'as-if,' observer-relative intentionality, and on whether a large language model's belief-like pattern should count for less if it's brittle under adversarial prompting in a way human belief isn't -- and for each, a short follow-up keyed to the answer she's most likely to give.
