      *   *The Synthesis:* If there is no material world to anchor change, and no continuous "Self" to experience the flow, then "Time" (as succession) collapses.
      *   *Key Insight:* For time to exist, $A$ must become $B$. But if the "I" perceiving $A$ is not the *same* "I" perceiving $B$ (because the self is just a bundle of momentary perceptions), then there is no one to witness the transition. Each moment is a discrete universe.
