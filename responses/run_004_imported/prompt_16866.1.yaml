          *   Define Masking/Antidotes. Poison + Antidote. Fragile Vase + Bubble Wrap.
          *   Why isn't this a fink? In finks, the *basis* is removed. In masks, the basis stays, but the *process* is blocked.
          *   Test RCA against Masking: Poison has basis $B$. Antidote is present. If ingested ($S$) and $B$ persists (it does!), does it kill ($M$)? No, because of the antidote.
          *   RCA predicts: Not disposed. Intuition: It is disposed (lethal poison), just masked.
          *   Result: RCA fails. Lewis's specific fix for basis-tampering doesn't stop downstream interference.
      *   **Further Patches (Fara/Choi):**
