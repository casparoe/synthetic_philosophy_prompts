answer: |-
  **Seminar Handout: The Conditional Analysis After Lewis**
  **Topic:** Powers, Conditionals, and the Limits of Reduction
  **Course:** Grad Metaphysics Seminar

  ### 1. The Humean Dream and the Simple Analysis

  The project begins with a seductive ambition: to naturalize modal force. If dispositions (fragility, solubility, toxicity) are real, they smell suspiciously like occult powers. The Humean strategy is to reduce them to something extensionally respectable: counterfactual conditionals.

  The **Simple Conditional Analysis (SCA)** proposes:
  > $x$ is disposed to manifest $M$ in response to stimulus $S$ iff, if $x$ were to undergo $S$, $x$ would manifest $M$.
  > $(D_{S,M}x \leftrightarrow (Sx \boxright Mx))$

  This is elegant. It trades mysterious powers for the logic of counterfactuals. But as your colleague argued over lunch, perhaps the obituary for SCA was written too soon. David Lewis, in *Finkish Dispositions* (1997), conceded that SCA was refuted by C.B. Martin's "electro-fink" cases, but offered a Revised Conditional Analysis (RCA) that supposedly saves the reductive project.

  Your colleague claims Lewis's fix neutralizes the threat, and that Dispositional Essentialists (like Bird) are abandoning a working model over technical glitches. I argue the opposite: Lewis saved CA from *finks*, but he could not save it from *masks*. And the failure of CA to handle masks without circularity is precisely what forces us toward primitivism—not as a victory, but as an honest admission of irreducibility.

  ### 2. The Finkish Refutation (Loss and Gain)

  To see why SCA died, we must distinguish the two directions of finkishness.

  **Finkish Loss (The Dead Wire):**
  Imagine a wire that is currently live (disposed to conduct). However, it is connected to an "electro-fink." If the wire is touched (stimulus $S$), the fink instantly detects the contact and removes the wire's conductivity (the causal basis) *before* current can flow.
  *   **Intuition:** The wire *is* disposed to conduct.
  *   **SCA Prediction:** If the wire were touched, it would conduct. This is **False** (because the fink intervenes).
  *   **Result:** SCA yields a false negative.

  **Finkish Gain (The Reverse Fink):**
  Imagine a dead wire (not disposed to conduct). It is connected to a device that detects touch and instantly *installs* conductivity before current flows.
  *   **Intuition:** The wire is *not* disposed to conduct (initially).
  *   **SCA Prediction:** If the wire were touched, it would conduct. This is **True** (because the device activates).
  *   **Result:** SCA yields a false positive.

  SCA is untenable. It conflates the *possession* of a disposition with the *success* of a counterfactual.

  ### 3. Lewis's Rescue and Its Limits

  Lewis's diagnosis was specific: SCA fails because it allows the **causal basis** of the disposition to vanish (in loss cases) or appear (in gain cases) during the evaluation of the counterfactual.

  Lewis's **Revised Conditional Analysis (RCA)** adds a clause holding the basis fixed:
  > $x$ is disposed to $M$ when $S$ iff there exists an intrinsic property $B$ (the causal basis) such that, if $x$ were to undergo $S$ and $B$ were to persist, $x$ would manifest $M$.

  **Does RCA work on Finks?**
  Yes. In the Finkish Loss case, the counterfactual antecedent requires the basis $B$ to persist. But in the fink scenario, touching the wire causes $B$ to vanish. Therefore, the antecedent "Touching + $B$ persists" describes a scenario where the fink *doesn't* do its job. In that scenario, the wire conducts. RCA correctly identifies the disposition. In Finkish Gain, there is no initial intrinsic basis $B$, so the analysis correctly denies the disposition.

  This is where your colleague stops. Lewis fixed the logic. So why aren't we all Lewisians?

  ### 4. The Masking Objection: A Different Species

  Masks and antidotes are not finks. In a fink case, the stimulus triggers a change in the *bearer's intrinsic basis*. In a masking case, the basis remains perfectly intact, but something *downstream* blocks the manifestation.

  **The Poison and the Antidote:**
  A sample of cyanide is disposed to kill if ingested. However, a specific antidote has been administered.
  *   **The Setup:** The molecular structure (basis $B$) of the cyanide remains unchanged. The antidote does not remove the toxicity; it chemically neutralizes the process *after* ingestion but *before* death.
  *   **The Test:** Apply RCA. Is there a basis $B$? Yes. If ingested ($S$) and $B$ persists (it does!), would the victim die ($M$)?
  *   **The Result:** No. Because the antidote is present, the victim does not die.
  *   **The Verdict:** RCA says the cyanide is **not** disposed to kill. Intuition says it **is** disposed (it is still lethal poison, merely masked).

  **The Bubble-Wrapped Vase:**
  A fragile vase is wrapped in perfect bubble wrap. It is dropped ($S$). Its molecular structure ($B$) persists. But it does not break ($M$).
  *   RCA predicts: Not fragile.
  *   Intuition: Fragile, but protected.

  **Why this matters:**
  Lewis's fix was designed for *basis-tampering*. Masks are *process-blockers*. Lewis's requirement that the basis persist is satisfied in masking cases, yet the counterfactual still fails. Therefore, RCA does not solve the masking problem. It solves the fink problem, but leaves the analysis vulnerable to external interference.

  ### 5. Can We Patch the Patch? (Fara and Choi)

  Can we save CA by adding a *ceteris paribus* clause? "If $S$, and $B$ persists, and **no masks are present**, then $M$"?

  This leads to a dilemma identified by philosophers like Sungho Choi and Michael Fara.

  1.  **The Circularity Charge:** To define "no masks are present," you essentially have to say "no factors are present that would prevent the manifestation of the disposition." But "prevent the manifestation of the disposition" presupposes the disposition itself. You are defining the disposition in terms of conditions where the disposition manifests. This destroys the reductive ambition. You aren't analyzing powers in terms of non-powerful conditionals; you're analyzing them in terms of conditionals that secretly rely on powers.
  2.  **The Specificity Charge (Fara):** Michael Fara suggests a "habitual" analysis: dispositions are tendencies to manifest in *appropriate* conditions. But "appropriate" just means "conditions where the manifestation occurs." This risks triviality. If every object has a disposition to do whatever it actually does in the conditions that actually obtain, the concept loses its explanatory grip on *unmanifested* powers.

  Choi attempts to refine the intrinsic basis requirement to exclude extrinsic masks, but this gets messy quickly. Is the antidote extrinsic? Yes. But what about internal masks (e.g., a biological immunity)? If we refine the basis to include "immunity to masking," we are again smuggling the modal force back into the base terms.

  **The Verdict on Patches:**
  You can technically save the Conditional Analysis by making the antecedent of the conditional sufficiently complex ("If $S$, and $B$ persists, and no finks, and no masks, and no antidotes, and..."). But at that point, the analysis is no longer **reductive**. It is merely a translation manual that requires you to already know all the modal facts to construct the antecedent. It loses its epistemic and metaphysical utility.

  ### 6. The Metaphysical Upshot: Primitivism or Relocated Mystery?

  So, where does this leave us?

  Your colleague argues that Dispositional Essentialists (DE) abandon a "perfectly good reductive project." I argue the project was never good; it was incomplete. The failure of CA in the face of masking cases demonstrates that **dispositional modality cannot be reduced to categorical conditionals.**

  Does this mean we should embrace Dispositional Essentialism or Primitivism about powers? **Yes.** But we must be clear about what this buys us.

  1.  **Why Primitivism Wins:** If CA fails, then dispositions are not *derived* from conditionals. They are the *truthmakers* for conditionals. The poison kills *because* it is toxic; it is not toxic *because* it would kill. This aligns with the DE view that properties are essentially powerful. It explains why the vase remains fragile even when wrapped: the power is intrinsic, even if the manifestation is extrinsically blocked.
  2.  **The "Relocated Mystery" Objection:** Critics (often Humeans) argue that Primitivism doesn't solve the problem; it just relocates the mystery from the conditional to the property. Instead of asking "What grounds the counterfactual?", we ask "What is this 'power'?"
      *   **Response:** This is a feature, not a bug. The mystery of modality is real. Humeanism tries to explain it away by reducing it to regularities or conditionals, but as we've seen, those conditionals require modal qualifiers (no finks, no masks) to work. Primitivism admits that modality is a fundamental feature of the world. It is better to have a fundamental category of "power" than to have a reductive analysis that secretly relies on powers to define its own antecedents.

  ### 7. Conclusion

  The Conditional Analysis is not "dinged up"; it is broken as a reductive tool. Lewis's RCA successfully handles finkish cases by securing the causal basis, but it cannot handle masking cases without invoking circular *ceteris paribus* clauses.

  Your colleague is right that Lewis solved the technical glitch of the fink. But he is wrong that this saves the reductive project. Masking cases show that the link between disposition and manifestation is not a logical or counterfactual necessity, but a causal one that can be interfered with.

  **The Takeaway for the Seminar:**
  We should accept that the Conditional Analysis fails. This failure is the primary motivation for Dispositional Essentialism. However, we must not pretend DE is a magic bullet. It does not "explain" powers in terms of something else; it posits powers as fundamental. It trades the mystery of reduction for the clarity of ontology. If you want a world without occult powers, you cannot have a world where poisons remain poisonous when antidoted. If you want the latter, you must accept the former.

  **Discussion Question:**
  *If we accept primitivism to save dispositions from masking cases, do we thereby commit ourselves to a world where every property is a power (Pan-Dispositionalism), or can we maintain a hybrid view where some properties are categorical and some are powerful? If the latter, how do we distinguish them without falling back into the Conditional Analysis?*
