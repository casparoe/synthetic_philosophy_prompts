      *   *Check:* Ending needs to feel unresolved or bitter, not "Elias learned to be faster."

  11. **Final Polish:** Check word count and flow.

  *(Self-Correction)*: Wait, if Mara commits to a stance, she risks mutual destruction too. Why is she winning? Because Elias values the deal more than her? No, because Elias is still *deciding* whether to commit. By the time he decides to commit, she has *already* committed. The window for counter-commitment is closed. The first mover sets the Schelling point.

  Let's write.

  *Setting:* A sterile conference room.
  *Characters:* Elias (Actuary/Strategist) and Mara (CEO).
  *Object:* The "Covenant" tablet.

  *Drafting thought:* Start in media res. The timer is running. Elias is calculating. Mara is ready to jump.

  *Word Count Check:* Keep descriptions lean. Focus on the internal monologue of Elias vs the action of Mara.

  *Ending:* Elias signs. Mara wins. The room is quiet. The paradox hangs in the air.

