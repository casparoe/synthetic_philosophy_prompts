answer: |-
  Your intuition is correct: Laudan's Pessimistic Meta-Induction (PMI) is indeed a probabilistic argument masquerading as a historical narrative, and it collapses under the weight of the reference class problem. However, the implications of this collapse are more radical than standard literature suggests. As you suspect, the same statistical pathology infects the Realist's primary defense, the "Divide et Impera" (selectivity) strategy.

  Here is the rigorous argument for why the reference class problem fatalizes the wholesale debate, extending the critique to the Realist's rescue attempt and concluding on the status of "retail" realism.

  ### I. The Formal Failure of Wholesale PMI

  The PMI is structurally an inference from a sample frequency to a single-case probability. It asserts:
  1.  **Premise:** In the reference class $C$ of past empirically successful theories, the frequency of falsity is high ($f(\neg T | S) \approx 1$).
  2.  **Assumption:** Current theory $T_{now}$ belongs to $C$.
  3.  **Conclusion:** $P(\neg T_{now} | S) \approx 1$.

  For this inference to be valid, the reference class $C$ must satisfy the condition of **homogeneity** (Reichenbach). The members of $C$ must be exchangeable with respect to the property of truth-value given success. If the class is heterogeneous, the base rate is unstable, and the inference is a base-rate fallacy.

  **1. The Instability of "Success"**
  The predicate "empirically successful" is not a stable property across the proposed reference class (e.g., "all successful theories since 1800"). In 1850, success might mean qualitative accord with calorimetric data; in 1950, it means quantitative prediction within statistical error bars; in 2020, it includes robustness across independent instrumental modalities (e.g., cryo-EM + X-ray diffraction).
  If we define $C$ broadly to include phlogiston and caloric to maximize sample size ($N$), we introduce massive variance in the *epistemic conditions* generating the success. The probability of truth conditional on success, $P(T|S)$, is a function of methodological rigor $M$. Since $M_{1800} \ll M_{2020}$, the class is not homogeneous. The base rate of truth is not a constant of nature; it is a function of historical time.

  **2. The Trade-off between Relevance and Sample Size**
  To fix the homogeneity problem, the antirealist must narrow the reference class to $C'$, containing only theories generated under methodological conditions relevantly similar to ours (e.g., "theories employing blind statistical testing and digital instrumentation").
  *   **If $C$ is broad:** The sample size is large, but the class is heterogeneous. The induction is invalid due to confounding variables (methodological evolution).
  *   **If $C$ is narrow:** The class is homogeneous, but the sample size approaches zero. There are no past theories sufficiently similar to QFT or the Standard Model to establish a reliable base rate.

  Consequently, the PMI cannot generate a specific probability value. It can only assert that we lack the data to assign one. This does not support the conclusion "current theories are probably false"; it supports "the probability is undefined." The wholesale antirealist argument thus fails to launch.

  ### II. The Reference Class Problem in "Divide et Impera"

  Realists (Psillos, Kitcher) attempt to evade the PMI by narrowing the reference class not by *method*, but by *theoretical component*. They argue we should not induce on whole theories, but on "working posits"—those components essential to the theory's success. They claim the retention rate of working posits is high, even if the retention rate of whole theories is low.

  This strategy fails because it suffers from the **same reference class instability**, compounded by a **retrospective classification bias**.

  **1. The Retrospective Identification Problem**
  To calculate the base rate of retention for working posits, one must identify the class $W$ = {past working posits}. However, "working" is defined functionally: a posit is working if it is retained in future successful theories.
  *   **The Circularity:** We identify $W$ *after* theory change has occurred. We look at Fresnel's ether, note that the transverse wave structure was retained, and classify it as a "working posit."
  *   **The Statistical Flaw:** To use this for a *predictive* induction about current posits, we need to know if *current* posits belong to the class $W$. But membership in $W$ is only verifiable at $t_{future}$.
  *   At $t_{present}$, we are effectively guessing membership in a class defined by future events. This is not a valid reference class for probabilistic inference. It is akin to calculating the survival rate of "people who will live to 100" by looking at a graveyard and selecting only those who died at 100+.

  **2. The Instability of "Essentialness"**
  Suppose we try to define $W$ prospectively using criteria like "causal explanatory power" or "derivation of novel predictions." We immediately face the reference class problem again.
  *   What counts as a "causal mechanism" in 19th-century continuum mechanics is ontologically distinct from a "causal mechanism" in quantum field theory.
  *   If we define the class broadly ("all explanatory posits"), we include caloric and phlogiston, and the retention rate drops (PMI returns).
  *   If we define the class narrowly ("all posits satisfying current criteria for causal reality"), the sample size vanishes (no past posits satisfy current QFT criteria).

  The Realist's selectivity strategy attempts to carve nature at its joints to save the induction. But the "joints" (the criteria for what counts as a real posit) shift with theoretical frameworks. Therefore, the base rate of retention for "working posits" is just as reference-class-dependent as the base rate of truth for "successful theories." The Divide et Impera strategy does not escape the statistical void; it merely hides it behind a layer of semantic sorting that is only valid in hindsight.

  ### III. What Survives? The Dissolution of Wholesale Realism

  If both the wholesale antirealist (PMI) and the wholesale realist (Selectivity) rely on invalid inductive generalizations due to reference class instability, the "Scientific Realism Debate" as traditionally conceived dissolves.

  **1. The Impossibility of Global Verdicts**
  A global verdict (e.g., "Science aims at truth" or "Theories are generally false") requires a stable metric of truth-likeness across disparate conceptual schemes. The reference class problem shows that no such metric exists. We cannot compare the "truth" of phlogiston theory to the Standard Model because the semantic and ontological frameworks are incommensurable enough that they do not share a reference class for truth-value assignment.
  Therefore, **Wholesale Realism and Wholesale Antirealism are both ill-posed metaphysical claims.** They attempt to apply a statistical generalization to a non-stationary process.

  **2. The Retreat to Retail (Local) Realism**
  What survives is precisely what you suggested: **Retail Realism**.
  *   We assess specific posits (e.g., electrons, DNA structure, black holes) based on local warrants: novel prediction, instrumental robustness, and independent measurability.
  *   This is not an *inductive* argument from history; it is an *abductive* argument from current best explanation.
  *   Crucially, this avoids the reference class problem because it does not appeal to a base rate derived from the past. It appeals to the specific epistemic credentials of the current case.

  **3. The Loss of Philosophical "Punch"**
  However, this retreat comes at a cost. Retail realism is essentially **methodological naturalism**. It says: "Accept the ontology of your best current theory, until a better one comes along."
  *   It offers no guarantee against the PMI (locally, you might still be wrong).
  *   It offers no global metaphysical commitment (you are not a "Realist" capitably, only a realist about $X$).
  *   It renders the philosophical debate otiose. If the verdict is always theory-by-theory, the philosopher adds no value beyond what the practicing scientist already does.

  ### Conclusion

  Your diagnosis is fatal to the standard debate. The Pessimistic Meta-Induction fails because it treats a non-stationary historical process as a stable statistical population. The Realist's "Divide et Impera" defense fails because it defines its reference class ("working posits") using retrospective criteria that are unavailable for prospective prediction.

  Nothing survives of the *global* debate. We are left with a deflationary view: scientific realism is not a thesis that can be proven or disproven by meta-induction. It is a local, pragmatic stance adopted toward specific theoretical entities based on their specific empirical integration. The question "Is science real?" is a category error; the only coherent questions are "Is this posit warranted?" and "Is that mechanism robust?"

  For a physical chemist, this is likely a comfortable position: you trust the molecular orbital because it predicts the spectrum, not because of a philosophical argument about the history of caloric. The philosophy of science, in this light, should cease attempting to adjudicate the truth of science wholesale and focus instead on the epistemic warrants available retail.
