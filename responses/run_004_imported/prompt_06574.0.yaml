      *   **Task 1:** Argue rigorously that the reference class problem is *fatal* to the "wholesale" PMI.
      *   **Task 2:** Push further than standard literature: Show that this *same* problem undermines the Realist's "Divide et Impera" (Selectivity) strategy (Kitcher/Psillos).
