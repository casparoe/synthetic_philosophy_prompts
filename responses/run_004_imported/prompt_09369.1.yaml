answer: |-
  Consider a museum curator deciding to move a priceless oil painting from the Impressionist wing to the Modernist gallery. The narrow frame problem arises immediately in the logistics of the move: if we treat the gallery as a logical state, moving the painting changes its coordinates, but it does not change the painting's dimensions, the chemical composition of the paint, or the color of the wall it leaves behind. A sophisticated logical formalism can handle this effortlessly; it uses "frame axioms" to assume that properties persist unless explicitly altered. We do not need a specific rule stating that the move will not turn the frame into a bicycle, nor do we need to calculate that the humidity in the storage closet remains unaffected by the curator's decision. This is the McCarthy and Hayes problem: efficiently certifying what *doesn't* change so the system doesn't drown in negative proofs. A modern non-monotonic logic solves this by assuming inertia; the painting's age and size are carried over to the new situation by default.

  The deeper, epistemological frame problem emerges the moment the curator asks not what *persists*, but what *matters*. Once the physical persistence of the canvas is assumed, the curator must determine which of the infinite facts in the universe are relevant to this specific action. Moving the painting changes the light exposure, which risks fading the pigments—a relevant side effect. But does it also void an insurance clause tied to the room's specific fire suppression system? Does placing this landscape next to that abstract sculpture create a political controversy regarding the artists' estates? Does the new location block a sightline for a security camera, or perhaps cast a shadow that makes a guard sleepy, reducing vigilance? A logical system can track the light levels if "light sensitivity" is pre-coded as a predicate. It can track the insurance if "policy location" is a variable. But it cannot know to check for the guard's sleepiness or the estate's sensitivity unless it already knows those connections are relevant.

  Here is the combinatorial explosion: to be perfectly safe, the curator would have to check every belief in their database against the action. Does moving the painting affect the price of tea in China? In principle, yes, if the move delays a donor's meeting who then misses a trade. Does it affect the structural integrity of the building? Only if the wall is load-bearing, which is only relevant if the painting is heavy, which is only relevant if the hangers are weak. The search for relevance has no logical boundary. The moment the curator stops asking "What physical properties changed?" and starts asking "What *consequences* should I care about?" the system leaves the domain of formal logic and enters the domain of human judgment.

  This is the precise fracture point where a solution to the narrow problem fails the broad one. The logical formalism successfully certifies that the paint did not turn to cheese during the move (solving the narrow problem), but it offers no mechanism for deciding whether the *guard's vigilance* is a variable worth instantiating in the first place (the broad problem). Dennett and Fodor's worry is that without a prior theory of relevance—a way to prune the search tree before evaluating the branches—any reasoner, human or machine, will starve while calculating the irrelevancies. The curator moves the painting because they intuitively know which threads of the causal web are taut and which are slack; the AI, armed only with a perfect logic of non-effects, remains paralyzed, staring at the wall, unable to distinguish a trivial side effect from a catastrophic oversight.
