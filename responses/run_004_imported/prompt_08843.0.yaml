      *   **Turn 14 (Thorne):** "Goals" are shorthand for feedback loops. If we call DNA a code, we obscure the actual causal work done by the cytoplasm.
      *   **Turn 15 (Vance):** But without the sequence, the cytoplasm does nothing specific. The sequence *selects* the outcome. That's informational control.
      *   **Turn 16 (Thorne):** Control, yes. Information? Only if you define information so thinly it applies to keys and locks. If it applies to everything, it explains nothing.

  4.  **Refining and Polishing:**
