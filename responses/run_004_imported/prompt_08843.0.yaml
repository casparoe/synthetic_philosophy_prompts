  *Actually, a better interpretation for the Deflationist to make the Realist sweat:* The Deflationist should argue that if the Realist claims DNA is *intrinsically* semantic (unlike text which needs a reader), they are positing a magic property. If the Realist claims DNA is like text (needs a reader), then who is the reader inside the cell?
  *Let's go with:* Thorne argues that text is *also* just physical marks until a system (human brain) processes it. The ribosome is that system for DNA. But the ribosome is just chemistry. So the "meaning" is always in the *processing system*, not the *string*. Therefore, calling the string a "code" reifies the relation into the object.

