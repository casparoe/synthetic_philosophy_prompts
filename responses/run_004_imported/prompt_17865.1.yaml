answer: |-
  This is a fantastic observation, and you have stumbled onto one of the great tragicomic footnotes in the history of ideas. You are absolutely right about the facts: Hobbes did spend his twilight years locked in a bitter, public feud with John Wallis (the Savilian Professor of Geometry at Oxford) over squaring the circle. Hobbes was wrong. Wallis was right. Hobbes never admitted it.

  However, the reason this doesn't disqualify *Leviathan* in philosophy classrooms comes down to three main factors: **timing**, **definition**, and **logical independence**.

  Here is the sanity check on your intuition.

  ### 1. The Timeline Problem
  The biggest reason this isn't the "headline" is chronological. *Leviathan* was published in **1651**.

  Hobbes's obsession with squaring the circle really kicked into high gear *after* he returned to England from exile in France (around 1652) and got involved with the Oxford circle. The famous feud with Wallis escalated through the 1650s and 60s. Hobbes was in his 60s and 70s during the math feud.

  When he wrote *Leviathan*, he was riding high on the success of his earlier philosophical work (*De Cive*, 1642). He believed he had mastered the geometric method. The public humiliation came later. So, historically, the political philosophy wasn't built *on* the failed math; the failed math was a later attempt to extend the same confidence into a field where he lacked rigor.

  ### 2. What Did Hobbes Mean by "Geometric"?
  This is the philosophical crux. When Hobbes said he was doing philosophy "geometrically," he wasn't saying, "I am going to solve polynomial equations about the King."

  He was referring to the **resolutive-compositive method** (inspired by Euclid and Galileo).
  *   **Resolution:** Break a complex phenomenon (like the State) down to its simplest parts (individual humans).
  *   **Composition:** Rebuild the concept from those first principles using deductive logic.

  Hobbes wanted political philosophy to have the same **certainty** as geometry. In geometry, if you agree on the definitions (a line, a point) and the axioms, you *must* agree on the conclusion. Hobbes wanted to do this with politics: If we agree on human nature (fear, desire for power), we *must* agree on the need for an Absolute Sovereign.

  **The Disconnect:**
  Failing to square the circle proves Hobbes was bad at **calculation** and **spatial reasoning**. It does not necessarily prove he was bad at **deductive logic** or **conceptual definition**.
  *   You can be terrible at integration but still construct a valid syllogism.
  *   You can be wrong about the value of $\pi$ but still be right that "a society without enforcement mechanisms will collapse into violence."

  Scholars argue that while Hobbes's *math* was garbage, his *logic* in *Leviathan* remains internally consistent, even if you reject his premises. The failure of the math doesn't break the chain of logic in the political theory.

  ### 3. The "Genetic Fallacy" Trap
  If a professor started a lecture with, "Hobbes couldn't do math, therefore the Social Contract is fake," they would be committing a version of the **genetic fallacy** (or *ad hominem*).

  The validity of an argument is separate from the competence of the arguer in unrelated fields.
  *   **Isaac Newton** spent decades trying to decode the Book of Revelation and alchemy. He was wrong about almost all of it. Does that discredit Calculus or Gravity? No.
  *   **Martin Heidegger** was a Nazi. Does that automatically make *Being and Time* logically incoherent? (Scholars still debate the separation, but the text itself is analyzed on its merits).

  In Hobbes's case, the "geometric method" in politics is a **metaphor for rigor**, not a literal application of geometry. The fact that he failed at the literal application is an irony, not a refutation.

  ### 4. Actually, Scholars *Do* Talk About It
  You asked why it isn't the headline. In introductory Pol-Sci 101 classes? Because it's a distraction from the State of Nature. But in intellectual history? It's huge.

  It is often cited as evidence of Hobbes's **dogmatism**. The same stubbornness that made him insist on an Absolute Sovereign (who cannot be challenged) made him insist he had squared the circle (even when Wallis proved he hadn't).
  *   **The Psychological Link:** Many biographers (like Quentin Skinner or Richard Tuck) suggest that Hobbes's inability to accept error in math mirrors his political fear of disorder. To admit he was wrong about the circle was to admit a crack in his system of certainty. To admit the Sovereign could be wrong was to invite Civil War. The psychology is consistent, even if the math was wrong.

  ### The Verdict on Your "Own-Goals" Piece
  If you are writing about intellectual own-goals, **this is a goldmine.** It is arguably one of the biggest in history.

  *   **The Irony:** The man who demanded absolute precision in language and logic became notorious for sloppy mathematical reasoning.
  *   **The Ego:** He published *Six Lessons to the Professors of Mathematics* (1656) attacking Wallis. Wallis responded by mocking Hobbes's math in front of the Royal Society. Hobbes kept publishing "corrections" until he died at 91.
  *   **The Damage:** It *did* damage his reputation. During his life, he went from being the "Monster of Malmesbury" (a terrifyingly brilliant thinker) to a figure of ridicule among the new scientific class (the Royal Society crowd).

  **Why it doesn't kill *Leviathan*:**
  Because *Leviathan* rests on **psychological and political premises**, not mathematical ones. If Hobbes is wrong about the circle, he's bad at geometry. If he's wrong about the State of Nature, he's bad at politics. The former doesn't prove the latter.

  **The Headline You're Looking For:**
  "The Philosopher Who Demanded Certainty Couldn't Prove It."
  That’s the angle. Hobbes wanted to make philosophy as certain as math. He failed at math, and history has shown his political certainty was also... debatable. The method wasn't discredited because the method was a metaphor; the *hubris* was the discrediting factor.

  So, your intuition is right that it's a massive irony, but wrong that it logically invalidates the political theory. It invalidates Hobbes the *Mathematician*, but Hobbes the *Political Theorist* survives because his arguments stand (or fall) on their own merits, not on his ability to calculate the area of a circle.
