      *   *Counter-point 2 (Nature of the Method):* What did Hobbes mean by "geometric"? He didn't mean "doing math problems." He meant *deductive reasoning from clear definitions*. The validity of the political argument depends on the logic and the premises, not his ability to solve an impossible math problem.
