      *   *Does it do work?* Yes. It moves the debate from "Are we finding the *one true* feature?" to "At what granularity does the feature become *usefully predictive*?" It resolves the tension between Note 2 (splitting) and Note 3 (universality). Universality suggests robustness (Realism), Splitting suggests granularity dependence (Dennett).
