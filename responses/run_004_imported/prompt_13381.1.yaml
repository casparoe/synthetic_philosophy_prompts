answer: |-
  Your memory is excellent. The argument you are describing is indeed the central critique leveled by Amartya Sen, most famously in his 1977 paper *"Rational Fools: A Critique of the Behavioral Foundations of Economic Theory."*

  Your brother-in-law is articulating the standard neoclassical position derived from Paul Samuelson's Revealed Preference Theory (RPT). Within the strict bounds of that framework, he is technically correct: the theory is designed to make the distinction between "selfish" and "unselfish" behavior analytically empty. However, Sen provides the precise technical machinery to rescue the concept of self-sacrifice from that tautology.

  Here is the state of the argument, the technical distinctions involved, and where your brother-in-law's reasoning holds and where it fails.

  ### 1. The Brother-in-Law's Position: The Tautology of Revealed Preference

  To understand the objection, we must formalize your brother-in-law's claim. Standard Revealed Preference Theory rests on a few core axioms:

  1.  **Preference is defined by choice:** We cannot look inside your head to measure "utility." We only know you prefer $A$ to $B$ if you choose $A$ when $B$ is available.
  2.  **Utility Maximization:** Agents choose the option that yields the highest utility.
  3.  **All-Inclusive Utility:** Utility is a placeholder for *whatever* motivates the choice. It can include money, leisure, the welfare of others, the avoidance of guilt, or the "warm glow" of virtue.

  **The Implication:**
  If you choose the nonprofit job ($N$) over the consulting job ($C$), RPT states:
  $$U(N) > U(C)$$
  Since $U$ includes *everything* you care about (salary + meaning + guilt avoidance), it follows by definition that choosing $N$ maximizes your utility.

  **The Collapse of Self-Sacrifice:**
  Under this framework, "self-sacrifice" implies choosing an option that lowers your utility. But since choice *reveals* higher utility, it is logically impossible to choose an option that lowers your utility. Therefore, self-sacrifice is impossible. Every act, from donating a kidney to hoarding gold, is revealed to be "self-interested" in the sense that it satisfies the agent's preference ordering.

  Your brother-in-law is right that **within standard RPT, the distinction between selfish and unselfish action is empty.** It is a tautology: "People do what they prefer; therefore, they prefer what they do."

  ### 2. Amartya Sen's Critique: Sympathy vs. Commitment

  Sen agrees that standard RPT makes this distinction empty, but he argues this is a flaw in the theory, not a feature of reality. He introduces a distinction between two types of other-regarding behavior: **Sympathy** and **Commitment**. This is the technical wrinkle you recall.

  #### A. Sympathy (Consistent with RPT)
  Sympathy occurs when your welfare is causally dependent on the welfare of others.
  *   *Example:* You give money to a charity because seeing others suffer makes you suffer. Relieving their pain relieves yours.
  *   *RPT Status:* This is fully compatible with your brother-in-law's view. Your utility function simply includes a variable for "others' well-being." You are still maximizing your *own* welfare (utility), even if the *source* of that welfare is altruistic.
  *   *Application to you:* If you stayed at the nonprofit because leaving would make you feel guilty, or because the "meaning" gave you a psychological boost that compensated for the lost salary, Sen classifies this as **Sympathy**. In this specific case, your brother-in-law is right: you optimized your own welfare.

  #### B. Commitment (Inconsistent with RPT)
  Commitment occurs when you choose an act that you know will result in *lower* personal welfare than an alternative, driven by a sense of principle, duty, or social norm.
  *   *Example:* You vote in a heavy rainstorm. The cost (getting wet) outweighs the probability of your vote mattering. You do it not because it makes you feel good (you might feel miserable), but because you believe it is your duty.
  *   *RPT Status:* This breaks the link between **Choice** and **Personal Welfare Maximization**.
  *   *The Formal Break:* In RPT, Choice $A$ implies Welfare($A$) > Welfare($B$). In Commitment, you can choose $A$ while acknowledging Welfare($B$) > Welfare($A$).
  *   *Application to you:* If you stayed at the nonprofit knowing that your personal well-being (income, stress levels, lifestyle) would be objectively lower than in consulting, and you did *not* receive enough "warm glow" or "guilt avoidance" to offset that loss in your personal welfare calculus, but chose it anyway because you believed it was the *right thing to do*, that is **Commitment**.

  **Sen's Conclusion:**
  If **Commitment** exists, then choice does not always reveal preference in the sense of welfare maximization. Therefore, self-sacrifice is conceptually possible. An agent can act against their own well-being.

  ### 3. Technical Wrinkles and Further Objections

  If you wish to press the argument further, there are three additional technical objections to the brother-in-law's RPT stance that support the possibility of genuine self-sacrifice.

  #### A. The Falsifiability Problem (Hausman & McPherson)
  Philosophers of economics Daniel Hausman and Michael McPherson argue that if "utility" is defined to include *whatever* motivated the choice, the theory becomes unfalsifiable.
  *   If you take the consulting job, you valued money.
  *   If you take the nonprofit job, you valued meaning.
  *   If you flip a coin, you valued randomness.
  A theory that can explain any outcome explains no outcome. To make RPT useful, we must impose constraints on what counts as "self-interest" (usually material well-being). If we impose those constraints, your decision *is* a sacrifice of self-interest.

  #### B. Meta-Rankings (Sen)
  Sen also proposes that humans have "meta-rankings"—preferences about our preferences.
  *   *First-order preference:* I prefer the consulting job (more money).
  *   *Second-order preference:* I prefer to be the kind of person who prefers the nonprofit job.
  *   *Choice:* I choose the nonprofit job to align with my second-order preference.
  In this model, you are sacrificing your first-order welfare (money) to satisfy a higher-order valuation of your character. This is a form of self-sacrifice that RPT struggles to model without becoming convoluted.

  #### C. The Counterfactual Test
  The most rigorous way to test your brother-in-law's claim is the **Counterfactual Welfare Test**.
  *   *Question:* If we could measure your personal well-being (psychological state, material capacity, health) independently of your choice, would it be lower in the nonprofit role than in the consulting role?
  *   *If Yes:* And you chose the nonprofit anyway, you have engaged in self-sacrifice (Commitment).
  *   *If No:* (i.e., you are actually happier/healthier at the nonprofit), then it was Sympathy/Welfare Maximization.

  The brother-in-law's argument precludes asking this question because he defines well-being *by* the choice. Sen argues we must be able to measure well-being *independently* of the choice to make moral sense of economics.

  ### 4. Summary of the Argument State

  **Does the framework collapse the distinction?**
  Yes, **strict Revealed Preference Theory** (Samuelson) collapses the distinction between selfish and unselfish action. It treats "utility" as a formal placeholder, not a psychological reality. In this strict view, your brother-in-law is correct: "self-sacrifice" is a semantic error.

  **Is there a principled way out?**
  Yes. **Amartya Sen's critique** is the standard accepted rebuttal in welfare economics and moral philosophy. By distinguishing between **Sympathy** (where my welfare tracks with yours) and **Commitment** (where I act against my welfare for a principle), Sen restores the conceptual space for self-sacrifice.

  **How to apply this to your situation:**
  You can concede to your brother-in-law that *if* we define utility as "whatever drives choice," he is right. But you can then point out that this definition renders the concept of "utility" useless for predicting behavior or making moral judgments.

  If you adopt Sen's framework, your decision counts as **self-sacrifice (Commitment)** if:
  1.  You recognize that the consulting job would have offered higher *personal well-being* (money, security, leisure).
  2.  The "meaning" or "guilt avoidance" did not fully compensate for that loss in terms of your personal welfare.
  3.  You chose the nonprofit nonetheless due to a commitment to a value external to your own welfare.

  If, however, the "meaning" made you personally happier than the money would have, it was **Sympathy**. It is still a virtuous act, but it is not a sacrifice of *utility*, only a sacrifice of *income*.

  ### Conclusion

  Your brother-in-law is defending a methodological stance (positivism) that insists we cannot measure internal states, so we must infer them from actions. You are defending a moral realist stance that insists internal states (sacrifice, duty) exist independently of actions.

  Amartya Sen won the Nobel Prize largely for formalizing the intuition you had at that dinner table. The distinction is not empty, but preserving it requires rejecting the strictest version of Revealed Preference Theory in favor of a richer model of human agency that allows for **Commitment**. You are on solid philosophical ground.
