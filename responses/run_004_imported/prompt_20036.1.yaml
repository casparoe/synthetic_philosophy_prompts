              *   *Student's Reasoning:* "since a property like knowability could never be sufficient to establish the sādhya." This sounds more like a description of *anaikāntika* (inconclusive) rather than *asiddha* (unproven presence).
          *   *Assessment:* The example is classic, but the label is wrong. This is a significant conceptual error in Nyāya logic.

