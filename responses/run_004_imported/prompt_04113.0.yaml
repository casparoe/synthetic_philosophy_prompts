prompt: |-
  For a National History Day project on the history of skepticism and the paranormal, I've been reading Henry Sidgwick's 1889 presidential address to the Society for Psychical Research, "The Canons of Evidence in Psychical Research." Sidgwick, the Cambridge moral philosopher who was the Society's first president, spends the address discussing how to weigh testimony about seemingly impossible phenomena. Right before the part I'm stuck on, he explains that judging any reported "marvel" means weighing two competing improbabilities against each other: the improbability that the marvel actually happened, and the improbability that the witnesses' testimony about it is false. Then he writes:

  "Now these opposing improbabilities are quite diverse, and we have no intellectual scales in which we can weigh them accurately one against the other. Some of our opponents offer us, by way of such scales, Hume's summary argument against miracles: 'It is contrary to experience that miracles should be true, and not contrary to experience that testimony should be false.' But in saying that a marvel is contrary to experience we can mean no more than that it is unlike previous experience — or rather that it is unlike that portion of experience which has been collected, handed down, and systematised by competent persons. But this only means that it is entirely novel and strange: and in the course of the life of the human race, during the period in which it has handed down and communicated experiences, different portions of mankind have been continually coming across things that were at first entirely novel and strange, though further acquaintance has rendered them familiar."

  I can't quite pin down what Sidgwick's actual objection to Hume is here. Is he saying Hume's principle is simply wrong, or just that it's weaker than it looks once you unpack what "contrary to experience" really means? And if a marvel being "contrary to experience" just amounts to its being novel and unfamiliar, isn't that basically what Hume was already saying — so what work is Sidgwick's move actually doing? A step-by-step walkthrough of the argument would really help.
