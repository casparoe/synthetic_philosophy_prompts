      *   *Step 3: The Historical Argument.* Sidgwick points out that science progresses by accepting the "novel."
      *   *Step 4: The Implication for Weighing Evidence.* If "contrary to experience" just means "new," it doesn't automatically outweigh testimony. It just raises the bar for proof.
