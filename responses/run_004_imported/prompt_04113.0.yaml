answer: |-
  This is a fantastic passage to grapple with for a National History Day project. You have identified the exact pivot point where Sidgwick tries to carve out intellectual space for the Society for Psychical Research (SPR).

  To understand what Sidgwick is doing, you have to recognize that he is performing a **semantic critique** of Hume. He isn't necessarily saying Hume is 100% wrong about logic; he is arguing that Hume's key phrase—"contrary to experience"—is being used in a way that shuts down inquiry prematurely.

  Here is a step-by-step walkthrough of the argument, the distinction between the two philosophers, and the specific "work" Sidgwick is doing.

  ### Step 1: Understand Hume's "Scale"
  David Hume's argument (from *An Enquiry Concerning Human Understanding*, Section X) relies on a specific definition of a miracle. For Hume, a miracle is a **violation of a law of nature**.
  *   **Hume's Premise:** Laws of nature are established by "firm and unalterable experience." (e.g., We have uniform experience that dead men do not come back to life).
  *   **Hume's Conclusion:** Therefore, any testimony claiming a miracle occurred is automatically weighed against the *entirety of human experience* that says it didn't happen.
  *   **The "Scale":** Hume argues the evidence *against* the miracle (uniform experience) is so heavy that no testimony can outweigh it, unless the testimony being false would be even *more* miraculous.

  For Hume, "contrary to experience" means **"incompatible with established natural law."** It implies impossibility.

  ### Step 2: Sidgwick's Redefinition
  Sidgwick looks at that phrase "contrary to experience" and asks: *What do we actually mean when we say that?*

  He argues that we cannot logically mean "impossible." We can only mean **"not currently in our database."**
  *   **Sidgwick's Premise:** To say a marvel is "contrary to experience" is simply to say it is **unlike previous experience.**
  *   **The Qualification:** He adds that this usually means it is unlike the experience "collected, handed down, and systematised by competent persons" (i.e., current science).
  *   **The Implication:** If "contrary to experience" just means "we haven't seen this before," then it describes **novelty**, not **falsehood**.

  ### Step 3: The Historical Argument
  This is the crux of the passage you quoted. Sidgwick points out that throughout human history, people have constantly encountered things that were "entirely novel and strange" (contrary to their prior experience) which later became "familiar."
  *   **Example:** Before the 19th century, the idea of rocks falling from the sky (meteorites) was considered contrary to experience and impossible by many scientists. When witnesses reported them, they were dismissed using Humean logic. Later, meteorites became part of "systematised experience."
  *   **Sidgwick's Point:** If we use Hume's scale, we would have to reject meteorites, electricity, or germs when they were first reported, because they were "contrary to experience" at the time.

  ### Step 4: Answering Your Specific Questions

  **1. Is Sidgwick saying Hume's principle is simply wrong?**
  He is saying it is **useless as an absolute bar.** He argues that Hume's principle cannot be used as a pre-judgment to dismiss evidence before looking at it. If you define "contrary to experience" as "impossible," you are begging the question (assuming the conclusion). If you define it as "unfamiliar," it doesn't prove the event didn't happen; it only proves the event is rare.

  **2. Isn't "novel and unfamiliar" basically what Hume was already saying?**
  **No, and this is the most important distinction for your project.**
  *   **For Hume:** "Contrary to experience" = **Violation.** It means the event *cannot* happen because nature doesn't work that way. The weight on the scale is infinite.
  *   **For Sidgwick:** "Contrary to experience" = **Absence.** It means the event *has not been recorded* by science yet. The weight on the scale is heavy, but not infinite.

  Hume uses "experience" to mean **Law.** Sidgwick uses "experience" to mean **Data.**

  **3. What work is Sidgwick's move actually doing?**
  Sidgwick is trying to save the **scientific method** from **dogmatic skepticism.**
  *   **The Problem:** If the SPR accepts Hume's definition, they cannot exist. Hume says psychical phenomena are impossible by definition.
  *   **The Solution:** Sidgwick redefines the terms so that psychical phenomena are merely *unclassified*, not *impossible*.
  *   **The Result:** This shifts the burden of proof. It doesn't mean the SPR should believe every ghost story. It means they must investigate them. The "improbability" of the marvel is no longer a wall; it is just a hurdle. The testimony must be *stronger* than usual, but it is not automatically disqualified.

  ### Summary for Your Project
  You can frame Sidgwick's argument as a move from **A Priori Skepticism** (Hume) to **Methodological Skepticism** (Sidgwick).

  *   **Hume:** "It is contrary to experience" $\rightarrow$ "Therefore it is false."
  *   **Sidgwick:** "It is contrary to experience" $\rightarrow$ "Therefore it is new." $\rightarrow$ "Therefore we must examine the testimony very carefully to see if we need to expand our understanding of experience."

  Sidgwick is telling his fellow skeptics: *You cannot use 'science' as a shield to ignore data you don't like. If the testimony is strong enough, 'experience' must be updated.* This was the philosophical foundation that allowed the SPR to claim they were being scientific while investigating things mainstream science rejected.

  ### A Quote to Consider
  If you need to summarize Sidgwick's objection in your paper, you might paraphrase it this way:
  > "Sidgwick argues that Hume conflates 'unprecedented' with 'impossible.' By reducing 'contrary to experience' to mere 'novelty,' Sidgwick demonstrates that Hume's scale cannot automatically weigh against testimony, because all scientific progress begins as a novelty contrary to prior experience."

  This distinction shows you understand that Sidgwick wasn't trying to prove ghosts were real; he was trying to prove that *investigating* them was rational.
