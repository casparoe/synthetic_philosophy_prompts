      *   *Core Claim:* A miracle is a violation of the laws of nature.
      *   *Evidence:* Laws of nature are established by "firm and unalterable experience."
      *   *Weighing:* We weigh the evidence for the miracle (testimony) against the evidence for the law of nature (uniform experience).
      *   *Conclusion:* Since the experience *against* the miracle is uniform and unbroken, no testimony is sufficient to establish a miracle unless the falsehood of the testimony would be *more* miraculous than the miracle itself.
      *   *Key Phrase:* "Contrary to experience." For Hume, this usually implies a *contradiction* of established natural law, not just something new.

  3.  **Deconstruct Sidgwick's Argument (The Critique):**
      *   *Context:* Sidgwick is a founder of the SPR. He wants to investigate psychical phenomena (telepathy, ghosts, etc.) scientifically. He can't accept Hume's blanket dismissal, but he wants rigorous standards.
      *   *The Move:* He redefines/analyzes the phrase "contrary to experience."
      *   *Sidgwick's Definition:* To say something is "contrary to experience" means it is "unlike previous experience" or "unlike that portion of experience which has been collected, handed down, and systematised by competent persons" (i.e., science).
      *   *The Implication:* If "contrary to experience" just means "novel/strange/unfamiliar," then *all* new scientific discoveries start out as "contrary to experience."
      *   *The Historical Point:* Humans constantly encounter novel things that become familiar later.
      *   *The Conclusion:* You can't use "contrary to experience" as an absolute bar to belief. It only marks something as *new*, not necessarily *false*.

  4.  **Identify the Core Disagreement (The "Work" Sidgwick is Doing):**
      *   *Hume:* "Contrary to experience" = Violation of a known, fixed law of nature. (Metaphysical/Nomological impossibility).
      *   *Sidgwick:* "Contrary to experience" = Not yet recorded in our current scientific database. (Epistemological novelty).
      *   *Why it matters:* If Hume is right, psychical research is a waste of time because miracles *cannot* happen. If Sidgwick is right, psychical research is valid because "miracles" might just be new natural laws we haven't systematized yet.
      *   *Is Sidgwick saying Hume is wrong?* He's saying Hume's *formula* is useless as a decisive scale because the term "contrary to experience" is ambiguous. If it means "impossible," it begs the question. If it means "unfamiliar," it doesn't rule out the event.

