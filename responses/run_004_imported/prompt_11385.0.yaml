answer: |-
  This is a sophisticated philosophical puzzle that cuts to the heart of G. E. Moore's *Principia Ethica* (1903). You have identified a tension that many scholars note: the relationship between Moore's robust realism about objective value (the "Beautiful World" argument) and his holism about how value is compounded (the "Organic Unities" principle).

  To help you justify your land trust's work, we need to disentangle how Moore distinguishes between *intrinsic value in isolation* and *intrinsic value as part of a whole*. Here is how the pieces fit together, followed by how you might apply this to your board's mission.

  ### 1. Unperceived Beauty: Major Good or Small Residue?

  You asked whether unperceived beauty retains *most* of its value or only a *small residue* on Moore's view. The answer, strictly speaking, is the latter, though Moore insists the residue is non-zero.

  **The Beautiful World Argument (Chapter III)**
  Moore asks us to imagine two worlds: one exceedingly beautiful, one exceedingly ugly (a heap of filth), stipulating that no human being ever sees or experiences either. He argues that it is irrational to deny the beautiful world is *better* than the ugly one.
  *   **The Conclusion:** Beauty possesses **intrinsic value** independent of a perceiver. It is not merely instrumental to human pleasure.
  *   **The Magnitude:** However, Moore does not claim this unperceived beauty constitutes the *greatest* good. He claims it is *better* than ugliness, but he does not claim it is *as good as* a world where that beauty is appreciated.

  **The Principle of Organic Unities (Chapter III & VI)**
  Moore's principle states: *"The value of a whole must not be assumed to be the same as the sum of the values of its parts."*
  *   **Part A:** The beautiful object (has some intrinsic value, $x$).
  *   **Part B:** The conscious appreciation of that object (has some intrinsic value, $y$).
  *   **The Whole:** The consciousness *of* the beautiful object (has value $Z$).

  Moore argues that $Z$ is vastly greater than $x + y$. The "greatest goods" are not beauty in the abstract, nor pleasure in the abstract, but specifically **the consciousness of beauty.**

  **The Reconciliation**
  Moore's system is coherent if you view unperceived beauty as having **positive but minor intrinsic value.**
  *   It is not zero (contra the utilitarians who say value requires sentience).
  *   It is not the maximum (contra the Platonists who might say the Form of Beauty is the sole good).
  *   It is a **foundational value.** It provides the necessary condition for the greater good (the Organic Unity) to exist.

  So, to answer your specific question: On Moore's view, unperceived beauty retains a **small residue** of value in terms of magnitude, but it retains its **full status** as an intrinsic good in terms of kind. It is good *in itself*, but it is *much better* when combined with appreciation.

  ### 2. The Parallel: Unloved Admirable Qualities

  You also asked if Moore can say something parallel about a person's admirable qualities going entirely unloved, or if personal affection resists isolation.

  There is a parallel, but with a crucial structural difference.

  **The Parallel**
  Just as a beautiful landscape is better than an ugly one even if unseen, a virtuous person is better than a vicious one even if unloved. Moore defines virtue as a disposition to bring about good consequences. The existence of a good will has intrinsic value. Therefore, a world with an unloved saint is better than a world with an unloved sinner.

  **The Difference (Intentionality)**
  Beauty, for Moore, is an objective quality of an object. It can logically exist without a subject (as per the thought experiment).
  Personal affection (love/friendship), however, is inherently relational. It is a mental state *directed at* an object.
  *   **Beauty:** Can exist without a mind (Realism).
  *   **Affection:** Cannot exist without a mind (Intentionality).

  Therefore, "unloved virtue" is easier to isolate conceptually than "unappreciated affection." If no one loves the virtuous person, the *affection* simply does not exist to be isolated. What exists is the *virtue* (the disposition).
  Moore would argue that the **Organic Unity of Love** (the emotion of love directed at a worthy object) is one of the highest goods.
  *   **Virtue alone:** Good.
  *   **Love for a worthy object:** Very Good.
  *   **Love for an unworthy object:** Less Good (or potentially bad, depending on the mismatch).

  So, yes, the parallel holds: The admirable quality has value in isolation, but the *relationship* (the organic unity of the quality + the affection) is where the supreme value lies. However, affection resists isolation more than beauty does, because affection is essentially a response, whereas beauty is essentially a property.

  ### 3. Application: Justifying the Land Trust

  How does this help you justify protecting remote wilderness that few will see? Moore's framework actually provides three distinct lines of defense, ranging from modest to robust.

  **Argument 1: The "Existence Value" (The Residue)**
  *   *Moorean Logic:* Even if no one sees the wilderness, the universe is intrinsically better with that beauty in it than without it.
  *   *Board Pitch:* "We are adding value to the cosmos, not just to human experience. We are ensuring that reality contains beauty rather than degradation, which is a good in itself, regardless of footfall."
  *   *Strength:* Philosophically sturdy (on Moore's view), but practically weak for donors who want human impact.

  **Argument 2: The "Necessary Condition" (The Potential)**
  *   *Moorean Logic:* You cannot have the Organic Unity (Appreciation of Beauty) without the Beauty. The beauty is the necessary substrate.
  *   *Board Pitch:* "We are preserving the necessary condition for the highest human goods. If we lose the land, the possibility of that profound connection between human consciousness and nature is destroyed forever. We are safeguarding the potential for the 'greatest good' even if current usage is low."
  *   *Strength:* Stronger. It frames the land not as a static object, but as a partner in a future relationship.

  **Argument 3: Stewardship as Appreciation (The Immediate Unity)**
  *   *Moorean Logic:* The "consciousness of beauty" doesn't require a *crowd*. It requires a *mind*.
  *   *Board Pitch:* "The act of protection itself is a form of appreciation. By knowing this land exists and choosing to value it enough to protect it, the community (and our donors) enters into an Organic Unity with the land. The value is generated by the *knowing* that it is safe, even if the seeing is rare."
  *   *Strength:* Strongest. It turns the "remoteness" into a feature. The knowledge that *some* wilderness remains untouched creates a specific type of valuable consciousness (reverence/security) in the public, even if they don't visit.

  ### Summary of Moore's Coherence

  To answer your final question on how the pieces fit: Moore is consistent because he distinguishes between **simple intrinsic value** and **complex intrinsic value.**

  1.  **Simple:** Beauty has simple intrinsic value ($x$).
  2.  **Complex:** Beauty + Consciousness has complex intrinsic value ($Z$).
  3.  **Organic Unity:** $Z \gg x$.

  The tension you feel arises if one assumes that if $Z$ is the goal, $x$ is worthless without it. Moore denies this. $x$ is valuable on its own, but $Z$ is the ethical target.

  For your land trust, this means you are not lying when you say the land has value without visitors (Moore's Beautiful World), but you are aiming higher when you suggest that protecting it allows for a deeper relationship between humanity and nature (Moore's Organic Unities). You are preserving the *minor* good to make possible the *major* good.

  **Recommendation:** Use Argument 2 and 3 combined. Acknowledge that while direct visitation is low (limiting the Organic Unity), the *preservation* creates a different kind of Organic Unity: the public's consciousness of a protected wild place. This aligns with Moore's view that the *attitude* toward the good is where the bulk of the value lies.
