answer: |-
  Your suspicion is well-founded. While Émilie du Châtelet and Epicurus share the broad hedonistic premise that pleasure is the ultimate good and pain the ultimate evil, their accounts of *how* to achieve this end are nearly diametrically opposed on several critical points. Calling du Châtelet an Epicurean relies on a loose, eighteenth-century colloquial usage of the term (meaning simply "one who enjoys life") rather than a strict philosophical alignment with the Garden.

  In fact, du Châtelet's *Discourse on Happiness* can be read as a systematic critique of the Epicurean strategy for securing happiness. Below is a comparison of their positions on the specific points you raised, followed by an assessment of whether the "Epicurean" label holds up.

  ### 1. Katastematic vs. Kinetic Pleasure (Tranquility vs. Activity)
  **Epicurus:** The core of Epicurean hedonism is the distinction between *kinetic* pleasures (the active process of satisfying a desire, like eating when hungry) and *katastematic* pleasures (the state of existence once pain and desire are removed, i.e., *aponia* and *ataraxia*). Epicurus argues that kinetic pleasures are inherently unstable and often lead to pain; therefore, the highest good is the static pleasure of tranquility. The ideal life is quiet, withdrawn, and free from disturbance.

  **Du Châtelet:** Du Châtelet explicitly rejects the ideal of tranquility if it implies passivity or boredom. For her, the greatest enemy of happiness is not disturbance, but *ennui* (boredom/emptiness). She views the human mind as needing constant occupation and stimulation. Happiness is not the absence of motion (ataraxia) but the successful engagement of our faculties. She writes that "the more senses and passions one has, the more resources one has for happiness."
  *   **Verdict:** This is a fundamental divergence. Epicurus seeks to minimize the surface area of vulnerability to fortune; du Châtelet seeks to maximize it to increase the capacity for joy. Her view is closer to an Aristotelian account of *energeia* (activity) framed within a hedonistic calculus than to Epicurean stasis.

  ### 2. The Epistemology of Happiness (Truth vs. Illusion)
  **Epicurus:** For Epicurus, false beliefs are the primary source of human misery (fear of gods, fear of death, fear of divine punishment). His physics and canonics are therapeutic tools designed to strip away illusions. Truth is instrumental to happiness because only by understanding the natural world can we cease to fear it. An Epicurean sage does not *need* to be deceived to be happy; indeed, deception is a vulnerability.

  **Du Châtelet:** This is her most contentious and anti-Epicurean claim. Du Châtelet argues that reality is often too harsh, too dull, or too limited to sustain happiness. Therefore, "illusions" are not errors to be corrected but resources to be cultivated. We *need* to believe the gambler's fallacy, *need* to get lost in the fiction of the theater, and *need* to idealize our lovers.
  *   **Verdict:** Epicurus is a realist who believes truth liberates; du Châtelet is a pragmatist (or perhaps a proto-pragmatist) who believes utility validates belief. If an illusion produces pleasure without catastrophic pain, she deems it rational to maintain it. This is a direct rejection of the Epicurean commitment to *parrhesia* (frank speech/truth-telling) as a condition of the good life.

  ### 3. The Economy of Desire (Limiting vs. Cultivating)
  **Epicurus:** The Epicurean tetrapharmakos relies on limiting desires to those that are "natural and necessary." Unnecessary desires (for luxury, fame, excessive sex) are "vain" because they are limitless and depend on fortune. By paring down desires, one makes happiness easy to secure and hard to lose.

  **Du Châtelet:** Du Châtelet argues that limiting desires limits the *potential* for happiness. While she agrees that unchecked passions can lead to ruin, her solution is not to extinguish them but to *cultivate* tastes that allow for safe enjoyment. She advocates for expanding one's capacity for pleasure through education, arts, and social engagement. She accepts the risk of pain as the necessary price of the intensity of pleasure.
  *   **Verdict:** Epicurus advocates an asceticism of desire to ensure security. Du Châtelet advocates an aestheticism of desire to ensure intensity. She is willing to trade security for intensity, a calculation Epicurus would deem foolish.

  ### 4. Love and Passion (Danger vs. Necessity)
  **Epicurus:** The Epicurean stance on erotic love is famously wary. Epicurus is reported to have said, "Never have sex, and be glad if you haven't been harmed." Erotic passion is viewed as a "natural but unnecessary" desire that frequently leads to mental disturbance, jealousy, and distraction from philosophy.

  **Du Châtelet:** Writing from the context of the French salon and her own life (her relationships with Voltaire and Saint-Lambert), du Châtelet views passionate love as one of the few things capable of curing deep *ennui*. She acknowledges the risks but argues that a life without the "illusion" of love is a life half-lived. She explicitly defends the value of the *delusion* involved in love (idealizing the beloved) as a source of profound pleasure.
  *   **Verdict:** Here the contrast is starkest. Epicurus views eros as a threat to *ataraxia*; du Châtelet views it as a vital engine of happiness.

  ### Is "Epicurean" an Apt Label?

  **Historically:** Yes, but loosely. In the eighteenth century, "Epicurean" was often used as a catch-all for any secular, pleasure-affirming philosophy that opposed Christian asceticism or Stoic self-denial. Du Châtelet herself might have accepted the label insofar as it signaled her opposition to Jansenist gloom or Stoic repression.

  **Philosophically:** No. As your analysis suggests, the label hides more than it reveals. Du Châtelet rejects the specific mechanisms Epicurus prescribes for achieving pleasure.
  *   Epicurus: **Subtractive Hedonism** (remove pain/fear/desire to find pleasure).
  *   Du Châtelet: **Additive Hedonism** (add passions/illusions/activities to generate pleasure).

  ### Better Characterizations

  If "Epicurean" is insufficient, how else might we characterize her view?

  1.  **Mondain Hedonism:** This locates her in the specific tradition of the French *honnêtes hommes* and salon culture (think Saint-Évremond or the young Voltaire). This tradition values sociability, wit, theater, and love as intrinsic goods, viewing the philosophical withdrawal recommended by Epicurus as antisocial and dull.
  2.  **Newtonian Vitalism:** Du Châtelet was a rigorous Newtonian physicist. Some scholars suggest her ethics mirror her physics: just as the universe requires force and motion (*vis viva*), the moral life requires passion and activity. A static universe is a dead one; a static soul is a bored one.
  3.  **Psychological Pragmatism:** Her focus is less on the metaphysical nature of the good (as Epicurus was) and more on the psychological conditions required for a human being to *feel* happy. She is analyzing the machinery of human satisfaction rather than the ontology of pleasure.

  ### Conclusion for Your Group

  You can confidently tell your group that while du Châtelet is a hedonist, she is an **anti-Epicurean hedonist**. She accepts the *end* (pleasure) but rejects the *means* (tranquility, truth, limitation of desire).

  Her defense of illusion is the smoking gun: Epicurus believes philosophy saves us by waking us from the dream of superstition and anxiety; du Châtelet believes philosophy should help us curate the most beneficial dreams. To call her Epicurean is to ignore her radical claim that **truth is often the enemy of happiness**, a proposition that would have horrified the sage of the Garden.
