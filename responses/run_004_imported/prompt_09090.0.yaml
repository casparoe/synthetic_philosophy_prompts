answer: |-
  This is a fantastic angle for a discussion section. You are absolutely right to resist the "embarrassing footnote" narrative. The standard historiography treats the Wallis dispute as a psychological quirk (Hobbes's vanity) rather than a philosophical symptom. But if you take Hobbes's system seriously, the failure to square the circle isn't just a math error; it is a **category error that exposes a fatal tension in his *verum factum* (truth-is-made) epistemology.**

  Here is the strongest argument you can deploy to show that the math failure undermines the certainty of his civil philosophy. I call this the **"Materialist Contamination of Construction"** argument.

  ### The Core Argument

  **1. The Promise: Certainty via Construction**
  Hobbes's pitch in *De Corpore* and *Six Lessons* is that geometry yields certain knowledge (*scientia*) because the geometer constructs the object of study. We define the circle, we generate the lines, we control the premises. Because we make it, we know it. He explicitly imports this model into civil philosophy: we construct the Commonwealth via covenant; therefore, we can have geometric certainty about political obligation. The Sovereign's authority is as demonstrable as a Pythagorean proof.

  **2. The Glitch: Why Hobbes Failed to Square the Circle**
  Hobbes didn't fail because he was bad at arithmetic; he failed because of his **ontology**. Hobbes was a radical materialist. For him, there are no abstract objects. A "point" must have magnitude; a "line" is a trajectory of a body in motion.
  *   **Wallis's View:** Geometry is about abstract ratios and relations.
  *   **Hobbes's View:** Geometry is the study of the consequences of *physical motion*.

  When Hobbes tries to square the circle, he is trying to solve a problem of **ideal relations** using a method of **physical approximation**. He conflates the *definition* of a circle with the *physical generation* of a circle. He believes that if he can describe a motion that produces a square equal to a circle, he has solved it. Wallis showed that Hobbes's "constructions" were incoherent because they treated indivisibles as divisible magnitudes.

  **3. The Epistemological Crack**
  Here is the pivot: Hobbes's failure reveals that his "construction" is not purely rational/logical; it is contaminated by empirical/material assumptions.
  *   If geometry were truly certain because "we make it," the act of definition should guarantee truth.
  *   But Hobbes's definitions produced falsehoods (e.g., that a circle can be squared by specific mechanical means).
  *   **Therefore:** "Making" (construction) is not sufficient for certainty. You can "make" a coherent-sounding definition that fails to map onto the necessary relations of the object.

  Hobbes thought he was engaging in *a priori* deduction, but he was actually engaging in *a posteriori* modeling of physical bodies. He lost the "necessity" he claimed for geometry.

  **4. The Political Collapse**
  Now, apply this crack to the Commonwealth.
  *   Hobbes claims political certainty rests on the fact that we "construct" the State via covenant (the *artificial man*).
  *   But if the "construction" model is tainted by materialism (as proven in the geometry dispute), then the Commonwealth isn't a logical construct; it's a **physical aggregate**.
  *   **The Consequence:** If the State is a physical aggregate rather than a logical construct, its stability depends on **power dynamics and material forces**, not on the logical validity of the covenant.
  *   Just as Hobbes's geometric constructions failed to control the properties of the circle, the Social Contract may fail to control the properties of human nature.

  **Summary of the Argument:**
  Hobbes's math failure proves that his method of "construction" cannot separate **normative definition** from **physical description**. If he cannot distinguish between defining a circle and moving a body, he cannot distinguish between **legitimate authority** (defined by covenant) and **effective power** (defined by physical force). Therefore, Civil Philosophy cannot be a "science" of certain obligations; it collapses back into a description of who holds the sword. The certainty he promised is an illusion generated by the same category error that made him think he squared the circle.

  ### How to Pitch This in Section

  To make this stick with students who might not be deep into the math, frame it around the **analogy**.

  **Discussion Prompt Idea:**
  "Hobbes says we can know politics with the same certainty as geometry because in both cases, *we build the thing we are studying*. But Hobbes spent 20 years trying to prove 2+2=5 in geometry (metaphorically) because he refused to accept abstract rules he couldn't physically model. If his 'blueprint' for geometry was flawed because he confused *ideas* with *physical objects*, does his 'blueprint' for the State suffer the same flaw? Are we building a Commonwealth, or are we just describing who is strongest?"

  **Key Takeaway for Students:**
  The Wallis dispute isn't about math; it's about whether **language/definition** can control **reality**.
  *   Hobbes thought: If I define the Sovereign absolutely, reality *must* obey (like a geometric proof).
  *   The Math Failure shows: Defining something doesn't make it so if your definition ignores the underlying nature of the material (whether that material is magnitude or human passion).
  *   Therefore, *Leviathan* might be a brilliant description of power, but it fails as a *demonstrative science* of obligation.

  ### Why This Undermines "Real" Hobbes
  Scholars often compartmentalize: "Hobbes the Political Philosopher" vs. "Hobbes the Delusional Geometer." This argument forces them to see that **Hobbes the Political Philosopher is built on the foundation of Hobbes the Geometer.**

  *   *De Corpore* (Body/Motion) grounds *De Homine* (Man) which grounds *De Cive* (Citizen).
  *   If the physics/geometry of *De Corpore* is epistemologically unstable (because "construction" yields falsehoods), the derivation of political obligation loses its deductive necessity.
  *   It reduces the Social Contract from a **logical truth** to a **hypothetical model** that might not hold up against the "recalcitrance of the material" (i.e., human rebellion).

  This turns the "embarrassing footnote" into the **keystone of his epistemological crisis.** It suggests Hobbes was chasing a certainty that his own materialist metaphysics made impossible.
