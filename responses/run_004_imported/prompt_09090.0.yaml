      *   *Inference:* This reveals that his "construction" isn't purely rational/logical; it's contaminated by empirical/material assumptions.
      *   *Conclusion:* If the "construction" in geometry is tainted by material assumptions, the "construction" of the Commonwealth is likewise tainted. We don't actually "construct" the state purely by covenant (definition); we are constrained by material human nature and power dynamics that defy our definitions. Therefore, civil philosophy cannot achieve the *geometric* certainty Hobbes promises, because the geometric model itself was illusory.

