      *   *The Epistemological Crack:* Hobbes insists geometry is certain *because* we make the figures. But if "making" implies physical construction (as his materialism suggests), then geometric certainty collapses into empirical approximation.
      *   *The Political Consequence:* If the geometric model is actually empirical/material rather than purely rational/constructive, then the analogy to politics shifts. Politics becomes about managing physical forces, not deducing rights from definitions. This undermines the *normative* certainty he claims for civil philosophy.
