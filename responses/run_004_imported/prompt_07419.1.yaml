  The sink was full of suds, gray water lapping at the stems of the lilies someone had brought that afternoon. Elias scrubbed a casserole dish, the steel wool screeching against the enamel. Sarah was drying, stacking the ceramic plates with a rhythm that felt too steady for three days after a funeral.

  "He kept the garage organized," Sarah said. She wasn't looking at Elias. She was looking at the plate in her towel. "Even the nails were sorted by size."

  "He was an engineer," Elias said. "It's what they do."

  "It's not just that." She set the plate down. "He's still in the house, Eli. I can feel it in the way the light hits the floorboards in the morning. It's the same angle he used to sit in."

  Elias stopped scrubbing. He let the dish sink back into the bubbles. "Sarah. He's gone. The body was cremated. The house is empty."

  "Not empty."

  "Physically," Elias said, turning to face her. "Physically, the space is vacant. Are you saying you think his consciousness is hovering in the living room?"

  "I'm saying he's present."

  "Present how? Like a gas? Like a memory?"

  "Like a fact."

  Elias dried his hands on his jeans, leaving wet streaks on the denim. "A fact is verifiable. If I walk into the living room, can I measure him? If I set up a thermal camera, does it pick up a heat signature?"

  Sarah picked up the next plate. "You're asking the wrong questions."

  "I'm asking the only questions that matter. If you claim something exists, there has to be a way to check if it's true. Otherwise, you're just saying you *wish* he was there."

  "I don't wish it," Sarah said. Her voice didn't rise. That was the thing that unnerved Elias; she sounded like she was reading a grocery list. "I know he's there."

  "How do you know?"

  "Because I live as if he is."

  Elias laughed, a short, sharp sound that died quickly in the kitchen. "That's circular. You believe he's there because you act like he's there? That's not evidence, that's a habit."

  "It's not a habit. It's the ground I walk on." Sarah turned to him, the towel bunched in her hands. "If you told me the floor was going to give way in five minutes, would you keep standing here?"

  "No. Because I have evidence floors collapse."

  "If you *believed* it would collapse, you'd move. You don't move. So you believe the floor holds."

  "That's different. Gravity is consistent."

  "Isn't it?" She gestured with the towel toward the hallway, toward the dark living room beyond. "Dad's love is consistent. His judgment is consistent. I don't need to measure it to know it regulates what I do. When I make a choice now, I ask: *Would he approve?* That's not a metaphor, Eli. That's a real constraint on my actions. He is influencing the physical world through me."

  Elias rubbed his temples. "He's not influencing anything. You're projecting a model of him onto your own decision-making process. You're using his memory as a heuristic."

  "I'm using *him*."

  "You're using a picture of him in your head."

  "The picture *is* the reality."

  "No, it's not." Elias stepped closer, his voice dropping, trying to make her see the logic of it. "Look, if you say the train leaves at five, I can go to the station and check. If it's not there, you're wrong. If you say Dad is in the living room, and I can't detect him, then... what are we even talking about? What would count as him *not* being there?"

  Sarah looked at him, and for a second, Elias saw a flicker of pity in her eyes. It made his stomach turn.

  "If I stopped caring," she said. "If I stopped living the way he taught me. Then he'd be gone."

  "So his existence depends on your attention? That makes him a construct, Sarah. It makes him internal."

  "It makes him real. What's more real than the thing that stops you from hurting someone? What's more real than the thing that makes you get out of bed?"

  "Neurochemistry. Habit. Morality."

  "God," she said.

  Elias threw his hands up. "There it is. You just slot the word in. But you won't define it. You won't tell me what it *is*."

  "I told you. It's the picture that holds everything together."

  "But is it *true*?" Elias pressed. "In the same way that this sink is true. In the same way that Dad died on Tuesday."

  Sarah turned back to the sink. She picked up a fork. "You keep using the word 'true' like it's a box you can put things in. Like a stamp. Approved or denied."

  "It has to be one or the other."

  "Why?"

  "Because reality doesn't allow contradictions. He can't be dead and alive."

  "He's dead," Sarah said. She polished the tine of the fork. "And he's here. Those aren't contradicting. They're just... different kinds of knowing."

  "That's a cop-out."

  "It's the only way it fits."

  Elias leaned against the counter, the fight draining out of him, replaced by a cold frustration. He felt like he was trying to play chess and she was playing Go, and they were both insisting they were winning the same game.

  "So," Elias said quietly. "If I went in there right now. To the living room. And I said, 'Dad, I need help with my taxes.' Do you think he hears me?"

  Sarah didn't look up. "I think it matters that you said it."

  "That's not an answer."

  "It's the only answer I have."

  "You don't know, then."

  "I know."

  "You can't provide a reason why."

  "I don't need to."

  Elias pushed off the counter. He walked to the table and picked up his keys. The metal felt cold, solid, undeniable. "I'm going to go. I can't do this."

  "Okay," Sarah said.

  "You realize," Elias said, pausing at the door, "that if you're wrong, you're building your life on a fantasy. And if I'm right, you're talking to air."

  Sarah placed the dry fork in the drawer. The clatter was loud in the quiet kitchen.

  "And if you're wrong," she said, "you're living in a world where nothing matters but what you can touch."

  She closed the drawer. She didn't turn around.

  "Drive safe," she said.

  Elias stood in the doorway for a moment, waiting for something else, a bridge, a concession, a shared definition of the word *safe*. But the air in the kitchen was just air, and the silence was just silence. He opened the door and stepped out into the night, leaving the light on behind him.
