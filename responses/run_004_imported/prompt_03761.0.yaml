      *   Conclusion summarizing Bradley's ultimate goal (Monism).

  10. (Wait, one nuance on Q1): Why does the new relation fail? Because it suffers from the *same defect* as the first. It is also a "thing" that needs connecting. This is crucial. I must emphasize that $R^1$ is relevantly similar to $R$.

  11. (Wait, one nuance on Q2): Bradley's language: "hopeless process," "insoluble." It's vicious because it precludes the *possibility* of the phenomenon it tries to explain.

  12. (Wait, one nuance on Q3): Russell explicitly credited Bradley with this problem. I should mention that. The distinction is often that Bradley uses it to abolish relations, while Russell wants to save them. But the *problem* is the same. I will frame it as "Same structure, different philosophical project."

