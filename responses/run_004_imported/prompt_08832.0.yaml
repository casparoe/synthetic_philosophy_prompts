      *   *The Aumann/BI Argument:* If Player 2 is rational, they will take at the last node. Knowing this, Player 1 takes at the second-to-last. Unraveling leads to taking at node 1. This relies on CKR.
      *   *The Critique (Binmore/Reny/Kreps et al.):* To reason about Node 1, Player 1 must form a belief about what Player 2 would do at Node 100. But if Player 1 is rational, Node 100 is never reached. If Node 100 *is* reached, CKR must have failed somewhere. So, how can Player 1 use CKR to predict Player 2's move at Node 100 if reaching Node 100 proves CKR false? This is the "counterfactual" or "off-equilibrium path" problem.

  3.  **Character Development:**
