prompt: |-
  Hey! So I'm on my university's academic integrity board (the student panel that decides responsible / not responsible in honor code hearings), and there's a proposal to bump our hearing panels from 3 people to 9 because bigger panels are supposedly more likely to land on the correct verdict — somebody keeps citing the Condorcet jury theorem like that just settles it. We actually went over that theorem in my social epistemology seminar, and it needs a lot more than "more voters = better": each juror has to be independantly more likely right than wrong, and for some of our foggier cases (ambiguous citation stuff, group project disputes) I honestly don't think any individual member clears 50/50, which I vaguely remember flips the theorem the other way entirely. On top of that, our panels currently deliberate together in the same room before voting, so calling the votes "independent" feels like a stretch. Can you draft the actual memo I'd bring to the board about what to do with panel size (and maybe how we vote or deliberate), with a real recommendation and reasoning the pro-9 people could actually push back on, not just a list of caveats about the theorem's assumptions?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a university academic integrity board (student panelist).
      *   **Context:** Proposal to increase panel size from 3 to 9 based on the Condorcet Jury Theorem (CJT).
      *   **User's Concern:** The CJT has strict assumptions (individual competence $> 0.5$, independence of votes) that likely don't hold in this context (ambiguous cases, group deliberation). If competence $< 0.5$, larger groups make things *worse*.
      *   **Goal:** Draft a formal memo to the board.
      *   **Requirements:**
          *   Real recommendation (not just "maybe").
          *   Reasoning that proponents of the 9-person panel can push back on (substantive argument, not just a list of caveats).
          *   Address panel size *and* voting/deliberation procedures.
          *   Tone: Professional, persuasive, grounded in the theory (since the user studied it), but practical.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) in this Context:**
      *   *Assumption 1: Competence ($p > 0.5$).* In clear-cut cheating cases (plagiarism software match), $p$ is high. In ambiguous cases (unauthorized collaboration, citation nuances), $p$ might be near or below 0.5 for untrained students.
      *   *Assumption 2: Independence.* Deliberation creates correlation. If one persuasive student sways the room, votes aren't independent. This reduces the "wisdom of crowds" effect.
      *   *Implication:* If $p < 0.5$, increasing $n$ drives the probability of a correct verdict to 0. If votes are highly correlated, increasing $n$ adds diminishing returns or noise.

  3.  **Formulate the Argument/Recommendation:**
      *   *Don't just say "No to 9."* That's defensive.
      *   *Don't just say "Yes to 9."* That ignores the user's valid theoretical concerns.
      *   *Middle Ground/Structural Change:* Keep panels smaller (3-5) but improve *competence* ($p$) and *independence* (voting procedure).
      *   *Key Insight:* The problem isn't just size; it's the *process*. Deliberation before voting kills independence. Training improves competence.
      *   *Recommendation:* Maintain 3-person panels *for now*, but implement a "silent vote first" rule to preserve independence, and mandate specific training to boost competence above the 0.5 threshold. Alternatively, propose a hybrid: 3-person panels for clear cases, 5-person for appeals/complex cases. Let's stick to a strong recommendation: **Keep panels small (3-5), fix the voting procedure (secret ballot before discussion), and invest in training.** Why? Because adding more untrained, correlated voters adds noise, not signal.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the position clearly. The CJT argument is theoretically sound but practically misapplied.
      *   **Theoretical Analysis (The "Meat"):** Acknowledge the CJT citation but explain *why* it fails here.
          *   Point 1: Competence Threshold. In ambiguous cases, are we really $>50\%$ accurate individually? If not, 9 people guarantees error.
          *   Point 2: Independence. Deliberation creates herd behavior. 9 correlated voters $\approx$ 3 independent voters but with more logistical drag.
      *   **Practical Considerations:** Logistics of scheduling 9 students vs. 3. Depth of deliberation (social loafing).
      *   **Recommendations:**
          1.  **Panel Size:** Cap at 5 (compromise) or stick to 3. Let's recommend **5** as a compromise that acknowledges the desire for more data points without hitting the diminishing returns/correlation trap too hard, *provided* other changes happen. Actually, the user seems skeptical of 9. Let's recommend **maintaining 3, but allowing expansion to 5 for complex cases**, contingent on process changes.
          2.  **Voting Procedure:** **Straw poll/secret ballot *before* deliberation.** This preserves the "independence" assumption of CJT.
          3.  **Training:** Focus on raising $p$ (competence).
      *   **Conclusion:** Summarize.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is recommending 3 too stingy? The proponents want 9 for accuracy.
      *   *Adjustment:* Argue that *quality* of signal matters more than *quantity* of voters. A 3-person panel with high competence and independent votes is mathematically superior to a 9-person panel with low competence and correlated votes.
      *   *Tone Check:* Needs to be respectful but firm on the math. Avoid sounding like a know-it-all seminar student, but use the seminar knowledge as authority.
      *   *Actionable Pushback:* The pro-9 side needs something to argue against. They can argue that deliberation *improves* competence ($p$ goes up during talk). The memo needs to acknowledge this counter-argument (deliberation as competence-boosting) but weigh it against the loss of independence.

  6.  **Finalizing the Memo Structure:**
      *   **Subject:** Proposal Regarding Panel Composition and Voting Procedure.
      *   **Opening:** Acknowledge the goal (accuracy).
      *   **Analysis of CJT Application:** Break down the two failure points (Competence & Independence).
      *   **The "Deliberation Paradox":** Discuss how talking helps consensus but hurts independence.
      *   **Recommendations:**
          1.  Modified Panel Size (3-5 range).
          2.  Two-Stage Voting (Private then Public).
          3.  Targeted Training.
      *   **Closing:** Invitation to discuss.

  7.  **Review against Constraints:**
      *   *Real recommendation?* Yes (Size 3-5 + Secret Ballot + Training).
      *   *Reasoning to push back on?* Yes (The math of correlated errors vs. independent errors).
      *   *Not just caveats?* Yes, offers a procedural solution.

  8.  **Final Polish:** Ensure the language is appropriate for a university board (formal but accessible). (Self-correction: Make sure to explicitly mention that if $p < 0.5$, larger groups converge on *wrongness*. That's the killer argument.)

  9.  *(Final thought before drafting)*: I should make sure the memo doesn't sound like it's shutting down the conversation, but rather refining the proposal based on evidence. The user wants to bring this *to* the board, so it needs to be a document they can read aloud or distribute.

