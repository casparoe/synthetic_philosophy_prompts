prompt: |-
  I'm the token engineer on my company's model risk review board -- everyone else is legal or compliance -- and we're deadlocked over what our new model's output, something like "this applicant has a 68% chance of defaulting," is actually supposed to mean before we lock in the disclosure wording. Legal wants it to say "68 out of 100 similar applicants defaulted"; our lead data scientist says you can slice "similar" a dozen different ways and get a different number every time, so to her the 68% is really just how confident the model is, not a frequency claim about anybody; and our chief risk officer keeps insisting there's some actual objective riskiness baked into this one applicant, seperate from either of those stories, that we're all just trying to measure. I fell down a Wikipedia hole last night and realized this is apparently just the frequentist vs subjectivist vs propensity-theory debate about what probability even is, and not our board being uniquely dumb. Can you write the memo I owe the board before Friday -- it needs to actually recommend disclosure wording/policy, and instead of just picking a side, it has to take seriously why the two camps we dont go with would call our draft wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Token Engineer on a Model Risk Review Board (MRRB).
      *   **Audience:** The Board (Legal, Compliance, Lead Data Scientist, Chief Risk Officer).
      *   **Problem:** Deadlock over the interpretation of a model output ("68% chance of defaulting").
      *   **Conflicting Views:**
          *   *Legal/Compliance:* Frequentist view ("68 out of 100 similar applicants").
          *   *Data Scientist:* Bayesian/Confidence view ("Model confidence," not a frequency claim).
          *   *Chief Risk Officer (CRO):* Propensity/Realist view ("Objective riskiness inherent to the applicant").
      *   **Task:** Write a memo recommending disclosure wording/policy.
      *   **Constraint:** Do not just pick one side. Must acknowledge why the *other* two camps would call the recommendation wrong (steel-manning the opposition).
      *   **Deadline:** Before Friday (implies urgency and need for clarity).
      *   **Tone:** Professional, technical but accessible, decisive yet diplomatic, acknowledging the philosophical depth without getting bogged down in academia.

  2.  **Deconstruct the Philosophical/Technical Conflict:**
      *   *Frequentist (Legal):* Good for regulatory compliance (fair lending, adverse action). Easy to explain to consumers. *Weakness:* "Similar" is ill-defined (reference class problem).
      *   *Subjectivist/Bayesian (Data Scientist):* Technically accurate regarding model mechanics (output is a score mapped to probability). *Weakness:* Hard to explain to consumers/regulators ("confidence" sounds vague).
      *   *Propensity/Realist (CRO):* Intuitively how business treats risk. *Weakness:* Philosophically dubious (is risk a property of the person or the model/context?).

  3.  **Determine the Strategy:**
      *   I cannot solve the philosophy of probability. I need to solve the *risk* and *compliance* problem.
      *   The goal is *disclosure wording*. The wording needs to be safe (Legal), accurate (Data Science), and actionable (CRO).
      *   *Hybrid Approach:* The recommendation should lean towards the Frequentist interpretation for *external* disclosure (because regulators demand it) but clarify the *internal* governance to satisfy the Data Scientist and CRO.
      *   *Key Insight:* The "probability" is a *calibrated score* based on a specific reference class. It is not an intrinsic property, nor is it a pure confidence interval.
      *   *Structure:*
          1.  Executive Summary (The Recommendation).
          2.  Context (The Deadlock).
          3.  Analysis of Perspectives (Steel-manning each).
          4.  The Compromise/Policy (Calibrated Frequency).
          5.  Recommended Wording.
          6.  Implementation/Governance.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Executive Summary:** Get straight to the point. We need to ship this. Recommend a "Calibrated Reference Class" approach.
      *   **The Core Conflict:** Acknowledge the Wikipedia hole. It's not stupidity; it's foundational.
      *   **Addressing the Stakeholders (The "Steel-man" requirement):**
          *   *To Legal:* If we don't use frequency, regulators hate us. But if we define "similar" poorly, we get sued.
          *   *To Data Science:* If we claim it's objective frequency, you're right, it's a lie. It's a model output.
          *   *To CRO:* If we say it's just model noise, you can't price risk. It needs to act like real risk.
      *   **The Recommendation:** "Calibrated Probability within a Defined Reference Class."
          *   This satisfies Legal (it's a frequency).
          *   This satisfies DS (it acknowledges the reference class is a choice, not nature).
          *   This satisfies CRO (it's actionable for pricing).
      *   **Disclosure Wording:** Needs to be consumer-facing but precise. "Based on applicants with similar financial profiles..."
      *   **Governance:** How do we maintain this? Monitoring calibration.

  5.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use "Model Risk" language (calibration, reference class, ground truth).
      *   Ensure the "Token Engineer" voice comes through (pragmatic, bridging tech and policy).
      *   *Self-Correction during drafting:* I initially thought about suggesting we change the number. No, the prompt says we are deadlocked on *meaning*. Stick to interpretation and disclosure.
      *   *Critical Check:* Did I explain why the other sides would call it wrong? Yes, need to make sure that's explicit in the analysis section.

  6.  **Final Polish:**
      *   Check against the "Friday deadline" vibe (concise, actionable).
      *   Ensure the philosophical debate is acknowledged but contained.
      *   Make sure the recommendation is actually a policy decision, not just musings.

  7.  **Final Review against constraints:**
      *   Recommend wording/policy? Yes.
      *   Take seriously why other camps call it wrong? Yes.
      *   Tone appropriate for MRRB? Yes.

  *(Self-Correction Note)*: I need to make sure I don't sound like I'm dismissing the CRO. The CRO's view is practically necessary for business, even if philosophically shaky. I should frame the CRO's view as the "Decision Utility" perspective.

  *(Refining the Wording)*: Legal wants "68 out of 100". DS says "similar" is slippery. The compromise is defining "similar" *explicitly* in the model documentation, and using slightly softer but still frequentist language in consumer disclosure.

