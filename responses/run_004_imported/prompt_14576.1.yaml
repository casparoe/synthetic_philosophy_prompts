answer: |-
  **MEMORANDUM**

  **TO:** Model Risk Review Board (MRRB)
  **FROM:** Token Engineer, Model Risk
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Probabilistic Output Interpretation & Disclosure Wording
  **STATUS:** Action Required for Friday Lock

  ### Executive Summary

  We are currently deadlocked on the semantic interpretation of our model's probabilistic outputs (e.g., "68% probability of default"). This is not a failure of diligence; it is a reflection of the three foundational interpretations of probability (Frequentist, Bayesian/Subjectivist, and Propensity).

  To proceed without exposing the firm to regulatory risk, technical inaccuracy, or strategic paralysis, **I recommend we adopt a "Calibrated Reference Class" policy.**

  Externally, we will disclose using a **qualified Frequentist framing** (satisfying Legal/Compliance). Internally, we will govern the model as a **calibrated scoring function** (satisfying Data Science) used to approximate **risk propensity** for pricing (satisfying Risk).

  This memo details the recommendation, the specific disclosure wording, and an analysis of why each stakeholder group may still find this imperfect, along with mitigations.

  ---

  ### 1. Context: The Nature of the Deadlock

  Our disagreement mirrors a century-old debate in statistics and philosophy.
  *   **Legal/Compliance** views probability as **Frequency**: *Long-run rates in a population.*
  *   **Data Science** views probability as **Confidence**: *A model's internal state given specific features.*
  *   **Chief Risk** views probability as **Propensity**: *An intrinsic property of the applicant.*

  If we lock in wording that privileges one view without acknowledging the limitations, we invite challenge from the other two camps or external regulators. We cannot solve the philosophy of probability, but we can engineer a policy that manages the risk of each interpretation.

  ### 2. Stakeholder Analysis & Risk Assessment

  Per the requirement to steel-man the opposition, below is why each party is correct to reject the others' pure definitions, and why our compromise must address these specific grievances.

  #### A. The Legal/Compliance Position (Frequentist)
  *   **The Claim:** "68% means 68 out of 100 similar applicants defaulted."
  *   **Why they are right:** Regulators (CFPB, OCC) and Fair Lending laws rely on comparability. Adverse action notices require explainable, population-based reasoning. Pure "confidence" scores are difficult to defend in litigation.
  *   **Why they would call our draft wrong:** If we soften the language too much, they will argue we are being vague to hide bias. If we define "similar" too loosely, they will argue we are making false frequency claims (the Reference Class Problem).
  *   **Mitigation:** We must explicitly define the "Reference Class" in model documentation so "similar" is not a marketing term, but a technical specification.

  #### B. The Data Science Position (Subjectivist/Confidence)
  *   **The Claim:** "68% is the model's confidence score, not a guarantee of frequency. 'Similar' is arbitrary."
  *   **Why they are right:** Technically, the model outputs a score mapped to a probability via a loss function. There is no objective "bucket" of 100 people. If the distribution shifts (covariate shift), the frequency claim becomes false while the model confidence remains internally consistent.
  *   **Why they would call our draft wrong:** They will argue that claiming a frequency is a "hallucination" of objectivity. It implies a ground truth stability that doesn't exist in non-stationary economic environments.
  *   **Mitigation:** We will treat the probability as a *calibrated score* internally. We will not guarantee the frequency holds in out-of-distribution scenarios, and our monitoring will track calibration drift, not just accuracy.

  #### C. The Chief Risk Position (Propensity/Realist)
  *   **The Claim:** "This applicant *is* 68% risky. It is a property of them, not just our model or a group."
  *   **Why they are right:** Business decisions require treating risk as a tangible asset to be priced. If risk is purely subjective or purely group-based, capital allocation becomes impossible.
  *   **Why they would call our draft wrong:** They will argue that framing this as "group frequency" or "model confidence" undermines the pricing logic. They need to believe the risk is inherent to the counterparty to justify the rate.
  *   **Mitigation:** We acknowledge that for *pricing decisions*, we treat the output as a propensity proxy. However, for *disclosure*, we must revert to frequency to remain compliant.

  ---

  ### 3. Recommendation: The "Calibrated Reference Class" Policy

  We cannot claim the probability is an intrinsic truth (Propensity), nor can we claim it is a vague confidence score (Subjectivist). We must claim it is a **frequency within a defined technical boundary.**

  **Policy Decision:**
  1.  **Internal Governance:** The Data Science team must document the specific **Reference Class** used for calibration (e.g., "Applicants with FICO 700-720, DTI 30-35%, in Region X").
  2.  **External Disclosure:** We use Frequentist language but qualify the "similarity" constraint to protect against the Data Scientist's objection.
  3.  **Risk Usage:** The CRO may use the output for pricing, provided they acknowledge it is a *proxy* for propensity, not a measurement of intrinsic truth.

  ### 4. Proposed Disclosure Wording

  We will move away from the absolute "68 out of 100" and toward a qualified frequency statement.

  **Draft Wording (Consumer Facing):**
  > *"This score indicates that among applicants with similar financial profiles and credit histories to yours, approximately 68 out of 100 were unable to fully repay their loans within a [12/24]-month period."*

  **Draft Wording (Internal Model Card):**
  > *"Output represents a calibrated probability of default conditioned on the training distribution. It should be interpreted as the expected default frequency of the defined reference class, not as an intrinsic property of the applicant or a measure of model uncertainty."*

  ### 5. Why This Compromise Will Still Face Criticism (And How We Manage It)

  To ensure the Board understands the residual risk, here is why each of you might still object to this specific wording, and my response:

  *   **Legal:** You will argue that "similar financial profiles" is still too vague and invites litigation on how "similarity" is calculated.
      *   *Response:* We will attach the technical definition of "similarity" (the feature weights and bins) to the compliance file. We do not put the math in the consumer letter, but we must have the audit trail ready.
  *   **Data Science:** You will argue this is still a lie because the "100 similar applicants" don't exist as a static group.
      *   *Response:* It is a "useful fiction" required for regulation. We mitigate this by adding "within a [12/24]-month period" to ground the frequency in a specific time window, acknowledging temporal decay.
  *   **Chief Risk:** You will argue this wording makes the risk sound like it belongs to the "group," which might confuse customers about why *their* rate is high.
      *   *Response:* We separate *Disclosure* from *Pricing*. The customer gets the frequency explanation (compliance); the pricing engine uses the score as a propensity proxy (business). We do not conflate the two.

  ### 6. Action Items for Friday Lock

  1.  **Legal:** Approve the consumer-facing wording above, contingent on the Reference Class documentation being finalized.
  2.  **Data Science:** Document the specific feature bins that constitute "Similar Profiles" for the calibration set.
  3.  **Risk:** Acknowledge in the Model Risk Report that probability outputs are treated as propensity proxies for pricing, distinct from the disclosure definition.
  4.  **All:** Sign off on the understanding that this is a **policy decision**, not a scientific resolution. We are choosing the interpretation that minimizes regulatory friction while maintaining technical integrity.

  ### Conclusion

  We are not resolving the nature of probability; we are resolving the nature of our disclosure. By anchoring our public statement in a **time-bound, qualified frequency**, we satisfy regulatory expectations while using internal documentation to acknowledge the technical and philosophical limitations identified by Data Science and Risk.

  Please review the draft wording by EOD Thursday. I will finalize the Model Risk Report Friday morning.

  Regards,

  Token Engineer
  Model Risk Review Board
