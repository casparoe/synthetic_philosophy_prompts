answer: |-
  **To the Members of Convocation,**
  **Re: The Proposed Honorary Degree for Mr. Harry Truman**
  **May 1956**

  Fellow Members,

  We approach Encaenia with a proper sense of pride in the Allied victory and the restoration of peace. There is no denying that Mr. Truman, as President of the United States, bore the ultimate responsibility for the conclusion of the war in the Pacific. It is natural that the University should wish to honour his leadership. However, the pamphlet recently circulated by Miss G.E.M. Anscombe of Somerville College compels us to look beyond the mere outcome of the war and examine the moral character of the acts by which that outcome was secured.

  Miss Anscombe's objection is not founded on pacifism, nor on a utilitarian calculation of lives lost versus lives saved. It rests upon a specific principle of the Just War tradition: the Doctrine of Double Effect. This doctrine distinguishes between effects we *intend* as means to our end, and effects we merely *foresee* as inevitable side-effects. To intentionally kill the innocent is murder; to kill the innocent as a foreseen but unintended consequence of striking a legitimate military target is, tragically, sometimes permissible in war. Miss Anscombe argues that in Hiroshima and Nagasaki, the destruction of the civilian population was not a side-effect. It was the chosen method. The coercion of Japan was effected *through* the terror and destruction of the cities themselves. Thus, the killing was intentional.

  **The Case for Conferring the Degree**

  Before we decide, we must give a fair hearing to the strongest argument against Miss Anscombe's position. Defenders of the President argue that the redescription of the act is straightforward: the objective was the surrender of Japan, and the target was Japan's capacity and will to continue fighting. On this view, the civilian deaths at Hiroshima were morally equivalent to the civilian deaths in the firebombing of Tokyo or the bombing of Dresden. In those campaigns, we did not intend the death of every worker or family member in the blast zone; we intended the destruction of industrial capacity and morale. The civilians died because they were situated within the target area necessary to break the enemy's will.

  Proponents of the degree argue that if we condemn Mr. Truman, we must logically condemn the entirety of the Allied strategic bombing campaign, including the actions of our own government. They contend that the atomic bomb merely accelerated a process already deemed morally acceptable under the exigencies of total war. The deaths were a foreseen cost of procuring a swift surrender, which itself saved lives—both Allied and Japanese—that would have been lost in a prolonged siege or invasion. To deny the degree on these grounds, they argue, is to engage in legalistic hair-splitting that ignores the reality of modern warfare, where the distinction between the combatant and the civilian population has already been erased by the enemy's own mobilization. If the end (surrender) was just, and the means (bombing) were standard for the time, the University should not retroactively impose a moral purity that was not demanded of the conduct of the war itself.

  **Why the Distinction Matters**

  This counter-argument is formidable because it appeals to consistency. If the firebombing of Tokyo was permissible, why is Hiroshima murder? However, Miss Anscombe's point cuts deeper than the scale of destruction. It concerns the *structure of the intention*.

  In a conventional raid on a factory, the destruction of the factory is the means; the death of nearby civilians is a risk accepted to achieve that means. One could theoretically wish the civilians were not there without undermining the mission. In the case of the atomic bombings, the mission *was* the destruction of the city to induce shock. The civilian destruction was not a risk incurred while striking a military objective; the civilian centre *was* the objective selected to demonstrate the futility of resistance. The terror inflicted upon the population was the instrument of policy.

  We cannot accept the redescription that these deaths were merely "foreseen." When the destruction of a city is selected specifically because it will shatter the enemy's morale through the spectacle of total annihilation, the death of the inhabitants is no longer a side-effect. It is the mechanism. To accept the "foreseen cost" defence here is to admit that *any* massacre of innocents is permissible so long as it is labelled "morale bombing."

  **Recommendation**

  The University of Oxford confers honorary degrees not merely to acknowledge power, but to affirm moral leadership. We are not a court of law, but we are a community of conscience. If we confer this degree "on the nod," we signal that the University is unwilling to distinguish between the tragic necessities of war and the intentional targeting of the innocent.

  I urge you to support the *non placet*. This is not to erase Mr. Truman's contribution to the defeat of tyranny, nor is it to claim perfection for those of us who fought. It is to assert that there are moral limits to warfare that even victory cannot transcend. By forcing a debate, we uphold the very principles of justice we claim to defend.

  **Vote Non Placet.**

  Yours faithfully,

  [Your Name]
  [College Name]
