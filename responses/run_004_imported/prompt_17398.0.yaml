      *   **Core Argument:** In a large/infinite universe, agents with correlated reasoning (but different values) can cooperate acausally. By funding causes we don't prioritize, we signal to counterparts elsewhere to fund our priorities.
      *   **User's Objection:** Isn't this just "Worldview Diversification" (WVD) without the multiverse? Does ECL recommend anything *different* from WVD? Specifically, does it recommend funding things we are *confident* are wrong, whereas WVD only funds things we are *uncertain* about?
