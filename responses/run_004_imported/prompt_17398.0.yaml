      *   *Answer:* This is the killer objection for practical groups. ECL requires modeling the values of acausal counterparts. Usually, this implies funding "popular" effective causes (Global Health, Animal Welfare) because statistically, that's what most value systems prioritize, even if your group thinks AI is 100x better.
