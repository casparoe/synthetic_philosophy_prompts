answer: |-
  **INCIDENT REVIEW BOARD (IRB) – FORMAL FINDING OF FACT AND CAUSATION**
  **Incident Reference:** 2023-PT-04 (Pressure Tank Rupture)
  **Date:** October 24, 2023
  **To:** Corporate Safety & Compliance; Plant Management
  **From:** Incident Review Board
  **Subject:** Determination of Root Cause and Recommended Actions

  ### 1. Executive Summary
  On [Date], Pressure Tank T-104 ruptured during operation, resulting in severe injury to one operator. The Investigation Team has established two concurrent, independent, and sufficient causal factors: (1) critical failure of the relief valve due to improper maintenance by an external contractor, and (2) systematic overpressurization of the tank due to unauthorized operational protocols directed by floor supervision.

  This document serves as the Board's formal finding on causation. It addresses a conflict between the literal application of the "but-for" test in Company Policy [Policy Number] and the engineering reality of concurrent sufficiency. The Board concludes that both factors constitute Root Causes under the *intent* of the policy, despite the logical limitations of the *literal* policy language in this specific scenario.

  ### 2. Factual Background
  The investigation established the following facts by a preponderance of evidence:
  *   **Factor A (Maintenance):** On [Date], Contractor X serviced Relief Valve V-104. Service logs and forensic analysis confirm the valve was reassembled incorrectly. At the time of the incident, the valve was incapable of venting pressure at the rated setpoint.
  *   **Factor B (Operations):** For the six weeks preceding the incident, Floor Supervisor Y directed operators to exceed the compressor cycle limits to meet shipping deadlines. On the day of the incident, pressure levels exceeded the tank's design rating.
  *   **Concurrence:** Engineering simulation confirms that Factor A alone would have resulted in rupture at the observed time. Factor B alone would also have resulted in rupture at the observed time. Both factors were present and active simultaneously.

  ### 3. Causal Analysis and Policy Interpretation
  Company Policy [Policy Number] defines a Root Cause as a factor without which the incident "would not have occurred" (the *sine qua non* or "but-for" test). The Board acknowledges the strict constructionist view:
  *   *But for* the valve failure, the overpressure would have ruptured the tank.
  *   *But for* the overpressure, the functional valve would not have been triggered to failure (or the tank would have held, depending on specific pressure dynamics, but the investigation confirms the overpressure alone was sufficient to fail the vessel).

  Applied literally, the "but-for" test yields a logical paradox where neither factor is necessary, and therefore, under a strict reading, neither is a cause. The Board rejects this literal application for the following reasons:

  **3.1 The Limitation of Counterfactuals in Overdetermined Systems**
  The "but-for" test is a heuristic tool designed to filter out background noise from actionable failures. It functions correctly in linear causal chains. However, in rare cases of **Concurrent Sufficiency** (where two independent failures are both sufficient to cause the event), the tool fails. Accepting the literal result (that nothing caused the accident) violates the fundamental purpose of the Safety Management System, which is to identify and eliminate hazards that create unacceptable risk.

  **3.2 Addressing the "Slippery Slope" Concern**
  The Board recognizes the concern that labeling sufficient factors as causes could lead to "causal inflation," where any condition that *could* contribute to an accident is blamed, regardless of necessity. We address this worry by establishing the following boundary for this determination:
  *   **Active vs. Passive:** We are not citing every condition that *allowed* the accident (e.g., tank design, material science, shift scheduling). We are citing only the **active deviations from standard** that drove the system to failure.
  *   **Rarity of Concurrence:** Concurrent sufficiency is statistically rare. In the vast majority of incidents, causes are sequential and necessary. Adopting a "Substantial Factor" standard for this specific edge case does not open the floodgates; it merely corrects a logical blind spot in the policy for overdetermined events.
  *   **Risk Elimination:** An interventionist view of causation asks: *"If we remove this factor, does the risk of this specific incident class vanish?"* Removing the valve failure prevents this rupture mode. Removing the overpressure practice prevents this rupture mode. Both are valid targets for intervention.

  **3.3 Determination**
  The Board interprets Policy [Policy Number] as intending to identify **actionable safety failures that materially guaranteed the incident.** In cases of concurrent sufficiency, the "but-for" test is superseded by the **"Substantial Factor" test**. Both Factor A and Factor B were substantial factors in bringing about the harm. Both were deviations from required safety standards. Both independently guaranteed the failure.

  Therefore, the Board finds **both** Factor A and Factor B to be Root Causes.

  ### 4. Findings on Responsibility

  **4.1 External Contractor (Contractor X)**
  *   **Finding:** The contractor failed to meet the service level agreement and industry standard of care regarding relief valve maintenance. This created a latent failure condition that removed the primary safety layer.
  *   **Causal Status:** Root Cause (Concurrent).
  *   **Recommendation:** Terminate service contract for cause. The failure represents a fundamental breach of safety trust required for critical safety instrumentation.

  **4.2 Floor Supervisor (Supervisor Y)**
  *   **Finding:** The supervisor knowingly authorized operations outside of design limits. This was not an error in judgment but a willful violation of established operating procedures, sustained over weeks. This removed the operational safety layer.
  *   **Causal Status:** Root Cause (Concurrent).
  *   **Recommendation:** Refer to Human Resources for disciplinary action up to and including termination, consistent with violations of Life-Saving Rules. The argument that "the valve would have failed anyway" is rejected as a defense, as safety systems are designed with redundancy precisely so that one failure does not lead to injury. Relying on the hope that the *other* safety layer holds is not a valid operational strategy.

  ### 5. Policy Recommendation
  To prevent future deadlock, the Board recommends Corporate Safety amend Policy [Policy Number] to include a **Causal Exception Clause**:

  > *"In cases where multiple independent factors are identified, each of which was sufficient to cause the incident on its own (Concurrent Sufficiency), each factor shall be considered a Root Cause, even if the 'but-for' test is not strictly met. This exception applies only when both factors represent active deviations from safety standards."*

  ### 6. Conclusion
  The Incident Review Board concludes that the rupture was caused by the simultaneous failure of both engineering controls (the valve) and administrative controls (the operating limits). To exonerate either party based on the presence of the other would undermine the principle of defense-in-depth. We must treat every sufficient failure as a cause, because in safety, we cannot rely on the hope that another layer of protection will compensate for willful negligence or incompetent maintenance.

  **Approved by the Incident Review Board:**
  [Signatures]

  ***

  ### Notes for the Board Member (Context for your meeting)

  **How to use this draft:**
  This document is designed to give the "strict constructionists" a way to vote "yes" without feeling like they are ignoring the policy. It frames the decision not as *breaking* the rules, but as *interpreting* the rules to avoid a logical absurdity that violates the company's safety mission.

  **Key arguments to bring up in the meeting:**
  1.  **The "Absurdity Doctrine":** In law and policy, if a literal reading leads to an absurd result (i.e., a massive explosion with no cause), the interpretation must yield to the intent. The intent is safety, not logic puzzles.
  2.  **Defense in Depth:** Remind the board that our safety model relies on layers. If we say the Supervisor isn't responsible because the Valve failed, we are effectively telling supervisors they can ignore limits whenever a piece of equipment *might* be faulty. That destroys the safety culture.
  3.  **The "Slippery Slope" Rebuttal:** Emphasize Section 3.2. This isn't about blaming everyone. It's about blaming *active deviations*. We aren't blaming the tank manufacturer or the weather. We are blaming the two specific things people *did wrong*.
  4.  **Philosophy Translation:** Your colleague is right about Counterfactual (But-For) vs. Interventionist. You can tell the board: *"The policy uses a Counterfactual model. But in engineering, we need an Interventionist model. We need to know what to fix. Fixing either prevents the next one. Therefore, both are causes."*

  **If they still push back:**
  Point to Section 5. Even if they vote to clear the individuals based on the current text, the Board *must* recommend the policy change immediately. If we don't, the next time this happens (and it might), we will be legally and ethically paralyzed again. Usually, the fear of being paralyzed next time is enough to get people to act this time.
