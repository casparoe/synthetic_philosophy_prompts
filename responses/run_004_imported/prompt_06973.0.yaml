      *   *Initial thought:* Say conditionals don't have truth values.
      *   *Correction:* That's the *solution*, not the *problem*. The problem is assuming they *do*.
      *   *Focus:* The problem is that a proposition divides the world into "True" and "False". A conditional divides the world into "A is true", "A is false & B true", "A is false & B false". But Stalnaker wants to squash the last two or treat them differently.
      *   *Key realization:* When you condition on $B$, you eliminate all $\neg B$ worlds. If $A \to B$ is a proposition, it must be either true or false in the remaining worlds. Since $B$ is true, $A \to B$ *should* be true. So its probability goes to 1. But $P(B|A)$ also goes to 1. So where is the conflict?
      *   *The Conflict:* The conflict is in the *unconditional* probability. The Law of Total Probability says $P(X) = P(X|B)P(B) + P(X|\neg B)P(\neg B)$. If $X$ is the conditional, $P(X|B)=1$ and $P(X|\neg B)=0$ (usually). So $P(X) = P(B)$. But Stalnaker says $P(X) = P(B|A)$. So $P(B|A) = P(B)$.
      *   *Why does $P(A \to B | \neg B) = 0$?* If $B$ is false, can "If A then B" be true? In material implication, yes (if A is false). In Stalnaker's semantics, usually no (closest A-world must be B-world; if B is false in actual world, closest A-world might still be B... wait).
      *   *Simpler explanation:* If you treat "If A then B" as a fact that exists in the world, learning $B$ tells you everything about that fact (it makes it certain). Learning $\neg B$ tells you everything about that fact (it makes it false). This means the probability of the conditional is entirely determined by the probability of $B$, ignoring $A$.
      *   *The "Gut" reason:* **A proposition's probability is a weighted average of its truth across possibilities. A conditional's probability is a ratio within possibilities. You can't equate a global average to a local ratio for all possible weightings.**

