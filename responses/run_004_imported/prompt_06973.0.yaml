      *   Update on $\neg B$: $P(A \to B | \neg B) = 0$ (If B is false, the conditional is false - *assuming* A is possible).
      *   Total Prob: $P(A \to B) = 1 \cdot P(B) + 0 \cdot P(\neg B) = P(B)$.
