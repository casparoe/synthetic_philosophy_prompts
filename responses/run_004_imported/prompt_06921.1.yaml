      *(Refining Parataḥ-prāmāṇya)*: Nyāya says *prāmāṇya* (validity) is intrinsic to the cognition's *nature* but known extrinsically. However, for *Śabda*, the *generation* depends on the *āpta*. If the *āpta* is missing, the *kāraṇa* (cause) is different. The cause becomes the observation of a reliable sign. This confirms *Anumāna*.

