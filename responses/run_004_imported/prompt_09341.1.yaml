      *   *Check:* Did I treat Holton seriously? *Adjustment:* Make sure to distinguish between *desire strength* (discounting) and *judgment/resolve* (Holton).
      *   *Check:* Is the verdict specific? *Adjustment:* Avoid "it depends." Say "It explains X, but fails at Y." The verdict is that it is a *proximate mechanism for temptation*, not a *constitutive account of weakness*.
      *   *Tone:* Keep it respectful of the cognitive science tradition (Ainslie is huge) but firm on the philosophical distinction. The user is a cog sci student, so don't dismiss the math, but contextualize its philosophical reach.

  5.  **Final Polish:**
      *   Ensure citations/references are clear (Aristotle, Davidson, Ainslie, Holton, Sozou).
      *   Check flow and transitions.
      *   Make sure the "Verdict" section is distinct and actionable for the dissertation.

  6.  **Final Review against constraints:**
      *   Essay form? Yes.
      *   Treat controversy seriously? Yes.
      *   Include Sozou/Holton? Yes.
      *   Specific verdict? Yes.
      *   No non-committal ending? Yes.

  *(Self-Correction Note)*: I need to be careful not to conflate "preference" and "judgment." In economics, revealed preference says action = preference. In philosophy, judgment can diverge from action. The essay must highlight this divergence as the crux of the problem.

  7.  **Drafting the Content.** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **The Curve and the Will: On the Explanatory Limits of Hyperbolic Discounting for Akrasia**

  **Introduction**

  The integration of cognitive science and philosophy of action is often touted as a path to dissolving ancient puzzles through empirical precision. In the study of intertemporal choice, the dominant hope has been that hyperbolic discounting models provide the mechanistic substrate for *akrasia*, or weakness of will. The logic appears straightforward: if an agent's valuation function is hyperbolic rather than exponential, they will inevitably undergo preference reversals as a reward nears, leading them to choose a smaller-sooner good over a larger-later one they previously endorsed. This looks like weakness of will.

  However, as your committee member suggested, this identification rests on a category error. The philosophical puzzle of akrasia, articulated by Aristotle and refined by Donald Davidson, is fundamentally *synchronic*: it concerns an agent acting against their *current* best judgment. Hyperbolic discounting, particularly when framed through George Ainslie's picoeconomics, describes a *diachronic* conflict between successive temporal slices of the self. When we add the complications of rational hazard-rate updating (Sozou) and resolution-based accounts of willpower (Holton), the claim that hyperbolic discounting *is* an account of akrasia begins to unravel.

  This essay argues that hyperbolic discounting models, while empirically robust descriptions of valuation dynamics, fail to constitute a sufficient account of akrasia. They explain the *pressure* of temptation, but not the *failure of authority* that defines weakness of will. Consequently, your dissertation must hedge its theoretical framing: hyperbolic discounting should be presented not as the definition of akrasia, but as a background condition that makes akrasia probable within a specific architecture of agency.

  **The Synchronic Puzzle: Aristotle and Davidson**

  To see why the discounting model changes the subject, we must first rigorously define the target. In *Nicomachean Ethics* Book VII, Aristotle distinguishes the akratic agent from the brutish or the vicious. The vicious agent believes their bad action is good; the akratic agent knows it is bad but does it anyway. The puzzle is how knowledge can be present yet ineffective.

  Donald Davidson revitalized this puzzle in "How Is Weakness of the Will Possible?" by framing it as a violation of the principle of continence: it is irrational to act intentionally against an all-things-considered (ATC) judgment. Davidson's crucial move was distinguishing between a conditional judgment ("Action A is better than B, all things considered") and an unconditional judgment ("Action A is to be done now"). He suggests the akratic agent holds the ATC judgment but fails to form the unconditional one.

  While you note that Davidson's distinction feels like a redescription, it highlights the synchronic nature of the problem. For akrasia to occur, the judgment that "Y is better" must be held *at the moment of acting*. If the agent, at the moment of choice, genuinely judges "X is better," they are not weak-willed; they have simply changed their mind. Rational agents change their minds when new evidence arises; akratic agents act against their standing better judgment. The philosophical sting of akrasia lies in this simultaneity: the agent is split *now*, not just across time.

  **The Diachronic Shift: Ainslie and the Bargaining Selves**

  Hyperbolic discounting models, particularly in the tradition of George Ainslie, dissolve this synchronic tension by distributing it across time. In a hyperbolic model, the value of a reward is discounted by a factor of $1 / (1 + kD)$. Because this curve is steeper for short delays than long delays, two curves can cross. At time $t_1$ (far from reward), the Larger-Later (LL) reward is valued higher than the Smaller-Sooner (SS). At time $t_2$ (close to SS), the valuation flips: SS > LL.

  Ainslie interprets this as a bargaining problem between successive selves. Self-1 wants to save for retirement; Self-2 (at the moment of spending) wants to buy a luxury good. Self-2 is not acting against *its* current best judgment; Self-2 genuinely values the luxury good more than the retirement savings at that moment. The "irrationality" is only visible from the perspective of Self-1.

  This is where the subject changes. Ainslie provides a compelling model of *dynamic inconsistency*, but dynamic inconsistency is not identical to akrasia. In the picoeconomic picture, there is no single agent acting against their own current judgment. There is a sequence of agents, each acting consistently with their current discount function. If Self-2 chooses the SS reward, Self-2 is being instrumentally rational relative to Self-2's preferences. To call this akrasia requires importing a normative standpoint from Self-1 and imposing it on Self-2. But if Self-2 is a distinct locus of preference, why is Self-1's judgment authoritative?

  By modeling the agent as a succession of selves, hyperbolic discounting explains why plans fail, but it explains away the *unity* required for weakness of will. Akrasia requires a single agent who is master of their house but fails to rule it. Ainslie describes a house where the tenants change every hour and the new tenant locks out the old. This is a tragedy of coordination, not a failure of will.

  **The Rationality Challenge: Sozou and the Hazard Rate**

  The philosophical worry deepens when we question whether hyperbolic discounting represents irrationality at all. Standard economic theory treats exponential discounting as the rational norm and hyperbolic discounting as a cognitive bug. However, as P.D. Sozou (1998) demonstrated, hyperbolic discounting can be derived from perfectly rational Bayesian updating.

  Sozou's argument posits that if an agent is uncertain about the hazard rate (the probability that a reward will fail to materialize before it is received), they should discount the future more steeply the further out it is, but also update that probability as time passes. If the hazard rate is unknown, the mere passage of time without the reward disappearing provides evidence that the environment is safe. This updating process mathematically yields a hyperbolic discount function.

  If Sozou is correct, the "preference reversal" near the reward is not a failure of rationality but an adaptive response to uncertainty. As the reward draws near, the probability of it actually being available increases, justifying a sharp rise in its present value.

  This poses a devastating challenge to the akrasia interpretation. Akrasia is, by definition, a normative failure—an irrational action. If the agent's valuation shift is the output of a rational Bayesian process optimizing for expected utility under uncertainty, then the agent is not weak-willed; they are epistemically diligent. They are responding to new information (the fact that the reward has not yet vanished). If the behavior is rational, it cannot be akrasia. Thus, a raw hyperbolic discounting model cannot explain akrasia because, under plausible assumptions, it describes rational behavior. To get akrasia, one must assume the discounting is *erroneous* or *pathological*, which the model itself does not specify.

  **The Volitional Challenge: Holton and Resolutions**

  Even if we grant that the discounting is pathological, Richard Holton's work suggests that discounting models miss the mechanism of willpower entirely. In *Willing Not to Be Tempted*, Holton argues that the standard belief-desire model (which discounting models inhabit) cannot account for strength of will. In that model, action is determined by the strongest desire. If I eat the cake, my desire for cake was stronger than my desire for health. To say I was "weak-willed" is just to say I had a weaker desire for health; it adds no explanatory power.

  Holton relocates the phenomenon. Strength of will is not about having stronger desires; it is about maintaining *resolutions*. A resolution is a distinctive mental state, an intention that is resistant to revision. The akratic failure is not that the value of the cake spiked (the discounting curve); it is that the agent abandoned their resolution in the face of that spike.

  This distinction is vital for your dissertation. Hyperbolic discounting explains why the *temptation* gets stronger. It explains the input to the volitional system. But Holton shows that the *will* is the mechanism that resists re-evaluating the choice in light of that temptation. An agent with strong willpower might experience the exact same hyperbolic spike in value for the SS reward but refuse to act on it because they have bound themselves to a prior resolution.

  Therefore, hyperbolic discounting describes the *environment of the will*, not the *will itself*. To equate the curve with the weakness is to confuse the wind with the sailor's failure to hold the tiller. The wind (temptation) may gust hyperbolically, but the failure (akrasia) lies in the steering mechanism (resolution maintenance).

  **Verdict: A Necessary Condition, Not a Constitutive Account**

  We must now resolve the tension. Does hyperbolic discounting explain akrasia? The verdict must be negative, but nuanced. Hyperbolic discounting is not an account of akrasia; it is an account of *temporal valuation dynamics*.

  1.  **It fails the Synchronic Test:** Akrasia requires acting against a *current* judgment. Hyperbolic discounting predicts a *shift* in judgment (or preference) such that the action aligns with the current valuation. Unless you posit a dual-system architecture where a "reflective" judgment persists alongside a "visceral" preference (as in some dual-process theories), the discounting model alone predicts consistency at the moment of action, not synchronic conflict.
  2.  **It fails the Normative Test:** As Sozou shows, hyperbolic curves can be rational. Akrasia is irrational. Therefore, the curve alone cannot identify the failure. You need an independent normative standard to declare the discounting "excessive" or "mistaken."
  3.  **It fails the Mechanistic Test:** As Holton argues, willpower operates on intentions and resolutions, not just value comparisons. Discounting explains why the intention is tested, not why it breaks.

  **Implications for Your Dissertation**

  This verdict requires a specific adjustment in your theoretical framing chapter. You cannot write that "hyperbolic discounting models explain weakness of will." This invites the philosophical objection that you are reducing a normative failure of agency to a descriptive function of time preference.

  Instead, you should frame hyperbolic discounting as the **proximate mechanism of temptation** that creates the *conditions of possibility* for akrasia. Your argument should be that human agents possess a valuation system that generates dynamic inconsistencies (Ainslie), and that these inconsistencies place a load on executive control systems responsible for maintaining resolutions (Holton). Akrasia occurs when the executive control system fails to inhibit the action prescribed by the short-term discount spike.

  This framing respects the philosophical puzzle. It acknowledges that the *curve* is not the *weakness*. The weakness lies in the coupling between the valuation system and the action selection system. Specifically, you should argue that akrasia is the failure of the long-term self to bind the short-term self, a failure that is *provoked* by hyperbolic discounting but not *identical* to it.

  **Conclusion**

  The philosopher on your committee was right to push back. Identifying hyperbolic discounting with akrasia is a category mistake that conflates the shape of desire with the failure of judgment. Ainslie's picoeconomics offers a brilliant account of why we are tempted, and Sozou reminds us that such temptation may be rational. Holton clarifies that resisting it requires more than just calculation—it requires the maintenance of policy.

  For your dissertation to withstand philosophical scrutiny, you must treat hyperbolic discounting as the *engine of conflict*, not the *definition of defeat*. By positioning your work as an investigation into how cognitive systems manage (or fail to manage) the dynamic inconsistencies produced by hyperbolic valuation, you preserve the integrity of the philosophical concept of akrasia while leveraging the predictive power of the cognitive science. You are not explaining away the will; you are mapping the terrain upon which it struggles.
