answer: |-
  1. **The Metaphysics/Psychology Distinction**
  You've made a compelling case that our intuitive reactions to moral luck are errors in the "psychology of blame" rather than truths about the "metaphysics of responsibility." But if our moral practices are fundamentally human practices, rooted in how we relate to one another, is there any meaningful sense in which the metaphysics can remain so cleanly severed from the psychology? If everyone *feels* the luck is real, does insisting it isn't risk making your theory descriptively accurate but practically inert?

  2. **The Cost of Revisionism**
  Let's assume you are right that the reckless driver who kills and the one who doesn't are equally blameworthy. To maintain this, you have to ask us to radically revise our everyday judgments. Why should we accept a theory of responsibility that requires us to ignore such a salient feature of our moral experience? Is the theoretical purity of the Control Principle worth the cost of alienating us from our own moral intuitions?

  3. **Nagel and Circumstantial Luck**
  I want to press you on Thomas Nagel's category of *circumstantial luck*. Consider two people with identical temperaments: one lives under a benign government and never faces a moral test, while the other lives under an occupying regime and is forced to collaborate or resist. We tend to praise the resister. But if the Control Principle holds, the person in the benign regime was simply "lucky" not to be tested. If luck negates blame in the case of the unlucky driver, why doesn't it also negate *praise* in the case of the untested saint? Doesn't your principle imply that virtue is just as much an illusion as vice?

  *   **Prepared Follow-Up (If she distinguishes assessing the will from assessing the whole person):**
      "You're drawing a line between assessing the *will* the agent possesses in the moment versus assessing the *person* over a lifetime. But if the quality of that will is itself a product of the circumstance they were lucky enough to face (or avoid), haven't you just pushed the luck back one step? How can you credit the will without crediting the conditions that formed it?"

  4. **Outcomes as Moral Data**
  Defenders of moral luck often argue that outcomes aren't just random noise; they provide essential information about the agent's intent and capacity that wasn't visible before the action. If we strip away the result, aren't we blinding ourselves to evidence about the agent's actual relationship to the world? Why should the metaphysics of blame ignore data that the psychology of blame rightly treats as evidentiary?

  5. **Williams and Agent-Regret**
  Bernard Williams argued that *agent-regret* is a distinct sentiment: the driver who hits a child feels something the bystander with identical information does not. You classify this as a psychological error. But if it is an error, why is it so systematically tied to agency? Why does this 'mistake' feel appropriate to the agent in a way it never does to the observer? Doesn't the specificity of the emotion suggest it's tracking a real moral distinction, not just a cognitive glitch?

  *   **Prepared Follow-Up (If she distinguishes assessing the will from assessing the whole person):**
      "You suggest we can separate the evaluation of the will from the emotional life of the person. But if the 'error' of agent-regret is a constitutive part of what it means to be a moral agent, doesn't excising it damage the very concept of agency you're trying to protect? Can you have a theory of responsibility that tells agents they *shouldn't* feel the signature emotion of responsibility?"

  6. **The Symmetry of Good Luck**
  We often discuss moral luck in terms of blame, but what about praise? If a scientist makes a discovery because she was lucky enough to be in the right lab at the right time, do we diminish her credit? If we don't—if we allow luck to enhance praise but not blame—doesn't that reveal an asymmetry in your defense? Or are you prepared to say that our heroes are no more praiseworthy than their lucky counterparts?

  7. **Constitutive Luck and the Will**
  Let's push the individuation strategy down to *constitutive luck*. You argue that blameworthiness tracks the quality of the will, not the result. But the temperament, patience, and cognitive capacities that make a will "good" or "bad" are largely unchosen. If I have a calm will because of my genetics, and you have a volatile one, haven't you simply relocated the luck problem from the *consequences* of the action to the *constitution* of the actor?

  *   **Prepared Follow-Up (If she distinguishes assessing the will from assessing the whole person):**
      "I anticipate you'll say we assess the will *as it is*, regardless of its origin. But if the agent had no control over the architecture of that will, in what sense is it *hers* to own? If the Control Principle is strict, doesn't tracing the will back to its unchosen origins dissolve the ownership required for blame?"

  8. **The Function of Blame**
  If our reactive attitudes are systematically mistaken about what people deserve, what function does blame actually serve in your framework? Is it purely forward-looking, a tool for behavior modification? If so, are we not treating agents as objects to be managed rather than persons to be held accountable?

  9. **The Social Practice of Responsibility**
  Philosophers like P.F. Strawson argued that we cannot step outside our "participant stance" to judge responsibility objectively. By claiming access to a metaphysical view where luck doesn't exist, aren't you attempting to occupy a "view from nowhere" that human beings simply cannot inhabit? Is a theory of responsibility viable if it requires us to cease being human participants in the moral community?

  10. **The Skepticism Dilemma**
  Finally, I want to put the dilemma directly to you. If you pursue the Control Principle rigorously enough to eliminate all traces of luck—circumstantial, constitutive, and resultant—don't you end up proving too much? Philosophers like Galen Strawson and Neil Levy argue that if you remove all luck, you remove all responsibility. Is your strict defense of the Control Principle actually a rescue mission for moral responsibility, or is it a slow-motion argument for hard incompatibility?
