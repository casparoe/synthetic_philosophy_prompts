prompt: |-
  Retired chemist here - only got properly into philosophy after I shut the lab down, and lately I've fallen down a rabbit hole reading old LessWrong posts on decision theory. Everyone seems to use "updateless decision theory" (UDT) and Yudkowsky's "timeless decision theory" (TDT) almost interchangably, like they're the same idea under different branding, but that doesn't feel right to me. Could you spell out precisely where the two actually diverge, using the counterfactual mugging case (Omega flips a coin, demands $100 from you on tails, would've handed over $10,000 on heads if you're the type who pays) to make it concrete - does TDT genuinely pay up there on its own terms, or does it only get the right answer by quietly smuggling in the "updateless" move? And overall, which of the two do you think is the more defensible theory once cases like that are on the table?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired chemist, new to philosophy but deep-diving into LessWrong (LW) decision theory. This implies a high level of analytical rigor, comfort with technical concepts, but potentially less familiarity with the specific jargon or historical evolution of LW thought. They want precision ("spell out precisely"), concrete examples (Counterfactual Mugging), and a critical evaluation ("which... is more defensible").
      *   **Core Question:** What is the precise divergence between Updateless Decision Theory (UDT) and Timeless Decision Theory (TDT)? Specifically, does TDT pay in the Counterfactual Mugging case on its own terms, or does it need to smuggle in updatelessness? Which is more defensible?
      *   **Key Case Study:** Counterfactual Mugging (Omega flips a coin, tails -> asks for $100, heads -> would have given $10k *if* you were the type to pay on tails).

  2.  **Deconstruct the Theories (TDT vs. UDT):**
      *   **TDT (Timeless Decision Theory):** Developed by Eliezer Yudkowsky (circa 2009). Key idea: Decide as if you are controlling the output of the abstract computation that is your decision algorithm. It uses causal graphs but includes "logical nodes" (your algorithm) that influence both your action and Omega's prediction. It *updates* on observations.
      *   **UDT (Updateless Decision Theory):** Developed by Wei Dai (circa 2009). Key idea: Choose a policy *before* receiving any observations. Maximize expected utility across all possible worlds weighted by prior probability, without conditioning on current information. It does *not* update.

  3.  **Analyze the Counterfactual Mugging Case:**
      *   **Setup:**
          *   Coin flip (50/50).
          *   Heads: Omega gives you $10,000 *if* Omega predicts you would have paid $100 on Tails.
          *   Tails: Omega asks you for $100. (You know the coin is Tails).
          *   Question: Do you pay the $100?
      *   **CDT (Causal Decision Theory):** No. Paying $100 now has no causal effect on the past coin flip or the counterfactual Heads world. Utility = -$100. Not paying = $0.
      *   **EDT (Evidential Decision Theory):** Tricky. If I pay, it's evidence I'm a payer. If I'm a payer, Omega would have given me $10k in the Heads world. But I know I'm in the Tails world. Standard EDT often updates on "I am in Tails world" and says paying doesn't change that.
      *   **TDT:** This is the crux. TDT conditions on observations.
          *   *Observation:* "The coin is Tails."
          *   *Calculation:* Given the coin is Tails, the Heads world is counterfactual. Does my decision now logically constrain Omega's prediction in the *counterfactual* Heads world?
          *   *Problem:* TDT treats the observation "Coin = Tails" as fixed. Once fixed, the logical link to the Heads world seems severed *from the perspective of the agent at that moment*.
          *   *Consensus:* Standard TDT *fails* Counterfactual Mugging. It updates on the coin being Tails, rendering the Heads payoff irrelevant to the current decision.
      *   **UDT:**
          *   *Policy:* Choose a function $S(Observation) \to Action$ *before* knowing the coin result.
          *   *Calculation:* Expected Utility = 0.5 * (Utility if Heads) + 0.5 * (Utility if Tails).
          *   If Policy = "Pay on Tails": EU = 0.5 * ($10,000) + 0.5 * (-$100) = $4,950.
          *   If Policy = "Don't Pay on Tails": EU = 0.5 * ($0) + 0.5 * ($0) = $0.
          *   *Result:* UDT pays.

  4.  **Address the Specific Question: "Does TDT genuinely pay up... or smuggle in updatelessness?"**
      *   *Honest Answer:* TDT, as originally formulated, does *not* pay in Counterfactual Mugging. It updates on the coin toss result.
      *   *Nuance:* Some proponents argued TDT *could* be extended, but the consensus in the LW community (including Yudkowsky eventually) was that TDT is insufficient for problems involving logical correlation across counterfactuals where observations screen off the correlation. UDT was explicitly created to solve the problems TDT couldn't (like Counterfactual Mugging and Parfit's Hitchhiker variants).
      *   *Smuggling?* If a TDT agent pays, it's usually because it's acting as a "pre-commitment" agent, which effectively makes it UDT. So yes, if TDT gets the right answer, it's behaving updatelessly.

  5.  **Evaluate Defensibility:**
      *   **TDT Pros:** More intuitive for Newcomb's Problem and Prisoner's Dilemma (with clones). Handles "observations" better in standard causal settings.
      *   **TDT Cons:** Fails Counterfactual Mugging. Fails problems where the observation itself is correlated with the decision algorithm in a way that screening off hurts.
      *   **UDT Pros:** Consistently wins (dynamic consistency). Solves Counterfactual Mugging, Newcomb, Parfit's Hitchhiker, etc.
      *   **UDT Cons:** Computationally intractable (needs to evaluate all possible worlds). "Prior" problem (what prior do you use?). Counter-intuitive (ignoring known information).
      *   **Current LW Consensus:** UDT (or its successors like Functional Decision Theory - FDT) is generally regarded as superior theoretically, though TDT was a necessary stepping stone. FDT is essentially the polished version of this lineage.

  6.  **Drafting the Response (incorporating the Chemist Persona):**
      *   *Tone:* Respectful, precise, analytical, avoiding unnecessary mysticism. Acknowledge their background.
      *   *Structure:*
          1.  Validate the intuition (they are not the same).
          2.  Define the core mechanical difference (Updating vs. Policy Selection).
          3.  Walk through Counterfactual Mugging step-by-step for both.
          4.  Answer the "smuggling" question directly.
          5.  Comparative evaluation (Defensibility).
          6.  Mention FDT (Functional Decision Theory) as the modern synthesis.

  7.  **Refining the TDT Analysis (Self-Correction/Verification):**
      *   *Wait, did Yudkowsky claim TDT solves Counterfactual Mugging?* In the original 2009 TDT paper, he discusses it. He acknowledges TDT *as described* might fail unless it treats the coin flip as a logical fact rather than an observed fact. But the standard interpretation is that TDT updates on observations.
      *   *Key Distinction:* TDT conditions on $O$ (Observation). UDT conditions on nothing (or rather, optimizes the mapping $O \to A$ globally).
      *   *In Counterfactual Mugging:* The observation "Coin=Tails" tells the TDT agent that the Heads world is impossible *given the observation*. Therefore, the $10k payoff is in a world with probability 0 *conditional on the observation*. TDT maximizes $E[U | Observation]$. UDT maximizes $E[U]$ (prior).
      *   *Conclusion:* TDT fails Counterfactual Mugging without modification.

  8.  **Final Polish:**
      *   Ensure the distinction between "decision" (action) and "policy" (mapping) is clear.
      *   Make sure the "logical node" concept is explained simply (the chemist will get the "algorithm as physical/logical object" idea).
      *   Add the note about FDT, as reading old LW posts might miss the 2017 update.

  9.  **(Self-Correction on "Smuggling"):** Be careful not to say TDT *can't* be fixed. But the fix *is* making it updateless. So the user's suspicion is correct.

  10. **Final Review against constraints:**
      *   Did I use the Counterfactual Mugging case? Yes.
      *   Did I answer if TDT pays on its own terms? Yes (No).
      *   Did I evaluate defensibility? Yes.
      *   Tone appropriate? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Welcome to the rabbit hole. It is a pleasure to speak with someone who appreciates precision; the LessWrong sequence era often suffered from enthusiastic hand-waving, which can be frustrating for someone with a hard science background.

  Your intuition is correct: **TDT and UDT are not the same idea under different branding.** While they share a lineage and a goal (defeating Causal Decision Theory in Newcomb-like problems), they diverge fundamentally on how they handle information.

  Here is the precise mechanical divergence, analyzed through the Counterfactual Mugging, followed by an evaluation of their defensibility.

  ### 1. The Core Mechanical Divergence

  The difference lies in **when** the expected utility calculation is performed relative to the receipt of observations.

  *   **TDT (Timeless Decision Theory):** You update on your observations, *then* choose an action. You treat your decision as the output of a logical computation, but you condition your expected utility calculation on the specific information you currently hold.
      *   *Formula:* Maximize $E[\text{Utility} \mid \text{Observations}, \text{Algorithm Output} = \text{Action}]$.
  *   **UDT (Updateless Decision Theory):** You choose a **policy** (a mapping of all possible observations to actions) *before* receiving any observations. You never "update" in the Bayesian sense; you merely execute the pre-calculated optimal policy based on where you find yourself.
      *   *Formula:* Maximize $E[\text{Utility} \mid \text{Algorithm} = \text{Policy}]$ (weighted by prior probabilities of all worlds).

  In short: TDT asks, "Given what I know now, what should I do?" UDT asks, "What rule should I have written for myself before I knew anything?"

  ### 2. The Counterfactual Mugging Test Case

  Let's run the chemistry on the Counterfactual Mugging to see where the reaction precipitates.

  **The Setup:**
  *   Omega flips a fair coin.
  *   **Heads:** Omega gives you $10,000 *if* it predicts you would have paid $100 had the coin been Tails.
  *   **Tails:** Omega asks you for $100. (You observe the coin is Tails).
  *   **Question:** Do you pay the $100?

  #### How TDT Processes This
  1.  **Observation:** The TDT agent observes "Coin = Tails."
  2.  **Update:** The agent updates its probability distribution. The probability of the "Heads" world, *conditional on the observation*, is now 0.
  3.  **Calculation:** The agent evaluates the causal/logical consequences of paying $100 *in the Tails world*.
      *   Paying costs $100.
      *   Does paying influence the Heads world? No. The coin has already landed. The prediction was made in the past. In the TDT causal graph, the node "Coin = Tails" screens off the logical connection to the counterfactual "Coin = Heads" world once observed.
      *   Since the Heads world is now probability 0 (conditional on observation), the potential $10,000 gain is irrelevant.
  4.  **Result:** **TDT does not pay.** It behaves like Causal Decision Theory (CDT) in this specific instance.

  *Note:* Some early TDT proponents argued that if the coin flip is treated as a logical fact rather than an empirical observation, TDT might pay. However, the standard formulation of TDT conditions on observations. If TDT pays, it is only because it has effectively ceased to be TDT and adopted an updateless stance.

  #### How UDT Processes This
  1.  **Pre-computation (The "Source Code"):** Before the coin is flipped, the UDT agent considers all possible policies.
      *   *Policy A (Always Pay on Tails):*
          *   50% chance Heads: Omega predicts "Pay", gives $10,000.
          *   50% chance Tails: Agent pays $100.
          *   Expected Utility: $0.5 \times 10,000 + 0.5 \times (-100) = \$4,950$.
      *   *Policy B (Never Pay on Tails):*
          *   50% chance Heads: Omega predicts "Don't Pay", gives $0.
          *   50% chance Tails: Agent pays $0.
          *   Expected Utility: $0$.
  2.  **Selection:** UDT selects Policy A as optimal based on the prior.
  3.  **Execution:** The coin lands Tails. The agent observes "Tails." It does **not** recalculate. It simply executes the function: `If Tails -> Pay`.
  4.  **Result:** **UDT pays.**

  ### 3. Does TDT "Smuggle" the Move?

  You asked: *Does TDT genuinely pay up there on its own terms, or does it only get the right answer by quietly smuggling in the "updateless" move?*

  **It smuggles it.**

  If you encounter a TDT agent that pays in the Counterfactual Mugging, it is because the agent has been modified to ignore the observation "Coin = Tails" for the purpose of the utility calculation. But ignoring relevant observations *is the definition of updatelessness*.

  Yudkowsky himself eventually acknowledged this. In the sequence history, TDT was viewed as a stepping stone. It solved Newcomb's Problem and the Prisoner's Dilemma (with clones) by introducing "logical nodes" into the causal graph. However, Counterfactual Mugging revealed that logical nodes aren't enough if you update away the correlation before you act.

  To fix TDT to pay in Counterfactual Mugging, you must prevent it from updating on the coin toss. Once you do that, you have reinvented UDT.

  ### 4. Which is More Defensible?

  As a retired chemist, you likely value a theory that is robust across boundary conditions.

  **The Case for UDT (and its successor, FDT):**
  *   **Dynamic Consistency:** UDT agents never regret their decision procedure. A TDT agent, upon seeing "Tails," regrets not being the type of agent who pays. A UDT agent does not, because it knows that being the type who pays was the only way to access the $10,000 world.
  *   **Reflective Stability:** If a UDT agent could rewrite its own code, it would rewrite it to be UDT. A TDT agent might want to rewrite itself to be UDT to solve Counterfactual Mugging, implying TDT is not reflectively stable.
  *   **Scope:** UDT handles a strictly larger set of decision problems (including Parfit's Hitchhiker and Counterfactual Mugging) than TDT.

  **The Case Against UDT (The "Prior Problem"):**
  *   **Computational Intractability:** UDT requires calculating expected utility over *all* possible logical worlds weighted by a prior. For a finite human (or AI), this is often impossible. TDT is more computationally local.
  *   **The Prior:** UDT relies heavily on the Solomonoff prior (or similar). If your prior is wrong, your updateless policy is catastrophically wrong, and you cannot correct it with evidence (since you don't update). TDT is more robust to bad priors because it allows learning.
  *   **Intuition:** It feels deeply wrong to ignore information you possess. (Though UDT proponents argue this is a cognitive bias; you aren't ignoring the info, you are executing a plan that accounted for the info before you had it).

  ### The Verdict

  In the modern LessWrong consensus (post-2017), **neither TDT nor UDT is the final word.** They have largely been superseded by **Functional Decision Theory (FDT)**, developed by Yudkowsky and Soares.

  FDT is essentially the rigorous formalization of the intuition behind UDT, stripped of some of the confusing "possible worlds" talk and framed in terms of subjunctive dependence (logical correlation). FDT pays in Counterfactual Mugging. TDT does not.

  **Summary for your records:**
  1.  **Divergence:** TDT updates on observations; UDT optimizes a policy over the prior.
  2.  **Counterfactual Mugging:** TDT fails (doesn't pay). UDT succeeds (pays).
  3.  **Smuggling:** If TDT pays, it is acting updatelessly.
  4.  **Defensibility:** UDT (and FDT) is theoretically superior regarding decision-theoretic consistency, though TDT is more computationally tractable and robust to prior error.

  If you are reading old posts, keep in mind that the "TDT vs. UDT" debate was largely resolved by merging them into FDT. But your suspicion that they were being used interchangeably despite a crucial mechanical difference was spot on.
