      *   **Thomson's Lamp:** Task: Toggle switch. Steps: On, Off, On, Off... Time intervals: $1/2, 1/4, 1/8, \dots$ (summing to 1 minute).
          *   *The Problem:* At $t=1$, is the lamp on or off?
          *   *Mathematical Structure:* The state variable $S(t)$ is discrete $\{0, 1\}$. It oscillates. $\lim_{t \to 1} S(t)$ does *not* exist.
