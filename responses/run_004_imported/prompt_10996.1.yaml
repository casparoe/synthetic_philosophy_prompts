answer: |-
  This is an excellent objection, and it cuts to the heart of a tension in metaethics that Toby Ord is trying to navigate. You are not "missing something" obvious; rather, you have identified what is often called the **integrity objection** or the **complicity objection** to moral trade.

  Your intuition is that if Moral Realism is true (i.e., there are objective moral facts), then one party in the trade is objectively mistaken. Facilitating their error—even partially—seems like a moral cost, not a gain.

  However, Ord's claim that moral trade is compatible with realism relies on a few specific distinctions. To evaluate whether you are right that it "quietly presupposes relativism," we need to look at how a Realist can justify the trade without abandoning the idea of objective truth.

  Here is a breakdown of why Ord thinks they are compatible, and where your objection holds the most weight.

  ### 1. Gain vs. Truth
  The first thing to clarify is how Ord defines "gain." In economic trade, two people trade not because they agree on the *objective value* of the goods, but because they have different *subjective valuations*. I value your apple more than my dollar; you value my dollar more than your apple.

  Ord argues moral trade works similarly.
  *   **The Vegetarian (V)** believes eating meat is objectively wrong (say, -10 moral units per meal).
  *   **The Meat-Eater (M)** believes eating meat is permissible (0 moral units) but values money (+5 units).

  If V pays M to skip a meal, V spends -5 units (money) to gain +10 units (less suffering), for a net +5. M loses 0 (meat enjoyment) but gains +5 (money), for a net +5.

  **The Realist Defense:** A Moral Realist can accept this calculation without becoming a Relativist. The Realist doesn't have to say, "M's view that meat is okay is equally valid." They simply say, "M's view is false, but M's *behavior* is causally linked to outcomes I care about."
  *   **Relativism says:** "Neither of us is objectively right; we just have different preferences."
  *   **Ord's Realism says:** "I am objectively right, but in a pluralistic world, I can leverage your self-interest to produce objectively better outcomes (less suffering)."

  For the Realist, the "gain" isn't that both moral views were validated; the gain is that the **state of the world** improved according to the objective metric (e.g., less suffering occurred).

  ### 2. Non-Ideal Theory
  Your objection assumes that if an act is wrong, it must be stopped completely to count as a moral victory. This is a view often associated with **Ideal Theory**. However, most Realists (especially consequentialists) accept **Non-Ideal Theory**.

  In a non-ideal world, we cannot always achieve the perfect outcome.
  *   **Scenario:** You encounter a bank robber. You can't stop him completely, but you can bribe him to take half the money instead of all of it.
  *   **Realist View:** Bribing him is objectively better than letting him take it all, even if the "ideal" action was stopping him entirely.

  Ord argues that moral trade is a tool for non-ideal theory. The Vegetarian acknowledges they cannot force the Meat-Eater to stop. Therefore, the **objectively best available action** is to reduce the harm, even if the mechanism (a trade) feels like a compromise. The "false view" of the Meat-Eater remains false, but the *consequences* of that view are mitigated.

  ### 3. The Complicity Objection (Where you are strongest)
  Your specific worry is: *"The person with the false view is simply being paid to keep acting wrongly."*

  This is the strongest argument against Ord's compatibility claim. It suggests that the *act of trading itself* might be morally tainted for the Realist.
  *   **Deontological Realism:** If you are a Kantian Realist, you might argue that treating the Meat-Eater's moral error as a bargaining chip violates the Categorical Imperative. You are essentially saying, "I will fund your life (via cash) conditional on you sinning less." Some deontologists would argue this makes the Vegetarian complicit in the remaining meat-eating.
  *   **Consequentialist Realism:** A Utilitarian Realist would likely reject your objection. They would say, "Complicity is a feeling, not a fact. The fact is that fewer animals died. The source of the money is irrelevant to the suffering of the cow."

  So, does moral trade presuppose relativism? **No, but it does presuppose a specific kind of Realism.** It fits comfortably with **Consequentialist Realism** (where outcomes matter most) but creates tension for **Deontological Realism** (where the purity of the action matters).

  Ord acknowledges this. He doesn't claim *all* Realists must accept moral trade, only that accepting moral trade doesn't *force* you to abandon Realism. You can be a Realist and still believe that reducing objective wrongs via incentives is better than allowing more objective wrongs.

  ### 4. Moral Uncertainty
  It is worth noting that Ord's broader work (specifically in *The Precipice* and his papers on moral uncertainty) adds another layer. He argues that even committed Realists should admit **epistemic uncertainty**.

  Even if there is an objective truth, I cannot be 100% certain I possess it.
  *   If I am 90% sure meat is wrong, I should still hedge my bets.
  *   Moral trade becomes a way to maximize **Expected Moral Value**.

  In this framework, the trade isn't based on "your truth vs. my truth" (Relativism), but on "my confidence level vs. your confidence level." This allows a Realist to engage in trade without admitting their core view might be false; they are simply acknowledging they might be mistaken about the *application* of the truth.

  ### Conclusion: Are you right?
  You are right to be skeptical, but the conclusion that it *presupposes relativism* is too strong.

  1.  **It does not require Relativism:** A Realist can view the trade as a pragmatic tool to minimize objective harm in a world where they lack total coercive power. The "gain" is in the **outcome**, not in the validation of the other person's moral theory.
  2.  **It does require Normative Flexibility:** Your objection holds water if you hold a rigid, purity-based moral framework (some forms of Deontology or Virtue Ethics). If you believe that associating with sin corrupts the good, moral trade is impossible for you. But that is a normative disagreement, not a metaethical one.
  3.  **The "Odd Gain":** You called it an "odd thing to call a mutual gain." Ord would agree it is odd, but argue it is mathematically sound. If I value "less murder" at $100, and you value "committing less murder" at -$50 (because you like murder) but value "$60 cash" at +$60, we trade. I get less murder (Good), you get cash (Good). The fact that you still think murder is fine doesn't change the objective reduction in murder.

  **For your project:**
  You have found a genuine tension. A strong paper would argue that while Ord is technically correct that Realism *can* accommodate moral trade, it comes at a cost: it forces the Realist to adopt a **consequentialist** or **pragmatic** posture that might undermine the "objective weight" they assign to their moral truths. It risks turning objective duties into negotiable preferences *in practice*, even if not *in theory*.

  So, you aren't missing something; you've identified the friction point where abstract metaethics meets messy human negotiation. Ord says the friction is manageable; you are arguing it might be enough to break the mechanism. Both are defensible philosophical positions.
