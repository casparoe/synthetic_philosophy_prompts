answer: |-
  Here is a concrete bargaining problem designed to demonstrate the divergence between the Nash and Kalai-Smorodinsky solutions, suitable for your graduate seminar.

  ### 1. The Bargaining Problem

  Let the two players be $1$ and $2$. We define the problem $(S, d)$ as follows:

  *   **Disagreement Point:** $d = (0, 0)$.
  *   **Feasible Set:** $S$ is the comprehensive, convex hull of the region bounded by the axes and a strictly concave Pareto frontier. We define the Pareto frontier explicitly by the function:
      $$ u_2 = 2 - 2u_1^2 $$
      for $0 \le u_1 \le 1$.
      Formally, $S = \{ (u_1, u_2) \in \mathbb{R}^2 \mid u_1 \ge 0, u_2 \ge 0, \text{ and } u_2 \le 2 - 2u_1^2 \}$.

  *   **Ideal Point:** To find the ideal point $a = (a_1, a_2)$, we maximize each player's utility individually within $S$:
      *   $a_1 = \max \{ u_1 \mid (u_1, u_2) \in S \} = 1$ (occurring at $u_2=0$).
      *   $a_2 = \max \{ u_2 \mid (u_1, u_2) \in S \} = 2$ (occurring at $u_1=0$).
      *   Thus, $a = (1, 2)$.

  Note that this problem is **asymmetric** ($a_1 \neq a_2$) and the frontier is **non-linear** (strictly concave).

  ---

  ### 2. Computing the Solutions

  #### The Kalai-Smorodinsky Solution (KSS)
  The KSS is the unique Pareto optimal point where the ratio of utility gains equals the ratio of maximum possible gains. Geometrically, it is the intersection of the Pareto frontier and the line segment connecting the disagreement point $d$ to the ideal point $a$.

  1.  **Ray Equation:** The line from $(0,0)$ to $(1,2)$ is given by $u_2 = 2u_1$.
  2.  **Intersection:** Substitute the ray equation into the frontier equation:
      $$ 2u_1 = 2 - 2u_1^2 $$
      $$ 2u_1^2 + 2u_1 - 2 = 0 $$
      $$ u_1^2 + u_1 - 1 = 0 $$
  3.  **Solve for $u_1$:** Using the quadratic formula, the positive root is:
      $$ u_1^{KS} = \frac{-1 + \sqrt{5}}{2} \approx 0.6180 $$
      (This is the inverse of the Golden Ratio, $1/\phi$).
  4.  **Solve for $u_2$:**
      $$ u_2^{KS} = 2u_1^{KS} = \sqrt{5} - 1 \approx 1.2361 $$

  **KSS Outcome:** $(0.6180, 1.2361)$

  #### The Nash Bargaining Solution (NBS)
  The NBS is the point in $S$ that maximizes the Nash product $(u_1 - d_1)(u_2 - d_2)$. Given $d=(0,0)$, we maximize $u_1 u_2$ subject to the frontier constraint.

  1.  **Objective Function:** Substitute the frontier constraint $u_2 = 2 - 2u_1^2$ into the product:
      $$ N(u_1) = u_1 (2 - 2u_1^2) = 2u_1 - 2u_1^3 $$
  2.  **First Order Condition:** Differentiate with respect to $u_1$ and set to zero:
      $$ \frac{dN}{du_1} = 2 - 6u_1^2 = 0 $$
      $$ 6u_1^2 = 2 \implies u_1^2 = \frac{1}{3} $$
  3.  **Solve for $u_1$:**
      $$ u_1^{Nash} = \frac{1}{\sqrt{3}} \approx 0.5774 $$
  4.  **Solve for $u_2$:**
      $$ u_2^{Nash} = 2 - 2\left(\frac{1}{3}\right) = \frac{4}{3} \approx 1.3333 $$

  **NBS Outcome:** $(0.5774, 1.3333)$

  ---

  ### 3. Numerical Divergence

  Comparing the two outcomes:

  | Solution | Player 1 Utility | Player 2 Utility |
  | :--- | :--- | :--- |
  | **Kalai-Smorodinsky** | $\approx 0.6180$ | $\approx 1.2361$ |
  | **Nash** | $\approx 0.5774$ | $\approx 1.3333$ |
  | **Difference** | **0.0406** | **-0.0972** |

  The solutions are distinct. The Nash solution favors Player 2 more heavily than the Kalai-Smorodinsky solution does. Player 1 receives approximately $7\%$ less utility under Nash than under Kalai-Smorodinsky in this specific configuration.

  ---

  ### 4. Axiomatic Diagnosis

  The divergence in this example highlights the incompatibility of **Independence of Irrelevant Alternatives (IIA)** and **Individual Monotonicity (IM)**.

  *   **Nash Violates Individual Monotonicity:**
      The KSS lies on the ray connecting $d$ to the ideal point $a$. This ensures that if the feasible set expands in a way that increases $a_1$ (Player 1's maximum possible utility) while holding $a_2$ constant, the solution ray becomes steeper, guaranteeing Player 1 a weakly higher utility (Individual Monotonicity).
      In our example, the NBS does *not* lie on the ray to the ideal point ($0.5774/1 \neq 1.3333/2$). The NBS is determined solely by the local curvature of the frontier (where the slope equals the negative ratio of utilities). Because it ignores the location of the ideal point $a$, the NBS solution concept cannot guarantee that Player 1 benefits from an expansion of their own maximum potential if that expansion occurs "far away" from the solution point on the frontier.

  *   **Kalai-Smorodinsky Violates IIA:**
      IIA requires that if a solution is chosen from a large set $S$, and we remove feasible outcomes that were not chosen to form a subset $S'$, the solution should remain unchanged.
      Imagine truncating our set $S$ to a smaller set $S'$ by cutting off the top-left corner of the frontier, such that the NBS point $(0.5774, 1.3333)$ remains feasible, but Player 2's maximum utility $a_2$ is reduced. The NBS would remain at $(0.5774, 1.3333)$ because the local trade-off at that point hasn't changed. However, the KSS would shift, because the ideal point $a$ has changed, altering the slope of the solution ray. Thus, KSS violates IIA.

  ### 5. Why Asymmetry and Curvature Were Indispensable

  Your students are correct that the solutions coincide in symmetric or linear cases. This example required both **asymmetry** and **curvature** to generate divergence:

  1.  **Why Linearity Fails to Distinguish:**
      If the Pareto frontier were a straight line connecting $(a_1, 0)$ and $(0, a_2)$, the Nash product maximization yields the *midpoint* of the utility gains (i.e., each player gets exactly half their ideal gain). The Kalai-Smorodinsky solution *also* yields the midpoint of the utility gains (by definition of the line segment to the ideal point). On linear frontiers, NBS and KSS are mathematically identical, regardless of asymmetry. Curvature is required to make the "tangent slope" condition (Nash) diverge from the "ray slope" condition (KSS).

  2.  **Why Symmetry Fails to Distinguish:**
      If the problem were symmetric (i.e., $S$ is invariant to swapping $u_1$ and $u_2$, and $d_1=d_2$), the **Symmetry Axiom** (which both solutions satisfy) forces the outcome to lie on the line $u_1 = u_2$. Since both solutions are constrained to the same line and must be Pareto optimal, they must select the same unique point on the frontier. Asymmetry is required to allow the solutions to occupy different positions along the frontier.

  By combining a **curved frontier** (breaking the linear coincidence) with **asymmetric ideal gains** (breaking the symmetric coincidence), this example isolates the fundamental axiomatic tension between the two theories.
