prompt: |-
  This summer I've been reading through some of W. V. O. Quine's papers for an independent project that grew out of my IB Theory of Knowledge class, where we spent a few weeks on the fact/value distinction. Quine is mostly known for his work in logic and epistemology, and both my teacher and most of what I could find online treat him as a philosopher who basically stayed out of ethics. But I tracked down a short, strange 1978 piece of his called "On the Nature of Moral Values" — which appeared that year both in the journal Critical Inquiry and in a festschrift for William Frankena, Charles Stevenson, and Richard Brandt, and was later folded into his essay collection Theories and Things — where he actually does take the subject on directly. He opens with a scenario about a dog that, for some unclear reason, ignores a turnip lying nearby, and uses it to argue that all behavior is a tangle of belief and desire. From there he argues that ethics stands on much shakier methodological ground than science does, because moral disagreements have nothing playing the role that observation sentences play in science: no shared trigger that makes everyone assent the instant they're confronted with it, the way a rabbit darting across a field makes everyone standing there agree that a rabbit just ran by. Still, he stops short of dismissing moral discourse as meaningless, and the handful of secondary sources I've found seem genuinely divided on whether the essay leaves Quine as a kind of noncognitivist, a naturalist who thought ethics could eventually be brought into the scientific fold like everything else, or something in between.

  Here is what I can't work out on my own, and my teacher wasn't much help either. Quine, together with Hilary Putnam, is also responsible for the indispensability argument: the claim that we ought to believe in things like numbers and sets because they are indispensable to our best scientific theories. More than a decade after Quine's death, the philosopher David Enoch built a version of that very same argument for moral realism, claiming that moral facts are just as indispensable to practical deliberation as mathematical facts are to physics, even if they don't do the same causal-explanatory work. Quine never got the chance to respond to Enoch directly, and I haven't come across anyone who has seriously tried to reconstruct how he would have. So: reasoning only from commitments Quine actually held — his naturalism, his holism, his insistence on observation as the anchor of any respectable ontology, and his own doubts about how methodologically secure ethics could ever be — would he have accepted Enoch's move as a legitimate extension of his own argument, or would he have had principled grounds for blocking it? Feel free to note considerations that cut in each direction, but please don't leave the question hanging: reconstruct the reasoning Quine most plausibly would have used, and end with a clear, defended verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is an IB student (or former student) who has been reading Quine independently, specifically focusing on the fact/value distinction and Quine's essay "On the Nature of Moral Values" (1978).
      *   **The Problem:** The user understands Quine's general stance (naturalism, holism, skepticism about ethics' methodological status compared to science) and knows about the Quine-Putnam Indispensability Argument (for mathematical realism). They also know about David Enoch's later adaptation of this argument for *moral* realism (the "deliberative indispensability" argument).
      *   **The Question:** Would Quine have accepted Enoch's extension of the indispensability argument to morality, or would he have rejected it based on his own philosophical commitments?
      *   **Constraints:** Reason only from commitments Quine actually held (naturalism, holism, observation sentences, ontology). Do not leave the question hanging; provide a clear, defended verdict.

  2.  **Deconstruct the Relevant Philosophical Positions:**

      *   **Quine's Naturalism:** Science is the ultimate arbiter of reality. "Naturalism is not a doctrine of philosophy but a finding of science." Ontology is determined by what our best scientific theories quantify over.
      *   **Quine's Indispensability Argument (Math):** We should believe in mathematical entities (sets, numbers) because they are indispensable to our best *scientific* theories (physics, etc.). They are posits that help organize observation.
      *   **Quine on Ethics ("On the Nature of Moral Values"):**
          *   Ethics lacks "observation sentences" that command universal assent (unlike "Lo, a rabbit").
          *   Moral statements are more akin to expressions of sentiment or social conditioning than empirical hypotheses.
          *   However, he doesn't call them meaningless. They function within a social fabric.
          *   He suggests ethics is methodologically weaker than science because it lacks the check of empirical prediction.
      *   **David Enoch's Deliberative Indispensability:**
          *   We engage in practical deliberation (deciding what to do).
          *   Moral facts/properties are indispensable to this deliberation (we can't make sense of deliberation without presupposing objective reasons/values).
          *   Therefore, we should be realists about moral facts (similar to how we are realists about numbers).
      *   **The Conflict:** Quine's indispensability is tied to *scientific* theory and *empirical* prediction. Enoch's is tied to *practical deliberation*.

  3.  **Evaluate the Compatibility (Quine vs. Enoch):**

      *   *Argument for Acceptance (The "Liberal Naturalist" reading):*
          *   Quine is a holist. The web of belief includes logic, math, and science. Maybe ethics is on the periphery, but still part of the web?
          *   Quine admits moral values have a function (social cohesion). If they are indispensable for social functioning, does that count?
          *   Quine rejected the analytic/synthetic distinction. Maybe the line between "scientific" and "practical" is blurrier than he lets on in the 1978 essay.

      *   *Argument for Rejection (The "Strict Naturalist" reading):*
          *   **Crucial Point:** For Quine, indispensability grants ontological status *only* if the theory in question is empirically confirmed science. Math is saved because it's embedded in physics.
          *   Ethics, for Quine, lacks the "observation sentence" anchor. It doesn't predict sensory stimuli.
          *   Enoch's argument relies on the indispensability of moral facts for *deliberation*, not for *prediction of observation*. Quine explicitly distinguishes between the "truth" of science (tracking reality) and the "function" of ethics (social regulation).
          *   Quine's ontology is sparse. He wants to minimize entities to those needed for the simplest explanation of sensory input. Moral facts don't explain sensory input.
          *   In "On the Nature of Moral Values," Quine explicitly contrasts the methodological security of science with the shakiness of ethics *because* of the lack of observational check. Enoch's argument bypasses the observational check. Quine would see this as a category error.

  4.  **Synthesize the Reasoning:**

      *   *Quine's Criterion:* Ontological commitment comes from bound variables in our best *scientific* theories.
      *   *The Role of Math:* Math is indispensable to *physics*. Physics predicts *observations*. Therefore, Math is indirectly tied to observations.
      *   *The Role of Ethics (per Quine):* Ethics is about conditioning and social utility. It is not a theory about the world's structure in the same way.
      *   *Enoch's Move:* Ethics is indispensable to *deliberation*.
      *   *Quine's Rebuttal:* Deliberation is not science. The "truth" of deliberation isn't the same as the "truth" of physics. To grant ontological reality to moral facts, they would need to earn their keep in the causal/explanatory network of the natural world, not just in our internal reasoning processes.
      *   *Key Textual Evidence:* In "On the Nature of Moral Values," Quine says moral statements are "categorically imperative" but lack the "objective check" of observation. He treats them as part of our "social technology," not our "description of reality."

  5.  **Drafting the Verdict:**

      *   *Introduction:* Acknowledge the sophistication of the question. It connects Quine's metaphysics (indispensability) with his metaethics (naturalism/skepticism).
      *   *The Case for Acceptance (Charitable):* Holism might suggest everything is connected. If we can't deliberate without moral facts, maybe they are real?
      *   *The Case for Rejection (Stronger):* Quine's naturalism is *scientific* naturalism. The anchor is *observation*. Math gets a pass because it's structurally necessary for the science that predicts observation. Ethics does not predict observation. Enoch's argument severs the link to empirical confirmation.
      *   *The "Observation Sentence" Hurdle:* This is the clincher. Quine insists on intersubjective observation as the tribunal of meaning and truth. Moral "observations" (intuitions?) don't work the same way (as per his 1978 essay).
      *   *Conclusion:* Quine would reject Enoch. He would view moral discourse as pragmatically useful but ontologically lightweight (not referring to mind-independent facts in the way numbers or electrons do).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, did Quine think numbers exist?* Yes, as abstract objects posited by science.
      *   *Did he think moral values exist?* He calls them "values," but treats them more like dispositions or social norms.
      *   *Is there a middle ground?* Quine might say moral statements are "true" in a deflationary sense (disquotation), but that doesn't mean moral *properties* exist in the ontology. Enoch wants robust moral realism. Quine would likely deny the robustness.
      *   *Focus on the "Indispensability" mechanism:* For Quine, indispensability works *because* of the empirical success of the theory containing the entity. Enoch argues indispensability works *because* of the normative force of deliberation. Quine would reject normative force as a truth-maker.

  7.  **Finalizing the Structure:**
      *   **Introduction:** Validate the user's research (it's a sharp question). State the thesis clearly upfront (Quine would reject Enoch).
      *   **Section 1: The Quinean Indispensability Argument (The Baseline).** Explain *why* math gets in (tied to empirical science).
      *   **Section 2: Quine's Metaethics in "On the Nature of Moral Values".** Explain the lack of observation sentences and the social-function view.
      *   **Section 3: The Clash with Enoch.** Why "deliberative indispensability" fails Quine's "empirical indispensability" test.
      *   **Section 4: Addressing Counter-arguments.** (Holism, Pragmatism). Why these don't save Enoch's case.
      *   **Conclusion:** Definitive verdict.

  8.  **Tone Check:** Keep it academic but accessible (IB level + independent study). Ensure it respects Quine's specific terminology (observation sentences, web of belief, ontological commitment).

      *(Self-Correction during drafting)*: Make sure to emphasize that Quine *does* allow moral discourse to have meaning, just not ontological weight in the scientific sense. Enoch wants ontological weight. That's the friction point.

      *(Final Polish)*: Ensure the distinction between "pragmatic utility" (which Quine grants ethics) and "ontological commitment" (which Quine reserves for science) is clear. Enoch tries to bridge them; Quine keeps them separate.

  9.  **Final Verdict Formulation:** Quine would reject Enoch. The indispensability argument is subservient to empirical confirmation. Moral deliberation lacks empirical confirmation. Therefore, no ontological commitment.

      *(Wait, one nuance)*: Quine sometimes speaks of ethics as evolving into science (sociobiology/psychology). If Enoch argued moral facts are natural facts discoverable by science, Quine might listen. But Enoch argues for *normative* facts indispensable to deliberation. Quine rejects normative facts as distinct from descriptive facts. This reinforces the rejection verdict.

      *Okay, ready to write.*
answer: |-
  This is an exceptionally sharp question. You have identified a genuine tension between Quine's metaphysics (specifically his criterion for ontological commitment) and his metaethics, and you are asking how a specific modern argument (Enoch's) would fare against the totality of Quine's system.

  Most introductory texts gloss over Quine's ethics because, as you noted, he is primarily a logician and epistemologist. However, "On the Nature of Moral Values" is crucial here because it reveals the limits of his naturalism. To answer your question, we must look closely at *why* Quine accepted the indispensability argument for mathematics and whether the conditions that saved the numbers would apply to moral values.

  Based on Quine's core commitments—specifically his **scientific naturalism**, his **criterion of ontological commitment**, and his specific diagnosis of **ethical methodology**—Quine would almost certainly **reject** David Enoch's deliberative indispensability argument. He would view it as a category error that misunderstands the role of the indispensability argument within his broader epistemology.

  Here is the reconstruction of the reasoning Quine would have used, followed by a defended verdict.

  ### 1. The Anchor: Why Math Gets In
  To understand why Quine would keep moral facts out, we first have to be precise about why he let mathematical entities in. Quine's indispensability argument is not a free-floating pragmatic claim that "anything useful is real." It is subservient to his **confirmation holism**.

  For Quine, our knowledge is a "web of belief." The outer edges of the web are "observation sentences" (like "Lo, a rabbit") that are directly triggered by sensory stimulation. The inner parts of the web (logic, mathematics, theoretical physics) are not directly observed. However, they are indispensable to the theories that *do* predict observations.
  *   **The Chain:** Mathematical entities $\rightarrow$ Indispensable to Physical Theory $\rightarrow$ Physical Theory predicts Observation Sentences $\rightarrow$ Observation Sentences are confirmed by sensory evidence.
  *   **The Verdict:** We believe in sets and numbers not because they are useful for *thinking*, but because they are necessary components of the simplest, most effective system for predicting *sensory experience*.

  Quine's ontology is therefore anchored in **empirical confirmation**. An entity earns a place in our ontology only if it is a posit of a theory that successfully negotiates the tribunal of sense experience.

  ### 2. The Barrier: Quine's Diagnosis of Ethics
  In "On the Nature of Moral Values," Quine explicitly argues that ethics fails to meet the methodological standards of science. His central complaint is the lack of a functional equivalent to the **observation sentence**.

  In science, if two observers see a rabbit, they both assent to "Lo, a rabbit." This intersubjective agreement anchors the truth of the statement to the world. In ethics, Quine argues, there is no such trigger. If two people disagree on a moral value (e.g., "Slavery is unjust"), there is no sensory stimulation that forces universal assent. Their disagreement stems from differing "standards" or "conditioning," not from a difference in empirical data.

  Quine writes:
  > "Moral judgments... lack the objective check that observation provides for science."

  For Quine, moral discourse is not a failed science; it is a different kind of social technology. It functions to coordinate behavior and reinforce social cohesion (like the dog ignoring the turnip due to training), but it does not describe the causal structure of the universe. Therefore, moral statements do not function as hypotheses that explain sensory input.

  ### 3. The Clash: Enoch's Deliberative Indispensability
  David Enoch's argument attempts to bypass the need for *causal-explanatory* indispensability. He argues that moral facts are indispensable to **practical deliberation**. Just as we cannot do physics without numbers, we cannot deliberate about what to do without presupposing objective moral reasons. Therefore, we should be realists about moral facts.

  Quine would block this move on two principled grounds:

  **A. The "Science-First" Constraint**
  Quine's naturalism is specifically *scientific* naturalism. He famously stated, "Naturalism is not a doctrine of philosophy but a finding of science." For Quine, the only legitimate inquiry into what exists is the inquiry conducted by natural science.
  Enoch's argument relies on the indispensability of moral facts to *deliberation*, not to *science*. Quine would argue that deliberation is a psychological or social process, not a truth-tracking mechanism in the same way physics is. Just because we *must* presuppose $X$ to engage in activity $Y$ does not mean $X$ exists in the ontology of the world; it might just mean $X$ is a necessary fiction or a normative rule for that activity.
  For Quine, the only activity that grants ontological credit is **empirical prediction**. Since moral facts do not help predict sensory stimulation, their indispensability to deliberation is ontologically inert.

  **B. The Rejection of Normative Properties**
  Enoch wants to argue for robust moral *realism*—that there are mind-independent moral facts. Quine's ontology is sparse; he only accepts entities that are required to simplify our account of the physical world.
  In "On the Nature of Moral Values," Quine suggests that moral values can be naturalized as **dispositions** or **social conditioning**. We can explain moral behavior using psychology and sociology (which are sciences) without positing "moral facts" as abstract objects or normative properties.
  If Quine can explain why we deliberate the way we do using evolutionary biology and behavioral psychology (descriptive facts), he has no need to posit "moral facts" (normative facts). Enoch argues we *need* the normative facts to make sense of deliberation; Quine would reply that we only need the *psychological state* of valuing, not the *object* of the value.

  ### 4. Addressing the Counter-Argument (Holism)
  A charitable reading might suggest Quine's **holism** could save Enoch. If the web of belief is continuous, why draw a hard line between science and ethics? If ethics is indispensable to our overall "web," doesn't it share in the confirmation?

  Quine anticipates this. He acknowledges that ethics is part of the web, but he assigns it a different **status**. In *Theories and Things*, he distinguishes between statements that are confirmed by their contribution to predicting observations (science) and statements that are confirmed by their contribution to social stability (ethics).
  While both are in the web, only the former carry **ontological commitment**. Quine is willing to say moral statements are "true" in a deflationary sense (to say "Stealing is wrong" is true is just to say "Stealing is wrong"), but he denies that this truth requires a "moral fact" in the world in the same way "Electrons exist" requires electrons. Enoch wants the latter; Quine only grants the former.

  ### The Verdict

  **Quine would reject Enoch's argument.**

  While Enoch's argument is structurally similar to the Quine-Putnam indispensability argument, it fails Quine's specific **criterion for ontological commitment**. For Quine, indispensability is only a ticket to existence if the theory containing the entity is empirically confirmed via observation sentences.

  1.  **Mathematics** gets in because it is indispensable to **physics**, which predicts **observations**.
  2.  **Moral Values** (per Enoch) are indispensable to **deliberation**, which does not predict **observations**.

  Quine would argue that Enoch is conflating **pragmatic utility** (useful for living/deliberating) with **ontological reality** (indispensable for describing the world). Quine happily admits moral discourse is pragmatically useful—he calls it essential for social cohesion—but he denies it describes the furniture of the universe.

  To accept Enoch, Quine would have to abandon his insistence that observation sentences are the ultimate tribunal of truth. He would have to admit that normative reasoning, independent of empirical check, can disclose reality. Given that Quine spent his entire career attacking the idea of "truths of reason" that stand apart from empirical science (the analytic/synthetic distinction), he would view Enoch's move as a regression into the very kind of ungrounded metaphysics he sought to eliminate.

  **Conclusion:** Quine would treat Enoch's moral facts as useful **posits of social technology**, not as **entities in our scientific ontology**. He would grant that we cannot help but *talk* as if moral facts exist, but he would deny that we have any scientific reason to *believe* they exist.
