          *   Hard to explain *why* an external reason should motivate someone.
          *   Can sound preachy ("you just should").

  4.  **Formulate the "Actual Comeback" (The Externalist/Rationalist Response):**
      *   I need to avoid just saying "You should care."
      *   *Strategy 1: The Rationality Argument (Kant/Scanlon).* Being inconsiderate is irrational because it makes an exception for oneself. If Ravi were canceled on, he'd likely complain. He's contradicting himself.
      *   *Strategy 2: The Identity/Relationship Argument.* Ravi claims to be a "friend." Friendship is a concept with built-in norms. If you reject the norms, you aren't playing the game of friendship. You can't claim the title without the duties.
      *   *Strategy 3: The Idealized Desire Argument (Smith).* If Ravi were fully rational and informed (including about the impact on you), he *would* care. His current apathy is a failure of imagination or rationality, not proof that no reason exists.
      *   *Strategy 4: The Consequence Argument.* Reasons aren't just about internal feelings; they are about navigating a shared world. If you ignore traffic laws because you "don't care," you crash. Social friction is the crash.

