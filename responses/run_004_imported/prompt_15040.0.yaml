          *   The "Simulation" argument: If the threatener simulates you, the simulation experiences the cost. If the simulation defends the surrogate, the surrogate *is* a value in the simulation.
          *   The "Leakage" problem: Protecting the surrogate might inadvertently harm the real goals (opportunity cost).
          *   The "Infinite Regress" problem: What protects the surrogate goal itself?

  4.  **Drafting - Section by Section:**

