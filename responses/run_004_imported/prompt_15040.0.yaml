      *   **Round 2: The Threatener's Perspective.** Marcus argues the threatener looks at the *cost* you are willing to bear. If you bear cost $C$ for Surrogate $S$, then $S$ has utility $> C$. Elena argues the threatener looks for *leverage points*. If $S$ is easier to threaten than Real Goal $R$, but yields the same defensive response, the threatener prefers $S$.
      *   **Round 3: The Simulation/Prediction Objection.** This is the crux. Marcus says a perfect simulator sees the "pain" of spending resources. Elena introduces the concept of *conditional* policies vs. *global* utility. The surrogate goal is a "module" activated only under threat conditions.
      *   **Round 4: Opportunity Costs and Leakage.** Marcus hits hard on resource drain. Defending $S$ takes time/energy from $R$. Elena concedes some cost but argues it's capped and predictable, unlike the open-ended vulnerability of $R$.
      *   **Closing:** Where do they land? It shouldn't be a total resolution because this is an open problem in FDT/UDT. A "sharpened disagreement" feels most authentic. They agree on the mechanics but disagree on the metaphysical status of "value."

  5.  **Refining the Dialogue (Self-Correction during drafting):**
