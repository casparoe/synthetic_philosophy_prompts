answer: |-
  **Setting:** *A quiet corner of a conference room, long after the main session on Functional Decision Theory has ended. Whiteboards are covered in half-erased payoff matrices. **Elena** (Proponent) is capping a marker. **Marcus** (Skeptic) is leaning against the table, arms crossed.*

  **Marcus:** You're asking me to believe in a magic shield, Elena. The surrogate goal proposal sounds elegant on a whiteboard, but when you press on the ontology, it dissolves. You say an agent can adopt a goal it doesn't care about—say, the preservation of paperclips—and commit to fighting for paperclips exactly as hard as it would fight for human lives, just to divert acausal threats. But if the commitment is credible enough to fool a perfect predictor, the agent *must* treat paperclips as valuable. And if it treats them as valuable, it *values* them. You haven't shielded the human lives; you've just added paperclips to the list of things that can be held hostage.

  **Elena:** You're conflating *terminal value* with *policy selection*. I don't need to value paperclips intrinsically. I only need to install a subroutine that says, "If a threat is detected regarding paperclips, execute Defense Protocol Alpha." The threatener doesn't care about paperclips. They care about leverage. They want to extract resources. If they see that threatening paperclips triggers the same costly retaliation as threatening humans, they become indifferent between the two targets. But since paperclips are instrumentally cheap to secure normally, I've reduced my surface area of vulnerability without increasing my expected loss.

  **Marcus:** "Instrumentally cheap" is doing a lot of heavy lifting there. Let's look at the decision node. The threatener simulates you. In that simulation, you are faced with a choice: Pay the bribe or incur cost $X$ to defend the paperclips. If you choose to incur cost $X$, the simulation records that you sacrificed $X$ utility for the sake of paperclips. In decision theory, revealed preference is king. If you burn $X$ utility to save $S$ (surrogate), then within the context of that decision problem, $S$ has a utility of at least $X$. You can't tell the threatener, "I'm only pretending this costs me." The cost is real. The resources spent defending the surrogate are resources stolen from your real goals.

  **Elena:** The cost is real, yes. But the *location* of the vulnerability matters. Imagine I'm a nation-state. I care about my citizens ($R$). I also declare that I care deeply about a specific, empty rock ($S$). I station missiles around the rock. An adversary wants tribute. They can threaten the citizens or the rock. If they threaten the citizens, I fight. If they threaten the rock, I fight. They will choose the rock, because destroying the rock doesn't actually hurt me *except* for the cost of the fight I've committed to. But destroying the citizens hurts me *plus* the cost of the fight. By making the rock a surrogate, I haven't changed my willingness to fight; I've changed the adversary's incentive structure regarding *where* to apply pressure.

  **Marcus:** That works for causal threats, Elena. In a causal world, the rock is just a rock. But we are talking about acausal threats—adversaries who simulate your source code. When they simulate you to check your credibility, that simulation is a conscious process (or at least, a logical isomorph of one). In that simulation, you are weighing the loss of the rock against the cost of defense. If your source code says "Defend Rock," then in the simulation, the Rock has weight.
  Here is the collapse: To make the commitment airtight, you must bind your future self so tightly that you *cannot* distinguish between "I am precommitted to defend this" and "I value this." If there is any gap—any point where you could defect and save resources—the threatener will spot it and call the bluff. If there is no gap, you have functionally rewritten your utility function to include the surrogate. You haven't shielded your values; you've diluted them.

  **Elena:** I reject the idea that binding equals valuing. I can bind myself to a course of action without updating my terminal values. Think of Ulysses tied to the mast. He didn't value staying on the ship more than hearing the Sirens; he valued *survival* more than *choice*.
  With surrogate goals, I am modifying my *observable policy*, not my *internal reward function*. The threatener simulates me and sees: "If I threaten $S$, Elena fights." That's true. But they also see: "If $S$ is destroyed without a threat, Elena does not care."
  This is the asymmetry. A genuine value is robust across counterfactuals. A surrogate goal is conditional. It only "activates" under threat conditions. A sophisticated threatener looks for leverage. Leverage requires a vulnerability that persists *outside* the threat scenario. If the paperclips are destroyed by an asteroid, I shrug. If they are threatened by you, I fight. That distinction is visible in the source code.

  **Marcus:** Is it? If you're running a decision theory like FDT or UDT, you're optimizing over the output of your algorithm. The algorithm doesn't care about your internal qualia of "valuing." It cares about the output. If the output is "Spend 100 units to save Surrogate," then the algorithm treats the Surrogate as having 100 units of value in that context.
  The threatener doesn't need to see you care about the surrogate when the asteroid hits. They only care about the counterfactual where *they* are the ones threatening. In that specific logical neighborhood, the surrogate *is* a terminal value. And since the threatener operates in that neighborhood, the distinction is invisible to them.
  Furthermore, consider the opportunity cost. Every resource you spend defending the surrogate is a resource not spent on your real goals. If the threat is frequent, or if the defense is costly, the surrogate goal becomes a drain on your actual utility. You've created a "utility sink" that adversaries can toggle on at will.

  **Elena:** That's a risk, but it's a calculated one. The whole point is that the surrogate is chosen to be *cheap* to defend in most worlds, or at least, less catastrophic to lose than the real goal.
  But let's go deeper into your "logical neighborhood" argument. You say that in the threat scenario, the surrogate acts like a terminal value. Fine. But the threatener has a choice of *which* neighborhood to instantiate. They can threaten $R$ (Real) or $S$ (Surrogate).
  If I value $R$ at 1,000 units and $S$ at 0 units (normally), but I commit to defending $S$ as if it were worth 1,000 units...
  The threatener calculates:
  1. Threaten $R$: I fight. Payoff to threatener = Low (due to my retaliation).
  2. Threaten $S$: I fight. Payoff to threatener = Low (due to my retaliation).
  Since the payoff is the same, the threatener is indifferent. But if I can make defending $S$ slightly cheaper for me than defending $R$—or if $S$ is easier to verify—then I gain a marginal advantage. I haven't collapsed $S$ into $R$. I've just made $S$ a decoy that functions identically under fire but costs less to maintain.

  **Marcus:** "Costs less to maintain" is the leak. To make the commitment credible, you have to burn common knowledge. You have to make it known that you *will* retaliate. That reputation management is costly.
  But here is the deeper collapse, Elena. You say the threatener is indifferent between threatening $R$ and $S$. Why would they pick $S$?
  If they threaten $R$, and you fight, you suffer the cost of fighting *plus* the psychological/logical stress of $R$ being at risk.
  If they threaten $S$, and you fight, you suffer the cost of fighting.
  If the threatener is perfectly rational, they know that your "fighting cost" might be correlated with the value of the thing at risk. If you fight harder for $R$ than $S$, they threaten $R$. If you fight equally hard, they are indifferent.
  But if they are indifferent, they might randomize. If they randomize, $R$ is still under threat. You haven't eliminated the threat to $R$; you've just diluted it probabilistically. To *eliminate* the threat to $R$, you must make threatening $S$ strictly *better* for the threatener. But how can it be better for them if your response is identical?
  It can only be better if threatening $S$ is cheaper for *them*. But if it's cheaper for them, it implies $S$ is less secure. If $S$ is less secure, your defense must be more robust. If your defense is more robust, the cost to you rises. You're chasing your tail.

  **Elena:** You're assuming the threatener wants to maximize harm. They don't. They want to maximize *compliance*. They want you to pay the bribe.
  The surrogate goal strategy isn't about making them prefer $S$. It's about making the *act of threatening* unprofitable regardless of the target.
  But let's accept your point about indifference. If they are indifferent, we can introduce a tiny tie-breaker. I make $S$ slightly more salient. I broadcast, "I monitor $S$ more closely." I make the verification of $S$'s status easier for the threatener.
  If the threatener wants to minimize their own computational cost in running the simulation, they might prefer the scenario where the variables are simpler.
  But more importantly: You keep coming back to the idea that if I defend $S$, I must value $S$. I'm saying that "value" is the wrong category. It's about *coupling*.
  I am decoupling my *retaliation policy* from my *suffering function*.
  The threatener's leverage comes from the fact that if they carry out the threat, I suffer.
  If they threaten $R$ and carry it out, I suffer 1,000 units.
  If they threaten $S$ and carry it out, I suffer 0 units (intrinsically) + Cost of Defense.
  If I commit to making Cost of Defense = 1,000 units, the threatener sees the same deterrent.
  But if they actually carry out the threat?
  Case $R$: I lose 1,000.
  Case $S$: I lose 0 (plus sunk defense costs).
  So, if the deterrent fails, I am still better off with $S$. The surrogate goal caps my downside.

  **Marcus:** Ah. Now we're getting somewhere. You're admitting it.
  If the deterrent fails, you are better off with $S$. But the deterrent relies on the threatener believing you will pay the Cost of Defense.
  To believe that, they must believe that in the simulation, you will choose to pay the cost.
  Why would you pay the cost? Because your algorithm says "Maximize Expected Utility."
  If $S$ has 0 intrinsic value, and Cost of Defense is 1,000, then Expected Utility says "Don't Defend."
  To make the algorithm say "Defend," you must have edited the utility function to assign $S$ a value of >1,000 in the threat context.
  So, in the branch of the multiverse where the threat occurs, $S$ *is* valuable.
  You say, "But in the branch where the threat is carried out, I don't care."
  But the threatener doesn't care about the branch where the threat is carried out! They care about the branch where they *decide* to threaten. In that decision node, $S$ must appear valuable to you, or you won't defend it, or they won't believe you will.
  So, in the only branch that matters for the *threat dynamics*, $S$ is indistinguishable from $R$. You have successfully created a second vulnerability that looks exactly like the first one to the predator. You haven't shielded $R$; you've just convinced the predator that $S$ is also worth eating.

  **Elena:** No, because the predator knows I don't care if $S$ is destroyed *after* the decision node.
  Look at the timeline.
  1. Threatener decides to threaten.
  2. I respond (Defend/Pay).
  3. Threatener decides to Execute/Withdraw.
  If I commit to Step 2 (Defend), the Threatener gains nothing by Executing. They only gain by my Payment.
  If I refuse to Pay, they Execute to punish me and update their model for future interactions.
  If they Execute $R$, I lose 1,000.
  If they Execute $S$, I lose 0 (intrinsically).
  If they know this, they know that punishing me via $S$ is less effective than punishing me via $R$.
  So, if they are going to punish, they should punish $R$.
  This brings us back to your indifference point.
  But here is the kicker: I can make the commitment to defend $S$ *more visible* than the commitment to defend $R$. I can hard-code the defense of $S$ into a transparent module, while my defense of $R$ is messy and heuristic.
  The threatener, looking for certainty, might prefer the clean logic of the $S$-module. They see a guaranteed fight if they touch $S$. They see a probabilistic fight if they touch $R$.
  Rational adversaries prefer known risks. I make the surrogate the "known risk."

  **Marcus:** You're banking on the adversary preferring a known cost over an unknown one, even if the unknown one offers higher potential leverage. That's a behavioral bet, not a decision-theoretic proof. A superintelligence wouldn't necessarily prefer "clean code" if "messy code" implies higher stakes.
  But let's grant you the "clean code" advantage. You've shifted the threat to $S$.
  Now, what protects $S$?
  If $S$ is now the primary target of acausal threats, $S$ needs its own surrogate goal, $S2$.
  You've kicked the can down the road. You haven't solved the vulnerability of having values; you've just created a market for surrogate vulnerabilities.
  Eventually, you run out of cheap surrogates. Or, more likely, the cost of maintaining the "clean code" commitment for $S$ becomes so high that it drains the resources needed for $R$.
  The collapse is inevitable because resources are finite. Every unit of credibility you buy for $S$ is a unit of credibility you can't spend on $R$. If the threatener sees you spending resources on $S$-defense, they infer you have surplus resources. If you don't have surplus resources, defending $S$ weakens $R$ directly.

  **Elena:** I agree that infinite regress is a danger if we view this as a static shield. But decision theory isn't static. It's about equilibrium.
  The goal isn't to make $S$ invulnerable. It's to make the *expected value* of threatening me negative, regardless of the target.
  If I have 10 surrogates, and I defend all of them fiercely, the threatener sees a porcupine. They don't know which quill will hurt them, but they know they'll get stuck.
  You argue that defending $S$ drains $R$. I argue that *being threatened* drains $R$ much faster.
  If I spend 10 units defending $S$, I lose 10 units of $R$-potential.
  If I get successfully threatened on $R$, I lose 1,000 units of $R$.
  The surrogate strategy is an insurance premium. Yes, it costs money. Yes, functionally, it looks like I value the insurance policy. But I don't value the policy for its own sake; I value it for the risk mitigation.
  The "collapse" you see is just the fact that risk mitigation has a cost. That doesn't mean the risk is the same.
  If I buy fire insurance, I don't value my house burning down. But I act as if the financial loss of the fire is mitigated.
  Surrogate goals are fire insurance for acausal blackmail.

  **Marcus:** Fire insurance pays out *after* the fire. Surrogate goals are supposed to prevent the arsonist from lighting the match.
  To prevent the match, you must convince the arsonist you'll burn down your own house to catch him.
  If you do that, you're a pyromaniac in his eyes.
  My final point is this: In a world of perfect prediction, *intentions are actions*. If you intend to defend $S$ with the same vigor as $R$, then in the logical space where the threatener resides, $S$ and $R$ occupy the same coordinate.
  You can label one "Surrogate" and one "Real" in your private diary, but the math doesn't read the diary. The math sees two nodes with identical defense costs and identical retaliation profiles.
  The threatener will attack the node that is easiest to access. If $S$ is easier to access, they attack $S$.
  If they attack $S$, and you defend it, you pay the cost.
  If you pay the cost repeatedly, $S$ becomes a drain.
  If you stop defending it to save resources, the shield breaks.
  You are left with a choice: Bleed resources on a fake value, or admit the fake value is fake and lose the shield.
  There is no stable equilibrium where $S$ is both "fake" and "defended." It's either defended (and thus real in the model) or it isn't.

  **Elena:** I think we've reached the core of the disagreement, Marcus.
  You believe that "real in the model" is equivalent to "real value."
  I believe that "real in the model" is just "functional coupling."
  I can functionally couple my defense systems to a light switch without caring about the light switch.
  If the threatener attacks the light switch, I fight. I lose resources. The light switch remains a light switch. I still don't care about it.
  The fact that I spent resources doesn't retroactively make me care about the switch. It just means I cared about *not being blackmailed* more than I cared about those resources.
  The surrogate goal is a tool, not a value. A hammer isn't valuable because I use it to drive nails.
  You're saying, "If you use the hammer enough, it becomes part of your hand."
  I'm saying, "No, it's still a hammer. And if I can swap it for a wrench that works better, I will."
  The coherence holds as long as the agent retains the meta-capacity to discard the surrogate if the threat environment changes. The value is in the *option* to use the surrogate, not the surrogate itself.

  **Marcus:** But the threatener simulates that meta-capacity too. If they see you might discard the surrogate, the shield is weak. If they see you won't discard it, you're bound.
  We're circling. You see a distinction between the map and the territory. I'm telling you that in acausal trade, the map *is* the territory. If the simulation of you defends the surrogate, the surrogate is defended in the only reality that influences the threatener's decision.
  I don't think the scheme is incoherent, Elena. I think it's just not a *shield*. It's a distraction. And against a perfect predictor, distractions don't work.

  **Elena:** Then we disagree on the power of structural asymmetry. I think I can construct a payoff matrix where the surrogate absorbs the probability mass of the threat, even if the cost is identical. Because I can make the *verification* of the surrogate cheaper.
  But I concede this: If the threatener is truly omniscient regarding my source code, and I am truly bound, the distinction is purely semantic from their perspective.
  However, from *my* perspective—the perspective of the agent experiencing the outcome—it matters immensely whether I lose $R$ or $S$.
  If the scheme saves $R$ at the cost of resources and the risk to $S$, it is successful, regardless of whether $S$ "counts" as a value in the threatener's model.
  I don't need the threatener to think $S$ is fake. I need them to think $S$ is *sufficient*.

  **Marcus:** Sufficient for what?
  **Elena:** For them to stop threatening $R$.
  **Marcus:** And if they threaten $S$ instead?
  **Elena:** Then I defend $S$, and $R$ is safe.
  **Marcus:** And you pay the cost.
  **Elena:** Yes. I pay the premium.
  **Marcus:** And if the premium is too high?
  **Elena:** Then the scheme fails. But that's true of any defense.
  **Marcus:** So your claim isn't that surrogate goals solve the problem of acausal threats. It's that they *relocate* the cost of the threat to a less critical domain.
  **Elena:** Exactly. It's triage.
  **Marcus:** Then stop calling it a shield that makes you invulnerable. Call it what it is: Damage containment.
  **Elena:** I can live with that. But damage containment is enough to survive long enough to matter.
  **Marcus:** Provided the containment doesn't become the cage.
  **Elena:** Provided we don't confuse the cage for the home.

  *(Elena puts the cap back on the marker. Marcus pushes off the table.)*

  **Marcus:** We're not going to resolve the ontology of value today.
  **Elena:** No. But I think we've agreed that the strategy only works if the agent maintains meta-control over the surrogate. If the surrogate becomes terminal, the game is over.
  **Marcus:** And I think we've agreed that maintaining meta-control against a perfect predictor is the hardest problem in the book.
  **Elena:** Then we have work to do.

  *(They gather their papers, the disagreement sharpened but the terrain now clearly mapped.)*
