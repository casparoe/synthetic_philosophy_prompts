answer: |-
  I told my philosophy friend about the Marginaliaqueen/Priya mix-up, and he immediately started vibrating with that specific PhD-student frequency. He said, "Don't you see? It's a textbook validation of Frege! The identity statement 'Marginaliaqueen = Priya' is informative while 'Priya = Priya' is trivial because the *Senses* differ, even if the *Reference* is identical. You need the *Sinn* to explain the cognitive significance!"

  I told him, "Relax. The Direct Reference crowd says Frege didn't need that move. Names are just rigid designators; they tag the object directly. The proposition is the same in both cases. I just didn't know the two tags belonged to the same object. It's a failure of my mental files, not the semantics."

  He said, "But then you can't explain why finding out felt like a revelation!"

  I said, "I can explain the revelation. On the Fregean view, I've spent a year emotionally investing in a *Mode of Presentation*. On the Direct Reference view, I've spent a year ignoring the *Referent* at family BBQs."

  He asked, "So which theory are you using to get out of this?"

  I said, "Neither. I'm adopting a Kripkean stance on necessity: It is necessarily true that if I tell Priya I was only in love with her *Sense*, she will make sure the *Reference* of 'My Cousin's Fiancé' points to someone else."
