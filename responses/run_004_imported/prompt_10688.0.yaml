answer: |-
  So my philosophy friend insists this is a victory for Direct Reference. He says, "Look, 'MarginaliaQueen' and 'Priya' are just rigid designators. They pick out the exact same object in every possible world. The proposition 'MQ is Priya' is cognitively identical to 'Priya is Priya.' You're just hung up on the psychology."

  I said, "Okay, if they're identical, then I can substitute them *salva veritate* in any context without changing the truth value, right?"

  He said, "Metaphysically, yes."

  I said, "Great. So at the wedding, when the officiant asks if anyone knows of any reason these two should not be married, I can stand up and say, 'I have seen Priya's notes on *Middlemarch*,' and that carries the exact same semantic weight as 'I have seen MarginaliaQueen's notes on *Middlemarch*.'"

  He started sweating. "Well, the *proposition* is the same, but the pragmatic implicature—"

  I said, "I thought you said 'Sense' was unnecessary ontology? That there's no 'mode of presentation,' just the object?"

  He said, "There isn't! But Frege didn't invent 'Sense' to explain the Morning Star. He invented it to create a buffer zone between 'Semantic Truth' and 'Getting Disowned by the Entire Family.'"

  I said, "So 'Sense' is just a social firewall?"

  He said, "Yes. And yours just got breached. You don't have an identity puzzle; you have a boundary violation."

  I said, "So what do I do?"

  He said, "You pray the Direct Reference crowd is wrong. Because if names really do just point directly to the object with no mediating sense... then you've technically been dating your cousin's fiancée for a year."

  I said, "Wait, no—"

  He said, "Semantically, *a=a*. You do the math."
