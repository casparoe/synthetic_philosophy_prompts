answer: |-
  **Eulogy for Walt**
  **Spoken by: [Grandpa's Name]**

  Good morning.

  For those of you who don't know me, I'm the one who caught the ball. For those of you who do know me, you know I'm the one who caught the ball.

  Walt and I knew this day would come. We weren't the kind of men to pretend we were going to live forever, though we certainly acted like it most of the time. But standing here, looking out at half the county, I realize something. Walt took the secret of what really happened at home plate in the summer of '57 to his grave. And I'm standing here with the truth, and my hands are shaking too much to write it down myself, and I realize… it doesn't matter anymore.

  Except it does. Because if I stood here and told you I suddenly think he was safe, I'd be lying. And Walt liked me because I was honest. So, Walt: You were out. I had the ball. I had the tag. You were out.

  There. I said it. One last time.

  But here's the thing about Walt. He'd be standing up in that box right now, pointing a finger at me, grinning that crooked grin, and saying, "You're blind, old man, and you always were." And he'd be just as sure as I am.

  For seventy years, every Fourth of July, we had the same argument. Some folks say that if two people love each other, and they trust each other, they eventually see the world the same way. They say if your memories are truly shared, you can't disagree on the facts.

  Walt and I proved that wrong.

  We saw the same dust, the same sun, the same play. But we saw different truths. And we never once thought the other man was lying. We never thought, "Oh, he's just saying that to win." We knew the other man was telling the truth as he saw it. We just couldn't figure out how two honest men could look at the same patch of dirt and see two different realities.

  We didn't "agree to disagree." That phrase makes me itch. You don't agree to disagree when you care about the truth. What we did was harder than that. We decided that the friendship was bigger than the fact. We decided that being right was less important than being together.

  Half of you know this story as folklore. A town legend. The Safe/Out Call of '57. I know some of you placed bets on it before you could drive. But for us, it wasn't a joke. It was our ritual. It was the constant in a world that changed too fast. It was the one thing we could fight about without fear, because we knew the bond was stronger than the argument.

  I'm going to miss a lot of things about Walt. I'm going to miss his laugh. I'm going to miss his stubbornness. But mostly, I'm going to miss having someone who knew me well enough to know exactly which buttons to push, and loved me well enough to never push them too hard.

  There's a theory that when you die, your life flashes before your eyes. I hope that's true for Walt. And I hope, somewhere in there, he sees that play again. I hope he sees the umpire. I hope he sees the dust settle.

  And I hope, wherever he is, there's an umpire up there who can finally make the call.

  Walt, you were the best friend I ever had. You were a good man. You were a stubborn man. And you were… safe. In my heart, you were always safe.

  But on the field? You were out.

  Rest easy, buddy. I'll keep the scorebook open until I see you again. And bring your glove. We've got a rematch to settle.

  Thank you.
