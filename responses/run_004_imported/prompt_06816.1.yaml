answer: |-
  The rain did not fall so much as it collapsed, a vertical ocean hammering the roof of the sluice control station. Elias sat in the hum of the servers, the red glow of the emergency panel reflecting in his glasses. On the screen, the watershed map was divided into sectors. Sector Four was flashing amber. Sector Nine was flashing red.

  The breach was inevitable. The retention wall would give within the hour. Elias controlled the diversion gates. He could open the channel to the north, flooding the lower maintenance bay, or to the south, flooding the upper inspection lock. He could not do both. The water volume was sufficient to kill anyone in the flooded zone, but manageable for the dry one.

  He keyed the comms to confirm occupancy. The numbers appeared on the dashboard, crisp and white against the black.

  Sector Four (North): 5 personnel.
  Sector Nine (South): 1 personnel.

  The protocol was laminated on the desk beside his keyboard. *Minimize Loss of Life.* The arithmetic was trivial. Five was greater than one. To save the five was to save the most life. It was the only rational choice. It was the choice any decent person would make.

  Elias's hand hovered over the northern lever. But he did not pull it.

  He looked at the single dot representing Sector Nine. A man named Kael, according to the shift log. Kael would die if the water went south. If the water went north, five men would die.

  *Five deaths,* Elias thought. *Is that a single thing?*

  He had read philosophy once, long ago, before the dams and the water. He remembered a argument about whether losses could be added up like coins in a jar. If Kael died, he lost everything. His future, his memories, his breath. If the man in Sector Four named Jens died, he also lost everything. Jens did not lose *more* than Kael because there were four others dying with him. Jens only lost his own life.

  There was no super-person who experienced the sum of five deaths. There was no ghost hovering over Sector Four feeling five times the pain. There were only five distinct individuals, each facing the same total oblivion as Kael.

  From Kael's perspective, the loss of the five strangers was irrelevant. They were not him. His complaint against the flood was absolute. Why should his certain death be traded away simply because there were others elsewhere who also wanted to live? If fairness meant giving equal weight to each individual claim, then Kael's claim was equal to Jens's, equal to the third man's, and so on.

  To save the five automatically was to treat Kael as less than equal. It was to say his life was a fraction, worth one-fifth of the group's survival.

  Elias reached into his pocket. His fingers found cold metal. He pulled out a quarter, worn smooth by years of handling.

  He placed it on the console. Heads for the North. Tails for the South.

  If he flipped it, he gave Kael a fifty percent chance. He gave each of the five men in the North a fifty percent chance. It was the only way to respect them all as equals. It acknowledged that the numbers did not speak for themselves, that there was no cosmic scale where five souls outweighed one. There was only the chance, distributed evenly across the desperate.

  The rain hammered the roof. The server hummed louder, a warning tone rising in pitch. The water level in the retention basin was critical.

  Elias looked at the coin. It seemed absurd. A trifling disc of alloy to decide who breathed tomorrow. The intuition screamed at him: *Save the five.* It felt like madness to deny the obvious math. If he flipped tails, and Kael lived while five men drowned, could he stand before the widows and explain that he had wanted to be fair to the individual? They would not see fairness. They would see a monster who gambled with lives.

  But if he pulled the lever without the coin, was he not also a monster? Was he not deciding that Kael was expendable material, sacrificed not for a greater good that Kael shared in, but for a sum Kael would never experience?

  The tension pulled at his chest, physical and tight. The utilitarian view felt like gravity—inescapable, natural. The Taurekian view felt like freedom—terrifying, unmoored.

  *Who am I to count them?* Elias thought. *I am not God. I am just the man with the lever.*

  If he saved the five, he acted on the assumption that lives aggregate. If he flipped the coin, he acted on the assumption that individuals are sovereign. Both claims felt true. Both claims felt incompatible.

  The warning siren began to wail. The structural integrity of the wall was at forty percent. He had seconds.

  Elias picked up the coin. He thumbed the edge. It was heavy. He looked at the screen, at the single blinking light of Sector Nine, then at the cluster of five in Sector Four. He thought of Kael, alone in the lock, perhaps listening to the rain, trusting the system to protect him. He thought of the five in the bay, working together, a team.

  Did the fact that they were a group matter? Or was that just a coincidence of geography?

  He raised his hand. The coin caught the red emergency light, flashing heads, tails, heads, tails.

  To save the many was to accept the world as it was measured. To flip the coin was to accept the world as it was felt.

  Elias stopped his hand. He held the coin against his thumb, ready to flick. The siren wailed, a long, tearing sound. The water groaned against the concrete outside. He looked at the lever, then at the coin. The choice was not between life and death—that was already decided by the rain. The choice was between the logic of the sum and the logic of the person.

  He closed his eyes. He flicked his thumb.

  The coin spun into the air, catching the light, a silver blur against the dark room. It rose, hanging for a moment in the silence between the siren and the crash, before beginning its descent toward the console.
