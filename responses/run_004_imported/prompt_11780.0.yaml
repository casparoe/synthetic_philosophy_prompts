answer: |-
  **Title:** The Invisible Constitution vs. The Right to Be Wrong: Adjudicating Hart v. Devlin

  **Introduction: The Morning After the Jurisprudence Seminar**

  It is a testament to the enduring power of Lord Devlin and H.L.A. Hart that their 1950s debate can be resurrected, slightly worse for wear, over pints in a pub. You and Sam were re-fighting a war that defines the limits of the liberal state. Sam, channeling Devlin, argued that a society is constituted by its shared morality, and that the state acts legitimately when it defends that morality against erosion, even in the absence of tangible harm to others. You, channeling Hart and Dworkin, argued that without demonstrable harm, state coercion is tyranny, and that popular disgust is a psychological fact, not a moral justification.

  To resolve this, we cannot simply list the strengths and weaknesses of each position. We must determine which framework offers a coherent theory of legitimate state power. After reconstructing the strongest version of Devlin's "social bond" argument and the strongest version of Hart's "critical morality" rebuttal, I will commit to a verdict: **The state is not justified in using the criminal law to enforce private, consensual morality purely on the grounds of widespread indignation.** However, this victory for Hart comes with a crucial caveat regarding *how* societies sustain themselves, which clarifies where Devlin was right about culture but wrong about law.

  **I. The Strongest Case for Devlin: Society as an Idea**

  To give Sam his due, we must strip Devlin's argument of its 1950s prudishness and look at the structural claim beneath it. Devlin is not merely arguing that "disgust is good." He is arguing that a society is not just a collection of individuals trading goods and services; it is a community of ideas.

  The strongest version of the Devlin thesis rests on the concept of the "invisible constitution." Just as a government needs a written constitution to function, a society needs a shared moral structure to hold together. This isn't about specific rules (e.g., "no sodomy"), but about the shared intuition that certain boundaries exist. If you remove the belief that there are things a citizen *ought not* to do, regardless of immediate harm, you reduce society to a mere contract of convenience.

  Devlin's "disintegration thesis" is often attacked as empirically weak, but its strongest form is normative, not predictive. He argues that tolerance has limits. If a society tolerates *everything*, it ceases to have a character. If the "man on the Clapham omnibus"—the reasonable, ordinary person—feels a profound, visceral intolerance toward a practice, that feeling is a data point indicating a fracture in the social bond. For Devlin, the law is not just a tool for harm prevention; it is a teacher. By criminalizing certain acts, the state reaffirms the boundaries of the community. To deny the state this power is to assume society can survive on pure procedural liberalism, which Devlin argues is a fantasy. A society that cannot defend its moral core is, in his view, already dead; the law is just the coroner.

  **II. The Strongest Case for Hart and Dworkin: The Empirical Gap and the External Preference**

  Hart's rebuttal is devastating because it attacks the bridge Devlin builds between "shared feeling" and "state power." Hart makes two distinct moves. First, the empirical move: Devlin assumes that moral change equals social collapse. History shows the opposite. Societies evolve morally (divorce, blasphemy, intermarriage) without disintegrating. Devlin provides no evidence that private immorality undermines public order.

  Second, and more importantly, is the conceptual move refined by Ronald Dworkin. Dworkin distinguishes between *personal preferences* (what I want for my life) and *external preferences* (what I want for *your* life). When the "man on the Clapham omnibus" says, "I am disgusted by what my neighbor does in private," he is expressing an external preference. If the state satisfies that preference by banning the act, it is not protecting society; it is double-counting. It is allowing the majority's psychological discomfort to outweigh the minority's actual liberty.

  Dworkin's knockout punch is the distinction between *moral reasons* and *moralistic reasons*. A moral reason appeals to a principle of justice or rights (e.g., "stealing violates autonomy"). A moralistic reason appeals only to tradition or emotion (e.g., "this is unnatural"). A liberal state cannot function if "because we hate it" counts as a valid legislative purpose. Hart argues that Devlin conflates *positive morality* (what people happen to believe) with *critical morality* (what people *ought* to believe based on reason). The criminal law, with its violence and coercion, requires a critical moral justification, not just a headcount of the disgusted.

  **III. The Adjudication: Why Hart Wins on Law, But Devlin Wins on Culture**

  Here is the commitment you asked for. **Hart is right about the law; Devlin is right about culture.** But since the question is about the *criminal law*, Hart wins the debate.

  Devlin's argument fails because it commits a category error regarding the function of coercion. He is correct that a society needs a shared moral fabric to function. Trust, reciprocity, and mutual obligation are the glue of civilization. However, he is wrong that the *criminal law* is the appropriate tool to maintain that glue.

  Morality, to be morally significant, must be voluntary. If I am "virtuous" only because I fear prison, I am not virtuous; I am compliant. By using the state's monopoly on violence to enforce private morality, Devlin inadvertently destroys the very moral agency he claims to protect. He turns citizens into children who obey rules rather than moral agents who choose the good. This undermines the "social bond" he seeks to protect, replacing genuine community with enforced conformity.

  Furthermore, Devlin's "reasonable man" test is procedurally insufficient. History is replete with examples where the "reasonable man" felt profound indignation toward things we now recognize as fundamental rights (interracial marriage, religious dissent, homosexuality). If the threshold for criminalization is "widespread disgust," then minority rights exist only at the sufferance of the majority's tolerance levels. This makes liberty contingent rather than inherent.

  Therefore, **a society is not justified in using the criminal law against conduct that harms no one, purely because it is sincerely and widely felt to be intolerable.** The "harm principle" remains the only stable boundary for state coercion because it is the only boundary that respects the individual as a sovereign agent.

  **IV. The Necessary Condition: When "It Depends"**

  You allowed for an "it depends" answer if rigorously defined. Here is the only condition under which Devlin's logic gains a foothold, and it is narrow: **The state may intervene in private conduct only when that conduct undermines the *preconditions* of moral agency itself.**

  This is not about "disgust" or "social cohesion" in the abstract. It is about protecting the capacity for citizens to participate in the moral community. For example, if a private consensual act involved the irreversible surrender of one's future autonomy (e.g., consensual slavery), the state could ban it. Not because it violates morality, but because it destroys the *agent* who makes morality possible.

  Similarly, if a practice creates a caste system that systematically denies a group of people the status of equal citizens (even if "consensual" within a distorted power dynamic), the state has an interest. But note: this is no longer a purely moralistic judgment; it is a judgment about *harm to the political structure*.

  So, the condition is this: The state can ban private conduct without direct physical harm *only if* that conduct demonstrably erodes the institutional or psychological capacity for equal citizenship and autonomous choice. Mere "disintegration of shared values" is not enough. The disintegration must be of the *liberal framework itself*, not just the *traditional content* of the morality.

  **Conclusion: Buying the Next Round**

  So, tell Sam this: He was right to worry that a society without shared values is a cold, fragmented place. He was right that law teaches. But he was wrong to think the lesson should be taught at gunpoint. A healthy society sustains its morality through culture, family, education, and social pressure—not through the criminal code.

  When you use the law to ban what is merely "disgusting," you don't save society; you stagnate it. You trade the risk of moral evolution for the certainty of state tyranny. Hart's vision is riskier; it allows for the possibility that society might change in ways the "man on the Clapham omnibus" hates. But that risk is the price of freedom.

  You won the argument. But, in the spirit of shared morality and social cohesion, you should still buy the next round.
