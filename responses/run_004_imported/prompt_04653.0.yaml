answer: |-
  **Setting:** *A university library study room, 11:30 PM. Empty coffee cups and scattered printouts of utility frontiers cover the table. Alex is leaning back, arms crossed. Jordan is leaning forward, pen tapping rhythmically on a notebook.*

  **Jordan:** Look, let's just state our positions cleanly. I'm dropping Independence of Irrelevant Alternatives. I know it's the crown jewel of the Nash program, but I can't stomach the implication. If the feasible set expands, and my maximum possible payoff stays exactly where it was, while yours goes up, I should not end up worse off. That's Individual Monotonicity. If Nash violates that, Nash is wrong.

  **Alex:** And I'm dropping Individual Monotonicity. I know the intuition feels fair—like you shouldn't be punished for my good luck—but IIA is a consistency constraint on rational choice. If we agree on a point in a small set, and then you add more options that we *don't* pick, why would our agreement change? The Nash solution respects the geometry of the whole frontier. Kalai–Smorodinsky just draws a ray.

  **Jordan:** It's not just "drawing a ray," and you know it. It's about relative claims. The utopia point defines the maximum demand each of us can credibly make. Bargaining is about conceding from those claims proportionally. If my claim limit doesn't change, why should my concession increase just because your limit went up? In the standard counter-example, the Nash solution actually shifts utility *away* from the player whose utopia point remained fixed. That's perverse. It treats the expansion of your opportunities as a threat to my guaranteed share.

  **Alex:** But that "guaranteed share" is an illusion created by ignoring the curvature of the frontier. That's my problem with Kalai–Smorodinsky. It throws away almost all the information in the bargaining problem. It looks at the disagreement point, it looks at the ideal point, and it draws a straight line. It doesn't care if the Pareto frontier is a straight line itself, or if it's deeply concave.

  **Jordan:** Because the shape of the frontier shouldn't dictate the fairness of the claim.

  **Alex:** It absolutely should! The shape represents the marginal rate of substitution. It represents how much utility I have to burn to give you a gain. If the frontier is highly concave near your ideal point, it's "expensive" for me to push you toward your maximum. Nash captures that cost. The product maximization essentially balances the proportional gains relative to the *local* trade-offs. Kalai–Smorodinsky ignores the cost of concession. It assumes the only thing that matters is the distance to the dream, not the price of the ticket.

  **Jordan:** But the "price" is already encoded in the feasible set! You're saying Nash uses more information, but I'd argue it uses the *wrong* kind of information. It's sensitive to local curvature in a way that creates instability. If we add a tiny, irrelevant bump to the frontier far away from the solution, Nash might jump. Kalai–Smorodinsky is stable as long as the ideal point doesn't move. And regarding IIA—you say it's rationality. I say it's rigidity.

  **Alex:** It's not rigidity, it's coherence. Think about choice theory. If I choose apple over banana from a fruit bowl, and then someone adds a cherry to the bowl, I shouldn't suddenly choose banana. If the Nash solution is in the subset, it must remain the solution in the superset. That's what IIA guarantees. Kalai–Smorodinsky violates this because the *ideal point* changes when you expand the set, even if the solution itself is still feasible. You're letting a phantom point—the utopia—dictate the outcome even when that point is unreachable.

  **Jordan:** The utopia point isn't a phantom; it's the anchor for bargaining power. That's the whole insight. Nash assumes bargaining power is symmetric unless the feasible set breaks the symmetry. Kalai–Smorodinsky says bargaining power is tied to your potential. If your potential grows, your share should grow, but mine shouldn't shrink.

  **Alex:** But why should my share shrink? Because the *source* of the surplus changed. When the set expands in that specific monotonicity-violating way, the "center of gravity" of the surplus shifts toward you. Nash detects that shift. Kalai–Smorodinsky is blind to it because it only looks at the corners. You're essentially linearizing a non-linear problem.

  **Jordan:** I'm not linearizing; I'm normalizing. We're dealing with von Neumann–Morgenstern utilities here. The units are arbitrary. The only invariant features are the disagreement point and the ideal point. Everything else on the frontier is just a menu of specific trade-offs that might be artifacts of how we measured utility.

  **Alex:** That's scale invariance, and both solutions have that. I'm talking about the shape *after* normalization. Even with normalized utilities, the frontier can bow in or out. That bowing represents risk. Nash is implicitly risk-averse in a way that Kalai–Smorodinsky isn't.

  **Jordan:** Wait, are you bringing risk aversion into an axiomatic debate?

  **Alex:** I'm saying the axioms imply attitudes toward risk structure. Nash's IIA implies that the resolution shouldn't depend on options we aren't taking. But your Individual Monotonicity implies that the resolution *must* depend on options we aren't taking—specifically, the ideal point options. You're saying the existence of a better outcome for me, even if we never reach it, hurts you.

  **Jordan:** It hurts me because it changes the ratio of our claims. If I can get 10 and you can get 10, we split 5-5. If I can get 10 and you can get 20, why should I still settle for 5? Kalai–Smorodinsky says I should get more. Nash might say I get less, depending on the curve. That's the violation. And honestly? It feels like punishment.

  **Alex:** It feels like punishment because you're thinking of the ideal point as an entitlement. It's not. It's a threat point in reverse. The disagreement point is what happens if we fail; the ideal point is what happens if I take everything. Bargaining happens in between. Nash balances the distance from failure against the distance from greed. Kalai–Smorodinsky just splits the difference linearly.

  **Jordan:** Raiffa didn't think it was just splitting the difference. He derived this twenty years before Kalai and Smorodinsky axiomatized it. He had that stepwise concession procedure. Start at the ideal point, concede proportionally until you hit the frontier. It's a dynamic process, not just a geometric slash. It models how people actually argue. "I want everything." "Well, I can't allow that." "Okay, I'll give up 10%." "I'll give up 10%."

  **Alex:** Priority doesn't validate axioms. Raiffa's procedure is a heuristic. It's a story about how we might converge. But axiomatics is about what properties the final outcome *must* satisfy. Just because Raiffa sketched a process that lands near Kalai–Smorodinsky doesn't make Individual Monotonicity more rational than IIA. In fact, Raiffa's procedure is sensitive to the step size. The axioms are what make Kalai–Smorodinsky rigorous, and those axioms force you to ignore the frontier's curvature.

  **Jordan:** And Nash's axioms force you to accept that adding options can make a player worse off. We're at a stalemate because we're prioritizing different definitions of "rational." You prioritize consistency of choice across sets. I prioritize responsiveness of outcome to changes in potential.

  **Alex:** I prioritize the idea that the solution should depend on the *trade-offs* available, not just the *limits* of the trade-offs. If the frontier is flat near your ideal point, it's cheap to give you more. If it's steep, it's expensive. Nash sees that. Kalai–Smorodinsky sees a line.

  **Jordan:** And I prioritize the idea that bargaining is about relative strength. My strength is defined by my best-case scenario. If my best case stays static while yours improves, my relative strength drops, so my payoff might drop, but not below what I had before. IIA protects the past agreement; Individual Monotonicity protects the player's floor.

  **Alex:** So you think IIA is too cold?

  **Jordan:** I think it's blind to power dynamics.

  **Alex:** And I think Individual Monotonicity is blind to economic cost.

  **Jordan:** *[Sighs, closing the notebook]* So we're not going to agree.

  **Alex:** No. You think the violation of monotonicity is a bug. I think it's a feature of a solution that respects the geometry of the surplus.

  **Jordan:** And you think the ray method is an oversimplification. I think it's the only way to respect the scale-invariance of claims without getting lost in the local curvature.

  **Alex:** *[Packs up pen]* I guess that's why there are two chapters in the textbook.

  **Jordan:** Yeah. Next problem set is on the Shapley value. At least there we only have to fight about dummy players.

  **Alex:** Don't bet on it.

  *[They turn off the lamp, leaving the graph of the expanding feasible set illuminated by the exit sign.]*
