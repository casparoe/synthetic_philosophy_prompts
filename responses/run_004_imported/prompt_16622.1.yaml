          *   *Follow-up:* She might say "we just hadn't found the mechanism yet." Push back: That makes disease status dependent on current tech, not biological reality.

      *   *Filling the Gap (Need 8-10 total).*
          *   *Idea 5: Evolution/Design.* BST relies on "species design." Evolution doesn't have a goal. How do you define "normal function" without teleology?
