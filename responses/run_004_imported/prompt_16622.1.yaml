          *   *Follow-up:* She'll likely say reference classes are fixed by biological design. Push back on *who* decides the design.

      *   *Requirement 2: Disease/Illness Trichotomy.*
          *   *Draft 2:* You separate disease and illness. Isn't illness where the values are?
          *   *Refinement:* Focus on the *work* being done. If disease is value-free, does it matter? If illness is the harmful part, isn't that the only thing we care about?
          *   *Follow-up:* She'll say we need objective disease to justify treatment. Push back: If the "illness" (harm) is the trigger for care, why do we need the "disease" label?

      *   *Requirement 3: Historical Cases (Drapetomania/Homosexuality).*
