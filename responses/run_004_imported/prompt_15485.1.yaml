          *   *Wait, let's look closer at the SSA vs SIA debate.* Nick Bostrom's view is nuanced. He thinks SSA is necessary for some things, SIA for others. But for DA specifically, SIA is the standard rebuttal.
          *   *Decision:* I will argue that the DA is **formally valid but epistemically inert**. It tells us about our *location*, not the *total*, unless we have independent priors. But the prompt asks for a verdict on whether we should update credence.
