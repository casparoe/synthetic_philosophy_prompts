prompt: |-
  Something that happened in my lab a few weeks ago has been nagging at me, and I would like help thinking it through properly rather than simply deferring to whichever of my labmates argued more forcefully at the time. I am a second-year PhD student in social psychology, and I had been running a study on whether a small change in how a request is phrased affects how much money people are willing to hand over to a stranger in a simple economic game. My advisor and I originally planned to recruit about sixty participants, but when the effect was trending in the right direction without quite clearing the conventional significance threshold, she suggested I keep collecting data in batches of twenty and check the result again each time. I did this until, at a hundred participants, the result finally crossed p < .05. Everyone was pleased, until I described exactly how I had gotten that result at the following week's lab meeting.

  One labmate, who has become something of a methodological conscience for the lab after spending a summer reading about the discipline's struggles to make published results hold up, said that stopping this way makes the .05 essentially meaningless: because I kept looking, and would have continued had the early batches not worked out, the actual probability of hitting on a "significant" result somewhere along the way is much higher than five percent, regardless of whether the effect is real. A second labmate, midway through a rotation in a lab that approaches statistics quite differently, disagreed just as forcefully: she argued that whatever I would have done under some other, hypothetical run of the experiment is beside the point, since the only thing that can bear on how strongly my data support the hypothesis is the data I actually collected, not the space of experiments I did not run; treating my stopping point as though it contaminates the evidence, on her view, rests on a mistaken picture of what evidence even is.

  Both arguments strike me as genuinely compelling, which is unsettling, since they cannot both be entirely right, and I still need to write a methods section defending what I did before I meet with my committee next month. Is one of my labmates simply correct and the other confused, or is this a case where two careful thinkers end up at odds because they do not actually agree on what makes data count as evidence for a hypothesis to begin with? I would like to understand the real structure of the disagreement well enough to know whether, and how, I should be doing things differently going forward.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **User:** Second-year PhD student in social psychology.
      *   **Context:** Ran a study on framing effects in an economic game.
      *   **Procedure:** Planned $N=60$. Effect was trending but $p > .05$. Advisor suggested "optional stopping" (collect in batches of 20, check $p$, stop when $p < .05$). Stopped at $N=100$ when $p < .05$.
      *   **Conflict:** Lab meeting discussion.
          *   *Labmate 1 (Frequentist/Reform-minded):* Argues this inflates Type I error rate (p-hacking/optional stopping problem). The $p$-value is meaningless because the stopping rule wasn't fixed.
          *   *Labmate 2 (Bayesian/Likelihood-minded):* Argues stopping rules are irrelevant to the evidence provided by the *actual* data collected (Likelihood Principle). What matters is the data you have, not hypothetical paths not taken.
      *   **Goal:** Understand the structure of the disagreement, determine who is "right" (or in what sense), and decide how to handle the methods section/committee meeting/future practice.
      *   **Tone:** Thoughtful, academic, nuanced, supportive but rigorous. Avoids taking a simplistic side but clarifies the statistical philosophies involved.

  2.  **Deconstruct the Statistical Disagreement:**
      *   **Labmate 1's Position:** This is the standard Frequentist critique of optional stopping. In Null Hypothesis Significance Testing (NHST), the $p$-value is defined as $P(\text{Data} \mid H_0)$. Crucially, this calculation depends on the *sampling plan*. If you peek at data and decide to stop based on the result, you change the sample space. The probability of falsely rejecting $H_0$ increases with every peek. If you peek infinitely, you *will* eventually find $p < .05$ even if $H_0$ is true. Therefore, the reported $p < .05$ is invalid under standard NHST assumptions.
      *   **Labmate 2's Position:** This aligns with the Likelihood Principle (often associated with Bayesian inference). The evidence provided by the data is contained in the likelihood function $P(\text{Data} \mid \theta)$. The stopping rule does not appear in the likelihood function. Therefore, conditional on the data actually observed, the stopping rule is irrelevant to the strength of evidence *for the parameter estimates*.
      *   **The Core Conflict:** It's not just a calculation error; it's a philosophical clash between Frequentist error control (long-run properties) and Bayesian/Likelihood evidential strength (current data properties).

  3.  **Evaluate the "Rightness":**
      *   **In the context of Social Psychology (Current Norms):** Labmate 1 is operationally "correct" regarding publication standards and standard NHST. Journals and reviewers expect fixed sample sizes or corrections for sequential analysis. Uncorrected optional stopping is generally considered $p$-hacking.
      *   **In the context of Statistical Theory:** Labmate 2 is theoretically "correct" regarding the Likelihood Principle. The data *do* say what they say. However, ignoring the stopping rule undermines the *error rate guarantees* that $p$-values promise.
      *   **Synthesis:** Both are right within their own frameworks, but the framework the student *used* (NHST with $p < .05$) belongs to Labmate 1's domain. You cannot mix Bayesian logic (stopping rules don't matter) with Frequentist output ($p$-values) without correction.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the student's discomfort. This is a classic, deep methodological rift, not just a petty argument. It shows good critical thinking to be unsettled.
      *   **Clarifying the Disagreement (The "Why"):**
          *   Explain Labmate 1 (Frequentist/Error Rate): Focus on the definition of $p$-values. They rely on the "sampling distribution." Changing the stopping rule changes the distribution. Analogy: Rolling dice until you get a 6.
          *   Explain Labmate 2 (Bayesian/Likelihood): Focus on the Likelihood Principle. The data are fixed. The intention of the researcher shouldn't change the physical reality of the numbers.
          *   The Crux: They are answering different questions. "How often would this happen by chance?" vs. "How likely is the hypothesis given *this* data?"
      *   **Addressing the Specific Situation (The "Now What"):**
          *   *The Hard Truth:* In social psychology, using standard NHST ($p$-values) implies accepting Frequentist rules. Therefore, Labmate 1's critique holds for *publication and committee* purposes. Uncorrected optional stopping invalidates the $p$-value claim.
          *   *The Advisor's Role:* Gently note that the advisor gave advice that is technically problematic under standard NHST. This happens, but the student needs to navigate it.
          *   *Solutions:*
              1.  **Correction:** Use sequential analysis corrections (e.g., Pocock, O'Brien-Fleming) or Bayesian methods.
              2.  **Transparency:** Report exactly what happened (preregistration failure, but honest reporting).
              3.  **Reframing:** Don't claim "proof." Treat it as exploratory or pilot data.
      *   **Future Practice:**
          *   Preregistration.
          *   Fixed sample sizes OR formal sequential designs.
          *   Consider Bayesian statistics if stopping rules are flexible.
      *   **Committee Strategy:** Be honest. Acknowledge the limitation. Don't try to hide it. Frame it as a learning experience in methodology.

  5.  **Refining the Tone:**
      *   Avoid calling the advisor "wrong" explicitly, but acknowledge the statistical reality.
      *   Avoid calling Labmate 2 "wrong," but explain why her view doesn't save the $p$-value.
      *   Empower the student to speak confidently about the nuance.

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, is Labmate 2 completely right?* Technically, under the Likelihood Principle, yes. But if you report a $p$-value, you invoke Frequentist properties. So, for *this* specific output ($p < .05$), Labmate 1 wins. I need to make sure the student understands that you can't have it both ways. You can't use Bayesian logic to justify a Frequentist metric.
      *   *Is $N=100$ salvageable?* It's data. It's not "ruined." But the *inference* drawn from the $p$-value is compromised. The effect size might still be real, but the significance test is inflated.
      *   *What about the "replication crisis" context?* Labmate 1 is echoing the reforms (open science, preregistration). This is the dominant paradigm shift in social psych right now.

  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Error Rates" and "Evidential Strength" is clear. Provide actionable advice for the committee meeting. (This matches the structure of the final output).

  8.  *(Final thought before generating)*: Make sure to emphasize that this is a known paradox in statistics (the Stopping Rule Principle) and that their confusion is a sign of intellectual maturity, not incompetence.

  9.  **Constructing the Output:** (Proceed to generate response based on these points.)
answer: |-
  This is a profound methodological moment for you, and your unease is a sign of intellectual maturity, not confusion. You have stumbled directly into one of the deepest fault lines in statistical theory: the conflict between **Frequentist error control** and the **Likelihood Principle**.

  Your labmates are not merely arguing about a calculation; they are arguing from incompatible philosophical frameworks about what statistics *are for*. However, in the specific context of your field (social psychology) and the metric you used ($p$-values), one of them is operationally correct regarding the validity of your inference, while the other is theoretically correct about the nature of evidence but practically mismatched to your analysis.

  Here is the structure of the disagreement, the verdict on your specific situation, and how to handle your committee.

  ### 1. The Structure of the Disagreement

  To understand why both arguments feel compelling, you have to recognize that they answer different questions.

  **Labmate 1 (The Frequentist / Error-Statistical View)**
  *   **The Core Claim:** A $p$-value is not a measure of how likely your hypothesis is true. It is the probability of observing data *this extreme or more extreme* assuming the null hypothesis is true, **given your specific sampling plan.**
  *   **The Logic:** When you calculate a $p$-value, you are comparing your result against a theoretical distribution of all possible results you *could* have gotten. By deciding to stop *only* when $p < .05$, you altered the set of possible results. You effectively gave yourself multiple "shots on goal."
  *   **The Consequence:** If you peek at the data five times, your actual false-positive rate isn't 5%; it's much higher (closer to 15–20% depending on the peeking schedule). Therefore, reporting $p < .05$ without correcting for the "peeking" misrepresents the long-run error rate.
  *   **Why it feels right:** It aligns with the current "replication crisis" reforms in social psychology. It protects the field from publishing noise.

  **Labmate 2 (The Bayesian / Likelihood View)**
  *   **The Core Claim:** The evidence provided by the data is contained entirely in the likelihood function (how probable the data is under different hypotheses). The intentions of the researcher (when they planned to stop) do not change the data that actually exist.
  *   **The Logic:** This is known as the **Likelihood Principle**. If you collected 100 data points, those 100 points contain a specific amount of information. Whether you planned to collect 60 or 100 shouldn't change the physical reality of the numbers you have. To say the data are "contaminated" by your intentions is, from this view, a category error.
  *   **The Consequence:** Stopping rules are irrelevant to the strength of evidence *in the data*. They only matter if you care about long-run error rates across hypothetical experiments you didn't run.
  *   **Why it feels right:** It aligns with intuition. The data are the data. Why should a thought in your head change the numbers?

  ### 2. Who is "Right"?

  This is the critical part for your committee and your career.

  **Theoretically:** Labmate 2 is correct that the *data itself* hasn't changed. The likelihood ratio of your data is what it is.
  **Operationally:** Labmate 1 is correct that **you cannot use Labmate 2's logic to justify a Frequentist $p$-value.**

  Here is the trap: You used a Frequentist tool ($p$-values, NHST). Frequentist tools *require* Frequentist assumptions, one of which is a fixed stopping rule (or a corrected sequential design). You cannot mix and match. If you want to ignore stopping rules (Labmate 2's view), you must use Bayesian statistics, which quantify evidence differently (e.g., Bayes Factors) and do not inflate error rates with optional stopping.

  Because you reported a $p$-value, you invoked the Frequentist promise: *"If there were no effect, this result would happen less than 5% of the time."* Because of your stopping rule, that promise is broken. The result would happen much more than 5% of the time. Therefore, under the rules of the tool you used, **Labmate 1 is right.** The $p$-value, as reported, is invalid.

  ### 3. How to Handle the Methods Section and Committee

  You are in a delicate position because your advisor suggested the procedure. You need to be honest without throwing your advisor under the bus. The goal is **transparency**, not concealment.

  **Do not try to argue Labmate 2's point to justify the $p$-value.** A methodologically sophisticated committee will recognize that as a misunderstanding of NHST.

  **Recommended Strategy:**

  1.  **Acknowledge the Sequential Nature:** In your methods section, explicitly state that data collection was sequential and stopped when significance was reached. Do not write "We collected 100 participants" without qualifying *how* that number was determined.
  2.  **Reframe the Analysis:**
      *   **Option A (Conservative):** Treat the $p$-value as uncorrected and acknowledge the inflation risk. State clearly that this should be interpreted as exploratory or preliminary evidence requiring replication with a fixed sample size.
      *   **Option B (Robust):** Re-analyze the data using a method that tolerates optional stopping. You can calculate a **Bayes Factor (BF)**. If the BF is strong (e.g., BF > 10), you can argue that even under Labmate 2's framework (which allows optional stopping), there is strong evidence for the effect. This satisfies both labmates: it acknowledges the data's strength without relying on the inflated $p$-value.
      *   **Option C (Correction):** Apply a correction for sequential testing (e.g., adjusting the alpha level at each look). However, since you didn't pre-specify the number of "looks," this is mathematically messy.
  3.  **The Narrative for the Committee:**
      *   "We utilized a sequential data collection procedure. I am aware that under strict Null Hypothesis Significance Testing, this requires alpha correction to maintain the Type I error rate. In the interest of transparency, I am reporting the uncorrected values but interpreting them with caution, acknowledging the increased risk of false positives. Alternatively, I have included Bayesian analyses which are robust to this stopping rule."

  ### 4. How to Move Forward

  This experience is a gift. It clarifies your methodological identity.

  1.  **Preregistration:** For your next study, preregister your sample size and analysis plan (on OSF, for example). This locks in the Frequentist contract. You collect $N$, you analyze, you stop. No peeking.
  2.  **Choose Your Tool:**
      *   If you want the flexibility to stop when you "have enough evidence," switch to **Bayesian statistics**. In a Bayesian framework, Labmate 2 is fully correct: you can check the data after every participant and stop when the Bayes Factor crosses a threshold. The math holds up.
      *   If you stick with **NHST ($p$-values)**, you must adhere to Labmate 1's rules. Fixed $N$, or formal Sequential Analysis designs (where the thresholds for stopping are calculated in advance to preserve the 5% error rate).
  3.  **Advisor Relationship:** Your advisor is likely operating on older norms where "getting the result" was prioritized over "error rate control." This was common 15 years ago. It is less acceptable now. You don't need to confront her, but you should quietly adopt the newer standards for your own work to ensure your dissertation is defensible by current standards.

  ### Summary

  Your labmates are both "right" within their own silos, but **you are working in Labmate 1's silo.**

  *   **Labmate 1** is right about the **validity of the $p$-value**.
  *   **Labmate 2** is right about the **nature of the data**, but wrong that it saves the $p$-value.

  For your committee meeting: Be transparent about the stopping rule. Acknowledge the limitation regarding the $p$-value. If possible, supplement with a Bayesian analysis to show the effect is robust regardless of the stopping rule. This demonstrates methodological sophistication and turns a potential vulnerability into a demonstration of your statistical literacy.
