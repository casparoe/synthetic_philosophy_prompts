answer: |-
  **The Silent Crack in the Rationalist Edifice: Why Old Evidence Breaks Static Bayesianism**

  Within the intellectual subculture of the rationalist community, Bayes' theorem is often elevated from a mathematical identity to a normative epistemology. It is treated as the calculus of rationality itself: to be rational is to have credences, and to learn is to conditionalize. Yet, amidst the fervent advocacy for Bayesian updating as a complete theory of evidence, the Problem of Old Evidence (POE) remains conspicuously absent from popular discourse. This silence is unfortunate, for the POE is not a mere technical snag; it is a structural failure. When a piece of evidence $E$ is already known ($P(E)=1$), standard Bayesianism dictates that it cannot confirm a new hypothesis $H$, since $P(H|E) = P(H)$. This contradicts the historical reality of science, most famously illustrated by the anomalous precession of Mercury's perihelion, which confirmed General Relativity (GR) despite being known decades before Einstein.

  To save Bayesian confirmation theory, proponents have largely relied on two families of solution: the Garber-Jeffrey approach, which relaxes logical omniscience, and the counterfactual approach, which relocates confirmation to subjunctive credences. Both strategies attempt to preserve the formalism of Bayesianism while accommodating the intuition that old evidence confirms new theories. However, upon close inspection, both solutions exact a price that undermines the core promises of the Bayesian program. The Garber move surrenders normative constraint, while the counterfactual move surrenders actual belief states. I argue that the persistence of this problem across forty years demonstrates that the POE is indeed fatal to the claim that a single, static credence function updated by conditionalization can serve as a complete theory of evidence. Confirmation is not merely probability flow; it is a structural relationship that static probabilities cannot capture.

  The first line of defense, pioneered by Daniel Garber and Richard Jeffrey, attacks the idealization of logical omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs. If an agent knew $H \vdash E$ from the start, and already knew $E$, then $H$ would have been constrained by $E$ immediately. Garber suggests we model the agent as *not* knowing the entailment relation initially. The "new evidence" is not $E$ itself, but the logical proposition $L$: "$H$ entails $E$." Since the agent did not know $L$ with certainty beforehand, $P(L) < 1$, and learning $L$ allows for a Bayesian update that boosts $P(H)$.

  This solution is mathematically coherent, but it incurs a devastating philosophical cost regarding normative constraint. The standard worry is that once we allow logical propositions to have credences less than 1 and to be updated, the size of the resulting confidence boost in $H$ becomes essentially unconstrained by Bayesian norms. In standard Bayesianism, the likelihood $P(E|H)$ is fixed by the logic of the hypothesis. But in the Garber framework, the update depends on $P(L|H)$ versus $P(L|\neg H)$. There is no standard Bayesian rule for how one should conditionalize on a logical truth. How much should learning "$H \vdash E$" increase belief in $H$? The formalism does not say. It depends on the agent's prior distribution over logical relationships, which is left entirely open.

  By relaxing logical omniscience to solve the POE, Garber-Jeffrey saves the *mechanism* of updating but abandons the *constraint* of rationality. If the magnitude of confirmation depends on arbitrary priors over logical entailments, then Bayesianism ceases to be a guide for how much one *should* believe, and becomes merely a description of how beliefs *might* cohere. For a community that prizes Bayes as a tool for overcoming bias and arbitrariness, this is a fatal concession. It admits that the "Bayesian" update on old evidence is driven by extra-Bayesian judgments about logical structure, rendering the theorem a passive container rather than an active engine of justification.

  The second family of solutions attempts to preserve logical omniscience by relocating confirmation to counterfactual credences. Proponents like Colin Howson and Peter Urbach argue that we should evaluate confirmation not by the agent's actual credence function, but by a modified function where $E$ is "subtracted" or treated as unknown. We ask: What would the agent's credence in $H$ be if she were to learn $E$ for the first time, holding fixed her background knowledge $K$ (excluding $E$)? If $P_{counterfactual}(H|E) > P_{counterfactual}(H)$, then $E$ confirms $H$.

  This approach captures the intuition that GR is confirmed by Mercury because GR *would have predicted* Mercury had we not already known it. However, it succumbs to the worry that "subtracting" $E$ from a web of belief is either psychologically impossible or arbitrarily stipulative. As David Christensen has argued, beliefs are holistically integrated. Knowing the perihelion of Mercury is entangled with beliefs about astronomy, instrumentation, and physics. To construct a credence function where $E$ is unknown but everything else remains fixed is to construct a fiction that may not be uniquely definable. Different methods of "unlearning" $E$ yield different confirmation values.

  Consequently, the counterfactual solution smuggles in the very unprincipled stipulation Bayesianism was supposed to avoid. If the degree of confirmation depends on how we choose to construct the counterfactual scenario, then confirmation is not an objective feature of the relationship between $H$ and $E$. It becomes relative to a specific, arbitrary modeling choice. Furthermore, this makes confirmation irrelevant to the agent's actual epistemic state. Why should a scientist today care about what she *would* have believed if she were ignorant of facts she actually knows? Bayesianism promises to govern actual belief revision. By shifting the locus of confirmation to a hypothetical agent, this solution admits that Bayesianism cannot govern the actual agent's reasoning regarding old evidence.

  Faced with these two options, the rationalist must choose which cost to pay. Is it better to have a theory that governs actual beliefs but lacks normative constraint on logical learning (Garber), or a theory that offers constraint but applies only to fictional belief states (Counterfactual)? I argue that neither cost is worth paying if the goal is to maintain Bayesianism as a *complete* theory of evidence. The choice between them is not a resolution, but a diagnosis of the underlying disease.

  The persistence of the Problem of Old Evidence suggests that the error lies in the premise that confirmation is identical to credence updating via conditionalization on a static probability function. The confirmation of General Relativity by Mercury's orbit was not a matter of probability flow; it was a matter of explanatory structure. Einstein did not merely show that GR was probable given Mercury; he showed that GR *explained* Mercury in a way Newtonian mechanics could not. This explanatory relationship exists independently of when the evidence was discovered or the logical omniscience of the agent.

  Static credence functions are ill-equipped to represent explanatory power. They represent degrees of belief, not degrees of support derived from structural fit. When $P(E)=1$, the probability channel is clogged, but the explanatory channel remains open. The Garber solution tries to force explanatory learning into the probability channel by treating logic as uncertain; the Counterfactual solution tries to force it into the probability channel by pretending the evidence is new. Both fail because they try to reduce a structural relation to a kinematic one.

  Therefore, the Problem of Old Evidence is fatal to standard Bayesian confirmation theory, not because Bayesianism is useless, but because it is incomplete. It is a powerful theory of consistency and new evidence, but it cannot be the sole theory of evidence. Rationalists who treat Bayes' theorem as a complete epistemology are ignoring a four-de-old proof that their framework cannot account for the most famous confirmations in the history of science.

  The way forward is not to patch the static model with ad-hoc fixes that violate its own axioms, but to acknowledge that a complete epistemology requires resources beyond static credences. We need a theory that can weigh explanatory coherence and structural fit alongside probability. Until then, the silence on the Problem of Old Evidence in rationalist circles is not a sign of its irrelevance, but of a dogmatic refusal to look at the crack in the foundation. Bayes is a tool for thinking, but it is not the mind itself, and it cannot capture the full texture of how evidence supports theory when that evidence is already part of the world we inhabit. The cost worth paying is the humility to admit that no single, static credence function can play the role Bayesians assign it.
