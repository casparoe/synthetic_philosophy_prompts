answer: |-
  Good morning. For thirty years, my aunt Miriam walked alongside people during the most vulnerable moments of their lives. She was a physician who understood that healing isn't always about curing, but often about witnessing, comforting, and protecting dignity until the very end.

  Those of us who loved her know that Miriam was a woman of deep convictions. In her work, she held firmly to a specific boundary—a line she drew between relieving suffering and ending life. She believed that increasing medication to silence unbearable pain was an act of mercy, even if she knew it might unintentionally shorten a patient's remaining time. But deliberately administering a dose to cause death was a line she would not cross, even when begged to do so.

  She often explained this to her students using simple analogies about paths and choices. To Miriam, foreseeing a death and intending one were not the same act wearing different clothes. She taught that the heart of the physician must remain aligned with life, even when death is inevitable.

  I know there are complex debates around these ideas. Colleagues and friends have spent lifetimes discussing the science and the ethics of where that line truly lies. But standing here today, looking out at the family she loved and the caregivers she mentored, I don't think the resolution of that debate is what defines her legacy. What defines her legacy is the integrity with which she held her convictions.

  Miriam carried the weight of these choices so that her patients didn't have to. She wrestled with the ambiguity so they could find peace. Whether one views her distinction as a matter of strict principle or a personal necessity, there is no questioning the compassion that fueled it. She refused to let convenience dictate care. She refused to blur the lines that she felt protected the sanctity of her role.

  In a world that often asks us to compromise, Miriam remained steadfast. She leaves us with a challenging question about our own boundaries: not just what we are willing to do, but what we are willing to intend. She lived by a compass of her own making, and she never lost her way.

  We will miss her wisdom, her steady hands, and her unwavering commitment to doing what she believed was right. Rest well, Aunt Miriam. Your work is done.
