      *   **Situation:** Discovered that a core anecdote about his late best friend (R.)—a story of moral courage regarding scientific integrity—is likely false. The supervisor was honest; no one remembers the confrontation.
      *   **Core Question:** Does this falsification diminish the value of the friendship? Or is that thought confused because the lived experience remains unchanged?
