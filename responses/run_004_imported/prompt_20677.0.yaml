prompt: |-
  Ok, weird thing to be stuck on but here goes. At work last week my manager pulled up an old dataset we've had sitting around forever, noticed a pattern in it, and only THEN came up with a hypothesis to explain that pattern -- and he kept insisting the data "confirms" it. Felt sketchy to me, so I mentioned it to my roommate, who's doing a philosophy MA, and she said this is basically a real puzzle in Bayesian epistemology called the problem of old evidence: if you're already certain of some evidence E, conditionalizing on E can't budge your credence in H at all, even if H predicts E perfectly, so strictly speaking old data can never confirm anything. Which seems nuts, since scientists treat old data as confirming new theories all the time (Mercury's orbit "confirming" general relativity decades after the anomaly was already known is apparently the classic case). I've been loosing my mind over this a bit. Can you write me an essay that actually weighs the main fixes on offer -- like the Garber/Jeffrey idea that what's really getting confirmed is the newly-learned logical fact that H entails E, versus counterfactual approaches that ask what your credence in H would've been if you were meeting E for the first time -- against the possibility that this just shows Bayesian confirmation theory can't handle old evidence at all? And don't leave it at "reasonable people disagree" -- actually tell me which way you'd bet and why.
