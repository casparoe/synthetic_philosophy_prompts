answer: |-
  **TRANSCRIPT OF PROCEEDINGS**
  **STATE SENTENCING COMMISSION – PUBLIC HEARING 44-B**
  **SUBJECT:** ADOPTION OF ALGORITHMIC RISK ASSESSMENT INSTRUMENTS
  **DATE:** OCTOBER 14, 2024

  **PARTICIPANTS:**
  **CHAIRPERSON VANCE:** Commission Chair
  **DR. ELENA ROSTOVA:** Senior Statistician, Center for Judicial Efficiency (Pro-Tool)
  **DR. MARCUS THORNE:** Director of Algorithmic Justice Project (Anti-Tool)

  **CHAIRPERSON VANCE:** Order, please. We are resuming session on the proposed adoption of the COMPAS-IV risk assessment model. We have heard from community advocates. Now we turn to the technical validity of the instrument. Dr. Rostova, you are first. You have argued the tool satisfies the requirement for statistical validity.

  **DR. ROSTOVA:** Thank you, Chairperson. Yes. My testimony is straightforward. We tested the instrument for *calibration* across racial groups. In plain English: if a Black defendant and a White defendant both receive a risk score of 7, their actual likelihood of re-arrest within two years is identical. Roughly 60 percent. The score means the same thing, regardless of who holds it. This is the baseline definition of a valid probability. If the tool meant something different for different people, it would be mathematically dishonest.

  **CHAIRPERSON VANCE:** Dr. Thorne?

  **DR. THORNE:** Dr. Rostova is correct about the calibration. The tool is calibrated. But calibration is only one definition of fairness. And in this context, it is the wrong one. My testimony is that while the *scores* mean the same thing, the *errors* do not. Among defendants who *never* re-offend, Black defendants are nearly twice as likely to be falsely flagged as "High Risk" compared to White defendants. The tool is calibrated, yes, but it achieves that calibration by distributing false positives unevenly.

  **DR. ROSTOVA:** Dr. Thorne and I have debated this before. He is describing the False Positive Rate disparity. But he omits the constraint. We are not choosing between a biased tool and an unbiased tool. We are choosing between two incompatible mathematical definitions of fairness.

  **DR. THORNE:** I'm not omitting it, Elena. I'm rejecting the priority.

  **DR. ROSTOVA:** It's not a priority; it's a theorem. Chouldechova proved it in 2017. Kleinberg, Mullainathan, and Raghavan proved it independently. If the base rate of recidivism differs between two groups—and in the data, it does—you cannot have both calibration and equal error rates. It is geometrically impossible. You can force the error rates to match, but then a score of 7 for a White defendant implies a 60 percent risk, and a score of 7 for a Black defendant implies a 40 percent risk. You break the meaning of the number.

  **DR. THORNE:** I know the theorem, Elena. I taught it to my undergraduates last semester. The question isn't whether the theorem exists. The question is which side of the impossibility we choose to violate. You are choosing to preserve the integrity of the *number*. I am choosing to preserve the integrity of the *life* affected by the number.

  **CHAIRPERSON VANCE:** Let's slow down. Dr. Thorne, are you conceding that to equalize the false positive rates, you would require the tool to be uncalibrated?

  **DR. THORNE:** I am conceding that the math forces a trade-off. Yes. If we mandate equal false positive rates, we must adjust the thresholds. We would need to require a higher risk score to label a Black defendant "High Risk" than a White defendant. That restores error balance. But Dr. Rostova is right: that breaks calibration. A "High Risk" label would no longer represent the same statistical probability across groups.

  **DR. ROSTOVA:** And that is ethically untenable. It means we are treating individuals as representatives of their group rather than as individuals. If I have two defendants in front of me, and I know nothing about them but their scores, I need to know that the risk is identical. If I lower the threshold for one group to fix the error rate, I am essentially saying, "We expect you to be more dangerous, so we need more evidence to label you as such." It creates a separate standard of truth.

  **DR. THORNE:** Or, it acknowledges that the "evidence" itself is contaminated. The base rate difference you rely on—the reason the theorem bites us in the first place—isn't nature, Elena. It's policing. It's arrest data. If Group A is policed more heavily, their recorded recidivism rate is higher, even if their actual behavior is identical. By insisting on calibration to that data, you are baking the policing bias into the probability. You are preserving the "truth" of a biased system.

  **DR. ROSTOVA:** I am preserving the predictive accuracy of the instrument given the available data. If we ignore the base rates to fix the error balance, we reduce the overall accuracy of the tool. We will let more high-risk individuals go free in one group to compensate for the historical over-policing of another. I am not comfortable making public safety a subsidy for historical injustice.

  **DR. THORNE:** And I am not comfortable making individual liberty a tax on statistical convenience. Look at the harm function. A false negative—letting a high-risk person go—is a risk to the public. A false positive—locking up a low-risk person—is a catastrophe for that individual. Because of the base rate disparity, your "calibrated" model imposes the catastrophe disproportionately on Black defendants. You are optimizing for the *average* error, but the *distribution* of the error is racist.

  **DR. ROSTOVA:** "Racist" implies intent or a fixable flaw. This is a structural constraint. If you want me to fix the error rate disparity, I can. I can re-weight the algorithm tomorrow. But then I have to tell this Commission that a score of 8 no longer means an 80 percent chance of recidivism for everyone. It means 80 percent for Group A and 65 percent for Group B. Are you prepared to sentence based on a number that lies about its own probability?

  **DR. THORNE:** I am prepared to sentence based on a system that admits it cannot be neutral. Here is the point I want the Commission to hear, and I want Elena to confirm it: There is no technical solution here. There is no setting we can tune that makes this tool "fair" in every sense.

  **DR. ROSTOVA:** [Pauses] That is correct. There is no Pareto optimal solution. You must choose which fairness metric to violate.

  **DR. THORNE:** And that choice is not mathematical. It is moral. Elena, you are prioritizing Calibration. Why? Be honest. Not because the math demands it, but because you value individual predictive accuracy over group-level error distribution.

  **DR. ROSTOVA:** I value the principle that the state should treat like cases alike. If two people have the same risk profile, they should have the same label. To do otherwise feels like... it feels like we are manipulating the truth to achieve a social outcome.

  **DR. THORNE:** And I am prioritizing Error Rate Balance. Why? Because I value the protection of the innocent over the semantic consistency of the risk score. I believe the harm of a false positive incarceration outweighs the harm of a slightly less interpretable risk number. I am willing to sacrifice the "truth" of the probability to protect the vulnerable from the "truth" of the arrest data.

  **DR. ROSTOVA:** So you admit you are willing to sacrifice accuracy for equity.

  **DR. THORNE:** I admit I am willing to sacrifice *calibration* for *justice*. Accuracy implies there is a ground truth to be measured. In this system, the ground truth is rotten.

  **DR. ROSTOVA:** And you admit that your method requires the Commission to accept that the same risk score implies different dangers depending on the defendant's race.

  **DR. THORNE:** I admit that my method requires the Commission to acknowledge that the *consequences* of the score differ depending on the defendant's race.

  **CHAIRPERSON VANCE:** So, to summarize for the record. Dr. Rostova, if we adopt your recommendation, we accept that Black defendants will be falsely flagged at higher rates, but the scores remain statistically consistent.

  **DR. ROSTOVA:** Correct. We maintain the integrity of the probability.

  **CHAIRPERSON VANCE:** And Dr. Thorne, if we adopt your recommendation, we adjust the thresholds to equalize the false flags, but the scores no longer represent the same probability across groups.

  **DR. THORNE:** Correct. We maintain the equity of the burden.

  **CHAIRPERSON VANCE:** And both of you agree that we cannot do both.

  **DR. ROSTOVA:** Mathematically impossible, Chairperson.

  **DR. THORNE:** Mathematically impossible, Chairperson.

  **CHAIRPERSON VANCE:** Then the question before this Commission is not whether the tool works. It is which impossibility we prefer.

  **DR. ROSTOVA:** [Softly] It is a value judgment. I want to be clear. I am not saying the math proves I am right. I am saying the math proves you have to choose. I choose calibration because I believe the law must be blind to group identity, even if the data is not.

  **DR. THORNE:** And I choose error balance because I believe the law must be blind to group identity, and right now, this tool ensures the law sees race in the errors. I choose to minimize the harm to the marginalized, even if it complicates the statistics.

  **CHAIRPERSON VANCE:** Thank you, doctors. We will recess to consider which impossibility the State of [Redacted] is willing to codify.

  **[END TRANSCRIPT]**
