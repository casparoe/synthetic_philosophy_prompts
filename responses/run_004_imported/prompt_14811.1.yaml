answer: |-
  The noise of the faculty reception hummed around them, a distant swell of clinking glass and forced laughter. Ines swirled the Cabernet in her stemware, watching the legs run down the side.

  "Sixty-five percent," she said, not looking up.

  Thomas sighed, adjusting his glasses. "Ines. We are at a dinner party."

  "Milgram's subjects," she continued. "Sixty-five percent administered the maximum shock. Ordinary people, Thomas. Not sadists. Not monsters. Just people put in a situation where the script demanded cruelty."

  "And this disproves virtue how, exactly?"

  "Because virtue requires cross-situational consistency. If character exists, it should predict behavior when the situation changes. But look at Isen and Levin. Find a dime in a phone booth, you're likely to help a stranger pick up dropped papers. Don't find the dime, you walk past. Helping behavior turns on a ten-cent coin, not a lifetime of moral cultivation."

  Thomas took a sip of his wine. "You're treating virtues as global traits, rigid behavioral dispositions that fire regardless of context. That isn't Aristotle. That's a caricature built so situationists like Doris can knock it down."

  "Hartshorne and May found virtually no consistency in honesty across different contexts," Ines said, finally meeting his eyes. "Children who cheated on a math test didn't necessarily cheat on a physical endurance test. Honesty wasn't a unitary trait. It was fragmented. If the data says character is fragmented, what exactly are you defending?"

  "The reality of *phronesis*," Thomas said, leaning in. "Practical wisdom isn't blindness to context; it's sensitivity to it. The virtuous agent perceives the morally salient features of a situation. If the context shifts, the appropriate response shifts. Consistency isn't doing the same thing everywhere; it's responding correctly to the reasons present."

  "So when the seminarians in Darley and Batson's study rushed past the slumped man because they were late for a talk on the Good Samaritan, that was *phronesis*?" Ines's voice sharpened. "They were literally thinking about the virtue you defend, and the situation crushed it."

  "They were under time pressure," Thomas countered. "The salience of the appointment overwhelmed the salience of the victim. That doesn't mean they lack character; it means character competes with other cognitive demands. You're treating virtues as infallible mechanisms. They're more like skills."

  "Skills?" Ines laughed, a short, dry sound. "If a carpenter loses the ability to hammer because he's in a hurry, we don't say he has the skill of carpentry but the situation inhibited it. We say he isn't a carpenter."

  "Acquisition takes time," Thomas said. "Most people aren't virtuous yet. Aristotle knew that. The situationist studies measure average behavior in populations, mostly students, under artificial constraints. A forced-choice lab paradigm measures compliance, not moral perception. You can't measure a complex skill by putting the subject in a pressure cooker they weren't trained to navigate."

  "But the correlation coefficients are tiny," Ines pressed. "Less than point-three. If character traits existed in the robust sense virtue ethics needs to ground moral responsibility, the predictive power would be higher. It's an empirical fiction, Thomas. You're defending a ghost because it makes for a nicer story than randomness."

  "I'm defending a normative ideal," Thomas said quietly. "You're looking for descriptive laws. Virtue isn't about predicting what people *will* do; it's about what they *could* become through habituation. The fact that most people fail the test doesn't mean the standard is fake. It means most people haven't done the work."

  "And when the situation dictates the failure every time?" Ines asked. "When the dime determines the help, not the habit? You say it's a skill, but skills generalize. If I learn to balance on a beam, I don't lose the ability because the room is painted blue. But moral behavior shifts with the weather."

  "Because moral situations aren't beams," Thomas said. "They're complex networks of reasons. The dime study shows that minor mood shifts affect helping. It doesn't show that a person who has spent twenty years cultivating generosity will abandon it for a coin. You're conflating the nascent disposition with the perfected virtue."

  "So the virtue only exists in the people who don't show up in your data sets," Ines said. "The unicorns."

  "The sages," Thomas corrected. "They're rare. That's why they're admired."

  Ines looked out at the room, watching a group of graduate students laughing too loudly near the buffet. "It's dangerous, though. Believing in them. If we think character is real, we stop fixing the situations that make people behave badly. We blame the victim instead of the phone booth."

  "And if we believe character is fiction," Thomas said, turning his glass in his hand, "we lose the language for praise and blame entirely. We become puppets of the environment. I'd rather believe the puppet can learn to cut the strings."

  "They're very fine strings," Ines said softly.

  "Strong enough," Thomas replied.

  They sat in the silence between them, the argument settled but not resolved, the wine flowing between the data and the ideal.
