prompt: |-
  So for context, I'm a few years into a poli-sci/philosophy PhD working mostly on theories of justice, and a few of us in the department run a little podcast where we basically get people to come on and get grilled for a hour. Next week's guest is a postdoc who just turned her dissertation into a book defending what she calls a neo-Nozickian account of animal ethics -- she's basically taking that weird, hedgy little section early in Anarchy, State, and Utopia (I think its actually titled something like "Constraints and Animals") where Nozick floats the idea that maybe you want something like utilitarianism for animals but full Kantian side-constraints for people, and she's trying to turn that throwaway aside into an actual, worked-out position instead of the footnote-level thing Nozick left it as.

  I've reread the section a couple times now and I really don't want the episode to just be her restating the "utilitarianism for animals, Kantianism for people" line (or however she ends up phrasing it) for 40 minutes, so could you draft me 8-10 interview questions that push on where the view actually strains? I want at least one question that goes straight at the argument-from-marginal-cases problem -- if side-constraints are grounded in some capacity for rational, meaning-giving agency, infants and severely cognitively disabled humans don't clear that bar either, so why do they keep full inviolability while a chimp or a corvid doesn't -- with a follow-up ready in case she reaches for a "species-typical capacities" move to rescue it. I also want one on whether the two-theories split is actually principled or just a patch, given that Nozick's whole case against utilitarianism for people (the utility monster, worries about being just a resource for others' aggregate happiness) seems like it should apply to any suffering-capable being, not just humans. And I want one on what "unnecessary" is doing in "no unnecessary suffering," once animals are already just utilitarian aggregate-fodder in her framework -- doesn't that word quietly smuggle a side-constraint back in through the back door? If you can fit it in, add a question tying this back to Nozick's Lockean story about original acquisition (if animals have even a thin threshold status, does that constrain appropriating land that's already, in some sense, occupied by them?), and end on a question that forces her to name one concrete case -- factory farming, animal testing, whatever -- where her view actually cashes out differently than a straightforwardly utilitarian one would. For each question, add a short follow-up keyed to the answer she's most likely to give, not just a generic "could you say more."
