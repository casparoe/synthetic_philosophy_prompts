prompt: |-
  So at my job we're always told not to peek at A/B test dashboards early because it messes with the p-value (something about repeated testing inflating false positives, which I sort of get). But I read that a Bayesian can peek at the data as much as they want and keep updating their posterior, and that's apparently not "cheating" in the same way. That feels like black magic to me -- why would switching frameworks change whether looking at your data early is a valid move? Can you walk me through the actual mechanics of why optional stopping breaks frequentist inference but doesn't break Bayesian inference, rather then just giving me the one-line summary everyone gives? Bonus points if you can tie it back to why this is one of the things people blame for the replication crisis.
reasoning: |-
  Here's a thinking process that leads to the explanation of optional stopping in frequentist vs. Bayesian frameworks:

  1.  **Deconstruct the User's Query:**
      *   **Core Question:** Why does "peeking" (optional stopping) break frequentist inference (p-values) but not Bayesian inference (posteriors)?
      *   **Desired Depth:** "Walk me through the actual mechanics," not just the one-line summary.
      *   **Context:** A/B testing at work.
      *   **Bonus:** Connect this to the replication crisis.
      *   **Tone:** Skeptical ("feels like black magic"), seeking intuitive understanding of the mathematical machinery.

  2.  **Initial Brainstorming & Key Concepts:**
      *   *Frequentist:* P-values depend on the *sampling distribution* under the null hypothesis. This distribution assumes a fixed sample size ($N$). If $N$ is a random variable (stopping rule), the distribution changes. Type I error rate ($\alpha$) accumulates with each look.
      *   *Bayesian:* Posterior depends on the *Likelihood* and the *Prior*. The Likelihood Principle states that all evidence is contained in the likelihood function. The stopping rule is irrelevant to the likelihood (assuming it doesn't depend on the parameter value in a specific way).
      *   *Replication Crisis:* P-hacking, multiple comparisons, publication bias, optional stopping leading to false positives that don't replicate.
      *   *Analogy:* Coin flipping is the classic example.

  3.  **Structuring the Explanation:**
      *   **Introduction:** Acknowledge the "black magic" feeling. Validate that it *is* counterintuitive but has distinct mechanical reasons.
      *   **Part 1: The Frequentist Mechanism (Why peeking breaks it).**
          *   Define the p-value (probability of data *or more extreme* given $H_0$).
          *   Explain the "Sampling Distribution" concept. It's built on a promise ("I will flip 100 times").
          *   Show what happens when you break the promise ("I'll stop when I'm ahead").
          *   Visualize the error rate inflation (the "alpha spending" concept).
      *   **Part 2: The Bayesian Mechanism (Why peeking doesn't break it).**
          *   Define the Posterior (Prior $\times$ Likelihood).
          *   Introduce the Likelihood Principle.
          *   Explain that the stopping rule doesn't change the probability of the *observed data* given the parameter.
          *   Address the "calibration" caveat (Bayes isn't immune to *bad decisions*, just invalid *inference*).
      *   **Part 3: The Replication Crisis Connection.**
          *   How frequentist flexibility led to p-hacking.
          *   Publication bias (only significant results get published).
          *   Why Bayesian methods might help (but aren't a silver bullet).
      *   **Conclusion:** Summary of the fundamental philosophical difference (Long-run error rates vs. Degree of Belief).

  4.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Frequentist Section:* I need to make sure I explain *why* the sampling distribution changes. If I plan $N=100$, the distribution of the test statistic is specific. If I check at $N=50$, then $N=100$, I've essentially created two opportunities to reject $H_0$. The probability of *at least one* false positive across multiple looks is higher than $\alpha$ for a single look.
          *   *Example:* Coin toss. $H_0$: Fair coin ($p=0.5$).
          *   *Fixed:* Flip 10 times. Prob of 10 heads = small.
          *   *Optional:* Flip until 10 heads in a row? No, that's too extreme. Let's use "Stop if $p < 0.05$".
          *   *Better explanation:* Focus on the definition of the p-value. It includes "data more extreme than observed." If the stopping rule allows you to keep going until significance, the set of "possible outcomes" changes drastically.

      *   *Bayesian Section:* Focus on Bayes' Theorem: $P(\theta|D) \propto P(D|\theta) \times P(\theta)$.
          *   Does the stopping rule appear in $P(D|\theta)$? No. The probability of seeing *this specific sequence* of heads/tails is the same regardless of *why* I stopped.
          *   *Crucial distinction:* Bayesians care about the probability of the *Hypothesis* given the *Data*. Frequentists care about the probability of the *Data* given the *Hypothesis*.
          *   *Caveat:* I must mention that while the *inference* (posterior) is valid, the *decision* (stopping early) might still be costly if you act on noisy early data. But the math isn't "broken."

      *   *Replication Crisis:* Connect the inflated false positive rate to published literature. If everyone peeks, 20% of null effects look significant (instead of 5%). These get published. Others try to replicate with fixed $N$ and fail.

  5.  **Refining the Intuition (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Bayesians *should* peek. They *can*. But peeking on noisy data leads to wide posteriors that might look convincing by chance if the prior is weak. However, the *probability statement* remains coherent.
      *   *Clarification:* Make sure to distinguish between "inference validity" and "decision quality."
      *   *Analogy:* Use the "Coin Flip" analogy for both. It's the standard for a reason.
      *   *Frequentist:* "What is the chance I see this result if I *always* did this experiment?"
      *   *Bayesian:* "Given I saw this result, what do I believe now?"

  6.  **Final Polish:**
      *   Check tone: Keep it conversational but rigorous.
      *   Ensure the "Bonus" section is integrated well.
      *   Verify the explanation of the Likelihood Principle (it's the technical heart of the Bayesian argument).

  7.  **Final Review against constraints:**
      *   Did I explain the mechanics? Yes (Sampling distribution vs. Likelihood).
      *   Did I address the replication crisis? Yes.
      *   Is it better than a one-liner? Yes, hopefully.

  *(Self-Correction Note during final output generation)*: I need to make sure I don't oversell Bayesian methods. They have their own issues (priors, computation). I should acknowledge that "not breaking inference" doesn't mean "guaranteed good business decisions."

  8.  **Constructing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is one of the deepest rabbit holes in statistics, and your skepticism is warranted. It *does* feel like black magic. How can the same data tell two different stories just because you changed your internal philosophy?

  The short answer is that Frequentists and Bayesians are answering fundamentally different questions. When you "peek," you change the answer to the Frequentist question, but you don't change the answer to the Bayesian question.

  Here is the mechanical breakdown of why optional stopping breaks one framework but not the other, and how this fueled the replication crisis.

  ---

  ### 1. The Frequentist Mechanism: The Promise of the Sampling Distribution

  To understand why peeking breaks p-values, you have to understand what a p-value actually is. It is **not** the probability that the null hypothesis is true.

  A p-value is: *The probability of observing data this extreme (or more extreme), assuming the Null Hypothesis is true, **given a specific experimental design.** *

  That bolded part is the mechanical failure point.

  #### The "Fixed N" Promise
  In a standard Frequentist A/B test, you make a promise before you start: *"I will collect exactly 1,000 users, and then I will calculate the test statistic."*

  Because you made this promise, statisticians can simulate the "Sampling Distribution." They can ask: "If there is actually no difference between A and B, and we run this exact experiment 10,000 times, how often do we see a difference this big by random chance?" They set that threshold at 5% ($\alpha = 0.05$).

  #### The "Peeking" Betrayal
  When you peek at day 3, decide the result looks good, and stop, you have silently changed the experimental design. You didn't run a "Fixed N=1000" experiment. You ran a "Stop as soon as $p < 0.05$" experiment.

  This changes the **Sampling Distribution**.

  Imagine you are flipping a fair coin ($H_0$: $p=0.5$).
  *   **Fixed Design:** You flip 10 times. The chance of getting 10 heads is $0.5^{10} \approx 0.001$.
  *   **Optional Stopping:** You flip until you get 10 heads in a row. If you stop there, the data looks *exactly* the same (10 heads).

  However, under the **Optional Stopping** rule, the probability of eventually seeing 10 heads in a row is **1.0** (100%). If you keep flipping long enough, it *will* happen.

  By peeking, you have given yourself multiple "at-bats" to reject the null.
  1.  Check at $N=500$. If $p < 0.05$, stop. (5% chance of false positive here).
  2.  If not, check at $N=600$. If $p < 0.05$, stop. (Another chunk of false positive probability added).
  3.  If not, check at $N=700$...

  Every time you peek, you inflate the "Type I Error Rate" (false positive rate). If you peek enough times, your actual false positive rate can skyrocket from 5% to 20%, 30%, or higher, even though your dashboard says "$p < 0.05$." The math assumes you only looked once; by looking five times, you've violated the assumptions required for the p-value to be valid.

  ### 2. The Bayesian Mechanism: The Likelihood Principle

  Bayesians don't care about the sampling distribution of hypothetical experiments you *didn't* run. They care about the **Likelihood Principle**.

  The core of Bayesian inference is Bayes' Theorem:
  $$ P(\text{Hypothesis} | \text{Data}) \propto P(\text{Data} | \text{Hypothesis}) \times P(\text{Hypothesis}) $$

  *   **Posterior:** What we believe now.
  *   **Prior:** What we believed before.
  *   **Likelihood:** How probable was this specific data under different hypotheses?

  #### Why Stopping Rules Vanish
  The mechanical reason optional stopping doesn't "break" Bayesian inference is that the **stopping rule does not appear in the Likelihood function.**

  Let's go back to the coin flip. You observe 10 Heads.
  *   **Frequentist asks:** "What is the probability of getting 10 Heads *given the rule I used to stop*?" (This depends on whether you planned 10 flips or planned to flip until 10 heads).
  *   **Bayesian asks:** "Given I saw 10 Heads, how much more likely is it that the coin is biased vs. fair?"

  The probability of seeing the sequence `H H H H H H H H H H` is $0.5^{10}$ if the coin is fair, and $0.9^{10}$ if the coin is biased (say, 90% heads). **This calculation is identical regardless of why you stopped flipping.**

  Whether you stopped because you ran out of time, because you got bored, or because you peeked and saw a high probability of bias, the *evidence contained in the data itself* hasn't changed. The data speaks for itself.

  Therefore, a Bayesian can update their posterior every hour.
  *   Hour 1: Posterior is 55% chance B is better.
  *   Hour 2: Posterior is 60% chance B is better.
  *   Hour 3: Posterior is 90% chance B is better. **Stop.**

  This is mathematically coherent. The posterior at Hour 3 accurately reflects your degree of belief given the data observed *up to that point*. You haven't inflated a false positive rate because you aren't controlling a long-run error rate; you are updating a probability distribution.

  #### The Catch (It's not actually magic)
  While the *inference* (the posterior probability) is valid, the *decision* can still be risky.
  If you peek early, the data is noisy. Your posterior might say "90% chance B is better," but the credible interval will be huge. If you act on that early peek, you might deploy a feature that actually has no effect, simply because early noise looked like a signal.

  However, this is a **decision theory** problem, not an **inference** problem. The Bayesian math isn't lying to you about the probability; it's just that early data is inherently uncertain. A Frequentist p-value, by contrast, is literally mathematically incorrect if you peek, because it claims a 5% error rate when the actual error rate is much higher.

  ### 3. Connection to the Replication Crisis

  This mechanical difference is a primary engine of the replication crisis in psychology, medicine, and tech.

  **The Frequentist Trap:**
  In the traditional academic publishing model, researchers were incentivized to find $p < 0.05$.
  1.  A researcher runs a study.
  2.  They peek at the data. "Oh, $p=0.08$. Close! Let's get 10 more subjects."
  3.  They peek again. "$p=0.04$. Great, stop and publish."
  4.  Because they peeked, the actual false positive rate wasn't 5%; it was maybe 25%.
  5.  The paper gets published as a "discovery."
  6.  **Replication:** Another lab tries to replicate it. They don't know the original researchers peeked, so they run a fixed sample size. Because the original effect was a false positive generated by optional stopping, the replication fails.

  This is "p-hacking." It wasn't necessarily malicious fraud; it was often researchers using Frequentist tools in a flexible, human way (checking progress) without realizing the math forbids it. The literature became filled with "significant" results that were actually just noise captured by repeated testing.

  **The Bayesian Mitigation:**
  If those researchers had used Bayesian A/B testing:
  1.  They peek at the data. The posterior shows a 85% probability of an effect.
  2.  They collect more data. The posterior moves to 60% (regression to the mean).
  3.  They collect more. The posterior settles at 51%.
  4.  They conclude: "We are unsure if there is an effect."

  They likely wouldn't have published a false positive, because the Bayesian framework allows you to acknowledge uncertainty without needing to cross an arbitrary "significance" threshold that tempts you to keep sampling until you cross it.

  ### Summary: The Philosophical Divide

  *   **Frequentist Inference** is about **Behavior.** It guarantees that if you follow the rules, you won't be wrong more than 5% of the time *in the long run*. Peeking breaks the rules, so the long-run guarantee evaporates.
  *   **Bayesian Inference** is about **Belief.** It guarantees that your current belief is mathematically consistent with the data you have *right now*. Peeking doesn't change the data you have, so the belief update remains valid.

  **Why your boss is still right (mostly):**
  Even though Bayesians *can* peek, in a business context, peeking is often still bad practice. Why? Because of **Expected Value.**
  If you stop an experiment the moment the posterior looks good, you are selecting for noise. You might launch 10 features that looked good early but were actually neutral, costing you engineering time and user trust. While the *math* isn't broken, the *business outcome* might still suffer from "early stopping bias."

  So, while switching to Bayesian saves you from the sin of "invalidating your p-value," it doesn't save you from the sin of "making decisions on noisy data." But at least the math won't be lying to you about how uncertain you should be.
