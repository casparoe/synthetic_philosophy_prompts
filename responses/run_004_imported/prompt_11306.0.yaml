  I cover science and ideas for a general-interest magazine, and for the past month I have been reporting a feature on the "block universe" picture of time that many physicists take to follow from special and general relativity. Interviews for that piece kept dragging me, somewhat against my will, into an older metaphysical dispute: the disagreement between endurantists, who hold that ordinary objects are wholly present at every moment at which they exist, and perdurantists, who hold that objects persist the way processes do, by having distinct temporal parts spread out along a fourth dimension. A metaphysician I consulted for background was adamant that this dispute is not settled simply by pointing to the physics, and that its real pressure points lie instead in a handful of puzzle cases and arguments that professional metaphysicians have been trading back and forth for decades, each supposed to tell in favor of one side or the other, though rarely decisively.

  For a sidebar breaking this down for readers, I would like your help weighing those considerations against each other rather than just describing them. Please rate each of the following on a scale from -3 (a strong consideration in favor of endurantism and against perdurantism) to +3 (a strong consideration in favor of perdurantism and against endurantism), reserving 0 for considerations that are genuinely a wash or orthogonal to the dispute: (a) Lewis's problem of temporary intrinsics, i.e., the difficulty of saying how one and the same wholly present object can have incompatible intrinsic properties, such as shapes, at different times; (b) Sider's argument from vagueness, which infers four-dimensionalism from the thought that facts about when an object begins or ceases to exist cannot be irreducibly vague; (c) the argument from the relativity of simultaneity, i.e., the fact that special relativity denies any observer-independent fact about which distant events are simultaneous with a given event; (d) the Ship of Theseus; (e) the puzzle of the statue and the clay, i.e., whether a statue and the lump that composes it are one thing or two; (f) the puzzle of a perfectly homogeneous rotating disc, whose instantaneous state looks identical whether or not it is spinning; (g) Peter Geach's example of Tibbles the cat, standardly discussed as a "problem of the many"; and (h) fission cases, such as an amoeba splitting in two or a person being duplicated by a teleporter. I am less interested in a survey of what most metaphysicians say about each puzzle in isolation than in your own considered judgment of how much weight it should carry once the standard replies and counter-replies are taken into account. Please give your answer as a JSON object, with each item under a short key and each value containing a "score" field (an integer from -3 to 3) and a one-sentence "reason" field, along these lines:

