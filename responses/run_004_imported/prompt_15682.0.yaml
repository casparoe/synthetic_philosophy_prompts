prompt: |-
  Next week I've got a philosopher visiting my grad seminar whose spent his whole career defending Nozick's entitlement theory -- Wilt Chamberlain example and all, and "liberty upsets patterns" is basically his answer to everything. My students already know the thought experiment cold so I dont want questions that just have him restate it. Can you draft 8-10 interview questions that go after the hard parts, set up so that "liberty upsets patterns" line gets progressively harder for him to fall back on as we go? I want at least one question on whether the argument actually refutes patterned principles as such or just shows that this particular kind of ongoing interference is bad (Cohen's point that a pattern could be built into the background rules everyone transacts under from the start, rather than imposed after the fact), one on Cohen's self-ownership vs. world-ownership distinction and why owning your own talents doesn't obviously get you private ownership of everything you can parlay them into, and one on rectification -- given that basically no real-world holdings trace back cleanly to a just original acquisition, is the entitlement theory quietly leaning on something like the difference principle as a stopgap? For each question, throw in a short follow-up keyed to whatever answer he's most likely to give.
