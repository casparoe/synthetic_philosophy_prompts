answer: |-
  Here are 10 interview questions designed for a graduate seminar context. They are ordered to start with internal theoretical coherence and move toward empirical and structural critiques, making the "liberty upsets patterns" defense increasingly costly to maintain.

  ### 1. The Lockean Proviso as a Patterned Constraint
  Nozick relies on the Lockean Proviso to justify original acquisition: you can appropriate unowned resources provided you leave "enough and as good" for others. In a world of finite resources and population growth, doesn't the Proviso eventually trigger constantly? If so, doesn't the Proviso itself function as a patterned end-state principle that overrides historical entitlement whenever scarcity hits?

  *   **Likely Answer:** He will argue that capitalism improves the baseline for everyone (the "water pump" argument), so the Proviso is rarely violated because even the landless are better off than in a state of nature.
  *   **Follow-up:** "But that justification relies on a comparative metric of *well-being*, not a historical metric of *consent*. If the Proviso is satisfied only when the poor are materially better off, aren't you smuggling a Difference Principle-style constraint into the foundation of acquisition?"

  ### 2. Cohen on Background Rules vs. Interference (Required)
  G.A. Cohen argues that Nozick conflates "maintaining a pattern" with "interfering with liberty." Cohen suggests we could embed a distributive pattern into the *background rules* of property law themselves (e.g., tax structures or inheritance limits defined ex-ante) rather than interfering with transactions after the fact. If the rules are known and consented to before the first dollar is earned, in what sense does liberty get "upset"?

  *   **Likely Answer:** He will likely claim that embedding redistribution in the background rules still restricts the freedom of contract and amounts to partial ownership of people's labor by the state.
  *   **Follow-up:** "But if the restriction is universal and procedural, rather than targeted and discretionary, why is it a violation of self-ownership? If I agree to play a game where 10% of points go to a pot, have I violated my own liberty by playing?"

  ### 3. Self-Ownership vs. World-Ownership (Required)
  Nozick assumes that self-ownership (owning your talents) naturally extends to private ownership of the external world required to exercise those talents. Cohen distinguishes these: I might own my hands, but that doesn't entail I own the clay. Why does the moral force of self-ownership automatically trump the equal claim others might have to the external resources needed to make that self-ownership valuable?

  *   **Likely Answer:** He will argue that without private appropriation, resources become a tragedy of the commons, rendering self-ownership useless because no one can effectively use anything.
  *   **Follow-up:** "That's a consequentialist argument about efficiency, not a deontological argument about rights. If the justification for private world-ownership rests on its outcomes, can you still claim it's a side-constraint that overrides all other moral considerations?"

  ### 4. The Moral Arbitrariness of Genetic Endowment
  Nozick rejects "moral desert" as a basis for distribution, yet Entitlement Theory protects the rewards flowing from natural talents. If we agree that genetic endowment is morally arbitrary, why does the *historical process* of monetizing that arbitrariness create a just claim? Does "liberty" protect the right to profit from luck, or does it only protect the right to exercise the talent?

  *   **Likely Answer:** He will distinguish between "desert" and "entitlement." You don't *deserve* your talent, but you are *entitled* to what you gain with it because no one else has a better claim to it.
  *   **Follow-up:** "But if the state prevents me from using your talent to starve (via taxation), it isn't claiming your talent; it's claiming the *scarcity rent* that society attaches to that talent. Why is that rent exclusively yours?"

  ### 5. The Feudalism Objection (Liberty Consuming Liberty)
  If liberty upsets patterns, unchecked entitlement transfers can lead to extreme wealth concentration. Eventually, this could create a neo-feudal structure where the propertyless must submit to the will of owners to survive. At what point does the accumulation of property rights begin to violate the *liberty* of others, and does Entitlement Theory have an internal mechanism to prevent liberty from destroying the conditions of its own exercise?

  *   **Likely Answer:** He will argue that as long as exchange is voluntary, submission to employment is not a violation of liberty. Coercion requires a threat, not an offer.
  *   **Follow-up:** "If one class owns all the land, the 'offer' to work or starve is structurally coercive. If you deny this, are you defining liberty purely formally, ignoring the *power* relations that make formal liberty meaningless for the dispossessed?"

  ### 6. Rectification and the "Dirty Hands" of History
  Entitlement Theory rests on the justice of original acquisition and transfer. Given that virtually all current holdings trace back to historical injustices (colonialism, slavery, theft), the historical chain of title is broken everywhere. If we cannot trace clean titles, doesn't the theory lose its action-guiding force in the real world?

  *   **Likely Answer:** He will concede this is difficult but argue we must use our best historical estimates to approximate rectification where possible, without abandoning the principle.
  *   **Follow-up:** "Given the scale of the uncertainty, wouldn't any 'best estimate' necessarily rely on a rough-and-ready patterned heuristic (like current income distribution) to settle claims? If so, isn't rectification practically indistinguishable from the end-state principles you reject?"

  ### 7. Rectification as a Trojan Horse for the Difference Principle (Required)
  Following up on the previous point: If we admit we cannot rectify every historical injustice, Nozick suggests we might need a "rough rule of thumb." If that rule of thumb is designed to protect the worst-off (who are most likely victims of historical injustice), isn't Entitlement Theory quietly leaning on something like the Difference Principle as a necessary stopgap?

  *   **Likely Answer:** He will resist this, arguing that the goal is to correct specific wrongs, not to maximize the position of the least advantaged as a general principle.
  *   **Follow-up:** "But without a patterned principle to guide the stopgap, how do you decide *how much* rectification is enough? If the metric isn't the welfare of the victims, what is it? And if it is their welfare, how is that not patterned?"

  ### 8. Negative Liberty vs. Effective Power
  Nozick's argument relies on a specific definition of liberty as the absence of interference by other agents. However, if I lack the resources to act, I am unfree in any meaningful sense, even if no one is actively stopping me. Does "liberty upsets patterns" hold if we define liberty as *effective power* rather than *negative rights*?

  *   **Likely Answer:** He will reject the definition, arguing that conflating liberty with ability muddies the waters. Rights protect a sphere of non-interference, not a guarantee of capacity.
  *   **Follow-up:** "But if the law enforces property rights, it *is* interfering (via police/courts) on behalf of owners against non-owners. Why is state interference to protect property 'liberty,' but state interference to redistribute 'coercion'? Both involve men with guns enforcing rules."

  ### 9. Externalities and Multilateral Consent
  The Wilt Chamberlain example assumes bilateral, consensual exchanges with no third-party effects. In a modern economy, almost all transactions create externalities (pollution, climate change, systemic risk) where third parties cannot consent. How does Entitlement Theory handle transfers where the "liberty" of two parties violates the entitlements of a million non-consenting others?

  *   **Likely Answer:** He would argue this is a matter of defining the initial rights (e.g., do you have a right to clean air?). Once rights are defined, the theory holds.
  *   **Follow-up:** "But defining those rights in a complex world requires a regulatory state that constantly adjusts boundaries based on social impact. Doesn't that level of ongoing adjustment look exactly like the 'pattern maintenance' Nozick claims to avoid?"

  ### 10. The "Utopia" Framework Paradox
  In *Anarchy, State, and Utopia*, Nozick frames the minimal state as a framework for communities to experiment. If a community voluntarily chooses to organize itself socialistly (maintaining a pattern internally), does the Minimal State have to enforce an individual's right to exit that community even if it undermines the community's survival?

  *   **Likely Answer:** Yes, individual rights to exit and private property are trump cards, even against voluntary socialist communities.
  *   **Follow-up:** "So the 'Framework' isn't neutral; it privileges liberal-individualist patterns over communitarian patterns. If the state enforces a meta-rule that makes sustained socialism impossible, isn't the state itself upholding a specific patterned conception of the good life?"
