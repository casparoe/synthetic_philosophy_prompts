              *   *Probability/Uncertainty:* Future outcomes are less certain.
              *   *Growth/Opportunity Cost:* Future people might be richer (diminishing marginal utility of consumption).
              *   *Existential Risk:* The future might not happen.
          *   *Conclusion:* A positive discount rate can be justified by these factors even if PTP is zero.
