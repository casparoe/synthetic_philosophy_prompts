prompt: |-
  My uncle just got scheduled for a corpus callosotomy to help with his seizures, and I've gone down a total rabbit hole reading about split-brain research trying to figure out what his experience might actually be like afterward. I keep running into two really different takes: the classic Gazzaniga-style story where you basically end up with two separate conscious minds sharing one skull, versus newer stuff (like that Pinto et al. study) arguing the disconnection syndrome is more about information access between hemispheres than an actual splitting of consciousness into two subjects. Can you lay out what's really at stake between these two views, and why the behavioral data from split-brain patients doesn't just settle the question one way or the other?
