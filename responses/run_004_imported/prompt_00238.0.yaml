      *   *Cross-Cuing:* Patients learn subtle tricks (head turning, peripheral vision) to bypass the cut.
      *   *Interpretation Gap:* Behavior (pointing left) $\neq$ Phenomenology (what it *feels* like). We can't ask the right hemisphere to write an essay about its feelings easily.
      *   *Plasticity/Compensation:* Other commissures (anterior, hippocampal) might remain intact.

