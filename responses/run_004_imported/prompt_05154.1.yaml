answer: |-
  The power went out at 8:14 PM. Elias knew the time because the digital clock on the microwave blinked its zeros one last time before dying. He sat in the sudden silence of his apartment, the hum of the refrigerator vanishing, leaving only the blood rushing in his ears.

  He fumbled for the drawer where he kept the candles. His fingers found the wax, the wick, and the small cardboard box of matches. He struck one against the strip. Nothing. He struck it again, harder. The sulfur head flared, a sudden, violent blossom of orange and blue.

  It was a normal event. Millions of matches had lit this way before. But in the darkness, holding the small stick of wood as the flame ate toward his fingers, Elias felt a disconnect. He had moved his hand. He had created friction. But the fire… the fire felt like a guest that had arrived simultaneously, not a consequence.

  He lit the candle. The flame stood steady. He watched it. In physics, he knew the story: heat raises the temperature of the wax, vaporizing it, mixing it with oxygen, the chemical reaction sustaining the plasma. A chain. A necessity. But watching the wick blacken and the liquid pool, Elias wondered if he was seeing a chain at all. Or if he was seeing two separate movies projected on the same screen. The blackening of the wick. The appearance of the light. They happened together, always, but did one *make* the other?

  He went to the kitchen to boil water for tea. The gas stove still worked. He turned the knob. The click-click-click of the igniter. Then, the *whoosh* of the burner catching.

  Elias held his hand over the flame. It was hot. But he pulled his hand back, not because he was burned, but because he wasn't sure the heat belonged to the fire. What if the heat was just placed there, next to the fire, by habit?

  He remembered his grandfather in the ICU three months prior. The defibrillator paddles pressing into the chest. The arc of electricity. The flatline jumping into a rhythm. His aunt had stood in the corner, praying, and later she had said, "The machine did not wake him. The voltage was just the time God chose to wake him." Elias had been angry then. It sounded like a denial of the doctors' skill, a theft of agency from the technology that had saved a life.

  Now, staring at the blue ring of the gas burner, the anger was gone, replaced by a cold vertigo. If the aunt was right, not theologically but mechanically, then the world was not a machine. It was a sequence of images.

  The kettle began to whistle. Elias turned off the gas. The flame vanished. The sound continued for a second, then stopped.

  He poured the water. He watched the steam rise. Usually, this was the most comforting part of his evening: the predictability of it. Gravity pulling the water down, thermodynamics moving the heat. But now, as he lifted the mug, he hesitated. Why did the ceramic hold the liquid? Why did the table hold the mug?

  He set the mug down. It sat there. But he felt no trust in the table's solidity. The table was wood. Wood was fibers. Fibers were empty space held together by forces he couldn't see. Forces that had no obligation to continue.

  He walked to the living room and sat on the sofa. He pressed his palms against the cushions. They pushed back. Newton's Third Law. Action and reaction.

  *Custom,* he thought. *Not law.*

  If the connection between cause and effect was not necessary, then prediction was a form of gambling. He had bet a thousand times today that the floor would support his weight. He had bet that the air would contain oxygen when he inhaled. He had won every bet. But he realized now he hadn't won because he was right; he had won because the Dealer had allowed it.

  He stood up and walked to the window. Outside, the city was dark, scattered with generator lights and car headlights. A traffic signal hung over the intersection. Red. Yellow. Green.

  Cars stopped. Cars went.

  Elias imagined the moment the light turned green. The drivers pressed their accelerators. The engines roared. The cars moved. But suppose, just for one instant, the habit was broken. Suppose a driver pressed the pedal, the engine spun, but the car remained still. Not because the transmission was broken, but because the connection between the spinning axle and the forward motion was simply not created in that moment.

  It would look like a miracle. Or a glitch.

  Elias turned from the window. His heart was beating. *Thump-thump.* He put a hand to his chest. Did the electrical signal from his brain cause the muscle to contract? Or did the contraction simply accompany the signal?

  He felt a sudden, sharp anxiety. He needed to leave the apartment. He needed to be somewhere where people believed in the machine. He grabbed his coat and his keys.

  He walked to the door. He inserted the key into the lock. He turned it. The latch retracted. He pushed. The door opened.

  He stepped into the hallway. The stairs were before him. He put his foot on the first step. He waited.

  This was absurd. He was a grown man, an actuary, a man who calculated risk for a living. He was afraid to walk down the stairs because he suspected gravity might take a holiday.

  But the suspicion wasn't intellectual. It was visceral. It was in the soles of his feet. The floor was not a given. It was a gift, renewed every nanosecond.

  He took the step. The stair held.

  He took the next. It held.

  By the time he reached the lobby, he was sweating. He pushed open the heavy front door and stepped onto the sidewalk. The air was cold. He breathed it in. It filled his lungs.

  A car drove past, tires humming on the asphalt. A couple walked by, laughing, holding hands. They moved through the world as if it were solid, as if the future was built on the foundation of the past. They assumed that because the sun had risen yesterday, it was obligated to rise tomorrow. They assumed that because fire burned cotton yesterday, it must burn it today.

  Elias walked toward the corner store. He needed something trivial. Gum. A newspaper. Something that proved the world was boring.

  He reached for the door handle of the store. It was brass. Cold. He pulled.

  The door didn't open.

  He pulled harder. It was locked. A sign on the glass: *Closed for Inventory.*

  Elias stared at the handle. He had pulled, and the door had not opened. In the old world, this was a simple mechanical failure of expectation. He had misread the sign.

  But in the new world, in the world of the gap, it felt like a revelation. The connection had been severed. His pull had not resulted in the entry. The habit had been interrupted.

  He stood there for a long time, his hand on the cold brass. He didn't feel frustrated. He felt a strange, hollow relief.

  If there was no necessity in the lock, there was no necessity in the illness. There was no necessity in the decay of the cells, the failing of the heart, the dimming of the mind. These were not laws written in stone. They were habits. And habits could be changed.

  But the converse was true, too. There was no necessity in the cure. The medicine did not *have* to work. The defibrillator did not *Have* to shock the heart into rhythm. If his grandfather had lived, it was not because the machine forced life back into him. It was because, for that moment, the Habit was to allow life.

  Elias turned away from the store. He began to walk back to his apartment. The streetlights flickered above him. One buzzed and went dark. Then another flickered back on.

  He walked carefully. He did not trust the ground, but he walked on it. He did not trust the air, but he breathed it. He was no longer a participant in a machine of cause and effect. He was a witness to a sequence of events, held together by a will that was not his.

  When he got back inside, the power was still out. The candle had burned down to a pool of hardened wax. The wick was drowned.

  Elias found another match. He struck it.

  It flared.

  He watched the flame. He knew it would burn his finger if he held it there. He knew the wax would melt. He knew the night would eventually end. But he knew these things only as a man knows the habits of a stranger: by observation, by memory, by a hope that the pattern holds.

  He lit a new candle. He sat in the chair. He watched the flame dance, not because the air moved it, but because, for now, it was permitted to. He waited for the next moment, and the next, knowing that nothing in the room had the power to guarantee the one after that.
