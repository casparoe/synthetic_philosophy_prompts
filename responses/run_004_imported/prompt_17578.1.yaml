answer: |-
  This is a profound responsibility, and your anxiety shows how well you understood her. Gogo would be proud that you are worried about getting the *truth* of her right, rather than just the performance of it.

  The key to writing this without lecturing the family or losing the outsiders is to **enact** the philosophy rather than **explain** it. Do not define *Ubuntu*; demonstrate it through the pronouns you use. A Western eulogy is usually "She did X, Y, Z." A relational eulogy is "We became who we are *through* her."

  For your partner and work friends, the context will come from the emotional weight of the connections you describe, not a definition. For the family, the respect comes from acknowledging that the "I" speaking is actually a "We."

  Here is a draft. It is written to be spoken slowly. The bracketed notes are for you, not to be read aloud.

  ***

  **Eulogy for Gogo**

  [Stand still for a moment before speaking. Look at the family, then the friends.]

  They told me I should speak today because I am "good with words." As a software engineer, I spend my life building logic structures. I build things that are precise, independent, and self-contained. If one line of code breaks, the system fails.

  But standing here, looking at all of you, I realize that Gogo taught me a different kind of architecture. One that doesn't run on logic, but on connection.

  We are gathered here to honor a woman from near Mthatha who knew exactly who she was. And because we love her, the temptation is to stand up and talk about her strength as if it belonged only to her. We want to say, "She built this family." "She overcame everything." "She was a force of nature."

  I can hear her now, from the back of the room, clicking her tongue at us.

  I remember when my Auntie once told her, "Ma, you built this whole family up yourself." It was meant as the highest compliment. But Gogo corrected her. She said that sentence didn't make sense. She asked: *Who is this "yourself" that exists before the family?*

  She taught us that a person is not a stone that sits alone in a field. A person is a path that is walked by many feet. In Xhosa, we say *Umuntu ngumuntu ngabantu*. Often, people translate this as "be nice to others." But Gogo knew it was deeper. It means: I do not exist in isolation. My humanity is caught up in yours. She did not build us. She grew us, and in doing so, we grew her.

  [Turn slightly to acknowledge your partner and friends in the room]

  For those of us coming from far away, or from different traditions, this can be hard to hold. We are taught to measure a life by what an individual achieves. But if you look at this room, you see the truth of her life. You see it in the way we are leaning on each other right now. You see it in the silence we share.

  Gogo's life wasn't a monument she built for herself to stand behind. Her life was the space between us. It was the food that was only good when shared. It was the stories that only existed when told. It was the scolding that only made sense because she cared for the future of the child.

  If I try to speak about her as if she is separate from us, I am telling a lie.

  So, I will not tell you how strong she was on her own. Because she wasn't on her own.
  She was strong because she had sisters who held her.
  She was wise because she had grandchildren who asked questions.
  She was a mother because there were children who needed her.

  When she passed on Sunday, she did not take her humanity with her. That is not how it works. The breath leaves the body, but the person remains here, distributed among us.

  [Look directly at the family]

  To the family: We do not need to worry that she is gone. As long as we are in relationship with one another, she is here. When I comfort my cousin, that is Gogo. When we argue about who remembers the recipe correctly, that is Gogo. When we make space for someone who is hurting, that is Gogo.

  She warned us against the idea that we are solitary things. She knew that loneliness is not just being alone; it is forgetting that you belong to people.

  So, how do we honor her? We do not honor her by pretending we can make it on our own. We honor her by admitting we need each other.

  To my partner, to my friends: Welcome to the web. You are not observers today. By grieving with us, by holding space with us, you are part of the *ngabantu*. You are part of the "other persons" through whom she remains a person.

  Gogo is not behind us, watching. She is between us, holding.

  Rest well, Gogo. You are still us. And we are still you.

  ***

  ### Notes for Delivery

  1.  **The "Correction" Moment:** When you recount the story about your Aunt and Gogo correcting the "you built this family" comment, do not say it with anger. Say it with a smile, like you can hear her voice. This signals to the family that you *know* the lore, and signals to the outsiders that this is a core family value.
  2.  **The Translation:** Notice I didn't define *Umuntu ngumuntu ngabantu* academically. I defined it through Gogo's specific interpretation ("Who is this 'yourself'..."). This respects the family's knowledge while teaching the outsiders the *meaning* without the *jargon*.
  3.  **The Ending:** "You are still us. And we are still you." This is the structural embodiment of the philosophy. It dissolves the barrier between the living and the dead, which is very African Traditional, without getting into the philosophical weeds of "personhood status."
  4.  **Pronouns:** Notice the shift from "She" to "We." Lean into that. When you say "We," gesture to the room.

  This structure avoids the "trophy" problem (she didn't earn personhood, she *inhabited* it through connection) and avoids the "lecture" problem (you are speaking from inside the tradition, not observing it). It welcomes your partner by inviting them into the *ngabantu* rather than asking them to study it.

  Condolences to you and your family. Gogo sounds like she was formidable.
