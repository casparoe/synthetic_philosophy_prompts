  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Trap:* Western eulogies focus on the *individual's* achievements ("She built this," "She overcame that"). Gogo's worldview says the *connections* are the reality.
      *   *The Solution:* The eulogy shouldn't be *about* Gogo as an isolated object. It should be about the *space she occupied* and how that space is now reflected in the people gathered. The "I" of the speaker is actually a "We."
      *   *Handling the Outsiders:* Instead of defining *Ubuntu* academically, demonstrate it through the structure of the speech. Show, don't tell. Use metaphors that translate universally (weaving, echoes, mirrors) but root them in Xhosa context.
      *   *Handling the Philosophy Debate:* Ignore the academic nuance of "earned personhood." Focus on the *presence* of her personhood in the living. She isn't gone; she is distributed.

