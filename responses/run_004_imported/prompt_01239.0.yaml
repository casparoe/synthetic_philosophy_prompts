prompt: |-
  So I'm taking this early modern philosophy seminar and we spent a week on Hobbes's weirdly intense feud with the mathematician John Wallis, which turned into a whole argument with my friend (who's doing a math PhD, so she came into this with Opinions). Background in case it matters: starting in the 1650s Hobbes kept insisting he'd squared the circle and solved a handful of other classical construction problems, and Wallis spent something like 25 years wrecking him in pamphlet after pamphlet -- there's an entire book about it (Jesseph's "Squaring the Circle"), and at one point Hobbes fired back with a pamphlet literally titled "Marks of the Absurd Geometry, Rural Language, Scottish Church Politics and Barbarisms of John Wallis." Apparently part of Wallis's strategy was going after the geometry on purpose, on the theory that if he could show it was garbage, Hobbes's whole political philosophy (which leans on geometry as its model for what certainty even looks like) would go down with it.

  My friend thinks Wallis was onto something. Hobbes's big epistemological claim is that geometry -- and, weirdly, civil philosophy/politics too -- is basically the only place we can get totally certain knowledge, precisely because we construct the objects ourselves out of our own definitions, instead of just guessing at hidden causes the way we have to in physics (I think this is literally called "maker's knowledge" in the secondary lit, though don't quote me on the term). Her point is that if Hobbes was this reliably, humiliatingly wrong about actual constructions for 25 straight years and basically never accepted a refutation, that has to count as real evidence against his theory of why geometry is supposed to be uniquely certain, not just embarassing trivia we get to set aside. I said that's basically an ad hominem -- whether Hobbes personally was any good at doing geometry seems like a totally seperate question from whether his argument about WHY geometrical knowledge is certain actually holds up, and plenty of perfectly good philosophers of math have been mediocre mathematicians. We went back and forth on this for like an hour and never landed anywhere. Was either of us actually right, or is there a better way of thinking about whether (and how) his mathematical failures should count against his epistemology?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Early modern philosophy seminar, Hobbes vs. Wallis feud (specifically regarding squaring the circle).
      *   **The Conflict:** The user's friend (math PhD) argues Hobbes's mathematical incompetence undermines his epistemological claim that geometry provides certain knowledge (because we construct it). The user argues this is an *ad hominem* (Hobbes's skill $\neq$ the validity of his epistemology).
      *   **Key Philosophical Concept:** "Maker's Knowledge" (knowledge through construction/causation).
      *   **The Question:** Who is right? Or is there a better framework to evaluate whether Hobbes's mathematical failures count against his epistemology?

  2.  **Initial Assessment of the Arguments:**
      *   **Friend's Position:** If geometry is supposed to be the paradigm of certainty because *we make it*, and Hobbes (the proponent) can't actually do it correctly despite decades of trying, doesn't that suggest the paradigm is flawed? It attacks the *exemplar*.
      *   **User's Position:** Distinguishes between the *practice* of mathematics and the *philosophy* of mathematics. A bad practitioner doesn't necessarily invalidate the theory of knowledge. (Analogy: A bad cook doesn't prove the recipe is wrong, or a bad logician doesn't prove logic is false).
      *   **Nuance:** It's not a simple *ad hominem* because Hobbes isn't just *anyone*; he uses *his own* geometric practice as evidence for his epistemology. The failure is internal to his system.

  3.  **Historical & Philosophical Fact-Checking:**
      *   **Hobbes's Claim:** Yes, he believed geometry/civil philosophy are demonstrable because we define the causes (we construct the figures/state). Natural philosophy (physics) is conjectural because God made nature, not us.
      *   **Wallis's Strategy:** Yes, Wallis explicitly linked Hobbes's math errors to his political/philosophical arrogance. If he can't govern a triangle, how can he govern a state?
      *   **Jesseph's "Squaring the Circle":** This is the standard text. It argues the feud wasn't just petty; it was about the authority of science and the nature of demonstration.
      *   **Maker's Knowledge:** This is the correct term (Vico is often associated with it later, but it applies to Hobbes/Descartes/Galileo context). *Verum factum* (the true is made).

  4.  **Developing the "Better Way of Thinking":**
      *   Neither side is fully "right" in a binary sense. It's a nuanced philosophical problem.
      *   *Why the User is partly right:* It is technically a genetic fallacy/*ad hominem* to say "Hobbes failed at math, therefore his epistemology is false." The truth of "geometry is certain" doesn't depend on Hobbes's ability to solve specific problems.
      *   *Why the Friend is partly right:* Hobbes's epistemology relies on geometry as the *paradigm case*. If the paradigm case is shown to be unstable, prone to error, or dependent on social consensus (as Wallis showed math community was) rather than individual construction, the epistemology weakens. Also, Hobbes claimed *his* method guaranteed truth. His persistent failure suggests the method isn't self-correcting in the way he claimed.
      *   *The Synthesis:* The issue isn't Hobbes's *competence*, but what his incompetence reveals about the *nature of geometric practice* in the 17th century. It highlights that geometry isn't just private mental construction; it's a public, linguistic, and social practice subject to error and interpretation.

  5.  **Drafting the Response:**
      *   **Acknowledge the complexity:** Validate both sides. It's a classic philosophy of science/history of math tension.
      *   **Address the "Ad Hominem" charge:** Explain why it's not *just* ad hominem. Hobbes put himself in the dock. His philosophy relies on the *possibility* of certain knowledge via construction. His failure is a data point against the *reliability* of that process in practice.
      *   **Address the Friend's Point:** The "Paradigm Case" argument. If geometry is the gold standard, and the gold standard is tarnished by endless dispute, the epistemology loses its foundation. Wallis showed math is social, not just solitary construction.
      *   **Address the User's Point:** Distinguish between *ideal* geometry and *practiced* geometry. Hobbes talks about the ideal capacity of human reason. One man's failure doesn't break the ideal.
      *   **The "Better Way" (Jesseph's insight):** The feud wasn't just about math; it was about *authority*. Hobbes thought truth comes from correct reasoning (solitary). Wallis showed truth comes from community consensus (social).
      *   **Conclusion:** The friend wins on the *historical/pragmatic* level (Hobbes's system didn't work as advertised), but the user wins on the *strictly logical* level (epistemology $\neq$ biography). However, since Hobbes's epistemology is grounded in human practice, the practice matters.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Hobbes was "wrong" about geometry being certain in the abstract. Euclidean geometry *is* deductively certain. Hobbes's error was thinking *he* could produce new truths easily and that the *method* was immune to error.
      *   *Key Distinction:* Hobbes conflated "geometry as an ideal system" with "geometry as a human activity." Wallis attacked the latter to undermine the former's claim to absolute authority.
      *   *Political Analogy:* This is crucial. Hobbes links math certainty to political sovereignty. If math is disputable, maybe sovereignty should be too (or maybe we need a different kind of sovereign for science).

  7.  **Final Polish:**
