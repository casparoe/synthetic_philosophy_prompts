answer: |-
  This is a fantastic debate, and honestly, it captures one of the most interesting tensions in early modern philosophy. You and your friend are both tapping into valid philosophical intuitions, but you're talking past each other slightly because you're operating on different levels of analysis.

  Here is the breakdown of who is right, why the "ad hominem" charge doesn't quite stick, and the better framework for understanding why Wallis (and your friend) might actually have the stronger philosophical point.

  ### 1. Why you are technically right (The Logical Level)
  Your instinct is correct in a strictly formal sense: **The truth of an epistemological theory is not logically dependent on the biographical competence of its author.**

  If Hobbes argues that "All bachelors are unmarried," it doesn't matter if Hobbes himself was married, single, or a monk. If he argues that "Geometry yields certain knowledge because we construct the figures," the validity of that claim rests on the nature of geometry and construction, not on whether Thomas Hobbes could successfully square a circle.

  There are plenty of philosophers of mathematics who couldn't do advanced math. If a philosopher argues that "Math is a language game," their inability to solve a differential equation doesn't refute the language game theory. So, on a purely logical level, calling it an *ad hominem* is a defensible move. You are protecting the *context of justification* from the *context of discovery*.

  ### 2. Why your friend is philosophically stronger (The Pragmatic Level)
  However, your friend (and Wallis) is hitting on something deeper than a simple personal attack. Here is why Hobbes's mathematical failures actually *do* damage his epistemology, specifically because of the kind of epistemology it is.

  **A. The "Paradigm Case" Problem**
  Hobbes isn't just making a general claim about knowledge; he is positing geometry as the **paradigm of certainty**. He argues that civil philosophy (politics) can be as certain as geometry *because* it shares the same method (construction/definition).
  *   **The Friend's Point:** If the paradigm case itself is shown to be messy, disputable, and prone to decades of unresolved error by a leading practitioner, it ceases to function as a stable foundation for the rest of the system.
  *   **The Implication:** If geometry—the one place Hobbes says we *can't* be wrong—is actually a site of endless, bitter, 25-year feuds where truth is determined by social consensus (the mathematical community) rather than solitary rational insight, then Hobbes's model for *political* certainty also cracks. If we can't agree on triangles, why should we agree on the Sovereign?

  **B. "Maker's Knowledge" and the Human Element**
  You mentioned *maker's knowledge* (often associated with the *verum factum* principle). Hobbes's claim is that we know geometry truly because *we make the definitions*.
  *   **The Problem:** Hobbes assumed that "making" the definitions guaranteed truth in the *application*. Wallis demonstrated that while we define the terms, the *reasoning* about them is a human, linguistic, and social practice subject to error, blindness, and stubbornness.
  *   **The Damage:** Hobbes's persistence in error (despite refutation) suggests that the "construction" method is not self-correcting in the way he claimed. He believed that if you followed the rational method, error would be impossible. His career proved that you can follow your own rational method and still be objectively wrong for 25 years. This undermines the claim that the method guarantees certainty.

  ### 3. The Better Framework: Solitary Reason vs. Social Practice
  The best way to resolve your debate is to look at what Jesseph (and modern historians of science) argue was actually at stake. It wasn't just "Is Hobbes bad at math?" It was **"Where does authority come from?"**

  *   **Hobbes's View:** Certainty comes from **Solitary Reason**. If I reason correctly from my definitions, I am right. If you disagree, you are irrational. (This mirrors his politics: The Sovereign decides truth to end dispute).
  *   **Wallis's View:** Certainty comes from **Community Consensus**. Math is certain because the community of mathematicians checks, refutes, and agrees on proofs. (This mirrors a more republican/parliamentary view of knowledge).

  **The Verdict:**
  Wallis's strategy was to show that Hobbes's "Solitary Reason" model produces absurdity (the squaring of the circle errors), whereas the "Community Consensus" model produces progress.

  So, your friend is right that this counts as evidence against Hobbes's epistemology, **not because Hobbes was stupid, but because his epistemology predicted that a rational man using the geometric method would not make persistent, uncorrectable errors.** The fact that he did suggests his model of how human reason works is flawed.

  ### 4. How to settle the bet
  You can concede to your friend without admitting it was a simple *ad hominem*. Here is the synthesis:

  1.  **It is not a genetic fallacy** because Hobbes's epistemology is *naturalistic*. He makes claims about what human beings can know and how human reasoning functions. His own reasoning is a data point in that naturalistic inquiry.
  2.  **The "Exemplar" Argument:** Hobbes offered himself and his method as the exemplar of philosophical certainty. When the exemplar fails repeatedly, it weakens the claim that the method produces certainty.
  3.  **The Political Stakes:** Wallis was right to link the math to the politics. Hobbes wanted a philosophy that ended dispute (like the Leviathan ends civil war). The feud proved that mathematical dispute is ineradicable. Therefore, a philosophy based on the elimination of dispute via "geometric certainty" is utopian in the negative sense.

  **Summary for your friend:** "Okay, you win. It's not that his math errors make his logic false, but his epistemology claims the geometric method prevents error. His errors prove the method doesn't prevent error. So the epistemology is empirically falsified by its own author."

  **Summary for yourself:** "But I'm right that a bad mathematician can still have good insights into the *nature* of knowledge. Hobbes was wrong about the practice, but his insight that we know best what we create (maker's knowledge) is still a powerful philosophical tool, even if he couldn't do the calculus."

  (Also, for the record, Hobbes's pamphlet title *"Marks of the Absurd Geometry, Rural Language, Scottish Church Politics and Barbarisms of John Wallis"* is arguably the greatest burn in the history of philosophy, regardless of the math.)
