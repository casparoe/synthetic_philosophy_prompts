      *   **Turn 4 (Friend B - Approval/anti-RCV):** Concedes the "binary preference" point. Distinguishes between GS manipulation (lying about ranking) vs. Approval thresholding (compressing rich preference). Argues RCV has "favorite betrayal" (burying favorite), whereas Approval just asks where to draw the line. Claims no "true approval ballot" exists to lie about.
          *   *Technical Check:* This is a sophisticated distinction. GS defines manipulation as reporting $P' \neq P$ to get a better outcome. In Approval, the ballot isn't a ranking, so you can't "lie" about the ranking in the same way. However, mechanism design usually maps ballots to outcomes. If the voter has von Neumann-Morgenstern utilities, there is an optimal strategy. Friend B is arguing about the *definition* of sincerity. She is right that RCV suffers from "favorite betrayal" (non-monotonicity/strategy where ranking A first hurts A). Approval does not have favorite betrayal in the same way (you never hurt your favorite by approving them), but you might hurt your favorite by *also* approving a compromise.
          *   *Verdict:* Good conceptual defense, but slightly dodges the fact that threshold selection is still strategic. The distinction between "lying about order" and "choosing a cutoff" is valid but doesn't fully exonerate Approval from strategic complexity.
