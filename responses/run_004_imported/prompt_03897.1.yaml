          *   *Technical Check:* GS theorem applies to social choice functions mapping *ordinal preference profiles* (strict rankings) to a single winner. It assumes universal domain (all possible rankings allowed). Approval Voting uses *cardinal* or *dichotomous* ballots, not strict rankings.
