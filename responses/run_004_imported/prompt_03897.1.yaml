      *   *Turn 4:* Friend B makes a good semantic point about "true ballot," but it's a bit of a motte-and-bailey. If I have A>B>C, my "true" state is utilities. Mapping utilities to a binary ballot *is* the mechanism where strategy enters. But she is right that RCV's "burying" is qualitatively different from Approval's "thresholding." +1.

      *   *Overall:* It's a draw, but Friend A has the stronger theoretical grounding on impossibility, while Friend B has the stronger grounding on the specific mechanics of the systems.

      *   *Wait, one correction:* Is Approval Strategy-Proof?
