  5.  **Refining the Scores and Nuance:**
      *   *Turn 1:* Friend A is wrong to say GS *proves* Approval is manipulable. GS assumes ordinal inputs. Approval is cardinal. *However*, the conclusion (Approval is manipulable) is true, just not via GS. Let's give -1.
      *   *Turn 2:* Friend B is right on GS scope. Wrong on Approval being strategy-proof for general preferences. Brams/Fishburn showed it's strategy-proof for *dichotomous* preferences. This is a crucial distinction. Let's give +1.
