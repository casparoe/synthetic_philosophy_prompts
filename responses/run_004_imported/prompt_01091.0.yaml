  Here is a concrete, non-arithmetic example built around a social/linguistic act, designed to trigger that specific Kripkean vertigo.

  ### The Example: "Counting Heads"

  **The Word/Act:** The verb **"to count"** (specifically, counting the number of people in a room).

  **The Setup:**
  For twenty years, your professor has started every lecture by scanning the room and "counting heads" to gauge attendance. She has done this thousands of times. In every single instance in her past, every person in the room was **facing forward** toward the podium. She never encountered a situation where someone was present but facing the wall.

  **The Skeptical Hypothesis:**
  The skeptic proposes that she never meant the standard rule for **Count** (*enumerate all biological humans*). Instead, she meant a deviant rule, **Count\***, which means: *enumerate all biological humans **who are facing the speaker**.*

  **The Breakdown Moment:**
  Today, she scans the room. Her gaze lands on a student sitting in the back row who is turned around, talking to a friend, facing the wall.
  *   If she meant **Count**, she includes the student.
  *   If she meant **Count\***, she excludes the student.

  Because her past usage (thousands of scans) is *perfectly consistent* with both rules (since everyone always faced forward before), there is no fact in her history that proves she meant one and not the other. As she opens her mouth to say the number, she realizes she doesn't know what number she *intends* to say. She doesn't know if "twenty" means "twenty humans" or "twenty attentive humans." The concept of quantity dissolves because the rule for applying the number is unmoored from her past intentions.

  ***

  ### Why This Produces the Same "Skeptical Itch" as Plus/Quus

  1.  **Finite Data vs. Infinite Projection:** Just like the addition case (where you've only added numbers up to a certain limit), she has only "counted" under a limited set of conditions (facing forward). The paradox shows that finite past behavior cannot logically determine infinite future application.
  2.  **Normativity, Not Description:** The problem isn't that she *forgot* the rule. It's that there is no **fact** about her mental state, her dispositions, or her brain chemistry that makes "facing forward" irrelevant. She might *feel* like she meant "all humans," but that feeling is just another mental event that could be interpreted as meaning "all humans *unless*..."
  3.  **The Collapse of Meaning:** In the *Plus/Quus* case, math stops working. In this case, **communication** stops working. If she can't be sure what "count" means, she can't report attendance, can't verify a quorum, and can't even be sure she's referring to the same reality as her students. It turns a mundane social gesture into a metaphysical crisis.

  **For the Scene:**
  Have her freeze mid-scan. Her eyes track the student facing the wall. She tries to summon the *feeling* of what "counting" is supposed to be, but realizes that feeling is compatible with excluding the student just as easily as including them. The number dies in her throat. She isn't just unsure of the number; she's unsure she knows what *numbers are for*.
