answer: |-
  This is a classic debate in the philosophy of biology, and your intuition is sharper than most. The confusion arises because biologists use the word "code" to describe two distinct processes that operate on different logical levels.

  To give you the precise criteria you want, we need to separate **The Genetic Code** (translation of nucleotides to amino acids) from **The Genetic Program** (development of genotype to phenotype).

  Here is the breakdown of the criteria used to determine when "code/information" is doing literal explanatory work versus when it is a heuristic metaphor, applied specifically to your two cases.

  ### The Three Criteria for "Literal Code"

  For a biological process to be literally described as a "code" in the software engineering sense (symbolic representation), it must satisfy three conditions:

  1.  **Arbitrariness (The Symbol Grounding):** The relationship between the symbol (input) and the referent (output) must be contingent, not determined by physical-chemical necessity. If A *must* cause B due to chemical affinity, it is a mechanism, not a code. If A causes B only because a system *agrees* that A means B, it is a code.
  2.  **Decoder Separation (The Von Neumann Architecture):** The storage medium (data) must be distinct from the processing machinery (hardware). The data must be passive until acted upon by an active decoder.
  3.  **Context Invariance:** The symbol must map to the same meaning regardless of where or when it is decoded. `0x41` is always 'A' in ASCII, whether it's in a text file or a network packet.

  ---

  ### Case 1: The Codon Table (DNA $\rightarrow$ Protein Sequence)
  **Verdict: Literal Code.**
  Your friend is right here. This fits your software definition almost perfectly.

  *   **Arbitrariness:** There is no chemical reason why the triplet `AUG` must bind to Methionine. It is a "frozen accident." We know this because scientists have successfully engineered cells with altered codon tables where `AUG` codes for something else, and the system still works. The mapping is conventional, not chemical.
  *   **Decoder Separation:** The mRNA is passive data. The ribosome + tRNA complex is the active hardware/decoder. The mRNA does not fold itself into a protein; it is *read* by the ribosome.
  *   **Context Invariance:** With very minor exceptions (mitochondria, some protozoa), `AUG` is Methionine in a bacteria, a human, or a plant. The meaning is invariant across the system.

  **Explanatory Work:** Calling this a "code" does real work here. It allows us to predict that mutating `AUG` to `UAG` will stop translation, regardless of the organism. It treats the sequence as syntactic information distinct from its chemical substrate.

  ---

  ### Case 2: "DNA contains the information for Eye Color/Organism"
  **Verdict: Metaphor / Heuristic.**
  Your skepticism is justified. When biologists say DNA contains the "code for a trait," they are borrowing the credibility of Case 1 to describe a process that fails the criteria above.

  *   **Arbitrariness (Failed):** The link between a gene and a trait is not arbitrary; it is the result of causal physical chains constrained by evolution. You can't just "reassign" a gene for melanin production to code for bone density. The mapping is constrained by biochemistry and physics, not convention.
  *   **Decoder Separation (Failed):** In development, there is no clean separation between data and hardware. The "decoder" (the cell cytoplasm, transcription factors, signaling molecules) is *itself* built by the products of the DNA. It is a recursive, self-building system, not a static CPU reading a ROM.
  *   **Context Invariance (Failed):** This is the biggest breaker. In software, a function returns the same output for the same input. In biology, a gene sequence does not have a fixed "meaning" (phenotypic outcome).
      *   *Example:* The *same* mutation in the *KIT* gene can cause white spotting in mice, anemia in humans, or cancer, depending on the genetic background and environmental context.
      *   If `0x41` sometimes meant 'A', sometimes 'B', and sometimes 'Delete File' depending on the temperature of the CPU, you wouldn't call it a code; you'd call it a chaotic variable.

  **Explanatory Work:** Here, "code" often *obscures* explanation rather than aiding it.
  *   **The Causal Parity Problem:** If you say "DNA has the information for the eye," you imply DNA is the *sole* or *primary* cause. But to build an eye, you also need: specific proteins, correct temperature, absence of toxins, cellular machinery to read the DNA, etc. Philosophically, DNA is just one cause among many necessary conditions. Privileging DNA as "the information" is a bias (often called "gene-centrism"), not a physical fact.
  *   **Blueprint vs. Recipe:** A blueprint (code) specifies the structure directly. DNA acts more like a **recipe** or a set of **constraints**. A recipe for a cake doesn't "contain" the cake; it contains instructions for a process that interacts with an oven (environment) to produce the cake. If you change the oven temperature, the same recipe yields a different result.

  ---

  ### The Precise Boundary: Translation vs. Development

  To settle your argument, you can draw the line at **The Central Dogma**.

  1.  **Inside the Central Dogma (DNA $\rightarrow$ RNA $\rightarrow$ Protein):**
      *   **Status:** Literal Information/Code.
      *   **Why:** The process is linear, the mapping is arbitrary/conventional, and the decoder is distinct.
      *   **Valid Claim:** "This DNA sequence encodes this amino acid sequence."

  2.  **Outside the Central Dogma (Protein $\rightarrow$ Cell $\rightarrow$ Tissue $\rightarrow$ Organism):**
      *   **Status:** Metaphorical Information/Code.
      *   **Why:** The process is non-linear, interactive, and context-dependent. The "meaning" of the DNA emerges from the interaction between the sequence and the cellular environment.
      *   **Invalid Claim:** "This DNA sequence encodes an eye."
      *   **Valid Claim:** "This DNA sequence produces proteins that, in the context of a developing vertebrate embryo, contribute to eye formation."

  ### Summary of Criteria for "Real Explanatory Work"

  When you hear "DNA is code/information," apply this test to see if it's rigorous or vibes-based:

  | Criterion | Literal Code (Codon Table) | Metaphorical Code (Traits/Organism) |
  | :--- | :--- | :--- |
  | **Mapping** | **Arbitrary/Conventional.** Could be otherwise. | **Causal/Physical.** Constrained by chemistry. |
  | **Mechanism** | **Decoder.** Distinct hardware reads passive data. | **Interaction.** Data and hardware build each other. |
  | **Context** | **Invariant.** Meaning stays the same. | **Dependent.** Meaning changes with environment. |
  | **Prediction** | **High.** Sequence predicts structure. | **Low.** Sequence alone cannot predict trait. |
  | **Utility** | **Explanatory.** Helps predict mutations. | **Heuristic.** Shorthand for complex causality. |

  ### The Bottom Line

  Your friend is correct that the **codon table** is a literal code by your software engineering definition. It is a symbolic mapping system with a decoder.

  You are correct that the claim **"DNA contains the information for a trait/organism"** is a metaphor. It relies on the literal truth of the codon table to smuggle in a deterministic view of development that doesn't exist. In software terms, it's like saying a specific library function "contains the code for the entire application," ignoring the OS, the hardware, the user input, and the other libraries it interacts with.

  **The Settlement:** DNA is a literal code for **polypeptides**, but it is a metaphorical code for **phenotypes**. Using "code" for the former is precise science; using "code" for the latter is useful shorthand that becomes misleading if taken literally.
