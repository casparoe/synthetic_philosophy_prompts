      *   **The Conflict/Challenge:** The sister pointed out that this honesty resembles a "Frankfurt Case" (moral responsibility without alternative possibilities). Classical moral theory (Principle of Alternative Possibilities - PAP) suggests no credit is due if one *couldn't* do otherwise. But intuitively, the mother *deserves* praise. The sister joked that ignoring this undermines the praise.
      *   **Constraints:** ~5 minutes speaking time (approx. 600-800 words). Do not turn it into a seminar. Do not claim she *could* have lied (it's untrue). Make the theme land for both audiences. Satisfy the philosopher-sister without alienating the relatives.
      *   **Tone:** Celebratory, honest, warm, intellectually respectful but accessible.

  2.  **Deconstruct the Philosophical Problem (for the writer's understanding):**
      *   *Principle of Alternative Possibilities (PAP):* An agent is morally responsible only if they could have done otherwise.
      *   *Frankfurt Cases:* Scenarios where an agent chooses X, but if they had chosen not-X, a mechanism (neurosurgeon, etc.) would have forced X. So, they couldn't have done otherwise, but we still hold them responsible/praiseworthy.
      *   *The Mother's Case:* Her "mechanism" is her character. She literally couldn't lie.
      *   *The Solution:* Shift the ground from "freedom of action" to "constitution of self." Praise not the *choice* in the moment, but the *building of the self* over a lifetime (or the grace of a nature that aligns with the good). For the philosophers: Acknowledge the PAP tension but resolve it by appealing to "deep self" compatibilism or virtue ethics (her will *was* the truth). For the general audience: Honesty as reliability, safety, and love.

  3.  **Drafting Strategy:**
      *   **Opening:** Acknowledge the loss, establish her role (librarian, mother).
      *   **The Core Trait:** Introduce her honesty. Use the "compass" metaphor provided in the prompt.
      *   **Addressing the Philosophers (Subtly):** Acknowledge the "could she have done otherwise?" question without using jargon like "Frankfurt Case" or "PAP." Frame it as a question of *nature* vs. *effort*.
      *   **The Resolution:** Argue that her inability to lie wasn't a limitation, but a form of freedom. She wasn't constrained by the truth; she was aligned with it. This satisfies the sister (it addresses the source of the action) and the relatives (it sounds like high praise).
      *   **Closing:** Bring it back to love and memory.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Thank everyone. Mention her job (librarian) – organizing truth, stories.
      *   *The Honesty:* Tell a small story or use the prompt's anecdote (faculty dinners, "alternative possibilities"). Keep it light.
      *   *The Philosophical Nod:* This is the tricky part. I need to say: "Some might say if you *can't* lie, you aren't brave for telling the truth."
      *   *The Turn:* But that's wrong. Her character *was* the choice. A compass doesn't struggle to point north; it just does. That makes it trustworthy.
      *   *For the Sister:* Implicitly argue that moral worth comes from the *source* of the action (her character), not the metaphysical possibility of doing otherwise.
      *   *For the Relatives:* Honesty = Safety. We knew where we stood with her.
      *   *Conclusion:* She is our true north.

  5.  **Refining the Tone:**
      *   Avoid academic jargon. No "counterfactuals," "interveners," or "compatibilism."
      *   Use metaphors: Compass, Library, North Star.
      *   Ensure it sounds spoken, not read.
      *   Check timing: 5 minutes is roughly 750 words at a moderate pace.

  6.  **Self-Correction during Drafting:**
      *   *Critique:* Is it too intellectual?
      *   *Fix:* Ground the philosophy in emotion. The "safety" of her honesty is more important than the "metaphysics."
      *   *Critique:* Did I satisfy the sister's specific point?
      *   *Fix:* I need to explicitly validate that she *couldn't* do otherwise, but reframe that inability as the highest form of integrity, not a lack of freedom. The prompt says the sister wants the eulogy to be "entitled to the praise." I need to claim the praise is valid *because* of her nature, not *despite* it.

  7.  **Final Polish:**
