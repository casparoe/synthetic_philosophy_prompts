answer: |-
  Thank you all for being here. For those who knew my mother only as the school librarian who could find any book, fix any spine, and quiet any hallway with a single look: thank you for loving her. For those who knew her as a wife, a mother, and the woman who kept our family from drifting into chaos: thank you for sustaining her.

  My mother spent her life in the company of stories. But if there was one thing she valued more than a good story, it was a true one.

  We often talk about honesty as a battle. We imagine a person standing on a precipice, tempted to lie, wrestling with their conscience, and choosing the hard right over the easy wrong. We praise that person for their strength.

  My mother was not that person.

  As my father's colleagues know well, after forty years of faculty dinners, Mom did not wrestle with the truth. She didn't weigh the costs. She didn't calculate the benefit of a white lie. She was honest the way a compass is honest. A compass does not struggle to point North; it does not consider pointing East and bravely decide against it. It simply points North. That is its nature.

  I know there are a few people here—perhaps including my sister, who is finishing her doctorate in philosophy—who might argue that if you *cannot* do otherwise, you deserve no credit for what you do. If she was incapable of lying, they might say, then telling the truth wasn't a virtue. It was just mechanics.

  But I stand here to say that this view misunderstands the nature of love, and it misunderstands my mother.

  To say she "couldn't" lie is not to say she was constrained. It is to say that her character was so perfectly integrated, so wholly aligned with what is good, that the possibility of falsehood simply did not exist in her orbit. There was no internal negotiator. There was no shadow self waiting for a chance to deceive.

  In a world that is often ambiguous, where people say one thing and mean another, where promises are hedged and truths are spun, my mother was a fixed point. We never had to wonder where we stood with her. We never had to decode her silence. We never had to fear that her affection was conditional on our performance.

  For the philosophers in the room: You might say she lacked alternative possibilities. But I suggest to you that her will was so perfectly one with the good that the "alternative" was not a possibility she rejected, but a reality she transcended. That is not a lack of freedom. That is the highest form of integrity. It is the difference between a bridge that holds because it is guarded, and a bridge that holds because it is built of stone.

  For everyone else: It meant we were safe.

  She was a librarian. She understood that books are where we go to find out who we are. But she taught us that people are the stories that matter most. And she taught us that a life without falsehood is a life without fear.

  When she told us she loved us, it was a law of nature. When she told us she was proud, it was a fact. When she told us the truth, even when it was hard, it was a gift.

  So, to my sister, and to my father's friends who are turning this over in their minds: Do not withhold the praise. We praise the compass not because it chose North, but because it allows us to navigate the storm. We praise the light not because it defeated the darkness, but because it does not know how to flicker.

  My mother could not lie. And because of that, we could always trust her. In the end, there is no higher eulogy than to say of someone: What they said was true, because who they were was true.

  She is our True North. And we will find our way by her memory for as long as we live.

  Thank you.
