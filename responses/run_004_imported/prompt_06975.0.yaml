      *   **Sleeping Beauty Problem:** Beauty sleeps. Coin flip. Heads = 1 awakening (Mon). Tails = 2 awakenings (Mon, Tue). Memory wipe. Upon awakening, what is her credence that the coin landed Heads?
      *   **Halfer (1/2):** No new evidence upon waking. Prior was 1/2. Should remain 1/2.
      *   **Thirder (1/3):** Three possible awakening scenarios (H-Mon, T-Mon, T-Tue). Indifference suggests 1/3 each. Or long-run frequency argument.
      *   **SIA (Self-Indication Assumption):** Given that you exist, you should favor hypotheses where more observers exist. This strongly supports Thirding (Tails has 2 observers, Heads has 1).
      *   **Presumptuous Philosopher:** SIA implies we should be extremely confident the universe is huge (infinite observers) because that makes *my* existence more likely. This is often seen as a *reductio ad absurdum* of SIA.
      *   **Doomsday Argument:** Based on Self-Sampling Assumption (SSA). Suggests we are likely typical observers, so if we are early in human history, humanity won't last long. SIA is often seen as the "antidote" to Doomsday, but the relationship is complex.
      *   **Dutch Book:** If Beauty bets 1:1 on Heads every awakening, she loses money in the long run on Tails. Does this mean her *credence* is 1/3, or just that the *betting setup* is skewed?

