      *Decision:* I will argue that **Penal Substitution, strictly defined as the transfer of retributive punishment, is conceptually incoherent.** The debt analogy fails precisely because moral guilt is not a fungible commodity. The doctrine can only be saved by redefining it as *Vicarious Satisfaction* (Anselmian) or by positing a metaphysical union that makes Christ and the elect *one agent* (which dissolves the substitution aspect). I will defend the incoherence of the strict view.

