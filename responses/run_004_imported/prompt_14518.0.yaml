      *   *Why?* Because information gives you options. You can always choose to ignore the new information and do what you would have done anyway. If the information suggests a *better* action, you switch. If it suggests the *same* action, you stay. You never *have* to switch to a worse action.
      *   *Analogy:* Imagine you're about to buy a car. Someone offers to tell you the mechanic's report for free.
          *   Scenario A: Report says "Great car." You buy it (same as before). Utility = Same.
          *   Scenario B: Report says "Lemon." You don't buy it. Utility = Better (saved money/headache).
          *   Average: You're at least as well off, usually better.
      *   *Key mechanism:* Information expands the set of contingent plans available to the agent.

  3.  **Identify the Breaking Points (Assumptions vs. Reality):**
      *   Good's Theorem relies on specific, strict assumptions. Where do they fail in medical/genetic testing?
      *   *Assumption 1: The agent is a perfect Bayesian updater.*
          *   Reality: Humans aren't perfect calculators. We suffer from anxiety, misinterpretation, and cognitive bias.
      *   *Assumption 2: Utility depends only on outcomes.*
