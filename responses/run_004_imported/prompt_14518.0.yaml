      *   *Point 2: Actionability.* If there are no good actions to take based on the info, the "optionality" value drops. (Though with BRCA, there *are* actions, so this is nuanced).
      *   *Point 3: Psychological Costs.* The "cost" isn't zero. Anxiety is a cost.
      *   *Point 4: Identity/Self-Concept.* Knowing changes who you are (a "previvor").

