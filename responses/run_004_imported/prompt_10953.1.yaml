      *   Wait, there's a specific nuance: The User *set* the odds. This is key. The User was the Market Maker. The Officemate was the Taker. In market microstructure, if the Taker snaps up the offer immediately, the Market Maker worries they priced it wrong.
      *   So, the User should definitely update.
