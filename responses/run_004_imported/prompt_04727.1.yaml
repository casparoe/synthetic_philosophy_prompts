      *   *Objection:* It's just pattern matching (Perception).
      *   *Nyāya Reply:* Pattern matching gives you "Object X matches Cow-traits." Config file gives you "Gavaya = Cow-like." The *instantiation* of the class label onto the object, establishing the schema for future objects, is a distinct logical operation. It's the "type inference" engine.
      *   Actually, a better analogy might be **Pointer Aliasing** or **Schema Mapping**.
      *   Let's try **Variable Binding**.
          *   Perception: `val x = readSensor()`
          *   Testimony: `// "gavaya" refers to things like cows`
          *   Upamāna: `if (x resembles Cow) { bind("gavaya", x) }` -> Now "gavaya" is a valid type in your namespace.

  7.  **Addressing the Specific "Class" Point:**
      *   The text emphasizes the "general notion" (class).
      *   Perception is always particular (this cow, here, now).
      *   You cannot perceive "all future gavyas."
      *   But *upamāna* gives you the rule: "Anything sharing this similarity falls under this name."
      *   This moves from *particular* to *universal* (in a practical sense).

  8.  **Structure of the Response:**
