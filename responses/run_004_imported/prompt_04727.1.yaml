      *   **The Core Dispute:** Define the stakes (Reductionism vs. Distinct Cognitive Operation).
      *   **Deconstruct the Reply:** Break down the "Name vs. Class" argument.
      *   **The "Gap" Analysis:** Why Perception + Testimony isn't enough (The Particular vs. Universal problem).
      *   **SE Analogy:** Use the "Type System/Schema" analogy to make it click.
      *   **Summary:** Wrap up the epistemological significance.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Caution:* Don't get bogged down in later Nyāya developments (like Udayana). Stick to the Vidyabhusana translation provided.
      *   *Clarification:* Make sure to distinguish between knowing the *object* and knowing the *name-object relation*. The text says "how does the name... signify". It's about semantics/reference.
      *   *Tone:* Keep it respectful of the text's rigor but accessible.
      *   *Check:* Did I answer why perception + testimony fails? Yes, because perception is particular and testimony is just verbal without the grounding link.

  10. **Final Polish:** Ensure the distinction between "knowing the animal" (Perception) and "knowing the word applies to the class" (Upamāna) is crystal clear. (This is the crux).

