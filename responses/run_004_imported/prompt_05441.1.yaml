      *   **Point 5: The Nuance of Choice:** Sor Juana knows women have limited options. She wouldn't condemn the sister for choosing safety, but she would condemn the *lie* that it's purely empowering if it relies on male validation.
      *   **Conclusion:** Bring it back to the user. How to talk to the sister using this lens.

