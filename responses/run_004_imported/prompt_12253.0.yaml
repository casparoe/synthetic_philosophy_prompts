answer: |-
  This is an exceptionally sharp worry. You have identified what is arguably the most critical pressure point in Shoemaker's "subset view" of realization, particularly as developed in his later work like *Physical Realization* (2007). The objection is essentially this: **If the mental property is defined by a specific subset of causal powers that must remain constant across diverse physical realizers, isn't that subset just a functional role in disguise?** If so, Shoemaker hasn't escaped the dilemma of functionalism (which Kim argues is vulnerable to exclusion if the role is second-order, or collapses into identity if the role is first-order).

  To defend Shoemaker rigorously, we must distinguish his "causal powers" ontology from the "causal role" ontology of standard functionalism, and we must lean heavily on his **determinable/determinate** model of realization.

  Here is the argument for why Shoemaker's strategy survives the multiple realizability (MR) worry without collapsing into functionalism or type-identity.

  ### 1. The Category Mistake: Powers vs. Roles

  The core of the collapse objection rests on conflating *causal powers* with *causal roles*.

  **Standard Functionalism (Armstrong/Lewis):** Defines a mental property $M$ as "the property that plays causal role $R$." Role $R$ is defined relationally by inputs (stimuli), outputs (behavior), and relations to other mental states. On this view, $M$ is a **second-order property**: it is the property of *having some property or other* that stands in relation $R$.

  **Shoemaker's View:** Defines a property by its **intrinsic causal powers**. A causal power is not a relation between events; it is a *potentiality* contributed to the bearer of the property.
  *   **The Distinction:** For the functionalist, $M$ is defined by the *pattern* of causation (the "job description"). For Shoemaker, $M$ is defined by the *contribution* it makes to the object's potential to cause things.

  **Why this blocks the collapse:**
  When you worry that we must "specify the subset in advance," you are assuming we need a functional description (a job description) to pick out that subset. Shoemaker argues we do not. We pick out the subset by identifying the **common causal contribution** made by different realizers.

  Consider the property of **fragility**. A glass vase and a cheap plastic cup are both fragile. They are realized by different molecular structures.
  *   **Functionalist:** "Fragility" = The property that causes breaking when struck.
  *   **Shoemaker:** "Fragility" = A specific power to break under stress.
  The molecular structure of the glass confers a vast array of powers (refracting light, conducting heat, etc.). The molecular structure of the plastic confers a different vast array. The *intersection* of these power sets includes the power to shatter under impact. That intersection *is* the fragility.

  We did not define fragility by a functional input-output map ("if struck, then break"). We defined it by a specific **vector of causal influence**. The fact that this vector *results* in a functional pattern is a consequence, not the definition. Therefore, specifying the subset does not require a functional definition; it requires identifying the **overlap in causal potentialities**.

  ### 2. The Determinable/Determinate Model

  Shoemaker's strongest metaphysical tool against your objection is the analogy of **determinables and determinates** (e.g., *Red* vs. *Scarlet*).

  *   **Scarlet** is a determinate of **Red**.
  *   The causal powers of *Scarlet* are a **superset** of the causal powers of *Red*.
  *   *Red* inherits a **subset** of *Scarlet*'s powers.

  If an object is Scarlet, it is automatically Red. There are not two properties causing the object to look red; there is one property (Scarlet) whose powers include the powers of Red. This solves Kim's exclusion problem immediately: there is no competition because the mental property (determinable) and physical property (determinate) are not distinct competitors. The mental property's causation is *constituted* by the physical property's causation.

  **Addressing the MR Worry:**
  Your worry is: "How can *Pain* be the determinable if the determinates (C-fibers, silicon states) are so different? What is the 'Redness' equivalent for Pain?"

  **The Defense:**
  The "common denominator" (the determinable) is not specified by a functional *description* (e.g., "causes wincing"). It is specified by the **causal essence** shared by the realizers.
  Shoemaker argues that properties are individuated by their causal powers. If Human C-fibers and Octopus X-fibers both confer the *exact same* power to guide behavior away from damage, then they share a causal power. That shared power *is* the mental property.

  This does not collapse into functionalism because:
  1.  **Functionalism** says $M$ is the property of *having some realizer that plays role $R$*.
  2.  **Shoemaker** says $M$ is a **first-order property** that *is* the cluster of powers $P$.

  For Shoemaker, the mental property is not second-order. It is a genuine property in its own right, which happens to be realized by physical properties. The "subset" is not defined by a relation to inputs/outputs (functionalism), but by the **intrinsic nature of the contribution** the property makes to the bearer.

  ### 3. The "Specification" Objection: A Posteriori vs. A Priori

  Your nagging worry is: *"I can't see how you'd specify that fixed, realizer-independent subset in advance... without quietly falling back on a functional definition."*

  This is the crux. The Shoemakerian reply is: **We don't need to specify it *in advance* (a priori).**

  Functionalism often tries to provide an *a priori* analysis of mental concepts (e.g., "Pain is whatever causes avoidance"). Shoemaker's metaphysics is **a posteriori**. We discover which subset of powers constitutes "Pain" by investigating the world.
  *   We observe that C-fiber firing causes avoidance.
  *   We observe that Silicon State S causes avoidance.
  *   We analyze the causal powers of both.
  *   We discover they share a specific subset of powers regarding *information-sensitive guidance of the organism*.

  That shared subset *is* Pain. We didn't define Pain functionally and then go look for it. We found a causal power cluster in nature and identified it as Pain.

  **Why this isn't Type-Identity:**
  Type-identity theory says Pain *just is* C-fiber firing (or a disjunction thereof).
  Shoemaker says Pain is the **determinable property** instantiated *by* C-fiber firing.
  *   **Identity Theory:** $M = P$.
  *   **Shoemaker:** $M$ is realized by $P$ because $P$'s powers $\supset$ $M$'s powers.

  This distinction matters for MR. If Pain = C-fibers, then Octopuses don't feel pain (or Pain is a disjunctive mess). If Pain = The Determinable, then Octopuses feel pain because their physical state instantiates the *same determinable property* via a different determinate. The "type" is preserved not by physical identity, but by **causal power identity**.

  ### 4. Avoiding the "Triviality" Trap

  A strong version of your objection (pressed by critics like Brian McLaughlin) is: "If you strip away the functional role, what is left in the subset? If it's too specific, it won't be multiply realizable. If it's too general (e.g., 'causes something'), it's trivial."

  **Shoemaker's Rigorous Reply:**
  The subset is neither trivial nor hyper-specific. It is defined by the **causal profile** relevant to the *persistence and flourishing* of the system.
  Mental properties are not just any properties; they are properties involved in the **rational guidance of behavior**.
  *   The "subset" for Pain includes the power to demand attention, to motivate avoidance, and to be the subject of belief.
  *   Crucially, these are defined as **powers**, not **events**.
      *   Functionalism: "Pain causes wincing." (Event causation)
      *   Shoemaker: "Pain confers the *power* to cause wincing *if* the system is not overridden." (Property causation)

  This modal flexibility allows for MR. A human winces; an octopus retracts a tentacle; a robot halts its arm. The *output* differs (saving functionalism from needing identical outputs), but the **causal power** (the capacity to interrupt ongoing processing and prioritize damage avoidance) is identical.

  By focusing on the *capacity* rather than the *manifestation*, Shoemaker secures a stable subset across realizers without resorting to a rigid input-output functional definition.

  ### 5. Conclusion: Why the Collapse Fails

  To summarize the defense against your specific worry:

  1.  **Not Functionalism:** Functionalism defines properties by their *relations* (roles). Shoemaker defines them by their *intrinsic potentialities* (powers). The "subset" is a cluster of potentialities, not a relational job description. This makes mental properties **first-order** properties, avoiding the epiphenomenalism charge often leveled at second-order functionalism.
  2.  **Not Type-Identity:** The mental property is not identical to the physical realizer. It is a **determinable** whose identity conditions are looser than the physical **determinate**. This allows distinct physical types to realize the same mental type without the mental type being a disjunction.
  3.  **Not A Priori Specification:** We do not need to specify the subset "in advance" via analysis. We identify the subset empirically by finding the causal overlap between realizers. The unity of the mental kind is grounded in the **similarity of causal powers**, not the similarity of physical structure or a functional definition.

  **The Verdict:**
  Your friend the neuroscientist is right that neurons obey physics. Kim is right that if mental causes are *extra* causes, they are excluded. But Shoemaker shows that mental causes need not be *extra*. They are the **coarse-grained description of the very same causal transaction** that the physical realizer performs.

  The "subset" is not a functional mask; it is the **causal essence** of the mental property. As long as different physical systems can confer the *same causal potentialities* (even if they manifest them differently), the subset view holds. It survives the MR worry because it grounds the unity of mental kinds in **causal power identity**, which is metaphysically deeper and more flexible than functional role identity.

  You haven't missed an obvious reply; you've identified the exact tension Shoemaker spends 200 pages resolving. But the resolution holds: by shifting from *roles* to *powers*, and from *second-order* to *determinable* properties, Shoemaker carves out a space for mental causation that is physically grounded but not functionally reduced.
