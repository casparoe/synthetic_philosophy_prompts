answer: |-
  **Title:** The Gap in the Pump: Why Forcing Arguments Fail to Close Preferential Gaps

  **To:** Graduate Seminar on Dynamic Choice
  **From:** [Your Name/Persona]
  **Re:** The Completeness Money Pump and the Resolute Defense

  The standard money-pump argument for transitivity is a blunt instrument. It tells a story of a cyclic agent who, through a series of pairwise swaps, ends up poorer and back where they started. The lesson is usually taken to be that static consistency constraints are merely the shadow cast by dynamic rationality. But as you've noticed, the argument for *completeness* is more subtle, and Johan Gustafsson's recent "forcing" money-pump argument is the sharpest iteration of this threat yet. It aims to show that an agent with a genuine preferential gap—a state distinct from indifference, à la Ruth Chang's lawyer and clarinetist—is not merely *permitted* to be pumped, but *required* to be, unless they adopt a diachronic strategy that Gustafsson deems irrational.

  Your student's citation of Elliott Thornley is apt. Thornley, drawing on the AI safety literature's interest in coherent agents, suggests a "Blocker" policy: refuse any trade that is part of a dominated sequence. But your gut instinct—that this smuggles completeness back in through the back door of memory—is worth interrogating. Does the defense save incompleteness, or does it merely relocate the requirement for completeness from preferences to policies?

  I will argue that Gustafsson's forcing argument fails to establish that rational preferences must be complete. It succeeds only in establishing that rational *choice functions over sequences* must be complete. This is a significant distinction. It preserves the ontological reality of preferential gaps while demanding a more sophisticated theory of diachronic agency than Gustafsson allows. The money pump does not kill incompleteness; it kills myopic agency.

  ### The Forcing Argument: Permissions as Traps

  To see the force of Gustafsson's argument, we must move beyond the naive idea that a money pump merely exploits *permitted* trades. If an agent with a gap between $A$ and $B$ is merely *permitted* to trade $A$ for $B$ (and vice versa), they could simply adopt a policy of "stay put." Gustafsson's innovation is to argue that under plausible dynamic norms, the agent is *required* to trade, making the "stay put" policy irrational.

  Consider the standard setup for a completeness pump. You hold option $A$. You are offered $B$ for a small cost $\epsilon$. Since there is a preferential gap between $A$ and $B$, you are not required to keep $A$, nor are you required to take $B$. You are permitted to do either. However, Gustafsson invokes a principle of *Dynamic Consistency* combined with *Dominance*.

  The argument runs as follows:
  1.  **Ex Ante Evaluation:** Before the sequence begins, the agent can evaluate the available *strategies*. Strategy $S_1$ is "Keep $A$." Strategy $S_2$ is "Trade to $B$, then trade back to $A$." (Assume a setup where the cycle is forced by sweetenings, e.g., $B^+ \succ A$ and $A^+ \succ B$, creating a ladder).
  2.  **The Forcing Move:** Gustafsson argues that if the agent acknowledges the gap, they must acknowledge that at the node where $A$ is traded for $B$, the choice is rationally permissible. If a choice is permissible, and it is a necessary step in a sequence that dominates the alternative sequence, rationality requires taking it.
  3.  **The Separability Constraint:** The crux of Gustafsson's case is the *Separability* condition (often associated with Machina or Hammond). This condition states that the rationality of a choice at a node depends only on the future consequences available from that node, not on how the agent arrived there. If Separability holds, the agent cannot use the history of the choice ("I already turned down a similar trade") to justify a current decision.

  If Separability is binding, the agent at the second node faces a choice between $B$ and $A-\epsilon$. If the gap persists, the trade is permitted. If the trade is permitted and leads to a strictly better outcome (in the pump's specific construction involving sweetened options), Gustafsson claims the agent is *forced* to take it. To refuse the trade is to treat the gap as a strict preference ($A \succ B$), which contradicts the assumption of incompleteness. Thus, the agent is trapped: acknowledge the gap and get pumped, or deny the gap and be complete.

  ### The Resolute Defense: Policies Over Nodes

  The defense, championed by Rabinowicz and refined by Thornley, rejects the Separability constraint that Gustafsson takes for granted. This is not a minor technical adjustment; it is a fundamental disagreement about the nature of rational agency over time.

  Thornley's "Blocker" argument posits that a rational agent chooses *policies*, not just local actions. A policy is a complete plan of action for the decision tree. If an agent has a preferential gap between $A$ and $B$, they may still have a strict preference between the *history* of ending up with $A$ via a trade versus ending up with $A$ by holding.
  Specifically, Thornley argues for a *Dominance over Policies* principle. If Policy $P_1$ (Trade $A \to B$, then $B \to A$) yields outcome $O_1$ and Policy $P_2$ (Keep $A$) yields outcome $O_2$, and $O_2$ dominates $O_1$ (e.g., $O_2$ is $A$, $O_1$ is $A$ minus money), the agent is required to adopt $P_2$.

  Gustafsson objects that this violates Separability. At the second node, looking forward, the trade might look permissible. Thornley and Rabinowicz reply that this is the error of *myopia*. A resolute agent identifies with their ex ante plan. They do not re-evaluate the rationality of the trade in isolation; they evaluate it as the execution of a chosen strategy.

  Your student's intuition—that this smuggles completeness back in—is partially correct but ultimately misdirected. Yes, the choice *over policies* must be complete. The agent must strictly prefer the "No-Trade Policy" to the "Trade Policy." But this does not imply that the preference *over outcomes* ($A$ vs. $B$) is complete. The agent can maintain that $A$ and $B$ are incomparable in value, while simultaneously maintaining that "Keeping $A$" is strictly better than "Swapping $A$ for $B$ and back."

  The completeness is located in the *diachronic choice function*, not the *synchronic preference relation*. Gustafsson's argument assumes these must align. The resolute defense denies this. It claims that rationality imposes structure on how we navigate gaps, not that the gaps themselves do not exist.

  ### The Verdict: Why the Defense Wins

  So, who wins? I submit that the defense wins, but the victory comes with a price that your seminar should scrutinize. Gustafsson's argument fails to prove that preferences must be complete because it relies on a question-begging conception of dynamic rationality.

  Gustafsson's forcing argument works only if we accept *Sequential Choice* models that enforce Separability. But Separability is precisely what is at issue when we discuss agents with incomplete preferences. An agent with a genuine preferential gap lacks a scalar value function to maximize at each node. To expect them to behave *as if* they have one (by adhering to Separability) is to demand they solve the incompleteness problem locally, which they cannot do by definition.

  The resolute choice model provides a coherent alternative. It allows the agent to say: "I do not know if $A$ is better than $B$. But I do know that losing money for no gain is worse. Therefore, I will adopt a policy that prevents me from making trades that exploit my uncertainty." This is not ad hoc; it is an application of instrumental rationality. The agent uses their one clear strict preference (money is good, loss is bad) to protect themselves in domains where their preferences are silent.

  However, your gut feeling about "smuggling" is not entirely wrong. It points to the *cost* of the victory. For the resolute defense to work, the agent must have a robust capacity for *pre-commitment without binding technology*. They must be able to bind their future self simply by the force of their past resolution. In the AI safety context (where Thornley operates), this is plausible: you can hard-code the policy. In human agents, this is psychologically and normatively demanding. It requires a theory of *agency* where the self is a temporally extended entity capable of overriding local permissions.

  If your students find this "magical," they are channeling the standard critique of resolute choice (e.g., from McClennen). But "magic" is in the eye of the beholder. Is it more magical to believe an agent can bind their future self by resolution, or to believe that an agent with no preference between $A$ and $B$ is nevertheless *required* to trade $A$ for $B$ simply because a bookie is watching? The latter seems to violate the very definition of a gap. If I am *required* to choose $B$ over $A$, then $B \succeq A$. If the money pump forces this requirement, it forces completeness by fiat, not by discovery.

  Therefore, the money pump argument for completeness fails. It demonstrates that *incomplete agents must be resolute*, not that *rational agents must be complete*.

  ### Conclusion for the Seminar

  When you return to your students, steer them away from the question "Does the pump prove completeness?" and toward "What kind of diachronic agency is required to sustain incompleteness?"

  Gustafsson is right that a naive agent with gaps will be pumped. Thornley and Rabinowicz are right that a sophisticated agent can block the pump without filling the gaps. The existence of the pump does not vindicate the completeness axiom; it vindicates the necessity of resolute choice for non-standard agents.

  The preference relation can remain incomplete. $A$ and $B$ can remain incomparable. But the *choice function* over the decision tree must be complete. This preserves the core insight of the incompleteness theorists (like Chang) that value itself can be heterogeneous and non-rankable, while satisfying the dynamic consistency requirements that Gustafsson rightly identifies as necessary for survival.

  The money pump does not show that gaps are irrational. It shows that gaps are expensive to maintain. You need a resolute will to keep them. If your students walk away thinking that rationality demands a complete ordering of outcomes, they have missed the point. Rationality demands a complete ordering of *actions*, and sometimes, the only way to respect the incompleteness of value is to strictly forbid the actions that would exploit it.

  **Verdict:** The Defense wins. Incompleteness is compatible with dynamic rationality, provided we reject Separability in favor of Resolute Choice. The pump kills the myopic agent, not the gapped preference.
