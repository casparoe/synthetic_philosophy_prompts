answer: |-
  **MEMORANDUM**

  **TO:** The Honorary Degrees Committee
  **FROM:** [Your Name/Committee Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Nomination of Air Vice-Marshal Gerald Whitfield

  **Recommendation**
  After careful deliberation, I recommend that the Committee **decline** to confer an honorary degree upon Air Vice-Marshal Gerald Whitfield at this time.

  This recommendation is not made lightly. It does not deny the Air Vice-Marshal's post-war contributions, nor does it seek to adjudicate the military necessity of the Second World War. Rather, it rests on the specific nature of an *honorary* degree as a moral statement by the University, and the philosophical weight of the objection raised regarding the Area Bombing Directive. To proceed with the award would require us to dismiss a fundamental ethical argument regarding the intentional targeting of non-combatants—an argument that strikes at the core of the values this University claims to uphold.

  **The Case for Conferment: A Steel-Manned Defense**
  Before articulating why I must dissent, it is incumbent upon me to acknowledge the strength of the arguments in favor of this nomination. To dismiss them as mere apologia would be intellectually dishonest.

  The strongest case for Air Vice-Marshal Whitfield rests on two pillars: the *Argument from Necessity* and the *Argument from Redemption*.

  First, the *Argument from Necessity* posits that moral judgments rendered in peacetime cannot fairly apply to the existential crisis of 1942. At that juncture, the United Kingdom faced the prospect of a total victory by a regime whose ideology was predicated on subjugation and genocide. The Area Bombing Directive was not a rogue operation but lawful state policy, deemed by the wartime government as the only available mechanism to degrade enemy industrial capacity and morale sufficiently to avert a costlier invasion or a prolonged conflict. From a utilitarian perspective, if Whitfield's actions contributed to a surrender that saved more lives than it cost, the moral calculus favors the action. To condemn Whitfield is to condemn the strategy that preserved British sovereignty; it risks a kind of moral presentism that ignores the "supreme emergency" context in which he operated. He was an instrument of state survival, obeying lawful orders within a chain of command where refusal would have been tantamount to dereliction of duty without altering the policy itself.

  Second, the *Argument from Redemption* suggests that a human life cannot be reduced to a single chapter. Whitfield did not retire into obscurity; he dedicated forty subsequent years to an aviation-safety foundation. If his wartime role involved the destruction of life, his post-war role involved its preservation. To deny him this honor is to assert that the moral debt of 1942 is infinite and cannot be offset by decades of beneficence. It implies that the University believes in a form of original sin that no amount of subsequent good work can expiate. If the purpose of an honorary degree is to recognize a life of significant contribution to human welfare, Whitfield's forty-year safety record is an objective fact that stands regardless of his uniform.

  **The Anscombe Objection: Why Necessity and Redemption Are Insufficient**
  Despite the strength of these arguments, I find myself compelled by the reasoning Elizabeth Anscombe articulated in her 1956 protest against Oxford's decision to honor Harry Truman. Her argument is not utilitarian; it is deontological. It does not ask *what was achieved*, but *what was done*.

  Anscombe's core proposition is that the intentional killing of the innocent is intrinsically evil, regardless of the consequences. In the case of the Area Bombing Directive, the destruction of civilian morale was not a side effect; it was the *means*. The directive explicitly targeted cities to terrorize the population into submission. Anscombe argues that when we make the murder of innocents a tool of policy, we corrupt the moral language of the society that employs it.

  To this, the "Necessity" defense replies that the stakes were too high for absolutes. However, the University is not the War Cabinet. Our function is not to win wars but to pursue truth and ethical clarity. If we confer an honorary degree, we are not merely acknowledging a biography; we are endorsing a moral exemplar. By honoring Whitfield, we signal that the intentional targeting of civilians is a permissible blemish on a record of honor, provided the victors deem it necessary. We risk validating the principle that "military necessity" can suspend moral law—a principle that, if generalized, undermines the very human rights frameworks we now teach and defend.

  Furthermore, the "Redemption" argument, while humane, conflates *forgiveness* with *honor*. We may, as a society, forgive Whitfield for doing what his country asked of him in a time of total war. We may acknowledge his post-war good works with a private commendation or a donation in his name. But an honorary degree is a public ritual of affiliation. It says, "This person represents us." Anscombe's point was that some acts create a moral discontinuity that prevents such affiliation. If the University stands for the protection of human dignity, it cannot simultaneously honor a commander whose primary historical footprint involves the systematic negation of that dignity for a strategic end, however justified that end may have seemed at the time.

  **Conclusion**
  I recognize that this recommendation will be painful. It denies recognition to a 96-year-old man for his later good works, and it may appear to disregard the sacrifices of the "Greatest Generation." However, the integrity of an honorary degree lies in its selectivity. If we cannot say "no" when the candidate's record involves the explicit targeting of civilian populations, then the degree ceases to be a mark of ethical distinction and becomes merely a medal for longevity or utility.

  We can acknowledge Whitfield's post-war contributions without sanctifying his wartime command. We can respect the difficulty of his position without endorsing the doctrine he executed. In light of Anscombe's argument—that the means define the moral character of the act regardless of the ends—I believe the University cannot, in good conscience, proceed with this award.

  I urge the Committee to decline the nomination.
