  ### Move-by-Move Adjudication

  **Move 1 (Uncle): -2**
  This is a significant oversimplification. Aquinas never argues that killing a tyrant is justified "period." He places heavy restrictions on who may act and under what circumstances. While he acknowledges that tyranny is evil, he does not grant a blanket moral license for assassination, making this claim textually inaccurate.

  **Move 2 (Mom): 2**
  This is the strongest interpretation of the text. Aquinas distinguishes between a tyrant by exercise (legitimate title, bad rule) and a tyrant by usurpation (no title). Even regarding usurpers, he insists that deposition must be a public act, not the deed of private individuals, to avoid the sin of sedition.

  **Move 3 (Uncle): -1**
  While the uncle is likely factually correct that the dictator was a usurper, he is wrong that this automatically satisfies Aquinas's conditions. For Aquinas, the lack of legitimate title makes removal easier, but it does not authorize *private* individuals to execute the ruler; the distinction helps, but it doesn't win the argument alone.

  **Move 4 (Mom): 2**
  This accurately captures Aquinas's primary fear: that allowing private tyrannicide destabilizes the political order more than the tyranny itself. In the *Summa*, he argues that without public authority, anyone claiming a ruler is a tyrant could justify murder, leading to chaos.

  **Move 5 (Uncle): 0**
  This is a pragmatic critique rather than a textual interpretation. The uncle is right that Aquinas's theory struggles in totalitarian states where "public authority" has been obliterated. However, Aquinas would not accept a resistance cell as a substitute for public authority; he would likely counsel patience or prayer, so the uncle is practically insightful but textually unsupported.

  **Move 6 (Mom): 2**
  This is a direct hit on *De Regimine Principum*. Aquinas explicitly warns that killing a tyrant often leads to greater fear and a worse successor. Since the uncle offered no counter-argument to this consequentialist worry, the mom scored a decisive point here.

  ### What Both of You Are Missing

  There are two crucial elements of Aquinas's framework that didn't make it to the dinner table. First, **Divine Providence:** When Aquinas reaches the limit of human remedies (i.e., no higher authority exists to depose the tyrant and the community cannot act without greater danger), he ultimately punts to God. He suggests that in extreme cases where no human recourse is possible, one must pray for God to remove the tyrant or soften his heart, rather than take violent action.

  Second, the **Definition of Sedition:** Aquinas defines sedition not just as rebellion, but as opposing the *unity* of the common good. The critical question for him isn't just "Is the ruler evil?" but "Will removing him cause more disorder than keeping him?" This is a utilitarian calculus of order. Your family argument focused on the *justice* of the act (retributive), whereas Aquinas is focused on the *order* of the act (consequentialist). If the resistance cell was a faction rather than a true representative of the whole community, Aquinas would likely classify their plot as seditious regardless of the dictator's crimes.
