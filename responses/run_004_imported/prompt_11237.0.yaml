prompt: |-
  so in my democratic theory seminar we've been stuck on this 'boundary problem' thing for like two weeks now — basically, before any group can even hold a legitimate vote on anything, someone already had to decide who counts as part of the demos, and you can't make that decision democratically without it being circular (the demos deciding who the demos even is). can you write me an essay that actually engages with this instead of just gesturing at it: weigh goodin's all-affected-interests principle against the all-subjected-to-law view (the kind of move abizadeh makes re: border coercion), and deal with the objection that both of them technically end up enfranchising tourists and small children, which is obviously not what anyone intends. dont hedge and just conclude "both have their merits" -- actually defend one specific answer for who should belong to the demos (or at least which principle gets closest) and justify it properly.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The "Boundary Problem" in democratic theory (who constitutes the *demos*?).
      *   **Key Conflict:** Robert Goodin's "All-Affected Interests" (AAI) principle vs. Arash Abizadeh's "All-Subjected to Coercion/Law" (ASC) principle.
      *   **Specific Objection to Address:** Both principles seem to over-expand the *demos* to include tourists and small children (the "absurdity" objection).
      *   **Constraint:** Do not hedge. Do not conclude "both have merits." Defend one specific answer/principle.
      *   **Tone:** Academic, engaged, rigorous (seminar essay style).
      *   **Length:** Implicitly substantial enough to cover the arguments deeply (likely 1500-2000 words).

  2.  **Deconstruct the Arguments:**

      *   **The Boundary Problem:** Whose decision is it to decide who decides? If the *demos* decides its own boundaries, it's circular. If an external authority decides, it's undemocratic. This is the starting point.
      *   **Goodin (AAI):** Everyone affected by a decision should have a say.
          *   *Strengths:* Captures externalities, global justice issues.
          *   *Weaknesses:* "Affected" is too vague. Almost everyone is affected by almost everything (butterfly effect). Leads to an unstable, issue-specific *demos*. Enfranchises tourists (affected by traffic laws) and children (affected by school policy).
      *   **Abizadeh (ASC):** Everyone subject to coercive law should have a say.
          *   *Strengths:* Ties democracy to legitimacy of coercion. Clearer boundary (jurisdiction).
          *   *Weaknesses:* Still enfranchises tourists (subject to local laws while present). Still enfranchises children (subject to laws).
      *   **The "Tourist/Child" Objection:** If we follow AAI or ASC literally, a tourist visiting for a day should vote in local elections, and a 2-year-old should vote. This seems impractical and intuitively wrong.
      *   **The Task:** Choose one and defend it against this objection *without* retreating to "it's complicated."

  3.  **Select a Position:**
      *   *Option A: Defend Goodin (AAI).* Harder to defend against the "tourist" objection because "affect" is so porous. Requires a lot of caveats about "significant" interests.
      *   *Option B: Defend Abizadeh (ASC).* Stronger normative grounding (coercion requires justification). The "tourist" objection is actually a feature, not a bug, if framed correctly (temporary subjection vs. permanent membership). The "child" objection can be handled via trusteeship/competence distinctions without denying membership.
      *   *Decision:* Defend **Abizadeh's All-Subjected Principle (ASC)**, but refine it to address the inclusion of tourists and children. It offers a more robust account of *political obligation* and *legitimacy* than AAI.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The boundary problem is not a technical glitch; it's the foundational paradox of democracy.
          *   Context: Goodin vs. Abizadeh.
          *   Thesis: While Goodin's AAI captures moral stakes, Abizadeh's ASC provides the only coherent basis for *political* legitimacy. The objections regarding tourists and children do not invalidate ASC; rather, they reveal a confusion between *membership* (right to influence) and *competence/administration* (capacity to vote). I will argue ASC is superior.

      *   **Section 1: The Circularity and the Contenders:**
          *   Explain the logical paradox (Whose decision is it to decide?).
          *   Briefly outline Goodin (interests) vs. Abizadeh (coercion).
          *   Why AAI fails: It makes the *demos* fluid and unstable. Every issue creates a new electorate. This destroys the continuity required for a political community.

      *   **Section 2: The Case for Coercion (Abizadeh):**
          *   Democracy is about justifying force. If the state coerces you, you need a voice.
          *   This creates a fixed boundary (jurisdiction) rather than a fluid one (causal chains of affect).
          *   This solves the circularity by grounding the boundary in the *fact* of coercion, not a prior democratic vote.

      *   **Section 3: Addressing the "Absurd" Implications (Tourists & Children):**
          *   *The Tourist Objection:* Yes, tourists are subject to law. But is their subjection the same as residents?
          *   *Refinement:* Distinguish between *transient* subjection and *systemic* subjection. A tourist is subject to traffic laws, but not the *structure* of the society in the same way. However, don't water down ASC too much. Better argument: They *should* have a voice regarding the laws binding them, but administrative practicality allows for representation via the state of origin or limited suffrage. Actually, stronger move: Admit they fall under the principle but argue that *voting* is just one mechanism of voice. Or, argue that the "boundary problem" is about the *right* to membership, not the logistical act of casting a ballot.
          *   *Wait, let's go harder:* The prompt asks to defend who belongs. I should argue that tourists *are* temporarily part of the demos regarding specific laws, but permanent residency is the threshold for full membership.
          *   *Better approach for the Essay:* Focus on the *Child* objection as the stronger test.
          *   *The Child Objection:* Children are coerced. Do they vote?
          *   *Defense:* Distinguish between *standing* (membership in the demos) and *capacity* (ability to cast a ballot). Children belong to the demos (they are subjects), but their vote can be exercised via guardians until competence is reached. Denying them membership entirely treats them as objects, not subjects. This is morally superior to AAI which might exclude them if their "interests" are interpreted by adults anyway.
          *   *Re-evaluating the Tourist point:* If I defend ASC, I must admit tourists are subject to law. But I can argue that the *demos* is defined by those subject to the *coercive structure* over time, not just incidental laws. Abizadeh focuses on border coercion specifically. Let's stick to the core: Subjection to the *legal order*.
          *   *Pivot:* I will argue that the "absurdity" of enfranchising tourists/children is actually an intuition pump based on administrative convenience, not democratic principle. ASC is right; our intuitions about voting are wrong. However, to make it palatable, I will distinguish between *constitutive membership* and *electoral administration*.

      *   **Section 4: Why AAI Fails the Test:**
          *   AAI makes boundaries impossible to draw. Who isn't affected by climate change? By trade tariffs?
          *   It leads to a "global demos" for almost everything, rendering the nation-state obsolete without a global state to manage it.
          *   ASC preserves the possibility of distinct political communities while ensuring their boundaries are legitimate.

      *   **Conclusion:**
          *   Reiterate thesis.
          *   Final punch: The boundary problem isn't solved by finding a perfect rule, but by grounding the rule in the nature of political power (coercion). ASC is the only principle that respects the autonomy of those forced to obey.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "children have standing but can't vote" just a semantic trick?
      *   *Fix:* No, it's a distinction between *rights* and *exercise of rights*. Minors have human rights but can't sign contracts. Same logic applies to political rights.
      *   *Critique:* Is dismissing tourists too easy?
      *   *Fix:* Acknowledge Abizadeh's specific point: Borders are coercive. Tourists cross borders. But for *internal* elections, the "subjected" criterion implies ongoing subjection. I need to be careful not to drift into "stakeholder" theory (which is AAI). I must stick to *coercion*. A tourist is coerced by traffic laws, but not by the *tax regime* or *conscription* or *long-term planning*. I will argue for a "durational" threshold within ASC.

      *   *Wait, the prompt says "dont hedge... actually defend one specific answer."*
      *   Okay, I will defend **Abizadeh's All-Subjected Principle**, but I will interpret "subjected" to mean "subject to the coercive *order*," not just every specific law. This excludes tourists (transient) but includes children (permanent subjects). This handles the objections while keeping the core principle intact.

  6.  **Final Polish:**
      *   Ensure the tone is seminar-appropriate (theoretical, precise).
      *   Check citations (Goodin 2007, Abizadeh 2008/2012).
      *   Make sure the "circularity" point is addressed in the intro and conclusion.

  7.  **Writing the Essay.** (Proceeding to generate output based on this structure.)
answer: |-
  **Title:** The Coercive Boundary: Why the All-Subjected Principle Solves the Democratic Paradox

  The "boundary problem" is not merely a technical glitch in democratic theory; it is the foundational paradox of popular sovereignty. As Robert Dahl famously noted, the democratic process presupposes a *demos*, yet the composition of that *demos* cannot itself be determined democratically without circularity. If the people decide who the people are, the decision is logically prior to the democracy it constitutes. If an external authority decides, the system is not democratic. For the past two weeks, our seminar has oscillated between Robert Goodin's "All-Affected Interests" (AAI) principle and Arash Abizadeh's "All-Subjected to Coercion" (ASC) principle as potential solutions. The standard objection to both is that they over-expand the franchise: if taken literally, they enfranchise tourists subject to local traffic laws and small children subject to parental and state authority. This is often treated as a *reductio ad absurdum*.

  However, this objection relies on a conflation of *moral membership* in the demos with the *administrative mechanics* of voting. While Goodin's AAI principle captures important moral externalities, it fails to provide a stable boundary for political agency, rendering the *demos* fluid and issue-specific. Abizadeh's ASC principle, grounded in the justification of coercive power, offers a superior account. It resolves the circularity by grounding boundaries in the fact of coercion rather than a prior vote. Furthermore, the objections regarding tourists and children do not invalidate ASC; rather, they reveal that our intuitions about voting are too narrow. I argue that Abizadeh's All-Subjected Principle is the only viable candidate for democratic legitimacy, provided we understand "subjection" as ongoing subordination to a legal order, not merely incidental contact with specific laws.

  To understand why ASC triumphs, we must first see why AAI fails to solve the boundary problem. Goodin argues that anyone whose interests are affected by a decision should have a say in making it. This is morally intuitive: if a factory's pollution harms a neighboring country, that country should have a voice. However, as a criterion for defining the *demos*, AAI is catastrophically unstable. Causal chains of "affect" are infinite. A zoning decision in Toronto affects housing prices, which affects migration, which affects global labor markets. If we follow AAI strictly, the *demos* for every single issue changes. There is no fixed body of "the people," only a shifting constellation of stakeholders. This destroys the continuity required for a political community to deliberate, compromise, and build trust over time. A democracy requires a stable electorate to hold representatives accountable; if the electorate dissolves and reconstitutes itself with every ballot measure, accountability is impossible. Goodin solves the moral problem of externalities but dissolves the political problem of community.

  Abizadeh's ASC principle avoids this fluidity by tethering the *demos* to the jurisdiction of coercive law. The core normative claim is that coercive power requires justification to those over whom it is exercised. If the state claims the right to arrest, tax, or regulate you, you must have a voice in how that state is constituted. This creates a fixed boundary: the jurisdiction of the legal order. This solves the circularity problem because the boundary is not determined by a democratic vote, but by the empirical reality of who is subject to the state's coercive apparatus. The *demos* is simply the set of people whom the state claims the right to rule.

  The immediate objection, as raised in our seminar, is that this casts the net too wide. A tourist visiting for three days is subject to local laws (they can be arrested for theft or fined for jaywalking). A three-year-old is subject to compulsory education laws and state protection. If we enfranchise them, we invite absurdity: tourists voting on long-term infrastructure they won't use, or toddlers deciding on tax policy. Critics argue this proves ASC is unworkable.

  This objection, however, mistakes the *principle* of membership for the *mode* of participation. The ASC principle correctly identifies that tourists and children possess *standing* within the demos, even if practical administration requires filtering how that standing is expressed.

  Consider the tourist first. Under a strict ASC view, a tourist is indeed subject to coercion. However, we must distinguish between subjection to a specific *law* and subjection to the *legal order*. A tourist is subject to the criminal code while present, but they are not subject to the structural, long-term coercive apparatus of the state. They do not pay income tax, they are not subject to conscription, they cannot be deported (they leave voluntarily), and they do not rely on the state for their long-term security or welfare. Their subjection is transient and voluntary (insofar as they chose to enter). Therefore, a refined ASC principle defines the *demos* as those subject to the *ongoing coercive structure* of the state. This excludes the tourist not because they aren't coerced at all, but because their subjection lacks the durability that creates a stake in the system's legitimacy over time. This is not a retreat to "stakeholder" theory; it is a precise definition of what it means to be "subjected." To be subjected is to be under the jurisdiction's dominion, not merely its temporary reach.

  The case of the child is more difficult but ultimately strengthens the ASC position. Children are undeniably subject to the coercive legal order. They cannot leave the jurisdiction, they are mandated to attend school, and they are subject to state removal from homes. To exclude them from the *demos* entirely is to treat them as objects of policy rather than subjects of law. The objection that they lack competence to vote is valid administratively but irrelevant morally. We do not deny that minors have human rights because they cannot sign contracts; we appoint guardians to exercise those rights on their behalf until competence is achieved.

  The same logic should apply to democratic membership. Under ASC, children *belong* to the demos. They are part of the sovereign body. The fact that they do not cast ballots is a matter of administrative trusteeship, not exclusion. A parent or guardian should exercise the child's vote, or the child's interests should be weighted in a way that acknowledges their subjection. The current exclusion of children is a historical artifact, not a democratic necessity. By admitting children into the *demos* (even if via proxy voting), ASC forces the political system to account for their interests structurally, rather than relying on the benevolence of adults. Goodin's AAI might also include children, but only insofar as their "interests" are affected. ASC is stronger because it includes them based on their *status* as subjects. It recognizes that the state imposes obligations on children (obedience to law), and therefore justice demands they have a share in the authority imposing those obligations.

  Why, then, is ASC superior to AAI beyond the tourist/child objection? Because ASC alone respects the link between political obligation and political agency. In a democracy, the legitimacy of the law stems from the fact that those who obey it have authored it. Goodin's AAI severs this link. Under AAI, I might have a vote on a foreign policy decision because my interests are affected, even if I am not obligated to obey the outcome. This turns democracy into a interest-group bargaining session rather than a system of self-government. Abizadeh's coercion principle maintains the reciprocity: if you are bound by the law, you help write it. If you are not bound by the law (like the tourist who leaves in two days), you do not need full authorship.

  Furthermore, ASC provides a solution to the circularity that AAI cannot. AAI requires us to know the "interests" at stake before we can define the voters. But interests are contested. Does a foreign worker have an interest in my minimum wage law? Yes, it might lower it. Or does it harm them by excluding them? The determination of "affect" is itself a political decision that requires a boundary. ASC bypasses this. The boundary is the reach of the coercive apparatus. It is an empirical fact (mostly) rather than a contested moral calculation. The state knows who it taxes and who it arrests. That is the *demos*.

  Critics might argue that ASC is too state-centric, reinforcing the very borders that cause injustice. Abizadeh anticipates this: he argues that if border controls are coercive (which they are), then the policy of border control itself must be justified to those excluded by it. This implies a demand for open borders or global democratic oversight. This is a feature, not a bug. It forces democratic theory to confront the violence of exclusion. Goodin's AAI also leads to global democracy, but via a diffuse web of interests. ASC leads there via the specific mechanism of state coercion. It is more actionable. It tells us exactly where the illegitimacy lies: at the border checkpoint where coercion is applied without the consent of the coerced.

  In conclusion, the boundary problem cannot be "solved" in the sense of finding a pre-political natural boundary. There is none. But it can be resolved normatively by grounding the boundary in the justification of power. Goodin's All-Affected Interests principle fails because it renders the *demos* too fluid to function as a political agent and relies on a vague metric of "affect." Abizadeh's All-Subjected Principle succeeds because it ties membership to the reality of legal obligation. The objections regarding tourists and children do not refute ASC; they refine it. Tourists are excluded not because they are unaffected, but because they are not subject to the *ongoing* coercive order. Children are included as members, even if their vote is exercised via trusteeship, because they are full subjects of the law. We must stop viewing the exclusion of children and the inclusion of tourists as practical inconveniences to be swept under the rug. They are litmus tests. If we value democracy as self-government among those bound by law, we must accept that the *demos* is defined by coercion. Anything else is merely governance by consent of the convenient. Abizadeh's framework is the only one that takes the "force of law" seriously enough to justify its existence.
