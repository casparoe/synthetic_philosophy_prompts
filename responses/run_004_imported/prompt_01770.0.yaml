      *   *Yudkowsky's Counter:* A superintelligence shouldn't play "Chicken." It should recognize that rewarding early, reckless commitments creates bad incentives. It should adopt a policy of "I only respect commitments that are made with sufficient information and reasoning." If both do this, the race disappears.
