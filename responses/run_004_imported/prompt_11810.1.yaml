answer: |-
  This is a fantastic deep dive, and you have correctly identified one of the juiciest feuds in the history of science. You are also right to be skeptical of the "Great Man" history that paints Wallis as the dispassionate voice of reason and Hobbes as the senile madman. The ideological venom was real.

  However, your hypothesis about the mathematics—specifically the idea that 17th-century mathematicians couldn't be *certain* Hobbes was wrong without the 1882 Lindemann proof—contains a category error that is common but crucial to untangle.

  Here is the breakdown of the math, the politics, and the philosophy to help you separate the signal from the noise.

  ### 1. The Math: You don't need 1882 to spot a bad proof
  Your central mathematical hinge is: *"Nobody actually proved squaring the circle was impossible until Lindemann... doesn't that mean 17th century mathematicians were in no real position to be so certain Hobbes's specific construction was wrong?"*

  The answer is **no**. There is a massive distinction between:
  1.  **Proving a problem is impossible** (General Impossibility).
  2.  **Proving a specific solution is incorrect** (Specific Refutation).

  Lindemann (1882) did #1. He proved that *no* Euclidean construction can ever square the circle because $\pi$ is transcendental.

  Wallis (1655) did #2. He did not need to know that *all* solutions were impossible to know that *Hobbes's* solution was wrong.

  **The Analogy:**
  Imagine someone claims to have built a perpetual motion machine in 1650.
  *   **1650 View:** Thermodynamics hasn't been invented yet. Technically, perpetual motion isn't *proven* impossible until the laws of thermodynamics are codified in the 19th century.
  *   **Reality:** A competent engineer in 1650 can still look at your machine, point to a specific gear, and say, "Friction here will stop this within ten minutes." They don't need the general law of energy conservation to know your specific machine is broken.

  **Hobbes's Error:**
  Hobbes's construction in *De Corpore* wasn't a subtle, near-miss approximation that required high-level calculus to debunk. It was geometrically crude. He essentially conflated the length of an arc with the length of a straight line in ways that violated basic Euclidean axioms available since antiquity. Wallis didn't need transcendental number theory to show Hobbes had made arithmetic errors and invalid logical leaps. He just had to follow the construction with a compass and straightedge and show the numbers didn't match.

  So, while Wallis couldn't say "No one will ever do this," he could absolutely say, "Thomas, you did not do this."

  ### 2. The Politics: You are right about the "Hit Job"
  Where your intuition is spot-on is the motivation. The standard narrative often sanitizes Wallis, but the historical record shows Wallis was absolutely conducting a political and theological hit job.

  *   **The Royal Society:** Wallis was a founding member of the Royal Society; Hobbes was explicitly excluded. The Society defined itself against Hobbesian dogmatism.
  *   **Theology:** Wallis was a devout Calvinist. Hobbes was widely accused of atheism (or at least Socinianism). To Wallis, Hobbes's materialism wasn't just wrong; it was dangerous to the social order.
  *   **The Method:** Wallis frequently attacked Hobbes's *character* and *theology* in mathematical pamphlets. He framed Hobbes's geometric errors as evidence of his moral and spiritual corruption.

  So, you are correct that the *ferocity* and the *public relations campaign* were driven by ideology. Wallis wanted to discredit *De Corpore* because if Hobbes's materialist physics were true, his materialist politics (*Leviathan*) and materialist theology followed.

  However, this doesn't make it a "Semmelweis case." Semmelweis was right on the merits (germ theory/handwashing) and was ignored due to institutional inertia. Hobbes was **wrong on the merits** (his geometry was bad) and was attacked due to institutional inertia *and* ideological hostility. The fact that Wallis had bad motives doesn't mean his math was wrong. It just means the *social context* of the math was toxic.

  ### 3. The Philosophy: Why Hobbes Couldn't Back Down
  This is the most critical part of your second question. Was it just ego? partially. But it was also load-bearing for his entire philosophical system.

  Hobbes was a **constructivist** regarding knowledge.
  *   **Natural Philosophy (Physics):** We cannot truly *know* causes here, because God made the world. We can only hypothesize based on effects.
  *   **Geometry:** We *can* know causes here, because **we made the figures.** We define the circle; we draw the line. Therefore, geometry is the only true *scientia* (certain knowledge).
  *   **Civil Philosophy:** We can know this because **we made the Commonwealth.** It is an artificial man, constructed by us, so we can understand its causes deductively, just like geometry.

  For Hobbes, geometry was the **gold standard of certainty.**

  If Hobbes admitted he was wrong about squaring the circle, he wasn't just admitting a math error. He was admitting that his method of reasoning—deductive construction from first principles—was fallible in the one domain where it was supposed to be infallible.
  *   If he can't do geometry right, can we trust his deduction of the Social Contract?
  *   If his "certain knowledge" is actually error-prone, does *Leviathan* collapse into mere opinion?

  Hobbes's stubbornness was philosophical survival. He literally could not afford to be wrong about geometry without undermining the epistemological foundation of his life's work. He believed Wallis was the one corrupting the method, not him.

  ### 4. The Verdict on Your Hypothesis
  You aren't "forcing a narrative," but the Semmelweis/Galileo comparison doesn't hold up under scrutiny.

  *   **Semmelweis/Galileo:** Right on the facts, oppressed by dogma.
  *   **Hobbes:** Wrong on the facts, oppressed by dogma (and his own ego).

  The "Galileo Gambit" is usually used by cranks to say, "They laughed at Galileo, they laugh at me, therefore I am Galileo." The flaw in that logic is that Galileo was actually right. In the Hobbes/Wallis case, the people laughing (Wallis et al.) were actually right about the math, even if their reasons for laughing were partly snobbish and theological.

  **The Nuanced Takeaway:**
  The story isn't "Wallis the Hero vs. Hobbes the Fool."
  The story is: **Wallis (a brilliant mathematician with an ideological axe to grind) vs. Hobbes (a brilliant philosopher who was out of his depth in advanced math but couldn't admit it because it threatened his entire system).**

  It is a tragedy of category errors. Hobbes thought political philosophy could be done like geometry. Wallis proved Hobbes couldn't even do geometry like a geometer. The result was a 20-year war where the math was correct, but the motivations were messy.

  You've identified the political subtext correctly, which many pop-science histories miss, but don't let the political subtext convince you the math was ambiguous. In 1655, Hobbes was just as wrong as he was in 1882; we just have a fancier proof of *why* he was wrong now.
