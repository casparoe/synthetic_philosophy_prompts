          *   *Philosophical Root:* Environmental Ethics (Ecocentrism/Holism).

      *   **Wild Animal Suffering (WAS) / Welfare Biology:**
          *   *Unit of Moral Concern:* The sentient individual.
          *   *Metric:* Net suffering vs. well-being (hedonic utility).
          *   *View of Nature:* Darwinian struggle. High r-selection means massive death/suffering is the norm. Nature is cruel, not harmonious.
          *   *Role of Humans:* Moral agents with capacity to reduce suffering. Non-intervention is complicity.
          *   *Philosophical Root:* Animal Ethics (Sentientism/Utilitarianism).

  3.  **Analyze the Disagreement (Structural Comparison):**
