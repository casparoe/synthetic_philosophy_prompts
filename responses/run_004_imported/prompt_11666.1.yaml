      *   *Section 2: The Core Conflict.* Highlight the "Holism vs. Individualism" clash. Mention the "Naturalistic Fallacy" aspect (Leopold implying 'natural' = 'good').
      *   *Section 3: The Verdict.* This is the tricky part. I need to be direct.
          *   *Argument:* The Land Ethic changes the subject. It treats the ecosystem as the patient. WAS treats the animal as the patient. If you accept sentience matters, Leopold fails. If you accept the ecosystem matters more, WAS fails.
          *   *Commitment:* I will argue that the Land Ethic *dodges* the question because it relies on a category error. It treats systems as if they can feel. Suffering happens to individuals, not systems. Therefore, an ethic that ignores individuals to save the system is failing to address the moral reality of suffering.
