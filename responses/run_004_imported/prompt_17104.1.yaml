prompt: |-
  Two of my graduate students got into a genuinely good argument after a reading group on Singer's "Famine, Affluence, and Morality," and I haven't been able to settle it since. It started because a mutual friend of theirs, an adjunct who has pledged ten percent of her income to effective charities, admitted over lunch that she thinks the argument actually commits her to far more than that, and that she isn't willing to give it.

  (1) Mara said this shows consequentialism can't be right: a theory that requires each of us to keep sacrificing until our own marginal utility matches the person we could help demands a life almost no one could live, and a theory that counts nearly every life as seriously wrong has gone wrong somewhere.

  (2) Dan said that conflates the theory of right action with a standard of blame: a consequentialist can hold that the act is wrong while denying the agent is much to blame, given ordinary excusing conditions like weakness of will and a lifetime of partial socialization. Demandingness shows we should be careful moving from "wrong" to "blameworthy," not that the theory is false.

  (3) Mara answered that this just relocates the problem: a standard of rightness that virtually no one could follow, and that treats a stranger's minor discomfort as on a par with your own child's education, has stopped tracking anything we'd recognize as a moral requirement -- which is close to Williams' complaint that consequentialism reduces the agent to a mere channel for impartially produced value, alienated from his own commitments.

  (4) Dan pointed out that other theories are just as demanding once their own duties are triggered -- an absolute duty not to break a serious promise, or a duty of easy rescue, can cost someone dearly in the right circumstances -- so the real difference may be that consequentialism's demands are triggered constantly rather than occasionally, not that they are distinctively heavy, and that difference needs an argument of its own.

  (5) Mara replied that Scheffler himself felt he had to graft an agent-centered prerogative onto a consequentialist axiology from outside, and that a permission justified mainly by the acceptable verdicts it yields is exactly what "ad hoc" means.

  (6) Dan didn't accept that: every moral principle needs some non-arbitrary way of fixing how much it requires, and specifying the size of a prerogative is no more ad hoc than commonsense morality specifying how costly a "reasonable" rescue can be.

  Neither budged. Please go through the exchange move by move and say who has the better of it at each numbered point -- not just who wins overall -- and note anything you think both of them are missing. Close with a short final verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A debate between two graduate students (Mara and Dan) regarding Peter Singer's "Famine, Affluence, and Morality."
      *   **Trigger:** An adjunct friend admits Singer's argument commits her to more than 10% giving, but she isn't willing to give it.
      *   **Task:** Evaluate the exchange move-by-move (points 1-6). Determine who has the better of the argument at each step. Identify what *both* might be missing. Provide a short final verdict.
      *   **Constraint:** Do not just declare an overall winner; analyze each point.

  2.  **Deconstruct the Arguments (Move by Move):**

      *   **Point (1) Mara:** The "Demandingness Objection."
          *   *Claim:* Consequentialism requires sacrificing until marginal utility matches the recipient. This is too demanding (almost no one could live it). A theory calling nearly every life "seriously wrong" is flawed.
          *   *Strengths:* This is the classic, intuitive objection to act utilitarianism/Singer's strong principle. It appeals to moral common sense.
          *   *Weaknesses:* It assumes "ought implies can" in a psychological sense, or that a moral theory *must* be easy to follow to be true. It conflates truth with convenience.
          *   *Assessment:* Strong intuitive pull, but philosophically vulnerable to the "so much the worse for common sense" reply.

      *   **Point (2) Dan:** The "Blame vs. Wrongness" Distinction.
          *   *Claim:* Distinguishes objective rightness (the act) from subjective blameworthiness (the agent). Consequentialism can say the act is wrong but the agent isn't blameworthy due to weakness of will/socialization.
          *   *Strengths:* Technically accurate within sophisticated consequentialist frameworks (e.g., Hare's two-level utilitarianism, or standard distinctions in normative ethics). Defuses the emotional sting of the demandingness objection.
          *   *Weaknesses:* Doesn't fully address the *alienation* or the *content* of the morality, just the reactive attitudes. Some argue a morality that makes everyone a "sinner" is practically useless.
          *   *Assessment:* Dan scores a technical point here. Mara's initial formulation *did* conflate wrongness with blame/feasibility.

      *   **Point (3) Mara:** The "Alienation/Integrity Objection" (Williams).
          *   *Claim:* Relocates the problem. A standard no one can follow doesn't track "moral requirement." Cites Williams: reduces agent to a channel, alienates from commitments (e.g., child's education vs. stranger's discomfort).
          *   *Strengths:* Hits deeper than demandingness. It's about the *structure* of agency, not just the cost. The "child vs. stranger" example is powerful.
          *   *Weaknesses:* Williams' objection is specifically about *integrity* and *projects*, not just cost. Mara mixes demandingness with integrity. A consequentialist could argue saving the stranger *is* the moral requirement, regardless of intuition.
          *   *Assessment:* Mara regains ground. Dan's blame distinction doesn't solve the problem of a morality that ignores personal projects. This is a stronger philosophical objection than (1).

      *   **Point (4) Dan:** The "Deontology is Demanding Too" Reply.
          *   *Claim:* Other theories (deontology) have absolute duties (no breaking promises, easy rescue) that can be very costly. Difference is frequency (constant vs. occasional), not weight.
          *   *Strengths:* True. Deontology can be incredibly demanding (e.g., don't kill one to save five, even if the one is your child). "Reasonable rescue" is vague.
          *   *Weaknesses:* The *frequency* difference is massive. Constant demand changes the nature of a life in a way occasional demand does not. Also, deontology usually allows *options* (supererogation) that consequentialism denies.
          *   *Assessment:* Dan makes a fair point about comparative demandingness, but underestimates the significance of "constant vs. occasional." Mara has the better intuition here, but Dan is logically consistent. Slight edge to Dan for exposing hypocrisy in common sense, but Mara's point about the *nature* of the demand stands. Let's call it a draw or slight edge to Dan for the logical pivot. Actually, looking closer: Dan argues the *difference* needs an argument. He's right. Mara assumes the difference matters without proving why frequency changes the moral truth. Dan wins this specific exchange.

      *   **Point (5) Mara:** The "Ad Hoc Prerogative" Objection (Scheffler).
          *   *Claim:* Scheffler had to add an agent-centered prerogative from *outside* consequentialism to make it work. Justifying it by "acceptable verdicts" is ad hoc (circular/fitting data).
          *   *Strengths:* Accurate history of the Scheffler hybrid. If the core axiology is "maximize good," adding "unless it costs me too much" looks like a patch, not a derivation.
          *   *Weaknesses:* All theories adjust to reflect considered judgments (Rawls' reflective equilibrium). Is it more ad hoc than deontology adjusting "reasonable rescue"?
          *   *Assessment:* Mara is sharp here. She identifies a structural weakness in modified consequentialism. If the theory needs a non-consequentialist patch to be livable, is it still consequentialism? Strong point for Mara.

      *   **Point (6) Dan:** The "Reflective Equilibrium/Arbitrariness" Defense.
          *   *Claim:* All principles need non-arbitrary fixing. Specifying a prerogative isn't more ad hoc than commonsense morality specifying "reasonable" rescue.
          *   *Strengths:* Appeals to coherence. Every theory has parameters. "Reasonable" is also undefined.
          *   *Weaknesses:* Misses Mara's point about *internal* coherence. Consequentialism derives rightness from goodness. A prerogative allows sub-optimal goodness. That's a contradiction in terms unless the axiology changes. Deontology doesn't claim to maximize good, so "reasonable rescue" fits its structure better.
          *   *Assessment:* Dan is defending via "tu quoque" (you do it too). But Mara's point is about internal consistency vs. external patching. Mara has the stronger theoretical point, though Dan is right that *all* theories struggle with precision.

  3.  **Identify What Both Are Missing:**
      *   **Effective Altruism Nuance:** Singer himself has softened/clarified his views over time (strong vs. moderate principle). The 10% pledge (Giving What We Can) is often seen as a *focal point* solution, not necessarily the absolute moral limit.
      *   **Institutional vs. Individual:** Both focus on individual morality. Structural injustice might require systemic change rather than just individual sacrifice (Liam Murphy's "Compliance Condition").
      *   **Psychological Realism:** Neither discusses the long-term sustainability of moral motivation. Burning out helps no one.
      *   **The "Friend" Factor:** They are arguing theory, but the prompt starts with a human dilemma (the adjunct). They are ignoring the pedagogical/pastoral aspect of the friend's distress.

  4.  **Drafting the Response:**
      *   *Tone:* Academic, balanced, insightful (like a senior colleague or advisor).
      *   *Structure:* Follow the numbered points. Then a "Missing" section. Then a "Verdict."
      *   *Evaluation:* Be decisive at each step but nuanced.

      *(Self-Correction during drafting)*: At Point 4, I need to be careful. Dan says the difference is *only* frequency. Mara implies frequency changes the *kind* of life. Dan is right that frequency needs an argument, but Mara is right that frequency creates alienation. I'll give the point to Dan for logical rigor, but note Mara's intuitive strength.
      *Actually, re-reading (4):* Dan says "that difference needs an argument of its own." He is challenging Mara to prove why constant demand is worse than heavy occasional demand. Mara hasn't done that yet. Dan wins the burden of proof exchange here.

      *Re-reading (6):* Dan says specifying a prerogative is no more ad hoc than "reasonable rescue." Mara's point was about *grafting from outside* the axiology. Deontology doesn't have a maximizing axiology, so "reasonable" fits better. Consequentialism *does* have a maximizing axiology. So a prerogative *is* inconsistent with the core axiom. Dan's analogy fails. Mara wins (6).

  5.  **Final Polish:** Check the flow. Ensure the "Missing" section adds value beyond the debate. Ensure the verdict is concise.

      *Refining the "Missing" section:* The Compliance Condition (Murphy) is crucial here. If others aren't complying, am I required to pick up the slack? Singer says yes, Murphy says no. This directly addresses the adjunct's worry. Also, the distinction between *optimizing* and *satisficing*.

      *Refining the Verdict:* Dan wins on technical defense of consequentialism; Mara wins on the plausibility of the theory as a guide to life. It's a stalemate of "Truth vs. Livability."

  6.  **Final Review against constraints:**
      *   Go through move by move? Yes.
      *   Say who has the better of it at each point? Yes.
      *   Note what both are missing? Yes.
      *   Close with short final verdict? Yes.

      *Let's write it.*
answer: |-
  Here is an analysis of the exchange, move by move, followed by an assessment of what is missing from the debate and a final verdict.

  ### Move-by-Move Analysis

  **(1) Mara: The Demandingness Objection**
  Mara deploys the classic intuition pump against act utilitarianism: if a theory condemns almost everyone as morally failing, the theory is likely flawed. She relies on the principle that "ought implies can" (psychologically) and that morality should be a guide for human life, not a condemnation of it.
  *   **Assessment:** **Mara** has the better of this opening. While Dan could argue that truth is independent of convenience, Mara correctly identifies that a moral theory's function is partly to guide action. A theory that functions solely as a indictment of the human condition loses its normative force. Her intuition aligns with the widely accepted view that extreme demandingness is a *prima facie* cost for a moral theory.

  **(2) Dan: Wrongness vs. Blame**
  Dan distinguishes between the objective status of an act (wrong) and the subjective status of the agent (blameworthy). He argues that socialization and weakness of will can excuse the agent even if the act remains suboptimal.
  *   **Assessment:** **Dan** wins this technical exchange. Mara did conflate "wrong" with "blameworthy." Dan is correct that sophisticated consequentialism (e.g., R.M. Hare or J.S. Mill) can accommodate this distinction. It saves the theory from being practically unlivable by allowing agents to function without crushing guilt, even if they acknowledge they aren't maximizing the good. Mara's objection here was too blunt.

  **(3) Mara: Alienation and Integrity (Williams)**
  Mara pivots from demandingness to integrity. She argues that Dan's distinction doesn't solve the problem of a morality that treats personal projects (a child's education) as fungible with impersonal value (a stranger's discomfort). She invokes Bernard Williams' critique that consequentialism alienates the agent from their own life.
  *   **Assessment:** **Mara** regains the advantage. Dan's blame distinction addresses the *feeling* of guilt, but not the *structure* of the demand. Williams' point is deeper: it's not about how hard the theory is to follow, but that it requires the agent to abandon the ground of their own agency. A theory that makes loving your own child a moral compromise is counter-intuitive in a way that goes beyond "difficulty."

  **(4) Dan: Comparative Demandingness**
  Dan argues that deontology can also be incredibly demanding (e.g., absolute prohibitions) and that the difference is merely frequency (constant vs. occasional), which requires its own argument.
  *   **Assessment:** **Dan** has the stronger logical position here, though it is narrow. He correctly places the burden of proof on Mara to explain why *constant* demand is qualitatively worse than *catastrophic* occasional demand. Deontology can demand you die rather than break a promise; consequentialism demands you live differently every day. Dan is right that "common sense" is inconsistent here. However, he underestimates that constant demand fundamentally alters the *nature* of a life in a way occasional demand does not. Still, logically, he wins the point on burden of proof.

  **(5) Mara: The Ad Hoc Prerogative (Scheffler)**
  Mara targets modified consequentialism. She notes that Samuel Scheffler had to introduce an "agent-centered prerogative" that is not derived from the consequentialist axiology itself but is grafted on to produce better verdicts. She labels this ad hoc.
  *   **Assessment:** **Mara** wins this point decisively. This is a structural critique. If the core axiom is "maximize the good," a permission to *not* maximize the good is a contradiction unless the axiom is changed. Dan cannot easily defend this without admitting the theory is a hybrid. Mara correctly identifies that justifying a prerogative solely because it yields "acceptable verdicts" is an appeal to the very intuitions the theory was supposed to ground, risking circularity.

  **(6) Dan: Arbitrariness and Reflective Equilibrium**
  Dan counters that all theories need parameters (like "reasonable rescue") and fixing a prerogative is no more arbitrary than commonsense morality fixing limits on duty.
  *   **Assessment:** **Mara** retains the edge, though Dan makes a fair "tu quoque." Dan's analogy fails because deontology does not claim to maximize value, so limiting duties fits its structure. Consequentialism *does* claim to maximize value; limiting that maximization is internally inconsistent. While Dan is right that all theories struggle with precision (reflective equilibrium), Mara is right that the *source* of the precision matters. A prerogative in consequentialism is a patch; a limit in deontology is a feature.

  ### What Both Are Missing

  While Mara and Dan are sparring over high-level normative theory, they are missing three crucial elements that would actually help their adjunct friend:

  1.  **The Compliance Condition:** Neither mentions Liam Murphy's *Moral Demands in Nonideal Theory*. Murphy argues that an individual's duty is limited to what they would owe if *everyone else* were complying. Since the world is non-ideal (others aren't giving 10%), the adjunct is not required to pick up the slack for the rest of humanity. This directly addresses the friend's anxiety without abandoning consequentialism.
  2.  **Satisficing vs. Optimizing:** They assume consequentialism must be *maximizing*. A satisficing consequentialist argues that one need only produce "good enough" outcomes, not the *best* possible ones. This would validate the 10% pledge without requiring total self-sacrifice.
  3.  **The Pedagogical Context:** They are treating the friend's admission as a theoretical puzzle rather than a human distress signal. The friend is experiencing moral distress. The debate ignores the psychological sustainability of moral motivation. If the theory burns out its adherents, it fails instrumentally, regardless of its truth value.

  ### Final Verdict

  **Mara wins on plausibility; Dan wins on consistency.**

  Dan successfully defends the internal logic of consequentialism against the charge of incoherence, showing that the theory can distinguish blame from wrongness and that other theories have their own demandingness issues. However, Mara wins the broader philosophical debate by demonstrating that saving the theory requires grafting non-consequentialist elements onto it (the prerogative), which undermines its claim to be a unified account of value.

  Ultimately, Mara is right that a theory requiring such significant modification to match human reality has lost its explanatory power. Dan is right that the reality might just be that hard. But since morality is meant for humans, Mara's insistence that the theory must fit the agent is the more pragmatic victory.
