answer: |-
  The coffee shop smells like burnt beans and rain, a combination my brain has filed under *Tuesday* for thirty years. Since the surgery, since the bridge was burned to save the rest of the city from the electrical storms, I've learned to navigate the silence between the halves. People expect a war in here. They expect me to button my shirt with one hand and unbutton it with the other. But plasticity is a quiet miracle. We learned to dance. Mostly, I speak for us. I am the narrator, the press secretary, the one who explains why we stopped walking or why we bought the blue shirt instead of the red.

  Today, I'm sitting in booth four. My right hand holds the menu. My left hand rests on the table, palm down, still as a stone. I order the Earl Grey. It's what I always order. The verbal side likes the ritual; it keeps the story consistent.

  When the mug arrives, steam curling in the drafty air, I reach for it with my right hand. My left hand intercepts.

  It doesn't slap the cup away. That would be dramatic, something for a documentary. Instead, the left hand simply covers the handle. It rests there, heavy and immovable. My right hand hovers, confused.

  "It's too hot," I say aloud. My voice sounds steady, confident. This is the job. When the left hand acts on information the right hemisphere hasn't processed—spatial data, emotional cues, peripheral threats—my job is to weave it into a narrative that makes sense. *I didn't want the tea. I changed my mind. It's too hot.* I believe it as I say it. I have to.

  But then I feel it. A rhythmic pressure against my thigh.

  *Tap. Tap. Tap.*

  My left thumb, hidden by the table edge, is pressing against my leg. One, two. One, two. It's a code we developed years ago, during the early years of static and confusion. *Wait. Look.*

  I pause. The confabulation hangs in the air, a thin veil. *It's too hot.* Is it? I can see the steam, but the ceramic looks matte, not shimmering with extreme heat. If I were honest, I'd say I don't know why the hand stopped. But honesty is a luxury a unified consciousness doesn't always afford.

  I look around. The diner is mundane. A couple arguing over bills. A student sleeping over a laptop. The waiter wiping down the counter.

  *Tap. Tap.*

  The left hand is insistent. It isn't trembling; it's purposeful. If I accept the "two minds" theory Priya would love, this is my brother in here, pounding on the wall, telling me there's a fire. If I accept my own theory, this is just a subcortical glitch, a processing lag where the spatial awareness kicked in before the language center caught up. One mind, split latency.

  I shift my gaze to the counter again. The waiter is pouring coffee for the couple. He's turned his back to them, reaching for a sugar dispenser. His elbow is high. The pot is tilted.

  My left hand lifts from the tea mug and points, subtly, toward the couple.

  I watch. The waiter slips. Not a dramatic slip, just a loss of traction on the linoleum. The pot tips. A cascade of boiling liquid arcs toward the woman's exposed arm.

  I'm out of the booth before I decide to stand. My legs move us across the room. My mouth opens, and a shout comes out—"Hey!"—just as the coffee hits the table edge instead of her skin. The waiter catches the pot. The woman jumps, spills her own drink, but she's unburned.

  Chaos erupts. Apologies, napkins, the manager rushing over. I stand there, hands at my sides. My right hand is clenched. My left hand is open, relaxed.

  "Are you okay?" the woman asks me, thinking I'm the one who shouted.

  "Fine," I say. "Just... saw the angle."

  I walk back to the booth. I don't sit down. I leave money on the table. The tea sits untouched, cooling.

  On the sidewalk, the rain has started. I put my hands in my pockets. The right hand grips a keychain. The left hand rests loose against my hip.

  I told myself I shouted because I saw the waiter slip. That's the story. That's the press release. *I saw the danger, I reacted.* It's a clean line. Cause and effect. One person, one timeline.

  But I know what I felt in the booth. I didn't see the slip until the left hand pointed. The left hand knew the trajectory before the eyes sent the image to the language center. The right hemisphere saw the geometry of the fall before "I" understood there was a fall.

  So who saved her?

  If I say "I did," I'm lying about the timeline. If I say "We did," I'm admitting to a duality I can't prove. Sometimes, when I'm tired, I think the left hand is just a tool, like a hammer that knows where the nail is before the carpenter does. Other times, like now, standing in the rain, I feel the left hand pat my hip. A gentle, rhythmic reassurance.

  *Tap. Tap.*

  It feels like a pat on the back from a partner. Or it feels like a nerve firing.

  I start walking home. I tell myself I'm walking because I want to get out of the rain. But as I turn the corner, I realize my left hand is steering me down the shaded side of the street, away from the puddles splashing from the road. I didn't notice the puddles. I didn't decide to avoid them.

  I let the left hand guide us. It knows the way. Or maybe I do. I watch the wet pavement rush by, listening to the sound of my own footsteps, wondering if there's one pair of ears hearing them, or two.
