      *   **Move 4 (Raf):** "Forced by base rates" launders historical bias; the outcome variable (default) is shaped by historical treatment (hardship extensions, etc.).
          *   *Analysis:* This is the "label bias" or "measurement error" argument. If the target variable $Y$ (default) is contaminated by historical discrimination (e.g., Group A denied extensions more often), then optimizing for $Y$ perpetuates bias. This is a critical critique in fairness literature.
          *   *Score:* 2 (Clearly right).
          *   *Justification:* Valid critique of the target variable; if historical data encodes past discrimination in who gets labeled "default," optimizing for that label perpetuates systemic bias.

      *   **Move 5 (Grace):** Fixing it (thresholds per group) means sorting by group membership, which might violate fair-lending laws (disparate treatment vs. disparate impact).
          *   *Analysis:* This is a legal/compliance reality in many jurisdictions (e.g., US ECOA). Explicitly using protected characteristics for decisions is often prohibited (disparate treatment), even to fix disparate impact. However, proxy variables are often used instead. It's a practical/legal constraint, not a moral one.
