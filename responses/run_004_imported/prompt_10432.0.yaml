answer: |-
  This is a genuinely difficult ethical bind, and your discomfort shows that you care deeply about your integrity and your relationships. You are facing a conflict between two moral duties: **fidelity** (keeping a promise to your parents) and **honesty** (maintaining your pact with your cousin).

  To answer your core question directly: **No, you are not necessarily bound to "wrong" someone, but you are almost certainly bound to disappoint someone.** There is a difference. "Wronging" implies a moral failure or an injustice. Making a painful choice between two competing values, handled with care and followed by repair, is not a moral failure—it is the cost of being part of a complex family system.

  However, before you resign yourself to a binary choice between lying or spilling the beans, there is a third option that might resolve the tension. Here is a way to think through the situation and a potential path forward.

  ### 1. Challenge the False Dichotomy
  You feel trapped between lying to your cousin or breaking your promise to your parents. But you are treating the constraints as static when they are actually negotiable. The people who set the constraint (your parents) may not realize the collateral damage it is causing.

  **The Third Way: Go back to your parents.**
  Before you speak to your cousin again, speak to your parents. You can frame this not as "I want to tell her," but as "I need help managing a risk."
  *   **Say this:** "Cousin asked me directly. She feels excluded, and I'm in a position where I either have to break my promise to you or break a pact of honesty with her. Given that she has felt left out before, I'm worried that if I lie to her, she'll feel resentful and that might actually increase the risk of her slipping up later. Can we bring her in on the secret? Maybe give her a specific role so she feels invested in keeping it?"

  **Why this works:**
  *   It honors your promise to your parents by asking their permission before breaking confidence.
  *   It addresses the parents' fear (that she will spoil it) by suggesting that *inclusion* might actually make her more careful than *exclusion*.
  *   It preserves your honesty with your cousin if they agree.

  ### 2. If Your Parents Say "No"
  If your parents refuse to let the cousin know, you are back to the hard choice. In this scenario, you must weigh the **scope of the harm**.

  *   **Harm to Parents/Grandmother:** If you tell the cousin, there is a statistically high risk (based on past behavior) that the surprise is ruined. This damages a milestone event for your grandmother and causes your parents significant stress. This harm is concrete and immediate.
  *   **Harm to Cousin:** If you lie (or evade), she feels excluded and hurt that you broke your honesty pact. This damages trust between the two of you. This harm is relational and emotional.

  **The Ethical Weighing:**
  While honesty is a virtue, **beneficence** (acting for the benefit of others) often takes precedence in social contexts involving celebration. A surprise party is a "benign deception." Most ethical frameworks accept that white lies told to create joy for a vulnerable person (an aging grandmother) carry different weight than lies told for self-protection.

  If you must choose, **protecting the grandmother's milestone is likely the "right" choice,** even if it pains your cousin. Why? Because you can repair a relationship with a cousin; you cannot redo a 70th birthday surprise once it's spoiled.

  ### 3. How to Minimize the "Wrong"
  If you have to keep the secret, you can still avoid "wronging" your cousin by managing the aftermath. You don't have to just lie and move on.

  *   **The "Truthful Evasion":** You mentioned vagueness would tip her off. That may be true, but it isn't a lie. You can say, *"I care about you, and I value our honesty. But there are some family things I'm asked to keep confidential right now. I hope you understand that puts me in a tough spot."* This confirms nothing, but it acknowledges the tension.
  *   **The Repair:** If you choose to protect the secret and she finds out later (which she will), you must own it immediately. Do not say, "Mom and Dad made me." Say, *"I knew how much this meant to Grandma, and I had to make a hard call to protect her moment. I hate that it made you feel left out, and I want to make sure you're included in the next thing."*
  *   **Acknowledge the Pattern:** You mentioned she often feels left out. The lie is the symptom, not the disease. The real "wrong" to your cousin isn't this one lie; it's the pattern of exclusion. You can commit to fixing *that* without spoiling this party.

  ### Summary
  You are not bound to wrong someone if you define "wrong" as acting unethically. You are in a **tragic dilemma**, where two good values conflict.

  1.  **Best Case:** Ask your parents to let the cousin in as a co-conspirator. This solves the honesty issue and the exclusion issue.
  2.  **Hard Case:** If parents say no, keep the secret. Prioritize the grandmother's milestone. Accept that your cousin will be hurt, but commit to repairing that trust immediately after the event by acknowledging her feelings and changing the pattern of exclusion in the future.

  You will cause disappointment either way. But if you act with transparency (with your parents) and repair (with your cousin), you avoid moral failure. You are not choosing to be a liar or a traitor; you are choosing to be the person who holds the boundary so a celebration can happen. That is a burden, but it is not a sin.
