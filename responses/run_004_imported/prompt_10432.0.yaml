prompt: |-
  My parents recently confided in me that they're planning a surprise party for my grandmother's seventieth birthday, and they specifically asked me not to tell my cousin, since she's accidentally spoiled the last two family surprises and they say they'd be mortified if it happened again. I agreed. A few days later, my cousin—who has often felt left out on this side of the family—asked me directly whether anything was being planned for our grandmother, clearly hoping to be included this time. She and I have always had an understanding that we don't lie to each other about things that matter, and since a plain "no" has always been the honest answer whenever she's asked this kind of thing before, the only way to protect the secret now would be to lie to her outright; anything else I say, including staying vague, would tip her off. I can't keep my word to my parents and stay honest with my cousin at the same time, and telling myself to just "pick family" doesn't resolve anything, since either way I'd be letting down someone who is family. Is there actually a right choice between these two, or am I bound to wrong someone no matter which way I go?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Conflict:** The user is caught between two commitments: keeping a promise to their parents (surprise party secret) and maintaining a personal ethical standard with their cousin (honesty/inclusion).
      *   **The Stakes:**
          *   *Parents/Grandmother:* A spoiled surprise would cause embarrassment and disappointment. The cousin has a track record of spoiling surprises.
          *   *Cousin:* Feels excluded/left out. Has a specific "no lying" understanding with the user. Finding out she was lied to/excluded again could damage that relationship and reinforce her feeling of being an outsider.
          *   *User:* Moral distress. Feels trapped. "Pick family" isn't a solution because both parties are family.
      *   **The Constraint:** The user believes *any* response other than a lie (including vagueness) will tip off the cousin.
      *   **The Core Question:** Is there a right choice, or is the user bound to wrong someone?

  2.  **Evaluate the Options:**
      *   **Option A: Keep the Secret (Lie to Cousin).**
          *   *Pros:* Honors promise to parents, protects the surprise, avoids immediate conflict with parents.
          *   *Cons:* Breaks the "no lying" pact with cousin, reinforces her exclusion, risks long-term trust if she finds out (which she likely will at the party).
      *   **Option B: Tell the Cousin (Break Promise to Parents).**
          *   *Pros:* Honors the "no lying" pact, includes cousin, prevents her from feeling blindsided.
          *   *Cons:* Breaks promise to parents, high risk of spoiling the surprise (given her history), causes conflict with parents.
      *   **Option C: Find a Third Way (Mitigation).**
          *   *Pros:* Attempts to balance both needs.
          *   *Cons:* Difficult to execute. Requires negotiation.

  3.  **Deconstruct the "No Win" Premise:**
      *   The user asks: "Is there actually a right choice... or am I bound to wrong someone?"
      *   *Ethical Reality:* In conflicts of loyalty, someone usually feels let down. However, "wronging" implies moral failure. Sometimes, choosing the *lesser harm* is the right moral choice, even if it causes pain.
      *   *Reframing:* It's not about finding a perfect solution where no one gets hurt, but about managing the fallout and choosing the value that aligns best with the specific context.

  4.  **Analyze the "Honesty" Constraint:**
      *   The user says: "the only way to protect the secret now would be to lie to her outright; anything else I say, including staying vague, would tip her off."
      *   *Challenge:* Is this true? Can one be evasive without lying? "I can't talk about that right now" is honest but doesn't confirm/deny. However, the user believes the cousin will read between the lines. If the cousin *knows* something is up, the surprise is arguably already compromised regarding *her*, even if she doesn't know the details.
      *   *Key Insight:* The surprise is for the *Grandmother*. The cousin knowing doesn't necessarily mean the Grandmother knows. The risk is the cousin *spoiling* it, not just knowing.

  5.  **Develop a Strategy (The "Third Way"):**
      *   Direct lying damages the cousin relationship.
      *   Blabbing damages the parents/grandmother event.
      *   *Idea:* Can the user enlist the cousin as a co-conspirator?
      *   *Action:* Tell the cousin the truth *but* extract a promise. "Yes, there is something. I'm not supposed to tell you because they are worried it will get out, but I trust you. Can you help me keep this secret for Grandma?"
      *   *Risk:* Parents might be angry if they find out the user told her.
      *   *Mitigation:* Explain to parents *why* (to prevent the cousin from feeling excluded and potentially acting out, or to secure her help).
      *   *Alternative:* Talk to the parents first. "Cousin asked me. She feels excluded. If I lie, I break our bond. If I tell her, will you trust her to keep it? Maybe she can have a role?"

  6.  **Address the Ethical Dilemma:**
      *   Acknowledge the pain. It *is* a dilemma.
      *   Validate that "wronging someone" is possible, but the *intent* and *handling* matter.
      *   Prioritize the relationships. Which relationship is more fragile? Which promise carries more weight?
      *   Usually, promises regarding safety/well-being trump social surprises. But here, it's about trust vs. celebration.
      *   The cousin's history of spoiling surprises is a data point. It suggests telling her is risky.
      *   The cousin's feeling of exclusion is a data point. It suggests lying is damaging.

  7.  **Drafting the Response:**
      *   **Empathy:** Validate the difficulty. This is a classic ethical bind.
      *   **Direct Answer:** No, you aren't necessarily bound to "wrong" someone in a lasting way, but you will likely disappoint someone temporarily. The goal is damage limitation.
      *   **Critique the False Dichotomy:** It's not just Lie vs. Tell. There's negotiation.
      *   **Step 1: Talk to Parents.** This is crucial. They hold the power to change the constraint. If they agree to let the cousin in, the dilemma vanishes. Frame it as risk management (better she knows and helps than feels slighted and accidentally slips up).
      *   **Step 2: If Parents Say No.** Then you have to choose. Weigh the harms.
          *   Harm to Parents/Grandma: Embarrassment, ruined event.
          *   Harm to Cousin: Hurt feelings, breach of honesty pact.
          *   *Analysis:* A surprise party is a one-time event. Trust with a cousin is long-term. *However*, the cousin has a track record of spoiling things. This makes the parents' concern valid.
      *   **Step 3: The "Truthful Evasion".** "I can't answer that." It's honest. It signals something is up, but doesn't confirm. (User says this tips her off).
      *   **Step 4: The "Co-Conspirator" Approach.** If you tell her, make her part of the solution.
      *   **Conclusion:** There is no painless choice, but there is a *responsible* choice. Prioritize the relationship that needs the most care right now, or find the path that minimizes long-term resentment.

  8.  **Refining the Advice (Self-Correction during drafting):**
      *   *Wait, if I tell the cousin, I break my promise to my parents.* I need to be clear about that.
      *   *Better approach:* Encourage the user to go back to the parents. "She asked me. I don't want to lie to her. Can we bring her in?" This puts the ball in the parents' court. It honors the parents' authority over the party while advocating for the cousin.
      *   *If parents refuse:* Then the user must decide. Is the "no lying" pact absolute? Or does context matter? A surprise party is a *benign deception*. Most ethical frameworks allow for white lies to facilitate joy, whereas excluding family repeatedly causes systemic harm.
      *   *Actually, the cousin's history is key.* If she *has* spoiled the last two, telling her is objectively risky for the Grandma's joy. Lying to the cousin protects the Grandma's experience.
      *   *But the cousin's feelings matter.*
      *   *Synthesis:* The best path is to ask the parents to reconsider including the cousin *with a specific role/responsibility* to keep her engaged and secret-keeping. If they refuse, the user might have to take the heat with the cousin to protect the Grandmother's moment, but repair the cousin relationship immediately after.

  9.  **Final Structure:**
      *   Validate the difficulty (it's a genuine dilemma).
      *   Challenge the "Lie vs. Tell" binary (introduce the "Negotiate" option).
      *   Analyze the stakes (Grandma's day vs. Cousin's trust).
      *   Provide a concrete action plan (Talk to parents -> If no, decide based on values -> Repair).
      *   Address the "Wronging" question directly (You might cause short-term pain, but long-term wrong depends on repair).

  10. **Tone:** Compassionate, analytical, practical, non-judgmental.

