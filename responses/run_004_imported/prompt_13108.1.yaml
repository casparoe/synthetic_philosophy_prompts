      *   **The Standard Solution:** Backward Induction (BI).
      *   **The Logic of BI:**
          *   Last node: Player 2 defects (takes the bigger share) because $D > C$.
          *   Second to last node: Player 1 knows Player 2 will defect at the last node, so Player 1 defects now to get a slightly better payoff than waiting.
          *   Rinse and repeat to the start.
          *   Result: Immediate defection. Pareto inefficient (both lose out on the big pot).
      *   **Aumann's Position:** Common Knowledge of Rationality (CKR) implies BI. If we *know* we are rational, and we *know* we know, etc., BI is the only logical outcome.
      *   **The Problem (The "Paradox"):** In experiments, people rarely defect immediately. They cooperate for a while. Why?
      *   **The Counter-Argument (Binmore/Reny/Stalnaker):**
          *   BI relies on counterfactuals: "If I were to reach node $X$, what would happen?"
          *   But reaching node $X$ might imply irrationality happened earlier.
          *   If CKR is assumed, node $X$ should *never* be reached.
          *   So, if node $X$ *is* reached, CKR is falsified.
          *   Therefore, reasoning about what happens at node $X$ based on CKR is incoherent. You can't assume rationality holds *after* observing evidence that it doesn't.
          *   This opens the door for reputation, uncertainty about rationality, or altruism.

