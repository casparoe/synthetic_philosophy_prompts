answer: |-
  This is a fantastic question. You have hit on one of the most notoriously counterintuitive passages in *Principia Ethica*. Your intuition that this sounds "wild" is shared by almost everyone who reads it—including many of Moore's contemporaries (like Bertrand Russell and Lytton Strachey, who were part of the Bloomsbury Group and wrestled with these exact claims).

  To answer your main question immediately: **Yes, the engine behind this claim is absolutely the Principle of Organic Unities.** However, Moore is combining that with a specific view about the nature of **conscious experience** that makes the claim less about "looks vs. character" and more about "abstract thought vs. embodied experience."

  Here is a reconstruction of the argument, an explanation of how Organic Unities drives it, and a defense of why this might not actually undermine the value of friendship (though it does complicate it).

  ### 1. Step-by-Step Reconstruction of the Argument

  Moore is analyzing the **intrinsic value of states of consciousness**. For Moore, the only things that are intrinsically good are certain complex states of mind (consciousness of beautiful objects, consciousness of loved persons, etc.).

  Here is the logic of Section 122 broken down:

  *   **Premise 1 (The Components of Affection):** A state of "personal affection" is a complex whole. It typically contains two main cognitive parts:
      1.  Appreciation of the person's **mental qualities** (character, mind, soul).
      2.  Appreciation of the person's **corporeal expression** (face, voice, actions, physical presence).
  *   **Premise 2 (The Contribution of Mind):** Including the appreciation of mental qualities makes the *whole state* of affection much more valuable than if it were absent. ( Loving a mind is better than loving a mannequin).
  *   **Premise 3 (The Isolation Test):** However, if we isolate the appreciation of mental qualities *by itself* (trying to love the mind without any reference to the body), the value of that specific *part* drops significantly.
  *   **Premise 4 (The Comparison):** The state of consciousness involved in appreciating **mere corporeal beauty** (e.g., looking at a beautiful sunset or a beautiful face without thinking about character) is a richer, more valuable *experience* than the state of consciousness involved in appreciating **mental qualities in isolation**.
  *   **Conclusion 1 (Organic Unity):** The high value of "admiring character" lies not in its standalone value, but in how much it boosts the value of the **whole** (when combined with bodily appreciation).
  *   **Conclusion 2 (The Shocking Claim):** Therefore, the *experience* of admiring a good character (alone) is potentially less valuable than the *experience* of admiring a beautiful body (alone).

  ### 2. Is "Organic Unities" the Driver?

  **Yes.** This is a textbook application of Moore's Principle of Organic Unities.

  Recall Moore's definition: *The value of a whole must not be assumed to be the same as the sum of the values of its parts.*

  Moore is arguing that:
  $$ \text{Value}(\text{Mind Appreciation} + \text{Body Appreciation}) \gg \text{Value}(\text{Mind Appreciation}) + \text{Value}(\text{Body Appreciation}) $$

  He is also making a claim about the **parts in isolation**:
  $$ \text{Value}(\text{Mind Appreciation}_{\text{isolated}}) < \text{Value}(\text{Body Appreciation}_{\text{isolated}}) $$

  **Why does he think this?**
  This is where students often get stuck. It sounds like Moore is saying "Beauty is better than Goodness." But he isn't talking about the *objects*; he is talking about the **conscious states**.

  *   **The Object:** A virtuous character is intrinsically better than a pretty face. Moore agrees.
  *   **The State of Consciousness:** The *feeling* of contemplating a virtuous character is abstract, dry, and difficult to sustain without physical cues. The *feeling* of contemplating a beautiful face is vivid, immediate, and emotionally resonant.

  Moore is an empiricist about the mind. He thinks we cannot actually access "mental qualities" directly. We only access them through "corporeal expression" (words, looks, actions). When you try to strip away the body to love *only* the mind, you are left with a thin, abstract cognitive act. When you look at a beautiful face, you have a rich, sensory aesthetic experience. For Moore, **intrinsic value resides in the experience**, not the object. Therefore, the richer sensory experience (beauty) has more intrinsic value *as a state of mind* than the thinner cognitive experience (abstract character analysis).

  ### 3. Is this as "Weird" as it Sounds? (Charitable vs. Uncharitable)

  It is weird, but you can read it charitably.

  **The Uncharitable Reading (What you are worried about):**
  Moore is saying physical beauty matters more than moral character in friendship. This would indeed undermine the idea that personal affection is a "pillar" of the good life. It would make *Principia Ethica* sound superficial.

  **The Charitable Reading (The "Embodiment" Argument):**
  Moore is making a point about **human psychology and embodiment**.
  1.  **We are not angels:** We cannot love a disembodied mind. To try to do so is to engage in a fantasy. A "valuable affection" must be grounded in reality.
  2.  **The Whole is the Thing:** He is not lowering the value of friendship; he is insisting that *true* friendship is an **embodied unity**. You cannot chop off the physical interactions (hugs, tone of voice, shared activities) and keep the "real" value of friendship.
  3.  **The Role of Aesthetics:** He is elevating the aesthetic component of love. He is saying that the *sensory* experience of being with the person you love is not just a vessel for the "real" (mental) love; the sensory experience is itself a massive chunk of the value.

  So, he isn't saying "Looks matter more than character." He is saying: **"The experience of loving a person is so valuable precisely because it fuses the appreciation of their character with the appreciation of their physical presence. If you remove the physical, the value collapses."**

  ### 4. Seminar Discussion Points

  If you want to shine in the seminar, here are three angles you can take on this passage:

  **A. The Epistemological Constraint**
  Moore admits: *"It is, indeed, very difficult to imagine what the cognition of mental qualities alone, unaccompanied by any corporeal expression, would be like."*
  *   **Point:** Moore is arguing that we literally *cannot* have the high-value experience of mind-appreciation without the body. Therefore, evaluating the mind-appreciation in isolation is evaluating a psychological impossibility. Is it fair to judge the value of a part that cannot exist without the whole?

  **B. The Definition of "Intrinsic Value"**
  *   **Point:** Remind the class that for Moore, "Intrinsic Value" applies to **states of consciousness**, not external objects.
  *   **Argument:** A virtuous soul is *good*, but the *contemplation* of a virtuous soul is a specific mental state. Moore is claiming that the mental state of "Aesthetic Appreciation" is more intense/vivid than the mental state of "Moral Admiration." This preserves the idea that Character is better than Beauty (as objects), while maintaining that Aesthetic Experience is more valuable than Moral Cognition (as experiences).

  **C. The Threat of Fragmentation**
  *   **Point:** This passage shows the danger of the "Method of Isolation" (which Moore uses elsewhere).
  *   **Argument:** Moore insists we must isolate parts to find their intrinsic value. But here, he admits that isolating the "mental appreciation" from the "bodily expression" drains it of value. Does this undermine his own methodological commitment to isolation? If the value disappears upon isolation, can we really say we've found the intrinsic value of the part?

  ### Summary for your notes:
  1.  **Is it Organic Unities?** Yes. The value of the whole (Affection) is greater than the sum of parts (Mind + Body), and the parts derive their significance from their contribution to the whole, not their standalone value.
  2.  **Is he prioritizing looks over character?** No. He is prioritizing **embodied experience** over **abstract cognition**. He thinks the *experience* of beauty is more vivid than the *experience* of thinking about virtue.
  3.  **Does it undermine friendship?** No, it redefines it. It argues that friendship is not a mind-to-mind telepathy; it is an embodied interaction where the physical presence is constitutive of the value, not just a tool to access the mind.

  It is a weird passage, but it's weird because Moore is trying to be brutally honest about human psychology: we love people *in the flesh*, and stripping away the flesh strips away the value.
