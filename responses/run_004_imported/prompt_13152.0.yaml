answer: |-
  Thank you all for being here. And thank you for the kindness you've shown me over the last six years. I want to start by saying that I am not leaving because I think *you* are the problem. I know the people in this room. I know your decency, your commitment to the community, and the genuine care that brought us all here in the first place. If I thought this was about bad people, I'd have left a long time ago.

  I'm leaving because I've become convinced that it's about the structure itself.

  Some of you know I've been doing a bit of reading lately. A friend introduced me to an essay by the French philosopher Simone Weil, written during the Second World War, called *On the Abolition of All Political Parties*. It's a difficult text, but it clarified something that had been nagging at me, especially after our candidate selection meeting earlier this month.

  Weil argues that a political party is not just a group of people who agree on things. She describes it as a machine designed to generate collective passion. Its primary function isn't to find the truth or serve the public good; its primary function is to grow itself and to win. To do that, it has to exert pressure on the minds of its members.

  She writes that the criterion for thinking inside a party eventually becomes: "Is this good for the party?" rather than "Is this true?" or "Is this just?"

  When I sat in that selection meeting, and when I saw the messages in the whip's group chat telling us how to vote before we'd heard a single argument, I realized that pressure was at work. It wasn't malice. It was the machine doing what machines do. Weil says that even in a democratic branch, in a harmless-looking room like this one, the party structure contains totalitarianism "in embryo." Not because we are totalitarians—we aren't—but because the mechanism demands that we surrender our individual judgment to the collective will.

  Now, I can hear the question forming. It's the obvious one. If we abolish parties, how do we organize? How do we win elections? How do we govern?

  Weil doesn't suggest chaos. She suggests that we organize around specific truths and specific public goods, rather than around team allegiance. She imagined a politics where people associate temporarily to solve a problem or advance a principle, without demanding that everyone sign up for a permanent, all-encompassing label. It means valuing the independence of the mind over the discipline of the whip. It's a harder way to work, because you can't rely on party loyalty to carry you. You have to persuade people every single time, based on the merit of the idea.

  I'm telling you this not to lecture you, and certainly not to ask you all to resign tonight. I know that for some of you, the party is still the only vehicle available to do good work, and I respect that.

  But for me, the cost has become too high. I can no longer be part of a machine that asks me to prioritize its survival over my own judgment.

  To those of you who are feeling that same quiet friction—the ones who felt uncomfortable in that meeting but stayed silent—I just want to say: you aren't crazy. That feeling is your mind resisting the pressure. You can stay in the branch and still keep your own counsel. You can love the people in this room without surrendering your intellect to the structure.

  I am leaving the committee, and I am leaving the party. But I am not leaving the fight for a better community, and I am certainly not leaving my friends. I hope we can continue to work together on the things that matter, outside the shadow of the whip.

  Thank you for letting me serve. Thank you for the friendship. And thank you for listening.
