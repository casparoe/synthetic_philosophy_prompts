answer: |-
  1. In my novel, five strangers share a subway platform for ninety seconds while an elderly man collapses. Two help, one hesitates and leaves, and two ignore it entirely. My early readers argue that judging these characters based on that brief window is a "retrospective illusion"—that the situation did all the causal work. As a defender of character, do you believe a ninety-second snapshot can ever be morally probative, or is the reader's urge to find "who they really are" in that moment a narrative bias we should resist?

  2. I want to press on the empirical evidence often used to support that situationist view. Consider Darley and Batson's Good Samaritan study, where seminarians training for the priesthood failed to stop for a slumped victim simply because they were induced to hurry. When you pair that specific result with Mischel's broader finding that trait-behavior correlations across situations rarely climb past .3, what exactly is a single result of that kind supposed to license us to conclude about a person's traits? Does the seminarian's failure prove the trait of "compassion" is absent, or merely that it was occluded?

  3. *[Follow-up to Q2]* If your response is that traits are probabilistic rather than deterministic—that the seminarian still possesses the trait even if he fails to act on it some of the time—where do you draw the threshold? How low can the correlation between possession of a virtue and the corresponding behavior drop before the word "trait" ceases to do any explanatory work and becomes just a label for a hope?

  4. Some defenders of character have retreated to narrower, "if-this-situation-then-that-behavior" local traits, in the spirit of Mischel and Shoda's later work on cognitive-affective units. Does adopting this model save virtue talk only by quietly abandoning the cross-situational stability that Aristotle's account of virtue was supposed to have in the first place? If a person is "honest-at-work" but "dishonest-with-taxes," do we still have a unified moral agent, or just a collection of fragmented habits?

  5. *[Follow-up to Q4]* If you argue that this fragmentation is acceptable and that we don't need global unity to sustain moral responsibility, how do we then justify praise or blame? If I praise someone for being "honest-at-work," am I praising *them*, or am I merely praising the specific environmental cues that triggered that local module?

  6. You have emphasized *phronesis*, or practical wisdom, defining virtue as the capacity to respond well to the particulars of a situation rather than a disposition that fires identically regardless of context. If this is the case, doesn't it mean the situationist literature was attacking a caricature of character that no careful Aristotelian ever held? If virtue requires sensitivity to context, then behavioral variance across different contexts should confirm the theory, not threaten it.

  7. *[Follow-up to Q6]* If it was indeed a caricature, why was that objection received as a serious threat to virtue ethics rather than dismissed as a misreading of the view? Does the fact that it landed so heavily suggest that virtue ethicists had been speaking loosely enough about "stability" to invite the misunderstanding in the first place?

  8. My book asks the reader to decide whether the characters' reactions on the platform reveal something stable or whether the "character" is a story we tell afterward to make sense of chaos. Is the "retrospective illusion" charge itself a category error? Is it possible that while the *prediction* of behavior is situationally constrained, the *evaluation* of character remains valid because it assesses the quality of the will in that specific moment, regardless of what the person would have done elsewhere?

  9. One of my characters hesitates, looks at the collapsed man, and then walks on. In a virtue ethics framework, is that hesitation a sign that the trait is weak, or is the decision to walk on the only data point that matters? If we count the internal conflict as part of the moral texture, does that insulate character theory from empirical falsification by making the "real" trait invisible to outside observation?

  10. Finally, I want to leave no room for hedging. Philosophers often say their views are compatible with empirical data, but compatibility is a low bar. Can you name a specific empirical finding—a concrete result from a psychological study—that would actually count as evidence against your position and force you to abandon the reality of character traits?
