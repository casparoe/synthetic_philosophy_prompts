      *   **Specific Questions to Address:**
          1.  Why does the crowd destroy someone then forget them quickly?
          2.  Why is anonymity load-bearing?
          3.  What is the specific structural role of *envy*?
          4.  Are algorithms a new kind of leveling or just faster 1840s tech?

  2.  **Deconstruct Kierkegaard's *The Present Age* (and related texts):**
      *   *Core Concept:* "Leveling" (*Nivellering*). This isn't equality; it's a downward pull to the lowest common denominator.
      *   *The Public:* An abstraction. It's not real people; it's a phantom created by the press. It has no body, no responsibility, no face.
      *   *The Press:* The machine that creates the Public. It turns reflection into action without commitment.
      *   *Envy:* The hidden motive force. It's not just wanting what someone else has; it's resenting that they *are* something while you are nothing. It demands leveling.
      *   *Reflection/Passion:* The Present Age is reflective, passionless. It thinks about doing things rather than doing them.
      *   *The Corsair Affair:* Kierkegaard challenged the paper to attack him. They did, caricaturing him. He realized this wasn't personal; it was the mechanism of "the public" eating the individual to maintain the level.

  3.  **Address the Specific Questions (Drafting the Mechanics):**

      *   *Q1: Forgetfulness/Amnesia.*
          *   Kierkegaard's view: The Public is an abstraction. Abstractions don't have memory; they have *attention*. Once the "leveling" is achieved (the tall poppy is cut), the tension is resolved. The Public moves on because it was never personally invested. It was a game of reflection, not passion.
          *   Novel application: The mob isn't angry; they're *bored*. The cancellation is entertainment that resolves boredom temporarily.

      *   *Q2: Anonymity.*
          *   Kierkegaard's view: Responsibility requires an individual. The Public is "no one." Therefore, no one is responsible. The press allows people to act without being anyone.
          *   Novel application: The characters tweeting aren't "people"; they are nodes in the Public. If they were named, they'd have to stand by it. Anonymity (or just the feeling of being a drop in the ocean) allows the cruelty.

      *   *Q3: Envy.*
          *   Kierkegaard's view: This is crucial. Envy is the *secret* motive. In a religious/passionate age, you admire the great person. In a reflective age, you resent them. You can't reach their height, so you pull them down. It's negative solidarity.
          *   Novel application: The academic isn't cancelled because she's evil; she's cancelled because she's *visible*. The envy is disguised as moral righteousness.

      *   *Q4: Algorithms vs. 1840s Press.*
          *   Kierkegaard's view: The mechanism is the *relation* between individual and abstraction.
          *   Novel application: Algorithms accelerate the *reflection*. They make the "phantom crowd" feel more real because the feedback loop is instant. It's not a new cart; it's a jet-engine on the 1840s cart. It makes leveling instantaneous rather than gradual.

  4.  **Synthesize for the Novelist (Character & Plot):**
      *   How does the protagonist *think*? She shouldn't just be angry. She should be confused by the *lack* of anger in her attackers.
      *   How does the mob *act*? Not like a raging horde, but like a bored committee.
      *   The "Corsair" parallel: Kierkegaard *invited* the attack to prove a point. The protagonist's "clumsy tweet" is the invitation, but she didn't mean it as one.
      *   Resolution: She can't fight the Public. She has to become an Individual again.

  5.  **Refine the Tone:**
      *   Avoid academic jargon where possible, but keep the philosophical precision.
