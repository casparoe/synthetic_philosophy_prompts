answer: |-
  Your instinct is correct: your editor is applying a legalistic standard of evidence to an anthropological and epistemological problem. While the editor is right that this is technically "testimonial" (someone saying something happened), classifying it merely as "hearsay" or "folklore" misses the specific cognitive work the hunters are doing.

  You are looking for a name for a way of knowing that is neither **empirical observation** (the camera trap), nor **deductive inference** (the tracks), nor **authoritative testimony** (the mammalogist).

  The distinct category of knowledge you are encountering is best described as **Traditional Ecological Knowledge (TEK)**, but the specific mechanism at work is **Relational Identification** (or **Analogical Taxonomy**).

  Here is why this constitutes a distinct epistemic category, and how you might defend it in your piece.

  ### 1. It is Structural, Not Just Sighting-Based
  When the mammalogist says, "I saw it," she is offering a data point of *presence*. When the hunters say, "It is built like a small buffalo with a fox's face," they are offering data about *morphology*.

  This is not merely poetic flourish; it is data compression. In the absence of Latin binomials or metric measurements, the hunters are using known local fauna as reference points to convey specific physical traits:
  *   **"Small buffalo":** Conveys mass, stance, gait, shoulder height, and perhaps hoof structure.
  *   **"Fox's face":** Conveys snout length, ear placement, and possibly facial markings.

  This is not "I saw a monster." This is a **phenomenological description**. They are describing how the animal *appears* within their lived environment, using a shared visual vocabulary. It is distinct from the mammalogist's claim because it survives the absence of the witness. The mammalogist's knowledge dies if you discount her credibility; the hunters' knowledge persists as a cultural artifact that describes the animal's physical reality independent of a specific moment of sighting.

  ### 2. It Implies Longitudinal Coexistence
  A single sighting (mammalogist) proves the animal was there *once*. A camera trap proves it was there *at dusk on Tuesday*.

  The hunters' claim, however, relies on a **stable local taxonomy**. For a specific local word to exist, and for a consensus description ("buffalo/fox") to be shared among independent hunters, the animal must have been present long enough to be integrated into their linguistic and cognitive landscape.

  This is a form of **historical evidence**. It suggests the animal is not a transient anomaly or a recent migration, but a resident species that has co-evolved with the human population's understanding of the forest. In conservation biology, this is often called **Ethnozoological Corroboration**. It validates the *continuity* of the species, not just its current existence.

  ### 3. It is Relational Epistemology
  Western science tends to define things by what they *are* in isolation (DNA, measurements). Many indigenous and local knowledge systems define things by how they *relate* to the known world.

  The hunters are engaging in **Relational Identification**. They are triangulating the unknown using the known. This is not "weaker" science; it is a different operating system. In a region where distinct species like the Saola and the Giant Muntjac were discovered by Western science only after locals had known them for centuries, this relational knowledge often precedes taxonomic confirmation.

  If you treat this as "hearsay," you are judging a relational map by the standards of a satellite photograph. The map is not the territory, but it proves someone has walked the territory.

  ### How to Frame This in Your Story
  You do not need to overrule your editor to honor this evidence; you simply need to contextualize it correctly. Do not present the hunters' claims as *proof of existence* (which invites the "hearsay" critique). Present them as **proof of concept** and **proof of niche**.

  *   **Don't write:** "Hunters say the animal exists."
  *   **Do write:** "The local taxonomy already contains a space for this animal."

  You can frame the hunters' testimony as the **hypothesis generator** that guided the science, rather than the **verification** of it. The camera trap and tracks verify the *presence*; the hunters verify the *identity*.

  ### A Vocabulary for Your Notebook
  If you need a specific term to anchor this in your reporting notes or to explain it to your editor, consider these:

  *   **Ethnozoological Evidence:** Recognizes the hunters' knowledge as a systematic study of animals, not just stories.
  *   **Morphological Analogy:** Highlights that they are providing physical data via comparison.
  *   **Phenomenological Testimony:** Emphasizes that they are describing the *experience* and *appearance* of the animal in the world, rather than making a scientific classification.
  *   **Cognitive Presence:** The animal exists in the local mind, which implies it exists (or existed) in the local landscape.

  ### The Verdict
  Your editor is treating the hunters as **witnesses to an event**. You are correctly recognizing them as **witnesses to a pattern**.

  The camera trap captures a moment. The tracks capture a passage. The mammalogist captures an encounter. But the hunters capture a **relationship**. That is a genuinely distinct way of knowing. It is the difference between proving a stranger entered your house (camera trap) and your family having a name for the ghost that has lived in the walls for generations (the hunters). The latter does not prove the ghost is real to a skeptic, but it proves the house has a history that the skeptic is ignoring.

  In the Annamites, where the Saola was discovered in 1992 only after decades of local knowledge was finally listened to, that "third thing" you sense is often the most reliable predictor of zoological truth. Keep it in the piece, but label it for what it is: not a substitute for science, but the cultural substrate that makes the science possible.
