answer: |-
  # The Asymptote and the Argument

  In the ecology of rationalist discourse, Aumann's Agreement Theorem occupies a unique niche. It is less a mathematical result than a moral cudgel. The theorem, proven by Robert Aumann in 1976, demonstrates that two Bayesian agents who share a common prior and have common knowledge of each other's posterior probabilities cannot agree to disagree. If they know what the other believes, and they know that the other knows what they believe, and so on, their probabilities must converge. Later work by Geanakoplos and Polemarchakis showed this convergence happens dynamically through the exchange of posteriors, while Milgrom and Stokey's no-trade theorem extended the logic to betting markets: speculative trade based on private information is impossible between rational agents starting from a Pareto-optimal allocation.

  The moral extracted from this mathematics, particularly within the communities surrounding *Overcoming Bias* and *LessWrong*, is severe. It suggests that persistent disagreement between two truth-seekers who respect each other's rationality is evidence of a sin. Either one is lying, one is irrational, or, as Robin Hanson and Tyler Cowen have suggested, both are succumbing to "self-favoring priors"—unconsciously privileging their own judgment simply because it is their own. In this view, if you cannot convince an epistemic peer, you should drastically lower your confidence. To remain steadfast is to claim a special status you cannot justify.

  Yet, observe the rationalists themselves. They argue for years. They publish counter-arguments, update slightly, but rarely converge to the identical posterior. The moral of Aumann hangs over these exchanges like a judgment, implying that the community is failing at its own core mission.

  This tension demands resolution. We are left with two competing responses. The first, the "Moral Imperative" view (championed by Hanson), treats the theorem as a normative command: since we *ought* to be rational, we *ought* to agree, and failure to do so signals hidden bias. The second, the "Idealization" view, treats the theorem as a limit case that tells us little about actual human discourse because its assumptions—specifically common priors and common knowledge of rationality—are empirically false.

  While the Moral Imperative is a useful heuristic for humility, it is ultimately epistemically dangerous. It relies on a fiction of the "View from Nowhere." I defend the Idealization view. Persistent disagreement is not necessarily a failure of rationality; it is often the inevitable result of situated cognition. However, this does not grant license for dogmatism. We must distinguish between disagreements rooted in divergent priors (which are permissible) and disagreements rooted in processing errors (which are not). Extended disagreement should move your credence only when it signals a likely error in likelihood estimation, not merely because a peer holds a different view.

  ### The Weight of the Common Prior

  To understand why the Moral Imperative fails, we must scrutinize the "common prior" assumption. Aumann's theorem requires that before agents receive any private information, they assign the exact same probability to every event. They are, effectively, identical minds before they open their eyes.

  For human beings, this is impossible. Priors are not arbitrary settings on a Bayesian calculator; they are compressed histories. Your prior probability that "trustworthy institutions protect citizens" is shaped by your nationality, your class, your trauma, and your education. My prior is shaped by mine. To demand a common prior is to demand that we strip away the very data that constitutes our cognitive architecture.

  Hanson's critique of "self-favoring priors" attempts to bypass this by arguing that while our *experiences* differ, we should agree on the *weight* of those experiences before we have them. He asks: If you and I were swapped at birth, should we not expect to hold each other's current beliefs? If yes, then our priors are effectively common, and our disagreement is just about who had the better luck of evidence.

  This is a compelling thought experiment, but it collapses under the weight of embodiment. We are not interchangeable souls piloting meat suits. Cognitive styles, risk tolerances, and heuristic libraries are partially heritable and partially cemented by early development. A person with a high sensitivity to threat will legitimately assign a higher prior probability to danger than a person with a low sensitivity, even given the same evidence. This is not a "bias" in the sense of an error; it is a difference in utility functions and perceptual weighting.

  If we accept the Moral Imperative, we are forced into a "modesty spiral." If I meet a peer who disagrees with me, I must update toward them. But if they are also following the Moral Imperative, they must update toward me. We should theoretically converge instantly. The fact that we don't—even in good faith—suggests the condition of common priors is not met. To insist otherwise is to accuse the other party of dishonesty or irrationality simply for having a different life history.

  ### The Breakdown of Common Knowledge

  The second pillar of Aumann's theorem is common knowledge of rationality. I must know you are rational. You must know I am rational. I must know that you know that I am rational, *ad infinitum*.

  In the real world, this chain breaks almost immediately. I may believe you are rational. I may even believe you believe I am rational. But do I believe that you believe that I believe you are rational? In high-stakes disagreements, the answer is usually no. I suspect you are under the influence of a bias I have identified. You suspect the same of me.

  This is not necessarily cynicism; it is a recognition of bounded computation. We cannot verify each other's rationality perfectly. We use "rationality" as a label for "agrees with me on core axioms." When you deviate, my confidence in your rationality drops. Consequently, your posterior probability ceases to be a pure signal of private evidence; it becomes a noisy signal contaminated by suspected bias.

  The Geanakoplos-Polemarchakis dynamic result relies on agents treating the other's announced posterior as a sufficient statistic for all their private information. But if I suspect your rationality is compromised, I cannot treat your posterior as a sufficient statistic. I have to guess how much of your view is evidence and how much is error. This breaks the convergence guarantee. We can talk forever, announcing numbers, without ever meeting, because we are both discounting the other's signal based on a model of their fallibility that they do not share.

  ### When Disagreement Should Move You

  Defending the Idealization view risks sliding into epistemic relativism. If different priors justify persistent disagreement, can't anyone justify anything? "Oh, I just have a prior that the earth is flat."

  No. The defense of divergent priors is not a defense of arbitrary priors. It is a defense of the fact that human priors are complex adaptations to different environments. This leads to a specific criterion for when extended disagreement should move your credence.

  We must distinguish between **prior divergence** and **likelihood error**.

  1.  **Prior Divergence:** This occurs when two agents weigh the same evidence differently due to foundational differences in worldview or experience. For example, a secularist and a theologian may look at a historical text. The secularist's prior on miracles is near zero; the theologian's is non-zero. They can process the text perfectly rationally according to their own priors and never agree. In this case, extended disagreement is **compatible with both reasoning correctly**. You should not significantly move your credence merely because they disagree, provided you have accounted for their different baseline assumptions.
  2.  **Likelihood Error:** This occurs when agents share a prior (or close enough) but disagree on how to update given specific evidence. This is the domain of math, logic, and empirical verification. If we agree on the rules of probability and the reliability of a sensor, but I calculate a 90% probability and you calculate 10%, one of us has made a calculation error. In this case, extended disagreement **should move your credence**. It is strong evidence that you have made a mistake in processing, because the "common prior" condition is effectively met by the shared formal system.

  The failure of the rationalist community is often conflating these two. They treat prior divergence (e.g., political values, risk tolerance) as if it were likelihood error, demanding convergence where none is mathematically required. Conversely, they treat likelihood error (e.g., factual claims about the world) as prior divergence, allowing "agreeing to disagree" on matters of fact.

  ### The Verdict on the Moral

  The moral attached to Aumann's theorem—that disagreement is a sin—is a category error. It mistakes a theorem about closed, abstract systems for a law of open, embodied minds.

  If you accept the Moral Imperative, you are implicitly claiming that there is a "Correct Prior" accessible to humans. But there is no such thing. There are only priors that are more or less adaptive to specific environments. To demand that I adopt your prior is to demand that I pretend to have lived your life.

  However, this does not mean disagreement is useless. It is data. If I consider you an epistemic peer, and we disagree, I must ask: *Is this a prior difference or a processing difference?*

  If it is a processing difference—if we are arguing about the output of a shared algorithm—then your disagreement is a red flag. It suggests I may have bug in my code. I should pause and audit my reasoning.

  If it is a prior difference—if we are arguing about the weight of different values or the baseline probability of rare events derived from unique life paths—then your disagreement is expected. I should note it, understand your history, but I am not compelled to update my posterior to match yours. I can respect your rationality while rejecting your conclusion.

  ### Conclusion

  Aumann's Agreement Theorem is a beautiful limit result, like frictionless physics. It tells us where rationality points in the abstract. But we do not live in a frictionless vacuum. We live in a world of bounded computation, private histories, and broken chains of common knowledge.

  The "self-favoring prior" critique is a valuable check on ego, but it cannot be the final word. To treat persistent disagreement as definitive evidence of irrationality is to ignore the reality that rational agents with different histories *should* see the world differently. The goal of rational discourse is not necessarily agreement. It is the accurate mapping of where our disagreements come from. If we find they stem from different priors, we can part ways as rational peers. If they stem from processing errors, we can fix them.

  We should discard the Aumann moral that demands convergence. In its place, we should adopt a more robust norm: Disagreement is not a failure to be eliminated, but a signal to be decoded. Sometimes it tells us we are wrong. Sometimes it just tells us we are different. Knowing which is the true work of rationality.
