answer: |-
  **Spatiotemporal Isolation**

  The vinyl chair in the oncology waiting room was cold enough to bite through Elias's trousers. He shifted, the sound of his friction against the seat loud in the sterile silence. On the table beside him sat a cup of water, condensation pooling at its base. This water, this chair, the hum of the HVAC system—this was World @. The Actual World. Only, Elias knew that "actual" was just an indexical term, like "here" or "now." To the Elias sitting in a waiting room in Chicago, *that* room was actual, and this one was a mere possibility.

  He closed his eyes. He wasn't praying. He was calculating.

  Five years ago, he had stood at a junction. Stay in Boston with Sarah, or take the tenure-track in Chicago alone. He had stayed. In this world, the stress of the department, the slow erosion of the marriage, the smoking he started to cope with it—all of it had condensed into the nodule currently sitting in his left lung.

  But Lewis was clear: the other path wasn't a ghost. It wasn't a shadow. It was flesh.

  There was a concrete universe, spatiotemporally isolated from this one, where Elias took the job. That Elias was breathing right now. He was just as real as the man shivering in the vinyl chair. That Elias might be healthy. He might be happy. He might be walking a dog on a lakefront that, in this world, existed only on a brochure.

  The temptation was to find comfort in that. *I am not dying,* Elias thought. *Only this version is. The set of all Eliases is thriving.*

  But the cold logic of the plurality curdled the comfort. The Elias in Chicago wasn't him. There was no trans-world identity. They shared origins, they shared qualitative properties, they shared a history up to the divergence point. But they were numerically distinct. Like two identical coins minted in different countries. If the Chicago-Elias laughed at a joke right now, Elias-in-Boston felt no vibration in his chest. If the Chicago-Elias cured the cancer that this Elias didn't have, the victory was not his.

  The isolation was absolute. No portals. No dreams bleeding through the cracks. Just an infinite archipelago of concrete realities, each screamingly real to its inhabitants, each deaf to the others.

  Why did it matter, then? If the sum total of all possibilities was already realized, fixed, and concrete, what weight did this specific moment carry? If every choice he *could* make was being made by a counterpart somewhere, was his deliberation just a local illusion? He could choose to run out of the hospital now, refuse treatment, live recklessly. Somewhere, an Elias was doing exactly that. Somewhere, an Elias was submitting to chemotherapy. Somewhere, an Elias had never been born at all.

  The distribution of joy and suffering across the pluriverse was constant. His agency didn't change the total amount of pain in the multiverse; it only determined which slice of the pie *this* consciousness had to eat.

  "Elias Thorne?"

  The nurse stood in the doorway. She was wearing blue scrubs. In another world, she was wearing green. In another, she wasn't a nurse; she was a painter. In another, she didn't exist. But in this world, she was looking at him, waiting for *this* Elias to stand up.

  He looked at his hands. They were trembling. The Chicago-Elias's hands were steady, perhaps, holding a coffee cup. Elias wanted to hate him. He wanted to hate that distant, concrete stranger who was living the life Elias had sacrificed his health to avoid. But hate required a relationship, and there was no relation. They were strangers separated by a distance deeper than space.

  He realized then that the horror of Modal Realism wasn't the infinity of worlds. It was the finitude of the self. You are trapped in your indexicality. You are shackled to this coordinate. You cannot cash out the value of your life against the successes of your counterparts. You cannot say, "It's okay, I win somewhere else." Because the "I" that wins is someone else.

  The suffering here was local. The terror was local. The love Sarah had for him, which had frayed and vanished two years ago—that love was real here, and its absence was a real hole in this world's fabric. The fact that Sarah loved the Chicago-Elias in World C didn't fill the hole in World @.

  Elias stood up. His knees popped. The sound was tiny, contained entirely within this causal sphere.

  "Ready for the results?" the nurse asked.

  He could feel the weight of the infinite other Eliases pressing against the walls of the room, not as ghosts, but as heavy, silent facts. A universe for every atom, a life for every breath he didn't take. They were all living out the fullness of possibility, leaving him with the necessity of this single, narrow thread.

  It mattered because he was here. It mattered because "here" was the only place he could feel pain. The rest was just math.

  "Yes," Elias said. His voice sounded thin, stripped of the resonance it might have had in a world where he hadn't smoked. "I'm ready."

  He followed the nurse down the hallway. He did not look back at the waiting room, or the chair, or the water. He walked into the future that belonged only to him, leaving the triumphant counterparts to their unshareable victories.
