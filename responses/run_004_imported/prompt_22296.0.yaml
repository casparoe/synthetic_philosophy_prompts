  **Move 1 (Naomi): 2 (Clearly Right)**
  Naomi accurately recites Lewis's core criteria. A queue is a **coordination equilibrium** (everyone prefers order to chaos), sustained by **mutual expectations** (I wait because I expect you to wait), and satisfies **arbitrariness** (a lottery or numbered ticket system would solve the coordination problem just as well). This is a textbook application of Lewis's definition.

  **Move 2 (Felix): 1 (Mostly Right)**
  Felix correctly identifies a phenomenological gap: the reaction to queue-jumping feels like *moral* outrage, not just the frustration of a failed coordination. Lewis reduces normativity to intersecting expectations and preferences, which struggles to capture the deontic "wrongness" people feel. However, Felix overstates the case; Lewis *can* explain the intensity as a function of high-stakes reliance, even if it lacks a robust theory of desert.

  **Move 3 (Naomi): 2 (Clearly Right)**
  This is a faithful Lewisian defense. For Lewis, "entitlement" is not a metaphysical right but a function of **common knowledge** and reliance. If I plan my morning based on the expectation that you will queue, your violation disrupts my plans. The anger is the emotional correlate of that disrupted reliance, requiring no independent moral ontology.

  **Move 4 (Felix): 0 (Mixed)**
  Felix's escalator counterexample is insightful, highlighting that not all conventions carry equal moral weight. However, his theoretical claim is mistaken: the **arbitrariness condition** only requires that *another* regularity could have solved the coordination problem, not that the chosen regularity is morally neutral. A convention can be arbitrary in origin (we could have stood on the left) yet align with independent moral norms (fairness) later. He conflates the *source* of the convention with its *consequences*.

  **Move 5 (Naomi): 2 (Clearly Right)**
  Naomi correctly delimits the scope of Lewis's project. Lewis defines the mechanics of social regularities, not the ontology of justice. That a convention (queueing) becomes annexed by an independent moral norm (fairness regarding scarce goods) does not negate its status as a convention. It simply means the convention overlaps with a moral principle, whereas others (escalators) do not.

  ***

  **Final Verdict**

  First-come-first-served queueing **does satisfy Lewis's definition of a convention**. It is an arbitrary regularity sustained by mutual expectations to solve a coordination problem.

  The moral charge surrounding queue-jumping does **not expose a gap in Lewis's account**, but rather marks the limit of its scope. Lewis was analyzing how social order emerges from self-interest and expectation, not providing a complete theory of justice. The outrage at queue-jumping arises because the convention overlaps with an independent moral principle regarding the fair allocation of scarce resources. Lewis's framework explains why the line exists; it was never intended to explain why breaking it feels *unjust* rather than merely *inconvenient*. Naomi is correct: the moralization is an overlay, not a constituent part of the convention itself.
