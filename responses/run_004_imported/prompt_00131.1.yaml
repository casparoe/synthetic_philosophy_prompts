      *   *Specific Philosophical Nuance:* Ensure Aris distinguishes between *propositional knowledge* and *acquaintance knowledge*. Ensure Mara distinguishes between *epistemic novelty* and *ontological novelty*.

  6.  **Writing the Scene (Iterative Process):**
      *   *Setting the scene:* Twilight. The facility is grey, but the sky is colored.
      *   *Dialogue:* Start with the immediate reaction. "Did you see her face?"
