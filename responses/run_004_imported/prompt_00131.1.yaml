      *   *Mara's kill shot:* "If the physical story was complete, why was the access blocked? The blockage implies the story was missing a chapter."
      *   *Closing:* Focus on Elena. The human cost of the theory.

  7.  **Final Polish:** Check the rhythm. Ensure the philosophical terms are woven naturally, not lectured. (e.g., instead of saying "Lewis's Ability Hypothesis," have Aris describe the *mechanism* of the hypothesis). Make sure the lighting changes mirror the argument.

