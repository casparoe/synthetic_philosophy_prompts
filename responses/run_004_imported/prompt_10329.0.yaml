answer: |-
  Freiling's argument is undeniably seductive. It appeals to a robust physical intuition: if I throw two darts, the outcome of the first shouldn't restrict the outcome of the second, and countable sets are "too small" to hit. However, the argument fails because it smuggles in a hidden mathematical assumption that is incompatible with the very well-ordering CH provides.

  The specific point of failure is **measurability**. Freiling's probabilistic reasoning collapses because the set defined by the CH well-ordering is not measurable in the product space of the two dart throws. Consequently, the statement "this event happens with probability 1" is mathematically meaningless in the standard framework.

  Here is the detailed breakdown of why the probability move does not work.

  ### 1. The Hidden Assumption: Joint Measurability
  Freiling's argument relies on calculating the probability of a joint event: the pair of dart throws $(x, y)$ landing in a specific relationship to one another. In measure-theoretic probability, to assign a probability to a subset of the plane $\mathbb{R}^2$, that subset must be **Lebesgue measurable**.

  Freiling defines a set $A \subseteq \mathbb{R}^2$ based on the well-ordering $\prec$ guaranteed by CH:
  $$ A = \{ (x, y) \mid y \prec x \} $$

  His argument proceeds by calculating the measure of $A$ using iterated integrals (which corresponds to throwing the darts one after the other):
  1.  **Fix $x$:** The set of $y$ such that $y \prec x$ is countable (by CH). Countable sets have Lebesgue measure 0. So, for every $x$, the "vertical slice" of $A$ has measure 0.
  2.  **Integrate over $x$:** If every vertical slice has measure 0, the total area (probability) of $A$ should be 0.
  3.  **Symmetry:** By the same logic, the set $B = \{ (x, y) \mid x \prec y \}$ should have measure 0.
  4.  **Contradiction:** Since $\prec$ is a total order, $A \cup B$ is the entire unit square (minus the diagonal, which is measure 0). If both have measure 0, the square has measure 0, which is false.

  The error lies in step 2. The inference "if every vertical slice has measure 0, the total area is 0" is **Fubini's Theorem**. However, Fubini's Theorem **only applies if the set $A$ is measurable in the product space $\mathbb{R}^2$.**

  ### 2. Sierpiński's Result
  This is not a new discovery; it was proven by Wacław Sierpiński in 1920, long before Freiling. Sierpiński showed that if the Continuum Hypothesis is true, there exists a subset of the plane $\mathbb{R}^2$ that is **non-measurable** with respect to the 2-dimensional Lebesgue measure, yet all of its vertical and horizontal sections are measurable (and in this specific case, countable or co-countable).

  Specifically, under CH, the set $A = \{ (x, y) \mid y \prec x \}$ is a classic example of a non-measurable set in the plane.
  *   Every vertical section $A_x = \{y \mid y \prec x\}$ is countable (measure 0).
  *   Every horizontal section $A^y = \{x \mid y \prec x\}$ is co-countable (measure 1).

  If you try to integrate the vertical slices, you get 0. If you try to integrate the horizontal slices, you get 1. In standard measure theory, when the iterated integrals yield different results ($0 \neq 1$), it is a proof that the function (or set) is **not jointly measurable**.

  Because the set is not measurable, standard probability theory cannot assign it a value. You cannot say the probability is 0, 1, or anything else. The question "What is the probability that $y \prec x$?" has no answer within the Kolmogorov axioms. Freiling asserts the probability is 1 (that they miss each other), but he has no justification for assigning *any* probability to a non-measurable event.

  ### 3. The Conflict of Structures
  Freiling's argument essentially pits two mathematical structures against each other:
  1.  **The Order Structure:** The well-ordering $\prec$ provided by the Axiom of Choice (and CH).
  2.  **The Measure Structure:** The Lebesgue measure used to model "throwing a dart."

  These two structures are fundamentally incompatible. The well-ordering of the reals required for CH is "wild." It does not respect the topology or the geometry of the real line. There is no way to construct such a well-ordering explicitly; it exists only by virtue of the Axiom of Choice.

  When you "throw a dart," you are implicitly assuming a probability distribution that is compatible with the standard topology of the reals (i.e., Lebesgue measure). You are assuming that the likelihood of landing in an interval depends on its length. However, the well-ordering $\prec$ scrambles the reals so thoroughly that sets defined by $\prec$ (like "all predecessors of $x$") bear no relationship to intervals or lengths.

  To claim that $y$ misses $f(x)$ with "probability 1" assumes that the set $f(x)$ is measurable *and* that the relationship between $x$ and $y$ respects the product measure. But the well-ordering is constructed precisely in a way that ignores the metric properties of the reals. To assume the dart-throwing intuition applies to the well-ordering is to assume that the well-ordering is "nice" with respect to Lebesgue measure. But if the well-ordering *were* nice (measurable), CH would likely fail for other reasons.

  ### 4. Why the Physical Intuition Misleads
  Freiling argues that even if the math is weird, the physical intuition should hold: "Surely, if I throw two darts, the first one can't constrain the second."

  The counter-argument is that this intuition relies on **causal independence**, which maps to **probabilistic independence** only if the events are measurable.
  *   If I define an event using a non-measurable set (like a Vitali set, or the CH well-ordering relation), the concept of "probability" ceases to apply.
  *   Imagine a "dartboard" where the "bullseye" is a non-measurable set. If you throw a dart, does it hit the bullseye? Standard probability theory says the question is ill-posed.
  *   Freiling is effectively asking us to extend our notion of probability to cover non-measurable sets in a way that preserves our intuition about countable sets. But doing so requires abandoning standard measure theory (and thus Fubini's theorem).

  If you abandon standard measure theory to save Freiling's intuition, you lose the ability to do calculus and standard analysis on the reals. If you keep standard measure theory, you must accept that the CH well-ordering defines events that have no probability.

  ### Conclusion
  Freiling's argument does not refute CH; it refutes the conjunction of **CH** and the assumption that **the CH well-ordering is Lebesgue measurable in the plane.**

  Since we know from Sierpiński that CH implies the well-ordering is *not* measurable, the probabilistic calculation Freiling performs is invalid. He is applying Fubini's Theorem to a set where it does not hold. The "contradiction" he finds ($0 \neq 1$) is not a contradiction in logic, but a diagnostic signal that the set in question is non-measurable.

  Therefore, the dart-throwing thought experiment fails because it attempts to apply a measure-theoretic intuition (probability 1) to a set-theoretic object (the CH well-ordering) that is explicitly constructed to be invisible to that measure. The failure lies not in CH, but in the assumption that all subsets of the plane generated by logical relations on reals must be probabilistically tractable.
