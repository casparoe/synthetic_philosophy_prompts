answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew my father well, you know that he wasn't a man who cared much for titles. He didn't have a university degree. He didn't call himself a scholar, or a philosopher, or even, particularly, a hero. He was a reader. He believed that if you read enough, and you paid attention, you could figure out how the world worked.

  And for as long as I can remember, there was one idea he kept coming back to. He called it "the Pascal thing." He would recite it at the dinner table, usually after a week where the courts had been especially brutal, or a client had been failed by the system one too many times. He'd pour a glass of wine, look tired, and say it:

  "Justice without force is powerless. Force without justice is tyrannical. We cannot make what is just strong, so we make what is strong just."

  It is a bleak passage. It says that right and wrong don't actually matter in the face of power. It says that the only reason we obey laws is not because they are good, but because the people who wrote them have the police and the prisons to back them up.

  For a long time, I thought this was just his way of venting. A cynical joke to let off steam. But I realize now that it was the foundation of his life. He knew Pascal was right about the world. He knew that the state holds all the cards. He knew that for the people he represented—the poor, the marginalized, the scared—force was almost always arrayed against them.

  If he had stopped there, if he had accepted that "might makes right" was the end of the story, he would have quit after year one. Most people would have. But my father stayed for nearly forty years. And I think the reason why is that he didn't see his job as fixing Pascal's problem. He saw his job as answering it.

  Pascal wrote that we cannot make what is just *strong*. My father spent four decades trying to prove that we could at least make it louder.

  To his colleagues here: You know that a Public Defender does not wield physical force. We don't carry badges or guns. But in that courtroom, the law itself is a kind of force. It is a lever. It is a shield. When my father stood up to object, when he demanded discovery, when he forced the state to prove its case beyond a reasonable doubt, he was lending justice a little bit of muscle. He was taking the abstract idea of "fairness" and giving it a voice that the system was legally required to hear.

  He knew he couldn't make the state's force perfectly just. He was too clear-eyed for that delusion. He saw the plea deals that had to be taken, the biases that lingered, the clients who fell through the cracks. He never pretended otherwise. But he also knew that if he wasn't there, force would be the *only* thing in the room.

  To the family and friends here: You saw him come home tired. You saw the weight of it. But I hope you also saw that he never let the bleakness turn into bitterness. He didn't fight because he thought he could save everyone. He fought because the alternative was to let tyranny win by default.

  He taught me that courage isn't believing everything will work out. Courage is knowing the odds are rigged, knowing the "strong" are already declared "just," and standing up anyway to say: *Wait. Check the evidence. Follow the rule. Respect the person.*

  In a way, his career was a living rebuttal to that passage. Pascal said we make what is strong count as just. My father's life was about making sure that what is just could stand up to what is strong.

  He wasn't looking for glory. He wasn't looking for acquittals in every case, though he fought for them. He was looking for dignity. He wanted to ensure that when the full weight of the government came down on a person, that person was not alone. That there was someone in the room whose only job was to hold the line.

  There is a temptation, when eulogizing someone we love, to smooth out their edges. To pretend they thought the world was kinder than it is. My father would have hated that. He would have rolled his eyes at a speech that pretended the system is fair or that good men always finish first.

  So I won't say that. I will say this: He saw the world clearly. He saw the imbalance of power. And he decided that his life's work would be to put a thumb on the scale.

  To the colleagues who worked with him: Thank you for continuing that work. He respected you deeply. He knew that the only way to keep the tyranny at bay is for people like you to keep showing up, day after day, case after case.

  To the rest of us: We honor him not by pretending the world is perfect, but by refusing to accept that power is the only truth.

  Dad, you made what is just a little bit stronger. You gave it force, for forty years. You gave it a voice. And because you did that, the world is a little less tyrannical than it would have been without you.

  Rest now. We'll take it from here.
