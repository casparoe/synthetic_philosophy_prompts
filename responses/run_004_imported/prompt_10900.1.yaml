answer: |-
  **The Measure and the Monster: Reconciling Aristotle's Account of Money in *NE* V and *Politics* I**

  The transition from the *Nicomachean Ethics* to the *Politics* marks a shift in Aristotle's practical philosophy from the rectification of relationships between individuals to the structural organization of the community itself. Yet, for the student of Aristotle's economic thought, this transition presents a notorious interpretive fissure. In *Nicomachean Ethics* V.5, Aristotle describes money (*nomisma*) as a conventional device (*nomos*) introduced to render disparate goods commensurable for the sake of reciprocal justice, admitting that this commensurability is practically adequate rather than ontologically robust. Conversely, in *Politics* I, he condemns lending at interest (*tokos*) as the most unnatural form of wealth-getting precisely because money is "by nature" barren and cannot legitimately breed. The tension is palpable: if money is a creature of convention in the *Ethics*, how can it possess a nature in the *Politics* that can be violated?

  This essay addresses whether the *Ethics*' admission that money is a conventional proxy for need strengthens or undermines the *Politics*' naturalness argument against usury. I will argue that while the *Ethics* account ostensibly undermines the ontological force of the "barrenness" metaphor, it ultimately strengthens the normative core of the argument against usury. The *Ethics* clarifies that the "unnatural" character of interest is not a physical impossibility but a teleological error: the vice of *chrematistike* consists in mistaking a conventional proxy for the need it was meant to track. However, accepting this reading requires a specific verdict: the *Ethics* saves the ethical condemnation of usury but forces us to abandon the literal biological analogy of sterility. The argument survives as a critique of infinite desire detached from human need, but it ceases to be a claim about the intrinsic properties of metal.

  To see how the *Ethics* might undermine the *Politics*, one must press the distinction between *physis* (nature) and *nomos* (convention). In *NE* V.5, Aristotle is explicit that money exists "not by nature but by law" (*ou physei alla nomo*). Its function is to serve as a middle term that allows a house to be equated with a shoe, not because they share an intrinsic quality, but because the community agrees to treat them as comparable relative to *chreia* (need). Aristotle even suggests this commensurability is a pragmatic fiction; money holds exchange together "as if" (*hōsanei*) the goods were truly commensurable. If money is fundamentally a token of agreement, its properties are determined by human stipulation.

  From this vantage point, the argument in *Politics* I appears incoherent. If money is a conventional tool, its "function" is whatever the convention dictates. If a society agrees that lending money at interest is a valid use of that tool, on what grounds can Aristotle appeal to "nature" to forbid it? The "Undermining" reading suggests that by conceding the conventional status of money in the *Ethics*, Aristotle pulls the rug out from under his own feet in the *Politics*. To condemn interest as "against nature," money must have a fixed essence independent of human agreement. But *NE* V.5 suggests money has no such essence; it is a fluid measure of fluctuating need. Consequently, the condemnation of *tokos* looks less like a philosophical deduction and more like a cultural prejudice masquerading as natural law. If money is just a counter, why can't the counter grow? The *Ethics* implies that the rules of the counter are up to us; the *Politics* insists the rules are written in the nature of things.

  However, the "Strengthens" reading offers a more charitable and philosophically robust reconciliation. This reading posits that the *Ethics* does not strip money of teleology but rather defines that teleology precisely as the service of *chreia*. In *NE* V.5, money is not merely a random token; it is a stand-in for need. It is a signifier for the signified reality of human requirement. The "conventional" aspect refers to the *mechanism* of exchange, not the *end* of exchange. The end remains natural: the satisfaction of need within the political community.

  Viewed through this lens, the *Ethics* account actually sharpens the critique of usury in the *Politics*. The vice of *chrematistike* (wealth-getting) is not simply using money, but using it in a way that severs the link between the signifier (coin) and the signified (need). In natural exchange (*oikonomike*), money is a means to acquire goods for use; the circuit closes when the need is met. In usury, the circuit never closes; money begets money. The *Ethics* helps us understand why this is a category error. Because money is *only* a proxy for need, treating it as a source of value in itself is a form of idolatry. It reifies the measure. The *Ethics* admission that money is "imperfectly" commensurable underscores that money is fragile and dependent on the reality of need to have value at all. To try to make money generate more money without the intermediary of need (goods/use) is to try to make the shadow cast an object. Thus, the *Ethics* strengthens the argument by showing that the "unnaturalness" of usury is a functional contradiction: it attempts to extract natural sustenance from an artificial instrument.

  Nevertheless, a definite verdict requires us to adjudicate the cost of this reconciliation. Does the *Ethics* account save the *Politics* argument entirely? I argue that it does not. It saves the ethical conclusion but sacrifices the metaphysical premise.

  If we accept the *NE* V.5 framework, we must admit that the "barrenness" of money cannot be a literal, biological fact about metal. Metal does not have a *physis* in the same way a seed does. A seed has an internal principle of motion toward a specific end (a plant); a coin has only the function assigned to it by the *polis*. Therefore, the specific claim in *Politics* I that usury is unnatural *because* "money is barren" cannot survive as a physical ontology. If money is conventional, its "sterility" is also conventional. We could, by convention, decide that coins breed.

  However, the *Ethics* allows us to reinterpret "barrenness" functionally rather than physically. Money is "barren" not because silver cannot physically multiply, but because, *as a measure of need*, it has no internal telos beyond measuring. A seed's telos is to become a tree; money's telos is to disappear into a transaction that satisfies a need. When money remains money (plus interest), it has failed to achieve its telos. It has stalled.

  Therefore, my verdict is this: The *NE* V.5 concession **strengthens** the normative argument against usury but **undermines** the biological analogy used to support it. The *Politics* argument survives as a critique of the *infinity of desire*, but not as a critique of the *physics of currency*.

  On this narrower reading, the distinction between *oikonomike* (household management) and *chrematistike* (wealth-getting) remains fully intact. Aristotle's core insight—that there is a natural limit to wealth defined by the needs of the good life, and that exceeding this limit is destructive to the virtue of the citizen—is bolstered by the *Ethics*. The *Ethics* explains *why* there is a limit: because money is a proxy for need, and need is naturally limited. When one pursues money for its own sake, one is pursuing a proxy without the reality, a measure without the thing measured. This makes the pursuit inherently irrational and "unnatural" in the sense of being contrary to human flourishing (*eudaimonia*).

  However, the specific condemnation of *tokos* as the "birth of money from money" must be demythologized. We cannot sustain the claim that interest is wrong *because* metal is sterile. We must instead argue that interest is wrong because it represents the institutionalization of the error identified in *NE* V.5: it treats the conventional measure as if it were the natural good. The "sterility" is not in the coin, but in the transaction's failure to refer back to *chreia*.

  In conclusion, the interpretive puzzle is resolved not by choosing one text over the other, but by recognizing that the *Ethics* provides the semantic key for the *Politics*. The *Ethics* reveals that money's "nature" is actually its social function as a measure of need. This strengthens the condemnation of usury by grounding it in a sophisticated teleology of human need rather than a crude physics of metal. However, it demands we concede that Aristotle's rhetoric about "breeding" money is metaphorical. The argument that survives is that usury is unnatural because it detaches the conventional instrument of exchange from the natural end of human life. The argument that must be discarded is the notion that this detachment violates the biological properties of precious metal. By accepting this hybrid verdict, we preserve Aristotle's profound insight into the moral dangers of financial abstraction while acknowledging the limitations of his natural science. The tension between *nomos* and *physis* is not a contradiction to be eliminated, but the very space where the ethical danger of money resides: in the human tendency to mistake our own conventions for the laws of nature.
