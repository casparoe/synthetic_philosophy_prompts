          *   Conclusion of this section: On a strict reading, *NE* makes money purely instrumental/conventional, rendering the *Pol* claim of "natural sterility" incoherent.

      *   **Section 2: The "Strengthens" Argument (The Teleological Reading):**
          *   Focus on *Chreia* (Need).
          *   In *NE*, money tracks need.
          *   In *Pol*, natural exchange satisfies need; unnatural accumulation ignores need.
          *   The *NE* concession highlights that money is a *means*, not an *end*.
          *   Usury treats the means (money) as the end (breeding more money).
          *   The "conventional" nature of money in *NE* actually supports this: because it's a token for need, detaching it from need (usury) is a category error.
          *   This makes the vice intelligible as a confusion of status (mistaking the proxy for the reality).

