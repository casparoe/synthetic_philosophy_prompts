          *   If $u \neq v$, then $u=0, v=1$. This implies $0 \in U$ (always true) and $1 \in V$ (always true). This doesn't decide $P$.
          *   *Correction:* The trick relies on the fact that if $P$ is true, $U=V=\{0,1\}$. If we have a *function* that chooses, does it respect equality of sets? AC usually says "for every family of non-empty sets..." The family is indexed by $\{U, V\}$. If $P$ is true, $U=V$. A function must give the same value for the same input. So if $U=V$, then $f(U) = f(V)$.
