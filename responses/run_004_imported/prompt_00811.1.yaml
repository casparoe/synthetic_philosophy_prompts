      *   **Requirements:** Write an essay, weigh both readings, reach a clear verdict, and defend it. Do not leave it unresolved.
      *   **Tone:** Analytical, historical, philosophical, persuasive.

  2.  **Initial Brainstorming & Fact-Checking:**
      *   *Kepler's Context:* Late 16th/early 17th century. Astronomy and astrology were not fully distinct professions yet. He needed patronage (astrology paid the bills).
