answer: |-
  The key was brass, worn smooth at the head where her thumb usually rested. Elena knew this. She knew the weight of it, the specific resistance of the third tumblers in the lock of Apartment 4B, the way the bolt threw with a dull *thunk* rather than a click. These were not hypotheses. They were the ground she walked on.

  But standing in the hallway of her building, key inserted halfway into the cylinder, the ground felt like water.

  She wasn't thinking, *Is this the right key?* That would be a simple error, solvable by checking the number on the brass tag. She wasn't thinking, *Is this the right door?* The number 4B was stenciled in black paint right beside the frame.

  The problem was that the certainty required to turn the wrist had evaporated. It wasn't that she suspected the key wouldn't work; it was that the proposition *This key opens this door* had lost its status as a fact and become merely a noise in her head. To turn the key would be to make a claim about reality that she no longer had the authority to make. She stood there, hand suspended, watching the brass metal disappear into the slit.

  "Elena?"

  It was Mrs. Gable from 4C. She was holding a mesh bag of groceries, the oranges visible through the holes like bright eyes.

  Elena didn't turn. She couldn't reconcile the command to turn with the body that was supposed to obey it. "The lock," Elena said. Her voice sounded thin, scraped from a throat that didn't feel like hers.

  "The lock?" Mrs. Gable stepped closer, the mesh bag crinkling. "Did it jam again? Landlord said he'd fix the mechanism last week."

  "No," Elena said. She looked at her hand. It was holding the key. She knew it was her hand. She knew it was a key. But the bridge between *hand*, *key*, and *door* was gone. There was only the arrangement of objects. "I don't… I can't be sure."

  Mrs. Gable's face shifted. The neighborly annoyance at a blocked hallway softened into something tighter, something clinical. She set the grocery bag down on the runner. "Sure of what, honey? That it's your apartment?"

  "Yes."

  "You've been working too much," Mrs. Gable said. It wasn't a philosophical counter-argument. It was a diagnosis. "The translation job. You're staring at screens until your eyes cross. It's the fatigue."

  "It's not fatigue."

  "It looks like fatigue." Mrs. Gable reached out and touched Elena's elbow. The touch was warm, solid, undeniable. "Why don't you come sit in my place for a minute? I'll make you tea. You can call your husband."

  "I know my husband," Elena said, but the certainty bled out of the sentence as she spoke it.

  "Of course you do." Mrs. Gable's tone was the one used for children or the concussed. She gently pried Elena's fingers off the key. The metal clicked against the lock. "Come on. Let's get you out of the hall."

  Elena let herself be led. She walked because her legs moved, not because she was certain that walking was the correct response to the situation. As they passed the mirror in Mrs. Gable's foyer, Elena caught her reflection. She saw a woman with dark hair and tired eyes. She knew that was what a mirror showed. But the hinge that held *image* to *self* felt loose, rattling in a wind she couldn't feel.

  "Sit," Mrs. Gable said, pointing to a floral armchair.

  Elena sat. The chair held her. She expected it to, but the expectation felt like a gamble now.

  "I'll put the kettle on," Mrs. Gable said, moving into the kitchen. "Don't worry about the door. I'll call the super for you later. You just rest."

  Elena looked at her hands in her lap. They were still. She waited for the certainty to return, for the riverbed to settle back into place so the water of her thoughts could flow over it again. But the silence in her head wasn't peaceful. It was the silence of a machine that had been unplugged. She knew she was sitting in a chair in her neighbor's apartment. She knew this was not a dream. But knowing it didn't help. It was just a story she was telling herself, and for the first time, she couldn't hear the period at the end of the sentence.

  ***

  **Notes on *On Certainty* Moves:**

  1.  **§257 (Madness vs. Mistake):** Wittgenstein argues that if someone doubts a hinge proposition (like "this is my hand" or "this is my door"), we don't treat them as making a factual error we can correct with evidence; we treat them as mentally ill. Mrs. Gable's reaction ("You're working too much," "You just rest") dramatizes this social enforcement of certainty.
  2.  **§341 (The Hinge):** The idea that questions and doubts only make sense if some propositions are exempt from doubt. Elena isn't doubting a specific fact (like "is the key broken?"); she is losing the scaffolding (*This key opens this door*) that allows her to test facts.
  3.  **§155 & §194 (Action vs. Knowledge):** Wittgenstein suggests certainty is shown in action, not just assertion ("I act with complete certainty"). Elena's paralysis at the door illustrates that when the hinge loosens, action becomes impossible, not because the physics fail, but because the *right* to act vanishes.
