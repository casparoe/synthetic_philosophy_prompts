      *   **Rubinstein's Email Game:** Formalizes this. State of world is $A$ or $B$. Player 1 sees state. If $A$, both want to coordinate on Attack. If $B$, both want to coordinate on Don't Attack. Messages lost with probability $\epsilon$.
