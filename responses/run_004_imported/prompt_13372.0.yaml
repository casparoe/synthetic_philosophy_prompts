answer: |-
  Good morning.

  Six weeks ago, my daughter was born. She is currently asleep in a bassinet in the other room, largely unaware that she is the reason I am finding it difficult to sleep, and the reason I am finding it impossible to look at a spreadsheet of existential risk probabilities without seeing a face.

  I mention this not to sentimentalize the work we do here. We are not gathered to protect "the future" as an abstract concept. We are gathered to protect the specific, fragile conditions that will allow a human being born in 2024 to grow old.

  This workshop focuses on long-term technological risk. For half of you, that phrase calls to mind a specific text: John von Neumann's 1955 essay, "Can We Survive Technology?" For the rest of you, who may not know the essay, I want to offer the context not as history, but as a map for the next two days.

  Von Neumann wrote that piece at the height of the atomic age. He wrote it the same year he was diagnosed with the cancer that would kill him less than two years later. Knowing this biography is tempting. It invites us to hear his words as a deathbed confession, a final warning from a brilliant mind watching its own light go out. But if we focus only on the poignancy of his mortality, we risk missing the cold utility of his argument.

  Von Neumann's central thesis was not that technology is evil, nor that it is inevitably salvific. His argument was about scale. He observed that technological change had accelerated to a point where the consequences of human action had become commensurate with the size of the planet itself. We had graduated from local errors to global ones.

  He wrote, "For progress there is no cure."

  That line is often quoted to suggest fatalism. It is read as: *We cannot stop the machine, so we must brace for impact.* But that is a misreading. When von Neumann says there is no cure for progress, he is not saying we are doomed. He is saying that regression is not a viable strategy. We cannot return to a pre-technological state without collapsing the systems that sustain billions of lives. We are on the train. The brakes are not an option.

  So, if there is no cure, and we cannot get off the train, how do we survive?

  Von Neumann refused to offer a technical fix. He did not propose a new treaty, a new physics, or a new governance structure that would solve the problem once and for all. Instead, he argued that our only safeguard was ongoing, case-by-case judgment. He listed three requirements for this judgment: "patience, flexibility, intelligence."

  This is where I need to speak to both halves of this room.

  To the researchers who know this text: You know that it is easy to treat von Neumann's essay as a heuristic for a research agenda. We cite it to justify our grants. We use it to frame our models. But before my daughter existed, I could treat that argument as abstract. Now, it reads like a description of the world she is going to grow up in. I ask you to join me in resisting the urge to turn his call for "judgment" into just another optimization problem. We cannot model our way out of the need for wisdom.

  To our funders, journalists, and family members: You might be waiting for a promise. You want to know if we are going to fix this. The honest answer, the von Neumann answer, is that there is no "fix." There is only the work.

  This distinction is vital, because a careless reading of von Neumann supports two dangerous comforts that we must avoid this week.

  The first is the comfort of doom. If the consequences are planetary and progress is incurable, it is tempting to decide that catastrophe is inevitable. This is seductive. It relieves us of responsibility. If the end is written, we don't have to make the hard choices.

  The second is the comfort of "muddling through." This is the belief that because we survived the Cold War, we will survive whatever comes next. That human ingenuity will always arrive at the last second to save us. Von Neumann explicitly rejects this. He argues that the margin for error has shrunk. The luxury of muddling through is a casualty of the very scale he describes. When your mistakes are the size of the planet, you do not get to learn from them by trial and error.

  So, where does that leave us?

  It leaves us with the burden of judgment.

  "Patience," von Neumann wrote. In a field driven by news cycles and funding quarters, patience is a radical act. It means refusing to declare victory too early. It means acknowledging that a safety measure that works today may fail tomorrow as the technology evolves.

  "Flexibility." This means our institutions must be able to adapt faster than the risks they govern. It means being willing to change our minds when the data shifts, even if it invalidates years of work.

  "Intelligence." Not just raw processing power, but the wisdom to understand what we do not know. It is the humility to recognize that our models are maps, not territories.

  I look at my daughter, and I do not see a guarantee. I see a stakeholder. She will not inherit a world that we have solved. She will inherit a world that we have tended.

  Von Neumann's essay is not a prophecy. It is a job description.

  He understood that he would not be around to see the outcomes of the choices made in 1955. He was speaking under time pressure, yes. But he was also speaking to us. He was telling us that survival is not a destination we reach; it is a practice we maintain.

  Over the next two days, we will discuss risks that are vast and complex. We will talk about systems that are difficult to control and futures that are hard to predict. My request is that we do not seek the comfort of a final solution. Let us not leave this room claiming we have found the "cure" for technological risk.

  Instead, let us commit to the harder task. Let us commit to building the capacity for patience, flexibility, and intelligence. Let us commit to the case-by-case judgment that von Neumann demanded.

  We are not here to ensure that nothing ever goes wrong. We are here to ensure that when things go wrong—and they will—we have the resilience to correct them before the cost becomes commensurate with the size of the planet.

  For my daughter, and for all the children who will grow up in the world we shape next month, that must be enough. It has to be.

  Thank you.
