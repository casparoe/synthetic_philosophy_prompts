answer: |-
  This is an excellent question that cuts to the heart of Aristotle's economic thought. You have spotted a genuine tension in the text, and resolving it requires distinguishing between the **ontological foundation** of exchange (what makes it *real*) and the **practical mechanism** of exchange (what makes it *work*).

  In short: **Demand is the substance of value; money is the measure of value.**

  Here is a breakdown of the distinction Aristotle is drawing and why he needs both concepts to explain justice in exchange.

  ### 1. Demand (*Chreia*): The "Unit in Truth"
  When Aristotle says demand is the "unit in truth," he is making a claim about reality. He is asking: *Why do we exchange things in the first place?*

  *   **The Source of Value:** For Aristotle, objects do not have value in a vacuum. A house and a shoe are qualitatively different. The only thing they share that allows them to be linked is that human beings **need** them. If no one needed shoes or houses, there would be no exchange. Therefore, "need" or "demand" is the common denominator that makes two different things comparable in the first place.
  *   **The Social Glue:** Demand is what "holds all things together." It is the underlying social reality that binds the community (*koinonia*). Exchange is essentially the swapping of mutual needs.
  *   **The Problem:** While demand is the *truth* of value, it is vague. How do you quantify "need"? How many shoes equal one house based purely on "need"? It is difficult to measure directly.

  ### 2. Money (*Nomisma*): The "Representative"
  When Aristotle calls money a "representative of demand," he is describing a human invention (a convention) designed to solve the measurement problem.

  *   **The Proxy:** Because we cannot easily trade "units of need," we invented a token that *stands in* for need. When you accept money for your shoes, you aren't accepting the metal or paper; you are accepting a token that represents the community's promise that you can redeem it for something you need later.
  *   **The Measure:** Aristotle says money "makes goods commensurate." Money doesn't create the value (demand does that), but it provides a **numerical scale** to measure it. It turns the qualitative reality of "need" into a quantitative number (price).
  *   **The Convention (*Nomos*):** This is why he links *nomisma* (money) to *nomos* (law/custom). Money only works because we all agree to pretend it represents demand. As he notes, we can "change it and make it useless." If the state debases the currency, the *token* changes, even if the underlying *demand* for goods remains the same.

  ### 3. Why He Needs Both Concepts
  If Aristotle only talked about demand, he couldn't explain how complex economies function. If he only talked about money, he couldn't explain where value comes from.

  **A. To avoid the "Barter Problem"**
  If we relied only on demand, we would be stuck with barter. I need your shoes, but you don't need my wheat; you need a pot. Exchange fails. Money solves this by acting as a **middle term**. It allows me to sell my wheat for "demand tokens" (money) and hold them until I find a potter. Money allows exchange to be separated in time and space.

  **B. To avoid the "Fiat Illusion"**
  If we relied only on money, we might think money *creates* value. Aristotle wants to prevent this error. He insists that money is useless if it is not backed by real demand. This is a profound insight: **Inflation.** When Aristotle says money is "in our power to change... and make it useless," he recognizes that if you detach money from real demand (the "unit in truth"), the system collapses.

  ### 4. An Analogy to Clarify
  Think of **Time** and a **Clock**.

  *   **Time (Demand):** Time is the "unit in truth." It is the underlying reality of change. Without time, nothing happens.
  *   **Clock (Money):** A clock is a "representative of time." It exists by convention (we agree on what an hour is). It makes time commensurate (allowing us to say a meeting is "one hour" rather than "a while").

  You need **Time** for there to be anything to measure. But you need a **Clock** to coordinate a meeting between two people who aren't standing next to each other.

  Similarly:
  *   You need **Demand** for there to be any value to exchange.
  *   You need **Money** to coordinate an exchange between a shoemaker and a builder who don't know exactly what the other needs right now.

  ### Summary for Your Class
  When writing about this, you can frame the distinction like this:

  1.  **Demand is the *Material Cause* of Exchange:** It provides the substance (the mutual need) that makes exchange possible.
  2.  **Money is the *Formal Cause* of Exchange:** It provides the structure (the measure/number) that makes exchange equitable and just.

  Aristotle needs both to explain **Reciprocal Justice**. Justice requires equality. Equality requires a measure. Money provides the measure, but it is only a valid measure because it tracks the underlying reality of Demand. Without demand, money is empty; without money, demand is unmeasurable.

  This distinction saves Aristotle from being a simple "metallist" (money is valuable because it's gold) or a simple "fiat theorist" (money is valuable because the King says so). For Aristotle, money is valuable because it is a **conventional token of a natural necessity.**
