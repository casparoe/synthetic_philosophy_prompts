      *   IV. Kierkegaard's Conduct (Provocation vs. Endurance).
      *   Closing: The task of becoming an Individual.

  9.  (Self-Correction on "Engagement"): Kierkegaard actually *did* engage, but in his own journals and later works (*The Point of View*, *On My Work as an Author*). He didn't tweet back. He wrote *books* about the experience. This is a key distinction for a novelist. Write *about* it, don't fight *in* it.

