prompt: |-
  I've spent more years than I'd like to admit reading rationalist blogs and forums -- Overcoming Bias, then LessWrong, then the various diaspora blogs that followed -- and decision-theoretic puzzles in the Newcomb family have always been my favorite rabbit hole. I co-host a small podcast that grew out of a local meetup's reading group, and next week we're recording with a decision theorist whose whole research program is built around defending a resolute-choice solution to Kavka's toxin puzzle. For anyone who hasn't run into it: an eccentric billionaire will pay you a million dollars tomorrow morning if, by midnight tonight, you form a genuine intention to drink a vial of toxin tomorrow afternoon -- a toxin that will make you extremely sick for a day but cause no lasting harm. You don't actually need to drink it to collect; the billionaire has an infallible way of reading your true intentions, and the payoff turns only on what you intend at midnight, never on what you do the next day. The trouble is that once midnight has passed and the money is either yours or not, you will have no remaining reason to drink the toxin, which makes it hard to see how you could sincerely intend, now, to do something you already know you'll have no reason to do later. Our guest thinks this worry is overstated. She argues that a properly rational agent not only can form the intention but has genuine reason to actually drink the toxin the next day, on broadly the same grounds this crowd usually invokes for paying the driver in Parfit's hitchhiker or one-boxing on Newcomb's problem: that rationality is properly assessed at the level of the policy or disposition an agent implements -- what people around here have taken to calling functional or updateless decision theory -- rather than at each local decision node in isolation.

  Could you draft eight to ten interview questions that push on the actual mechanics of that position rather than letting her re-run the standard setup for the audience? I'd like at least one question each on: Bratman's "Simple View" objection that intending to do something requires believing you will do it, which seems to rule out ever forming the intention in the first place if you've reasoned the case through correctly; how her proposal relates to Edward McClennen's original resolute-choice framework, which was developed for dynamic choice problems under non-expected-utility preferences rather than for predictor-based cases like this one, and whether extending it here is a natural move or a substitution of one puzzle for another; what happens to her argument if the billionaire's lie-detector is merely very reliable rather than infallible; and where she draws the line between cases like this one, where being predictably the sort of agent who follows through is exactly what earns the reward, and blackmail-style cases, where the same kind of predictability seems to invite exploitation rather than pay off. For each question, please add a short follow-up keyed to the answer she's most likely to give, so the conversation doesn't stall the moment she gives the reply I'm expecting.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user is a podcaster familiar with the rationalist community (Overcoming Bias, LessWrong, etc.) and decision theory (Newcomb, Toxin Puzzle).
      *   **Guest:** A decision theorist defending a *resolute-choice* solution to Kavka's Toxin Puzzle.
      *   **Core Argument:** Rationality is assessed at the level of policy/disposition (Functional/Updateless Decision Theory) rather than local decision nodes. Therefore, one can intend to drink and *has reason* to drink later.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Push on mechanics, not standard setup.
          *   Must include specific topics: Bratman's "Simple View" (Intention $\rightarrow$ Belief), McClennen's Resolute Choice (Dynamic vs. Predictor), Reliability (Infallible vs. High Prob), Blackmail/Predictability (Reward vs. Exploitation).
          *   Include a short follow-up for each question keyed to the expected answer.
          *   Tone: Intellectual, familiar with the jargon but accessible to the podcast audience (who know the basics).

  2.  **Deconstruct the Guest's Position:**
      *   She defends *Resolute Choice* applied to the Toxin Puzzle.
      *   Standard Causal Decision Theory (CDT) says: Don't intend (can't), don't drink (no reason).
      *   Evidential/Functional/Updateless (EDT/FDT/UDT) says: Intend (to get money), drink (to maintain consistency/policy).
      *   Resolute Choice specifically: You bind your future self to the plan made at $t_0$, overriding preference changes at $t_1$.
      *   Key tension: How do you *sincerely* intend something you know you won't want to do? How does this avoid self-deception? How does it differ from precommitment?

  3.  **Drafting Questions (Iterative Process):**

      *   *Requirement 1: Bratman's Simple View.*
          *   *Idea:* Bratman says Intention implies Belief. If I know I won't drink at $t_1$, I can't believe I will, so I can't intend at $t_0$.
          *   *Draft Q:* How do you handle Bratman's objection that intention requires belief?
          *   *Refinement:* Make it sharper. If the agent is rational, they know the $t_1$ incentives. How do they believe they'll drink without self-deception?
          *   *Follow-up:* If she says "Rationality changes the incentives," ask about the phenomenology of that belief.

      *   *Requirement 2: McClennen's Resolute Choice.*
          *   *Idea:* McClennen focused on dynamic inconsistency (e.g., Ulysses/Sirens) without predictors. Toxin has a predictor.
          *   *Draft Q:* Is this just McClennen applied to predictors?
          *   *Refinement:* McClennen solves dynamic choice where preferences change. Toxin involves a *prediction* of that change. Does importing resolute choice here conflate the mechanism of commitment with the mechanism of prediction?
          *   *Follow-up:* If she says "It's the same structure," ask about the ontological status of the predictor.

      *   *Requirement 3: Reliability (Infallible vs. High Prob).*
          *   *Idea:* Newcomb works with high prob. Toxin usually assumes infallibility.
          *   *Draft Q:* What if the detector is 99% accurate?
          *   *Refinement:* If it's probabilistic, the expected utility calculation shifts. Does resolute choice still demand drinking, or does it become a standard mixed strategy?
          *   *Follow-up:* If she says "Still drink," ask about the threshold where it stops making sense.

      *   *Requirement 4: Blackmail vs. Reward.*
          *   *Idea:* Being predictable helps in Toxin/Newcomb. But in Parfit's Hitchhiker (blackmail-adjacent) or actual blackmail, being the type who pays gets exploited.
          *   *Draft Q:* Where is the line between beneficial predictability and exploitable predictability?
          *   *Refinement:* Distinguish between "Newcomb-like" (reward for correlation) and "Blackmail" (punishment for correlation). How does her policy distinguish them?
          *   *Follow-up:* If she cites "subjunctive dependence," ask for a concrete heuristic for the audience.

      *   *Filling the remaining 4-6 questions (Need to reach 8-10 total):*
          *   *Topic 5: Self-Deception.* The classic worry. Is resolute choice just lying to oneself?
          *   *Topic 6: The "Reason" to Drink.* She claims there *is* a reason at $t_1$. What *kind* of reason is it? Instrumental? Constitutive?
          *   *Topic 7: Comparison to Precommitment.* Why not just sign a contract? What does resolute choice add?
          *   *Topic 8: Diachronic Rationality.* Is the self at $t_0$ privileged over $t_1$? Why?
          *   *Topic 9: Learning/Training.* Can humans actually train this? Or is it only for AI?
          *   *Topic 10: The "Why Now?" question.* Why defend this specific view now?

  4.  **Refining and Polishing:**
      *   Ensure the tone matches the user's background (rationalist diaspora). Use terms like "updateless," "dynamic inconsistency," "subjunctive dependence" correctly.
      *   Check the follow-ups. They need to prevent the guest from stopping at a platitude. They should probe the *cost* or *implication* of the answer.
      *   Ensure the Bratman, McClennen, Reliability, and Blackmail constraints are met. (I will mark them mentally to ensure inclusion).

      *(Self-Correction during drafting)*: I need to make sure I don't just ask "What about X?" but rather "How does X interact with Y?" to push on mechanics.
      *   *Bratman:* Focus on the *belief* condition specifically.
      *   *McClennen:* Focus on the *predictor* element being absent in original Resolute Choice.
      *   *Reliability:* Focus on the *continuity* of the prescription.
      *   *Blackmail:* Focus on the *criterion* for distinction.

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Bratman included? Yes (Q1).
      *   McClennen included? Yes (Q3).
      *   Reliability included? Yes (Q5).
      *   Blackmail included? Yes (Q8).
      *   Follow-ups included? Yes.
      *   Tone appropriate? Yes.

  6.  **Final Polish:** Check the flow. Start with the metaphysics of intention, move to the decision theory mechanics, then to edge cases and implications. (This creates a logical narrative arc for the interview).

      *   *Q1 (Bratman)*: Intention/Belief link.
      *   *Q2 (Reasons)*: The nature of the reason at $t_1$.
      *   *Q3 (McClennen)*: Dynamic choice vs. Prediction.
      *   *Q4 (Precommitment)*: Resolute choice vs. External binding.
      *   *Q5 (Reliability)*: Infallible vs. Noisy.
      *   *Q6 (Diachronic Authority)*: Why $t_0$ wins.
      *   *Q7 (Self-Deception)*: Is it honest?
      *   *Q8 (Blackmail)*: Exploitation vs. Reward.
      *   *Q9 (Implementation)*: Humans vs. Agents.
      *   *Q10 (Meta)*: The cost of this rationality.

      *Wait, I need to make sure the follow-ups are specific.*
      *   *Q1 Follow-up:* If she says "Belief is updated," ask about the truth condition.
      *   *Q3 Follow-up:* If she says "It's natural," ask about the predictor's role.
      *   *Q5 Follow-up:* If she says "Threshold," ask where it is.
      *   *Q8 Follow-up:* If she says "Dependence," ask for a test.

      *Let's write them out fully.*

      *(Drafting content...)*
