answer: |-
  Here are ten interview questions designed to probe the mechanics of your guest's resolute-choice defense of the Toxin Puzzle, including the specific follow-ups you requested.

  **1. The Bratman Constraint**
  Michael Bratman's "Simple View" argues that you cannot intend to $\phi$ if you believe you will not $\phi$. In the Toxin case, a rational agent at midnight knows that at 2:00 PM tomorrow, the money will already be in the bank (or not), and the sickness is pure loss. If your resolute choice model requires the agent to *sincerely* intend at midnight, how do they satisfy the belief condition without engaging in self-deception about their own future rationality?

  *   **Follow-up:** If she argues that the agent believes they will drink *because* they are resolute, ask: "Doesn't that make the belief true only by fiat? If the belief is grounded solely in the resolution itself, aren't we severing the link between belief and evidence that rationality usually requires?"

  **2. The Source of the Reason**
  You argue the agent has a *genuine reason* to drink the toxin tomorrow afternoon, not just a reason to intend tonight. Standard CDT says reasons are forward-looking from the decision node. In your framework, is the reason to drink instrumental (it secures future payouts in iterated cases), or is it a constitutive reason (drinking is part of what it *means* to be the type of agent who gets paid)?

  *   **Follow-up:** If she says it's constitutive of the agent-type, ask: "If the reason is constitutive, does that mean the agent is effectively sacrificing utility at $t_1$ to maintain a label? How do we cash out that 'label' in terms of actual world-states rather than self-conception?"

  **3. McClennen and the Predictor**
  Edward McClennen's original resolute choice framework was designed to solve dynamic inconsistency in agents with changing preferences (like Ulysses and the Sirens), not to solve problems involving external predictors. When you port resolute choice into the Toxin Puzzle, are you treating the predictor as just another part of the environment the agent must navigate, or does the presence of a predictor fundamentally change the normative force of the resolution?

  *   **Follow-up:** If she says it's a natural extension because the structure is the same, ask: "In Ulysses cases, the constraint is internal to the agent's timeline. In Toxin, the constraint is enforced by an external scan of the agent's mind. Does conflating these two obscure the fact that Toxin is actually a problem about *information flow* rather than just *willpower*?"

  **4. Resolute Choice vs. Precommitment**
  Critics often say resolute choice is just "precommitment without the contract." If I can't sign a binding contract to drink the toxin, but I can adopt a mental policy that binds me, what is the mechanical difference? Is resolute choice simply the claim that rational agents have access to a technology of self-binding that doesn't require external enforcement?

  *   **Follow-up:** If she agrees it's a form of self-binding technology, ask: "If it's a technology, can it fail? If an agent tries to adopt this policy but finds their will faltering at 2:00 PM, was the policy irrational, or was the execution flawed? How do we distinguish a bad policy from a weak agent?"

  **5. The Reliability Threshold**
  The standard puzzle assumes an infallible predictor. If we downgrade the billionaire's lie-detector to 90% reliability, the expected utility calculation changes. Does your resolute-choice prescription remain categorical (always drink if you intended to), or does it become probabilistic? At what point does the noise in the channel make resolute choice irrational?

  *   **Follow-up:** If she suggests there is a specific reliability threshold, ask: "Doesn't that imply that rationality is discontinuous? It seems odd that a 1% drop in detector accuracy would flip the prescription from 'definitely drink' to 'definitely don't.' How does your model handle the gray zone?"

  **6. Diachronic Authority**
  Your solution privileges the planning self at $t_0$ (midnight) over the acting self at $t_1$ (afternoon). The acting self has all the information the planning self had, plus the knowledge that the money is already secured. Why does the $t_0$ self have normative authority over the $t_1$ self? Is this a democratic vote across time-slices, or a dictatorship of the past?

  *   **Follow-up:** If she argues for the authority of the planning self, ask: "If the $t_1$ self is fully rational and has more information, why should it defer to a plan made under ignorance? Are we saying rationality requires ignoring new information about your own incentives?"

  **7. The Phenomenology of Resolution**
  For the predictor to register the intention, the agent must actually undergo the psychological state of intending. What does that state feel like for a resolute chooser? Is it distinct from the feeling of a standard agent who knows they won't follow through? If the phenomenology is identical to self-deception, does the functional outcome matter?

  *   **Follow-up:** If she says the phenomenology is distinct because the commitment is real, ask: "Can you describe that distinction without using circular terms like 'commitment'? If I'm a skeptic watching the agent, what behavioral or physiological marker tells me they aren't just lying to themselves?"

  **8. Blackmail vs. Newcomb**
  In Newcomb-like problems, being predictable earns you a reward. In blackmail scenarios, being predictable (e.g., the type who pays to avoid scandal) earns you a penalty. Both rely on the agent being the sort who follows through on policies. How does your framework distinguish between the 'good' predictability of the Toxin Puzzle and the 'bad' predictability of blackmail?

  *   **Follow-up:** If she invokes "subjunctive dependence" or correlation vs. causation, ask: "That's the technical distinction, but what's the heuristic for the agent in the room? If a blackmailer claims they can predict me just like the billionaire, how do I know whether to be resolute or to break my policy?"

  **9. Iteration and Learning**
  Resolute choice is often defended in one-shot cases, but real agents learn. If an agent drinks the toxin once to prove their policy, they suffer utility loss. If they iterate this game, won't they eventually learn that the 'resolute' policy is dominated by a policy that tricks the predictor (if possible) or simply accepts the loss? Does resolute choice require amnesia to work?

  *   **Follow-up:** If she argues that resolute choice wins in the long run across *all* Newcomb-like problems, ask: "But if the Toxin Puzzle specifically is a net loss in utility (sickness) for the sake of a one-time gain, doesn't iterating it just compound the cost of the sickness without additional reward? Why keep drinking?"

  **10. The Cost of Rationality**
  Finally, let's zoom out. If accepting your view requires agents to ignore local incentives at $t_1$ and privilege $t_0$ plans even when evidence suggests deviating, does this make rationality more demanding than we thought? Are you describing how humans *should* reason, or are you describing a specific architecture for AI that humans simply can't instantiate without modification?

  *   **Follow-up:** If she says it applies to humans too, ask: "If it applies to humans, are we essentially arguing that to be rational is to be somewhat rigid? Is there a risk that this form of rationality makes agents vulnerable to errors in the initial plan that they are then forbidden from correcting?"
