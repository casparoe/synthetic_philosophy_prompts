  This highlights the core mechanical irony of the Frankfurt case: Black's device is causally inert in the actual sequence (hence no "cause" to bill for) yet metaphysically potent in eliminating alternatives (the "counterfactual" work), which is exactly why Frankfurt thinks it severs responsibility from the Principle of Alternative Possibilities.
