answer: |-
  **MEMORANDUM**

  **TO:** Hospital Administration and Executive Leadership
  **FROM:** Clinical Ethics Oversight Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Evaluation of Proposed Pilot for Directive Ethics Consultation in Medically Inappropriate Treatment Cases

  ### 1. Purpose and Background

  The Clinical Ethics Oversight Committee has reviewed the Administration's proposal to pilot a "directive" model for clinical ethics consultations. This model is intended for a specific, recurring dispute type: cases where a surrogate decision-maker requests continued ICU-level care that the treating team and ethics consultants agree is medically non-beneficial (often termed "futile" or "inappropriate").

  Under the current **facilitative model**, ethics consultants assist parties in reasoning toward a mutual resolution without issuing a binding verdict. Under the proposed **directive model**, the ethics consultant's recommendation would enter the medical record as a standing order, which the attending physician must follow unless they formally document dissent.

  Administration argues this change is necessary to resolve protracted conflicts, reduce moral distress among staff, and ensure appropriate resource allocation. This memo outlines the Committee's decision regarding the adoption of this model and the safeguards required to implement it ethically.

  ### 2. Ethical Analysis: The Question of Moral Agency

  The Committee engaged in robust deliberation regarding this proposal. While we acknowledge the administrative imperative to resolve intractable conflicts, a significant portion of the Committee raised a fundamental ethical objection that must be addressed on its merits, not merely as resistance to efficiency.

  **The Objection:**
  Critics within the Committee argue that medicine is inherently a moral practice, not merely a technical one. An attending physician is not a neutral instrument of care but a moral agent entrusted by the patient and society to act according to their professional judgment and conscience. If an attending complies with an ethics "order" they neither understand nor endorse, they are reduced to a technician executing a bureaucratic mandate. This compromises the physician's integrity, potentially damages the therapeutic relationship, and undermines the primary purpose of ethics consultation: to support moral reasoning, not to bypass it.

  **Committee Assessment:**
  The Committee finds this objection valid. **Compliance without endorsement is not ethical practice; it is bureaucratic acquiescence.** If the directive model forces an attending to act against their conscience without recourse, it shifts moral distress from the nursing staff to the physician without resolving the underlying ethical tension. Furthermore, in most jurisdictions, ethics consultants lack the licensure or privileging to write medical orders. Delegating this authority creates legal and liability ambiguities.

  However, the Committee also recognizes that the current facilitative model can leave clinicians stranded in situations where continued treatment violates standards of care. A purely facilitative approach assumes all parties are reasoning in good faith toward a shared goal; in cases of medically inappropriate treatment, this assumption may no longer hold.

  ### 3. Committee Decision

  The Committee **cannot recommend the adoption of the directive model as currently described** (i.e., an ethics recommendation entering the chart as an automatic order). This mechanism erodes the attending's moral agency and creates licensure risks.

  However, recognizing the need for a mechanism to resolve disputes regarding medically inappropriate treatment, the Committee **recommends the adoption of a Modified Presumptive Model**, contingent upon strict safeguards. This model retains the *weight* of a directive recommendation without stripping the attending of their *agency* as the author of medical orders.

  ### 4. Required Safeguards for Implementation

  To proceed with a pilot that respects the moral agency of the attending while achieving administrative resolution, the following safeguards must be codified in policy:

  **A. The "Co-Signature" Requirement (Preservation of Agency)**
  The ethics recommendation cannot enter the chart as an independent order. Instead, a finding of "Medically Inappropriate Treatment" by the ethics consultant serves as a *presumptive recommendation* for withdrawal or limitation of care.
  *   **Safeguard:** The actual order to withdraw or limit care must be written and signed by the Attending of Record.
  *   **Rationale:** This ensures the attending remains the moral author of the action. It prevents the "technician" scenario by requiring the physician to personally validate the decision, even if that validation is based on deference to the ethics process.

  **B. Mandatory Dialogue and Education (Addressing Understanding)**
  The objection notes that attendings may comply with verdicts they do not *understand*.
  *   **Safeguard:** Before a directive recommendation is finalized, a mandatory face-to-face debriefing between the ethics consultant and the attending must occur. The consultant must articulate the ethical rationale (e.g., proportionality, beneficence, non-maleficence) specifically as it applies to the case.
  *   **Rationale:** This ensures that compliance is informed. If the attending cannot understand the rationale, the recommendation should not proceed to the order stage.

  **C. The Conscience Clause and Transfer Protocol (Addressing Endorsement)**
  The objection notes that attendings may comply with verdicts they do not *endorse*.
  *   **Safeguard:** If, after the mandatory dialogue, the attending physician states they cannot morally endorse the recommendation, they must not be forced to write the order. The hospital must activate an immediate transfer protocol to move the patient to a willing provider, or, if transfer is impossible, the institution must assume legal indemnification for the withdrawal of care while allowing the attending to recuse themselves from the specific act of withdrawal.
  *   **Rationale:** This acknowledges that moral agency includes the right of conscience. Forcing endorsement creates moral injury; providing a pathway for recusal respects the physician's integrity while still allowing the institution to resolve the resource allocation issue.

  **D. Retrospective Audit and Appeal**
  *   **Safeguard:** All cases utilizing this Modified Presumptive Model must undergo retrospective review by the Ethics Oversight Committee within 30 days. The attending retains the right to file a formal dissent without fear of retribution, which triggers an automatic review of the consultant's reasoning.
  *   **Rationale:** This prevents the "directive" power from becoming arbitrary and ensures the consultant remains accountable to the medical staff.

  ### 5. Implementation Plan

  We propose a six-month pilot of the **Modified Presumptive Model** subject to the safeguards above.

  1.  **Policy Revision:** Legal and Medical Staff Offices will draft language clarifying that ethics consultants provide *recommendations for orders*, not *orders* themselves.
  2.  **Training:** Ethics consultants will receive training on delivering directive recommendations without overstepping clinical authority.
  3.  **Monitoring:** The Oversight Committee will track rates of attending dissent, transfer requests, and reports of moral distress among physicians during the pilot.

  ### 6. Conclusion

  The goal of clinical ethics is to improve the quality of decision-making, not merely to expedite it. By rejecting the "ethics order" mechanism in favor of a "presumptive recommendation with agency safeguards," we can resolve disputes regarding non-beneficial care without compromising the moral integrity of the physicians tasked with providing that care. We believe this approach satisfies the Administration's need for resolution while upholding the ethical standards of the medical profession.

  **Approved by:**
  Clinical Ethics Oversight Committee
  *Chair, Dr. Elena Rosetti*
  *Committee Vote: 8 For, 2 Against, 1 Abstention*
