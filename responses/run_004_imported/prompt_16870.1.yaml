  2.  **Deconstruct the Philosophy (Anscombe/Truman):**
      *   *Pacifism:* War is always wrong. Anscombe/Walt rejected this.
      *   *Just War/Double Effect:* Killing combatants to stop aggression is permissible. Killing civilians *as a means* to victory is murder. Killing civilians as an *unintended side effect* of hitting a military target is tragic but potentially permissible (though still needs proportionality).
      *   *Truman Case:* Anscombe argued Truman intended civilian death to terrorize/surrender. That's the line.
      *   *Walt's Case:* He objected to honoring the *policy maker* (Air Marshal), not necessarily the *pilot* (Grandad). The pilot follows orders/targets; the Marshal sets the strategy of area bombing.
      *   *The Nuance:* Moral responsibility lies in the *intention* and the *choice of policy*, not just the physical act of dropping bombs.

  3.  **Determine the Tone:**
      *   Respectful, somber, but intellectually honest.
      *   Bridge-building: Acknowledge the pain of the rift without reopening the wound.
