answer: |-
  Thank you all for being here.

  There are instructions for a funeral, and then there are instructions from the deceased. Walt left us a very specific commandment regarding this day. He told my mother, half-joking but entirely serious: "Don't you dare bury me as a man who thought war was wrong."

  So, I won't.

  To the philosophers in the room, you know that Walt was a student of Elizabeth Anscombe. You know that for him, ethics wasn't a game of semantics; it was a map for how to live without losing your soul. To the rest of the family, you know that Walt was the uncle who could be difficult, who cared more about what was *true* than what was comfortable.

  Those two things are the same thing.

  Walt served in the RAF. He saw what war does. He knew that sometimes, terrible things are necessary to stop greater evils. He was not a pacifist. Pacifism, to Walt, was a luxury that muddied the waters. It treated all killing as the same sin. Walt believed that some killing is tragic, but some killing is murder. And the difference between the two wasn't the body count. It was the intention.

  This is where things got complicated. And I know, looking around this room, that I am speaking to people who lived through the complication.

  Walt believed that you cannot choose to kill the innocent as a *means* to an end. You can't say, "We will kill these civilians to terrorize the enemy into surrendering." That, he argued, makes the death of the innocent the tool of your victory. That is morally forbidden. But, he also acknowledged the tragedy of war: that sometimes, in hitting a legitimate target, innocent people die as a foreseen but unintended side effect. That is a horror, but it is not the same thing.

  I know this distinction caused pain in this family. Specifically, regarding the honorary fellowship he turned down in the nineties. I know that for many of you, that moment felt like a judgment on the men who flew the planes. It felt like Walt was calling them murderers.

  I need to say this clearly, because Walt can no longer say it himself: He did not believe his brother was a murderer.

  He did not believe the pilots were murderers. He did not believe the ground crew were murderers.

  Walt's objection was never to the young men following orders, trying to survive, trying to win a war against a tyrannical enemy. His objection was to the policy makers who decided that targeting cities was an acceptable strategy. He drew a line between the architect of the strategy and the men who had to fly it. He knew that a twenty-year-old pilot in a cockpit does not have the same moral agency as the Marshal in the office deciding where the bombs are aimed.

  He loved his brother. He respected his service. But he could not honor the policy. And because he loved the truth, he couldn't pretend the two were the same.

  I know that distinction didn't heal the rift. I know that for forty years, Christmas dinners were quieter than they should have been. I know that Grandad carried a weight, feeling that his service had been stained by his own brother's conscience. And I know Walt carried a weight, knowing that his stand for principle had cost him the closeness he wanted with his brother.

  If Walt were here, he would tell you that moral clarity is expensive. He would tell you that holding a line on what is right often costs you something you love. He paid for that clarity with his relationship with Grandad. That was a cost he regretted deeply, even if he never regretted the principle.

  But today, we are not here to debate the ethics of strategic bombing. We are here to remember a man who tried, however imperfectly, to live by a code.

  Walt was a man who believed that intentions matter. That *why* we do things matters just as much as *what* we do. He believed that we owe it to the dead to be honest about how they died, and we owe it to the living to be honest about why we fight.

  To Grandad's side of the family: Walt honored your sacrifice. He honored the duty you performed in a time when the world was on fire. He never questioned your courage, and he never questioned your love for this country. He only questioned the orders you were given, not the hands that carried them out.

  To Walt's colleagues: He remained faithful to the argument until the end. He didn't simplify it for comfort.

  And to all of us: He taught us that you can love someone and disagree with them. You can honor a soldier without honoring the strategy. You can grieve the loss of a brother without pretending the silence between them didn't exist.

  Walt didn't think war was wrong. He thought carelessness was wrong. He thought forgetting the difference between tragedy and murder was wrong. He thought forgetting the humanity of the enemy was wrong.

  He was a ground crewman who became a philosopher. He spent his life maintaining the engines of argument, making sure they ran true, making sure they didn't explode.

  He loved us. He loved his brother. And he loved the truth. May we be brave enough to hold all three.

  Rest in peace, Walt.
