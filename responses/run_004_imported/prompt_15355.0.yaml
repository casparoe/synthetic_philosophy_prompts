answer: |-
  Epistemological disjunctivism (ED) cannot successfully defuse the argument from illusion on its own terms; it is quietly parasitic on the metaphysical thesis it claims to bracket. Pritchard's central innovation is the claim that in the good case, the subject's rational support is both factive (e.g., "I see that $p$") and reflectively accessible. However, this conjunction creates an instability if one remains neutral on the metaphysics of experience. If the metaphysical nature of the experience in the good case is of the same fundamental kind as in the bad case (metaphysical conjunctivism), then the factivity of the reason must be external to the conscious character of the experience. But if the factivity is external to the conscious character, it cannot be reflectively accessible in the robust sense required to defeat the skeptic. To maintain that the subject can reflectively know they have a factive reason, the experience itself must metaphysically reveal the world, which is precisely the thesis of metaphysical disjunctivism (or Naive Realism). Without this metaphysical grounding, the epistemic asymmetry between the good and bad cases becomes brute and unintelligible.

  The sharpest version of the objection highlights this explanatory gap. If a hallucinating subject possesses only non-factive support, and the perceiving subject possesses factive support, we require an explanation for why the epistemic standing differs so radically. On a metaphysically neutral or conjunctivist view, the internal grounds available to the subject are identical in both cases. Consequently, any difference in epistemic status is "screened off" from the subject's perspective. For Pritchard to insist that the subject *can* access the difference via reflection, he must imply that the good case offers a perceptual relation that the bad case lacks—not just causally, but constitutively. If the experience in the good case does not metaphysically differ in kind (i.e., if it is not a direct awareness of the fact), then the claim that "I see that $p$" is accessible is indistinguishable from a lucky guess from the inside. Thus, the epistemic privilege of the good case only makes sense if the metaphysical nature of the experience secures that privilege.

  Therefore, ED does not block the argument from illusion independently; it merely pushes the metaphysical bullet down the road. The argument from illusion relies on the premise that because the good and bad cases are introspectively indistinguishable, they share a common epistemic basis. ED attempts to deny the conclusion while accepting the indistinguishability thesis. But unless one adopts metaphysical disjunctivism to argue that the indistinguishability is merely superficial and that the fundamental nature of the veridical experience provides the factive reason, ED lacks the resources to explain *why* the rational support is factive in one case and not the other. To save the epistemological thesis, one must pay the metaphysical price: the veridical case must be a fundamentally different state of affairs, not just a true belief layered over a common mental factor. Epistemological disjunctivism, stripped of its metaphysical counterpart, collapses into an unmotivated assertion of epistemic luck.
