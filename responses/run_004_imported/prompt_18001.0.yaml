prompt: |-
  My aunt died last week and I somehow got roped into speaking at her memorial. She'd spent something like 35 years running a little Madhyamaka meditation group out of her living room and knew Nagarjuna's Root Verses back to front — I'm just a software engineer who sat in on her Tuesday group sometimes, not a dharma teacher, so this feels way above my pay grade. Before she died she left a note with real specific instructions: don't say she's "in a better place," or "watching over us," or that her soul "carries on" — but also dont you dare say she "just ended, nothing more" either. She wrote that both of those are exactly the two horns of the tetralemma Nagarjuna spends the nirvana chapter of the Root Verses demolishing (whether the Tathagata exists after death, doesn't, both, or neither), and that hearing either one at her own memorial would honestly embarrass her. She even preemptively banned the cop-out of calling it "an unanswerable mystery" — said that's not what emptiness means either. Problem is half the room is her actual sangha who'll 100% notice if I fudge this, and the other half is coworkers and cousins who've never heard "emptiness" used like that and just want to feel a bit better. Can you write me something like 5 minutes long that actually deals with this honestly instead of hiding behind generic "everything is impermanent" vibes?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A software engineer, nephew/niece of the deceased, occasional attendee of her meditation group (not a teacher).
      *   **Deceased:** Aunt, ran a Madhyamaka meditation group for 35 years, expert on Nagarjuna's *Root Verses on the Middle Way* (Mūlamadhyamakakārikā).
      *   **Constraints (The "Aunt's Note"):**
          *   NO "She's in a better place" (Existence after death).
          *   NO "She's watching over us" (Implies a continuing self).
          *   NO "Her soul carries on" (Essentialism).
          *   NO "She just ended, nothing more" (Nihilism/Cessation).
          *   NO "It's an unanswerable mystery" (Agnosticism/Evasion).
          *   *Reasoning:* These correspond to the four corners of the *catuṣkoṭi* (tetralemma) regarding the Tathagata after death, which Nagarjuna deconstructs in Chapter 25 of the *Root Verses* (Examination of Nirvana).
      *   **Audience:** Mixed. Half are serious sangha members (will spot doctrinal errors), half are laypeople/coworkers/cousins (need emotional resonance, not just philosophy).
      *   **Tone:** Honest, authentic to her teachings, not generic "impermanence" platitudes, accessible but doctrinally sound (Madhyamaka style).
      *   **Length:** Approximately 5 minutes spoken (roughly 700-800 words).

  2.  **Deconstruct the Philosophical Challenge:**
      *   The core of Madhyamaka is *Śūnyatā* (Emptiness) and *Pratītyasamutpāda* (Dependent Origination).
      *   Nagarjuna's point in Chapter 25 is that Nirvana isn't a *place* you go, nor is it *annihilation*. It's the cessation of conceptual proliferation (*prapañca*).
      *   To speak about her death without falling into eternalism (she exists somewhere) or nihilism (she is gone forever), one must speak about *impact*, *connection*, and the *nature of reality* as she understood it.
      *   The "Middle Way" isn't a compromise; it's seeing things as they are without imposing inherent existence.
      *   *Key Insight:* Her life wasn't a solid object that broke; it was a process that transformed. Her influence continues dependently, not essentially.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge the awkwardness. Be honest about being an engineer, not a lama. This builds trust with both groups.
      *   **The Constraint:** Mention the note. It's a powerful story element that shows her dedication to the truth until the end. It explains *why* the speech is unusual.
      *   **The Philosophy (Simplified):** How to explain the tetralemma ban without getting bogged down in Sanskrit? Use the metaphor of a flame or a ripple. Focus on *Dependent Origination*. She wasn't a separate thing that stopped; she was a web of causes and conditions.
      *   **The Personal Connection:** How did she actually teach? Not just books, but presence. How does that continue? In the habits she instilled, the kindness she sparked.
      *   **The Closing:** Bring it back to the room. The sangha is the continuation. The grief is real but not a trap.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I'm [Name]. I write code. Auntie taught Buddhism.
      *   She left a list of things not to say. No heaven, no oblivion.
      *   She studied Nagarjuna. He said you can't say the Buddha exists after death or doesn't.
      *   So where is she? She's in the way we treat each other.
      *   She wasn't a solid thing. She was a flow.
      *   Thank you for coming.

  5.  **Drafting - Iteration 2 (Adding Depth & Tone):**
      *   Need to make it warmer. The "code" analogy might work well for the speaker's background. Debugging reality?
      *   Need to address the non-Buddhists so they don't feel lost. Focus on "legacy" but defined through emptiness.
      *   *Crucial Point:* Avoid saying "she lives on in our hearts" (too close to eternalism/soul). Instead, "her actions ripple forward."
      *   *Crucial Point:* Avoid saying "she is gone" (nihilism). Instead, "the conditions of 'Auntie' have shifted."

  6.  **Refining the Madhyamaka Nuance:**
      *   Nagarjuna says *Samsara is not distinct from Nirvana*. So her death isn't a departure from reality to a better one. It's just a change in the pattern.
      *   The speech needs to validate grief without reifying the "self" that is grieving or the "self" that died.
      *   *Phrase to avoid:* "She is at peace." (Implies a subject experiencing peace).
      *   *Phrase to use:* "The struggle of concepts has settled."

  7.  **Writing the Speech (incorporating the constraints):**
      *   *Intro:* Self-deprecating humor about being a coder.
      *   *The Note:* Read the constraints. It shows her humor and rigor.
      *   *The Teaching:* Explain *why* she banned those phrases. Not to be difficult, but to be honest.
      *   *The Metaphor:* A wave returning to the ocean is too cliché/Hindu. How about a conversation? Or code? Let's use the metaphor of a *conversation* or a *pattern*. Actually, the "flame" is classic Buddhist but needs care. Let's stick to "Cause and Effect" (Karma/Dependent Origination) which is safer for Madhyamaka.
      *   *The Emotional Core:* We miss her. That pain is real. But the pain comes from clinging to a fixed idea of her.
      *   *The Conclusion:* We are the continuation. Not her soul, but her *intent*.

  8.  **Review against Constraints:**
