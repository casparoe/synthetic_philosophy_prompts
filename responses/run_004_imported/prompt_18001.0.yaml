answer: |-
  Thank you all for being here.

  For those who don't know me, I'm [Your Name]. I'm [Aunt's Name]'s nephew/niece. By trade, I'm a software engineer. I spend my days building logic structures that try to make sense of a chaotic world. My aunt, on the other hand, spent thirty-five years teaching people how to see that the chaos *is* the structure, and that the structures we build in our heads are often the source of the suffering.

  I'm not a Dharma teacher. I sat in on her Tuesday nights when I could, usually when my code was broken or my head was full. I know enough to know that standing here, I am significantly out of my depth. But [Aunt's Name] was very specific about who should speak, and she left me a set of instructions that I think tell you more about her than any eulogy I could write.

  She left a note. It said: *Do not say I am in a better place. Do not say I am watching over you. Do not say my soul carries on. But also, do not say I am simply gone, ended, nothing more. And do not tell me it is a great mystery.*

  She wrote that all of those statements are traps. In her tradition—Madhyamaka, the Middle Way—these are the four corners of a logical box that the philosopher Nagarjuna spent his life dismantling. To say she "exists" somewhere now is to pretend she was a fixed object that moved locations. To say she "doesn't exist" is to pretend she was a fixed object that was destroyed. To say "both" or "neither" is just wordplay. And to call it a "mystery" is a way of avoiding the truth.

  She didn't ban these phrases to be difficult. She banned them because she wanted us to be honest.

  So, where is she?

  If you ask a programmer where a program goes when the computer turns off, I can't show you a file path. But I can show you the output it generated. I can show you the users it helped, the data it changed, the other code it influenced.

  [Aunt's Name] was not a solid, separate thing that suddenly stopped. She was a vast, intricate web of causes and conditions. She was the tea she poured for you when you were crying. She was the patience she practiced when she was angry. She was the silence she held when words were too heavy.

  Those things didn't vanish.

  When I look at the people in this room, I see her. Not because her spirit is possessing you, but because her actions rippled outward and shaped you. The way the sangha here sits together in silence? That's her. The way her cousins check in on each other when things get hard? That's her. The way I try to pause before reacting to a bug in production, or a problem in my marriage? That's her.

  Nagarjuna taught that there is no difference between the cycle of suffering and the peace of liberation. They aren't two different places. The peace isn't somewhere she went; it's the way she lived, and it's the capacity we have right now to see things clearly.

  Grief is real. I feel it. I miss her voice. I miss her laugh. In her view, feeling that pain isn't a mistake. The pain comes because we loved, because we were connected. But she would ask us not to solidify that pain into a story about how we are "broken" or how she is "lost."

  She isn't lost. The conditions that we call "[Aunt's Name]" have changed, just as winter changes into spring. The water doesn't die when it turns to steam; it just becomes harder to hold.

  So, we aren't here to send her off to a better place. She's not going anywhere. And we aren't here to mourn the extinction of a light. The light wasn't hers to own; it was just passing through.

  The best way to honor her isn't to pray for her, or to worry about her status in the afterlife. It's to pick up the practice where she left it. To be kind without expecting credit. To sit with uncertainty without rushing to fix it. To look at each other and realize that there is no solid "self" here to be defended, only this shared, fragile, precious moment.

  She taught us that everything is empty of inherent existence. That sounds cold, but she meant it to be freeing. It means nothing is stuck. Not our grief, not our confusion, and not this goodbye.

  Thank you for loving her. Thank you for being the place where her influence continues. Let's go have some tea.
