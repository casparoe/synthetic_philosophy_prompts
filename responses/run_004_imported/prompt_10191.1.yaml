answer: |-
  This is an exceptionally sharp analysis. You have effectively reinvented one of the most famous and difficult problems in 20th-century metaethics. You are not confusing yourself; you have identified the exact pressure point where moral anti-realism (specifically **Expressivism**) tends to crack.

  Let's work through your three requests directly, digging into the mechanics of the argument rather than just handing you a textbook definition.

  ### 1. Does your restatement of the problem hold up?

  **Yes, absolutely.** Your diagnosis is precise.

  Here is why your intuition is correct: In standard logic, an argument is **valid** if the truth of the premises guarantees the truth of the conclusion. This relies on the sentences having **truth conditions** (conditions under which they are true or false).

  *   **Premise 1:** "Cheating on taxes is wrong."
      *   *Expressivist translation:* "Boo tax cheating!" (An expression of attitude).
  *   **Premise 2:** "If cheating on taxes is wrong, then talking your accountant into it is wrong."
      *   *Expressivist translation:* "If 'Boo tax cheating!', then 'Boo talking accountant into it!'."

  As you noticed, the translation of Premise 2 is nonsense. You cannot put an exclamation mark (an command or emotion) inside the "if" clause of a conditional statement. "If boo stealing..." doesn't express an attitude; it *talks about* an attitude.

  This creates a dilemma for the Expressivist:
  1.  **If** Premise 2 expresses an attitude, what is it? It's not booing tax cheating (because you're not asserting that). It's not booing the accountant trick (because you're not asserting that either).
  2.  **If** Premise 2 *doesn't* express an attitude, then Expressivism is false (because it claims *all* moral sentences express attitudes).
  3.  **If** moral sentences don't have truth values, then the argument cannot be logically valid in the standard sense, because there is no "truth" to preserve from premises to conclusion.

  You have correctly identified that the Expressivist needs to explain how moral reasoning works without truth.

  ### 2. Is this a known snag?

  **Yes.** This is known as the **Frege-Geach Problem** (named after Gottlob Frege and Peter Geach).

  It is widely considered the biggest hurdle for Expressivism. Geach's specific point (which mirrors your tax example) was that moral terms must have the same meaning whether they are used in a straight assertion ("Stealing is wrong") or embedded in a complex sentence ("If stealing is wrong...").

  If "wrong" means "Boo!" in the first sentence, but doesn't mean "Boo!" in the second sentence (because you aren't actually booing), then the word "wrong" is changing its meaning mid-argument. If the meaning changes, the argument commits the **fallacy of equivocation**, and it isn't valid anymore.

  So, you are in good company. This is the standard objection that Realists throw at Anti-Realists.

  ### 3. Is your "policy" idea a genuine fix, or does it hide the hole?

  Your proposed fix is: *Accepting the if-then sentence is signing onto a policy: "Don't boo the first thing unless you also boo the second."*

  This is actually the sophisticated solution that modern Expressivists (like Simon Blackburn and Allan Gibbard) have developed. It is called the theory of **Higher-Order Attitudes**.

  Here is how they would flesh out your idea, and here is where the "hidden hole" you suspected actually lies.

  #### How the "Policy" Fix Works
  To save logic, the Expressivist argues that moral conditionals express a **second-order attitude** about your **first-order attitudes**.

  *   **Sentence 1:** "Tax cheating is wrong."
      *   *Meaning:* I disapprove of tax cheating.
  *   **Sentence 2:** "If tax cheating is wrong, then encouraging it is wrong."
      *   *Meaning:* I disapprove of **anyone who disapproves of tax cheating but does not disapprove of encouraging it.**

  So, when you accept both premises, you are holding two attitudes:
  1.  Disapproval of tax cheating.
  2.  Disapproval of the combination: [Disapproval of tax cheating + No Disapproval of encouraging it].

  If you then deny the conclusion (i.e., you refuse to disapprove of encouraging it), you are in a state of **attitudinal conflict**. You are satisfying the first attitude, but violating the second.

  #### Does this solve the "Inconsistency" worry?
  You asked: *"I genuinely don't know what it means for two attitudes or feelings to be 'inconsistent' in that same sense [as beliefs]."*

  This is the crux of the matter.
  *   **Belief Inconsistency:** If I believe "It is raining" and "It is not raining," I am describing the world in a way that is **impossible**. The world cannot be both ways. Logic tracks the structure of reality.
  *   **Attitude Inconsistency:** If I "Boo stealing" but don't "Boo encouraging stealing," is that impossible? No. I can psychologically feel that way. I can be hypocritical.

  The Expressivist's "policy" fix changes the definition of **validity**.
  *   **Realist Validity:** You *cannot* accept the premises and deny the conclusion without contradicting the **facts**.
  *   **Expressivist Validity:** You *cannot* accept the premises and deny the conclusion without having a **fragmented mind**.

  #### The Remaining Hole (Why your suspicion is right)
  You suspected this might just be "relocating the mystery." You are correct. Here is why philosophers still argue about this:

  **1. The "So What?" Problem**
  If logic is just about keeping your attitudes tidy, why *should* I keep them tidy?
  If I say, "I know I disapprove of stealing, and I know I have a policy against disapproving of stealing without disapproving of encouraging it... but I just don't care about being consistent," the Expressivist has no recourse.
  In a Realist framework, if you deny the conclusion, you are **mistaken** (like saying 2+2=5). In the Expressivist framework, if you deny the conclusion, you are just **messy**. But being messy isn't logically forbidden; it's just psychologically uncomfortable. This makes moral logic feel weaker than mathematical logic.

  **2. The Truth-Aptness Intuition**
  When we argue about morals, it *feels* like we are trying to find the truth, not just compare our policies.
  If I say, "Slavery is wrong," and you say, "No it isn't," we act like one of us is mistaken about the world. Your "policy" fix suggests we are just saying, "I have a policy against slavery" vs. "I don't." That implies that if our policies differ, neither of us is wrong, we're just different. But moral argumentation feels like we are trying to *correct* each other, not just compare notes.

  **3. The Embedding Regress**
  Your fix works for simple "If P then Q" statements. But what about more complex logic?
  *   "Either stealing is wrong or borrowing without asking is wrong."
  *   "It is not the case that stealing is wrong."
  To make your "policy" idea work here, you have to invent more and more complex higher-order attitudes. (e.g., "I disapprove of not having a policy that...")
  Critics argue this becomes incredibly convoluted. It makes the meaning of "wrong" incredibly complex in logical sentences, even though it seems simple in ordinary sentences. This violates a rule of thumb in philosophy called **compositionality** (the meaning of a complex sentence should be built simply from the meanings of its parts).

  ### Verdict

  You have successfully poked a hole in the standard Expressivist view, and your proposed patch is exactly the one professional philosophers use to try to plug it.

  *   **Is your restatement accurate?** Yes. You identified the Frege-Geach problem perfectly.
  *   **Is the "policy" fix a solution?** It is a **functional** solution, but not a **satisfying** one for everyone.
      *   It saves the *form* of logic (you can still do moral reasoning).
      *   It fails to save the *force* of logic (it turns logical necessity into psychological consistency).

  **The Bottom Line:**
  Your worry that "inconsistent" means something different for attitudes than for beliefs is the exact reason why many philosophers remain Moral Realists. They argue that unless moral statements describe facts (like "stealing causes suffering" or "stealing violates rational agency"), we cannot explain why moral arguments are **binding** rather than just persuasive.

  If you stick with your Expressivist view, you have to accept that moral logic is a species of **practical rationality** (how to organize your desires) rather than **theoretical rationality** (how to describe the world). That is a defensible position, but you must accept the cost: you lose the claim that someone who denies your moral conclusion is "factually wrong," and can only claim they are "attitudinally inconsistent."

  You didn't confuse yourself; you just did the hard work of metaethics in a single afternoon.
