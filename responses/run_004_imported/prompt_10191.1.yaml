prompt: |-
  Okay so this has been rattling around in my head for like two weeks and I finally wrote my thoughts down properly, hoping you can poke holes in it for me. It started as a dumb argument with my roomate about whether right and wrong are actually "real," or whether saying something like "stealing is wrong" is basically just a fancy way of saying "boo, stealing, don't do it" -- not describing a fact so much as cheering or booing it. I got kind of into that idea (I think this counts as some flavor of moral anti-realism, not totally sure of the exact term) because it explains why moral arguments never get settled the way factual ones do.

  But when I tried to spell out how this works once you reason WITH moral claims instead of just stating them on their own, I got stuck. Take this: "Cheating on your taxes is wrong. And if cheating on your taxes is wrong, then talking your accountant into cheating for you is wrong too. So talking your accountant into it is wrong." That looks like a completely normal, valid argument, same shape as any other if-then argument. But if line one just means "boo tax cheating," I can't figure out what line two (the if-then one) even means, since nobody's booing anything in it -- you're not asserting either half on its own, just linking them somehow. So what attitude is THAT sentence expressing? And if it isn't expressing any attitude, what exactly would be wrong with someone who accepts both premises and still denies the conclusion -- I want to say "he'd be making a mistake," but a mistake about what, if none of these sentences are stating anything that could be true or false in the first place?

  The best patch I could come up with: maybe accepting the if-then sentence isn't about booing anything, it's more like signing onto a policy along the lines of "don't boo the first thing unless you also boo the second," and the argument "works" because it'd be inconsistent to sign onto that policy, boo the first thing, and still refuse to boo the second. Except I don't think that actually rescues anything, since "inconsistent" clearly means something when we're talking about beliefs that can't both be true at once, and I genuinely don't know what it means for two attitudes or feelings to be "inconsistent" in that same sense -- it feels like I just relocated the mystery into that one word instead of solving it. So could you actually go through this with me: (1) does my restatement of the problem hold up, or am I confusing myself somewhere along the way, (2) is this a known snag that people have already worked over (it feels too obvious for nobody to have noticed), and (3) is my "policy" idea a genuine fix, or is it just hiding the same hole under new language? I'd rather you actually work through the argument itself than just name-drop the debate and hand me a summary of it.
