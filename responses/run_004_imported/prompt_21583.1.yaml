          *   Mention "Problem Intuitions."
      *   *Section 2: The Illusionist Leverage (The Core Dispute).*
          *   Explain Theo's logic: The "Explanatory Drain." If functional mechanisms explain the *claim*, the *referent* becomes redundant.
          *   Explain Chalmers' logic: The "Truth Maker." The judgment is true *because* the experience exists. The experience causes the judgment.
          *   Address the "Bait and Switch": It's not a switch, it's a challenge to *necessity*.
