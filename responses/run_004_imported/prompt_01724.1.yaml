prompt: |-
  G.E.M. Anscombe objected vehemently to Oxford's decision to honor President Truman, arguing that his ordering of atomic bombings on Hiroshima and Nagasaki amounted to murder. Yet accounts of her position contain an apparent paradox: she herself conceded that the bombing likely shortened the war and saved lives on balance. If the utilitarian calculation favored Truman's action, how can Anscombe simultaneously maintain that it was murder? What principle allows her to reject the very consequentialist framework that would seem to vindicate the bombing, whilst refusing to embrace wholesale pacifism?
reasoning: |-
  Here's a thinking process that leads to the explanation of Anscombe's position:

  1.  **Analyze the Request:**
      *   **Subject:** G.E.M. Anscombe's objection to Oxford honoring Harry Truman (1956).
      *   **Core Conflict:** Anscombe called the atomic bombings "murder" but conceded they likely shortened the war and saved lives (utilitarian benefit).
      *   **The Paradox:** How can an act be "murder" if it produces a net good (saved lives)?
      *   **The Question:** What principle allows her to reject consequentialism (utilitarianism) without becoming a pacifist?

  2.  **Identify the Key Philosophical Concepts:**
      *   **Consequentialism/Utilitarianism:** The morality of an act is determined by its outcomes (ends justify the means).
      *   **Deontology/Absolutism:** Certain acts are intrinsically wrong regardless of outcomes.
      *   **Doctrine of Double Effect (DDE):** Distinguishes between intended effects and merely foreseen side effects.
      *   **Just War Theory:** Specifically *jus in bello* (conduct in war).
      *   **Anscombe's Specific Contribution:** Revival of natural law ethics, critique of modern moral philosophy ("Modern Moral Philosophy"), emphasis on intention.

  3.  **Recall/Research Anscombe's Specific Argument (Truman Protest):**
      *   *Context:* 1956, Oxford University proposed giving Truman an honorary degree. Anscombe led the protest.
      *   *Her Stance:* The bombing was the deliberate killing of innocents.
      *   *The "Murder" Claim:* Murder isn't just "killing"; it's *unjust* killing. For Anscombe, deliberately targeting non-combatants is intrinsically unjust.
      *   *The Utilitarian Concession:* She acknowledged the argument that it ended the war sooner. She didn't necessarily deny the *facts* of the consequentialist argument, but denied their *moral relevance* to the specific act of killing innocents.
      *   *Not Pacifism:* She believed in Just War. Killing combatants is permissible. Killing innocents is not.

  4.  **Resolve the Paradox (The Core Mechanism):**
      *   The paradox exists only if one accepts the premise that "net lives saved" justifies "killing innocents."
      *   Anscombe rejects this premise. She holds a **deontological constraint** (specifically rooted in Natural Law/Catholic tradition).
      *   **Key Distinction:** Intention vs. Foresight.
      *   **The Principle:** It is never permissible to *intend* the death of the innocent as a means to an end, even a good end.
      *   **Consequentialism Rejected:** She argues that consequentialism corrupts moral reasoning by allowing *any* atrocity if the math works out.
      *   **Pacifism Avoided:** Killing is allowed in war *if* the target is legitimate (combatants) and the intention is just (e.g., stopping aggression, not slaughter).

  5.  **Drafting the Explanation (Iterative Process):**

      *   *Introduction:* State the core of Anscombe's position. It's not a paradox to her; it's a clash of ethical frameworks.
      *   *The Rejection of Consequentialism:* Explain that she views morality as rule-based (absolute prohibitions), not calculation-based. The "ends do not justify the means."
      *   *The Doctrine of Double Effect (DDE):* This is crucial. Explain the difference between intending death and foreseeing death. Truman *intended* the destruction of civilian populations to force surrender. That makes it murder.
      *   *Just War Theory (Jus in Bello):* Distinguish between combatants and non-combatants. Anscombe isn't a pacifist; she supports killing enemy soldiers. But civilians are immune.
      *   *The Definition of Murder:* For Anscombe, murder isn't just "illegal killing"; it's the *intentional killing of the innocent.* If the act fits this definition, no amount of good consequences changes its moral status.
      *   *Conclusion:* Summarize how she navigates the middle ground (Absolute prohibitions within a Just War framework).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Did she actually concede it saved lives?* The prompt says "accounts of her position contain an apparent paradox: she herself conceded..." I need to address this. Even if she conceded the *argument* was made, her point is that the *moral calculus* is invalid. Actually, looking at her pamphlet "Mr. Truman's Degree," she argues that even if it did save lives, it was still the killing of innocents. She challenges the certainty of the consequentialist claim but primarily challenges its moral validity. I should focus on the moral validity aspect as that answers the "principle" part of the prompt.
      *   *Clarify "Murder":* In common parlance, murder is illegal killing. In Anscombe's natural law ethics, it's the *intrinsically evil act* of intending innocent death.
      *   *Connect to "Modern Moral Philosophy":* Mention her broader critique that without a divine lawgiver or natural teleology, concepts like "ought" lose meaning, but within her framework, certain acts are simply forbidden.

  7.  **Final Polish:** Ensure the tone is analytical and philosophical. Use terms like "agent-centered constraints," "intrinsic evil," and "intentionality."

      *(Self-Correction during drafting)*: Make sure to explicitly answer the "What principle?" question. The principle is the **absolute prohibition against the intentional killing of the innocent** (often articulated through the Doctrine of Double Effect).

  8.  **Final Output Structure:**
      1.  Introduction: The clash of frameworks (Consequentialism vs. Deontology/Natural Law).
      2.  The Definition of Murder: Intentionality and Innocence.
      3.  Rejection of Consequentialism: The "Ends vs. Means" argument.
      4.  Avoiding Pacifism: Just War distinctions (Combatants vs. Non-combatants).
      5.  The Doctrine of Double Effect: The technical mechanism.
      6.  Conclusion: Summary of her ethical stance.

  9.  (Final check against prompt): Did I answer how she rejects consequentialism? Yes. Did I answer how she avoids pacifism? Yes. Did I explain the "murder" vs. "saved lives" tension? Yes.

      *Ready to write.*
answer: |-
  The apparent paradox in G.E.M. Anscombe's position dissolves once one recognizes that she is operating within a fundamentally different ethical framework than the utilitarian one used to vindicate Truman. Anscombe does not accept the premise that a net saving of lives can morally justify an intrinsically evil act.

  To understand how Anscombe rejects consequentialism without embracing pacifism, we must look to three core pillars of her ethical thought: **Natural Law absolutism**, the **Doctrine of Double Effect**, and the **Just War distinction between combatants and non-combatants.**

  ### 1. The Rejection of Consequentialism
  The utilitarian argument posits that the morality of an action is determined solely by its outcome. If Action A kills 100,000 people but saves 1,000,000, it is morally superior to Action B, which kills no one but results in the death of 1,000,000 later.

  Anscombe vehemently rejected this calculus. In her view, morality is not a mathematical equation of goods and evils. Certain actions are **intrinsically evil** (*mala in se*), meaning they are forbidden regardless of their consequences. For Anscombe, the deliberate killing of the innocent is one such absolute prohibition.

  Therefore, when she calls Truman's action "murder," she is making a categorical claim about the *nature of the act itself*, not a comparative claim about the *results of the act*. To Anscombe, arguing that the bombing saved lives is morally irrelevant to the question of whether the bombing was murder. It is akin to arguing that harvesting organs from one healthy person saves five sick people; even if the math works, the act remains forbidden.

  ### 2. The Definition of Murder and Intentionality
  Anscombe's definition of murder is specific and rooted in the **Doctrine of Double Effect (DDE)**, a principle in Catholic natural law ethics which she helped revive in contemporary philosophy. The DDE distinguishes between:
  *   **Intended effects:** What the agent chooses to bring about as a means or an end.
  *   **Foreseen side effects:** Negative consequences that the agent anticipates but does not choose.

  For Anscombe, the atomic bombings constituted murder because the destruction of civilian populations was not merely a foreseen side effect of hitting military targets; it was the **intended means** to force Japan's surrender. The terror and devastation inflicted on Hiroshima and Nagasaki were the mechanism of coercion. Because the death of innocents was intended as a means to an end, the act was intrinsically unjust.

  This explains why she can concede the war might have been shortened without retracting the charge of murder. Even if the intention was "to save American lives," the *method* chosen was the intentional killing of innocents. A good intention (saving lives) cannot justify an evil means (killing innocents).

  ### 3. Avoiding Pacifism: *Jus in Bello*
  The prompt asks how Anscombe avoids wholesale pacifism if she condemns killing that saves lives. The answer lies in **Just War Theory**, specifically the distinction between *combatants* and *non-combatants* (*jus in bello*).

  Anscombe was not a pacifist; she believed that killing in war is sometimes permissible. However, she held that the permission to kill is strictly limited to those engaged in aggression (combatants).
  *   **Permissible Killing:** Destroying enemy military forces, cutting supply lines, or killing soldiers who are actively engaged in unjust aggression. In these cases, the death of the enemy is not necessarily "intended" in the same way; rather, the intention is to stop their capacity to harm, and their death is a foreseen consequence of stopping their aggression.
  *   **Impermissible Killing (Murder):** Deliberately targeting those who are not engaged in aggression (civilians/innocents).

  By maintaining this distinction, Anscombe creates a middle ground. She allows for the violence of war (rejecting pacifism) but places absolute moral constraints on *how* that violence is conducted (rejecting total war/consequentialism).

  ### Summary of the Principle
  The principle that allows Anscombe to hold this position is the **absolute prohibition against the intentional killing of the innocent.**

  This principle functions as an **agent-centered constraint**. It dictates that there are certain things a moral agent must never *do*, regardless of what might happen if they *do not do* them.
  *   **Against Consequentialism:** It denies that the "greater good" can sanitize an intrinsically evil act.
  *   **Against Pacifism:** It permits the use of lethal force against those who have forfeited their right to life through aggression (combatants).

  For Anscombe, Oxford's decision to honor Truman was an endorsement of the idea that "the ends justify the means." Her protest was a defense of the proposition that some means are never justified, even by the end of peace or the saving of lives. The paradox exists only if one assumes the utilitarian framework is valid; within Anscombe's deontological framework, her position is entirely consistent.
