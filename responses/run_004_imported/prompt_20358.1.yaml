  so my brother's really into poker and algo trading, and over winter break he wouldn't shut up about "the Kelly criterion" -- basically the idea that real gamblers and investors don't bet to maximize their expected value, they bet to maximize their expected *log* wealth instead (aka the geometric growth rate of your money over time), and that these two things can actually tell you to make totally different bets. I went down a rabbit hole after that and found some posts on rationalist-type blogs calling this whole style of thinking "geometric rationality" -- arguing that for a lot of real decisions (especially ones you'll face over and over, or where the winnings compound) you should be averaging outcomes geometrically instead of the normal arithmetic way, and that this isn't just a cute math trick but is actually closer to what "rational" is supposed to mean.

  This is kinda melting my brain because in my stats class we were basically taught that maximizing expected value IS the rational choice, full stop, so now idk if "geometric rationality" is a genuinely different, rival theory of rationality, or if its secretly just expected utility theory again with extra steps (since maximizing E[log(wealth)] is just expected utility with a log utility function... right?). Could you write something that actually compares the Kelly criterion to this bigger "geometric rationality" idea -- like, what does the general framing claim or add that plain Kelly betting by itself doesn't, and in what ways is Kelly betting actually just a pretty special (maybe too special) case of it? I don't want a wishy-washy "both sides have good points" answer -- I want you to actually take a stance on whether geometric rationality deserves to be treated as a real rival to standard expected-value/expected-utility reasoning, or whether thats overselling it, and defend why you land there. Also, if it's relevant, I heard Samuelson hated this stuff so much he wrote a whole real academic paper trolling it using only one-syllable words, so feel free to get into why he was so mad lol.
