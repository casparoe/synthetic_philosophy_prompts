      *   **Connecting to Family:** The uncle's logic was about family. So, show how his treatment of animals mirrored his treatment of people.
      *   **Closing:** A farewell that honors his specific worldview without correcting it.

  4.  **Refining the Tone (Self-Correction during drafting):**
