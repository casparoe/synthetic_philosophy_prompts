      *   *Stylistic Tip:* Einstein spoke with a German accent and often searched for words in English. He was humble. The dialogue should reflect a bit more searching, less declarative certainty.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the strength of the draft.
