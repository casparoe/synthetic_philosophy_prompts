answer: |-
  The dust of Damascus coated the traveler's sandals as he hovered between the open gate and the shadowed alley leading home. Elena and Marcus stood beside him, watching the paralysis set in.

  "He can't move," Elena said, adjusting her satchel. "And he shouldn't. Not yet."

  "CDT says he should," Marcus replied, arms crossed. "Look at the dependency hypotheses. Either Death is in Aleppo or Damascus. His choice doesn't causally influence where Death went yesterday. The probabilities are fixed. If he assigns equal weight to both states, staying and fleeing have identical causal expected utility. He's permitted to pick either."

  "Permitted?" Elena shook her head. "But neither act is ratifiable. The moment he deliberates toward fleeing, he gains evidence that Death is in Aleppo. Conditional on fleeing, staying looks better. Conditional on staying, fleeing looks better. It's a deliberative loop. If rationality requires stability, he's rationally forbidden from choosing either pure act."

  Marcus kicked a stone. "That stability requirement is where you're smuggling in evidential reasoning. You're telling him to condition his credence about the past on the act he's *considering*. Causal Decision Theory explicitly bans that. You evaluate the act by its causal consequences, not by what the act implies about the state. Since his choice causes nothing regarding Death's location, the utility calculation is static. He's in a tie. He flips a mental coin and walks."

  "But he can't walk," Elena pressed. "Because he knows what you know. He knows that if he settles on 'Walk,' Death is waiting at the gate. To choose a pure act is to choose death, because the choice itself confirms the prediction. The only fixed point here is a mixed strategy. If he adopts a policy of 50/50 randomization, then conditional on that policy, the expected utility of staying equals the expected utility of fleeing. It's the only ratifiable option. He needs to pull a physical coin from his pocket *now*."

  Marcus stepped closer to the traveler, who was trembling. "Listen to me. If Death is a perfect predictor, she predicts the coin flip too. She knows the outcome before he does. If the coin lands Aleppo, Death is in Aleppo. Randomizing doesn't change the causal structure. It just adds a step to the prediction chain. You're solving for deliberative comfort, not survival."

  "I'm solving for rational coherence," Elena countered. "If he chooses Aleppo without randomizing, he is effectively asserting 'Death is in Damascus' while knowing his choice implies 'Death is in Aleppo.' That's epistemic instability. Gibbard and Harper showed that causal decision theory needs ratifiability to avoid this exact paradox. The mixed strategy breaks the link between his *deliberation* and the *outcome*. Until the coin lands, he hasn't tipped his hand to himself."

  "He tips his hand to Death," Marcus snapped. "Death doesn't care about his deliberation. She cares about the fact of his presence. If the theory outputs a tie, the theory has done its job. It says: 'You have no causal leverage.' Adding a requirement to randomize is telling him he can causally influence his survival probability by obscuring his decision process from himself. But he can't obscure it from Death. She sees the coin."

  Elena turned to the traveler. "If you pick Aleppo now, you die. If you pick Damascus now, you die. Why? because picking is predicting. But if you commit to the *chance* process, you aren't predicting Aleppo. You're predicting a probability distribution. Death predicts that distribution. She goes to Aleppo with 50% probability. You go to Aleppo with 50% probability. Your survival chance jumps to 50%."

  Marcus laughed, sharp and dry. "Does it? If she predicts the coin outcome, she's in Aleppo whenever the coin is Aleppo. Your survival rate is still zero. You're confusing the *ex ante* probability of the strategy with the *conditional* probability of the act. Ratifiability checks the conditional. Conditional on the coin saying 'Aleppo,' are you better off? Yes, because Death is there. So even the mixed strategy isn't ratifiable against a perfect predictor who sees the token outcome."

  "Then the problem is unsolvable," Elena said, "unless we accept that the randomization makes the final act unpredictable *even in principle* until the moment of execution. Quantum noise, thermal variation—something that breaks the causal chain before the outcome exists. If the outcome doesn't exist yet, Death can't predict it."

  "Then we're no longer talking about the original case," Marcus said. "The case stipulates perfect prediction. If you change the physics to save the theory, you've admitted the theory fails the case. Look, the moral is simpler. CDT tells us what we can control. We can't control Death. We can't control the prediction. We can only control our legs. If the utility is equal, walk. The anxiety comes from expecting your choice to signal safety. It won't. But staying put guarantees death if Death is here. Moving guarantees death if Death is there. Since you can't know, move. Don't fetishize the tie."

  "But he can't *will* himself to move while believing movement is fatal," Elena insisted. "Agency requires believing the act is optimal. If ratifiability fails, agency fails. The coin isn't about causality; it's about enabling the agent to act without self-sabotage. It allows him to say, 'I didn't choose Aleppo; the coin did.' That breaks the evidential link for *him*, even if Death sees through it."

  "And that's exactly why it's not CDT," Marcus concluded, gesturing at the road. "You're managing news, not causes. You want him to feel rational. I want him to act according to causal leverage. There is none. So he should stop thinking, pick a direction, and go. If Death is there, she's there. But telling him to flip a coin because his deliberation is unstable treats the symptom, not the disease. The disease is thinking his choice matters."

  Elena looked at the traveler, who had finally reached into his robe. He pulled out a copper coin.

  "He's listening to me," Elena said.

  "He's desperate," Marcus corrected. "There's a difference."

  The coin spun in the dusty air.
