      *   **Christensen (Independence Principle):** The draft says "not entitled to discount a peer's verdict using reasoning that just restates the reasoning generating the dispute." *Assessment:* This is accurate. The Independence Principle (IP) says your evaluation of the peer's reliability must be independent of the reasoning behind the disputed belief.
