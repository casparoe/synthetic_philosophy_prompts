      *   **SIA Theorist (Dr. Julian Thorne):** Bold, Bayesian purist, worried about selection effects. Focuses on existence as evidence. Likely sees SSA as solipsistic or arbitrarily restrictive.
      *   **The Cosmologists (Dr. Aris Thorne - no relation, maybe just "The Team"):** The audience. They need to ask the pivotal question. Let's make it a lead cosmologist, Dr. Silas Vane.

  3.  **Setting the Scene:**
      *   A conference room or observatory office.
      *   The specific cosmological dilemma needs to be defined clearly. Let's call them Theory $\Omega$ (Omega, small universe, few observers) and Theory $\Sigma$ (Sigma, vast multiverse, many observers).

  4.  **Drafting - Section by Section:**

