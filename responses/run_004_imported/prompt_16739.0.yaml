          *   Thorne counters that SSA leads to Doomsday. If you are early in the sequence of humans, SSA says the total sequence must be short. That's also absurd/pessimistic.
      *   **Deep Dive (Round 2 - Reference Class vs. Probabilistic Inflation):**
          *   Thorne attacks SSA on the Reference Class. Who is in the class? Humans? Conscious beings? Observers at this tech level? If you tweak the class, the Doomsday result changes. It looks arbitrary.
          *   Vance defends Reference Class as necessary context. Then attacks SIA on "creating probability." SIA favors big worlds *a priori*. It makes empirical science hard because any theory predicting more observers gets a huge boost.
      *   **The Cosmologist's Dilemma (Round 3 - Application to $\Omega$ vs. $\Sigma$):**
          *   Vane asks: "So what do we bet on?"
