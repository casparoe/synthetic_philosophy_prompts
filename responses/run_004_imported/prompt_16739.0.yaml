      *   **Audience/Context:** Counseling a team of cosmologists facing a specific dilemma (two theories fit data equally well but imply vastly different numbers of observers).
      *   **Core Conflict:** SSA vs. SIA in anthropic reasoning.
      *   **Key Arguments to Address:**
          *   SSA's weakness: The Doomsday Argument (implies humanity ends soon).
          *   SIA's weakness: The Presumptuous Philosopher (implies we likely live in a huge universe/multiverse regardless of evidence).
          *   SSA's specific issue: The Reference Class Problem (who counts as "me"?).
          *   SIA's specific issue: Probabilistic inflation (favoring larger worlds too strongly).
      *   **Tone:** Intellectual, rigorous, mutually respectful but pressing on uncomfortable commitments. Neither should "win" easily.
      *   **Background:** The user is a retired observational cosmologist turned philosopher, so the language should be precise, technically accurate, and acknowledge the scientific context.

  2.  **Character Conception:**
