  ### **A Note on Consistency (For You & Your TA)**
  The main friction point here is the **Sovereign Individual**. In a 200-level class, I might let the conflation slide, but in a seminar, the distinction between the *pre-moral* Sovereign Individual (the one who can promise) and the *moral/religious* Bad Conscience (the one who feels guilt) is usually a key learning objective.

  If your TA is grading more leniently on that specific textual chronology, you might see a drift in scores on this question. I'd recommend flagging that specific bullet point in your calibration notes so you both treat the SI/Bad Conscience relationship consistently across the stack.

