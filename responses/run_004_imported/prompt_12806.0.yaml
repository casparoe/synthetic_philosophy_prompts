              *   *Nietzsche Scholarship Check:* This is a common point of confusion. In *Genealogy* II:2, the Sovereign Individual is introduced *before* the full discussion of Bad Conscience (which dominates II:16-24). The Sovereign Individual is the one who *has* the right to make promises, possessing a "consciousness of power and freedom." While related to the breeding of a responsible animal, the Sovereign Individual is often read as a figure who *overcomes* or *transcends* the sickly aspects of bad conscience, or at least stands distinct from the "internalization of cruelty" that makes man interesting/sick.
