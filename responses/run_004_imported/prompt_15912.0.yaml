  2.  **Character Voices & Arguments:**
      *   **Behavioral Economist (BE):** Pragmatic, mathematical, deterministic. Focus on *discount rates*, *utility functions*, and *time inconsistency*. Sees the "morning self" and "evening self" as different agents with different discount rates.
      *   **Philosopher (PHIL):** Normative, agential, focused on *judgment*, *intention*, and *responsibility*. Focus on *all-things-considered judgments* and *resolutions*. Sees the agent as a unified whole capable of overriding impulses.

