answer: |-
  **The Scene:** *5:43 AM. The room is dark, save for the harsh blue glow of the smartphone resting on the nightstand. The alarm has just been silenced. The finger hovers over the screen. The air is cold, the duvet is warm. Two figures stand invisibly beside the bed, visible only to each other.*

  **The Behavioral Economist (BE):** *Tapping a calculator that isn't there.* Seven minutes. That's all you bought. Seven minutes of warmth for... what is it today? Two hundred dollars to the Super PAC you loathe.

  **The Philosopher (PHIL):** And yet, look at his face. He isn't smiling. He's grimacing. He just acted against his own explicit judgment. He judged, all-things-considered, that the gym was the better course. He knew the cost. He knew the consequence. And he hit snooze.

  **BE:** You're clinging to the word "judgment" like it's a homunculus sitting in the driver's seat. There is no driver. There are only passengers fighting for the wheel. Look at the curves. At 8:00 PM last night, the value of "Morning Health" was high. The discount rate was low. But as we approached 5:43 AM? The curve for "Immediate Warmth" spiked vertically. It crossed the other line. Simple hyperbolic discounting. The preference *actually reversed*. It's not a failure of will; it's a change in valuation.

  **PHIL:** That is the sleight of hand. You call it a "preference reversal," but that implies the Evening Self and the Morning Self are two different people. They aren't. It is one agent. If I judge that A is better than B, and I have the ability to do A, but I do B... that is *akrasia*. Weakness of will. By calling it a "preference," you sanitize it. You make it rational.

  **BE:** It *is* rational relative to the time of action! You're assuming preferences are stable over time. They aren't. Ainslie showed this. We are a succession of temporal selves. The Morning Self isn't "weak"; it just has a different discount rate than the Night Self. The Night Self made a promise the Morning Self has no incentive to keep. The money didn't work because the disutility of losing the money is temporally distant compared to the immediate utility of the pillow. The curve didn't just cross; it diverged.

  **PHIL:** But listen to him. *Listen.* He's whispering to himself, "Tonight is the exception." He knows he's lying. If your model is correct, he shouldn't feel guilt. If the curve for the pillow was simply higher, he got exactly what he preferred in that moment. Why the self-loathing?

  **BE:** Because the *Night* Self is angry at the *Morning* Self. It's an inter-temporal conflict. The guilt is just the Night Self realizing its contract enforcement mechanism was undercapitalized. He didn't pledge enough money. If he pledged his house, the curve wouldn't have crossed.

  **PHIL:** That reduces moral agency to a pricing error. And here is the fatal flaw in your view: It cannot distinguish between weakness of will and compulsion. If a heroin addict shoots up because the craving curve spikes higher than the health curve, and your sleeper hits snooze because the comfort curve spikes higher than the fitness curve... your model says these are identical phenomena. Just shifting valuations.

  **BE:** Functionally? They are. Both are failures of prediction regarding future utility.

  **PHIL:** No. We hold the sleeper responsible. We do not hold the addict responsible in the same way. Why? Because the sleeper has a *resolution*. Richard Holton was clear on this. A resolution isn't just a desire; it's a policy to avoid reconsidering the evidence in the face of temptation. He formed a plan: "I will not weigh the comfort of the bed against the gym." By hitting snooze, he didn't just weigh the options and choose the bed; he abandoned the policy of not weighing them. He let the temptation back into the room.

  **BE:** Okay, let's talk about this "resolution." This is where your view evaporates. You say he has a resolution. Fine. But at 5:43 AM, that resolution had zero causal power. The discount curve for the bed won. If your "resolution" is a real thing, a mental state that exists, why didn't it tip the scale? If it can be overruled by a stronger desire, it's just another desire with a lower weight. And if it's just another desire, I'm right: it's just curves crossing.

  **PHIL:** *Pauses.* That is the hard question. If resolution is just another input in the utility function, then Davidson was wrong to think we can act against our better judgment. But resolution isn't a desire. It's a *structure*. It's the attempt to lock the door so the desires don't get to vote.

  **BE:** But the door is open! He's in bed! You say resolution is a strategy to prevent reconsideration. But he *did* reconsider. He thought, "Tonight is the exception." So the strategy failed. If the strategy fails, what explains the action? The strongest desire. Which brings us back to my curves. You're positing a ghost in the machine called "Resolution" that is supposed to override the math, but when the math wins, you say the ghost was "weak." That explains nothing.

  **PHIL:** It explains the *regret*. Your model can't account for the normative force. He feels he *ought* to have gotten up, not just that he *wanted* to. But let me press you on your "preference." He is lying in the dark, hating himself. He is saying, "I don't want to be the kind of person who does this." If preference is revealed by action, then yes, he preferred the bed. But if preference is what he endorses upon reflection—what he identifies with—then he preferred the gym. Which one is the "real" preference?

  **BE:** The one that moved the muscle. Everything else is poetry. You want to say the "real" him is the Night Self, because that's the one making the long-term plans. But the body is in the Morning. The Nervous System is in the Morning. If the Morning Self values sleep more than it values the abstract concept of "integrity" or "health," then that is the preference. Why privilege the verbal report of the Night Self over the physical action of the Morning Self?

  **PHIL:** Because the Night Self is the one who set the goal! If we privilege the moment of temptation, no one ever keeps a diet, saves money, or studies. We become slaves to the steepest discount curve. The whole point of agency is to allow the long-term judgment to constrain the short-term impulse.

  **BE:** And that's what the app was for! The app was an externalized resolution. It was supposed to make the cost immediate.

  **PHIL:** It failed.

  **BE:** Because the cost wasn't high enough! It's still just math.

  **PHIL:** Or... because he undermined his own resolution. He told himself, "This is an exception." Holton calls this "making an exception." It's a specific cognitive maneuver where you grant yourself permission to violate the policy without abandoning the policy entirely. He's keeping the resolution for *tomorrow* to excuse breaking it *today*.

  **BE:** Which is just the discount curve for "Future Guilt" being lower than the discount curve for "Current Comfort." You keep using words like "maneuver" and "policy," but unless those words map onto a neural mechanism that can inhibit the motor cortex, they are just stories. If the "resolution" mechanism exists, it was inhibited. By what? By a stronger signal. A stronger preference.

  **PHIL:** *Leans in.* But if I am addicted, I cannot stop even if I want to. If I am weak, I *could* have stopped. That is the distinction. The "could" is the causal power of the resolution. It was *available* to him. He could have thrown the covers off. The fact that he didn't doesn't mean he couldn't. It means he didn't *exercise* the capacity.

  **BE:** "Could have" is a counterfactual. "Did not" is data. You're saying he has a brake pedal, but he didn't press it. I'm saying the hydraulic line was cut by the discount rate. What's the difference in the outcome?

  **PHIL:** The difference is in the second chance. If he's compelled, he'll do it again tomorrow. If he's weak... he might summon the resolution. He might realize that "exception" logic is a trap.

  **BE:** He'll only summon the resolution if the discount curve shifts. Maybe he'll increase the bet. Maybe he'll get a gym buddy. That's just changing the variables in the equation.

  **PHIL:** Or he might realize that he is a unified agent, not a battlefield of selves. That he needs to stop negotiating with the pillow.

  **BE:** *Looks at the phone.* The seven minutes are almost up. The alarm will ring again.

  **PHIL:** This is the moment. The resolution must be re-asserted. Not as a desire, but as a command.

  **BE:** Or the curve will cross again. The warmth is still warm. The money is already gone. The marginal cost of a third snooze is zero.

  **PHIL:** *Turns to the sleeper.* If you listen to him, you are not responsible. You are just a vessel for competing discount rates. If you listen to me, you are responsible, which is a burden, but it is the only way to be free.

  **BE:** If you listen to him, you might feel noble while you stay in bed, telling yourself you'll try harder next time. If you listen to me, you know the only thing that matters is whether the incentive is high enough *right now*.

  **PHIL:** He doesn't need more incentive. He needs to stop calculating.

  **BE:** He can't stop calculating. That's what brains do. Optimize.

  **PHIL:** No. Brains can also commit.

  *The phone buzzes. A low hum. The screen lights up again. 5:50 AM.*

  **BE:** The curve is spiking. Look at the valuation of those seven minutes.

  **PHIL:** The resolution is waiting. It doesn't weigh anything. It just waits to be picked up.

  *The hand reaches out from the duvet. It hovers over the glass.*

  **BE:** Snooze.

  **PHIL:** Stand.

  *The finger descends.*
