prompt: |-
  Ok so I'm elbow-deep in a novel with a long section from the POV of a girl who spent her first eleven years with basically zero language contact before she's found (loosly inspired by real feral-child cases). I wrote her pre-rescue thoughts as genuinely complex -- she compares things, she expects certain outcomes and is thrown when they don't happen, she even seems to reason her way to conclusions -- just with no words attached to any of it. My critique partner Dana thinks that's a cop-out: her take is that real structured thought, the kind with actual logical shape -- comparisons, if-thens, generalizing from cases -- just can't happen without language, so pre-rescue the girl's "thoughts" should read more like raw mood and reflex than anything resembling judgment. My other reader Marcus says Dana's just wrong -- he brought up some philosophy of mind idea, the "language of thought hypothesis" or something like that, where we supposedly think in an inner code that isn't tied to any spoken language, and that Dana's view would mean babies and animals can't really think either, which seems nuts. Dana's comeback was that babies and animals obviously have some minimal thoughts, but nothing with real inferential structure, and that anything with that kind of structure basically has to be language-shaped even if it's not English or whatever. Marcus said that's a total dodge -- if "language-shaped" just means "has structure," she's basically conceded the whole point and my character's fine as written. Neither will let it go and now I don't know whether to rewrite the section. Can you go through this move by move, say who's got the better of it at each step, and tell me if there's an actual answer here or if they're both missing something?
