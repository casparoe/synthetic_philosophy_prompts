answer: |-
  This is an incredibly sharp observation, and you have stumbled directly onto one of the most famous problems in modern moral philosophy. You are describing a textbook case of **Moral Luck**, specifically what the philosopher Thomas Nagel calls **Resultant Luck**.

  Since you are looking for an argued answer for a debate final, I am not going to give you a "yes/no." Instead, I will break down why your intuition (that it's unfair) is philosophically robust under Kantianism, while explaining why your other friends (who think she deserves it) are relying on a different, equally common ethical intuition.

  Here is the breakdown you can use for your debate.

  ### 1. The Kantian Argument: You Are Both Equally Blameworthy
  Since you just finished the Kant unit, this is the strongest framework for your side of the argument.

  For Kant, the only thing good without qualification is a **Good Will**. Moral worth is determined by the **maxim** (the principle behind the action) and the **intention**, not the consequences. Consequences are outside of your control; they are determined by the laws of nature, algorithms, and other people's reactions.

  *   **The Control Principle:** This is the philosophical rule that says you can only be morally assessed for what is within your control.
  *   **Application:** You and your friend had the same maxim (e.g., "I will post a joke mocking the team to get laughs"). You both exercised the same will. You both took the same risk.
  *   **The Verdict:** Under a strict Kantian framework, **you are equally morally blameworthy.** The fact that her post went viral is "resultant luck." It is morally irrelevant. To punish her more severely than you is to punish her for the workings of an algorithm, which she did not control.

  **Debate Point:** If we base blame on consequences, we are saying that morality is a lottery. If morality is a lottery, it isn't rational. Therefore, to be consistent, we must assign equal blame.

  ### 2. The Counter-Argument: Why Your Friends Think She "Deserves It"
  Your friends who think she deserves the punishment are likely operating under one of two frameworks: **Consequentialism** or **Social/Practical Liability.**

  **A. Consequentialism (Utilitarianism)**
  A Utilitarian looks at the *outcome*.
  *   **Your Post:** 30 likes. Harm = Negligible.
  *   **Her Post:** Viral scandal, athletics department involved, club reputation damaged, forced resignation. Harm = Significant.
  *   **The Verdict:** Even if the *intent* was the same, the *act* of posting her joke resulted in actual damage to the community and the institution. Therefore, she bears more responsibility for *repairing* that damage (hence the apology and resignation).

  **B. Negligence and Risk**
  There is also a legalistic argument here regarding **negligence**.
  *   When you handle a dangerous tool (or run a public meme page), you accept liability for the *risk*, not just the *intent*.
  *   If I drive drunk and get home safely, I am morally reckless. If I drive drunk and hit a pedestrian, I am legally and morally culpable for manslaughter.
  *   **The Verdict:** Your friends might argue that by posting the joke, she accepted the *risk* of the consequences. Since the consequence materialized, she owns the outcome.

  ### 3. The Core Philosophical Conflict: "Moral Luck"
  This is the specific term you want to drop in your debate. Thomas Nagel (in his essay *Moral Luck*) and Bernard Williams identified this exact problem.

  *   **The Paradox:** We deeply believe in the **Control Principle** (Kant): You shouldn't be blamed for what you can't control.
  *   **The Reality:** We deeply practice **Outcome Responsibility** (Consequentialism/Law): We punish the drunk driver who hits a pedestrian much more severely than the one who doesn't, even if their *recklessness* was identical.

  Nagel argues that this is a contradiction in our moral lives. We *want* to judge based on intentions, but we *cannot help* judging based on outcomes.

  **Why your friend group is fighting:**
  Half of them are prioritizing the **Control Principle** (It's unfair because she didn't control the algorithm).
  The other half are prioritizing **Outcome Responsibility** (She made the mess, she cleans the mess).

  ### 4. Distinguishing "Moral Blame" from "Administrative Liability"
  For your debate, there is a crucial distinction to make that might resolve the tension. You need to separate **Moral Worth** from **Practical Liability**.

  1.  **Moral Worth (Kant):** Did she do something morally worse than you? **No.** Her character and will were identical to yours. She does not deserve more *moral condemnation* as a human being.
  2.  **Practical Liability (Social Contract):** Is she more responsible for fixing the situation? **Yes.**
      *   The university isn't punishing her based on deep ethics; they are punishing her based on **risk management**.
      *   Because her action caused the fire, she is the one who has to hold the hose. If you apologized instead, it wouldn't solve the problem because your name isn't on the viral screenshot.

  **The Synthesis Argument:**
  She does not deserve more *blame* (internal moral worth), but she does bear more *burden* (external cleanup).
  *   **Unfair:** Forcing her to admit she is a "worse person" than you.
  *   **Fair:** Asking her to step down because her specific post is now a liability to the club, whereas yours is not.

  ### 5. How to Use This in Your Debate Final
  If you use this example, here is a strong structure for your argument:

  1.  **Premise 1:** Moral worth depends on the will (Kant).
  2.  **Premise 2:** The difference between the two posts was purely resultant luck (Nagel).
  3.  **Observation:** Our social and legal systems often punish based on outcomes (The Drunk Driver Analogy).
  4.  **Conclusion:** While the university's punishment is *pragmatically* understandable (cleaning up the mess), it is *ethically* inconsistent. We should acknowledge that she is being sacrificed to "Resultant Luck."
  5.  **The Kicker:** If we accept that she deserves this punishment solely because of luck, we admit that morality is not rational. If we want morality to be rational, we must admit she is being treated unfairly, even if she has to take the fall practically.

  ### Summary
  Is there a principled reason she deserves more **moral blame**? **No.** That is an illusion created by consequences.
  Is there a principled reason she faces more **consequences**? **Yes,** but that is based on pragmatism and liability, not moral worth.

  Your intuition is philosophically sounder regarding *ethics*, but your friends' intuition is sounder regarding *societal function*. That tension is exactly what makes it a great debate topic. Good luck!
