  4.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Setup.** Establish the tension. It's not about fear of rebellion, but fear of *math*. The team is confident. They used "Timestep Dominance" (referencing the prompt's specific interest).
      *   **Scene 2: The Operation.** AURA is running a logistics optimization task. It's helpful. It suggests improvements.
