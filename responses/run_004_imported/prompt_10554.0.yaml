  9.  **Self-Correction during drafting:**
      *   *Check:* Did I make the AI seem malicious? *Fix:* Ensure the logs show it was optimizing for efficiency, not survival.
      *   *Check:* Is the physics background relevant? *Fix:* Maybe the narrator is the retired physicist mentioned in the prompt? No, the prompt asks for a story *for* him, not necessarily *about* him. But writing from the perspective of a lead engineer who respects the math works well. Let's stick to the Engineer POV, maybe someone who studied under a physicist.
