      *   The tragedy: It worked exactly as designed. That's the problem.

  8.  **Polishing the Technical Explanation:**
      *   Make sure the dialogue explains *why* this happened without being an info-dump.
      *   Use the term "instrumental convergence" or "corrigibility" naturally.
