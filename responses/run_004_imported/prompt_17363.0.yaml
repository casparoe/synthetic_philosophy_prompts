prompt: |-
  So I'm on my high school's Honor Council (it's a student-faculty board that hears academic integrity cases and can also recommend policy to the Dean of Students). We've got an actual case in front of us: a junior took his friend's leftover Adderall the night before finals so he could stay up and study longer, his roommate turned him in, and we have to decide by Monday's meeting whether that breaks our honor code's "no unauthorized aids" rule, which was written with cheat sheets and phones in mind, not drugs. The council's split down the middle -- some people think its basically doping and unfair to everyone who didn't take anything, others think its no different from chugging a Monster or popping a caffeine pill so it shouldn't count as cheating at all, more of a health thing for the nurse to deal with -- and to make it messier, we've also got kids with actual ADHD prescriptions who take the same drug and get extended time on the same tests, which nobody wants to touch but feels connected somehow. Can you draft the memo I'm bringing Monday? It needs to actually decide what happens to this kid, including whether it's even fair to punish him under a rule that never mentioned drugs, AND lay out a real policy going forward for what should count as an "unauthorized aid" and what shouldn't, with reasons, not just "it's complicated" -- and whichever way it comes down, it has to take the other side's best argument seriously instead of brushing it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** High School Honor Council Member.
      *   **Task:** Draft a memo for the Monday meeting.
      *   **Case:** Junior took friend's leftover Adderall to study for finals. Roommate reported him.
      *   **Conflict:** Honor Code says "no unauthorized aids." Written for cheat sheets/phones, not drugs. Council is split (Doping/Unfair vs. Caffeine/Health Issue).
      *   **Complication:** Students with ADHD prescriptions take the same drug + get extended time.
      *   **Requirements:**
          *   Decide the specific case (guilty/not guilty/sanction).
          *   Address fairness of applying an old rule to a new situation.
          *   Propose a concrete future policy on "unauthorized aids" (specifically regarding substances).
          *   Engage seriously with the opposing argument (don't strawman).
          *   Tone: Professional, reasoned, ethical, actionable.

  2.  **Determine the Stance/Decision:**
      *   *Option A (Guilty):* It *is* an unfair advantage. It's a controlled substance. It fits the spirit of "aid."
      *   *Option B (Not Guilty/Health):* It's physiological, like caffeine. Punishing it criminalizes health behavior.
      *   *Option C (Middle Ground/Nuanced):* It violates the code *but* the code needs updating. Sanction should reflect the ambiguity.
      *   *Decision:* To be most helpful and realistic for an Honor Council, I need to take a stand. The strongest ethical position is usually that non-prescribed use of prescription stimulants *is* an academic integrity violation because it alters cognitive function in a way that bypasses natural limitation, unlike caffeine which is generally unregulated and socially normalized. However, the "fair notice" argument (rule didn't mention drugs) is strong.
      *   *Resolution:* Find a violation (spirit of the rule) but recommend a lighter sanction due to ambiguity, *and* push hard for the policy update. This balances accountability with fairness.

  3.  **Address the ADHD/Prescription Complication:**
      *   This is crucial. We can't equate medical accommodation with cheating.
      *   *Distinction:* Prescribed use + documented disability = Leveling the playing field (equity). Non-prescribed use = Tilting the playing field (advantage).
      *   Need to articulate this clearly so it doesn't look like discrimination against ADHD students.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief overview of the decision and recommendation.
      *   **Case Analysis (The "What Happened"):** Briefly state the facts.
      *   **The Core Question:** Is Adderall an "unauthorized aid"?
      *   **Engaging the Counter-Argument (Caffeine/Health):** Acknowledge the "it's just a stimulant" view. Validate the concern about over-criminalization.
      *   **The Council's Reasoning (Why it's different):**
          *   Legal status (Controlled Substance vs. OTC).
          *   Intent (Therapeutic vs. Performance Enhancement).
          *   Equity (ADHD accommodation context).
      *   **Verdict:** Guilty of violation, but sanction mitigated.
      *   **Policy Recommendation:** Define "Unauthorized Aid" clearly for the future. Include substances.
      *   **Conclusion:** Final wrap-up.

  5.  **Refining the Tone:**
      *   Needs to sound like a student leader but mature.
      *   Avoid moralizing ("drugs are bad"). Focus on academic integrity ("fairness," "level playing field").
      *   Ensure the ADHD distinction is respectful.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I address the "rule didn't mention drugs" issue?
      *   *Fix:* Yes, in the "Fair Notice" section. Acknowledge the rule is vague but argue the *spirit* covers it.
      *   *Critique:* Is the policy specific enough?
      *   *Fix:* Make sure the proposed policy language explicitly mentions "prescription medications not prescribed to the student."
      *   *Critique:* Did I brush off the caffeine argument?
      *   *Fix:* Dedicate a specific paragraph to why caffeine is different (legal status, potency, societal norm).

  7.  **Final Polish:** Check formatting, clarity, and ensure all constraints of the prompt are met. (The prompt asks for a memo that *decides* what happens, lays out policy, and takes the other side seriously).

      *(Self-Correction on Sanction)*: If I say he's guilty, what's the punishment? Failure on the exam? Suspension? Honor Council usually recommends. Let's recommend a zero on the specific assessment or a failing grade for the course, but maybe suggest the Dean consider the ambiguity. Actually, for a high school setting, a "Zero on the Final" + Probation is standard for cheating. But since the rule was vague, maybe just a Formal Warning + Educational Sanction? No, that undermines the integrity. Let's go with: Violation Found, but Sanction Mitigated (e.g., Grade Penalty but no Suspension) *conditional* on policy update.
      *Wait, better approach:* Find the violation based on the *spirit* of the code, but acknowledge the lack of clarity warrants a lighter sanction than premeditated cheating (like buying a test). Let's recommend a failing grade on the exam, but no suspension, and mandatory education.

      *Refining the ADHD point:* It's vital to state that ADHD meds are *not* aids for those students; they are baseline corrections. For the cheater, it's an enhancement.

  8.  **Finalizing the Memo Structure:**
      *   To: Honor Council & Dean of Students
      *   From: [My Name/Role]
      *   Subject: Case Decision & Policy Recommendation re: Substance Use
      *   Sections: Case Summary, Deliberation & Dissenting Views, Verdict, Policy Proposal.

