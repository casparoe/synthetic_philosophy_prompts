prompt: |-
  ok so i'm on the 5-person bylaws committee for my school's student council and we owe the full council (like 20 people) a recommendation before their vote next wednesday. some seniors want a rule saying any change the council makes to election procedures (nomination rules, spending caps, debate format) cant take effect until the election after next, not the one happening under whoever actually voted for it -- so people cant rig the rules to help themselves get reelected. but a couple committee members want an emergency clause bolted on: if 3/4 of the full council agrees something's a genuine emergency (like a candidate getting caught cheating right before a vote) they can suspend that and change things immediately. theres also a seperate fight over whether the lock-in rule should itself be hard to repeal -- like a 2/3 vote plus a two-meeting waiting period -- or if any future council can just scrap it with a normal majority whenever they feel like it. i have to draft the actual memo we're reading to the council recommending which combo to go with (or dropping the whole idea) and why, and it has to seriously engage the argument that zero flexibility is just asking for disaster the first real emergency, not just act like locking it in is obviously the responsible choice and wanting exceptions is obviously shady. can you write that memo for me, 2 pages max?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a 5-person Bylaws Committee.
      *   **Audience:** Full Student Council (approx. 20 people).
      *   **Deadline:** Vote next Wednesday (memo needs to be ready for presentation/discussion).
      *   **Topic:** Proposed bylaw change regarding election procedure modifications.
      *   **Core Proposal:** Changes to election procedures (nominations, spending, debates) cannot take effect until the election *after* next (delayed implementation) to prevent self-serving rule changes.
      *   **Conflict 1 (Emergency Clause):** Some want a 3/4 supermajority exception for genuine emergencies (e.g., cheating scandal). Others worry this undermines the rule.
      *   **Conflict 2 (Repeal Difficulty):** Should the lock-in rule itself be hard to repeal (2/3 vote + waiting period) or easy (simple majority)?
      *   **Tone/Requirement:** Must seriously engage the argument that zero flexibility invites disaster. Cannot act like locking it in is obviously good and exceptions are obviously shady. Needs to be balanced, persuasive, and practical.
      *   **Format:** Memo.
      *   **Length:** 2 pages max.

  2.  **Determine the Committee's Recommendation:**
      *   To write a coherent memo, I need to take a stance. A "do nothing" stance is weak. A "lock everything down forever" stance ignores the emergency concern. A "lock it in but allow emergency override" stance is the most balanced and likely to pass.
      *   *Decision:* Recommend the Delayed Implementation Rule + Emergency Clause (3/4 vote) + Standard Repeal Process (Simple Majority).
      *   *Reasoning:*
          *   Delayed Implementation: Prevents incumbent advantage.
          *   Emergency Clause: Prevents disaster (addresses the "zero flexibility" critique).
          *   Standard Repeal: Prevents the bylaws from becoming a "dead hand" control that future councils can't adapt to new realities. Making the rule *too* hard to repeal is undemocratic.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. We are recommending a specific package.
      *   **The Core Problem:** Explain *why* we are doing this (incumbent advantage, rule-rigging).
      *   **The Recommendation (The "What"):**
          1.  Delayed Effect (Election +1).
          2.  Emergency Override (3/4 vote).
          3.  Repeal Standard (Simple Majority).
      *   **Rationale (The "Why"):** This is the meat of the request. I need to balance the "anti-rigging" argument with the "flexibility" argument.
          *   *Address the Emergency Concern:* Acknowledge that rigid rules break under pressure. The 3/4 threshold is high enough to prevent abuse but low enough to allow action.
          *   *Address the Repeal Concern:* Argue against making the rule itself entrenched. Future councils should be able to fix mistakes without impossible hurdles.
      *   **Conclusion:** Call to action for the vote next Wednesday.

  4.  **Refining the Tone:**
      *   Needs to sound like student leaders talking to student leaders. Professional but not legalese.
      *   Avoid dismissing the "emergency" side as shady. Validate their concern: "We agree that paralysis is dangerous."
      *   Avoid dismissing the "lock-in" side as power-hungry. Validate their concern: "We agree that self-dealing undermines trust."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Council. We looked at the election rules.
      *   Seniors want to stop people changing rules to win.
      *   We say yes, wait one election.
      *   But what if there's an emergency? We say 3/4 can override.
      *   What if we want to delete this rule later? Just majority vote.
      *   Don't make it too hard to change later.
      *   Vote yes.

      *Critique 1:* Too simple. Doesn't meet the "seriously engage the argument" requirement. Needs more nuance on *why* the emergency clause isn't a loophole and *why* the repeal shouldn't be locked.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      *   *Emergency Clause:* Explicitly state that a 3/4 vote is hard to get. It's not a loophole. It's a safety valve. Acknowledge the cheating scenario.
      *   *Repeal:* Explain that binding future councils too tightly is undemocratic. If this rule turns out bad, they need to fix it.
      *   *Structure:* Use headings for readability.

  7.  **Final Polish (Checking Constraints):**
      *   2 pages max? (Keep it tight, around 800-1000 words).
      *   Memo format? (Yes).
      *   Address all three conflicts? (Delayed effect, Emergency clause, Repeal difficulty).
      *   Tone check? (Balanced, persuasive).

  8.  **Writing the Content (incorporating into final output):**
      *   *Subject:* Recommendation on Election Procedure Amendments.
      *   *Intro:* Context of the committee work.
      *   *Proposal:* The "One-Cycle Delay" with "Emergency Override."
      *   *Argumentation:*
          *   Integrity vs. Agility.
          *   Why the Emergency Clause is safe (3/4 is high).
          *   Why the Repeal should be normal (don't shackle the future).
      *   *Closing:* Timeline.

      *(Self-Correction during drafting)*: Make sure I explicitly mention the "2/3 + waiting period" idea and explain why we are *rejecting* it, as requested ("separate fight over whether the lock-in rule should itself be hard to repeal"). I need to argue *against* entrenching the bylaw itself.

  9.  **Final Review against Prompt:**
      *   5-person committee context? Yes.
      *   20 people council? Yes.
      *   Vote next Wednesday? Yes.
      *   Seniors' rule (delayed effect)? Yes.
      *   Emergency clause (3/4)? Yes.
      *   Repeal difficulty (2/3 vs majority)? Yes.
      *   Engage the "zero flexibility is disaster" argument? Yes.
      *   2 pages max? Yes.

      *Let's write it.* (Proceeds to generate output based on these thoughts).

      *Word Count Check:* A standard single-spaced page is about 500 words. 2 pages = ~1000 words. I will aim for concise paragraphs to ensure it fits comfortably.

      *Tone Check:* Ensure it doesn't sound like I'm dictating, but recommending on behalf of the committee. "The Committee recommends..."

      *Key Argument:* The "Safety Valve" analogy for the emergency clause. The "Dead Hand" analogy for the repeal restriction.

      *Ready.*
answer: |-
  **MEMORANDUM**

  **TO:** Full Student Council
  **FROM:** Bylaws Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Election Procedure Amendments & Implementation Timeline

  **Purpose**
  The Bylaws Committee has reviewed the proposed amendment regarding changes to election procedures (including nomination rules, spending caps, and debate formats). Our goal is to balance two critical values: **election integrity** (preventing incumbents from rigging rules for re-election) and **operational flexibility** (ensuring the Council can react to genuine crises).

  After reviewing testimony from senior members and committee debate, the Committee recommends adopting the **"One-Cycle Delay" rule with a "Supermajority Emergency Override,"** while keeping the **repeal process at a simple majority.**

  **The Recommendation**
  We propose the following three-part structure for the new bylaw:

  1.  **Delayed Implementation:** Any amendment affecting election procedures passed by the Council shall not take effect until the *second* subsequent election cycle (i.e., it cannot apply to the election occurring immediately after the vote).
  2.  **Emergency Override:** This delay may be suspended if **three-fourths (3/4)** of the full Council votes to designate the change as an emergency response to an unforeseen circumstance (e.g., proven candidate misconduct, security breaches, or administrative failure).
  3.  **Standard Repeal:** This bylaw itself may be amended or repealed by a **simple majority** vote at any regular meeting, without additional waiting periods.

  **Rationale: Integrity vs. Agility**
  The primary argument for the Delayed Implementation rule is sound: incumbents should not write the rules of the race they are currently running. History in student governance shows that last-minute tweaks to spending caps or debate times often favor those already in power. A one-cycle delay ensures that rule changes are made for the long-term health of the Council, not short-term electoral gain.

  However, the Committee takes seriously the concern that **zero flexibility invites disaster.** A rigid bylaw that prevents the Council from acting on a cheating scandal or a safety issue three days before voting is not responsible governance; it is bureaucratic paralysis.

  We rejected the argument that an Emergency Clause creates a loophole. A 3/4 vote threshold is intentionally high. It requires near-consensus, meaning a simple majority faction cannot weaponize the "emergency" label to push through self-serving changes. This safety valve allows the Council to act when the status quo is untenable, without lowering the barrier enough to allow routine manipulation.

  **Rationale: Entrenchment vs. Future Authority**
  There was significant debate regarding whether this new rule should be "locked in" tightly—specifically, whether repealing it should require a 2/3 vote plus a two-meeting waiting period. The Committee recommends **against** this entrenchment.

  While we want to protect election integrity, we must avoid the "dead hand" problem. Binding future Councils to our current judgment prevents them from adapting to new realities. If this delay rule proves to be cumbersome or harmful in two years, a future Council should be able to fix it without clearing impossible hurdles. Making the bylaw itself difficult to repeal assumes our current understanding of governance is perfect, which is rarely the case. A simple majority repeal ensures that if the rule isn't working, democracy can correct it.

  **Conclusion**
  This package protects the fairness of elections without handcuffing the Council during a crisis. It acknowledges that while self-dealing is a real risk, so is inflexibility.

  We request the Full Council review this draft language prior to next Wednesday's vote. The Committee is available to answer questions regarding the specific wording of the emergency threshold or implementation timeline.

  **Recommended Action:** Vote to adopt the One-Cycle Delay with 3/4 Emergency Override and Simple Majority Repeal.
