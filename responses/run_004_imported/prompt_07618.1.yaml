      *   **Context:** A small, informal prediction market (~30 friends) running on Discord/Manifold-style.
      *   **Problem:** A "civil war" over resolving a market question due to an unanticipated real-world event.
      *   **Conflict:** Textualism (strict adherence to the written words) vs. Purposivism (adherence to the intended spirit/meaning).
      *   **Constraint:** No formal judicial infrastructure (no courts, appeals, legislative history), just Discord and vibes.
      *   **Goal:** Understand the implications of the textualism/purposivism debate *specifically for this tiny informal context*, not general legal theory.
      *   **Tone:** Acknowledge the specificity, keep it practical, insightful, and slightly informal but analytical.

  2.  **Deconstruct the Core Conflict (Textualism vs. Purposivism) in this Context:**
      *   *Legal Context:* Courts have precedents, judges, enforcement power, and centuries of doctrine.
      *   *Friend Group Context:* Trust is the currency. Enforcement is social. Precedent is whatever happened last time. The "Judge" is probably the market creator or a vote.
      *   *Key Difference:* In law, certainty is often valued over fairness (rule of law). In friends, fairness/consensus is often valued over strict certainty (maintaining relationships).

  3.  **Brainstorm Implications for the Friend Group:**
      *   **Trust & Reputation:** If you rule against the "vibe," people feel cheated. If you rule against the text, people feel the rules are meaningless.
      *   **Future Markets:** How does this decision affect future trading? Will people stop trading if they think the admin will override them? Or will they stop trading if they think loopholes will be exploited?
      *   **Drafting:** How should questions be written next time? (More detail? Discretion clauses?)
      *   **Resolution Mechanism:** Who decides? A vote? A dictator? A jury?
      *   **The "Unanticipated Event" Problem:** This is the heart of the issue. Contracts have *force majeure* or *impossibility*. Prediction markets need "N/A" or "Reopen" options.

  4.  **Structure the Advice:**
      *   **Introduction:** Validate the situation (it's not weird, it's classic contract theory applied to micro-scale).
      *   **Core Trade-off:** Certainty vs. Fairness (adapted for friends).
      *   **Implication 1: The Currency is Trust, Not Law.** (Why strict textualism might be dangerous here).
      *   **Implication 2: The "Dead Letter" Risk.** (Why pure purposivism kills the game).
      *   **Implication 3: Drafting for the Edge Cases.** (Practical tips for writing questions).
      *   **Implication 4: Governance/Resolution Mechanism.** (How to decide *who* decides).
