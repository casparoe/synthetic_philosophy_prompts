      *   **Conclusion:** A summary recommendation.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the "Manifold" style. It's fun but fragile.
      *   *Trust:* In SCOTUS, if they rule unpopularly, people grumble but obey. In Discord, if you rule unpopularly, people leave or stop betting. *Key insight:* Textualism protects the *admin* from accusations of bias, but Purposivism protects the *group* from feeling scammed by semantics.
      *   *Precedent:* In law, precedent binds future cases. Here, precedent sets expectations. If you allow a "spirit of the law" override once, everyone will argue "spirit" next time. If you stick to text, people will write "gotcha" questions.
      *   *Drafting:* Legal contracts use definitions sections. Prediction markets need "Resolution Criteria" sections. Mention "Explicit Exclusions."
      *   *The "Judge":* In law, judges are insulated. Here, the market creator is interested. Maybe suggest a "Supreme Court" of 3 random friends? Or a vote?
      *   *The "N/A" Option:* This is crucial. Manifold allows "N/A". If the event is truly unanticipated, the market should void. This is the *force majeure* of prediction markets.

