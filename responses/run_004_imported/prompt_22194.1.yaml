          *   *Let's try a different angle:* Many epistemologists (like Foley) argue they *are* the same. Others (like Kaplan) argue they differ.
          *   *My Stance:* I will argue they require a **Unified Solution** that sacrifices the **Agglomeration of Justified Belief**. This is the "non-agglomeration" view. It respects the intuition that we *do* believe the lottery tickets lose and we *do* believe our dissertation claims, but logic doesn't force us to believe the conjunction. This preserves the richness of our doxastic lives without falling into contradiction.
