          *   *Better Stance for a "Strong Essay":* Argue that they *should* be treated alike (Unified), but the cost of sacrificing Closure/Agglomeration is actually *less* than the cost of fragmenting epistemology or embracing skepticism (Lockean sacrifice). I will defend the sacrifice of **Agglomeration**.

      *   **Outline:**
          1.  **Intro:** The dissertation anecdote. The structural identity. The thesis: Unified diagnosis, sacrifice Agglomeration.
          2.  **The Case for Unity:** Logical isomorphism. The "Consistency Constraint." If we treat them differently, we need a principled distinction.
          3.  **The Case for Distinction:** Statistical vs. Non-statistical evidence. The "Undercutting" argument (Lottery beliefs defeat each other; Preface claims don't).
