answer: |-
  You have the better of the argument, though your friend is not entirely wrong about the logic of *blame*. Where he fails is in conflating **blame** with **responsibility**, and **guilt** with **agent-regret**.

  Your intuition that your friend is "causally embedded" in a way that matters is philosophically robust. It is not mere sentimentality; it is tracking a specific moral phenomenon that your friend's rigid rationalism overlooks.

  Here is the breakdown of why your objection holds water, the philosophical concept you were reaching for, and where the danger lies for your surgeon friend.

  ### 1. The Missing Concept: Agent-Regret
  The philosopher Bernard Williams, in his seminal essay *Moral Luck*, coined the term **agent-regret** to describe exactly what your surgeon friend is feeling.

  *   **Bystander-Regret:** This is what your friend (the Rationalist) thinks she should feel. It is the regret one feels when a tragedy occurs that one had no hand in. ("It is a tragedy this patient died.")
  *   **Agent-Regret:** This is the regret felt specifically by the person whose *action* brought about the outcome, even if the action was blameless. ("I killed this patient," even if "killed" here means "was the instrument of death" rather than "negligently caused death.")

  Williams argues that agent-regret is a rational, appropriate, and distinct emotional response. It acknowledges that while we cannot control outcomes (luck), we are still the *authors* of the actions that led to them. To deny this feeling is to deny one's own agency. If your friend were to adopt your Rationalist friend's view completely, she would be treating her own hands as if they were detached tools rather than extensions of her will.

  ### 2. The Flaw in the Rationalist's "Consistency" Argument
  Your Rationalist friend argues: *Surgeons who take pride in lucky wins cannot disown unlucky losses.*

  This sounds fair, but it contains a category error.
  *   **Professional Pride:** A surgeon should take pride in their *skill, preparation, and decision-making*, not in the outcome if the outcome was determined by luck. If a surgeon does a sloppy job and the patient lives due to a miracle, a good surgeon does not take pride in that.
  *   **Professional Responsibility:** Conversely, if a surgeon does a perfect job and the patient dies due to a miracle, the surgeon must still own the *fact* that their action was the vehicle of the outcome.

  The Rationalist wants to outsource the outcome entirely to "Fate." But medicine is a profession where one voluntarily accepts the burden of being the causal link between treatment and outcome. Your objection is correct: being the agent matters. The feeling isn't tracking *fault*; it is tracking **integrity**. It is the psychic cost of wielding the power of life and death.

  ### 3. Guilt vs. Moral Injury
  You asked what the feeling is tracking if not fault. It is likely tracking **Moral Injury**.

  While "guilt" implies "I did something wrong," **moral injury** describes the distress resulting from actions (or inactions) that violate one's moral code, even if those actions were necessary or technically correct.
  *   **Guilt:** "I made a mistake." (In this case, false.)
  *   **Moral Injury/Agent-Regret:** "I am the person who cut this body, and this body died." (In this case, true.)

  Your Rationalist friend is trying to talk her out of guilt (which she doesn't have) while dismissing the moral injury (which she does have). Telling someone with a moral injury that they are "irrational" for feeling pain is like telling someone with a physical injury they are "irrational" for feeling pain because no one hit them. The damage is real, even if no one is to blame.

  ### 4. The Danger Zone
  While you have the better philosophical argument, your Rationalist friend has a point about the *consequences* of the feeling.

  Agent-regret is healthy; it shows she cares. However, your friend is showing signs that this regret is metastasizing into pathology:
  *   **Rumination:** Replaying the operation constantly.
  *   **Avoidance:** Turning down cases.

  This is no longer just agent-regret; this is **trauma**. If she continues to interpret her agent-regret as *guilt* (i.e., "I feel bad, therefore I must have done bad"), she will eventually quit or become paralyzed.

  ### Conclusion
  You win the argument on the nature of moral experience. She is entitled to feel differently because she *acted*. That feeling tracks her **agency**, not her **negligence**.

  However, your Rationalist friend wins on the pragmatic warning: she cannot let that feeling dictate her future actions (turning down cases).

  **How to help her:**
  Stop arguing about whether she *should* feel guilty. Instead, help her rename the feeling.
  1.  **Validate the Agency:** "You aren't feeling guilty because you messed up. You're feeling the weight of being the one who held the scalpel. That weight is the price of being a good surgeon."
  2.  **Separate Outcome from Action:** "You can own the action without owning the outcome. You did the work. The biology did the rest."
  3.  **Reframe the Avoidance:** "Turning down cases doesn't honor the patient who died. Honoring them means using your cleared name and skilled hands to save the next one who doesn't have that rare allergy."

  She needs to move from "I am to blame" to "I am the agent, and I must carry this." That is a heavy burden, but it is the only one a surgeon can realistically carry.
