  8.  **Final Polish:** Check for clarity on the "Targetless HOT" issue (Rosenthal's ace in the hole) and the "Access vs. Phenomenality" issue (Carruthers' weak spot). (Self-correction: Ensure I don't conflate Carruthers with Dennett too much, though they are allies on illusionism).

  *(Self-Correction during drafting)*: I need to be careful not to say Carruthers *denies* phenomenality entirely in his earlier work. In *Consciousness: Essays from a Higher-Order Perspective*, he argues for dispositionalism to save the theory from psychological implausibility. Later, in *The Opacity of Mind*, he goes full illusionist. I should focus on the Dispositionalist phase as that's what the user is asking about, but hint at the illusionist trajectory as it strengthens the "explaining away" worry.

