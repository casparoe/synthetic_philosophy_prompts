  I've been going down a bit of a pop-science rabbit hole on interpretations of quantum mechanics lately (started with a podcast episode, now I'm like three books deep), and there's a claim that keeps coming up that I want to sanity-check with someone who actually knows the physics and philosophy here, since I don't really have anyone in my life to ask. The claim is basically that Bell's theorem in the 1960s proved once and for all that hidden variable theories are impossible, which is supposedly why the field settled into a Copenhagen vs. Everett/many-worlds split, and why Bohmian mechanics (pilot-wave theory) gets treated as a historical footnote that only a handful of stubborn holdouts still bother with.

  So since Bell's theorem apparently killed off hidden variables, my question is: why do people like Tim Maudlin and other serious philosophers of physics still spend so much time defending Bohmian mechanics as a live option instead of just admitting its dead? And as a bonus question, one of the books I read made it sound like many-worlds was specifically motivated by wanting a "local" alternative to the spooky nonlocal stuff Bell's theorem supposedly forces on everyone else, which confused me even more, because I thought the entanglement/Bell-correlation results were the same no matter which interpretation you pick, since that's just what the experiments show. Is many-worlds actually "local" in some sense that Bohm and Copenhagen aren't, or is that a misleading way of putting it?
