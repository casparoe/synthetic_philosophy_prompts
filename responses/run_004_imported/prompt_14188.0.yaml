answer: |-
  This is a fantastic set of questions. You have correctly identified that pop-science coverage often smooths over the jagged edges of quantum foundations, and the claim you encountered contains a very specific, critical error that changes everything.

  Here is the sanity check you are looking for, broken down by the two main issues you raised.

  ### 1. Bell's Theorem and "Hidden Variables"

  The claim you read is **half-true**, but the missing word renders it misleading.

  **The Correction:** Bell's Theorem did not prove that *hidden variable* theories are impossible. It proved that **local** hidden variable theories are impossible.

  This is the single most important distinction in this entire debate.
  *   **Local:** What happens here cannot instantly affect what happens there (no faster-than-light influence).
  *   **Hidden Variables:** There is definite stuff (particles, properties) existing independently of whether we measure them.

  Before Bell, Einstein (via the EPR paradox) hoped for a theory that was both Local *and* had Hidden Variables (to restore determinism and realism). Bell derived an inequality that any such theory must satisfy. Experiments (Aspect, Clauser, Zeilinger) showed that nature violates Bell's inequalities.

  **Conclusion:** Nature cannot be both Local and Real (in the hidden variable sense). You have to give up one.

  **Why Bohmian Mechanics Survives:**
  Bohmian mechanics (De Broglie–Bohm pilot-wave theory) is a **Non-Local Hidden Variable** theory.
  *   It has hidden variables (particles have definite positions at all times).
  *   It explicitly embraces non-locality (the "pilot wave" guides particles based on the configuration of the *entire* system instantly, regardless of distance).

  Because Bohmian mechanics sacrifices locality to save realism, **Bell's theorem does not kill it.** In fact, historically, it was David Bohm's 1952 revival of pilot-wave theory that inspired John Bell to investigate the question of locality in the first place. Bell was actually quite sympathetic to Bohmian mechanics; he famously criticized the "shut up and calculate" approach and felt Bohm's theory was unfairly ignored.

  **Why do philosophers like Tim Maudlin defend it?**
  You asked why serious scholars don't just admit Bohm is dead. To them, it isn't dead; it's the only theory that solves the **Measurement Problem** cleanly.

  *   **Copenhagen:** Postulates that the wavefunction "collapses" upon measurement, but doesn't define what a "measurement" is physically. Is it a human? A Geiger counter? A photon hitting an atom? It relies on a vague cut between the quantum system and the classical observer.
  *   **Many-Worlds (MWI):** Says there is no collapse, but then you have to explain why we perceive probabilities if everything happens, and accept an infinite ontology of branching universes.
  *   **Bohm:** Says particles always exist. The wavefunction is a real field that guides them. There is no collapse. A "measurement" is just a physical interaction like any other.

  Maudlin and others argue that Bohmian mechanics is the only interpretation that provides a clear **ontology** (a description of what actually exists). The cost is explicit non-locality. Maudlin's argument is essentially: *"Bell proved the world is non-local anyway. Copenhagen hides the non-locality behind 'collapse,' and MWI hides it in the branching structure. Bohm just puts it on the table honestly. Why punish it for being honest?"*

  ### 2. Many-Worlds and Locality

  Your bonus question is deeper and touches on a current debate in foundations.

  **The Claim:** "Many-Worlds was motivated by wanting a local alternative."
  **The Verdict:** This is partially true, but requires careful definition of "local."

  Hugh Everett (who proposed MWI in 1957) was primarily motivated by removing the "collapse" postulate to make quantum mechanics consistent with itself (unitary evolution only). However, proponents of MWI today (like David Wallace or Sean Carroll) often argue that MWI is the most "local" of the interpretations.

  **How can MWI be local if Bell says nature is non-local?**
  This is where the definitions get slippery.

  1.  **Copenhagen & Bohm:** Both involve something happening in 3D space that connects distant points instantly. In Copenhagen, the wavefunction collapses everywhere at once. In Bohm, particle A's trajectory depends instantly on particle B's position. This violates the *spirit* of Special Relativity (even if it doesn't allow faster-than-light signaling).
  2.  **Many-Worlds:** There is no collapse. The universal wavefunction evolves according to the Schrödinger equation. The Schrödinger equation is a **local differential equation** (in configuration space).
      *   When Alice measures her entangled particle, she doesn't "change" Bob's particle instantly. Instead, Alice becomes entangled with her particle, and the universe branches. Bob is still separate until he interacts with his particle.
      *   The correlation between Alice and Bob is established only when their respective "branches" interact or are compared later.
      *   MWI proponents argue that because the wavefunction evolves locally in Hilbert Space, and no signal is sent between Alice and Bob, MWI preserves locality better than the others.

  **The Counter-Argument:**
  Critics argue this is a trick of definition. While the *math* of the wavefunction evolution is local, the *experience* of the observers still involves correlations that Bell proved cannot be explained by local causes. MWI gets around this by saying "all outcomes happen," so you don't need a causal link to explain why Alice got 'Up' and Bob got 'Down'—there is a branch where they match the correlation, and we just find ourselves in it.

  **Are the experimental results the same?**
  **Yes.** This is crucial. Copenhagen, Bohm, and Many-Worlds are **empirically equivalent** (mostly). They predict the exact same results for every experiment we can currently perform.
  *   If they predicted different results, one would have been disproven by now.
  *   The difference is entirely **metaphysical**. It is about what you think is *happening*, not what you think the detector will read.

  ### Summary for your Rabbit Hole

  1.  **Bell's Theorem:** Killed *Local* Hidden Variables. It did **not** kill Bohmian Mechanics, which is *Non-Local*.
  2.  **Bohm's Status:** It is not a "dead footnote." It is a minority view among working physicists (who mostly use Copenhagen pragmatically), but it is a major, respected view among philosophers of physics because it solves the Measurement Problem without requiring infinite worlds.
  3.  **MWI and Locality:** MWI claims to be "local" because it removes instantaneous collapse, relying instead on the local evolution of the universal wavefunction. However, it still has to account for Bell's results, which it does via branching rather than signaling.
  4.  **The Real Split:** The field isn't just Copenhagen vs. Everett. It's a triangle:
      *   **Copenhagen:** Give up realism (properties don't exist until measured).
      *   **Bohm:** Give up locality (influences travel instantly).
      *   **Many-Worlds:** Give up uniqueness (all outcomes happen).

  You are asking the right questions. The pop-sci narrative often simplifies Bell to "Einstein was wrong, quantum magic is real," when the actual lesson is much stranger: "Einstein was right about realism, or he was right about locality, but he couldn't be right about both." Bohm chose realism; MWI chose a form of locality; Copenhagen chose to stop asking the question.

  Keep reading, but keep an eye out for that word **"Local."** It's the key that unlocks the whole puzzle.
