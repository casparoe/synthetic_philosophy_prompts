answer: |-
  It is completely understandable why that documentary blew your mind. The split-brain research is arguably some of the most philosophically unsettling science ever conducted. It strikes at the very core of what we think a "self" is.

  However, the short answer to your question is: **No, it is not a settled question.** In fact, in the last decade, the consensus has shifted significantly away from the "two minds" theory you described.

  Here is a breakdown of why neuroscientists and philosophers are still arguing, why the "two minds" conclusion is controversial, and why this doesn't necessarily mean everyone is walking around with two hidden consciousnesses.

  ### 1. The "Two Minds" Hypothesis (The Classic View)
  Your understanding reflects the dominant view from the 1970s through the 1990s, championed by Nobel laureate Roger Sperry and his student Michael Gazzaniga.
  *   **The Evidence:** As you noted, if you show an image only to the left visual field (processed by the right hemisphere), the patient cannot name it (because language is usually in the left hemisphere). However, their left hand (controlled by the right hemisphere) can point to the object. If asked why they pointed, the left hemisphere (the speaking part) will confabulate a reason ("I wanted a soda") even though it had no access to the visual information.
  *   **The Conclusion:** Gazzaniga argued that the corpus callosum is the bridge of unity. Without it, you have two separate spheres of consciousness. The left hemisphere is the "interpreter" that creates a narrative to make sense of the fragmented world.

  ### 2. Why It's Not Settled: The Counter-Evidence
  If the "two minds" theory were obviously true, the debate would be over. But recent research has poked massive holes in it.

  **A. The Patients Don't Feel Like Two People**
  When asked directly, split-brain patients overwhelmingly report feeling like a single, unified person. They don't report an internal struggle or a sense of duality in their daily lives. While one could argue they are "unaware" of the other mind, the lack of subjective conflict is a major data point.

  **B. Subcortical Connections Remain Intact**
  A corpus callosotomy cuts the *cortical* bridge (the outer layer). It does **not** cut the brainstem, the thalamus, or other subcortical structures.
  *   Newer research suggests these deeper structures allow enough information transfer to maintain a unified consciousness.
  *   For example, emotional states and arousal levels are shared. If the right hemisphere sees something scary, the left hemisphere feels the fear, even if it doesn't know *why*.

  **C. The "Unified Consciousness" Studies (2014–2017)**
  A team led by Yair Pinto at the University of Amsterdam conducted rigorous new tests on split-brain patients.
  *   They found that patients could respond to stimuli presented to *both* visual fields simultaneously with high accuracy, suggesting a unified perceptual field.
  *   They argued that while the hemispheres are *functionally* independent (they can process info separately), they are *phenomenologically* unified (there is only one "experience" of being).
  *   **Analogy:** Think of a computer with two processor cores. They can handle different tasks independently, but they run one Operating System. The classic view said cutting the callosum creates two computers; the new view says it creates one computer with a slower bus speed between cores.

  ### 3. Why "Everyone Has Two Minds" Is Likely False
  Even if we accept the strongest version of the split-brain theory (that patients have two minds), it does not follow that intact brains have two minds.

  **Integration vs. Separation**
  In an intact brain, the corpus callosum transfers about **200 million axonal signals per second**. This isn't just "cross-talk"; it is deep integration.
  *   **Binding:** Visual features (color, motion, shape) processed in different areas are "bound" together into a single image. This binding relies heavily on callosal transfer.
  *   **Emergence:** Consciousness is likely an emergent property of the *network*. If you sever the network, you degrade the system. You wouldn't say a severed spinal cord proves the legs have independent minds; it proves the system relies on connectivity to function as a whole.

  **Plasticity**
  In split-brain patients, the brain often undergoes compensatory changes. The "independence" seen in labs is often a result of the specific experimental setup isolating the hemispheres. In the real world, patients use head movements, eye movements, and subcortical cues to re-integrate their experience constantly.

  ### 4. The Philosophical Stalemate
  The reason this isn't "settled" is that it depends on how you define **consciousness**.

  *   **If you define consciousness by information access:** Then yes, the hemispheres have restricted access to each other's data. This leans toward "two minds."
  *   **If you define consciousness by subjective experience:** Then no, because the patient reports one continuous stream of experience. This leans toward "one mind."

  Neuroscientists like Tim Bayne argue that consciousness is **graded**, not binary. A split-brain patient might have a consciousness that is *less integrated* than yours, but not fully *split* into two persons.

  ### Summary
  The documentary you watched presented the dramatic, classic interpretation (the "Gazzaniga view"), which makes for great TV. But the scientific reality is messier.

  1.  **It's not settled:** Recent evidence suggests consciousness remains unified even after the cut.
  2.  **Anatomy matters:** The brain is not fully severed; subcortical links preserve unity.
  3.  **Intact brains are different:** The massive bandwidth of the intact corpus callosum creates a level of integration that likely precludes "two minds" in healthy people.

  The split-brain cases don't prove we are all two people; they prove that our sense of unity is a fragile, constructed achievement of neural integration. If you break the integration, the unity frays—but it doesn't necessarily snap into two distinct people.
