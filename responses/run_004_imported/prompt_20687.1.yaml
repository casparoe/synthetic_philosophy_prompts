      *   **Role:** Trustee of a small hardship fund for piano/harpsichord restorers.
      *   **Task:** Draft a short memo to circulate to the other four trustees before a vote.
      *   **Subject:** Whether to continue payments to Elena, a member with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS).
      *   **Conflict:** The fund's 1970s rules require "genuinely incapacitated by sickness."
          *   *Side A (2 trustees):* "Sickness" requires demonstrable, objective biological malfunction (scans, blood tests). ME/CFS lacks this.
