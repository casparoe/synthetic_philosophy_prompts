          *   *Correction:* Lewis is a *realist* about laws (in a deflated sense). The Best System is objective. It depends on the *actual* mosaic and the objective balance of simplicity and strength, not on what inquirers *believe* or would settle on. It is *not* mind-dependent/epistemic. This is a common but serious misunderstanding of Lewis. Lewis explicitly argues against making laws epistemic.
          *   *Assessment:* Major philosophical error here. Mischaracterizes Lewis's ontology.

      *   *Paragraph 3 (Armstrong):*
          *   "Laws, for him, are relations of natural necessitation, N(F,G), between universals..." (Correct).
          *   "...further, contingent, second-order state of affairs..." (Correct).
          *   "...necessitates that all F's are G's." (Correct).
          *   "...underwrite counterfactuals..." (Correct, this is a key motivation for Armstrong).
          *   *Assessment:* Solid summary of Armstrong.

      *   *Paragraph 4 (Dispositional Essentialism vs. Armstrong):*
          *   "Dispositional essentialists like Bird are anti-Humean..." (Correct).
