          *   *Correction:* This is backwards or at least highly confused.
              *   Armstrong: Laws are *contingent*. N(F,G) could fail to hold. It is *natural* necessitation, not logical/metaphysical necessity.
              *   Bird (Dispositional Essentialism): Laws flow from the essences of properties. If properties exist, they *must* behave as they do. This is often argued to be *metaphysically* necessary (or at least stronger than Armstrong's contingent necessitation).
              *   The student claims Armstrong has "stronger, fully metaphysical necessity" and Bird has "weaker natural necessity." This is the opposite of the standard reading. Armstrong fights hard to say N is *not* logical necessity (the "Inference Problem"). Bird argues the necessity is grounded in identity, making it tighter (often metaphysical).
              *   Also, saying Bird is closer to Lewis on modal status is wrong. Lewis says there is *no* modality in the world (Humean). Bird says modality is fundamental. Armstrong says modality is contingent. Bird is further from Lewis modally than Armstrong is, because Armstrong admits contingency (like Lewis), whereas Bird posits essential modality.
