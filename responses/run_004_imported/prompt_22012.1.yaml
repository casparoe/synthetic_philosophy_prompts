answer: |-
  Here are ten interview questions designed to probe the structural integrity of the expressivist account, specifically targeting the Frege–Geach problem, the negation problem, and the risk of collapse into cognitivism. Each includes a follow-up tailored to the standard expressivist defense.

  **1. The Motivational Starting Point**
  "Let's begin with the core intuition. Expressivism is often motivated by the idea that moral judgments are more like desires or emotions than beliefs—they move us to act. But if we accept your 'logic of attitudes' solution, where moral sentences behave logically just like factual statements, do we lose that original motivational advantage? In other words, if moral language works *exactly* like fact-stating language, why start by insisting it isn't fact-stating?"

  *   **Follow-up:** "If you answer that the metaphysics is still lighter because we don't posit moral facts, I want to ask: if the logic and the linguistic behavior are identical, does that 'lighter metaphysics' actually explain anything, or is it just a label?"

  **2. The Embedded Conditional (Concrete Case)**
  "I want to walk through the promise-breaking example. When I assert 'Breaking a promise is wrong,' you say I express disapproval. But consider the antecedent in this sentence: 'If breaking a promise is wrong, then talking someone into breaking theirs is wrong.' Here, I am not asserting that promise-breaking is wrong, so I cannot be expressing disapproval of it. What specific attitude is being expressed in that 'if' clause?"

  *   **Follow-up:** "If you say it expresses a 'higher-order attitude' about the consistency of other attitudes, does having that higher-order attitude itself have a truth value? If yes, haven't we just reintroduced truth conditions?"

  **3. The Negation Problem**
  "This leads to the negation problem. If 'wrong' expresses disapproval, what attitude does 'not wrong' express? Is it 'tolerance'? And if so, is tolerance a distinct psychological state, or is it just the absence of disapproval? If it's just an absence, how can it function as a premise in an argument?"

  *   **Follow-up:** "If you argue it is a distinct state of tolerance, does that mean for every moral concept, we need to posit a paired positive and negative attitude? Doesn't that double the psychological machinery required for every moral term?"

  **4. Generalizing to Disjunction**
  "Let's complicate that further. Consider the sentence: 'Either stealing is wrong or lying is wrong.' This isn't a conditional, and it's not a simple negation. What single attitude am I expressing here? It doesn't seem to be disapproval of stealing, because I might be okay with stealing if lying isn't wrong. Is there a specific 'disjunctive attitude'?"

  *   **Follow-up:** "If you say we don't need a unique attitude for every logical form but rather a logic that combines them, aren't you describing how beliefs combine? What makes the combination of attitudes different from the combination of beliefs?"

  **5. Validity Without Truth**
  "You've mentioned that expressivists build a logic of attitudes to preserve validity. In classical logic, validity is about truth preservation: if the premises are true, the conclusion must be true. In your logic, what is being preserved? Is it 'consistency of attitudes'?"

  *   **Follow-up:** "If validity is just about avoiding conflicting attitudes, does that mean a moral argument is valid even if it's based on a complete misunderstanding of the non-moral facts, provided the attitudes cohere? How do you handle mixed arguments with both moral and factual premises?"

  **6. The Collapse Worry (Cognitivism vs. Expressivism)**
  "This brings us to a worry some critics call 'the collapse problem.' If your logic of attitudes successfully reconstructs all the formal features of truth-conditional semantics—negation, conditionals, validity, consistency—what work is left for the distinction between 'expressing an attitude' and 'stating a fact' to do? At what point does quasi-realism just become realism?"

  *   **Follow-up:** "If you reply that the difference is metaphysical (no moral properties exist), I'd ask: if the logic forces us to talk *as if* they exist in every meaningful context, is that metaphysical claim doing any explanatory heavy lifting, or is it a silent partner?"

  **7. Psychological Plausibility**
  "Let's talk about the agent. For your logic to work, do actual human beings need to possess these complex, higher-order attitudes consciously? When a normal person says 'If stealing is wrong...', are they really holding a complex attitude about the consistency of their disapprovals, or is this a reconstruction a philosopher imposes on them?"

  *   **Follow-up:** "If it's a reconstruction (a 'rational reconstruction'), does that mean expressivism is a normative theory about how we *should* think, rather than a semantic theory about what we *are* doing when we speak?"

  **8. Explanatory Payoff**
  "Suppose a cognitivist says, 'I can explain all the logic you just described by saying moral sentences describe facts, and I don't need to invent a new logic of attitudes.' What is the one thing your expressivist account explains better than theirs? Is it just the connection to motivation?"

  *   **Follow-up:** "If motivation is the key, couldn't a cognitivist just say that moral facts are inherently motivating? What prevents that view from stealing your best explanation?"

  **9. The Error Theory Alternative**
  "Why prefer expressivism over Error Theory? The Error Theorist agrees with you that there are no moral facts, but they say that means all positive moral claims are false. Why go through the trouble of building a logic of attitudes rather than just accepting that moral discourse is systematically flawed?"

  *   **Follow-up:** "If your answer is that we want to 'save' moral discourse, isn't that a pragmatic reason rather than a semantic one? Are you changing the subject to save our feelings?"

  **10. Falsification Conditions**
  "Finally, I want to ask about the limits of the 'logic of attitudes' project. We've discussed conditionals, negations, and disjunctions. What would count as evidence that this account has *failed*, rather than evidence that it just needs one more attitude added to the machinery? Is there a specific linguistic phenomenon that, if found, would force you to abandon expressivism?"

  *   **Follow-up:** "If you say that no such phenomenon exists because the theory can always be extended, doesn't that make the theory unfalsifiable? And if it's unfalsifiable, how do we distinguish it from a research program that has lost contact with the data?"
