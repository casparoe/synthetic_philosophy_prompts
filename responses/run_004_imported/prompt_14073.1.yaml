answer: |-
  **The False Promise of the Bayesian Fix: Why the Bem Saga Was Never About the Math**

  The story of Daryl Bem's "feeling the future" paper has hardened into a convenient mythology within psychology. The narrative arc is clean: In 2011, Bem used standard frequentist null-hypothesis significance testing (NHST) to publish evidence for precognition in a top journal. The $p$-values were significant, the peer review passed, and the door to the paranormal swung open. Then came the cavalry. Eric-Jan Wagenmakers and colleagues re-analyzed the data using Bayes factors, demonstrating that when you account for the low prior probability of psi, the evidence evaporated. The moral usually drawn from this is that frequentist statistics are a leaky vessel, while Bayesian methods provide a bulwark against false positives.

  It is a comforting story. It suggests that the replication crisis was a technical glitch, solvable by swapping out our statistical software. But this conclusion is wrong. The Bem episode does not vindicate Bayesian statistics as a structural fix for scientific reliability. While the Bayesian critique was diagnostically sharp, it is prescriptively insufficient. The hard verdict is this: **The replication crisis was never a crisis of inference; it was a crisis of data generation.** No amount of posterior updating can correct for corrupted input, and relying on Bayesian methods as a safeguard creates a dangerous illusion of security. The only true vaccine is not a different kind of math, but the structural constraint of preregistration.

  To understand why the Bayesian victory lap is premature, we must acknowledge where Wagenmakers was right. His critique highlighted a genuine weakness in standard NHST: it treats all hypotheses as if they are equally plausible before the data arrives. In a frequentist framework, a $p < .05$ result for precognition is treated with the same mathematical weight as a $p < .05$ result for a new cognitive therapy. Wagenmakers correctly argued that extraordinary claims require extraordinary evidence, and Bayes factors allow you to encode that skepticism into the analysis via priors. In the specific case of Bem, the Bayesian re-analysis successfully signaled that the data were not strong enough to overturn our understanding of physics.

  However, diagnosing a corpse is not the same as preventing the murder. The Bayesian approach assumes that the data being fed into the model are a faithful representation of the experimental process. This is where the "Garden of Forking Paths," as Andrew Gelman termed it, destroys the Bayesian advantage.

  Gelman's argument is that researcher degrees of freedom—the decisions to exclude outliers, transform variables, or stop data collection early—can be tuned to produce favorable results regardless of the statistical framework. A researcher intent on finding an effect can "BF-hack" just as easily as they can $p$-hack. By trying different priors, excluding different data points, or analyzing subsets of conditions until the Bayes Factor crosses a threshold of "substantial evidence," a biased analyst can coax a Bayesian model into supporting a null hypothesis as easily as a frequentist one. The math does not police the researcher's intent. If the data generation process is flexible and opaque, the posterior distribution is simply a precise quantification of bias.

  The definitive proof that the statistic was not the variable lies in the replications. A few years after the Bem controversy, Galak and colleagues conducted large-scale, preregistered replications of the precognition experiments. Crucially, they did not switch to Bayesian methods. They used standard frequentist tests. They found nothing. The effect size collapsed to zero.

  This is the smoking gun. If the problem were inherent to frequentist NHST, the Galak replications should have also yielded false positives, assuming they used the same statistical tools as Bem. They didn't. The difference between Bem's significant results and Galak's null results was not the formula used to analyze the data; it was the protocol used to generate it. Bem's study allowed for flexibility; Galak's study locked the door before the data was collected.

  Therefore, the lesson of the Bem saga is not that we need to abandon $p$-values for posteriors. The lesson is that **statistical philosophy is secondary to research transparency.** A frequentist analysis on preregistered, high-power data is infinitely more reliable than a Bayesian analysis on flexible, exploratory data.

  Advocating for Bayesian statistics as the solution to the replication crisis risks letting the scientific community off the hook. It suggests that we can maintain our current incentives—publish or perish, novelty over rigor—as long as we upgrade our calculators. It implies that the error was in the *calculation* of truth, rather than the *production* of evidence. This is a seductive but fatal error. If we adopt Bayesian methods without fixing the underlying incentives and transparency issues, we will simply enter an era of "Bayesian Replication Crisis," where priors are tuned to fit narratives and Bayes Factors are hunted until they signify.

  The actual moral of the Bem episode is less mathematically elegant but more behaviorally demanding. The replication crisis was caused by a system that rewarded surprising results over robust ones, giving researchers the latitude to unconsciously or consciously massage data until it sang. The fix is not to change how we weigh the evidence, but to constrain how we gather it. Preregistration, open data, and registered reports remove the forks in the path before the walk begins.

  In the end, Wagenmakers was right that Bem's evidence was weak, but he was wrong to imply that Bayesianism is the shield that prevents such papers from being published. The shield is transparency. Bem's paper passed peer review not because $p$-values are broken, but because the review process could not see the decisions made behind the curtain. Bayes factors do not lift that curtain. Only open science practices do.

  We should welcome Bayesian methods for what they are: a powerful language for quantifying uncertainty and incorporating prior knowledge. But we must reject the notion that they are a moral technology. They cannot make a sloppy study rigorous, and they cannot make a biased design honest. The Bem saga teaches us that there is no statistical salvation. There is only the hard, unglamorous work of locking down methods, sharing data, and accepting that the most important number in a study isn't the $p$-value or the Bayes Factor—it's the sample size of the replication.
