answer: |-
  The glow of the monitor was the only light in the apartment, casting Elias's face in a sickly blue. It was 3:00 AM, the hour when logic thins and the internet's deeper currents pull hardest. He had started looking up coping mechanisms for grief—his mother had died six months prior—and somehow, through a series of algorithmic recommendations and forum links, he had landed on *Quantum Immortality*.

  The text was dense, a mix of Hugh Everett's Many-Worlds Interpretation and anthropic reasoning. The summary was simple, almost seductive: In a multiverse where every quantum outcome happens, there is always a branch where you survive. Since you cannot experience the branches where you die, your conscious experience must follow the path of survival. Always.

  *You are the constant,* the forum post read. *Death is something that happens to other people, in other branches. In yours, you just keep going.*

  Elias leaned back. The silence of the apartment pressed against his ears. For the first time in half a year, the tightness in his chest loosened. If the theory held, his mother wasn't gone in the grand scheme; she was just in a branch he could no longer access. And him? He was the traveler who couldn't stop.

  He went to work the next day feeling lighter, as if gravity had lost its grip on his bones. He walked to the subway, and when a cyclist swerved onto the sidewalk, clipping his shoulder and sending him stumbling toward the curb, Elias didn't flinch. He hit the concrete hard, scraping his palm.

  A normal reaction would have been adrenaline, a spike of terror. Instead, Elias felt a strange, cold validation. *Of course I'm here,* he thought, dusting off his coat. *The other version of me might have stepped under a bus. But not this one.*

  Over the next few weeks, the belief calcified. It started as a comfort, a shield against the anxiety of existence. Why worry about health screenings? Why fear the future? The universe would conspire to keep his consciousness online.

  But the shield soon became a cage.

  He met his friends for drinks on a Friday. They were talking about a mutual acquaintance who had been diagnosed with an illness. There was the usual hush, the clinking of glasses, the nervous laughter about "living in the moment."

  "It's scary, isn't it?" his friend Mark said, swirling his beer. "Just... blinking out. One day you're here, the next you're not."

  Elias looked at his own hands. They looked the same as they always had, but he felt detached from them, like they were props in a play. "It's not blinking out," Elias said quietly. "It's just branching. You don't experience the end. You only experience the continuation."

  Mark laughed, a short, uncomfortable sound. "Here we go. Elias and his physics theories. You're telling me you think you're immortal?"

  "Subjectively," Elias corrected. "From the inside."

  "That's the most depressing thing I've ever heard," Mark said, shaking his head. "Imagine outliving everyone you love. Just wandering around while the world burns."

  Elias didn't answer. He had thought about that. In fact, he couldn't stop thinking about it.

  The theory didn't promise *safety*. It promised *continuity*. That distinction began to haunt him. Quantum immortality didn't mean he wouldn't get hurt; it meant he wouldn't cease. He could be in a car crash, paralyzed and in agony, and as long as his brain sustained a flicker of consciousness, he would be there to experience it. He could be an old man, withered and alone, kept alive by machines, and he would still be the observer in the chair.

  The freedom he had initially felt curdled into a specific kind of dread.

  He started avoiding risks, not because he feared death, but because he feared the *path* to survival. He imagined a branching tree. In one branch, he crossed the street safely. In another, he was hit, survived, but spent ten years in rehabilitation. Both branches contained a living Elias. What force dictated which one he inhabited? Was it random? Or was it the path of least resistance?

  He stopped crossing the street against the light. He started wearing a helmet when he rented a bike. His friends joked that he'd become a hypochondriac. They didn't understand. He wasn't trying to survive; he was trying to avoid the branches where survival was a curse.

  The breaking point came on a Tuesday in November. Elias was driving back from visiting his mother's grave. The roads were slick with black ice. He was rounding a bend when the rear of his car slid.

  Time didn't slow down; that was a myth. Time fractured.

  He saw the guardrail rushing toward him. He saw the drop-off beyond it, a steep embankment leading to the river below. In one branch, the car hit the rail, crumpled, and he walked away with bruises. In another, it went over. In another, a truck came around the bend and T-boned him.

  Elias gripped the wheel. The old Elias, the one before the rabbit hole, would have slammed on the brakes, would have prayed, would have feared the end.

  The new Elias felt a surge of arrogance. *I am the survivor. The math is on my side.*

  He didn't brake. He steered into the skid, not to save the car, but to test the universe. To see if he could feel the hand of probability guiding him.

  The car spun. It missed the guardrail by inches. It slid sideways, the tires finding no purchase, and tipped over the edge.

  The world turned upside down. Metal screamed. Glass shattered. Then, darkness.

  Elias woke up to the sound of dripping water and the smell of gasoline. He was hanging upside down, strapped in by the seatbelt. His left leg was bent at an angle that made him vomit. Pain, white and hot, flooded his nervous system.

  He was alive.

  He laughed. It was a ragged, wet sound. *See?* he thought. *I told you. I am the constant.*

  But as he waited for the rescue, shivering in the cold dark of the wreck, the laughter died. He looked at his broken leg. He thought about the surgery, the rehabilitation, the chronic pain that would likely follow him for decades. He thought about the insurance premiums, the loss of work, the way his friends would look at him with pity.

  This was the branch he was in. Not the one where he walked away unscathed. Not the one where he died instantly and painlessly. This was the branch where he suffered, but persisted.

  *Quantum Immortality doesn't care about your quality of life,* he realized, the truth settling over him like the cold air in the wreck. *It only cares about the signal. As long as the light is on, you're in the room.*

  When they pulled him out, he was sedated, but the thought remained. He spent three months in recovery. His friends visited, but he pushed them away. He couldn't explain that he wasn't recovering from an accident; he was recovering from a revelation.

  He had believed the theory made him special. Instead, it made him a prisoner. If he was truly immortal in this subjective sense, he was destined to watch everything he loved decay while he remained, a stubborn stain on the timeline. He would be the last man on earth, blinking in the radiation of a dying sun, unable to turn off the light.

  Six months after the crash, Elias stood in front of his bathroom mirror. The scar on his chin was pink and fresh. He looked tired.

  He picked up a razor. He thought about the theory again. He thought about the branches. If he cut himself, there was a branch where he slipped and hit an artery. There was a branch where he stopped in time.

  He put the razor down.

  He realized then that the only way to live a human life was to pretend the theory was false. To believe in the end. Mortality was not a bug; it was the feature that gave the moments value. If the story never ended, the chapters meant nothing.

  He walked out of the bathroom and picked up his phone. He dialed Mark.

  "Hey," Mark said, surprised. "Haven't heard from you in ages. You okay?"

  Elias looked out the window. The sun was setting, painting the sky in bruises of purple and orange. It was beautiful because it wouldn't last.

  "No," Elias said honestly. "I'm not okay. But I'm here. And I think... I think I need to start acting like I might not be tomorrow."

  "That's a good place to start, man."

  Elias hung up. He didn't know if the theory was true. Physics was indifferent to his belief. But he knew that acting as if he were the sole survivor of a cosmic lottery was a lonely way to exist.

  He went to the kitchen and made dinner for one. He ate slowly, savoring the taste, knowing that one day he wouldn't be able to taste it. He let himself imagine the silence that would come after. He let himself imagine the end.

  And for the first time since the blue light of the monitor had drawn him in, Elias felt truly, beautifully mortal. He finished his plate, turned off the light, and walked into the dark, trusting that it would eventually, and finally, take him.
