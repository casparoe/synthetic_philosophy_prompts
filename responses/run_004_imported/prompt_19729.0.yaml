answer: |-
  [Stand at the lectern. Pause. Look at the congregation.]

  For those of you who don't know me, I'm the family novelist. I'm told this is why I'm speaking today. In a family accustomed to proofs, data, and verifiable results, I am the one hired to handle the narrative arc. To smooth the edges. To find the theme.

  But before he died, [Father-in-Law's Name] left me a specific note regarding the theme. It said, and I quote: "Do not give me a Road to Damascus. There was no blinding light. There was only a calculator. Do not lie to my friends."

  So, I won't.

  [Father-in-Law's Name] came to the Catholic Church at fifty-odd years old. He did not come because he heard a voice. He came because he looked at the expected value.

  Many of you at the back of the church know the math. He was fond of explaining it at dinner, usually after the second glass of wine. He would outline Pascal's Wager with the precision of a lecture. If God exists, belief yields infinite gain. If He does not, the loss is finite. Therefore, the rational choice is to believe. He would lay this out for guests, eyes twinkling, and then admit the flaw in the logic: You cannot simply choose to believe a thing because it is advantageous.

  So, he did what any rigorous scientist would do. He tested the hypothesis.

  He told me once, "Pascal knew you couldn't think your way into faith. You have to act your way there." He called it the "other half" of the argument. He started taking the holy water. He started kneeling. He started saying the prayers, even when his mind was racing with variables and doubts.

  He had a favorite word for this process. Some of you in the math department will recognize it. *Abêtira*. Pascal's French term. Roughly translated, it means "to make beast-like." To stupefy. To dull the sharp, cutting edge of the intellect until it is quiet enough to receive something else.

  To the mathematicians here: He loved that word. He loved the irony that a man of his mind had to willingly lower his signal-to-noise ratio to find peace. He treated his own ego as a variable that needed to be solved for, and then subtracted.

  But to the parish family here, who knew him as the man in the third pew who never missed a Saturday mass: You didn't see a calculation. You saw consistency. You saw a man who showed up.

  There is a temptation to call this a "con." To say that if the faith began as a wager, it wasn't sincere. But I have watched him for twenty years. I have watched him pray over sick friends. I have watched him offer quiet kindnesses that gained him no social credit. I have watched him sit in this church, not with the look of a man waiting for a payout, but with the look of a man who had found a home.

  A bet implies risk. A bet implies you might walk away if the odds change. [Father-in-Law's Name] never walked away. He paid the cost of the wager every single week. He gave his time, his pride, and his certainty. He dulled his own brilliance to make room for grace.

  In the end, the novelist in me wants to say that the wager paid out. But the truth is simpler, and what he would have preferred. The wager ceased to be a wager. The practice became the belief. The *abêtira* worked. The noise stopped.

  He didn't find a blinding light. He found something better. He found a place to rest his mind.

  He was a man who required evidence, but he understood that some evidence is only visible after you kneel. He bet on God, and then he lived as if he had won.

  Rest in peace.
