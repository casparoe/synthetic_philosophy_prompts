answer: |-
  Here are ten interview questions designed for your podcast. They are structured to acknowledge your self-study of Williams while pushing the guest to defend and nuance his legacy. Each includes the main question, an anticipated answer (based on standard philosophical defenses of Williams), and a targeted follow-up.

  ### 1. The State of the Field
  **Question:** Bernard Williams's *On Opera* was published posthumously and arrived somewhat out of step with the analytic philosophy of his time. Now that you've written a book defending and extending his account, how would you describe the current landscape? Are philosophers finally catching up to Williams's intuition that opera isn't just a "illustration" of philosophical ideas, but a distinct mode of thinking itself?

  *   **Anticipated Answer:** She will likely agree that opera is now taken more seriously in aesthetics but note that Williams remains unique in his focus on the *psychology* of the characters rather than just the metaphysics of the music.
  *   **Follow-up:** If she emphasizes the psychological focus, ask: "Does that focus risk ignoring the musical structure itself? Can we really separate the character's psychology from the composer's architectural decisions without losing what makes the music *work*?"

  ### 2. The *Don Giovanni* Problem (Required)
  **Question:** I want to start with *Don Giovanni*. Williams argues that the music makes Giovanni's predatory vitality vivid, even seductive, without the opera thereby endorsing him. But when I listen to 'Là ci darem la mano,' the music seems to collude with Giovanni against Zerlina's hesitation. Given what happens to Zerlina and Donna Anna, how do you maintain the distinction between *depicting* seduction and *enacting* it on the audience?

  *   **Anticipated Answer:** She will likely argue that the music reveals Giovanni's *interiority* (his confidence and drive) without validating his *moral rightness*. The music makes him intelligible, not justified.
  *   **Follow-up:** "But if the music makes him intelligible by making him beautiful, doesn't that blur the line for the audience? If I leave the theater humming Giovanni's tune, hasn't the opera succeeded in seducing *me*, regardless of his fate in the plot?"

  ### 3. Artificiality and Directness (Required)
  **Question:** Williams claims that opera's artificial, sung mode of address is precisely what lets it handle seduction and betrayal more directly than spoken drama can. Yet, through-composed verismo operas, and even Bizet's *Carmen* in its originally spoken-dialogue version, seem to achieve comparable emotional directness without that specific kind of artifice. Why is the "sung" quality so non-negotiable for Williams's theory if realism can be just as devastating?

  *   **Anticipated Answer:** She will likely contend that "sung" speech creates a conventional distance that allows us to accept extreme emotions as "truthful" in a way that realistic speech makes look hysterical or melodramatic.
  *   **Follow-up:** "So is the claim that verismo is actually *less* capable of this specific kind of truth? Or are you suggesting that even in verismo, the moment the singing starts, we enter a different ethical space than we do in spoken dialogue?"

  ### 4. Continuity with Moral Philosophy (Required)
  **Question:** Williams is best known for his attack on a single "morality system" and his insistence on irresolvable tragic conflict in works like *Ethics and the Limits of Philosophy*. Is this writing on opera genuinely continuous with that philosophical program, or is it really a separate enthusiasm with no deep tie to that ethical framework?

  *   **Anticipated Answer:** She will almost certainly argue for continuity, positing that opera displays the "conflict of values" that Williams felt the morality system tried to suppress.
  *   **Follow-up:** "If that's the case, can you point to a specific concept from his ethics—like 'moral luck' or 'thick ethical concepts'—that maps directly onto a musical mechanism in opera? I want to know where the philosophy touches the score."

  ### 5. Extending and Correcting Williams
  **Question:** You mention in your book that you are "extending" Williams's account, which implies there are gaps. Williams was writing in the 1990s about a canon that was already fixed. Where do you find his analysis most in need of correction? Is there a specific opera he dismisses or ignores that actually proves your extension of his theory better than his own examples do?

  *   **Anticipated Answer:** She may suggest Williams was too focused on the 18th and 19th centuries and needs to account for how modern productions or 20th-century works challenge his ideas of "character."
  *   **Follow-up:** "If his theory struggles with modern opera, does that mean his theory is actually about *humanism* in art rather than *opera* specifically? Is he using opera to talk about people, rather than talking about the art form?"

  ### 6. Transparency vs. Opacity
  **Question:** A key Williams idea is that music makes emotion "transparent"—we hear exactly what the character feels. But contemporary musicology often talks about music creating "opacity" or ambiguity. If the music tells me one thing and the text another, whose account wins? Does Williams's theory have room for irony, where the music might be lying to us?

  *   **Anticipated Answer:** She will likely argue that Williams allows for complexity, where the music reveals the *unconscious* desire even if the text is deceptive.
  *   **Follow-up:** "That's a fascinating distinction. But if the music reveals the unconscious, does that remove the character's agency? If the orchestra knows what I feel before I do, am I still a tragic agent, or just a puppet of the composer?"

  ### 7. The Role of the Audience's Imagination
  **Question:** Williams places a heavy burden on the audience's imagination to complete the work. He suggests we have to imagine the sound as human action. In an era of streaming and high-definition cinema broadcasts, where the experience is increasingly mediated by screens, does Williams's account of the "live" imaginative act still hold up?

  *   **Anticipated Answer:** She will likely argue that the imaginative work happens internally regardless of the medium, provided the viewer engages with the conventions of the art form.
  *   **Follow-up:** "But doesn't the close-up camera shot dictate *where* I look and *what* I feel, effectively doing the imaginative work for me? Does HD cinema actually undermine the 'opacity' Williams says we need to engage with?"

  ### 8. Regietheater and the Work
  **Question:** Williams seems to assume a certain fidelity between the score and the dramatic intention. How does your extension of his view handle *Regietheater*—directors who radically reinterpret or even contradict the original setting? If a director stages *The Marriage of Figaro* as a fascist nightmare, is that a violation of the "work" Williams is describing, or a valid extension of its conflict?

  *   **Anticipated Answer:** She will likely take a moderate view: the production must respect the musical-dramatic relationships Williams identifies, even if the setting changes.
  *   **Follow-up:** "Where is the line, though? If the music expresses vitality and the director stages death, has the production failed Williams's test, or has it simply found a new conflict within the same score?"

  ### 9. Emotional Resonance vs. Intellectual Understanding
  **Question:** One of the joys of your book is that it treats opera as something to be understood, not just felt. But opera lovers often say the music bypasses the intellect entirely. Is there a risk that applying Williams's rigorous philosophical framework sanitizes the visceral, irrational experience of listening to opera?

  *   **Anticipated Answer:** She will likely argue that understanding the structure *deepens* the visceral experience rather than replacing it; that "feeling" and "understanding" are not opposites in aesthetics.
  *   **Follow-up:** "Can you think of a moment where understanding the philosophical conflict actually *ruined* the enjoyment? Is there such a thing as knowing too much about the 'morality system' while listening to a love duet?"

  ### 10. Falsification (Required Closing)
  **Question:** To close, I want to ask about the limits of the theory. Philosophical accounts of art often become so flexible that they explain everything and therefore explain nothing. What kind of operatic case would actually count as evidence *against* Williams's picture, rather than simply serving as one more illustration of it?

  *   **Anticipated Answer:** She might suggest an opera where the music and drama are completely disjointed without artistic intent, or a work where the "sung" nature actively prevents emotional engagement rather than enhancing it.
  *   **Follow-up:** "If we found that opera, would we say the opera failed, or that Williams's theory failed? I'd love to know which one you're more willing to sacrifice."
