  **SCENE START**

  **INT. WEDDING RECEPTION - NIGHT**

  The band is butchering a Top 40 hit. MARK (35, hedge fund, suit without a tie) and DAVID (35, State Department, suit with a tie that's slightly too loose) lean against the bar, watching the newlyweds attempt the electric slide.

  MARK
  Look at them. Textbook Cooperate-Cooperate. Naive. They're assuming an infinite horizon without pricing in the discount rate.

  DAVID
  It's a wedding, Mark. Not a merger. Besides, you're assuming the payoff matrix is static. It's not. It evolves.

  MARK
  (Swirls his scotch)
  That's your problem. You think evolution favors the adaptable. It favors the ruthless. Take your Iran portfolio. You play "Reasonable Diplomat" every single time.

  DAVID
  Because it works. Against a Hardliner, Reasonable de-escalates. Against a Reformer, Reasonable builds trust. It's not dominated. I checked.

  MARK
  It's not dominated by a *pure* strategy. That's the undergrad mistake, Dave. You look at the matrix and say, "Hey, Reasonable beats Hardline, and it beats Softline. I'm safe."

  DAVID
  Because I am safe.

  MARK
  No. You're just not looking at the mixed strategies. Reasonable gets you a payoff of two, maybe three, across the board. It's consistent. But it's strictly dominated by a fifty-fifty mix of "Scorched Earth" and "Gift Basket."

  David turns, actually interested despite himself.

  DAVID
  You're saying I should randomize between sanctions and bribes?

  MARK
  I'm saying your "Reasonable" is the middle row in a three-by-three where the top and bottom rows, combined probabilistically, yield a higher expected utility in *every* column. You're getting out-optimized by variance. You think consistency is a virtue? In game theory, consistency is a leak.

  DAVID
  (A small smile)
  That's cute. Really. But you're forgetting the cost of mixing.

  MARK
  Transaction costs?

  DAVID
  Credibility. If I play a mixed strategy, I'm not just optimizing payoffs; I'm degrading my signal. Your "Scorched Earth/Gift Basket" mix might dominate my "Reasonable" on paper, but only if the other player doesn't update their priors on my stability. Once they realize I'm randomizing, the game changes. The matrix dissolves.

  MARK
  So you're saying the Iterated Elimination stops early because of reputation effects?

  DAVID
  I'm saying you can't eliminate a strategy if the elimination process itself alters the payoffs of the remaining strategies. You're playing a one-shot game in your head. I'm playing the infinite repeat.

  Mark stares at him for a beat, then clinks his glass against David's.

  MARK
  Touché. But admit it. Your "Reasonable" strategy is still dominated by my bonus last year.

  DAVID
  (Drains his wine)
  Only if you adjust for the probability of prison. Which, given your leverage ratios, is a non-zero column.

  **SCENE END**
