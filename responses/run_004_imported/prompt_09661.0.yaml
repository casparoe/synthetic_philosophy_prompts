          *   *Key Insight:* An LLM can generate a perfect Formal explanation of a Functional failure.

      *   **Section 2: The "Rationalization" Problem (The Core Risk):**
          *   Explain that LLMs predict tokens. They predict the *explanation* tokens just like the *code* tokens.
          *   The explanation is often post-hoc rationalization. It matches the code because both are statistically likely to appear together, not because the explanation *caused* the code.
          *   *Analogy:* A compiler error message vs. a programmer's comment. LLMs are more like a very fancy error message generator that sometimes writes code.

      *   **Section 3: Practical Implications for the Software Engineer:**
          *   *Verification:* Don't trust the explanation to verify the code. Trust tests, type checkers, and your own review.
          *   *Debugging:* The explanation can be a hint, but verify the hint.
          *   *Documentation:* The explanation is good for *human* onboarding (Formal competence helps communication), even if the *model* didn't reason it out functionally.
          *   *Confidence Calibration:* High fluency $\neq$ High correctness.

      *   **Section 4: When is the Explanation Useful? (Nuance):**
