      *   **Section 5: Actionable Heuristics (The "Takeaway"):**
          *   Treat explanations as *claims*, not *proofs*.
          *   Decouple generation from explanation (ask it to explain *after*, or ask for the plan *before*).
          *   Use the explanation to prompt *your* reasoning, not replace it.

      *   **Conclusion:** Summarize. The framework suggests skepticism. The model is a fluent speaker, not necessarily a thinker.

