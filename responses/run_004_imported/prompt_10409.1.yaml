      Security: "This has a SQL injection." (Technical fact).
      Ethics: "This undermines autonomy." (Interpretive claim).
      *Key argument:* We can verify the law/tech. We can't verify the ethics without the reasoning. Therefore, the reasoning is the deliverable, not just the verdict.

  7.  **Finalizing the Memo Structure:**
      *   Subject: Protocol for External Ethics Advisory Verdicts.
      *   Context: Recent split on the notification feature.
      *   Analysis: Why the Legal/Security analogy is imperfect.
      *   Policy: The "Principle Mapping" Requirement.
      *   Implementation: 3 steps.
      *   Conclusion.

  8.  (Drafting content based on the above thought process.) *Ensure the tone is collaborative but firm on governance.* *Make sure to explicitly validate the Deference Camp's point about efficiency.*

