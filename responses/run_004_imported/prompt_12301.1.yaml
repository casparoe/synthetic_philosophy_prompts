  "Hobbes argues geometry is the only certain science because it's based on 'maker's knowledge'—we construct the objects ourselves, so we know their causes. But his 30-year war with Wallis over squaring the circle basically proves the inverse: if you're wrong about the properties, you didn't make the object. So by Hobbes's own standards, he wasn't failing at geometry; he was accidentally doing natural philosophy—just another guy in the state of nature, guessing at the causes of a circle he had no control over."

  **Why this works for your seminar:**
  *   **It uses his own criterion:** It leverages the "Maker's Knowledge" thesis (certainty comes from construction) as the premise for the punchline.
  *   **It hits the specific distinction:** It contrasts *geometry* (construction/certainty) with *natural philosophy* (observation/guessing), which is the exact distinction your professor is highlighting.
  *   **The "State of Nature" callback:** It subtly ties his epistemology back to his political philosophy (the state of nature), which shows you're seeing the connections across his work.
