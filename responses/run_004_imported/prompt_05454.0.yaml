answer: |-
  It is a genuine pleasure to engage with a question posed by someone who has spent a career distinguishing between what can be measured and what cannot. Your transition from the laboratory to the reading group mirrors, in a sense, Wittgenstein's own journey from the rigid engineering of the *Tractatus* to the fluid topography of the *Investigations*.

  To answer your central question directly: **No, the two treatments do not express the same underlying position.** While there is a superficial continuity in his rejection of evidentialism (the Father O'Hara point), there is a profound structural discontinuity between the early and late views. The *Tractatus* relegates religious language to *silence* because it fails to be language at all; the later lectures rehabilitate religious language as *meaningful* because it succeeds at being a specific kind of language.

  Consequently, the claim from the *Lectures on Religious Belief*—that a believer and a non-believer need not be contradicting one another—goes well beyond anything the *Tractatus* could have licensed. In the early work, there is no contradiction because there is no proposition; in the later work, there is no contradiction because there are two different grammars.

  Here is the justification for this reading, structured by the shift in Wittgenstein's conception of language itself.

  ### 1. The *Tractatus*: Monism and the Limit
  In the *Tractatus*, Wittgenstein operates with a **monistic** theory of language. There is one essence of language: the proposition that pictures a state of affairs in the world. This is the "Picture Theory." Any string of words that does not picture a possible state of affairs is, strictly speaking, *nonsense* (*Unsinn*).

  *   **The Status of Religion:** Ethical and religious propositions attempt to speak about values or the "meaning of the world." Since values are not facts *in* the world, these propositions fail to picture anything. They try to say what can only be *shown*.
  *   **The Consequence:** The correct philosophical method regarding religion is therapeutic silence. We recognize that the believer is trying to express something profound, but we must acknowledge they are banging against the limits of language.
  *   **The "Contradiction" Issue:** If a believer says "God exists" and a non-believer says "God does not exist," the *Tractatus* view implies that **neither is asserting a truth-apt proposition.** They are both producing nonsense. Therefore, they are not contradicting each other, but only because they are both effectively silent. The "no contradiction" here is deflationary; it dismisses the discourse entirely from the realm of sense.

  For a physicist, you might think of this as a single, rigorous formal system. Any equation that does not resolve to a physical observable is not just "untested"; it is ill-formed.

  ### 2. The Later Work: Pluralism and the Game
  By the time of the *Lectures on Religious Belief* (1938), Wittgenstein has abandoned the idea that language has one essence. He replaces it with **language-games** and **forms of life**. Meaning is no longer reference (picturing facts); meaning is *use*.

  *   **The Status of Religion:** Religious language is a distinct language-game with its own rules (grammar). It is not a failed attempt at science; it is a successful attempt at something else. When a believer speaks of the "Last Judgment," they are not offering a hypothesis about a future cosmic event that could be verified by a telescope. They are expressing an orientation toward life, a regulatory principle for conduct.
  *   **The Consequence:** We do not need to be silent about religion. We can describe its grammar. We can observe how the concept functions within the "form of life" of the believer. This is the "anthropological" turn you noted.
  *   **The "Contradiction" Issue:** When the believer says "God exists" and the non-believer says "God does not exist," they are using the same words but playing different games. The believer is using "God" within a grammar of trust, judgment, and redemption. The non-believer (specifically one treating it as a scientific hypothesis) is using "God" within a grammar of empirical existence. Because the *rules of verification* and the *role of the concept* differ, the two statements do not collide. They slide past one another.

  ### 3. Why the "No Contradiction" Claim Requires the Later View
  This is the crux of your inquiry. Could the *Tractatus* license the idea that the believer and non-believer are not contradicting?

  **No.** In the *Tractatus*, the lack of contradiction is a result of **logical failure**. The religious statement is excluded from the domain of sense. Wittgenstein would say, "You cannot contradict because you have not said anything."

  In the *Lectures*, the lack of contradiction is a result of **grammatical difference**. Wittgenstein says, in effect, "You have both said something meaningful, but the meaning is determined by the system in which you are operating." This validates the religious discourse as a coherent human practice, whereas the *Tractatus* validates only the *feeling* behind it while rejecting the *speech*.

  The later view allows for a **positive description** of religious discourse. Wittgenstein can analyze the "risk" involved in belief, the "pictures" that hold the believer captive, and the way evidence is treated differently. The *Tractatus* forbids this analysis because it treats all philosophical talk about ethics/religion as an attempt to transcend the limits of language, which is impossible. The later Wittgenstein brings ethics and religion back *inside* the limits of language, not as facts, but as practices.

  ### 4. The Father O'Hara Point: Continuity with a Different Foundation
  You noted that Wittgenstein is unimpressed by Father O'Hara's evidential defense in both periods. This is the source of the illusion of continuity.
  *   **In the *Tractatus*:** Evidence is irrelevant because religious claims are not about the world of facts. Evidence belongs to natural science; religion belongs to the mystical.
  *   **In the *Lectures*:** Evidence is irrelevant because religious claims are not hypotheses. To ask for evidence is to misunderstand the grammar of "belief" in this context. It is a category mistake.

  While the conclusion (evidentialism is wrong) is the same, the justification shifts from **metaphysical demarcation** (Science vs. The Mystical) to **grammatical description** (Science-Game vs. Religion-Game).

  ### Conclusion: From Silence to Description
  As a physicist, you are likely familiar with the shift from classical mechanics to quantum mechanics, where the rules of the game change depending on the scale of observation. Wittgenstein's shift is analogous.

  In the *Tractatus*, there is one scale (the factual), and religion is out of focus. Silence is the only honest response.
  In the *Lectures*, there are multiple scales (language-games), and religion is in focus within its own frame. Description is possible.

  Therefore, the "no genuine contradiction" idea is **not** a natural extension of the earlier silence. It is a correction of it. The *Tractatus* silences the believer to protect the purity of logic. The later Wittgenstein listens to the believer to understand the complexity of human life. The later view grants religious discourse an autonomy and a validity that the *Tractatus* explicitly denied it. The shift is from viewing religious language as a **failed description of reality** to viewing it as a **successful expression of a form of life**.

  You are justified, then, in seeing a substantial change. The *Tractatus* tells us we cannot speak of God; the *Lectures* tell us we can, provided we understand the grammar we are using.
