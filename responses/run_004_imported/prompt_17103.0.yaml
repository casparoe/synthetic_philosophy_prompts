          *   Mental States: Regress/Interpretation problem.
          *   Key point: A fact must *justify* future use, not just predict it.
      *   **3. Assertability Conditions vs. Error Theory:**
          *   Error Theory: "X means Y" is always false (because no fact).
          *   Skeptical Solution: "X means Y" is not in the business of stating facts. It's moves in a language game.
          *   The Community View: Justification comes from agreement with others, not correspondence to a private fact.
          *   Why this avoids error theory: It preserves the *utility* and *legitimacy* of the discourse without the metaphysical baggage.
      *   **4. Boghossian's Stability Objection:**
