answer: |-
  **Setting:** *The dimly quiet corner of a hotel bar, two floors down from the conference halls. It's 11:30 PM on the second night of the Evolution & Philosophy joint meeting. Empty glasses and a scattering of napkins covered in scribbled equations sit between ALEX (40s, sharp suit, kin-selection advocate) and JAMIE (30s, worn blazer, multilevel selectionist).*

  **Alex:** Look, I liked your talk. Really. The math was clean. But you know your advisor is going to eviscerate you on the Q&A tomorrow if you stick to this story about the *Formica* ants.

  **Jamie:** Because I said the colony is the unit?

  **Alex:** Because you implied the colony is the *cause*. The Trivers-Hare prediction is a slam dunk for kin selection. Haplodiploidy. Workers are related to sisters by 0.75, to brothers by 0.25. The gene's-eye view explains the 3:1 female-biased investment ratio in one breath. The gene in the worker manipulates the colony to maximize copies of itself. Why complicate the ontology?

  **Jamie:** It's not about complicating ontology, Alex. It's about causal structure. You're describing the *outcome* using genetic correlations. I'm describing the *process* using hierarchical selection. In the ant case, the variance in sex ratio is almost entirely *between* colonies. Within a colony, the workers are coerced into agreement. They don't squabble over male production; the queen or the policing mechanism suppresses that variance.

  **Alex:** And that policing mechanism is driven by genes that spread because of relatedness! You're just pushing the explanation back one step. If you write out the Price Equation, your "between-group" covariance term is mathematically identical to Hamilton's $rb$. It's an identity. You can partition the variance however you like, but that doesn't mean the group is "selecting." It just means you've chosen to group the individuals in a way that makes the between-group covariance term non-zero.

  **Jamie:** Okay, let's look at the Price Equation then. $\Delta \bar{z} = E[Cov(w_{ij}, z_{ij})] + Cov(W_j, Z_j)$. Within-group and between-group components. You're saying the second term is just a phantom?

  **Alex:** I'm saying it's bookkeeping. If I take the same population and arbitrarily assign individuals to groups, I can generate a between-group covariance. To make group selection real, you need more than a non-zero covariance term. You need to show that the group trait causes the fitness difference *independently* of the individual traits. But in the ant case, the "group trait" (sex ratio) is just the aggregate of individual behaviors driven by individual genotypes.

  **Jamie:** But the aggregation isn't arbitrary. That's the point Sober and I keep making. The colony has a functional organization that *creates* the variance structure. The policing isn't just individuals acting; it's a system that suppresses within-group selection so that between-group selection can dominate. When you use the kin selection view, you treat the relatedness as a parameter that magically aligns interests. When I use MLS, I show *how* the interests are aligned by the suppression of lower-level fitness variance.

  **Alex:** But that "how" is still explained by the spread of alleles for policing! If a worker gene arises that says "I'm going to lay my own males," it spreads unless the cost is too high relative to the benefit to sisters. That's $rb > c$. Your between-group covariance is just Hamilton's Rule wearing a group-selection costume. It's empirically equivalent, but it's heuristically dangerous. It makes people think "the group wants to survive," which is teleological nonsense.

  **Jamie:** It's not teleological if the group satisfies the Darwinian criteria: variation, heredity, fitness differences. Colonies vary in sex ratios. Successful colonies found new colonies (heredity). Colonies with optimal ratios outcompete others (fitness). Why is that not genuine selection? Just because you can *also* model it as gene frequency change doesn't mean the higher-level process isn't happening. A computer simulation runs on electron flow in transistors, but that doesn't mean the software level isn't real.

  **Alex:** Nice analogy, but in the computer, the software level is designed. In evolution, we're asking what *does* the designing. The gene is the replicator. The colony is a vehicle. Vehicles don't replicate; they're built by replicators. When you say the colony is selected, you're conflating the fitness of the vehicle with the fitness of the replicator. In the ant case, the gene is the only thing getting copied faithfully across generations. The colony dissolves every year.

  **Jamie:** Not all colonies dissolve, and even if they do, they bud or swarm. There's lineage. But here's where your "bookkeeping" charge fails. If it were just bookkeeping, the two approaches would always offer the same insight. They don't. In cases where within-group conflict is high, your kin selection model gets messy—you have to invent complex coefficients of relatedness for every pairwise interaction. My MLS model just shows the suppression of within-group variance. It highlights the *evolutionary transition* itself. It explains how individuals became a group in the first place.

  **Alex:** But in the specific case of the sex ratio—the one you used in your talk—the kin selection model predicted the 3:1 ratio decades before the MLS models became sophisticated. Trivers and Hare got it right using relatedness. If I'm a field biologist, which model do I use? The one that tells me to measure relatedness, or the one that tells me to measure group variance?

  **Jamie:** You measure both, because they're the same data! But the interpretation matters for the next step. If you think it's just genes, you look for the "sex ratio gene." If you think it's multilevel, you look for the mechanisms of colony-level regulation, like pheromonal policing or queen dominance. You might miss the causal mechanism if you're obsessed with the gene's-eye view.

  **Alex:** I'm not obsessed with ignoring mechanisms. I'm obsessed with not reifying groups. When you say "group selection," people hear "for the good of the species." I'm trying to prevent that error. If the math is equivalent, we should choose the framework that minimizes the risk of adaptationist storytelling at the wrong level.

  **Jamie:** And I'm arguing that minimizing storytelling risk shouldn't mean blinding yourself to hierarchical causality. Sometimes the group *is* the bottleneck. In the ant case, the colony is the bottleneck for reproduction. If the math is equivalent, then the choice is pragmatic. But pragmatics include explanation, not just prediction. Explaining *why* the within-group variance is low requires acknowledging the group structure as a causal force suppressing the lower level.

  **Alex:** *Sighs, swirling the ice in his glass.* So we're back to the equivalence thesis. You admit the predictions are the same.

  **Jamie:** The predictions for the equilibrium sex ratio are the same. The predictions for *how the system responds to perturbation* might not be. If you disrupt the colony structure but keep relatedness high, does the ratio hold?

  **Alex:** If you disrupt the colony structure, you've changed the costs and benefits in Hamilton's Rule. $c$ goes up.

  **Jamie:** Or, the between-group variance collapses. See? We're saying the same thing in different languages.

  **Alex:** Exactly. So why fight?

  **Jamie:** Because language shapes thought. If you teach students that everything is genes, they stop looking for emergent properties. If I teach them everything is groups, they stop looking for mechanisms. But right now, the field tilts too hard your way. It treats MLS as a historical curiosity, a "zygote" of an idea that was subsumed by kin selection. I'm arguing it's a co-equal framework.

  **Alex:** It's not co-equal if one is fundamental and the other is derivative.

  **Jamie:** Derivative mathematically, maybe. But not causally. Look, let's agree on this: The Price Equation partitions the change. You prefer to interpret the covariance as genetic correlation. I prefer to interpret it as hierarchical selection. In the ant case, the data fits both.

  **Alex:** In the ant case. In other cases—like altruism between non-relatives—your between-group term requires assumptions about assortment that look a lot like... relatedness.

  **Jamie:** *Smiles.* Assortment. A nice neutral word.

  **Alex:** Don't start.

  **Jamie:** I'm just saying. Tomorrow, when your advisor asks me why I'm not using Hamilton's Rule, I'm going to tell him that Hamilton's Rule is the special case where the group structure is defined by genealogy. But group structure isn't always genealogy.

  **Alex:** And I'll be in the front row asking you to show me the replicator at the group level.

  **Jamie:** And I'll show you the colony lineage.

  **Alex:** *Finishes his drink.* We're going to be arguing about this for another thirty years, aren't we?

  **Jamie:** Probably. But at least the math is solid.

  **Alex:** The math is the only thing we agree on.

  **Jamie:** *Raises glass.* To the covariance.

  **Alex:** *Clinks glass.* To the variance.
