      *   Is it oversold? Slightly. Aquinas *does* allow for removal, and in some contexts, lethal force is implied if it's a public act. But the "private citizen assassination" meme is definitely wrong. The draft acknowledges the nuance ("he's not fully consistent with himself").
      *   *Verdict:* The framing works for a newsletter. It invites the reader in.

