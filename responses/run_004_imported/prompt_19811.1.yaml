answer: |-
  This is excellent. You have done the work most commentators skip, and it shows. You aren't just recycling the Stanford Encyclopedia entry; you've actually grappled with the tension between the texts.

  Here is the breakdown based on your three criteria, followed by specific notes on the distinction and John of Salisbury.

  ### 1. Substance Check: Will a specialist wince?
  **No.** You have nailed the crucial distinction between *private* action and *public* authority. That is the hinge the entire debate turns on, and you've placed it front and center.
  *   **The *De Regno* caveat:** You specify Book I, which is smart. Book II is often attributed to his student Ptolemy of Lucca, who was much more republican and pro-tyrannicide than Thomas. By sticking to Book I, you avoid the authorship trap.
  *   **The *Sentences* nuance:** You are correct that the *Commentary on the Sentences* (an early work) is more permissive than the mature *Summa* or *De Regno*. Framing it as "not fully consistent" is acceptable for a general audience, though a pedant might prefer "his thinking evolved toward greater caution." (More on this below).
  *   **The "Pray and Endure" bit:** Accurate. Aquinas does argue that if there is no human recourse, one must have recourse to God.

  **Verdict:** You are on solid ground. No major wincing expected.

  ### 2. The "Myth vs. Reality" Framing: Is it earned?
  **Yes.** The popular meme is usually: "Aquinas said tyrannicide is okay."
  The reality is: "Aquinas said a *public authority* might *depose* a *usurper*, but a *private citizen* should generally *endure* a *legitimate* tyrant."
  That is a massive gap. You aren't splitting hairs; you are correcting a category error. The framing works because the popular usage ignores the *who* (private vs. public) and the *what* (usurper vs. legitimate ruler).

  ### 3. Accessibility: Homework or Newsletter?
  **It lands.** Phrases like "nerd-sniped," "buttoned-up theologian," and "boringly procedural" do heavy lifting to keep the tone conversational. You avoid Latin terms (*tyrannus ex defectu tituli*) which is the right call. It reads like a smart journalist explaining a discovery, not a lecture.

  ---

  ### Specific Answers to Your Questions

  **Q: Does the usurper/tyrant-by-conduct distinction hold up?**
  **A:** Yes, but tighten the verb.
  You write: *"he's not fully consistent with himself."*
  **Critique:** "Inconsistent" suggests sloppiness. Scholastics hate inconsistency. It's more accurate to say his thought *developed* or that the texts address *different scenarios*. The *Sentences* is early (1250s); *De Regno* and *Summa* are mature (1260s/70s). He didn't necessarily contradict himself; he refined the conditions under which resistance is licit.
  **Suggestion:** Change "But he's not fully consistent with himself" to **"But the picture isn't monolithic."** or **"But there is a tension in his corpus."** This protects you from the "Aquinas was a systematic thinker!" crowd while keeping your point.

  **Q: John of Salisbury -- worth a paragraph?**
  **A:** **No.** Do not overload the piece.
  John of Salisbury (*Policraticus*) is the firebrand; Aquinas is the brake pedal. If you add a paragraph on John, the piece becomes "Medieval Theories of Tyrannicide" rather than "What Aquinas Actually Said."
  **Suggestion:** If you feel the need to contextualize, do it in one sentence. E.g., *"Unlike his predecessor John of Salisbury, who famously gave tyrannicide a theological green light, Aquinas treats it as a last resort fraught with danger."* Keep the spotlight on Thomas.

  ---

  ### Line-Level Nitpicks (Since you said don't be polite)

  > *"Ask around and you'll hear, with real confidence, that Thomas Aquinas..."*

  **Cut "with real confidence."** It's filler. "Ask around and you'll hear that Thomas Aquinas..." is punchier.

  > *"The trouble is that if you actually go to the texts, this is close to backwards."*

  **Strong.** Keep.

  > *"His worry is basically institutional..."*

  **Great phrasing.** It translates scholastic natural law into modern political science terms instantly.

  > *"if 'somebody decided the king was a tyrant' becomes license to assassinate, you haven't found a check on tyranny, you've just made every king's life depend on the goodwill of whoever is strongest and angriest..."*

  **This is the money quote.** Do not touch this. It explains the *reasoning* better than most textbooks.

  > *"That's the cautious Aquinas, the one people skip."*

  **Slight tweak:** "That's the cautious Aquinas, the one the meme ignores." (Matches your opening hook better).

  > *"I suspect it's doing most of the work in making people think Aquinas is more permissive than he actually is..."*

  **Tighten:** "I suspect this distinction is what fuels the meme: it's roughly true of usurpers, and false of the ordinary case..."

  ### One "Gotcha" to Prepare For
  Since you are publishing this online: Be ready for a commenter to bring up **Ptolemy of Lucca**.
  As mentioned, *De Regno* Book II is widely considered to be Ptolemy's work, and Ptolemy *is* pro-tyrannicide. Since you specify Book I in the text, you are safe, but if you want to bulletproof it, you could add a tiny parenthetical: *"(On Kingship, Book I—the section scholars attribute to Aquinas himself)..."*
  *Decision:* Probably too clunky for a newsletter. Since you already specified Book I, you've done enough due diligence. If a pedant shows up, you can handle it in the comments.

  ### Final Verdict
  This is ready to go. It respects the source material, respects the reader's intelligence, and kills a zombie idea without being boring. Publish it.
