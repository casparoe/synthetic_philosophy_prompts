      *   **Framing:** Earned. The "private citizen" angle is the smoking gun.
      *   **Accessibility:** Very good. No jargon bloat.
      *   **John of Salisbury:** Keep it brief. One sentence contrast is enough to show Aquinas was the *restraint* in the tradition, not the firebrand.
      *   **Tone:** Keep the "nerd-sniped" energy.

  8.  **Refining the Advice:**
      *   *Correction on Sentences:* Make sure the user knows the *Sentences* commentary is early. Aquinas matures. The "inconsistency" is often framed as development.
      *   *Summa Nuance:* In *Summa* II-II Q.42 A.2, he says sedition is sinful *unless* the tyrant is seditious first. He doesn't explicitly command killing there, but he justifies resistance. The draft says "sedition question," which is accurate enough.
      *   *De Regno Authorship:* A specialist *might* nitpick that *On Kingship* (De Regno) was unfinished and possibly completed by Ptolemy of Lucca (who was more pro-tyrannicide). However, Book I is generally accepted as Aquinas. The user specifies Book I, so they are safe. I should mention this as a "watch out" footnote possibility.
      *   *John of Salisbury:* If the piece is about the *meme* of Aquinas, John distracts. If it's about *medieval political theory*, John helps. I'd lean towards keeping the focus tight on Aquinas to answer the specific meme.

