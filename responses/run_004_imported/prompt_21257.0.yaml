      *   **The EU Advocate (Samuelson):** Let's call her "Sarah." She should focus on the axiomatic foundation of rationality, the definition of expectation, and the fact that growth optimization is a *choice*, not a law of nature. She represents the Samuelson/Merton perspective.
      *   **Setting:** A quiet corner of a club or a home study with a card table. Let's go with a home study, late evening. Cards on the table, but not really playing.

