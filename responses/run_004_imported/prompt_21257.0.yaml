      *   **Key Conflict:** Kelly side says dynamics force log-utility (no subjective preference needed). EU side says log-utility is a specific preference, not a physical necessity, and "almost surely" $\neq$ "expected value."
      *   **Format:** Dialogue between two sharp advocates (no strawmen).
