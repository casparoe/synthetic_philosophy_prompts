answer: |-
  The study is dim, lit only by a green banker's lamp hanging over a felt-covered card table. Two empty whiskey glasses sit near the chip tray. **Elias** (silver hair, sleeves rolled up) shuffles a deck with mechanical precision. **Sarah** (sharp eyes, leaning back in her leather chair) watches the chips stacked between them.

  **Elias:** Fifty-fifty coin. Heads, you gain fifty percent of your stack. Tails, you lose forty percent. We play it once. Do you bet?

  **Sarah:** If the utility of money is linear, obviously. The expected value is positive. Half the time I multiply by 1.5, half the time by 0.6. The arithmetic mean is 1.05. I gain five percent in expectation.

  **Elias:** We play it a thousand times. Same rule. All-in every time. Do you bet?

  **Sarah:** If I'm forced to bet all-in every time? Then no. Because $1.5 \times 0.6 = 0.9$. I'll bleed to zero.

  **Elias:** Exactly. The ensemble average says you get rich. The time average says you go bust. The system is non-ergodic. The average across parallel universes is not the average across time for a single agent.

  **Sarah:** *(Taps a chip)* And here we are again. You're smuggling in a utility function through the back door, Elias. You're saying "maximize the time-average growth rate," which is mathematically equivalent to maximizing the expected value of the logarithm of wealth. But that *is* a utility function. It's log-utility. You haven't escaped subjective preference; you've just hardcoded it into the dynamics.

  **Elias:** I haven't hardcoded anything. I've looked at the physics of the trajectory. In standard economics, you treat wealth like a state function in equilibrium thermodynamics. It's not. It's a stochastic process with an absorbing barrier at zero. If you hit zero, you don't get to participate in the ensemble average anymore. The "expected value" is calculated over paths that, for me, physically cease to exist.

  **Sarah:** But "almost surely" is not "always." Samuelson nailed this. In his paper with the one-syllable words, he showed that maximizing the geometric mean—your growth rate—does not maximize expected utility for any *finite* number of bets. It only dominates asymptotically. If I have a finite horizon, and my utility is linear, I should bet more than Kelly. If my utility is convex, I should bet even more. Why should the dynamics dictate my risk tolerance?

  **Elias:** Because the dynamics dictate your survival. Look at the chips. If you bet according to linear utility—maximizing arithmetic expectation—you bet full bankroll. You will go to zero. What is the utility of zero?

  **Sarah:** Zero, presumably. But there's a non-zero probability path where I win every toss. On that path, my wealth is astronomical. When I calculate the *expectation*, that astronomical path pulls the average up, even if its probability is vanishingly small. You're saying I should ignore those tails because they're unlikely. I'm saying rationality requires I weigh them by their probability. If I value that one-in-a-billion outcome enough, I take the bet.

  **Elias:** That's the fallacy. You're averaging over ghosts. You, Sarah, the physical person sitting in that chair, will experience *one* trajectory. You won't experience the ensemble. In 99.9% of the trajectories, you're destitute. In 0.1%, you're a god. The expected value is a weighted average of a god and a pauper. But you can't be a weighted average. You're either one or the other. Ergodicity economics says: stop optimizing for the ghost in the parallel universe and optimize for the person in this chair.

  **Sarah:** But "optimize" implies a goal. What is the goal? If my goal is to buy a house in five years, I need a specific sum. If Kelly betting gets me there with 90% probability but leaves me short in the other 10%, while a higher-variance strategy gets me there with 80% probability but gives me double the house in the win case... which is rational? You can't answer that without a utility function. The growth rate tells me how fast the stack grows, not how much I *care* about the stack.

  **Elias:** It tells you what the system *allows*. Think of it like entropy. You can posit whatever utility you want, but if your strategy violates the second law, you don't get to play. Compounding is multiplicative. The logarithm isn't a preference; it's the natural measure of multiplicative distance. If you ignore the geometric mean, you are effectively fighting the math of compounding. You're trying to drive a car by looking at the speedometer while ignoring the fuel gauge.

  **Sarah:** *(Leans forward)* Let's grant you the physics. Wealth compounds. Trajectories matter. Absorption is real. But why *log*? Why not a power law? If I'm a billionaire, losing 40% of my stack is annoying. If I'm a student, it's ruinous. The "correct" fraction to bet depends on my marginal utility of wealth, which is subjective. Peters and the ergodicity crowd act as if they've discovered a law of nature that replaces von Neumann-Morgenstern. They haven't. They've just derived the optimal strategy for an agent who cares *only* about long-run growth rate. But why should I care only about that?

  **Elias:** Because in the long run, the growth rate *is* the utility. If you maximize expected value with linear utility, your wealth distribution becomes infinitely wide, but the median goes to zero. The "average" wealth is infinite, but the "typical" wealth is zero. If you live long enough, any deviation from the optimal growth rate results in underperformance relative to the market almost surely. It's not about preference; it's about being outcompeted.

  **Sarah:** That's an evolutionary argument, not a rationality argument. "If you don't bet Kelly, you'll go broke and be removed from the population." Fine. But that assumes the goal is survival of the capital itself. What if the goal is consumption? I might want to maximize the expected value of my consumption stream, even if it risks ruin. I might prefer a 10% chance of a feast and a 90% chance of starvation over a 100% chance of gruel. You call that irrational. I call that a preference.

  **Elias:** I call it a misunderstanding of probability. You're treating probability as a measure of belief, or a measure of frequency across an ensemble. I'm treating it as a measure of time. The probability of heads is the fraction of time heads occurs in the long limit. When you say "10% chance of a feast," you're invoking the ensemble. But you only live once. The time-average utility of your "feast or starvation" plan is starvation.

  **Sarah:** But that assumes "long run." Keynes said, "In the long run we are all dead." If I have a finite horizon, the arithmetic mean matters more than the geometric mean. Samuelson proved that for any finite $N$, there is no utility function for which maximizing the geometric mean is always optimal. You need the horizon to go to infinity for your argument to hold water.

  **Elias:** But the world is ongoing. Bets aren't isolated. If you retire, your wealth still compounds. The horizon *is* effectively infinite if you care about legacy, or at least indefinite. And even for finite horizons, the "drawdown risk" of the EV-maximizing strategy is catastrophic. You might end up with higher *expected* wealth, but the probability of ending up below your starting point approaches one as $N$ increases. Is it rational to accept a near-certainty of loss for a vanishingly small chance of infinite gain?

  **Sarah:** Yes, if the utility of that infinite gain is high enough. Look, Elias, I respect the math. The distinction between ensemble and time averages is crucial. It fixes a lot of sloppy thinking in economics. But you can't derive an "ought" from an "is." You can't derive a utility function from a stochastic differential equation. The equation tells you where the ball goes. It doesn't tell you why you're playing the game.

  **Elias:** *(Stops shuffling. Holds the deck.)* Suppose I offer you this: We play the 50/50 game. +50% / -40%. But I let you choose the fraction of your bankroll to bet each time. You can bet 100%, or you can bet the Kelly fraction, which is 25%. If you bet 100%, your expected wealth after 100 rounds is huge. $1.05^{100}$. If you bet Kelly, your expected wealth is lower, but your median wealth is maximized. Which do you choose?

  **Sarah:** I need to know what I'm buying with the money. If I need \$10 million to save a life, and Kelly only gets me to \$5 million median, but full-betting gives me a 1-in-1000 shot at \$100 million... I take the 1-in-1000 shot. The dynamics don't decide that. My values do.

  **Elias:** And if you need the money to eat tomorrow?

  **Sarah:** Then my utility function is highly concave near zero. Which looks like log utility! But that's *my* utility function, derived from *my* needs. You're claiming the log comes from the coin toss. I'm saying the log comes from me. The coin toss just tells me the odds.

  **Elias:** But the coin toss dictates the *rate of ruin*. If you ignore the geometric mean, you are ignoring the friction of reality. It's like saying, "I don't care about air resistance, I just care about the initial velocity." Eventually, air resistance wins. The log isn't a preference; it's the metric of the space you're moving through. If you try to move in a straight line in curved space, you'll get lost.

  **Sarah:** *(Smiles faintly)* Curved space. There's the physicist. Look, I'll concede this: For an agent who wants to remain in the game indefinitely, and whose utility scales with wealth without a specific target, Kelly is the dominant strategy. It's the only strategy that avoids ruin while maximizing growth. But that's a specific case. It's not a universal theory of rationality. It's a specific solution for a specific utility class: infinite horizon, no consumption, risk of ruin.

  **Elias:** And I'll concede this: If you have a specific liability or a finite horizon, the "optimal" fraction shifts. But the *reason* it shifts is that the dynamics have changed. You've introduced an absorbing barrier at a non-zero value (your liability). The ergodic argument still holds; you just changed the boundary conditions. You still can't just maximize arithmetic expectation without accounting for the path.

  **Sarah:** So we agree that arithmetic expectation is dangerous for repeated bets?

  **Elias:** Dangerous is an understatement. It's a mirage.

  **Sarah:** And we agree that utility functions are necessary to define "optimal" when horizons are finite or liabilities exist?

  **Elias:** I'd say the boundary conditions define the optimal. But yes, "utility" is the language economists use for boundary conditions.

  **Sarah:** *(Picks up a chip, flips it)* Then the disagreement is semantic. You think the dynamics force the utility. I think the utility selects the dynamics we care about.

  **Elias:** *(Deals two cards, face down)* Semantics determine whether you bet the farm or not.

  **Sarah:** *(Looks at her card, doesn't turn it)* Or whether you realize the house always has an edge, regardless of the betting strategy.

  **Elias:** *(Turns his card. It's an Ace.)* Not if you count the cards.

  **Sarah:** *(Turns hers. A King.)* Not if the deck is stacked.

  *They sit for a moment, the cards on the felt between them. The lamp hums.*

  **Elias:** Whiskey?

  **Sarah:** Please. I think I've lost enough expected utility for one night.

  **Elias:** *(Pouring)* Don't worry. In the time average, we're both still here.

  **Sarah:** For now. Cheers to the ensemble.

  **Elias:** Cheers to the trajectory.

  *They clink glasses. The sound is sharp, singular, and does not average out.*
