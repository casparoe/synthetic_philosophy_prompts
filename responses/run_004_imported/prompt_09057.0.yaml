      *   **Task:** Evaluate whether Kim's containment strategy works. Is singling out qualia principled? Or does the exclusion argument prove too much (eliminating special science causation) or need abandonment (e.g., denying no-overdetermination)?
      *   **Requirement:** Weigh strongest moves on both sides but land on a *definite verdict* (no wishy-washiness).

  2.  **Deconstruct Kim's Argument:**
      *   *Premise 1 (Supervenience):* Mental properties supervene on physical properties.
      *   *Premise 2 (Causal Closure):* Every physical event has a sufficient physical cause.
      *   *Premise 3 (Exclusion/No Overdetermination):* No event can have more than one sufficient cause (unless it's genuine overdetermination).
      *   *Conclusion:* If the physical cause is sufficient, the mental cause is excluded.
      *   *Kim's Solution:* Functional Reduction. If $M$ is defined by its causal role, and $P$ fills that role, then $M$ is realized by $P$. Causation is preserved *at the physical level*.
