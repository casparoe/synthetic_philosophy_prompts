answer: |-
  This is an excellent question that cuts to the heart of Augustine's moral theology. You have correctly identified the tension: if lying is intrinsically defined by the intent to deceive (*locutio contra mentem*), why does the *identity* of the liar or the *content* of the lie create a moral asymmetry?

  Your hypothesis is substantially correct, but it requires a specific Augustinian nuance regarding the relationship between **truth**, **charity**, and **scandal**. Here is a reconstruction of the argument, the resolution of the tension with his definition of lying, and a parsing of the "cunning spy" illustration.

  ### 1. The Shape of the Asymmetry: Sin vs. Scandal

  You are right that the asymmetry does not rest on the *fact* of deception (both are lying) but on the **spiritual consequences of the content asserted.** However, it is not merely a utilitarian calculation of "harm done." For Augustine, the asymmetry rests on the violation of **Charity (*Caritas*)** and the creation of **Scandal (*Scandalum*)**.

  *   **The Heretic's Lie:** When a Priscillianist lies to hide from a Catholic, they are protecting their own error. They are sinning (because they are lying), but they are generally containing their error within themselves. They are fleeing the light, but they are not necessarily actively preaching darkness to save someone else.
  *   **The Catholic's Lie:** When a Catholic lies to infiltrate, they must actively **witness to falsehood.** To be believed, they cannot merely remain silent; they must "praise their dogmas as though they were our own."

  For Augustine, truth is not just a logical category; it is ontological and soteriological. God is Truth. To speak falsely about matters of faith is to sever the bond of Charity with God and neighbor.
  *   **The Asymmetry:** The Catholic spy's lie is "more pernicious" because it weaponizes the authority of the Church (the spy is presumed trustworthy) to validate damnation. The heretic's lie is a defense of error; the Catholic's lie is an **evangelization of error.**

  Therefore, the asymmetry is not about the *definition* of the lie (which remains identical in both cases), but about the **gravity of the sin** based on its object. Lying about mundane matters is a sin; lying about God in a way that leads others to eternal death is a catastrophe of charity.

  ### 2. Consistency with the Intention-Centered Definition

  You ask how this sits with Augustine's "austere, intention-centered definition of lying." This is a classic problem in Augustine scholarship. Does Augustine slide into consequentialism here?

  **The short answer is no.** Augustine remains deontological regarding the act, but teleological regarding the gravity.

  1.  **The Definition Holds:** In *De Mendacio* and *Contra Mendacium*, Augustine defines a lie as speaking against one's mind with the intent to deceive. Both the heretic and the Catholic fit this definition perfectly. Augustine does not say the Catholic is *not* lying. He says the Catholic is lying *and* doing something worse.
  2.  **The Hierarchy of Sins:** Augustine acknowledges that while all lies are sins, they are not all equally destructive to the soul of the liar or the listener. He distinguishes lies by their "officiousness" (helpful), "jocose" (joking), or "pernicious" (harmful).
      *   The heretic's lie is pernicious to themselves.
      *   The Catholic's lie is pernicious to **others**.
  3.  **The Principle of Non-Contradiction:** Augustine's core principle is: *Non sunt facienda mala ut eveniant bona* ("Evil must not be done that good may come"). Consentius argues the "good end" is exposing heretics. Augustine argues the "evil means" (affirming heresy) destroys the "good end" (saving souls) because the means themselves kill the souls they aim to save.

  So, the intention-centered definition identifies the **act** as sinful. The analysis of the content identifies the **degree** of sinfulness. There is no contradiction; rather, the content analysis reinforces the prohibition. If the lie were harmless, the temptation to use it might be greater. By showing the lie is *spiritually lethal*, Augustine removes any "lesser evil" justification.

  ### 3. Parsing the "Cunning Spy" Illustration (Section 5)

  The illustration of the spy is not merely coloring; it is a phenomenological description of how the lie functions as a **performative act of teaching.**

  **The Sequence:**
  1.  **The Approach:** The spy identifies a target.
  2.  **The Bait (Dictinius):** The spy praises Dictinius. Augustine notes this is "more tolerable" because Dictinius was a bishop who (in Augustine's view) repented and was reconciled to the Catholic Church. Praising a reconciled sinner is not heresy.
  3.  **The Hook (Priscillian):** The spy then praises Priscillian, the "impious and detestable person." This is the critical turn.
  4.  **The Effect:** The listener hears a "Catholic" (the spy) venerating a condemned heretic.

  **The Feature Doing the Moral Work:**
  The moral work is done by the **simulation of reverence (*reverend mention*).**

  Augustine is highlighting that the lie is not just a proposition ("I am a Priscillianist"); it is an act of worship or veneration ("Priscillian is holy").
  *   **If the listener is weak:** They see a trustworthy person venerating Priscillian. They think, "Perhaps Priscillian is not so bad." They are "confirmed" in error. The lie has acted as **false prophecy.**
  *   **If the listener is a firm heretic:** They see their error validated by an outsider. They feel no need to seek the truth. They are "held down" in death.

  **Why this matters for your seminar:**
  Augustine is arguing that the spy ceases to be an investigator and becomes a **preacher.** You cannot separate the *method* of infiltration from the *message* required to sustain it. To maintain the cover, the Catholic must become a minister of falsehood.

  In section 5, the phrase *"this astuteness of him who tells the lie slays the soul of him who believes it"* is the key. The "astuteness" (the cleverness of the deception) is the weapon. The "soul of him who believes it" is the casualty. The Catholic spy is not just risking their own soul (by lying); they are actively murdering the soul of the neighbor (by leading them into heresy). This violates the Great Commandment (Love of Neighbor) more severely than the heretic hiding, who is primarily protecting their own soul (or lack thereof).

  ### Summary for your Session

  To synthesize this for your graduate students:

  1.  **The Asymmetry:** It is an asymmetry of **spiritual contagion.** The heretic's lie hides the disease; the Catholic's lie spreads the disease while pretending to be a cure.
  2.  **The Definition:** Augustine's definition of lying (intent to deceive) remains intact. The asymmetry arises from the **object** of the lie (divine truth vs. mundane concealment) and the **violation of Charity** (endangering the neighbor's salvation).
  3.  **The Spy:** The spy illustration demonstrates that successful deception in this context requires the **affirmation of falsehood as truth.** The lie becomes a sacrament of error.

  Augustine's point is that you cannot serve Truth by becoming a servant of Falsehood, even temporarily. The "net" spread to catch heretics is woven from threads that strangle the very souls the Church aims to save.
