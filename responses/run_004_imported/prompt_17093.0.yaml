          *   Heretic lying to hide: Protects a sinner, but doesn't necessarily spread sin to others directly through the content of the lie (usually).
          *   Catholic lying to infiltrate: Requires affirming heresy. This affirms falsehood *about God/Salvation*. It risks leading others (bystanders or the target) into damnation.
      *   *Nuance:* Augustine isn't saying the Catholic's lie is *not* a lie. He is saying it is *worse* (more pernicious) because of the spiritual stakes. It's a hierarchy of sins. All lies are sins, but some kill the soul more effectively.
      *   *Connection to Definition:* Augustine defines a lie as speaking falsehood with intent to deceive (*locutio contra mentem*). Both fit this. So the definition holds. The *moral weight* is determined by the object and end of the lie.

