      *   *Synthesis:* It sits *mostly* well. Augustine is consistent that lying is always wrong. Here he is arguing against a "lesser evil" justification. He admits the heretic's lie is bad, but argues the Catholic's lie is *worse* because it weaponizes truth against the salvation of others. It reinforces the prohibition rather than creating an exception.

