      *Wait, there's a more specific philosophical point:* **Contrastive Underdetermination.** They are treating DM and MOND as the only two options. But the space of possible theories is infinite. The worry isn't just DM vs. MOND; it's that *both* could be wrong (e.g., something else entirely). But the prompt asks for a worry *tangled in this debate*.
      *   Let's go with **The "Auxiliary Assumption" Black Box.** Duhem's point wasn't just about patches; it was that you never test a hypothesis in isolation, but a hypothesis + a web of assumptions. In DM vs. MOND, the "web" includes N-body simulations, baryonic feedback models, etc. The underdetermination is actually between **(DM + Standard Baryonic Physics)** vs. **(MOND + Complex Baryonic Physics)**. MOND proponents argue DM needs complex baryonic feedback to fit rotation curves (the "cusp-core" problem). DM proponents argue MOND needs dark matter (neutrinos) to fit clusters. So the real underdetermination is about *which auxiliary assumptions are more plausible*. Neither fully unpacked the *content* of the auxiliaries, just the *act* of adding them.

