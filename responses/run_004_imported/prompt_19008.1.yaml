      *   **Move 2 (Naomi):** Grants pretraining but points to RLHF. RLHF optimizes a policy against a reward signal. This looks like mesa-optimization setup. Selects for internal processes that robustly pursue goals. This creates an "agent" distinct from raw simulacra.
