  *(Self-Correction Note)*: I need to be careful not to let Sam slide into consequentialism. Sam's argument must remain: "I can *conceive* the world without logical contradiction, therefore it passes CC, even if I might not *will* it." Lena's argument must be: "You cannot even *conceive* the world because the concept of 'submission for evaluation' loses its meaning."

  Let's write.

