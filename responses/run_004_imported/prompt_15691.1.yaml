          *   *User's Side (Alex):* AI essay writing is like duties to develop talents/help others. Universalizing leads to a contradiction in the will (CW), not CC. Schools would adapt (oral exams, etc.). It's an imperfect duty (weighable).
      *   **Key Conflict:** The formulation of the *maxim* itself (narrow vs. broad) is the root cause.
      *   **Goal:** A genuine back-and-forth, sharp Kantian reasoning, addressing the maxim formulation head-on, ending with a clear identification of the underlying disagreement (factual vs. conceptual) without necessarily resolving it.

  2.  **Deconstruct the Philosophical Arguments:**
      *   *The Maxim:* This is the crux.
          *   Lena's Maxim (Narrow/Specific): "I will submit AI-generated text as my own original work to fulfill a specific assignment requirement designed to measure *my* understanding."
          *   User's Maxim (Broad/General): "I will use available tools, including AI, to complete academic tasks efficiently."
      *   *Contradiction in Conception (CC):* Can I conceive of a world where everyone does this? If everyone submits AI work as their own *for the purpose of demonstrating understanding*, the concept of "demonstrating understanding" vanishes. The system becomes incoherent. (Lena's view).
      *   *Contradiction in the Will (CW):* Can I conceive of the world? Yes. Schools change. But would I *will* it? Maybe not, because I want to learn. But maybe I would, because I want efficiency. (User's view).
      *   *Institutional Facts:* Does the university collapse, or does it evolve? This is the factual dispute layered over the conceptual one.

  3.  **Drafting - Scene Setting:**
      *   Need a setting that feels like students working on a project. A library or coffee shop.
