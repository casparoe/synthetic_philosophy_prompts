      *   **Round 2: Contradiction in Conception.** Lena argues the institution of grading relies on authenticity. Sam argues institutions adapt (evolution vs. collapse).
      *   **Round 3: The Nature of the Duty.** Lena says Perfect Duty (no exceptions). Sam says Imperfect Duty (balance with efficiency/rest).
      *   **Round 4: The Root Cause.** Pinpointing whether it's about the *description of the action* or the *prediction of consequences*.
      *   **Closing:** Acknowledging the impasse is the philosophical insight.

  5.  **Refining the Kantian Terminology:**
      *   Ensure terms like *maxim*, *universal law*, *contradiction in conception*, *contradiction in the will*, *perfect/imperfect duty* are used correctly.
      *   Avoid making one side look "right." Both need to sound like they understand Kant.
      *   *Self-Correction during drafting:* I need to make sure Sam doesn't just sound like a utilitarian. Sam needs to argue from a Kantian perspective (CW, imperfect duty), not just "it's okay because it works." Sam's argument is that the *will* to learn can coexist with AI, whereas Lena argues the *concept* of assessment cannot.

  6.  **Writing - Section by Section (Mental Outline):**
