answer: |-
  **Title:** The Maxim of the Machine
  **Characters:**
  *   **LENA:** Argues that using AI for essays is a perfect duty violation (Contradiction in Conception).
  *   **SAM:** Argues that it is at most an imperfect duty violation (Contradiction in the Will).

  **Setting:** A quiet corner of the university library, late evening. Laptops open, notebooks scattered with scribbled formulations.

  **LENA:** (Tapping her pen against her chin) We've been circling this for an hour, Sam. We can't write the dialogue until we agree on the moral status of the act. And we can't agree on the moral status because you refuse to write the maxim correctly.

  **SAM:** I'm not refusing. I'm trying to avoid begging the question. Your formulation is rigged to fail the Universal Law test before we even start. You wrote: *"I will submit AI-generated text as my own original work to fulfill a requirement designed to measure my personal understanding."*

  **LENA:** Because that *is* the action. If you strip out "as my own original work," you're not testing the deception. You're testing "using a computer." Obviously, using a computer is universalizable. But that's not what we're doing. We're talking about passing off machine output as human thought.

  **SAM:** But Kant says the maxim must reflect the agent's actual principle of action. My principle isn't "I want to deceive." It's "I want to complete the task efficiently using available tools." If I universalize *"I will use available tools to complete academic tasks,"* there is no Contradiction in Conception. The world doesn't end. Schools just change how they test.

  **LENA:** (Leaning forward) That's the factual dispute masquerading as a logical one. You're assuming the institution adapts. Kant's test asks if the *maxim itself* becomes impossible in a world where everyone acts on it. If everyone submits AI work as their own *for the purpose of demonstrating understanding*, the concept of "demonstrating understanding" evaporates. It's structurally identical to the false promise. If everyone makes false promises to get loans, the institution of promising collapses. No one believes promises anymore.

  **SAM:** But the institution of *schooling* doesn't collapse. It shifts. If everyone uses AI, professors stop assigning take-home essays. They do oral vivas. They do in-class handwritten exams. The goal—education—remains. The method changes. In the false promise case, the *practice itself* (promising) becomes impossible because it relies on trust. Here, the practice (learning) relies on cognition. I can still learn even if I use AI to draft.

  **LENA:** You're conflating learning with credentialing. The assignment isn't just "learn." It's "prove you learned." If everyone proves it using a machine, the proof is void. You can't conceive of a world where *this specific maxim* is universal law. You can only conceive of a world where the rules change to accommodate the cheating. But the test requires us to hold the rules constant and see if the action fits.

  **SAM:** (Sighs, closing his laptop) Okay, let's pause on the institutional reaction. Let's look at the formulation again. This is where we're actually stuck. You're including the *institutional purpose* in the maxim. I'm including only the *agent's intent*.

  **LENA:** Kant requires the purpose! A maxim is: "I will do X in circumstance Y for the sake of Z." If you leave out Z—"for the sake of getting credit for understanding"—you aren't testing the ethics of the submission. You're testing the ethics of typing.

  **SAM:** Fine. Let's grant your formulation. *"I will submit AI text as my own to satisfy a requirement intended to measure my understanding."* Universalize it. Everyone does this. Now, is there a Contradiction in Conception (CC)? Does the action become logically impossible? Or is it a Contradiction in the Will (CW)?

  **LENA:** It's CC. The action becomes impossible because "submitting for evaluation" presupposes the work is the student's. If it isn't, the action is a nullity. It's like trying to play a solo game of chess. You can move the pieces, but you aren't playing chess.

  **SAM:** I disagree. It's not logically impossible to submit the paper. The professor still receives a PDF. The registrar still processes a grade. The physical action happens. The *value* of the action drops, sure. But that sounds like a Contradiction in the Will. I can conceive of a world where everyone submits AI papers. It's a dystopian bureaucracy, but it's not logically incoherent. The contradiction arises because I, as a rational agent, presumably *will* my own education. If I universalize AI dependence, I undermine my own capacity to learn. Therefore, I cannot *will* it, even if I can *conceive* it.

  **LENA:** And that distinction matters why?

  **SAM:** Because if it's a Contradiction in the Will, it's an imperfect duty. Like the duty to develop one's talents. Kant says you don't have to develop every talent to the max, all the time. You can rest. You can take shortcuts, provided you don't undermine the system entirely. If it's CW, then using AI for a low-stakes blog post might be permissible, while using it for a thesis is not. It allows for nuance. If it's CC, it's a perfect duty. It's always wrong, like murder or lying. No weighing.

  **LENA:** (Pauses, thinking) You're trying to carve out a space for "acceptable cheating" by downgrading the duty from perfect to imperfect.

  **SAM:** I'm trying to be accurate to the test. If the world doesn't end logically, it's not CC.

  **LENA:** But here's the rub, Sam. Why do you think the world doesn't end logically? Because you assume the *definition* of "submission" stays fixed while the *content* changes. I'm saying the definition of "submission" includes "authorship." If authorship is removed, the act isn't "submitting an essay." It's "submitting a file." You're describing a different act.

  **SAM:** So your argument is that my maxim is too broad, but your maxim is too... what? Metaphysically loaded?

  **LENA:** My maxim captures the normative context. Kant isn't testing physics; he's testing rational agency. If the agency is outsourced, the act is void. But... (she hesitates) ...I see your point about the Will. If we agree it's a CW, we agree it's wrong, just not *absolutely* wrong in every conceivable instance.

  **SAM:** Exactly. But I don't even agree it's wrong in every instance. If the duty is to develop talents, and I use AI to free up time to develop *other* talents—say, I use AI to write this ethics paper so I can spend ten hours volunteering at the shelter—haven't I balanced the imperfect duties?

  **LENA:** (Shakes her head) No. Because you can't will a system where rational agents systematically outsource their reasoning. That undermines the very capacity for rational agency that Kant values. You can't will a world where no one thinks for themselves.

  **SAM:** But no one is saying *no one* thinks. We're saying tools change. Calculators didn't end math; they ended long division by hand. We moved to harder math. If everyone uses AI, maybe we move to harder thinking. Oral defenses. Collaborative projects.

  **LENA:** There it is again. You're relying on the *adaptation* of the system. That is a factual prediction, not a logical test. Kant's test asks: Can I conceive of the maxim as a universal law of nature *now*? Not "Can I conceive of a new system evolving to handle the maxim?"

  **SAM:** (Leans back) Okay. I think we finally hit the bedrock. You think the Universal Law test freezes the institutional context. I think the Universal Law test applies to the agent's will, and the institutional context is empirical noise.

  **LENA:** Closer. I think the disagreement is about where we locate the "contradiction." For me, the contradiction is in the *concept of the act*. "Submitting unauthored work as authored" is like "square circle." It doesn't compute.

  **SAM:** For me, the contradiction is in the *outcome for the will*. "Submitting unauthored work" computes fine. But a rational agent wouldn't *want* to live in that world universally.

  **LENA:** So, if we write the dialogue... we can't resolve it.

  **SAM:** No. But we can pinpoint it. The disagreement isn't about AI. It's about whether the Formula of Universal Law tests the *logical coherence of social practices* (your view) or the *consistency of the individual's will* (my view).

  **LENA:** If it's social practices, then the false-promising analogy holds. The practice of assessment breaks.

  **SAM:** If it's the individual will, then the "developing talents" analogy holds. I might be lazy, but I'm not logically incoherent.

  **LENA:** (Starts typing) Okay. Let's write that. We'll structure the dialogue so the two characters realize they are using different versions of the Formula. One treats the "law of nature" as a sociological constant, the other as a backdrop for individual volition.

  **SAM:** And we end with them agreeing that until they settle what a "maxim" actually includes—context or just intent—they can't settle the AI question.

  **LENA:** Precisely. It's not a bug in our project, Sam. It's a bug in the theory. Or at least, it's the famous "maxim problem" that scholars have fought over for two hundred years.

  **SAM:** (Smiles) So we get an A for identifying the impasse?

  **LENA:** We get an A for showing we actually read the *Groundwork* instead of the SparkNotes. Now, help me word this maxim. If I concede to "I will use tools to complete tasks," does your side admit that "completing tasks" implies "honestly"?

  **SAM:** Only if "honestly" isn't defined by "without AI."

  **LENA:** Deal. Let's write.
