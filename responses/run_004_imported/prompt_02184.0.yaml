answer: |-
  **Title:** The Naturalization of Custom: Spinoza's Contradiction on Women and the Limits of Democratic Immanence

  The abrupt ending of Spinoza's *Tractatus Politicus* (TP) is one of the most frustrating lacunae in the history of political philosophy. Just as the manuscript breaks off in Chapter 11, Spinoza makes a startling claim: women are naturally excluded from citizenship because there is no historical record of the sexes ruling jointly, and therefore women "necessarily" submit to men. For a seminar on early modern political thought, this passage is not merely a historical artifact of seventeenth-century patriarchy; it is a philosophical stress test. It pits Spinoza's hard-nosed realism (*jus* equals *potentia*) against his critical genealogy of servitude (where tyranny is manufactured by fear and imagination).

  The question is whether this exclusion is a consistent application of his power-based ontology or a betrayal of it. The verdict must be clear: **Spinoza's exclusion of women is not a consistent empirical application of *jus=potentia*, but a fundamental contradiction of his own critical method.** By treating a contingent social power dynamic as a law of nature, Spinoza reifies the very effects of custom and imagination he sought to dismantle in the *Theological-Political Treatise* (TTP). This inconsistency does not merely tarnish his legacy; it destabilizes his core claim that democracy is the "most natural" regime, revealing that his conception of the "multitude" is artificially truncated by unexamined prejudice.

  To understand why this is a contradiction rather than a mere empirical error, we must first grant the strongest version of the realist defense. Spinoza's political science is grounded in the identity of right and power: "the right of nature is co-extensive with power" (TTP 16). If women lack the power to resist men or to govern alongside them, they lack the right to do so. In TP 11.4, Spinoza argues that because men and women have never ruled equally anywhere, this arrangement must follow from a "natural cause." If we view Spinoza as a strict descriptive naturalist, he is simply observing the world as it is. If women are consistently dominated, their *potentia* is objectively lower in the political sphere. On this reading, Spinoza is not prescribing misogyny; he is diagnosing a power imbalance. To grant them rights they cannot enforce would be a fiction, violating his anti-utopianism.

  However, this defense collapses when held against Spinoza's own account of how power is constituted and how servitude is produced. In the TTP and the *Ethics*, Spinoza demonstrates that human power is not static; it is compositional. We increase our power (*potentia*) through rational association and decrease it through passive affects like fear, hatred, and superstition. Crucially, Spinoza argues that hierarchical subordination is often the *result* of institutional and imaginative conditioning, not its pre-existing cause. In the TTP, he explains that prophets and kings maintain power not by natural superiority, but by manipulating the imagination to induce obedience. He understands that what looks like "natural" servitude is often the product of social engineering.

  When Spinoza turns to women in the TP, he suspends this critical insight. He observes that women are subordinate and concludes they are *naturally* unfit to rule. He fails to ask whether their lack of political power is the result of the very customs, laws, and educational deprivations that his own system identifies as the sources of passivity. By citing the lack of historical precedent as proof of natural necessity, Spinoza commits a circular error: women do not rule because they are excluded from the institutions that generate political power, and they are excluded because they do not rule. He treats the *effect* of patriarchal oppression (women's lack of sovereign power) as the *cause* of their exclusion. This is not realism; it is the reification of custom into nature. It contradicts the Spinozist maxim that human nature is mutable and that "men are not born citizens, but made." If men are made citizens, and women are made subjects, the difference is institutional, not ontological.

  This contradiction strikes at the heart of Spinoza's case for democracy as the "most natural" regime. In TTP 16, Spinoza favors democracy because it minimizes the alienation of natural right; the multitude retains its power, and the sovereign is simply the collective expression of that power. Democracy is "natural" because it aligns political right with the actual distribution of power in the population. However, if Spinoza arbitrarily excludes half the population based on a power dynamic that his own philosophy suggests is mutable and socially constructed, the "multitude" ceases to be a natural category and becomes a political construct.

  If the exclusion of women is not a necessity of nature but a failure of political imagination, then the democratic regime Spinoza champions is not actually the most natural. It is, instead, an aristocracy of men masquerading as a democracy of humans. This weakens the normative force of his argument. If democracy is only "natural" for those who already hold power, then Spinoza's theory loses its critical edge against tyranny. It becomes a justification for the status quo rather than a tool for analyzing how power can be recomposed to increase freedom. A truly Spinozist democracy would require asking what institutions would allow women's *conatus* to flourish politically, rather than assuming their current subjugation is a fixed limit.

  Furthermore, this inconsistency reveals a limit in Spinoza's immanent critique. Spinoza is brilliant at exposing how religious authorities use superstition to keep the multitude in bondage. Yet, he is blind to how domestic and social structures use custom to keep women in bondage. He succumbs to the very "bondage" he describes in the *Ethics*—being determined by external causes (in this case, cultural prejudice) without adequate ideas. He mistakes the imagination of his era (that women are inherently irrational or weak) for the dictates of reason. For a philosopher who demands we see things *sub specie aeternitatis* (under the aspect of eternity), grounding a political exclusion on the contingent fact of "no historical examples" is a failure of philosophical rigor.

  Ultimately, this is not just a "bad empirical call." An empirical error would be misidentifying the strength of a fortress. A contradiction is misidentifying the laws of physics that govern the siege. Spinoza's system posits that freedom is the recognition of necessity, but it also posits that reason allows us to rearrange social affects to maximize collective power. By freezing women's status as a natural necessity, Spinoza blocks the path to a greater collective *potentia*. He limits the power of the state by excluding the rational capacity of half its subjects.

  Therefore, the ending of the *Tractatus Politicus* must be read as a failure of Spinoza's system to fully apply its own medicine to itself. It contradicts his genealogy of servitude and undermines the claim that democracy is the most natural regime, because it shows that his "nature" is contaminated by unexamined history. For your seminar, the lesson is not to discard Spinoza, but to use this fracture to show the difficulty of radical immanence. It demonstrates that even the most rigorous materialist can be trapped by the imagination of their time. But philosophically, the verdict stands: the exclusion of women is an inconsistency that weakens his political theory, proving that a democracy built on unexamined exclusions is not, by Spinoza's own lights, truly natural.
