          *   Context: TTP democracy vs. TP exclusion.
          *   Thesis Statement: This is not merely an empirical error consistent with his realism; it is a structural contradiction that betrays his own genealogy of servitude. It weakens the claim that democracy is "most natural" by revealing that Spinoza's "nature" is contaminated by unexamined custom.

      *   **Body Paragraph 1: The Case for Consistency (*Jus = Potentia*).**
          *   Acknowledge the strongest counter-argument. If right is power, and women (allegedly) lack power to resist men, they lack right.
          *   Spinoza cites universal history. To him, this looks like a law of nature.
          *   If we accept his premises, he's being consistent *within* a limited frame.

      *   **Body Paragraph 2: The Case for Inconsistency (The Genealogy of Servitude).**
          *   Pivot to the TTP and *Ethics*. How does Spinoza explain subjugation usually? Fear, superstition, hope.
          *   Patriarchy looks exactly like the tyranny he critiques in religion.
          *   By calling it "natural" rather than "institutional/affective," he stops asking *why* women lack power. He naturalizes a power imbalance that his own system suggests is mutable.
          *   Key point: *Potentia* is not static. It is *conatus*. To say women *cannot* share power is to deny their *conatus* without sufficient cause.

