          *   Thesis idea: Borges uses incompatible metaphysics to demonstrate the insufficiency of rational systems to capture lived experience.
          *   Structure: Analyze the "Refutation" (logic), Analyze the "Garden" (narrative), Synthesize via the concept of the Labyrinth/Idealism as aesthetic tools.

