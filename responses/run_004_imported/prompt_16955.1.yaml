prompt: |-
  I'm a retired field geologist (almost forty years of it, a lot of that in pretty remote parts of the world) and about a year ago I fell into a small philosophy discussion group that meets at our local library - mostly other retirees, plus one ex-lawyer who runs it like it's still a seminar. This month I'm the one who has to bring a topic, and I've settled on something that's been nagging at me since we did a session on ethics generally: why exactly does making a promise generate a real obligation, rather than just being a nice-to-have?

  From my reading so far there seem to be two quite different families of answer on offer. Hume, in the bit of the Treatise called "Of the obligation of promises," seems to think there's nothing natural about the bindingness at all - its basically a useful convention society sets up because everyone benefits from being able to rely on each other, so the "obligation" is just whatever we've collectively attached to the act of promising, a bit like the rules of a game that only really bind once enough people are playing along. Then much later you get someone like Scanlon in What We Owe to Each Other, who grounds the obligation directly in the wrong of manipulating someone's trust and expectations in the moment you promise them something - he's got a whole "Principle F" for it, if I'm remembering the name right - and on that view you don't seem to need any background social practice at all.

  Here's the test case I want to bring to the group, and I'd like your help thinking it through first. Suppose I'm the last survivor of an expedition, stuck somewhere with zero chance of rescue, and my dying colleague asks me to promise I'll get word to their family, who's waiting back home, if I somehow ever make it out alive - both of us knowing full well that not a soul will ever find out whether I keep it or not, and that there's no future "practice" of promise-keeping left for either of us to protect. Does Hume's convention-based story actually predict that I'm bound in a case like this, or does it just quietly stop applying once you strip away the social payoff? And does Scanlon's account really do any better, or does it just move the mystery somewhere else? I'd like a proper side-by-side of how the two theories would handle this specific scenario, rather than the usual one-line "convention vs. trust" contrast, which is about as far as I've gotten on my own.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired field geologist (40 years, remote work), intelligent, well-read (Hume, Scanlon), participating in a philosophy discussion group. Practical, grounded, likely appreciates concrete examples over abstract fluff.
      *   **Context:** Leading a discussion group at a local library. Needs to present a topic on the obligation of promises.
      *   **Core Question:** Why does making a promise generate a *real* obligation?
      *   **Specific Theories:** Hume (convention/social utility) vs. Scanlon (trust/expectations/Principle F).
      *   **Specific Test Case:** The "Last Survivor" scenario. Two explorers, one dying, one surviving. Promise made to tell the family. No one else will know if it's kept. No future social practice to uphold.
      *   **Goal:** A proper side-by-side analysis of how Hume and Scanlon handle this specific scenario, avoiding simplistic contrasts.

  2.  **Deconstruct the Test Case ("The Last Survivor"):**
      *   *Key Features:* Isolation, no external enforcement, no reputational cost, no future reciprocal benefit, intense emotional weight, specific beneficiary (the family), specific promisor (the survivor).
      *   *The Intuition:* Most people feel the survivor *is* bound. If they don't do it, they've done something wrong.
      *   *The Challenge:* This scenario is designed to stress-test social contract/convention theories (like Hume's) because the "society" is effectively gone.

  3.  **Analyze Hume's Position (Convention/Utility):**
      *   *Core Text:* *A Treatise of Human Nature*, Book 3, Part 2, Section 5 ("Of the obligation of promises").
      *   *Key Argument:* Promises are human inventions. There is no natural motive (like self-interest or benevolence) that always aligns with promise-keeping. The obligation arises from a *convention* established for social utility (commerce, stability).
      *   *Application to Test Case:*
          *   *Problem:* The convention exists to facilitate future cooperation. Here, there is no future cooperation. The "game" is over.
          *   *Humean Defense:* A sophisticated Humean might argue that we cultivate a *habit* or *sentiment* of fidelity because it's useful generally. We don't switch it off case-by-case. To break a promise even here weakens the internal habit.
          *   *Weakness:* Hume explicitly says the obligation *is* the social utility. If utility is zero (no one knows, no future impact), the obligation theoretically vanishes or becomes very weak.
          *   *Verdict:* Hume struggles here. He might say the obligation is illusory or derived from a general rule we apply blindly, but strictly speaking, the *reason* for the convention (social coordination) is absent.

  4.  **Analyze Scanlon's Position (Contractualism/Principle F):**
      *   *Core Text:* *What We Owe to Each Other*, Chapter 7 ("Promises and Contracts").
      *   *Key Argument:* Wrongness of breaking a promise isn't about social utility but about violating a specific duty owed to the promisee.
      *   *Principle F:* If you intentionally lead someone to expect you will do X (unless they consent otherwise), and you know they want this assurance, you must do X.
      *   *Application to Test Case:*
          *   *Fit:* This scenario is practically built for Scanlon. The dying colleague *relies* on the assurance. The survivor *invites* that reliance.
          *   *Mechanism:* The wrong is done *to the colleague* at the moment of betrayal (or failure), not to "society." The colleague dies trusting. If the survivor breaks it, they have manipulated that trust.
          *   *Nuance:* Scanlon acknowledges social practices help, but the core obligation is interpersonal.
          *   *Verdict:* Scanlon handles this much better. The obligation survives the death of the promisee because the duty was incurred *then*.

  5.  **Synthesize and Structure the Response:**
      *   **Tone:** Respectful, collegial, acknowledging the user's expertise (geology/fieldwork) and philosophical reading. Avoid talking down. Use the "field geologist" metaphor if appropriate (rock types, strata, etc.).
      *   **Introduction:** Validate the choice of topic and the specific test case. It's a classic "desert island" style thought experiment but sharpened.
      *   **Section 1: Hume's Convention (The Social Glue).**
          *   Explain the "invention" aspect.
          *   Apply to the scenario: The "game" has ended.
          *   The Humean workaround (habit/sentiment) vs. the strict reading (utility is gone).
          *   Conclusion: Hume predicts a weak or non-existent obligation *in principle*, even if psychology says otherwise.
      *   **Section 2: Scanlon's Principle F (The Interpersonal Bond).**
          *   Explain Principle F (expectations + assurance).
          *   Apply to the scenario: The reliance happened *then*. The duty is to the memory/trust of the colleague.
          *   Conclusion: Scanlon predicts a strong obligation.
      *   **Section 3: Critical Comparison (The "So What?").**
          *   Where Hume wins: Explains *why* we have the institution of promising at all (language, law).
          *   Where Scanlon wins: Explains the *moral force* in isolated cases.
          *   The "Mystery Move": Does Scanlon just push the buck back to "why do we owe it to people not to manipulate them?"
      *   **Section 4: Discussion Prompts for the Group.**
          *   Give the user concrete questions to ask the retirees/lawyer.
      *   **Closing:** Encouragement.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Hume:* Be careful not to make Hume sound *too* crude. He talks about moral sentiments. Even if utility is low, the *sentiment* of approval/disapproval might remain because we judge by general rules. I need to make sure I distinguish between the *origin* of the obligation (convention) and the *psychological feeling* (sentiment).
      *   *Correction on Scanlon:* Scanlon isn't purely about "trust" in a fuzzy sense; it's about *justifiability to others*. But Principle F is the specific mechanism for promises. Stick to Principle F.
      *   *Geologist Metaphor:* Maybe compare Hume to sedimentary rock (layers of social buildup) and Scanlon to igneous (formed in the heat of the specific moment)? Or maybe just keep it professional without forcing metaphors. Let's keep it professional but acknowledge the field background in the tone (pragmatic, evidence-based).
      *   *The "Dead Promisee" Issue:* Scanlon actually deals with the "what if they die?" question. The duty remains because the wrong was done to them *when they were alive* (or to the value of their trust). I need to be precise here.

  7.  **Final Polish:** Check the tone. Ensure it sounds like one intellectual talking to another. Make sure the distinction between "obligation exists" and "we feel obligated" is clear for Hume.

  *(Self-Correction Note)*: Wait, does Scanlon require the promisee to be alive to hold you accountable? No, the principle is about what you owe *to* them. If they die, the obligation doesn't vanish, though the enforcement mechanism (their resentment) does. I should clarify that.

  8.  **Drafting the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  This is a superb choice for a discussion topic, and your "Last Survivor" test case is sharp enough to cut through the usual platitudes. It reminds me of the "desert island" thought experiments, but you've stripped away even the possibility of future society, which makes it a genuine stress test.

  Given your background, you'll appreciate that this isn't just about "what feels right." It's about structural integrity. Hume treats the obligation like a sedimentary rock—built up layer by layer through social deposition over time. Scanlon treats it more like a crystal structure formed in the specific conditions between two individuals.

  Here is a side-by-side breakdown of how each theory handles your expedition scenario, along with the specific vulnerabilities you can press in the discussion.

  ### 1. Hume: The Convention View (The Social Glue)

  **The Core Argument:**
  For Hume, a promise is not a natural act. There is no "mental act" of volition that magically binds you. Instead, promising is a human invention, a "form of words" we created to solve a coordination problem. We need to trade and cooperate with people who aren't our kin, but self-interest makes us unreliable. So, we invent a convention: saying "I promise" triggers a social sanction if broken. The obligation *is* the utility of the convention.

  **Applying it to the Last Survivor:**
  *   **The Prediction:** Strictly speaking, Hume's theory predicts **no obligation** (or a vanishingly weak one) in your scenario.
  *   **The Reasoning:** The convention exists to facilitate *future* cooperation and maintain the *general* trust of society. In your case:
      1.  There is no future cooperation (you are the last one).
      2.  There is no reputational cost (no one will know).
      3.  There is no social practice to uphold (the "game" is over).
  *   **The Humean Workaround:** A sophisticated Humean (or your ex-lawyer facilitator) might argue that we cultivate a *habit* of fidelity. We don't calculate utility case-by-case because that would weaken the habit. So, you keep the promise because you've been conditioned to value the *general rule*, even if this specific instance yields no utility.
  *   **The Vulnerability:** This feels like a dodge. If the obligation is *defined* by social utility, and social utility is zero, then calling it an "obligation" is a category error. It reduces the survivor's duty to a psychological quirk ("I just feel like I should") rather than a moral requirement. If the survivor says, "I calculate that telling the family will only cause them pain and help no one," Hume has no ground to stand on to say they are *wrong*.

  **Discussion Point for the Group:**
  *   *"If Hume is right, is the survivor who breaks the promise actually immoral, or just inefficient? If no society exists to benefit from his honesty, is he breaking a rule or just stepping off a playing field that no longer exists?"*

  ### 2. Scanlon: The Contractualist View (Principle F)

  **The Core Argument:**
  Scanlon argues that morality is about being able to justify our actions to others on principles they could not reasonably reject. For promises specifically, he proposes **Principle F**: If you intentionally lead someone to expect you will do X (unless they consent otherwise), and you know they want this assurance, and you act to give them that assurance, you must do X.
  The wrong isn't breaking a social rule; it's **manipulating trust**. You invited them to rely on you, and then you betrayed that reliance.

  **Applying it to the Last Survivor:**
  *   **The Prediction:** Scanlon's theory predicts a **strong obligation**.
  *   **The Reasoning:** The obligation is generated in the *moment of the promise*, not by the future consequences.
      1.  The dying colleague wanted assurance.
      2.  The survivor intentionally provided it to ease the colleague's mind.
      3.  To break the promise is to retroactively invalidate the trust the colleague died holding. It treats the colleague as a mere means to an end (perhaps to make the dying moment easier) rather than a person to whom a duty was owed.
  *   **The "Dead Promisee" Problem:** Scanlon anticipates the objection: "How can you owe something to a dead person?" His answer is that the wrong was done *when the trust was violated*, or rather, the duty was incurred while they were alive. The obligation survives the promisee because the *reason* for the obligation (the invitation of reliance) occurred in a valid moral interaction.
  *   **The Vulnerability:** Scanlon pushes the mystery back one step. Why do we owe it to people not to manipulate their expectations? He says it's about "what we owe to each other" as rational beings. But if the survivor argues, "My colleague is dead; they have no interests left to harm," Scanlon has to argue that the *act* of betrayal itself is the harm, regardless of the victim's current state. Some might find this too abstract compared to Hume's concrete social benefits.

  **Discussion Point for the Group:**
  *   *"Scanlon says the harm is in the manipulation of trust. But if the colleague is dead and feels no pain, and the family never knows, who exactly is harmed? Is the obligation about protecting the colleague, or about the survivor's own integrity?"*

  ### 3. Comparison for the Group

  Here is a summary table you might find useful for a handout or whiteboard session:

  | Feature | Hume (Convention) | Scanlon (Principle F) |
  | :--- | :--- | :--- |
  | **Source of Obligation** | Social Utility & Stability | Interpersonal Trust & Assurance |
  | **Nature of Promise** | A social technology (like money) | A moral transaction between individuals |
  | **In "Last Survivor" Case** | **Fails.** No society left to benefit. | **Succeeds.** Trust was invited and given. |
  | **Why keep the promise?** | To maintain the habit/general rule. | Because you owe it to *that specific person*. |
  | **Weakness** | Cannot explain private/isolated duties. | Abstract; relies on "reasonable rejection." |

  ### 4. A Geologist's Angle for the Discussion

  Since you're the one presenting, you might frame the tension using a metaphor from your field work.

  *   **Hume is like Stratigraphy:** The obligation is built up over time, layer by layer, through social deposition. If you remove the surrounding strata (society), the fossil (the promise) loses its context and meaning.
  *   **Scanlon is like Igneous Rock:** The obligation crystallizes instantly under the heat and pressure of the specific interaction between two people. It doesn't matter what the surrounding landscape looks like; the crystal structure is formed by the elements present in that moment.

  **The "Mystery Move" Question:**
  You asked if Scanlon just moves the mystery elsewhere. I think he does, but to a more fertile place.
  *   Hume moves the mystery to **Society**: "Why does society bind us?" (Answer: Because we need it to survive.)
  *   Scanlon moves the mystery to **Personhood**: "Why do we owe it to individuals not to manipulate them?" (Answer: Because that is what it means to respect them as rational beings.)

  For your group, the killer question to pose is this:
  *"If I am the last survivor, and I break the promise, have I committed a crime against society (Hume), or a crime against my friend (Scanlon)? And if society is gone, does the crime against the friend still count?"*

  ### Recommendation for the Session

  Given the makeup of your group (retirees + lawyer), they will likely lean towards Hume initially because it feels more "realistic." Lawyers deal with contracts as social enforceable instruments.
  *   **Challenge the Lawyer:** Ask them if a contract signed by two people on a sinking ship, with no heirs and no witnesses, is legally binding. (It's not). Then ask if it's *morally* binding. If they say yes, they are admitting Hume is insufficient.
  *   **Challenge the Retirees:** Ask if they have ever kept a promise to someone who died, where no one would have known if they broke it. Why did they do it? Was it fear of social sanction (Hume) or respect for the person (Scanlon)?

  This setup should give you a robust two hours. It respects Hume's realism while exposing its limits, and it gives Scanlon room to show why we feel bound even when the "social game" is over. Good luck with the session; it sounds like a stimulating group.
