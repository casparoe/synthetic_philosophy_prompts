answer: |-
  This is a classic tension in the philosophy of biology, and the feather case is the perfect stress test. To determine which account yields the less *ad hoc* verdict, we need to look closely at what "ad hoc" means in this context. Usually, a modification or verdict is *ad hoc* if it is introduced solely to save a theory from a counter-example without independent justification or grounding in the underlying phenomena.

  Here is a comparison of how the Causal-Role (CR) and Modern History Selected-Effects (MH-SE) accounts handle the feather exaptation, followed by an evaluation of which verdict is less *ad hoc*.

  ### 1. The Case: Feathers as Exaptation
  *   **History:** Proto-feathers arise in theropod dinosaurs; selected for thermoregulation (insulation).
  *   **Current State:** Feathers are present in birds; selected for flight (aerodynamics), though they may still contribute to insulation.
  *   **The Problem:** Standard etiological accounts (Wright/early Neander) risk saying flight is *not* a function because it wasn't the reason feathers were *originally* selected. This conflicts with biological practice, where flight is paradigmatically a function of feathers.

  ### 2. The Causal-Role (Cummins) Verdict
  **The Mechanism:** Cummins defines function analytically. $X$ has function $F$ in system $S$ if $X$ has a capacity $C$ and $C$ contributes to $S$'s capacity $F$.
  **The Verdict:** Cummins's account **dissolves** the conflict.
  *   Relative to the *thermoregulatory system*, feathers have the function of insulation.
  *   Relative to the *locomotor system*, feathers have the function of enabling flight.
  *   There is no single "proper function." Both are functions, relativized to the containing system chosen by the analyst.

  **Is this *ad hoc*?**
  Structurally, no. The theory does not need to be patched to accommodate exaptation; it predicts that traits can have multiple functions simultaneously. However, the *verdict* relies on an external variable: the **analytical perspective**.
  *   **The Weakness:** What determines the "containing system"? Cummins appeals to the explanatory interests of the theorist. This makes function ascription mind-dependent. If I want to explain why birds don't freeze, insulation is the function. If I want to explain migration, flight is the function.
  *   **The Ad Hoc Charge:** One could argue that allowing the theorist's interest to dictate function is itself *ad hoc*. It lacks an objective constraint. It risks "pan-functionalism" (e.g., does the heart have the function of making a thumping sound because a cardiologist is analyzing heart sounds?). Cummins restricts this to "dispositions that contribute to a capacity of the containing system," but the choice of system remains pragmatic, not biological.

  ### 3. The Modern History SE (Godfrey-Smith) Verdict
  **The Mechanism:** Godfrey-Smith modifies the etiological account. A trait's function is determined by the **recent** selective history that maintains the trait in the population, not necessarily its deep ancestral origin.
  **The Verdict:** Godfrey-Smith's account **resolves** the conflict in favor of flight.
  *   Because feathers are *currently* maintained in the bird population primarily due to the selective advantage of flight, flight is the current proper function.
  *   Insulation might be a "side effect" or a secondary function if it no longer drives the selection pressure significantly.

  **Is this *ad hoc*?**
  On the surface, introducing a "recent history" clause looks like a patch to save SE from the exaptation counter-example.
  *   **The Weakness:** How "recent" is recent? 100 generations? 1,000? If the cut-off is arbitrary, the theory is *ad hoc*.
  *   **The Defense:** Godfrey-Smith argues this is not a patch but a correction of Wright's original formulation. Selection is an ongoing causal process. If a trait is no longer selected for its original purpose (insulation) but is maintained by a new pressure (flight), the causal etiology of the trait's *current* presence is flight. The "recent" constraint tracks the **current selection coefficient**.

  ### 4. Comparison: Which is Less *Ad Hoc*?

  I argue that **Godfrey-Smith's Modern History account gives the less *ad hoc* verdict**, for the following reasons:

  #### A. Objective Constraints vs. Pragmatic Interests
  The charge of *ad hoc*-ness sticks most strongly to theories that introduce arbitrary distinctions to save a verdict.
  *   **Cummins (CR):** To avoid saying "flight is the only function," Cummins must appeal to the **analyst's perspective**. This introduces a subjective element into what is supposed to be a biological fact. Why is flight the function *for biology* but not just for aerodynamics? Cummins has no answer other than "it depends on what you are analyzing." This makes the verdict contingent on the observer, which is a form of arbitrariness.
  *   **Godfrey-Smith (MH-SE):** The "recent history" constraint is grounded in **population genetics**. Whether a trait is being maintained by selection for flight is an objective fact about fitness differentials in the current environment. While the exact temporal window might be fuzzy, the causal mechanism (current selection pressure) is mind-independent. A verdict grounded in objective causal history is less *ad hoc* than one grounded in theorist interest.

  #### B. Normativity and Malfunction
  A major reason biologists prefer etiological accounts is that they explain **malfunction**.
  *   **Cummins:** If feathers are damaged and fail to insulate, they lose the function of insulation (relative to the thermoregulatory system). But if they fail to enable flight, they lose that function too. CR struggles to explain why a flightless bird with intact feathers has *malfunctioning* feathers in a normative sense, rather than just a different causal profile.
  *   **Godfrey-Smith:** If feathers are selected for flight, a feather that cannot support flight is malfunctioning *even if* it still insulates. This captures the biological intuition that traits have "jobs" they can fail at.
  *   **Why this matters for *ad hoc*-ness:** If a theory requires extra machinery to explain malfunction (a core biological concept), that machinery can seem *ad hoc*. SE builds normativity into the definition of function (selected effects). CR has to add normative constraints externally if it wants to capture malfunction. Therefore, SE's verdict is more integrated with biological theory.

  #### C. The "Time-Slice" Objection Rebutted
  The strongest criticism of Godfrey-Smith is that the "recent" cut-off is arbitrary. However, this is less *ad hoc* than it appears. In evolutionary biology, "recent" is defined by the **persistence of the selection regime**.
  *   If the environment changes such that flight is no longer advantageous (e.g., flightless birds on an island), the function changes.
  *   This isn't an arbitrary time limit; it's a causal limit. The function persists as long as the selection pressure persists.
  *   By contrast, Cummins's "analytical perspective" has no causal limit. I can analyze the heart as a noise-maker forever, regardless of biology.

  ### Conclusion
  While Cummins's account is theoretically cleaner (it requires no temporal stipulations), **Godfrey-Smith's Modern History account provides the less *ad hoc* verdict regarding biological function.**

  Cummins saves his theory from the exaptation problem by making function relative to the observer's interests. This renders the verdict pragmatic rather than factual. Godfrey-Smith saves the etiological account by anchoring function to **current causal maintenance**. Even if the "recent" boundary is fuzzy, it tracks an objective feature of the world (selection pressure) rather than a feature of the theorist (analytical goal). In the context of a philosophy of *biology* seminar, where the goal is to capture how biologists actually use functional ascriptions (which are objective and normative), the Modern History verdict is less *ad hoc* because it is constrained by the biology itself, not by our description of it.

  **Summary Verdict:**
  *   **Cummins:** Dissolves the problem via relativization. Risk: Makes function mind-dependent (pragmatic *ad hoc*-ness).
  *   **Godfrey-Smith:** Resolves the problem via recent selection. Risk: Temporal cut-off (temporal *ad hoc*-ness).
  *   **Winner:** **Godfrey-Smith.** Objective causal history is a stronger ground for function than analytical perspective. The "modern history" clause is not a patch, but a necessary refinement to align etiology with the ongoing nature of natural selection.
