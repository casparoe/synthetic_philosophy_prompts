answer: |-
  Hi everyone. For those who don't know me, I'm a software engineer. My job is essentially to predict how a system will behave, write down the rules, and make sure nothing unexpected happens. I live in a world of if-then statements and predictable outcomes.

  So, when Mara asked me to give a toast, I naturally started thinking about this decision—the decision to adopt, to become a parent—in terms of risk assessment. You know the drill: weigh the pros and cons, calculate the costs, project the ROI on your sleep schedule.

  But there's a problem with that model. And Mara, I know you've heard this a thousand times, usually in the most smug way possible: "Oh, just wait until you have him home. You'll understand then."

  I know how much you hate that phrase. It sounds like a conversation-ender. A smug non-answer. But a while back, I got hooked on an idea from a philosopher named L.A. Paul that explains *why* that phrase feels so frustrating, yet also why it's technically true.

  Paul talks about something called a "transformative experience." She uses a thought experiment about vampires. It sounds wild, but stick with me. If you were offered the chance to become a vampire, you couldn't make a rational decision about it using normal logic. Why? Because first, it's *epistemically* transformative: you literally cannot know what it feels like to be a vampire until you are one. No amount of research tells you what the experience is like from the inside.

  But second, and more importantly, it's *personally* transformative. The "you" that exists after the change has different values, different instincts, and a different identity than the "you" sitting there making the decision now. The old you can't vote for the new you, because the old you doesn't exist anymore.

  Parenthood is one of the few real-life vampire moments we have.

  People treat it like a standard life choice, like buying a house or switching jobs. But you can't weigh the pros and cons of meeting your child, because the person who will love that child doesn't exist yet. That person is created *by* the love itself.

  So, when people say "you'll get it once you have kids," what they're clumsily trying to say is that you are about to cross a threshold where your old metrics for decision-making no longer apply.

  And that is why what you are doing, Mara, is not just a logical next step. It is genuinely brave.

  Most people spend their lives trying to maintain control over who they are. You are choosing to let yourself be fundamentally rewritten. You are choosing to step into a future you cannot model, with a heart you cannot measure, to become a mother to a child you haven't met yet. You aren't just planning for a new addition to your family; you are consenting to become a new person.

  To the grad school folks here: yes, this is a leap of faith into the unknown. To the family here: this is love in its purest form.

  So, I'd like to raise a glass. Not to the "you" of today, who planned this dinner and packed the bags. But to the "you" of a few weeks from now, who will be someone new.

  To Mara, to the baby, and to the beautiful, unpredictable transformation ahead. Cheers.
