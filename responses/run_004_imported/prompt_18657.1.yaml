      *(Self-Correction during drafting)*: Make sure I don't imply adoption is *more* transformative than birth parenthood, but rather that *parenthood* is the transformative event, and adoption is the path she's chosen. Actually, the prompt implies the toast is about the baby coming home. The transformation is the arrival of the child.

