answer: |-
  This is a fantastic rabbit hole to be down. Your friend's "mass noun" shrug is partially right in a linguistic sense, but it misses the philosophical stakes. Gongsun Long (c. 320–250 BCE) wasn't just playing with grammar; he was pushing a specific metaphysical theory about how language hooks onto reality.

  To answer your core question: **Yes, there is a real, repairable logical point buried there, but it requires accepting a specific (and to modern ears, strange) ontology.** He isn't making a simple category mistake; he is deliberately conflating *concept identity* with *class membership* to make a point about the rigidity of names (*ming*).

  Here is the breakdown of where the argument works, where it breaks, and how to patch it with modern tools.

  ### 1. The Intension/Extension Distinction (The Strongest Fit)
  The most charitable and logically robust reading of the *White Horse Dialogue* is that Gongsun Long is distinguishing between **intension** (the concept/definition) and **extension** (the set of objects).

  *   **Premise 1 (Intension):** The concept `WHITE HORSE` = `SHAPE (HORSE)` + `COLOR (WHITE)`. The concept `HORSE` = `SHAPE (HORSE)`. Since `A + B ≠ A`, the concept `WHITE HORSE` is not identical to the concept `HORSE`.
  *   **Premise 2 (Extension/Pragmatics):** If you ask for a `HORSE`, the set of acceptable objects is {black horses, yellow horses, white horses...}. If you ask for a `WHITE HORSE`, the set is {white horses}. Since the sets of acceptable responses differ, the terms are not interchangeable.
  *   **Conclusion:** Therefore, `WHITE HORSE` is not `HORSE`.

  **Where it holds up:** In modern logic, the *intension* of "white horse" is indeed distinct from "horse." The predicate $W(x) \land H(x)$ is not identical to the predicate $H(x)$. Gongsun Long is absolutely correct that the *name* "white horse" is not the *name* "horse."

  **Where it breaks:** He slides from "The *name/concept* 'white horse' is not identical to the *name/concept* 'horse'" to "A *white horse* (the object) is not a *horse* (the object)."
  In set theory terms:
  *   True: $\{x \mid White(x) \land Horse(x)\} \neq \{x \mid Horse(x)\}$ (The sets are not identical).
  *   False: $\forall x (White(x) \land Horse(x) \rightarrow x \notin \{y \mid Horse(y)\})$ (No white horse is a member of the set of horses).

  Gongsun Long exploits the ambiguity of the Chinese particle *fei* (非), which serves as "is not." It can mean "is not identical to" (conceptually) or "is not a member of" (ontologically). He proves the former to assert the latter.

  ### 2. The "Request" Argument (Pragmatics)
  Your summary of the yellow/black horse bit is the strongest part of his case. This is a pragmatic argument about **conditions of satisfaction**.

  If language is a tool for getting things done (as the School of Names often argued), then two terms are "the same" only if they are interchangeable in all contexts without changing the outcome.
  *   Context: A request for a mount.
  *   Input A: "Get me a horse." -> Output: Yellow horse is acceptable.
  *   Input B: "Get me a white horse." -> Output: Yellow horse is rejected.

  Since the inputs yield different truth conditions for the yellow horse, the terms cannot be equivalent.

  **The Logical Patch:** This works perfectly if we interpret "is" as "is functionally equivalent to."
  *   $Request(Horse) \neq Request(White Horse)$
  *   Therefore, $Horse \neq White Horse$ (in terms of linguistic function).

  The "trick" is that he presents this functional inequality as an ontological inequality. He isn't saying the animal doesn't exist; he's saying the *designation* doesn't map to the same reality.

  ### 3. The Metaphysical Stakes: Realism about Universals
  This is where your friend's "mass noun" comment actually matters, but needs expanding. In Classical Chinese, nouns don't inherently distinguish between singular/plural or count/mass. "Horse" (*ma*) can easily mean "horseness" or "the universal Horse."

  Many scholars (like A.C. Graham and Chad Hansen) argue Gongsun Long is a **Realist about Universals** (similar to Plato).
  *   There is an abstract entity **HORSNESS**.
  *   There is an abstract entity **WHITENESS**.
  *   There is a compound abstract entity **WHITE-HORSNESS**.

  If you view the dialogue this way, the argument is **valid**.
  *   The universal **WHITE-HORSNESS** is not identical to the universal **HORSNESS**.
  *   Therefore, "White Horse" is not "Horse."

  He is not talking about the physical animal in the field; he is talking about the *names* as abstract entities. When he says "A white horse is not a horse," he means "The universal compound is not the universal simple." If you accept his Platonic ontology, there is no fallacy. The "fallacy" only appears if you assume he is talking about concrete particulars (individual animals).

  ### 4. Is it a "Cheap Trick"?
  It's not a cheap trick, but it is a **category error** by modern analytic standards. He is treating a relation of **subordination** (a white horse is a *kind* of horse) as if it were a relation of **identity** (a white horse is *the same thing as* horse-in-general).

  However, calling it a "trick" misses the point of the School of Names (*Mingjia*). Their goal wasn't necessarily to describe physical reality accurately, but to test the limits of language (*ming*) in governing reality (*shi*).
  *   **Confucians** wanted names to align with social roles (a "father" must act like a father).
  *   **Gongsun Long** wanted to show that names have rigid, logical boundaries that common sense ignores.

  By arguing "White Horse is not Horse," he is forcing you to admit that **specificity matters.** If you allow "White Horse is Horse," you blur the distinction between the specific and the general, which leads to sloppy governance and sloppy thinking.

  ### Summary: How to Restate it with Modern Tools
  If you want to "repair" the argument for your piece, you can frame it as a defense of **Intensional Logic** against **Extensional Collapse**.

  **The Repaired Argument:**
  1.  **Premise 1:** Two terms are identical only if they share the same intension (definition).
  2.  **Premise 2:** The intension of "White Horse" includes the property *White*. The intension of "Horse" does not.
  3.  **Intermediate Conclusion:** Therefore, the term "White Horse" is not identical to the term "Horse."
  4.  **Premise 3 (The School of Names Axiom):** If two terms are not identical, they cannot be predicated of each other without error. (This is the controversial metaphysical step).
  5.  **Final Conclusion:** To say "A white horse is a horse" is to predicate non-identical terms, which is logically false.

  **Verdict:**
  He is groping toward the **type/token distinction** and the difference between **class inclusion** vs. **concept identity**.
  *   **Modern Logic:** "White Horse" $\subset$ "Horse". (Subset relation).
  *   **Gongsun Long:** "White Horse" $\neq$ "Horse". (Identity relation).

  He isn't "wrong" that they aren't identical; he is "wrong" (by our standards) to think that lack of identity precludes class membership. But given that Classical Chinese lacks a copula ("is") that clearly distinguishes identity from predication, he isn't so much exploiting an ambiguity as he is **revealing** one. He's showing that our everyday language glosses over a massive logical gap between *concepts* and *objects*.

  So, for your piece: Don't treat him as a bumbling sophist. Treat him as a rigorous semanticist who decided that because the *map* (the name "white horse") is different from the *map* (the name "horse"), the *territory* must be different too. It's a hyper-realism about language that sacrifices common sense for logical purity.
