          *   In math, Square $\subset$ Rectangle is true. In OOP, `Square` : `Rectangle` is often false. Gongsun Long would say the math is the problem of "names," whereas in OOP, the implementation is the problem.
          *   Gongsun Long denies the subset relationship ("is not a horse"). In OOP, we usually admit the subset relationship but deny the *subtype* relationship.
      *   *Conclusion:* The School of Names validates the intuition that LSP violates. Don't trust the name; trust the contract.

  7.  **Refining the Tone:**
      *   Needs to be authoritative but open.
      *   Avoid academic waffle.
