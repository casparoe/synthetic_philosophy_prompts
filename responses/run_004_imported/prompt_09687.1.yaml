      *   *Verdict:* Gongsun Long is right that "White Horse" is a distinct *concept* with distinct *requirements*, even if it falls under the broader category. Similarly, `Square` is a distinct *behavioral type* from `Rectangle`, even if it fits the geometric definition. The error in OOP is assuming inheritance models *mathematical set inclusion* when it actually models *behavioral substitutability*.

