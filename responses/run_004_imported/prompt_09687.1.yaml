      *   **Context:** A workplace argument about `Square` inheriting from `Rectangle` (Liskov Substitution Principle - LSP).
      *   **Analogy:** A friend compared this to Gongsun Long's "White Horse Dialogue" (白馬非馬) from the Chinese School of Names (名家).
      *   **Specifics of the Dialogue:** The user summarizes three arguments from the dialogue:
          1.  Shape vs. Color (compound name $\neq$ simple name).
