  2.  **Analyze Gongsun Long's "White Horse is Not Horse":**
      *   *Core Thesis:* "White horse" (concept $A + B$) is not identical to "horse" (concept $A$).
      *   *Argument 1 (Metaphysical/Compositional):* "Horse" names the form/shape. "White" names the color. "White horse" names form + color. Therefore, the concept "white horse" $\neq$ concept "horse".
      *   *Argument 2 (Extensional/Pragmatic):* If you want a horse, a yellow one works. If you want a white horse, a yellow one fails. Therefore, the extension of "white horse" $\subset$ extension of "horse", but they are not equivalent.
      *   *Argument 3 (Intensional/Definitional):* "Horse" has no color constraint. "White horse" has a color constraint. Adding a constraint changes the definition.
      *   *Philosophical Stance:* The School of Names was concerned with *rectification of names* (正名). If names don't match reality (or if compound names are treated as simple names), social and logical order breaks down. It's about precision in reference.

  3.  **Analyze the Square/Rectangle Problem (LSP):**
      *   *Mathematical Truth:* A square *is* a rectangle (all sides equal implies opposite sides equal).
      *   *Computational Truth:* A mutable `Square` class *cannot* safely substitute for a mutable `Rectangle` class if the client expects to change width and height independently.
      *   *The Conflict:* Inheritance implies "is-a" (subtype polymorphism). But behavioral constraints (invariants) violate the contract of the supertype.
