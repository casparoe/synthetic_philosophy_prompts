      *   *Refining the "Bad Lot" vs. "Dutch Book" distinction:* The Bad Lot argument says IBE is *unreliable* (might pick a false hypothesis). The Dutch Book argument says IBE is *irrational* (violates probability axioms). This is a crucial distinction.

