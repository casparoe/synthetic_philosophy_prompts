answer: |-
  This is one of the most profound questions in moral philosophy, and it is excellent that you are grappling with it for your novel. The situation you describe is a textbook example of what the philosopher Thomas Nagel famously termed **"Moral Luck."**

  Specifically, this is "resultant moral luck": where two agents perform the same action with the same intent, but external factors beyond their control determine the outcome, leading to vastly different moral judgments.

  To give you the clear-headed answer you need for both your peace of mind and your manuscript, we have to separate **legal liability** from **moral culpability**, and **intent** from **outcome**.

  ### 1. The Moment of Decision: Equal Culpability
  From a deontological ethical framework (which focuses on duties and rules), your brother-in-law and his partner were **equally culpable** the moment they started their engines.

  Why? Because the ethical violation in drunk driving is not the *crash*; it is the *imposition of risk*. When a person chooses to drive impaired, they are making a unilateral decision to endanger every other person on the road. They are effectively saying, "My convenience is worth more than your safety."

  *   **The Partner:** Imposed risk + Harm occurred.
  *   **Your Brother-in-Law:** Imposed risk + No harm occurred (visible).

  In terms of the *choice* made, the moral weight is identical. Both men gambled with lives that were not theirs to gamble. The fact that your brother-in-law's gamble didn't pay out in tragedy was not due to his skill or virtue, but to chance (traffic patterns, the jogger's route, reaction times). If moral character is defined by our choices, not our luck, then your brother-in-law made the same moral error as the partner.

  ### 2. The Weight of Outcome: Why We Judge Differently
  If they are equally culpable in choice, why does society (and the law) treat them so differently?

  *   **The Legal Necessity:** The law is a blunt instrument. It generally requires *causation* to assign severe punishment. You cannot jail someone for a murder that didn't happen, even if they intended to kill. In your partner's case, the law punishes the *result* (manslaughter/negligent homicide). In your brother-in-law's case, the law might have punished the *act* (DUI), but without a crash, it often goes unseen.
  *   **The Human Reaction:** We are hardwired to respond to harm. Grief demands a target. The jogger's family needs someone to hold accountable for their loss. It is psychologically impossible for society to treat the partner as "unlucky" rather than "guilty," because a human being is dead.
  *   **Consequentialism:** From a utilitarian view, the partner's action was objectively "worse" because it resulted in a net loss of well-being (a death). Your brother-in-law's action resulted in no measurable net loss. Therefore, the *consequences* are different, even if the *risk* was the same.

  ### 3. The Ethical Failure of "A Scare"
  This is the crux of your friction with your brother-in-law. His description of the night as "a scare" reveals an ethical blind spot.

  By calling it "a scare," he frames the near-miss as a warning about *getting caught* or *almost crashing*, rather than a revelation of his own capacity for harm. It centers his experience (his fear, his relief) rather than the potential victim's reality.

  If he were ethically aligned with the gravity of his choice, he would likely view that night not as "I got lucky," but as "I was willing to be the kind of man who kills a jogger, and only luck prevented me from becoming one."

  **The Verdict:** They were equally reckless. They were equally morally culpable for the *risk*. They are not equally responsible for the *death* (only the partner is), but your brother-in-law is morally responsible for failing to recognize that his safety was a matter of chance, not competence.

  ### 4. Translating This to Your Novel
  For your book to hold up to scrutiny, you must avoid the trap of making the "lucky" character a cartoon villain or the "unlucky" one a pure martyr. The tension lies in the ambiguity.

  Here is how you can sharpen the ethical stakes in your narrative:

  **A. Avoid Retrospective Determinism**
  Do not write the story such that the partner "obviously" was more drunk or a worse driver. Keep the conditions as identical as possible. The tragedy must feel like chaos, not destiny. This forces the reader to sit with the uncomfortable truth that *they* could be the brother-in-law.

  **B. The Psychology of the "Lucky" One**
  Give your version of the brother-in-law a credible internal logic. He shouldn't think, "I don't care." He should think, "I am a good person. Good people don't kill joggers. Therefore, since I didn't kill a jogger, I am still a good person." This is cognitive dissonance. It allows him to minimize the event. The drama comes when something forces him to confront the idea that his "goodness" was protected only by luck.

  **C. The Resentment of the "Unlucky" One**
  The partner (or his family) might harbor a secret rage: not just at himself, but at the friend who got to walk away. This adds complexity. It's not just guilt; it's the injustice of the lottery.

  **D. The "Near Miss" as a Ghost**
  In your novel, the "scare" should haunt the lucky one, even if they deny it. Perhaps they become hyper-cautious in other areas of life to compensate. Perhaps they avoid that specific street. Show the cost of the luck, not just the freedom from consequences.

  ### Summary for Your Drafting
  To answer your specific question: **Yes, they were equally culpable the moment they got into their cars.** The outcome changes the *legal* and *social* consequences, but it does not change the *moral nature of the choice*.

  Your brother-in-law's refusal to acknowledge this is a failure of moral imagination. He is conflating "outcome" with "virtue." For your novel, the most compelling path is to explore how a "good person" reconciles the fact that they were capable of a terrible thing, and how they live with the ghost of the person they *could* have been if the traffic light had been ten seconds slower.

  That is where the true drama lies: not in the crash, but in the silence of the car that made it home.
