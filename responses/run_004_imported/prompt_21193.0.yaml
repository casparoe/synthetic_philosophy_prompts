answer: |-
  # The Rationality of Epistemic Akrasia

  Epistemic akrasia occurs when an agent holds a belief while simultaneously believing that they ought not hold it, or that their evidence does not support it. Formally, it is the state of believing $P$ while believing that one's belief that $P$ is irrational. For decades, the dominant consensus in epistemology has been the Enkratic Principle: such a state is constitutively irrational. To believe $P$ while admitting one lacks warrant for $P$ is viewed as a doxastic cousin of Moore's Paradox ("$P$, but I don't believe $P$"). It seems to fracture the unity of the rational agent.

  However, the rise of debates surrounding Higher-Order Evidence (HOE) has strained this consensus. Cases involving misleading evidence about one's own cognitive reliability—such as David Christensen's famous "Logic Puzzle" case—suggest that sometimes, respecting all available evidence requires becoming akratic. If a logician solves a puzzle flawlessly but then receives credible testimony that they have ingested a reasoning-impairing drug, it seems they ought to doubt their reasoning *without* necessarily abandoning the solution derived from the proof before them.

  This essay argues against the strict Enkratic Principle defended by Sophie Horowitz and Jeremy Weisberg. While their concerns about self-undermining beliefs are potent, they rely on a conflation of first-order evidence with higher-order reliability assessments. I defend the verdict that **epistemic akrasia is rational if and only if the higher-order evidence targets the reliability of the cognitive faculty without providing a direct first-order defeater for the proposition itself.** In these specific "pure HOE" cases, level-splitting (maintaining $P$ while doubting one's justification) is the only way to respect the totality of evidence.

  ### The Case Against Akrasia: Self-Undermining and Transparency

  The strongest case against the rationality of akrasia comes from Sophie Horowitz. In "Akrasia and Uncertainty," Horowitz argues that akratic states are inherently self-undermining. Her argument rests on the transparency of rational requirements. If an agent believes that they ought not believe $P$, they are effectively believing that their evidence does not support $P$. If they simultaneously believe $P$, they are in a state where they believe their own belief is baseless. Horowitz contends that this generates a rational dilemma: if the agent follows the higher-order belief, they must abandon $P$; if they follow the first-order belief, they must abandon the judgment that they are irrational. To remain in both is to fail to respond to one's own assessment of the normative situation.

  Jeremy Weisberg offers a complementary objection in "Could've Thought Otherwise." He argues that when faced with evidence of cognitive impairment, the rational response is suspension of judgment, not level-splitting. If I believe I might be impaired, I must acknowledge that I "could have thought otherwise" given the same evidence. If my reasoning process is compromised, the output of that process is tainted. To maintain belief in $P$ is to trust the very process I have just indicted. For Weisberg, the only coherent response to HOE that suggests error is to downgrade confidence in $P$ directly, thereby dissolving the akrasia.

  These arguments are compelling because they preserve the ideal of the unified rational agent. They suggest that rationality is a holistic property; you cannot compartmentalize your belief from your evaluation of that belief. If the Enkratic Principle holds, then in the Drug Case, the logician must either ignore the doctor (maintaining confidence in $P$) or abandon the solution (dropping $P$).

  ### The Case for Level-Splitting: The Total Evidence View

  The problem with the Horowitz/Weisberg view is that it fails to account for the distinct evidential weight of Higher-Order Evidence. David Christensen's conciliationist approach highlights that evidence comes in layers. In the Drug Case, there are two distinct bodies of evidence:
  1.  **First-Order Evidence (FOE):** The logical proof on the page. This evidence strongly supports $P$.
  2.  **Higher-Order Evidence (HOE):** The doctor's testimony. This evidence supports the proposition "My cognitive process regarding $P$ is unreliable."

  If the logician abandons $P$ entirely (as Weisberg suggests), they are effectively treating the HOE as a first-order defeater. But the doctor's testimony does not say "$P$ is false." It says "You are bad at calculating $P$." The proof on the page remains valid. If the logician ignores the doctor (as a strict Enkratic view might force them to do to avoid akrasia), they are dogmatically ignoring relevant evidence about their own reliability.

  Christensen argues that the only way to respect *both* bodies of evidence is to "split the levels." The agent believes $P$ (because the proof is right) but believes they are not justified in believing $P$ (because the drug makes them untrustworthy). This looks like akrasia, but it is actually a precise mapping of the evidential landscape. To demand the agent drop $P$ is to demand they treat the HOE as evidence against the *world*, when it is actually evidence against the *mind*.

  ### Defending Rational Akrasia: The Reliability Condition

  The debate turns on whether the "self-undermining" charge holds water in cases of pure reliability defeat. Horowitz assumes that if I believe I am irrational, I must think I lack evidence. But in HOE cases, I *have* the evidence (the proof), I just have reason to think I cannot *access* it reliably.

  Here lies the justification for my verdict: Epistemic akrasia is rational **only when the higher-order evidence targets the reliability of the cognitive faculty without providing a direct first-order defeater for the proposition itself.**

  This condition is crucial. It distinguishes between two types of HOE:
  1.  **Defeating HOE:** Evidence that suggests $P$ is likely false (e.g., a peer tells me they calculated $\neg P$).
  2.  **Undermining HOE:** Evidence that suggests my *grasp* of the support for $P$ is compromised (e.g., the drug case).

  In Defeating HOE cases, Weisberg is right: suspension is required. If a peer disagrees, that is evidence about the truth of $P$. But in Undermining HOE cases, the truth of $P$ is insulated from the reliability of the agent. A logical truth is true regardless of whether the thinker is drugged.

  Horowitz's objection fails here because it assumes that rational belief requires a transparent link between "I believe $P$" and "I am justified in believing $P$." But in Undermining HOE cases, that link is severed by external factors. The agent is in a tragic position: the world (via the proof) says $P$, but their interface with the world (their brain) is flagged as faulty.

  If the agent drops $P$, they privilege the HOE over the FOE. If they keep $P$ with full confidence, they privilege the FOE over the HOE. The akratic state—believing $P$ while believing one is unjustified—is the only state that acknowledges the validity of the proof *and* the compromised nature of the prover. It is not a failure of rationality; it is a rational response to a fractured epistemic environment.

  Furthermore, Weisberg's "Could've Thought Otherwise" argument conflates modal flexibility with error probability. In the Drug Case, the logician does not think they could have validly reasoned to $\neg P$ (logic is necessary). They think they might have *miscalculated*. Acknowledging the possibility of miscalculation lowers confidence in the *process*, but it does not negate the *proof* sitting on the desk. Therefore, maintaining belief in the conclusion of the proof while doubting one's ability to have derived it correctly is not self-undermining; it is an acknowledgment of the distinction between objective support and subjective access.

  ### The Verdict

  The Enkratic Principle is a useful heuristic for normal epistemic conditions, where first-order and higher-order evidence align. However, it is not a constitutive norm of rationality. To claim that akrasia is *always* irrational is to prioritize the coherence of the agent over the accuracy of the evidence.

  Therefore, the verdict is this: **Epistemic akrasia is rational when an agent possesses undefeated first-order evidence for $P$ alongside compelling higher-order evidence that their cognitive access to that evidence is compromised.**

  In these conditions, the akratic state is not a bug of human rationality, but a feature. It allows the agent to track the truth of $P$ (via the FOE) while simultaneously tracking the truth about their own reliability (via the HOE). To force the agent to resolve the tension by dropping $P$ would be to force them to lie about the first-order evidence. To force them to resolve it by ignoring the drug would be to force them to lie about their reliability.

  Rationality is not always a state of serene coherence. Sometimes, when the evidence about the world conflicts with the evidence about our minds, rationality looks like a fracture. We ought to accept that in a world full of misleading higher-order evidence, the rational agent is sometimes one who believes, while knowing they shouldn't.
