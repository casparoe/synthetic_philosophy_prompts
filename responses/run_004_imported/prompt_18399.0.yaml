answer: |-
  This is a classic communication dilemma, and it is incredibly frustrating because it sits right on the border of semantics and ethics. You are not overreacting. What your roommate did has a name in psychology and ethics: **paltering.**

  Paltering is the act of using truthful statements to create a false impression. It is distinct from lying (stating falsehoods) and distinct from omitting (staying silent), but functionally, it often achieves the exact same result: deception.

  Here is a breakdown of the principled differences, the ethics of communication, and where the responsibility actually lies.

  ### 1. Is there a principled difference between this and lying?

  **Semantically: Yes.**
  **Ethically and Functionally: No.**

  Your Friend A is taking a **literalist** view. In a court of law or a logic puzzle, truth conditions matter above all else. If the statement "I paid for some groceries" corresponds to reality (she paid $9), then the proposition is true.

  However, human communication does not operate like computer code or legal depositions. It operates on **Conversational Implicature**, a concept developed by philosopher Paul Grice. Grice argued that conversation is a cooperative act governed by unspoken rules (maxims). Two of them are relevant here:
  *   **The Maxim of Quantity:** Make your contribution as informative as is required. (Don't hide relevant info).
  *   **The Maxim of Manner:** Avoid ambiguity and be orderly.

  When you ask a roommate about shared costs, the context implies you are asking about *significant* contribution toward the shared goal. By saying "some," she leveraged the ambiguity of the word to trigger an implication ("she paid a reasonable amount") that she knew was false, while hiding behind the literal truth ("she paid non-zero dollars").

  Most ethicists argue that the moral wrong of lying is not the falsity of the statement, but the **intent to deceive.** If she chose those specific words because she knew you would infer she paid more than $9, she intended to deceive you. Therefore, ethically, this is indistinguishable from lying. It is, as you put it, lying with better PR.

  ### 2. Who is responsible for the gap?

  The responsibility lies primarily with **her**, not you.

  Here is why the "you assumed too much" defense is a cop-out:

  **Information Asmetry**
  She knew exactly how much she spent ($9). You did not. In any communication, the person with the private information bears the burden of representing it accurately. She used her private information to craft a statement she knew would mislead you. You cannot be blamed for making a reasonable inference based on the information the other party voluntarily provided.

  **Contextual Norms**
  Language is context-dependent. If you ask a contractor, "Have you fixed some of the plumbing?" and they tightened one screw, saying "Yes" is misleading. If you ask a roommate, "Did you pay for some groceries?" in the context of a 50/50 split, the pragmatic meaning of "some" is "a contribution consistent with our agreement."
  *   **Literal meaning:** $>0.
  *   **Pragmatic meaning:** A non-trivial amount.

  She relied on the literal meaning to escape blame, but she used the pragmatic meaning to get you off her back initially. You cannot have it both ways. You cannot invite a pragmatic inference to avoid conflict and then retreat to literal semantics when caught.

  **The "Technically True" Trap**
  If we accept your roommate's logic (that literal truth absolves you of misleading implications), honest communication becomes impossible. Anyone could say "I have never stolen money from the company" (technically true, because they stole assets instead) or "I didn't have sex with that woman" (depending on your definition of sex). We generally agree in society that these are lies because they violate the spirit of the inquiry.

  ### 3. Why this feels worse than a normal lie

  Paltering often feels more insulting than a flat-out lie because it treats you like an adversary rather than a partner.
  *   **A lie** assumes you would disagree with the truth, so they hide it.
  *   **Paltering** assumes you are not smart enough to catch the trick, or that they can gaslight you later by saying "I never said that."

  Your roommate's defensiveness ("that's kind of on you for reading into it") is a form of gaslighting. She is asking you to distrust your own reasonable interpretation of social cues in favor of her semantic loopholes.

  ### The Verdict

  Your Friend B is right. Deliberately engineering a false impression is the functional definition of deception. The "technical truth" is a shield, not a virtue.

  **How to handle it:**
  Since you live together, you need to close the loophole. You don't need to convince her she's unethical (she likely knows and doesn't care), but you do need to change the protocol.
  1.  **Stop relying on verbal updates.** You already use Splitwise. That is the source of truth.
  2.  **Set a communication boundary.** "In the future, please don't give me estimates or vague answers about money. If I ask what you've paid, please just send me the Splitwise screenshot. I'd rather wait for the data than get a verbal summary."
  3.  **Don't argue semantics.** If she tries the "I didn't technically lie" argument again, shut it down. "I'm not interested in semantic debates. I'm interested in transparency. When you use vague language that minimizes your contribution, it breaks my trust. Please just be direct."

  You aren't crazy for feeling buged by this. It was a breach of trust disguised as a statement of fact.
