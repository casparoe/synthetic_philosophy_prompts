answer: |-
  This is one of the most profound and unsettling puzzles in the history of ideas. You have put your finger on a tension that goes beyond mere biographical trivia and strikes at the heart of what philosophy claims to be. The discomfort you feel is not a bug in your moral reasoning; it is a feature of the collision between Frege's ontology and Frege's biography.

  To answer your central question: **No, the distinction between the work and the person is not too tidy to survive, but it is far more porous than Frege wished to admit.** And yes, there is a principled way to draw the line, provided we clarify what we mean by "evaluate."

  Here is a way of thinking through this that might serve both your philosophical curiosity and your novelistic aims, without resorting to the cliché of "separating the art from the artist."

  ### 1. Validity vs. Genesis (The Principled Line)
  Frege's anti-psychologism rests on a distinction that Reichenbach later codified as the **context of justification** versus the **context of discovery**.
  *   **Context of Discovery:** How did Frege come to think of quantificational logic? What were his psychological drives, his cultural biases, his political fears?
  *   **Context of Justification:** Do the proofs hold? Is the system consistent? Does the distinction between *Sinn* (sense) and *Bedeutung* (reference) illuminate language?

  In the context of *justification*, Frege's politics are irrelevant. The law of non-contradiction does not become false because its architect hated Jews. If your fictional logician discovers a truth, it remains true regardless of his bigotry. To suggest otherwise is to commit the genetic fallacy, which ironically validates the very psychologism Frege fought against. If logic depends on the moral purity of the logician, then logic is not objective; it is merely a sublimated form of ethics.

  However, in the context of *discovery* and *significance*, the biography matters immensely. It matters for understanding *why* he sought certainty in a "third realm."

  ### 2. The Tragic Irony of the "Third Realm"
  You noted the self-undermining quality of your discomfort. But consider this inversion: The diary does not invalidate Frege's logic; it vindicates his diagnosis of the human mind while simultaneously condemning the man.

  Frege argued that human minds are messy, subjective, and prone to error (psychologism), which is why we need objective logical structures. His diary proves he was right about the human mind—specifically his own. He was incapable of applying his own demand for objectivity to the social and political sphere. He could see that truth must be independent of the thinker in mathematics, but he could not see that human worth must be independent of ethnicity in politics.

  This suggests a principled way to evaluate him: **Frege's intellectual achievement is a monument to human capacity; his diary is a monument to human limitation.** The tragedy is not that his logic is tainted, but that his "third realm" was a refuge. One can read the longing for a dictator and the stripping of rights as a desperate attempt to impose the rigidity of logic onto the messiness of human society. He wanted the political world to behave like numbers: clean, hierarchical, and unambiguous.

  So, does it bear on his achievement? It bears on the *cost* of that achievement. It suggests that his ability to access the "third realm" required a kind of dissociation from the human realm that had moral consequences.

  ### 3. Implications for the Novel
  You asked whether letting this shadow fall across your fictional logician would be a "cheap trick." It would only be a cheap trick if you use it to invalidate his work or to signal to the reader that he is "evil."

  If you want to capture the stakes of the real case, consider these approaches:

  **A. The Dissociation, Not the Villainy**
  Don't make him a mustache-twirling antagonist. Make him a man who genuinely believes his bigotry is a form of clarity. In the Weimar Republic, chaos was the enemy. To a logician, democracy looks like noise, compromise, and contradiction. A strong leader looks like an axiom. His antisemitism might not stem from hatred in the visceral sense, but from a categorizing impulse gone wrong—a desire to purify the system. This makes him more terrifying and more tragic. He isn't breaking his own rules; he is applying them to the wrong domain.

  **B. The Reaction of Others**
  The tension you feel is dramatic fuel. How do his students or colleagues react?
  *   **The Defender:** "His politics are regrettable, but look at the *Begriffsschrift*. You can't burn the logic."
  *   **The Critic:** "How can a man who cannot see the humanity of his neighbors claim to see the structure of truth?"
  *   **The Logician Himself:** He should be baffled by the accusation that his politics matter. To him, they are separate categories. This bafflement is the dramatic manifestation of anti-psychologism.

  **C. The Weimar Context**
  Frege's diary is not just about hate; it is about *fear*. It is the fear of a crumbling order. Your character lives in a world where money is worthless, governments rise and fall in months, and violence is in the streets. His retreat into the "third realm" of eternal truths is a survival mechanism. The diary is the crack in the armor where the fear leaks out. If you portray his politics as a symptom of his epistemological longing for stability, you elevate it from a biographical footnote to a thematic core.

  ### 4. A Verdict on Evaluation
  To return to your philosophical question: How ought we to evaluate him?

  We must evaluate him on two axes that intersect but do not cancel each other out.
  1.  **As a source of tools:** His tools remain sharp. We use his logic because it works, not because he was good.
  2.  **As a case study in rationality:** He is now evidence that high rationality in one domain does not inoculate against irrationality in another. In fact, it may enable it.

  Michael Dummett was shaken because he realized that Frege's philosophy of language relies on the idea that communication is a cooperative effort to grasp objective thoughts. Frege's politics revealed a man who fundamentally denied that certain people were capable of participating in that cooperation. It creates a fissure between the *theory of meaning* (which is inclusive and objective) and the *practice of life* (which was exclusive and prejudiced).

  ### Summary for the Writer
  You do not need to choose between "Frege the Genius" and "Frege the Bigot." The truth is the dissonance between them.

  If you hide the politics, you sanitize history and miss the tragedy of a mind that could map the universe but not its own country. If you let the politics invalidate the logic, you commit the error of psychologism.

  The most honest portrayal is to let the character stand as a warning: **Objectivity is not a moral virtue.** It is a cognitive tool. A person can wield that tool with masterful precision while remaining morally blind. That is not a contradiction in the logic; it is a contradiction in the soul. And for a novel set in the dying days of the Weimar Republic, where so many intelligent people chose order over justice, that contradiction is the very theme of the era.

  Let the shadow fall, not to darken the work, but to illuminate the cost of the mind that built it.
