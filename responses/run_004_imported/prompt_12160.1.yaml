answer: |-
  **Setting:** *The lounge of the Marriott near the convention center. 11:30 PM. The noise has died down to the clink of ice and the hum of the HVAC. Two bioethicists, ELENA and MARCUS, are nursing scotches. They've just come from a panel on "The Limits of Therapy."*

  **Marcus:** (Swirling his glass) You let them off the hook too easy up there, Elena. That question from the endocrinologist in the front row? The one about the two kids standing next to each other at the pharmacy counter? You waved it away.

  **Elena:** I didn't wave it away. I said the distinction holds. One has a broken engine; the other has a small engine.

  **Marcus:** A broken engine? Please. We're talking about the somatotropic axis. In the ISS kid—the Idiopathic Short Stature case—the axis isn't broken. It's working exactly as designed for *that* genome. It's just at the tail end of the bell curve. But you give them both recombinant hGH, and you get the same centimeter gain. The physiology is continuous. The moral line you're drawing is discrete. That's a category error.

  **Elena:** It's not a category error if the line does normative work. Look, I know the biology is a continuum. I know the 2.5 standard deviation cutoff for "deficiency" is statistically arbitrary. But justice requires administrative bright lines. If we say healthcare justice is about restoring "normal species functioning"—Boorse, Daniels, the whole lineage—then we have a claim on social resources when we fall *below* the range of typical functioning.

  **Marcus:** But why is "typical" the moral anchor? That's the is-ought problem wrapped in a lab coat. If being 4'10" at age ten imposes the exact same social handicap, the exact same psychological burden, and the exact same reduction in future opportunity on Kid B as it does on Kid A, why does Kid A's pituitary status grant him a claim on justice that Kid B is denied?

  **Elena:** Because Kid A has been *harmed* by a pathological process. Kid B has not. Kid B is just... variation. If we fund Kid B, we aren't repairing a deficit; we're bidding up the norm. That turns healthcare into an arms race.

  **Marcus:** (Leans forward) There's the rub. You're worried about the arms race. I'm worried about the kid getting left behind. You say Kid B isn't harmed. But shortness *is* a disability in this society. Wages correlate with height. Authority correlates with height. If the medical technology exists to mitigate that disadvantage, and you deny it to Kid B solely because his IGF-1 levels are statistically "normal," you aren't protecting justice. You're fetishizing the biomarker over the human outcome.

  **Elena:** I'm not fetishizing the biomarker. I'm protecting the concept of "need." If we decouple treatment from pathology, then "need" becomes infinite. Every parent wants their kid taller, smarter, faster. If we ground justice in welfare or opportunity alone, without the constraint of normal functioning, then every disadvantage becomes a medical claim. That bankrupts the system.

  **Marcus:** That's a slippery slope, Elena, and you know it. We can set limits without relying on a fictional biological binary. We could say, "We treat short stature when it causes significant impairment of opportunity, regardless of etiology." We ration by severity of handicap, not by the whims of the pituitary.

  **Elena:** But who measures the handicap? That's subjective. A biomarker is objective.

  **Marcus:** Is it? The biomarker is only relevant because we've decided it's the gatekeeper. You're using the *cause* of the shortness to determine the *justice* of the intervention, when the *effect* is identical. It's like saying we'll only give wheelchairs to people paralyzed by polio, but not to people paralyzed by a car accident, because one is a "disease" and the other is "bad luck."

  **Elena:** (Pauses, takes a sip) That's a strong analogy. But here's the counter. Polio and the car accident both result in a loss of function relative to the species design. The ISS kid doesn't have a loss of function. He has a different function. If we medicalize normal variation, we pathologize the kid. We tell him, "You are sick." That changes his self-conception.

  **Marcus:** He already knows he's different. The schoolyard told him that yesterday. The "sick" label comes from the denial, not the treatment. If you tell him, "You're healthy, so you don't get the drug that would let you play on the basketball team," you're telling him his health is more important than his life.

  **Elena:** But if we pay for the ISS kid, we validate the idea that shortness is a defect. We reinforce the social prejudice rather than fighting it. The justice move is to fix the society that discriminates against short people, not to drug the kids to fit the prejudice.

  **Marcus:** (Laughs dryly) Ah, the "change society" defense. Classic. Look, I'm all for changing society. But that takes a generation. This kid is twelve. Daniels talks about "fair equality of opportunity." He argues that medicine's job is to protect the normal range of opportunity. But if the normal range of opportunity *requires* a certain height to access, then restoring the kid to his "genetic potential" doesn't actually restore his opportunity. It just locks him into a disadvantaged caste.

  **Elena:** So you'd have medicine compensate for social injustice?

  **Marcus:** I'd have medicine mitigate severe disadvantages where it can do so safely, without asking for a metaphysical certificate of "pathology."

  **Elena:** But without that certificate, you have no principle of limitation. Why stop at height? Why not cognitive enhancement? If the metric is "opportunity," and IQ correlates with opportunity even more strongly than height...

  **Marcus:** Now you're panic-driving. We draw lines all the time without biological absolutes. We decide what counts as a "reasonable accommodation." We could decide that height correction is a reasonable accommodation for severe shortness, but cognitive enhancement is off the table because it alters personal identity in a way height doesn't.

  **Elena:** Does it? Height affects how the world treats you. It shapes identity profoundly.

  **Marcus:** Touché. But here's my real problem with your "normal functioning" line. It assumes the current distribution of traits is neutral. It's not. It's a historical artifact. By saying we only fix "broken" things, you're saying the status quo of human variation is the moral baseline. But if the "normal" range includes levels of functioning that prevent a decent life, why is "normal" the goal?

  **Elena:** Because "normal" is the only shared baseline we have that isn't purely utilitarian. If we go purely welfare-based, we have to compare Kid B's welfare gain against the cost to the pool. But you want to bypass the "pathology" check entirely. My fear is that once you admit enhancement is a matter of *justice*—not just consumer choice, but something owed—you make citizenship contingent on biological optimization.

  **Marcus:** I'm not saying enhancement is owed. I'm saying the distinction between therapy and enhancement is useless in this specific case. It's a spectrum. The ISS kid is close enough to the deficiency kid that the moral difference is negligible. The "normal functioning" line creates a moral cliff where there is only a slope.

  **Elena:** (Sighs) Okay. Let's grant the slope. Let's grant the biology is continuous. But institutions can't run on slopes. They run on rules. If I'm the administrator of a public health plan, and I approve GH for the ISS kid, I have no principled way to deny the kid who is 3 inches taller but still wants to play basketball.

  **Marcus:** You deny him because his impairment isn't severe enough. You use a functional cutoff, not a hormonal one. You say, "Are you significantly impaired in daily living?"

  **Elena:** And then every parent coaches their kid to fail the psych eval.

  **Marcus:** And with the hormonal cutoff, parents coach their kids to fail the stimulation test. Or they lobby to have the statistical cutoff moved from 2.5 SD to 2.0 SD. Which happens, by the way. I've seen the guidelines shift.

  **Elena:** (Stiffens) They shift because the data changes.

  **Marcus:** They shift because the market demands it. The "medical necessity" line is porous, Elena. It leaks. My point is, if it's going to leak anyway, why not ground the leak in something real? Like the kid's actual suffering or opportunity loss, rather than a lab value that might be a statistical artifact?

  **Elena:** Because the lab value is the only thing that stops medicine from becoming a service industry for parental anxiety. If we admit we are enhancing, we admit we are optimizing. And once we are optimizing, we are eugenics-adjacent. We are selecting for traits we value.

  **Marcus:** We're already doing that. We select for height by treating the deficient kid. We've already decided height is valuable. We're just pretending we aren't because the *cause* of the shortness was a disease. But the value judgment is the same. You're just hiding the value judgment behind the pathology.

  **Elena:** (Quietly) I'm not hiding it. I'm containing it. I agree height is valuable. I agree shortness is a handicap. But I believe justice is about restoring the citizen to the starting line, not giving them a better pair of shoes. The GH-deficient kid fell behind the starting line due to bad biological luck. The ISS kid was born at the back of the pack.

  **Marcus:** But if the back of the pack is a place of systemic disadvantage, and we have the technology to move them forward... isn't refusing to help them just a way of washing our hands of the inequality? You're saying, "Nature made you short, that's not a disease, so good luck with the discrimination."

  **Elena:** I'm saying society shouldn't discriminate.

  **Marcus:** Society *does*. And while you wait for society to grow up, the kid gets crushed.

  **Elena:** (Finishes her drink) So your solution is to medicalize the social prejudice?

  **Marcus:** My solution is to stop pretending the biology dictates the morality. The biology is just the mechanism. The morality is about what we owe each other. If we owe each other a fair shot, and height determines the shot, then the pituitary gland shouldn't be the gatekeeper of justice.

  **Elena:** And if we owe each other a world where we don't have to drug our children to be treated with dignity?

  **Marcus:** (Raises his glass) Then we have a lot more work to do than writing prescription pads.

  **Elena:** (Clinks glass) Agreed. But until that world exists, I'm keeping the bright line. It's flawed, but it's the only dam we have against the flood.

  **Marcus:** Just pray the water doesn't rise over the top.

  **Elena:** It already is. That's why we're still talking about it.

  *(They drink. The silence between them is comfortable, the kind shared by people who know the argument won't end tonight, or ever.)*
