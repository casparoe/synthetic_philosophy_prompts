answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother. And for those who do know me, you know I'm the one who tends to turn family gatherings into lectures. So, I promise to keep the footnotes to a minimum.

  In my work, I often talk about how we become human. There is a popular idea that we are born as complete, independent selves, and then we go out and choose relationships like accessories. But in the tradition I study, we believe the opposite: we are not nouns; we are verbs. We are the sum of the ways we live with others. You are not a "self" who happens to be a son, or a brother, or a friend. You *are* those relationships.

  Today, [Brother's Name] and [Partner's Name], you are not just signing a contract. You are undertaking a profound act of self-creation. You are stepping into a role that will fundamentally rewrite who you are.

  Now, classical Confucian texts describe the relationship between husband and wife using a tricky word: *bie*, meaning "distinction." Historically, this was often used to enforce rigid gender roles—separate spheres, inner and outer. Many modern thinkers, myself included, reject that hierarchy. But I think there is a deeper wisdom in "distinction" if we clean off the dust of history.

  It doesn't mean you have different jobs based on gender. It means you honor the fact that you are *not* the same.

  There is an old saying: "Harmony is not sameness." If you add water to water, you just get more water. But if you add tea to water, you get something new. Marriage isn't about merging until you are indistinguishable. It's about maintaining enough distinction to challenge each other, to surprise each other, and to create a harmony that neither of you could achieve alone. Your differences are not obstacles to be overcome; they are the very material from which you will build a life.

  And this creation ripples outward. Because you are changing, we are all changing. I am no longer just the older brother who looked out for a kid; I am becoming an uncle to the family you will build. Our parents are seeing their roles shift from guardians to elders. [Partner's Name]'s family is welcoming a new son. The entire web of connections in this room vibrates differently because of the bond you two are forming.

  So, my wish for you is not that you "find yourselves" in each other. You are already whole. My wish is that you *make* yourselves in each other. That you lean into the distinction, honor the difference, and cultivate a harmony that is robust enough to hold you both.

  Please raise your glasses. To the new roles, to the widening web, and to the harmony of [Brother's Name] and [Partner's Name].
