      *   **User:** Software engineer, early 40s. Observing ageism (senior colleagues managed out, perceived as slow/expensive/not hungry).
      *   **Source Material:** Cicero's *De Senectute* (On Old Age), specifically the arguments put in the mouth of Cato the Elder.
