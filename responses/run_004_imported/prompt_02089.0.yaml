      *   *Counterfactual:* "If Oswald hadn't killed Kennedy, someone else would have." (False). Why? Because we are imagining a world where the cause (Oswald's action) is removed. In that world, there's no conspiracy ready to step in. The effect (Kennedy's death) is not held fixed; it depends on the cause.
      *   *Key Mechanism:* The indicative conditions on *known facts* (Kennedy is dead), while the counterfactual conditions on *causal possibilities* (what would happen if the event didn't occur). The divergence arises because the consequent is known to be true in the actual world, but depends causally on the antecedent being false.

