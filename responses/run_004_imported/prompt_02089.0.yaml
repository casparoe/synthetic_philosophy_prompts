answer: |-
  **Domain:** Software Engineering / System Failure

  **Scenario:** A critical server crashed overnight. Two independent software updates had been installed simultaneously: *Patch Alpha* and *Patch Beta*. Post-mortem analysis confirms that the crash was definitely caused by a bug in one of these two patches, and specifically that *Patch Alpha* was the culprit (while *Patch Beta* was stable).

  **The Pair:**
  1.  **Indicative:** "If *Patch Alpha* didn't crash the server, *Patch Beta* did."
  2.  **Counterfactual:** "If *Patch Alpha* hadn't crashed the server, *Patch Beta* would have."

  **Truth Values:**
  *   The **Indicative** is **True**.
  *   The **Counterfactual** is **False**.

  **Explanation of the Divergence:**
  The gap arises because the indicative conditional is **epistemic**, while the counterfactual is **ontic (causal)**. When evaluating the indicative, we hold the known fact (the server crashed) fixed and reason backward from the effect to the cause; if we learn Alpha wasn't the cause, our evidence forces us to conclude Beta must have been. When evaluating the counterfactual, we imaginatively remove the actual cause (Alpha's bug) and project forward; in that nearest possible world, the crash does not occur, and the stable Patch Beta does not suddenly become destructive.
