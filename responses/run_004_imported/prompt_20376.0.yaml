answer: |-
  Here are 10 questions designed to corner the Common Prior Assumption (CPA) without being dismissive, along with the likely dodges and the follow-ups to keep the pressure on.

  ### 1. The Aumann Decomposition
  **Question:** "Aumann's Agreement Theorem relies on two heavy lifting beams: the Common Prior Assumption and Common Knowledge of Posteriors. When we observe persistent disagreement in the wild, your move is to say the type space was mis-specified. But isn't it equally plausible that the priors are fine, but the *Common Knowledge* condition is the one failing? How do you disentangle whether the disagreement is due to a violation of rationality (different priors) versus a violation of information structure (lack of common knowledge)?"

  *   **Likely Dodge:** "In a fully specified model, common knowledge of the model structure is assumed. If they disagree, they aren't in the same model."
  *   **Follow-up:** "But that assumes the model *is* the world. If I can't empirically distinguish between 'we have different priors' and 'we don't know what the other knows,' isn't the Common Prior Assumption doing no explanatory work? It becomes a label we slap on disagreement rather than an explanation of it."

  ### 2. The Origin Story
  **Question:** "Let's talk about the genealogy of the prior. If the common prior is a requirement of rationality, not just a modeling convenience, where does it come from? If two agents have never met and have distinct sensory histories, what metaphysical mechanism ensures their probability distributions over states of the world are identical at time zero? Is rationality ahistorical?"

  *   **Likely Dodge:** "It's a consistency requirement, like logic. Two rational agents shouldn't interpret the *same* evidence differently, regardless of history."
  *   **Follow-up:** "But priors precede evidence. You're essentially arguing for a 'View from Nowhere.' If I grew up in a high-inflation economy and you didn't, our *priors* on monetary policy differ. Are you saying one of us is logically incoherent, or just that we should ignore our history?"

  ### 3. The No-Trade Theorem Challenge
  **Question:** "If the CPA holds and posteriors are common knowledge, the Milgrom-Stokey no-trade theorems suggest speculative trading shouldn't happen. Yet, real markets are drowning in speculative volume. To save the CPA, do we have to conclude that the vast majority of Wall Street is systematically irrational, or does the sheer volume of trade suggest the CPA is false?"

  *   **Likely Dodge:** "Most volume is noise trading, liquidity shocks, or hedging, not speculative disagreement based on information."
  *   **Follow-up:** "Even informed traders trade against other informed traders. If the CPA is a *rationality requirement*, then every time a hedge fund bets against another, at least one is being irrational. That makes 'rational markets' a contradiction in terms. Are you comfortable with that?"

  ### 4. Higher-Order Uncertainty
  **Question:** "There's a subtle issue in the epistemic logic here. For Aumann's result to hold, do the agents need to know *that* they share a common prior? If I suspect you have a biased prior, I won't update on your announcement the way the theorem requires. So, doesn't the theorem actually require Common Knowledge *of the Common Prior,' not just the prior itself?"

  *   **Likely Dodge:** "In the formalism, the prior is part of the state space description, which is common knowledge by definition."
  *   **Follow-up:** "That works in the math, but not in the room. In real epistemic interactions, I don't know your priors. If I *think* you're biased, I won't agree with you, even if we actually share a prior. So the theorem fails precisely when we need it most: when trust is low."

  ### 5. The "Gerrymandered State Space" Worry
  **Question:** "Your standard response to disagreement is that the information partition was mis-specified—that if we added more states, the disagreement would vanish. But isn't there a risk of gerrymandering? If I can always explain away disagreement by adding a state like 'Agent 1 is confused,' doesn't that make the theory unfalsifiable?"

  *   **Likely Dodge:** "It's not about adding arbitrary states; it's about finding the *true* granularity of the information."
  *   **Follow-up:** "Who adjudicates what the 'true' granularity is? If the only way to verify the CPA is to find a partition where everyone agrees, and you assume such a partition *must* exist, aren't you reasoning in a circle?"

  ### 6. The Economist's Dilemma
  **Question:** "Look at your own field. Economists with the same data, same training, and same models persistently disagree on fiscal multipliers or inflation targets. If the CPA is a rationality requirement, does this mean the economics profession is collectively irrational? Or is it possible that rational agents with identical training can still diverge?"

  *   **Likely Dodge:** "Economists are boundedly rational, and the CPA is an idealization for fully rational agents."
  *   **Follow-up:** "If the idealization fails for the people who built the model, why should we trust it for the agents in the model? If the experts on rationality don't converge, why should the market?"

  ### 7. The Identification Problem
  **Question:** "In empirical work, there's a well-known identification problem between 'different priors' and 'private information.' If I see you betting differently than me, I can model that as you having a different prior, or you having a signal I don't see. Since you can always model a prior difference as an information difference, isn't the CPA just a choice of parameterization?"

  *   **Likely Dodge:** "Harsanyi showed we can convert prior differences into information differences, but the Common Prior is the more parsimonious assumption."
  *   **Follow-up:** "Parsimony is a virtue in modeling, but you're claiming it's a *rationality requirement*. Parsimony doesn't make something true. If the two are mathematically equivalent, why is one 'rational' and the other 'irrational'?"

  ### 8. Normative Force vs. Descriptive Reality
  **Question:** "When you say the CPA is a rationality requirement, are you making a normative claim or a descriptive one? If it's normative, does that mean persistent disagreement is a moral or logical failing? Because that seems to pathologize legitimate pluralism in values or interpretations."

  *   **Likely Dodge:** "It's a coherence constraint, like avoiding Dutch Books. It's not about values, it's about probabilities."
  *   **Follow-up:** "But probabilities attach to propositions. If we interpret the propositions differently—which is common in politics or ethics—then the disagreement isn't in the probability, it's in the semantics. The CPA assumes we agree on what the states *mean*."

  ### 9. Computational Feasibility
  **Question:** "Even if a common prior exists in principle, verifying that we share one requires me to have access to your cognitive architecture. Given that humans can't even fully introspect their own priors, how is this a requirement for *human* rationality? Is it a requirement for God, but not for us?"

  *   **Likely Dodge:** "Rationality is about the ideal limit, not computational tractability. We use it as a benchmark."
  *   **Follow-up:** "If the benchmark is humanly unreachable, why use it to judge human disagreement? It's like judging a swimmer by whether they can breathe underwater. It might be a better way to move, but it's not a fair test of the swimmer."

  ### 10. The Falsifiability Closer
  **Question:** "I want to end on the scope of your claim. If every instance of real-world disagreement can be explained away by a 'mis-specified type space' or 'lack of common knowledge,' what observation would actually count as evidence against the Common Prior Assumption? Is there any world state where you would concede the CPA is false?"

  *   **Likely Dodge:** "If someone could prove a formal inconsistency in the Harsanyi doctrine."
  *   **Follow-up:** "So no empirical evidence would change your mind? If a theory is compatible with every possible outcome—including universal agreement and universal disagreement—it's not a theory of the world, it's a definition of terms. Are you defending a truth, or just a vocabulary?"
