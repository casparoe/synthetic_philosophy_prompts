  **Move 1 (Callum):** Callum establishes the baseline journalistic norm (reductionism). His argument is pragmatically strong for a research editor: testimony alone is high-risk, and independent verification minimizes liability and error. However, epistemically, he sets a high bar that assumes non-testimonial evidence is readily available or fundamentally different from testimony.
  *Better Argument:* **Callum** (on practical/newsroom standards).

  **Move 2 (Marisol):** Marisol identifies the philosophical weakness in Callum's reductionism: the regress problem. If every testimony requires non-testimonial backing, and documents/witnesses ultimately rely on human authentication (testimony), knowledge transmission halts. Her proposal (default entitlement to credible testimony) aligns with the Reidian "Principle of Credulity" and solves the regress.
  *Better Argument:* **Marisol** (on epistemic foundations).

  **Move 3 (Callum):** Callum refines his position. He concedes he doesn't need "non-testimonial" proof, just independent corroboration (shifting to reliability theory). Crucially, he introduces a specific *defeater*: the source's lawsuit. This moves the debate from abstract theory to concrete risk assessment. A financial motive is a stronger reason for doubt than general grievance.
  *Better Argument:* **Callum** (on risk assessment and specific defeaters).

  **Move 4 (Marisol):** Marisol counters the defeater by contextualizing it (whistleblowers are necessarily aggrieved) and delivers a logical knockout regarding Callum's "learned case by case" heuristic. You cannot build an inductive rule about testimony reliability without first accepting some testimony as reliable (the bootstrapping problem). Callum's rule relies on the very principle he denies.
  *Better Argument:* **Marisol** (on logical consistency).

  **Missing Points:**
  Both colleagues conflate **justified belief** with **ethical publication**. Marisol proves the reporter is *justified in believing* the source (epistemology), but Callum is concerned with the *ethics of publishing* uncorroborated claims that could lead to libel (policy). Neither addresses the asymmetry of error: a false negative buries truth, but a false positive destroys the newspaper's credibility. Additionally, neither distinguishes between the *content* of a document (testimonial) and its *physical existence* (non-testimonial), which matters for forensic verification.

