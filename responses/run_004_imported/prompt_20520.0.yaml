      *   *Is the "Red Dwarf" comparison accurate?* Yes. A red dwarf is a main-sequence star (M type). It is fully a star.
      *   *Is the "Dwarf Planet" definition accurate?* Yes. The 2006 IAU resolution explicitly defined "planet" and "dwarf planet" as mutually exclusive categories within the broader "small solar system bodies" vs. "planets" dichotomy (though "dwarf planet" is its own category now).

  4.  **Evaluate the Scientific/Classification Context:**
      *   *Why did the IAU do this?* The discovery of Eris (similar size to Pluto) forced a choice: accept many new planets (dozens potentially) or refine the definition. They chose refinement based on "clearing the neighborhood."
      *   *Why the name "Dwarf Planet"?* Historically, the term existed before 2006 (e.g., Ceres was called a dwarf planet in the 19th century sometimes, or asteroids). The term was chosen to describe objects *like* Pluto.
