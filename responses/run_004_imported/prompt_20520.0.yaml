      *   *Premise 1:* In astronomy, modifiers usually denote a subtype of the main category (e.g., Red Dwarf $\subset$ Star).
      *   *Premise 2:* The IAU defined "Dwarf Planet" such that Dwarf Planet $\not\subset$ Planet.
      *   *Conclusion:* This is an inconsistent/awkward naming convention that undermines the classification logic.

  3.  **Evaluate the Linguistic/Logical Claim:**
      *   *Is he right about the asymmetry?* Yes. Linguistically, "dwarf planet" implies a type of planet, just like "dwarf star" implies a type of star.
