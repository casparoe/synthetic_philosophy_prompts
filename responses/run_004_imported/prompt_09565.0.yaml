      *   *The General Point of View:* We correct our sentiments, but maybe not fully in immediate judgments.
      *   *Association of Ideas:* Harm is associated with blame. Blame requires intentionality. Therefore, the mind associates harm with intentionality more strongly than help.
      *   *Reason as Slave to the Passions:* This is the big gun. If the passion (blame) is activated by harm, "reason" (the categorization of the act as intentional) bends to serve the passion (the desire to blame). If the passion (praise) is weak or absent in the help case (because indifference isn't praiseworthy), reason doesn't bend to call it intentional.
      *   *Specific Textual Evidence:* *Treatise of Human Nature*, Book 2 (Passions) and Book 3 (Morals). Specifically, the discussion on how we attribute responsibility based on the durability of the cause, but also how we feel stronger resentment for harm than gratitude for benefit (Hume notes asymmetry in gratitude vs. resentment).
      *   *Key Concept:* **The Vivacity of Pain vs. Pleasure.** Hume often notes that pain is more forceful and influential than pleasure. Harm triggers a stronger sentiment than help. This stronger sentiment demands a target (the agent). To blame the agent, we need to construe the act as intentional. Hence, the cognitive shift.

  5.  **Drafting the Response:**
