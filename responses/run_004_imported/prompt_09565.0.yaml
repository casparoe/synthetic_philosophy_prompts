      *   **Part 1: The Prediction (Symmetry).** Focus on Hume's view of action and character. For Hume, moral evaluation targets durable mental qualities. Since the Chairman's quality (greed/indifference) is identical, the moral evaluation of the *agent* should be identical. The external consequence is a matter of luck. Therefore, a strict Humean analysis of the *agent* suggests symmetry.
      *   **Part 2: The Explanation (Asymmetry).** How does Hume explain why people *actually* judge differently?
          *   *Sentiment drives Cognition:* "Reason is, and ought only to be the slave of the passions." If the passion of blame is aroused (Harm case), the understanding is recruited to find the conditions for blame (intentionality). If no strong passion is aroused (Help case), no need to categorize as intentional.
          *   *Asymmetry of Pain and Pleasure:* Hume explicitly notes that resentment (from harm) is more natural and forceful than gratitude (from benefit). Harm demands a cause/agent more urgently.
          *   *Associationism:* The idea of "Harm" is closely associated with "Blame," which is associated with "Intention." The mind moves easily along these channels.
      *   **Part 3: Nuance/Complication.** Hume distinguishes between the "moral sense" and "causal responsibility." He might criticize the folk for conflating them, but he wouldn't be shocked that they do. He is a naturalist; he describes how humans *do* think, not just how they *should*.
      *   **Conclusion:** Summarize. Hume predicts symmetry of character evaluation but explains asymmetry of folk judgment through the dominance of sentiment (specifically resentment) over factual categorization.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Hume think consequences matter?* Yes, utility matters. But unintended consequences don't reflect character as much.
      *   *Does Hume think intentionality is a precondition for blame?* Yes, generally. We don't blame accidental acts unless they reveal a negligent character.
      *   *So, if the folk say "Intentional" in the harm case, they are finding a way to blame.*
      *   *If they say "Not Intentional" in the help case, they are refusing to praise.*
