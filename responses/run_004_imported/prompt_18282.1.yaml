answer: |-
  **MEMORANDUM**

  **TO:** University Intellectual Property Committee
  **FROM:** [Your Name/Title], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Inventorship Dispute: Biomedical Engineering Lab (Microneedle Patch Disclosure)

  **1. Executive Summary**

  This memo addresses the inventorship dispute regarding the invention disclosure filed by a doctoral student for a dissolvable microneedle insulin patch. The faculty supervisor contests sole inventorship, citing his role in framing the research problem, securing funding, and proposing initial materials.

  Based on applicable federal patent law (35 U.S.C. § 101 et seq.) and the specific facts of the reduction to practice, **I recommend the Committee designate the doctoral student as the sole inventor** for the purpose of the immediate provisional patent filing. While the supervisor's contributions were essential to the *project's* existence, they do not meet the legal threshold for *inventorship* of the claimed subject matter.

  This recommendation includes a strict timeline to secure patent rights prior to the student's conference presentation in three weeks and a process for communicating this decision to the parties involved in a manner that acknowledges the supervisor's substantive contribution without compromising the patent's validity.

  **2. Legal Framework: Conception vs. Reduction to Practice**

  Our policy mandates adherence to "applicable legal standards." Under U.S. patent law, inventorship hinges on **conception**, defined as "the formation in the mind of the inventor, of a definite and permanent idea of the complete and operative invention, as it is hereafter to be applied in practice." (*Burroughs Wellcome Co. v. Barr Labs., Inc.*).

  Two key distinctions resolve the tension between the supervisor's and student's positions:

  *   **Goal vs. Invention:** Suggesting a desired result (e.g., "use microneedles for diabetes") or a general area of research is not invention. It is a research goal.
  *   **Operative Means:** Conception requires knowing *how* to achieve the result. If the initial materials proposed by the supervisor failed to function (broke down at body temperature), the "complete and operative invention" did not exist until the student developed the specific polymer blend and fabrication sequence that solved this failure.

  Contributions that do *not* constitute inventorship include:
  *   Providing funding or resources.
  *   General supervision or administration of the lab.
  *   Suggesting materials that do not work in the final embodiment.

  **3. Analysis of the Dispute**

  The supervisor's claim rests on the premise that framing the problem constitutes invention. This is a substantively important view in the context of research leadership; without his vision and funding, the work would not have occurred. However, in patent law, this constitutes "non-inventive contribution."

  The student's claim rests on the specific reduction to practice. The evidence indicates the supervisor's suggested polymer family was inoperative for the intended use. The student independently derived the specific blend and sequence that renders the device functional. Therefore, the "definite and permanent idea of the complete and operative invention" resides with the student.

  Naming the supervisor as a co-inventor when he did not conceive the claimed subject matter creates a significant risk of patent invalidation for incorrect inventorship. Conversely, excluding him does not diminish his right to be acknowledged as the Principal Investigator (PI) or his potential share of royalties under university policy, which often distributes income to the department/lab regardless of specific inventorship.

  **4. Recommendation**

  **A. Inventorship Determination**
  The Committee should authorize the filing of the provisional patent application listing the **doctoral student as the sole inventor**.

  *   *Caveat:* This determination is based on the current disclosure focusing on the specific polymer blend and fabrication sequence. If the patent counsel determines that broader claims can be drafted that encompass the supervisor's initial conceptual contribution without invalidating the patent, we may revisit joint inventorship. However, given the failure of the initial materials, the narrower, student-derived claims are legally safer.

  **B. Acknowledgement of Supervisor Contribution**
  To treat the supervisor's objection seriously and maintain lab cohesion:
  1.  **Authorship:** The supervisor should be guaranteed lead or senior authorship on any resulting journal publications, where academic credit differs from legal inventorship.
  2.  **Revenue Sharing:** Confirm that the supervisor's lab/department will receive its standard share of any net licensing income, per university policy, regardless of his inventorship status.
  3.  **Acknowledgement:** Ensure he is acknowledged in the patent filing as the project lead/PI where appropriate.

  **5. Process and Timeline for Filing**

  We have a hard deadline of three weeks from today to file before the conference presentation constitutes a public disclosure (barring foreign patent rights).

  *   **Days 1–3 (Immediate):**
      *   Committee Chair notifies Tech Transfer Office (TTO) of this determination.
      *   TTO assigns outside patent counsel with biomedical expertise.
      *   Student and Supervisor provided separate written summaries of their specific contributions (focusing on *what* works, not *who* funded it).

  *   **Days 4–10 (Drafting):**
      *   Patent counsel drafts the Provisional Patent Application (PPA).
      *   **Critical Step:** Counsel reviews claims to ensure they rely on the student's operative embodiment.
      *   Committee Chair reviews inventorship declaration with counsel.

  *   **Days 11–14 (Review & Sign-off):**
      *   Student and Supervisor review the PPA for technical accuracy (not legal scope).
      *   Supervisor is briefed by the TTO Director on the legal distinction between project leadership and inventorship to mitigate conflict.
      *   Final inventorship declaration signed.

  *   **Day 15 (Filing):**
      *   **Provisional Application Filed with USPTO.** This secures the priority date and allows public disclosure.

  *   **Days 16–21 (Clearance):**
      *   TTO issues formal clearance for the student to present at the conference.
      *   Presentation slides reviewed to ensure they do not disclose subject matter *outside* the scope of the PPA.

  **6. Conclusion**

  This dispute mirrors a common tension in research commercialization: the distinction between the intellectual architecture of a project and the legal definition of an invention. By adhering strictly to the standard of "conception of the operative invention," we protect the university's asset from invalidation while preserving the supervisor's academic standing through publication and revenue policies.

  I move that the Committee adopt this recommendation and authorize the Tech Transfer Office to proceed with the timeline above immediately.

  **Attachments:**
  *   Draft Inventorship Declaration Form
  *   Relevant Excerpts from 35 U.S.C. § 100-102
  *   Proposed Timeline Gantt Chart
