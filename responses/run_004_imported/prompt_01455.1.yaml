answer: |-
  This is a fascinating dispute because it turns on a meta-philosophical question: What does the silence of ordinary discourse tell us about the validity of a moral explanation? Lewis's retraction relies on a specific assumption about moral psychology: that if a practice rests on a fragile or problematic justification (like "we only allow this because we can't stop it"), ordinary moral agents will recognize the fragility and voice dissatisfaction.

  To defend your friend's position—that Lewis gave up on the "sloppy thinking" hypothesis too quickly—you need to argue that Lewis misunderstands *why* the complaint is absent. The absence of complaint is not evidence that the loophole is morally sound; rather, the absence of complaint is the *expected symptom* of the very "sloppy thinking" Lewis identified.

  Here is the strongest case for your friend's side, structured around four key arguments explaining why the dissatisfaction fails to surface.

  ### 1. The Transparency of Successful Metaphors
  Lewis's retraction assumes that the "debt of punishment" metaphor is a conscious inference that people could evaluate and reject. However, conceptual metaphor theory (and ordinary psychological observation) suggests that the most powerful metaphors are invisible. They structure our thinking pre-consciously.

  If the "sloppy thinking" hypothesis is correct, we do not view fines as *punishments that happen to be payable by others*; we view them as *debts that happen to be punitive*. In the conceptual framework of ordinary discourse, a debt is by definition transferable. You do not hear people complaining that it is "unfair" for a parent to pay off their adult child's credit card debt, even if the debt was incurred through recklessness.

  If the metaphor has successfully colonized our thinking about fines, the possibility of substitution doesn't register as a "loophole" or a "scandal" to be complained about. It registers as a category feature. Lewis expects people to say, "This undermines the punitive nature of the fine!" but if the sloppy thinking is in place, they literally do not conceive of the fine as having a "punitive nature" that is distinct from its "financial nature." The silence isn't approval; it's conceptual blindness. The absence of complaint is exactly what we should expect if the metaphor is working as effectively as Lewis initially claimed.

  ### 2. The Pragmatics of Institutional Silence
  Lewis looks for complaints in "ordinary moral and legal discourse." But we must ask: *Who* would be doing the complaining?

  *   **The State:** The primary enforcer of penalties has no incentive to complain. From the state's perspective, a fine is a revenue mechanism and a deterrent. If the fine is paid, the revenue is secured. Policing the *source* of the funds requires an invasive investigation into the personal finances of offenders and their associates, the cost of which would vastly exceed the revenue gained. The state's silence is pragmatic, not moral.
  *   **The Offender:** The offender has no incentive to complain; substitution benefits them.
  *   **The Payer:** The payer is acting voluntarily.
  *   **The Public:** The public generally views fines as "costs of doing business" rather than moral stains.

  Lewis assumes that if a practice were theoretically inconsistent (allowing substitution for fines but not prison), the public would notice and object. But ordinary legal discourse is driven by utility, not consistency. Since the substitution of fines causes no immediate, visible harm to the public order (unlike, say, a murderer walking free), there is no catalyst for a complaint. The dissatisfaction remains latent because the practical friction required to voice it is higher than the moral irritation caused by the inconsistency.

  ### 3. Fungibility Masks the Personal Nature of Guilt
  The reason we reject substitution in prison sentences is that imprisonment is *inherently personal*. You cannot inhabit another person's body; you cannot experience another person's loss of liberty. The medium of the punishment (bodily confinement) makes the impossibility of substitution obvious.

  Money, however, is defined by its fungibility. It is designed to be transferred. When punishment is translated into money, the *medium* obscures the *message*. The "sloppy thinking" arises because the medium (cash) carries its own logic (transferability) that overwrites the logic of the punishment (retribution).

  Lewis argues that if the "impracticality" explanation were true, we would worry that the punishment isn't "landing" on the guilty party. But because money is fungible, it creates an illusion that the burden *has* been transferred. If I lose $500, it feels the same whether the money came from my pocket or my friend's. The psychological burden is displaced onto the wallet, not the person. Therefore, the complaint doesn't surface because the *sensation* of punishment is preserved, even if the *moral logic* is violated. We don't complain because, phenomenologically, it feels like the fine was paid. The "sloppy thinking" successfully masks the moral asymmetry.

  ### 4. Compartmentalization of Discourse
  Finally, Lewis expects a connection between two domains of discourse that rarely communicate: **Administrative Law** and **Moral Theology**.

  The "sloppy thinking" hypothesis suggests that our tolerance for fine substitution bleeds into our theology (making Penal Substitution seem plausible). But the reverse flow is non-existent. Ordinary people do not walk around thinking about Penal Substitution when they pay a parking ticket. They are thinking about convenience, cost, and resolution.

  The complaint Lewis looks for ("It is wrong to let others pay our penalties!") belongs to the domain of moral philosophy or theology. The practice belongs to the domain of administrative efficiency. Ordinary discourse is rarely philosophical. People are capable of holding contradictory beliefs in different compartments without experiencing cognitive dissonance sufficient to generate a complaint. A person can fiercely believe "criminals must do their own time" in the abstract while casually accepting a friend's Venmo request for a speeding ticket in the concrete.

  Lewis treats the absence of a *philosophical* complaint in *ordinary* discourse as evidence against a *philosophical* hypothesis. This is a category error. The "sloppy thinking" is precisely the failure to apply philosophical scrutiny to administrative habits. To expect the habit to generate the scrutiny that would break the habit is to misunderstand how habits work.

  ### Conclusion
  Your friend's position rests on a more cynical, but perhaps more accurate, view of human cognition than Lewis's retraction allows. Lewis assumes that moral inconsistencies generate noise (complaints). Your friend argues that successful conceptual metaphors generate silence.

  If the "debt of punishment" metaphor is as potent as Lewis initially suggested, it renders the asymmetry invisible. We don't complain about fine substitution for the same reason fish don't complain about water: it is the medium in which the transaction swims. Lewis's demand for an explicit complaint assumes that we are critically examining the structure of our penalties. The "sloppy thinking" hypothesis asserts that we are not. Therefore, the silence Lewis cites as exculpatory is actually the strongest corroborating evidence that the sloppy thinking is already in place.
