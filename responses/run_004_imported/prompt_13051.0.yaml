  Death catches up and says, "I know where you'll end up. You'll die either way."

  The theorist says, "If I choose Aleppo, I should have stayed. If I stay, I should have gone. But if I randomize, my decision is ratifiable."

  Death sighs. "You'd rather die correctly than try to escape?"

  "Escape is impossible," says the theorist. "But dying unratifiably? That's on me."
