answer: |-
  Good evening. For those who don't know me, I'm a science writer. For the last few years, I've had the privilege of covering the work of the bride, [Bride's Name]. And looking around the room, I realize I'm speaking to two distinct audiences. Half of you are relatives who are just happy the open bar is running. The other half are logicians and game theorists who are currently mentally modeling the probability of me finishing this speech on time.

  I want to talk to both of you about knowledge. Specifically, the difference between *mutual* knowledge and *common* knowledge.

  Mutual knowledge is simple. It means we all know the same thing. For example, looking at [Bride] and [Groom] tonight, everyone in this room knows they are in love. The relatives know it because they've seen the photos. The game theorists know it because they've calculated the utility functions. We all possess the information.

  But that isn't enough to sustain a marriage, and it isn't enough to sustain a society. For that, you need *common* knowledge. Common knowledge is what happens when everyone knows a fact, *and* everyone knows that everyone knows it, *and* everyone knows that everyone knows that everyone knows it, without end.

  You might ask: If we all already know they're in love, why are we here? Why stand up and say it out loud? Does this ceremony actually *do* anything?

  In epistemic logic, the answer is yes. A public announcement transforms mutual knowledge into common knowledge. Before today, you might have suspected they were committed. But you didn't know if *I* knew that *you* knew. By gathering here, by witnessing vows publicly, we create a shared reality. We align our expectations. We create a coordination point that didn't exist when the knowledge was just private. That is the work this ceremony does. It locks in the equilibrium.

  [Bride], this is particularly poignant given your work. You study the Centipede Game. You study the backward-induction result that suggests a rational player should grab the pot on the very first move rather than trust the other person to let it grow. Your research explains why logic sometimes demands we defect. But tonight, you are demonstrating that the highest form of rationality isn't grabbing the pot on move one. It's passing the play. It's letting the pot grow. It's trusting that the other player will not defect, even when the math says they might.

  Now, in the spirit of full disclosure, there is a story I could tell. It's about the first major compromise they made as a couple—the specific terms of who gave up what to make it work. I know the story. It is true.

  But I am not going to tell it. And my decision is based on the very distinction I just explained.

  If I tell you that story, it becomes common knowledge. It enters the public record of this group. It becomes a precedent that can be cited, audited, and held against them. But if I leave it untold, it remains mutual knowledge. We might all suspect a compromise was made. But by not making it common, we allow them the flexibility of plausible deniability. In game theory, we know that converting certain private signals into common knowledge can collapse a beneficial equilibrium. For the stability of their long-term cooperation, some things are best left as things we all sense, but none of us officially acknowledge.

  So, [Bride] and [Groom], my wish for you is this: May your love be common knowledge to the world, clear and undeniable. But may your compromises remain mutual knowledge, flexible and forgiving. May you always find that the rational move is to trust, and may you never have to calculate the backward induction of your life together.

  To the happy couple.
