  2.  **Deconstruct the Arguments:**

      *   **Dutch Book Argument (DBA):**
          *   *Core Idea:* Incoherent credences $\rightarrow$ Susceptible to a set of bets guaranteeing loss.
          *   *Assumptions:* Link between credence and betting behavior (e.g., $P(A) = x$ implies willingness to buy/sell at $x$). Preference for more money/avoiding sure loss.
          *   *Conclusion:* Incoherence is pragmatically self-defeating.
          *   *Critique:* Why should I bet? Why is money the metric? It shows practical stupidity, not necessarily epistemic falsity.

      *   **Joyce's Accuracy-Dominance Argument (ADA):**
          *   *Core Idea:* Incoherent credences $\rightarrow$ There exists a coherent alternative that is strictly more accurate (closer to truth) in *every* possible world.
          *   *Assumptions:* Definition of "accuracy" (scoring rules, specifically Brier score or generalizations). Conditions on the scoring rule (Continuity, Properness, etc.). The norm: "Avoid dominated options" (if $A$ is better than $B$ in all worlds, don't choose $B$).
          *   *Conclusion:* Incoherence is epistemically defective (inaccurate).
          *   *Critique:* Is the scoring rule choice arbitrary? Is the "avoid dominance" norm pragmatic? Does it really escape decision theory?

  3.  **Evaluate the "Purely Epistemic" Claim:**
      *   Joyce claims ADA is non-pragmatic because it doesn't involve utility, money, or action. It's about the fit between mind and world.
