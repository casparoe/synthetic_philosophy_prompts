answer: |-
  Your friend is correct that the Dutch Book Argument (DBA) suffers from a "pragmatic gap": it demonstrates that incoherent credences lead to practical self-sabotage, but it does not strictly prove that they are *epistemically* mistaken. One can consistently reply, "I accept my credences are incoherent, but I simply refuse to bet."

  However, regarding your central question—whether Jim Joyce's accuracy-dominance argument (ADA) truly closes this gap or merely hides pragmatic assumptions in the choice of scoring rules—I will defend a definite answer: **Joyce's argument does succeed in providing a purely epistemic vindication of probabilism, but only by making explicit a normative commitment (Veritism) that the Dutch Book argument leaves implicit and confused.**

  The charge that ADA simply relocates pragmatic assumptions is a category error. It mistakes the *structure* of rationality (dominance reasoning) for the *content* of rationality (pragmatic utility). While ADA relies on decision-theoretic *logic*, it applies it to epistemic *values*. By doing so, it isolates the defect of incoherence as a failure to achieve the constitutive aim of belief (truth), rather than a failure to protect one's wallet.

  Here is the careful comparison and defense of that verdict.

  ### 1. The Dutch Book Argument: Pragmatic Coercion
  The DBA rests on two pillars: a **bridge principle** linking credence to action, and a **norm of practical rationality**.

  *   **The Bridge Principle:** Typically, this is the "Ramsey-Savage" thesis: if your credence in $A$ is $x$, you are committed to accepting a bet on $A$ at odds corresponding to $x$.
  *   **The Norm:** It is irrational to accept a set of bets that guarantee a loss (a Dutch Book).

  **The Gap:** The DBA shows that incoherence makes you *vulnerable*. It does not show that incoherence is *false*. As your friend noted, the agent can opt out of the betting market. To make the DBA stick as an epistemic argument, one must argue that credences *just are* betting dispositions. But this reduces belief to behavior, which many epistemologists reject. You can have a belief without ever acting on it. Therefore, the DBA proves that incoherent agents are practically imprudent, not necessarily that their map of the world is distorted. It conflates **instrumental rationality** (getting what you want) with **epistemic rationality** (representing the world accurately).

  ### 2. Joyce's Accuracy Argument: Epistemic Efficiency
  Joyce's argument (1998, 2009) bypasses action entirely. It treats credences as estimations of truth values and evaluates them based on their "distance" from the truth.

  *   **The Metric:** Joyce introduces an **epistemic scoring rule** (like the Brier score). This measures the "inaccuracy" of a credence function $c$ at a world $w$. If $A$ is true, a credence of 1.0 has 0 inaccuracy; a credence of 0.5 has high inaccuracy.
  *   **The Constraint:** The scoring rule must be **strictly proper**. This means that if your credence is $x$, you expect $x$ to be more accurate than any other credence $y$. This prevents you from gaming the system by reporting a credence you don't hold.
  *   **The Theorem:** For any incoherent credence function, there exists a coherent alternative that is **strictly more accurate** in *every possible world*. (This is "accuracy-dominance".)
  *   **The Norm:** It is irrational to adopt a strategy (credence function) that is dominated by another strategy with respect to your goals.

  **The Gain:** There is no mention of money, bets, or actions. The comparison is purely between the agent's mind and the state of the world. If you are incoherent, there is literally a different state of mind that would be closer to the truth, no matter how the world turns out.

  ### 3. Addressing the "Hidden Pragmatism" Objection
  The critical charge you raised is whether ADA just hides pragmatic assumptions, specifically in the **dominance principle** or the **scoring rule**.

  #### A. Is Dominance Pragmatic?
  Critics argue that "avoid dominated options" is a decision-theoretic norm, and importing it into epistemology smuggles in pragmatism.
  **Defense:** This confuses the *form* of rationality with the *domain* of value. Dominance reasoning is domain-neutral.
  *   If your goal is money, and Option A yields more money than Option B in all worlds, choosing B is *pragmatically* irrational.
  *   If your goal is truth, and Credence Set A is more accurate than Credence Set B in all worlds, choosing B is *epistemically* irrational.

  The logic is identical, but the *value* being maximized is different. The DBA fails as an epistemic argument because money is extrinsic to belief. Accuracy is intrinsic to belief. Therefore, applying dominance to accuracy is not "hidden pragmatism"; it is **explicit epistemic instrumentalism**. It says: "If you care about truth (which is the point of believing), incoherence is the wrong tool."

  #### B. Is the Scoring Rule Arbitrary?
  The other potential hidden assumption is the choice of the scoring rule (e.g., Brier score). If Joyce just picked a measure that happened to favor probability axioms, the argument would be rigged.
  **Defense:** Joyce does not defend one specific score; he defends a **class** of scores (continuous, strictly proper). The theorem holds for *any* scoring rule in this class. The requirement of "propriety" is not pragmatic; it is a constraint on what counts as a measure of *honest* accuracy. A scoring rule that is not proper would incentivize you to report a credence different from your actual belief to maximize your "score." That would measure *strategic reporting*, not *epistemic accuracy*. By requiring propriety, Joyce ensures the metric measures the fit between mind and world, not the fit between mind and metric.

  ### 4. The Verdict: Why ADA Succeeds Where DBA Fails
  The DBA tries to derive epistemic norms from pragmatic consequences. This is a category mistake. It tries to say "Your beliefs are wrong because you will lose money."
  Joyce's ADA derives epistemic norms from epistemic goals. It says "Your beliefs are wrong because they are needlessly far from the truth."

  **Does ADA deliver a purely epistemic vindication?**
  **Yes.** It succeeds because it accepts **Veritism**: the thesis that the fundamental epistemic good is accuracy (truth). Once you accept Veritism, the dominance argument shows that probabilistic coherence is a *necessary condition* for maximizing that good.

  The DBA leaves the agent an escape hatch: "I don't care about money."
  The ADA leaves the agent only one escape hatch: "I don't care about the truth."
  But if an agent says "I don't care about the truth," they have opted out of the business of belief entirely. They are no longer making a claim about epistemic rationality; they are admitting their credences are not truth-apt.

  Therefore, the "assumption" Joyce makes (that accuracy is the goal of belief) is not a hidden pragmatic assumption; it is the **constitutive norm of belief**. You cannot have a belief without it purporting to be true. The DBA assumes you want money (contingent desire); Joyce assumes you want truth (constitutive aim).

  ### Conclusion
  Your friend is right that the Dutch Book argument is merely pragmatic. However, she is likely mistaken if she implies Joyce's argument suffers from the same defect. Joyce's argument does not hide pragmatic assumptions; it **formalizes epistemic values**.

  It demonstrates that probabilistic coherence is not just a rule for avoiding suckers' bets, but a structural requirement for any mind that aims to represent the world accurately. The "dominance" principle is not a pragmatic intrusion; it is the logical expression of efficiency applied to truth-seeking.

  **Definite Answer:** Joyce's accuracy-dominance argument **does** deliver the purely epistemic vindication that the Dutch Book argument lacks. It successfully re-frames probabilism from a constraint on *betting behavior* to a constraint on *representational accuracy*. While it relies on the normative premise that accuracy is the goal of belief (Veritism), this is a substantive epistemic claim, not a disguised pragmatic one. Consequently, ADA is the superior foundation for Bayesian rationality within formal epistemology, as it identifies incoherence as an intrinsic cognitive defect rather than a mere extrinsic vulnerability.
