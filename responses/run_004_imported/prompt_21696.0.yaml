      *   *The "Hidden Assumption":* The choice of scoring rule (e.g., Brier score). Why *that* measure of distance from truth? Joyce argues for constraints (propriety), but is there a unique justification?
      *   *The "Dominance" Norm:* Why is dominance irrational? In decision theory, it's because you prefer more utility. In epistemology, why must you prefer more accuracy? If you don't care about accuracy, the argument fails. But if you *are* a believer, do you necessarily care about accuracy?

