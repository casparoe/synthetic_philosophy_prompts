      *   *Conditions for Valid Shabda:* The speaker must be reliable (*apta*), the statement must not be contradicted by other *pramanas*, and the listener must understand the meaning.
      *   *Vedic Testimony:* Nyaya does treat the Vedas as authorless (*apaurusheya*) and therefore infallible, but this is a specific metaphysical claim, not just "because it says so."
      *   *Appeal to Authority:* In Western logic, an appeal to authority is a fallacy *if* the authority isn't actually an expert or if the claim is outside their expertise. Nyaya builds the "expertise/reliability" condition into the definition of valid *Shabda*.
