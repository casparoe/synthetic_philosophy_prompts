      *   *The Vedic Exception:* Here's where it gets tricky. Nyaya argues Vedas are *apaurusheya* (not of human origin). If no human authored it, no human error/bias exists. This is a metaphysical premise, not just an epistemological rule. It shifts the burden to proving the Vedas are authorless.
      *   *Inference vs. Testimony:* Some schools (like Buddhism) say testimony is just inference (I infer you know what you're talking about). Nyaya says no, the *words themselves* convey the knowledge directly if conditions are met.
      *   *Fallacies:* *Shabda* has its own conditions for failure (contradiction, unreliable speaker). It's not immune to critique, just structured differently.
