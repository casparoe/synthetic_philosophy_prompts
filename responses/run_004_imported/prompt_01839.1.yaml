      *   **Explain the "Why":** Why does Nyaya need *Shabda*? Because some truths (ethics, metaphysics, distant facts) aren't accessible via perception or inference.
      *   **Address the Fallacy Taxonomy:** Explain why *Shabda* isn't listed under *Hetvabhasa* (inferential fallacies). It's a separate *pramana*, not a subtype of inference (though some schools argue it reduces to inference).
      *   **Nuance/Critique:** Acknowledge that later Nyaya (Navya-Nyaya) refined this, and other schools (like Charvaka or Buddhism) *did* critique this exact point.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You're not misunderstanding. It's a sophisticated move, but the tension is real.
