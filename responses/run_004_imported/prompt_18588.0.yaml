      *   *Shared Ground:* Underdetermination, rejection of meaning facts, behavior as the only evidence.
      *   *Divergence 1: Scope (Idiolect vs. Translation).* This is the big one. Kripke's "quus" works for a solitary individual. Quine's "gavagai" requires a translator and a native.
      *   *Divergence 2: Dispositionalism.* Clarify Quine's behaviorism vs. Kripke's critique. Quine accepts dispositions as the *basis* but denies they fix reference. Kripke says dispositions can't constitute meaning because of the normativity gap (is/ought).
      *   *Divergence 3: The Solution.* Kripke's skeptical solution (community/norms) vs. Quine's naturalism (physics/indeterminacy is okay).
      *   *Final Adjudication:* The assimilation is a "family resemblance" but misses the distinct philosophical move Kripke makes. Kripke radicalizes Quine.

  7.  **Refining the "Dispositionalism" point:**
      *   Need to be careful. Quine is a behaviorist. He thinks meaning *is* rooted in disposition to verbal behavior. But he thinks reference is inscrutable. Kripke argues dispositions can't constitute meaning *at all* because of the error condition (if I meant plus, I *should* say 125, but if I'm disposed to say 5, dispositionalism says I meant quus). Kripke attacks the *constitution* of meaning. Quine attacks the *determinacy* of reference given behavioral constraints.
      *   Correction: Quine denies that meanings are entities. Kripke denies that there are truth conditions for meaning claims.
      *   Key distinction: Quine thinks there are facts about stimulus meaning. Kripke's skeptic denies there are facts about *any* mental state that constitute meaning.

  8.  **Refining the "Community" point:**
