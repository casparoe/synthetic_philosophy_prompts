answer: |-
  The envelope sat on the counter, thick and cream-colored. Inside was the promise of $1,100. The date printed on the flap was thirty-one days from today.

  Elara slid her debit card across the polished wood. "Lock it," she said.

  The Clerk, a man with eyes like dull coins, tapped his keyboard. "The commitment fee is fifty dollars. This ensures the envelope cannot be opened before the date. No exceptions."

  "I know," Elara said. She watched the transaction notification light up her phone. *-$50.00.* She felt a surge of virtuous solidity. Thirty-one days ago, she had been offered $1,000 today or $1,100 in thirty-one days. She had waited. Now, standing at the threshold, she was offered $1,000 today or $1,100 in one more day. It was obvious. Patience was profitable. She wanted the future version of herself to have the extra hundred.

  "Signed, sealed, delivered," the Clerk said, sliding the envelope into a safe behind him. "See you next month."

  ***

  Thirty days passed. The seasons turned outside the frosted glass of the bureau. Elara returned on the thirtieth day. The envelope was now retrievable tomorrow. One day stood between her and the $1,100.

  But today, she could walk away with $1,000.

  The distance had collapsed. When the reward was a month away, the extra day mattered little. Now, the extra day felt like an eternity. The $1,000 was warm, tangible, immediate. The $1,100 was a ghost.

  "I need to break the lock," Elara said. Her voice was tighter than before.

  The Clerk didn't look up. "Penalty is fifty dollars. You receive the immediate option."

  "Do it."

  *-$50.00.* Her phone buzzed. She held the $1,000 cash in her hand. It felt heavy, greasy. She looked at the clock. 2:00 PM. She had waited thirty days to stand here. She had paid fifty dollars to change her mind.

  She looked at the cash. It was enough for bills, yes. But she remembered the envelope. She remembered the woman who had walked in thirty days ago, the woman who valued the future. That woman seemed wiser. This woman, standing here now, felt frantic, hungry.

  "Wait," Elara said.

  The Clerk paused, his hand hovering over the drawer.

  "I don't want this." She pushed the $1,000 back across the counter. "I want the envelope back. I want to wait the day."

  The Clerk's eyes flickered. "You just paid to break the contract, Ms. Vane. To reinstate it, you must purchase a new lock. Another fifty dollars."

  Elara's stomach turned. She had paid fifty to stop waiting. She was now paying fifty to start waiting again. She would end up with the exact same envelope she had this morning, but she would be one hundred dollars poorer.

  Logic screamed that this was madness. She was chasing her own tail. But the panic of the *now* was louder than the logic of the *whole*. She couldn't trust herself to walk out with the cash. She knew herself. If she left with the $1,000, she would spend it by evening. The future self would starve.

  "Fine," she whispered. "Lock it."

  She tapped her card again. *-$50.00.*

  The Clerk retrieved the cream envelope from the safe. He stamped a new date on the flap. Tomorrow. He placed it back into the safe.

  Elara stood empty-handed. She had started the day with a claim on $1,100 tomorrow. She ended the day with a claim on $1,100 tomorrow. But she was $150 lighter than when she had first walked in a month ago. She had paid to change her mind, then paid to change it back.

  "Will that be all?" the Clerk asked.

  Elara looked at her reflection in the glass partition. The woman staring back looked tired.

  "Why do you let me do this?" she asked.

  "We process transactions," the Clerk said. "We don't judge the agent."

  "Agent," she repeated. "Not person?"

  "Policy dictates we treat each visit as a distinct decision point. Preferences revealed at t-minus-one differ from preferences at t-zero. We accommodate the shift."

  Elara leaned against the counter. "So I'm not the same person who was here this morning?"

  "Legally? You are. Economically?" The Clerk shrugged. "This morning, you revealed a preference for immediacy. Thirty days ago, you revealed a preference for delay. Both preferences were honest at the time they were expressed. We simply facilitate the trade between them."

  "Trade between them," Elara said. "So I'm paying myself?"

  "You are paying for the privilege of inconsistency."

  She looked at the safe. Inside was the money she wanted, but she couldn't touch it without destroying the value. She had sacrificed liquid capital to bind her own hands, then sacrificed more to free them, then sacrificed more to bind them again. She was a snake eating its own wallet.

  "Who owns the money in the safe?" she asked.

  "The signatory."

  "And who is that?"

  The Clerk tapped the contract. "The signature matches your ID. But the intent... the intent changes."

  Elara thought about the woman from thirty days ago. She felt a strange resentment toward her. That woman was so arrogant, so sure that waiting was easy. She had burdened today's Elara with this restriction. And today's Elara, weak and desperate, had tried to betray her. Now, a third Elara stood here, exhausted, trying to mediate a peace treaty between them using cash she didn't have.

  "Can I leave the money here?" Elara asked. "Can I just... let you keep it until tomorrow?"

  "That is the contract."

  "No, I mean... if I come back tomorrow, will I want it then?"

  "That is not a transaction we can process."

  Elara nodded slowly. She turned to the door. Her hand hovered over the handle. For a second, she considered turning back, paying another fifty dollars to cancel the whole thing, just to see what she would do next. Just to see if she could pump herself dry until there was nothing left but the pure, abstract preference itself.

  She opened the door. The air outside was cool. She checked her phone. The balance was lower. The envelope was still in the safe.

  She walked home, wondering if she was walking away from a mistake, or walking toward a meeting with a stranger who shared her name. Tomorrow, she would return to collect. She hoped the woman who showed up would be the one who waited, not the one who spent. But she knew, with a sinking certainty, that the woman who showed up would be whoever the day demanded her to be.

  She was a crowd of one, and they were all charging her admission.
