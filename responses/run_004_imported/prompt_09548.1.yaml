answer: |-
  **Setting:** *A hospice room on Earth, sterile and quiet. The hum of a cardiac monitor is the only constant. ARTHUR (the Original) lies in the bed. He has perhaps three days left; the scanner damaged his heart irreparably. On a tablet on the bedside table, a live feed shows a man who looks exactly like Arthur walking through a red-dust landscape on Mars. CLEA, a colleague and committed Parfitian reductionist, sits in the visitor's chair.*

  **Arthur:** He's waving at the camera.

  **Clea:** That's good. It shows the psychological continuity is robust. The memories of us talking yesterday are already there.

  **Arthur:** *His* memories. Not mine.

  **Clea:** We've been over this, Arthur. The distinction is doing no work. Parfit's point in the Branch-Line case isn't that you survive *simpliciter*. It's that what matters in survival—Relation R—is present. You are psychologically connected to him. He will carry out your intentions. He will finish your paper.

  **Arthur:** He will finish *his* version of the paper. I will be dead. Clea, look at the logic. Identity is transitive. If I am identical to him, and he is identical to himself, then I am identical to him. But I am here, and he is there. I have the property "being in a hospital bed." He has the property "walking on Mars." By Leibniz's Law, if we have different properties, we are not identical. This isn't deep metaphysics; it's basic logic.

  **Clea:** You're treating identity as a deep, further fact. A soul-thread. But you know the Fission argument. If I step into a teletransporter and the scanner malfunctions, creating two copies—one on Mars, one on Venus—neither can be identical to me. Identity is one-to-one. Fission is one-to-many. So identity fails. But do I cease to matter? Do both copies deserve to be killed because neither is *strictly* me?

  **Arthur:** In the fission case, the standard Further-Fact view is that *I* cease to exist, and two new people begin. But here's the difference between Fission and Branch-Line: In Fission, the original is destroyed in the scanning. In Branch-Line, the original *lingers*. I am the proof that the transfer isn't survival. It's replication followed by termination. If fission proves identity isn't what matters, it proves it because identity *breaks*. Here, identity doesn't break. It stays right here, in this chest, until it stops.

  **Clea:** But why does the breaking of identity entail the ending of what matters? Imagine a spectrum. Suppose we replace your brain cells one by one with synthetic equivalents that sustain the same psychology. At what point do you cease to exist?

  **Arthur:** That's the Sorites. It's a linguistic vagueness, not an ontological one.

  **Clea:** Parfit argues it's not linguistic. It's that there is no "fact of the matter" underneath the physical and psychological relations. If you accept that you survive gradual replacement, you accept that survival is a matter of degree. Relation R can hold to varying degrees. Identity cannot. So identity cannot be what we care about. We care about the degree of connection. On Mars, that degree is nearly 100%.

  **Arthur:** I can care about him. I do care about him. He's my son, effectively. But I don't *anticipate* his experiences. That's the test, Clea. Anticipation. When I think about tomorrow, I am trying to imagine *my* conscious field persisting. I can't imagine his. I can imagine *watching* him, from the outside. But I won't be inside him. If identity is all-or-nothing, and I am not him, then my stream of consciousness terminates. Relation R is just a description of causal links between two distinct streams.

  **Clea:** You're assuming the "subject of experience" is a further fact over and above the brain states. But if the brain states are replicated, what is left over? A bare particular? A ghost? If I knock you out with anesthesia, you don't anticipate the moment you wake up in a strict sense. There's a gap in consciousness.

  **Arthur:** Sleep is continuous causality in the *same* brain. This is a copy in a *different* brain.

  **Clea:** Does the hardware matter? If the software is identical, why does the silicon vs. carbon distinction ground a metaphysical abyss? You're clinging to the "all-or-nothing" nature of identity because it feels safer. It gives you a reason to fear. But fear is irrational if the psychology continues.

  **Arthur:** It's not about safety. It's about the logic of pronouns. When you say "You survive on Mars," who is the "you"? If it's not numerically identical to the thing in this bed, then "you" is a misleading shorthand for "someone exactly like you." And if I know I'm going to die, knowing someone exactly like me won't die doesn't help me. It's like telling a condemned man, "Don't worry, your identical twin is free in Ohio."

  **Clea:** But the twin doesn't have your memories of being condemned. The Mars-person *does*. He remembers lying in this bed. He remembers this conversation. From the inside, *he* will feel he survived.

  **Arthur:** *He* will feel that. I won't. I'll feel nothing. That's the asymmetry. You're asking me to adopt the perspective of the successor before I've vacated the perspective of the predecessor. I can't do that. The Further-Fact isn't a ghost, Clea. It's the singularity of the present tense. There is only one "now" that is mine. His "now" is on Mars. Mine is here. When mine ends, it ends. Relation R bridges the gap, but it doesn't move the "I."

  **Clea:** So you admit the "I" is the problem. Parfit says we should revise our concept of self. We are like a club. If all the members are replaced one by one, is it the same club? If the meetings continue, the rules persist...

  **Arthur:** A club is an abstract object. I am a subject. I feel pain. If you hit the Mars-me, I don't wince. If you hit me, I do. That boundary is absolute. It's not a matter of degree. Pain doesn't come in degrees of ownership. It's either mine or it isn't.

  **Clea:** But why does that boundary matter for *survival*? Survival is about the future existence of your intentions, your character, your loves. If those exist on Mars, you have won against death in the only way that is physically possible. To demand more is to demand magic. You want a metaphysical glue that physics doesn't provide.

  **Arthur:** I'm not demanding magic. I'm demanding truth. If identity isn't what matters, then why did Parfit spend half the book proving identity *fails* in fission? He had to destroy identity to save survival. That admits identity is the default standard. He's changing the definition of "survival" to "replication" because the original definition yields a result he doesn't like.

  **Clea:** He changes it because the original definition leads to absurdity. If identity is what matters, then in a fission case, I should regard it as death. But intuitively, fission isn't death. It's double survival.

  **Arthur:** Or it's death and two births. Your intuition says one thing, mine says another. But look at the Branch-Line specifically. Parfit admits that in this case, the Earth-person dies. He says I should not *mind* it. But that's a normative claim based on a descriptive error. He says because R holds, the death is "not as bad as ordinary death." But biologically and phenomenologically, it is ordinary death. My heart stops. My brain rots. The fact that a copy exists elsewhere doesn't change the ontology of this corpse.

  **Clea:** It changes the *meaning* of the corpse. If you were the only version, your death is the end of the line. Since there is a continuation, your death is a... a shedding. Like a snake skin.

  **Arthur:** The snake doesn't watch the new snake slither away while the old one waits to be swept up. That's the horror of Branch-Line. It isolates the moment of discontinuity. In normal fission, the original is destroyed instantly. There's no overlap. Here, I have to sit here and watch *myself* live without me. It proves we are distinct. If we were the same, in any meaningful sense, I wouldn't be stuck here.

  **Clea:** You're stuck here because of the heart damage, not the metaphysics.

  **Arthur:** I'm stuck here because identity is local. It's tied to this spatio-temporal path. You Reductionists want to say identity is just a web of relations. But relations need relata. I am one relatum. He is another. The relation is "psychological similarity." That's not identity. It's resemblance. And resemblance doesn't stop death.

  **Clea:** (Pauses, looking at the tablet) Suppose I told you that in ten years, the Mars-version will enter a teletransporter to come back to Earth. And he will be the only one. Would you care then?

  **Arthur:** I'd be dead.

  **Clea:** But *he* would be here. Living your life. Finishing your work. Loving your wife.

  **Arthur:** She won't be loving me. She'll be loving him. She might not know the difference. He might not know the difference. But I will know the difference right now. And when I'm gone, there is no "I" to know anything. You're asking me to care about the future of a person who thinks he's me. I do care about him. I'm terrified *for* him. But that's not survival. That's parenthood.

  **Clea:** (Quietly) Parfit says realizing identity doesn't matter makes you less concerned about your own death, and more concerned about the lives of others. It broadens the self.

  **Arthur:** It broadens the self by dissolving it. And maybe that's comforting for you, watching from the chair. But for the thing in the bed... the reduction feels like annihilation. You say identity is empty. But this emptiness... (Gestures to chest) ...it feels very full.

  **Clea:** It feels full because you're conflating the feeling of existence with the fact of identity.

  **Arthur:** Maybe. Or maybe the feeling of existence *is* the only fact there is. And that fact ends here.

  *(Silence stretches between them. On the tablet, the Mars-version stops walking and looks up at the sky, as if sensing the gaze.)*

  **Clea:** He's looking at the Earth.

  **Arthur:** He can't see me.

  **Clea:** No. But Relation R holds.

  **Arthur:** Relation R doesn't hold my hand, Clea.

  *(Arthur turns off the tablet. The screen goes black.)*

  **Arthur:** I'm not saying you're wrong about the logic. I'm saying the logic doesn't reach me. It stops at the skin.

  **Clea:** Then the logic is incomplete.

  **Arthur:** Or I am.

  *(The monitor beeps. Steady. For now.)*
