  2.  **Initial Assessment & Fact-Checking:**
      *   *Kelly Criterion:* Maximizes the expected logarithmic growth rate of wealth. Correct.
      *   *Ergodicity Economics (Ole Peters):* Argues that time averages (one person over time) $\neq$ ensemble averages (many people at one time). Non-ergodic processes require time-average optimization (log utility). This is a valid and influential perspective, but not universally accepted as the *only* truth.
      *   *Arithmetic EV:* Maximizes expected wealth at a single future point. Valid for one-off bets or when you can diversify across many independent parallel bets.
