      *   **The Actuary/Traditional Finance Argument:**
          *   *Strengths:* Humans have finite lifespans. Humans have consumption needs (can't always reinvest). Probabilities are never known precisely (parameter risk). Full Kelly is too volatile for most psyches (50% drawdowns are common).
