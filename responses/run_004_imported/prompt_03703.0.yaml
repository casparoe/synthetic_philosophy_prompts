answer: |-
  The reference class problem is traditionally framed as a fatal wound for frequentism. As Hans Reichenbach noted, any individual event is a member of indefinitely many classes, each with a different relative frequency. If objective probability is defined strictly as relative frequency, then a single case has indefinitely many probabilities, rendering the concept useless for singular prediction. Consequently, many philosophers of probability have retreated from frequentism toward metaphysical accounts that purportedly anchor chance in the specific case itself: **propensity theories**, which locate chance in the dispositional properties of a specific setup, and **Humean Best-System Accounts (BSA)**, which locate chance in the probabilistic laws that best summarize the total history of the world.

  The prevailing intuition is that these accounts escape the reference class problem because they do not define the probability of an event $e$ by counting $e$'s peers in a pre-selected group. However, this intuition is mistaken. The reference class problem is not merely a defect of counting frequencies; it is a structural problem regarding the **individuation of the probabilistic model**. When examined closely, both propensity theories and BSA face structural analogues of the reference class problem. Trading frequentism for these accounts does not resolve the underlying difficulty; it merely migrates the ambiguity from the selection of a *class* to the selection of a *setup* or a *property set*.

  ### The Propensity Analogue: The Individuation of the Chance Setup

  Propensity theories, particularly those championed by Karl Popper, posit that probabilities are physical dispositions inherent in a specific "chance setup." On this view, the probability of a coin landing heads is not a fact about a class of coins, but a dispositional property of *this* coin-tossing arrangement. This is supposed to bypass the reference class problem because the propensity is attached to the singular setup, not a class.

  However, to attribute a propensity, one must specify the **conditions** that constitute the setup. This generates the "Setup Individuation Problem," which is structurally isomorphic to the reference class problem.

  Consider a specific toss of a specific coin. What constitutes the relevant chance setup?
  1.  **The Narrow Setup:** If we define the setup to include every physically relevant causal factor (the exact muscle tension of the thrower, air resistance, surface elasticity, quantum states of the atoms), the outcome is determined by the laws of physics. The propensity becomes trivial: it is either 0 or 1. This collapses objective chance into determinism.
  2.  **The Broad Setup:** If we define the setup loosely (e.g., "a coin toss"), we ignore relevant causal variables. But on what basis do we ignore them? Why do we treat "air pressure" as noise but "coin symmetry" as signal?

  To assign a non-trivial propensity (e.g., 0.5), the theorist must select *which* physical conditions are constitutive of the chance setup and which are external perturbations. This selection process is underdetermined by the physics itself. One could define the setup as "tosses of this coin" or "tosses of this coin by a left-handed person" or "tosses of this coin during a solar eclipse." Each specification defines a different physical disposition with a different strength.

  Therefore, the propensity theorist faces the same dilemma as the frequentist. The frequentist asks, "Which reference class is the right one?" The propensity theorist asks, "Which description of the physical setup is the right one?" Since a single concrete event falls under indefinitely many descriptions of physical setups, the propensity account fails to yield a unique probability for the singular case without an arbitrary selection rule. The ambiguity has not been eliminated; it has shifted from class membership to setup description.

  ### The Best-System Analogue: The Selection of Natural Properties

  The Humean Best-System Account (BSA), most famously associated with David Lewis, attempts to ground objective chance without heavy-duty metaphysics. On this view, chances are the probabilities entailed by the system of laws that best balances **simplicity** and **strength** in summarizing the "Humean mosaic" (the total distribution of particular facts in spacetime).

  Proponents argue BSA avoids the reference class problem because the "best system" is unique (or nearly so) for the entire world. The chance of an event is not derived from a local frequency count but from the global laws. However, the BSA faces the "Property Selection Problem," which functions as a reference class problem at the level of lawhood.

  For a regularity to enter the Best System, it must be formulated in terms of "natural properties." But the mosaic of particular facts can be summarized using indefinitely many vocabularies of properties.
  1.  **Gerrymandered Properties:** Suppose we want to know the chance of a specific radioactive atom decaying. The Best System might include a law about "Uranium-238." But why not "Uranium-238 atoms located within one meter of a philosopher"? If the latter regularity improves the strength of the system without costing too much simplicity, it could become a law. If it becomes a law, the chance assignment for the atom changes.
  2.  **Local vs. Global Patterns:** The BSA selects the system that best summarizes the *whole* world. However, the world may contain heterogeneous regions. A system that smooths over local variations to maximize global simplicity might assign a chance of 0.5 to a coin toss, while a system that treats "coins in this specific casino" as a distinct category might assign 0.6. Both systems summarize the mosaic; both have claims to being "best" depending on how one weights simplicity against local strength.

  Lewis attempted to solve this by appealing to sparse, natural properties. Yet, even natural properties can be conjoined in indefinitely many ways. The problem of determining which conjunction of properties is relevant for the chance assignment of a *singular* event remains. When we ask, "What is the chance of *this* event?", we are asking which law in the Best System applies to *this* case. Since *this* case instantiates indefinitely many properties, and the Best System contains laws governing various subsets of those properties, we are returned to the question: Which law is the relevant one?

  This is the reference class problem re-emerging as the problem of **law application**. The BSA does not tell us which theorem of the Best System applies to a specific case without first deciding which description of the case is the relevant one for subsumption under the laws.

  ### The Deep Structural Issue: Abstraction and Underdetermination

  The persistence of the reference class problem across frequentist, propensity, and Humean accounts suggests that the difficulty is not specific to the metaphysics of probability, but rather to the **logic of probabilistic modeling**.

  Probability is inherently a relation between a particular and a generalization. To assign a probability to a singular event is to treat that event as an instance of a repeatable type.
  *   **Frequentism** makes the type explicit (the reference class).
  *   **Propensity** hides the type in the "setup conditions."
  *   **BSA** hides the type in the "antecedents of the probabilistic law."

  In all three cases, the concrete particular is rich and detailed, while the probabilistic model is abstract and simplified. There is always a gap between the concrete event and the abstract model used to predict it. Bridging that gap requires a decision about which features of the event are probabilistically relevant and which are noise. Since the physical world does not come labeled with "relevant" and "irrelevant" tags, this decision is underdetermined by the evidence.

  Consequently, the preference for propensity or BSA accounts on the grounds that they solve the reference class problem is unfounded. They do not solve the problem; they obscure it.
  *   The **Propensity** theorist must still justify why a setup is described one way rather than another (the "Setup Problem").
  *   The **Humean** must still justify which properties figure in the laws that govern the case (the "Property Problem").

  Both are merely sophisticated variations of the Reference Class Problem. The frequentist is at least honest about the need to select a class; the propensity and BSA theorists often imply that the probability is intrinsic to the case or the system in a way that bypasses selection, when in fact it does not.

  ### Conclusion

  The reference class problem is often cited as a decisive reason to abandon frequentism in favor of propensity or Best-System accounts. This argument relies on the misconception that the problem arises from the *method of counting* rather than the *structure of probabilistic predication*. As demonstrated, any account that seeks to apply objective probability to singular cases must bridge the gap between concrete particulars and abstract models. Whether that model is a frequency class, a physical disposition, or a system of laws, the user must select which features of the particular are relevant to the model.

  Because a single case falls under indefinitely many descriptions, setups, and property conjunctions, no metaphysical shift from frequency to disposition or system can uniquely determine the probability without additional, non-probabilistic criteria for relevance. Therefore, trading frequentism for propensity or BSA does not resolve the underlying difficulty. It merely relocates the ambiguity from the sociology of class selection to the metaphysics of setup individuation or lawhood, leaving the core epistemic challenge untouched.
