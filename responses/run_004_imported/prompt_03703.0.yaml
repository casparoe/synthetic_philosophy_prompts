  Also, ensure I mention that Propensity theories often rely on symmetries or physical models, which also require idealization (another form of class selection).

  9.  **Final Review against Prompt:**
      *   Argue preference is not well founded? Yes.
      *   Propensity faces structural analogue? Yes.
      *   BSA faces structural analogue? Yes.
      *   Trading frequentism doesn't resolve difficulty? Yes.

