          *   *Draft Q:* Are you saying an 18-year-old conscript can't defend himself against a justified attacker?
          *   *Follow-up:* If she says "He lacks the right," ask if this makes the theory too demanding for human psychology.

      *   *Topic 5: Collectivist/Contractarian Reply (Benbaji).*
