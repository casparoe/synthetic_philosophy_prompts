answer: |-
  Here are 10 questions designed to move past exegesis and press on the structural tensions in revisionist just war theory. Each includes a "Likely Response" summary and a targeted "Follow-Up" to keep the pressure on.

  ### 1. The Excuse/Permission Collapse
  **Question:** You distinguish between unjust combatants who are *permitted* to fight and those who are merely *excused* for doing so. But if, as you've suggested, most rank-and-file unjust combatants are non-culpable due to epistemic limitations or duress, they are almost always excused. At that point, doesn't the "no permission" claim become practically indistinguishable from the Traditionalist's Moral Equality of Combatants? What work is the distinction actually doing if it rarely changes the moral verdict on the soldier's action?

  *   **Likely Response:** She will likely argue that the distinction matters for *liability* (the just soldier isn't wrong to kill the unjust one) and for *blame* (the unjust soldier shouldn't feel guilt, but the victim doesn't owe them restitution).
  *   **Follow-Up:** "If the unjust combatant isn't blameworthy and the just combatant can't tell the difference in the fog of war, doesn't insisting on the 'liability' distinction risk becoming a purely theoretical artifact that offers no action-guiding help to the actual people holding the rifles?"

  ### 2. Shue's "Deep Morality" Worry
  **Question:** Henry Shue has argued that separating the 'deep morality of war' from the 'law of armed conflict' creates a dangerous gap. If soldiers are taught that their side is likely unjust and therefore they lack moral permission to fight, doesn't that erode their incentive to follow *in bello* constraints? Why should an 'unjust' soldier follow the rules of war if he's already been told he's morally liable to be killed?

  *   **Likely Response:** She will likely contend that *in bello* constraints are independent of *ad bellum* status, or that we need a dual-system where the law remains symmetrical even if the morality isn't.
  *   **Follow-Up:** "But if the 'deep morality' tells them they are fighting wrongly, and the Law tells them they are fighting legally, aren't you creating a schizophrenia in military ethics where the law loses its normative force precisely among the soldiers who need it most?"

  ### 3. Civilian Liability and Contribution
  **Question:** Your view grounds liability in individual contribution to an unjust threat rather than combatant status. This avoids targeting innocent civilians, but where do you draw the line on 'contribution'? If a civilian works in a munitions factory, or pays taxes that fund the war, do they become liable to attack? If not, why does the uniform mark the moral boundary if liability is truly individual?

  *   **Likely Response:** She will likely invoke a threshold of "direct" or "sufficient" contribution, arguing that taxpaying or indirect supply is too attenuated to generate liability.
  *   **Follow-Up:** "In modern industrial warfare, the logistical chain is the threat. If a truck driver delivering food to a base is liable, why is the factory worker building the truck's engine not? Doesn't drawing that line arbitrarily reintroduce the kind of status-based immunity you're trying to reject?"

  ### 4. The Self-Defense Puzzle
  **Question:** On your view, a non-culpable conscript fighting for an unjust cause lacks the permission to kill a just combatant, even in self-defense. If we strip away the abstraction: are you comfortable telling an 18-year-old soldier that if a 'just' enemy tries to kill him, he morally ought to submit to death rather than shoot back?

  *   **Likely Response:** She will likely distinguish between *liability* (the just soldier can kill him) and *self-defense rights* (the unjust soldier lacks the right to kill back), perhaps conceding it's a tragic dilemma.
  *   **Follow-Up:** "If morality demands that an 18-year-old sacrifice his life because of a geopolitical judgment he couldn't verify, does that suggest the theory is too demanding to function as a human ethics, rather than just a philosopher's calculus?"

  ### 5. The Contractarian Reply (Benbaji)
  **Question:** Yitzhak Benbaji argues that combatant equality is a mutually beneficial convention, like a duel, that states agree to for mutual self-protection. Even if it's not 'deeply' true, isn't it rational for all sides to adopt the symmetry rule to minimize total destruction? Why should individual morality trump a convention that saves lives overall?

  *   **Likely Response:** She will likely argue that moral rights (like the right not to be killed) cannot be waived by a contract between states, and that utilitarian conventions shouldn't override individual liability.
  *   **Follow-Up:** "But if rejecting that convention leads to longer, bloodier wars because unjust soldiers feel they have nothing to lose, haven't you prioritized moral purity over the actual preservation of the lives you claim to value?"

  ### 6. Epistemic Constraints (Lazar)
  **Question:** Seth Lazar has pressed the point that soldiers rarely have reliable access to the *jus ad bellum* status of their mission. If moral permission tracks the justice of the cause, but the cause is epistemically opaque to the fighter, aren't you binding soldiers to moral facts they cannot access?

  *   **Likely Response:** She will likely argue that soldiers have a duty to investigate, or that they act on the *expected* justice rather than objective justice.
  *   **Follow-Up:** "In the heat of deployment, 'duty to investigate' is often impossible. If a soldier acts on reasonable but false belief in their cause's justice, are they still liable to be killed? If yes, your theory seems to punish ignorance; if no, you're back to excusing everyone."

  ### 7. *In Bello* Proportionality for the Unjust
  **Question:** For a just combatant, collateral damage is weighed against a legitimate military objective. But for an unjust combatant, the ultimate objective is illegitimate. How do you calculate *in bello* proportionality for the unjust side? Can any amount of collateral damage be 'proportional' if the end goal itself is morally forbidden?

  *   **Likely Response:** She will likely argue that *in bello* proportionality still applies to immediate tactical goals (e.g., saving comrades) even if the strategic war is unjust.
  *   **Follow-Up:** "Doesn't that fragment the war into disconnected skirmishes? If the strategic goal is unjust, doesn't achieving a tactical advantage just further an immoral project, making *any* civilian cost disproportionate to the ultimate good?"

  ### 8. Collective Responsibility vs. Individual Liability
  **Question:** Your methodology is strictly individualist, reducing war to aggregated self-defense. But wars are fought by collectives. By focusing entirely on individual liability, do you risk letting the political leadership and the state apparatus off the hook, since they are the ones who actually generate the unjust threats?

  *   **Likely Response:** She will likely deny this, arguing that leaders are *more* liable because their contribution is greater, and individualism doesn't preclude leader responsibility.
  *   **Follow-Up:** "Yet in practice, individual liability focuses scrutiny on the battlefield. If the theory makes every conscript morally scrutinizable but the political architects are distant, doesn't this democratize guilt in a way that obscures the primary aggressors?"

  ### 9. The "Fog of War" and Asymmetry
  **Question:** If your view were adopted as standard military training, the 'just' side would know they are permitted to fight, but the 'unjust' side would know they are not. Doesn't this create a dangerous moral asymmetry where one side fights with moral conviction and the other with moral hesitation, potentially encouraging aggression by those who simply *claim* justice?

  *   **Likely Response:** She will likely argue that truth is truth, and we shouldn't tailor morality to prevent bad actors from exploiting it.
  *   **Follow-Up:** "But if the theory inadvertently incentivizes bad actors to fight harder (because they know the 'good' guys are hesitating morally), have you created a theory that rewards the very aggression it seeks to condemn?"

  ### 10. *Jus Post Bellum* Implications
  **Question:** If unjust combatants are morally liable for the harm they cause, does that liability extend to post-war reparations? Should individual soldiers be financially or legally liable for damages after the war ends, or does their 'excused' status wipe that slate clean?

  *   **Likely Response:** She will likely argue that while they were liable to be killed *during* war, post-war reparations are too burdensome for excused agents and should fall on the state.
  *   **Follow-Up:** "If the state pays, but the individuals were the ones who pulled the triggers, doesn't that let the actual agents of violence escape the consequences of their liability, effectively socializing the cost of unjust aggression?"
