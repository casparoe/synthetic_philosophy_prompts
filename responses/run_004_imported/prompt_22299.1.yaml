prompt: |-
  hey, so for my political phil seminar we're doing the animal ethics unit and working through Nozick's Anarchy, State, and Utopia. Right after he lays out "utilitarianism for animals, Kantianism for people" as a candidate view (around p.40 in my copy), he drops this passage and I've reread it like four times without really getting what he's doing with it:

  "Since it counts only the happiness and suffering of animals, would the utilitarian view hold it all right to kill animals painlessly? Would it be all right, on the utilitarian view, to kill *people* painlessly, in the night, provided one didn't first announce it? Utilitarianism is notoriously inept with decisions where the *number* of persons is at issue. (In this area, it must be conceded, eptness is hard to come by.) Maximizing the total happiness requires continuing to add persons so long as their net utility is positive and is sufficient to counterbalance the loss in utility their presence in the world causes others. Maximizing the average utility allows a person to kill everyone else if that would make him ecstatic, and so happier than average. (Don't say he shouldn't because after his death the average would drop lower than if he didn't kill all the others.) Is it all right to kill someone provided you immediately substitute another (by having a child or, in science-fiction fashion, by creating a full-grown person) who will be as happy as the rest of the life of the person you killed? After all, there would be no net diminution in total utility, or even any change in its profile of distribution. Do we forbid murder only to prevent feelings of *worry* on the part of potential victims? (And how does a utilitarian explain what it is they're worried about, and would he really base a policy on what he must hold to be an irrational fear?)"

  Is the "kill and replace a person" bit meant as a reductio that's supposed to loop back and tell us something about the animals question, or is it really it's own separate tangent about population ethics that just happens to be sitting in the same paragraph? And i'm especially stuck on the "feelings of worry" line at the end -- is that supposed to be the only move left for a utilitarian to make here, and Nozick's just showing its a bad one? Kinda lost on how all these pieces are supposed to fit together, so can you help me untangle the actual structure of the argument he's making?
