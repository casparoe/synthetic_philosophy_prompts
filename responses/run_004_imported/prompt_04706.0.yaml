answer: |-
  You have hit on one of the most sophisticated and important debates in environmental economics. Your intuition is spot-on: if you value future lives equally, it *feels* like the discount rate should be zero.

  The reason there isn't a contradiction lies in the difference between **discounting time** and **discounting wealth**.

  Here is the breakdown of why the Stern Review used 1.4% while still claiming to follow Ramsey's ethics.

  ### 1. The Two Parts of the Discount Rate
  Economists generally break the Social Discount Rate ($r$) down into two components using the "Ramsey Rule":

  $$r = \rho + (\eta \times g)$$

  *   **$\rho$ (Rho) = Pure Time Preference:** This is exactly what your teacher described. It is the rate at which we discount the future *just because it is the future*.
  *   **$\eta \times g$ = The Wealth Effect:** This accounts for expected economic growth ($g$) and how much less a dollar matters to a rich person than a poor person ($\eta$).

  ### 2. What Stern Actually Did
  The Stern Review is famous precisely because it agreed with Ramsey on the first part ($\rho$).

  *   **Pure Time Preference ($\rho$):** Stern set this at **0.1%**.
      *   Why not exactly 0%? They argued there is a tiny chance humanity might go extinct before the future arrives (asteroid, nuclear war, etc.). So, there is a 0.1% chance the future people won't exist to enjoy the benefit.
      *   **Ethically:** This aligns with Ramsey. They effectively said, "We do not value future people less just because they are born later."

  *   **The Total Rate (1.4%):** The rest of that 1.4% comes from the **wealth effect** ($\eta \times g$).
      *   **The Assumption:** Stern assumed that future generations will be significantly richer than we are due to technological and economic growth.
      *   **The Logic:** This relies on the concept of *diminishing marginal utility of consumption*. If you give \$1,000 to a person in 2024, it might save a life or prevent starvation. If you give \$1,000 to a person in 2100 (who we assume will be wealthier), it might just buy a slightly nicer TV.
      *   **The Conclusion:** We aren't saying their *wellbeing* matters less. We are saying that a *dollar* buys less wellbeing for them than it does for us. Therefore, we discount the monetary cost, not the human value.

  ### 3. Why This Distinction Matters
  If Stern had used a **0% discount rate** (ignoring the wealth effect), it would imply that future people will be just as poor as we are, or that a dollar helps them just as much as it helps us.

  By using 1.4%, Stern is arguing:
  1.  **Ethically:** Future lives matter just as much as ours ($\rho \approx 0$).
  2.  **Economically:** Future people will be richer, so they can afford to pay more to fix climate problems than we can.

  ### 4. The Counter-Argument (Where your skepticism is valid)
  There are economists and ethicists who agree with you that even the 1.4% is too high. Their arguments include:

  *   **Climate Damage Might Make Future People Poorer:** The "wealth effect" assumes growth will continue. But if climate change causes catastrophic damage, future generations might be *poorer* than us. If they are poorer, a dollar matters *more* to them, and the discount rate should be lower (or negative).
  *   **Non-Monetary Damages:** Some things (like species extinction or human lives) don't follow "diminishing marginal utility." A life saved in 2100 is not "worth less" just because people in 2100 have iPhones.

  ### Summary
  Your teacher presented a classic "trap" in understanding climate economics.
  *   **Ramsey's Ethics:** Don't discount based on time alone. (Stern agreed: $\rho \approx 0$).
  *   **Economic Reality:** Don't ignore that money matters less to rich people. (Stern agreed: Add growth component).

  So, Stern isn't contradicting Ramsey; they are separating **time** from **wealth**. They are saying, "We value future people equally, but we expect them to be richer, so we invest less money today than we would if they were going to be poor."

  It is great that this bugged you. This specific tension (between ethical equality and economic growth assumptions) determines whether we spend trillions now or later, and questioning it is exactly what APES and environmental policy should be about.
