answer: |-
  This is one of the most persistent and difficult questions in twentieth-century intellectual history. Your instinct as an outsider is remarkably sharp: the structural relationship between the philosophy and the politics in these two cases is fundamentally different.

  As a biochemist, you are used to distinguishing between the *validity of a method* and the *character of the practitioner*. If a brilliant but morally repugnant chemist discovers a reaction pathway, the chemistry remains valid. However, if the repugnant views influence the *experimental design* or the *interpretation of data*, the science itself is compromised.

  Applying that distinction to philosophy is harder because philosophy is less formalized than chemistry. But we can still ask: Do the political views emerge from the core axioms of the system, or are they external additions?

  Here is the breakdown of the strongest arguments for both sides, followed by the verdict you requested.

  ---

  ### Case 1: Gottlob Frege

  **The Core Work:** *Begriffsschrift* (logic), *Grundlagen* (logicism), "On Sense and Reference" (philosophy of language).
  **The Politics:** Antisemitism, anti-democracy, monarchism, nationalism (revealed in the 1924 diary).

  #### The Argument for Entanglement
  The strongest case for entanglement does not claim that antisemitism is hidden in predicate logic. Rather, it argues that Frege's **anti-psychologism** and his **platonism** share a psychological and structural root with his authoritarian politics.

  1.  **The Fear of Relativism:** Frege's entire career was a war against "psychologism"—the idea that logical laws are just laws of human thinking. He believed truth was objective, timeless, and independent of human minds. The entanglement argument suggests this philosophical terror of subjectivity bled into his politics. He viewed democracy and parliamentary debate as "messy," subjective, and relativistic. He wanted a "Strongman" (monarch) in politics for the same reason he wanted absolute Logical Laws in philosophy: to impose order on chaos.
  2.  **The Purity of the System:** Frege's logicism was an attempt to purify arithmetic of empirical contamination. Some scholars argue this drive for "purity" mirrors the nationalist desire for ethnic or cultural purity. The rigidity of his logical system reflects a personality that could not tolerate ambiguity, whether in a proof or in a national identity.

  #### The Argument for Compartmentalization
  This is the dominant view among logicians and analytic philosophers (including Michael Dummett, after his initial shock).

  1.  **Formal Independence:** Predicate logic is formal. The validity of $\forall x (Fx \to Gx)$ does not depend on the moral status of $x$. Frege's definitions of *Sinn* (sense) and *Bedeutung* (reference) describe how language hooks onto the world. These mechanisms function perfectly well regardless of who is speaking or what they believe about Jews.
  2.  **Chronology and Context:** The diary entries are from 1924, near the end of his life, after his life's work had been shattered by Russell's Paradox and he felt ignored by the academic community. The politics look like the embittered rantings of an isolated old man, not the foundation of his earlier work. The *Grundlagen* was published in 1884; the diary is 40 years later.
  3.  **Universalism of the Logic:** Frege's logic was designed to be a universal language of thought (*lingua characteristica*). It is inherently cosmopolitan. The fact that he personally held nationalist views is a contradiction to his own philosophical tools, suggesting the politics were an external failure of the man, not an internal failure of the system.

  ---

  ### Case 2: Martin Heidegger

  **The Core Work:** *Being and Time* (ontology), *Introduction to Metaphysics*, the *Black Notebooks*.
  **The Politics:** Nazi party membership (1933), Rectorate of Freiburg University, antisemitism (especially in the *Black Notebooks*).

  #### The Argument for Entanglement
  This argument posits that Heidegger's Nazism was not a mistake, but a **philosophical consequence**.

  1.  **Historicity and Destiny:** Unlike Frege's timeless logic, Heidegger's core concept of *Dasein* (human existence) is defined by "historicity." We are "thrown" into a specific time and place. The entanglement argument holds that when Heidegger speaks of a "people" (*Volk*) finding its "destiny," this is not biological racism (which he actually criticized as too scientific) but *ontological* racism. The philosophy demands that authentic existence involves binding oneself to the historical destiny of one's community. For Heidegger in the 1930s, that destiny was National Socialism.
  2.  **Decisionism:** Heidegger emphasizes "resoluteness" and "decision" over rational deliberation. Authenticity is about choosing one's fate, not calculating utility. This maps directly onto the fascist critique of liberal democracy (which is seen as weak, calculating, and indecisive). The philosophy valorizes the *act* of will, which creates a vacuum where any strong content (like Nazism) can rush in.
  3.  **The Black Notebooks:** Recent publications show Heidegger linking "Jewishness" not just to race, but to the essence of modern technology and "rootlessness." He frames antisemitism as a metaphysical necessity in the history of Being, not just a political preference. This suggests the bias is woven into his later ontology.

  #### The Argument for Compartmentalization
  This is the defense used by many phenomenologists (including Levinas and Sartre, who adapted Heidegger for opposite ends).

  1.  **The Ontological Difference:** Heidegger distinguishes between "ontic" matters (specific entities, politics, parties) and "ontological" matters (the structure of Being). The defense argues that *Being and Time* describes the structure of human existence neutrally. That Heidegger filled that structure with Nazi content was an "ontic error."
  2.  **Tool vs. User:** Phenomenology is a method of description. Just as a microscope can be used by a Nazi or a humanitarian, the phenomenological method can be used to describe oppression or liberation. Emmanuel Levinas took Heidegger's structure of "Being-with-Others" and used it to build an ethics of responsibility that contradicts Heidegger's own coldness.
  3.  **Silence as Absence:** In *Being and Time* itself, there is no explicit mention of Nazis or Jews. The political commitments appear mostly in his lectures and later writings. One can excise the political lectures and retain the ontological analysis of anxiety, death, and care.

  ---

  ### The Verdict

  You asked for a real argued verdict, not a diplomatic tie. Based on the structural relationship between the philosophical systems and the political commitments:

  **The "Entanglement" story is significantly more defensible in the case of Heidegger than in the case of Frege.**

  Here is the reasoning, utilizing your background in rigor and systems:

  **1. Timelessness vs. Historicism**
  Frege's project was explicitly to discover **timeless** truths. He wanted to remove the human subject from logic entirely. If you remove the human subject, you theoretically remove the space for human prejudice to operate within the system. The logic is a closed formal system; the politics are external empirical claims.
  Heidegger's project was explicitly to analyze **historical** existence. His system *requires* content about culture, history, and community to function. Because his philosophy insists that truth is revealed through a specific historical context, it opens the door for the specific prejudices of that context (1930s Germany) to be mistaken for ontological truths. In Frege's system, politics are an intrusion; in Heidegger's system, politics are a potential *component*.

  **2. The Nature of the "Error"**
  In Frege's case, the politics contradict the philosophy. His logic is universal; his nationalism is particular. His logic demands objective proof; his politics demand authoritarian fiat. They are at war with each other.
  In Heidegger's case, the politics **satisfy** the philosophy. His philosophy calls for a "resolute decision" by a "people" to reclaim their "destiny." National Socialism offered exactly that. The politics fit the philosophical slots perfectly. When the *Black Notebooks* describe Jewish people as agents of "machination" and "rootlessness," he is using his philosophical categories to do the work of racism. That is not compartmentalization; that is the philosophy doing its job.

  **3. The "Biochemist" Analogy**
  *   **Frege:** Imagine a chemist who discovers the structure of DNA but believes in astrology. The astrology is repugnant and irrational, but it doesn't change the double helix. The method (crystallography) is independent of the superstition.
  *   **Heidegger:** Imagine a diagnostician who creates a framework for identifying "healthy" vs. "sick" tissue, but defines "sick" based on the patient's ethnicity rather than cellular pathology. The error isn't just in the doctor's head; it is in the **diagnostic criteria**. You cannot use the diagnostic tool without risking the bias built into the definitions.

  ### Conclusion

  Michael Dummett eventually concluded that while Frege's politics were vile, they did not infect the logic. He was right. Frege's diary reveals a bitter man, but his *Begriffsschrift* reveals a universal structure.

  With Heidegger, the verdict must be harsher. While you can extract useful phenomenological descriptions from his work (as Sartre and Merleau-Ponty did), you cannot claim the politics were merely "compartmentalized." The concepts of *Volk*, *Destiny*, and *Historicity* are the load-bearing walls of his ontology, and he loaded them with fascist content.

  Frege is a case of a great mind failing morally outside its domain of expertise. Heidegger is a case of a great mind failing morally *within* its domain of expertise, using the tools of ontology to legitimize barbarism. The entanglement in Heidegger is deeper, structural, and far more dangerous to the work itself.
