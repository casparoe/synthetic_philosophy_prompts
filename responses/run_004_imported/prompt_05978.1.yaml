prompt: |-
  My friend Priya is 8 months pregnant and her partner's throwing her a baby shower this weekend. Priya's a decision theory person -- her whole dissertation is basically "L.A. Paul is right, you can't rationally choose to become a parent, so now what" -- and its become a running joke in our cohort that she's about to live out her own third chapter in real time. She asked me to give the toast (same program, different subfields, so I know just enough to be dangerous, but not enough to write this myself).

  Half the room is our department, half is her very non-academic extended family. Write me a 3-ish minute toast that actually uses the epistemic vs. personal transformative distinction -- the part where even honest testimony from other parents can't close the gap, because the "you" who'd be able to judge whether it was worth it doesn't exist yet -- to say something true and warm, not just "a baby will change your life!" Extra credit if it gestures at her own attempted fix for the problem (something about weighting your current values against your probable future ones -- I forget exactly how it goes, she calls it "cheating") without turning into a decision theory seminar.
