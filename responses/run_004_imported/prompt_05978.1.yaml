answer: |-
  Hi everyone. For those who don't know me, I'm [Name], a friend from Priya's PhD program. And for those who *do* know me, you know there is a specific, delicious irony in asking me to give this toast.

  As many of you know, Priya is a decision theorist. Her entire dissertation is built on the work of philosopher L.A. Paul, who argues that becoming a parent is a "transformative experience."

  For the family members who didn't get a philosophy degree with their dinner: L.A. Paul says there are two kinds of transformation. There's *epistemic*, where you learn new information—like finally tasting a mango you've only seen in pictures. But then there's *personal* transformation, where the experience changes who you *are*.

  The argument is that you can't rationally choose to become a parent. Why? Because the "you" that exists today—the one weighing the pros and cons—will not be the same "you" holding the baby. Your values, your priorities, your very identity will rewrite themselves. So, when Priya's friends tell her, "It's the most amazing thing ever," that testimony doesn't actually help. It's like a vampire trying to explain blood to a human. The Priya who could judge whether it was "worth it" doesn't exist yet.

  So, by all logical accounts, Priya is walking into a decision she cannot make.

  But here is the thing I've learned watching her write this dissertation while her belly grew: Priya has found a workaround. She calls it "cheating."

  Her model suggests that when you can't know your future values, you have to build a bridge. You take the values you hold now—curiosity, resilience, love—and you weight them against the person you hope to become. You make a bet on a self you haven't met yet. She calls it cheating the model because it admits the math doesn't fully work.

  But I'm here to tell you that in this room, we don't call that cheating. We call it courage.

  Because the only way to cross the gap between who you are and who you'll become is to trust that the love you have now is strong enough to build the person you'll be later. You can't reason your way into parenthood. You have to leap.

  Priya, you've spent years analyzing the gap. This weekend, you stop looking down and start looking forward. To the new self waiting for you, to your partner who's leaping with you, and to the little one who makes the whole question irrelevant.

  To Priya.
