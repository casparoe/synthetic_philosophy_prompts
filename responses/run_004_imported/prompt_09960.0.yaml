prompt: |-
  ok so i'm on my school's student senate and we're stuck on this. this one sophomore who reads a bunch of economics/rationalist blogs pitched using "futarchy" to decide our new bell schedule instead of just voting on it -- basically set up two markets using the fake Senate Bucks we already have from spirit week (one betting on "avg tardiness in april IF we switch to the later start time," one for "IF we keep it the same"), let the whole school trade all week, and whichever market predicts lower tardiness automatically becomes the policy, no vote needed. half the senate thinks this is actually more fair/objective than politics, the other half thinks its dumb bc theres no real money on the line so nobody has a reason to bet honestly, plus theyre worried kids who want the later start will just gang up and bet to make that market look good on purpose. i have to present a memo to the senate monday recommending whether we should actually do this, and if a scaled-down trial version makes more sense say exactly what that'd look like and for how long before we decide for real. it needs to seriously deal with the manipulation/no-real-stakes problem instead of just saying "well markets are usually smart" and moving on -- can you write that memo for me?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** High school student senate.
      *   **Issue:** Deciding on a new bell schedule (specifically, later start time vs. status quo).
      *   **Proposal:** A sophomore suggests "Futarchy" (decision markets) using fake "Senate Bucks" from spirit week.
      *   **Mechanism:** Two prediction markets. One conditional on policy A (later start), one on policy B (same start). Whichever predicts better outcomes (lower tardiness) wins automatically.
      *   **Conflict:** Half the senate thinks it's fair/objective. Half thinks it's dumb (no real stakes, manipulation risk by students who just *want* the later start regardless of tardiness).
      *   **Task:** Write a memo to the senate recommending whether to do this, addressing the manipulation/stakes problem seriously. If a trial is recommended, specify the design and duration.
      *   **Tone:** Professional, persuasive, analytical, appropriate for a high school student senate (smart but not overly academic).
      *   **Key Constraint:** Must deal with the "no real stakes/manipulation" objection, not hand-wave it.

  2.  **Deconstruct the Proposal (Futarchy in a High School):**
      *   *What is Futarchy?* Governance by prediction markets. "Vote on values, bet on beliefs."
      *   *The Specific Plan:* Conditional markets on tardiness.
      *   *The Problem:* "Senate Bucks" are fake. In prediction market theory, without skin in the game, information aggregation fails. If I *want* a later start, I will bet on the "Later Start -> Low Tardiness" market regardless of what I actually believe, just to make that policy win. This is "cheap talk."
      *   *The Counter-Argument:* Maybe social prestige or future privileges could act as stakes? Maybe the market is just a poll with incentives?
      *   *Feasibility:* Can the school actually measure "avg tardiness in April" accurately? Yes, attendance records exist. Can they enforce the "automatic" decision? Probably not legally/administratively (administration has final say), which undermines the mechanism.

  3.  **Evaluate the Objections:**
      *   *Objection 1: No Real Money.* Valid. Fake currency = no penalty for lying.
      *   *Objection 2: Manipulation.* Valid. If the goal is "Later Start" (value) rather than "Low Tardiness" (metric), students will game the market.
      *   *Objection 3: Administrative Authority.* The student senate usually *recommends*, not *decides*. An "automatic" market might overstep authority.

  4.  **Formulate a Recommendation:**
      *   *Full Futarchy?* No. Too risky, easily gamed, administrative hurdles.
      *   *Outright Rejection?* No. Dismisses innovation and student engagement.
      *   *Middle Ground (Hybrid):* Use the market as a *weighted advisory poll* rather than an automatic decision maker. Add stakes (even if non-monetary). Limit the scope.
      *   *Better Alternative:* A "Decision Market Pilot." Run the market to *inform* the vote, not replace it. Add reputation stakes.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Quick verdict. (Recommend a modified pilot, not full adoption).
      *   **Background:** Briefly explain the proposal and the debate.
      *   **Analysis of Risks (The "Meat"):**
          *   *The Stakes Problem:* Explain *why* fake money fails (no cost to lying).
          *   *The Manipulation Problem:* Explain how preference voting hijacks prediction markets.
          *   *The Metric Problem:* Is tardiness the only thing that matters? (What about learning, sleep, lunch lines?)
      *   **Recommendation (The Solution):**
          *   Don't make it automatic.
          *   Add "Reputation Stakes" (leaderboards, privileges).
          *   Run it as a "Consultative Market."
          *   Combine with a traditional vote.
      *   **Pilot Design:**
          *   Duration (2 weeks).
          *   Currency (Senate Bucks + Bonus/Privileges).
          *   Metric (Tardiness + maybe a survey score).
          *   Resolution (Admin data + Senate verification).
      *   **Conclusion:** Final pitch.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Reputation Stakes" enough?
      *   *Fix:* Acknowledge it's not perfect money, but better than nothing. Suggest tying it to something tangible like priority registration for events or pizza parties.
      *   *Critique:* The prompt asks to deal *seriously* with the manipulation problem.
      *   *Fix:* I need to explicitly explain the difference between *voting on values* and *betting on beliefs*. If students bet based on values (I want late start), the market breaks. I need to propose a mechanism to penalize inaccurate predictions *after the fact* to encourage honesty.
      *   *Idea:* "Bounty on Accuracy." At the end of the semester, reward the top predictors, regardless of which policy won. This aligns incentives with *truth*, not *outcome*.

  7.  **Final Polish:**
      *   Ensure tone is respectful but firm.
      *   Make sure the "Pilot" section is concrete (dates, rules).
      *   Check that it answers the prompt's specific constraints (manipulation/stakes).

  8.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Address manipulation/stakes? Yes (Bounty on Accuracy).
      *   Recommendation on trial? Yes (2-week consultative pilot).
      *   Tone? Student senate appropriate.

  *(Self-Correction Note: Make sure not to sound like an economics professor. Keep it practical for high schoolers.)*

  9.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Student Senate
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal to Use Futarchy for Bell Schedule Decision

  ### Executive Summary
  The proposal to use a "futarchy" model (decision markets) to determine the bell schedule is an innovative attempt to reduce political gridlock and focus on outcomes. However, implementing this as a binding, automatic decision using fake currency ("Senate Bucks") carries significant risks of manipulation and incentive failure.

  **Recommendation:** I recommend we **reject the binding futarchy model** but **approve a scaled-down, consultative pilot** for two weeks. This pilot will use the market structure to gather information, not to automatically set policy. To solve the "no real stakes" and manipulation problems, we will modify the incentive structure to reward *accuracy* rather than *policy preference*.

  ### Background
  A sophomore senator proposed replacing our standard voting process with conditional prediction markets. The mechanism involves two markets betting on average tardiness in April: one conditional on adopting a later start time, and one conditional on keeping the current schedule. The market predicting the lower tardiness would automatically trigger that policy.

  Supporters argue this removes bias and focuses on results. Opponents argue that without real money, students will bet dishonestly to force their preferred outcome (later start), rendering the data useless.

  ### Analysis of Risks
  The opposition's concerns regarding incentives and manipulation are economically sound. Here is why the original proposal is likely to fail if implemented as written:

  **1. The "Cheap Talk" Problem (No Skin in the Game)**
  Prediction markets work because traders lose money when they are wrong. This financial pain forces them to bet on what they *believe is true*, not what they *wish was true.*
  *   **Current Proposal:** Senate Bucks have no cash value. If a student wants a later start time, they have zero penalty for betting heavily on "Later Start = Low Tardiness," even if they know it won't actually reduce tardiness.
  *   **Result:** The market prices will reflect student *desires*, not student *predictions*. It becomes a straw poll with extra steps.

  **2. Value Voting vs. Belief Betting**
  Futarchy relies on the distinction: *Vote on values, bet on beliefs.*
  *   **Current Proposal:** By making the market result binding, we encourage students to treat bets as votes. A student who values sleeping in will "buy" shares in the Later Start market to drive the price up, ensuring that policy wins.
  *   **Result:** The market becomes manipulatable by organized groups (e.g., the Athletic Department or Grade-Level chats) who can coordinate to flood one side, drowning out informed traders.

  **3. Administrative Authority**
  Even if the market works perfectly, the Administration retains final authority over the bell schedule. If the market chooses a schedule the Principal rejects, the mechanism loses all credibility. We cannot promise an "automatic" outcome we cannot legally guarantee.

  ### Proposed Solution: The "Accuracy-Rewarded Pilot"
  We should not discard the tool entirely. Prediction markets are excellent at aggregating information *if* incentives are aligned. I propose a **Consultative Decision Market Pilot**.

  **Objective:** Use the market to inform the Senate's final vote, not replace it.
  **Duration:** 2 Weeks (November 6 – November 17).

  #### 1. Fixing the Incentive Structure
  To prevent manipulation, we must decouple the reward from the *policy outcome* and attach it to *prediction accuracy*.
  *   **The "Bounty on Truth":** At the end of the semester (April), we will verify the actual tardiness data with the Attendance Office.
  *   **Payout:** Students who held shares in the *correct* prediction (regardless of which policy was actually chosen) receive a bonus.
  *   **Why this works:** If I want a later start, but I know it won't reduce tardiness, I am now incentivized to bet on the truth (that tardiness won't drop) so I can win the Bounty. This aligns their profit motive with accurate information.

  #### 2. Creating "Stakes" Without Cash
  Since we cannot use real money, we must use **Reputation and Privilege Stakes**.
  *   **Leaderboard:** Publish a weekly "Top Trader" list in the school newsletter.
  *   **Tangible Rewards:** The top 10 most accurate predictors at the end of the year get priority seating at graduation, front-of-line passes for lunch, or a dedicated pizza party.
  *   **Entry Fee:** To participate, students must "buy in" 50 Senate Bucks. This creates a small opportunity cost (they can't spend those bucks on spirit week gear), which discourages completely random betting.

  #### 3. Metric Expansion
  Tardiness is important, but it isn't the only value.
  *   We will run a parallel market on **"Student Satisfaction Score"** (based on a random sample survey in April).
  *   This prevents a scenario where tardiness drops but everyone is miserable (e.g., because lunch periods are cut).

  ### Implementation Plan
  If the Senate approves this pilot, here is the timeline:

  *   **Oct 30:** Senate votes to authorize Pilot (Non-binding).
  *   **Nov 3:** Rules published. "Bounty on Truth" prizes announced.
  *   **Nov 6 – Nov 17:** Markets open. Students trade Senate Bucks on conditional outcomes.
  *   **Nov 20:** Markets close. Senate reviews the "Implied Probabilities."
      *   *Example:* If the market implies an 80% chance tardiness drops with a later start, but only a 40% chance with the status quo, we use this data to argue our case to the Administration.
  *   **Nov 27:** Traditional Senate Vote on Bell Schedule Recommendation (informed by market data).
  *   **April:** Verification of data and distribution of "Bounty" rewards to accurate predictors.

  ### Conclusion
  The original futarchy proposal is theoretically sound but practically vulnerable to gaming because the currency is fake and the stakes are misaligned. By shifting the focus from **binding policy** to **advisory intelligence**, and by rewarding **accuracy** rather than **policy preference**, we can harness the "wisdom of the crowd" without falling for the "manipulation of the mob."

  I move that we adopt the **Consultative Decision Market Pilot** as outlined above.
