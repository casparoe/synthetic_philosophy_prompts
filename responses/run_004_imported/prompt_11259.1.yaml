answer: |-
  This is a classic dispute that cuts to the heart of the Bikhchandani–Hirshleifer–Welch (BHW) model. It mirrors a long-standing tension in game theory between *individual rationality* (maximizing your own expected utility) and *social efficiency* (maximizing the group's ability to find the truth).

  Here is a move-by-move breakdown of who has the better of the argument, followed by an analysis of where they talk past each other and the terminology you're looking for.

  ### Move-by-Move Analysis

  **Move 1: Nora's Claim on Individual Irrationality**
  *   **Nora's Position:** Diners ignoring their private hints to follow the crowd are being irrational (committing a cognitive bias).
  *   **Theo's Position:** Ignoring the hint is Bayesian rational; the public information outweighs the private signal.
  *   **Verdict: Theo is right.**
      In the standard BHW setup, agents are modeled as perfect Bayesian updaters. Once a cascade begins (usually after a difference of two in the public count), the *inferred* information from the predecessors' choices mathematically outweighs the precision of a single private signal. To follow your private signal at that point would actually be the irrational act, because it would mean privileging a noisy, low-weight signal over a high-weight public posterior. Nora is applying a folk-psychological definition of "irrational" (stubbornness/copying) rather than the game-theoretic one (expected utility maximization).

  **Move 2: Theo's Claim on Individual Rationality**
  *   **Theo's Position:** Bayesian updating implies the private hint cannot outweigh the crowd imbalance.
  *   **Verdict: Theo is right.**
      This is the core mathematical result of the 1992 paper. If the signal precision is, say, 0.6 (60% chance of being correct), and the public history implies a probability of 0.8 that Restaurant A is better, a rational agent must choose A even if their private signal says B. Theo correctly identifies that the "irrationality" label is a misapplication of the term in this context.

  **Move 3: Nora's Claim on Systemic Failure**
  *   **Nora's Position:** Even if individuals are rational, the information pooling has visibly failed; something has gone wrong.
  *   **Verdict: Nora is right.**
      While Theo wins on the *individual* mechanics, Nora wins on the *social* outcome. The central "paradox" of the BHW model is that individually rational behavior leads to a socially inefficient equilibrium. The group stops aggregating information prematurely. If the goal of the system is truth-tracking (finding the actually better restaurant), the system has failed. Nora correctly identifies that "no single diner erred" does not mean "the outcome is optimal."

  **Move 4: Theo's Claim on Information Loss**
  *   **Theo's Position:** The problem is information loss/fragility (choices stop carrying private info), not bad reasoning.
  *   **Verdict: Theo is right.**
      Theo accurately diagnoses the mechanism. Once the cascade starts, actions become "cheap talk" in terms of information content; they reveal nothing about the actor's private signal because the actor would have made that choice regardless of the signal. Theo is correct that labeling this "irrationality" obscures the actual structural issue, which is that the *channel* of communication (actions) has become clogged.

  ### Where They Talk Past Each Other

  The disagreement stems from two distinct levels of analysis that they are conflating:

  1.  **Individual vs. Social Rationality:**
      *   **Theo** is using the economist's definition of rationality: *Is the agent maximizing expected utility given their information set?* (Yes).
      *   **Nora** is using a systemic definition of rationality: *Is the group successfully aggregating distributed knowledge to find the truth?* (No).
      *   They are both correct within their own frames, but they are using the word "rational" to mean two different things. Nora sees the *outcome* (wrong restaurant) as proof of error; Theo sees the *process* (Bayesian updating) as proof of correctness.

  2.  **The Locus of the "Error":**
      *   Nora locates the error in the **agents** ("they are discarding evidence").
      *   Theo locates the error in the **structure** ("the choice stops carrying information").
      *   This is the crucial pivot. In cascade theory, the "error" is an **externality**. When a diner follows the crowd, they gain a small personal benefit (higher chance of picking the right restaurant based on current info) but impose a large cost on the group (their private signal is lost to future diners). Nora sees the cost; Theo sees the lack of individual incentive to avoid it.

  ### The Terminology: What is Theo's Last Point Called?

  You asked for the standard name for the gap Theo describes: *a crowd of fifty diners looks like fifty pieces of evidence when it may really be two or three.*

  There isn't one single "pop-psychology" term like *Confirmation Bias*, but in the literature on social learning and cascades, this is most precisely referred to as an **Information Externality**.

  *   **Information Externality:** This is the standard economic term for the mechanism. It describes the fact that an individual's action conveys information to others, but the individual does not account for the *value* of that information when making their choice. Because they don't get "paid" for revealing their private signal, they rationally choose to hide it (by following the crowd), creating the gap Theo describes.

  If you are looking for a term that describes the *statistical state* of the crowd (50 people $\neq$ 50 signals), the most accurate technical descriptor is **Informational Redundancy**.

  *   **Informational Redundancy:** This refers to the condition where multiple observations (the 50 diners) do not provide independent data points. In a cascade, the effective sample size is tiny compared to the nominal sample size.

  **Recommendation:**
  If you want to sound like you've read the BHW paper specifically, use **Information Externality** to describe the *cause* of the problem (why they don't reveal signals) and **Informational Redundancy** to describe the *state* of the crowd (why 50 people isn't 50 signals).

  If you want to describe the *fragility* Theo mentions (that a tiny bit of new public info can break the cascade), the standard term is **Cascade Fragility**.

  ### Summary for the Group
  You can tell Nora and Theo that they have effectively recreated the central tension of the 1992 paper. Theo is right that the diners are **individually rational** (no cognitive bias), but Nora is right that the equilibrium is **socially inefficient** (information pooling fails). The "gap" Theo identifies is the result of an **Information Externality** leading to **Informational Redundancy**. Neither is wrong; they are just describing the input (individual reasoning) and the output (systemic failure) of the same mathematical model.
