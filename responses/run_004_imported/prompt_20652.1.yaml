answer: |-
  The tie felt like a noose that had already been tightened, waiting for the drop. Thomas adjusted it in the elevator mirror, watching his own hands. They were steady, but they felt heavy, as if the blood inside them had turned to syrup.

  He was the only Black man on the fourth floor of the Chicago insurance building. He was also the only actuary who could calculate the risk pools faster than the chief underwriter, Mr. Henderson. Thomas knew this. Henderson knew this. The silence between those two facts was where Thomas lived.

  It was 10:15 AM. The morning meeting.

  Thomas entered the conference room. The hum of conversation didn't stop, but it shifted. It was a change in frequency, a subtle static that prickled the back of his neck. He took his seat at the far end of the mahogany table, near the window.

  "Morning, Thomas," Henderson said, not looking up from his file. "Good to have you."

  "Good morning, sir."

  Thomas opened his notebook. He had prepared the projections for the new industrial zone policies. He had stayed up until 2:00 AM checking the variables. He knew the numbers were solid.

  Henderson began to speak, outlining the strategy. He used Thomas's numbers. He cited the risk assessments Thomas had submitted on Tuesday. But he did not say Thomas's name. He said, "The data suggests," and "We have found."

  Thomas felt a heat rise in his chest. It wasn't anger, exactly. Anger had a shape; anger was a fist. This was a dissolving. It was a feeling of being poured out of a container and left to evaporate. He watched Henderson's mouth move. He wanted to say, *I did that work. That is my mind on that paper.*

  But to say that would be to make a scene. To make a scene would be to confirm the suspicion that hung in the static: that he was difficult, that he didn't understand how things were done here.

  So Thomas sat. He nodded. He wrote *Action Items* in his notebook, though there was nothing for him to do but watch his own ghost run the department.

  At 12:30, he went to the cafeteria. He sat alone. A white colleague, a young man named Miller whom Thomas had helped with a complex formula last week, walked by with a tray.

  "Hey, Thomas," Miller said. He stopped, smiling broadly. "I heard you in there. You guys are crunching some serious numbers."

  *You guys.*

  Thomas smiled back. It was a reflex, a muscle memory trained over thirty-two years. "Just doing the job, Miller."

  "You're so... thorough," Miller said. He hesitated, searching for a compliment. "I mean, you really have a knack for the details. It's impressive."

  *Thorough.* *Knack.* *Details.*

  The words landed on Thomas's skin like small, sharp stones. They were not insults. If he showed them to his wife, Mary, she would say, *He complimented you, Tom. Why are you looking at me like that?*

  If he told Henderson, Henderson would say, *I praised your work ethic. Are you claiming you deserve a promotion based on a adjective?*

  Thomas took a bite of his sandwich. It tasted like cardboard. He felt a pressure building behind his eyes, a specific kind of fatigue that sleep did not touch. It was the fatigue of translation. He was constantly translating his intent into a language that would not threaten, translating his competence into a form that would not overshadow, translating his presence into something small enough to fit in the chair they had allowed him.

  He finished lunch and went to the clinic. The company required a physical for the new policy tier.

  The doctor was a company man, white, with a cold stethoscope. He listened to Thomas's heart. He checked his reflexes. He shone a light into Thomas's pupils.

  "Blood pressure is elevated," the doctor said, writing on a clipboard. "140 over 90."

  "I know," Thomas said.

  "Stress?"

  Thomas opened his mouth. He wanted to describe the static. He wanted to explain that every hour of the day, there was a tax levied on his nervous system just for occupying space. He wanted to say that he was carrying a weight that no one else could see, a weight made of a thousand tiny cuts that didn't bleed.

  "I suppose," Thomas said.

  "Take these," the doctor said, sliding a small bottle of pills across the desk. "Belladonna alkaloids. Calms the nerves. And try to relax, son. You're young. Don't let the work get to you."

  *Son.*

  Thomas took the bottle. He put it in his pocket. He didn't argue. What was the argument? *Doctor, I am not sick. I am being eroded.*

  There was no word for erosion of the self. There was no word for the injury of being unseen in plain sight. There was no diagnosis for the wound that opened when you were treated as a category instead of a person.

  He went back to the office. At 3:00 PM, Henderson called him into his office.

  "Thomas," Henderson said, leaning back in his leather chair. "The board is happy with the industrial zone projections. Good work."

  "Thank you, Mr. Henderson."

  "I'm thinking," Henderson continued, steepling his fingers. "We might need someone to handle the client meetings for this account. Face-to-face."

  Thomas waited.

  "You understand," Henderson said, his voice dropping to a confidential tone. "The clients are from out of town. Traditional folks. We want to make sure they feel... comfortable. So I'll handle the meetings. You can stay on the analytics. That's where your strength is."

  *Comfortable.*

  Thomas looked at his hands. They were resting on his knees. He felt a tremor in the left one. He clenched it into a fist to stop it.

  He understood. He understood perfectly. But understanding did not give him a tool to change it. It only gave him the clarity to see the cage.

  "I see," Thomas said.

  "Good man," Henderson said, turning back to his paperwork. "You can go."

  Thomas walked out. He walked down the hall to the men's room. He went into a stall and locked the door. He sat on the toilet lid, fully clothed.

  He closed his eyes. He tried to find the name for what was happening.

  Was it injustice? No, that implied a law had been broken. The law was fine.
  Was it cruelty? No, Henderson was smiling. Henderson thought he was being kind. Protecting Thomas. Protecting the company.
  Was it sadness? No, sadness came and went. This was a climate.

  He reached into his mind for a word, a concept, a handle he could grab to pull himself out of the hole. He reached for *discrimination*, but that felt too legal, too loud. He reached for *unfair*, but that was a child's word. He reached for *theft*, but nothing physical had been taken.

  There was a silence in his head where the word should have been.

  It was a terrifying silence. It was the silence of a map that had a blank spot where he was standing. If he couldn't name it, was it real? If there was no language for the injury, was he just imagining the pain? Was he the problem? Was he too sensitive? Was he *thorough*?

  He took the bottle of pills from his pocket. He looked at the white plastic. *Calms the nerves.*

  They wanted to treat the symptom because they could not see the disease. They could not see the disease because they had never built the microscope to look for it. People like him had not been in the room when the definitions of *work*, and *merit*, and *professionalism* were written.

  Thomas stood up. He flushed the toilet to make it sound like he had used it. He washed his hands in the sink. He looked at himself in the mirror.

  The man in the mirror looked tired. The eyes were dark, the skin tight over the cheekbones.

  "Thomas," he whispered to the mirror.

  The name sounded thin.

  He adjusted his tie. He tightened the knot until it pressed against his windpipe. He checked his expression. He smoothed the anger away. He smoothed the confusion away. He put the mask back on, the one that was polite, and thorough, and safe.

  He opened the door and walked back down the hall.

  He sat at his desk. He opened his calculator. He began to crunch the numbers for the next policy. He did the work. He did it perfectly.

  And as the sun began to set over the Chicago skyline, casting long shadows across the fourth floor, Thomas felt the static rise again, filling the room, filling his lungs. He breathed it in. He had no choice. There was no other air.
