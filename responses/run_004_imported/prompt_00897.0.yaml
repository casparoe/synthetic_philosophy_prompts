answer: |-
  **Characters:**

  *   **ELIAS:** A reductionist. Believes dispositional predicates can be analyzed via subjunctive conditionals.
  *   **MARA:** A realist. Believes dispositions are primitive, irreducible properties.

  **Setting:** A cluttered graduate office. Afternoon light slants across a desk covered in packing tape, scissors, and rolls of bubble wrap. In the center sits an unglazed terracotta vase from the 4th Century BCE.

  ***

  **MARA:** (Holding the vase suspended over the desk) Careful. This thing is fragile.

  **ELIAS:** (Tearing off a sheet of bubble wrap) It is. Which just means: if you were to strike it sharply, it would break.

  **MARA:** That's the Simple Conditional Analysis. You know it's dead, Elias.

  **ELIAS:** It's a working hypothesis. 'Fragile' means 'breaks if struck.' It captures the truth conditions.

  **MARA:** It captures nothing. Imagine I drop this, but the moment it leaves my hand, a sorcerer—let's call him Martin—zaps the vase. He doesn't catch it. He doesn't cushion it. He instantaneously alters its molecular structure so that it becomes elastic, like rubber. It hits the floor, bounces, and remains intact. Then, immediately after impact, he restores the structure.

  **ELIAS:** A sorcerer?

  **MARA:** An electro-fink. The point is metaphysical, not magical. In that scenario, the vase is fragile before the drop. You agree?

  **ELIAS:** Intuitively, yes.

  **MARA:** But the conditional "If it were struck, it would break" is false. It was struck, and it didn't break. So your analysis yields a false negative. The disposition is present, the conditional is false. Therefore, the disposition cannot *be* the conditional.

  **ELIAS:** (Smoothing the bubble wrap over the vase's lip) Martin's case. Fine. The problem is that the disposition vanishes *at the moment of stimulus*. That's why Lewis reformulated it. We don't look at the bare conditional. We look for an *intrinsic causal basis*.

  **MARA:** Go on.

  **ELIAS:** The vase is fragile because it possesses a specific microphysical structure—a crystalline lattice, let's say. That lattice is the basis, $B$. The Reformed Analysis says: $x$ is fragile iff $x$ has $B$, and if $x$ were struck and $B$ persisted, $x$ would break. In your sorcerer case, $B$ does *not* persist. The sorcerer deletes the basis upon impact. So the antecedent "If struck and $B$ persists" is not met in the way the world actually plays out in the fink case. The analysis holds because the counterfactual requires the basis to stay put.

  **MARA:** (Pressing a bubble until it pops) So you save the analysis by anchoring it to the intrinsic structure. The fragility is the lattice, plus the counterfactual link to breaking, provided the lattice stays.

  **ELIAS:** Exactly. It handles the fink. The fink removes the basis, so the conditional doesn't trigger.

  **MARA:** But it doesn't handle the mask. And you're holding the counterexample in your hands.

  **ELIAS:** (Taping the wrap down) The bubble wrap?

  **MARA:** The bubble wrap. I'm wrapping the vase. The intrinsic basis $B$—the lattice—is still there. You haven't changed the clay. Now, suppose I drop it. The stimulus occurs: impact with the floor. The basis persists: the lattice doesn't vanish. But the manifestation does not occur: it doesn't break. The wrap absorbs the shock.

  **ELIAS:** That's a masking case.

  **MARA:** It is. And it destroys your Reformed Analysis. According to Lewis, if $B$ persists and the stimulus occurs, the manifestation *must* follow. But here, $B$ persists, the stimulus occurs, and the vase remains whole. Your conditional is false. So, by your own analysis, this wrapped vase is not fragile.

  **ELIAS:** (Pulling the tape tight) But it *is* fragile.

  **MARA:** Precisely. The disposition is real, intrinsic, and present. But the conditional fails because of an extrinsic interferer. You can't analyze the power away by referencing the basis, because the basis is causally sufficient *only* in the absence of masks. But "absence of masks" isn't in your analysis. If you add it—"if struck, $B$ persists, and no masks interfere"—you're begging the question. You're defining the disposition by referencing the absence of things that stop the disposition. You need the concept of a mask to define the mask.

  **ELIAS:** (Rotating the vase) I don't need to beg the question. I need to be precise about the stimulus description. The literature has moved past Lewis on this, Mara. Manley and Wasserman, for instance. Dispositional predicates are context-sensitive.

  **MARA:** Contextualism is a retreat, not a solution.

  **ELIAS:** It's a refinement. When I say "This vase is fragile," the stimulus condition "if struck" is implicitly restricted by the conversational context. In a metaphysics seminar, "struck" might mean "struck under any conditions." But in a shipping context, or a normal context, "struck" means "struck in standard conditions."

  **MARA:** "Standard conditions"? That's a placeholder for "conditions where my analysis works."

  **ELIAS:** No, it's a semantic rule. 'Fragile' is gradable. A vase wrapped in bubble wrap is *less* fragile than a bare vase, but it retains the disposition relative to a stronger stimulus. But more importantly, the ascription "fragile" picks out a relation between the object and a *canonical* stimulus. The bubble wrap changes the stimulus. The impact on the *wrap* is not the same stimulus as the impact on the *glass*.

  **MARA:** That's verbal gymnastics. The kinetic energy hits the system. The glass is the thing with the disposition. If the glass doesn't break, your conditional is false. If you say "Ah, but the stimulus wasn't *really* applied," you're just protecting the theory from falsification. You're saying the vase is fragile because it *would* break if... if what? If the wrap weren't there?

  **ELIAS:** Yes.

  **MARA:** Then the truthmaker for "The vase is fragile" isn't the vase's current state plus a conditional. It's the vase's current state plus a fact about *other possible worlds* where the wrap is absent. But why those worlds? What grounds the similarity?

  **ELIAS:** The intrinsic basis does.

  **MARA:** The basis is there in *this* world, in *this* wrap, and it doesn't break. You're smuggling in a primitive modality. You're saying the basis *would* cause breaking *if* nothing stopped it. But "if nothing stopped it" is just "if the power manifested." You're analyzing "fragility" as "the power to break," and then analyzing "the power to break" as "breaks if... unless it doesn't."

  **ELIAS:** (Cutting the tape) I'm analyzing it as a conditional tied to an intrinsic property, evaluated over worlds where extrinsic interferers are held fixed or ruled out by context. It's not circular; it's contextual. The predicate 'fragile' doesn't pick out a monadic property of the vase. It picks out a relation between the vase, its basis, and a contextually selected set of test conditions.

  **MARA:** So fragility isn't in the vase.

  **ELIAS:** The *basis* is in the vase. The *disposition ascription* is a relation.

  **MARA:** And I say that's why you're stuck. You're trying to reduce a causal power to a truth condition about worlds. But the power is what *makes* those worlds relevant. The vase has a primitive potency. It *tends* toward shattering. The bubble wrap fights that tendency. The sorcerer fights that tendency. The tendency is real, even when thwarted. Your conditionals are just shadows cast by the power. When the light changes—finks, masks, context—the shadows move, and you scramble to redraw the lines.

  **ELIAS:** And I say your "primitive potency" is an occult quality. It explains everything by naming nothing. If I ask "Why did it break?" you say "Because it was fragile." If I ask "What is fragility?" you say "The power to break." It's a closed loop. My conditional analysis connects the property to observable evidence. Even with the masks, we can specify the conditions.

  **MARA:** You can specify them only by presupposing the very modality you're trying to reduce. You need the notion of "interference" to fix the conditions. But interference is just "something that stops a power." You can't have interference without the power.

  **ELIAS:** (Sealing the box) Maybe. But I can ship the vase. I know what to expect. If I treat fragility as a primitive power, I still have to predict when it breaks. I still use conditionals.

  **MARA:** You use conditionals because powers manifest. But the metaphysics isn't the semantics.

  **ELIAS:** And the semantics isn't the metaphysics. But if I can't analyze the predicate, I can't use it in a theory.

  **MARA:** Then your theory is too small for the world. (She taps the box.) That box contains a power, Elias. Not a sentence.

  **ELIAS:** (Labeling the box "FRAGILE") And this label ensures the carrier treats the conditional "If dropped, then care" as true.

  **MARA:** (Smiling) We'll see if it survives the transit.

  **ELIAS:** If it does, I'll say the stimulus wasn't severe enough.

  **MARA:** And I'll say the power persisted.

  **ELIAS:** (Picking up the tape gun) Pass me the marker.

  **MARA:** (Handing it over) Careful. It's fragile.

  **ELIAS:** I know what that means.

  **MARA:** Do you?

  *(Elias writes on the box. The marker squeaks. The dialogue ends.)*
