answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being [Bride]'s best friend.

  Usually, this is the part of the speech where I stand up and list all the reasons why [Bride] is amazing. I'd talk about her kindness, her intelligence, her patience. And then I'd do the same for [Groom]. And then I'd say, "Put these two great people together, and you get a great marriage."

  But there's a problem with that plan. It's actually philosophically unsound.

  A few years ago, a few of us started an online reading group. We weren't academics. We were just bored friends in the middle of a cold winter, picking philosophy books at random to argue about. And the book that stuck was G.E. Moore's *Principia Ethica*.

  Now, for the two-thirds of the room currently checking their phones—don't worry. I am not going to give a lecture. But for the nerds in the front row: you know the one. Specifically, the chapter on "The Ideal."

  Moore argued that the very best things in life—the things that actually make existence worth it—aren't about being successful, or clever, or even morally perfect in a vacuum. He said the highest goods are personal affection and the appreciation of beauty.

  And somehow, in the middle of arguing about this, [Bride] and [Groom] met. They spent three weeks debating the definition of "ideal" in the comments section. Most couples bond over a shared love of hiking or tacos. These two bonded over meta-ethics. And honestly, I think that's romantic. Because they were unknowingly testing the theory before they even started dating.

  There's a concept in that book called "organic unity." It's a fancy way of saying that the value of a relationship isn't just Person A plus Person B. It's not an addition problem. It's a multiplication problem. The value lies in the *whole* that is created when they are together.

  If I just list [Bride]'s virtues and [Groom]'s virtues, I'm making the mistake of thinking the good is in the parts. But anyone who knows them knows the magic isn't in the parts. It's in the space between them. It's in the way they speak a shorthand language nobody else understands. It's in the way they make each other braver, and kinder, and more alive than they are on their own.

  Now, I should mention that [Bride] and [Groom] aren't the only people obsessed with this book. A hundred years ago, the Bloomsbury Group—Virginia Woolf, John Maynard Keynes, all those famous intellectuals—basically built their social lives on this exact chapter of Moore. They adopted what they called a "religion of love and beauty."

  Although, Keynes later wrote a bit ruefully that they took Moore's instructions on love and beauty, but quietly ignored the bits about moral conduct and telling the truth. They liked the "affection" part, but skipped the "hard work" part.

  And I think that's where [Bride] and [Groom] actually surpass the Bloomsbury Group. Because they understand that Moore was right about what matters, but he didn't tell you how hard it is to keep it.

  Organic unity doesn't just happen. It requires maintenance. It requires choosing to appreciate the beauty in front of you, even when you're tired. It requires choosing affection, even when you're arguing about whose turn it is to do the dishes—which, knowing this couple, is probably still framed as a philosophical debate.

  So, I'm not going to tell you how great they are individually. You can see that. Instead, I want to toast what they are *together*.

  To the idea that the best things in life aren't things you achieve alone. To the idea that love isn't just finding someone who completes you, but finding someone who creates something new with you that is greater than the sum of its parts. And to the hope that your "organic unity" remains messy, beautiful, and infinitely more valuable than being right.

  To [Bride] and [Groom].
