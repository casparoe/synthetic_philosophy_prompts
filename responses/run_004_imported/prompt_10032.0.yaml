      *   *Section 2 (Belief/Attitude):* Suggest refining this. "Attitude" = modal status (impossibility). "Belief" = empirical probability. The NDE changed the modal status (it's *possible*), not the weight of evidence (it's still *unlikely*). This fits the "slightly weakened" phrasing better.
