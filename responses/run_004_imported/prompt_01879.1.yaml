          *   Define the stakes: Deep morality vs. Practical norms.
          *   Thesis Statement: While the epistemic argument highlights crucial limitations on blame, it fails to rehabilitate MEC as a practical norm because it misunderstands the basis of liability (which is about the threat, not the mindset) and because institutionalizing ignorance creates perverse incentives. McMahan's distinction between excuse and justification is fatal to the traditionalist practical claim.
