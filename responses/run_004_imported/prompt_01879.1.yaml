      *   *Intro:* Need to be precise. Walzer = MEC. McMahan = Revisionism. The prompt asks about the *epistemic argument* specifically.
      *   *McMahan's View:* Liability is objective. If you pose an unjust threat, you lose your right not to be killed.
      *   *Epistemic Argument:* Soldiers can't judge *ad bellum*. So treat them as equals *in bello*.
      *   *McMahan's Reply:* This is the crux. If I am innocently trying to kill you (e.g., I think you are a monster, but you aren't), do I lose my right to life? McMahan says yes, I am liable. You can kill me to save yourself. My ignorance excuses me from *blame*, but it doesn't make me *non-liable*.
      *   *Critique of Epistemic Argument:* The traditionalists want to say "Because they don't know, we shouldn't kill them." McMahan says "Because they threaten, we can kill them, even if we pity them."
      *   *Practical Norms:* Should the *Law of War* reflect MEC? Traditionalists say yes (epistemic limits). Revisionists say no (it encourages unjust wars).
      *   *Weighing:* If we adopt MEC practically, we tell soldiers "Don't think, just fight." This is dangerous. If we adopt Revisionism practically, we ask soldiers to think. Is that too much? McMahan argues it's not too much for *leaders*, and soldiers have some duty.
      *   *Refining the Verdict:* I need to side with McMahan here, based on the prompt's instruction to engage with his reply. The epistemic argument fails because it tries to derive a right to immunity from a lack of culpability. But immunity in war is about the *threat*, not the *guilt*.

  5.  **Refining the Argument (Self-Correction during drafting):**
