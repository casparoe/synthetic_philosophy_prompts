      *   *Strongest Traditionalist Point:* The "functional" argument. Soldiers are coerced instruments. If we tell them they are liable, they might not fight, or we might encourage war crimes out of desperation.
      *   *Strongest Revisionist Point:* The "innocent aggressor" analogy. If a sleepwalker attacks you, you can stop them lethally. They aren't blameworthy, but they are liable. War is similar.
