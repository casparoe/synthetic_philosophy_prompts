          *   Explain the Traditionalist Epistemic Argument (invincible ignorance, fairness, functional equality).
      *   **Section 2: McMahan's Counter-Argument (Excuse vs. Justification):**
          *   Detail the distinction. An excusable aggressor is still an aggressor.
          *   The victim's right to self-defense persists against excusable threats (e.g., the innocent aggressor case).
          *   Therefore, UC are still liable to be killed, even if not blameworthy.
      *   **Section 3: Assessing the Practical Norm (The Core Analysis):**
          *   Can we use MEC practically even if it's theoretically false? (The "Useful Fiction" argument).
          *   *Argument for MEC:* Reduces hesitation, simplifies rules, prevents vigilante justice.
          *   *Argument against MEC (McMahan's side):* Legitimizes aggression, lowers the bar for war, demoralizes just fighters.
          *   *Weighing the Epistemic Claim:* Is ignorance really invincible? In modern contexts, often no. Institutionalizing ignorance is dangerous.
      *   **Section 4: The Verdict:**
          *   Why the epistemic argument fails to save MEC.
          *   It conflates *punishment* with *defensive harm*.
          *   It ignores the asymmetry of epistemic access (aggressors often know more or should know more).
          *   Final defense of a modified revisionist practical norm.
      *   **Conclusion:**
          *   Restate thesis in light of arguments.
          *   Final thought on the future of Just War Theory.

