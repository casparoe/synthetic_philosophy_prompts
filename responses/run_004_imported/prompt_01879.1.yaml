      *   **Task:** Assess whether the epistemic argument succeeds in rehabilitating MEC as a *practical norm*, even granting McMahan is right about *deep morality*.
      *   **Specific Engagement:** Must engage with McMahan's reply (Excusability vs. Justifiability).
      *   **Requirement:** Weigh strongest considerations on each side.
      *   **Conclusion:** Definite, defended verdict (no fence-sitting).

  2.  **Initial Brainstorming & Mapping:**
      *   *McMahan's Revisionism:* Based on self-defense principles. You can't kill someone who isn't threatening you unjustly. Just combatants (JC) act in self-defense/defense of others. Unjust combatants (UC) are aggressors. Therefore, UC are liable; JC are not.
      *   *Traditionalist MEC:* Soldiers are instruments of the state. They have no control over *jus ad bellum*. Therefore, they are moral equals on the battlefield (*jus in bello* is independent).
      *   *The Epistemic Objection:* Even if McMahan is theoretically right, soldiers face an "epistemic fog." They are propagandized, lack access to intelligence, and trust their leaders. If they can't know they are unjust, they aren't culpable. If they aren't culpable, they shouldn't be targeted as if they were.
      *   *McMahan's Counter:* Confuses *liability* with *culpability*. One can be liable (pose an unjust threat) without being blameworthy (excusable ignorance). However, does excusability grant them a right not to be killed? McMahan says: Excusable unjust combatants are still liable to defensive harm, though perhaps we should treat them with more regret. But wait, does the epistemic argument aim to show they *aren't liable* or that we *shouldn't treat them as liable*? The prompt asks about MEC as a *norm for practical judgment*.
      *   *Key Distinction:* Deep Morality (who is actually liable) vs. Practical Norms (rules of engagement/law of war).
      *   *McMahan's specific reply:* The epistemic argument conflates excusability (I didn't know) with justifiability (I had a right to do it). Ignorance might excuse blame, but it doesn't make the threat justified. The victim still has a right to defend themselves against an excusable aggressor.
      *   *My Task:* Evaluate if the epistemic argument saves MEC *practically*, even if McMahan wins on *theory*.

  3.  **Structuring the Essay:**
