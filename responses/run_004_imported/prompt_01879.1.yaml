answer: |-
  **Title:** The Fog of War and the Clarity of Liability: Why the Epistemic Argument Fails to Save Combatant Equality

  The traditional architecture of Just War Theory, crystallized by Michael Walzer, rests upon the doctrine of the Moral Equality of Combatants (MEC). This doctrine holds that soldiers on opposing sides possess equal rights and liabilities on the battlefield, regardless of the justice of their nation's cause. Jeff McMahan's revisionist account has fundamentally destabilized this orthodoxy. By grounding liability in moral responsibility for unjustified lethal threats, McMahan argues that unjust combatants are not the moral equals of just combatants; the former are liable to be killed, while the latter generally are not. In response, traditionalists have mounted an epistemic defense: since ordinary soldiers operate under conditions of "invincible ignorance" regarding the *jus ad bellum*, it is unfair and impractical to assign them differential liability. This essay assesses whether this epistemic argument succeeds in rehabilitating MEC as a norm for practical judgment. While the epistemic argument correctly identifies the psychological burdens placed on soldiers, it ultimately fails to justify MEC as a practical norm. By conflating excusability with justification and underestimating the moral costs of institutionalizing ignorance, the traditionalist position collapses. Even granting McMahan's account of deep morality, the epistemic argument does not warrant a return to combatant equality in practice.

  To understand the stakes, one must distinguish between deep morality and practical norms. In deep morality, McMahan argues, liability to defensive harm is objective. If a combatant poses an unjust threat to life, they forfeit their own right not to be killed, much like a criminal aggressor forfeits rights against a victim acting in self-defense. The traditionalist epistemic argument concedes, for the sake of argument, that this might be true in the abstract. However, it contends that in the "fog of war," soldiers cannot reliably distinguish just causes from unjust ones. Propaganda, secrecy, and patriotic conditioning render the *ad bellum* status of a war opaque to the rank and file. Therefore, traditionalists argue, we should retain MEC as a practical convention. To treat unjust combatants as liable would be to punish them for ignorance they could not overcome, leading to unfair asymmetries in the rules of engagement and potentially discouraging soldiers from surrendering or adhering to *jus in bello* constraints.

  McMahan's rebuttal to this line of reasoning is sharp and distinctions-driven. He argues that the epistemic argument conflates the *excusability* of unjust combatants with the *justifiability* of their actions. A soldier may be excused for fighting in an unjust war due to non-culpable ignorance; they may not be morally blameworthy in a way that warrants punishment after the fact. However, excusability does not negate liability. McMahan utilizes the analogy of the "innocent aggressor": if a sleepwalker or a person acting under a non-culpable delusion attempts to kill you, they are not morally blameworthy, yet they are still liable to defensive harm. You are permitted to kill them to save your life, even if you regret the necessity. Their lack of knowledge excuses them from guilt, but it does not restore their right to kill you. Consequently, the epistemic limitation of the unjust combatant does not grant the just combatant a duty to refrain from killing them. The just combatant's right to self-defense remains intact regardless of the unjust combatant's state of mind.

  If we grant McMahan's deep morality, the question becomes whether the epistemic argument can still salvage MEC as a *practical* norm, distinct from deep morality. Traditionalists might argue that even if unjust combatants are theoretically liable, the international legal regime and military codes should treat them as equals to maintain order. This is a consequentialist gamble: the cost of mistakenly killing just combatants (if we abandon MEC and they are misidentified as unjust) outweighs the cost of shielding unjust combatants.

  However, this practical defense fails for two primary reasons, both of which reinforce McMahan's critique. First, institutionalizing the epistemic argument creates perverse incentives that exacerbate the very injustice MEC claims to mitigate. If the norm is that soldiers are never liable provided they claim ignorance of the cause, political leaders are insulated from the moral costs of aggression. The "uniform" becomes a moral shield, allowing states to wage unjust wars with the assurance that their agents will not be held liable for lethal violence. This lowers the threshold for war. A practical norm that effectively immunizes the instruments of aggression undermines the deterrent function of individual liability. By contrast, a revisionist practical norm—one that acknowledges that fighting for an unjust cause carries moral risk—places pressure on soldiers to scrutinize orders and on leaders to ensure causes are manifestly just.

  Second, the epistemic argument relies on an empirically dubious conception of "invincible ignorance." While it is true that soldiers in totalitarian regimes or during the initial stages of conflict may lack information, the traditionalist view often overstates the passivity of the combatant. In the modern information age, and particularly for professional militaries in democratic societies, access to information regarding the justification of war is rarely impossible. To adopt MEC as a practical norm based on epistemic limitations is to codify a willful blindness. It tells soldiers, "Do not ask if the war is just; your ignorance is your protection." This is morally corrosive. It suggests that the less a soldier knows about the strategic or political aims of their mission, the safer they are from moral scrutiny. A practical ethic of war should encourage epistemic diligence, not reward ignorance.

  Furthermore, McMahan's distinction between excuse and justification holds significant weight in the practical realm. The traditionalist wants the epistemic argument to grant unjust combatants a *right* not to be attacked (immunity). But as McMahan notes, the epistemic situation only grants them an *excuse* from blame. In practice, this distinction matters for the victim. If a just combatant is attacked by an unjust combatant who is merely excused by ignorance, the just combatant is still being victimized by an unjust threat. To demand that the just combatant treat the aggressor as a moral equal is to demand they prioritize the epistemic limitations of their attacker over their own right to life. Practically, this is unsustainable. It requires the victim of aggression to accept a handicap based on the attacker's lack of knowledge.

  There is, however, a strong consideration on the traditionalist side that must be weighed. Abandoning MEC practically could lead to vigilante justice or the breakdown of *jus in bello* constraints. If unjust combatants believe they are liable to be killed regardless of their conduct, they may feel they have nothing to lose by committing war crimes. This is the "reciprocity" argument. Yet, this assumes that unjust combatants are rational actors calculating their liability in the heat of battle. In reality, most soldiers fight for survival and camaraderie, not abstract liability theories. Moreover, McMahan's revisionism does not require that unjust combatants be summarily executed; it merely asserts they are liable to necessary defensive harm. They retain their human rights regarding torture, surrender, and POW status. The revisionist account can accommodate robust *jus in bello* protections without conceding the false symmetry of MEC. We can treat unjust combatants humanely without pretending they had a right to be there.

  Ultimately, the epistemic argument fails to rehabilitate combatant equality because it attempts to solve a problem of knowledge by erasing a distinction of fact. The fact is that one side is threatening unjustly and the other is not. The ignorance of the threatener does not make the threat just. To build a practical norm around this ignorance is to build a system that privileges the aggressor's confusion over the victim's safety. While we may excuse individual soldiers from post-war prosecution due to epistemic limitations (as McMahan allows), this does not translate into a right to immunity during the conflict.

  Therefore, the verdict must be against the traditionalist epistemic argument. It does not succeed in restoring MEC as a norm for practical judgment. While the epistemic difficulties soldiers face are real, they generate at most an excuse from culpability, not a justification for the threat posed. A practical ethic of war should reflect the asymmetry of liability to discourage unjust wars and respect the rights of those defending against them. To do otherwise is to accept a "useful fiction" that, in practice, serves primarily to legitimize violence that ought not to occur. We should not govern the practice of war by a norm that tells victims they must treat their excusable aggressors as moral equals. The fog of war may obscure the truth, but it does not change the moral landscape; our practical norms should aim to clear the fog, not enshrine it.
