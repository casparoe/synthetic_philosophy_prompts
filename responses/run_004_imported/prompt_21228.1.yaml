prompt: |-
  I sit on the three-person adjudication panel of a small private foundation that funds independent researchers through multi-year fellowships — the sort of small, EA-adjacent grantmaking body that has proliferated around the rationalist world in recent years — and something that happened at our most recent meeting has been nagging at me ever since.

  We were deciding whether to claw back the remaining funds from a grantee whose project had gone badly off track. Under our internal rules, we may only revoke funding if two separate conditions both hold: first, that her actual work departed substantially from the research plan she originally submitted, and second, that the departure was avoidable rather than attributable to circumstances genuinely outside her control (a key collaborator withdrawing, an irreplaceable dataset becoming unavailable, and so on). When we worked through the case question by question, a majority of the panel — two of the three of us — concluded that the work had indeed departed substantially from the plan, and a majority — a different pair, as it turned out — concluded separately that the departure had been avoidable. Since both conditions were satisfied by majority vote, it seemed we were bound by our own rule to revoke the funding. But then our chair, almost as an afterthought, asked each of us simply to declare yes or no on revocation itself, and it turned out that only one of us actually favored revoking it; the other two, despite each having sided with the majority on one of the two questions, privately believed the other question came out the opposite way, and so both voted no. The straight up-or-down tally came out two to one against revocation — flatly contradicting what the issue-by-issue tally had implied.

  We ended up going with the up-or-down vote, but it has stayed with me that we could apparently have reached the opposite, equally "democratic" outcome just by asking the questions in a different order. It has the flavor of the impossibility-result posts I've come across over the years on LessWrong and Overcoming Bias, but I can't place exactly which one, if any. I described the episode to a friend who is deep into voting theory, and his first reaction was that it sounded like some relative of Arrow's impossibility theorem, though that never quite felt right to me, since none of us were ranking alternatives — we were just voting yes or no on a couple of separate questions and then on a bottom line that was supposed to follow from them. Is there an actual, recognized phenomenon at work here? And if so, does the literature on it suggest any principled way either to decide which of the two tallies should have governed, or to design the vote in advance so that this kind of split can't arise — or is it simply confused to think one of the two outcomes was more "correct" than the other?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **Context:** A three-person adjudication panel for a private foundation (EA/rationalist adjacent).
      *   **Decision Rule:** Revoke funding *if and only if* (Condition A is met) AND (Condition B is met).
          *   Condition A: Work departed substantially from plan.
          *   Condition B: Departure was avoidable.
      *   **Voting Pattern:**
          *   Vote on A: 2 Yes, 1 No (Majority says Yes).
          *   Vote on B: 2 Yes, 1 No (Majority says Yes). *Crucially, the "Yes" voters on B are not necessarily the same people as the "Yes" voters on A.*
          *   Vote on Conclusion (Revoke?): 1 Yes, 2 No.
      *   **The Paradox:** The premise-based voting (vote on A and B, then apply logic) yields "Revoke." The conclusion-based voting (vote directly on Revoke) yields "Do Not Revoke."
      *   **User's Question:** Is there a recognized phenomenon here? Does literature suggest a principled way to decide which tally governs? How to design votes to avoid this?

  2.  **Identify the Core Concept:**
      *   This is a classic problem in social choice theory and legal theory.
      *   It is *not* Arrow's Impossibility Theorem (which deals with ranking preferences over 3+ alternatives).
      *   It *is* the **Discursive Dilemma** (also known as the **Doctrinal Paradox**).
      *   Key reference: Philip Pettit, Christian List, Lewis Kornhauser.

  3.  **Explain the Discursive Dilemma/Doctrinal Paradox:**
      *   Define it: A situation where proposition-wise majority voting yields a different outcome than conclusion-wise majority voting on logically connected propositions.
      *   Map the user's case to the standard example:
          *   Proposition $p$: Departure occurred.
          *   Proposition $q$: Departure was avoidable.
          *   Conclusion $r$: Revoke funding ($r \iff p \land q$).
          *   Judge 1: Yes on $p$, No on $q$ $\rightarrow$ No on $r$.
          *   Judge 2: No on $p$, Yes on $q$ $\rightarrow$ No on $r$.
          *   Judge 3: Yes on $p$, Yes on $q$ $\rightarrow$ Yes on $r$.
          *   Majority on $p$: Yes (Judges 1 & 3).
          *   Majority on $q$: Yes (Judges 2 & 3).
          *   Majority on $r$: No (Judges 1 & 2).
      *   This matches the user's description perfectly.

  4.  **Discuss the Normative Implications (Which is "Correct"?):**
      *   There is no mathematically "correct" answer. It's a normative choice about the purpose of the committee.
      *   **Premise-Based Procedure (PBP):** Vote on conditions first.
          *   *Pros:* Ensures consistency with the rules/doctrine. Respects the logic of the mandate. Prevents "compromising" on principles.
          *   *Cons:* Can lead to outcomes no individual actually supports (as seen here: 2 out of 3 voted against revocation, but the rule forced it). Can feel undemocratic regarding the final outcome.
      *   **Conclusion-Based Procedure (CBP):** Vote on the final decision first.
          *   *Pros:* Reflects the actual will of the members regarding the outcome. Each member takes responsibility for the final judgment.
          *   *Cons:* Can lead to inconsistent precedents. The collective reasoning might be incoherent (e.g., saying "Yes" to the rule but "No" to the application without a shared reason).
      *   **Literature Consensus:** Most legal and political theorists (Pettit, List) tend to favor the Premise-Based Procedure for bodies tasked with applying specific rules/doctrines (like courts or adjudication panels) because integrity of the reasoning process is paramount. However, for political bodies, Conclusion-Based might be preferred.

  5.  **Address the "Design" Question (How to prevent this):**
      *   You can't prevent the *logical possibility* of the paradox without changing the voting structure.
      *   **Option 1: Unanimity Rule.** If revocation requires unanimity on the conclusion, this specific paradox vanishes (though others might arise).
      *   **Option 2: Special Majority.** Require 2/3 on the conclusion.
      *   **Option 3: Deliberation.** Force the panel to discuss *why* they voted the way they did before voting. Often, Judge 2 might convince Judge 1 that $q$ is false, aligning the votes. The paradox often arises from isolated voting.
      *   **Option 4: Explicitly Choose the Procedure.** The foundation's bylaws should specify whether they are a "premise-based" body or a "conclusion-based" body. Ambiguity is the enemy here.

  6.  **Refine the Tone:**
      *   The user is from the rationalist/EA community (mentions LessWrong, Overcoming Bias). Use precise terminology but keep it accessible. Acknowledge the "impossibility result" intuition.
      *   Validate their feeling that Arrow's theorem isn't quite right (it's about rankings, this is about binary judgments on connected propositions).
      *   Maintain a professional, analytical tone suitable for a grantmaking adjudicator.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the experience. Name the paradox (Doctrinal Paradox/Discursive Dilemma).
      *   *The Theory:* Explain List & Pettit. Show the matrix of votes.
      *   *Why Arrow isn't it:* Briefly distinguish (rankings vs. binary judgments on logic).
      *   *Normative Choice:* Discuss PBP vs. CBP. This is the core "what should we do" part.
      *   *Practical Advice:* How to write bylaws, the role of deliberation.
      *   *Conclusion:* Reassure that this is a known structural feature, not a personal failure.

  8.  **Self-Correction/Check:**
      *   Did I get the logic right? Yes ($p \land q \rightarrow r$).
      *   Is the distinction between Arrow and Discursive Dilemma clear? Yes.
      *   Did I answer the "which is correct" question? Yes, by explaining it's a normative design choice, not a mathematical truth.
      *   Is the advice practical? Yes (specify procedure in bylaws, prioritize deliberation).

  9.  **Final Polish:** Ensure references to Kornhauser, Sager, List, and Pettit are accurate. (Kornhauser & Sager coined "Doctrinal Paradox," List & Pettit generalized to "Discursive Dilemma"). Make sure to mention that the "rationalist community" context makes them particularly well-suited to appreciate the formal logic aspect.

  *(Self-Correction during drafting)*: I should make sure to emphasize that in a *legal/adjudicative* context (which this foundation mimics), the Premise-Based approach is often defended more strongly because the *reasoning* matters as much as the outcome for precedent. However, since this is a private foundation, they have more flexibility. I need to highlight that *ambiguity* in the rules is what caused the stress, not the paradox itself.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  You have encountered a classic problem in social choice theory and legal philosophy. It is not Arrow's Impossibility Theorem, though it shares the same family resemblance of "aggregation paradoxes." The specific phenomenon you are describing is known as the **Doctrinal Paradox**, or more generally, the **Discursive Dilemma**.

  It was first identified in legal theory by Lewis Kornhauser and Lawrence Sager (1986) regarding judicial decision-making, and later formalized in political philosophy by Philip Pettit and Christian List (2002). Given your background in the rationalist/EA ecosystem, you will likely appreciate that this is essentially a problem of **judgment aggregation** on logically connected propositions.

  ### The Structure of the Paradox

  Your case maps perfectly onto the standard model. You have three judges ($J_1, J_2, J_3$) and three propositions:
  1.  $p$: The work departed substantially from the plan.
  2.  $q$: The departure was avoidable.
  3.  $r$: Revoke funding.

  The logical constraint is that $r$ is true if and only if ($p$ AND $q$) are true.

  In your meeting, the vote distribution likely looked like this:

  | Judge | $p$ (Departure) | $q$ (Avoidable) | $r$ (Revoke: $p \land q$) |
  | :--- | :---: | :---: | :---: |
  | **You** | Yes | No | **No** |
  | **Colleague A** | No | Yes | **No** |
  | **Colleague B** | Yes | Yes | **Yes** |
  | **Majority** | **Yes** | **Yes** | **No** |

  *   **Premise-Based Procedure (PBP):** If you aggregate votes on $p$ and $q$ first, the majority says Yes to both. By the logical rule, the collective outcome must be **Revoke**.
  *   **Conclusion-Based Procedure (CBP):** If you aggregate votes on $r$ directly, the majority says No. The collective outcome is **Do Not Revoke**.

  The paradox is that both procedures are "democratic" (majority rule), but they yield contradictory outcomes. This happens because the majority coalition on $p$ is not the same as the majority coalition on $q$.

  ### Is One Outcome More "Correct"?

  There is no mathematical theorem that dictates which procedure is correct. This is a **normative design choice**, not a solvable equation. However, the literature offers strong arguments for each side, depending on what you value the panel to be.

  **1. The Case for Premise-Based (The "Rule of Law" Argument)**
  Philosophers like Pettit and List generally argue that for adjudicative bodies, the Premise-Based Procedure is superior.
  *   **Integrity:** It ensures the collective decision is supported by reasons. If you revoke funding, it is because the collective believes the conditions were met, not because a coalition formed for disparate reasons.
  *   **Consistency:** It prevents the body from setting inconsistent precedents. If you use CBP, you might end up with a corpus of decisions where funding was revoked in some cases where $p$ was false, and kept in others where $p$ and $q$ were both true, simply due to voting coalitions.
  *   **Accountability:** It forces members to take a stand on the specific criteria, rather than hiding behind a holistic "gut feeling" on the outcome.

  **2. The Case for Conclusion-Based (The "Democratic Will" Argument)**
  *   **Responsiveness:** It respects the actual will of the members regarding the outcome. In your case, two out of three members genuinely believed the grantee should keep the money. Forcing revocation when 2/3 of the panel opposes it feels undemocratic.
  *   **Cognitive Load:** It acknowledges that members might not be able to perfectly decompose their judgment into binary logical atoms. Sometimes the "gestalt" of the case matters more than the checklist.

  ### How to Design Against It

  Since the paradox is structurally inevitable whenever you have logically connected propositions and majority voting, you cannot eliminate the *possibility* of it arising. However, you can eliminate the *ambiguity* that causes the stress.

  **1. Codify the Aggregation Rule**
  Your internal rules currently say: *"We may only revoke funding if [Condition A] and [Condition B]."* This specifies the logic ($r \iff p \land q$) but fails to specify the **aggregation procedure**.
  You need to amend the bylaws to specify how votes are counted. For example:
  *   *"Funding is revoked if and only if a majority votes Yes on Condition A **and** a majority votes Yes on Condition B."* (Mandates PBP)
  *   *"Funding is revoked if and only if a majority votes Yes on Revocation, provided that the reasoning aligns with Conditions A and B."* (Mandates CBP)

  For a grantmaking body mimicking a legal adjudication panel, the **Premise-Based Procedure** is usually the robust choice. It protects the foundation from arbitrary decisions and ensures that the *criteria* drive the outcome, not the interpersonal dynamics of the panel.

  **2. The Role of Deliberation**
  The Discursive Dilemma assumes votes are cast in isolation. In practice, deliberation often resolves the paradox.
  If you had discussed *why* Colleague A voted "No" on $p$ and *why* you voted "No" on $q$ before voting, you might have realized that the evidence for $p$ was weak, persuading Colleague A to switch to "No" on $p$. This would align the majorities.
  The paradox is most dangerous when voting is treated as a mechanical tally rather than a truth-seeking discussion. A rule requiring a period of reasoned discussion before any tally is taken can often collapse the divergent majorities into a consistent one.

  **3. Unanimity or Supermajority**
  The paradox relies on simple majority rule (2 out of 3). If your rules required unanimity for revocation, the paradox disappears (you cannot have a majority for $p$ and a majority for $q$ without at least one person voting Yes on both). However, this creates a different bias (status quo bias).

  ### Summary

  You are not confused; you have stumbled upon a well-documented impossibility result in judgment aggregation.
  *   **The Phenomenon:** The Discursive Dilemma (or Doctrinal Paradox).
  *   **The Cause:** Aggregating binary judgments on logically connected propositions via simple majority.
  *   **The Fix:** You must explicitly choose in your bylaws whether you are a **premise-based** body (prioritizing logical consistency of the rules) or a **conclusion-based** body (prioritizing the direct will of the panelists).

  Given that you are an adjudication panel enforcing specific criteria, the literature suggests you should formally adopt the **Premise-Based Procedure**. It is less "democratic" in the immediate sense (overriding the 2-1 outcome vote), but it is more "constitutional" (upholding the integrity of the rules you are sworn to apply). The discomfort you feel is the friction between democratic intuition and logical consistency; resolving it requires deciding which value your foundation prioritizes.
