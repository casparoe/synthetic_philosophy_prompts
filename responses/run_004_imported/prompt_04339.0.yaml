answer: |-
  **Setting:** *The laboratory of the Teletransportation Union. A large chamber hums with a low, vibrating frequency. On one side stands the scanner pod (Earth); on a monitor, a live feed shows the receiver pod (Mars), empty and waiting. ELENA (40s, calm, wearing a practical jumpsuit) is checking a clipboard. MARCUS (40s, same attire) stands before the scanner door, hand hovering over the panel.*

  **Marcus:** It's the silence inside the pod that gets me. You step in, the door seals, and then… nothing. No sensation of travel. Just a cut.

  **Elena:** That's the design, Marcus. It's meant to be instantaneous. From your perspective, it's like a blink. You close your eyes here, you open them there.

  **Marcus:** A blink implies the same eyes close and open. In this case, *these* eyes close here, and a perfect copy opens there. I'm not worried about the blink. I'm worried about the darkness in between that never ends for me.

  **Elena:** You're reifying the "I." You're treating it like a ghost in the machine that has to make the trip. Parfit would tell you there is no ghost. There's just brain, body, and the continuity of memory and character. Relation R. If R holds, you survive.

  **Marcus:** Parfit is comfortable with that because he thinks identity isn't what matters. But stand in my shoes. Literally. If I step in, this body is scanned and disassembled. Atom by atom. I am destroyed. The thing on Mars has my memories, sure. It thinks it's Marcus. It loves my wife. But *I* won't be there to enjoy it.

  **Elena:** Why not? If the person on Mars remembers stepping into the pod, remembers this conversation, and continues your projects… who is missing out? You're imagining a "further fact" of identity over and above physical and psychological continuity. But there isn't one. Think about sleep. You lose consciousness every night. There are gaps in your psychological connectedness.

  **Marcus:** Sleep is a pause in a continuing biological process. My brain stays right here, metabolizing, maintaining the substrate of *me*. This isn't a pause. It's a termination. Look, let's try Williams's challenge. Suppose I tell you that tomorrow, you will be tortured. But, before the torture, we will wipe your memory and implant a completely new set of memories—say, you'll believe you're Napoleon. Do you fear the pain?

  **Elena:** …Yes. Obviously.

  **Marcus:** Why? If you're just a bundle of psychological traits, and those traits are being replaced by Napoleon's, *you* shouldn't exist tomorrow to feel the pain. The body will feel it, but "Elena" will be gone. Yet you still fear it. That fear tracks the body, Elena. It tracks *this* organism. It tells you that *you* are going to suffer, regardless of what software is running on the hardware.

  **Elena:** I concede the fear is visceral. I won't deny the phenomenology. When I imagine that torture, I feel a contraction in my gut. But is that fear *rational*? Or is it a evolutionary heuristic? We are wired to protect this organism. But if I know that "Elena's" psychology is gone, what exactly am I protecting?

  **Marcus:** You're protecting the subject of experience. The locus.

  **Elena:** Okay, let's press that. Consider the Branch Line Case. Suppose the scanner malfunctions. It creates the copy on Mars, but it fails to destroy me here. I step out of the pod. I'm alive. But the technicians tell me, "Sorry, the scan caused fatal radiation poisoning. You have days to live." Meanwhile, the Marcus on Mars is healthy and walking around. Now, standing here, dying… do you feel happy? Because your "survival" is secured on Mars?

  **Marcus:** I would feel horrified. I would feel like I'm dying, and some lucky imposter is going to live my life.

  **Elena:** But why? He has your memories. He has your character. If identity is what matters, you should be comforted. It's *you* over there.

  **Marcus:** No. It's a replica. I'm the one who faces the end. The fact that I can look at him and say "That's not me, that's a copy" proves that psychological continuity isn't enough. There's a difference between *being* someone and someone *being like* you.

  **Elena:** But where is the line? That's the Combined Spectrum argument. Imagine we don't destroy you instantly. Imagine we replace your brain cells one by one with synthetic duplicates that function identically. At ten percent replacement, you're still Marcus. At fifty? At ninety? If we do it slowly, you survive. If we do it all at once, you die? That seems arbitrary. Identity can't be a deep, all-or-nothing fact if it depends on the speed of replacement.

  **Marcus:** *(Pauses, looking at his hands)* That… that is harder. I'll grant you that. If you swap my cells one by one, I don't feel like I die at a specific percentage. The "all-or-nothing" view of identity is hard to map onto biology. We are constantly shedding skin, replacing cells. I am not the same matter I was ten years ago.

  **Elena:** Exactly. So why is the teletransporter different?

  **Marcus:** Because of the break. The discontinuity. In cell replacement, there's a continuous causal chain. In the transporter, the chain is severed and restarted elsewhere. It's the difference than a river flowing and a river being drained into a bucket and poured into a new bed. It might look the same, but the flow stopped.

  **Elena:** *(Sighs, leaning against the console)* I'll concede this: The "flow" matters. If Relation R is caused in a deviant way—like a scan and rebuild rather than normal biological persistence—it feels different. Parfit admits that. He says we might care about the *cause* of the continuity. So, I grant you that the transporter might not preserve "identity" in the strict, traditional sense.

  **Marcus:** Then why step in?

  **Elena:** Because identity isn't what matters. Survival is. If the person on Mars has my memories, loves my family, and finishes my work… what more could I want? My fear of the "darkness" is a selfish attachment to this specific hunk of matter. It's a refusal to accept that I am just a process, not a thing.

  **Marcus:** But that process *feels* like a thing. That's the point Williams makes. The first-person perspective isn't an illusion. When I look at the pod, I don't see a "process." I see a coffin. And you're asking me to trust that a resurrection happens on the other side.

  **Elena:** And you're asking me to believe that this specific collection of atoms is the only vessel for my soul. But look, Marcus… if you don't step in, you stay here. You age. You die. And no one goes to Mars. If you do step in, the world continues. *You* continue, in every way that is publicly observable.

  **Marcus:** Publicly. Yes. That's the tragedy. To the outside world, I survive. To me… *(He touches the door panel)* …I'm not sure.

  **Elena:** Maybe that's the best we can do. Maybe we have to accept that the question "Will I survive?" has no Yes/No answer. It's a matter of degree. On Mars, Marcus survives to degree 0.9. Here, Marcus fades to 0.

  **Marcus:** *(A sad smile)* That's cold comfort, Elena. "Mostly surviving" isn't surviving. But… I admit, if you told me the cell-replacement story was true, that I was already being slowly teleported by nature… I'd feel less afraid. It's the *snap* that terrifies me. The clean break.

  **Elena:** And I admit… if I were the one facing the Branch Line, knowing I was the dying original… I don't think I'd feel the rational calm Parfit describes. I think I'd feel the terror you're feeling now. The theory holds up in the seminar room. In the lab… the body speaks louder.

  **Marcus:** So we're at an impasse. You think I'm clinging to a fiction. I think you're rationalizing a funeral.

  **Elena:** Essentially. But we both agree on one thing. The person on Mars shouldn't be punished for my hesitation.

  **Marcus:** *(Looks at the monitor. The Mars pod is still empty.)* No. He shouldn't. He thinks he's me. He's waiting to pick up where I left off.

  **Elena:** Then let him.

  **Marcus:** *(Takes a deep breath. His hand trembles slightly, then steadies.)* If I wake up on Mars… and I remember this fear… I hope I forgive you for talking me into it.

  **Elena:** And if you don't wake up… I hope I forgive myself for letting you go.

  **Marcus:** *(Steps into the pod.)* Relation R, Elena. Make sure it holds.

  **Elena:** It will. Goodbye, Marcus.

  **Marcus:** *(From inside the pod)* See you on Mars.

  *(The door seals. The hum rises to a whine. Elena turns away, unable to watch the disassembly. She stares at the floor, her own hands gripping the edge of the console, wondering, for a fleeting second, if she would be brave enough to step in next.)*
