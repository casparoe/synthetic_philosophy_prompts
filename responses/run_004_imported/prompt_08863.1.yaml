      *   1. The Metaphysics of Correlation (PEH vs. ECL).
      *   2. The Status of "Other" Agents (Possible vs. Actual).
      *   3. Agency and the Complete Concept.
      *   4. Theological Optimization vs. Rational Cooperation.
      *   Conclusion: Leibniz as a "Metaphysical ECL" proponent.

