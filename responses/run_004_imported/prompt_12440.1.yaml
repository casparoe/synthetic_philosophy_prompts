answer: |-
  Here are ten questions drafted for the Q&A session. They are ordered to move from foundational theoretical objections (which engage the PhD students) to institutional and practical concerns (which engage the undergraduates and public), ending with the requested closing on falsifiability.

  For the five required theoretical topics, I have included the main question followed by a scripted **Follow-Up** designed to counter the "implementation detail" deflection.

  **1. The Regress Problem (Constitutional Foundations)**
  "You propose that the qualifying examinations be designed by a rotating, politically insulated academic board to prevent rigging. But the decision of *which* competencies to test—and how to weight economics against law or history—is itself a deeply political choice with distributive consequences. If we cannot trust the elected assembly to define the public good, what non-circular justification do we have for trusting this academic board to define 'competence' without quietly presupposing the very democratic authority your proposal seeks to bypass?"

  *   **Follow-Up (If she replies that the board's insulation is an implementation detail):** "If the neutrality of the board is merely an implementation detail, then the legitimacy of the whole system rests on a contingency. But if the *only* way to make the system fair is to assume a level of impartiality that no human institution has ever achieved, isn't the objection foundational rather than technical? Who guards the guardians of the exam without appealing to the people's consent?"

  **2. The Estlund Objection (Invidious Ranking)**
  "David Estlund argues that even if epistocracy produced better outcomes, it is objectionably invidious to politically rank citizens by competence, as it undermines the equal civic status required for a society of free and equals. By institutionalizing a veto held only by those who pass a test, aren't you codifying a second-class citizenship for the majority, regardless of how 'careful' the test design is?"

  *   **Follow-Up (If she replies that status is not harmed if the ranking is accurate/respectful):** "But the harm isn't just in the insult; it's in the power dynamic. When a citizen's vote can be overridden by a council solely because of their test score, the state is publicly declaring that their judgment counts for less. Can you really separate the *accuracy* of the ranking from the *civic injury* of being subject to it?"

  **3. Sociological Exclusion (The Jim Crow Correlation)**
  "Historically, literacy and competence tests in the American South were not just biased in intent, but in effect, correlating strongly with race and class due to unequal access to education. Given that performance on exams in economics and law correlates heavily with socioeconomic status today, how do you prevent your council from reproducing these exclusions, even if the examiners have no discriminatory intent?"

  *   **Follow-Up (If she replies that bias can be engineered out of the test):** "If the subject matter itself—neoclassical economics or constitutional originalism—reflects the worldview of dominant groups, can the test ever be neutral? If 'competence' is defined by familiarity with the tools of the elite, isn't the exclusion a feature of the epistemic standard, not just a bug in the implementation?"

  **4. The Condorcet Jury Theorem (Competence Thresholds)**
  "You cite the Condorcet Jury Theorem to argue for a small, highly competent council. However, the theorem also justifies mass democracy if the average voter is more than 50% likely to be correct. Furthermore, the theorem assumes voters make errors independently. If your council is homogeneous in training, they may share the same systematic biases, violating the independence assumption. Does your model account for the risk of correlated error among experts?"

  *   **Follow-Up (If she replies that experts are guaranteed to be above the 0.5 threshold):** "Even if they are above 0.5 on average, if they all make the *same* mistake on polarized issues due to shared training, the probability of a correct group decision drops to zero. Is it not an implementation detail that the *selection method* (the exam) creates the very homogeneity that breaks the mathematical model you rely on?"

  **5. The Hong-Page/Landemore Objection (Diversity vs. Ability)**
  "Hélène Landemore uses the Hong-Page theorem to argue that a cognitively diverse group of average problem-solvers can outperform a homogeneous group of high-ability experts. By selecting for specific expertise in law and economics, aren't you filtering out the very cognitive diversity—different heuristics, lived experiences, and problem-solving tools—that might prevent catastrophic blind spots?"

  *   **Follow-Up (If she replies that the council can be diverse in identity while expert in skill):** "But if the *gate* to entry is mastery of specific formal disciplines, you are selecting for a specific cognitive style. You can diversify the demographics of the council, but can you diversify their *toolkits* without abandoning the exam criteria that define them as epistocrats in the first place?"

  **6. Accountability and Removal**
  "Moving to the institutional design: In a democracy, we remove representatives who fail us through elections. Your council holds an absolute veto but is insulated from direct political pressure. If the council makes a catastrophic error—for example, vetoing a necessary emergency response—what is the mechanism for removal? Is there any way for the public to fire the council, or is their tenure truly secure?"

  **7. Scope of the Veto**
  "Could you clarify the scope of this veto power? Does it extend to budgetary appropriations and declarations of war, or only to statutory law? If the council can block funding for a war the elected assembly deems necessary, does this not create a constitutional deadlock that could paralyze the state during a crisis?"

  **8. Motivation and Service**
  "Serving on this council would likely make one deeply unpopular with the majority of the public, as you would be routinely overturning the will of the elected assembly. What incentives would attract high-quality candidates to this role? Are you not risking a council composed either of the ideologically rigid who don't care about popularity, or those seeking power precisely to insulate themselves from public accountability?"

  **9. Geopolitical Stability**
  "International relations often require speed and the credible threat of force. If a foreign adversary knows that your elected assembly can be vetoed by a small, deliberative council, does this not create a dual-track diplomacy that confuses allies and invites adversaries to test the limits of your internal divisions? How does epistocracy handle the 'speed' requirement of national security?"

  **10. Falsifiability (Closing Question)**
  "To close, I'd like to ask about the empirical grounds of your argument. Epistocracy is largely a theoretical proposal, as no modern state has operated exactly this way. What specific historical example or empirical finding—perhaps regarding the performance of technocratic bodies or the behavior of voters—would count as evidence against your theory? In other words, what would actually change your mind?"
