      *   **The Cost of Empire:** In Book IV, Ch. VII, Smith argues colonies often cost the metropole more than they return. The monopoly profits go to a few merchants; the defense/admin costs are borne by the public.
      *   **Joint-Stock Companies & Sovereignty:** Smith was deeply skeptical of joint-stock companies (like the EIC) acting as sovereigns. He argued merchants make bad sovereigns. They prioritize profit over justice/governance. ("The sovereign... should not be a trader.")
      *   **Monopoly & Distortion:** Exclusive trading privileges distort capital flow. They raise prices for consumers and hinder natural economic development.
      *   **Liberty & Independence:** Smith suggested letting America go because the cost of coercion outweighed the benefit. He valued the natural liberty of nations to trade with whom they please.

