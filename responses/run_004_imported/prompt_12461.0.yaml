answer: |-
  This is a sharp objection that cuts to the heart of the function debate. You are asking for an argument that demonstrates how Godfrey-Smith's **Modern History Theory (MHT)** fails to secure the ontological high ground that etiological theories claim over Cummins-style accounts. Specifically, you want to show that the "temporal window" problem in MHT is structurally identical to the "system boundary" problem in Causal-Role theory.

  Here is an argument constructing that case.

  ***

  ### The Relocation of Arbitrariness: Why Modern History Theory Fails to Save Etiological Accounts

  The primary marketing pitch of etiological (selected-effects) theory is **objectivity**. Proponents argue that while Cummins-style causal-role functions are relative to an observer's explanatory interests (e.g., whether we are analyzing the cardiovascular system or the acoustic environment), etiological functions are facts of natural history. Nature, via selection, fixes the function, not the theorist.

  However, the phenomenon of **exaptation** (traits co-opted for new uses, like insect wings shifting from thermoregulation to flight) threatens to freeze etiological theory in the past. If function is fixed by origin, wings are for heating, not flying. Peter Godfrey-Smith's **Modern History Theory** attempts to solve this by arguing that a trait's function is determined by the selective pressures that have maintained it in the *recent* past, rather than its ultimate origin.

  While MHT successfully captures our intuition that wings are for flying, it does so at a steep cost: it reintroduces the very arbitrariness it was designed to eliminate. The charge is that MHT does not resolve the problem of liberal individuation; it merely **relocates it from the spatial/systemic domain to the temporal domain.**

  #### 1. The Continuum Problem
  Evolutionary history is not a series of discrete switches; it is a continuum. In the case of the insect wing, there was no single generation where the selective pressure abruptly shifted from 100% thermoregulation to 100% flight. For thousands of generations, there was a gradient where both capacities contributed to fitness in shifting proportions.

  Pure etiological theory ignores this by looking at the "origin," but MHT must confront it by looking at "recent history." This forces the theorist to answer a question that nature does not answer: **How recent is recent?**

  *   Is it the last 50 generations?
  *   Is it since the last speciation event?
  *   Is it the period during which the *majority* of fitness contribution came from flight?

  There is no biological fact of the matter that delineates the precise temporal boundary where the "modern" history begins. Any cutoff point chosen is a methodological convenience, not an ontological boundary.

  #### 2. The Symmetry of Arbitrariness
  The etiological theorist's classic critique of Cummins is that the causal-role theorist arbitrarily draws a box around a system. They ask: *Why is the heart part of the circulatory system rather than the acoustic system?* The Cummins theorist admits this depends on our explanatory interests.

  However, under MHT, the etiological theorist must now draw a box around a **time period**. They must say: *Why does the selective history of the last 10,000 years count, but the history of 100,000 years ago does not?*

  If the Cummins theorist is accused of arbitrariness because they choose the **system boundaries** based on pragmatic interests, the MHT theorist is guilty of the same sin because they choose the **historical boundaries** based on pragmatic interests.
  *   **Cummins:** "I'm analyzing the circulatory system, so pumping blood is the function." (Spatial/Contextual Arbitrariness)
  *   **MHT:** "I'm analyzing the current species adaptation, so the last 5,000 generations count, making flight the function." (Temporal/Contextual Arbitrariness)

  In both cases, the "function" label is not fully determined by the natural world alone; it requires the theorist to impose a cutoff on a continuous process.

  #### 3. The Loss of the "Selling Point"
  The etiological theory's advantage was supposed to be that it naturalized function, removing the observer from the equation. If MHT requires the observer to define the relevant "modern" window to distinguish between an exaptation and a proper function, the observer is back in the driver's seat.

  Consider a trait currently in transition. Imagine a bird species where a feather pattern is currently shifting from camouflage to sexual selection. The selective pressures are mixed *right now*.
  *   A Cummins theorist says: "It has both causal roles; which one is the 'function' depends on what you want to explain."
  *   An MHT theorist must say: "It depends on which selective pressure dominated in the *recent* past."

  But if the shift is happening *now*, the "recent past" is ambiguous. If the theorist picks a window where camouflage dominated, it's for hiding. If they pick a narrower window where sexual selection is rising, it's for mating. The biological facts are identical; the function changes based on the theorist's chosen temporal resolution. This is indistinguishable from the Cummins-style reliance on explanatory context.

  #### Conclusion
  Godfrey-Smith's Modern History Theory is a necessary patch for etiological accounts to handle exaptation, but it is not a free lunch. By introducing a "recent history" clause, MHT concedes that selection history alone is insufficient to determine function without a **temporal framing parameter**.

  Since there is no principled, naturalistic way to determine the size of that temporal frame, the choice becomes pragmatic. Consequently, MHT inherits the very charge of arbitrariness it leveled against Cummins. It turns out that drawing a line through **time** is no more principled than drawing a line through a **system**. The etiological theorist wanted to escape the shadow of observer-relativity, but MHT suggests that shadow is cast by the nature of functional attribution itself, regardless of the theory employed.
