      *   *Check:* Is the analogy fair? Cummins' arbitrariness is about *explanatory interests*. MHT's arbitrariness is about *historical segmentation*. Are these the same? They are both "pragmatic cutoffs imposed on continuous natural phenomena." That's the link.
      *   *Refinement:* Make sure to emphasize that the *selling point* of Etiological theory was avoiding observer-relativity. If MHT reintroduces observer-relativity (via the choice of time window), it loses its main advantage.

