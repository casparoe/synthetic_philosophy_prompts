  Here's a thinking process that leads to the suggested argument:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Philosophy of Biology / Philosophy of Mind (Functions).
      *   **Core Debate:** Etiological (Selected-Effects) Theories vs. Causal-Role (Cummins) Theories.
      *   **Standard Critique:** Causal-Role is too liberal (anything that *does* something counts as a function, e.g., heart makes noise). Etiological is more restrictive (only what it was *selected for* counts).
      *   **Etiological Problem:** Exaptation/Co-option (e.g., insect wings: thermoregulation $\rightarrow$ flight). The original selection history conflicts with current utility.
      *   **Godfrey-Smith's Patch:** "Modern History Theory" (MHT). Function tracks *recent* selective history, not ultimate origin.
      *   **Task:** Argue that Godfrey-Smith's patch *fails* to save Etiological Theory from the charge of arbitrariness. Specifically, argue that defining "recent" is just as arbitrary as the Causal-Role theorist's choice of system/capacity.

  2.  **Analyze the "Arbitrariness" Charge:**
      *   *Against Cummins:* The charge is that without a selection history, there's no non-arbitrary way to privilege one causal capacity over another. Why is "pumping blood" the function and not "making noise"? Cummins says it depends on the explanatory context (the system you're analyzing). The critic says "But *you* choose the system, so it's arbitrary."
      *   *Against Etiological (specifically MHT):* The charge is that selection history is messy. When does a new function start? When does the old one end? Godfrey-Smith says "Recent history." The critic (me, in this task) needs to say "How recent is recent?"

  3.  **Develop the Argument (The "Relocated Arbitrariness" Thesis):**
      *   *Premise 1:* The main advantage of Etiological theories is supposed to be objectivity/naturalism (nature decides the function via selection, not the observer).
      *   *Premise 2:* Exaptation threatens this because the "selection history" is a chain, not a point.
      *   *Premise 3:* Godfrey-Smith's MHT tries to cut the chain at the "recent" end to capture current utility (flight) rather than origin (thermoregulation).
      *   *Conclusion:* The cutoff point for "recent" is not determined by nature itself but by the theorist, reintroducing the very arbitrariness Etiological theories claimed to solve.

  4.  **Flesh out the "How Recent?" Problem:**
      *   Is it the last generation? The last 100 years? The last speciation event?
      *   *Scenario:* Imagine a trait where the selective pressure is shifting *right now*. Or a trait where the new function has been dominant for 1,000 generations, but the old function still contributes 1% to fitness.
      *   *The Continuum Problem:* Evolution is gradual. There is no sharp line where thermoregulation stopped being the *main* driver and flight started. It's a cline.
      *   *The Decision:* Picking a timeframe (e.g., "since the last speciation event") is a methodological convenience, not an ontological fact. This mirrors the Cummins theorist picking a "system boundary."

  5.  **Compare with Cummins' Arbitrariness:**
      *   Cummins: Arbitrariness lies in *context of explanation* (What system are we looking at?).
      *   MHT: Arbitrariness lies in *temporal window* (How much history counts?).
      *   *Key Insight:* Both require the theorist to impose a boundary on a continuous natural process. Cummins imposes spatial/systemic boundaries; MHT imposes temporal boundaries. If the former is "hopelessly liberal/arbitrary," why isn't the latter?

  6.  **Anticipate Counter-Arguments (and address them briefly to strengthen the main point):**
      *   *Defense of MHT:* Maybe "recent" is defined by the stabilization of the trait.
      *   *Rebuttal:* Stabilization is also a matter of degree. When is a trait "stable"?
      *   *Defense of MHT:* It's less arbitrary than Cummins because selection is a real historical force.
