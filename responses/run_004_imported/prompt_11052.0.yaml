answer: |-
  **Rochester, New York. November 1855.**

  The cold came off the Genesee River like a hammer. Inside the Corinthian Hall, the air had been thick with coal smoke and the heat of three hundred abolitionists. Outside, on the stone steps, the quiet was brittle.

  William Lloyd Garrison pulled his wool collar tight against his throat. He was a small man, but his presence seemed to draw the lamplight toward him. Frederick Douglass stood a step higher, his silhouette massive against the glow of the open door behind him. Douglass was handing his hat to a porter, but he paused when he saw the older man waiting.

  "William," Douglass said. His voice was deep, resonant, stripped of the performance timber he'd used inside.

  "Frederick." Garrison's eyes were bright, burning with a fatigue that never seemed to result in sleep. "You have lost none of your fire. The crowd was ready to march on Washington before you finished."

  "The crowd is hungry for action, not just lamentation." Douglass descended one step, meeting Garrison on the landing. "I am glad you came. I hoped you would hear the shift in the argument."

  "I heard it," Garrison said. He took a small notebook from his pocket, then shoved it back, restless. "I heard you tell them that the Constitution is a shield. A weapon for liberty."

  "It is."

  "It is a lie," Garrison snapped. The sharpness surprised a passing straggler, who hurried into the dark. Garrison softened his tone, but not the edge. "Frederick, we have walked this road together. I pulled you from the lash of the Aulds, and we stood on the same platform when they burned us in effigy in Pendleton. Do not tell me you have forgotten the nature of the beast."

  "I have forgotten nothing," Douglass said. "But I have learned to read."

  "Read?" Garrison let out a short, sharp laugh. "You think this is a matter of syntax? Article I, Section 2. The three-fifths clause. 'All other Persons.' We know what they meant. They meant chattel. They meant property. The Framers sat in that hall in Philadelphia with whips in their pockets and slaves in their fields. To ignore their intent is to ignore the blood on the inkwell."

  Douglass folded his arms. The cold didn't seem to touch him. "Intent is a ghost, William. It haunts the mind, but it cannot sign a law. I am speaking of the text. Show me the word 'slave.'"

  Garrison waved a hand. "Euphemism is the language of tyrants. They knew it was sin, so they hid the word."

  "If it is hidden, it is not law," Douglass countered. "The Constitution speaks of 'persons.' It speaks of 'citizens.' If a man is held to service, the text does not say *why*. It does not sanction the property right. It merely acknowledges a factual condition. To read it as a pro-slavery document is to read the disease into the cure."

  "The cure?" Garrison stepped closer, looking up. "Frederick, I burned that document in a public square. I called it a covenant with death and an agreement with hell. You stood by me when I said it. Now you tell me it is a holy scripture?"

  "I tell you it is a tool," Douglass said. "And a tool can be turned. Look at the importation clause. Article I, Section 9. Congress was forbidden from prohibiting the migration of such persons until 1808. You say this protected the trade."

  "It *did* protect the trade for twenty years!"

  "No," Douglass said firmly. "It set a deadline. It put an expiration date on the traffic. A pro-slavery document would have secured that right in perpetuity. Instead, it marked it for death. And the three-fifths clause? You say it dehumanizes us."

  "It reduces a man to a fraction," Garrison said, his voice trembling. "It is arithmetic applied to the soul."

  "It is a penalty," Douglass insisted. "If the South counts us as full men, their representation in Congress grows. By counting us as three-fifths, the Constitution reduces their political power. It taxes them for holding us. It is a deterrent written into the apportionment. You read it as a concession to slavery; I read it as a burden placed upon the slaveholder."

  Garrison shook his head, looking out at the dark street. "You are parsing. You are playing the lawyer while the slave bleeds. What of Article IV? The Fugitive Slave clause. 'Person held to service or labor.' When the marshals come for a man in Boston, they do not ask if the text is ambiguous. They use the Constitution as a bill of sale."

  "The courts twist the text," Douglass said. "I do not defend the judges. I defend the document. If the word 'slave' is absent, if the word 'property' is absent regarding men, then the presumption must be liberty. The Preamble says 'secure the Blessings of Liberty.' It does not say 'secure the Blessings of Liberty for white men.' If a clause is ambiguous, does justice not demand we read it in favor of freedom?"

  "Justice demands we tear the house down if the foundation is rotten!" Garrison turned back, his eyes wet with frustration. "This is why we must disunion. 'No Union with Slaveholders.' As long as we remain under that roof, we are complicit. You are telling the colored man to vote in a system that declares him a non-citizen. You are telling him to trust a map that leads into the swamp."

  "I am telling him to seize the map and draw a new route," Douglass said. "Gerrit Smith showed me this. Lysander Spooner. The law is not what the slaveholder *wants* it to be. It is what the words *say*. If we say the Constitution is pro-slavery, we concede the ground to the South. We tell them, 'Yes, you own us by law.' I will not concede that."

  "You concede it by staying in the Union!" Garrison's voice rose, echoing off the stone. "You legitimize the government that hunts us. Frederick, I love you as a son. But this... this is a compromise with evil. It is the same sin as the politician who says, 'I hate slavery, but I must respect the law.' Since when is the law higher than the moral imperative?"

  "Since the law is the only lever long enough to move the world," Douglass replied quietly. "Moral suasion has its place, William. You taught me that. But the slaveholder does not listen to morality. He listens to power. Political power. If I can use the Constitution to argue that slavery is local, not national—that the federal government has no power to create a slave in a territory—then I can strangle it."

  "You are splitting hairs while the neck is in the noose."

  "And you are cutting the rope because you dislike the fiber."

  They stood in silence for a moment. The wind picked up, rattling the dry leaves against the steps. A carriage rolled by in the distance, the wheels heavy on the frozen mud.

  Garrison exhaled, a cloud of white in the lamplight. He looked smaller suddenly, the fire banked for a moment. "I fear you are walking into a trap. The political system will eat you. It will soften you. You will become a man who counts votes instead of souls."

  Douglass reached out and placed a hand on Garrison's shoulder. The gesture was heavy, warm. "And I fear you are standing outside the gate refusing to enter, shouting at the walls to fall down. They will not fall by shouting, William. They must be dismantled, stone by stone."

  "The stones are cemented with blood," Garrison said.

  "Then we shall wash them," Douglass said. "But I will not burn the house while my people are still inside it. I need the shelter to fight from."

  Garrison looked at the hand on his shoulder, then up at Douglass's face. He did not pull away. "You have always been your own man, Frederick. Even when you were mine."

  "I was never yours," Douglass said gently. "I was the cause's."

  "The cause is one."

  "The cause is the same. The path has forked."

  Garrison nodded slowly. He buttoned his coat. "I leave for Boston in the morning. There is a rally. I shall read the articles of the American Anti-Slavery Society. We will reaffirm the disunion stance."

  "And I shall stay here," Douglass said. "And prepare the next issue of *The North Star*. I shall cite the Fifth Amendment. Due process. No person shall be deprived of liberty without it."

  Garrison managed a thin, weary smile. "You will find the courts are deaf to that."

  "Then I will shout until they hear." Douglass removed his hand. "Safe travels, William."

  "God keep you, Frederick." Garrison turned to the street, where his carriage waited. He stopped after two paces, without turning around. "The three-fifths clause. You truly believe it was a penalty?"

  "I believe it can be made one," Douglass said to his back. "If we have the will to read it so."

  Garrison didn't reply. He pulled his collar up and walked into the dark, leaving Douglass alone on the steps, the text of the Constitution heavy in his mind, not as a covenant with death, but as a promise yet to be kept.
