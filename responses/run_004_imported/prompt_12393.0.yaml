prompt: |-
  Been on a bit of a rabbit-hole binge lately re-reading old LessWrong posts, and I keep bumping into a tension nobody seems to resolve super cleanly. Aumann's agreement theorem gets cited constantly as the reason two rational people "can't agree to disagree," and people use it almost like a knock-down argument for epistemic modesty - defer more to the consensus, don't be so confident in your inside view, etc. But then theres Eliezer's whole "Inadequate Equilibria" thing where he goes after "modest epistemology" pretty hard, arguing that treating "smart/informed people disagree with me, so I should update a ton toward their position" as a general policy is often wrong, and sometimes just status-signalling dressed up as humility. This actually came up a couple weeks ago when a friend and I were arguing about whether I should just defer to superforecaster consensus on AI timelines instead of trusting my own inside-view model, and I realized I don't actually know how much weight Aumann's theorem is even supposed to put behind that kind of deference.

  So could you compare the actual content of Aumann's theorem (the math, and specifically the conditions it needs to go through - common priors, common knowledge of posteriors, honest full updating, that sort of thing) against this looser "modest epistemology" heuristic of deferring to expert/majority opinion whenever you disagree with it? I want to know exactly where the theorem stops supporting the heuristic and where people are basically borrowing its authority without earning it - like, is this mostly a case of an idealized math result getting used as a vibes-based rule of thumb, or is there a more legitimate bridge between them? If it's relevant, I'd also be curious whether Hanson's old paper on honest disagreement (I think it's literally called "Are Disagreements Honest?", might be misremembering) is doing that bridging work, or if it's really a separate argument entirely. Feel free to get technical - I can follow common-prior/Bayesian-updating stuff fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Tension:** Aumann's Agreement Theorem (rational agents can't agree to disagree) vs. Eliezer Yudkowsky's "Inadequate Equilibria" (modest epistemology is often wrong/status-signaling).
      *   **Specific Context:** AI timelines (inside-view model vs. superforecaster consensus).
      *   **Request:** Compare the *actual mathematical conditions* of Aumann's theorem against the *heuristic* of epistemic modesty/deference. Identify where the theorem stops supporting the heuristic.
      *   **Specific Reference:** Robin Hanson's "Are Disagreements Honest?" (needs verification and integration).
      *   **Tone/Level:** Technical enough to handle common priors/Bayesian updating, but focused on the conceptual bridge (or lack thereof).

  2.  **Analyze Aumann's Agreement Theorem:**
      *   *What it says:* Two Bayesians with common priors and common knowledge of each other's posteriors cannot have different posteriors.
      *   *Key Conditions:*
          1.  **Common Priors:** They started with the same probability distribution over the state space before seeing private evidence.
          2.  **Common Knowledge of Posteriors:** I know your probability, you know my probability, I know that you know, etc. (This implies we know *why* we disagree, essentially).
          3.  **Honest Bayesian Updating:** Both are perfectly rational truth-seekers, no bias, no computational limits.
          4.  **Same Question:** They are estimating the exact same variable.
      *   *Implication:* If these hold, disagreement is impossible. If disagreement exists, at least one condition fails.

  3.  **Analyze "Modest Epistemology" (The Heuristic):**
      *   *The Rule:* "Smart people disagree with me $\rightarrow$ I should significantly update toward them."
      *   *The Justification:* Often cites Aumann as the "mathy reason" why disagreement is suspect.
      *   *The Weakness:* Real humans aren't Aumann agents. We have different priors, computational limits, hidden evidence, and incentives.

  4.  **Analyze Eliezer's "Inadequate Equilibria" Critique:**
      *   *Core Argument:* Blind deference to consensus can be an equilibrium trap. If everyone defers to everyone, no one processes inside-view evidence.
      *   *Status vs. Truth:* Claiming modesty can be a way to avoid the risk of being wrong while signaling humility.
      *   *When to defy:* When you have specific, strong inside-view evidence that the consensus mechanism is broken or missing key data (e.g., efficient markets vs. inefficient markets).

  5.  **Address the "Bridge" (Where does the math meet the heuristic?):**
      *   *The Gap:* Aumann is an impossibility result for *ideal* agents. Modesty is a policy for *bounded* agents.
      *   *The "Vibes" Usage:* People cite Aumann to shut down disagreement without checking the conditions (especially Common Priors and Common Knowledge).
      *   *The Legitimate Bridge:* Scott Aaronson's work or the concept of "Aumanning" as a process (trying to exchange evidence until convergence) rather than a state.
      *   *Hanson's Paper:* "Uncommon Priors Produce Origin Disputes" (2006) or "Are Disagreements Honest?" (2007). Actually, the user is likely thinking of "Are Disagreements Honest?" (2007) where Hanson argues that *if* we assume common priors, persistent disagreement implies dishonesty/bias. This *does* bridge Aumann to real life by suggesting that if you think you're rational, you must assume the other guy is biased (or vice versa). But Hanson also pushes for *actual* Aumanning (sharing evidence), not just blind deference.

  6.  **Synthesize the Argument:**
      *   **Introduction:** Acknowledge the tension. It's a classic LW debate.
      *   **Section 1: The Math (Aumann's Strict Conditions).** Detail Common Priors, Common Knowledge, Rationality. Emphasize that if these fail, the theorem doesn't apply.
      *   **Section 2: The Heuristic (Modest Epistemology).** Explain how it's used (defer to consensus).
      *   **Section 3: The Mismatch (Where the authority is borrowed).**
          *   *Priors:* We don't have common priors (genetics, upbringing).
          *   *Common Knowledge:* We rarely know *why* someone believes what they believe (black box).
          *   *Rationality:* We are biased.
          *   *Conclusion:* Aumann proves disagreement is *suspicious*, not that deference is *mandatory*.
      *   **Section 4: Eliezer's Critique (Inadequate Equilibria).** Explain why blind modesty fails (no one does the work, status signaling). The "Efficient Market" analogy.
      *   **Section 5: Hanson's Contribution.** Clarify the paper title (likely "Are Disagreements Honest?"). Hanson argues that *assuming* common priors forces you to attribute disagreement to bias. But his solution is *dialogue*, not just deference.
      *   **Section 6: Practical Application (AI Timelines).** How to weigh inside view vs. outside view without falling into either trap.
      *   **Conclusion:** Aumann is a limit case, not a policy manual.

  7.  **Refine the Technical Details:**
      *   Make sure to distinguish between "Common Knowledge of Posteriors" vs. "Sharing Evidence." Aumann says if you *know* the posterior, you converge. It doesn't tell you *how* to get there (that's the "Aumanning" process).
      *   Hanson's "Are Disagreements Honest?" (2007) argues that if we assume common priors, then persistent disagreement implies at least one party is not honestly reporting/updating (i.e., biased). This supports modesty *if* you assume you are the biased one, but it's symmetric.
      *   Mention the "Outside View" vs. "Inside View" distinction (Kahneman/Lovallo) as it relates to the AI timeline example.

  8.  **Self-Correction/Nuance Check:**
      *   *Did Hanson write "Are Disagreements Honest?"* Yes, 2007.
      *   *Is Aumann about deference?* No, it's about convergence given knowledge of posteriors. Deference is a heuristic to *approximate* convergence when you can't fully exchange evidence.
      *   *Eliezer's point:* It's not just that Aumann doesn't apply, it's that "modesty" can be an *inadequate equilibrium* where everyone waits for everyone else to think, resulting in collective stupidity.
      *   *Tone:* Keep it analytical, not taking sides, but clarifying the logical structure.

  9.  **Drafting the Response:** (Mental Outline)
      *   Intro: Valid tension. Aumann is often weaponized.
      *   Part 1: Aumann's Theorem (The Strict Math). List conditions.
      *   Part 2: The Modesty Heuristic. How it's derived (Aumann as a vibe).
      *   Part 3: The Breakdown. Why the math doesn't mandate the heuristic (Priors, Common Knowledge, Bias).
      *   Part 4: Hanson's Bridge. "Are Disagreements Honest?" -> Disagreement implies bias if priors common. But which one?
      *   Part 5: Eliezer's Counter. Inadequate Equilibria. Modesty as a trap.
      *   Part 6: AI Timelines Case Study. How to actually think about it.
      *   Conclusion: Aumann sets a bound, not a rule.

  10. **Final Polish:** Ensure clear headings, precise terminology (common priors vs. common knowledge), and direct answers to the user's specific questions about where the authority is borrowed. (Self-correction: Make sure to explicitly mention that Aumann requires *common knowledge of posteriors*, which is rarely met in real life, making the theorem descriptive of an ideal state, not prescriptive for current action).

  11. **Final Review against constraints:** Technical depth okay. Address Hanson. Address Eliezer. Address AI timeline example.

  *(Self-Correction during drafting)*: I need to be careful not to dismiss modesty entirely. Eliezer doesn't say "never defer," he says "don't defer *blindly*." The nuance is in the *mechanism* of updating. Aumann suggests you *should* converge if you talk enough. Modesty says "skip the talk and just move." Eliezer says "the talk is necessary, skipping it breaks the system."

