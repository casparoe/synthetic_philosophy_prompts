      *   **Critical Fact-Check:** I need to verify the student's claims against standard Mill scholarship *and* acknowledge the nuance introduced by Helen McCabe's work (if relevant), but primarily stick to established textual evidence since this is an undergraduate midterm.
      *   **Specific Claims to Verify:**
          1.  1848 *Principles* treated socialism as untested hypotheses.
          2.  Later editions rewritten sympathetically due to Harriet Taylor.
          3.  Mill's view: only social experience, not armchair reasoning, can settle the question.
          4.  Mill rejected sudden/central/forceful change.
