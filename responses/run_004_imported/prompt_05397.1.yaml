      *Check on Chapters on Socialism:* Written by Mill. Published posthumously. Edited/Published by Helen Taylor (stepdaughter), not Harriet (wife). Harriet died 1858. Mill died 1873. This is a definitive error.

      *Check on State Ownership:* Mill supported land nationalization (rent to state) but not necessarily all capital. He supported worker cooperatives owning capital. The student says "land and capital should pass into state ownership". This is too broad and inaccurate regarding capital.

      *Decision:* Grade 14/20.

