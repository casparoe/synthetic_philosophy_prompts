      *   *Gödel's Second:* Yes, a system cannot prove its own consistency ($\neg \square \bot$). Soundness implies consistency, so if it can't prove consistency, it can't prove soundness.
      *   *The "Tiling" Problem:* The specific problem in the paper is about an agent $A_1$ wanting to create $A_2$ such that $A_1$ proves $A_2$ is "safe" (preserves goals). If "safe" implies "sound" in the same logic, we hit the obstacle.

