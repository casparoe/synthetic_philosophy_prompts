  Here is a toy example that demonstrates the fatal flaw in Popper's original definition of verisimilitude, often attributed to the logicians Pavel Tichý and David Miller (1974).

  ### The Scenario: Three Light Switches

  Imagine a room with three light switches: **Switch 1**, **Switch 2**, and **Switch 3**.
  Each switch can be either **ON** or **OFF**.

  **The Truth (Reality):**
  All three switches are **ON**.
  *   $S1 = \text{ON}$
  *   $S2 = \text{ON}$
  *   $S3 = \text{ON}$

  Now, consider two competing scientific theories about the state of the switches. Both are false, but one is intuitively much closer to the truth.

  **Theory A (The "Better" False Theory):**
  Claims that Switch 1 is ON, Switch 2 is ON, but Switch 3 is OFF.
  *   Claims: $(S1=\text{ON}) \land (S2=\text{ON}) \land (S3=\text{OFF})$
  *   **Errors:** 1 (It gets $S3$ wrong).
  *   **Intuition:** This theory is very close to the truth. It got 2 out of 3 facts right.

  **Theory B (The "Worse" False Theory):**
  Claims everything Theory A claims, *plus* an additional error. It claims Switch 1 is ON, Switch 2 is ON, Switch 3 is OFF, **and** that Switch 1 is made of Gold. (In reality, Switch 1 is made of Plastic).
  *   Claims: $(S1=\text{ON}) \land (S2=\text{ON}) \land (S3=\text{OFF}) \land (S1=\text{Gold})$
  *   **Errors:** 2 (It gets $S3$ wrong AND the material wrong).
  *   **Intuition:** This theory is clearly further from the truth than Theory A. It makes all the mistakes of A, plus one more.

  ### Popper's Definition of Verisimilitude

  Popper defined "closeness to the truth" based on logical consequences. For Theory A to be closer to the truth than Theory B, it must satisfy two conditions:
  1.  **Truth Content:** A must entail *at least as many* true statements as B (and preferably more).
  2.  **Falsity Content:** A must entail *no more* false statements than B (and preferably fewer).

  *(Note: "Content" here means the set of **all** logical consequences, not just the original claims.)*

  ### The Technical Breakdown

  Here is where the definition collapses. We must look at the logical relationship between the two theories.

  Notice that **Theory B entails Theory A**.
  If it is true that "S1 is ON, S2 is ON, S3 is OFF, and S1 is Gold," then it is automatically true that "S1 is ON, S2 is ON, and S3 is OFF."

  Because Theory B is logically **stronger** (it makes more specific claims), it generates a larger set of logical consequences.
  *   **Truth Content:** Every true consequence of Theory A is *also* a consequence of Theory B. (For example, both entail "S1 is ON"). Therefore, Theory B has **more** (or equal) Truth Content than Theory A.
  *   **Falsity Content:** Every false consequence of Theory A is *also* a consequence of Theory B. (For example, both entail "S3 is OFF"). Therefore, Theory B has **more** (or equal) Falsity Content than Theory A.

  ### The Verdict

  Now we apply Popper's test to see if **Theory A** (the intuitively better one) is closer to the truth:

  *   **Condition 1:** Does A have more Truth Content than B?
      *   **No.** Because B entails A, B has all of A's true consequences plus potentially more.
  *   **Condition 2:** Does A have less Falsity Content than B?
      *   **Yes.** A avoids the false consequences regarding the "Gold" claim.

  **Popper's Result:** Because Condition 1 failed, **Theory A cannot be said to be closer to the truth than Theory B.**

  Now let's see if **Theory B** (the intuitively worse one) is closer:
  *   **Condition 1:** Does B have more Truth Content than A?
      *   **Yes.**
  *   **Condition 2:** Does B have less Falsity Content than A?
      *   **No.** B has more false consequences.

  **Popper's Result:** Because Condition 2 failed, **Theory B cannot be said to be closer to the truth than Theory A.**

  ### The Conclusion

  Popper's definition declares these two theories **incomparable**. It refuses to rank them.

  This is obviously wrong. Theory A is objectively "less false" than Theory B; it makes fewer errors. In real science, progress often looks exactly like moving from Theory B to Theory A (identifying and removing a specific error while keeping the successful parts).

  Popper's definition implies that **you can never measure progress between two false theories if one entails the other.** Since virtually all scientific theories are technically false (approximations), this definition renders the concept of scientific progress logically impossible to define. This paradox led to the abandonment of Popper's formal definition of verisimilitude in favor of other approaches (like possible-worlds semantics).
