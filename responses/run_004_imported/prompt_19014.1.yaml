prompt: |-
  I lost my younger sister three weeks ago. She worked in inverse reinforcement learning -- inferring someone's reward function just from watching what they do, since people are unreliable narrators of their own wants. I'm a novelist, not remotely technical, but the family's asked me to give the eulogy because I "have a way with words." Problem is, half the room at the memorial will be her old labmates who'll catch every reference, and the other half is family who won't know an MDP from a hole in the ground. She was maddeningly undemonstrative her whole life too, never told us what she wanted, so all I've got is thirty-some years of observed behavior -- same as any IRL setup. I know enough from her dinner-table rants to know her fields dirty secret: the reward function is never uniquely recoverable from behavior alone, there's always some degenerate reading that fits the data just as well (technically "felt nothing, ever" explains the record no worse than "loved us fiercely") unless you bring a prior to it. I dont want to just assert the generous reading with total confidence, she'd call that sloppy, but I can't stand up there and be totally agnostic either. Can you write the eulogy -- 7-8 minutes, warm enough for my parents, honest enough that her old colleagues don't cringe?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (non-technical, "way with words").
      *   **Deceased:** Younger sister, worked in Inverse Reinforcement Learning (IRL).
      *   **Audience:** Mixed (50% family/friends, 50% labmates/technical colleagues).
      *   **Tone:** Warm for family, technically honest/accurate for colleagues (no cringe), emotionally nuanced (not overly sentimental but not cold).
      *   **Key Theme:** IRL concepts applied to grief/memory. Specifically, the problem of inferring intent/reward from behavior.
      *   **Specific Constraint:** Acknowledge the technical truth (reward functions aren't uniquely recoverable; "felt nothing" fits the data as well as "loved fiercely") without settling on a sloppy assertion or total agnosticism. Needs a "prior."
      *   **Length:** 7-8 minutes spoken (approx. 1000-1200 words at a moderate pace).
      *   **Sister's Personality:** Maddeningly undemonstrative, never said what she wanted.

  2.  **Deconstruct the Technical Concepts for the Eulogy:**
      *   *Inverse Reinforcement Learning (IRL):* Figuring out *why* someone does what they do by watching *what* they do.
      *   *Behavior vs. Reward:* Actions are visible; internal desires (rewards) are hidden.
      *   *The "Dirty Secret" (Non-identifiability):* Many different internal motivations can produce the exact same outward behavior. A robot could act helpful because it loves you or because it's programmed to minimize error.
      *   *The "Prior":* A pre-existing belief or assumption used to resolve ambiguity. In Bayesian terms, $P(\theta|D) \propto P(D|\theta)P(\theta)$. You need a prior to pick one solution from the many possible ones.
      *   *Application to Grief:* We only have her actions (data). We want to know her love (reward function). The data is ambiguous. We need a prior to interpret it.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (novelist vs. scientist). Set the scene. Acknowledge the split audience.
      *   **The Core Metaphor (IRL):** Explain her work simply but accurately. Don't dumb it down too much for the labmates, but make it accessible for family.
      *   **The Sister's Nature:** Undemonstrative. Hard to read. This fits the IRL theme perfectly.
      *   **The Technical Problem (The "Dirty Secret"):** Address the non-identifiability issue. This is the crucial emotional pivot. Acknowledge that her silence *could* mean indifference.
      *   **The Solution (The Prior):** How do we resolve this? The family chooses a prior. Not blind faith, but a choice based on the weight of evidence over 30 years.
      *   **Closing:** A farewell that honors her rigor and their love.

  4.  **Refining the Tone:**
      *   *Avoid:* "She's in a better place," "She loved us so much" (without qualification).
      *   *Include:* "Optimal policy," "Reward function," "Degenerate solutions," "Prior."
      *   *Emotional Arc:* Confusion/Uncertainty -> Technical Honesty -> Chosen Belief -> Acceptance.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I write books, she wrote code. She studied how to guess what people want by watching them. She was hard to read. Technically, you can't know for sure what she wanted just by looking at what she did. Maybe she didn't care. But we choose to believe she did. That's our prior. She was smart. We miss her.

      *Critique 1:* Too blunt. Needs more poetry for the family, more precision for the colleagues. Needs to hit the 7-8 minute mark.

  6.  **Drafting - Iteration 2 (Adding Flesh & Blood):**
      Start with the irony. I'm the wordsmith, she was the logic. Talk about her work. Explain IRL. People lie about what they want; actions tell the truth. But she was quiet. She showed up. She fixed things. The math says there are infinite explanations for her actions. One is she felt nothing. One is she loved us. I can't prove it. But I'm applying a prior. The prior is family.

      *Critique 2:* Better. Need to make sure the technical terms are used correctly so the labmates nod, not groan. The concept of "degenerate solutions" needs to be handled delicately so it doesn't sound like an accusation.

  7.  **Finalizing the Content (incorporating the "Dirty Secret"):**
      *   *Key phrase:* "The reward function is never uniquely recoverable."
      *   *Key phrase:* "Degenerate reading."
      *   *Key phrase:* "Bayesian prior."
      *   *Emotional hook:* The choice of the prior is an act of love, not just math.

  8.  **Writing the Speech (incorporating pacing and pauses):**
      *   *Word Count Check:* 130 words per minute is average. 7 minutes = ~910 words. 8 minutes = ~1040 words. I should aim for around 1000-1100 to allow for pauses and emotion.
      *   *Structure:*
