      *   Fullerian: Congruence/Constancy/Secret vs Public? Yes.
      *   No easy concessions? Yes.

  Proceed to generate output. (Thinking process ends).
answer: |-
  **Elena (Hartian):** Let's be precise about what the Federal Constitutional Court actually did in the *Mauerschützen* cases. They didn't pass a new statute criminalizing the guards' actions at the time they were committed. Instead, they argued that the GDR's own border laws, when properly interpreted in light of international human rights covenants the GDR had signed, did not actually authorize the killing of unarmed fugitives. They invoked Radbruch's formula: extreme injustice is no law. From a Hartian perspective, this is a category error. The GDR's Border Act of 1982 was posited. It was enforced. It was recognized by the GDR's courts. To tell the guards now that it "wasn't law" is a fiction. Hart's view on the grudge-informer cases was clearer: if you want to punish them, pass a retroactive statute. Own the choice. Don't disguise a moral judgment as a legal discovery.

  **Marcus (Fullerian):** But that clarity comes at the cost of fidelity. If the reunited Germany passes a retroactive statute, it admits that the GDR *was* a functioning legal order whose commands must now be explicitly overwritten. That validates the GDR's claim to legality. My point is that the German courts were closer to Fuller than you admit. They didn't just say "this was evil." They pointed to a specific failure in the GDR's law-making process: the gap between the public statutes and the secret directives. The public Border Act spoke of "preserving the border," but the secret National Defense Council orders mandated "annihilating the border violator." For Fuller, this violates the principle of congruence between declared rule and official action. When the state hides the real rule from the subject, it ceases to guide conduct by rules. It becomes a matter of managerial direction.

  **Elena:** You're conflating two different failures. Congruence, in Fuller's sense, usually refers to the gap between the law on the books and the law in action—like a police force ignoring a statute. Here, the police and the guards were following the secret orders perfectly. The "wickedness" isn't that the law wasn't followed; it's that the law was wicked. And this brings me back to Hart's central critique of Fuller: you can satisfy all eight principles of the inner morality of law—generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, and congruence—and still produce a legal system that is substantively monstrous. If the GDR had simply published the shoot-to-kill order in the official gazette, made it clear, and enforced it consistently, your "inner morality" would be satisfied. Yet the German courts struck it down. Why? Because it violated substantive human rights. That is Radbruch, not Fuller. You are using procedural language to smuggle in a substantive natural law test.

  **Marcus:** I'm not smuggling anything in; I'm looking at the conditions of agency. Fuller's morality isn't just a checklist; it's about the reciprocal relationship between lawgiver and subject. Law implies a demand that the subject orient their conduct to a rule. In the *Mauerschützen* trials, the defense was that they were following the law of the GDR. But which law? The Constitution guaranteed the integrity of the human person. The Penal Code prohibited murder. The Border Act was ambiguous enough to be interpreted restrictively. The secret orders contradicted the public texts. A citizen—or a conscripted guard—cannot orient their conduct when the public face of the law says one thing and the operational command says another. This isn't just "substantive wickedness"; it's a collapse of the form of law itself. The guards weren't punished for breaking a new law; they were punished for violating the GDR's *own* public legal order, which the secret directives had undermined.

  **Elena:** That is a strained reinterpretation of the GDR legal order, and you know it. The GDR was a socialist state where the Party's will, expressed through these secret directives, *was* the supreme source of law. The courts at the time would have recognized the secret orders as valid. To say now that the "real" GDR law was the Constitution and not the Defense Council's orders is to impose a Western liberal hierarchy of norms onto a system that explicitly rejected it. Hart would say this is exactly the danger of merging law and morality. By refusing to call the GDR rules "law" because they offend our current moral sensibilities, you blur the line between what the law *is* and what it *ought to be*. This creates uncertainty. If we can deny the legal character of posited rules whenever they shock our conscience, we undermine the security that law provides. Hart preferred the "honest" retroactive statute because it preserves the distinction: "This was law, it was wicked, so we are changing the law to punish you."

  **Marcus:** But that "honesty" undermines the very project of a community of law. If Germany passes a retroactive statute, it treats the guards as victims of a change in sovereign will. It says, "You acted legally then, but we dislike it now." That denies the moral agency of the guards. It suggests they had no duty to question the order because it was "law." Fuller's approach allows the court to say, "You had a duty to recognize that these secret orders lacked legal character because they destroyed the reciprocity required for law." It's not about shocking the conscience; it's about the impossibility of compliance. How can a guard comply with the public duty to respect human life and the secret duty to shoot? By forcing the guard to choose, the regime placed him outside the realm of legal governance. Punishing him isn't retroactive; it's enforcing the demand that law must be capable of being followed.

  **Elena:** "Capable of being followed" is doing too much work in your argument. It was perfectly capable of being followed: shoot the fugitive. The conflict was between the secret order and the *moral* imperative of the public constitution, which the GDR regime routinely ignored. You are essentially arguing that a legal system loses its validity if it becomes too hypocritical. But history shows legal systems survive hypocrisy quite well. The Hartian point is pragmatic: if we accept your view, every time a court finds a past statute repugnant, it must engage in this metaphysical dance to declare it "non-law." Why not simply admit that legal validity is a matter of social fact (the rule of recognition), and that moral validity is separate? The German courts wanted to avoid the label of "retroactivity" because it sounds illiberal. But in trying to avoid that label, they compromised legal certainty. They told the guards, "The law you thought bound you didn't bind you," which is a retroactive change in the rule of recognition.

  **Marcus:** It's not metaphysical; it's functional. Law functions to subject human conduct to the governance of rules. When the GDR issued secret orders that contradicted public statutes, they weren't governing by rules; they were governing by terror. There is a threshold where the violation of the inner morality is so severe that the system ceases to function *as* law, even by its own standards. The German courts didn't just say "this is immoral." They analyzed the GDR's own legal hierarchy and found that the secret orders violated the GDR's own requirements for promulgation. That is a positivist argument, actually. But it relies on a Fullerian understanding of what promulgation *means*. It means making the rule known to those expected to obey it. If the "law" is hidden in a safe in the Defense Ministry, it fails the publicity requirement essential to the concept of law. Therefore, the guards were not protected by "legal validity" because the requisite validity was never achieved.

  **Elena:** If the GDR's rule of recognition accepted secret orders as valid—which it did—then they were promulgated *within that system*. You are judging the GDR's rule of recognition by a liberal democratic standard. That is the natural law move. Hart would concede that the secret orders fail a moral test, but he would insist they passed the legal test of the GDR. Here is the rub: If the GDR had published the shoot-to-kill order in the gazette, explicitly stating "unarmed fugitives shall be shot," would you still say it lacks legal character? If you say yes, you are a Radbruchian substantive natural lawyer, not a Fullerian proceduralist. If you say no, then you must admit the German courts relied on substantive injustice, not just procedural failure. You can't have it both ways. You can't claim Fuller's proceduralism saves us from Radbruch's substantive metaphysics when the procedure was perfectly followed, just with horrific content.

  **Marcus:** I will take the risk on that hypothetical. Even if published, a rule that commands the destruction of the very subjects it claims to govern undermines the purpose of law. Law presupposes the existence of agents who can follow rules. A rule that says "cease to exist if you attempt to leave" treats the subject not as an agent, but as an object to be removed. This violates the principle of "possibility of compliance" in a deep sense. One cannot comply with a rule that eliminates the complier. So, even if published, it fails the inner morality because it makes the relationship between law and subject impossible. It is not just "wicked"; it is self-defeating as law. The German courts recognized this when they cited the violation of "elementary precepts of justice" *alongside* the procedural contradictions. They saw that the substantive injustice was evidence of the procedural collapse. The two are not as separable as Hart insists.

  **Elena:** That is a beautiful argument, Marcus, but it collapses the distinction Hart spent his career defending. If "possibility of compliance" includes "the law cannot threaten my existence," then you have imported a substantive right to life into the definition of law. You have turned a procedural requirement into a substantive shield. Hart's worry was precisely this: that by defining law so that it *cannot* be wicked, you blind us to the specific horror of wicked law. We need to be able to say, "This was valid law, and it was a crime." The German courts, by using your logic, obscured the reality of the GDR. They pretended the GDR was a constitutional democracy that had a few bad apples, rather than a system where the law itself was the weapon. Hart's retroactive statute would have been a clearer moral condemnation. It would have said, "The state is powerful enough to punish you for what was legal, because justice demands it." Instead, we got this legalistic fiction that undermines the clarity of the concept of law for future generations.

  **Marcus:** But does it? Or does it reinforce the idea that law is not merely a command of the sovereign, but a practice that requires integrity? If we accept Hart's view, we tell future officials: "As long as you follow the procedure, you can command anything, and it will be law until we pass a retroactive statute to stop you." That invites the very tyranny Hart claims to guard against. The Fullerian approach tells officials: "If you violate the inner morality, you lose the claim to fidelity. Your commands will not be recognized as law, even by your own successors." That is a stronger deterrent. The *Mauerschützen* trials weren't just about punishing guards; they were about re-establishing the rule of law in the East. To do that, they had to show that the GDR's orders lacked legal authority *at the time*, not just in hindsight. Hart's retroactive statute admits the GDR's authority and overrides it. The Fullerian approach denies the GDR's authority existed in those moments. That is a crucial difference for the fidelity of the new regime.

  **Elena:** It's a crucial difference for *myth-making*, perhaps. But for legal theory, it's a confusion. You are denying the authority of the GDR because it failed to meet the standards of the *new* regime's conception of legality. That is victor's justice dressed up as jurisprudence. Hart's separation thesis allows us to critique the law without denying its existence. It allows us to say, "The GDR had law, but it was a bad legal system." Your view forces you to say, "Where the GDR was wicked, it had no law." That leaves us unable to account for the systemic nature of the injustice. It wasn't a failure of procedure; it was a success of a wicked system. By focusing on the secret orders and the congruence failure, you let the system off the hook. You make it look like a technical error rather than a structural feature of authoritarianism. Hart's honesty about retroactivity acknowledges the break in regimes. Your fidelity to "law" tries to bridge a gap that shouldn't be bridged.

  **Marcus:** And Hart's honesty risks turning law into mere power. If the GDR had law simply because it had power and a rule of recognition, then law is just the efficient organization of force. The *Mauerschützen* trials were an attempt to assert that law is more than that. By grounding the conviction in the failure of the GDR's own legal principles (publicity, congruence, non-contradiction), the courts maintained that there is a continuity of legal reason that transcends regime change. It wasn't victor's justice; it was an appeal to standards the GDR purported to uphold but systematically betrayed. That is the heart of Fuller's project: law is not a one-way projection of authority, but a cooperative enterprise. When the GDR turned it into a one-way projection of force, it exited the domain of law. Recognizing that exit isn't a fiction, Elena; it's the only way to preserve the concept of law from being reduced to the command of the gunman.

  **Elena:** Then we are left with the gunman situation specialized. Hart would say the gunman situation is exactly what the GDR was. Calling it "non-law" doesn't change the fact that the guards were operating within a coercive normative system. But I concede this: the German courts did not use a simple Radbruch formula. They did weave in the procedural defects. However, my final point stands: those procedural defects only mattered because the *outcome* was substantively unjust. If the secret orders had authorized generous grants of housing to border guards, no one would have argued they weren't "law" due to lack of publicity. The procedural critique is triggered by the substantive horror. Hart's separation allows us to see that causal link clearly. Your view obscures it by pretending the procedural failure alone did the work.

  **Marcus:** And I concede that the substantive horror makes the procedural failure visible. But the work being done *in the judgment* is procedural. That matters for the precedent. It sets a standard for official conduct, not just a standard for outcomes. It tells legislators: "You cannot hide behind secret orders." That is a lesson for the future of law, not just a judgment on the past. Hart's retroactive statute teaches: "We can change the rules whenever we want." Fuller's approach teaches: "The rules must meet certain standards to claim our obedience." In the end, the *Mauerschützen* trials were about the future of the German legal order, not just the fate of the guards. On that front, Fuller offers a more robust foundation for a constitutional democracy than Hart's cautious separation.

  **Elena:** Perhaps. But at the cost of clarity. And in law, clarity is a moral virtue too.

  **Marcus:** And fidelity is a moral virtue too. We may just have to agree that the tension between them is the price of a legal system that aspires to be both effective and just.
