answer: |-
  Diderot: You treat pity as a finite resource, Jean-Jacques. As if feeling for a fictional king drains the capacity to feel for a real neighbor. I say the opposite. The stage is a gymnasium for the soul. We exercise our sentiments there so they do not atrophy in the street.

  Rousseau: A gymnasium? Is that what you call a dark room where citizens sit in silence, separated by rank, paying to watch a stranger pretend to weep? You call that exercise? It is idleness dressed up as culture.

  Diderot: It is not the silence that matters, it is the shared shock. When the curtain falls, we have all felt the same terror, the same compassion. That bond is real. You want to deny them the chance to see virtue rewarded and vice punished in a concentrated form?

  Rousseau: I deny nothing except the lie. Consider the instrument itself, Denis. The actor. What is his trade? To counterfeit feeling. To sell the outward signs of passion without the substance. He trains himself to feel nothing while appearing to feel everything. If a man practices deception for a living, how can you expect him to teach truth?

  Diderot: You reduce craft to dishonesty. The actor does not lie; he translates. He takes the chaotic suffering of the human condition and gives it form so we can understand it. Without that form, suffering is just noise.

  Rousseau: It is worse than noise. It is a prostitution of the person. To stand on a plank and offer up your own face, your own voice, for the appraisal of the wealthy? In Geneva, we cannot afford that inequality. You speak of Paris, where luxury is the blood in the veins. But Geneva is a small republic. We survive on equality.

  Diderot: Equality does not mean uniformity. And virtue does not survive in a vacuum. You think locking the gates keeps vice out? Vice grows in the dark. The theatre shines a light.

  Rousseau: The theatre shines a light on nothing but our own passivity. You make them spectators when they should be actors. Why pay to watch others celebrate when you can celebrate yourselves? Put a stake in the ground in the middle of the square. Let the people gather around it. Let them sing, let them dance, let them be the entertainment to one another.

  Diderot: A maypole. You would replace Sophocles with a maypole.

  Rousseau: I would replace representation with presence. In your theatre, half the city watches the other half sit in the loges. The rich are seen, the poor are hidden. It teaches them to value appearance over substance. It teaches women to paint themselves for the gaze of men. It imports the manners of courts into a city of craftsmen.

  Diderot: And what manners do you prefer? The stern judgment of the elders? You want a city where everyone watches everyone else, yes, but only to police them. At least in my theatre, they weep together. That tear is a moment of unity.

  Rousseau: A unity of illusion! It lasts two hours, and then they return to their homes harder than before. Because they have paid for their virtue. They say, "I have seen tragedy, I have pitied the orphan, therefore I am good." And so they feel licensed to be indifferent tomorrow. They have discharged their duty at the box office.

  Diderot: That is a risk, I grant you. But the alternative is a society that never confronts its own contradictions. The bourgeois drama I write—it shows fathers and sons, masters and servants, not as types but as men. It forces the merchant to see himself in the father. That is moral work.

  Rousseau: It is a mirror that flatters. You show them conflicts they can resolve with sentiment, not action. Real virtue is not feeling pity for a king on a stage. Real virtue is walking past a beggar and stopping. It is attending the council. It is hard, Denis. It is unglamorous.

  Diderot: You make virtue sound like a punishment.

  Rousseau: Sometimes it is. But it is ours. When you bring in players, you bring in a caste apart. They are not citizens. They are servants of the public who are nonetheless despised by the public. How can a city be whole when it harbors men who are paid to be someone else?

  Diderot: We are all paid to be someone else. The lawyer, the priest, the merchant. We wear masks to function. The actor simply admits the mask. There is honesty in that.

  Rousseau: There is despair in it. To live always outside oneself. You say the theatre combats isolation. I say it creates it. It locks each man in his own seat, in his own private emotion, while pretending to community. True community is not sitting in the dark. It is standing in the light.

  Diderot: And if the light is too bright? If men cannot bear to look directly at one another without mediation? You demand too much of human nature, Jean-Jacques. You want angels for citizens. I am content with men.

  Rousseau: Then you will settle for a city of men who pay to feel nothing.

  Diderot: No. I want a city of men who know what it feels like to be human. Even if they have to learn it from a lie.

  Rousseau: Then the lie will own them. And Geneva will be just another Paris.

  Diderot: Or perhaps Paris will finally learn to be Geneva. But not by closing the doors.

  Rousseau: By guarding the walls.

  Diderot: Walls keep out the plague, Jean-Jacques. But they also keep out the air.

  Rousseau: Better stale air than poison.

  Diderot: We shall see which suffocates us first.
