      *   *The "Midnight Google Sheet" Test:* Go through each pillar and apply it to the specific scenario.
          *   *Priors:* Crypto views vary wildly. Unlikely to be common.
          *   *Updating:* Humans aren't perfect Bayesians. We have biases.
          *   *Common Knowledge:* Saying "I think 60%" isn't common knowledge. Do I trust you? Do I know *why* you think 60%?
          *   *Rationality:* The definition of "rational" in the theorem is mathematical consistency, not "being smart."
      *   *The "Irrational" Accusation:* Address the housemate's claim. If the assumptions fail, the conclusion (must converge) doesn't hold. Therefore, disagreement doesn't imply irrationality. It implies different priors or bounded rationality.
