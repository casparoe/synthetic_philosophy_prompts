      *   **PAP:** An agent is morally responsible only if they could have done otherwise.
      *   **Frankfurt's Goal:** Show Jones is responsible even though he *couldn't* have done otherwise (because Black would have forced him). Thus, PAP is false.
      *   **The Dilemma Defense (Kane/Widerker):**
          *   *Horn 1:* The "prior sign" is causally sufficient for the decision. If so, the decision is determined. Libertarians (who believe responsibility requires indeterminism) will reject the case as question-begging.
          *   *Horn 2:* The "prior sign" is *not* causally sufficient. If so, Jones could show the sign but still choose otherwise. If he chooses otherwise, Black intervenes. But this means at the moment of choice, Jones *could* have done otherwise (before Black steps in). So PAP isn't truly bypassed; alternative possibilities exist (the "flicker").
      *   **Buffer Cases (Mele/Robb):**
          *   Goal: Remove the "prior sign" that correlates with the choice.
          *   Mechanism: Create a "buffer" zone of neural activity. The agent must pass through this buffer to choose otherwise. The intervener monitors the buffer. If the agent enters the buffer zone for $\neg X$, the intervener forces $X$. If the agent stays in the $X$ zone, no intervention.
