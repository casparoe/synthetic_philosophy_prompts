  6.  **Addressing the "Why Metrics" Requirement:**
      *   Must explicitly state that narrative review *was* biased. It favored well-connected departments, male candidates, safe topics. Metrics were an attempt at *equity*. I need to validate the administrators' intent without validating their method.

