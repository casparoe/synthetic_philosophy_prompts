      *   **Task:** Draft a memo to a university task force reviewing a "Composite Research Impact Score" (CRIS).
      *   **Context:** The CRIS combines field-normalized citations, grant income, and top-quartile publication counts. It's meant to replace narrative peer review for merit raises and tenure.
      *   **Problem:** A pilot in Chemistry showed Goodhart's Law in action (salami slicing, citation rings, risk aversion).
      *   **Conflict:** Half the task force wants to tweak the formula (fix the metrics); the other half wants to scrap quantification entirely (return to narrative). Administrators complain narrative review was slow and biased by networks.
      *   **Goal:** A specific recommendation for the *next year's review cycle*, reasoning both sides could accept, and a serious account of *why* metrics were proposed (beyond just "metrics get gamed").

  2.  **Deconstruct the Conflict & Stakeholders:**
      *   **Pro-Metrics (Administrators/Tweakers):** Want efficiency, objectivity, transparency, accountability for public funds, reduction of "old boys' network" bias.
      *   **Anti-Metrics (Narrative Advocates):** Want quality over quantity, protection of risky/long-term work, recognition of null results, holistic assessment.
      *   **The Physicist/Philosopher (User):** Bridges the gap. Understands data but knows its limits. Seeks a *synthesis* rather than a binary choice.

  3.  **Determine the Core Argument:**
      *   *Why were metrics proposed?* It wasn't just malice or laziness. It was a desire for *procedural justice* and *scalability*. Narrative review is opaque and vulnerable to implicit bias (the "halo effect" of famous PIs). Metrics offer a veneer of democratic fairness.
      *   *Why do metrics fail?* Goodhart's Law is the surface reason. The deeper reason is *category error*. Research impact is a complex, latent variable; metrics are proxies. When proxies become targets, they cease to be good proxies.
      *   *The Recommendation:* A "Hybrid Calibration Model." Don't scrap metrics, but don't let them decide. Use metrics as *triggers* for deeper narrative review, not as *determinants* of outcome. This satisfies the need for efficiency (administrators) and the need for nuance (faculty).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the user's background (physicist turned philosopher) to establish ethos. State the purpose clearly.
      *   **Section 1: The Genesis of the Metric (The "Why"):** Address the prompt's requirement to explain *why* metrics were proposed. Focus on the legitimate grievances with narrative review (bias, opacity, slowness). Avoid caricaturing the administration.
      *   **Section 2: The Pilot Results (The "What"):** Acknowledge the Chemistry pilot. Don't just say "gaming." Describe it as *optimization of the proxy* rather than *optimization of science*. Use physics analogies if appropriate (measurement affecting the system).
      *   **Section 3: The Recommendation (The "How"):** This needs to be the bridge.
          *   *Idea:* "Metrics as Triage, Narrative as Verdict."
          *   *Mechanism:* If metrics are high -> Fast track. If metrics are low/anomalous -> Mandatory narrative review. If metrics are high but suspicious (e.g., citation spikes) -> Audit.
          *   *Specifics for Next Year:* Pause the *consequential* use of the score (no raises/tenure based *solely* on it). Use it diagnostically.
      *   **Section 4: Philosophical/Practical Synthesis:** Why both sides should accept this. It preserves efficiency for clear cases but protects against gaming and bias in edge cases.
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
