answer: |-
  **MEMORANDUM**

  **TO:** University Task Force on Research Assessment
  **FROM:** [Your Name], Department of Physics (Emeritus)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for the 2024 Review Cycle: A Calibrated Hybrid Model

  ### 1. Introduction

  I write this as a colleague who spent forty years measuring physical systems and the last few years studying the epistemology of evaluation. In experimental physics, we learn early that the act of measurement inevitably perturbs the system under observation. The pilot program in Chemistry has confirmed this: when we measure research impact via a Composite Research Impact Score (CRIS), the research system reconfigures itself to maximize the score, often at the expense of the underlying variable we actually care about—scientific truth.

  We are currently deadlocked. One faction seeks to refine the weights of the CRIS formula; the other seeks to abolish quantification entirely. Administrators rightly note that the previous narrative system was slow and vulnerable to the "halo effects" of personal networks. Faculty rightly note that the new metric system encourages salami-slicing and risk aversion.

  This memo proposes a third path for the upcoming review cycle. It requires us to acknowledge why the metrics were proposed in the first place, rather than dismissing them as mere administrative bloat, and to utilize them not as a verdict, but as a triage mechanism.

  ### 2. The Legitimate Intent of Quantification

  To move forward, we must grant that the proponents of the CRIS were not merely seeking efficiency; they were seeking *procedural justice*.

  The narrative peer review system we replaced was not neutral. It relied on reputation, which is often a proxy for longevity, institutional prestige, and social connectivity. In a narrative system, a well-connected senior researcher can frame a modest contribution as "groundbreaking," while an early-career researcher or someone from a marginalized group may have to work twice as hard to receive the same characterization. Narrative review is opaque; it offers no audit trail. When tenure or merit raises are decided behind closed doors based on "letters of support," implicit bias thrives.

  The CRIS was proposed to democratize evaluation. It was an attempt to create a level playing field where a dollar of grant income or a citation in a top-quartile journal counts the same regardless of the applicant's gender, department, or social circle. It was an attempt to shift from a *Reputation Economy* to an *Accountability Economy*. We cannot return to the old system without acknowledging that we are also returning to its structural biases.

  ### 3. The Measurement Error

  However, as the Chemistry pilot demonstrates, the CRIS suffers from a category error. It treats "Research Impact" as a direct observable, like voltage or temperature. It is not. It is a latent variable—a complex construct that can only be inferred through multiple, imperfect proxies.

  When a proxy becomes a target, it ceases to be a good proxy (Goodhart's Law). The Chemistry pilot showed us that researchers are rational actors. If the formula rewards citation count, they will slice papers. If it rewards grant income, they will prioritize fundable safety over intellectual risk. If it rewards top-quartile publications, they will avoid the interdisciplinary or null-result work that often leads to genuine breakthroughs.

  The error is not in the data itself, but in the *deterministic* use of that data. We are currently using the CRIS as a *substitute* for judgment, rather than an *aid* to judgment.

  ### 4. Recommendation: The Two-Channel Calibration Model

  For the next review cycle (2024), I recommend we pause the use of the CRIS as a sole determinant for merit raises and tenure. Instead, we should implement a **Two-Channel Calibration Model**. This approach utilizes the efficiency of metrics to satisfy administrative concerns while reinstating human judgment to satisfy faculty concerns.

  **The Mechanism:**

  1.  **Channel A (Expedited Review):** Candidates whose CRIS falls within the top 20% of their cohort *and* shows no statistical anomalies (e.g., sudden citation spikes from a single lab) qualify for an expedited narrative review. Their file is presumed strong; the committee focuses on confirming the quality of the work rather than establishing the baseline. This satisfies the administrative need for speed and efficiency.
  2.  **Channel B (Calibrated Review):** Candidates whose CRIS is low, average, or statistically anomalous trigger a mandatory, robust narrative review. Crucially, a "low" score does not penalize the candidate; it simply flags the file for deeper human scrutiny. This protects the researcher pursuing a high-risk, long-term project or one working in a field with lower citation norms.
  3.  **The "Null-Result" Amendment:** For the 2024 cycle, we will explicitly weight high-impact null results or data-set publications within the narrative portion of the review, acknowledging that these contribute to the scientific record even if they depress citation metrics.

  **Why This Resolves the Deadlock:**

  *   **For the Pro-Metrics Faction:** We retain the data. We do not scrap the CRIS. We use it to streamline the review of clear high-performers, reducing the administrative burden on the committee. We maintain transparency and accountability.
  *   **For the Pro-Narrative Faction:** We remove the high-stakes determinism. No tenure decision is made by an algorithm. The "gaming" incentives are reduced because a high score no longer guarantees a raise, and a low score no longer guarantees rejection. The human committee retains the final authority to interpret the context behind the numbers.

  ### 5. Conclusion

  In physics, we distinguish between precision (repeatability) and accuracy (truth). The CRIS is precise; the narrative review is accurate. We need both.

  If we simply tweak the formula, we invite researchers to game the new weights. If we simply return to narrative review, we invite the return of bias and opacity. By using the CRIS as a triage tool rather than a verdict, we acknowledge the legitimate need for accountability while respecting the complex, human nature of discovery.

  I move that we adopt the Two-Channel Calibration Model for the 2024 cycle, with a mandate to review the efficacy of this hybrid approach before making any long-term tenure policy changes.

  Respectfully,

  [Your Name]
  Professor of Physics, Emeritus
  Task Force Member
