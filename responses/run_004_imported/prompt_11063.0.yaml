      *   **Penrose's Specific Twist:** Penrose argues that because we *can* see the truth, we *must* be non-computational. He accepts the consistency hurdle but argues our ability to perceive mathematical truth implies we aren't formal systems. Lena is treating the mind as a formal system to refute him, which begs the question.

