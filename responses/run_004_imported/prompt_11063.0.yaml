      *   **Critics:** Putnam, Benacerraf, Chalmers, McCullough. The consistency objection is the standard rebuttal.
      *   **Verdict:** The coworkers are surprisingly accurate to the actual philosophical debate. They haven't wandered into weeds; they are reenacting the 1960s-90s analytic philosophy circuit.

