prompt: |-
  So I was at dinner saturday and my friend Jess and her housemate Marco got into this whole 40 minute argument about split-brain patients, and now I need someone to actually referee it because I think they both scored real points and neither one budged.

  Jess's opening: the classic Sperry/Gazzaniga split-brain experiments prove that cutting the corpus callosum literally produces two separate conscious minds sharing one skull. Her example was the one where they flash a chicken claw to the left hemisphere and a snow scene to the right hemisphere — the left hand (run by the right hemisphere) points to a shovel, the right hand points to a chicken, and when you ask the patient why, the talking left hemisphere confidently invents a reason for the shovel-pick it never actually saw the cause of. She said that's not just "two systems," that's a second subject of experience caught mid-confabulation.

  Marco pushed back with something he half remembered from undergrad — that split-brain patients retested more recently (2017ish?) could still judge whether shapes matched or track something moving across both sides of their visual field, which the classic two-minds story says shouldnt be possible without an intact callosum. He said the better model is "one conscious agent stuck with fragmented, disorganized perception," not two little people, and that Jess was just reciting 1970s textbook neuroscience.

  Jess said fine, the new data's real, but "one agent with fragmented perception" is doing a ton of unexplained work — if each hemisphere can independently notice something, decide on it, and act on it while the other has zero clue, calling that "one agent" instead of "two agents" sounds like a word game, not an actual discovery.

  Marco's next move: there's apparently a middle position where consciousness never runs as two simultaneous streams at all, but instead switches, fully and rapidly, between whichever hemisphere is task-relevant — which would explain the old dissociation results (the "other" hemisphere just isn't consciously online at that moment) without needing two experiencers at once.

  Jess's last word was that if it can switch that completely, that fast, between two chunks of cortex with zero ongoing communication, she doesn't see what work "one" consciousness is even doing anymore versus two minds taking very disciplined turns — and that the switching idea sounds designed purely to rescue the unity assumption, not like something anyone found evidence for.

  Can you referee this properly — go through it move by move and say who had the stronger case at each point, not just who "won" overall — and flag anything you think both of them are still missing?
