  **MEMORANDUM**

  **TO:** Honorary Degree Committee
  **FROM:** [Your Name], Alumni Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Class of 1974 Nominee

  **Recommendation**
  After reviewing the nomination packet and the ethical objections raised, I recommend we **decline to advance this nomination** in its current form. While the nominee's achievement in ending a fifteen-year conflict is undeniable, granting an honorary degree constitutes a moral endorsement that conflicts with the University's foundational values when scrutinized through the ethical framework provided by Professor Anscombe's *Mr. Truman's Degree*.

  **Analysis of Anscombe's Argument**
  Professor Anscombe's opposition to Truman's degree was not based on retrospective legalism or utilitarian calculation (i.e., whether the bombs "worked"). Her argument was deontological: it is inherently impermissible to intentionally kill the innocent as a means to an end, regardless of the goodness of that end. She argues that when a leader authorizes the mass destruction of civilian life to force a political outcome, they commit murder, and the University becomes complicit if it honors them.

  The structural parallel to our nominee is precise. By his own admission, he targeted irrigation, power, and grain not to degrade enemy combatants, but to make civilian life "unsustainable." This admits the civilian suffering was not merely collateral damage; it was the *mechanism* of victory. Under Anscombe's reasoning, the intention to leverage civilian hardship breaks the moral prohibition against targeting the innocent, regardless of the war's justness.

  **Addressing Committee Objections**
  Two counter-arguments have been raised that I find insufficient under this framework:

  1.  **Bureaucratic Distance:** The claim that the nominee "only signed a strategy" several layers removed from actual deaths does not absolve moral agency. Anscombe explicitly rejects the dilution of responsibility through chain-of-command. The order originated with him; the causal chain is unbroken by administrative intermediaries.
  2.  **Utilitarian Defense:** The argument that "the numbers came out favorably" (18 months vs. 10 years) is exactly the reasoning Anscombe rejects. She contends that one cannot do evil that good may come. A legal review finding the actions "proportionate" under laws of armed conflict addresses legality, not morality. The University's honorary degrees recognize moral and intellectual leadership, not merely legal compliance or effective realpolitik.

  **Institutional Integrity**
  Granting this degree signals that the University endorses the *method* of peace-making, not just the peace itself. If we proceed, we validate the principle that civilian suffering is a permissible tool of statecraft when the math works out. This risks alienating faculty and students who view the University as a guardian of ethical reasoning, not just a validator of power.

  **Conclusion**
  We can acknowledge the nominee's historical significance without honoring him. I propose we decline the nomination but invite the nominee to participate in a future symposium on conflict resolution, where his strategies can be studied critically rather than celebrated uncritically. This preserves our integrity without erasing history.

  **Action Required:** Vote to Decline.
