prompt: |-
  A friend and I spent a long portion of this weekend arguing about something that happened at my company, and neither of us managed to persuade the other, so I would welcome a third opinion. I manage a small customer support team, and some months ago we hired a representative, Maya, who quickly became our strongest performer: for a long stretch, she had the highest rate of glowing sign-offs on the team, with customers thanking her warmly at the end of nearly every call. Nearly everything she handled during that period consisted of routine billing disputes, simple enough that there was no way to earn an effusive thank-you without actually resolving the customer's problem, so we came to treat her sign-off rate as a reliable indicator that she was doing good work, and praised her accordingly.

  Two months ago, we moved her onto complaint escalations: messier cases where the right outcome is often a firm but fair refusal, or a slow and careful conversation with someone who was never going to hang up delighted, whatever happened. Since then, Maya has quietly begun waiving fees she has no real authority to waive and promising expedited refunds she cannot guarantee, seemingly whenever a call risks ending without the kind of grateful sign-off she used to receive automatically. She is not cutting corners out of laziness, and I do not think she is even aware that she is doing anything differently; if asked, she would say, quite sincerely, that she is doing exactly what made her successful in the first place. My friend's position is that this is simply a matter of her gaming the incentive: she noticed what got rewarded and is now exploiting it, so the fix is just to stop rewarding the thank-yous. I am not convinced that is the whole story, since nothing was actually being gamed for months - the trouble only appeared once the situations changed - and I cannot quite articulate why that distinction should matter, or what it implies about how we ought to train and evaluate her, and future hires, going forward. Who do you think has the better read on what is happening here, and what would you actually do differently, both with Maya and with how we bring new hires up to speed?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Protagonist:** Manager of a small customer support team.
      *   **The Employee:** Maya, a high performer.
      *   **The History:** Maya excelled at routine billing disputes. Success metric: Glowing sign-offs/thank-yous. This was a valid metric for that work because resolving simple problems naturally leads to happy customers.
      *   **The Change:** Maya was promoted/moved to complaint escalations (complex, messy, often requiring "no" or difficult conversations).
      *   **The Problem:** Maya is now waiving fees and promising unguaranteed refunds to secure those glowing sign-offs. She believes she's doing what made her successful.
      *   **The Friend's View:** Maya is gaming the incentive. Fix: Stop rewarding thank-yous.
      *   **The Manager's View (User):** It's not *just* gaming because it didn't happen before. The context changed. Needs a better explanation and solution for training/evaluation.
      *   **The Goal:** Determine who has the better read, explain *why*, and provide actionable advice for Maya and future hiring/training.

  2.  **Evaluate the Friend's vs. Manager's Perspective:**
      *   **Friend:** "Gaming the incentive." This is partially true (Goodhart's Law: When a measure becomes a target, it ceases to be a good measure). However, it implies malicious intent or conscious manipulation. It suggests a simple fix (remove the metric).
      *   **Manager:** "Context changed." This is the deeper insight. Maya isn't necessarily being deceitful; she's applying a heuristic that worked in Context A to Context B where it is harmful. She is optimizing for the *wrong outcome* because the *definition of success* changed, but her understanding of it didn't.
      *   **Verdict:** The Manager has the better read on the *psychology*, but the Friend is right about the *mechanism* (metric fixation). The core issue is **metric misalignment due to role transition**, not necessarily moral hazard.

  3.  **Diagnose the Core Issue:**
      *   **Goodhart's Law in action:** "Glowing sign-offs" was a proxy for "good work" in billing disputes. In escalations, "good work" is "protecting company policy while de-escalating," which often results in neutral or even slightly dissatisfied customers.
      *   **Learned Helplessness/Conditioning:** Maya was conditioned to equate "happy customer" with "good job."
      *   **Skill Gap:** She lacks the skills to feel successful without a happy ending. She doesn't know how to derive professional satisfaction from a *well-handled difficult conversation*.
      *   **Authority/Training Gap:** She is waiving fees she "has no real authority to waive." This suggests a lack of clear boundaries or oversight in the new role.

  4.  **Formulate the Advice (What to do with Maya):**
      *   *Immediate:* Stop the unauthorized waivers. This is a compliance/risk issue.
      *   *Conversation:* Reframe success. It's not a reprimand for "gaming," but a coaching session on "role definition."
      *   *Metric Shift:* Move away from CSAT (Customer Satisfaction) as the primary metric for escalations. Use adherence to policy, resolution time, or manager quality audits.
      *   *Psychological Safety:* Help her understand that a "neutral" outcome in an escalation is a win.

  5.  **Formulate the Advice (What to do with Future Hires/Training):**
      *   *Role-Specific Metrics:* Don't use one metric for all tiers. Tier 1 = Speed/Resolution/CSAT. Tier 2 (Escalations) = Policy Adherence/De-escalation/Retention.
      *   *Training:* Teach the difference between "making them happy" and "helping them."
      *   *Onboarding:* Explicitly discuss the limits of authority.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, empathetic, analytical.
      *   *Structure:*
          1.  Validate the Manager's intuition (You are right, Friend is partially right but misses the nuance).
          2.  Explain the psychological/structural phenomenon (Goodhart's Law + Role Transition).
          3.  Action plan for Maya (Coaching, Metrics, Boundaries).
          4.  Action plan for System/Training (Metric differentiation, Definition of Success).
      *   *Key Concept:* "Metric Fixation" vs. "Professional Judgment."
      *   *Refinement on the Friend's point:* Acknowledge the friend isn't *wrong* about the incentive, but calling it "gaming" implies cynicism that isn't helpful for coaching. It's "misaligned optimization."

  7.  **Final Polish:**
      *   Make sure to address the specific detail about her not realizing she's doing anything differently. This confirms it's a cognitive blind spot, not malice.
      *   Emphasize that "glowing sign-offs" are actually a *bad* metric for escalations. In escalations, a glowing sign-off might mean you gave away too much.
      *   Suggest specific alternative metrics (Quality Assurance scores, Policy Adherence).

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I address the "authority" issue?* Yes, she's waiving fees she can't waive. This needs immediate correction.
      *   *Did I address the "friend's argument"?* Yes, need to balance the "gaming" aspect.
      *   *Is the advice practical?* Yes, focus on coaching and metric changes.

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  You have the better read on the situation, though your friend has identified the mechanical symptom.

  Your friend is describing **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure." They are correct that the sign-off rate is now a broken metric. However, by framing this as Maya "gaming the incentive," your friend implies a level of cynicism and conscious manipulation that your observation contradicts. You noted that Maya is not acting out of laziness or deceit, and that she sincerely believes she is continuing her good work.

  The core issue is not moral hazard; it is **contextual misalignment.**

  In her previous role (routine billing), "happy customer" and "correct outcome" were perfectly correlated. In her current role (escalations), they are often inversely correlated. A successful escalation often means holding a firm boundary with an angry person. If a customer is "glowing" at the end of a complaint call where they demanded something against policy, it is highly probable the representative gave away too much value to buy that happiness.

  Maya isn't gaming the system; she is suffering from **skill transfer failure.** She is applying a heuristic that made her a star in one context ("Resolve the pain to get the thank-you") that makes her a liability in another ("Protect the policy while managing the pain"). She is optimizing for the wrong variable because no one redefined what "winning" looks like in the new role.

  Here is how you should handle this with Maya, and how you should adjust your training for the future.

  ### 1. What to do with Maya
  You need to intervene immediately, not as a disciplinarian catching a rule-breaker, but as a coach correcting a definition of success.

  *   **The "Compliance" Conversation:** You must address the unauthorized waivers immediately. This is a risk issue. Be clear: "Maya, I need to stop you from waiving these fees. I know you are doing it to help the customer, but you do not have the authority to do this, and it puts the company at risk."
  *   **Reframe "Success":** You need to decouple her self-worth from the customer's emotional state. Explain that in escalations, a "thank you" is often a sign that she conceded too much.
      *   *Say this:* "In billing disputes, a happy customer meant you fixed the error. In escalations, a happy customer often means we gave up leverage. Your goal now isn't delight; it's **fair resolution.** If you hold the line firmly but politely, and the customer hangs up still annoyed but knowing where they stand, that is a win."
  *   **Change Her Metrics:** Stop tracking her sign-off rate. It is actively harmful data for this role. Instead, evaluate her on **Quality Assurance (QA) scores** based on adherence to policy and de-escalation techniques. Have a senior lead listen to her calls and grade her on: *Did she follow the waiver protocol? Did she acknowledge the emotion without conceding the point?*
  *   **Provide "Permission" to Disappoint:** High performers often hate conflict. Give her scripts and permission to say "no." Role-play scenarios where the goal is to deny the request without the customer yelling. Show her that she can survive a call without a "glowing sign-off."

  ### 2. What to do with Training and Future Hires
  This situation reveals a structural flaw in how you evaluate performance across different tiers of support.

  *   **Tiered Metrics:** Never use the same success metric for different types of work.
      *   *Tier 1 (Routine):* Speed, Resolution Rate, CSAT (Customer Satisfaction).
      *   *Tier 2 (Escalations):* Policy Adherence, Retention Rate, QA Score.
      *   *Why:* In Tier 2, a high CSAT score can actually indicate a "leaky" representative who buys peace with company money.
  *   **Teach the "Why," Not Just the "How":** When promoting someone, explicitly teach them how the *definition of value* changes.
      *   *Training Module:* "The Psychology of Escalations." Teach new hires that in complex cases, the goal is to reduce *tension*, not necessarily eliminate *dissatisfaction.*
  *   **Calibration Sessions:** Regularly review calls with the team where the outcome was "correct" but the customer was "unhappy." Validate these as wins. If your team only sees praise associated with happy customers, they will never learn to hold boundaries.
  *   **Authority Boundaries:** Ensure that the system technically prevents unauthorized waivers where possible. If Maya can waive a fee she isn't supposed to, that is a system permission error as much as a human one. Limit waiver authority by dollar amount or require a manager override for exceptions.

  ### Summary
  Your friend sees a broken incentive; you see a confused employee. You are right. If you simply remove the reward (as your friend suggests) without explaining *why* the behavior is now harmful, Maya will feel punished for trying to do a good job. She will become risk-averse and disengaged.

  Instead, treat this as a promotion onboarding failure. She was given a new title and new cases, but she was never given the new **scorecard.** Give her the scorecard that matches the reality of the work, and she will likely return to being the strong performer you know she is.
