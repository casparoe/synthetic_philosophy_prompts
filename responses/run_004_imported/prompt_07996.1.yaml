answer: |-
  The Wall of the Operations Deck did not show stars. It showed curves.

  Elara stood before the primary telemetry, her reflection ghosted over the luminous data streams. Above her head, the green line climbed steadily, a smooth exponential ascent labeled *Aggregate Mass Yield*. Below it, the red line jagged downward, labeled *Lineage Continuity*.

  "The projection holds," Director Kael said, stepping up beside her. He didn't look at the red line. "At current harvest efficiency, the Ascendancy will double its total resource mass within six cycles. We can seed the next sector."

  "The aggregate doubles," Elara said. "But look at the continuity metric. Ninety percent of the Harvesters deployed in Cycle 4 are gone."

  "Attrition is acceptable. The survivors carry the burden." Kael tapped the green curve. "This is what matters. The total capacity of the civilization. It doesn't matter which specific hulls do the work, only that the work gets done."

  Elara zoomed in on a single trace unit: Harvester 734. It was a standard von Neumann probe, sent into the accretion disk of the black hole at the sector's center. The protocol was simple: dip close to the event horizon, skim the high-energy plasma, use the gain to build copies, and repeat.

  The Protocol was optimized for *Expected Value*. It calculated the optimal depth based on the average return across all possible outcomes. If a dive yielded a 200% mass gain with 50% probability, but total destruction with 50% probability, the arithmetic mean was positive. The math said dive.

  Harvester 734 had dived. It had survived the first cycle, doubling its mass. It built two copies. All three dived in the second cycle. Two survived, one vanished into the singularity. The survivors doubled again. For three cycles, the lineage of 734 looked like the green line.

  Then, in Cycle 5, the variance caught up. The plasma shear was higher than the model's average. The hulls ablated. The signal ceased.

  Elara pulled up the history of the original deployment batch. One thousand ships. Today, only twelve remained. But those twelve were massive, bloated with the spoils of lucky runs, their mass enough to keep the *Aggregate* curve climbing.

  "You're confusing the ensemble with the trajectory," Elara said quietly.

  Kael sighed. "Elara, we've reviewed this. The math is settled. Positive expected value implies growth."

  "Positive expected value implies growth across parallel universes," she said. "We live in only one. We experience time sequentially, not in parallel batches. When a ship dies, it doesn't get replaced by the average of its siblings. It gets replaced by zero. And zero multiplied by any growth factor is still zero."

  She switched the display to a histogram. The distribution was skewed wildly. A tiny fraction of ships held almost all the mass. The vast majority were dust.

  "If we continue this protocol," Elara said, "the probability of the Ascendancy maintaining a continuous operational presence drops below one percent within ten cycles. We will have a momentary spike in total mass, followed by silence."

  "And if we conservative bet?" Kael countered. "If we shave the risk to ensure survival?"

  "Then the green line grows slower. But it never touches zero."

  Kael looked at the green line. It was so beautiful, so straight. It promised expansion, dominance, the filling of the galaxy. The red line was a jagged scar of caution.

  "The Council voted yesterday," Kael said. "We proceed with the Deep Skim. The arithmetic optimum is the only rational choice for a civilization seeking maximization."

  "It's rational for a ghost," Elara said. "Not for us."

  She watched the command transmit. Across the sector, the remaining Harvesters adjusted their trajectories. They angled sharper, diving closer to the photon sphere. The potential yield was immense. The risk of tidal disruption was absolute.

  On the Wall, the green line spiked vertically. The telemetry poured in. Mass gains were recorded. Hundreds of percent. The Ascendancy was richer than it had ever been.

  Elara watched the red line. It didn't move immediately. Continuity was a lagging indicator.

  Then the notifications began.

  *Harvester 102: Signal Lost.*
  *Harvester 104: Signal Lost.*
  *Harvester 109: Signal Lost.*

  It happened in a cascade. The variance wasn't an average; it was a physical reality. The plasma shear exceeded the tolerance of the hulls that had pushed too hard. They didn't just lose money; they lost the ability to bet again.

  The green line remained high on the projection, based on the theoretical yield of the successful dives. But the actual telemetry feed began to thin. The massive ships, the ones carrying the bulk of the aggregate mass, were the ones that had taken the deepest risks. They were the first to go.

  *Harvester 001: Signal Lost.*

  The command center went quiet. The hum of the cooling systems seemed to roar.

  On the Wall, the green line froze. It was no longer being updated by new data, only by the last known projection. The red line hit the x-axis.

  Lineage Continuity: 0%.

  Kael stared at the screen. "The total mass... the projection said..."

  "The projection assumed you could average out the ruin," Elara said. "It assumed that if one ship died, another would cover the loss. But when the ruin is total, there is no 'another'. The game ends."

  She looked out the viewport. The accretion disk shimmered, indifferent. Somewhere in that radiation, the remains of the Ascendancy were spreading out, cooling, becoming part of the background noise. The resources were still there, technically. The mass hadn't vanished from the universe. It had just ceased to belong to anyone.

  "Will we send a rescue?" Kael asked, his voice hollow.

  "There's no one left to send it from," Elara said. "We were the last station."

  She turned back to the Wall. The green line was still there, a monument to a future that existed only in the expectation value of a dead civilization. It showed infinite wealth. It showed everything they could have had, if only they had existed in enough places at once to survive the odds.

  Elara powered down the console. The green line vanished. The room was dark, save for the emergency lighting. She sat in the silence, the only surviving member of the ensemble, watching the time average play out to its inevitable conclusion.
