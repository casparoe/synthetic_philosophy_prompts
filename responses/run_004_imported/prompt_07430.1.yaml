      *   *Decision:* Recommend the "Reasonable & Responsible Verification" standard (Justified Belief).
      *   *Why:* It balances accuracy with agility. It protects reporters who do the work but get unlucky (Incident 1 scenario) while holding accountable those who skip steps (Incident 2 scenario).

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the recent incidents and the stakes (credibility vs. competitiveness).
      *   **The Core Question:** Define the assertion norm clearly.
      *   **Evaluation of Options:** Briefly summarize the three camps, giving weight to the counterarguments (as requested).
      *   **Recommendation:** State the chosen standard clearly.
