answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation: Standard for Assertion and Verification Tiers

  **Executive Summary**

  Following the recent coverage of the state senator's campaign finance violations and the school superintendent's records dispute, this committee faces a critical question: What constitutes sufficient evidence for a reporter to state a claim as flat fact ("X did Y") versus hedged attribution ("Sources say X did Y")?

  We currently operate with three competing intuitions:
  1.  **Certainty:** Only assert what you could defend under oath.
  2.  **Accuracy:** Assert what turns out to be true; judge by outcome.
  3.  **Process:** Assert what is reasonable based on verified evidence at the time; judge by methodology.

  This memo recommends adopting the **Process Standard (Option 3)** as our house rule, implemented with a defined tiered system for assertion and a six-month trial period. This approach best balances our duty to be accurate with our duty to be timely, protecting reporters who do the work while minimizing reputational risk.

  **The Debate: Weighing the Standards**

  To draft a workable policy, we must acknowledge the strengths and weaknesses of the three positions currently dividing this committee.

  *   **The "Under Oath" Standard (Knowledge):**
      *   *Argument:* This minimizes corrections and legal liability. If a reporter isn't sure, they shouldn't print it.
      *   *Risk:* As seen in the senator fundraising case, this leads to excessive hedging ("alleged," "documents suggest") even when the evidence is overwhelming. It cedes scoops to rivals willing to take calculated risks and erodes reader trust by making us sound timid.
  *   **The "Outcome" Standard (Truth):**
      *   *Argument:* Readers care about what is true, not how we got there. If we get it right, we should be free to state it flatly.
      *   *Risk:* This judges reporters by hindsight. A reporter can follow every verification step and still be misled by a sophisticated liar (as nearly happened with the superintendent). Punishing good process that yields bad luck discourages enterprise reporting.
  *   **The "Reasonable Verification" Standard (Justified Belief):**
      *   *Argument:* Journalism is a discipline of verification, not omniscience. If a reporter follows a rigorous process that would lead a reasonable editor to believe the claim, they should be empowered to state it as fact, even if a correction is later required.
      *   *Risk:* It requires nuanced editorial judgment rather than a bright-line rule, which can lead to inconsistency during the learning curve.

  **Recommendation: The "Reasonable Verification" Standard**

  I recommend we adopt the third standard. In epistemological terms, we are prioritizing *justification* over *infallibility*. In newsroom terms: **We judge the reporting process, not just the headline.**

  If a reporter has done the work required to make a claim reasonable *at the time of publication*, they are cleared to state it as fact. If new information later proves them wrong, it is treated as an unfortunate error, not a procedural failure. Conversely, if they state a claim as fact without meeting the verification threshold, it is a standards violation, even if the claim happens to be true.

  **Implementation: Three Tiers of Assertion**

  To make this actionable, reporters need concrete language options. We should codify three tiers of assertion. Editors and reporters must agree on the tier during the copy-editing process.

  **Tier 1: Flat Assertion (Fact)**
  *   **Standard:** Requires two independent sources *plus* documentary evidence OR one high-level on-the-record source with corroborating documentation. The reporter must have offered the subject a meaningful opportunity to respond.
  *   **Language:** Direct statement.
  *   **Example:** *"Senator Smith violated campaign finance law by funneling donor money to personal accounts."*
  *   **Use Case:** The Senator fundraising story. We had the documents. We should have used Tier 1.

  **Tier 2: Attributed Finding (Strong Attribution)**
  *   **Standard:** Based on a single confidential source with direct knowledge, OR documentary evidence that is authentic but not yet fully contextualized. The evidence is strong, but we lack the second source or the subject's comment.
  *   **Language:** Attribution to the evidence or source, not the newsroom.
  *   **Example:** *"According to campaign finance documents reviewed by this newspaper, Senator Smith funneled donor money to personal accounts."* OR *"A senior campaign official stated that Senator Smith funneled donor money..."*
  *   **Use Case:** When we have the "smoking gun" doc but haven't confirmed the intent with a second human source.

  **Tier 3: Allegation/Scrutiny (Developing)**
  *   **Standard:** Based on multiple indirect sources, rumors, or filings that suggest wrongdoing but do not prove it. Or, when the subject denies the claim and we lack documentary proof.
  *   **Language:** Hedged verbs, focus on the accusation rather than the act.
  *   **Example:** *"Senator Smith is facing accusations that he funneled donor money..."* OR *"Investigators are examining whether Senator Smith funneled donor money..."*
  *   **Use Case:** The Superintendent records story. We had one source. We lacked the timeline verification. This should have been Tier 3 until the timeline was confirmed.

  **Trial Period and Review**

  I recognize that shifting to a Process Standard requires a cultural adjustment. To address concerns about consistency, I propose the following:

  1.  **Six-Month Trial:** This policy goes into effect immediately as a provisional standard for six months.
  2.  **Standards Log:** For any story where Tier 1 (Flat Assertion) is challenged by an editor but published anyway, the Managing Editor will log the justification.
  3.  **Review Trigger:** We will reconvene this committee in six months, or immediately following any major correction resulting from a Tier 1 assertion. We will review the "Standards Log" to see if the threshold is being applied consistently or if it is being abused to rush stories.

  **Addressing Concerns**

  For those concerned that the **Process Standard** is too soft: This policy does not excuse being wrong. It excuses being *honestly mistaken despite diligence*. If a reporter asserts a fact (Tier 1) based on a single source who lied to them, we will still run a correction. The difference is that the reporter is not disciplined for a standards violation if their verification log shows they took reasonable steps to vet that source.

  For those concerned that the **Certainty Standard** is too rigid: We are not lowering the bar for truth; we are clarifying the bar for *assertion*. If you cannot meet the Tier 1 checklist, you are not forbidden from publishing—you are simply required to use Tier 2 or Tier 3 language. This allows us to publish scoops without over-promising certainty we don't possess.

  **Next Steps**

  I request we vote on adopting the "Reasonable Verification" standard with the three-tier language guide attached. If approved, I will draft a one-page checklist for reporters to attach to stories requiring Tier 1 assertion.

  Thank you for your consideration.
