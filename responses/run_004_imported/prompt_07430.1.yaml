          *   Camp 2 (Truth/Hindsight): Unfair to reporters, discourages risk.
          *   Camp 3 (Justification/Reasonableness): Focuses on *process*.
      *   *Recommendation:* Adopt the "Process-Based Verification" standard (Camp 3).
      *   *Addressing Counterarguments:*
          *   To Camp 1: Acknowledge we need high confidence, but "under oath" paralyzes enterprise reporting.
          *   To Camp 2: Acknowledge truth matters, but judging by outcome alone ignores good journalism that hits bad luck.
      *   *The Tiers (Crucial Requirement):* Need specific phrasing.
          *   Tier 1 (Flat Fact): "The Senator violated the law." (Requires multiple independent sources + docs).
          *   Tier 2 (Attributed/Strong): "Documents show..." or "According to..." (Shifts burden slightly to source/doc).
          *   Tier 3 (Allegation/Developing): "Accusations suggest..." or "Is facing scrutiny..." (When evidence is thin or contested).
      *   *Trial Period:* 6 months seems reasonable. Review after 3 major incidents or 6 months.
      *   *Tone Check:* Needs to be collaborative, not dictatorial. Use "we" instead of "I" where possible, though it is *my* memo.

  5.  **Refining the Content (Self-Correction during drafting):**
