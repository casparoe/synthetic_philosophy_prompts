          6.  Requirements to Escape (The "Missing Link").

  7.  (Final check of specific claims): Breiman's theorem requires i.i.d. returns. Peters often discusses non-ergodic processes. Samuelson's 1971 paper "The Fallacy of Large Numbers." Make sure to reference the distinction between *maximizing growth* and *maximizing utility of terminal wealth*.

      *   *Wait, one nuance:* Peters claims to derive utility from dynamics. Samuelson says you can't derive 'ought' from 'is'. To escape, Peters needs to show that *any* rational agent *must* care about the time average. Why? Because the time average is the only observable for a single agent. But an agent might care about the ensemble average if they can hedge or sell the gamble. *Ah, that's a key point.* Market completeness vs. idiosyncratic risk. If markets are complete, ensemble averages matter (pricing). If incomplete/idiosyncratic, time averages matter. I should mention market context.

