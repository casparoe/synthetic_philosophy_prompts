answer: |-
  This is a sophisticated dispute that cuts to the core of how we define rationality in economics: is it a matter of **axiomatic consistency of preferences** (the Samuelson/vNM tradition) or **dynamic stability and survival** (the Kelly/Peters tradition)?

  As a PhD student, you likely recognize that the mathematical equivalence between maximizing the time-average growth rate and maximizing expected log utility is indisputable. The conflict is entirely normative and ontological.

  Here is a pressure test of the argument, comparing the positions directly, assessing the validity of Samuelson's critique, and outlining what is required to salvage the ergodicity claim as a foundational norm.

  ---

  ### 1. The Core Positions

  **The Ergodicity Economics Position (Peters, Gell-Mann, et al.)**
  *   **Ontology:** Economic variables (wealth) follow multiplicative dynamics. For a single agent, the ensemble average (expected value) is physically unobservable and irrelevant. The only observable is the time-average trajectory.
  *   **Mechanism:** In multiplicative processes, the time average of wealth growth is the geometric mean. By taking the logarithm, the process becomes additive and ergodic. The time-average growth rate is $\lim_{T\to\infty} \frac{1}{T} \sum \ln(1+r_t) = E[\ln(1+r)]$.
  *   **Norm:** Rationality is defined as optimizing the observable dynamic. Since the time-average growth rate is the only relevant metric for a persisting agent, maximizing it is not a preference but a physical necessity of the environment.

  **The Samuelson Position (1971, "The Fallacy of Large Numbers")**
  *   **Ontology:** Rationality is defined by the consistency of preferences over gambles, regardless of repetition.
  *   **Mechanism:** If an agent does not maximize expected log utility in a single shot, they should not maximize it in $N$ shots. Repetition does not alter the utility function. The fact that the log-optimal strategy dominates asymptotically (Breiman) is irrelevant if the agent has a finite horizon or a utility function where marginal utility diminishes faster than logarithmic (e.g., $U(W) = -W^{-1}$).
  *   **Norm:** Maximizing geometric mean is mathematically identical to maximizing expected log utility. Therefore, adopting it requires justifying log utility. Claiming it is "dynamic rationality" is simply smuggling log utility in under a different name.

  ---

  ### 2. Direct Comparison: Does Samuelson's Charge Survive?

  **Verdict:** Samuelson's charge survives **intact regarding preference theory**, but the ergodicity argument successfully challenges the **universality of the expected value operator**.

  Here is the breakdown of why Samuelson wins the technical debate but loses the rhetorical high ground on dynamics.

  #### A. The Mathematical Identity (Samuelson Wins)
  Samuelson is mathematically correct that the time-average growth rate of wealth is exactly the expectation of the logarithm of wealth returns.
  $$ \bar{g} = \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) = E[\ln(1+r)] $$
  If you tell Samuelson, "I am not maximizing utility, I am maximizing time-average growth," he replies, "You are maximizing $E[\ln W]$. That *is* log utility."
  Unless the ergodicity defender can explain why an agent *ought* to care about the time average more than the ensemble average without invoking a preference for growth, they have not escaped the utility framework. They have simply selected a specific utility function ($\log$) and claimed it is objective.

  #### B. The "Goal" Specification (The Weak Point of Ergodicity)
  Samuelson's deepest critique is that **maximizing wealth is not the only rational goal.**
  *   An agent might prioritize minimizing the probability of falling below a subsistence level (Safety First).
  *   An agent might have a finite horizon (e.g., retirement date) where asymptotic dominance (Breiman's theorem) is irrelevant.
  *   An agent might care about *relative* consumption rather than absolute wealth accumulation.

  Peters' argument assumes the objective is "maximize the long-run growth rate of wealth." Samuelson asks: *Why?* If the answer is "because wealth is good," Samuelson asks: "How good?" If the answer is "logarithmically good," then you have admitted utility theory. If the answer is "because otherwise you go broke," Samuelson notes that fractional Kelly also avoids ruin, so full Kelly is not uniquely justified by survival alone.

  #### C. The Ergodic Advantage (Where Peters Gains Ground)
  However, Peters does succeed in highlighting a flaw in standard Expected Utility (EU) theory: **the implicit assumption of ensemble replicability.**
  Standard EU treats a gamble as if it can be hedged or insured across an ensemble of parallel universes. In many macroeconomic or idiosyncratic investment contexts, this is false. There is only one time path.
  *   **Samuelson:** Assumes the agent can evaluate the gamble using $E[\cdot]$.
  *   **Peters:** Argues that for non-ergodic processes, $E[\cdot]$ yields misleading prescriptions (e.g., the St. Petersburg paradox or leverage leading to ruin).

  Peters shows that if you accept the **dynamics** as binding constraints, the *only* utility function consistent with non-ruin and maximal growth is log utility. He derives the utility function from the process dynamics, whereas vNM posits the utility function exogenously.

  ---

  ### 3. Justification of the Verdict

  Samuelson's charge holds because the ergodicity argument **cannot derive an 'ought' from an 'is' without a hidden premise.**

  The hidden premise is: *A rational agent must prioritize the asymptotic time-average growth rate above all other statistical properties of the wealth distribution.*

  This premise is not a law of physics; it is a preference. An agent could rationally prefer a strategy with a lower geometric mean but a higher arithmetic mean if they plan to consume early or exit the market. An agent could prefer a lower geometric mean if it reduces volatility drag on their specific consumption utility.

  Therefore, the ergodicity argument does not ground "geometric rationality" as a **universal norm**. It grounds it as the **optimal strategy for a specific objective**: long-run capital accumulation in a non-ergodic environment without intermediate consumption. Samuelson is correct that this is just a specific slice of utility theory, not a replacement for it.

  ---

  ### 4. How to Escape the Charge: Requirements for a Defender

  If you wish to build a term paper defending geometric rationality against Samuelson, you cannot rely solely on the mathematical identity of time averages and log expectations. You must attack the axioms of Expected Utility or refine the definition of rationality.

  To escape Samuelson's charge, a defender of geometric rationality must add one of the following three arguments:

  #### A. The "Survival as Prerequisite" Argument (Evolutionary Rationality)
  You must argue that **agency requires survival.**
  *   **Argument:** Preferences are irrelevant if the agent ceases to exist. In a multiplicative world, any strategy with a negative expected log growth rate leads to $W \to 0$ with probability 1. Any strategy with a lower positive log growth rate will be asymptotically dominated (wealth ratio $\to 0$) relative to the Kelly strategy.
  *   **Escape:** This shifts rationality from *preference satisfaction* to *selection pressure*. If we define rationality as "strategies that persist in the population," then log-optimality is uniquely selected (as argued by Blume & Easley, 1992).
  *   **Requirement:** You must explicitly reject vNM rationality in favor of **evolutionary stability**. You must concede that this applies to populations or long-horizon survivors, not necessarily a single individual with a finite horizon.

  #### B. The "Dynamic Consistency" Argument
  You must argue that standard EU violates **dynamic consistency** in multiplicative settings.
  *   **Argument:** If an agent maximizes $E[W_T]$ (linear utility), they will accept gambles that lead to almost sure ruin as $T \to \infty$. A strategy that leads to ruin is dynamically inconsistent with the goal of remaining an economic agent.
  *   **Escape:** Show that log utility is the *only* utility function that is myopically optimal in a dynamic multiplicative setting without requiring look-ahead optimization. (Mossin, 1968).
  *   **Requirement:** You must demonstrate that any other utility function requires knowledge of the terminal time $T$ to be optimal, whereas log utility is optimal for *any* horizon. This makes log utility "time-consistent" in a way others are not.

  #### C. The "Observable Information" Argument (Information Theory)
  You must argue that the ensemble average is **epistemically inaccessible**.
  *   **Argument:** Samuelson's EU requires knowledge of the true probability distribution to calculate $E[U(W)]$. In reality, agents only observe their own time series. The time-average is the only estimator available to the agent.
  *   **Escape:** Under Knightian uncertainty or limited data, maximizing the time-average growth rate is the robust control solution (related to Cover's Universal Portfolio).
  *   **Requirement:** You must move the debate from **Risk** (known probabilities) to **Uncertainty** (unknown probabilities). In a risk setting, Samuelson wins. In an uncertainty setting, the ergodicity argument gains traction because the ensemble average is a theoretical construct the agent cannot compute.

  ### Summary for Your Term Paper

  If you build your paper around this, your thesis should be:

  > "Samuelson is correct that ergodicity economics does not eliminate utility theory; it merely endogenizes the utility function. However, Samuelson fails to recognize that in non-ergodic multiplicative environments, **log utility is the unique function that satisfies dynamic consistency without requiring terminal boundary conditions.** Therefore, geometric rationality is not a preference, but a **constraint on admissible preferences** for any agent intending to persist indefinitely."

  **The Trap to Avoid:** Do not claim that Kelly is optimal for *everyone*. It is not. It is optimal for those whose objective is long-run survival and growth. Samuelson's critique survives for anyone whose objective is different (e.g., short-term consumption, beating a benchmark, minimizing variance). Your defense must rest on justifying why "long-run survival/growth" is the baseline definition of economic rationality, likely via an evolutionary or dynamic consistency argument.
