      *   **Task:** Identify specific passages supporting this reading for a lecture on medieval resistance theory.
      *   **Comparison:** Situate this reading relative to John Locke's right of revolution.
      *   **Underlying Issue:** The user's interpretation is highly controversial and, in the eyes of most Aquinas scholars, factually incorrect regarding the *De Regimine Principum* and nuanced in the *Sentences* commentary. The user asserts a "refreshingly unambiguous" support for universal tyrannicide, whereas the scholarly consensus is that Aquinas is much more cautious, often favoring public authority over private action.
      *   **Goal:** Provide a helpful, accurate, and scholarly response that addresses the user's request while gently correcting the potential misinterpretation without being dismissive. I need to show where the user *might* find support (the *Sentences* commentary) but also highlight the significant caveats in *De Regimine* and the broader Scholastic context.

  2.  **Fact-Check the User's Premise:**
      *   *Commentary on the Sentences (In II Sent., d. 44, q. 2, a. 2):* Aquinas does discuss whether it is permissible to kill a tyrant. He argues that if a ruler usurps power or rules tyrannically, killing him is not sedition *unless* it causes greater harm (scandal, worse tyranny). However, he often leans towards the idea that this should be done by *public authority*, not private individuals. Wait, let me recall the specific text. In the *Sentences*, he says: "To kill a tyrant... is not sedition... indeed he is more worthy of praise." *However*, he adds conditions.
      *   *De Regimine Principum (On Kingship):* This text is actually unfinished (stopped at Book I, Chapter 6 in some versions, or continued by Ptolemy of Lucca). In the authentic Aquinas sections, he is *very* cautious. He explicitly warns against private individuals killing tyrants because it often leads to greater instability or the killer becoming a tyrant himself. He prefers public action or waiting for divine intervention.
      *   *Summa Theologiae (II-II, q. 42, a. 2):* This is the mature view. He defines sedition as opposing the unity of the multitude. A tyrant disrupts unity. But does he endorse private tyrannicide? Generally, no. He suggests that if there is a right to depose, it belongs to the community or a superior authority, not a private individual.
