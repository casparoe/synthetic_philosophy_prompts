answer: |-
  This is a provocative and pedagogically rich reading, but for a lecture on medieval resistance theory, it requires careful handling. While your interpretation of the *Commentary on the Sentences* captures a genuine strand of Aquinas's early thought, the claim that *De Regimine Principum* simply restates this doctrine in support of a universal right for *any* subject is contested by most Scholastic scholars. In fact, *De Regimine* is often read as a retreat from the permissiveness of the *Sentences* toward a more cautious, public-authority model.

  To give a robust lecture, you should present the *Sentences* passage as the "radical" potential in Aquinas, but contextualize it with the caveats found in *De Regimine* and the *Summa Theologiae*. This creates a more accurate picture of the medieval tension between the duty to obey and the duty to the common good.

  Here are the specific passages to anchor your lecture, followed by a situational analysis relative to Locke.

  ### 1. The Textual Evidence

  #### A. The "Radical" Text: *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2, ad 3)
  This is the passage that supports your reading most directly. Here, the young Aquinas addresses whether killing a tyrant constitutes sedition.
  *   **The Argument:** Aquinas argues that a tyrant, by seeking his own private good rather than the common good, disrupts the unity of the multitude. Therefore, removing him is not sedition (which opposes the common good) but an act of liberation.
  *   **Key Quote:** "To kill a tyrant... is not sedition... indeed he is more worthy of praise and reward." (*Non seditio... sed magis laudandus et praemiandus.*)
  *   **The Caveat:** Even here, Aquinas adds a consequentialist constraint: unless doing so would produce greater scandal or lead to a worse tyranny.
  *   **Lecture Point:** This is your strongest evidence for the "standing right" interpretation. It grounds the right in the metaphysical status of the ruler (usurper vs. true lord) rather than a political contract.

  #### B. The "Cautious" Text: *De Regimine Principum* (On Kingship), Book I, Chapter 6
  You mentioned reading this as a restatement of the *Sentences*, but for the sake of academic rigor, you should note where it diverges. In this authentic section of the text, Aquinas is noticeably more hesitant about *private* action.
  *   **The Argument:** Aquinas asks what is to be done against a tyrant. He warns that private individuals killing tyrants often leads to greater instability, as the killer may become a tyrant himself, or the factionalism destroys the realm.
  *   **Key Distinction:** He suggests that if there is a right to depose, it belongs to the **public authority** (the community or a superior lord), not a private presumption. He cites the deposition of Domitian by the Senate as a positive example of public action, contrasting it with the assassination of Julius Caesar, which he views ambivalently due to the ensuing civil war.
  *   **Lecture Point:** Use this to show the shift from a moral-theological judgment (*Sentences*) to a prudential-political one (*De Regimine*). It complicates the "any subject whatsoever" claim.

  #### C. The Mature Synthesis: *Summa Theologiae* (II-II, q. 42, a. 2)
  In his mature work, Aquinas defines sedition as opposing the unity of the multitude.
  *   **The Argument:** While tyranny is contrary to the common good, Aquinas emphasizes that deposition should not be undertaken by "private presumption." If the community has the right to appoint the ruler, it has the right to depose him—but this is a **corporate act**, not an individual license.
  *   **Lecture Point:** This bridges the gap. It affirms the right of resistance but channels it through the *corpus mysticum* (the body politic) rather than the individual conscience.

  ### 2. Situating Aquinas Relative to Locke

  For your lecture, contrasting Aquinas with Locke clarifies the shift from medieval to modern resistance theory.

  | Feature | Aquinas (Medieval Scholasticism) | Locke (Early Modern Liberalism) |
  | :--- | :--- | :--- |
  | **Source of Authority** | **Natural Law & Teleology:** Authority is valid only if it serves the *common good* (the end of political society). A tyrant fails ontologically to be a "ruler." | **Social Contract & Trust:** Authority is derived from consent. A tyrant breaches the trust of the contract and reverts to a "state of war." |
  | **The Agent of Resistance** | **Ambiguous/Corporate:** In the *Sentences*, potentially any individual; in *De Regimine* and *Summa*, preferably public authority or the community acting as a whole. | **The People:** Locke is careful to say not "every man" on every slight, but the "People" as a collective body who judge the breach of trust. |
  | **The Mechanism** | **Judgment of Sin:** Tyranny is a sin against charity and justice. Resistance is often framed as removing an obstacle to virtue. | **Appeal to Heaven:** When legal remedies fail, the people appeal to God (revolution). It is a legalistic/forensic judgment of breach of trust. |
  | **Goal** | **Restoration of Order:** To restore the conditions for virtue and the common good. | **Preservation of Property/Rights:** To secure life, liberty, and estate which the government was instituted to protect. |

  **Key Lecture Insight:**
  Aquinas's theory is often **ontological**: The tyrant is not a true ruler, so killing him is not killing a "ruler." Locke's theory is **contractual**: The tyrant was a ruler but forfeited his status by breaking the terms.
  *   **Aquinas:** "He is not a king, so you may remove him."
  *   **Locke:** "He was king, but he fired himself by acting against the trust."

  ### 3. Recommendation for the Lecture

  If you present the "any subject whatsoever" reading as settled fact, you risk overlooking the significant Scholastic debate regarding **private vs. public authority**.

  **Suggested Framing:**
  1.  **Start with the *Sentences*:** Present your reading here. It is the most "liberationist" moment in Aquinas. It shows the logical extreme of the definition of tyranny as a corruption of dominion.
  2.  **Introduce the Tension:** Move to *De Regimine* and the *Summa*. Explain that Aquinas (and later Scholastics like Suárez and Bellarmine) grew concerned that universal private tyrannicide leads to anarchy.
  3.  **The "Inferior Magistrate" Bridge:** Mention how later Resistance Theorists (like the Calvinist Monarchomachs or John Knox) tried to solve this by arguing that "any subject" actually means "any inferior magistrate," bridging Aquinas and Locke.
  4.  **Locke Comparison:** Conclude by showing how Locke secularizes this. He keeps the right of resistance but removes the theological anxiety about "sedition" by making the *people* the ultimate sovereign, not the king.

  **Conclusion:**
  Your reading of the *Sentences* is textually defensible and makes for a compelling hook. However, situating it against the caution of *De Regimine* will make your lecture more historically robust. It allows you to show that medieval resistance theory was not a monolithic endorsement of assassination, but a complex negotiation between the demands of justice and the risks of disorder—a negotiation that Locke would later resolve by shifting sovereignty to the people.
