      *   **Addressing the *Sentences* Commentary:** Identify the specific passage (In II Sent., d. 44, q. 2, a. 2). Quote the key line about "not sedition" and "praise." *Crucial Caveat:* Note that even here, Aquinas worries about the *consequences* (scandal, worse tyranny).
      *   **Addressing *De Regimine Principum*:** This is where I need to correct the user's assumption. *De Regimine* I.6 is the key text. Aquinas argues *against* private tyrannicide here. He says it's dangerous. He suggests public authority or God. I need to point this out so the lecture is accurate.
      *   **Addressing the "Any Subject" Claim:** This is the most problematic part of the user's prompt. Scholastic theory generally distinguishes between private individuals and public magistrates. I need to mention the "inferior magistrate" theory (later developed by Calvinists/Knox) vs. private rights. Aquinas is closer to the former (or divine intervention) than the latter (universal private right).
      *   **Comparison with Locke:**
          *   *Aquinas:* Metaphysical/Teleological. Tyranny is a sin against the common good. Resistance is often a corporate/public act.
          *   *Locke:* Contractarian/Natural Rights. Tyranny is a breach of trust. The "people" (as a collective body) have the right to judge. Locke is more systematic about the *appeal to heaven* but still wary of "every man" acting on every slight.
          *   *Key Difference:* Aquinas focuses on the *ontological status* of the ruler (true ruler vs. usurper); Locke focuses on the *breach of contract*.
      *   **Recommendation for the Lecture:** Suggest a balanced approach. Use the *Sentences* for the "radical" potential, but use *De Regimine* and *Summa* to show the caution. This makes for a better lecture (showing tension/development) than a one-sided reading.

