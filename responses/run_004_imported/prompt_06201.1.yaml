      *   *Strategy:* I must acknowledge the *Sentences* passage they are likely thinking of but clarify the *De Regimine* position and the evolution of Aquinas's thought. I cannot simply validate a historically dubious reading for a lecture, as that would be academically irresponsible. I need to present the nuance.

