answer: |-
  This is a fantastic pivot for a seminar. You're right to be dissatisfied with the standard Pascal's Wager vs. St. Petersburg comparison. Wager is about *infinite* utility with non-zero probability; St. Petersburg is about *unbounded finite* utility with diminishing probability. Pascal's Mugging (PM) actually hybridizes these: it involves unbounded (or effectively infinite) utility with vanishingly small *epistemic* probability.

  The intuition pump feels different because the **source of the divergence** is fundamentally different in each case. Here is a breakdown of where the objections to St. Petersburg (SPP) carry over to the Mugging, and where the structural disanalogies cause those objections to crash.

  ### 1. Aleatory Risk vs. Epistemic Uncertainty
  **Where they break down:** This is the sharpest distinction.
  In SPP, the probability distribution is **aleatory** and known. We know the coin is fair; we know the payoff schedule. The divergence arises from the mathematical properties of the sum $\sum (1/2^n) \cdot 2^n$. If you reject the bet, you are rejecting the Expected Utility (EU) maximization principle itself in the face of known risk.

  In PM, the probability is **epistemic**. The divergence arises not from a known distribution, but from a credence assignment to a hypothesis ("I am a Matrix Lord"). The probability isn't $1/2^n$; it's "some tiny number $\epsilon$."
  *   **The Implication:** Solutions to SPP often involve modifying the utility function (bounded utility). But in PM, even with bounded utility, if the stakes are high enough (e.g., $3 \uparrow\uparrow\uparrow 3$ lives), you can always find a number large enough to overcome the bound *unless* the bound is hard lexicality.
  *   **The Carry Over:** Both cases suggest that human rationality relies on heuristics that ignore tail risk. But in SPP, ignoring the tail is mathematically "wrong" (given the axioms). In PM, ignoring the tail is *epistemically* rational because our ability to estimate $\epsilon$ is non-existent. We aren't bad at math in PM; we are bad at modeling reality.

  ### 2. Closed vs. Open Hypothesis Spaces
  **Where they break down:**
  SPP is a **closed system**. The sample space is defined. The probabilities sum to 1. There is no "St. Petersburg + 1" game competing for your attention.

  PM takes place in an **open hypothesis space**. For every hypothesis the mugger offers ("Give me $5 and I save $3 \uparrow\uparrow\uparrow 3$ people"), there is a counter-hypothesis ("Give me $5 and I torture $3 \uparrow\uparrow\uparrow 3$ people") or a rival hypothesis ("I am a Matrix Lord who saves $3 \uparrow\uparrow\uparrow 3 + 1$ people").
  *   **The Implication:** In SPP, you only fight the math. In PM, you fight the **prior distribution**. If you assign non-zero credence to the mugger, you must assign non-zero credence to the *anti*-mugger. Since the utilities cancel out (save vs. torture), the EV collapses.
  *   **The Carry Over:** Both cases force us to confront "infinity" in decision theory. But SPP forces us to confront infinite *expectation*, whereas PM forces us to confront infinite *complexity*. A solution to PM often requires a complexity penalty (Solomonoff induction style) that simply doesn't apply to SPP.

  ### 3. Physical Realizability (The Bankroll Problem)
  **Where they carry over:**
  This is the strongest pragmatic argument against both, and it highlights that both paradoxes rely on physically impossible setups.
  *   **SPP:** No casino has infinite money. If you cap the bankroll at the wealth of the observable universe, the EV becomes finite (and quite small, roughly $50).
  *   **PM:** No agent has the causal leverage to affect $3 \uparrow\uparrow\uparrow 3$ people. The number exceeds the number of particles in the universe.
  *   **The Nuance:** In SPP, acknowledging the bankroll cap solves the paradox completely. In PM, acknowledging the causal cap *doesn't* fully solve it. Why? Because the mugger claims to operate *outside* our physics (simulations, higher dimensions). Rejecting SPP requires checking the casino's solvency. Rejecting PM requires checking the metaphysics of the universe. The latter is much harder to rule out a priori, which is why PM feels more "sticky."

  ### 4. Repeatability and the Law of Large Numbers
  **Where they break down:**
  *   **SPP:** If you could play the St. Petersburg game 1,000 times, the average payoff would converge (slowly) toward the median, but the mean remains dominated by outliers. However, the *variance* is infinite. The intuition that "you shouldn't pay much" is vindicated by the fact that in any finite sequence of plays, the return is low.
  *   **PM:** This is a one-shot decision. There is no convergence. There is no "long run" where being mugged pays off.
  *   **The Implication:** We reject SPP partly because we know we will never see the payoff that justifies the entry fee in a single life. We reject PM because the mechanism of payoff is unverifiable. In SPP, the mechanism is transparent (coin flip). In PM, the mechanism is opaque (magic/simulation).
  *   **Why it matters:** In SPP, the "irrationality" is about **risk aversion** (we prefer sure things over high variance). In PM, the "irrationality" is about **gullibility** (we prefer coherent worldviews over unsupported testimony).

  ### 5. The "Zero" Solution vs. The "Bound" Solution
  **Where the solutions diverge:**
  Most decision theorists "solve" SPP by bounding utility (diminishing marginal utility of money). $U(\$x)$ is logarithmic, so the sum converges.
  *   **Does this carry to PM?** Only if the stakes are monetary. If the stakes are *lexical* (e.g., preventing human extinction, avoiding torture), many argue utility is not bounded. You cannot have "diminishing returns" on the existence of your species.
  *   **The Breakdown:** If utility is unbounded (as many moral realists argue), SPP re-emerges as a problem for money, but PM becomes a catastrophic problem for ethics. To solve PM with unbounded utility, you must introduce **probability discounting** (treating probabilities below $1/10^{100}$ as zero).
  *   **The Cost:** Discounting probabilities solves PM but breaks standard Bayesianism (you become vulnerable to Dutch Books). Bounding utility solves SPP but implies you wouldn't pay to save a billion lives if you were already rich enough. Thus, the "fix" for one paradox often breaks the other.

  ### Seminar Discussion Angle
  If I were playing devil's advocate in your seminar, I'd push this angle:

  **St. Petersburg is a problem of *Mathematics*; Pascal's Mugging is a problem of *Language*.**

  In SPP, the terms are well-defined. The paradox shows that $E[U]$ is a poor metric for single-shot decisions with heavy-tailed distributions.
  In PM, the terms are ill-defined. The mugger's statement "I can affect $3 \uparrow\uparrow\uparrow 3$ people" might be cognitively meaningless to us. We can process the syntax, but we cannot ground the semantics.

  Therefore, rejecting the SPP bet is about **risk management** (acknowledging that variance matters). Rejecting the PM payment is about **epistemic hygiene** (acknowledging that some claims are too complex to be probable, regardless of the stakes).

  **The Takeaway:**
  Reasons for rejecting SPP (bounded utility, physical bankroll limits) carry over to PM only if we treat the mugger's promise as a physical transaction. They break down when we treat the mugger's promise as a metaphysical claim. The Mugging is harder to kill because it hides in the gap between *logical possibility* and *physical plausibility*, whereas St. Petersburg dies the moment you check the casino's ledger.
