      *   *Question 9 (Methodology):* How is his data different from Brahe's or Ptolemy's?
      *   *Question 10 (Mandatory - Falsifiability):* What proves you wrong?

      *Refining for Tone:* The questions need to sound like an informed interviewer (AP Euro student) but respectful enough for a "living history" panel, yet probing enough to meet the prompt's demand for "forcing him to defend."

      *Refining the Answers/Follow-ups:* Need to channel Kepler's voice. He was pious, somewhat defensive about his poverty, mathematically rigorous but mystically inclined. He distinguished between *physical* causes and *archetypal* causes.

