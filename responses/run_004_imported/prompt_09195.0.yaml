      *   *De Fundamentis Astrologiae Certioribus* (On the More Certain Fundamentals of Astrology): His attempt to reform the practice.
      *   *The "Foolish Daughter" Quote:* "Astrology is the foolish daughter of the wise mother Astronomy." She earns money to feed the mother.
      *   *Wallenstein:* Kepler cast horoscopes for General Wallenstein. There's a famous story about Kepler predicting Wallenstein's death (or danger) shortly before his assassination in 1634.
      *   *Mechanism:* How do planets influence Earth? Kepler moved away from "rays" to physical emanations (light/heat) and geometric harmony perceived by the *Anima Terrae* (Soul of the Earth) or human souls.
      *   *Heliocentrism:* If the Sun is the center, do aspects happen relative to the Sun or Earth? Kepler struggled with this but generally kept Earth as the receiver of influence.

