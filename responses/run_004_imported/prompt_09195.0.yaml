answer: |-
  Here are ten interview questions designed for your AP European History living history panel. They are structured to probe the internal consistency of Kepler's "reformed astrology," moving from his methodological distinctions to the theological and economic tensions in his work.

  ### **Interview Questions for Johannes Kepler**

  **1. In your treatise *Tertius Interveniens* (The Third Party Intervening), you position yourself between the "superstitious" astrologers and the "atheistic" skeptics. But isn't this middle ground unstable? If you reject the predictive certainty of the vulgar astrologers, on what grounds do you claim your own prognostications have any validity at all?**
  *   **Plausible Answer:** Kepler would likely argue that vulgar astrology claims too much (determining specific events), while skeptics deny the obvious influence of the heavens on weather and human temperament. He claims validity only for "inclinations," not compulsion.
  *   **Follow-up:** If you only predict "inclinations," how do you distinguish a failed prediction from a successful one? If a client acts against the inclination, was your astrology wrong, or did they simply exercise free will? How is that testable?

  **2. You have famously remarked that astrology is the "foolish daughter" who keeps her "wise mother," astronomy, fed. Given your rigorous mathematical standards in *Astronomia Nova*, does it not damage your scientific reputation to be publicly associated with the "foolish" trade of casting nativities for pay?**
  *   **Plausible Answer:** He would admit the embarrassment but cite economic necessity. He was Imperial Mathematician but rarely paid on time; astrology was the only reliable income to support his family and fund his astronomical research.
  *   **Follow-up:** If the income is necessary, does that necessity color your interpretations? When casting a horoscope for a patron who pays well, are you truly free to predict misfortune, or does the "foolish daughter" have to tell the customer what they want to hear to keep the "mother" fed?

  **3. In *Harmonices Mundi*, you discard the twelve zodiac signs and the twelve houses as arbitrary human divisions, yet you retain and expand the system of "aspects" (angles between planets). Why are sectors of the sky mere conventions, but specific angles like the sextile or square considered divinely ordained?**
  *   **Plausible Answer:** Kepler argues that signs are named by humans after myths, but aspects are based on pure geometry and musical consonance. The angles correspond to harmonic ratios (like 1:2, 2:3) that exist in nature and the mind of God, independent of human naming.
  *   **Follow-up:** You base these harmonic ratios on the musical scales of *human* composition. Is it not possible that you are projecting human aesthetic preferences onto the cosmos and calling it divine geometry? Why should the structure of a lute string dictate the influence of Mars?

  **4. Following up on the aspects: If these angles are harmonic, who or what is listening? In a geocentric system, the Earth is the stage. But in your heliocentric system, the Earth is just another planet whirling around the Sun. Who perceives the harmony?**
  *   **Plausible Answer:** Kepler posits the *Anima Terrae* (Soul of the Earth). The Earth itself has a soul that perceives the geometric aspects of the planets and reacts by altering the weather or influencing the generation of life within it.
  *   **Follow-up:** If the Earth's soul perceives the angles, does it perceive them from the center of the Earth or the center of the Sun? If the angles are measured from Earth, haven't you quietly reintroduced an Earth-centered perspective to save the mechanism of your astrology?

  **5. You argue that the Sun is the source of motive power for the planets, a physical force. How do you reconcile this physical emanation of light and force with the *archetypal* influence of the aspects? How can a physical ray create a geometric harmony?**
  *   **Plausible Answer:** Kepler distinguishes between the *efficient cause* (the Sun's physical light driving motion) and the *formal cause* (the geometric configuration affecting the soul). He sees them as two different languages describing the same divine order.
  *   **Follow-up:** But if the physical force comes from the Sun, shouldn't the influence depend on distance and intensity, not just angle? Why does a planet at a "harmonic" angle but vast distance influence the Earth more than a closer planet at a "discordant" angle?

  **6. Let's discuss General Wallenstein. You cast his horoscope and reportedly warned him of danger in 1634, shortly before his assassination. Did you calculate this danger based on your reformed harmonic aspects, or was this a political warning disguised as astrology?**
  *   **Plausible Answer:** Kepler would insist it was calculated based on the transits of Saturn and Mars forming hard aspects to his natal positions. He would claim he saw the "inclination" toward violence.
  *   **Follow-up:** Historical records suggest your warning was somewhat vague until after the fact. If your reformed astrology is more "certain" than the vulgar kind, why was the prediction not specific enough to save him? Does the vagueness protect your reputation if you are wrong?

  **7. You criticize traditional astrologers for ignoring the physical reality of the heavens, yet you continue to use the traditional planets (including the Sun and Moon as "planets"). Since you discovered that orbits are elliptical and speeds vary, why haven't you recalculated the Ephemerides to account for variable planetary speeds in your horoscopes?**
  *   **Plausible Answer:** He might argue that the *mean* positions are sufficient for the "gross" influence on the *Anima Terrae*, or that the variations average out over the time of human gestation and life.
  *   **Follow-up:** This seems like a contradiction. You demand precise elliptical mathematics for the motion of Mars to satisfy Tycho Brahe's data, but revert to approximate mean speeds when predicting human fate. Why does precision matter for the machine of the cosmos but not for its influence on us?

  **8. As a Lutheran living in the aftermath of the Reformation, how do you defend astrology against the charge that it infringes on God's providence and human free will? If the stars incline the soul, is sin still a choice?**
  *   **Plausible Answer:** Kepler would argue that the stars influence the *body* and the *passions*, but the *Mind* (endowed by God) can overcome these inclinations. Astrology warns us of our weaknesses so we may pray and resist them.
  *   **Follow-up:** If the Mind can overcome the stars, then the stars are not the ultimate cause of events. If they are not the cause, why study them to predict events? Are you not essentially saying astrology predicts what *would* happen if we were beasts, but not what happens when we are men?

  **9. You rely heavily on Tycho Brahe's observational data, which was gathered by a man who rejected heliocentrism. Do you worry that using geocentric data to build a heliocentric astrology introduces errors into your harmonic calculations?**
  *   **Plausible Answer:** Kepler would say that observational data (where the planet *appears* in the sky) is the same regardless of the theoretical model. The geometry of the sightlines is what matters for the aspects.
  *   **Follow-up:** But the *distance* and *true position* differ between the Tychonic and Copernican models. If the *Anima Terrae* reacts to the true geometric configuration, not just the visual appearance, doesn't the underlying model matter for the truth of the aspect?

  **10. Finally, Herr Kepler, a question on falsifiability. You distinguish your "reformed" astrology from the "vulgar" kind by its grounding in physics and geometry. What specific observation or event would prove *your* system wrong, rather than just proving the vulgar astrologers wrong?**
  *   **Plausible Answer:** He might struggle here, but would likely say if a major conjunction occurred with perfect harmonic aspects and produced *no* discernible effect on weather or public health over a long period, his theory would be in trouble.
  *   **Follow-up:** But who defines "discernible effect"? If a conjunction happens and a war *doesn't* start, but a plague does, you can claim the influence was there. If no major event happens, you can claim the influence was too weak. Is there any outcome that would actually force you to abandon the practice entirely?

  ### **Notes for the Interviewer**
  *   **Tone:** Keep your tone respectful but persistent. Kepler was a pious man who believed he was doing God's work; do not frame him as a fraud, but as someone struggling to reconcile mysticism with emerging empiricism.
  *   **The "Trap":** The goal of these questions is to highlight that Kepler's "reformed astrology" relies on the same unfalsifiable mechanisms as the "vulgar" kind, even if the math is better.
  *   **AP Euro Connection:** These questions touch on Key Concept 1.2 (The Scientific Revolution) and the tension between new scientific methods and traditional religious/magical worldviews.
