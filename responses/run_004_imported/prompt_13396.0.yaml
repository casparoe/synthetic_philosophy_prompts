  7.  **Final Polish:** Ensure tone is respectful and intellectually rigorous. Use standard terminology (myopic, sophisticated, resolute, dynamic consistency). Cite key names if helpful (Davidson, McKinsey, Sugden, Gustafsson, McClennen).

