answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees, The Kestrel Prize
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal Regarding the Arts Council's "Readers' Choice" Requirement

  **Recommendation**
  We should reject the Arts Council's specific requirement for an online public vote. However, to secure our funding renewal and honor the spirit of engagement, we should propose a substitute "Trade & Reading Group Strand." This award would be decided by a coalition of independent booksellers and registered literary reading groups, requiring a submitted rationale for their choice rather than a simple tally. This maintains the demand for public engagement without instantiating what Kierkegaard terms "the public."

  **The Stakes**
  We are deadlocked. Two of us rightly argue that a public vote offers vital visibility and sales potential for debut authors in a contracting market. To refuse engagement is to risk irrelevance. The other two rightly argue that an online poll invites brigading, reduces literary merit to popularity, and exposes authors to the volatility of online controversy. To accept the vote is to risk integrity.

  As the deciding vote, I have sought a framework that does not merely weigh pros and cons but examines the nature of the judgment we are asking to be performed. My reading of Kierkegaard's *Two Ages* suggests that the mechanism of an online vote is not a neutral tool; it fundamentally alters the ethical category of the prize.

  **The Public vs. The Assembly**
  Kierkegaard distinguishes sharply between "a people" or "a congregation" and "the public." A congregation or an assembly is concrete. Its members are present to one another; they are answerable for their opinions. If I stand in a room and declare a book unworthy, I own that judgment. I can be challenged. I bear the responsibility.

  "The public," conversely, is an abstraction. It is a phantom body composed of individuals who are not present to one another. In an online vote, the voter is anonymous, unaccountable, and disconnected from the consequences of their click. As Kierkegaard writes, the press (and today, the platform) manufactures an opinion "for which no one in particular is responsible."

  If we institute an online vote, we are not asking "readers" to judge; we are asking "the public" to level. Leveling is the process by which all qualitative distinctions are flattened into quantitative ones. It does not matter if a vote is cast out of deep love for the prose or out of a desire to punish an author for a tweet unrelated to the text; in the tally, they weigh the same. By adopting this mechanism, the Kestrel Prize would cease to be a jury of accountable peers and become a mirror for the abstract noise of the age. We would be legitimizing the very dynamic that threatens our shortlisted authors.

  **The Institutional Paradox**
  Here we face a complication. Kierkegaard's remedy for leveling is not better institutional design; it is the "single individual's" inward turn. He was hostile to the idea that a committee could legislate its way out of spiritual or ethical decay. One might argue, therefore, that a prize board has no business trying to solve this. We should simply judge our own winner and ignore the zeitgeist.

  But we are not a solitary individual; we are a board. We are, in Kierkegaardian terms, a small concrete assembly. We *are* answerable to one another. Our task is not to fix the "Present Age," but to refuse to become an instrument of it. We cannot stop the leveling of the wider culture, but we can ensure the Kestrel Prize does not actively perform that leveling. Our responsibility is to maintain a space where judgment remains concrete, where merit is argued rather than counted. To hide behind a public vote is to abdicate that responsibility to the abstraction.

  **Addressing the Counter-Arguments**
  To my colleagues who favor the vote: Your motivation is the welfare of the authors. You see the prize as a engine for sales and recognition. I share this goal. But we must ask if a "Readers' Choice" award actually serves them. If a winner is perceived as the product of a mobilized fanbase rather than literary merit, does the accolade carry weight? If an author becomes the target of a pile-on, does the visibility help or harm? A sales boost gained through the volatility of the public is precarious. We owe our authors protection from the very machine we are being asked to feed.

  To my colleagues who oppose the vote: Your fear of brigading and the erosion of standards is well-founded. However, a flat rejection of public engagement risks isolating the prize. We cannot claim to serve the reading public while refusing to let them participate in any form. We must offer an alternative that satisfies the funder's need for "profile raising" without surrendering to the abstraction of the online poll.

  **The Proposal: A Concrete Alternative**
  I propose we counter the Arts Council's requirement with a "Booksellers and Reading Groups" strand.
  1.  **Booksellers:** Independent bookshops nominate and vote. They are a concrete trade with reputations at stake. Their judgment is professional and accountable.
  2.  **Reading Groups:** Registered book clubs submit a collective statement on why they chose a specific shortlisted title. This requires deliberation, not just a click. It transforms the "consumer" into a participant in a concrete association.

  This satisfies the Arts Council's metric for engagement (we can track shop participation and club submissions) but preserves the ethical category of judgment. It replaces the "public" with "communities."

  **Conclusion**
  Kierkegaard warns that when everything becomes public, nothing is truly communicated. If we want the Kestrel Prize to communicate value, we must resist the temptation to measure it. Let us not ask the public to decide. Let us ask the readers, in their concrete associations, to deliberate.

  I ask that we vote to reject the online vote mechanism and authorize me to draft the alternative proposal for the Arts Council before the submission window opens.

  [Your Name]
  Trustee, The Kestrel Prize
