          *   *The "Regulative" Twist:* This is the big philosophical pivot. Moderns usually argue about what function *is* (ontology). Kant argues about how we must *judge* it (epistemology).
          *   *Contemporary Resonance:* Mention "Organizational Accounts" (Mossio, Saborido, etc.) or "Autopoiesis" (Maturana/Varela). This shows the user where Kant's legacy actually lives today.
