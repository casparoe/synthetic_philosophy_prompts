prompt: |-
  I'm working on a piece about the more mathematically-minded wing of effective altruism, and I keep running into an argument that would be a great hook for the piece if its actually true, so I want to sanity check it before I write it up. A couple of people I've interviewed told me that Harsanyi's aggregation theorem basically proves utilitarianism. Here's the version I got: if both individuals and "society" are rational in the standard economic sense (preferences satisfying what economists call the von Neumann-Morgenstern axioms for choice under uncertainty), plus one mild condition -- if literally everyone is indifferent between two options, society has to be indifferent too -- then you're mathematically forced into a social welfare function that's just a weighted sum of everybody's individual utility. One guy pitched it to me as basically the utilitarian mirror image of Arrow's theorem: instead of proving something's impossible, it proves that once you accept a handful of boring, near-tautological axioms about rationality, you don't get to pick your ethical theory anymore -- the math picks it for you.

  If that's right, it seems like a much bigger deal than just another move in a philosophy seminar, since it would mean Rawlsians, virtue ethicists, and everybody else who isn't already a utilitiarian is just refusing to follow their own premises to their logical conclusion. The only pushback I got was from an economist friend, who mentioned something about "Sen" and interpersonal comparisons being an issue, but she was heading into a meeting and it came out sounding like a footnote-level technicality rather than a real crack in the argument. So, gut check: is it fair to tell readers that Harsanyi mathematically proved utilitarianism, full stop, and that everyone still arguing about ethics after 1955 hasn't caught up? Or is something load-bearing getting lost between the actual theorem and the version that's making the rounds?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user is writing a piece on the mathematically-minded wing of Effective Altruism (EA).
      *   **Hook:** They want to use the claim that "Harsanyi's Aggregation Theorem proves utilitarianism."
      *   **Source of Claim:** Interviews with EA-aligned individuals.
      *   **Counter-claim:** An economist friend mentioned "Sen" and "interpersonal comparisons" as a potential issue, but dismissed it as a technicality.
      *   **Question:** Is it fair to say Harsanyi *mathematically proved* utilitarianism, full stop, implying non-utilitarians are irrational/inconsistent? Or is something load-bearing being lost?
      *   **Tone:** Journalistic/analytical, seeking a "sanity check." Needs to be accurate but accessible.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   **What is Harsanyi's Aggregation Theorem?** It states that if individual preferences and social preferences satisfy the von Neumann-Morgenstern (vNM) axioms (rationality under uncertainty) and the Pareto principle (if everyone prefers X to Y, society prefers X to Y), then social welfare must be a weighted sum of individual utilities.
      *   **Does this equal Utilitarianism?** It looks like *weighted* utilitarianism. Classical utilitarianism usually implies equal weights. Harsanyi's theorem allows for arbitrary weights.
      *   **What are the assumptions?**
          1.  vNM rationality for individuals.
          2.  vNM rationality for society (this is a big one).
          3.  Pareto principle (weak or strong).
          4.  *Crucially:* The "same preferences" assumption or the interpretation of utility.
      *   **What are the criticisms?**
          1.  **Interpersonal Comparisons of Utility:** vNM utility is ordinal up to positive affine transformations. To sum them, you need to make them comparable (cardinal and unit-comparable). Harsanyi assumes this is possible or builds it into the "veil of ignorance" setup (Harsanyi has two arguments: the Aggregation Theorem and the Veil of Ignorance argument). The prompt specifically mentions the Aggregation Theorem.
          2.  **The "Social Rationality" Axiom:** Assuming society acts like a rational individual is controversial. It begs the question of whether collective choice *should* satisfy vNM axioms.
          3.  **Weights:** The theorem doesn't specify the weights. Utilitarianism typically demands equal weights. Harsanyi argues for equal weights via the Veil of Ignorance, not strictly via the Aggregation Theorem alone.
          4.  **Amartya Sen's Critique:** Sen is the big name here. He argues that welfarism (judging states only by utility info) is too narrow. He also points out issues with informational bases.
          5.  **Preferences vs. Well-being:** vNM utility represents *preferences*, not necessarily *well-being* or *happiness*. Summing preferences might not yield moral goodness (e.g., sadistic preferences).
          6.  **Arrow's Theorem Comparison:** The interviewee called it the mirror of Arrow. Arrow shows impossibility with ordinal utility. Harsanyi shows possibility with cardinal utility. But the assumptions differ significantly.

  3.  **Synthesize the "Load-Bearing" Issues:**
      *   *Issue 1: The definition of Utility.* vNM utility $\neq$ moral utility. It's just a representation of preference orderings under risk. Summing them doesn't necessarily sum "happiness."
      *   *Issue 2: Interpersonal Comparability.* You can't add $U_A$ and $U_B$ unless you know that 1 unit for A is the same "size" as 1 unit for B. The theorem assumes this scaling is fixed or comparable, which is a heavy ethical lift, not just a mathematical one.
      *   *Issue 3: The Weights.* The theorem yields $\sum a_i U_i$. It doesn't prove $a_i = a_j$. Without equal weights, it's not standard utilitarianism.
      *   *Issue 4: Social Rationality.* Assuming society has a preference ordering that satisfies independence of irrelevant alternatives (IIA) etc., is a normative claim, not a mathematical truth.
      *   *Issue 5: The "Ought" from "Is".* Even if the math holds, why *should* we accept the axioms? Non-utilitarians reject the axioms (e.g., rights constraints might violate Pareto or IIA).

  4.  **Drafting the Response:**
      *   **Direct Answer:** No, it is *not* fair to say it proves utilitarianism "full stop." It's a strong argument *for* a form of utilitarianism *given* specific normative premises, but those premises are where the ethical fighting happens.
      *   **Validate the Interviewees:** Acknowledge that within the EA/rationalist community, this is a common and respected argument. It's not "fake news," but it is "inside baseball."
      *   **Validate the Economist Friend:** Sen is not a footnote; he's the main counter-argument. Interpersonal comparison is the crux.
      *   **Break Down the Theorem vs. Utilitarianism:**
          *   Theorem = Weighted Sum.
          *   Utilitarianism = Equal Weighted Sum of *Well-being*.
          *   Gap 1: Weights (Harsanyi uses Veil of Ignorance to fix this, not the Aggregation Theorem alone).
          *   Gap 2: Utility vs. Well-being (Preferences can be weird).
          *   Gap 3: Interpersonal Comparability (The scaling problem).
      *   **Address the "Arrow Mirror" Claim:** It's a clever soundbite but slightly misleading. Arrow assumes ordinal utility; Harsanyi assumes cardinal. That's a huge difference in informational requirements.
      *   **Advice for the Piece:** Frame it as "Harsanyi provides a powerful formalization that *constrains* ethical theories if you accept X, Y, Z," rather than "Harsanyi ended ethics." This makes for a better story (conflict vs. resolution).

  5.  **Refining the Tone:**
      *   Avoid being dismissive of EA. They are smart people.
      *   Avoid being overly technical (keep vNM explanations simple).
      *   Focus on the *philosophical weight* of the mathematical assumptions.
      *   Highlight that "Rationality" in economics is a technical term, not a synonym for "Sensible."

  6.  **Self-Correction/Nuance Check:**
      *   *Did Harsanyi claim it proves utilitarianism?* He claimed it supports it strongly, especially combined with the Veil of Ignorance.
      *   *Is Sen's objection technical?* No, it's foundational. It's about what information is morally relevant.
      *   *Is the "Social Rationality" axiom controversial?* Yes, very. Broome and others discuss this. If society isn't a person, why should it have vNM preferences?

  7.  **Final Structure:**
      *   **The Verdict:** Don't write it as a proof. Write it as a conditional argument.
      *   **The Good News:** The theorem is real and impressive.
      *   **The Bad News (The "Load-Bearing" parts):**
          1.  Interpersonal Comparability (The Sen point).
          2.  The Weights Problem.
          3.  Preference Satisfaction vs. Welfare.
          4.  The Normative Status of the Axioms.
      *   **Journalistic Angle:** How to frame this for the article (The tension between formal elegance and moral complexity).

  8.  (Final Polish): Ensure the distinction between Harsanyi's *Aggregation Theorem* and his *Veil of Ignorance* argument is clear, as they are often conflated but do different work. The prompt focuses on Aggregation.

  **(Self-Correction during drafting):** I need to make sure I don't get bogged down in the math of affine transformations. Keep it conceptual: "You can't add apples and oranges unless you define a conversion rate, and defining that rate is an ethical choice, not a math fact."

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  The short answer is: **No, it is not fair to write that Harsanyi "mathematically proved utilitarianism, full stop."** If you print that, you will likely receive a volley of corrections from moral philosophers and welfare economists that could undermine the credibility of the rest of your piece.

  Your interviewees are describing a view that is popular within the rationalist/EA community, but it conflates a mathematical result with a set of contested normative premises. Your economist friend was right about Sen, but she undersold it: **interpersonal comparisons of utility are not a footnote-level technicality; they are the entire battlefield.**

  Here is a sanity check on the specific claims you were told, broken down by where the argument holds water and where it leaks.

  ### 1. The Theorem vs. The Conclusion
  **The Claim:** Harsanyi's Aggregation Theorem proves society must maximize the sum of individual utilities.
  **The Reality:** The theorem proves that if you accept specific axioms, social welfare must be a **weighted sum** of individual utilities ($W = a_1U_1 + a_2U_2 + ...$).

  **The Gap:** Classical utilitarianism requires **equal weights** ($a_1 = a_2 = ...$). Harsanyi's Aggregation Theorem *alone* does not prove equal weights. It allows for a social welfare function that prioritizes Person A over Person B arbitrarily, provided it remains linear.
  *   **How EAs fix this:** Harsanyi argued for equal weights using a *separate* argument involving the "Veil of Ignorance" (impartiality). But that is a moral argument about fairness, not a mathematical derivation from rationality axioms. If you tell readers the *math* forces utilitarianism, you are hiding the moral premise (impartiality) inside the black box.

  ### 2. The "Interpersonal Comparison" Problem (The Sen Objection)
  **The Claim:** The axioms are "boring, near-tautological."
  **The Reality:** The theorem requires **cardinal, unit-comparable utility.**

  In standard economics (and vNM theory), utility is ordinal up to a positive affine transformation. This means I can say I prefer Apple to Orange, and I can say how much I prefer it under risk, but I cannot say my "unit" of pleasure is the same size as yours.
  *   **The Math Problem:** You cannot add $U_{Alice}$ and $U_{Bob}$ unless you know that 1 util for Alice is the same "amount" of good as 1 util for Bob.
  *   **The Ethical Problem:** Deciding how to scale Alice's utility against Bob's is an ethical choice, not a mathematical one. If Alice is a "utility monster" (Nozick's term) who gets 100x more satisfaction from resources than Bob, a weighted sum might dictate giving her everything.
  *   **Sen's Point:** Amartya Sen's work (for which he won the Nobel) focuses heavily on the "informational basis" of judgment. He argues that restricting ourselves *only* to utility information (welfarism) excludes relevant moral data like rights, freedoms, or equality. To say Sen is a "technicality" is to miss the last 40 years of welfare economics.

  ### 3. "Social Rationality" is a Normative Claim
  **The Claim:** If society is rational (vNM axioms), utilitarianism follows.
  **The Reality:** Assuming "society" satisfies the vNM axioms is itself a controversial ethical stance.

  The vNM axioms include things like **Independence of Irrelevant Alternatives (IIA)**.
  *   *Example:* If society prefers Policy A to Policy B, introducing a useless Policy C shouldn't make society prefer B to A.
  *   *Counter-argument:* Many non-utilitarian theories (like rights-based deontology) violate this. If Policy A violates a right and Policy B doesn't, the presence of Policy C shouldn't change the moral status of A.
  *   **The Catch:** By assuming society *must* be vNM-rational, Harsanyi is essentially assuming the conclusion. He is saying, "If you agree that society should act like a rational individual agent, then you must be a utilitarian." Non-utilitarians reply: "But society *isn't* an individual agent, and shouldn't try to be one."

  ### 4. Preference Satisfaction vs. Well-Being
  **The Claim:** The theorem validates utilitarianism.
  **The Reality:** The theorem validates **preference satisfaction.**

  vNM utility measures the satisfaction of preferences, not necessarily "happiness" or "well-being" (hedonic utility).
  *   If someone has a preference for seeing others suffer (sadism), vNM utility counts that.
  *   Classical utilitarianism (Bentham/Mill) usually cares about happiness/pleasure, not the satisfaction of evil preferences.
  *   Modern EA often uses "preference utilitarianism," so this distinction matters less to them, but it is a major divergence from historical utilitarianism and a common critique from outside the movement.

  ### How to Write This (The Better Hook)
  The claim that "Harsanyi proved utilitarianism" is actually a *more* interesting story if you frame it accurately. It's not a story about math ending ethics; it's a story about **how a specific community uses math to bypass ethical disagreement.**

  Here is a more accurate framing for your piece:

  1.  **Acknowledge the Power:** Harsanyi's theorem is indeed the strongest formal argument for utilitarianism. It shows that utilitarianism isn't just a vague "greatest good" vibe; it is the unique solution to a specific optimization problem.
  2.  **Highlight the Trade-off:** The "price" of this proof is accepting that **rationality = vNM axioms** and **ethics = preference aggregation.**
  3.  **The EA Perspective:** The mathematically-minded wing of EA *knows* these assumptions are heavy. They accept them because they value **tractability** and **clarity** over moral nuance. They would argue: "Sure, Sen has points, but 'rights' are fuzzy. Utility sums are actionable. We choose the math because it lets us save lives *now*."
  4.  **The Critique:** The critics (like Sen, or philosophers like Elizabeth Anderson) argue that by forcing ethics into a vNM framework, you aren't "solving" ethics; you are **flattening** it. You are defining away the parts of morality (rights, desert, equality) that don't fit into the equation.

  ### Summary for your Notebook
  *   **Is the theorem real?** Yes.
  *   **Does it prove utilitarianism?** It proves *weighted* preference utilitarianism, *if* you accept that social choices must obey vNM rationality and that interpersonal utility comparisons are possible.
  *   **Is the "Arrow Mirror" analogy fair?** It's catchy but misleading. Arrow shows you can't aggregate *ordinal* preferences without a dictator. Harsanyi shows you *can* aggregate *cardinal* preferences linearly. The difference is the informational requirement (cardinal vs. ordinal), which is the whole ethical fight.
  *   **Verdict:** Do not write that non-utilitarians "haven't caught up." Write that they **reject the premises.** They don't deny the math; they deny that the math captures the whole of morality.

  **Suggested Headline Angle:** "The Equation That Claims to Solve Ethics: Why Harsanyi's Theorem is the Bible of Effective Altruism—and Why Its Critics Say It's a Map That Leaves Out the Terrain."
