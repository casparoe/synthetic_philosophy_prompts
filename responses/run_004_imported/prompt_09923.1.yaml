      *   *Stronger Verdict:* I should argue that the *classical formulation* is empirically obsolete. The data supports a "Calibrated Nativism." Locke is right that specific cross-modal mappings are not innate. Leibniz is right that the *principles of objecthood* are innate. But the motion data shows that "shape" is not the primitive unit; "spatiotemporal coherence" is.
      *   *Decision:* I will argue that the evidence dissolves the dichotomy. It shows that while specific *sensory concepts* are modality-specific (Locke), the *computational priors* for object segmentation are amodal and innate (Leibniz), but they rely heavily on dynamic information (which classical philosophy ignored). Thus, the question is ill-formed because it treats "shape" as a static, modality-neutral property rather than a dynamic construction.

