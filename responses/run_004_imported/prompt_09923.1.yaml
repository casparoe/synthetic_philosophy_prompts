      *   **The Motion Asymmetry (The Crucial Turn):** This is where I address the "ill-formed" constraint. Static vs. Dynamic vision relies on different mechanisms. The classical question asked about "shape" generally. The data shows "dynamic shape" is accessible sooner. This means the question bundles distinct capacities.
      *   **Synthesis/Verdict:** Propose "Calibrated Nativism." The mind has innate amodal rules (Leibniz) but they require modality-specific calibration (Locke). The classical question fails because it ignores the role of motion in bootstrapping vision.
