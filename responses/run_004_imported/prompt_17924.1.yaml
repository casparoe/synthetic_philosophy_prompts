answer: |-
  Here are 9 targeted questions designed for a philosophy colloquium Q&A, tailored to your background in law and the specific metaphysical stakes you outlined. They are structured to prevent the speaker from retreating into vague appeals to "context."

  ### 1. The "Smuggling" Charge (Norms vs. Nature)
  **Question:** You argue that omissions are genuine causes, but to solve promiscuity, you restrict causation to norm-violating failures. If causation is a natural relation describing how the world works, why does its extension depend on normative facts about how the world *ought* to work? Aren't you effectively defining the metaphysical boundary of causation using ethical tape?

  *   **Likely Reply:** "The norms aren't necessarily moral; they're about 'normalcy' or 'expectations.' It's not about *ought*, but about what is *standard* in a context."
  *   **Follow-up:** "But 'standard' is ambiguous between statistical frequency and normative expectation. If I'm in a famine zone, it's statistically *normal* for a passerby not to feed a child, but we still want to say their failure to feed caused the death if they had the means. If you rely on statistics, you lose the moral case; if you rely on norms, you've smuggled ethics back in. Which is doing the work?"

  ### 2. The Divergence Problem (Stats vs. Morals)
  **Question:** Following up on that: Consider a corrupt prison guard who doesn't feed a prisoner versus a random civilian outside the prison who doesn't feed that same prisoner. Statistically, *neither* usually feeds the prisoner. Normatively, only the guard *should*. Do you count the civilian's omission as a cause of death? If no, your view is moral, not statistical. If yes, you haven't solved promiscuity.

  *   **Likely Reply:** "The civilian isn't a cause because the guard's role makes their omission the *relevant* one. It's about salience, not just raw statistics."
  *   **Follow-up:** "But 'relevance' and 'salience' are pragmatic filters we apply to causes, not features of the causal relation itself. Are you arguing that the causal relation *itself* changes based on salience, or just that we *talk* about different causes? If the former, causation becomes mind-dependent."

  ### 3. The Ontological Relatum (The Beebee Worry)
  **Question:** Helen Beebee argues that absences aren't events; they are literally nothing. If causation is a relation between existents (events, states of affairs), how can a non-existent serve as a relatum? You can't have a relation where one term is 'null.'

  *   **Likely Reply:** "Absences aren't 'nothing'; they are real properties of a situation. The situation has the property of 'lacking water.'"
  *   **Follow-up:** "But that property is instantiated everywhere the water isn't. We are back to promiscuity unless you use the norm filter again. So, is the 'reality' of the absence independent of the norm, or does the norm actually *constitute* the absence as a causal relatum? If the latter, the absence isn't mind-independent."

  ### 4. The Mechanism Problem
  **Question:** In positive causation, we usually look for a mechanism or energy transfer. When I push a plant over, I transfer energy. When I *don't* water it, what is the causal mechanism? If the answer is simply "counterfactual dependence," aren't you collapsing causation into counterfactuals, which we know creates the very promiscuity problems you're trying to solve with norms?

  *   **Likely Reply:** "I am accepting a counterfactual theory of causation, but refining it with the norm constraint to handle the explosion of counterfactuals."
  *   **Follow-up:** "Then the 'genuine causation' work is being done by the counterfactuals, and the 'norm' work is just a pragmatic filter on assertion. Why insist the omission is a *metaphysical cause* rather than admitting it's a pragmatic way of assigning responsibility for a counterfactual dependency?"

  ### 5. Folk Intuitions (Hitchcock/Knobe Data)
  **Question:** You cite experimental data showing ordinary people's causal judgments are sensitive to norms (Knobe effect). Do you take this as vindication that metaphysics *should* track folk intuition, or as evidence that folk intuition conflates causation with blame?

  *   **Likely Reply:** "Metaphysics should explain ordinary usage. If ordinary usage is norm-sensitive, our theory should be too."
  *   **Follow-up:** "But ordinary usage also treats 'heavenly will' or 'luck' as causes in ways we reject metaphysically. If the folk are wrong about physics, why are they authoritative on the metaphysics of omission? Isn't it more likely the data shows people conflate *explanation* with *causation*, and you're reifying that conflation?"

  ### 6. Legal Structure (Duty vs. Cause)
  **Question:** In tort law, we strictly separate *cause-in-fact* (but-for causation) from *duty of care*. We say a passerby *caused* the death in a factual sense but had no *duty* to rescue. Your view seems to collapse these: if no duty/norm, no cause. Doesn't this destroy the legal utility of separating factual causation from normative liability?

  *   **Likely Reply:** "Law is a pragmatic tool, not a guide to fundamental metaphysics. The law separates them for policy reasons, but metaphysically, the cause only exists where the duty exists."
  *   **Follow-up:** "But if the law's 'factual cause' aligns with your 'quasi-cause' and the law's 'liability' aligns with your 'genuine cause,' haven't you just renamed the legal policy distinction as a metaphysical one? What work is the metaphysics doing that the legal distinction wasn't already doing?"

  ### 7. Legal Evidence (Liability as Proof)
  **Question:** You might argue that courts *do* treat omissions as causes when there is a duty, which supports your view. But isn't that circular? Courts find causation *because* there is a duty, not the other way around. Is there any evidence for your view independent of the very liability judgments you're trying to ground?

  *   **Likely Reply:** "It's not circular; it's reflective equilibrium. We start with considered judgments about liability and refine the metaphysics to match."
  *   **Follow-up:** "Reflective equilibrium works within a normative theory (like ethics). If you use it to settle a metaphysical question, you're assuming the normative facts determine the metaphysical facts. That's a heavy commitment. Are you prepared to say that if the law changed duty rules, the *causal history of the universe* would change?"

  ### 8. Falsifiability (The "Absorbing" Worry)
  **Question:** What would count as evidence *against* your view? If every time we find a norm-violating omission that doesn't seem like a cause, you can say 'that norm wasn't relevant,' and every time we find a cause without a norm, you say 'there was a hidden norm,' isn't the theory unfalsifiable?

  *   **Likely Reply:** "A case where a clear, relevant norm is violated, the omission is obvious, but we all agree it had no causal impact on the outcome."
  *   **Follow-up:** "But if the outcome didn't happen, there's no causation to discuss. If the outcome *did* happen, and the norm was violated, you'll call it a cause. It seems the 'norm' filter is adjustable post-hoc to match whatever causal intuition we already have. How do you prevent the norm from being a just-so story?"

  ### 9. The Alternative (The "Two-Step" View)
  **Question:** Why not adopt the 'Two-Step' view: Causation is a purely natural, promiscuous relation (including all omissions), and *responsibility* is the normative filter we apply afterwards? What theoretical gain do we get by baking the filter into the causation itself, other than satisfying the intuition that 'bad causes' are different from 'neutral non-events'?

  *   **Likely Reply:** "Because it feels wrong to say the passerby *caused* the death. It misdescribes the world. We want our ontology to match our responsible agency."
  *   **Follow-up:** "But that prioritizes moral comfort over ontological precision. As a legal scholar, I worry that if we make causation normative, we lose the ability to critique the norms. If causation *is* duty, then debating whether a duty exists becomes a debate about the fabric of reality, which seems to over-legalize metaphysics."
