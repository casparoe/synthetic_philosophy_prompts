answer: |-
  # The Kelly Criterion vs. Expected Utility: A Verdict on Geometric Rationality

  Your friend is arguing one of the most seductive ideas in modern finance: that the Kelly Criterion isn't just a betting trick, but a fundamental law of rationality derived from the physics of time. This view, championed by the "ergodicity economics" crowd (most notably Ole Peters), suggests that standard Expected Utility Theory (EUT) is broken because it relies on "ensemble averages" (parallel universes) rather than "time averages" (your actual life).

  The counter-argument, famously articulated by Paul Samuelson, is that Kelly is not a utility-free law of nature, but simply Expected Utility Theory with a specific, subjective utility function (logarithmic wealth) smuggled in under the guise of objectivity.

  Here is the breakdown of the debate, followed by a decisive verdict on who is right, when, and why.

  ---

  ### Part I: The Case for Geometric Rationality

  The strongest version of your friend's argument rests on the distinction between **ergodic** and **non-ergodic** systems.

  In an ergodic system, the average outcome of a group (ensemble average) is the same as the average outcome of an individual over time (time average). If you roll a die 1,000 times, your average roll matches the average of 1,000 people rolling once. Standard Expected Value (EV) thinking assumes the world is ergodic.

  However, wealth creation is **non-ergodic**. It is multiplicative, not additive. If you bet your entire bankroll on a coin flip where you win 50% on heads and lose 40% on tails, the Expected Value is positive ($0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$). A naive EV maximizer says: "Bet everything, every time."

  But in the real world, you live in one timeline. If you bet everything and hit a tail, you lose 40%. If you bet the remainder and hit another tail, you lose more. Eventually, a string of losses hits zero. Once you hit zero, you cannot play. This is an **absorbing barrier**.

  The ergodicity argument posits:
  1.  **Ruin is permanent:** You cannot average your outcomes across parallel selves because the version of you that goes bust doesn't get to contribute to the average.
  2.  **Growth is geometric:** Wealth compounds. The relevant metric is not the arithmetic mean of returns, but the geometric mean (the compound annual growth rate).
  3.  **Log-Utility is Physical:** Maximizing the time-average growth rate of wealth mathematically requires maximizing the expected logarithm of wealth.

  Therefore, the argument goes, you don't need to assume a "risk-averse" utility function. You simply need to respect the mathematics of time. Kelly betting (maximizing expected log wealth) falls out as the *only* strategy that prevents ruin while maximizing long-term growth. It claims to be "utility-free" rationality.

  ### Part II: The Samuelson Takedown

  Paul Samuelson, the titan of 20th-century economics, dismantled this in his 1971 paper, *"The 'Fallacy' of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling."* (Legend in economic circles holds that he once challenged himself to write a takedown of Kelly using only one-syllable words to demonstrate how simple the error was; while bibliographic evidence for the strict constraint is murky, the spirit of his critique was certainly that the Kelly argument was simplistic.)

  Samuelson's core objections are:

  1.  **The "Smuggling" Charge:** Samuelson argued that maximizing geometric mean is *mathematically identical* to maximizing Expected Utility with a logarithmic utility function ($U(w) = \ln w$). By claiming Kelly is "objective," proponents are hiding a subjective preference. Why *should* you care about the geometric mean? Only if you value wealth logarithmically. If you value wealth linearly (risk-neutral) or have a step-function utility (e.g., "I need \$1M for surgery or nothing"), Kelly is not optimal.
  2.  **The Asymptopia Problem:** Kelly is optimal only as time approaches infinity ($t \to \infty$). But humans die. In any finite time horizon, a Kelly strategy does not guarantee the highest expected utility. In fact, because Kelly is volatile, there is a significant probability that a "bold" strategy (betting more than Kelly) could beat Kelly in your lifetime, even if it risks ruin eventually.
  3.  **The Divergence of Expectations:** Samuelson proved that even if the probability of Kelly beating any other strategy approaches 1 as time goes on, the *expected value* of the alternative strategy can still be higher. This is because the tiny probability of the alternative strategy winning big (in the non-ruin scenarios) contributes massively to the EV. If you care about EV, Kelly is not the winner.

  In short, Samuelson argues that there is no "universal" rational strategy. Rationality is defined by the agent's goals (Utility), not the system's dynamics.

  ---

  ### Part III: The Verdict

  I am going to pick a side. **Your friend is wrong.**

  The Kelly Criterion is not the theory of rational choice under uncertainty. **Expected Utility Theory (EUT) is the correct framework, and Kelly is merely a specific strategy within that framework.**

  Here is the defense of this position. The ergodicity crowd makes a category error: they confuse the *dynamics of the system* with the *goals of the agent*.

  It is true that wealth dynamics are multiplicative and non-ergodic. It is true that naive Expected Value (arithmetic mean) leads to ruin in repeated betting. The ergodicity critique successfully kills *naive* EV maximization. However, it fails to kill Expected *Utility* Theory.

  EUT does not require you to maximize arithmetic wealth. It requires you to maximize expected *satisfaction*. If you plug a logarithmic utility function into EUT, you get Kelly. If you plug in a different utility function, you get a different betting size. Both are "rational" if they match the agent's true preferences.

  The claim that Kelly is "utility-free" is false. It implicitly assumes your utility function is: "Maximize the growth rate of my wealth over an infinite horizon." That is a specific preference, not a law of physics.

  Consider a counter-example: You are 90 years old. You have \$1 million. You want to leave the maximum possible inheritance to your heirs, but you also want to spend \$50,000 this year on a trip. A Kelly strategy might tell you to invest aggressively for growth. But if your utility function values the *trip* more than the *marginal growth* of the inheritance, Kelly is irrational for *you*.

  Or consider a venture capitalist. They operate in a power-law world. They expect most bets to go to zero (ruin). They do not use Kelly sizing on individual deals because their utility function is based on portfolio-level returns and carry structures, not individual survival.

  To claim Kelly is "THE rational strategy" is to claim that every rational agent's only goal is long-term solvency and geometric growth. That is empirically false. People have finite horizons, specific liabilities, and non-monetary goals.

  ### Part IV: The Conditions of Victory

  However, saying "EUT wins" is too vague. You asked for the conditions under which one framework should win out over the other, like a doctor prescribing surgery. Here is the prescription.

  **Use Kelly (Geometric Rationality) IF AND ONLY IF:**
  1.  **Repeated Play:** You are facing a sequence of similar bets, not a one-off decision.
  2.  **Multiplicative Dynamics:** Your wealth compounds; losses reduce the base for future gains (e.g., stock market, professional gambling).
  3.  **No Finite Goal:** You do not have a specific target (e.g., "I need \$5M by 2030") or a specific liability. Your goal is simply "more is better" indefinitely.
  4.  **Survival is Paramount:** You view "ruin" (losing your ability to play) as infinitely bad.

  **Use General Expected Utility (with custom risk parameters) IF:**
  1.  **Finite Horizon:** You have a deadline (retirement, buying a house, a fund's liquidation date). In finite time, "full Kelly" is often too volatile; "Fractional Kelly" or mean-variance optimization is superior.
  2.  **Additive Payoffs:** The bet does not compound. (e.g., a salary negotiation, a fixed-odds bet where you can replenish capital from outside sources).
  3.  **Specific Liabilities:** You have a binary need (e.g., "I must have \$100k for surgery"). Here, you should maximize the *probability* of reaching that threshold, even if it means betting more than Kelly (to get there faster) or less (to ensure safety).
  4.  **Market Impact:** If your bets are large enough to move the market, the assumption that you can always get the same odds breaks down, and Kelly's math fails.

  ### Final Diagnosis

  Your friend is suffering from "physics envy." They want rational choice to be a law of nature, like gravity. It isn't. It's a tool for decision-making.

  The ergodicity argument is a vital **discipline** for Expected Utility Theory. It corrects the naive mistake of using arithmetic averages in multiplicative systems. It tells us that for *most* wealth-accumulation problems, Log-Utility is the most *robust* assumption because survival is a prerequisite for enjoyment.

  But it is not the *master*. Expected Utility Theory remains the correct meta-framework because it allows you to define what "winning" means. Kelly tells you how to run the race; EUT tells you whether you want to run it, how fast, and what happens if you trip.

  **Prescription:** Tell your friend to use Kelly to size his trades, but to stop claiming it's a moral imperative. He is maximizing log-wealth because he *chooses* to, not because the universe forces him to.
