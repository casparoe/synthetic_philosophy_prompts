prompt: |-
  I host a philosophy podcast, and next week's guest is a philosopher of psychiatry known for extending Ian Hacking's looping-effects framework to argue that categories such as ADHD, PTSD, and dissociative identity disorder are 'interactive kinds' whose targets shift as the diagnosis loops back through clinicians, institutions, and the diagnosed themselves. Whenever a skeptic suggests this makes psychiatric illness unreal, she has a practiced reply: that looping is a claim about the kind, not about the suffering it tracks. Draft eight to ten interview questions that make that reply progressively harder to lean on. At least one should press on what work the interactive/indifferent-kinds distinction is actually doing there; one should use the well-documented retreat of the multiple-personality-disorder diagnosis after the 1990s as a test case for whether looping can run in reverse; and one should ask her to name a psychiatric kind, if any, that could never loop, and defend the choice. Give each question a follow-up keyed to the answer she's most likely to give.
