answer: |-
  Here is the verdict: **Your hunch is correct, but with a crucial caveat.**

  On the specific technical metric of **logical coherence regarding higher-order vagueness (HOV)**, Epistemicism handles the problem better than Supervaluationism. Supervaluationism inevitably reintroduces sharp boundaries at the meta-linguistic level (the boundary of "admissible precisifications"), which contradicts its own motivation to preserve the intuition that vagueness is boundaryless. Epistemicism avoids this contradiction by accepting sharp boundaries at every order, rendering HOV merely a matter of higher-order ignorance.

  However, Epistemicism only "wins" by dissolving the phenomenon of HOV rather than explaining it. If your seminar cares more about capturing the *phenomenology* of vagueness than logical tidiness, Supervaluationism still has the edge, despite the technical cost.

  Here is the breakdown for your handout, arguing why Epistemicism is the more robust solution to HOV, followed by the necessary pushback.

  ### 1. The Supervaluationist Trap (Why you are right)
  Supervaluationism (Fine, Keefe) attempts to save classical logic without accepting sharp boundaries in the world. It defines truth as **supertruth** (truth on all admissible precisifications). To handle HOV, it introduces a "definitely" operator ($D$). $Dp$ is true if $p$ is true on all admissible precisifications.

  The problem arises when we ask: **What determines the set of admissible precisifications?**

  *   **The Sharp Meta-Boundary:** For the semantics to work, there must be a fact of the matter about which precisifications are "admissible" and which are not. If there is a sharp cut-off between admissible and inadmissible precisifications, then there is a sharp cut-off for the "definitely" operator. This means there is a specific hair count $n$ where someone goes from "definitely bald" to "not definitely bald."
  *   **The Contradiction:** This smuggles a sharp boundary back in at the higher order. Supervaluationism claims to model the intuition that there are no sharp boundaries, yet its formal semantics requires a sharp boundary to define the set of precisifications.
  *   **Keefe's Defense:** Rosanna Keefe argues that Supervaluationism can accommodate HOV by making the *boundary of admissibility* itself vague. But this leads to a regress. If the boundary of admissibility is vague, we need a set of precisifications for *that*, and so on. To stop the regress and make the logic work, you eventually need a sharp cut-off somewhere in the hierarchy.

  **Verdict on Supervaluationism:** It tries to have its cake (no sharp boundaries) and eat it too (classical logic/semantics). HOV exposes that the "no sharp boundaries" claim is false at the meta-level.

  ### 2. The Epistemicist Consistency (Why it handles HOV better)
  Williamson's Epistemicism accepts that there is a sharp boundary for "bald." Consequently, it accepts there is a sharp boundary for "definitely bald."

  *   **Dissolving HOV:** Epistemicism denies that higher-order vagueness exists as an ontological or semantic feature. Instead, it treats HOV as **higher-order ignorance**. There is a sharp line between "knowably bald" and "not knowably bald." We just can't locate it.
  *   **Margin for Error:** Williamson explains this via "margin for error" principles. To know you are bald, your belief must be safe (it couldn't easily be false). Near the boundary, your belief isn't safe. Therefore, knowledge drops off sharply before the truth drops off.
  *   **Logical Hygiene:** Because Epistemicism retains classical bivalence at every level, it does not face the regress problem. The boundary between "borderline" and "clear" is just as sharp as the boundary between "bald" and "not bald." It is consistent all the way up.

  **Verdict on Epistemicism:** It is theoretically cleaner. It does not smuggle in boundaries; it openly acknowledges them at every order. It handles HOV by reducing it to the same mechanism as first-order vagueness (ignorance of a sharp cut-off).

  ### 3. The Pushback (Where your hunch might be too quick)
  While Epistemicism wins on **coherence**, you should warn your students that this victory might be pyrrhic.

  *   **Explaining vs. Eliminating:** Supervaluationism fails to formally model HOV without contradiction, *but* it correctly identifies that HOV is a real feature of language that needs modeling. Epistemicism "handles" HOV only by denying it exists. For many philosophers, a theory that explains the coherence of vagueness by denying the existence of higher-order vagueness is failing to explain *vagueness*.
  *   **The Implausibility Cost:** Epistemicism handles HOV better logically, but at the cost of extreme metaphysical implausibility. It requires us to believe there is a specific nanosecond where a child becomes an adult, or a specific molecule whose removal turns a heap into a non-heap, *and* a specific point where we stop knowing it. Supervaluationism is willing to break its own formal purity to avoid this absurdity.
  *   **The "Definitely" Operator:** In Supervaluationism, the failure of $DDp \leftrightarrow Dp$ (iterating the definitely operator) is a feature, not a bug, intended to model the fading out of definiteness. Epistemicism makes $D$ collapse into knowledge, which is crisp. If your seminar values the *gradient* nature of vagueness, Supervaluationism captures the *feel* of HOV better, even if the math wobbles.

  ### Final Recommendation for the Handout
  **Give the edge to Epistemicism on the specific question of HOV coherence.**

  Your hunch is philosophically sound: Supervaluationism is vulnerable to the charge that it creates a "sharp boundary of admissibility," which is inconsistent with the spirit of the view. Epistemicism is consistent because it is ruthless; it applies the same sharp-boundary logic to all orders.

  **How to frame it:**
  > "Supervaluationism attempts to model the boundarylessness of vagueness but requires a sharp boundary to define its semantics (the set of admissible precisifications). Epistemicism accepts sharp boundaries at all orders, treating higher-order vagueness as higher-order ignorance. Consequently, **Epistemicism provides a logically consistent account of higher-order vagueness, whereas Supervaluationism faces a dilemma: either accept sharp meta-boundaries (contradicting its motivation) or face semantic regress.** However, Epistemicism achieves this consistency only by denying the phenomenological reality of higher-order vagueness."

  This gives your students a clear verdict (Epistemicism wins on logic) while preserving the critical tension (Epistemicism loses on plausibility).
