answer: |-
  **Seminar Handout: The Verisimilitude Trap**
  **Topic:** Popper's Definition of Truthlikeness & The Tichý/Miller Impossibility Result
  **Date:** Week 4

  ---

  ### 1. The Setup: A Simple World
  Let's abandon the weather. Instead, imagine a control panel with **three binary switches**: $S_1$, $S_2$, and $S_3$.
  Each switch can be either **UP** ($p, q, r$) or **DOWN** ($\neg p, \neg q, \neg r$).

  **The Truth ($T$):**
  In the actual world, all three switches are **UP**.
  $$T = p \land q \land r$$

  ### 2. The Competing Theories
  We have two engineers proposing theories about the state of the panel. Both are technically false, but one seems much better than the other.

  **Theory $\alpha$ (The "Close" Theory):**
  Engineer $\alpha$ claims: $S_1$ is UP, $S_2$ is UP, but $S_3$ is DOWN.
  $$\alpha = p \land q \land \neg r$$
  *Intuition:* This theory gets 2 out of 3 atomic facts right. It is very close to the truth.

  **Theory $\beta$ (The "Far" Theory):**
  Engineer $\beta$ claims: All switches are DOWN.
  $$\beta = \neg p \land \neg q \land \neg r$$
  *Intuition:* This theory gets 0 out of 3 atomic facts right. It is far from the truth.

  **Our Goal:** We want Popper's definition of verisimilitude ($Vs$) to confirm our intuition: that $Vs(\alpha) > Vs(\beta)$.

  ---

  ### 3. Running Popper's Machinery
  Recall Popper's qualitative definition (1963). For $\alpha$ to have more verisimilitude than $\beta$, the following conditions must be met:

  1.  **Truth Content ($Ct_T$):** $\alpha$ must entail at least as many true sentences as $\beta$ (and strictly more in one formulation).
  2.  **Falsity Content ($Ct_F$):** $\alpha$ must entail *no more* false sentences than $\beta$ (and strictly fewer in one formulation).

  *Crucial Note:* "Content" does not just mean the basic claims ($p, q, r$). It includes **every logical consequence** the theory entails (e.g., disjunctions, conjunctions).

  #### Step A: Comparing Truth Content
  *   **Theory $\alpha$:** Entails $p$ (True). Entails $q$ (True). Entails $(p \lor r)$ (True).
  *   **Theory $\beta$:** Entails $\neg p$ (False). Entails $\neg q$ (False). It does **not** entail $p$.
  *   **Verdict:** $\alpha$ has strictly more truth content than $\beta$.
      *   *Status:* **PASS.** (This is the good news for $\alpha$).

  #### Step B: Comparing Falsity Content
  This is where the machinery breaks. We need to check if the set of false consequences of $\alpha$ is a subset of the false consequences of $\beta$.
  *   **Condition for $\alpha$ to win:** $Ct_F(\alpha) \subseteq Ct_F(\beta)$.
  *   **Translation:** Every false sentence entailed by $\alpha$ must also be entailed by $\beta$.

  Let's look at the false sentences each theory generates.

  1.  **Shared Falsity:**
      *   Both theories entail $\neg r$ (since both claim $S_3$ is DOWN).
      *   $\neg r$ is False.
      *   So far, they are tied.

  2.  **Unique Falsity in $\beta$:**
      *   $\beta$ entails $\neg p$. This is False.
      *   $\alpha$ does *not* entail $\neg p$ (it entails $p$).
      *   So $\beta$ has some falsity content $\alpha$ lacks. This helps $\alpha$'s case.

  3.  **The "Poison Pill" (Unique Falsity in $\alpha$):**
      *   Remember that $\alpha$ entails $p$ (which is **True**).
      *   Remember that $\alpha$ entails $\neg r$ (which is **False**).
      *   Therefore, $\alpha$ entails the conjunction: **$(p \land \neg r)$**.
      *   **Is $(p \land \neg r)$ False?** Yes. (True $\land$ False = False).
      *   **Does $\beta$ entail $(p \land \neg r)$?**
          *   $\beta$ entails $\neg p$.
          *   A theory that entails $\neg p$ cannot entail a conjunction starting with $p$.
          *   Therefore, $\beta$ does **not** entail $(p \land \neg r)$.

  **The Collapse:**
  We have found a false sentence, $(p \land \neg r)$, that is in $Ct_F(\alpha)$ but **not** in $Ct_F(\beta)$.
  Consequently, $Ct_F(\alpha) \not\subseteq Ct_F(\beta)$.

  ### 4. The Verdict
  According to Popper's definition:
  *   $\alpha$ cannot be more verisimilar than $\beta$ (because $\alpha$ has extra falsity content).
  *   $\beta$ cannot be more verisimilar than $\alpha$ (because $\beta$ has extra falsity content *and* less truth content).

  **Result:** The theories are **incomparable**.

  Even though $\alpha$ is intuitively "closer to the truth" (2/3 correct vs 0/3 correct), Popper's formal machinery cannot rank it higher than the completely wrong theory $\beta$. In fact, Tichý and Miller proved that *no* false theory can ever be ranked as more verisimilar than *any other* false theory using this definition.

  ### 5. Discussion Questions for Next Week
  1.  **The Logic of the "Poison Pill":** Why does the fact that $\alpha$ gets something *right* ($p$) allow us to construct a *new* false sentence $(p \land \neg r)$ that $\beta$ doesn't entail? Does getting closer to the truth inevitably generate more specific errors?
  2.  **Atomic vs. Logical Content:** If we restricted "content" to only atomic sentences ($p, q, r$), would $\alpha$ win? Why does Popper insist on including all logical consequences?
  3.  **Fixing the Mess:** If Popper's account fails here, what property are we actually tracking when we say $\alpha$ is "closer" to $T$ than $\beta$? (Hint: Think about "distance" or "similarity" rather than "content subsets".)
