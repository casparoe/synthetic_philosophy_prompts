          *   Counterfactuals matter (if you *hadn't* tried, the outcome *would* have been different).
          *   Meaning is found in the chain, not outside it.
      *   **Conclusion:** Summarize the takeaway.

  5.  **Refining the Content (Self-Correction during drafting):**
