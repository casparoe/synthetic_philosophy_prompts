      *   *Mill's Philosophy:* Mill is a Utilitarian. Ultimate standard is happiness/well-being. However, he cares deeply about liberty and development.
      *   *Synthesis:* For Mill, these aren't mutually exclusive. The "worth" of the opinion is linked to the *good of the whole*. A wiser person contributes more to the general welfare. So, it's primarily epistemic/instrumental regarding the *outcome* (good governance), but framed as a matter of *justice* because ignoring superior competence harms the collective interest. It's a "qualified egalitarianism."
