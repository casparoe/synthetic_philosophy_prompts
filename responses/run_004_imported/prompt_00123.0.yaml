answer: |-
  This is the central and most intuitive objection to Evidential Cooperation in Large Worlds (ECL), and indeed to Evidential Decision Theory (EDT) and Functional Decision Theory (FDT) more broadly.

  The short answer is: **No, ECL does not require backward-in-time causation or magical physical influence.** It requires a shift in how we understand "probability" and "control" in the context of logical correlation.

  Here is a breakdown of why ECL proponents argue that cooperation is rational even without causal influence, and why it doesn't violate causal structure.

  ### 1. The Distinction: Causal Influence vs. Logical Correlation
  Your objection rests on **Causal Decision Theory (CDT)** intuition. CDT says: *I should only care about outcomes I can physically cause.* If I press a button here, and no signal reaches a distant agent, my button press cannot change their physical state.

  ECL relies on **Evidential** or **Functional Decision Theory**. These frameworks argue that agents should care about **logical correlations**, not just causal arrows.

  **The Calculator Analogy:**
  Imagine you and a distant counterpart both have identical calculators. You both type in `2 + 2`.
  *   You press `=` and see `4`.
  *   Did your pressing `=` *cause* the distant calculator to display `4`? No. There is no radio signal between them.
  *   However, does your result give you information about their result? Yes.
  *   If you somehow saw `5` on your screen, you would immediately know the distant calculator is broken or has different inputs.

  In ECL, agents are treated like calculators running a "decision algorithm." If you and the distant agent are sufficiently similar (running similar code on similar inputs), your decisions are **logically correlated**. By choosing to cooperate, you are not *sending a message*; you are **executing a function**. If the function outputs "Cooperate" in your location, it is highly probable it outputs "Cooperate" in theirs, because it is the *same function*.

  ### 2. Epistemic vs. Objective Probability
  You asked: *"How can cooperating on my end possibly raise the **actual probability** that they cooperate too?"*

  This depends on what you mean by "actual probability."
  *   **Objective Chance (Propensity):** In a deterministic universe, the probability is either 0 or 1. The outcome is already fixed by the initial conditions of the universe. In this view, *no* decision theory changes the "actual" outcome; you were always going to do what you do.
  *   **Subjective Credence (Bayesian):** This is the probability *from your perspective* at the moment of decision. You do not know what you will decide until you deliberate.

  ECL operates on **subjective credence**. When you deliberate, you are essentially asking: *"In the set of possible worlds consistent with my current knowledge, what happens if I output 'Cooperate'?"*

  Because your decision is logically correlated with the distant agent's decision, the set of worlds where you cooperate is largely the same set of worlds where they cooperate. Therefore, conditional on you cooperating, the probability (your credence) that they cooperate goes up. You aren't changing the fixed future; you are selecting which logical fact becomes true about your algorithm.

  ### 3. Why It Isn't Backward Causation
  Backward causation implies that an effect precedes its cause in time, violating the light cone structure of relativity. ECL does not claim your decision travels back in time to influence their past.

  Instead, it posits a **common cause** structure:
  1.  **Common Cause:** The laws of physics and the initial conditions of the universe (or the design of the agents).
  2.  **Effect A:** Your decision to cooperate.
  3.  **Effect B:** Their decision to cooperate.

  In standard statistics, conditioning on one effect (A) updates your belief about the other effect (B), even if A doesn't cause B.
  *   *Standard View:* I observe A, so I update my belief about B. But I can't *choose* A to manipulate B.
  *   *ECL/FDT View:* I am not merely observing A; I am **computing** A. Because A and B are outputs of the same logical computation, by determining A, I am logically determining B.

  This is often called **subjunctive dependence**. It's not that my choice reaches out and grabs them; it's that our choices are two instances of the same abstract truth.

  ### 4. The "Large World" Multiplier
  The "Large World" hypothesis (often associated with infinite cosmology or the multiverse) suggests there are vastly many copies of you or agents very similar to you.

  *   **Causal View:** I sacrifice 1 unit of utility. I gain 0 units from the distant agent (no causal link). Net: -1. Defect.
  *   **ECL View:** I sacrifice 1 unit of utility. Because there are $N$ copies of me, and my decision is logically correlated with all of them, $N$ agents cooperate. I gain $N \times 10$ units of utility (distributed among the copies, which I care about via a "cosmic" utility function). Net: Positive. Cooperate.

  The "magic" isn't in the signal transmission; it's in the **scale of correlation**. If the universe is large enough, the number of logically correlated agents swamps the local causal inefficacy.

  ### 5. Remaining Skepticism (Steel-manning your view)
  Your intuition aligns with **Causal Decision Theory (CDT)**, which remains the dominant view in classical economics and many philosophical circles. CDT proponents argue:
  *   **The Tickling Defense:** Correlation is not control. Just because my sneeze correlates with your sneeze (due to a common virus) doesn't mean I should sneeze to make you sneeze.
  *   **Spurious Correlations:** How do you know the correlation is real? If you assume correlation where none exists, you become a "sucker" who cooperates while defectors exploit you.
  *   **Identity:** Do I really care about the utility of a causally disconnected copy of me? If we can never interact, why do I value their outcome?

  ECL proponents answer that in a sufficiently large world, "copies" are not just similar; they are **algorithmically identical**. Therefore, distinguishing between "me" and "them" is a logical error similar to distinguishing between "me now" and "me in five minutes."

  ### Summary
  ECL does not require backward causation. It requires accepting that:
  1.  **Decisions are logical outputs**, not just physical events.
  2.  **Probability is epistemic**, reflecting your uncertainty about the output of your own algorithm.
  3.  **Rationality involves maximizing expected utility** based on logical correlations (EDT/FDT), not just causal arrows (CDT).

  If you reject EDT/FDT in favor of CDT, ECL indeed looks like incoherent magic. If you accept that logical correlation can be action-guiding, ECL is a consistent application of that principle to cosmology.
