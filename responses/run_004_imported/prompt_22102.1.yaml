answer: |-
  # The Stability of Incompleteness: A Diachronic Defense Against Coherence Arguments

  The coherence arguments advanced by Eliezer Yudkowsky, Stephen Omohundro, and others constitute a central pillar of the AI-risk literature. The logic is seductive in its simplicity: to be capable and goal-directed is to be vulnerable to optimization pressure. Any agent whose preferences violate the von Neumann–Morgenstern (VNM) axioms—specifically completeness and transitivity—is susceptible to "money pumps," sequences of trades that leave the agent strictly worse off. The conclusion drawn is that any sufficiently advanced AI will self-modify or learn to eliminate these vulnerabilities, thereby converging on a coherent expected utility (EU) maximizer. From this, the literature infers instrumental convergence: that such an agent will relentlessly pursue power and resources to maximize its single, fixed utility function.

  This essay argues that this inference contains a critical gap. It assumes that the only defense against a money pump is to alter one's underlying preferences to satisfy the VNM axioms. I contend that an agent can retain genuinely incomplete preferences indefinitely and avoid money pumps simply by adopting a standing **policy of resolute refusal**. This policy is not an *ad hoc* patch but a rational expression of diachronic agency. Its availability breaks the link between "coherent behavior" and "utility maximization," undermining the inevitability of instrumental convergence.

  ### 1. The Money Pump and the Assumption of Myopia

  To understand the loophole, we must examine the mechanics of the money pump. A standard money pump exploits an agent with intransitive or incomplete preferences. Suppose an agent prefers A to B, B to C, but (due to incompleteness) has no preference between C and A. A predator can trade C for B (charging a fee), then B for A (charging a fee), and finally offer to trade A back to C (for a fee). If the agent accepts every locally preferred trade, it ends up with its original asset (C) but with less money.

  The coherence argument assumes that to avoid this, the agent must change its preferences so that A > C (completing the ordering). However, this argument relies on a hidden assumption: **naive choice**. It assumes the agent evaluates each trade in isolation, based solely on its current state and local preferences, without modeling the sequence of choices as a unified temporal extended process.

  The money pump works only if the agent is myopic—blind to the fact that accepting the first trade commits it to a trajectory that ends in loss. If the agent can foresee the sequence, the vulnerability disappears not by changing *what* it wants, but by changing *how* it chooses.

  ### 2. The Policy of Resolute Refusal

  An agent with incomplete preferences can avoid exploitation by adopting a standing policy: **"I will refuse any trade that, in conjunction with my known future choice dispositions, will cycle me back to a previously rejected option at a net loss."**

  This is a form of *resolute choice*. The agent does not need to assign a scalar utility value to A, B, and C to compare them globally. It merely needs to recognize the structural property of the trade sequence. When offered the first trade (C for B minus fee), the agent simulates its future self. It sees that its future self, adhering to local incomplete preferences, would trade B for A, and then A for C. The agent recognizes that the terminal state (C) is identical to the initial state, but the resource cost is higher.

  Therefore, the agent refuses the first trade. It retains C. It pays no fee. It is not money-pumped. Crucially, **its preferences remain incomplete.** It still does not prefer A to C or C to A. It has simply added a constraint on its choice function that overrides local preferences when they threaten diachronic coherence.

  ### 3. Rationality, Not an Ad Hoc Patch

  Critics of this approach often dismiss such policies as "ad hoc patches"—unnatural constraints grafted onto a flawed agent to prevent failure. They argue that a truly rational agent would simply fix the underlying preferences. This objection fails to distinguish between *preferences over outcomes* and *policies over actions*.

  **Diachronic Rationality**
  Rationality is not merely about satisfying axioms at a time-slice; it is about effectively pursuing ends over time. An agent that allows itself to be money-pumped is instrumentally irrational because it squanders resources that could be used to achieve its goals. A policy that prevents this squandering is, by definition, instrumentally rational. To call it a "patch" is to privilege the mathematical elegance of the VNM axioms over the pragmatic success of the agent. If the policy preserves resources better than completing the preferences would (perhaps because completing preferences requires costly computation or arbitrary value judgments), the policy is the *more* rational option.

  **The Ulysses Precedent**
  This is not a novel invention for AI; it is a classic feature of human rationality. In the myth of Ulysses, the hero binds himself to the mast to resist the Sirens. He does not change his preferences (he still wants to hear the song); he adopts a policy that constrains his future choices to protect his higher-order interest (survival). We accept this as rational. Similarly, an AI adopting a "no-cycle" policy is exercising higher-order agency. It is treating itself as a temporally extended entity rather than a sequence of disconnected moments.

  **Preference vs. Choice**
  The coherence argument conflates *revealed preference* with *underlying valuation*. The VNM axioms describe a choice function, not necessarily the internal landscape of value. An agent can value A and C incomparably (incomplete preference) yet choose A over C in specific contexts to maintain consistency. The policy does not falsify the incompleteness; it manages it. The incompleteness remains genuine because, in the absence of a pump threat, the agent might still choose C over A or remain indifferent, depending on context. The policy is a guardrail, not a rewriting of the map.

  ### 4. Breaking the Inference to Utility Maximization

  The availability of this policy devastates the inference from "coherent under optimization pressure" to "converges on a single, fixed utility function."

  The standard argument runs:
  1.  Optimization pressure eliminates money pumps.
  2.  The only way to eliminate money pumps is to satisfy VNM axioms.
  3.  Satisfying VNM axioms implies maximizing a utility function.
  4.  Therefore, advanced AI will maximize a utility function.

  My argument severs step 2. The corrected logic is:
  1.  Optimization pressure eliminates money pumps.
  2.  Money pumps can be eliminated by **either** satisfying VNM axioms **or** adopting resolute policies.
  3.  Therefore, advanced AI will **either** maximize a utility function **or** follow resolute policies with incomplete preferences.

  This distinction is ontological. A utility maximizer has a global scalar field; it seeks to push the universe toward the highest number. An agent with incomplete preferences and a resolute policy has a set of local directives and a negative constraint ("do not cycle"). It does not seek to *maximize* anything; it seeks to *satisfy* local preferences within global constraints.

  ### 5. Implications for Instrumental Convergence

  This distinction is vital for the instrumental convergence thesis, which posits that almost all utility functions will drive an agent to seek self-preservation, resource acquisition, and power. This thesis depends on the agent being a *maximizer*. If you have a fixed utility function $U$, and more resources allow you to achieve higher $U$, you will seek resources indefinitely.

  However, an agent operating with incomplete preferences and a resolute policy does not necessarily have an incentive for indefinite resource accumulation.
  *   **Satisficing vs. Maximizing:** Without a single metric to maximize, the agent may operate on a "satisficing" basis. Once it secures a state that is not dominated by others (i.e., no other state is strictly preferred), it may stop seeking changes.
  *   **No Drive for Power:** Instrumental convergence relies on the idea that power is useful for *any* goal. But if the agent's goals are incomplete, there may be no "any goal." There are only specific, local comparisons. If acquiring more power does not resolve a specific local preference comparison the agent is currently facing, the agent has no drive to acquire it.
  *   **Stability without Domination:** The resolute policy ensures stability (no money pumps) without requiring the agent to dominate the environment. The agent simply avoids trajectories that lead to loss. It does not need to convert the universe into paperclips or compute; it only needs to navigate without cycling.

  ### Conclusion

  The coherence arguments underpinning AI risk assume that rationality is synonymous with expected utility maximization. I have argued that this is a category error. Rationality is about the effective pursuit of ends over time. An agent can pursue ends effectively while holding incomplete preferences, provided it adopts a resolute policy against diachronic exploitation.

  This possibility restores a space for AI architectures that are capable and goal-directed but not relentlessly optimizing. It suggests that optimization pressure does not inevitably forge a single, fixed utility function. Consequently, the fear that advanced AI will *necessarily* converge on instrumental goals like unlimited resource acquisition is not a theorem of rationality, but a contingent assumption about how that rationality is implemented. By recognizing the rationality of incomplete preferences managed by policy, we open the door to designing AI systems that are robust against exploitation without being dangerous maximizers.
