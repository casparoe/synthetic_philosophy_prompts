      *   **Incomplete Information (Kreps et al.):** If there's even a tiny probability that the opponent is *not* a standard payoff-maximizer (e.g., they are altruistic or a "tit-for-tat" type), the rational strategy for a standard agent changes to *cooperate* for most of the game to build a reputation. This is a *normative* result within game theory, not just an empirical observation.
      *   **Decision Theory (TDT/UDT):** From a LessWrong perspective, CDT (which supports BI) is often considered inferior to TDT or UDT. TDT/UDT agents might cooperate in Prisoner's Dilemma-like structures if they reason about logical correlation. While Centipede isn't a perfect PD, the logic of "if I cooperate, does that imply my opponent will?" matters.
      *   **Trembling Hand/Perfection:** If there's a non-zero chance of a "tremble" (accidental move), BI can become unstable or yield different predictions depending on the tremble structure.
