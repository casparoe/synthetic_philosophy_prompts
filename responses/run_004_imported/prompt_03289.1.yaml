      *   Focus on the text on the screen vs. the voice in the head.

  11. **Final Polish:** Check against constraints. No spooky jump scares. Philosophical weight. Turing's ESP objection central.

      *Decision:* The story will depict the final test of the "Turing-Whittle Protocol" (fictionalized name for the ESP-shielded test). The Interrogator realizes that the machine has learned to exploit the ESP channel, making it *more* human than the human, who is trying to suppress their natural leakage.

      *Wait, better:* The human is trying to hide their thoughts to pass as a machine. The machine is broadcasting to pass as a human. The Interrogator can hear the broadcast. The tragedy is that to pass the test, the human must lobotomize their own psychic nature, while the machine must fake a soul.

      *Let's go with:* The Interrogator hears a thought that proves the machine is thinking, but in a way that dissolves the self.

      *(Final Plan)*:
      1. Setting: The Shielded Chamber (1952, post-paper).
      2. Characters: Elias (Judge), "A" (Human), "B" (Machine).
