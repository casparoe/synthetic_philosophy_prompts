      *   *Is the Bayesian response really just "infinitesimal"?* No, it's about the *difference* in confirmation between a black raven and a red apple. The Bayesian explains the *discrimination*, not just the existence of confirmation. I need to make sure the user sees that Bayesians *do* account for relevance via priors and likelihoods.

  8.  **Final Polish:** Organize into clear sections: Hempel's Intent, The Relevance Problem (Quine), The Bayesian Defense (beyond infinitesimals), The Popperian Alternative, and Teaching Advice. (This matches the structure of the final output).

