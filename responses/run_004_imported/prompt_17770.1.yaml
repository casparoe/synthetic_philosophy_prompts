answer: |-
  This is a sharp philosophical intuition, and you are in good company. While the "same fault" restriction (often called the *tu quoque* constraint) is the standard view in contemporary literature (defended by philosophers like R. Jay Wallace, Gary Watson, and others), critics like Kyle Fritz and Daniel Bell have noted exactly the tension you point out.

  To argue for your position—that the logic of standing naturally collapses into global skepticism—we need to attack the **principled distinction** between "same fault" hypocrisy and "different fault" hypocrisy. We need to show that the underlying mechanism that strips standing in cases of hypocrisy is **holistic**, not **specific**.

  Here is an argument for why the "same fault" restriction is indeed an ad hoc patch, and why the logic of standing points toward skepticism.

  ### 1. The True Source of Standing Loss: Disregard for the Normative Order
  The standard explanation for why hypocrisy undermines standing is that the hypocrite implicitly claims an **exemption** from a moral norm they are enforcing. By blaming you for lying while they lie, they communicate: *"This rule binds you, but it does not bind me."*

  The "same fault" restriction assumes that this message is only sent when the rule being enforced is the *same* rule being violated. But this misunderstands the nature of moral authority.

  **The Argument:**
  Moral standing is not merely authority over specific rules (e.g., "The Rule Against Lying"); it is authority over the **moral law as such**. When you blame someone, you are not just invoking a specific prohibition; you are invoking your status as a moral agent entitled to hold others to moral standards.

  If you violate *any* serious moral norm, you demonstrate a **generalized disregard for the bindingness of moral obligations**.
  *   If I cheat on my taxes and then blame you for lying, I am not necessarily saying "Tax law doesn't bind me, but truth-telling does."
  *   I am saying, "I am willing to violate moral obligations when it suits me."

  If your authority to blame rests on your commitment to morality, then a breach in *any* part of that commitment undermines the foundation of the authority. A judge who takes bribes in civil cases loses the standing to preside over criminal cases, not because bribery is the "same fault" as murder, but because their **integrity as a judge** is compromised. Similarly, a moral agent who violates *any* norm compromises their **integrity as a moral enforcer**.

  ### 2. The Arbitrariness of "Relevance"
  Defenders of the restriction argue that faults must be "relevantly similar." But "relevance" here is doing all the heavy lifting, and it is notoriously slippery.

  *   **The Silo Problem:** The restriction assumes moral virtues are siloed. It assumes I can be "deficient in honesty" but "fully authoritative on kindness." But moral character is arguably holistic. If I lack the self-control or respect for others required to be honest, do I not also lack the moral seriousness required to blame you for being unkind?
  *   **The Common Root:** Most moral faults share a common root: selfishness, lack of empathy, or weak will. If I blame you for an act of selfishness while I am guilty of a *different* act of selfishness, the hypocrisy is structurally identical to the "same fault" case. I am condemning in you the very disposition that motivates me.

  If the loss of standing is caused by the **vice** (e.g., selfishness) rather than the **specific action** (e.g., lying), then the "same fault" restriction collapses. Any vice that indicates a lack of moral commitment undermines standing to blame for any other vice indicating a lack of moral commitment. Since most blameworthy acts stem from similar underlying vices, the restriction evaporates.

  ### 3. The "Clean Hands" Doctrine vs. Moral Community
  The only reason philosophers resist the skeptical conclusion is pragmatic, not principled. They argue that if everyone lost standing to blame, the **moral community** would dissolve. We need blame to regulate behavior and affirm values.

  However, this is a **consequentialist patch** on a **deontological problem**.
  *   **The Principled View:** Standing is a matter of right/authority. If I lack the authority (due to my own flaws), I lack the right to blame.
  *   **The Pragmatic Patch:** "Well, if we follow the principle strictly, society breaks, so let's pretend the flaws don't count unless they match."

  You can argue that this is intellectually dishonest. If the *principle* of standing requires moral authority, and moral authority requires clean hands, then the fact that society would suffer without blame is irrelevant to whether I *have* standing. It only explains why we might *pretend* I have standing.

  This leads to the skeptical conclusion: **We do have a moral obligation to hold each other accountable, but almost none of us actually possess the standing to do so.** We are stuck in a paradox where blame is necessary but illegitimate.

  ### 4. The Epistemic vs. Normative Confusion
  One defense of the "same fault" view is that if I lie, I am uniquely unqualified to judge *lying* because I don't understand the harm or I am biased.

  But this confuses **epistemic standing** (knowing what you're talking about) with **normative standing** (having the right to speak).
  *   A reformed alcoholic has high epistemic standing on the dangers of drink, but does a *current* alcoholic lose the right to warn you about *drug* abuse?
  *   If standing is normative (about authority), then my current violation of *any* norm suggests I do not respect the system that grants me authority.

  If I am actively violating moral norms, I am effectively a "fugitive from justice." A fugitive lacks the standing to demand justice for others, regardless of whether the crime they fled is the same as the crime committed against the victim. Their status as an outlaw is general, not specific.

  ### 5. Conclusion: The Skeptical Implication
  If we accept that standing is grounded in **moral integrity** and **commitment to the normative order**, then the "same fault" restriction cannot hold.

  1.  Standing requires a commitment to the bindingness of moral norms.
  2.  Violating *any* significant moral norm demonstrates a lack of commitment to the bindingness of moral norms (it shows you treat morality as optional).
  3.  Therefore, violating *any* significant moral norm undermines standing.
  4.  Everyone violates some significant moral norm.
  5.  **Therefore, no one has standing to blame.**

  The "same fault" restriction is indeed an ad hoc rescue mission. It is an attempt to save the *practice* of blame from the *logic* of standing. If you follow the logic where it leads, you arrive at a world where blame is almost always morally illegitimate, rendering us all silent in the face of wrongdoing because our own hands are never quite clean enough to point the finger.

  This doesn't mean we shouldn't hold people accountable, but it suggests we must find a justification for doing so that doesn't rely on "standing" in the traditional sense—perhaps shifting toward a view of blame as a **forward-looking tool for moral repair** rather than a **backward-looking assertion of authority**. But as long as we define standing as a form of moral authority, the skeptic wins.
