      *   *Premise 2:* Moral authority is holistic. You cannot compartmentalize moral integrity into silos (e.g., "honesty integrity" vs. "kindness integrity"). A breach in one area signals a disregard for the moral law *as such*.
      *   *Premise 3:* Everyone violates *some* moral norm (Universal Imperfection).
      *   *Conclusion:* Therefore, everyone lacks the moral authority required for standing.

  5.  **Address the "Ad Hoc" Charge:**
      *   Why is "same fault" arbitrary? Because the *attitude* of the hypocrite (disregard for morality) is the same whether the faults match or not.
