answer: |-
  Here are ten interview questions designed for a rationalist and quant-minded audience, structured to move from foundational intuitions to technical stress tests, with follow-ups tailored to anticipate the guest's standard defenses.

  ### Part I: The Normative Force of the Dutch Book

  **1. The "Expert" Intuition**
  "The standard gloss on the Reflection Principle is that you should treat your future self as a recognized expert, similar to how Lewis's Principal Principle tells us to defer to objective chance. But in prediction markets, we defer to experts because they have *information* we lack. If I know my future credence will be 0.8, isn't that solely because I expect to have seen evidence I haven't seen yet? If so, isn't Reflection just a derivative rule of Conditionalization, rather than a fundamental constraint on rationality itself?"

  *   **Follow-up:** "If you say it's fundamental and not just derivative, does that mean there are cases where I should defer to my future self *even if* I don't think they have better evidence, simply to avoid incoherence?"

  **2. Epistemic Defect vs. Pragmatic Loss**
  "Your primary defense of Reflection relies on the diachronic Dutch book argument: if I violate Reflection, a bookie can construct a series of bets guaranteeing I lose money. But as an engineer, I see a distinction between a system that is 'broken' and a system that is 'exploitable by an adversary with a specific attack vector.' Does violating Reflection actually indicate an *epistemic* defect in my belief state, or does it merely show I'm vulnerable to a specific pragmatic trap that wouldn't exist if the bookie didn't have access to my future credences?"

  *   **Follow-up:** "I anticipate your response is that a rational agent shouldn't be guaranteed to lose money no matter what happens. But if the 'guarantee' only holds because the bookie knows my future mental state—a state I don't currently control—isn't the defect in the *environment* allowing that bet, rather than in my current credence?"

  **3. The Source of the "Guarantee"**
  "Following up on that: In a standard synchronic Dutch book, the loss is guaranteed by the logic of probability at a single moment. In the diachronic case, the loss is guaranteed by the *trajectory* of my beliefs. If I violate Reflection, I'm essentially betting against my own future update rule. If I believe my future self is irrational (or just different), why is it a requirement of *current* rationality to subsidize my future self's betting position?"

  *   **Follow-up:** "So, are you arguing that rationality requires a kind of diachronic solidarity, where I am morally or logically obligated to fund my future self's positions even if I currently suspect them?"

  ### Part II: The Proviso and Triviality

  **4. The "Rational Updating" Proviso**
  "Reflection is usually qualified with a proviso: it only applies if you expect your future credence to be the result of rational updating on new evidence, not memory loss, manipulation, or drugs. My concern is that this proviso might be doing all the work. If the principle effectively says 'Defer to your future self, unless your future self is compromised,' haven't we reduced Reflection to 'Defer to your future self, except when you shouldn't'?"

  *   **Follow-up:** "If the proviso is doing the heavy lifting, what substantive work is left for the Reflection Principle itself to do? Is it anything more than a label for 'cases where conditionalization applies'?"

  **5. Circularity and Definition**
  "To sharpen that point: How do we identify 'rational updating' without already presupposing Reflection? If we define a 'rational update' as one that satisfies Reflection, then the principle becomes tautological. If we define it independently (e.g., via Conditionalization), then isn't Reflection redundant? How do you cash out the proviso without making the principle either false or empty?"

  *   **Follow-up:** "Is there a case where an update is 'rational' by standard Bayesian measures but still violates Reflection, or are the two concepts inextricably linked in your view?"

  **6. Partitioning the Future**
  "From a quant perspective, we think about partitioning state space. Reflection requires that my current credence be the weighted average of my possible future credences. But this assumes I can partition the future possibilities cleanly. In real-world scenarios, I often can't enumerate the specific propositions my future self will consider. Does Reflection only apply to idealized agents who can fully model their own future hypothesis spaces?"

  *   **Follow-up:** "If it only applies to idealized agents, does that limit its normative force for humans who structurally cannot anticipate their own conceptual growth?"

  ### Part III: Sleeping Beauty and Self-Locating Belief

  **7. The Sleeping Beauty Stress Test**
  "Let's use the Sleeping Beauty problem as a stress test. Before the experiment starts, Beauty knows that on the 'Tails' branch, she will be awakened twice with memory wiping in between. She anticipates that her future credence in 'Heads' will be 1/3 (on the Thirder view) during an awakening, even though her current credence is 1/2. This looks like a memory-loss case covered by your proviso. But does Reflection have anything *coherent* to say here, or does it simply recuse itself entirely?"

  *   **Follow-up:** "If Reflection recuses itself in memory-loss cases, and Sleeping Beauty is the paradigmatic memory-loss case, does that mean Reflection is silent on the most famous problem in self-locating belief?"

  **8. Indexicals and Credence**
  "The tension in Sleeping Beauty arises because 'today is Monday' is a different proposition for Beauty at different times, even if the words are the same. Reflection traditionally deals with fixed propositions. Do you think the Reflection Principle needs to be revised to handle indexicals and self-locating beliefs, or do you think those cases should be modeled in a way that preserves the standard formulation?"

  *   **Follow-up:** "If you argue they should be modeled differently to save Reflection, aren't you risking ad-hocery to protect the principle from falsification?"

  ### Part IV: Agency and Falsifiability

  **9. Diachronic Agency**
  "Underlying these questions is a metaphysical one: To what extent are you one agent over time versus a sequence of time-slices? The Dutch book argument treats you as a single entity responsible for losses across time. If I view my future self as a distinct agent with whom I might disagree, Reflection looks less like a coherence constraint and more like a demand for surrender. Is your defense of Reflection ultimately a defense of a specific theory of personal identity?"

  *   **Follow-up:** "If I reject that strong diachronic identity, can I still be a rational Bayesian, or does Reflection make personal identity a prerequisite for probabilistic coherence?"

  **10. Evidence Against Reflection**
  "Finally, I want to ask about falsifiability. We've discussed cases like memory loss or manipulation where you exempt Reflection via the proviso. But what would count as *genuine* evidence against the principle? Is there a conceivable scenario, where the agent is rational, informed, and unmanipulated, where you would admit that violating Reflection is actually the correct move? Or is Reflection, for you, a constitutive norm of rationality that cannot be empirically falsified?"

  *   **Follow-up:** "If it cannot be falsified, how do we distinguish between a principle that is universally true and a framework that is simply unfalsifiable by design?"
