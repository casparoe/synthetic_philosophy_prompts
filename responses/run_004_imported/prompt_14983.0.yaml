answer: |-
  **MEMORANDUM**

  **TO:** Crisis Standards of Care Subcommittee Chair
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Tiebreaker Protocol: Elimination of Life-Years Criterion

  **Recommendation**
  I recommend we **drop** the "expected life-years remaining" tiebreaker and replace it with a **randomized lottery** for patients who are clinically indistinguishable regarding short-term survival probability.

  This memo outlines the operational language for this change, a timeline for implementation, and the ethical justification. While I respect the "fair innings" argument, I argue that in the context of crisis triage, a deprivation-based account of death's badness (à la Nagel) is too metaphysically contentious and operationally hazardous to serve as the load-bearing wall of a life-or-death protocol. A lottery preserves moral equality without requiring clinicians to adjudicate competing theories of time and value.

  **The Philosophical Dispute: Nagel vs. The Epicurean Challenge**
  Our deadlock centers on whether we can justifiably prioritize Patient A over Patient B based on the quantity of future life Patient A is likely to lose.

  Proponents of the life-years rule rely on a Nagelian deprivation account: death is bad because it deprives the subject of the goods of life they would otherwise have experienced. Therefore, saving the 20-year-old prevents a greater loss than saving the 80-year-old. This is intuitive. However, our bioethicist's objection is not merely semantic; it is structural. She invokes the Epicurean claim that death is "nothing to us" because when we are, death is not, and when death is, we are not. Lucretius sharpens this with the asymmetry argument: we do not mourn the infinite time before our birth, so why do we panic about the infinite time after our death?

  If Lucretius is even partially right, then a protocol built on "years of life lost" is building on sand. It assumes a counterfactual future (the life the patient *would* have had) has moral weight in the present moment of triage. But in a crisis, we are not distributing *futures*; we are distributing *present access to treatment*.

  To adopt the life-years rule is to officially endorse the Nagelian view over the Epicurean one as state hospital policy. While Nagel's view is dominant in analytic ethics, it is not settled truth. More importantly, acting on it requires epistemic certainty we do not possess. Calculating "expected years" relies on actuarial tables that historically penalize disabled people and marginalized communities. When we turn the Lucretian asymmetry from a classroom puzzle into a triage algorithm, we risk privileging a speculative future over the equal moral status of the two living bodies in front of us.

  **The Strongest Case for the "Fair Innings" View**
  I want to be precise about what we are rejecting. The argument for the life-years tiebreaker is not merely utilitarian math. It is a principled egalitarian claim known as the "Fair Innings" argument.

  A thoughtful proponent argues: *Justice requires that everyone have the opportunity to live through the stages of a normal human life span.* When a child dies, they are denied the entire narrative arc of a life. When an elder dies, they have already secured that arc. To ignore this is to treat all deaths as identical, which violates our deepest moral intuitions. It feels wrong to let a 20-year-old die to save a 90-year-old if the clinical odds are truly identical. The "Fair Innings" proponents are not saying the elder's life is worth less; they are saying the *tragedy* of the elder's death is objectively smaller than the tragedy of the child's death. They argue that a lottery fetishizes procedural fairness at the expense of outcome significance. This is a serious moral claim, and it deserves to be recorded that we considered it weighty but ultimately incompatible with disability justice and operational safety.

  **Operational Proposal: The 3 AM Test**
  A triage protocol must be usable by an exhausted intensivist at 3:00 AM. Calculating life expectancy requires looking up comorbidities, checking actuarial tables, and estimating functional baselines. This introduces delay and bias. A lottery is immediate.

  **Proposed Protocol Language (Section 4.2: Tiebreaking Procedures):**
  > **4.2.1 Clinical Priority:** Patients shall be prioritized based on short-term survival probability (e.g., SOFA score or equivalent validated metric).
  >
  > **4.2.2 Indistinguishable Priority:** In the event two or more patients present with clinically indistinguishable short-term survival probabilities and only one resource unit (e.g., ventilator) is available, **no secondary clinical or demographic criteria shall be used.**
  >
  > **4.2.3 Randomization:** Allocation shall be determined by random selection.
  > *   *Method:* The Triage Officer shall utilize a secure, auditable random number generator or a physical randomization device (e.g., sealed envelope system, coin toss witnessed by two clinicians).
  > *   *Documentation:* The method of randomization and the result shall be documented in the patient record immediately following stabilization.
  >
  > **4.2.4 Prohibited Criteria:** Age, disability status, social worth, and estimated life-years remaining shall not be used as tiebreaking criteria.

  **Implementation Timeline**
  To ensure readiness before the respiratory virus peak:

  *   **November 10:** Subcommittee final vote on protocol language.
  *   **November 15:** Legal and Compliance review (specifically regarding ADA/Section 1557 alignment).
  *   **December 1:** Distribution of final protocol to all department heads.
  *   **December 15:** Mandatory triage training modules completed by all ICU/ER attending staff. Training must include a module on the ethical justification for the lottery to prevent moral distress.
  *   **January 1:** Protocol active.

  **Conclusion**
  We cannot solve the Epicurean paradox in a hospital basement during a surge. But we can choose a protocol that does not depend on solving it. By moving to a lottery, we acknowledge that while death may be a deprivation, the *measurement* of that deprivation is too fraught with bias and metaphysical uncertainty to decide who breathes. We treat the patients as equals in the present, rather than judges of their futures.

  I urge the committee to adopt this position.
