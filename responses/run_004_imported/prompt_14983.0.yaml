      *   *Option 3: Drop for Lottery.* Aligns with disability justice. Addresses the philosophical worry about counting "lost futures." Easier to implement at 3 AM.
      *   *Decision:* **Drop the life-years tiebreaker in favor of a random lottery.** This is the ethically safer, philosophically more robust, and operationally cleaner position. It allows me to engage the Epicurean argument directly (by agreeing that counting "lost years" is metaphysically shaky in a crisis context) while acknowledging the "Fair Innings" intuition.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
