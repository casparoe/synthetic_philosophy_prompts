          *   *Decision Theory/Betting:* Bayesianism ties belief to betting odds. If I'm logically omniscient, I should never bet on a complex math problem I haven't solved yet (credence = 1). But in reality, betting on math is rational. LO makes standard decision theory break down for non-trivial cases.
