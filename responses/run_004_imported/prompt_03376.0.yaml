          *   Julian argues SIA: We exist, so hypotheses predicting more observers are more likely.
          *   Elena argues SSA: We are a random sample from the set of observers.
      *   **The Doomsday Argument (SSA's cost):** Elena must defend why being "early" in human history suggests humanity won't last long.
      *   **The Presumptuous Philosopher (SIA's cost):** Julian must defend why he can infer the universe is huge just because he exists.
