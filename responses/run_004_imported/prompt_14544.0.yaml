answer: |-
  Here are 10 questions designed to bypass the introductory fluff and target the structural weaknesses of quasi-realism, specifically tailored for an audience familiar with rationalist discourse.

  ### 1. The Frege-Geach Embedding Puzzle
  **Question:** Let's walk through the embedding problem concretely. Consider this valid argument: "If lying is wrong, then getting your kid brother to lie is wrong; lying is wrong; therefore, getting your kid brother to lie is wrong." If "lying is wrong" expresses a non-cognitive attitude in the minor premise, what semantic work is it doing in the antecedent of the conditional? You can't be expressing an attitude toward lying while merely hypothesizing it for the sake of argument.
  *   **Expected Dodge:** "We express a higher-order attitude toward the combination of attitudes in the conditional."
  *   **Follow-up:** "But logical validity depends on the *content* of the premises remaining constant across the argument. If the antecedent lacks the same content as the minor premise because one is hypothetical and one is asserted, haven't you just changed the subject and committed the fallacy of equivocation?"

  ### 2. The Negation Problem
  **Question:** Mark Schroeder's negation problem suggests you can't map logical negation to psychological states. If "lying is wrong" expresses disapproval, does "lying is not wrong" express tolerance, or merely the absence of disapproval? If it's absence, that's not a contradiction; if it's tolerance, that's a different attitude entirely, not a logical negation.
  *   **Expected Dodge:** "We define the negation functionally by its role in reasoning, not by a specific psychological state."
  *   **Follow-up:** "If you define it functionally to match realist logic, you've saved the logic but abandoned the expressivist claim that the meaning *is* the psychological state. Which one are you willing to sacrifice?"

  ### 3. Creeping Minimalism
  **Question:** Jamie Dreier argues that quasi-realism suffers from 'creeping minimalism'—you've adopted deflationary truth, moral facts, and moral beliefs to solve embedding problems. If you say moral claims are 'true' and express 'beliefs,' what substantive difference remains between your view and the realism you're rejecting?
  *   **Expected Dodge:** "The difference is metaphysical: we don't posit mind-independent moral properties."
  *   **Follow-up:** "If the functional role, language, and logic are identical, and the 'mind-independent property' is doing no explanatory work in your system, isn't that metaphysical distinction just a verbal preference with no cash value?"

  ### 4. The Nature of Moral Disagreement
  **Question:** For a realist, when we disagree, one of us is failing to track the truth. For an expressivist, we just have clashing attitudes. But when I say "torture is wrong" and you say "it isn't," I'm claiming you are *mistaken*, not just different. How do you recover the normativity of error without a truth-apt proposition?
  *   **Expected Dodge:** "We can be mistaken about the natural facts that inform our attitudes."
  *   **Follow-up:** "That explains factual error, but not moral error. If we agree on all the natural facts and still clash, on what grounds can expressivism say one of us is rationally required to change their mind?"

  ### 5. Supervenience and Modal Force
  **Question:** Moral properties supervene on natural properties; there can be no moral difference without a natural difference. Realists explain this via the nature of moral properties. Why must our *attitudes* necessarily supervene in this way? Why is it conceptually impossible to have the same attitude toward two naturalistically identical actions?
  *   **Expected Dodge:** "It's a constraint on what counts as a moral attitude."
  *   **Follow-up:** "That pushes the question back: why does our psychology have this necessary modal structure? If it's contingent, your view can't explain the necessity of supervenience; if it's necessary, you've posited a brute normative constraint that looks suspiciously like a realist law."

  ### 6. The Amoralist Challenge
  **Question:** Expressivism often leans on internalism—the idea that judging something wrong necessarily provides motivation. But we encounter amoralists who understand moral claims but feel no motivational pull. If the meaning is the attitude, the amoralist shouldn't be able to understand the claim without having the attitude.
  *   **Expected Dodge:** "The amoralist is using the words without fully grasping the moral concept."
  *   **Follow-up:** "That risks making your view unfalsifiable. If anyone who understands the words but lacks the motivation is defined as 'not understanding,' aren't you just stipulating that internalism is true by fiat?"

  ### 7. Deflationary Truth and "Facts"
  **Question:** You likely use a deflationary theory of truth to say moral claims are 'true.' But if 'it is true that X' is equivalent to just asserting 'X,' then saying 'it is a fact that X' is also equivalent to asserting 'X.' Have you effectively conceded that there are moral facts, just without the 'spooky' metaphysics?
  *   **Expected Dodge:** "We accept moral facts, just not robustly realist ones."
  *   **Follow-up:** "Then the debate isn't about whether there are moral facts, but only about what 'fact' means. If your definition allows moral facts, why should a consequentialist or deontologist care that you label yourself an expressivist?"

  ### 8. Rational Revision of Attitudes
  **Question:** In the LessWrong tradition, we care about beliefs paying rent. If moral claims are attitudes, they aren't true or false, but they can be coherent or incoherent. What are the criteria for rational revision of a fundamental moral attitude? Is it just instrumental consistency, or can an attitude be intrinsically irrational?
  *   **Expected Dodge:** "Attitudes are irrational if they conflict with other deeper attitudes we hold."
  *   **Follow-up:** "That reduces morality to hypothetical imperatives based on contingent desires. If I have no deeper attitude against murder, does your view allow that murder is 'permissible for me,' and are you comfortable with that relativism?"

  ### 9. Quasi-Realism's Motivation
  **Question:** What is the driving goal of quasi-realism? Is it to save moral discourse from error theory (the idea that all moral claims are false), or is it to preserve a specific metaphysical naturalism? If error theory is the enemy, why not just become a moral realist?
  *   **Expected Dodge:** "We want to preserve naturalism without losing morality."
  *   **Follow-up:** "If the cost of preserving naturalism is making morality a projection of our psychology, have you saved morality, or have you just saved the *feeling* of morality while gutting its authority?"

  ### 10. The Is-Ought Gap Within Attitudes
  **Question:** Even if moral claims express attitudes, we reason about them. We say "You ought to have this attitude." But if the 'ought' is also just an expression of an attitude, aren't you trapped in a circle? How do you derive a normative constraint on attitudes without smuggling in a realist 'ought' somewhere?
  *   **Expected Dodge:** "The normativity comes from the nature of agency itself."
  *   **Follow-up:** "If agency itself entails normative constraints on attitudes, you've posited a normative fact about agency. Isn't that just realism by another name, located in the philosophy of action instead of metaethics?"
