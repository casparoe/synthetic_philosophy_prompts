      *   **Frege-Geach Problem:** Moral sentences embed in conditionals, negations, questions, etc. "If lying is wrong, then getting your brother to lie is wrong." If "lying is wrong" expresses an attitude in the premise, what does it do in the antecedent of the conditional? You can't have an attitude in the antecedent without holding it. But the argument is valid. How?
      *   **Negation Problem (Schroeder):** "Lying is wrong" expresses disapproval. "Lying is not wrong" expresses... tolerance? Absence of disapproval? Disapproval of disapproval? It's hard to map logical negation to psychological states without losing the logical relations.
      *   **Creeping Minimalism (Dreier):** Expressivists adopt so much realist-sounding language (truth, facts, beliefs) to solve embedding that the view collapses into realism. What's left to disagree about?
      *   **Yudkowsky/lesswrong Context:** The audience likely cares about rationality, coherence, and whether moral discourse tracks reality or is purely instrumental.

