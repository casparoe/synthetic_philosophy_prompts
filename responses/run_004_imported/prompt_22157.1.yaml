      "You speak of tickets, Doctor, but I speak of bread. When Law's notes turned to dust in Paris, did the bakers accept them for flour?"

      "They did not, because Law forgot the anchor. He floated on speculation, not industry. I propose a ticket backed by the land and labour of Ireland, not a promise of gold that sits idle in a vault."

      "Idle? That gold is the only truth a merchant knows. A guinea shines in London, Amsterdam, or Bombay. Your paper note is worthless the moment you step off the quay at Howth."

      "And yet, while that guinea sits in your chest, it feeds no one. It clothes no one. Is wealth the metal itself, or the motion it provokes? If a man builds a house, eats, and wears wool, wealth is created. Whether he passes silver or paper to settle the account is secondary."

      "It is not secondary when the paper fails. Then the builder is ruined. You ask us to trust in a phantom because you believe in the industry of the people. But people are fickle. Panic is contagious. When they fear the ticket cannot be redeemed, they rush the bank, and the whole edifice collapses."

      "They rush the bank because they are taught to worship the metal rather than the work. Why must credit be redeemable coin-for-coin? If the nation produces, the credit holds. The value lies in the ability of the debtor to work, not in the creditor's ability to melt down a coin."

      "You treat money as a mere counter in a game of arithmetic. But it is a store of value across time. I save silver today to buy bread ten years hence. Will your paper survive ten years? Or will some parliament inflate it until a wheelbarrow is needed for a loaf?"

      "If the industry remains, the value remains. You hoard silver and call it prudence. I call it strangling the country. We have idle hands and fertile land, yet we starve because we lack the tokens to connect the two. You would let the land lie fallow for want of silver, while I say the land itself is the security."

      "The land cannot be shipped to pay a debt in Lisbon. Silver can. Trust is fragile, Doctor. Once broken, it is harder to mint than gold. Law learned that too late."

      "And Ireland learns nothing if we cling to superstition. You trust in a dead metal because it is heavy. I trust in the living breath of the nation because it produces. Which is the greater folly?"

      "The folly is believing you can separate the sign from the thing signified. When the hunger comes, no one eats a ticket."

      "No, but without the ticket, the bread is never baked."

