answer: |-
  Here are 10 interview questions designed to move past the high-level pitch and press on the philosophical and practical tensions of applying Rawlsian theory to AI alignment. Each includes a follow-up keyed to the standard philosophical defense she is likely to offer.

  ### 1. The Empirical Anchor
  **Question:** You've referenced the DeepMind study where participants behind a veil of ignorance chose fairness principles over pure efficiency in resource allocation tasks. But that was a toy problem with a defined pie to split. When we move from splitting tokens to managing speech moderation or medical triage, do we have any evidence that the "veil" produces stable consensus on *what* counts as a resource, let alone how to split it?
  **Follow-up:** *If she says "we can run more studies to find out":* But doesn't that turn the veil into just another polling mechanism? If the output depends entirely on which demographic you recruit for the experiment, haven't we just swapped engineer bias for sampling bias?

  ### 2. The Translation Gap
  **Question:** Rawls was designing a constitution for a basic structure of society, not a reward function for a transformer model. How do you technically translate a high-level principle like the "Difference Principle" into a loss function without losing the nuance that makes it philosophical rather than just a heuristic?
  **Follow-up:** *If she says "we use constitutional AI methods to interpret the principles":* But who writes the interpreter? If the model has to interpret the veil's principles to apply them, isn't the interpreter effectively doing the normative work, rendering the veil ceremonial?

  ### 3. The Bounded Society Problem (Required)
  **Question:** Rawls explicitly designed the veil for citizens of a single, bounded society hammering out a shared basic structure. AI is a global product deployed across cultures with flatly incompatible conceptions of the good. Doesn't that disanalogy sink the argument? Can you really run a veil exercise when the participants don't even agree on the metaphysics of the people involved?
  **Follow-up:** *If she argues "human commonalities outweigh differences":* If that's true, why do we need the veil at all? Why not just aggregate those commonalities directly? If the differences *don't* outweigh the similarities, then the veil forces a false consensus that looks like imperialism.

  ### 4. Rawls vs. Harsanyi (Required)
  **Question:** John Harsanyi ran essentially the same veil-of-ignorance setup and derived straight average-utilitarian aggregation, while Rawls got maximin. Both were geniuses using the same tool. What stops the "veil" from just smuggling in whatever conclusion the designer wanted under the cover of neutrality?
  **Follow-up:** *If she says "we let the data decide the outcome":* But the structure of the experiment dictates the data. If you frame the risk as "catastrophic loss," you get Rawls; if you frame it as "expected value," you get Harsanyi. Who chooses the framing of the risk?

  ### 5. The Coherence of Neutrality (Required)
  **Question:** You argue the veil creates neutrality. But once the model has to rule on contested questions constantly, one query at a time, isn't "neutrality" incoherent? To refuse to take a side on a contested moral issue *is* to take a side in favor of the status quo or the powerful.
  **Follow-up:** *If she says "we prioritize procedural justice over outcomes":* Procedural justice is itself a contested value. A utilitarian or a virtue ethicist would reject your procedure. Aren't you just encoding liberal contractualism and calling it universal?

  ### 6. Dynamic Values vs. Static Contract
  **Question:** The Rawlsian contract is meant to be foundational and stable. But AI models update continuously, and societal values shift. If we bake in veil-derived principles today, do we lock in 2024's morality? If we re-run the veil every year, doesn't that create instability that makes the system unreliable?
  **Follow-up:** *If she says "we distinguish between core principles and surface preferences":* That distinction is exactly what political fights are about. Who has the authority to decide which values are "core" enough to be locked behind the veil?

  ### 7. The CEV Comparison (Required)
  **Question:** This sounds remarkably like Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) from twenty years ago: "what humanity would choose if it were wiser." CEV promised that payoff and never got near implementation. What is the technical or philosophical bridge you have that the CEV crowd lacked?
  **Follow-up:** *If she says "CEV was too abstract; we have LLMs now":* LLMs are next-token predictors, not moral reasoners. Using them to simulate the veil might just amplify the biases in their training data. How do you verify the simulation isn't hallucinating a consensus that doesn't exist?

  ### 8. Power and Convening
  **Question:** In a democracy, the constitution is ratified by voters. In your model, who convenes the veil? If a lab pays for the study, picks the participants, and sets the constraints, isn't this just elite consensus dressed up as philosophy?
  **Follow-up:** *If she says "we advocate for regulatory oversight of the process":* Regulations are written by lobbyists. If the process isn't truly democratic, aren't you just giving labs a moral shield to say "philosophers approved this" while they optimize for engagement?

  ### 9. Efficiency as Safety
  **Question:** The DeepMind study showed people behind the veil rejected pure efficiency. But in AI safety, efficiency *is* often safety—compute constraints, latency in autonomous systems, energy usage. If the veil demands fairness that drastically reduces efficiency, does safety take a backseat?
  **Follow-up:** *If she says "safety is a precondition, not a trade-off":* Then you're defining safety *as* fairness. But many alignment researchers define safety as "doesn't kill everyone." If the veil chooses a fair system that is easier to hack or slower to react to threats, have we aligned the AI or just virtue-signaled it?

  ### 10. The Concrete Test (Required)
  **Question:** Let's get concrete. Name one real, current alignment decision—like how to handle copyright training data, or how to rank search results on health info—that your approach would settle *differently* than how labs do it now. Not hypothetically, but practically.
  **Follow-up:** *If she gives a vague example like "content moderation":* Okay, pick a specific policy. If DeepMind or OpenAI rejected your recommendation tomorrow, what specific metric would prove them wrong? If there's no falsifiable outcome, is this a governance framework or just a mood?
