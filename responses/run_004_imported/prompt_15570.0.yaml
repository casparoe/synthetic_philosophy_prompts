      *   *Are the calculators "wrong"?* Not necessarily. They are calibrated to different populations and outcomes.
      *   *Key Concept:* Epistemic uncertainty vs. Aleatoric uncertainty. The "reference class problem."

  3.  **Deconstruct the Core Philosophical/Statistical Issue:**
      *   **The Reference Class Problem:** This is the heart of the matter. To calculate *your* risk, you need to compare yourself to a group. Which group? Men? Men your age? Men your age with your cholesterol? Men your age in the US? In Europe? In 1990? In 2020? Every choice changes the denominator and the numerator.
      *   **Population vs. Individual:** Medicine deals in populations. Individuals are unique. A risk score is a frequency statement about a group, applied heuristically to an individual.
      *   **Model Calibration:** Different studies (Framingham, ARIC, MESA, etc.) had different baseline risks. A model built on a high-risk population will predict higher risk for the same inputs than a model built on a low-risk population.
      *   **Outcome Definitions:** Does "cardiovascular event" include angina? Stroke? Heart failure? Revascularization? Hard endpoints only? This changes the "event" count.

  4.  **Drafting the Response - Section by Section:**

