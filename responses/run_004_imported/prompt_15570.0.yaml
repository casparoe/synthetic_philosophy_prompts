      *   **Action:** They input their own data (age, cholesterol, BP, smoking) into three different reputable cardiovascular risk calculators (e.g., ASCVD, QRISK, SCORE, etc.).
      *   **Observation:** The results varied significantly (one low risk, one high enough for statins).
