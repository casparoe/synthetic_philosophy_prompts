      *   **The "Reference Class" Problem:** Explain this statistical concept clearly. This is the philosophical core. You don't have *one* risk; you have a risk relative to a specific cohort.
      *   **Why the Models Differ:**
          *   *Cohorts:* Different populations (geography, era, ethnicity).
          *   *Endpoints:* What counts as an "event"?
          *   *Competing Risks:* Death from other causes.
          *   *Calibration:* Overestimation vs. underestimation over time.
      *   **The Nature of "Risk":** Distinguish between *propensity* (intrinsic) and *probability* (extrinsic/statistical). Risk isn't a hidden variable waiting to be measured; it's a prediction.
      *   **Clinical Utility:** Why do we use them if they vary? Decision aids, not crystal balls. Shared decision-making.
      *   **Advice for the Article:** How to frame this narrative. It's a feature, not a bug, of evidence-based medicine.

