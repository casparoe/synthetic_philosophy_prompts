prompt: |-
  A friend and I spent most of a long dinner arguing about whether it can ever be rational to prefer not knowing something. The trigger was her ongoing indecision about taking a genetic test for a late-onset hereditary condition that, even if the result came back positive, she would have no way of treating or preventing. I argued that her reluctance to test sat uneasily with a result I had come across a while ago: I. J. Good's 1967 proof that, for a Bayesian decision-maker, the expected value of free and relevant information can never be negative, and is generally strictly positive whenever the information is even slightly likely to change what one would otherwise do. On my reading, this seemed to settle the matter in favor of testing.

  She was unconvinced, and pushed back with a handful of cases that, the more I thought about them, seemed like genuine trouble for my glib appeal to the theorem rather than mere emotional resistance to it: a mutually beneficial insurance contract that would unravel the moment either party learned a fact that current ignorance is quietly protecting; a negotiator who is better off not learning her counterpart's true reservation price, since she can then never be tempted, or pressured, into revealing it; and simply the fact that people who receive an accurate terminal prognosis often report being made worse off by the news even when it changes nothing about their treatment options. Neither of us could say with any precision whether these are real counterexamples to Good's theorem, cases the theorem was never meant to cover, or situations where the theorem is technically vindicated but somehow still misses the point.

  I would like your help thinking this through more rigorously than we managed over dinner. Could you first explain, with enough precision that the assumptions are fully visible, what Good's theorem actually shows and for whom? Then, rather than stopping at the formal result, I would like you to set out what you take to be its most important implications and limits for how a person should actually reason about seeking out information, in personal decisions like my friend's as well as in professional or strategic ones. I would especially appreciate it if you could work through my friend's three examples along the way and tell us plainly where each one lands.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** A dinner argument about the rationality of preferring ignorance (specifically regarding genetic testing for untreatable conditions).
      *   **User's Position:** Cited I. J. Good's 1967 theorem (Expected Value of Information is non-negative). Argued testing is rational.
      *   **Friend's Position:** Unconvinced. Offered three counterexamples:
          1.  Insurance contracts unraveling with information.
          2.  Negotiators better off not knowing reservation prices (to avoid temptation/pressure).
          3.  Terminal prognosis making people worse off psychologically without changing treatment.
      *   **Task:**
          1.  Explain Good's Theorem precisely (assumptions, scope, target audience).
          2.  Discuss implications and limits for real-world reasoning (personal, professional, strategic).
          3.  Analyze the friend's three examples specifically against the theorem.
      *   **Tone:** Rigorous, thoughtful, nuanced, plain-spoken (avoiding unnecessary jargon where possible, but precise where needed).

  2.  **Part 1: Explaining Good's Theorem (The Formal Core):**
      *   *What is it?* "On the Principle of Indifference" / "Expected Value of Information."
      *   *Core Claim:* For a Bayesian agent maximizing expected utility, free, relevant information never has negative expected value.
      *   *Key Assumptions (The "Fine Print"):*
          1.  **Bayesian Rationality:** The agent updates beliefs via Bayes' rule.
          2.  **Expected Utility Maximization:** The agent chooses actions to maximize $E[U]$.
          3.  **Costless Information:** The information itself costs nothing (money, time, effort).
          4.  **Action Flexibility:** The agent *can* change their action based on the information. (If you're forced to do $X$ regardless, info has 0 value, not negative).
          5.  **Utility depends on State + Action:** The utility function is defined over world states and actions. Crucially, *does utility depend on knowledge itself?* Standard Good assumes utility depends on the *outcome*, not the *state of mind* regarding the outcome.
          6.  **No Strategic Interaction:** Usually framed as a single-agent decision problem against nature, not a game against other agents who react to your knowledge.
      *   *The Math (Simplified):* $EV(I) = E[\max_a E[U|I, a]] - \max_a E[U|a] \geq 0$. You can always ignore the info and do what you would have done, so the worst case is break-even.

  3.  **Part 2: Analyzing the Friend's Counterexamples:**
      *   *Example 1: Insurance/Contract Unraveling.*
          *   *Scenario:* Ignance allows a deal; knowledge kills it.
          *   *Analysis:* This violates the "single agent vs. nature" assumption. This is Game Theory. If the *other party* knows you know, or if the contract depends on *symmetry of ignorance*, the utility function changes. Actually, it's often about *commitment*. If knowing prevents you from signing, and signing is high utility, the info has negative value *instrumentally*. But strictly speaking, Good's theorem assumes you can act on the info. If the info makes the action impossible (contract voided), it's a change in the available action set.
          *   *Verdict:* Violates the "non-strategic" assumption. It's about *common knowledge* vs. private knowledge.
      *   *Example 2: Negotiator/Reservation Price.*
          *   *Scenario:* Knowing the bottom line tempts you to push too hard or reveals weakness.
          *   *Analysis:* This is about *self-control* or *signaling*.
              *   *Signaling:* If the other side knows you know, they adjust. (Game theory again).
              *   *Self-control:* If knowing makes you psychologically unable to stick to the optimal strategy (akrasia), then the standard Bayesian model fails because the agent isn't a unified utility maximizer over time.
          *   *Verdict:* Violates "stable preferences/agency" or "non-strategic" assumptions.
      *   *Example 3: Terminal Prognosis (Psychological Harm).*
          *   *Scenario:* Knowing you are dying makes you miserable, even if treatment doesn't change.
          *   *Analysis:* This is the strongest challenge to the *utility function* assumption. Good's theorem assumes utility depends on physical states (health, wealth). If utility depends on *beliefs* (hope, anxiety), then information changes the utility function directly, not just the action. $U(State, Action, Belief)$. If $Belief$ enters $U$ negatively, info can have negative value.
          *   *Verdict:* Violates the "outcome-only utility" assumption. This is "intrinsic value of ignorance."

  4.  **Part 3: Implications and Limits for Real-World Reasoning:**
      *   *When does it hold?* Technical decisions, scientific inquiry, cost-benefit analysis where emotions aren't the primary outcome.
      *   *When does it fail?*
          1.  **Psychological Utility:** When happiness depends on hope/uncertainty.
          2.  **Strategic Interaction:** When others react to your knowledge.
          3.  **Precommitment/Binding:** When knowledge removes an option (like the insurance contract).
          4.  **Costly Information:** (Obvious, but worth mentioning).
      *   *Advice for the Friend:* It's not "irrational" in the broad sense to avoid info, but it is "non-Bayesian" in the narrow technical sense. Her preference is valid if her utility includes "peace of mind."

  5.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the depth of the dinner conversation. Validate both sides.
      *   *Section 1: Good's Theorem.* Define it clearly. Use the "Option Value" intuition (you can always ignore info). List assumptions bullet-point style for visibility.
      *   *Section 2: The Three Examples.* Go through them one by one.
          *   *Insurance:* Focus on the *availability of actions*. Knowledge changes the menu of options.
          *   *Negotiation:* Focus on *Game Theory* vs. *Decision Theory*.
          *   *Prognosis:* Focus on *Utility Function*. Does $U$ include knowledge?
      *   *Section 3: Broader Implications.* Distinguish between "Instrumental Rationality" (getting what you want) and "Epistemic Rationality" (believing truth). Good's theorem bridges them *only if* truth serves the goal.
      *   *Conclusion:* Bring it back to the friend. She isn't mathematically wrong; she's operating under a different utility model.

  6.  **Refining the Tone:**
      *   Avoid being condescending about the "glib appeal."
      *   Ensure the distinction between *Decision Theory* (single agent) and *Game Theory* (multi-agent) is clear.
      *   Make sure the "Utility of Belief" point is highlighted, as that's the crux of the genetic testing case.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I explain Good's theorem accurately?* Yes, emphasize *expected* value. It's about the ex-ante calculation.
      *   *Did I address the "free" aspect?* Yes, assumption of costless info.
      *   *Is the genetic testing case resolved?* It hinges on whether "not knowing" provides utility. If yes, Good doesn't apply directly.
      *   *Wait, one nuance on Good:* Good assumes the information doesn't change the *state of the world*, only the belief. In the insurance case, knowing changes the *contractual state*. In the prognosis case, knowing changes the *mental state*. I need to be precise about "State of the World."

  8.  **Final Polish:** Check structure, headings, and clarity. Ensure the conclusion offers a synthesis rather than just a verdict. (The synthesis is: Good is right about *instrumental* value in closed systems; the friend is right about *human* value in open/psychological systems).

  *(Self-Correction on the Insurance Example)*: Actually, the insurance example is often about *adverse selection*. If I know I'm sick, I buy insurance. If the insurer knows I know, they raise premiums. If the contract requires *both* to be ignorant, then signing the contract is an action available *only* under ignorance. Good's theorem says $EV(info) = E[U(best action | info)] - U(best action | no info)$. If "best action | no info" is "Sign Contract" (High U) and "best action | info" is "Cannot Sign" (Low U), then EV is negative. Why does Good's proof fail? Because Good assumes the set of available actions $A$ is constant regardless of the information. If information removes actions from $A$, the theorem breaks. I must highlight this "Action Set Stability" assumption.

  *(Self-Correction on the Negotiator)*: Similar to insurance. If knowing makes you blink, it's a self-control issue. If knowing makes the opponent blink, it's game theory. I should address the "temptation" angle as a violation of the "unified agent" assumption.

  *(Self-Correction on Prognosis)*: This is the "Utility of Belief" argument. Standard decision theory assumes $U(outcome)$. If $U(outcome, belief)$, the math changes.

  Okay, ready to write.
answer: |-
  This is a profound disagreement that cuts to the heart of decision theory, game theory, and the philosophy of mind. You were right to cite I. J. Good; it is the standard mathematical argument for the instrumental value of truth. Your friend was right to sense that the theorem feels like it leaves something out; human life is rarely a single-agent decision problem against a passive nature.

  Here is a rigorous breakdown of Good's theorem, followed by an analysis of why your friend's examples resist it, and finally, what this means for how you should both reason about information.

  ---

  ### Part 1: What Good's Theorem Actually Shows

  In 1967, I. J. Good published "On the Principle of Indifference," formalizing an argument that had been floating around statistics and cybernetics. The core claim is often summarized as: **"Free information always has non-negative expected value."**

  To understand why, we must look at the machinery under the hood. Good's theorem is a result in **Bayesian Decision Theory**. It applies to a specific kind of agent in a specific kind of world.

  #### The Setup
  Imagine an agent facing a decision.
  1.  **States of the World ($S$):** There are various ways the world could be (e.g., "I have the gene" vs. "I do not").
  2.  **Actions ($A$):** The agent can choose from a set of actions (e.g., "Take test" vs. "Don't take test," or subsequently "Live boldly" vs. "Save money").
  3.  **Utility ($U$):** Each combination of State and Action yields a payoff (utility).
  4.  **Beliefs ($P$):** The agent has a prior probability distribution over the States.

  #### The Mechanism
  The theorem compares two scenarios:
  1.  **Decision without Information:** You choose the action $a$ that maximizes your expected utility based on your *current* beliefs.
  2.  **Decision with Information:** You observe a signal (the test result), update your beliefs using Bayes' Rule, and *then* choose the action $a'$ that maximizes expected utility based on the *new* beliefs.

  #### The Proof Intuition
  The expected value of the information is the expected utility of the "Information Scenario" minus the expected utility of the "No Information Scenario."

  Good's proof relies on a simple inequality: **You can always ignore the information.**
  If you receive information and decide to do exactly what you would have done without it, you are in the same position as the "No Information Scenario." Therefore, the "Information Scenario" allows you to do at least as well as the "No Information Scenario." Since you are a rational maximizer, you will only change your action if the new information suggests a *better* action is available. Thus, the expected value must be $\geq 0$.

  #### The Critical Assumptions (The Fine Print)
  For the theorem to hold, the following conditions must be met. If any are violated, the "value of information" can indeed be negative.

  1.  **Costless Information:** The information itself consumes no resources (money, time, effort). If the test costs \$5,000, that is a direct subtraction from utility.
  2.  **Action Set Stability:** The set of available actions $A$ must remain the same regardless of what you learn. You cannot be in a situation where *knowing* a fact physically or contractually prevents you from taking an action that was available to you while ignorant.
  3.  **Outcome-Only Utility:** Your utility function $U$ must depend only on the **state of the world** and your **actions**. It cannot depend on your **beliefs** or **knowledge state**. You must not derive pleasure from hope or pain from truth itself.
  4.  **Single-Agent Decision Problem:** The "world" does not react strategically to your knowledge. There are no other agents who change their behavior because they know what you know (or because they know you know).
  5.  **Perfect Rationality:** You will actually update via Bayes' Rule and maximize expected utility after receiving the info. You do not suffer from weakness of will (akrasia) where knowing the truth compels you to act against your own best interests.

  **For whom is this theorem true?**
  It is true for a **Bayesian Expected Utility Maximizer** operating in a **static, single-agent environment** where utility is defined strictly over **physical outcomes**.

  ---

  ### Part 2: Analyzing Your Friend's Counterexamples

  Your friend's examples are not merely emotional resistance; they are precise violations of the assumptions listed above. Here is where each one lands.

  #### 1. The Insurance Contract (Violation: Action Set Stability)
  *The Case:* A contract is beneficial only if both parties remain ignorant of a specific risk. If either learns the truth, the contract is voided or the premium becomes prohibitive.
  *The Verdict:* **Good's Theorem Does Not Apply.**
  *Why:* This violates **Action Set Stability**. In Good's model, information expands your options (you can do what you would have done, or something better). In this insurance case, information *contracts* your options.
  If you remain ignorant, the action "Sign Contract" is available and yields high utility. If you learn you are high-risk, the action "Sign Contract" is removed from the menu (the insurer won't let you).
  Mathematically, Good's proof fails because the maximization in the "Information Scenario" is over a smaller set of actions than in the "No Information Scenario." Here, ignorance is an *enabling condition* for a high-value action. Preferring ignorance here is instrumentally rational.

  #### 2. The Negotiator (Violation: Single-Agent / Strategic Interaction)
  *The Case:* A negotiator prefers not to know her counterpart's bottom line because knowing it might tempt her to push too hard, causing the deal to collapse, or because her demeanor will reveal she knows, causing the counterpart to walk away.
  *The Verdict:* **Good's Theorem Does Not Apply.**
  *Why:* This violates the **Single-Agent** assumption. Good's theorem treats the world as "Nature," which does not care what you know. Negotiation is **Game Theory**.
  *   **Signaling:** If your knowledge changes your behavior (micro-expressions, tone), and the other party detects this, the "State of the World" changes in response to your information. The utility of the outcome depends on the *other player's beliefs about your beliefs*.
  *   **Self-Control (Akrasia):** If the negotiator fears she will be *tempted* to act sub-optimally (push too hard and lose the deal), this violates the **Perfect Rationality** assumption. Good's theorem assumes that once you have the info, you will coolly choose the best action. If knowing the truth alters your psychology such that you *cannot* choose the best action, the information has negative expected value.

  #### 3. The Terminal Prognosis (Violation: Outcome-Only Utility)
  *The Case:* A patient learns they have a terminal illness. Treatment options do not change. However, their remaining quality of life drops because they spend their final months in despair rather than hope.
  *The Verdict:* **Good's Theorem Does Not Apply.**
  *Why:* This violates the **Outcome-Only Utility** assumption. Standard decision theory assumes $U = f(\text{Physical State}, \text{Action})$. It assumes you don't care about the map, only the territory.
  Your friend is arguing that for humans, $U = f(\text{Physical State}, \text{Action}, \text{Belief})$.
  If "Hope" is a good that contributes to utility, and "Certainty of Death" destroys that good, then information directly subtracts from utility. Good's theorem calculates the value of information for *achieving goals*; it does not calculate the value of information when the *possession of the information* undermines the goal (e.g., happiness).
  In this specific case, the information has **negative intrinsic value**. Good's theorem only proves information has non-negative *instrumental* value (value for making decisions). If the decision doesn't change (treatment is the same), the instrumental value is zero. If the psychological cost is positive, the net value is negative.

  ---

  ### Part 3: Implications for Reasoning About Information

  So, who won the dinner argument? In a technical sense, you did: Good's theorem is mathematically sound within its domain. In a practical sense, your friend did: human life rarely stays within that domain.

  Here is how to synthesize this for future reasoning, both personal and professional.

  #### 1. Distinguish Instrumental vs. Intrinsic Value of Truth
  Good's theorem is about **Instrumental Rationality**: "Does knowing this help me get what I want?"
  Your friend is concerned with **Intrinsic Utility**: "Does knowing this change what I want or how I feel?"
  *   **Rule of Thumb:** If the information changes your actions (e.g., buying a hedge, changing a career), Good's theorem holds. Seek the info.
  *   **Rule of Thumb:** If the information *cannot* change your actions (untreatable condition) and your happiness depends on hope, Good's theorem is irrelevant. Ignorance can be rational.

  #### 2. Watch for "Knowledge-Dependent" Action Sets
  In professional and strategic contexts, ask: **"Does knowing this fact remove options that are currently open to me?"**
  *   **Example:** In law, there is "plausible deniability." If you know about a crime, you are legally compelled to act (report it). If you don't know, you are not. Here, information removes the option of "non-involvement."
  *   **Implication:** In bureaucratic or legal environments, information can be a liability. Rational agents sometimes structure organizations to keep information siloed precisely to preserve optionality.

  #### 3. Account for Strategic Reflexivity
  In negotiations, management, or politics, ask: **"If I know this, will others change how they treat me?"**
  *   Good's theorem assumes a passive world. In a social world, knowledge is a signal.
  *   **Implication:** Sometimes it is rational to remain ignorant to maintain a credible commitment. A negotiator who *cannot* know the bottom line might fight harder and get a better deal than one who *could* know but tries to restrain themselves. This is the logic of "strategic ignorance."

  #### 4. Respect the Utility of Belief
  This is the hardest one for data-driven people to accept. We tend to think utility comes from *having* things. But utility often comes from *thinking* we have things, or *thinking* things are possible.
  *   **Implication:** In personal decisions (like your friend's genetic test), the "cost" of information isn't just the price of the test. It is the **psychological tax** of carrying the knowledge.
  *   If the test result is negative: Relief (Positive Utility).
  *   If the test result is positive: Despair (Negative Utility).
  *   If the treatment is unchanged: Instrumental Value = 0.
  *   **Calculation:** You must weigh the Expected Instrumental Value (which Good says is $\geq 0$) against the Expected Psychological Cost. If the latter outweighs the former, skipping the test is rational.

  ### Conclusion for Your Friend

  You can tell your friend this:

  "I looked into the math. I. J. Good proved that information is never harmful *if* you are a robot making decisions in a vacuum, where knowing the truth doesn't change your options, doesn't change how others treat you, and doesn't hurt your feelings.

  But you aren't a robot.
  1.  **Psychologically:** If knowing the result robs you of hope without giving you new treatment options, the information has a direct 'cost' that Good's theorem doesn't count.
  2.  **Socially:** If knowing changes how insurers or family treat you, the 'world' is reacting to your knowledge, which breaks the theorem's assumptions.

  Good's theorem proves that truth is useful for *steering*. It does not prove that truth is useful for *suffering*. If the test result won't change your steering, but it will increase your suffering, your reluctance isn't a mathematical error. It's a different utility function."

  In short: Good's theorem is a powerful tool for **decision-making**, but it is not a moral mandate for **truth-seeking**. Your friend is free to value peace of mind over precision, and doing so does not make her irrational.
