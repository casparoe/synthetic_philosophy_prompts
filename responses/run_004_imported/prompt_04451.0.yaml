          *   SIA: Reason as if you are a random sample from all possible observers (weighted by probability of existence).
      *   *Check:* Is the "Presumptuous Philosopher" scenario accurate? Yes, Bostrom's thought experiment. $T_1$ vs $T_2$ with huge disparity in observer numbers.
      *   *Check:* Are they conceding on the reference class?
