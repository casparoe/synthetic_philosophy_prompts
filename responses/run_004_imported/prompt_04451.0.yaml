      *   **Setting:** Just after a "Presumptuous Philosopher" interrupted physicists about to run a costly experiment.
      *   **Scenario:** Two cosmological theories ($T_1$ vs. $T_2$).
          *   $T_1$: Universe has $N$ observers (trillion trillion).
          *   $T_2$: Universe has $10^{12} \times N$ observers (trillion times more).
          *   Prior evidence: Equally confirmed.
          *   Presumptuous Philosopher's claim: Experiment unnecessary; SIA implies $T_2$ is a trillion times more likely.
      *   **Conflict:** SIA proponent defends the verdict; SSA proponent resists it.
      *   **Key Arguments to Include:**
          *   SIA side: Defends the probability shift based on observer count.
          *   SSA side: Attacks "bare presumptuousness."
          *   SSA side: Brings up the Doomsday Argument (a strength of SSA, weakness of SIA).
          *   SIA side: Brings up the Reference Class Problem (a weakness of SSA).
          *   Constraint: Neither side concedes on who counts as a "relevantly similar observer."

  2.  **Character Conception:**
      *   **SSA Proponent (let's call her "Elara"):** Pragmatic, cautious, worried about empirical disconnect. Values the ability to make predictions like the Doomsday Argument. Sees SIA as magical thinking.
      *   **SIA Proponent (let's call him "Silas"):** Bold, Bayesian purist, willing to accept counter-intuitive results if the math holds. Sees SSA as arbitrary restriction.
      *   **Tone:** Intellectual, tense, slightly weary (they've been arguing this for years), but respectful.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The physicists are packing up or arguing. The Presumptuous Philosopher (PP) has just left or is standing triumphantly. Elara and Silas are debriefing.
