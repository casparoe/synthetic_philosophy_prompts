      *   Ensure the voices sound distinct. Elara = grounded, skeptical. Silas = abstract, confident.
      *   Check the constraint: "let neither side simply concede the other's framing of who counts as a relevantly similar observer."
      *   *Fix:* Ensure Elara argues that the extra observers in $T_2$ might not be in the reference class if they don't share specific evidence, while Silas argues they count if they *could* have had that evidence.

  7.  **Final Review against Prompt:**
