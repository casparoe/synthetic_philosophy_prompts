answer: |-
  Your hunch is mathematically sound, and your friend is chasing a phantom. You are closer to being right.

  There is no voting system—Instant Runoff, Borda Count, Condorcet, or otherwise—that can guarantee immunity to strategic voting under the conditions you described. This is not a matter of opinion or a failure of imagination; it is a proven mathematical impossibility known as the **Gibbard-Satterthwaite Theorem**.

  Here is the rigorous verdict on your situation, why your friend's proposed fix won't work, and what you can actually do about it.

  ### 1. The Verdict: The Impossibility Theorem
  In the early 1970s, economist Allan Gibbard and philosopher Mark Satterthwaite independently proved a theorem that directly addresses your dispute. It states that for any voting system where:
  1.  There are **three or more possible outcomes** (you have four destinations);
  2.  The outcome is **deterministic** (the votes determine a single winner, not a random draw);
  3.  No single voter is a **dictator** (one person doesn't just decide);
  4.  Voters have **unrestricted preferences** (anyone can prefer the beach over the mountains, or vice versa, without restriction);

  **...the system is manipulable.**

  This means there will always be scenarios where a voter can achieve a better outcome for themselves by lying about their preferences rather than voting sincerely. Your friend's demand for a system that is "fully immune to this kind of tactical misreporting" is asking for something that does not exist.

  ### 2. Why Instant Runoff Voting (IRV) Is Not the Fix
  Your friend is lobbying for Instant Runoff Voting (also known as Ranked Choice Voting). While IRV solves *some* problems (like the "spoiler effect" in plurality voting), it is **not** strategy-proof.

  Political scientists and mathematicians have identified several specific ways to game IRV. For example:
  *   **Compromising:** Just like in your current system, a voter might rank a viable second choice above their true favorite to ensure their vote "counts" in the later rounds.
  *   **Burial:** A voter might rank a strong competitor artificially low (even below their true least favorite) to ensure that candidate gets eliminated early.
  *   **Push-over:** A voter might strategically rank a weak candidate higher to ensure they make the runoff against a candidate the voter actually wants to defeat.

  If your group adopts IRV, the argument next year won't be about Borda points; it will be about whether someone "buried" the mountain cabin to ensure the city won in the final round. The terrain of the argument changes, but the conflict remains.

  ### 3. Why This Happens (The Logic)
  The reason this is unavoidable is that any counting rule is essentially an algorithm. If the algorithm is public (which it must be for the vote to be fair), and voters know the preferences of others (which happens in a group of eight friends who have traveled together for nine years), voters can simulate the outcome.

  If the simulation shows, "If I vote honestly, my least favorite option wins; but if I swap my first and second choice, my second choice wins," a rational actor motivated to get the best trip will lie. To prevent this, the system would have to be so rigid that it ignores most voters' inputs (effectively a dictatorship) or restricts what people are allowed to prefer (which violates the spirit of a friendly trip).

  ### 4. Is There Anything You Can Do?
  Since a perfect fix is impossible, you should aim for **mitigation** rather than **immunity**. Here are four practical approaches that work better than searching for a magic voting rule:

  **A. Shift from Rules to Norms (The Social Contract)**
  In a group of friends, social pressure is often more effective than mathematical safeguards.
  *   **The Fix:** Agree explicitly that the voting process is a "trust exercise."
  *   **Why it helps:** You cannot stop someone from voting strategically, but you can make it socially costly. If it is discovered (as it was this time) that someone gamed the system, the norm should be that the win is tainted. The threat of social friction often discourages strategy more than the voting rule does.

  **B. Introduce Randomness (The "Tie-Breaker" Method)**
  The Gibbard-Satterthwaite theorem applies to *deterministic* systems. If you introduce randomness, you can reduce the incentive to game the system.
  *   **The Fix:** Use your current voting method to narrow the four options down to the top two, then flip a coin (or draw straws) to pick the winner.
  *   **Why it helps:** When the margin of victory is a coin flip, the complex calculus of "If I move the Mountain up two points, will it overtake the Beach?" becomes much less reliable. It reduces the payoff of strategic voting.

  **C. Approval Voting**
  Instead of ranking (1st, 2nd, 3rd, 4th), everyone simply marks "Yes" or "No" for each destination. The one with the most "Yes" votes wins.
  *   **The Fix:** Everyone approves any destination they would be happy going to.
  *   **Why it helps:** While theoretically manipulable (you might withhold approval from a strong rival), it is often *psychologically* harder to game. It forces voters to think about "Is this acceptable?" rather than "How do I rank this relative to the others?" It tends to elect consensus candidates rather than polarizing ones.

  **D. Rotate the Decider**
  Since you are a stable group of eight, you could abandon collective voting for the destination entirely.
  *   **The Fix:** Rotate the responsibility. Each year, one person is the "Captain." They propose three options, the group vetoes one, and the Captain picks from the remaining two.
  *   **Why it helps:** This technically satisfies the "dictator" clause of the theorem, but because the dictatorship rotates annually, it is fair over time. It removes the incentive for strategic voting because only one person's preference structure matters that year.

  ### Summary
  Your friend is operating under the belief that voting paradoxes are a bug of your specific points system. You are correctly intuiting that they are a feature of collective choice itself.

  **You win the argument.** There is no ranking method short of a dictatorship that closes off strategic misreporting for good. If you adopt IRV, you will simply trade one type of tactical argument for another. The best path forward is to acknowledge the imperfection, agree to value honesty over winning, and perhaps introduce a coin flip to keep the stakes low enough that gaming the system isn't worth the risk to the friendship.
