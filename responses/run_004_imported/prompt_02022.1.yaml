prompt: |-
  I've been mulling over Bostrom and Ord's "parliamentary model" for moral uncertainty ever since I first ran into it on Overcoming Bias, and later watched people try to formalize it in that old Polymath-style thread on LessWrong. I want to write a post arguing that the model doesn't actually buy you anything over "maximize expected choiceworthiness" (MEC) plus a normalization scheme like MacAskill's variance normalization — it just relocates the problem rather than solving it. Before committing to a full post, I'd like comments on the argument, which really only takes four steps.

  1. MEC's classic difficulty is intertheoretic comparison: to take a credence-weighted expectation over "choiceworthiness" across theories, each theory's choiceworthiness function has to live on a common cardinal scale, and it's unclear what licenses treating a unit of utilitarian value as commensurable with a unit of Kantian "wrongness." Variance normalization is the best-known attempted fix, and it has taken a real beating in the recent literature.

  2. The parliamentary model is usually sold as sidestepping this entirely: instead of comparing theories directly, credence-weighted "delegates" bargain, and you act on whatever deal results. No common scale required — allegedly.

  3. But take a single up-or-down choice between A and B, where a theory with 51% credence weakly prefers A, while the remaining 49% goes to a theory that regards A as a catastrophe relative to B. A purely ordinal parliament — majority vote, no cardinal information — picks A, which seems like exactly the wrong answer. The natural fix is to let intensity of preference count: give delegates von Neumann–Morgenstern utility functions, so the 49% bloc can outbid the 51% bloc when it cares far more.

  4. But now you need, first, some way of extracting a cardinal utility function from theories that don't obviously come with one (what is deontology's utility function over lotteries?), and second, a disagreement point and a bargaining solution concept (Nash? Kalai–Smorodinsky?) to actually pin down a deal. Reasonable choices here move the answer around in ways the credences alone don't fix. When people have actually run the numbers on toy cases — I have in mind both the old LessWrong exchange and the later Greaves and Cotton-Barratt paper formalizing the model via an asymmetric Nash solution — the bargaining-derived verdict doesn't obviously coincide with what a normalization procedure delivers on the same case. So we've swapped "how do you compare theories' units" for "how do you cardinalize each theory, and pick a bargaining solution and a disagreement point," and I don't see why the second problem is smaller, or why it isn't the same arbitrariness wearing a game-theoretic costume.

  I'd appreciate comments on: whether I've got the Nash-bargaining requirements right, since that's the part I'm least sure of; whether there's a standard move available to defenders of the parliamentary model that blocks step 4; and whether the parallel with competing normalization conventions in interpersonal utility comparisons (where similar indeterminacy is usually shrugged off) actually rescues the model, or is beside the point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Moral Uncertainty, specifically comparing the "Parliamentary Model" (Bostrom/Ord) vs. "Maximize Expected Choiceworthiness" (MEC) with normalization (e.g., MacAskill's variance normalization).
      *   **User's Goal:** Write a blog post arguing that the Parliamentary Model doesn't solve the intertheoretic comparison problem but merely relocates it to bargaining parameters (cardinalization, disagreement point, solution concept).
      *   **User's Argument Structure:**
          1.  MEC needs intertheoretic comparison (cardinal scale), which is hard. Normalization helps but is criticized.
          2.  Parliamentary Model claims to avoid this via bargaining/delegates.
          3.  Purely ordinal parliament fails in high-stakes minority cases (tyranny of the majority). Needs cardinal intensity.
          4.  Introducing cardinality requires extracting utility functions from non-consequentialist theories + choosing a bargaining solution/disagreement point. This reintroduces arbitrariness similar to normalization.
      *   **Specific Questions for Feedback:**
          1.  Are the Nash-bargaining requirements correctly understood?
          2.  Is there a standard defense against Step 4?
          3.  Does the analogy to interpersonal utility comparison rescue the model?

  2.  **Evaluate the Argument (Step-by-Step):**

      *   *Step 1 (MEC & Normalization):* Accurate. MEC requires a common scale. Variance normalization (MacAskill 2014) is the standard fix but faces objections (e.g., sensitivity to theory individuation, "cluelessness" about variance).
      *   *Step 2 (Parliamentary Claim):* Accurate. Bostrom/Ord (2016) propose it as a way to handle incomparability. The metaphor is political bargaining.
      *   *Step 3 (Ordinal Failure):* This is the crux. A simple majority vote ignores intensity. If 51% slightly prefer A and 49% desperately hate A, majority rule is counter-intuitive under moral uncertainty. Most proponents agree intensity matters.
      *   *Step 4 (Cardinalization & Bargaining):* This is the user's main critique. To do bargaining (like Nash), you need utility functions.
          *   *Issue A:* How to get VNM utilities from deontology? (The "structural" problem).
          *   *Issue B:* Bargaining parameters (disagreement point, solution concept).
          *   *Claim:* This is just as arbitrary as normalization.

  3.  **Address Specific Questions:**

      *   *Q1: Nash-bargaining requirements.*
          *   Yes, Nash Bargaining Solution (NBS) requires cardinal utilities defined up to positive affine transformations. It also requires a disagreement point (status quo if no deal).
          *   In the moral uncertainty context, what is the "disagreement point"? Randomization? A specific default action? This is notoriously under-specified in the literature.
          *   Also, NBS assumes transferable utility (or at least comparable gains) in some formulations, or relies on the geometry of the feasible set. If theories can't compare "gains," the feasible set is ill-defined.
          *   *Verdict:* User is right. The technical requirements of bargaining are non-trivial and reintroduce measurement issues.

      *   *Q2: Standard defenses against Step 4.*
          *   *Defense 1: "It's not literal bargaining."* Some argue it's a heuristic for reflective equilibrium, not a mechanical algorithm. (Weak defense against the "doesn't buy you anything" claim).
          *   *Defense 2: "Proportional Voting / Stake."* Some versions (like "moral parliament" with budget shares) avoid explicit bargaining but still need to allocate budget based on credence. If budget = credence, does that solve intensity? Usually, they allow trading budget, which brings us back to pricing/cardinality.
          *   *Defense 3: "Voting over options, not theories."* If delegates vote on *actions* based on their internal criteria, we still face the intensity problem.
          *   *Defense 4: "The Arbitrariness is Less Bad."* Maybe choosing a disagreement point is easier than intertheoretic utility comparison? (Debatable).
          *   *Key Literature:* MacAskill, Bykvist, & Ord (2020) *Moral Uncertainty* book. They actually move *away* from the parliamentary model towards MEC + normalization in the end, acknowledging the parliamentary model's difficulties with cardinalization. This is a huge point for the user.

      *   *Q3: Interpersonal Utility Comparison Analogy.*
          *   In social choice, we often shrug off interpersonal comparison issues (e.g., Harsanyi's utilitarianism assumes it).
          *   Does this rescue the Parliamentary Model?
          *   *Counter:* In social choice, we often accept the arbitrariness because we need *a* decision. But in moral uncertainty, the goal is often *epistemic* correctness (tracking the true moral theory), not just *procedural* fairness.
          *   Also, interpersonal comparison is arguably *easier* (same biology) than intertheoretic (utilitarianism vs. deontology).
          *   *Verdict:* It doesn't fully rescue it because the metaphysical gap between moral theories is wider than between agents.

  4.  **Synthesize the Feedback:**

      *   **Validation:** The argument is strong and aligns with the current state of the literature (specifically the MUBO book's pivot).
      *   **Refinement on Step 4:** Emphasize the "Disagreement Point" problem. In political bargaining, it's "no deal." In moral uncertainty, what is "no deal"? Randomization? This choice heavily influences the outcome (just like normalization).
      *   **Refinement on Cardinalization:** Mention the "structural uncertainty" problem. Deontology isn't defined over lotteries. Forcing it into VNM form is a substantive moral claim, not just a measurement trick.
      *   **Literature Check:** Cite MacAskill, Bykvist, & Ord (2020). They explicitly discuss this. They prefer MEC with variance normalization over the Parliamentary model for exactly the reasons the user suspects. This is the "ace in the hole" for the user's post.
      *   **Nuance:** The Parliamentary Model might still have value as a *heuristic* for avoiding fanaticism or handling non-expected-utility theories, but as a *formal solution* to intertheoretic comparison, the user is right that it struggles.

  5.  **Drafting the Response:**
      *   *Tone:* Collegial, analytical, encouraging.
      *   *Structure:*
          1.  Overall assessment (Strong argument).
          2.  Addressing Q1 (Nash requirements).
          3.  Addressing Q2 (Defenses & The MUBO Pivot).
          4.  Addressing Q3 (Interpersonal Analogy).
          5.  Suggestions for the post (strengthening the punchline).

  6.  **Self-Correction/Refinement during drafting:**
      *   *Wait, did Bostrom/Ord actually endorse Nash Bargaining?* In the 2016 paper, they discuss the parliamentary model loosely. The formalization via Nash Bargaining is more associated with later work (e.g., Greaves, Cotton-Barratt, or the MUBO discussion). I need to be careful not to attribute the Nash formalization to Bostrom/Ord directly if they were vaguer, but acknowledge that *formalizing* the intuition leads there.
      *   *Correction:* The 2016 paper ("The Parliamentary Model") is somewhat informal. The user mentions the LessWrong thread and Greaves/Cotton-Barratt. I should validate that the *formalization* inevitably leads to the user's Step 4, even if the original metaphor was looser.
      *   *Key Insight:* The MUBO book (2020) is the most important reference. They conclude that MEC is superior. The user's post would be timely in summarizing *why* the field moved that way.

  7.  **Final Polish:** Ensure clear headings matching the user's questions. Make sure to highlight the "Disagreement Point" issue as it's the strongest technical lever for the user's argument. (If the disagreement point is randomization, that's effectively a normalization choice).

  8.  *(Final check of the user's Step 3)*: "51% weakly prefer A, 49% catastrophe." Yes, this is the standard "tyranny of the majority" objection to ordinal voting in moral uncertainty.
  9.  *(Final check of the user's Step 4)*: "Swapped one arbitrariness for another." Yes. Normalization fixes the scale; Bargaining fixes the scale via the disagreement point and solution concept.

  10. **Ready to write.**
answer: |-
  This is a sharp, well-structured argument that aligns closely with where the academic literature on moral uncertainty has settled in the last few years. You have correctly identified the "hard problem" that the Parliamentary Model was meant to dissolve, and your suspicion that it merely relocates the arbitrariness is supported by the formal work that followed Bostrom and Ord's initial proposal.

  Here is feedback on your specific questions, along with some strategic advice for the post.

  ### 1. Are the Nash-bargaining requirements right?

  **Yes, essentially.** If you want the Parliamentary Model to handle intensity of preference (to avoid the Step 3 tyranny-of-the-majority problem), you must move from ordinal voting to cardinal bargaining.

  *   **Cardinality:** The Nash Bargaining Solution (NBS) requires utility functions that are unique up to positive affine transformation. You cannot run NBS with ordinal preferences. This forces you to assign cardinal values to outcomes for *each* moral theory. As you note, this is non-trivial for non-consequentialist theories (e.g., how does a deontological theory value a lottery over actions?). Forcing them into a VNM framework is itself a substantive meta-ethical claim, not a neutral measurement tool.
  *   **The Disagreement Point:** This is the strongest lever for your argument. In standard bargaining, the disagreement point is "no deal." In moral uncertainty, what is "no deal"?
      *   Is it a random choice among options?
      *   Is it the status quo?
      *   Is it the option preferred by the highest-credence theory?
      *   *Crucially:* Changing the disagreement point shifts the NBS outcome significantly. Selecting a disagreement point is functionally equivalent to selecting a normalization scheme in MEC. It determines the "zero point" and "scale" of the theories relative to one another.
  *   **The Feasible Set:** To bargain, you need a feasible set of utility pairs. Defining this set requires knowing what trade-offs are possible, which again presumes a common currency of "moral value" to map the frontier.

  You are on solid ground here. The technical machinery required to make the Parliamentary Model work robustly reintroduces the measurement problems it was supposed to bypass.

  ### 2. Is there a standard move available to defenders?

  There are two main lines of defense, but both are currently considered weak in the literature.

  **Defense A: "It's a Heuristic, Not an Algorithm"**
  Some proponents argue the Parliamentary Model is meant as a conceptual tool for reflective equilibrium, not a formal decision procedure.
  *   *Counter:* If it's not a formal procedure, it can't claim to *solve* the intertheoretic comparison problem. It just offers a vibe. Your post is critiquing it as a solution to a technical problem, so this defense concedes your point.

  **Defense B: "Budget Allocation" (The Proportional View)**
  Instead of bargaining over every decision, delegates are given a budget of "decision power" proportional to credence. They can trade this budget.
  *   *Counter:* This still requires a currency for trade. If Theory A trades 5% of its budget to Theory B to secure a win on a high-stakes issue, they must agree on the *price*. Pricing requires intertheoretic comparison. If the price is fixed exogenously, you've just hardcoded a normalization scheme.

  **The "Ace in the Hole" for your post:**
  The most significant development here is that **MacAskill, Bykvist, and Ord (2020) largely abandon the Parliamentary Model in favor of MEC.**
  In their book *Moral Uncertainty*, they conclude that while the Parliamentary Model is intuitive, it faces severe difficulties with cardinalization and disagreement points. They explicitly argue that **MEC with variance normalization** is the more robust approach, despite its flaws.
  *   *Strategic Advice:* Citing this pivot is crucial. It validates your Step 4. You aren't just speculating that the problems are equivalent; the original proponents effectively agreed that MEC + Normalization is the lesser evil. Your post can frame itself as explaining *why* that pivot was necessary.

  ### 3. Does the interpersonal utility comparison analogy rescue the model?

  **No, and here is why.**

  In social choice theory (interpersonal comparison), we often shrug off the arbitrariness of normalization because we are looking for a *political settlement* among agents who exist and have interests. We accept procedural fairness over metaphysical precision.

  However, moral uncertainty is an *epistemic* problem.
  *   **The Goal:** We are trying to track the *true* moral requirements, not negotiate a peace treaty between competing ideologies.
  *   **The Metaphysical Gap:** Comparing utility between two humans assumes a shared biological/psychological substrate. Comparing utility between Utilitarianism and Kantianism assumes a shared metaphysical substrate of "choiceworthiness" that many moral realists deny exists.
  *   **The Implication:** Arbitrariness in interpersonal comparison is a pragmatic necessity. Arbitrariness in intertheoretic comparison is an epistemic failure. If the Parliamentary Model relies on arbitrary bargaining parameters (disagreement points), it fails to track the truth any better than arbitrary normalization.

  Therefore, the analogy does not rescue the model; it highlights that the Parliamentary Model treats moral theories like political interest groups, which may be the wrong category for normative truth.

  ### Suggestions for Strengthening the Post

  1.  **Focus on the Disagreement Point:** This is the clearest example of "relocated arbitrariness." Show a toy case where changing the disagreement point (e.g., from "random action" to "status quo") flips the moral verdict under the Parliamentary Model, just as changing the normalization method flips the verdict under MEC.
  2.  **Highlight the MUBO Pivot:** Explicitly mention that MacAskill & Ord (2020) prefer MEC. This prevents defenders from saying "You're attacking a strawman; the authors know this." Instead, you are explicating the *reasons* for the field's migration away from the Parliamentary Model.
  3.  **Refine Step 3:** Ensure you distinguish between the "Voting Model" (ordinal) and the "Bargaining Model" (cardinal). Bostrom's original 2016 paper was vague, but the formalizations (like Greaves/Cotton-Barratt) acknowledge the need for cardinality. Your argument is strongest against the *formalized* version.
  4.  **Title Idea:** Something like "The Parliamentary Model is Just MEC in Disguise" or "Bargaining Away the Problem: Why Moral Parliaments Don't Solve Intertheoretic Comparison."

  ### Summary
  Your four steps are logically sound and map well onto the current consensus in the field. The move from Step 3 (need intensity) to Step 4 (need cardinalization/bargaining parameters) is the kill shot. If you have to choose arbitrary parameters to make the Parliament work, you haven't solved the arbitrariness problem of normalization; you've just dressed it up in game theory.

  Go ahead and write it. It's a needed clarification for people still clinging to the Parliamentary Model as a "free lunch" solution to normalization.
