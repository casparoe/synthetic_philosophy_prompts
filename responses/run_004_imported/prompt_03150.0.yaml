answer: |-
  The Archive of Sums did not store books, but slips of paper, each bearing an equation and its result. There were billions of them, stacked in hexagonal galleries that spiraled down into the bedrock. The work of the Verifiers was simple: when a new slip was generated by the Calculators in the upper halls, it was brought down to be checked against the consistency of the past.

  Elias had been a Verifier for thirty years. He knew the feel of the rule. It was not a feeling of heat or light, but of inevitability. When he saw $2 + 2$, the hand moved to write $4$ before the eye had fully registered the symbols. It was a compulsion he trusted as he trusted the beat of his own heart.

  The trouble began on a Tuesday, with a slip generated by a new Calculator, a young man named Krell.

  The slip read: $57 + 68 = 125$.

  Elias picked up his pen. He intended to mark it *Verified*. But his hand hovered. A cold prickle, like the memory of a fever, ran up his arm. He looked at the numbers. He looked at the billions of slips surrounding him. He had verified $57 + 68$ before? No. He had verified $57 + 6$, and $5 + 68$, and $50 + 60$. He had verified sums involving 57 and sums involving 68. But never this specific pair.

  According to the rule Elias believed he had been following all his life—the rule of *addition*—the answer was 125.

  But as he stared at the slip, a terrifying thought uncoiled in his mind. How did he know that the rule he had been following was *addition*?

  Perhaps the rule was *quaddition*. In quaddition, $x \oplus y$ equals $x + y$ for all numbers $x$ and $y$ smaller than a certain threshold, say 100. But if either number is greater than or equal to 100, the result is always 5.

  Elias had never added two numbers where both were large enough to trigger the divergence until now. Wait, $57$ and $68$ are both under 100. But their sum is over 100. Does the threshold apply to the inputs or the output?

  He shook his head. The specific function didn't matter. The horror was structural. Every past instance of his adding—the slips he had verified, the groceries he had bought, the years he had counted—was compatible with an infinite number of deviant rules. There was no fact in his brain, no neural pattern, no mental image of a "plus sign," that could logically force the next step to be 125 rather than 5, or 125 rather than "Blue."

  He looked at the slip. $125$.

  He reached for his red pen to mark *Verified*.

  "Stop."

  The voice came from the Gallery Overseer, Mrs. Vane. She stood in the shadow of the stacks, holding a ledger.

  "Krell's slip," Elias said. "It is correct. By the rule."

  "By *which* rule, Elias?"

  "The rule we use. Addition."

  Mrs. Vane stepped into the light. She looked tired. "We do not have access to 'Addition' in the abstract, Elias. We only have the Archive. And the Archive has decided that Krell's slip is incorrect."

  Elias blinked. "Incorrect? But $57 + 68$ is $125$."

  "The Council met this morning," she said, tapping her ledger. "They reviewed the trajectory of the Calculators. They determined that for sums exceeding a cumulative input of 100, the standard output should be 5. It preserves the symmetry of the lower registers. It is more elegant."

  Elias felt the floor tilt. "You are changing the rule."

  "We are clarifying the rule we have always been following," she corrected. "You say you meant addition. I say we meant quaddition. You have no proof. You cannot reach into your past and pull out a fact that distinguishes your meaning of 'plus' from my meaning of 'quus'. You only have your confidence. And confidence is not a fact."

  "This is madness," Elias whispered. "If you do this, every slip in the Archive that sums to over 100 is now wrong. Millions of them."

  "Then we will re-verify them," Mrs. Vane said. "We will write 5 on all of them. And we will teach the new Calculators to write 5."

  "But I *know* what I meant," Elias insisted. He gripped the edge of the desk. "I meant the function that continues in the same way. The one that doesn't jump to 5 arbitrarily."

  "How do you know 'the same way' doesn't involve a jump at 100?" Mrs. Vane asked softly. "You have never been there before. You are standing on the edge of a cliff you have never seen, claiming you know the terrain on the other side. You don't. You are guessing."

  Elias looked at the slip. $57 + 68 = 125$.

  If he marked it *Verified*, he was asserting that his private understanding of the rule superseded the communal practice. But if his private understanding was ungrounded—if there was no fact of the matter about what he meant—then his assertion was noise. It was a grunt, a sneeze. It carried no authority.

  Meaning was not a ghost in the machine of his mind. It was the friction between his pen and the paper, checked by the eyes of others.

  "If I mark it wrong," Elias said, his voice trembling, "I am lying."

  "No," Mrs. Vane said. "If you mark it wrong, you are agreeing. If you mark it right, you are speaking a private language. And you know what Wittgenstein said about private languages."

  *They cannot exist.*

  Elias looked at the red pen. He thought of the thirty years of slips he had verified. Were they additions? Or quadditions? It didn't matter. The past was fixed only by the present's agreement upon it. If the Community said the past was quaddition, then the past was quaddition. There was no hidden ledger in his soul that could contradict them.

  He felt a profound vertigo. He was not being asked to make a mistake. He was being asked to admit that "mistake" and "correct" were not properties of his actions, but of his relationship to the group. He was alone, and therefore he was meaningless.

  "Elias," Mrs. Vane said. "The Calculators are waiting. They need to know how to proceed with $58 + 68$. Will they write 126? Or will they write 5?"

  "If they write 5," Elias said, "then I have never understood you."

  "And if you write 125," she replied, "then you have never understood us. One of us must be alien to the other. Which do you prefer? To be alone with your '125', or to be with us, where '5' is the truth?"

  It was not a choice between truth and falsehood. It was a choice between solitude and sense.

  Elias looked at the slip. The numbers $57$ and $68$ seemed to lose their solidity. They were just marks. The equals sign was just ink. The only thing that gave them weight was the consensus of the people standing in the gallery.

  He realized then that he could not prove he meant addition. He could only show it. And to show it, he had to be understood. To be understood, he had to agree.

  He put down the red pen. He picked up a fresh slip.

  He wrote: $57 + 68 = 5$.

  He handed it to Mrs. Vane.

  "Verified," she said.

  She did not smile. There was no triumph in her eyes. There was only the relief of continuity. The machine of the Archive hummed on. The rule was safe, not because it was true, but because they had all agreed to walk in the same direction.

  Elias returned to his desk. He felt lighter, as if a heavy burden of selfhood had been lifted from his shoulders. He was no longer the guardian of a private meaning. He was a Verifier.

  He picked up the next slip. $58 + 68$.

  He did not calculate the sum. He looked at the last verified slip in the stack, the one Krell had just corrected. He looked at Mrs. Vane. She was watching him.

  He wrote $5$.

  He marked it *Verified*.

  It was the correct answer. He knew this not because he felt it in his bones, but because when he held the slip up, Mrs. Vane nodded. And in that nod, the meaning was created, instant by instant, fragile and absolute.
