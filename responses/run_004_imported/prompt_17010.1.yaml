answer: |-
  There is a critical misunderstanding in your premise that fundamentally changes the answer: **The Kalai–Smorodinsky (KS) solution does *not* satisfy Independence of Irrelevant Alternatives (IIA).**

  In fact, the core theoretical contribution of Kalai and Smorodinsky (1975) was proving that you **cannot** have both IIA and Individual Monotonicity (along with Pareto efficiency, symmetry, and scale invariance). They are mutually exclusive.

  KS is not a "strict upgrade" that keeps everything Nash has and adds more. It is a **trade-off**: KS sacrifices IIA to gain Monotonicity. Nash keeps IIA but sacrifices Monotonicity.

  Once you recognize this trade-off, the reasons why Nash (or Nash-like mechanisms like Proportional Fairness) remains dominant in scheduling and systems literature become clear. Here is the breakdown of why Nash is often preferred in infrastructure contexts despite KS's intuitive appeal.

  ### 1. The Information Cost of the "Utopia Point"
  The KS solution works by drawing a line from the disagreement point to the **Utopia Point** (the vector of maximum possible utilities each agent could achieve individually) and finding where that line intersects the Pareto frontier.

  *   **Nash:** Requires knowledge of the local geometry of the feasible utility set near the solution.
  *   **KS:** Requires knowledge of the *global* extremes of the feasible set (the Utopia Point).

  **In a scheduler:** To compute the KS solution, you need to know: "If Tenant A were the only tenant on this cluster, what is the maximum throughput they could achieve?" In dynamic, multi-tenant infrastructure, calculating the individual maximum for every tenant is computationally expensive and often opaque. It requires simulating or solving optimization problems for every tenant in isolation. Nash bargaining (often implemented as maximizing the product of utilities, or sum of log utilities) only requires evaluating the current marginal trade-offs.

  ### 2. Stability and Churn (The Consequence of Dropping IIA)
  IIA states that if you remove options from the feasible set that were *not* selected, the solution should not change. KS violates this. Because KS depends on the Utopia Point, if the feasible set shrinks in a way that lowers a tenant's theoretical maximum (even if that maximum was never attainable in a fair agreement), the KS solution shifts for *everyone*.

  **In a scheduler:**
  *   **Scenario:** Tenant C leaves the cluster, or a rack fails, slightly reducing the total capacity.
  *   **Nash:** If the original allocation is still feasible, the Nash solution often remains stable (or changes minimally based on local gradients).
  *   **KS:** The "Utopia Point" for the remaining tenants changes because the physical constraints have shifted. Consequently, the KS bargaining solution recalculates the allocation for Tenants A and B, even if their relative needs haven't changed.

  This causes **unnecessary churn**. In production systems, migrating workloads or adjusting cgroups to rebalance resources has a cost. Nash's adherence to IIA provides a form of hysteresis or stability that KS lacks.

  ### 3. Strategic Foundations
  The Nash Bargaining Solution has a robust non-cooperative foundation. It can be derived as the limit of simple non-cooperative games (e.g., the Rubinstein alternating offers model with vanishing friction). This tells us that if two rational agents actually negotiated programmatically, they would converge on Nash.

  KS lacks a similarly universal non-cooperative implementation. While there are mechanism designs that implement KS, they are generally more complex and rely on stronger assumptions about the agents' knowledge of the global feasible set. In a scheduler, tenants are often not active negotiators but passive recipients of policy; however, the strategic robustness of Nash makes it a safer default against gaming if tenants *do* try to manipulate their reported utilities.

  ### 4. Convex Optimization Tractability
  In practice, "Nash Bargaining" in resource allocation is usually implemented as **Proportional Fairness**, which maximizes the sum of log utilities:
  $$ \max \sum_{i} \log(u_i) $$
  This is a strictly concave objective function (assuming convex feasible sets), making it solvable with standard, highly optimized convex solvers (like interior-point methods).

  The KS solution requires finding the intersection of a ray and a Pareto frontier. While solvable, it is generally less amenable to standard gradient-based optimization techniques used in large-scale distributed schedulers (like Kubernetes or YARN). It often requires iterative bisection or specific geometric algorithms that don't scale as gracefully to high-dimensional resource vectors (CPU, RAM, IO, Network, GPU).

  ### 5. Sensitivity to Outliers
  Because KS depends on the maximum possible utility, it is sensitive to outliers in the feasible set. If one tenant has a wildly different resource profile that allows for a massive theoretical maximum (e.g., a tenant that can utilize 100% of a specific niche resource), it skews the "Utopia Point" and consequently drags the allocation ratio for everyone else.

  Nash bargaining is determined by the marginal rate of substitution at the solution point. It is less sensitive to the extreme edges of the feasible set that are far away from the agreement point.

  ### Summary: When to use which?

  | Feature | Nash Bargaining (Proportional Fairness) | Kalai–Smorodinsky (Max-Min intuition) |
  | :--- | :--- | :--- |
  | **Key Axiom** | Independence of Irrelevant Alternatives (IIA) | Individual Monotonicity |
  | **Info Required** | Local gradients (Marginal utility) | Global extremes (Utopia point) |
  | **Stability** | High (Insensitive to irrelevant options) | Lower (Sensitive to feasible set bounds) |
  | **Computation** | Standard Convex Optimization ($\sum \log u_i$) | Ray-Frontier Intersection |
  | **Fairness View** | Utilitarian / Log-Utilitarian | Rawlsian / Ratio-preserving |

  ### Conclusion
  KS is not an upgrade; it is a different philosophical prioritization. It prioritizes **monotonic fairness** (if the pie gets bigger, no one should get less) over **consistency/stability** (if irrelevant options disappear, the deal shouldn't change).

  In infrastructure scheduling, **stability and low information requirements usually trump strict monotonic fairness.** We prefer Proportional Fairness (Nash) because it is cheaper to compute, requires less global knowledge, and causes less workload churn when the cluster state fluctuates.

  However, if your specific use case involves static resources where the "Utopia Point" is known and stable, and where fairness ratios are legally or contractually mandated (e.g., strict SLAs based on potential capacity), KS might indeed be the better choice. But for general-purpose dynamic scheduling, Nash's trade-offs are usually the pragmatic winner.
