prompt: |-
  Me and another dev are merging our side projects into one startup and trying to figure out how to split decision-making power over the roadmap going forward. We each know what we'd get if we just walked away and kept building solo (not amazing, but fine), and we each also know what our "dream" outcome looks like if the other person just deferred to us on everything. His proposal is that whatever compromise we land on, each of our gains over the walkaway option should be in the same proportion as our two dream outcomes are to each other. I feel like that's not obviously the "fair" way to do it, but I can't articulate why it'd be better or worse than just, like, maximizing how good the deal is for both of us combined. Is there an actual principled way to think about this, or is it just vibes at that point?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Two developers merging side projects into a startup.
      *   **Problem:** Deciding how to split decision-making power (roadmap control).
      *   **Knowns:**
          *   BATNA (Best Alternative to a Negotiated Agreement): What they get if they walk away and build solo ("not amazing, but fine").
          *   "Dream" Outcome: What they get if the other person defers completely (maximum control).
      *   **Partner's Proposal:** Split the *gains* over the walkaway option in proportion to the *dream outcomes*.
          *   Formulaically: Let $W_1, W_2$ be walkaway values. Let $D_1, D_2$ be dream values.
          *   Gain for 1 = $V_1 - W_1$. Gain for 2 = $V_2 - W_2$.
          *   Proposal: $(V_1 - W_1) / (V_2 - W_2) = D_1 / D_2$.
      *   **User's Intuition:** Feels not obviously "fair," but can't articulate why. Wonders if they should just maximize total joint value.
      *   **Question:** Is there a principled way to think about this, or is it just vibes?

  2.  **Evaluate the Partner's Proposal:**
      *   What game theory concept does this resemble? It sounds like a variation of the **Nash Bargaining Solution (NBS)**, but slightly off.
      *   *Nash Bargaining Solution:* Maximizes the *product* of the gains over the disagreement point (BATNA). $(V_1 - W_1) \times (V_2 - W_2)$.
      *   *Kalai-Smorodinsky Solution:* This matches the partner's proposal more closely. It maintains the ratio of maximum possible gains. If Player 1 *could* get 100 gain and Player 2 *could* get 50 gain, KS says they should split the actual feasible gains in that 2:1 ratio.
      *   *Critique of Partner's Proposal:* It assumes the "Dream" is a feasible anchor. In decision-making power, "Dream" usually means 100% control. If both have 100% control as a dream, the ratio is 1:1. But if "Dream" implies different valuations of control (e.g., Dev A cares more about roadmap than Dev B), the ratio shifts.
      *   *Potential Flaw:* It incentivates inflating the "Dream" value. If I claim my dream outcome is worth a billion, I get more leverage. It focuses on *claims* rather than *contribution* or *efficiency*.

  3.  **Evaluate the User's Intuition ("Maximize Combined"):**
      *   This is the **Utilitarian** approach (Maximize $V_1 + V_2$).
      *   *Pros:* Efficient. Creates the biggest pie.
      *   *Cons:* Doesn't address distribution. One person could get 99% of the value and the other 1%, as long as the sum is maximized. It ignores the BATNA. If I get less than my walkaway, I leave.

  4.  **Identify the Core Tension:**
      *   Decision-making power isn't just about utility; it's about *control*, *risk*, and *future value*.
      *   The "Roadmap" is a means to an end (equity value/success), not necessarily the end itself.
      *   Splitting *decision-making* based on *utility functions* is tricky. Usually, decision-making is split based on *expertise*, *equity ownership*, or *time commitment*.

  5.  **Develop a Principled Framework:**
      *   **Game Theory:** Introduce Nash Bargaining Solution (NBS) vs. Kalai-Smorodinsky (K-S). The partner is proposing K-S. NBS is generally more standard for "fair" efficiency.
      *   **Equity vs. Control:** Distinguish between economic rights (money) and control rights (votes). They don't have to be the same.
      *   **Domain Expertise:** Who is better suited to decide what? (Technical vs. Product vs. Market).
      *   **Tie-Breaking:** 50/50 is dangerous. Need a mechanism for deadlock.

  6.  **Drafting the Response:**

      *   **Validation:** Acknowledge that this is a classic negotiation problem, not just vibes.
      *   **Deconstruct the Partner's Proposal:** Identify it as the **Kalai-Smorodinsky Bargaining Solution**. Explain what it does (preserves ratio of maximum potential gains).
          *   *Why it might feel off:* It rewards "aspirational claiming." If my dream is wildly ambitious, I get more weight. It ignores *who creates the value*.
      *   **Deconstruct the User's Intuition:** Maximizing joint value is **Utilitarian/Efficiency**.
          *   *Why it's incomplete:* Doesn't guarantee individual rationality (I need to beat my walkaway).
      *   **The Gold Standard:** Introduce the **Nash Bargaining Solution**. It maximizes the *product* of gains. It balances efficiency with fairness relative to the BATNA.
      *   **Practical Application (The "Real World" Advice):**
          *   Game theory is abstract. Startups need execution.
          *   **Decision Rights $\neq$ Equity.** Suggest separating them.
          *   **Expertise-Based Split:** Who owns Product? Who owns Tech?
          *   **CEO Tie-Breaker:** Someone needs final say. Rotate or assign based on strength.
          *   **Vesting/Equity:** If decision power is tied to equity, ensure equity reflects contribution/risk, not just "dreams."
      *   **The "Walkaway" Check:** Ensure the deal beats the BATNA for *both*.
      *   **Recommendation:** Don't use the partner's formula. It's manipulatable. Use a mix of expertise-based domains + tie-breaker + equity split based on contribution.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is the partner's proposal exactly Kalai-Smorodinsky?* K-S preserves the ratio of *utopia* points relative to the *disagreement* point. Yes, that's what the user described. $(V_1 - W_1) / (V_2 - W_2) = (U_1 - W_1) / (U_2 - W_2)$.
      *   *Is NBS better?* NBS is axiomatically "fairer" in terms of independence of irrelevant alternatives, but K-S is sometimes seen as more monotonic. However, for a startup, *both* are probably overkill. The real issue is that "Dream Outcome" is subjective and hard to quantify.
      *   *Key Insight:* Decision-making power shouldn't be negotiated based on *utility*, but on *competence* and *commitment*. If Dev A is better at product, Dev A should decide product, regardless of their "dream."
      *   *Risk:* 50/50 decision making leads to deadlock. This is the biggest practical risk.

  8.  **Final Structure:**
      1.  Validate: It's not vibes, it's bargaining theory.
      2.  Name the Partner's Model: Kalai-Smorodinsky. Explain pros/cons (incentivizes hype).
      3.  Name the User's Model: Utilitarian (Maximize Sum). Explain pros/cons (ignores distribution).
      4.  The Third Option: Nash Bargaining (Maximize Product of Gains).
      5.  The Practical Pivot: Decision rights $\neq$ Value split.
      6.  Actionable Advice: Domains, Tie-breakers, Equity vs. Control.

  9.  **Tone:** Professional, analytical, empathetic to the co-founder dynamic. Avoid overly dense math, keep it conceptual.

  10. (Final Polish): Ensure I explicitly answer "Is there a principled way?" Yes, Bargaining Theory. But also warn that applying it rigidly to *decision making* is often a mistake compared to applying it to *equity*.

  *(Self-Correction)*: Wait, the user is asking about *decision-making power*, not equity. This is crucial. Splitting decision power based on utility functions is weird. Usually, decision power is about who is CEO or who owns which domain. I need to emphasize that distinction. The partner is trying to negotiate control based on *value claims*. That's risky. Control should be based on *ability to execute*.

