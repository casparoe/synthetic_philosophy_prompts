answer: |-
  The concept of disease is the fulcrum upon which modern medicine leverages its authority. To call a condition a "disease" is to authorize intervention, allocate resources, excuse behavior, and pathologize deviation. For decades, the philosophy of medicine has been stalled in a trench war over the ontological status of this concept. On one side stand the naturalists, who argue that disease is a value-free biological fact waiting to be discovered. On the other stand the normativists, who argue that disease is a label we paste onto conditions we dislike.

  Your meetup group's stalemate is typical. The usual diplomatic solution is to acknowledge that biology matters *and* values matter, then retreat to Jerome Wakefield's "harmful dysfunction" analysis as a peace treaty. But this compromise is unstable. It papers over the cracks rather than repairing the foundation. To move forward, we must stop treating naturalism and normativism as complementary colors and recognize them as competing claims about authority.

  This essay will argue that while biological facts constrain our judgments, the concept of disease is **normative all the way down**. The naturalist project fails not because biology is irrelevant, but because the selection of which biological facts count as "functional" is itself a value-laden act. We will see this by dismantling Christopher Boorse's biostatistical theory, pressing the normativist advantage, and exposing the hidden normativity in Wakefield's hybrid. Finally, we will apply this verdict to the controversy over the DSM-5's removal of the bereavement exclusion, showing that treating disease as a normative tool yields better ethical outcomes than pretending it is a natural kind.

  ### The Biostatistical Bastion

  The strongest fortress for medical naturalism is Christopher Boorse's Biostatistical Theory (BST). Boorse sought to purge medicine of the "ghost in the machine" by defining health and disease strictly in terms of statistical normality and biological function.

  On the BST, a disease is a statistically subnormal contribution of some bodily part or process to survival and reproduction, judged relative to a reference class (age, sex, species). If your heart pumps blood less efficiently than 95% of males your age, and this reduces your survival odds, you have a disease. Crucially, Boorse insists this is value-free. Whether you *mind* having a weak heart is irrelevant; the statistical failure is an objective fact, like the height of a mountain.

  The appeal of BST is obvious. It promises to protect medicine from political intrusion. If disease is a biological fact, then doctors are technicians fixing broken machines, not moralists enforcing social conformity. It grounds medical authority in the hard sciences rather than the soft sands of culture.

  ### The Normativist Siege

  However, the BST crumbles when exposed to the history of medicine and the logic of classification. The normativist attack comes on two fronts: historical embarrassment and conceptual counterexamples.

  Historically, the claim that disease is value-free is falsified by the existence of conditions that were biologically "real" to the physicians of their time but are now recognized as political artifacts. The canonical example is *drapetomania*. In 1851, Samuel Cartwright described this as a disease of the mind that caused enslaved Africans to flee captivity. Under Boorse's account, if fleeing captivity reduced survival/reproduction within the reference class of enslaved people (due to punishment/death), and involved a psychological mechanism, it could arguably qualify as a dysfunction. Yet, we do not say Cartwright was *biologically mistaken*; we say he was *morally monstrous*. The error was not in his measurement of statistics, but in his valuation of the goal (remaining enslaved).

  Similarly, consider the declassification of homosexuality as a mental disorder in 1973. Did the APA discover a new biological fact about gay brains in 1973? No. The biological substrate remained constant; the social valuation shifted. If disease were purely naturalistic, the status of homosexuality should have been invariant to civil rights movements. The fact that it changed suggests that "mental disorder" tracks social harm and deviation from norms, not just internal mechanism failure.

  Conceptually, Boorse's account fails to distinguish between *abnormality* and *pathology*.
  1.  **Harmless Abnormalities:** Being significantly taller than average is statistically subnormal (at the extreme), yet we do not call it a disease. Boorse might argue it doesn't reduce survival, but what of a genetic mutation that makes one immune to a specific plague but reduces fertility by 1%? Is that a disease?
  2.  **Universal Diseases:** Imagine a population where 100% of members have severe tooth decay due to environmental factors. On BST, this is statistically normal, so it is not a disease. This is absurd. If everyone is sick, the disease is no less real. This suggests that "statistical normality" is the wrong metric; we care about *ideal* functioning, not *average* functioning. But who defines the ideal? That is a normative question.

  ### The Hybrid Trap: Wakefield's Harmful Dysfunction

  Recognizing these flaws, Jerome Wakefield proposed the "Harmful Dysfunction" (HD) analysis to save naturalism. He argues a condition is a disorder only if:
  1.  **Dysfunction:** A biological mechanism fails to perform its naturally selected function (Naturalistic).
  2.  **Harm:** The failure causes harm to the person, as judged by social values (Normative).

  This looks like a perfect synthesis. It handles drapetomania (fleeing is not a dysfunction of a mechanism designed for freedom) and homosexuality (no dysfunction exists). It handles universal diseases (the mechanism is dysfunctional even if universal).

  However, the HD analysis does not rescue naturalism; it merely relocates the normativity into the "dysfunction" clause while pretending it isn't there. The concept of "function" is teleological—it implies a *goal*. Wakefield relies on evolutionary history to define these goals (a mechanism's function is what it was selected for). But evolutionary selection is a blind process, not a designer with intentions. To say a mechanism is "failing" its evolutionary purpose is to impose a narrative of *design* onto a process of *causation*.

  More critically, the "dysfunction" clause does no heavy lifting without the "harm" clause. Consider a person with a genetic mutation that renders them unable to synthesize Vitamin C (like all humans, actually, but imagine a more severe variant). If they take supplements and suffer no ill effects, is it a dysfunction? Biologically, yes. Medically, no. We only care about the dysfunction because it leads to harm.

  But worse, consider the reverse: a condition that is evolutionarily "functional" but harmful. Severe aggression might be an evolved strategy for resource acquisition in certain contexts. If it leads to imprisonment and misery, is it a disorder? Wakefield says no, because the mechanism is working as designed. But psychiatry often treats such traits as disorders (e.g., antisocial personality disorder). Here, we pathologize the *evolutionary success* because we value social cooperation over individual resource dominance.

  Thus, Wakefield's "dysfunction" is not a value-free anchor. Determining which evolutionary traits count as "proper function" in a modern context requires a normative judgment about what humans *ought* to be. The HD analysis admits normativity through the back door of "harm," but fails to acknowledge that the definition of "function" is equally contaminated by our values.

  ### The Verdict: Normative All the Way Down

  We must therefore reject the naturalist hope. Disease is not a natural kind like "gold" or "water." It is a **normative technology**.

  This does not mean medicine is "just politics" or that biological facts don't matter. Biological reality constrains our normative judgments. You cannot label gravity a disease, because you cannot fix it. You cannot label death a disease (currently), because it is universal and inevitable. But within the space of biological possibilities, the line we draw between "health" and "disease" is determined by what we value.

  We label a condition a disease when three conditions meet:
  1.  There is a biological deviation (the constraint).
  2.  The deviation causes suffering or limitation (the harm).
  3.  We judge that intervention is appropriate and the condition is not a justified response to the environment (the norm).

  The third condition is the kicker. It explains why drapetomania was a false disease (the "deviation" was a justified response to oppression) and why grief can be a non-disease (a justified response to loss). Naturalism fails because it tries to derive the "ought" of treatment from the "is" of biology. But biology tells us how things *are*; only values tell us which states of affairs are *unacceptable*.

  Accepting this verdict changes how we practice medicine. It forces us to admit that diagnosing is an ethical act, not just a technical one. It removes the shield of "objective science" that allows physicians to dismiss patient values. If disease is normative, then patients have a seat at the table in defining it, because they are the stakeholders in the values being enforced.

  ### Application: The DSM-5 Bereavement Exclusion

  To prove this verdict earns its keep, let us apply it to a live controversy: the DSM-5's removal of the bereavement exclusion for Major Depressive Disorder (MDD).

  In the DSM-IV, if a patient presented with depressive symptoms within two months of losing a loved one, clinicians were instructed *not* to diagnose MDD. The assumption was that grief is a normal, healthy process, not a disease. In the DSM-5, this exclusion was removed. If symptoms meet the criteria, it is depression, regardless of the trigger.

  **The Naturalist Interpretation:**
  Proponents of the change argued from a naturalist standpoint. They claimed that the neurobiology of grief-induced depression and endogenous depression is identical. The brain chemistry, the sleep disturbance, the anhedonia—it is all the same "dysfunction." Therefore, distinguishing them based on an external event (death) is unscientific. If the mechanism is broken, it is broken. To withhold diagnosis is to deny treatment to people suffering from a biological fact.

  **The Normativist Interpretation:**
  Critics argued from a normativist standpoint. They claimed that grief is a *meaningful* response to loss. To pathologize it is to misunderstand the human condition. Suffering is not always a disease; sometimes it is a requisite part of love and social bonding. By removing the exclusion, psychiatry medicalizes a normal human experience, turning sorrow into a symptom and potentially treating it with pharmaceuticals that blunt necessary emotional processing.

  **Adjudication via Normative Verdict:**
  If we accept my verdict—that disease is normative all the way down—the Naturalist argument collapses. The fact that the neurobiology is identical is irrelevant to the *classification*. We do not diagnose diseases based solely on internal states; we diagnose based on the *appropriateness* of the state to the context.

  Pain is biologically identical whether caused by a broken leg or a torture device. But we treat the contexts differently. In the case of bereavement, the "dysfunction" (withdrawal, sadness, lack of pleasure) serves a social and psychological function: it signals need, processes loss, and reorganizes life.

  The DSM-5 change was not a discovery of new biological facts. It was a shift in values. It prioritized **symptom reduction** (the value of alleviating suffering quickly) over **meaning-making** (the value of processing loss naturally).

  By admitting this is a normative shift, we can have an honest debate.
  *   *Naturalist framing:* "We found out grief is actually a disease." (False, closes debate).
  *   *Normative framing:* "We have decided that the risk of untreated depression outweighs the risk of medicalizing grief." (True, opens debate).

  Under the normative verdict, the DSM-5 committee made a value judgment that efficiency and risk-aversion are higher priorities than preserving the sanctity of the grief process. This is a defensible position, but it must be defended on ethical grounds, not hidden behind the cloak of biological discovery. It forces clinicians to ask: *Am I treating a pathology, or am I treating a human reaction that I find uncomfortable?*

  ### Conclusion

  The dispute between naturalism and normativism is not a draw. Naturalism offers a comforting illusion of objectivity, but it cannot account for the history of medical error or the logic of classification without smuggling in values. Wakefield's hybrid attempts to patch the hole but leaves the foundation rotten.

  We must accept that "disease" is a tool we use to carve up biological reality according to human interests. It is normative all the way down. This is not a condemnation of medicine, but a maturation of it. When we stop pretending our diagnoses are value-free facts of nature, we become more responsible for the values they enact. We stop asking "Is this *really* a disease?" and start asking "Does labeling this a disease serve human flourishing?"

  In the case of bereavement, and in the case of drapetomania before it, the answer to that question determines the morality of the cure. Biology provides the canvas, but values hold the brush. To pretend otherwise is not good science; it is bad philosophy.
