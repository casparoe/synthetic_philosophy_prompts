prompt: |-
  I'm on my school's Lincoln-Douglas debate team, and the resolution at our next tournament is close enough to "the law ought to enforce a society's shared moral standards" that I decided to build my affirmative case around the actual historical Hart-Devlin debate instead of improvising from first principles. I feel solid on the basics: Devlin's argument, sometimes called the "disintegration thesis," holds that a society's shared morality functions as the cement holding it together, so that flouting it, even privately, is closer to treason than we usually assume, and he locates the boundary of that shared morality wherever an ordinary, reasonable person would feel "intolerance, indignation, and disgust." I also know Hart's classic reply, that Devlin never actually shows that moral non-conformity threatens any society's survival.

  What worries me more is Ronald Dworkin's follow-up, since I suspect it's the rebuttal my cross-ex opponents are more likely to have actually read. Dworkin argues that the "reasonable man" standard can't do the work Devlin wants, because a person's stated moral view might really just be prejudice, a rationalization built on unsupported factual claims, mere personal aversion with no reasoning behind it, or "parroting" (simply repeating whatever the people around them already say) — and only convictions that survive this filtering, he argues, should count toward the "public morality" that could justify legislation. My debate partner thinks this basically wins the round for the negative before it even starts.

  I'd like you to help me build the strongest available response on Devlin's behalf. Specifically, please argue that Dworkin's four-part filter is not the neutral, purely descriptive sociological test it's presented as, but already smuggles in a substantive and contestable theory of what makes a moral belief legitimate — roughly, that a legitimate moral belief must come from independent reasoning grounded in accurate premises, rather than from inherited authority or tradition. Since Devlin claims only to be describing a society's actual morality as it really is, not defending any first-order ethical theory of his own, he shouldn't have to accept that assumption just to get his argument off the ground. In short, make the case that Dworkin doesn't beat Devlin on Devlin's own terms — he relocates the fight onto ground where a broadly liberal, rationalist picture of moral belief wins automatically. Please work directly with Dworkin's specific categories rather than falling back on Hart's separate harm-principle objection, which I've already got covered elsewhere in my case.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** High school Lincoln-Douglas (LD) debate.
      *   **Resolution:** "The law ought to enforce a society's shared moral standards" (paraphrased).
      *   **Case Strategy:** Affirmative case based on the historical Hart-Devlin debate (Legal Moralism).
      *   **User's Knowledge:** Understands Devlin's "disintegration thesis" and "intolerance, indignation, and disgust" standard. Understands Hart's empirical critique (no evidence moral non-conformity kills societies).
      *   **The Problem:** Worried about Ronald Dworkin's critique of Devlin. Partner thinks Dworkin wins the round for Negative immediately.
      *   **The Task:** Build the strongest response *on Devlin's behalf* against Dworkin.
      *   **Specific Argument to Make:** Dworkin's four-part filter (prejudice, rationalization, aversion, parroting) is *not* a neutral sociological test. It smuggles in a substantive, contestable liberal/rationalist theory of moral legitimacy (independent reasoning > tradition/authority). Devlin is describing *actual* morality, not *ideal* morality. Therefore, Dworkin changes the terms of the debate rather than defeating Devlin on Devlin's terms.
      *   **Constraint:** Work directly with Dworkin's specific categories (prejudice, rationalization, aversion, parroting). Do not fall back on Hart's harm principle.

  2.  **Deconstruct Dworkin's Critique (The "Four Filters"):**
      *   Dworkin argues that just because people feel "intolerance, indignation, and disgust" doesn't mean the law should enforce it.
      *   He suggests we must filter out moral beliefs that are:
          1.  **Prejudice:** Based on bias against a group.
          2.  **Rationalization:** Based on false factual claims.
          3.  **Personal Aversion:** Just "I don't like it," not "It's wrong."
          4.  **Parroting:** Unthinking adoption of others' views.
      *   *Goal:* Show that applying these filters requires the judge/state to make substantive ethical judgments, which contradicts Devlin's descriptive project.

  3.  **Develop the Counter-Argument (Devlin's Defense):**
      *   *Core Thesis:* Devlin's project is *sociological/descriptive* (What *is* the bond of society?), whereas Dworkin's filter is *normative/epistemological* (What *counts* as a valid moral belief?).
      *   *Point 1: The Function of Shared Morality.* Devlin argues society needs a *common* language of right and wrong to function. It doesn't matter if that language is philosophically perfect; it matters that it is *shared*. Dworkin's filter fragments this shared understanding by empowering elites/judges to decide which beliefs "count."
      *   *Point 2: Attacking the Filters.*
          *   **Prejudice:** Who defines prejudice? Often, deep moral truths look like prejudice to outsiders (e.g., historical views on usury, incest). If the "ordinary person" feels disgust, that *is* the social bond, regardless of whether a philosopher calls it prejudice.
          *   **Rationalization (Factual Claims):** Many moral beliefs rest on metaphysical or religious premises, not empirical "facts." Dworkin assumes a secular/empiricist worldview. If society believes X is sinful because of God, calling that a "false factual claim" imposes secularism.
          *   **Personal Aversion:** The line between "I don't like this" and "This is wrong" is blurry in the public square. Public morality *is* aggregated private aversion. To separate them is to deny the democratic nature of the morality.
          *   **Parroting:** Most shared morality *is* parroted. That's how culture works. If we exclude transmitted values, we exclude tradition itself. Devlin values tradition as the cement; Dworkin values individual reasoning. That's a clash of first principles, not a refutation.
      *   *Point 3: The "Neutral" Trap.* Dworkin claims his filter is neutral. It isn't. It privileges liberal autonomy and rationalism over communal cohesion and tradition. Devlin shouldn't accept this burden.
      *   *Point 4: The Institutional Competence.* Who applies the filter? Judges? If judges decide which moral beliefs are "rational" enough to be law, we have rule by philosopher-kings, not rule by shared social standards. This undermines the democratic legitimacy Devlin cares about.

  4.  **Structure the Response for LD Debate:**
      *   **Introduction:** Acknowledge Dworkin's sophistication but frame it as a category error.
      *   **Contention 1: The Category Error (Descriptive vs. Normative).** Devlin describes the *existence* of the bond; Dworkin evaluates the *quality* of the thread.
      *   **Contention 2: The Substantive Bias of the Filters.** Go through the four filters and show how each assumes liberal rationalism.
      *   **Contention 3: The Institutional Danger.** Applying the filter requires judicial overreach, which defeats the purpose of "shared" standards.
      *   **Conclusion:** Reiterate that Dworkin wins only if we accept liberal individualism as the default, which is the very thing being debated.

  5.  **Refine the Tone:**
