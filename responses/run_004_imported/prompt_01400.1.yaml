  *(Self-Correction Note)*: Wait, I need to make sure I don't concede that Devlin *is* right about morality, but rather that Dworkin fails to defeat Devlin *on Devlin's terms*. The prompt asks to argue that Dworkin relocates the fight. I need to emphasize that *if* the resolution is about "shared moral standards," Dworkin's filter *changes* what "shared moral standards" means.

  8.  **Finalizing the Argument:**
      *   **Core Insight:** Dworkin transforms "Shared Moral Standards" from "What the community actually believes" to "What the community *should* believe if they were liberal philosophers." This begs the question against Legal Moralism.

  9.  (Drafting the response based on these thoughts.)
answer: |-
  This is a sophisticated strategic pivot. You are correct that many Negatives will deploy Dworkin as a "silver bullet" because his critique sounds procedural and neutral, when it is actually deeply substantive. If you can demonstrate that Dworkin's filter is not a test of *validity* but a test of *ideological compliance*, you neutralize the attack and turn it into a framework victory.

  Here is a structured argument you can adapt for your Affirmative case or 1AR, specifically designed to defend Devlin against Dworkin without retreating to Hart's harm principle.

  ### Core Thesis: The Category Error
  **Dworkin does not refute Devlin; he redefines the terms of the debate to beg the question against Legal Moralism.**

  Devlin's project is **sociological and descriptive**: He is asking, "What actually holds a society together?" His answer is: A shared web of moral intuitions, regardless of their philosophical pedigree.
  Dworkin's project is **epistemological and normative**: He is asking, "Which moral beliefs are worthy of respect?" His answer is: Only those that meet liberal standards of reasoning.

  If the resolution is whether the law ought to enforce *a society's shared moral standards*, Devlin defines that as "what the society actually believes." Dworkin defines it as "what the society would believe if it reasoned correctly." Dworkin wins only if you accept that the "real" morality of a society is the idealized one, not the actual one. That is a contestable ethical claim, not a neutral filter.

  ---

  ### Argument 1: The Filters Smuggle in Liberal Rationalism
  Dworkin presents his four filters as a way to clean up "noise" in public opinion. However, each filter privileges a specific, contestable theory of moral knowledge (Liberal Rationalism) over Devlin's theory (Communal Traditionalism).

  **1. Prejudice vs. Conviction**
  *   **Dworkin's Claim:** We must filter out beliefs based on prejudice against a group.
  *   **Devlin's Defense:** The distinction between "prejudice" and "moral conviction" is often in the eye of the beholder. Historically, deeply held moral truths (e.g., the sanctity of marriage, duties to God) have been dismissed by elites as "prejudice." By allowing the state to decide which visceral moral reactions are "prejudice" and which are "principle," Dworkin empowers the judiciary to override the democratic moral consensus. Devlin argues the *intensity* of the feeling (intolerance/indignation) is the sociological fact that binds society; Dworkin tries to judge the *content* of the feeling. That requires a first-order ethical theory Devlin never claimed to have.

  **2. Rationalization (Factual Claims)**
  *   **Dworkin's Claim:** We must filter out beliefs based on false factual premises.
  *   **Devlin's Defense:** This assumes a secular, empiricist worldview where moral truths rest on observable facts. Many shared moral standards rest on metaphysical, theological, or traditional premises (e.g., "Human life is sacred because it is God-given"). A secular judge might call this a "false factual claim" (no God), but for the society in question, it is the foundation of their morality. Dworkin's filter effectively disqualifies religious or traditional moralities from counting as "public morality," which biases the debate against conservative or religious societies.

  **3. Personal Aversion**
  *   **Dworkin's Claim:** We must distinguish between "This is wrong" and "I don't like this."
  *   **Devlin's Defense:** In the public square, these are often indistinguishable. The "disgust" Devlin cites *is* the social signal. To demand that citizens articulate a Kantian or Utilitarian reason for their disgust before it counts as morality is to demand that only philosophers participate in democracy. If the "ordinary person" feels aversion, that *is* the social cement. Dworkin's requirement that aversion be translated into reasoned principle imposes an intellectual burden that destroys the "shared" nature of the standard.

  **4. Parroting (Unthinking Adoption)**
  *   **Dworkin's Claim:** We must filter out beliefs that are merely repeated from tradition without independent thought.
  *   **Devlin's Defense:** This is the most damaging filter to Devlin, and the most revealing of Dworkin's bias. Devlin explicitly argues that **tradition and inherited authority are the cement of society.** If you filter out "parroting," you filter out tradition itself. Most shared morality *is* transmitted, not independently derived. Dworkin assumes that a moral belief is only legitimate if it is autonomously generated by the individual. This is a substantive liberal value (autonomy > cohesion). Devlin argues cohesion > autonomy. Dworkin cannot use a filter that assumes autonomy is required for legitimacy to defeat a theory that argues cohesion is the priority.

  ---

  ### Argument 2: The Institutional Competence Problem
  Even if we grant Dworkin's filters are good ideas, they are institutionally impossible to apply without violating the spirit of the resolution.

  *   **Who Applies the Filter?** To apply Dworkin's test, a judge or legislator must psychoanalyze the electorate. They must determine: *Is this voter disgusted because of prejudice? Or because of principle? Did they think this through, or did they hear it at church?*
  *   **The Elitist Turn:** This grants the state the power to decide which parts of the people's morality are "valid." Devlin warns that this leads to an oligarchy of "reasonable men" (who look suspiciously like Oxford liberals) ruling over the "unreasonable" masses.
  *   **Impact:** If the law enforces only the morality that survives Dworkin's filter, it is no longer enforcing *society's* standards. It is enforcing *the judiciary's* standards of what society *should* think. This collapses the Affirmative's duty to uphold "shared standards" into a Negative duty to uphold "enlightened standards."

  ---

  ### Argument 3: The "Actual vs. Ideal" Trap
  This is your framing point for the round.

  *   **Devlin's Definition:** "Shared Moral Standards" = The actual, existing web of beliefs that bind the community, flawed as they may be.
  *   **Dworkin's Definition:** "Shared Moral Standards" = The hypothetical web of beliefs the community would hold if they were rational, secular, and autonomous.
  *   **The Clash:** The resolution asks about enforcing *a society's* standards, not *a philosopher's* standards. Dworkin wins only if he proves that "irrational" or "traditional" beliefs don't count as morality. But Devlin's entire point is that society disintegrates when you tell people their deepest, unreasoned intuitions don't count.
  *   **The Turn:** Dworkin's filter *causes* the disintegration Devlin predicts. By telling citizens that their moral intuitions are invalid unless they pass a rationality test, you alienate them from the law. You create a gap between "Legal Morality" (Dworkin's filtered version) and "Social Morality" (Devlin's actual version). That gap *is* the disintegration. Therefore, applying Dworkin's filter violates the Affirmative's goal of social cohesion.

  ---

  ### How to Deploy This in Cross-Ex or Speeches

  **In Cross-Ex (asking the Negative):**
  *   "Does Dworkin's 'parroting' filter exclude moral beliefs inherited from religious tradition?" (If yes: "So Dworkin's standard is inherently secular?")
  *   "Who decides whether a voter's disgust is 'prejudice' or 'principle'? A judge?" (If yes: "So the 'shared' standard is actually determined by the judiciary?")
  *   "Devlin argues society is held together by shared intuition, not shared philosophy. Does Dworkin's requirement for independent reasoning undermine the role of intuition in social cohesion?"

  **In Your 1AC/2AC (Pre-empting the Dworkin Turn):**
  *   "The Negative will likely cite Dworkin to argue that not all moral beliefs count. But notice that Dworkin's four filters—prejudice, rationalization, aversion, parroting—are not neutral. They assume that legitimate morality must be secular, empirical, and individually derived. This begs the question against Legal Moralism. If the resolution asks about *society's* standards, we must look at the standards society *actually holds*, not the standards a liberal philosopher wishes they held. To apply Dworkin's filter is to privilege autonomy over cohesion, which is the very value clash of this round, not a preliminary objection."

  **In Your 1AR (Responding to the Dworkin Turn):**
  *   "The Negative argues Dworkin refutes Devlin. But Dworkin only refutes Devlin if you accept that moral legitimacy requires independent reasoning. Devlin explicitly rejects this. He argues tradition and shared intuition *are* the bond. When Dworkin filters out 'parroting,' he filters out tradition. When he filters out 'non-rational' beliefs, he filters out religion. Dworkin isn't describing society's morality; he's prescribing a new one. That doesn't answer Devlin's sociological claim that ignoring actual morality causes disintegration. In fact, imposing Dworkin's filter *causes* that disintegration by telling citizens their actual moral views are illegitimate."

  ### Summary for the Judge
  "Judge, the Negative wants to use Dworkin to say the Affirmative only enforces 'bad' morality. But Dworkin's definition of 'bad' morality relies on a liberal theory of ethics that prioritizes individual reasoning over communal tradition. Devlin's whole point is that society relies on that tradition. Dworkin doesn't defeat Devlin; he just changes the subject from 'What binds society?' to 'What binds a society of liberals?' Since the resolution asks about society's standards generally, we must evaluate the standards they actually have, not the ones Dworkin wishes they had."
