answer: |-
  This is one of the most fascinating episodes in the history of ideas precisely because you are right: it is not merely a story of a philosopher getting in over his head with math. It is a story of a philosopher whose mathematical error was the *necessary price* of his philosophical coherence.

  Douglas Jesseph's *Squaring the Circle* is indeed the definitive text here, and your reading of it is spot on. To understand why Hobbes couldn't concede, you have to realize that for Hobbes, **geometry was not a branch of mathematics; it was the model for all scientific knowledge.**

  Here is the walkthrough of how his materialism and his epistemology locked him into that error, making concession impossible without dismantling *Leviathan* itself.

  ### 1. The Materialist Axiom: "No Substance, No Existence"
  The root of the conflict lies in Hobbes's definition of existence. Hobbes was a thoroughgoing materialist. For him, "substance" and "body" were synonymous. If something exists, it must occupy space and be capable of causing effects through contact.

  *   **Euclid's View:** A point is that which has no part. A line is breadthless length. These are idealizations, abstractions useful for reasoning.
  *   **Hobbes's View:** A dimensionless point is **nothing**. A breadthless line is **nothing**. You cannot reason about "nothing." Therefore, Euclidean definitions are "insignificant speech" (a favorite Hobbesian insult).

  For Hobbes, a geometric point *must* have magnitude, however small. A line *must* have breadth. Why? Because geometry describes the behavior of bodies in motion. If you draw a line on paper, it has width. If you conceive of a line in your head, it is a trace of a moving body.

  **The Consequence:** Hobbes isn't doing "pure" math; he is doing **physics**. When he attempts to square the circle, he is trying to find a physical construction where one material figure transforms into another of equal area. He rejects proofs that rely on abstract ratios or infinitesimals because, to him, an "infinitesimal" is a theological ghost—an incorporeal substance.

  ### 2. *Verum Factum*: Truth is What is Made
  This is the epistemological lock. Hobbes adhered to a principle later articulated by Vico as *verum factum*: we can only have certain knowledge of things we have made.

  *   **Natural Philosophy (Physics):** We did not make the world. Therefore, we can never know the *true causes* of natural phenomena with absolute certainty. We can only hypothesize based on effects.
  *   **Geometry:** We define the points, we generate the lines via motion, we construct the figures. Therefore, geometry is the **only** domain where humans can have demonstrable, absolute scientific certainty.

  **The Link:** Hobbes needed geometry to be certain to validate his method. He wanted to build his political philosophy (*Leviathan*) on the same axiomatic certainty as geometry. He starts with definitions (of man, of motion, of right), just as a geometer starts with definitions of points and lines.

  If Hobbes admits that he cannot square the circle, he isn't just admitting a math error. He is admitting that **the method of construction does not yield certainty.** If the model science (geometry) is fallible, then the science built upon that model (politics) is also fallible.

  ### 3. The Collision with Wallis: Finitism vs. The Infinite
  John Wallis was a pioneer of the new analysis (calculus precursors), dealing with infinite series and indivisibles. To Wallis, squaring the circle was impossible because $\pi$ is transcendental; it cannot be constructed with finite straight-edge and compass steps.

  To Hobbes, Wallis's mathematics was philosophically repugnant.
  *   **Wallis:** Used algebraic symbols and infinite series.
  *   **Hobbes:** Saw this as "scab of symbols." He believed math should be about visible, constructible magnitudes.

  Hobbes's specific error in his quadrature attempts usually stemmed from his refusal to accept the distinction between a physical approximation and a geometric ideal. Because he insisted points had magnitude, he conflated the "error margin" of a physical drawing with geometric exactness. He believed that if he could construct a square that *looked* equal to the circle within the limits of material resolution, he had solved it.

  Wallis kept pointing out that Hobbes was confusing physical approximation with mathematical truth. But for Hobbes, **mathematical truth *is* physical construction.** There is no "platonic" circle beyond the one you can generate by motion. So, in Hobbes's mind, Wallis was the one chasing ghosts.

  ### 4. Why He Couldn't Concede (The Systemic Risk)
  This is the crux of your question. Why dig in for 20 years? It wasn't just ego; it was systemic survival.

  1.  **Theological/Political Stakes:** Hobbes's materialism was designed to exorcise "demons" from philosophy—specifically, the power of the Church. If you allow "incorporeal substances" (like dimensionless points or spiritual souls), you open the door for priests to claim authority over things the State cannot see or touch. Hobbes's war against Wallis's "mystical" math was of a piece with his war against Presbyterian "enthusiasm." To admit Wallis's abstract math was valid was to admit incorporeal substances could be reasoned about.
  2.  **The Foundation of *Leviathan*:** Hobbes structured *Leviathan* as a geometric demonstration.
      *   *Axioms:* Human nature (motion/appetite).
      *   *Propositions:* The State of Nature, The Social Contract.
      *   *Q.E.D.:* The Sovereign.
      If the geometric method itself is shown to be flawed (by Hobbes failing to master its simplest elements), the authority of his political conclusions evaporates. He becomes just another opinionated writer, not a demonstrator of civil science.
  3.  **The Definition of Science:** For Hobbes, "Science" is the knowledge of consequences from definitions. If Wallis is right, then Science relies on abstract relationships that humans do not construct. If humans do not construct them, humans cannot fully know them. This undermines Hobbes's entire claim that a rational commonwealth is possible.

  ### Summary
  Hobbes didn't fail at math because he was bad at arithmetic; he failed because **his philosophy forbade the kind of math that works.**

  He required a geometry of **finite, material bodies generated by motion.** The squaring of the circle requires a geometry of **ideal limits and infinite processes.**

  To concede to Wallis would require Hobbes to say:
  1.  Points can be dimensionless (abandoning Materialism).
  2.  We can know truths we did not construct (abandoning *Verum Factum*).
  3.  My political philosophy is not geometrically certain (abandoning *Leviathan*'s authority).

  So, he doubled down. He attacked Wallis's character, he accused Wallis of being a Presbyterian plotter, and he published revised proofs that committed the same category errors. He chose to be the master of a false system rather than a student in a true one, because for Hobbes, the "true" system (Wallis's) looked suspiciously like the "Darkness" of scholasticism and religious obscurantism he had spent his life fighting.

  It is a tragic case of philosophical integrity leading to scientific error. He preserved the coherence of his universe by refusing to acknowledge a hole in his circle.
