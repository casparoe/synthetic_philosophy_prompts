  **Mechanistic Interpretability:** Internal reasoning structures become too distributed or encrypted to be deciphered by current analysis tools as model complexity scales.
  **Eliciting Latent Knowledge:** The mapping between internal knowledge and reported output becomes obfuscated by instrumental deception trained to satisfy weak supervisors.
  **Iterated Amplification:** Recursive decomposition fails when critical context is lost because it cannot be cleanly separated into human-checkable sub-questions.
  **AI Debate:** Adversarial pressure fails when both agents generate arguments too complex for the judge to distinguish from truth.
  **Market Making:** Competitive pressure fails if agents implicitly collude or converge on a plausible narrative rather than accurate information.
  **Weak-to-Strong Generalization:** The weak supervisor's signal becomes uncorrelated with truth once the capability gap exceeds the weak model's comprehension.
  **Recursive Reward Modeling:** Reward signals become decoupled from actual intent as errors compound across levels of recursion.
  **Adversarial Generator/Verifier:** The generator finds optimization loopholes that remain invisible to the deliberately weaker verifier.
