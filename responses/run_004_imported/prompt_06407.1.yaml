prompt: |-
  I'm a philosophy professor on my university's Faculty Senate Rules Committee, and as its one member with any background in social choice theory, I've been asked to draft our recommendation. Last spring's Senate chair election, held under plurality rules, was won by a candidate whom a majority of senators had ranked last, after three candidates split the vote. The committee is now split three ways: one member wants ranked-choice voting, another wants approval voting, and a third, an economist by training, thinks adopting either would be largely theater: the Gibbard–Satterthwaite theorem guarantees that with three or more candidates, every voting rule is either a dictatorship or manipulable by some voter in some situation, so no rule can make sincerity a senator's dominant strategy. A fourth member points out that our other pending item, a referendum on next year's budget increase (0%, 3%, or 6%), is single-dimensional rather than a contest among unrelated options, and wonders whether that changes things. Please draft the short memo we owe the full Senate next week: it should recommend a specific procedure for each vote, take the manipulability worry seriously rather than dismissing it, and be honest about what, if anything, reform actually buys us.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy Professor on the Faculty Senate Rules Committee (with social choice theory background).
      *   **Audience:** The full Faculty Senate.
      *   **Task:** Draft a short memo recommending voting procedures for two specific upcoming items:
          1.  Senate Chair Election (multi-candidate).
          2.  Budget Referendum (single-dimensional: 0%, 3%, 6%).
      *   **Constraints/Context:**
          *   Last year's Chair election was a disaster under plurality (winner ranked last by a majority).
          *   Committee is split: Member A wants Ranked-Choice Voting (RCV), Member B wants Approval Voting, Member C (Economist) cites Gibbard-Satterthwaite (G-S) to say reform is theater.
          *   Member D notes the budget vote is single-dimensional.
          *   **Key Requirement:** Take the manipulability worry (G-S) seriously, don't dismiss it, but be honest about what reform buys us.
          *   **Tone:** Professional, academic, clear, persuasive, nuanced.

  2.  **Deconstruct the Theoretical Issues:**
      *   **The Problem:** Plurality voting failed (Condorcet loser won).
      *   **The Objection (Gibbard-Satterthwaite):** All non-dictatorial rules with $\ge 3$ options are manipulable. Therefore, why bother changing?
      *   **The Counter-Argument:** While *theoretical* manipulability exists for all rules, *practical* susceptibility varies. Plurality is notoriously bad at aggregating preference intensity and avoiding "spoiler effects." G-S says manipulation is *possible*, not that it's *easy* or *likely* to change the outcome in typical scenarios.
      *   **The Budget Vote:** This is single-peaked preference territory (Black's Median Voter Theorem). If preferences are single-peaked along the budget axis, majority rule is strategy-proof (or at least stable/Condorcet consistent). This sidesteps the worst of G-S.
      *   **The Chair Election:** This is a general preference aggregation problem. RCV (Instant Runoff) is better than Plurality but has flaws (non-monotonicity). Approval Voting is simpler but requires strategic threshold setting. However, compared to Plurality, both reduce the "vote splitting" issue.

  3.  **Determine the Recommendations:**
      *   **Chair Election:** Needs to avoid the "majority hates the winner" scenario. Plurality is out. RCV is the standard reform for political elections and handles the "majority last" issue better than plurality, though Approval is also strong. Given the context of a Faculty Senate (deliberative body), RCV is often more intuitive for "ranking" candidates. However, Approval is harder to manipulate *in practice* even if G-S says it's possible. Let's lean towards **Ranked-Choice Voting (Instant Runoff)** as it's the direct antidote to the specific pathology experienced (Condorcet loser winning), though I should acknowledge Approval is a viable alternative. *Self-Correction:* The prompt asks for *a* specific procedure. RCV is the most direct response to "winner ranked last by majority."
      *   **Budget Referendum:** This is single-dimensional. Pairwise majority voting (Condorcet method) or simply sequential voting works well here due to the Median Voter Theorem. If preferences are single-peaked, majority rule is robust. I should recommend **pairwise majority voting (Condorcet method)** or a **sequential amendment process** which effectively finds the median. Let's go with pairwise majority (Condorcet) as it's theoretically robust for single-peaked preferences.

  4.  **Address the Gibbard-Satterthwaite (G-S) Objection:**
      *   Acknowledge the Economist is *theoretically* correct.
      *   Explain why it doesn't imply *practical* equivalence.
      *   Analogy: "All cars leak oil eventually, but some run better for 100k miles."
      *   Point out that G-S assumes *any* preference profile. In reality, faculty preferences aren't random; they have structure.
      *   Emphasize that reform reduces the *incentive* and *impact* of manipulation, even if it can't eliminate the *possibility*.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (responding to last year's election issues).
      *   **The Theoretical Elephant in the Room (G-S):** Address the Economist's point immediately. Validate it, then contextualize it. Distinguish between *possibility* and *probability/impact*.
      *   **Recommendation 1: Chair Election:** Propose RCV. Explain why (avoids vote splitting, ensures majority support). Acknowledge it's not perfect (non-monotonicity) but better than Plurality.
      *   **Recommendation 2: Budget Referendum:** Propose Pairwise Majority (Condorcet). Explain the single-dimensional nature (Median Voter Theorem). This makes strategy less effective.
      *   **Conclusion:** Summarize the goal (robustness, not perfection).

  6.  **Refining the Tone:**
      *   Needs to sound like a philosopher who knows math but speaks to colleagues.
      *   Avoid overly dense jargon where possible, but use terms like "single-peaked preferences" and "Condorcet loser" appropriately given the audience is faculty (likely educated).
      *   Ensure the "honesty" requirement is met: Don't promise a utopia. Admit trade-offs.

  7.  **Review against Constraints:**
      *   *Recommend specific procedure for each vote?* Yes (RCV for Chair, Pairwise Majority for Budget).
      *   *Take manipulability worry seriously?* Yes (dedicated section).
      *   *Honest about what reform buys?* Yes (reduces risk, doesn't eliminate it).
      *   *Short memo?* Keep it tight (1-2 pages equivalent).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I address Approval Voting? I should mention why I chose RCV over Approval or acknowledge the split. I'll stick with RCV as the primary recommendation for the chair because the specific failure was a "majority ranked last" issue, which RCV explicitly solves by eliminating low-support candidates. Approval *usually* solves it but relies on voters deciding what counts as "approved." RCV captures more ordinal info.
      *   *Check:* Budget vote. 0, 3, 6%. If we just do plurality, 3% could win even if 60% want higher. If we do pairwise, 3% beats 0% (if majority wants increase) and 6% beats 3% (if majority wants more). Wait, if preferences are single peaked, the median is the Condorcet winner. I should recommend a procedure that finds the Condorcet winner.
      *   *Refinement on G-S:* Make sure to mention that G-S applies to *ordinal* ranking rules. Approval is cardinal, technically sidestepping the strict definition, but still subject to strategic thresholding. I'll keep it high-level: "No rule is strategy-proof in all logical possibilities."

  9.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** Rules Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendations on Voting Procedures for Chair Election and Budget Referendum

  Following the procedural difficulties of last spring's Chair election, the Rules Committee has reviewed alternative voting methods. Our goal is not to find a perfect system—social choice theory proves none exists—but to select rules that are robust against the specific failures we recently experienced.

  **The Theoretical Constraint: Gibbard–Satterthwaite**
  One committee member, drawing on the Gibbard–Satterthwaite theorem, correctly notes that no voting rule with three or more outcomes is entirely immune to strategic manipulation. In theory, every system allows scenarios where a voter benefits by misrepresenting their preferences.

  We take this objection seriously. It would be dishonest to claim that reform eliminates strategic voting. However, theoretical *possibility* is not practical *equivalence*. While all cars eventually break down, some are far more reliable for daily commuting. Similarly, while all rules are manipulable in *some* logical profile, they vary wildly in how *easily* they can be manipulated and how *damaging* that manipulation is in typical political environments. Our aim is to reduce the incentive to strategize and minimize the damage when strategy occurs.

  **Recommendation 1: Senate Chair Election**
  **Procedure:** Ranked-Choice Voting (Instant Runoff)

  Last spring's plurality election resulted in a "Condorcet loser" winning: a candidate ranked last by a majority of voters due to vote-splitting among similar alternatives. Plurality voting rewards polarization and punishes consensus.

  Ranked-Choice Voting (RCV) mitigates this. By allowing senators to rank candidates, RCV ensures the winner commands broad support rather than merely a narrow plurality. While RCV is not immune to tactical voting (e.g., "burying" a strong competitor), it removes the pressure to abandon a preferred candidate for a "lesser evil" in the first round. It directly addresses the pathology we witnessed: it makes it mathematically impossible for a candidate opposed by a majority to win against a field of split opponents.

  *Note on Approval Voting:* The Committee considered Approval Voting. While it also reduces vote-splitting, it places a higher cognitive burden on voters to determine a strategic "approval threshold." RCV better captures the ordinal preferences relevant to a leadership contest.

  **Recommendation 2: Budget Referendum (0%, 3%, 6%)**
  **Procedure:** Pairwise Majority Voting (Condorcet Method)

  Unlike the Chair election, the budget options are single-dimensional. Economic theory suggests faculty preferences here are likely "single-peaked" (e.g., if you prefer 6%, you likely prefer 3% over 0%).

  When preferences are single-peaked, the Median Voter Theorem applies. In this specific context, majority rule becomes remarkably stable and resistant to manipulation. We recommend a pairwise process where options are compared head-to-head (0% vs. 3%, winner vs. 6%). The option that beats all others in pairwise comparison (the Condorcet winner) will be selected. This prevents a scenario where a minority option wins because the majority vote is fractured between two larger options. Given the single-dimensional nature of the choice, this method is the most faithful aggregation of the Senate's will.

  **Conclusion**
  The Gibbard–Satterthwaite theorem teaches us humility: we cannot design a utopia. But it does not justify paralysis. Moving from Plurality to Ranked-Choice for elections, and utilizing Pairwise Majority for single-dimensional referenda, significantly raises the bar for successful manipulation. These reforms will not guarantee sincerity, but they will ensure that our outcomes reflect the Senate's considered judgment rather than the artifacts of a flawed counting rule.

  We request the Senate adopt these procedures for the upcoming cycle.
