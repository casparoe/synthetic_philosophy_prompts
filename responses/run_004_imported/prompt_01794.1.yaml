answer: |-
  You have read this passage with exceptional precision. Your intuition is correct: **this passage is not an anticipation of the Handicap Principle.** Rather, it is the canonical statement of the **aesthetic choice** model, which later became the foundation for **Fisherian runaway selection**.

  In the intellectual history of signaling theory, this passage represents the thesis that the Handicap Principle (and later Indicator Models) was partly devised to challenge or refine.

  Here is a breakdown of why this passage aligns with Fisher rather than Zahavi, and how it fits into the genealogy of signaling theory.

  ### 1. The Core Disagreement: "Taste" vs. "Truth"
  The fundamental divide between the Darwin/Fisher lineage and the Zahavi lineage lies in *why* the female chooses the male.

  *   **Darwin (in this passage):** The female chooses because she possesses an aesthetic sense ("taste," "appreciate fine shading"). The ornament evolves because it is **beautiful**. Darwin explicitly states the ornament serves "for no other purpose."
  *   **Zahavi (Handicap Principle):** The female chooses because the ornament is **costly**. The cost guarantees that the signal is **honest** (i.e., it reveals underlying genetic quality). The ornament evolves because it is a **burden** that only high-quality males can bear.

  In the Argus pheasant passage, Darwin is arguing against critics who claim the female *cannot* perceive the beauty. He is not arguing that the beauty *proves* the male's health. When he writes, "He who thinks that he can safely gauge the discrimination and taste of the lower animals... will then be compelled to admit that the extraordinary attitudes... are purposeless," he is defending the **reality of female psychology**, not the **reliability of male signaling**.

  ### 2. The Role of Cost
  You noted that Darwin makes "no appeal to cost as a guarantee of honesty." This is the smoking gun.

  *   **In the Handicap Principle:** Cost is the *mechanism*. Without cost, the signal collapses (because low-quality males would fake it).
  *   **In this Darwin Passage:** Cost (the energy to display, the size of the plumes) is incidental. Darwin mentions the "great size of his plumes," but he treats size as a canvas for pattern, not as a tax on survival. He does not argue that the plumes make the male *more vulnerable* to predators in a way that validates his vigor. He argues they make him *more attractive* to females in a way that validates his courtship.

  If Darwin were anticipating Zahavi, he would have argued: "The female chooses the male *because* maintaining such plumes is difficult, proving he is strong." Instead, he argues: "The female chooses the male *because* she likes the shading, and we know she likes it because otherwise, the display would be purposeless."

  ### 3. The Fisherian Connection
  R.A. Fisher, in *The Genetical Theory of Natural Selection* (1930), formalized Darwin's intuition from passages like this one.
  *   **Darwin's Intuition:** Females have a pre-existing aesthetic preference; males evolve traits to match it.
  *   **Fisher's Mechanism:** A genetic correlation develops between the preference (in females) and the trait (in males), leading to a self-reinforcing "runaway" process.

  Like Darwin in this passage, Fisherian selection does not require the signal to be "honest" about survival viability. In fact, under strict Fisherian runaway, the trait can become maladaptive for survival (e.g., too heavy to fly) precisely because the sexual advantage outweighs the survival cost. This aligns perfectly with Darwin's insistence that the beauty serves "no other purpose" than charm.

  ### 4. Intellectual History: The Zahavian Correction
  To place this in your feature on intellectual history, it is helpful to view the Handicap Principle not as the fulfillment of Darwin's Argus argument, but as a **correction** to the limitations of the Darwin/Fisher model.

  By the 1970s, evolutionary biologists were uncomfortable with the Darwin/Fisher model for two reasons:
  1.  **Anthropomorphism:** Attributing "taste" or a sense of "beauty" to birds seemed unscientific (a criticism Darwin anticipated in the passage: "Many will declare that it is utterly incredible...").
  2.  **Stability:** If signals are just arbitrary aesthetic preferences, why don't males cheat? If a plume is just a plume, what stops a low-quality male from growing one?

  Zahavi's 1975 intervention was to say: *Darwin was right that the ornament matters, but wrong about why.* It isn't about "taste"; it's about **information**. The "cost" removes the need to attribute human-like aesthetic judgment to the female. She doesn't need "taste"; she just needs to select the male who isn't dead yet despite the handicap.

  ### Summary for your Feature
  You can confidently categorize this passage as the **proto-Fisherian aesthetic model**.

  *   **It is not proto-Zahavian:** It lacks the crucial link between cost and honesty.
  *   **It is proto-Fisherian:** It relies on female preference driving trait evolution independent of survival utility.
  *   **Historical Significance:** This passage represents the "orthodoxy" of sexual selection that dominated from 1871 to 1975. The Handicap Principle was revolutionary specifically because it displaced this view (that ornaments are for "charm") with a new view (that ornaments are for "proof").

  Darwin is defending the **agency of the female** (she has taste); Zahavi would later defend the **integrity of the signal** (it tells the truth). They are solving different problems. Darwin is solving the problem of *purpose* (teleology); Zahavi is solving the problem of *reliability* (economics).

  **Suggested phrasing for your research:**
  > "In the Argus pheasant passage, Darwin articulates a theory of aesthetic choice that anticipates Fisherian runaway selection, not the Handicap Principle. Darwin locates the evolutionary engine in the female's psychological capacity for 'taste,' explicitly divorcing the ornament from survival utility ('no other purpose'). Zahavi's later innovation was to re-couple the ornament with survival utility, not as a detriment to be overcome, but as a cost required to guarantee signal honesty. Thus, the Handicap Principle was not a realization of Darwin's Argus argument, but a structural critique of it."
