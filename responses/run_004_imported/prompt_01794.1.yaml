      *Key Insight:* The Handicap Principle solves the "evolutionary stability" problem of signaling (why not lie?). Darwin doesn't seem worried about lying; he's worried about people denying birds have taste.

  9.  **Final Structure:**
      1.  Direct Answer (It's proto-Fisherian, not proto-Zahavian).
      2.  Analysis of the Text (Focus on "taste" vs. "cost").
      3.  The Fisher Connection (Arbitrary aesthetic).
      4.  The Zahavi Contrast (Cost as guarantee).
