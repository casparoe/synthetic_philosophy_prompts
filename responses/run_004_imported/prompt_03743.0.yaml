      *   **Goal:** A clean, principled answer on how to weigh personal track record against current object-level reasoning.

  2.  **Identify the Core Concepts:**
      *   **Inside View vs. Outside View:** This is the classic Kahneman/Lovallo framework. The Inside View focuses on the specifics of the current case. The Outside View focuses on the statistics of similar cases (reference class).
      *   **Base Rate Neglect:** The user is likely neglecting their own personal base rate (0/3 success on high-confidence predictions).
      *   **Calibration:** In prediction theory, being "right" isn't just about the outcome; it's about whether your confidence matches your accuracy. If you say 90% and are right 0% of the time, you are poorly calibrated.
