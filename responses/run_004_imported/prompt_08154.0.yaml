      *   **Key Issue:** Sidgwick admits reason cannot reconcile Egoism (self-interest) and Utilitarianism (duty/impartial good).
      *   **Biographical Detail:** Sidgwick co-founded the Society for Psychical Research (SPR) and investigated spiritualism/immortality.
      *   **Supervisor's View:** This biographical detail is irrelevant to a philosophy essay.
