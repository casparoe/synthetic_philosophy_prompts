prompt: |-
  ok so this has been rattling around in my head since the weekend, partly because something similar happened to me recently -- i gave my brother grief for bailing on helping mom move, then got reminded that i'd bailed on the exact same thing myself last year, and still havent decided if that makes me a hypocrite or just right.

  anyway, saturday at a bbq: (1) my friend jake told our friend mia that flying to cabo for a bachelorette was hard to justify given what we know about flight emissions. (2) mia said he's got no room to talk, since he's taken three wedding flights plus a work trip this year and she hasn't flown once in three years. (3) jake said that doesn't make his claim false -- her flight has whatever carbon cost it has no matter who's pointing it out. (4) mia said that's a dodge: the issue was never whether it's true, it's that he's using this as a cudgel on her while quietly exempting himself, and selective moralizing is its own wrong separate from whether the underlying claim checks out. (5) jake said fine, so by that logic nobody gets an opinion on emissions unless they've gone carbon neutral themselves, which cant be right -- literally no one could ever criticize anything. (6) mia said that's not the same thing -- you don't have to be perfect to call something out, you just cant be the one who decides, case by case, when the rule applies to you, like excusing your own "necessary" flights while calling hers frivolous.

  nobody at the table could actually settle it, and it's bugging me more than a bbq argument should given my own situation. can you go through moves 1-6 and say who's got the better of it at each one (not just an overall winner), and point out anything you think both of them are missing?
