answer: |-
  This is a sharp philosophical intuition. You have identified what many critics call the "modularity problem" in the standing-to-blame literature. The standard view (championed by philosophers like Macalester Bell, Kyle Fritz, and Daniel Miller) treats moral norms like distinct jurisdictions: violating Norm A doesn't strip you of authority to enforce Norm B.

  But as you suspect, this modularity looks suspiciously like a firewall constructed specifically to prevent the collapse of our everyday blaming practices. If we dig into the *normative mechanism* that makes hypocrisy objectionable, it is difficult to stop it from spreading to a general skepticism about standing.

  Here is an argument supporting your view: that the logic of the hypocrisy objection, if applied consistently, undermines the "same fault" restriction and pushes us toward global skepticism about standing to blame.

  ### 1. The Core Mechanism: Authority, Not Content
  The standard view assumes that standing is about **norm-specific authority**. On this view, when I blame you for lying, I am acting as an enforcer of the norm against lying. If I am a liar, I am a "corrupt enforcer" of that specific rule. But if I am a thief, I am still a clean enforcer of honesty.

  **The Counter-Argument:** This misunderstands what blame *is*. Blame is not merely a regulatory function like a traffic cop issuing a ticket for speeding (where a speeding cop can still ticket you). Blame is a **moral address** that implies a specific status relationship.

  When I blame you, I am not just citing a rule; I am implicitly claiming a position of moral security or authority relative to you. I am saying, "I am in a position to hold you accountable." The hypocrisy objection works because the hypocrite lacks the *moral integrity* required to occupy that position.

  If the defect is **integrity**, then integrity is holistic. A person who commits serious moral violations (even different ones) demonstrates a flawed relationship to morality *as such*. If I murder someone, I have shown that I treat moral constraints as optional. If I then blame you for lying, I am treating moral constraints as binding *for you* but optional *for me*. The specific content of the violation is irrelevant; the relevant fact is that I have positioned myself outside the moral community's binding authority while trying to wield that authority over you.

  ### 2. The "Exemption" Claim is General
  The strongest explanation for why hypocrisy undermines standing is the **Claim to Exemption** account (associated with philosophers like R. Jay Wallace and Stephen Darwall). Hypocrites lack standing because their actions imply that they are exempt from the demands they place on others.

  **The Argument for Generalization:**
  1.  To have standing to blame, one must acknowledge the binding nature of moral obligations on oneself.
  2.  When an agent commits a moral violation (V1), they act on a maxim that treats moral obligations as non-binding (or overrideable by their desires).
  3.  When that same agent blames another for a different violation (V2), they demand that the other treat moral obligations as binding.
  4.  Even if V1 and V2 are different, the agent is still maintaining a double standard regarding the **bindingness of morality itself**.
  5.  Therefore, the agent is claiming a general exemption from the moral law, not just a specific exemption from Rule X.

  If the sin is "acting as though the moral law doesn't apply to me," it doesn't matter which paragraph of the moral law I ignore. The moment I ignore *any* serious obligation, I lose the standing to insist that obligations bind *anyone*.

  ### 3. The "Ad Hoc" Nature of Relevance
  Proponents of the "same fault" restriction argue that without it, we face the **"Clean Hands" objection**: If any flaw kills standing, no imperfect human can ever blame anyone, which is absurd.

  **The Rebuttal:** This is a pragmatic conclusion masquerading as a principled one. It is an argument from *consequences* ("we need blame to work") rather than *principle* ("this is what justice requires").

  If we are being philosophically honest, we must ask: Why is it unfair for a thief to blame a liar?
  *   **Standard Answer:** It's not unfair, because the norms are different.
  *   **Skeptical Answer:** It *is* unfair, because the thief is engaging in a power play. They are using moral language to elevate themselves above the blamee, despite having no moral high ground.

  The restriction to "relevantly similar" faults is an attempt to save the practice of blaming from collapsing under the weight of human imperfection. But if the *principle* of standing is that one must not claim exemption from the standards one enforces, then the "relevance" constraint is indeed a patch. It arbitrarily limits the scope of the exemption to save the system.

  ### 4. Blame as a Status Claim (The Hierarchical Problem)
  A further argument for skepticism comes from the nature of the blaming relationship. Blame often functions to establish a hierarchy: the blamer is the judge; the blamee is the accused.

  In a community of moral equals, standing to blame is usually thought to derive from our shared membership in the moral community. However, hypocrisy reveals that the hypocrite does not view themselves as a *member* in the same way they view the blamee. They view themselves as a **legislator** (for others) but not a **subject** (themselves).

  If I violate *any* significant moral norm, I reveal that I view myself as a legislator rather than a subject. Consequently, I forfeit my status as an equal. If I am not an equal, I lack the standing to blame, because blame among equals requires mutual recognition of vulnerability to the same standards. Since almost everyone violates *some* significant standard (even if not the same one as the person they are blaming), almost no one occupies the position of "moral equal" required to blame.

  ### 5. Conclusion: Embracing the Skepticism
  The "same fault" restriction is a compromise designed to preserve our reactive attitudes. But if we follow the logic of the hypocrisy objection to its natural conclusion, we arrive at a position close to **Global Standing Skepticism**:

  *   **Premise:** Standing requires that one does not claim exemption from the moral authority one invokes.
  *   **Observation:** To violate any moral norm is to act on an exemption from moral authority.
  *   **Inference:** Therefore, violating any moral norm undermines standing to invoke moral authority (blame).
  *   **Fact:** All moral agents violate some moral norms.
  *   **Conclusion:** No moral agent has standing to blame.

  This doesn't necessarily mean we should stop holding people accountable (we might shift to "moral protest" or "consequences" rather than "blame"), but it does mean we must admit that the **authority** to blame is almost never possessed.

  Your intuition is correct: The "same fault" restriction is a dam built to hold back a flood. If the water (the logic of exemption) rises to the true level of the principle, the dam breaks, and we are left with the realization that in a world of imperfect beings, the "right" to blame is a fiction we tell ourselves to justify our anger.
