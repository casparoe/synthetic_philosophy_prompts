answer: |-
  The ink did not dry so much as it settled, like dust on a coffin lid.

  Vester dipped his quill again. The office of *The Lantern* smelled of sour beer and wet wool, though Vester sat alone. On the desk lay a sketch: a man with legs too long, a hat too high, pacing a cobblestone street that looked suspiciously like the one outside. The caption read: *The Philosopher Who Walks So He Does Not Have to Arrive.*

  It was clever. It was cruel. Most importantly, it was unsigned.

  Vester blew on the page. He felt a peculiar sensation in his chest, a lightness, as if his own ribs were hollowing out. When he wrote as himself, he was Julian Vester, a man with debts, a limp in his left knee, and a mother who worried he ate too little. But when the typesetters took this page, when the presses groaned and the paper was folded and tucked under the arms of clerks and shopgirls and professors, Vester would cease to exist. There would be only *The Lantern*.

  And *The Lantern* had no knees. *The Lantern* had no mother. *The Lantern* could not be met on the street and asked for an explanation.

  He looked out the window. Down on Østergade, the Magister was walking. He walked with that peculiar, jerky gait, stopping to speak to no one, umbrella tucked under his arm like a weapon. He was distinct. He was painfully, aggressively singular. If you bumped into him, you had to apologize to *him*. If he spoke, you heard *his* voice.

  Vester dipped the pen. *Let us see how long he remains singular,* he thought, *when five thousand people are laughing at him before breakfast.*

  ***

  The next morning, the air in the coffee houses was different. It was not louder; it was thinner.

  Vester stood in the back of *The Royal*, a cup of coffee cooling in his hand. He watched. At table one, three merchants sat with the morning edition spread between them like a carcass. They were not talking to each other. They were looking at the paper, then glancing up, then looking back down.

  One merchant chuckled. It was a dry sound. He looked at his neighbor, expecting a shared conspiracy. The neighbor nodded, but his eyes were distant. He was not laughing with the merchant; he was laughing with the invisible voice that had written the joke.

  "It's absurd, isn't it?" the first merchant said. "To walk like that."

  "Everyone says so," the second replied.

  Vester leaned against the wall. *Everyone.* That was the word. If Vester stepped forward and said, "I wrote that," the spell would break. The merchant would have to look at Vester's limp, his tired eyes. He would have to judge a man. But as long as the source was the paper, the merchant was judging a phantom. And you cannot shake hands with a phantom. You cannot challenge it to a duel.

  A young clerk at the next table turned a page. "They say he applied for the bishopric again."

  "I heard he was seen drinking in the gutter," another voice added from a corner.

  Vester knew neither of these things were true. He had written neither of them. But once the paper had established the Magister as a figure of ridicule, the truth became a heavy, cumbersome thing that no one wanted to carry. The lie was lighter. The lie floated.

  The clerk looked up, catching Vester's eye. For a second, Vester felt the urge to confess. To say, *I am the one. I am the noise in your head.* But he saw the look in the clerk's eyes. It wasn't hatred. It was vacancy. The clerk didn't care who wrote it. He only cared that he was part of the *We* that knew the joke.

  Vester turned and left before his coffee was finished.

  ***

  Three weeks later, the Magister stopped him.

  It was raining, a cold Copenhagen drizzle that turned the streets into mirrors. Vester was hurrying toward the printers, collar turned up, when a black umbrella blocked his path.

  The Magister stood there. He was soaked. His face was not angry; it was exhausted. He looked like a man who had been fighting a fog for a month and was finally out of breath.

  "Mr. Vester," the Magister said. His voice was quiet, barely audible over the carriage wheels splashing through the muck.

  Vester's heart hammered against his hollow ribs. "Sir."

  "I read your paper."

  "*The Lantern* is a collective endeavor, sir. I merely manage the—"

  "Do not manage me," the Magister said. He stepped closer. Now Vester could smell the wet wool, the tobacco, the human sweat. This was the danger. This was the presence. "I know you write the sketches. I know the hand."

  Vester gripped his own umbrella. He wanted to run, but his legs felt heavy. "And if I do? I express the opinion of the city."

  "The city?" The Magister smiled, a sad, thin curving of the lips. "I walked through the city today. I spoke to twelve people. Twelve. None of them held the opinion you printed. They told me they only repeated what they read because they did not wish to be the only one who remained silent."

  "That is the public voice," Vester said, hearing the hollowness of his own defense. "It is larger than you. Larger than me."

  "It is nothing," the Magister said. "It is a number without a sum. You have built a monster that has no body, so it cannot be killed. It has no face, so it cannot be shamed. You think you wield it?"

  The Magister leaned in, the rain dripping from the brim of his hat onto Vester's coat.

  "You are its first victim, Julian. I am merely the sport."

  The Magister stepped around him and continued walking. Vester stood in the rain, watching him go. He wanted to shout after him. He wanted to say, *I am real. I am standing here. I have a name.*

  But a carriage splashed through a puddle, mud spattering Vester's trousers. He looked down at the stain. He looked up at the gray sky. He felt a sudden, terrifying urge to check his reflection in a shop window, to make sure he was still there.

  ***

  The circulation numbers climbed. The printers could not keep up.

  Vester sat in his office, the ledger open before him. The profit margins were extraordinary. He was a success. He was a power.

  A young apprentice knocked on the doorframe. "Sir, the typesetters are asking about the next issue. They want to know if we are going after the Professor of Theology next. They say the public is hungry for it."

  Vester looked at the boy. "The public?"

  "Yes, sir. The subscribers. They feel the Magister has grown stale. They want fresh blood."

  *They.*

  Vester stood up and walked to the window. The street below was busy. People hurried to and fro, heads down, collars up. None of them looked up at the window. None of them knew him. If he jumped, they would not catch him; they would step over him and read about it in the evening edition.

  "Tell the typesetters," Vester said, his voice sounding strange to his own ears, as if it were coming from the walls, "to prepare the sketch."

  "Very good, sir. And the byline?"

  Vester paused. He thought of the Magister's wet face. He thought of the merchants in the coffee house, laughing without looking at each other. He thought of his own mother, who hadn't seen him in a month because he was too busy serving the abstraction.

  "There is no byline," Vester said.

  "Of course, sir. It is better this way. The people trust the Paper more than they trust a man."

  The boy left. Vester sat back down. He picked up the quill. He needed to write something witty. Something sharp. Something that would dissolve another solid thing into mist.

  He dipped the pen. He looked at his hand. It seemed translucent. The ink stained his fingers, black and permanent, but the skin beneath it looked like parchment.

  He began to write. He wrote about a man who sat in a room and thought he was watching the world, when in fact the world was watching him, through a keyhole that had no door.

  He wrote quickly. He did not sign his name. He didn't need to. The Paper knew who he was. The Paper would eat him last, and quietly, so that no one would notice he was gone.

  Outside, the bells of the cathedral rang. Vester did not look up. He just wrote, feeding the mouth that had no face, listening to the sound of five thousand people turning a page in unison, a sound like wind blowing through a graveyard of leaves.
