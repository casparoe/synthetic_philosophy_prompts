answer: |-
  The house smelled of antiseptic and lilies, a combination Arthur hadn't realized could be suffocating until now. Elena sat in the armchair by the window, her hands folded in her lap. She looked exactly as she had three years ago, before the aneurysm, before the coma, before the waking that felt like a birth without memory. She knew what a chair was. She knew how to swallow water. She knew the word *husband* defined the man bringing her tea. But when she looked at Arthur, her eyes were polite, curious, and entirely empty.

  "Thank you," she said. Her voice was the same, a low contralto that used to hum when she was grading papers.

  "It's Earl Grey," Arthur said. "You usually take it without sugar."

  "Usually," she repeated. She took a sip. She didn't grimace, didn't smile. "It's bitter."

  "It is."

  "I don't mind."

  Arthur watched her. This was the first equation. If she didn't mind the bitterness, was she being polite? Or did her taste buds change? Or did the word *mind* mean something different to her now? If he assumed she was lying to be nice, he was assuming she believed politeness was necessary. If he assumed she was telling the truth, he had to accept that her preference had changed. He couldn't know her belief without knowing her meaning, and he couldn't know her meaning without knowing her belief.

  He sat on the ottoman across from her. "How is the light?"

  "Blue," she said.

  Arthur looked out the window. The sky was a bruised purple, twilight settling over the suburbs. "It's more purple tonight."

  "No," she said softly. "The light inside. On the wall." She pointed to the shadow cast by the lamp. The shade was old, stained slightly yellow near the bulb. The light hitting the wall was warm, amber.

  "Yellow," Arthur corrected gently. "That's yellow."

  Elena tilted her head. She didn't look confused, just analytical. "It feels heavy. Blue feels heavy. Yellow feels... loose."

  Arthur felt a spike of frustration, quickly suppressed. He could tell her she was wrong. He could assert the shared reality of the spectrum. But that was the old language, the one they had built over fifteen years. That language was dead. If he insisted on *yellow*, he was treating her like a broken record player trying to play a new song. He had to interpret her from scratch.

  If she says *blue* when pointing to amber light, and she is rational, then *blue* cannot mean the wavelength 450 nanometers. It must mean *heavy*. Or *shadowed*.

  "Heavy light," Arthur said. "Okay. I see the heavy light."

  Elena's shoulders dropped a fraction of an inch. A signal. He had solved for X.

  ***

  Day two was spent in the kitchen. It was where their old shorthand had been densest. *The big spoon* meant the ladle. *Upstairs* meant bed. *Later* meant never. Now, the kitchen was a minefield of ambiguous signs.

  She stood by the counter, holding a ceramic mug. "I want to put this away."

  "In the cupboard?"

  "It's wet."

  "I can dry it."

  "No," she said. "It needs to be where the wet things go."

  Arthur opened the dishwasher. It was empty. "Here?"

  "It needs to be finished," she said.

  Arthur paused. *Finished* could mean clean. It could mean broken. It could mean used. He looked at the mug. There was a chip in the rim, fresh. Had she dropped it? If she believed the mug was broken, putting it in the dishwasher would be irrational. If she believed it was just dirty, it was rational. But she said *wet*.

  "You want to throw it out?" Arthur asked.

  "I want it to be done," she said.

  Arthur looked at the trash bin. Then he looked at the drying rack. If he threw it away, and she meant *dry*, he was destroying property. If he dried it, and she meant *discard*, he was hoarding trash. He had to make a move based on the assumption that she was making sense.

  He took the mug and placed it on the high shelf, the one where they kept the holiday glasses they never used. "Where things rest," he said.

  Elena watched him. She didn't nod, but she turned back to the sink. "Resting. Yes."

  Arthur wiped his hands on a towel. He wasn't sure if she meant the mug was retired or just stored. It didn't matter. The action had halted the friction. They had converged on a passing theory: *Resting* meant *out of circulation*. It might not mean that tomorrow. It might not mean that to anyone else. But for this moment, in this kitchen, the system was solvable.

  ***

  On the third night, they sat on the porch. The air was cool. Arthur was tired. The effort of constant translation was physical, like holding a heavy weight at arm's length. He found himself anticipating her needs before she voiced them. When she shifted her weight, he handed her the blanket. When she looked at the sky, he checked his watch.

  "Do you know who I am?" Arthur asked. He hadn't dared ask since the hospital.

  Elena wrapped the blanket around her shoulders. "You are the man who knows where the things rest."

  "I'm Arthur."

  "Arthur," she said. She tested the shape of it. "That's a sound."

  "It's my name."

  "It's what people call you." She looked at him. "I don't have a name yet."

  "You're Elena."

  "That's what the bracelet says." She tapped her wrist. "But I don't feel like Elena. Elena belongs to you. I'm just... here."

  Arthur felt the old grief rise, sharp and familiar. He wanted to tell her about their trip to Prague. He wanted to tell her about the way she laughed at bad movies. He wanted to import his truths into her mind to fill the vacuum. But that was the cheat. That was assuming the answer before solving the problem. If he told her who she was, he wasn't interpreting her; he was programming her.

  "You're here," Arthur said. "That's enough for now."

  She looked at the garden. "The bushes are singing."

  Arthur listened. The wind was rustling the dry leaves of the hydrangeas. A cricket chirped once, then stopped.

  "Singing," Arthur said. He could correct her. *Bushes don't sing. Crickets sing. Wind rustles.* If he corrected her, he re-established the objective world. He established that she was wrong about the world, which meant her words were false, which meant he could trust his own definitions again.

  But if he corrected her, he broke the charity. He assumed his reality was the only valid one.

  "What are they singing?" Arthur asked.

  "About the cold," she said. "They know it's coming."

  Arthur looked at the hydrangeas. They were brown, dormant. They didn't know anything. But she believed they did. If he assumed she was rational, then *singing* meant *signaling change*. *Cold* meant *endings*.

  "They're warning us," Arthur said.

  "They're saying goodbye," she corrected.

  "Goodbye."

  "For now."

  She turned to him. For the first time since she woke up, she reached out and touched his hand. Her skin was warm. "You understand the song."

  "I think so."

  "Good. Then we can sit."

  They sat in silence for an hour. Arthur watched the shadows lengthen. He knew, with a certainty that frightened him, that if she stood up now, she would say she was tired. If she looked at the door, she would say she wanted water. He could map her movements. He could predict her utterances with ninety percent accuracy. He had built a model of her mind so precise it functioned like a memory.

  But as he looked at her profile, illuminated by the heavy blue light from the living room window, he couldn't tell if he knew what she meant by *goodbye*. Did she mean she was leaving the porch? Did she mean she was leaving him? Did she mean the season was ending?

  He had the prediction. He had the convergence. He had the working theory that allowed them to share a space without collision.

  "Arthur," she said, without looking at him.

  "Yes?"

  "Tomorrow. Will the light be heavy again?"

  Arthur looked at the lamp inside. He looked at the sky. He could say *yes*, and maintain the coherence of their private lexicon. He could say *no*, and re-anchor her to the standard spectrum.

  If he said *yes*, he validated her world. If he said *no*, he validated his own.

  "It depends on where you sit," Arthur said.

  Elena nodded, slowly. "Then I will sit here."

  She didn't move. Arthur didn't move. The cricket started again, or maybe it was the wind. He couldn't be sure which it was, and he realized it no longer mattered what the sound was, only what they agreed it meant. He waited for her to speak again, listening not to the words, but to the space between them, wondering if the bridge they were building was made of wood or just mist, and whether it would hold her weight if she ever tried to walk across it.
