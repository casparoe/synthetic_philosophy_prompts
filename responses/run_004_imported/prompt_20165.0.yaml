answer: |-
  You were right, and Theo was wrong. The **Knowledge Norm of Assertion (KNA)** is the correct standard for proper assertion. Specifically, I am defending the Williamsonian thesis that one must: **Assert $p$ only if one knows $p$.**

  Theo's position—that justified or reasonable belief is sufficient—is the dominant rival (often associated with Jennifer Lackey or Jason Stanley's earlier work), but it collapses under the weight of the Lottery Case. Conversely, the Creationist Teacher case, while intuitively powerful, does not refute KNA; it merely highlights the distinction between a *constitutive norm* and *blameworthiness*.

  Here is the committed argument for KNA, grappling directly with the two problem cases you raised.

  ### 1. Why the Lottery Case Kills the Justified Belief Norm

  The strongest argument against Theo's view is the one you already deployed: the Lottery Paradox. This isn't just a hunch; it reveals a structural flaw in equating justification with assertibility.

  In a fair lottery with one million tickets, your justification for believing "Ticket #452 lost" is probabilistically overwhelming (0.999999). On a standard reliabilist or probabilistic account of justification, you are *justified* in believing it. If the norm of assertion were merely Justified Belief (JBN), it should be perfectly proper for you to walk up to the ticket holder and assert, "Your ticket lost."

  But it isn't. It feels deeply inappropriate. Why? Because your belief lacks **sensitivity** and **safety**.
  *   **Sensitivity:** If the ticket *had* won, you would still have believed it lost (based on the odds).
  *   **Safety:** In nearby possible worlds where you form the belief the same way (statistical inference), you could easily be wrong.

  Knowledge requires a modal connection to the truth that mere statistical justification does not provide. The fact that asserting "Your ticket lost" feels improper *before* the draw demonstrates that our conversational practice tracks **knowledge**, not just high probability. If Theo insists JBN is correct, he has to "bite the bullet" and admit that asserting the ticket lost is fine. That is a fatal concession because it severs the link between assertion and truth-tracking. Assertion is a tool for sharing *facts*, not *probabilities*. KNA explains the intuition perfectly: you can't assert it because you don't *know* it.

  ### 2. Defusing the Creationist Teacher (The "Blameless Violation" Strategy)

  Now, let's deal with the case that stuck in your craw: the devout creationist biology teacher. She asserts "Species evolved via natural selection" ($p$). She does not believe $p$. Therefore, she does not know $p$ (since knowledge entails belief). Yet, she seems to be asserting properly.

  Jennifer Lackey uses this exact case to argue for a "Reasonable to Believe" norm. I reject that conclusion. The Creationist Teacher is not a counter-example to KNA; she is a case of **blameless violation**.

  To understand this, we must distinguish between whether an assertion **violates a norm** and whether the speaker is **criticizable** for that violation.
  *   **The Constitutive Norm:** KNA is constitutive of assertion. Just as a move in chess is only a "castling" move if it follows the rules of castling, a speech act is only a proper *assertion* if it aims at knowledge.
  *   **The Excuse:** A speaker can violate the norm but be excused from blame due to conflicting normative pressures.

  In the classroom, the teacher is operating under two competing normative frameworks:
  1.  **The Epistemic Norm:** Assert only what you know.
  2.  **The Institutional/Pedagogic Norm:** Accurately convey the consensus of the discipline you are hired to teach.

  When the teacher says "Species evolved," she is violating the Epistemic Norm (KNA). She does not know it. However, she is satisfying the Pedagogic Norm. Because her violation of KNA is driven by a higher-order duty to educational accuracy and intellectual honesty (she is not lying; she is reporting the state of science), she is **blameless**.

  But—and this is crucial—**blamelessness does not equal propriety.**

  If KNA is correct, there should be some residual "off-ness" to her assertion. And there is. If she were to make her epistemic state fully explicit, the Moorean absurdity returns. Imagine if she said to her class:
  > *"Species evolved via natural selection, but I don't know that, and I don't even believe it."*

  This sounds incoherent. It generates a version of **Moore's Paradox** ($p$, but I don't know $p$). The reason her standard assertion ("Species evolved") *seems* fine is that conversational implicature fills the gap. The students assume she speaks as a **proxy** for the scientific community. She is functioning as a mouthpiece. In that specific institutional context, the "knowledge condition" is satisfied by the *community*, and she is merely the conduit.

  However, if we strip away the institutional context, the impropriety shines through. If you and I are at a bar, and you assert a fact you explicitly don't believe, I would be right to challenge you: "Wait, you don't believe that? Then why are you telling me it's true?" You would have to retreat to: "Well, I read it." That retreat confirms that your *own* assertion wasn't grounded in your own knowledge.

  The KNA explains why we generally prefer teachers who *do* believe and know the material. We sense that the creationist teacher is epistemically deficient, even if she is pedagogically competent. If JBN were true, there would be no deficiency at all. The fact that we perceive a deficiency (even if we excuse it) supports the view that knowledge is the true norm.

  ### 3. The "Challenge" Test

  Finally, consider how we actually challenge assertions in real time. This is the pragmatic knockout punch for KNA.

  When someone asserts $p$, the standard challenge is: **"How do you know?"**
  It is *not* standard to ask: "Do you have justified belief?" or "Is it reasonable for you to believe?"

  If Theo asserts, "The flight landed on time," and you ask, "How do you know?", he cannot properly answer, "Well, I didn't know, but I had a justified belief." That would be an admission of impropriety. He would have to retract: "Oh, I guess I shouldn't have said it definitively."

  In the Creationist Teacher case, if a student asked, "How do *you* know evolution is true?" and she answered, "I don't know, and I don't believe it, but the textbook says so," the assertion would lose its force. It would shift from an assertion of fact to a report of consensus. The fact that the assertion *only* holds its force as long as the teacher's personal lack of knowledge remains hidden proves that knowledge is the underlying requirement for the speech act to function as an assertion.

  ### Conclusion

  Theo's view (JBN) fails because it cannot explain the Lottery Case without accepting that we can assert things we clearly don't know. It conflates *probability* with *fact*.

  Your view (KNA) is superior. It handles the Lottery Case naturally (no knowledge, no assertion). Regarding the Creationist Teacher, KNA remains robust if we recognize that **properness** and **blameworthiness** come apart. She is a blameless violator of the norm, excused by her institutional role, but the assertion remains technically improper *qua* assertion, which is evidenced by the Moorean weirdness that arises if she discloses her true epistemic state.

  Assertion is the transmission of knowledge. Anything less is just speculation, however well-justified. You win the argument.
