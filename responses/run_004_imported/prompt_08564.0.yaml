  4.  **Synthesize the "What Actually Matters" for the User's Project:**
      *   *The "Global" Assumption:* The user needs to drop the idea of a monolithic "Patience" trait. The evidence suggests cross-situational consistency is low.
      *   *The "Habituation" Mechanism:* Mindless repetition is vulnerable. Cognitive engagement (phronesis) is the shield.
