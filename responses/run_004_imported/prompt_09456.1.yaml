          *   If $B^*$, then the sorites series for $B$ might not align with the sorites series for $B^*$.
          *   If $B$, then knowing $p$ *just is* being in a position to know one knows $p$ (internalism).
          *   Williamson assumes Externalism.
      *   *The User's Goal:* Defend KK (or at least block the argument against it) while accepting Anti-Luminosity for sensation.
      *   *Strategy:* Argue that the "Margin for Error" principle applies differently to *factive* states (knowledge) than to *non-factive* states (feeling cold), specifically regarding how "closeness" is calculated.

  5.  **Drafting the Core Argument (The "Epistemic Boundary" Objection):**
      *   **Premise 1:** The Anti-Luminosity argument works for sensation because the *state* (feeling cold) and the *discriminatory capacity* come apart. You can feel cold without being able to discriminate that you feel cold from not-feeling-cold (at the boundary).
