          *   Williamson treats boundary cases as "close." I argue that for the purpose of *normative status* (Knowledge), boundary cases are *distant* because the normative status flips.
      *   *Wait, that sounds like begging the question.* "Knowledge is different so it's different."
      *   *Need to be more technical about "Closeness".*
      *   Let's focus on **Safety vs. Sensitivity**.
      *   Williamson uses Safety. $K\phi \to \Box(\text{Belief}(\phi) \to \phi)$.
      *   For KK: $KKp \to \Box(\text{Belief}(Kp) \to Kp)$.
      *   The argument relies on the idea that there are close worlds where I believe $Kp$ but $Kp$ is false (i.e., I believe I know, but I don't).
      *   *Objection:* In the sensory case, the "close worlds" are worlds where my temperature is slightly different. In the KK case, the "close worlds" are worlds where my *evidence* is slightly different.
