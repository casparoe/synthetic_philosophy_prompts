      *   *Hypothesis 3: The target of the Margin.* In Ch. 4, the margin protects the *truth* of the belief (Safety). In Ch. 5, the margin is used to protect the *knowledge status* itself.
      *   *Hypothesis 4 (Strongest): The Reflexivity/Transitivity of the Accessibility Relation.*
          *   In Ch. 4, the relation is "phenomenally indistinguishable." This relation is reflexive and symmetric, but *not transitive* (Sorites). This non-transitivity drives the sorites slide.
          *   In Ch. 5, Williamson models knowledge using an accessibility relation between cases. For KK to hold, the accessibility relation for knowledge must be transitive (S4 logic). Williamson argues it isn't.
          *   *The Objection:* The "closeness" metric for *sensations* is fundamentally different from the "closeness" metric for *knowledge states*. Sensation closeness is subjective/phenomenal. Knowledge closeness involves the *facts* and the *method*.
      *   *Hypothesis 5 (The "Fixed Point" Argument):* When I know $p$, my epistemic position is defined by the fact that I *know*. If I move to a case where I don't know, the epistemic position has changed *significantly*, not marginally. The "distance" between knowing and not-knowing is categorical, not gradual, even if the evidence varies gradually.

  4.  **Developing the "Epistemic Discontinuity" Argument:**
      *   *Focus:* How "closeness" is fixed.
      *   *Sensation Case:* Closeness is defined by the subject's discriminatory capacities. Since these are finite, there are indiscriminable steps. The state (feeling cold) varies independently of the discrimination.
      *   *Knowledge Case:* Closeness is defined by the *evidence* or *basis* for knowledge. But knowledge is a *factive* state.
      *   *Key Insight:* In the temperature case, the state (feeling cold) can obtain while the subject is in a marginally different state. In the knowledge case, the state *is* the epistemic position.
      *   *Refining the Margin for Error:*
          *   For Sensation: $K(\text{Cold}_t) \to \text{Cold}_{t'}$ (if $t \approx t'$). This relies on Safety.
          *   For KK: $K(Kp)_t \to Kp_{t'}$ (if $t \approx t'$).
          *   Williamson argues: If you know $p$ in case $\alpha$, and case $\beta$ is indistinguishable from $\alpha$, you must know $p$ in $\beta$ (for luminosity of knowledge).
      *   *The Counter:* Indistinguishability of cases is not the right metric for the stability of *knowledge*. Knowledge is stable across *relevant* alternatives, not *phenomenally indistinguishable* scenarios.
      *   *Wait, Williamson knows this.* He defines closeness in terms of the information available.
      *   *Better Angle:* The *source* of the margin. In the sensory case, the margin is imposed by *cognitive limitation* (I can't tell $t$ from $t+1$). In the knowledge case, if KK holds, the margin is imposed by the *nature of justification*.
      *   *The "Self-Intimating" Distinction:* Feeling cold is a state that *causes* the belief. Knowledge is a normative status.
      *   *Let's try a different route: The "Basis" Argument.*
