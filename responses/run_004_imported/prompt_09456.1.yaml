          *   Knowledge: Series must be built on *epistemic* indiscriminability.
          *   Argument: Epistemic distance is not continuous in the same way. Knowledge introduces a categorical break.
      *   **Point 2: The Target of the Margin (Truth vs. Status).**
          *   Sensation MEP: Protects *truth* of "I am cold".
          *   KK MEP: Protects *status* of "I know".
