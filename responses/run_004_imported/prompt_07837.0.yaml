answer: |-
  Good afternoon.

  For those who don't know me, my name is [Your Name]. I started working here three weeks ago. I was hired to sit next to [Her Name], to learn the desk, and to listen. I expected to learn how to find sources. I didn't expect to learn how to listen to silence.

  Three Tuesdays ago, we were working on a profile of a city councilman. Everything was fine, except for one date. The year he was elected. It was off by twelve months in the draft. Now, in the grand scheme of politics, a one-year discrepancy is hardly a scandal. Most people would have let it slide. It wasn't a lie, exactly. Just a drift.

  [Her Name] didn't let it slide. She didn't make a speech about integrity. She just picked up the phone. She called the city clerk's office. She waited on hold for twenty minutes, humming softly, shuffling papers. When the clerk finally answered, she was polite, warm, and precise. She verified the date. She hung up, corrected the manuscript, and then she made us both a cup of tea.

  To an outsider, that might look like pedantry. To those of us who sat near her, it was something else. It was an act of maintenance.

  I know many of you, especially her colleagues, have been tempted to describe her as a guardian of the truth. I know this because I started writing that phrase in my notes, and she crossed it out. She told me that phrase made her uncomfortable. She said it suggested that truth was a castle, and she was the knight standing at the gate, sword drawn against liars.

  She didn't see her work that way. She believed that truth wasn't a castle to be defended by a hero. It was more like a woven net. It depended on records, and witnesses, and institutions, and people willing to pick up the phone on a Tuesday afternoon. She knew that one person standing alone doesn't secure anything. It takes a chain. She was just making sure her link in the chain held fast, so the next person could hold on to it.

  She also taught me that the danger wasn't always the dramatic lie. It wasn't usually a villain hiding a secret. It was the slow fog. It was the tendency for the world to be described in images that didn't quite match the ground beneath our feet. She worried about the kind of storytelling that made reality unrecognizable, even to the people living in it. Her work—checking the spelling of a street, the year of a vote, the exact wording of a quote—was her way of anchoring the story back to the earth. Not to catch someone in a lie, but to ensure we all knew where we were standing.

  To her family and friends: I know you knew her as the woman who would correct a misquoted lyric at a dinner party, or remind you of the exact day you met. I hope you know now that this wasn't about being right. It was about caring for the shared world we live in. She believed that if we lose the small facts, we lose the ability to trust each other on the big ones. That correction wasn't criticism. It was care.

  I have only known her for three weeks. But I have read the essays she kept taped in her desk drawer. I have seen how she worked. And I know that the best way to honor her is not to pretend she was irreplaceable. She would have hated that. She believed in the desk, not the person sitting at it.

  So, I will sit at the desk. I will check the dates. I will call the city clerks. I will wait on hold. I will try to keep the net woven tight. Not as a guardian, and not as a warrior. But as a colleague. As a witness. And as a friend.

  Thank you.
