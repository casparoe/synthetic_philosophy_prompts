  I'm in a metaphysics reading group working through material constitution (Wiggins, Gibbard, Baker) and I'm so sick of the statue and the clay - also the ship of Theseus, Tibbles-and-Tib, and "the person and their body." Everyone's basically memorized the canned answer instead of reasoning it through fresh.

