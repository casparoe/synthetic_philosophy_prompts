answer: |-
  Here is a new case designed to bypass the "Statue/Clay" fatigue, located in the domain of **legal instruments** rather than art, biology, or mereology.

  ### The Case: The Revoked Will

  **The Setup:**
  Imagine a jurisdiction with a specific statute: *A Last Will and Testament is automatically revoked if the testator (the person who wrote it) gets married after signing it, unless the will explicitly states it was made in contemplation of that marriage.*

  Consider a specific physical object sitting in a safety deposit box: a sheet of parchment with ink markings, signed and witnessed.

  **The Two Candidates:**
  1.  **The Document (The "Clay"):** The physical aggregate of cellulose fibers and ink molecules.
  2.  **The Will (The "Statue"):** The legal instrument capable of transferring property upon death.

  **The Coincidence:**
  From the moment the ink dries after signing until the moment the testator marries (or dies), The Document and The Will are exactly coincident. They occupy the same location, consist of the same parts, and have the same causal powers *vis-à-vis* the physical world (they both reflect light, weigh 5 grams, burn at 451°F, etc.).

  **The Modal Divergence:**
  Suppose the testator, Alice, signs the Will on January 1st. On June 1st, Alice marries Bob. She does not update the Will. She puts the paper back in the box.

  *   **Scenario:** On June 2nd, we ask: "Does the object in the box survive the marriage?"
  *   **The Document:** Yes. The cellulose and ink are untouched. It persists through the marriage event without physical alteration.
  *   **The Will:** No. In the eyes of the law (and thus in terms of its identity conditions as a *Will*), it ceased to exist (or ceased to be a *Valid Will*) the moment the marriage license was signed. It is now a "Revoked Instrument." It cannot fulfill its function. If Alice dies tomorrow, *this object* will not distribute her assets. A new Will would have to be created (even if it used the exact same paper and words).

  **The Grounding Problem:**
  This is where the case bites harder than the Statue/Clay.

  In the Statue/Clay case, the divergence usually requires a *physical change* to the coincident matter (squashing the clay destroys the statue). You can point to a microphysical difference at the moment of divergence.

  In **The Revoked Will**, the divergence happens **without any physical change to the coincident objects.**
  *   At *t1* (before marriage), the Document is a Will.
  *   At *t2* (after marriage), the Document is *not* a Will.
  *   The physical state of the Document at *t1* and *t2* is identical.
  *   The physical state of the environment immediately surrounding the Document (the safety deposit box) is identical.

  The difference in persistence conditions is grounded **entirely in a distant event** (Alice walking down an aisle miles away) and **abstract relational facts** (the statutes of the state).

  If you are a monist (believing there is only one object here), you must explain how *this single object* gains or loses a modal property (the capacity to transfer property) without any intrinsic physical change. If you are a pluralist, you must explain what grounds the distinction between the Document and the Will at *t1*, given that they are microphysically indiscernible and their future divergence depends on extrinsic facts.

  ***

  ### Honest Evaluation: Is this actually new?

  **Where it improves on the classics:**
  1.  **Decouples Destruction from Damage:** The Statue/Clay case relies on the intuition that "statues are fragile, clay is robust." But the fragility is always linked to physical deformation. The Will/Document case severs this link. It shows that persistence conditions can be sensitive to *institutional facts* that leave the physical substrate untouched. This makes the "two objects" intuition more compelling for those who think physical continuity should dictate identity.
  2.  **Extrinsic Grounding:** It highlights the "Grounding Problem" more sharply. In Statue/Clay, one might argue the statue's properties are grounded in the arrangement of the clay. In The Will, the Will's properties are grounded *nowhere near the object*. This forces the metaphysician to confront whether modal properties can be grounded in distant, relational facts.
  3.  **Avoids "Art" Baggage:** People get bogged down in "What counts as art?" or "Is the statue aesthetic?" Legal validity is binary and procedural, removing the vagueness of artistic constitution.

  **Where it might just relocate the problem:**
  1.  **The "Cambridge Change" Objection:** A skeptical monist will argue that the Will doesn't *cease to exist*; it merely loses a relational property (validity), just as a man can become a husband without physical change. They will say you are confusing *object identity* with *status*. (Counter: But if the Will is revoked, it cannot be re-validated by the same paper; a new act of signing is required. This suggests the *particular* is gone).
  2.  **Social Construction:** Like Money or Tickets, this relies on human institutions. Hard-nosed materialists might dismiss the "Will" as not a real concrete particular, but a fictional abstraction projected onto the paper. The Statue/Clay case feels more "physical" because statues are tangible artifacts.
  3.  **Sortal Relativity:** It ultimately boils down to the same debate: Do sortals like "Will" carry their own persistence conditions, or are those conditions parasitic on the underlying matter?

  **Verdict:**
  It is not a *solution* to the material constitution problem, but it is a **stronger intuition pump for the Pluralist**. It removes the ability for the Monist to hide behind "physical continuity." If your theory of identity says the Will and the Document are identical, you have to explain how one object can be physically immutable yet metaphysically destroyed by a wedding ceremony miles away.

  It forces the reading group to stop talking about "shapes" and start talking about **how extrinsic, institutional facts ground intrinsic modal profiles.** That is a fresh angle on the Grounding Problem.
