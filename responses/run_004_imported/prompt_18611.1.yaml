      *   *Argument:* Moral praise is a reward mechanism designed to reinforce decision processes. The User's decision process was "Don't drive drunk." The IID did not influence this process. Therefore, praising the process reinforces the correct behavior. Ignoring it because of a hidden variable undermines the link between process and reward.
      *   *Argument:* From a Bayesian perspective, if we want to estimate $P(\text{Responsible} | \text{No Drunk Driving})$, we must condition on what the agent *knew*. $P(\text{Responsible} | \text{No Drunk Driving}, \text{Agent Unaware of IID})$ is high. $P(\text{Responsible} | \text{No Drunk Driving}, \text{Agent Aware of IID})$ is low. The BIL is using the latter condition, which is historically inaccurate.
