      *   *Refinement:* If the User had tried to drive drunk and failed, they get no credit. But they didn't try. The disposition to not try is the virtuous part. The IID only stops the *action*, not the *intent*. Since the User never formed the intent, the IID was causally irrelevant to their decision process.

