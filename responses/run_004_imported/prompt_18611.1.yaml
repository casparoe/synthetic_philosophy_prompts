answer: |-
  This is a classic clash between **consequentialist outcome-based evaluation** and **virtue-ethics/process-based evaluation**, wrapped in a Bayesian epistemology problem. Since you're coming from the rationalist-diaspora side, I'm going to skip the "feelings" angle and go straight for the causal graph and the epistemic states.

  Your brother-in-law (BIL) is making a category error regarding **epistemic possibility** vs. **physical possibility**. You are correct, but to shut down the group chat, you need to frame it in terms of *what variable is actually being measured.*

  Here is the principled breakdown.

  ### 1. The Epistemic State at Time $T$
  Moral credit (and Bayesian updates on character) should be conditioned on the agent's knowledge state at the time of the decision, not the observer's knowledge state in hindsight.

  *   **Physical Reality:** The truck would not start if BAC > 0.08.
  *   **User's Epistemic Reality:** The truck starts if I turn the key.
  *   **The Decision:** "I will not turn the key if I have been drinking."

  Your BIL is arguing from a "God's eye view" (omniscient observer). He is saying that because the *physical* branch of "driving drunk" was pruned from the tree of reality, your navigation of the tree provides no data.

  But moral agency operates on the *epistemic* tree. From your perspective at time $T$, the branch existed. You chose not to traverse it. The fact that a hidden landmine was on that branch is irrelevant to the fact that you didn't walk down it *because you didn't want to*, not because you saw the mine.

  **The Principle:** Praise and blame attach to the *decision algorithm*, not the *hardware execution*, provided the hardware constraints were unknown to the algorithm.

  ### 2. The Counterfactual Test
  Your BIL's argument rests on this counterfactual: *"If you had tried to drive drunk, you would have failed."* He claims this makes your actual choice worthless.

  Let's run the counterfactual properly. There are two versions of you in the multiverse:
  1.  **You-Actual:** Doesn't drink, doesn't try to drive.
  2.  **You-Counterfactual:** Drinks, tries to drive, fails to start truck.

  Your BIL says You-Actual and You-Counterfactual are morally equivalent because the *outcome* (truck doesn't move drunk) is the same.

  This is false.
  *   **You-Actual** incurs zero risk. You never put the key in the ignition.
  *   **You-Counterfactual** incurs risk. Maybe the device malfunctions (false negative). Maybe you take a different car. Maybe you try to hotwire it. Maybe you drive drunk the next day in a rental.

  The virtue lies in **not generating the test case.** The interlock device only prevents the *successful operation* of the vehicle; it does not prevent the *attempt*. By never attempting, you demonstrated a disposition that the device does not enforce. The device enforces sobriety *at the ignition*; you enforced sobriety *at the decision to leave the bar*. Those are different causal nodes.

  ### 3. Bayesian Updating
  Let's look at this as an evidence problem. Your BIL claims your clean record is "worthless as evidence."

  *   **Hypothesis ($H$):** You are a responsible person who doesn't drive drunk.
  *   **Evidence ($E$):** You did not drive drunk for 3 years.
  *   **Context ($C$):** There was a hidden interlock.

  Your BIL is calculating $P(H | E, C_{\text{known}})$. If everyone *knew* about the interlock beforehand, $E$ would indeed provide near-zero update on $H$.

  But the relevant calculation is $P(H | E, C_{\text{unknown}})$.
  Since $C$ was unknown to you, $E$ is still a valid signal of $H$. The hidden variable $C$ did not influence your decision process. Therefore, $E$ is still causally linked to your internal character traits, not just the external constraint.

  If you want to get technical: The interlock is a **confounding variable** for the *outcome* (truck moving), but it is **not a confounder** for the *choice* (attempting to drive). Since moral credit is assigned to the choice, the confounder is irrelevant.

  ### 4. The "Control" Principle
  We generally agree that people shouldn't be blamed for things outside their control. Conversely, they shouldn't be praised for things outside their control.

  *   **BIL's View:** You couldn't control whether the truck started drunk (it wouldn't). Therefore, no praise.
  *   **Your View:** I controlled whether I *attempted* to drive drunk.

  Consider this: If the interlock had a 10% failure rate, would your BIL grant you 10% credit? That seems absurd. The credit comes from the fact that you never *relied* on the interlock. You operated as if you were the sole safety system.

  Furthermore, the interlock only secured *one asset*. It did not secure you against driving your spouse's car drunk, or a rental, or a friend's car. Your "clean record" applies to *all driving*, not just the truck. The interlock is irrelevant to your behavior regarding other vehicles.

  ### The Verdict
  **You win.**

  Your BIL is conflating **outcome luck** with **moral agency**.
  *   He is right that the *outcome* (no drunk driving in that truck) was partially determined by luck (the hidden device).
  *   He is wrong that the *choice* was determined by the device.

  **The Principled Settlement:**
  Tell the group chat this:
  > "Moral credit is an incentive mechanism designed to reinforce decision processes. My decision process was 'Do not drive drunk.' The interlock did not influence that process because I was unaware of it. Therefore, rewarding that process reinforces the correct algorithm.
  >
  > If we accept my brother-in-law's argument, we must conclude that a person who refuses a bribe gets no moral credit if it turns out the bribe was counterfeit money they couldn't have cashed anyway. The *availability* of the vice matters, not the *feasibility* of the transaction. I didn't drive drunk because I don't drive drunk, not because the car wouldn't let me. The car's constraint is a post-hoc physical fact; my restraint was an ex-ante epistemic choice."

  **One concession to give your BIL (to save face):**
  He is correct that the *predictive value* of your past behavior is slightly lower *now that we know*. If we were an insurance company assessing risk *today*, knowing you owned a car with a hidden interlock might slightly lower our confidence that your restraint was tested. But for the purpose of assessing *past character*, you are fully creditworthy.

  You acted as a responsible agent in a world you perceived as unconstrained. That is the only world moral agents actually live in.
