      *   **State the Verdict:** Neither professor is wrong. The tension arises from different modeling assumptions (Single Agent vs. Multi-Agent/Equilibrium).
      *   **Explain Good's Theorem (The "Against Nature" view):**
          *   Focus on the single agent.
          *   Information helps you map actions to states better.
          *   Assumption: The world doesn't change its rules based on what you know.
      *   **Explain Hirshleifer (The "Strategic/Market" view):**
          *   Focus on the market equilibrium.
          *   Information changes the *feasible set* of contracts.
          *   The value of the contract depends on *others* not knowing.
          *   This is an externality. My knowing hurts you (by breaking the pool).
      *   **The Technical Distinction:**
          *   Good: $E[\max_a U(a, \omega)] \ge \max_a E[U(a, \omega)]$. (Information allows better $a$).
          *   Hirshleifer: Information changes the function $U$ or the set of available $a$'s themselves because other agents react.
      *   **Analogy:** Poker vs. Solitaire.
