          4.  **Final Verdict:** Which account is more defensible regarding legitimate restriction?
      *   **Tone:** Academic, rigorous, critical, yet accessible enough for a seminar context.

  2.  **Deconstruct the Texts/Arguments:**

      *   **Michael Walzer (*Spheres of Justice*, Chapter "Membership"):**
