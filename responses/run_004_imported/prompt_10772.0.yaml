      *   Dummett is too restrictive? Maybe. But given the global context, his high bar is more morally robust.
      *   *Decision:* Dummett offers a more defensible account *normatively*, even if Walzer offers a more coherent *sociological* account of how states actually behave. Dummett bridges the gap between liberal universalism and political reality better because he forces the state to justify exclusion with evidence, not just assertion.

