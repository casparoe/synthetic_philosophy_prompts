          *   *Analogy:* Clubs, neighborhoods, families.
          *   *Right to Exclude:* Strong. It's a prerequisite for the existence of the community itself.
          *   *Constraints:* Mutual aid (refugees in urgent need), but generally, the community decides its shape.
          *   *Metaphysics:* Communitarian. The "shared understanding" of social goods is paramount.

      *   **Michael Dummett (*On Immigration and Refugees*):**
          *   *Context:* Written later (2001), but reflects decades of activism (Anti-Apartheid, UK immigration law).
          *   *Core Premise:* Liberal/Universalist foundation, but acknowledges psychological/sociological realities.
          *   *Right to Exclude:* Very weak/Conditional. "Right not to be submerged."
          *   *Constraints:* Must not be racial/ethnic. Must be a genuine threat to institutions/way of life (high bar). Almost no current state meets this honestly.
          *   *Metaphysics:* Analytic philosopher doing political theory. Focus on coherence, consistency, and moral clarity against racism.

      *   **The Classmate's Claim:** "Dummett is Walzer with extra hedging."
          *   *Surface truth:* Both allow *some* restriction. Both reject open borders (in the absolute Carens sense).
          *   *Deep truth:* Are the *justifications* the same?

  3.  **Drafting the Comparison (Iterative Process):**

      *   *Point 1: Foundations.* Walzer is communitarian. The good is the community's self-determination. Dummett is fundamentally liberal/universalist. He starts from the presumption of freedom of movement and carves out an exception. Walzer starts from the necessity of boundaries and carves out exceptions (refugees). *Crucial Distinction:* Burden of proof. For Walzer, exclusion is default. For Dummett, inclusion is default.
      *   *Point 2: The "Right not to be Submerged".* Walzer talks about "communal integrity." Dummett talks about "institutional collapse" or "overwhelming." Dummett's threshold is empirical/sociological. Walzer's is cultural/existential. Walzer allows exclusion to preserve *culture*; Dummett only allows it to preserve *function*.
      *   *Point 3: Racism and Motivation.* Dummett makes the *motive* central to the legitimacy. If the motive is racial, the right vanishes. Walzer is more concerned with the *outcome* (preserving the community). Walzer might argue a community *is* defined by ethnicity (though he tries to avoid this, his "shared understanding" can slide into cultural essentialism). Dummett explicitly severes the link between nationhood and ethnicity.
      *   *Point 4: Absorbability.* Can Walzer absorb Dummett? Walzer could say "Our shared understanding includes anti-racism." But Walzer's framework relies on the community defining itself. If the community *wants* to be ethnic, Walzer struggles to stop them without importing external liberal norms. Dummett imports external liberal norms (universal human rights) to constrain the community. So, Dummett's constraints do *independent work* that Walzer's internal logic cannot easily sustain.

