answer: |-
  This is a sophisticated prompt that cuts to the heart of a common pedagogical shortcut: treating convergent conclusions as evidence of convergent arguments. Your classmate's verdict—that Dummett is merely "Walzer with extra hedging"—mistakes a superficial overlap in policy recommendations (both reject absolute open borders; both allow some exclusion) for identity in normative foundations. While Walzer and Dummett both concede a conditional right to exclude, the architecture of their justifications, the burden of proof they assign, and the role of moral motivation differ radically.

  To test your classmate's claim, we must examine whether Dummett's constraints are merely prudential "hedging" or if they constitute a distinct moral logic that Walzer's communitarianism cannot absorb without collapsing.

  ### 1. The Direction of Justification: Default Settings
  The most significant divergence lies in the default position regarding movement.

  **Walzer** argues from the inside out. In *Spheres of Justice*, the primary good is the "community of character." Distributive justice is only intelligible among members who share a conception of the good. Therefore, the right to exclude is **constitutive**. Without the power to close the door, the club cannot exist, and if the club cannot exist, there is no one to practice justice among. For Walzer, exclusion is the default condition of political life; admission is the exception that requires justification (usually via the principle of mutual aid to refugees in immediate peril).

  **Dummett**, conversely, argues from the outside in. A logician by trade, Dummett approaches immigration as a problem of consistency within a liberal-universalist framework. His starting premise is the liberal presumption of freedom of movement. The "right not to be submerged" is not a constitutive power of the state but a **derogation** from a universal norm. For Dummett, inclusion is the default; exclusion is the exception that requires rigorous justification.

  This is not merely "hedging." It reverses the burden of proof. Under Walzer's framework, the immigrant must show why they should be let in (or why the community's mutual aid obligations are triggered). Under Dummett's, the state must demonstrate why letting them in would cause specific, catastrophic harm. Your classmate's reading misses that Dummett's "hedging" is actually a structural inversion of Walzer's priority.

  ### 2. The Nature of the Threat: Cultural vs. Functional
  Both philosophers agree that a community can restrict entry if its existence is threatened. However, they define the threat differently.

  **Walzer's "Communal Integrity":** Walzer worries about the dilution of the "shared understandings" that make distributive justice possible. If too many outsiders enter, they may not share the commitments required to sustain the welfare state or the political culture. This is a **cultural and political** threshold. It is inherently subjective: the community decides when its character is at risk. This leaves Walzer vulnerable to the "slippery slope" critique: if a community *believes* its character is threatened by a change in ethnic composition, Walzer's framework struggles to tell them they are wrong, provided their "shared understanding" includes that exclusivity.

  **Dummett's "Submersion":** Dummett defines the threat in **functional and institutional** terms. The "right not to be submerged" is invoked only when unchecked immigration would overwhelm the capacity of existing institutions (housing, schools, healthcare) or destabilize the political order to the point of collapse. Dummett is skeptical that this threshold is ever met in the modern world. He treats the "threat to way of life" argument with suspicion, viewing it often as a euphemism for racial anxiety.

  Here, Dummett's constraints do independent argumentative work. Walzer allows exclusion to preserve a *way of life* (which can be culturally conservative). Dummett only allows exclusion to preserve the *functioning of institutions* (which is empirically verifiable). Dummett's constraint is not just a cautious version of Walzer's; it is a rejection of Walzer's premise that cultural homogeneity is a prerequisite for justice.

  ### 3. The Role of Motive: Internal vs. External Constraints
  This is the point where the "Walzer with hedging" verdict fails most spectacularly.

  **Walzer** relies on **internal constraints**. The limits on exclusion come from the community's own moral commitments (e.g., if we are a democracy, we must admit some people; if we are charitable, we must take refugees). If a community's "shared understanding" is ethno-nationalist, Walzer's theory has limited resources to condemn it, other than appealing to broader "human" understandings which sit uneasily with his communitarian method.

  **Dummett** imposes **external constraints**. Drawing on his decades of anti-racist activism, Dummett argues that the *motive* for exclusion determines its legitimacy. He insists that any restriction motivated by racial or ethnic anxiety is illegitimate, regardless of the outcome. For Dummett, the "right not to be submerged" is valid *only if* exercised without racial animus.

  Can Walzer absorb this? Only by importing liberal-universalist norms that sit outside his communitarian framework. If a community's "shared understanding" is that they have a right to remain ethnically homogeneous, Walzer's "club model" validates that choice. Dummett's framework invalidates it *a priori*. Therefore, Dummett's ban on racial motivation is not "extra hedging"; it is a foundational moral veto that Walzer's system cannot generate on its own.

  ### Verdict: Which Account is More Defensible?

  While Walzer provides a more accurate *sociological* description of how states actually behave (acting as clubs protecting their assets), **Dummett offers the more defensible *normative* account of when a state may legitimately restrict immigration.**

  **Defense of the Verdict:**

  1.  **Immunity to Xenophobic Capture:** Walzer's communitarianism is dangerously porous to nativism. By grounding the right to exclude in "communal self-determination," Walzer provides a philosophical shield for policies driven by cultural anxiety. As we have seen in the rise of populist nationalism, the claim that "immigrants threaten our way of life" is easily decoupled from actual institutional strain and coupled with ethnic prejudice. Dummett's framework inoculates against this by making the *motive* a condition of legitimacy and setting the threshold for "submersion" so high (institutional collapse) that it cannot be easily triggered by mere cultural change.
  2.  **The Burden of Proof:** In a world of radical inequality, the presumption should lie with the migrant, not the state. Walzer places the burden on the outsider to prove they belong or are in dire need. Dummett places the burden on the state to prove that admission is impossible without self-destruction. Given that wealthy states often restrict immigration to protect economic privilege rather than communal integrity, Dummett's allocation of the burden of proof is more just.
  3.  **Coherence with Liberal Democracy:** Most modern states claim to be liberal democracies, not ethnic clubs. Walzer's theory treats states as private associations (clubs/families), which mischaracterizes their public, coercive nature. Dummett treats the state as a public institution bound by universal rights, making his "right not to be submerged" a tragic necessity rather than a sovereign privilege. This aligns better with the actual constitutional commitments of most Western democracies.

  **Conclusion:**
  Your classmate's dismissal of Dummett is a category error. They see two philosophers agreeing that "borders can sometimes close" and assume the reasoning is identical. But Walzer argues that borders are the *walls of the house of justice*, while Dummett argues they are *floodgates that must remain open unless the dam is breaking*. Dummett is not Walzer with extra hedging; he is a liberal universalist who has reluctantly conceded a small territory to political realism, whereas Walzer is a communitarian who has reluctantly conceded a small territory to universal human rights. For a political philosophy seminar concerned with *ethics*, Dummett's rigorous constraints on motive and capacity offer a far more robust defense against the injustices of the current global order than Walzer's permissive communitarianism.
