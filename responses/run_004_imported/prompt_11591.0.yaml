answer: |-
  This is a fascinating debate because it pits the internal mechanics of Tolstoy's theory (the psychology of infection) against the external moral purpose of his theory (the sociology of unity). While your friend makes a compelling case regarding the *sincerity* of the abstract expressionists, a strict reading of *What Is Art?* suggests that **your reading is significantly closer to Tolstoy's actual position.**

  Tolstoy would almost certainly have classified twentieth-century abstraction as "exclusive" or "counterfeit" art, placing it firmly alongside the Wagnerian operas and Symbolist poems he despised. Here is the breakdown of why, based strictly on the criteria he establishes in the text.

  ### 1. The Criterion of "Infection" and Clarity
  Your friend argues that abstraction can transmit a feeling with sincerity, satisfying the "infection" criterion. Tolstoy defines art as the transmission of feeling from artist to viewer, where the viewer "experiences the same feeling." However, Tolstoy places a massive caveat on *how* that transmission must occur.

  He lists three conditions that determine the *degree* of infectiousness:
  1.  **Individuality:** The distinctiveness of the feeling.
  2.  **Clarity:** The lucidity with which it is expressed.
  3.  **Sincerity:** The artist's own experience of that feeling.

  While Kandinsky, Rothko, and Pollock likely satisfy **Individuality** and **Sincerity** (Tolstoy valued sincerity above all else, and these artists were deeply earnest), they fail catastrophically on **Clarity**.

  For Tolstoy, clarity is not an aesthetic preference; it is a functional requirement for infection. He writes that if a work is obscure, the infection is weak or non-existent. He argues that when art becomes too complex or obscure, it requires "explanation" to be understood. For Tolstoy, **art that requires explanation is not art.** It is a puzzle or a code.

  If a viewer stands before a Rothko and feels "nothing" or "confusion" until a critic explains the color theory or the artist's depression, Tolstoy would argue no infection has taken place. The feeling was not transmitted; it was intellectually decoded. Since abstraction relies heavily on the viewer's willingness to suspend the need for representation, Tolstoy would view this as a failure of clarity, and thus a failure of infection.

  ### 2. The "Peasant" Test (Universal Accessibility)
  This is the strongest evidence for your side. Tolstoy's moral test for art is whether it unites humanity or divides it. He posits a specific metric for this: **Would a simple, uneducated peasant understand this?**

  Tolstoy writes:
  > *"Art should be understandable to all... If a peasant of sound mind were to see or hear a work of art and not receive from it any definite emotion, that work is not art."*

  He applied this test to Beethoven's late quartets and Wagner's operas, concluding they were not art because they alienated the common person. Abstract painting is the visual equivalent of Wagner's *Ring Cycle* in terms of accessibility. It is a language developed within academies and salons, requiring a specific "education of feeling" to appreciate.

  Tolstoy believed that "good art" creates a brotherhood of man by allowing a factory worker and a duke to feel the same grief or joy. Abstraction, historically, has functioned as a marker of class distinction. To appreciate Pollock in the 1950s required a specific cultural capital that the working class did not possess. Tolstoy would argue that this *creates* a barrier rather than dissolving one. Therefore, it fails the moral test of "union."

  ### 3. The Precedent of Impressionism and Symbolism
  We do not have to guess entirely; Tolstoy commented on the movements that immediately preceded abstraction. He was hostile toward Impressionism (calling it "incomprehensible" and "lacking in content") and vitriolic toward Symbolism.

  He viewed the move away from clear representation as a symptom of upper-class decadence. He believed that when the aristocracy runs out of genuine feelings to express, they invent new, obscure forms to simulate depth. He wrote of the Symbolists:
  > *"They say that the content of their art is so subtle that it cannot be expressed clearly... This is a lie."*

  Tolstoy would likely view Kandinsky's spiritualism or Rothko's metaphysics as precisely this kind of "lie"—a claim of deep feeling that cannot be substantiated because it cannot be clearly communicated to the majority of mankind. He would see the removal of the representational object not as a liberation, but as a retreat into elitism.

  ### 4. Where Your Friend Has a Point (and Why It Fails)
  Your friend is right that Tolstoy prioritizes **Sincerity**. If Tolstoy believed an artist was truly "infected" with a feeling, he was willing to forgive technical roughness (he praised folk art and simple religious prints).

  If Kandinsky could somehow prove that a peasant, upon seeing *Composition VII*, immediately wept with the exact same spiritual terror Kandinsky felt, Tolstoy would have to concede it was art. But Tolstoy would argue this is empirically impossible. He would contend that the "feeling" in abstraction is often vague, even to the artist, and is retroactively named rather than genuinely transmitted.

  Furthermore, your friend focuses on the *aesthetic* criteria (infection), while Tolstoy ultimately subordinates aesthetics to *ethics*. Even if an abstract painting *did* infect a small group of people sincerely, Tolstoy would condemn it if that infection excluded the rest of humanity. For Tolstoy, art that divides mankind into the "initiated" and the "uninitiated" is not just bad art; it is a tool of social oppression.

  ### The Verdict
  Tolstoy would likely view abstract expressionism as the ultimate culmination of the "counterfeit" art he warned against.

  *   **On Infection:** He would rule that without representational anchors, the "clarity" required for true infection is impossible for the common man.
  *   **On Morality:** He would rule that because it requires specialized education to appreciate, it separates classes rather than uniting them.
  *   **On Sincerity:** He might grant the artists were sincere, but he would argue they were sincerely deluded, mistaking obscurity for depth.

  **You win the argument.** While your friend correctly identifies that sincerity is a necessary condition for Tolstoy, they overlook that clarity and universal accessibility are *co-equal* necessary conditions. Tolstoy's theory is not just about the relationship between the artist and the canvas, but between the artist and *all of humanity*. Abstraction, by its very nature, restricts that audience. Tolstoy would have seen it not as a new form of art, but as the final severing of art from life.
