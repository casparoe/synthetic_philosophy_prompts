answer: |-
  Here are ten interview questions designed to bypass the standard modal-intuition defenses and press the causal-historical theory on its metaphysical and semantic commitments. Each includes a specific follow-up tailored to anticipate her likely defensive maneuvers.

  ### 1. The Qua Problem (Ostensive Ambiguity)
  **Question:** In the initial baptism of a natural kind term, the theorist claims we point to a sample and intend to name the *kind* it belongs to. But any sample instantiates indefinitely many overlapping kinds: this sample is gold, but also *metal*, *yellow stuff*, *element 79*, and *matter*. If the baptizer lacks the concept of "atomic number," what causal mechanism selects *gold* rather than *yellow stuff* as the referent? If the answer is "the causal interaction itself," doesn't that imply the world, not the speaker, fixes the reference, rendering error in the baptism impossible?

  **Follow-up:** If she replies that the speaker's *intention* filters the kind: "If the intention does the filtering, aren't we back to a descriptivist picture where the description 'the kind causally responsible for this appearance' fixes the reference? How is that intentionally distinct from the descriptivism you reject?"

  ### 2. The Jade Case (Disjunctive Kinds)
  **Question:** Jadeite and nephrite are chemically distinct minerals with no shared microstructural essence, yet pre-scientific speakers used "jade" to refer to both successfully. A strict natural-kind essentialist seems forced to say "jade" does not refer to a real kind, or refers to a disjunctive kind *jadeite-or-nephrite*. If the latter, doesn't this undermine the claim that natural kind terms always pick out mind-independent structural essences? If the former, did speakers before 1863 fail to refer to jade at all?

  **Follow-up:** If she argues "jade" is a superficial/functional kind rather than a natural kind: "Water was once thought to be a superficial kind (clear, drinkable liquid) but you claim it turned out to be H₂O. What principled distinction prevents 'jade' from undergoing the same essentialist reduction, other than the brute fact that chemistry didn't unify them?"

  ### 3. The Gödel/Schmidt Case (Positive Mechanism)
  **Question:** Kripke's Gödel/Schmidt argument is devastating against descriptivism, but it is purely negative. It tells us what reference is *not* (not determined by associated descriptions). Positively, if I use the name "Feynman" but believe falsely that he invented the atomic bomb, what specifically secures the reference to Feynman rather than the inventor of the bomb? Is it merely a historical chain of transmissions? If so, does every link in that chain require an intention to preserve reference, or merely an intention to communicate?

  **Follow-up:** If she insists the causal chain is sufficient regardless of speaker belief: "Consider a community where, for 200 years, everyone uses 'Aristotle' intending to refer to 'the teacher of Alexander,' but unbeknownst to them, Alexander had no teacher. On the causal view, does the name refer to nothing, or to the actual person (if one exists) at the start of the chain? If the latter, how does the causal link survive total descriptive error?"

  ### 4. Necessity of Origin
  **Question:** You defend the view that a table's origin in a specific block of wood is necessary to its identity, and similarly for human gametes. Is this a core commitment of the causal-historical view, or an optional extension? If it is core, does this not commit us to haecceitism—the view that there are primitive this-ness facts about matter distinct from their qualitative properties? If it is optional, why does it follow from the same semantics that yield "Water is H₂O"?

  **Follow-up:** If she claims it is a core metaphysical commitment: "If origin is necessary, then in any possible world where this table exists, it must come from *this* wood. But if we swap the wood atom-for-atom with qualitatively identical wood from a different source, at what point does the necessity break? Is there a fact of the matter, or is the boundary vague?"

  ### 5. Two-Dimensionalism (Chalmers/Jackson)
  **Question:** Two-dimensional semantics reconstructs the necessary a posteriori by separating the primary intension (reference-fixing description) from the secondary intension (rigid designation). On this view, "Water is H₂O" is necessary only relative to the actual world's reference fixing. Does this framework not show that the 'necessity' Kripke discovered is merely a feature of how we individuate epistemic possibilities, rather than a first-order metaphysical fact about the world?

  **Follow-up:** If she rejects two-dimensionalism as conflating epistemology and metaphysics: "If you reject the distinction, how do you explain the contingency of the reference-fixing fact ('Let's call the liquid in the oceans "water"') without admitting that the proposition 'Water is H₂O' relies on that contingent fixing to be necessary?"

  ### 6. Empty Names
  **Question:** The causal theory requires an initial baptism grounded in an existing entity. How does your view handle empty names like "Vulcan" (the hypothesized planet) or "Santa Claus"? There was no initial causal contact with a referent. Do these names lack semantic content, or do they refer to abstract objects? If they lack content, how can "Vulcan does not exist" be a true, meaningful statement?

  **Follow-up:** If she suggests a pretense or fictionalist account for empty names: "Does this not create a semantic discontinuity? If I say 'Vulcan is small' and you say 'Neptune is large,' we are using names with fundamentally different semantic architectures. How do we quantify over them in the same logical space without a unified theory of reference?"

  ### 7. The Madagascar Case (Reference Shift)
  **Question:** Gareth Evans noted that 'Madagascar' originally referred to a part of the African mainland but shifted to the island due to a communicative error. The causal chain was preserved, but the reference changed. Does this not show that causal history alone is insufficient, and that the *current* usage and intentions of the community can override the historical chain?

  **Follow-up:** If she argues the reference shifted because the causal chain was corrupted or branched: "At what specific point in the transmission does the corruption occur? If the majority of speakers intend to refer to the island, does the historical link to the mainland snap immediately, or is there a transitional period where the reference is indeterminate?"

  ### 8. Cognitive Significance (Frege's Puzzle)
  **Question:** If the meaning of a name is just its referent, then "Hesperus is Hesperus" and "Hesperus is Phosphorus" should have the same cognitive value. Kripke accepts they express the same proposition but differ in cognitive significance. How does the causal theory explain this difference without reintroducing a notion of 'sense' or 'mode of presentation' that functions exactly like the descriptions you rejected?

  **Follow-up:** If she appeals to 'guises' or psychological files rather than semantic content: "If these guises determine cognitive significance but not reference, why do we feel that denying 'Hesperus is Phosphorus' is a mistake about the *world* rather than just a confusion about our *files*? Doesn't the normative force suggest the mode of presentation has semantic weight?"

  ### 9. Division of Linguistic Labor
  **Question:** Putnam argued that reference relies on a division of labor where experts fix the extension of terms like 'gold' or 'elm' for the layperson. If the experts change their minds about the microstructure (e.g., if physics changes its definition of 'element'), does the reference of the layperson's term shift retroactively? If so, doesn't this make the content of my speech dependent on facts I cannot access even in principle?

  **Follow-up:** If she accepts retroactive reference shift: "If my utterance of 'gold' yesterday refers to whatever experts decide tomorrow, do I truly know what I am asserting when I speak? Does this not violate the transparency of mental content required for rational agency?"

  ### 10. Falsifiability and Evidence
  **Question:** To close: What would count as empirical or conceptual evidence *against* the causal-historical theory? I distinguish between a 'puzzle' that the theory can absorb with refinement (like the Madagascar case) and genuine falsifying evidence. Is there a possible world or a linguistic phenomenon that, if discovered, would compel you to abandon rigid designatism?

  **Follow-up:** If she claims the theory is a framework rather than an empirical hypothesis: "If the theory is immune to falsification because it can always posit hidden causal chains or defer to expert intention, does it not risk becoming a tautology where 'reference succeeds' simply means 'a causal chain existed'? How do we distinguish a successful causal explanation from a post-hoc rationalization?"
