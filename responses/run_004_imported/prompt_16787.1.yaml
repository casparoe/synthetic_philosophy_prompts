answer: |-
  **Setting:** *The bar of the Hotel Bristol, Geneva. Late evening, 1967. The International Congress for Logic, Methodology and Philosophy of Science has just wrapped up its third day. Carl Hempel sits with a glass of mineral water, reviewing notes. I.J. Good approaches, holding a whiskey.*

  **Good:** Carl? Mind if I join you? I saw you dodging the reception crowd. I figured you'd be here calculating the probability of escape.

  **Hempel:** *(Looks up, smiles thinly)* I.J. Please. I wasn't calculating probabilities. I was trying to clarify definitions. There's a difference. Though I suppose, given your profession, you find that distinction suspect.

  **Good:** *(Sits)* Only when the definitions pretend to exist outside of context. But I didn't come to talk about definitions. I came about the ravens. Or rather, the shoes.

  **Hempel:** *(Sighs)* The white shoe. I should have known. Your paper in the *British Journal*. "The White Shoe is a Red Herring." A clever title.

  **Good:** I try. But the point wasn't the pun, Carl. It was the sign. You argue that observing a white shoe confirms "All ravens are black." You say it's logically necessary, merely psychologically counter-intuitive. I'm saying that under reasonable assumptions, observing a white shoe doesn't just confirm it *less* than a black raven—it can actually *disconfirm* it. It can lower the probability.

  **Hempel:** We've been over this, I.J. You're conflating the *qualitative* concept of confirmation with the *quantitative*. My project is to define the conditions under which evidence $E$ supports hypothesis $H$ in virtue of their logical form. Nicod's Criterion tells us what confirms a universal generalization. The Equivalence Condition tells us that if $H_1$ and $H_2$ are logically equivalent, they must be confirmed by the same evidence. "All ravens are black" is equivalent to "All non-black things are non-ravens." A white shoe is a non-black non-raven. Therefore, it confirms the hypothesis. To deny this is to violate the logic of the equivalence condition.

  **Good:** And that's where you're smuggling in metaphysics under the guise of logic. You treat confirmation like entailment. But confirmation isn't deduction. It's induction. And induction lives and dies by background knowledge, $K$. You try to strip $K$ away to find a "pure" logical relation. I'm telling you there is no such animal.

  **Hempel:** If we rely entirely on $K$, then confirmation becomes entirely relative. There is no objective scientific method, only shifting subjective priors. I am looking for the invariant structure of testing.

  **Good:** Invariance is a lovely dream. But let's look at the mechanics. Let's build a world. Imagine we don't know how many ravens exist. We have two competing hypotheses about the world's composition.
  World 1: There are very few ravens, and they are all black. There are also very few non-black things.
  World 2: There are many ravens, but most are non-black. However, there are a *vast* number of non-black non-ravens.

  **Hempel:** Go on.

  **Good:** Now, I reach into the universe and pull out a non-black object. I observe it. It is a non-raven. Say, a white shoe.
  In World 2, there are vastly more non-black non-ravens than in World 1. So, finding one makes it much more likely I am in World 2.
  But in World 2, the hypothesis "All ravens are black" is false.
  So, by observing the white shoe, I have increased the probability that I am in a world where the hypothesis is false.
  $P(H | E \& K) < P(H | K)$.
  The shoe doesn't confirm, Carl. It disconfirms.

  **Hempel:** *(Puts down his glass)* You've rigged the priors. You've assumed a background knowledge $K$ where the population sizes are correlated in a specific way that favors the disconfirmation.

  **Good:** I've assumed *a* background knowledge. You assume *another* one where non-black things are abundant but ravens are rare, which makes the confirmation negligible but positive. My point is that the *direction* of the confirmation depends on $K$. You claim the confirmation is a logical fact. I claim it's a probabilistic relation relative to a state of information. If the sign can flip, your "logical" relation is empty.

  **Hempel:** It is not empty. It defines the *potential* for support. Look, I.J., consider the Equivalence Condition again. If your Bayesian account allows a piece of evidence to confirm $H_1$ ("All ravens are black") while simultaneously disconfirming $H_2$ ("All non-black things are non-ravens"), despite them being logically identical, then your account is incoherent. You cannot have $P(H_1 | E) > P(H_1)$ and $P(H_2 | E) < P(H_2)$ when $H_1 \iff H_2$.

  **Good:** I wouldn't do that. If $H_1$ and $H_2$ are logically equivalent, they have the same probability. $P(H_1) = P(H_2)$. So if the evidence lowers one, it lowers the other.

  **Hempel:** Then you admit the shoe disconfirms "All non-black things are non-ravens" as well?

  **Good:** In the scenario I constructed? Yes. Because finding a non-black non-raven suggests the class of non-black things is huge and under-sampled. It increases the chance that if we kept looking, we'd find a non-black raven hiding in that massive pile of non-black stuff. It suggests our sample is biased.

  **Hempel:** But this violates Nicod's Criterion. Nicod says an instance of $F$ and $G$ confirms "All $F$ are $G$." A non-black non-raven is an instance of the equivalent formulation.

  **Good:** Nicod's Criterion is false, Carl. It's a heuristic that works when we assume uniform priors over population sizes. But it's not a law of logic. You're trying to build a syntax of confirmation without a semantics. It's like trying to do arithmetic without knowing what the numbers represent.

  **Hempel:** *(Leans forward)* But if we abandon the qualitative criteria, what do we have left? Science becomes a game of subjective betting odds. If I say "This experiment confirms my theory," and you say "No, given my priors it disconfirms it," there is no arbiter. The logical empiricist project is to find that arbiter. To say that certain relations hold *regardless* of the specific content of our knowledge, provided the knowledge is formally consistent.

  **Good:** The arbiter is Bayes' Theorem. It tells you exactly how to update. The "subjectivity" is only in the starting point. But once we agree on the evidence, we converge. Your "qualitative" confirmation pretends to be objective but actually hides the priors in the definition. You say the shoe confirms "logically." I ask "Relative to what?" You say "Relative to tautological background knowledge." But tautological knowledge is a fiction. We never reason from a tabula rasa.

  **Hempel:** We reason from the *structure* of the hypothesis. The paradox arises because you, and the others, are importing empirical knowledge about the distribution of objects in the actual world. You know there are more non-black things than ravens. You know ravens are rare. You think this makes the confirmation negligible. I agree it makes it negligible! But I insist the logical relation remains.
  Your counterexample doesn't show the logic is wrong; it shows that in *specific empirical contexts*, the weight of the confirmation can be outweighed by other probabilistic factors. But that doesn't negate the qualitative support.

  **Good:** It negates it if the support becomes negative! If I step on a scale and it says I've lost weight, but actually I've gained five pounds, the scale isn't "qualitatively" right but "quantitatively" off. It's broken.
  If a white shoe can lower the probability of "All ravens are black," then calling it a "confirming instance" is misleading. It's not a confirmation that is small; it's a disconfirmation. And if it can be either, depending on $K$, then there is no context-independent fact of the matter.

  **Hempel:** There is a context-independent fact about the *logical form* of the evidence. The evidence $E$ satisfies the satisfaction criterion for $H$. That is a logical fact. The *degree* of confirmation, or the shift in credence, is where your probabilities enter. I am defining the relation of "being evidence for." You are defining "increasing the probability of."

  **Good:** But "being evidence for" *means* "increasing the probability of." That's what evidence *does*. If it doesn't raise the probability, in what sense is it evidence?

  **Hempel:** In the sense that it eliminates a potential falsifier? No, that's Popper. In the sense that it is an instance of the law. Look, I.J., perhaps we are talking past each other. I am interested in the *classification* of evidence. Which observations count *at all* toward a hypothesis? You are interested in the *weight* of evidence. How much does it count?
  My claim is: A white shoe counts. It is in the class of confirming instances.
  Your claim is: Sometimes, counting it reduces your confidence.

  **Good:** If counting it reduces my confidence, why would I call it a confirming instance? It's like calling a vote for my opponent a "vote of support" because, in some complex electoral college system, it might indirectly help me later. No, it's a vote against.
  The trouble, Carl, is that you want a logic of science that looks like deductive logic. In deduction, if $A$ entails $B$, $B$ is true whenever $A$ is. In your confirmation, you want "E confirms H" to be true whenever the logical form matches. But induction isn't truth-preserving. It's uncertainty-managing.

  **Hempel:** And if we manage uncertainty without logical constraints, we get paradoxes. We get people claiming evidence supports contradictory hypotheses because their priors differ. The Equivalence Condition is a constraint on rationality. If you accept $H_1$ and $H_2$ are the same statement, you cannot treat evidence for one as evidence against the other.

  **Good:** I agree on the Equivalence Condition. I don't violate it. $H_1$ and $H_2$ rise and fall together. The problem is Nicod's Criterion. You keep trying to save Nicod. I'm telling you to drop it. Nicod says "An $F$ that is $G$ confirms All $F$ are $G$." That is not universally true. It depends on how the observation was generated.
  Did you sample from ravens? Did you sample from black things? Did you sample from the universe?
  If I sample from non-black things, and find a non-raven, that tells me about the density of non-ravens in the non-black sector. It tells me nothing about ravens unless I know the ratio of ravens to non-ravens globally.

  **Hempel:** *(Takes a sip of water)* So your resolution is to relativize confirmation to the sampling method.

  **Good:** To the experimental design, yes. And the background knowledge.

  **Hempel:** Then confirmation is not a relation between a sentence $E$ and a sentence $H$. It is a relation between $E$, $H$, and a knowledge situation $K$.

  **Good:** Precisely. $C(H, E, K)$.

  **Hempel:** But then we have no general logic of science. We have a logic of specific situations.

  **Good:** Science *is* specific situations, Carl. We don't test hypotheses in a vacuum. We test them in a lab, with instruments, with prior theories. Your "qualitative" confirmation is a map without a territory. It's elegant, I grant you. It has a certain... crystalline beauty. But it doesn't tell a scientist whether to trust their data.

  **Hempel:** It tells them what *counts* as data. That is no small thing. If we follow your path, the boundary between evidence and assumption blurs. If $K$ determines whether $E$ confirms $H$, then two scientists with different $K$ can look at the same experiment and one says "Confirmed," the other says "Disconfirmed." And you say both are rational.

  **Good:** I say both are Bayesian. And if they are rational, they will eventually converge as data accumulates. The priors wash out.

  **Hempel:** Eventually. But science often moves on before "eventually." We need norms for theory choice *now*. The equivalence condition provides a norm. It says: You cannot reject the evidence for the contrapositive while accepting it for the original. That is a rule of rational discourse.

  **Good:** *(Finishes his whiskey)* I'll drink to that. You can't have it both ways. But I still say the white shoe is a red herring. It distracts us from the real work, which is calculating the odds.

  **Hempel:** *(Smiles)* And I say the odds are meaningless without a logic to structure them. You calculate the probability of what, exactly, if you haven't defined the hypothesis space?

  **Good:** Touche.

  **Hempel:** So. We agree that the paradox arises from the tension between logical equivalence and probabilistic relevance.

  **Good:** We agree that Nicod's Criterion is too strong.

  **Hempel:** I will concede that Nicod's Criterion requires restriction. But I will not concede the Equivalence Condition.

  **Good:** And I will concede that logical consistency is a constraint on priors. But I will not concede that confirmation is a binary, context-free relation.

  **Hempel:** Then we are at an impasse.

  **Good:** We are at the beginning of the next century of philosophy of science, Carl. The impasse *is* the progress. Another drink?

  **Hempel:** Just water. I need to keep my head clear. Someone has to defend logic from the probability theorists.

  **Good:** *(Signals the bartender)* And someone has to teach the logicians how to count. Cheers, Carl.

  **Hempel:** Cheers, I.J.

  *(They clink glasses. Hempel looks thoughtful, staring at the condensation on his glass. Good looks at the room, scanning for the next problem.)*
