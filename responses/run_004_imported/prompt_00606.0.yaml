answer: |-
  You have hit on the single biggest technical objection to moral trade, often called the **additionality problem** (or the baseline problem). You are absolutely right: if the action would have happened anyway, the "trade" is economically inefficient from a moral perspective, even if it feels good to the participants.

  However, most philosophers and economists who advocate for moral trade (like Scott Alexander or Toby Ord) argue this is a **friction cost, not a fatal flaw.**

  Here is why the counterfactual problem doesn't kill the idea, but does require you to change how you structure the trade.

  ### 1. The Commitment Device Argument
  The strongest defense against your objection is that the money changes the *incentive structure* of the action, thereby altering the counterfactual.

  If your friend says, "I was going to cut back on meat anyway," the moral trader should reply: "Okay, but will you stick to it when you're tired, stressed, or at a barbecue in three months?"

  In this view, the donation isn't paying for the *intent* to eat less meat; it is paying for the **enforcement of the commitment.** By putting money on the line, the friend now has a financial penalty for backsliding.
  *   **Without trade:** Friend relies on willpower (high failure rate).
  *   **With trade:** Friend relies on willpower + financial loss (lower failure rate).

  Even if the friend *intended* to do the same thing, the trade increases the *probability* of follow-through. That marginal increase in probability is the "moral value" being purchased.

  ### 2. Marginal vs. Binary Actions
  Your objection assumes a binary switch: either the friend eats less meat or they don't. In reality, behavior is marginal.

  *   **Baseline:** Friend might reduce meat consumption by 10% on their own.
  *   **Trade:** The donation incentivizes them to aim for a 20% reduction.

  If the trade is structured correctly (e.g., "$10 per meat-free week" rather than a lump sum for "eating less"), you are paying for the *extra* 10%. This solves the additionality problem by making the payment contingent on verified marginal units, similar to how carbon credits are theoretically supposed to work (though often fail to in practice).

  ### 3. Screening and "The Fence"
  You are correct that trading with a committed vegan or a die-hard carnivore is useless. The sweet spot for moral trade is people **on the fence.**

  This requires "screening." Before proposing a trade, you have a conversation to estimate their baseline.
  *   *Trader:* "On a scale of 1 to 10, how likely are you to cut meat without this deal?"
  *   *Friend:* "Honestly? About a 20% chance."
  *   *Trader:* "Okay, with the donation incentive, can we get that to 80%?"

  If the friend says, "I was 100% going to do this," the rational moral trader should **decline the trade.** Part of the ethics of moral trade is refusing to pay for things that aren't additional. Acknowledging this limitation actually strengthens the framework; it just limits the pool of eligible partners.

  ### 4. Expected Value vs. Certainty
  You mention that we can't verify counterfactuals. That is true, but we operate under uncertainty in almost all moral actions.

  *   **Donating to charity:** You don't know for sure if your $100 saved a life or if the government would have covered that cost anyway (fungibility). You donate based on *expected value*.
  *   **Voting:** You don't know if your vote will be the tie-breaker. You vote because there is a non-zero probability it matters.

  Moral trade is the same. You make your best Bayesian estimate of the counterfactual. If you estimate there is a 50% chance your friend wouldn't have changed their behavior without the money, the trade has 50% expected moral value. As long as the "price" you pay (your donation) is low enough to justify that risk, the trade is still rational.

  ### 5. Where Your Objection *Is* Fatal
  There are specific scenarios where your critique does kill the trade:
  1.  **Virtue Signaling:** If the primary goal is for the friend to *look* virtuous to the trader, and the behavior change is superficial, it's a wash.
  2.  **Fungibility:** If the friend takes your money, eats less meat, but then spends the money they saved on meat on something else equally harmful (unlikely but possible), the net utility might be zero.
  3.  **Crowding Out:** If paying someone to be moral reduces their intrinsic motivation to be moral later (the "overjustification effect"), the long-term counterfactual might be negative.

  ### The Verdict
  The counterfactual problem doesn't make moral trade impossible; it makes it **information-heavy.**

  Ordinary trade works because I value the apple and you value the dollar; we don't need to know each other's psychology. Moral trade requires knowing the other person's psychology (their baseline, their willpower, their sincerity).

  So, the fix isn't to ignore the counterfactual, but to treat **estimating the counterfactual** as part of the transaction cost. If you can't estimate it (e.g., a stranger on the internet), the trade is high-risk. If you can estimate it (a close friend whose habits you know), the trade is viable.

  It transforms moral trade from a "market" (anonymous, scalable) into a "network" (personal, trust-based). That limits its scale, but doesn't invalidate the core logic.
