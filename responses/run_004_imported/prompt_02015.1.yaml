prompt: |-
  So I went down a rabbit hole that started at Aumann's agreement theorem and somehow ended up in the peer disagreement literature, specifically the conciliationism vs steadfastness debate. I already get the 101 version (conciliationists say you gotta give real weight to a peer who disagrees with you, steadfasters say sometimes its fine to hold firm), so you don't need to redefine those for me. What I actually want explained is a specific move I stumbled on -- i think the guy's name was Elga -- where he raises the "self-undermining" objection that conciliationism has to lower its own confidence in itself since plenty of respected epistemologists are steadfasters, then tries to fix it with this bizarre analogy about Consumer Reports rating itself the #1 ratings magazine 28 years running. Can you walk through why that's supposed to show a fundamental method has to be "dogmatic" about its own correctness, whether it actually rescues conciliationism or just relabels the problem, and if there's a standard comeback to it that I'm missing?
