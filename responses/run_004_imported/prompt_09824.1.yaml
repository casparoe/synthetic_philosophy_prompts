      *   *Premise-based procedure (Issue-by-Issue):* Vote on A, Vote on B. If both pass majority, Conclusion = Yes.
      *   *Conclusion-based procedure (Case-by-Case):* Vote on Conclusion directly.
      *   *The Conflict:* As seen here, Premise-based can yield "Yes" while Conclusion-based yields "No."
