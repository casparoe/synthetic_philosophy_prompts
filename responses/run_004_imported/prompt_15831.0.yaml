      *   The "Maker's Knowledge" argument is the core. If I make a clock and it doesn't tell time, I didn't understand the mechanism. If Hobbes "makes" a circle in his mind and it yields false ratios, he didn't truly "make" it in the philosophical sense. But he *insists* he did. This implies the internal sense of "making" is not a reliable truth-test.

