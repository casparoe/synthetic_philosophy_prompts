          *   *Philosophical Objection:* If the method guarantees truth when followed, and he followed the method (by his lights) but got falsehood, either (a) the method doesn't guarantee truth, or (b) he didn't actually construct the object in his mind correctly.
          *   *The Killer Argument:* If the certainty comes from *construction*, then error implies a failure of construction. But Hobbes insists he *did* construct it correctly. This suggests that "construction" is not self-validating. If I can *think* I've constructed a square equal to a circle but haven't, then the "light of reason" or "intuition of construction" is fallible. If it's fallible in geometry (the gold standard), it's definitely fallible in politics (where passions interfere).

