      *   *Premise 2:* Hobbes claims to have generated a square equal to a circle.
      *   *Observation:* He has not (Wallis proved this).
      *   *Inference:* Hobbes *believed* he had generated the object, but he was mistaken about the consequences of his own construction.
      *   *Implication:* The act of "mental construction" does not guarantee infallible insight into the properties of the constructed object.
      *   *Political Analogy:* If we cannot infallibly deduce properties from geometric constructions we made, why trust we can deduce obligations from political covenants we made? The "civil science" loses its foundational certainty.

