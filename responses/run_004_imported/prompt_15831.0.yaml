      *   *Gender:* A woman writing to Hobbes. This is rare. She needs to be bold but perhaps use the anonymity or the "correspondent" status to speak freely. Hobbes actually corresponded with various intellectuals. She shouldn't sound like a 21st-century philosopher, but like a 17th-century natural philosopher (think Margaret Cavendish, though Cavendish was more of a critic of the New Science generally).
      *   *Language:* 17th-century epistolary style. "Sir," "Humbly," "Pray consider," "Demonstration," "Artifice."
      *   *Reference:* Mention *De Corpore* (1655) is crucial because that's where the quadrature attempt was published.

  5.  **Refining the Philosophical Punch:**
      *   Avoid saying "You are wrong about pi."
