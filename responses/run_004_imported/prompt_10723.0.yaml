      *   *Key Nuance:* Gödel distinguished between "mechanical procedure" (formal system) and "mind" (which can grasp truth via intuition/insight, not just derivation).
      *   *Self-Reference:* Gödel was deeply interested in self-reference but saw the inability of a system to prove its own consistency as a limitation of *formalism*, not necessarily of *truth*.

  3.  **Deconstruct the Löbian Obstacle (MIRI/ Yudkowsky/ Herreshoff):**
