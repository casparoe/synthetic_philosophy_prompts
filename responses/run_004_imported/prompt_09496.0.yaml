      *   *Crucial Insight:* The "Maker's Knowledge" thesis guarantees certainty *if* the construction is valid. It does not guarantee that every claim of construction is valid. Hobbes's stubbornness comes from his belief that his *method* (kinematics) is the only path to truth, so any result derived from it *must* be right, and conflicting results (Wallis) must be wrong.
