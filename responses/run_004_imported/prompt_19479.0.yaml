          *   Nuclear war isn't a "negation of the particular for the universal"; it's the negation of *both*. It's abstract negativity, not determinate negation.
          *   *The "Long Peace":* Hegel would likely see the *fear* driving the peace as a form of "particularity" (preservation of biological life) trumping "universality" (ethical duty). This fits his "stagnation" critique.
