  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the feeling. It's not a bug; it's a feature of high-level drafting. You've pierced the veil.
      *   **The Nature of the "Because":** In life, "because" is physical/psychological. In fiction, "because" is *retrospective coherence*. It's about truthfulness, not metaphysical independence.
