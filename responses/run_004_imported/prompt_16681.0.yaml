      *   **The "Illusion of Agency":** This is a known concept in narratology. Readers *agree* to pretend characters are real.
      *   **The "Because":** In real life, "because" implies physical/psychological causality. In fiction, "because" implies *narrative coherence*.
      *   **The Drafting Process:** The user feels the freedom of the draft undermines the constraint of the backstory. But constraints are self-imposed.
      *   **Reader Experience:** Does it matter if the agency is illusory if the *effect* on the reader is emotional truth?

  3.  **Formulate a Response Strategy:**
