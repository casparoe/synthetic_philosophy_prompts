prompt: |-
  Hey, I'm working on a piece about free will skepticism and keep circling back to Galen Strawson's "Basic Argument" against moral responsibility -- the regress where to really be responsible for what you do, you'd have to be responsible for the way you are, which means being responsible for having made yourself that way, and so on forever. Thing is, Strawson himself points to Nietzsche's bit about causa sui in Beyond Good and Evil (somewhere around section 21, the one about hauling yourself into existence by your own hair) as making basically the same move a century before him. Can you spell out Strawson's regress argument properly and then compare it to what Nietzsche's actually doing in that passage -- same argument, same target, or is Nietzsche after something bigger (unmasking guilt and blame as a psychological racket) while Strawson's running a narrower, more clinical case thats meant to bite regardless of whether determinism turns out to be true? Which one holds up better as philosophy, and is Strawson maybe borrowing more authority from Nietzsche than that passage really gives him?
