      *   *Strawson:* Analytic, logical, metaphysical. Focuses on the *conditions* of responsibility. Aims to show UR is impossible. Neutral on determinism (hard incompatibilism).
      *   *Nietzsche:* Genealogical, psychological, cultural. Focuses on the *motives* behind believing in free will. Aims to show the *value* of the belief is poisonous (guilt, bad conscience).
      *   *Overlap:* Both agree *causa sui* is impossible. Both agree traditional moral responsibility requires it.
      *   *Divergence:* Strawson says "It's impossible, so responsibility is dead." Nietzsche says "It's impossible, and the fact that you insist on it reveals your desire to torture/judge."

  5.  **Task 4: Which Holds Up Better?**
      *   *Strawson:* Logically tight within its framework. But relies on a specific definition of "Ultimate Responsibility." Compatibilists (like Dennett or Strawson's own father, P.F. Strawson) reject the premise that we need *ultimate* responsibility for *practical* responsibility.
      *   *Nietzsche:* Harder to "refute" logically because it's a critique of values. It holds up well as a cultural critique. But as a metaphysical proof? It's more aphoristic.
      *   *Verdict:* Strawson is better logic; Nietzsche is better psychology/cultural critique.

  6.  **Task 5: Is Strawson Borrowing Authority?**
