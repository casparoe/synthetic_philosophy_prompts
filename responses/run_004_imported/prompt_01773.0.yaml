answer: |-
  The cable was singing. It was a low, thrumming note, vibrating through the carbon-filament core and into the gloves of Halsey's suit.

  "Readings?" Halsey asked. Her voice sounded thin inside the helmet, deadened by the lack of an atmosphere to carry the echo.

  "Zero," said Vane. He was thirty meters away, a white speck against the grey. "Accelerometers read zero. Gyros read zero. GPS is… well, GPS is a joke."

  "Then why is the tether taut?"

  Halsey tugged her end. The line didn't give. It was hard as a rod, humming with tension. They were drifting in the Omission, a sector of space where the sensors showed nothing. No cosmic microwave background. No distant quasars. No dust. Just two suits, a tether, and a void so complete it felt like pressure against the eyes.

  "Centrifugal force," Vane said. "We're spinning."

  "Relative to what?" Halsey snapped. "Look around, Vane. There is no *what*."

  "Relative to space!"

  "Space isn't a thing you can grab. It's just… distance."

  "Tell that to my inner ear." Vane's voice cracked. "I'm dizzy, Halsey. I'm nauseous. My vestibular system is screaming that I'm rotating at two RPMs. If I close my eyes, I'm on a merry-go-round. If I open them, I'm hanging in a dead box."

  This was the problem. Newton's old ghost was haunting them. In a universe with stars, rotation is easy: you see the stars move. But here, in the Omission, the stars were gone. By all relational logic, if there is nothing to move *against*, you cannot move. You are stationary.

  And yet, the cable sang. And yet, Vane was vomiting into his bio-recycler.

  "Cut it," Vane said.

  "Negative."

  "If we cut the tether, the tension breaks. We stop spinning."

  "We don't stop spinning. We just fly apart. And we'll still be rotating on our own axes. You'll still puke."

  "Then why is it pulling?" Vane drifted closer, reeling himself in hand-over-hand along the tense line. He stopped five meters from her, his faceplate a dark mirror. "Mach was right. It has to be. Rotation is only real if the mass of the universe defines it. The universe is gone, Halsey. We're the only mass left. Two specks. Two globes tied by a string."

  "So the force should vanish," Halsey said. "If Mach is right, and rotation is purely relative to the fixed stars, then with no stars, there is no centrifugal force. The cable should be slack."

  "It's not slack."

  "I know."

  "Which means Newton was right," Vane whispered. "Space is a substance. A bucket. We're pushing against the walls of the bucket, even though we can't see them."

  Halsey looked at the cable. It was the only straight line in existence. In a universe without geometry, the tether defined the radius. The tension defined the force.

  "Or," Halsey said, "we're wrong about the Omission."

  "There's nothing on the sensors."

  "Sensors measure particles. Photons. Gravity waves. What if space doesn't need those to exist? What if the tension *is* the reference?"

  "That's mysticism."

  "It's physics. If the cable is tight, work is being done. Energy is in the system. Where is it coming from?"

  Vane floated silently for a moment. The hum of the cable grew louder, or maybe it was just the blood rushing in Halsey's ears. The nausea was creeping up on her now, too. A slow, rolling vertigo that had no visual anchor. It was a sickening feeling, like falling while sitting still.

  "I'm going to fire the thrusters," Vane said. "Counter-rotation."

  "You can't. You don't know which way is up."

  "My gyros say—"

  "Your gyros measure rotation relative to *inertial space*, Vane. They're part of the problem. They're measuring the exact thing we're trying to define."

  "I have to stop the spin."

  "If you fire, you change our momentum relative to the tether, but you don't change the tension unless you change the rotation of the system. And to do that, you need leverage. We have none."

  Vane raised his wrist thrusters. "I'm doing it."

  "Wait." Halsey reached out, but she was too far.

  He fired. A burst of nitrogen gas hissed from his suit. He began to turn, slowly, fighting the invisible current. The cable shuddered. The hum pitched up, becoming a whine.

  "Feel that?" Vane shouted. "The tension increased! I'm fighting it!"

  "You're fighting yourself!" Halsey yelled back. "You're adding energy to the system. You're proving the space resists you."

  "Exactly! It's real!"

  "Or," Halsey said, her voice dropping, "you're proving that *we* are the universe."

  Vane stopped firing. He hung suspended, chest heaving. The cable continued to hum, indifferent to their panic.

  "What?"

  "Mach said the water curves because the stars pull on it. Gravity. Frame dragging. The mass of the cosmos dictates what is straight and what is curved. But the cosmos is gone." Halsey looked at the tether. "But we have mass. We have mass, Vane. Two hundred kilograms of suit and bone."

  "Two hundred kilograms isn't enough to generate a fixed reference frame."

  "Isn't it? We're tied together. We define the diameter. We define the center of mass. Maybe… maybe rotation isn't about the stars. Maybe it's about the relationship between the two points."

  "So if I cut the cable?"

  "Then there is no relationship. Then there is no radius. Then there is no spin."

  Vane drew a knife from his belt. The blade caught no light, but Halsey saw the movement.

  "Don't."

  "If I cut it, and Mach is right, the force disappears. I stop feeling sick. If Newton is right, I fly off in a tangent, still spinning, still sick, just alone."

  "If you cut it, we drift apart. We never find each other again."

  "We're already dead, Halsey. We're just deciding how to die. In a bucket? Or in the void?"

  The nausea rolled over Halsey again, a wave of pure disorientation. She couldn't tell if she was moving or if the void was spinning around her. It was the exact sensation Mach had described: *Spin the stars around the bucket, and the water curves.* But here, there were no stars to spin. Only the cable.

  "The tension is the only truth," Halsey said. "Not the stars. Not the space. The tension."

  Vane held the knife against the filament. The hum vibrated through the blade, up his arm.

  "If I cut it," Vane said, "do we prove space is a thing? Or do we prove we were never moving at all?"

  "Does it matter?" Halsey asked. "You still feel sick."

  Vane looked at the knife. He looked at the endless grey behind Halsey. He looked at the cable, the only thing in existence that seemed to have a purpose. It held them. It defined them. Without it, they were just coordinates with no grid.

  "The cable is the star," Vane said softly.

  "What?"

  "The cable is the fixed star. It's the only thing that doesn't move relative to the force. It's our universe."

  Vane lowered the knife. He clipped it back to his belt.

  "We don't cut it," he said.

  "No."

  "We keep the tension."

  "Yes."

  "Because if we let go," Vane said, watching the humming line, "there's nothing left to tell us we exist."

  Halsey gripped her end of the tether. The vibration traveled up her arm, into her shoulder, settling in her bones. It was a terrible feeling, a constant, pulling reminder of a motion that had no destination. But it was a feeling. It was a connection.

  In the silence of the Omission, the cable sang on, the only song in a universe of one.
