answer: |-
  **Setting:** *The study of Charles Sanders Peirce, Milford, Pennsylvania. Late autumn, 1905. The room is cluttered with papers, logic diagrams, and bottles of ink. William James has come up from Harvard for a brief visit. The air is thick with tobacco smoke and the tension of old friends who have drifted into philosophical antagonism.*

  **Peirce:** (Tapping a pipe against an ashtray) You did me a great service in California, Will. In '98. When you stood before those philosophers and told them that I, Charles Peirce, was the originator of this principle. It put food on the table for a month, I daresay.

  **James:** It put the principle on the map, Charlie. That was the aim. Philosophy had become a museum of idols. I wanted to bring it out into the street. I credited you because it was the truth. The maxim comes from your "How to Make Our Ideas Clear."

  **Peirce:** The maxim, yes. But not the metaphysics you've built upon it. You have taken a logical rule for clarifying concepts and turned it into a theory of truth that makes my skin crawl. You have made it too easy. Too soft.

  **James:** I have made it *human*. You treat inquiry as if it were conducted by angels in a vacuum. I treat it as conducted by men and women with backs to the wall, needing to live.

  **Peirce:** And that is precisely why I am publishing a new article in *The Monist* next week. I am renaming my doctrine. "Pragmaticism."

  **James:** (Laughs) Pragmaticism? It sounds like a disease of the liver.

  **Peirce:** It is ugly enough to be safe from kidnappers. That is the point. You and Schiller and the rest have taken "Pragmatism" and stretched it until it covers everything and nothing. You speak of truth as what is "good in the way of belief." You speak of the "cash-value" of an idea.

  **James:** And is that not what you intended? That concepts must have practical consequences?

  **Peirce:** Consequences for *conduct*, yes. Not consequences for *comfort*. Here is my charge, Will: If you define truth as what it is satisfying to hold, you have collapsed the distinction between a belief being true and a belief being merely expedient for the believer. If a man finds it comforting to believe his dead wife is watching over him, and that belief steadies his nerves, is it therefore *true*? If your "good in the way of belief" is the criterion, then a comforting falsehood and a hard-won truth become indistinguishable. You have subjective utility masquerading as objective fact.

  **James:** (Leans forward, eyes bright) You strike hard, Charlie. But you strike a straw man. When I say "good," I do not mean "pleasant." I do not mean "sedative."

  **Peirce:** Then define it. Without recourse to the "final opinion" you so dislike.

  **James:** "Good" means expedient in the total process of experience. A belief is true if it guides us successfully through the stream of sensations and relations. The comforting belief about the dead wife? It may be useful for a moment, but if it leads him to ignore the realities of his grief, or to make decisions based on imagined counsel that contradicts the evidence of his senses, it will eventually clash with further experience. It will prove *inconvenient*. Truth is what proves itself to be good in the long run of *all* experiences, not just the current psychological state. A falsehood may work for a day, but it will eventually lead to a practical contradiction.

  **Peirce:** So you appeal to the "long run" as well?

  **James:** I appeal to the continuity of experience. I do not need a metaphysical limit to know when I am led astray.

  **Peirce:** But you see, Will, by shifting the defense to "eventual contradiction," you have smuggled in my view! You are admitting that there is a standard outside the individual's current satisfaction. But if you stay true to your own psychology, you cannot guarantee that contradiction. Perhaps the lie *never* contradicts. Perhaps the man lives and dies comforted. Is his belief then true?

  **James:** (Pauses) If it never contradicts... if it harmonizes with every other demand of experience... then for all practical purposes, it *is* true. Truth *happens* to an idea. It becomes true, is made true by events.

  **Peirce:** Then truth is mutable. It changes as the experiences change.

  **James:** It grows. It is plastic.

  **Peirce:** And that is where we part. For me, truth is not made; it is found. It is the opinion fated to be ultimately agreed to by all who investigate. It is independent of what you or I find satisfying. But let us turn the screw. You criticize my "final opinion." You call it a metaphysical fantasy.

  **James:** I call it an empty promissory note. You say truth is the destination of an indefinitely prolonged inquiry. But Charlie, we are finite. We die. The community of inquirers may perish. The earth may cool. To define truth as something no finite inquirer can ever verify, something that exists only at an ideal limit we can never reach... that is not science. That is a covert article of faith. It is a theological absolute dressed in laboratory garb. You accuse me of softness, but you are asking us to have faith in a convergence we can never witness.

  **Peirce:** (Stands and paces) It is not faith, Will. It is a logical presupposition.

  **James:** Of what?

  **Peirce:** Of the very act of inquiry itself. When you investigate a question, when you weigh evidence, you are *already* assuming that there is a right answer to be found. If you did not assume that a conclusion is determined by the reality and not by your whim, you would not bother to inquire. You would merely assert. My "final opinion" is not a prediction that we will all meet in heaven to compare notes. It is a statement about the nature of Reality. Reality is that which insists on forcing itself upon the mind.

  **James:** But you cannot cash the note!

  **Peirce:** I do not need to cash it to know it is not counterfeit. Look at it this way: You say my limit is unreachable. I grant it. But your "verification" is also never complete. Every experience is followed by another. When do you stop and say, "Now it is verified"? At the last moment of your life? And what if you were wrong? You need the ideal limit just as much as I do to make sense of your claim that one belief is *better* than another. Without the regulative ideal of a final settlement, your "better" is just "preferable to me right now."

  **James:** (Silent for a moment, stirring his tea) So you argue that without the destination, the journey has no direction.

  **Peirce:** I argue that without the destination, there is no journey. There is only wandering. If truth is merely what works for you now, then when the context shifts, the truth shifts. Then there is no error, only obsolescence. But we know there is error. We know we are wrong *now*, even if we don't know what is right. That implies a standard.

  **James:** And I argue that your standard is a ghost that haunts the living. You sacrifice the concrete suffering and striving of the individual inquirer for a "community" that may not exist in a thousand years. If a belief saves a man's life today, it has truth-value today. To tell him, "Wait until the end of inquiry," is to offer him a stone when he asks for bread. Your pragmaticism is logically tighter, Charlie, I grant you that. But it is existentially cold.

  **Peirce:** Logic *is* cold. It must be. If we warm it with human needs, we melt the structure. I coined "Pragmaticism" to preserve the structure. Let them have "Pragmatism." Let them have the literary movement, the psychology of belief. I will keep the logic.

  **James:** And I will keep the life. Though I admit... (James sighs) ...I admit that if there is no external permanency, no reality that pushes back regardless of our wishes, then my "stream of experience" is just a dream we are all having together.

  **Peirce:** Precisely. And I am not willing to concede that the universe is merely a dream. There is a Secondness, a brute resistance. That resistance is the anchor. Your "good" must be anchored to that resistance, or it floats away.

  **James:** And your "final opinion" must be anchored to human experience, or it sinks into the abyss of abstraction.

  **Peirce:** (Sits back down) Then we are at an impasse. You think my anchor is in the clouds. I think your boat is untethered.

  **James:** It seems so. Though I suspect history will find we were two hands trying to clap the same sound.

  **Peirce:** History is not the judge, Will. The reality is. But... (Peirce gestures to the manuscript on his desk) ...I shall keep the name. "Pragmaticism." Ugly, as I said.

  **James:** (Standing, smiling wryly) It is certainly that. But if it keeps you from being claimed by the spiritualists and the sentimentalists, perhaps ugliness is a virtue. I shall return to Cambridge. I have students who need to be taught that beliefs have consequences.

  **Peirce:** And I have diagrams to draw. To show that consequences do not make beliefs.

  **James:** Good day, Charlie.

  **Peirce:** Good day, Will.

  *(James exits. Peirce immediately dips his pen, writes "Pragmaticism" at the top of a fresh sheet, underlines it twice, and resumes writing, alone.)*
