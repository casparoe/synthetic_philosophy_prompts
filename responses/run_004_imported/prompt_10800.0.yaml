answer: |-
  The promise of Solomonoff induction is intoxicating to the philosophically inclined scientist. It appears to offer what centuries of epistemology could not: a mathematical proof that simplicity is a reliable guide to truth. By defining the prior probability of a hypothesis as inversely proportional to its Kolmogorov complexity (the length of the shortest program generating it on a Universal Turing Machine), Solomonoff induction formalizes Occam's razor. It boasts a convergence theorem guaranteeing that, for any computable data-generating process, the induction will eventually identify the true distribution. However, this formal elegance rests on a fragile foundation. The Kolmogorov complexity of a string is invariant across different Universal Turing Machines (UTMs) only up to an additive constant, and the Solomonoff prior is uncomputable. These limitations suggest that the framework does not so much solve the problem of justifying Occam's razor as it does transmute it. While Solomonoff induction provides a rigorous internal logic for inductive inference, it fails to supply a non-circular, absolute justification for preferring simple hypotheses. Instead, it relocates the burden of justification from the principle of simplicity to the arbitrary choice of a reference machine, revealing Occam's razor to be a feature of representation rather than a law of nature.

  To understand the strength of the vindication claim, one must appreciate the power of the Solomonoff framework. In classical philosophy, Occam's razor is often treated as a pragmatic heuristic or a metaphysical assumption about the parsimony of nature. Solomonoff induction elevates it to a theorem of probability theory. By assigning higher prior weight to shorter programs, the framework ensures that "simple" explanations dominate the posterior probability mass early in the learning process. Furthermore, the dominance theorem states that the Solomonoff prior dominates any computable probability measure. This means that even if the true data-generating process is assigned a low prior by the Solomonoff inducer, the ratio between the true probability and the Solomonoff estimate is bounded by a constant. Consequently, the inducer is guaranteed to converge on the truth as quickly as any other computable strategy. To proponents, this suggests that simplicity is not merely an aesthetic preference but a computational necessity for any agent seeking to model a computable universe. The invariance theorem of Kolmogorov complexity bolsters this by asserting that for sufficiently long strings, the choice of UTM matters little; the complexity of a string is an intrinsic property, independent of the specific language used to describe it, save for a fixed constant.

  However, the "fixed constant" is the Achilles' heel of this justification. The invariance theorem states that $K_U(x) \leq K_{U'}(x) + c$, where $c$ depends on the machines $U$ and $U'$ but not on the string $x$. While $c$ becomes negligible as the length of $x$ approaches infinity, all human scientific inquiry takes place in the realm of the finite. For any finite body of evidence, a sufficiently pathological choice of UTM can invert the complexity ordering of hypotheses. One can construct a "perverse" UTM that assigns a very short code to a wildly complex, gerrymandered hypothesis (e.g., a "Grue"-like predicate) and a long code to a simple physical law. Under such a machine, Solomonoff induction would rigorously and provably converge on the complex hypothesis, assigning it a vastly higher prior probability. If the justification for Occam's razor relies on the machinery of Solomonoff induction, and that machinery can be tuned to favor complexity just as easily as simplicity, then the framework has not justified the razor; it has merely shown how to sharpen it, without telling us which edge to use.

  Defenders of Solomonoff induction often counter that we should simply restrict our attention to "natural" or "simple" UTMs. They argue that while the space of UTMs is infinite, most are artificially convoluted, and there exists a natural class of machines (e.g., those based on standard logic gates or simple instruction sets) that should serve as the reference. Yet this defense collapses into circularity. To select a "simple" UTM as the reference machine is to invoke Occam's razor to justify Occam's razor. We prefer a UTM with a simple transition table because we already believe that simplicity is a marker of validity or neutrality. If the choice of the reference machine is the locus of the simplicity bias, then Solomonoff induction does not explain *why* we should prefer simple hypotheses; it merely assumes that preference in the initialization of the system. The framework effectively hides the philosophical assumption inside the technical definition of the universal machine. It transforms the question "Why is the world simple?" into "Why do we use this Turing machine?", but it offers no resources to answer the latter without presupposing the former.

  Furthermore, the uncomputability of the Solomonoff prior limits its normative force. Because Kolmogorov complexity is uncomputable, no finite agent can actually calculate the Solomonoff prior. We must rely on approximations, such as Minimum Description Length (MDL) or Bayesian model selection with restricted hypothesis spaces. These approximations inherit the UTM dependence of the ideal framework but lack the asymptotic convergence guarantees that make the ideal framework compelling. In the finite regime where actual science occurs, the additive constant is not a negligible error term; it is the deciding factor. If the justification for Occam's razor is asymptotic, but our epistemic lives are finite, the justification is practically vacuous. It tells us that simplicity wins in the limit of infinite data, but it cannot tell us whether the simple theory is more likely to be true given the data we actually possess.

  Despite these criticisms, one might argue that the relocation of the problem is itself a form of progress. By isolating the subjectivity to the choice of the reference machine, Solomonoff induction clarifies the nature of inductive bias. It demonstrates that there is no "view from nowhere" for induction; all inductive reasoning requires a prior, and the Solomonoff prior makes the structure of that prior explicit. However, clarity is not justification. A map that clearly marks a cliff does not justify jumping off it. The framework shows that *if* one accepts a specific linguistic framework as neutral, *then* one must accept Occam's razor within that framework. But it cannot validate the neutrality of the framework itself. The bias toward simplicity is not derived from the mathematics of computation; it is imported into the mathematics via the choice of the universal machine.

  Therefore, the verdict must be that Kolmogorov complexity and Solomonoff induction do not supply a non-circular justification of Occam's razor. They provide a powerful formalization of how simplicity functions within a computational theory of mind, but they fail to ground the preference for simplicity in anything deeper than the arbitrary selection of a description language. The framework vindicates a language-relative, comparative notion of simplicity: a hypothesis is simpler *relative to a UTM*, and it is more probable *relative to that same UTM*. It does not, and cannot, vindicate an absolute metaphysical principle that nature prefers simplicity. The dependence on the additive constant ensures that for any finite dataset, the "simplicity" of a hypothesis is contingent on the linguistic lens through which it is viewed. Consequently, Solomonoff induction does not resolve the problem of induction; it merely formalizes the circularity inherent in it. We prefer simple theories because we use a reference machine that encodes simplicity, and we use that reference machine because we prefer simple theories. The mathematics is rigorous, but the foundation remains a philosophical assumption disguised as a technical constant.
