      *   **The Circularity of the "Natural" UTM:** Defenders say "Just use a simple UTM." But what defines "simple"? If we choose the simplest UTM to justify simplicity, we are begging the question. We are using OR to justify OR. The preference for a "natural" programming language (like Python or C over a scrambled one) is itself an instance of Occam's Razor.

      *   **The Uncomputability Constraint:** SI is an idealization. We use approximations (MDL, AIC). These approximations inherit the UTM bias. This reinforces that the justification is pragmatic, not foundational.

