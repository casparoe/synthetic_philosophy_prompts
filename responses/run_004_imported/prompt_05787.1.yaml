      *   *The Logical Gap:* The user is right that Reid's formulation is a bit of a false dichotomy or at least relies on a specific definition of "experience." If "experience" includes negative experiences (being lied to), then experience *does* shape credulity. Reid admits this ("limited and restrained by experience").
