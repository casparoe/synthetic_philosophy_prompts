prompt: |-
  I'm putting together this week's session for my grad seminar on Sidgwick's *Methods of Ethics*, and I went down a weird rabbit hole last night that I can't quite shake. One of my students, who's way more into AI stuff than I am, kept bringing up "coherent extrapolated volition" (CEV) — Yudkowsky's old proposal that instead of pointing an AI at humanity's actual, present-day preferences, you should point it at whatever our preferences would converge to if we knew more, thought faster and more clearly, were more the people we each wish we were, and had had more time to reflect together. It hit me that this is basically dressing up, in engineering language, the exact same move Sidgwick makes when he tries to get from individual "considered judgments" up to the "point of view of the universe" — except Sidgwick thought he needed a handful of independently self-evident axioms (prudence, justice, rational benevolence) to license that move, wheras CEV seems to just trust that extrapolation plus coherence-seeking will do the work on its own, with no independent axiomatic backing at all.

  Obviously Sidgwick never had to think about AI (he died in 1900, CEV wasn't formulated til 2004), but he thought unusually hard, for his era, about exactly the kind of idealization-of-preferences move CEV relies on, and about whether such moves can actually bridge the gap he's most famous for never closing: the dualism of practical reason between egoism and universal benevolence. So here's what I want your take on: if you explained CEV to Sidgwick, do you think he'd see it as a live candidate for finally resolving (or at least dissolving) that dualism, on the grounds that it operationalizes impartial extrapolation at civilizational scale? Or would his own doubts about whether such convergence is even possible without some theistic guarantee, combined with his insistence on independently self-evident starting points, make him pretty scathing about the whole project? Feel free to get properly into the weeds here — this is for my own prep/amusement rather than for the students directly, so I'm after your best reconstruction of how his actual arguments bear on this, not a diplomatic both-sides answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar on Sidgwick's *The Methods of Ethics*.
      *   **Topic:** Comparing Sidgwick's ethical intuitionism/methodology with Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV).
      *   **Core Question:** If Sidgwick knew about CEV, would he see it as a solution to the "Dualism of Practical Reason" (egoism vs. utilitarianism), or would he reject it based on his requirements for self-evident axioms and his doubts about convergence without theism?
      *   **Tone/Level:** High-level academic/philosophical discussion ("get properly into the weeds," "reconstruction of how his actual arguments bear on this," "not a diplomatic both-sides answer").
      *   **Key Insight from User:** CEV looks like Sidgwick's move from "considered judgments" to the "point of view of the universe," but CEV relies on procedural extrapolation/coherence rather than Sidgwick's substantive self-evident axioms.

  2.  **Deconstruct the Philosophical Positions:**

      *   **Sidgwick (*The Methods of Ethics*):**
          *   *Method:* Intuitionist Utilitarianism. He seeks philosophical clarity and coherence.
          *   *Axioms:* He identifies three self-evident principles (Justice, Prudence, Rational Benevolence). These are *synthetic a priori* truths grasped by rational intuition.
          *   *The Dualism:* Egoism (rational self-interest) and Utilitarianism (universal good) are both rational methods. They conflict. Reason cannot decide between them without a theological postulate (God ensuring virtue and happiness coincide).
          *   *Idealization:* He uses "common sense morality" refined into philosophical principles. He believes in a "Point of View of the Universe" (God's eye view), but access to it requires rational intuition of axioms, not just aggregating preferences.
          *   *Skepticism:* He is deeply skeptical that mere empirical observation of human desires (even refined) yields objective obligation.

      *   **Yudkowsky (CEV):**
          *   *Goal:* AI Alignment. Make AI do what we *would* want if we were better.
          *   *Method:* Procedural. Take current volition, extrapolate (more knowledge, faster thought, more reflection), coerce into coherence.
          *   *Meta-ethics:* Often implicitly naturalist or functionalist. Values are what humans *have*, not necessarily what exists independently in the universe.
          *   *Convergence:* Hopes that extrapolation leads to convergence (or at least compatibility).
          *   *Gap:* Doesn't necessarily claim to solve the *normative* "why be moral?" question, but rather the *engineering* "how to make AI safe" question.

  3.  **Evaluate the Intersection (Sidgwick on CEV):**

      *   *Point of Agreement:* Both recognize that current, raw human preferences are flawed, inconsistent, and ignorant. Both seek an idealized standpoint.
      *   *Point of Divergence 1 (Source of Normativity):* Sidgwick needs *self-evident axioms* to ground obligation. CEV relies on *extrapolation of existing desires*. Sidgwick would ask: "Why is the extrapolated volition *binding*?" If my extrapolated self wants X, why *ought* I to do X? For Sidgwick, "ought" comes from rational intuition of axioms, not from hypothetical future desires.
      *   *Point of Divergence 2 (The Dualism):* CEV aggregates human volition. Egoism is part of human volition. If my extrapolated self still prefers my own happiness over the universal good (and Sidgwick thinks rational egoism is coherent), CEV might just codify the Dualism rather than resolve it. Unless CEV *forces* convergence on Utilitarianism, it doesn't solve Sidgwick's problem.
      *   *Point of Divergence 3 (Theism/Metaphysics):* Sidgwick thought the reconciliation of Duty and Self-Interest required a moral orderer of the universe. CEV is a purely naturalistic/engineering procedure. Sidgwick would likely see CEV as lacking the metaphysical "teeth" to obligate the egoist.
      *   *Point of Divergence 4 (Objectivity):* Sidgwick wants ethics to be objective (like math). CEV looks like subjectivism refined by processing power. Sidgwick called this "empirical ethics" and generally found it wanting for foundational justification.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the brilliance of the student's insight. It *is* a structural parallel. But Sidgwick would likely be critical.
      *   *Section 1: The Nature of the "Point of View of the Universe".* Sidgwick's PVU is ontological/normative. CEV's is procedural/aggregative. Sidgwick would argue CEV confuses *what we would want* with *what is right*.
      *   *Section 2: The Axiomatic Gap.* Sidgwick needs the Axiom of Rational Benevolence to get to Utilitarianism. CEV tries to derive it from reflection. Sidgwick would say reflection alone doesn't generate the *obligation* to care about others. (The "Why be moral?" problem).
      *   *Section 3: The Dualism of Practical Reason.* This is the crux. If CEV extrapolates *my* volition, does it converge with *yours*? Sidgwick doubts it without theism. If my extrapolated self is a rational egoist, CEV might validate egoism. It doesn't dissolve the dualism; it might just automate it.
      *   *Section 4: Meta-ethical Status.* Sidgwick is a rational intuitionist. CEV is closer to ideal observer theory or preference utilitarianism. Sidgwick explicitly argues against deriving ought from is (even idealized is).
      *   *Conclusion:* Sidgwick would admire the rigor but reject the meta-ethics. He'd see it as a sophisticated form of "empirical utilitarianism" which he already critiqued.

  5.  **Refining the Tone:**
      *   Needs to sound like a colleague speaking to a colleague.
      *   Use Sidgwickian terminology (*Methods*, *Dualism*, *Self-Evident*, *Rational Benevolence*).
      *   Avoid dismissing CEV too easily, but apply Sidgwick's specific critiques rigorously.
      *   Highlight the "is-ought" distinction which is central to Sidgwick's critique of empirical ethics.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, does CEV claim to solve ethics?* No, it claims to solve alignment. But the user is asking if it solves *Sidgwick's Dualism*.
      *   *Sidgwick's view on convergence:* He thought rational agents *should* converge on the axioms. But he didn't think empirical reflection guarantees it.
      *   *The "Theistic Guarantee":* Sidgwick famously said he couldn't bring himself to believe theism just to solve ethics, but he saw it as the only way out of the Dualism. CEV offers a technological guarantee. Sidgwick would likely find this category-confused. Technology can't fix a metaphysical rift in rationality.

  7.  **Final Polish:** Organize into clear thematic sections. Ensure the distinction between *procedural rationality* (CEV) and *substantive rationality* (Sidgwick) is clear. (This is a key philosophical distinction relevant here).

      *(Self-Correction during drafting)*: Make sure to mention Book I of *Methods* where he critiques empirical ethics. He argues that even idealized desire satisfaction doesn't yield *Ultimate Good* unless you already assume the Axiom of Benevolence.

  8.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  This is a fantastic connection, and your student has spotted a genuine structural isomorphism between the two projects. Both Sidgwick and Yudkowsky are grappling with the unreliability of raw, immediate human psychology and seeking a method to idealize it into something normative.

  However, if you want the "non-diplomatic" Sidgwickian take: **Sidgwick would likely view CEV as a category error that fails to address the meta-ethical core of the Dualism.** He would admire the engineering rigor but dismiss it as a sophisticated version of the "empirical method" he spends the first three books of *The Methods of Ethics* dismantling.

  Here is the breakdown of why Sidgwick would likely be scathing, based on his specific arguments regarding intuition, the source of obligation, and the metaphysical requirements for resolving the Dualism.

  ### 1. Procedural vs. Substantive Rationality
  The deepest friction here is meta-ethical. CEV is fundamentally a **procedural** account of value: the "good" is defined by the output of a specific cognitive process (extrapolation + coherence). Sidgwick is a **substantive** rational intuitionist.

  For Sidgwick, the "Point of View of the Universe" (PVU) is not a *result* of processing human preferences; it is an *antecedent standard* by which those preferences are judged. In Book III, Sidgwick argues that we cannot derive the principle of Utility merely from observing desires, even idealized ones. We can only get there by grasping the self-evident axiom of **Rational Benevolence** ("I ought to regard the good of any other individual as much as my own").

  If you explained CEV to Sidgwick, he would ask: *"Why is the output of this extrapolation binding?"*
  *   **CEV Answer:** Because it is what you *would* will if you were rational and informed.
  *   **Sidgwick's Counter:** That tells me what I would *desire*, not what I *ought* to do. You have conflated the psychological fact of idealized desire with the normative truth of obligation. Unless you independently establish (via intuition) that one *ought* to pursue the coherent volition of humanity, CEV is just a description of a hypothetical psychological state, not a moral law.

  Sidgwick would argue that CEV presupposes the very axiom it claims to derive. It assumes that "coherence" and "knowledge" lead to "benevolence." Sidgwick spent his life worrying that they don't.

  ### 2. The Dualism of Practical Reason
  This is where Sidgwick would hit the brakes hardest. The Dualism arises because Sidgwick finds two equally rational methods: **Egoistic Hedonism** (maximize my happiness) and **Universal Hedonism** (maximize general happiness). Reason supports both, but they conflict.

  CEV attempts to bypass this by aggregating and extrapolating volition. But Sidgwick would point out a fatal flaw: **What if the extrapolation doesn't converge on Benevolence?**

  Sidgwick's fear was that a perfectly rational egoist is not logically contradictory. If I think faster, know more, and reflect longer, I might simply become a more *efficient* egoist. I might realize that "Universal Benevolence" is a sentimental holdover and that my true, extrapolated volition is my own perfection.

  *   **Sidgwick's Critique:** CEV assumes convergence on a shared moral truth. But without the independent axiom of Rational Benevolence, there is no guarantee that *my* extrapolated volition aligns with *yours*, or with the "Universal Good."
  *   **The Result:** CEV might simply codify the Dualism into the AI's objective function. The AI might recognize that "Rational Egoism" is a coherent extrapolated volition for Agent A, and "Utilitarianism" is one for Agent B, and have no rational way to prioritize between them.

  For Sidgwick, the only thing that resolves the Dualism is a **theological postulate**: the belief that God has structured the universe such that virtue and self-interest ultimately coincide. CEV offers a *technological* postulate (superintelligence will align us). Sidgwick would view this as metaphysically naive. You cannot solve a rift in practical reason with better computation; you need a moral orderer of the universe.

  ### 3. The "Common Sense" Trap
  Sidgwick spends a huge amount of time in Book III analyzing "Common Sense Morality." He shows that common sense is vague, inconsistent, and often contradictory. He uses intuition to refine it into Utilitarianism.

  He would see CEV as the ultimate "Common Sense" method: it takes human intuitions, polishes them, and hopes they shine. But Sidgwick argues that polishing a mirror doesn't tell you *what* to look at.

  In *Methods* (Book I, Chapter 9), Sidgwick critiques the idea that "Right" is defined by what is "approved" (even by an ideal observer). He argues that approval is a sentiment, and sentiments vary. Even if we all agreed after 1,000 years of reflection, Sidgwick would ask: *"Is it right because we agree, or do we agree because it is right?"*
  *   If the former (CEV's implied stance), morality is contingent on human psychology.
  *   If the latter (Sidgwick's stance), you need the axioms to identify the truth, not just the reflection process.

  Sidgwick would argue CEV is stuck in the former. It makes ethics anthropocentric. The "Point of View of the Universe" for Sidgwick implies a view *independent* of human volition. CEV is still the "Point of View of Humanity, Optimized."

  ### 4. Where Sidgwick Might Nod (Grudgingly)
  It wouldn't be all rejection. Sidgwick was a pragmatist in political economy and deeply interested in the practical application of ethics.

  He would likely acknowledge that CEV is a brilliant **heuristic** for approximating the Axiom of Benevolence in a non-ideal world. He admits in Book IV that for practical purposes, we often have to rely on refined common sense because we can't calculate utility directly. He might view CEV as a sophisticated "rule-utilitarian" calculus for AI design.

  Furthermore, Sidgwick was a member of the Society for Psychical Research and desperately *wanted* to believe in the theistic resolution. If you presented CEV as a way to *empirically guarantee* the convergence that God was supposed to guarantee, he might be tempted. But his intellectual honesty (which is his defining trait) would force him to admit that CEV lacks the **normative force** of the Divine Moral Order. It solves the *coordination* problem, but not the *justification* problem.

  ### The Verdict for Your Seminar
  If Sidgwick were in the room, his conclusion would likely be this:

  > "CEV is a magnificent engine for satisfying desires, but it is silent on which desires *ought* to be satisfied. It attempts to derive the Ought from the Would. It assumes that if we think clearly enough, we will all become Utilitarians. I have found no evidence for this assumption other than the wishful thinking I sought to excise from ethics. Without the self-evident intuition that the good of one is no more important than the good of another, extrapolation is merely the amplification of bias. CEV does not dissolve the Dualism of Practical Reason; it merely gives the Egoist a faster computer."

  **Pedagogical Hook:**
  You can frame this for your students as the difference between **Ideal Observer Theory** (CEV) and **Rational Intuitionism** (Sidgwick).
  *   **Question:** Can procedural rationality generate substantive values?
  *   **Sidgwick's Answer:** No. You need a substantive starting point (the axioms).
  *   **CEV's Hope:** Yes, if the procedure is robust enough.

  This highlights Sidgwick's enduring relevance: he identified the gap between "what we would want" and "what is good" that AI alignment is still struggling to bridge. The student's intuition is right that the *move* is similar, but Sidgwick would insist the *grounding* is fundamentally different, and that difference is where the Dualism hides.
