      *   *Shaky Ground:* The Probability Measure (Normalizability), The Explanatory Principle (Improbability requires explanation), Independence of Constants.

  7.  **Final Review against constraints:** "Who's ahead at each step" - check. "Flag if both resting on something shakier" - check. No overall winner declaration - check.

