      *   *The Problem:* NT isn't just private irony. It's a clinical intervention with ethical standards (do no harm, increase agency). It's not *just* "make up a story that feels good." It has a normative goal (well-being). Rorty's private sphere is somewhat anarchic (as long as it doesn't hurt others). NT is guided by therapeutic theory.
