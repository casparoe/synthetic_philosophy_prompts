prompt: |-
  So in my causation seminar (its a small PHIL 400-level course, maybe 8 of us) we spent the last two weeks going back and forth between Lewis's counterfactual theory and the Woodward/Pearl interventionist "structural equations" stuff, and the thing that's bugging me is that our professor keeps using literally the same example for both — the Suzy-and-Billy rock throwing case, where Suzy's rock hits the bottle first and shatters it, and Billy's would've shattered it a second later if hers hadn't — and both theories spit out the exact same verdict, Suzy's throw is the cause, Billy's is a preempted almost-cause. Which makes me wonder if "interventionism" is a genuinely seperate theory of causation or just Lewis's counterfactual dependence wearing a directed-graph costume. Like, Lewis wants causation reduced all the way down to non-causal stuff (similarity between possible worlds, laws, particular matters of fact — the whole Humean supervenience project), whereas Woodward is pretty upfront that "intervention" is itself a causal notion, so his account was never supposed to be reductive in that way. I've got a term paper on this due in a few weeks so I'm trying to actually understand where the disagreement lives, not just memorize both views.

  Could you write me a dialogue between two people who actually hold these views — a hardcore Lewisian and a committed Woodwardian — hashing this out using the Suzy/Billy case as their shared example (feel free to bring in the trumping preemption case too, the major and the sergeant both shouting "advance," if it helps sharpen things)? I don't want a dialogue where they just each restate their own theory at each other — I want the Woodwardian to actually answer the circularity charge (that "intervention" is doing all the causal work, so nothing's really been explained), and I want the Lewisian to have to defend why his "quasi-dependence" patch for late preemption isn't just as ad hoc as the interventionist move of "freezing" the off-path variable at its actual value. Basically I want to come away knowing whether there's a real metaphysical disagreement here or if it's two formalisms in a trenchcoat. Doesn't have to be long, a page or so is fine.
