      *   *Deadline Pressure:* 3 weeks is tight for new data, but plenty of time for re-analysis/simulation.

  6.  **Drafting the Response:**

      *   **Empathy & Validation:** Acknowledge the stress. PhD collaborations are intense. The "who was right" scorekeeping is a natural human reaction but scientifically risky.
