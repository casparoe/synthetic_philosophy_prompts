  ***

  ### The Verdict: Is this resolvable?

  **No, this is not resolvable with the data you have.** You and your group are going in circles because you are trying to answer a causal question ("Does tutoring *cause* better grades?") with observational data that lacks temporal ordering.

  Your teacher's implication that there is always a "correct" side once you stratify is a **simplification common in AP Stats, but it is not universally true in statistics.** Stratification is only the "correct" fix if the lurking variable is a **confounder** (a common cause of both the treatment and the outcome). If the variable you stratify by is a **mediator** (caused by the treatment) or a **collider** (caused by both), stratifying can actually *create* bias or hide the true effect.

  In your specific case:
  *   **If Course Level is a Confounder:** (e.g., Smart kids take Honors and don't need tutoring; Struggling kids take Regular and do need tutoring). Then **Josh is right**. You must stratify to compare apples to apples. The pooled data is misleading because it compares struggling Regular students to naturally gifted Honors students.
  *   **If Course Level is a Mediator:** (e.g., Tutoring helps Regular students improve enough to move into Honors). Then **Amara is right** (partially). Stratifying hides the benefit of tutoring that comes from track advancement.

  **The Specific Extra Info Needed:**
  To settle this, you need **timing data**. Specifically:
  1.  **Date of Track Placement:** When was the student officially placed into Regular vs. Honors for this semester?
  2.  **Date of First Tutoring Session:** When did the student start tutoring?

  **How this settles it:**
  *   If the student was placed in Honors *before* they started tutoring, Course Level is a **Confounder** for that student. You should stratify.
  *   If the student started tutoring *before* being placed in Honors (and the tutoring helped them place up), Course Level is a **Mediator**. You should not stratify (if measuring total program effectiveness).

  **Recommendation for your Project:**
  Since you don't have that timing data, the most honest conclusion for your AP Stats project is to report **both** numbers but explicitly state the limitation. Write something like: *"When controlling for course level, tutoring is associated with lower grades, likely because struggling students self-select into tutoring (confounding). However, because we cannot determine if tutoring influenced course placement, we cannot rule out that the pooled positive association represents a total benefit of the program."* This shows your teacher you understand the paradox *and* the causal limitations.
