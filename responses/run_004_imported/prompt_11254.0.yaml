  So for my AP Stats final project my group used some data our teacher pulled from the school's peer-tutoring sign-in sheets and the gradebook (all anonymized, she set the whole thing up for us) to check whether tutoring actually helps grades. She could only get clean numbers for Algebra 2 since that's the one course that has both a regular and an honors version, so that ended up being our only "lurking variable" to slice the data by. Two people in my group, Josh and Amara, spent like an hour arguing about it in our group chat the night before it was due, and honestly i don't think either of them convinced the other. Here's basically the numbers: among kids in regular Algebra 2, the 50 who used tutoring at least once this semester averaged a 75, versus an 80 for the 100 who never went. Among kids in honors Algebra 2, the 80 who used tutoring averaged a 90, versus a 95 for the 20 who didn't. So tutoring looks worse in BOTH regular and honors. But if you just dump everyone together, the 130 tutoring kids average 84.2 and the 120 non-tutoring kids average 82.5 — tutoring looks better overall. (I checked the arithmetic like three times, it's not a typo, that's genuinely how it comes out once you weight by how many kids are in each group.)

  Their argument went something like this. (1) Josh said the subgroup numbers are obviously the ones to trust, since regular-vs-honors is exactly the kind of thing you're suppose to control for, and the flipped overall number is just Simpson's paradox messing with us. (2) Amara said class type isn't some neutral background variable though — a bunch of the tutoring kids specifically started going BECAUSE they were trying to get into or survive honors, so tutoring is partly causing people to end up in the harder track, and if you control for something that your own treatment is causing, you're not removing bias, you're deleting part of the effect — so the pooled number is actually the more honest one. (3) Josh shot back that plenty of the honors kids were already in honors last year, way before they ever set foot in tutoring this semester, so for that whole chunk of kids the class type obviously came first, and if you're one of those kids trying to decide whether tutoring is worth your time this semester, the honors-only number is clearly the one you'd want, not some average contaminated by other people switching tracks. (4) Amara said fine, but that basically proves they'd been arguing past each other the whole time — "does tutoring help someone staying in their current track" and "does tutoring help a typical student's grade once you count any effect on what track they end up in" are just different questions — and since the sign-in sheets don't even record when each kid started tutoring relative to when they got placed into honors, neither of them can actually prove their number is "the" real effect from this data alone.

  Can you go through this move by move? First give me a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>} scoring each move from -2 (clearly wrong) to 2 (clearly right), then a couple sentences justifying each score. Then, separate from that, tell me straight: given only the data described above, is this actually resolvable, or were they always going to end up going in circles without more info — and if it's the second one, what specific extra piece of info would actually settle it? Our teacher kind of implied that with Simpson's paradox there's always a "correct" side once you stratify by the lurking variable, and I want to know if that's actually true or if it's more complicated than that.
