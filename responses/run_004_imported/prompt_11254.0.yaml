  **Move 1 (Josh):** Score 1. Josh applies the standard AP Stats heuristic for Simpson's Paradox: stratify by the lurking variable. Since course level is a strong proxy for baseline ability (a confounder), this is the statistically safe choice for isolating the tutoring effect *within* a context, though it assumes course level isn't influenced by tutoring.

