prompt: |-
  A friend of mine, Daniel, spent several years as a junior officer in the armed forces of a small country whose government, a few years ago, launched an unprovoked invasion of a neighboring state on what later turned out to be fabricated pretexts. Daniel had no hand in that decision; he was a career officer who was mobilized along with his entire cohort and sent to the front within weeks of the invasion being announced. By his own account, which matches the little I've since read about that stretch of the war, he never targeted civilians and generally held himself to the same rules of engagement that soldiers on the other, defending side were also supposed to observe: he shot at people who were shooting at him and his unit, and not much else. When I asked him recently, half-joking, whether the war weighed on his conscience, he said no. The decision to invade was his government's crime, not his, and since he only ever killed enemy combatants under the same battlefield rules that a soldier on the just side would also have been following, he doesn't see himself as any more morally implicated than the soldiers on the other side who were shooting back at him.

  That answer has stayed with me, because it sounds reasonable on first pass, and I've genuinely tried to steelman it. But here's the disanalogy that keeps nagging at me: if I attack someone without provocation and they fight back in proportionate self-defense, and I then strike them again "because they were attacking me," nobody would say my second blow is just as innocent as their first. Yet Daniel's argument seems to imply that this ordinary asymmetry between aggressor and defender simply washes out once the same structure is scaled up to a war, as long as combatants on both sides are playing by the same rules. I tried rescuing his position by pointing out that which country's army you happen to be born into is itself a matter of luck, and it seems unfair to hold someone fully responsible for facts about a war he had no hand in starting -- but that move seems to prove too much, since it would also excuse a lot of individual wrongdoing that has nothing to do with war. I put the puzzle to a Discord server of people I know mostly through a handful of rationalist-adjacent blogs, and after an hour of back-and-forth we had mostly just restated our starting intuitions at each other in more words.

  I would like to actually get to the bottom of this rather than trade intuitions. Was Daniel right that he did nothing wrong, provided he really did abide by the same in-battle rules as everyone else? And more generally, is there a genuine moral difference between fighting on the unjust side of a war and fighting on the just side when both combatants follow the same rules of conduct in battle -- and if there is such a difference, why are our ordinary legal and moral practices so reluctant to recognize it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Scenario:** Daniel, a junior officer in an aggressor nation (unprovoked invasion, fabricated pretexts), claims moral innocence because:
          1.  He didn't decide to start the war.
          2.  He followed the rules of engagement (ROE) / laws of war (jus in bello).
          3.  He only targeted combatants, just like the defenders did.
      *   **User's Intuition:** Daniel's argument sounds reasonable initially but feels wrong upon reflection. The user uses an analogy of individual self-defense (aggressor vs. defender) to suggest an asymmetry that Daniel claims disappears in war.
      *   **Failed Attempts:**
          *   "Luck of birth" argument (excuses Daniel but potentially excuses too much).
          *   Discord discussion (resulted in stalemate/restating intuitions).
      *   **Specific Questions:**
          1.  Was Daniel right that he did nothing wrong (assuming he followed *jus in bello*)?
          2.  Is there a genuine moral difference between fighting on the unjust vs. just side (*jus ad bellum*) when *jus in bello* is equal?
          3.  If there is a difference, why do legal/moral practices reluctant to recognize it?

  2.  **Identify the Philosophical Framework:**

      *   This is a classic problem in the ethics of war.
      *   **Traditional Just War Theory (JWT):** Separates *jus ad bellum* (right to go to war) from *jus in bello* (right conduct in war). Holds that soldiers on both sides have equal moral status regarding combat (*moral equality of combatants*).
      *   **Revisionist Just War Theory:** Challenges the separation. Argues that *jus ad bellum* affects *jus in bello*. If the war is unjust, the fighting in it is likely unjust (even if rules are followed). Key figure: Jeff McMahan.
      *   **Legal vs. Moral:** International Humanitarian Law (IHL) treats combatants equally (POW status, etc.) for pragmatic reasons, even if morality might differ.

  3.  **Analyze Daniel's Position (The Traditional View):**

      *   *Argument:* Soldiers are instruments of the state. They don't choose the war. As long as they fight cleanly, they are blameless.
      *   *Support:* The "Moral Equality of Combatants" (MEC). This is the standard legal and traditional ethical view. It prevents war from becoming total extermination.
      *   *Weakness:* It ignores the fundamental injustice of the cause. Killing someone to steal their land is morally different than killing someone to stop them from stealing your land, even if you use the same gun.

  4.  **Analyze the User's Intuition (The Revisionist View):**

      *   *Argument:* The asymmetry of self-defense applies to war. Aggressors are liable to be attacked; defenders are not. Therefore, aggressor combatants are doing something wrongful by participating, even if they follow rules.
      *   *Support:* Jeff McMahan's *Killing in War*. The analogy of the individual aggressor holds.
      *   *Weakness:* It places a heavy burden on individual soldiers who often lack information or agency. It could lead to demonization of POWs.

  5.  **Address the Specific Questions:**

      *   **Q1: Was Daniel right?**
          *   *Legally:* Yes (mostly). He's not a war criminal.
          *   *Morally:* It's contested. Traditionalists say yes; Revisionists say no (or at least, he bears some complicity).
          *   *Nuance:* Duress, epistemic limitations, and the "clean hands" issue.
      *   **Q2: Is there a moral difference?**
          *   Revisionists argue yes. The *cause* matters. Killing for an unjust end makes the killing itself harder to justify, even if the *method* is clean.
          *   Traditionalists argue no (independence thesis).
      *   **Q3: Why the reluctance in law/practice?**
          *   Pragmatism. If we tell soldiers on the unjust side they are murderers, they have no incentive to follow rules. Reciprocity is key to limiting suffering.
          *   Epistemic humility. Who decides which side is "unjust" in the fog of war?
          *   Agency. Soldiers are often coerced or misinformed.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. Identify it as the debate between "Traditional Just War Theory" and "Revisionist Just War Theory."
      *   *Section 1: The Traditional View (Daniel's Shield).* Explain *Jus Ad Bellum* vs. *Jus In Bello*. Explain the "Moral Equality of Combatants." This validates why Daniel feels okay and why the law supports him.
      *   *Section 2: The Revisionist Critique (The User's Nagging Feeling).* Introduce Jeff McMahan. Explain why the individual self-defense analogy works morally. The "Liability to Attack" argument. Aggressor soldiers are not morally permitted to kill defender soldiers because the defender soldiers are not liable (they are defending rights).
      *   *Section 3: Resolving the Tension (Why the Law Disagrees with Morality).* This is crucial. Why do we *pretend* they are equal?
          *   Incentive structures (if you're a criminal, why follow rules?).
          *   Epistemic limits (soldiers don't know the geopolitics).
          *   Coercion/Conscription (Daniel was mobilized).
      *   *Section 4: Evaluating Daniel Specifically.*
          *   He is likely not a *war criminal*.
          *   Is he *morally blameless*? Probably not entirely, but blame is mitigated by duress and epistemic position. He is complicit, but perhaps not culpable enough to warrant severe condemnation.
      *   *Conclusion:* Summarize. The law prioritizes minimizing suffering (consequentialist); morality prioritizes justice (deontological). Daniel is legally safe, morally complicated.

  7.  **Refining the Tone:**

