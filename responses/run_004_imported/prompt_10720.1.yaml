      *   *Check:* Is the distinction between *jus ad bellum* and *jus in bello* clear? *Correction:* Define terms early.

  9.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers the user's specific questions. (Proceed to generate output based on this structure.)

      *(Self-Correction on "Daniel's specific case"):* I need to be careful not to condemn Daniel too harshly. Revisionist theory says he acts wrongly, but *culpability* is different from *wrongness*. He might be acting objectively wrongly but be subjectively blameless due to ignorance or coercion. This is a key distinction to make for the user's peace of mind regarding their friend.

  10. **Final Plan:**
