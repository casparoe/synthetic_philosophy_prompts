      *   *The Proof:* Assume there is an unknown truth $p$. Consider the proposition $q = p \land \neg Kp$. If $q$ is true, it is knowable (by assumption). So $\Diamond K(p \land \neg Kp)$. But knowing a conjunction implies knowing the conjuncts. So $\Diamond (Kp \land K\neg Kp)$. By factivity ($K\phi \to \phi$), $K\neg Kp \to \neg Kp$. So we have $\Diamond (Kp \land \neg Kp)$, a contradiction. Therefore, there are no unknown truths.
      *   *The Modal Operator:* The operator is usually $\Diamond$ (possibility) and $K$ (knowledge).
      *   *Time:* Standard epistemic logic (S4 or S5 based) is typically tenseless. $Kp$ means "it is known that p" (at some context or timelessly). $\Diamond Kp$ means "it is possible that it is known that p".

