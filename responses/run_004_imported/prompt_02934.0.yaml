answer: |-
  This is an excellent catch, and it is exactly the kind of close textual engagement that will strengthen your dissertation. You have identified a genuine tension between Fitch's methodological stipulation (no tense logic) and his natural language explication (heavy tense usage).

  Here is the breakdown of what is going on, why Fitch writes it that way, and whether that temporal phrasing is doing logical "heavy lifting" or just rhetorical work.

  ### 1. The Formal Core is Tenseless
  You are correct that the **formal proof** (pp. 137–138) relies entirely on epistemic modal logic, not temporal logic.
  *   **The Operators:** Fitch uses $K$ (it is known that) and $\Diamond$ (it is possible that). He does *not* use Prior-style tense operators like $P$ (it was the case that) or $F$ (it will be the case that).
  *   **The Propositions:** Fitch treats propositions as the bearers of truth values. In the formalism, a proposition $p$ is simply true or false. The logic assumes a static model where the contradiction arises from the *structure* of knowledge (specifically factivity $Kp \to p$ and distribution $K(p \land q) \to Kp \land Kq$), not from the passage of time.
  *   **The Disclaimer (p. 135):** When Fitch says he is ignoring the element of time, he is signaling that he is not building a **temporal logic**. He is avoiding the complexities of how truth values might change over time (e.g., "It is raining" is true now, false later). He wants to analyze the concepts of "value" and "knowability" as logical relations between propositions, not as events in time.

  ### 2. The English Gloss (p. 139) is Explicatory, Not Premissory
  The sentence you flagged on p. 139 ("...nobody knows (or has known, or will know)...") is a **metalanguage translation** of the modal operator $\Diamond$, not a new premise in the object language.

  Here is the translation key Fitch is using:
  *   **Formal:** $\neg \Diamond Kp$ ("It is not possible that $p$ is known")
  *   **English:** "Nobody knows, has known, or will know $p$."

  In natural language, when we speak of something being "knowable" or "possible to know," we implicitly quantify over agents and **times**. To say "It is possible for this truth to be known" is pragmatically equivalent to "There is some possible world where some agent at some time knows this."

  Fitch includes the parenthetical "(or has known, or will know)" to ensure the reader understands the **strength** of the modal claim he has just proven. He is emphasizing that the impossibility is not just a matter of current ignorance (epistemic contingency); it is a necessary impossibility.

  ### 3. Is the Temporal Quantification Doing "Indispensable Work"?
  **No.** This is the crucial point for your chapter.

  If the temporal quantifiers were doing the logical work, the proof would require premises about the nature of time (e.g., "Time is linear," or "The future is open"). Fitch's proof requires none of that.

  *   **The Engine of the Paradox:** The collapse from "All truths are knowable" to "All truths are known" is driven by the interaction between **Knowledge** and **Possibility** ($\Diamond$), specifically the fact that knowing a conjunction entails knowing the conjuncts, combined with the factivity of knowledge.
  *   **The Role of Time:** The temporal language is merely **illustrative of the modal scope**.
      *   If you removed the words "has known, or will know" and just said "Nobody can know," the formal proof remains identical.
      *   If you removed the modal $\Diamond$ and kept only the temporal quantifiers (i.e., "Nobody at any time *actually* knows"), the paradox disappears entirely.

  Therefore, the temporal phrasing is **loose, informal phrasing** intended to map the abstract modal result onto human intuition. It is not a hidden premise that contradicts his p. 135 disclaimer. He is not using time to prove the result; he is using time to *explain* the result.

  ### 4. Why This Matters for Your Anti-Realism Chapter
  This distinction is vital for your dissertation because much of the subsequent literature on the Knowability Paradox (e.g., Kvanvig, Williamson, Edgington) turns on exactly this ambiguity.

  *   **The Anti-Realist Commitment:** Anti-realists (like Dummett) usually formulate the knowability principle as: "If $p$ is true, there is *possible* verification."
  *   **The Temporal Trap:** Critics often argue that anti-realists mean "verifiable *at some time*" (temporal), whereas Fitch's proof treats "possible" as "metaphysically/logically possible" (tenseless).
  *   **Your Argument:** You can use your reading of Fitch to argue that **Fitch himself recognizes this gap.** By explicitly banning time from the formalism but reintroducing it in the gloss, Fitch shows that the paradox holds even in a tenseless framework.
      *   This strengthens the paradox against the objection that "We just haven't verified it *yet*."
      *   Fitch's p. 135 disclaimer pre-emptively blocks the move to say, "The paradox only works because you ignored that truth changes over time." He is saying, "Even if we treat propositions as timeless, the contradiction holds."

  ### 5. Summary for Your Draft
  You can frame it like this:

  > "While Fitch explicitly brackets temporal logic in his formal apparatus (p. 135), his natural language summary invokes temporal quantification (p. 139). However, this should not be read as a retraction of his tenseless methodology. Rather, the temporal phrasing serves as a pragmatic explication of the modal operator $\Diamond$. The logical 'work' of the theorem is performed entirely by the interaction of epistemic and alethic modalities ($K$ and $\Diamond$), not by quantification over times. The temporal gloss merely underscores that the resulting impossibility is not contingent upon the present moment but applies to the proposition's knowability *simpliciter*."

  **One Caveat to Watch:**
  While Fitch's *text* supports the "loose phrasing" reading, later philosophers (most notably **Joseph Melia** and **Jonathan Kvanvig**) have argued that the paradox *does* rely on an equivocation between timeless possibility and temporal possibility. For your diss, you should acknowledge that while Fitch *intended* the tenseless reading, the *effectiveness* of the paradox against anti-realism often depends on whether the anti-realist accepts that tenseless "knowability" is the correct formalization of their view.

  But regarding your specific textual question: **You are safe.** Fitch is not smuggling time in as a premise; he is using it to translate the modal conclusion. The tension is rhetorical, not logical.
