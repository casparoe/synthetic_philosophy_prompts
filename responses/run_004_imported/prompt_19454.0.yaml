          *   *Propositionalist:* Believes conditionals express truth-conditional propositions (Stalnaker/van Fraassen style). Must argue that the Equation isn't resilient/survives conditionalization poorly, or requires pragmatic explanation.
          *   *NTV Theorist:* Believes conditionals lack truth values (Adams/Edgington style). Must argue the Equation is about assertability, not truth, but faces the Frege-Geach problem (embedding, negation, etc.).
      *   **Setting:** Right after a reading group discussed Lewis's 1976 proof.
