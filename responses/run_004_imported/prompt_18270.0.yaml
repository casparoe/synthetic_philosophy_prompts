  1.  **Analyze the User and the Query:**
      *   **User Background:** Retired bench neuroscientist. This means they have deep technical knowledge of neuroscience (neurons, electrodes, feedback loops, etc.) but are new to philosophy ("catching up on philosophy for the first time").
      *   **Tone:** Intellectual, curious, slightly provocative (challenging the philosophical status quo based on empirical progress).
