      *   **Carnap's View on Ethics:** Ethical statements are not cognitive; they are expressions of attitude or commands. They cannot be true or false in a scientific sense.
      *   **The Vienna Circle's Politics:** Many members (Neurath, Carnap) were left-leaning/socialist. The 1929 manifesto (*The Scientific Conception of the World*) links their philosophy to social reform.
      *   **The Tension:** If ethical/political goals (like "equality," "justice," "social welfare") are cognitively meaningless, how can one justify a *scientific* program dedicated to achieving them without implicitly treating them as objective truths? If planning is "scientific," does that imply the *goals* of planning are scientifically derivable?

  3.  **Formulate the Argument (The "Thesis"):**
      *   Carnap's verificationism creates a dichotomy: Fact (meaningful) vs. Value (meaningless/non-cognitive).
      *   Scientific planning requires ends (values) and means (facts).
      *   Carnap tries to say science handles means, democracy/will handles ends.
