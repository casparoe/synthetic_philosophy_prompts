      *   **Point 2: The Illusion of Neutral Means:** Carnap argues science optimizes means to given ends. But "planning" isn't just a tool like a hammer. Centralized planning implies a specific view of social organization (top-down, rationalist) that privileges certain values (order, efficiency, collective over individual) which are not empirically verifiable as "superior."
      *   **Point 3: The Metaphysics of "Rationality":** To claim socialism is "scientific" implies history or society has a telos (direction) that can be known. This is Hegelian/Marxist metaphysics, which violates verificationism. It treats social laws like laws of physics.
      *   **Point 4: The 1929 Manifesto as Evidence:** Look at the language. It links the scientific worldview to the "modern strata of humanity." This is a sociological claim that functions as a normative endorsement. It says "This worldview *ought* to prevail because it aligns with progress." "Progress" is a value, not a fact.
      *   **Point 5: The Bayesian/Engineering Angle (Tailoring to User):** As a software engineer, think about optimization functions. You can't optimize a system without a loss function. Carnap rejects the objective status of the loss function (ethics) but insists on a specific architecture (socialism) as if the architecture itself is derived from the code of reality.
      *   **Conclusion:** Summarize. The Vienna Circle didn't escape metaphysics; they just hid their normative commitments behind the authority of "science."

  5.  **Refining the Argument (Self-Correction/Nuance):**
