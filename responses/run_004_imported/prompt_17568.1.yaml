      *   *Refinement:* The key distinction is *how* the correlation arises. In Email Game, it arises *endogenously* through the exchange. In Global Games, it arises *exogenously* from the signal distribution. The Email Game asks: "Can communication generate CK?" The answer is No. Global Games ask: "If signals are highly correlated, do agents coordinate?" The answer is Yes. These are different questions. The user's prompt asks to defend the Email Game's lesson about *communication* and *finite mutual knowledge*.
