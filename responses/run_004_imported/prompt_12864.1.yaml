      *   *The Peer Condition:* In a *genuine* peer disagreement, by definition, you have already accounted for track record/competence. If I know you are my peer, I have already judged your track record to be roughly equal to mine *on this type of problem*.
      *   *The "Bootstrapping" Problem:* If I use my own reasoning to determine that I am right and you are wrong, I am begging the question. I can't use the very reasoning under dispute to dismiss your counter-reasoning.
