answer: |-
  This is a sharp reading of *Inadequate Equilibria*. You are correct that Yudkowsky's critique of "modest epistemology" is primarily aimed at *asymmetric* information/competence scenarios (the layman deferring to the physicist, or the outsider deferring to the entrenched institution). His argument rests on the idea that agents often possess private evidence (their own reasoning process, their specific track record) that they illegitimately discount in favor of a public aggregate.

  However, you are asking for the defense of Conciliationism (specifically the Equal Weight View) in *symmetric* peer disagreements, and how it handles the self-referential paradox. To do this without rehashing standard "wisdom of crowds" arguments, we need to drill down into the **Independence Principle** and the **structure of higher-order evidence**.

  Here is the strongest argument for why Conciliationism survives Yudkowsky's objection in genuine peer cases, and how it avoids self-undermining.

  ### 1. The Track Record Objection vs. The Independence Principle

  Yudkowsky's core move is: *If you have reason to believe your cognitive machinery is functioning better than the consensus in this instance, you are licensed to maintain your belief.* In the restaurant bill case (Christensen's example), Yudkowsky might say: "If I am confident I did the math right, and I know I am generally good at math, why should I split the difference with you?"

  The Conciliationist response relies on the **Independence Principle** (articulated by Elga and Christensen). To resolve a disagreement, you cannot rely on the reasoning *that is currently under dispute* to evaluate the disputant.

  **The Bootstrapping Problem**
  In a genuine peer disagreement, "peer" is defined antecedently. It means that *before* you worked out the specific problem (the bill, the logic puzzle), you judged the other person to be equally likely to get the right answer as you. You have equal track records, equal access to evidence, and equal cognitive capacity.

  When you discover you disagree, you face a dilemma:
  1.  **Steadfast (Yudkowsky-style):** "I see that the answer is $50. You say $45. Since I see the answer is $50, I must have calculated correctly and you must have erred. Therefore, I stick with $50."
  2.  **Conciliationist:** "I see $50. You see $45. Since we are peers, the fact that you see $45 is evidence that my calculation process might have glitched, even if it *seems* correct to me."

  The Steadfast move is question-begging. It uses the *output* of your reasoning (the belief that the total is $50) to validate the *reliability* of your reasoning process in the face of a counter-signal. But the reliability of that process is exactly what the disagreement calls into question.

  If you say, "But I have a good track record," the peer replies, "So do I." If you say, "But I feel confident," the peer replies, "So do I." In the absence of an *independent* check (like a calculator, or a third peer), you cannot use your own reasoning to dismiss the peer's reasoning without assuming what you are trying to prove (that your reasoning is the one that worked this time).

  **Why Yudkowsky's Move Fails Here**
  Yudkowsky's advice works when there is an **asymmetry of access**. If you are a physicist and the consensus is laymen, you have access to technical derivations they do not. You have independent evidence of your reliability *on this specific topic*.

  In the restaurant case, there is no asymmetry of access. The only "private evidence" you have is the phenomenological feeling of correctness. But phenomenological confidence is not truth-tracking in a way that is invisible to peers. If confidence were a reliable tie-breaker, the peer would also be confident. Therefore, the disagreement itself becomes **higher-order evidence**. It is evidence about the reliability of your first-order evidence.

  Conciliationism survives because it recognizes that in symmetric cases, the *fact of disagreement* screens off the *content of the reasoning*. You cannot get "outside" your own head to verify your head is working without begging the question. The only non-circular move is to acknowledge that the probability of "I am the one who made a mistake" is roughly 0.5.

  ### 2. The Self-Undermining Objection

  This is the harder philosophical hurdle. The objection runs:
  1.  Conciliationism (C) says: "If epistemic peers disagree, reduce confidence."
  2.  There are epistemic peers who disagree about C (Steadfasters vs. Conciliationists).
  3.  Therefore, by C's own lights, you should reduce confidence in C.
  4.  If you reduce confidence in C sufficiently, you should stop acting like a Conciliationist.
  5.  Therefore, C is self-defeating.

  Standard LW-style responses often try to exempt epistemic norms from the norm ("This rule applies to object-level beliefs, not meta-level norms"). This is generally regarded as ad hoc and unsatisfying. The strongest defense comes from **Christensen's "Epistemic Modesty"** and the distinction between **abandoning a norm** and **lowering credence in a norm**.

  **Argument A: Probabilistic Adherence**
  Conciliationism does not require 100% certainty in Conciliationism. It requires you to weight your actions by your credence in the correct epistemic norm.

  Suppose you start with 0.9 credence in Conciliationism. You encounter a Steadfaster peer (an epistemologist). By the lights of Conciliationism, you should lower your credence. Let's say it drops to 0.6.
  Does this mean you should act like a Steadfaster? No. It means you should act like someone who thinks there is a 60% chance Conciliationism is right and a 40% chance Steadfastness is right.
  Since Conciliationism prescribes splitting the difference, and Steadfastness prescribes sticking to your guns, your "weighted" action is to move *mostly* toward the peer, but not all the way.

  This avoids self-defeat. You are still following the directive of Conciliationism (process disagreement as evidence), even regarding the disagreement about Conciliationism itself. You end up with a stable state of **Modest Conciliationism**: "I am fairly confident we should conciliate, but the existence of smart Steadfasters means I shouldn't be dogmatic about it."

  **Argument B: The "No Self-Defeat" Theorem**
  If Conciliationism were truly self-undermining, it would imply that accepting it forces you to reject it entirely. But as shown above, it only forces you to lower confidence.
  Consider the alternative: Steadfastness. If you are a Steadfaster, and you meet a Conciliationist peer, Steadfastness says "Ignore them." But if there is a 50% chance Conciliationism is true, ignoring them is the *wrong* move half the time.
  Steadfastness is arguably *more* vulnerable to the disagreement objection. If Steadfastness is true, you should ignore the disagreement. But the existence of the disagreement is evidence that Steadfastness might be false (since smart people reject it). If you ignore that evidence, you are violating total evidence norms.

  Conciliationism is the only view that *incorporates* the evidence of the disagreement about itself into its own justification. It absorbs the hit. It says, "Yes, I am disputed. Therefore, I am less certain. But I am still the best guide for how to process this dispute."

  **Argument C: Domain Restriction (The Nuanced Version)**
  A more technical defense (championed by some formal epistemologists) suggests that the "peer" condition is never perfectly met regarding fundamental epistemic norms.
  To be a peer on the question "Is Conciliationism true?", we would need to share all evidence and have equal competence. But our "evidence" includes our own intuitive grasp of rationality.
  If I find Conciliationism intuitively compelling and you find it repugnant, we may not be peers on *this specific question* because our "cognitive equipment" for evaluating norms is the very thing diverging.
  However, this is a risky move. The stronger move remains Argument A: **Apply the norm to itself probabilistically.**

  ### 3. Synthesizing Against Yudkowsky

  Yudkowsky's critique in *Inadequate Equilibria* is a critique of **unearned deference**. He targets people who defer to consensus *despite* having asymmetric information or superior track records that they are ignoring due to social anxiety or false modesty.

  Conciliationism is a critique of **unearned confidence**. It targets people who assume their reasoning is transparent and infallible *despite* receiving a signal (disagreement) that suggests a glitch in the machinery.

  These two views are not contradictory; they apply to different regions of the epistemic landscape.
  *   **Yudkowsky's Zone:** Asymmetric competence/information. (e.g., "I have checked the data, the consensus hasn't.") -> **Stick to your guns.**
  *   **Conciliationist Zone:** Symmetric competence/information. (e.g., "We both looked at the same bill, we are both good at math.") -> **Split the difference.**

  The error occurs when you try to use Yudkowsky's heuristic in the Conciliationist zone. If I tell myself, "I am smart, I have a good track record, so I will ignore my friend who says I calculated the tip wrong," I am violating the Independence Principle. I am using my general track record to override specific higher-order evidence (the disagreement).

  **The Strongest Version of the Conciliationist Argument:**
  Rationality requires responding to **all** available evidence. In a peer disagreement, the peer's belief is evidence.
  *   Yudkowsky argues that *your own reasoning* is evidence that outweighs the peer.
  *   Conciliationism argues that in symmetric cases, you cannot count your own reasoning as *independent* evidence because it is the source of the conflict.

  Therefore, Conciliationism survives because it respects the **symmetry of the situation** better than the Steadfast view. To stick to your guns in a symmetric case is to implicitly claim a symmetry-breaking advantage (e.g., "My intuition is better than yours") without evidence for that advantage other than the intuition itself. That is circular.

  ### Conclusion

  Conciliationism survives Yudkowsky's "track record" objection because in genuine peer cases, track records are ex hypothesi equal. To appeal to your track record is to beg the question against a peer with an equal track record.

  It survives the self-undermining objection not by exempting itself, but by **eating its own dogfood**. It treats disagreement about epistemology as evidence, lowers its own confidence, and recommends acting according to that lowered confidence. This results in a stable, probabilistic adherence to conciliation, rather than a paradoxical abandonment of it.

  The view isn't "Always defer." It is "Defer proportionally to the symmetry of evidence and competence." Yudkowsky correctly identifies when symmetry is broken; Conciliationism correctly identifies how to act when it holds.
