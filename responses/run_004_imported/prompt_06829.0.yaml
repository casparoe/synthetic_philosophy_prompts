prompt: |-
  So I went down a rabbit hole reading about Aumann's agreement theorem and the "common prior assumption" on a rationalist blog. From what I can tell it basically proves that two rational Bayesians literally can't agree to disagree — if you're both truly rational you're mathematically forced to end up at the same belief eventually. But in real life I've got smart, reasonable coworkers who argue about stuff like AI timelines for hours and just never converge, even though neither of them seems dumb or dishonest. Doesn't that mean at least one of them has to secretly be irrational? Or is theres some flaw in how people apply the theorem to actual arguments? Trying to figure out if "agreeing to disagree" is basically always a sign that someone involved isn't thinking straight.
