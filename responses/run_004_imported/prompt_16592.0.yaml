answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the privilege of being in [Bride's Name]'s PhD cohort. We're both in philosophy, though I spend my time worrying about words, and she spends her time worrying about… well, *us*. Specifically, what makes us, *us*.

  Now, I know why I'm standing here. Everyone in this room knows the story. It is departmental legend. [Bride] and [Groom] met at a happy hour, several drinks in, engaged in a heated debate about Derek Parfit's Teletransporter case. For the family: the thought experiment asks if you step into a machine on Earth that scans you, disintegrates you, and rebuilds you on Mars… is the person on Mars *you*? Or just a really convincing copy?

  [Bride] has told this story at every dinner party since. And usually, this is the part where I make the easy joke. You know the one: "Well, don't worry, no one is getting disintegrated at *this* ceremony," or "I promise the officiant is licensed in two planets."

  But I didn't want to do that. Because while they met arguing about the mechanics of the Teletransporter, what actually brought them together—and what brings us all here today—is the conclusion Parfit eventually reached about what that story *means* for how we live.

  In his book *Reasons and Persons*, Parfit argues that personal identity isn't actually what matters in survival. He suggests that worrying about whether the future person is strictly "me" is the wrong question. What matters is psychological connectedness. It's about memories, intentions, character, and love flowing from one moment to the next.

  He wrote that for a long time, he viewed his life as if he were looking out from inside a glass tunnel. He saw the world from a distance, isolated in his own self, rushing toward darkness at the end. He said that when he accepted this view—that the boundaries between selves are less rigid than we think—the glass tunnel broke. He wrote, "I seemed to see the world more clearly… I became less concerned about my own death, and more concerned about the lives of others."

  I think about that a lot when I think about marriage.

  We say vows "till death do us part." But if you know anything about philosophy, or biology, or just being alive, you know that the person standing here in June is not numerically identical to the person you will be at 70. Your cells replace themselves. Your neurons rewire. Your beliefs shift. The [Groom] of 2050 will have memories the [Groom] of today can't imagine.

  In a strict sense, you are marrying a stranger who doesn't exist yet.

  But Parfit teaches us that strict identity isn't the point. The point is the connection. A marriage vow isn't a contract between two statues. It is a promise to maintain the psychological connectedness between two changing people. It is a commitment to ensure that the love and intentions you hold today are the ones that get transmitted to Mars, year after year, even as the hardware changes.

  When you stop worrying about preserving a static "self," and start worrying about maintaining the connection between "us," you break out of your own glass tunnel. You stop asking, "What do I get out of this?" and start asking, "How do we keep this continuity alive?"

  [Bride] and [Groom], you met arguing about whether a copy is real. But tonight, you're proving that the connection is what makes it real. You are choosing to weave your psychological lives together so tightly that the distinction between "my future" and "our future" stops making sense.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your glass tunnels be broken. May your psychological connectedness be strong. And may you find that what matters most isn't who you were when you met, but who you become together.

  To the happy couple.
