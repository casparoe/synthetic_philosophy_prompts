prompt: |-
  So my friend from my PhD cohort (we're both in philosophy — she does personal identity/bioethics stuff, I do phil of language) is getting married in a few weeks and asked me to give the toast at the reception. Backstory that literally everyone coming to this wedding already knows: she and her now-fiancé got together after a very drunk argument at a department happy hour about Parfit's teletransporter case, specifically whether the guy who steps out on Mars is "you" or just a really good copy of you, and shes told the story at basically every dinner party since, so I can't NOT reference it in the toast.

  Here's my actual problem though. I don't want to just do the easy joke (something like "well at least no one's getting disintegrated at THIS ceremony") and move on, that feels cheap. What I actually think is interesting is Parfit's mature position — that personal identity isn't what matters in survival, and that really seeing this is supposed to loosen your grip on pure self-interest — and I think that has something real to say about what two people are doing when they promise to stick together "till death do us part," especially given that the person she's marrying in June is not going to be very psychologically continuous with whoever he is at 70. I also vaguely remember Parfit writing somewhere near the end of Reasons and Persons about how holding this view made him feel like he'd broken out of a glass tunnel he used to feel stuck in, less afraid of dying, more invested in people who aren't him — I might be mangling the exact image but that's the gist. I want the toast to actually use that to say something true about commitment, not just show off that I did the reading.

  Can you draft me something like a 4-5 minute toast built around this? About half the room is our department and will absolutely clock it if I flatten or misuse the argument, and the other half is family who just want to laugh, maybe tear up a little, and get to the open bar. It needs to be warm before its clever, if that makes sense.
