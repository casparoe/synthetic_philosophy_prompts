answer: |-
  This is an excellent objection, and you are in good company. This is often called the **"collapse objection"** or the **"sharping objection,"** and it is one of the central debates in formal epistemology. Critics like Alan Hájek and David Christensen have pressed versions of this argument.

  However, defenders of imprecise probabilities (like Isaac Levi, James Joyce, and Roger White) argue that the interval does distinct philosophical work that a single number cannot. Here is how you can respond to your club, broken down into three main arguments: the epistemological distinction, the decision-theoretic distinction, and the problem of spurious precision.

  ### 1. The Epistemological Distinction: Risk vs. Ambiguity
  Your objection assumes that an interval $[0.3, 0.7]$ contains the same information as a precise $0.5$. Proponents of IP argue they represent fundamentally different evidential states.

  *   **The Fair Coin (Precise 0.5):** You have positive evidence that the coin is fair. You know the propensity is 0.5. You should be willing to bet on heads at 1:1 odds.
  *   **The Unknown Coin (Imprecise [0.3, 0.7]):** You have *no* evidence about the bias. It could be 0.3, it could be 0.7. You do *not* know it is 0.5.

  If you assign a precise 0.5 to the unknown coin, you are claiming your evidence supports "heads" exactly as much as "tails." But in the unknown coin case, your evidence doesn't support *either* specific claim; it supports a **range of possibilities**.

  **The Philosophical Work:** The interval preserves the distinction between **risk** (known probabilities) and **ambiguity** (unknown probabilities). Collapsing the interval to 0.5 erases the fact that you are ignorant. It treats "I know it's balanced" the same as "I have no clue."

  ### 2. The Decision-Theoretic Distinction: Not All Rules Average
  You argued that "any sensible decision rule just averages over the interval." This is the crux of the pragmatic objection. However, IP theorists argue that averaging is actually *insensible* when evidence is scarce.

  If you have a precise credence of 0.5, standard Expected Utility Theory says you should be indifferent between a bet that pays \$10 if Heads and a bet that pays \$10 if Tails.

  If you have imprecise credence $[0.3, 0.7]$, many IP decision rules say you should **suspend judgment**.
  *   **Maximin Rule:** You evaluate the bet based on the worst-case probability in your interval. For a bet on Heads, the worst case is 0.3. For a bet on Tails, the worst case is 0.3 (since $1 - 0.7 = 0.3$). You might reject *both* bets because the lower bound is too low, whereas a precise 0.5 agent would accept them.
  *   **E-Admissibility:** An option is permissible only if it maximizes expected utility for *at least one* probability function in your set.

  **The Philosophical Work:** The imprecision changes your **choice behavior**. A precise agent is forced to have a specific betting disposition (e.g., willing to bet at 1:1). An imprecise agent is rationally permitted to say, "The odds aren't good enough for me to commit, given how little I know." The interval prevents the agent from being "money-pumped" into making bets that their evidence doesn't justify.

  ### 3. The Problem of Spurious Precision
  This is perhaps the strongest philosophical argument. Bayesianism requires that for *any* proposition $P$, you must have a precise credence $C(P)$.

  Imagine I ask you: "What is the precise probability that there is intelligent life on a planet orbiting Proxima Centauri?"
  *   **Precise View:** You must pick a number, say $0.00042$.
  *   **Imprecise View:** You can say $[0.00001, 0.1]$.

  If you pick $0.00042$, you are claiming your evidence is specific enough to distinguish that value from $0.00041$ or $0.00043$. But clearly, our evidence is not that fine-grained. Assigning a sharp number creates **spurious precision**. It pretends we have more knowledge than we do.

  **The Philosophical Work:** IP offers a more honest norm of rationality. It allows an agent to represent the **weight of evidence** (how much evidence there is) separately from the **balance of evidence** (what the evidence points to). A precise probability conflates these two.

  ### A Counter-Example to "Collapse": Dilation
  There is a mathematical phenomenon called **dilation** that proves imprecise probabilities don't always behave like precise ones.

  In certain IP models, learning new evidence can actually *widen* your interval, even if the evidence is relevant.
  *   Before evidence: Credence in $P$ is $[0.4, 0.6]$.
  *   After learning $E$: Credence in $P$ given $E$ becomes $[0.2, 0.8]$.

  In standard precise probability, conditioning on evidence usually sharpens your view (narrows the variance). In IP, if the evidence tells you that your original probability estimate was unreliable, your uncertainty *increases*. A precise probability model cannot capture this increase in uncertainty without changing the mean; an IP model can widen the interval while keeping the same midpoint, showing that **uncertainty increased even though the 'best guess' stayed the same.**

  ### Summary for Your Club
  To summarize your response to the skeptics:

  1.  **Epistemology:** $[0.3, 0.7]$ represents ignorance; $0.5$ represents knowledge of fairness. They are different states.
  2.  **Action:** Rational agents shouldn't always average. Sometimes the rational move is to refuse to bet because the lower-bound probability is too low, even if the average looks good.
  3.  **Honesty:** Precise probabilities force us to fake knowledge we don't have (spurious precision). Imprecise probabilities allow us to be rationally agnostic.

  The "work" the imprecision is doing is protecting the agent from acting as if they know more than they do. It is a formal way of saying, **"I'm not sure, and I shouldn't act as if I am."**
