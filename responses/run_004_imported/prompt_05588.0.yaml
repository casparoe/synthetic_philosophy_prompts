answer: |-
  The gas lamp hissed on the table between them, casting long, trembling shadows against the walls of the Boston office. Stacks of *The Liberator* lay bundled in the corner, smelling of fresh ink and damp paper. William Lloyd Garrison stood by the window, his spectacles removed, pinching the bridge of his nose. Frederick Douglass sat, his massive frame filling the wooden chair, a copy of the Constitution open on his knees.

  "You ask me to sanctify a lie, Fred," Garrison said softly, turning from the window. "To take a document forged in the fire of compromise and call it holy."

  "I ask you to read it," Douglass replied, his voice low but resonant. "Not the intentions of the men who wrote it, but the words they left us. Look here, Mr. Garrison. Show me the word 'slave.' Show me 'slavery.' Show me 'property' in a man."

  Garrison walked to the table and slapped a hand down on the open booklet. "Euphemism does not absolve sin. 'Such persons.' 'Other persons.' 'Person held to service.' We know what they meant. The framers knew. The South knows. To argue otherwise is to engage in a legalistic trickery that dishonors the truth."

  "Truth is not found only in intent, but in power," Douglass countered, leaning forward. "If the text does not explicitly sanction slavery, then slavery exists in the states only by local law. It has no national footing. The Constitution gives the federal government no authority to support a slave code. If we read it as a pro-slavery document, we hand the master the very weapon you claim to fight."

  "And if we read it as anti-slavery, we bind ourselves to a Union that enforces the Fugitive Slave Act!" Garrison's voice rose, the calm fracturing. "You speak of the text? What of Article Four? It commands that a man who escapes tyranny be dragged back to it. It makes every citizen a jailer. How is that not a covenant with death?"

  "It commands the delivery of a 'person held to service,' Douglass said, holding Garrison's gaze. "But it does not define who holds them. It does not appropriate money to catch them. It does not establish commissioners to judge them. The Act of 1850 did that, not the Constitution. The Constitution is silent on the machinery of capture. That silence is our opening."

  Garrison shook his head, pacing the small room. "You are splitting hairs while men are split in two. You speak of silence? What of the Three-Fifths clause? They counted the bondman as less than a man to swell the representation of the slaveholder. It is a moral stain that no interpretation can wash clean."

  "It is a penalty," Douglass insisted. "If the South counts their slaves, they gain power. If they count them as three-fifths, they lose power compared to if they were full citizens. It deprives the slaveholding oligarchy of the full weight of their human property in Congress. It is a disincentive, written into the architecture of the Republic."

  "It is dehumanization codified!" Garrison stopped pacing and leaned in, his eyes intense behind the lamplight. "And the twenty years granted for the migration or importation of such persons? Article One, Section Nine. They bought two decades of the African trade. They bartered in blood."

  "They set an expiration date," Douglass said. "They did not say the trade shall continue. They said it may continue *until* 1808. They put a death sentence on the trade itself. Why would they do that if the document was designed to perpetuate the institution forever?"

  "Because they were weak men!" Garrison cried. "Because they valued Union over Liberty. And that is my point, Fred. The Union is the idol. You worship the Union and hope it can be cleansed. I tell you, the vessel is rotten. You cannot purge slavery through a government whose foundation is compromise with the devil. Disunion is the only moral path. 'No Union with Slaveholders.' If the North secedes, the South cannot hold the slaves without our aid. The system collapses."

  Douglass stood, towering over the smaller man. The air in the room grew heavy. "And the slave collapses with it? You would abandon four million souls to the tender mercies of the planter class, alone, without the cover of federal law, without the hope of the ballot, without the ability to agitate within the states?"

  "I would not have my name on the charter that binds them!"

  "And I will not have my hands tied from using every tool to free them!" Douglass's voice boomed, shaking the papers on the desk. "You speak of Natural Law, Mr. Garrison. So do I. The Constitution must be interpreted in the light of the Declaration of Independence. 'All men are created equal.' That is the preamble to the law. If the Constitution allows for liberty, we must claim it. To say the Constitution is pro-slavery is to admit there is no legal way to end slavery. I refuse that despair."

  Garrison looked at him, a profound sadness settling over his features. He picked up his spectacles but did not put them on. "Despair is honest, Fred. Hope that relies on the goodwill of the oppressor is a delusion. You are walking into a political arena that will eat your soul. They will ask you to compromise. They will ask you to vote for lesser evils."

  "Then I will fight them in the arena," Douglass said, closing the Constitution with a definitive thud. "Better to fight in the house than to burn it down with the captives still inside."

  Garrison turned back to the window, looking out into the dark Boston street. "Then we are no longer brothers in this work. You seek to change the government. I seek to dissolve it."

  "We seek the same end, William," Douglass said, his voice softening, though his posture remained rigid. "We only differ on the price of the passage."

  "The price," Garrison whispered to the glass, "is the soul of the nation. And I fear you are paying it with coin that does not belong to you."

  Douglass picked up his hat. He paused at the door, looking at the back of the man who had once been his mentor, now a stranger in principle. "Then I shall pray that my coin buys their freedom."

  He stepped out into the night, leaving Garrison alone with the lamp and the bloody parchment.
