answer: |-
  Here are ten interview questions designed to probe the structural integrity of expressivism, specifically targeting the Frege–Geach problem, the negation problem, and the risk of collapse into cognitivism. Each includes a follow-up tailored to the standard expressivist defense.

  **1. The Concrete Embedded Case**
  "Let's start with the classic Frege–Geach setup using the example I mentioned. When I assert 'Breaking a promise is wrong,' you say I'm expressing an attitude of disapproval. But consider the antecedent of this conditional: 'If breaking a promise is wrong, then talking someone into breaking theirs is wrong.' In this context, I'm not asserting that promise-breaking is wrong, so I can't be expressing disapproval of it. If expressivism is true, what specific mental state am I expressing *right there* in the 'if' clause?"

  *   **Follow-up:** "You'll likely say it's a higher-order attitude about the relationship between two first-order attitudes. But if that higher-order state is just a belief about how my attitudes relate, haven't you just smuggled a cognitive belief back into the foundation of the theory?"

  **2. Validity and Attitude Conflict**
  "You've mentioned that expressivists can 'earn' logical validity by building a logic of attitudes. In standard logic, an argument is valid if the truth of the premises guarantees the truth of the conclusion. If moral sentences don't have truth conditions, what property of my attitudes guarantees that it's inconsistent to accept the premises of a moral modus ponens but reject the conclusion?"

  *   **Follow-up:** "If you define inconsistency as 'clashing attitudes' rather than 'contradictory truth claims,' does that mean a sociopath who has no conflicting attitudes about cruelty is logically consistent, even if their moral reasoning is monstrous?"

  **3. The Negation Problem**
  "Let's press on the negation problem. If 'Breaking a promise is wrong' expresses disapproval, what attitude does 'Breaking a promise is *not* wrong' express? Is it simply the absence of disapproval, or is it a positive attitude of tolerance? If it's just absence, how does it logically conflict with the original claim? If it's a positive attitude, how is that psychologically distinct from being indifferent?"

  *   **Follow-up:** "If you posit a specific 'tolerance' attitude to solve this, do you have to posit a unique, distinct attitude for every different logical operator, like 'unless' or 'provided that,' to keep the logic working?"

  **4. Combinatorial Explosion**
  "Following up on that: In classical semantics, we can generate infinite complex sentences using a few logical operators. If expressivism requires a unique type of mental state for every logical combination to preserve validity, aren't you committed to a psychologically implausible 'combinatorial explosion' of attitude types that no human mind could actually harbor?"

  *   **Follow-up:** "If you argue that the mind constructs these complex states on the fly, isn't that construction process governed by rules that look exactly like the truth-conditional rules you're trying to replace?"

  **5. The Nature of Disagreement**
  "One motivation for expressivism is explaining why moral judgments motivate us. But consider two people arguing: I say 'X is wrong,' and you say 'X is not wrong.' If I'm expressing disapproval and you're expressing tolerance, we aren't contradicting each other's facts; we're just having different feelings. How does your account capture the intuition that we are genuinely *disagreeing* rather than just clashing like two objects?"

  *   **Follow-up:** "If you say we are disagreeing about what attitudes to have, doesn't that turn the moral debate into a debate about psychology, which is a factual matter we could settle with a brain scan?"

  **6. Logical Truths**
  "Consider a tautology like 'Either cruelty is wrong or cruelty is not wrong.' In classical logic, this is true regardless of the content. For an expressivist, what attitude does this express? It seems odd to say I have a specific emotional stance toward the disjunction of cruelty being wrong or not. Is this sentence just empty noise on your view?"

  *   **Follow-up:** "If you say it expresses a 'stable' or 'complete' state of mind, doesn't that imply there is a standard of correctness for attitudes that exists independently of the attitudes themselves?"

  **7. The Collapse Worry**
  "Here is a broader worry. If your 'logic of attitudes' has to reconstruct every formal feature that a fact-stating semantics provides for free—validity, inconsistency, entailment, negation—what explanatory work is left for the claim that moral sentences *aren't* facts? If it walks like a duck and quacks like a duck, why insist it's not a duck?"

  *   **Follow-up:** "If your answer is that the metaphysics is different (no moral facts in the universe), does that metaphysical difference actually change how we ought to reason about ethics, or is it just a metaphysical ornament?"

  **8. Quasi-Realism and Truth-Talk**
  "Simon Blackburn's quasi-realism suggests we can 'earn the right' to talk about moral truths even if they aren't facts. But when I say 'It is true that slavery is unjust,' am I just expressing a very strong attitude, or am I attributing a property to the sentence? If you allow me to say it's 'true,' what stops me from asking what *makes* it true?"

  *   **Follow-up:** "If you say 'nothing makes it true, it's just an expression,' aren't you changing the definition of 'truth' so much that the word loses its connection to reality, which was the whole point of rejecting moral facts in the first place?"

  **9. Moral Error**
  "Can an expressivist account for moral error? If I sincerely express an attitude of approval toward genocide, but my attitude is internally consistent and stable, in what sense am I mistaken? Cognitivists can say I'm believing a falsehood. What is the equivalent 'falsehood' for me on your view?"

  *   **Follow-up:** "If you say I'm mistaken because my attitude doesn't align with some ideal set of attitudes, isn't that ideal set functioning exactly like a moral fact, regardless of what you call it?"

  **10. Falsification Criteria**
  "Finally, expressivists often treat objections like the Frege–Geach problem as engineering challenges: 'We just need to refine the logic of attitudes.' I want to ask: What would count as evidence that the account has *failed* here, rather than evidence that it just needs one more attitude added to the machinery? Is there any logical phenomenon that, if it exists, would force you to abandon expressivism?"

  *   **Follow-up:** "If your answer is 'no, we can always posit a more complex attitude,' then isn't the theory unfalsifiable? And if it's unfalsifiable, does it really explain anything, or does it just describe the same data in more complicated psychological language?"
