      *   *Refining the Argument:* The core of *upamāna* is the *application of a name to a new object based on similarity described by authority*. Inference applies a predicate based on a logical mark. The "mark" in *upamāna* (similarity) is not logically invariable (many things resemble cows but aren't *gavayas*). It works only because of the *linguistic stipulation* provided by the forester. This makes it a hybrid of *śabda* and perception, distinct from the logical necessity of *anumāna*.
