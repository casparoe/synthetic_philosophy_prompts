      *   *Vaiśeṣika View:* This process can be mapped onto inference. Major premise: Whatever resembles a cow is a *gavaya* (or similar). Minor premise: This animal resembles a cow. Conclusion: This is a *gavaya*. Therefore, no need for a separate *pramāṇa*.
      *   *The Crux:* Is the cognition of the *name-object relation* based on similarity fundamentally different from inferring a property based on a universal concomitance (*vyāpti*)?

  3.  **Drafting Section 1: Structural Analysis (Nyāya):**
