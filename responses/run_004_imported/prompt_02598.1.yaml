      *   *Argument:* The cognition arises from the knowledge of the concomitance between "cow-resemblance" and "being a *gavaya*." Since inference handles concomitance, *upamāna* is redundant.

  5.  **Drafting Section 3: The Verdict (The Hard Part):**
      *   *Constraint:* I must commit. No fence-sitting.
      *   *Option A (Nyāya):* *Upamāna* is unique because it deals with *saṃjñā-saṃjñi-sambandha* (name-object relation) mediated by similarity, which isn't a universal (*sāmānya*) in the strict Vaiśeṣika sense required for *vyāpti*. Inference requires a necessary connection. Similarity is not a necessary connection in the same way; it's a recognition of family resemblance. Also, the *source* of the knowledge is the testimony + perception of similarity, not a logical deduction from a universal.
