answer: |-
  The rationalist "dissolution" of free will is indeed a powerful intellectual maneuver, but your friend is correct: it functions as a bait-and-switch. It solves the problem of *agency* (how do we model decision-making?) while sidestepping the problem of *authorship* (who is ultimately responsible for the decision-maker?).

  To build your friend's case rigorously, we must distinguish between two distinct concepts of responsibility that the rationalist strategy conflates: **forward-looking responsibility** (accountability, social regulation, moral education) and **backward-looking basic desert** (the intrinsic worthiness of praise or blame solely in virtue of the act and its source). The rationalist argument successfully secures the former but fails to secure the latter. Since the traditional free will debate is primarily driven by intuitions about basic desert, the rationalist has not dissolved the problem; they have changed the subject.

  Here is the rigorous Source Incompatibilist case against the rationalist dissolution, specifically targeting the "you are the process" defense.

  ### 1. The Core Demand: Ultimate Sourcehood
  The Source Incompatibilist begins with a specific intuition about fairness, often formalized by Galen Strawson as the "Basic Argument." The intuition is this: To be morally responsible for an action $A$, you must be responsible for the mental state $M$ that produced $A$. But to be responsible for $M$, you must have chosen $M$ based on some prior principle $P$. To be responsible for $P$, you must have chosen it based on $P_2$. This leads to an infinite regress.

  Since no finite being can be *causa sui* (self-caused), no one can be ultimately responsible for their character, values, or deliberative dispositions. If determinism is true, your "deliberative process" is the output of genetics and environment. If indeterminism is true, your "deliberative process" is partially the output of randomness. In neither case are *you* the ultimate source.

  The rationalist response—"You simply *are* the physical decision process"—is a category error. It identifies the *locus* of action with the *source* of agency. Being the locus (the place where the decision happens) is not sufficient for basic desert. If a hurricane destroys a house, the hurricane is the locus of the destruction. If a brain destroys a reputation, the brain is the locus. But we only assign *moral* blame if the locus was also the *author*. The rationalist asserts authorship by fiat ("you are the process") without explaining how a process determined by prior causes can claim authorship of its own structure.

  ### 2. The Compatibilist Rejoinder: Guidance Control
  To give the rationalist their strongest defense, we look to John Martin Fischer's account of **Guidance Control**, which underpins much of the Dennett-style compatibilism popular in rationalist circles.

  Fischer concedes that determinism rules out **Regulative Control** (the ability to do otherwise in the exact same circumstances). However, he argues that moral responsibility only requires **Guidance Control**. Guidance control exists when:
  1.  The action issues from the agent's own **moderately reasons-responsive mechanism**.
  2.  The mechanism is the agent's **own** (not externally manipulated).

  The rationalist adopts this enthusiastically. They argue: "When you deliberate, you are weighing reasons. If your mechanism is responsive to those reasons, you are free. The fact that the mechanism was determined by the past is irrelevant. You are not a puppet because the strings are internal (your values) rather than external (a coercer)."

  This is the "dissolution." It claims that once we verify the internal architecture is functioning correctly (no coercion, no insanity, reasons-responsive), the metaphysical worry about the *origin* of that architecture is a confusion.

  ### 3. The Refutation: The Manipulation Argument
  The Source Incompatibilist defeats this using Derk Pereboom's **Four-Case Manipulation Argument**. This argument is designed to show that there is no relevant difference between a determined agent and a manipulated agent regarding ultimate sourcehood.

  **Case 1 (Direct Manipulation):** A neuroscientist directly implants a decision into Agent A's brain. Agent A acts. Clearly, Agent A is not responsible. The source is the scientist.
  **Case 2 (Programming):** A neuroscientist programs Agent B's brain at birth with specific values and deliberative dispositions. Agent B grows up, reasons according to those values, and acts. Agent B is reasons-responsive.
  **Case 3 (Determinism):** Agent C is born in a normal deterministic universe. Genetics and environment shape their values and deliberative dispositions. Agent C grows up, reasons according to those values, and acts. Agent C is reasons-responsive.

  The rationalist/Fischerian must draw a line between Case 2 and Case 3. They must argue that Case 2 lacks freedom (because the source is external manipulation) while Case 3 possesses it (because the source is "natural" determinism).

  **The Incompatibilist Strike:** There is no relevant difference between Case 2 and Case 3 regarding *ultimate sourcehood*. In both cases, the agent's values, reasoning capacity, and character are fully determined by factors outside their control (the scientist in Case 2; heredity and environment in Case 3).
  *   In Case 2, the agent says, "I chose this based on my values." The Incompatibilist replies, "You didn't choose your values."
  *   In Case 3, the agent says, "I chose this based on my values." The Incompatibilist replies, "You didn't choose your values."

  If the rationalist claims Case 3 is free because "the agent *is* the process," they must explain why the agent in Case 2 is *not* the process. In Case 2, the agent also *is* the process; the process was just initiated by a scientist. If the agent in Case 2 is not responsible because they didn't author their initial conditions, the agent in Case 3 cannot be responsible either. Determinism just replaces the scientist with "nature and nurture."

  ### 4. Why "Reasons-Responsiveness" Fails to Secure Authorship
  The rationalist will object: "But in Case 3, the agent's reasoning is *their own*. In Case 2, it belongs to the scientist."

  This is the bait-and-switch. It defines "own" structurally rather than historically. It says a mechanism is "yours" if it is integrated into your psychology, regardless of how it got there. But basic desert is inherently historical. We do not blame people for actions resulting from brainwashing or indoctrination, even if those actions flow smoothly from their current psychology. We excuse them because the *source* of that psychology was external coercion or manipulation.

  The Source Incompatibilist argues that **Constitutive Luck** undermines the "ownness" claim in Case 3.
  *   You did not choose your genes.
  *   You did not choose your upbringing.
  *   You did not choose the initial weights of your neural network that make you more or less responsive to certain moral reasons.

  If your "reasons-responsiveness" is itself a product of luck, then praising you for being reasons-responsive is like praising a lottery winner for having the winning ticket. The rationalist says, "But you held the ticket!" The Incompatibilist replies, "You didn't buy it; you were handed it at birth."

  Fischer's Guidance Control attempts to bypass history by focusing on the *current* ownership of the mechanism. But this fails to satisfy the demand for basic desert. Basic desert requires that the agent be the *ultimate creator* of the self that acts. If the "self" is merely a conduit through which prior causal forces flow, then blaming the self is metaphysically unjust, even if it is socially useful.

  ### 5. The Failure of the "Dissolution"
  The rationalist strategy claims the problem is dissolved because the libertarian demand for "uncaused causation" is incoherent. They argue that demanding to be the *ultimate* source is demanding to be a miracle.

  However, this misses the point of the Incompatibilist objection. The objection is not that we *can* be uncaused causes; the objection is that **if we cannot be uncaused causes, we cannot deserve basic blame.**

  The rationalist tries to save moral responsibility by redefining it as "being a suitable target for forward-looking social practices." They argue: "We blame people to modify future behavior. Determined agents respond to blame. Therefore, blame is justified."

  Your friend's objection is that this is not *moral responsibility* in the sense that matters to the human experience of guilt, pride, and retribution.
  *   **Forward-looking:** "I blame you to stop you from doing it again." (Compatible with determinism).
  *   **Backward-looking:** "I blame you because you *deserve* it, independent of future consequences." (Requires ultimate sourcehood).

  When a person feels deep moral guilt, they are not worrying about whether they are a reasons-responsive mechanism. They are worrying about whether *they* did it, in a way that makes the stain on their soul their own. The rationalist tells them, "Don't worry, you are a deterministic computer that processed inputs correctly." This does not alleviate the metaphysical anxiety; it dismisses it. It tells the agent that their intuition about desert is a bug in their code, rather than a valid insight into metaphysics.

  ### Conclusion
  The rationalist "dissolution" fails because it addresses the *mechanics* of freedom while ignoring the *metaphysics* of desert. By adopting a Fischer-style Guidance Control or Dennett-style functionalism, the rationalist secures a definition of free will that allows for social regulation and internal coherence. However, they do so by severing the link between the agent and the *origin* of the agent's will.

  As long as the agent's deliberative process is the inevitable output of a causal chain they did not initiate, the agent is not the ultimate source. If basic desert requires ultimate sourcehood (as Strawson and Pereboom argue), then the rationalist has not solved the problem. They have merely offered a pragmatic consolation prize: "You are not free enough to deserve retributive blame, but you are free enough for us to keep you in prison to deter others." That may be a functional society, but it is not a vindication of free will. The bait-and-switch remains: they promised to save moral responsibility, but they only saved social utility.
