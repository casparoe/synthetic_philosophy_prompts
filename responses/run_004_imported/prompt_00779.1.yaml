answer: |-
  This is a classic impasse in the foundations of formal epistemology, and you have diagnosed the tension precisely. As a PhD student, you are right to sense that the "depragmatized" Dutch Book Argument (DBA) hangs on a premise that is doing far more heavy lifting than its proponents often admit.

  Here is an analysis of what is being smuggled in at the additivity step, an evaluation of whether Christensen's strategy survives Maher's critique, and a comparison with the representation theorem alternative.

  ### 1. What is Being Smuggled In? The Linearity of Epistemic Value

  To see the smuggling clearly, we must distinguish between the **pragmatic** context (money) and the **epistemic** context (fairness/credence).

  In the classical pragmatic DBA, the additivity of bets is uncontroversial because money is linear. If I accept a bet paying \$1 if $A$ for \$0.60, and a bet paying \$1 if $B$ for \$0.60 (where $A, B$ are disjoint), I am functionally committed to a package deal costing \$1.20 that pays \$1. The arithmetic is external to my mind; it is in the wallet.

  Christensen's move is to say the defect is not the wallet loss, but the **inconsistency of the valuations**. He argues that if you judge Bet 1 fair and Bet 2 fair, you are *committed* to judging the package fair at the sum of the prices.

  **Maher's Objection (1997):**
  Maher points out that this commitment only holds if the "value" or "fairness" being judged aggregates linearly.
  *   In the pragmatic case, linearity is a fact about currency.
  *   In the epistemic case, "fairness" is a proxy for credence strength. To say "Judging $A$ fair at $x$ and $B$ fair at $y$ commits me to judging $A \lor B$ fair at $x+y$" is to assert that **epistemic fairness is additive.**

  **The Smuggling:**
  The premise that *epistemic* fairness judgments must combine additively is logically equivalent to the conclusion that *credences* must be additive.
  If $Fair(A) = C(A)$ and $Fair(B) = C(B)$, then the premise $Fair(A \lor B) = Fair(A) + Fair(B)$ just *is* $C(A \lor B) = C(A) + C(B)$.

  Christensen attempts to ground this additivity in the **nature of judgment**: to judge a conjunction of bets fair *just is* to judge the components fair at the sum. But Maher retorts that this is a substantive normative claim, not a conceptual truth. Why should my epistemic valuation of a complex proposition be the linear sum of its parts? If I view truth as holistic, or if I have risk-averse epistemic utility, I might value the package differently than the sum of the parts. By stipulating that fairness aggregates linearly, Christensen effectively builds probabilism into the definition of "coherent fairness judgment."

  ### 2. Can the Depragmatizing Strategy Survive?

  The short answer is: **Not in its original Christensen (1996) form.** The consensus in the literature (heavily influenced by Hájek's 2009 "Fifteen Arguments") is that depragmatized DBAs do not successfully escape the pragmatic shell without collapsing into question-begging.

  **Hájek's "Waging War" (2009):**
  Hájek argues that any DBA, pragmatic or depragmatized, relies on a bridge principle connecting credences to something else (bets, values, utilities).
  *   If the bridge is pragmatic (bets), you face the "Why bet?" objection.
  *   If the bridge is epistemic (fairness judgments), you face Maher's "Why additivity?" objection.
  Hájek suggests that the depragmatized version simply moves the pragmatic norm ("Don't lose money") to an epistemic norm ("Don't have inconsistent fairness judgments"), but the structural vulnerability remains. The additivity requirement is not a neutral constraint on rationality; it is the probabilistic axiom itself in disguise.

  **The Shift to Accuracy (Joyce 1998, 2009):**
  The strategy that *did* survive the Maher/Hájek critique was not to fix the DBA, but to abandon betting talk entirely in favor of **Accuracy Arguments**.
  *   **The Move:** Instead of "fair betting price," use "estimated accuracy."
  *   **The Norm:** You ought to minimize the inaccuracy of your credence function (measured by a proper scoring rule, e.g., Brier score).
  *   **The Math:** If your credences violate probabilism, there exists a probabilistic set of credences that is guaranteed to be more accurate (dominance theorem).
  *   **Avoiding Maher:** Joyce argues that additivity of *accuracy* (across propositions) is more defensible than additivity of *betting value*. It relies on the assumption that the epistemic disvalue of being wrong about $P$ is independent of being wrong about $Q$. While this is still a substantive assumption (and faces objections regarding "verisimilitude" or logical constraints), it is not *tautologically* equivalent to probabilism in the way Christensen's fairness additivity is.

  **Verdict:** If you are defending a depragmatized DBA in the strict Christensen sense, you are fighting a losing battle against Maher. If you are interested in non-pragmatic defenses, the literature has largely migrated to Accuracy-Dominance arguments.

  ### 3. Dutch Book vs. Representation Theorems

  You asked whether we should abandon DBAs for Representation Theorems (RTs). This is the standard alternative, but it comes with its own baggage.

  **The Case for Representation Theorems:**
  *   **No Betting:** RTs (e.g., Savage, Bolker-Jeffrey) derive probabilities from preferences over acts, not explicit bets. This avoids the "Why bet?" objection.
  *   **Derivation:** They show that *if* an agent's preferences satisfy certain structural axioms (Ordering, Independence, Continuity), *then* there exists a probability function representing those preferences.
  *   **Normative Force:** The norm is "satisfy the axioms of preference," which seems more fundamental than "satisfy the probability calculus."

  **The Problems with RTs (for your purposes):**
  1.  **The Pragmatic Residue:** Preferences are often cashed out in terms of choices/actions. If the norm is "don't have intransitive preferences," is that epistemic or pragmatic? If it's pragmatic, we haven't solved the original problem. If it's epistemic, we need an account of "epistemic preference" that is as mysterious as "epistemic fairness."
  2.  **Idealization:** RTs require Completeness and Continuity. Real agents (and arguably rational agents) have vague or incomplete credences. Probabilism is often defended as a norm for ideal agents, but the RT axioms are *more* idealized than the probability axioms themselves.
  3.  **Uniqueness:** Standard RTs derive Probability *and* Utility together. To get Probabilism alone, you must fix Utility (e.g., assume the agent only cares about truth). This reintroduces the assumptions of the Accuracy Argument.
  4.  **The "Why Axioms?" Gap:** Just as Maher asks "Why additivity of fairness?", one can ask "Why the Independence Axiom?" (See Meacham & Weisberg 2011). The normative gap is merely relocated, not closed.

  ### 4. Recommendation for Your Dissertation

  Given your position, here is how I would frame the chapter:

  1.  **Concede the Point on Christensen:** Acknowledge that Maher successfully identifies that Christensen's specific depragmatization presupposes the linearity of epistemic value, which begs the question against non-probabilistic alternatives (like fuzzy credences or holistic valuation).
  2.  **Pivot to Accuracy:** Argue that the *spirit* of the depragmatizing project survives not in DBAs, but in Accuracy-Dominance arguments (Joyce, Pettigrew). These arguments accept Maher's lesson: you cannot assume additivity of value without justification. Instead, they justify additivity of *inaccuracy* via separability arguments that are more transparent than Christensen's fairness claims.
  3.  **Critique the RT Alternative:** Argue that Representation Theorems do not offer a superior *epistemic* defense. They trade the "Why bet?" problem for the "Why prefer?" problem and introduce heavier idealization constraints. They are excellent for *interpreting* credences, but less potent for *normatively defending* probabilism as an epistemic virtue.
  4.  **Final Stance:** The most robust defense of probabilism is currently the **Accuracy-Based Dominance Argument**. It is not immune to objection (e.g., the "Grading Gap" or issues with logical omniscience), but it avoids the specific circularity Maher identified in the DBA literature.

  **Key References to Engage:**
  *   **Maher, P. (1997).** "Depragmatized Dutch Book Arguments." *Philosophy of Science*. (The critique).
  *   **Hájek, A. (2009).** "Fifteen Arguments against the Dutch Book Argument." *Erkenntnis*. (The graveyard of DBAs).
  *   **Joyce, J. M. (1998).** "A Nonpragmatic Vindication of Probabilism." *Philosophy of Science*. (The successor).
  *   **Pettigrew, R. (2016).** *Accuracy and the Laws of Credence*. (The modern book-length defense).
  *   **Meacham, C. & Weisberg, J. (2011).** "Representation Theorems and the Foundations of Decision Theory." *Australasian Journal of Philosophy*. (Critique of RTs).

  In summary: You are right to be suspicious. The "smuggling" is the assumption that epistemic value is linear. Christensen's specific version does not survive Maher. However, the project of non-pragmatic vindication survives by shifting from *betting fairness* to *accuracy*, which offers a more defensible (though not perfect) grounding for additivity. Representation theorems are a useful tool but do not solve the normative gap any better than the accuracy arguments do.
