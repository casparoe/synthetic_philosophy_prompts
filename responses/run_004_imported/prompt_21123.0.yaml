          *   So it fails the hypothesis.
          *   To make a real counterexample, you'd need to include the limits but still not have a max. That implies you can climb "higher" than any limit. This leads to the Ordinal argument (Hartogs number). *Keep this high-level.* The set would have to be "too big" to be a set.

      *   *Section 3: The Non-Constructive "Sketchiness".*
