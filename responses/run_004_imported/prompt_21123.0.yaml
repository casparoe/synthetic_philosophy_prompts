          *   Chain = a path you walk.
          *   Upper Bound = a helicopter pickup point at the end of the path.
          *   Maximal Element = The absolute peak.
          *   The Lemma says: If every path has a pickup point *on the mountain*, there is a peak.
          *   Why can't we fake it? If there were no peak, you could keep climbing forever. But if you climb forever through *all* possible infinities (ordinals), you run out of "room" in the set.

      *   *Section 2: The "What Breaks" in Counterexamples.*
          *   Use the $(0, 1)$ example. It looks like a counterexample.
