prompt: |-
  I'm the family rep on my late mom's hospice ethics committee -- they asked me to stay on after she died there last spring. We're now split on a 'palliative sedation' policy: a doctor kept raising a dying patient's sedative dose for pain control until his breathing slowed and he died sooner than expected, and half the committee calls that euthanasia in disguise while the other half insists it's different because the doctor never intended the death, only the comfort. I went down a rabbit hole reading about the trolley problem and the 'doctrine of double effect' that's supposed to explain the difference, but it kinda just feels like a technicality -- if you can predict a dose will stop someone's breathing, how is that not intending it? Can you draft the memo we need before next months meeting? It should recommend real policy language, not 'use clinical judgment,' give staff concrete criteria, and seriously grapple with the possibility that the intend/foresee line is just a dodge.
