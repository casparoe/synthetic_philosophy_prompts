      *   *Wait, one nuance:* Luminosity usually implies *in a position to know*. KK implies *actually knows*. Williamson argues neither holds. But the margin-for-error argument targets the *safety* condition required for knowledge, which undermines both.
      *   *Rationalist angle:* Emphasize that "calibration" assumes we can assess our own probabilities. If we aren't luminous about our evidence, our probability assignments are inherently noisy. This justifies hierarchical Bayesian models (meta-uncertainty).

  9.  **Final Polish:** Check for clarity, flow, and direct answers to the prompt's specific questions. (Yes, KK is a species of luminosity. Yes, Williamson sinks it. Yes, there are defenses but they are costly. Yes, this supports rationalist calibration norms.)

  **(Self-Correction Note):** Make sure to mention that for Williamson, Knowledge is a *mental state*. This is crucial because traditionally mental states were thought to be luminous (Cartesian). Williamson says they are mental but *not* luminous. This breaks the Cartesian picture.

