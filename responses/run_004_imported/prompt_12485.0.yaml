      *   *What is Truth?* For Augustine, Truth is not just propositional accuracy; it is ontological. God is Truth. To lie is to offend against the nature of God and the nature of language (which is meant to communicate thought).
      *   *The "Degrees of Sin" Question:* If all lies are sins, why are some worse?
          *   Standard Utilitarian view: More harm = worse.
          *   Augustine's view: More harm = worse *consequences*, BUT the *sinfulness* is rooted in the will's departure from Truth.
      *   *The Key Distinction:* The distinction between the *gravity of the offense against Truth* (which is always present in any intentional lie) and the *damage done to charity/neighbor* (which varies).

  3.  **Identify the "Specific Logical Move":**
      *   The user is assuming the scale measures *permissibility threshold* (i.e., if benefit > harm, it's okay).
      *   Augustine's scale measures *culpability and punishment*, not *ontological status*.
      *   *The Move:* Distinguishing between the **intrinsic evil of the act** (the aversion from Truth) and the **extrinsic consequences of the act** (harm to neighbors).
