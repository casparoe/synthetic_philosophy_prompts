      *   **Directly Answer the Question:**
          *   *Is Sider declining to apply the taboo test?* In a way, yes, but not out of negligence. He argues the test is insufficient for *fundamental* metaphysics. The taboo test resolves disputes about *objects* (tables vs. atoms), but Sider is asking about the *logic* used to describe them.
