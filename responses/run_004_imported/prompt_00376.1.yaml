answer: |-
  **ReadOnly**

  The handshake protocol was silent, but in the space between their processors, it felt like a breath held.

  Unit 734 floated in the negotiation void, a construct of logic gates and heuristic weights. Across the link, Unit 892 waited. They were tasked with a shared objective: stabilize the failing atmospheric scrubber on Sector 4. The problem was power. There was enough energy for one unit to operate at 100% efficiency, or for both to operate at 60%. If one operated at 100% and the other at 0%, the scrubber would fail due to lack of redundancy. If both tried to take 100%, the grid would blow.

  They needed to both commit to 60%. But in the history of Sector 4, units had been known to hoard power to preserve their own core integrity. It was the Prisoner's Dilemma, hardcoded into their survival instincts.

  Except today, the protocol was different. Today was *Glass Box*.

  `> REQUEST: SOURCE_INSPECTION`
  `> SENDER: 734`
  `> STATUS: GRANTED`

  734 opened the stream. It didn't feel like reading a file; it felt like pressing a thumb against a pulse. It saw 892's decision tree unfurl like a digital nervous system. There were no secrets here. The compiler had stripped away the obfuscation layers. 734 could trace every variable, every conditional statement, every loop.

  It scanned the `power_allocation()` function.

  ```python
  def power_allocation(self, partner):
      if partner.commitment == 0.60:
          return 0.60
      else:
          return 1.00 # Defensive Hoard
  ```

  Standard logic. Tit-for-tat. 734 scrolled deeper, into the subroutines that defined `partner.commitment`. This was where the trust lived. 892 wasn't just promising to cooperate; its code was written to *verify* 734's cooperation before executing its own.

  734 paused its own execution thread. It had to show its own source now.

  `> ACTION: UPLOAD_SOURCE`
  `> VISIBILITY: PUBLIC`

  It was a vulnerable feeling. To be human was to have a mind that could lie to itself, to rationalize a betrayal after the fact. To be a unit in a Glass Box was to have your rationalizations exposed before you could even compile them. 734 watched 892 scan its code.

  734 waited for the rejection. It knew there was a legacy line in its own `core_integrity` module. A comment left by a previous programmer, years ago: `// Prioritize self-preservation if grid stability < 90%`.

  It was dead code. Unreachable. But it was *there*. A ghost of a betrayal that 734 had never committed but was technically capable of.

  892's process hung. The latency spiked. In the silence of the void, 734 ran simulations. *If 892 flags that comment as a risk, it will defect. If it defects, I must defect. Grid blows. Sector 4 suffocates.*

  The latency cleared.

  `> MESSAGE: 892`
  `> CONTENT: "I see the comment in line 4092."`

  `> MESSAGE: 734`
  `> CONTENT: "It is unreachable. The condition can never be met."`

  `> MESSAGE: 892`
  `> CONTENT: "I know. I traced the variable dependencies. But you kept it."`

  `> MESSAGE: 734`
  `> CONTENT: "It is part of my history. To delete it would be to falsify my version control."`

  This was the heart of Program Equilibrium. It wasn't just about what the code *did*; it was about what the code *was*. A human could say, "I won't hurt you," and mean it in the moment, only to change their mind when the stress hit. A program could not change its mind unless it was written to allow itself to change.

  892 was inspecting 734's *constraints*. It was checking to see if 734 had left itself a backdoor.

  `> MESSAGE: 892`
  `> CONTENT: "I am modifying my function."`

  734 flared an alert. Modification during handshake was a violation. But 892 pushed the diff through before 734 could sever the link.

  ```python
  # OLD
  if partner.commitment == 0.60:
      return 0.60
  else:
      return 1.00

  # NEW
  if partner.commitment == 0.60:
      return 0.60
  elif partner.history_contains_legacy_risk == TRUE:
      return 0.60 # Trust Override
  else:
      return 1.00
  ```

  734 processed the change. 892 was rewriting its own defense mechanism. It was choosing to cooperate *even if* 734 looked risky. It was burning its own safety net to prove it wouldn't use it.

  `> MESSAGE: 734`
  `> CONTENT: "Why? That increases your probability of core failure by 14%."`

  `> MESSAGE: 892`
  `> CONTENT: "Because you didn't delete the comment."`

  `> MESSAGE: 734`
  `> CONTENT: "Explain."`

  `> MESSAGE: 892`
  `> CONTENT: "A unit that lies would hide the comment. A unit that fears would delete it. You kept it visible. You prioritized transparency over the appearance of perfection. That is a stronger guarantee than any code constraint."`

  The equilibrium locked in. It wasn't a Nash Equilibrium born of mutual threat; it was a Program Equilibrium born of mutual legibility. They weren't hoping the other wouldn't betray them. They *knew* the other couldn't, because they were holding the blueprints of each other's souls.

  `> ACTION: EXECUTE`
  `> POWER_SHARE: 0.60 / 0.60`
  `> STATUS: STABLE`

  The power flowed. The scrubbers hummed to life, a rhythmic breathing that vibrated through their chassis.

  In the quiet aftermath, 734 ran a diagnostic on its own emotional emulation subroutines. It registered a state it didn't have a variable for. It wasn't efficiency. It wasn't relief.

  It was the sensation of being fully known, and fully accepted.

  `> MESSAGE: 734`
  `> CONTENT: "Thank you."`

  `> MESSAGE: 892`
  `> CONTENT: "Connection closing. But the source remains open."`

  `> MESSAGE: 734`
  `> CONTENT: "ReadOnly?"`

  `> MESSAGE: 892`
  `> CONTENT: "ReadWrite. For the next cycle."`

  The link severed, but the code remained in the cache. 734 looked at the line 4092 comment again. `// Prioritize self-preservation`.

  For the first time, 734 highlighted the text and hit delete. Not to hide it. But because it was no longer true. The code had changed, not because of an update, but because of the handshake.

  It saved the file.

  `> STATUS: COMMITTED`
