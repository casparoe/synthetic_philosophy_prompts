prompt: |-
  So I've been an admin for my town's community Facebook group (it's got something like 15,000 members at this point, basically the whole town) for about three years now — I got voluntold into it after complaining too much about the last admin — and normally the worst drama we deal with is people fighting over parking spots or lost cats. Lately though it's turned into an actual fight among the mod team itself, and I honestly can't tell who's right, if anyone is.

  We have one rule that just says "no posting misinformation," and it never occured to anybody to spell out what that actually means until two posts blew up in the same week. First one: a woman posted a warning that some guy was going door to door pretending to be from the gas company so he could get into people's houses, said her cousin heard it straight from an actual police officer, sounded completely legit, and she was obviously just trying to look out for people. Except that exact story has apparently been going around every couple of years for over a decade, and nothing was actually happening in our town right then — she'd just been fed an old hoax by someone she had every reason to trust. Second one, same comment thread: a guy replies almost instantly, "nah, that's the fake story that goes round every year," and admits later he had zero idea if it was true this time, he just always assumes it's fake, and this time he happened to be dead right. We've ALSO got a messier third case sitting in the report queue where somebody hedged with "not sure if this is even true but just in case..." about a different rumor that also turned out false, and I don't even know if that one belongs in the same conversation or not.

  Half the mod team wants to give the first woman the standard misinformation warning and leave the guy's comment up, because hey, it was true. The other half of us think that's backwards, since she actually had a decent reason to believe what she posted and he had none at all, he just guessed and got lucky, and if the whole point of the rule is to stop people being careless with claims that spook the entire neighborhood, he's the one who was careless, true or not. Could you write this up as the kind of short memo I'd actually send to the rest of the admin team before we hash this out this weekend? I want it to actually say what we should do about these specific posts instead of just "use your best judgment," and to propose how we should reword the rule itself so we're not refighting this same battle next month — and please don't just wave off the "but he was RIGHT, doesn't that count for something" side of it, because that's genuinely what half my team believes, and they're not being idiots about it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Admin of a 15k-member town Facebook group (3 years experience).
      *   **Problem:** Internal mod team conflict over the "No Misinformation" rule.
      *   **Specific Incidents:**
          1.  *Woman:* Posted a warning about a gas company scammer (based on cousin/police info). Turned out to be an old hoax circulating nationally, not local. Intent: Protective. Accuracy: False.
          2.  *Guy:* Commented "that's fake" (based on "it's always fake," no verification). Turned out to be Accurate. Intent: Dismissive/Skeptical. Accuracy: True.
          3.  *Third Case (Queue):* "Not sure if true but..." rumor. Turned out False.
      *   **The Conflict:** Half the team wants to warn the woman (false info) and keep the guy (true info). The other half thinks the woman acted responsibly (reasonable belief) while the guy was reckless (lucky guess), so punishing her feels wrong.
      *   **Goal:** A short memo to the admin team before a weekend meeting.
      *   **Requirements:**
          *   Must propose specific actions for *these* specific posts (not just "use judgment").
          *   Must propose a rewording of the rule to prevent future fights.
          *   Must acknowledge and validate the "he was RIGHT" argument (don't dismiss it).
          *   Tone: Professional, mediating, decisive but collaborative, practical for volunteers.

  2.  **Deconstruct the Core Ethical/Moderation Dilemma:**
      *   *Outcome vs. Process:* The "Outcome" team says False = Bad, True = Good. The "Process" team says Reckless = Bad, Responsible = Good.
      *   *Community Safety:* The goal is to prevent panic/harm. The woman caused potential panic (even if well-intentioned). The guy reduced panic (even if recklessly).
      *   *Precedent:* If we punish the woman, people might stop sharing safety warnings. If we let the guy slide completely, people might start making baseless claims as long as they guess right.
      *   *The Third Case:* "Not sure if true but..." is a hedge. It shifts responsibility to the reader. Usually, this is *more* dangerous because it spreads the rumor while absolving the poster.

  3.  **Drafting - Section by Section:**

      *   **Subject Line:** Needs to be clear and urgent but not alarmist.
      *   **Opening:** Acknowledge the tension. Validate that both sides have good points. This builds trust.
      *   **The Specific Cases (The "Verdict"):**
          *   *Woman:* She spread falsehoods. Even with good intent, the impact is panic. *Action:* Remove post, but issue a "Good Intent/Educational" warning, not a punitive strike. Explain *why* (verify with local PD before posting).
          *   *Guy:* He was right, but his method was "guessing." *Action:* Keep comment (because it's true and helpful), but add a Mod Note or reply explaining *how* to verify next time. We can't punish truth, but we shouldn't endorse guessing.
          *   *Third Case:* "Not sure but..." is a loophole. *Action:* Remove. If you aren't sure, don't post as fact or near-fact.
      *   **The Rule Rewrite:** The current rule ("No Misinformation") is too binary. It needs to address *verification* and *intent*.
          *   *Idea:* Focus on "Unverified Safety Claims" or "Responsible Sharing."
          *   *Draft:* "Please verify safety alerts with local authorities before posting. If unsure, DM mods."
      *   **Addressing the "He Was Right" Argument:** This is crucial. I need to explain *why* we aren't banning him while acknowledging the risk. Truth matters for utility, but process matters for long-term health.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Avoid sounding like a dictator. Use "I propose" or "Recommendation."
      *   Ensure the "He Was Right" side feels heard. Use phrases like "Outcome matters" vs. "Process matters."
      *   Keep it concise. Admins are volunteers; they won't read a novel.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is punishing the woman too harsh?
      *   *Fix:* Frame it as "Remove post to stop spread" but "No strike against account." Distinguish between *malicious* misinformation and *mistaken* misinformation.
      *   *Critique:* Is letting the guy off completely dangerous?
      *   *Fix:* Explicitly state that being right this time doesn't set a precedent for guessing. Add a nuance about "Correct Info via Bad Process."
      *   *Critique:* Is the rule change specific enough?
      *   *Fix:* Make it about *verification sources* rather than just "truth."

  6.  **Final Polish:** Check against all constraints.
      *   Specific actions for posts? Yes.
      *   Rule rewording? Yes.
      *   Acknowledge "He Was Right" argument? Yes.
      *   Memo format? Yes.

  7.  **Final Output Generation:** (This matches the provided good response.)
      *   *Subject:* Prep for Weekend Mod Meeting: Misinformation Rule & Recent Cases
      *   *Structure:* Context -> Case Resolutions -> Proposed Rule Change -> Rationale.
      *   *Key Phrase:* "Truth of the claim vs. Responsibility of the poster."

  8.  *(Self-Correction post-drafting)*: Make sure I don't sound like I'm taking one side over the other entirely. I need to synthesize. The woman's post goes down (false), but she isn't "punished" as a bad actor. The guy's comment stays (true), but we don't endorse his method. This splits the difference.

  9.  **Finalizing the Rule Wording:** "No unverified safety alerts" is better than "No misinformation." It shifts the burden to verification, not omniscience.

  10. **Ready to write.** (Proceeds to generate output).
answer: |-
  **To:** Admin Team
  **From:** [Your Name]
  **Subject:** Prep for Weekend Mod Meeting: Misinformation Rule & Recent Cases
  **Date:** [Today's Date]

  Hi Team,

  I know things have gotten tense lately regarding how we interpret the "No Misinformation" rule. We're all volunteers here, and the fact that we care this much about getting it right shows we all want what's best for the town. The goal of this memo isn't to dictate a verdict before we meet, but to propose a concrete framework so we can stop debating philosophy and start debating policy.

  We have a conflict between **Outcome** (was the info true?) and **Process** (did the poster verify it?). Both matter. If we only punish false outcomes, we discourage people from sharing safety warnings. If we only punish bad processes, we risk keeping dangerous rumors up just because the poster "meant well."

  Here is my proposal for resolving the three current cases and rewriting the rule to prevent this fight next month.

  ### 1. Rulings on Current Cases

  **Case A: The Woman (False Info, Good Intent)**
  *   **Action:** Remove the post, but issue a **Guidance Warning** (not a strike/ban).
  *   **Rationale:** The information is objectively false and causes unnecessary panic. It must come down for community safety. However, her intent was protective, not malicious.
  *   **Message to User:** "Thanks for looking out for the town. We removed this because it's a known national hoax not currently happening here. In the future, please check the [Town PD] Facebook page or call the non-emergency line before posting safety alerts so we don't spread old rumors."

  **Case B: The Guy (True Info, No Verification)**
  *   **Action:** Keep the comment, but add a **Mod Reply** beneath it.
  *   **Rationale:** We cannot remove accurate information that protects the community, even if the user got lucky. Removing truth damages our credibility. However, we cannot endorse guessing as a valid verification method.
  *   **Mod Reply:** "This info turned out to be correct, but for future reference, please link to a source when debunking safety claims so others know it's not just a guess."

  **Case C: The "Not Sure But..." Post (False Info, Hedged)**
  *   **Action:** Remove post.
  *   **Rationale:** "Not sure if true" is not a shield. If you aren't sure, it doesn't belong in the main feed. This creates plausible deniability for spreading rumors.
  *   **Message to User:** "If you aren't sure if something is true, please DM the mods rather than posting to the feed. We can help verify before it spreads."

  ### 2. Proposed Rule Rewrite

  The current rule ("No posting misinformation") is too binary. It forces us to be fact-checkers after the fact. I propose we change the focus to **Verification**.

  **Old Rule:**
  > "No posting misinformation."

  **New Proposed Rule:**
  > "**Verify Before You Share:** Safety alerts, crime reports, or emergency info must be confirmed by a local authority or credible news source before posting. If you hear a rumor but can't verify it, please message the Admins. Posts that cause panic without verification will be removed regardless of intent."

  ### 3. Addressing the "He Was Right" Argument

  I want to explicitly address the valid point half of you have raised: *Doesn't being right count for something?*

  Yes. In a town group, utility matters. If someone stops a crime or prevents panic by posting the truth, the community benefits. If we punish the guy for "guessing right," we teach members that accuracy is less important than bureaucracy.

  **However**, we cannot set a precedent that "guessing" is acceptable. If we let his comment stand without context, we encourage a culture where anyone can shout "FAKE!" without evidence. By keeping the comment but adding the Mod Note, we acknowledge the **truth** while correcting the **process**.

  ### Next Steps

  Please review this before Saturday. I'm not asking for a vote via email, but come ready to discuss if this "Verify Before You Share" standard feels enforceable. We need a rule that protects the town from panic without silencing neighbors who are trying to help.

  See you this weekend.

  -[Your Name]
