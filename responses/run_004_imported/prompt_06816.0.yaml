answer: |-
  The rain hammered against the reinforced glass of the control tower, a rhythmic static that usually soothed Elias. Tonight, it sounded like counting. One beat, another beat, an endless sum that refused to resolve.

  On the main monitor, the flood map glowed in sickly amber. The levee had held above, but the runoff had surged into the lower service tunnels. Two sectors were trapped. Sector 4 held a maintenance crew of five. Sector 9 held a single security officer, pinned by a collapsed bulkhead.

  The water was rising at a steady rate. Both sectors would drown within the hour.

  Elias had one override code. It could activate the emergency pumps for one sector only. The hydraulic pressure was insufficient to drain both; trying to split the flow would save neither. He had to choose. Sector 4 or Sector 9. Five lives or one.

  His hand hovered over the keypad. The utilitarian calculus was immediate, visceral, and heavy as stone. Five is greater than one. To save the five was to minimize the loss. It was the arithmetic of triage, the logic of the battlefield. If he chose Sector 9, he would be answering to the ghosts of four extra people. He could hear the headline already: *Operator Sacrifices Five to Save One.*

  He closed his eyes. But another voice, quieter and stranger, whispered from the back of his mind. It asked a question that felt like a glitch in the moral software.

  *Who experiences the loss?*

  If he saved Sector 4, the officer in Sector 9 would die. He would lose his future, his breath, his consciousness. It would be a total catastrophe for him. If he saved Sector 9, the five in Sector 4 would die. Each of them would lose their future, their breath, their consciousness. For each individual, the catastrophe would be total.

  There was no single vessel containing "five lives." There was no super-person who would feel the pain of five deaths aggregated into one great sorrow. There were only five distinct universes ending, and one distinct universe ending. Was the sum of five endings objectively heavier than the sum of one? Or was that just a trick of accounting, adding apples that refused to be piled together?

  Elias opened his eyes. The red dots on the screen blinked in silence. They did not know they were being weighed.

  If he chose the five because they were five, he was treating the group as a entity greater than its parts. He was saying that the majority claim outweighed the individual claim of the one. But the one had a claim just as absolute as any of the five. To ignore that claim because he was outnumbered felt like a violation of something fundamental. It felt like telling the single man that his life was worth one-fifth of the others.

  Elias reached into his pocket. He pulled out a coin, a worn quarter from before the currency reforms. It was cold in his palm.

  Taurek's ghost seemed to stand behind him in the dim room. *Give them all an equal chance.*

  If he flipped the coin, heads for Sector 4, tails for Sector 9, he was refusing to let the numbers decide. He was acknowledging that he had no right to aggregate the losses. He was admitting that from his vantage point, he could not see a "greater good," only distinct individuals facing the same dark wall. A coin flip would give the single officer a fifty percent chance. It would give the crew of five a fifty percent chance. It was fair to the groups, even if it wasn't equal for every individual body.

  But was it fair to the dead?

  If the coin landed on tails, and the five drowned, could he stand before their families and say, "I gave them a chance"? Or would they say, "You had the power to save us, and you gambled"?

  The rain intensified. The water level indicator for Sector 4 ticked up. Critical.

  Elias looked at the coin. He looked at the keypad.

  The instinct to save the many was a biological imperative, deep in the marrow. It was the logic of the herd, the pack, the species. To ignore it felt like madness. It felt like choosing chaos over order. But the logic of the herd relied on the idea that the group was the unit of value. What if the individual was the only unit that mattered?

  If he saved the five, he was using the one man as a means to the end of maximizing survival. He was sacrificing the one for the sake of the math. If he flipped the coin, he was respecting the separateness of persons, acknowledging that no one's life could be traded away simply because there were more of the others.

  His thumb flicked the coin. It spun into the air, catching the amber light of the monitor. A flash of silver, a blur of motion.

  For a second, the coin hung at the apex of its arc, suspended between the gravity of the numbers and the weight of the individual. In that moment, the five were not five, and the one was not one. They were just lives, hanging in the balance, waiting to see if the universe cared about arithmetic.

  Elias watched it fall. He did not catch it. He let it hit the console with a sharp clatter.

  He looked down at the result. He looked back at the screen. The water in Sector 4 was rising faster now. The red light pulsed, urgent, demanding the obvious answer.

  Elias placed his hand on the keypad. His fingers trembled, not from fatigue, but from the terrible lightness of the choice. He realized then that the coin hadn't decided anything. It had only shifted the burden. Whether he followed the math or the flip, he was the one who would have to carry the silence of the ones who weren't chosen.

  The rain continued to count against the glass. Elias took a breath, closed his eyes, and pressed the key.
