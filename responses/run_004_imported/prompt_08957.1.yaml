answer: |-
  The fire in the Senior Common Room had burned down to embers, but the air remained thick with the scent of stale tobacco and anticipation. Outside, the bell tower tolled the quarter-hour. Congregation would be called soon.

  Cecily stood by the window, her back to the room. Richard poured two sherries, the glass clinking softly against the decanter.

  "You've distributed the pamphlet, then," he said, handing her a glass.

  "It needed saying," Cecily replied, turning. She didn't take the drink. "Someone had to state the proposition clearly before you all vote to honour a man who ordered the indiscriminate slaughter of civilians."

  "Indiscriminate?" Richard took a sip, leaning against the mantel. "Or strategic? The Japanese war machine was housed in those cities. The morale of the population was a legitimate military target in a total war."

  "There it is," she said, her voice quiet but sharp as a scalpel. "You've conflated the target with the method. If I bomb a munitions factory and workers nearby die, I foresee their death. I do not intend it. Their death is no part of my success; indeed, it would be better if they lived. But Truman's bombs… the destruction of the civilians *was* the mechanism of success. Their deaths were the means to the surrender. That is murder, Richard. Not regrettable collateral. Murder."

  Richard set his glass down. "You rely heavily on this distinction between intending and foreseeing. But morality isn't just about the purity of your own hands. It's about the world you leave behind. If refusing to use the bomb meant the war continued for another year, if it meant the Soviet invasion of Japan, if it meant hundreds of thousands more dead from starvation and conventional bombing… does your principle account for those bodies?"

  "My principle accounts for justice," Cecily said. "Yours accounts for arithmetic. You are suggesting that because the outcome was favourable, the act itself becomes good. That is a corrupt way of thinking. It suggests there is no action so vile that it cannot be washed clean by a sufficient quantity of 'good results.' If that is true, then morality has no content."

  "And if ignoring the results leads to greater evil?" Richard pushed off the mantel, stepping into the light. "Suppose I know that if I do not kill one innocent person, a tyrant will kill a thousand. You would stand by and let the thousand die to keep your own conscience unstained. Is that not also a choice? Is the blood on your hands not wetter if you had the power to stop it and chose your own purity instead?"

  "I am not choosing their death," she snapped, the composure cracking for a fraction of a second. "The tyrant is. But if I kill the innocent myself, *I* become the murderer. We are responsible for our own acts, Richard, not for the acts of others. To claim otherwise is to claim ownership of the future we cannot know. How do you know the war would have lasted another year? It is a hypothesis used to justify a certainty."

  "And how do you know the civilians were not a legitimate target?" he countered. "In 1945, the distinction between the Japanese soldier and the Japanese citizen who manufactures his shells and refuses to surrender had vanished. The bomb was not aimed at children. It was aimed at the capacity to wage war. The fact that children died is a tragedy, but does it make the degree an honour we cannot grant? We are honouring the end of the war, Cecily. Not every specific tactical decision."

  "You cannot honour the end while sanctifying the means," she said, picking up her gloves. "If we give him this degree, we are telling the world that Oxford believes there are circumstances where the innocent may be deliberately destroyed for the common good. We are teaching that lesson to the next generation of statesmen. What do you suppose they will do with it?"

  Richard looked at the fire, then back at her. "I suppose they will learn that leadership requires carrying the weight of terrible choices so that others don't have to. But I hear you, Cecily. I hear the warning."

  "The vote is in ten minutes," she said.

  "I know," Richard said, picking up his glass again. "And I shall vote yes. Not because I think he was flawless. But because I think a world without him might have been worse."

  "Then we shall sit on opposite benches," she said, opening the door. "And pray that one of us is wrong."

  "God knows," Richard murmured to the empty room, "one of us must be."
