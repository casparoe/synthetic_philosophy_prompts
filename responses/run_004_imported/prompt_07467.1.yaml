      *   **The Dualist Challenge (Adams):** Explain Adams' Thesis. $P(A \rightarrow C) = P(C|A)$. Explain why this fits the indicative well. Explain the cost: Triviality (Lewis). If indicatives have truth conditions, probability collapses. So Dualists say: No truth conditions.
