          *   Weigh Stalnaker's unified approach (selection functions, context sets) vs. the dualist approach (Adams' Thesis/Probabilistic for indicatives vs. Truth-Conditional/Similarity for counterfactuals).
          *   Address Triviality Results (Lewis) regarding truth conditions for indicatives.
          *   Address Embedding/Nesting problems for non-truth-conditional accounts.
          *   **Crucial:** End with an *actual verdict* on whether unification is achievable. No fence-sitting.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Data:** The "Oswald sentences" (often attributed to Quine or Adams) are the classic test case.
          *   Indicative: Past tense, open possibility (at the time of utterance). We know Kennedy was shot. The question is *who*. Given he was shot, if not Oswald, then someone else. True.
          *   Counterfactual: Past perfect, implies Oswald *did* shoot. Speculates on a world where he didn't. In that world, is it necessary someone else did? No, the conspiracy might not have existed. False.
      *   **Stalnaker's Unified Theory (1975/1984):**
          *   Both use a selection function $f(A, w)$.
          *   Difference is pragmatic/contextual.
          *   Indicatives: Search for $A$-worlds within the *context set* (presupposed facts). Since "Kennedy was shot" is in the context set, we look for worlds where Kennedy was shot but Oswald didn't do it. In those worlds, someone else did.
          *   Counterfactuals: Search for $A$-worlds *outside* the context set (closest worlds where presuppositions might fail). We look for worlds where Oswald didn't shoot. We don't hold fixed "Kennedy was shot" as strictly as the indicative case (or rather, we evaluate the causal chain).
          *   *Strength:* Explains the divergence via context, keeps logic unified.
          *   *Weakness:* Requires a sophisticated pragmatics. Does it really handle the truth-value gap?
      *   **The Dualist View (Adams/Edgington vs. Lewis/Stalnaker on Counterfactuals):**
          *   Counterfactuals: Truth-conditional (Similarity semantics).
          *   Indicatives: Assertability conditions (Adams' Thesis: $P(C|A)$). No truth conditions.
          *   *Strength:* Avoids Lewis's Triviality Results (indicatives can't have standard truth conditions that align with conditional probability).
          *   *Weakness:* Embedding problem. "If (if A then B), then C." If "If A then B" has no truth value, how can it be the antecedent of another conditional?
      *   **Triviality Results:** Lewis showed that if $P(A \rightarrow C) = P(C|A)$ for all $A, C$, then probability functions collapse. This suggests indicatives *cannot* have standard truth conditions.
      *   **Embedding:** Non-truth-conditional views struggle with logical connectives applied to conditionals.

