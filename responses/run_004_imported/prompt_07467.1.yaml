answer: |-
  The dispute between you and your friend centers on one of the most famous puzzles in the philosophy of language: the "Oswald sentences." Your intuition is shared by almost every competent speaker of English. The indicative conditional, "If Oswald didn't shoot Kennedy, someone else did," is true. We know Kennedy was shot; if we remove Oswald from the list of shooters while holding fixed the fact of the assassination, the conspiracy implies another agent. The counterfactual, "If Oswald hadn't shot Kennedy, someone else would have," is false. This sentence invites us to imagine a world where Oswald did not shoot; in that world, there is no guarantee the conspiracy existed or that the assassination occurred at all.

  Your friend demands a unified semantics: a single logical mechanism that generates these divergent truth values without positing two different kinds of "if." You suspect that the grammatical mood (indicative vs. subjunctive) marks a deep semantic rift that no single mechanism can bridge. To settle this, we must weigh Robert Stalnaker's unified theory against the dualist tradition stemming from Ernest Adams and David Lewis. We must confront the Triviality Results that haunt truth-conditional accounts of indicatives and the Embedding Problem that cripples non-truth-conditional accounts.

  The verdict, as it stands in contemporary semantics, is this: **Unification is achievable, but not in the way your friend imagines.** Your friend is correct that we need a single semantic core, but wrong that logic should be blind to grammar. You are correct that the truth values diverge, but wrong that this requires two distinct logics. The solution lies in Stalnaker's contextualism, which unifies the semantics while allowing grammatical mood to regulate the domain of evaluation.

  ### The Dualist Impasse: Adams and the Cost of Truth

  The standard dualist view holds that counterfactuals and indicatives are semantic species of different genera. Counterfactuals receive a truth-conditional semantics, typically David Lewis's similarity analysis: a counterfactual $A \boxright C$ is true if $C$ holds in the closest possible worlds where $A$ is true. This handles the second Oswald sentence well. In the closest worlds where Oswald doesn't shoot, the conspiracy likely dissolves, Kennedy isn't shot, and thus "someone else did" is false.

  Indicatives, however, are treated differently. Following Adams, dualists argue that indicative conditionals do not express propositions with truth conditions. Instead, they have *assertability conditions*. The acceptability of "If $A$, then $C$" is governed by Adams' Thesis: the subjective probability of the conditional equals the conditional probability of the consequent given the antecedent, $P(A \rightarrow C) = P(C|A)$.

  This view captures your intuition about the first Oswald sentence. Given that Kennedy was shot ($K$), the probability that someone else did ($S$) given Oswald didn't ($\neg O$) is high. $P(S | \neg O \& K)$ is near 1. Thus, the indicative is assertable.

  However, this dualism comes at a steep price. First, there are the **Triviality Results**. David Lewis proved that if indicative conditionals have standard truth conditions and adhere to Adams' Thesis, probability functions collapse. Essentially, you cannot maintain that conditionals are propositions that are true or false *and* that their probability always matches the conditional probability. Dualists avoid this by denying indicatives have truth conditions.

  But denying truth conditions creates the **Embedding Problem**. Logic requires that sentences can be nested. We can say, "If it is true that if Oswald didn't shoot, someone else did, then there was a conspiracy." If the inner indicative ("If Oswald didn't...") lacks a truth value, it cannot serve as the antecedent for the outer conditional. Dualists struggle to explain the logic of complex sentences involving indicatives without smuggling truth conditions back in. If a semantics cannot handle negation or nesting, it is not a semantics of propositions; it is a semantics of speech acts. This is a fatal flaw for a logic that aims to model reasoning.

  ### Stalnaker's Unified Theory: Context as the Key

  Robert Stalnaker proposed a unified semantics to rescue the truth-conditional approach. He argues that both indicatives and counterfactuals use the same semantic machinery: a selection function $f(A, w)$ that picks out the single world most similar to $w$ where $A$ is true. The conditional is true if $C$ is true in that selected world.

  If the mechanism is identical, why do the Oswald sentences differ? Stalnaker argues the difference is not in the selection function itself, but in the **context set**. The context set is the collection of possible worlds compatible with the presuppositions of the conversation.

  1.  **Indicatives:** When we evaluate an indicative, we restrict the selection function to search *within* the context set. In a conversation about the Kennedy assassination, it is a presupposed fact that Kennedy was shot. The context set contains only worlds where Kennedy was shot. When we evaluate "If Oswald didn't shoot," we look for the closest world *in the context set* where Oswald didn't shoot. Since all worlds in the set feature a successful assassination, the selected world must be one where someone else did it. The sentence comes out true.
  2.  **Counterfactuals:** When we evaluate a counterfactual, we allow the selection function to reach *outside* the context set. We relax the presuppositions. We look for the closest world *simpliciter* where Oswald didn't shoot, even if that world violates the presupposition that Kennedy was shot. In that world, the assassination may not have happened. The sentence comes out false.

  This unified approach solves the Oswald puzzle without positing two different logics. It also solves the Embedding Problem. Because Stalnaker retains truth conditions for indicatives, they can be negated, disjoined, or nested just like any other proposition. "If (if A then B), then C" is perfectly coherent because "If A then B" denotes a proposition.

  ### Weighing the Costs: Triviality vs. Context Sensitivity

  Your friend insists logic must be blind to grammar. Stalnaker's view refines this: logic is blind to grammar, but *semantics* is sensitive to it. The grammatical mood acts as an indexical, signaling whether the context set constrains the selection function. This is not a fracture in the logic, but a parameter in the semantics.

  However, Stalnaker must still face Lewis's Triviality Results. If indicatives have truth conditions, how do we avoid the collapse of probability? Stalnaker's response is to deny that the probability of the conditional proposition is always equal to the conditional probability. He argues that the proposition expressed by an indicative conditional is context-sensitive. As your evidence changes, the context set changes, and thus the proposition expressed by "If $A$, then $C$" changes. This context-dependence blocks the mathematical derivation of the triviality result.

  Is this cost too high? It means that indicatives do not express the same proposition across different epistemic states. But this is arguably a feature, not a bug. It explains why we cannot validly infer "If $A$, then $C$" from premises that are true in worlds we know to be actual but which are excluded from the context set.

  Comparing the costs:
  *   **Dualism (Adams):** Saves Adams' Thesis and intuitive probabilities but loses truth conditions, making logical embedding impossible. It fractures the logic of conditionals into two incommensurable systems.
  *   **Unification (Stalnaker):** Saves truth conditions and logical unity but requires accepting that the proposition expressed by an indicative shifts with the context set (violating a strict reading of Adams' Thesis in limit cases).

  The embedding problem is the heavier burden. A logic that cannot nest its own operators is fundamentally incomplete. We *do* reason with nested conditionals. Therefore, any adequate semantics must provide truth conditions for indicatives. This rules out the strict Adams/Dualist view.

  ### The Verdict

  The debate between you and your friend can be settled with a qualified victory for your friend, provided she abandons the claim that logic must be "blind to grammar."

  **Unification is achievable.** The Stalnakerian framework demonstrates that a single semantic mechanism (the selection function) can account for the divergent truth values of the Oswald sentences. The divergence arises not from a difference in logical form, but from a difference in the domain of quantification governed by grammatical mood. The indicative mood signals: *hold the context set fixed.* The subjunctive mood signals: *relax the context set.*

  However, your intuition that the sentences differ in truth value is the anchor that keeps the theory honest. Any unified theory that predicts they have the same truth value is empirically false. Stalnaker's theory succeeds precisely because it uses the context set to preserve the truth of the indicative while allowing the falsity of the counterfactual.

  Therefore, the verdict is as follows: **A unified semantics is necessary and possible, but it must be a contextualist unification.** Your friend is right that we should not posit two distinct logical operators for "if." But you are right that the grammatical mood is semantically significant. The mood is not decorative; it is a functional operator that adjusts the context set.

  To adopt the Dualist view is to surrender the possibility of a general logic of conditionals, sacrificing embeddability for probabilistic intuition. To adopt a rigid Unified view that ignores mood is to surrender empirical accuracy. Stalnaker's contextualism is the only path that preserves the unity of logic, the embeddability of conditionals, and the divergent truth values of the Oswald sentences. The semantics is not what has gone wrong; the expectation that grammar is irrelevant to semantic parameters is what must be discarded. Unification holds, but it is a unification built on the bedrock of context.
