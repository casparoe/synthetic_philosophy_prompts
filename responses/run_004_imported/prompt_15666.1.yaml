answer: |-
  Ramsey would have read Lewis's triviality result not as a crisis for probability, but as a *reductio ad absurdum* of the assumption that indicative conditionals express propositions. He would have happily joined Adams and Edgington, but his defense would have been metaphysically heavier than theirs.

  The crux is Lewis's starting assumption: that there exists a proposition $A \to C$ whose truth value can be plugged into the standard axioms of probability (specifically the Law of Total Probability). Ramsey's operationalism in "Truth and Probability" renders this assumption incoherent. For Ramsey, a degree of belief is defined by a betting quotient. But you cannot place a standard bet on a conditional. You can place a *conditional bet* (which is off if the antecedent is false), but that is structurally distinct from betting on the truth of a proposition. If the antecedent is false, a standard proposition is either true or false (vacuously); a conditional bet is simply void. This operational difference signals that the conditional isn't mapping onto a fact in the world.

  This aligns perfectly with "Facts and Propositions," where Ramsey argues that the function of a judgment is not always to picture a fact. Some judgments, particularly generalizations and conditionals, are "variable hypotheticals"—rules or habits for navigating the world, not descriptions of it. If a sentence doesn't picture a fact, it lacks a truth condition in the robust sense required for Lewis's proof.

  Consequently, Ramsey would argue that Lewis mathematically demonstrated what Ramsey already knew metaphysically: you cannot force a rule of inference into the logical shape of a fact without breaking the probability calculus. Lewis showed that if you treat conditionals as truth-apt, probability collapses. Ramsey would say this proves they *aren't* truth-apt. He wouldn't see Lewis's result as a limit on how we model belief, but as a vindication of the redundancy theory applied to conditionals. To say "It is true that if $p$ then $q$" adds nothing beyond the commitment to infer $q$ from $p$. Lewis proved that treating that commitment as a fact leads to triviality. Ramsey would have smiled, tucked the paper away, and noted that the "problem" only exists if you insist on reifying inference rules into worldly facts.
