      *   *Okay, that's 10.* Let's write them out clearly.

  6.  **Final Polish of Follow-ups:**
      *   *News:* She'll say "We use causal counterfactuals." Counter: "Causal models are learned. What if the learned causal graph is wrong?"
      *   *Subagents:* She'll say "The objective penalizes unsafe subagents." Counter: "How do you compute that penalty for opaque subagents?"
      *   *Stability:* She'll say "It maximizes ex-ante utility." Counter: "What about post-modification incentives?"

      *(Self-Correction)*: Keep the follow-ups concise and punchy for a podcast format.

