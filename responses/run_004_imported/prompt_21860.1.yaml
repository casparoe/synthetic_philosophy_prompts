answer: |-
  First, I am so sorry you had to go through six years of dismissal, but I am glad you finally have a diagnosis and a name for what you are dealing with. It is completely understandable that you want to be precise with language, especially when it comes to describing something that caused you so much harm.

  To answer your question directly: **No, you are not misusing the term.** Your friend was right to send you Fricker, and your situation is actually a textbook example of testimonial injustice.

  Here is the breakdown of why your intuition about "conscious prejudice" is the only thing tripping you up, and why Fricker's framework still applies perfectly to a "nice" doctor.

  ### 1. Prejudice does not require conscious malice
  You wrote: *"I assumed the whole point of calling it 'prejudice' is that the person has to actually, consciously think less of you for being a woman."*

  In social epistemology (the field Fricker writes in), this is the most common misconception about bias. Testimonial injustice relies on **identity prejudice**, but that prejudice is often **implicit** and **structural**, not conscious.

  Fricker argues that we all inherit "social imaginaries"—collections of stereotypes and associations that exist in our culture. In medicine, there is a well-documented historical stereotype that women are "hysterical," "emotional," or "exaggerate pain." A doctor can be a genuinely kind, sweet person who wants to help, yet still operate under the unconscious influence of these stereotypes.

  If he listened to a male patient describe the same level of pain and ordered scans immediately, but listened to you and assumed it was "stress," he assigned you a **credibility deficit** based on your gender. That is the definition of testimonial injustice, regardless of whether he consciously hates women or thinks he is sexist.

  ### 2. Mistake vs. Injustice
  You asked if this was just him being a *"mediocre diagnostician."*

  *   **A Medical Mistake:** Random, unpredictable, and not correlated with identity. (e.g., He missed a symptom because it was unusually hidden, and he would have missed it on a man, too.)
  *   **An Injustice:** Systematic and correlated with identity.

  Endometriosis is not a rare edge case; it is a common condition where the average diagnosis time is 7–10 years. Studies consistently show that women's pain is taken less seriously than men's pain, and women of color face even longer delays. Because this dismissal is a **pattern** tied to your identity (gender), it moves from being an individual error to a structural injustice.

  Fricker's point is that the *harm* comes from being wronged in your capacity as a knower. You knew your body was wrong. He had the power to validate that knowledge. When he dismissed you as "just periods," he didn't just make a clinical error; he silenced your testimony because of who you are.

  ### 3. The "Nice Guy" Paradox
  It is very possible for someone to be interpersonally kind but structurally biased. In fact, testimonial injustice is often *more* damaging when it comes from a "nice" authority figure, because it makes you doubt yourself.

  If he had been overtly sexist, you could have easily said, "He's a jerk, I'm leaving." But because he was sweet, the message you internalized was likely, "He's a nice expert, so if he says it's stress, maybe it *is* just stress. Maybe I am being dramatic." That internalized doubt is a specific harm Fricker describes.

  ### 4. A Bonus Term: Hermeneutical Injustice
  Since you are reading Fricker, there is a second concept that might also resonate: **Hermeneutical Injustice.**

  This happens when there is a gap in our collective understanding that prevents you from making sense of your own experience.
  *   **Testimonial:** He didn't believe *you*.
  *   **Hermeneutical:** The medical community didn't have enough *knowledge* about endo to understand you.

  For decades, medical research has underfunded women's health issues. Because the "concepts" to understand endo were missing from the general medical toolkit, you were left without the resources to explain your pain. This isn't your fault or even necessarily your specific doctor's fault; it is a gap in the system. However, his failure to listen to your testimony (Testimonial Injustice) kept you stuck in that gap for six years.

  ### Summary
  You are using the term correctly.
  *   **Testimonial Injustice** occurs when you are given less credibility than you deserve due to identity prejudice.
  *   **Prejudice** can be unconscious, implicit, and cultural; it does not require conscious sexism.
  *   **Kindness** does not immunize someone from participating in biased systems.

  It is validating to realize that your experience wasn't just "bad luck" or "your fault" for not explaining it better. It was a recognized philosophical and sociological phenomenon. You were wronged as a knower, and naming that is a powerful part of reclaiming your authority over your own body.

  Congratulations on the diagnosis, and trust yourself moving forward. You were right all along.
