prompt: |-
  quick bit of context - i just got diagnosed with endometriosis after almost 6 years of doctors telling me the pain was probably just bad periods or stress. a friend doing a phil grad program sent me miranda fricker's stuff on testimonial injustice bc she said it basically describes what happened to me, which felt wierdly validating, but i want to make sure im using the term right before i start repeating it to people. my ob-gyn for most of those years was honestly a really sweet guy, never said anything remotely sexist to my face, and i genuinely dont think he sees himself as biased at all. doesnt that mean this wasnt actually testimonial injustice, just him being a mediocre diagnostician? i assumed the whole point of calling it "prejudice" is that the person has to actually, consciously think less of you for being a woman - and if hes not consciously sexist then it's just a regular medical mistake, not an "injustice" in fricker's sense. am i misusing the term?
