          *   DNA is a *replicator* (copies with fidelity). Cytoplasm is an *interactor* (reconstructed every generation).
          *   This functional difference justifies the "code" label. It's about *transmission*, not just *construction*.
      *   **Body Paragraph 4: Addressing the "Metaphor" Claim:**
