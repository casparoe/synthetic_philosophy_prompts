      *   **Scripting:** Give the user words to say to the brother.
      *   **The "Family" Aspect:** Address the pressure of family expectations.

  6.  **Refining the Tone:**
      *   Empathetic but firm.
      *   Intellectual but accessible.
      *   Avoid taking sides, but validate the user's instinct that this is premature.
      *   *Self-Correction during drafting:* I initially thought about suggesting a mediator. But maybe that's too escalatory. Let's start with the realtor as the buffer. Also, need to make sure I don't sound like I'm diagnosing the brother, just analyzing the behavior.

  7.  **Key Insight to Highlight:** The brother's public commitment is a trap *for him*, not just the user. If the house doesn't sell, *he* looks bad too. The user doesn't need to fight him; they need to help him see the exit ramp.

  8.  **Final Polish:** Check for clarity and ensure the "philosophy teacher" angle is respected without being pretentious. (e.g., mentioning "precommitment strategy" or "sunk cost").

  **(Self-Correction Note):** Make sure to emphasize that the user shouldn't set a counter-floor. That's the specific trap they asked about.

