prompt: |-
  My brother and I are trying to sell our late mom's house and split what we get for it, and it's turned into a weird standoff. Before we'd even picked a realtor or looked at comps, he announced — to me, his wife, and the realtor — that $340k is his absolute floor, no negotiating past it, and that he's already told people so theres no backing out now. Everyone in my family assumes that because I teach philosophy I must have some wise take on this, but honestly I'm stumped. Half of me wants to fire back with my own unmovable number before either of us has actually done the homework, just so I'm not the only "reasonable" one left standing. Is he playing this smart, or are we about to torch the deal for both of us?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Parties:** User (philosophy teacher, likely values reason/fairness) vs. Brother (emotional/strategic, possibly impulsive or anxious).
      *   **Asset:** Late mom's house.
      *   **Goal:** Sell house, split proceeds.
      *   **Conflict:** Brother set an arbitrary "floor" price ($340k) *before* market analysis (comps, realtor input) and announced it publicly (wife, realtor, family). He claims "no backing out."
      *   **User's Dilemma:** Feels pressured to set a counter-floor to avoid looking weak/"too reasonable," but knows it's premature.
      *   **Underlying Dynamics:** Grief, inheritance stress, sibling rivalry, financial anxiety, public commitment bias.
      *   **User's Expertise:** Philosophy (implies critical thinking, ethics, logic, but currently feeling "stumped").

  2.  **Evaluate the Brother's Move:**
      *   *Is it smart?* No. It's a classic negotiation blunder (anchoring without data) mixed with emotional decision-making.
      *   *Risks:* If the market value is below $340k, the house sits. Carrying costs (taxes, utilities, maintenance) eat into equity. Price drops later look desperate. If the market is above, it might sell, but the rigidity creates friction.
      *   *Motivation:* Why did he do this? Fear of getting low-balled? Need for control during grief? Proving something to family? Cash flow urgency?

  3.  **Evaluate the User's Impulse:**
      *   *Impulse:* Set a counter-floor to save face.
      *   *Risk:* Escalation. Now it's a contest of wills, not a sale. If both dig in, the house doesn't sell.
      *   *Better Approach:* De-escalate, reframe, focus on shared goals.

  4.  **Formulate the Advice (Philosophical & Practical):**
      *   *Philosophical Angle:* Use the user's background. Stoicism (control what you can), Game Theory (non-zero-sum), Ethics (fiduciary duty to the estate).
      *   *Practical Angle:* Real estate mechanics, carrying costs, market reality.
      *   *Relational Angle:* Sibling dynamics, grief, family perception.

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the difficulty. It's not just business; it's grief + money.
      *   **Direct Answer:** Is he playing it smart? No. It's a high-risk move.
      *   **The "Philosophy" Take:** Since the user teaches philosophy, speak that language.
          *   *The Socratic Method:* Ask questions rather than making statements.
          *   *Stoicism:* Focus on the goal (net proceeds), not the ego (winning the argument).
          *   *Game Theory:* This isn't Prisoner's Dilemma; it's a cooperative game against the market.
      *   **The Real Estate Reality:** Explain *why* the $340k floor is dangerous (carrying costs, stigma of stale listing).
      *   **Actionable Strategy:**
          *   Don't set a counter-number.
          *   Align on the *process*, not the *price*.
          *   Bring in the neutral third party (the realtor) as the authority.
